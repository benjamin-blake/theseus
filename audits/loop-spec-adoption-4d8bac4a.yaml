        acknowledged; rec-3131->3328 survives that reading.
      change_type: enforce
      proposed_change: >-
        P4-amended leg 2: portal/rec-autoclose closure gate -- an escape-classified rec cannot
        reach closed without naming its landed permanent artifact (pytest node, fixture,
        registered check, or graduation shard id); back_validation upgrades from file-match
