    - id: LSA-03
      surface: S6
      question: Q4
      dimension: VD3
      candidate: C2
      title: "No mechanism, built or planned, demonstrates detection for the registered check fleet itself: red-case evidence exists only for graduated shards and by unenforced mirror-test convention"
      evidence: "scripts/checks/verification/validate_verification_registry.py (differential gate: graduated-shard population only); docs/ROADMAP-PLATFORM.yaml T3.7 (deferred_post_mvp; mutation aimed at graduated checks' guarded lines; prior audit records it NOT on the CD.17 reversal path); scripts/checks/registry.py:10-22 (mirror test is a registration surface with no red-case obligation); Decision 170 (proves EXAMINED, not DETECTS)"
