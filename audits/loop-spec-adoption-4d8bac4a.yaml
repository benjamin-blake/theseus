audit:
  meta:
    audited_commit: 4d8bac4a
    base_branch: main
    model: "Claude (Anthropic); exact model id withheld from repo artifacts per harness policy"
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5, S6, S7, S8]
    degraded_dedup: false
    contract_notes: "SETUP: all five steps succeeded on the first path (fetch, branch cut, venv, preflight cache-gen); no degraded path taken; DD-C: recs-cache path taken -- 35 escape-classified recs qualify, three most recent traced (rec-3292, rec-3293, rec-3328); M5: ran the single check validate_pre_glob_closure directly (registry.resolve, not a tier) to measure the advisory backlog -- no scripts.validate or tier run was performed; M5: budget evidence re-derived from this session's own preflight: budget_breach_summary count 4 (all pytest_diff) and budget_bypass_alert count 8 over 7 days, vs compose-time 8/8"
    stale_anchors:
      - "compose-time '472 depth-1 shards' in config/agent/verification_registry/entries/ -- 475 depth-1 shards resolve now (plus 3 under entries/deprecated/)"
      - ".claude/skills/implement/SKILL.md:110-112 (bounded fix loop) -- the 3-fix-attempt / non-empty-diff / two-consecutive-passes text now sits at ~:105-108"
      - "docs/PROJECT_CONTEXT.md:29 (closed-improvement-loop end state) -- that list item now sits at ~:31"
  question_answers:
    - q: Q1
      verdict: insufficient
      basis: [LSA-01, LSA-04]
      prose: >-
        (a) Goal-as-predicate largely HOLDS: the fast tier has exactly one design budget
        (_FAST_TIER_BUDGET_SECONDS = 300, scripts/validate.py:69) with a derived forced-run
        ceiling (Decision 153), fail-closed selection (_should_run_in_pre, validate.py:113-124,
        "never silently skip on doubt"), strictly-additive four-channel selection (Decision 135),
        and Decision 170 five-outcome accounting; constraints are oracle-backed registered checks.
        Caveat: pre_globs input declarations under-cover measured closures on 39/46 gated checks
        (LSA-06), compensated in layers. (c) Backstop-with-attribution HOLDS and is the system's
        strongest property: full tier on main plus Main Canary, CI-RCA with Decision 135
        escape-attribution (35 escape-classified recs observed in the cache, all carrying
        escape_class values), evidence bundles (vacuous_pass, coverage_regression), and the
        credential-free-CI budget gap closed by the convergence-health warehouse ingest leg.
        (b) Optimizer/oracle separation is MATERIALLY REDUCED: DD-B finds three weakening moves
        that land with no gate, no marker, and no post-hoc detector (pre-flag flip on ~78 unpinned
        entries, mirror-test deletion, sensor-schedule removal), the pinning tests themselves are
        same-PR-editable with no marker, and the only same-PR guard scans the retired, empty
        scripts/verifiers/ population (LSA-01). (d) Permanent ratchet is MATERIALLY REDUCED with
        observed evidence: escape-to-fixture conversion is author convention; rec-3131's claimed
        preventive --pre check does not exist in scripts/checks/iam_tf/ and the class recurred as
        rec-3328 (same fingerprint); the CI-RCA evidence-truncation class recurred across
        rec-2957/2965/2973/2995/2996 (LSA-04). Two guarantees materially reduced pins the verdict
        at insufficient. Strongest counter-reading: the full tier retains every demoted check and
        the graduation registry ratchets fixes daily (a shard graduated on the audited base date),
        so both reductions degrade future recall and permanence rather than admitting a wrong
        change green today -- a reader weighing that heavily reads Q1 as partial.
    - q: Q2
      verdict: partial
      basis: [LSA-02, LSA-05]
      prose: >-
        Examined: the eight schedule-bearing workflows (main-canary, convergence-health,
        cost-reconciliation, ghas-probe, dedup-probe, ci-rca-inactivity-sweep,
        dependabot-stranded, codeql), the standing event-triggered fleet (ci-rca, rec-autoclose,
        terraform-apply-sandbox, deploy-ducklake-lambdas, deploy-prod-lambdas,
        pr-conflict-signal, dependabot-auto-merge, claude), the dispatch-only standing set
        (terraform-drift with its declared cron disablement, branch-cleanup, reconcile,
        tf-gated-apply-prototype, terraform-provider-mirror-seed), and the inert scheduled-agent
        manifest (.github/agents/schedule.yaml, every entry enabled:false pending T4.12).
        Objectives are findable for effectively all of them (workflow header comments plus the
        ci_rca_taxonomy workflows map's per-row owner and rationale). Backstop routing is
        DECLARED per row for all 22 workflows: watched rows route to CI-RCA; excluded rows'
        rationales name an alternative path (tf_drift portal recs, loud-fail red runs, the
        Decision 62 alarm-not-gate lane) or argue none is needed -- adjudicated row by row, this
        mostly holds. What fails "every examined loop declares": (i) no loop declares a liveness
        backstop for itself -- a silently stopped cron alarms nothing (LSA-02); (ii) stop
        conditions and iteration caps exist everywhere but as scattered literals, declared
        nowhere reviewable (LSA-05); (iii) terraform-drift's disabled cron has a stated
        re-enable condition but no owning item. Mechanical enumerability (P3's premise): YES for
        the workflow population -- proven in production by validate_ci_rca_adjudication's two-way
        name-set equality against .github/workflows/*.yml -- and YES for the agent manifest;
        judgment calls were needed for agent invocations inside workflows (enumerable in practice
        via the claude_p_retry wrapper roster) and for interactive skills (not mechanically
        enumerable; excluded as surfaces per scope).
    - q: Q3
      verdict: see-technique_verdicts
      basis: [LSA-01, LSA-03, LSA-04]
      prose: >-
        Verdicts: P1 reject, P2 reject, P3 reject, P4 adopt-amended, P5 adopt-amended. The
        declaration/enumeration half of the proposal (P1-P3) duplicates three live registers --
        the ci_rca_taxonomy workflows map with its blocking two-way census, the scheduled-agent
        manifest, and the check-manifest/registry pair -- so C5's anti-proposal reading is
        CONFIRMED for those three: extending existing surfaces beats a new Class D contract
        (NS6), and the enumeration P3 promises already exists and blocks. The enforcement half
        survives DD-A with named defect classes the built and planned surfaces provably miss:
        P4-amended (a fleet-wide red-case floor plus an escape-to-fixture closure obligation)
        addresses LSA-03/LSA-04; P5-amended (extending the existing shared marker-guard to tier
        demotion, mirror-test deletion, and sensor-schedule removal) addresses LSA-01/LSA-02's
        gate. Both amendments deliberately reuse existing mechanisms (registry meta-tests, the
        _marker_guard RegistrySpec pattern) rather than land the loop-spec contract they were
        specified against.
    - q: Q4
      verdict: partial
      basis: [LSA-03, LSA-04, LSA-05, LSA-06]
      prose: >-
        One property missed (7, escape ratcheting -- LSA-04, observed), six partial with argued
        property-matched compensating controls, two met. The repository is at or near frontier
        practice on tier split, attribution, anti-vacuity accounting, and budget telemetry; its
        distinctive weakness cluster is permanence and fleet-level verifier change control.
      external_checklist:
        - property: "presubmit/postsubmit tier split with escape attribution"
          rating: met
          evidence: "scripts/validate.py --pre vs full (ci.yml:74-93, :95-173); ci-rca.yml:242-274 fetches the merged PR's selection-manifest for escape_class; 35 escape-classified recs observed in the regenerated cache"
        - property: "test-impact-analysis soundness (additive selection, fail-closed skips, closure auditing)"
          rating: partial
          evidence: "Additive: Decision 135 (selection can only grow; cap defers loudly). Fail-closed: validate.py:113-124. Closure auditing exists but is ADVISORY (wave 4a): observed 39/46 gated checks with uncovered closures, 853 findings, no open owner for the 4b/4c tail (LSA-06). Compensating control: per-domain mirror-test closure supersets and the promoted-roster self-coverage test gate the pinned subset at merge, and the full tier covers everything post-merge."
        - property: "mutation or fault-injection evidence of verifier discrimination"
          rating: partial
          evidence: "Fault-injection evidence is real and enforced for the graduated population: validate_verification_registry runs the fail-on-revert differential for ADDED and MODIFIED shards in --pre (475 depth-1 shards; all 5 sampled shards pass the broken-guard counterfactual). Mutation is designed-unbuilt (T3.7, deferred_post_mvp, alarm-not-gate per CD.12) and the registered 114-check fleet itself has no enforced red-case evidence (LSA-03) -- the compensating control is population-limited, hence partial not met."
        - property: "verifier anti-vacuity accounting"
          rating: met
          evidence: "Decision 170 five-outcome accounting (registry.py:24-36, examined(0) -> vacuous); post-hoc vacuous_pass evidence (scripts/ci_rca/vacuous_pass.py); validate_vacuity_justified as a ratified-narrow fail-closed alarm on the coverage gate"
        - property: "enforced time budgets with breach telemetry reaching a system of record"
          rating: met
          evidence: "300s hard-fail with budget recs (Decision 153: only the self-identified forced-full-suite case warns, bounded by a derived 1500s ceiling); scripts/convergence_health/budget_ingest.py closes the credential-free-CI gap into the warehouse; observed: 4 breaches / 8 bypasses in 7d in this session's preflight report, open rec-3117/rec-3253/rec-2875"
        - property: "flake policy (re-run discipline, quarantine rules, no silent re-run-to-green)"
          rating: partial
          evidence: "Built: fingerprint chain flake-escalation at length 3 -> tag flaky + quarantine (scripts/ops_portal/ci_rca_lifecycle.py), explicit _POSTFLIGHT_VALIDATION_QUARANTINE, and the implement-skill two-consecutive-passes + detected-nondeterminism stop-and-surface rule. Gap: bare re-run-to-green on a VP step remains unaccounted (prior audit VF-08), owned by T3.19 (deferred_post_mvp) -- the compensating chain-escalation control operates on filed CI failures, not interactive re-runs."
        - property: "escape-to-permanent-regression-artifact ratcheting"
          rating: missed
          evidence: "No mechanism obliges a caught escape to become a permanent machine fixture: rec-3131's claimed preventive check absent from scripts/checks/iam_tf/, class recurred as rec-3328 (same fingerprint); truncation class recurred 5x (rec-2957/2965/2973/2995/2996); back_validation.py is deliberately CANDIDATES-only and file-match-only (LSA-04)"
        - property: "two-key change control on verifier weakening"
          rating: partial
          evidence: "Genuine two-key exists on five surfaces (shared _marker_guard, Decision 165 authorization grade -- DD-B move 10 gates as expected) plus census-bound ratchet pins and the modified-shard differential (move 8). Insufficient at fleet level: moves 2/5/7 land single-key and undetected; pinning tests are same-PR-editable; the same-PR guard scans the retired empty scripts/verifiers/ population (LSA-01)."
        - property: "stop-condition and iteration-cap governance for autonomous loops"
          rating: partial
          evidence: "Caps exist on every autonomous loop traced (--max-turns 30 in ci-rca.yml; MAX_TURNS=5 in subagent-plan-review consumed by reconcile + terraform-apply-sandbox; 3-fix-attempt budget and overseer G0/G3 watchdog in skills; job timeout-minutes) and starvation is a detected, classified outcome (subagent_starved; validate_workflow_agent_safety) -- but the caps are undeclared literals reviewed nowhere (LSA-05; prior instances: rec-2658 starvation incident, workflow-review WF-17)."
    - q: Q5
      answers:
        - question: "Should escape-to-fixture conversion be mechanical, or stay rec-mediated per the RCA-first posture (Decision 55/72)?"
          answer: >-
            Keep INTAKE rec-mediated (RCA-first is a deliberate constraint and correctly so:
            sensors surface, never remediate) but make CLOSURE mechanical: a gate_escape /
            source=ci_rca rec should not close without naming a landed permanent artifact (test,
            fixture, check, or graduation-registry shard), enforceable at the portal/rec-autoclose
            closure edge, with back_validation then verifying the artifact held. That preserves
            Decision 55/72 while fixing the observed convention failure (rec-3131 -> rec-3328).
          basis: [LSA-04]
        - question: "Does a monotone ratchet accumulate un-tightenable constraints over time, and what is the principled un-ratchet path?"
          answer: >-
            Yes, the risk is real, and the repo already carries the principled answer in three
            places: decreases/removals are always unrestricted (AGENTS.md SLOC rule;
            contract-population "a decrease always passes"), raises route through a numbered
            Decision naming the governed key (Decision 165 authorization), and retirement is
            mark-then-drop (registry deprecated/ shards; T3.7's equivalent-mutant allowlist
            pattern). Decision 165's own reversal condition (re-audit when the grandfather hook
            grows past a small handful) is the small-grandfather-hook version working as
            designed. Any P4-style fixture ratchet must adopt the same pair: fixture removal
            free with a stated reason, fixture-weakening Decision-gated.
          basis: []
        - question: "Can one PR today both change behavior and weaken the verifier that judges it? Trace what the same-PR guard actually covers."
          answer: >-
            Yes. validate_verifier_same_pr_guard (scripts/checks/verification/
            validate_verifier_same_pr_guard.py:70-139) AST-scans Verifier classes under
            scripts/verifiers/*.py only -- a population that is empty (scripts/verifiers/
            __init__.py REGISTRY = [], legacy fleet retired; only harness.py remains). For the
            live scripts/checks/ fleet there is no same-PR restriction: a PR can edit
            scripts/foo.py and scripts/checks/<domain>/validate_foo.py together, and can also
            edit the mirror test that pins the check's behavior -- the marker guards cover five
            named policy surfaces, not check code or check tests. The guard-shaped hole LSA-01
            names.
          basis: [LSA-01]
        - question: "Where should agentic loops' iteration caps and stop conditions live, if anywhere?"
          answer: >-
            Not in a new contract. Declare them where the loop is already adjudicated -- extend
            config/ci_rca_taxonomy.yaml's workflows rows (or the composite-action manifest
            contract for shared actions) with the cap/stop declaration, derive-and-asserted
            against the live literals the way check-manifest.yaml pins SEGMENT_TOKENS, so
            restatement drift is structurally impossible. Interactive-skill budgets (3-attempt,
            watchdog) stay in their skills: they are prompt semantics, not workflow config.
          basis: [LSA-05]
        - question: "Is 300s still the right fast-tier objective given the observed breach/bypass rate, and which surface owns re-deriving it?"
          answer: >-
            Keep it. Observed pressure (this session's preflight: 4 breaches, 8 bypasses, 7d,
            dominant phase pytest_diff) is being consumed exactly as designed: every non-forced
            breach files a budget rec (open rec-3117/rec-3253), bypasses are logged with reasons
            and alerted, and rec-2875 already names the real cost driver (the differential
            gate's cost tracks the branch registry delta, not the diff). Ownership of the number
            is Decision 60/153 plus the open breach recs feeding /plan -- a working re-derivation
            loop; no new surface is warranted. Raising 300s to relieve pressure would erase the
            forcing signal those recs carry.
          basis: []
        - question: "Do P2 and P4, as NEW verifiers, owe NS3 discrimination evidence for themselves before becoming authoritative -- and what would their own known-bad fixtures be?"
          answer: >-
            Yes, unavoidably -- NS3 is the repo's own ratified bar. P2's fixtures: a synthetic
            loop-spec entry failing each grammar clause (unresolvable oracle, overlapping scope
            globs, restated-not-derived numeric literal), the TestAuditorOnSyntheticRepo pattern
            the closure auditor already uses. P4's fixture is necessarily a meta-fixture: a
            registered check whose mirror test contains no failing path, which P4 must flag --
            P4 judging fixture-parity must itself demonstrate parity. Both would be candidates
            for the differential-admission route (prove red on the synthetic-bad input at
            landing). The proposal as specified designs neither, which is itself evidence for
            the adopt-amended-not-adopt verdicts.
          basis: [LSA-03]
        - question: "When a loop-spec entry and the loop's live definition diverge, which side is truth, and what detects the divergence?"
          answer: >-
            The live definition is truth, always -- this audit itself treated on: blocks as truth
            over prose (terraform-drift's intro still describes a cron its on: block does not
            have). P2's derive-and-assert clause is the only honest detector, and it must cover
            EVERY load-bearing field or the contract becomes a second surface that drifts --
            which is the NS6 drift-by-design anti-pattern verbatim, and the single strongest
            argument for extending collocated registers instead of landing P1.
          basis: []
        - question: "What would P2, P3, and P4 themselves cost the 300s fast-tier objective -- which tier would each run in?"
          answer: >-
            P2 (YAML grammar + resolution) and P3 (enumeration + set-equality) are
            milliseconds-class, the same shape as validate_ci_rca_adjudication -- compatible with
            --pre, gated on their input files. P4 as an EXECUTING fixture harness is not
            --pre-compatible under observed pressure: rec-2875 documents the one existing
            differential-style pre check already overrunning the budget by tracking registry
            delta rather than diff. P4's static red-case floor can run in --pre; its execution
            grade belongs in the full tier or T3.7's scheduled alarm lane.
          basis: [LSA-03]
        - question: "Landing docs/contracts/loop-spec.yaml as a new depth-1 Class D contract requires raising contract-population.yaml's status_active_max ratchet pin -- is that cost priced into P1's verdict, and who authorizes the raise?"
          answer: >-
            Re-derived: the premise is inaccurate. A NEW Class D file may never declare
            status: active (grandfather-only, closed at birth -- contract-population.yaml
            grandfather_only_forms), so loop-spec.yaml would land in the census's unpinned
            `declared` bucket; neither status_active_max (16) nor grandfathered_max (17) moves.
            The REAL landing cost is the declared-shape obligation: a non-empty evaluator
            resolving per evaluator_kinds -- P2 registered AND tier-sequenced -- at P1's landing,
            making P1+P2 an atomic unit. That cost is priced into the P1 verdict. Were a pin
            raise ever needed, the authorizer is a NEW numbered Decision naming the key
            (raisability_asymmetry: status_active_max appears in no existing Decision body).
          basis: []
        - question: "(Own) Who guards the guard-tests? The pins that gate DD-B's moves are plain tests, deletable or editable in the same PR with no marker."
          answer: >-
            Nobody, mechanically. tests/validate/test_budget.py's == 300 pin, the promoted
            roster, the _PRUNED_EDGES emptiness pin, and every domain closure superset are
            ordinary tests: the same PR that weakens a manifest can weaken its pin, and deleting
            a registered check's mirror test outright is DD-B move 5 -- undetected. This is the
            cheapest high-value P5 amendment: a diff-based guard (marker-gated) on deletion of
            tests/checks/** and tests/validate/** files mirroring registered checks, using the
            existing _marker_guard RegistrySpec pattern.
          basis: [LSA-01]
        - question: "(Own) Should sensor-workflow liveness itself be monitored -- who notices a dead cron?"
          answer: >-
            Yes, and it is the narrow, buildable slice of the unclosed-loops audit's unadopted
            'dormant transitions' proposal: one credentialed scheduled leg (convergence-health
            already carries reader+writer credentials and the alarm-only sensor pattern)
            asserting last-run-age for each schedule-bearing peer via the Actions API, filing an
            alarm-lane rec on staleness -- closing DD-B move 7 and the silent half of LSA-02
            without any new contract, workflow, or declaration surface.
          basis: [LSA-02]
  technique_verdicts:
    P1:
      verdict: reject
      mechanism: ""
      what_changes: >-
        Do not land docs/contracts/loop-spec.yaml. Route the two real residuals to existing
        registers: cap/stop declarations into ci_rca_taxonomy workflows rows (LSA-05), liveness
        into a sensor leg (LSA-02). If the scheduled-agent fleet re-enables at T4.12, evolve
        .github/agents/schedule.yaml -- already a per-loop manifest -- rather than starting a
        parallel registry.
      cost: M
      rationale: >-
        C5 CONFIRMED for P1: no DD-A-surviving defect class -- a declaration catches nothing by
        itself, and the declaration function is already served by three live, evaluator-backed
        registers (config/ci_rca_taxonomy.yaml workflows map with per-row owner/rationale and a
        BLOCKING two-way census in validate_ci_rca_adjudication; .github/agents/schedule.yaml;
        the check-manifest/registry pair), with objectives findable in workflow headers and
        Decisions 60/135/153. A fourth register spanning the same populations is the
        drift-by-design second surface NS6 and AGENTS.md prohibit, and every non-derived field
        in it would need P2's derive-and-assert to avoid Q5.7's divergence class. The
        population-gate cost compounds it: P1 cannot land without P2 registered and
        tier-sequenced (contract-population declared_shape_obligation).
      confidence: CONFIRMED
      sequencing:
        when: never
        blocked_behind: []
        note: "Revisit only if a loop-bearing population emerges that no existing register can host."
    P2:
      verdict: reject
      mechanism: ""
      what_changes: ""
      cost: S
      rationale: >-
        C5 CONFIRMED transitively: P2 exists only to enforce P1's surface, and every technique
        it specifies is already live elsewhere -- required-field/enum/owner grammar
        (validate_ci_rca_adjudication), oracle-resolves-in-registry-and-sequence
        (contract-population evaluator_kinds.check), fixtures-exist and scope-glob checks
        (mirror-test pattern), derived-not-restated numeric literals (check-manifest
        SEGMENT_TOKENS derive-and-assert; test_budget.py's == 300 pin). No surviving defect
        class of its own. Priced into P1: were P1 ever adopted, P2 is not optional -- the
        population gate makes it a landing precondition.
      confidence: CONFIRMED
      sequencing:
        when: never
        blocked_behind: []
        note: "Becomes mandatory-at-landing if P1 is ever revisited."
    P3:
      verdict: reject
      mechanism: ""
      what_changes: ""
      cost: S
      rationale: >-
        C5 CONFIRMED: the enumeration P3 promises already exists and BLOCKS for the population
        that matters -- validate_ci_rca_adjudication asserts two-way name-set equality between
        config/ci_rca_taxonomy.yaml's workflows map and the real .github/workflows/*.yml fleet
        (a new workflow cannot land without a row; a stale row cannot linger), and
        scheduled agents are enumerated by their own manifest. Q2 confirms the mechanical-
        enumerability premise but shows the actual gap is row CONTENT (backstop/stop-condition
        fields), which is P1's business, not enumeration. No surviving defect class today;
        a genuinely new loop-bearing population class would extend the census pattern, not
        add a parallel one.
      confidence: CONFIRMED
      sequencing:
        when: never
        blocked_behind: []
        note: ""
    P4:
      verdict: adopt-amended
      mechanism: >-
        Three legs, none requiring P1: (1) a registry-level red-case floor -- a meta-test or
        registered check asserting every scripts/checks entry's mirror test exercises at least
        one failing path (static assertion over tests, --pre-compatible), seeded from the
        existing TestAuditorOnSyntheticRepo idiom; (2) an escape-ratchet closure obligation --
        a gate_escape/ci_rca rec cannot close without naming its landed permanent artifact,
        enforced at the portal/rec-autoclose edge, verified onward by back_validation;
        (3) execution-grade fixture replay routed to the full tier or T3.7's scheduled
        alarm-not-gate lane, never --pre.
      what_changes: >-
        Decoupled from loop-spec entirely: bound to the check registry and the rec lifecycle
        instead of declared loop oracles; execution moved out of the merge path (CD.12 posture
        respected; rec-2875's cost precedent honored).
      cost: M
      rationale: >-
        Two DD-A-surviving defect classes, one observed: (i) a registered check with no
        demonstrated red case anywhere -- the differential admission gate proves discrimination
        only for graduated shards (475), T3.7's mutation is deferred and aimed at graduated
        guard lines, and mirror-test red cases are unenforced convention (LSA-03); (ii) a
        confirmed escape whose fix never becomes a machine fixture -- observed as rec-3131's
        claimed-but-absent preventive check recurring as rec-3328 (LSA-04). Nothing built or
        planned closes either.
      confidence: CONFIRMED
      sequencing:
        when: now
        blocked_behind: []
        note: "Align leg 3 with T3.7's meta-validation workflow when it lands to avoid a duplicate scheduled lane; legs 1-2 do not wait."
    P5:
      verdict: adopt-amended
      mechanism: >-
        Extend the EXISTING shared marker mechanism (scripts/checks/_marker_guard.py via the
        RegistrySpec pattern _ratchet.py already uses; token registered in
        docs/contracts/marker-grammar.yaml) to three diff-detectable weakening surfaces DD-B
        proved undetected: (a) manifest tier demotion -- pre True->False or full_segment
        removal on a registered Entry; (b) deletion of a registered check's mirror-test file;
        (c) removal/disable of a schedule: block on a sensor workflow. Tighten-free preserved:
        additions, promotions, and new schedules stay ungated.
      what_changes: >-
        Not gated on P1 and not marker-named loop-approved-against-a-loop-spec: the guards bind
        to the live surfaces (manifests, tests tree, workflow files) rather than to declared
        loop invariants, so there is no second declaration surface to drift.
      cost: S
      rationale: >-
        DD-A-surviving defect class, directly evidenced by DD-B: moves 2, 5, and 7 land with no
        gate, no marker, and no post-hoc detector, while the positive control (move 10) proves
        the marker mechanism gates at authorization grade where it is wired. The five existing
        guards cover policy files only; nothing covers the check fleet's own tier membership,
        test substrate, or the sensor fleet's schedules (LSA-01, LSA-02). Decision 165's
        infrastructure makes this an extension, not a new mechanism.
      confidence: CONFIRMED
      sequencing:
        when: now
        blocked_behind: []
        note: "Watch Decision 165's reversal signal: if marker surfaces proliferate past a small explainable set, re-audit toward the deferred Governs: declared-marker design instead of adding more guards."
  per_surface_assessment:
    - surface: S1
      maturity: frontier
      strengths: >-
        Single declared budget with derived ceiling and fail-closed waiver read; strictly
        additive selection with loud cap deferral; fail-closed gating; five-outcome accounting;
        selection manifest as observability-only artifact.
      top_gaps: []
    - surface: S2
      maturity: strong
      strengths: >-
        Watched-set census with per-row adjudication; escape attribution wired to the merged
        PR's own selection manifest; evidence bundle with vacuity/coverage-regression legs;
        fork-PR privilege gate; self-exclusion loop guard; back-validation sensor.
      top_gaps: [LSA-04]
    - surface: S3
      maturity: frontier
      strengths: >-
        One design budget; non-forced breaches hard-fail and file recs; bypasses logged with
        reasons and alerted in preflight; credential-free-CI gap closed by the warehouse ingest
        leg with resolved-never-resurrected discipline.
      top_gaps: []
    - surface: S4
      maturity: strong
      strengths: >-
        Four-channel additive derivation; status-aware diff; derive-and-assert manifest
        grammar; registry-totality taxonomy assertion; promoted-roster and membership-floor
        pins; graduated driver-test-survival shard.
      top_gaps: [LSA-06]
    - surface: S5
