  findings:
    - id: LSA-01
      surface: S5
      question: Q1
      dimension: VD2
      candidate: C3
      title: "Verifier-weakening moves on the live check fleet land single-key and undetected: tier demotion, mirror-test deletion, and same-PR pin edits have no gate, marker, or detector"
      evidence: "DD-B moves 2/5 (undetected); scripts/checks/verification/validate_verifier_same_pr_guard.py:70-139 scans only scripts/verifiers/*.py (REGISTRY = [], empty); tests/checks/registry/test_sequences.py PROMOTED_GATED+PROMOTED_UNGATED pins only 24 of 102 pre entries; tests/validate/test_budget.py:86 and TestPrunedEdgesRoster are plain same-PR-editable tests"
      evidence_kind: static
      current_behavior: >-
        Flipping pre=True to pre=False on any of the ~78 unpinned pre entries, or deleting a
        registered check's mirror-test file, merges with nothing firing; the five marker guards
        cover policy files (SLOC/prose/coverage/mypy/composite), not check code, manifests
        beyond grammar, or the tests that pin them; the only same-PR guard targets a retired,
        empty population.
      ideal_behavior: >-
        NS2: loosening the fleet's tier membership or test substrate is gated and attributable
        -- a demotion or mirror-test deletion requires a Decision-cited marker; tightening
        (promotion, addition) stays free.
      gap: "No two-key change control exists for the majority of the check fleet's weakening surfaces; the pinning tests themselves are part of the attack/drift surface."
      compensating_controls_considered: >-
        Promoted-roster + membership-floor + domain pin tests (gate 24+ entries -- selected in
        --pre via the import channel); full tier retains a demoted check so consequences surface
        post-merge as attributed escapes; human PR review. Insufficient: the roster covers under
        a quarter of pre entries, post-merge detection is exactly the recall loss the fast tier
        exists to prevent, and review of a one-character flag flip is not a mechanism.
      change_type: enforce
      proposed_change: >-
        P5-amended: extend scripts/checks/_marker_guard.py via the existing RegistrySpec pattern
        to (a) manifest tier-demotion diffs and (b) deletion of a registered check's mirror-test
        file; separately re-point the same-PR differential idea at scripts/checks/** co-edits or
        retire validate_verifier_same_pr_guard's dead scan.
      acceptance: "A synthetic PR flipping one unpinned Entry to pre=False, and one deleting a mirror test, each fail validate --pre without a marker; with a Decision-cited marker both pass; promotions stay ungated."
      severity: high
      severity_rationale: "Guarantee (b) gated-loosening is materially reduced for the majority surface and the traced compensating controls are partial; not critical because the full tier retains the oracle itself, so a wrong change still cannot merge trusted-green today."
      confidence: CONFIRMED
      roadmap_crossref:
        classification: novel
        item_ids: []
        dedup_search_terms: ["tamper", "weaken", "loosen", "same-PR", "marker", "tier demotion"]
        dedup_hit_count: 17
        note: "Nearest hits own different subjects: rec-2202 (DQ-rules loosening detector), Decision 165 (policy-file markers); none covers check-fleet tier membership or test substrate."
      effort: M
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "Pure extension of a live mechanism"}
      note: >-
        Strongest counter-reading: demotions are rare, legitimate ones exist (the 4 pre-only and
        1 unsequenced states are deliberate), and Decision 165's reversal condition warns
        against marker proliferation -- if that reading wins, the minimal form is guarding only
        mirror-test DELETION and leaving demotion to review.
    - id: LSA-02
      surface: S7
      question: Q2
      dimension: VD4
      candidate: C4
      title: "Standing sensor loops have no liveness backstop: a removed or silently dead cron stops budget ingestion and drift sensing with no gate, no detector, and nothing filed"
      evidence: "DD-B move 7: scripts/verify_ci_workflow.py:162-164 pins only main-canary's cron; scripts/convergence_health/budget_ingest.py:1-17 (the warehouse budget leg rides the convergence-health schedule); config/ci_rca_taxonomy.yaml rows for convergence-health/cost-reconciliation/ghas-probe (excluded: 'a red scheduled run is already its own alarm' -- true only if the run RUNS)"
      evidence_kind: static
      current_behavior: >-
        Commenting out convergence-health's schedule: block merges clean (only the canary cron
        is pinned) and silently stops four sensors including the fast-tier budget warehouse
        ingest; every excluded taxonomy row's declared backstop is failure-triggered or
        event-triggered -- none fires on absence-of-runs; CI-RCA watches conclusions, not
        cadences.
      ideal_behavior: >-
        NS4 applied to the loops themselves: each schedule-bearing loop has a backstop that
        notices it stopped -- a last-run-age assertion filing an alarm-lane rec on staleness.
      gap: "Loop-liveness is monitored for zero of the eight schedule-bearing workflows; the disabled terraform-drift cron's re-enable condition is declared but owned by no item."
      compensating_controls_considered: >-
        Red scheduled runs self-alarm (loud-fail designs); GitHub disables crons on 60d repo
        inactivity but this repo is active; a human may notice missing runs in the Actions UI.
        All are property-mismatched: they detect failing runs, not absent ones.
      change_type: add
      proposed_change: >-
        One credentialed sensor leg (convergence-health already holds reader+writer credentials
        and the alarm-only pattern) asserting last-run-age for each schedule-bearing peer via
        the Actions API and filing/updating one rec per stale loop; plus P5-amended leg (c):
        marker-gate schedule:-block removal on sensor workflows.
      acceptance: "With a peer workflow's schedule removed on a test branch (or its last run older than 2x its cadence in a mocked API response), the sensor files exactly one alarm-lane rec; restoring cadence closes nothing automatically (resolved-never-resurrected discipline preserved)."
      severity: high
      severity_rationale: "The backstop guarantee is materially reduced for the standing-loop population -- the compensating controls fire only on failing runs; not critical because these are alarm lanes, not merge oracles, and no wrong-but-trusted green is produced."
