    - id: LSA-04
      surface: S2
      question: Q1
      dimension: VD5
      candidate: C7
      title: "Escape-to-permanent-artifact ratcheting is author convention with observed failures: a claimed preventive check was never built and the class recurred; the RCA-tooling truncation class recurred five times"
      evidence: "rec-3131 (closed; preventive_action claims a --pre iam_tf invariant; no file in scripts/checks/iam_tf/ mentions IAMRoleReconcile/UpdateAssumeRolePolicy) recurring as rec-3328 (open, same fingerprint 10ac13c3); truncation class rec-2957/2965/2973/2995/2996; this session's preflight back-validation CANDIDATE flag pairing rec-3328 with rec-3131; scripts/ci_rca/back_validation.py:1-18 (CANDIDATES only, file-match only)"
