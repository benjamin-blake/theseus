      evidence: Agent/activity separation needs richer producer identity.
    - design: two-tables
      property: P5
      rating: met
      evidence: Claim and evidence node separation.
    - design: two-tables
      property: P6
      rating: partial
      evidence: No bounded quarantine lifetime is specified.
    - design: two-tables
      property: P7
      rating: partial
      evidence: Admission exists; ongoing mutation/decay score is not fully specified.
    - design: two-tables
      property: P8
      rating: partial
      evidence: Single-row consistency is native only to consolidation; separation needs a transactional current projection.
    - design: two-tables
      property: P9
