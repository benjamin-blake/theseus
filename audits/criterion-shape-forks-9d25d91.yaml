  - q: Q5
    answers:
    - question: How is realized-differently rewriting versioned?
      disposition: answered
      answer: It is a new SCD2 version of the same stable criterion identity, carrying amendment_reason and prior_version_ulid;
        the parent-plus-criterion-id merge key remains unchanged.
      basis:
      - CSF-03
    - question: Is rehomed a status, edge, or both?
      disposition: answered
      answer: 'Both: satisfaction=rehomed is the authored claim; a required rehomes_to edge is the joinable destination. Consumers
        join the edge and use status to exclude local remaining work.'
      basis: []
    - question: How is a recommendation-parent criterion identified?
      disposition: answered
      answer: The portal writer allocates the parent id and criterion ULID in one transaction; the authored criterion_id is
        unique only within that parent.
      basis:
      - CSF-03
    - question: What bounds criterion text?
      disposition: answered
      answer: Use an explicit text size contract above the observed 6,581-character maximum, measured in UTF-8 bytes, with
        no silent truncation; 16 KiB is a defensible initial bound subject to the walk.
      basis: []
    - question: Does the clause-7 vocabulary rename become harder?
      disposition: answered
      answer: Neither if schema and verbs are kind-generic now. No column, enum, or new verb should contain recommendation;
        adapters alone map legacy rec fields.
      basis: []
    - question: Where does an escaped defect re-enter?
      disposition: answered
      answer: As an append-only escaped_defect evidence leg that references the contradicted criterion version and forces
        current satisfaction/proof to reopen/stale.
      basis:
      - CSF-04
    - question: Who owns claim/evidence atomicity across adapters?
      disposition: answered
      answer: One storage-port writer operation owns both the evidence append and current-projection advance; the local adapter
        must provide the same atomic contract with a local transaction.
      basis:
      - CSF-01
    - question: Is evaluator subtype the same axis as epic/task parent kind?
      disposition: answered
      answer: No. Either parent kind can carry prose, executable, or reviewed criteria, so evaluator payload belongs in a
        typed extension rather than a parent-kind fork.
      basis:
      - CSF-06
      - CSF-09
    reversal_trigger_assessment:
      verdict: not-tripped
      nullable_column_count: 12
      which_columns:
      - column: evaluator_kind
        null_for: both
      - column: primitive_slot
        null_for: both
      - column: check_spec
        null_for: both
      - column: guard_target
        null_for: both
      - column: guard_symbol
        null_for: both
      - column: hermetic
        null_for: both
      - column: phase
        null_for: both
      - column: severity
        null_for: both
      - column: disposition
        null_for: both
      - column: graduated_check_id
        null_for: both
      - column: plan_slug
        null_for: both
      - column: authored_at_sha
        null_for: both
      rationale: >-
        The flat proposal is over-wide, but the nullable axis is evaluator subtype, not epic-shaped versus task-shaped
        parent kind: both kinds can carry each criterion subtype. A typed evaluator-method extension absorbs the nulls
        without reopening the shared child grain. Stated on the trigger's literal text: Section 10.2 AS WRITTEN adds 12
        nullable columns and would trip "reopen clause 3 before adding nullable columns"; the axis is evaluator-subtype
        not kind, so WITH CSF-09's typed extension it is not tripped -- this verdict is conditional on CSF-09 landing in
        the clause-8 walk.
      basis:
      - CSF-06
      - CSF-09
      other_conditions:
        executor_needs_tier_items_pre_mvp:
          near_triggered: false
          rationale: T4.3 can remain kind-generic while only task-shaped rows are populated; no evidence shows rec-only MVP
            iteration cannot complete.
        merge_authored_edges_lossy:
          near_triggered: true
          rationale: criterion_traces_to and rehomes_to require declared target/version data that a generic squash trailer
            cannot reconstruct unless the merge payload preserves it.
    deferred_walk_inputs:
      merge_key:
        verdict: parent-plus-criterion-id
        value: parent_work_item_ulid, criterion_id
        rationale: Stable authored/migrated criterion identity defines sameness across SCD2 revisions; row ULID identifies
          a version only.
        basis:
        - CSF-03
      join_keys:
        verdict: evidence-table-fk
        targets:
        - work_items.ulid
        - work_item_criterion_evidence.criterion_version_ulid
        - verification_registry.(plan_slug,check_id)
        - work_item_edges
        rationale: Evidence must point to an exact version; the registry link remains composite and optional rather than a
          merge key. _joins.yaml has no existing criterion join, so the migration must register these.
        basis:
        - CSF-01
      partition_column:
        verdict: event_date
        applies_to:
        - work_item_criteria_history
        - work_item_criterion_evidence
        rationale: Partition SCD2 history by version event date and append-only evidence by run event date; a current projection
          is keyed, not analytically partition-driven.
        basis: []
      current_projection:
        verdict: scd2-history-plus-type1-current
        rationale: >-
          Pick/read paths need current criteria without SCD2 windowing, while history preserves rewrites. The
          parent-plus-revision sibling already exists: ops_execution_plans, "one row per plan revision (rec_id, revision);
          current = latest revision per rec_id", SCD2 with a Type-1 current table (storage-substrate.yaml:89-90). The
          criteria table's grain matches that sibling, so design_time_walk step 8 ("a grain that matches an existing
          sibling table" needs no escalation) narrows the still-open advice-consult to the NEW evidence table and to the
          merge-key choice; the criteria table itself is a routine, already-settled shape.
        basis:
        - CSF-01
      write_boundary:
        verdict: portal-writer-verb
        owner: work-item storage-port writer create/update criterion verb
        rationale: The server-side writer can mint parent/criterion/version ULIDs and atomically append evidence; plan authoring
          remains a declaration, not durable storage.
        basis:
        - CSF-01
      tenancy:
        verdict: project-id-on-parent-only
        rationale: Cloud tenancy is inherited through parent_work_item_ulid; duplicating project_id on every child is derived
          state and the local adapter remains single-tenant. Partitioning uses event_date, not operator taxonomy.
        basis: []
      read_boundary:
        verdict: criteria-on-parent-read
        pick_surface_returns: A kind-generic current work item with its current criteria and satisfaction/proof summary attached;
          evidence history remains a separate named read.
        rationale: Pick decisions require acceptance criteria atomically with the item, while detailed history would inflate
          every pick. The canonical verb is pick_work_item; pick_rec is legacy adapter vocabulary.
        basis: []
      dq_intent:
        verdict: per-field-dq-intent
        fields_with_not_null:
        - ulid
        - parent_work_item_ulid
        - criterion_id
        - text
        - text_origin
        - satisfaction
        - valid_from
        - event_date
        rationale: Enforce not-null and accepted-values per common field; enforce subtype fields in their extension contract.
          Leave valid_to, resolution refs, and optional review/evidence links nullable with explicit iff rules.
        basis:
        - CSF-09
