audit:
  meta:
    audited_commit: 9d25d91
    base_branch: main
    model: GPT-5.6 Sol
    methodology_version: 1
    scope_surfaces:
    - S1
    - S2
    - S3
    - S4
    - S5
    - S6
    degraded_dedup: true
    contract_notes: The audited base is the harness-provided 9d25d91 snapshot because no origin ref exists; recommendation
      cache generation completed without producing the cache; advice-consult step 8 remains open and is not discharged by
      this audit.
    stale_anchors: []
    capability_deviations:
    - class: capability
      obligation: Fetch origin/main and use its ref as the audited base
      detail: No origin remote or origin/main ref exists in this checkout; the audit uses the harness-provided main-tip commit
        at session start.
    - class: capability
      obligation: Regenerate and search the recommendation cache
      detail: The mandatory preflight completed without producing logs/.recommendations-log.jsonl, so recommendation-side
        dedup and E4/E5 population measurements were unavailable. Superseded-by-review (round 1) for E4/E5 only, which the
        reviewer measured post-audit on a local cache dated 2026-09-20; recommendation-side dedup of findings was not
        re-run, so degraded_dedup stays true.
    - class: capability
      obligation: Use subagents for the Section 11 sweep and cold check
      detail: This execution environment prohibited spawning subagents; all leads were independently re-verified in the audited
        tree by the executing model.
    - class: capability
      obligation: Use the GitHub MCP server for PR creation
      detail: No GitHub MCP server is available; the prompt waiver permits gh, but no remote is configured, so push and PR
        creation cannot succeed.
  question_answers:
  - q: Q1
    verdict: a-periodic-standing-runs
    basis:
    - CSF-02
    prose: >-
      Admission remains commit-relative and differential; a separate periodic standing_run makes present validity
      observable. This closes only the FAIL-decay half of the decay space (plan-obligations-enumeration-homed's shape): a
      PASS/FAIL re-execution on HEAD returns PASS forever on a permanently-TRUE row
      (no-retired-ci-role-in-live-surfaces), which only a revert-differential or mutation leg can expose -- T3.7 c1's
      scheduled GitHub-Actions mutation run on graduated-check targets (deferred_post_mvp) owns that half. Standing-run
      outcomes persist git-side as a workflow artifact plus a rec on FAIL/unmeasurable (CD.12 alarm-not-gate), and on the
      cloud adapter as standing_run evidence rows; the admission baseline itself stays a git-ref property per Decision
      176 clause 4 and is never read from the warehouse. A guard_target trigger can supplement but not replace the schedule.
  - q: Q2
    verdict: drop-the-field
    basis: []
    prose: 'Do not store verification_tier on criterion rows: Decision 197 clause 4 forbids the operator taxonomy as a column.
      Keep the existing plan-grain floor for plan routing; derive any product-neutral consequence through extensions later.'
  - q: Q3
    verdict: pin-at-migration-time
    basis:
    - CSF-03
    - CSF-08
    prose: >-
      The touched-item gate (validate_platform_roadmap.py:111-133) fires on any item in the git diff regardless of
      status, so the 259 bare criteria on complete items are merely seldom in its path, not beyond it by construction; the
      line ceiling blocks bulk conversion (re-derived: 1.13 physical lines per bare criterion versus 6.52 per structured
      one, so +2 each at the minimal form and about +5.4 each in practice); and clause 8 forbids lift-and-shift. Migration
      must mint stable ids and preserve alias mapping. Option (c) terminal-migrated-bare was not chosen as the verdict
      because it settles a METHOD question (never backfill a verification method) with an IDENTITY answer; (b) subsumes
      it -- complete-item bare rows migrate with text_origin=migrated_bare, satisfaction=met and no method, and (c)'s
      "never convert" is then a policy on those rows, not a competing identity scheme.
  - q: Q4
    verdict: two-tables-evidence-journal
    precedent:
    - ops_smoke_events_history
    adapter_split:
      splits: false
      local_verdict: two-tables-evidence-journal
      cloud_verdict: two-tables-evidence-journal
      note: Both adapters need history; local uses an atomic SQLite/DuckDB transaction rather than a warehouse round trip.
    basis:
    - CSF-01
    - CSF-04
    - CSF-05
    prose: Separate append-only evidence preserves decay and retry history, but only with one atomic writer operation and
      a current proof projection. The existing ops_smoke_events event journal is precedent at event grain, not per-criterion
      precedent.
    external_checklist:
    - design: one-table
      property: P1
      rating: partial
      evidence: Journal separation versus current-row mutation.
    - design: one-table
      property: P2
      rating: partial
      evidence: SCD2 claim and fact separation.
    - design: one-table
      property: P3
      rating: partial
      evidence: Per-run fact history.
    - design: one-table
      property: P4
      rating: partial
      evidence: Agent/activity separation needs richer producer identity.
    - design: one-table
      property: P5
      rating: partial
      evidence: Claim and evidence node separation.
    - design: one-table
      property: P6
      rating: missed
      evidence: No bounded quarantine lifetime is specified.
    - design: one-table
      property: P7
      rating: missed
      evidence: Admission exists; ongoing mutation/decay score is not fully specified.
    - design: one-table
      property: P8
      rating: met
      evidence: Single-row consistency is native only to consolidation; separation needs a transactional current projection.
    - design: one-table
      property: P9
      rating: met
      evidence: One-write atomicity is native only to consolidation; separation needs one writer transaction.
    - design: two-tables
      property: P1
      rating: met
      evidence: Journal separation versus current-row mutation.
    - design: two-tables
      property: P2
      rating: met
      evidence: SCD2 claim and fact separation.
    - design: two-tables
      property: P3
      rating: met
      evidence: Per-run fact history.
    - design: two-tables
      property: P4
