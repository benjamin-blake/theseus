  findings:
  - id: CSF-01
    surface: shared
    affects_surfaces:
    - S1
    - S2
    candidate_ref: null
    question: Q4
    dimension: VD3
    title: Two-table design does not define an atomic current-proof projection
    evidence: docs/contracts/data-modeling-standard.yaml:62-113
    evidence_kind: static
    current_behavior: The proposal separates mutable criterion state from append-only evidence but names no transaction, projection
      rule, or stale-state resolver.
    ideal_behavior: Evidence appends and the criterion current proof projection advance atomically through one writer, while
      evidence remains immutable.
    gap: A reader can otherwise observe met/proven state without the evidence version that supports it, or fresh evidence
      with stale proof state.
    compensating_controls_considered: >-
      The existing writer already does the single-table half: ducklake_writer performs the SCD2 history append via
      MERGE-on-ULID plus the current write-through projection in one writer op (docs/contracts/ducklake_writer.yaml:50),
