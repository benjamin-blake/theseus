audit:
  meta:
    audited_commit: 3dee4a5
    base_branch: main
    model: Claude Fable 5
    methodology_version: 1
    scope_surfaces: [generated, terraform, config, contracts, ci_workflows, shell,
                     lambda_manifests, roadmaps, workflow_outputs, test_fixtures,
                     data_query, residual]
    degraded_dedup: false
    contract_notes: "shallow clone (git rev-parse --is-shallow-repository = true); empirical pass 5 (registry commit history) skipped per SETUP; history-dependent claims marked HYPOTHESIS -- present-state claims unaffected. Preflight succeeded; dedup caches fresh."
    stale_anchors: []
    deliverable_size: {yaml_effective_lines: 820, md_words: 1282,
                       breaches_own_recommendation: false,
                       note: "This file measures 820 effective lines under the pinned census rule, over the incumbent 500 limit. It does NOT breach this audit's own verdicts: workflow_outputs (audits/**/*.yaml, this file's class) is exempt-with-reason per class_verdicts.workflow_outputs, on edit-pattern grounds, not trimmed to fit."}

  question_answers:
    - q: Q1
      verdict: mixed
      basis: [SGE-01, SGE-02, SGE-03, SGE-04, SGE-05, "census: 552 in-scope files, 87 over 500 effective lines", "Decision 130 (whole-repo intent)", "Decision 43 ('all repository code, prompts, and agents')"]
      prose: >-
        Extend to every hand-authored, agent-edited structured class; exempt by provenance and
        production-pattern, never by consumer tier. Extend-uniform (500 effective lines):
        terraform (34 files, 5 over), config (23, 2 over), contracts (36, 2 over), shell (14, 0),
        lambda_manifests (7, 0), data_query (16, 0), residual (33, 1 over -- govern-by-default for
        future classes). Extend-calibrated: ci_workflows (28, 2 over -- file cap plus an R3-style
        inline-body extension, since the risk-bearing unit is the run body), roadmaps (3, 2 over
        vs 500 -- per-file Decision-114-parity ceilings plus compaction lifecycle; 500 is
        unmeetable for a monotonic work-list and splitting is the rejected N-files anti-pattern).
        Exempt-with-reason: generated (8 files -- no agent edits them; govern the producer),
        workflow_outputs (340 files, 71 over, 82 percent of the affected population -- see DD-D
        rationale in that class verdict), test_fixtures (11, 0 -- fixture fidelity outranks
        uniformity; a cap on captured data is an NS-B tax). No class needs defer: no named
        precondition is missing anywhere.
    - q: Q2
      verdict: composite
      basis: ["DD-A: OVERSEER-terraform-deploy-redesign.yaml 326 eff / 255,039 B / 8,211-char max line", "measured: zero '//' lines and zero real '/* */' blocks across all 33 tracked .tf", "per-extension bytes-per-eff-line: .py 53.6, .yaml 72.4, .yml 66.0, .tf 60.8, .sh 92.2 (reproduces GROUNDING MAP)", SGE-05]
      prose: >-
        Primary binding unit: effective lines, unchanged and applied per the pinned rule; companion
        binding guard: max line length (2,000 chars proposed) for governed classes -- ruff already
        binds Python at 127, nothing binds YAML/TF/workflows. DD-A grounding: within-class
        bytes-per-effective-line spread (config p10 38.5 to p90 349.0; workflow_outputs 62.7 to
        109.8) exceeds the between-class median spread (45.6 to 124.9), so switching units per
        class would not reduce divergence -- the divergence lives in the long-line tail, which the
        companion catches (the OVERSEER report passes any line gate at 326 eff lines while
        carrying 255 KB; a 4,606-char line sits in ROADMAP-PLATFORM.yaml today). Bytes rejected:
        it taxes '#' comments, which in this repo carry the Decision-rationale record
        (github_ci_apply.tf: 1,266 raw / 695 effective -- 571 comment+blank lines of IAM
        rationale); pressure to delete rationale is the wrong incentive (NS-B). Tokens rejected on
        VD5 (tokenizer dependency and version drift). Measured Q2 delta for the pinned rule:
        ZERO in the current tree -- all 33 tracked .tf files use '#' comments exclusively (0 '//'
        lines, 0 block comments), and JSON has no comments, so no population number and no Q1/Q6
        verdict moves under a per-language counter. The risk is prospective: a future '//' comment
        in .tf would miscount as code. Close it by adding leading-'//' to the comment-prefix set
        for .tf in the engine; note honestly that full block-comment handling needs a lexer, not a
        regex -- during this audit a naive regex stripper was fooled by '/*' inside ARN strings
        ("...personal/*" through "Get*/List*" parses as one giant comment), a worked example of
        why the pinned rule's simplicity is itself a VD5 asset.
    - q: Q3
      verdict: hybrid
      basis: ["scripts/checks/registry.py:117-122 (six-check --pre block, confirmed)", "validate_sloc_limits declares no pre_globs; measured whole-tree walk 778 py files in 0.09s", "non-Python census 552 files ~0.05s", "SGE-07", "DD-B: marker-guard pattern exists in 5 copies with 3 direction tokens"]
      prose: >-
        One NEW parameterized engine for the expansion; incumbents untouched day one. Two new
        modules (a class-table-driven limit engine plus ONE raise-guard), one new registry
        (config/structural_size_budgets.yaml carrying both the class table -- globs,
        provenance-override, unit, limit, direction, valves -- and the per-file grandfather
        budgets), two registry.py entries plus two validate.py re-export lines. Replicating the
        existing pattern per class (5 more gate modules, 5 more raise-guard copies) fails NS-F:
        the raise-guard is already quintuplicated (sloc, prose, coverage, mypy, composite-R3
        variant) with three direction tokens; a sixth copy per class compounds SGE-07. Full
        generalization (folding the five incumbent gates in) is deferred: each incumbent ceiling
        names its own consumer and retirement trigger (Decision 160's lesson), and migrating them
        before the engine proves out risks five regressions for zero coverage gain -- record a
        convergence path instead. Tier: both tiers, unscoped (no pre_globs), matching
        validate_sloc_limits precedent -- measured cost is ~0.05-0.1s against the 5-minute
        Decision 73 budget, so pre_globs machinery would cost more in complexity than it saves;
        the raise-guard scopes to its registry path. Taxonomy home (DD-C): in the new registry
        itself -- machine-readable, collocated with its enforcement (AGENTS.md collocation rule),
        tamper-guarded by its own raise-guard; file-router.yaml stays placement-only; a code
        constant would make reclassification a code change and split semantics from enforcement.
        Key: exclusions, then provenance override (banner/regeneration-command test), then
        directory+extension globs -- exactly the census algorithm, first-match-wins, with residual
        as the mandatory default row.
    - q: Q4
      verdict: sound-needs-generalization
      basis: ["rec-2709 closed: the 24-file tests/ grandfather roster demonstrably drained to 1 marked survivor (config/sloc_budgets.yaml: 3 entries, 1 tests/)", "Decision 128 (convergence_health 401->817 via three unreviewed raises)", "Decisions 145/147/160 counter-evidence", SGE-07]
      prose: >-
        Load-bearing and portable: the registry-plus-implicit-default shape (unregistered file
        gets the strict default -- 500, 100 percent, 0 errors), the one-directional ratchet with
        unrestricted tolerant direction, the diff-vs-origin/main marker guard, no-auto-seed, and
        the one-time bounded grandfather (proven end to end: Decision 130's 24-file roster was
        drained by the decomposition program; rec-2709 is closed). Python-incidental and NOT
        portable: the single decompose-into-facade relief valve (each class needs its own honest
        valve -- the repository already runs six), the counting expression, the __init__.py
        exemption, and the Decision 131 test-mirror coupling. The post-131 family cuts against
        naive ceiling-adding and must shape the design: Decision 160 retired a byte ceiling as
        WRONG-SHAPED when its sole consumer was rebuilt (so every new class row must record its
        actual_purpose, making retirement reachable when a referent dies); Decision 145 warns a
        second stopgap raise signals the structural fix is overdue; Decision 147 proves
        compact-in-place beats split-or-raise for monotonic single files; Decision 150 shows an
        inflow significance bar is the right shape for append corpora (the verification
        registry's eventual control, not a per-file cap alone). One live integrity weakness
        carries over: the marker guards validate that the cited Decision header EXISTS, not that
        it authorizes anything (SGE-07; live instance rec-2974).
    - q: Q5
      verdict: mixed
      basis: ["scripts/llm/utils.py:29-30 (MODEL_PLANNING/MODEL_EXECUTION = deepseek.v3.2 -- the fixed floor is repo-grounded)", "class_verdicts[*].rationale", "CD.30 pending (coverage half already has no non-Python referent)"]
      prose: >-
        The owner's two-part rationale (lower-tier edit accuracy; tractable 100 percent per-file
        coverage) transfers as comprehension-only to every extended class -- the coverage half has
        no referent for .tf/.yaml/.yml/.sh, where schema validators and plan/apply gates play the
        role tests play for Python. Per-class actual purposes are recorded in class_verdicts so no
        class is governed by an unarticulated reason: terraform (a mis-edit is a production
        security event; bounded working set for IAM-dense files), config (growth pressure must
        surface lifecycle decisions, not silent accretion), contracts (densest agent-consumed
        semantics; cap guards amendment-log accretion), ci_workflows (needs its own rationale --
        the risk unit is the inline body, rec-2923's class), shell (session-bootstrap surface),
        roadmaps (bounded /plan-time load, via ceilings not 500). does-not-transfer: generated,
        workflow_outputs, test_fixtures -- no agent performs whole-file comprehension edits there.
    - q: Q6
      verdict: mixed
      basis: [SGE-01, SGE-02, SGE-04, "Q8 base-rate answer (no observed non-Python instance of the NS-A harm)", "Decision 130 clause 2 / Decision 162 seeding precedent"]
      prose: >-
        One-time-grandfather for the extended classes: exactly 12 hand-authored files exceed 500
        effective lines (terraform 5, config 2, contracts 2, ci_workflows 2, residual 1), each
        registered at current size with a raise marker citing the installing Decision -- the
        installing PR is green by construction (Decision 130 clause 2 / Decision 162 precedent).
        Roster is bounded and drainable; drain is human-planned /plan work (executor frozen,
        Decision 67) -- the proven rec-2709 shape. Sequencing: engine+registry+guard in one PR;
        decomposition waves follow as separate recs, terraform first (native multi-file roots make
        it cheap), the verification-registry archival lifecycle second (needs design, not just
        splitting). Class-exemption for generated, workflow_outputs, test_fixtures (recorded
        reasons, no roster). Roadmaps: PLATFORM continues under Decision 114/147 (fixed,
        do-not-flag); PRODUCT gets a seeded ceiling. Because the base rate of the motivating harm
        in non-Python classes is zero observed instances (Q8), no urgent multi-wave migration is
        justified -- calm, marker-cited grandfathering with unhurried drain is proportionate.
    - q: Q7
      verdict: ahead-justified
      basis: ["external_checklist", "AGENTS.md SLOC-governance section (stated consumer + failure mode)", "measured: all 10 size-governance modules <=283 effective lines"]
      prose: >-
        The owner's position survives testing: mainstream per-file size lints exist but are
        advisory-by-default, single-language, anonymous-suppression affairs; this repository's
        regime is blocking, baselined, ratcheted, attributably-escaped, consumer-calibrated, and
        self-subjected -- ahead on 7 of 11 properties, at parity on 1, behind on none, with the
        3 partials being exactly what this audit scopes (beyond-primary-language coverage, unit
        re-derivation for two surfaces, per-file provenance detection). Ahead-JUSTIFIED because
        the divergence traces to a stated, repo-grounded consumer (the deepseek.v3.2 execution
        floor) rather than taste.
      external_checklist:
        - {property: "Per-file size lint exists at all", rating: met,
           evidence: "scripts/checks/sloc/sloc_limits.py:80 validate_sloc_limits || ESLint max-lines, Pylint C0302 too-many-lines (default 1000), Checkstyle FileLength (default 2000), SonarQube file-size rules (model knowledge, unverified)"}
        - {property: "Limit is enforced as a blocking gate rather than advisory", rating: met,
           evidence: "scripts/checks/registry.py:117 (--pre tier, authoritative pre-merge in CI per Decision 73) || mainstream size lints ship advisory or off-by-default; blocking requires deliberate CI wiring and is commonly disabled (model knowledge, unverified)"}
        - {property: "Limit applies beyond the primary language to config and infrastructure files", rating: partial,
           evidence: "prose bytes (prose_limits.py:86), DECISIONS.md H2+bytes (validate_decisions_size.py:20-21), roadmap raw lines (validate_platform_roadmap.py:13), composite bodies (validate_composite_action_shell_bodies.py) -- named surfaces only; the general .tf/.yaml population is unscanned (this audit's subject) || essentially absent in mainstream practice; file-size lint rules are per-language and infra linters (tflint, actionlint) carry no file-size rules (model knowledge, unverified)"}
        - {property: "Baseline/grandfather mechanism for pre-existing violations rather than a flag day", rating: met,
           evidence: "config/sloc_budgets.yaml + config/coverage_baseline.yaml + config/mypy_baseline.yaml + composite_action_body_baseline.yaml (Decision 130 clause 2 one-time grandfathers) || suppression-baseline tooling exists (eslint bulk-suppressions, mypy/ruff baselines, Betterer) and is reasonably common (model knowledge, unverified)"}
        - {property: "Ratchet that prevents silent regression", rating: met,
           evidence: "downward-only regenerators (_update_sloc_budgets sloc_limits.py:20; mypy_baseline.py --update) + tamper guards diffing origin/main || ratchet CI (Betterer-style) exists but is not mainstream default (model knowledge, unverified)"}
        - {property: "Escape hatch that is auditable and attributable rather than an anonymous suppression comment", rating: met,
           evidence: "raise-approved: dec-NNN marker validated against a real Decision header (validate_sloc_budget_raises.py:79) -- caveat SGE-07: existence-checked, not authorization-checked || mainstream suppressions are anonymous (noqa, eslint-disable); ticket-reference conventions exist but are unenforced (model knowledge, unverified)"}
        - {property: "Measurement unit is defensible for the artifact type rather than inherited from source code", rating: partial,
           evidence: "bytes for ambient prose is argued in prose_limits.py:1-21 (load = bytes read); effective lines for Python argued in Decision 128; but the roadmap ceiling counts RAW lines (comments and blanks consume ceiling, SGE-05) and no per-unit rationale is recorded for it || mainstream units are uniformly inherited line counts, un-re-derived (model knowledge, unverified)"}
        - {property: "Limit is calibrated to a stated consumer with a stated failure mode", rating: met,
           evidence: "AGENTS.md SLOC-governance section + scripts/llm/utils.py:29-30 (deepseek.v3.2 floor) + Decision 128 problem statement (observed comprehension degradation) || mainstream limits cite human readability folklore, not a measured consumer (model knowledge, unverified)"}
        - {property: "Generated and vendored artifacts are distinguished from hand-authored ones by provenance", rating: partial,
           evidence: "directory-level only (_shared.py:16 _SLOC_EXCLUDE_DIRS); no gate applies a per-file provenance test; terraform's presence in the exclude list is a Python-walker artifact, not a .tf ruling (READ FIRST 3, confirmed) || GitHub linguist-generated and lint ignore-paths are pattern/directory-based and common (model knowledge, unverified)"}
        - {property: "Governance mechanism is itself subject to the limits it enforces", rating: met,
           evidence: "measured: all 10 size-gate/raise-guard modules are 39-283 effective lines, max validate_composite_action_shell_bodies.py at 283 || rarely a stated property anywhere (model knowledge, unverified)"}
        - {property: "The agent-era premise: evidence that long-context degradation and edit accuracy motivate a file-size limit for LLM editors", rating: met,
           evidence: "Decision 128 records the observed accretion case; executor-era recs rec-242 (escalate to Sonnet for target files >10 KB) and rec-285 (escalate above a SLOC threshold) are closed, observed size-capability couplings; AGENTS.md states the degradation claim || long-context positional-degradation findings (lost-in-the-middle) are consistent with, but do not by themselves pin, a 500-line editing limit (model knowledge, unverified)"}
    - q: Q8
      answers:
        - question: "Should exemption key off provenance rather than directory, and what breaks when a generated file lands in a governed directory?"
          answer: >-
            Yes for exemption -- the census proves the need: config/lambda/ducklake/field_semantics.yaml
            (GENERATED -- DO NOT EDIT banner, named regenerator, drift gate) sits inside governed
            config/ at 508 effective lines; under directory keying it would demand a pointless
            grandfather entry; under provenance keying it is exempt wherever it lives. But
            provenance alone is fuzzy at the edges, measured: docs/plans/PLAN-platform-first-sequencing-ratify.yaml
            carries a literal 'Generated by /plan' banner and is NOT machine-regenerable (banner
            prong false-positive); .secrets.baseline is tool-emitted but referenced only from
            .pre-commit-config.yaml, outside the test's pinned scripts/.github search scope
            (regeneration prong false-negative); requirements.lock has no banner but
            import_governance.py:69 documents its pip-compile command (prong-2 judgment call);
            config/sloc_budgets.yaml is genuinely hybrid (machine-regenerated AND hand-marked).
            The right key is layered, in first-match order: exclusions, provenance override,
            directory+extension -- with the banner prong narrowed to do-not-edit semantics
            (a self-description of authorship is not a machine-ownership claim). Splitting the
            mirror-shaped baseline siblings across two classes (mypy_baseline generated;
            coverage/composite baselines config) is tolerable BECAUSE the exemption consequence
            is nil -- all are far under 500 -- but it confirms the prongs measure documentation
            habits, not ownership; the engine's class table should pin membership explicitly for
            the registry family rather than re-deriving it per run.
          basis: ["census generated class: 8 members with per-member evidence", "import_governance.py:69", ".pre-commit-config.yaml:20"]
        - question: "A universal 500-line limit would make /plan and /audit unable to emit compliant deliverables -- exempt, cap, or change what they emit?"
          answer: >-
            Exempt the class (DD-D). Changing what the workflows emit was considered and rejected:
            a plan is a self-contained implementation brief consumed as one load (Decision 110
            reasoning applies); splitting briefs across files is the N-files-to-reassemble
            anti-pattern (NS-D); and this audit's own YAML deliverable measuring 987 effective
            lines is the live counterexample -- a compliant-size audit of 12 classes is not
            writable without losing verifiability. The honest control is lifecycle (RS-07
            archival), not size.
          basis: ["meta.deliverable_size", "docs/CLAUDE.md RS-07", "class_verdicts.workflow_outputs"]
        - question: "Is per-file the right granularity, or is a directory/package aggregate budget needed?"
          answer: >-
            Per-file is right for the NS-A edit-comprehension purpose. The aggregate concern
            (decomposition converts size into file-count and repo-wide reachable-context cost) is
            real but already owned: T3.14 (deferred_post_mvp) is the repository's only aggregate
            precedent -- reachable-vs-total SLOC as a trendable metric, measurement-first,
            gate-vs-advisory deferred to a ratifying decision. Do not duplicate it; any
            directory-level budget proposal is planned-unbuilt territory against T3.14, not novel.
          basis: ["docs/ROADMAP-PLATFORM.yaml T3.14 (status deferred_post_mvp, ships measurement not enforcement)"]
        - question: "__init__.py is exempt while decompose-by-default manufactures facades -- live loophole?"
          answer: >-
            Latent, not live, measured: 111 tracked __init__.py, largest 122 effective lines
            (scripts/executor/__init__.py), zero over 500, two over 100. Facades are visible to
            the import graph (Decision 135 point 2 made them nodes) but invisible to the size
            scan (_shared.py:43 skips them unconditionally). Cheap close when wanted: scan
            __init__.py with a smaller facade budget (e.g. 150) rather than the full 500; not
            urgent at current population.
          basis: ["scripts/checks/sloc/_shared.py:43", "measured facade census: 111 files, max 122 eff"]
        - question: "If CD.30 (diff-line-coverage ratchet) ratifies, does the coverage half of the rationale still hold?"
          answer: >-
            CD.30 is pending (gates T3.7). If ratified, the per-changed-file 100 percent floor --
            the referent of the owner's 'small files make 100 percent coverage tractable' -- is
            replaced by diff-line coverage, and the coverage half of the SLOC rationale loses its
            referent for Python too. The comprehension half (NS-A) stands alone and suffices. No
            class verdict changes (non-Python classes never had the coverage rationale -- Q5
            already rates them transfers-comprehension-only), but the Decision text should record
            the dependency so the rationale does not silently rot (Decision 160's lesson about
            ceilings outliving their referents).
          basis: ["docs/ROADMAP-PLATFORM.yaml CD.30 (state: pending)", "class_verdicts rationale.transfer values"]
        - question: "Does a line-based unit need a companion long-line guard?"
          answer: >-
            Yes, measured three ways: docs/plans/reports/OVERSEER-terraform-deploy-redesign.yaml
            is 326 effective lines / 255,039 bytes / 8,211-char max line (782 bytes per effective
            line, 10.6x its class median) -- it passes every line gate while being the heaviest
            single-file load in the repository outside the roadmap; ROADMAP-PLATFORM.yaml carries
            a 4,606-char line against a RAW-line ceiling (line-joining relieves that ceiling
            without reducing load -- a live VD3 evasion, SGE-05); PLAN-reconcile-stale-plan-coverage.yaml
            carries a 1,190-char line. Python is already companion-guarded by ruff at 127. The
            engine adds a max-line-length guard (2,000 chars) for governed classes; for exempt
            workflow_outputs the OVERSEER case is recorded as a known cost of exemption, not
            gated.
          basis: ["DD-A outlier measurements", SGE-05]
        - question: "Interaction with the map_source_to_test mirror convention (Decision 131)?"
          answer: >-
            Correctly out of scope. Declarative classes have no per-file test-mapping analogue;
            their correctness gates are schema validators (validate_platform_roadmap,
            validate_plan_documents, terraform validate, the composite-manifest checks), which
            already play the role tests play for Python -- demonstrated live by rec-2749/rec-2762,
            where malformed agent-authored plan refs were caught by the roadmap integrity gate.
            Governing a class creates no mirror obligation; the Decision text should say so to
            pre-empt the inference.
          basis: ["Decision 131", "rec-2749", "rec-2762"]
        - question: "Is there a class where the right answer is to change how the file is produced?"
          answer: >-
            Three concrete candidates. (1) terraform/iceberg_tables.tf (1,491 eff): its
            hand-maintained column tables duplicate Pydantic schemas that
            scripts/schema_to_iceberg.py already converts to Iceberg DDL -- generating it would
            move it to the generated class and shrink the hand surface to models already under
            the Python gate. (2) config/agent/verification_registry/registry.yaml (3,252 eff, 264
            append-only entries): the control is CD.29's mark-then-drop retirement plus archival
            lifecycle -- change the lifecycle, not the cap; a mid-workflow cap would wedge
            graduation. (3) docs/decisions-index.json: already generated; its size is governed at
            the producer via the corpus ceilings. Production-change is relief valve seven and the
            preferred long-term valve for all three.
          basis: ["scripts/schema_to_iceberg.py:1-8", "CD.29 retirement discipline", "Decision 160 point 9"]
        - question: "If Q2 unifies the unit, what happens to the prose regime?"
          answer: >-
            The regimes stay deliberately two-unit: effective-lines-plus-line-length for
            structural classes, bytes for ambient prose -- because their relief valves are
            opposite (decompose vs never-fragment) and their load models differ (edit
            comprehension vs ambient read cost). A future markdown decision inherits bytes for
            ambient surfaces and may adopt effective lines for structural markdown; nothing here
            forces convergence. One short paragraph, per the brief: divergence is retained,
            knowingly.
          basis: ["prose_limits.py:13-20", "config/prose_budgets.yaml header"]
        - question: "What does the fixed-floor choice cost?"
          answer: >-
            The floor (deepseek.v3.2 execution tier) governs some surfaces more tightly than
            their real editors require: the 5 grandfathered terraform files are edited in
            Opus-tier /implement sessions today, and workflow_outputs -- 82 percent of the
            over-limit population -- is authored and read almost exclusively by frontier-tier
            sessions. The exemption for workflow_outputs is argued on edit-pattern grounds
            (NS-A quarantine respected), so the floor's residual cost lands on the 12
            grandfathered files' drain work, which would be unnecessary if governance keyed to
            the actual consumer roster. That cost is accepted: it is the price of a rule that
            survives roster changes without renegotiation. Cost disclosure only; the floor is
            settled.
          basis: ["scripts/llm/utils.py:29-30", "census: 71 of 87 over-limit files are workflow_outputs"]
        - question: "What is the base rate of the harm (lower-tier mis-edits of large non-Python files)?"
          answer: >-
            Zero observed instances in non-Python classes. Evidence sweep: no ci_rca or open
            recommendation attributes a defect to model comprehension failure on a large
            .tf/.yaml/.yml/.sh file. Nearest observations: (a) executor-era size-capability
            couplings on PYTHON -- rec-242 (auto-escalate gpt-4.1 to Sonnet for target files over
            10 KB, closed) and rec-285 (escalate above a SLOC threshold, closed) -- size-driven
            degradation was real enough to build routing around; (b) agent-authored structural
            defects in large YAML (rec-2749, rec-2762: malformed closes_criteria refs in plan
            files) caught by SCHEMA gates, not size gates; (c) Decision 128's convergence_health
            account, which is Python. The expansion is therefore PREVENTIVE on an assumed harm --
            a defensible engineering choice, stated plainly -- and this fact lowered Q6's
            migration aggressiveness (calm one-time grandfather, no urgent waves) and capped
            finding severities below critical.
          basis: ["rec-242", "rec-285", "rec-2749", "rec-2762", "Decision 128 problem statement"]
        - question: "MARKDOWN OBSERVATION (the whole of markdown's presence in this audit, per THE MARKDOWN RULE)"
          answer: >-
            (a) Decision 43's .prompt.md row (3,000 lines) is LIVE -- 12 tracked files (7 under
            .github/prompts/scheduled/, 5 under config/agent/executor/prompts/, largest 155
            effective lines) -- and NO check enforces it: validate_prompt_files asserts H1/section/
            reference structure only and covers only the scheduled directory;
            config/prose_budgets.yaml carries no .prompt.md entries; the enforcement configs
            Decision 43 names (config/agent_governance.yaml, config/agent_tool_tiers.yaml) do not
            exist on disk. The .agent.md row (1,500 lines) is by contrast a dead letter: zero
            tracked files. Filed as SGE-06 (surface: shared). (b) docs/ROADMAP-PRODUCT.yaml's
            header states it SUPERSEDES docs/ROADMAP-PRODUCT.md, 'retained for one transition
            cycle as a recovery artefact' -- a retiring duplicate governed differently from its
            successor purely by extension, which is a question about how governance handles
            transition windows (the .md twin is prose-allowlisted and size-ungoverned; the .yaml
            successor falls in the roadmaps class).
          basis: [SGE-06, "docs/ROADMAP-PRODUCT.yaml:8-9", "docs/DECISIONS.md:5134-5135"]
        - question: "(recon extension) Does the .yml/.yaml extension split threaten extension-keyed classification?"
          answer: >-
            Yes, mildly, and it is owned: rec-2928 (open) records 27 straggler .yml files and a
            live regex bug they already caused. The engine's globs must include both spellings
            until rec-2928 lands; .github/agents/schedule.yaml landing in ci_workflows by glob
            despite an agent-scheduling role is the same key-mismatch shape (flagged, immaterial
            to its verdict at 60 effective lines).
          basis: ["rec-2928", "census ci_workflows membership"]

  class_verdicts:
    generated:
      verdict: exempt-with-reason
      rationale: {transfer: does-not-transfer,
                  actual_purpose: "None at the artifact -- no agent hand-edits a generated file (the banner forbids it; the regenerator overwrites it), so NS-A has no subject. Governance belongs on the producer: freshness/drift gates already exist (validate_decisions_index_freshness, schema_to_field_semantics --check, validate_lockfile_sync), and the corpus ceilings bound decisions-index.json at its source."}
      migration: {mode: class-exemption, drain_owner: "n/a", sequencing: "none -- exemption is keyed by the provenance test at classification time"}
      unit: n/a
      limit: n/a
      relief_valve: "Regenerate; fix the producer (valve 7). Population counted against the incumbent 500-effective-line rule, not a proposed limit: 2 of 8 members over (docs/decisions-index.json 2,245; config/lambda/ducklake/field_semantics.yaml 508)."
      population_over_limit: 2
      confidence: CONFIRMED
    terraform:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "A lower-tier model editing IAM-dense HCL must hold the whole file: a collateral mis-edit here is a production security event (trust policy, boundary, grant), not a test failure. The coverage half has no referent; plan-review plus the apply gates play that role."}
      migration: {mode: one-time-grandfather, drain_owner: "human-planned /plan recs (executor frozen, Decision 67); terraform's native multi-file roots make decomposition semantic-free -- same module, N files, no reassembly cost", sequencing: "5 entries seeded with markers in the installing PR (iceberg_tables.tf 1491, github_ci_apply.tf 695, oidc.tf 682, data_pipeline.tf 655, platform_roles.tf 587); iceberg_tables.tf prefers the producer change (Q8: schema_to_iceberg.py) over decomposition"}
      unit: effective-lines
      limit: 500
      relief_valve: "decompose by resource family (native .tf multi-file); change the producer (iceberg_tables.tf); loud cited raise"
      population_over_limit: 5
      confidence: CONFIRMED
    config:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "Registries agents append to must surface lifecycle pressure instead of accreting silently: verification_registry/registry.yaml (3,252 eff, 264 entries) grows one graduated entry per plan with no retirement exercised; dq manifests (522) are hand-edited semantic surfaces. The cap converts unbounded growth into a periodic, reviewable lifecycle decision."}
      migration: {mode: one-time-grandfather, drain_owner: "registry.yaml drains via a designed archival/retirement lifecycle (CD.29 mark-then-drop), filed as its own rec -- NOT via file-splitting; the dq manifest drains by row compaction or a cited raise", sequencing: "2 entries seeded with markers (registry.yaml 3252, config/agent/data_quality/decisions/ops_recommendations.yaml 522)"}
      unit: effective-lines
      limit: 500
      relief_valve: "archive/retire entries per lifecycle (valves 4/5); compact resolved rows; loud cited raise; decompose only where cohesion permits"
      population_over_limit: 2
      confidence: CONFIRMED
    contracts:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "Contracts are the densest agent-consumed field semantics in the repository and are hand-amended (amendment logs, governance notes). Grain is already one-subject-per-file (Decision 86 collocation); the cap guards against amendment-log accretion turning a contract into a monolith an editing agent cannot hold."}
      migration: {mode: one-time-grandfather, drain_owner: "human-planned; drain by compacting superseded amendment-log entries (valve 4) or deferring detail to an auxiliary file (valve 3) -- never by splitting one table's semantics across files", sequencing: "2 entries seeded (iam-simulate-fixture.yaml 584, ops_recommendations.yaml 556)"}
      unit: effective-lines
      limit: 500
      relief_valve: "compact amendment history; defer detail (valve 3); loud cited raise; splitting a single subject is forbidden by collocation doctrine"
      population_over_limit: 2
      confidence: CONFIRMED
    ci_workflows:
      verdict: extend-calibrated
      rationale: {transfer: needs-distinct-rationale,
                  actual_purpose: "Two-unit risk: file size tracks job sprawl, but the unit that produced a real incident (rec-2923) is the inline run: body -- and Decision 162's R3 ratchet covers only .github/actions/**, leaving 15 inline bodies in reconcile.yml alone ungoverned. File cap at 500 eff plus extending R3-style body governance to workflow files covers what either alone cannot."}
      migration: {mode: one-time-grandfather, drain_owner: "human-planned; drain by extracting inline bodies to scripts (the Decision 162 shape) and splitting reusable jobs", sequencing: "2 entries seeded (reconcile.yml 536, terraform-apply-sandbox.yml 529); R3 workflow extension is SGE-03's proposed change and seeds its own body baseline"}
      unit: effective-lines
      limit: 500
      relief_valve: "extract inline bodies to delegate scripts; split jobs into reusable workflows; loud cited raise. Glob note: .github/agents/schedule.yaml lands here by glob though its role is agent scheduling -- immaterial at 60 eff, recorded for the role-vs-extension key discussion (DD-C)"
      population_over_limit: 2
      confidence: CONFIRMED
    shell:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "Hooks and wrappers run at every session bootstrap and CI step; a mis-edit breaks the harness itself. Population is healthy (max 106 eff) -- extending now forecloses debt before it exists, at zero migration cost."}
      migration: {mode: reject, drain_owner: "n/a -- zero over-limit population", sequencing: "none needed; the installing PR is green with an empty roster for this class"}
      unit: effective-lines
      limit: 500
      relief_valve: "extract functions to sibling scripts; decompose"
      population_over_limit: 0
      confidence: CONFIRMED
    lambda_manifests:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "Packaging descriptors drive deploy gating (compute_affected_artifacts); small by construction (max 67 eff). Implicit-500 costs nothing and prevents a manifest becoming a dumping ground for per-Lambda config."}
      migration: {mode: reject, drain_owner: "n/a -- zero over-limit population", sequencing: "none needed"}
      unit: effective-lines
      limit: 500
      relief_valve: "relocate payload config to config/lambda/<name>/ (the existing three-zone layout)"
      population_over_limit: 0
      confidence: CONFIRMED
    roadmaps:
      verdict: extend-calibrated
      rationale: {transfer: needs-distinct-rationale,
                  actual_purpose: "A monotonic work-list structurally cannot meet 500; its load problem is /plan-time read cost, governed by a per-file ceiling plus the PROVEN compaction lifecycle (Decision 147 reclaimed 2,667 lines in place). The principled boundary that lets ROADMAP-PLATFORM.yaml stand while the class is capped: PLATFORM's single-file 10,000-line treatment is a Decision 114/147 exception granted to how that roadmap currently exists -- decision-cited grandfathering, the same shape as every raise marker -- and explicitly NOT a precedent for future roadmap files, which enter under the class ceiling (requester position, recorded)."}
      migration: {mode: one-time-grandfather, drain_owner: "compaction waves per Decision 147's durable norm (terminal content compacts); rec-2781 (open) owns the anti-regrowth guard", sequencing: "ROADMAP-PRODUCT.yaml (4,707 eff, currently NO ceiling despite being schema-validated in both tiers) gets a seeded ceiling of 6,000 effective lines; ROADMAP-SEMANTO.yaml (134) sits under the class ceiling; PLATFORM unchanged under Decision 114"}
      unit: effective-lines
      limit: 6000
      relief_valve: "compact in place (valve 4, proven); archive terminal items (valve 5, named by Decision 147's own reversal conditions); loud cited raise; per-tier split is FORBIDDEN (Decision 110/114). population_over_limit counted vs the incumbent 500 rule for cross-class comparability: 2 (PLATFORM 8,195; PRODUCT 4,707); vs the proposed 6,000 ceiling: 1 (PLATFORM, which stands under its own Decision)"
      population_over_limit: 2
      confidence: CONFIRMED
    workflow_outputs:
      verdict: exempt-with-reason
      rationale: {transfer: does-not-transfer,
                  actual_purpose: "Exempt on PRODUCTION-PATTERN grounds, not consumer tier (NS-A quarantine respected). DD-D traced the lifecycle: plans are produced whole by /plan (with in-session critique revisions), then post-merge edits are narrow FIELD FLIPS -- /implement's graduate-to-waive disposition flip and closes_criteria bookkeeping -- whose working set is the target entry, located by search, never whole-file comprehension; audits are write-once; OVERSEER ledgers take per-slice status appends at runtime. No agent performs the whole-file comprehension edit NS-A protects. A cap would wedge /plan and /audit (their deliverables measure 500-2,105 eff; this audit's own YAML is 987) or force brief-fragmentation (NS-D). The honest controls: RS-07 archival lifecycle (docs/CLAUDE.md), schema validation on plans (validate_plan_documents -- which also blocks the dumping-ground evasion: a registry masquerading as a plan fails plan schema), and placement guards. Recorded residuals: audits/ has no schema gate, and the class contains the repository's most extreme byte/line divergence (OVERSEER report, 782 B/eff, 8,211-char lines) -- known costs of exemption, disclosed not gated."}
      migration: {mode: class-exemption, drain_owner: "n/a", sequencing: "RS-07's lagged .yaml archival sweep proceeds on its own schedule; not this audit's work"}
      unit: n/a
      limit: n/a
      relief_valve: "archival lifecycle (RS-07); population counted vs the incumbent 500 rule: 71 (docs/plans 49, audits 22) -- 82 percent of the whole affected population, which is why DD-D is the single most consequential determination in this audit"
      population_over_limit: 71
      confidence: CONFIRMED
    test_fixtures:
      verdict: exempt-with-reason
      rationale: {transfer: does-not-transfer,
                  actual_purpose: "Fixture content is captured data asserted against, sometimes byte-for-byte -- tests/fixtures/terraform_apply_guard/clean_create_real.json is one 1,141-char line of REAL terraform plan JSON. A size gate here fires on files carrying no editing-comprehension load (the test reads them selectively) and pressures trimming captured reality to satisfy a formatter -- the NS-B tax case. Population is 0 over anyway."}
      migration: {mode: class-exemption, drain_owner: "n/a", sequencing: "none"}
      unit: n/a
      limit: n/a
      relief_valve: "n/a; population vs incumbent 500 rule: 0 of 11"
      population_over_limit: 0
      confidence: CONFIRMED
    data_query:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "Implicit-500 backstop over miscellaneous structured files (settings JSON, pyproject/toml, tracked jsonl journals). The hand-edited members (settings, toml) get the standard comprehension rationale; the tracked executor-era journals (logs/*.jsonl, max 330 eff) get the RIGHT pressure when they breach: rotation/archival per the warehouse invariant (rec-257 adjacent), not splitting."}
      migration: {mode: reject, drain_owner: "n/a -- zero over-limit population", sequencing: "none needed; journal-breach relief documented as rotation, pre-empting a wedge"}
      unit: effective-lines
      limit: 500
      relief_valve: "rotate/archive journals; relocate config detail; loud cited raise"
      population_over_limit: 0
      confidence: CONFIRMED
    residual:
      verdict: extend-uniform
      rationale: {transfer: transfers-comprehension-only,
                  actual_purpose: "The default row: any tracked file matching no named class is governed at implicit 500 effective lines. When a NEW file class appears after this Decision lands, it is governed by default at the Python limit until a Decision classifies it -- govern-by-default was chosen over block-until-classified because a wedge on unclassified files fails NS-C (no relief valve at introduction time), and over leave-ungoverned because that re-opens the day-one gap this table exists to close. Current residual population: 33 files, 1 over (docs/intent-migration/MANIFEST.yaml, 521 eff, a retiring artifact owned by T5.5)."}
      migration: {mode: one-time-grandfather, drain_owner: "MANIFEST.yaml retires with the T5.5 intent-migration waves; no separate drain work", sequencing: "1 entry seeded with a marker"}
      unit: effective-lines
      limit: 500
      relief_valve: "classify the new class properly (add a table row) or comply; MANIFEST.yaml drains by retirement"
      population_over_limit: 1
      confidence: CONFIRMED

