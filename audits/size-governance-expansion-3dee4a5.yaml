  draft_decision:
    number: "NNN -- allocate at merge time, do not guess"
    title: "Structural-size governance extends beyond Python: one parameterized ratchet engine over a classified file taxonomy (completes Decision 43's declared scope; builds on 102/128/130)"
    status: Proposed
    problem: >-
      Decision 43 declared structural limits "across all repository code, prompts, and agents";
      Decision 130 extended the scan "whole-repo" -- but only for Python (iter_gated_py_files
      skips every non-.py file, and terraform's presence in _SLOC_EXCLUDE_DIRS excludes Python
      under terraform/, not .tf files: no line gate has ever scanned them). Censused at 3dee4a5:
      552 tracked non-Python non-markdown files, 87 over 500 effective lines -- 71 of them
      workflow outputs, 12 of them hand-authored agent-edited surfaces (5 .tf including
      iceberg_tables.tf at 1,491; config/agent/verification_registry/registry.yaml at 3,252; 2
      contracts; 2 workflow files; docs/intent-migration/MANIFEST.yaml), plus ROADMAP-PRODUCT.yaml
      at 4,707 with no ceiling at all. The motivating harm (lower-tier mis-edits scaling with file
      size) is observed for Python (Decision 128; executor recs rec-242/rec-285) and UNOBSERVED in
      non-Python classes -- this extension is preventive, and its migration is sized accordingly.
    decision: >-
      (1) One engine, one registry, one guard: config/structural_size_budgets.yaml carries a class
      table (per class: include globs covering both .yaml/.yml spellings, provenance-override,
      unit, limit, direction, relief valves, recorded actual_purpose) plus flat per-file budgets;
      a new validate_structural_size_limits (both tiers, unscoped -- measured cost ~0.1s) enforces
      it and ONE validate_structural_size_budget_raises (pre_globs: the registry path) gates the
      permissive direction with Decision 128's marker grammar. Incumbent gates (SLOC, prose,
      roadmap, decisions, composite bodies) are UNCHANGED; a convergence path is recorded, not
      executed. (2) Classification is layered first-match-wins: exclusions (vendored dirs, .py,
      .md), then a provenance test (do-not-edit banner in first 10 lines, or a checked-in
      regeneration command, or a documented projection -- membership pinned in the table for known
      hybrids like config/sloc_budgets.yaml), then directory+extension globs, then a mandatory
      residual default row governing any unmatched tracked file at 500 effective lines
      (govern-by-default for future classes). (3) Limits: 500 effective lines for terraform,
      config, contracts, ci_workflows, shell, lambda_manifests, data_query, residual; roadmaps
      instead carry per-file Decision-114-parity ceilings (ROADMAP-PRODUCT.yaml seeded at 6,000
      effective lines; ROADMAP-PLATFORM.yaml continues unchanged under Decisions 114/147 -- an
      exception granted to how that roadmap currently exists, not a precedent). (4) Exempt by
      class, with recorded reasons: generated (no agent edits; govern the producer -- freshness
      and drift gates), workflow_outputs (production-pattern: produced whole per run, post-merge
      edits are narrow field flips; controls are RS-07 archival, plan schema validation, and
      placement guards), test_fixtures (captured-data fidelity; a cap is an NS-B tax). (5)
      Companion long-line guard: max line length 2,000 characters for governed classes (ruff
      already binds Python at 127); a line-based gate without it is satisfiable by line-joining.
      (6) One-time grandfather, Decision 130 clause 2 form: exactly 12 entries seeded at current
      size with raise-approved markers citing this Decision; no auto-seed ever; downward-only
      ratchet; drain via human-planned recs (terraform decomposition first -- multi-file roots are
      semantic-free; the verification-registry archival lifecycle second, designed per CD.29
      mark-then-drop, never file-splitting; iceberg_tables.tf prefers the producer change via
      scripts/schema_to_iceberg.py). (7) Each class row's recorded actual_purpose is load-bearing:
      when a purpose's referent dies (Decision 160 precedent), that row is retired or reshaped
      rather than raised. (8) The ci_workflows row additionally extends Decision 162's R3
      inline-body ratchet to .github/workflows/*.yml run: bodies, seeding a workflow-body baseline
      section in composite_action_body_baseline.yaml (or a sibling), because the file cap does not
      reach the incident-bearing unit (rec-2923's class). (9) Markdown remains wholly out of scope
      here; a future markdown decision inherits this taxonomy's shape, not its unit. Decision 43's
      .prompt.md row disposition (enforce at prose-regime parity or formally retire the row) is a
      clause for that future decision -- population today is compliant (max 155 effective lines).
    reversal_conditions: >-
      (a) The engine false-positives against a genuinely-conformant shape more than once per
      class-year: fix the classifier or the class row, never widen the marker escape. (b) A
      measured fast-tier budget breach attributes materially to the census walk: move the engine
      full-tier-only (the raise-guard stays fast-tier). (c) A class row's recorded actual_purpose
      loses its referent (consumer rebuilt, workflow retired): retire that ROW, Decision-160
      style -- the engine survives its classes. (d) The grandfather roster shows net growth over
      any 90-day window (Decision 159/161 form): re-audit the gate design rather than raising
      budgets. (e) If the assumed NS-A harm is ever OBSERVED in a governed class, revisit Q6's
      calm sequencing toward active drain waves.
    rationale: >-
      The ratchet family is sound where it is shape-generic (registry, implicit default,
      one-directional movement, marker-gated raises, bounded grandfathers -- proven end to end by
      rec-2709 draining Decision 130's 24-file roster) and Python-specific exactly where the
      relief valves live: the repository already operates six distinct valves, and each class is
      assigned its honest one rather than inheriting decompose-into-a-facade. One parameterized
      engine rather than per-class replication because the raise-guard is already quintuplicated
      with three direction tokens (NS-F), and rather than folding in the incumbents because each
      incumbent ceiling names its own consumer and retirement trigger and migrating them buys no
      coverage. Exemptions key on provenance and production pattern -- never on which model reads
      a file (NS-A fixed-floor constraint): the workflow_outputs exemption rests on the traced
      edit pattern (field flips, not comprehension edits), the strongest single determination in
      this audit because that class is 82 percent of the affected population.
    related: >-
      Decision 43 (scope declared), 102/128 (ratchet+markers), 130 (whole-repo intent + grandfather
      form), 104 (registry pattern), 110/114/147 (roadmap single-file doctrine + compaction),
      127 (sanctioned prose taxonomy; class (d) artefacts), 131 (mirror convention -- explicitly
      no analogue created), 134/145/146/149/150/160 (size-governance family and its counter-
      lessons), 135 (fast-tier cost model), 159/161/162 (sibling ratchets; R3 extension), 84
      (warehouse invariants untouched), 67 (executor frozen -- drains are human-planned);
      T3.14 (aggregate budget stays deferred, not duplicated), KG.11 (YAML split already
      adjudicated toward ceiling+guard), rec-2928 (.yml stragglers), rec-2974 (marker
      authorization gap), rec-2781 (roadmap anti-regrowth), rec-2709 (drain precedent, closed).

