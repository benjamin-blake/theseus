      - evidence
      - T3.19
      dedup_hit_count: null
      note: Tracked decisions and roadmap searched and inspected. Owners carry the general migration, not this complete
        remedy. Recommendation ownership cannot be verified without AWS; confidence is downgraded for that reason.
    effort: M
