  - id: CSF-07
    surface: S4
    affects_surfaces:
    - S4
    candidate_ref: null
    question: Q1
    dimension: VD3
    title: Graduated-check decay has no bounded detection latency until T3.7 lands
    evidence: scripts/checks/verification/validate_verification_registry.py:194; docs/contracts/verification-registry.yaml:244;
      config/agent/verification_registry/entries/deprecated/plan-obligations-enumeration-homed.yaml; config/agent/verification_registry/entries/deprecated/no-retired-ci-role-in-live-surfaces.yaml
    evidence_kind: observed
    current_behavior: The differential gate re-runs a graduated record only when that record is added or modified in
      the diff (validate_verification_registry.py:194-196). Git history at the audited base shows plan-obligations-enumeration-homed
      resident from b91b92b3 (2026-08-11) to 4b9d252b (2026-08-25), 14 days, and no-retired-ci-role-in-live-surfaces
      from c129ea2e (2026-07-24) to the same migration, 32 days; both were surfaced only because the sharding
      migration re-pointed the records (DD-A).
    ideal_behavior: A graduated check that goes permanently FAIL or permanently TRUE after admission is detected on a
      bounded clock by a named mechanism, without depending on an unrelated edit to its shard.
    gap: Under admitted-once semantics (Q1 verdict b) no built mechanism bounds the interval. T3.7 c1 (scheduled
      mutation testing on graduated-check targets) and c3 (registry orphan detection) are the owned remedy and are
      deferred_post_mvp.
    compensating_controls_considered: The modified-record differential (validate_verification_registry.py:27, :194-196)
      exercises only records present in the diff; for an untouched shard it never runs, so it would not fail if the
      defect were real. CD.12 mark-then-drop retirement acts only after something else has flagged the row.
    change_type: enforce
    proposed_change: Build T3.7 c1 and c3 as specified (scheduled mutation on graduated-check targets; registry orphan
      detection), alarm-not-gate, filing recs; record in verification-registry.yaml governance_notes that graduated
      means admitted at a commit and that post-admission detection latency is bounded only once T3.7 lands.
    acceptance: A graduated shard whose guard target is deleted, or whose check survives every mutant on its target,
      is flagged by a scheduled run within one schedule period without any edit to the shard.
    severity: high
    severity_rationale: Materially reduces the guarantee a graduated row carries (NS3), and the only compensating
      control fails the counterfactual for untouched rows. Not critical -- graduation is documented as admission,
      not standing health (verification-registry.yaml:244), so no reader is promised a live guarantee today.
    confidence: HYPOTHESIS
    roadmap_crossref:
      classification: planned-unbuilt
      item_ids:
      - T3.7
      - dec-176
      dedup_search_terms:
      - standing suite
      - never re-executed
      - mutation testing on graduated
      - orphan detection
      dedup_hit_count: null
      note: ROADMAP-PLATFORM.yaml hits are T3.7 (its c1/c3 exit criteria match the gap; deferred_post_mvp, unbuilt)
        and CD.29's meta-validation clause naming T3.7; DECISIONS.md hit is Decision 176, which fixes the registry
        shape and does not promise re-execution. Recommendation ownership cannot be verified without AWS; confidence
        is downgraded for that reason.
    effort: L
    depends_on: []
    sequencing:
      safe_to_queue_now: false
      blocked_behind:
      - T3.7
      note: The remedy is T3.7 itself, deferred_post_mvp; no portal recommendation filed.
  - id: CSF-08
    surface: S1
    affects_surfaces:
    - S1
    - S3
    candidate_ref: null
    question: Q5
    dimension: VD2
    title: >-
      A live consumer reads declared plan-to-criterion links from merged, unimplemented plans; clause 5
      edge durability does not cover that window
    evidence: >-
      scripts/platform_roadmap_state.py:85-135 (compute_followon_state); scripts/session/preflight.py:350;
      docs/DECISIONS.md Decision 197 clause 5; docs/ROADMAP-PLATFORM.yaml T4.5 exit criteria;
      config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_execution_plans; scripts/roadmap/plan_document.py:218
    evidence_kind: observed
    current_behavior: >-
      compute_followon_state globs every docs/plans/PLAN-*.yaml (454 at 5ce6e4b5; 152 parsed after the closes_criteria
      substring skip at :104-110) on every compute_state_dict call and reads each plan's declared closes_criteria to
      decide whether an open criterion on an in_progress item already has a merged plan in flight (needs_followon_plan).
      Measured 4.42s of a 4.36s call; roadmap-side gate evaluation ~0s; YAML load 0.55s. preflight.py:350 is the
      production caller; 40 test modules reach the path; a one-file edit to the module selects 137 test modules.
    ideal_behavior: >-
      The in-flight predicate is served by a named read over durable plan content, so no reader scans the plan
      directory and the predicate survives the T4.6 authority flip that retires PLAN-{slug}.yaml.
    gap: >-
      Decision 197 clause 5 makes edges durable only at the implementation squash-merge and states plan-declared edges
      are never the durable record. This consumer needs declared links from plans that have merged but not yet
      implemented -- exactly the window clause 5 excludes. ops_execution_plans today carries plan_text (VARCHAR) and
      steps, not a closes_criteria column, and its merge_key is rec_id alone, which human plans lack (T4.5 c4).
    compensating_controls_considered: >-
      T4.5 (deferred_post_mvp, behind T4.2 XL) extends ops_execution_plans to carry the plan document via git->warehouse
      ETL; because PlanDocument.closes_criteria is a first-class validated field, that ETL would carry the links as row
      CONTENT rather than as edges, satisfying this consumer without tripping merge_authored_edges_lossy. Decision 87's
      2026-08-19 amendment keeps human-plan residency timed to T4.6, so the control is planned, not live. The substring
      skip is a constant-factor mitigation already outgrown once (~350 to 454 files).
    change_type: clarify
    proposed_change: >-
      Record compute_followon_state as a named consumer of declared plan-to-criterion links in the clause-8 migration
      inputs, and require T4.5's ETL to project closes_criteria as queryable row content (or the plans-side named read
      to expose it) rather than relying on work_item_edges. Until then any interim fix caches at the compute_state_dict
      output boundary and never indexes docs/plans/ as a second plan-content surface (rec-4006, rec-4007).
    acceptance: >-
      The clause-8 migration design names the in-flight predicate's read path; a merged, unimplemented plan's
      closes_criteria are retrievable by named read without a directory scan; needs_followon_plan for a fixture
      in_progress item is identical before and after the read-path change.
    severity: medium
    severity_rationale: >-
      A design gap in migration inputs with a concrete remedy T4.5 can absorb. Not high because the consumer is served
      correctly today by the file scan and nothing is lost until T4.6 retires the files.
    confidence: HYPOTHESIS
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - T4.5
      - T4.6
      - dec-197
      - dec-087
      dedup_search_terms:
      - compute_followon_state
      - closes_criteria
      - needs_followon_plan
      - merge_authored_edges_lossy
      dedup_hit_count: null
      note: >-
        POST-AUDIT ADDENDUM 2026-09-22, authored in-session, not by the audited model. The reversal_trigger_assessment
        for merge_authored_edges_lossy (near_triggered false) stands only under the assumption that T4.5 projects
        closes_criteria as plan-row content; if its ETL carried execution metadata alone the trigger would bite. An
        earlier session conclusion that "the migration does not touch this hotspot" was verified against T4.23 (roadmap
        criteria) only and does not hold for T4.5 (plans). Recommendation-side ownership not re-checked.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind:
      - T4.5
      note: >-
        Design input now. The interim test-scoped cache (rec-4006) and the vacuous-scan guard (rec-4007) are filed as
        recommendations and do not wait on this.
