  - id: CSF-02
    surface: S2
    affects_surfaces:
    - S2
    candidate_ref: null
    question: Q4
    dimension: VD3
    title: Run grain does not specify retry identity or nondeterminism preservation
    evidence: docs/ROADMAP-PLATFORM.yaml:7342; docs/audit-prompts/AUDIT-criterion-shape-forks.md Section 10.3
    evidence_kind: static
    current_behavior: Evidence grain is criterion version, leg, run; pass/fail/skipped outcomes do not specify attempts
      or aggregate semantics.
    ideal_behavior: A failing attempt followed by a passing retry on the same tree remains detectable as nondeterministic.
    gap: If run means whole VP step, attempts collide; if run means attempt, the relation and order between retries
      are unspecified.
    compensating_controls_considered: T3.15 PR table records attempts and would catch the behavior there; it cannot
      constrain a new evidence writer or its reducer absent an explicit import contract.
    change_type: add
    proposed_change: Define run as one immutable attempt, with execution-group id, attempt ordinal, tree/environment
      identity and uniqueness/idempotency rule. Preserve all attempts and derive nondeterminism across unchanged-tree
      retries.
    acceptance: A fail then pass on an unchanged tree remains a nondeterministic group, duplicate delivery inserts
      no extra attempt, and out-of-order arrival does not silently turn it green.
    severity: high
    severity_rationale: Materially weakens what the proposed proof can establish; no matching downstream check is
      specified.
    confidence: HYPOTHESIS
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - T3.15
      - T3.19
      - T4.23
      - dec-197
      dedup_search_terms:
