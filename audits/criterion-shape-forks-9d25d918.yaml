  - id: CSF-06
    surface: S1
    affects_surfaces:
    - S1
    candidate_ref: null
    question: Q3
    dimension: VD2
    title: The proposed business-key alternatives conflate parent, criterion and version identity
    evidence: docs/contracts/data-modeling-standard.yaml:68; docs/contracts/data-modeling-standard.yaml:73; scripts/platform_roadmap_models.py:104;
      docs/audit-prompts/AUDIT-criterion-shape-forks.md Section 10.2
    evidence_kind: static
    current_behavior: Proposal lists :cN / rec-NNNN / check_id under a business key and says SCD2 with parent.
    ideal_behavior: Every child has a stable parent-relative criterion key independent of both parent and child version-row
      ULIDs.
    gap: A recommendation id alone cannot distinguish multiple criteria; an SCD2 parent version ULID changes on revision;
      check_id is an optional link, not universal criterion identity.
    compensating_controls_considered: Writer ULID uniqueness prevents duplicate row identities but cannot prevent
      an incorrect merge from collapsing two logical criteria.
    change_type: clarify
    proposed_change: Use an immutable logical parent identity plus opaque authored criterion_id as merge key. Mint
      separate version ULIDs at the writer, retain an explicit parent-version FK where needed, and bind evidence to
      the exact criterion version. Pin bare ids at migration with a mapping; never renumber cA-cF or off-position
      cN.
    acceptance: Two criteria on one recommendation remain separate across parent revisions; a text rewrite versions
      the same criterion; evidence never reattaches to a newer claim merely because its business key matches.
    severity: high
    severity_rationale: 'High because key ambiguity could collapse logical siblings if adopted. Not critical: Decision
      197 explicitly defers the keys and no irreversible migration is authorized or underway; the design walk remains
      the downstream review boundary.'
    confidence: HYPOTHESIS
