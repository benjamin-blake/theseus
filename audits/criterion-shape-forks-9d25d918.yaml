  - q: Q4
    verdict: two-tables-evidence-journal
    basis:
    - CSF-01
    - CSF-02
    - CSF-06
    precedent:
    - ops_smoke_events (append-only kernel smoke table, not per-criterion domain precedent)
    - T3.15 PR-body VP compliance table (prose evidence precursor, not immutable journal)
    - ops_execution_plans (SCD2 child keyed on parent rec_id plus revision, current = latest revision per rec_id,
      storage-substrate.yaml:79-92, grain :87 -- the criteria-table precedent for "SCD2 with its parent", distinct
      from the evidence-journal search)
    adapter_split:
      splits: false
      local_verdict: two-tables-evidence-journal
      cloud_verdict: two-tables-evidence-journal
      note: Same logical tables and named-port API for both. Local catalog writes in process, no warehouse round-trip.
        Cloud transactions and snapshot reads must span claim/evidence; local uses its catalog transaction. Latency
        and write-amplification are unmeasured; no AWS access.
    prose: Prefer independent evidence grain because repeated observations must not force a new requirement version.
      This is an architectural judgment, not a 7-to-2 vote. One-table SCD2 can retain proof history and has cheaper
      current reads; it is not inherently CRUD. Two tables need a transactional writer, version-scoped named reads,
      immutable artifact references and explicit reducer. The fully-qualified work_item_criterion_evidence name is
      unambiguous beside CI artifact-retention and CI-RCA bundle contracts. No production per-criterion journal exists
      in the enumerated repository inventory; smoke infrastructure and PR tables are limited precedents. For the criteria table itself, ops_execution_plans
      (one row per (rec_id, revision), current = latest revision per rec_id) is the SCD2-with-parent sibling, so
      design_time_walk step 8's existing-sibling exemption may apply to work_item_criteria; the evidence table has no
      sibling and remains the one new table to escalate.
    external_checklist:
    - design: one-table
      property: P1
      rating: partial
      evidence: SCD2 versions can retain old proof snapshots; trades independent event grain for one-row proof reads
        and atomic updates. A version-history audit detects overwritten states if every proof update versions the
        row. https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
    - design: one-table
      property: P2
      rating: partial
      evidence: A widened SCD2 dimension buys no-join reads; enforced version creation preserves historical association
        but mixes requirement and run revision cadence. https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/type-2/
    - design: one-table
      property: P3
      rating: partial
      evidence: A version per run preserves history at write-amplification cost; require run identity and retained
        versions to detect a missing retry. https://buildkite.com/docs/pipelines/configure/tests/test-suites
    - design: one-table
      property: P4
      rating: partial
      evidence: A typed nested proof can distinguish actor/activity/entity without separate tables; validates these
        roles while buying atomic claim-proof writes. Current struct is underspecified. https://www.w3.org/TR/prov-primer/
    - design: one-table
      property: P5
      rating: partial
      evidence: Distinct typed claim/argument/evidence substructures can preserve logical separation in one physical
        row; field-level references must be validated, buying single-row consistency. Neither physical design is itself
        a complete assurance case. https://scsc.uk/gsn-standard
    - design: one-table
      property: P6
      rating: missed
      evidence: No expiry, renewal or bounded quarantine lifecycle is specified; a rec link does not exercise expiration.
        P6 is the brief's design bar, not a universal industry grain. https://buildkite.com/docs/pipelines/configure/tests/test-suites/test-state-and-quarantine
    - design: one-table
      property: P7
      rating: missed
      evidence: Neither candidate defines mutation-score retention or an equivalent continuing adequacy contract;
        one-time admission is insufficient. T3.7 owns future mutation testing but is unbuilt and is not a current
        compensating control. Table consolidation/separation buys no reason to omit this independent property. https://research.google/pubs/practical-mutation-testing-at-scale-a-view-from-google/
    - design: one-table
      property: P8
      rating: met
      evidence: The consolidated current row permits one consistent row read; this does not ensure its retained proof
        is semantically valid. Section 10.2; https://ducklake.select/docs/stable/duckdb/advanced_features/transactions
    - design: one-table
      property: P9
      rating: met
      evidence: One claim/proof row update is atomic under the chosen transactional storage adapter. This is architectural
        atomicity, not proof truth. https://ducklake.select/docs/stable/duckdb/advanced_features/transactions
    - design: two-tables
      property: P1
      rating: met
      evidence: Append-only observations are distinct from authored criterion state; a projection can be rebuilt from
        retained events. Section 10.3; https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
    - design: two-tables
      property: P2
      rating: met
      evidence: Evidence refers to the criterion version surrogate, with stable logical identity separately retained
        (CSF-06). Type-2 dimension and fact grain are distinct. https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/type-2/
    - design: two-tables
      property: P3
      rating: partial
      evidence: Run facts are first-class, but attempt/group semantics need CSF-02. Trade a wide per-run aggregate
        for smaller observations; retained run_ref must expose every ordered attempt to detect a hidden failure. https://buildkite.com/docs/pipelines/configure/tests/test-suites
    - design: two-tables
      property: P4
      rating: partial
      evidence: criterion version/run/producer separate the roles; review booleans still need verifiable identity/order
        (CSF-01). Artifact dereference is the proposed inspectability control and must reject incompatible payloads.
        https://www.w3.org/TR/prov-primer/
    - design: two-tables
      property: P5
      rating: partial
      evidence: Claim and evidence are physically separate; argument remains in reviewed referenced artifacts/trace
        edges. Trades a full assurance graph for a bounded schema; reader must require and dereference the argument
        reference before an assurance claim. https://scsc.uk/gsn-standard
    - design: two-tables
      property: P6
      rating: missed
      evidence: Separation does not introduce expiry. Neither table specifies the bounded quarantine control CSF-04
        requires. https://buildkite.com/docs/pipelines/configure/tests/test-suites/test-state-and-quarantine
    - design: two-tables
      property: P7
      rating: missed
      evidence: Neither candidate defines mutation-score retention or an equivalent continuing adequacy contract;
        one-time admission is insufficient. T3.7 owns future mutation testing but is unbuilt and is not a current
        compensating control. Table consolidation/separation buys no reason to omit this independent property. https://research.google/pubs/practical-mutation-testing-at-scale-a-view-from-google/
    - design: two-tables
      property: P8
      rating: partial
      evidence: Buys independent histories at join cost. A named read pinned to one catalog snapshot detects/rejects
        mismatched versions; single-row no-join property is deliberately traded away. https://ducklake.select/docs/stable/duckdb/advanced_features/transactions
    - design: two-tables
      property: P9
      rating: met
      evidence: The repository's write primitive already spans tables in one transaction -- write_scd2 performs the
        history MERGE-on-ULID append, the current write-through and the ops_entity_counters advance between one
        BEGIN TRANSACTION and one COMMIT (src/common/ducklake_writes.py:128, :186-206; docs/contracts/ducklake_writer.yaml:49-58;
        docs/contracts/ops_entity_counters.yaml:109-112). A criterion revision plus its evidence row is the same
        mechanism extended by one table pair, so claim and proof advance in one write; Section 10.3 does not state it
        and the clause-8 walk must, with failure injection rolling back both. https://ducklake.select/docs/stable/duckdb/advanced_features/transactions
  - q: Q5
    answers:
    - question: When realized-differently text changes, what happens to identity?
      disposition: answered
      answer: Same criterion business key, new criterion-version ULID and explicit amendment provenance when intent
        is continuous. A genuinely different obligation receives a new criterion key and supersession link. Old evidence
        stays bound to its old version; no parent revision or content hash is the business key.
      basis:
      - CSF-01
      - CSF-06
    - question: Is rehomed a status or an edge?
      disposition: answered
      answer: 'Both: authored rehomed disposition on the source criterion and a typed destination edge. Join via the
        edge, not free-text met_by. Rehomed does not mean satisfied; destination keeps its own criterion identity
        and evidence. Existing ledger: exit-criteria-ledger.yaml:49-55.'
      basis: &id001 []
    - question: How is a criterion on a recommendation identified?
      disposition: answered
      answer: Writer allocates the type-prefixed work-item id and logical identity transactionally, then child identities
        in the same operation. An opaque criterion_id distinguishes siblings; version ULIDs are separate. Retry keys
        must preserve the original allocation. Decision 84:6788 and data-modeling-standard.yaml:68-77.
      basis:
      - CSF-06
    - question: What bounds criterion text?
      disposition: answered
      answer: Measured maximum 6581 characters and median 193.5 across 394 structured entries. Use lossless TEXT,
        with a separately justified payload-byte limit and rejection rather than truncation; no arbitrary short VARCHAR.
        Large specifications may use content-addressed references while keeping a sufficient requirement statement.
      basis: *id001
    - question: Does the shape complicate the clause-7 vocabulary rename?
      disposition: answered
      answer: Neutral if business keys are opaque and owners are generic work-item references; the proposed quarantine
        rec-id coupling must be generalized. Existing legacy rec-NNNN values may survive as namespaced identifiers,
        not rec-specific columns or verbs. The audited base has 332 tracked files mentioning file_rec/update_rec,
        versus the historical 323. Rename ports with the model, preserving closed named verbs.
      basis:
      - CSF-04
    - question: Where does an escaped defect re-enter?
      disposition: answered
      answer: Append a refutation/escaped-defect observation linked to exact criterion version and discovering work
        item. A named resolver reopens/re-adjudicates satisfaction; reducer invalidates current proof while retaining
        earlier evidence. Do not auto-rewrite historical met claims.
      basis:
      - CSF-01
    - question: How do retries, duplicate delivery and late evidence affect proof?
      disposition: answered
      answer: Use execution-group and ordered attempt ids; deduplicate repeated delivery at writer boundary; preserve
        fail then pass as nondeterministic on the same tree. Late evidence cannot silently outrank newer incompatible
        versions.
      basis:
      - CSF-02
    - question: How are claim/evidence snapshots kept consistent on both adapters?
      disposition: answered
      answer: One named writer transaction for a satisfaction advance and its supporting evidence reference; independent
        observations may arrive separately but cannot advance satisfaction. Named reads use one snapshot and return
        the criterion-version and proof-as-of token. Fault-injection parity tests remain a clause-8 obligation.
      basis: *id001
    - question: What survives artifact expiry or access loss?
      disposition: answered
      answer: Retain a content digest, typed result summary, producer and version linkage in the journal; a run_ref
        is not sufficient durability. Unavailable required artifacts yield unavailable/unmeasurable proof rather than
        pass. Redact confidential payloads at the writer and keep access policy adapter-specific.
      basis:
      - CSF-01
    reversal_trigger_assessment:
      verdict: not-tripped
      nullable_column_count: 12
      which_columns:
      - column: evaluator_kind
        null_for: both
      - column: primitive_slot
        null_for: epic-shaped
      - column: check_spec
        null_for: both
      - column: guard_target
        null_for: both
      - column: guard_symbol
        null_for: both
      - column: hermetic
        null_for: both
      - column: phase
        null_for: both
      - column: severity
        null_for: epic-shaped
      - column: disposition
        null_for: both
      - column: graduated_check_id
        null_for: both
      - column: plan_slug
        null_for: both
      - column: authored_at_sha
        null_for: both
      rationale: Ten of these 12 values are absent from native ExitCriterion and recommendation acceptance
        representations on both parent kinds; primitive_slot and severity are null for epic-shaped items only, because
        the task-shaped parent's acceptance contract already admits list[TypedCheck] with type (the CD.29 slot) and
        severity (ops_recommendations.yaml:294-296), although today's rec population never uses the typed form (E4
        could not be re-measured here; the brief reports zero list-form rows). Assigning defaults or inferring them is
        not observation. This is origin/method sparsity,
        not incompatible required fields of epic versus task parents. A criterion-specific discriminated verification-method
        payload (execution/review/unresolved-legacy) absorbs applicable method fields, while provenance remains version-bound.
        Nullability alone does not meet the trigger's cannot-absorb condition. No third work-item kind is necessary;
        a plan remains a separate entity. Count includes exactly one registry FK spelling; optional waiver companions
        would be additional physical fields if flattened.
      basis:
      - CSF-03
      other_conditions:
        executor_needs_tier_items_pre_mvp:
          near_triggered: false
          rationale: No demonstrated MVP iteration requiring tier items. T4.3 permits rec-only population behind a
            kind-generic port; T4.23 remains deferred. Reassess on a concrete blocked iteration, not line pressure.
        merge_authored_edges_lossy:
          near_triggered: false
          rationale: Plan-declared edges preserve information until merge if merge consumes the exact merged plan
            and atomically/idempotently records clause/criterion references before archival. No measured loss is shown.
            A merge implementation that reconstructs edges only from trailers would approach this trigger.
    deferred_walk_inputs:
      merge_key:
        verdict: parent-plus-criterion-id
        value: '[work_item_identity, criterion_id]'
        rationale: Use immutable logical parent identity, never its changing SCD2 version surrogate. Opaque criterion
          ids survive text amendments; version ULID remains row identity.
        basis: []
      join_keys:
        verdict: evidence-table-fk
        targets:
        - work_items
        - work_item_criteria versions
        - work_item_criterion_evidence
        - git verification registry (plan_slug, check_id, git_ref)
        - plan revisions
        - work_item_edges
        - ops_execution_plans (via met_by, the ledger's declared forward FK -- exit-criteria-ledger.yaml:97-99)
        rationale: Evidence carries criterion_version_ulid; criterion joins parent logical identity and explicit parent
          version when provenance requires it. The ledger already reserves met_by as a future ops_execution_plans
          foreign key (exit-criteria-ledger.yaml:97-99), so a met criterion's resolving plan revision is an existing
          join target, not a new one. Preserve registry (plan_slug, graduated_check_id) as a cross-system
          link qualified by registry git ref. _joins.yaml:12 defines logical, not engine-enforced FKs; register these
          new joins there during migration.
        basis: []
      partition_column:
        verdict: created_timestamp
        applies_to:
        - work_item_criteria
        - work_item_criterion_evidence
        rationale: Follow the existing SCD2 envelope rather than a new column. created_timestamp is minted by
          ducklake_runtime._derive_fields(), never caller-supplied, carried unchanged on UPDATE, and partitions every
          history table via day(created_timestamp) with the current table on bucket(8, <merge key>)
          (ops_recommendations.yaml:500-508, :567; field_semantics.yaml:454-461 for ops_execution_plans). So
          work_item_criteria history is day(created_timestamp) and its current projection is
          bucket(8, [work_item_identity, criterion_id]) per the merge_key above; work_item_criterion_evidence
          (append-only, history-only) is day(created_timestamp) as ingestion time. Keep occurred_at on evidence for
          late events and causal ordering -- occurred_at is a NEW column with no counterpart on any ops table and is
          not the partition column. Decision 137 requires partitioning on both adapters.
        basis: []
      current_projection:
        verdict: scd2-history-plus-type1-current
        rationale: Serving pick/read paths should not repeatedly window the full history. A transactionally maintained
          current projection is derivative, not a third independent source of truth. Evidence remains append-only
          without a mutable current fact table. The cloud adapter already maintains exactly this pair --
          write_scd2 writes the history append and the current write-through projection in one transaction
          (src/common/ducklake_writes.py:128; docs/contracts/ducklake_writer.yaml:49-51) and ops_execution_plans serves
          current = latest revision per rec_id (storage-substrate.yaml:87) -- so work_item_criteria reuses that
          primitive rather than a new projection mechanism.
        basis: []
      write_boundary:
        verdict: portal-writer-verb
        owner: 'proposed work-item storage-port writer: record_criterion_revision / record_criterion_evidence'
        rationale: A shared storage-port writer module owns allocation, validation, idempotency and the transaction
          for both adapters. Merge-time ingestion calls that verb; it is not a second writer. Name below is proposed,
          not existing. The proposed record_criterion_revision / record_criterion_evidence verbs extend the existing
          write_scd2 / file_scd2 primitive, which already commits the history append, the current projection and the
          ops_entity_counters allocation inside one BEGIN TRANSACTION / COMMIT (src/common/ducklake_writes.py:128,
          :186-206; docs/contracts/ducklake_writer.yaml:49-58; docs/contracts/ops_entity_counters.yaml:109-112); a
          criterion revision plus its evidence row is one more table pair inside that same transaction, not a second
          transaction model.
        basis: []
      tenancy:
        verdict: project-id-on-criterion-row
        rationale: Cloud adapter adds project_id to criteria, evidence, uniqueness scope and every join/read filter;
          local adapter is single-tenant and need not expose it. This is tenant isolation, not operator taxonomy.
          Time remains the physical partition axis, not an authorization boundary.
        basis: []
      read_boundary:
        verdict: both
        pick_surface_returns: kind-generic work item with stable identity, kind, criteria ids/version tokens, text,
          method, authored satisfaction, blockers and proof-as-of summary; history via named read
        rationale: Named pick returns a consistent bounded actionable criteria projection; a second named history/evidence
          read serves audit detail. No caller SQL. T4.3:c4's pick_rec spelling describes the existing seam, while
          Decision 197:35 pins destination pick_work_item; resolve spelling at implementation, not as a second API.
        basis: []
      dq_intent:
        verdict: per-field-dq-intent
        fields_with_not_null:
        - ulid
        - work_item_identity
        - criterion_id
        - recorded_at
        - text_origin
        - satisfaction
        - method_kind
        rationale: Require accepted_values on satisfaction, text_origin and method tag; validate disposition companions
          and leg/outcome compatibility conditionally. Text required for new authored claims, legacy unknown intent
          explicitly marked. Evidence requires criterion-version FK, run/attempt identity, leg, outcome and recorded_at;
          method payload requirements depend on kind. No broad execution_* DQ exemption imported from recs; cloud
          project_id not_null enforced in adapter.
        basis: []
  deep_dives:
  - id: DD-A
    feeds:
    - Q1
    - Q4
    basis:
    - CSF-01
    conclusion: 'Git -S history: plan-obligations-enumeration-homed entered at b91b92b3 on 2026-08-11 and retired
      at 4b9d252b on 2026-08-25 (14 calendar days); no-retired-ci-role-in-live-surfaces entered c129ea2e on 2026-07-24
      and retired at the same migration (32 days). Use commit dates, not authored graduated_at: the latter row claims
      2026-07-23. These are residence intervals, not measured continuous break durations. The first command compares
      scripts/CLAUDE.md size with origin/main; after base collapse it fails even with a healthy repository. The second
      negative grep still passes if forbidden strings remain absent; passing is not evidence that it detects regressions.
      Migration re-pointed records, selecting them for the new modified-record differential; this was incidental discovery,
      not scheduled surveillance. validate_verification_registry.py:14-46 compares IDs/mappings; :194-198 submits
      only added+modified records. verification_graduation.py:486 requires live PASS then baseline FAIL. Option a
      catches persistent live FAIL at next scheduled run, but TRUE requires mutation or a valid negative control;
      a simple green sweep never catches it. Option b detects neither on a bounded clock today; after T3.7, live baseline
      failure must surface as invalid mutation evaluation and an always-true check survives mutants, subject to target/slot
      support. Option c catches FAIL only on a future guard-target diff and may miss other dependencies forever; moving-base
      differential rejects an unchanged good check as well as TRUE. Therefore historical admission stays historical.
      No replay of historical shell payloads was claimed; static trace plus git dates establishes the detection mechanism.'
  - id: DD-B
    feeds:
    - Q4
    - Q5
    basis:
    - CSF-01
    - CSF-02
    - CSF-03
    - CSF-05
    conclusion: (a) ops_recommendations.yaml:289 stores scalar/list acceptance (command/check), :325 advisory verification,
      :340 routing tier, :416 write-only executor result; none is independently reviewed requirement intent. Do not
      elevate execution_result into trusted proof or import its DQ exemption. (b) ExitCriterion at platform_roadmap_models.py:73
      stores id,text,status,met_by,blocked_by; preserve authored status resolver, rehome destination and blocker-until
      semantics through typed edges/provenance. (c) VerificationStep at plan_document.py:69 carries step,phase,action,command,expected,fix_if,hermetic,graduation,check-id/waiver
      companions,expected_literals. New shape must preserve command expectations, parsing/version and waiver reason
      via method payload/source-plan revision; phase and primitive alone are lossy. (d) T3.15:c1/c4 stores command,truncated
      output,attempts,PASS/FAIL plus NONDETERMINISTIC in the PR body. This is an existing prose evidence precursor,
      but editable and not criterion-version-keyed, so not already an append-only journal. Preserve its attempt semantics
      during future ingestion. Tier floor is plan policy, not a criterion column. All four completion representations
      retain distinct semantics after unification.
  - id: DD-C
    feeds:
    - Q3
    - Q4
    basis:
    - CSF-06
    conclusion: 'Ledger identity is parent id plus opaque criterion id; bare strings alone normalize to c{i+1} with
      open status (platform_roadmap_models.py:98-107). Structured ids survive verbatim. E3 found cA-cF and ten off-position
      cN. The closes_criteria integrity gate (validate_platform_roadmap.py:135 onward) resolves parent:criterion pairs
      but cannot stabilize a reordered bare list across history. Recommendation ids are allocated by file_ops in-transaction
      (Decision 84:6788); ops_decisions.yaml:59 is the explicit caller-keyed exception, not a template for child allocation.
      A rec id is a parent key, a check_id is a registry key, and neither alone is a universal criterion business
      key. Authored local criterion ids plus immutable logical parent identity merge revisions; writer ULIDs identify
      physical versions; evidence FKs bind those versions. Do not derive completed bare rows as met: the actual fallback
      model probe returned open.'
