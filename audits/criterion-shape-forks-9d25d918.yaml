    current_behavior: Proposal reuses check/agent_surface to replace manual and LLM judgement.
    ideal_behavior: Every authored criterion has a resolvable method whose semantics cover deterministic execution
      or accountable review.
    gap: EvaluatorSpec identifies a contract reader, not a reviewer protocol or an evaluation result. A check_spec
      null iff agent_surface also cannot represent an unevaluated legacy criterion.
    compensating_controls_considered: Class D exactly-one-kind validation rejects ambiguous contract locators but
      would accept a surface that merely mentions a contract; it does not prove criterion evaluation.
