  question_answers:
  - q: Q1
    verdict: b-admitted-once
    basis: []
    prose: Endorse the existing admission meaning; no correction changes that meaning and no finding is needed to
      retain it. Keep the commit-local git registry and T3.7 scheduled mutation/dead-test policy as the declared future
      adequacy mechanism, not an already-live control. A periodic green run catches permanent FAIL but not permanent
