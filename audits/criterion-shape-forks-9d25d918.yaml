    dimension: VD3
    title: Proof applicability and review provenance need a reproducible reduction contract
    evidence: docs/contracts/verification-registry.yaml:244; docs/contracts/exit-criteria-ledger.yaml:57; docs/audit-prompts/AUDIT-criterion-shape-forks.md
      Section 10.3
    evidence_kind: static
    current_behavior: Proposal derives staleness from base reachability and target presence; review independence and
      ordering are booleans.
    ideal_behavior: A reader can identify exactly which claim, check, tree and environment were examined, and why
      later evidence invalidates applicability.
    gap: An ancestor base and an existing path survive changed behavior. Producer booleans alone cannot establish
      independent pre-implementation review or handle escaped defects.
    compensating_controls_considered: run_ref dereference proves availability, not relevant content; historical admission
      does not fail when a target changes without a shard edit.
    change_type: add
    proposed_change: Define version-bound evidence payloads with check-spec digest, observed tree/environment, reviewer
      identity and reviewed artifact, implementation boundary, recorded time, and supersedes/invalidation links. Add
      escaped-defect/refutation evidence or an equivalently typed linked event. Define a conservative reducer; missing,
      superseded or incompatible proof never becomes proven.
    acceptance: Fixtures with changed target content, changed criterion text, self-review, post-implementation review
      and an escaped defect cannot retain current proven status; historical admission remains visible.
    severity: high
    severity_rationale: 'High for underspecified applicability/provenance that materially weakens the evidence guarantee.
      Not critical: satisfaction remains separately authored with a resolver under NS2; the proposal does not demonstrate
      an automatic false-satisfied transition with no downstream review. This finding requires an explicit reducer
      before that possibility becomes live.'
    confidence: HYPOTHESIS
    roadmap_crossref:
