  findings:
  - id: GAL-01
    surface: CI-RCA retrieval pipeline
    question: Q1
    dimension: VD1
    maturity_categories:
    - workflows
    - log-pipeline
    title: CI-RCA can widen from failed-step logs to an unbounded whole-run log
    evidence: scripts/ci_rca/fetch_logs.py:91-106
    evidence_kind: static
    current_behavior: Each attempt first requests gh run view --log-failed, then falls back to gh run view --log without a byte or
      line bound and writes all stdout.
    ideal_behavior: Fallback preserves failure fidelity while bounding material by job, step, byte count, or a durable structured
      evidence artifact.
    gap: A run without failed-step output can force an agent-facing pipeline to ingest the entire run, and truncation outside this
      code can bias diagnosis.
    compensating_controls_considered: Failed-log-first retrieval and JUnit-first fingerprints reduce frequency, but neither bounds
      the whole-log fallback when it is selected.
    change_type: enforce
    proposed_change: Replace the whole-run fallback with a bounded jobs/steps selection and explicit truncation envelope that records
      omitted bytes and preserves a downloadable raw layer.
    acceptance: Tests prove maximum retrieved bytes/lines, distinguish truncation from complete evidence, and retain failed job/step
      identity and a raw recovery link.
    severity: high
    severity_rationale: Unbounded retrieval materially increases diagnostic cost and can yield incomplete context without a trustworthy
      truncation signal.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      confidence: HYPOTHESIS
      item_ids: []
      dedup_search_terms:
      - CI-RCA whole-log fallback
      - bounded Actions log retrieval
      - log truncation envelope
      dedup_hit_count: null
      note: Local recommendations cache was unavailable; targeted roadmap and Decision searches found no sufficient owner.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Independent pipeline hardening.
  - id: GAL-02
    surface: shared workflow presentation
    question: Q4
    dimension: VD7
    maturity_categories:
    - workflows
    - composite-actions
    - log-pipeline
    title: High-value diagnostic presentation conventions are only selectively enforced
    evidence: scripts/check_workflow_agent_safety.py:64-95|scripts/checks/ci_guards/validate_composite_action_manifests.py:58-85
    evidence_kind: static
    current_behavior: Focused validators catch masked Claude failures and illegal composite metadata expressions, but no risk-based
      rule requires stable diagnostic identifiers, named critical steps, or a decisive summary/annotation for governed failure paths.
    ideal_behavior: Mechanically enforce presentation only for governed or agent-consumed failure paths, leaving harmless stylistic
      variance alone.
    gap: Critical paths use good patterns, but new paths can omit the machine-addressable layer without failing presubmit.
    compensating_controls_considered: Existing targeted guards prove selective governance is feasible but do not exercise diagnostic
      completeness or stable identifiers.
    change_type: enforce
    proposed_change: Add a risk-based manifest contract and validator for governed/agent-consumed jobs requiring explicit names,
      stable diagnostic codes, and at least one bounded decisive surface.
    acceptance: Validator fixtures show governed paths fail when identifiers or decisive bounded surfaces disappear, while ordinary
      low-risk steps remain unconstrained.
    severity: medium
    severity_rationale: This is a governance and retrieval consistency gap; existing fail-loud controls reduce immediate outcome
      risk.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      confidence: HYPOTHESIS
      item_ids: []
      dedup_search_terms:
      - workflow diagnostic convention
      - stable diagnostic identifier
      - Actions presentation validator
      dedup_hit_count: null
      note: No sufficient structured owner found; degraded cache makes dedup hypothetical.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Define the risk set before enforcement.
  - id: GAL-03
    surface: .github/workflows/ci-rca.yml
    question: Q4
    dimension: VD6
    maturity_categories:
    - workflows
    - log-pipeline
    title: CI-RCA cites an unrelated Decision 143 as a log backstop authority
