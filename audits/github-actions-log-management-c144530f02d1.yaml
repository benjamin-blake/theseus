      applies_to:
      - workflows
      - log-pipeline
      rating: partial
      evidence: static inventory and rubric ratings
  - q: Q6
    answers:
    - question: Do diagnostic surfaces form a stable agent API?
      answer: 'Partly: stable error codes and artifacts exist, but no shared enforced envelope.'
      basis:
      - GAL-02
    - question: Can truncation bias diagnosis?
      answer: Yes; the whole-log fallback has no explicit truncation contract.
      basis:
      - GAL-01
    - question: Can artifact expiry prevent later RCA or dedup?
      answer: Yes; 1-day and 14-day retention are not tied to delayed-RCA requirements.
      basis:
      - GAL-04
    - question: Do fork PRs receive safe but useful diagnostics?
      answer: CI explicitly degrades provider-mirror access and reports the reason, but runtime verification was unavailable.
      basis:
      - .github/workflows/ci.yml:155-240
    - question: Can cancellation or concurrency obscure root cause?
      answer: Outcome types exist in GitHub metadata, but no repository-wide envelope distinguishes all terminal states.
      basis:
      - GAL-02
    - question: Does log-volume growth have a measurable budget?
      answer: No line/byte budget was found for CI-RCA ingestion.
      basis:
      - GAL-01
    - question: Are authority citations trustworthy?
      answer: Not uniformly; the CI-RCA Decision 143 citation does not match the decision subject.
      basis:
      - GAL-03
