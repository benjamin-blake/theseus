audit:
  meta:
    audited_commit: c144530f02d1  # pragma: allowlist secret
    base_branch: main
    model: GPT-5.6 Sol
    methodology_version: 1
    scope_surfaces:
    - workflows
    - composite-actions
    - log-producers-consumers
    - governance
    - sampled-runs
    degraded_dedup: true
    degraded_runtime: true
    contract_notes: 'Harness checkout had no origin remote. The requester confirmed HEAD c144530f02d17745829b8ebe8c9fb94692214279
      is current main and explicitly directed continuation. BASE_SHA was therefore pinned to c144530f02d1. Preflight could not establish
      origin/main equality. The gh CLI is absent, so the empirical pass could not run. The recommendations cache was absent, so all
      finding dedup confidence is HYPOTHESIS. Advisory presubmit `bin/venv-python -m scripts.validate --pre` completed all reported
      checks but exited 1 because the Fast tier exceeded its 5-minute budget (5.6 minutes; dominant phase: validate_verification_registry).
      The run also reported origin/main-dependent checks as local advisory skips because this harness has no origin remote. No audited
      surface was changed, per the audit write boundary; the validator filed rec-2875 for the budget breach.'
    stale_anchors:
    - old: .github/workflows/ci-rca.yml:164 Decision 143 mitigation
      resolution: Anchor resolves, but Decision 143 at docs/DECISIONS.md:641 governs privileged-verb Lambda decomposition; behavior
        mismatch recorded as GAL-03.
    runtime_evidence_gaps:
    - 'gh auth status: gh: command not found'
    - No recent-run metadata, annotations, summaries, artifacts, or logs could be sampled.
  question_answers:
  - q: Q1
    verdict: partial
    basis:
    - GAL-01
    - GAL-02
    - .github/workflows/ci.yml:64-147
    - scripts/ci_rca/fetch_logs.py:55-137
    prose: The system has annotations, summaries, artifacts, stable codes, and JUnit-first RCA paths, but the whole-log fallback
      is unbounded and conventions are not broadly enforced.
  - q: Q2
    verdict: partial
    basis:
    - GAL-01
    - .github/workflows/terraform-apply-sandbox.yml:158-194
    - .github/actions/write-convergence-record/action.yml:116-149
    prose: Governed paths frequently fail closed with actionable annotations, but decisive bounded evidence is not guaranteed across
      all failure paths.
  - q: Q3
    verdict: complete
    basis:
    - lifecycle_inventory
    prose: All 19 workflows and seven composite actions have a static trigger/caller and ownership or deliberate-retention rationale;
      runtime confirmation is degraded.
  - q: Q4
    verdict: partial
    convention_disposition: yes-risk-based
    basis:
    - GAL-02
    - GAL-03
    prose: Names are understandable despite harmless style variance. A risk-based convention is warranted for agent-consumed and
      governed failures, not full cosmetic uniformity.
  - q: Q5
    verdict: partial
    basis:
    - GAL-01
    - GAL-02
    - GAL-04
    prose: The repository leads on fail-closed controls and local reproducibility, but misses bounded raw-log discipline and a coherent
      retention policy.
