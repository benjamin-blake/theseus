  findings:
  - id: RLE-01
    surface: future_durable_personas
    question: Q6
    dimension: VD2
    title: Rust lacks a first-class Lambda Durable Functions SDK/runtime
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/durable-supported-runtimes.html
    evidence_kind: static
    current_behavior: AWS lists Node.js, Python, Java, and C# managed support; OCI images still require a durable execution SDK.
      Rust is absent.
    ideal_behavior: Every required T4.2 checkpoint/replay semantic uses a first-class supported SDK with test and operations guarantees.
    gap: A Rust persona would require a bespoke protocol/SDK compatibility layer not justified for MVP.
    compensating_controls_considered: A container image changes packaging but does not supply the missing Rust durable SDK. Self-checkpointing
      changes CD.27 semantics.
    change_type: clarify
    proposed_change: Keep T4.2 personas on a first-class supported language and make first-class Durable SDK support a Rust reconsideration
      gate.
    acceptance: T4.2 atomic plans name Python and reject Rust custom-runtime emulation unless AWS ships and the repository verifies
      first-class Rust Durable support.
    severity: high
    severity_rationale: Assuming regular-Lambda Rust equivalence would remove checkpoint/replay guarantees from the executor persona
      layer.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - CD.27
      - T4.2
      dedup_search_terms:
      - Rust durable SDK
      - Lambda Durable Functions runtime
      - checkpoint replay
      dedup_hit_count: 6
      note: CD.27 monitors maturity but does not govern worker-language compatibility.
    effort: XS
    depends_on: []
    sequencing:
      safe_to_queue_now: false
      blocked_behind:
      - T4.2 atomic planning
      note: Decision input, not implementation work.
  - id: RLE-02
    surface: lambda_build_deploy
    question: Q3
    dimension: VD6
    title: Lambda delivery contracts are Python-specific and have no governed Rust path
    evidence: scripts/lambda_manifest.py:26-40|scripts/test_coverage_checker.py:108-142
    evidence_kind: static
    current_behavior: Manifests model .py handlers and pip packages; test mapping and both deploy workflows install and build Python.
    ideal_behavior: A versioned language-neutral manifest preserves provenance, coverage, architecture, deploy records, and non-vacuous
      smoke gates.
    gap: Adding Rust today creates ungoverned or parallel build/test semantics.
    compensating_controls_considered: The existing per-artifact manifest is a strong unification point but its fields and builders
      are not language-neutral.
    change_type: unify
    proposed_change: Only if a Rust pilot is approved, version the manifest with language, target, entrypoint, dependency-lock, architecture,
      and build-command fields and extend the existing governed workflows.
    acceptance: Deleting or stubbing Rust feature code fails behavioral contract and smoke gates; reproducible target builds, provenance,
      coverage, and vulnerability checks share one manifest source.
    severity: medium
    severity_rationale: This is material delivery overhead but no Rust code exists and the gap does not affect current production.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-unbuilt
      item_ids:
      - CD.24
      - T4.1
      dedup_search_terms:
      - Rust manifest
      - Cargo Lambda
      - language-neutral Lambda manifest
      dedup_hit_count: 0
      note: CD.24 governs Python artifacts; T4.1 requires manifests but does not specify multi-language schema.
    effort: L
    depends_on:
    - RLE-01
    sequencing:
      safe_to_queue_now: false
      blocked_behind:
      - approved Rust production pilot
      note: Avoid speculative dual-language infrastructure.
  - id: RLE-03
    surface: future_deterministic_lambdas
    question: Q2
    dimension: VD3
    title: Repository lacks decision-grade Lambda performance and defect measurements
    evidence: docs/ROADMAP-PLATFORM.yaml:6656-6733|logs/.recommendations-log.jsonl sample 2026-07-27..29
    evidence_kind: observed
    current_behavior: No invocation-frequency, cold-start, duration, memory, package-size, or language-attributable defect baseline
      exists for the T4 workers or existing Lambdas.
    ideal_behavior: A production-language default follows comparable workload measurements and a defect taxonomy.
    gap: Rust latency, cost, and AI-defect benefits remain hypotheses; sampled recent defects were IAM, authority, service, documentation,
      or CI-budget classes.
    compensating_controls_considered: Python tests and static gates reduce baseline risk but do not measure Rust counterfactuals.
    change_type: persist
    proposed_change: Before reopening adoption, run one contract-identical regular-Lambda canary in Python and Rust and classify
      escaped defects against compiler/test/runtime controls.
    acceptance: Publish cold/warm p50/p99, memory, artifact, billed GB-s, build minutes, defect catches, and engineering time with
      rollback and a predeclared threshold.
    severity: medium
    severity_rationale: A mandate without measurements can delay MVP and optimize a negligible cost component.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-unbuilt
      item_ids:
      - T4.1
      dedup_search_terms:
      - Rust benchmark
      - Lambda language measurement
      - compiler defect taxonomy
      dedup_hit_count: 0
      note: T4.1 requires observability after implementation, not a pre-adoption comparison.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: false
      blocked_behind:
      - stable T4.1 worker contract
      note: Measure only when a representative contract exists.
