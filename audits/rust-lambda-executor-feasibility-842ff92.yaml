    degraded_dedup: false
    degraded_external_research: false
    degraded_adversarial_review: false
    contract_notes: 'git fetch origin main failed: no origin remote; no origin/main existed, so current HEAD substituted and repository-wide
      conclusions downgraded where not directly traced; preflight refreshed read cache successfully; manifest validation/list-patterns
      passed; expected test modules tests/test_ducklake_writer_handler.py and tests/test_ducklake_runtime.py were absent; enum-bearing
      fields manually compared with OUTPUT contract; validate --pre completed checks but exited 1 solely because fast tier exceeded
      5-minute budget (5.5 minutes; dominant validate_verification_registry); validation auto-filed rec-2892 outside the audit write
      boundary'
    stale_anchors:
    - origin/main unavailable
    - build-lambda contract count says three prod artifacts while active manifests define two prod-class artifacts
    - ROADMAP CD.27 runtime list omits current C# Durable support
  external_sources:
  - url: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
    accessed: '2026-07-29'
    claim_scope: product semantics, one-year execution, replay, SDK languages, Step Functions comparison
  - url: https://docs.aws.amazon.com/lambda/latest/dg/durable-supported-runtimes.html
    accessed: '2026-07-29'
    claim_scope: managed runtimes, OCI requirements, SDK pinning, container cold starts
  - url: https://docs.aws.amazon.com/lambda/latest/dg/durable-testing.html
    accessed: '2026-07-29'
    claim_scope: local/cloud tests, operation history, nondeterminism
  - url: https://docs.aws.amazon.com/lambda/latest/dg/durable-monitoring.html
    accessed: '2026-07-29'
    claim_scope: CloudWatch, EventBridge and X-Ray observability
  - url: https://docs.aws.amazon.com/lambda/latest/dg/durable-best-practices.html
    accessed: '2026-07-29'
    claim_scope: version pinning and replay-safe changes
  - url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-rust.html
    accessed: '2026-07-29'
    claim_scope: regular Lambda Rust OS-only runtime and runtime client
  - url: https://aws.amazon.com/lambda/pricing/
    accessed: '2026-07-29'
    claim_scope: compute, replay requests, durable operations/data/retention pricing
  question_answers:
  - q: Q1
    verdict: transformational
    basis:
    - RLE-01
    - RLE-02
    - T4.1
    - T4.2
    - T4.3
    - T4.8
    - T4.9a
    - T4.12
    prose: 'Six of the nine compose-time T4.x items directly touch Lambda runtime code: T4.1, T4.2, T4.3, T4.8, T4.9a, and T4.12.
      Midpoint sum is 104 days (28+60+3.5+3.5+3.5+3.5+1+1); no overlap deduction is taken because runtime, manifest/CI, and verification
      deliver distinct outputs. Rust Durable support would also require reversal or bespoke replacement of CD.27 semantics, independently
      triggering transformational.'
  - q: Q2
    verdict: mixed
    basis:
    - RLE-01
    - RLE-03
    prose: Rust offers compile-time ownership, enum/exhaustiveness, Send/Sync and type benefits plus plausible regular-Lambda startup/CPU
      gains. It cannot establish IAM, JSON/schema, API, replay determinism, idempotency, cloud integration or business behavior.
      Runtime savings are unmeasured and agent productivity, native dependency parity, and dual supply-chain cost are adverse or
      unknown.
    external_checklist:
    - property: Durable managed runtimes/languages
      surface: future_durable_personas
      applicability: relevant
      rating: missed
      evidence: AWS supported-runtimes page omits Rust and lists Node.js, Python, Java, C#.
      compensating_control: Python 3.13 is first-class.
      control_property_match: The Python SDK exercises AWS checkpoint protocol; a forced-timeout replay test fails if it repeats
        a completed operation.
    - property: Durable OCI/custom runtime
      surface: future_durable_personas
      applicability: relevant
      rating: missed
      evidence: OCI is allowed only with a durable SDK installed; no official Rust SDK is listed.
      compensating_control: None for Rust.
      control_property_match: ''
    - property: Checkpoint/replay semantics
      surface: future_durable_personas
      applicability: relevant
      rating: met
      evidence: AWS documents restart-from-beginning with completed checkpoint results replayed.
      compensating_control: T4.2 forced-timeout criterion.
      control_property_match: It detects re-issued completed LLM/tool calls.
    - property: Region availability
      surface: future_durable_personas
      applicability: relevant
      rating: partial
      evidence: ROADMAP CD.27 records official-doc verification for eu-west-2; the current general Lambda page does not expose a
        durable regional matrix.
      compensating_control: Recheck create/config API during T4.2 planning.
      control_property_match: A read-only capability probe fails before implementation if durable config is unavailable.
    - property: Local/cloud testing
      surface: future_durable_personas
      applicability: relevant
      rating: met
      evidence: AWS testing page provides local/cloud SDK tests and operation-history inspection.
      compensating_control: T4.2 e2e forced timeout.
      control_property_match: Behavioral replay fails if execution history duplicates operations.
    - property: Pricing
      surface: future_durable_personas
      applicability: relevant
      rating: partial
      evidence: AWS prices compute/replay requests plus durable operations, data written, and retention; repository volumes are absent.
      compensating_control: Symbolic break-even model.
      control_property_match: No cost claim graduates without measured N, GB-s, operations and storage.
    - property: Observability
      surface: future_durable_personas
      applicability: relevant
      rating: met
      evidence: AWS documents CloudWatch metrics/logs, EventBridge status and X-Ray.
      compensating_control: T4.1/T4.2 metrics criteria.
      control_property_match: Execution/replay alarms expose failures and replay rates.
    - property: Product maturity/change safety
      surface: future_durable_personas
      applicability: relevant
      rating: partial
      evidence: AWS best practices require version pinning because code/SDK changes can break in-flight replay.
      compensating_control: CD.27 12-month monitor and 14-day gate.
      control_property_match: Pinned aliases and replay grace gate fail on incompatible in-flight behavior.
    - property: Regular Lambda Rust runtime
      surface: future_deterministic_lambdas
      applicability: relevant
      rating: met
      evidence: AWS documents Rust via runtime client on OS-only runtime.
      compensating_control: ''
      control_property_match: ''
    - property: Cold-start/duration evidence
      surface: future_deterministic_lambdas
      applicability: relevant
      rating: missed
      evidence: AWS states native deployment mechanics but repository has no comparative workload result.
      compensating_control: Measure-first policy.
      control_property_match: Predeclared benchmark threshold prevents reputation-based adoption.
    - property: Native DuckDB/PostgreSQL ecosystem
      surface: ducklake_runtime_lambdas
      applicability: relevant
      rating: partial
      evidence: Manifests show Python DuckDB/psycopg2 and three native layers; no Rust parity build was observed.
      compensating_control: Keep Python.
      control_property_match: Existing deploy and smoke gates fail if packaged native extensions or DB behavior break.
    - property: Step Functions boundary
      surface: future_step_functions
      applicability: relevant
      rating: met
      evidence: T4.1 defines JSON-shaped worker results, task tokens, SHA correlation and managed states independent of worker language.
      compensating_control: Versioned contracts.
      control_property_match: Schema/correlation tests fail on incompatible workers regardless of language.
  - q: Q3
    verdict: material-overhead
    basis:
    - RLE-02
    prose: One manifest can contain the duplication, but the current schema, builders, coverage mapper and workflows are Python-specific.
      Rust adds pinned targets, Cargo caches/locks, fmt/clippy, audit/license, cross-build, coverage aggregation, reproducibility
      and architecture smoke checks; behavior tests must fail when feature code is deleted, not merely compile.
  - q: Q4
    verdict: none
    basis:
    - RLE-03
    prose: No existing Python surface has measured pre-MVP pain or a necessary Rust-only capability. Preserve Python, measure first,
      and retire ops-compaction/findings/scheduled machinery where roadmap disposition beats a port.
  - q: Q5
    verdict: python-only-until-post-mvp
    basis:
    - RLE-01
    - RLE-02
    prose: Use Python for T4.1 regular glue and T4.2 Durable personas through MVP; apply the same rule to later Lambda-bearing T4.3/T4.8/T4.9a/T4.12.
      Architecture owner may approve a post-MVP whole-artifact Rust pilot after a language-neutral manifest and measured threshold;
      review at stable T4.2 plus representative T4.1 telemetry. Current .py handler/pip schema needs a versioned change.
  - q: Q6
    verdict: do-not-adopt-rust
    basis:
    - RLE-01
    - RLE-02
    - RLE-03
    prose: Do not establish a Rust production default now. Reopen when AWS supplies first-class Rust Durable support or T4.2 no longer
      requires it, a regular-worker benchmark clears predeclared end-to-end thresholds, and a language-neutral governed delivery
      path exists.
    domain_policies:
    - domain: future_deterministic_lambdas
      policy: python
      rationale: Necessary regular-Lambda Rust advantage is unmeasured before MVP.
    - domain: future_durable_personas
      policy: python
      rationale: Python has a first-class Durable SDK; Rust does not.
    - domain: later_t4_lambdas
      policy: python
      rationale: Keep one governed path until post-MVP evidence supports a whole-artifact pilot.
    - domain: existing_python
      policy: measure_first
      rationale: Migrate only measured bottlenecks; prefer planned retirement where applicable.
  - q: Q7
    answers:
    - question: What evidence falsifies the Rust hypothesis?
      answer: No material behavioral defect reduction after controlling for tests, or end-to-end savings below added engineering/CI
        cost, falsifies it.
      basis:
      - RLE-03
    - question: Which defects survive compilation?
      answer: IAM, authorization, schemas, API contracts, nondeterminism, tool idempotency, stale callbacks, data correctness, deployment
        configuration and incident response.
      basis:
      - DD-B
      - RLE-03
    - question: Does Durable Functions support Rust?
      answer: Not through a current first-class managed runtime or official Durable SDK. Regular Lambda custom-runtime support and
        OCI packaging do not preserve Durable guarantees without that SDK.
      basis:
      - RLE-01
    - question: How do replay and tool calls interact?
      answer: Replay reruns handler code and suppresses only completed durable operations; every LLM/tool side effect must be inside
        an operation with stable ordering/idempotency and forced-timeout tests.
      basis:
      - AWS durable functions
      - T4.2
    - question: Is decomposition more important than language?
      answer: Yes. Managed orchestration, typed boundaries, isolated personas, token/SHA correlation and bounded retries address
        more observed risk classes than a worker compiler.
      basis:
      - T4.1
      - T4.2
      - T4.11
    - question: What are region, native dependency, operations, ownership and rollback implications?
      answer: Revalidate eu-west-2 at plan time; cross-build both architectures; do not port DuckDB/native layers without parity;
        train incident owners; roll back by Lambda alias at whole-artifact boundaries, never mixed-language shared-library coupling.
      basis:
      - DD-D
      - RLE-01
    - question: Could retirement beat migration?
      answer: Yes for ops-compaction and potentially findings/scheduled surfaces already carrying retirement or rehome intent; porting
        them creates stranded cost.
      basis:
      - T2.26
      - T4.12
    - question: What is the cheapest decision-relevant experiment?
      answer: After a stable T4.1 contract exists, implement one low-side-effect deterministic glue worker in both languages and
        compare behavior catches, cold/warm p50/p99, GB-s, build minutes and operator time behind alias rollback.
      basis:
      - RLE-03
