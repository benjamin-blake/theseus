audit:
  meta:
    audited_commit: 842ff92
    base_branch: main
    model: GPT-5.6 Sol
    methodology_version: 1
    scope_surfaces:
    - ducklake_runtime_lambdas
    - prod_class_lambdas
    - lambda_build_deploy
    - current_executor
    - future_step_functions
