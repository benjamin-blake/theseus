  strategy_costs:
  - strategy: python-only-through-mvp
    one_time_cost: Existing roadmap work, bounded 45-80 engineer-days; no language-platform detour.
    recurring_cost: One Python toolchain and current dependency response.
    runtime_cost_model: C_py=N*(request + GBs_py*rate)+durable operations/data/retention.
    opportunity_cost: Lowest; delivers CD.27 evidence first.
    break_even: Baseline comparator; optimize only if measured AWS cost or incidents are material.
    confidence: HYPOTHESIS
  - strategy: bounded-dual-language-pilot
    one_time_cost: Add 16-40 days for manifest/CI and one whole-artifact duplicate.
    recurring_cost: Two toolchains, advisories, coverage and operator skills.
    runtime_cost_model: Savings=N*(GBs_py-GBs_rs)*rate minus added CI/maintenance; Durable stays Python.
    opportunity_cost: Delays one or more T4 slices.
    break_even: N*(GBs_py-GBs_rs)*rate + monetized avoided defects > pilot + recurring engineering cost.
    confidence: HYPOTHESIS
  - strategy: rust-default-now
    one_time_cost: '>40 extra days plus an unbounded bespoke Durable SDK/CD.27 reversal.'
    recurring_cost: Rust-first plus Python exceptions until ports/retirements finish.
    runtime_cost_model: Unknown; network/LLM/database waits may dominate compute.
    opportunity_cost: Transformational MVP delay and support risk.
    break_even: Not computable while required Durable semantics are unsupported and measurements absent.
    confidence: CONFIRMED
