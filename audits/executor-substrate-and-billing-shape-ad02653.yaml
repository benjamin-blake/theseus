      verdict: durable-provides-materially-more
      basis: [ESB-01, ESB-06]
      prose: >-
        Judged against the loop semantics AS CONTRACTED (T4.2's exit criterion demands forced-timeout
        mid-loop resume from the last completed tool call without re-issuing completed LLM calls,
        ROADMAP:6777 -- itself a pending-CD, mechanism-named contract, recorded at ESB-05), durable
        functions provide materially more platform-side: long-run beyond one invocation,
        per-operation checkpointing, completed-operation suppression, a test runner, and
        execution-history observability arrive without hand-rolling. Adversarial review sharpened
        this in both directions. Against the incumbent: (a) suppression covers CHECKPOINTED
        operations only -- a crash between the provider's HTTP response and the checkpoint re-issues
        that LLM call on replay, so at-least-once applies to LLM calls too and the differential vs
        alternatives is granularity plus managedness, never exactly-once; (b) replay determinism is
        a discipline the platform imposes rather than removes -- concentrated in one shared loop
        harness (S-M once, near-XS per persona) but with NO contracted signal able to detect silent
        replay divergence (ESB-06); (c) the ECS escape hatch is an SFN-layer state that a mid-loop
        >15-minute tool call CANNOT reach from inside a durable persona without an undesigned
        step-starts-ECS-plus-callback bridge, while under sfn-per-iteration the tool call is already
        an SFN-level state and composes natively. For the incumbent: (d) a third state category --
        the conversation/message-history transcript -- is rebuilt automatically on replay from
        stored step results under durable, but must be serialized and reloaded atomically at EVERY
        iteration boundary under sfn_over_stateless_workers (a real hand-roll T4.11 counters and S3
        pointers do NOT cover); (e) the sfn loss bound is per-crash, not per-failure-episode (SFN
        deterministic retry can re-issue the same iteration's LLM call up to its cap). On workspace:
        the durable SDK checkpoints step RETURN VALUES, not the filesystem, and Lambda /tmp does not
        survive suspension -- but EFS-for-Lambda mounts a shared filesystem across functions and
        invocations, so the workspace gap is a BACKING-STORE DECISION (EFS-with-VPC+NAT ~$32/month,
        S3-sync, or container-local disk) plus unowned RESUME semantics, not a missing platform
        capability; EFS-for-Lambda was evaluated in-repo only as DuckLake FP-A prior art
        (docs/plans/reports/ducklake-spike-findings.md), never for the executor workspace
        (ESB-01). T4.11's
        SFN-state budget counters and the S3-pointer pattern (ROADMAP:818, 7242-7259) externalize
        INTER-persona state only. Disclosure: the nine-property matrix below is closed by the audit
        contract and is invocation-boundary-shaped; the two discriminators review found decisive --
        workspace persistence and CLI-hostability -- live here in prose and in Q2a, per contract.
