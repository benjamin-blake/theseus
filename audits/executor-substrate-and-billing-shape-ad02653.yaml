      surface: failure_semantics
      question: Q1
      dimension: VD2
      title: "The workspace backing store is undecided and resume re-materialization is unowned: checkpoint/replay covers step return values, not the git worktree the heavy personas mutate"
      evidence: "https://docs.aws.amazon.com/durable-execution/patterns/best-practices/determinism/; docs/ROADMAP-PLATFORM.yaml:6669,6673,6777; docs/plans/reports/ducklake-spike-findings.md:77,154"
      evidence_kind: static
      current_behavior: "T4.1's prepare_workspace owns INITIAL materialization (clone, branch, worktree, return workspace_uri) -- but no surface states what backs workspace_uri across persona invocations (Lambda /tmp does not survive suspension) or how a workspace is re-materialized on resume. EFS-for-Lambda would make it a shared mount (evaluated in-repo only as DuckLake FP-A prior art, never for the executor workspace; it carries VPC coupling and a NAT term -- ~$32/month managed, ~$3-5 as a NAT instance -- and is structurally unreachable from GitHub-hosted runners). Inter-persona workspace HANDOFF (plan_agent branch to implement_agent worktree) and persona-to-ECS-task handoff are equally uncovered. The conversation-transcript state category is related but distinct: durable rebuilds it on replay from stored step results (conditional on unverified per-payload caps); iteration-granular alternatives must serialize/reload it atomically each iteration."
      ideal_behavior: "A named backing store (EFS mount / S3-sync / container-local disk / git-as-store with commit-at-step-boundaries) chosen against recorded criteria, an owned resume-re-materialization semantics, and a resume criterion covering workspace state beside the tool-call-resume criterion."
      gap: "T4.2's forced-timeout criterion verifies tool-call resume but is silent on the loop's dominant mutable state; a green e2e smoke with stub personas would not prove a resumable implement_agent."
      compensating_controls_considered: "S3-pointer pattern (ROADMAP:818) covers ARTEFACTS, not the working tree; prepare_workspace covers initial materialization only; git itself can serve as the durable store IF a commit-at-step-boundaries discipline is adopted -- that discipline is exactly the undesigned piece."
      change_type: add
      proposed_change: "Author the backing-store decision paper (criteria first -- the choice is a portability commitment: EFS forecloses hosted_cli_runner; S3-sync is the only full-set-portable store), let the Q5 spike's persistent-workspace arm inform the final choice, and add a workspace-resume exit criterion to T4.2."
      acceptance: "A tier item names the mechanism and its criteria; T4.2 gains a workspace-resume criterion; the spike exercises it at the observed 5.4GB env scale."
      severity: high
      severity_rationale: "Without it the substrate's headline guarantee (resume without redoing work) is unprovable for the two personas that justify the substrate, and the gap's COST DIFFERS STRUCTURALLY BY CLASS -- it is the single largest open discriminator in the substrate decision."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: [T4.1, T4.2], dedup_search_terms: ["workspace", "workspace_uri", "EFS", "re-materializ", "worktree"], dedup_hit_count: 6, note: "ROADMAP hits are prepare_workspace's own line + unrelated CC-web mentions; rec-cache hits (19) are CLI prompt-injection workspace files, unrelated; EFS prior art found at ducklake-spike-findings.md (round-3 review correction of this audit's own 'nowhere in repo' overclaim)"}
