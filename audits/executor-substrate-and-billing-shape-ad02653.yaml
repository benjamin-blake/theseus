    - q: Q2
      verdict: partially-movable
      basis: [ESB-09]
      prose: >-
        An LLM call issued inside a durable STEP is billed as Lambda compute for its full wall-clock:
        AWS bills active execution and suspends charges only for waits and callbacks ("waits suspend
        execution without incurring compute charges"; a callback "does not incur compute charges
        while suspended"). Moving model latency onto those non-billed primitives requires a
        submit-now/deliver-later provider mode plus a correlation route into
        SendDurableExecutionCallbackSuccess. Under the transport and providers as mandated the move
        is unavailable: DeepSeek (CD.28 Tier 1) documents synchronous + streaming only; LiteLLM's
        batch support covers OpenAI/Azure/Vertex/Bedrock/vLLM -- neither Anthropic nor DeepSeek --
        and LiteLLM's Anthropic integration exposes no batch mode; Anthropic's own Message Batches
        API (async, polled, <1h typical, 50% discount) is therefore reachable only via a LiteLLM
        PASSTHROUGH deployment (LiteLLM's Anthropic passthrough documents support for all Anthropic
        endpoints -- surfaced by adversarial review from official LiteLLM docs, not independently
        verified within this run's 15-source cap; and passthrough is a proxy feature while T4.2
        plans the in-process SDK) or via a CD.28 amendment -- either way costing correlation ids,
        idempotent submission, timeout handling, and minutes-to-hours added latency. One further
        in-set mechanism exists: Step Functions' http:invoke HTTP Task holds a synchronous HTTPS
        call in SFN itself (transitions-only billing, no held compute) and could serve
        sfn_over_stateless_workers -- but it bypasses the LiteLLM Layer-1 discipline entirely
        (CD.28/dec-122) and its documented timeout class (~60s) would foreclose reasoner-class
        calls outright if confirmed -- unverified here (HYPOTHESIS).
        Every movability path therefore runs through either a transport-discipline decision or
        unverified limits: partially-movable. MAGNITUDE, so economics get their true weight: at the
        repo's recorded scale (100 recs/month, ~50K input + ~10K output tokens/rec, ~80% cache-hit,
        DeepSeek $0.252/$0.378 per 1M -- ROADMAP:288,313,840, re-derived), with per-rec total LLM
        calls genuinely unknown (spot 20-100 across five personas), gross billed model-latency
