        - {property: EX11, rating: met, evidence: "Reversal conditions are a first-class optional marker with typed extraction (scripts/decisions_md.py reversal_conditions); rejected alternatives are routinely recorded (D145 Rationale, D164, D160 point 2 adjudications) and survived DD-B's block via the shipped commit message."}
