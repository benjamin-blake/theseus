        - {property: EX13, rating: partial, evidence: "Ritual contracts are versioned, schema-validated, status-lifecycled, and exercisable (validate_contract_drift Pass 1/2; provisional_v0 re-ratification triggers); 23 of 39 files are free-form -- yaml.safe_load plus mapping check only (validate_contract_drift.py:64-72), 2 .md files invisible to the *.yaml glob entirely."}
    - q: Q3
      verdict: primary-cause-established
      basis: [CFG-03, CFG-04, CFG-02]
      prose: >-
        Three mechanics compound, and the first is primary. (1) Amendment-by-forward-reference
        manufactures reversal-relevance: because a ratified body is never edited (Decision
        126/143 convention), ANY substantive change to a rule recorded in a Decision requires
        a new numbered entry -- so once mechanism content enters the corpus, every future
        parameter move of that mechanism clears the significance bar BY CONSTRUCTION as "an
        amendment of a ratified decision". D145 (a constant change) is a full 6.5 KB entry;
        the identical-shaped scope change in PR #855 needed no entry because Decision 162's
        mechanism lived in contract + config, amendable there. Mechanism-in-decision is
        therefore self-propagating. (2) The bar is self-certified with no evaluator or
        recording obligation (CFG-03): the conformance check reads Status/Date/Decision
        markers only; the Significance stanza is voluntary (6 of 16 post-150 entries) and
        absent from the contract's marker lists. (3) Asymmetric authoring gravity (CFG-04):
        minting an entry costs three markers in one warm, always-open file with a ritual the
        author knows; putting mechanism semantics in a contract requires choosing ritual vs
        free-form, and the ritual taxonomy has NO mechanism class (A=tables, B=verbs,
        C=identifiers), so mechanism contracts are all free-form -- schema-less,
        drift-gate-skipped, amendment-log-less -- which makes the Decision the
        better-governed-FEELING home even when the routing rows say otherwise.
        Discoverability reinforces it: decisions get an index, excerpts, category_tags and a
        scout; contracts get 8 of 39 file-router rows. Rejected as primary: warehouse
        projection (ops_decisions SCD2) as an attractor -- no read path consumes it in
        authoring flows today; and pure habit -- DD-B shows the routing CAN run correctly the
        moment a human evaluator applies the bar.
    - q: Q4
      verdict: ready-with-gaps
      basis: [CFG-09, CFG-04, CFG-11]
      prose: >-
        For field semantics the ritual destination is ready and superior: schema validation,
        $ref resolution, amendment-log-on-change, status transitions with provisional_v0
        re-ratification triggers, structural size class, generated code bindings. For
        mechanism content -- the class that actually dominates S1's growth -- the destination
        is the free-form population, and it is weaker than S1 on most compared properties
        (DD-D table in the companion): no schema, no authoring grammar, no amendment log
        (33/37 yaml files lack one), no supersession lifecycle, no index/excerpt surface, no
        warehouse projection, 8/39 router coverage, and 2 .md members invisible to both the
        drift gate glob and the size engine (CFG-11). What migration would lose today:
        SCD2 history (ops_decisions versions every body change; contracts have none),
        conformance ritual, and scout discoverability. Whether the loss matters is
        property-specific: history loss matters for rulings (provenance) but NOT for
        mechanism specs whose provenance is git + the enforcing guard; discoverability loss
        is real (a scout triages decisions, nothing triages contracts). Migration is
        therefore ready for specification content PROVIDED the destination gains a declared
        subject, an evaluator binding, and minimal lifecycle (the Class-D shape in Q7) --
        and NOT ready for rationale, which should not migrate at all.
    - q: Q5
      verdict: insufficient
      basis: [CFG-05, CFG-06]
      prose: >-
        (a) parallel-contracts: undetected. The drift gate's cat-5 check catches duplicate
        inline+$ref definitions within one ritual contract's resolution, never two files
        asserting the same semantics; the free-form population has no subject declaration, so
        the property is not even well-posed there -- that is an answer: detection requires a
        declared subject per contract first. Live instance of the risk class: Decision 162's
        body and composite-action-shape.yaml both state the R1/R2/R3 semantics (designed
        overlap today, drift-detectable never). (b) contradictory-contracts: undetected, same
        root. (c) contract-code-drift: partially-detected, bimodally -- Class A contracts
        generate field_semantics and are DQ/pydantic-drift-checked; several free-form
        contracts are their check's own config (file-router read by validate_placement;
        marker-grammar bound to _marker_guard), where drift is structurally impossible for
        the enforced subset and undetected for the prose around it; the remainder (G4:
        10-17 files depending on method, method stated in the companion) have no evaluator at
        all. G24/G25 adjudication: the two extractor divergences share one cause -- per-field
        regex grammars encode slightly different grammars than the prose conventions they
        parse, and decision-entry.yaml's shared-parser clause covers header grammar only
        (DAF-03 scope), not field extractors -- so this is one class defect (CFG-06), a
        sufficiency assessment of open rec-2971 + rec-2990, not a fresh discovery. Minimum
        mechanisms and their costs are in the findings; the false-positive behavior of a
        subject-uniqueness check is bounded because subjects are declared, not inferred.
      detection_ratings:
        - {property: parallel-contracts, rating: undetected, evidence: "No subject declaration exists on any of the 23 free-form files; the drift gate's cat-5 check (scripts/contracts.py resolve_refs) detects duplicate inline+$ref within one ritual contract's resolution only -- no cross-file comparison anywhere. Not well-posed until a declared subject exists (CFG-04/CFG-05)."}
        - {property: contradictory-contracts, rating: undetected, evidence: "Same root as parallel-contracts, and additionally not mechanically decidable even with subjects -- the minimum mechanism is subject-collision detection routing to a review lane, not a truth checker."}
        - {property: contract-code-drift, rating: partially-detected, evidence: "Bimodal: Class A contracts generate config/lambda field_semantics (schema_to_field_semantics, Decision 65) with pydantic/DQ drift checks; the strongest free-form files are their own guard's config (file-router -> validate_placement, marker-grammar -> _marker_guard, composite-action-shape -> the R1/R2/R3 guard), so drift is structurally impossible for the enforced subset; the remainder (G4: 10 by stem-grep, 17 by full-path-grep -- method changes the number, both stated) have no evaluator and drift undetected."}
    - q: Q6
      verdict: partial
      basis: [CFG-08]
      prose: >-
        The change-record leg already works where it is machine-read: feat({slug}) subjects
        are consumed by validate_vp_replay and validate_graduation_completeness
        (_common.py:208-226), the Resolves trailer drives rec-autoclose, and PR #855's body
        shows the surface carrying a complete what-changed/why-now record including content a
        Decision draft had tried to claim. What routinely lands in a Decision but belongs
        here: acute authoring-time state ("at authoring time X sat at 499,960/500,000"),
        installing-PR measurements, verification-round narratives, and sequencing notes --
        the ~19% change-record share E2 measures, permanent in an immutable file whose
        provenance guarantee (git + PR) already covers this content for free. Governance
        warranted: LIGHT -- a stated content rule (what belongs in commit/PR vs entry) and
        the missing audit({slug}) row in the PR template's conventions comment. NOT
        warranted: a content gate on commit bodies; the surface's ungoverned flexibility is
        its value, misrouting INTO it is cheap, and the costly direction (change-content
        into Decisions) is better fixed on the S1 side (CFG-02's cap) than by policing
        commits. The current 5-prefix table + slug regex is correct as-is; absence of
        heavier governance is mostly correct, hence partial rather than
        governance-warranted.
    - q: Q7
      verdict: single-end-state-recommended
      basis: [CFG-01, CFG-03, CFG-04, CFG-09]
      prose: >-
        End-state: docs/DECISIONS.md becomes what its external namesakes are -- an ADR log:
        rationale, ruling, reversal conditions, pointers; retrieved by id (T2.56 c2's shape),
        with specification in contracts and change narrative in the PR record. Corpus shape:
        extract_machine_semantics_only -- forward-only, no retroactive rewriting (immutability
        stands; existing mixed entries compact only via the ordinary supersession lifecycle).
        Routing rule (decidable, stated in end_state.routing_rule): three questions in fixed
        order decide the home of every block of durable content; two authors agree because
        each question is a property test on the sentence, not a judgment about importance.
        Forcing functions, each with its failure-mode answer: (f1) a per-entry byte cap on
        NEW entries inside validate_decisions_size -- the flow-side lever that survives
        ceiling-raised because raising a stock ceiling does not touch it; (f2) Significance
        becomes a required marker on NEW entries whose value must name one of the four
        routing rows, enforced by the existing always-run conformance check (which already
        reads required_markers from the contract at check time) -- survives mechanism-unused
        because no one has to elect to run it; (f3) every new docs/contracts file must carry
        either a contract:/class: block or a declared subject: + evaluator: pair -- the drift
        gate's skip branch narrows, making subject-uniqueness (Q5a) well-posed -- survives
        mechanism-unused for the same reason. Counterfactual test applied: each of f1-f3
        fails on a repository where the governed behavior is removed (an oversized new entry,
        a marker-less new entry, an undeclared new contract), so none passes empty. Costs:
        f1/f2 are XS-S one-file changes plus real authoring discipline per entry (the point);
        f3 is M (23 headers + gate edit). Amended on adversarial review: f2 is reclassified a
        RECORDING obligation, not a forcing function (the author still elects the routing);
        its forcing partner is f1 plus the operator lane, with a WARN-tier consistency lint
        closing the self-certification residue (see forcing_functions). And the pinned option
        extract_multiple_typed_fields, not originally argued past, is now adjudicated:
        ADOPT a forward-only typed metadata envelope for NEW entries (YAML front matter
        carrying number/status/date/amends/supersedes and f2's routing row; body stays prose
        rationale) -- it wins the NS2 tiebreak, deletes CFG-06's extractor-grammar defect
        class at the root, and matches current machine-readable ADR practice (MADR ADR-0013;
        Structured MADR). Priced: a dual-grammar window across the 119 grandfathered entries
        until T1.5's sunset (front matter first, bold markers as fallback; M effort across
        conformance/index/backfill). corpus_shape stays extract_machine_semantics_only: the
        envelope types entry METADATA; the shape question is where specification lives, and
        the answer is contracts. Consumer inventory (bounded rg, 74 hits,
        classified in the companion): planning agents and CI guards are covered by T1.5's
        stated portal scope; the marker-authorization guard's need for raw Decision BODY text,
        contracts' textual citations, and the index generator itself are not -- T1.5 must
        either serve raw bodies or those consumers block retirement. t15_verdict:
        sufficient_with_specific_amendments -- the portal solves read cost, not authoring
        routing; content-shape gates (f1/f2) must precede cutover or the portal fossilizes
        mixed-content raw_blocks as the retrieval unit. t256_verdict:
        sufficient_with_specific_amendments -- c2 IS this end-state's corpus shape (stated
        plainly: on the shape sub-question this audit largely restates T2.56, an ownership
        finding); its gap is that neither criterion covers authoring-time routing enforcement
        or the flow-side cap, which is exactly what eroded five interventions (Q1).
    - q: Q8
      verdict: ordered-sequence-with-abort-criteria
      basis: [CFG-01, CFG-09, CFG-10]
      prose: >-
        Order and why: flow governance first (steps 1-2), because every later step mints
        entries and must not re-run the Q1 mechanism; destination readiness second (steps
        3-4), because DD-C shows routing is one-way-at-entry -- no lifecycle mechanism can
        undo a misroute later, so the destination must be ready BEFORE authoring routes
        there; outflow third (steps 5-7), because archival only becomes header-AND-index
        relief after rec-3012; portal cutover last (step 8), inheriting a shaped corpus.
        FIRST: the bridge raise must land (in flight, human-overridden decision-scout BLOCK
        recorded) -- without headroom, every subsequent governance entry is blocked at
        119/120 headers; this sequence deliberately adds at most two new entries total.
        Multi-phase note (per the planning-time freeze): each step below is an atomic
        IMPLEMENTATION-plan-sized unit; the sequence is the programme. All steps are
        reversible except the archival wave (reversible only by moving entries back) and
        none rewrites a ratified body. Derived-surface effects are uniform: any corpus edit
        regenerates docs/decisions-index.json (freshness-gated), any body change lands a new
        SCD2 version via --backfill-decisions-md, archive moves are warehouse-safe (Decision
        146). Human rulings named per row; abort criteria are pre-committed and measurable.
        The entry layer (sampled_entry_dispositions) covers exactly the 12 distinct sampled
        entries; the full per-entry ledger is rec-2822's property and is not duplicated here.
    - q: Q9
      answers:
        - question: "Does auditing this territory repeatedly have a cost the audits themselves have never accounted for?"
          answer: >-
            Yes, and it is now measured: the five audit rounds' landed follow-ups ARE the E1
            lineage -- 86,909 B (15.15%) of the live file and 9 of 120 headers -- plus each
            round's output file (49,982-92,997 B, exempt as workflow_outputs). No prior round
            priced its own follow-up entries against the ceilings it was tightening; DCG's
            follow-ups alone (149-152) added ~33 KB against a ceiling family whose measured
            relief was ~5-8 KB. This audit's write cost inside the corpus is deliberately
            zero entries.
          basis: [CFG-02]
        - question: "Is corpus growth a symptom of decision-log design, or of something upstream?"
          answer: >-
            Both, separably. Upstream: audit cadence (each round minted 2-8 entries within
            days -- timeline in the companion) and the amendment-by-forward-reference
            convention, which converts every parameter change of a Decision-recorded
            mechanism into a new entry (Q3). Design-side: the absence of any flow governor
            (CFG-01) lets upstream pressure translate 1:1 into corpus bytes. Fixing decomposition
            without f1/f2 would slow growth; fixing f1/f2 without decomposition still bounds it.
          basis: [CFG-01, CFG-02]
        - question: "Is there a class of content that belongs in NONE of Q2's seven homes and is being forced into one?"
          answer: >-
            Yes: the mechanism-adoption narrative -- the worked derivation, measurements, and
            verification rounds behind a mechanism (D160 point 14, D166 points 6/9). It is
            forced into Decision bodies because it feels ratification-adjacent, but its
            natural home is the PR/plan record (docs/plans + squash commit body), which is
            durable, immutable-enough, and outside every ceiling. The routing rule in Q7
            names it change-record explicitly.
          basis: [CFG-02, CFG-08]
        - question: "If the corpus were rebuilt from scratch today with full knowledge, how many current live entries would exist at all?"
          answer: >-
            Roughly 45-60 of 119. Method: judgment over the 21-entry read sample extrapolated
            by content class -- pure rulings and substrate/architecture ADRs survive (~40%),
            parameter-change entries collapse into their mechanism's contract history (~15%),
            pure gate-clear ratifications collapse into batch waves (~20%, DCG-04's measured
            share), and mechanism bodies shrink to ruling+pointer (~25% survive as thinner
            entries). Confidence: HYPOTHESIS -- stated to size the migration, not to justify
            retroactive rewriting, which this audit does not propose.
          basis: []
        - question: "Audit prompts and outputs are durable governance content with no size governance and no home in Q2's routing rule. Does the Q7 rule account for them, and should it?"
          answer: >-
            It accounts for them by classification, not by a new home: audit prompts and
            outputs are run-records -- produced whole per run, never comprehension-edited --
            which is exactly why the structural engine's workflow_outputs class exempts them
            (Decision 166 point 4 keys exemptions on production pattern). The Q7 rule adds
            one obligation, already practiced: their DURABLE findings route onward (recs,
            tier_items, decisions) and the file itself is immutable evidence -- the dedup
            discipline this prompt itself enforces. What is genuinely missing is retention:
            audits/ has a legacy/ subtree but no stated retirement trigger; a one-line
            file-router note would close it. Size governance on the class would tax captured
            reality (the NS-B argument) and is correctly absent.
          basis: []
        - question: "(Addition) Do operator routing rulings have a durable home?"
          answer: >-
            No. The DD-B block -- the sharpest routing precedent in the repository's history,
            the ruling that mechanism prose is not an architectural decision -- exists only
            in chat history; the shipped PR's message records the outcome, not the rule.
            Cheapest fix: when a Decision draft is blocked on routing grounds, the
            superseding PR body carries one line naming the routing row applied. Costless,
            and it turns each ruling into a citable precedent for the next author.
          basis: [CFG-07]
        - question: "(Addition) Is immutability doing work for change-record content?"
          answer: >-
            No. Immutability guards provenance of RULINGS; for the measurements and
            narratives embedded in entries, git history and the PR record already provide
            identical provenance for free. The corpus pays permanent live bytes to guarantee
            a property that content class already has elsewhere -- an argument for f1/f2
            that needs no appeal to reading cost at all.
          basis: [CFG-02]
