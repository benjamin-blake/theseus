  findings:
    - id: CFG-01
      surface: S1
      surfaces_affected: [S1]
      question: Q1
      dimension: VD5
      title: "Size governance is stock-only: no built lever reduces the first-binding ceiling's quantity faster than inflow, so raises recur on a days-scale schedule"
      evidence: "aggregate:docs/DECISIONS.md+scripts/checks/decisions/validate_decisions_size.py"
      evidence_kind: observed
      current_behavior: "Three surviving ceilings bound stocks (120 live headers; 700,000 combined bytes; 131,000 index bytes). Levers: compaction reduces bytes but never headers (never_remove_headers) and its eligible live set is empty (2/2 processed); archival reduces headers but is documented inert for combined bytes (validate_decisions_size.py:23-29), leaves index rows full-weight (rec-3012 unbuilt), is operator-disposed, and has run once (07-21); the per-entry size norm (rec-2934) is unbuilt and would not move headers; the significance bar moves everything and is unenforced. Measured inflow ~9,150 B/day and ~1.5 headers/day (07-31 -> base; a cadence-inflated audit-follow-up window, so treat the rates as upper bounds -- organic inflow is unestablished); headroom at base: 1 header, 15,204 B (stock facts, window-independent)."
      ideal_behavior: "At least one ALWAYS-ON lever acts on flow (per-entry cap; enforced routing marker), so ceilings pace growth instead of scheduling their own raises."
      gap: "Also answers Q1's aggregate: the five erosion endings (134, 145, 146-as-relief, 150, 160) all reduce to this mechanism; the lever-by-ceiling matrix cells already documented in-repo are the archival-inert clause (decision-entry.yaml:236-239, _RELIEF_VALVES); the full matrix and the binding order across all four ceilings are stated nowhere (rec-2968 flagged one pair)."
      compensating_controls_considered: "The loud-raise ritual (Decision-cited, reversal-conditioned) -- property-mismatched: it makes raises visible, not unnecessary; three ritual-perfect raises in 21 days. The decision-scout gate -- fired correctly on the bridge plan (BLOCK) and was overridden, per design, by the human."
      survives_failure_mode: ceiling-raised
      refutation: "Strongest counter: raises ARE the designed relief -- a corpus in heavy build phase should grow, and the ceilings are pacing devices. Fails: the corpus's own entries define repeat-raising as the failure mode (D145 'a second stopgap raise is itself a signal the structural fix is overdue'; D160 'never a silent re-raise'; D166 point 6 'NEVER a second raise'), and the guards' stated purpose (scout cost, model portability) is a real property the raises progressively surrender."
      change_type: add
      proposed_change: "Extend validate_decisions_size with a forward-only per-NEW-entry byte cap (baseline = entries absent from origin/main, mirroring the conformance check's new-entry test); value set by operator ruling (~4-5 KB per E2 medians). Secondary: record the lever-by-ceiling matrix as one table in decision-entry.yaml's size_governance section."
      acceptance: "A synthetic new entry over the cap fails --pre; every existing entry passes; the D164-shaped ruling (3.9 KB) authors cleanly."
      severity: high
      severity_rationale: "Materially reduces the guarantee every size guard exists to give; compensating controls fail the property-match test (they gate visibility, not growth)."
      confidence: CONFIRMED
      roadmap_crossref: {classification: planned-insufficient, item_ids: [rec-2934, rec-3023, T2.56], dedup_search_terms: ["per-entry size norm", "authoring size", "decision body content", "header ceiling", "combined ceiling", "binding order", "rec-2968", "ceiling raise"], dedup_hit_count: 5, note: "rec-2934 (norm, no evaluator designed), rec-3023 (content bounding), rec-2968 (binding order), T2.56 c2 (retires ceilings at portal), PLAN-decision-ceiling-bridge (names this audit as successor). None supplies an enforced flow lever; the bridge plan explicitly defers to this audit's outcome."}
      effort: S
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "Value ruling needed; lands independent of the bridge raise."}
    - id: CFG-02
      surface: S1
      surfaces_affected: [S1]
      question: Q1
      dimension: VD5
      title: "The interventions self-consume their ration: the growth-governance lineage is 15.15% of the live file and its band's median entry is 2.2x the prior band's"
      evidence: "aggregate:docs/DECISIONS.md"
      evidence_kind: observed
      current_behavior: "E1 entry bodies sum to 86,909 B of 573,726 B live (15.15%); 9 of 120 ceiling headers (7.5%). Band medians (UTF-8 bytes, header-to-next-header spans): D<=60 2,327 (n=16), D61-100 3,898 (n=37), D101-139 3,241 (n=39), D>=140 7,257 (n=27). D160 (18,879 B) and D166 (17,240 B) are the two largest live entries. Levers reclaimed ~5-8 KB in the same window (compaction 2 stubs; one archival wave -- header relief only)."
      ideal_behavior: "An intervention's corpus record is a ruling + pointers (D164 shape, 3.8 KB): NS6 -- the cure priced within the resource it protects."
      gap: "Mechanism-density under my stated metric (distinct docs-contracts/scripts-py/config-yaml/workflows path refs per KB): 0.326 / 0.272 / 0.417 / 0.384 by band -- the governance band cites MORE mechanism per KB, i.e. the growth is spec/narrative payload, not idle prose. rec-3023's 'roughly HALVED (1.7 to 0.8 refs per KB)' uses an unstated metric my re-derivation does not reproduce; both directions support the same routing conclusion."
      compensating_controls_considered: "Immutability + compaction as eventual cleanup -- property-mismatched for change-record content: compaction requires supersession, which narrative content never gets on its own."
      survives_failure_mode: ceiling-raised
      refutation: "Counter: audit-remediation waves necessarily document themselves; the cost is transient. Fails: the band median is elevated across ALL 27 D>=140 entries, not only E1's nine, and immutability makes each byte permanent until a supersession event that pure narrative never triggers."
      change_type: rescope
      proposed_change: "The routing rule (end_state) sends specification to the owning contract and acute-state/measurement narrative to the PR record; enforced by CFG-01's cap rather than a content classifier."
      acceptance: "First 10 post-cap entries: median new-entry size <= the D101-139 band median (3,241 B) with zero loss of ruling content (operator spot-check)."
      severity: medium
      severity_rationale: "Clear fix exists (routing + cap); the harm is rationed-resource consumption, not wrong governance outcomes."
      confidence: CONFIRMED
      roadmap_crossref: {classification: planned-insufficient, item_ids: [rec-3023, rec-2934], dedup_search_terms: ["implementation narrative", "decision body", "entry size", "mechanism density"], dedup_hit_count: 2, note: "rec-3023 names the phenomenon and proposes bounding body content but supplies no enforcement design; rec-2934 is the size half. Neither prices the lineage's own consumption (this measurement is new)."}
      effort: S
      depends_on: [CFG-01]
      sequencing: {safe_to_queue_now: false, blocked_behind: [CFG-01], note: "The cap is the enforcement; this finding supplies the routing content of the rule."}
    - id: CFG-03
      surface: S4
      surfaces_affected: [S4]
      question: Q3
      dimension: VD2
      title: "The significance bar -- the only front-door control -- is self-certified: no evaluator, no recording obligation, and its stanza is absent from the contract's own marker lists"
      evidence: "docs/contracts/decision-entry.yaml:39-57"
      evidence_kind: observed
      current_behavior: "The bar (decision-entry.yaml significance:) is checked only by the drafting agent reading the planning skill's gate text. validate_decision_entry_conformance enforces Status/Date/Decision markers only. The '**Significance:**' stanza is voluntary and appears in 6 of 16 post-150 entries [153,154,155,162,163,166]; 'Significance' appears in neither required_markers nor optional_markers_fixed_spelling. Counterfactual test: delete the significance: section and every check still passes."
      ideal_behavior: "Application of the bar is recorded per new entry and lintable: a required marker whose value names one of the four routing rows."
      gap: "The one demonstrated enforcement event (DD-B's blocked Decision 167 draft) was the human operator acting as the evaluator; the ruling is recorded nowhere in the repository."
      compensating_controls_considered: "Operator review at /plan Step 6b + plan-critique -- property-matched (they CAN catch misroutes; DD-B proves one did) but unmechanized, unrecorded, and measured insufficient at scale: post-150 inflow shape is unchanged (E2: ~62% spec+change bytes)."
      survives_failure_mode: mechanism-unused
      refutation: "Counter: the operator IS the designed evaluator (Decision 146's operator-disposed stance generalizes). Fails as a full refutation: Decision 146 chose operator disposal for judgments it ruled non-mechanically-decidable; recording WHICH routing row an author claims is mechanically checkable, cheap, and was never ruled out -- self-certification without even a record is the residue of omission, not of a stance."
      change_type: enforce
      proposed_change: "Add 'Significance' to required_markers for NEW entries with value constrained to the four routing-row tokens plus one line; extend validate_decision_entry_conformance (which already reads required_markers from the contract at check time) to check presence + token."
