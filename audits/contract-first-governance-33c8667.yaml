  question_answers:
    - q: Q1
      verdict: primary-mechanism-identified
      basis: [CFG-01, CFG-02, CFG-03]
      prose: >-
        Erosion is real, and every ending that WAS an erosion shares one mechanism: the
        interventions govern STOCK (bytes, headers, index bytes) while nothing built governs
        FLOW (entry size or entry rate), and each intervention is itself recorded as a large
        live entry drawn from the stock it protects. Measured: the nine E1 entries total 86,909
        B = 15.15% of the live file; the D>=140 median entry (7,257 B) is 2.2x the D101-139
        median (3,241 B); inflow ran ~9,150 B/day and ~1.5 headers/day between D160 (07-31:
        518,839 B / 113 headers) and base (573,726 B / 119). Against that flow, the levers
        reclaimed kilobytes: compaction has processed its entire eligible live population (2
        stubs, 1,381 B remain; D149's own text nets D44's ~2 KB against its own 8.2 KB entry);
        exactly one archival wave ran (6 entries, PR #676, same day Decision 146 landed) and
        the next was declined by D160 point 5. Candidate A is CONFIRMED with one amendment:
        the lever-by-ceiling matrix (companion report) shows no built lever moves the
        first-binding ceiling -- headers are relieved ONLY by operator-disposed archival, the
        index pin ONLY by unbuilt rec-3012 -- and the sole lever moving every ceiling, the
        Decision 150 significance bar, has no evaluator (CFG-03). The connecting step from
        partial-relief to erosion is demonstrated, not assumed: each time the binding ceiling's
        lever was unavailable within days-scale runway, the sanctioned response was a raise --
        400k->500k (D145, day 5), retire-at-499,960/500,000 (D160, day 10), index pin
        110k->131k after arithmetic exhaustion (D166 p9, day 4), and the bridge raise of both
        surviving ceilings now in flight, over a decision-scout BLOCK by recorded human
        override -- against D145's own "a second stopgap raise is itself a signal" and D160's
        "never a silent re-raise" (loud, so the ritual held; the bound did not). Candidate A's
        scope limit is respected: it explains the five erosion rows (134, 145, 146-as-relief,
        150, 160). Candidate B fits the remainder: 149, 151, 152, 166 and all five audit
        rounds still hold on their own terms (grammar enforced, guards live, index generated,
        prose-context metered), so those rows are relief-still-holding, not erosion.
        rec-2968's binding-order concern is adjudicated in the companion: no surface states
        the full binding order across all four ceilings; D160 p11 ordered header-vs-combined
        only, and D166 p9 resolved the pin instance rec-2968 predicted.
    - q: Q2
      verdict: partial
      basis: [CFG-07, CFG-03]
      prose: >-
        A rule exists and is better than most: decision-entry.yaml's significance section
        gives four routing rows, Decision 86 routes rationale/intent/semantics, file-router
        routes files, and the seven homes are all real destinations. It is not decidable at
        the margin that dominates actual authoring: a governance change that installs a
        mechanism legitimately produces a numbered Decision AND a contract AND config, and no
        stated rule partitions content WITHIN the entry -- hence E2's measured shape (~62% of
        the ten newest entries' bytes are specification + change-record under
        meta.partition_rule). The sharpest decidability evidence is a pair: Decision 166 point
        6 records a "never a second raise" pre-commitment as corpus prose (08-04); PR #855
        records the same-shaped "no third seeding" pre-commitment as an enforced section
        allowlist in guard source with no Decision at all (08-05, operator-blocked draft,
        DD-B). Two competent authors, 24 hours apart, same content class, different homes --
        the rule as written is silent on the standing-commitment class and the operator's
        unstated rule filled the silence. G26's separator flip (rec-2991) is the same
        phenomenon at trivial stakes: where the grammar is silent, authors imitate
        neighbours, and which neighbour they imitate decides the outcome. External checklist:
        3 met / 9 partial / 1 missed (EX7) -- strong on identifiers, bounded retrieval, and
        reversal-condition preservation; weakest on supersession weight-shedding (missed),
        normative/informative separation, and change-record granularity. EX4 and EX7 were
        downgraded on post-run adversarial review for internal consistency with CFG-01/CFG-03,
        with the maturity consequences applied (meta.contract_notes).
      external_checklist:
        - {property: EX1, rating: partial, evidence: "Entries are immutable, numbered, supersession-marked (decision-entry.yaml supersession_marker; validate_supersession_annotations) and carry context/decision/status -- but routinely double as the specification of the thing chosen (E2 partition ~42% specification bytes; D157/158/162 clause sets). Compensating control, property-matched: the Decision 150 bar names the routing and the operator review lane demonstrably blocks misroutes (DD-B) -- but it is unevaluated (CFG-03)."}
        - {property: EX2, rating: partial, evidence: "Normative surface exists and is labelled by enforcement (contracts + validate.py registry; a clause with a check is discoverably normative), but Decision prose is itself binding, uncapitalized-normative, and cited as requirement ~19,414 times; no label separates a ruling clause from informative narrative inside an entry."}
