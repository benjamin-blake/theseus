    compose_date: "2026-08-06"
    partition_rule: >-
      Unit: UTF-8 bytes per block (paragraph, list item, or numbered clause), attributed whole
      to one class; an entry's span is its header line through the byte before the next
      '## Decision' header. Classes, first match wins: (1) change-record -- states what changed
      in THIS landing or its acute authoring-time state: measurements of the installing
      PR/corpus, runway or headroom figures, sequencing/bundling narration, verification-round
      narrative, lists of files edited; (2) specification -- states what is normatively true
      going forward, obeyable or checkable without knowing why it was chosen: shapes, enums,
      grammars, thresholds, ceilings and their values, procedures, scope/route sets,
      enforcement bindings; (3) rationale -- why this choice over alternatives, rejected
      options, principles, cost/benefit, and reversal conditions; (4) other -- header,
      Status/Date/Warehouse-ID markers, Related lists, amendment blockquotes, separators.
      Tie-break: a sentence doing two jobs classifies by its dominant clause; a specification
      stated only to describe a rejected alternative is rationale.
