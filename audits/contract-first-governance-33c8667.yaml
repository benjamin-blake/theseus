160's reversal condition (re-derive the runway and escalate the norm's priority, never a silent re-raise): measured state at 2026-08-24 is 126/132 live headers, 749,903/780,000 combined bytes, 108,079/112,000 index bytes; inflow over 2026-08-11 -> 2026-08-23 (12 days, the full depth of the CC-web shallow clone) was +40,652 combined bytes and +4 headers, i.e. ~3,388 B/day and ~0.33 headers/day, giving ~9 days of byte runway -- bytes bind first, and the byte ceiling is the one archival cannot move. Treat the rate as an upper bound: the window overlaps this audit's own remediation burst. Decomposition of that inflow: 4 new entries = 23,725 B and 15 in-place amendments = 16,927 B (42%), archive delta 0 -- the amendment share is structurally exempt from the per-entry cap via its forward-only baseline skip, and the four new entries were authored at 5,757 / 6,056 / 5,775 / 6,137 bytes against the 6,144 cap (up to 99.9% of it), so the cap is behaving as a target that pushes marginal bytes into the exempt channel. Actions: rec-2822 re-priced Medium->High and rec-2823 Low->High as the only unbuilt mechanism able to manufacture eligibility for either stock lever; rec-3243 filed for the unmetered amendment channel. Sequencing correction recorded here: step 7 is NOT blocked on step 6 -- its stated blockers are rec-2822, rec-2823 and migration step 3, and step 3 has landed.
