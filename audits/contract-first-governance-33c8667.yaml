        - {property: EX4, rating: partial, evidence: "Governance is dominantly executable: registered two-tier checks (scripts/checks/registry.py), tamper guards, marker AUTHORIZATION (Decision 165), structural size engine -- the argued, property-matched control for most of the surface. Downgraded met->partial on adversarial review: the residues are not all conscious stances -- the Intent cap and archival eligibility are explicitly operator-disposed (Decision 146 stance), but the significance bar's self-certification is the residue of omission (CFG-03's own adjudication), and EX4's pinned wording ('a rule with no evaluator is not a rule') catches the sole front-door rule."}
