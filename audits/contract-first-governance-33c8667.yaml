  end_state:
    corpus_shape: extract_machine_semantics_only
    t15_verdict: sufficient_with_specific_amendments
    t256_verdict: sufficient_with_specific_amendments
    routing_rule: >-
      For each block of durable content, ask three questions in fixed order; the first yes
      decides. (1) Could a consumer obey it, or a validator check it, without knowing why it
      was chosen? -> specification: it goes to the owning contract (ritual Class A/B/C, the
      Class-D/declared-subject mechanism shape, or the config registry the enforcing guard
      reads) and NEVER into a Decision body beyond a one-line pointer. (2) Does it state what
      changed in this landing, or its acute authoring-time state? -> change record: it goes
      to the squash-commit/PR body (or the carrying plan), never into an immutable entry.
      (3) Does it state why this choice over alternatives, or what would reverse it? -> a
      numbered Decision entry, minted only if the choice binds future work (the significance
      bar, now a required recorded marker). Content answering none of the three is not
      durable governance content and has no home to claim.
    forcing_functions:
      - {mechanism: "Per-entry byte cap on NEW entries (validate_decisions_size extension; forward-only like the conformance check; gives open rec-2934 an evaluator). Amended on adversarial review: lands WARN-tier and hard-fails only once step 3's destination readiness completes (destination-before-pressure, this audit's own one-way-at-entry lesson), with a same-PR multi-entry/same-subject review trigger guarding the split-evasion channel -- two capped entries burn headers, the FIRST-binding ceiling, so unguarded splitting could accelerate the constraint the cap relieves", survives_failure_mode: ceiling-raised, cost: "S to build; per-entry authoring discipline thereafter -- an oversized ruling must split its SPEC out to the owning contract (the intended pressure), never into a sibling entry (the guarded evasion)"}
      - {mechanism: "Significance as a REQUIRED marker on new entries, value constrained to the four routing-row tokens, enforced by validate_decision_entry_conformance -- RECLASSIFIED on adversarial review: this is a recording obligation (mandatory, typed, lintable audit trail of the author's routing claim), not a forcing function in this prompt's vocabulary, since the author still elects the routing. Its forcing partner is f1 plus the operator lane; a WARN-tier consistency lint (claimed row vs measurable proxies: entry bytes vs cap, docs/contracts/ path density, enforcement-binding references) closes the self-certification residue, with DD-B-class operator rulings recorded in superseding PR bodies (Q9 addition 6) as citable precedents. Carried in the typed front-matter envelope adopted in Q7's adjudication, not as a fifth bold marker", survives_failure_mode: mechanism-unused, cost: "XS-S for marker + check; S for the consistency lint; makes routing claims recorded and cross-checkable instead of merely self-certified"}
      - {mechanism: "New docs/contracts files must carry contract:/class: OR declared subject: + evaluator: keys; validate_contract_drift's skip branch narrows to files carrying them, and a subject-uniqueness check becomes well-posed (Q5a)", survives_failure_mode: mechanism-unused, cost: "M; ~23 free-form headers seeded once + gate edit; false positives bounded because subjects are declared, not inferred"}
