        - {property: EX7, rating: missed, evidence: "Marking and discoverability are genuinely met (markers, guard, superseded_by index edges), but the property's weight-shedding half fails outright: measured growth is monotonic (92 headers 07-16 -> 119 at base; one archival wave; compaction's eligible set empty) and archival is documented inert against the combined ceiling (validate_decisions_size.py:23-29). Downgraded partial->missed on adversarial review: the only nameable compensating control (the BUILT 146/149 mechanisms) is the one CFG-01 adjudicates property-MISMATCHED ('they gate visibility, not growth'), so no control qualifies under Q2's partial rule."}
