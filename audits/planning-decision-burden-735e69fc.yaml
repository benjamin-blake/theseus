      PLAN-plan-obligation-closure, PLAN-cfg-migration-closeout,
      PLAN-ambient-prose-contract-relocation, PLAN-inline-defer-boundary-contract, the 16
      unparsed cap-census plans (named in 7e) and the 8 plans deferring rec-3292/3293 (7d), and
