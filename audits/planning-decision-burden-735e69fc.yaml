  question_answers:
    - q: Q1
      verdict: CONFIRMED
      basis: [PDB-01, PDB-02]
      prose: >-
        Pinned framing applied: a split half is non-roadmap-grain work whose ruled long-term
        home is a recommendation (decision-entry.yaml:412-424 work_item row; Decision 67
        freeze; T4.3 not landed), so every B1 remedy below is a bridge with a declared sunset
        and was compared against extending T-1.23. Established, not assumed: a follow-on rec
        has NO surfacing path today. /orient reads only the preflight cache and a roadmap
        projection (orient/SKILL.md:22-40; the word 'recommendations-log' does not occur in the
        orient skill or command) and the only rec class preflight lifts into that cache is
        source=ci_rca (scripts/session/preflight.py:251-296); /plan Step 3 suggests recs by
        keyword match against the human's own task description (plan.md:48;
        planning/SKILL.md:177-186), which succeeds only when the human already remembers the
        topic -- the control fails exactly when the burden bites, so it is not property-matched.
        Who decides to split: the freeze override (planning/SKILL.md:245-250) makes splitting
        the session's choice ('author as a single larger IMPLEMENTATION plan, or split ... The
        heuristic is informational only during freeze'), the cap menu at plan.md:101 offers it,
        and the critic suggests it through its template (PDB-02); validate_vp_replay's
        one-plan-per-PR rule forces mechanical partitions (rec-3139; both halves of
        PLAN-oidc-immutable-subject-recovery sit in the cap census); the burden binds whenever a
        split occurs, by any producer, because no rule says where the second half goes.
        Counterfactual on the sample: PLAN-t014-phase3-residual-sweep records a 'named follow-on
        plan ... that was never written' until an audit (F-036) found it -- a criterion-grain
        case from 2026-06-15 that predates T-1.23's needs_followon_plan (#255, 2026-06-24), would
        surface today, and is cited as the pre-T-1.23 baseline rather than as B1's evidence; the
        fork-B backlog
        recovery named in PLAN-verification-graduation-enforcement (2026-07-16) has no successor
        plan or rec anywhere in the corpus while its rec-2677 stays open; rec-3078 (the executing
        legs split off PLAN-plan-obligation-closure) sits in the queue with no surfacing path;
        rec-3091 (open, 2026-08-11) records the post-deploy variant of the same loss -- a
        human-gated half left with no tracked artefact for five weeks -- and asks for the same
        rec-plus-field shapes; recs matching the follow-on/split pattern stay open at 62 percent
        against a 41 percent base rate (65 of 105; contract_notes 7f, census context rather than
        evidence). Where a half DID resurface it
        was carried by a Decision's reversal clause (Decision 127 naming 'the B2 follow-on' ->
        PLAN-prose-ratchet-cleanup), an audit finding list (CIRCA-03/05 -> later plans), or the
        same human on the same day (rec-3394/3395 -> PLAN-roadmap-blocking-edge-semantics) --
        never by the workflow. Decision 115's reversal condition ('a genuine need for handoff
        state that outlives both the originating PR description and the plan/roadmap structured
        stores') is NOT tripped: the split half already lives in the plan YAML's context (the
        durable half's prescribed store); what is missing is a typed key and a reader, which
        B1-R5 and B1-R4 supply inside Decision 115's stores. The requester's two 'unworkable'
        alternatives were adjudicated anyway: same-session parallel planning (B1-R2) is
        observed to work for an independent seam (PR #818, 'split from one parent on a
        zero-shared-source seam') and to be unworkable for the dependent case that defines B1;
        planning the second half in a subagent (B1-R3) is the overseer's G1 decomposition by
        construction. Adopted as one bridge: B1-R5 (a typed followon_recs field, which survives
        to T4.5 as a column), B1-R1 (file the half as a follow-on-tagged rec at the moment the
        split is decided; its close-out rendering retires at CD.17 reversal) and B1-R4
        (preflight computes readiness and /orient renders the paste-ready prompt; the rendering
        retires at CD.17 reversal, the tag and the readiness key survive as the queue's signal).
