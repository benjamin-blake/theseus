    audited_commit: 735e69fc
    base_branch: main
    model: "Claude (claude-fable-5-1 configured; serving model self-reported by the harness)"
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5, S6, S7]
    degraded_dedup: false
    contract_notes: >-
      (1) dedup_hit_count convention: the count is the number of items found by the recorded
      search terms that OWN or PARTIALLY OWN the interactive-era defect or remedy; every counted
      item is named -- in item_ids for a finding, in a 'Counted:' clause of the rationale for a
      remedy -- so count == len(named owners) everywhere; owning_end_state_item is never counted
      (it owns the end state, not the defect); adjacent non-owners are named and not counted; a
      complete item counts when its shipped mechanism covers part of the defect's population
      (T-1.23 on PDB-01, T-1.21 on PDB-04, T3.8 on PDB-06), which is the planned-insufficient
      relation, so a non-zero finding count always pairs with a planned-insufficient or
      planned-unbuilt classification; an item that merely blocks a rejected alternative is
      adjacent, not an owner (rec-3042 on B1-R3), while an item whose defect a remedy's mechanism
      partly serves is a partial owner (rec-3042 on B2-R4's dispatched-mode carrier).
      (2) Rec-sample tie-break: exactly five of the 65 follow-on/split-language open recs share
      the bulk-import created date 2026-04-21 (age 134: rec-431, rec-280, rec-226, rec-225,
      rec-133) and all five are in the sample; the sixth oldest is rec-597 at 120 days and is
      unique, so no tie needed breaking.
      (3) The tight split pattern has 7 false positives (terraform 'split plan/apply',
      'second half of the fix', 'second half of a command', the scout's 'second half' etc.)
      and at least one false negative (PLAN-ci-rca-evidence-scope-declaration records
      'Split: ... moved to PLAN-ci-rca-abstention-and-citation', which the pattern does not
      match); the DD-A sample was drawn from the 35 matches after reading each match context,
      so the 4+2 sampled plans are genuine plan-splits, not pattern artefacts; the '2 naming
      another plan' reserve was filled under the bare PLAN-<slug> token reading (17 plans), not
      the literal .yaml-suffixed reading (5), because the two sampled plans name their other
      half by slug.
      (4) `bin/venv-python -m scripts.validate --pre` was not run; the two deliverables are
      audits/*.yaml|md, an exempt workflow_outputs class, and the clean YAML parse is the
      pre-push gate per SETUP.
      (5) Runtime tokens and wall-clock are 'unmeasured -- no substrate' throughout except
      where a plan context records a measurement (the 9s empty-diff --pre baseline recorded
      by PLAN-fast-tier-budget-overrun); dispatch counts are exact.
      (6) The audit branch was cut from origin/main (not the harness session branch) per
      COMMIT / PR MECHANICS step 2.
      (7) Pinned census methods beyond the prompt's: (a) 'plans recording a human or operator
      ruling' = joined context matches the case-insensitive pattern `operator decision|human
      decision|operator ruling|human chose|human directed|directed by the human|surfaced to the
      human|human authori[sz]|explicit human|operator authori[sz]|human-blessed|Step 6b` -> 64;
      (b) 'ad-hoc phase text' = the `phase` field matches `no tier_item|ad.hoc|soft-warn|
      user_explicit|ad_hoc_rec|claims no tier|naming no (carrier )?tier_item|not a tier_item`
      -> 133 (a stricter token-and-no-item-id reading gives 107; 'names no T<n>.<m> id at all'
      gives 174 -- the 133 is the pinned figure, the others bound it); (c) 'fork-shape context'
      = `Step 6b fork|fork \d|\[recommended\]|option \(?[12ab]\)?[^.]{0,40}vs|options?: \(1\)`
      -> 2 (PLAN-dcg-decisions-index, PLAN-provisional-contract-alarm; a looser 'vs ...
      recommend' reading adds PLAN-platform-roadmap-trim); (d) 'ci-rca rec deferred in a plan' =
      the rec id and the substring 'defer' occur in the SAME context entry of a merged plan and
      the rec is source=ci_rca -> 42 recs deferred in two or more plans; (e) 'cap census' = a
      gates line that parses with the prompt's regex as REVISE at round 3 or any verdict at round
      4 or more (18 plans), OR an unparsed gates line matching `REVISE\s*x\s*[3-9]|round [4-9]|
      3-round|round-3|the cap` (16 plans) -> 34 plans record reaching the cap; the disposition
      is read from the gates line text and classed continue (a further round ran or is pending:
      20 -- the 12 four-plus regex plans, PLAN-plan-resolution-content-keyed, and
      PLAN-coverage-gate-presubmit, PLAN-decision-corpus-stock-ceiling-retirement,
      PLAN-ducklake-maintenance-smoke-split, PLAN-inline-defer-boundary-contract,
      PLAN-oidc-trust-contraction-closure, PLAN-terraform-decompose-oidc-rename,
      PLAN-verification-registry-sharding), accept-at-cap (the human accepted or directed merge
      with no further round: 12 -- PLAN-contracts-first-class-migration,
      PLAN-decision-entry-flow-governance, PLAN-oidc-failopen-closure,
      PLAN-oidc-immutable-subject-trust-restore, PLAN-adr-restructure-wave,
      PLAN-class-d-contract-enforcers, PLAN-class-d-enforcers-wave-2,
