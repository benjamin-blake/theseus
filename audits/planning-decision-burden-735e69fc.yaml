      plan|split` over title plus context: 105 recs match in total, 65 of them open (62 percent,
      against a 41 percent open rate over all 2,115 recs); of the 65, 59 are matched only by the
      bare token 'split' (31 of them code-review recs, mostly code-split suggestions), 6 carry
      explicit follow-on-plan or follow-up-plan phrasing (4 implement-agent, 2 code-review), and
      23 are planning- or implement-sourced; the pattern is a census key, not a claim that all
      65 are deferred halves, and the B1 evidence rests on the read subset (rec-3078, rec-3232,
