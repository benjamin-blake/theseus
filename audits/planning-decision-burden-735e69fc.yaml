    - q: Q6
      answers:
        - question: "Does any adopted remedy make the human's confirmation at Step 6b a rubber stamp (Decision 75)?"
          answer: >-
            B2-R4 reduces depth, not visibility: every consistency-only fork still appears at
            Step 6b as a one-line decided-with-notice entry the human can veto, authority-bearing
            forks still ask, and the frame itself is challenged by the critic's Phase 2b
            (plan-critique/SKILL.md:93-109), which B2-R4 does not touch. The rubber-stamp risk
            is the human skimming the notice list; the observable signal is a decided-with-notice
            fork later reversed by a critique REVISE or by a Decision, which the record grammar
            makes countable. B3-R3 removes a human turn that the record shows was a formality in
            20 of 32 legible cases ('continue') and replaces it with a fresh evaluation, which is
            the opposite of a rubber stamp.
          basis: [PDB-03, PDB-05]
        - question: "Which adopted remedies survive the end state, which retire at their sunset, and which need a T4.2-era persona equivalent?"
          answer: >-
            Survive unchanged: B1-R4's follow-on-marked rec and readiness key (the destination
            form; T4.3 feeds it to the queue), B1-R5's followon_recs field (becomes a column at
            T4.5), B2-R5's roadmap projection (an input to the decision_scout persona T4.2 names;
            T4.10a's input_schema carries it), B3-R5's critic-authored tags (T4.16 c4:
            critique_history is critic-appended), B4-O1 (renders the queue T4.3 populates).
            Retire at sunset: B1-R1's close-out rendering and B1-R4's follow-on-readiness rendering
            (CD.17 reversal, when the executor pulls from the queue; the /orient subsection itself
            persists as the queue lane B4-O1 renders for the human), B5-O1 (retires when Decision
            73 point 4's planning-queue block stops routing ci-rca deferrals through a human
            /plan session, i.e. CD.17 reversal and executor consumption of the queue; the
            fixed-but-open case it instruments closes earlier once T3.9 lands). Need a
            persona equivalent: B2-R4's classification becomes the plan_agent persona's autonomy
            clause in its T4.10a contract and the AskUserQuestion carrier retires; B3-R2 and
            B3-R3 become T4.11's loop budgets (max plan revisions, exhausted budget routes to RCA)
            with the recurrence test as a state-machine predicate; B3-R1's tie-breaker becomes
            the critique_gate aggregator with critic-authored verdicts (T4.16 c4).
          basis: [PDB-01, PDB-03, PDB-05]
        - question: "The prior audit found the round-count substrate corrupted (34 plans carry the placeholder). Does anything adopted here make the requester's future transcript analysis possible?"
          answer: >-
            Partly. B3-R5's per-finding tags and B3-R2's escalation shape are critic- and
            planner-authored content that a pinned gates line can carry per round, and B3-R3's
            recurrence key gives each finding a stable identity; but they land in a
            machine-readable form only once PWS-01's grammar (an adopted, unlanded prior-audit
            proposal with an optional human-authorisation clause) or Decision 87's
            critique_history / telemetry homes (T4.5, T2.36) exist. The cap census here had to
            read 16 of 34 cap hits from unparsed free text, which is the measure of that gap.
            Until then the record is a richer free-text line plus the PR body -- readable by a
            human, not by a program. Nothing adopted here builds telemetry, per scope discipline.
          basis: [PDB-05]
        - question: "Would the requester be better served by fewer, larger plans than by any B1 remedy?"
          answer: >-
            No, on the corpus. Round count tracks scope: the four-plus-round set is dominated by
            wide plans (13 scope files in PLAN-pr-conflict-signal-exit-status, ten consumers in
            PLAN-ci-rca-adjudication-guard, 13 VP steps in PLAN-esb-text-fix-bundle), and the one
            recorded same-session split (PR #818: nine critique rounds across a parent that
            'had accreted to 19 files' per PLAN-ci-rca-abstention-and-citation's context and its two
            halves, 13 and 18 files per PR #818 with 14 scope entries in the merged first half)
            produced two independently mergeable plans. Splitting is the session's choice under the freeze override
            (planning/SKILL.md:245-250, 'informational only during freeze'), so part of B1's
            incidence is the requester's own habit of splitting -- but the burden binds whenever
            a split occurs, by any producer, and larger plans would move the same cost into
            critique rounds and implement sessions rather than remove it; the memory burden is per
            split, not per plan.
          basis: [PDB-01, PDB-05]
        - question: "Where does /implement's Step 8 Capture Friction and the Medium/Low-findings-become-recs path interact with B1: is the split half already being filed there, and why does it not resurface?"
          answer: >-
            Yes, it is filed there: 12 of the 65 follow-on/split-language open recs are
            implement-agent or implement-session sourced (rec-3078 'split off the two executing
            legs'; rec-3232 'accumulate forward-arm data before the blocking flip'), and 11 are
            planning-sourced (rec-3393 filed today for a plan that 'scoped itself to roadmap/CD
            encoding only'). They do not resurface because the only readers of the rec cache at
            work-selection time are preflight's ci_rca filters and /plan Step 3's keyword match
            against the human's own words (plan.md:48); nothing marks them as successors and
            /orient never reads recs (rec-3054 records the same gap for Critical recs). B1-R4
            adds the marker and the reader; B1-R1 makes the filing a step rather than a side
            effect of a code-review finding.
          basis: [PDB-01]
        - question: "Are B1, B2b and B3 three burdens or three symptoms of one absent record? If one, is a single mechanism cheaper than the adopted set?"
          answer: >-
            B1 and B3 share a root -- a planning session's decisions leave no typed trace (no
            successor field; a free-text gates line with 34 placeholders and 16 cap hits the
            regex cannot read; rec-3080's chat-only verdicts; per-round content squash-merged
            away) -- and one mechanism serves both: the plan YAML as the typed record, i.e.
            B1-R5's field plus PWS-01's pinned gates grammar carrying B3-R5's tags. That is
            cheaper than two stores and is why B1-R5 and B3-R5 are schema and output-template
            changes rather than prose. B2b is a different defect (a corpus the gates never read),
            so it needs its own mechanism (B2-R5). Expressed via also_serves only where a remedy
            relieves a second burden outright: B1-R4 -> B4.
          basis: [PDB-01, PDB-04, PDB-05]
        - question: "Is the burden absent machinery or unused machinery? Is 'the overseer is not the default for this work class' a live hypothesis, and what would make it one?"
          answer: >-
            Both. /overseer already narrows the human to G0/G1/G3, carries decomposition across
            dispatches and owns the autonomy-boundary policy B2-R4 ports (overseer/SKILL.md:
            171-194), so for a body of work KNOWN to be multi-slice at intake the machinery
            exists and B1-R3 is simply the overseer. It is not the default because the split
            usually emerges mid-session (at the freeze override or the cap), because rec-3042
            (open) contradicts the claim that a dispatched author can satisfy Step 6b and rec-2802
            (open) records that the cap escalation itself assumes a live chat turn, and because a
            one-slice intent pays the ledger and read-nothing overhead for nothing. The
            hypothesis is live; what would make the overseer the default is a 'promote to
            overseer' exit from /plan at the moment a split is decided (the first plan's PR as
            G0 intake) -- recorded here as a question, not a remedy, because it has no landing
            surface until rec-3042 is resolved.
          basis: [PDB-01]
        - question: "Own question 1: why do mechanical defects surface in late critique rounds, and what does that imply for a pre-lint?"
          answer: >-
            Because fixes introduce them: PLAN-ci-rca-adjudication-guard's round 3 redded the
            plan's own PR under validate_handoff_full_tier and tripped a pytest flag collision,
            defects absent from round 1; PLAN-verification-registry-sharding's gates line records
            round-3 blockers 'all mechanical and introduced by the round-2 test decomposition';
            PLAN-opswriter-never-drain-guard's round 3 findings were VP literals that
            validate_vp_replay would reject. A pre-lint before round 1 (B3-R4) therefore buys
            little for B3; the mechanical check must run before EVERY re-dispatch, which is why
            B3-R2 makes `validate --pre` on the revised plan a precondition of each re-launch and
            why B3-R4 is rejected as a B3 remedy while its general form stays with the prior
            audit's P2/P3 (rec-2943 records a second, non-fix-induced cause of late findings: the
            scout cannot triage VP-governing decisions because the VP is authored after Step 6a).
          basis: [PDB-05]
        - question: "Own question 2: does the human's 'merge' at the cap ever merge a plan whose recorded verdict is REVISE, and does /implement care?"
          answer: >-
            Yes, often: 12 of the 32 legible cap dispositions are accept-at-cap with the round-3
            findings applied and never re-critiqued, and 6 regex-parsed gates lines end 'REVISE
            after 3 round(s)' (e.g. PLAN-decision-entry-flow-governance 'operator-accepted');
            PLAN-esb-text-fix-bundle records 'REVISE after 4 round(s)' accepted with a
            human-approved fold-in. /implement reads the plan (implement.md:48) but gates on
            nothing in the gates line, so an accepted-with-deferral REVISE and a PROCEED are
            indistinguishable to it. B3-R2's pinned escalation shape records the acceptance
            clause and B3-R3's autonomous confirming round gives those fixes the fresh evaluation
            the human waived; whether /implement should refuse a terminal REVISE without an
            acceptance clause is a decision for the human, not this audit.
          basis: [PDB-05]
        - question: "Own question 3: what did the sweep for burdens the requester did not name (B4-B6) find, and why is neither survivor CONFIRMED?"
          answer: >-
            Two unnamed burdens with evidence, none without. B4 (ad-hoc work is unoriented) is
            PARTIAL: rec-3054 is a human-filed instance and 133 of 366 plans carry ad-hoc phase
            text, but the reader gap is PDB-01's at another grain, so no separate finding is
            filed. B5 (repeated ci-rca deferral) is PARTIAL with one medium finding (PDB-06): the
            observed pair rec-3292/3293 was fixed on main the day it was filed (#971, #972, no
            Resolves trailer), the likely-resolved signal aged out of preflight's five-commit
            window (env_git.py:192), T3.8's relevance engine that would have said 'satisfied' is
            not wired to the block, and eight later plans re-derived the deferral -- five on
            explicit human direction, three agent-logged, which the rule permits (a logged
            rationale lifts the block, planning/SKILL.md:46). The workflow's share is the lost
            fact (acceptance already passes) and the lost count; the human's share is choosing
            to defer rather than close with the proof preflight offered inside the window. No
            B6 candidate survived the evidence test: every other repeated human turn found in
            the sample (the Step 6b confirmation, the Decision Significance Gate, VP compliance
            acceptance) is a decision the workflow intends the human to make.
          basis: [PDB-06]

