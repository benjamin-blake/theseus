      the prose and structural size budgets); S7 = carrying surfaces (decision-entry.yaml's
      routing rule, DECISIONS.md, ROADMAP-PLATFORM.yaml, the recommendation portal, PR bodies).
      Dimensions: VD1 decision-load reduction; VD2 handoff durability; VD3 carrying-cost
      proportionality; VD4 mechanization fitness; VD5 governance-vehicle fit; VD6 weak-executor
      operability; VD7 evidence grounding. Non-negotiables (the prompt's): NS-A bounded
      authority (agents propose, the human disposes; no silent transfer); NS-B agent-first
