      +1 delta on B3-R5's clause is exact. Carrying-cost deltas for text not yet written are
      estimates and are marked with '~'; headroom, funding-line sizes and B3-R5's delta are
      measured; a remedy's CONFIRMED confidence refers to its landing surface, headroom and
      sunset re-derived from the tree, never to the estimate. (14) Self-verification cap: The gate did not pass after the third revision (round 4: R1 REVISE, R2 PROCEED, R3 REVISE, R4 PROCEED); per the cap rule, revising stopped, every round-4 finding is recorded verbatim below, and the confidence of every finding and remedy those findings touch is downgraded to HYPOTHESIS: findings PDB-01, PDB-02, PDB-03, PDB-05, PDB-06; remedies B1-R1, B1-R4, B1-R5, B2-R2, B2-R4, B2-R5, B3-R1, B3-R3, B3-R5, B5-O1 (B4-O1 was already HYPOTHESIS).
