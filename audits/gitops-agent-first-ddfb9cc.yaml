      title: "The merge method every consumer depends on is not declared in infrastructure-as-code,
        and the ruleset still permits rebase-merge"
      evidence: "terraform/github/repo.tf:39-44 (allow_merge_commit, allow_squash_merge,
        allow_rebase_merge, allow_auto_merge, allow_update_branch, delete_branch_on_merge all inside
        lifecycle.ignore_changes); repo.tf:110 (required_linear_history forbids only merge commits);
