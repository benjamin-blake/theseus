  findings:
    - id: GITOPS-01
      candidate_ids: [C5, C6]
      surface: [S2, S3]
      question: [Q1, Q4]
      dimension: [VD2, VD4, VD5]
      title: "Resolves-trailer delivery works only via undocumented merge-time commit_message
        composition; two of three documenting surfaces misdescribe the path"
      evidence: "AGENTS.md:236; .claude/skills/implement/SKILL.md:547; .github/pull_request_template.md
        Resolves section; observed: aa20689 (#888) squash body hand-composed with trailer while neither
        the PR body verbatim nor any branch commit carries that text; 84f9209 (#887) single-commit body
        inherited verbatim"
      evidence_kind: observed
      current_behavior: "SKILL.md instructs placing the trailer in the PR body and claims the squash
        commit inherits it -- empirically false (merge_pull_request without commit_message inherits the
        single branch commit's message, per the rec-2679/rec-2733 incidents on PRs #557/#627). In
        practice merging agents hand-compose commit_message including the trailer, which no surface
        documents; when one forgets, rec-autoclose silently no-ops (its no-trailer path is an explicit
        exit 0). The window shows the compensation mostly working: all 5 landed plans' bundled recs
        closed."
      ideal_behavior: "One documented delivery path -- explicit commit_message on merge_pull_request
        carrying the trailer -- stated identically in AGENTS.md, SKILL.md, and the PR template, plus a
        post-merge validation (the skill's existing step-5 fallback made checkable) so a dropped
        trailer is loud."
      gap: "The load-bearing step exists only as folklore; the documented instruction reproduces the
        loss mode on any single-commit PR merged by an agent that follows it literally."
      compensating_controls_considered: "Skill step 5 post-merge closeout fallback (manual, unverified);
        plan_audit rec-in-git grep (advisory); manual portal close (observed in sample) -- none makes
        the loss loud at merge time."
      change_type: unify
      proposed_change: "Amend AGENTS.md step 5 and SKILL.md step 1/4 to instruct composing
        commit_message explicitly (rec-2733's remedy, matching observed practice); align SKILL.md:547
        with the PR template's correct warning (rec-2679); add a rec-autoclose-side or postflight check
        that a merged feat PR whose plan had non-empty bundled_recommendations produced a trailer."
      acceptance: "grep of SKILL.md and AGENTS.md shows the explicit-commit_message instruction; a
        merged bundled-rec PR without a trailer produces a loud signal (workflow annotation or filed
        rec) within one CI cycle."
      severity: medium
      severity_rationale: "Silent no-op class, but with observed-working compensation, a manual
        fallback step, and two incident recs already tracking it -- material, not high."
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: [rec-2679, rec-2733]
        dedup_search_terms: [trailer, squash, commit message, merge_method]
        dedup_hit_count: 7
