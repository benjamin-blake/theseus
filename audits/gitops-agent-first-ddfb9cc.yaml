    - id: GITOPS-05
      candidate_ids: [C12, C13]
      surface: [S6]
      question: [Q5]
      dimension: [VD4]
      title: "Conflict-wake losses are invisible (success conclusion) and a PR conflicted at creation
        gets no wake at all"
      evidence: ".github/workflows/pr-conflict-signal.yml (triggers: push to main + dispatch only;
        poll step continue-on-error: true); scripts/ci/pr_conflict_signal.sh (_signal_failure ->
        _FAILURE_COUNT -> exit 1); observed: 249 runs, 15 most recent all conclusion=success"
      evidence_kind: observed
      current_behavior: "C13: a claude/* PR that is CONFLICTING at creation time receives no wake
        until the next unrelated push to main -- no trigger covers PR creation. Rare (the commit flow
        auto-rebases before push) but exactly the stranded-session case the workflow exists to
        prevent. C12: the script's failure ledger is real (marker to stderr + step summary, exit 1)
        but the step's continue-on-error converts every outcome to run success, so a genuinely lost
        wake (e.g. gh pr list failing the whole sweep) is observable only by reading step summaries
        nobody monitors. Losses ARE bounded: any later push to main re-polls (observed cadence ~5.5
        pushes/day), and the latest run correctly idempotent-skipped the live conflicted PR #781."
      ideal_behavior: "Add pull_request [opened, reopened] (or a schedule fallback) to the trigger set
        so creation-time conflicts wake; surface _FAILURE_COUNT>0 as a visible signal (a
        workflow-level annotation, a filed rec via the watched ci-rca set, or a distinct neutral
        check conclusion) while keeping the never-red-a-build invariant."
      gap: "The unbounded corner of an otherwise bounded design: zero-trigger at creation plus
        masked failures equals a strandable session with no signal anywhere."
      compensating_controls_considered: "Next-push re-poll (property match: covers C13 only if a push
        happens -- fails on a quiet main); human nudge (documented residual -- not same-property: it
        requires the human to notice the silence the wake exists to prevent); ci-rca does not watch
        this workflow (its runs always conclude success, so watching would not help without the
        exit-status fix)."
      change_type: retune_gate
      proposed_change: "Extend triggers with pull_request types [opened, reopened] scoped to claude/*
        (the script is already idempotent per head SHA, so extra invocations are safe), and emit a
        loud artifact on _FAILURE_COUNT>0 (e.g. file a rec through the portal or fail a separate
        non-required observability job)."
      acceptance: "A PR opened already-conflicting receives its wake within one workflow cycle without
        any push to main; a forced gh failure in the sweep produces a signal visible outside the run's
        own logs."
      severity: medium
      severity_rationale: "Loss modes are real but bounded by push cadence and idempotent re-polls;
        the stranded case terminates in the documented human-nudge fallback rather than a wrong
        action."
      confidence: CONFIRMED
