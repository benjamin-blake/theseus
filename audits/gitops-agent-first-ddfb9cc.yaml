          match observed practice -- adequate but unbuilt for that half. Classified
          planned-insufficient because the third surface's owner (workflow-review-d107b4a.yaml:560 /
          CE-11) proposes reconciling the drift TO the inheritance wording this audit empirically
          falsified, and no owner covers post-merge trailer validation. rec-2922 (parser over-match) is
          adjacent, not owning."
      effort: S
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "Doc halves land independently;
        the validation half should land with or after them."}
    - id: GITOPS-02
      candidate_ids: [C3, C4]
      surface: [S2]
      question: [Q4]
      dimension: [VD2]
      title: "Load-bearing commit-subject grammar is unenforced and its registered table is incomplete"
      evidence: "AGENTS.md:190-198 (five prefixes); window sweep over all 50 commits: 23 feat(, 22
        plan(, 2 audit(, 1 fix(, 1 docs(, 1 bare 'audit:' (#864, dcdf416); re-derived: no
