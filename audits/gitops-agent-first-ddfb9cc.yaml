      evidence_kind: static
      current_behavior: "Squash-only is policy (Decision 89 clause 4, preserved by Decision 76) and
        the whole DD-A consumer stack assumes it, but the live enforcement chain is: ruleset forbids
        merge commits only; the allow_* toggles and the squash-message default are UI-mutable with
        zero Terraform diff and zero review. An out-of-band enable of rebase-merge (or a
        squash-message default change) would silently expose the HEAD~1 diff base, rec-autoclose's
        single-commit read, and the trailer inheritance path. Could not read live values (API access
        unavailable this session); drift is a possibility surface, not an observed state."
      ideal_behavior: "allow_squash_merge=true, allow_rebase_merge=false, allow_merge_commit=false,
        and the squash_merge_commit_* defaults declared in terraform/github/repo.tf (removed from
        ignore_changes), so the method consumers rely on is a reviewed, CODEOWNERS-gated,
        drift-detectable declaration."
      gap: "NS5 violation at the policy root: the single highest-leverage setting in scope is the one
        setting nothing enforces or even observes."
      compensating_controls_considered: "Sole-collaborator reality (only the admin can click it --
