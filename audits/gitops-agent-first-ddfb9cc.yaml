        module's human-gated runbook."
      acceptance: "terraform plan against terraform/github shows the settings managed and converged;
        a UI toggle of allow_rebase_merge subsequently surfaces as drift in plan."
      severity: medium
      severity_rationale: "Requires deliberate admin action to trigger, but the failure it enables is
        silent and broad; a declaration is cheap."
      confidence: CONFIRMED
