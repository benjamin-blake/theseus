audit:
  meta:
    audited_commit: ddfb9cc
    base_branch: main
    model: "claude-fable-5"
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5, S6, S7]
    degraded_dedup: false
    contract_notes: "Direct GitHub REST access is proxy-blocked in this session, so the repo merge-method
      settings (allow_squash_merge / allow_rebase_merge / squash_merge_commit_message) could not be read
      from the API; live squash behaviour was instead established from observed squash-commit bodies and
      PR-head-commit comparisons (evidence_kind observed); conflict-signal FAILURE-marker sweep covered run
      conclusions for the 15 most recent runs but job logs for only the latest run (which showed the
      idempotent skip of live-conflicted PR #781); empirical commit sweep covered the entire 50-commit
      shallow window (under the 80 cap); PR-ref fetches for the DD-D sample left the shallow boundary
      unmoved (re-checked before and after)."
    stale_anchors: []
  question_answers:
    - q: Q1
      verdict: keep-squash
      basis: [GITOPS-01, GITOPS-04, GITOPS-06]
      prose: "Both ledgers were traced before forming a view. DD-A (cost of changing): the squash shape is
        load-bearing in at least five places. push_context_base() (scripts/checks/_common.py:40) prefers
        GITHUB_EVENT_BEFORE but falls back to HEAD~1 under fetch-depth 2 (ci.yml:96, main-canary.yml:22),
        a pairing Decision 159 explicitly attributes to the squash convention and verify_ci_workflow.py
        (~152) pins with a guard that names the assumption; under rebase-merge of an N-commit batch the
        HEAD~1 fallback silently under-selects (exactly the accepted residual Decision 159 clause 5 records
        for multi-commit pushes), a silent wrong-scope failure class. rec-autoclose.yml reads exactly one
        commit (git log -1 --format=%B HEAD); under rebase-merge a trailer in any non-tip commit of the
        batch is silently missed, and under merge-commit the merge-commit message carries no trailer unless
        separately composed -- either way the trailer transport must be redesigned. The feat({slug})
        resolution in validate_vp_replay/validate_graduation_completeness operates on branch-side
        `origin/main..HEAD` and is strategy-tolerant at PR time, but a rebase-merged main would carry
        fix({slug}) fixup subjects that pollute subject-grammar consumers. plan_audit._verify_rec_in_git
        greps full messages and survives any strategy that lands the trailer somewhere. The
        session_start_sync_main.sh hook exists specifically because server-side squash leaves local main
        with no fast-forward path -- rebase-merge would relax that, a small credit to changing.
        DD-B (trailer drift): AGENTS.md:236 places the trailer in the squash-merge commit body;
        implement/SKILL.md:547 places it in the PR body 'which the squash-merge commit body inherits';
        .github/pull_request_template.md places it in the commit body and explicitly warns 'not just the
        PR description'. The SKILL.md inheritance claim is empirically false here: observed squash bodies
        (e.g. 84f9209 for #887, aa20689 for #888) are hand-composed condensed summaries -- not the PR body,
        not concatenated branch commits (PR #888's branch commits carry no trailer yet its squash body
        does) -- so the working delivery path is merge-time composition of commit_message, which no surface
        documents. rec-2679/rec-2733 are re-assessed in GITOPS-01: their remedies (trailer in the git
        commit message; explicit commit_message on merge_pull_request) remain the right fix and match
        observed practice; a merge-strategy change would not obviate them -- rebase-merge would make the
        loss mode strictly worse (no new commit is ever composed), merge-commit equally requires message
        composition. DD-D (cost of keeping): sampled pre-merge commit counts over 7 merged PRs were
        1,1,2,2,2,3,4 -- the collapsed sequence is predominantly implementation-plus-CI-fixups, and the
        fixup narrative is disclosed in PR bodies which the composed squash bodies condense. The full
        pre-merge sequences survive server-side: git ls-remote counted 894 refs/pull/*/head, and 6 were
        fetched successfully without moving the shallow boundary; nothing in-repo fetches them today.
        That nothing-fetches / nothing-bisects result was tested against the absence-of-need vs
        absence-of-capability distinction: I judge it mostly absence-of-need -- rationale provenance is
        dense in the parallel stores (plans, decisions, recs, PR bodies) and every main commit is a
        CI-green reviewed unit, which makes PR-grain bisect and revert BETTER than intra-PR grain (whose
        intermediate commits are individually untested) -- while acknowledging the evidence-shape
        asymmetry: under squash nothing could have been cheaply built against intra-PR history, so its
        absence is weak evidence. The candidate set as handed leaned slightly cost-of-keeping by count
        (C9/C15-C18 vs C1/C2/C7/C8/C14) but the traced weight runs the other way: the cost-of-keeping
        items dissolved on trace (C9 is dormant and only merge-commit would fix it; C15-C18 are
        compensated), while the cost-of-changing items are live, load-bearing mechanisms. Verdict:
        keep-squash, CONFIRMED. Rebase-merge buys intra-PR granularity nothing consumes at the price of
        two silent-failure classes; merge-commit is forbidden by required_linear_history
        (terraform/github/repo.tf:110) and its reviewed, CODEOWNERS-gated ruleset change (C8) buys only
        the dormant branch-lifecycle predicate fix (GITOPS-04); hybrid puts two history shapes on one
        main so every consumer meets both."
    - q: Q2
      verdict: partially-load-bearing
      basis: []
      prose: "Git history is irreplaceably load-bearing for four things the parallel stores structurally
        cannot carry better: (1) diff derivation -- every diff-scoped gate (push_context_base consumers,
        contract drift, plan-scope closure, coverage scoping) computes from commits, and the stores hold
        no tree objects; (2) ancestry -- classify_closed_head's regression-vs-stale-rerun call is a
        merge-base ancestry test over fixed_by_sha, which rec-autoclose stamps INTO the warehouse as a
        git-SHA reference, making git the resolver of a warehouse field; (3) ordering/identity -- the
        convergence record, plan.bin content-addressing, and CI wake idempotency markers all key on
        commit SHAs; (4) the atomic merge event itself as the trigger edge for rec-autoclose and the
        deploy channels. Conversely, narrative rationale is carried better by the stores: plans hold
        intent and verification design, DECISIONS.md holds authority, recs hold SCD2-versioned work
        state, PR bodies hold execution disclosures -- and the composed squash bodies (DD-D) duplicate a
        condensed projection of that narrative, which is a deliberate redundancy (local availability)
        rather than a source-of-truth split, since the PR record remains authoritative. Hence partially:
        identity/ancestry/diff are git-only; why-narrative is store-primary with git as a local cache."
    - q: Q3a
      verdict: shallow-clone-dominant
      basis: [GITOPS-03]
      prose: "The two causes separate cleanly on evidence. The squash policy costs intra-PR granularity
        (bounded, compensated -- see Q1/DD-D). The shallow clone costs ALL local history beyond a 9-day
        window: rev-list count is 50 commits spanning 2026-08-04..2026-08-13, so any query about anything
        older returns nothing or -- worse -- a confident wrong answer at the boundary (trap 9, reproduced:
        the boundary commit 5bd32ea locally claims to touch docs/SESSION_LOG.md with a 666-line insertion,
        while PR #844's real file list, fetched from the API, is 6 files not including it). Consumers
        exposed: count_unapplied_tf_commits returns a silent 0 when the record SHA predates the window
        (scripts/convergence_health/record.py:101, acknowledged in its docstring but silent at call
        sites); plan_audit._verify_rec_in_git false-negatives any rec merged before the window;
        session/preflight metrics and any last-changed query hit the boundary lie. Only two consumers
        handle depth explicitly (_ensure_ancestry_history's best-effort unshallow,
        ci_rca_lifecycle.py:151; count_unapplied's return-0), and CI workflows pin their own depths --
        the dev container is the unmanaged surface. Remedy (assessed statically, not executed): a
        session-start bounded deepen in an S7 hook -- the hooks already fetch origin main each session,
        so `git fetch --deepen=500` (~3 months at the observed ~5.5 commits/day) or a full --unshallow
        (~2k commits for 894 PRs, tens of MB, seconds, once per container) is cheap, mirrors what
        ci_rca_lifecycle already does on demand, and would retire the entire trap-9 class rather than
        patching consumers one by one. Judged a gap and filed as GITOPS-03."
    - q: Q3b
      verdict: agents-primary-humans-secondary
      basis: []
      prose: "Agents author every commit, and every load-bearing log consumer is a machine. But the
        human claim is real on three surfaces: a human disposes of every PR (merged_by benjamin-blake on
        all sampled PRs, and the CODEOWNERS/tf-gated-apply gates institutionalize human review on
        protected paths); the repository is PUBLIC with an explicit marketing intent (Decision 101,
        AGENTS.md:9 'market the engineering, not the alpha') -- the git log IS shop-window content for
        an external human reader; and audits like this one are disposed of by a human reading PR-grain
        history. So agents-primary-humans-secondary, and this constrains Q6: dropping a human-legible
        convention (readable squash subjects, narrative commit bodies, (#NNN) suffixes) is only free
        where no human claim exists; on S1/S2 the human claim is live, and the observed composed squash
        bodies serve both consumers at once, which is why Q6 rates them a keep."
    - q: Q4
      verdict_coupling: mixed
      verdict_enforcement: insufficient
      basis: [GITOPS-01, GITOPS-02, GITOPS-04]
      prose: "Per-mechanism (DD-A matrix; break behaviour under rebase-merge / merge-commit):
        push_context_base -- HEAD~1 fallback under-selects silently under rebase (loud None only when
        HEAD~1 fails to resolve); EVENT_BEFORE path survives both given adequate depth; coupling
        essential AND documented (Decision 159 + the verify_ci_workflow pin makes it the best-behaved
        coupling in the set). rec-autoclose single-commit read -- breaks silently under both (missed
        trailer = no-op by design); coupling essential to squash, documented in the workflow header.
        feat({slug}) resolution (vp_replay, graduation) -- branch-side, strategy-tolerant; coupling to
        the SUBJECT GRAMMAR, not the topology; break is an advisory SKIP (loud-ish). plan_audit grep --
        strategy-tolerant, depth-fragile (silent false negative beyond window). count_unapplied -- silent
        0 on any error, acknowledged but swallowed (BLE001 handler ~:137). branch_lifecycle merge-base
        predicate -- WRONG TODAY under squash (a squash-merged branch is never an ancestor of main, so
        _is_checkpoint_branch_merged returns False and prune_merged_agent_branches never deletes);
        rebase-merge same; only merge-commit fixes it; dormant (executor frozen, `agent/*` branches
        absent in the CC-web model) -- the one genuinely accidental, unexamined coupling in the
        inventory (GITOPS-04). vacuous_pass HEAD^ -- pinned by ci-rca.yml fetch-depth and returns
        'undetermined' rather than guessing: good degradation. Baseline `git show origin/main:<path>`
        readers (_baseline.py, contract _shared.py ls-tree/diff) are CONTENT reads off the fetched tip
        -- immune to both strategy and depth; classifying each consumer by content-read vs history-read
        confirmed only history-readers carry exposure. Overall: mixed -- mostly essential-and-documented,
        one accidental (branch_lifecycle), two silent degraders. Enforcement of S2: insufficient. The
        prefix table (AGENTS.md:190-198) is parsed by load-bearing checks, yet no commit-message
        conformance check exists (re-derived: nothing in scripts/checks/ validates subjects); the live
        window contains fix(, docs(, and audit( subjects absent from the table plus one bare `audit:`
        (C4 -- still exactly one, #864); trailer well-formedness is enforced only by the parser's
        tolerance, and rec-2922 (open) shows it over-matches prose. Efficacy sample (8 plans with
        bundled_recommendations): 5 landed -- all their recs closed via the trailer path; 1 plan-only
        (correctly open); 2 closed without a matching feat({slug}) landing -- closure there proves
        manual portal closes exist, so closed-rec counts alone are not evidence the trailer works
        (counterfactual applied)."
    - q: Q5
      verdict: unreliable-bounded
      basis: [GITOPS-05]
      prose: "DD-C trace. signal-green: fires on pull_request only, gated on needs [pr-validate,
        terraform-validate] (ci.yml:303), claude/* heads only, 3-attempt retry, continue-on-error. Loss
        points: (a) all three comment attempts fail -> permanently silent for that run, no failure
        counter, no re-trigger (the run is one-shot per PR event) -- recovery is a human nudge, which
        AGENTS.md explicitly accepts as the residual; (b) other pull_request-triggered checks exist
        (codeql.yml, terraform-apply-sandbox speculative-plan) and are outside the needs list -- but the
        comment text claims only 'all required PR checks passed', which is accurate against the ruleset's
        required set, so C11 is adjudicated not-a-defect (deliberate ruleset minimality, Decision 83;
        rec-2022 tracks extending the gate). pr-conflict-signal: push-to-main + dispatch only. Loss
        points traced end to end: (a) a PR conflicted AT CREATION with no subsequent main push gets no
        wake at all -- no trigger fires (C13, filed); (b) gh pr list failure aborts the whole sweep;
        per-PR poll/comment failures mark _FAILURE_COUNT and exit 1, but the step's continue-on-error
        makes the RUN conclusion success regardless, so a lost wake is observable only in the step
        summary marker that nobody monitors (C12, filed as observability); (c) mergeability still
        UNKNOWN after 5 polls -> deliberate skip (never false-wake), recovered on the next push; (d) a
        comments-read failure posts the wake anyway (duplicate-cheap bias, correct). Empirical: 249
        runs, 15 most recent all conclusion=success; the latest run's log shows the live-conflicted PR
        #781 correctly recognized with its wake already posted (idempotent skip) -- the machinery
        demonstrably works when triggered. Bounded: main advanced ~50 times in 9 days, so any
        push-covered loss self-heals within hours; the unbounded case is only C13's zero-trigger gap
        plus a signal-green triple-failure, both terminating in the documented human-nudge fallback.
        Does Q1 change the design? No -- both signals key on PR state and head SHAs, not history shape;
        the keep-squash verdict leaves them untouched, and GitHub-native auto-merge (Decision 76
        deferred, Decision 83 unblocked) retires the green-wake need entirely while pr-conflict-signal
        must outlive it (a conflicted PR stalls auto-merge silently)."
    - q: Q6
      verdict: "Keep the trunk-linear-squash substrate and PR-as-record; enforce the commit grammar
        machines already parse; deepen the dev clone; adopt auto-merge; skip notes, SLSA, merge queues;
        formalize composed squash bodies and wake-comment IPC as validated contracts."
      basis: []
      prose: "Constrained by Q3b: the human-reader claim is live on S1/S2 (public repo, human disposes),
        so no entry below discards a convention merely for being human-legible; the two discards this
        audit could have made (narrative commit subjects, (#NNN) suffixes) are retained because they
        serve both consumers at once. The genuinely novel observation is that this repository has
        ALREADY invented agent-only structures no industry playbook names -- comment-as-wake-IPC with
        HTML idempotency markers, and merge-time-composed squash bodies that turn main into a sequence
        of PR-grain condensed records -- but has documented neither; the risk in both is convention
        without contract (GITOPS-01/-02). The checklist entries below are the sole input the maturity
        top tier reads."
      industry_adaptation:
        - practice: trunk-based development
          rating: already-in-place
          surfaces: [S1, S7]
          agent_first_form: "Short-lived harness session branches cut from fresh origin/main
            (fresh_branch_base.py side-effecting guard), merged to a single main; no long-lived branches."
          evidence: "AGENTS.md branching topology; .claude/hooks/fresh_branch_base.py; 23 remote heads vs
            894 PRs -- branches do not accumulate."
        - practice: linear history
          rating: already-in-place
          surfaces: [S1, S3]
          agent_first_form: "required_linear_history enforced by ruleset; every main commit is a CI-green
            PR unit, which is what makes HEAD~1 diff-scoping and single-commit trailer reads possible."
          evidence: "terraform/github/repo.tf:110; Decision 159."
        - practice: Conventional Commits
          rating: adapt-for-agents
          surfaces: [S2, S3]
          agent_first_form: "The repo already adapted the idea -- a workflow-tier grammar
            (feat/plan/roadmap/scope/audit keyed to the four-tier workflow, not the upstream CC set).
            The agent-first completion is registering the full live prefix set and enforcing conformance
            with a gate, since load-bearing checks parse it (GITOPS-02)."
          evidence: "AGENTS.md:190-198; window sweep: 23 feat(, 22 plan(, plus fix(/docs(/audit( outside
            the table; no conformance check exists."
        - practice: commit trailers as structured key-value metadata
          rating: adapt-for-agents
          surfaces: [S2, S3, S5]
          agent_first_form: "Resolves: is already a load-bearing machine trailer (rec-autoclose ->
            warehouse close + fixed_by_sha stamp). Adapt = one documented delivery path (explicit
            commit_message at merge) plus presence validation when bundled_recommendations is non-empty
            (GITOPS-01)."
          evidence: "scripts/rec_trailer.py; rec-autoclose.yml; 10 of 50 window commits carry trailers;
            observed merge-time composition."
        - practice: git notes as detachable machine-readable annotation
          rating: n/a
          surfaces: [S5]
          agent_first_form: "Not applicable here: the annotation-store role is filled by the DuckLake
            warehouse (SCD2 recs, decisions, telemetry) with a closed verb boundary. git notes would add
            a second, push-fragile, GitHub-invisible store -- exactly the two-store drift surface NS2
            forbids."
          evidence: "AGENTS.md warehouse-as-source-of-truth invariant; Decision 84."
        - practice: PR-as-record vs commit-as-record
          rating: adapt-for-agents
          surfaces: [S1, S5]
          agent_first_form: "Deliberate hybrid already practiced: the PR holds the full record (VP
            compliance tables, disclosures, gate history), the squash commit carries a hand-composed
            condensed projection plus trailer. Adapt = state this division in the git-ops contract so
            the projection step stops being folklore."
          evidence: "PR #887 body vs 84f9209 commit body (23-line condensed summary, neither PR body nor
            branch-commit concatenation)."
        - practice: bisectability
          rating: adopt-as-is
          surfaces: [S1, S3]
          agent_first_form: "PR-grain bisect over always-green commits. Nothing bisects today (repo-wide
            sweep: zero consumers), but the capability is preserved at the right granularity -- an
            intra-PR bisect would land on individually untested intermediate states. An agent bisects
            too; this is not human-only pressure."
          evidence: "grep sweep for bisect across scripts/.github/.claude: no consumer; C18 adjudication."
        - practice: revertability
          rating: already-in-place
          surfaces: [S1, S3]
          agent_first_form: "One squash commit per PR = single-commit revert unit; forward-fix policy
            (Decision 55/72/129) makes revert the exception deliberately."
          evidence: "PR #855 rollback section ('single-PR revert'); deliberate-constraints list."
        - practice: SLSA-style provenance and build attestation
          rating: n/a
          surfaces: []
          agent_first_form: "Bears on no in-scope surface: the repository distributes no build artifacts;
            Lambda deploys ride a governed CD channel (deploy-paths contract, out of scope) whose
            integrity anchor is the convergence record + saved-plan sha256 digests (DEP-07), an in-house
            attestation shaped to the actual deploy paths. Justification for the empty surfaces list:
            provenance here is a deploy-model property, and the deploy model is explicitly out of scope."
          evidence: "docs/contracts/deploy-paths.yaml (pointer only); terraform/CLAUDE.md DEP-07 digest
            mechanism."
        - practice: branch hygiene and post-merge branch deletion
          rating: adapt-for-agents
          surfaces: [S7]
          agent_first_form: "Merged PR heads are deleted (observed: no branch survives for recently
            merged #887/#888/#892-894), but stale non-PR debris persists (probe/dep05-*-deleteme,
            codex/*, claude/zz-conflict-probe among 23 heads). Adapt = a periodic stale-branch sweep;
            note branch_lifecycle.py's prune is the executor-era attempt and is broken under squash
            (GITOPS-04)."
          evidence: "git ls-remote --heads: 23 heads enumerated; merged-PR head absence."
        - practice: CI checkout-depth strategy (shallow vs full vs on-demand deepening)
          rating: adapt-for-agents
          surfaces: [S4, S7]
          agent_first_form: "CI side is deliberate and guarded per workflow (0/1/2 with pins and
            comments); the dev-container clone is the unmanaged residue -- adapt by adding a
            session-start bounded deepen so local history queries stop lying (GITOPS-03)."
          evidence: "fetch-depth inventory (ci.yml:29/96, ci-rca.yml:83, claude.yml:34,
            convergence-health.yml:72, main-canary.yml:22, rec-autoclose.yml:23);
            verify_ci_workflow.py pin."
        - practice: merge queues
          rating: n/a
          surfaces: [S1]
          agent_first_form: "Not applicable at this contention level: a sole-developer repo with
            serialized agent sessions, commit-time auto-rebase, and strict=false checks has no queue
            pressure; a merge queue would add latency and a new wake-signal surface for zero conflict
            reduction. Revisit only if concurrent implementing sessions become routine (see Q8)."
          evidence: "repo.tf:104-107 strict=false rationale; observed cadence ~5.5 merges/day, serial."
        - practice: auto-merge
          rating: adopt-as-is
          surfaces: [S1, S6]
          agent_first_form: "GitHub-native auto-merge takes the container out of the merge loop, retiring
            the CI-green comment wake (its lost-wake residual included); pr-conflict-signal must survive
            it (a conflicted PR stalls auto-merge and wakes no one). Already decided and unblocked, not
            built."
          evidence: "Decision 76 deferred follow-up; Decision 83 'technically unblocked'; AGENTS.md
            git-ops step 4 durable-successor note; rec-940 (closed), rec-2827 (open guard contract)."
        - practice: signed commits
          rating: already-in-place
          surfaces: [S1, S7]
          agent_first_form: "Harness-held SSH signing key, session-start allowedSigners config, GitHub
            reports Verified; ruleset deliberately omits required_signatures with documented rationale
            (server-side verification is not the blocker)."
          evidence: "AGENTS.md commit-signing subsection; repo.tf:112-117 comment;
            session_start_commit_signing.py."
        - practice: monorepo change-scoping conventions
          rating: already-in-place
          surfaces: [S1, S3]
          agent_first_form: "Path-filtered workflows (terraform/personal/**), CODEOWNERS path gates,
            per-domain check manifests, SLOC/structural-size budgets per file class -- scoping is
            contract-driven rather than directory-convention-driven."
          evidence: ".github/CODEOWNERS; terraform-apply-sandbox.yml path filter; Decision 169 manifest
            dispatch (#883)."
        - practice: merge-time-composed squash commit body (novel structure)
          rating: invent-novel-structure
          surfaces: [S1, S2, S5]
          agent_first_form: "The merging agent composes the squash commit_message at merge time: a
            condensed, locally-greppable projection of the PR record plus the machine trailer. This
            exists only because the reader is a machine that re-summarizes -- no human team hand-writes
            a third rendering of every change. Cost honestly stated: it is a convention nothing
            documents or validates (the docs actively misdescribe it as PR-body inheritance), and its
            trailer leg silently no-ops when the composing agent forgets (GITOPS-01). Formalize, do not
            drop."
          evidence: "Observed on 84f9209/aa20689; SKILL.md:547 inheritance claim empirically false;
            rec-2679/rec-2733 incident history."
        - practice: wake-comment session IPC with idempotency markers (novel structure)
          rating: invent-novel-structure
          surfaces: [S6]
          agent_first_form: "PR comments as a machine-to-machine wake channel: CI-green comments and
            conflict wakes carrying '<!-- conflict-wake:<headRefOid> -->' markers, replacing polling in a
            hibernating-session model. Already invented here; the agent-first completion is
            observability for lost wakes (GITOPS-05) and eventual retirement of the green half by
            auto-merge. Cost: comments are a public, rate-limited, best-effort transport -- acceptable
            because every loss path terminates in a human nudge."
          evidence: "ci.yml:293-322; pr_conflict_signal.sh marker discipline; 249-run history."
        - practice: structured commit-body id block (plan/rec/decision trailers) (novel structure)
          rating: invent-novel-structure
          surfaces: [S2, S5]
          agent_first_form: "Extend the composed squash body with a machine-parseable trailer block --
            Plan: {slug}, Resolves: rec-NNNN, Decisions: NNN -- so the plan linkage that today rides
            subject-grammar convention (feat({slug})) and the decision linkage that rides prose become
            greppable key-value pairs, validated at merge. Cost argued: trailers are unrecoverable after
            a history rewrite and duplicate warehouse fields -- acceptable only as a projection (warehouse
            stays authoritative), and only worth building after GITOPS-01/-02 land enforcement; filed as
            direction, not obligation."
          evidence: "Existing partial forms: feat({slug}) parsing in validate_vp_replay:10-17;
            Resolves: parser; (#NNN) suffix."
    - q: Q6b
      verdict: n/a-keep-squash
      basis: []
      prose: "Q1 is keep-squash, so no transition is specified. For the record, the trace showed any
        future change must be go-forward-only (a retroactive rewrite would invalidate fixed_by_sha
        stamps, convergence-record SHAs, and audit filename anchors held in the warehouse and audits/),
        and the landing set that must move together is: the ruleset (repo.tf), the live allow_* settings
        (currently unmanaged -- GITOPS-06 must land first for the change to even be declarable), the
        verify_ci_workflow fetch-depth guard, rec-autoclose's read window, AGENTS.md step 5, and the
        trailer placement contract."
    - q: Q7
      verdict: neither-suitable-replace-both
      basis: [GITOPS-07]
      prose: "What a session log carries that a commit log structurally cannot: work that produced no
        commit (the 2026-07-01 entry is an operational remediation -- convergence-record recovery, guard
        routing, a corrected ExternalId misstep -- with no code PR), abandoned approaches, RCA reasoning,
        and human decisions taken in chat. That gap is inherent to git only for no-commit sessions; for
        commit-producing sessions the observed composed squash bodies plus PR disclosures already carry
        most of what recent SESSION_LOG entries duplicated, so the commit-contract lever (Q6 N1/N3)
        shrinks but does not close the gap. The decisive evidence is behavioural: the log is already
        abandoned -- newest entry 2026-07-01, six weeks and 50 merges before HEAD; the writer path
        (postflight --close) is not invoked by any live command (the commands call --close-session,
        telemetry only; the session_close prompt was deleted at T-1.13) -- while its READERS still run
        (preflight recent_sessions feeds stale momentum to every planning session; prompt_compliance
        treats entries as compliance evidence). And ops_session_log rides the dead OpsWriter path
        pending T2.26. So neither surface is suitable as-is, and the repository has already decided the
        replacement shape: T-1.9 (complete, REPORT-ONLY) directs retiring BOTH -- markdown log archived
        post-reader-rewire, ops_session_log retired/migrated at T2.26 -- in favour of turn-events
        through the DuckLake writer with a query-verb reader. This audit's contribution is that the
        interim state is not neutral: stale reads are live (GITOPS-07, planned-unbuilt)."
    - q: Q8
      answers:
        - question: "Does the two-PR flow (plan( then feat() belong in git at all, or is it an artefact
            of PR-as-handoff?"
          answer: "It is an artefact of PR-as-handoff, but a load-bearing one worth keeping: the plan PR
            buys schema validation in CI (plan_documents, graduation-completeness plan-leg), a SHA-pinned
            handoff (the implement session reads the plan from main by path), and a review point at the
            cheapest moment. The cost is doubled merge traffic (22 plan( vs 23 feat( in the window --
            near 1:1) and doubled wake-signal load. Moving plans to the warehouse would forfeit CI
            gating unless rebuilt there; not recommended now."
          basis: []
        - question: "What happens to reconstructability if a merged PR's branch is deleted and GitHub's
            PR record becomes the only holder of the pre-merge commits?"
          answer: "Pre-merge commits remain reachable via refs/pull/<N>/head after head-branch deletion
            (verified: 894 refs, 6 fetched including deleted-branch PRs) -- but that is a GitHub
            platform behaviour, not a contractual guarantee, and it costs a network fetch per PR (NS6).
            Nothing in-repo depends on it today; the system's reconstructability floor is main + plans +
            warehouse, which survives total PR-ref loss. Acceptable risk; worth one sentence in the
            git-ops contract naming the dependency."
          basis: []
        - question: "Does the (#NNN) PR-number suffix constitute adequate provenance indirection given
            the round-trip cost?"
          answer: "Yes, at the margin it is exercised: the round-trip is paid only for deep forensics
            (reviews, CI runs, pre-merge sequence), because the composed squash body carries the
            condensed record locally and the parallel stores carry rationale. The suffix is also the
            only universally-present machine link in every subject (50/50 in the window) -- it is the
            de facto primary key joining git to the PR record, which argues for enforcing its presence
            (GITOPS-02) rather than replacing it."
          basis: []
        - question: "Is there a git-ops failure mode that only manifests when multiple agent sessions run
            concurrently against main?"
          answer: "Yes, two. (1) Stale-base merge: strict_required_status_checks_policy=false means
            session B can merge a PR whose checks ran against pre-A main; textually-disjoint but
            semantically-conflicting changes land green-on-green. Compensated deliberately: post-merge
            full-tier main-validate + canary + forward-fix (Decisions 73/159) -- accepted residual, not
            filed. (2) EOF-append collisions on registry/roster files (PR #855's rebase note documents
            one) and jsonl merge=union races -- handled by commit-time auto-rebase and the conflict
            wake. The unguarded corner is (1) combined with a lost green wake: B merges on a stale
            comment; bounded by the same post-merge net."
          basis: []
        - question: "Should the merge method be declared in infrastructure-as-code at all?"
          answer: "Yes. The policy is decision-recorded (89 clause 4, 76) and consumer-load-bearing, but
            the live setting is a clickable repo option inside lifecycle.ignore_changes;
            required_linear_history still permits BOTH squash and rebase, so a UI toggle enabling
            rebase-merge would silently expose the HEAD~1/trailer stack with zero Terraform diff.
            Declaring allow_squash_merge/allow_rebase_merge/allow_merge_commit (and
            squash_merge_commit_title/message) closes the drift surface at the cost of owning the
            import (GITOPS-06)."
          basis: [GITOPS-06]
        - question: "(own) Should the merge-time commit_message composition be a validated contract
            rather than folklore?"
          answer: "Yes -- it is the single point where the trailer, the condensed record, and the
            subject grammar all converge, and today no surface documents it while one (SKILL.md:547)
            misdescribes it. GITOPS-01's fix (document explicit commit_message; validate trailer
            presence for bundled-rec plans post-merge) is the minimum; Q6 N3 is the extension."
          basis: [GITOPS-01]
        - question: "(own) Is auto-merge adoption the real fix for the wake-signal residuals?"
          answer: "For the green half, yes: auto-merge removes the watching-session merge step, so a
            lost CI-green comment costs nothing (Decision 76's own durable-successor analysis, ratified
            in AGENTS.md step 4). It does NOT subsume the conflict wake -- a conflicted PR stalls
            auto-merge silently -- so GITOPS-05's creation-time gap and observability fix remain
            necessary regardless. Sequencing: adopt auto-merge (owned, unbuilt), keep
            pr-conflict-signal permanent."
          basis: [GITOPS-05]
        - question: "(own) Does any surface depend on GitHub Actions log retention for provenance?"
          answer: "Soft dependencies only: Decision 83 cites a run id as live-probe evidence, and
            ghas-probe run records back GHAS verification; Actions logs expire (default 90 days), so
            those citations decay into dated assertions -- which the decisions already treat them as
            (dated evidence, re-verification conditions). No mechanism reads old run logs. No finding;
            the pattern of copying dated evidence INTO decisions rather than linking it is the correct
            agent-first form and is already practiced."
          basis: []
  merge_strategy_decision:
    squash:
      verdict: recommended
      mechanism: "One reviewed, CI-green, hand-composed commit per PR on a linear main; PR record +
        refs/pull/*/head retain the full sequence server-side; parallel stores carry rationale."
      what_changes: "Nothing structural. Land GITOPS-06 (declare the method in Terraform), GITOPS-01
        (document/validate the trailer's real delivery path), GITOPS-02 (enforce the subject grammar
        consumers parse)."
      cost: "Intra-PR granularity absent locally (sampled 1-4 commits/PR, mostly CI fixups); (#NNN)
        round-trip for deep forensics; branch_lifecycle merged-predicate stays wrong (dormant)."
      rationale: "Every load-bearing consumer is built to this shape and the shape is what makes
        HEAD~1 diff-scoping, single-commit trailer reads, PR-grain revert, and always-green bisect
        possible; the losses are compensated (composed bodies, PR refs, S5 stores) and the shallow
        clone -- not squash -- is the binding constraint on log recovery (Q3a)."
      confidence: CONFIRMED
    rebase_merge:
      verdict: rejected
      mechanism: "Replay branch commits onto main individually; permitted by required_linear_history
        without a ruleset change."
      what_changes: "push_context_base HEAD~1 fallback under-selects multi-commit merges silently;
        fetch-depth 2 pins (ci.yml:96, main-canary:22, rec-autoclose:23) and the verify_ci_workflow
        guard all need rework to dynamic depth; rec-autoclose must scan EVENT_BEFORE..HEAD instead of
        -1; trailer placement must move into branch commits (the merge composes no new message --
        rec-2679/2733's loss mode becomes the only path); fix({slug}) fixup subjects land on main and
        meet the subject-grammar consumers; merge=union .gitattributes driver applies per-commit."
      cost: "Two new silent-failure classes (diff under-selection, trailer loss) traded for intra-PR
        granularity that no existing consumer reads and refs/pull already retains."
      rationale: "Strictly dominated: pays migration across the whole DD-A inventory to acquire the
        exact loss modes the current design's known defects already warn about."
      confidence: CONFIRMED
    merge_commit:
      verdict: rejected
      mechanism: "True merge commits; branch tips become ancestors of main."
      what_changes: "Forbidden today by required_linear_history (repo.tf:110) -- requires a
        CODEOWNERS-gated, admin-logged ruleset change plus declaring the allow_* settings (C8/C7).
        HEAD~1 semantics shift to first-parent (survivable); rec-autoclose reads the merge-commit
        message, which carries no trailer unless composed; log consumers meet a two-parent topology."
      cost: "Reviewed infra change, trailer-transport redesign, non-linear log for every consumer and
        the public human reader."
      rationale: "Its sole concrete benefit is fixing the dormant branch_lifecycle ancestor predicate
        (GITOPS-04), which is cheaper to fix in code (ask GitHub for the PR merge state, or compare
        squash-diff equivalence) than by changing the repository's history shape."
      confidence: CONFIRMED
    hybrid:
      verdict: rejected
      mechanism: "Merge method keyed on PR class (e.g. squash for feat/plan, rebase for multi-commit
        migrations)."
      what_changes: "main carries two history shapes permanently; every consumer keyed on HEAD~1,
        --grep, single-commit reads, or merge-base meets both and must branch on shape detection."
      cost: "The full rebase-merge consumer migration PLUS a per-PR classification mechanism nothing
        currently needs, PLUS permanent two-shape complexity at every future consumer."
      rationale: "No PR class in the observed window (50/50 one-commit-per-PR, 1-4 pre-merge commits)
        would benefit; complexity without a customer."
      confidence: CONFIRMED
