  question_answers:
    - q: Q1
      verdict: mixed
      basis: [PWS-01, PWS-02, PWS-03, PWS-04, PWS-05]
      prose: >-
        D1 and D5 re-derive cleanly (CONFIRMED); D2, D3 and D4 are each PARTIAL. D1's figures
        are within 12 percent relative of re-derivation, per-figure 0.5 to 11.25 (112
        matches; 40.2/27.7/23.2/8.9 percent; exactly 9 REVISE-ended). D2's mechanizable mass is real (11 of the pinned
        23 obligations carry mechanical cores, 5 already mechanized elsewhere at least in part)
        but "majority" fails by one under the pinned denominator (11/23 = 47.8 percent) and
        judgement is the actual majority (12/23), while the Finding-Origin Attribution field
        tags only registration-closure findings, not the whole split. D3 holds for the
        interactive Step 9 path but fails for the executor path, where critique_plan()'s
        full_output persists in critique_history through save_plan to ops_execution_plans.
        D4's re-dispatch mechanism is verbatim in the skill; its tail-inflation consequence is
        unproven -- the per-round record needed to prove it is exactly what D3 says is
        discarded, and the one sampled plan carrying round-content summaries shows new findings
        appearing in rounds 2-3 without establishing inflation. D5 holds on every surface
        asserted.
    - q: Q2
      verdict: adjudicated
      basis: [PWS-06]
      prose: >-
        All sixteen adjudicated: 5 ADOPT-MODIFIED (P2, P3, P4, P5, P11), 5 ROADMAP (P8, P9,
        P12, P13, P14), 5 REJECT (P6, P7, P10, Alt-1, Alt-2), 1 DUPLICATE (P1). Of P2's eight
        seed rules, six are adopted (P2a-P2c as stated or narrowed, P2f-P2h modified) and two
        are DUPLICATE (P2d is enforced by the PlanDocument v2+ phase enum; P2e by
        validate_tier_floor plus open rec-3285, which already owns the check's schema-version
        dormancy). The originating analysis's Group A / Group B placement survived
        re-derivation for 9 of the 14 placed proposals: P1 moved out of "immediately
        implementable" into owned-roadmap territory, P11 moved from future-ambition to
        implementable-now once de-scoped from a scheduled agent, and P6, P7 and P10 fall in
        neither group because they are rejected.
    - q: Q3
      verdict: sequenced
      basis: []
      prose: >-
        Nineteen items sequenced (5 adopted proposals, 6 adopted P2 sub-rules, 2 findings with
        a proposed_change, 1 originated item, 5 ROADMAP items). The spine: the typed
        gate-record fix (PWS-01) first because every telemetry-consuming item downstream (P14's
        ratchet, P9's lane eviction, Q6 seeds 3/4/8) is unmeasurable on the current free-text
        substrate; the provenance pair (P4 Decision, then P5 contract field) next because it is
        cheap, independent, and creates the recording vocabulary later items cite; then the P2
        lint engine and its six adopted rules, then P3's surface wiring, then N1's skill-prose
        shrink which is only safe once the mechanization it points at exists. ROADMAP items
        close the sequence in dependency order (P8 before P12, which consumes its schema work;
        P9 before P13, which escalates from P9's lanes; P14 last, blocked behind the Decision
        87 clause 4 persistence substrate T4.5/T2.36 own). Every vehicle is named per item;
        Decision 67 and Decision 86 constraints are honored (no STRATEGIC decomposition, no new
        prose doc -- N1 and P2 relocate prose INTO a contract).
    - q: Q4
      verdict: ranked
      basis: []
      prose: >-
        Executor-prerequisite list (NS-F, load-bearing for a weak-model executor), ranked:
        PWS-01, P2, P2a, P2b, P2c, P3, P4. These remove judgement a weak model cannot be
        trusted to hold: idiom discipline (gh, bare python, local terraform), gate-record
        discipline (the 29 unfilled placeholders happened under frontier models), and the
        do-not-confabulate-provenance rule. Interactive quality-of-life list: P2h, P2g, P2f,
        P5, N1, P11, PWS-07 -- these feed the frontier critic better inputs or trim its load
        but remove no guarantee-bearing judgement. ROADMAP-verdict items (P8, P9, P12, P13,
        P14) are sequenced but deliberately unranked per the shared "adopted" definition, even
        though P12 and P8 would top the executor list once Decision 67 reverses.
    - q: Q5
      verdict: originated
      basis: []
      prose: >-
        One originated item, in the removal direction the sixteen proposals ignore: N1 --
        shrink the plan-critique skill's Phase 2 prose to judgement-only rows by relocating
        every rule the P2 engine mechanizes into a machine-readable rule table in a contract,
        with the skill keeping one pointer line per relocated row. All sixteen proposals ADD
        machinery; T2.56 c1 (in_progress) commits to measurably shrinking the skills layer,
        and plan-critique sits at 7 bytes of prose-budget headroom, so the only free direction
        on that surface is down. N1 is distinct from every proposal (P2/P3 add checks; none
        removes skill prose) and from every finding's proposed_change.
    - q: Q6
      answers:
        - question: "Does the ratchet-down-only, zero-headroom prose-budget registry change which proposals are cheap and which are expensive, and any verdict?"
          answer: >-
            Yes, materially. plan-critique SKILL.md has 7 bytes of headroom, decision-scout 0,
            planning 70; every prose-adding edit to a gate skill needs a Decision-cited raise
            marker, and splitting is forbidden. This priced P6, P7 and P13 (all add gate
            prose) into REJECT/ROADMAP, priced P8's skill-template additions into ROADMAP, and
            made contract-homed vehicles (P2 rule table, P5 envelope field, N1 relocation) the
            cheap lane. It flipped no verdict that was otherwise ADOPT, but it is a named
            factor in three rationales.
          basis: []
        - question: "Is T2.56 c1's shrink commitment contradicted by proposals that add skill prose, and which proposals lose?"
          answer: >-
            It is a direct tension, and the losers are P6, P7, P9's interactive form, and P13
            -- each adds prose to capped gate skills against an in_progress commitment to
            shrink that layer. P2/P3/N1 are the winners: they move rules out of prose into
            checks and a contract, which is the c1 mechanism itself. P8 adds schema surface,
            not skill prose, so it is deferred on other grounds.
          basis: []
        - question: "Is round count a sound measurement substrate for P6, P9, P14?"
          answer: >-
            No, not today. The gate line is free text with roughly 20 observed grammars; the
            D1 regex captures 112 of 230 plans carrying any plan-critique= token (48.7
            percent) and 112 of 358 plans overall; 29 plans carry the literal unfilled
            template placeholder; one sampled plan records REVISE-after-4 cleared by human
            authorisation only in prose. Any proposal that meters rounds (P6's re-round
            discipline, P9's lane eviction, P14's recurrence threshold) is unmeasurable until
            PWS-01's typed record lands. This is why PWS-01 sequences first.
          basis: [PWS-01]
        - question: "Does the D1 tail indicate a critique-quality problem or a plan-complexity problem, and does any proposal distinguish them?"
          answer: >-
            Indistinguishable on the current record: per-round finding content is discarded
            (PWS-03) and revisions are squash-merged, so a 4-round plan cannot show whether
            rounds carried new unrelated findings (quality) or genuinely hard scope
            (complexity). Weak directional evidence for complexity: the ten 4/5-round plans
            cluster in ci-rca and infra territory. No proposal distinguishes the two; P1's
            persisted findings would create the substrate that could, which is recorded in
            PWS-03's crossref rather than as a new proposal.
          basis: [PWS-03, PWS-04]
        - question: "Should this audit have rated the workflow against named external/industry practice?"
          answer: >-
            The omission is real but not crippling. Every question here was decidable from
            repo-internal evidence, and the North Star principles encode the relevant
            engineering norms (mechanical floor, evidence over assertion) in checkable form.
            Where external knowledge would have mattered -- calibrating P9's lane decomposition
            and P11's horizon-scan value against practice elsewhere -- the affected verdicts
            are ROADMAP/HYPOTHESIS-confidence respectively, which is the honest encoding of
            that gap rather than a silent weakness.
          basis: []
        - question: "Is plan-critique the right place for judgement at all, given what /implement re-derives downstream?"
          answer: >-
            Yes for frame and adequacy judgement, no for the mechanical mass. /implement
            re-verifies execution (VP runs, code review) but nothing downstream re-litigates
            the frame -- a wrong primitive choice survives implementation review, so Phase 2b
            belongs exactly where it is, before implementation spend. The mechanical rows are
            the misplacement: they burn fresh-context judgement on program-decidable facts
            (PWS-02), which P2/P3/N1 relocate. The gate's real residual risk is that its own
            effectiveness is unmeasured (seed 8).
          basis: [PWS-02]
        - question: "What does a /plan run cost today, and what would each adopted item add?"
          answer: >-
            Today, an IMPLEMENTATION /plan run loads roughly: the planning agent's ambient set
            (about 26KB AGENTS.md) plus plan.md (12.6KB), the planning skill (55.7KB),
            PROJECT_CONTEXT.md (14KB), the preflight report, and all scope files; one
            decision-scout dispatch reading the 112.6KB decisions-index (about 28k tokens,
            Decision 179 residual 5(i)) plus shortlisted sections; and a mean 2.03
            plan-critique dispatches (D1 re-derivation), each re-reading PROJECT_CONTEXT, the
            plan, targeted roadmap/decision extractions, and every scope file. Adopted items
            add almost nothing per run by design: P2 runs in CI, P3 rides the two
            plan_obligations invocations that already exist, P4/P5 are authoring-time only,
            P11 is portfolio-periodic, N1 subtracts skill bytes, PWS-01 adds one validation
            leg to an existing check. The per-run multipliers were all declined: P7 (+1
            dispatch), P9 (3-4x critique dispatches), P10 (+1 lane), P13 (+1 consult) --
            each reduces judgement load only by multiplying per-run cost, and none carries
            outcome evidence justifying that trade today.
          basis: []
        - question: "What post-gate outcome signal exists -- can anyone tell whether gate-passed plans failed or stalled in /implement?"
          answer: >-
            Almost none, and it should be said plainly: the Step 9 gate's effectiveness is
            unmeasured. Partial mechanical fragments exist -- implementation_declared flips
            True at implement time (content-keyed), a feat({slug}) squash commit evidences
            completion, and ci-rca files recs on post-merge main failures -- but nothing links
            a plan's gate verdict/rounds to its implementation outcome, VP failures live only
            in session transcripts, and preflight's friction_patterns key is a hardcoded empty
            list (PWS-08). A gate-to-outcome join would require PWS-01's typed record plus an
            outcome field at implement close (or the T2.36 telemetry model). Until it exists,
            P1/P9/P14 optimize an input metric (rounds) with no outcome measure, and seed 4
            cannot be answered.
          basis: [PWS-01, PWS-08]

  diagnosis_verdicts:
    - claim: D1
      verdict: CONFIRMED
      mechanism_holds: n-a
      consequence_holds: n-a
      evidence: >-
        rg -o --no-filename "plan-critique=\w+ after \d+ round" docs/plans/ yields 112 matches
        in 112 files (claim: ~110). Distribution: 45 one-round (40.2 pct; claim ~40), 31
        two-round (27.7 pct; claim ~28), 26 three-round (23.2 pct; claim ~23), 10 four/five
        (8.9 pct; claim ~8), exactly 9 REVISE-ended. Every figure within 20 pct relative.
      rederived_values: >-
        112 matches / 358 total plans (31.3 pct of corpus) / 230 plans carrying any
        plan-critique= token (48.7 pct coverage of verdict-recording plans). 29 of the 230
        carry the literal unfilled template placeholder.
      confidence: CONFIRMED
    - claim: D2
      verdict: PARTIAL
      mechanism_holds: true
      consequence_holds: false
      evidence: >-
        Mechanism (a substantial mechanical/semi-mechanical mass exists) holds: of the pinned
        23-obligation denominator, 2 are mechanical (12d, 12m) and 9 semi-mechanical (9, 12b,
        12c, 12c-1, 12k, 12l, 12n, 12o, 12p), with the mechanical cores of 12c/12c-1/12l/12m/
        12o already at least partially mechanized (plan_document.py:102-131,292-350;
        validate_tier_floor; validate_platform_roadmap; validate_graduation_completeness).
        Magnitude fails: 11/23 = 47.8 pct is not "majority" under the pinned denominator, and
        genuine judgement is 12/23 = 52 pct -- not "a small fraction". The Finding-Origin
        Attribution field (plan-critique SKILL.md:157) tags only registration-closure
        findings, per its own trailing clause -- it does not "already tag the split".
      rederived_values: "mechanical 2 / semi-mechanical 9 / judgement 12 of 23; boundary calls (9, 12c-1) argued in DD-A note on PWS-02"
      confidence: CONFIRMED
    - claim: D3
      verdict: PARTIAL
      mechanism_holds: n-a
      consequence_holds: n-a
      evidence: >-
        Holds for the interactive Step 9 path: subagent output is read and discarded; only the
        free-text gates context line survives (unreliably -- see PWS-01), and ops_execution_plans
        receives nothing for interactive plans (the git->warehouse ETL is T4.5,
        deferred_post_mvp). Fails for the executor path: critique_plan() returns full_output
        inside the critique dict (scripts/executor/plan_generation.py:470-476), carried on
        ExecutionPlan.critique_history (scripts/executor/plan.py:166) and written through
        save_plan to ops_execution_plans (_JSON_BLOB_FIELDS, scripts/ops_portal/
        execution_plans.py:36; column registered at config/lambda/ducklake/
        field_semantics.yaml:469). "No artifact or table stores findings" is false on that
        surface, frozen or not.
      rederived_values: "interactive: nothing persists beyond the gates line; executor: verdict + suggestions + full_output persist per iteration"
      confidence: CONFIRMED
    - claim: D4
      verdict: PARTIAL
      mechanism_holds: true
      consequence_holds: false
      evidence: >-
        Mechanism verbatim at planning SKILL.md:593 ("Each Agent call is a fresh window, so the
        re-launch genuinely re-evaluates"): every REVISE round is a full fresh re-evaluation
        with no admission discipline, so new unrelated findings CAN appear per round. The
        consequence (this inflates the D1 tail) is a causal claim the record cannot support:
        revisions squash-merge and transcripts are discarded (D3), so per-round finding
        content is unrecoverable corpus-wide. The one sampled plan recording round content
        (PLAN-vp-replay-hermetic-traps: r1 three findings, r2 a new coverage-home addition,
        r3 "minor accuracy fixes") shows new-per-round findings occurring once, which proves
        occurrence, not inflation; 4/5-round plans clustering in ci-rca/infra territory is
        equally consistent with plan complexity.
      rederived_values: "10 plans at 4-5 rounds (8.9 pct); one observed instance of new findings in later rounds; zero corpus evidence discriminating quality-tail from complexity-tail"
      confidence: CONFIRMED
    - claim: D5
      verdict: CONFIRMED
      mechanism_holds: n-a
      consequence_holds: n-a
      evidence: >-
        All asserted surfaces hold. plan-critique 12e-12i search only platform-native/
        codebase-native primitives, DECISIONS.md-ratified capabilities, terraform/-shipped
        capability, and tools "added to the codebase" (SKILL.md:99-107); decision-scout
        triages the repo's own decisions index; cost_reconciliation's five reevaluation
        triggers fire on measured bills, not an option-space search; validate_fallback_
        reevaluation re-checks one pre-named fallback on CD.27-gated items only. decision-
        entry.yaml:87 required_markers are exactly Status/Date/Decision; no alternatives
        marker exists in required or optional_markers_fixed_spelling (:94), and the
        significance envelope's contract-first justification covers only the ROUTING-vehicle
        alternative, not the decision's subject. rg for never_evaluated / confabulat /
        "absence of a decision" over DECISIONS.md, docs/contracts/*.yaml and .claude/skills/
        returns no hits. Nuance recorded, not a refutation: some entries (e.g. Decision 87's
        retired two-table split) narrate rejected alternatives in prose, but no TYPED
        distinction exists, which is what the claim asserts.
      rederived_values: "required_markers = [Status, Date, Decision]; optional = [Problem, Intent, Rationale, Reversal conditions, Related, Warehouse ID]; zero provenance-vocabulary hits"
      confidence: CONFIRMED

  proposal_adjudication:
    P1:
      verdict: DUPLICATE
      originated_here: false
      group_placement_rederived: B
      placement_survived: false
      modification: ""
      vehicle: none
      sequence_position: null
      depends_on: []
      executor_prerequisite: false
      executor_rank: null
      qol_rank: null
      carrying_cost: ""
      rationale: >-
        The design space P1 proposes is already ruled and owned. Decision 87 clause 4 as
        amended 2026-08-19 pins the homes: the critique imperative lives in critique_history
        on the ONE plans table (ops_execution_plans), the deliberation lives in telemetry,
        "they are not duplicated" -- so P1's candidate shape (a new one-row-per-finding
        append_only table via the portal) would contradict a ratified consolidation, and its
        alternative (a committed artifact per round) fights the shipped context-block
        discipline that routes round write-ups to commit bodies. T4.5 owns extending the
        table, T2.36/T3.20 own the telemetry home, T4.16 owns the critique-authorship
        boundary, and open rec-3080 already asks for the verdict/finding-mix recording
        design. Property match: clause 4 + T4.5 exercise exactly the durable-persistence
        property P1 wants and fail today only because they are unbuilt -- which is the
        planned-unbuilt condition (filed as PWS-03), not an unowned gap. The prerequisite
        edge P14 cites is therefore an edge to T4.5/T2.36, not to a new build.
      owning_items: ["Decision 87 clause 4 (as amended 2026-08-19)", "T4.5", "T4.6", "T4.16", "T2.36", "T3.20", "rec-3080"]
      confidence: CONFIRMED
      dedup_search_terms: ["critique finding", "critique_history", "plan-critique", "ops_execution_plans", "persist", "rec-3080"]
      dedup_hit_count: 7
      sub_verdicts: {}
    P2:
      verdict: ADOPT-MODIFIED
      originated_here: false
      group_placement_rederived: A
      placement_survived: true
      modification: >-
        Adopt the lint ENGINE and six of eight seed rules, but not as a new top-level
        plan_lint check domain: rules land in the existing roadmap/ (or verification/)
        domain, colocated with the incumbent plan checks (the validate_tier_floor
        "colocated ... for domain cohesion" precedent), with the rule core as an importable
        library so P3's surfaces can call it. plan-obligations.yaml's own provisional_v0
        rationale records that a new-domain module needs registry.py aggregation edits the
        current obligation map does not model -- a new domain buys nothing but that cost.
      vehicle: implementation_plan
      sequence_position: 4
      depends_on: []
      executor_prerequisite: true
      executor_rank: 2
      qol_rank: null
      carrying_cost: >-
        One new check module in an existing domain = the registry.py docstring's registration
        set minus the graduated-step shard: module, @register, domain _manifest.py Entry,
        config/ci_rca_taxonomy.yaml row, mirror test, Decision 170 examined()/skipped()
        declarations (6 surfaces, effort M). No warehouse rows, no schema bump, no skill
        prose (rule semantics live in the check + a contract rule table, serving T2.56 c1).
      rationale: >-
        DD-A found the mechanizable-but-unmechanized set is real (PWS-02) and the pitfalls are
        evidenced (rec-3301 documents plans repeatedly authoring gh steps against a
        gh-less container). Scanning VP command strings has shipped precedent
        (validate_handoff_full_tier:56 splits step.command on shell separators;
        validate_vp_replay executes them), so the mechanism is proven; the novelty is rule
        content only, exactly as the GROUNDING MAP frames it. Open rec-389 (plan quality
        structural constraints: step-count limits per effort band, target-file coverage,
        proposed as critique hard-fail or post-parse validation) occupies the same mechanism
        class with different rules -- it is the P2 plan's natural bundled_recommendations
        target, not an owner. Sub-rule order within the shared module carries no dependency
        edges; it follows recurrence evidence (P2a first: rec-3301 documents live gh
        recurrence; P2b second: universal-idiom rule; P2c third: rare trigger).
      owning_items: []
      confidence: CONFIRMED
      dedup_search_terms: ["lint", "VP command", "gh", "venv-python", "plan_lint", "plan quality", "structural constraints"]
      dedup_hit_count: 3
      sub_verdicts:
        P2a:
          verdict: ADOPT-NOW
          rationale: "gh is absent from both containers by design (bin/setup-cloud-env.sh; rec-3301 evidences recurrence in authored plans); a token-boundary match on segment-leading gh is deterministic and false-positive-safe. Complements rec-3301's prose fix; does not duplicate it (a lint fails a plan; prose informs)."
          vehicle: implementation_plan
