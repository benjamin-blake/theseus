  findings:
    - id: PWS-01
      surface: shared
      surfaces: [S1, S7]
      question: Q1
      dimension: VD3
      title: "The gate-record substrate is free text that nothing validates: 29 plans carry the literal unfilled placeholder, roughly 20 grammars coexist, and the D1 regex reaches 112 of 230 recording plans"
      evidence: ".claude/skills/planning/SKILL.md:525 (REQUIRED ITEM WF-08) vs corpus census: 29 files match the fixed string 'plan-critique=<verdict> after <N> round(s)' (including current schema-v4 plans); 230 files carry a plan-critique= token in ~20 spellings (pending/deferred/overseer-reviewed/escalated/bare-PROCEED variants); PlanDocument treats context as free strings; no registered check inspects the line"
      evidence_kind: observed
      current_behavior: >-
        The WF-08 remedy made the gates line a REQUIRED template item, but it is authored at
        Step 8 -- before the Step 9 gate has run -- so its critique half can only be
        back-filled, and on 29 plans (including recent v4 ones) never was; decision-scout
        placeholders number only 2, confirming the sequencing cause (the scout verdict exists
        at write time, the critique verdict does not). rec-3041 independently records the
        write-once staleness losing gate_run_ids. Nothing mechanical distinguishes a filled,
        stale, or placeholder record, so gate compliance is unverifiable post-hoc and every
        rounds-metering consumer (Q6 seeds 3/4/8; P6/P9/P14) reads a corrupted substrate.
      ideal_behavior: >-
        A gate record that is typed or grammar-pinned, finalized at the Step 11 approved-plan
        commit, and validated on new plans -- so one grammar exists, a placeholder fails
        fast, and round telemetry becomes a real measurement substrate.
      gap: "A required, load-bearing record enforced by template comment only; program-decidable conformance left to session discipline that observably fails on 12.6 percent of verdict-recording plans (29/230)."
      compensating_controls_considered: >-
        The gates themselves still block by instruction (the record failing does not mean the
        gate was skipped -- sampled anomalies trace to record staleness, e.g. the
        REVISE-after-4 line cleared by recorded human authorisation); this bounds severity to
        high rather than critical, but the control does not exercise the RECORD-integrity
        property at all, so it cannot lower it further (prior-audit precedent: WF-08 graded
        the detection half high).
      change_type: enforce
      proposed_change: >-
        Pin one grammar and validate it: extend validate_plan_documents (no new registration
        set) with a gate-record leg for net-new plans -- context must carry exactly one
        gates: line matching a pinned grammar (verdict enum, integer rounds, optional
        human-authorisation clause, optional gate_run_id list -- the field rec-3041 exists
        to preserve, format coordinated with rec-2798/rec-2804), with placeholder tokens
        rejected; the duplicated template string rec-2480 names collapses in the same
        change, and the planning skill's Step 11 approved-plan commit becomes the named
        finalization point for the line. Design the typed successor field (gate_records) in
        the same plan so the grammar is a bridge, not a second standard.
      acceptance: "A fixture net-new plan with an unfilled placeholder or a non-conforming gates line fails validate --pre; a conforming plan passes; grammar count over post-change new plans is exactly 1."
      severity: high
      severity_rationale: >-
        High per the 'materially reduces the guarantee with insufficient compensating
        controls' clause: 157 of 358 plans (44 percent -- 128 with no gate line at all plus
        29 placeholders) carry no parseable gate verdict, so the blocking gates' compliance
        story is unverifiable across that band and non-discriminating on the 29, and every
        scaling decision this audit was asked to adjudicate meters on the corrupted
        substrate. Not critical: no evidence any gate reported PROCEED on a plan its rules
        should have blocked.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: ["rec-3041", "rec-2480", "rec-2798", "rec-2804"]
        dedup_search_terms: ["gates line", "placeholder", "gate_run_id", "context line", "gate-history", "gate template"]
        dedup_hit_count: 4
        note: "rec-3041 owns the write-once-staleness mechanism (gate_run_ids lost) but proposes no grammar pin or mechanical validation; rec-2480 owns the duplicated template string, rec-2798/rec-2804 the gate_run_id format -- the pinned grammar must carry that field or it collides with its own co-owners. This finding adds corpus magnitude (29/230/112 counts) and the enforcement leg. D1 is verdicted CONFIRMED on its figures; this row carries the defect the confirmed telemetry exposes, classified against its partial owners."
      effort: M
      depends_on: []
      vehicle: implementation_plan
      sequence_position: 1
      executor_prerequisite: true
      executor_rank: 1
      qol_rank: null
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "coordinate with rec-3041 rather than duplicating it; unblocks Q6 seeds 3/4/8 and every telemetry-consuming proposal"}
