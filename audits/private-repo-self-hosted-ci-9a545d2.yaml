      - {id: "AI-04", input: "PySR duty cycle on the shared box", assumed_value: "0-100% (unknown)",
         why: "explicitly unstated by the requester", sensitivity: "HIGH; flips Q2 between material-speedup and regression"}
      - {id: "AI-05", input: "monthly Actions job-minutes at current velocity", assumed_value: "14,000-21,000 (point 17,500)",
         why: "extrapolated from 3 sampled run lists + per-job rounding rules; the billing ledger is not directly readable", sensitivity: "medium; +/-30% moves the private-hosted bill GBP +/-20/mo but not its order of magnitude"}
      - {id: "AI-06", input: "runner maintenance burden", assumed_value: "2-6 h/mo steady-state plus incident tail",
         why: "unstated; industry-typical for a single hardened ephemeral runner host", sensitivity: "medium; at any personal-time valuation it rivals the entire hosted bill"}
      - {id: "AI-07", input: "capital-cost share attributable to CI", assumed_value: "0-50% of GBP 1,390 over 36 months (GBP 0-19/mo)",
         why: "machine was purchased for PySR; CI is a co-tenant", sensitivity: "low; even 50% does not change the self-hosted-vs-hosted ordering"}
      - {id: "AI-08", input: "hosted-runner core count baseline", assumed_value: "public-repo standard runners 4-core/16GB; private-repo standard 2-core/7GB",
         why: "GitHub upgraded public-repo standard runners; could not be doc-fetched within the external cap", sensitivity: "medium; if true, private-hosted full tier runs SLOWER than today and bills MORE minutes than AI-05 projects (marked HYPOTHESIS where used)"}
    adversarial_rounds: 3
    adversarial_status: round-capped
    adversarial_refuted_count: 0
    unconverged_items:
      - {id: "Q11", disagreement: "Each round found a new defect in Q11's lockout analysis (round 1: phantom full-tier wedge; round 2: USD-0 spending-limit stall; round 3: flip-apply error on the pinned security_and_analysis block + admin-bypass survives 'every merge blocks'). All three corrections are applied in the final text, but the corrected Q11 was never itself re-reviewed by a fresh round -- its verdict (sequenced-plan-with-rollback) was not disputed in any round; the lockout-completeness claim is the unconverged part and should be read as HYPOTHESIS: further stalls of the same class may exist."}
    premises_tested:
      - {id: PR-1, holds: true,
         evidence: "GitHub :: Update to GitHub Actions pricing (changelog) :: https://github.blog/changelog/2025-12-16-coming-soon-simpler-pricing-and-a-better-experience-for-github-actions/ :: retrieved 2026-08-13 -- USD 0.002/min platform charge for self-hosted runners in private repos announced 2025-12-16 effective 2026-03-01, then postponed ('to take time to re-evaluate our approach'), not cancelled; hosted price cuts (up to 39%) proceeded 2026-01-01",
         effect_on_answers: "Q10 answered in its premise-holding form; self-hosted-on-private carries a live repricing risk of ~GBP 23/mo at current volume if reinstated as announced"}
      - {id: PR-2, holds: false,
         evidence: "GitHub Docs :: Adding self-hosted runners / managing access :: https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/add-runners :: retrieved 2026-08-13 -- 'We recommend that you only use self-hosted runners with private repositories' (fork-PR code-execution risk); a recommendation, not an enforced restriction",
         effect_on_answers: "the two decisions decouple: private does NOT require self-hosting; self-hosting on a PUBLIC repo is strongly discouraged (one-directional advisory coupling). summary.verdicts_coupled=false; visibility and runner verdicts are answered independently"}
    contract_notes: "EXTERNAL EVIDENCE fetch cap overrun: 9 WebFetch calls were made against the cap of 8 (the Actions usage-limits page had moved and its fetch returned no data; the queue-cancellation limit was then sourced from docs.github.com search snippets rather than a further fetch). All other caps respected: 3 run-list calls, 4 of 5 usage calls, 1 of 2 settings calls (repo metadata for fork/star counts), no log downloads."
    stale_anchors: []
  question_answers:
    - q: Q1
      per_intent:
        - {intent: I-A, verdict: recommend-public, preconditions: [],
           rationale: "Solo instrument: no adversary monetises against you, the valuable asset (DuckLake operational data) is in AWS and never in the repo (Decision 101 boundary), so a flip protects nothing load-bearing while costing governance (PRIV-01/02) and security controls (PRIV-03)."}
        - {intent: I-B, verdict: recommend-conditional,
           preconditions: ["either split-repo per CD.32 (sensitive future work in a new private repo; this repo stays public) or full flip only after: Pro plan active pre-flip, tf-gated-apply replacement gate landed and tested (PRIV-01), ghas-probe/validate.py re-scoped (PRIV-03), and the dec-111/dec-112 reversal ratified (PRIV-07)", "license posture for future commits decided (Q9)"],
           rationale: "Commercial product: future commits progressively encode operational learning (thread b), so the protected delta grows; enclosure has real value but the CD.32 split captures most of it at a fraction of the governance cost."}
        - {intent: I-C, verdict: recommend-public, preconditions: [],
           rationale: "Portfolio: the public engineering surface IS the asset (EVALUATION-PROMPTS.yaml, curated portal per dec-111, README); a flip destroys the asset to protect a lesser one."}
        - {intent: I-D, verdict: recommend-public, preconditions: [],
           rationale: "Open-core: the intended topology already exists -- platform public, data plane private in AWS; CD.32 records the discipline that the repo axis and the data axis are orthogonal. Flipping the platform repo contradicts the model."}
      headline: {verdict: recommend-public, assumed_intent: I-C,
                 intent_inference_evidence: "inference, not fact: docs/PROJECT_CONTEXT.md:20 ratifies a 'public, agent-first automation platform' end-state; dec-111 ratified the curated-portal commitment; EVALUATION-PROMPTS.yaml was authored specifically for external evaluators; AGENTS.md's boundary is 'market the engineering, not the alpha'. CIRCULARITY DISCLOSURE (adversarial round 1, bias check a): this inference rests partly on the very artifacts the proposal would reverse -- it is a prior drawn from the record, not evidence against changing the record. The requester's brief signals drift toward I-B; a pinned I-B intent overrides this inference and moves the headline to I-B's conditional path (see intent_dependencies)",
                 preconditions: []}
      adversary_model:
        adversaries: ["competing quant developers/firms scraping public code for strategy signal", "platform-engineering copycats monetising the harness as a product", "bulk scrapers/LLM training corpora", "targeted attackers doing reconnaissance for AWS entry (security, not IP)"]
        assets: ["DuckLake operational data (the requester-located crown jewel; lives in AWS, never in the repo)", "platform engineering patterns (code, contracts, skills, prompts) -- public by design", "trading alpha (never committed, Decision 101)", "the growing operational-learning residue encoded in prompts/contracts/config (thread b)"]
        channels: ["direct repository read while public", "third-party mirroring/archives (Software Heritage, GH Archive, clones)", "continuous transmission of repo contents to external model providers (F40: deepseek_executor_inference, anthropic_escape_hatch_spillover)", "attack-surface reconnaissance from published workflow/infra detail"]
        channels_closed_by_flip: ["direct repository read (future commits)", "new third-party mirroring (future commits)", "reconnaissance on future commits"]
        channels_not_closed: ["already-published history in mirrors/archives/crawls (bounded: 0 forks, 1 star, ~2.5-month window -- see Q9)", "model-provider transmission (continues by design; contractual counterparties under API terms, a different threat class from public adversaries -- this bounds but does not void the protection claim)"]
      basis: [PRIV-07, BEN-01, BEN-04]
      prose: "Thread (a), link by link: (1) 'private was unaffordable' -- TRUE at the time (Decision 68's problem statement: '2000 min/month free tier exhausted at current PR velocity') and TRUE again today for hosted runners: the current bill is GBP 0 only because the repo is public; flipping onto hosted runners would cost ~GBP 53-86/mo at observed volume (cost_analysis), against a whole-platform baseline of USD 22-59/mo. (2) 'self-hosting makes private affordable' -- TRUE for Actions minutes (GBP 0 today, ~GBP 23/mo if the postponed PR-1 charge returns) but it converts money into availability risk (PRIV-04), governance loss it does not fix (PRIV-01/02/03), and 2-6 h/mo of maintenance. (3) 'therefore go private' -- non sequitur: affordability is necessary, not sufficient; the plan-tier and security losses are the real price and are unpriced in the requester's chain. Thread (b): operational-data value does flow into prompts, contracts and config, so the code increasingly encodes the asset -- this RAISES the future value of enclosure (supports I-B) but also means the cheapest protection is to fence the DELTA (CD.32 split-repo for sensitive future work), not to enclose the already-public whole. Q9 was answered before this headline was finalised: the redactability working assumption substantially HOLDS (0 forks, 1 star, short window), so the headline was not revised on that account; note the Apache-2.0 grants on published commits are irrevocable regardless."
    - {q: Q2, verdict: marginal-speedup, basis: [PRIV-06, BEN-02],
       prose: "The suite is already parallelised: pytest -n auto via pytest-xdist (scripts/checks/_scaffolding.py:147-148, requirements-dev.txt:11), 501 test files. Full tier on today's hosted runner: median 23.8 min wall (30-run sample). Uncontended model on 16C/32T with persistent caches: setup ~4 min collapses to <1 min (warm venv), the pytest phase (est. 12-16 min at hosted width) scales to ~2-4 min at 16-24 workers, mypy/lint gain little (limited internal parallelism) -- plausible full tier 6-9 min, a 2.5-4x MATERIAL speedup. Contended model (PySR saturating the box): CI degrades to hosted-parity or worse and PySR loses throughput symmetrically; with PySR duty cycle unstated (AI-04) the decision-relevant figure is the contended one, hence the verdict. Utility check: the full tier is POST-MERGE (ci.yml:85-86) and main-canary is scheduled; the PR edit loop runs the fast tier at ~2 min observed -- so even the uncontended speedup buys little where latency actually matters. Memory: 32 GB across up to 32 workers is ~1 GB/worker before OS+PySR; capacity, not the single memory channel, binds first -- cap CI at 8-12 workers when PySR is active. On the requester's GBP 260 question: the second DIMM is NOT justified by CI (bandwidth is a 10-30% effect at capped widths); if bought at all it should be for PySR capacity, decided on PySR evidence. Shared-box theorisation (bounded, hypothesis): one 9950X can carry both roles only with explicit partitioning -- cgroup-capped ephemeral CI containers (e.g. 12 threads / 10 GB) with PySR niced below them, accepting that a saturated box makes CI latency unpredictable exactly when Q4's availability expectations assume minutes; temporal separation (pause PySR during CI) is workable for post-merge tiers but couples the trading workload's schedule to CI cadence, and the contention falls mainly on CI (bursty, deadline-shaped) rather than PySR (throughput-shaped)."}
    - q: Q3
      verdict: partial
      external_checklist:
        - {property: RP1, rating: met, evidence: "design: actions/runner --ephemeral, one job per registration, fresh container per job; orchestrator re-registers after each job"}
        - {property: RP2, rating: met, evidence: "design: JIT config via POST /repos/{o}/{r}/actions/runners/generate-jitconfig from a host-local orchestrator holding a fine-grained PAT scoped to runner administration only; no long-lived registration token on disk"}
        - {property: RP3, rating: met, evidence: "design: jobs execute inside rootless Podman containers built from a pinned ubuntu-24.04 image mirroring ubuntu-latest toolchain; image rebuilt weekly; NOT bare-metal execution"}
        - {property: RP4, rating: met, evidence: "design: dedicated non-root 'ghrunner' user, no sudo, systemd service with NoNewPrivileges, user-namespace-isolated containers"}
        - {property: RP5, rating: partial, evidence: "design: nftables egress allowlist (github.com, api.github.com, *.actions.githubusercontent.com, AWS endpoints, PyPI, Terraform registry) -- partial because PyPI/registry wildcards leave a broad exfil channel; property-matched compensating control: the Decision 120 terraform provider filesystem_mirror and a local pip cache shrink the needed allowlist over time, and OIDC credentials are short-lived so the exfil window per job is bounded"}
        - {property: RP6, rating: met, evidence: "design: runner version pinned in the image; auto-update disabled; weekly image rebuild bumps the pin; GitHub's minimum-version requirement tracked in the rebuild job"}
        - {property: RP7, rating: met, evidence: "design: OFF-BOX liveness -- a scheduled hosted-runner workflow checks GET /actions/runners for online status and a dead-man switch (e.g. healthchecks.io ping from the host) alerts the operator; addresses PRIV-04's GitHub-side silence"}
        - {property: RP8, rating: "n/a", evidence: "established, not assumed: private repository, sole collaborator (benjamin-blake), forks_count=0 confirmed via API 2026-08-13; private-repo forks are impossible without collaborators, so no untrusted fork workload exists. CHANGES IF: the repo regains collaborators or returns public -- then RP8 must be re-rated and a runner group/label separation built BEFORE that change lands"}
        - {property: RP9, rating: met, evidence: "design: secrets injected per-job into the ephemeral container environment only; workdir on tmpfs; container destroyed at job end; host filesystem never receives job secrets"}
        - {property: RP10, rating: met, evidence: "design: workspace is container-scoped and destroyed per job (RP1/RP3); named build caches (pip, venv) are mounted read-mostly from a curated host volume refreshed by the weekly image rebuild, not writable by jobs"}
      basis: [PRIV-05, PRIV-04]
      prose: "Architecture: persistent HOST, ephemeral RUNNERS -- a host-local orchestrator (systemd) mints JIT configs and launches one single-job containerised runner at a time, capped by cgroups (12 threads / 10 GB) to bound PySR contention; concurrency 1-2 runners maximum on this box, not 32. Registration: JIT per job (RP2). Upgrades: pinned version, weekly image rebuild (RP6). Monitoring: off-box dead-man switch plus a hosted-runner poller (RP7) -- this is also the compensating control Q4 requires. Verdict by the pinned mapping: no property missed, RP5 partial, rest met/n-a => partial. Honest hard parts: the JIT-minting PAT is itself a standing credential on the host (narrow admin scope, but real); egress allowlisting against PyPI is porous (RP5); and the design's parity with ubuntu-latest is approximate -- toolchain drift between the weekly image and GitHub's image is a new failure class the hosted arrangement did not have."
    - {q: Q4, verdict: reopened-gap, basis: [PRIV-04, PRIV-06],
       prose: "All three wake mechanisms are completion-triggered, and under the proposal the jobs they depend on run on the same box that may be offline: signal-green is a JOB inside the CI run (needs pr-validate+terraform-validate; ci.yml:293-304) -- a queued run posts nothing; pr-conflict-signal.yml itself runs on push to main -- if its job targets the offline runner it queues too, so the conflict wake dies with the runner; subscribe_pr_activity delivers comments and CI FAILURES -- a queued-never-started job emits neither. Timeline for a watching session: T+1h silence, T+6h silence, T+24h GitHub cancels the queued job (documented self-hosted queue limit) and the run completes CANCELLED -- which ci-rca's gate ignores (conclusion=='failure' required, ci-rca.yml:59) and whose relay to the watching session as a wake is UNVERIFIED (hypothesis), so the floor is a 24h stall and the ceiling is an indefinite one. AGENTS.md retired the send_later backstop on the reasoning that no dropped-signal gap remained (F36); an offline runner reopens exactly that gap, so the retirement's premise does not survive the migration as proposed. Scheduled workflows: main-canary (3-hourly) piles up queued runs; terraform-drift (hourly) likewise; codeql is MOOT on a personal private repo (PRIV-03); ci-rca fires only on default-branch FAILURES -- queued-then-cancelled runs never reach it, so the failure-recording pipeline is blind exactly when the substrate is broken. CD.38 (pending) would make this availability load-bearing for the whole autonomous loop (PRIV-06). HYBRID changes the answer to partially-closed: pin signal-green, pr-conflict-signal, ci-rca and other sub-minute jobs to ubuntu-latest (~4,000-5,000 min/mo, ~GBP 7-12/mo on Pro -- and note the hosted leg requires a funded, non-zero Actions spending limit, the Q11 round-2 stall condition) and add RP7's off-box liveness alarm; the residual gap is then bounded by the alarm's detection latency rather than by GitHub's 24h queue cancellation."}
    - {q: Q5, verdict: loss-mitigable, basis: [PRIV-01, PRIV-02],
       prose: "Against current docs (all quotes retrieved 2026-08-13): GitHub Free (personal) private repos get NO protected branches/rulesets, NO CODEOWNERS enforcement, NO environment secrets, and 'required reviewers are only available for public repositories' on Free, Pro AND Team -- deployment protection rules on private repos are Enterprise-only. Pro (USD 4/mo) restores protected branches/rulesets, CODEOWNERS, environments/secrets/deployment branches -- but NOT required reviewers. Dependencies traced: (1) tf-gated-apply Environment (reconcile.yml:647, terraform-apply-sandbox.yml:750, tf-gated-apply-prototype.yml:35) loses its human-approval property on EVERY pinned plan => PRIV-01, the sharpest loss; mitigation exists (workflow_dispatch-gated apply, same human-approval property, fail-closed -- job cannot run unless a human dispatches) but must be BUILT and landed pre-flip. (2) main-protection ruleset (repo.tf:62-119) incl. required checks pr-validate/terraform-validate, require_code_owner_review, required_linear_history: dead on Free -- this re-imposes Decision 89's exact constraint, whose 'permanently unavailable' premise Decision 83 reversed only BECAUSE the repo went public; survives on Pro. (3) CODEOWNERS (DEP-05/Decision 144 deploy-gate surface): dead on Free, survives on Pro. (4) Server-side half of never-commit-on-main: same ruleset dependency; the client-side hook survives regardless. Team examined per the precondition: Team requires an organisation and therefore TRANSFERRING the repo -- which breaks every OIDC sub claim pinned to repo:benjamin-blake/agent-platform (oidc.tf:405,603,790), every PAT/app scope, and changes CODEOWNERS semantics -- and buys nothing Pro does not, because required reviewers are still public-only on Team; its sole unique unlock is purchasability of the paid security products (Q6). Team is DROPPED from the recommendation and from cost_analysis (see dedup_note). Verdict: loss-mitigable, strictly conditional on Pro-before-flip plus the PRIV-01 gate redesign; on Free alone it would be loss-blocking."}
    - {q: Q6, verdict: partially-replaced, basis: [PRIV-03],
       prose: "On a personal-account private repo without paid products, against current docs: CodeQL/code scanning -- LOST; 'You must be on a GitHub Team or GitHub Enterprise plan in order to purchase GitHub Code Security or GitHub Secret Protection', so it is not purchasable at ANY price without an org transfer; replacement: none built; nearest substitute is an open-source SAST (e.g. semgrep/bandit) wired into validate.py -- real but weaker than CodeQL. Secret scanning -- LOST (public-repo feature; paid product org-only). Push protection -- LOST server-side; the pre-commit never-commit hook (shape-pattern) survives but is CLIENT-side only: it exercises the same property (block secret-shaped content pre-publication) yet fails where push protection succeeds -- any push bypassing local hooks (new clone, --no-verify, CI-authored commits), so it lowers severity without dismissing the gap. Dependency graph + Dependabot alerts/updates -- RETAINED ('included in all plans'); dependabot.yml (pip + github-actions, weekly) keeps working. ghas-probe/ULF-01 fate: the probe has two deliberately different callers (validate_ghas_probe.py:7-15) -- the registered validate.py check is SKIP-when-unscoped (no token in CI, so the full tier and merge loop are UNAFFECTED by the flip), while the weekly workflow's loud-fail runner correctly goes standing-red; but ghas-probe is absent from ci-rca's watched list (ci-rca.yml:24-31), so the red alarm reaches nobody -- the Decision 83 blind-window precedent (2026-07..08, six failed runs unactioned) replayed permanently. The AGENTS.md T2.12 assertion ('live-verified 2026-08-11') and Decision 83's evidence stanza outlive the reality they describe from the flip instant -- the exact ULF-01 defect class -- unless amended in the SAME change as the flip. (Revised in adversarial round 1: the draft wrongly claimed the full tier also turns red.) Q7 interaction: Dependabot alerts survive, but its UPDATE PRs would now execute install steps on the privileged host -- losing alerts was the feared regression; the actual regression is losing CodeQL/push-protection while GAINING a privileged execution venue for dependency code (PRIV-05)."}
    - {q: Q7, verdict: acceptable-with-controls, basis: [PRIV-05, PRIV-04],
       prose: "Assets on the trust boundary: OIDC-federated AWS authority (github-ci-branch/pr/apply roles -- IAM-capable within the guard's budget), the DuckLake/warehouse credentials CI touches, the PySR workload and any trading data co-resident on the box, the home network behind it, and repo write via the runner's job token. Adversaries/entry points: malicious or compromised pip/npm/action dependencies executing in jobs (incl. Dependabot update PRs -- Q6 interaction); a compromised workflow step exfiltrating OIDC tokens; container escape to host; lateral movement host->LAN; physical access (unstated, AI-class assumption). Properties LOST versus GitHub-hosted (not merely changed): (1) per-job disposable VM -- the clean-slate guarantee that makes persistence attacks structurally worthless; (2) GitHub-managed patching/hardening of the execution image; (3) datacenter-grade physical and network isolation -- the runner moves inside the same blast radius as the trading workload, which is the single worst property of the proposal; (4) an execution venue whose compromise does NOT touch personal data. Q3's controls, property-matched: ephemeral containers restore most of (1) short of kernel escape; weekly pinned image rebuild partially restores (2); egress allowlist (RP5, partial) bounds exfiltration; cgroup+user-namespace isolation and no host secrets (RP9) bound blast radius; the off-box monitor (RP7) restores detection. Residual acceptance: OIDC short-lived tokens mean host compromise yields bounded-window AWS authority rather than standing keys -- the strongest existing mitigation, and it survives the migration (Q8). Verdict: acceptable-with-controls; REQUIRED controls: RP1+RP3 ephemeral containerisation, RP4 non-root, RP5 egress allowlist, RP7 off-box liveness+alert, RP9/RP10 no persisted secrets/state, cgroup caps isolating PySR, and network segmentation (VLAN or equivalent) between the runner and personal devices. Without these -- a naive persistent bare-metal runner -- the verdict would be unacceptable."}
    - {q: Q8, verdict: survives, basis: [],
       prose: "(a) Visibility: no trust condition in terraform/personal/oidc.tf derives from repository visibility -- conditions key on aud=sts.amazonaws.com and sub=repo:benjamin-blake/agent-platform:{ref|pull_request} (oidc.tf:401-406, 593-604, 786-815). A private repo presents identical claims; OIDC survives the flip unchanged. (b) Self-hosting: the token issuer is GitHub's service (token.actions.githubusercontent.com) regardless of where the runner executes; id-token:write works identically on self-hosted runners; all 16 workflows survive. Branch-prefix trap resolved: the trusted refs/heads/agent/* (oidc.tf:406) matches ZERO live branches (0 agent/*, 8 claude/* on origin, checked 2026-08-13), and claude/* sessions authenticate via the pull_request sub on PR events -- ci.yml fires only on pull_request and push-to-main, so nothing live depends on the agent/* entry; it is dormant trust scope, not a break (rejected candidate C9). The one migration variant that DOES break trust is the Team org-transfer: sub claims pin the owner segment, so a transfer invalidates every role trust until oidc.tf is re-applied -- one more reason Q5 drops Team. Forward-looking half: if CI leaves GitHub Actions, the issuer disappears; options against NS1: (1) new OIDC issuer from the replacement CI (parity, preferred; cost = new provider + trust rewrite); (2) long-lived static AWS keys on the runner host -- rejected as standing authority on the most exposed host in the design (violates NS1, inflates Q7 blast radius); (3) short-lived keys brokered by an off-box vault -- workable middle, adds an infrastructure dependency the platform does not currently run."}
    - {q: Q9, verdict: worth-doing,
       license_recommendation: keep-apache-2.0,
       license_rationale: "Under the headline (stay public, I-C/I-D): Apache-2.0's patent grant and recognisability are portfolio-positive and churn on the license would cost credibility for zero enclosure (published grants are irrevocable anyway). Under I-B (flip): switch FUTURE commits to a source-available license (e.g. BUSL-1.1) or simply proprietary-by-default inside a private repo; recorded as the intent-dependent alternative, not the recommendation.",
       basis: [], prose: "Tested against what is actually recoverable: forks 0, stargazers 1 (API, 2026-08-13), public window 2026-05-30 to date (~2.5 months; repo created 2026-05-28 -- the two dates differ, F11). Recoverable after a flip: Software Heritage crawls of public GitHub (takedown is case-by-case, not guaranteed), GH Archive event metadata (commit SHAs/messages persist; full trees generally not), search caches (decay in weeks), any private clones (unknowable but improbable at 0 forks/1 star), and LLM training crawls during the window (irretrievable in principle, invisible in practice). The requester's 'effectively redactable' assessment substantially HOLDS for this repo's reach -- the practical leak floor is low but NOT zero, and the Apache-2.0 grants on every published commit are irrevocable, so the worst case must be priced as 'the 2.5-month history is licensed-out forever'. Verdict worth-doing, scoped: retraction costs nothing beyond the flip itself (the flip IS the retraction) and buys real reach reduction IF the flip proceeds for other reasons; as a STANDALONE motive it would not justify the migration. Consequence for Q1: the working assumption survived, headline unrevised."}
    - {q: Q10, verdict: portable-with-cost, basis: [PRIV-08],
       prose: "PR-1 verified TRUE (postponed, not cancelled -- see premises_tested), so both forms answered. Premise-holding form: if the USD 0.002/min charge returns as announced, self-hosted-on-private costs ~GBP 23/mo at observed volume (15,500 over-quota min x 0.002 x 0.74) -- annoying, not existential; the sharper risk is that a postponed-and-reworked pricing model is UNKNOWN, and the repo's own reevaluation trigger ('Self-hosted runner cost becomes >2x scheduled-runner alternative') correctly owns re-checking it. General form: scripts/validate.py is a genuinely portable verdict engine (428 lines, --pre/full tiers) but only 3 of 19 workflows route through it (ci.yml, main-canary.yml, ci-rca.yml -- F4 verified); the other 16 are GitHub-native orchestration. Migration costs by feature: terraform-apply-sandbox.yml -- OIDC (id-token), the tf-gated-apply Environment, concurrency groups, gh CLI => on another CI needs a new OIDC issuer + a replacement approval gate + queue semantics (M-L effort); reconcile.yml -- same set plus artifacts (M-L); deploy-ducklake-lambdas/deploy-prod-lambdas -- OIDC + concurrency, thin shells over scripts (S-M each); ci-rca.yml -- workflow_run chaining, the hardest single dependency: no common CI has an equivalent cross-workflow completion event, so RCA would need webhook plumbing or polling (M); signal-green/pr-conflict-signal -- gh CLI comment plumbing, trivially rewritable but harness-coupled (S). Verdict: portable-with-cost -- the check LOGIC exits cheaply; the EVENT FABRIC (workflow_run, Environments, OIDC issuer, comment wakes) is the lock-in, roughly 1-3 weeks of focused work to re-plumb."}
    - {q: Q11, verdict: sequenced-plan-with-rollback, basis: [PRIV-01, PRIV-02, PRIV-03, PRIV-04, PRIV-07],
       prose: "Produced under protest per the contract: the Q1 headline is recommend-public, so this plan is conditioned on the requester overriding it (its existence is not endorsement). Shape: paper first (decision reversal, PRIV-07), then plan upgrade BEFORE flip (Pro restores rulesets/CODEOWNERS on private -- flipping on Free silently disables main-protection, the Decision 89 redux), then the PRIV-01 gate replacement and PRIV-03 probe re-scope landed and tested WHILE STILL PUBLIC (the flip's asymmetry: environment-reviewer behaviour on private cannot be rehearsed from a public repo, so the replacement must not DEPEND on private-only behaviour -- workflow_dispatch gating satisfies this), then the flip via terraform/github human-gated local apply in the same change-set as the AGENTS.md/Decision-83 evidence amendments (closing the ULF-01 assertion-outlives-reality window), and only then, optionally, the runner cutover job-family by job-family with the wake substrate pinned hosted (PRIV-04). Lockout analysis (revised through all three adversarial rounds; final state NOT re-reviewed -- see meta.unconverged_items): the dominant failure mode is INVERTED -- controls silently vanish rather than block -- with TWO known blocking stalls the sequence produces by construction, neither a permanent lockout. (1) Budget stall (round 2): on a private repo Actions minutes are metered and personal accounts default to a USD 0 spending limit; Pro's 3,000 included minutes exhaust roughly FIVE DAYS after the flip at the observed 17,500 min/mo (runner cutover comes later), at which point workflows stop, required checks cannot run, and AGENT merges block -- the human admin retains the ruleset's always-on bypass (repo.tf:75-79), so this stalls the autonomous loop, not the operator; recoverable in minutes in billing settings; hence the non-zero-budget precondition at steps 2 and 5. (2) Flip-apply stall (round 3): repo.tf:13-24 pins secret_scanning and secret_scanning_push_protection to 'enabled', which the API rejects on a private repo without the unpurchasable paid product -- so step 5's terraform apply ERRORS unless the security_and_analysis block is amended in the same change-set; loud and human-attended, but blocking until fixed. Earlier draft errors corrected by review: round 1 refuted a claimed full-tier wedge from the ghas check (SKIP-when-unscoped contract); round 2 surfaced the budget stall; round 3 surfaced the flip-apply stall and the bypass-survives correction. The remaining hazards are silent ones -- the unwatched standing-red weekly probes (ghas-probe, and codeql on a private repo) and the stale liveness assertions (PRIV-03) -- which is why the probe re-scopes and the AGENTS.md/Decision-83 amendments ship in the flip change-set, not after. terraform/github/CLAUDE.md's lockout-recovery procedure (bypass actor actor_id=5 / UI ruleset disable) survives on Pro; on Free it is moot because the ruleset itself is dead. Full step table in migration_plan."}
    - q: Q12
      answers:
        - {question: "Process obligation for reversing ratified decisions (dec-111/dec-112, T2.10 exit criteria)?",
           answer: "dec-111's own reversal-conditions stanza names the path: 're-open as a candidate only if the public-repo decision is reversed' -- i.e. file a new candidate decision and ratify it through the Decision 105 lane, engaging the original rationale (DD-C). This audit does NOT satisfy that obligation; it is input to it. T2.10 is not re-opened -- its exit criteria were true when completed; a new tier item owns the new runner work.",
           basis: [PRIV-07]}
        - {question: "Does going private contradict the stated end-state (PROJECT_CONTEXT.md:20)?",
           answer: "Yes, verbatim ('The platform end-state is a public, agent-first automation platform'). A flip without amending it institutionalises a false premise for every future planning session -- the Decision 89/83 lesson. Must change: PROJECT_CONTEXT.md:20, the curated-portal items (T2.11a/T2.11b), and the portal artifacts' framing (README, SECURITY.md, EVALUATION-PROMPTS.yaml). AGENTS.md's boundary section is visibility-independent and stands.",
           basis: [PRIV-07]}
        - {question: "Fate of claude.yml and the Claude Code OAuth token on a private repo?",
           answer: "Survives: it authenticates via CLAUDE_CODE_OAUTH_TOKEN (secret, not visibility-dependent) and @claude mention triggers still fire. Its minutes become billable (it stays on ubuntu-latest -- it is in the 16 non-validate workflows). If instead routed to the self-hosted box, a mention-triggered agent executing model-driven actions on the privileged host joins Q7's threat model; keep it hosted.",
           basis: []}
        - {question: "Do the sole-developer compensating controls change meaning on a private repo?",
           answer: "On Pro they carry over mechanically; their MEANING narrows favourably -- with no outside collaborators possible, prevent_self_review=false and count=0 no longer face even theoretical third-party traffic, and the GitHub audit log keeps recording bypasses. On Free the question is moot (ruleset dead, PRIV-02). No new gap; the deliberate-constraints list stands.",
           basis: []}
        - {question: "Unnamed middle options, and does one dominate?",
           answer: "Three examined: (1) private + hosted + Pro -- dominates self-hosting on availability/ops (zero new burden) at ~GBP 54-86/mo, still loses required-reviewers and GHAS (PRIV-01/03). (2) Hybrid runners -- dominates all-self-hosted on wake liveness (Q4) for ~GBP 7-12/mo. (3) CD.32 split-repo: keep this repo public, put sensitive FUTURE work in a new private repo whose CI fits inside the free tier -- protects the delta the requester actually fears losing, keeps portfolio value, keeps all public-repo controls here, needs no runner. Option 3 dominates the proposal on every axis except totality of enclosure and is the audit's recommended I-B path.",
           basis: [PRIV-01, PRIV-03, BEN-01]}
        - {question: "Maintenance burden of a self-hosted runner, and who absorbs it?",
           answer: "Steady-state 2-6 h/mo (AI-06: image rebuilds, runner/version pins, disk, cert/token rotation, queue incidents) plus an incident tail measured in days/year (hardware, power, ISP). Absorbed entirely by the sole developer, i.e. priced in platform-roadmap opportunity cost; at any plausible personal-time valuation it exceeds the entire hosted-runner bill it saves.",
           basis: []}
        - {question: "What does the repo LOSE by going private that is not a security control?",
           answer: "The curated-portal asset ratified by dec-111 (README/AGENTS.md/EVALUATION-PROMPTS.yaml as an evaluator-facing surface), T2.11a's one-click evaluator boot (deferred but designed FOR public evaluators), portfolio/credibility value (the I-C asset -- EVALUATION-PROMPTS.yaml exists precisely for external evaluation), unlimited free public-repo Actions minutes, and free GHAS-class scanning. Also the option value of community scrutiny, currently near-zero (0 forks) but non-negative.",
           basis: [BEN-01]}
        - {question: "(own extension) Does the flip interact with the audit-artifact convention itself?",
           answer: "Yes, mildly: audits/ and docs/ publish governance detail (workflow anatomy, gate design) that is reconnaissance-useful; Decision 101 already keeps credentials/ids out, so the marginal exposure is architectural, and NS6 says market exactly this. A flip hides future audit artifacts along with everything else -- a small real benefit under I-B, nil under I-C.",
           basis: []}
        - {question: "(own extension) What happens to open Dependabot/dedup-probe/scheduled noise budgets on a metered plan?",
           answer: "Every scheduled workflow becomes a recurring bill: main-canary alone is ~6,100 min/mo (~GBP 27 at Pro rates) -- roughly a third of the projected private-hosted bill. Cadence tuning (canary 3h->6h, drift hourly->3h) saves more money than self-hosting saves after non-Actions costs, at ~zero risk. This lever belongs in ANY cost decision and is currently priced nowhere (PRIV-08).",
           basis: [PRIV-08]}
