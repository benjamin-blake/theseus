  migration_benefits:
    - id: BEN-01
      surface: S-VIS
      question: Q1
      title: "Future-commit IP enclosure under commercial intent (I-B)"
      claim: "A visibility flip closes the direct-read and future-mirroring channels for all future commits, and the value of that enclosure GROWS over time as operational-data learning is encoded into prompts, contracts and config (requester thread b)."
      evidence: "docs/ROADMAP-PLATFORM.yaml cost_projection breakdown (deepseek_executor_inference / anthropic_escape_hatch_spillover -- the feedback loop exists); AGENTS.md Decision 101 boundary (the data itself never lands in the repo)"
      evidence_kind: static
      current_behavior: "Every commit is world-readable and irrevocably Apache-2.0 licensed at publication."
      improved_behavior: "Future commits readable only by the owner; no new license grants issue."
      magnitude: M
      magnitude_rationale: "M not L: the crown-jewel asset (DuckLake data) is already private in AWS; enclosure protects the growing encoded residue, not the jewel itself. On magnitude sizing (revised in adversarial round 2): the residue accrues at the platform's recorded operating rate (~100-300 recs/month per cost_projection's baseline), but NOTHING measures what share of that distillate lands in committed artifacts versus the private warehouse, and a competitor's starting point is the entire already-published, irrevocably-licensed history -- only the delta is enclosed. Any lead-time figure would be a guess (HYPOTHESIS-class), which is exactly why this benefit cannot outweigh the pound-denominated losses on its own and needs the requester's intent decision to price it. Under I-C/I-D the magnitude is negative (destroys the portfolio asset)."
      alternative_route: "CD.32 split-repo: fence sensitive FUTURE work in a new private repo (free-tier CI suffices at its volume) while this repo stays public. Captures most of the benefit at near-zero governance cost -- under I-B this cheaper route DOMINATES, so the benefit does not by itself justify migrating THIS repo."
      roadmap_crossref: {classification: already-recorded, item_ids: [CD.32], dedup_search_terms: ["visibility", "private", "IP boundary", "repo axis"], dedup_hit_count: 1, note: "CD.32's discipline points record the repo-axis-vs-data-axis orthogonality this benefit rides on."}
      confidence: CONFIRMED
      adversarial_verdict: overstated-and-revised
    - id: BEN-02
      surface: S-RUNNER
      question: Q2
      title: "Self-hosted capability unlock: caches, memory, job-duration ceiling"
      claim: "A self-hosted runner removes the hosted 6-hour job limit (self-hosted jobs may run up to 5 days), offers 32 GB and 16C/32T against hosted standard cores, allows persistent warm caches (venv, pip, terraform provider mirror) that collapse setup time, and could host the currently-excluded integration-marked tests."
      evidence: "GitHub Docs :: Actions limits :: https://docs.github.com/en/actions/reference/limits :: retrieved 2026-08-13 (5-day self-hosted job limit); scripts/checks/_scaffolding.py -m 'not integration' (excluded set exists)"
      evidence_kind: external
      current_behavior: "Cold setup per job; integration tests never run in CI; hosted resource ceiling."
      improved_behavior: "Warm full tier est. 6-9 min uncontended (Q2); integration tier becomes schedulable."
      magnitude: M
      magnitude_rationale: "A capability the platform does not currently have (integration tier in CI) plus a recurring time saving on post-merge tiers; not L because the latency-critical PR loop is already ~2 min and gains almost nothing."
      alternative_route: "Larger hosted runners (8-core Linux ~USD 0.022/min post-2026-01-01 cut; naively ~GBP 285/mo at observed minutes, realistically ~1.5-2.5x the standard-runner bill since wider runners consume fewer minutes -- rate corrected in round 2, consumption model in round 3) or actions/cache for warm setup (free, partial, no memory/duration unlock). The cache route captures the setup saving without any migration; the integration-tier unlock genuinely requires self-hosting or paid larger runners."
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["integration tests CI", "runner memory", "job limit", "self-hosted capability"], dedup_hit_count: 0, note: "no roadmap item records this capability gap"}
      confidence: CONFIRMED
      adversarial_verdict: stands
    - id: BEN-03
      surface: shared
      question: Q5
      title: "Owned hardware voids the EC2-era cost precedent"
      claim: "The ~USD 35/mo figure that justified retiring the EC2 runner (CD.21) priced CLOUD rental 24/7; the owned box's marginal cost is GBP 4-12/mo incremental electricity if it already runs for PySR -- the historical 'self-hosting costs more' conclusion does not transfer (C16 adjudicated: stands, narrowly)."
      evidence: "docs/ROADMAP-PLATFORM.yaml:281-291 ec2_runner_24_7 '$0 (retired 2026-05-28 per CD.21; ~$35/mo historical...)'; cost_analysis rows 4-5"
      evidence_kind: static
      current_behavior: "The recorded cost baseline implies self-hosting carries a ~USD 35/mo class cost."
      improved_behavior: "Marginal-cost accounting: GBP 4-12/mo (already-on case) to GBP 23-51/mo (worst case incl. amortisation share and sole-use power)."
      magnitude: S
      magnitude_rationale: "S not M: it corrects a cost premise but only matters conditional on going private at all; staying public keeps the bill at GBP 0 regardless."
      alternative_route: "None needed -- this is an accounting correction, not an obtainable improvement; recorded so the cost_projection trigger execution (PRIV-08) prices owned hardware correctly."
      roadmap_crossref: {classification: already-recorded, item_ids: ["cost_projection.reevaluation_triggers"], dedup_search_terms: ["self-hosted runner cost", "ec2_runner_24_7"], dedup_hit_count: 2, note: "the >2x-alternative trigger owns exactly this comparison"}
      confidence: CONFIRMED
      adversarial_verdict: stands
    - id: BEN-04
      surface: S-VIS
      question: Q1
      title: "Reduced public-boundary review load"
      claim: "Going private shrinks the standing Decision-101 curation cost: per-artifact public-content review, the account-id scrubbing paths, and the 'is this publishable' judgment on every commit."
      evidence: "AGENTS.md 'PUBLIC repository / confidential-data boundary'; .claude/hooks pre-commit never-commit hook (which must REMAIN regardless -- NS6 makes the credential boundary visibility-independent)"
      evidence_kind: static
      current_behavior: "Every artifact is composed under public-content review discipline."
      improved_behavior: "Review narrows to the credential/alpha boundary only; the publishability judgment disappears."
      magnitude: S
      magnitude_rationale: "Noticeable friction reduction on one workflow; no cost line moves. The hook and secret hygiene survive, so the reduction is partial by design."
      alternative_route: "None equivalent -- the burden exists because of publicness. But its converse is BEN-01's caveat: the burden is also what keeps the portfolio asset publishable."
