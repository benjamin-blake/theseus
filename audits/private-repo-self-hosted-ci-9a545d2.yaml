      confidence: CONFIRMED
      adversarial_verdict: stands
    - id: BEN-05
      surface: S-SEC
      question: Q3
      title: "Private repo eliminates the fork-PR attack surface"
      claim: "On a sole-collaborator private repo, fork PRs are structurally impossible, so the primary risk GitHub's self-hosted-runner guidance warns about (PR-2's actual content) vanishes, and RP8 rates n/a rather than needing runner groups the personal plan does not offer."
      evidence: "GitHub Docs :: Adding self-hosted runners :: https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/add-runners :: retrieved 2026-08-13; forks_count=0, sole collaborator (API 2026-08-13)"
      evidence_kind: external
      current_behavior: "Public repo: anyone can fork; a self-hosted runner would face untrusted fork workloads (mitigated only by approval settings)."
      improved_behavior: "No untrusted external workload class exists; runner hardening scope shrinks."
      magnitude: S
      magnitude_rationale: "Simplifies the Q3 design materially but only matters if self-hosting proceeds; worthless standalone."
      alternative_route: "While public: 'require approval for all outside contributors' settings -- weaker (approval fatigue, human error) and runner groups are unavailable to personal accounts, so the private route is the only clean one."
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["fork PR", "runner group", "outside collaborator"], dedup_hit_count: 0, note: ""}
      confidence: CONFIRMED
      adversarial_verdict: stands
