  migration_plan:
    - {step: 1, action: "Ratify the reversal", changes: "File a candidate decision reversing dec-111 (and dec-112 if self-hosting proceeds) through the Decision 105 lane, engaging the original rationale per DD-C; amend PROJECT_CONTEXT.md:20 and the portal items (T2.11a/b) in the ratification change-set",
       reversible: true, rollback: "decline the candidate; nothing built", preconditions: ["requester pins intent (I-B vs I-C/I-D) -- the audit's intent_dependencies gate"], abort_criterion: "intent lands I-C/I-D => stop entirely (headline path)", lockout_risk: "none -- paper only"}
    - {step: 2, action: "Upgrade the account to GitHub Pro AND set a non-zero Actions spending limit BEFORE any flip", changes: "plan + billing budget only; no repo change. Budget sized from the observed baseline: >= (17,500 - 3,000) x USD 0.006 ~= USD 90/mo headroom until cadence tuning or runner cutover lands",
       reversible: true, rollback: "downgrade / re-zero the limit", preconditions: ["step 1 ratified"], abort_criterion: "n/a", lockout_risk: "none at this step; ordering constraints it prevents: flipping on Free silently disables main-protection + CODEOWNERS (PRIV-02, Decision 89 redux), and flipping with the default USD 0 spending limit stalls ALL workflows -- required checks, merges, and the wake substrate -- within ~5 days of the flip (adversarial round 2)"}
    - {step: 3, action: "Land the tf-gated-apply replacement while still public", changes: "rework the three gated jobs (reconcile.yml:647, terraform-apply-sandbox.yml:750, tf-gated-apply-prototype.yml:35) to a workflow_dispatch-gated apply (human dispatch = the approval act); keep the Environment declaration for deployment-branch scoping",
       reversible: true, rollback: "revert the workflow change; Environment gate still works while public", preconditions: ["step 1"], abort_criterion: "the replacement gate cannot demonstrate fail-closed behaviour (a gated apply runs without a human dispatch) => abort the flip", lockout_risk: "low -- deliberately testable pre-flip because workflow_dispatch semantics are visibility-independent (PRIV-01's chosen mitigation for the flip asymmetry)"}
    - {step: 4, action: "Re-scope the security monitors in the flip change-set (prepared now, merged with step 5)", changes: "validate_ghas_probe expectations parameterised by visibility; AGENTS.md T2.12 stanza and Decision 83 evidence annotated 'lapsed at flip'; optional: wire gitleaks/semgrep into validate.py as partial replacements",
       reversible: true, rollback: "revert", preconditions: ["step 3 merged"], abort_criterion: "n/a", lockout_risk: "none (no wedge: the registered check is SKIP-when-unscoped); if SKIPPED the hazard is silent instead -- a permanently red, unconsumed weekly probe and stale liveness assertions (PRIV-03)"}
    - {step: 5, action: "Flip visibility", changes: "terraform/github/repo.tf: visibility public->private AND remove/condition the security_and_analysis block in the SAME change-set (the API rejects an enabled secret-scanning status on a private repo without the unpurchasable paid product, so the apply errors otherwise -- adversarial round 3); via the human-gated LOCAL apply (Decision 77; never auto-applied), merged together with step 4's amendments",
       reversible: true, rollback: "re-apply visibility=public and restore the security_and_analysis block; GHAS suite restores automatically; ruleset unaffected on Pro", preconditions: ["steps 2-4 all landed and verified", "fresh backup/confirmation that Sub-claim OIDC roles are untouched (Q8)"], abort_criterion: "post-flip verification (below) fails and cannot be fixed same-day => flip back", lockout_risk: "low -- dominant failure mode is silent de-governance; verify within the hour: ruleset still enforcing (API), pr-validate required check blocking a test PR, environments intact, ghas-probe re-scoped run green, Dependabot still filing, AND Actions spending limit non-zero with billed-minutes accrual visible (the round-2 budget stall check)"}
