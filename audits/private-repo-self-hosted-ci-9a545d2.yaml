audit:
  meta:
    audited_commit: 9a545d2
    base_branch: main
    model: "Claude (Anthropic); exact model identifier withheld per execution-environment policy"
    methodology_version: 1
    scope_surfaces: [S-VIS, S-RUNNER, S-CI, S-WAKE, S-GOV, S-SEC, S-CRED]
    degraded_dedup: false
