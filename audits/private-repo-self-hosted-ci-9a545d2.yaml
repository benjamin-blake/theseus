  findings:
    - id: PRIV-01
      surface: S-GOV
      question: Q5
      also_serves: [Q7, Q11]
      dimension: VD5
      also_dimensions: [VD2]
      title: "tf-gated-apply's required-reviewer gate is void on private repos for every pinned plan (Enterprise-only feature)"
      evidence: "GitHub Docs :: Deployments and environments reference :: https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments :: retrieved 2026-08-13 ('If you are on a GitHub Free, GitHub Pro, or GitHub Team plan, required reviewers are only available for public repositories'); terraform/github/environments.tf (reviewers block); reconcile.yml:647, terraform-apply-sandbox.yml:750, tf-gated-apply-prototype.yml:35"
      evidence_kind: external
      current_behavior: "Jobs declaring environment: tf-gated-apply do not start until benjamin-blake approves -- the authorization boundary for guard fail-closed (IAM/trust/destroy) Terraform applies against live AWS."
      ideal_behavior: "That human-approval property survives the visibility flip, or a property-matched replacement is in place before the flip."
      gap: "On private Free/Pro/Team the required-reviewers protection rule is unavailable; the gated jobs would start without approval. The boundary between agent intent and irreversible IAM effect (NS1) silently disappears while environments.tf, AGENTS.md and Decision 92 continue to describe it as live -- the ULF-01 defect class applied to the governance plane."
      compensating_controls_considered: "terraform_apply_guard.py still classifies the plan (exit 2 routes to the gated job) -- but routing to an ungated job is no gate: the guard exercises plan-CONTENT classification, not human authorization, so it fails the property-match test. The github_ci_apply role's IAM budget bounds blast radius but was sized ASSUMING the human gate. Deployment-branch scoping (protected_branches=true) survives on Pro but only constrains WHICH ref deploys, not WHO approves."
      change_type: rescope
      proposed_change: "Before any flip: rework the three gated jobs to workflow_dispatch-only apply (the dispatch act IS the human approval; fail-closed -- nobody dispatches, nothing runs), testable while still public because dispatch semantics are visibility-independent. Keep the Environment for branch scoping."
      acceptance: "On a private test of the flow (or pre-flip rehearsal): a guard-exit-2 plan produces NO apply until a human dispatches; the dispatch path is exercised end-to-end once; environments.tf comment updated to record the gate's new mechanism."
      severity: critical
      severity_rationale: "Matches the pinned critical definition on two clauses: a silent lapse of a control the platform asserts is live, and an unbounded (relative to its designed envelope) expansion of agent authority over IAM/trust/destroy applies on live AWS."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["tf-gated-apply", "required reviewer", "environment gate", "Decision 92", "Decision 89"], dedup_hit_count: 0, note: "Decision 89 is precedent for the CLASS (plan-tier feature loss on private) but covers branch protection, not Environments; no item owns the Environments analogue."}
      effort: M
      depends_on: []
      sequencing: {safe_to_queue_now: false, blocked_behind: [PRIV-07], note: "only worth building if the reversal ratifies; the redesign is migration-plan step 3"}
      adversarial_verdict: stands
    - id: PRIV-02
      surface: S-GOV
      question: Q5
      also_serves: [Q11, Q12]
      dimension: VD2
      also_dimensions: [VD7]
      title: "Flipping on the Free plan silently disables main-protection, CODEOWNERS and required checks -- the exact Decision 89 constraint, re-imposed"
      evidence: "GitHub Docs :: GitHub's plans :: https://docs.github.com/en/get-started/learning-about-github/githubs-plans :: retrieved 2026-08-13 (protected branches + code owners: private repos require Pro/Team); docs/DECISIONS.md:5269 (Decision 89), 4487 (Decision 83); terraform/github/repo.tf:62-119; .github/CODEOWNERS"
      evidence_kind: external
      current_behavior: "main-protection ruleset active: required checks pr-validate + terraform-validate, code-owner review on the deploy-gate surface (Decision 144), linear history, deletion/non-FF blocks."
      ideal_behavior: "The merge gate survives the flip, or the plan upgrade that preserves it is an explicit, ordered precondition."
      gap: "The proposal as briefed assumes the Free plan ('private was unaffordable' framing). On Free, every server-side merge gate dies at the flip instant with no error -- the repository has already lived this failure mode (Decision 89 declared it 'permanently unavailable'; Decision 83 reversed that premise ONLY because the repo went public). The reversal's premise un-reverses silently."
      compensating_controls_considered: "Convention-plus-tooling (Decision 89's own fallback: local validate.py, never_on_main hook, squash-merge discipline) exercises the same property for the SOLO HUMAN but not for autonomous sessions merging via API -- the required-check block is what stops a red-CI merge by an agent; the hook does not run server-side. Partial match only, hence a finding."
      change_type: enforce
      proposed_change: "Make 'GitHub Pro active' a hard, verified precondition of the flip (migration_plan step 2), and add a post-flip verification step that queries the ruleset's live enforcement via API before the flip session ends."
      acceptance: "Migration plan carries the ordering; post-flip API check shows main-protection enforcement=active with both required checks intact on the private repo."
      severity: high
      severity_rationale: "Materially reduces a guarantee the platform depends on (agent merges gated by CI verdicts) and the compensating controls are judged insufficient for autonomous flows; not critical because the mitigation is a GBP 3/mo plan change with a trivial verification, and Decision 89's precedent makes the failure mode well-understood."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["branch protection", "required_status_checks", "Decision 89", "Decision 83", "private plan"], dedup_hit_count: 2, note: "Decisions 89/83 record the constraint's history but no item owns surviving a RE-flip; hits are precedent, not ownership."}
      effort: S
      depends_on: []
      sequencing: {safe_to_queue_now: false, blocked_behind: [PRIV-07], note: "ordering constraint inside the migration plan"}
      adversarial_verdict: stands
    - id: PRIV-03
      surface: S-SEC
      question: Q6
      also_serves: [Q11, Q5]
      dimension: VD3
      also_dimensions: [VD2]
      title: "Post-flip, CodeQL/secret-scanning/push-protection are unpurchasable on a personal account; the weekly ghas-probe goes standing-red with no wake path while the liveness assertions go stale"
      evidence: "GitHub Docs :: About GitHub Advanced Security :: https://docs.github.com/en/get-started/learning-about-github/about-github-advanced-security :: retrieved 2026-08-13 ('You must be on a GitHub Team or GitHub Enterprise plan in order to purchase GitHub Code Security or GitHub Secret Protection'; dependency graph + Dependabot 'included in all plans'); .github/workflows/ghas-probe.yml:1-39 + scripts/checks/misc/validate_ghas_probe.py:7-15 (two callers: SKIP-when-unscoped registered check vs loud-fail workflow runner); ci-rca.yml:24-31,59 (ghas-probe not watched; failure-conclusion filter); AGENTS.md T2.12 stanza; docs/DECISIONS.md:4487 (Decision 83 monitor-blind-window precedent)"
      evidence_kind: external
      current_behavior: "Secret scanning, push protection, CodeQL free and live (public repo); ghas-probe proves it weekly against the live API via the loud-fail _run_cli caller; the registered validate.py check is deliberately SKIP-when-unscoped (no token in CI), so the full tier does not depend on the probe; AGENTS.md and Decision 83 cite dated evidence."
      ideal_behavior: "The flip change-set re-scopes the monitor and amends the assertions in the same commit, names replacements (or accepted losses) per control, and gives the now-red-forever probe an explicit disposition so its alarm does not decay unwatched."
      gap: "Three server-side controls lapse at the flip with no purchasable path on Free/Pro (paid products are org-Team/Enterprise-only -- reachable only via the org transfer Q5 rejects). The weekly probe then goes STANDING-RED -- correctly -- but nothing consumes that alarm: ghas-probe is not in ci-rca's watched-workflows list and the full-tier check skips without a token, so the red runs surface to nobody. Decision 83 itself records the precedent (the 2026-07..08 blind window: 'all six scheduled runs fail unactioned... the monitor still carries no persistent-unavailability alarm'). Meanwhile AGENTS.md/Decision 83's 'live-verified' assertions outlive reality: the precise ULF-01 defect class, now with a permanently red monitor nobody is woken for. (Revised in adversarial round 1: an earlier draft claimed the full tier turns standing-red; refuted by validate_ghas_probe.py's SKIP-when-unscoped contract.)"
      compensating_controls_considered: "The pre-commit never-commit hook survives and exercises the same property client-side, but fails exactly where push protection succeeds (fresh clones, --no-verify, non-hook surfaces) -- partial match. Dependabot alerts/updates survive (all plans) -- full match for the dependency slice only. The probe's loud-fail design is a detection control that DOES fire -- and its exclusion from ci-rca is a DELIBERATE adjudication (config/ci_rca_taxonomy.yaml:298-307: 'a red scheduled run is already its own alarm') -- but that adjudication's premise is precisely what Decision 83's 2026-07..08 blind window empirically disproved: detection without delivery fails the property match for a monitoring control. codeql.yml joins the same class post-flip (standing-red, unwatched)."
      change_type: rescope
      proposed_change: "In the flip change-set: parameterise the probe's expectations by repo visibility (expect-disabled on private = green with a WARN line) or retire it with a dated Decision 83 stanza; amend AGENTS.md T2.12; wire gitleaks (secret shape) and semgrep/bandit (SAST) into validate.py as declared partial replacements or record the accepted loss explicitly."
      acceptance: "Post-flip: ghas-probe green under visibility-aware expectations (or formally retired); AGENTS.md/Decision 83 carry no assertion describing a lapsed control as live; replacement-or-accepted-loss recorded per control."
      severity: high
      severity_rationale: "A real guarantee reduction (server-side secret/push protection has no equivalent replacement and cannot be bought back on a personal account) whose compensating controls are partial; the monitoring side degrades silently (red-but-unconsumed alarm, precedented in Decision 83's blind window). Not critical because the full tier and merge loop are unaffected (SKIP-when-unscoped) and Dependabot -- the dependency-execution control most coupled to Q7 -- survives."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["ghas-probe", "ULF-01", "secret scanning private", "push protection", "code scanning"], dedup_hit_count: 1, note: "ULF-01/Decision 83 own the MONITORING pattern; nothing owns its behaviour under a visibility reversal."}
      effort: M
      depends_on: []
      sequencing: {safe_to_queue_now: false, blocked_behind: [PRIV-07], note: "ships inside the flip change-set (migration_plan step 4), never after it"}
      adversarial_verdict: overstated-and-revised
    - id: PRIV-04
      surface: S-WAKE
      question: Q4
      also_serves: [Q3, Q11]
      dimension: VD3
      also_dimensions: [VD2]
      title: "An offline or saturated self-hosted runner starves every wake mechanism; watching sessions stall 24h minimum, plausibly indefinitely"
      evidence: "ci.yml:293-304 (signal-green needs pr-validate+terraform-validate -- a job inside the run it reports on); .github/workflows/pr-conflict-signal.yml (its own job needs a runner); ci-rca.yml:59 (fires only on conclusion=='failure' on the default branch -- a CANCELLED run wakes nothing); AGENTS.md step 4 (F36: send_later backstop retired on 'no dropped-signal gap remains'); GitHub Docs :: Actions limits :: https://docs.github.com/en/actions/reference/limits :: retrieved 2026-08-13 (self-hosted jobs queued for 24 hours are cancelled)"
      evidence_kind: static
      current_behavior: "All three wake mechanisms are completion-triggered and answer in minutes on always-available hosted runners; on that premise the send_later backstop was retired."
      ideal_behavior: "Wake and signal jobs remain live independently of the self-hosted box, and something tells the watching agent when the runner itself is down."
      gap: "Under the proposal as stated (all jobs self-hosted): a down/saturated box means queued-never-started jobs, which emit no completion, no failure, no comment -- a watching session hears nothing at T+1h or T+6h; at T+24h GitHub cancels the queued job, and the cancellation demonstrably does NOT reach the recovery pipeline: ci-rca's gate requires conclusion=='failure' on the default branch (ci-rca.yml:59), so a cancelled run files no rec, and whether the harness relays a cancellation as a failure wake to the watching session is unverified (HYPOTHESIS on that one relay; everything else here is static-confirmed). The retirement's premise -- no dropped-signal gap -- does not survive the migration as proposed."
      compensating_controls_considered: "pr-conflict-signal's push-triggered re-poll: same-runner-dependent, fails with the box -- no property match. The signal-green retry loop: retries a comment on a job that ran; does nothing for a job that never starts -- no match. A human noticing: real but is precisely what the wake substrate exists to replace."
      change_type: rescope
      proposed_change: "Hybrid pinning as a hard design rule: signal-green, pr-conflict-signal, ci-rca, rec-autoclose and claude.yml stay on ubuntu-latest permanently (~GBP 4-9/mo on Pro); plus RP7's off-box runner-liveness alarm (hosted scheduled workflow polling /actions/runners + dead-man switch) so runner-down is itself a delivered signal."
      acceptance: "Kill the runner deliberately during a trial week: the watching session receives a liveness alarm within the poll interval, and a queued PR run is either failed fast (job-level timeout on queue via the alarm's cancel step) or surfaced; no silent stall past the alarm interval."
      severity: high
      severity_rationale: "Materially reduces the availability guarantee the autonomous merge loop depends on (NS5), and the named compensating mechanisms fail the property match; not critical because the stall is loud-by-absence to a human (a silent PR is noticeable) and fully designed-around by the hybrid rule at trivial cost."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: [], dedup_search_terms: ["signal-green", "wake", "send_later", "pr-conflict-signal", "queued"], dedup_hit_count: 1, note: "AGENTS.md step 4 records the backstop retirement (deliberate constraint -- not flagged per se); Q4 reopens it lawfully because the migration breaks its premise. No item owns runner-availability wakes."}
      effort: S
      depends_on: []
      sequencing: {safe_to_queue_now: false, blocked_behind: [PRIV-07], note: "the hybrid rule belongs in migration_plan step 7; the liveness alarm in step 6"}
      adversarial_verdict: stands
