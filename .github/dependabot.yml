version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # duckdb/ducklake are SSOT lockstep dependencies (Decision 99) that the auto-merge
        # denylist (scripts/ci/dependabot_auto_merge.sh _DENIED_DEPENDENCIES) never arms, so
        # leaving them in this group strands the whole weekly bump behind one denylisted member.
        # Excluding them costs one permanently-BLOCKED, permanently-quarantined standalone PR per
        # name (never mergeable -- it holds one of the five open-pull-requests-limit slots below),
        # in exchange for keeping that PR as the operator-visible new-release signal the one-file
        # bump procedure needs as its trigger. See Decision 99's reversal-conditions stanza in
        # docs/DECISIONS.md for the monitored retirement criteria this accepted cost is held
        # against, and scripts/checks/ci_guards/validate_dependabot_config.py for the presubmit
        # gate that keeps this list derived from the denylist, never silently drifting from it.
        exclude-patterns:
          - "duckdb"
          - "ducklake"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
