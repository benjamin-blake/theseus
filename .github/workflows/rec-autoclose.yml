name: rec-autoclose
# Layer 2 durable closure edge: reads Resolves: rec-NNNN trailers from the squash-merge
# commit and closes each named rec via the ops portal (Decision 84 single-portal invariant).
# Idempotency lives here: the workflow checks current status before writing and tolerates
# absent-id errors.  No-op when no trailer is present.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect DECISIONS.md change
        id: detect-decisions
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qx 'docs/DECISIONS.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install-dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC -- branch role)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: eu-west-2

      - name: Close resolved recs from Resolves trailer
        env:
          DUCKLAKE_WRITER_URL: ${{ secrets.DUCKLAKE_WRITER_URL }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git log -1 --format=%B HEAD > /tmp/commit_msg.txt

          .venv/bin/python << 'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ.get("GITHUB_WORKSPACE", str(Path.cwd())))

          from scripts.rec_trailer import parse_resolves_trailer
          from scripts.ops_data_portal import sync
          from scripts.ops_portal.ci_rca_lifecycle import close_recs_from_trailer

          commit_sha = os.environ.get("GITHUB_SHA", "unknown")
          repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          commit_msg = Path("/tmp/commit_msg.txt").read_text(encoding="utf-8")
          ids = parse_resolves_trailer(commit_msg)
          if not ids:
              print("rec-autoclose: no Resolves trailer found -- no-op")
              sys.exit(0)

          print(f"rec-autoclose: found trailer ids: {ids}")

          # Sync local cache so status checks reflect current warehouse state.
          try:
              sync()
          except Exception as exc:
              print(f"rec-autoclose: sync warning ({exc}); continuing with possibly stale cache")

          # Read local cache to check current status before writing (idempotency).
          recs_cache: dict = {}
          cache_path = Path("logs/.recommendations-log.jsonl")
          if cache_path.exists():
              for line in cache_path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      try:
                          r = json.loads(line)
                          recs_cache[r["id"]] = r
                      except (json.JSONDecodeError, KeyError):
                          pass

          sys.exit(close_recs_from_trailer(ids, commit_sha, run_url, recs_cache))
          PYEOF

      - name: Backfill decisions to warehouse
        if: "!cancelled() && steps.install-dependencies.outcome == 'success' && steps.aws-creds.outcome == 'success' && steps.detect-decisions.outputs.changed == 'true'"
        env:
          DUCKLAKE_WRITER_URL: ${{ secrets.DUCKLAKE_WRITER_URL }}
        run: |
          cd "$GITHUB_WORKSPACE"

          .venv/bin/python << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ.get("GITHUB_WORKSPACE", str(Path.cwd())))

          from scripts.ops_data_portal import backfill_decisions_from_md

          result = backfill_decisions_from_md()
          print(f"rec-autoclose: DECISIONS.md backfill result: {result}")
          sys.exit(1 if result["failed"] else 0)
          PYEOF
