# Hand-authored expectations for the telemetry state verbs (session_state_and_duration, agent_run_state_and_duration,
# sessions_window, sessions_window_all_purposes). Residual-class file (Decision 166): one flow-mapping line per expectation,
# why inline. Companion: derived_golden_rollups.yaml (the roll-up verbs); together they are the one expectations set every
# engine (in-memory DuckDB, local DuckLake, later the deployed reader) asserts. PLAN-telemetry-golden-harness (rec-4025).
#
# AUTHORING RULE. Every value is the Class A contract formula (telemetry_sessions.yaml state / duration_seconds,
# telemetry_agents.yaml duration_seconds, the envelope's R4/R5) applied BY HAND to the rows the CURRENT producer
# (parser_version below) emits for the tree. A value is never copied from a verb or oracle output and never edited to make a
# run pass; a disagreement is re-derived by hand. A trap tree reproducing a known producer defect carries the emitted value
# and known_defect naming the owner rec; the transcript truth is asserted by scripts/telemetry_verify shape and ledger checks.
# A plan that bumps PARSER_VERSION and changes a tree's emitted rows re-authors the affected lines by hand in its own PR,
# citing itself in each changed entry's why, and moves parser_version; tests/telemetry_verify/test_derive.py fails until it does.
#
# SHAPE. trees: [{tree: "corpus:<golden case>" | "verification:<tree>", pass: final | stop, why, expect: [...]}].
# expect line: {verb, session: root | "agent:<agentId>" (absent for the window verbs), params, rows: [asserted column subset],
# why, known_defect?, discriminates?}. rows[i] columns are compared to the verb's i-th row; {session: <selector>} stands for
# that session's stored id. Event time = 2026-01-01T00:00:SS; session_started_at = the root's first record.
# as_of RULE (state verbs): I = 2026-01-01T12:00:00Z (inside the 24 h idle threshold of the session's own last event),
# B = 2026-01-03T00:00:00Z (beyond it); on a NON-TERMINAL session a third value exactly last event + 86,400 s, tagged
# discriminates idle_threshold: the contract says idle time must EXCEED the threshold, so exactly equal still reads running
# (telemetry_sessions.yaml state; derivation_cases.yaml c06). A terminal session reads its outcome at any as_of.
# INTEGER CONVERSION. A fractional duration is truncated toward zero to whole seconds (the contract's int; rec-4405).
parser_version: 3
trees:
  - tree: corpus:hooks_resume_and_compact
    pass: final
    why: root open 1, resumes 3 and 9, compact 6, close 9 tied with the resume 9 on timestamp and ordinal so close ranks last
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8, last_event_timestamp: "2026-01-01T00:00:09Z"}], why: "close ranks last on the (9, 11) tie; 9 - 1 = 8 s; last event is the 9 s rows"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: terminal at any as_of}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-01T12:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: one root session of a real project}
      - {verb: sessions_window_all_purposes, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: success, outcome: success, duration_seconds: 8}], why: same root over every purpose}
  - tree: corpus:hooks_resume_and_compact
    pass: stop
    why: no finalization yet, so no close row; the latest lifecycle row is the resume at 9 s, the root is not terminal
    expect:
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-01T12:00:00Z"}, rows: [{state: running, outcome: null, duration_seconds: null, last_event_timestamp: "2026-01-01T00:00:09Z"}], why: latest row is a resume and 12 h idle is inside 24 h}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-02T00:00:09Z"}, rows: [{state: running, outcome: null, duration_seconds: null}], discriminates: idle_threshold, why: "idle exactly 86,400 s (last event 9 s + 1 day) does not EXCEED the threshold"}
      - {verb: session_state_and_duration, session: root, params: {as_of: "2026-01-03T00:00:00Z"}, rows: [{state: abandoned, outcome: null, duration_seconds: null}], why: not terminal and idle 1.99 days exceeds 24 h}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-02T00:00:09Z"}, rows: [{state: running, outcome: null, duration_seconds: null}], discriminates: idle_threshold, why: the window verb applies the same strict idle rule}
      - {verb: sessions_window, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-03T00:00:00Z"}, rows: [{state: abandoned, outcome: null, duration_seconds: null}], why: beyond the threshold}
      - {verb: sessions_window_all_purposes, params: {day_from: "2026-01-01", day_to: "2026-01-01", as_of: "2026-01-01T12:00:00Z"}, rows: [{state: running, outcome: null, duration_seconds: null}], why: same root over every purpose}
