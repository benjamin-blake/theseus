# Normative conformance vectors for the telemetry envelope's GENERATIONS AND READ-SIDE DEDUPE rule
# (Decision 207, R3-R8; docs/contracts/telemetry-event-envelope.yaml governance_notes). Each vector
# supplies per-table input rows and the expected surviving event_ids and conflicted grain keys.
# tests/telemetry/test_dedupe_vectors.py runs every vector through
# tests/fixtures/telemetry_dedupe_reference.py (the stdlib oracle); rec-4024's reader verbs must
# independently pass the same vectors on DuckLake.
#
# Row fields: producer, event_id, parser_version, session_id, event_kind (telemetry_sessions open
# rows only), created_timestamp, content (an opaque per-row marker -- two rows at one grain key
# with differing content are the concurrent-write race), and observation_id/event_timestamp
# (model_call rows only, for the R5c entity collapse).
#
# `situation` tags 1-10 map to the R8 facts-brief situation numbering; extra vectors are untagged.

vectors:
  - name: situation_1_identical_rebuild_no_bump
    situation: 1
    rows:
      telemetry_sessions:
        - {producer: claude_code, event_id: sess-open, parser_version: 1, session_id: s1, event_kind: open, created_timestamp: "2026-09-25T10:00:00+00:00", content: v1}
      telemetry_observations:
        - {producer: claude_code, event_id: step-1, parser_version: 1, session_id: s1, created_timestamp: "2026-09-25T10:01:00+00:00", content: A}
    expected:
      telemetry_observations: {surviving_event_ids: [step-1], conflicted_grain_keys: []}

  - name: situation_2_bump_content_change_unchanged_event_ids
    situation: 2
    rows:
