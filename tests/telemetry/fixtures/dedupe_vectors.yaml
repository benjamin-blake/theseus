        - {producer: claude_code, event_id: sess-open, parser_version: 2, session_id: s1, event_kind: open, created_timestamp: "2026-09-25T11:00:00+00:00", content: v2}
      telemetry_observations:
        - {producer: claude_code, event_id: step-1, parser_version: 1, session_id: s1, created_timestamp: "2026-09-25T10:01:00+00:00", content: A}
        - {producer: claude_code, event_id: step-1, parser_version: 2, session_id: s1, created_timestamp: "2026-09-25T11:01:00+00:00", content: B}
    expected:
      telemetry_observations: {surviving_event_ids: [step-1], conflicted_grain_keys: []}

  - name: situation_3_bump_dropped_rows_retired
    situation: 3
    rows:
      telemetry_sessions:
        - {producer: claude_code, event_id: sess-open, parser_version: 1, session_id: s1, event_kind: open, created_timestamp: "2026-09-25T10:00:00+00:00", content: v1}
        - {producer: claude_code, event_id: sess-open, parser_version: 2, session_id: s1, event_kind: open, created_timestamp: "2026-09-25T11:00:00+00:00", content: v2}
      telemetry_observations:
        - {producer: claude_code, event_id: step-1, parser_version: 1, session_id: s1, created_timestamp: "2026-09-25T10:01:00+00:00", content: A}
        - {producer: claude_code, event_id: step-2, parser_version: 1, session_id: s1, created_timestamp: "2026-09-25T10:02:00+00:00", content: A2}
        - {producer: claude_code, event_id: step-1, parser_version: 2, session_id: s1, created_timestamp: "2026-09-25T11:01:00+00:00", content: A-updated}
    expected:
      telemetry_observations: {surviving_event_ids: [step-1], conflicted_grain_keys: []}

