# Normative golden vectors for docs/contracts/telemetry-event-envelope.yaml's identity spec
# (Decision 199). Generated by an INDEPENDENT derivation (hashlib/struct/unicodedata + a stdlib
# Crockford encoder) that never imports src.telemetry -- see tests/telemetry/test_identity.py for
# the cross-check that recomputes every vector independently AGAIN, in-test.
#
# positive_vectors: inputs -> time_ms -> full H hex (sha256 digest) -> 16 raw ULID bytes hex -> the
# exact derived id, so a foreign implementation can bisect a mismatch at any stage. negative_vectors:
# input -> the error category identity.py must raise IdentityError for.
#
# ASCII-only: every ref is a plain string or a double-quoted scalar with \uXXXX escapes.

