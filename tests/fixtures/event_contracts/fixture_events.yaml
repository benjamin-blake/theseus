# Minimal Class A table_class:event fixture for tests/test_field_semantics_event_projection.py
# and tests/test_schema_to_field_semantics.py::test_event_class_dispatches_to_event_projection.
# Not a real ratified contract -- test fixture only (rec-4025 layout).
contract:
  id: fixture_events
  class: A
  contract_version: 1
  status: provisional_v0
  description: Minimal event-journal fixture contract exercising the event projection generator.
fields:
  event_id:
    $ref: fixture-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local:
      not_null:
        enforced: true
  parser_version:
    $ref: fixture-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local:
      not_null:
        enforced: true
  session_started_at:
    $ref: fixture-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local:
      not_null:
        enforced: true
  event_timestamp:
    $ref: fixture-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local:
      not_null:
        enforced: true
  created_timestamp:
    $ref: fixture-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local:
      not_null:
        enforced: true
  external_ref:
    type: str
    iceberg_type: string
    nullable: true
    description: Fixture external ref (event_id hash input).
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: true
  entity_ref:
    type: str
    iceberg_type: string
    nullable: true
    description: Fixture entity ref (entity_id hash input).
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: true
  tenant_id:
    type: str
    iceberg_type: string
    nullable: true
    description: Fixture tenant id.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: true
  project_id:
    type: str
    iceberg_type: string
    nullable: true
    description: Fixture project id.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: true
  entity_id:
    type: str
    iceberg_type: string
    nullable: false
    description: Fixture table's own derived entity key (mirrors a real table's PK column).
    semantics: Fixture only; derived at the write boundary from entity_ref in a real table.
    dq_intent:
      not_null:
        enforced: true
  duration_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: A derived-at-read field with no physical column.
    semantics: Fixture only.
    populated_by: a named reader verb.
    dq_intent:
      not_null:
        enforced: false
    derivation:
      timing: read
      derived_by: reader_verb:fixture_rollup
      formula: "fixture formula"
      inputs: [event_id]
      realized: false
  retry_count:
    type: int
    iceberg_type: bigint
    nullable: true
    description: A plain bigint input column.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: false
  cost_estimate:
    type: float
    iceberg_type: double
    nullable: true
    description: A plain double input column.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: false
  labels:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: A plain list[str] input column.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: false
  outcome:
    type: str
    iceberg_type: string
    nullable: false
    description: A nullable:false field that is ALSO conditionally required (required_when).
    semantics: Fixture only -- exercises the required_when-takes-precedence nullability rule.
    dq_intent:
      not_null:
        enforced: false
      required_when:
        event_kind: [close]
  workflow:
    type: str
    iceberg_type: string
    nullable: false
    description: A plain nullable:false field with no required_when.
    semantics: Fixture only.
    dq_intent:
      not_null:
        enforced: true
governance:
  table_class: event
  partition_by: "year(session_started_at), month(session_started_at), day(session_started_at)"
governance_notes: Test fixture; not a ratified Class A contract.
amendment_log: []
previous_versions: []
