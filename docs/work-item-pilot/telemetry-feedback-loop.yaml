work_items:
  - id: pwi-telemetry-reader-verbs
    kind: task
    title: 'Telemetry reader verbs: partition-bound, generation-aware derived-state reads over the event journal (rec-4024)'
    extension:
      consideration_register:
        why: Decision 199 stores no state, duration, roll-up, friction or cost; every feedback-loop consumer (failure signals, classifier, back-validation, T3.3) reads them only through these verbs.
        how: 'Extend NAMED_READS with an event-journal form: a server-decoded partition predicate from session_id, one shared R4/R5 dedupe block with its conflict report, and per-session verbs that return derived rows only.'
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: consecutive sessions whose verb outputs match the harness re-derivation, comparator: '>=', threshold: 50}}
            - {from: sampled, to: spot_check, trigger: {metric: verb re-derivation mismatches across the last 200 sampled sessions, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with zero mismatches and zero conflicted grain keys reported, comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'a verb returns a derived value (state, duration, roll-up) that differs from a re-derivation over the same raw rows, silently skewing every consumer', metric: 'verb_rederivation_mismatch_rate: sampled sessions whose verb output differs from the harness re-derivation', source: 'rec-4025 shadow mode once widened (q2); until then only CI vectors and the conflict stamp, dedupe leg only'}
        verification: [c1, c2, c3]
        rollback: Remove the telemetry verbs from NAMED_READS and bump the registry version; reads have no side effects and stored rows are untouched.
        evidence:
          - {kind: file_line, ref: 'src/common/ducklake_scd2_schema.py:333'}
          - {kind: file_line, ref: 'docs/contracts/telemetry_sessions.yaml:192'}
          - {kind: file_line, ref: 'docs/contracts/telemetry_sessions.yaml:252'}
          - {kind: file_line, ref: 'docs/contracts/telemetry-event-envelope.yaml:337'}
        settled:
          - {id: s1, text: 'Read side only: D199 derived-at-read verbs; the writer and tables are T2.36, labels rec-4032 and prices rec-4031 compose on this mechanism.'}
          - {id: s2, text: 'Registry needs an event-journal form: tables unregistered, a NamedRead''s table binding covers one table but R4 needs two, no forced partition (VP 1).'}
          - {id: s3, text: 'Feasible: R4/R5 dedupe is one SQL statement passing 17/17 vectors (VP 2); a session_id alone bounds a read to its own day''s files (VP 3).'}
        contested:
          - {id: k1, text: 'State/duration: contract reads any close as terminal, times from root start; sub-agents have no own start or close, so (a) uses their agent-run pair.'}
          - {id: k2, text: 'Window verb: D199 cl.1 needs one reading wherever built; (b) in T2.52 after its T2.36 trigger is no earlier than (a) here, later if lands=c2. Rec: (a).'}
          - {id: k3, text: 'Abandoned state: rec-4024 item 6 wants running/abandoned/terminal via as_of and an idle threshold; the contract has none, so a crashed session runs forever.'}
        open_questions:
          - {id: q1, text: 'Which consumer latency bound tests D199''s derived-read-too-costly falsifier? Per-verb Neon latency and catalog egress are unmeasured.'}
          - {id: q2, text: 'Is rec-4025''s harness the shadow re-derivation source for the failure_signal, or does the reader own a production raw-rows path?'}
