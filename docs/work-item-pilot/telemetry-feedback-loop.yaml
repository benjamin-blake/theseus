  - {work_item: pwi-telemetry-reader-verbs, criterion_id: c1, text: 'Verbs bind the append-only tables through an event-journal registry form with a server-decoded partition; the shared R4/R5 dedupe passes every vector on DuckLake, survivors compared by (event_id, parser_version), with conflicts.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_reader_verbs_ducklake.py -m integration -k dedupe_vectors}, status: open}
