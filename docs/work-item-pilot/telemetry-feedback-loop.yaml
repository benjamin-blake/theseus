# CD.45 pilot fixture (provisional_v0). NOT A ROADMAP: never read by /orient, preflight or a pick surface (Decision 108).
# Grain: Decision 197 clause 3. Register: clause 4 extension block. Keys, identity and columns stay clause 8's (T4.23 c13/c14).
# Evaluator: validate_work_item_pilot (scripts/checks/roadmap/). Schema, caps and sunset are frozen in code; this header repeats them.
fixture:
  id: telemetry-feedback-loop
  status: provisional_v0
  authority: CD.45
  grain: decision-197-clause-3
  item_count_cap: 12
  sunset:
    first_of: [{criterion_met: 'T4.23:c6'}, {review_on: '2027-01-31'}]
    outcome: lift rows into the store, or restructure (rehome or reshape) per the operator's review; never delete
  edges_disposition: pilot_only -- re-authored by the implementation merge on lift (Decision 197 clause 5), never lifted as-is
work_items:
  - id: pwi-friction-classifier
    kind: task
    title: 'Friction classifier: read-time rules mapping stored hook, gate and tool facts to rework and exception labels'
    extension:
      consideration_register:
        why: Decision 199 derives friction at read, and T3.4 back-validation, rec filing and T3.3 read its totals, yet no rule says which stored facts count; the literal formula miscounts.
        how: Versioned rules as data (exact signature or generic fallback, disposition, label, class) applied by session_friction_rollup over W1-2's deduped rows; one label per fact; repeat runs per turn and tool.
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: consecutive reviewed sessions whose every label the operator judged correct, comparator: '>=', threshold: 20}}
            - {from: sampled, to: spot_check, trigger: {metric: mislabels across the last 200 sampled labels, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with unmapped_failure_share <= 0.05 at one classifier_version, comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'friction totals move for a reason other than the friction named: a hook pass counted, a new hook or gate left unmapped, unrelated errors merged into one run', metric: 'unmapped_failure_share: non-info process_events labelled only by a generic rule, per classifier_version', source: session_friction_rollup response stamp; precision only from the c3 label review (q2)}
        verification: [c1, c2, c3]
        rollback: Revert the rules file to the previous classifier_version or drop the verb from the registry; nothing is stored, so every total re-derives on the next read.
        evidence:
          - {kind: file_line, ref: 'docs/contracts/telemetry_sessions.yaml:228'}
          - {kind: file_line, ref: 'src/turn_capture/observations.py:361'}
          - {kind: file_line, ref: 'src/turn_capture/observations.py:5'}
          - {kind: file_line, ref: 'docs/contracts/telemetry_observations.yaml:153'}
        settled:
          - {id: s1, text: 'Read-side rules only: facts are rec-4026''s producer rows (W1-1), verb and dedupe rec-4024''s (W1-2); rec-4032''s labels table waits for its own trigger.'}
          - {id: s2, text: 'The rules are one SQL over deduped facts passing 17/17 vectors: hook passes not counted, only a blocking hook absorbs a block, runs bound by turn and tool.'}
          - {id: s3, text: 'Of the five retired patterns only repeated-tool-failure, and scope-creep via a scope hook or gate, derive from stored facts; three need content (VP 3, VP 4).'}
        contested:
          - {id: k1, text: 'Rules home: (a) versioned rules file in the reader registry; (b) a DuckLake rules table; (c) inline CASE. The contract cites rec-4032''s later table. Rec (a).'}
          - {id: k2, text: 'Formula reads no severity, so hook passes count. Tool errors: 09-24 ruling says process_events, producer stores outcomes. (a) ratify producer, (b) align it.'}
          - {id: k3, text: 'Gate, pre-commit, suppression facts: (a) producer signatures in slice 3b; (b) read-side regex on tool_result (W1-1 P1); (c) drop. Rec (a).'}
        open_questions:
          - {id: q1, text: 'Is an interrupt friction? A human stop and the producer''s synthetic close for an unanswered tool_use share outcome interrupted; v12 counts neither.'}
          - {id: q2, text: 'Who supplies precision at read_all: an operator label sheet or rec-4025''s harness widened to real sessions? unmapped share measures coverage only.'}
          - {id: q3, text: 'Repeat key and threshold: name-only merges unrelated Bash errors (87% of calls here); a command hash needs a producer field; threshold 3 is unmeasured.'}
  - id: pwi-deliberation-capture
    kind: task
    title: 'Deliberation capture: read-time reasoning metrics and a visibility-vs-text drift check over model_call and thinking rows'
    extension:
      consideration_register:
        why: Deliberation is most of the output (64% of output tokens in one measured session) and the best RCA evidence, yet providers return it differently, capture can lose it silently, and nothing derives or checks it.
        how: A read verb over deduped model_call rows (reasoning_visibility, reasoning_tokens) and thinking-row presence giving per producer, parser_version and model counts, share inputs and drift; the same SQL runs as a T3.20 c3 DQ monitor.
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: reviewed sessions in a row per producer with >= 1 classified model_call and zero drift rows, comparator: '>=', threshold: 20}}
            - {from: sampled, to: spot_check, trigger: {metric: drift rows per producer in a full window of the last 200 sampled classified model_calls, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: days in a row per producer with deliberation_drift_share defined and <= 0.01 for every parser_version present, comparator: '>=', threshold: 30}}
        failure_signal: {signal: Stored visibility disagrees with stored text (full or summarized with no thinking row; a thinking row where none was declared) or is missing after cutover, metric: 'deliberation_drift_share: drifted/classified model_calls, undefined (never 0) if none; per producer, parser_version', source: session_deliberation_rollup response and the T3.20 c3 DQ monitor (alarm-not-gate)}
        verification: [c1, c2, c3]
        rollback: Drop the verb and the monitor; nothing is stored, so every metric re-derives on the next read. The producer fields stay wherever the 2a-1 plan and rec-4028 land them.
        evidence:
          - {kind: file_line, ref: 'src/turn_capture/observations.py:183'}
          - {kind: file_line, ref: 'src/turn_capture/transcripts.py:290'}
          - {kind: file_line, ref: 'docs/contracts/telemetry_observations.yaml:419'}
          - {kind: file_line, ref: 'docs/contracts/inference-provider.yaml:355'}
        settled:
          - {id: s1, text: 'Producer facts chosen 2026-09-29 (rec-4028) and merged for claude_code in 2a-1 (#1405, parser_version 2); the LiteLLM mapping stays with rec-4028.'}
          - {id: s2, text: 'Data plane only (D209 cl.2a): thinking text is agent transcript; the verb reads visibility, counts and transcript purpose, never content.'}
          - {id: s3, text: 'Writer owns row-local rules, incl. visibility NOT NULL once a producer classifies (D210 cl.1, cl.4); text drift spans two producers (cl.2(b)): a monitor. 16/16.'}
        contested:
          - {id: k1, text: 'Claude thinking text: CC stores empty signed blocks by default (0 text rows here). (a) counts only; (b) showThinkingSummaries repo-wide; (c) RCA only. Rec (a).'}
          - {id: k2, text: 'LiteLLM CoT lives only in the response and persona history: (a) replay from persona checkpoint (env R7); (b) non-replayable (env R8), loss counted. Rec (b).'}
          - {id: k3, text: 'Who reads CoT text: (a) metrics only, text kept for forensic reads; (b) a per-call text verb (egress per read); (c) LLM labels (spends). Rec (a).'}
        open_questions:
          - {id: q1, text: '2a-1 merged (#1405) but is deploy-inert: which slice 2a-2 release first stores model_call rows through the row-rule kernel for the verb to read?'}
          - {id: q2, text: 'Does deliberation predict outcome? 64% of output tokens here were thinking (54 of 83 calls); no outcome join exists, so T3.3 must not alarm on share.'}
          - {id: q3, text: 'A litellm-only persona tree has no sessions open row (env R8 bars it), so W1-2 session verbs cannot see it: does the executor loop emit lifecycle rows?'}
  - id: pwi-rec-filing-dedupe
    kind: task
    title: 'Rec filing with dedupe: one fingerprinted rec per finding, filed, updated or held against its chain and covering recs'
    extension:
      consideration_register:
        why: T3.3 files anomaly recs and T3.4 needs a filed rec whose telemetry delta proves the fix, yet nothing turns findings into recs; the repo dedupe keys on source or title and re-files, merges or auto-closes.
        how: 'One rec per sha256(salt, detector, subject) in context_v2_json, one source; one SQL: file, update, unchanged, regression, drop, covered, suppressed, unresolved, over_budget or hold; closes nothing (k4); budgeted.'
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: consecutive reviewed proposals the operator accepted unchanged, comparator: '>=', threshold: 20}}
            - {from: sampled, to: spot_check, trigger: {metric: rejected filings across the last 50 sampled filer recs, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with rejected_share <= 0.05 and no duplicate open fingerprint, comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'Queue noise or silent loss: a known issue re-filed, distinct findings merged, a declined or covered finding re-filed, or a recurring one never filed', metric: 'rejected_share (operator marks covered, duplicate or reject) per 30 days per detector, beside run liveness', source: operator verdicts; run record per-action counts; loop_liveness_stale cadence and success legs}
        verification: [c1, c2, c3]
        rollback: Stop the filer schedule; filed recs stay ordinary recs the operator can decline, close or mark covered; the decision is stateless, so a params revert re-derives on the next run.
        evidence:
          - {kind: file_line, ref: 'scripts/rec_episode.py:97'}
          - {kind: file_line, ref: 'scripts/rec_relevance.py:166'}
          - {kind: file_line, ref: 'docs/contracts/ci-rca-lifecycle.yaml:157'}
          - {kind: file_line, ref: 'scripts/ops_data_portal.py:315'}
        settled:
          - {id: s1, text: 'Identity is one rec per fingerprint in context_v2_json under one source, newest head (Decision 142); not an aggregate rec, not a source-only key (VP 1).'}
          - {id: s2, text: 'The decision is one SQL over the filer source plus one read per cover, passing 34/34 vectors over ten actions; every non-filing outcome is counted.'}
          - {id: s3, text: 'A malformed finding (NULL identity or window column) never files: it is recorded and the run exits non-zero; the SQL raises as last guard (v33).'}
        contested:
          - {id: k1, text: 'Cross-source link: (a) operator-set covered_by on the filer rec, followed one hop; (b) title Jaccard (VP 3 errs both ways); (c) LLM judge. Rec (a).'}
          - {id: k2, text: 'Declined head: (a) suppressed until the operator acts, sessions still counted; (b) snooze N days; (c) re-file on k-fold growth. Rec (a).'}
          - {id: k3, text: 'Queue over soft cap (1244 vs 250): (a) per-run budget only; (b) no new filing while over cap, never files today; (c) file as Low. Rec (a).'}
        open_questions:
          - {id: q1, text: 'What acceptance probe does a filer rec carry? file_rec needs a discriminating probe; the delta verb is back-validation''s and does not exist.'}
          - {id: q2, text: 'Where does a read_all covered_by verdict persist when nothing is filed: an operator sheet, or a rec filed straight into superseded?'}
          - {id: q3, text: 'Seeds min_sessions 3, min_events 5, window 7 days, budget 3 are unmeasured; no friction rows exist until W1-1 lands.'}
  - id: pwi-back-validation
    kind: task
    title: 'Back-validation: a telemetry verdict on the fix attempt proves or refutes a fix before a filer rec closes'
    extension:
      consideration_register:
        why: T3.4 ends at "telemetry delta proves fix", yet the only back-validation (ci_rca) reads recurrence without exposure, and a naive post-fix drop proves 44-79% of no-op fixes (VP 3).
        how: One SQL per pending rec over exposed sessions before and after the fix attempt returns a Decision 201 verdict (holds, fails, unmeasurable) or pending; the rule and windows are k4 (report).
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: consecutive verdicts the operator confirmed unchanged, comparator: '>=', threshold: 20}}
            - {from: sampled, to: spot_check, trigger: {metric: overturned verdicts across the last 50 sampled verdicts, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: 'false_proof_rate over the last 90 days, with at least 20 proof closes', comparator: <=, threshold: 0.05}}
        failure_signal: {signal: 'False proof or proof starvation: a fix closed on a holds verdict regresses, or verdicts stay unmeasurable so no filer rec ever closes on proof', metric: 'false_proof_rate (regressions within 28 days of a proof close / proof closes) beside unmeasurable_share, per 90 days', source: verdict records joined to the filer regression action (regression_of); per-reason verdict counts}
        verification: [c1, c2, c3]
        rollback: Stop the back-validation schedule; verdict records stay as history, pending recs stay open for a human close, and recs it closed are ordinary closed recs whose recurrence files a regression.
        evidence:
          - {kind: file_line, ref: 'scripts/ops_portal/closure_gate.py:330'}
          - {kind: file_line, ref: 'scripts/backlog_health/probe.py:130'}
          - {kind: file_line, ref: 'scripts/ci_rca/back_validation.py:107'}
          - {kind: decision, ref: '201'}
        settled:
          - {id: s1, text: 'Verdicts are Decision 201 holds, fails or unmeasurable in its record shape; update_rec already admits such a holds record (VP 1). Sha keying and timing are k1.'}
          - {id: s2, text: A naive post-fix drop proves 44-79% of no-op fixes (VP 3); any rule must hold alpha on exposed sessions with a post-fix sample fixed before it is read.}
        contested:
          - {id: k1, text: 'Late verdict keyed to the fix sha amends D201 under any option; plumbing: (a) Resolves trailer to a telemetry source, (b) own trailer, (c) manual. Rec (a).'}
          - {id: k2, text: 'Unmeasurable at the deadline: (a) stays open, listed; (b) close_proposed with reason and counts; (c) stale_no_recurrence close. Rec (b).'}
          - {id: k3, text: 'Confounds: (a) single-subject test, control ratio advisory; (b) difference-in-differences gate; (c) suspend across change windows. Rec (a) now.'}
        open_questions:
          - {id: q1, text: 'Who declares exposure? Each detector must return exposed and affected per session for a subject; no verb returns either today.'}
          - {id: q2, text: 'Effective day of a fix not live at merge (a Lambda behind a governed deploy, a model or harness change); sessions carry no commit (VP 4).'}
          - {id: q3, text: 'Seeds alpha 0.05, 50% drop, 10 expected, baseline and wait 28 days are unmeasured; under about 3% of exposed sessions is unprovable in 28 days.'}
  - id: pwi-maturity-ladder-controller
    kind: task
    title: 'Maturity ladder controller: a daily deterministic promote, hold, demote or restart per loop component'
    extension:
      consideration_register:
        why: 'The six W1 items declare 18 upward-only free-text triggers with no review rate (VP 1-2): promotion measures patience, and a blinder failure_signal promotes faster (VP 5).'
        how: One SQL per daily run over the review log, failure_signal series, drills and approvals returns promote, propose_promote, hold, demote or restart with a reason and the version held next; legs are k1-k3 (report k4, k5, k7).
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: 'controller decisions the operator re-derived unchanged since the last overturned one (return leg: k1)', comparator: '>=', threshold: 40}}
            - {from: sampled, to: spot_check, trigger: {metric: 1-in-5 sampled controller decisions re-derived unchanged since the last overturned one, comparator: '>=', threshold: 40}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with stale_rung_days 0 and est_escaped_share <= the AOQL target (q3), comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'A component sits at a rung its own evidence contradicts: wrong outputs escape above read_all, or a demote condition holds with no transition', metric: 'est_escaped_share: audited wrong share x unreviewed share, rolling 30 days, per component above read_all', source: 'review log (audited samples, unreviewed counts) and transition log (home: q2); stale_rung_days beside it'}
        verification: [c1, c2, c3]
        rollback: Stop the schedule and set every component to read_all; the transition log stays as history and review returns to 100% until a controller resumes. Failing safe means more review.
        evidence:
          - {kind: file_line, ref: 'scripts/checks/roadmap/_work_item_pilot_model.py:151'}
          - {kind: file_line, ref: 'scripts/checks/roadmap/_work_item_pilot_model.py:132'}
          - {kind: roadmap, ref: T3.4}
          - {kind: decision, ref: '55'}
        settled:
          - {id: s1, text: 'Rungs read_all, sampled, spot_check, anomaly_triggered in order (pilot model); the decision is deterministic code, never an LLM (charter: measurable triggers).'}
          - {id: s2, text: 'Measured: 18 of 18 declared triggers are upward-only free text and no item states a review rate, so none can be evaluated as written (VP 1-2).'}
          - {id: s3, text: 'Measured: with no return leg, escaped-wrong share tracks the error rate (0.11-0.13 at p=0.2) and a half-blind monitor promotes faster (VP 5). Facts only.'}
        contested:
          - {id: k1, text: 'Return leg on a wrong output found above read_all: (a) back to read_all (CSP-1); (b) one rung down; (c) none, as declared. Rec (a).'}
          - {id: k2, text: 'Version change: (a) restart at read_all, monotonic on an integer stamp; (b) one rung down; (c) keep the rung. #1396 and #1397 defer here. Rec (a).'}
          - {id: k3, text: 'Who moves a component: (a) operator approves promotions, demotions automatic; (b) both automatic; (c) operator ratifies both. Rec (a).'}
        open_questions:
          - {id: q1, text: 'Is this ladder T3.4''s A0-A3 executor autonomy gates, or a separate review ladder sharing one controller? Report reads separate.'}
          - {id: q2, text: 'Where the review log, transition log and current rung live; nothing reads a rung today (VP 1). Shares rec-filing q4.'}
          - {id: q3, text: 'Seeds unmeasured: AOQL target 2% (met only at recall >= drill floor), clearances 40/40/20, fractions 0.2/0.04/0.008, drill 20/20 days at 0.9; review capacity.'}
  - id: pwi-capture-producer-wiring
    kind: task
    title: 'Capture producer wiring: run record_turn from session hooks into the telemetry writer (rec-4026 slice 3b)'
    extension:
      consideration_register:
        why: record_turn is pure (no writer call, no cursor store), so no turn, tool, cost or friction row reaches the warehouse; every other feedback-loop component reads rows only this wiring produces.
        how: Stop and SessionStart catch-up hooks run one locked pass per root tree; SessionEnd finalizes with a root close row. Byte-chunked batches go data-first to the T2.36 writer verb, then the cursor is saved.
        planes: [data_plane]
        maturity:
          rung: read_all
          transitions:
            - {from: read_all, to: sampled, trigger: {metric: consecutive finalized sessions whose runner-side conformance check reports zero violations, comparator: '>=', threshold: 20}}
            - {from: sampled, to: spot_check, trigger: {metric: runner-side conformance violations across the last 30 sampled sessions, comparator: ==, threshold: 0}}
            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with unfinalized_session_share <= 0.05 over the q1 out-of-band session denominator, comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'turns never reach the warehouse because the session, or its latest resumed segment, is never finalized, so its last turn never closes (R1)', metric: 'unfinalized_session_share: root sessions whose latest lifecycle row is not close 24 h after their last event', source: telemetry_sessions via rec-4024 reader verbs; blind to a failing runner and to sessions lost before any turn closes (q1)}
        verification: [c1, c2, c3]
        rollback: Remove the capture hook entries from .claude/settings.json; written rows are append-only and stay, cursors hold positions only, so re-enabling resumes or re-sends identical rows as writer no-ops.
        evidence:
          - {kind: file_line, ref: 'src/turn_capture/record_turn.py:6'}
          - {kind: file_line, ref: 'docs/plans/PLAN-telemetry-turn-capture-core.yaml:640'}
          - {kind: file_line, ref: 'docs/contracts/project-id.yaml:47'}
          - {kind: file_line, ref: 'src/turn_capture/record_turn.py:149'}
        settled:
          - {id: s1, text: 'Producer side only: the telemetry writer verb, tables and project registration stay T2.36/rec-4024''s, a depends_on edge, not a pilot item.'}
          - {id: s2, text: 'Data plane only (D209 cl.2a): hook to writer Function URL to the operator-owned DuckLake; nothing crosses to a control plane.'}
          - {id: s3, text: 'Cursor saved after all chunks ack; the transcript is the replay source: no outbox (D84 I-4), no-op re-sends (D207). Needs R2 fixed (record_turn.py:149).'}
        contested:
          - {id: k1, text: 'Sync Stop hook vs detached pass: a pass is O(session), 8.8 s warm at 22k lines measured, but detaching loses the loud failure D84 I-4 wants.'}
          - {id: k2, text: 'Cursor home on ephemeral CC-web containers: a local file dies on reclaim, and re-reading project_ref from config breaks the pin rule.'}
        open_questions:
          - {id: q1, text: 'Failing runners and sessions lost before any turn closes land no rows: what out-of-band session denominator sees them?'}
          - {id: q2, text: 'Does SessionEnd fire on CC-web reclaim, and is a resumed transcript restored whole? Final-turn loss (R1) hinges on it.'}
          - {id: q3, text: 'billing_shape source for API-key sessions (rec-4147): the default mislabels unattended API-key runs as subscription.'}
work_item_criteria:
  - {work_item: pwi-friction-classifier, criterion_id: c1, text: 'session_friction_rollup applies the versioned rules over the shared R4/R5 dedupe on DuckLake and passes every report vector; responses carry per-label counts, unmapped count and classifier_version.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_friction_rollup_ducklake.py -m integration -k vectors}, status: open}
  - {work_item: pwi-friction-classifier, criterion_id: c2, text: 'Rules-file guard: a specific rule names one exact signature (no wildcard) of a registered hook script or check; generic labels count as unmapped; two rules never tie on one fact.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_friction_rules.py -k guard}, status: open}
  - {work_item: pwi-friction-classifier, criterion_id: c3, text: 'Before T3.4 back-validation or rec filing reads friction totals, the operator reviews every label of the first sessions at one classifier_version (read_all rung).', method: {kind: review, resolver: operator at the first friction-consumer review, evidence_requirement: 'label review sheet per session: labels, mislabels, unmapped_failure_share, classifier_version'}, status: open}
  - {work_item: pwi-deliberation-capture, criterion_id: c1, text: 'session_deliberation_rollup on DuckLake passes every report vector over the shared env R4/R5 dedupe, groups by producer, parser_version, model and visibility, and selects no content column; fails, never skips, without DuckLake.', method: {kind: execution, check: null, command: 'bin/venv-python -m pytest tests/telemetry/test_deliberation_rollup_ducklake.py::test_report_vectors tests/telemetry/test_deliberation_rollup_ducklake.py::test_selects_no_content'}, status: open}
  - {work_item: pwi-deliberation-capture, criterion_id: c2, text: 'A DQ monitor in the T3.20 c3 home flags each drift kind (text_missing, text_unexpected, visibility_missing), is silent on clean vectors, and reports verdict none on a legacy-only run; alarm, not gate.', method: {kind: execution, check: null, command: 'bin/venv-python -m pytest tests/telemetry/test_cot_drift.py::test_flags_each_drift_kind tests/telemetry/test_cot_drift.py::test_silent_on_clean tests/telemetry/test_cot_drift.py::test_none_on_legacy'}, status: open}
  - {work_item: pwi-deliberation-capture, criterion_id: c3, text: 'Before T3.3 or T3.4 reads deliberation metrics, the operator reviews every drift row of the first sessions at read_all and confirms each producer mapping present.', method: {kind: review, resolver: operator at the first deliberation-consumer review (T3.3 or T3.4), evidence_requirement: 'drift rows per session at read_all: kind, producer, parser_version and the verdict on each'}, status: open}
  - {work_item: pwi-rec-filing-dedupe, criterion_id: c1, text: The filer decision applies the versioned params over its own-source projection and passes every report vector on DuckDB; each run record carries per-action counts and params_version., method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_rec_filing_decision.py -k vectors}, status: open}
  - {work_item: pwi-rec-filing-dedupe, criterion_id: c2, text: 'Guard: at most one open filer rec per fingerprint; every filer rec carries detector_id, subject_key and fingerprint; the write-time backstop refuses a second open insert.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_rec_filing_guard.py -k one_open_per_fingerprint}, status: open}
  - {work_item: pwi-rec-filing-dedupe, criterion_id: c3, text: 'Before the filer files any rec, the operator reviews every proposal at read_all and records a verdict: file, covered_by a named rec, or reject.', method: {kind: review, resolver: operator at each read_all proposal review, evidence_requirement: 'proposal sheet per run: fingerprint, action, verdict, covering rec id, rejected_share'}, status: open}
  - {work_item: pwi-back-validation, criterion_id: c1, text: 'The verdict SQL applies the versioned params to one verb call per candidate and passes every report vector on DuckDB; each verdict record carries the counts, stop day, p and params_version.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_back_validation_verdict.py -k vectors}, status: open}
  - {work_item: pwi-back-validation, criterion_id: c2, text: 'Under the close path k1 picks, a holds verdict record moves a filer rec through update_rec with its closing sha from the recorded fix attempt; a pending rec stays open.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_back_validation_close.py -k fix_attempt_close}, status: open}
  - {work_item: pwi-back-validation, criterion_id: c3, text: 'At read_all the job closes nothing: the operator reviews every verdict, confirming or overturning each holds close and each fails, before any rec moves.', method: {kind: review, resolver: operator at each read_all verdict review, evidence_requirement: 'verdict sheet per run: rec, fix sha, verdict, reason, counts, p, operator decision'}, status: open}
  - {work_item: pwi-maturity-ladder-controller, criterion_id: c1, text: 'The controller SQL applies the versioned params over the build''s review, signal, drill and approval tables, passes every report vector on DuckDB including the returned to_version, and raises on each malformed input.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_maturity_ladder_controller.py -k vectors}, status: open}
  - {work_item: pwi-maturity-ladder-controller, criterion_id: c2, text: 'Seeded simulation via the controller over p 0.005-0.2, recall 1.0/0.9/0.5 and 3+ seeds: escaped-wrong share <= the AOQL target on every seed where recall meets the drill floor, the rest reported; no low-recall monitor tops beyond chance.', method: {kind: execution, check: null, command: bin/venv-python -m pytest tests/telemetry/test_maturity_ladder_controller.py -k simulation}, status: open}
  - {work_item: pwi-maturity-ladder-controller, criterion_id: c3, text: At read_all every promotion is a proposal the operator re-derives before the rung changes; demotions and restarts apply at once and are re-derived after the fact from the transition log., method: {kind: review, resolver: operator at each read_all ladder review, evidence_requirement: 'transition sheet per run: component, from, to, reason, clearance, signal, params_version, decision'}, status: open}
  - {work_item: pwi-capture-producer-wiring, criterion_id: c1, text: 'Stop, SessionStart catch-up and SessionEnd hooks run record_turn; batches go data-first, byte-chunked, cursor after all acks; SessionEnd waits for the lock and emits a per-finalization close row; SessionEnd timeout set; never exit 2.', method: {kind: execution, check: null, command: P="bin/venv-python -m pytest tests/turn_capture/test_capture_runner.py -qk";$P hooks&&$P data_first&&$P chunks&&$P ack_cursor&&$P close_row&&$P lock_wait&&$P no_exit_2&&$P end_timeout}, status: open}
  - {work_item: pwi-capture-producer-wiring, criterion_id: c2, text: 'Failed or killed passes replay as writer no-ops; a lost cursor re-derives pins or defers; at finalize a runner-side check proves incremental equals one full parse, resume-after-finalize included.', method: {kind: execution, check: null, command: P="bin/venv-python -m pytest tests/turn_capture/test_capture_runner.py -qk";$P replay_noop&&$P lost_cursor_pins&&$P resume_boundary_conformance}, status: open}
  - {work_item: pwi-capture-producer-wiring, criterion_id: c3, text: 'Smoke-first (T3.20 c8): one live-catalog turn lands through the writer boundary and the rec-4101 orphan monitor runs on it before the hooks are enabled broadly.', method: {kind: review, resolver: operator at the T3.20 c8 smoke gate, evidence_requirement: smoke invocation output plus a rec-4101 monitor run over the smoke rows}, status: open}
