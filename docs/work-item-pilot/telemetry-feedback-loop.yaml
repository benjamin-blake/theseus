            - {from: spot_check, to: anomaly_triggered, trigger: {metric: consecutive days with zero mismatches and zero conflicted grain keys reported, comparator: '>=', threshold: 30}}
        failure_signal: {signal: 'a verb returns a derived value (state, duration, roll-up) that differs from a re-derivation over the same raw rows, silently skewing every consumer', metric: 'verb_rederivation_mismatch_rate: sampled sessions whose verb output differs from the harness re-derivation', source: rec-4025 harness in shadow mode over sampled sessions (q3); CI dedupe vectors cover R4/R5}
