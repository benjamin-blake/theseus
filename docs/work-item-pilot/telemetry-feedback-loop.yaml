          - {id: s2, text: 'NamedRead needs an event-journal form: {tbl} binds an SCD2 current projection, which append-only tables lack (renders lake.None, VP 1).'}
          - {id: s3, text: 'Feasible: R4/R5 dedupe is one SQL statement passing 17/17 vectors (VP 2); a session_id alone yields its partition, 1 of 70 files read (VP 3).'}
