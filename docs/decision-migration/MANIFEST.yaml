# docs/decision-migration/MANIFEST.yaml
#
# Self-retiring registry for the CITATION-STRANDED superseded-Decision class (T2.56 migration
# step 7, finding CFG-10; rec-2822's deliverable). A citation-stranded entry is superseded
# (currency superseded_pointer or superseded_compacted) yet still cited by name outside the
# corpus, so it can neither archive (Decision 146) nor -- before Decision 175's migrate_then_rehome
# branch -- compact (Decision 149). This manifest inventories the class and Decision 37's specific
# citer disposition; it does not itself adjudicate eligibility for any entry it did not process.

manifest:
  id: DECISION-MIGRATION-MANIFEST
  version: 1
  governed_by: "Decision 175"
  produced_by: "docs/plans/PLAN-decision-37-migrate-then-rehome.yaml"
  purpose: >-
    Enumerate the citation-stranded class so a follow-on DECISIONS.md sweep session (blocked on
    rec-3246, the separate LIVE-entry-extraction capability) can consume this manifest as its
    enumeration substrate rather than re-deriving the class census and per-entry citation counts
    from scratch.
  authority: >-
    Canonical for the citation-stranded class census and for Decision 37's citer disposition
    (the only entry this plan processed). NOT an eligibility adjudication for any other entry
    listed below -- see each entry's `disposition` field.
  retires_when: >-
    Every entry below reaches disposition `processed` or `already_conforming` AND Decision 37's
    `citer_disposition` list carries no entry with action `pending`. At that point this manifest
    deletes itself; the durable record is DECISIONS.md / DECISIONS_ARCHIVE.md plus this file's own
    git history (not a re-authored summary elsewhere -- Agent-First Repository doctrine, AGENTS.md).

class_census:
  measured_at: "2026-08-24"
  source: docs/decisions-index.json
  note: >-
    Measured AFTER this plan's own compaction of Decision 37 -- superseded_pointer/
    superseded_compacted counts below reflect Decision 37 having moved from the former bucket to
    the latter. Re-derive from docs/decisions-index.json at any future read; never hand-copy this
    snapshot forward.
  live_entries: 126
  current: 93
  amended: 29
  superseded_pointer: 1 # Decision 80 only, post-compaction
  superseded_compacted: 3 # Decisions 37, 44, 58

citation_stranded_class:
  definition: >-
    A superseded entry (currency superseded_pointer or superseded_compacted) still cited by name
    in at least one live, non-historical file. Citer counts below use the SAME exclusion set as
    verification step 11: docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, docs/decisions-index.json,
    logs/, audits/, docs/plans/, docs/audit-prompts/.
  entries:
    - decision: 37
      currency: superseded_compacted
      superseded_by: 116
      live_citing_files: 17
      disposition: processed
      disposition_detail: >-
        Compacted via Decision 175's migrate_then_rehome branch -- the branch's first exercise.
        The two still-live DERIVED patterns (SECRET-VALUE-OUT-OF-BAND, RUNTIME-FETCH) rehomed to
        docs/contracts/secret-material-handling.yaml; its original subject (the scheduled-agent
        dispatcher/findings-processor Lambdas) is dead, retired per CD.21.
      citer_disposition:
        - file: terraform/personal/inference_credentials.tf
          action: repointed
          reason: "Comment-only citation repoint; description = \"...\" attributes untouched."
        - file: terraform/personal/prod_lambdas.tf
          action: repointed
          reason: "Comment-only citation repoint; description = \"...\" attribute untouched."
        - file: terraform/personal/neon_ducklake_catalog.tf
          action: repointed
          reason: "Comment-only citation repoint; description = \"...\" attributes untouched."
        - file: terraform/personal/oidc.tf
          action: repointed
          reason: "Comment-only citation repoint (two IAM-statement comments)."
        - file: terraform/bootstrap/github_ci_apply_reads.tf
          action: repointed
          reason: "Comment-only citation repoint."
        - file: scripts/ducklake_neon_smoke_test.py
          action: repointed
          reason: "Module docstring citation repoint (not Lambda-packaged)."
        - file: src/common/ducklake_runtime.py
          action: deferred
          reason: >-
            Lambda-packaged -- repointing would force a five-Lambda governed-CD deploy for a
            comment-only change, out of this V2-tier plan's scope. Owner: a future code-deploy PR.
        - file: src/lambdas/ducklake_catalog_dr/handler.py
          action: deferred
          reason: "Lambda-packaged, same reason as src/common/ducklake_runtime.py above."
        - file: src/lambdas/ducklake_catalog_dr/manifest.yaml
          action: deferred
          reason: "Lambda-packaged, same reason as src/common/ducklake_runtime.py above."
        - file: docs/ROADMAP-PLATFORM.yaml
          action: deferred
          reason: "Affects the data-pipeline artifact; roadmap prose edits are out of this plan's scope."
        - file: config/agent/data_quality/decisions/ops_decisions.yaml
          action: not_a_citation
          reason: >-
            A DQ allowed-values string literal quoting another entry's historical status text
            (line 68), not a reference to Decision 37 itself.
        - file: docs/SESSION_LOG_ARCHIVE.md
          action: historical
          reason: "Immutable change record; correctly left pointing at the number, which still resolves to a header."
    - decision: 80
      currency: superseded_pointer
      superseded_by: null
      live_citing_files: 36
      disposition: enumerated_only
      disposition_detail: >-
        ENUMERATION ONLY -- not adjudicated against compaction.eligibility_criterion by this plan.
        Decision 80's currency comes from an INBOUND Decision 104 title edge, not a victim-side
        '**Superseded by:**' marker. A future session decides eligibility; this row is not a claim
        that Decision 80 qualifies for any compaction branch.
    - decision: 44
      currency: superseded_compacted
      superseded_by: 117
      live_citing_files: 14
      disposition: already_conforming
      disposition_detail: "Pre-existing compacted stub -- Decision 149's own first exercised compaction."
    - decision: 58
      currency: superseded_compacted
      superseded_by: 76
      live_citing_files: 5
      disposition: already_conforming
      disposition_detail: "Pre-existing compacted stub."

adjacent_entries_out_of_class:
  note: >-
    Decisions 24 and 25 surfaced during this plan's citation-inventory scouting but are currency
    `current` (no supersession marker at all) -- NOT members of the citation-stranded class.
    Recorded here only so a future session does not re-scout them; this is enumeration, not an
    eligibility or class-membership claim.
  entries:
    - decision: 24
      currency: current
      live_citing_files: 1
      disposition: enumerated_only
    - decision: 25
      currency: current
      live_citing_files: 1
      disposition: enumerated_only
