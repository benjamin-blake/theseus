pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - On main's scrub.py, compute the corpus digest for test_write_time_matches_pre_library_digest BEFORE editing scrub.py (write the corpus module first).
  - Package (classes, profiles, engine, facade), .importlinter contract, boundary-test widening, data-pipeline exclude and its test.
  - scrub.py adapter; run VP step 1.
  - Corpus-driven tests for the engine and the pinned copies; run VP step 2.
  - Registry YAML, the two checks, manifest Entries, marker-grammar token, boundary_patterns, CODEOWNERS lines, check tests; run VP step 3.
  - Graduation shard for step 1.
  - Execute VP steps 4-6; on unrecoverable failure stop and RCA (Decision 55).
  - Open the PR; merge on code review PROCEED and green CI under the standing rule.
  - 'Report: what was implemented, verification results'
rollback: >-
  Revert the squash commit. Nothing is deployed; scrub.py returns to its inline regexes with identical output.
