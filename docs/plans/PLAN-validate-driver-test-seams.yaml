constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    This PR must not modify scripts/validate.py. Its value is being behaviour-neutral and
    independently revertible; a runtime change forfeits both.
  - >-
    TWO SEPARATE CONCERNS, and PR1 owns only the first. (a) SEQUENCE SELECTION -- which steps the
    driver iterates -- moves to the derived selector. (b) NEUTRALIZATION -- stopping a check body
    from executing -- still requires a hub patch while the facade binds names eagerly, and moves in
    PR2 with the dispatch swap. PR1's goal is therefore NOT "no hub patching": it is collapsing the
    blanket ~60-check loop into the handful of bounded, explicit patches each test declares.
  - >-
    DERIVE, DON'T DECLARE. The selector returns real Step objects from the live registry and raises
    on absence. Hand-authored Step literals are forbidden: a stale literal list confidently
    green-lights a tier that no longer exists.
  - >-
    A check NOT in the selected sequence never executes, so exclusion is itself neutralization. Any
    check a test DOES select must be explicitly patched by that test, or its real body runs -- this
    is what resurrected the documented ~78s TestGraduationGuard regression in an earlier draft.
  - >-
    The selector is a FACTORY callable inside a test body, not a class-level marker. A class-scoped
    fixture cannot exempt a single method, and parametrized cases need per-case sequences.
  - >-
    No test is carved out of migration. Derived Steps carry production pre_globs and tier order, so
    TestPreGlobsGateEndToEnd migrates like the rest; the earlier carve-out rested on a premise that
    was checked and found false.
  - >-
    TestPreModeRegistryIsolation KEEPS driving main() and KEEPS its validate_import_contracts
    banner assertion, but must SELECT that check and patch it rather than rely on scaffold-only
    exclusion. Verified: validate_import_contracts IS in pre_sequence(), so under a scaffold-only
    selection the banner cannot print regardless of neutralization -- the assertion would be true
    by exclusion and the graduated row pre-tier-registry-isolation-guard would survive in name
    while guarding nothing. Selecting and patching keeps it a real interception guard.
  - >-
    graduation-guard-pre-registry-neutralized is RETIRED, not rewritten: its premise (that the class
    needs blanket neutralization) is false once test_pre_mode_does_not_call_guard becomes a hermetic
    registry assertion and the other 8 tests call the guard directly.
  - >-
    The injection seam works because scripts/validate.py resolves registry.pre_sequence() /
    full_sequence() as call-time module attribute access (verified: :36 imports the module object;
    :339 and :573 are attribute lookups, no caching, no eager binding). Do not refactor those into
    eagerly-bound locals.
  - >-
    Check-name patches cannot move to defining modules in this PR. Verified empirically: while the
    facade binds eagerly, patching the defining module leaves validate.py's globals() holding the
    original object and the real check runs.
  - >-
    At-ceiling files: tests/validate/test_tiers.py (499/500, unregistered) and
    tests/test_plan_document.py (495/500, unregistered). Do not touch tests/test_checks_registry.py
    (643 = exactly its dec-159 budget); its reachability tests are PR2's to retire.
  - >-
    Residual hub consumers deliberately left for PR2 (they use `import scripts.validate` /
    `importlib.import_module`, not the `from ... import` form): test_validate_tier_floor.py:6,
    test_validate_data_model_standard.py:185, test_checks_registry_test_obligations.py:15,
    test_conformance_registration.py:30, test_checks_registry.py. This PR does not claim to have
    eliminated them.
  - Graduated node_ids inside migrated classes must be preserved verbatim -- a rename silently orphans a row.
