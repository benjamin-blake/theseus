    verification_step: 7
    test_selector: tests/validate/test_driver_seam.py::TestFixtureHoming::test_factory_is_package_scoped_and_not_autouse
    red_green_expectation: red before (file absent, so the package-conftest assertion fails), green after
  - source: tests/conftest.py
    behavior: >-
