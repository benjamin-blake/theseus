- 'WHY CAP-AND-DEFER CANNOT BOUND THIS SHAPE (the Decision 135 SPIRIT answer, mechanically checked 2026-09-03): scripts/checks/deps/affected_tests.py''s CAP = 35 bounds the TRANSITIVE-RESIDUE channel only -- the protected channels (direct importers, colocated mirrors, conftest subtrees) are ''protected regardless of forcing status'' by Decision 135''s own recall design, and they are what produce a 263-module selection. The defer path was already active on this plan''s own scope (capped True at n=105, the loud AFFECTED-SET CAP notice firing over 152 deferred residue modules) and still left 105 selected. Lowering the cap or extending it over the protected channels trades recall, which Decision 135''s strictly-additive posture forbids -- hence a bounded allowance that complements deferral rather than replacing it, with the selector byte-identical.'
