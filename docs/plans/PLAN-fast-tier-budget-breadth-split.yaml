phase: 'Fast-tier budget-gate remediation forced by PR #1049: a reviewed, fully-green, type-only refactor was blocked on wall clock alone with zero failed checks. No tier_item slice and no roadmap criterion is advanced; closes_criteria is absent by construction. Soft-warn exception category ad_hoc_rec, with rec-3507 named in bundled_recommendations so the squash-merge Resolves trailer closes it, and its own acceptance command asserted green by a verification step rather than assumed.'
scope:
- file: scripts/validate.py
  action: Modify
  purpose: 'Replace the single aggregate comparison inside _scaffold_budget_assertion with a call into the new scripts.checks.deps.selection_budget classifier and render its verdict. scripts/validate.py DEFINES NO NEW BUDGET NUMBER and restates none: selection_budget.py is the single home of NON_TEST_BUDGET_SECONDS = 240.0, TEST_BASE_SECONDS = 180.0, PER_MODULE_SECONDS = 2.0, CEILING_SECONDS = 1500.0, FLOOR_TOTAL_SECONDS = 420.0 and the mirrored derivation input REPLAY_ALLOWANCE_SECONDS = 150.0, and of the two phase NAMES it reports on (TEST_PHASE_NAME = ''pytest_diff'', REPLAY_PHASE_NAME = ''validate_vp_replay''), and validate.py''s two existing public constant names are BOUND to that module rather than carrying literals -- _FAST_TIER_BUDGET_SECONDS = selection_budget.FLOOR_TOTAL_SECONDS and _FORCED_FULL_SUITE_CEILING_SECONDS = selection_budget.CEILING_SECONDS -- so every existing `_validate._FAST_TIER_BUDGET_SECONDS` / `_validate._FORCED_FULL_SUITE_CEILING_SECONDS` reader keeps resolving. Import the module MODULE-STYLE (`from scripts.checks.deps import selection_budget`) beside _budget_recs, never `from ... import <CONSTANT>`, so no second CEILING-bearing name enters validate.py''s namespace; it defines no check and imports only stdlib, so --terraform-only is unaffected, and derive_affected_tests stays the existing function-scope import. The scaffold hands the raw phase_times dict and elapsed to selection_budget.split_phase_times and never names a phase key itself, getting back static_s (sum of phase_times excluding the test phase and the separately-REPORTED replay phase), test_s (phase_times[''pytest_diff''], 0.0 when absent), replay_s (phase_times[''validate_vp_replay''], 0.0 when absent, REPORTED not subtracted) and unattributed_s (elapsed minus the sum of ALL phase_times), from which non_test_s = elapsed - test_s = static_s + replay_s + unattributed_s -- the settled two-term subtraction, unchanged from round 1; it computes n_selected (len(changed_tests)), passes them plus the fail-closed derivation_ok (not _selection_fallback) and forced flags to the classifier, then dispatches on the returned outcome in the PINNED branch order. Every branch calls _record_budget_outcome with a distinct named outcome and with the classifier''s own limit_s, so the module-level _BUDGET_LIMIT_BY_OUTCOME map is RETIRED (its two forced rows are subsumed by the classifier record) and no arm returns silently (Decision 170). Order is load-bearing: the non-test assertion is evaluated BEFORE the --ignore-budget branch, so the escape hatch cannot waive it. The hard-fail diagnostics keep the existing ''ERROR: Fast tier exceeded budget'' headline verbatim on EVERY hard-fail arm and append which budget fired and its rendered limit, so no existing assertion on that string is rewritten; the non-test breach message additionally names static_s, replay_s (beside REPLAY_ALLOWANCE_SECONDS, so an operator can see at a glance whether a breach is replay-dominated and therefore a vp_replay problem rather than static drift), unattributed_s and the dominant non-test phase, so an unwaivable alarm is always attributable to a named component rather than to an opaque remainder. THAT non-test breach diagnostic is emitted through the ALREADY-IMPORTED _mirror_budget_notice_to_summary (scripts/validate.py:57; signature (title, message) -- it prints the message and appends a titled section to $GITHUB_STEP_SUMMARY) rather than through a bare print, so the arm mirrors to the CI step summary exactly as every other terminating budget arm already does: breach via _file_budget_breach_rec''s CI leg (scripts/checks/_budget_recs.py:200), bypass via _file_budget_bypass_rec''s (:288), forced_waived (scripts/validate.py:397) and forced_ceiling_breach (:407). This is Decision 153 point 3''s own doctrine for a deliberately rec-free arm (''the ceiling notice mirrors to the CI step summary instead''), and it keeps the most consequential new arm -- an unwaivable exit 1 with no escape of any kind -- from being the one non-within_budget outcome in the repo that leaves no CI artifact. No new import, helper or file: scripts/checks/_budget_recs.py stays byte-identical. Also print the breadth/prediction advisory line before the verdict, and mirror a loud, attributable notice naming n_selected, the governing allowance and the lowercase cause token `selection_breadth` on every breadth-governed pass (the same loudness Decision 153 point 1 requires of the forced waiver; that token is also what rec-3507''s own acceptance command greps this file for). No new argparse flag. THE REC-STREAM IS NOT REWIRED (coordinator pivot P4): _record_budget_outcome keeps calling build_budget_record with EXACTLY today''s keyword arguments and then merges selection_budget''s pure extra-keys record (n_selected, static_s, test_s, replay_s, unattributed_s, phase_count, waiver_cause) into the returned dict at this call site before write_manifest, so the seven new keys reach the artifact ci.yml already uploads WITHOUT touching scripts/checks/_budget_recs.py; and the two new outcomes call neither _file_budget_breach_rec nor _file_budget_bypass_rec, so the breach-rec stream keeps exactly today''s two producers and today''s two _REC_FILING_OUTCOMES rows. validate.py adds no phase-name literal of its own (the pre-existing scaffold_fns key ''pytest_diff'' is the scaffold registration table and is unedited).'
- file: scripts/checks/deps/selection_budget.py
  action: Create
  purpose: 'The single home of every budget constant, of the formula, and of its plan-time CLI. Pure, stdlib-only at module scope (no networkx, yaml, pydantic or boto3), so validate.py may import it eagerly. Public surface: NON_TEST_BUDGET_SECONDS = 240.0 / TEST_BASE_SECONDS = 180.0 / PER_MODULE_SECONDS = 2.0 / CEILING_SECONDS = 1500.0 / FLOOR_TOTAL_SECONDS = 420.0 constants, plus REPLAY_ALLOWANCE_SECONDS = 150.0 and the two reported phase names TEST_PHASE_NAME = ''pytest_diff'' / REPLAY_PHASE_NAME = ''validate_vp_replay''. REPLAY_ALLOWANCE_SECONDS is NOT a budget this gate asserts on, is never compared against elapsed and is never subtracted from it: it is a MIRROR of validate_vp_replay''s own ratified constants (MAX_AGGREGATE_SECONDS 120 + one PER_STEP_TIMEOUT_SECONDS 30 of final-step overshoot, since that guard trips only at the top of its loop) recorded here for exactly two reasons -- it is the largest in-tier allowance NON_TEST_BUDGET_SECONDS was derived to dominate (150 + 71.766 + 14.487 = 236.253 -> 240), and the breach diagnostic prints replay_s beside it so a replay-dominated non-test breach is self-identifying. It is pinned equal to its source by a test rather than imported, because importing scripts.checks.verification into a stdlib-pure module under scripts/checks/deps would trade this module''s purity (and validate.py''s eager import of it) for a coupling the pin test already covers; when either source constant moves, the pin reddens and NON_TEST_BUDGET_SECONDS is re-derived in the same edit. count_test_modules(root) -> the census of tests/**/test_*.py on disk (522 measured 2026-09-03), a stdlib rglob used as the SANITY FLOOR below; test_execution_allowance(n_selected, census=None) -> min(max(TEST_BASE_SECONDS, PER_MODULE_SECONDS * min(n_selected, census if census is not None else n_selected)), CEILING_SECONDS - NON_TEST_BUDGET_SECONDS), so an over-selecting or corrupted selector can never inflate its own allowance past what the repository could actually run, and the cap -- 1260s, written as the derived expression and never as a literal -- keeps the worst-case asserted TOTAL of both governed terms at exactly CEILING_SECONDS. The cap binds only above 630 selected modules, so at today''s 522-module census the census clamp binds first and the real worst case is 240 + 1044 = 1284s; split_phase_times(phase_times, elapsed) -> (static_s, test_s, replay_s, unattributed_s) with TEST_PHASE_NAME as the sole SUBTRACTED phase, REPLAY_PHASE_NAME broken out for REPORTING only (replay_s stays inside the non-test half it is measured in), and the unattributed remainder returned separately, never folded, so static_s + test_s + replay_s + unattributed_s == elapsed and non_test_s + test_s == elapsed both hold by construction; budget_extra_keys(...) -> the pure seven-key dict (n_selected, static_s, test_s, replay_s, unattributed_s, phase_count, waiver_cause) validate.py merges into build_budget_record''s output at its call site, so the manifest budget block carries the split WITHOUT scripts/checks/_budget_recs.py being edited (coordinator pivot P4); phase_count is the PRE-truncation phase count, load-bearing because _PHASE_TIMES_KEPT truncates the recorded phase_times to the 10 slowest and without it the recorded static_s cannot be re-derived from the same artifact; predict_ci_elapsed(n) -> (low, high) from the two measured pytest_diff slopes (1.2742 and 1.6996 s/module above a 98-module, 28.317s measured floor) plus the measured non-test half; and classify(non_test_s, static_s, test_s, replay_s, elapsed, n_selected, forced, derivation_ok, census) -> a frozen record carrying outcome, governing limit_s, waiver_cause and the exit disposition. The classifier''s BRANCH ORDER is fixed and pinned by test: (1) non_test_s > NON_TEST_BUDGET_SECONDS -> non_test_breach (exit 1, unwaivable, evaluated before any bypass); (2) caller-signalled bypass -> bypass; (3) forced and elapsed <= CEILING_SECONDS -> forced_waived (warn-and-pass); (4) forced and elapsed > CEILING_SECONDS -> forced_ceiling_breach (exit 1); (5) test_s > allowance -> breach (exit 1); (6) test_s > TEST_BASE_SECONDS -> breadth_waived (warn-and-pass, waiver_cause selection_breadth); (7) within_budget. derivation_ok False collapses the allowance to TEST_BASE_SECONDS. Naming does not match scripts/checks/<domain>/(validate|check)_<name>.py, so it registers no check and owes no companion rows. CLI (argparse, invoked as python -m scripts.checks.deps.selection_budget) accepts --paths PATH... or --plan PLAN.yaml (reading scope[].file), lazily imports derive_affected_tests inside main(), and prints n_selected, the allowance, the predicted CI range and the predicted outcome, plus a declare-or-split line; --json emits the same record. Exits 0 always -- it is a report, never a gate. The module docstring and the CLI --help carry the declare-or-split guidance verbatim: they are the uncapped auxiliary surface the config/prose_budgets.yaml header sanctions, which is why this plan needs no prose-budget raise (Decision 165).'
- file: tests/validate/test_budget_split.py
  action: Create
  purpose: 'New sibling mirror module for the split (the tests/validate/test_budget.py + test_budget_manifest.py precedent for one source). Three classes, all driving the REAL scripts/validate.py main() with a synthetic phase_times and a stubbed selection manifest -- never by running the tier. TestNonTestHalfBudget: a non-test half above 240s hard-exits 1 and the diagnostic names static_s, replay_s, unattributed_s and the dominant non-test phase; --ignore-budget does NOT escape it; a non-test half at exactly 240.0s passes; -- the case that closes the residual the aggregate used to cover -- a run whose 400s is ENTIRELY unattributed (no phase carries it) is a non_test_breach exit 1, not a silent pass, so unattributed time is never governed only by the 1500s ceiling; and the two cases the round-2 nesting finding and the round-4 domination fix jointly owe, both driving the real main(). test_green_replay_at_its_ratified_maximum_does_not_breach drives the same fixture twice: with a 149s validate_vp_replay phase beside a 71.8s static half (non-test half 220.8s, the exact shape that was jointly unsatisfiable against the retired 120s constant) it EXITS 0, and with a 260s replay phase -- which vp_replay''s own MAX_AGGREGATE_SECONDS guard has itself already hard-failed -- it exits 1, because replay time is inside the unwaivable half and no clamp exempts it. test_non_test_identity_holds_on_a_mixed_shape asserts the identity itself: non_test_s + test_s == elapsed and static_s + replay_s + unattributed_s == non_test_s exactly, read off the recorded budget block. Six cases in the class in total. TestBreadthDerivedTestBudget: the 263-module / 374.248s incident shape now exits 0; the same selection at the measured worst test half (308.747s) and at 454s both exit 0 while 600s exits 1; a test half between the 180s base and the breadth allowance emits the distinct breadth-waiver notice and passes; a run over the 1500s ceiling still hard-exits 1; a derivation-failure manifest (fallback True) collapses the allowance to the base and still hard-fails; and an n_selected inflated past the on-disk census does not raise the allowance. TestLocalPrediction: a local (CI unset) run prints n_selected, the CI-predicted range and the advisory label. Class-owned helpers only; no import from another test_* module (Decision 131).'
- file: tests/validate/test_budget.py
  action: Modify
  purpose: 'Repair exactly the assertions the split genuinely invalidates, and nothing else -- every existing case is PRESERVED (none deleted, none relaxed), with its exit code and its message text unchanged wherever the case still describes a reachable state (Decision 181 clause 3: an assertion weakened inside an in-scope test file is the dominant weakening form). Exact inventory, re-measured 2026-09-03: SIX tests patch time.monotonic with itertools.chain([0.0], repeat(400.0)) -- lines 40 and 60 (TestBudgetAssertion''s breach pair), 180, 202 and 225 (three of TestForcedFullSuiteWaiver''s FIVE tests) and 390 (TestIgnoreBudgetFlag::test_bypass_skips_budget_assertion) -- and TWO more drive the ceiling literals (lines 233 and 259, the remaining two TestForcedFullSuiteWaiver cases). All eight leave every phase at 0.0s, so under the split they describe a run whose whole elapsed is UNATTRIBUTED and would take the non_test_breach arm (400 > 240) rather than the arm each case names; give each a real dominating pytest_diff phase (the slow-step side_effect pattern test_breach_rec_receives_a_real_dominant_phase already uses at line 88) so the case each one names still exists: TestBudgetAssertion''s breach pair keeps exit 1 and the ''Fast tier exceeded budget'' text, TestForcedFullSuiteWaiver''s five tests keep Decision 153''s outcomes exactly (warn-and-pass under the ceiling, warn-and-pass AT the ceiling, hard-fail above it, hard-fail when not forced), and test_bypass_skips_budget_assertion keeps exit 0 for the reason it names -- --ignore-budget waives the TEST half, which is precisely the property the new TestNonTestHalfBudget::test_ignore_budget_does_not_escape_non_test_breach complements. Of TestIgnoreBudgetFlag''s FIVE cases, three run at elapsed 60.0 (lines 291, 310, 329) and one -- test_bypass_rec_receives_a_real_dominant_phase (line 348) -- already uses the 1000s slow-phase fake_monotonic pattern, so all four are untouched under the split (60.0 and a real dominating phase both leave the non-test half well under 240s) and only test_bypass_skips_budget_assertion (line 379/390) is re-shaped. TestIgnoreBudgetCIGuard::test_allows_ignore_budget_when_ci_not_set (line 439, elapsed 60.0) is untouched for the same reason. ONE FURTHER REPAIR THE ROUND-4 PIVOT OWES, stated rather than discovered at the full-tier step: test_budget_constant_is_300 (line 85/86) asserts _FAST_TIER_BUDGET_SECONDS == 300, and the floor total is now 420 (240 + 180), so the case is RENAMED to test_floor_total_constant_matches_the_declared_partition and its single equality is REPLACED BY A STRICTLY STRONGER one -- _FAST_TIER_BUDGET_SECONDS == selection_budget.FLOOR_TOTAL_SECONDS == NON_TEST_BUDGET_SECONDS + TEST_BASE_SECONDS == 420 -- so the case pins the new value AND the partition identity the old one never covered. It is re-pointed, never deleted and never loosened; the earlier draft''s claim that this test was untouched was true only while the floor total stayed at 300 and is corrected here. File measures 428 SLOC against the 500 limit; the repair is roughly net-neutral and all NEW cases land in test_budget_split.py so this file never approaches the limit (Decision 128 decompose-by-default).'
- file: tests/validate/test_budget_manifest.py
  action: Modify
  purpose: 'Same minimal repair on the budget-block-per-outcome suite (152 SLOC, ample headroom), plus the two new classes that own the manifest-side coverage the round-4 narrowing moved here from the dropped tests/checks/test__budget_recs_fields.py. _drive_pre gains an optional phase-shaping hook (a run_pytest_diff side_effect advancing the mocked clock) so a case can place its elapsed in a named phase. Exact inventory, re-measured 2026-09-03 -- FIVE cases drive an over-budget elapsed with an empty phase shape and change outcome under the split: test_breach_records_a_breach_outcome_before_exiting_1 (:100), test_bypass_records_a_bypass_outcome (:106, which would otherwise exit 1 on the unwaivable non-test arm), test_forced_waiver_records_forced_waived (:113), test_forced_ceiling_breach_records_its_own_outcome (:121) and test_phase_attribution_is_threaded_into_the_block (:133) each get the real dominating pytest phase, keeping every existing outcome, limit_s and exit-code assertion byte-identical. TestBudgetBlockWriteIsNeverLoadBearing::test_write_failure_leaves_a_breach_exiting_1 (:153) gets the same shaping so the Decision 55 loud-skip is still proven on the BREACH arm it names rather than incidentally on the non-test arm. Only one assertion changes: test_within_budget_run_records_a_within_budget_outcome''s limit_s moves from _FAST_TIER_BUDGET_SECONDS to the breadth-derived allowance the run was actually judged against. Two new cases pin the seventh and eighth outcome rows, non_test_breach and breadth_waived, so the manifest stays a complete per-branch census. NEW CLASS TestBudgetBlockCarriesTheSplit: the recorded block carries all seven new keys with their values (n_selected, static_s, test_s, replay_s, unattributed_s, phase_count, waiver_cause), every pre-existing key is unchanged in name and shape, phase_count reports the PRE-truncation count so static_s stays auditable against a 10-phase-truncated phase_times, and the merge is asserted to happen at validate.py''s call site -- build_budget_record is called with EXACTLY today''s keyword arguments (asserted on a spy), which is what keeps scripts/checks/_budget_recs.py byte-identical. NEW CLASS TestNewOutcomesFileNoRec: a non_test_breach and a breadth_waived run call neither _file_budget_breach_rec nor _file_budget_bypass_rec, and the recorded block''s rec_filed/rec_skipped_reason pair is (False, ''no_rec_for_outcome'') for both -- the mechanical proof that the round-4 narrowing holds and that the retired ''limit 5m'' wording is never emitted by a new arm.'
- file: tests/validate/test_selection_fallback.py
  action: Modify
  purpose: 'The THIRD module encoding the retired aggregate, missed by the earlier draft''s scope list and reddening only at the full-tier step where an out-of-scope fix is forbidden. Two of its four cases -- test_budget_breach_context_names_the_fallback (:91) and test_healthy_budget_breach_has_no_fallback_note (:101) -- drive main() at elapsed 400.0 through pre_sequence_stub(checks=()) with every phase at 0.0, so their breach is entirely unattributed time and would take the non_test_breach arm (400 > 240) rather than the degraded-selection breach arm the module''s docstring is about. Thread the same phase-shaping hook into _run_pre and give both cases a real dominating pytest_diff phase, so each keeps its exit code, its ''Fast tier exceeded budget'' assertion and its presence/absence assertion on the ''affected-set derivation fell back'' note byte-identical, while now proving what the module''s docstring actually claims: that a breach DIAGNOSED OFF PHASE TIMINGS names the degraded selection. The degraded-selection note must be emitted on every hard-fail arm of the split (it is context, not a verdict), which is what keeps :101''s negative assertion honest. The two 60.0s cases are untouched.'
- file: tests/checks/deps/test_selection_budget.py
  action: Create
  purpose: 'Decision 131 mirror for the new module. Pure-function tests over the formula (base below the crossover, per-module above it, the 1260s cap as the derived CEILING_SECONDS - NON_TEST_BUDGET_SECONDS expression, the exact 90-module crossover, the 630-module point at which the cap starts to bind, and the census sanity floor: an n_selected above count_test_modules does not raise the allowance), split_phase_times (pytest_diff subtracted; validate_vp_replay broken out for reporting but LEFT INSIDE the non-test half; unattributed computed, never silently folded into static; either named phase absent yields 0.0; the identities static_s + test_s + replay_s + unattributed_s == elapsed and non_test_s + test_s == elapsed on a mixed shape), budget_extra_keys (the seven-key dict, with phase_count taken pre-truncation), predict_ci_elapsed (the measured 98-module floor and the two measured pytest_diff slopes), and classify -- including an explicit branch-ORDER suite asserting that a forced run at exactly 1500s with a small selection reaches forced_waived rather than within_budget or non_test_breach, that a non-test breach outranks bypass, and that the fail-closed derivation_ok=False leg collapses the allowance. CLI tests drive main() with argv, patching derive_affected_tests so no graph walk runs, asserting the printed n_selected, allowance, prediction and declare-or-split line, the --json shape, --plan scope-row reading, and exit 0 on every path. Two guards, both cheap and both load-bearing. (a) DOMINATION PIN (the round-4 replacement for the withdrawn clamp): REPLAY_ALLOWANCE_SECONDS == validate_vp_replay.MAX_AGGREGATE_SECONDS + validate_vp_replay.PER_STEP_TIMEOUT_SECONDS, imported from the check module INSIDE the test, AND NON_TEST_BUDGET_SECONDS > REPLAY_ALLOWANCE_SECONDS by more than the worst measured non-test half -- so a future change to either ratified constant reddens here with a message naming the non-test re-derivation rather than silently re-nesting a sanctioned-green allowance inside a budget that cannot hold it. (b) PHASE-NAME PIN: TEST_PHASE_NAME and REPLAY_PHASE_NAME are both real step names in registry.pre_sequence(), so a rename cannot silently turn the subtraction into a 0.0 or drop replay_s out of the recorded series. Also pinned: the composite identity NON_TEST_BUDGET_SECONDS + cap == CEILING_SECONDS.'
