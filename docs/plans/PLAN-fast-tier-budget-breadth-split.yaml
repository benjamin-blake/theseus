 aggregate -- rising with breadth to a maximum asserted total of 1500s across the two governed terms, the existing derived ceiling); re-adjudicate Decision 153 reversal condition (d) now that the ceiling governs every run; publish a per-surface enforcement-coverage declaration for both budgets plus its named unenforced residuals (Decision 181 clause 2) -- the 3.34x non-test drift blind spot measured below, the un-extended downstream sensor (budget_ingest.INGESTED_OUTCOMES has no non_test_breach row yet), and the deliberately unedited breach-rec wording -- and NOT an unattributed remainder, because unattributed time is inside the governed non-test half by construction; state why Decision 135''s cap-and-defer path cannot bound this shape; DEFINE the non-test half by subtraction (elapsed minus the pytest_diff phase) rather than summation, and state that it CONTAINS validate_vp_replay''s phase rather than exempting it -- the budget is set to DOMINATE that check''s own ratified 150s green maximum (120 aggregate + one 30s per-step timeout) rather than to subtract it, which is why the constant moved from 120 to 240 and why the floor total is a correction rather than a raise; state that ''unwaivable'' removes the LOCAL --ignore-budget escape only, because validate.py already hard-rejects that flag when CI=true, so CI enforcement is unchanged; enumerate the three currently-green shapes the split deliberately makes hard-fail (a non-test half above 240s inside a sub-420s run; a run with no recorded pytest_diff phase, whose whole elapsed lands in the unwaivable half; and a forced full-suite run whose non-test half exceeds 240s, which loses Decision 153 point 1''s waiver because branch 1 outranks branch 3) together with what does NOT newly fail (all three measured CI runs, at 51.014 / 65.501 / 71.766s of non-test half); state plainly that the mandate''s calibration criterion (ii) is not literally met -- the largest single --pre check measures 7.448s of a 49.422s all-check total,