- 'The subtraction set is closed under a stated criterion and pinned mechanically, so neither the round-2 nesting defect nor a silent re-nesting can return: EXACTLY ONE phase is subtracted from elapsed -- pytest_diff, governed by the breadth allowance -- and every other phase, validate_vp_replay''s included, stays inside the unwaivable non-test half. The collision is closed by DOMINATION rather than by exemption: a sweep of all 112 --pre sequence steps for an in-tier wall-clock allowance (MAX_*_SECONDS / *_TIMEOUT_SECONDS-shaped constants, time.monotonic budgets and subprocess timeout= arguments) returns validate_vp_replay ALONE at a 150s green maximum (coverage_baseline.py''s timeout=300 is in measure_and_check, which the --pre verifier_coverage_report scaffold never calls; validate_ghas_probe''s urlopen timeout=15 is not in pre_sequence; pytest''s --timeout 60 is a per-test timeout inside the pytest_diff phase), and NON_TEST_BUDGET_SECONDS exceeds it by 90s, more than the 71.766s worst measured non-test half. non_test_s + test_s == elapsed and static_s + replay_s + unattributed_s == non_test_s are asserted on a mixed-shape run; REPLAY_ALLOWANCE_SECONDS == validate_vp_replay.MAX_AGGREGATE_SECONDS + validate_vp_replay.PER_STEP_TIMEOUT_SECONDS is pinned by a test that imports the source constants, together with NON_TEST_BUDGET_SECONDS > REPLAY_ALLOWANCE_SECONDS + the worst measured non-test half; and TEST_PHASE_NAME / REPLAY_PHASE_NAME are asserted to be real registry.pre_sequence() step names so a rename reddens instead of turning the subtraction into a silent 0.0 or dropping replay_s out of the recorded series.'
- 'The shapes the split newly hard-fails are enumerated, intentional and each pinned by its own named test rather than discovered in CI -- (a) a non-test half above 240s while total elapsed stays under the 420s floor total, (b) a run with no recorded pytest_diff phase, whose whole elapsed lands in the unwaivable half (fail-closed by design: an unattributed run is not evidence of a fast tier), and (c) a forced full-suite run whose non-test half exceeds 240s, which loses Decision 153 point 1''s waiver because branch 1 outranks branch 3 -- while the shapes that must NOT newly fail are asserted green in the same suite: all three measured CI runs (non-test halves 51.014 / 65.501 / 71.766s), the 60.0s-elapsed cases of TestIgnoreBudgetFlag and TestIgnoreBudgetCIGuard, and a run whose validate_vp_replay phase is at that check''s own ratified green maximum beside the worst measured static half.'
