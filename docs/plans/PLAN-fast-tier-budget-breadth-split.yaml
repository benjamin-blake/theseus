ry must contain NO ''amends Decision N'' / ''Amends Decision N'' / ''supersedes Decision N'' / ''Supersedes Decision N'' / ''partially supersedes Decision N'' textual phrase for ANY OTHER number -- 73 above all -- since for a number the envelope does NOT declare, _EDGE_RE mints a genuinely new edge that would owe a second waiver row this plan does not scope; write ''narrows what Decision 73 point 1 enforces'' and the like instead. The set of numbers _EDGE_RE matches anywhere in the entry must equal exactly {153}, which is both the heading parenthetical''s number and the envelope''s, and (182, 153) must remain the entry''s only edge. The entry must stay at or under the 6,144-byte per-entry cap validate_decisions_size hard-fails new entries on (Decision 181, the house-style template, measures 5,527 bytes -- 617 bytes of headroom, which is why the compression ladder in the constraints is not optional).'
