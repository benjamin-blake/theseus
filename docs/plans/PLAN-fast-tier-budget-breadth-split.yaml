constraints:
- 'EXACTLY ONE new Decision entry (182). Do not amend, retire, renumber or reformat any other entry, and do not touch docs/DECISIONS_ARCHIVE.md under any circumstance. Neither Decision 153''s nor Decision 73''s body is edited -- the amendment is stated inside Decision 182 and its ONE edge (182->153) is waived in config/decision_supersession_waivers.yaml, the same amend-only convention Decision 153 itself applied to Decision 73 (that file''s line 129). Decision 182''s heading DOES carry the house-style ''(amends Decision 153)'' parenthetical: extract_supersession_edges dedups to a SET of (superseder, victim, file) triples, so the heading phrase and the envelope''s amends: [153] are the SAME edge and still owe exactly the one waiver row -- proven on a two-entry fixture at planning time, and the reason the earlier blanket ban on the phrase was a false-premise house-style deviation. Decision 73 is amended by NOBODY here: it is cited and its enforcement re-read in prose, with no envelope entry and no textual edge phrase.'
- 'config/decision_supersession_waivers.yaml gains EXACTLY ONE row -- (182, 153) -- and nothing else: no existing row is edited, reordered or removed, and live_archive_pair_allowlist is untouched. A waiver is the ONLY sanctioned discharge here: annotating a victim would edit a live body Decision 177 locks, and dropping the envelope''s `amends:` list to dodge the guard would trade machine-readability for silence. The phrase rule is scoped to what is mechanically true, not applied blanket. For 153 -- the number the envelope already declares -- the house-style heading parenthetical ''(amends Decision 153)'' is REQUIRED, because extract_supersession_edges returns a deduped SET of (superseder, victim, file) triples and therefore collapses the heading phrase and the envelope entry into the single (182, 153) edge this one row discharges (mechanically proven at planning time on a two-entry fixture: the enumerated edge set was [(153, 73, ''docs/DECISIONS.md''), (182, 153, ''docs/DECISIONS.md'')] -- one edge from 182, not two). For every OTHER number -- 73 above all -- Decision 182 must NOT write ''amends Decision N'' / ''supersedes Decision N'' / ''partially supersedes Decision N'' anywhere, heading or body, because _EDGE_RE would there mint a genuinely NEW edge that the envelope does not declare and that would need a second waiver row, which is out of bounds by this constraint. If the entry needs to talk about 73, it says ''narrows what Decision 73 point 1 enforces''. Verification step 9 asserts the invariant directly: the set of numbers _EDGE_RE matches in the entry equals exactly {153}.'
- Do NOT edit AGENTS.md. The Temporary Operational Constraints section, the two-tier presubmit table and the merge protocol all stay byte-identical; Decision 182 is the only place this change is recorded in prose.
- Do NOT edit .claude/skills/planning/SKILL.md or config/prose_budgets.yaml AT ALL (Decision 165 pivot). The skill measures 55716 bytes against a 55792-byte, ratchet-down-only budget seeded at zero headroom, and Decision 128's decompose valve is inapplicable by the registry's own header; this plan therefore takes no raise and mints no marker. The declare-or-split guidance lives in the CLI's uncapped --help and module docstring, and the /plan wiring is deferred. Decision 182 still records the intent that whoever lifts Decision 67 replaces the file-count proxy with the measured breadth number rather than restoring it.
- Do NOT edit scripts/checks/deps/affected_tests.py. The breadth cause is derived from len(selected) at the call site; full_suite_forced, _empty_manifest's False default and the Decision 55 fallback leg all stay byte-identical, which is what keeps Decision 153 point 2's fail-closed read intact.
- 'No new ceiling constant. The breadth allowance is capped by the DERIVED expression CEILING_SECONDS - NON_TEST_BUDGET_SECONDS (1260s) and total elapsed stays bounded by the EXISTING 1500s ceiling on every run, whose value and derivation from the pr-validate job timeout are unchanged and whose comment moves with it into selection_budget.py -- so the worst-case asserted TOTAL across the two governed terms is exactly 1500s. REPLAY_ALLOWANCE_SECONDS is neither a ceiling nor a budget this gate asserts on nor a term in the cap: it is a pinned mirror of validate_vp_replay''s own ratified MAX_AGGREGATE_SECONDS + PER_STEP_TIMEOUT_SECONDS, recorded because NON_TEST_BUDGET_SECONDS was derived to DOMINATE it and because the breach diagnostic prints replay_s beside it. .github/workflows/ci.yml is not edited and no credential surface is added.'
- 'No new tier, no new invocation flag, no new registered check and no new scaffold step: scripts/checks/registry.py, scripts/checks/deps/_manifest.py, config/ci_rca_taxonomy.yaml and the frozen --pre scaffold sequence are byte-identical, and validate.py''s argparse surface gains nothing. This preserves Decision 60/73''s two named surfaces and Decision 153''s not-a-tier adjudication.'
- 'The non-test budget is unwaivable with no escape of any kind, including --ignore-budget, and it is asserted BY SUBTRACTION on the whole remaining half -- elapsed - phase_times[''pytest_diff''] -- never on the sum of named phases alone: that is what keeps unattributed time governed at 240s instead of only at 1500s. EXACTLY ONE phase is ever subtracted (pytest_diff, governed by the breadth allowance); every other phase stays inside the unwaivable half, validate_vp_replay''s included. Its collision with that check''s own ratified allowance is closed by DOMINATION, not by exemption: NON_TEST_BUDGET_SECONDS = 240 exceeds the 150s green maximum of the only in-tier allowance the 112-step --pre sweep finds, by more than the worst measured non-test half. Do not reintroduce a clamp or a second subtracted phase, do not narrow the assertion back to sum(named static phases), and do not add a flag, an environment variable, a manifest field or a forced-scope path that waives any of it. If a future check gains its own in-tier wall-clock allowance, the sanctioned response is to re-run the sweep and raise NON_TEST_BUDGET_SECONDS by amendment (re-deriving the cap as CEILING - NON_TEST in the same edit), never to subtract the new phase out. If it fires spuriously in practice, the remedy is a re-derivation from the recorded static_s / replay_s / unattributed_s / phase_count series by amendment, never a bypass. The arm is rec-free BY DESIGN (pivot P4 keeps _REC_FILING_OUTCOMES at its two rows) and therefore owes the OTHER channel: it MUST call _mirror_budget_notice_to_summary so its diagnostic lands in GITHUB_STEP_SUMMARY as a titled section, matching breach (scripts/checks/_budget_recs.py:200), bypass (:288), forced_waived (scripts/validate.py:397) and forced_ceiling_breach (:407). Do not let an unwaivable exit 1 become the only non-within_budget arm in the repo with no CI artifact, and do not discharge the obligation with a bare print.'
- 'The formula and every budget constant the fast-tier gate asserts on have exactly ONE home, enforced by IMPORT and checked grep-shaped (verification step 12), not by prose discipline. Do not write a budget literal or an allowance expression into scripts/validate.py, the tests or the planning skill -- import them from scripts/checks/deps/selection_budget.py. The grep-shaped assertion of verification step 12 covers 120, 150, 180, 240, 300, 420, 1230, 1260, 1380 and 1500 anywhere in validate.py including comments (measured on the pre-change tree: exactly three lines match -- 69, 75 and the comment at 78 -- so the wider round-4 pattern introduces no new pre-change match and the assertion stays achievable). The two reported PHASE NAMES have the same single home; validate.py never spells either of them (its pre-existing scaffold_fns key ''pytest_diff'' is the scaffold registration table, unedited and unrelated). validate.py keeps its two existing public constant NAMES (_FAST_TIER_BUDGET_SECONDS, _FORCED_FULL_SUITE_CEILING_SECONDS) bound to that module''s FLOOR_TOTAL_SECONDS and CEILING_SECONDS; use a module-style import so no second CEILING-bearing name enters validate.py''s namespace. The rule''s boundary is stated rather than overclaimed: scripts/ci_rca/tier_map.py already keeps an independent `_FAST_TIER_BUDGET_SECONDS = 300` literal for its promotion-headroom advice; it is OUT of scope here and, because the floor total is now 420, it is stale as of this change -- named in constraint 17''s closure recommendations rather than edited under this plan''s boundary.'
