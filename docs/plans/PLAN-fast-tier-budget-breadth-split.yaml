d spot vs the worst measured half = %.3fx'' % (tf,A-tf,S,(A-tf)-S,S/qmax)); print(''  why 300 could not stay: a fully GREEN narrow run at the replay maximum already costs R + worst non-test remainder + floor test half = %.0f + %.3f + %.3f = %.3f, i.e. %.3fs from a hard fail with nothing wrong'' % (R,qmax,tf,R+qmax+tf,A-(R+qmax+tf))); print(''FLOOR TOTAL: S+B = %.0f+%.0f = %.0f, which EXCEEDS the retired %.0fs aggregate by %.0fs -- a correction to a nondeterministic aggregate, stated numerically in Decision 182, not a raise; crossover n = B/K = %.0f'' % (S,B,S+B,A,S+B-A,B/K)); print(''TWO-TERM bound: test cap T = C-S = %.0f, worst-case ASSERTED total S+T = %.0f == the existing derived ceiling %.0f'' % (T,S+T,C)); print(''cap reachability: T/K = %.0f selected modules, above the on-disk census 522, so the census clamp binds first today (worst asserted total = %.0f)'' % (T/K,S+allow(522))); print(''(i) breach n=263 allowance=%.0fs vs measured test half %.3fs -> headroom %.3fs = %.2fx the same-commit test spread'' % (allow(na),ta,allow(na)-ta,(allow(na)-ta)/sp)); print(''(ii) floor n=98 allowance=%.0fs vs measured test half %.3fs -> %.2fx headroom'' % (allow(nf),tf,allow(nf)/tf)); print(''(iii) full suite n=522 allowance=%.0fs < test cap %.0fs'' % (allow(522),T)); raise SystemExit(0 if (S>floor_S and S>R and (S-R)>qmax and (S-R-qmax)>qsp and S<(A-tf) and S+T==C and T==C-S and S+B>A and K>hi+sp/na and allow(na)>ta and allow(nf)>tf and allow(522)<T and T/K>522) else 1)"'
