rollback: 'Single squash commit, and -- unlike a shrink-only registry change -- this one IS revertible, which the plan states rather than assuming either way. Pre-merge everything is undone by dropping the branch. Post-merge, `git revert` of the squash restores the aggregate 300s assertion, deletes the new module and the two new test modules, restores the three repaired test modules, removes the Decision 182 entry AND the single config/decision_supersession_waivers.yaml row together (they must revert as a pair -- a row without the entry is only a stale-waiver WARN, but an entry without the row is a hard --pre FAIL, so a partial revert must drop the entry first) -- and because the Decision 165 pivot leaves config/prose_budgets.yaml and .claude/skills/planning/SKILL.md untouched, and the round-4 narrowing leaves scripts/checks/_budget_recs.py untouched, the revert has no prose budget and no rec-stream change to restore at all; no ratchet, roster or shrink-only registry is touched anywhere in this diff, so no clause fires on the way back. The two things the revert does not undo: docs/decisions-index.json must be regenerated again on the revert branch (`bin/venv-python -m scripts.decisions_index --write` is the whole fix), and the decision NUMBER 182 stays consumed -- a reversal of this ruling is a new numbered entry that supersedes it, never a deletion of this one (Decision 84 numbering authority, Decision 146 archival policy). Note that reverting restores an aggregate that is itself jointly unsatisfiable with validate_vp_replay''s ratified 150s green maximum on a narrow run (150 + 71.766 + 28.317 = 250.083 of 300), so a revert buys determinism only until the replay phase grows. Partial rollbacks worth naming, in increasing order of risk: (a) revert only the test-half cap (CEILING - NON_TEST), keeping the two budgets -- NOT endorsed: without it the asserted total is unbounded above by construction; (b) revert only the budget-block fields, keeping the gate change -- safe but self-defeating, since the recorded static_s / replay_s / unattributed_s / phase_count series is the only thing that lets the 240s non-test budget be re-derived from a growing population instead of from three artifacts that expire on 2026-09-17; (c) narrow the unwaivable assertion back to sum(named static phases) while keeping the breadth half -- NOT endorsed, it re-opens the unattributed region to the 1500s ceiling; (d) revert only the non-test half while keeping the breadth half -- NOT endorsed, it removes the drift teeth and keeps the loosening, which is precisely the weakening this Decision is careful not to be; (e) lower NON_TEST_BUDGET_SECONDS back toward 120 while keeping everything else -- NOT endorsed and the most dangerous of the five, because it restores exactly the round-2 blocking defect (validate_vp_replay''s ratified 120s aggregate, and its ~150s green maximum, nested inside a budget that cannot hold it, with no escape of any kind), making the two gates jointly unsatisfiable at the sanctioned limit of the inner one; if the non-test budget must come down, the replay allowance must come down with it in the same commit, which is a different Decision, not a revert. If the non-test budget proves mis-derived in practice, the sanctioned response is a re-derivation by amendment against the recorded series, never a bypass flag and never a silent raise -- and if either DESIGN-LEVEL reversal condition in Decision 182 fires (a breadth_waived majority, or two quarters of silence while the recorded non-test half grows), the sanctioned response is a new Decision that retires or re-founds the split, not another coefficient re-derivation.'
