- 'DECISION 170 (second output channel): the split adds arms to a scaffold, so every arm declares a NAMED outcome through the existing _record_budget_outcome path -- non_test_breach, bypass, forced_waived, forced_ceiling_breach, breach, breadth_waived, within_budget (the pinned branch order). No registry.outcome_scope is opened and registry.py stays byte-identical (Decision 135 point 7 / Decision 169), so the accounting ratchet and FROZEN_PRE_SCAFFOLDS are untouched; Decision 169 point 1 explicitly RETAINS the budget assertion in scripts/validate.py, which is why editing that file here is sanctioned rather than a facade regression. _REC_FILING_OUTCOMES is NOT extended (coordinator pivot P4): a named outcome is an observability contract, and the two new outcomes discharge it through the manifest budget block, which already carries the per-outcome census and the true limit_s -- filing a rec is a separate, out-of-scope channel whose text hardcodes a limit this change retires.'
- 'COORDINATOR DIRECTION LEDGER (D1-D7, applied 2026-09-03). D1 SUBTRACTION NOT SUMMATION: the unwaivable half is asserted on non_test_s = elapsed - phase_times[''pytest_diff''] (round 2 briefly extended it to subtract min(phase_times[''validate_vp_replay''], REPLAY_ALLOWANCE_SECONDS) as well; coordinator pivot P1 WITHDREW that second term in round 4 and returned to the settled one-term subtraction, closing the same collision by raising the outer budget to DOMINATE the inner allowance instead of exempting a phase from it), so the governed terms sum to elapsed BY CONSTRUCTION -- applied in scope rows 1-2, acceptance 1/4/8, constraint 7, VP step 2''s fully-unattributed case and CTX9; the 372s-elapsed / all-phases-0.0 fixture can no longer exit 0, and the double-counting objection dissolves because each half is now a measurement of the quantity it asserts on. D2 RE-DERIVE FROM CI PER PHASE: applied, and carried further than directed -- instead of reconstructing windows from job-log timestamps, all three runs'' uploaded selection-manifest artifacts were read directly (they carry the tier''s OWN recorded phase_times), which REFUTES the ~141s static estimate the critique took from log timestamps: pytest_diff starts about 14s into the run and the ~90s ''pre-pytest window'' sat INSIDE it as collection, so run 33790809988''s measured non-test half is 65.501s, not ~141s, and a 120s budget would not have failed the runs that passed. No local wall-clock figure is used to derive anything. D3 DO NOT FORCE S+B=300: applied, and in round 4 EXERCISED -- the two derivations are independent (S from the three measured non-test halves plus the enumerated in-tier allowance it must dominate, B held at Decision 73''s existing base), and their sum is reported as a RESULT (CTX12, VP step 7 action). Round 4''s re-derivation demanded more than 120s -- S must clear 150 + 71.766 + 14.487 = 236.253 -- so the floor total was RAISED to 420 and named a correction in Decision 182 rather than a half being trimmed to preserve 300, which is exactly the response D3 reserved and this plan now takes. D4 AMEND ONLY 153: applied -- amends: [153] is the entry''s only edge, and Decision 73 is cited and re-read in prose with no _EDGE_RE-matching phrase anywhere in the entry. D4''s supporting clause ''config/decision_supersession_waivers.yaml is neither a scope row nor a sanctioned companion, so it is out of bounds inline'' was written against the earlier draft, in which the file was NOT a scope row; it is scope row 10 now. D4''s operative clauses -- ''one amends edge, to 153'' and ''153''s own body stays unedited'' -- are JOINTLY UNSATISFIABLE with zero waiver rows, because validate_supersession_annotations FAILs any edge whose victim block lacks the literal string ''Decision 182''. The applied reading keeps every substantive clause of D4 and halves the draft''s waiver footprint: one edge, no 73 edge, no victim body edited, and ONE waiver row instead of two -- an ADDITION to a waiver registry (no existing row, threshold or assertion moves), inside the Decision 59 LOCATION boundary because the file is a declared scope row. If the coordinator intends zero waiver rows, the only consistent alternative is to drop the envelope''s amends list entirely and record the amendment in prose, which trades Decision 167''s machine-readable relation for silence -- flagged, not taken. D5 THE THIRD MODULE: applied -- tests/validate/test_selection_fallback.py is scope row 7, VP step 6, execution step 6 and CTX18, and its two cases keep their exit codes and both assertion strings byte-identical, so the update is strictly as strong; the full sweep result is the next context entry. D6 ONE HOME ENFORCED BY IMPORT: applied -- acceptance 9 and VP step 12 now state the same grep-shaped assertion (no 120/150/180/240/300/420/1230/1260/1380/1500 anywhere in scripts/validate.py, both public names bound -- the pattern gained 150 and 1230 in round 2 and 240, 420 and 1260 in round 4, and still matches only lines 69, 75 and the comment at 78 on the pre-change tree, re-measured 2026-09-03), scope row 1 instructs a binding and no literal, and the one place the repo still duplicates a budget number (scripts/ci_rca/tier_map.py) is named rather than claimed away. D7 rec-3507 CLOSES HONESTLY: applied -- the rec''s acceptance command runs verbatim as VP step 11, the design puts the lowercase selection_breadth cause token in scripts/validate.py because that is the file that consumes and prints the waiver cause, and the rec''s own text is never rewritten to match the code.'
- 'THE D5 SWEEP, run 2026-09-03, recorded so ''exactly three modules'' is auditable rather than asserted. Sweep: grep -rln for ''Fast tier exceeded budget'', _FAST_TIER_BUDGET_SECONDS, _FORCED_FULL_SUITE_CEILING_SECONDS, ignore-budget and budget_assertion across tests/ and scripts/, plus repo-wide sweeps for time.monotonic patch sites and for the literals 400.0, 1500 and 1440. Result -- test modules that drive main() over budget: tests/validate/test_budget.py, tests/validate/test_budget_manifest.py and tests/validate/test_selection_fallback.py, all three scoped and repaired. Test modules that touch budget vocabulary but are NOT affected, each checked individually: tests/checks/registry/test_sequences.py (asserts only that budget_assertion is last in pre_sequence, and registry.py stays byte-identical); tests/convergence_health/budget_ingest/test_grouping.py (builds synthetic budget blocks and pins INGESTED_OUTCOMES == (''breach'',''forced_ceiling_breach'') -- unaffected because this plan does not edit that tuple, which is instead closure recommendation (b) of constraint 17); tests/checks/test__budget_recs.py (its many 400.0 values reach _file_budget_breach_rec directly, never main(), so no phase shape applies -- and the plan adds its new-key coverage in a sibling module because that file is at 490 of 500 SLOC); tests/validate/test_manifest_isolation.py and tests/validate/test_tiers.py (patch time.monotonic to 1.0 and never approach a budget). No fourth module encodes the retired aggregate.'
- 'PLAN-CRITIQUE ROUND-2 LEDGER (2026-09-03), both blocking findings and the folded notes. B1 -- THE NESTED-ALLOWANCE COLLISION, the one design point this round moved. validate_vp_replay is a --pre registered check with pre_globs None (so it runs on EVERY --pre run; index 53 of the 112-entry pre_sequence), and validate.py''s scaffold loop records its wall clock as phase_times[''validate_vp_replay''], so it sat INSIDE the drafted non_test_s. Its OWN ratified in-tier allowance is MAX_AGGREGATE_SECONDS = 120 with PER_STEP_TIMEOUT_SECONDS = 30 and MAX_REPLAYED_STEPS = 20 (scripts/checks/verification/validate_vp_replay.py:69-71, enforced at :191), and the guard trips only at the TOP of its loop, so a GREEN replay can legitimately reach just under 120 + 30 = 150s: a 150s sanctioned-green phase nested inside a 120s unwaivable budget with no escape of any kind is jointly unsatisfiable. It is not hypothetical -- this plan declares eight hermetic pre-deploy steps that its own implement leg will replay. RESOLUTION, a re-partition and never a threshold move: the 120s threshold is UNCHANGED and the quantity it governs is narrowed by exactly one phase that already carries a tighter, ratified, hard-failing gate -- non_test_s = elapsed - test_s - min(replay_s, REPLAY_ALLOWANCE_SECONDS). The clamp is what keeps coordinator direction D1 exact: replay time beyond that ratified allowance falls BACK into the unwaivable half, so elapsed = non_test_s + test_s + min(replay_s, R) by construction, nothing is unattributed, and every second of the tier is under exactly one hard gate (pytest_diff under the breadth allowance, the replay loop under vp_replay''s own MAX_AGGREGATE guard, everything else under the unwaivable 120s). The alternative was refused as the real weakening: dominating the inner allowance instead would have forced NON_TEST to ~270s and a floor total near 450s, leaving genuine check drift undetected below 3x. WHY vp_replay AND NOTHING ELSE: a sweep of all 106 --pre registered check modules for an in-tier wall-clock allowance (MAX_AGGREGATE-style constants, time.monotonic budgets, subprocess timeout= arguments) returns validate_vp_replay ALONE -- coverage_baseline.py''s timeout=300 sits in measure_and_check, which the --pre verifier_coverage_report scaffold never calls (run_coverage_check is a pure advisory report), and validate_ghas_probe''s urlopen timeout=15 is not in pre_sequence. Membership is therefore a stated criterion, not a list of convenience, and it is pinned: the two phase names live only in selection_budget.py and are asserted to be real pre_sequence step names, so a rename reddens instead of silently subtracting 0.0. THE CAP TIGHTENS: CEILING - NON_TEST - REPLAY_ALLOWANCE = 1230s (was 1380s), which puts the worst-case ASSERTED TOTAL at exactly 120 + 1230 + 150 = 1500s on every run -- the same ceiling, now honest about three terms rather than two -- while at today''s 522-module census the census clamp binds first and the real worst case is 120 + 1044 + 150 = 1314s; the cap only starts to bind above 615 selected modules. REPLAY_ALLOWANCE_SECONDS = 150.0 is a MIRROR of another module''s ratified constants, never a budget this gate asserts on: it clamps the subtracted term and sizes the cap, and it is pinned equal to MAX_AGGREGATE_SECONDS + PER_STEP_TIMEOUT_SECONDS by a test rather than imported, because pulling scripts.checks.verification into a stdlib-pure formula module under scripts/checks/deps (eagerly imported by validate.py, including on the --terraform-only path) would trade the module''s purity for a coupling the pin already covers. Note the numeric coincidence NON_TEST_BUDGET_SECONDS = 120 = MAX_AGGREGATE_SECONDS: after the re-partition the two govern DISJOINT quantities, which is precisely why the equality is now harmless rather than fatal. MEASURED, NOT ASSUMED: validate_vp_replay cost 0.066s of a 49.422s all-106-check scratch run whose diff resolved no plan, and the seven hermetic steps the breach run actually replayed (PR #1049 job log: ''PASS: 7 hermetic pre-deploy step(s) replayed clean across 1 plan(s)'') re-run locally in 0.70s total -- i.e. the phase is diff-and-plan-driven BREADTH, not check drift, which is the same conflation this whole plan exists to end. B2 -- THE FALSE MECHANICAL PREMISE: extract_supersession_edges accumulates into a SET of (superseder, victim, file) triples (validate_supersession_annotations.py:74-89), so the house-style heading parenthetical ''(amends Decision 153)'' and the envelope''s amends: [153] collapse into exactly ONE edge owing exactly the ONE waiver row already scoped. Rehearsed end-to-end in a scratch clone with the heading form present: without the row the guard prints ''FAIL: Decision 182 supersedes/amends Decision 153 ... no waiver'' with edges_from_182= [(182, 153)] and exits 1; with the row it prints ''PASS: 65 supersession edge(s) enumerated'' with the same single edge and failed= []. The parenthetical is therefore RESTORED to house style (20 of the last 24 amending entries carry it, Decision 153''s own heading included, at ~22 bytes against the 6,144-byte cap) and the prohibition is narrowed to its true scope -- every number OTHER than 153, where a textual phrase really would mint a second, unwaived edge. FOLDED NOTES: (i) the mandate''s calibration criterion (ii) is not literally met and Decision 182 must say so in those words -- the largest single --pre registered check measures 7.448s (validate_platform_roadmap; all 106 total 49.422s in a scratch clone), so doubling ANY single static check moves the non-test half by under 8s against 48.234s of headroom and never fires; what the 120s budget actually catches is a ~1.67x growth of the WHOLE non-test half, which is the plan''s own stated residual. (ii) ''unwaivable'' is LOCAL-ONLY in effect: scripts/validate.py:231 already hard-rejects --ignore-budget when CI=true, so evaluating the non-test assertion before the bypass branch removes only the local escape hatch -- the claim is true of the constant, not of CI behaviour. (iii) the three currently-green shapes the split deliberately hard-fails are enumerated in Decision 182 and in acceptance criterion 25, each pinned by its own test. (iv) rec-3507''s closure is satisfied by substitution and that is accepted: constraint 15 forbids a portal call from a VP step, so running the rec''s own acceptance command verbatim (step 11) is the strongest available pre-merge substitute. (v) round-2 defect found while rehearsing verification step 9 and fixed: its nondeterminism check asserted the substrings ''290'' and ''372'', which the entry''s required 374.248s / 289.567s figures do not contain -- it now asserts ''374'' and ''289'', and the whole step was rehearsed green against a synthetic entry. ROUND-4 ADDENDUM, so this ledger is not read as the current design: B1''s RESOLUTION above (a clamped second subtraction of the replay phase, with the 120s threshold held) was SUPERSEDED by coordinator pivot P1. The diagnosis stands verbatim -- vp_replay is a --pre check inside the non-test half whose ratified green maximum is ~150s, and a 120s unwaivable budget containing it is jointly unsatisfiable -- but the remedy is now DOMINATION rather than exemption: the clamp and the third governed term are withdrawn, NON_TEST_BUDGET_SECONDS is raised to 240 (150 + 71.766 + 14.487, rounded up), the cap returns to CEILING - NON_TEST = 1260s and the worst-case asserted total stays exactly 1500s across TWO terms. The round-2 rejection of that path -- ''dominating the inner allowance instead would have forced NON_TEST to ~270s and a floor total near 450s'' -- was arithmetically close (the honest floor is 236.253 -> 240, giving a 420s floor total) and is overruled on the merits the coordinator named: a budget with no escape of any kind must exceed every allowance sanctioned inside it, and the cost of that -- a drift blind spot of 3.34x instead of 1.67x -- is stated in Decision 182 rather than avoided by exempting the phase from the only gate that covers it. B2''s finding and its house-style restoration are unchanged and were re-verified in round 4.'
- 'COORDINATOR PIVOT LEDGER, ROUND 4 (2026-09-03; binding, and the last pivot this unit gets -- the alternative under the operating brief was abandonment). The design was NOT in question: no critique round challenged the split itself, the breadth-derived allowance, the reuse of Decision 153''s flag and ceiling, or the plan-time breadth number. All four surviving blockers were INTEGRATION COLLISIONS, and two are fixed by narrowing. P1 THE NON-TEST BUDGET MUST EXCEED EVERY RATIFIED IN-TIER ALLOWANCE MEASURED INSIDE IT: 120 was numerically EQUAL to validate_vp_replay''s MAX_AGGREGATE_SECONDS = 120, and vp_replay is a --pre registered check whose wall clock lands in phase_times, so the two were jointly unsatisfiable at the sanctioned limit of the inner one and the outer one had no escape. APPLIED by enumeration and domination rather than by exemption: the round-3 min(replay_s, R) clamp is WITHDRAWN, the non-test half returns to the settled two-term subtraction, the 112-step sweep identifies validate_vp_replay''s 150s green maximum as the only such allowance, and NON_TEST_BUDGET_SECONDS moves to 240 = 150 + 71.766 + 14.487 rounded up. The floor total therefore rises to 420, 120s above the retired 300s aggregate; the plan states the number, verification step 7 asserts it, and Decision 182 owns it as a correction to an aggregate that was nondeterministic AND already unsatisfiable at its own sanctioned limits (150 + 71.766 + 28.317 = 250.083 of 300 on an all-green narrow run) rather than as a raise. P2 RESTORE HOUSE STYLE ON THE AMENDS EDGE: applied in round 2 and re-verified here -- extract_supersession_edges returns a deduped SET of (superseder, victim, file) triples, so the heading parenthetical ''(amends Decision 153)'' and the envelope''s amends: [153] are ONE edge owing ONE waiver row; the phrase prohibition is scoped to every OTHER number, where _EDGE_RE really would mint a second, unwaived edge. P3 DESIGN-LEVEL REVERSAL TRIGGER: applied -- Decision 182''s reversal conditions now carry, besides the three re-derivation triggers, two conditions that would condemn the SPLIT ITSELF (a breadth_waived majority with a median allowance above 2 x TEST_BASE_SECONDS over a rolling three-month window; and two consecutive quarters without a single non_test_breach while the recorded static_s series grows past 1.5x its calibrated worst), and they must be in the PUBLISHED body because Decision 177''s append-only live-body lock makes them hard to correct after merge. P4 TAKE THE REC-STREAM REWIRING OUT OF SCOPE: applied by narrowing -- scripts/checks/_budget_recs.py and tests/checks/test__budget_recs_fields.py are dropped from the scope table, _REC_FILING_OUTCOMES keeps its two rows, the seven new keys are merged into the manifest budget block at validate.py''s own call site, and the stale ''limit 5m'' wording is carried to closure recommendation (c). THE ROUND-4 SWEEP, run 2026-09-03 in a scratch clone, recorded so ''validate_vp_replay alone'' is auditable rather than asserted. Sweep: grep -rnE ''^[A-Z_]*(MAX|TIMEOUT|SECONDS|BUDGET|LIMIT)[A-Z_]*\s*=\s*[0-9]'' and ''timeout='' across scripts/checks/ and scripts/validate.py, cross-checked against registry.pre_sequence() membership (measured: 112 steps; validate_vp_replay at index 53; validate_ghas_probe absent). Hits and their disposition -- validate_vp_replay.py:69-70 PER_STEP_TIMEOUT_SECONDS=30 / MAX_AGGREGATE_SECONDS=120: IN the non-test half, green maximum 150s, the binding constraint; misc/coverage_baseline.py:125 communicate(timeout=300): in measure_and_check, which the --pre verifier_coverage_report scaffold never calls (it calls run_coverage_check, an advisory printer that never appends to failed); misc/validate_ghas_probe.py:61,82 urlopen(timeout=15): not in pre_sequence; _scaffolding.py:141 pytest --timeout 60 (fast tier) / 120 (full tier): a PER-TEST timeout inside the pytest_diff phase, i.e. inside the test half, not the non-test one; _scaffolding.py:57 _DQ_FRESHNESS_SECONDS=3600: a data-freshness threshold, not a wall-clock allowance. No other --pre step carries an in-tier wall-clock allowance. The two reported phase names are pinned to real pre_sequence step names by test, so a rename reddens rather than silently changing what the budget measures. THE BREACH-REC WORDING IS DELIBERATELY LEFT STALE, AND THAT IS RECORDED RATHER THAN HIDDEN (coordinator pivot P4). scripts/checks/_budget_recs.py::_file_budget_breach_rec hardcodes ''limit 5m'' at :196 (the CI loud-skip message) and ''(limit 5 min)'' at :212 (the filed rec''s context, which is also its dedupe key), while the pre-existing `breach` arm this change keeps is now judged against the breadth-derived allowance (526s at n=263, not 300s). Correcting those two strings reddens three exact-string assertions in tests/checks/test__budget_recs.py (:432, :525, :544), a file at 490 of 500 SLOC, so bringing it into scope would force a Decision 128 decomposition and grow this unit again -- the exact round-2 failure mode the critique already caught once. The narrowing contains the damage: the two NEW outcomes file no rec at all, so the new unwaivable gate never emits the stale string; the true limit the run was judged against is recorded as limit_s in the manifest budget block on every arm; and the correction is carried as closure recommendation (c) of constraint 17 and named as residual (iii) in Decision 182''s coverage declaration. Stale-but-honest, scoped and owned -- not silently inherited.'
- 'CI STEP-SUMMARY PARITY FOR THE TWO NEW ARMS (round-5 blocking finding B3 -- why pivot P4''s rec-free choice does not become an observability hole). Every terminating budget arm in the repo today mirrors a titled section to GITHUB_STEP_SUMMARY: breach through _file_budget_breach_rec''s CI leg (scripts/checks/_budget_recs.py:200), bypass through _file_budget_bypass_rec''s (:288), forced_waived (scripts/validate.py:397) and forced_ceiling_breach (:407) through _mirror_budget_notice_to_summary -- and the repo pins that property with a telemetry class per arm (tests/validate/test_budget.py:448 TestBudgetBreachCiTelemetry, :495 TestForcedWaiverCiTelemetry). Decision 153 point 3 states the doctrine for exactly this shape, in the very entry Decision 182 amends: the rec-free path ''does not file _file_budget_breach_rec -- the ceiling notice mirrors to the CI step summary instead''. Under pivot P4 NEITHER new outcome files a rec, so both owe the mirror: breadth_waived already had it (the loud breadth notice), and non_test_breach now takes it too -- which matters most for that arm, because it is an unwaivable exit 1 with no escape of any kind and would otherwise have been the only non-within_budget outcome in the repo emitting no CI artifact at all. Cost is one call plus one assertion inside an EXISTING TestNonTestHalfBudget case (six cases, unchanged, so VP step 2 still expects 6 passed); the helper is already imported at scripts/validate.py:57 with signature (title, message) and appends a ''## title'' section to $GITHUB_STEP_SUMMARY, so scripts/checks/_budget_recs.py stays BYTE-IDENTICAL, no new import or file enters scope, and VP step 12''s budget_recs_signature_unchanged / rec_filing_outcomes_unchanged keys are unaffected. The posture is also PUBLISHED in Decision 182''s coverage declaration (acceptance 22, constraint 13''s never-droppable list, VP step 9''s non_test_breach_arm_posture key) because Decision 177''s append-only live-body lock makes an omitted posture expensive to correct after merge.'
