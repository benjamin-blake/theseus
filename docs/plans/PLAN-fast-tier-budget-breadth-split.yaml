- 'THE INCIDENT: PR #1049, head commit c6f502d, PLAN-mypy-unit1-baseline-paydown -- 22 scripts modules gaining typing.cast narrowings, zero behaviour change, reviewed and fully green. 24 changed paths selected 263 test modules and validate --pre took 374.248s against the 300s budget (run 33790809988, job 100766684064). NO CHECK FAILED: the Validation Summary above the budget line read clean and the FULL tier passed on the same commit. full_suite_forced was False (no root-conftest edit), so Decision 153''s waiver could not apply and the assertion hard-exited 1. The work was blocked purely on wall clock.'
- 'THE NONDETERMINISM (the single strongest argument in the design): the SAME head commit c6f502d, the same 24-path diff and the same 263-module selection re-ran hours later (run 33794705486, job 100779472792) and passed at 289.567s. An 84.7s spread -- 28.2% of the budget -- on runner luck alone. The aggregate gate is therefore nondeterministic at the margin: the same diff can pass or hard-fail on runner luck. This must appear in Decision 182''s Problem section.'
- 'THE MEASUREMENT THAT REPLACED THE GUESS (the change of record between draft and final): all three CI runs uploaded a selection-manifest artifact whose budget block carries the tier''s OWN per-phase times, and all three were read directly at planning time rather than reconstructed from log timestamps. FLOOR -- run 33788889928 / job 100760338281 / artifact 9906598042 (PR #1048, 6 paths): n_selected 98, elapsed 100.083s, pytest_diff 28.317s, non-test half 71.766s, outcome within_budget. BREACH -- run 33790809988 / artifact 9907508601: n_selected 263, elapsed 374.248s, pytest_diff 308.747s, non-test half 65.501s, dominant_phase pytest_diff, outcome breach. RERUN -- run 33794705486 / artifact 9908901392: n_selected 263, elapsed 289.567s, pytest_diff 238.553s, non-test half 51.014s, outcome within_budget. These nine numbers are the whole calibration basis, and they correct a log-timestamp reconstruction that put the pre-pytest window at ~90s: pytest_diff actually STARTS about 14s into the run and the ~90s sat inside it (collection), so the incident''s non-test half was 65.5s, not ~141s. Artifacts expire 2026-09-17; the numbers are frozen into verification step 7 with their provenance.'
- 'LOCAL IS NOT A PREDICTOR: on a 4-core box the same 263-module selection ran 155.6s total with pytest_diff at 97.7s, and a 120-module variant ran 142.7s with pytest_diff at 83.5s. Module count fell 54%, elapsed fell 8%. CI''s pytest_diff for the same 263-module selection was 238.6-308.7s -- 2.4x to 3.2x the local figure -- while the non-test half moved only 51.0-71.8s in CI against 57.9-59.2s locally. The two halves have different cost drivers AND different local-to-CI transfer functions, which is the direct measurement that one scalar cannot govern both. A plan can pass every local gate and still be unmergeable.'
- 'DIAGNOSIS: observed elapsed = (non-test cost) + (diff-selected pytest cost) x (runner-speed factor). Decision 153''s stated purpose for the assertion is ANTI-DRIFT -- ''to catch a check silently growing past its contract''. Drift is ''a fixed check got slower''; breadth is ''the selected set got bigger''; hardware is the multiplier. One scalar cannot separate three variables, and the incident is the proof.'
- 'CHOICE OF DENOMINATOR (mandate asked for a justified pick; settled in round 1 and NOT reopened). The unwaivable budget is asserted BY SUBTRACTION on the whole remaining half -- non_test_s = elapsed - phase_times[''pytest_diff''], identically static_s + replay_s + unattributed_s -- not on the sum of named non-pytest phases. Round 2 briefly added a second, clamped subtraction of the replay phase; round 4 WITHDRAWS it and returns to this two-term form, because the collision that motivated it is better closed by raising the outer budget to dominate the inner allowance than by exempting a phase from the only gate that covers it (coordinator pivot P1). The draft asserted only sum(named static phases) and left the remainder (module import, get_changed_files, derive_affected_tests, emit_manifest''s best-effort S3 leg, the final summary) governed solely by the 1500s ceiling: a 5x loosening over a region the retired 300s aggregate DID cover, and the draft''s own RED fixture (372s elapsed, every phase 0.0) was exactly that shape and would have exited 0. Asserting the total closes it with no new constant. The attributability objection that motivated the narrower form is answered by REPORTING rather than by narrowing: static_s, replay_s, unattributed_s, phase_count and the dominant non-test phase are all printed in the breach diagnostic and recorded in the budget block, so an unwaivable alarm always names its component -- and replay_s is printed beside REPLAY_ALLOWANCE_SECONDS so a replay-dominated breach reads as a vp_replay problem rather than as static drift. Measured basis: the remainder is small and bounded -- derive_affected_tests self-reported 2.547-3.693s across the three runs, and the entire non-test half never exceeded 71.766s.'
- 'WAIVER SHAPE (mandate asked which was chosen): the CAUSE is carried as a waiver_cause field in the manifest''s budget block (none / selection_breadth / forced_full_suite), NOT by overloading full_suite_forced. Decision 153''s ''no new mechanism'' posture is honoured because nothing new is added to the SELECTOR -- affected_tests.py is byte-identical, the same flag, the same 1500s ceiling and the same warn-and-pass path serve both causes, and the new field lives only in the observability record the artifact already carries. That keeps the population enumerable without giving the gate a second input to read.'
- 'K CALIBRATION, FROM MEASURED pytest_diff PHASES ONLY (arithmetic reproduced by verification step 7): slopes above the measured 98-module / 28.317s floor are (308.747-28.317)/165 = 1.6996 s/module and (238.553-28.317)/165 = 1.2742 s/module -- the same commit, so the slope is uncertain by 1.33x on runner luck alone. The same-commit TEST spread is 70.194s = 0.2669 s/module at n=263. k_floor = worst slope + per-module test spread = 1.6996 + 0.2669 = 1.9665, rounded UP to 2.0 s/module. No elapsed figure enters this derivation, and no figure used here is reused as evidence for the non-test budget.'
- 'THE FLOOR TOTAL (an OUTPUT, and after round 4 an output that no longer lands on 300 -- coordinator direction D3 restated with teeth as pivot P1): the non-test budget is set from the non-test measurements AND from the enumerated in-tier allowances it must dominate, and the test base is Decision 73''s own base held at the status quo. 240 + 180 = 420 is what those two independent choices sum to, and the plan states the number rather than trimming a half to preserve the retired 300. The crossover sits at n = 180/2.0 = 90, eight modules below the measured 98-module floor selection; below it the flat base governs, above it the per-module allowance governs. What the raise costs, stated plainly: at the floor a run is now allowed 420s of asserted total where the retired aggregate allowed 300 -- 120s more -- and the non-test drift blind spot widens from the 1.67x a 120s constant would have given to 3.344x. What it buys, equally plainly: the pair is jointly SATISFIABLE for the first time (the 120s draft was numerically equal to validate_vp_replay''s own ratified MAX_AGGREGATE_SECONDS, so a sanctioned-green replay alone could exhaust the entire unwaivable budget with no escape), and the budget is still 31.683s TIGHTER than the 271.683s of non-test drift the retired aggregate tolerated on the narrowest measured run. What the test-half headroom buys is unchanged: at n=263 the allowance is 526s against a measured worst test half of 308.747s -- 217.3s, or 3.10x the same-commit test spread -- so the incident passes deterministically rather than marginally; what it costs is that the test half may grow 70% before firing, so per-module test drift is detected only above 2.0 s/module against a measured 1.27-1.70.'
- 'NON-TEST BUDGET DERIVATION AND ITS NAMED BLIND SPOT (round-4 re-derivation, coordinator pivot P1). Two inputs, both CI-derived, neither local. (1) THE ENUMERATED IN-TIER ALLOWANCES: a sweep of all 112 --pre sequence steps for MAX_*_SECONDS / *_TIMEOUT_SECONDS-shaped constants, time.monotonic budgets and subprocess timeout= arguments returns validate_vp_replay ALONE -- PER_STEP_TIMEOUT_SECONDS = 30 and MAX_AGGREGATE_SECONDS = 120 at scripts/checks/verification/validate_vp_replay.py:69-70, enforced at :191 only at the TOP of the replay loop, so a GREEN replay can legitimately reach just under 150s; coverage_baseline.py''s timeout=300 sits in measure_and_check, which the --pre verifier_coverage_report scaffold never calls (run_coverage_check is a pure advisory report); validate_ghas_probe''s urlopen timeout=15 is not in pre_sequence at all; and pytest''s --timeout 60 is a PER-TEST timeout inside the pytest_diff phase, i.e. inside the test half. _scaffolding.py''s _DQ_FRESHNESS_SECONDS = 3600 is a data-freshness threshold, not a wall-clock allowance. (2) THE MEASURED HALVES: 51.014s, 65.501s and 71.766s, whose same-commit spread is 14.487s. NON_TEST_BUDGET_SECONDS = max(allowance) 150 + worst measured half 71.766 + spread 14.487 = 236.253 -> 240. Note the shape the measurements expose -- the FLOOR run''s non-test half (71.766s at n=98) is the LARGEST of the three, above the breach run''s (65.501s at n=263), because the non-test half is driven by which glob-gated checks the diff triggers, not by selection breadth. The residual blind spot is stated rather than hidden: a non-test half at 51-72s can drift to 240s (about 3.34x) before firing, and at the replay maximum only 90s of the budget is left for everything else. That gap narrows from the static_s / replay_s / unattributed_s / phase_count series this change starts recording -- which is exactly what makes the budget-block fields load-bearing rather than decorative, and why partial rollback (b) is called self-defeating.'
- 'COMPARISON WITH THE RETIRED AGGREGATE, STATED PRECISELY. The 300s aggregate governed non-test + test together, so its sensitivity to non-test drift DEPENDED on the selection. On a narrow run (test half near the 28.317s floor) it tolerated a non-test half up to 271.683s; the split fires at 240s, so even after the round-4 raise the split is more sensitive to drift on the narrow runs where the aggregate was genuinely acting as a drift detector -- by 31.683s, and the plan asserts that property (S < 300 - tf) in verification step 7 rather than claiming it. On a wide run (n=263) the aggregate had already been exhausted by the test half and fired regardless of the non-test half, so it was not a drift detector there at all -- it was a breadth detector wearing a drift detector''s name. And the aggregate was ALREADY jointly unsatisfiable with the allowances it contained: a fully green narrow run at validate_vp_replay''s ratified maximum costs 150 + 71.766 + 28.317 = 250.083s, 49.917s from a hard fail with nothing wrong. That is why 420 is a correction rather than a raise. Stated as a list rather than left implicit, because these are green-today shapes: the split newly hard-fails (a) a non-test half above 240s while total elapsed stays under the 420s floor total, (b) a run with no recorded pytest_diff phase, where test_s = 0.0 puts the whole elapsed in the unwaivable half, and (c) a forced full-suite run whose non-test half exceeds 240s, which loses Decision 153 point 1''s waiver because the unwaivable branch is 1 and the forced waiver is 3. All three are intended, each is pinned by its own named test rather than discovered in CI, and none of the three measured CI runs is among them.'
- 'EXPLICITLY REJECTED, one line each, and Decision 182 says so: a file-count cap on plans (uncorrelated with cost -- one hub-module edit selects 99 modules while this plan''s other eleven scope rows add 6 between them; gamed by splitting a PR, which re-pays the hub closure N times and RAISES total CI cost; and it contradicts Decision 128''s decompose-by-default, since a facade split increases file count while lowering per-file risk); a merge queue (no concurrency in a sole-developer repo); dropping the diff-selected tests from the required gate (trades a fast pre-merge signal for a red main, against this repo''s green-main culture); and teaching the selector to ignore annotation-only diffs (typing.cast is a runtime call, so the bytecode differs -- the gate must tolerate legitimately wide selection).'
- 'THIS PLAN''S OWN BREADTH, re-measured 2026-09-03 in a scratch clone via derive_affected_tests on the REVISED TEN-row scope (coordinator pivot P4 removed two rows): n_selected = 128, capped True, full_suite_forced False. Test-execution allowance max(180, 2.0 x 128) = 256s; CI-predicted elapsed 118-151s from the two measured pytest_diff slopes above the 98-module floor (66.5-79.3s of test half) plus the measured non-test half (51.0-71.8s). Predicted outcome: within_budget on BOTH halves, and also under the retired 300s aggregate. THE MEASUREMENT IS NON-MONOTONIC AND THAT IS THE POINT: dropping scripts/checks/_budget_recs.py and tests/checks/test__budget_recs_fields.py from the scope RAISED n_selected from 105 to 128, because the residue-cap BFS then deferred 104 modules instead of 152. A smaller diff selecting a wider set is the sharpest available refutation of the file-count proxy this plan retires -- measured on this plan''s own scope, twice, deterministically. For comparison the same measurement gives 99 for scripts/validate.py alone, 43 for docs/DECISIONS.md alone and 2 for the waiver file alone.'
- 'SUPERSESSION MECHANICS (the blocking finding the draft missed, and the reason config/decision_supersession_waivers.yaml is a scope row). validate_supersession_annotations is registered pre=True with pre_globs including docs/DECISIONS.md AND config/decision_supersession_waivers.yaml, so this diff triggers it in --pre. extract_supersession_edges UNIONS envelope-borne `amends:`/`supersedes:` entries with the textual ''amends Decision N'' form (Decision 167), so `amends: [153]` creates exactly ONE edge, and any textual ''amends/supersedes Decision N'' phrase in the entry''s prose would create another; each edge FAILs unless the victim''s block contains the literal string ''Decision 182'' or the edge is waived. Annotating a victim would edit a live body Decision 177 locks and would break this plan''s amend-only convention, so the waiver is the sanctioned discharge -- and it is the exact precedent Decision 153 set for its OWN 153->73 edge (config/decision_supersession_waivers.yaml line 129) and 153->135. Verified red-then-green at planning time by running the real check against an injected root: a FAIL without the row, a pass with it. This is why the file is a scope row: the edit is inside the Decision 59 LOCATION boundary, is an ADDITION to a waiver registry rather than a relaxation of any check, and is the only discharge that leaves both victims'' bodies untouched.'
- 'THE THIRD BUDGET-SHAPED TEST MODULE (the second blocking finding the draft missed): a repo-wide sweep for tests that drive main() over budget with an empty phase shape returns exactly THREE modules, and the draft scoped two. tests/validate/test_selection_fallback.py:91 and :101 drive elapsed 400.0 through pre_sequence_stub(checks=()) and assert exit 1 plus ''Fast tier exceeded budget''. Under the split with the non-test budget asserted on the total they still exit 1 (400s of unattributed time is a non_test_breach), so the file is not silently inverted -- but they would then be proving the WRONG arm for a module whose docstring is about a breach ''diagnosed off phase timings''. The repair is therefore semantic, not rescue: give both cases a real dominating pytest_diff phase so each proves the arm it names, with every assertion byte-identical. Left unscoped it would first redden at the full-tier step, where an out-of-scope fix is forbidden.'
- 'HEADLINE-STRING DISCIPLINE (why the repair is small rather than sweeping): every hard-fail arm of the split keeps the existing ''ERROR: Fast tier exceeded budget'' headline verbatim and appends which budget fired. That is what lets eight pre-existing assertions on that exact string survive the split without being rewritten -- the weakening form Decision 181 clause 3 names as dominant is ''rewrite the assertion to fit the new behaviour'', and the deliberate counter-move here is to make the new behaviour keep the old contract''s words.'
- 'STATIC DENOMINATOR RECORDING (why phase_count is a new key): _PHASE_TIMES_KEPT truncates the recorded phase_times to the 10 slowest, verified in the three artifacts (the breach run recorded 10 phases summing to 358.013s against an elapsed of 374.248s, so ~16.2s sat in dropped phases plus unattributed). Without phase_count the recorded static_s cannot be reconciled against the recorded phase_times, and the calibration series this change exists to start would not be auditable by the next planner.'
- 'SELECTION-BREADTH SANITY FLOOR: n_selected becomes a gate INPUT, so an over-selecting or corrupted selector could otherwise raise its own allowance, and because fallback stays False in that shape the fail-closed leg would never fire. count_test_modules() (a stdlib rglob over tests/**/test_*.py; 522 measured 2026-09-03) clamps it: the allowance uses min(n_selected, census), so the allowance can never exceed what the repository could actually run. One line, pinned by test.'
- 'SKILL.md IS NOT EDITED IN THIS PASS (Decision 165 pivot, and the scout''s own suggested resolution): the additive Selection-Breadth Assessment block would have needed a prose-budget raise whose authorization mechanism (Decision 165) would in turn have forced Decision 182''s body to name a skill path for guard reasons -- a governance coupling not worth minting for a 1.3 KB block. The guidance instead ships in the CLI''s own --help and module docstring (uncapped, and the exact ''defer the detail to an uncapped auxiliary file this surface points at'' valve the registry header names), and the /plan wiring is deferred to one recommendation filed at closure. The line-245 file-count heuristic stays untouched either way: it is suspended by Decision 67, and the number that should replace it cannot be calibrated until the breadth surface has produced a population of measurements. Decision 182 records the replacement intent so the Decision-67 lift does not silently restore the cap. PROSE BUDGET -- WHY NO RAISE: .claude/skills/planning/SKILL.md measures 55716 bytes against a 55792 budget (76 bytes of headroom); config/prose_budgets.yaml is ratchet-down-only, seeded at zero headroom, its header declines a DECISIONS.md entry outright and states that Decision 128''s decompose valve ''is SLOC-specific and does not apply here''. Its OWN listed relief valves are: relocate to PROJECT_CONTEXT.md or a docs/contracts/*.yaml contract; defer the detail to an uncapped auxiliary file the surface points at; or take a Decision-cited raise. A new Class D contract would owe a resolving evaluator (contract-population ratchet) and thus a registered check this plan forbids, so the plan takes the auxiliary-surface valve and leaves both files byte-identical.'
- 'PER-ENTRY SIZE CAP: validate_decisions_size hard-fails a NEW decision entry over 6,144 bytes in the --pre tier (_PER_ENTRY_CAP_BYTES, measured heading-to-next-heading). Decision 181 -- the current head of the corpus and the house-style template, including its bare ```yaml``` envelope with number/status/decided_date/significance -- measures 5,527 bytes and carries materially less than Decision 182''s twelve required items, leaving 617 bytes of slack. Decision 180 is 4,495 bytes. So Decision 182 has room only if written densely, which is why the constraints carry a four-rung compression ladder with five items declared never-droppable rather than a vague ''be concise''.'
- 'DECISIONS.md IS NEWEST-FIRST: Decision 181 currently leads at line 5, so Decision 182 is inserted above it. The envelope''s required_fields are number and significance (docs/contracts/decision-entry.yaml); amends is an optional field (alongside status, decided_date, supersedes) worth carrying so the relation is machine-readable rather than only title-borne -- at the price of the single waiver row the previous context entry describes. It carries 153 alone: every additional number in that list is another edge and another row, so a citation that does not need to be machine-readable stays in prose.'
