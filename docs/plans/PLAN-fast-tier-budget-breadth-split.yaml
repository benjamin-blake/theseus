- 'TEST BASELINES that constrain the repair (measured 2026-09-03): tests/checks/test__budget_recs.py is 490 SLOC against the 500 limit AND carries three exact-string assertions on the breach-rec text (:432, :525, :544) -- which is why coordinator pivot P4 keeps both that file and scripts/checks/_budget_recs.py out of scope entirely rather than decomposing them inside this unit; tests/validate/test_budget.py is 428 SLOC -- the reason every NEW case lands in test_budget_split.py; tests/validate/test_budget_manifest.py is 152 SLOC (ample headroom, which is why the two manifest-side classes the narrowing relocated land there) and tests/validate/test_selection_fallback.py is 85. scripts/validate.py is 376 SLOC and the classifier lives in the new module precisely so it stays well clear of 500.'
- 'WHY THE EXISTING BUDGET TESTS MUST CHANGE, with the exact inventory. In tests/validate/test_budget.py SIX tests patch time.monotonic straight to 400.0 (lines 40, 60, 180, 202, 225 and 390) and TWO more use the ceiling literals (233, 259); line 390 is TestIgnoreBudgetFlag::test_bypass_skips_budget_assertion -- with the non-test assertion evaluated before the bypass branch, its zero-phase 400s run would become a non_test_breach (400 > 240) and exit 1, so it must be re-shaped to place its elapsed in the test half it actually waives. TestForcedFullSuiteWaiver has FIVE tests, not four. TestIgnoreBudgetFlag has FIVE cases in total -- three at elapsed 60.0 (lines 291, 310, 329), test_bypass_rec_receives_a_real_dominant_phase at 348 already using the 1000s slow-phase fake_monotonic pattern, and test_bypass_skips_budget_assertion at 379/390 -- so four are untouched under the split. TestIgnoreBudgetCIGuard::test_allows_ignore_budget_when_ci_not_set (line 439, elapsed 60.0) is untouched for the same reason. THE ROUND-4 ADDITION: test_budget_constant_is_300 (line 85/86) is NO LONGER untouched, because the floor total moved from 300 to 420 -- it is renamed and re-pointed to the strictly stronger three-way identity (_FAST_TIER_BUDGET_SECONDS == FLOOR_TOTAL_SECONDS == NON_TEST + TEST_BASE == 420), never deleted and never loosened; the only other readers of that name are tests/validate/test_budget_manifest.py:99 (whose limit_s assertion moves to the breadth allowance anyway) and two out-of-scope files, scripts/ci_rca/tier_map.py (its own independent 300 literal, now stale, carried to closure recommendation (b)) and scripts/import_governance.py (prose only). In tests/validate/test_budget_manifest.py FIVE cases drive an over-budget elapsed with an empty phase shape (lines 100, 106, 113, 121, 133) plus the Decision 55 loud-skip breach case at 153: giving each a real dominating phase preserves every assertion verbatim. Deleting or relaxing one would be the weakening Decision 181 forbids.'
- 'Hermetic-flag disposition (deliberate, recorded so it reads as a call rather than an oversight): verification steps 2, 3, 4, 5, 6, 7, 14 and 15 invoke pytest or a python one-liner and are marked hermetic true (steps 12 and 13 carry hermetic false because they read live git and tree state), against the planning skill''s ''steps needing pytest stay hermetic false'' line. The flag is not a hard gate and true means validate_vp_replay re-runs these selectors against the complete tree at implement time -- more verification, not less. Cost is bounded: eight fast, mock-driven invocations against PER_STEP_TIMEOUT_SECONDS=30 and MAX_AGGREGATE_SECONDS=120. TWO mechanical properties make that replay survivable, and BOTH were re-executed in round 5 rather than asserted. (a) FIXED SEED, non-negotiable: each of the five pytest commands (steps 2, 3, 4, 5, 6) carries `--randomly-seed=12345`. pyproject.toml''s [tool.pytest.ini_options] addopts sets `--randomly-seed=last` (line 12), and pytest-randomly''s pytest_configure asserts hasattr(config, ''cache'') for that value -- `-p no:cacheprovider` removes the attribute, so a SEEDLESS command dies with ''INTERNALERROR> AssertionError: The cacheprovider plugin is required to use last'' and returns 3. Reproduced in a scratch clone: bin/venv-python -m pytest tests/validate/test_budget.py -q -p no:cacheprovider returns RC=3, and the identical command plus the seed returns RC=0 (24 passed). The fixed-integer override is the repo''s own convention (scripts/checks/_scaffolding.py::_build_unit_test_cmd, rec-2653) and 51 of the 67 no:cacheprovider commands across merged plans already carry it. Without the seed all four graduate steps would mint verification-registry shards holding a permanently-broken command AND validate_vp_replay would redden VP step 16 on the implement PR -- unfixably, because verification_plan[].command is a prohibited_field_edit on a resolved plan (docs/contracts/implement-scope-boundary.yaml:83-94). (b) NO BACKTICK LITERAL in any hermetic step''s `expected`: validate_vp_replay''s matching rule (b) (scripts/checks/verification/validate_vp_replay.py:126-135) asserts every backtick-delimited literal as a substring of the replayed stdout+stderr, which a -q pytest run cannot satisfy. Re-verified by running that check''s own _extract_literals over every step of this plan: it returns [] for steps 2, 3, 4, 5, 6, 7, 14 and 15, so replay asserts exit 0 only (step 10''s ''failed'' literal is hermetic false and therefore EXCLUDED). Round 4 briefly broke this by backticking ''breach'' inside step 2''s expected; the word is now plain prose. Any future edit to a hermetic step''s `expected` must re-run _extract_literals before it lands. That same bound is the round-2 blocking finding read from the other side: these eight steps are exactly the replay cost this plan''s own implement-leg --pre run will pay INSIDE the non-test half, which is why NON_TEST_BUDGET_SECONDS had to be raised to dominate the replay allowance rather than left at a number equal to it.'
