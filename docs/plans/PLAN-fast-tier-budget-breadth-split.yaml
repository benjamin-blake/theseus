slug: fast-tier-budget-breadth-split
intent: 'Split the fast tier''s single 300s wall-clock assertion into the two quantities it was silently averaging: an absolute, unwaivable NON-TEST budget (240s, asserted on elapsed minus the pytest_diff phase -- identically static_s + replay_s + unattributed_s, so nothing is left ungoverned -- where Decision 73''s anti-drift rationale actually applies) and a breadth-derived TEST-EXECUTION budget (max(180s, 2.0s x n_selected)), capped at the DERIVED expression CEILING_SECONDS - NON_TEST_BUDGET_SECONDS = 1260s so the worst-case ASSERTED TOTAL across both governed terms is exactly the existing 1500s ceiling Decision 153 already derived -- no second ceiling constant. THE NON-TEST CONSTANT IS THE ROUND-4 CORRECTION (coordinator pivot P1, and the last one this unit gets): 120s was numerically EQUAL to validate_vp_replay''s own ratified in-tier allowance MAX_AGGREGATE_SECONDS = 120 (scripts/checks/verification/validate_vp_replay.py:70, enforced at :191), and validate_vp_replay is a --pre registered check (index 53 of the 112-step pre_sequence, pre_globs None so it runs on EVERY --pre run) whose wall clock validate.py records into phase_times and which therefore sits INSIDE the non-test half: a single check sanctioned to consume the entire outer budget makes the two jointly unsatisfiable, and the outer one has no escape of any kind. The fix is to make the outer budget DOMINATE every ratified in-tier allowance measured inside it, not to re-partition around them (the round-3 draft''s min(replay_s, R) clamp is withdrawn; the non-test half returns to the settled two-term subtraction elapsed - phase_times[''pytest_diff'']). The enumeration behind that domination is exhaustive rather than assumed: sweeping all 112 --pre sequence steps for MAX_*_SECONDS / *_TIMEOUT_SECONDS-shaped constants, time.monotonic budgets and subprocess timeout= arguments returns validate_vp_replay ALONE (its green maximum is MAX_AGGREGATE_SECONDS 120 + one PER_STEP_TIMEOUT_SECONDS 30 = 150s, because the aggregate guard trips only at the top of the loop); coverage_baseline.py''s timeout=300 sits in measure_and_check, which the --pre verifier_coverage_report scaffold never calls (run_coverage_check is a pure advisory report); validate_ghas_probe''s urlopen timeout=15 is not in pre_sequence at all; and pytest''s --timeout 60 is a PER-TEST timeout inside the pytest_diff phase, i.e. inside the test half. NON_TEST_BUDGET_SECONDS = 240 is therefore set at max(in-tier allowance) 150 + the worst measured non-test half 71.766 + the measured same-commit non-test spread 14.487 = 236.253, rounded up to the next ten. THE FLOOR TOTAL RISES AND THE PLAN SAYS SO: 240 + 180 = 420s, 120s ABOVE the retired 300s aggregate, which Decision 182 owns numerically as a CORRECTION to an aggregate that was itself nondeterministic AND already jointly unsatisfiable with the allowances it contained -- a fully green narrow run at the replay maximum already costs 150 + 71.766 + 28.317 = 250.083s, 49.917s from a hard fail with nothing wrong -- never as a raise, and never by trimming a half to preserve a sum (coordinator direction D3, restated with teeth). The drift teeth are not lost and the cost is stated rather than implied: on the narrowest measured run the retired aggregate tolerated a non-test half up to 271.683s while the split fires at 240s, 31.683s TIGHTER, and the blind spot the 240s constant leaves is 3.344x the worst measured non-test half (71.766s), narrowing only from the static_s / replay_s / phase_count series this change starts recording. Both halves are derived from three real CI selection-manifest artifacts recovered at planning time (runs 33788889928 / 33790809988 / 33794705486), each asserting on a measurement OF THE QUANTITY IT GOVERNS: the non-test budget from the three measured elapsed-minus-pytest_diff values (51.014 / 65.501 / 71.766s) plus the enumerated in-tier allowance those runs never exercised, and the per-module coefficient from the three measured pytest_diff values (28.317s at n=98; 308.747s and 238.553s at n=263). Decision 153''s warn-and-pass path, its full_suite_forced flag and its fail-closed read are reused with exactly ONE stated subordination -- the unwaivable non-test assertion is branch 1 and outranks the forced waiver at branch 3, so a forced full-suite run whose NON-TEST half has drifted past 240s no longer gets the waiver it has today, which Decision 182 states rather than leaving to be discovered -- and gain a SECOND MEASURED CAUSE (selection breadth), recorded as a waiver_cause in the manifest''s budget block rather than by overloading the boolean, with a loud attributable notice on every breadth-governed pass and a named outcome on every branch in a pinned branch order. A new pure module scripts/checks/deps/selection_budget.py becomes the SINGLE home of every budget constant and of the formula -- scripts/validate.py restates no number, binding its two existing public constant names to that module -- and also exposes the formula as a ~3-second plan-time CLI over derive_affected_tests, so a planning session can measure a candidate scope''s n_selected and predicted CI outcome before the work is written; the --pre run prints the same prediction beside its local wall clock and labels the local number advisory. THE UNIT IS NARROWED, NOT WIDENED (coordinator pivot P4): scripts/checks/_budget_recs.py and its test module stay BYTE-IDENTICAL and are out of scope entirely -- _REC_FILING_OUTCOMES keeps its two rows, the two new outcomes (non_test_breach, breadth_waived) file no recommendation and record into the manifest''s budget block ONLY, which is where the trend series this design needs already lives, so the new gate never emits the stale ''limit 5m'' wording _file_budget_breach_rec hardcodes at :196/:212 and no exact-string assertion in the 490-of-500-SLOC tests/checks/test__budget_recs.py is disturbed. One new Decision (182) carries exactly ONE envelope-borne amend edge, 182->153, discharged the way Decision 153 discharged its own 153->73 edge: one row in config/decision_supersession_waivers.yaml, never a forward-pointer edit to a victim''s body. The heading carries the house-style ''(amends Decision 153)'' parenthetical, because extract_supersession_edges returns a DEDUPED SET of (superseder, victim, file) triples and therefore collapses the heading phrase and the envelope entry into that same single edge (coordinator pivot P2). Decision 73 gets no edge at all -- the entry cites it and narrows its enforcement in prose while never writing an _EDGE_RE-matching phrase for any number other than 153. AGENTS.md, docs/DECISIONS_ARCHIVE.md, .claude/skills/planning/SKILL.md, config/prose_budgets.yaml, scripts/checks/_budget_recs.py, tests/checks/test__budget_recs.py, the selector (scripts/checks/deps/affected_tests.py) with its CAP and its loud defer notice, registry.py and .github/workflows/ci.yml all stay byte-identical.'
