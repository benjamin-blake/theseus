schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "close-ci-rca-terraform-apply-and-convergence-advisory"
intent: >-
  Close the three ci-rca recs hard-blocking the /plan queue with permanent, mechanically-checked
  fixes: a state-serial precondition guard against the SPLIT-APPLY/gated-apply race that caused
  rec-3956, an argued waiver closing rec-3955 (the correctly-functioning fail-closed consequence),
  and a char-limit fix for rec-3954's independent commit-status overflow defect.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-close-ci-rca-terraform-apply-and-convergence-advisory.yaml
phase: >-
  ci-rca closure (soft-warn exception category); no open platform roadmap tier_item claimed --
  T2.46 (apply-chain consolidation / DEP-07 digest integrity) is already met and this plan adds a
  sibling integrity check in the same file family, it does not reopen T2.46's criteria.
scope:
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      Add a state-serial precondition step before both verbatim-apply sites (push-path
      apply-sandbox job's apply step, and gated-apply job's apply step) that fails closed with a
      distinguishable PLAN_STALE_CONCURRENT_WRITER marker before terraform apply runs; explicitly
      exclude the new step from the Decision 154 pre-apply-failure allow-list so a genuine
      concurrent-writer race still latches red (never downgrades to infra_error).
  - file: scripts/ci/state_serial_guard.py
    action: Create
    purpose: >-
      Pure, unit-testable module (mirrors scripts/ci/plan_digest.py's emit/verify shape, DEP-07
      precedent) comparing plan.bin's embedded prior-state serial against the live tfstate serial;
      raises a distinguishable error on mismatch, no I/O in the compared logic itself.
  - file: tests/test_state_serial_guard.py
    action: Create
    purpose: Unit-prove the match/mismatch/malformed-input branches of state_serial_guard.py.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Extend the EXISTING Decision 183 SPLIT-APPLY step (not the separate Decision 178 clause 4
      PRE-APPLY step, which stays scoped to grant-narrowing races) with one bare-action clause:
      after the out-of-band apply lands, reject rather than approve any pending gated-apply run
      covering the same targeted resource. Action-only wording; no guard-classification rationale
      restated here (Decision 86 no-drift; environment-taxonomy.yaml stays sole SoT).
  - file: scripts/ci/convergence_advisory.py
    action: Modify
    purpose: >-
      Shorten classify()'s pending_gated and pending_codification description templates so they
      stay within GitHub's 140-char commit-status description limit with realistic-length data.
  - file: tests/test_convergence_advisory.py
    action: Modify
    purpose: >-
      Add the two test methods rec-3954's stored acceptance already names, using realistic-length
      fixtures (40-char SHA, full ISO-8601 timestamp with offset).
bundled_recommendations: ["rec-3956", "rec-3954"]
followon_recs: []
infrastructure_dependencies:
  - "terraform-apply-sandbox.yml gated-apply / apply-sandbox jobs (workflow-only change, no .tf resource change; CI-delegated verification per Decision 119)"
acceptance_criteria:
  - "A stale plan.bin (state serial mismatch) fails the new precondition step with a PLAN_STALE_CONCURRENT_WRITER marker before terraform apply is invoked, at both verbatim-apply sites."
  - "The new precondition step's failure is excluded from Decision 154's pre-apply-failure allow-list and still latches the convergence record red."
  - "docs/contracts/deploy-paths.yaml's SPLIT-APPLY step names the reject-not-approve action for a redundant pending gated-apply run, in bare-action wording with no restated classification rationale."
  - "convergence_advisory.py's classify() output for pending_gated and pending_codification stays <= 140 chars with a realistic 40-char SHA / full ISO-8601 timestamp."
  - "rec-3956 closes with closure_artifact citing tests/test_state_serial_guard.py and closure_fix_sha = this plan's merge commit."
  - "rec-3954 closes with closure_artifact citing the two named tests/test_convergence_advisory.py node ids and closure_fix_sha = this plan's merge commit."
  - "rec-3955 closes via closure_waiver_category=no_premerge_gate_by_design with an independently-argued closure_waiver_reason (not copied verbatim from its own context field)."
  - "ci_rca_unresolved_recs is empty on the next preflight run after merge."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit-prove state_serial_guard.py's match/mismatch/malformed branches
    command: "bin/venv-python -m pytest tests/test_state_serial_guard.py -q"
    expected: "All new tests pass; mismatch case raises the distinguishable error."
    fix_if: "Any branch misclassifies serial equality/inequality or crashes on malformed JSON."
    hermetic: true
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: Unit-prove convergence_advisory.py's two shortened templates stay under the GitHub limit
    command: "bin/venv-python -m pytest tests/test_convergence_advisory.py::TestPendingGated::test_description_stays_within_github_status_char_limit_with_a_real_sha tests/test_convergence_advisory.py::TestPendingCodification::test_description_stays_within_github_status_char_limit_with_a_real_timestamp -q"
    expected: "Both new tests pass with realistic-length fixtures."
    fix_if: "Either description still exceeds 140 chars with realistic data."
    hermetic: true
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: Confirm the new precondition step is excluded from Decision 154's pre-apply-failure allow-list
    command: "grep -n 'pre-apply-failure' .github/workflows/terraform-apply-sandbox.yml"
    expected: "The enumerated allow-list ({artifact_sha, tfvars, tf_init, build_ducklake, fetch_plan}) does not include the new state-serial step's id."
    fix_if: "The new step id appears in the pre-apply-failure predicate."
    hermetic: false
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: Full presubmit gate
    command: "bin/venv-python -m scripts.validate --pre"
    expected: "Exit 0."
    fix_if: "Any check fails, including SLOC budget or workflow-guard checks."
    hermetic: false
    expected_literals: []
  - step: 5
    phase: post-deploy
    action: Confirm all three ci-rca recs are closed and the planning queue is unblocked
    command: "bin/venv-python -m scripts.session.preflight"
    expected: "ci_rca_unresolved=0 in the printed summary / logs/.preflight-report.json."
    fix_if: "Any of rec-3956/rec-3955/rec-3954 remains open."
    hermetic: false
    expected_literals: []
test_obligations:
  - source: scripts/ci/state_serial_guard.py
    behavior: "A stale (mismatched) state serial is detected and raised before apply; a matching serial passes."
    verification_step: 1
    test_selector: tests/test_state_serial_guard.py
    red_green_expectation: "red before (module does not exist), green after"
  - source: scripts/ci/convergence_advisory.py
    behavior: "pending_gated and pending_codification descriptions never exceed GitHub's 140-char commit-status limit with realistic data."
    verification_step: 2
    test_selector: "tests/test_convergence_advisory.py::TestPendingGated::test_description_stays_within_github_status_char_limit_with_a_real_sha"
    red_green_expectation: "red before (current templates measure 151 chars), green after"
constraints:
  - "No rescue agents or workaround loops (Decision 55) -- this plan fixes root causes, not symptoms."
  - "The new precondition step is a mechanical guard only; it must never be folded into Decision 154's infra_error allow-list (anti-masking, Decision 55/154)."
  - "docs/contracts/deploy-paths.yaml amendment stays action-only; no guard-classification rationale restated (Decision 86 no-drift; environment-taxonomy.yaml sole SoT, Decision 92 point 5)."
  - "rec-3955 must not close as duplicate_of rec-3956 -- ci-rca-lifecycle.yaml deliberately has no such category; it closes on its own waiver."
context:
  - "Decision-scout verdict: FLAGS_FOUND (2 WARN, 1 NOTE, all incorporated directly, no BLOCK; no re-dispatch needed). CITE: 55, 72, 92, 126, 128, 144, 154, 156, 158, 180, 183, 190, 86."
  - "gates: decision-scout=FLAGS_FOUND (incorporated); plan-critique=<pending>"
  - "rec-3956/rec-3955 root cause verified live: GitHub Actions run 35511816976/job 106081098650 timeline (queued 2026-09-20T12:52:54Z, approved+started 17:14:43Z, failed 17:15:29Z) confirms the gated-apply human-approval wait window contained PR #1223's SPLIT-APPLY out-of-band admin apply (PLAN-datalake-read-visibility.yaml's own FIXTURE SEQUENCING note dates it before PR #1224's 13:44:40Z commit) -- the two applies did overlap, confirming the task's root-cause hypothesis rather than falsifying it."
  - "Convergence record independently verified GREEN at f1a9cb2a (run 35525861643, 2026-09-20T17:29:07Z) via live S3 read -- this is closure-and-permanent-fix, not incident response."
  - "Decision 190 names this exact split-apply race pattern's second occurrence (2026-09-04, Decision 183); this filing (2026-09-20) is arguably its third, now surfacing at gated-apply's own verbatim-apply step rather than the scheduled drift classifier -- worth stating in the PR body for institutional memory."
  - "rec-3955 fingerprint 9a739ef9b5211cf685f571be3b63f8be386543835e8f91fde59bada822089ee1 matches CLOSED rec-2862 (fixed_by_sha stamped); ancestry check correctly re-filed as a fresh REGRESSION (not a chain bump) since 7f27063c is not a descendant of rec-2862's fix -- the mechanism is working as designed, not defective."
  - "docs/contracts/ci-rca-lifecycle.yaml closure_obligation: duplicate_of is deliberately absent from waiver_categories -- rec-3955 closes on its own no_premerge_gate_by_design waiver, never as a duplicate of rec-3956."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - "Decisions 55, 72, 92, 126, 154, 156, 158, 180, 183, 190 sections read"
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Create scripts/ci/state_serial_guard.py: pure compare function + CLI, mirroring plan_digest.py's emit/verify split."
  - "Add tests/test_state_serial_guard.py covering match, mismatch, and malformed-JSON branches."
  - "Modify .github/workflows/terraform-apply-sandbox.yml: add the precondition step before both verbatim-apply sites; explicitly exclude its step id from the Decision 154 pre-apply-failure predicate."
  - "Modify docs/contracts/deploy-paths.yaml: extend the existing Decision 183 SPLIT-APPLY step with the reject-not-approve clause, bare-action wording only."
  - "Modify scripts/ci/convergence_advisory.py: shorten the two description f-strings to fit 140 chars with realistic data."
  - "Modify tests/test_convergence_advisory.py: add the two named test methods with realistic fixtures."
  - "Execute Verification Plan steps 1-4; loop until pass."
  - "Close rec-3956 and rec-3954 via the Resolves: trailer on the squash-merge commit (rec-autoclose stamps fixed_by_sha)."
  - "Close rec-3955 via the manual portal route: bin/venv-python -m scripts.ops_data_portal --update-rec rec-3955 --status closed --resolution <live-green-proof> --closure-waiver-category no_premerge_gate_by_design --closure-waiver-reason <independently-argued text>."
  - "Run Verification Plan step 5 (preflight) to confirm ci_rca_unresolved=0."
  - "Report: what was implemented, verification results, and the three rec closures."
work_areas: []
rollback: "Revert the workflow/module/contract changes; the new precondition step is additive and fails closed, so a revert restores prior (weaker but functioning) behavior with no data migration involved."
