    phase: post-deploy
    action: >-
      Re-point rec-2874's fixed_by_sha at the commit that actually removes the fragility, replacing
      b0272f6 (which added rec-autoclose to the ci-rca watched-workflow filter and fixed nothing).
      This is NOT cosmetic -- see the corrected rationale in Context.
    command: 'git fetch origin main --quiet && SHA=$(git rev-parse origin/main) && bin/venv-python -c "import sys; from scripts.ops_portal.ci_rca_lifecycle import stamp_fixed_by_sha; stamp_fixed_by_sha(''rec-2874'', sys.argv[1]); print(''stamped'', sys.argv[1])" "$SHA"'
    expected: >-
      Prints "stamped <sha>" where <sha> is the freshly-fetched main tip -- this plan's
      server-side squash-merge commit, absent an intervening merge. Either satisfies the
      classify_closed_head ancestry purpose; rec-2874's context_v2_json.fixed_by_sha then equals it.
    fix_if: >-
      The explicit `git fetch origin main` is mandatory and must not be dropped: the squash-merge
      happens server-side via merge_pull_request, so without it `git rev-parse origin/main` returns
      the STALE local remote-tracking ref -- which at plan time is f550d15, the very red commit this
      plan exists to clear. If the printed sha equals f550d15 (or any pre-merge tip), the fetch was
      skipped; re-fetch and re-stamp. Separately, stamp_fixed_by_sha raises if rec-2874 is absent
