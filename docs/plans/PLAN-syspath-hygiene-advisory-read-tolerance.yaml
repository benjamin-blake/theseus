schema_version: 2
slug: "syspath-hygiene-advisory-read-tolerance"
intent: >-
  Clear the red main tip by making a sys.path-dependent test robust, remove the repo-wide ambient
  duplicate-path pollution that broke it, and stop a transient warehouse-read blip on the DCG-03
  orphan guard from failing an ops job that did all of its real work correctly -- so post-merge
  failures are attributed to the thing that actually failed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-syspath-hygiene-advisory-read-tolerance.yaml
phase: >-
  Phase Platform -- CI-RCA remediation lane (Decision 72 RCA-as-plan-source). Not a tier_item;
  intent falls under the ci_rca soft-warn exception category, so the Tier Item Freshness Gate is
  skipped by construction.

scope:
  - file: tests/test_build_lambda_config.py
    action: Modify
    purpose: >-
      Fix test_sys_path_injection_when_root_absent (rec-2876). The setup calls
      sys.path.remove(root_str) exactly once, but list.remove() drops only the FIRST occurrence,
      so with N ambient copies of the repo root the following `assert root_str not in sys.path`
      fires. Drain EVERY copy (`while root_str in sys.path: sys.path.remove(root_str)`), save the
      original occurrence COUNT, and restore exactly that many copies in the finally block. The
      existing finally restores at most one copy, which is also wrong under N>1 and is corrected
      by the same change. This is the load-bearing fix that unreds main.
  - file: tests/test_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      DELETE the unconditional module-scope `sys.path.insert(0, str(ROOT))` outright. Plan-critique
      round 4 established it is DEAD CODE, not merely unguarded: tests/__init__.py exists, so
      pytest's default prepend import mode already puts the repo root on sys.path, and 264 of the
      273 test files that import scripts.* carry no sys.path line at all. Verified decisively on an
      origin/main worktree -- stripping this exact line leaves all 39 tests in the file green.
      Deleting is strictly better than guarding: it satisfies acceptance criteria 2 and 3 trivially,
      removes the bare-re-indent hazard this plan names, and leaves nothing for a future reader to
      re-unguard. Keep the ROOT binding (used elsewhere in the file); run `ruff check --fix`
      afterwards to drop the now-unused `import sys` (its only use was this line).
  - file: tests/test_ci_rca_vacuous_pass.py
    action: Modify
    purpose: >-
      Same deletion as tests/test_ci_rca_taxonomy.py -- the insert is dead code under pytest's
      prepend import mode. ROOT is used elsewhere; `import sys` becomes unused, so run `ruff check --fix`.
  - file: tests/test_ci_claude_p_retry.py
    action: Modify
    purpose: >-
      Same deletion as tests/test_ci_rca_taxonomy.py -- the insert is dead code under pytest's
      prepend import mode. ROOT is used elsewhere (it feeds WRAPPER) and MUST be kept; `import sys` becomes unused, so run `ruff check --fix`.
  - file: tests/test_ci_rca_tier_map.py
    action: Modify
    purpose: >-
      Same deletion as tests/test_ci_rca_taxonomy.py -- the insert is dead code under pytest's
      prepend import mode. ROOT and `sys` are both used elsewhere in the file; no import cleanup needed.
  - file: tests/test_verification_checks.py
    action: Modify
    purpose: >-
      Same deletion, applied to the inline `sys.path.insert(0, str(Path(__file__).parent.parent))`
      form. This file has no ROOT local, so there is nothing to preserve; Path stays (7 other uses)
      and `import sys` becomes unused, so run `ruff check --fix`.
  - file: tests/test_ci_rca_evidence_ast.py
    action: Modify
    purpose: >-
      Same deletion as tests/test_ci_rca_taxonomy.py -- the insert is dead code under pytest's
      prepend import mode. ROOT and `sys` are both used elsewhere in the file; no import cleanup needed.
  - file: scripts/session/postflight.py
    action: Modify
    purpose: >-
      Guard the unconditional module-scope `sys.path.insert(0, str(Path(__file__).resolve()
      .parent.parent.parent))` at line 46. Added after plan-critique round 1 measured that the
      pollution is NOT confined to tests/: a pytest run collecting none of the six tests/ modules
      still accumulated 5 repo-root copies, sourced from this file and the two below.
      compute_affected_artifacts returns {} for all three, so no tier escalation and no deploy leg.
  - file: scripts/roadmap/plan_audit.py
    action: Modify
    purpose: Guard the unconditional module-scope `sys.path.insert(0, str(ROOT))` at line 30.
  - file: scripts/agent_development/run_skill.py
    action: Modify
    purpose: Guard the unconditional module-scope `sys.path.insert(0, str(ROOT))` at line 30.
  - file: tests/test_syspath_hygiene.py
    action: Create
    purpose: >-
      Behavioural regression guard proving the fix actually works, not merely that the source looks
      different. Asserts that re-executing each of the nine module bodies -- the six whose inserts
      are DELETED and the three whose inserts are GUARDED -- adds ZERO additional copies of the repo
      root to sys.path. Measured baseline at plan time: each of the nine adds exactly 1, and the six
      tests/ modules together take the count from 1 to 7. Deliberately covers all nine rather than
      only the three guarded ones: for the deleted six it is a standing guard against anyone
      re-adding the dead insert, and it costs nothing. For the three guarded ones it is the only
      check that distinguishes a real guard from a bare re-indent, which the grep-shaped step 2
      cannot catch. MECHANISM IS PINNED: re-execute each module body via
      importlib.util.spec_from_file_location + exec_module. Do NOT use `import tests.test_X`
      (Decision 131's cross-test-import guard, scripts/checks/hygiene/validate_no_cross_test_imports.py,
      forbids it on an AST match of ast.Import/ast.ImportFrom) and do NOT use importlib.reload (it
      requires a prior import, so it inherits the same violation). spec+exec_module was verified
      working on all nine files.
  - file: scripts/ops_portal/reader_transient.py
    action: Create
    purpose: >-
      Sole home for `is_reader_unavailable(exc) -> bool`, the deterministic classifier for a
      transient DuckLake reader outage: requests.ConnectionError/Timeout, or a RuntimeError whose
      message matches the reader's transient status set with NO structured `error_type` marker (a
      structured handler error, or any 4xx, is NOT transient and still gates). Extracted verbatim
      in behaviour from the already-landed private copy at scripts/data_quality_execute.py:76.
      Its docstring states plainly that a 502 indicates transient unavailability and is NOT
      reliably a cold-resume signal -- the framing this incident disproved. Homed in
      scripts/ops_portal/ beside its writer-side counterpart writer_transport.py; deliberately NOT
      in src/, because the two active manifests that wildcard-include `src/` (data-pipeline,
      ops-compaction; seven manifests are active in total) would package any new src/ file and
      escalate this plan to V3 with two production Lambda build/deploy/smoke-test legs for a
      pure-logic helper.
  - file: scripts/data_quality_execute.py
    action: Modify
    purpose: >-
      Import is_reader_unavailable from scripts.ops_portal.reader_transient and delete the local
      _is_reader_unavailable and _TRANSIENT_HTTP_RE definitions. Behaviour must be unchanged; this
      is a de-duplication so the transient semantics cannot drift between the two consumers.
  - file: scripts/ops_portal/decisions.py
    action: Modify
    purpose: >-
      Make the DCG-03 orphan guard tolerant of transient reader unavailability.
      _assert_no_orphaned_current_rows currently lets any RuntimeError from
      active_reader.current_state("ops_decisions") propagate as a fatal invariant violation.
      Wrap ONLY that read: when is_reader_unavailable(exc) is true, emit a distinct, greppable
      marker, mirror it to GITHUB_STEP_SUMMARY when that env var is set, and return without
      running the orphan comparison. Every other exception re-raises unchanged (fail-closed), and
      a genuine orphan still raises exactly as today. The guard's inputs (_orphaned_current_ids,
      _load_orphan_baseline, orphan_baseline.yaml) and its raise-on-genuine-orphan path are
      untouched, and the read stays on the Decision 84 I-3 closed named-verb boundary -- no
      fallback read path, no caller SQL, no new Lambda verb.
  - file: tests/ops_data_portal/test_reader_transient.py
    action: Create
    purpose: >-
      Cover is_reader_unavailable: each member of the reader's transient set classifies transient;
      a transient-status message that ALSO carries an error_type marker does NOT; a 4xx does NOT;
      a non-RuntimeError does NOT; requests.ConnectionError/Timeout DO. GUARD SHAPE IS PINNED
      (plan-critique round 4, B2): the requests dependency MUST be guarded FUNCTION-SCOPED, inside
      the two ConnectionError/Timeout test bodies only -- NEVER a module-scope
      pytest.importorskip("requests"). requests is absent from requirements-fast.txt AND is a member
      of _excluded_heavy_import_names(), so a module-scope skip would skip the WHOLE file in
      pr-validate: VP steps 4 and 5 would become vacuous exit-0 passes under validate_vp_replay, and
      both registry rows would degrade to non-fatal `skipped` via _differential_skip_reason. That
      would silently defeat the derive-the-set parity test, which is this plan's entire anti-drift
      mechanism for the classifier. TestTransientSetParity needs no requests at all and must always
      collect and run. Also
      carries the derive-the-set equality test, the same shape Decision 154 used for
      DUCKLAKE_ARTIFACT_NAMES: the classifier accepts exactly
      src.common.iceberg_reader._READER_TRANSIENT_STATUS and rejects its complement, so the
      authority and the classifier cannot drift. That test MUST be named
      TestTransientSetParity::test_classifier_set_equals_reader_authority -- VP step 5 selects it
      by explicit node id, not by -k. Reading src/ is not modifying it, so this adds no Lambda
      artifact and no tier escalation (confirmed: compute_affected_artifacts over the full scope
      returns {}).
  - file: tests/ops_data_portal/test_decisions_divergence_guard.py
    action: Modify
    purpose: >-
      Add branch coverage for the new tolerance via the existing injectable fake-reader seam, in a
      NEW class named TestTransientReaderTolerance (VP step 6 selects it by node id):
      (a) a reader raising a transient RuntimeError makes _assert_no_orphaned_current_rows return
      without raising AND emit the named marker; (b) a reader raising a non-transient RuntimeError
      still raises; (c) a reader returning a genuine NEW orphan still raises the DCG-03 error.
      Assert on the marker text so the corrected framing (transient unavailability, NOT an
      asserted cold-resume) cannot silently regress.
      ALSO add a second NEW class TestSubstantiveSignalPin with a single test named
      test_rec_autoclose_exits_nonzero_on_failed_rows (VP step 9 selects it by node id).
      MECHANISM IS PINNED (plan-critique round 4, R2) -- the exit expression lives inside a bash
      HEREDOC inside the step's `run:` scalar, so it is NOT a YAML-semantic property and a naive
      yaml.safe_load lookup will not find it. Locate the step by `name: Backfill decisions to
      warehouse`, extract the heredoc body from its `run:` scalar, ast.parse that body, and assert
      a sys.exit call whose argument is an IfExp on result["failed"]. Separately assert from the
      PARSED YAML that the step carries no continue-on-error, that its `run` contains no `|| true`,
      and that its `if:` is still steps.detect-decisions.outputs.changed == 'true' -- the
      WHY-THIS-IS-NOT-MASKING argument depends on the guard and the substantive signal being
      CO-GATED, and an edit to that `if:` would break the co-gating without touching either other
      property. Asserting the parsed/AST form rather than an exact source literal is what stops a
      harmless reflow false-FAILing a standing check. This test is the mechanical backstop for Decision 155 reversal
      condition (c) -- it is deliberately homed here, in the file that owns the tolerance, so that
      whoever weakens the tolerance meets the pin in the same file.

bundled_recommendations:
  - rec-2876

closes_criteria: []

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    test_sys_path_injection_when_root_absent passes when collected alongside every
    sys.path-inserting test module in one worker -- the exact condition that failed CI run
    30223119628 on main tip f550d15.
  - >-
    Zero unguarded module-scope sys.path.insert calls remain anywhere under tests/, scripts/ or
    src/ (measured baseline at plan time: 9 -- six under tests/, three under scripts/).
  - >-
    Re-executing each of the nine guarded module bodies adds zero additional repo-root copies to
    sys.path (measured baseline: the six tests/ modules alone add 6, taking the count 1 -> 7).
  - >-
    The transient-classifier function has exactly one definition, located in
    scripts/ops_portal/reader_transient.py, and its accepted status set is asserted equal to
    src.common.iceberg_reader._READER_TRANSIENT_STATUS rather than restated.
  - >-
    A transient reader outage during the DCG-03 orphan guard produces a named marker and a normal
    return; a non-transient reader error and a genuine NEW orphan both still raise.
  - >-
    scripts/data_quality_execute.py behaviour is unchanged by the extraction (its existing test
    file passes untouched).
  - >-
    The failed-counter exit at .github/workflows/rec-autoclose.yml:156 -- the independent loud
    signal the whole non-masking argument depends on -- is pinned by a NEW graduated test
    (TestSubstantiveSignalPin) that also rejects continue-on-error / `|| true` neutralisation, so
    Decision 155 reversal condition (c) is mechanically enforced rather than asserted in prose. The
    pin is a test rather than a grep so that it is differentially admissible: a grep on an unchanged
    file passes on origin/main and validate_verification_registry rejects such a row as tautological.
  - >-
    No Lambda artifact is affected by this scope, so no build/deploy/smoke-test leg is required
    (compute_affected_artifacts returns {}).

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Reproduce the exact CI failure condition and prove it is fixed -- collect the six
      sys.path-inserting test modules together with the target test in one worker.
    command: >-
      bin/venv-python -m pytest tests/test_ci_rca_taxonomy.py tests/test_ci_rca_vacuous_pass.py
      tests/test_ci_claude_p_retry.py tests/test_ci_rca_tier_map.py tests/test_verification_checks.py
      tests/test_ci_rca_evidence_ast.py
      "tests/test_build_lambda_config.py::TestGetLambdaFilePatterns::test_sys_path_injection_when_root_absent"
      --randomly-seed=12345 -q
    expected: >-
      All collected tests pass. Before the fix this exact command fails with
      "AssertionError: assert '/home/user/agent-platform' not in [...]" (verified at plan time).
    fix_if: >-
      Still failing means the drain loop is absent or the finally block restored the wrong count, or
      a deletion/guard was applied incorrectly and broke a module's own import resolution.
      HONEST SCOPE OF THIS STEP (measured at plan time, round 4): this step verifies the combined
      post-fix END STATE, it does NOT isolate the drain fix. On a worktree with only the six
      deletions and three guards applied -- drain fix absent -- this exact command already PASSES
      (163 passed), because removing the pollution removes the trigger. The step is still a valid
      differential (it exits 1 on plain origin/main) and still the right end-state assertion, but do
      not read it as a regression guard on the drain logic specifically. The drain fix is retained
      as defence-in-depth: it makes the test correct under ANY future ambient pollution source,
      rather than relying on the tree staying clean.
    hermetic: true
    graduation: graduate
    graduation_check_id: "syspath-injection-test-under-polluted-path"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the duplicate-path producer class is gone repo-wide -- no module-scope (column-0)
      sys.path.insert remains under tests/, scripts/ or src/. Exit-code-bearing via grep negation,
      so a surviving producer fails the step (plan-critique round 1, R2).
    command: 'out=$(grep -rEn "^sys\.path\.(insert|append|extend)" tests/ scripts/ src/ --include=*.py); rc=$?; test "$rc" -eq 1 && test -z "$out"'
    expected: >-
      Exit 0 with no output. Baseline at plan time was 9 matches -- six under tests/ and three
      under scripts/ (session/postflight.py:46, roadmap/plan_audit.py:30,
      agent_development/run_skill.py:30). The alternation covers append/extend as well as insert:
      zero of those exist today, so it costs nothing now and closes a permanent blind spot in what
      becomes a STANDING graduated check.
    fix_if: >-
      Any surviving hit re-introduces the ambient duplicate-repo-root condition for every future
      test that reasons about sys.path. Note this step alone cannot distinguish a real guard from
      a bare re-indent -- step 3 is what closes that gap. The exit-code form is deliberate: grep
      returns 0 on match, 1 on clean no-match and 2 on ERROR, so a bare negation would convert a
      grep error (bad path, unreadable tree) into a silent PASS. Only rc==1 with empty output
      passes here.
    hermetic: true
    graduation: graduate
    graduation_check_id: "no-unguarded-module-scope-syspath-insert"
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the guards are behaviourally correct, not merely re-indented -- re-executing each of
      the nine guarded module bodies must add zero repo-root copies to sys.path.
    command: bin/venv-python -m pytest tests/test_syspath_hygiene.py --randomly-seed=12345 -q
    expected: >-
      All pass -- zero additional repo-root copies across all nine modules (measured baseline:
      the six tests/ modules alone add 6).
    fix_if: >-
      A non-zero delta from one of the three scripts/ modules means its guard is cosmetic (e.g. the
      insert was indented under an unrelated block rather than under an `if <root> not in sys.path`
      test), which step 2's grep would wrongly pass. A non-zero delta from one of the six tests/
      modules means its dead insert was re-indented or re-added rather than deleted.
    hermetic: true
    graduation: graduate
    graduation_check_id: "syspath-modules-add-no-duplicate-root"
  - step: 4
    phase: pre-deploy
    action: >-
      Exercise the extracted transient classifier across its full truth table, including the
      negative cases that must still gate.
    command: bin/venv-python -m pytest tests/ops_data_portal/test_reader_transient.py --randomly-seed=12345 -q
    expected: >-
      All pass -- each transient status classifies transient; transient-status-with-error_type
      does NOT; 4xx does NOT; non-RuntimeError does NOT.
    fix_if: >-
      A too-broad classifier would swallow structured handler errors and genuine 4xx failures,
      converting a real defect into a silent skip -- the exact masking Decision 55 forbids.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-classifier-truth-table"
  - step: 5
    phase: pre-deploy
    action: >-
      Close the reader/classifier drift channel -- assert the classifier's accepted set EQUALS
      src.common.iceberg_reader._READER_TRANSIENT_STATUS (derive-the-set, the shape Decision 154
      used for DUCKLAKE_ARTIFACT_NAMES) rather than restating {502,503,504} independently.
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_reader_transient.py::TestTransientSetParity::test_classifier_set_equals_reader_authority"
      --randomly-seed=12345 -q
    expected: >-
      The derive-the-set test passes -- classifier accepts exactly the reader's authoritative set
      and rejects its complement.
    fix_if: >-
      A hard-coded status set in the classifier has diverged from the reader's authority; the
      extraction would then only have de-duplicated the scripts/-side copy while leaving the
      channel that actually matters open (plan-critique round 1, R5). An explicit node id is used
      rather than a -k selector: this repo warns against -k twice (docs/PROJECT_CONTEXT.md,
      tests/CLAUDE.md), and as a GRADUATED standing check a rename would break a -k match silently.
      Keep this justification OUT of the expected field -- validate_vp_replay treats every
      backtick-delimited literal in expected as a string that must appear in captured stdout, so
      prose there becomes a false replay divergence (plan-critique round 3, B2).
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-set-equals-reader-authority"
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the DCG-03 guard tolerates ONLY transient unavailability -- transient skips with the
      named marker, non-transient raises, genuine orphan raises.
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_decisions_divergence_guard.py::TestTransientReaderTolerance"
      --randomly-seed=12345 -q
    expected: >-
      All three new branch cases pass, including the marker-text assertion.
    fix_if: >-
      If the genuine-orphan case stops raising, the Decision 149 DCG-03 invariant has been
      weakened rather than made transient-tolerant, and the change must be reverted. This step
      selects the NEW test class by node id rather than running the whole file: the file is green
      on origin/main, so a whole-file command would PASS on revert and
      validate_verification_registry's differential gate would reject the graduated row as
      tautological (plan-critique round 3, R1). Whole-file regression coverage for this file is
      retained by step 8.
    hermetic: true
    graduation: graduate
    graduation_check_id: "dcg03-orphan-guard-transient-tolerance"
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the transient semantics have exactly one definition AND that it lives in the new
      shared module -- count alone would not prove the old private copy was the one deleted.
    command: 'test "$(grep -rEln "def (_)?is_reader_unavailable|_TRANSIENT_HTTP_RE" scripts/ src/ --include=*.py | grep -v "^scripts/ops_portal/reader_transient.py$" | wc -l)" -eq 0 && grep -qE "def is_reader_unavailable" scripts/ops_portal/reader_transient.py'
    expected: >-
      Exit 0. NO file outside scripts/ops_portal/reader_transient.py mentions the classifier or its
      regex constant, and the new module does define it. Baseline at plan time: exactly one file
      matches (scripts/data_quality_execute.py, lines 20/76/92), so this currently fails.
    fix_if: >-
      A surviving match outside the new module means the local copy in
      scripts/data_quality_execute.py was not deleted, so the two consumers can still drift. This
      form counts FILES rather than pinning an exact line count, so a second legitimate use of the
      regex inside the new module does not break a standing check -- the exact-count coupling
      tests/CLAUDE.md warns about.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reader-transient-classifier-single-definition"
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the extraction did not change data-quality behaviour, and that the directly-touched
      consumer suites still pass together.
    command: >-
      bin/venv-python -m pytest tests/test_data_quality_execute.py
      tests/ops_data_portal/test_decisions.py tests/ops_data_portal/test_decisions_divergence_guard.py
      tests/test_build_lambda_config.py tests/test_plan_audit.py tests/test_run_skill.py
      tests/session/postflight/ --randomly-seed=12345 -q
    expected: All pass with no changes required to tests/test_data_quality_execute.py.
    fix_if: >-
      A data-quality failure means the extracted classifier is not behaviourally identical to the
      private copy it replaced; re-diff the two implementations rather than editing the DQ tests.
      A plan_audit/run_skill/postflight failure means one of the three scripts/ guards broke that
      module's own import resolution. Note the postflight target is tests/session/postflight/ --
      NOT tests/test_postflight_gates.py, which imports scripts.executor.postflight and would never
      exercise the scripts/session/postflight.py actually in scope (plan-critique round 3, B5).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      CORRECTED at plan-critique round 4: an earlier draft claimed this step "passes both before
      and after by construction". That was FALSE and is retracted -- measured on an origin/main
      worktree, this exact command exits 1 (1 failed, 178 passed), failing on
      test_sys_path_injection_when_root_absent because it collects tests/test_build_lambda_config.py
      alongside sys.path-polluting targets. The step IS differentially admissible; it is waived for
      a different and honest reason: it re-proves step 1's guarantee at ~21s where step 1 proves it
      at ~2.8s, so graduating it would add roughly 42s (live + revert legs) to every fast-tier run
      for a signal already graduated. Its genuinely-new half -- collateral-damage regression across
      the DQ / decisions / plan_audit / run_skill / postflight suites -- IS green on origin/main and
      is inherently inadmissible, being a prove-nothing-broke check. The behaviour this plan changes
      is graduated by steps 1-7 and 9.
  - step: 9
    phase: pre-deploy
    action: >-
      Pin the load-bearing structural dependency that makes the whole non-masking argument valid --
      rec-autoclose must still exit non-zero when the backfill reports any failed row. This is the
      mechanical backstop for Decision 155 reversal condition (c), which would otherwise be prose
      that nothing enforces.
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_decisions_divergence_guard.py::TestSubstantiveSignalPin::test_rec_autoclose_exits_nonzero_on_failed_rows"
      --randomly-seed=12345 -q
    expected: >-
      Passes -- the backfill step in .github/workflows/rec-autoclose.yml still exits non-zero when
      the fidelity report reports any failed row.
    fix_if: >-
      A failure means the independent loud signal that justifies skipping the advisory read has
      been removed or weakened, and the DCG-03 skip MUST be reverted in the same change (Decision
      155 reversal condition (c)). Do NOT "fix" this by relaxing the assertion. This is expressed
      as a NEW test rather than a raw grep on an unchanged file for two reasons: (1) a grep pin
      passes on origin/main, so validate_verification_registry's differential gate would reject the
      graduated row as tautological and turn --pre red (plan-critique round 3, B1); a node id
      absent on origin/main fails on revert with exit 4 and is therefore admissible. (2) A test can
      parse the workflow YAML and assert the semantic property tolerant of whitespace and quoting,
      where an exact-literal grep would false-FAIL on a harmless reflow while still false-PASSing
      if someone neutralised the step with continue-on-error or `|| true` -- so the test must also
      assert the step carries neither (plan-critique round 3, R2).
    hermetic: true
    graduation: graduate
    graduation_check_id: "rec-autoclose-failed-counter-exit-present"
  - step: 10
    phase: pre-deploy
    action: Run the authoritative fast-tier presubmit gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: PASS -- ruff, mypy, prompt checks, diff-aware pytest, SLOC and placement guards all green.
    fix_if: >-
      A SLOC failure would mean a scope file crossed its budget; per Decision 128 decompose rather
      than raise. A placement failure would mean scripts/ops_portal/reader_transient.py needs a
      file-router/allowlist entry. A validate_graduation_completeness failure on the implement-PR
      leg means the EIGHT graduated steps (1-7 and 9; step 8 is waived) need their
      matching rows in config/agent/verification_registry/registry.yaml, keyed on plan_slug +
      check_id. Prefer test_selector rows wherever a single node id suffices (steps 3, 4, 5, 6, 9):
      TestSelectorCheck runs sys.executable, whereas bin/venv-python hard-fails in a fresh
      differential worktree that has no .venv. Steps 1, 2 and 7 need ["bash", "-c", ...] under
      command_exit_zero -- none of the command slots use shell=True, and GrepCountCheck reads a
      single file only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the presubmit gate. Graduating it into scripts/verification_checks' registry
      would register the fast tier as a standing check run BY the fast tier -- a circular
      self-invocation, and the same recursion the _VALIDATE_DEPTH guard exists to prevent. Its
      constituent checks are already independently registered; there is nothing left to graduate.
