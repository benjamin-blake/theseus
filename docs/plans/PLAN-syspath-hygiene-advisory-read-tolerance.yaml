      scripts/ops_portal/ci_rca_lifecycle.py has no argparse/__main__, so the importable helper must
      be called directly as above; a `-m` invocation will fail.
  - step: 12
    phase: post-deploy
    action: Confirm the bundled recommendation actually closed after merge (closure obligation).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && test "$(grep -cE '"id": "rec-(2876|2878)".*"status": "closed"' logs/.recommendations-log.jsonl)" -eq 2
    expected: >-
