rollback: >-
  Single-PR revert. The change is purely additive -- a constant, a directory tuple, one extra loop
  in an existing check, three test classes and three registry rows. Reverting restores the
  structure-only check and drops the size assertion; nothing else in the repo depends on the new
  symbols. No data migration, no infrastructure, no deployed artefact, no Decision text to unwind.
  If only the executor-directory coverage proves problematic post-merge (for example if that surface
  is retired), the narrower rollback is to drop that one entry from `_SIZE_GOVERNED_PROMPT_DIRS`
  and its corresponding test class, leaving the scheduled-directory ceiling live.
