schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: prompt-size-enforcement
intent: >-
  Close audit finding SGE-06: Decision 43's `.prompt.md` 3,000-line governance row is live over 12
  tracked files and enforced by nothing. Give the live row a live gate by adding a raw-line size
  assertion to the ALREADY-registered validate_prompt_files check, covering BOTH governed prompt
  directories, while leaving the scheduled-format structure contract scoped where it belongs.
  Restores the declared-equals-actual governance property (NS.4 agent-first governance) that
  Decision 146 corrected for the decisions file and Decision 130 corrected for the SLOC scan.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-prompt-size-enforcement.yaml
phase: >-
  Platform governance-integrity. Slice D of the structural-size-governance-expansion overseer run,
  driving audit finding SGE-06 from audits/size-governance-expansion-3dee4a5.yaml (merged in #840)
  to completion. Audit-sourced, no tier_item id and no product-roadmap phase dependency. Sized XS
  by the audit and kept XS here: three files, no new check name, no new Decision.

scope:
  - file: scripts/checks/prompts/validate_prompt_files.py
    action: Modify
    purpose: >-
      Add `_MAX_PROMPT_LINES = 3000` (Decision 43's row, RAW lines) and
      `_SIZE_GOVERNED_PROMPT_DIRS` -- a tuple of two path-part tuples: (".github", "prompts",
      "scheduled") and ("config", "agent", "executor", "prompts"). Sweep BOTH directories for
      `*.prompt.md`, count `len(content.splitlines())`, and append an error naming the file, its
      measured line count and the limit when a file exceeds it, with strict `>`. This mirrors
      Decision 114's `_ROADMAP_MAX_LINES` precedent verbatim in shape (module constant inside an
      already-registered check, `len(text.splitlines())`, strict `>`, governing Decision named in
      the failure message) -- verified in source at
      scripts/checks/roadmap/validate_platform_roadmap.py:13-22. ALSO generalise the EXISTING
      zero-file guard ("no *.prompt.md files found under {dir}") from the scheduled directory alone
      to EVERY entry of `_SIZE_GOVERNED_PROMPT_DIRS`, so an empty governed directory fails the check
      itself rather than passing vacuously -- this is an extension of behaviour the check already
      has for one directory, not a new invention, and it fires on every PR because the check carries
      no pre_globs. CRITICAL SCOPE SPLIT: the EXISTING H1 / section-heading /
      dead-relative-reference structure contract stays scoped to `.github/prompts/scheduled/` ONLY.
      Layer-5 executor prompts are size-governed but NOT structure-governed. Both directory paths
      must be built from `_common.ROOT` (never recomputed)
      so the single `scripts.checks._common.ROOT` patch target intercepts both -- Decision 104, and
      the seam all 8 existing tests in this file already use. 40 SLOC today; must stay under 500 and
      must NOT be registered in config/sloc_budgets.yaml.
  - file: tests/checks/prompts/test_validate_prompt_files.py
    action: Modify
    purpose: >-
      MOSTLY ADDITIONS, PLUS EXACTLY 3 AMENDMENTS. No existing symbol is removed, so nothing needs
      repointing, but generalising the zero-file guard to both governed directories means the 3
      existing tests that assert a CLEAN result while creating only the scheduled directory must
      also seed one minimal executor prompt: `test_passes_with_h1_and_section`,
      `test_passes_on_live_relative_reference` and
      `test_no_longer_requires_frontmatter_or_intent_section`. The other 5 are unaffected -- the 4
      failure-expecting tests still fail (for their original reason, which must be preserved: assert
      on the error TEXT, not merely on a non-empty failed list, so they cannot pass for the new
      reason instead of the old one) and `test_live_surface_passes_with_nonzero_count` runs against
      the real tree. Add three classes that prove the gate FIRES (see acceptance criteria):
      TestPromptSizeLimit, TestExecutorPromptScope, TestPromptSizeLiveSurface. This is the
      load-bearing half of the slice: a size assertion
      against a population whose maximum is 226 of 3,000 passes trivially, so a test suite that
      only shows green proves nothing. Every oversized fixture is written into `tmp_path` under
      `patch("scripts.checks._common.ROOT", tmp_path)` and NEVER into a live prompt directory --
      see the Decision 48 constraint. 79 SLOC today; keep under 500 (decompose, never register,
      Decision 128).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Land exactly one new row per `graduate`-disposition VP step (three rows: verification steps
      1, 2 and 3). validate_graduation_completeness's implement-PR leg fails any graduate step
      lacking a NEW-IN-DIFF row whose `check_id` AND `plan_slug` both match, so omitting this file
      would make the plan unable to discharge its own graduation obligation (Decision 132). Row
      shape: check_id / primitive_slot (`test_selector` for all three) / guard_target
      (scripts/checks/prompts/validate_prompt_files.py) / guard_symbol (validate_prompt_files) /
      plan_slug (= prompt-size-enforcement) / graduated_at / graduated_by / check_spec.node_id.
      Registry has 294 entries and 294 distinct check_ids today; per-row graduation slugs are not
      registered check names, so three rows against an existing check are schema-valid.

bundled_recommendations: []

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    A `*.prompt.md` of 3,001 RAW lines under `.github/prompts/scheduled/` FAILS
    validate_prompt_files. This is SGE-06's stated acceptance ("a check fails a 3,001-line
    .prompt.md") and the single non-negotiable criterion.
  - >-
    A `*.prompt.md` of 3,001 RAW lines under `config/agent/executor/prompts/` ALSO fails -- proving
    the second governed directory is genuinely swept and not merely named in a constant.
  - >-
    A `*.prompt.md` of EXACTLY 3,000 raw lines PASSES. This proves two things at once: the
    comparison is strict `>` (not `>=`, which would be an off-by-one against Decision 43's row as
    written) and the assertion is not trivially failing everything.
  - >-
    A file under `config/agent/executor/prompts/` with NO H1, NO `## ` section AND a dead relative
    reference PASSES, provided it is under the line limit. The scheduled-format structure contract
    must NOT be imposed on Layer-5 executor prompts -- imposing it would fail files that were never
    meant to conform (implement-step.prompt.md is 9 lines with no `## ` section today).
  - >-
    ANTI-VACUITY, ENFORCED IN THE CHECK ITSELF: validate_prompt_files FAILS when ANY entry of
    `_SIZE_GOVERNED_PROMPT_DIRS` contains zero `*.prompt.md` files. A size gate whose glob matches
    nothing passes trivially and silently; this is what makes a directory rename or relocation red
    on the very PR that causes it, because the check carries no pre_globs and therefore runs in the
    `--pre` tier on EVERY PR. A test-only anchor would not achieve this: the fast tier's pytest step
    is diff-scoped, so a PR renaming a prompt directory need not select this test file.
  - >-
    ANTI-VACUITY, SECOND TIER: the live-surface test additionally asserts each governed directory is
    non-empty under the real `_common.ROOT`, as `> 0` per directory and NEVER as an equality pin on
    the file count (an equality pin becomes a standing tripwire that reds CI the next time a prompt
    is legitimately added or removed).
  - >-
    `_MAX_PROMPT_LINES == 3000` exactly, and the live tree's measured maximum raw line count is
    strictly below it. Enforce Decision 43's row AS WRITTEN -- this criterion is what makes a
    silent widening of the constant fail.
  - >-
    The unit is RAW lines (`len(content.splitlines())`), matching Decision 43's row ("3000 lines")
    and Decision 114's `_ROADMAP_MAX_LINES` precedent. Not effective lines, not bytes, not tokens.
  - >-
    NO new registered check name is minted: `scripts/checks/registry.py`, `scripts/validate.py` and
    `tests/test_checks_registry.py` are byte-identical to origin/main. Enforcement rides the
    already-registered validate_prompt_files, which runs in the `--pre` tier (registry.py:104, no
    pre_globs, so on every PR) and the full tier (registry.py:278), reached through the
    scripts/validate.py:202 facade.
  - >-
    FIXTURE ISOLATION / TIER INTEGRITY: `.github/prompts/scheduled/` and
    `config/agent/executor/prompts/` are byte-identical to origin/main. No oversized fixture leaked
    out of `tmp_path`. This is load-bearing for the declared V2 tier: `.github/prompts/scheduled/`
    is on Decision 48's EXHAUSTIVE V3 scope-trigger list ("deployed to Lambda"), so a fixture
    landing there as a tracked file would flip the plan to V3, break the structure contract, and
    ship a junk file into the scheduled-agent Lambda package.
  - >-
    NO waiver / escape hatch is implemented. There is no `# complexity-waiver:` handling, and no
    marker, comment or config key can admit an oversized prompt file. Authority: Decision 163
    clause 1. The literal divergence from Decision 43's waiver column is recorded in Context, not
    omitted.
  - >-
    Both modified source files stay under 500 SLOC and NEITHER is registered in
    config/sloc_budgets.yaml (decompose by default, never register -- Decision 128).
  - >-
    docs/DECISIONS.md and docs/decisions-index.json are UNTOUCHED. No new numbered Decision is
    minted and no existing Decision body is edited.
  - >-
    config/agent/verification_registry/registry.yaml gains exactly one new row per step whose
    graduation disposition survives the real differential admission gate
    (scripts.verification_graduation.run_differential), each with plan_slug
    `prompt-size-enforcement`: prompt-size-limit-fires-and-boundary,
    executor-prompts-size-only-not-structure, prompt-size-governed-dirs-live-non-empty. A step whose
    differential is REJECTED at implement time is flipped to `waive` with a substantive reason in
    the same PR, per the T3.21 protocol -- never force-landed as a row.
  - >-
    All 8 pre-existing tests in tests/checks/prompts/test_validate_prompt_files.py still pass, 5 of
    them byte-unchanged and 3 amended only by seeding a minimal executor prompt (see the scope row).
    Each of the 4 failure-expecting tests still fails for its ORIGINAL reason -- asserted on the
    error text, not merely on a non-empty failed list, so a test cannot silently start passing for
    the new empty-directory reason instead of the structural one it was written to cover.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the assertion FIRES on an oversized scheduled prompt and does NOT fire at exactly the
      limit. This is SGE-06's acceptance clause turned into an executable check, plus the boundary
      case that distinguishes a real ceiling from an off-by-one.
    command: >-
      bin/venv-python -m pytest
      tests/checks/prompts/test_validate_prompt_files.py::TestPromptSizeLimit -v
    expected: >-
      Exit 0, and the verbose run lists `test_fails_on_oversized_scheduled_prompt`,
      `test_passes_at_exactly_the_line_limit` and `test_fails_when_a_governed_directory_is_empty`
      as PASSED. BACKTICK DISCIPLINE (validate_vp_replay extracts EVERY backticked literal in this
      field, including ones in prose, and requires each in captured stdout+stderr): only test node
      names are backticked here, because the pytest -v run echoes full node ids and nothing else
      from this paragraph. Any tool name, flag or markdown token mentioned in this field stays
      unbackticked deliberately -- a backtick around explanatory prose is a structurally
      unsatisfiable assertion.
    fix_if: >-
      The oversized case passes -- the size sweep never ran, or the glob missed the directory.
      Confirm the sweep builds its path from `_common.ROOT` (the patched seam) rather than a
      module-level absolute path. If the exactly-3000 case FAILS, the comparison is `>=` instead of
      `>`: Decision 43's row is a 3,000-line budget, so 3,000 is compliant and 3,001 is not. If the
      empty-directory case passes, the per-directory non-empty guard was not extended to every
      entry of `_SIZE_GOVERNED_PROMPT_DIRS`.
    hermetic: true
    graduation: graduate
    graduation_check_id: prompt-size-limit-fires-and-boundary
  - step: 2
    phase: pre-deploy
    action: >-
      Prove THE CRITICAL SEAM: the executor prompts directory is SIZE-governed but NOT
      STRUCTURE-governed. Getting this backwards is the single most likely way to ship a broken
      slice, because the scheduled-format contract would fail Layer-5 files that were never meant
      to conform.
    command: >-
      bin/venv-python -m pytest
      tests/checks/prompts/test_validate_prompt_files.py::TestExecutorPromptScope -v
    expected: >-
      Exit 0, and the run lists `test_fails_on_oversized_executor_prompt` (proving the directory IS
      swept for size) and `test_executor_prompts_are_not_structure_checked` (proving an executor
      prompt with no H1, no section heading and a dead relative reference still passes when under
      the limit). Only the two node names are backticked -- see step 1's backtick-discipline note.
    fix_if: >-
      The oversized executor case passes -- `config/agent/executor/prompts` is missing from
      `_SIZE_GOVERNED_PROMPT_DIRS`, or the sweep loop only iterates the first entry. If instead the
      structure case FAILS, the H1/section/dead-reference contract was widened to both directories:
      revert that. The structure loop iterates the scheduled directory alone; only the size loop
      iterates `_SIZE_GOVERNED_PROMPT_DIRS`.
    hermetic: true
    graduation: graduate
    graduation_check_id: executor-prompts-size-only-not-structure
  - step: 3
    phase: pre-deploy
    action: >-
      The SECOND-TIER anti-vacuity anchor, run against the REAL tree with no mocking. The primary
      anchor is now inside the check itself (an empty governed directory fails, covered by step 1);
      this step proves the constant is pointed at something real in the LIVE tree, that the real
      population passes, and that the limit still equals Decision 43's declared 3,000. Steps 1 and 2
      prove the assertion can fire in a synthetic tree; this one proves it is aimed correctly.
    command: >-
      bin/venv-python -m pytest
      tests/checks/prompts/test_validate_prompt_files.py::TestPromptSizeLiveSurface -v
    expected: >-
      Exit 0, and the run lists `test_governed_dirs_are_non_empty_on_the_live_tree`,
      `test_live_tree_max_raw_lines_is_under_the_limit` and
      `test_limit_matches_decision_43_row` as PASSED.
    fix_if: >-
      The non-empty test fails -- a governed directory was renamed, relocated or emptied, and the
      size sweep is now matching nothing (passing vacuously). Update `_SIZE_GOVERNED_PROMPT_DIRS`
      to the directory's new home, or drop the entry deliberately if the surface is genuinely
      retired. Do NOT "fix" it by deleting the assertion -- that assertion is the entire reason
      this slice is not a no-op. If the limit test fails, the constant drifted from Decision 43's
      row: restore 3000, or amend the row first. Assert per-directory counts as `> 0`, never as an
      equality on the file count.
    hermetic: true
    graduation: graduate
    graduation_check_id: prompt-size-governed-dirs-live-non-empty
  - step: 4
    phase: pre-deploy
    action: >-
      Prove fixture isolation (the declared V2 tier depends on it) and that no new registered check
      name was minted.
    command: |-
      set -e
      if ! git diff --quiet origin/main -- .github/prompts/scheduled/ config/agent/executor/prompts/; then
        echo "FAIL: a live prompt directory changed vs origin/main -- a fixture leaked out of tmp_path"
        git diff --stat origin/main -- .github/prompts/scheduled/ config/agent/executor/prompts/
        exit 1
      fi
      leaks="$(git status --porcelain -- .github/prompts/scheduled/ config/agent/executor/prompts/)"
      if [ -n "$leaks" ]; then
        echo "FAIL: uncommitted or UNTRACKED file in a live prompt directory -- a fixture leaked out of tmp_path"
        echo "$leaks"
        exit 1
      fi
      if ! git diff --quiet origin/main -- scripts/checks/registry.py scripts/validate.py tests/test_checks_registry.py; then
        echo "FAIL: registry/validate/check-name surface changed -- no new check name may be minted"
        exit 1
      fi
      echo "fixture isolation clean; no new check name minted"
    expected: "Prints `fixture isolation clean; no new check name minted`; exit 0."
    fix_if: >-
      A live prompt directory changed -- a test wrote its oversized fixture into the real tree
      instead of `tmp_path`. Delete the file and rewrite the test to use the
      `patch("scripts.checks._common.ROOT", tmp_path)` seam the file's 8 existing tests already
      use. This matters beyond tidiness: `.github/prompts/scheduled/` is on Decision 48's exhaustive
      V3 trigger list, so a tracked fixture there flips this plan's tier and ships junk into the
      scheduled-agent Lambda package. The porcelain assertion is the one that catches the realistic
      case -- VP execution precedes commit, so a freshly-written fixture is UNTRACKED, and
      `git diff --quiet origin/main` returns 0 on untracked paths (probed directly at plan time:
      exit 0 with an untracked file present, while `git status --porcelain` reports it). If the last
      assertion trips, the implementation minted a new check name; bind to the already-registered
      validate_prompt_files instead. NOTE ON FORM: the git assertions use
      `if ! cmd; then ...; exit 1; fi`, never a bare `! cmd` statement -- POSIX specifies `set -e`
      is IGNORED for a command whose return value is inverted with `!`, so the bare form silently
      exits 0 even on violation.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      All three halves are one-time properties of THIS diff measured against origin/main, not
      standing invariants -- once merged there is no delta left to measure, so a graduated row would
      assert a vacuous truth on every subsequent run. Compensating control for the durable half:
      an OVERSIZED leaked fixture is caught by this plan's own new size assertion, which is
      registered in both tiers. Stated precisely because an earlier draft of this reason was WRONG:
      it claimed a leak would also fail the pre-existing H1/section structure contract, which is
      false for the fixture shape this plan specifies (`"# t\n\n## s\n" + "x\n" * 2998` carries both
      an H1 and a section heading). The residue this step alone covers is therefore narrow and real:
      an at-limit or under-limit leaked fixture passes both size and structure gates, so the
      porcelain assertion is its only guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Enforce the plan's own SLOC rule against itself: neither modified file crosses 500 SLOC, and
      neither is registered in config/sloc_budgets.yaml.
    command: |-
      set -e
      for f in scripts/checks/prompts/validate_prompt_files.py \
               tests/checks/prompts/test_validate_prompt_files.py; do
        n=$(awk 'NF && $1 !~ /^#/' "$f" | wc -l)
        echo "$f: $n SLOC"
        test "$n" -le 500 || { echo "OVER 500: $f ($n)"; exit 1; }
      done
      if grep -q "validate_prompt_files" config/sloc_budgets.yaml; then
        echo "FAIL: registered in config/sloc_budgets.yaml -- decompose, never register (Decision 128)"
        exit 1
      fi
      echo "sloc discipline OK"
    expected: >-
      Prints each file's measured SLOC, then `sloc discipline OK`; exit 0. Plan-time baseline: 40
      SLOC for the check and 79 for its test file, so there is ~380 lines of headroom on the tighter
      of the two -- this step is a tripwire, not an expected constraint.
    fix_if: >-
      A file crossed 500 -- decompose into a facade package (Decision 80/104/124 pattern), never
      raise. Do NOT add a config/sloc_budgets.yaml entry and do NOT run `--update-sloc-budgets`
      (Decision 128 / B2: it no longer auto-seeds newly-oversized unregistered files, and it strips
      existing raise-approved markers from entries it does rewrite).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates registered checks with strictly worse diagnostics: validate_sloc_limits already
      enforces the 500-SLOC ceiling repo-wide over every gated Python file, and
      validate_sloc_budget_raises already gates registration and increases. This step exists to
      catch the violation locally before CI does, not to add a standing guard; graduating it would
      add a redundant registry row asserting a property two registered checks already own.
  - step: 6
    phase: pre-deploy
    action: >-
      Run the authoritative pre-merge gate over the whole change, then the FULL tier before commit
      per handoff_policy. The full-tier half is a hard mechanized requirement, not a courtesy.
    command: "bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate"
    expected: >-
      Both exit 0. This exact command string is what discharges Decision 163 clause 3: verified
      empirically at plan time against the live matcher -- splitting on the shell separator yields
      ["... --pre" -> False, "... scripts.validate" -> True], so
      validate_handoff_full_tier._has_full_tier_step returns True. Do NOT collapse this to the
      fast-tier half alone; validate_handoff_full_tier is registered in BOTH tiers and would fail
      this plan's own PR. (No prose token in this field is backticked, per constraint 12 -- inert
      today because this step is not hermetic, but it would become a live unsatisfiable assertion
      the moment a future revision flipped that flag.)
    fix_if: >-
      Any check fails. Forward-fix on the branch (Decision 55: no auto-revert, no workaround loop,
      no inline patch around a red gate). Expect validate_test_coverage to be the slow one (the full
      tier runs whole-file per-file coverage, measured at minutes, not seconds); if the full tier
      times out, treat the handoff as blocked per handoff_policy.timeout_disposition and rerun from
      the start rather than committing on a partial pass. The modified check module is NOT in
      config/coverage_baseline.yaml, so it sits at the implicit 100% per-file requirement -- every
      new branch (over-limit, at-limit, per-directory) needs a test exercising it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero but must not be graduated: the full-tier obligation is
      already owned by the registered validate_handoff_full_tier check (Decision 163 clause 2), and
      a registry row that invokes scripts/validate.py would make validation re-enter itself when the
      graduated check is run BY validate.py -- exactly the recursion the _VALIDATE_DEPTH guard
      exists to prevent.

constraints:
  - >-
    IMPLEMENTATION plan type only. STRATEGIC is frozen (Decision 67). The >5-files / >8-steps
    complexity heuristic is suspended during the freeze and does not bind here regardless -- this is
    3 files and 6 steps.
  - >-
    SCOPE SPLIT, non-negotiable: the H1 / `## ` section / dead-relative-reference structure contract
    stays scoped to `.github/prompts/scheduled/`. Layer-5 executor prompts under
    `config/agent/executor/prompts/` are SIZE-governed only. Widening the structure contract to
    both directories would fail files that were never meant to conform and is the single most
    likely way to break this slice.
  - >-
    Enforce Decision 43's row AS WRITTEN: RAW lines, limit 3000, strict `>`. Not effective lines,
    not bytes, not tokens. Do not re-derive the unit -- Decision 114's `_ROADMAP_MAX_LINES` is the
    affirmative precedent (module constant, `len(text.splitlines())`, strict `>`) and re-opening
    the unit question would re-litigate the audit, which is forbidden.
  - >-
    NO waiver, marker, comment or config key may admit an oversized prompt file. Authority is
    Decision 163 clause 1 (an obligation whose owner would never grant an exception is enforced by
    removing the exception path, not by building a gate a future session can argue past) -- NOT
    Decision 102/128, which are SLOC-scoped and do not reach the `.prompt.md` row. See the Context
    entry recording the literal Decision 43 divergence.
  - >-
    NO new registered check name. Enforcement rides the ALREADY-registered validate_prompt_files,
    so scripts/checks/registry.py, scripts/validate.py and tests/test_checks_registry.py must stay
    byte-identical to origin/main (Decision 104; the Slice A precedent from PR #846). A registry
    sequence entry and a validate.py re-export are needed only when minting a NEW check name, and
    this plan mints none.
  - >-
    NO new numbered Decision, and docs/DECISIONS.md / docs/decisions-index.json stay UNTOUCHED.
    Decision 43 already made the commitment; this supplies only its missing gate, which routes to
    the `operational_fact` row of docs/contracts/decision-entry.yaml significance.routing. Header
    headroom is 2 (118 of 120 live). Parallel-safety is the second, independent reason: a sibling
    overseer slice is concurrently authoring Decision 166 and regenerating docs/decisions-index.json,
    which would be a guaranteed textual conflict.
  - >-
    FIXTURE ISOLATION: every oversized fixture lives in `tmp_path` under
    `patch("scripts.checks._common.ROOT", tmp_path)`. NEVER write a fixture into
    `.github/prompts/scheduled/` or `config/agent/executor/prompts/`. Beyond the obvious mess, the
    scheduled directory is on Decision 48's EXHAUSTIVE V3 scope-trigger list ("deployed to Lambda"),
    so a tracked fixture there would flip this plan's verification tier from V2 to V3 and ship a
    junk file into the scheduled-agent Lambda package.
  - >-
    Do NOT add a directory-injection parameter to validate_prompt_files. Both governed paths are
    built from `_common.ROOT`, and patching `scripts.checks._common.ROOT` already redirects both --
    that single-patch-target property is exactly what the Decision 104 `_common` contract exists to
    provide, and it is the seam all 8 existing tests in this file already use. A new parameter would
    be scope creep testing the mechanism rather than the property; verification step 4 pins the
    property instead.
  - >-
    Every backticked literal in a VP step's `expected` field is an ASSERTION, not emphasis:
    validate_vp_replay extracts all of them with `` re.compile(r"`([^`]+)`") `` and requires each to
    appear in the replayed command's captured stdout+stderr. Backtick ONLY strings the command
    genuinely emits (pytest node ids under -v, or an explicit echo). Never backtick a tool name,
    flag, path or markdown token that appears solely in explanatory prose -- see the Context entry
    recording how this defect reached round 1 of the critique.
  - >-
    The 4 FAILURE-EXPECTING existing tests must assert on the ERROR TEXT of their original failure
    reason, not merely on a non-empty `failed` list. Otherwise a test written to cover a missing H1
    could silently start passing for the new empty-directory reason instead, converting real
    coverage into a tautology. (The 3 AMENDED tests are the clean-result ones and have no failure
    reason to assert on; the two sets are disjoint.) MECHANISM, named because the file offers no
    pattern to copy: validate_prompt_files keeps `errors` as a function-local list that is only
    `print()`ed and appends just the sentinel "Prompt file validation" to `failed`, so the error text
    is reachable ONLY through stdout capture -- use `capsys.readouterr().out`, and note that none of
    the 8 existing tests uses capsys today. The four substrings to assert:
    "missing H1 title line"; "missing at least one '## ' section"; "dead reference '"; and
    "no *.prompt.md files found under ".
  - >-
    Decompose, never raise (Decision 128). Both modified files stay under 500 SLOC. Do NOT add a
    config/sloc_budgets.yaml entry and do NOT run `--update-sloc-budgets`.
  - >-
    Every `graduate` VP step needs a matching NEW row in
