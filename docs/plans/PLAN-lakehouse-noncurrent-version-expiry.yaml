execution_steps:
  - >-
    terraform/personal/main.tf -- add resource "aws_s3_bucket_lifecycle_configuration" "data_lake"
    immediately after aws_s3_bucket_policy.data_lake_https_only, keeping the bucket's
    configuration resources grouped. Two rules. Rule "ducklake-prod-noncurrent-expiry":
    filter { prefix = "${local.ducklake_prod_data_prefix}/" }, noncurrent_version_expiration
    { noncurrent_days = 30 }, expiration { expired_object_delete_marker = true },
    abort_incomplete_multipart_upload { days_after_initiation = 7 }. Rule
    "ducklake-smoke-noncurrent-expiry": identical but filtered to
    "${local.ducklake_smoke_data_prefix}/". Both locals are defined in ducklake_lambdas.tf:35,39
    and resolve to "ducklake" and "ducklake-neon-smoke". Declare NO expiration days/date on
    either rule. Carry a comment stating WHY this is not the forbidden age rule (it acts only on
    versions the catalog-aware GC already deleted) and WHY 30 (the S3 recovery window must never
    be shorter than SNAPSHOT_RETAIN_DAYS, or a catalog rollback could reach a snapshot whose
    files S3 has already permanently removed).
  - >-
    ONE AWS API CONSTRAINT TO RESPECT: ExpiredObjectDeleteMarker may not be combined with Days or
    Date inside the SAME Expiration block, but it may coexist with NoncurrentVersionExpiration
    and AbortIncompleteMultipartUpload in the same rule. terraform validate will not catch a
    violation -- the AWS API rejects it at apply. If the CI apply returns
    MalformedXML or InvalidRequest naming the expiration element, split each rule in two (one
    carrying noncurrent_version_expiration, one carrying the delete-marker cleanup) rather than
    dropping either behavior.
  - >-
    tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py -- delete
    test_no_lifecycle_configuration_targets_the_data_lake_bucket and replace it with four methods
    on TestProductionGcRuleInvariants: (a)
    test_no_current_version_expiration_targets_the_data_lake_bucket, (b)
    test_data_lake_lifecycle_rules_are_lakehouse_prefix_scoped, (c)
    test_data_lake_noncurrent_version_rule_exists, (d)
    test_noncurrent_days_is_at_least_snapshot_retain_days. Keep the existing whole-directory
    sweep over terraform/personal/*.tf so a future rule added in another file is still seen.
  - >-
    IMPLEMENTER TRAP for assertion (a): `noncurrent_days` and `days_after_initiation` BOTH
    contain the substring "days", so a whole-resource substring test would false-positive on the
    very rule being added. The assertion MUST be scoped to the `expiration { ... }` sub-block.
    Generalize the existing brace-balanced _find_resource_block helper (line 74) into a small
    keyword-block slicer that takes a block body and a keyword, then assert no `days`/`date`
    attribute inside the sliced expiration block. Assertion (d) must read SNAPSHOT_RETAIN_DAYS
    from src/common/ducklake_maintenance.py rather than hardcoding 30 -- import it, or parse the
    literal -- so the two constants cannot drift apart silently.
  - >-
    config/agent/verification_registry/entries/ -- git mv
    gc-ops-rule-state-and-no-lakehouse-lifecycle.yaml into deprecated/ unchanged, then create
    gc-ops-rule-state-and-lakehouse-noncurrent-expiry.yaml with check_id matching its filename
    (the placement leg of validate_verification_registry requires filename == check_id),
    primitive_slot command_exit_zero, guard_target terraform/personal/main.tf, plan_slug
    lakehouse-noncurrent-version-expiry, graduated_at the implementation date, and a check_spec
    listing the five surviving selectors plus the four new ones.
  - >-
    docs/DECISIONS.md -- append a dated amendment annotation to Decision 192 using an
    amendment_forms shape (e.g. "> **Amended by PLAN-lakehouse-noncurrent-version-expiry
    (2026-09-18):** ..."), as its own line(s), editing no existing clause text. It must state:
    (i) the forbidden rule is a CURRENT-VERSION age expiration, which remains forbidden; (ii) a
    noncurrent-version expiration is categorically distinct because it acts only on versions the
    catalog-aware GC already deleted, so the constraint's INTENT is preserved while its letter is
    narrowed; (iii) the retention window is floored at SNAPSHOT_RETAIN_DAYS and that floor is now
    mechanically asserted; (iv) the RESIDUAL -- list_storage
    (src/common/ducklake_maintenance.py:199) uses list_objects_v2, so BOTH GcDebtRatio and G4's
    byte cap (Decision 193 cl.1) remain current-versions-only and under-report for the length of
    the retention window; the G1 safety invariant is unaffected.
  - >-
    Portal writes (Decision 84, never a direct JSONL edit). First, update_rec on rec-3870 so its
    "EFFICACY HALF IS PARTLY BLIND" caveat records that the lifecycle rule landed and that the
    residual is now a bounded ~4-cycle lag rather than unbounded invisibility. Then file_rec
    TWICE -- call get_rec_write_guidance() first (Decision 66 Precision Context Injection) -- for
    (1) the unrehearsed delete-marker-removal data-file recoverability drill, noting that the
    lifecycle rule BOUNDS rather than removes the rehearsal window, so every future gc_ops delete
    stays rehearsable for 30 days; and (2) a GcNoncurrentBytes metric sourced from
    ListObjectVersions to make the GcDebtRatio and G4 blind spot measurable, noting it requires
    s3:ListBucketVersions and a governed Lambda code-deploy. Record both allocated ids in this
    plan's followon_recs and commit that edit.
  - >-
    Execute the Verification Plan -- run each step; loop until pass. On an unrecoverable V3
    failure stop and RCA (Decision 55), never patch inline.
  - >-
    Commit with a body stating the Decision 181 re-scoping rationale explicitly, and a
    "Resolves: rec-3907" trailer so rec-autoclose fires on the squash merge.
  - "Report: what was implemented, verification results, the two follow-on rec ids, and the step-7 baseline counts."
rollback: >-
  Delete the aws_s3_bucket_lifecycle_configuration.data_lake resource and re-open the PR; the
  destroy routes through the Decision 77 guard to tf-gated-apply (human-approved), since a
  lifecycle destroy is a delete action. Rolling back does NOT restore already-expired noncurrent
  versions -- they are permanently deleted once the 30-day window elapses, which is the point of
  the change. The guard narrowing must be reverted in the same commit as the resource, or the
  four positive assertions fail against a tree with no lifecycle rule.
