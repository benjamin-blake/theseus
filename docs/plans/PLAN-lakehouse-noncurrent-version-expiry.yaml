pre_implementation_checklist:
  - Branch confirmed not on main (harness-assigned session branch)
  - docs/PROJECT_CONTEXT.md read
  - "Only the plan-cited decision sections read: 192, 193, 189, 177, 181, 187, 132, 186, 167, 128, 126, 119, 77, 55"
