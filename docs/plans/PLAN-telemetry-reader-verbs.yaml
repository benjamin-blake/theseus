  action: The preflight gauge is tri-state from one reader call.
  command: >-
    bin/venv-python -m pytest
    tests/session/preflight/test_telemetry_health.py::test_pass_when_sessions_hold_rows
    tests/session/preflight/test_telemetry_health.py::test_unpopulated_when_sessions_are_empty
    tests/session/preflight/test_telemetry_health.py::test_unavailable_carries_null_counts_never_zero
    tests/session/preflight/test_telemetry_health.py::test_exactly_one_reader_call
