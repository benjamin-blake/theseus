schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-reader-verbs
intent: >-
  The telemetry read layer (rec-4291): give the shared ducklake_reader read access to the telemetry catalog through a
  second, isolated warm connection and an event-journal named-verb form, and ship the contract-named derived-state verbs
  (session state and duration, process-event, friction and agent-run roll-ups, the bounded sessions window, reported model
  cost) plus a metadata-only telemetry health verb and its preflight gauge. Telemetry state is then derived at read through
  the closed named-verb boundary (Decision 199 cl.1, Decision 84 I-3), every response reports generations and grain
  conflicts instead of resolving them (Decision 207), and slice 4 (rec-4025) has verbs to verify.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-reader-verbs.yaml
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake), the telemetry read layer (rec-4291; Benjamin, 2026-10-14,
  cmsg_012XgaFy8VaDQbxP5D8nC958GgNiPNy3uHRFLovP66hD4X). Closes T2.36:c3 ("Preflight telemetry health check re-enabled
  against the ducklake_reader boundary; telemetry-store preflight reports PASS when tables are populated"): the preflight
  gauge reads the smoke telemetry tables through the deployed reader and reports pass over the rows plan 3 part 2's smoke
  gate (PLAN-telemetry-append-inline, merged #1477) writes. get_blob is the one remaining rec-4291 item, in a follow-up
  blob read plan built after plan 4. T2.52 c3 is not closed and T2.52 gains no dependant (Decision 93): sessions_window is
  the operator's reader-k2 (a) verb (2026-10-04), built in the reader.
closes_criteria:
- T2.36:c3
scope:
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: >-
    Named warm-connection slots: get_warm_connection gains slot (default "ops", so every existing caller, the telemetry
    writer included, is unchanged); each slot keeps its own key, liveness probe, dead-session reopen and connect meta; a
    reopen of one slot never closes the other; reset_warm_connection(slot=None) drops one slot or all. open_connection
    gains alias (default CATALOG_ALIAS) and TELEMETRY_CATALOG_ALIAS = "telemetry_catalog" is added. No import of any
    src.telemetry or event-read module: the event-read modules ship in the reader bundle only, so the five other DuckLake
    bundles that carry ducklake_runtime need no new file (and the scripts-never-import-telemetry-append fence holds).
- file: src/common/ducklake_event_reads.py
  action: Create
  purpose: >-
    The event-journal read mechanism: the frozen EventRead type (verb, tables, sql template, params, binding session or
    window, max_window_days, data, description, paginable, agent_facing); parameter validation before any SQL (session_id a
    canonical 26-character ULID, as_of a tz-aware ISO-8601 timestamp, day_from/day_to ISO dates with day_to - day_from + 1
    <= max_window_days; errors name the parameter, never the value); the smoke-pin refusal; the partition binding (the
    session_id's 48-bit time prefix decoded with src.telemetry.identity.decode_time_prefix to its UTC calendar day,
    rendered as a bound session_started_at range plus the bound session_id; a window as a bound day range); the one
    rendered R4/R5 dedupe fragment and the pre-retirement conflict report (Decision 207), compared over every stored
    column except created_timestamp, producer_version and the row rules' representation-only columns
    (src.row_rules.RowRules.from_projection over the field_semantics event projection, never src.telemetry.append);
    event_read_version (sha256 over verb, tables, params, binding, max_window_days, paginable, normalised SQL template,
    canonical JSON of data, and the compared-column set per table); describe_event_reads (the describe rows: the ops
    keys plus kind event_journal, tables, catalog telemetry, binding and max_window_days, table = the first table);
    execute (one SQL statement per call, values bound). Imported by the reader handler only.
- file: src/common/ducklake_event_read_verbs.py
  action: Create
  purpose: >-
    The registry data and verb SQL: IDLE_THRESHOLD_SECONDS = 86400; the friction rules block (classifier_version 1,
    repeat_threshold 3, run rule repeated_tool_failure, rules r01-r04 and r90-r94 from
    docs/plans/reports/REPORT-w1-friction-classifier.md section 2); MAX_WINDOW_DAYS = 7; and the EVENT_READS entries
    session_state_and_duration, session_process_event_rollup, session_friction_rollup, agent_run_state_and_duration,
    agent_run_token_rollup, model_call_cost_estimate, sessions_window, sessions_window_all_purposes,
    telemetry_health_count, each rendering the shared dedupe fragment and returning derived rows only (never a raw row,
    transcript content or free text, Decision 209 cl.2a). Pure data and strings: no I/O and nothing that can raise at
    import (AGENTS.md Safety).
- file: src/common/ducklake_named_reads.py
  action: Modify
  purpose: >-
    NAMED_READS_VERSION 5 -> 6 (the registry format now spans two verb classes). NAMED_READS itself, read_version and
    describe_named_reads are unchanged, so the 17 ops verbs' read_versions and describe rows are byte-identical; the event
    registry (EVENT_READS) stays in the reader-only module so no other DuckLake bundle has to carry it.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    The reader is the one bundle that composes both registries. A named_read whose verb is in EVENT_READS binds the
    telemetry slot (its opener reads TELEMETRY_META_SCHEMA and TELEMETRY_DATA_PATH at call time, refuses before any
    connect unless they name the smoke catalog, and ATTACHes under TELEMETRY_CATALOG_ALIAS), runs ducklake_event_reads.execute
    and stamps that verb's event_read_version (an event-read input refusal answers through the existing 400 named_read_input
    path, naming the parameter, never its value; the smoke-pin refusal is a 500 runtime error naming rec-4292); every
    other action, query_ops included, binds the ops slot exactly as today;
    the reconnect-once path reopens only the slot in use; describe returns the ops and event rows together (verb names
    disjoint). The response envelope, the typed terminal answers (#1476) and the size guard are otherwise untouched.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: >-
    Includes src/common/ducklake_event_reads.py, src/common/ducklake_event_read_verbs.py, src/telemetry/__init__.py,
    src/telemetry/identity.py and src/telemetry/timestamps.py (all already under the deploy trigger paths); src/row_rules
    is already included.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: Excludes the two new src/common/ducklake_event_read*.py modules by name (DuckLake-bundle only).
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: _NAMED_READS_VERSION_PIN 6 and VERB_FIELDS entries for every event verb's output columns.
- file: scripts/preflight/telemetry_health.py
  action: Create
  purpose: >-
    check_telemetry_health(reader): one telemetry_health_count call, returning the telemetry-store gauge as status pass
    (at least one of the four tables holds a committed row; a non-replayable producer writes no sessions row, envelope R8),
    unpopulated (all four empty) or unavailable (reader error or refusal),
    with per-table counts, and null counts, never 0 or [], when unavailable (Decision 215 cl.2). Never raises.
- file: scripts/session/preflight.py
  action: Modify
  purpose: >-
    Calls check_telemetry_health once per run, prints one telemetry-store line and writes the report's telemetry_health key.
    Reader invocations per session go from five to six (Decision 215 cl.4; its reversal condition is a doubling).
- file: scripts/ducklake_smoke/lambda_ec_gates.py
  action: Modify
  purpose: >-
    lambda_reader also runs the telemetry read checks (so the CI smoke job covers them with no workflow change): describe
    lists the event verbs at kind event_journal; telemetry_health_count answers for all four tables; a well-formed absent
    session_id returns zero rows from session_state_and_duration; a malformed session_id is refused without echoing it; a
    query_ops whose SQL names telemetry_catalog fails because the ops slot never attaches it. Prints TELEMETRY_READS_OK.
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    Documents the event-journal named-verb class, the telemetry slot and its smoke-pin refusal (lifted by slice 2c with
    tenant-scoped reads, rec-4292, Decision 200 cl.2), required as_of, the response stamps, and replaces the query_ops
    declared residual with its closure by construction (Decision 181 cl.2 coverage: the slot-isolation test and the live
    gate). amendment_log entry.
- file: docs/contracts/read-engine.yaml
  action: Modify
  purpose: read_surface.named_verbs.verbs lists the event verbs under their first table (the validate_read_engine_verbs parity list).
- file: scripts/checks/contracts/validate_read_engine_verbs.py
  action: Modify
  purpose: The live grouping is NAMED_READS by table plus EVENT_READS by first table, so the contract cannot drift from either registry.
- file: tests/checks/contracts/test_validate_read_engine_verbs.py
  action: Modify
  purpose: The check fails when an event verb is missing from or extra in read-engine.yaml.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Bookkeeping walk only (tier-item-lifecycle.yaml bookkeeping_walk): flip T2.36:c3 open -> met with met_by this plan,
    move T2.36 not_started -> in_progress, and add a dated progress_note line naming what remains (c1, c2, c4, c5).
- file: tests/common/test_ducklake_event_reads.py
  action: Create
  purpose: Pure mechanism tests (no duckdb at module scope).
- file: tests/common/test_ducklake_event_read_verbs.py
  action: Create
  purpose: >-
    Real local DuckLake integration tests (pinned duckdb and ducklake extension, UTC, inlining off, calendar-day
    partitions): dedupe vectors, golden derivations, friction vectors, window, cost, health, partition-bound file reads,
    VERB_FIELDS parity for event verbs.
- file: tests/fixtures/telemetry_read_lake.py
  action: Create
  purpose: >-
    Shared helper (never a test_ module): builds the four tables plus ops_projects in a local DuckLake via
    tests/fixtures/turn_capture_ducklake.py and loads fixture rows, attached under TELEMETRY_CATALOG_ALIAS.
- file: tests/telemetry/fixtures/derivation_cases.yaml
  action: Create
  purpose: Golden derivation cases with expected rows at two as_of values each.
- file: tests/telemetry/fixtures/friction_vectors.yaml
  action: Create
  purpose: The 17 friction vectors (v01-v17) from REPORT-w1-friction-classifier.md section 2 as a committed fixture.
- file: tests/test_ducklake_named_reads.py
  action: Modify
  purpose: Version pin 6; the ops pinned digests stay unchanged.
- file: tests/common/test_ducklake_runtime.py
  action: Modify
  purpose: Slot independence, per-slot reopen and reset, the alias keyword.
- file: tests/test_ducklake_reader_handler.py
  action: Modify
  purpose: >-
    Slot selection per action and verb; query_ops on the ops slot only; the smoke-pin refusal before any connect; event
    routing and its read_version stamp; describe returns both registries.
- file: tests/common/ducklake_reader_client/test_verb_fields_parity.py
  action: Modify
  purpose: >-
    Version pin 6; VERB_FIELDS keys equal NAMED_READS plus EVENT_READS (ops column parity unchanged; event column parity runs
    in the integration file).
- file: tests/session/preflight/test_telemetry_health.py
  action: Create
  purpose: The tri-state gauge and its one-call budget.
- file: tests/ducklake_neon_smoke_test/test_lambda_ec_gates.py
  action: Modify
  purpose: The telemetry read checks pass on a consistent reader and fail on each named regression.
bundled_recommendations: []
followon_recs:
- rec-4291
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The reader keeps two independent warm connections: an EventRead named_read binds the telemetry slot (ATTACHed under
  telemetry_catalog from TELEMETRY_META_SCHEMA/TELEMETRY_DATA_PATH, opened lazily); every other action, query_ops included,
  binds the ops slot and never opens or reaches the telemetry slot; a dead session reopens only its own slot.
- >-
  Every event verb refuses, before any connection or SQL, unless the telemetry pin names the smoke catalog; the refusal names
  rec-4292 (slice 2c lifts it with tenant-scoped reads, Decision 200 cl.2).
- >-
  NAMED_READS_VERSION is 6; describe lists the nine event verbs with kind, tables, catalog, binding and max_window_days; the 17
  ops verbs' read_versions are unchanged; an event verb's read_version changes when its SQL, any registry datum or any
  compared column changes.
- >-
  Parameters are validated before any SQL and every value is bound, never interpolated: a non-canonical session_id, a naive
  or malformed as_of, a malformed day or a window over its max_window_days each fail naming the parameter and never echoing
  the value.
- >-
  The rendered R4/R5 block passes all 17 committed dedupe vectors on a real local DuckLake with survivors compared by
  (event_id, parser_version) and conflicted grain keys exact, and distinguishes the two mutants the vectors miss
  (keep-lowest version; V* taken from non-open rows).
- >-
  Each derived row carries generations (V* per producer), conflicted_grain_keys and derivation_conflicted; a conflict never
  nulls, drops or errors the derivation.
- >-
  session_state_and_duration matches every golden case in derivation_cases.yaml at both as_of values (resume after close,
  close-last tie, annotate excluded, abandoned past 24 h and not before, a resume reviving an abandoned session,
  multi-producer, sync and async sub-agents from their agent-run pair with failed/timeout/throttled -> failed).
- >-
  session_process_event_rollup, session_friction_rollup (all 17 friction vectors; rework_total, exception_total, per-label
  counts, unmapped_count, classifier_version), agent_run_state_and_duration and agent_run_token_rollup (one count per
  model_call after the entity collapse) match their golden cases.
- >-
  sessions_window returns one derived row per root session of a real-purpose project in the bound day range ordered by
  (session_started_at, session_id), excludes drill and synthetic projects, refuses an eight-day window, and
  sessions_window_all_purposes (not agent-facing) includes all purposes.
- >-
  model_call_cost_estimate returns cost_usd with cost_source reported, allowance (billing_shape
  fixed_non_rollover_allowance, cost NULL) or unpriced (cost NULL), never a 0 standing in for an unknown.
- >-
  telemetry_health_count reads catalog metadata only (no data file) and the preflight telemetry-store gauge is pass (any of
  the four tables populated), unpopulated (all empty) or unavailable from exactly one reader call, with null counts when
  unavailable.
- >-
  The reader bundle carries the new modules and the three src/telemetry stdlib modules; data-pipeline excludes the new
  modules; ducklake_reader.yaml and read-engine.yaml match the registry.
- >-
  After the governed deploy: the CI smoke job's lambda-reader step prints TELEMETRY_READS_OK, an independent live run of the
  same gate passes, the existing reader gates still pass, and the live preflight telemetry-store gauge reports pass over the
  smoke rows plan 3 part 2's gate wrote (T2.36:c3), with T2.36 c3 flipped to met in the roadmap.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The pure event-read mechanism validates, binds, refuses and versions correctly.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_reads.py::test_session_id_must_be_a_canonical_ulid
    tests/common/test_ducklake_event_reads.py::test_as_of_must_be_tz_aware
    tests/common/test_ducklake_event_reads.py::test_window_span_is_capped_per_verb
    tests/common/test_ducklake_event_reads.py::test_errors_name_the_param_never_the_value
    tests/common/test_ducklake_event_reads.py::test_partition_bounds_decode_from_the_session_id
    tests/common/test_ducklake_event_reads.py::test_values_are_bound_never_interpolated
    tests/common/test_ducklake_event_reads.py::test_refuses_unless_the_pin_is_the_smoke_catalog
    tests/common/test_ducklake_event_reads.py::test_read_version_moves_with_every_datum_sql_and_column
    tests/common/test_ducklake_event_reads.py::test_compared_columns_match_the_writer_compare_set
    -q
  expected: Exit 0, every node passes. Red before because the module and nodes are absent.
  expected_literals: []
  fix_if: >-
    A read_version unchanged by a datum edit means the datum is outside the hash; add it. A compared-column mismatch with
    EventTableSpec means reader conflicts and writer grain checks disagree; derive both from the same projection.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-event-reads-mechanism
- step: 2
  phase: pre-deploy
  action: The reader serves both registries at version 6 without re-versioning any ops verb, and the contract parity check covers both.
  command: >-
    bin/venv-python -m pytest
    tests/test_ducklake_named_reads.py::test_registry_version_is_six
    tests/test_ducklake_named_reads.py::test_ops_verb_read_versions_unchanged_by_event_reads
    tests/common/test_ducklake_event_reads.py::test_event_verbs_are_described_with_their_class_and_bounds
    tests/common/test_ducklake_event_reads.py::test_event_and_ops_verb_names_are_disjoint
    tests/test_ducklake_reader_handler.py::test_named_read_routes_event_verbs_to_the_event_executor
    tests/test_ducklake_reader_handler.py::test_describe_returns_both_registries
    tests/checks/contracts/test_validate_read_engine_verbs.py::test_fails_when_an_event_verb_is_undeclared
    -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  expected_literals: []
  fix_if: >-
    An ops digest change means the event class leaked into the NamedRead hash; keep the registries separate. A parity pass
    with an undeclared event verb means the check reads only NAMED_READS.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-event-reads-registry
- step: 3
  phase: pre-deploy
  action: Warm-connection slots are independent and the handler binds the right slot per action.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_runtime.py::test_named_slots_are_independent
    tests/common/test_ducklake_runtime.py::test_dead_slot_reopens_without_evicting_the_other
    tests/common/test_ducklake_runtime.py::test_reset_drops_one_slot_or_all
    tests/common/test_ducklake_runtime.py::test_open_connection_attaches_under_the_given_alias
    tests/test_ducklake_reader_handler.py::test_event_read_binds_the_telemetry_slot
    tests/test_ducklake_reader_handler.py::test_ops_actions_never_open_the_telemetry_slot
    tests/test_ducklake_reader_handler.py::test_query_ops_runs_on_the_ops_slot_only
    tests/test_ducklake_reader_handler.py::test_smoke_pin_refusal_happens_before_any_connect
    -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  expected_literals: []
  fix_if: >-
    Any ops action that opens the telemetry slot reopens the query_ops residual; route it to the ops slot. A reopen that
    closes the other slot breaks Decision 88 cl.1(i); key the probe and reopen per slot.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-reader-slots
- step: 4
  phase: pre-deploy
  action: The rendered dedupe block passes every committed vector on a real local DuckLake and catches both known mutants.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_read_verbs.py::test_rendered_dedupe_passes_every_vector
    tests/common/test_ducklake_event_read_verbs.py::test_dedupe_catches_keep_lowest_and_non_open_generation_mutants
    tests/common/test_ducklake_event_read_verbs.py::test_conflicted_keys_are_reported_never_resolved
    -m integration -q
  expected: Exit 0, every node passes on the pinned duckdb with the ducklake extension.
  fix_if: >-
    A vector failure is a dedupe bug in the rendered fragment; fix the fragment, never the vectors (they are normative). An
    extension INSTALL failure is an environment fault to fix, never a skip (rec-4071).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs duckdb and the ducklake extension, which the fast tier excludes (requirements-fast.txt heavy-exclusion); the full
    tier runs the file on every main build.
- step: 5
  phase: pre-deploy
  action: Every derived verb matches its golden cases on a real local DuckLake.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_read_verbs.py::test_session_state_golden_cases
    tests/common/test_ducklake_event_read_verbs.py::test_sub_agent_state_from_the_agent_run_pair
    tests/common/test_ducklake_event_read_verbs.py::test_process_event_rollup_golden_cases
    tests/common/test_ducklake_event_read_verbs.py::test_friction_vectors
    tests/common/test_ducklake_event_read_verbs.py::test_agent_run_state_and_tokens_golden_cases
    tests/common/test_ducklake_event_read_verbs.py::test_sessions_window_real_projects_only_and_ordered
    tests/common/test_ducklake_event_read_verbs.py::test_cost_source_never_a_false_zero
    tests/common/test_ducklake_event_read_verbs.py::test_health_count_reads_metadata_only
    tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns
    -m integration -q
  expected: Exit 0, every node passes.
  fix_if: >-
    A golden mismatch is a derivation bug: the contract formulas (telemetry_sessions.yaml state, duration_seconds,
    *_total; telemetry_agents.yaml) are normative, so fix the SQL, never the expected rows, unless the case itself
    misreads the contract (then say so in the report).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs duckdb and the ducklake extension, which the fast tier excludes; the full tier runs the file on every main build.
- step: 6
  phase: pre-deploy
  action: A per-session read touches only its own calendar day's data files.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_read_verbs.py::test_session_read_touches_only_its_day_files
    -m integration -q
  expected: Exit 0. The test writes several days of interleaved sessions and asserts the files a per-session verb reads.
  fix_if: >-
    A read of another day's files means the partition binding is missing or not prunable; bind the decoded day range on
    session_started_at.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs duckdb and the ducklake extension (fast-tier heavy exclusion); full tier only.
- step: 7
