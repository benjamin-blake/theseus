- step: 10
  phase: pre-deploy
  action: Every modified or created source file has its test file and full coverage of new code.
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
    src/common/ducklake_runtime.py src/common/ducklake_event_reads.py src/common/ducklake_event_read_verbs.py
    src/common/ducklake_named_reads.py src/common/ducklake_reader_client.py scripts/checks/contracts/validate_read_engine_verbs.py
    src/lambdas/ducklake_reader/handler.py scripts/preflight/telemetry_health.py scripts/session/preflight.py
    scripts/ducklake_smoke/lambda_ec_gates.py
  expected: Exit 0.
  fix_if: A module below 100% on new code needs direct tests in its own file; never add a coverage_baseline.yaml entry (Decision 159).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Coverage measurement re-runs the files' suites; it duplicates the gate the full tier already runs.
- step: 11
  phase: pre-deploy
  action: Lint and run the full tier, as the handoff policy requires before commit.
  command: >-
    bin/venv-python -m ruff check src/common src/lambdas/ducklake_reader scripts/preflight scripts/ducklake_smoke
    scripts/checks/contracts tests/common tests/session/preflight tests/fixtures && bin/venv-python -m scripts.validate
  expected: ruff exit 0, then the full tier ends with "All checks passed." and exit 0.
  fix_if: >-
    Any failure: fix at root and rerun the full tier from the start (handoff_policy). A validate_read_engine_verbs failure
    means read-engine.yaml and the registries disagree; a validate_scope_boundary failure means a touched file is outside
    this plan's scope (stop and escalate, never widen silently).
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded. Read with mcp__github__actions_list (list_workflow_runs, workflow
    deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs for that run, writing the jobs JSON to
    $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
    want=['deploy-serving','smoke'];assert all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: deploy-serving and smoke concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed smoke job is this plan's to root-cause and fix forward, never a re-run to green (Decision 55).
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    The CI smoke job ran the telemetry read checks on the merge commit. Save that run's smoke job log
    (mcp__github__get_job_logs) to $SMOKE_LOG_FILE.
  command: >-
    test -s "$SMOKE_LOG_FILE" && bin/venv-python -c "import os,re;L=open(os.environ['SMOKE_LOG_FILE'],encoding='utf-8',errors='replace').read().splitlines();
    i=next(k for k,l in enumerate(L) if '##[group]Run' in l and '--lambda-reader' in l);
    j=next((k for k in range(i+1,len(L)) if '##[group]Run' in L[k]),len(L));t=chr(10).join(L[i:j]);
    assert 'READER OK' in t and 'TELEMETRY_READS_OK' in t, 'markers';
    assert not re.search(r'(?<![0-9])[0-9]{12}(?![0-9])',t),'12-digit number';assert 'arn:aws' not in t,'ARN';print('SMOKE_LIVE_OK')"
  expected: Both markers in the lambda-reader step's own section, no 12-digit number and no ARN there, then SMOKE_LIVE_OK.
  fix_if: A missing TELEMETRY_READS_OK with READER OK present means the telemetry slot or a verb failed live; read the step log.
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: post-deploy
  action: An independent live run of the reader gate from this session as PlatformDev.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-reader >
    "${TMPDIR:-/tmp}/reader_gate.out" 2>&1 && grep -q TELEMETRY_READS_OK "${TMPDIR:-/tmp}/reader_gate.out" && grep -q
    'READER OK' "${TMPDIR:-/tmp}/reader_gate.out" && echo LOCAL_GATE_OK
  expected: Exit 0, both markers in the captured output, then LOCAL_GATE_OK.
  fix_if: An AccessDenied on the smoke data prefix means the reader role lost its read grant; report it, never widen locally.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: post-deploy
  action: T2.36 c3 live proof -- the preflight telemetry-store gauge reports PASS through the deployed reader.
  command: >-
    bin/venv-python -m scripts.session.preflight > /dev/null 2>&1; bin/venv-python -c "import json;
    h=json.load(open('logs/.preflight-report.json')).get('telemetry_health') or {};print(h.get('status'),h.get('tables'));
    assert h.get('status')=='pass', h;print('GAUGE_LIVE_PASS')"
  expected: >-
    status pass with non-zero counts from the rows plan 3 part 2's smoke gate wrote (all four tables, synthetic project),
    then GAUGE_LIVE_PASS.
  fix_if: >-
    unavailable means the live verb failed or refused: read the reason in the report and the reader's log line.
    unpopulated means the smoke tables hold no rows: confirm the deploy-ducklake-lambdas run of #1477 (or a later one)
    passed its telemetry append gate; if it did not, report it to the append thread and hold c3 (never flip it on an
    unpopulated reading).
  hermetic: false
  graduation: not-applicable
