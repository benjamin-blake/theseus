constraints:
  - No rescue agents or workaround loops (Decision 55/72); the gate refuses and surfaces -- it never files, retries, synthesises or downgrades.
  - >-
    Decision 143 (SETTLED, not a fork): the evaluator job holds permissions {contents: read}, no
    id-token grant and no writer secret, and the guard's assertion of that is escape-free -- no
    marker, no allowlist, no skip path. rec-autoclose.yml's job-level id-token: write is exactly why
    an in-handler guard cannot be the boundary. The grammar allowlist is defence-in-depth only.
  - >-
    Decision 186: point 2's ONE ENFORCEMENT SITE -- assert_acceptance_verdict is called beside
    assert_closure_obligation inside update_rec, never as a second gate elsewhere. Point 7's catch
    contract must survive the relocation byte-for-behaviour: ClosureArtifactRequired caught, marker
    printed, rec left OPEN, exit 0.
  - >-
    Decision 163: both new flags must be EXECUTED, not merely declared. require_acceptance_verdict
    True on the trailer path means it cannot fail open; require_decidable is executed in the census
    stage. The two deferred bindings (write boundary, validate_acceptance_literals) are owned by
    rec-4001 and the non-trailer closure residual by rec-3999 -- named owners, not declarations
    (Decision 181 clause 2).
  - >-
    Two-boundary frame: write-boundary validation checks SHAPE, verify-boundary validation checks
    TRUTH. The grammar ratchet is a precondition for the close-time oracle run, never a substitute --
    24 of the 30 measured false closures are well-formed oracles whose assertion simply did not hold,
    and only the close-time run catches those. State this in the Decision or a reviewer will
    reasonably ask why a single-digit filing-time refusal rate warrants a numbered Decision.
  - >-
    Decision 189 vocabulary axis: keep a SEPARATE top-level vocabulary and justify why. vp-red-
    before.yaml classifies whether a step correctly failed BEFORE implementation (assertion_failed is
    a PASS there); this one classifies whether a rec's oracle HOLDS at the closing commit (fails is
    the false-closure signal) -- inverted polarity, so verbatim reuse would be drift. out_of_grammar
    is not tautological: tautological is a measured exit 0, out_of_grammar is a deliberate refusal to
    execute, and it routes differently (rewrite the acceptance, not re-run). The axis is asserted by
    VP step 3, not merely stated.
  - >-
    NEVER shell=True and never a new executor: execution goes through
    scripts.backlog_health.probe.run_all, whose sandbox (unshare -rmn, read-only bind mount, no
    network, pid cap, bounded timeout) is live-validated on GitHub-hosted runners in backlog-health
    runs 3/4/5 and reproduced locally in this planning session.
  - >-
    Decision 162 spirit: every new ci.yml job body is a thin
    `bin/venv-python -m scripts.rec_trailer_acceptance <verb>` adapter. This does NOT remove the
    marker obligation -- r3_workflows sets gates_new_entry True, so every new inline run body needs a
    baseline entry AND a marker whose Decision mentions `.github/workflows/ci.yml`.
  - >-
    Decision 155: rec-autoclose.yml's backfill step keeps `sys.exit(1 if result["failed"] else 0)`
    byte-intact; the graduated shard rec-autoclose-failed-counter-exit-present pins reversal
    condition (c) to it. Do not rename the `autoclose` job -- R3 keys are workflow::job::step.
  - >-
    Decision 142: the closure job stamps the same merge-commit GITHUB_SHA the ancestry check
    consumes. CI is already a ci_rca-watched workflow (config/ci_rca_taxonomy.yaml `CI` row and
    ci-rca.yml's workflows filter), so the rec-2849 property survives the move.
  - >-
    scripts/rec_trailer_acceptance.py MUST NOT import closure_stamps_applicable. The graduated shard
    tests/ops_data_portal/test_closure_gate.py::TestContractParity::
    test_stamp_precondition_call_sites_match_importers derives importers of that symbol by AST; a new
    importer requires updating ci-rca-lifecycle.yaml's stamp_precondition.call_sites in the same PR,
    which this plan deliberately avoids.
  - >-
    Decision 189 red-before: the partition is graduation == "graduate" ALONE; hermetic false does NOT
    exempt. Every graduate pre-deploy step above was replayed against the un-implemented tree during
    planning and genuinely fails. No graduate step invokes scripts.validate (statically refused for
    recursion). Use POSIX grep in canonical argument order, never rg (absent from the runner).
  - >-
    Decision 128 SLOC: scripts/ops_data_portal.py has 22 effective lines of headroom and no budget
    entry -- decompose rather than raise if the update_rec change cannot fit.
    docs/contracts/ci-rca-lifecycle.yaml has 24 lines of headroom against the contracts class's 500.
  - >-
    Decision 168: each Class D contract edit needs an amendment_log[] entry, a contract_version bump,
    AND an evaluator that demonstrably reads it -- the extended guard must read BOTH git-ops.yaml and
