acceptance_criteria:
  - >-
    A rec named in a Resolves: trailer whose acceptance command does NOT pass at the merge commit
    is left OPEN by the closure job, with a distinct greppable marker, a $GITHUB_STEP_SUMMARY
    mirror, and a printed close_proposed command -- and the job still exits 0 (loud-not-red).
  - >-
    The gate is EXECUTED, not merely declared (Decision 163): the ci.yml closure job passes
    require_acceptance_verdict True, so a trailer-named rec with no verdict is never passed to
    update_rec. The remaining fail-open is confined to non-trailer callers of update_rec and is
    named in docs/contracts/git-ops.yaml with rec-3999 as its owner (Decision 181 clause 2).
  - >-
    The verdict vocabulary is exactly {holds, fails, unmeasurable, out_of_grammar}; every non-holds
    value leaves the rec open. The bucket x probe-verdict map is TOTAL and is asserted total by a
    test that reddens when either upstream vocabulary gains a member. Its intersection with
    docs/contracts/vp-red-before.yaml's OUTCOME_CLASSES is exactly {"unmeasurable"} -- the one
    genuinely shared arm -- and that equality is asserted, not restated.
  - >-
    The evaluator runs in a ci.yml job declaring permissions {contents: read} with no id-token grant
    and no writer secret (Decision 143), and the registered guard's assertion of that fact is
    escape-free: no marker, no config allowlist, no skip path. The sandbox, not the grammar
    allowlist, is the boundary.
  - >-
    The verdict is asserted at exactly ONE site -- update_rec, beside assert_closure_obligation
    (Decision 186 point 2). A stale or mis-keyed verdict cannot close a rec: the predicate compares
    the record's rec_id, acceptance_sha256 AND sha against the rec, its acceptance text and the
    closing sha. The closing sha reaches the predicate as an EXPLICIT parameter sourced from
    close_recs_from_trailer's required positional commit_sha -- never from context_v2_json and
    never via closure_fix_sha -- so this criterion and criterion 6 are consistent: the sha, like
    the verdict, is a gate input and not a stamp.
  - >-
    acceptance_verdict AND its closing sha are gate INPUTS, never context_v2_json stamps:
    update_rec's closure_stamps_applicable precondition is not extended and neither value is added
    to the closure_stamps dict, so the ~99.6% of open recs carrying no context_v2_json blob stay
    closable. Verified by a test closing a blob-less rec on a holds verdict whose sha arm is still
    checked.
  - >-
    The relocation preserves every property of the step it replaces: ClosureArtifactRequired is
    still caught, still prints its own marker, still leaves the rec OPEN and still exits 0; the
    closing write still stamps the merge-commit GITHUB_SHA Decision 142's ancestry check consumes;
    CI remains a ci_rca-watched workflow, and rec-autoclose.yml's backfill step keeps the
    `sys.exit(1 if result["failed"] else 0)` line Decision 155's reversal condition (c) is pinned
    to.
  - >-
    lint_acceptance_command(..., require_decidable=True) refuses an acceptance command carrying no
    decidable assertion in any segment, admits a declared `--assert-<name>` exit contract, and is
    EXECUTED in the trailer census stage, where a refusal becomes the out_of_grammar verdict.
    Default False leaves every existing caller unchanged. The write-boundary and
    validate_acceptance_literals bindings are deliberately deferred to rec-4001 -- binding them now
    would refuse three shipped `bin/venv-python -m scripts.validate --pre` acceptance literals that
    active budget_breach / budget_bypass filers write at runtime.
  - >-
    The pre-existing quote-cutting false-pass in _classify_non_discriminating is fixed on the same
    quote-aware tokenizer, so a lone grep carrying quoted alternation no longer evades
    require_discrimination. Measured: 23 of 1327 open recs newly refused, 0 shipped acceptance
    literals affected.
  - >-
    The cutover leaves no stale reference: .github/workflows/rec-autoclose.yml no longer names
    close_recs_from_trailer, its header comment no longer describes the merge-leg gate as its own
    behaviour, and the extended check carries a STANDING retired-delegation assertion for that fact
    -- so a re-added closure step cannot silently bypass the gate after this plan merges.
  - >-
    No instruction surface ON THE TRAILER PATH tells an agent to close around the gate. All
    three surfaces that route an agent to a direct close after a trailer merge are conditional:
    the implement skill's and implement command's post-merge closeout fallback, and
    docs/contracts/git-ops.yaml's resolves_trailer fallback sentence. Each distinguishes a rec
    still open because transport failed or the merge-leg gate refused (fallback unchanged) from a
    rec the acceptance gate REFUSED (force-closing forbidden; the printed close_proposed command
    is the only sanctioned route). Uncorrected, this is Decision 186 reversal condition (d) --
    "a caller closes around the client-side gate" -- instructed by the repository itself, and
    acceptance criterion 2 would be false in practice on the day this merged. DELIBERATELY NOT
    CLAIMED: two NON-trailer surfaces still hand an agent a direct close --
    .claude/commands/orient.md:64's LIKELY-RESOLVED soft prompt, and
    docs/contracts/ci-rca-lifecycle.yaml's closure_dependency.manual_route (that key lives in
    ci-rca-lifecycle.yaml; git-ops.yaml carries no occurrence of it). Both belong to the rec-3999 residual, are named there, and
    stay deferred. Claiming "no instruction surface" outright would commit exactly the
    overstatement this plan forbids the Decision body one field away.
  - >-
    Both declared residuals are recorded in docs/contracts/git-ops.yaml with a named owner, not
    merely in this plan: non-trailer callers of update_rec (rec-3999), and the require_decidable
    ratchet's unenforced write-boundary and validate_acceptance_literals surfaces (rec-4001).
  - >-
    rec-3867 is SUPERSEDED via the ops portal, never trailer-closed: its acceptance names
    tests/test_rec_autoclose.py, which does not exist and is not created here, so it can never pass
    and the new gate would correctly refuse it.
  - >-
    docs/contracts/git-ops.yaml and docs/contracts/ci-rca-lifecycle.yaml each carry a new
    amendment_log[] entry AND a contract_version bump, each with an evaluator that demonstrably
    reads them (Decision 168); the new numbered Decision carries a Decision 167 fenced yaml envelope
    with a significance claim resting on the GATE, amends both 103 and 186, and lands alongside
    dated annotations on 103 and on 186 point 7 rather than edits to either body (Decision 177).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The verdict vocabulary is total over both upstream vocabularies AND distinct in axis from
      vp-red-before.yaml's -- all three assertions in one class, one standing guard.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestVerdictMapping" -q
    expected: >-
      Every (bucket, probe_verdict) pair drawn from scripts.backlog_health at runtime resolves to
      one of the four verdicts, and the intersection with vp-red-before.yaml's OUTCOME_CLASSES is
      exactly the single genuinely shared arm.
    fix_if: >-
      A pair maps to None -- the map is partial, so an upstream vocabulary change would silently
      drop a verdict. Or the intersection grows -- a word has been reused across two contracts
      whose polarity is inverted.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-vocabulary-total-and-axis-distinct
    expected_literals:
      - "passed"
  - step: 2
    phase: pre-deploy
    action: The shared arms are derived from scripts.backlog_health at runtime rather than hardcoded.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestVerdictMapping::test_probe_vocabulary_parity" -q
    expected: The parity test passes, deriving census.BUCKETS and probe.VERDICTS from the upstream package at runtime.
    fix_if: The test hardcodes the upstream members -- a new probe verdict or census bucket would then map to nothing silently.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 1, which still graduates: this node id is a member of step 1's
      class selector, and step 1's totality assertion iterates the same runtime-derived domains, so
      a hardcoded member reddens step 1 first. A second registry row would pin the same code twice.
  - step: 3
    phase: pre-deploy
    action: The vocabulary axis is asserted, not asserted-by-prose -- exactly one word is shared with vp-red-before.yaml.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestVerdictMapping::test_axis_parity_with_vp_red_before" -q
    expected: The intersection of ACCEPTANCE_VERDICTS with OUTCOME_CLASSES is exactly the single shared arm.
    fix_if: >-
      The intersection grows -- a word has been reused across two contracts whose polarity is
      inverted, which is the drift vp-red-before.yaml's own self_satisfying-vs-tautological note warns about.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 1, which still graduates: this node id is a member of step 1's
      class selector, so the standing guard step 1 installs runs this exact assertion on every
      subsequent diff. The Decision 189 anti-drift property is guarded, just not by a second row.
  - step: 4
    phase: pre-deploy
    action: The closure-gate predicate refuses every non-holds verdict and every mis-keyed record, and passes an absent one.
    command: bin/venv-python -m pytest "tests/ops_data_portal/test_closure_gate.py::TestAcceptanceVerdict" -q
    expected: >-
      Every refusal arm raises AcceptanceVerdictRefused -- including a record whose sha field does
      not equal the closing sha passed in, which proves the closing sha is supplied independently
      rather than read back out of the record. The absent-record and status-preserving-write arms
      return None.
    fix_if: A mis-keyed record (wrong rec_id, acceptance_sha256 or closing sha) is accepted -- a stale verdict could then close a rec.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-verdict-refuses-non-holds
    expected_literals:
      - "passed"
  - step: 5
    phase: pre-deploy
    action: >-
      The whole trailer-closure refusal surface: an acceptance refusal and the pre-existing
      ClosureArtifactRequired refusal both leave the rec OPEN, print their own marker, and return 0.
    command: bin/venv-python -m pytest "tests/ci_rca/test_close_recs_from_trailer.py::TestAcceptanceVerdictRefusal" -q
    expected: Every refusal arm leaves the rec open with exit_code 0; the holds arm closes.
    fix_if: exit_code becomes 1 on any refusal -- a designed refusal would then redden a ci_rca-watched workflow.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-refusal-is-loud-not-red
    expected_literals:
      - "passed"
  - step: 6
    phase: pre-deploy
    action: With require_acceptance_verdict True, a rec carrying no verdict is never passed to update_rec.
