schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: trailer-acceptance-static-gate
intent: >-
  Stop rec-autoclose closing a rec named in a Resolves: trailer without ever checking that rec's
  own acceptance oracle (measured: 30 of 100 auto-closed recs failed their own acceptance at the
  commit that closed them), by introducing a verdict LAYER over the existing oracle -- a verdict
  record, a verdict vocabulary, one assertion site at update_rec, and a grammar precondition on
  the oracle itself -- and wiring the STATIC verdict source into it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-acceptance-static-gate.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec (carrying recs rec-3867 / rec-3984); names NO tier_item,
  so the Tier Item Freshness Gate is skipped. Precedent: PLAN-rec-autoclose-trailer-gate-oserror-
  coverage and PLAN-trailer-closure-evidence-gate scoped themselves identically. T3.9 is the
  nearest tier_item and is deliberately NOT claimed -- see context for the c3 boundary and the c4
  gap, which is owned by rec-4000.
scope:
  - file: docs/plans/PLAN-trailer-acceptance-static-gate.yaml
    action: Modify
    purpose: >-
      This plan's own path -- always touched per docs/contracts/implement-scope-boundary.yaml's
      implementing_plan_bookkeeping sanction row, whose permitted_field_edits lists
      implementation_declared FIRST. Flip implementation_declared to true after code review and a
      full-tier pass. Omitting this row leaves the plan out of the diff and makes
      validate_graduation_completeness, validate_scope_boundary and validate_vp_replay all no-op,
      which would satisfy VP step 18 VACUOUSLY.
  - file: scripts/rec_trailer_acceptance.py
    action: Create
    purpose: >-
      The verdict LAYER, sited at scripts/ root beside its siblings rec_trailer.py /
      rec_relevance.py / rec_episode.py. Deliberately NOT under scripts/ops_portal/: it imports
      scripts.backlog_health, which transitively reaches scripts.ops_data_portal via
      scripts.rec_episode, and an ops_portal -> ops_data_portal edge violates .importlinter's
      no-cycles-ops-data-portal-executor layering (Decision 124). Holds (a) census(ids, rows,
      repo_root) -> entries [{rec_id, acceptance, acceptance_sha256, bucket}], classifying with the
      EXISTING scripts.backlog_health.census.classify_command AND calling
      lint_acceptance_command(acceptance, require_decidable=True) -- a refusal maps straight to
      out_of_grammar, which is where the grammar ratchet is EXECUTED on this plan's own path
      (Decision 163; the write-boundary binding is deferred to rec-4001 for the measured reason in
      that rec); (b) evaluate(entries, repo_root, sha) -> the verdict document {sha,
      isolation_available, source, records: [{rec_id, sha, acceptance_sha256, verdict, source,
      arm}]}, executing only `probeable` entries through the EXISTING
      scripts.backlog_health.probe.run_all sandbox; (c) verdict_for(bucket, probe_verdict), a TOTAL
      map from census.BUCKETS x (probe.VERDICTS | {None}) onto the four-value vocabulary; (d)
      rejoin(census_doc, verdict_doc), the untrusted-artifact rejoin on rec_id + acceptance_sha256
      mirroring escalate.rejoin_probe_verdicts; (e) the census/evaluate/close CLI verbs the three
      new ci.yml jobs invoke as THIN ADAPTERS (Decision 162 spirit -- logic here, not in a workflow
      body). `source` is "static" throughout: the extension point slice B adds "junit" records at.
      MUST NOT import closure_stamps_applicable (constraint 10).
  - file: tests/test_rec_trailer_acceptance.py
    action: Create
    purpose: >-
      Mirror test (Decision 131 colocation rule for a scripts/ root module). Covers the total
      bucket x probe-verdict map; the shared-arm parity assertion against
      scripts.backlog_health.probe.VERDICTS and census.BUCKETS; the AXIS parity assertion against
      docs/contracts/vp-red-before.yaml's OUTCOME_CLASSES (constraint 5); the census stage mapping
      an undecidable acceptance to out_of_grammar; the acceptance_sha256 rejoin drop paths (unknown
      rec_id, changed acceptance, malformed artifact); and an isolation_unavailable run resolving
      to `unmeasurable` for every entry rather than a silent pass.
  - file: scripts/ops_portal/closure_gate.py
    action: Modify
    purpose: >-
      The ONE assertion site's predicate half. Adds ACCEPTANCE_VERDICTS (holds / fails /
      unmeasurable / out_of_grammar), AcceptanceVerdictRefused(ValueError), and
      assert_acceptance_verdict(existing_status, new_status, rec_id, acceptance, closing_sha,
      record) -- a pure predicate that raises when a record IS supplied and either verdict !=
      "holds", or record["rec_id"] != rec_id, or record["acceptance_sha256"] != sha256(acceptance),
      or record["sha"] != closing_sha; and returns None when record is None. `closing_sha` is an
      EXPLICIT parameter, NOT read from context_v2_json and NOT the closure_fix_sha kwarg: its
      source is close_recs_from_trailer's own required positional `commit_sha`
      (scripts/ops_portal/ci_rca_lifecycle.py:388), unconditionally in scope for every call.
      Verified during planning: only commit_sha's use as a STAMP is gated on
      closure_stamps_applicable (that module's lines 445-447), never its availability. This is what
      makes the sha a gate INPUT rather than a stamp, so acceptance criteria 5 and 6 are consistent
      rather than in tension.
      Fires only on a transition INTO a bound status from a not-already-bound one, reusing this
      module's existing _BOUND_STATUSES and terminal_definition semantics. 245 SLOC, 255 headroom.
      Verified during planning: closure_gate symbols are absent from
      scripts/checks/hygiene/validate_ops_portal_patch_targets.py's _MOVED_CALLERS (which names
      only file_decision / update_decision / backfill_decisions_from_md), and update_rec is not a
      moved caller, so no patch-target row changes -- re-confirm if that map grows.
  - file: tests/ops_data_portal/test_closure_gate.py
    action: Modify
    purpose: >-
      Add TestAcceptanceVerdict covering every refusal arm plus the absent-record pass-through and
      the status-preserving-write no-op. It MUST include an arm proving the closing sha reaching
      the predicate is not sourced from the record -- a record whose own sha field differs from the
      closing sha is REFUSED -- so the self-comparison reading of F3 cannot ship green.
      218 SLOC, 282 headroom. Do NOT touch
      TestContractParity::test_stamp_precondition_call_sites_match_importers, a graduated shard.
  - file: scripts/ops_data_portal.py
    action: Modify
    purpose: >-
      Add TWO keyword-only parameters to update_rec -- `acceptance_verdict: Optional[dict] = None`
      AND `closing_sha: Optional[str] = None` -- and call assert_acceptance_verdict immediately
      beside the existing assert_closure_obligation call (ONE ENFORCEMENT SITE, Decision 186
      point 2, never a second gate). `closing_sha` is its own parameter DELIBERATELY, not a field
      read out of the acceptance_verdict payload: if the sha rode inside the record, the
      predicate's `record["sha"] != closing_sha` arm would become a self-comparison -- vacuously
      true in production while VP step 4 stayed green, because that step calls the predicate
      directly with independently supplied arguments. Both values are GATE INPUTS: neither is added
      to the closure_stamps dict, so closure_stamps_applicable never gates either and the ~99.6% of
      open recs carrying no context_v2_json stay closable. HARD SLOC CONSTRAINT: 478 effective
      lines, 22 headroom, no config/sloc_budgets.yaml entry -- the whole change, DOCSTRING LINES
      INCLUDED (they are non-blank and non-comment, so they count), must fit in <= 20 added
      effective lines. Budget it as: 2 signature lines, 1 call line, 3-4 docstring lines, leaving
      margin. If it does not fit, DECOMPOSE (Decision 128); never raise the budget.
  - file: scripts/ops_portal/ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      Thread the verdict into the closure loop and bind the gate STRUCTURALLY (Decision 163).
      close_recs_from_trailer gains acceptance_verdicts: Optional[dict[str, dict]] AND
      require_acceptance_verdict: bool = False. When require_acceptance_verdict is True (what the
      ci.yml closure job passes), a rec with no verdict in the map is NOT passed to update_rec at
      all -- it is left OPEN with the same marker treatment as a refusal, so the trailer path can
      never fail open. The closing sha handed to update_rec's gate is this function's own
      `commit_sha` positional, passed through unconditionally and independently of the
      closure_fix_sha stamp path. The default False preserves every existing caller. On
      AcceptanceVerdictRefused: print a NEW, distinct Decision-155-shaped marker constant (never
      shared with _ESCAPE_CLOSURE_REFUSAL_MARKER or either merge-leg marker) formatted PER-REC and
      CARRYING THE REC ID -- mirror the shipped precedent at this module's line 457,
      f"{MARKER}: {rec_id} left OPEN -- {exc}". The rec id is load-bearing, not decoration: the
      corrected closeout fallback tests for a marker naming THAT rec id, so a class-level marker
      without one would leave the condition unevaluable. Mirror it to
      $GITHUB_STEP_SUMMARY via the existing _mirror_refusal_to_step_summary, print a close_proposed
      command, leave the rec OPEN, and do NOT touch exit_code. The existing ClosureArtifactRequired
      catch and its exit-0 posture are PRESERVED unchanged (Decision 186 point 7). Also update
      close_recs_from_trailer's OWN docstring (lines 393-394), which calls this "the importable
      helper rec-autoclose.yml's closure step delegates its loop to" -- false once ci.yml's
      trailer-closure job is the caller. 385 SLOC, 115 headroom.
  - file: tests/ci_rca/test_close_recs_from_trailer.py
    action: Modify
    purpose: >-
      Add TestAcceptanceVerdictRefusal (non-holds leaves the rec open, prints the marker, emits
      close_proposed, returns 0; holds closes; absent-with-require_acceptance_verdict-True leaves it
