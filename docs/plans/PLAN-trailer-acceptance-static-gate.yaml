schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: trailer-acceptance-static-gate
intent: >-
  Stop rec-autoclose closing a rec named in a Resolves: trailer without ever checking that rec's
  own acceptance oracle (measured: 30 of 100 auto-closed recs failed their own acceptance at the
  commit that closed them), by introducing a verdict LAYER over the existing oracle -- a verdict
  record, a verdict vocabulary, one assertion site at update_rec, and a grammar precondition on
  the oracle itself -- and wiring the STATIC verdict source into it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-acceptance-static-gate.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec (carrying recs rec-3867 / rec-3984); names NO tier_item,
  so the Tier Item Freshness Gate is skipped. Precedent: PLAN-rec-autoclose-trailer-gate-oserror-
  coverage and PLAN-trailer-closure-evidence-gate scoped themselves identically. T3.9 is the
  nearest tier_item and is deliberately NOT claimed -- see context for the c3 boundary and the c4
  gap, which is owned by rec-4000.
scope:
  - file: docs/plans/PLAN-trailer-acceptance-static-gate.yaml
    action: Modify
    purpose: >-
      This plan's own path -- always touched per docs/contracts/implement-scope-boundary.yaml's
      implementing_plan_bookkeeping sanction row, whose permitted_field_edits lists
      implementation_declared FIRST. Flip implementation_declared to true after code review and a
      full-tier pass. Omitting this row leaves the plan out of the diff and makes
      validate_graduation_completeness, validate_scope_boundary and validate_vp_replay all no-op,
      which would satisfy VP step 17 VACUOUSLY.
  - file: scripts/rec_trailer_acceptance.py
    action: Create
    purpose: >-
      The verdict LAYER, sited at scripts/ root beside its siblings rec_trailer.py /
      rec_relevance.py / rec_episode.py. Deliberately NOT under scripts/ops_portal/: it imports
      scripts.backlog_health, which transitively reaches scripts.ops_data_portal via
      scripts.rec_episode, and an ops_portal -> ops_data_portal edge violates .importlinter's
      no-cycles-ops-data-portal-executor layering (Decision 124). Holds (a) census(ids, rows,
      repo_root) -> entries [{rec_id, acceptance, acceptance_sha256, bucket}], classifying with the
      EXISTING scripts.backlog_health.census.classify_command AND calling
      lint_acceptance_command(acceptance, require_decidable=True) -- a refusal maps straight to
      out_of_grammar, which is where the grammar ratchet is EXECUTED on this plan's own path
      (Decision 163; the write-boundary binding is deferred to rec-4001 for the measured reason in
      that rec); (b) evaluate(entries, repo_root, sha) -> the verdict document {sha,
      isolation_available, source, records: [{rec_id, sha, acceptance_sha256, verdict, source,
      arm}]}, executing only `probeable` entries through the EXISTING
      scripts.backlog_health.probe.run_all sandbox; (c) verdict_for(bucket, probe_verdict), a TOTAL
      map from census.BUCKETS x (probe.VERDICTS | {None}) onto the four-value vocabulary; (d)
      rejoin(census_doc, verdict_doc), the untrusted-artifact rejoin on rec_id + acceptance_sha256
      mirroring escalate.rejoin_probe_verdicts; (e) the census/evaluate/close CLI verbs the three
      new ci.yml jobs invoke as THIN ADAPTERS (Decision 162 spirit -- logic here, not in a workflow
      body). `source` is "static" throughout: the extension point slice B adds "junit" records at.
      MUST NOT import closure_stamps_applicable (constraint 10).
  - file: tests/test_rec_trailer_acceptance.py
    action: Create
    purpose: >-
      Mirror test (Decision 131 colocation rule for a scripts/ root module). Covers the total
      bucket x probe-verdict map; the shared-arm parity assertion against
      scripts.backlog_health.probe.VERDICTS and census.BUCKETS; the AXIS parity assertion against
      docs/contracts/vp-red-before.yaml's OUTCOME_CLASSES (constraint 5); the census stage mapping
      an undecidable acceptance to out_of_grammar; the acceptance_sha256 rejoin drop paths (unknown
      rec_id, changed acceptance, malformed artifact); and an isolation_unavailable run resolving
      to `unmeasurable` for every entry rather than a silent pass.
  - file: scripts/ops_portal/closure_gate.py
    action: Modify
    purpose: >-
      The ONE assertion site's predicate half. Adds ACCEPTANCE_VERDICTS (holds / fails /
      unmeasurable / out_of_grammar), AcceptanceVerdictRefused(ValueError), and
      assert_acceptance_verdict(existing_status, new_status, rec_id, acceptance, record) -- a pure
      predicate that raises when a record IS supplied and either verdict != "holds", or
      record["rec_id"] != rec_id, or record["acceptance_sha256"] != sha256(acceptance), or
      record["sha"] != the closing write's fixed_by_sha; and returns None when record is None.
      Fires only on a transition INTO a bound status from a not-already-bound one, reusing this
      module's existing _BOUND_STATUSES and terminal_definition semantics. 245 SLOC, 255 headroom.
      Verified during planning: closure_gate symbols are absent from
      scripts/checks/hygiene/validate_ops_portal_patch_targets.py's _MOVED_CALLERS (which names
      only file_decision / update_decision / backfill_decisions_from_md), and update_rec is not a
      moved caller, so no patch-target row changes -- re-confirm if that map grows.
  - file: tests/ops_data_portal/test_closure_gate.py
    action: Modify
    purpose: >-
      Add TestAcceptanceVerdict covering every refusal arm plus the absent-record pass-through and
      the status-preserving-write no-op. 218 SLOC, 282 headroom. Do NOT touch
      TestContractParity::test_stamp_precondition_call_sites_match_importers, a graduated shard.
  - file: scripts/ops_data_portal.py
    action: Modify
    purpose: >-
      Add the keyword-only acceptance_verdict kwarg to update_rec and call
      assert_acceptance_verdict immediately beside the existing assert_closure_obligation call --
      ONE ENFORCEMENT SITE (Decision 186 point 2), never a second gate. The kwarg is a GATE INPUT
      only: deliberately NOT added to the closure_stamps dict, so closure_stamps_applicable never
      gates it and the ~99.6% of open recs carrying no context_v2_json stay closable. HARD SLOC
      CONSTRAINT: 478 effective lines, 22 headroom, no config/sloc_budgets.yaml entry -- the whole
      change, docstring lines included, must fit in <= 20 added effective lines, or the file is
      decomposed (Decision 128), never budget-raised.
  - file: scripts/ops_portal/ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      Thread the verdict into the closure loop and bind the gate STRUCTURALLY (Decision 163).
      close_recs_from_trailer gains acceptance_verdicts: Optional[dict[str, dict]] AND
      require_acceptance_verdict: bool = False. When require_acceptance_verdict is True (what the
      ci.yml closure job passes), a rec with no verdict in the map is NOT passed to update_rec at
      all -- it is left OPEN with the same marker treatment as a refusal, so the trailer path can
      never fail open. The default False preserves every existing caller. On
      AcceptanceVerdictRefused: print a NEW, distinct Decision-155-shaped marker constant (never
      shared with _ESCAPE_CLOSURE_REFUSAL_MARKER or either merge-leg marker), mirror it to
      $GITHUB_STEP_SUMMARY via the existing _mirror_refusal_to_step_summary, print a close_proposed
      command, leave the rec OPEN, and do NOT touch exit_code. The existing ClosureArtifactRequired
      catch and its exit-0 posture are PRESERVED unchanged (Decision 186 point 7). 385 SLOC, 115
      headroom.
  - file: tests/ci_rca/test_close_recs_from_trailer.py
    action: Modify
    purpose: >-
      Add TestAcceptanceVerdictRefusal (non-holds leaves the rec open, prints the marker, emits
      close_proposed, returns 0; holds closes; absent-with-require_acceptance_verdict-True leaves it
      open; absent-with-default-False closes) and a regression arm asserting the
      ClosureArtifactRequired catch still returns 0 after the relocation. 117 SLOC, 383 headroom --
      new tests go here, NOT in tests/test_ci_rca_lifecycle.py (474 SLOC, 26 headroom). Do NOT
      disturb the two graduated shards pinned in this file.
  - file: scripts/executor/acceptance_lint.py
    action: Modify
    purpose: >-
      Two changes on one tokenizer. (1) ADD require_decidable, a second keyword-only flag beside the
      existing require_discrimination -- never a duplicate linter. It strips surrounding backticks
      (as validate_acceptance_feasibility already does -- rec-163 is backtick-wrapped), splits on
      shell control operators with shlex(posix=True, punctuation_chars=True), and REFUSES only when
      NO segment carries a decidable assertion. A segment is decidable when its argv head is in
      {grep, rg, test, [, wc}, when it is a pytest invocation carrying a ::node_id, OR when it
      carries a declared `--assert-<name>` exit-contract flag -- the already-ratified idiom at
      scripts/ci_rca/probe_health.py:239 and scripts/preflight/ci_rca_gauges.py:438, which a
      head-token-only rule would wrongly refuse because those heads are bin/venv-python. GRAMMAR
      SHAPE ONLY -- never node existence, since the test does not exist when the rec is filed.
      (2) FIX a live false-pass in the EXISTING _classify_non_discriminating: it splits with
      chain_parts[0].split("|"), which cuts INSIDE quotes, so a lone grep carrying quoted
      alternation evades require_discrimination entirely. Verified against shipped code during
      planning: lint_acceptance_command("grep -q 'a\\|b' f", require_discrimination=True) returns
      ok=True and grep -qE "a|b" f returns ok=True, while the control grep -q plain f correctly
      returns ok=False. Rebuild that splitter on the same quote-aware tokenizer or the new flag
      inherits the hole. Measured blast radius of the fix: 23 of 1327 open recs (1.73%) newly
      refused -- all of them true positives the old splitter let through -- and ZERO shipped
      acceptance literals under scripts/ affected, so no auto-filer breaks. 336 SLOC, 164 headroom.
  - file: tests/test_executor_acceptance_lint.py
    action: Modify
    purpose: >-
      Add TestRequireDecidable (prose refused; bare `pytest tests/x.py -q` refused; backtick-wrapped
      grep admitted; a pipeline whose final segment is `grep -q` admitted -- the shape
      scripts/backlog_health/escalate.py's four rollup recs file; a `--assert-<name>` exit contract
      admitted; default False leaves every existing caller byte-for-byte unchanged) and a
      regression arm on the quote-aware fix asserting that a lone grep with quoted alternation is
      now correctly refused under require_discrimination=True. 349 SLOC, 151 headroom.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Three new push-only jobs, mirroring backlog-health.yml's ratified three-job credential split.
      trailer-census (id-token: write) parses the trailer, reads the named recs via the DuckLake
      reader, classifies, uploads trailer_census.json; executes nothing. trailer-acceptance-evaluate
      (needs trailer-census; permissions {contents: read} ONLY, no id-token, persist-credentials
      false) runs the sysctl step that unblocks unprivileged user namespaces, then the sandboxed
      evaluator; uploads acceptance_verdict.json. trailer-closure (needs both, if: always(),
      id-token: write) rejoins and closes with require_acceptance_verdict True. EVERY job body is a
      THIN ADAPTER -- one `bin/venv-python -m scripts.rec_trailer_acceptance <verb>` line (Decision
      162 spirit) -- so no logic lives in a workflow body. The closure verb must preserve today's
      `sys.exit(close_recs_from_trailer(...))` contract exactly: a Decision 186
      ClosureArtifactRequired refusal and an acceptance refusal both leave the rec OPEN and exit 0
      (loud-not-red), and the closing write stamps the same merge-commit GITHUB_SHA that Decision
      142's ancestry check consumes. Constraints: each job's `if` is `github.event_name == 'push'`
      (so _admits_pull_request excludes it from signal-green.needs); no step text may contain the
      literal `scripts.validate` (it would sweep the job into _full_tier_jobs and demand
      fetch-depth 0); no check-like module name matching ^(validate|verify|check); ci.yml is at 220
      effective lines against the ci_workflows class's 500 (Decision 166).
  - file: .github/workflows/rec-autoclose.yml
    action: Modify
    purpose: >-
      Remove the closure step ONLY. The backfill, detect-decisions and install-dependencies steps
      stay in the SAME job under its existing `autoclose` job id -- never renamed, because the R3
      baseline keys are workflow::job::step and a rename mints new entries. The backfill step's
      `sys.exit(1 if result["failed"] else 0)` must stay byte-intact: Decision 155's reversal
      condition (c) is mechanically pinned to it by the graduated shard
      rec-autoclose-failed-counter-exit-present (node id
      tests/ops_data_portal/test_decisions_divergence_guard.py::TestSubstantiveSignalPin::test_rec_autoclose_exits_nonzero_on_failed_rows),
      so "backfill untouched" is load-bearing, not incidental. rec-autoclose stays a ci_rca-watched
      workflow.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Remove the retired
      `.github/workflows/rec-autoclose.yml::autoclose::close-resolved-recs-from-resolves-trailer:
      37` entry (removals are unrestricted) and register EVERY new ci.yml inline `run:` body at its
      exactly-measured effective-line count under r3_workflows. VERIFIED DURING PLANNING: the
      r3_workflows RegistrySpec sets gates_new_entry=lambda _value: True and
      _marker_guard.check_diff requires a marker on every new entry regardless of value, so the
      thin-adapter route shrinks the counts but does NOT remove the marker obligation. Each entry
      therefore carries `# raise-approved: dec-NNN <reason>` citing the Decision this plan adds,
      whose body must mention `.github/workflows/ci.yml` (workflow_mention_candidates yields the
      full key plus the workflow path; no existing Decision names ci.yml -- Decision 166 names only
      reconcile.yml and terraform-apply-sandbox.yml). No new top-level section.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Correct one prose clause this plan falsifies: the `rec-autoclose` row's rationale states the
      workflow "closes recs from a Resolves trailer", which stops being true when closure moves to
      ci.yml. Reword to name the backfill role it retains and point at ci.yml for closure. Prose
      only -- no tier, no ci_rca flag, no agent_loop_caps, and no classifier surface is touched, so
      validate_ci_rca_adjudication's per-workflow agreement assertions are unaffected. Operator
      ruling: correcting a knowingly-false rationale here beats deferring it to slice B.
  - file: scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      EXTEND this registered check rather than adding a new one -- its pre_globs already cover
      .github/workflows/**, scripts/ops_portal/**, docs/contracts/git-ops.yaml and
      scripts/checks/ci_guards/**, and config/ci_rca_taxonomy.yaml already carries its
      function_to_category row (environment), so extension needs no new glob, no new taxonomy row,
      and no check_accounting_baseline entry Decision 170's frozen _BASELINE_SEED could not
      grandfather. Re-point assertion 1 from rec-autoclose.yml to ci.yml; add assertions that the
      evaluator job declares NO id-token permission and no secret env (the Decision 143 clause-1
      discharge -- this assertion is ESCAPE-FREE: no marker, no config allowlist, no skip path),
      that the closure job consumes an acceptance verdict and passes require_acceptance_verdict,
      and that BOTH docs/contracts/git-ops.yaml and docs/contracts/ci-rca-lifecycle.yaml state
      their new clauses. Reading ci-rca-lifecycle.yaml by basename literal is what makes the
      Decision 168 evaluator-reads-the-contract binding resolve for the second contract edit too.
      Keep the examined()/skipped() declaration on every reachable path.
  - file: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      Add TestAcceptanceGateAssertions covering each new assertion's pass AND fail limb. 98 SLOC,
      402 headroom. Do NOT rename or relocate
      TestRemovalNegatives::test_read_returns_none_on_oserror -- a graduated shard pins it.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Add a trailer_acceptance_gate key beside the existing resolves_trailer clause: the four-value
      verdict vocabulary AND the axis that makes it distinct from vp-red-before.yaml's, the
      verdict-record field list, the rejoin key (rec_id + acceptance_sha256 + sha), the refusal
      semantics (every non-holds leaves the rec OPEN, loud-not-red, with a close_proposed command),
      the STRUCTURAL binding (the trailer path passes require_acceptance_verdict True, so it cannot
      fail open), and the residual this confines the fail-open to -- non-trailer callers of
      update_rec -- naming rec-3999 as its owner per Decision 181 clause 2. Sited here, not in
      ci-rca-lifecycle.yaml, because resolves_trailer already lives here, the registered evaluator
      already READS this file (Decision 168 point 2), and this file has 196 effective lines of
      headroom against the contracts class's 500 where ci-rca-lifecycle.yaml has 24. Requires a new
      amendment_log[] entry AND contract_version 2 -> 3, or validate_contract_drift fails.
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Two narrow corrections the relocation forces, plus one amendment_log[] entry and
      contract_version 1 -> 2. (i) closure_obligation.refusal_contract names rec-autoclose.yml as
      the workflow that catches ClosureArtifactRequired -- reword to name ci.yml's closure job and
      keep the exit-0 claim. (ii) closure_dependency.trap is scoped to rec-autoclose -- widen it to
      the CI workflow, since a CI-sourced ci_rca rec now cannot assume its own closure auto-stamps
      either (this is T2.54:c1's clause + evaluator pair). HARD SIZE CONSTRAINT: 476 effective
      lines against the 500 contracts-class limit -- keep the whole edit under ~20 lines or compact
      the oldest amendment_log entries in the same change.
      stamp_precondition.call_sites is deliberately NOT touched (constraint 10).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One NEW numbered Decision plus two dated in-place annotations (Decision 177 dialect -- both
      amended bodies are append-only, so neither is rewritten). The Decision's SUBJECT is the
      VERDICT LAYER, not the venue: a standing closure PRECONDITION -- no rec closes on a supplied
      verdict that is not `holds`, or whose record is mis-keyed against the rec, its acceptance hash
      or the closing sha -- asserted at the single update_rec site and bound structurally on the
      trailer path. That gate, binding every closure path through that site, is the significance
      claim (Decision 150 / decision-entry.yaml routing_rule Q3, the Decision 186 justification
      shape); the reuse of scripts/backlog_health's evaluator is recorded as a CLARIFICATION of
      103's existing on-demand-per-rec allowance, never as the amendment's substance -- narrowed to
      venue-reuse alone this content would route to a dated annotation on 103 with no new number.
      The body must also state the two-boundary frame explicitly: write-boundary validation checks
      SHAPE, verify-boundary validation checks TRUTH, so the grammar ratchet is a PRECONDITION for
      the close-time oracle run, never a substitute for it -- 24 of the 30 measured false closures
      are well-formed oracles whose assertion simply did not hold, which only a close-time run
      catches. `amends` names BOTH 103 (the "No new acceptance machinery is introduced" clause,
      which the verdict layer -- not the oracle -- crosses) and 186 (point 7 names rec-autoclose.yml
      as the catching workflow, which this relocation falsifies). The body MUST mention
      `.github/workflows/ci.yml` to authorise the r3_workflows markers, MUST justify the vocabulary
      axis (constraint 5), and MUST carry the Decision 167 fenced yaml envelope with a
      `significance` field whose justification names the contract home considered and rejected.
      Stay inside decision-entry.yaml's per_entry_size_norm.cap_bytes (6144). DO NOT HARDCODE THE
      NUMBER: 198 is claimed by the merged-but-unlanded PLAN-decision-198-brand-supersession, so
      resolve the next free number at implement time against DECISIONS.md AND every plan under
      docs/plans/.
  - file: tests/fixtures/trailer_acceptance_smoke.json
    action: Create
    purpose: >-
      The two-entry payload VP step 20 drives the real pipeline over: one acceptance known to pass
      at HEAD and rec-940's acceptance, the dossier exhibit that returns zero matches on main today.
      Held as a fixture rather than inlined so the smoke run is reproducible and the discriminating
      pair is reviewable.
  - file: config/agent/verification_registry/entries/trailer-acceptance-verdict-refuses-non-holds.yaml
    action: Create
    purpose: >-
      Graduate VP step 4 as a test_selector shard so the refusal predicate becomes a standing
      regression guard. Fields mirror rec-autoclose-trailer-gate-read-oserror.yaml.
  - file: config/agent/verification_registry/entries/trailer-acceptance-evaluator-job-is-credential-free.yaml
    action: Create
    purpose: >-
      Graduate VP step 8 as a test_selector shard pinning the Decision 143 privilege separation --
      the evaluator job declares no id-token permission and no secret env. This is the security
      boundary, so it gets a standing, escape-free guard rather than a one-time assertion.
  - file: config/agent/verification_registry/entries/trailer-closure-cannot-fail-open.yaml
    action: Create
    purpose: >-
      Graduate VP step 6 as a test_selector shard pinning the Decision 163 structural binding: with
      require_acceptance_verdict True, a rec with no verdict is never passed to update_rec. This is
      the clause that makes the gate executed rather than merely declared, so it gets a standing
      guard.
bundled_recommendations: []
followon_recs:
  - rec-3999
  - rec-4000
  - rec-4001
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A rec named in a Resolves: trailer whose acceptance command does NOT pass at the merge commit
    is left OPEN by the closure job, with a distinct greppable marker, a $GITHUB_STEP_SUMMARY
    mirror, and a printed close_proposed command -- and the job still exits 0 (loud-not-red).
  - >-
    The gate is EXECUTED, not merely declared (Decision 163): the ci.yml closure job passes
    require_acceptance_verdict True, so a trailer-named rec with no verdict is never passed to
    update_rec. The remaining fail-open is confined to non-trailer callers of update_rec and is
    named in docs/contracts/git-ops.yaml with rec-3999 as its owner (Decision 181 clause 2).
  - >-
    The verdict vocabulary is exactly {holds, fails, unmeasurable, out_of_grammar}; every non-holds
    value leaves the rec open. The bucket x probe-verdict map is TOTAL and is asserted total by a
    test that reddens when either upstream vocabulary gains a member. Its intersection with
    docs/contracts/vp-red-before.yaml's OUTCOME_CLASSES is exactly {"unmeasurable"} -- the one
    genuinely shared arm -- and that equality is asserted, not restated.
  - >-
    The evaluator runs in a ci.yml job declaring permissions {contents: read} with no id-token grant
    and no writer secret (Decision 143), and the registered guard's assertion of that fact is
    escape-free: no marker, no config allowlist, no skip path. The sandbox, not the grammar
    allowlist, is the boundary.
  - >-
    The verdict is asserted at exactly ONE site -- update_rec, beside assert_closure_obligation
    (Decision 186 point 2). A stale or mis-keyed verdict (wrong rec_id, wrong acceptance_sha256,
    wrong sha) cannot close a rec.
  - >-
    acceptance_verdict is a gate INPUT, never a context_v2_json stamp: update_rec's
    closure_stamps_applicable precondition is not extended, so the ~99.6% of open recs carrying no
    context_v2_json blob stay closable. Verified by a test closing a blob-less rec on a holds
    verdict.
  - >-
    The relocation preserves every property of the step it replaces: ClosureArtifactRequired is
    still caught, still prints its own marker, still leaves the rec OPEN and still exits 0; the
    closing write still stamps the merge-commit GITHUB_SHA Decision 142's ancestry check consumes;
    CI remains a ci_rca-watched workflow, and rec-autoclose.yml's backfill step keeps the
    `sys.exit(1 if result["failed"] else 0)` line Decision 155's reversal condition (c) is pinned
    to.
  - >-
    lint_acceptance_command(..., require_decidable=True) refuses an acceptance command carrying no
    decidable assertion in any segment, admits a declared `--assert-<name>` exit contract, and is
    EXECUTED in the trailer census stage, where a refusal becomes the out_of_grammar verdict.
    Default False leaves every existing caller unchanged. The write-boundary and
    validate_acceptance_literals bindings are deliberately deferred to rec-4001 -- binding them now
    would refuse three shipped `bin/venv-python -m scripts.validate --pre` acceptance literals that
    active budget_breach / budget_bypass filers write at runtime.
  - >-
    The pre-existing quote-cutting false-pass in _classify_non_discriminating is fixed on the same
    quote-aware tokenizer, so a lone grep carrying quoted alternation no longer evades
    require_discrimination. Measured: 23 of 1327 open recs newly refused, 0 shipped acceptance
    literals affected.
  - >-
    rec-3867 is SUPERSEDED via the ops portal, never trailer-closed: its acceptance names
    tests/test_rec_autoclose.py, which does not exist and is not created here, so it can never pass
    and the new gate would correctly refuse it.
  - >-
    docs/contracts/git-ops.yaml and docs/contracts/ci-rca-lifecycle.yaml each carry a new
    amendment_log[] entry AND a contract_version bump, each with an evaluator that demonstrably
    reads them (Decision 168); the new numbered Decision carries a Decision 167 fenced yaml envelope
    with a significance claim resting on the GATE, amends both 103 and 186, and lands alongside
    dated annotations on 103 and on 186 point 7 rather than edits to either body (Decision 177).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The four-value verdict vocabulary and its total bucket x probe-verdict mapping exist.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestVerdictMapping::test_mapping_is_total" -q
    expected: The mapping test passes; every (bucket, probe_verdict) pair resolves to one of the four verdicts.
    fix_if: A pair maps to None or raises -- the map is partial, so an upstream vocabulary change would silently drop a verdict.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-verdict-map-is-total
    expected_literals:
      - "1 passed"
  - step: 2
    phase: pre-deploy
    action: The shared arms are asserted equal to scripts.backlog_health's own vocabularies rather than restated.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestVerdictMapping::test_probe_vocabulary_parity" -q
    expected: The parity test passes, deriving both upstream sets from scripts.backlog_health at runtime.
    fix_if: The test hardcodes the upstream members -- a new probe verdict or census bucket would then map to nothing silently.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-probe-vocabulary-parity
    expected_literals:
