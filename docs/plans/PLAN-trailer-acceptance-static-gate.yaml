      regression arm on the quote-aware fix asserting that a lone grep with quoted alternation is
      now correctly refused under require_discrimination=True. 269 effective lines, 231 headroom
      (349 is the raw line count, corrected at critique round 1).
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Three new push-only jobs, mirroring backlog-health.yml's ratified three-job credential split.
      trailer-census (id-token: write) parses the trailer, reads the named recs via the DuckLake
      reader, classifies, uploads trailer_census.json; executes nothing. trailer-acceptance-evaluate
