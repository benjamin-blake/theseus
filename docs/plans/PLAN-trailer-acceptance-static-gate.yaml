      false) runs the sysctl step that unblocks unprivileged user namespaces, then the sandboxed
      evaluator; uploads acceptance_verdict.json. trailer-closure (needs both, if: always(),
      id-token: write) rejoins and closes with require_acceptance_verdict True. EVERY job body is a
      THIN ADAPTER -- one `bin/venv-python -m scripts.rec_trailer_acceptance <verb>` line (Decision
      162 spirit) -- so no logic lives in a workflow body. The closure verb must preserve today's
      `sys.exit(close_recs_from_trailer(...))` contract exactly: a Decision 186
      ClosureArtifactRequired refusal and an acceptance refusal both leave the rec OPEN and exit 0
      (loud-not-red), and the closing write stamps the same merge-commit GITHUB_SHA that Decision
      142's ancestry check consumes. Constraints: trailer-census and
      trailer-acceptance-evaluate declare `if: github.event_name == 'push'`, and trailer-closure
      declares `if: always() && github.event_name == 'push'` -- a BARE always() is read by
      _admits_pull_request as PR-gating, which would force trailer-closure into
      signal-green.needs. No step text may contain the
      literal `scripts.validate` (it would sweep the job into _full_tier_jobs and demand
      fetch-depth 0); no check-like module name matching ^(validate|verify|check); ci.yml is at 220
      effective lines against the ci_workflows class's 500 (Decision 166).
