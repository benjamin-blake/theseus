schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "coverage-paydown-ops-writer-sync-ops"
intent: >-
  Pay scripts/ops_writer.py and scripts/sync/ops.py down to 100% line coverage and remove both
  from the Decision 159 grandfather roster, and recover scripts/sync/recommendations.py's
  already-written-but-uncounted coverage by registering it as a concern-split package. Takes the
  roster from 12 entries to 10. Closes rec-2902.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-paydown-ops-writer-sync-ops.yaml
phase: >-
  Coverage-debt paydown slice 2, following slice 1 (PLAN-coverage-checker-self-enforcement,
  merged f688181) and Decision 158/159. Soft-warn category: ad_hoc_rec; no tier_item named.
  rec-2914 remains the roster-wide tracker across all remaining slices.
scope:
  - file: tests/ops_writer/test_drain.py
    action: Create
    purpose: >-
      NEW module covering drain() -- 29 of ops_writer.py's 79 uncovered statements, and the
      specific target of rec-2902. CRITICAL (Decision 84 I-4): cover the loop using ONLY tables
      that legitimately drain. ops_session_log exercises the `table in _OPS_TABLE_NAMES` branch
      (dt= partition key) and any telemetry_* table exercises the else branch (trade_date key),
      so every statement is reachable without ever asserting that a DuckLake-migrated table
      drains. No test here may assert put_object for ops_decisions or ops_priority_queue --
      that would encode as blessed the exact resurrection behaviour the warehouse invariant
      forbids. The missing production guard is rec-2929, deliberately NOT fixed here (see
      constraints). Name is collision-free: tests/ops_writer/ has no test_drain.py today.
  - file: tests/ops_writer/test_compact_paths.py
    action: Create
    purpose: >-
      NEW module covering compact() -- 17 statements in compact() proper PLUS the 14 in
      _parse_list, which is a CLOSURE DEFINED INSIDE compact() (scripts/ops_writer.py:415-429,
      nested under `for col in _LIST_COLUMNS:` / `if col in df.columns:` and invoked at line 431
      via df[col].apply(_parse_list)). It is NOT importable at module scope: its statements are
      reachable only by driving compact() with a DataFrame carrying a dependencies/tags column.
      31 statements total. A new module rather than growth of test_compact.py (329/500 SLOC) or
      test_compact_edge_cases.py (228/500), per Decision 128/130 decompose-by-default.
  - file: tests/ops_writer/test_client_helpers.py
    action: Create
    purpose: >-
      NEW module covering the remaining 19 statements across the client/boundary helpers --
      _get_boto3_session (6), _refresh_view (6), _bucket (4), write (3). NOTE _parse_list is
      NOT here: it is a closure inside compact() and belongs to test_compact_paths.py.
      Collision-free (existing module is test_client_bucket.py). These are the integration-
      boundary statements Decision 48's SPIRIT flag names: assert the CONTRACT (correct client,
      verb and arguments; the loud raise on failure per Decision 55), not mere line execution.
  - file: tests/sync/ops/test_upsert_cache.py
    action: Create
    purpose: >-
      NEW module covering upsert_cache_row (18) and warm_sync (10) -- 28 of sync/ops.py's 83
      uncovered statements.
  - file: tests/sync/ops/test_coercion_edges.py
    action: Create
    purpose: >-
      NEW module covering the coercion helpers' uncovered branches -- _coerce_rows_list (8),
      _coerce_ops_execution_plans_row (8), _coerce_ops_decisions_row (4)
      = 20 statements. Collision-free (existing module is test_coercion.py).
  - file: tests/sync/ops/test_cli_and_rejects.py
    action: Create
    purpose: >-
      NEW module covering the remaining 31 statements -- _write_decisions_sync_reject (7),
      check_sso (6), outbox_summary (3), main (3), drain (3), _write_sync_reject (2), plus the
      residual scattered lines. Collision-free (existing module is test_sync_cli.py).
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      ONE line only (option D): add "scripts/sync/recommendations.py" to
      _CONCERN_SPLIT_TEST_PACKAGES. Slice 1 made that membership independently sufficient, so
      this alone repoints the mapping from the flat tests/test_sync_recommendations.py to the
      directory tests/sync/recommendations/ (verified by simulated registration). NOTE: slice 1
      took this file to 100% and REMOVED it from the roster, so it now carries the unbaselined
      100% requirement -- touching it re-subjects it to its own gate. Adding a string to a
      module-level frozenset literal is executed at import and adds no uncovered statement, but
      VP step 8 verifies that rather than assuming it. This file is NOT Lambda-packaged
      (compute_affected_artifacts -> {}), so it does not affect the V2 determination.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Option D FLIPS a mapping this module pins, so it must change in the same PR or the suite
      reddens. Verified empirically by simulating the one-line registration: 2 failed / 90
      passed. Line 84 asserts map_source_to_test(scripts/sync/recommendations.py) ==
      ROOT/"tests"/"test_sync_recommendations.py". Do NOT merely flip the expected value: the
      test is named test_maps_still_grandfathered_sync_sibling_to_flat_home and its docstring
      encodes a deliberate regression guard (that Wave 10's retirement of test_sync_ops.py did
      not perturb the family-sibling prefix rule). Repoint it to
      scripts/sync/ducklake_version.py -- verified a clean substitute: it maps to the flat
      tests/test_sync_ducklake_version.py, is in NONE of _RETIRING_GRANDFATHER_HOMES,
      _ALL_MIRROR_TARGET_HOMES or _CONCERN_SPLIT_TEST_PACKAGES, and its target file exists --
      so the guard survives. Update its docstring too -- the existing wording cites "Wave 10's
      retirement of test_sync_ops.py" as the thing being guarded against, which would otherwise
      describe a different assertion than the one beneath it. Then ADD a new positive test
      asserting scripts/sync/recommendations.py -> tests/sync/recommendations as the
      concern-split case.
  - file: tests/test_coverage_checker/test_coverage_checker_grandfather.py
    action: Modify
    purpose: >-
      Same flip inside the whole-map oracle dict at line 51: change the
      ROOT/"scripts"/"sync"/"recommendations.py" case from ROOT/"tests"/"test_sync_recommendations.py"
      to ROOT/"tests"/"sync"/"recommendations". This is a value correction, not a guard
      deletion -- the oracle's purpose is to pin the whole map, so the new value IS the point.
  - file: tests/sync/recommendations/__init__.py
    action: Create
    purpose: Per-package __init__.py required by Decision 131 cl.4 for every mirror test dir.
  - file: tests/sync/recommendations/test_sync_recommendations.py
    action: Create
    purpose: >-
      Moved from tests/test_sync_recommendations.py (162 SLOC) via `git mv`, then ONE required
      depth correction in a separate commit: line 12's
      `Path(__file__).resolve().parent.parent` must become `.parent.parent.parent.parent`.
      From tests/ two levels reaches the repo root; from tests/sync/recommendations/ it reaches
      tests/sync, yielding <root>/tests/sync/scripts/sync/recommendations.py -- a path that does
      not exist, so spec_from_file_location raises at import and all 15 tests in the module are
      lost as a COLLECTION error (not a test failure). Verified: 4 levels reaches the root.
  - file: tests/sync/recommendations/test_sync_recommendations_decisions.py
    action: Create
    purpose: >-
      Moved verbatim from tests/test_sync_recommendations_decisions.py (91 SLOC) via `git mv`.
      This is the module whose coverage the flat mapping was discarding -- it is the entire
      source of the 20-statement recovery.
  - file: tests/test_sync_recommendations.py
    action: Delete
    purpose: Superseded by the package member above (git mv source).
  - file: tests/test_sync_recommendations_decisions.py
    action: Delete
    purpose: Superseded by the package member above (git mv source).
  - file: config/coverage_baseline.yaml
    action: Modify
    purpose: >-
      REMOVE the scripts/ops_writer.py (75.4) and scripts/sync/ops.py (73.6) entries once both
      measure 100.0, and RAISE scripts/sync/recommendations.py from 61.0 to 78.0 (its measured
      value once its second test module counts -- verified: 61.0% mapped-home-only vs 78.0%
      with both modules, 46 -> 26 missing of 118). All three edits are unrestricted under
      Decision 159 cl.3 (removals and raises need no marker). Roster goes 12 -> 10 entries.
      sync/recommendations.py is deliberately RAISED, not removed: its residual 26 statements
      stay owned by rec-2914 rather than being absorbed into this slice.
bundled_recommendations:
  - rec-2902
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts/ops_writer.py measures 100.0% through the gate's own measurement path (was 75.77%,
    79 of 326 statements missing) and has no entry in config/coverage_baseline.yaml.
  - >-
    scripts/sync/ops.py measures 100.0% through the same path (was 73.65%, 83 of 315 missing)
    and has no entry in config/coverage_baseline.yaml.
  - >-
    Option D mapping: map_source_to_test(scripts/sync/recommendations.py) returns the DIRECTORY
    tests/sync/recommendations, and the file measures 77.97% raw -- which is what the gate
    compares, `round(measured, 1) >= threshold`, so 78.0 >= 78.0 passes (was 61.0% against the
    flat mapped file). Its roster entry is raised to 78.0, not removed.
  - >-
    Decision 84 compliance: no test in tests/ops_writer/ asserts that a DuckLake-migrated table
    (ops_decisions, ops_priority_queue) is drained or put_object'd. drain() reaches 100% via
    ops_session_log and telemetry_* alone.
  - >-
    scripts/test_coverage_checker.py still measures 100.0% after its one-line edit (it left the
    roster in slice 1, so it now carries the unbaselined 100% requirement).
  - >-
    Stale-reference sweep: no file outside docs/plans/** still references
    tests/test_sync_recommendations.py or tests/test_sync_recommendations_decisions.py, and
    neither old path exists on disk.
  - >-
    Every new test module is under 500 SLOC by the gate's own counting rule, no
    config/sloc_budgets.yaml entry is added, and no per-package conftest.py is introduced in
    tests/ops_writer/ or tests/sync/ops/ (Decision 153: a sub-conftest forces its subtree
    uncapped with no fast-tier budget waiver).
  - >-
    Boundary-contract quality (review-verified, not mechanically checkable): every new test
    exercising an S3/DuckLake boundary asserts the call contract -- client, verb and arguments
    -- and the loud-raise path, rather than merely executing the line. Removing these roster
    entries is a LINE-COVERAGE claim, not an integration-behaviour claim (Decision 48).
  - >-
    rec-2902 is closed; rec-2914 remains open as the roster tracker; rec-2929 (the drain()
    never-drain guard) remains open and unaddressed by this plan.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Measure scripts/ops_writer.py through the gate's own path and assert 100%, with a
      non-vacuity guard so a missing measurement fails loudly rather than reading as a pass.
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,'.');
      s=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(s); s.loader.exec_module(m);
      from scripts.checks.misc import coverage_baseline as cb;
      p=(pathlib.Path.cwd()/'scripts/ops_writer.py').resolve();
      pcts,errs=cb.measure_and_check([p], root=pathlib.Path.cwd(), map_source_to_test=m.map_source_to_test,
      is_empty_dir=m._is_empty_directory_target, subprocess_module=subprocess);
      v=pcts.get(str(p)); assert isinstance(v,float), f'no measurement (dead gate): {pcts} {errs}';
      assert v>=100.0, f'{v}% < 100%'; print(f'ops_writer {v:.2f}%')"
    expected: Prints 100.00%.
    fix_if: >-
      Below 100 - list residual lines with `pytest tests/ops_writer --cov=scripts
      --cov-report=term-missing` and extend the new modules. None measurement - the package
      target is empty or unmapped.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Rejected on live/HEAD in the authoritative CI environment (Decision 148): the differential
      admission gate runs during --pre, which pr-validate executes venv-less against
      requirements-fast.txt only. This check's command runs pytest across tests/ops_writer/,
      which contains pre-existing pandas/boto3-dependent modules (test_compact.py,
      test_outbox_emit.py, test_write.py, and this plan's own test_compact_paths.py) --
      pandas/boto3 ship only in requirements.txt, not requirements-fast.txt. The check passed
      locally (full venv has both deps) and was initially admitted, but CI's pr-validate run
      (job 91205051975) failed it with "Command exited 1" -- not admitted for real. The
      differential-admission subprocess bypasses the ordinary --pre test-selection deferral
      that keeps these same files out of the fast-tier test run, so it cannot certify a
      pandas/boto3-dependent pytest invocation as a registry entry. Retained as a manual,
      local-only VP step; not graduated.
  - step: 2
    phase: pre-deploy
    action: Same measurement for scripts/sync/ops.py.
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,'.');
      s=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(s); s.loader.exec_module(m);
      from scripts.checks.misc import coverage_baseline as cb;
      p=(pathlib.Path.cwd()/'scripts/sync/ops.py').resolve();
      pcts,errs=cb.measure_and_check([p], root=pathlib.Path.cwd(), map_source_to_test=m.map_source_to_test,
      is_empty_dir=m._is_empty_directory_target, subprocess_module=subprocess);
      v=pcts.get(str(p)); assert isinstance(v,float), f'no measurement (dead gate): {pcts} {errs}';
      assert v>=100.0, f'{v}% < 100%'; print(f'sync/ops {v:.2f}%')"
    expected: Prints 100.00%.
    fix_if: Below 100 - same diagnosis against tests/sync/ops.
    hermetic: false
    graduation: graduate
    graduation_check_id: sync-ops-at-100
  - step: 3
    phase: pre-deploy
    action: >-
      Option D - the mapping repoints to the package directory and the recovered coverage is
      real (>= 78.0%, up from 61.0%).
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,'.');
      s=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(s); s.loader.exec_module(m);
      p=(pathlib.Path.cwd()/'scripts/sync/recommendations.py').resolve();
      t=m.map_source_to_test(p); assert t is not None and t.is_dir() and t.name=='recommendations', t;
      from scripts.checks.misc import coverage_baseline as cb;
      pcts,errs=cb.measure_and_check([p], root=pathlib.Path.cwd(), map_source_to_test=m.map_source_to_test,
      is_empty_dir=m._is_empty_directory_target, subprocess_module=subprocess);
      v=pcts.get(str(p)); assert isinstance(v,float), f'no measurement: {pcts} {errs}';
      assert round(v,1)>=78.0, f'{v}% (rounded {round(v,1)}) < 78.0 -- recovery did not land'; print(f'sync/recommendations {v:.2f}% -> rounds to {round(v,1)} via {t}')"
    expected: >-
      Prints ~77.97% -> rounds to 78.0, and the tests/sync/recommendations directory path.
      The assertion deliberately mirrors coverage_baseline.compare(), which is
      `round(measured_pct, 1) >= threshold` -- the raw value is 92/118 = 77.966%, so a raw
      `>= 78.0` comparison would FAIL a correct implementation while the gate itself passes.
    fix_if: >-
      Still maps to the flat file - the _CONCERN_SPLIT_TEST_PACKAGES line was not added.
      Rounded value below 78.0 - the second test module did not move into the package. Do NOT
      respond by writing extra tests: this slice deliberately caps sync/recommendations.py at
      register+move+raise, and its residual 26 statements are rec-2914's.
    hermetic: false
    graduation: graduate
    graduation_check_id: sync-recommendations-concern-split-recovery
  - step: 4
    phase: pre-deploy
    action: >-
      Decision 84 guard - prove drain() coverage was NOT bought by blessing migrated-table
      draining. The new drain module must exist and must not name a migrated table.
    command: >-
      test -f tests/ops_writer/test_drain.py && ! grep -qE 'ops_decisions|ops_priority_queue'
      tests/ops_writer/test_drain.py && echo 'drain tests use only legitimately-drainable tables'
    expected: Exit 0, prints the confirmation.
    fix_if: >-
      grep hits - a test asserts behaviour on a DuckLake-migrated table. Rewrite it against
      ops_session_log (covers the _OPS_TABLE_NAMES branch) or a telemetry_* table (covers the
      else branch); both branches are reachable without migrated tables. The production guard
      is rec-2929's job, not this plan's.
    hermetic: true
    graduation: graduate
    graduation_check_id: drain-tests-avoid-migrated-tables
  - step: 5
    phase: pre-deploy
    action: Roster reflects the paydown - two removals and one raise.
    command: >-
      bin/venv-python -c "import yaml;
      e=yaml.safe_load(open('config/coverage_baseline.yaml'))['entries'];
      assert 'scripts/ops_writer.py' not in e, 'ops_writer still rostered';
      assert 'scripts/sync/ops.py' not in e, 'sync/ops still rostered';
      r=e.get('scripts/sync/recommendations.py');
      assert r is not None and r>=78.0, f'sync/recommendations not raised: {r}';
      print(f'roster now {len(e)} entries; sync/recommendations raised to {r}')"
    expected: Prints 10 entries and the raised value.
    fix_if: >-
      Entries still present - the measurement steps did not reach 100, so do not delete them.
      sync/recommendations lowered or removed - it must be RAISED to its measured value; its
      residual stays owned by rec-2914.
    hermetic: true
    graduation: graduate
    graduation_check_id: roster-twelve-to-ten
  - step: 6
    phase: pre-deploy
    action: >-
      Stale-reference sweep (surface-retiring closure obligation - this plan has Delete rows).
      Excludes registry.yaml, which may legitimately carry these literals inside a graduated
      check_spec of this very step (the self-match trap slice 1 hit).
    command: >-
      test ! -f tests/test_sync_recommendations.py && test ! -f tests/test_sync_recommendations_decisions.py
      && { grep -rn --include=*.py --include=*.yaml --include=*.yml --include=*.md
      --exclude=registry.yaml -e 'tests/test_sync_recommendations\.py'
      -e 'tests/test_sync_recommendations_decisions\.py'
      -e '"tests"[[:space:]]*/[[:space:]]*"test_sync_recommendations'
      scripts/ config/ tests/ docs/contracts/ .github/ .claude/; test $? -eq 1; }
      && echo 'no stale references to the moved modules'
    expected: Exit 0, prints the confirmation.
    fix_if: >-
      grep finds a hit - repoint it. Check config/agent/verification_registry/registry.yaml
      separately by hand for a node_id referencing either moved path, since it is excluded here.
    hermetic: true
    graduation: graduate
    graduation_check_id: sync-recommendations-move-no-stale-refs
  - step: 7
    phase: pre-deploy
    action: Run all three affected test packages.
    command: bin/venv-python -m pytest tests/ops_writer tests/sync/ops tests/sync/recommendations -q
    expected: Exit 0; every existing test still passes from its location and all new tests pass.
    fix_if: >-
      Collection error in tests/sync/recommendations - FIRST SUSPECT is the _MODULE_PATH depth
      in test_sync_recommendations.py (line 12): the move added two directory levels, so
      `.parent.parent` must become `.parent.parent.parent.parent`. Only after ruling that out,
      check the package __init__.py and whether any tests.fixtures import still resolves.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Rejected on live/HEAD in the authoritative CI environment (Decision 148), same root cause
      as step 1's waiver: this check's command runs pytest across all three packages including
      tests/ops_writer/, which contains pandas/boto3-dependent modules absent from pr-validate's
      venv-less requirements-fast.txt environment. CI's pr-validate run (job 91205051975) failed
      it with "Command exited 2". Retained as a manual, local-only VP step; not graduated.
  - step: 8
    phase: pre-deploy
    action: >-
      The one-line edit to scripts/test_coverage_checker.py did not cost it the 100% it reached
      in slice 1 (it is off the roster, so it carries the unbaselined 100% requirement).
    command: >-
      bin/venv-python -c "import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,'.');
      s=importlib.util.spec_from_file_location('tcc','scripts/test_coverage_checker.py');
      m=importlib.util.module_from_spec(s); s.loader.exec_module(m);
      from scripts.checks.misc import coverage_baseline as cb;
      p=(pathlib.Path.cwd()/'scripts/test_coverage_checker.py').resolve();
      pcts,errs=cb.measure_and_check([p], root=pathlib.Path.cwd(), map_source_to_test=m.map_source_to_test,
      is_empty_dir=m._is_empty_directory_target, subprocess_module=subprocess);
      v=pcts.get(str(p)); assert isinstance(v,float), f'no measurement: {pcts} {errs}';
      assert v>=100.0, f'checker regressed to {v}%'; print(f'checker still {v:.2f}%')"
    expected: Prints 100.00%.
    fix_if: >-
      Below 100 - the added line introduced an uncovered statement; it must be a plain string
      inside the existing frozenset literal, not a conditional or a computed value.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Not differentially admissible - scripts/test_coverage_checker.py already measures 100% on
      origin/main (slice 1 put it there), so this assertion passes identically before and after
      the change and cannot demonstrate FAIL-on-revert. It is retained as a genuine regression
      guard on a file this plan touches while it carries an unbaselined 100% requirement, which
      is exactly the condition under which a silent drop would redden main.
  - step: 9
    phase: pre-deploy
    action: SLOC ceiling on every new and moved module, and no new sloc_budgets entry.
    command: >-
      bin/venv-python -c "from pathlib import Path;
      fs=[f for d in ('tests/ops_writer','tests/sync/ops','tests/sync/recommendations')
      for f in sorted(Path(d).glob('*.py'))];
      bad=[(f.as_posix(),n) for f in fs for n in [len([l for l in
      f.read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')])] if n>500];
      assert not bad, bad;
      b=Path('config/sloc_budgets.yaml').read_text();
      assert not any(x in b for x in ('tests/ops_writer','tests/sync/ops','tests/sync/recommendations')), 'budget entry added';
      print(f'{len(fs)} modules all under 500 SLOC')"
    expected: Exit 0, prints the module count.
    fix_if: >-
      A module is over - split it further inside its package. Do NOT register a budget raise
      (Decision 128 decompose-by-default).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Passes on origin/main too - the existing modules are all already under 500 and the new
      ones simply do not exist there, so the assertion holds vacuously on revert and cannot
      demonstrate FAIL-on-revert. Retained as a ceiling guard for this PR; the durable
      enforcement surface is validate_sloc_limits (whole-repo, full tier).
  - step: 10
    phase: pre-deploy
    action: Fast-tier presubmit.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. validate_no_cross_test_imports and validate_placement both pass with the new
      tests/sync/recommendations package.
    fix_if: >-
      Cross-test-import failure - a new or moved module imports another test module; route
      shared helpers through tests/fixtures/ (the Decision 131 cl.2-exempt channel), never a
      per-package conftest.py (Decision 153 budget risk).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: >-
      Full-tier presubmit - the only tier validate_test_coverage runs in, and the run that
      proves the three touched source files satisfy the gate together.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0. The test-coverage section lists the changed source files with 0 below baseline.
      A report of "No source file changes to check." is a FAILURE of this step, not a pass.
    fix_if: Coverage errors - a changed file measures below its (now absent or raised) baseline.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: Closure obligation - rec-2902 auto-closed via the Resolves trailer.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()];
      st={r['id']:r['status'] for r in rows if r['id'] in ('rec-2902','rec-2914','rec-2929')};
      assert st.get('rec-2902')=='closed', st;
      assert st.get('rec-2914')=='open' and st.get('rec-2929')=='open', f'tracker/guard wrongly closed: {st}';
      print(st)"
    expected: rec-2902 closed; rec-2914 and rec-2929 still open.
    fix_if: >-
      rec-2902 still open - rec-autoclose.yml did not fire; fall back to
