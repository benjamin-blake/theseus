constraints:
  - >-
    HARD, and the single highest-risk constraint in this plan: DO NOT modify
    scripts/ops_writer.py. It is packaged into TWO ACTIVE Lambda artifacts (data-pipeline,
    ops-compaction), so Decision 79's manifest-graph rule would flip this plan from V2 to V3 and
    demand per-Lambda build + deploy + smoke-test steps. Verified: test paths return {} from
    compute_affected_artifacts, the source path does not. If a test seam, a pragma, or any other
    source edit seems necessary, STOP and re-plan as V3 rather than editing it.
  - >-
    Decision 84 I-4: no test may assert that a DuckLake-migrated table (ops_decisions,
    ops_priority_queue) is drained. drain() reaches 100% via ops_session_log for the
    _OPS_TABLE_NAMES branch and telemetry_* for the else branch. The production function's
    missing never-drain guard is rec-2929 and is deliberately out of scope here -- fixing it
    means editing ops_writer.py, which is the V3 trigger above.
  - >-
    Decision 48 SPIRIT: these are integration-boundary statements (_get_boto3_session, _bucket,
    drain, warm_sync, check_sso), and Decision 48 exists because a pipeline once shipped with
    100% mocked coverage and 7 live bugs. Assert the call contract -- client, verb, arguments --
    and the loud-raise path (Decision 55), not mere line execution. A mock that swallows a raise
    converts a loud failure into a covered line, which is worse than the uncovered line. At the
    S3 boundary prefer botocore.Stubber over a bare MagicMock: it validates the request shape
    against the real botocore service model, which turns "asserted the call contract" from a
    reviewer judgement into a machine-checked one.
  - >-
    Decision 153: do NOT add a conftest.py to tests/ops_writer/ or tests/sync/ops/. A
    sub-conftest sets conftest_subtree_forced, which force-selects its whole subtree into the
    --pre affected set WITHOUT the full_suite_forced budget waiver (that fires only for the root
    tests/conftest.py), so it can hard-fail the 300s fast-tier budget. Shared setup goes in
    tests/fixtures/ -- which is also the Decision 131 cl.2 cross-test-import-exempt channel and
    already hosts tests/fixtures/ops_writer_helpers.py (make_writer).
  - >-
    Decision 88 / rec-2484: never construct a live AWS client. The root tests/conftest.py already
    guards boto3/botocore create_client and applies --disable-socket; mock via
    unittest.mock.patch, moto, or a botocore Stubber. Follow the established idiom in
    tests/ops_writer/test_compact.py (patch _AWR_AVAILABLE / _BOTO3_AVAILABLE, patch.object the
    writer's _get_boto3_session, patch scripts.ops_writer.wr).
  - >-
    New tests must not leak into logs/.ops-outbox/. The collection-time guard from
    PLAN-outbox-test-hermeticity aborts the WHOLE pytest run when files appear under a retired
    outbox dir, so a leaking test breaks every other suite, not just its own.
  - >-
    Move the two sync/recommendations test modules with `git mv`. The ONLY permitted content
    edit is a required depth correction, made as a SEPARATE commit after the move:
    tests/test_sync_recommendations.py line 12 reads
    `Path(__file__).resolve().parent.parent / "scripts" / "sync" / "recommendations.py"`, which
    resolves to the repo root from tests/ but to tests/sync from the new package -- yielding a
    non-existent path and a spec_from_file_location ImportError that takes all 15 of that
    module's tests out as a COLLECTION error. It must become `.parent.parent.parent.parent`
    (verified: 4 levels reaches the root from tests/sync/recommendations/). The sibling module
    needs no edit -- it uses the absolute `from scripts.sync.recommendations import ...`.
  - >-
    scripts/test_coverage_checker.py gets exactly ONE new line (the
    _CONCERN_SPLIT_TEST_PACKAGES entry). It left the roster in slice 1 and therefore carries the
    unbaselined 100% requirement -- any edit that adds an uncovered statement reddens the gate.
  - >-
    No rescue agents or workaround loops (Decision 55). If a statement proves genuinely
    unreachable, raise that file's baseline to the achieved value and record the residual
    against rec-2914 rather than weakening a VP step.
