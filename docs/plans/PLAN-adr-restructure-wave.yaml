  waiver_reason: 'Expected-untouched contingency row: the Class D amendment-log gate (check_amendment_log_for_class_d via
    validate_contract_drift) and the structural budget guard already fail any nonconforming edit; a plan-specific test would
    assert the absence of a change.'
- source: docs/contracts/telemetry_agents.yaml
  behavior: All nine Decision 95 citation lines re-pointed to the roster-owning surface with same-commit per-field amendment_log
    entries (Class A ritual contract).
  verification_step: 3
  command: bin/venv-python -m scripts.validate --pre
  waiver_reason: 'Prose/semantics re-point on a ritual Class A contract: contracts_enforcement.check_amendment_for_diff
    enforces the per-field amendment_log obligation mechanically at VP step 3; the change carries no executable behavior
    a red/green unit test could exercise beyond that standing gate.'
- source: docs/contracts/telemetry-lexicon.yaml
  behavior: Contingency-only destination-side governance note for the D95 re-point; if landed as YAML data it carries a
    Class D amendment_log entry.
  verification_step: 3
  command: bin/venv-python -m scripts.validate --pre
  waiver_reason: 'Expected-minimal contingency row on a Class D contract: the amendment-log gate fails any data-level note
    lacking its entry; no executable behavior exists for a bespoke red/green test to cover.'
constraints:
- 'Wave constitution (operator-ratified 2026-08-24): clause/point numbering and labels are frozen public API in every residual;
  required markers, header lines with original parentheticals, amendment trails, Warehouse ID lines, and fenced reversal-conditions
  stanzas are preserved verbatim; Intent sections of post-D151 entries are byte-preserved (D151 clause 3(ii)); extraction
  leaves WHY (including the WHY-of-the-HOW) plus a pointer naming the owning surface, never an absence; destination-side
  re-point edits land in the SAME commit as their entry rewrite.'
- 'DISPOSITION-ROW FIELD PRECEDENCE (critique round 2): where a row''s VERIFY sentence conflicts with its DRIFT/PRESERVE/RATIONALE
  text, VERIFY is the adversarially-verified final word. Applied concretely: D151 = trim clause-2 manifest narrative + clause
  4 only, keep clause 3, docs/contracts/decision-entry.yaml stays untouched (its RATIONALE''s "extend the contract first"
  phrasing is superseded); D66 = duplication not homeless spec -- the EXTEND-the-destination clause is STRUCK (docs/contracts/ops_recommendations.yaml
  is out of scope and sits at exactly 556/556 effective lines under its dec-166 marker; extending it would red validate_structural_size_limits
  with no in-plan remedy); D95 = the REPORT-ONLY scope note is ADR Consequences and STAYS; D142 = treat point 2 as landed
  change-record (the add-a-junit_wiring-block option is STRUCK -- docs/contracts/ci-rca-lifecycle.yaml is out of scope).
  The wave constitution likewise overrides any row''s enumeration of amendment blockquotes: D149 gained a THIRD blockquote
  post-census (Decision 175''s) and ALL trails are preserved verbatim regardless of row counts.'
- 'D165 retroactive-authorization constraint: D150 residual keeps its two skill-path mentions (.claude/skills/planning/SKILL.md,
  .claude/skills/implement/SKILL.md); D166 residual keeps BOTH the clause-5/6 verbatim roster-key list AND clause 3''s literal
  docs/ROADMAP-PLATFORM.yaml defer-to-incumbent mention -- the committed dec-150/dec-166 raise markers and size_limits.py''s
  always-on E3 authorization re-validate against current bodies on every --pre run.'
- No new contract file, no structural or prose budget raise, no SLOC registration, and no ledger/mechanism file is created
  by this plan. decision-entry.yaml edits, if any, must be net-non-positive effective lines (dec-175 budget note).
- 'The lock has NO waiver route and reads no config: an exception path would be the Decision 163 anti-pattern. Post-lock
  correction dialect is dated append annotations or supersession; renumbering, duplicate-deletion, and in-place clause restructuring
  are retired (operator-ratified consequence).'
- Out-of-scope discoveries (an authority re-point needed in a file not scoped here) are filed as recommendations via the
  ops portal, never widened inline (AGENTS.md scope rule; Decision 55).
- 'Entries D39 and D75 are untouched (tests/esb_text_fix/test_decision_scope_notes.py pins them append-only). D37 is NOT
  in the tranche: it is already a conforming compacted stub (PR #956, migrate_then_rehome first exercise). The remaining
  superseded band routes to the existing valves, not this wave.'
- No rescue agents or workaround loops (Decision 55); STOP on rebase conflict and surface to the human.
- 'Two-PR bookkeeping (critique round 1): PR-A does not edit this plan file, does not set implementation_declared, carries
  no Resolves trailer, and the implement skill''s post-merge rec-closeout fallback is SKIPPED after PR-A (rec-3249 stays
  open by design until PR-B). The flip, the graduation registry row, and the trailer all belong to PR-B.'
- 'ANNOTATION WORDING (critique rounds 2-3): ANY annotation or amendment blockquote added by this wave -- the six PR-A annotations,
  the PR-B D151 annotation, and required residual additions such as D102''s D128/130/165 amendment record -- must not contain
  the literal phrases "supersedes Decision N", "amends Decision N", or "partially supersedes Decision N" (validate_supersession_annotations''
  _EDGE_RE would mint unintended edges; use neutral phrasing: "narrowed by", "recorded against", "realized by", "upgraded
  by"). The D151 annotation names the ratifying Decision NUMBER without the amends verb (the envelope, not the annotation,
  carries the edge; _is_annotated needs only the bare literal). D152 correction (round 3 -- the prior wording was factually
