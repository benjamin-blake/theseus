pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- git fetch origin main run; every tranche entry body re-read from the current tree per the staleness protocol
execution_steps:
- 'PR-A commit 1..n: for each disposition-table row (skip D37), re-read the current entry body, apply the rewrite per its
  row and the wave constitution, apply any same-commit destination re-point the row names, regenerate docs/decisions-index.json,
  and run the touched checks. Group entries into a few coherent commits (e.g. decisions-corpus mechanisms, platform/infra
  entries, process entries).'
- 'PR-A commit: the 6 dated annotations (D65, D119, D172, D117, D110, D35) in one commit.'
- 'PR-A commit: the validate_decisions_size.py citation-string pairing rides the SAME commit as the D167 rewrite.'
- Execute Verification Plan steps 3-8 on the PR-A head; loop until pass.
- 'PR-A flow: rebase on origin/main (STOP on conflict), push, create PR, subscribe, end turn; on CI-green wake, squash-merge
  and unsubscribe. Commit prefix feat(adr-restructure-wave).'
- 'PR-B (new branch off updated main): implement validate_live_entry_immutability + _baseline body reader + Entry + taxonomy
  row + mirror test + test updates; mint the ratifying Decision at the next free header (re-check numbering); append the
  D151 in-Intent annotation; regenerate the index.'
- Execute Verification Plan steps 1-3, 7, 9 on the PR-B head; loop until pass.
- 'PR-B flow: push, create PR with squash body carrying "Resolves: rec-3249", subscribe, end turn; on CI-green wake, squash-merge
  and unsubscribe. Post-merge backfill runs automatically (rec-autoclose.yml).'
- 'Report: what was implemented, verification results, and any out-of-scope re-point recs filed.'
work_areas: []
rollback: 'PR-A: git revert of the squash restores all bodies; regenerate the index and let the automated backfill write
  the reverted SCD2 versions. PR-B: revert removes the guard, its registrations, and the ratifying Decision entry (pre-merge
  only -- post-merge the entry is immutable corpus history; reversal then follows the entry''s own fenced reversal conditions).'
