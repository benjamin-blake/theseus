  ops portal, never widened inline (AGENTS.md scope rule; Decision 55).
- 'Entries D39 and D75 are untouched (tests/esb_text_fix/test_decision_scope_notes.py pins them append-only). D37 is already
  a compacted stub (PR #956) -- skip its disposition row. The superseded band routes to the existing valves, not this wave.'
