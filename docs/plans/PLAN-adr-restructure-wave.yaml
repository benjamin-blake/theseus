execution_steps:
- 'PR-A commit 1..n: for each of the 22 disposition-table rows, apply the mechanical staleness trigger, then the rewrite
  per its row and the wave constitution, apply any same-commit destination re-point the row names, regenerate docs/decisions-index.json,
  and run the touched checks. Group entries into a few coherent commits. Do NOT edit the plan file, do NOT set implementation_declared,
  and add NO Resolves trailer in the PR-A cycle.'
- 'PR-A commit: the 6 dated annotations (D65, D119, D172, D117, D110, D35) in one commit.'
- 'PR-A commit: the validate_decisions_size.py citation-string pairing rides the SAME commit as the D167 rewrite.'
- Execute Verification Plan steps 3-8 on the PR-A head (step 6 manually -- it is PR-A-only and hermetic false); loop until
  pass.
- 'PR-A flow: rebase on origin/main (STOP on conflict), push, create PR, subscribe, end turn; on CI-green wake, squash-merge
  (NO Resolves trailer) and unsubscribe. SKIP the implement skill''s bundled-rec closeout fallback -- rec-3249 stays open
  by design until PR-B. Commit prefix feat(adr-restructure-wave).'
- 'PR-B setup: git fetch origin main && git reset --hard origin/main on this session branch (its PR-A commits are now in
  main via the squash), then git push --force-with-lease -u origin HEAD to realign the remote branch.'
- 'PR-B commits: implement validate_live_entry_immutability + _baseline body reader + Entry + taxonomy row + mirror test
  + test updates; mint the ratifying Decision at the next free header (re-check numbering); append the D151 in-Intent annotation
  NAMING that Decision by number; regenerate the index; set implementation_declared: true in this plan file and walk the
  step-1 graduation registry row -- the flip and the registry row belong to THIS PR.'
- Execute Verification Plan steps 1-3, 7, 9 on the PR-B head; loop until pass. Rerun the full local gate (readiness, full
  validate, postflight evidence) for the PR-B cycle.
- 'PR-B flow: push, create PR with squash body carrying "Resolves: rec-3249", subscribe, end turn; on CI-green wake, squash-merge
  and unsubscribe. Post-merge backfill runs automatically (rec-autoclose.yml); then execute VP step 10.'
- 'Report: what was implemented, verification results, the D39/D75-pin follow-on rec id, and any out-of-scope re-point recs
  filed.'
implementation_declared: true
work_areas: []
rollback: 'PR-A revert BEFORE PR-B lands: git revert of the squash restores all bodies; regenerate the index; the automated
  backfill writes the reverted SCD2 versions. AFTER PR-B lands, a PR-A revert is itself a mass destructive edit the lock
  rejects by design -- revert PR-B first (removing the guard, its registrations, and the ratifying entry is a pre-merge-only
  option; post-merge the entry is immutable corpus history and reversal follows its own fenced reversal conditions), or
  land corrections through the post-lock dialect (dated annotations or supersession).'
