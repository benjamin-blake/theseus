schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: adr-restructure-wave
intent: 'Execute rec-3249: a one-off, operator-ratified restructuring wave over the live ADR corpus (22 entries rewritten
  to industry-ADR shape, 6 governance-bug entries annotated), then lock the corpus with a waiver-free append-only immutability
  guard and mint one ratifying Decision, so live decision bodies stop drifting silently and every future correction is a
  dated append or a supersession.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-adr-restructure-wave.yaml
phase: Ad-hoc governance-corpus work (soft-warn category ad_hoc_rec; no tier_item claimed). Successor programme step to
  audits/contract-first-governance-33c8667.yaml Q8 (steps 1-7 landed; this wave covers the live band those steps could not
  reach). Resolves rec-3249; rec-3246 declined in its favor.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'PR-A: rewrite the 21 remaining tranche entries per the disposition table (D37 already compacted by PR #956)
    plus 6 dated append annotations (D65, D119, D172, D117, D110, D35). PR-B: mint the ratifying Decision (next free header,
    nominally 176) and append the D151 clause-3(v) in-Intent annotation.'
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated after each corpus edit (freshness-gated).
- file: scripts/checks/decisions/validate_live_entry_immutability.py
  action: Create
  purpose: 'PR-B: the append-only lock. Union-keyed origin/main baseline; growth-only line-embedding invariant; Superseded
    bodies defer to the conformance stub/archive grammar; NO waiver route, no config input.'
- file: scripts/checks/decisions/_baseline.py
  action: Modify
  purpose: Add a memoized shared baseline BODY reader (per-number body text at origin/main, both corpus files) beside the
    existing numbers reader; same advisory-None-on-unreachable contract.
- file: scripts/checks/decisions/_manifest.py
  action: Modify
  purpose: Register the new check Entry (bare string literals, pre=True with pre_globs on the two corpus files, full_after_lint).
- file: scripts/checks/decisions/validate_decisions_size.py
  action: Modify
  purpose: 'PR-A same-commit pairing only: _PER_ENTRY_CAP_HARD_FAIL_CITATION quotes D167 clause 3 verbatim; update the quoted
    string to match the rewritten clause. No logic change.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: function_to_category row for the new check (schema_drift).
- file: tests/checks/decisions/test_validate_live_entry_immutability.py
  action: Create
  purpose: 'Mirror test (Decision 131): red/green for destructive edit vs append/splice/stub/archive shapes; waiver-free
    assertion.'
- file: tests/checks/decisions/test__baseline.py
  action: Modify
  purpose: Cover the new body reader (hit/miss/memoization/unreachable).
- file: tests/checks/decisions/test__manifest.py
  action: Modify
  purpose: Extend the entry-roster expectation with the new Entry.
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: 'ONLY if a disposition row requires an authority re-point; any edit must be net-non-positive effective lines
    (file is at 508/500 under the dec-175 raise marker whose budget note demands future edits shrink it). Expected: untouched.'
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: 'D95 authority re-point: its clause-citation of "Decision 95 cl.4" as field-roster authority flips to the lexicon/contract
    owning the roster, same commit as the D95 rewrite.'
- file: docs/contracts/telemetry-lexicon.yaml
  action: Modify
  purpose: D95 destination-side governance note only if the re-point requires it; else untouched.
- file: .claude/skills/decision-scout/SKILL.md
  action: Modify
  purpose: 'D152 re-point: the premise text citing the retired whole-corpus read regime gains a one-line pointer to the
    bounded-retrieval authority. Must stay within the post-D160 ratcheted prose budget (marker-less; net growth unavailable).'
bundled_recommendations:
- rec-3249
infrastructure_dependencies: []
acceptance_criteria:
- 'Every tranche entry in the disposition table is rewritten per its row: residual keeps every required marker, the original
  header line and parenthetical, frozen clause/point labels, amendment trails, Warehouse ID line, and any fenced reversal-conditions
  stanza; live header count is unchanged by PR-A.'
- The 6 annotation entries (D65, D119, D172, D117, D110, D35) each carry a new dated, source-cited append-only annotation
  conforming to decision-entry.yaml amendment_forms; no other live entry body changes outside the tranche.
- D150 residual contains ".claude/skills/planning/SKILL.md" and ".claude/skills/implement/SKILL.md"; D166 residual contains
  the clause-5 verbatim roster-key list -- the committed dec-150/dec-166 raise-approved markers stay authorized and the
  marker-guard family passes.
- Intent sections of post-D151 entries are byte-identical before and after every rewrite (D151, D152).
- validate_live_entry_immutability is registered in both tiers, declares examined()/skipped(), reads no config or waiver
  input, FAILS a destructive edit to a baseline-present non-superseded live body, and PASSES suffix appends, inserted annotation
  lines, in-line splices preserving original text, conforming compaction stubs, and archive moves.
- A ratifying Decision (next free header at execution time) exists with a conformant metadata envelope declaring significance.value
  numbered_decision, amends [151], body under 6144 bytes, recording the growth-only invariant, the no-waiver posture, the
  post-lock correction dialect, and reversal conditions.
- scripts/checks/decisions/validate_decisions_size.py no longer contains the stale clause-3 quote "triggers a named WARN".
- docs/decisions-index.json is regenerated, fresh, and within the committed byte pin.
- bin/venv-python -m scripts.validate --pre exits 0 on both PR heads.
verification_plan:
- step: 1
  phase: pre-deploy
  action: '[PR-B] Prove the lock discriminates: destructive edit to a live baseline entry FAILS; suffix append, mid-body
    inserted annotation line, in-line splice preserving original text, conforming stub replacement, and archive move all
    PASS; no waiver/config input exists.'
  command: bin/venv-python -m pytest tests/checks/decisions/test_validate_live_entry_immutability.py -q
  expected: All cases pass, including one test asserting the module reads no waiver file or config escape.
  fix_if: 'A legitimate shape fails: the embedding is keying on exact line equality instead of ordered contiguous-substring
    growth. A destructive edit passes: the comparison is not anchored to the origin/main baseline body.'
  hermetic: true
  graduation: graduate
  graduation_check_id: live-entry-guard-discriminates
- step: 2
  phase: pre-deploy
  action: '[PR-B] Registration surfaces: manifest Entry roster, baseline body reader, accounting declaration, taxonomy row.'
  command: bin/venv-python -m pytest tests/checks/decisions/ -q && grep -q validate_live_entry_immutability config/ci_rca_taxonomy.yaml
  expected: Decisions-domain suite green with the new Entry expected; taxonomy row present.
  fix_if: 'Roster test red: Entry literal missing or computed (must be bare ast.Constant strings). Accounting failure: examined()/skipped()
    not declared on every exit path.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The decisions-domain pytest suite is already a standing CI surface; graduating a duplicate registry
    row would run identical coverage twice per validate invocation.
- step: 3
  phase: pre-deploy
  action: '[PR-A and PR-B] Authoritative gate on each PR head: full fast tier including the five marker-authorization guards,
    decision-entry conformance, decisions size, currency, index freshness, prose budgets.'
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0. In particular check_present_markers re-authorizes all 13 dec-166 and 2 dec-150 raise markers against
    the REWRITTEN bodies.
  fix_if: 'A marker-guard failure names a de-authorized key: the D150 or D166 residual dropped a load-bearing path mention
    -- restore the verbatim mention per the disposition table, never delete the marker.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The command is the presubmit gate itself; a graduated registry row invoking scripts.validate
    --pre would recurse the gate (hermetic-authoring rule names this exact exclusion).
- step: 4
  phase: pre-deploy
  action: '[PR-A] Marker-authorization smoke: the four load-bearing substrings the retroactive scan needs survive in the
    corpus.'
  command: grep -q '.claude/skills/planning/SKILL.md' docs/DECISIONS.md && grep -q '.claude/skills/implement/SKILL.md' docs/DECISIONS.md
    && grep -q 'terraform/iceberg_tables.tf' docs/DECISIONS.md && grep -q 'config/agent/verification_registry/registry.yaml'
    docs/DECISIONS.md
  expected: All four greps hit (necessary-not-sufficient; step 3 is authoritative).
  fix_if: 'A grep misses: the residual rewrite deleted an authorization mention -- restore it verbatim in the owning residual
    (D150 clauses 1-2, D166 clause 5).'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Necessary-not-sufficient smoke over corpus-wide grep; the authoritative standing guard is the
    marker family already registered in both tiers (step 3).
- step: 5
  phase: pre-deploy
  action: '[PR-A] Citation-string pairing landed.'
  command: '! grep -q ''triggers a named WARN'' scripts/checks/decisions/validate_decisions_size.py'
  expected: Stale D167 clause-3 quote absent (red today, green after the paired update).
  fix_if: 'Grep hits: the clause-3 rewrite landed without the same-commit message-string update.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: One-time pairing assertion for this wave; standing drift protection for decision-quoting strings
    is rec-3264 flow-control territory, not a per-string registry row.
- step: 6
  phase: pre-deploy
  action: '[PR-A head only] Corpus integrity relative to origin/main: live header count unchanged (PR-A adds and removes
    no header), all tranche numbers still present, and Intent sections of the post-D151 entries (D151, D152) byte-identical
    to origin/main.'
  command: 'bin/venv-python -c "import subprocess, re; from pathlib import Path; live = Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    base = subprocess.run([''git'',''show'',''origin/main:docs/DECISIONS.md''], capture_output=True, text=True, encoding=''utf-8'').stdout;
    hn = lambda t: re.findall(r''^## Decision (\d+):'', t, re.M); assert len(hn(live)) == len(hn(base)), (len(hn(live)),
    len(hn(base))); tr = {27,66,74,77,93,95,102,124,127,128,131,132,135,142,149,150,151,152,160,162,166,167}; assert tr
    <= {int(n) for n in hn(live)}; sec = lambda t, n: re.search(rf''^## Decision {n}:.*?(?=^## Decision |\Z)'', t, re.M
    | re.S).group(0); intent = lambda b: (re.search(r''\*\*Intent:\*\*.*?(?=\n\*\*[A-Z]|\n---)'', b, re.S).group(0) if re.search(r''\*\*Intent:\*\*'',
    b) else ''''); [None for n in (151, 152) if intent(sec(live, n)) == intent(sec(base, n)) or (_ for _ in ()).throw(AssertionError(n))];
    print(''OK'')"'
  expected: OK printed, exit 0.
  fix_if: 'Header-count assert fails: a header was added or removed on the PR-A head -- PR-A must be header-neutral (never_remove_headers;
    the mint belongs to PR-B). Intent assert fails: a post-D151 Intent section was reflowed -- restore it byte-identical.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Wave-scoped one-time integrity sweep relative to origin/main; the standing invariant becomes
    the PR-B guard itself, which subsumes this for every future diff.
- step: 7
  phase: pre-deploy
  action: '[PR-A] Index pins and freshness after regeneration.'
  command: bin/venv-python -m pytest tests/test_decisions_index.py -q
  expected: Suite green including the committed-size pin.
  fix_if: 'Size pin exceeded: emission grew -- archival is the named relief lever, never a pin raise.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Standing suite already run by CI pytest on every PR; a registry row would duplicate it verbatim.
- step: 8
  phase: pre-deploy
  action: '[PR-A] Existing append-only pin for D39/D75 and the corpus check family remain green (wave excluded them).'
  command: bin/venv-python -m pytest tests/esb_text_fix/test_decision_scope_notes.py -q
  expected: 'Green: D39/D75 bodies unchanged vs origin/main.'
  fix_if: 'Red: the wave touched an excluded entry -- revert that hunk entirely.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The cited test is itself the standing guard for these two entries; nothing new to graduate.
- step: 9
  phase: pre-deploy
  action: '[PR-B] Ratifying Decision landed and conformant.'
  command: grep -q 'append-only live-body immutability' docs/DECISIONS.md && bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py
    -q
  expected: Title phrase present; conformance suite green (envelope, markers, block separator, per-entry cap on the new
    entry).
  fix_if: 'Conformance red on the new number: envelope malformed or body over 6144 bytes -- fix the entry, never the check.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Landing assertion for an immutable entry; once merged the entry cannot regress, so a standing
    registry row would assert a tautology.
test_obligations:
- source: scripts/checks/decisions/validate_live_entry_immutability.py
  behavior: Destructive edits to baseline-present non-superseded live bodies fail; the five legitimate shapes pass; no waiver
    input exists.
  verification_step: 1
  test_selector: tests/checks/decisions/test_validate_live_entry_immutability.py
  red_green_expectation: red before (check absent, destructive-edit fixture passes CI), green after
- source: scripts/checks/decisions/_baseline.py
  behavior: Baseline body reader returns per-number origin/main bodies for both corpus files, memoized, None on unreachable
    origin.
  verification_step: 2
  test_selector: tests/checks/decisions/test__baseline.py
  red_green_expectation: red before (reader absent), green after
- source: scripts/checks/decisions/_manifest.py
  behavior: New Entry registered with bare string literals, correct tiers and pre_globs.
  verification_step: 2
  test_selector: tests/checks/decisions/test__manifest.py
  red_green_expectation: red before (roster expectation lacks the entry), green after
- source: scripts/checks/decisions/validate_decisions_size.py
  behavior: Failure-message citation string matches the rewritten D167 clause 3.
  verification_step: 5
  command: '! grep -q ''triggers a named WARN'' scripts/checks/decisions/validate_decisions_size.py'
  red_green_expectation: red before (stale quote present), green after the paired same-commit update
- source: config/ci_rca_taxonomy.yaml
  behavior: New check has a function_to_category row so CI-RCA classification never falls through.
  verification_step: 2
  command: grep -q validate_live_entry_immutability config/ci_rca_taxonomy.yaml
  red_green_expectation: red before (row absent), green after
