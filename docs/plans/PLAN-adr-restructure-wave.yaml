  verification_step: 2
  command: grep -q validate_live_entry_immutability config/ci_rca_taxonomy.yaml
  red_green_expectation: red before (row absent), green after
- source: docs/decisions-index.json
  behavior: Committed triage index stays fresh, correctly derived, and within the 112,000-byte pin after every corpus edit.
