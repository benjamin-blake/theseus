schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: adr-restructure-wave
intent: 'Execute rec-3249: a one-off, operator-ratified restructuring wave over the live ADR corpus (22 entries rewritten
  to industry-ADR shape, 6 governance-bug entries annotated), then lock the corpus with a waiver-free append-only immutability
  guard and mint one ratifying Decision, so live decision bodies stop drifting silently and every future correction is a
  dated append or a supersession.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-adr-restructure-wave.yaml
phase: Ad-hoc governance-corpus work (soft-warn category ad_hoc_rec; no tier_item claimed). Successor programme step to
  audits/contract-first-governance-33c8667.yaml Q8 (steps 1-7 landed; this wave covers the live band those steps could not
  reach). Resolves rec-3249; rec-3246 declined in its favor.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'PR-A: rewrite the 22 tranche entries per the disposition table (D37 is not in the tranche -- already compacted
    by PR #956) plus 6 dated append annotations (D65, D119, D172, D117, D110, D35). PR-B: mint the ratifying Decision (next
    free header, nominally 177) and append the D151 in-Intent annotation naming that Decision by number.'
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated after each corpus edit (freshness-gated).
- file: scripts/checks/decisions/validate_live_entry_immutability.py
  action: Create
  purpose: 'PR-B: the append-only lock. Union-keyed origin/main baseline; growth-only line-embedding invariant; Superseded
    bodies defer to the conformance stub/archive grammar; NO waiver route, no config input.'
- file: scripts/checks/decisions/_baseline.py
  action: Modify
  purpose: Add a memoized shared baseline BODY reader (per-number body text at origin/main, both corpus files) beside the
    existing numbers reader; same advisory-None-on-unreachable contract.
- file: scripts/checks/decisions/_manifest.py
  action: Modify
  purpose: Register the new check Entry (bare string literals, pre=True with pre_globs on the two corpus files, full_after_lint).
- file: scripts/checks/decisions/validate_decisions_size.py
  action: Modify
  purpose: 'PR-A same-commit pairing only: _PER_ENTRY_CAP_HARD_FAIL_CITATION quotes D167 clause 3 verbatim; update the quoted
    string to match the rewritten clause. No logic change.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: function_to_category row for the new check (schema_drift).
- file: tests/checks/decisions/test_validate_live_entry_immutability.py
  action: Create
  purpose: 'Mirror test (Decision 131): red/green for destructive edit vs append/splice/stub/archive shapes; waiver-free
    assertion.'
- file: tests/checks/decisions/test__baseline.py
  action: Modify
  purpose: Cover the new body reader (hit/miss/memoization/unreachable).
- file: tests/checks/decisions/test__manifest.py
  action: Modify
  purpose: Extend the entry-roster expectation with the new Entry. The file is currently fully parametrized with no explicit
    roster expectation -- add a membership-floor assertion (per tests/CLAUDE.md count-coupling rules) so the red/green obligation
    is honest.
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: 'ONLY if a disposition row requires an authority re-point; any edit must be net-non-positive effective lines
    (file is at 508/500 under the dec-175 raise marker whose budget note demands future edits shrink it) AND, because this
    is a Class D contract, any data-level edit also requires a same-commit amendment_log entry (check_amendment_log_for_class_d)
    whose lines count against the same constraint. Expected: untouched.'
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: 'D95 authority re-point: all NINE "Decision 95" citation lines (3, 7, 30, 60, 94, 115, 118, 291, 296 at plan
    time) flip to the surface owning the roster, same commit as the D95 rewrite. This is a Class A RITUAL contract: contracts_enforcement.check_amendment_for_diff
    fails any change to contract.description or a field''s description/semantics without a NEW per-field amendment_log entry
    -- four of the nine lines are amendment-gated (line 30 contract.description; 94/115/118 field-level description/semantics
    values; 3/7 are comments and 60/291/296 governance notes outside the gate), so the re-point commit MUST carry the corresponding
    amendment_log entries (headroom exists: 309/500 effective lines).'
- file: docs/contracts/telemetry-lexicon.yaml
  action: Modify
  purpose: D95 destination-side governance note only if the re-point requires it; if the note lands as YAML data (not a
    comment), this Class D contract requires a same-commit amendment_log entry or validate_contract_drift fails. Else untouched.
- file: .claude/skills/decision-scout/SKILL.md
  action: Modify
  purpose: 'D152 re-point: the premise text citing the retired whole-corpus read regime gains a one-line pointer to the
    bounded-retrieval authority. The file sits at EXACTLY its marker-less prose budget (11,318/11,318 bytes) -- the added
    line must be byte-funded by trimming elsewhere in the same file. NO-TRIM LIST (critique round 2): the currency-check
    I5 invariant pins the literal phrases ''superseded_compacted'' and ''NEVER filtered and NEVER severity-reduced'' in
    this exact file and requires the ABSENCE of ''whose status is active''; the graduated rows decision-scout-spirit-section-present
    and decision-scout-bounded-read-protocol pin their anchor text. Trim only outside those anchors.'
bundled_recommendations:
- rec-3249
infrastructure_dependencies: []
acceptance_criteria:
- 'Every tranche entry in the disposition table is rewritten per its row: residual keeps every required marker, the original
  header line and parenthetical, frozen clause/point labels, amendment trails, Warehouse ID line, and any fenced reversal-conditions
  stanza; live header count is unchanged by PR-A.'
- The 6 annotation entries (D65, D119, D172, D117, D110, D35) each carry a new dated, source-cited append-only annotation
  conforming to decision-entry.yaml amendment_forms; no other live entry body changes outside the tranche.
- D150 residual contains ".claude/skills/planning/SKILL.md" and ".claude/skills/implement/SKILL.md"; D166 residual contains
  the clause-5 verbatim roster-key list -- the committed dec-150/dec-166 raise-approved markers stay authorized and the
  marker-guard family passes.
- Intent sections of post-D151 entries are byte-identical before and after every rewrite (D151, D152).
- 'validate_live_entry_immutability is registered in both tiers, declares examined()/skipped(), reads no config or waiver
  input, and implements the final five-branch classification with stanza-interior carve-out and stanza-presence lock: FAILS
  destructive edits, duplicate-line deletions, line-joins, mid-line splices, pointer-bearing non-stub bodies under a new
  Status flip, archive-moves-with-rewrite, stanza deletions, and vanished numbers; PASSES appended or inserted annotation
  lines, trailing-whitespace-only differences, stanza-interior edits, strict-shape newly-compacted stubs, conforming archive
  moves, and baseline-superseded bodies (deferred).'
- A ratifying Decision (next free header at execution time) exists whose title contains "append-only live-body immutability",
  with a conformant metadata envelope declaring significance.value numbered_decision, amends [151], body under 6144 bytes,
  recording the exact-line append-only invariant, the no-waiver posture, the two retired micro-shapes, the post-lock correction
  dialect, and fenced reversal conditions naming the T1.5 retirement path; the D151 in-Intent annotation names that Decision
  by number, closing the amends supersession edge (validate_supersession_annotations green).
- scripts/checks/decisions/validate_decisions_size.py no longer contains the stale clause-3 quote "triggers a named WARN".
- docs/decisions-index.json is regenerated, fresh, and within the committed byte pin.
- bin/venv-python -m scripts.validate --pre exits 0 on both PR heads.
- rec-3249 reaches status closed after PR-B merges (VP step 10).
verification_plan:
- step: 1
  phase: pre-deploy
  action: '[PR-B] Prove the lock discriminates under the FINAL five-branch invariant. FAIL cases: destructive line edit
    on a live non-superseded body; deletion of one of two duplicate lines; a line-join; a mid-line splice; a NEWLY-superseded
    body that carries both supersession markers but retains ANY other prose line (the pointer-bearing full-body Status-flip
    bypass -- is_compacted_stub alone would pass it); an archived body missing a baseline line beyond the header/Status
    exemptions (archive-move-with-rewrite); deletion of a baseline fenced reversal-conditions stanza; a number vanishing
    from both files. PASS cases: suffix-appended and mid-body-inserted annotation lines (including in-Intent); a trailing-whitespace-only
    line difference; an EDIT INSIDE a fenced reversal-conditions stanza (re-arm/date bump); a newly-superseded body in strict
    stub shape; a conforming archive move (header retitle + Status rewrite only); a baseline-absent new entry; a baseline-superseded
    body left untouched. Plus one test asserting the module reads no waiver file or config input.'
  command: bin/venv-python -m pytest tests/checks/decisions/test_validate_live_entry_immutability.py -q
  expected: All cases pass, including one test asserting the module reads no waiver file or config escape.
  fix_if: 'A PASS case fails or a FAIL case passes: the matcher is not an injective, order-preserving, rstripped-exact-equality
    embedding over stanza-excluded lines, or branch (ii) is delegating to is_compacted_stub instead of the strict stub-shape
    bound, or branch (iii) is deferring wholesale instead of embedding with the two-line exemption. Fix the matcher or classifier,
    never weaken a fixture.'
  hermetic: true
  graduation: graduate
  graduation_check_id: live-entry-guard-discriminates
- step: 2
  phase: pre-deploy
  action: '[PR-B] Registration surfaces: manifest Entry roster, baseline body reader, accounting declaration, taxonomy row.'
  command: bin/venv-python -m pytest tests/checks/decisions/ -q && grep -q validate_live_entry_immutability config/ci_rca_taxonomy.yaml
  expected: Decisions-domain suite green with the new Entry expected; taxonomy row present.
  fix_if: 'Roster test red: Entry literal missing or computed (must be bare ast.Constant strings). Accounting failure: examined()/skipped()
    not declared on every exit path.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The decisions-domain pytest suite is already a standing CI surface; graduating a duplicate registry
    row would run identical coverage twice per validate invocation.
- step: 3
  phase: pre-deploy
  action: '[PR-A and PR-B] Authoritative gate on each PR head: full fast tier including the five marker-authorization guards,
    decision-entry conformance, decisions size, currency, index freshness, prose budgets.'
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0. In particular check_present_markers re-authorizes all 11 dec-166 and 2 dec-150 raise markers against
    the REWRITTEN bodies.
  fix_if: 'A marker-guard failure names a de-authorized key: restore the verbatim mention per the disposition table (D150
    clauses 1-2 skill paths; D166 clause 5/6 roster keys AND clause 3''s docs/ROADMAP-PLATFORM.yaml), never delete the marker.
    A validate_contract_drift failure on telemetry_agents.yaml: the Class A per-field amendment_log entries are missing
    from the re-point commit -- add them, never revert the re-point alone.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The command is the presubmit gate itself; a graduated registry row invoking scripts.validate
    --pre would recurse the gate (hermetic-authoring rule names this exact exclusion).
- step: 4
  phase: pre-deploy
  action: '[PR-A] Marker-authorization smoke: the four load-bearing substrings the retroactive scan needs survive in the
    corpus.'
  command: grep -q '.claude/skills/planning/SKILL.md' docs/DECISIONS.md && grep -q '.claude/skills/implement/SKILL.md' docs/DECISIONS.md
    && grep -q 'terraform/iceberg_tables.tf' docs/DECISIONS.md && grep -q 'config/agent/verification_registry/registry.yaml'
    docs/DECISIONS.md
  expected: All four greps hit (necessary-not-sufficient; step 3 is authoritative).
  fix_if: 'A grep misses: the residual rewrite deleted an authorization mention -- restore it verbatim in the owning residual
    (D150 clauses 1-2, D166 clause 5).'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Necessary-not-sufficient smoke over corpus-wide grep; the authoritative standing guard is the
    marker family already registered in both tiers (step 3).
- step: 5
  phase: pre-deploy
  action: '[PR-A] Citation-string pairing landed.'
  command: '! grep -q ''triggers a named WARN'' scripts/checks/decisions/validate_decisions_size.py'
  expected: Stale D167 clause-3 quote absent (red today, green after the paired update).
  fix_if: 'Grep hits: the clause-3 rewrite landed without the same-commit message-string update.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: One-time pairing assertion for this wave; standing drift protection for decision-quoting strings
    is rec-3264 flow-control territory, not a per-string registry row.
- step: 6
  phase: pre-deploy
  action: '[PR-A head ONLY -- run manually during the PR-A gate; hermetic false because validate_vp_replay would replay
    it against the PR-B tree, where the mint legitimately adds a header and the D151 annotation legitimately grows the Intent]
    Corpus integrity relative to origin/main: live header count unchanged, all tranche numbers present, Intent sections
    of D151/D152 byte-identical to origin/main. The Intent extractor is LINE-ANCHORED (^**Intent:** with re.M) because D152
    carries a mid-line prose mention of the marker two lines before its real section; a first-match unanchored regex pins
    the wrong span (delta-verify finding). D160/D162 carry no Intent marker at all, so the constitution''s byte-preserve
    clause is trivially satisfied for them and they are deliberately not in the tuple.'
  command: 'bin/venv-python -c "import subprocess, re; from pathlib import Path; live = Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    base = subprocess.run([''git'',''show'',''origin/main:docs/DECISIONS.md''], capture_output=True, text=True, encoding=''utf-8'').stdout;
    hn = lambda t: re.findall(r''^## Decision (\d+):'', t, re.M); assert len(hn(live)) == len(hn(base)), (len(hn(live)),
    len(hn(base))); tr = {27,66,74,77,93,95,102,124,127,128,131,132,135,142,149,150,151,152,160,162,166,167}; assert tr
    <= {int(n) for n in hn(live)}; sec = lambda t, n: re.search(rf''^## Decision {n}:.*?(?=^## Decision |\Z)'', t, re.M
    | re.S).group(0); intent = lambda b: (re.search(r''^\*\*Intent:\*\*.*?(?=\n\*\*[A-Z]|\n---)'', b, re.M | re.S).group(0)
    if re.search(r''^\*\*Intent:\*\*'', b, re.M) else ''''); [None for n in (151, 152) if intent(sec(live, n)) == intent(sec(base,
    n)) or (_ for _ in ()).throw(AssertionError(n))]; assert intent(sec(live, 152)) != '''', ''D152 Intent section must
    resolve (line-anchored)''; print(''OK'')"'
  expected: OK printed, exit 0.
  fix_if: 'Header-count assert fails: a header was added or removed on the PR-A head -- PR-A must be header-neutral (never_remove_headers;
    the mint belongs to PR-B). Intent assert fails: the D151 or D152 Intent section was reflowed -- restore it byte-identical.
    The D152-resolves assert fails: the extractor lost its line anchor.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Wave-scoped one-time integrity sweep relative to origin/main; the standing invariant becomes
    the PR-B guard itself, which subsumes this for every future diff.
- step: 7
  phase: pre-deploy
  action: '[PR-A] Index pins and freshness after regeneration.'
  command: bin/venv-python -m pytest tests/test_decisions_index.py -q
  expected: Suite green including the committed-size pin.
  fix_if: 'Size pin exceeded: emission grew -- archival is the named relief lever, never a pin raise.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Standing suite already run by CI pytest on every PR; a registry row would duplicate it verbatim.
- step: 8
  phase: pre-deploy
  action: '[PR-A] Existing append-only pin for D39/D75 and the corpus check family remain green (wave excluded them).'
  command: bin/venv-python -m pytest tests/esb_text_fix/test_decision_scope_notes.py -q
  expected: 'Green: D39/D75 bodies unchanged vs origin/main.'
  fix_if: 'Red: the wave touched an excluded entry -- revert that hunk entirely.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The cited test is itself the standing guard for these two entries; nothing new to graduate.
- step: 9
  phase: pre-deploy
  action: '[PR-B] Ratifying Decision landed and conformant.'
  command: grep -q 'append-only live-body immutability' docs/DECISIONS.md && bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py
    -q
  expected: Title phrase present; conformance suite green (envelope, markers, block separator, per-entry cap on the new
    entry).
  fix_if: 'Conformance red on the new number: envelope malformed or body over 6144 bytes -- fix the entry, never the check.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Landing assertion for an immutable entry; once merged the entry cannot regress, so a standing
    registry row would assert a tautology.
- step: 10
  phase: post-deploy
  action: '[after PR-B squash-merge] Closure obligation (rec-resolving plan): verify rec-3249 actually closed via the Resolves
    trailer and rec-autoclose.'
  command: 'bin/venv-python -m scripts.sync.ops sync && grep ''"id": "rec-3249"'' logs/.recommendations-log.jsonl | grep
    -q ''"status": "closed"'''
  expected: rec-3249 status is closed in the refreshed read cache.
  fix_if: 'Still open after ~5 minutes: close manually per Decision 70 -- bin/venv-python -m scripts.ops_data_portal --update-rec
    rec-3249 --status closed --resolution "Wave + lock landed (PR-A, PR-B); guard registered and green."'
- step: 11
  phase: pre-deploy
  action: '[both PRs, pre-handoff] Full-tier validation before commit/handoff, satisfying handoff_policy.full_validation_required_before_commit
    (the full tier adds the both-file supersession-annotation and currency sweeps the fast tier scopes down).'
  command: bin/venv-python -m scripts.validate
  expected: Full tier exits 0 on the PR head.
  fix_if: 'A full-tier-only check fails (e.g. supersession annotations on the ratifying entry''s amends edge): fix per its
    message -- for the amends edge, the D151 in-Intent annotation must name the minted Decision number. Never demote or
    skip the failing check.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The command is the full presubmit gate itself; a graduated registry row invoking scripts.validate
    would recurse the gate (same exclusion class as step 3).
