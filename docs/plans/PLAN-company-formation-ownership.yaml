pre_implementation_checklist:
  - Confirm `git branch --show-current` is the harness session branch, never main.
  - >-
    Re-read docs/contracts/decision-entry.yaml's required_markers, significance.routing and
    amendment_forms before authoring -- the contract is the source of truth, not this plan.
  - >-
    Re-read an existing post-Decision-133 entry (Decision 184 is the shortest good model at
    3864 B) for the exact envelope and fenced-stanza shape.
  - Confirm `aws sts get-caller-identity --profile agent_platform` succeeds before the rec-3905 update.

execution_steps:
  - "Author `## Decision 194:` in docs/DECISIONS.md, inserted above `## Decision 193:` (the file is descending by number). Include the typed yaml envelope with amends: [106], the Status/Date/Decision markers, Problem/Intent/Rationale, the fenced reversal-conditions stanza, a Warehouse ID line, and Related."
  - "Write clause 2's licence-ordering sentence to state the two-halves-in-one-commit rule explicitly, so a later agent cannot edit LICENSE alone and redden validate_licence_consistency."
  - "Write clause 3 to cite Decision 106's reversal condition (a) by name as the trigger it fires, and to record the consequence rather than execute any account move."
  - "Write clause 4 with the two candidate handles only. No leaning, no dbt Labs analogy, no rec list."
  - "Measure the entry (VP step 3). If over 6144 B, trim the Related pointer block first, then relocate any remaining inventory into this plan's context -- never raise the cap."
  - "Append the `> **Amended by Decision 194 (2026-09-17):**` blockquote to `## Decision 106`, directly beneath its Warehouse ID line and above its `**Decision:**` marker, matching the placement used on Decisions 149 and 101."
  - "Append the inline `[Amendment 2026-09-17, Decision 194 -- ...]` annotation to NS.2's detail in docs/ROADMAP-PLATFORM.yaml, naming On The Loop Labs Limited and distinguishing it from the legacy company-aws-profile account T5.2 tears down. Do not touch the CD.6 row."
  - "Run VP steps 1-11 in order. Steps 4, 8 and 9 are negative proofs -- a non-zero result is a scope breach, not a test failure to work around."
  - "Update rec-3905 through the portal with the org-handle leaning (org otl-labs, web and email onthelooplabs.com, on the github.com/dbt-labs + getdbt.com split) and its reasoning, so it is not re-derived later: `bin/venv-python -m scripts.ops_data_portal --update-rec rec-3905 --context '<existing context plus the leaning paragraph>'`."
  - "Commit and push; open the PR. Name rec-3921, rec-3922, rec-3923 and rec-3924 in the PR body as the follow-on sequence. Do NOT add a Resolves: trailer -- this plan bundles no recommendation."

rollback: >-
  Single-commit revert. Every change is additive and confined to three documentation artefacts
  plus this plan file; nothing is deployed, no infrastructure or runtime behaviour is affected, and
  no warehouse row is written by the corpus edits. The rec-3905 portal update is a separate SCD2
  append that survives a git revert by design -- if the plan is abandoned, re-run `--update-rec`
  to restore the prior context rather than reverting anything in git.

handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
