schema_version: 4
slug: company-formation-ownership
intent: >-
  Record On The Loop Labs Limited as the owner of this platform in the decision corpus: the
  company-as-owner fact, the founder-to-company IP assignment and the licence-parameter ordering
  it implies, the AWS account-ownership consequence that re-opens Decision 106's premise, and the
  undecided canonical GitHub organisation handle as an explicit open condition. Keystone of a
  four-plan sequence; records commitments only and executes none of the gated work.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-company-formation-ownership.yaml
phase: T1

scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Author the new entry `## Decision 195:` (hardcoded per the operator's collision call -- 194 is
      claimed by PLAN-staged-apache-relicense-decision, merged fe93cf93; live max 193, archive max
      71, so "next free" would otherwise evaluate to the colliding 194) and
      append a dated `> **Amended by Decision 195 (2026-09-17):**` blockquote to `## Decision 106`.
      Both are additions; no existing body line is edited (Decision 177).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Append an inline `[Amendment 2026-09-17, Decision 195 -- ...]` annotation to the NS.2
      principle's `detail`, matching the form NS.3 and NS.5 already carry.
  - file: docs/plans/PLAN-company-formation-ownership.yaml
    action: Create
    purpose: This plan artefact.

bundled_recommendations: []
followon_recs:
  - rec-3921
  - rec-3922
  - rec-3923
  - rec-3924
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    `## Decision 195:` exists in docs/DECISIONS.md carrying the typed yaml envelope (number,
    status, decided_date, amends: [106], significance.value: numbered_decision with a non-empty
    justification), the three required markers (Status, Date, Decision), a fenced
    ```yaml reversal-conditions``` stanza (Decision 133) rather than a prose-only Reversal-conditions
    line, and the trailing `---` block separator. Proven by VP steps 5 and 6.
  - >-
    The Decision 195 block measured heading-to-next-heading is strictly under 6144 bytes
    (Decision 167 clause 3; hard-fail in the --pre tier). Proven by VP step 3.
  - >-
    Decision 195 carries four clauses: (1) On The Loop Labs Limited owns the platform; (2)
    founder-to-company IP assignment, with the LICENSE `Licensor:` parameter changing ONLY when
    the assignment legally executes and the LICENSE line and validate_licence_consistency.py's
    regex moving in the SAME commit; (3) the AWS account-ownership consequence, naming Decision
    106 reversal condition (a) as the trigger it fires; (4) the canonical GitHub organisation
    handle as a separately-decided gated identifier, naming the two candidate handles ONLY.
    Clause 4 carries NO gated-work inventory: "durable sequencing work against a gate" is the
    work_item routing row, which decision-entry.yaml marks "Never a numbered Decision", and
    rec-3905 already owns that content. Proven by review, not by a step (prose judgement).
  - >-
    Clause 4 names the two candidate handles ONLY. No preference, leaning or precedent analogy
    appears in the decision entry -- that detail lands on rec-3905, which stays revisable.
    Proven by VP step 11.
  - >-
    Decision 106 gains the Amended-by blockquote and every pre-existing line of docs/DECISIONS.md
    is byte-identical -- the merge-base diff reports zero deleted lines (Decision 177). Two
    conjuncts, two different provers. The blockquote's PRESENCE is proven by VP step 15, via
    validate_supersession_annotations' forward-pointer sub-check: it is pre=True (the
    scripts/checks/decisions/_manifest.py Entry is the authority; the module's own docstring
    saying otherwise is deliberately stale), and it unions envelope-borne edges, so Decision 195's
    `amends: [106]` requires "Decision 195" to appear on Decision 106's block. The ZERO-DELETIONS
    half is proven by VP step 4 -- and since Decision 178 retired validate_live_entry_immutability,
    step 4 is the ONLY surviving control on the append-only property specifically. Step 4 counts
    deletions and is structurally blind to additions: a green step 4 says nothing about whether
    the blockquote was written.
  - >-
    NS.2's detail names On The Loop Labs Limited explicitly and states it is distinct from the
    legacy `company-aws-profile` account that tier item T5.2 tears down. Proven by VP step 10,
    this plan's one graduate-disposition step.
  - >-
    LICENSE, LICENSING.md, COMMERCIAL-LICENSE.md, CONTRIBUTING.md and
    scripts/checks/hygiene/validate_licence_consistency.py are unmodified, and no file under
    terraform/ is touched. Proven by VP steps 12 and 13.
  - >-
    rec-3905 carries the org-handle leaning and its reasoning, applied via `update_rec` through
    the portal (never a JSONL edit). Proven by VP step 14, a warehouse read-back keyed on a token
    absent from the cache today (`getdbt`, 0 occurrences cache-wide) rather than on
    `otl-labs`, which rec-3905's existing context already carries. This is the plan's only write
    that a git revert does not undo, so its read-back must discriminate the post-write state.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Regenerate the committed decisions index after the DECISIONS.md edits.
    command: bin/venv-python -m scripts.decisions_index --write
    expected: >-
      Exit 0; stderr contains a line with `Decisions index written to` and, separately,
      `docs/decisions-index.json` -- the destination is printed as an absolute path, so only
      these two substrings are asserted, never the full literal path.
    fix_if: >-
      Non-zero exit means the new entry did not parse. Check the header form
      (`## Decision 195: <title> (Decided)`) and the typed yaml envelope fence.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A generator invocation, not an assertion -- there is no pass/fail predicate to graduate. Its
      output is proven by step 2, whose registered equivalent is validate_decisions_index_freshness.
  - step: 2
    phase: pre-deploy
    action: Prove the regenerated index matches the live corpus.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: "Exit 0; stderr reports `Decisions index is current.`"
    fix_if: Drift means step 1 was skipped or DECISIONS.md changed after it; re-run step 1.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_decisions_index_freshness, already registered in both tiers and already
      gating exactly this drift. Graduating a second guard over the same predicate adds no coverage.
  - step: 3
    phase: pre-deploy
    action: Measure the Decision 195 block against the Decision 167 per-entry cap, failing if absent.
    command: grep -q '^## Decision 195:' docs/DECISIONS.md && awk '/^## Decision 195:/{f=1} f&&/^## Decision /&&!/^## Decision 195:/{exit} f' docs/DECISIONS.md | wc -c
    expected: >-
      Exit 0 and a byte count strictly between 1 and 6143. A count of 0 is impossible here -- the
      leading grep -q fails first if the entry is absent, so the step cannot pass vacuously.
    fix_if: >-
      Over cap -- trim the Related pointer block to load-bearing ids only, then move any remaining
      inventory into this plan's context. Never raise the cap (Decision 167's own reversal text).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_decisions_size, which already enforces the same 6144-byte
      heading-to-next-heading cap on every new entry in the --pre tier. This step exists to give the
      implementer a byte number to trim against, not to add an independent gate.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the DECISIONS.md change is purely additive (Decision 177 append-only). Counts deleted
      LINES via numstat rather than grepping diff prefixes -- a deleted markdown bullet renders as
      `-- item` and a deleted blank line as a bare `-`, neither of which a `^-[^-]` pattern matches,
      and docs/DECISIONS.md carries 282 bullet lines.
    command: git fetch origin main && git diff --numstat "$(git merge-base origin/main HEAD)" -- docs/DECISIONS.md | awk '{print $2+0}'
    expected: >-
      Empty output, or `0`. Any positive number is a deleted or rewritten line. Merge-base form, not
      two-dot: two-dot compares branch tips and reports phantom deletions when main advances.
    fix_if: >-
      A positive count is an in-place body edit. Revert it and re-express the change as a dated
      blockquote annotation appended to the entry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as metric_under_threshold, but its subject is this PR's own diff against a
      merge base -- the transient repo state the contract names as the waive case. As a standing
      registry guard it would assert that no commit ever deletes a DECISIONS.md line, which is
      false: Decision 149 compaction and Decision 146 archival both legitimately remove lines.
  - step: 5
    phase: pre-deploy
    action: Run the decision-corpus entry-conformance gate.
    command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0; `[]`."
    fix_if: >-
      Failures name the missing marker, envelope field, significance token or block separator; add
      them per docs/contracts/decision-entry.yaml. The contract is the source, not this plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Directly invokes an already-registered check (validate_decision_entry_conformance, both
      tiers). Graduating a wrapper around a registered check duplicates an existing guard.
  - step: 6
    phase: pre-deploy
    action: Prove the fenced reversal-conditions stanza is well-formed and monitored.
    command: bin/venv-python -c "import sys; from scripts.checks.ops_governance.validate_reversal_stanzas import validate_reversal_stanzas as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: >-
      Exit 0, and stdout contains `monitored reversal-conditions stanza(s), all well-formed.` and
      the line `[]`. The monitored-stanza count rises by exactly 1 from whatever the baseline is
      at implement time. Do NOT pin the absolute: it reads 12 on this branch, but Decision 194
      (PLAN-staged-apache-relicense-decision) also adds a monitored stanza, so the baseline is 13
      if that plan implements first. A mismatched absolute is not a failure -- exit 0 plus the two
      literal spans above are the criterion; this field is frozen post-merge by
      implement-scope-boundary.yaml, so it must not hardcode a transient absolute count.
    fix_if: >-
      A malformed stanza means the fence line is not exactly '```yaml reversal-conditions' or the
      body is not a mapping with decision/review_by/on_trigger/conditions.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Directly invokes an already-registered check (validate_reversal_stanzas). The stanza count
      rising 12 to 13 is this plan's transient expectation, not a durable invariant to graduate.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the candidate-decision referential gate only. The roadmap schema and regrowth gates are
      steps 8 and 9; this step does not run them.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.validate_candidate_decision_ratification import validate_candidate_decision_ratification as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: >-
      Exit 0 and `[]`. The header-indexed count rises by exactly 1 from the implement-time
      baseline -- 173 on this branch, 174 if Decision 194 landed first. Same reasoning as step 6:
      do not pin the absolute.
    fix_if: >-
      A referential failure means a CD's ratified_as no longer resolves; confirm no CD row was
      edited -- CD.6 is deliberately left untouched under Decision 147's compaction norm.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Directly invokes an already-registered check (validate_candidate_decision_ratification, both
      tiers). No new predicate to graduate.
  - step: 8
    phase: pre-deploy
    action: >-
      Run the roadmap schema gate, which enforces the 10,000-line ceiling the NS.2 edit consumes
      headroom against.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0; `[]`."
    fix_if: >-
      A line-ceiling failure means the NS.2 annotation pushed docs/ROADMAP-PLATFORM.yaml past
      _ROADMAP_MAX_LINES = 10_000 (it stands at 9,901). Tighten the annotation; do not raise the
      ceiling, and do not trim unrelated content to make room -- escalate per Decision 147.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Directly invokes an already-registered check (validate_platform_roadmap, both tiers), which
      already owns the line ceiling and the Pydantic schema. No new predicate to graduate.
  - step: 9
    phase: pre-deploy
    action: >-
      Record the roadmap regrowth observable, proving CD.6 was not re-accumulated (Decision 147).
      Report-only by design -- read the printed line, do not rely on an exit code.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.check_roadmap_regrowth import check_roadmap_regrowth as f; failed=[]; f(failed); sys.exit(0)"
    expected: >-
      Exit 0, and a line containing `GROWTH lines=` and `threshold=500`, with the lines= value at
      most 10,000, and no CD.6 row in the re-accumulated terminal-content listing. The
      implementing diff adds lines to docs/ROADMAP-PLATFORM.yaml, so the printed
      lines=/baseline=/headroom=/escalate= values shift the moment it lands -- do not pin their
      instantaneous values; only these two line-count-invariant tokens are asserted verbatim.
    fix_if: >-
      If CD.6 appears in the terminal-content listing, the amendment was written onto the roadmap
      row instead of onto Decision 106. Move it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      check_roadmap_regrowth is report-only by absolute design -- it never appends to failed and
      never raises. There is no pass/fail predicate to express in a canonical slot, and wrapping a
      report-only observable in a graduated assertion would invert its declared contract.
  - step: 10
    phase: pre-deploy
    action: Prove NS.2 names the owning entity explicitly and distinguishes it from the legacy account.
    command: bin/venv-python -c "import sys,yaml; d=[p for p in yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))['north_star']['principles'] if p['id']=='NS.2'][0]['detail']; sys.exit(0 if 'On The Loop Labs Limited' in d and 'company-aws-profile' in d else 1)"
    expected: >-
      Exit 0. Scoped to NS.2's detail string via the roadmap's own schema, NEVER a file-wide grep:
      company-aws-profile already occurs 6 times elsewhere in this 9,901-line file (lines 3954,
      3960, 3968, 3973, 9136, 9548), so a file-scoped conjunct would assert nothing, and a
      file-scoped company-name grep would green permanently the moment rec-3921, rec-3922 or
      rec-3923 names the company anywhere in the roadmap -- a standing guard that could never
      detect regression of the invariant its own slug names. Genuinely RED before: NS.2's detail
      today reads "Personal AWS account, not shared work account. AUP, IP, and business-continuity
      reasons; cost is a tiebreaker.", so BOTH literals are absent and the step fails under the
      Decision 189 inverted-polarity replay. The command is a bare sys.exit with no print
      statement, so no output literal can ever be asserted here -- correctness rests entirely on
      the exit code.
    fix_if: >-
      A failure means the NS.2 annotation either omits the company's registered name or omits the
      distinction from the legacy company-aws-profile account -- both are required by AC6, because
      NS.2's existing contrast term ("not shared work account") inverts without them.
    hermetic: true
    graduation: graduate
    graduation_check_id: ns2-names-owning-entity
  - step: 11
    phase: pre-deploy
    action: >-
      Prove the org-handle leaning did not leak into the numbered entry (AC4, and the Decision
      150 / Decision 75 disposition).
    command: grep -q '^## Decision 195:' docs/DECISIONS.md && { awk '/^## Decision 195:/{f=1} f&&/^## Decision /&&!/^## Decision 195:/{exit} f' docs/DECISIONS.md | grep -ciE 'dbt|leaning|prefer|getdbt' || true; }
    expected: >-
      Exit 0 and a count of `0` -- no preference, reasoning or precedent analogy inside the
      Decision 195 span. Verified against a fabricated clean Decision 195 fixture: the leading
      grep -q anti-vacuity guard (matching step 3's) prevents an absent or mistyped heading from
      collapsing to a false pass, and the trailing || true, bound to the count grep alone by the
      braces, maps a genuine zero-match exit 1 to 0 so the pass reports a proven-empty span rather
      than an absent one. Known residual, accepted: substring matching means this literal is also
      satisfied by any nonzero count ending in the digit 0 (10, 20, ...); the frozen command
      admits no tighter span, so the exit-0 contract plus this digit are the full assertion.
    fix_if: >-
      A positive count means operational_fact content landed in the numbered entry. Move it to
      rec-3905 via the portal, per the operator's explicit call.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as grep_count, but green-by-construction on the un-implemented tree (the
      Decision 195 span does not exist yet, so the count is trivially 0), which makes it a
      tautological graduate and a hard plan-PR failure under the Decision 189 gate. It is a
      one-shot authoring guard for this entry, not a durable corpus invariant.
  - step: 12
    phase: pre-deploy
    action: Prove the licence artefacts and their validator were not touched by THIS branch.
    command: git fetch origin main && git diff --name-only "$(git merge-base origin/main HEAD)" -- LICENSE LICENSING.md COMMERCIAL-LICENSE.md CONTRIBUTING.md scripts/checks/hygiene/validate_licence_consistency.py | wc -l
    expected: "0 -- the licence seam is gated on a legal event, not on this PR."
    fix_if: >-
      Before reverting anything, distinguish a genuine edit on this branch from base drift: a
      separate concurrent agent owns the Decision 171 licence terms and may merge to main first.
      The merge-base form already excludes their commits; if a path still appears, it was edited
      HERE -- revert it. The LICENSE line and the validator regex move together, later, in one commit.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible, but its subject is this PR's diff against a merge base -- transient repo
      state. As a standing guard it would forbid the licence edit this plan explicitly sequences
      for later, which is the opposite of the intended invariant.
  - step: 13
    phase: pre-deploy
    action: Prove no Terraform was touched (rec-3136 records terraform/github state as drifted).
    command: git fetch origin main && git diff --name-only "$(git merge-base origin/main HEAD)" -- terraform/ | wc -l
    expected: "0."
    fix_if: Revert any terraform/ hunk; this plan has no infrastructure element.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible, but scoped to this PR's diff against a merge base -- transient repo state.
      A standing "terraform/ is never modified" guard would be false for the whole repository.
  - step: 14
    phase: pre-deploy
    action: >-
      Confirm the rec-3905 portal update landed, by reading it back from the warehouse. This is the
      plan's only warehouse write and the only change a git revert does not undo.
    command: bin/venv-python -m scripts.ops_data_portal --sync && grep 'rec-3905' logs/.recommendations-log.jsonl | grep -c 'getdbt'
    expected: >-
      A count of at least 1 after the pull. RED BEFORE, verified: `getdbt` occurs 0 times cache-wide today
      (re-measure at implement time; the row count drifts as recs are filed). Do NOT count `otl-labs` -- it ALREADY appears in
      rec-3905's existing context, in the very sentence recording the canonical choice as
      UNDECIDED, so counting it would green before the write and prove nothing (this step would
      pass unchanged if the implementer skipped the portal update entirely). `getdbt` is written
      only by the dbt-labs/getdbt.com precedent split that execution_steps[8] mandates, so a
      count of 1 or more is evidence the update_rec call actually landed. The rec-3905 filter is
      equally load-bearing: at least seven other recs mention otl-labs. Exact complement of VP step 11,
      which asserts `getdbt` must NOT appear inside the Decision 195 span. The cache is read-only
      here and is READ as a projection of the warehouse, never written.
    fix_if: >-
      A zero count means the update_rec call did not land. Re-run it through the portal. Never edit
      logs/.recommendations-log.jsonl to make this pass -- that is the Decision 84 replay-from-cache
      anti-pattern and validate.py will fail the PR.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: "Exit 0."
    fix_if: >-
      Address the named check. validate_graduation_completeness, validate_plan_documents,
      validate_decisions_size and validate_supersession_annotations are the likely first failures.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate presubmit tier itself. A graduate disposition here is refused statically by the
      vp-red-before recursion rule, which forbids a graduate step invoking scripts.validate.
  - step: 16
    phase: pre-deploy
    action: Run the full validation tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0."
    fix_if: Address the named check; do not commit on a red full tier (handoff_policy).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate full tier itself; same recursion refusal as step 15. Nothing to graduate.
test_obligations:
  - source: docs/DECISIONS.md
    behavior: >-
      A new decision entry over the Decision 167 per-entry cap, or carrying a prose-only
      reversal-conditions section, or editing an existing body line, is rejected before merge.
    verification_step: 15
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      No new automated test is authored, and none is mechanically required -- validate_plan_documents'
      _is_documentation predicate exempts .md sources. Recorded anyway because the exemption is
      incidental: the behaviour IS already covered by five registered checks that gate exactly this
      diff shape -- validate_decisions_size (the 6144 cap), validate_decision_entry_conformance
      (envelope, markers, block separator), validate_reversal_stanzas (the fenced stanza),
      validate_decisions_index_freshness (index drift) and validate_supersession_annotations. A
      sixth test asserting the literal content of one decision entry would pin prose, not
      behaviour, and would need editing on every future amendment -- the drift-by-design
      anti-pattern AGENTS.md names.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      NS.2's detail names the owning entity (On The Loop Labs Limited) explicitly and distinguishes
      it from the legacy company-aws-profile account, so the principle's existing contrast term
      ("Personal AWS account, not shared work account") does not invert unremarked.
    verification_step: 10
    command: bin/venv-python -c "import sys,yaml; d=[p for p in yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))['north_star']['principles'] if p['id']=='NS.2'][0]['detail']; sys.exit(0 if 'On The Loop Labs Limited' in d and 'company-aws-profile' in d else 1)"
    red_green_expectation: >-
      RED before: neither literal appears in NS.2's `detail` today, so the command exits 1
      (verified). Scoped to NS.2 via the roadmap schema rather than a file-wide grep, because
      `company-aws-profile` already occurs 6 times elsewhere in the file and a file-scoped
      company-name match would be permanently greened by the follow-on plans. GREEN after: the NS.2 annotation introduces both. This is VP step 10, the
      plan's one graduate-disposition step (graduation_check_id ns2-names-owning-entity), and it is
      replayed under Decision 189 inverted polarity to prove it genuinely fails pre-fix.
constraints:
  - >-
    SEAM -- a separate concurrent agent owns the Decision 171 LICENCE TERMS (Additional Use Grant
    width, the 2030-08-15 Change Date, the conditional Apache-2.0 flip, the dual-licensing
    authorisation). This plan touches none of them and edits no licence artefact.
  - >-
    The LICENSE `Licensor:` parameter is gated on a LEGAL event, not on a PR. It cannot name the
    company before the IP assignment executes -- that would be a grant from a party not yet holding
    the rights. When it does change, the LICENSE line and
    scripts/checks/hygiene/validate_licence_consistency.py's `^Licensor: +Benjamin Blake\s*$`
    regex (line 67) must move in the SAME commit or the check goes red.
  - >-
    Decision 177 -- live decision bodies are append-only. Amend Decision 106 with a dated
    blockquote; never splice its existing lines. Precedent: Decisions 118 and 92, both
    `Ratify CD.NN` entries amended this way.
  - >-
    Decision 147 -- do NOT annotate the CD.6 row in ROADMAP-PLATFORM.yaml. CD.6 is state=ratified
    and stored compact; re-accumulating narrative onto a terminal CD row is precisely what
    check_roadmap_regrowth observes. The amendment goes on Decision 106 instead.
  - >-
    Decision 150 / Decision 75 -- the decision entry records the standing commitment only. The
    org-handle preference, its reasoning and the gated-rec inventory are operational_fact and
    work_item content; they route to rec-3905 and to this plan, never into the numbered entry.
  - >-
    Decision 86 -- no new standing prose document under docs/. This plan creates no new file
    except its own plan artefact.
  - >-
    Decision 128 -- no SLOC budget raise; no source file is modified.
  - >-
    Single Portal Invariant -- the rec-3905 update goes through
    `bin/venv-python -m scripts.ops_data_portal --update-rec rec-3905`. Never edit
    logs/.recommendations-log.jsonl (gitignored read cache, untracked, and 5 rows stale against
    1273 open recs in the warehouse).
  - >-
    The NS.2 annotation must NOT introduce the literal string `benjamin-blake/agent-platform`.
    validate_licence_consistency is an ALWAYS-RUN check and its _CLASS_A_PATTERNS map (line 57)
    watches docs/ROADMAP-PLATFORM.yaml for exactly that old slug. An account-and-org-identity
    annotation is precisely where an author would reflexively write it. The repository is
    `benjamin-blake/theseus` (Decision 171 clause 1), and the owner half moves only via the gated
    org transfer, never in this plan.
  - >-
    Decision 171 clause 5 rests dual licensing on sole copyright ownership "which is UNVERIFIED",
    and its reversal condition (a) fires on "a copyright-provenance audit finds a contribution not
    covered by an assignment". Clause 2's founder-to-company assignment transfers whatever rights
    the founder holds; it neither creates nor cures the unverified-provenance question 171 raises,
    so whatever ownership state obtains is preserved ACROSS the assignment and condition (a) -- a
    third-party-contribution trigger -- is not pulled by it. Write it that way in the decision
    body. Do NOT write that sole ownership IS established: that is the exact proposition 171
    clause 5 marks unverified, and under Decision 177's append-only regime a corpus contradiction
