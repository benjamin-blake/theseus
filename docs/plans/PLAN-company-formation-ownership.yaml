schema_version: 4
slug: company-formation-ownership
intent: >-
  Record On The Loop Labs Limited as the owner of this platform in the decision corpus: the
  company-as-owner fact, the founder-to-company IP assignment and the licence-parameter ordering
  it implies, the AWS account-ownership consequence that re-opens Decision 106's premise, and the
  undecided canonical GitHub organisation handle as an explicit open condition. Keystone of a
  four-plan sequence; records commitments only and executes none of the gated work.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-company-formation-ownership.yaml
phase: T1

scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Author the new entry `## Decision 194:` (next free number; live max 193, archive max 71) and
      append a dated `> **Amended by Decision 194 (2026-09-17):**` blockquote to `## Decision 106`.
      Both are additions; no existing body line is edited (Decision 177).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Append an inline `[Amendment 2026-09-17, Decision 194 -- ...]` annotation to the NS.2
      principle's `detail`, matching the form NS.3 and NS.5 already carry.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerated typed-edge index. Committed artefact; `validate_decisions_index_freshness` is a
      required check in BOTH tiers and fails on drift from any DECISIONS.md change.
  - file: docs/plans/PLAN-company-formation-ownership.yaml
    action: Create
    purpose: This plan artefact.

bundled_recommendations: []
followon_recs:
  - rec-3921
  - rec-3922
  - rec-3923
  - rec-3924
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    `## Decision 194:` exists in docs/DECISIONS.md carrying the typed yaml envelope (number,
    status, decided_date, amends: [106], significance.value: numbered_decision with a non-empty
    justification), the three required markers (Status, Date, Decision), and a fenced
    ```yaml reversal-conditions``` stanza (Decision 133), not a prose-only Reversal-conditions line.
  - >-
    The Decision 194 block measured heading-to-next-heading is strictly under 6144 bytes
    (Decision 167 clause 3; hard-fail in the --pre tier).
  - >-
    Decision 194 carries four clauses: (1) On The Loop Labs Limited owns the platform; (2)
    founder-to-company IP assignment, with the LICENSE `Licensor:` parameter changing ONLY when
    the assignment legally executes and the LICENSE line and validate_licence_consistency.py's
    regex moving in the SAME commit; (3) the AWS account-ownership consequence, naming Decision
    106 reversal condition (a) as the trigger it fires; (4) the canonical GitHub organisation
    handle as a separately-decided gated identifier, naming both candidates and the gated work.
  - >-
    Clause 4 names the two candidate handles ONLY. No preference, leaning or precedent analogy
    appears in the decision entry -- that detail lands on rec-3905, which stays revisable.
  - >-
    Decision 106 gains the Amended-by blockquote and every pre-existing line of docs/DECISIONS.md
    is byte-identical -- the diff against origin/main contains zero deleted lines (Decision 177).
  - >-
    NS.2's detail names On The Loop Labs Limited explicitly and states it is distinct from the
    legacy `company-aws-profile` account that tier item T5.2 tears down.
  - >-
    LICENSE, LICENSING.md, COMMERCIAL-LICENSE.md, CONTRIBUTING.md and
    scripts/checks/hygiene/validate_licence_consistency.py are unmodified, and no file under
    terraform/ is touched.
  - >-
    rec-3905 carries the org-handle leaning and its reasoning, applied via `update_rec` through
    the portal (never a JSONL edit).

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Regenerate the committed decisions index after the DECISIONS.md edits.
    command: bin/venv-python -m scripts.decisions_index --write
    expected: "Exit 0; stderr reports `Decisions index written to docs/decisions-index.json`."
    fix_if: >-
      Non-zero exit means the new entry did not parse. Check the header form
      (`## Decision 194: <title> (Decided)`) and the typed yaml envelope fence.
    hermetic: true
  - step: 2
    phase: pre-deploy
    action: Prove the regenerated index matches the live corpus (Decision 179 clause 5(i)).
    command: bin/venv-python -m scripts.decisions_index --check
    expected: "Exit 0; stderr reports `Decisions index is current.`"
    fix_if: Drift means step 1 was skipped or DECISIONS.md changed after it; re-run step 1.
    hermetic: true
  - step: 3
    phase: pre-deploy
    action: Measure the Decision 194 block against the Decision 167 per-entry cap.
    command: awk '/^## Decision 194:/{f=1} f&&/^## Decision 193:/{exit} f' docs/DECISIONS.md | wc -c
    expected: A byte count strictly below 6144.
    fix_if: >-
      Over cap -- trim the Related pointer block to load-bearing ids only, then move the gated-work
      rec inventory into this plan's context. Never raise the cap (Decision 167's own reversal text).
    hermetic: true
  - step: 4
    phase: pre-deploy
    action: Prove the DECISIONS.md change is purely additive (Decision 177 append-only).
    command: git diff origin/main -- docs/DECISIONS.md | grep -c '^-[^-]' || true
    expected: "0 -- no deleted or rewritten line anywhere in the file."
    fix_if: >-
      Any non-zero count is an in-place body edit. Revert it and re-express the change as a dated
      blockquote annotation appended to the entry.
    hermetic: true
  - step: 5
    phase: pre-deploy
    action: Run the decision-corpus entry-conformance gate.
    command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0; `FAILED: []`."
    fix_if: >-
      Failures name the missing marker, envelope field or significance token; add them per
      docs/contracts/decision-entry.yaml. Do not hardcode markers -- the contract is the source.
    hermetic: true
  - step: 6
    phase: pre-deploy
    action: Prove the fenced reversal-conditions stanza is well-formed and monitored.
    command: bin/venv-python -c "import sys; from scripts.checks.ops_governance.validate_reversal_stanzas import validate_reversal_stanzas as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0; the monitored-stanza count rises from 12 to 13."
    fix_if: >-
      A malformed stanza means the fence line is not exactly '```yaml reversal-conditions' or the
      body is not a mapping with decision/review_by/on_trigger/conditions.
    hermetic: true
  - step: 7
    phase: pre-deploy
    action: Run the roadmap schema and candidate-decision referential gates after the NS.2 edit.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.validate_candidate_decision_ratification import validate_candidate_decision_ratification as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0; `FAILED: []`; the header-indexed count rises from 173 to 174."
    fix_if: >-
      A referential failure means a CD's ratified_as no longer resolves; confirm no CD row was
      edited -- CD.6 is deliberately left untouched under Decision 147's compaction norm.
    hermetic: true
  - step: 8
    phase: pre-deploy
    action: Prove the licence artefacts and their validator were not touched.
    command: git diff --name-only origin/main -- LICENSE LICENSING.md COMMERCIAL-LICENSE.md CONTRIBUTING.md scripts/checks/hygiene/validate_licence_consistency.py | wc -l
    expected: "0 -- the licence seam is gated on a legal event, not on this PR."
    fix_if: >-
      Any named file means the plan overstepped into the concurrent licensing agent's surface.
      Revert it; the LICENSE line and the validator regex move together, later, in one commit.
    hermetic: true
  - step: 9
    phase: pre-deploy
    action: Prove no Terraform was touched (rec-3136 records terraform/github state as drifted).
    command: git diff --name-only origin/main -- terraform/ | wc -l
    expected: "0."
    fix_if: Revert any terraform/ hunk; this plan has no infrastructure element.
    hermetic: true
  - step: 10
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: "Exit 0."
    fix_if: >-
      Address the named check. validate_decisions_size, validate_decision_currency and
      validate_supersession_annotations are the likely first failures on a new entry.
    hermetic: true
  - step: 11
    phase: pre-deploy
    action: Run the full validation tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0."
    fix_if: Address the named check; do not commit on a red full tier (handoff_policy).
    hermetic: true

test_obligations:
  - source: docs/DECISIONS.md
    behavior: >-
      A new decision entry over the Decision 167 per-entry cap, or carrying a prose-only
      reversal-conditions section, or editing an existing body line, is rejected before merge.
    verification_step: 10
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      No new automated test is authored. This plan adds no executable behaviour: it changes only
      the decision corpus, the roadmap's north-star prose and a generated index. The behaviour is
      already covered by five registered checks that gate exactly this diff shape --
      validate_decisions_size (the 6144 cap), validate_decision_entry_conformance (envelope and
      markers), validate_reversal_stanzas (the fenced stanza), validate_decisions_index_freshness
      (index drift) and validate_supersession_annotations. Authoring a sixth test asserting the
      literal content of one decision entry would pin prose, not behaviour, and would need editing
      on every future amendment -- the drift-by-design anti-pattern AGENTS.md names.

constraints:
  - >-
    SEAM -- a separate concurrent agent owns the Decision 171 LICENCE TERMS (Additional Use Grant
    width, the 2030-08-15 Change Date, the conditional Apache-2.0 flip, the dual-licensing
    authorisation). This plan touches none of them and edits no licence artefact.
  - >-
    The LICENSE `Licensor:` parameter is gated on a LEGAL event, not on a PR. It cannot name the
    company before the IP assignment executes -- that would be a grant from a party not yet holding
    the rights. When it does change, the LICENSE line and
    scripts/checks/hygiene/validate_licence_consistency.py's `^Licensor: +Benjamin Blake\s*$`
    regex (line 67) must move in the SAME commit or the check goes red.
  - >-
    Decision 177 -- live decision bodies are append-only. Amend Decision 106 with a dated
    blockquote; never splice its existing lines. Precedent: Decisions 118 and 92, both
    `Ratify CD.NN` entries amended this way.
  - >-
    Decision 147 -- do NOT annotate the CD.6 row in ROADMAP-PLATFORM.yaml. CD.6 is state=ratified
    and stored compact; re-accumulating narrative onto a terminal CD row is precisely what
    check_roadmap_regrowth observes. The amendment goes on Decision 106 instead.
  - >-
    Decision 150 / Decision 75 -- the decision entry records the standing commitment only. The
    org-handle preference, its reasoning and the gated-rec inventory are operational_fact and
    work_item content; they route to rec-3905 and to this plan, never into the numbered entry.
  - >-
    Decision 86 -- no new standing prose document under docs/. This plan creates no new file
    except its own plan artefact.
  - >-
    Decision 128 -- no SLOC budget raise; no source file is modified.
  - >-
    Single Portal Invariant -- the rec-3905 update goes through
    `bin/venv-python -m scripts.ops_data_portal --update-rec rec-3905`. Never edit
    logs/.recommendations-log.jsonl (gitignored read cache, untracked, and 5 rows stale against
    1273 open recs in the warehouse).
  - >-
    Out of scope entirely: repository rename, GitHub org transfer, OIDC subject change, hardcoded
    benjamin-blake sweep, any terraform/ change, CONTRIBUTING.md, Decision 101, CD.23, trademark
    content, and re-scoping tier item T5.2.

