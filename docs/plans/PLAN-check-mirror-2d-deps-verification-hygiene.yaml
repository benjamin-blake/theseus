acceptance_criteria:
- 'Each of the eleven survivor sites, mutated with mutate2.py in a scratch clone that carries the new tests, makes its mirror FAIL: validate_check_manifests:flip-compare:2, validate_requirements:neuter-append:0, validate_dependency_graph_freshness:neuter-append:0, validate_dependency_graph_freshness:flip-compare:0, validate_subprocess_encoding:flip-compare:0, validate_test_count_coupling:neuter-append:0, validate_placement:neuter-append:6, validate_verifier_hermeticity:neuter-append:0/2/4, and _implement_pr_leg:neuter-append:0 in validate_graduation_completeness.py.'
- On the unmodified branch every one of the eight mirrors passes -- steps 1-3 record the same eleven mutants SURVIVING today, steps 19-21 record them KILLED with the new tests in tree.
- 'Every new red-path test asserts its emission NON-MASKABLY, in one of exactly three permitted shapes: (a) EXACT list equality on failed; (b) a POSITIVE assertion on the one stdout line that distinguishes the site; or (c) where a single call legitimately emits from more than one site or leg, an EXACT or POSITIVE assertion applied to a list FIRST filtered by a discriminator the masking message cannot carry -- assert the filtered list non-empty, THEN assert on its first element (this is VP step 17''s shape, the only step that needs it: the plan-PR leg''s identically-worded append is stripped by the ''(implement-PR leg)'' filter before the text assertion runs). Never a bare `any(<substring> in f)` over the UNFILTERED failed list that a neighbouring message can satisfy. Shape (c) is a discrimination-preserving widening of shapes (a)/(b), not a relaxation: the filter must be a discriminator the masking message provably cannot carry, and the assertion on the filtered list stays positive and exact.'
- The landed diff is exactly the eight test files, this plan's own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards; `git diff --stat origin/main...HEAD -- scripts/checks/` is empty and config/sloc_budgets.yaml, config/coverage_baseline.yaml and config/check_accounting_baseline.yaml are unchanged.
- 'All eight files stay under 500 SLOC (measured post-edit maximum: 397), are ruff-clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.'
- No new test file and no new mirror directory is created (all eight targets already exist), no examined()/skipped() declaration is added to any check module, and no test imports another test_* module (Decision 131).
