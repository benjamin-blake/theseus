schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-reader-lock"
intent: >-
  Deploy the masked telemetry content reader that PLAN-telemetry-content-reader built as a stub, behind Decision 239
  cl.5's change lock, and close rec-4696. terraform/bootstrap creates the function with an inert placeholder, its
  execution role, Function URL, log group, unexpected-invoker alarm and a deploy role bound to a reviewer-gated GitHub
  Environment. The CI apply boundary refuses every other identity any Lambda or IAM write on the function and on both
  roles. A deploy workflow builds the artifact with no AWS credentials, shows the operator the commits since the last
  deploy, and, once the operator approves, deploys exactly the recorded digest with the layers, handler and environment
  that the approved commit pins. PlatformDev gets masked URL-only invoke and the security trail records every invoke.
  A protected-path edit hook, CODEOWNERS, boundary_patterns and a repo check are the early warnings. The golden replay
  gains an opt-in masked read-back leg. The manifest flips to active.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-reader-lock.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed). Plan 3 of 3 for rec-4481, which plan 2 resolved. It carries
  rec-4696 (High), the deploy half split off at planning time. It depends on PLAN-sensitive-value-detectors (#1708),
  PLAN-telemetry-content-reader (#1718) and PLAN-telemetry-top-level-agent-run's production column hold (#1717,
  validate_reconcile_pending_gate --telemetry-hold); all three must be merged before the build. closes_criteria is empty.
closes_criteria: []
amends: []
introduces:
  - telemetry-content-deploy
  - DenyTelemetryContentChange
scope:
  - file: terraform/bootstrap/telemetry_content_reader.tf
    action: Create
    purpose: >-  # pragma: allowlist secret
      Locals: ducklake_telemetry_content_function = "agent-platform-ducklake-telemetry-content", the data and blob
      prefixes as literals (bootstrap reads no personal-root state).
      (a) aws_iam_role.telemetry_content, named agent-platform-ducklake-telemetry-content. It carries the CI apply
      boundary (Decision 144 cl.3), and its trust allows only lambda.amazonaws.com.
      (b) aws_iam_role_policy.telemetry_content, with five statements:
        - Logs: logs:CreateLogStream and logs:PutLogEvents on the function's log group, "<arn>:*".
        - TelemetryCatalogDataRead: s3:GetObject on agent-platform-data-lake/ducklake-telemetry/*.
        - TelemetryCatalogDataList: s3:ListBucket and s3:GetBucketLocation on the bucket, with StringLike s3:prefix
          ducklake-telemetry/* (the telemetry reader's shape).
        - TelemetryBlobRead: s3:GetObject on agent-platform-data-lake/telemetry-blobs/ducklake_telemetry/*.
        - TelemetryReaderDsnRead: secretsmanager:GetSecretValue on the exact ARN of
          agent-platform-ducklake-telemetry-reader-dsn, looked up by name through a data source (Decision 157), plus
          ssm:GetParameter on parameter/secret/agent-platform-ducklake-telemetry-reader-dsn (Decision 237 cl.2: a
          declared consumer of an existing login; no secret or parameter changes). secrets-to-ssm-retire removes the
          Secrets Manager half here too.
      (c) aws_cloudwatch_log_group.telemetry_content, /aws/lambda/agent-platform-ducklake-telemetry-content,
      retention 365 days (Decision 239 cl.4 needs at least 90), lifecycle prevent_destroy.
      (d) aws_s3_object.telemetry_content_placeholder, key lambda-packages/telemetry-content/placeholder.zip.
      content_base64 is a committed literal: a deterministic zip whose single member is
      src/lambdas/ducklake_telemetry_content_reader/handler.py, with a handler that returns {"statusCode": 503,
      "body": "{\"error\": \"content_reader_not_deployed\"}"} for every event. Nothing serves content before the first
      approved deploy, and Terraform reads no build artifact (environment-taxonomy conformance).
      (e) aws_lambda_function.telemetry_content: role (a), python3.12, x86_64, memory 1024, timeout 120, reserved
      concurrency 2, the handler path above, code from (d), no layers, no environment variables. lifecycle
      ignore_changes = [s3_bucket, s3_key, s3_object_version, source_code_hash, layers, handler, environment]: the gated
      job owns code, layers, handler and environment (Decision 239 cl.5 as amended); Terraform owns role, runtime,
      memory, timeout, concurrency and logging. It depends_on (b) and (c).
      (f) aws_lambda_function_url.telemetry_content, authorization_type AWS_IAM.
      (g) aws_ssm_parameter.telemetry_content_url, /agent-platform/ducklake/telemetry_content_reader_url (plan 2's
      read route resolves it, and PlatformDev's DuckLakeEndpointDiscovery already reads /agent-platform/ducklake/*).
      (h) aws_cloudwatch_log_metric_filter.telemetry_content_unexpected_invoker on (c), with pattern
      { ($.event = "telemetry_content_read") && ($.role != "PlatformDev") && ($.role !=
      "agent-platform-ducklake-telemetry-content-deploy") }. The metric is TelemetryContentUnexpectedInvoker in
      namespace AgentPlatform/TelemetryContent, value 1. Role "unknown" (plan 2's fallback line) matches on purpose.
      (i) aws_cloudwatch_metric_alarm.telemetry_content_unexpected_invoker: Sum >= 1 over 300 s, one period,
      notBreaching. alarm_actions go to the agent-platform-alerts topic by ARN template (Decision 239 cl.6, the
      platform_security_alarms.tf shape). The description names the Logs Insights query over (c) that answers who
      read what.
      (j) aws_cloudwatch_metric_alarm.telemetry_content_errors: Errors plus Url5xxCount > 0 over 15 minutes (the
      telemetry reader's shape, Decision 55).
      Every ARN is built from var.account_id and var.aws_region. Nothing names an account id.
  - file: terraform/bootstrap/telemetry_content_deploy_role.tf
    action: Create
    purpose: >-
      aws_iam_role.telemetry_content_deploy, named agent-platform-ducklake-telemetry-content-deploy, carries the CI
      apply boundary. Its name shares the content prefix, so DenyTelemetryContentChange's role resource covers it.
      Trust has ONE statement: Federated arn:aws:iam::${var.account_id}:oidc-provider/token.actions.githubusercontent.com,
      action sts:AssumeRoleWithWebIdentity, StringEquals with three keys:
        - aud: sts.amazonaws.com;
        - sub: [for repo in local.github_repos : "repo:${repo}:environment:telemetry-content-deploy"] (Decision 172
          immutable subjects; the local lives in github_ci_apply.tf);
        - job_workflow_ref: ["otl-labs/ontheloop/.github/workflows/deploy-telemetry-content.yml@refs/heads/main"]
          (Decision 238 cl.2 shape).
      No StringLike, and no ref or pull_request sub.
      aws_iam_role_policy.telemetry_content_deploy has five statements:
        - DeployCode: lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:UpdateFunctionCode and
          lambda:UpdateFunctionConfiguration on the content function ARN only.
        - LayerRead: lambda:GetLayerVersion on layer:ducklake-deps:* and layer:ducklake-extensions:*.
        - UrlRead: lambda:GetFunctionUrlConfig on the function.
        - InvokeUrl: lambda:InvokeFunctionUrl on the function and its :*, unconditioned.
        - InvokeViaUrlOnly: lambda:InvokeFunction on the same two, with Bool lambda:InvokedViaFunctionUrl = true
          (Decision 213 cl.1).
      No iam:*, no PassRole, no PublishVersion, no concurrency, URL-config or permission verbs, no S3. No statement
      names PlatformDev or PlatformAdmin (Decision 225 cl.1).
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      Three edits.
      (1) DenyTelemetryProdPrefixIO's ArnNotLike list gains the exact role/agent-platform-ducklake-telemetry-content
      (Decision 230 cl.5 as amended by Decision 239 cl.7). There is no wildcard, so the deploy role stays fenced.
      (2) A new statement DenyTelemetryContentChange, placed after DenyTelemetryProdPrefixIO:
        - Effect: Deny.
        - Action: lambda:Create*, lambda:Delete*, lambda:Publish*, lambda:Put*, lambda:Update*, lambda:TagResource,
          lambda:UntagResource, iam:Attach*, iam:Delete*, iam:Detach*, iam:PassRole, iam:Put*, iam:Tag*,
          iam:Untag* and iam:Update*.
        - Resource: arn:aws:lambda:${var.aws_region}:${var.account_id}:function:agent-platform-ducklake-telemetry-content*
          and arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-content*.
        - Condition: ArnNotLike aws:PrincipalArn arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-content-deploy.
      Every boundary carrier is therefore refused any code, configuration, permission, alias, concurrency or tag change
      to the function, and any policy, trust, boundary, tag or PassRole action on the execution role or the deploy
      role. Those carriers include agent-platform-github-ci-deploy, whose UpdateFunctionCode spans
      function:agent-platform-*, and the CI apply role, whose IAM writes span role/agent-platform-* (Decision 143
      cl.1, Decision 144 cl.2). PlatformAdmin and root sit outside the boundary (Decision 144 cl.3).
      (3) Byte recovery. In DenyDuckLakeDirectInvoke, DenyDuckLakeResourcePolicyEdit and DenyDuckLakeEventSourceMapping,
      the writer pair (name and name:*) becomes function:agent-platform-ducklake-writer* and the reader pair becomes
      function:agent-platform-ducklake-reader*. Each still covers the same functions and every qualifier. It can only
      widen a Deny, and only to a future function with that prefix; none exists today.
      Measured 2026-10-29 with 12-character account and region placeholders: 5,266 B today, 5,463 B after all three
      edits, against Decision 230's 5,632 B review trigger and the 6,144 B AWS limit. The precondition is unchanged.
