    expected: SCRATCH CLEARED
    fix_if: A path survives -- remove it before ending the ADMIN session.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Operator-directed bootstrap apply, the admin_out_of_band.procedure loop: plan, present, the operator's explicit
      acceptance, apply. The command re-plans after the apply to prove convergence.
    command: >-
