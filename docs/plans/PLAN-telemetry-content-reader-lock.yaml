  - file: scripts/checks/ci_guards/validate_content_reader_lock.py
    action: Create
    purpose: >-
      A repo check in the validate_trusted_plan_environment pattern: predicates over parsed workflows, terraform text
      and CODEOWNERS, each red on synthetic input.
        (a) Only deploy-telemetry-content.yml references environment telemetry-content-deploy, and no environment name
            is an expression.
        (b) That file declares no workflow_call, pull_request or pull_request_target trigger.
        (c) No other workflow or build_lambda DuckLake list names the content function or artifact.
        (d) Its push paths cover every manifest include and asset, the manifest, deploy_config.json, the sidecar, the
            script and itself, and the deploy job runs only when the build's held output is 'false'.
        (e) The boundary carries DenyTelemetryContentChange with the declared action set, both resources and the single
            deploy-role exception, and the fence names the execution role exactly.
        (f) The deploy role's trust is one statement with the three exact StringEquals keys.
        (g) The script's update-function-configuration call passes exactly --handler, --layers and --environment.
        (h) terraform/github declares environment telemetry-content-deploy with required reviewers, prevent_self_review
            false, can_admins_bypass false, custom_branch_policies true, protected_branches false and prevent_destroy; one
            deployment policy with branch_pattern main; and import blocks for both, the policy's keyed by
            var.telemetry_content_deploy_main_policy_id.
      Ownership is not re-checked here: the four lock files join the detector ratchet's PROTECTED set, whose leg (d)
      requires a CODEOWNERS line and a boundary_patterns entry for each and whose leg (e) refuses narrowing. An early
      warning, not a control (Decision 239 cl.5; Decision 187: an agent PR can edit the check itself).
