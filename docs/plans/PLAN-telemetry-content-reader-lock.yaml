rollback: >-
  Before the bootstrap apply: revert the squash commit. Nothing is deployed, and the environment is inert without the
  role. After: the operator, in a bootstrap apply, removes the deploy role and the function (lifting the log group's
  prevent_destroy deliberately), then the boundary statement and the grants. The workflow is reverted in the same
  change, and the reader concurrency goes back to 5. Until then, refusing pending runs keeps the function on its last
  approved code.
