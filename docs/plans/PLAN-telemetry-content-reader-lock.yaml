      -detailed-exitcode > /dev/null; rc=$?; test $rc -eq 0 && echo "BOOTSTRAP CONVERGED"
    expected: BOOTSTRAP CONVERGED (exit 0, no changes) after the human-accepted apply of the merged sha. The apply's counts match step 6.
    fix_if: Any diff after apply, or an apply error -- stop; nothing is retried without the operator. An AccessDenied on PutMetricFilter right after the policy update is IAM propagation; re-run the apply once on the operator's word.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      The standing live-simulate gate after a boundary change (deploy-paths POST-APPLY, the apply role's fixture), then
