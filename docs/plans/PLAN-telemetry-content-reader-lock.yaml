bundled_recommendations:
  - rec-4696
followon_recs:
  - rec-4735
infrastructure_dependencies:
  - "terraform/bootstrap (admin-only, Decision 223): a pre-merge read-only ADMIN plan and candidate-boundary simulate at the PR head (deploy-paths admin_out_of_band.pre_merge_live_plan, VP 6-9), then the operator-directed apply after merge (VP 10)."
  - "terraform/github (operator): the operator creates the telemetry-content-deploy environment in Settings before the build starts (required reviewer, admin bypass off, deployment branches selected: main). It is inert until the bootstrap apply creates the role. The build reads its policy id for the import variable; the import blocks key it at the next root apply (rec-4355 re-key pending)."
  - "terraform/personal (CI plan and apply): reader concurrency 5 -> 3, a non-IAM in-budget update, auto-applies after merge. It must land before the first content deploy, so that both readers share the login's connection limit within it."
  - "Ordering: bootstrap apply -> iam_simulate (VP 11) -> environment exists -> personal apply green -> no TELEMETRY_PRODUCTION_HOLD (the operator's provision_telemetry_catalog column add for #1717 done) -> first deploy run approved (VP 12) -> masked read-back (VP 13)."
acceptance_criteria:
  - >-
    Only agent-platform-ducklake-telemetry-content-deploy, under the operator-approved environment, can change the
    content function's code or configuration. Every boundary-carrying identity is refused any Lambda write on the
    function and any IAM write or PassRole on its two roles (iam_simulate rows).
  - >-
    A merge touching a bundled path starts a deploy run that waits for the operator. The run summary lists the commits
    since the last deployment, and the deployed CodeSha256 equals the digest the credential-free build recorded and a
    local rebuild of the same commit.
  - >-
    The deployed layers, handler and environment are exactly deploy_config.json's, and each layer's digest matches its
    pin.
  - >-
    PlatformDev invokes the content function only through its URL, and no agent-reachable role can invoke a raw
    function (none exists).
  - >-
    Each read writes a telemetry_content_read line to a 365-day log group, and the security trail records the invoke.
    A role other than PlatformDev or the deploy role raises the unexpected-invoker alarm.
  - The rendered boundary stays at or under 5,632 bytes.
  - >-
    rec-4696 closes on its acceptance test, with the function live and a masked golden read-back that matches as
    PlatformDev.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4696's acceptance, and the lock's pins, check, hook, workflow, script, build flag, deploy config and golden leg.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_content_reader_iam.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_telemetry_prefix_fence.py
      tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py tests/checks/ci_guards/test_validate_content_reader_lock.py
      tests/hooks/test_protected_path_guard.py tests/verify_ci_workflow/test_deploy_telemetry_content_workflow.py
      tests/test_ci_telemetry_content_deploy.py tests/lambdas/ducklake_telemetry_content_reader/test_deploy_config.py
      tests/test_build_lambda.py tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
      tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_content.py tests/checks/misc/test_sensitive_value_detectors.py
      tests/lambdas/ducklake_telemetry_content_reader/test_packaging.py
      tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py tests/test_deploy_paths_admin_procedure.py
      tests/checks/structural/test_size_limits.py tests/checks/iam_tf/test_terraform_github_import_blocks.py
      tests/checks/ci_guards/test__manifest.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
      tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py -q
    expected: exit 0. Before the change the new test files do not exist and the modified pins fail.
    fix_if: Fix the HCL, workflow, script or code; never relax a pin.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: telemetry-content-reader-lock
  - step: 2
    phase: pre-deploy
    action: The rendered boundary stays at or under Decision 230's review trigger.
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_telemetry_content_reader_iam.py::test_rendered_boundary_under_review_trigger" -q
    expected: exit 0 (5,463 B measured at planning).
    fix_if: Over 5,632 B -- stop. Decision 239's boundary-size reversal condition fires, and where the fence lives is the operator's to re-decide.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: The node is inside step 1's graduated selection; a second registry entry would duplicate it.
  - step: 3
    phase: pre-deploy
    action: The registered lock check, shell-body ratchet and taxonomy check are green on the real tree.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_content_reader_lock import validate_content_reader_lock as a;
      from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as b;
      from scripts.checks.ci_guards.validate_ci_rca_taxonomy import validate_ci_rca_taxonomy as c; f=[]; a(f); b(f); c(f);
      print('LOCK_FAILS', len(f)); assert not f, f"
    expected: LOCK_FAILS 0.
    fix_if: Read the named predicate; fix the tree, never the predicate.
    hermetic: true
    expected_literals: ["LOCK_FAILS 0"]
    graduation: waive
    graduation_waiver_reason: All three are registered checks that run in every tier (validate_content_reader_lock pre=True), so a registry entry would duplicate them.
  - step: 4
    phase: pre-deploy
    action: "PRE-MERGE GATE (ADMIN): credential check, on the operator's direction (Benjamin 2026-10-29 13:24Z: admin only for named bootstrap steps)."
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
      'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK, so this session runs steps 5-9. ADMIN_CHAIN_ABSENT means the PR waits at CI-green and steps 5-9 go to an ADMIN session.
    fix_if: ADMIN_CHAIN_ABSENT -- hand steps 5-9 to an ADMIN session; never merge without their evidence.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: "PRE-MERGE GATE (ADMIN): materialise terraform.bootstrap.tfvars from the sanctioned source, values never printed."
    command: >-
      (umask 077 && aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile
      agent_platform_admin --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email)[[:space:]]*='
      > terraform/bootstrap/terraform.bootstrap.tfvars) && git check-ignore -q terraform/bootstrap/terraform.bootstrap.tfvars
      && test "$(grep -c -E '^[[:space:]]*(account_id|owner_email)[[:space:]]*=' terraform/bootstrap/terraform.bootstrap.tfvars)"
      -eq 2 && echo "BOOTSTRAP TFVARS MATERIALISED (values not printed)"
    expected: The two keys are present, the file is mode 600 and gitignored, and no value reaches the terminal.
    fix_if: A key missing -- recover per terraform-cc-web-operations.yaml tfvars_and_remote_state_recovery; never paste a value (Decision 101).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: "PRE-MERGE GATE (ADMIN): read-only terraform plan -lock=false of terraform/bootstrap at the CI-green $PR_HEAD_SHA in a throwaway worktree, with declared counts."
    command: >-
      test -n "$PR_HEAD_SHA" && W="${TMPDIR:-/tmp}/content-lock-worktree" && M="${TMPDIR:-/tmp}/content-lock-evidence" &&
      mkdir -p "$M" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" && cp
      terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" && terraform -chdir="$W/terraform/bootstrap"
      init -input=false > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false
      -var-file=terraform.bootstrap.tfvars -out="$M/p.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap"
      show -json "$M/p.tfplan" > "$M/p.json"; rc=$?; rm -f "$M/p.tfplan"; test $rc -eq 0 && M="$M" bin/venv-python -c
      "import json,os,collections; m=os.environ['M']; d=json.load(open(m+'/p.json')); c=collections.Counter('-'.join(r['change']['actions'])
      for r in d.get('resource_changes',[]) if r['change']['actions'] not in (['no-op'],['read'])); pol=[r for r in d['resource_changes']
      if r['address']=='aws_iam_policy.github_ci_apply_boundary'][0]['change']['after']['policy']; open(m+'/boundary.json','w').write(pol);
      os.remove(m+'/p.json'); print(json.dumps(dict(c), sort_keys=True)); ok=dict(c)=={'create':12,'update':4}; print('PRE-MERGE PLAN OK' if ok else 'PRE-MERGE PLAN STOP'); assert ok"
    expected: >-
      One counts line, {"create": 12, "update": 4}, then PRE-MERGE PLAN OK. The 12 creates are the 10 in
      telemetry_content_reader.tf (role, role policy, log group, placeholder object, function, URL, SSM parameter,
      metric filter, two alarms) plus the deploy role and its role policy. Data sources are reads and are not
      counted. The 4 updates are the boundary, the PlatformDev runtime policy, the PlatformAdmin
      policy and the trail. Zero destroys and zero replaces. The candidate boundary JSON is kept for step 7. Counts and
      the sha go on the PR, never addresses with values.
    fix_if: Unexpected counts -- stop and report the addresses (never values) to the planning thread. A new PR head re-runs steps 6-9.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: "PRE-MERGE GATE (ADMIN): IAM's evaluator, with the candidate boundary from step 6, proves the lock denies the CI roles and changes nothing else they do."
    command: >-
      M="${TMPDIR:-/tmp}/content-lock-evidence" && test -s "$M/boundary.json" && M="$M" bin/venv-python -c
      "import json,os,subprocess,sys; m=os.environ['M']; run=lambda *a: json.loads(subprocess.run(['aws',*a,'--profile','agent_platform_admin','--output','json'],capture_output=True,text=True,check=True).stdout);
      acct=run('sts','get-caller-identity')['Account']; r=run('configure','export-credentials') if False else None; reg='eu-west-2';
      fn=lambda n: 'arn'+':aws:lambda:'+reg+':'+acct+':function:'+n; role=lambda n: 'arn'+':aws:iam::'+acct+':role/'+n; cand=open(m+'/boundary.json').read();
      sim=lambda p,a,res: run('iam','simulate-principal-policy','--policy-source-arn',role(p),'--permissions-boundary-policy-input-list',cand,'--action-names',a,'--resource-arns',res)['EvaluationResults'][0]['EvalDecision'];
      got={'deploy_content':sim('agent-platform-github-ci-deploy','lambda:UpdateFunctionCode',fn('agent-platform-ducklake-telemetry-content')),
      'deploy_reader':sim('agent-platform-github-ci-deploy','lambda:UpdateFunctionCode',fn('agent-platform-ducklake-telemetry-reader')),
      'apply_trust':sim('agent-platform-github-ci-apply','iam:UpdateAssumeRolePolicy',role('agent-platform-ducklake-telemetry-content-deploy')),
      'apply_passrole':sim('agent-platform-github-ci-apply','iam:PassRole',role('agent-platform-ducklake-telemetry-content')),
      'apply_reader_config':sim('agent-platform-github-ci-apply','lambda:UpdateFunctionConfiguration',fn('agent-platform-ducklake-telemetry-reader'))};
      print(json.dumps(got, sort_keys=True)); ok=got['deploy_content']=='explicitDeny' and got['apply_trust']=='explicitDeny' and got['apply_passrole']=='explicitDeny' and got['deploy_reader']=='allowed' and got['apply_reader_config']=='allowed';
      print('SIMULATE OK' if ok else 'SIMULATE STOP'); sys.exit(0 if ok else 1)"
    expected: >-
      One line of decisions only: deploy_content, apply_trust and apply_passrole are explicitDeny, and deploy_reader and
      apply_reader_config are allowed (the lock narrows nothing else). Then SIMULATE OK. The ARNs are built in memory,
      and the output carries no ARN or account id.
    fix_if: A denial shows allowed -- the statement or its exception is wrong; fix it in this PR and re-run steps 6-7. An allowed row shows denied -- the collapse or the new Deny over-reaches; fix it and re-run.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: "PRE-MERGE GATE (ADMIN): PlatformAdmin can make every create the apply needs (with the PR's admin policy)."
    command: >-
      M="${TMPDIR:-/tmp}/content-lock-evidence" && bin/venv-python -c
      "import json,subprocess,sys; run=lambda *a: json.loads(subprocess.run(['aws',*a,'--profile','agent_platform_admin','--output','json'],capture_output=True,text=True,check=True).stdout);
      acct=run('sts','get-caller-identity')['Account']; reg='eu-west-2'; adm='arn'+':aws:iam::'+acct+':role/PlatformAdmin';
      lg='arn'+':aws:logs:'+reg+':'+acct+':log-group:/aws/lambda/agent-platform-ducklake-telemetry-content';
      res=run('iam','simulate-principal-policy','--policy-source-arn',adm,'--action-names','logs:PutMetricFilter','logs:CreateLogGroup','lambda:CreateFunction','lambda:CreateFunctionUrlConfig','lambda:PutFunctionConcurrency','ssm:PutParameter','cloudwatch:PutMetricAlarm','s3:PutObject','--resource-arns','*')['EvaluationResults'];
      d={e['EvalActionName']:e['EvalDecision'] for e in res}; print(json.dumps(d, sort_keys=True)); print('ADMIN CREATES: PutMetricFilter needs this PR' if d.get('logs:PutMetricFilter')!='allowed' else 'ADMIN CREATES OK')"
    expected: >-
      One line of decisions. Every create verb is allowed except logs:PutMetricFilter, which this PR's
      platform_admin_policies.tf edit grants. The apply orders it first (depends_on). If PutMetricFilter is already
      allowed, the edit is redundant; report it, and leave it in.
    fix_if: Another create verb denied -- the apply would fail partway; add the grant to platform_admin_policies.tf in this PR and re-run steps 6-8.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: "CLEANUP (ADMIN): remove scratch evidence and the worktree; also run after any STOP."
    command: >-
      rm -rf "${TMPDIR:-/tmp}/content-lock-evidence" && git worktree remove --force "${TMPDIR:-/tmp}/content-lock-worktree"
