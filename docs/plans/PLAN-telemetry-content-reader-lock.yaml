      terraform/bootstrap/telemetry_content_reader.tf and terraform/bootstrap/telemetry_content_deploy_role.tf.
      An unreadable or unparseable PROTECTED blocks every write to the two bootstrap files and allows the rest, with a
      message naming the parse failure.
      A missing, unreadable or non-naming plan blocks. Every other path and tool passes. The message names the binding
      control (the operator-approved deploy), how to declare a plan, and that Bash edits are not covered. Malformed
      input JSON allows, the never_on_main precedent. It is an early warning, never a control (Decision 239 cl.5,
      Decision 181).
