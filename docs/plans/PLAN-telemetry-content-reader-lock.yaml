    command: >-
      bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml &&
      bin/venv-python -c "import json,subprocess,sys; run=lambda *a: json.loads(subprocess.run(['aws',*a,'--profile','agent_platform_admin','--output','json'],capture_output=True,text=True,check=True).stdout);
      acct=run('sts','get-caller-identity')['Account']; reg='eu-west-2'; fn=lambda n: 'arn'+':aws:lambda:'+reg+':'+acct+':function:'+n; role=lambda n: 'arn'+':aws:iam::'+acct+':role/'+n;
      s3=lambda k: 'arn'+':aws:s3:::agent-platform-data-lake/'+k;
      sim=lambda p,a,r: run('iam','simulate-principal-policy','--policy-source-arn',role(p),'--action-names',a,'--resource-arns',r)['EvaluationResults'][0]['EvalDecision'];
      c='agent-platform-ducklake-telemetry-content'; d=c+'-deploy';
      got={'cideploy_content':sim('agent-platform-github-ci-deploy','lambda:UpdateFunctionCode',fn(c)),
      'cideploy_reader':sim('agent-platform-github-ci-deploy','lambda:UpdateFunctionCode',fn('agent-platform-ducklake-telemetry-reader')),
      'deploy_code':sim(d,'lambda:UpdateFunctionCode',fn(c)),'deploy_config':sim(d,'lambda:UpdateFunctionConfiguration',fn(c)),
      'deploy_reader':sim(d,'lambda:UpdateFunctionCode',fn('agent-platform-ducklake-telemetry-reader')),
      'dev_url':sim('PlatformDev','lambda:InvokeFunctionUrl',fn(c)),'dev_data':sim('PlatformDev','s3:GetObject',s3('ducklake-telemetry/x')),
      'exec_data':sim(c,'s3:GetObject',s3('ducklake-telemetry/x'))};
      want={'cideploy_content':'explicitDeny','cideploy_reader':'allowed','deploy_code':'allowed','deploy_config':'allowed','deploy_reader':'implicitDeny','dev_url':'allowed','dev_data':'explicitDeny','exec_data':'allowed'};
      print(json.dumps(got, sort_keys=True)); ok=got==want; print('LIVE SIMULATE OK' if ok else 'LIVE SIMULATE STOP'); sys.exit(0 if ok else 1)"
    expected: >-
      The fixture run exits 0 with zero mismatches, then one line of decisions only (no ARN or account id) and LIVE
      SIMULATE OK: CI deploy denied on the content function and allowed on the telemetry reader; the deploy role allowed
      code and configuration on the content function and implicitly denied elsewhere; PlatformDev allowed the URL and
      explicitly denied the telemetry data; the execution role allowed the data.
    fix_if: A by_design denial allowed is a grant leak -- stop and report to the operator. A new grant denied means the boundary ceiling or scope is wrong; fix in HCL through the same gate.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      The operator creates the environment (VP-adjacent operator step) and, after the reader-concurrency apply is green,
      approves the first deploy run. Its recorded digest equals a local rebuild of the same commit.
    command: >-
      RUN=$(curl -s "https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?branch=main&status=success&per_page=1" | jq -r '.workflow_runs[0].id')
      && SHA=$(curl -s "https://api.github.com/repos/otl-labs/ontheloop/actions/runs/$RUN" | jq -r .head_sha) && W="${TMPDIR:-/tmp}/content-rebuild"
      && git worktree add --detach "$W" "$SHA" > /dev/null && LOCAL=$(cd "$W" && bin/venv-python -m scripts.build_lambda --content-reader-only | sed -n 's/^CONTENT_READER_SHA256 //p')
      ; git worktree remove --force "$W"; NAME=$(curl -s "https://api.github.com/repos/otl-labs/ontheloop/actions/runs/$RUN/artifacts" | jq -r '.artifacts[].name' | grep '^telemetry-content-')
      && test "$NAME" = "telemetry-content-$LOCAL" && echo "DIGEST MATCH"
    expected: DIGEST MATCH. The run's deploy job is green, which means its own live CodeSha256 check passed, and the local rebuild equals the digest the build recorded.
    fix_if: >-
      No successful run -- the environment is missing, the run waits for the operator, or the build reported
      TELEMETRY_PRODUCTION_HOLD (the deploy job is skipped until the pending column is added; then re-run the workflow
      from main with workflow_dispatch). A mismatch -- the CI build is not the commit's bytes; stop, keep the function as
      is, and report to the operator.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: rec-4696's acceptance and a live masked golden read-back as PlatformDev.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_content_reader_iam.py -q &&
      bin/venv-python -c "from scripts.telemetry_capture.read_route import content_reader; v=sorted(content_reader('agent_platform').describe()); print('CONTENT_VERBS', v); assert v == ['session_transcript_masked', 'transcript_row_masked']" &&
      bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates --profile agent_platform --no-alarms
      --assert-zero-mismatches --content-leg
    expected: >-
      exit 0. CONTENT_VERBS names exactly the two masked verbs (PlatformDev reaches the URL), and the golden run reports
      every replayed tree matched on the event and content legs, counts only.
    fix_if: A content mismatch -- read the leg's tree name and the access-log counts; fix forward through the gated channel. AccessDenied -- the PlatformDev grant did not apply; re-check step 11.
    hermetic: false
    graduation: not-applicable
