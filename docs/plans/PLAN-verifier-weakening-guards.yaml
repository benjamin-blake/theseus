execution_steps:
- Extend scripts/checks/_marker_guard.py ADDITIVELY -- StateEntry, the three optional RegistrySpec fields,
  check_state_diff, and exactly two new __all__ names. Do not touch check_diff, check_present_markers
  or MarkerEntry. Update docs/contracts/marker-grammar.yaml in the SAME edit (exports, the tier-demotion-approved
  token row, the state_diff_mechanics section, an amendment_log entry) -- validate_marker_grammar_exports
  fails the PR on any drift between the two.
- Create scripts/checks/verification/validate_tier_demotion_markers.py. Derive the manifest path set from
  head-disk UNION base-ls-tree; read base text through ONE batched git cat-file closure; build one RegistrySpec
  per manifest path sharing the token, hooks and extractor. Implement TierState, weakened (pre lost /
  full_segment lost / coverage-superset violated) and gates_deletion (base was sequenced). Run check_state_diff
  AND check_present_markers. Declare examined()/skipped() on every reachable exit path. Take and forward
  `root` through every git probe.
