acceptance_criteria:
- 'A synthetic PR flipping ONE unpinned manifest Entry from pre=True to pre=False fails `bin/venv-python
  -m scripts.validate --pre` with no marker; adding a `# tier-demotion-approved: dec-NNN <reason>` marker
  whose cited Decision body contains that check''s own NAME makes it pass. This is LSA-01''s acceptance
  clause for TIER DEMOTION only. The finding''s mirror-test-deletion arm ("with a Decision-cited marker
  both pass") is KNOWINGLY NOT IMPLEMENTED: it is unsatisfiable against S5''s exceptionless red-case floor,
  and mark-then-drop reconciles the two -- see context.'
- Every one of the seven tightening moves -- promotion, full_segment added, glob widening, a new Entry,
  a marker removed with no state change, an already-unsequenced Entry deleted, and a glob re-pointed across
  a same-PR directory rename -- passes UNMARKED. If any tightening move needs a marker the mechanism is
  dead, so this is a first-class acceptance criterion and not a corollary.
- 'The protected set is derived, never enumerated: PROMOTED_GATED, PROMOTED_UNGATED, NEWLY_PRE_DOMAINS
  and _PRE_ONLY_CHECKS do not exist anywhere in the repo outside audits/ and docs/plans/, no replacement
  roster or committed base snapshot is introduced, and the gate''s own module and mirror test contain
  NO LIVE CHECK NAME OTHER THAN THE GATE''S OWN as a literal -- with that one self-reference DERIVED in
  the assertion (fn.__name__ / the registered name for this module), never spelled out in the test. The
  stronger "no name at all" form is provably unsatisfiable and must not be substituted: @registry.register
  forces exactly one self-hit in every check module and its mirror, measured on four existing pairs.'
- 'The gate cannot be demoted out of its own way: pre_sequence() raises when its Entry is absent AND when
  its Entry carries pre_globs; full_sequence() raises when its Entry is absent. AND the raise''s carrier
  constant is closed against itself -- registry._WEAKENING_GATE''s VALUE is pinned by derivation from the
  mechanism (the callable that owns the tier-demotion-approved token), so a PR that re-points it at another
  entry fails even while deleting the gate''s own Entry in the same diff.'
- Removing a still-sequenced Entry fails with NO marker able to rescue it -- proven by a known-bad fixture
  that ships a valid, authorized marker in both plausible placements and still fails, not by by-construction
  reasoning -- while removing an already-unsequenced Entry passes; mark-then-drop across two PRs is the
  only retirement path.
- 'A pre_globs edit is judged by MEASURED fnmatch coverage over `git ls-files`, not by None-vs-tuple:
  pre_globs=None -> ("never/**",) fails as a demotion. The superset is measured over the HEAD file list
  -- one `git ls-files` at head, which is also what the cost claim assumes -- so a glob re-pointed across
  a same-PR rename passes unmarked; measuring over the BASE list would demand a marker on a pure rename.'
- The gate is clean on the live fleet on day one with NO grandfather constant of any shape, and its `_common.run`
  call count is identical for a 2-domain and a 17-domain fixture.
- 'The nine incumbent RegistrySpec bindings behave identically: check_diff, check_present_markers and
  MarkerEntry are unchanged, and tests/checks/test__marker_guard.py plus the EIGHT consumer mirror tests
  -- tests/checks/{typing/test_mypy_baseline, structural/test_budget_raises, ci_guards/test__workflow_shell_bodies,
  ci_guards/test_validate_composite_action_shell_bodies, misc/test_coverage_baseline, prose/test_prose_budget_raises,
  contracts/test__ratchet, sloc/test_validate_sloc_budget_raises}.py, all eight measured present at cd765e9c
  -- pass without edits to their existing assertions. "Five" was the stale audit figure this plan''s own
  context row already corrects to nine bindings across eight modules; the criterion is about the DIFF,
  so VP step 8 asserts it with `git diff` and not only with a passing run.'
- Decision NNN exists in docs/DECISIONS.md under the per-entry 6144-byte cap with a conformant metadata
  envelope carrying `significance` and NO `amends`/`supersedes` key, and its reversal conditions parse
  as a monitored `yaml reversal-conditions` stanza with five conditions. validate_supersession_annotations
  -- which is in --pre, glob-gated on docs/DECISIONS.md, and therefore selects on this exact diff -- stays
  green with no new waiver row, because the entry creates no supersession edge by either route its
  _extract_edges reads (the envelope key, and the textual "amends Decision N" form _EDGE_RE matches).
- docs/contracts/implement-scope-boundary.yaml declares check-fleet tier membership as a MECHANICAL coverage
  row naming validate_tier_demotion_markers, and the map still carries exactly one residual row (rec-3357,
  untouched and not claimed closed).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Eleven known-bad fixtures plus the positive control -- the discrimination proof. Each fixture
    is a synthetic base/head manifest pair under an injected root; the eleven must produce a violation
    and the control must not. The eleventh is the marked-deletion case (a still-sequenced Entry removed
    WITH a valid, authorized, reason-bearing marker in both plausible placements) -- it is what turns
    acceptance criterion 5's "no marker able to rescue it" from by-construction reasoning into a fixture.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestKnownBadFixtures
    tests/checks/verification/test_validate_tier_demotion_markers.py::TestPositiveControl -q
  expected: Exit 0; 12 tests pass. Every known-bad case yields a non-empty violation list naming the offending
    check by name; the positive control yields an empty list.
  fix_if: A known-bad fixture passes clean -- the gate does not discriminate on that axis and the corresponding
    weakening still merges silently. Never relax the fixture; fix the rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-discriminates-known-bad
- step: 2
  phase: pre-deploy
  action: 'Tightening is provably free. Seven known-good fixtures -- promotion, full_segment added, glob
    widening, new Entry, marker removed with no state change, unsequenced Entry deleted, and a glob re-pointed
    across a same-PR directory rename -- each UNMARKED, each must produce zero violations. The seventh
    is what pins the coverage superset to the HEAD file list: under a BASE-list reading it is the one
    case that inverts and demands a marker on a pure rename.'
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestTighteningIsFree
    -q
  expected: Exit 0; 7 tests pass with an empty violation list for every tightening move, and none of the
    seven fixtures carries a marker.
  fix_if: Any tightening move demands a marker. This is the ritual failure mode -- if authors learn to
    paste markers on tightening moves the mechanism is dead. Fix the direction rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-tightening-free
- step: 3
  phase: pre-deploy
  action: The fixed point -- demote the gate itself, AND close the carrier constant against its own value.
    Patch registry._ALL_ENTRIES to (a) drop the gate's Entry and (b) re-add it with pre_globs set, and
    assert pre_sequence() raises in both; assert full_sequence() raises for (a); assert the unpatched
    live sequence carries the gate ungated. THEN the value pin -- assert `resolve(registry._WEAKENING_GATE)`
    is the callable defined in the module that owns the `tier-demotion-approved` token constant, derived
    from the mechanism rather than compared to a literal, so re-pointing the constant is caught.
  command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py::TestWeakeningGateFixedPoint
    -q
  expected: Exit 0. WeakeningGateError raised on both patched shapes; the live pre_sequence() Step for
    the gate has pre_globs None; the resolved _WEAKENING_GATE callable is the token-owning module's.
  fix_if: pre_sequence() returns normally with the gate absent or gated -- the PR that demotes the guard
    is the PR under which the guard does not run, and the whole mechanism is bypassable by one edit. The
    value pin missing or written as a string comparison -- then a PR that re-points _WEAKENING_GATE at
    any of the 59 ungated pre entries and deletes the gate's Entry passes every other assertion in this
    step, which is the same-PR-editable-string failure this plan exists to eliminate.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-gate-fixed-point-raise
- step: 4
  phase: pre-deploy
  action: Clean on day one with no grandfather. Run the registered check against the real tree and the
    real base ref, assert it appends nothing to `failed`, assert it declared examined(n) with n equal
    to the live manifest-entry count, and assert by AST that the module defines no frozenset/set/tuple/list
    constant of check names (any grandfather shape).
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestCleanOnLiveFleet
    -q
  expected: Exit 0. Zero violations against the live fleet; the declared examined count equals len(registry._ALL_ENTRIES);
    no grandfather-shaped constant found.
  fix_if: A live entry violates -- the fleet is not clean and the plan must fix the entry (the two glob
    widenings in scope rows 5/6 are the known cases), NEVER add a grandfather hook. Decision 165's own
    reversal condition is grandfather-hook growth.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-clean-on-live-fleet
- step: 5
  phase: pre-deploy
  action: No roster returns. Grep the whole repo, excluding audits/ and docs/plans/ (which quote the names
    as historical evidence), for the four retired constants and for any newly introduced check-name roster
    in the gate's own tree.
  command: bin/venv-python -c "import subprocess,sys; out=subprocess.run(['git','grep','-n','-E','PROMOTED_GATED|PROMOTED_UNGATED|NEWLY_PRE_DOMAINS|_PRE_ONLY_CHECKS','--','.',
    ':(exclude)audits', ':(exclude)docs/plans'],capture_output=True,text=True); print(out.stdout); sys.exit(0
    if out.stdout.strip()=='' else 1)"
  expected: Exit 0 with empty output -- the four constants exist nowhere outside the audit record and
    the plan corpus.
  fix_if: A hit remains. Either the retirement is incomplete, or a replacement roster was introduced --
    both defeat the Decision's point 1 (derive, do not enumerate).
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-roster-constants-retired
- step: 6
  phase: pre-deploy
  action: Anti-ritual pins. Assert that no name in registry._ALL_ENTRIES OTHER THAN THE GATE'S OWN appears
    as a string or identifier literal in the gate module or in its mirror test, with the gate's own name
    DERIVED inside the assertion (fn.__name__, or the name the registry recorded for this module) and
    never restated as a literal; assert the base is read via git with no committed snapshot file consulted;
    assert the _common.run call count is IDENTICAL for a 2-domain and a 17-domain synthetic fixture.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestAntiRitualPins
    -q
  expected: Exit 0. Exactly the gate's own name is found in each file and no other live check name; the
    run-count equality holds, proving the batched base read does not fan out per domain.
  fix_if: A FOREIGN live check name appears in the guard or its tests -- that is a roster in disguise and
    fails review by construction. If the assertion is instead written to admit NO name at all it is unsatisfiable
    and the implementer will improvise a self-exclusion -- measured on four existing check/mirror pairs,
    each scores exactly one unavoidable self-hit because @registry.register must name its own check and
    the mirror imports by name; use the derived self-name form above, never a hand-written exclusion list
    (which would be the roster this plan retires, in one line). A domain-proportional run count means the
    base read regressed to one subprocess per manifest.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-anti-ritual-pins
- step: 7
  phase: pre-deploy
  action: The re-pointed survivors, over the derived population. Every gated pre entry's globs match its
    own defining module (51 entries at head, not the 22 the roster covered), and every domain contributing
    a pre entry is declared in _PRE_DOMAIN_ORDER.
  command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py::TestDerivedGateShape -q
  expected: Exit 0 over the full derived population. RED before the scope-row-5/6 glob widenings (validate_no_cross_test_imports
    and validate_terraform_tag_charset both fail the self-coverage assertion at head), green after.
  fix_if: A third self-coverage miss appears -- widen that entry's globs (a tightening, free); never narrow
    the assertion back to a roster subset.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: This step re-points an EXISTING property at a derived population rather than
    installing a new one; its standing enforcement is the test itself, which the affected-set channel
    selects on every scripts/checks/** diff. A shard would register a check_id duplicating that test's
    own registry coverage while adding no red case this plan's step 1 does not already carry.
- step: 8
  phase: pre-deploy
  action: _marker_guard regression + the new sibling's own seams, over ALL EIGHT consumer mirror modules
    rather than the guard's own test alone. The nine incumbent bindings must round-trip through check_diff
    unchanged, and check_state_diff must SKIP loudly (never affirmatively pass) on an unreachable base,
    walk base keys when the head file is absent, and refuse a stale marker. The eight selectors are the
    measured consumer set, not the audit's stale "five"; step 15 carries the never-weaken DIFF half, which
    a passing run cannot establish.
  command: bin/venv-python -m pytest tests/checks/test__marker_guard.py tests/checks/typing/test_mypy_baseline.py
    tests/checks/structural/test_budget_raises.py tests/checks/ci_guards/test__workflow_shell_bodies.py
    tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/misc/test_coverage_baseline.py
    tests/checks/prose/test_prose_budget_raises.py tests/checks/contracts/test__ratchet.py tests/checks/sloc/test_validate_sloc_budget_raises.py
    -q
  expected: Exit 0. Every pre-existing assertion in all nine files passes without edits; TestCheckStateDiff
    passes -- red before the scope-row-1 change (check_state_diff does not exist), green after.
  fix_if: An incumbent assertion needed editing to go green -- that is a CONTENT-invariant weakening (Decision
    181/59). Stop, revert, and route it to a rec instead. If a consumer mirror fails, the "byte-identical
    behaviour for the nine incumbent bindings" premise of scope row 1 is broken and the additive-only
    design has regressed -- never fix it in the consumer's test.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: check_state_diff's discrimination is proven end-to-end by step 1's eleven known-bad
    fixtures, which ARE graduated; a second shard over the same mechanism's unit seams would register
    duplicate coverage of one guard, and the regression half asserts the ABSENCE of change in nine incumbent
    suites, which has no red case of its own to admit.
- step: 9
  phase: pre-deploy
  action: 'The ci_rca_taxonomy companion surface, through its own registered evaluator rather than by
    reading the YAML. validate_ci_rca_taxonomy check 1b is a two-way census: every registered check must
    carry a function_to_category row.'
  command: bin/venv-python -c "from scripts.checks.registry import resolve; f=[]; resolve('validate_ci_rca_taxonomy')(f);
    assert not f, f"
  expected: Exit 0. The new gate has a code_regression row and the census closes both ways.
  fix_if: AssertionError naming validate_tier_demotion_markers -- the row is missing or misnamed. Add
    the row; never widen the census to tolerate an absent check.
  hermetic: true
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: 'The two contract edits, each through its own registered evaluator: validate_marker_grammar_exports
    asserts binding_surface.exports equals _marker_guard''s __all__, and validate_contract_drift requires
    an amendment_log entry on any content change.'
  command: bin/venv-python -c "from scripts.checks.registry import resolve; f=[]; [resolve(n)(f) for n
    in ('validate_marker_grammar_exports','validate_contract_drift')]; assert not f, f"
  expected: Exit 0. exports equals the grown __all__ (StateEntry, check_state_diff added); both contract
    edits carry a change_class amendment_log entry.
  fix_if: exports inequality -- docs/contracts/marker-grammar.yaml was not updated alongside __all__,
    which is the drift-by-design failure the Class D evaluator exists to catch. contract_drift -- an amendment_log
    entry is missing on one of the two contracts.
  hermetic: true
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: 'Decision 181 point 2''s declare-your-coverage obligation: the CONTENT enforcement-coverage
    map names check-fleet tier membership as MECHANICAL with an enforcer, and still carries exactly one
    residual row (rec-3357, untouched).'
  command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py -q
  expected: Exit 0. The single-residual pin holds, every mechanical row has an enforced_by, and the new
    row names validate_tier_demotion_markers.
  fix_if: More than one residual row -- the new row was written with the wrong status. A mechanical row
    with no enforced_by -- the enforcer name is missing. Never resolve either by relaxing the pin; it
    is the teeth of the declare-your-coverage discipline.
  hermetic: true
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: The gate under real dispatch, inside the real fast tier, against the real budget. The new check
    is UNGATED so it runs on every diff; its cost lands in Decision 182's unwaivable non-test half.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0. validate_tier_demotion_markers appears in the dispatched sequence on a diff that touches
    no manifest (proving it is ungated), reports an enforced (not vacuous, not undeclared) Decision 170
    outcome, and the fast-tier budget assertion passes.
  fix_if: Budget breach attributable to this check -- move the coverage-superset leg (the git ls-files
    half) to the full tier per the Decision's reversal condition c4, never widen the budget. A vacuous
    or undeclared outcome means the examined()/skipped() declaration does not cover every exit path.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: pre-deploy
  action: Pre-handoff full tier, required by handoff_policy.full_validation_required_before_commit and
    by Decision 163 point 2. Runs WITHOUT --pre so the full-only population, the graduation differential
    and the post-merge-shaped legs all execute.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with a completed run (not a timeout). validate_verification_registry admits the six
    new shards through the differential-admission gate; validate_graduation_completeness finds every pre-deploy
