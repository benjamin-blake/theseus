constraints:
- LEG (a) ONLY. LSA-01's leg (b) (re-point the same-PR differential at scripts/checks/** co-edits) and
  leg (c) (retire validate_verifier_same_pr_guard's dead scan) are DEFERRED TO RECS and must not be built
  here. Do not touch scripts/checks/verification/validate_verifier_same_pr_guard.py or scripts/verifiers/**.
- NO MARKER ARM FOR DELETION OF ANY KIND, and no marker path into S5's validate_red_case_floor. If implementing
  the tier-demotion marker makes a deletion escape look easy, that is the divergence from LSA-01's literal
  acceptance text this plan declares deliberately -- stop, do not build it, and do not weaken S5's floor
  to make the audit's wording true.
- 'NO NEW DECLARATION SURFACE. Every change extends a live mechanism. Specifically forbidden: docs/contracts/loop-spec.yaml
  or any loop-spec grammar evaluator, a new loop-enumeration check, a new contract FILE of any kind, and
  any committed roster or base-state snapshot. If the implementation finds itself proposing one, STOP
  and return it to the overseer.'
- NO ROSTER, IN ANY DISGUISE. The gate's module and its mirror test may not contain a live check name
  as a literal (VP step 6 asserts this mechanically). The one permitted named constant is registry._WEAKENING_GATE,
  which names the MECHANISM.
- DELETION HAS NO MARKER ESCAPE. Do not add one, however convenient it looks when retiring a check. Retirement
  is mark-then-drop across two PRs.
- The nine incumbent RegistrySpec bindings are NEVER-WEAKEN territory. No existing assertion in tests/checks/test__marker_guard.py
  or in the five consumer mirror tests may be edited to go green (Decision 181 CONTENT invariant / Decision
  59). Route any such pressure to a rec.
- 'Decision 128: decompose, never raise. No config/sloc_budgets.yaml edit is in scope; every touched file
  has ample headroom under the 500 default.'
- THE DECISION NUMBER IS NOT CHOSEN IN THIS PLAN. Re-check the current max `## Decision NNN:` header at
  execution time and use the next free number; 184/185/186 are taken on origin/main and a sibling slice
  in this run lost a drafted number to two concurrent slices. Landing the Decision is gated on explicit
  human approval relayed by the overseer.
- Portal writes ONLY via scripts.ops_data_portal file_rec/update_rec (call get_rec_write_guidance() first,
  Decision 66). Never edit logs/*.jsonl.
- No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
context:
- 'S5 COUPLING (1/3) -- BLOCKING DEPENDENCY. Land AFTER PLAN-red-case-floor (S5, PR #1135). S5 adds validate_placement
  to _CONCERN_SPLIT_TEST_PACKAGES and appends validate_red_case_floor to the same verification/_manifest.py
  this plan appends to. Rebase; do not race; do not double-build the validate_placement cleanup -- discharged
  upstream.'
- 'S5 COUPLING (2/3) -- ORDERING, BOTH WAYS. Whichever lands SECOND must ship a mirror test with a real
  red case or --pre reds: S5''s floor derives from registry._ALL_ENTRIES, so this plan''s new Entry joins
  it at once and its mirror test is graded by it. S5''s VP step 2 (failed == [], derived count >= 123)
  is the detector. This plan''s ten known-bad fixtures satisfy it by construction -- never soften them
  to a passing-path corpus.'
- 'S5 COUPLING (3/3) -- LEG (a) SUB-PART 2 IS SUBSUMED AND DELIBERATELY NOT BUILT. S5''s floor already
  asserts mirror presence over the same derived population and additionally requires a red case, so it
  is strictly stronger on the existence axis. Both candidate residues were tested and are covered: a map-breaking
  rename leaves map_source_to_test computing a non-existent path; for a concern-split package, a rename
  leaving other test_*.py behind fails the red-case leg exactly when the moved module held the red case,
  and where it does not an existence-only guard would pass too. A duplicate would be NS6 second-surface
  drift. If S5 is abandoned this half is unowned -- surface it, never improvise it here.'
- 'KNOWING DIVERGENCE FROM LSA-01''S LITERAL ACCEPTANCE TEXT, declared not silently resolved. The finding
  says a mirror-test deletion must fail --pre "and with a Decision-cited marker both pass". That arm is
  unsatisfiable once S5 lands: its floor is exceptionless by design (Decision 163 point 1). The ratified
  settled design already resolves it in S5''s favour -- MARK-THEN-DROP means no registered Entry ever
  sits in _ALL_ENTRIES without a mirror (PR1 demotes with a marker, both present; PR2 drops Entry and
  mirror together, floor silent). So this plan implements the marker arm for TIER DEMOTION only and NO
  marker arm for any deletion. Found by S5''s plan-critique across the two plans; neither slice''s own
  gates would see it.'
- 'RE-MEASURED AT HEAD (dbad731a), superseding the audit''s and consult''s figures: 123 entries, 110 pre,
  118 full, 12 full-only, 4 pre-only, 1 unsequenced; 59 pre ungated, 51 gated. The four rosters pin 27
  check names + 2 domains, so 83 of 110 pre entries are unpinned, and _PRE_ONLY_CHECKS already pins 3
  of 4 live pre-only entries -- the roster failure mode in miniature. _marker_guard.py carries NINE RegistrySpec
  sites across EIGHT modules, 18 modules reference it (the audit''s "five marker guards" is stale). Day-one
  cleanup is exactly ONE unresolvable mirror (validate_placement, S5''s) and TWO self-coverage misses
  (scope rows 5/6) -- hence no grandfather hook.'
- 'AUDIT EVIDENCE CORRECTION (filed as the leg-c rec; OUT OF SCOPE): LSA-01''s "REGISTRY = [], empty"
