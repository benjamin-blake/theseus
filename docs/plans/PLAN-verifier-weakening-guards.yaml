- file: scripts/checks/verification/validate_tier_demotion_markers.py
  action: Create
  purpose: 'The gate. Builds its RegistrySpec list by DERIVATION, never a roster: the manifest path set
    is the union of head (`scripts/checks/*/_manifest.py` on disk) and base (one `git ls-tree` against
    the base ref), so deleting a whole domain manifest cannot hide its entries. Base text arrives through
    ONE batched `git cat-file --batch` closure passed as check_state_diff''s base_reader, so the subprocess
    count does not fan out with the domain count. `TierState` (frozen dataclass: pre, full_segment, pre_globs)
    carries the strength relation; `weakened` fires on pre True-> False, full_segment set->None, and a
    pre_globs COVERAGE-SUPERSET violation measured by fnmatch over `git ls-files` -- `pre_globs=("never/**",)`
    is therefore a demotion, not a re-gating, and None (ungated) is maximal coverage. `gates_deletion`
    fires iff the base entry was sequenced at all, so deleting an already-unsequenced entry is free and
    mark-then-drop works across two PRs. Authorization is CHECK-NAME level with no mention_candidates
    override: _expand_ancestor_ candidates on a bare name yields only the name itself, so a Decision naming
    `scripts/checks` can never authorize. Token `tier-demotion-approved`, require_reason=True. Runs BOTH
    check_state_diff and check_present_markers (Decision 165 point 2''s retroactive leg). Declares examined(len(union_of_keys),
    unit="manifest_entries") on the enforcing path and skipped(reason) -- never a silent pass -- when
    the base ref is unreachable (Decision 170; the shape rec-3086 faults the incumbents for, which this
    module must not import). Every git probe takes and forwards `root` (Decision 159 cl.1 / validate_root_scoped_diff_base).'
