    existing spec is unchanged -- `state_extractor`, `weakened(base, head) -> bool`, `gates_deletion(base)
    -> bool` (the two semantic hooks the settled design names); (3) a sibling `check_state_diff(spec,
    base_reader=None)` that reuses default_base_reader / load_decision_bodies / authorization_failure
