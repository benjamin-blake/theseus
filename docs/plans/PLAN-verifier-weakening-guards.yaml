slug: verifier-weakening-guards
intent: 'Close audit finding LSA-01 leg (a): make a tier demotion on the live check fleet -- losing `pre`,
  losing `full_segment`, or narrowing `pre_globs` -- a gated, Decision-authorized move instead of a one-character
  flag flip that merges silently. The protected set is DERIVED from the git base ref, never enumerated,
  so the four same-PR-editable roster constants that pinned 27 of 110 pre entries are retired rather than
  frozen.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verifier-weakening-guards.yaml
phase: Platform hardening -- verifier change control. Slice S3 of the loop-spec-adoption overseer run,
  driving audit finding LSA-01 (audits/loop-spec-adoption-4d8bac4a.yaml, P5-amended) LEG (a) ONLY. Names
  NO tier_item and adds NO roadmap row (soft-warn exception category ad_hoc_rec), so the Tier Item Freshness
  Gate is skipped; the audit finding is the forward-intent carrier and the deferred legs ride recs.
scope:
