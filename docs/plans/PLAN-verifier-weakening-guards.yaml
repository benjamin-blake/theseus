    pass and a concurrent slice landing a higher number silently re-targets it (Decision 55 shape: a
    missing oracle and a passing oracle must not look alike). With the number pinned the step is genuinely
    RED before insertion (NameError until substituted, then no such entry to measure) and GREEN after.'
  command: bin/venv-python -c "import sys; sys.path.insert(0,'.'); from scripts.decisions_md import iter_decision_sections;
