    b=[x for m,x in iter_decision_sections(c) if int(m.group(1))==n]; assert len(b)==1, len(b); s=len(b[0].encode('utf-8'));
    assert s<=6144, s; r=[x for x in evaluate() if x.decision_id==n]; assert len(r)==1 and r[0].state!='MALFORMED',
    r; assert len(r[0].conditions)==5, len(r[0].conditions); print('dec',n,'bytes',s)"
  expected: Exit 0 printing the assigned number and a byte count at or under 6144 (6100 as drafted and
    measured spliced into the live corpus under a real 3-digit number, 44 bytes of headroom; three-digit
