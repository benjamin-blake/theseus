  fix_if: Over cap -- route evidence out to this plan's context or to the contract, exactly as the draft
    already did to get from 7015 to 6100. NEVER split the entry (Decision 167(b)'s named evasion) and
    never raise the cap. MALFORMED -- the stanza needs decision/review_by/on_trigger/ conditions at top
    level and id/kind/description per condition. NameError on `NNN` -- the substitution step was skipped;
    substitute, never revert to a highest-numbered-entry oracle.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts a one-off property of this plan's own Decision entry, whose number
