schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: verifier-weakening-guards
intent: 'Close audit finding LSA-01 leg (a): make a tier demotion on the live check fleet -- losing `pre`,
  losing `full_segment`, or narrowing `pre_globs` -- a gated, Decision-authorized move instead of a one-character
  flag flip that merges silently. The protected set is DERIVED from the git base ref, never enumerated,
  so the four same-PR-editable roster constants that pinned 27 of 110 pre entries are retired rather than
  frozen.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verifier-weakening-guards.yaml
phase: Platform hardening -- verifier change control. Slice S3 of the loop-spec-adoption overseer run,
  driving audit finding LSA-01 (audits/loop-spec-adoption-4d8bac4a.yaml, P5-amended) LEG (a) ONLY. Names
  NO tier_item and adds NO roadmap row (soft-warn exception category ad_hoc_rec), so the Tier Item Freshness
  Gate is skipped; the audit finding is the forward-intent carrier and the deferred legs ride recs.
scope:
- file: scripts/checks/_marker_guard.py
  action: Modify
  purpose: 'ADDITIVE ONLY -- the nine live RegistrySpec bindings and check_diff/check_present_markers/
    MarkerEntry keep byte-identical behaviour, because those bindings gate the load-bearing SLOC, prose,
    coverage, mypy, composite-R3 and contract-population ratchets and this plan must not put them at regression
    risk. Adds (1) a `StateEntry` NamedTuple (state: object, marker, reason) for a registry whose value
    is a STRENGTH, not a number; (2) three optional RegistrySpec fields, all defaulting to None so every
    existing spec is unchanged -- `state_extractor`, `weakened(base, head) -> bool`, `gates_deletion(base)
    -> bool` (the two semantic hooks the settled design names); (3) a sibling `check_state_diff(spec,
    base_reader=None)` that reuses default_base_reader / load_decision_bodies / authorization_failure
    and closes, FOR THIS PATH ONLY, the two check_diff holes the design named -- deleted keys are walked,
    and an absent head file reads as "every base entry deleted" instead of "nothing to check"; (4) `__all__`
    grows by exactly "StateEntry" and "check_state_diff". A marker on the head entry is required only
    when `weakened()` says the transition is a weakening AND the marker differs from the base entry''s
    marker (a stale marker never re-authorizes -- this leg is built immune to the rec-3027 class rather
    than inheriting it). NO marker path exists on the deletion branch by construction: a removed entry
    has no head line to carry one. 325 SLOC today; the additions land near 385, inside the 500 default
    with no budget entry and no raise (Decision 128).'
- file: scripts/checks/verification/validate_tier_demotion_markers.py
  action: Create
  purpose: 'The gate. Builds its RegistrySpec list by DERIVATION, never a roster: the manifest path set
    is the union of head (`scripts/checks/*/_manifest.py` on disk) and base (one `git ls-tree` against
    the base ref), so deleting a whole domain manifest cannot hide its entries. Base text arrives through
    ONE batched `git cat-file --batch` closure passed as check_state_diff''s base_reader, so the subprocess
    count does not fan out with the domain count. `TierState` (frozen dataclass: pre, full_segment, pre_globs)
    carries the strength relation; `weakened` fires on pre True-> False, full_segment set->None, and a
    pre_globs COVERAGE-SUPERSET violation measured by fnmatch over `git ls-files` -- `pre_globs=("never/**",)`
    is therefore a demotion, not a re-gating, and None (ungated) is maximal coverage. `gates_deletion`
    fires iff the base entry was sequenced at all, so deleting an already-unsequenced entry is free and
    mark-then-drop works across two PRs. Authorization is CHECK-NAME level with no mention_candidates
    override: _expand_ancestor_ candidates on a bare name yields only the name itself, so a Decision naming
    `scripts/checks` can never authorize. Token `tier-demotion-approved`, require_reason=True. Runs BOTH
    check_state_diff and check_present_markers (Decision 165 point 2''s retroactive leg). Declares examined(len(union_of_keys),
    unit="manifest_entries") on the enforcing path and skipped(reason) -- never a silent pass -- when
    the base ref is unreachable (Decision 170; the shape rec-3086 faults the incumbents for, which this
    module must not import). Every git probe takes and forwards `root` (Decision 159 cl.1 / validate_root_scoped_diff_base).'
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: 'One Entry literal appended to ENTRIES -- name/module/attr "validate_tier_demotion_markers",
    `pre=True` with `pre_globs=None` (UNGATED, and this is forced by the design rather than chosen: the
    fixed-point raise in registry.pre_sequence() refuses a glob-gated gate, because a gated gate is one
    narrow-the-globs edit away from not running on the diff that demotes it), and full_segment="full_after_lint"
    -- the segment nine of the eleven verification-domain entries already use. Bare string literals, two
    separate module/attr fields, per docs/contracts/check-manifest.yaml; the grammar is unchanged, so
    validate_check_manifests enforces it as-is and no contract edit is owed here.'
- file: scripts/checks/registry.py
  action: Modify
  purpose: 'Closes the self-reference hole the settled design named as its sharpest structural finding:
    without this, the PR that demotes the guard is the PR under which the guard does not run. Adds `_WEAKENING_GATE:
    str` (one constant naming the MECHANISM, exactly the shape of the existing `_PRE_DOMAIN_ORDER` --
    it names the gate, never the protected set, so it is not a roster), a `WeakeningGateError(RuntimeError)`,
    and one assertion helper called at the END of pre_sequence() and full_sequence(): raise when the gate''s
    own Step is absent from the derived sequence, and in pre_sequence() additionally when its Step carries
    pre_globs. Raised from an explicit call, never at import (AGENTS.md). The module docstring''s canonical
    SEVEN-surfaces enumeration gains one clause on surface (3) recording that an Entry''s tier fields
    are now direction-gated and naming the enforcer. 319 SLOC today, ~+24.'
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: 'Day-one cleanliness, and a TIGHTENING so the new gate itself passes it free: widen validate_no_cross_test_imports''
    pre_globs from ("tests/**",) to add "scripts/checks/hygiene/validate_no_cross_test_imports.py". Measured
    at head: this is one of exactly two gated pre entries whose globs do not match their own defining
    module, so editing the rule alone currently skips the check that enforces it. Needed because scope
    row 11 re-points the self-coverage property from the 22-name PROMOTED_GATED roster to the full derived
    population, which surfaces both misses.'
- file: scripts/checks/iam_tf/_manifest.py
  action: Modify
  purpose: 'The second of the two measured self-coverage misses: widen validate_terraform_tag_charset''s
    pre_globs from ("terraform/**/*.tf",) to add "scripts/checks/iam_tf/validate_terraform_tag_charset.py".
    Same rationale as the hygiene row; a glob WIDENING is a tightening and is unmarked and free under
    the gate this plan installs, which is itself the first live demonstration that the direction rule
    points the right way.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'One `function_to_category` row, `validate_tier_demotion_markers: code_regression`, matching
    the category every sibling verification-domain check already carries. MANDATORY, not optional: validate_ci_rca_taxonomy
    check 1b fails the PR on any registered check absent from this map. No new category and no `failure_categories`
    edit.'
- file: docs/contracts/marker-grammar.yaml
  action: Modify
  purpose: 'The field-semantics home for what this plan adds (Decision 86/127 routing; "contract edits
    only, no new file"). Three edits: `binding_surface.exports` gains StateEntry and check_state_diff
    (validate_marker_grammar_exports asserts set equality against _marker_guard''s __all__, so this is
    not optional); a new `tier-demotion-approved` token row with direction: down, reason_required: true
    and used_by: [validate_tier_demotion_markers]; and a `state_diff_mechanics` section declaring the
    four semantics that are NOT in the numbered Decision -- the state_extractor/ weakened/gates_deletion
    hook contract, the entry-line-span marker placement rule (the _assert_has_waiver lineno..end_lineno
    idiom this reuses rather than inventing), the stale-marker rule (a marker identical to the base entry''s
    never re-authorizes), and the deletion branch''s structural absence of a marker path. Plus one `amendment_log`
    entry (change_class: field_add) -- validate_contract_drift fails a content change without one.'
- file: docs/contracts/implement-scope-boundary.yaml
  action: Modify
  purpose: 'Decision 181 point 2''s declare-your-coverage discipline, which binds this plan directly:
    a new `invariants.content.enforcement_coverage` row, surface "check-fleet tier membership (pre / full_segment
    / pre_globs narrowing on a manifest Entry)", status: mechanical, enforced_by: validate_tier_demotion_markers.
    Adding a MECHANICAL row is safe against tests/test_scope_boundary_contract.py''s pin, which requires
    exactly one non-mechanical row -- the rec-3357 residual row is untouched and this plan does NOT claim
    to close it (that residual is assertions weakened inside in-scope files, a different surface). Plus
    one `amendment_log` entry.'
- file: docs/DECISIONS.md
  action: Modify
  purpose: The numbered Decision, drafted verbatim in execution_steps below. THE NUMBER IS NOT CHOSEN
    HERE -- 184/185/186 are all taken on origin/main and a sibling slice in this same run had a drafted
    number taken by two concurrent slices; the draft says "Decision NNN" throughout and the implementing
    session substitutes the next free header number at execution time, after the human gate. Measured
    with validate_decisions_size.py's own method (iter_decision_sections block, len(block.encode("utf-8")),
    heading- and separator-inclusive) at 6064 bytes against the 6144-byte per-entry cap (Decision 167
    clause 3) -- 80 bytes of headroom. Three-digit number substitution is byte-neutral. Reversal conditions
    ride a fenced `yaml reversal-conditions` stanza verified to evaluate (state not-due, 5 conditions),
    never prose. It amends no prior live body (Decision 177).
- file: tests/checks/registry/test_sequences.py
  action: Modify
  purpose: 'The roster retirement, and the fixed-point pin. DELETES PROMOTED_GATED (22), PROMOTED_UNGATED
    (2), NEWLY_PRE_DOMAINS (2) and _PRE_ONLY_CHECKS (3) with the four test classes parameterized on them;
    all four are referenced nowhere else in the repo. Two of their properties are NOT subsumed by the
    new gate and survive RE-POINTED at the derived population, which is strictly stronger: `TestDerivedGateShape`
    asserts every gated pre entry''s globs match its own defining module (all 51 gated entries, not 22
    -- this is what surfaces the two scope-row-5/6 misses), and every domain contributing a pre entry
    is declared in _PRE_DOMAIN_ORDER (all of them, not 2). Adds `TestWeakeningGateFixedPoint`: the gate''s
    Entry is present and ungated in pre_sequence(), and a patched _ALL_ENTRIES that removes it (and one
    that re-adds it glob-gated) makes pre_sequence() raise -- the test that demotes the gate itself. The
    22-name roster deletion is a DECREASE and is unrestricted; OD-0..OD-6 and the membership-floor classes
    are untouched. Also records in the module docstring why no roster replaces them. 239 SLOC today, net
    negative.'
- file: tests/checks/test__marker_guard.py
  action: Modify
  purpose: '`TestCheckStateDiff` for the new sibling''s own seams, at the level the fixtures in scope
    row 13 cannot reach: base-unreachable returns [] AND prints a SKIP (never an affirmative pass line),
    an absent head file with gates_deletion set walks every base key instead of returning [], a spec with
    all three new fields None is refused rather than silently passing, and a stale marker (base marker
    == head marker) does not authorize. Also one regression class asserting the nine incumbent specs still
    round-trip through check_diff unchanged. 409 SLOC today.'
- file: tests/checks/verification/test_validate_tier_demotion_markers.py
  action: Create
  purpose: 'The gate''s mirror test and its known-bad corpus -- and, once S5 lands, it must itself satisfy
    validate_red_case_floor, so every fixture below is a genuine red case. TEN known-bad fixtures (unmarked
    pre True->False; unmarked full_segment set->None; unmarked pre_globs narrowing; unmarked pre_globs
    None->("never/**",) i.e. the glob bypass; a still-sequenced Entry removed; a whole domain _manifest.py
    deleted while holding sequenced entries; a marker citing a non-existent Decision; a marker whose Decision
    body mentions only `scripts/checks` -- the skeleton-key refusal; a marker with an empty reason; a
    stale marker identical to base''s), ONE positive control (a new, reason-bearing marker citing a Decision
    body that names the check by name -> passes), and SIX known-good tightening fixtures that must be
    free and unmarked (promotion; full_segment added; glob widening; a brand-new Entry; a marker removed
    with no state change; an already-unsequenced Entry deleted). Plus the anti-ritual pins: NO live check
    name appears as a literal in the guard module or in this file (asserted mechanically against registry._ALL_ENTRIES,
    so a name literal fails the build, not review), the base is read from git and no committed snapshot
    file is consulted, no grandfather-shaped constant exists in the module, and the _common.run call count
    is INDEPENDENT of domain count (equal for a 2-domain and a 17-domain fixture) -- the pin that keeps
    the batched base read from regressing into per-domain fan-out. All fixtures are synthetic manifests
    built in tmp_path with an injected root, following the live TestAuditorOnSyntheticRepo idiom.'
- file: config/agent/verification_registry/entries/tier-demotion-guard-discriminates-known-bad.yaml
  action: Create
  purpose: Graduation shard for VP step 1, authored by the implement session through scripts.verification_graduation
    per Decision 132/176 (one record per file). Declared here so the shard write sits inside this plan's
    LOCATION scope boundary (Decision 59).
- file: config/agent/verification_registry/entries/tier-demotion-guard-tightening-free.yaml
  action: Create
  purpose: Graduation shard for VP step 2 (tightening is provably free). Same authoring route and scope-boundary
    rationale.
- file: config/agent/verification_registry/entries/tier-demotion-gate-fixed-point-raise.yaml
  action: Create
  purpose: Graduation shard for VP step 3 (the fixed-point raise). Same authoring route and scope-boundary
    rationale.
- file: config/agent/verification_registry/entries/tier-demotion-guard-clean-on-live-fleet.yaml
  action: Create
  purpose: Graduation shard for VP step 4 (clean on day one, no grandfather). Same authoring route and
    scope-boundary rationale.
- file: config/agent/verification_registry/entries/tier-demotion-roster-constants-retired.yaml
  action: Create
  purpose: Graduation shard for VP step 5 (no roster constant returns). Same authoring route and scope-boundary
    rationale.
- file: config/agent/verification_registry/entries/tier-demotion-guard-anti-ritual-pins.yaml
  action: Create
  purpose: Graduation shard for VP step 6 (no live check name literal; subprocess count independent of
    domain count). Same authoring route and scope-boundary rationale.
bundled_recommendations: []
followon_recs:
- rec-3721
- rec-3722
infrastructure_dependencies: []
acceptance_criteria:
- 'A synthetic PR flipping ONE unpinned manifest Entry from pre=True to pre=False fails `bin/venv-python
  -m scripts.validate --pre` with no marker; adding a `# tier-demotion-approved: dec-NNN <reason>` marker
  whose cited Decision body contains that check''s own NAME makes it pass. This is LSA-01''s acceptance
  clause for TIER DEMOTION only. The finding''s mirror-test-deletion arm ("with a Decision-cited marker
  both pass") is KNOWINGLY NOT IMPLEMENTED: it is unsatisfiable against S5''s exceptionless red-case floor,
  and mark-then-drop reconciles the two -- see context.'
- Every one of the six tightening moves -- promotion, full_segment added, glob widening, a new Entry,
  a marker removed with no state change, an already-unsequenced Entry deleted -- passes UNMARKED. If any
  tightening move needs a marker the mechanism is dead, so this is a first-class acceptance criterion
  and not a corollary.
- 'The protected set is derived, never enumerated: PROMOTED_GATED, PROMOTED_UNGATED, NEWLY_PRE_DOMAINS
  and _PRE_ONLY_CHECKS do not exist anywhere in the repo outside audits/ and docs/plans/, no replacement
  roster or committed base snapshot is introduced, and the gate''s own module and mirror test contain
  NO live check name as a literal.'
- 'The gate cannot be demoted out of its own way: pre_sequence() raises when its Entry is absent AND when
  its Entry carries pre_globs; full_sequence() raises when its Entry is absent.'
- Removing a still-sequenced Entry fails with NO marker able to rescue it, while removing an already-unsequenced
  Entry passes -- mark-then-drop across two PRs is the only retirement path.
- 'A pre_globs edit is judged by MEASURED fnmatch coverage over `git ls-files`, not by None-vs-tuple:
  pre_globs=None -> ("never/**",) fails as a demotion.'
- The gate is clean on the live fleet on day one with NO grandfather constant of any shape, and its `_common.run`
  call count is identical for a 2-domain and a 17-domain fixture.
- 'The nine incumbent RegistrySpec bindings behave identically: check_diff, check_present_markers and
  MarkerEntry are unchanged, and tests/checks/test__marker_guard.py plus the five consumer mirror tests
  pass without edits to their existing assertions.'
- Decision NNN exists in docs/DECISIONS.md under the per-entry 6144-byte cap with a conformant metadata
  envelope carrying `significance`, and its reversal conditions parse as a monitored `yaml reversal-conditions`
  stanza with five conditions.
- docs/contracts/implement-scope-boundary.yaml declares check-fleet tier membership as a MECHANICAL coverage
  row naming validate_tier_demotion_markers, and the map still carries exactly one residual row (rec-3357,
  untouched and not claimed closed).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Ten known-bad fixtures plus the positive control -- the discrimination proof. Each fixture is
    a synthetic base/head manifest pair under an injected root; the ten must produce a violation and the
    control must not.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestKnownBadFixtures
    tests/checks/verification/test_validate_tier_demotion_markers.py::TestPositiveControl -q
  expected: Exit 0; 11 tests pass. Every known-bad case yields a non-empty violation list naming the offending
    check by name; the positive control yields an empty list.
  fix_if: A known-bad fixture passes clean -- the gate does not discriminate on that axis and the corresponding
    weakening still merges silently. Never relax the fixture; fix the rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-discriminates-known-bad
- step: 2
  phase: pre-deploy
  action: Tightening is provably free. Six known-good fixtures -- promotion, full_segment added, glob
    widening, new Entry, marker removed with no state change, unsequenced Entry deleted -- each UNMARKED,
    each must produce zero violations.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestTighteningIsFree
    -q
  expected: Exit 0; 6 tests pass with an empty violation list for every tightening move, and none of the
    six fixtures carries a marker.
  fix_if: Any tightening move demands a marker. This is the ritual failure mode -- if authors learn to
    paste markers on tightening moves the mechanism is dead. Fix the direction rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-tightening-free
- step: 3
  phase: pre-deploy
  action: The fixed point -- demote the gate itself. Patch registry._ALL_ENTRIES to (a) drop the gate's
    Entry and (b) re-add it with pre_globs set, and assert pre_sequence() raises in both; assert full_sequence()
    raises for (a); assert the unpatched live sequence carries the gate ungated.
  command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py::TestWeakeningGateFixedPoint
    -q
  expected: Exit 0. WeakeningGateError raised on both patched shapes; the live pre_sequence() Step for
    the gate has pre_globs None.
  fix_if: pre_sequence() returns normally with the gate absent or gated -- the PR that demotes the guard
    is the PR under which the guard does not run, and the whole mechanism is bypassable by one edit.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-gate-fixed-point-raise
- step: 4
  phase: pre-deploy
  action: Clean on day one with no grandfather. Run the registered check against the real tree and the
    real base ref, assert it appends nothing to `failed`, assert it declared examined(n) with n equal
    to the live manifest-entry count, and assert by AST that the module defines no frozenset/set/tuple/list
    constant of check names (any grandfather shape).
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestCleanOnLiveFleet
    -q
  expected: Exit 0. Zero violations against the live fleet; the declared examined count equals len(registry._ALL_ENTRIES);
    no grandfather-shaped constant found.
  fix_if: A live entry violates -- the fleet is not clean and the plan must fix the entry (the two glob
    widenings in scope rows 5/6 are the known cases), NEVER add a grandfather hook. Decision 165's own
    reversal condition is grandfather-hook growth.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-clean-on-live-fleet
- step: 5
  phase: pre-deploy
  action: No roster returns. Grep the whole repo, excluding audits/ and docs/plans/ (which quote the names
    as historical evidence), for the four retired constants and for any newly introduced check-name roster
    in the gate's own tree.
  command: bin/venv-python -c "import subprocess,sys; out=subprocess.run(['git','grep','-n','-E','PROMOTED_GATED|PROMOTED_UNGATED|NEWLY_PRE_DOMAINS|_PRE_ONLY_CHECKS','--','.',
    ':(exclude)audits', ':(exclude)docs/plans'],capture_output=True,text=True); print(out.stdout); sys.exit(0
    if out.stdout.strip()=='' else 1)"
  expected: Exit 0 with empty output -- the four constants exist nowhere outside the audit record and
    the plan corpus.
  fix_if: A hit remains. Either the retirement is incomplete, or a replacement roster was introduced --
    both defeat the Decision's point 1 (derive, do not enumerate).
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-roster-constants-retired
- step: 6
  phase: pre-deploy
  action: Anti-ritual pins. Assert no name in registry._ALL_ENTRIES appears as a string or identifier
    literal in the gate module or in its mirror test; assert the base is read via git with no committed
    snapshot file consulted; assert the _common.run call count is IDENTICAL for a 2-domain and a 17-domain
    synthetic fixture.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_tier_demotion_markers.py::TestAntiRitualPins
    -q
  expected: Exit 0. Zero live check names found in either file; the run-count equality holds, proving
    the batched base read does not fan out per domain.
  fix_if: A live check name appears in the guard or its tests -- that is a roster in disguise and fails
    review by construction. A domain-proportional run count means the base read regressed to one subprocess
    per manifest.
  hermetic: true
  graduation: graduate
  graduation_check_id: tier-demotion-guard-anti-ritual-pins
- step: 7
  phase: pre-deploy
  action: The re-pointed survivors, over the derived population. Every gated pre entry's globs match its
    own defining module (51 entries at head, not the 22 the roster covered), and every domain contributing
    a pre entry is declared in _PRE_DOMAIN_ORDER.
  command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py::TestDerivedGateShape -q
  expected: Exit 0 over the full derived population. RED before the scope-row-5/6 glob widenings (validate_no_cross_test_imports
    and validate_terraform_tag_charset both fail the self-coverage assertion at head), green after.
  fix_if: A third self-coverage miss appears -- widen that entry's globs (a tightening, free); never narrow
    the assertion back to a roster subset.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: This step re-points an EXISTING property at a derived population rather than
    installing a new one; its standing enforcement is the test itself, which the affected-set channel
    selects on every scripts/checks/** diff. A shard would register a check_id duplicating that test's
    own registry coverage while adding no red case this plan's step 1 does not already carry.
- step: 8
  phase: pre-deploy
  action: _marker_guard regression + the new sibling's own seams. The nine incumbent bindings must round-trip
    through check_diff unchanged, and check_state_diff must SKIP loudly (never affirmatively pass) on
    an unreachable base, walk base keys when the head file is absent, and refuse a stale marker.
  command: bin/venv-python -m pytest tests/checks/test__marker_guard.py -q
  expected: Exit 0. Every pre-existing assertion in the file passes without edits; TestCheckStateDiff
    passes -- red before the scope-row-1 change (check_state_diff does not exist), green after.
  fix_if: An incumbent assertion needed editing to go green -- that is a CONTENT-invariant weakening (Decision
    181/59). Stop, revert, and route it to a rec instead.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: check_state_diff's discrimination is proven end-to-end by step 1's ten known-bad
    fixtures, which ARE graduated; a second shard over the same mechanism's unit seams would register
    duplicate coverage of one guard, and the regression half asserts the ABSENCE of change in nine incumbent
    suites, which has no red case of its own to admit.
- step: 9
  phase: pre-deploy
  action: 'The ci_rca_taxonomy companion surface, through its own registered evaluator rather than by
    reading the YAML. validate_ci_rca_taxonomy check 1b is a two-way census: every registered check must
    carry a function_to_category row.'
  command: bin/venv-python -c "from scripts.checks.registry import resolve; f=[]; resolve('validate_ci_rca_taxonomy')(f);
    assert not f, f"
  expected: Exit 0. The new gate has a code_regression row and the census closes both ways.
  fix_if: AssertionError naming validate_tier_demotion_markers -- the row is missing or misnamed. Add
    the row; never widen the census to tolerate an absent check.
  hermetic: true
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: 'The two contract edits, each through its own registered evaluator: validate_marker_grammar_exports
    asserts binding_surface.exports equals _marker_guard''s __all__, and validate_contract_drift requires
    an amendment_log entry on any content change.'
  command: bin/venv-python -c "from scripts.checks.registry import resolve; f=[]; [resolve(n)(f) for n
    in ('validate_marker_grammar_exports','validate_contract_drift')]; assert not f, f"
  expected: Exit 0. exports equals the grown __all__ (StateEntry, check_state_diff added); both contract
    edits carry a change_class amendment_log entry.
  fix_if: exports inequality -- docs/contracts/marker-grammar.yaml was not updated alongside __all__,
    which is the drift-by-design failure the Class D evaluator exists to catch. contract_drift -- an amendment_log
    entry is missing on one of the two contracts.
  hermetic: true
  graduation: not-applicable
- step: 11
  phase: pre-deploy
