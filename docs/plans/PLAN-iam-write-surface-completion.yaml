constraints:
  - "IMPLEMENTATION plan_type only -- STRATEGIC plans are suspended repo-wide (AGENTS.md Temporary Operational Constraints); the >5-files/>8-steps complexity heuristic is suspended with it, so this ships as one larger IMPLEMENTATION plan."
  - "ORDERING (hard): the new checks FAIL against the pre-fix policy, so the HCL fix and the check changes MUST land in the SAME PR. Splitting them means either a red main (checks first) or an unguarded apply (HCL first)."
  - "Decision 101 (PUBLIC repo): no AWS account IDs, no ARNs carrying real account numbers, no ExternalIds, no credentials in this plan, in any commit, or in any PR body. HCL uses ${var.account_id} / ${var.aws_region}; prose uses [ACCOUNT_ID]. The pre-commit never-commit hook blocks 12-digit account ids."
  - "SECRETS MANAGER READS ARE NOT WIDENED (S1). SecretsManagerReadOnly's six enumerated ARNs move VERBATIM into the reads policy. Decision 129 pt 2 says, verbatim, `iam:` reads and Secrets Manager stay enumerated ... secrets return VALUES, and its reversal conditions say they are out of scope and need no reversal. Decision 129 pt 1 broadened exactly TWO Sids (LambdaRead, EventBridgeRead) and excluded Secrets Manager BY NAME; SSMParameterRead's prefix predates 129. There is therefore NO established-129-pattern argument for a Secrets Manager read prefix, and none may be made in this plan."
  - "secretsmanager:UpdateSecret IS ENUMERATED, NEVER PREFIXED (S2). It is value-capable by AWS API design (accepts SecretString), has no metadata-only variant and no narrowing condition key -- a worst verb under Decision 143 clause 1. Critically there is NO boundary intersection to narrow it: the boundary DataPlaneAllow already carries `secretsmanager:*`, so the identity policy is the SOLE control and a prefix grant would be fully effective over agent-platform-anthropic-api-key, -deepseek-api-key, -github-pat, BOTH -broker-alpaca-* envelopes, and every future agent-platform-* secret with no review. Split the Sid: CreateSecret/DeleteSecret/TagResource/UntagResource may take secret:agent-platform-*; UpdateSecret takes exactly the five terraform/personal aws_secretsmanager_secret ARNs. PutSecretValue is granted nowhere new. Cost is 527 B against 1,660 B of post-change headroom."
  - "Decision 143 worst-verb scoping: prefer agent-platform-* prefixes; Resource: \"*\" ONLY where the API genuinely has no resource-level scoping (the existing sns:GetSubscriptionAttributes / cloudwatch:DescribeAlarms / logs:DescribeLogGroups / ssm:DescribeParameters precedents). Do NOT adopt layer:* for P1-3 -- use layer:agent-platform-* plus the retained ducklake-* literals."
