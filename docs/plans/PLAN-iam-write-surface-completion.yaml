  - "POLICY-SPLIT DECISION -- RESOLVED: YES, author ONE numbered Decision. The human decided this at plan time, resolving what was this plan's one open decision escalation; the implementing session EXECUTES it and does not re-litigate it. NUMBER ALLOCATION: NNN is the next free number, taken at implement time -- docs/DECISIONS.md is the numbering authority (AGENTS.md), the current maximum is not a stable value across the merge queue, and this plan therefore hardcodes NO number. Re-check for a collision IMMEDIATELY BEFORE writing (see the execution step for the pure command). THE ENTRY MUST RECORD SIX THINGS, so the implementer never has to re-derive them. (1) WHAT: 11 read-only Sids relocate out of the github_ci_apply INLINE role policy into a NEW customer-managed policy named agent-platform-github-ci-apply-reads, attached to the same role. The governing principle is READS MOVE, AUTHORITY STAYS -- every iam: write Sid and BOTH Deny statements remain inline. (2) WHY: the AWS inline-policy hard limit of 10,240 B. Measured this session -- the pre-change inline policy is 10,156 B across 33 statements (84 B of headroom) and the remediation adds ~2,384 B, which would land it at roughly 12,540 B, OVER a hard limit; and a LimitExceeded on an inline policy is INVISIBLE to terraform plan, surfacing only at apply. The split is therefore a PREREQUISITE for the fix, not an optimisation. (3) THE REVERSAL HAZARD -- the single most important thing the entry records, and the reason a numbered Decision was chosen over an HCL comment: do NOT roll back by detaching the reads policy alone. That strips the apply role's ENTIRE refresh-read surface, after which every subsequent CD terraform plan fails AccessDenied BEFORE the guard runs -- including the reconcile path that would otherwise be used to recover. The correct rollback ORDER is: restore the inline policy's read Sids FIRST, then detach. The forward-apply window is closed the other way, by the depends_on edge (attachment lands before the inline shrink). (4) THE PROTECTION MODEL after the move: the relocated grants are covered by extending DenyBoundaryPolicyModification's Resource list to the new policy ARN (S5), plus the absence of iam:CreatePolicy* from BOTH the identity policy and the boundary ceiling; and the role cannot detach the policy from itself because DenySelfInlinePolicyWrite -- which stays inline -- denies iam:DetachRolePolicy on the role's own ARN. (5) REVERSAL CONDITIONS for the Decision itself: if the identity policy later shrinks enough that everything fits inline again, or if AWS raises the inline-policy limit, the split MAY be reversed -- following the rollback ORDER in (3), never by a bare detach. (6) CITATIONS: Decision 144 (the allow-list inversion this serves), Decision 143 (worst-verb scoping preserved, not traded away), Decision 92 pt 5 and Decision 77 (guard classification UNCHANGED by the split), and Decision 150 (the significance bar this entry clears). Note in the entry that decision-scout raised this as its M2 finding. The entry must name agent-platform-github-ci-apply-reads literally -- VP step 15 locates the header by that string rather than by a hardcoded number."
