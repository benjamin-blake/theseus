schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "iam-write-surface-completion"
intent: >-
  Close the confirmed gap sweep on the CD apply role in ONE human-gated bootstrap apply -- relocating
  the read surface into a customer-managed policy to buy the bytes the fix needs -- and replace the
  dead write-side exhaustiveness guard with a discovery-driven one whose companion table is
  MANDATORY-DECLARATION (every write-managed type must declare create/update/delete companion tuples,
  possibly empty-with-justification, or the check fails loud), so a missing companion verb becomes a
  review-time failure instead of a production AccessDenied. Scoped honestly: this does NOT
  mechanically close the defect class -- see the "CLASS-CLOSURE HONESTY" context entry; the
  class-closing item is the CloudTrail observability follow-on, filed at High.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-iam-write-surface-completion.yaml
closes_criteria: []
phase: >-
  Platform T2 -- residual of tier_item T2.48 (Phase-2 allow-list inversion, DEP-01/DEP-02, Decision 144):
  rec-2882 (source=ci_rca, Critical) is the third instance of the same defect class. The DEP-02
  live-proof teardown (probe role live, convergence record RED at 99eb274) is DECOUPLED from this plan
  and SPLIT OUT to a sibling plan (suggested slug reconcile-stale-plan-coverage) that fixes rec-2847
  first -- see the "TEARDOWN DECOUPLED" context entry for the two-way cross-plan dependency. Closes no T2.48
  exit criterion (c1-c5 are already met; c6 is the recurring Decision-92 ratchet review, out of scope)
  -- hence closes_criteria: []; the roadmap touch is a progress_note only.
scope:
  - file: terraform/bootstrap/github_ci_apply.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret
      (1) RELOCATE the 11 read-only Sids into a NEW customer-managed aws_iam_policy
      "github_ci_apply_reads" (+ its aws_iam_role_policy_attachment), declared IN THIS SAME FILE;
      (2) add every confirmed missing write verb at the scopes in the gap sweep, with
      secretsmanager:UpdateSecret ENUMERATED at the five terraform/personal secret ARNs (S2 -- never
      at a prefix); (3) extend the boundary DataPlaneAllow ceiling with the 3 new iam verbs;
      (4) EXTEND DenyBoundaryPolicyModification's Resource list with the new reads-policy ARN (S5),
      so the relocated grants land in a container protected by an EXPLICIT Deny rather than only by
      the absence of iam:CreatePolicy*; (5) add rec-2793-style byte preconditions to the two managed
      policy documents (the inline one keeps its existing 10,240 B precondition), hoisting the
      boundary's policy JSON into a local so its precondition can self-reference the rendered
      document -- this hoist is what forces the B1 parser work below; (6) add
      `depends_on = [aws_iam_role_policy_attachment.github_ci_apply_reads]` to
      aws_iam_role_policy.github_ci_apply (B3 -- forward-apply ordering, see constraints);
      (7) collocate the by-design comments (probe-ARN retirement ordering hazard, DenyIAMEscalation
      simulate artifact). SecretsManagerReadOnly's six enumerated ARNs are moved VERBATIM -- no
      widening (S1).
  - file: scripts/checks/iam_tf/_read_coverage.py
    action: Modify
    purpose: >-
      Build ONE shared statement-array locator that handles BOTH the inline
      `policy = jsonencode({...})` shape AND the rec-2793 hoisted-local shape, by GENERALISING the
      `_POLICY_LOCAL_REF_RE` indirection `_parse_bootstrap_statements` already has here (B1-i), and
      express BOTH the new named-`aws_iam_policy` parser (returns [] when the resource is absent) and
      the RELOCATED `_parse_boundary_dataplane_statement` on top of it. The move of
      `_parse_boundary_dataplane_statement` out of `_write_coverage` is required twice over: this
      module already owns the shared HCL primitives, and the move breaks the otherwise-circular import
      between the new `_write_companions` submodule and `_write_coverage`. Its docstring's
      "the boundary policy is inline (no rec-2793 hoisted-local indirection)" assumption becomes FALSE
      the moment this plan hoists it -- rewrite that docstring (B1-ii). ENUMERATED_IAM_TYPES stays
      literal_only (the Decision 129 pt 2 / pt 4(iii) enumerated-IAM-read invariant is deliberately
      NOT relaxed by this plan; see the P1-1 context entry).
  - file: scripts/checks/iam_tf/validate_ci_refresh_read_coverage.py
    action: Modify
    purpose: >-
      UNION the inline role-policy statements with the relocated managed-policy statements before
      passing apply_statements to every downstream assertion (without this, relocating the read Sids
      makes this very gate red), and fail loud if the reads policy is declared with no matching
      aws_iam_role_policy_attachment (an unattached document grants nothing, so crediting its
      statements would be a silent false pass). Orchestrate the new (b)/(c) sub-checks.
  - file: scripts/checks/iam_tf/_write_coverage.py
    action: Modify
    purpose: >-
      Design (a): make the write side DISCOVERY-DRIVEN, mirroring the read side. Delete the
      unsatisfiable APPLY_WRITTEN_TYPES = frozenset(WRITE_COVERAGE) branch, add WRITE_EXEMPT_TYPES
      (each entry carrying a one-line justification), iterate the discovered terraform/personal types
      and fail loud on any type that is neither WRITE_COVERAGE-mapped nor exempt; extend WRITE_COVERAGE
      to cover every discovered write-managed type. Companion + symmetry checks move out (SLOC).
      NOTE the honest scope limit: (a) alone would have caught NONE of the three historical instances
      (aws_iam_role was already WRITE_COVERAGE-mapped in all three) -- (a) closes the "type never
      mapped at all" hole; (b) below is what closes the "type mapped but its companion verbs were
      never enumerated" hole that actually recurred.
  - file: scripts/checks/iam_tf/_write_companions.py
    action: Create
    purpose: >-
      Design (b), MANDATORY-DECLARATION (H5-b): collapse check_passrole_implies_coverage +
      check_create_companion_scope_coverage into ONE phase-keyed LIFECYCLE_COMPANIONS table covering
      create / update / delete, and require that EVERY WRITE_COVERAGE type declares a companion tuple
      for each of the three phases -- a tuple MAY be empty, but only with a collocated one-line
      justification string; a WRITE_COVERAGE type with NO declaration FAILS LOUD. This converts opt-in
      enumeration into discovery-driven coverage: adding a type to WRITE_COVERAGE (design (a)'s output)
      now forces the author to answer "what does its delete phase also call?" at review time, and it
      kills the APPLY_WRITTEN_TYPES failure mode at the companion layer too. The checker skips inert
      rows (trigger verb not granted), asserts each declared companion at its marker, and additionally
      asserts every iam: companion against the boundary DataPlaneAllow ceiling. Also hosts the
      relocated check_identity_iam_actions_subset_of_boundary (same ceiling-assertion family).
  - file: scripts/checks/iam_tf/_write_symmetry.py
    action: Create
    purpose: >-
      Design (c): the two mechanical symmetry rules -- (1) Tag/Untag symmetry (incl. the
      ssm:AddTagsToResource <-> ssm:RemoveTagsFromResource alias pair) at an overlapping resource
      entry; (2) read-scope >= write-scope parity per resource type, with a NAMED exemption table
      whose sole entry is aws_iam_role (the retained Decision 129 pt 2 / pt 4(iii) + Decision 144 pt 5
      enumeration). Rule 2's transitive-skip set is DERIVED PROGRAMMATICALLY from
      `_read_coverage.TRANSITIVE_TYPES` (H1) -- never hand-enumerated, because a hand-list is the
      exact root cause this plan exists to fix (the plan's own first draft hand-listed 10 of the 11
      members, omitting aws_secretsmanager_secret_version).
  - file: scripts/checks/iam_tf/validate_iam_policy_size.py
    action: Create
    purpose: >-
      New registered check, PRECONDITION-PRESENCE ONLY (H3): every aws_iam_role_policy /
      aws_iam_policy in terraform/bootstrap/*.tf carries a lifecycle precondition naming its correct
      limit constant (10240 inline / 6144 managed). Pure text, zero drift, differential, cheap. It
      does NOT render or minify HCL -- a hand-rolled HCL->JSON renderer in the fast tier would red
      every PR on any shape it cannot parse, and this plan changes the shape twice. The byte
      ASSERTION stays where terraform can evaluate it correctly: the lifecycle preconditions
      themselves (admin plan time) plus the optional full-tier `terraform console` probe below.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: Register validate_iam_policy_size in BOTH the --pre and full tier sequences, adjacent to the other iam_tf checks.
  - file: scripts/validate.py
    action: Modify
    purpose: Add the facade re-export line for validate_iam_policy_size (without it, dispatch KeyErrors and tests/test_checks_registry.py fails).
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Create
    purpose: >-
      Design (d): the standing live-simulate contract -- (verb, target ARN template, expected_decision,
      required_context_keys) triples from the gap sweep, PLUS the machine-readable by-design record
      (the three OIDC-provider lifecycle verbs, s3:DeleteBucket, the self-grant/boundary denies) each
      carrying a by_design justification, PLUS a NEW triple asserting explicitDeny for
      iam:CreatePolicyVersion on the reads-policy ARN (S5 -- makes acceptance criterion 4 true by
      construction rather than by absence), PLUS the DenyIAMEscalation simulate-artifact warning so no
      future auditor "fixes" a false positive. Free-form registry shape (no contract_version/status
      keys) per the deploy-paths.yaml / file-router.yaml precedent (Decision 118's ritual governs
      RATIFIED contracts; Decision 95's telemetry contracts and the two free-form registries above are
      the standing precedent that a collocated machine-readable fixture is not a ratification-class
      artifact).
  - file: scripts/ci/iam_simulate.py
    action: Create
    purpose: >-
      POST-APPLY runner for the (d) fixture: iam simulate-principal-policy per triple under
      agent_platform_admin, diff live decision vs expected, exit non-zero on any mismatch. Homed in
      scripts/ci/ -- NOT scripts/verifiers/ (B2): validate_verifier_hermeticity AST-scans
      scripts/verifiers/*.py and its `classes and all(...)` exemption is unreachable for a
      class-less module, so ANY import boto3 (module-level or nested) reds the PR; and making it a
      Verifier class would enrol it in run_all_verifiers(), executing a live-AWS call from CI -- the
      exact opposite of intent. scripts/ci/ is the established home for admin/CI operational runners
      (reconcile_target.py, ducklake_artifacts.py, plan_digest.py, review_verdict.py). Deliberately
      NOT a validate.py check -- it asserts LIVE state, and between merge and the human admin apply the
      code legitimately declares verbs the live policy lacks, so wiring it into --pre would red the very
      PR that fixes the problem.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Add one step to admin_out_of_band.procedure.steps -- after any terraform/bootstrap apply that
      changes the apply role's grant surface, run the (d) fixture via
      `bin/venv-python -m scripts.ci.iam_simulate`. This is the sanctioned home for admin-tier
      procedure steps (Decision 127 / T2.41).
      TODO-M7 (advisory, implementer's call): terraform/bootstrap/CLAUDE.md has NO pointer to this new
      post-apply step. Its config/prose_budgets.yaml entry is 5151, exactly its current size, and prose
      budgets ratchet DOWN only -- so a NET-SMALLER edit is budget-legal. If the implementer can
      replace its duplicated plan/apply block with a one-line pointer at a net byte DECREASE, do so and
      lower the budget entry; if not, leave the file untouched and note why in the report.
  - file: tests/checks/iam_tf/test__write_coverage.py
    action: Modify
    purpose: >-
      Move the companion-check tests out to test__write_companions.py (frees SLOC headroom on a file
      already at 455 SLOC), drop the monkeypatch(APPLY_WRITTEN_TYPES) test that only reached the dead
      branch, and add positive + negative discovery tests (an unmapped discovered type FAILS; an
      exempt type passes).
  - file: tests/checks/iam_tf/test__write_companions.py
    action: Create
    purpose: >-
      Positive + negative tests for LIFECYCLE_COMPANIONS, INCLUDING (i) the load-bearing regression test
      that builds the PRE-FIX policy (iam:DeleteRole granted at role/agent-platform-*,
      iam:ListInstanceProfilesForRole absent) and asserts the delete row FAILS -- i.e. proves the table
      would have caught instance 3 at review time; and (ii) the MANDATORY-DECLARATION negative: a
      WRITE_COVERAGE type with no companion declaration for some phase FAILS LOUD, and an
      empty-tuple declaration WITHOUT a justification string also FAILS. Plus an inert-row test and a
      boundary-ceiling test.
  - file: tests/checks/iam_tf/test__write_symmetry.py
    action: Create
    purpose: >-
      Positive + negative tests for both mechanical rules: a Tag* with no matching Untag* fails; the
      ssm alias pair resolves; a read marker narrower than the widest write marker fails; a named
      exemption suppresses exactly that one type and nothing else; and a test asserting the
      transitive-skip set IS `_read_coverage.TRANSITIVE_TYPES` by identity (not a copy) so it can
      never drift again.
  - file: tests/checks/iam_tf/test_validate_iam_policy_size.py
    action: Create
    purpose: >-
      Positive + negative tests for the precondition-presence check: a policy resource with no
      lifecycle precondition FAILS; a precondition naming the WRONG limit constant (6144 on an inline
      role policy, or 10240 on a managed policy) FAILS; the real tree PASSES. No rendering tests --
      there is no renderer (H3).
  - file: tests/test_iam_simulate.py
    action: Create
    purpose: >-
      Credential-free unit tests for the (d) runner: fixture parsing, expected-vs-actual verdict logic,
      required_context_keys assembly, and non-zero exit on mismatch -- with the AWS call boundary stubbed.
      Path matches all four scripts/ci/ siblings (tests/test_reconcile_target.py,
      test_ducklake_artifacts.py, test_plan_digest.py, test_review_verdict.py); map_source_to_test
      returns None for scripts/ci/, so Decision 131's mirror rule imposes no different target here.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      TWO obligations, not one. (i) ADD the graduated-check rows for the VP steps dispositioned
      `graduate`. (ii) REPAIR two EXISTING rows this plan would otherwise silently rot:
      `boundary-dataplane-new-iam-verbs`, whose awk slices the file FORWARD from the boundary resource
      match and therefore breaks once the boundary JSON is hoisted into a local (B1-iii) -- retarget it
      to a POSITION-INDEPENDENT assertion; and
      `write-coverage-asserts-passrole-identity-and-boundary`, whose greps target
      scripts/checks/iam_tf/_write_coverage.py with guard_symbol
      check_passrole_implies_coverage -- the exact symbol design (b) DELETES, so both greps go false
      and nothing validates guard_symbol (H2) -- retarget it to the new module + the new checker symbol.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append ONE new `## Decision NNN:` entry recording the inline -> customer-managed
      policy-architecture split. The human decided at plan time that this split earns a number;
      the six things the entry MUST record, and the reasoning, are in the "POLICY-SPLIT DECISION
      -- RESOLVED" context entry. NNN IS ALLOCATED AT IMPLEMENT TIME as the next free number --
      docs/DECISIONS.md is the numbering authority (AGENTS.md), so this plan deliberately
      hardcodes no number and the implementer re-checks for a collision immediately before
      writing. Follow docs/contracts/decision-entry.yaml's grammar exactly: an h2 `## Decision
      NNN: <title> (Decided)` header plus the three required markers (Status, Date, Decision),
      using the canonical optional spellings (Problem, Rationale, Reversal conditions, Related,
      Warehouse ID) where used.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the committed decisions index with
      `bin/venv-python -m scripts.decisions_index --write` immediately after the DECISIONS.md
      append -- it is a DERIVED export, never hand-edited. validate_decisions_index_freshness is
      registered in BOTH presubmit tiers and fails on DRIFT or ABSENCE, so an un-regenerated
      index reds `validate --pre` at VP step 11.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T2.48 progress_note ONLY -- record the third-instance root cause, the relocation, the
      retained-enumeration named exception, the number of the Decision authored by this plan, and
      the fact that the DEP-02 teardown is OUT of this plan's scope and owned by the sibling plan
      (suggested slug reconcile-stale-plan-coverage), with the probe role still live and the
      convergence record still red at 99eb274. No criterion or item status flip
      (Status-Trusted-Never-Inferred; c1-c5 already met, c6 out of scope).
bundled_recommendations:
  - rec-2882
  - rec-2845
infrastructure_dependencies:
  - >-
    terraform/bootstrap is NEVER auto-applied (terraform/bootstrap/CLAUDE.md; the
    terraform-apply-sandbox.yml path filter is terraform/personal/** only). This change requires a
    human-gated admin apply under the agent_platform_admin profile in the ADMIN container, mirroring
    how the rec-2842 TagRole fix was applied. Guard classification is UNCHANGED by this plan.
  - >-
    Provider pin: hashicorp/aws ~> 5.0, resolved 5.100.0 (.terraform.lock.hcl). Every provider-side
    call-set inference in the gap sweep is version-scoped to 5.100; the (d) fixture must be re-run on
    any provider bump (the TagLogGroup -> TagResource migration risk).
  - >-
    terraform/bootstrap uses only hashicorp/* providers, so local `terraform init` succeeds
    unconditionally (no Decision 119/120 provider-mirror dependency, unlike terraform/personal).
  - >-
    Managed-policy quota: this change attaches 1 customer-managed policy to the role (9 of the 10
    attached-policy slots remain). The permissions boundary occupies a SEPARATE slot and is not
    counted against that quota.
  - >-
    APPLY ORDERING (B3): terraform has NO implicit dependency ordering the reads-policy ATTACHMENT
    before the inline-policy SHRINK -- both target the same role but neither references the other. A
    forward apply is therefore free to update the inline policy FIRST; if the create-or-attach then
    fails, the apply role holds ZERO refresh-read surface and every subsequent CD plan dies
    AccessDenied BEFORE the guard runs, including any reconcile. The explicit
    `depends_on = [aws_iam_role_policy_attachment.github_ci_apply_reads]` on
    aws_iam_role_policy.github_ci_apply reduces the worst case to "the reads are granted twice for one
    step" -- an identical allow-union, harmless.
  - >-
    NO reconcile.yml dependency. Earlier drafts of this plan routed the stranded DEP-02 teardown
    through reconcile.yml; that is REMOVED (see the TEARDOWN DECOUPLED context entry). This plan
    dispatches no workflow and requires no Environment approval beyond the single human-gated
    bootstrap apply in VP step 12. The reconcile.yml route now belongs to the SIBLING plan
    (suggested slug reconcile-stale-plan-coverage), which must repair rec-2847's recovery
    semantics BEFORE using it -- and which cannot run its teardown until this plan's bootstrap
    apply has landed. Conversely this plan leaves the red convergence latch at 99eb274 SET, so
    terraform/personal CD applies stay blocked until the sibling completes.
acceptance_criteria:
  - >-
    All three rendered policy documents are under their IAM hard limits with real headroom, verified
    by the terraform lifecycle preconditions at admin plan time (the PR-time check asserts those
    preconditions EXIST and name the right constant -- it does not re-derive the bytes): inline
    aws_iam_role_policy 8,663 B / 10,240 (1,577 B headroom, 27 statements); managed
    agent-platform-github-ci-apply-reads 4,227 B / 6,144 (1,917 B headroom, 12 statements); managed
    agent-platform-github-ci-apply-boundary 1,548 B / 6,144 (4,596 B headroom, 4 statements). Baseline
    reproduced this session with `terraform console` over the extracted locals (length-accurate
    placeholder account id, region eu-west-2): inline 10,156 B / 33 statements, boundary 1,373 B --
    both exact to the byte; the 11 relocated read Sids sum to 3,821 B of statement body.
    RESTATED AFTER DECISION 157 (the Secrets Manager value-capability split, landed in this same
    plan): the pre-157 model was inline 8,580 B / 27 and reads 3,998 B / 11. The split added the
    SecretsManagerMetadataRead Sid to the reads document (11 -> 12 statements, +229 B) and the
    ForceDeleteWithoutRecovery condition to the inline document (+83 B, statement count unchanged).
    The figures above are the CURRENT measured values and are the ones to check against the admin
    plan output; the superseded pair is recorded here only so a reviewer holding the earlier model
    can see why it moved. The planner role's own inline policy also grew 7,242 -> 7,475 B / 10,240
    (its own precondition) from the mirrored metadata-read statement.
  - >-
    Every confirmed gap from the sweep is closed at the recorded scope: P0-1 (iam:ListInstanceProfiles
    ForRole + iam:RemoveRoleFromInstanceProfile in BOTH layers), P0-2 (the 3 lambda function-URL config
    verbs), P0-3 (the 8-verb SNS write surface at agent-platform-alerts AND agent-platform-alerts:*),
    P0-4 (logs:TagResource/UntagResource/UntagLogGroup), P0-5 (the S3 bucket-config Put* set),
    P0-6 (Secrets Manager writes SPLIT: CreateSecret/DeleteSecret/TagResource/UntagResource at
    secret:agent-platform-*, and UpdateSecret ENUMERATED at exactly the five terraform/personal
    agent-platform-* secret ARNs -- never at a prefix), P0-7 (SSM writes across
    parameter/agent-platform/* plus ssm:DeleteParameter), P1-2 (lambda:UpdateFunctionCode),
    P1-3 (layer:agent-platform-* on both the read and write layer Sids), P1-4
    (iam:UntagOpenIDConnectProvider in BOTH layers), and the granted P2 destroy verbs.
    SecretsManagerReadOnly's six enumerated ARNs are UNCHANGED -- moved verbatim, not widened.
  - >-
    Every P1/P2 judgement call is EXPLICIT on disk -- granted with a collocated why-comment, or
    recorded as a NAMED by-design exception in docs/contracts/iam-simulate-fixture.yaml with a
    by_design justification. No undocumented silence remains for any verb the sweep named.
  - >-
    The T2.23 self-grant break and the non-strippable boundary survive the relocation: the inline
    aws_iam_role_policy still carries EVERY iam: write Sid and BOTH Deny statements (nothing
    escalation-relevant moves), DenySelfInlinePolicyWrite still denies iam:DetachRolePolicy on the
    apply role's own ARN (so the role cannot detach the new reads policy from itself), the boundary
    remains a permissions_boundary (not an attachment), and -- the load-bearing addition (S5) --
    DenyBoundaryPolicyModification's Resource list now names the reads-policy ARN alongside the
    boundary ARN, so the relocated grants sit behind an EXPLICIT Deny on
    iam:CreatePolicyVersion/DeletePolicy/DeletePolicyVersion/SetDefaultPolicyVersion, not merely
    behind the absence of an iam:CreatePolicy* grant. Proven by construction: the (d) fixture carries
    a triple asserting explicitDeny for iam:CreatePolicyVersion on that ARN.
  - >-
    The write-side exhaustiveness guard is no longer dead code AND its companion layer is no longer
    opt-in: validate_ci_refresh_read_coverage's PASS line reports strictly more than 5 write-managed
    types; a terraform/personal resource type that is neither WRITE_COVERAGE-mapped nor in
    WRITE_EXEMPT_TYPES fails validate --pre; and a WRITE_COVERAGE type with no create/update/delete
    companion declaration (or an empty tuple with no justification) ALSO fails validate --pre.
  - >-
    A regression test proves the LIFECYCLE_COMPANIONS iam:DeleteRole row FAILS against the pre-fix
    policy -- i.e. the table would have caught instance 3 (rec-2882) at review time, not in production.
  - >-
    The graduated-check estate survives the restructure with no silent rot: `_parse_boundary_dataplane
    _statement` returns a non-None DataPlaneAllow on the POST-change tree (the boundary JSON is now
    hoisted into a local, which the pre-change forward-search parser could not follow); the retargeted
    `boundary-dataplane-new-iam-verbs` row is position-independent; and the retargeted
    `write-coverage-asserts-passrole-identity-and-boundary` row names a symbol that still exists.
  - >-
    The (d) simulate fixture runs POST-APPLY only (it is not registered in validate.py, lives in
    scripts/ci/ rather than scripts/verifiers/, and no VP step invokes it at pre-deploy), and on the
    live post-apply policy every triple's decision matches its expected_decision with zero mismatches
    -- including the two rec-2882 verbs (iam:ListInstanceProfilesForRole,
    iam:RemoveRoleFromInstanceProfile) allowed on role/agent-platform-* under the identity/boundary
    intersection. That simulate IS the rec-2882 closure evidence (see TEARDOWN DECOUPLED).
  - >-
    rec-2882 and rec-2845 are closed via the Resolves: trailer and VERIFIED closed in the synced read
    cache post-merge (not merely asserted pre-merge).
  - >-
    The policy-architecture split is recorded as EXACTLY ONE new numbered Decision in
    docs/DECISIONS.md -- its number allocated at implement time, never hardcoded by this plan --
    and that entry records all six mandated elements (the WHAT, the byte-limit WHY, the reversal
    hazard WITH its correct ordering, the post-move protection model, its own reversal
    conditions, and the citation set) and names agent-platform-github-ci-apply-reads literally.
    docs/decisions-index.json is regenerated in the SAME commit (validate --pre green at VP step
    11), and post-merge the entry is machine-visible in ops_decisions via the sanctioned
    DECISIONS.md ETL with failed=0 (VP step 15). No second Decision is minted.
  - >-
    Decision 128 held: every scripts/checks/iam_tf/*.py module is under 500 SLOC and
    config/sloc_budgets.yaml gains NO iam_tf entry -- the growth was absorbed by decomposition into
    _write_companions.py / _write_symmetry.py, never by a budget raise.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the three new iam verbs are granted in BOTH layers, matching only real quoted action lines
      (so a mention in a comment cannot inflate the count into a false pass).
    command: |-
      rc=0; for a in iam:ListInstanceProfilesForRole iam:RemoveRoleFromInstanceProfile iam:UntagOpenIDConnectProvider; do n=$(grep -cE "^[[:space:]]*\"$a\",?[[:space:]]*$" terraform/bootstrap/github_ci_apply.tf); echo "$a=$n"; [ "$n" -ge 2 ] || rc=1; done; exit $rc
    expected: >-
      Exit 0; each verb prints =2 (one identity Action entry + one boundary DataPlaneAllow entry). A
      grant present in only one layer is silently denied by the identity/boundary intersection.
    fix_if: >-
      A verb prints 0 or 1 -- it is missing from the identity Sid or absent from the boundary ceiling.
      Add it to IAMRoleDeleteBounded / OIDCProviderReconcile AND to DataPlaneAllow.
    hermetic: true
    graduation: graduate
    graduation_check_id: "instanceprofile-untagoidc-verbs-both-layers"
  - step: 2
    phase: pre-deploy
    action: >-
      Assert the relocation actually happened in BOTH directions -- each relocated read Sid occurs
      EXACTLY ONCE in the file and that single occurrence is inside the reads-policy slice -- and that
      the attachment resource exists. Position-independent by construction (M1): it does not assume
      where in the file the reads locals were inserted, and it writes its temporaries to mktemp, never
      into the working tree. The Sid list is 12, not the 11 this plan was drafted against: the
      Decision 157 read split replaced SecretsManagerReadOnly with SecretsManagerMetadataRead +
      SecretsManagerValueReadEnumerated, so asserting the pre-split name would assert a Sid the tree
      deliberately no longer has.
    command: |-
      f=terraform/bootstrap/github_ci_apply.tf; t=$(mktemp); awk '/aws_iam_policy" "github_ci_apply_reads"/{p=1} /github_ci_apply_reads_policy_json *= *jsonencode/{p=1} p' "$f" > "$t"; rc=0; for s in IAMRolesRead SecretsManagerMetadataRead SecretsManagerValueReadEnumerated DataLakeBucketManage LambdaRead SSMParameterRead EventBridgeRead SNSRead CloudWatchAlarmsRead SNSSubscriptionRead CloudWatchLogsRead SSMDescribeParameters; do all=$(grep -cE "Sid[[:space:]]*=[[:space:]]*\"$s\"" "$f"); inr=$(grep -cE "Sid[[:space:]]*=[[:space:]]*\"$s\"" "$t"); [ "$all" -eq 1 ] || { echo "NOT-EXACTLY-ONCE $s ($all)"; rc=1; }; [ "$inr" -eq 1 ] || { echo "NOT-IN-READS-POLICY $s"; rc=1; }; done; grep -q 'resource "aws_iam_role_policy_attachment" "github_ci_apply_reads"' "$f" || { echo "MISSING attachment"; rc=1; }; rm -f "$t"; exit $rc
    expected: >-
      Exit 0 with no NOT-EXACTLY-ONCE / NOT-IN-READS-POLICY / MISSING lines -- all 12 Sids relocated,
      none duplicated anywhere in the file, and the aws_iam_role_policy_attachment binding the reads
      policy to the role is declared.
    fix_if: >-
      NOT-EXACTLY-ONCE -> the Sid was COPIED rather than moved (a duplicate grant that silently doubles
      the byte cost), or it appears in a comment. NOT-IN-READS-POLICY -> it was not moved (inline byte
      budget still blown). MISSING attachment -> the reads document exists but grants nothing; the
      union-parse in validate_ci_refresh_read_coverage would then credit dead statements.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reads-policy-relocation-complete"
  - step: 3
    phase: pre-deploy
    action: >-
      Assert byte preconditions exist for ALL THREE policy documents with the correct limit constants
      (the 10,240 inline ceiling plus a NEW 6,144 ceiling on each managed document). Counts
      `precondition {` blocks, NOT the bare word (M2): the bare word appears 3 times today, TWO of
      them in the rec-2793 PROSE comment at lines 72-73, so a >=5 threshold on it is boundary-exact
      and would break if that comment is reworded during the restructure.
    command: |-
      f=terraform/bootstrap/github_ci_apply.tf; p=$(grep -c 'precondition {' "$f"); l1=$(grep -c 10240 "$f"); l2=$(grep -c 6144 "$f"); echo "precondition_blocks=$p limit10240=$l1 limit6144=$l2"; [ "$p" -ge 3 ] && [ "$l1" -ge 1 ] && [ "$l2" -ge 2 ]
    expected: >-
      Exit 0, printing `precondition_blocks=3` `limit10240=1` `limit6144=2` -- three precondition
      blocks (was 1, the inline document only), the 10240 constant still present, and the 6144
      constant present once per managed document. The backticked literals are deliberately the
      tokens the command actually prints: validate_vp_replay extracts every backticked literal from
      this field and requires it in the captured output, so quoting the HCL fragment here instead
      would demand a string the command never emits and diverge on wording rather than on behaviour.
    fix_if: >-
      Counts below threshold -- a managed policy document shipped with no size precondition, so its
      LimitExceeded would surface only as an apply-time failure with no plan-time signal (the exact
      rec-2793 gap this plan is widening).
    hermetic: true
    graduation: graduate
    graduation_check_id: "all-three-policy-docs-carry-size-precondition"
  - step: 4
    phase: pre-deploy
