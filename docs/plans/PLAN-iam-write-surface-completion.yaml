    command: "bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml"
    expected: >-  # pragma: allowlist secret
      Exit 0 with 0 mismatches across all triples. Specifically: iam:ListInstanceProfilesForRole and
      iam:RemoveRoleFromInstanceProfile allowed on role/agent-platform-*; every newly granted verb
      allowed at its recorded scope; secretsmanager:UpdateSecret allowed on each of the five enumerated
      secret ARNs and implicitDeny on a non-enumerated agent-platform-* secret; iam:CreatePolicyVersion
