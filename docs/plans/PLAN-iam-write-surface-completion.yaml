  - step: 12
    phase: post-deploy
    action: >-
      [PR MERGED; ADMIN CONTAINER; HUMAN GATE -- terraform/bootstrap is NEVER auto-applied] Plan the
      bootstrap root under agent_platform_admin and PRESENT the output. STOP and escalate if the plan
