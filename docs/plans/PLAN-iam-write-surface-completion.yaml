    command: |-
      hdr=$(awk '/^## Decision [0-9]+:/{h=$0} /agent-platform-github-ci-apply-reads/{if(h!=""){print h; exit}}' docs/DECISIONS.md); if [ -z "$hdr" ]; then echo "MISSING the policy-split Decision entry in docs/DECISIONS.md"; exit 1; fi; echo "FOUND $hdr"; bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md --profile agent_platform
    expected: >-
      One FOUND line naming the allocated `## Decision NNN:` header, then a JSON backfill summary
      with "failed": 0 -- the new entry parses to a non-empty decision_text and an ISO
      decided_date, so the DAF fidelity tripwire does not fire and no fidelity-baseline allowlist
