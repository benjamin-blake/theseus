    command: "terraform -chdir=terraform/bootstrap plan -var-file=terraform/bootstrap/terraform.bootstrap.tfvars   # then apply the SAME plan on explicit human direction"
    expected: >-
      Plan is 2 to add (aws_iam_policy.github_ci_apply_reads + aws_iam_role_policy_attachment) and 2 to
      change (the inline role policy + the boundary managed policy), 0 to destroy. All three lifecycle
