    command: |-
      f=docs/contracts/iam-simulate-fixture.yaml; rc=0; for k in iam:CreateOpenIDConnectProvider iam:DeleteOpenIDConnectProvider iam:RemoveClientIDFromOpenIDConnectProvider s3:DeleteBucket DenyIAMEscalation iam:CreatePolicyVersion agent-platform-github-ci-apply-reads; do grep -q "$k" "$f" || { echo "MISSING $k"; rc=1; }; done; grep -q 'by_design' "$f" || { echo "MISSING by_design field"; rc=1; }; grep -q 'iam:PermissionsBoundary' "$f" || { echo "MISSING context-key artifact note"; rc=1; }; exit $rc
    expected: >-
