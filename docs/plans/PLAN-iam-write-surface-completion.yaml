    command: |-
      bin/venv-python -m scripts.ops_data_portal --sync >/dev/null && rc=0; for r in rec-2882 rec-2845; do grep "\"$r\"" logs/.recommendations-log.jsonl | tail -1 | grep -q '"status": "closed"' || { echo "STILL-OPEN $r"; rc=1; }; done; exit $rc
    expected: "Exit 0 -- both rec-2882 and rec-2845 show status closed in the freshly synced cache."
    fix_if: >-
