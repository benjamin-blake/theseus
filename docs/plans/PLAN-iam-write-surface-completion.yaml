rollback: >-
  Code side: revert the PR on main; the checks and the fixture are inert without the HCL, and no
  runtime path consumes them. Live IAM side: the change is additive at the identity layer plus one new
  attached managed policy, so rollback is a second human-gated bootstrap apply that reverts
  github_ci_apply.tf and re-inlines the 11 read Sids -- the relocation is reversible because the reads
  document's statements are byte-identical to the ones removed from the inline policy (the grant SET is
  unchanged by the move, only its container; this is also why the M8 s3:Get* collapse is deliberately
  NOT folded in). ORDERING HAZARD, IN BOTH DIRECTIONS: the reads policy and the inline policy are a
  single logical read surface split across two resources with no natural dependency between them. On a
  FORWARD apply the `depends_on` edge (B3) guarantees attach-then-shrink, so a mid-apply failure leaves
  the reads granted twice rather than zero times. On ROLLBACK the same hazard runs the other way -- do
  NOT detach or delete the reads policy before the inline policy has been restored, and NEVER detach the
  reads policy alone: that strips the apply role's entire refresh-read surface and every subsequent
  `terraform plan` fails AccessDenied before the guard runs, including any reconcile. THIS ORDERING
  HAZARD IS THE LOAD-BEARING CONTENT OF THE NUMBERED DECISION THIS PLAN AUTHORS (see the POLICY-SPLIT
  DECISION -- RESOLVED context entry); cite that Decision's number here at implement time, and treat its
  clause (3) as the authoritative rollback ORDER -- restore the inline read Sids FIRST, then detach. If the post-apply
  fixture shows an over-grant, prefer a forward-fix apply that narrows the offending Sid over a full
  revert. The convergence record must never be hand-edited during any rollback -- only a converged apply
  may write it green.
