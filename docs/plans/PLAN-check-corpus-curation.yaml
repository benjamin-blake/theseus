schema_version: 1
slug: "check-corpus-curation"
intent: >-
  Curate the validate.py check corpus so every registered check earns its cost and runs where
  it can fail: rescope the two dead prompt checks onto the live scheduled-agent surface, diff-gate
  the expensive whole-tree checks in --pre only, close the two whole-tree tier asymmetries, delete
  a redundant import-smoke check, and disambiguate the verifier-coverage naming -- ending the
  audit's confirmed no-op/asymmetry findings without changing full-tier coverage.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-corpus-curation.yaml
phase: >-
  Platform hardening -- validate-test-suite audit remediation (Slice D: check-corpus curation).
  Findings VTS-08 / VTS-09 / VTS-17 / VTS-19 / VTS-23 and VTS-21's FREE RENAMES only
  (source of truth: audits/validate-test-suite-4df4d48.yaml check_disposition + findings).
  Audit-driven; no tier_item exit-criteria closed by this slice.
scope:
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      VTS-09 add a declarative `pre_globs: tuple[str, ...] | None = None` field to the `Step`
      dataclass + `_c()` and set it on the six expensive pre-tier checks (DATA only -- the glob
      match + run/skip decision live in validate.py, whose concern-split test home tests/validate/
      has SLOC headroom; see the SLOC context note). VTS-19 add validate_cc_limits +
      validate_deploy_channel_conformance to full_sequence(). VTS-23 remove the validate_imports
      full_sequence entry. VTS-08 drop the SECOND (prompts-block) validate_cli_tools_in_prompts
      dispatch in full_sequence() AND fix the full_sequence() docstring (lines 148-152 state
      cli_tools "legitimately appears twice ... preserved verbatim" -- false after the drop).
      VTS-21 rename the _s("coverage_report") pre_sequence scaffold to _s("verifier_coverage_report").
      VTS-17 add a one-paragraph intent note on the Check.owner/product_coupled fields.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      VTS-09 house the pre_globs gate logic here (validate.py maps to the concern-split test dir
      tests/validate/, which has SLOC headroom): add module-level `_pre_glob_match(path, glob)` and
      `_should_run_in_pre(pre_globs, changed_paths, derivation_ok)`; in the --pre loop derive the
      changed-path set inside try/except and, for each check step, skip + print
      "skipped-by-glob: <name>" when the gate returns False, else dispatch. Fail-closed: run all
      gated checks on derivation exception/unexpected OR empty derived set. Full-tier dispatch
      (run_python_checks) is untouched. VTS-23 delete the validate_imports facade re-export line
      (line 115). VTS-08 edit the KNOWN_MODELS facade import (line 193: `from
      scripts.checks.prompts.validate_prompt_files import KNOWN_MODELS, validate_prompt_files` ->
      drop KNOWN_MODELS, else `import scripts.validate` raises ImportError and crashes the suite).
      VTS-21 rename --coverage to --verifier-coverage keeping --coverage as a working deprecated
      alias (both option strings -> one dest, deprecation note on alias use); rename the
      coverage_report scaffold closure + scaffold_fns key to verifier_coverage_report.
  - file: scripts/checks/prompts/validate_prompt_files.py
    action: Modify
    purpose: >-
      VTS-08 re-point the glob to .github/prompts/scheduled/*.prompt.md and assert the surface is
      non-empty (ends the "All 0 passed" no-op). Adapt per-file validation to the scheduled-prompt
      structural contract the live files actually meet (H1 title line + >=1 `## ` section + the
      existing dead relative-reference check); REMOVE the VS-Code-format assertions (YAML
      frontmatter / name / description / inline model / `## Intent`) and the hand-maintained
      KNOWN_MODELS constant -- models live in schedule.yaml under the retired copilot-sdk provider
      (dec-116) with no canonical scheduled-model allowlist, so re-homing a model check here would
      be a dec-86 second-source violation (see context NOTE 1).
  - file: scripts/checks/hygiene/validate_cli_tools_in_prompts.py
    action: Modify
    purpose: >-
      VTS-08 re-point search_dirs at .github/prompts/scheduled/ (the emptied top-level
      .github/prompts/ and the .md-free .github/agents/ are dropped); the bash-code-block CLI-tool
      scan logic is preserved verbatim.
  - file: scripts/checks/deps/validate_imports.py
    action: Delete
    purpose: >-
      VTS-23 delete the hardcoded 2-module import-smoke check (16.1s/full run); the same full
      tier's whole-suite pytest collection imports execute_recommendation + classify_risk
      transitively and asserts the identical importability property (it is full-tier-only, never
      in pre_sequence -- no --pre coverage is narrowed; context NOTE 2).
  - file: tests/test_checks_registry.py
    action: Modify
    purpose: >-
      Same-commit frozen-baseline lockstep (dec-104, NOTE 4), EDITS ONLY -- this file is at 495/500
      SLOC (unregistered), so it takes NO new gate-helper tests (dec-128 decompose-don't-raise; see
      the SLOC context note): add validate_cc_limits + validate_deploy_channel_conformance to
      REQUIRED_FULL_CHECKS and remove validate_imports; replace
      test_full_sequence_cli_tools_in_prompts_appears_exactly_twice with an exactly-once assertion
      (+ docstring); rename "coverage_report" to "verifier_coverage_report" in FROZEN_PRE_SCAFFOLDS.
      Net ~+1 SLOC (-> ~496, under budget). The pre_globs Step field is data already exercised by the
      existing pre_sequence()/full_sequence() iteration tests in this file; the gate-helper unit
      tests live in tests/validate/test_tiers.py (validate.py's coverage home).
  - file: tests/checks/hygiene/test_validate_cli_tools_in_prompts.py
    action: Modify
    purpose: >-
      VTS-08 update the fixtures that build .github/prompts/ to build .github/prompts/scheduled/
      so the mirror test exercises the rescoped search path.
  - file: tests/checks/prompts/test_validate_prompt_files.py
    action: Create
    purpose: >-
      VTS-08 new mirror test (coverage policy: validate_prompt_files.py is modified and currently
      has no test home). Cover the scheduled-prompt structural contract (H1 + section + dead-ref),
      the non-empty-surface guard, and a live-surface pass against the real
      .github/prompts/scheduled/ tree (substantive rec-2396 closure evidence).
  - file: tests/checks/prompts/__init__.py
    action: Create
    purpose: >-
      Empty package marker for the new tests/checks/prompts/ mirror dir -- every sibling
      (tests/checks/{hygiene,roadmap,deps}/) carries one per the prepend-import mirror convention;
      without it the new test module's package import is inconsistent with the tree.
  - file: tests/validate/test_tiers.py
    action: Modify
    purpose: >-
      VTS-09 home the pre_globs gate tests HERE (tests/validate/ is validate.py's concern-split
      coverage home -- check_per_file_coverage runs the whole dir, so these tests cover validate.py's
      _pre_glob_match/_should_run_in_pre; and this file is at 388 SLOC with headroom). Add: unit
      tests for _pre_glob_match on the six gate globs (positive + negative paths) and
      _should_run_in_pre (match->run, non-match->skip, derivation-exception->run, empty-set->run,
      pre_globs-None->run); end-to-end tests that a docs-only diff logs skipped-by-glob and skips the
      roadmap trio in --pre while running them in full, a tests/**-only diff skips
      count-coupling/cross-imports, and a **/*.py diff runs validate_cc_limits. Confirm the existing
      TestSlocLimitsInPreMode (empty get_changed_files) stays green under empty->run-all.
  - file: tests/validate/test_scaffold_gates.py
    action: Modify
    purpose: >-
      VTS-21 add a main()-argv test asserting --verifier-coverage runs the advisory report and
      exits 0, and that the --coverage deprecated alias still resolves to the same behavior.
bundled_recommendations:
  - rec-2396
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_prompt_files and validate_cli_tools_in_prompts glob
    .github/prompts/scheduled/*.prompt.md and pass green with a NON-ZERO file count against the
    live surface; a zero-file result fails loudly (the "All 0 ... passed" no-op is gone).
  - >-
    validate_prompt_files validates the scheduled-prompt structural contract (H1 title + >=1 `## `
    section + dead relative-reference check) and no longer requires YAML frontmatter / name /
    description / inline model / `## Intent`; the KNOWN_MODELS constant is removed (no second
    model-validity source, dec-86).
  - >-
    validate_cli_tools_in_prompts appears exactly ONCE in registry.full_sequence(); the registry
    test asserts exactly-once (the appears_exactly_twice test is replaced).
  - >-
    A declarative `pre_globs` field exists on the pre-tier Step (registry.py) and validate.py's
    --pre loop honors it via `_should_run_in_pre`: a gated check whose input globs match none of the
    diff's paths logs "skipped-by-glob: <name>" and is skipped, while the same check runs
    unconditionally in full_sequence() (merge-race backstop preserved).
  - >-
    The pre_globs gate is FAIL-CLOSED: on a diff-derivation exception/unexpected return OR an empty
    derived diff-path set, every gated check RUNS (never silently skips) -- asserted by unit tests.
  - >-
    validate_cc_limits and validate_deploy_channel_conformance are present in both
    registry.full_sequence() and the REQUIRED_FULL_CHECKS floor.
  - >-
    validate_imports is fully retired: the module file, the registry full_sequence entry, the
    validate.py facade re-export line, and the REQUIRED_FULL_CHECKS floor entry are all removed in
    one commit and a grep finds zero residual references under scripts/ + tests/test_checks_registry.py.
  - >-
    registry.py carries a one-paragraph intent note documenting who consumes Check.owner /
    product_coupled and when.
  - >-
    --coverage is renamed to --verifier-coverage with --coverage retained as a working deprecated
    alias; the coverage_report scaffold is renamed to verifier_coverage_report in registry
    pre_sequence, FROZEN_PRE_SCAFFOLDS, and the main() scaffold_fns closure; the registry
    equivalence oracle (tests/test_checks_registry.py) passes.
  - >-
    All frozen-baseline updates (FROZEN_PRE_SCAFFOLDS rename, floor add/remove, exactly-once)
    land in the SAME commit as the registry.py changes and the full tests/test_checks_registry.py
    suite is green.
  - >-
    Every touched .py file stays <=500 SLOC by the repo's definition (non-blank, non-#-comment
    lines) with NO raise-approved marker added (dec-128): gate logic + gate tests are homed in
    validate.py / tests/validate/ (headroom), keeping the 495-SLOC tests/test_checks_registry.py
    under budget.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Rescoped prompt checks pass green against the LIVE scheduled surface with a non-zero file
      count (VTS-08; substantive rec-2396 closure evidence).
    command: >-
      bin/venv-python -m pytest tests/checks/prompts/test_validate_prompt_files.py
      tests/checks/hygiene/test_validate_cli_tools_in_prompts.py -q
    expected: >-
      All tests pass, including a case that invokes validate_prompt_files against the real
      .github/prompts/scheduled/ tree and asserts >0 files validated with no failures.
    fix_if: >-
      A test reds -> the rescoped glob or the scheduled-prompt structural rules are wrong (the live
      prompts have no YAML frontmatter / `## Intent`); realign the assertions to the H1+section+dead-ref
      contract, or the fixtures still build the old .github/prompts/ top-level path.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The standing regression guard IS the committed mirror test
      tests/checks/prompts/test_validate_prompt_files.py (plus the hygiene mirror); graduating this
      pytest invocation into the verification registry would duplicate the suite's own assertion.
  - step: 2
    phase: pre-deploy
    action: >-
      Registry equivalence oracle green: floors updated (cc_limits + deploy_channel added,
      validate_imports removed), cli_tools exactly-once in full, FROZEN_PRE_SCAFFOLDS renamed to
      verifier_coverage_report, and the new pre_globs/gate-helper unit tests pass (VTS-08/09/19/21/23, NOTE 4).
    command: bin/venv-python -m pytest tests/test_checks_registry.py -q
    expected: >-
      All tests pass; the membership-floor, scaffold-anchor, exactly-once, and pre_globs helper
      assertions hold against the mutated sequences.
    fix_if: >-
      A floor/scaffold/oracle test reds -> a frozen-baseline edit was missed in the same commit
      (dec-104 lockstep): re-check REQUIRED_FULL_CHECKS, FROZEN_PRE_SCAFFOLDS, and the exactly-once test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The registry equivalence oracle already lives as the committed
      tests/test_checks_registry.py suite (growth-safe floors + scaffold-anchor invariants);
      graduating this run duplicates that standing oracle.
  - step: 3
    phase: pre-deploy
    action: >-
      pre_globs gate behaves correctly and fail-closed (VTS-09, NOTE 3): non-matching diff skips
      + logs skipped-by-glob; matching diff runs the check; diff-derivation exception AND empty
      derived set both RUN all gated checks; full tier is unaffected.
    command: bin/venv-python -m pytest tests/validate/test_tiers.py -q
    expected: >-
      All tests pass, including the new gate cases (docs-only diff skips the roadmap trio; a
      **/*.py diff runs validate_cc_limits; exception/empty -> all gated checks run) and the
      pre-existing TestSlocLimitsInPreMode.
    fix_if: >-
      A skip fires on empty/failed derivation -> the gate is fail-OPEN; make should_run_in_pre
      return True whenever the derived path set is empty or derivation raised (dec-153 conservative read).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The gate's regression guard is the committed tests/validate/test_tiers.py gate cases;
      graduating this pytest run duplicates the suite's standing assertion.
  - step: 4
    phase: pre-deploy
    action: >-
      Verifier-coverage rename + deprecated alias both work (VTS-21): --verifier-coverage runs the
      advisory report and exits 0; --coverage alias resolves to the same behavior.
    command: bin/venv-python -m pytest tests/validate/test_scaffold_gates.py -q
    expected: All tests pass, including the new --verifier-coverage and --coverage-alias argv cases.
    fix_if: >-
      The alias case reds -> argparse maps only the new flag; add --coverage as a second option
      string on the same dest (keep args.<dest> working) and emit a deprecation note on alias use.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The alias behavior is guarded by the committed tests/validate/test_scaffold_gates.py case;
      graduating this run duplicates the suite's standing assertion.
  - step: 5
    phase: pre-deploy
    action: >-
      Positive retirement confirmation for the validate_imports Delete (VTS-23): module absent and
      zero residual references across the code surface.
    command: >-
      test ! -f scripts/checks/deps/validate_imports.py && test -z "$(grep -rn --include=*.py
      validate_imports scripts/checks scripts/validate.py tests/test_checks_registry.py)" && echo RETIRED
    expected: Prints "RETIRED" (module file gone AND no residual validate_imports references).
    fix_if: >-
      Non-zero exit / no "RETIRED" -> a reference survives (registry full_sequence entry, the
      validate.py facade line, or the floor entry) or the module file was not deleted; remove the
      remaining occurrence in the same commit.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-time retirement confirmation for the validate_imports cutover -- a point-in-time
      migration assertion (module-absence + zero residual references) subsumed permanently by the
      REQUIRED_FULL_CHECKS floor removal + TestFacadeCompleteness; a standing "is-absent" registry
      check would duplicate that floor guard.
  - step: 6
    phase: pre-deploy
    action: >-
      Stale-surface sweep (Closure Obligation): both rescoped prompt checks now target the live
      scheduled surface and no longer glob the T-1.13-emptied top-level path (VTS-08).
    command: >-
      grep -q "scheduled" scripts/checks/prompts/validate_prompt_files.py && grep -q "scheduled"
      scripts/checks/hygiene/validate_cli_tools_in_prompts.py && echo REPOINTED
    expected: Prints "REPOINTED" (both checks reference the .github/prompts/scheduled/ surface).
    fix_if: >-
      No "REPOINTED" -> a check still points at the emptied top-level .github/prompts/ path; update
      its glob / search_dirs to the scheduled/ subdirectory.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-time surface-cutover confirmation (emptied top-level -> scheduled/) -- a point-in-time
      migration assertion subsumed permanently by the committed rescope tests (the new mirror test
      + the cli_tools fixture update); graduating it would duplicate those standing tests.
  - step: 7
    phase: pre-deploy
    action: >-
      End-to-end fast-tier integration: the full --pre tier is green on the branch with the gate,
      rescopes, tier moves, deletion, and rename applied (the pre_globs gate itself dispatches).
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      "=== Validation Summary (scope: pre) ===" then "All checks passed."; the run logs
      skipped-by-glob for any gated check whose globs the branch diff does not touch.
    fix_if: >-
      Any check reds -> diagnose the specific failure; if the gate skipped a check that should have
      run for this diff, widen/fix that check's pre_globs or the match helper. Do NOT mark this step
      hermetic (it invokes validate --pre -> recursion).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      Every touched .py file stays <=500 SLOC by the repo's own definition (non-blank, non-#-comment
      lines) -- the dec-128 decomposition holds (gate logic + gate tests homed off the 495-SLOC
      tests/test_checks_registry.py, no raise-approved marker).
    command: >-
      for f in scripts/validate.py scripts/checks/registry.py
      scripts/checks/prompts/validate_prompt_files.py
      scripts/checks/hygiene/validate_cli_tools_in_prompts.py tests/test_checks_registry.py
      tests/validate/test_tiers.py tests/validate/test_scaffold_gates.py
      tests/checks/hygiene/test_validate_cli_tools_in_prompts.py
      tests/checks/prompts/test_validate_prompt_files.py; do n=$(grep -cvE
      '^[[:space:]]*(#|$)' "$f"); test "$n" -le 500 || { echo "OVER $f=$n"; exit 1; }; done;
      echo ALL_UNDER_500
    expected: Prints "ALL_UNDER_500"; exits 0 (every touched file <=500 SLOC by the repo definition).
    fix_if: >-
      "OVER <file>=<n>" -> decompose that file (relocate cohesive tests to a home with headroom, or
      a facade package) rather than adding a raise-approved marker (dec-128).
    hermetic: true
    graduation: not-applicable
