- source: scripts/preflight/env_git.py
  behavior: The default commit-correlation window _get_recent_main_commits serves is a named constant of at least 60, and a default call returns the whole window rather than the first five commits.
  verification_step: 6
  test_selector: tests/session/preflight/test_env_git.py::TestRecentMainCommitsCorrelationWindow
  red_green_expectation: 'Red before, green after, measured in a scratch clone at origin/main ae8c8c9253be03f7a227ecd23010c7867bd46ac0: ALL THREE cases fail with AttributeError naming the absent MAIN_COMMIT_CORRELATION_WINDOW attribute -- the behavioural case included, because it derives its synthetic record count FROM the constant and therefore dies on the attribute lookup before it ever calls _get_recent_main_commits. Stated precisely rather than optimistically: the red leg of all three cases is symbol-absence, not an observed five-of-sixty return, and no case observes the old default''s behaviour at all. Deriving the count from the constant is deliberate -- it makes the case survive a later raise of the window -- and the behavioural discrimination it buys is forward-looking: once the constant exists, a regression of the DEFAULT back to a literal 5 fails that case on the returned record count while the two shape cases stay green. Step 3 re-proves the red leg against a real origin/main worktree rather than asserting it.'
- source: docs/PROJECT_CONTEXT.md
  behavior: The Source stamp's ref half resolves through _check_endstate_drift's own matcher -- proven by the git-show argv the drift check only reaches once the ref parses -- and that ref names a commit whose ROADMAP-PLATFORM.yaml tier_item id set hashes to the stamped sha256.
  verification_step: 6
