schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: preflight-correlation-window-and-context-stamp
intent: 'Make two session-open preflight signals honest again: widen the origin/main commit-correlation window _get_recent_main_commits feeds to the ci_rca likely-resolved engine from five commits to a named 60-commit floor, and replace the unresolvable literal in docs/PROJECT_CONTEXT.md''s Source stamp ref half with the newest commit whose tier_item id set hashes to the stamped fingerprint, so the End-State drift advisory can attribute drift to new tier ids instead of printing an empty new_ids list forever.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-preflight-correlation-window-and-context-stamp.yaml
phase: Platform session-context hardening -- restoring two preflight signals that report a value no consumer can act on. Ad hoc, soft-warn category ad_hoc_rec; no tier_item is claimed and no roadmap exit criterion is closed, so this plan declares no closes_criteria. Part (a) of the operator's Task 9 only; part (b) (the wider preflight signal-honesty sweep) is a separate later plan that must be measured first and is out of scope here.
scope:
- file: scripts/preflight/env_git.py
  action: Modify
  purpose: 'Introduce the module-level MAIN_COMMIT_CORRELATION_WINDOW int constant (value 60) carrying the why-comment for the number, and make it the default of _get_recent_main_commits''s n parameter in place of the literal 5. Nothing else in the module changes: the git log invocation, the parser, the cap condition and every other function stay byte-identical. Measured 302 to 303 SLOC.'
- file: docs/PROJECT_CONTEXT.md
  action: Modify
  purpose: 'Replace ONLY the ref half of the single Source stamp line -- the two words that follow the ROADMAP-PLATFORM.yaml at-sign -- with the 40-character commit 722df8501dc9d717ead5bf70691bd646839be5d0, the newest ROADMAP-PLATFORM.yaml-touching commit whose tier_item id set hashes to the stamped fingerprint. What the ref MEANS, said so its date is not over-read: it names the LAST commit at which the stamped fingerprint was still accurate, not the commit at which the fingerprint was computed -- the stamp line was authored at e88b666 on 2026-08-05 (#856), 13 days before 722df850 -- and since every matching ref yields identical new_ids the choice is about correctness of meaning, not the computed answer. The ref is NOT unique and this plan does not claim it is; the count of commits sharing that hash is only meaningful inside a stated window, so it is scoped on the stamp-premise context line (six roadmap-touching commits within e88b666..the pinned base, with further matches before e88b666 and non-roadmap-touching commits in between) and is deliberately not restated here as a bare number. The roadmap_tier_id_set sha256 half stays byte-identical and every other byte of the file is unchanged; the file goes from 13907 to 13935 prose bytes against a 14032 budget.'
- file: tests/session/preflight/test_env_git.py
  action: Modify
  purpose: Add class TestRecentMainCommitsCorrelationWindow with three cases -- the constant meets a declared floor of 60, the parameter default IS that constant, and a default call over a synthetic git-log stdout of window-many commit records returns the whole window rather than five. Adds an inspect import and a direct scripts.preflight.env_git import to the existing single import block. Measured 343 to 380 SLOC, so no sibling module and no budget entry.
- file: tests/session/preflight/test_context_docs.py
  action: Modify
  purpose: 'Add class TestEndstateStampRefResolves with two cases driving the REAL _check_endstate_drift over the REAL stamp line copied into a tmp_path root: the ref half resolves (proven by the recorded git-show argv, which is never reached when the matcher fails), and that ref names a commit whose ROADMAP-PLATFORM.yaml tier_item id set hashes to the stamped sha256, skipped with a named reason on a shallow checkout. Adds subprocess and yaml imports. Measured 247 to 323 SLOC.'
- file: config/agent/verification_registry/entries/endstate-stamp-ref-resolves.yaml
  action: Create
  purpose: 'Verification-registry shard for graduated step 4: a command_exit_zero guard over docs/PROJECT_CONTEXT.md asserting the Source stamp ref half still matches a seven-to-forty hex ref grammar. LIMITATION, stated on the row rather than glossed: that grammar is an inline regex literal inside _check_endstate_drift in scripts/preflight/context_docs.py, not a bindable module constant, so this shard necessarily RE-DECLARES it as a copied literal. Blast radius stated at its true width rather than its narrowest: the shard reads only docs/PROJECT_CONTEXT.md and never imports scripts.preflight.context_docs, so it would stay green not merely if the production regex were later tightened, but also if _check_endstate_drift''s ref-matching branch were deleted outright or its git-show attribution block removed. That the drift check actually REACHES that attribution branch is bound only by the pytest class, which pr-validate collects and skips (boto3 is pinned in requirements.txt, which that gate does not install). Kept as a declared trade rather than repaired: importing the production module here would additionally require the stamped commit object to be present on the runner, which the fetch-depth 2 main-validate checkout does not guarantee. The sibling window shard has no such gap -- it binds the production symbol through inspect.signature. Measured admitted by the differential gate -- fails on origin/main, passes on HEAD.'
- file: config/agent/verification_registry/entries/main-commit-correlation-window-floor.yaml
  action: Create
  purpose: 'Verification-registry shard for graduated step 5: a command_exit_zero guard over scripts/preflight/env_git.py asserting _get_recent_main_commits''s n default is an int of at least 60. Binds the production symbol through inspect.signature, so unlike its stamp-shard sibling it cannot drift from a copied literal. Measured admitted by the differential gate -- fails on origin/main, passes on HEAD.'
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- docs/PROJECT_CONTEXT.md differs from origin/main by exactly one changed line and no added or removed line; that line's roadmap_tier_id_set sha256 half is byte-identical to the base and its ref half is the 40-character commit 722df8501dc9d717ead5bf70691bd646839be5d0 (step 8).
- 'The Source stamp ref half resolves through _check_endstate_drift''s own matcher and the drift check computes a verdict rather than skipping the attribution branch: the advisory now names the drifting tier ids instead of an empty list (steps 1, 4, 6).'
- The commit-correlation window _get_recent_main_commits serves by default is a named constant of at least 60, and a default call returns the whole window rather than five (steps 1, 5, 6).
- Both new test classes are RED against an origin/main worktree on pytest exit code 1 and GREEN on the working tree, with infrastructure failures printing their own sentinels so they can never be mistaken for red (steps 3, 6).
- 'The widening cannot demote a live ci_rca rec out of print_ci_rca_recs'' [HARD BLOCK] arm, because the source=ci_rca open/in_progress population is EMPTY: step 2 asserts that population is empty AND that rec-3292 and rec-3293 both read closed, STOPPING on either. Separately, widening is monotone in the likely-resolved direction -- nothing that is likely_resolved at the old five-commit window leaves that set at the new default (step 7). It is NOT claimed, and is not true, that the widening drops no unclosed rec from the queue-wide unresolved set: measured at the pinned base over the same 1063 open recs, unresolved falls 991 to 695 and likely_resolved rises 72 to 368, so 296 unclosed recs are reclassified. That reclassification is the intended effect of the widening and today reaches only the dormant surface_queue_relevance_triage helper; the ci_rca gate is protected by the empty-population assertion, never by an unresolved-set-size claim (steps 2, 7).'
- The touched set equals the declared scope plus this plan's own sanctioned path in both directions; the two graduated steps each produced their registry shard; ruff check and ruff format are clean; every changed Python file is under 500 SLOC with no budget entry and no raise marker; the changed scripts/ statements are covered; and the Decision 182 selection budget predicts within_budget (steps 9, 10, 11, 12, 13, 14).
execution_steps:
- 'scripts/preflight/env_git.py -- immediately above the def of _get_recent_main_commits, add the module-level constant MAIN_COMMIT_CORRELATION_WINDOW: int = 60 with a short why-comment naming the fix-to-triage lag it must outlive and citing audits/planning-decision-burden-735e69fc.yaml section B5. Cite PDB-06 at its real confidence tier: the audit''s self-verification cap (round 4) downgraded PDB-06 and B5-O1 to HYPOTHESIS, so the comment must present it as a HYPOTHESIS-confidence finding whose empirical half is independently re-measured here -- the two motivating fix commits sat 117 and 116 commits behind origin/main on 2026-09-05 -- and never as settled documentation. The comment carries that commit-lag pair ONLY: no commits-per-day rate and no days-of-history conversion goes into permanent source, because the rate is averaging-window sensitive (see the commits-behind context line) while the commit lag reproduces exactly. Change the parameter default from the literal 5 to that constant. Change nothing else in the module -- not the git log invocation, not the parser, not the cap condition.'
- docs/PROJECT_CONTEXT.md -- in the single Source stamp line, replace ONLY the two words between the ROADMAP-PLATFORM.yaml at-sign and the following semicolon with 722df8501dc9d717ead5bf70691bd646839be5d0. Leave the roadmap_tier_id_set sha256 value and every other byte of the file untouched. Do not re-stamp the fingerprint.
- 'tests/session/preflight/test_env_git.py -- extend the existing import block in place (tests/CLAUDE.md: never a second import block for the same module) with inspect and a direct import of scripts.preflight.env_git. Placement named rather than left open: that block is SPLIT by the boto3 = pytest.importorskip(''boto3'') line, and both new imports go in the FIRST half, ABOVE it, because scripts/preflight/env_git.py imports only subprocess, sys, datetime, pathlib and scripts.preflight._common and needs no boto3. The post-importorskip half exists solely to host the tests.fixtures.session_preflight_module import with its noqa: E402, and adding to it would earn two more E402 suppressions for nothing -- and step 10 runs ruff check over this file. Add class TestRecentMainCommitsCorrelationWindow with a declared floor constant of 60 and three cases: the constant meets the floor, the parameter default IS the constant, and a default call over a synthetic git-log stdout built from the constant returns the whole window and more than five. Derive the synthetic record count from the constant, never a literal, so the case survives a later raise.'
- tests/session/preflight/test_context_docs.py -- extend the existing import block with subprocess and yaml; add class TestEndstateStampRefResolves. Its helper copies the REAL stamp line out of docs/PROJECT_CONTEXT.md into a tmp_path docs/ tree beside a probe roadmap whose id set differs, patches scripts.preflight._common.ROOT to tmp_path and session_preflight.subprocess.run to a recorder, and calls the real _check_endstate_drift. Case one asserts the recorder captured a git show of the resolved ref (empty means the matcher never matched). Case two lifts the ref from that recorded argv, skips with a reason naming the commit when git cat-file -e on that ref peeled to a commit exits non-zero -- the direct object-presence predicate, which covers the fetch-depth 2 main-validate checkout AND a partial or blob-filtered clone that is not shallow yet still lacks the object -- and otherwise recomputes the tier_item id-set sha256 at that commit and asserts it equals the stamped value. Never re-declare the matcher regex in the test -- bind to the production function.
- config/agent/verification_registry/entries/endstate-stamp-ref-resolves.yaml and config/agent/verification_registry/entries/main-commit-correlation-window-floor.yaml -- write the two graduation shards for steps 4 and 5. validate_verification_registry enforces FIVE required fields per shard -- check_id, primitive_slot, guard_target, plan_slug and graduated_at -- so write all five, graduated_at as an ISO date string, plus guard_symbol where one exists and graduated_by, matching the shape of the existing entries in that directory. Omitting graduated_at passes step 14 (which checks presence, filename and slot only) and fails one step later at step 15, so name it here. Each shard carries check_id equal to its filename stem, primitive_slot command_exit_zero, the guard_target named in its scope row, plan_slug preflight-correlation-window-and-context-stamp, and a check_spec.command list. The stamp shard asserts the ref half still matches a seven-to-forty hex grammar copied from the production matcher (a copied literal -- the production regex is inline, not bindable; the limitation is recorded on the scope row); the window shard imports scripts.preflight.env_git and asserts, through inspect.signature, that the n default is an int of at least 60.
- Run ruff format on the three changed Python files before measuring SLOC or running the verification plan -- the new test bodies do not land pre-formatted.
- Execute Verification Plan -- run each step in order; loop until pass; on unrecoverable failure stop and RCA (Decision 55). The BEFORE step reads origin/main through git show and the RED-leg step materializes its own origin/main worktree, so neither needs to run before the edits.
- 'Report in the PR body: the BEFORE and AFTER drift dicts, the resolved stamp ref, the window default, the two recs'' closed statuses, the monotonicity counts, and every verification result.'
work_areas: []
rollback: 'Both halves are independent and both revert cleanly by content. Reverting the window half means restoring the literal 5 default and deleting the constant plus its test class and its shard; nothing else reads either. Reverting the stamp half means restoring the two-word ref literal and deleting the test class plus its shard -- but note that doing so restores the always-empty new_ids defect, so it is a deliberate regression, not a neutral undo. No registry, budget or baseline is ratcheted by this plan, so a revert owes no counter-edit anywhere: the two shard files simply go away with it. If only one half must go, revert that half out of the squash commit rather than the whole SHA.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE, read from the base rather than asserted. At origin/main the Source stamp's ref half does not match the drift check's seven-to-forty hex ref grammar at all (the literal is two English words), and _get_recent_main_commits's n default is 5. This is the falsifiable statement of the defect both halves of the diff repair.
  command: 'bin/venv-python -c "import re,subprocess;g=lambda p:subprocess.run([''git'',''show'',''origin/main:''+p],capture_output=True,text=True,encoding=''utf-8'',errors=''replace'',check=True).stdout;m=re.search(r''ROADMAP-PLATFORM\.yaml\s*@\s*([0-9a-f]{7,40})'',g(''docs/PROJECT_CONTEXT.md''));assert m is None,m.group(1);d=re.search(r''def _get_recent_main_commits\(n: int = ([^)]+)\)'',g(''scripts/preflight/env_git.py''));assert d and d.group(1)==''5'',d;print(''BEFORE_OK base_stamp_ref=UNRESOLVED base_window=''+d.group(1))"'
  expected: Exit 0 and one stdout line reading BEFORE_OK base_stamp_ref=UNRESOLVED base_window=5.
  fix_if: 'An AssertionError printing a resolved ref means someone else already fixed the stamp on main -- re-scope the stamp half of this plan out rather than re-applying it. An AssertionError on the window means the default already moved: read what it moved to and re-scope, never lower it back. A CalledProcessError means origin/main is unreachable -- fetch it and re-run; do not proceed on an unread base.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Inverts by construction on merge: the step reads origin/main, which after this PR lands carries the fixed stamp and the widened default, so a shard would sit permanently red. The durable halves are graduated separately as steps 4 and 5.'
- step: 2
  phase: pre-deploy
  action: Safety precondition for the widening, checked rather than assumed, against LIVE warehouse state in BOTH the historical and the live direction. The step PULLS logs/.recommendations-log.jsonl fresh from the DuckLake reader through the sanctioned portal surface (scripts.ops_data_portal.sync) as its first act, then asserts against the cache that pull just rewrote -- a cache last pulled before a ci_rca rec was filed on main would otherwise satisfy the emptiness clause vacuously, which is exactly the authoring-to-implementation window the clause exists to cover. Widening the window BEFORE the two stale ci_rca recs were closed would have moved them out of ci_rca_unresolved_recs without closing them -- the Decision 55 anti-masking failure. Read rec-3292 and rec-3293 and require both closed; THEN require the live source=ci_rca open/in_progress population to be empty, so no currently-open ci_rca rec can be demoted out of print_ci_rca_recs' [HARD BLOCK] arm into its [SOFT -- LIKELY RESOLVED] arm by a path-suffix match over the wider window. The two named ids are a historical check; the empty-population clause is the one that still holds at implement time, because ci-rca files recs on main continuously and a rec created between plan authoring and implementation would pass the two-id check while remaining demotable.
  command: bin/venv-python -c "import json,pathlib,time;from scripts.ops_data_portal import sync;t0=time.time();pulled=sync(['ops_recommendations'])['pulled']['ops_recommendations'];assert pulled>0,{'reader_pull_rows':pulled};f=pathlib.Path('logs/.recommendations-log.jsonl');assert f.stat().st_mtime>=t0-2,{'cache_not_rewritten_by_this_pull':f.stat().st_mtime,'t0':t0};rows=[json.loads(l) for l in f.read_text(encoding='utf-8').splitlines() if l.strip()];w={'rec-3292','rec-3293'};g={r['id']:r for r in rows if r.get('id') in w};missing=sorted(w-set(g));assert not missing,missing;notclosed=sorted(i for i,r in g.items() if r.get('status')!='closed');assert not notclosed,notclosed;live=sorted(r['id'] for r in rows if r.get('source')=='ci_rca' and r.get('status') in ('open','in_progress'));assert not live,{'live_open_ci_rca_recs':live};print('WIDENING_SAFE pulled='+str(pulled)+' cache_rewritten=True '+' '.join(i+'='+g[i]['status'] for i in sorted(w))+' live_open_ci_rca=0')"
  expected: 'Exit 0 and one stdout line beginning WIDENING_SAFE pulled= and ending rec-3292=closed rec-3293=closed live_open_ci_rca=0. FOUR clauses are asserted, in order: the reader pull returned rows; the cache file was rewritten by THAT pull, so every clause below it reads live warehouse state rather than whatever the working copy last held; both ids present and both closed; and the live source=ci_rca open/in_progress set empty. The pull-returned-rows clause is load-bearing rather than decorative: scripts.sync.ops never raises to callers -- on an unreachable reader it returns 0 and leaves the cache untouched -- so without it a boundary failure would degrade silently into a stale-cache read. The pulled row count is evidence; at the pinned base the cache carries 181 source=ci_rca rows, 173 closed and 8 superseded, so the live set is empty. Those counts are evidence; the emptiness is the assertion.'
  fix_if: 'A reader_pull_rows of 0 means the DuckLake reader boundary was unreachable -- confirm the agent_platform assume-role chain with aws sts get-caller-identity and re-run. Do NOT fall back to reading the existing cache: an unpulled cache cannot evidence the live population, and a write or read that cannot reach the warehouse fails loudly by design (Decision 84 I-4). A cache_not_rewritten_by_this_pull message means the pull reported rows without overwriting the local file -- investigate scripts.sync.ops before trusting any clause below it. A non-empty notclosed list is a STOP: the widening is not safe yet, because it would drop a still-open rec from the unresolved set without closing it. A non-empty live_open_ci_rca_recs list is the SAME STOP for a rec filed after this plan was authored -- do not widen, and never close the rec to obtain green; hand it back to the coordinator for closure with recorded proof (Decision 103), or re-scope this plan, then re-run. A missing id AFTER a successful pull is no longer a staleness signal -- it means the row is absent from the warehouse itself; stop and investigate rather than re-filing it, and never replay the local cache upstream (Decision 84).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Asserts warehouse-side rec lifecycle state pulled live through the ops portal, which the repository differential kernel cannot express: a shard''s verdict would track reader reachability and cache state on the runner rather than the invariant. It is also a one-time precondition for this change, not a standing property. That live reader pull and gitignored-cache read is why hermetic is false -- see the hermeticity context line.'
- step: 3
  phase: pre-deploy
  action: 'RED leg, proven against a real origin/main worktree rather than asserted. Materialize a detached worktree at origin/main, copy ONLY this branch''s two test modules into it (so the tree differs from origin/main in the tests alone, never in env_git.py or PROJECT_CONTEXT.md), run both new classes there and require them to fail. Removes the worktree whether or not the run failed. Disposition not-applicable rather than waive, stated rather than left to inference: the red leg inverts by construction on merge -- once this PR lands, an origin/main worktree carries the widened default and the fixed stamp, so both classes PASS there and the step''s whole assertion (that they fail) becomes false. There is no standing property here to graduate and nothing to waive; the durable properties are graduated as steps 4 and 5.'
  command: W=$(mktemp -d); O=$(mktemp); if ! git worktree add --detach --quiet "$W" origin/main; then echo WORKTREE_ADD_FAILED; exit 1; fi; if ! cp tests/session/preflight/test_env_git.py tests/session/preflight/test_context_docs.py "$W/tests/session/preflight/"; then git worktree remove --force "$W"; echo CP_FAILED; exit 1; fi; ln -s "$PWD/.venv" "$W/.venv" 2>/dev/null || true; if [ ! -x "$W/bin/venv-python" ]; then git worktree remove --force "$W"; echo VENV_PYTHON_MISSING; exit 1; fi; ( cd "$W" && bin/venv-python -m pytest tests/session/preflight/test_env_git.py::TestRecentMainCommitsCorrelationWindow tests/session/preflight/test_context_docs.py::TestEndstateStampRefResolves -q -p no:cacheprovider --randomly-seed=12345 ) > "$O" 2>&1; rc=$?; cat "$O"; git worktree remove --force "$W"; if [ $rc -eq 0 ]; then rm -f "$O"; echo RED_LEG_DID_NOT_GO_RED; exit 1; fi; if [ $rc -ne 1 ]; then rm -f "$O"; echo RED_LEG_INFRA_FAILURE_rc_$rc; exit 1; fi; if ! grep -Eq "[0-9]+ failed" "$O"; then rm -f "$O"; echo RED_LEG_NO_FAILURE_COUNT_rc_$rc; exit 1; fi; N=$(grep -Eo "[0-9]+ failed" "$O" | tail -1 | cut -d" " -f1); rm -f "$O"; echo RED_LEG_OK_both_classes_fail_on_origin_main failed=$N
  expected: 'Exit 0 with a final stdout line reading RED_LEG_OK_both_classes_fail_on_origin_main failed=5. The captured pytest output above it shows every case in both classes failing -- three AttributeError failures naming the absent MAIN_COMMIT_CORRELATION_WINDOW attribute and two failures on the empty recorded git-show argv, because the base''s two-word ref never matches the matcher. The red leg is accepted ONLY on pytest exit code 1 AND a pytest summary carrying an explicit failure count: a failed worktree add, a failed copy, a missing venv python, a collection error that also exits 1 with no failure count, or any other pytest exit code (2 interrupted, 4 usage error, 5 nothing collected) prints its own sentinel and exits 1, so infrastructure failure can never be read as the assertions going red. The failed=5 figure is evidence about the case count and rises if either class gains cases; the presence of a failure count is what is asserted.'
  fix_if: 'RED_LEG_DID_NOT_GO_RED means the new tests pass on the unfixed tree and therefore prove nothing: STOP and re-derive the assertions before changing anything. RED_LEG_INFRA_FAILURE_rc_N means pytest never reached the assertions (rc 2, 4 or 5) -- read the captured output; it is never evidence about the defect. RED_LEG_NO_FAILURE_COUNT_rc_1 means pytest exited 1 without reporting failures, which is a collection or import error (a missing boto3 in the scratch venv is the likely cause, since both modules open with a pytest.importorskip on it) -- fix the environment and re-run; a skipped class is not a red leg. WORKTREE_ADD_FAILED, CP_FAILED or VENV_PYTHON_MISSING name a scratch-environment fault -- clear stale worktrees with git worktree prune and re-run.'
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: 'AFTER, stamp half. The Source stamp''s ref half now resolves through the same seven-to-forty hex ref grammar _check_endstate_drift uses, so the drift check enters its git-show ATTRIBUTION branch and returns a non-empty new_ids whenever it reports stale. The delta is attribution ONLY, stated precisely rather than overstated: current_hash was ALREADY computed at origin/main (measured 2fdd9e1f there), because it is derived from the current roadmap before the ref is ever matched, so the current_hash clause is a fail-open guard that passes at the base too. The clauses that actually discriminate are the matcher assertion and the stale-implies-new_ids assertion, both of which fail at the base.'
  command: bin/venv-python -c "import re,pathlib;from scripts.preflight.context_docs import _check_endstate_drift;t=pathlib.Path('docs/PROJECT_CONTEXT.md').read_text(encoding='utf-8');m=re.search(r'ROADMAP-PLATFORM\.yaml\s*@\s*([0-9a-f]{7,40})',t);assert m,'stamp ref half does not resolve through the drift matcher';d=_check_endstate_drift();assert d.get('current_hash') is not None,d;assert (not d['stale']) or d['new_ids'],d;print('AFTER_STAMP_OK ref='+m.group(1)+' stale='+str(d['stale'])+' new_ids='+str(d['new_ids']))"
  expected: 'Exit 0 and one stdout line beginning AFTER_STAMP_OK ref=722df8501dc9d717ead5bf70691bd646839be5d0 -- the ref value is what the command asserts. At the pinned base the rest of the line reads stale=True and a new_ids list naming T4.15, T4.16, T4.17 and T4.18; those ids are evidence about the roadmap''s current drift, not pinned constants. The stale-implies-new_ids clause is conditional on purpose: a legitimately re-stamped roadmap prints stale=False with an empty list and still passes, while the base''s stale=True with an empty list fails -- verified in both directions on a clone at the pinned base. Replay note, checked because the new clause depends on a git object: validate_vp_replay is registered pre=True with no full_segment, so full_sequence never selects it and only the fast tier replays this step -- and pr-validate checks out fetch-depth 0, so the stamped commit object is present and the stale-implies-new_ids clause is evaluable there. The fetch-depth 2 main-validate job never replays it.'
  fix_if: 'An AssertionError on the matcher means the ref half is not a seven-to-forty character lowercase hex string -- restore it; never relax the matcher in scripts/preflight/context_docs.py to accept the prose. A current_hash of None means the drift check took its fail-open branch, which is a real preflight defect: record it and hand it back, do not paper over it here. A stale=True with an empty new_ids list means the ref parsed but the attribution branch still produced nothing -- either the checkout does not carry the stamped commit object (fetch it) or the ref and the stamped sha256 disagree (recompute the id-set hash at the ref and correct the stamp); never drop the clause to obtain green.'
  hermetic: true
  graduation: graduate
  graduation_check_id: endstate-stamp-ref-resolves
- step: 5
  phase: pre-deploy
  action: AFTER, window half. The default the correlation engine is served is a named constant of at least 60, and the parameter default IS that constant rather than a second copy of the number.
  command: bin/venv-python -c "import inspect;from scripts.preflight import env_git;d=inspect.signature(env_git._get_recent_main_commits).parameters['n'].default;assert isinstance(d,int) and d>=60,d;assert d==env_git.MAIN_COMMIT_CORRELATION_WINDOW,(d,env_git.MAIN_COMMIT_CORRELATION_WINDOW);print('AFTER_WINDOW_OK default='+str(d)+' floor=60 old_default=5')"
  expected: Exit 0 and one stdout line reading AFTER_WINDOW_OK default=60 floor=60 old_default=5. The floor of 60 is what the command asserts; a later plan raising the constant above 60 keeps this step green.
  fix_if: 'An AssertionError printing an int below 60 means the window was narrowed -- restore it; the floor is never lowered to obtain green (Decision 181). An AssertionError on the second clause means the default and the constant have diverged into two numbers: make the default reference the constant.'
  hermetic: true
  graduation: graduate
  graduation_check_id: main-commit-correlation-window-floor
- step: 6
  phase: pre-deploy
  action: 'GREEN leg on the working tree: both new classes pass by node id, including the behavioural case that a default call returns the whole window rather than five, and the case that the stamp ref names a commit whose tier_item id set hashes to the stamped fingerprint.'
  command: bin/venv-python -m pytest tests/session/preflight/test_env_git.py::TestRecentMainCommitsCorrelationWindow tests/session/preflight/test_context_docs.py::TestEndstateStampRefResolves -q -p no:cacheprovider --randomly-seed=12345
