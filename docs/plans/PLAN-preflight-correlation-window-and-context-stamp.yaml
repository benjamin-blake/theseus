constraints:
- 'A clause may appear in permanent source ONLY if a named verification_plan step would FAIL were it false. The single new permanent-source clause that meets that bar is the MAIN_COMMIT_CORRELATION_WINDOW constant itself, falsified by step 5 and by the main-commit-correlation-window-floor shard. Its why-comment is accepted EXPLICITLY as an unbacked pointer and is not claimed to be falsifiable: no step and no shard tests the fix-to-triage-lag rationale or the audits/planning-decision-burden-735e69fc.yaml citation the comment carries -- step 5 and the shard falsify only the NUMBER (isinstance int and at least 60). The comment is admitted on the narrower ground that a why-comment naming its own evidence source is how a reader re-derives the number, and it is kept to that one pointer. No other docstring or comment sentence is added.'
- Cite symbols, never line numbers, in every docstring, comment, plan field, shard and PR body.
- 'The docs/PROJECT_CONTEXT.md edit is exactly one line''s ref half: the roadmap_tier_id_set sha256 half stays byte-identical and every other byte of the file is unchanged, asserted line by line against origin/main by step 8. The fingerprint is NOT re-stamped here -- that is a different change with a different premise.'
- 'No hermetic step''s expected text may contain a backtick literal: validate_vp_replay extracts every backtick-delimited substring from expected and asserts it against replayed stdout, so a backtick silently converts prose into an assertion. Re-check every expected field after every revision of this plan.'
