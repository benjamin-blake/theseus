pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- envelope R7, telemetry_sessions governance_notes and telemetry_agents outcome read
- PLAN-telemetry-column-additions merged and its deploy run green (read its VP 10-12 result first)
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  1. Precondition: confirm PLAN-telemetry-column-additions is on main and its deploy-ducklake-lambdas run on the merge
  commit concluded success (mcp__github__actions_list); rebase this branch onto main. If either fails, STOP and tell the
  coordinator.
- >-
  2. Rules PV-1..PV-4 (provenance.py, the pin hook). PV-1 line: "[session_start_log_turn] capture pin
  checkout=<v> base=<v> dirty=<v>", v a validated hex sha or unknown, dirty true|false|unknown; the parser accepts the
  facts only from a hook attachment whose hookEvent is SessionStart and whose command's script stem is
  session_start_log_turn (transcript.PIN_SCRIPT_STEM), matching
  checkout=([0-9a-f]{40}([0-9a-f]{24})?|unknown) base=(same) dirty=(true|false|unknown); anything else yields three
  NULLs and pin_without_checkout. PV-2 open row: the LAST such attachment before the stream's first prompt record
  (stable: the open row is due only after that prompt's turn closed). PV-3 resume row: the such attachment inside that
  resume's hook group (from the group's first attachment to the next user or assistant record). PV-4
  harness_session_key: the FIRST remote_session_change attachment at or before the open row's bound (sessions._open_bound),
  the url's last path segment, kept only when it matches the column pattern (else NULL, harness_session_key_unparsed);
  none at all -> NULL and harness_session_key_absent. Every stream's open row gets PV-4 (sub-agent files carry the
  attachment too); only open and resume rows carry PV-2/PV-3; sub-agent streams have no pin attachment, so their
  checkout columns stay NULL without a counter.
- >-
  3. Rules US-1..US-4 (usage.py; observations.py calls it). US-1: the four classes, reasoning_tokens and
  cache_creation_1h_tokens/_5m_tokens (usage.cache_creation.ephemeral_1h_input_tokens / ephemeral_5m_input_tokens, int
  or NULL) come from the owner record's usage exactly as today. US-2: requested_model = owner.requestedModel (string or
  NULL); reasoning_effort = owner.effort when it matches ^[a-z][a-z0-9_-]{0,31}$ (else NULL, effort_unparsed). US-3: for
  the child stream of a SYNC spawn, the last response of its FIRST turn whose owner has no string stop_reason and is not
  isAbortedMidStream takes the parent's close_result.use_result["usage"] when that is a dict whose input_tokens,
  cache_read_input_tokens and cache_creation_input_tokens equal the record's: output_tokens, reasoning tokens
  (output_tokens_details.thinking_tokens) and the cache split are taken from it, usage_source spawn_result, usage_final
  true, spawn_result_corrected; a mismatch keeps the record (spawn_result_mismatch). Never for background spawns or any
  other call. US-4: otherwise usage_source record and usage_final = (owner stop_reason is a string); false counts
  usage_not_final:root or :subagent. reasoning_visibility keeps its rule over the (possibly corrected) tokens.
- >-
  4. Rules BN-1..BN-2 (streams.py, sessions.py build_agents). BN-1 as the streams scope row. BN-2: a background spawn
  writes one close row per notice (anchor that notice record, block 0, external_ref role_ref(uuid, 0, "agent_close")),
  outcome completed -> success, timeout -> timeout, any other token -> failed with error "notice_status:<token>", no
  status tag -> failed with error "notice_status:absent" (counted notice_status:<token> / notice_status_absent); a spawn
  completed at a resume boundary writes no close (background_completed_at_resume). Sync spawns keep today's outcome rule.
- >-
