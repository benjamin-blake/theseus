constraints:
- >-
  Purity (envelope R7): every new column is a function of the transcript tree alone. No git, environment or clock read
  in src/turn_capture; the checkout enters only through the pin hook's recorded stderr line, the session key only
  through remote_session_change. A row emitted at a cut and built differently later is a defect here, never a test to
  relax.
- >-
  Typed columns only (Benjamin, 2026-10-17): no new key is added to any metadata JSON bag; a value failing its column's
  pattern is stored NULL and counted, never sent to be refused (a refusal halts the session's capture).
- >-
  Graduated checks (turn-capture-*, telemetry-parser-version-registry) keep resolving and are never weakened; the only
  assertion changes are the sanctioned ones in scope, each keeping or tightening its property.
- >-
  Outcomes stay inside the write-enforced telemetry_agents set (success, failed, timeout, throttled); no accepted value
  is added (Decision 210 cl.4).
- >-
  Files near the 500-SLOC limit (streams.py 404, observations.py 384) take new logic in new modules; never a budget raise
  (Decision 128).
- >-
  Public repository (Decision 101): fixtures use synthetic, low-entropy ids and shas; the conformance and probe steps
  print counts only.
- No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
