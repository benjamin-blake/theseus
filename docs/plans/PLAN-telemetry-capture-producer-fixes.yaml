execution_steps:
- >-
  1. Precondition: confirm PLAN-telemetry-column-additions is on main and its deploy-ducklake-lambdas run on the merge
  commit concluded success (mcp__github__actions_list); rebase this branch onto main. If either fails, STOP and tell the
  coordinator. Check whether PLAN-telemetry-golden-harness's build is on main (decides the three conditional scope rows).
- >-
  2. Rules PV-1..PV-4 (provenance.py, the pin hook). PV-1 line: "[session_start_log_turn] capture pin
  checkout=<v> base=<v> dirty=<v>", v a validated hex sha or unknown, dirty true|false|unknown; the parser accepts the
  facts only from a hook attachment whose hookEvent is SessionStart and whose command's script stem is
  session_start_log_turn (transcript.PIN_SCRIPT_STEM), matching
  checkout=([0-9a-f]{40}([0-9a-f]{24})?|unknown) base=(same) dirty=(true|false|unknown); anything else yields three
  NULLs and pin_without_checkout. PV-2 open row: the LAST such attachment before the stream's first prompt record
  (stable: the open row is due only after that prompt's turn closed). PV-3 resume row: the such attachment inside that
  resume's hook group (from the group's first attachment to the next user or assistant record). PV-4
  harness_session_key: the FIRST remote_session_change attachment at or before the open row's bound (sessions._open_bound),
  the url's last path segment, kept only when it matches the column pattern (else NULL, harness_session_key_unparsed);
  none at all -> NULL and harness_session_key_absent. Every stream's open row gets PV-4 (sub-agent files carry the
  attachment too); only open and resume rows carry PV-2/PV-3; sub-agent streams have no pin attachment, so their
  checkout columns stay NULL without a counter.
- >-
  3. Rules US-1..US-4 (usage.py; observations.py calls it). US-1: the four classes and reasoning_tokens come from the
  owner record's usage exactly as today; cache_creation_1h_tokens/_5m_tokens come from
  usage.cache_creation.ephemeral_1h_input_tokens / ephemeral_5m_input_tokens (int or NULL), and each is NULL with
  cache_split_exceeds_total when it is larger than the stored tokens_cache_creation. US-2: requested_model =
  owner.requestedModel (string or NULL); reasoning_effort = owner.effort when it matches ^[a-z][a-z0-9_-]{0,31}$ (else
  NULL, effort_unparsed). US-3: for the child stream of a SYNC spawn, the last response of its FIRST turn whose owner has
  no string stop_reason and is not isAbortedMidStream takes the parent's close_result.use_result["usage"] when that is a
  dict whose input_tokens, cache_read_input_tokens and cache_creation_input_tokens equal the record's: output_tokens,
  reasoning tokens (output_tokens_details.thinking_tokens) and the cache split are taken from it (the split under the
  same US-1 bound), usage_source spawn_result, usage_final true, spawn_result_corrected; a mismatch keeps the record
  (spawn_result_mismatch). Never for background spawns or any other call. US-4: otherwise usage_source record and
  usage_final = (owner stop_reason is a string); false counts usage_not_final:root or :subagent. reasoning_visibility
  keeps its rule over the (possibly corrected) tokens.
- >-
  4. Rules BN-1..BN-2 (streams.py, sessions.py build_agents). BN-1 as the streams scope row. BN-2: every background spawn
  writes one close row per notice (anchor that notice record, block 0, external_ref role_ref(uuid, 0, "agent_close")),
  outcome completed -> success, timeout -> timeout, any other token -> failed with error "notice_status:<token>", a
  malformed tag -> failed with "notice_status:malformed", no status tag -> failed with "notice_status:absent" (counted
  notice_status:<token>, notice_status_malformed, notice_status_absent); a root spawn completed at a resume boundary
  writes no close for the boundary (background_completed_at_resume), and a later notice for it still writes its close
  (notice_after_boundary). Sync spawns keep today's outcome rule.
- >-
  5. Rules SC-1..SC-3 (sessions.py). SC-1: for each root resume boundary b (Stream.resumes, in order), the segment is the
  root records after the previous boundary (or the start) and before b; when it holds a turn with an assistant record,
  one close row: anchor = the last root record before b with a uuid and a parseable timestamp (the existing close-anchor
  rule, bounded by b), external_ref role_ref(anchor uuid, 0, "close"), event_timestamp and source_ordinal from the
  anchor, outcome per C-3 over the segment's last turn; else none (segment_close_skipped). SC-2: the eof close at a
  final pass is unchanged; identical keys dedupe; a resume record stamped earlier than the previous close's anchor is
  counted resume_before_close (a reader-ordering residual, not changed here). SC-3: a resume row is due once its hook
  group has ended (a later user or assistant record in the stream), never at a final pass inside the group, and it
  carries PV-3's facts and execution_attempt as today. rec-4309: failure_reason_dropped when an API error kind fails the
  identifier check.
- >-
  6. switch.py, runner.py (switch_source), transport.py (credential_error), smoke.py, capture.yaml header, the pin hook,
  record_turn.py (version and diag plumbing). Rule DG-1, the per-pass diagnostics counters (local, CaptureResult and the
  runner's diagnostics line): pin_without_checkout, checkout_base_unknown, harness_session_key_absent,
  harness_session_key_unparsed, effort_unparsed, cache_split_exceeds_total, usage_not_final:root,
  usage_not_final:subagent, spawn_result_corrected, spawn_result_mismatch, notice_status:<token>,
  notice_status_malformed, notice_status_absent, background_completed_at_resume, notice_after_boundary,
  segment_close_skipped, resume_before_close, failure_reason_dropped, credential_error, switch_source.
- >-
  7. Contracts: the four contract notes as their scope rows pin, each with an amendment_log entry dated the build day;
  ports.yaml SA-02. Run step 9.
- >-
  8. Tests and fixtures: the scope rows' new nodes, modules and sanctioned changes; corpus builders; the five new golden
  cases. Run steps 1-5 until green BEFORE regenerating any expected_rows; then regenerate every case's expected_rows from
  record_turn, review the diff by kind (new columns on every model_call and on open/resume rows, segment closes on
  resumed cases, background closes, resume rows of trailing hook groups dropped -- hooks_resume_and_compact.json's
  rs3#0/resume is one) and confirm no other row changed; set the registry's v4 entry from the new golden_digest; if the
  golden harness build is on main, re-author its derived files and move aligned traps per the conditional scope rows;
  run step 6.
- >-
  9. Execute the Verification Plan steps 7-12 (step 12 only once the precondition holds); loop until each passes; on an
  unrecoverable V3 failure stop and RCA (Decision 55).
- >-
  10. Send the coordinator the list of golden cases and derived files this build changed, and the VP 8 class counts,
  for slice 4.
- >-
  11. Open the PR (body: the six fixes, the DG-2 checks, VP 7/8/12 logs and counts, the contract notes for Benjamin's
  word). Merge only after code review PROCEED, CI green and Benjamin's own word on the contract notes (fetch his message
  before merging). Squash-merge with "Resolves: rec-4354, rec-4358, rec-4359, rec-4382, rec-4309" in the commit body.
- 12. Run steps 13 and 14 (step 13 from a fresh or rebased session on the merged main).
- 'Report: what was implemented, verification results (counts), and the residual owned by rec-4407.'
work_areas: []
rollback: >-
  Revert in a new PR and bump parser_version to 5 with the v3 behaviour, never back to 3 (the registry is append-only
  and a v4 row is superseded only by a later version, envelope R5). The ten columns stay (PLAN-telemetry-column-additions
  rollback). The pin hook and switch revert with the code; sessions pick the revert up at their next rebase, and the
  switch's origin/main read means setting enabled false on main stops capture in running sessions at their next fetch.
