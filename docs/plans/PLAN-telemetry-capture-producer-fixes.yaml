bundled_recommendations:
- rec-4354
- rec-4358
- rec-4359
- rec-4382
- rec-4309
followon_recs: []
infrastructure_dependencies:
- >-
  Precondition: PLAN-telemetry-column-additions merged and its deploy-ducklake-lambdas run green (its VP 10-12), so the
  live writer declares the ten columns. Merging this plan earlier would make every rebased session's v4 rows draw a 422
  schema_gate, a sticky halt of that session's capture.
- >-
  No Terraform, IAM, Lambda or workflow change; nothing here is Lambda-packaged (src/turn_capture is excluded from the
  data-pipeline bundle, registry check turn-capture-excluded-from-data-pipeline), so the merge deploys nothing. The code
  reaches each session at its next rebase or new session (the hooks load from the checkout; only the switch now follows
  main).
- >-
  The build session's own capture runs v4 from its working tree before the merge, against the live writer; that is the
  intended pre-merge live proof (VP 12), and it is why the precondition above is checked first.
acceptance_criteria:
- >-
  rec-4354: a sync sub-agent's non-final last call takes the spawn result's usage on an exact input-class match; every
  other model_call without a stop_reason carries usage_final false and is counted (VP 1).
- >-
  rec-4358: a background run's close outcome follows its notice status inside the accepted outcome set, one close per
  notice; no notice, no close (VP 2).
- >-
  rec-4382: the first pass after a resume sends the previous segment's close row with no finalization cut, and a
  segment without an assistant turn gets none (VP 3).
- >-
  Open and resume rows carry harness_session_key and the checkout facts from the transcript alone, and model_calls carry
  requested_model, reasoning_effort and the cache-write split (VP 4, VP 1).
- >-
  rec-4359: the switch follows origin/main, then main, then the checkout, and every pass records which it read (VP 5).
- >-
  The golden corpus is regenerated at parser_version 4 with the registry bumped, the resume schedules and every graduated
  turn-capture check still pass, and real transcripts agree with an independent raw walk on every new column (VP 6,
  VP 7, VP 8).
- The amended contracts carry the new rules and the build's live smoke lands every new column on the smoke writer (VP 9, VP 12).
- The five bundled recs read closed after the merge (VP 14).
verification_plan:
- step: 1
  phase: pre-deploy
