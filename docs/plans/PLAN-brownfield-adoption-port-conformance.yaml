schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: brownfield-adoption-port-conformance
intent: Persist the operator-approved brownfield adoption model and port-conformance model as Decisions 211 and 212, give the port
  model a schema-checked home (docs/contracts/ports.yaml, evaluated by a new validate_ports_contract check), add the exit criteria
  that carry both into T4.19, T4.23 and T4.24, and file the four follow-on recommendations -- so the free-tier and init work (Decision
  184 clause 2, T4.22-T4.24) is built against recorded, enforced commitments rather than this repository's implicit structure.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-brownfield-adoption-port-conformance.yaml
phase: 'user_explicit_out_of_scope (soft-warn category): no tier_item is claimed and no exit criterion is closed. The plan ADDS open
  criteria to T4.19 (live, not_started) and to T4.23/T4.24 (deferred_post_mvp) and adds no depends_on edge, so Decision 93''s no-live-dependency-on-a-parked-item
  rule is untouched. Freshness gate run against T4.19/T4.23/T4.24: no silent completion (every criterion open), no stale reference
  in the criteria touched (docs/contracts/executor-loop-definition.yaml is T4.19''s own # new file); nothing to close out.'
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Insert Decision 212 then Decision 211 (verbatim, execution step 2) above Decision 210, and append the dated ''Amended
    by Decision 212'' blockquote to Decision 184 that validate_supersession_annotations requires for the envelope amends: [184] edge.'
- file: docs/contracts/ports.yaml
  action: Create
  purpose: 'Class D contract (ratified via Decision 212): nine ports with required verbs, adapters and tiers, local oracle or recorded
    oracle gap, conformance-suite pointer; coupling_findings seeded PC-01/PC-02; empty structural_assumptions; ambient_trigger AGENTS.md.
    Evaluator {check: validate_ports_contract}.'
- file: scripts/checks/contracts/validate_ports_contract.py
  action: Create
  purpose: Schema and cross-reference evaluator for ports.yaml (execution step 5); the contract's resolving evaluator.
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: Register validate_ports_contract as a pre=True Entry with diff-gated pre_globs (execution step 6).
- file: tests/checks/contracts/test_validate_ports_contract.py
  action: Create
  purpose: 'Mirror test: real-tree positive plus one negative fixture per rule (execution step 7).'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'Classify the new check (validate_ports_contract: schema_drift, beside validate_inference_provider_registry) so validate_ci_rca_taxonomy''s
    every-registered-check-classified rule holds.'
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: Add the `ports` route (topic equals the contract subject) and the amendment_log entry validate_contract_drift requires;
    stays under the 500 effective-line contracts limit (490 today).
- file: AGENTS.md
  action: Modify
  purpose: Add the one-line Safety trigger naming docs/contracts/ports.yaml, paid for by deleting the Merge-protocol 'Canonical authority'
    line that duplicates the Git-ops procedure pointer (net -6 bytes; S1 headroom is 1 byte).
- file: config/prose_budgets.yaml
  action: Modify
  purpose: Ratchet S1 root_ambient_load_set DOWN to the measured post-edit size (a decrease is always permitted).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Add open criteria T4.19 c6, T4.23 c15, T4.24 c9 and c10, and append 212 (T4.19, T4.23) and 211, 212 (T4.24) to related_decisions.
    No status, depends_on or existing-criterion change.
- file: docs/plans/PLAN-brownfield-adoption-port-conformance.yaml
  action: Create
  purpose: This plan artefact.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
- Decisions 211 and 212 exist in docs/DECISIONS.md with the verbatim text of execution step 2, each under the 6144-byte per-entry
  cap, conformant to decision-entry.yaml (envelope with significance), and with reversal-conditions stanzas that scripts.preflight.decision_conditions
  parses (VP steps 6 and 7).
- Decision 184 carries the dated 'Amended by Decision 212' blockquote and validate_supersession_annotations passes; docs/decisions-index.json
  is regenerated and fresh (VP step 7).
- docs/contracts/ports.yaml exists as a ratified Class D contract whose evaluator validate_ports_contract resolves and passes on
  the real tree (VP steps 1 and 4).
- validate_ports_contract rejects each defect class it claims to catch -- unknown tier, missing implemented location, pending adapter
  without owner, unknown owning item, oracle not among adapters, null oracle without gap, coupling row naming an undeclared port
  or a single port, duplicate ids, unknown keys, and an ambient trigger file that no longer names the contract (VP steps 2 and 3).
- The file-router carries the `ports` route and the population gate (validate_contract_drift) and validate_placement pass (VP steps
  4 and 5).
- AGENTS.md carries the one-line ports trigger, the S1 ambient load-set stays within its (ratcheted) budget, and the AGENTS.md contract
  tests still pass (VP steps 10 and 11).
- T4.19 c6, T4.23 c15, T4.24 c9 and c10 exist, open, with the execution-step text; related_decisions carry 211/212 as specified;
  item statuses are unchanged and validate_platform_roadmap plus validate_roadmap_liveness pass (VP steps 8 and 9).
- The four recommendations of execution step 12 are filed through the ops portal with the stated payloads, and dec-211 and dec-212
  are present in the warehouse after the post-merge backfill (VP steps 12 and 13).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prove the ports contract exists and its own evaluator passes on the real tree (the contract's standing guard).
  command: bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f);
    assert not f, f; print('PORTS_CONTRACT_OK')"
  expected: 'Exit 0 with the PASS line and the marker. RED BEFORE, verified by reasoning on this tree: the module does not exist,
    so the import raises ModuleNotFoundError and the interpreter exits 1 (assertion_failed, a genuine red).'
  fix_if: A printed finding names the ports.yaml row or rule that fails; fix the contract row (or, if the row is right, the rule),
    never by loosening a rule to obtain green (implement-scope-boundary.yaml CONTENT invariant).
  hermetic: true
  expected_literals:
  - PORTS_CONTRACT_OK
  graduation: graduate
  graduation_check_id: ports-contract-validates
- step: 2
  phase: pre-deploy
  action: Prove the check rejects a coupling finding that names an undeclared port -- the rule that keeps findings tied to the port
    list Decision 212 clause 6 fixes.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py::test_rejects_coupling_finding_naming_undeclared_port
    -q
  expected: 'Exit 0, one test passed. RED BEFORE: the test file does not exist, so pytest exits 4 (target_absent).'
  fix_if: A failure means rule (a) is missing or the finding is appended without the label; restore the cross-reference rule.
  hermetic: true
  expected_literals:
  - 1 passed
  graduation: graduate
  graduation_check_id: ports-contract-rejects-undeclared-port-coupling
- step: 3
  phase: pre-deploy
  action: Run the full new test module and the contracts manifest mirror test.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py tests/checks/contracts/test__manifest.py
    -q
  expected: Exit 0, every test passing, including the thirteen named tests of execution step 7 and the manifest parametrisations
    for the new Entry. The new module is held to the 100 percent default coverage threshold by test_coverage_checker.
  fix_if: A coverage shortfall names the uncovered branch -- add the negative fixture; never lower a threshold.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Whole-file re-run of a test file this plan creates plus an existing manifest test: both sit inside the
    --pre pytest_diff affected set and the full tier''s whole-suite run, and step 2 already graduates the one behavioural node that
    warrants a standing shard (vp-red-before.yaml hermetic_authoring (v)).'
- step: 4
  phase: pre-deploy
  action: 'Prove the contract-population gate accepts the new Class D file: ratified status with ratified_via, resolving check evaluator,
    subject equal to the router topic, no smuggled shape, ratchet pins unchanged.'
  command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f);
    assert not f, f; print('CONTRACT_DRIFT_OK')"
  expected: Exit 0 and the marker; the census line shows the declared bucket one higher than on origin/main and grandfathered / status_active
    unchanged at 16/16.
  fix_if: '''evaluator does not resolve'' means the check module lacks the executable ''ports.yaml'' literal or is not sequenced;
    ''topic_equals_subject'' means the router topic differs from `ports`.'
  hermetic: true
  expected_literals:
  - CONTRACT_DRIFT_OK
  graduation: waive
  graduation_waiver_reason: validate_contract_drift is itself registered in both tiers and evaluates every docs/contracts file on
    every run; a per-file shard would re-assert what the registered gate already owns.
- step: 5
  phase: pre-deploy
  action: Prove the file-router route for the new contract exists (no registered check enforces route PRESENCE for a new contract).
  command: 'grep -n -x ''  - topic: ports'' docs/contracts/file-router.yaml'
  expected: 'Exit 0 printing the matching route line. RED BEFORE: no such route exists on this tree, so grep exits 1.'
  fix_if: 'Exit 1 means the route is absent or indented differently from the other routes; add it under routes: with targets [docs/contracts/ports.yaml].'
  hermetic: true
  expected_literals:
  - 'topic: ports'
  graduation: graduate
  graduation_check_id: router-route-ports
- step: 6
  phase: pre-deploy
  action: Prove Decisions 211 and 212 exist and their reversal-conditions stanzas parse (Decision 133 monitoring sees them).
  command: 'bin/venv-python -c "import scripts.preflight.decision_conditions as dc; r={x.decision_id: x for x in dc.evaluate() if
    x.decision_id in (211, 212)}; assert set(r) == {211, 212}, sorted(r); assert all(s.state != ''MALFORMED'' and s.error is None
    for s in r.values()), r; print(''STANZAS'', sorted(r), sorted(len(s.conditions) for s in r.values()))"'
  expected: 'Exit 0 printing STANZAS [211, 212] [1, 2]. RED BEFORE: neither entry exists, the set comparison fails and the interpreter
    exits 1 (assertion_failed).'
  fix_if: MALFORMED means the ```yaml reversal-conditions fence or a condition's id/kind/description is malformed; copy the execution-step-2
    text verbatim.
  hermetic: true
  expected_literals:
  - STANZAS [211, 212] [1, 2]
  graduation: graduate
  graduation_check_id: decisions-211-212-stanzas-parse
- step: 7
  phase: pre-deploy
  action: 'Run the decision-corpus gates the two entries and the Decision 184 annotation touch: entry conformance (envelope, significance,
    markers), per-entry size cap, supersession annotation, index freshness.'
  command: bin/venv-python -c "from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance
    as a; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as b; from scripts.checks.decisions.validate_supersession_annotations
    import validate_supersession_annotations as c; from scripts.checks.decisions.validate_decisions_index_freshness import validate_decisions_index_freshness
    as d; f=[]; [g(f) for g in (a, b, c, d)]; assert not f, f; print('DECISION_GATES_OK')"
  expected: 'Exit 0 and the marker; the conformance check reports 2 new entries ([211, 212]); the size check reports no per-entry
    cap failure (measured at plan time: 211 = 4621 bytes, 212 = 5398 bytes, cap 6144).'
  fix_if: A size failure means wording was added -- restore the verbatim text; a supersession failure means the 184 blockquote is
    missing; an index failure means `bin/venv-python -m scripts.decisions_index --write` was not re-run.
  hermetic: true
  expected_literals:
  - DECISION_GATES_OK
  graduation: waive
  graduation_waiver_reason: All four are registered decision-corpus checks that run on every --pre or full invocation; step 6 graduates
    the one property specific to these two entries.
- step: 8
  phase: pre-deploy
  action: Prove the four new open criteria and the related_decisions back-references landed, with no status change.
  command: 'bin/venv-python -c "from pathlib import Path; from scripts.platform_roadmap_state import load; m={t.id: t for t in load(Path(''docs/ROADMAP-PLATFORM.yaml'')).tier_items};
    c=lambda i, k: {x.id: x for x in m[i].exit_criteria}[k]; assert ''change-surface verbs'' in c(''T4.19'', ''c6'').text and ''coupling_findings''
    in c(''T4.23'', ''c15'').text; assert ''structural_assumptions'' in c(''T4.24'', ''c9'').text and ''three repositories'' in c(''T4.24'',
    ''c10'').text; assert all(c(i, k).status == ''open'' for i, k in ((''T4.19'', ''c6''), (''T4.23'', ''c15''), (''T4.24'', ''c9''),
    (''T4.24'', ''c10''))); assert 212 in m[''T4.19''].related_decisions and 212 in m[''T4.23''].related_decisions; assert {211,
    212} <= set(m[''T4.24''].related_decisions); assert m[''T4.19''].status == ''not_started''; assert m[''T4.23''].status == m[''T4.24''].status
    == ''deferred_post_mvp''; print(''ROADMAP_CRITERIA_OK'')"'
  expected: 'Exit 0 and the marker. RED BEFORE: T4.19 has no c6, so the dict lookup raises KeyError and the interpreter exits 1.'
  fix_if: A KeyError names the missing criterion id; an AssertionError names the property (text, status, back-reference).
  hermetic: true
  expected_literals:
  - ROADMAP_CRITERIA_OK
  graduation: graduate
  graduation_check_id: roadmap-port-adoption-criteria
- step: 9
  phase: pre-deploy
  action: Run the roadmap schema/integrity check and the liveness detector over the edited roadmap.
  command: bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as a; from
    scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as b; f=[]; a(f); b(f); assert not f, f; print('ROADMAP_GATES_OK')"
  expected: 'Exit 0 and the marker: RoadmapDocument validates (no live item depends on a deferred_post_mvp item), the touched items
    carry only structured criteria, and liveness reports no new blocking finding.'
  fix_if: A liveness finding about the new T4.19 criterion means a structural rule was tripped -- read its message; never edit config/roadmap_liveness_baseline.yaml
    upward to silence it.
  hermetic: true
  expected_literals:
  - ROADMAP_GATES_OK
  graduation: waive
  graduation_waiver_reason: Both are registered roadmap checks that run in the --pre tier on every roadmap diff; step 8 graduates
    the plan-specific property.
- step: 10
  phase: pre-deploy
  action: Prove the AGENTS.md trigger line landed, the duplicate line is gone and the ambient prose budget holds after the ratchet.
  command: 'grep -c -F ''Executor/adapter/port code: record cross-port couplings'' AGENTS.md && ! grep -q -F ''**Canonical authority:''
    AGENTS.md && bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert
    not f, f; print(''PROSE_OK'')"'
  expected: Exit 0 printing the count 1 then the marker, with no S1 below-budget advisory (the budget equals the measured size).
  fix_if: An over-budget S1 means the trigger line grew; shorten it to the execution-step-8 text rather than raising the budget.
  hermetic: true
  expected_literals:
  - PROSE_OK
  graduation: waive
  graduation_waiver_reason: validate_prose_limits is registered in both tiers, and step 1's validate_ports_contract already guards
    the trigger's presence through rule (f) as a standing check.
- step: 11
  phase: pre-deploy
  action: Prove the AGENTS.md edit breaks none of the existing ambient-instruction pins.
  command: bin/venv-python -m pytest tests/test_pr_ci_red_protocol_contract.py tests/checks/contracts/test_validate_instruction_architecture_layers.py
    tests/checks/contracts/test_validate_claude_md_pointer_invariant.py -q
  expected: Exit 0, all tests passing.
  fix_if: A failure names the AGENTS.md phrase a test pins; keep that phrase and pay for the trigger line elsewhere in AGENTS.md.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file re-runs of existing test modules already inside the --pre pytest_diff affected set for an
    AGENTS.md diff; no new behaviour to shard.
- step: 12
  phase: post-deploy
  action: Prove the four recommendations were filed with their payloads (reader query by exact title prefix, then by id).
  command: 'bin/venv-python -c "from typing import cast; from src.common.ducklake_reader_client import DuckLakeReader, make_reader;
    from scripts.ops_data_portal import _fetch_rec_from_reader as g; r=cast(DuckLakeReader, make_reader()); T=[''Record repo-structure
    and cross-port assumptions'', ''Pre-registered experiment design: operational-memory'', ''Select a maintenance-fork subject'',
    ''Positioning note: comprehension moves'']; ids=[[x[''id''] for x in r.named(''recs_by_title_prefix'', title_prefix=t + ''%'')
    if x[''status''] == ''open''] for t in T]; assert all(len(i) == 1 for i in ids), ids; recs=[g(i[0]) for i in ids]; assert all(''post-mvp''
    in (x.get(''tags'') or []) for x in recs[1:]), recs; assert ''post-mvp'' not in (recs[0].get(''tags'') or []); print(''RECS'',
    [i[0] for i in ids])"'
  expected: Exit 0 printing the four allocated rec ids; exactly one open rec per title, E2-E4 tagged post-mvp and E1 not.
  fix_if: A count of 0 means a filing failed loudly (Decision 84 I-4) -- re-file after restoring reader/writer connectivity; a count
    of 2 means a duplicate filing -- supersede the later one via update_rec.
  hermetic: false
- step: 13
  phase: post-deploy
  action: After the squash-merge, ETL the two Decisions to the warehouse and prove both rows exist.
  command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "from scripts.ops_portal.decisions
    import _fetch_decision_from_reader as g; r=[g(d) for d in ('dec-211', 'dec-212')]; assert all(r), r; print('DECISIONS_ETL_OK')"
  expected: 'Exit 0 and the marker: dec-211 and dec-212 are present in ops_decisions.'
  fix_if: A missing row after a clean backfill means the entry did not parse -- re-run VP step 7 against main.
  hermetic: false
- step: 14
  phase: pre-deploy
  action: Run the full validation tier before the implementation commit (handoff_policy).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with 'All checks passed.' in the full scope summary.
  fix_if: Any failure blocks the commit; on timeout the disposition is blocked -- resume later and rerun from the start.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/checks/contracts/validate_ports_contract.py
  behavior: The ports contract's schema and cross-reference rules (tiers, adapter status companions, owning-item resolution, local
    oracle membership or recorded gap, coupling rows naming two or more declared ports, unique ids, ambient trigger) reject every
    defect class and pass the real contract.
  verification_step: 2
  test_selector: tests/checks/contracts/test_validate_ports_contract.py::test_rejects_coupling_finding_naming_undeclared_port
  red_green_expectation: Red before -- the test module and the check do not exist (pytest exit 4). Green after.
- source: scripts/checks/contracts/_manifest.py
  behavior: The new Entry resolves to the registered validate_ports_contract callable inside the contracts package.
  verification_step: 3
  test_selector: tests/checks/contracts/test__manifest.py
  red_green_expectation: Red before -- no validate_ports_contract parametrisation exists, and once the module lands without the Entry,
    registry.resolve has no manifest row to match. Green after.
- source: docs/contracts/ports.yaml
  behavior: The real contract satisfies every validate_ports_contract rule.
  verification_step: 1
  command: from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v
  red_green_expectation: Red before -- the module and contract are absent (exit 1). Green after; graduated as ports-contract-validates.
- source: docs/contracts/file-router.yaml
  behavior: The router carries the `ports` route equal to the contract subject.
  verification_step: 5
  command: 'grep -n -x ''  - topic: ports'' docs/contracts/file-router.yaml'
  red_green_expectation: Red before -- grep exits 1. Green after; graduated as router-route-ports.
- source: docs/DECISIONS.md
  behavior: Decisions 211 and 212 exist with parseable reversal-conditions stanzas.
  verification_step: 6
  command: import scripts.preflight.decision_conditions as dc
  red_green_expectation: Red before -- the set of decision ids is empty (exit 1). Green after; graduated as decisions-211-212-stanzas-parse.
- source: docs/ROADMAP-PLATFORM.yaml
  behavior: T4.19 c6, T4.23 c15 and T4.24 c9/c10 exist open with the 211/212 back-references and unchanged statuses.
  verification_step: 8
  command: from scripts.platform_roadmap_state import load
  red_green_expectation: Red before -- KeyError on T4.19 c6 (exit 1). Green after; graduated as roadmap-port-adoption-criteria.
- source: AGENTS.md
  behavior: The ports trigger line is present; removing it reddens validate_ports_contract rule (f).
  verification_step: 3
  test_selector: tests/checks/contracts/test_validate_ports_contract.py::test_rejects_ambient_trigger_without_contract_pointer
  red_green_expectation: Red before -- the test module does not exist (pytest exit 4). Green after; the real-tree presence is also
    asserted by graduated step 1 (rule f on the real AGENTS.md).
- source: config/ci_rca_taxonomy.yaml
  behavior: The new check is classified under schema_drift.
  verification_step: 1
  command: from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v
  waiver_reason: 'Pure registry data: validate_ci_rca_taxonomy (registered, --pre) already fails any registered check missing from
    function_to_category, so a dedicated test would duplicate that standing guard.'
- source: config/prose_budgets.yaml
  behavior: S1 budget ratchets down to the measured ambient size.
  verification_step: 10
  command: from scripts.checks.prose.prose_limits import validate_prose_limits as v
  waiver_reason: 'A downward ratchet of a registry value: validate_prose_limits (registered, both tiers) enforces current <= budget
    and validate_prose_budget_raises refuses any unmarked increase, so the value is already guarded.'
constraints:
- 'Decision 67: IMPLEMENTATION only; no STRATEGIC framing, no executor work.'
- 'Decision 86: no new standing prose doc under docs/ -- rationale goes to Decisions 211/212, field semantics to docs/contracts/ports.yaml,
  forward work to roadmap criteria and recs. marketing/ files are the recs'' deliverables under Decision 101 clause (c), never authored
  by this plan.'
- 'Decision 84 Single Portal Invariant: recs are filed only through scripts.ops_data_portal file_rec, after get_rec_write_guidance();
  never edit logs/. Decisions reach ops_decisions only via --backfill-decisions-md after merge.'
- 'Decision texts are operator-approved content: insert them verbatim; any wording change must keep each entry under the 6144-byte
  per-entry cap (decision-entry.yaml size_governance) and be reported, never silent.'
- 'Numbering race (candidate-decision-ratification.yaml): re-check the max ''## Decision NNN:'' header at execution time; if 211
  or 212 is taken, shift both to the next free numbers and update every 211/212 reference in this plan''s edits (Decision texts,
  184 annotation, ports.yaml ratified_via/description, AGENTS.md line, roadmap related_decisions and criterion text, rec tags) in
  the same change.'
- 'Decision 93: add no depends_on edge from a live item to T4.22/T4.23/T4.24; criteria additions only.'
- 'Decision 128 / prose budgets: no SLOC or prose budget raise. The AGENTS.md line is paid for inside AGENTS.md; if the measured
  S1 total exceeds the budget, shorten the line rather than raise (no raise-approved marker is authorised by this plan).'
- 'Repository is PUBLIC (Decision 101): ports.yaml rows name repo paths and public decisions only -- no account ids, ARNs, hostnames
  or credentials.'
- No rescue agents or workaround loops (Decision 55); a failing gate is fixed at its cause, never by weakening a rule (implement-scope-boundary.yaml
  CONTENT invariant).
context:
- 'Operator-approved content (coordinating session brief, 2026-10-06): Decisions A (brownfield adoption) and B (port independence,
  amends 184 cl.2), the ports contract, criteria D, recs E1-E4, AGENTS.md trigger F.'
- 'Decision-entry routing (decision-entry.yaml significance.routing_rule): 211 and 212 -> numbered_decision (all three questions
  yes: durable architecture, reversal-relevant, no other row owns it); 184 annotation -> amendment_forms (amended_by_decision); ports.yaml
  rows -> field_semantics (owning contract); criteria -> work_item (needs exit_criteria lifecycle / deferred_post_mvp classification);
  recs E1-E4 -> work_item default (file_rec); AGENTS.md line -> Layer-1 trigger pointer, no content.'
- 'Registration points inspected: contract-population.yaml (new ratified Class D lands in the declared bucket -- no ratchet pin moves);
  file-router.yaml (route required, topic equals subject); _joins.yaml (not applicable: registers Class A/C field joins, ports.yaml
  has none); scripts/validate.py (no edit: checks aggregate from domain _manifest.py ENTRIES).'
- 'Structural-assumptions home: ports.yaml structural_assumptions, not a T4.24 progress_note -- schema-checked rows beside the coupling
  findings they are found with; progress_note is free text the roadmap treats as status.'
- 'Decision conflicts flagged, not silently resolved: (1) brief B cl.5/cl.6 list a local-runner verdict plane and bare-git change
  surface, but Decision 184 cl.3 (CD.38) makes Actions the verdict plane in all modes -- drafted as conditional on re-deciding 184
