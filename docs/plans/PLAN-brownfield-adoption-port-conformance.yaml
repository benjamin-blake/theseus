  ## Decision 212: Port independence and conformance -- one conformance suite per port with the local adapter as oracle, cross-port coupling is a defect, the ops store is three ports, one file declares the bundle (amends Decision 184 clause 2) (Decided)

  ```yaml
  number: 212
  status: Decided
  decided_date: "2026-10-06"
  amends: [184]
  significance:
    value: numbered_decision
    justification: >-
      Amends Decision 184 clause 2's port rule with a testing model, a port list and a coupling
      rule, under reversal conditions. Not an amendment_forms annotation on 184: the conformance
      oracle, the three-way ops-store split, adapter tiers and platform.yaml clear the bar on their
      own. Not a contract note: docs/contracts/ports.yaml carries the registry and findings this
      entry rules on, never the rule itself.
  ```

  **Status:** Decided
  **Date:** 2026-10-06
  **Warehouse ID:** dec-212 (per Decision 84 backfill)

  **Problem:** Decision 184 clause 2 names ports but not how adapters are tested, what the port list is, or what makes a bundle valid. Testing bundles as a cross-product grows with every adapter, and a port drawn around today's vendors (one ops-store port for Neon plus S3) forces both halves from one vendor.

  **Intent:** Any supported adapter for one port composes with any supported adapter for another, proven per port and without credentials.

  **Decision:**
  1. One suite per port. Each port has ONE conformance suite; adapters are tested against their port's suite, never as a cross-product of ports. A bundle is valid by construction when each adapter passes its port's suite and no cross-port coupling exists; each supported bundle gets one smoke test. Precedent: Kubernetes conformance, the Terraform provider protocol; T4.20's moto-oracle harness is this pattern for orchestration.
  2. Local adapter as oracle. The local adapter is the oracle for every port: cloud adapters must match it under the suite, which runs in CI with no credentials -- against emulators (moto) where they exist, as budgeted nightly live runs under a cost cap where they do not. Where a port has no local adapter yet, docs/contracts/ports.yaml names its interim oracle or its gap (orchestration: the T4.20 moto harness, Decision 185).
  3. Coupling is a defect. An adapter for one port that assumes another port's adapter is a defect -- e.g. an ops-store adapter assuming AWS identity because compute is on AWS, or a verdict plane assuming GitHub's checks API because the git host is GitHub. Findings are rows in docs/contracts/ports.yaml `coupling_findings`. Decision 200's cloud-adapter tenancy enforcement and Decision 184 clause 3's Actions-in-all-modes verdict plane are catalogued there, not resolved here.
  4. The ops store is three ports, matching DuckLake's own separation: catalog (Neon, RDS, any Postgres, a SQLite or DuckDB file), table data files (S3, GCS, Azure Blob, a local directory) and content blobs for transcripts and payloads over 64 KiB (S3, a local directory). Today's deployment is already catalog on Neon, data on S3. Organisations commonly keep the catalog on managed Postgres they already run and data in their own buckets. DuckLake stays the sole ops-store format (Decision 84 I-1); the named-verb boundary (Decision 81) and Decision 197 clause 2's work-item storage port are verb surfaces over these three.
  5. Change surface as verbs. Git hosting is abstracted as the verbs the loop uses (open change, read verdict, post review comment, merge, and any others T4.19 names), never as a platform. GitHub is the first adapter; GitLab and bare git are future adapters, bare git needing a non-Actions verdict plane that first requires re-deciding Decision 184 clause 3.
  6. Port list, by what the loop needs: inference (LiteLLM lane), catalog, table data, content blobs, orchestration host (local interpreter / Step Functions), verdict plane (GitHub Actions; a local runner only after that re-decision), change surface (GitHub), secrets (environment / Secrets Manager), scheduling (local cron / EventBridge).
  7. Tiers. The adapter matrix is tiered supported / community / experimental (Terraform provider labelling), starts at local + GitHub + AWS, and grows only when work demands it.
  8. One declaration file. `ontheloop/platform.yaml` names the adapter per port, schema-validated; `otl doctor` runs the configured bundle's conformance probes read-only against real credentials before the loop runs (cf. `dbt debug`, `terraform validate`).

  **Coverage (Decision 181 cl.2):** registry, oracle and finding shape -- validate_ports_contract over docs/contracts/ports.yaml; each suite -- the owning item ports.yaml names (T4.20, T4.23 and others); the coupling audit -- T4.23 c15; the change-surface verbs -- T4.19 c6; clause 8 -- T4.24, an unenforced residual until it lands.

