execution_steps:
- >-
  1. Precondition: Benjamin's word that the freeze is over. Rebase onto main. Confirm PARSER_VERSION is still 5 and the
  golden index lists 47 cases; if another parser bump or golden change landed, or the sibling plan's build merged
  first, STOP and tell the coordinator before writing code.
- >-
  2. PR A (status source). Edit telemetry_observations.yaml's name rule (scope row), regenerate field_semantics.yaml,
  add the append vector and the PR A tests; run VP 1, VP 2 and VP 12; open PR A (body: the contract change for
  Benjamin's word, the release order). Merge only after code review PROCEED, CI green and Benjamin's own word (fetch
  his message). Then VP 13 on the merge commit's deploy run. PR B's branch starts from main after VP 13 passes.
- >-
  3. Retirement (PR B): delete the functions, flags, constants, command-doc steps and no-op tests (scope rows); add
  the tombstone module; run VP 4.
- >-
  4. Contracts and Decision text (PR B): session-id.yaml, telemetry_sessions.yaml, the PR B sentence in
  telemetry_observations.yaml, ports.yaml SA-02, the Decision 199 Update line, each with its amendment_log entry dated
  the build day. telemetry_observations.yaml ends PR B at or under 498 effective lines (room the sibling plan's
  realization block needs): PR B compacts the name field's block-form 2026-09-24 amendment_log entry to the one-line
  flow form, wording unchanged. Size relief order if a contract would exceed 500 effective lines: new amendment_log entries in the
  one-line flow form; notes extend existing lines (never past 2,000 characters); then compact remaining block-form
  amendment_log entries of that file to the one-line form (the git-ops.yaml precedent, #1535); wording never changes.
- >-
  5. Markers (rule ST-1, markers.py): a STATUS marker is a whole normalised line equal to
  'STATUS v1 source=S result=R' or 'STATUS v1 source=S result=R reason=T' where S and T fullmatch SIGNATURE_PATTERN and
  R is done, skipped or failed; parse_markers returns Marker("status", S, line, R). format_status_marker builds exactly
  that line and raises ValueError on any token outside its class.
- >-
  6. Workflow attribution (sessions.py). WA-1: a stream's open-row workflow is the first prompt record's command-name
  tag when it names a WORKFLOWS member (unchanged); else WA-2: the first tool_use block of the stream, in file order,
  whose record line is at or before _open_bound, whose name is "Skill" and whose input.skill (a string, lowercased,
  one leading "/" dropped) is a WORKFLOW_SKILLS key, mapped to its value; the tool_result is never read, so an errored
  call counts; diag workflow_from_skill counts each stream so attributed; else WA-3: "subagent" for a child stream,
  "claude_code" for the root. WORKFLOW_SKILLS = {orient: orient, planning: plan, implement: implement, overseer:
  overseer, audit-prompt: audit, plan-critique: plan-critique, decision-scout: decision-scout, code-review:
  code-review, executor-rca: executor-rca}; develop-executor stays command-only (no skill). Run VP 5.
- >-
  7. Status rows (gate_events.py). ST-2: a Bash tool_call with a matched result is scanned when its command contains a
  GATE_COMMAND_TOKENS or a STATUS_COMMAND_TOKENS ("-m scripts.", "scripts/") member; the scanned text is today's (the
  persisted sidecar when present, same cap and gate_scan_unavailable counter). ST-3: gate and pre-commit markers count
  only when the command holds a gate token (today's rules, tail floor for gate markers); status markers count only
  when it holds a status token and only at or after the last-200-line floor. ST-4: a status marker with result done
  emits nothing; skipped and failed emit one process_event point named status:S.R, severity warning (skipped) or
  error (failed), metadata exactly {marker_version: STATUS_MARKER_VERSION, tool_use_id}, role gate_event.<n> numbered
  with the gate rows of the same output, deduped per (source, signature) where the signature is S.R. Run VP 6.
- >-
  8. Version, corpus and fixtures (PR B): PARSER_VERSION 6 and PRODUCER_VERSION "turn-capture-6"; any other test or
  fixture that hard-codes parser_version 5 or "turn-capture-5" outside the golden files (git grep both) gets the same
  sanctioned pin change, listed in the PR body; the three new cases and their builders. Run VP 3-6 until green BEFORE
  regenerating any expected_rows; then regenerate every case's expected_rows from record_turn, review the diff by kind
  (parser_version on every row; workflow values and status rows only in the new cases; nothing else) and confirm no
  other row changed; set the registry's v6 entry from the new golden_digest; re-author both derived_golden files by
  hand; run VP 7.
- >-
  9. Execute VP 8 (local real trees), VP 9 (live smoke) and VP 10 (sweep); loop until each passes; on an unrecoverable
  V3 failure stop and RCA (Decision 55).
- >-
  10. Rec bookkeeping through the portal (Decision 84/66: call get_rec_write_guidance first; each write fails loudly if
  the writer is unreachable). update_rec rec-4589: acceptance becomes "bin/venv-python -m pytest
  tests/session/test_session_cli_retired.py -q" and its context gains one dated sentence naming the retirement design
  (the original asks 2-4 are answered by removal). update_rec rec-4030: remove the "[2026-09-24] Also retire the live
  UUID4 session minter ..." sentence from context; title, file and acceptance unchanged. update_rec rec-2510: title
  and context keep only the imported-flag backfill intent (the postflight writer-rewire half is superseded by
  rec-4589's retirement, said in one dated sentence), acceptance becomes its first awk/grep leg alone (T3.20 names the
  imported flag), tags gain telemetry-project, status stays open. Then VP 11.
- >-
  11. Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml) for PR B, each outcome reported separately:
  readiness check; coverage diagnostic; set implementation_declared true; rebase on origin/main; VP 12 on the
  committed clean tree; the postflight evidence file and scripts.session.postflight --evidence; push; PR (body: the
  rules, VP 8/9 counts, the build session's own root session ref and harness_session_key, the contract and Decision
  text for Benjamin's word, the sanctioned pin changes); CI green on the head. Merge only after code review PROCEED,
  CI green, VP 13 passed for PR A, and Benjamin's own word on the text (fetch his message). Squash-merge with
  "Resolves: rec-4589" in the body.
- >-
  12. Send the coordinator: the build session's root session ref and harness_session_key (its v6 rows are untrusted),
  the request to start a fresh session on the merged main for VP 15, and the note to the sibling plan that PR B is
  merged. VP 14 runs on the first golden replay after the merge; post VP 13-15 results as one counts-only comment on
  PR B.
