    expectations=[1-9][0-9]* .*mismatches=0" "$REPLAY_LOG"
  expected: rec-4589 closed and one matching GOLDEN_SMOKE line from a run that concluded success; report it verbatim.
  fix_if: >-
    rec-4589 open: check ci.yml's closure job on the squash commit (its acceptance verdict); close through update_rec
    with the PR as evidence only if the verdict holds. A replay mismatch with the local harness green is an engine or
    transport defect: file it through the portal and fix forward; never relax an expectation.
