schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retire-session-cli
intent: >-
  Retire the workflow "telemetry session" CLI (scripts.session.preflight --open-session and scripts.session.postflight
  --close-session), a stub left by PR #969 that records nothing, loses its id with a cleaned worktree and prints
  outcome=success when it skipped (rec-4589), and restore from the transcript the one fact it was meant to carry that
  nothing else captures: which workflow a sub-agent or relay-started session ran (claude_code parser_version 5 -> 6).
  The same bump teaches the parser a structured STATUS v1 line so the sibling prevention plan's CLIs can report a skip
  or failure as a telemetry warning instead of a false success. Telemetry is the learning signal of the self-improvement
  loop (PROJECT_CONTEXT); a dead surface that claims to record, and work it cannot attribute, teach it the wrong lessons.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V3
plan_path: docs/plans/PLAN-retire-session-cli.yaml
phase: >-
  ad_hoc_rec (defect rec-4589, Medium, tagged telemetry-project; Benjamin asked for the plan on 2026-10-24). Closes no
  roadmap exit criterion: closes_criteria is empty by design. Related tier items, none of whose criteria this plan
  flips: T3.20 (c9, CI-run sessions marked with their workflow, stays rec-4415's and keeps precedence room, because a
  CI marker would be read before the fallback), T3.22 (c5 owns the top-level workflow vocabulary; this plan adds no
  closed set). V3 because PR A changes config/lambda/ducklake/field_semantics.yaml, which is packaged into the five
  active DuckLake Lambdas (writer, reader, maintenance, maintenance-smoke, telemetry writer) and deploys through the
  governed deploy-ducklake-lambdas.yml channel (Decision 79/125/126); PR B deploys nothing (src/turn_capture is
  excluded from every Lambda bundle).
amends: ['dec:199#3']
scope:
