    '^(hook|gate|precommit|status):[A-Za-z0-9_][A-Za-z0-9_.-]{0,199}$'; the name semantics' closed source list reads
    "hook, gate, precommit or status"; one flow-form amendment_log entry (accepted source added, cl.4: shipped with a
    writer deploy before any producer emits it). PR B adds, in the same semantics text, that from parser_version 6 the
    claude_code producer emits status:<source>.skipped (severity warning) and status:<source>.failed (severity error)
    from STATUS v1 lines in the last 200 output lines of a Bash tool_call whose command names a repo CLI (-m scripts. or
    scripts/), role gate_event.<n>, done emitting nothing and reason never stored; one more flow-form amendment_log
    entry. The file is at 497 of its 500 effective lines (Decision 166 contracts class): notes extend existing lines,
    and if a commit would cross 500, execution step 4's relief order applies. Wording never changes meaning; never a
    budget raise, never a split.
