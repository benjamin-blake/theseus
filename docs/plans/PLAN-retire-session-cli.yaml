infrastructure_dependencies:
- >-
  FREEZE: nothing in this plan builds, pushes or merges until Benjamin says the repository transfer freeze is over
  (memory PAUSE, 2026-10-20). The build then rebases onto the renamed repository's main.
- >-
  PR A deploys: field_semantics.yaml is packaged into the five active DuckLake Lambdas and ships through
  deploy-ducklake-lambdas.yml on merge (Decision 125/126; never a local build_lambda --deploy). No Terraform, IAM or
  column change, so no apply and no add-column step (Decision 222 does not fire). Under the 2026-10-14 deploy rule a
  CI DuckLake deploy is not itself always-ask, but PR A's Class A contract change needs Benjamin's own word.
- >-
  Release order (Decision 210 cl.4, load-bearing): PR B merges only after PR A's deploy run concluded success with its
  --lambda-telemetry smoke green, because a writer refusal halts a session's capture for good (runner.py writes
  halt.json on writer_refused). The sibling prevention plan's emitters merge only after PR B.
- >-
  PR B deploys nothing: src/turn_capture is excluded from every Lambda bundle (registry check
  turn-capture-excluded-from-data-pipeline). Sessions pick v6 up at their next rebase or new session; the build
  session's own passes run the working-tree producer while it changes, so its rows are untrusted and its root session
  ref and harness_session_key go in the PR B body and the coordinator handoff (the v4 and v5 builds' rule).
acceptance_criteria:
- >-
  The workflow session CLI is gone: both modules refuse the six retired flags with an argparse error, the three
  symbols no longer exist, no command doc or skill invokes them, and the tests that asserted the no-op are deleted,
  not rewritten (VP 4).
- >-
  The deployed writer accepts a status:<source>.<result> process_event and still refuses a sourceless name; the
  contract and its projection name the status source (VP 1, VP 2, VP 12).
- >-
  Parser v6 attributes a workflow to sub-agent and relay-started streams from the first workflow Skill call at or
  before the open bound (errored calls count), gate skills under their own names, the command-name tag still first,
  fallbacks subagent and claude_code unchanged, and nothing read past the bound (VP 5, VP 7).
- >-
  STATUS v1 lines parse only as whole lines in the last 200 output lines of repo CLI commands: skipped is a warning
  row, failed an error row, done no row, reason never stored, gate scanning unchanged, and nothing outside markers.py
  emits the line yet (VP 3, VP 6).
- >-
  The golden corpus is regenerated at parser_version 6 with the registry bumped and three new cases; the graduated
  turn-capture checks still pass; the live smoke lands v6 rows; real local transcripts attribute a workflow from a
  Skill call (VP 7, VP 8, VP 9, VP 10).
- >-
  Contract and Decision text match the code: session-id.yaml names no live legacy producer, Decision 199 carries a
  dated retirement line, telemetry_sessions and telemetry_observations declare the v6 rules, ports.yaml SA-02 names
  the Skill shape and the skill-name assumption (VP 2, VP 6).
- >-
  rec-4589 closes through the Resolves trailer against its re-authored acceptance; rec-4030 no longer carries the
  open_telemetry_session rider; rec-2510 keeps only its imported-flag half, tagged telemetry-project (VP 11, VP 14).
