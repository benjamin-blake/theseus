    test -s "$DEPLOY_JOBS_JSON" && test -s "$SMOKE_LOG_FILE" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs" && grep -qF 'LAMBDA_TELEMETRY OK'
    "$SMOKE_LOG_FILE" && echo STATUS_SOURCE_LIVE_OK
