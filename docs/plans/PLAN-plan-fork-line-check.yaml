schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-fork-line-check"
intent: >-
  Make the plan fork line a checked record instead of an honour-system one: a forward-only, exceptionless check judges
  every context[] fork line a diff adds or changes against overseer-dispatch.yaml's record_grammar, and on a
  consistency-only line also requires reversible: yes and precedent pointers that resolve, so a decided-with-notice
  fork can no longer cite nothing, a superseded Decision, a missing contract or another notice line. What no check can
  decide (whether the precedent settles the fork, convention-fit, no credible alternative, always_ask) stays a residual,
  narrowed and re-owned by rec-4786; rec-3530 is superseded. Prerequisite of PLAN-operator-decision-journal-kind
  (PR #1754), whose operator_decision journal row later retires the line.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-fork-line-check.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-3530, the
  residual owner named in overseer-dispatch.yaml autonomy_tiers.plan_fork_classification.enforcement_coverage, ruled a
  prerequisite of the operator decision journal plan by Benjamin on 2026-10-30. Closes no roadmap criterion.
closes_criteria: []
scope:
  - file: scripts/roadmap/plan_fork_lines.py
    action: Create
    purpose: >-
      Pure engine, no git and no direct filesystem access: every file it needs (docs/decisions-index.json, a cited
      contract, a referenced plan) is requested by repo-relative path through a caller-supplied read(rel) -> str | None,
      and it never lists a directory. Never raises on bad input; returns findings. FIELDS (fork, chosen, class,
      precedent, precedent_kind, reversible, persisted) and the enums CLASS (consistency-only, asked), PRECEDENT_KIND
      (decision, contract, answered-fork, none) and REVERSIBLE (yes, no) are module constants, and
      template_from_record_grammar(text) extracts the quoted template from record_grammar so a caller can assert they
      agree (Decision 169 derive-and-assert; the contract stays the one rule source, Decision 210 clause 3). The
      comparison rule: FIELDS, CLASS and REVERSIBLE equal the template's exactly; PRECEDENT_KIND minus "none" equals the
      template's precedent_kind enum; "none" is admitted only because record_grammar carries the sentence "precedent:
      none | precedent_kind: none is legal ONLY on a class: asked line", which the comparison also asserts. A context[]
      entry is a fork record when its stripped text starts with "fork:" or it contains " | class: " or
      " | precedent_kind: " (a near-miss that does not start with "fork:" is itself a failure). Parsing splits on " | "
      only where the next expected key follows, so " | " inside prose is tolerated and a missing or reordered key still
      fails. Grammar failures: wrong key order or count, an empty value, an enum value that is not the bare literal
      (text after it included; "decided-with-notice" gets the message "the notice tier, not a class: write class:
      consistency-only"), precedent exactly "none" with a non-none kind, and precedent or precedent_kind none on a
      consistency-only line. Asked lines keep free precedent text (who answered, delegated provenance). Pointer failures,
      consistency-only lines only: reversible not yes; no pointer of the line's kind; any pointer of that kind that does
      not resolve. decision pointers are "Decision NNN" tokens, resolved against docs/decisions-index.json. Missing
      fails. Superseded fails: currency superseded_compacted, or a retired row with no currency whose status starts
      "Superseded"; the message names the successor (superseded_by, else the status text's "Decision N"). Currency
      superseded_pointer (Decision 80 today) is a WARN naming the entry whose supersedes list holds it, never a failure,
      since decision-entry.yaml currency.consumer_contract lets only superseded_compacted remove an entry from a
      consumer's active set. contract pointers are "docs/contracts/<name>.yaml" or a bare "<name>.yaml" not preceded by
      "/", where <name> is one path segment matching [A-Za-z0-9_][A-Za-z0-9_.-]*, resolved under docs/contracts/, with
      an optional "#dotted.key" anchor walked through the parsed mapping (a small local walk; Decision 104 keeps
      check-domain helpers out of scripts/roadmap). answered-fork pointers are "PLAN-<slug> fork <n>" with <slug>
      matching [a-z0-9][a-z0-9-]*: the plan must not be the one being judged, docs/plans/PLAN-<slug>.yaml must exist and
      parse, and its n-th context[] entry starting "fork:" (1-based) must contain "| class: asked" as a word. Findings
      carry a severity, fail or warn. Each referenced path is requested at most once per call. "fork <n>" counts
      context[] entries starting "fork:"; a near-miss that does not is reported as "context[<i>]" (0-based). CLI:
      `bin/venv-python -m scripts.roadmap.plan_fork_lines PLAN.yaml ...` binds read to the working tree and judges every
      fork line of the named plans (not diff-scoped), prints one line per finding naming the plan path, the ordinal, the
      rule and the template, and exits 1 on any failure, else 0.
  - file: scripts/checks/roadmap/validate_plan_fork_lines.py
    action: Create
    purpose: >-
      Registered check validate_plan_fork_lines (both tiers). First reads record_grammar from
      docs/contracts/overseer-dispatch.yaml and fails loudly if template_from_record_grammar disagrees with the engine
      constants. Base is _common.status_diff_base(root) (Decision 159: no second resolver); None ->
      registry.skipped("diff base unreachable"). Judges only docs/plans/PLAN-*.yaml paths with status A, M or ?? in
      get_status_aware_diff: the new entries are the head context[] fork records minus the base file's (a multiset
      difference; an added file has an empty base), so a line already on the base is never re-judged and there is no
      waiver, marker or grandfather (Decision 163 point 1). A head plan whose YAML does not parse is reported as a WARN
      and skipped (validate_plan_documents owns that failure). registry.examined(n, unit="fork_lines") with n the lines
      judged, examined(0) on a diff with none (Decision 170). Failures print path, fork ordinal and the engine message,
      then append "Plan fork-line validation". Seams root/base/changed/read_base/read_head as in
      validate_test_skip_citations.run_check; the engine's read is bound to read_head (the working tree, or `git show
      <head>:<rel>` under the CLI's `--base REF --head REF` replay, so pointers resolve at REF). Reads, bounded: the
      diff's plan paths (base and head), docs/contracts/overseer-dispatch.yaml, and the engine's own requests. run_check
      and the engine make no git call and open no file except through the seams, and never glob or list docs/plans; the
      registered entrypoint's only enumeration is _common.get_status_aware_diff. A missing record_grammar, or one with
      no extractable template, is a failure, never a skip. WARN findings print without failing. A plan renamed in the
      diff arrives as an added path (--no-renames), so all its lines are judged; accepted.
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_plan_fork_lines: pre=True, pre_globs ("docs/plans/**",
      "docs/contracts/overseer-dispatch.yaml", "scripts/roadmap/plan_fork_lines.py",
      "scripts/checks/roadmap/validate_plan_fork_lines.py", "scripts/checks/_common.py", "scripts/checks/registry.py"),
      full_segment="full_after_lint" (the validate_plan_documents shape; Decision 187: the globs name the defining module).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "function_to_category row `validate_plan_fork_lines: schema_drift`, beside validate_plan_documents."
  - file: tests/test_plan_fork_lines.py
    action: Create
    purpose: >-
      Engine tests. TestGrammar: a conforming line parses; one failing case per grammar rule (order, missing key, empty
      value, each enum with a trailing note, decided-with-notice, none pairing, none on consistency-only, near-miss) and
      " | " inside the fork sentence passes. TestConsistencyOnlyPointers, over a tmp_path fixture tree (index, contracts,
      plans): reversible no fails; each kind passes with a resolving pointer and fails when it is missing, unresolved,
      superseded (decision), has a bad anchor (contract), points at its own plan, an out-of-range ordinal or a
      consistency-only line (answered-fork); asked lines are never pointer-checked. TestGrammarMatchesContract: the
      constants equal template_from_record_grammar over the repo contract, and a mutated template fails. TestCli: exit 1
      with a named failure on a bad fixture plan, 0 on a good one.
  - file: tests/checks/roadmap/test_validate_plan_fork_lines.py
    action: Create
    purpose: >-
      Check tests through the seams. TestOnlyNewLinesAreJudged: a bad line already on the base passes; the same bad line
      added, or an edited base line, fails; an added plan judges all its lines; non-plan paths and deleted plans are
      ignored. TestBoundedReads (Benjamin's CI-time concern): over a fixture tree holding the diff plan, one plan its
      answered-fork pointer names, two unreferenced plans (one an unparseable sentinel) and the index and contracts, both
      seams served from an in-memory dict, the set of paths requested equals exactly the diff plan, the contract, the
      index, each cited contract and the one referenced plan; and with every module imported first and then
      builtins.open, io.open, pathlib.Path.open, Path.read_text, Path.read_bytes, Path.glob, Path.rglob, Path.iterdir,
      os.listdir, os.scandir, glob.glob, subprocess.run, subprocess.Popen and scripts.checks._common.run all patched to
      raise for the whole call, run_check and the engine still complete. TestContractDrift: a record_grammar whose
      template disagrees with the engine constants appends a failure naming the field; a missing record_grammar, or one
      with no extractable template, fails and is never skipped. TestAccounting: base None ->
      skipped; no plan in the diff -> examined(0).
  - file: docs/contracts/overseer-dispatch.yaml
    action: Modify
    purpose: >-
      APPROVED_CONTRACT verbatim (execution_steps): record_grammar gains the pointer rules; enforcement_coverage gains the
      mechanical validate_plan_fork_lines row and the residual row narrows to rec-4786; amendment_log gains one entry and
      the 2026-09-03 and 2026-10-18 entries are compacted to one line each (Decision 166 relief valve; on main b91b6b0f,
      498 effective lines before and 495 of 500 after).
  - file: tests/test_plan_fork_classification_contract.py
    action: Modify
    purpose: >-
      New class TestForkLineCheckCoverage: the mechanical row for the fork line names enforced_by
      validate_plan_fork_lines and registry.resolve accepts that name; that name is a check step in both
      registry.pre_sequence() and registry.full_sequence(); the residual row's owner is rec-4786; record_grammar carries
      "'Decision NNN'", "docs/contracts/", "'PLAN-<slug> fork <n>'" and "bare literal"; negatives (enforced_by deleted,
      renamed to an unregistered name, owner reset to rec-3530, and the registry Entry swapped via monkeypatch.setitem on
      registry._ALL_ENTRIES for dataclasses.replace(entry, pre=False) and for full_segment=None) fail. Existing tests unchanged; rec-3541 and
      rec-3542 stay out of scope.
bundled_recommendations:
  - rec-3530
followon_recs:
  - rec-4786
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A context[] fork line that a diff adds or changes in docs/plans/PLAN-*.yaml fails validate_plan_fork_lines unless it
    carries the seven record_grammar fields in order with bare enum literals and legal none pairing; a near-miss entry
    fails; a line already on the diff base is never judged; there is no waiver, marker or grandfather.
  - >-
    On such a consistency-only line, reversible must be yes and precedent must carry at least one pointer of its kind,
    every one of which resolves: a current Decision, a docs/contracts file with any anchor present, or another plan's
    n-th fork line that is class: asked.
  - The check fails loudly when record_grammar's template and the engine constants disagree under the scoped comparison rule.
  - >-
    On CI, run_check and the engine read only through the injected seams: no docs/plans file outside the diff except one
    referenced plan per answered-fork pointer, no directory listing, no git call and no direct file open; the registered
    entrypoint's only enumeration is _common.get_status_aware_diff.
  - >-
    In docs/contracts/overseer-dispatch.yaml the three APPROVED_CONTRACT replacements and the one appended
    amendment_log line land verbatim (the date only varies), no other line changes, and the file stays at or under 500
    effective lines; the contract test pins that the new row's enforced_by is a check registered in both tiers and the
    residual owner is rec-4786.
  - rec-3530 is superseded by rec-4786 with the approved resolution after merge; the merge carries no Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Every grammar rule fails its malformed case and a conforming line passes.
    command: bin/venv-python -m pytest tests/test_plan_fork_lines.py::TestGrammar -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: A malformed case passes -> fix the parser or the rule, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-grammar
  - step: 2
    phase: pre-deploy
    action: Consistency-only lines need reversible yes and resolving pointers of their kind; asked lines are not pointer-checked.
    command: bin/venv-python -m pytest tests/test_plan_fork_lines.py::TestConsistencyOnlyPointers -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: >-
      An unresolved, superseded, self or notice-line pointer passes, or a superseded_pointer Decision fails -> fix the
      resolver.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-precedent-pointers
  - step: 3
    phase: pre-deploy
    action: The engine constants agree with the repo contract's record_grammar under the comparison rule; a mutated template fails.
    command: bin/venv-python -m pytest tests/test_plan_fork_lines.py::TestGrammarMatchesContract -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: A mismatch -> the engine constants drifted from the frozen contract; fix the constants, never the contract or the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-grammar-matches-contract
  - step: 4
    phase: pre-deploy
    action: Only fork lines new against the base are judged.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_fork_lines.py::TestOnlyNewLinesAreJudged -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: A base line is judged or an added line is not -> fix the multiset difference.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-new-lines-only
  - step: 5
    phase: pre-deploy
    action: >-
      The check reads exactly the diff plans, the contract, the index, cited contracts and one plan per answered-fork
      pointer, only through the seams, with no listing, git call or direct file open.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_fork_lines.py::TestBoundedReads -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: >-
      An extra path is read, or a patched listing, open or subprocess call fires -> route the read through the injected
      reader; never widen the expected set or drop a patch.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-bounded-reads
  - step: 6
    phase: pre-deploy
    action: A record_grammar template that disagrees with the engine constants fails the check.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_fork_lines.py::TestContractDrift -q
    expected: Exit 0, every node passes. Red before because the file does not exist.
    expected_literals: []
    fix_if: A drifted template passes -> the check must compare before judging any line.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-line-contract-drift-fails
  - step: 7
    phase: pre-deploy
    action: Accounting and skip paths, and the engine CLI's exit codes.
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_fork_lines.py::TestAccounting
      tests/test_plan_fork_lines.py::TestCli -q
    expected: Exit 0, every node passes.
    expected_literals: []
    fix_if: A silent green on an unreachable base -> call registry.skipped; a wrong CLI exit -> fix main().
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_accounting already fails any registered check that declares neither examined nor skipped, and the
      CLI is a thin wrapper over the engine path steps 1 and 2 graduate; step 10 exercises it on real plans.
  - step: 8
    phase: pre-deploy
    action: The contract's new coverage rows and record_grammar pointer rules are pinned, and the check runs in both tiers.
    command: bin/venv-python -m pytest tests/test_plan_fork_classification_contract.py::TestForkLineCheckCoverage -q
    expected: Exit 0. Red before because the class does not exist.
    expected_literals: []
    fix_if: A pin fails -> the contract differs from APPROVED_CONTRACT; fix the contract, never the pin.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-fork-classification-coverage-rows
  - step: 9
    phase: pre-deploy
    action: The existing contract-shape and project-alignment tests still pass on the amended contract.
    command: bin/venv-python -m pytest tests/test_plan_fork_classification_contract.py tests/test_project_alignment_contract.py -q
    expected: Exit 0.
    expected_literals: []
    fix_if: A pinned clause moved -> restore it; APPROVED_CONTRACT keeps every pinned phrase.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of files this plan modifies; they already run in every --pre that touches them.
  - step: 10
    phase: pre-deploy
    action: Real-data discrimination and dogfood.
    command: >-
      out=$(bin/venv-python -m scripts.roadmap.plan_fork_lines docs/plans/PLAN-admin-terraform-assets-session-hook.yaml
      2>&1); rc=$?; test "$rc" -eq 1 && printf '%s' "$out" | grep -q 'PLAN-admin-terraform-assets-session-hook.yaml'
      && printf '%s' "$out" | grep -q 'fork 1' && ! printf '%s' "$out" | grep -q Traceback && bin/venv-python -m
      scripts.roadmap.plan_fork_lines docs/plans/PLAN-plan-fork-line-check.yaml
    expected: >-
      The historical plan's four-field lines are reported by path and "fork 1" with exit 1 and no traceback; this plan's
      own fork lines pass, so the whole command exits 0.
    expected_literals: []
    fix_if: >-
      The historical plan passes -> the parser is too lenient; a traceback -> the engine raised; this plan fails -> fix
      its context fork lines only if the failure is a typo against the approved text, else STOP and escalate.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Pins one historical plan's text as a one-time real-data proof; the standing guards are steps 1-6.
  - step: 11
    phase: pre-deploy
    action: The branch's own diff passes the new check, and the contract stays under its size cap.
    command: >-
      bin/venv-python -m scripts.checks.roadmap.validate_plan_fork_lines && bin/venv-python -c "from
      scripts.checks.structural.size_limits import validate_structural_size_limits as v; f=[]; v(f); assert not f, f"
    expected: Exit 0 from both, no FAIL line.
    expected_literals: []
    fix_if: The contract is over 500 effective lines -> it differs from APPROVED_CONTRACT; never raise the budget.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on this branch's diff; both registered checks run on every PR.
  - step: 12
    phase: pre-deploy
    action: Full validation before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    expected_literals: []
    fix_if: Any failure -> fix on the branch and rerun from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 13
    phase: post-deploy
    action: rec-3530 superseded by rec-4786; rec-4786 open.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;p='agent_platform';a=f('rec-3530',
      p) or {};b=f('rec-4786',p) or {};print(a.get('status'),b.get('status'));assert a.get('status')=='superseded' and b.get('status')=='open' and
      'rec-4786' in (a.get('resolution') or '')"
    expected: Exit 0 and "superseded open" printed.
    fix_if: rec-3530 still open -> run APPROVED_REC_UPDATE (only the PR number and merge sha may vary).
    hermetic: false
test_obligations:
  - source: scripts/roadmap/plan_fork_lines.py
    behavior: Every grammar rule rejects its malformed case and a conforming line passes.
    verification_step: 1
    test_selector: tests/test_plan_fork_lines.py::TestGrammar
    red_green_expectation: red before (file absent), green after
  - source: scripts/roadmap/plan_fork_lines.py
    behavior: >-
      On a consistency-only line, reversible no and every missing, unresolved, superseded, self or notice-line pointer
      fails; a superseded_pointer Decision only warns.
    verification_step: 2
    test_selector: tests/test_plan_fork_lines.py::TestConsistencyOnlyPointers
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/roadmap/validate_plan_fork_lines.py
    behavior: Only fork lines new against the diff base are judged; base lines never are.
    verification_step: 4
    test_selector: tests/checks/roadmap/test_validate_plan_fork_lines.py::TestOnlyNewLinesAreJudged
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/roadmap/validate_plan_fork_lines.py
    behavior: >-
      The check reads only the diff plans, the contract, the index, cited contracts and one plan per answered-fork
      pointer, through the seams only, with no listing, git call or direct file open.
    verification_step: 5
    test_selector: tests/checks/roadmap/test_validate_plan_fork_lines.py::TestBoundedReads
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/overseer-dispatch.yaml
    behavior: The coverage rows name a registered check and the successor owner, and record_grammar carries the pointer rules.
    verification_step: 8
    test_selector: tests/test_plan_fork_classification_contract.py::TestForkLineCheckCoverage
    red_green_expectation: red before (class absent), green after
  - source: scripts/checks/roadmap/_manifest.py
    behavior: The new Entry places validate_plan_fork_lines in both pre_sequence() and full_sequence().
    verification_step: 8
    test_selector: tests/test_plan_fork_classification_contract.py::TestForkLineCheckCoverage
    red_green_expectation: red before (the name is in neither sequence), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check maps to a failure category.
    verification_step: 12
    command: bin/venv-python -m scripts.validate
    waiver_reason: validate_ci_rca_taxonomy fails on a registered check with no taxonomy row; step 12 runs it.
constraints:
  - >-
    Every scope file stays under 500 SLOC (Decision 128); a Create file that would exceed it is not split into an
    undeclared file: STOP and amend this plan's scope first, then decompose.
  - >-
    docs/contracts/overseer-dispatch.yaml changes only by APPROVED_CONTRACT; any other contract wording needs Benjamin's
    new approval. Never raise its structural budget.
  - Never edit a historical plan's fork lines; the check is forward-only by design.
  - No rescue agents or workaround loops (Decision 55).
