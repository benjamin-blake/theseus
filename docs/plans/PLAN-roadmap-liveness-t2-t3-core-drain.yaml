rollback: >-
  Single data-only commit touching no runtime code. Revert restores all three blocking edges and
  the seven baseline ids together; leg A(a) then re-requires exactly those ids, so the pre-drain
  state is self-consistent and CI-green on revert. ACCEPTED CONSEQUENCE, by design and named here
  so a future author recognises it: forward of this commit the drain is one-way and triple-pinned.
  Leg A(c) refuses re-adding any drained id while leg A(a) would demand exactly that if one ever
  measured toxic again, and VP steps 2 and 5 graduate two further independent pins on the same
  fact. A legitimately re-discovered blocking relationship on these seven ids therefore has NO
  in-PR path and needs a reviewed change to validate_roadmap_liveness.py. That is the shrink-only
  ratchet working as specified (Decision 165/166), not a defect -- and it is why every edge removed
  here is gated on documentary evidence by VP step 6 rather than on the author's judgement.
