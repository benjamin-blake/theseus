schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "roadmap-liveness-t2-t3-core-drain"
intent: >-
  Drain the T2/T3 roadmap-liveness toxic core (rec-3579) by correcting the three stale blocking
  edges that close it, so the DuckLake-maintenance -> ops-table -> telemetry critical path can be
  planned against again and the shrink-only ratchet tightens by seven ids.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-liveness-t2-t3-core-drain.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec -- resolves rec-3579, claims no tier_item slice and
  closes no exit criterion via closes_criteria. Corrects declared blocking edges on in_progress
  items T2.18 and T2.26 and not_started item T3.20.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Split T2.18 c2, drop the three stale back edges, rehome T3.20 c5, annotate CD.40
  - file: config/roadmap_liveness_baseline.yaml
    action: Modify
    purpose: Shrink by the seven drained ids; refresh the header count and owning-drain-rec prose
  - file: docs/contracts/roadmap-liveness.yaml
    action: Modify
    purpose: amendment_log entry and the now-stale owning-drain-rec prose in baseline_grammar
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: blocked_by governance note (foreign-ratification anti-pattern) with a declared residual
  - file: tests/checks/roadmap/test_validate_roadmap_liveness.py
    action: Modify
    purpose: Live-roadmap regression asserting the seven drained ids appear in no toxic SCC
bundled_recommendations:
  - rec-3579
followon_recs:
  - rec-3713
  - rec-3714
  - rec-3715
  - rec-3716
infrastructure_dependencies: []
acceptance_criteria:
  - The live roadmap reports exactly one toxic SCC of eleven ids; none of CD.40, T2.18, T2.19, T2.26, T2.36, T3.2, T3.20 appears in any toxic SCC
  - config/roadmap_liveness_baseline.yaml carries exactly the eleven T4-core ids and validate_roadmap_liveness reports no violation on any of legs A(a), A(b), A(c), A(d), B or C
  - Every removed edge passes the harm-sentence test in its own criterion text -- the text names the artefact that supersedes the original citation, so removal is evidenced re-sequencing and not deletion of an inconvenient constraint
  - T2.18 c2 is met (smoke half, met_by ducklake-maintenance-smoke-split) and new c10 is open with no blocked_by; T2.26 c2/c3/c8 carry no blocked_by; T3.20 c5 is rehomed with met_by T2.26; CD.40 carries affects [T2.26] and a partial-realization discipline_point but stays state pending with no realization_evidence
  - docs/ROADMAP-PLATFORM.yaml net line delta is <= 0 -- superseded re-grounding clauses are replaced, never appended to
  - No tier_item status changes, and the only criterion status changes are T2.18 c2 -> met, new T2.18 c10 (born open) and T3.20 c5 -> rehomed
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Census the live blocking graph after the re-sequencing
    command: bin/venv-python -m scripts.platform_roadmap_liveness --report
    expected: "Output reads 'Toxic SCCs: 1' and 'Toxic node ids (11): CD.11, CD.27, CD.38, CD.43, T4.1, T4.13, T4.2, T4.3, T4.4, T4.9, T4.9a'. Exit status 0."
    fix_if: Any of the seven T2/T3 ids still appears -- a back edge survives. Re-run the per-edge ablation to find which criterion still carries a blocked_by into the ring; note that a criterion marked met or rehomed still emits its edge today (rec-3713), so a status flip alone never prunes one.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The eleven-id census is the transient measured stock of rec-3580's still-undrained T4 core and will shrink when that core drains. Pinning it as a standing guard would red the build on exactly the progress this ratchet exists to reward. Step 2 graduates the durable half of this assertion.
  - step: 2
    phase: pre-deploy
    action: Exercise the live-roadmap drain regression -- none of the seven drained ids may reappear in a toxic SCC
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k DrainedCores -q
    expected: All selected tests pass, exit status 0, and at least one test is selected.
    fix_if: The new case fails, meaning a later roadmap edit re-closed the ring. Find the completion-demanding edge and re-sequence it against documentary evidence; never satisfy this by editing the baseline, which leg A(c) refuses anyway.
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-t2-t3-core-drained
  - step: 3
    phase: pre-deploy
    action: Run the registered check against the working tree, exercising legs A(a), A(b), A(d) and B
    command: bin/venv-python -c "from scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness; f=[]; validate_roadmap_liveness(f); raise SystemExit(1 if f else 0)"
    expected: "Prints 'PASS: 11 measured toxic id(s), 11 baselined.' and exits 0."
    fix_if: Leg A(d) names a drained id still present in the baseline (remove it), or leg B names T3.20 c5's rehome target as carrying no open criterion (T2.26 must retain c2/c3/c7/c8 open).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: This invokes validate_roadmap_liveness, already a --pre-tier registered check gated on docs/ROADMAP-* and config/roadmap_liveness_baseline.yaml. Graduating it would register a second standing invocation of the same check rather than a discrimination this plan newly introduces.
  - step: 4
    phase: pre-deploy
    action: Exercise leg C against origin/main as diff base -- no re-grounded criterion text may pair a blocking phrase with an unstructured live id mention
    command: git fetch origin main --quiet && bin/venv-python -c "from scripts.checks.roadmap.validate_roadmap_liveness import _leg_c_prose_blocking_edges; from scripts.platform_roadmap_state import load; from scripts.checks import _common; v=_leg_c_prose_blocking_edges(load(_common.ROOT / 'docs/ROADMAP-PLATFORM.yaml')); print(v); raise SystemExit(1 if v else 0)"
    expected: Prints [] and exits 0.
    fix_if: A violation names a re-grounded criterion -- its new text pairs a grammar phrase (blocked on, blocked by, gated on, gated by, requires ... complete, cannot ... until) with a NON_TERMINAL id. Rewrite the note to state ownership and disposition without a blocking phrase; do NOT re-add a blocked_by to silence it.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Assert rec-3579's own acceptance predicate over the shrunken baseline
    command: "! grep -qE '^  - (T2\\.18|T2\\.19|T2\\.26|T2\\.36|T3\\.2|T3\\.20|CD\\.40)$' config/roadmap_liveness_baseline.yaml"
    expected: Exit status 0 -- no drained id matches.
    fix_if: A drained id is still listed. Remove it; the ratchet is shrink-only so removal is always permitted and leg A(d) fails the PR until it happens.
    hermetic: true
    graduation: graduate
    graduation_check_id: roadmap-liveness-t2-t3-core-absent-from-baseline
  - step: 6
    phase: pre-deploy
    action: Harm-sentence evidence sweep -- the superseded blocking claim is gone and every removed edge's criterion cites the artefact that supersedes it
    command: "! grep -q 'not yet decided' docs/ROADMAP-PLATFORM.yaml && [ \"$(grep -c 'CD.40 binding disposition: retire; T2.26 doer' docs/ROADMAP-PLATFORM.yaml)\" = 3 ] && grep -q 'cleared gate: T2.26 c1 met 2026-07-04' docs/ROADMAP-PLATFORM.yaml"
    expected: Exit status 0 -- the superseded phrase is absent, the disposition citation appears on exactly the three T2.26 criteria, and T2.18 c10 carries its cleared-gate citation.
    fix_if: The count is not 3, or a citation is missing. An edge was removed without recording the evidence that supersedes its original citation, which is the exact shape leg C's remedy text calls forbidden weakening -- add the citation rather than relaxing this assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The literals asserted here are this diff's own citation tokens. A standing guard on their spelling would not catch a future recurrence phrased differently, and would fail any legitimate later compaction of these same criteria under Decision 147. Step 2 carries the durable structural guard instead.
  - step: 7
    phase: pre-deploy
    action: Roadmap schema, referential integrity and the Decision 114 line ceiling still hold
    command: bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap; f=[]; validate_platform_roadmap(f); raise SystemExit(1 if f else 0)"
    expected: Exit status 0 with no failures reported.
    fix_if: Check (i) rejects T2.18 c2's met_by (it must resolve to docs/plans/PLAN-ducklake-maintenance-smoke-split.yaml), or an unresolvable met_by/affects ref, or a line-ceiling breach -- compact the criterion prose in place, never raise the ceiling.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_platform_roadmap is already a registered --pre check gated on docs/ROADMAP-*. Graduating a second invocation adds no discrimination beyond what PR CI already applies to this diff.
  - step: 8
    phase: pre-deploy
    action: Roadmap-domain and detector suites still pass against the edited YAML
    command: bin/venv-python -m pytest tests/checks/roadmap tests/test_platform_roadmap_liveness.py -q
    expected: All tests pass, exit status 0, no skips.
    fix_if: A roadmap-domain test regressed. The failure names the assertion -- fix the roadmap data, never the assertion.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Contract drift -- both amended contracts carry a matching amendment_log entry and stay conformant
    command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift; f=[]; validate_contract_drift(f); raise SystemExit(1 if f else 0)"
    expected: Exit status 0 with no failures reported.
    fix_if: A contract was edited without a matching amendment_log entry. For exit-criteria-ledger.yaml the entry must be FIELD-level under fields.blocked_by.amendment_log -- a top-level block does not satisfy check_amendment_for_diff for a field-body change.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_contract_drift is already a registered check gated on docs/contracts/**. Graduating a second invocation would register a duplicate standing guard rather than a new discrimination.
  - step: 10
    phase: pre-deploy
    action: Pre-handoff full-tier validation completes green before commit
    command: bin/venv-python -m scripts.validate
    expected: Exit status 0 with no failed checks.
    fix_if: Any check fails -- fix it before commit. A timeout is handoff_policy timeout_disposition blocked, not a pass; resume later and rerun the full tier from the start.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: The three back edges that closed the T2/T3 core stay removed -- no criterion re-introduces a completion-demanding or CD-ratification blocking edge into the ring.
    verification_step: 2
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestDrainedCores::test_t2_t3_core_absent_from_live_toxic_set
    red_green_expectation: red before (the live roadmap reports all seven ids toxic), green after; and red again if any of the three blocked_by declarations is restored.
  - source: config/roadmap_liveness_baseline.yaml
    behavior: The baseline carries exactly the eleven undrained T4-core ids and none of the seven drained ids.
    verification_step: 5
    command: "! grep -qE '^  - (T2\\.18|T2\\.19|T2\\.26|T2\\.36|T3\\.2|T3\\.20|CD\\.40)$' config/roadmap_liveness_baseline.yaml"
    red_green_expectation: red before (all seven ids are listed), green after; and red again if a drained id is re-added, which leg A(c) independently refuses.
  - source: docs/contracts/roadmap-liveness.yaml
    behavior: baseline_grammar's owning-drain-rec prose names only the still-undrained T4 core, and the amendment_log records this drain.
    verification_step: 9
    command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift; f=[]; validate_contract_drift(f); raise SystemExit(1 if f else 0)"
    waiver_reason: The edit is contract prose plus an amendment_log row; the enforcement it describes lives entirely in validate_roadmap_liveness.py, which this plan does not touch. validate_contract_drift already fails a contract edit shipped without a matching amendment_log entry, so a bespoke test would duplicate a registered check.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: The blocked_by field carries a governance note forbidding an until-ratified edge to a CD whose realization evidence the criterion's own item cannot supply, with its enforcement coverage and residual owner declared.
    verification_step: 9
    command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift; f=[]; validate_contract_drift(f); raise SystemExit(1 if f else 0)"
    waiver_reason: The note is field-semantics prose routed to the owning contract by Decision 86 clause 2; it constrains a human author at roadmap-authoring time and has no runtime consumer to exercise. Its mechanical arm is leg A's ratchet, which already refuses the ring the note describes, and its unenforced authoring-time arm is a declared residual owned by rec-3715.
constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Remove ONLY the three back edges named in execution_steps. Every other blocked_by entry in the roadmap stays exactly as transcribed by PLAN-roadmap-blocking-edge-semantics.
  - Removal standard is symmetric fidelity -- an edge may be removed only with the same documentary evidence its insertion required, recorded in the criterion text. Never delete a blocking phrase to silence leg C while leaving the edge's claim true.
  - Never add an id to config/roadmap_liveness_baseline.yaml, and never edit validate_roadmap_liveness.py's frozen _BASELINE_SEED constant -- the ratchet is shrink-only and the seed is an upper bound a shrink never needs.
  - Do not flip any tier_item status. The only criterion status changes permitted are T2.18 c2 -> met, the new T2.18 c10 born open, and T3.20 c5 -> rehomed; all three are declared deliverables here, never inferred from prose or commit activity (Status-Trusted-Never-Inferred, T2.20).
  - Do NOT add T2.26 to CD.40's gates -- that re-creates the ring through the Decision 105 reverse evidence edge. affects is the non-blocking field for this relationship.
  - Do NOT set realization_evidence on CD.40. It is truthiness-filtered by ratifiable_cds(), so any value would surface CD.40 to /orient as ready to ratify while four of its five clauses remain unbuilt behind T3.20. Record partial realization as a discipline_point instead; CD.40 stays state pending.
  - Replace superseded re-grounding clauses in place; never append a further dated narrative clause to a criterion that already carries two (Decision 147). Net roadmap line delta must be <= 0.
  - Mint NO numbered Decision. decision-entry.yaml routes the ownership re-sequencing to work_item/operational_fact (criterion text and progress_note) and the blocked_by anti-pattern to field_semantics (the owning contract).
  - Ship no detector, check-module or _BASELINE_SEED change here -- those are rec-3713/rec-3714/rec-3715, deliberately split so this diff stays pure ledger fidelity.
context:
  - "decision-scout: FLAGS_FOUND, 138 of 138 triaged. CITE: Decision 105, Decision 136, Decision 165, Decision 114, Decision 86, Decision 167, Decision 55. RELATED: 110, 128, 168, 59, 163."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - "rec-3579 is the owning drain rec seeded by PLAN-roadmap-blocking-liveness-detector; its acceptance predicate is VP step 5. Name Resolves: rec-3579 in the squash-merge body."
  - "Measured ablation: dropping T2.18 c2's edge alone leaves {CD.40, T2.26, T2.36, T3.2, T3.20} toxic; dropping T2.26 c2/c3/c8's edges alone leaves {T2.18, T2.19, T2.26} toxic. Both are required and jointly sufficient."
  - "The full edit set was simulated against the real registered check before this plan was written: PASS, 11 measured toxic ids, 11 baselined, no leg A/B/C violation."
  - "Harm-sentence test (Fable consult, adopted): an edge is honest to remove iff 'if <source> completed before <target> reached <until>, the artefact that breaks is ___' fills only with 'the roadmap says so' or 'someone else owns that'. Knot A fills with ownership; Knot B fills with 'not yet decided', which CD.40's detail contradicts."
  - "Superseded edge citations are verbatim in PLAN-roadmap-blocking-edge-semantics.yaml execution_steps, including its reason for transcribing T2.18 c2 rather than rehoming it -- the c2/c10 split honours that reason rather than overriding it."
  - "Decision 181 clause 1: this diff removes edges AND rewrites the same criterion texts, which is indistinguishable from phrase-dodging without the citations VP step 6 asserts. That is why step 6 is a hard gate, not advisory."
  - "Leg C gotcha: re-grounded texts must not pair a roadmap-liveness.yaml blocking phrase with a live id mention -- avoid the phrases outright."
  - "contracts_enforcement.check_amendment_for_diff reads base/head spec amendment_log at the level that changed: exit-criteria-ledger.yaml needs its entry under fields.blocked_by.amendment_log, not top-level."
  - "config/roadmap_liveness_baseline.yaml is sanctioned by implement-scope-boundary.yaml's roadmap_liveness_baseline_shrink row; docs/contracts/roadmap-liveness.yaml is explicitly NOT and must stay declared in scope. Graduated registry shards are sanctioned by graduated_registry_shard."
  - "docs/ROADMAP-PLATFORM.yaml resolves to the data-pipeline Lambda as a bundled assets entry only. validate_tier_floor scans handlers+includes only and validate_lambda_deploy_gating is advisory, so no build/deploy/smoke step is owed and V2 stands (rec-2910)."
  - "T2.18 c9's met note retains a historical '(CD.40 / T3.20 pending)' parenthetical. It stays factually true and is deliberately NOT rewritten -- Decision 147 discourages churning terminal narrative, and editing its text would pull it into leg C's diff scope."
  - "ops_session_log is status: dormant in field_semantics, no live writer or agent-facing reader. The downstream T2.26 retirement plan must query information_schema before claiming the sweep is code-only."
  - "Fable consult preferred two PRs (Knot A first); human chose one -- rec-3579's acceptance spans all seven ids, so a split holds the rec open across two gate cycles for a data-only change."
  - "Main-divergence assessment: 0 commits behind origin/main, no scope-file overlap."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "docs/ROADMAP-PLATFORM.yaml, T2.18 c2: SPLIT. c2 keeps the smoke-scoped half and becomes status: met, met_by: ducklake-maintenance-smoke-split, its text compacted to the weekly guarded GC scheduled on ducklake_maintenance_smoke and exercised by the c9 CI gate. Delete its blocked_by."
  - "docs/ROADMAP-PLATFORM.yaml, T2.18 new c10: born status: open, no blocked_by, carrying the production-catalog destructive GC + N-cycle S3-stability half. Text must contain the literal 'cleared gate: T2.26 c1 met 2026-07-04' and record that T2.26's 2026-08-26 closeout scopes its residual to ops_session_log plus c7, so ownership returns to T2.18 where the ducklake_maintenance Lambdas live. Id is c10 for cN-sequence consistency (only T4.12 uses letters)."
  - "docs/ROADMAP-PLATFORM.yaml, T2.26 c2/c3/c8: delete BOTH blocked_by entries from each. Replace (do not append to) each superseded re-grounding clause with one containing the literal 'CD.40 binding disposition: retire; T2.26 doer'. The phrase 'not yet decided' must not survive anywhere in the file."
  - "docs/ROADMAP-PLATFORM.yaml, T3.20 c5: status open -> rehomed, met_by: T2.26. Leave c6 and c7 untouched -- SESSION_LOG.md retirement and the schema-accuracy pass are different surfaces and stay with T3.20."
  - "docs/ROADMAP-PLATFORM.yaml, CD.40: add affects: [T2.26] and one discipline_point recording that the ops_session_log clause realizes early via T2.26 while the remaining clauses stay gated on T3.20. Do NOT touch state, gates or realization_evidence."
  - "docs/ROADMAP-PLATFORM.yaml: append one dated progress_note entry to T2.18 and T2.26 recording the re-sequencing and citing rec-3579. T3.20 has no progress_note today -- create one rather than leaving the c5 rehome unexplained."
  - "config/roadmap_liveness_baseline.yaml: remove CD.40, T2.18, T2.19, T2.26, T2.36, T3.2, T3.20 from entries. Update the header comment's SCC/id count and rewrite the OWNING DRAIN RECS line to name rec-3580's T4 core only, recording that rec-3579's core drained."
  - "docs/contracts/roadmap-liveness.yaml: update baseline_grammar's owning-drain-rec sentence to name only the undrained core, and add a top-level amendment_log entry (date, semantic_break: false, change_class, summary citing this plan and rec-3579). Leave provisional_v0, the toxicity rule and every leg's grammar untouched."
  - "docs/contracts/exit-criteria-ledger.yaml: extend fields.blocked_by.governance_notes with the foreign-ratification anti-pattern -- never carry until: ratified on a CD whose gates do not name this criterion's own item, because under Decision 105 that item cannot supply the evidence it waits on. Declare coverage per Decision 181 clause 2: leg A's toxic-SCC ratchet is the mechanical arm; the authoring-time rule is an unenforced residual owned by rec-3715. Add the amendment_log entry under fields.blocked_by.amendment_log, NOT top-level."
  - "tests/checks/roadmap/test_validate_roadmap_liveness.py: add class TestDrainedCores with test_t2_t3_core_absent_from_live_toxic_set, loading the live roadmap and asserting none of the seven ids appears in any toxic_sccs member -- mirroring the existing TestTranscription live-roadmap shape. File is ~415 SLOC of 500, so no budget raise (Decision 128)."
  - "Close rec-3579 via update_rec once VP step 5 passes, and name 'Resolves: rec-3579' in the squash-merge body so rec-autoclose.yml fires."
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Single data-only commit touching no runtime code. Revert restores all three blocking edges and
  the seven baseline ids together; leg A(a) then re-requires exactly those ids, so the pre-drain
  state is self-consistent and CI-green on revert.
