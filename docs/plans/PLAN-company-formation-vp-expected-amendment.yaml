schema_version: 4
slug: company-formation-vp-expected-amendment
intent: 'Act one of the two-act amendment_procedure: correct the five unsatisfiable-by-construction backtick literals
  in PLAN-company-formation-ownership.yaml''s verification_plan[].expected (steps 1, 6, 9, 10, 11) so the stranded
  /implement session on that plan can reach a green --pre tier. Changes plan prose only; no command, scope or acceptance_criterion
  moves.'
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-company-formation-vp-expected-amendment.yaml
phase: T1
implementation_declared: true
scope:
- file: docs/plans/PLAN-company-formation-ownership.yaml
  action: Modify
  purpose: Rewrite the expected prose of verification_plan steps 1, 6, 9, 10 and 11 so every surviving backtick span
    is a literal substring its own command actually emits. Only expected changes; command, graduation, phase, hermetic,
    scope and acceptance_criteria stay byte-identical to origin/main.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
- 'AC1: verification_plan steps 1, 6, 9 of the target plan replay with every backtick literal in their expected field
  present in the command''s combined stdout+stderr.'
- 'AC2: step 10''s expected carries zero backtick literals, because its command is a bare sys.exit that emits no stdout.'
- 'AC3: step 11''s expected asserts only the count literal, and that literal is emittable by its own command against
  a clean Decision 195 fixture. Known residual: substring matching means the count literal is also satisfied by a
  nonzero count ending in that digit; the frozen command admits no tighter span.'
- 'AC4: exactly steps 1, 6, 9, 10, 11 have a changed expected; no other step''s expected, and no command, graduation,
  graduation_check_id, phase or hermetic field, differs from origin/main.'
- 'AC5: scope, acceptance_criteria, closes_criteria, bundled_recommendations, intent and plan_type of the target plan
  are byte-identical to origin/main.'
- 'AC6: bin/venv-python -m scripts.validate exits 0 on this branch.'
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: Replay target steps 1, 6 and 9 and assert every backtick literal in their amended expected is present in
    the real combined output.
  command: 'bin/venv-python -c ''exec("import re,subprocess,sys,yaml\nB=chr(96)\nP=\"docs/plans/PLAN-company-formation-ownership.yaml\"\nd=yaml.safe_load(open(P))\nmiss=[]\nfor
    s in d[\"verification_plan\"]:\n    if s[\"step\"] not in (1,6,9): continue\n    r=subprocess.run(s[\"command\"],shell=True,capture_output=True,text=True,timeout=60)\n    m=[l
    for l in re.findall(B+\"([^\"+B+\"]+)\"+B,s[\"expected\"]) if l not in r.stdout+r.stderr]\n    if m: miss.append((s[\"step\"],m))\nprint(\"missing:\",miss)\nsys.exit(1
    if miss else 0)\n")'''
  expected: 'Exit 0 and the line missing: [] -- an empty list means no asserted literal is absent from its own command''s
    output. Before the amendment this step reports three entries (steps 1, 6 and 9), so it discriminates. Marked non-hermetic
    deliberately: it replays the target''s step 1, which runs scripts.decisions_index --write and therefore writes
    a tracked generated file; the hermetic marker asserts side-effect-freedom and would be a mis-declaration here.
    Deliberate trade, recorded: non-hermetic means CI does not auto-replay this discriminator, and the write it wraps
    happens anyway when act two replays the target''s own step 1 (hermetic: true and frozen by AC4). The trade is
    accepted because a hermetic marker is a declaration ABOUT a command, and mis-declaring one is the same defect
    class this plan exists to fix; execution_steps[4] obliges the agent to run steps 1 to 3 and confirm empty lists,
    and VP steps 2 and 3 remain hermetic so CI still replays the overreach and step-10/11 guards.'
  fix_if: 'A reported literal is still absent: the replacement text re-asserts something the command does not emit.
    Re-read the command''s real output and assert only a contiguous substring of it, or drop the backticks and keep
    the phrase as prose.'
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: Assert step 10 asserts no literal at all, and that step 11's literals are emittable against a fabricated
    clean Decision 195 fixture in a temp dir.
  command: 'bin/venv-python -c ''exec("import re,sys,yaml,subprocess,tempfile,pathlib\nB=chr(96)\nP=\"docs/plans/PLAN-company-formation-ownership.yaml\"\nst={s[\"step\"]:s
    for s in yaml.safe_load(open(P))[\"verification_plan\"]}\nbad=[]\nif re.findall(B+\"([^\"+B+\"]+)\"+B,st[10][\"expected\"]):
    bad.append((10,\"writes no stdout; any literal is unsatisfiable\"))\nlits=re.findall(B+\"([^\"+B+\"]+)\"+B,st[11][\"expected\"])\nwith
    tempfile.TemporaryDirectory() as t:\n    d=pathlib.Path(t)/\"docs\"\n    d.mkdir()\n    (d/\"DECISIONS.md\").write_text(\"##
    Decision 195: Ownership\\nOn The Loop Labs Limited owns it.\\n\\n## Decision 196: Next\\nx\\n\")\n    r=subprocess.run(st[11][\"command\"],shell=True,cwd=t,capture_output=True,text=True,timeout=60)\n    m=[l
    for l in lits if l not in r.stdout+r.stderr]\nif m: bad.append((11,\"not emittable against a clean Decision 195
    fixture: \"+repr(m)))\nprint(\"findings:\",bad)\nsys.exit(1 if bad else 0)\n")'''
  expected: 'Exit 0 and the line findings: [] -- step 10 carries no backtick span, and every literal step 11 asserts
    is emitted by step 11''s own command against a clean fixture. Before the amendment this step reports both defects.'
  fix_if: 'Step 10 still carries a literal: remove the backticks, its command writes no stdout so no literal can ever
    match. Step 11''s literal is not emittable: check it against the fixture''s real output rather than against the
    shell syntax in the prose. Residual, accepted: the count literal is matched as a SUBSTRING, so a bare 0 is also
    satisfied by a count of 10 or 100. The target step''s command is frozen, so no tighter span exists; the exit-0
    contract plus the anti-vacuity grep -q guard carry the rest of the assertion.'
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: 'Byte-identity guard: prove the amendment moved nothing but the five expected fields.'
  command: 'bin/venv-python -c ''exec("import yaml,subprocess,sys\nP=\"docs/plans/PLAN-company-formation-ownership.yaml\"\nbase=yaml.safe_load(subprocess.run([\"git\",\"show\",\"origin/main:\"+P],capture_output=True,text=True,check=True).stdout)\ncur=yaml.safe_load(open(P))\nbad=[]\nfor
    k in (\"scope\",\"acceptance_criteria\",\"closes_criteria\",\"bundled_recommendations\",\"intent\",\"plan_type\"):\n    if
    base.get(k)!=cur.get(k): bad.append(\"field:\"+k)\nbs={s[\"step\"]:s for s in base[\"verification_plan\"]}\ncs={s[\"step\"]:s
    for s in cur[\"verification_plan\"]}\nif set(bs)!=set(cs): bad.append(\"step-set\")\nch=[]\nfor n in sorted(set(bs)&set(cs)):\n    for
    f in (\"command\",\"graduation\",\"graduation_check_id\",\"phase\",\"hermetic\"):\n        if bs[n].get(f)!=cs[n].get(f):
    bad.append(f+\":\"+str(n))\n    if bs[n][\"expected\"]!=cs[n][\"expected\"]: ch.append(n)\nif ch!=[1,6,9,10,11]:
    bad.append(\"expected-set:\"+str(ch))\nprint(\"violations:\",bad)\nsys.exit(1 if bad else 0)\n")'''
  expected: 'Exit 0 and the line violations: [] -- exactly steps 1, 6, 9, 10, 11 changed expected, and no command,
    graduation, graduation_check_id, phase, hermetic, scope, acceptance_criteria, closes_criteria, bundled_recommendations,
    intent or plan_type differs from origin/main.'
  fix_if: A field:<name> or a per-step token such as command:6 or hermetic:6 means the amendment overreached beyond
    its sanctioned surface -- revert that field to origin/main. An expected-set token means a step was missed or an
    extra one was touched.
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: 'Confirm validate_scope_boundary is clean: the target plan is MODIFIED-not-resolved in this diff, so it
    defers and its prohibited_field_edits arm never fires.'
  command: bin/venv-python -c 'import sys; from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary
    as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)'
  expected: Exit 0. The target plan prints a DEFER line because implementation_declared did not newly flip true in
    this diff; this is the mechanism that makes act one legal, and it is asserted here rather than assumed.
  fix_if: A prohibited-field finding means implementation_declared was flipped in this diff -- the amendment must
    not declare the parent plan's implementation. Revert that flag.
- step: 5
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: Confirm validate_vp_replay is clean on this branch, including that the amended target plan defers rather
    than replaying.
  command: bin/venv-python -c 'import sys; from scripts.checks.verification.validate_vp_replay import validate_vp_replay
    as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)'
  expected: 'Exit 0. A modified-not-added plan is outside both legs -- the implement leg resolves only a False-to-True
    implementation_declared flip, and the Decision 189 red-before leg covers added plans only -- so CI cannot itself
    prove the amendment correct. That is exactly why steps 1 to 3 above exist. Marked non-hermetic deliberately: this
    command invokes validate_vp_replay directly, so if it were replayed it would resolve THIS plan and re-enter itself
    without bound. scripts/validate.py''s _VALIDATE_DEPTH guard does not help -- it keys on a scripts.validate invocation,
    never on a direct check-module call.'
  fix_if: A finding against this plan's own steps means one of the new VP commands is itself unreplayable; fix the
    command, not the expected.
- step: 6
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: Fast presubmit tier.
  command: bin/venv-python -m scripts.validate --pre
  expected: 'Exit 0 with no entry under Failed checks. Marked non-hermetic deliberately: a nested scripts.validate
    is neither side-effect-free nor within the 30s per-step replay budget, and marking it hermetic is what produced
    the spurious TIMEOUT artifact on the parent plan''s own steps 15 and 16.'
  fix_if: Diagnose on the branch per the PR-branch failure rule; no ci-rca rec is filed for a branch-tier failure.
- step: 7
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A one-off correction to one merged plan''s frozen prose has no standing regression surface:
    the durable guard for this defect class is already owned by rec-3708/rec-3900 (plan-time literal-emittability
    lint) and rec-3398/rec-3755 (authoring guidance). Graduating a registry row here would pin a permanent check to
    a single plan''s text.'
  action: Full presubmit tier, discharging handoff_policy.full_validation_required_before_commit.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with no entry under Failed checks.
  fix_if: Diagnose on the branch before committing; the handoff policy blocks commit until this exits 0.
test_obligations: []
constraints:
- Do NOT flip implementation_declared on the target plan. That flag is what makes the plan resolve on the implement
  leg and would turn this amendment into the same-diff self-amendment implement-scope-boundary.yaml refuses.
- Do NOT edit verification_plan[].command, scope, acceptance_criteria, graduation or graduation_check_id on the target
  plan. Only expected may move.
- Do NOT re-pin step 9's GROWTH baseline. The implementing diff adds lines to ROADMAP-PLATFORM.yaml, so lines= and
  headroom= go stale the moment it lands; assert only line-count-invariant tokens.
- Do NOT use a shell backtick anywhere in a VP command. Inside a double-quoted shell payload bash performs command
  substitution and the assertion silently tests a mangled string (rec-3885 defect 1). Use chr(96).
- Every backtick span written into an expected field must be verified against that step's real output before commit,
  not reasoned about.
- This PR must merge to main BEFORE the implementation branch rebases onto it. The two acts cannot be one diff.
- 'No new recommendation is to be filed for the root cause: rec-3398, rec-3555, rec-3708, rec-3755 and rec-3900 already
  own it and the dedup gate fires.'
context:
