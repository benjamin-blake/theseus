- 'Precedent for act one as its own PR: PR #1168 (1ec8565f) and PR #1165 (73acf37d) on PLAN-loop-spec-audit-tail;
  PR #1117 (e1370d4f). Most recent: PR #1210 (60e1836e) amended PLAN-gc-ops-baseline-gate-and-schedule-enable step
  3 the same way.'
- 'Root cause is a known, unfixed class, five recs deep: rec-3398, rec-3555, rec-3708, rec-3755, rec-3900. rec-3900
  was filed 2026-09-16 after an implementing agent lost a cycle on PLAN-g4-byte-source-and-post-expiry-bound -- the
