  RELATED: 0.'
- 'CITE: Decision 148 (VP replay legs), Decision 132 (graduation obligation), Decision 163 (handoff full-tier step),
  Decision 59 (scope guard), Decision 67 (IMPLEMENTATION-only), Decision 181 (never weaken an assertion), Decision
