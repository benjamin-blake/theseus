- 'Exposure measured across 436 merged plans: 248 backtick literals asserted on hermetic pre-deploy steps, 35 shell-syntax
  or long-prose shaped.'
- 'No escape exists via a permitted field: graduation_waiver_reason appears nowhere in validate_vp_replay, and steps
  1/6/9/11 are already graduation: waive yet still replay, because the implement leg partitions on phase and hermetic
  only.'
- 'Target steps 15/16 (scripts.validate --pre / full, hermetic: true) do NOT need a hermetic flip: scripts/validate.py
  reads _VALIDATE_DEPTH at line 169 and SETS it at line 173, both at the top of main() before check dispatch, subprocesses
  inherit it, and a nested invocation exits 0 in 0.1s ([SKIP] recursion detected). Measured. The timeout the stranded
  session saw is an artifact of calling the check standalone, outside a scripts.validate process -- not a defect this
  amendment must fix.'
- 'Critique F1 (accepted, fixed): a VP step invoking a check module DIRECTLY is outside _VALIDATE_DEPTH''s protection,
  which keys on scripts.validate only -- hence steps 1 and 5 here are non-hermetic while the same shape is safe for
