pre_implementation_checklist:
- git fetch origin main && git rebase origin/main -- the amendment must be authored against current main.
- Confirm docs/plans/PLAN-company-formation-ownership.yaml is unchanged since 806d1040 (git log --oneline origin/main
  -- <path>).
- Read the five target steps' CURRENT expected text and each step's real output before drafting a replacement.
- 'Confirm no new recommendation is needed: the five root-cause recs above are open and own the class.'
execution_steps:
- 1. Rebase onto origin/main.
- '2. For each of steps 1, 6, 9, 10, 11: run the step''s command, capture combined stdout+stderr, and draft an expected
  whose every backtick span is a contiguous substring of that capture. Preserve assertion strength rather than shedding
  it (Decision 181) -- verified contiguous and line-count-invariant spans are available for three of them: step 1
  can keep BOTH ''Decisions index written to'' and ''docs/decisions-index.json'' (the latter is a substring of the
  absolute path); step 6 can keep ''monitored reversal-conditions stanza(s), all well-formed.'' and ''[]''; step 9
  can keep ''GROWTH lines='' and ''threshold=500''. Step 10 gets zero spans because its command emits nothing; step
  11 keeps only the count, checked against a fabricated clean Decision 195 fixture.'
- 3. Apply the five expected rewrites to docs/plans/PLAN-company-formation-ownership.yaml, changing nothing else.
- 4. Run verification_plan steps 1 to 3 and confirm each exits 0 with an empty list.
- 5. Run verification_plan steps 4 and 5 and confirm the target plan DEFERs.
- 6. Run the fast tier, then the full tier.
- 7. Commit, push, open the PR, and merge it to main BEFORE the implementation branch rebases.
- 8. Tell the blocked session to rebase agent/sharp-gates-x14uug onto the amended main and re-run its own --pre tier.
rollback: Single-commit revert. The change is confined to prose inside one merged plan document's expected fields;
  reverting restores the pre-amendment text and re-strands the implementing session but breaks nothing else.
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
