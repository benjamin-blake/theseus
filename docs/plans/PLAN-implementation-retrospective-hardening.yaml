    and records this rationale to satisfy the Related-Work Check.
  - >-
    Complexity: more than five files and eight steps would normally suggest STRATEGIC, but STRATEGIC plans are
    suspended while the executor is frozen. The user asked for one comprehensive plan, so this remains a larger
    IMPLEMENTATION plan with ordered seams and blocking preconditions.
  - >-
    Decision-scout verdict: FLAGS_FOUND after triaging 108 of 108 Decisions. CITE Decision 38, Decision 48,
    Decision 55, Decision 59, Decision 60, Decision 66, Decision 72, Decision 73, Decision 76, Decision 85,
    Decision 90, Decision 101, Decision 104, Decision 110, Decision 128, Decision 131, Decision 132,
    Decision 135, and Decision 138. The Decision 59 WARN is resolved by structured deterministic postflight
    evidence rather than a retrospective agent or chat authority.
  - >-
    Plan-critique round 1 returned REVISE for nonexistent test paths, root-script placement,
    unowned ignore/facade/hook behavior, and incomplete v3 plan-type semantics. The revision moved
    helpers into mapped subpackages, used real concern-split tests, named both transient artifacts,
    added hook and facade integration ownership, and bounded facade growth. Round 2 found no
    decision conflicts or acceptance gaps and returned PROCEED.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=PROCEED after 2 round(s)"
pre_implementation_checklist:
  - >-
    Codex skill loading: if no Skill tool is exposed, manually read `.claude/skills/implement/SKILL.md` and
    `.claude/skills/code-review/SKILL.md` completely despite Claude-oriented instructions to invoke them. A
    code-review subagent receives the same instruction and may not review from remembered summaries.
  - Confirm the harness branch is not main; do not create an agent/ branch merely to rename Codex branch work.
  - >-
    Fetch origin/main and require `git merge-base HEAD origin/main` to resolve before interpreting changed-file
    mappings. Run `bash .claude/hooks/session_start_precommit.sh`, require `.git/hooks/pre-commit` executable,
    and run `.venv/bin/pre-commit run --all-files` before editing to expose environment drift.
  - >-
    Run session preflight and read its report, this plan, docs/PROJECT_CONTEXT.md, the named Decision sections,
    every scope file, and each mapped owning test. Preserve the rec-2882 deferral without touching it.
  - >-
    Record baseline help output for scripts.validate and scripts.test_coverage_checker. Confirm only --pre/full
    are tiers and the existing coverage command reproduces source-to-test ownership before altering output.
  - >-
    Measure SLOC for every touched Python and skill file against config/sloc_budgets.yaml. If projected growth
    exceeds a budget, extract a cohesive helper or shorten existing prose; never raise the budget.
  - >-
    Run the readiness probe baseline or, before it exists, separately record origin fetch, authenticated API
    read, dry-run feature-branch push, MCP binary/config/token presence, and whether PR-write is provable. Never
    print token contents.
execution_steps:
  - >-
    Complete the pre-implementation checklist. Treat absent origin, missing pre-commit hook, unread skills, or
    ambiguous diff ownership as a setup defect to resolve before source edits, not as grounds to weaken gates.
  - >-
    Add PlanDocument schema version 3 with a strict HandoffPolicy and compatibility tests. Require it only for
    v3 IMPLEMENTATION plans, forbid it for STRATEGIC and REPORT-ONLY, and retain the separate active
    no-new-STRATEGIC-plan workflow freeze.
    Update planning and critique methodology so new implementations cannot contain timeout-as-warning language
    or a third-tier diagnostic.
  - >-
    Update the implementation skill to run the existing mapped coverage command before the expensive full gate,
    explain the 100% owning-target model, and state that only full exit 0 permits commit/PR handoff. Update code
    review with the exact-command/exit-code/final-summary evidence rule.
  - >-
    Improve test_coverage_checker's observable mapping without adding selection state or a validate flag. Cover
    every output/error branch in its owning tests and keep the diagnostic's non-authoritative label explicit.
  - >-
    Implement scripts/checks/validation_result.py as a small atomic writer. Clear prior full evidence on entry, write only at
    the terminal parent summary, include failed-check names without raw subprocess output, and ensure evidence
    write errors are visible but cannot turn a failing validation green. Keep --pre entirely outside this path.
  - >-
    Implement the independent GitHub readiness states and shared advisory hook. Use bounded timeouts and redacted
    diagnostics; dry-run only the current non-main branch; return unknown for any permission a safe read/dry-run
    cannot establish. Wire Claude settings and Codex setup to the same hook and lock ordering with tests.
  - >-
    Add structured postflight evidence with the ten causal categories from the retrospective. Keep
    scripts/session/postflight.py facade wiring to at most 20 added SLOC so it remains below 500; if that is not
    possible, stop and rescope rather than raise the budget. Accept only
    externalized command/review facts, include ambiguity and false-positive reasons, and provide deterministic
    rendering. Keep the gitignored artifact downstream-only and migration-compatible with future process-event
    telemetry; do not write the currently unavailable telemetry warehouse path.
  - >-
    Execute VP steps 1-6 and repair every mapped coverage branch before running the aggregate gates. Then run
    steps 7 and 8. Full timeout, interruption, missing terminal result, or nonzero exit blocks all subsequent
    commit/PR work and must be continued in a later turn or session.
  - >-
    After all verification passes, dispatch a fresh code-review subagent. In Codex it must manually read the
    code-review skill, fetch origin/main, read this plan and full diff, make no edits, and return structured
    findings. Any claimed command failure must include the exact command, exit code, and final owning summary.
    Fix Critical/High findings and repeat focused, mapped, --pre, full, and review gates as applicable.
  - >-
    Emit the structured postflight causal evidence, commit with
    `feat(implementation-retrospective-hardening): enforce evidence-backed handoff`, rebase onto origin/main,
    and stop on conflict. Push only the feature branch and use real GitHub/MCP PR tooling only when readiness
    proves it; report metadata-only or unknown PR capability accurately.
  - >-
    Report focused tests, mapped coverage, pre-commit, --pre, full exit/final-summary/artifact identity, review
    verdict, readiness states, structured retrospective artifact, and PR URL. Do not report an incomplete run as
    warning/success and do not mention rec-2882 as resolved.
work_areas: []
rollback: >-
  Revert the implementation PR to remove schema v3, evidence/readiness helpers, hook wiring, and skill changes.
  Historical v1/v2 plans remain valid throughout, and all artifacts are transient output, so no warehouse,
  infrastructure, GitHub, or deployment state requires rollback. Never roll back by adding a third validation
  tier, weakening the full-gate block, or deleting tests.
