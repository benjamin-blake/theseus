    completed successfully. The retrospective is therefore reviewed as workflow evidence from a green fix,
    not as an unresolved code regression.
  - >-
    Verified coverage behavior: scripts.test_coverage_checker already maps each changed Python source to an
    owning test file/package and runs that target with --cov=<module>, requiring 100%. The missing improvement
    is early workflow visibility and explicit mapping output, not a new execution tier.
  - >-
    Verified validator surface: scripts.validate currently has terminal summaries for scope pre and scope all;
    no proposed partial mode is accepted. Parent exit code and final summary remain executable truth.
  - >-
    Verified bootstrap gap: Claude settings invoke session_start_ensure_github_mcp.sh, while tracked Codex setup
    installs the binary directly and runs AWS/pre-commit/main hooks but has no shared capability report. This
    plan adds a shared readiness observation, not a claim that repo config can force the Codex harness to expose
    a particular MCP namespace.
  - >-
    rec-2882 is an unresolved Critical infrastructure CI-RCA for
    terraform/bootstrap/github_ci_apply.tf. The user explicitly deferred it because another agent is handling
