execution_steps:
  - >-
    Run Verification Plan steps 1 through 7 (pre-deploy) IN ORDER before any write. Steps 2 through 6
    establish the evidence that the resolution strings assert; a failure in any of them invalidates the
    corresponding rec's verdict and that rec must be dropped from the batch, not forced through.
  - >-
    Execute VP steps 8, 9 and 10 -- the ten --update-rec closures, grouped by verdict class. Each is a
    separate portal call; a failure mid-chain leaves earlier closures landed, which is safe and
    idempotent to re-run.
  - >-
    Execute VP step 11 -- file all THREE recommendations (governance gap, validate_handoff_full_tier
    matcher hole, AGENTS.md T4.3 staleness). Call get_rec_write_guidance() before
    file_rec() per AGENTS.md Precision Context Injection. Record all three writer-allocated ids in
    the report.
  - >-
    Execute VP steps 12 and 13 -- refresh the read cache and assert the terminal state (ten closed with
    non-empty resolutions, open-Critical lane exactly rec-2816 and rec-3059, all three new recs open).
  - >-
    Commit the plan artefact only. Include in the squash-merge commit body the trailer
    'Resolves- rec-027, rec-028, rec-296, rec-423, rec-425, rec-457, rec-468, rec-609, rec-610,
    rec-613' (with a colon after Resolves) per the AGENTS.md convention for a non-empty
    bundled_recommendations list. IMPORTANT- do NOT rely on rec-autoclose.yml being a harmless no-op.
    Its "already closed -- skipping" guard reads logs/.recommendations-log.jsonl, which is gitignored
    and therefore ABSENT on a cold CI runner; the workflow's own sync() is wrapped in a warn-only
    try/except, so a single sync failure collapses the guard and overwrites all ten curated
    resolutions with boilerplate. VP step 14 exists precisely to detect and repair that.
  - >-
    AFTER the merge lands, run VP step 14. This is the only step that runs post-merge, and it is
    mandatory- acceptance criterion 7 is not satisfiable before the squash-merge exists.
  - >-
    'Report- which recs closed with which verdict, the writer-allocated id of the governance-gap rec,
    the final open-Critical lane contents, the three writer-allocated rec ids from step 11, and the
    step-14 post-merge resolution-survival result.'
rollback: >-
  Closure is reversible through the same governed path- bin/venv-python -m scripts.ops_data_portal
  --update-rec rec-NNNN --status open, which appends a new SCD2 version rather than mutating history.
  No repository state needs reverting because none is changed. Any of the three recs filed at step 11
  would be closed as relevance=duplicate rather than deleted -- there is no public delete_rec and
  physical deletion is confined to Decision 70's bootstrap-record scope.
