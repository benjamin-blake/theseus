schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critical-lane-triage"
intent: >-
  Clear the open-Critical recommendation lane down to genuinely actionable work by closing ten recs
  whose substrate, branch, or gating decision makes them unworkable (or which are already satisfied),
  each with a recorded Decision 103 relevance verdict and verified evidence. Restores the Critical
  lane as a trustworthy triage surface so future /orient and /plan sessions rank real work instead of
  scrolling past nine years of dead pointers.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-critical-lane-triage.yaml
phase: >-
  Platform hygiene -- ad-hoc recommendation triage (soft-warn exception category ad_hoc_rec; names no
  tier_item, so the Tier Item Freshness Gate is skipped by design). Not a roadmap item: this is queue
  maintenance under Decision 103's governed relevance lifecycle and Decision 64's bootstrap-cohort
  ageing-out licence.
scope:
  - file: docs/plans/PLAN-critical-lane-triage.yaml
    action: Create
    purpose: >-
      Sole scope row. This plan mutates NO repository file: its entire effect is thirteen ops-portal
      writes (ten --update-rec closures plus three file_rec calls) against the DuckLake ops_recommendations
      table via the closed writer boundary. docs/ROADMAP-PLATFORM.yaml was considered as a rehome
      target for the three executor-defect pointers and deliberately REJECTED at planning time (human
      decision, Q2): the pointers live solely in the resolution strings, which are durable,
      warehouse-resident and retrievable via the rec_by_id / rec_history named verbs. Adding a second
      copy to the roadmap would be a third unsynced surface (Decision 115 / AGENTS.md agent-first
      anti-pattern). docs/SESSION_LOG.md was likewise rejected for the same reason.
bundled_recommendations:
  - rec-027
  - rec-028
  - rec-296
  - rec-423
  - rec-425
  - rec-457
  - rec-468
  - rec-609
  - rec-610
  - rec-613
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    All ten recs (rec-027, rec-028, rec-296, rec-423, rec-425, rec-457, rec-468, rec-609, rec-610,
    rec-613) carry status=closed in the DuckLake current projection, each with a non-empty resolution
    string naming its Decision 103 relevance verdict.
  - >-
    The open-Critical lane contains exactly rec-2816 and rec-3059 -- the two recs verified at planning
    time as live work with extant target files and activity inside the last three weeks.
  - >-
    rec-457 and rec-613 carry execution_result=already_implemented; the other eight carry
    execution_result=manual, reflecting triage closure rather than an implemented fix.
  - >-
    The resolution strings for rec-027 and rec-028 attribute the Copilot retirement precisely --
    Decision 116 retires the copilot-sdk provider and deletes scripts/copilot_sdk_client.py, Decision
    117 drops the copilot_wrapper boundary rows, Decision 121 records the scripts/copilot_wrapper.py
    deletion and retires the cli-json-output contract -- and do NOT cite CD.28 / dec-122, which is the
    Bedrock-to-LiteLLM inference decision and mentions Copilot nowhere.
  - >-
    No resolution string asserts that Copilot content is absent from the tree. Both Copilot closures
    are grounded on the three verified-absent executable entry points and carry an explicit scope note
    acknowledging the dead-by-guard residue (.github/agents/schedule.yaml provider entries, retained
    by Decision 116 as T4.3-owned).
  - >-
    These resolution-string clauses are MACHINE-VERIFIED by a Verification Plan step: the four absent
    targets (step 4); the Decision 55 cancellation text, the absent --ci flag, the absent
    dq-validate-integration branch, the three Copilot entry points, the RetiredProviderError guard,
    rec-607's closed status and rec-608's recorded absence (step 5); BOTH live review-gate returns in
    postflight_gates.py plus cleanup_after_merge's git checkout main in postflight_gitops.py and
    plan.py's intact surface (step 6); and both satisfied-verdict oracles (steps 2 and 3).
  - >-
    Three further classes are explicitly NOT claimed as machine-verified, and the plan does not
    pretend otherwise. (a) INTERPRETIVE clauses -- the T4.3 / T5.6 forward addresses, decision
    attributions, architectural framing -- verified by reading the cited decisions and roadmap items
    at planning time. (b) CHECKABLE BUT DELIBERATELY UNCHECKED -- rec-028's six schedule.yaml
    provider entries, its _invoke_copilot_sdk reference and the COPILOT_MODEL_* routing under
    scripts/llm/, rec-457's :145-157 line anchor, rec-027's commit-6a2f7c0
    provenance, rec-609's scripts/sync/ops.py successor path, and rec-457's overwrite_jsonl call
    site; each was verified by inspection at planning time, and each is colour on an already-grounded
    verdict rather than load-bearing proof. (c) The commit-6a2f7c0 provenance specifically is NOT
    independently verifiable here -- this is a shallow clone, so the commit is unreachable -- and it
    is therefore asserted on
    Decision 121's authority, not on a git probe of this session's making.
  - >-
    After the rec-autoclose.yml run for the squash-merge commit reports status=completed (not merely
    after the merge lands), all ten resolution strings still contain their relevance= verdict -- i.e.
    the workflow did not overwrite the curated proof text with its boilerplate.
  - >-
    The resolution strings for rec-296, rec-423 and rec-425 each name the CURRENT defect location
    (postflight_gates.py's review-gate returns and postflight_gitops.py:cleanup_after_merge for
    rec-296 and rec-423 respectively, plan.py for rec-425 -- NOT the decomposed postflight.py facade,
    which now defines only finalize()), the CD.17 / T4.2 reversal condition, and an explicit re-file
    instruction, so the diagnosis carries a forward address rather than being discarded at close.
  - >-
    A new open recommendation exists against scripts/ops_portal/cli.py recording the governance gap
    that an agent can close or demote a Critical rec through the raw --update-rec CLI with no machine
    verification of the stated closure basis and no human-confirmation gate.
  - >-
    Two further open recommendations exist, filed on explicit human direction for gaps the critique
    gate surfaced outside this plan's portal-only scope: one against
    scripts/checks/verification/validate_handoff_full_tier.py (its matcher accepts a no-op --help
    segment as the Decision 163 full-tier step), and one against AGENTS.md (its rec-curator caveat
    attributes the priority-queue producer repoint to T2.26 rather than T4.3). Both carry acceptance
    commands that are RED today and go green only when actually fixed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Baseline the lane before any write -- confirm the ten targets are all open+Critical and that the
      open-Critical lane is exactly the expected twelve ids.
    command: >-
      bin/venv-python -c "import json,pathlib;
      rows=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];
      crit={r['id'] for r in rows if r.get('priority')=='Critical' and r.get('status')=='open'};
      tgt={'rec-027','rec-028','rec-296','rec-423','rec-425','rec-457','rec-468','rec-609','rec-610','rec-613'};
      assert tgt <= crit, f'not open+Critical: {sorted(tgt-crit)}';
      assert crit-tgt == {'rec-2816','rec-3059'}, f'unexpected lane residue: {sorted(crit-tgt)}';
      print('baseline ok: 12 open Critical, 10 targets +', sorted(crit-tgt))"
    expected: >-
      Prints "baseline ok: 12 open Critical, 10 targets + ['rec-2816', 'rec-3059']" and exits 0.
    fix_if: >-
      A target is missing from the open-Critical set means it was closed or re-prioritised since
      planning -- re-verify that rec individually and drop it from the batch rather than forcing the
      write. Extra ids in the residue means new Critical recs landed since planning; triage them
      separately, do NOT silently fold them into this batch.
    graduation: waive
    graduation_waiver_reason: >-
      This step asserts the pre-closure lane state that the plan deliberately destroys -- it is
      red-by-construction the moment the plan lands, so it cannot serve as a standing regression
      guard. Its evidentiary value is entirely confined to the implementing session.
  - step: 2
    phase: pre-deploy
    action: >-
      Re-run rec-457's own acceptance oracle to establish DETERMINISTIC satisfaction -- the only one of
      the ten eligible for Decision 103 auto-close.
    command: >-
      grep -q "priority-queue-entry" src/data/handlers/findings_processor_handler.py &&
      bin/venv-python -m pytest tests/test_findings_processor_handler.py -x -q
    expected: >-
      grep matches and the suite reports 18 passed. This is rec-457's filed acceptance command with
      the bare `python` replaced by `bin/venv-python` per AGENTS.md; no other substitution.
    fix_if: >-
      grep miss means the priority-queue routing block was reverted -- rec-457 is genuinely open again;
      abort its closure and re-verify. A test failure means the handler regressed; abort rec-457's
      closure and file a fresh rec rather than closing a rec whose feature is broken.
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_findings_processor_handler.py already runs in the standing full pytest suite, so the
      behaviour is guarded today; graduating a second registry copy of the same selector adds coverage
      of nothing and creates a duplicate maintenance point.
  - step: 3
    phase: pre-deploy
    action: >-
      Re-run rec-613's five named tests from their post-decomposition homes to establish satisfaction.
      rec-613 cites tests/test_execute_recommendation.py, which no longer exists as a module -- it was
      decomposed into the tests/execute_recommendation/ package, so the oracle must be re-pathed.
    command: >-
      bin/venv-python -m pytest tests/execute_recommendation/test_postflight_validation.py
      tests/execute_recommendation/test_resume.py -q
      -k 'auto_resume or foreign_checkpoint or doc_only_diff or baseline_failure'
    expected: >-
      Exactly 5 passed. The count matters -- rec-613's title claims five failing tests, so five passing
      selections is the precise refutation of its premise.
    fix_if: >-
      Fewer than 5 selected means the -k selector drifted against renamed tests; locate them by name
      before concluding anything. Any failure means the postmortem-preflight root cause rec-613
      describes is live again -- do NOT close it; re-file with the current failure output.
    graduation: waive
    graduation_waiver_reason: >-
      The tests/execute_recommendation/ package already runs in the standing full pytest suite. The
      only session-specific work here is the re-path from the decomposed module name, which is a
      one-time evidentiary act, not a durable invariant worth a registry slot.
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm the four physically-absent targets. Absence GROUNDS the stale_target verdicts for
      rec-028, rec-609 and rec-468. For rec-613 it is CORROBORATING only -- its verdict is satisfied,
      established by the re-pathed oracle at step 3; the absent path merely explains why its filed
      acceptance command could never run.
    command: >-
      for p in .github/copilot/settings.json scripts/sync_ops.py scripts/executor/rescue.py
      tests/test_execute_recommendation.py; do test ! -e "$p" || { echo "PRESENT: $p"; exit 1; }; done;
      echo "all four retired targets absent"
    expected: Prints "all four retired targets absent" and exits 0.
    fix_if: >-
      Any path printing PRESENT invalidates that rec's stale_target verdict -- the substrate was
      restored. Drop that rec from the batch and re-adjudicate it on its merits.
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as file_presence (FileAbsentCheck shares that slot), but tautological under
      the differential admission gate at scripts/verification_checks.py:318 -- all four paths are
      already absent on origin/main, so the check passes identically before and after this plan and
      would be rejected as non-admitted rather than registered.
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm every remaining assertion the resolution strings make that is not already covered by
      steps 2-4: Decision 55's verbatim cancellation of rescue.py (corroborating rec-468); the absence
      of validate.py's --ci flag and of branch agent/dq-validate-integration (both grounding rec-610);
      the three retired Copilot paths (grounding rec-027 and rec-028); and rec-607's closed status
      (one of rec-610's cited blockers). Every clause asserted in a durable resolution string must be
      machine-verified here -- an unverified clause is exactly the free-text-never-checked-against-
      reality failure this plan's own step-11 rec describes.
    command: >-
      grep -q 'scripts/executor/rescue.py` (planned but not yet written) is cancelled'
      docs/DECISIONS.md &&
      ! bin/venv-python -m scripts.validate --help 2>&1 | grep -q -- '--ci\b' &&
      ! git ls-remote --heads origin agent/dq-validate-integration | grep -q . &&
      test ! -e .github/copilot && test ! -e scripts/copilot_wrapper.py &&
      test ! -e scripts/copilot_sdk_client.py &&
      grep -q 'RetiredProviderError' src/data/handlers/scheduled_agent_handler.py &&
      bin/venv-python -c "import json,pathlib;
      rows=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];
      by={r['id']: r for r in rows};
      assert by.get('rec-607',{}).get('status')=='closed', 'rec-607 not closed';
      assert 'rec-608' not in by, 'rec-608 present -- Decision 70 records it as deleted';
      print('rec-607 closed; rec-608 absent as Decision 70 records')" &&
      echo "all resolution-string assertions verified"
    expected: >-
      Prints "rec-607 closed" then "all resolution-string assertions verified", exit 0.
    fix_if: >-
      A grep miss on DECISIONS.md means the clause was reworded -- quote the current wording instead;
      never close rec-468 citing text that is not there. If --ci reappears on validate.py, or the
      branch reappears on origin, rec-610's superseded verdict is void. If any Copilot path is
      restored, rec-027/rec-028 lose their grounding -- drop them from the batch. If rec-607 is not
      closed, strike that clause from rec-610's resolution rather than asserting it. Do NOT broaden
      any of these into a claim that no Copilot content remains under .github/ or scripts/ -- that is
      false: `rg -il copilot .github/ scripts/` matches 15 files, including six live
      `provider: copilot-sdk` entries in .github/agents/schedule.yaml which Decision 116 deliberately
      left in place as T4.3-owned.
    graduation: waive
    graduation_waiver_reason: >-
      All seven assertions in this chain are already true on origin/main, so like step 4 the step is
      tautological under the differential admission gate and would not be admitted. Pinning a
      Decision's exact prose in the verification registry would additionally make routine editorial
      rewording fail CI, which is a false-positive generator rather than a guard.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the two executor defects rec-296 and rec-423 describe are STILL LIVE at the addresses
      their resolution strings name. This step exists because the original strings asserted only that
      postflight.py exists -- but postflight.py was decomposed and now defines just finalize(), so
      facade existence no longer implies the defect survives. Closing a rec as latent-but-real
      requires evidence the defect is real, not that its former file still has the same name.
    command: >-
      grep -q 'Code review timed out (300s) -- treating as passed'
      scripts/executor/postflight_gates.py &&
      grep -q 'Code review call failed or returned empty' scripts/executor/postflight_gates.py &&
      grep -q 'def cleanup_after_merge' scripts/executor/postflight_gitops.py &&
      grep -A12 'def cleanup_after_merge' scripts/executor/postflight_gitops.py
      | grep -q '"checkout", "main"' &&
      grep -q 'def get_latest_plan' scripts/executor/plan.py &&
      echo "rec-296 / rec-423 defect sites live; rec-425 target intact"
    expected: >-
      Prints "rec-296 / rec-423 defect sites live; rec-425 target intact" and exits 0.
    fix_if: >-
      A miss on the postflight_gates.py messages means the review-gate collapse was fixed or moved --
      re-locate it before closing rec-296, and if it is genuinely fixed the verdict becomes satisfied,
      not blocked_by_decision. A miss on cleanup_after_merge's checkout means rec-423's coupling was
      fixed -- same re-adjudication. A miss on plan.py means it was decomposed like postflight.py;
      re-locate rec-425's surface and update its resolution before writing.
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as grep_count, but tautological under the differential admission gate for the
      same reason as steps 4 and 5 -- all five assertions already hold on origin/main and this plan
      changes no code, so the check passes identically before and after. It would also be an actively
      harmful standing guard: it asserts that two known defects REMAIN, so it would fail the day
      someone fixes them, penalising the repair.
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-handoff full-tier validation. Required on every plan declaring handoff_policy, docs-only
      plans included (Decision 163 / rec-2965, enforced by validate_handoff_full_tier).
    command: bin/venv-python -m scripts.validate
    expected: Exits 0 with the full check suite green.
    fix_if: >-
      Any failure blocks commit and PR per handoff_policy.full_validation_required_before_commit. On
      timeout, treat the run as blocked (timeout_disposition), resume later and rerun the full tier
      from the start -- never downgrade to --pre to get past it.
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Close the two deterministically-satisfied recs. rec-457 is the single Decision 103
      auto-close-eligible case (its own acceptance oracle passed unmodified at step 2); rec-613's
      oracle required only a re-path. Both carry execution_result=already_implemented.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-457 --status closed
      --execution_result already_implemented --resolution "relevance=satisfied (deterministic,
      Decision 103). Already implemented at src/data/handlers/findings_processor_handler.py:145-157 --
      splits type=priority-queue-entry findings out of all_findings and calls
      overwrite_jsonl('priority-queue/.priority-queue.jsonl', entries) before the comparison step,
      which is exactly the dispatch this rec requested. Filed acceptance command re-run 2026-08-12
      (bin/venv-python substituted for bare python): grep matches, tests/test_findings_processor_handler.py
      18/18 pass. RESIDUAL, NOT THIS REC: the implemented write still transits
      scripts/s3_log_store.py overwrite_jsonl -> ops.write('ops_priority_queue', ...) on the
      OpsWriter/Iceberg staging path while all queue readers already serve DuckLake, so curator output
      lands where nothing reads. That producer repoint is owned by tier_item T4.3 (Priority-queue
      producer repoint onto the DuckLake boundary), whose files_in_scope names scripts/s3_log_store.py
      and whose open criterion c1 is precisely 'no OpsWriter/Iceberg staging write survives on the
      producer path'. T2.26 is the ADJACENT item -- it migrated the ops_priority_queue table itself to
      DuckLake, which is what created the producer/reader split; it does not own the producer repoint.
      Note that AGENTS.md's rec-curator caveat still attributes the repoint to T2.26; that line
      predates the RMAP-07 split and is stale (PROJECT_CONTEXT.md records the correct chain, 'T2.26
      migrated ops queue substrate -> T4.3 priority-queue producer repoint to DuckLake'). Closed by
      PLAN-critical-lane-triage." &&
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-613 --status closed
      --execution_result already_implemented --resolution "relevance=satisfied (Decision 103). The
      cited module tests/test_execute_recommendation.py no longer exists -- it was decomposed into the
      tests/execute_recommendation/ package. All five tests this rec names now pass from their current
      homes (test_postflight_validation.py, test_resume.py); re-pathed oracle run 2026-08-12: 5 passed.
      The postmortem-preflight root cause it shares with rec-608 is resolved. Its filed acceptance
      command was doubly unrunnable regardless -- a Windows .venv/Scripts/python.exe path against a
      module that no longer exists. Closed by PLAN-critical-lane-triage."
    expected: >-
      Two confirmation lines, one naming rec-457 and one naming rec-613, each listing the updated
      fields; exit 0.
    fix_if: >-
      A RuntimeError naming an absent rec means the id is not in the current projection -- stop, do not
      re-file. A credential or transport failure fails loudly at the call site by design (Decision 84
      I-4); there is no outbox, so restore connectivity and re-run. Never hand-edit
      logs/.recommendations-log.jsonl to simulate the write -- a read cache is never a write source.
  - step: 9
    phase: post-deploy
    action: >-
      Close the three stale_target and two superseded recs -- the substrate-death cohort. Each cites
      the deterministic proof established at steps 4 and 5.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-028 --status closed
      --execution_result manual --resolution "relevance=stale_target (Decision 103; deterministic
      target-absence, the Decision 121 / rec-146 precedent -- a physically-absent target file is
      deterministic stale_target, not a bare semantic assertion). Target .github/copilot/settings.json
      does not exist, nor does the .github/copilot/ directory. The permissions model this rec would
      define has no settings surface to configure and no live provider to gate: Decision 116 retired
      the copilot-sdk provider outright, deleting scripts/copilot_sdk_client.py and the
      _invoke_copilot_sdk dispatch branch, so any agent still declaring that provider now raises
      RetiredProviderError (src/data/handlers/scheduled_agent_handler.py) rather than executing.
      SCOPE NOTE, deliberately not overclaimed: Copilot STRINGS do remain under .github/ and scripts/
      -- notably six provider: copilot-sdk entries in .github/agents/schedule.yaml, which Decision 116
      explicitly left unchanged as T4.3-owned, plus COPILOT_MODEL_* env routing under scripts/llm/.
      Those are dead-by-guard residue, not a live substrate this rec could configure. Authority:
      Decision 116 (retires the provider), Decision 117 (drops the copilot_wrapper boundary rows),
      Decision 121 (records the scripts/copilot_wrapper.py deletion and retires the cli-json-output
      contract). Closed by PLAN-critical-lane-triage." &&
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-609 --status closed
      --execution_result manual --resolution "relevance=stale_target (Decision 103, deterministic
      target-absence). Target scripts/sync_ops.py does not exist; its successor is scripts/sync/ops.py.
      The defect itself is architecturally void: the ops_recommendations_current legacy view whose
      string-typed list columns broke Pydantic validation was retired when ops_recommendations cut over
      to the DuckLake closed reader/writer boundary (Decision 84 I-1 -- ops_recommendations is
      DuckLake-sole with no legacy-engine path and no rollback flag, the OPS_STORAGE_BACKEND flag having been
      retired). There is nothing left to fix on the surface this rec describes. Closed by
      PLAN-critical-lane-triage." &&
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-468 --status closed
      --execution_result manual --resolution "relevance=stale_target (Decision 103, deterministic
      target-absence), corroborated by explicit cancellation. Target scripts/executor/rescue.py does
      not exist, and Decision 55 (RCA-First Executor, supersedes Decision 46) states verbatim:
      'scripts/executor/rescue.py (planned but not yet written) is cancelled.' The rescue-agent layer
      this rec would build -- RescueOutcome, RescueDispatcher, recursion guard -- is the architecture
      Decision 55 replaced with the RCA-first model precisely because LLM-judgement recovery automates
      workarounds instead of fixing root causes. Building it would contradict live governance, not just
      duplicate dead work. Closed by PLAN-critical-lane-triage." &&
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-027 --status closed
      --execution_result manual --resolution "relevance=superseded (Decision 103). The experiment this
      rec proposes -- can a VS Code subagent invoke copilot -p, can CLI --agent work with custom agents
      -- has no executable substrate left to run against. Verified absent: scripts/copilot_wrapper.py,
      scripts/copilot_sdk_client.py, and the .github/copilot/ directory. Decision 116 retired the
      copilot-sdk provider and deleted the client plus its dispatch branch; Decision 117 dropped the
      copilot_wrapper boundary rows as dead; Decision 121 records the copilot_wrapper.py deletion
      (commit 6a2f7c0, 'retire Copilot-SDK residue') and retires the cli-json-output contract that
      documented the very CLI-JSON boundary this experiment would characterise. SCOPE NOTE: this is
      NOT a claim that the string 'copilot'
      is absent from the tree -- dead-by-guard residue remains (see rec-028's resolution); the claim
      is that the three executable entry points the experiment needs are gone. NOT CD.28/dec-122 --
      that is the Bedrock-to-LiteLLM inference decision and mentions Copilot nowhere. Closed by
      PLAN-critical-lane-triage." &&
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-610 --status closed
      --execution_result manual --resolution "relevance=superseded (Decision 103). Dead-branch
      artifact: this rec records three preexisting blockers observed on branch
      agent/dq-validate-integration, which no longer exists on origin. Its acceptance command is
      unrunnable twice over -- a Windows .venv/Scripts/python.exe path, and a --ci flag that
      scripts/validate.py no longer exposes (the two-tier presubmit model is --pre plus the full tier,
      Decision 73). All three cited blockers are accounted for: rec-607 is verified closed in the
      current projection; rec-609 is closed in this same sweep as stale_target; and rec-608 is ABSENT
      from the projection by design -- Decision 70 names it as one of five hollow bootstrap records
      physically deleted from the Iceberg table on 2026-05-09, so its absence is a recorded deletion,
      not missing data. Nothing actionable survives. Closed by PLAN-critical-lane-triage."
    expected: >-
      Five confirmation lines, one per rec (rec-028, rec-609, rec-468, rec-027, rec-610); exit 0.
    fix_if: >-
      Same failure semantics as step 8. If a resolution string is rejected on length or content, do NOT
      truncate away the evidence -- the evidence IS the closure proof under Decision 103; shorten the
      framing prose instead.
  - step: 10
    phase: post-deploy
    action: >-
      Close the three blocked_by_decision executor recs. Each resolution carries the forward address --
      defect location, reversal condition, and re-file instruction -- because per the planning-time
      human decision (Q2) the resolution string is the SOLE home for these pointers.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-296 --status closed
      --execution_result manual --resolution "relevance=blocked_by_decision (Decision 103;
      close_proposed verdict, closed on explicit human direction in the PLAN-critical-lane-triage
      planning session). The autonomous executor is frozen: Decision 67's STRATEGIC-plan clause is
      Active and its reversal is gated on CD.17, which is state=pending in ROADMAP-PLATFORM.yaml.
      DEFECT IS LATENT, NOT FIXED, and it has MOVED since this rec was filed: postflight.py was
      decomposed and now defines only finalize(). The review gate now lives in
      scripts/executor/postflight_gates.py, which returns the tuple (True, 0.0, []) on
      subprocess.TimeoutExpired ('[REVIEW] Code review timed out (300s) -- treating as passed') and
      returns (True, cost, []) again when the review call fails or comes back empty. Both are the same
