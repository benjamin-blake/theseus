constraints:
- No rescue agents or workaround loops (Decision 55); out-of-scope findings become recommendations, not
  inline fixes (Decision 59).
- NEVER widen the CI apply role to avoid the split-apply. Decision 180 clauses 2-3 are permanent and reversing
  clause 3 requires re-deciding Decision 113's two-principal split.
- Agents never self-direct terraform apply (Decision 126). Step 11 applies only after the plan output
  is presented and a human explicitly accepts it.
- 'Public-repo boundary (Decision 101): use ${var.account_id} / ${var.aws_region} in HCL; never put the
  account id, either ExternalId, or an account-bearing ARN in a commit, PR body or chat.'
- Read-only scope. No trail creation or mutation, no cloudwatch:PutMetricData, no new alarm writes, no
  widening of any existing write grant.
- Do not attach a permissions boundary to PlatformAdmin and do not remove PlatformDev's (Decision 144
  cl3 / 180 cl3) -- PlatformAdmin must stay able to amend the boundary.
- The decomposition must not change any Terraform resource address, and must retain the config/structural_size_budgets.yaml
  roster key for platform_roles.tf.
- Decompose rather than raise any size budget (Decision 128/165/166); every new .tf file stays under 500
  effective lines.
