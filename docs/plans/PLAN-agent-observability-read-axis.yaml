rollback: Revert the commit and re-run the same targeted split-apply to restore the prior inline policies.
  The grants are purely additive and read-only and the decomposition changes no Terraform address, so
  a revert removes capability without breaking any write path; the Lever B check and its registry row
  are removed with it, leaving no orphan gate.
