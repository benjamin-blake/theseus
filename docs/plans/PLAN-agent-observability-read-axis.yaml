execution_steps:
- 'Decompose first, as a pure move with NO content edits, so the grant diff is reviewable on its own:
  move platform_dev_runtime to terraform/personal/platform_dev_policies.tf, platform_admin_ops to terraform/personal/platform_admin_policies.tf,
  and platform_admin_datalake + platform_admin_bootstrap_state + platform_admin_ducklake_breakglass to
  terraform/personal/platform_admin_data_policies.tf. platform_roles.tf keeps both aws_iam_role resources
  and their banners. Carry each resource''s leading comment block with it. Run VP steps 1-2 before editing
  any policy body.'
- 'platform_admin_policies.tf -- add to AdminOps: one Sid granting cloudwatch:GetMetricStatistics, GetMetricData,
  ListMetrics, DescribeAlarmsForMetric, cloudtrail:LookupEvents and s3:ListAllMyBuckets on Resource "*"
  with a collocated comment naming each as unscopable (the CloudWatchAlarmDescribe / LambdaLogGroupDescribe
  / SSMDescribeParameters idiom); one Sid granting cloudwatch:DescribeAlarmHistory on alarm:* (the CloudWatchAlarmManagement
  idiom at platform_roles.tf:330) -- never alarm:agent-platform-*, which matches zero live alarms; one
  Sid granting s3:ListBucket + s3:ListBucketVersions on arn:aws:s3:::agent-platform-*.'
- 'Byte-limit preconditions (Decision 156). A precondition CANNOT reference `self` -- that is postcondition-only
  -- so each of the TWO policy documents this plan grows -- platform_admin_ops and platform_dev_runtime
  -- must first be HOISTED out of its inline `policy = jsonencode({...})` attribute into a `locals` block,
  exactly as terraform/bootstrap does (github_ci_apply_policy.tf:7, github_ci_apply_boundary.tf:8). The
  resource then reads `policy = local.<name>` and its lifecycle precondition uses the canonical minified
  measure `length(jsonencode(jsondecode(local.<name>))) <= 10240` -- never a raw `length()` and never
  `replace(..., " ", "")`, which strips spaces inside string values and under-counts. This hoist restructures
  platform_dev_policies.tf and platform_admin_policies.tf ONLY. Do NOT hoist anything in platform_admin_data_policies.tf:
  it grows no grant, so it needs no byte precondition, and leaving it unhoisted is what makes its ''no
  statement added, removed or reordered'' claim literally true. (A plan-critique round predicted that
  hoisting there would also false-red VP step 6 by moving the terminator its order assertion scans to;
  that mechanism did NOT reproduce under simulation, so it is recorded as unconfirmed and is not the reason
  for this instruction.) This hoist restructures the two grown files, so do it as part of the move (before
  adding grants) and re-run VP steps 1, 9 and 14. Widening validate_iam_policy_size to this root is deferred
  to rec-3765, so NOTHING else asserts these three preconditions exist -- VP step 11 does.'
- 'platform_dev_policies.tf -- add to DailyOps: one Sid granting the CloudWatch metric read verbs plus
  cloudwatch:DescribeAlarms and logs:DescribeLogGroups on Resource "*"; one Sid granting logs:DescribeLogStreams/GetLogEvents/FilterLogEvents
  on the /aws/lambda/agent-platform-* log-group and log-stream ARNs. Grant no cloudtrail verb here --
  the permissions boundary''s DataPlaneAllow has no cloudtrail entry, so it would be inert. Leave both
  Deny Sids untouched.'
- platform_admin_data_policies.tf -- move platform_admin_datalake, platform_admin_bootstrap_state and
  platform_admin_ducklake_breakglass VERBATIM. Do NOT reorder any statement. rec-2696 asked for an AlertsTopicManage/CatalogDrObjectRead
  swap; its premise is stale (live order was re-measured 2026-09-13 and already matches repo order), so
  the swap would introduce the very drift it was filed to remove.
