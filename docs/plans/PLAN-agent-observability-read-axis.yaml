schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: agent-observability-read-axis
intent: Close the agent-identity observability read axis so an agent can read CloudWatch metrics, CloudTrail
  events and S3 bucket inventory from AWS, making alarm triage and billed-storage measurement possible
  from the platform itself rather than only from GitHub Actions job logs. Unblocks the measurement half
  of T2.18 c2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-agent-observability-read-axis.yaml
phase: T2.48
scope:
- file: terraform/personal/platform_roles.tf
  action: Modify
  purpose: Decompose (Decision 128/166). RETAIN both aws_iam_role resources and their IMPORT-BEFORE-APPLY
    banners here; move the five aws_iam_role_policy resources to the three sibling files below. Keeping
    the roles here preserves the graduated check platformdev-bounded-platformadmin-excluded, whose command
    greps this path for both roles.
- file: terraform/personal/platform_dev_policies.tf
  action: Create
  purpose: aws_iam_role_policy.platform_dev_runtime (DailyOps) plus the new PlatformDev observability
    read statements (rec-2851). Preserves DenyStateAndConvergenceWrite / DenyStateRead verbatim.
- file: terraform/personal/platform_admin_policies.tf
  action: Create
  purpose: aws_iam_role_policy.platform_admin_ops (AdminOps) plus the new PlatformAdmin metric, alarm-history,
    CloudTrail and bucket-inventory read statements (rec-3763, rec-2906).
- file: terraform/personal/platform_admin_data_policies.tf
  action: Create
  purpose: platform_admin_datalake (with the rec-2696 AlertsTopicManage/CatalogDrObjectRead reorder),
    platform_admin_bootstrap_state and platform_admin_ducklake_breakglass, moved verbatim.
- file: scripts/checks/iam_tf/validate_agent_observability_read_coverage.py
  action: Create
  purpose: Lever B. Observability-read coverage gate that CONSUMES _read_coverage.py's existing resource-type
    census as the single classification table (Decision 129 pt4 already owns that census; a second independent
    census would be the two-surfaces-one-subject anti-pattern and a drift seam). This module adds only
    the per-agent-identity observability READ-GRANT map on top of it, and fails loud when a managed observability
    resource has no covering agent-identity grant.
- file: scripts/checks/iam_tf/_manifest.py
  action: Modify
  purpose: register the new check (pre=True, full_segment="full_after_lint"), matching its siblings
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: function_to_category row mapping the new check to iam_gap (Decision 142)
- file: config/agent/verification_registry/entries/cloudtrail-read-only-no-write-verbs.yaml
  action: Create
  purpose: the one graduated VP step's registry row (Decision 132/176)
- file: tests/checks/iam_tf/test_validate_agent_observability_read_coverage.py
  action: Create
  purpose: negative + positive mirror tests for the new check (Decision 131)
- file: config/structural_size_budgets.yaml
  action: Modify
  purpose: 'Set the terraform/personal/platform_roles.tf roster value to 500 (the governing class default,
    so the entry grants no raise) and RETAIN both the key and its ''# raise-approved: dec-166'' marker,
    updating the marker text to record the post-split measurement. The key is asserted by the graduated
    check structural-registry-section-scoped-extraction; retention is safe because dec-166 names this
    path verbatim (Decision 165 cl2) and decreases are unrestricted. Do NOT set it below 500 -- that would
    make the entry a tighter-than-class-default ratchet.'
- file: terraform/CLAUDE.md
  action: Modify
  purpose: re-ground its two "CODIFIED in terraform/personal/platform_roles.tf" references to the new
    policy files
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'Tier Item Freshness Gate re-grounding for the phase item T2.48 (and sibling T2.44): its files_in_scope
    names ''scripts/checks/iam_tf.py'', which is a PACKAGE now, and references platform_roles.tf for content
    this plan relocates. Roadmap-bookkeeping only -- no criterion status flips. Requires explicit human
    confirmation before landing (planning-skill sole exception).'
bundled_recommendations:
- rec-3763
- rec-2906
- rec-2851
- rec-2696
followon_recs:
- rec-3765
infrastructure_dependencies:
- SPLIT-APPLY required (docs/contracts/deploy-paths.yaml#admin_out_of_band.procedure). Decision 180 clause
  3 permanently excludes PlatformAdmin from every CI-writable Resource pattern, and IAMRoleWriteBounded
  scopes iam:PutRolePolicy to role/agent-platform-* only (the sole role/PlatformDev grant, IAMRoleMetadataWrite,
  is metadata-only), so the governed CD gated-apply path cannot apply an inline-policy write on either
  role. Never widen the CI role to avoid this.
- 'ADMIN container precondition: INSTALL_TERRAFORM=1 bin/setup-cloud-env.sh must have synced the S3 provider
  filesystem_mirror and exported TF_CLI_CONFIG_FILE (Decision 119/120), else terraform -chdir=terraform/personal
  init cannot resolve the kislerdm/neon provider. Each Bash call is independent, so inline TF_CLI_CONFIG_FILE
  on every terraform invocation.'
- 'Ordering: admin split-apply FIRST, then push to the PR head so the speculative-plan job saves a post-apply
  plan.bin showing zero diff; merging a pre-apply plan.bin AccessDenies at apply and latches a red convergence
  record (Decision 77 no-re-plan).'
- The four no-default tfvars (account_id, owner_email, platform_dev_external_id, platform_admin_external_id)
  come from remote state; never paste their values anywhere.
acceptance_criteria:
- terraform/personal/platform_roles.tf retains both aws_iam_role resources (platform_dev with its permissions_boundary,
  platform_admin with none) and declares no aws_iam_role_policy; the five policy resources live in the
  three new sibling files with their Terraform addresses unchanged.
- PlatformAdmin AdminOps grants cloudwatch:GetMetricStatistics, GetMetricData, ListMetrics and DescribeAlarmsForMetric
  plus cloudtrail:LookupEvents and s3:ListAllMyBuckets on Resource "*", each with a collocated comment
  stating the API supports no resource-level scoping; cloudwatch:DescribeAlarmHistory on the alarm ARN
  prefix.
- PlatformAdmin grants s3:ListBucket + s3:ListBucketVersions on the arn:aws:s3:::agent-platform-* prefix
  (Lever A), not an enumerated bucket list.
- The repo grants NO cloudtrail Create/Delete/Update/Put verb anywhere (rec-2906 is read-only), and no
  cloudwatch write verb beyond the alarm lifecycle AdminOps already held.
- PlatformDev DailyOps grants the CloudWatch metric read verbs and cloudwatch:DescribeAlarms plus logs:DescribeLogGroups
  on "*" and logs:DescribeLogStreams/GetLogEvents/FilterLogEvents on the /aws/lambda/agent-platform-*
  prefix, and still carries DenyStateAndConvergenceWrite and DenyStateRead verbatim (T2.44 c3). PlatformDev
  gets no cloudtrail grant.
- platform_admin_data_policies.tf places AlertsTopicManage ahead of CatalogDrObjectRead so config matches
  live state and the split-apply plan shows no spurious statement-order diff (rec-2696).
- validate_agent_observability_read_coverage FAILS LOUD on an unmapped managed resource type and on a
  managed observability resource with no covering agent-identity read grant; it passes on the fixed tree,
  runs in both --pre and full tiers, and declares accounting via registry.examined.
- config/structural_size_budgets.yaml still contains the terraform/personal/platform_roles.tf roster key
  (the graduated check structural-registry-section-scoped-extraction asserts it), and every touched .tf
  file measures under its governing effective-line limit.
- 'Live behavioural proof (Decision 48): under agent_platform_admin, metric reads, cloudtrail:LookupEvents,
  s3:ListBucketVersions and s3:ListAllMyBuckets return data instead of AccessDenied; under agent_platform,
  metric reads and log reads return data.'
- AdminOps and DailyOps each stay under the 10,240 B whitespace-stripped inline-policy hard limit.
- All four bundled recommendations are closed in the warehouse after merge.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Decomposition is address-preserving: platform_roles.tf keeps both roles and no policy, and
    the five policy addresses are declared exactly once across the root.'
  command: '! grep -q ''resource "aws_iam_role_policy"'' terraform/personal/platform_roles.tf && test
    "$(grep -ho ''resource "aws_iam_role_policy" "[a-z_]*"'' terraform/personal/*.tf | sort -u | wc -l)"
    = "5"'
  expected: exit 0 -- no policy resource remains in platform_roles.tf and all five addresses are present
    exactly once across the root
  fix_if: a policy was duplicated or renamed during the move; Terraform addresses must not change or the
    split stops being a no-op apply
  hermetic: true
  graduation: waive
  graduation_waiver_reason: This asserts a one-time refactor shape, not a durable invariant -- a future
    legitimate policy addition to platform_roles.tf would red it for the wrong reason. The durable half
    (both roles stay here, boundary present/absent) is already graduated as platformdev-bounded-platformadmin-excluded
    and re-run by VP step 2.
- step: 2
  phase: pre-deploy
  action: 'The existing graduated boundary check still holds after the move: PlatformDev carries the permissions
    boundary, PlatformAdmin does not (Decision 144 cl3 / 180 cl3).'
  command: grep -A3 'resource "aws_iam_role" "platform_dev"' terraform/personal/platform_roles.tf | grep
    -q 'permissions_boundary' && ! grep -A3 'resource "aws_iam_role" "platform_admin"' terraform/personal/platform_roles.tf
    | grep -q 'permissions_boundary'
  expected: exit 0 -- byte-identical to the command in config/agent/verification_registry/entries/platformdev-bounded-platformadmin-excluded.yaml
  fix_if: the roles were moved out of platform_roles.tf; move them back -- the graduated row greps this
    path
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Already graduated as platformdev-bounded-platformadmin-excluded; this step
    re-runs that exact command to prove the decomposition did not break it. A second registry row with
    the same command would duplicate an existing standing guard.
- step: 3
  phase: pre-deploy
  action: rec-3763 acceptance -- the three CloudWatch metric read verbs are present in the PlatformAdmin
    AdminOps policy file.
  command: test "$(grep -c -e 'cloudwatch:GetMetricStatistics' -e 'cloudwatch:GetMetricData' -e 'cloudwatch:ListMetrics'
    terraform/personal/platform_admin_policies.tf)" = "3"
  expected: exit 0 -- all three verbs present (the pre-change tree has none anywhere)
  fix_if: a verb is missing, or landed in the data-policies file instead of AdminOps
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Lever B (validate_agent_observability_read_coverage) asserts this same metric-read
    coverage structurally and per managed resource type, and is registered in both tiers; a grep-shaped
    registry row on three literals would be the weaker duplicate of it.
- step: 4
  phase: pre-deploy
  action: rec-2906 acceptance -- cloudtrail:LookupEvents is granted and no cloudtrail write verb exists
    anywhere in the repo's terraform.
  command: grep -rq '"cloudtrail:LookupEvents"' terraform/personal/ && ! grep -rq -e '"cloudtrail:Create'
    -e '"cloudtrail:Delete' -e '"cloudtrail:Update' -e '"cloudtrail:Put' terraform/
  expected: exit 0 -- the read verb is present and no trail-mutating verb leaked in
  fix_if: a write verb is present; rec-2906 is explicitly read-only scope, remove it
  hermetic: true
  graduation: graduate
  graduation_check_id: cloudtrail-read-only-no-write-verbs
- step: 5
  phase: pre-deploy
  action: rec-2851 acceptance -- PlatformDev carries cloudwatch and logs reads AND still carries both
    explicit state/convergence Denies (T2.44 c3 must not regress).
  command: grep -q 'cloudwatch:' terraform/personal/platform_dev_policies.tf && grep -q 'logs:FilterLogEvents'
    terraform/personal/platform_dev_policies.tf && grep -q 'DenyStateAndConvergenceWrite' terraform/personal/platform_dev_policies.tf
    && grep -q 'DenyStateRead' terraform/personal/platform_dev_policies.tf
  expected: exit 0 -- reads added and both Deny Sids preserved verbatim
  fix_if: a Deny Sid is missing -- T2.44 c3 is met today and this plan must not silently un-meet it
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The read half is covered structurally by Lever B; the Deny half is already
    guarded by the registered check validate_convergence_writer_isolation, which parses the whole terraform/personal
    root and therefore follows the statements into their new file unaided.
- step: 6
  phase: pre-deploy
  action: rec-2696 acceptance -- AlertsTopicManage precedes CatalogDrObjectRead so config matches live
    state.
  command: grep -A 250 AlertsTopicManage terraform/personal/platform_admin_data_policies.tf | grep -q
    CatalogDrObjectRead
  expected: exit 0 (the pre-change order is reversed, so this is red before the fix)
  fix_if: still reversed; move the AlertsTopicManage block ahead of CatalogDrObjectRead
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'One-time drift convergence, not a durable invariant: once config matches
    live the property is re-asserted continuously by the zero-diff plan requirement (VP step 13), and
    a text-order registry row would red on any future legitimate statement reordering.'
- step: 7
  phase: pre-deploy
  action: S3 list grants use the account-scoped prefix rather than an enumerated bucket list (Lever A,
    Decision 129 pt1 / 144 cl2).
  command: grep -q 's3:ListBucketVersions' terraform/personal/platform_admin_policies.tf && grep -q 'arn:aws:s3:::agent-platform-\*'
    terraform/personal/platform_admin_policies.tf
  expected: exit 0 -- the verb is present and expressed at the prefix
  fix_if: buckets were enumerated individually, which re-creates the one-cycle lag class Decision 129
    retired
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Lever B asserts bucket read-coverage per managed aws_s3_bucket resource, which
    is the property this grep approximates; the structural check supersedes a literal-prefix grep.
- step: 8
  phase: pre-deploy
  action: Lever B red-green -- the new check fails loud on an unmapped type and on an uncovered observability
    resource, and passes on the fixed tree.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_agent_observability_read_coverage.py
    -q
  expected: all tests pass, including an unmapped-type fixture and an uncovered-log-group fixture that
    each FAIL LOUD
  fix_if: only a positive test exists -- a check with no negative proof has not been shown to discriminate
    (Decision 129 pt4)
  hermetic: false
  graduation: waive
  graduation_waiver_reason: This selector is the registered check's own mirror-test suite, which scripts.validate
    already runs in the full tier through the check registry; a registry row pointing at the same selector
    would duplicate an existing standing guard rather than add one.
- step: 9
  phase: pre-deploy
  action: 'Structural-size governance holds: every touched .tf file is under its limit and the platform_roles.tf
    roster key survives.'
  command: bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import
    effective_lines; import sys,re; paths=['terraform/personal/platform_roles.tf','terraform/personal/platform_dev_policies.tf','terraform/personal/platform_admin_policies.tf','terraform/personal/platform_admin_data_policies.tf'];
    rows=[(p, effective_lines(Path(p).read_text())) for p in paths]; print(rows); b=Path('config/structural_size_budgets.yaml').read_text();
    assert 'terraform/personal/platform_roles.tf' in b, 'roster key removed'; m=re.search(r'terraform/personal/platform_roles\.tf:\s*(\d+)',
    b); print('roster value', m.group(1)); assert 500 <= int(m.group(1)) < 587, 'roster value must be
    ratcheted to the class default, not raised or over-tightened'; sys.exit(0 if all(n<=500 for _,n in
    rows) else 1)"
  expected: every file at or under 500 effective lines, the roster key and its dec-166 marker both retained,
    and the value ratcheted to 500
  fix_if: a sibling exceeds 500 -- split it further (Decision 128 decompose, never a raise). If the roster
    key or its marker was deleted while the entry survives, restore it -- removal of a marker under a
    surviving entry is the un-freezing escape the raises check exists to catch.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: validate_structural_size_limits already enforces per-file effective-line limits
    repo-wide in both tiers, and the roster-key half is already graduated as structural-registry-section-scoped-extraction;
    this step only proves the refactor landed inside both existing guards.
- step: 10
  phase: pre-deploy
  action: HCL formatting is clean across the four touched files. Provider-free and local per Decision
    119; the authoritative validate/plan verifier is CI's REQUIRED terraform-validate check, which runs
    scripts.validate --terraform-only (init -backend=false + validate + fmt -check) over all three live
    roots.
  command: terraform fmt -check -diff terraform/personal/platform_roles.tf terraform/personal/platform_dev_policies.tf
    terraform/personal/platform_admin_policies.tf terraform/personal/platform_admin_data_policies.tf
  expected: exit 0 with no diff emitted; CI terraform-validate then confirms init/validate across the
    root
  fix_if: run terraform fmt on the four files; never hand-align. A validate error that only CI can see
    means the move broke a reference -- read the terraform-validate job log, do not author a local init
    for terraform/personal outside the step-12 break-glass tier.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Formatting is already gated repo-wide by CI's required terraform-validate
    check via scripts.validate --terraform-only; a registry row would duplicate a standing required check,
    and the terraform binary is absent from the venv-only registry runner.
- step: 11
  phase: pre-deploy
  action: The new check is registered and executes, and the full fast gate is green end to end.
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0, and the output names validate_agent_observability_read_coverage as an executed check
  fix_if: the check is absent from the run -- the _manifest.py Entry is missing, or the ci_rca_taxonomy
    row is absent and the taxonomy completeness assertion is red
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: post-deploy
  action: SPLIT-APPLY, human-gated. In the ADMIN container sync the provider mirror, init, then run a
    TARGETED plan over the three changed policy addresses, PRESENT the output, and apply ONLY after explicit
    human acceptance. Never self-directed (Decision 126/180/183).
  command: INSTALL_TERRAFORM=1 bin/setup-cloud-env.sh && terraform -chdir=terraform/personal init -input=false
    && terraform -chdir=terraform/personal plan -var-file=terraform.personal.tfvars -target=aws_iam_role_policy.platform_admin_ops
    -target=aws_iam_role_policy.platform_dev_runtime -target=aws_iam_role_policy.platform_admin_datalake
  expected: exactly three in-place inline-policy updates, no role/trust/destroy diff and no resource replacement
    (the file move must contribute nothing); then, after explicit human acceptance, the same targeted
    apply succeeds under agent_platform_admin
  fix_if: any assume_role_policy diff appears -- STOP and reconcile the ExternalIds against live state
    per the file's IMPORT BEFORE APPLY banner; never apply a trust diff. Any create/destroy pair means
    an address changed in the move.
- step: 13
  phase: post-deploy
  action: Live behavioural proof for all four recs under both profiles (Decision 48 -- invoke, do not
    grep).
  command: aws cloudwatch get-metric-statistics --namespace DuckLakeMaintenance --metric-name MergeOpsFilesBeforeTotal
    --start-time "$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    --period 86400 --statistics Sum --profile agent_platform_admin --region eu-west-2 && aws cloudtrail
    lookup-events --max-results 1 --profile agent_platform_admin --region eu-west-2 && aws s3api list-object-versions
    --bucket agent-platform-data-lake --max-keys 1 --profile agent_platform_admin --region eu-west-2 &&
    aws s3api list-buckets --profile agent_platform_admin && aws cloudwatch list-metrics --namespace DuckLakeMaintenance
    --profile agent_platform --region eu-west-2 && aws logs filter-log-events --log-group-name /aws/lambda/agent-platform-ducklake-writer
    --limit 1 --profile agent_platform --region eu-west-2
  expected: all six calls return data instead of AccessDenied (every one of them is denied on the pre-change
    tree -- measured 2026-09-12)
  fix_if: a verb is denied despite being present in the policy -- it was granted at the wrong resource
    axis; rescope it per the rec-2882 precedent (presence in a policy is never proof it can authorize)
    and confirm with aws iam simulate-principal-policy before re-applying
- step: 14
  phase: post-deploy
  action: 'Global convergence before merge (Decision 98 pt4c): an untargeted plan reports no changes,
    so the post-merge saved-plan apply is a no-op rather than a red latch.'
  command: terraform -chdir=terraform/personal plan -var-file=terraform.personal.tfvars -detailed-exitcode
  expected: exit code 0 (no changes). Then push to the PR head so the speculative-plan job saves a post-apply
    plan.bin, and confirm its PR comment reports no change before merging.
  fix_if: exit code 2 -- the apply did not fully converge; do not merge, or the saved plan will AccessDeny
    at apply and latch the convergence record red
- step: 15
  phase: post-deploy
  action: Inline-policy byte headroom is intact after the additions (LimitExceeded is invisible to terraform
    plan and surfaces only after the approval is spent).
  command: aws iam get-role-policy --role-name PlatformAdmin --policy-name AdminOps --profile agent_platform_admin
    | bin/venv-python -c "import sys,json; d=json.load(sys.stdin); s=json.dumps(d['PolicyDocument'],separators=(',',':'));
    print(d['PolicyName'], len(s)); sys.exit(1 if len(s)>10240 else 0)"
  expected: a minified byte count under 10240 and exit 0 (AdminOps measured 3619 B, DailyOps 1905 B before
    the change)
  fix_if: over the limit -- move the observability statements into their own inline policy rather than
    trimming comments
- step: 16
  phase: post-deploy
  action: Answer the question the gap blocked -- is the every-6h merge_ops cadence actually running?
  command: aws cloudwatch get-metric-statistics --namespace DuckLakeMaintenance --metric-name MergeOpsFilesBeforeTotal
    --start-time "$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    --period 21600 --statistics Sum SampleCount --profile agent_platform_admin --region eu-west-2
  expected: a datapoint series reported in the handoff. A sparse or empty series IS the finding and must
    be filed as a recommendation, not repaired here -- the cadence is outside this plan's scope boundary
    (Decision 59).
  fix_if: the series is empty -- distinguish "metric never emitted" from "cadence not firing" before concluding,
    and do not repair the cadence in this plan
- step: 17
  phase: post-deploy
  action: Closure sweep -- all four bundled recommendations are closed in the warehouse.
  command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;rows=dict((r['id'],r['status'])
    for r in (json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()));want=['rec-3763','rec-2906','rec-2851','rec-2696'];print([(k,rows.get(k))
    for k in want]);assert all(rows.get(k)=='closed' for k in want)"
  expected: all four report status closed after the Resolves trailer fires rec-autoclose
  fix_if: 'any still open -- the squash-merge commit body is missing its "Resolves: rec-NNNN" trailer'
test_obligations:
- source: terraform/personal/platform_roles.tf
  behavior: Both aws_iam_role resources stay in this file with PlatformDev boundary-carrying and PlatformAdmin
    boundary-free, so the graduated boundary check keeps resolving.
  verification_step: 2
  command: grep -A3 'resource "aws_iam_role" "platform_dev"' terraform/personal/platform_roles.tf | grep
    -q 'permissions_boundary'
  red_green_expectation: red if the roles are moved out (the grep finds nothing at this path); green on
    the intended split
- source: terraform/personal/platform_dev_policies.tf
  behavior: PlatformDev holds the observability reads and retains both explicit state/convergence Denies
  verification_step: 5
  command: grep -q 'DenyStateAndConvergenceWrite' terraform/personal/platform_dev_policies.tf
  red_green_expectation: red before the move lands the Deny in this file; green after, proving T2.44 c3
    did not regress
- source: terraform/personal/platform_admin_policies.tf
  behavior: PlatformAdmin holds the three CloudWatch metric read verbs
  verification_step: 3
  command: test "$(grep -c -e 'cloudwatch:GetMetricStatistics' -e 'cloudwatch:GetMetricData' -e 'cloudwatch:ListMetrics'
    terraform/personal/platform_admin_policies.tf)" = "3"
  red_green_expectation: red before (no metric verb exists anywhere in the tree today); green after
- source: terraform/personal/platform_admin_data_policies.tf
  behavior: the datalake policy's statement order matches live state (rec-2696)
  verification_step: 6
  command: grep -A 250 AlertsTopicManage terraform/personal/platform_admin_data_policies.tf | grep -q
    CatalogDrObjectRead
  red_green_expectation: red before the reorder (order is currently reversed); green after
- source: scripts/checks/iam_tf/validate_agent_observability_read_coverage.py
  behavior: fails loud on an unmapped managed resource type and on an uncovered observability resource
  verification_step: 8
  test_selector: tests/checks/iam_tf/test_validate_agent_observability_read_coverage.py
  red_green_expectation: the negative fixtures are red before the check discriminates, green once it does
- source: scripts/checks/iam_tf/_manifest.py
  behavior: the new check is registered and actually executes in the --pre and full tiers
  verification_step: 11
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: the check is absent from the --pre run before the Entry lands and named in it
    afterwards
- source: config/ci_rca_taxonomy.yaml
  behavior: the new registered check maps to the iam_gap failure category so a red main routes correctly
  verification_step: 11
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: validate_ci_rca_taxonomy is red for a registered-but-unmapped check and green
    once the row lands
- source: config/structural_size_budgets.yaml
  behavior: The platform_roles.tf roster key survives the decomposition (the graduated extraction check
    depends on it) while its value stops overstating a file that is now a fraction of its old size.
  verification_step: 9
