constraints:
  - >-
    Decision 168 evaluator grammar (the load-bearing bar): a {check: name} evaluator resolves ONLY if name
    is in registry.all_checks() AND in pre_sequence()/full_sequence(), AND the check's own module -- or a
    one-hop scripts/ import -- contains the contract BASENAME as an exact string literal, or as the final
    /-delimited segment of a whitespace-free path-shaped literal, in EXECUTABLE context. Docstrings and #
    comments are excluded. Each of the six modules must therefore carry its OWN basename literal in-module;
    a constant living in _manifest.py or a path composed from a variable silently fails the gate.
  - >-
    Decision 104 (one concern per file, retained by Decision 169): ONE registered check per module. An
    earlier draft of this plan put all six in a single module; it was revised specifically to comply. The
    repo's only multi-check module is scripts/checks/typing/mypy_baseline.py (two checks over one shared
    mechanism) -- six unrelated consumers is well outside that precedent.
  - >-
    Decision 169: register via a bare-string-literal Entry in scripts/checks/contracts/_manifest.py. NEVER
    edit scripts/validate.py. module=/attr= must be plain ast.Constant strings -- an f-string or computed
    value silently severs the dependency_graph driver->check edge.
  - >-
    Decision 159 (unbaselined files keep 100%): no scripts/checks/contracts/* file carries a
    config/coverage_baseline.yaml entry, so all six new modules must land at 100% LINE COVERAGE. The mirror
    tests must exercise every red path -- missing file, malformed YAML, and genuine drift. Do not add a
    coverage_baseline.yaml entry to escape this.
  - >-
    Decision 161 (mypy downward ratchet): an unregistered file's implicit baseline is 0, and no
    contracts-domain file is registered, so all six modules must be mypy-clean. validate_mypy_ratchet is
    FULL-TIER ONLY -- a miss escapes --pre and reds main post-merge as a critical ci_rca rec. This is why VP
    step 10 runs the full tier before handoff.
  - >-
    Class D amendment rule: any parsed-content change to a Class D file REQUIRES a new amendment_log[] entry
    or validate_contract_drift fails with '(amendment): parsed content changed but no new amendment_log[]
    entry'. That is SEVEN files here -- the six contracts plus contract-population.yaml itself. change_class
    must come from the closed 8-value vocabulary; use field_add for read-engine (a verb is added) and
    governance_note_add for the pure evaluator flips and the pin lowering.
  - >-
    EvaluatorSpec is extra=forbid with an exactly-one-kind validator: the flip must REPLACE the whole
    none_grandfathered block with `check: <name>`, not sit alongside it.
  - >-
    Ratchet pins are equality-bound to the live census in BOTH directions. Two pins move in THIS PR:
    evaluator_none_grandfathered_max 8 -> 2 and grandfathered_max 19 -> 17. The second is easy to miss:
    log-storage.yaml and inference-provider.yaml are status:ratified, so removing their none_grandfathered
    moves each from the grandfathered bucket to declared (the gate buckets status:active as grandfathered
    REGARDLESS of evaluator quality, which is why the other four do not move). status_active_max stays 16 --
    do NOT change any contract's status; ratification is not required to add an evaluator.
  - >-
    Both pin moves are DOWNWARD and _ratchet.py builds all three pin specs with gated_direction="up", so NO
    `# raise-approved` marker is required or permitted here.
  - >-
    Every check must accept an injectable `contracts_dir: Path | None = None` (mirroring
    validate_contract_drift) and honour it for ALL contract reads, so red-path proofs perturb a temporary
    copy and never the working tree.
  - >-
    All six Entries use pre_globs=None (ungated, always runs in --pre), matching the sibling precedent --
    every existing pre=True entry in scripts/checks/contracts/_manifest.py (validate_intent_doc_freeze,
    validate_contract_drift, validate_data_model_standard) carries pre_globs=None. Do NOT narrow these to
    globs: each assertion has TWO sides, so a glob set must name the contract AND every consumer path, and
    ci-rca-lifecycle alone has three (scripts/ops_portal/ci_rca_schema.py, config/ci_rca_taxonomy.yaml, and
    scripts/checks/ci_guards/validate_ci_rca_adjudication.py for the pointer leg) while telemetry-lexicon's
    consumers are sibling contracts (docs/contracts/telemetry_*.yaml, its route declares consumer: null). An
    incomplete glob is a SILENT --pre skip -- the same vacuous-pass family this plan exists to close. The six
    checks are cheap (a YAML parse plus one light import each), so ungated is the correct trade.
  - >-
    Squash-merge body carries `Resolves: rec-3095` ONLY. Do NOT list rec-3059 -- it is a Critical rec whose
    wave-2 files remain open, and rec-autoclose.yml would close it prematurely.
  - >-
    FAIL CLOSED on a missing assertion target. Every check must append a failure when the block or key it
    reads is absent, empty, or not the expected type -- never iterate nothing and pass. This is the vacuity
    shape Decision 159's 100%-line-coverage floor CANNOT catch (a loop over an empty collection executes
    every line while asserting nothing), so each of the six mirror tests carries an explicit absent/empty
    target red path and VP step 6 leg (a) proves it live against all six.
  - >-
    validate_ci_rca_lifecycle_projection asserts projection_fields SUBSET-OF CiRcaContext, deliberately
    one-directional: CiRcaContext carries many non-projection fields (proximate_cause, why_chain,
    fingerprint, ...), so a bidirectional equality would be WRONG. Record this in the check's own docstring
    so a later reader does not "tighten" it into an equality that cannot hold.
  - >-
    The verification_registry row is DIFFERENTIALLY ADMITTED, not merely schema-checked:
    validate_verification_registry._run_added_entry_differentials materializes the check_spec, spins a real
    origin/main worktree, and requires FAIL-on-main / PASS-on-HEAD, refusing a tautological outcome. A
    test_selector node in a brand-new file satisfies this (absent on main -> fails there), and the check is
    pre=True so a mistake surfaces in --pre, not post-merge.
  - >-
    The graduation check_id is read-engine-verb-parity-red-path, naming ONE exemplar deliberately: a
    test_selector check_spec carries a single node_id, so a name implying it guards all six mirror tests
    would overstate what one row can hold. Point node_id at the read-engine drift red path -- the exemplar
    proven against real drift (rec-3095). The other five red paths are guarded by their own mirror tests via
    VP step 7, which is not the same thing as being in the registry, and this plan does not claim otherwise.
  - No rescue agents or workaround loops (Decision 55).
  - Only modify files listed in the Scope table; out-of-scope findings become recommendations, not inline fixes.
