schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "class-d-contract-enforcers"
intent: >-
  Convert six of the eight Class D contracts carrying the never-resolving
  evaluator.none_grandfathered form to resolving {check: <name>} evaluators, so their CONTENT is
  machine-enforced rather than merely guarded against kind-change regression. Advances the
  platform's verification-is-recursively-improvable thesis: a rule with no evaluator is not a rule.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-class-d-contract-enforcers.yaml
phase: >-
  rec-3059 (Critical, open) first-wave enforcer build. Parent surface T2.56 (Normative / contract /
  ADR layering) -- this plan closes NONE of T2.56's exit criteria (both concern instruction-layer
  shrinkage and DECISIONS-as-retrieved-ADR-log), so no closes_criteria is declared. Soft-warn
  exception category: ad_hoc_rec.
scope:
  - file: scripts/checks/contracts/validate_read_engine_verbs.py
    action: Create
    purpose: >-
      Assert read-engine.yaml read_surface.named_verbs.verbs {table: [verbs]} grouping equals the
      same grouping derived from NAMED_READS (src/common/ducklake_scd2_schema.py).
  - file: scripts/checks/contracts/validate_marker_grammar_exports.py
    action: Create
    purpose: Assert scripts/checks/_marker_guard.py __all__ equals marker-grammar.yaml binding_surface.exports.
  - file: scripts/checks/contracts/validate_log_storage_registry.py
    action: Create
    purpose: >-
      Assert scripts/s3_log_store.py FALLBACK_OPS_TABLE_ROUTING / FALLBACK_PRIORITY_QUEUE_KEY equal
      log-storage.yaml's routing block -- the registered promotion of test_anti_drift.
  - file: scripts/checks/contracts/validate_telemetry_lexicon_tables.py
    action: Create
    purpose: >-
      Assert telemetry-lexicon.yaml lexicon.model.canonical_tables each resolve to an existing Class A
      contract, and collapses targets name canonical tables.
  - file: scripts/checks/contracts/validate_ci_rca_lifecycle_projection.py
    action: Create
    purpose: >-
      Assert ci-rca-lifecycle.yaml projection_fields exist on the live CiRcaContext, escape_class's
      declared enum equals the live pydantic pattern alternation, and watched_workflow_set pointers resolve.
  - file: scripts/checks/contracts/validate_inference_provider_registry.py
    action: Create
    purpose: >-
      Assert inference-provider.yaml provider_defaults.executor_path agrees with _VALID_PROVIDERS /
      _DEFAULT_EXECUTOR_PROVIDER in scripts/llm/model_registry.py and retired_providers are disjoint.
  - file: tests/checks/contracts/test_validate_read_engine_verbs.py
    action: Create
    purpose: >-
      Mirror test (Decision 131) -- green, drift-red, ABSENT/EMPTY-target red, missing-file and
      malformed-YAML red paths.
  - file: tests/checks/contracts/test_validate_marker_grammar_exports.py
    action: Create
    purpose: >-
      Mirror test -- green, drift-red, ABSENT/EMPTY-target red, missing-file and malformed-YAML red paths.
  - file: tests/checks/contracts/test_validate_log_storage_registry.py
    action: Create
    purpose: >-
      Mirror test -- green, drift-red, ABSENT/EMPTY-target red, missing-file and malformed-YAML red paths.
  - file: tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    action: Create
    purpose: >-
      Mirror test -- green, missing-Class-A-target red, bad-collapses-target red, ABSENT/EMPTY
      canonical_tables red, malformed-YAML red.
  - file: tests/checks/contracts/test_validate_ci_rca_lifecycle_projection.py
    action: Create
    purpose: >-
      Mirror test -- green, unknown-projection-field red, enum-mismatch red, dead-pointer red,
      ABSENT/EMPTY projection_fields red.
  - file: tests/checks/contracts/test_validate_inference_provider_registry.py
    action: Create
    purpose: >-
      Mirror test -- green, provider-drift red, retired-overlap red, ABSENT/EMPTY valid_providers red,
      malformed-YAML red.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      Six Entry literals (bare string module=/attr=), each pre=True with pre_globs=None and
      full_segment="full_after_lint" (Decision 169).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Six function_to_category rows, all schema_drift -- required by validate_ci_rca_taxonomy check
      1b (every registered check must resolve to a category).
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      Flip evaluator to {check: validate_read_engine_verbs}; add the missing rec_history verb under
      ops_recommendations (rec-3095, code-wins); new amendment_log entry recording the direction judgement.
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: "Flip evaluator to {check: validate_marker_grammar_exports}; new amendment_log entry."
  - file: docs/contracts/log-storage.yaml
    action: Modify
    purpose: "Flip evaluator to {check: validate_log_storage_registry}; new amendment_log entry."
  - file: docs/contracts/telemetry-lexicon.yaml
    action: Modify
    purpose: "Flip evaluator to {check: validate_telemetry_lexicon_tables}; new amendment_log entry."
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Flip evaluator to {check: validate_ci_rca_lifecycle_projection}; new amendment_log entry that RECORDS
      THE NARROWING -- the erased route said "match ... the taxonomy file", while the check asserts only that
      watched_workflow_set's pointers resolve, because the substantive workflow agreement is already owned by
      validate_ci_rca_adjudication (which that block itself names). EvaluatorSpec is exactly-one-kind, so the
      flip deletes the route text; without this note the narrowing leaves no trace.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: "Flip evaluator to {check: validate_inference_provider_registry}; new amendment_log entry."
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Lower two equality-bound ratchet pins in this same PR -- evaluator_none_grandfathered_max 8 -> 2
      and grandfathered_max 19 -> 17; status_active_max stays 16. New amendment_log entry.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One graduation row owed by VP step 7's graduate disposition (Decision 132). Required fields per
      validate_verification_registry._schema_errors -- check_id read-engine-verb-parity-red-path,
      primitive_slot test_selector, guard_target scripts/checks/contracts/validate_read_engine_verbs.py,
      plan_slug class-d-contract-enforcers, graduated_at (implement date) -- plus graduated_by and
      check_spec, which are universal across all 413 live rows though not schema-required (guard_symbol is
      conventional but not universal: 404 of 413). See constraints for why the check_id names ONE exemplar.
  - file: tests/s3_log_store/test_write_through_registry.py
    action: Modify
    purpose: >-
      Delete TestLogStorageRegistry::test_anti_drift -- the promoted assertion now lives in
      validate_log_storage_registry. Measured zero coverage delta (see constraints).
bundled_recommendations:
  - rec-3095
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_contract_drift passes against the real tree and its census line reports
    evaluator_none_grandfathered=2, grandfathered=17, status_active=16, skipped=0.
  - >-
    contract-population.yaml's ratchet pins equal those live census buckets exactly
    (evaluator_none_grandfathered_max: 2, grandfathered_max: 17, status_active_max: 16) -- the pins are
    equality-bound in both directions, so a stale pin fails the gate.
  - >-
    All six new check names are in registry.all_checks(), in pre_sequence()/full_sequence(), and carry a
    config/ci_rca_taxonomy.yaml function_to_category row of schema_drift.
  - >-
    Each of the six contracts' evaluator resolves under contract-population.yaml's evaluator_kinds.check
    grammar (_population.resolve_evaluator returns True), i.e. each check module contains its own
    contract basename as an executable-context string literal.
  - >-
    Every check discriminates: deleting ANY top-level block it reads makes it FAIL (fail-closed, proven live
    in VP step 6 leg a across all eight contract/block pairs -- ci-rca-lifecycle and inference-provider each
    read two), and a semantic drift makes it FAIL (proven live for read-engine in leg b).
    Both shapes are guarded durably by red-path tests in each of the six mirror tests.
  - >-
    docs/contracts/read-engine.yaml lists rec_history under ops_recommendations, closing rec-3095, and the
    verb-grouping parity assertion holds against the live NAMED_READS registry.
  - All six new modules land at 100% line coverage and are mypy-clean under the full tier.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm the six ci_rca_taxonomy rows exist (leg A) and the six check names are registered and
      tier-sequenced (leg B).
    command: bin/venv-python -c 'import yaml; m=yaml.safe_load(open("config/ci_rca_taxonomy.yaml"))["function_to_category"]; N=["validate_read_engine_verbs","validate_marker_grammar_exports","validate_log_storage_registry","validate_telemetry_lexicon_tables","validate_ci_rca_lifecycle_projection","validate_inference_provider_registry"]; bad=[n for n in N if m.get(n)!="schema_drift"]; assert not bad, bad; print("OK six taxonomy rows")' && bin/venv-python -c 'from scripts.checks import registry; N=["validate_read_engine_verbs","validate_marker_grammar_exports","validate_log_storage_registry","validate_telemetry_lexicon_tables","validate_ci_rca_lifecycle_projection","validate_inference_provider_registry"]; a=registry.all_checks(); s={x.name for x in [*registry.pre_sequence(),*registry.full_sequence()]}; bad=[(n, n in a, n in s) for n in N if not (n in a and n in s)]; assert not bad, bad; print("OK six registered and sequenced")'
    expected: Prints 'OK six taxonomy rows' then 'OK six registered and sequenced'; exit 0.
    fix_if: >-
      Leg A failing with None means the config/ci_rca_taxonomy.yaml row is absent or misspelled; a wrong
      value means it is not schema_drift. Leg B failing on the first flag means the @register decoration or
      the Entry module path is wrong; on the second, the Entry lacks pre=True and full_segment.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already enforced by two standing checks -- validate_ci_rca_taxonomy check 1b requires a
      function_to_category row for every registered check, and validate_check_manifests enforces the Entry
      grammar and graph-node resolution. Graduating this would be a third copy of the same invariant.
  - step: 2
    phase: pre-deploy
    action: Confirm each of the six contracts' evaluator genuinely resolves under the Decision 168 check grammar.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.contracts import _population; from scripts.contracts import load_contract_meta; M={'read-engine.yaml':'validate_read_engine_verbs','marker-grammar.yaml':'validate_marker_grammar_exports','log-storage.yaml':'validate_log_storage_registry','telemetry-lexicon.yaml':'validate_telemetry_lexicon_tables','ci-rca-lifecycle.yaml':'validate_ci_rca_lifecycle_projection','inference-provider.yaml':'validate_inference_provider_registry'}; R=Path('.').resolve(); bad=[]; [bad.append((n,c,load_contract_meta(Path('docs/contracts')/n).evaluator.check,_population.resolve_evaluator(n,load_contract_meta(Path('docs/contracts')/n).evaluator,root=R))) for n,c in M.items() if not (load_contract_meta(Path('docs/contracts')/n).evaluator.check==c and _population.resolve_evaluator(n,load_contract_meta(Path('docs/contracts')/n).evaluator,root=R)[0])]; assert not bad, bad; print('OK: six evaluators resolve')"
    expected: "Prints 'OK: six evaluators resolve'; exit 0."
    fix_if: >-
      'neither <module> nor its one-hop scripts/ imports contain <basename>' means the check module lacks
      its contract basename as an executable-context string literal -- add it as a module-level constant
      that is genuinely READ. NOTE: module_contains_literal accepts ANY non-docstring ast.Constant match,
      referenced or not -- reading it is a discipline this plan requires, NOT something the gate enforces.
      A whitespace-containing path-shaped literal IS rejected, by the matcher-trap guard.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift already fails any Class D file whose declared evaluator does not resolve; a
      graduated copy would assert the same thing the gate under test already asserts.
  - step: 3
    phase: pre-deploy
    action: Run the population gate against the real tree and assert the census and pin equality.
    command: >-
      bin/venv-python -c "import io,contextlib; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; b=io.StringIO(); ctx=contextlib.redirect_stdout(b); ctx.__enter__(); v(f); ctx.__exit__(None,None,None); o=b.getvalue(); assert f==[], f; c=[l for l in o.splitlines() if 'Census:' in l][0]; print(c); assert 'evaluator_none_grandfathered=2' in c and ' grandfathered=17' in c and 'status_active=16' in c and 'skipped=0' in c, c"
    expected: >-
      Census line prints with evaluator_none_grandfathered=2, grandfathered=17, status_active=16,
      skipped=0, and the failure list is empty.
    fix_if: >-
      'does not equal the live census bucket' means a ratchet pin was not lowered in this PR -- pins are
      equality-bound in BOTH directions. A non-zero skipped count means a contract failed shape, schema, or
      evaluator resolution and was excluded from its bucket.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The specific values 2/17/16 are intentionally transient -- the deferred wave 2 lowers them again. The
      durable invariant (every pin EQUALS its live census bucket) is already enforced inside
      validate_contract_drift, so pinning today's numbers into the registry would create a check that must
      be edited by the very next enforcer PR.
  - step: 4
    phase: pre-deploy
    action: Green path -- every one of the six checks passes against the real tree.
    command: >-
      bin/venv-python -c "import importlib; N=['read_engine_verbs','marker_grammar_exports','log_storage_registry','telemetry_lexicon_tables','ci_rca_lifecycle_projection','inference_provider_registry']; bad={}; [bad.setdefault(n,f) for n in N for f in [[]] if (getattr(importlib.import_module('scripts.checks.contracts.validate_'+n),'validate_'+n)(f), f)[1]]; assert not bad, bad; print('OK: six checks green')"
    expected: "Prints 'OK: six checks green'; exit 0."
    fix_if: >-
      A non-empty failure list names the contract and the disagreeing surface. Decide direction
      deliberately: for read-engine the direction is code-wins (see constraints); for the others confirm
      which side is stale before editing either.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The six checks are themselves registered and dispatched in both the --pre and full tiers, so they
      already run as standing guards. A graduated step that merely invokes them would be a second dispatch
      path for the same assertions.
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm rec-3095 is closed on the contract side and the verb-grouping parity holds against the live
      NAMED_READS registry.
    command: >-
      bin/venv-python -c "import yaml,collections; from src.common.ducklake_scd2_schema import NAMED_READS; d=yaml.safe_load(open('docs/contracts/read-engine.yaml')); decl={k:sorted(v) for k,v in d['read_surface']['named_verbs']['verbs'].items()}; live=collections.defaultdict(list); [live[nr.table].append(vb) for vb,nr in NAMED_READS.items()]; live={k:sorted(v) for k,v in live.items()}; assert decl==live, (decl,live); assert 'rec_history' in decl['ops_recommendations']; print('OK: 12 verbs, grouping parity, rec_history present')"
    expected: "Prints 'OK: 12 verbs, grouping parity, rec_history present'; exit 0."
    fix_if: >-
      A missing verb means the contract was not updated; a mismatched grouping means a verb is filed under
      the wrong table in the contract relative to its NamedRead.table.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_read_engine_verbs, landing in this same PR, IS the standing guard for exactly this assertion;
      graduating a duplicate of it would register the same comparison twice.
  - step: 6
    phase: pre-deploy
    action: >-
      RED-PATH PROOF -- perturb real contracts on throwaway copies and observe the checks FAIL. Two shapes,
      both on tmp copies, never mutating the working tree. (a) FAIL-CLOSED, all six: delete the top-level
      block each check reads; a check that iterates an absent target and passes is vacuous. (b) SEMANTIC
      DRIFT, read-engine: remove rec_history and confirm the parity check fails, then passes unperturbed.
      Leg (b) PRESUPPOSES the contract fix -- it calls .remove("rec_history"), which raises ValueError until
      execution step 4 has added the verb. Run this step after the contract edits, not standalone.
    command: |
      bin/venv-python - <<'EOF'
      import importlib, pathlib, shutil, tempfile, yaml
      # Every top-level block each check reads -- ci-rca-lifecycle and inference-provider read TWO,
      # so a single-block mutation would leave their second assertion leg's vacuity unproven.
      SIX = [
          ("read_engine_verbs", "read-engine.yaml", ["read_surface"]),
          ("marker_grammar_exports", "marker-grammar.yaml", ["binding_surface"]),
          ("log_storage_registry", "log-storage.yaml", ["routing"]),
          ("telemetry_lexicon_tables", "telemetry-lexicon.yaml", ["lexicon"]),
          ("ci_rca_lifecycle_projection", "ci-rca-lifecycle.yaml", ["projection_fields", "watched_workflow_set"]),
          ("inference_provider_registry", "inference-provider.yaml", ["provider_defaults", "retired_providers"]),
      ]
      REAL = pathlib.Path("docs/contracts")

      def check(suffix):
          mod = importlib.import_module("scripts.checks.contracts.validate_" + suffix)
          return getattr(mod, "validate_" + suffix)

      def copy_tree():
          dest = pathlib.Path(tempfile.mkdtemp()) / "contracts"
          shutil.copytree(REAL, dest)
          return dest

      for suffix, filename, blocks in SIX:
          fn = check(suffix)
          green = []
          fn(green, contracts_dir=REAL)
          assert green == [], (suffix, "green path must be clean", green)
          for block in blocks:
              tmp = copy_tree()
              path = tmp / filename
              doc = yaml.safe_load(path.read_text())
              assert block in doc, (filename, "expected top-level block absent from the real contract", block)
              del doc[block]
              path.write_text(yaml.safe_dump(doc))
              red = []
              fn(red, contracts_dir=tmp)
              assert red, (suffix, block, "VACUOUS -- passed with this assertion target absent")
              print("fail-closed OK", suffix, block)

      tmp = copy_tree()
      path = tmp / "read-engine.yaml"
      doc = yaml.safe_load(path.read_text())
      doc["read_surface"]["named_verbs"]["verbs"]["ops_recommendations"].remove("rec_history")
      path.write_text(yaml.safe_dump(doc))
      drift = []
      check("read_engine_verbs")(drift, contracts_dir=tmp)
      assert drift, "drift perturbation did not fail the parity check"
      print("semantic-drift OK", drift[0])
      EOF
    expected: >-
      Eight 'fail-closed OK <name> <block>' lines (six checks, two of which read two blocks), then
      'semantic-drift OK' with a message naming read-engine.yaml and the missing verb. Exit 0.
    fix_if: >-
      'VACUOUS -- passed with this assertion target absent' means that check does not fail closed; make it
      append a failure when its target block or key is missing or empty. An empty list on the RED leg is the
      shared signature of two distinct faults -- a check that iterates nothing and passes, OR a check that
      ignores contracts_dir and silently re-reads the real tree; rule out the second before assuming the
      first. (An empty GREEN list is the pass condition, not a symptom.) NOTE Decision 159's
      100%-coverage floor does NOT discriminate here -- a loop over an absent or empty collection executes
      every line while asserting nothing, which is exactly what leg (a) exists to catch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Step 7's graduated read-engine-verb-parity-red-path is the durable form of this same discrimination --
      each mirror test carries the absent-target and drift red paths as standing regressions. This step is
      the one-time live demonstration against the real tree; graduating it too would register the same
      discrimination twice, the identical reasoning applied to steps 4, 5, 8 and 9.
  - step: 7
    phase: pre-deploy
    action: >-
      Durable red-path regression -- run the six mirror tests, each of which perturbs a fixture contract and
      asserts its check fails.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_read_engine_verbs.py tests/checks/contracts/test_validate_marker_grammar_exports.py tests/checks/contracts/test_validate_log_storage_registry.py tests/checks/contracts/test_validate_telemetry_lexicon_tables.py tests/checks/contracts/test_validate_ci_rca_lifecycle_projection.py tests/checks/contracts/test_validate_inference_provider_registry.py tests/checks/contracts/test__manifest.py -q
    expected: All tests pass; every module has at least one green-path and one drift-red-path test.
    fix_if: >-
      A red-path test that passes without the fix means the fixture did not actually diverge from the
      consumer. Assert on the failure MESSAGE content, not merely on list length.
    hermetic: false
    graduation: graduate
    graduation_check_id: read-engine-verb-parity-red-path
  - step: 8
    phase: pre-deploy
    action: >-
      Stale-reference sweep for the promoted assertion -- confirm test_anti_drift is gone and nothing still
      references it.
    command: "! grep -rn 'test_anti_drift' tests/s3_log_store/ --include='*.py'"
    expected: >-
      No matches; the grep exits non-zero and the negation makes the step exit 0. Scoped to the OWNING
      package deliberately, for two verified reasons: an unrelated same-named test exists at
      tests/test_build_lambda_config.py:109 (a repo-wide name sweep would never go green), and this plan
      document narrates the migration by name (a docs/ sweep would fail permanently).
    fix_if: >-
      A surviving reference means the promotion is half-done -- the test method was not deleted, or another
      test module still imports or parametrises it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is a one-time migration artifact. A standing guard asserting the permanent non-existence of a
      deleted test name carries no ongoing regression risk once this PR merges, and would accumulate as dead
      weight in the registry.
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the pre-existing real-population guard still passes -- it now exercises resolve_evaluator on
      all six converted files via its else branch.
    command: bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift/test_real_population.py -q
    expected: 5 passed. This suite needs NO edits; it is growth-safe and strengthens automatically.
    fix_if: >-
      'evaluator does not resolve' from this suite is the same failure as VP step 2 -- fix the in-module
      basename literal rather than weakening the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A pre-existing test already in the standing suite; it needs no graduation because it is already a
      permanent regression guard dispatched by the normal pytest run.
  - step: 10
    phase: pre-deploy
    action: >-
      Two-tier presubmit -- fast tier for the PR loop, then the FULL tier before handoff (Decision 163). The
      full tier is where validate_mypy_ratchet and the 100%-coverage checker run; both are full-tier-only,
      so a miss escapes --pre and reds main post-merge.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    expected: Both tiers exit 0. Full tier reports the six new modules at 100% coverage and mypy-clean.
    fix_if: >-
      '<file>: N% line coverage (expected 100%)' means a mirror test is missing a red path -- add the
      uncovered branch, never a coverage_baseline.yaml entry. A mypy regression on a new module must be
      fixed in the module; the ratchet's implicit baseline for an unregistered file is 0.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/validate_read_engine_verbs.py
    behavior: >-
      The declared {table: [verbs]} grouping must equal the grouping derived from NAMED_READS; a removed,
      added, or mis-tabled verb must fail.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_read_engine_verbs.py
    red_green_expectation: >-
      Red before (no such module), green after; the drift test is red against a perturbed fixture and green
      against the real contract.
  - source: scripts/checks/contracts/validate_marker_grammar_exports.py
    behavior: __all__ must equal binding_surface.exports; a divergent export list must fail.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_marker_grammar_exports.py
    red_green_expectation: Red before, green after; drift fixture fails, real contract passes.
  - source: scripts/checks/contracts/validate_log_storage_registry.py
    behavior: >-
      The routing block must equal the FALLBACK constants -- the assertion promoted out of test_anti_drift.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_log_storage_registry.py
    red_green_expectation: Red before, green after; drift fixture fails, real contract passes.
  - source: scripts/checks/contracts/validate_telemetry_lexicon_tables.py
    behavior: >-
      Every canonical_tables entry must resolve to an existing Class A contract and every collapses target
      must name a canonical table.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    red_green_expectation: Red before, green after; a missing Class A target and a bogus collapses target both fail.
  - source: scripts/checks/contracts/validate_ci_rca_lifecycle_projection.py
    behavior: >-
      Each declared projection_field must exist on CiRcaContext, escape_class's enum must equal the live
