rollback: >-
  Single-PR revert. The six contract flips, the two pin moves, and the six check registrations are mutually
  dependent -- reverting any subset alone leaves the equality-bound pins disagreeing with the live census and
  fails validate_contract_drift. Revert the whole squash commit or none of it.
