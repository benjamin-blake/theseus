    only that no check imported it. Both are included here.
  - >-
    DEFERRED WAVE 2 (genuinely blocked, do not absorb): composite-action-shape.yaml needs
    scripts/checks/ci_guards/_workflow_shell_bodies.py rewired to read the contract instead of its hardcoded
    _R1_KNOWN_VIOLATORS roster -- a consumer refactor with behavior risk. iam-simulate-fixture.yaml's own
    route warns that wiring it into --pre "would red the very PR that fixes a legitimate gap" -- a design
    hazard needing deliberate thought. After this plan the census stands at 2; rec-3059 stays OPEN for them.
  - >-
    read-engine DIRECTION JUDGEMENT (Decision 118 / CD.25 spirit): the CD.25 ritual is contract-first, so
    amending the contract to match code is the opposite direction and this PR freezes that direction into an
    enforcer. It is nonetheless correct here and the evidence must be recorded in read-engine.yaml's
    amendment_log entry: rec_history is a LIVE, DEPLOYED reader verb served by the NAMED_READS registry
    behind the closed ducklake_reader boundary (Decision 84 I-3, Decision 91). The contract is the stale
    side. This plan therefore FIXES the drift rather than only detecting it -- a detect-only landing would
    put a permanently-red check on main, which is what makes the enforcer admissible under run_differential:
    it fails on origin/main and passes here.
  - >-
    COVERAGE FALSE POSITIVE, resolved by measurement: deleting TestLogStorageRegistry::test_anti_drift was
    flagged as a possible coverage-baseline trap. Measured: scripts/s3_log_store.py reports 265 statements /
    47 missed / 82% with an IDENTICAL missing-line list before and after the deletion -- zero delta, because
    that test only compares two module constants against a YAML file. Independently,
    get_changed_source_files() selects only changed source files under src/ or scripts/ and excludes test
    files, so the coverage gate never fires for a test-only edit. Both branches closed; the deletion is safe.
  - >-
    OUT-OF-SCOPE FINDING (rec candidate, do NOT fix inline): scripts/s3_log_store.py measures ~82% line
    coverage and has NO config/coverage_baseline.yaml entry, so the checker's default holds it to 100%. The
    next PR that modifies that source file will fail the coverage gate on 47 pre-existing uncovered lines,
    unrelated to whatever that PR changes. Pre-existing and unrelated to this change.
  - >-
    The pre-existing suite tests/checks/contracts/validate_contract_drift/test_real_population.py is
    growth-safe (asserts scanned > 0, ritual > 0, skipped == 0, and that each seeded file's evaluator either
    resolves or carries a complete route). It needs ZERO edits and automatically becomes a stronger guard --
    it goes red if any of the six new evaluators fails to resolve. Verified green at planning time (5 passed).
  - >-
    Live baseline, re-verified after rebasing onto origin/main 8e17984: census scanned=41 ritual=16
    declared=6 grandfathered=19 evaluator_none_grandfathered=8 status_active=16 skipped=0, gate passing.
    (That merge added docs/contracts/check-accounting.yaml -- Class D, status ratified, evaluator
    {check: validate_check_accounting} -- which lands in DECLARED, so scanned 40->41 and declared 5->6 while
    the three PINNED buckets are untouched. The plan's targets are therefore unchanged: grandfathered_max 17,
    evaluator_none_grandfathered_max 2, status_active_max 16. Re-derive the census before editing the pins
    anyway -- a new Class D file landing on main between now and implement time could move declared again,
    and only a fresh run is authoritative.) All six new check names
    collision-free against registry.all_checks(). Branch was 0 commits behind origin/main; no ci-rca recs
    open; no contracts-domain SLOC budget entries exist and none are needed (largest touched contract is
    ci-rca-lifecycle.yaml at 338 lines against the Decision 166 contracts-class cap of 500).
  - >-
    The function_to_category row obligation is NOT decision-governed -- it comes from
    validate_ci_rca_taxonomy check 1b (scripts/checks/ci_guards/validate_ci_rca_taxonomy.py), which fails any
    registered check absent from the map. Cite the check, not Decision 142, for that row.
