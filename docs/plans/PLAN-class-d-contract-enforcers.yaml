execution_steps:
  - >-
    Create the six check modules under scripts/checks/contracts/, one @registry.register(...)-decorated
    check each. Every module: declares its own contract basename as a module-level string literal that is
    genuinely READ (not an unreferenced assignment), accepts contracts_dir: Path | None = None and honours
    it for all contract reads, appends human-readable failures naming both the contract and the disagreeing
    consumer surface, and is type-annotated (mypy-clean). Use the lazy in-function import idiom (noqa:
    PLC0415) for consumer modules so registry.all_checks() stays cheap.
  - >-
    Add six Entry literals to scripts/checks/contracts/_manifest.py -- bare-string module=/attr=, pre=True
    with pre_globs=None (UNGATED, always runs in --pre; see constraints -- do NOT narrow to globs, an
    incomplete glob is a silent --pre skip), full_segment="full_after_lint".
  - Add six function_to_category rows to config/ci_rca_taxonomy.yaml, all schema_drift.
  - >-
    Fix docs/contracts/read-engine.yaml -- add rec_history under read_surface.named_verbs.verbs.ops_recommendations
    (rec-3095), recording the code-wins direction judgement and its evidence in the amendment_log entry.
  - >-
    Flip all six contracts' evaluator from {none_grandfathered: <route>} to {check: <name>}, replacing the
    whole route block, and add one new amendment_log[] entry per file.
  - >-
    Lower the two ratchet pins in docs/contracts/contract-population.yaml (evaluator_none_grandfathered_max
    8 -> 2, grandfathered_max 19 -> 17; leave status_active_max at 16) and add its own amendment_log entry.
  - >-
    Write the six mirror tests under tests/checks/contracts/, each with a green path plus red paths for
    drift, ABSENT/EMPTY assertion target, missing file, and malformed YAML -- enough to reach 100% line
    coverage on its module. tests/checks/contracts/test__manifest.py needs NO edit: it is already
    parametrized over _manifest.ENTRIES, so the six new entries are covered automatically.
  - >-
    Delete TestLogStorageRegistry::test_anti_drift from tests/s3_log_store/test_write_through_registry.py and
    run ruff check --fix to clear any now-unused import.
  - >-
    Add one row to config/agent/verification_registry/registry.yaml matching VP step 7's graduate
    disposition (Decision 132). All seven universally-present fields (verified across all 413 live rows):
    check_id read-engine-verb-parity-red-path, primitive_slot test_selector, guard_target
    scripts/checks/contracts/validate_read_engine_verbs.py, plan_slug class-d-contract-enforcers,
    graduated_at (implement date), graduated_by implement-agent, and check_spec.node_id pointing at the
    read-engine drift red-path test node. Add guard_symbol too if a single symbol is the guard (404 of 413
    rows carry it; it is conventional, not schema-required). check_id and plan_slug MUST match VP step 7's
    graduation_check_id and this plan's slug exactly, or validate_graduation_completeness fails in BOTH tiers.
  - >-
    Execute the Verification Plan -- run each step in order; loop until pass. VP step 6 (the perturbation
    proof) is the discriminating step: if the perturbed copy does not fail, the check is vacuous and must be
    fixed, never the assertion weakened.
  - >-
    File the out-of-scope scripts/s3_log_store.py coverage finding as a recommendation via
    scripts.ops_data_portal (get_rec_write_guidance() before file_rec()). Do not fix it inline.
  - >-
    'Report: what was implemented, verification results, the final census line, and confirmation that the
    squash body carries Resolves: rec-3095 only.'
