schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "reconcile-stale-plan-coverage"
intent: >-
  Make Reconcile TOTAL over the guard-BLOCK x stale-saved-plan cell -- today the DEP-10 fresh-replan
  fallthrough is structurally unreachable whenever the deterministic guard routes, so a red episode
  whose saved plan.bin has been staled by its own partial gated apply can only re-latch red and burn
  a human approval -- then use the repaired path ONCE to clear the stranded DEP-02 probe role and the
  red convergence record at 99eb274, which is currently blocking every terraform/personal CD apply.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-reconcile-stale-plan-coverage.yaml
closes_criteria: []
phase: >-
  Platform T2 -- rec-2847 (open, High, risk=high) against tier_item T2.37/T2.47 (Reconcile heal
  button + DEP-10 stale-plan fallthrough). The teardown half discharges the DEP-02 live-proof
  obligation that PLAN-iam-write-surface-completion.yaml explicitly DECOUPLED and handed forward
  (its "TEARDOWN DECOUPLED" context entry, TODO-TEARDOWN-ROUTE = route A). Closes no exit criterion:
  T2.37/T2.47 criteria were adjudicated met when Reconcile landed, and this plan repairs a defect in
  the landed surface rather than completing a criterion -- hence closes_criteria: []; the roadmap
  touch is a T2.48 progress_note only. T2.48 DISPOSITION (mirrors the sibling plan's clause, since
  the progress_note lands on T2.48): T2.48 is status=in_progress with c1-c5 met and c6 open; c6 is
  the recurring Decision-92 authority-budget ratchet review, out of scope for this plan -- so this
  plan closes no T2.48 criterion either. SEPARATE DATA TENSION, deliberately NOT touched here:
  T2.47 reads status=not_started while BOTH its criteria (c1, c2) read met. That is a roadmap data
  inconsistency, not a fact this plan may infer a status flip from
  (Status-Trusted-Never-Inferred) -- it is folded into a follow-on rec (execution steps), not fixed
  inline.
scope:
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      THE FIX (rec-2847 part (a)). Insert ONE new aggregator step (id: route) immediately after the
      saved-plan apply step, computing needs_fresh_plan = 'true' when EITHER the saved-plan apply
      reported stale=true OR the saved-plan guard reported routed=true; then re-point the six
      existing DEP-10 fallthrough steps (replan, guard_fresh, review_fresh, apply_fresh,
      upload_fresh_plan_sha256, the upload-artifact step) and the `resolved` aggregator from
      `steps.apply.outputs.stale == 'true'` onto `steps.route.outputs.needs_fresh_plan == 'true'`,
      and re-word the wake comment off `STALE` onto the new `fresh_reason` (including pointing the
      Environment approver at this run's `replan` / `guard_fresh` logs, and dropping the branch that
      becomes unreachable). Two comment corrections ride along because they are now false and
      contradict this plan's own safety argument: the `replan` step comment claiming the re-plan
      happens "against whatever the dispatch ref's tree looks like now" (it is at RED_SHA -- the root
      checkout is `ref: ${{ env.RED_SHA }}`), and the top-of-file DEP-10 block comment (must state
      the UNION entry condition). NOTHING ELSE MOVES: the
      guard, the review gate, the sha256 EMIT/VERIFY pair, the run-scoped
      RECONCILE_FRESH_PLAN_ARTIFACT hand-off, and the whole gated-apply-reconcile job are REUSED
      verbatim -- gated-apply-reconcile needs zero edits because it already branches on
      needs.apply-reconcile.outputs.fresh_plan_pending.
  - file: scripts/verify_ci_workflow.py
    action: Modify
    purpose: >-
      Add `_check_recovery_workflow_topology()` (rec-2847 part (c), NARROWED -- see the
      REC-2847 PARTIAL CLOSURE context entry): a yaml-parsed structural guard over reconcile.yml
      asserting the four invariants this plan establishes -- (i) the `route` step exists and its
      body references BOTH cause signals; (ii) no fresh-replan fallthrough step is gated on
      `steps.apply.outputs.stale` any more, and each is gated on `needs_fresh_plan`; (iii) the
      saved-plan apply step still carries the stale-signature detection (the DEP-10 stale path is
      ADDED TO, never replaced); (iv) the cross-job hand-off is intact (`fresh_plan_pending` job
      output declared, download+verify gated on it, fetch-saved-plan gated on its negation).
      Register it in the module's `_COMMANDS` map alongside its siblings. Currently 314 SLOC of a
      500 budget, so ~50 added SLOC needs no decomposition and no budget entry (Decision 128).
  - file: scripts/checks/ci_guards/validate_ci_workflow_guards.py
    action: Modify
    purpose: >-
      Wire the new guard into `_load_guards()` as label `recovery-workflow-topology`, so it runs in
      BOTH the --pre and full tiers via the already-registered validate_ci_workflow_guards check.
      validate.py is the CI source of truth -- no ci.yml edit is needed or permitted.
  - file: tests/verify_ci_workflow/test_apply_and_terraform.py
    action: Modify
    purpose: >-
      Positive + negative tests for `_check_recovery_workflow_topology` in the file that already
      owns the terraform-apply/reconcile-adjacent guard tests. The LOAD-BEARING negative is the
      exact-defect fixture: a reconcile.yml shape whose fallthrough steps are gated on
      `steps.apply.outputs.stale == 'true'` with no `route` step MUST fail -- i.e. the guard would
      have caught the live defect. Plus: missing route step fails; missing `fresh_plan_pending` job
      output fails; a gated job whose download step is not gated on fresh_plan_pending fails; a
      shape that DROPS the saved-plan stale-signature detection fails; and the real on-disk tree
      passes.
  - file: scripts/ci/reconcile_reachability.py
    action: Create
    purpose: >-
      TODO-REACHABILITY-HARNESS -- RESOLVED: REQUIRED. A reachability evaluator over the PARSED
      reconcile.yml: for each apply-reconcile step's `if:` string it reports REACHABLE / UNREACHABLE
      under a supplied context. It implements ONLY the token subset the file actually uses --
      `success()`, `&&`, `==`, `!=`, single-quoted string literals, and `steps.X.outputs.Y` /
      `steps.X.outcome` lookups -- and raises on any token outside that subset rather than guessing
      (an unparsed token must never silently read as REACHABLE). ONE-SHOT ARTIFACT, NOT A STANDING
      GATE: it is deliberately NOT registered in scripts/checks/registry.py or scripts/validate.py
      and MUST NOT be promoted there -- see the constraint entry and the TODO-REACHABILITY-HARNESS
      -- RESOLVED context entry for why the human accepted a second implementation of GitHub's
      expression semantics only on that condition. Homed in scripts/ci/ because that is the
      established home for CI/operational runners (reconcile_target.py, ducklake_artifacts.py,
      plan_digest.py, review_verdict.py); scripts/verifiers/ is wrong for the same reason the
      sibling plan gave for scripts/ci/iam_simulate.py (a Verifier class would enrol it in
      run_all_verifiers()). Small by construction; no config/sloc_budgets.yaml entry (Decision 128).
  - file: tests/test_reconcile_reachability.py
    action: Create
    purpose: >-
      The harness's unit tests AND its GROUND TRUTH, asserted in BOTH directions -- a harness that
      only proves the post-fix direction is unvalidated and must not be trusted. Contents: (i)
      token-subset unit tests for the evaluator (success() on a skipped predecessor, empty-vs-'false'
      output semantics, `&&` chains, `!=`, unknown-token raises); (ii) THE PRE-FIX DIRECTION -- a
      frozen VERBATIM extract of the pre-fix apply-reconcile step list (id / name / `if:` only,
      captured with `git show $(git merge-base HEAD origin/main):.github/workflows/reconcile.yml`
      and that sha recorded in the module docstring so the fixture's provenance is checkable rather
      than trusted) under context guard=BLOCK MUST report `replan` UNREACHABLE -- which live run
      30264239445 empirically confirms; (iii) THE POST-FIX DIRECTION -- the real on-disk
      .github/workflows/reconcile.yml under the same context MUST report `replan` REACHABLE.
      Homed at tests/test_<stem>.py to match all four scripts/ci/ siblings
      (tests/test_reconcile_target.py, test_ducklake_artifacts.py, test_plan_digest.py,
      test_review_verdict.py); verified this session that map_source_to_test() returns None for
      scripts/ci/ paths, so Decision 131's mirror rule imposes no different target here and the
      sibling convention governs -- the same finding, independently re-verified, that the sibling
      plan records for scripts/ci/iam_simulate.py.
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: >-
      TODO-CLAUDEMD-CORRECTION -- RESOLVED: CORRECT IT NOW. ONE clause on the "Recover from a red
      convergence record" row (line ~86) and nothing else. It must state that Reconcile HAS LANDED
      and is the correct vehicle for a guard-BLOCK / routed red, while the `terraform-apply-sandbox`
      workflow_dispatch acknowledge-and-retry remains the path for a guard-PASS red; and it must
      delete the false "T2.37 (Reconcile, not yet landed)" clause. THE EDIT MUST BE NET-NEUTRAL OR
      SMALLER IN BYTES -- config/prose_budgets.yaml sets terraform/CLAUDE.md to 30497 against 30485
      actual (12 bytes of headroom) and prose budgets ratchet DOWN only; VP step 14 measures the
      file before and after and fails if it grew. NO config/prose_budgets.yaml edit: validate_prose_limits
      enforces current <= budget, not equality, so a shrink needs no entry change and the ratchet-down
      is deliberately left out of scope. EXPLICITLY NOT A REC-2846 CLOSURE CLAIM: rec-2846's full fix
      spans lines 86, 149, 154, 203-204 and 253-254 PLUS a planning-skill note, so rec-2846 stays
      OPEN and stays out of bundled_recommendations. WHY IT MATTERS ENOUGH TO TAKE THE ROW: this is a
      DIRECTORY-SCOPED CLAUDE.md, ambiently auto-loaded into every session that touches terraform/, so
      the false line reaches every future agent unprompted -- and THIS PLAN is what makes it maximally
      misleading, because it turns Reconcile into the working path while the ambient doc still calls it
      "not yet landed" and still routes recovery to the push-only dispatch that stranded the 2026-07-25
      retry.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append ONE new `## Decision NNN:` entry recording the RECOVERY PATH'S AUTHORIZATION MODEL --
      BOTH narrowings in one entry: (1) the cell this plan newly makes reachable (a saved-plan
      guard-BLOCK whose fresh re-plan guard-PASSes, auto-applied inside apply-reconcile with the
      subagent review as the only gate and NO tf-gated-apply Environment approval), and (2) the
      ALREADY-EXISTING fresh-replan substitution on the STALE route, whose only sanctioning today is
      a workflow comment in reconcile.yml ("the sanctioned dispatch-ack exception, Decision 77") and
      terraform/CLAUDE.md prose -- it was never recorded in a numbered Decision. The human decided at
      plan time that ONE entry absorbs both, so the recovery path's authorization model finally lives
      in one durable place instead of split across a Decision, a workflow comment and prose. The
      SEVEN things the entry MUST record, and the reasoning, are in the "ROUTE-SET DECISION --
      RESOLVED" context entry. NNN IS ALLOCATED AT IMPLEMENT TIME as the next free number --
      docs/DECISIONS.md is the numbering authority (AGENTS.md), so this plan deliberately hardcodes
      no number and the implementer re-checks for a collision immediately before writing. Follow
      docs/contracts/decision-entry.yaml's grammar exactly: an h2 `## Decision NNN: <title>
      (Decided)` header plus the three required markers (Status, Date, Decision), using the
      canonical optional spellings (Problem, Rationale, Reversal conditions, Related) where used.
      ONE TIGHT ENTRY, NEVER TWO, and never a ceiling raise to relieve pressure.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the committed decisions index with
      `bin/venv-python -m scripts.decisions_index --write` immediately after the DECISIONS.md
      append -- it is a DERIVED export, never hand-edited. NOT OPTIONAL:
      validate_decisions_index_freshness is registered in BOTH presubmit tiers (scripts/checks/
      registry.py) and fails on DRIFT or ABSENCE, so a DECISIONS.md edit without a regenerated index
      reds `validate --pre` on the PR. The sibling plan discovered this -- do not rediscover it. VP
      step 15 catches it LOCALLY first, which matters more here than it did there: unlike the
      sibling, this plan carries no `validate --pre` VP step of its own.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T2.48 progress_note ONLY -- discharge the TODO-TEARDOWN-ROUTE handoff the sibling plan left
      open: record that route A was taken (fix rec-2847, then dispatch Reconcile), the teardown
      outcome (probe role destroyed, record green), the follow-on rec ids, and the NUMBER of the
      Decision this plan authors. The number matters here specifically because BOTH plans append to
      T2.48's progress_note and BOTH mint one Decision -- the sibling records its number, so omitting
      this one would leave a reader of T2.48 seeing one recorded and one not. No criterion or item
      status flip (Status-Trusted-Never-Inferred).
bundled_recommendations:
  - rec-2847
infrastructure_dependencies:
  - >-
    HARD CROSS-PLAN DEPENDENCY -- the TEARDOWN HALF (VP steps 7-11) CANNOT RUN until
    docs/plans/PLAN-iam-write-surface-completion.yaml has completed its human-gated
    terraform/bootstrap admin apply. The probe-role destroy needs iam:ListInstanceProfilesForRole
    AND iam:RemoveRoleFromInstanceProfile on role/agent-platform-*, which that plan grants (its
    P0-1 gap) in BOTH the identity policy and the permissions-boundary DataPlaneAllow ceiling.
    Without both layers the gated apply dies AccessDenied exactly as run 30264239445 did (rec-2882).
    VP step 7 is the live gate on this dependency and MUST pass before VP step 8 is dispatched.
  - >-
    THE FIX HALF (VP steps 1-6) HAS NO SUCH DEPENDENCY and can merge at any time: it touches
    .github/workflows/** and scripts/**, NOT terraform/personal/**, so it does not match
    terraform-apply-sandbox.yml's path filter, does not trigger a speculative plan or an apply, and
    is therefore mergeable while the convergence record is RED. Sequence the PR accordingly -- do
    not hold the fix behind the sibling plan.
  - >-
    The fix is dispatch-ref-resolved, which is WHY it can heal a pre-fix red commit. GitHub reads
    reconcile.yml's own job/step/`if:` definitions at the dispatch ref (Decision 154 / rec-2862
    narrowing, restated at the top of reconcile.yml). The `route` step is a plain `run:` in that
    file -- not a composite action -- so it exists on dispatch even though RED_SHA (99eb274)
    predates it. Every `uses: ./.github/actions/...` reference still resolves from the RED_SHA
    checkout; this plan adds NO composite action and changes NONE, so that split is untouched.
  - >-
    Guard classification is UNCHANGED, but the SET OF TERMINAL ROUTES IS NOT -- stated plainly
    because both gates independently flagged the earlier wording ("changes only WHICH plan artifact
    the already-approved gated job applies, never WHAT gates") as FALSE. scripts/terraform_apply_guard.py
    and .github/actions/deterministic-guard/action.yml remain out of scope, a destroy still BLOCKs
    (exit 2 -> routed=true, action exits 0), and the tf-gated-apply Environment is still the
    authorization boundary (Decision 92). What DOES change: re-pointing apply_fresh/review_fresh
    onto needs_fresh_plan opens a cell that was structurally impossible pre-fix. POST-FIX THERE ARE
    EXACTLY THREE TERMINAL ROUTES out of a saved-plan guard-BLOCK episode:
    (i) saved-guard-BLOCK x FRESH-guard-PASS -> `review_fresh` (subagent review) then `apply_fresh`
    AUTO-APPLIES inside apply-reconcile, with the subagent review as the ONLY gate and NO
    tf-gated-apply Environment approval. Pre-fix this cell could not be reached at all: a saved-plan
    BLOCK skipped `apply`, `stale` was never set, every fallthrough step was skipped, and the episode
    ALWAYS reached the gated job. This is a genuine narrowing of the Environment control's reach and
    is accounted for in the "DELIBERATE PROPERTIES OF THE NEW ROUTE SET" context entry.
    (ii) saved-guard-BLOCK x FRESH-guard-BLOCK -> the fresh plan.bin is uploaded as
    RECONCILE_FRESH_PLAN_ARTIFACT and gated-apply-reconcile applies it behind the tf-gated-apply
    Environment approval (this is the route the DEP-02 teardown is EXPECTED to take, since a destroy
    always BLOCKs).
    (iii) the fresh re-plan itself fails -> `replan` fails, every downstream step short-circuits on
    `success()`, and the always-run record write latches RED. That is pre-ratified: Decision 154
    point 5(i) names `replan` as deliberately EXCLUDED from the pre-apply-failure allow-list and
    therefore keeping its red latch, fail-closed and safe.
    THOSE THREE ARE THE COMPLETE TERMINAL SET on the saved-plan guard-BLOCK path -- there is no
    fourth, and no episode entering that path can end anywhere else. Route (i) auto-applies with
    NO Environment approval; route (ii) applies behind the Environment approval; route (iii)
    applies nothing and latches red. The human has RESOLVED the question of whether route (i)
    should be closed off: it stays OPEN and is disclosed, not tightened -- see the
    "TODO-GATE-TIGHTENING -- RESOLVED" context entry and the "DELIBERATE PROPERTIES OF THE NEW
    ROUTE SET" entry. The implementer implements exactly this route set; it does not re-open it.
  - >-
    A fresh re-plan at RED_SHA cannot silently widen the diff. (a) Every source_code_hash in
    terraform/personal is `try(filemd5(...), null)` AND carries `ignore_changes =
    [source_code_hash]` (ducklake_lambdas.tf:59/74, 84/94, 278/302, 323/347;
    ducklake_catalog_dr.tf:190/205, 225/255; ducklake_maintenance.tf:159/197;
    ducklake_maintenance_smoke.tf:147/180; prod_lambdas.tf:36-37/349/385/425), so the artifact-fetch
    step landing lambda-packages/ under .dispatch-tooling/ rather than the workspace root cannot
    manufacture a lambda code diff. (b) DIRECT EVIDENCE, not an inference: `git log
    99eb2740c4402051e47ef12fa2d0e3a08f20a4a3..origin/main -- terraform/personal/` is EMPTY (0
    commits, verified at authoring). No terraform/personal source has changed since the red commit,
    so RED_SHA IS main's terraform/personal tree and planning at RED_SHA cannot roll back later
    work. This replaces the earlier inference ("red is the sole hard block, therefore nothing
    applied since 99eb274"), which plan-critique correctly called not airtight -- gated-apply jobs
    carry no convergence precondition of their own, and the human-gated break-glass admin tier
    bypasses the latch by design, so "red is latched" does not by itself entail "nothing applied".
    The empty git range does entail it for the only thing that matters here: the plan BASE.
acceptance_criteria:
  - >-
    The guard-BLOCK x stale-saved-plan cell is COVERED: on a saved-plan guard-BLOCK, apply-reconcile
    re-plans fresh, re-runs the deterministic guard against the fresh plan, and (on the expected
    fresh guard-ROUTE) uploads it as RECONCILE_FRESH_PLAN_ARTIFACT with a sha256 job output, so
    gated-apply-reconcile applies the FRESH plan after the human approval instead of a saved plan.bin
    that terraform will reject as stale. Verified structurally pre-merge (VP 1-6) and end-to-end
    post-merge by the DEP-02 teardown run (VP 8-9).
  - >-
    The pre-existing stale-apply route is ADDED TO, not replaced: `steps.apply` still emits
    stale=true on terraform's stale-plan signature, and a guard-PASS run's behaviour is
    bit-for-bit unchanged (on PASS, `steps.guard.outputs.routed` is empty, so needs_fresh_plan
    depends solely on stale exactly as today). The change is strictly additive on the BLOCK route.
  - >-
    Decision 77 no-TOCTOU holds on the new route, and the route set is disclosed rather than
    asserted away. The fresh plan is re-guarded by the SAME deterministic guard before anything is
    handed anywhere, and NOTHING IS EVER APPLIED UNGUARDED. What each route is gated by, stated
    exactly (the earlier "applied only behind the tf-gated-apply Environment approval; nothing is
    ever applied unguarded or unapproved" was FALSE on route (i) and both gates caught it):
    (i) fresh-guard-PASS -> `review_fresh` (subagent review, unchanged condition) is the SOLE gate
    and `apply_fresh` auto-applies in apply-reconcile with NO Environment approval;
    (ii) fresh-guard-BLOCK -> `review_fresh`/`apply_fresh` are skipped, the fresh plan.bin crosses
    the job boundary byte-verified by the symmetric sha256 EMIT/VERIFY pair, and gated-apply-reconcile
    applies it behind the tf-gated-apply Environment approval;
    (iii) `replan` failure -> red latch, pre-ratified by Decision 154 point 5(i).
    Those three are the COMPLETE terminal set -- there is no fourth. Route (i) is NEW-in-reach for a
    saved-plan guard-BLOCK episode; it is accounted for in the "DELIBERATE PROPERTIES OF THE NEW
    ROUTE SET" context entry and the human has RESOLVED that it stays open and disclosed rather than
    tightened ("TODO-GATE-TIGHTENING -- RESOLVED"). Disclosure is therefore the ONLY protection
    against a future reader concluding nothing moved; do not soften this criterion's wording.
  - >-
    A NEW standing --pre gate makes the defect non-reintroducible: label
    `recovery-workflow-topology` runs inside validate_ci_workflow_guards in BOTH tiers, and a
    negative test proves it FAILS against the exact pre-fix shape (fallthrough steps gated on
    `steps.apply.outputs.stale` with no `route` step) -- i.e. it would have caught the live defect
    that a plan author plus decision-scout, plan-critique and code-review all missed.
  - >-
    THE REACHABILITY CLAIM IS PROVEN PRE-MERGE, IN BOTH DIRECTIONS, BY A GROUND-TRUTHED HARNESS.
    scripts/ci/reconcile_reachability.py evaluates each apply-reconcile step's `if:` over the PARSED
    workflow and reports REACHABLE / UNREACHABLE for a supplied context. Against the PRE-FIX file it
    reports `replan` UNREACHABLE under guard=BLOCK -- matching what live run 30264239445 actually
    did -- and against the POST-FIX file it reports `replan` REACHABLE under the same context. BOTH
    directions are asserted (VP step 13): the pre-fix direction is what makes the post-fix result
    evidence rather than a self-confirming reimplementation of the same `if:` strings. The five
    contexts (guard=PASS x apply=success/stale/failure, and guard=BLOCK x guard_fresh=BLOCK/PASS)
    all evaluate without an unparsed token. This is a ONE-SHOT artifact for this change: it is NOT
    registered in validate.py and must not be promoted into a standing gate, and it does NOT replace
    VP steps 8-9, which remain the only proof that the workflow actually runs and the apply lands.
  - >-
    terraform/CLAUDE.md's red-record recovery row no longer misroutes and no longer calls Reconcile
    unlanded: the row names Reconcile as the vehicle for a guard-BLOCK / routed red, retains
    `terraform-apply-sandbox` workflow_dispatch acknowledge-and-retry for a guard-PASS red, and the
    string "not yet landed" is gone from that row. The file did NOT grow (VP step 14 asserts
    after <= 30485 bytes and after <= its config/prose_budgets.yaml entry), config/prose_budgets.yaml
    is untouched, and rec-2846 remains OPEN and unbundled -- this closes ONE of its rows, which is a
    correction, not a closure.
  - >-
    `agent-platform-probe-liveproof-role` is ABSENT from live AWS (iam:GetRole under the
    agent_platform_admin profile returns NoSuchEntity), and the gated destroy applied with ZERO
    AccessDenied in the run log. AMENDED AT IMPLEMENT TIME -- THE TEARDOWN IS THREE STEPS, NOT TWO
    (see the "TEARDOWN IS THREE STEPS" context entry): the criterion is met only when the
    `aws_iam_role.probe_dep02` entry is ALSO gone from the terraform/personal STATE, proven by a
    clean `terraform/personal` speculative plan on a subsequent PR. Deleting the role from AWS
    without clearing the state entry leaves every speculative plan failing AccessDenied under the
    PLANNER role.
  - >-
    The sandbox convergence record at s3://agent-platform-data-lake/convergence/personal/sandbox.json
    reads status=green (it is status=red at commit_sha 99eb2740c4402051e47ef12fa2d0e3a08f20a4a3,
    run 30264239445, as of this plan's authoring), unblocking terraform/personal CD applies.
  - >-
    rec-2847's closure is HONEST, not a blanket claim: it is closed with a resolution that names
    exactly what landed (part (a) in full; part (c) narrowed to reconcile.yml's red-recovery
    topology) AND names the follow-on rec id carrying its unlanded part (b) -- the single-heal-verb
    demotion of terraform-apply-sandbox's acknowledge_red_commit -- plus the generalised topology
    sweep. The follow-on rec is filed BEFORE rec-2847 is closed.
  - >-
    THE RECOVERY PATH'S AUTHORIZATION MODEL IS RECORDED AS EXACTLY ONE NEW NUMBERED DECISION in
    docs/DECISIONS.md -- its number allocated at implement time, never hardcoded by this plan -- and
    that entry records all SEVEN mandated elements: (1) the COMPLETE post-fix terminal route set for
    apply-reconcile, stated as complete; (2) the pre-existing fresh-replan substitution on the STALE
    route, previously sanctioned only in a reconcile.yml comment and terraform/CLAUDE.md prose and
    never numbered; (3) WHY -- the saved-plan-verbatim path is structurally unreachable for a
    guard-BLOCK episode (rec-2847), the most probable red shape; (4) WHAT IS PRESERVED -- Decision
    77's guard-to-apply ARTIFACT identity, explicitly distinguished from the reviewer-vs-apply DIFF
    identity Decision 77 nowhere ratifies; (5) THE ACCEPTED COST -- the Environment control's REACH
    is permanently narrowed, human-adjudicated; (6) REVERSAL CONDITIONS plus the TWO-SITE mechanism;
    (7) the citation set (Decisions 77, 92, 126/T2.37, 154, 150) with decision-scout named as
    provenance. The entry names `RECONCILE_FRESH_PLAN_ARTIFACT` literally, so VP step 15 locates the
    header by CONTENT rather than by a hardcoded number and cannot rot when the number shifts.
    docs/decisions-index.json is regenerated in the SAME commit (VP step 15 asserts it), and
    post-merge the entry is machine-visible in ops_decisions via the sanctioned DECISIONS.md ETL
    with failed=0 (VP step 16). NO SECOND DECISION IS MINTED, and no size or header ceiling is
    raised to make room for it.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the new `route` aggregator step exists in apply-reconcile and reads BOTH cause signals
      -- a route step that only reads one of them reproduces the defect in a new location.
    command: |-
      f=.github/workflows/reconcile.yml; rc=0
      grep -qF 'id: route' "$f" || { echo "MISSING route step"; rc=1; }
      grep -qF 'SAVED_PLAN_STALE: ${{ steps.apply.outputs.stale }}' "$f" || { echo "MISSING stale cause"; rc=1; }
