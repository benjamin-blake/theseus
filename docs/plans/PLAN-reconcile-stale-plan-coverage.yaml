      assert_step "Resolve fresh-plan entry condition (saved-plan stale OR saved-plan guard-routed)" success
      assert_step "Fresh re-plan (STALE_PLAN_FRESH_REPLAN fallthrough)" success
      assert_step "Deterministic apply guard (fail-closed) -- fresh re-plan" success
      assert_step "Emit fresh plan.bin sha256 (RECONCILE_FRESH_PLAN_ARTIFACT sha256 job-output EMIT)" success
      st=$(gh run view "$RUN" --json status --jq .status); echo "run_status=$st"
      [ "$st" = "waiting" ] || { echo "EXPECTED run status=waiting (tf-gated-apply approval pending)"; rc=1; }
      exit $rc
    expected: >-
      Exit 0. Every assert_step line matches, run_status=waiting, and gated-apply-reconcile is
      present in the job list (status waiting/queued) pending the Environment approval. The wake
      comment on the red commit's originating PR should say the fresh plan was routed to
      tf-gated-apply.
      WHY STEP-LEVEL, NOT JOB-LEVEL: the earlier form projected only job-level {name,status,
      conclusion} while its `expected` prose required the fresh-replan steps "EXECUTED, not
      skipped". A run where `replan` was STILL SKIPPED (i.e. the defect unfixed) but the job merely
      succeeded would have read as PASS -- and VP 8-9 are the FIRST AND ONLY runtime proof this plan
      ever gets, so an unfalsifiable VP 8 leaves the fix unproven end to end. Step conclusions are
      the observable that actually discriminates.
      WHY DISPATCH-TIME RESOLUTION: `sleep 15` + `gh run list --limit 1` can resolve a PRIOR
      reconcile run (a stale dispatch, or an earlier failed attempt), asserting against the wrong
      run entirely. SINCE is captured BEFORE the dispatch and the run is selected by createdAt.
      ON `apply-reconcile.outputs.fresh_plan_pending == true`: GitHub's REST API exposes no
      job-OUTPUT field, so it cannot be read directly. It is defined in reconcile.yml as literally
      `${{ steps.upload_fresh_plan_sha256.outcome == 'success' }}`, and that step carries no
      `continue-on-error`, so conclusion == outcome. The assert_step on that step's conclusion is
      therefore not a proxy for the output -- it is the output's own definition, evaluated on the
      same run.
      STEP NAMES ARE LOAD-BEARING: the REST jobs API keys steps by NAME, not by `id`. The five
      strings above must match the workflow byte-for-byte; the `route` step's name is fixed by
      execution step 1 for exactly this reason. `gh run view --json jobs` also nests `steps[]` per
      job and is an acceptable substitute; `gh api repos/{repo}/actions/runs/{id}/jobs` is used here
      as the guaranteed-shape form.
    fix_if: >-
      `Fresh re-plan ... conclusion=skipped` (or `<ABSENT>`) -- THIS IS THE UNFIXED DEFECT, or the
      dispatch resolved an OLD copy of reconcile.yml; confirm the fix is merged to main and that
      --ref main was used. `<ABSENT>` on the route step means its name does not match execution
      step 1's mandated string -- fix the workflow's step name, never the assertion.
      `Terraform apply ... -- saved plan` NOT skipped means the saved-plan guard did not BLOCK,
