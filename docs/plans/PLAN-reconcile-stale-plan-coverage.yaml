      echo "reconcile run: $RUN (dispatched at/after $SINCE) -- RECORD THIS ID"
      # --- OBSERVE (idempotent; re-runnable standalone with RUN/REPO set from the line above) ---
      for _ in $(seq 1 90); do
        J=$(gh api "repos/${REPO}/actions/runs/${RUN}/jobs" --jq '.jobs')
        [ "$(printf '%s' "$J" | jq -r '.[]|select(.name=="apply-reconcile")|.status')" = "completed" ] && break
        sleep 20
      done
      printf '%s' "$J" | jq -r '.[] | "JOB \(.name) status=\(.status) conclusion=\(.conclusion)"'
      rc=0
      assert_step() {
        got=$(printf '%s' "$J" | jq -r --arg n "$1" \
          '.[] | select(.name=="apply-reconcile") | .steps[] | select(.name==$n) | .conclusion')
        echo "STEP [$1] conclusion=${got:-<ABSENT>} expected=$2"
        [ "$got" = "$2" ] || rc=1
