    verification_step: 2
    test_selector: tests/lambdas/ducklake_telemetry_content_reader/test_masked.py
    red_green_expectation: red before (module missing), green after.
  - source: src/lambdas/ducklake_telemetry_content_reader/access_log.py
    behavior: Closed, value-free field set.
    verification_step: 1
    test_selector: tests/lambdas/ducklake_telemetry_content_reader/test_handler.py::test_every_read_writes_an_access_log_row
    red_green_expectation: red before (module missing), green after.
  - source: src/common/ducklake_content_read_verbs.py
    behavior: Window-bounded row resolution and ordered, deduped tree reassembly.
    verification_step: 3
    test_selector: tests/lambdas/ducklake_telemetry_content_reader/test_session_reassembly.py
    red_green_expectation: red before (module missing), green after.
  - source: src/lambdas/ducklake_telemetry_content_reader/manifest.yaml
    behavior: Stub; bundles the content closure and the detector package.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_telemetry_content_reader/test_packaging.py
    red_green_expectation: red before (manifest missing), green after.
  - source: scripts/telemetry_capture/read_route.py
    behavior: Content route, lazy and cross-route safe.
    verification_step: 2
    test_selector: tests/telemetry_capture/test_read_route.py
    red_green_expectation: red before (content tests absent), green after.
  - source: scripts/telemetry_content.py
    behavior: Pages, verifies hashes, frames untrusted text.
    verification_step: 2
    test_selector: tests/test_telemetry_content_cli.py
    red_green_expectation: red before (module missing), green after.
  - source: docs/contracts/storage-substrate.yaml
    behavior: Telemetry row names the production boundaries.
    verification_step: 4
    test_selector: tests/checks/contracts/test_telemetry_dimension_contracts.py::test_substrate_row_names_the_production_boundaries
    red_green_expectation: red before (node missing; row says transitional), green after.
constraints:
  - The manifest stays status stub; no build, deploy, Terraform, IAM or AWS state change in this plan.
  - No edit to ducklake_event_reads.py, ducklake_event_read_sql.py, ducklake_event_read_verbs.py, ducklake_event_content.py or the telemetry reader package; new code imports their helpers.
  - No literal secret, account id or ARN anywhere; test values are built at runtime (Decision 138, 101).
  - The Decision text is the operator-approved text; any change to it goes back to the operator.
  - No rescue agents or workaround loops (Decision 55).
