schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-reader"
intent: >-
  Build the production transcript content reader's code, ratified by a new Decision that fires Decision 236's
  content-consumer condition: a stub Lambda package agent-platform-ducklake-telemetry-content serving two masked verbs
  (one transcript row by grain key, one whole session tree reassembled in order), masking inside the function with
  plan 1's read_masked profile, one value-free access-log line per read, a 90-day read window, a client route and an
  agent CLI. It meets rec-4481's acceptance test, so it resolves rec-4481; the deploy half is split to rec-4696
  (plan 3). Nothing deploys: the manifest stays a stub until plan 3 builds the infrastructure and the operator-gated
  deploy. Also re-grounds storage-substrate.yaml's telemetry row to the production boundaries (rec-4692).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-content-reader.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed). Plan 2 of 3 for rec-4481 (High), resolved here at its
  acceptance test; planning-time split: the deploy half is rec-4696 (plan 3). Depends on PLAN-sensitive-value-detectors
  (merged). closes_criteria is empty: no tier_item criterion names this work.
closes_criteria: []
amends:
  - dec:236#2
  - dec:236#3
  - dec:236#6
  - dec:230#3
  - dec:230#5
  - dec:81#1
  - dec:81#7
  - dec:91#1
introduces:
  - transcript_row_masked
  - session_transcript_masked
  - telemetry_content_read
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      NEW Decision (origin/main max + 1 at build time; 239 today), text pinned verbatim in execution step 1, under
      6,144 bytes, inserted at the top of the newest-first corpus. Four dated trailing annotations (the [Amendment date, Decision N:
      ...] dialect these entries already carry, Decision 177), pinned verbatim in execution step 1, on Decisions 236,
      230, 81 and 91.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
  - file: docs/contracts/ducklake_telemetry_content_reader.yaml
    action: Create
    purpose: >-
      Class B contract, provisional_v0, mirroring docs/contracts/ducklake_telemetry_reader.yaml's shape:
      principal_classes PlatformDev (and github_ci_branch for the read-back gate); verbs describe and named_read with the
      two served verbs, payload_schema_ref, response_codes and typed_errors (unknown_verb 400, named_read_input 400,
      outside_read_window 404, response_too_large 413, grain_conflict 500, content_not_text 500, blob_integrity 500,
      blob_unavailable 503, catalog_unavailable 503, unmapped 500); audit_invariants: masked bytes only (the new Decision
      cl.2), no caller SQL, no other event verb, the access-log line's closed field set, URL-only (Decision 213),
      read-only attach on the shared reader login; amendment_log first row.
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: >-
      rec-4692: tables.telemetry_tables re-grounded -- note and reason say the production writer appends to
      ducklake_telemetry since the 2026-10-27 flip; status live (this contract's word for production rows written and
      served; rec-4483 decides field_semantics' separate vocabulary); write_boundary the telemetry writer on
      ducklake_telemetry; read_boundary the telemetry reader (event verbs, no content) and the content reader (masked
      content, the new Decision); migration_ref names T2.36 complete and the new Decision; amendment_log entry.
  - file: tests/checks/contracts/test_telemetry_dimension_contracts.py
    action: Modify
    purpose: >-
      test_substrate_rows_name_the_telemetry_writer becomes test_substrate_row_names_the_production_boundaries
      (rec-4692's acceptance): pins status live, ducklake_telemetry in write_boundary, both reader function names in
      read_boundary, and no "empty until" or "no writer emits" text. The old assertion of status transitional and
      ducklake_smoke in reason encodes the pre-flip state and is replaced (planned-change, acceptance_criteria[6]).
  - file: src/common/ducklake_content_read_verbs.py
    action: Create
    purpose: >-
      CONTENT_READS: two EventRead entries (the ducklake_event_read_verbs EventRead type, no content response flag, so
      ev.execute_entry returns resolved rows and never calls serve_content). transcript_row_masked: params session_id,
      producer, event_id, parser_version, offset, max_bytes, window_start (bound by the handler, never the caller);
      SQL = TRANSCRIPT_CONTENT_SQL's grain-key resolution plus session_started_at >= $window_start, built from the
      shared template so the resolution rule has one copy. session_transcript_masked: params session_id, offset (row
      offset), max_rows, window_start, include_tool_output; SQL = the tree key resolution of TREE_ROWS_SQL over the
      R4/R5-deduped transcripts (compose and dedupe_ctes from ducklake_event_read_sql, never re-written), every row's
      session_id, producer, event_id, parser_version, event_timestamp, source_ordinal, purpose, origin, content,
      content_uri, content_sha256, content_bytes, content_omitted_reason, plus total_rows and the conflicts list; order:
      the root session first, then each child session by its first event_timestamp, then event_timestamp,
      coalesce(source_ordinal, -1), event_id, purpose rank (prompt, system, thinking, response, tool_input,
      tool_result, tool_output); tool_output rows only when include_tool_output. READ_WINDOW_DAYS = 90.
      MAX_SESSION_BYTES = 4 MiB of masked text per response. No import-time work.
  - file: src/lambdas/ducklake_telemetry_content_reader/__init__.py
    action: Create
    purpose: Package marker.
  - file: src/lambdas/ducklake_telemetry_content_reader/handler.py
    action: Create
    purpose: >-
      Entrypoint mirroring ducklake_telemetry_reader/handler.py's actions describe and named_read (no attach_check: the
      read-back gate uses named_read), SERVED_VERBS = frozenset(CONTENT_READS), production pin required, the reader
      secret (TELEMETRY_DSN_SECRET_ID) with read_only=True, the same typed-error, deadline, dead-connection reopen and
      413 size guard. Binds window_start = now - READ_WINDOW_DAYS; a caller-supplied window_start is refused 400. A
      resolved row or tree outside the window answers 404 outside_read_window. Calls masked.serve_row or
      masked.serve_session, then access_log.write once per named_read, success or typed failure. log_invocation
      unchanged.
  - file: src/lambdas/ducklake_telemetry_content_reader/masked.py
    action: Create
    purpose: >-
      serve_row: resolves the stored row as serve_content does (grain_conflict 500, inline preferred), reads the WHOLE
      payload (inline content, or the blob through ducklake_event_content.BLOB_STORE.get_blob at offset 0, its full
      size, HEAD and ETag bound), decodes UTF-8 strictly (content_not_text 500 on failure), masks with
      mask(text, "read_masked"), then pages the masked UTF-8 bytes as base64 pages of at most 3 MiB. Envelope:
      storage, encoding, offset, length, content_bytes, content_sha256 (raw, as stored), masked_bytes, masked_sha256,
      mask_counts, detector (the read_masked fingerprint), data_class "untrusted_transcript", data, omitted_reason.
      serve_session: walks the resolved rows in order; inline rows carry masked text, object rows are fetched and
      masked one at a time; stops before MAX_SESSION_BYTES and returns next_offset (or null), total_rows, conflicts,
      and per row the same hashes and counts; a single row whose masked text exceeds the budget is returned without
      text and with too_large true, so the caller pages it through transcript_row_masked. Never logs or returns
      content_uri, a bucket, a key or an exception message.
  - file: src/lambdas/ducklake_telemetry_content_reader/access_log.py
    action: Create
    purpose: >-
      write(event, verb, status, rows, masked_bytes, mask_counts, request_id, session_id): prints one JSON line
      {event: telemetry_content_read, role, verb, status, session_id, rows, masked_bytes, mask_counts, request_id}.
      role is the assumed-role name parsed from requestContext.authorizer.iam.userArn (the telemetry writer's
      _principal parsing) passed through mask(.., "read_masked"); a missing identity logs role "unknown" (the Function
      URL is AWS_IAM, so it is never missing in production). Never the ARN, account id, session name, text or params
      beyond session_id.
  - file: src/lambdas/ducklake_telemetry_content_reader/manifest.yaml
    action: Create
    purpose: >-
      status stub (Decision 79: no build, deploy or smoke until plan 3 flips it to active). artifact
      ducklake-telemetry-content-reader.zip; functions [agent-platform-ducklake-telemetry-content]; handlers the
      handler; includes the telemetry reader's list plus src/common/ducklake_event_content.py,
      src/common/ducklake_telemetry_blobstore.py, src/common/ducklake_content_read_verbs.py,
      src/sensitive_values/__init__.py, classes.py, profiles.py, engine.py and this package's modules; assets
      field_semantics.yaml and version.yaml; runtime_config [/agent-platform/ducklake/telemetry_content_reader_url];
      notes cite the new Decision.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      excludes gain src/lambdas/ducklake_telemetry_content_reader and src/common/ducklake_content_read_verbs.py (same
      new-path-exclude ground as plan 1; no data-pipeline deploy).
  - file: scripts/telemetry_capture/read_route.py
    action: Modify
    purpose: >-
      Add the content route: CONTENT_READER_URL_ENV DUCKLAKE_TELEMETRY_CONTENT_READER_URL, CONTENT_READER_URL_PARAMETER
      /agent-platform/ducklake/telemetry_content_reader_url, CONTENT_READER_FUNCTION, CONTENT_VERBS =
      frozenset(CONTENT_READS), and content_reader(profile) -> DuckLakeReader resolved lazily the same way as the event
      route; a content verb on the event route, or an event verb on the content route, raises before any call. Errors
      name a source, never a value or URL (Decision 101).
  - file: scripts/telemetry_content.py
    action: Create
    purpose: >-
      Agent CLI: `bin/venv-python -m scripts.telemetry_content session <session_id> [--include-tool-output]` and
      `row <session_id> <producer> <event_id> <parser_version>`. Pages to completion, verifies every row's
      masked_sha256 over the reassembled text, and prints the text between fixed BEGIN/END UNTRUSTED TRANSCRIPT DATA
      lines with a one-line header (session, rows, mask counts, detector). Exit 2 on a hash mismatch, 3 on
      outside_read_window, 1 on any other typed error, naming the error_type only.
  - file: tests/lambdas/ducklake_telemetry_content_reader/__init__.py
    action: Create
    purpose: Package marker.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_handler.py
    action: Create
    purpose: >-
      Fake-connection handler tests mirroring the telemetry reader's: served set is exactly CONTENT_READS and excludes
      every EVENT_READS verb; unserved verb 400 before connect; caller window_start 400; production pin and reader
      secret with read_only; typed errors; 413 guard; test_every_read_writes_an_access_log_row (rec-4481's acceptance:
      one telemetry_content_read line per named_read across success, 400, 404 and 500, with the closed field set and
      no ARN, account-shaped run or content); test_every_served_byte_is_masked (a planted runtime-built credential,
      account id and DSN password in inline and blob rows never appear in any page or session response, and
      masked_sha256 matches the decoded data).
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_masked.py
    action: Create
    purpose: >-
      serve_row: mask-then-page (a planted value straddling the 3 MiB page boundary is masked), offsets past
      masked_bytes 400, grain_conflict 500, omitted rows, non-UTF-8 500, blob faults typed. serve_session: order,
      budget stop and next_offset, too_large rows, tool_output inclusion flag.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_session_reassembly.py
    action: Create
    purpose: >-
      Real DuckDB, full tier (module importorskip, as tests/common/test_ducklake_event_verification_verbs.py): every
      golden-chain tree appended through the real kernel into the in-memory telemetry catalog, then read through
      session_transcript_masked page by page; the reassembled rows equal the R4/R5-deduped stored transcript rows of
      the tree (oracle: scripts.telemetry_verify's read_tree), in the declared order, each masked text equal to
      mask(stored, "read_masked"); a session started 91 days before as_of is outside the window.
  - file: tests/lambdas/ducklake_telemetry_content_reader/test_packaging.py
    action: Create
    purpose: >-
      The manifest bundles the content module, blob store, content verbs and the four sensitive_values modules;
      status stub; the telemetry reader's manifest still bundles none of them; data-pipeline excludes the package;
      the handler and the content verbs module affect only this artifact.
  - file: tests/telemetry_capture/test_read_route.py
    action: Modify
    purpose: Add content-route tests (lazy resolution, env override, cross-route refusal, value-free errors).
  - file: config/agent/verification_registry/entries/telemetry-content-reader-access-log.yaml
    action: Create
    purpose: >-
      Graduation shard for VP step 1 (test_selector over
      tests/lambdas/ducklake_telemetry_content_reader/test_handler.py::test_every_read_writes_an_access_log_row,
      guard_target the handler, plan_slug telemetry-content-reader, graduated_by implement-agent, graduated_at the merge
      date).
  - file: config/agent/verification_registry/entries/telemetry-content-session-reassembly.yaml
    action: Create
    purpose: >-
      Graduation shard for VP step 3 (test_selector over
      tests/lambdas/ducklake_telemetry_content_reader/test_session_reassembly.py, guard_target
      src/common/ducklake_content_read_verbs.py; same field set).
  - file: tests/test_telemetry_content_cli.py
    action: Create
    purpose: >-
      Fake reader: paging to completion, hash verification and exit 2 on mismatch, untrusted-data framing lines, exit
      codes for typed errors, no URL or value in any error line.
bundled_recommendations:
  - rec-4481
  - rec-4692
followon_recs:
  - rec-4696
  - rec-4697
  - rec-4698
  - rec-4699
infrastructure_dependencies: []
acceptance_criteria:
  - The new Decision is in docs/DECISIONS.md verbatim as pinned, under the per-entry cap, with the four dated annotations and a regenerated index.
  - The content reader serves exactly two verbs, every served byte masked with read_masked, and refuses every other verb, caller SQL and caller window.
  - Every named_read writes exactly one value-free telemetry_content_read line.
  - session_transcript_masked reassembles every golden tree's deduped transcript rows in the declared order against a real DuckDB catalog.
  - The manifest is a stub, so no build, deploy or smoke runs; no other artifact's bundle changes.
  - The agent CLI prints masked text between untrusted-data markers and fails on any masked_sha256 mismatch.
  - storage-substrate.yaml's telemetry row names the production writer and both readers (rec-4692).
  - rec-4481 and rec-4692 are closed after merge by the Resolves trailer, and the new Decision is in ops_decisions.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4481's acceptance -- every read writes one access-log line; and every served byte is masked.
    command: >-
      bin/venv-python -m pytest
      tests/lambdas/ducklake_telemetry_content_reader/test_handler.py::test_every_read_writes_an_access_log_row
      tests/lambdas/ducklake_telemetry_content_reader/test_handler.py::test_every_served_byte_is_masked -q
    expected: exit 0. Before the change neither node exists.
    fix_if: A line is missing or carries an ARN, account-shaped run or content -- fix the handler; never the test.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: telemetry-content-reader-access-log
  - step: 2
    phase: pre-deploy
    action: Handler, masking, packaging, route and CLI suites.
    command: >-
      bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_content_reader tests/telemetry_capture/test_read_route.py
      tests/test_telemetry_content_cli.py tests/lambdas/ducklake_telemetry_reader -q
    expected: exit 0.
    fix_if: Fix the code in scope; the telemetry reader suite failing means a shared module changed -- revert that change.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Directory selections already in every tier's affected-test selection; step 1 graduates the acceptance nodes.
  - step: 3
    phase: pre-deploy
    action: Whole-session reassembly against a real DuckDB catalog over the golden chain.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_content_reader/test_session_reassembly.py -q
    expected: exit 0 with the module not skipped (duckdb importable in the venv).
    fix_if: A tree differs from the oracle -- fix the SQL or assembly; never relax the comparison.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: telemetry-content-session-reassembly
  - step: 4
    phase: pre-deploy
    action: Decision, contracts and substrate row.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_telemetry_dimension_contracts.py::test_substrate_row_names_the_production_boundaries -q &&
      bin/venv-python -c "from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as c; f=[]; c(f); print('DECISION_SIZE_FAILS', len(f)); assert not f, f"
    expected: exit 0; last line DECISION_SIZE_FAILS 0.
    fix_if: The Decision is over the cap -- tighten the text with the operator, never raise a budget.
    hermetic: true
    expected_literals: ["DECISION_SIZE_FAILS 0"]
    graduation: waive
    graduation_waiver_reason: The substrate node and the size check both run in every tier.
  - step: 5
    phase: pre-deploy
    action: No active artifact changes; the content reader is a stub.
    command: >-
      bin/venv-python -m scripts.lambda_manifest --validate &&
      bin/venv-python -c "import subprocess; from scripts.lambda_manifest import compute_affected_artifacts as c, load_all; names=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True,check=True).stdout.split(); a=c([n for n in names if n!='src/lambdas/data-pipeline/manifest.yaml']); m=load_all(); print('ACTIVE_AFFECTED', sorted(k for k in a if m[k].status=='active'))"
    expected: exit 0; last line ACTIVE_AFFECTED [].
    fix_if: An active artifact is affected -- a shared module changed; move the change into the new modules.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads this branch's transient diff.
  - step: 6
    phase: pre-deploy
    action: SLOC budgets hold with no raise.
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as c; f=[]; c(f); print('SLOC_FAILS', len(f)); assert not f, f"
    expected: SLOC_FAILS 0.
    fix_if: Decompose (Decision 128); never raise.
    hermetic: true
    expected_literals: ["SLOC_FAILS 0"]
    graduation: waive
    graduation_waiver_reason: Replays the registered SLOC check.
  - step: 7
    phase: pre-deploy
    action: Full tier (Decision 163).
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: In-scope failures are fixed on the branch; out-of-scope failures become recs (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge: the new Decision reaches ops_decisions, rec-4481 and rec-4692 are closed by the Resolves trailer, and the
      deploy-ducklake-lambdas.yml run the merge triggers (new src/lambdas/ducklake_* and src/common/ducklake_* paths)
      redeploys only unchanged code and stays green; it never names the content function.
    command: >-
      bin/venv-python -c "import re, pathlib; from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); n=re.findall(r'^## Decision (\d+): Agents read production transcript text masked', t, re.M); assert len(n)==1, n; r=make_reader(profile='agent_platform'); d=r.named('decision_by_id', id='dec-'+n[0]); recs,_=fetch_recs_by_ids(r, ['rec-4481', 'rec-4692']); print('DECISION_ROWS', len(d)); print(sorted((x['id'], x['status']) for x in recs))"
    expected: DECISION_ROWS 1 (rec-autoclose.yml's post-merge backfill wrote it); rec-4481 and rec-4692 closed.
    fix_if: >-
      No Decision row -- read the rec-autoclose run log and fix its cause; the sanctioned manual path is
      `bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md` (Decision 84 I-2). A red deploy run is
      diagnosed on its own merits.
    hermetic: false
    graduation: not-applicable
test_obligations:
