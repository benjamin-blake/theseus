slug: sloc-limits-accounting-adoption
intent: 'Adopt the Decision 170 accounting declaration in validate_sloc_limits and take its single name off the check-accounting grandfather roster, so Task 5 Unit 1''s two-line function-local rename inside the same module stops tripping clause (d) of validate_check_accounting (touch-it-fix-it). The check gains one terminal registry.examined(scanned, unit="gated_python_files") call covering its single reachable success exit, config/check_accounting_baseline.yaml shrinks by exactly one entry, and the mirror test file gains four failing-first tests pinning the declaration on the pass path, the failure path, an empty tree, and the touch-it-fix-it consequence. ONE name only: this is not Task 8 slice 0 or slice 1 -- no path-aware declaring-coverage metric is built or claimed, no other roster name is touched, no enforcement threshold is set, and no status vocabulary member is added.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-sloc-limits-accounting-adoption.yaml
phase: Check-accounting declaration adoption for the single name validate_sloc_limits, forced now by Task 5 Unit 1's touch-it-fix-it obligation on scripts/checks/sloc/sloc_limits.py. No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 8 authorization line; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: scripts/checks/sloc/sloc_limits.py
  action: Modify
  purpose: 'Adopt the Decision 170 declaration inside validate_sloc_limits: initialise a local `scanned = 0` beside the existing errors/advisories lists, increment it once as the FIRST statement of the iter_gated_py_files() loop body (before the <=500-SLOC `continue`, so a file that needs no budget check still counts as examined), and add exactly one terminal `registry.examined(scanned, unit="gated_python_files")` as the function''s last statement, after the trailing if errors/else block. examined(), never skipped(): iter_gated_py_files() always walks the tree, so there is no unavailable-input or unmet-precondition branch, and an empty tree is an EMPTY DOMAIN whose honest declaration is examined(0) (docs/contracts/check-accounting.yaml discrimination_rule). `registry` is already imported at module top. Neither _load_sloc_budgets nor _update_sloc_budgets is touched -- _update_sloc_budgets is Task 5 Unit 1''s hunk and must stay byte-identical in this diff.'
- file: config/check_accounting_baseline.yaml
  action: Modify
  purpose: Delete the single line "  - validate_sloc_limits" (line 106 of the 82-entry `entries:` list at the session HEAD), leaving every other entry and its order untouched. No header, comment, or other entry changes. This is a pure SHRINK, which the roster's own grammar permits unconditionally; removal is PERMANENT (the file header forbids re-adding).
- file: tests/checks/sloc/test_sloc_limits.py
  action: Modify
  purpose: 'The Decision 131/159 mirror file for sloc_limits.py (288 lines / 229 SLOC at HEAD against a 500-SLOC ceiling, so there is headroom and no new file is warranted). Append two self-contained classes: TestSlocLimitsAccountingDeclaration (three tests asserting the exact examined count and unit via registry.pop_declaration() on the pass path, the failure path, and an empty tree) and TestSlocLimitsOffAccountingRoster (one test driving validate_check_accounting over a tmp_path tree that carries a real copy of the module source, a roster WITHOUT validate_sloc_limits, and the module in the patched changed-file set, asserting no violation names validate_sloc_limits). Both classes own their helpers; no import from any other test_* module (Decision 131).'
