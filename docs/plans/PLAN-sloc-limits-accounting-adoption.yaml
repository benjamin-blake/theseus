rollback: 'Single squash commit, but this change is ONE-WAY after merge -- there is no revert path, and the plan says so rather than assuming one. Pre-merge: everything is undone by dropping the branch; nothing is irreversible while the PR is open. Post-merge, the roster half cannot be reverted. Verified 2026-09-03 in a scratch clone by patching _marker_guard.default_base_reader to the post-merge main roster (validate_sloc_limits absent) with the line restored in the tree: validate_check_accounting fails clause (c) with "config/check_accounting_baseline.yaml grew by [''validate_sloc_limits''] relative to origin/main -- the baseline is shrink-only (no marker escape, Decision 165); an entry may be removed, never (re-)added." Clause (c) compares the tree against origin/main, which after the merge no longer carries the line, so a revert PR restoring it is NET GROWTH and fails. An earlier draft of this section claimed the shrink-only clause "compares against origin/main, where the line is present again after the revert" -- that was circular and is withdrawn. Clause (c)''s only escape is its loud SKIP on an unreachable origin/main, which does not occur in CI. The module half is equally one-way once the roster line is gone: reverting the three added lines while the name is off the roster fails clause (a) instead -- reproduced in the same clone as "validate_sloc_limits: declares no examined()/skipped() outcome and is not in config/check_accounting_baseline.yaml". The roster deletion and the declaration are therefore JOINTLY irreversible: no ordering of reverts yields a green tree. What remains is forward-fix only (Decision 55). A defect in the declaration is corrected by editing the examined() call -- its count, unit or placement -- never by re-adding the roster entry or by deleting the declaration. Re-baselining validate_sloc_limits at all would require a fresh Decision amending the shrink-only roster plus a reviewed edit to the guard''s frozen _BASELINE_SEED path; that is out of scope here. The four new tests in tests/checks/sloc/test_sloc_limits.py are the only independently removable piece (the module already measures 100.0 per-file coverage without them), but removing them would leave the declaration unpinned and is not a rollback this plan endorses. Ordering note, now secondary: whether Task 5 Unit 1 has landed does not change the above -- both halves are already unrevertible on their own; Unit 1 merely adds a clause-(d) exposure on top if the declaration were removed. Practical consequence for the implementing session: the branch is the LAST point of correction. Get VP steps 5, 6, 10 and 11 green before the squash-merge. Nothing in config/, docs/contracts/ or the verification registry other than the two graduated shards is implicated, and those two shards are ADDs that can be removed without tripping any accounting clause.'
