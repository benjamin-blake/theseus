- step: 4
  phase: pre-deploy
  action: The whole sloc mirror package stays green with the new classes in it -- the sixteen pre-existing tests in test_sloc_limits.py plus the cc_limits, complexity, budget-raises and manifest mirrors.
  command: bin/venv-python -m pytest tests/checks/sloc/ -q
  expected: All tests in tests/checks/sloc pass. No pre-existing test asserts anything about the declaration slot, so the adoption is additive for them; verified green at planning time in a scratch clone alongside tests/checks/hygiene/test_validate_check_accounting.py, tests/validate/test_scaffold_gates.py, tests/validate/test_tiers.py and tests/validate/test_driver_seam.py, the other live callers of validate_sloc_limits.
  fix_if: A failure in a pre-existing test means the adoption changed behaviour beyond the declaration -- the errors/advisories logic and the `failed` label must be byte-identical. Diagnose in the module, never by relaxing the older assertion.
