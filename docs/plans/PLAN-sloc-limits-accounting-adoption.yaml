- step: 5
  phase: pre-deploy
  action: 'Roster shrink and scope boundary, both derived from git rather than pinned: the roster lost exactly the name validate_sloc_limits, gained nothing, kept every other entry in its original order, and the branch touches no path outside the declared scope union its sanctioned companions. The boundary half consumes `_common.get_status_aware_diff()` -- the SAME seam the registered gate uses (scripts/checks/verification/validate_scope_boundary.py:209) -- and NOT a hand-rolled `git diff --name-only origin/main`. That seam choice is load-bearing, not cosmetic. get_status_aware_diff diffs against merge-base(origin/main, HEAD) and existence-filters its A/M paths, so it does not report a file that exists on origin/main and that this branch merely predates; it also reports untracked new files (the two graduation shards), which a raw --name-only diff misses entirely. Measured on the session branch (HEAD bdf1421, origin/main ee3aade, merge-base == HEAD): the raw seam reports docs/plans/PLAN-critique-convergence-procedure.yaml -- a file this branch never touches -- and would fail the step; the merge-base seam reports exactly the six touched paths. The roster half keeps `git show origin/main:<rel>`, which is the base seam clause (c) itself uses (_marker_guard.default_base_reader). hermetic false: it reads real git state (git show, git merge-base, git diff, git ls-files).'
  command: 'bin/venv-python -c "import subprocess, pathlib, yaml; from scripts.checks import _common; rel=''config/check_accounting_baseline.yaml''; allowed={rel,''scripts/checks/sloc/sloc_limits.py'',''tests/checks/sloc/test_sloc_limits.py'',''docs/plans/PLAN-sloc-limits-accounting-adoption.yaml'',''config/agent/verification_registry/entries/sloc-limits-declares-examined-on-every-path.yaml'',''config/agent/verification_registry/entries/sloc-limits-off-check-accounting-roster.yaml''}; g=subprocess.run([''git'',''show'',''origin/main:''+rel],capture_output=True,text=True,encoding=''utf-8'',errors=''replace''); base=((yaml.safe_load(g.stdout) or {}).get(''entries'') or []) if g.returncode==0 else None; cur=(yaml.safe_load(pathlib.Path(rel).read_text(encoding=''utf-8'')) or {}).get(''entries'') or []; touched=sorted({p for _s, p in _common.get_status_aware_diff()}); outside=sorted(set(touched)-allowed); removed=[n for n in base if n not in cur] if base is not None else ''BASE-SKIPPED''; added=[n for n in cur if n not in base] if base is not None else ''BASE-SKIPPED''; kept=([n for n in base if n in cur]==cur) if base is not None else ''BASE-SKIPPED''; shrink_ok=True if base is None else (removed==[''validate_sloc_limits''] and not added and kept is True and len(cur)==len(base)-1); print(''BASE-SKIPPED: origin/main unreachable -- roster shrink NOT asserted this run; boundary still asserted'') if base is None else None; print(''removed='', removed, ''| added='', added, ''| order_preserved='', kept, ''| touched='', touched, ''| outside_scope='', outside); raise SystemExit(0 if shrink_ok and not outside else 1)"'
  expected: 'Exit 0 printing removed= [''validate_sloc_limits''], added= [], order_preserved= True, outside_scope= [] and a touched= list of exactly six paths -- the three scope rows plus this plan and the two shards, nothing else. Reproduced 2026-09-03 in a scratch clone whose origin/main was set to the real ee3aade and whose tree carried the module edit, the roster deletion, the plan file and both untracked shards: exit 0 with exactly those six paths. Two negative controls were reproduced in the same clone: an extra out-of-scope file makes outside_scope non-empty and the step exits 1, and with refs/remotes/origin/main deleted the step prints the BASE-SKIPPED line, marks removed/added/order_preserved BASE-SKIPPED and still asserts the boundary half (exit 0 only because nothing is outside scope). An unasserted roster shrink is printed, never silently passed.'
  fix_if: 'A non-empty added= or a False order_preserved= means the roster edit did more than delete one line -- restore config/check_accounting_baseline.yaml from origin/main and delete only the "  - validate_sloc_limits" line. A non-empty outside_scope= under THIS seam is a genuine scope-boundary crossing (Decision 59, docs/contracts/implement-scope-boundary.yaml): the named path really was added, modified, or left untracked by this session, so revert the hunk or delete the stray file (an untracked scratch file counts -- that is deliberate parity with validate_scope_boundary). Never widen the `allowed` set and never widen this plan''s scope list to absorb it: scope, acceptance_criteria and verification_plan[].command/.expected are prohibited_field_edits on the implementing_plan_bookkeeping sanction row, so any change there is a human-directed plan amendment, not an implement-time repair. A BASE-SKIPPED line means origin/main is unreachable -- fetch it and re-run rather than merging on an unasserted roster shrink; the boundary half is still asserted on that path. If this step ever names a path the branch demonstrably does not touch, STOP and escalate for a plan amendment; do not edit the step to get past it.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A diff-against-origin/main assertion about this PR only -- vacuous on every later commit -- and the standing surfaces (validate_scope_boundary, validate_check_accounting's own shrink-only clause) already own these invariants in the tiers.
- step: 6
  phase: pre-deploy
  action: 'The registered guard itself is clean on the modified tree: validate_check_accounting appends nothing to `failed` and prints no line naming validate_sloc_limits, so neither clause (a) nor clause (d) fires with the module in the branch''s changed-file set. hermetic false: the guard reads real git state (default_base_reader''s git show, get_changed_files) and the live tree.'
  command: bin/venv-python -c "import io, contextlib; from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting; buf=io.StringIO(); failed=[]; ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); validate_check_accounting(failed); ctx.__exit__(None, None, None); out=buf.getvalue(); naming=[l.strip() for l in out.splitlines() if 'validate_sloc_limits' in l]; print(out.strip().splitlines()[-1]); print('failed=', failed, '| lines_naming_sloc_limits=', naming); raise SystemExit(0 if not failed and not naming else 1)"
