acceptance_criteria:
- validate_sloc_limits declares via registry.examined(scanned, unit="gated_python_files") -- examined(), never skipped() -- and `scanned` equals the number of files iter_gated_py_files() actually yielded on that call (incremented once per file, before the under-limit `continue`).
- 'The declaration is the LAST statement of validate_sloc_limits, after the trailing if errors/else block, so every reachable exit declares. Verified property, not assumption: an AST scan of the function at the session HEAD found 0 return statements, 0 raise statements, 0 nested functions or lambdas and no sys.exit call, so the function has exactly one reachable success exit (fall-through) and one trailing call covers it.'
- 'config/check_accounting_baseline.yaml is exactly one entry shorter: `validate_sloc_limits` is absent, every other entry is present, in the same order, and no entry was added -- asserted as a derived set/order diff against origin/main, not against a pinned integer.'
- validate_check_accounting reports NO violation naming validate_sloc_limits with the module in the branch's changed-file set, and its `failed` list is empty -- neither clause (a) (unbaselined and undeclared) nor clause (d) (edited-but-unadopted) fires.
- 'scripts/checks/hygiene/validate_check_accounting.py is NOT edited: the frozen `_BASELINE_SEED` constant still lists validate_sloc_limits, which is legal because clause (b) is a superset test (current_baseline - _BASELINE_SEED must be empty), so a removal can never trip it.'
- On a real run against the branch tree, registry.derive_status() for validate_sloc_limits returns "enforced" (examined count > 0, nothing appended to `failed`) rather than "undeclared"; on an empty tree the same code path yields "vacuous" via examined(0), pinned hermetically by a mirror test.
- 'The four new tests are red before the change and green after: two assert the EXACT examined count on the pass path and on the failure path (where the check both appends to `failed` and still declares), one asserts examined(0) plus derive_status() == "vacuous" on a tree with no gated Python file, and one asserts the touch-it-fix-it consequence. All four are hermetic via patch("scripts.checks._common.ROOT", tmp_path) and hand-built trees; none reads the live repo tree or live git state.'
- 'The diff touches only the three scope rows plus this plan and the two graduated verification-registry shards (Decision 176 grain, a sanctioned companion per docs/contracts/implement-scope-boundary.yaml, never a scope row) -- asserted over `_common.get_status_aware_diff()`, the merge-base-relative, existence-filtered, untracked-aware seam that validate_scope_boundary itself consumes, and NOT over a raw `git diff --name-only origin/main` (which on this branch additionally reports files that exist only on origin/main and misses untracked new shards). Naming the seam is part of the criterion: the criterion is true under the merge-base seam and false under the raw one. No other roster name, no other check module, no docs/contracts/check-accounting.yaml edit, no config/ci_rca_taxonomy.yaml edit, no tests/conftest.py edit, and nothing under src/**, terraform/**, scripts/executor/**, scripts/execute_recommendation.py or any deploy-trigger path.'
- 'No new registered check is introduced, so none of the seven registration surfaces in scripts/checks/registry.py''s docstring opens: scripts/checks/sloc/_manifest.py keeps its existing validate_sloc_limits Entry byte-identical, config/ci_rca_taxonomy.yaml already carries `validate_sloc_limits: sloc_violation`, and the mirror test file already exists.'
- 'config/mypy_baseline.yaml, config/sloc_budgets.yaml, config/coverage_baseline.yaml, config/prose_budgets.yaml and config/structural_size_budgets.yaml are byte-identical: no entry added, lowered or raised, and no raise-approved marker anywhere in the diff. Each of the three scope files measures at or under 500 SLOC and none is registered in config/sloc_budgets.yaml.'
- No enforcement threshold, no path-aware declaring-coverage metric, and no new status_vocabulary member (in particular no "warned") is introduced anywhere in the diff.
- 'Both per-file baseline ratchets stay satisfied WITHOUT growing this plan''s scope list: mypy measures exactly 1 error on scripts/checks/sloc/sloc_limits.py (the pre-existing line-44 `int | None` assignment inside the untouched _update_sloc_budgets), at -- not above -- its config/mypy_baseline.yaml entry, and per-file line coverage for the whole module measures 100.0, meeting Decision 159''s implicit-100% standard for a changed file with no coverage_baseline entry. Neither config/mypy_baseline.yaml nor config/coverage_baseline.yaml is edited, and no `# baseline-raised:` or `# baseline-lowered:` marker appears anywhere in the diff (Decision 161, Decision 159, Decision 165).'
- 'Neither graduated shard overwrites an existing record: config/agent/verification_registry/entries/sloc-limits-declares-examined-on-every-path.yaml and entries/sloc-limits-off-check-accounting-roster.yaml are both ADDS (both paths verified absent among the 598 shards on disk at 2026-09-03), and neither step reaches for the generic name entries/registry-check-accounting-declared.yaml, which plan-slug verification-registry-sharding already owns for validate_verification_registry -- Decision 176''s one-record-per-file grain makes filename equal check_id, so check_ids are a global namespace and a generic name silently overwrites rather than failing.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'RED -- prove the blocking violation exists BEFORE the change. In a throwaway clone of this repo, append one comment line to scripts/checks/sloc/sloc_limits.py (a real, behaviour-free touch) and run validate_check_accounting in-process; the touch-it-fix-it clause must fire and name validate_sloc_limits. Run FIRST, before any edit to the working tree. hermetic false for a stated reason and not for cost (Decision 148): it shells out to git clone and asserts a violation that this plan deliberately INVERTS, so replaying it against the implementation-bearing tree would exit 1.'
  command: C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && cd "$C" && printf '# touch-probe\n' >> scripts/checks/sloc/sloc_limits.py && bin/venv-python -c "import io, contextlib; from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting; buf=io.StringIO(); failed=[]; ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); validate_check_accounting(failed); ctx.__exit__(None, None, None); out=buf.getvalue(); hits=[l.strip() for l in out.splitlines() if 'validate_sloc_limits' in l and 'touch-it-fix-it' in l]; print('failed=', failed, '| touch_it_fix_it_hits=', hits); raise SystemExit(0 if failed and len(hits) == 1 else 1)"
  expected: 'Exit 0, printing failed= [''Check-accounting declaration ratchet''] and exactly one hit whose text (printed by the guard as a "  - " bullet) reads "validate_sloc_limits: scripts/checks/sloc/sloc_limits.py was edited on this branch but still declares no examined()/skipped() outcome (touch-it-fix-it) -- adopt the declaration in this PR, or leave the module unedited." Reproduced verbatim at planning time on the session HEAD, both with this comment touch and with Task 5 Unit 1''s actual sloc -> measured rename.'
  fix_if: Exit 1 with an empty hit list means either the module already declares (the adoption already landed -- STOP and re-derive) or origin/main is unreachable in the clone so get_changed_files() saw nothing; fetch origin/main in the clone and re-run. Never satisfy this step by editing the guard.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the presence of the very violation this plan removes, and shells out to git clone. It holds only on pre-change code, so graduating it would land a guard that fails permanently the moment the change merges.
- step: 2
  phase: pre-deploy
  action: GREEN -- the three declaration tests pass with the adoption in place, pinning the exact examined count and unit on the pass path, on the failure path, and on an empty tree.
  command: bin/venv-python -m pytest tests/checks/sloc/test_sloc_limits.py::TestSlocLimitsAccountingDeclaration -q
  expected: 3 passed. The pass-path test asserts kind "examined", unit "gated_python_files" and count 2 over a hand-built tree of two gated modules plus one excluded __init__.py; the failure-path test asserts one entry in failed AND count 1; the empty-tree test asserts count 0 and derive_status() == "vacuous". All three measured red-then-green at planning time in a scratch clone.
  fix_if: A None declaration means the terminal examined() call is missing or unreachable; a wrong count means `scanned` is incremented after the under-limit `continue` instead of before it; a wrong unit means the unit string drifted from "gated_python_files". Fix the module, never the assertion (Decision 181).
  hermetic: true
  graduation: graduate
  graduation_check_id: sloc-limits-declares-examined-on-every-path
- step: 3
  phase: pre-deploy
  action: GREEN -- the touch-it-fix-it consequence is pinned hermetically. The test drives validate_check_accounting over a tmp_path tree holding a real copy of the module source, a roster WITHOUT validate_sloc_limits, and the module path in the patched changed-file set.
  command: bin/venv-python -m pytest tests/checks/sloc/test_sloc_limits.py::TestSlocLimitsOffAccountingRoster -q
  expected: '1 passed -- failed is empty and no printed violation line names validate_sloc_limits. Measured red-then-green at planning time in a scratch clone: with the declaration stripped from the copied source the same fixture produces "validate_sloc_limits declares no examined()/skipped() outcome and is not in config/check_accounting_baseline.yaml", so the test is genuinely failing-first.'
  fix_if: A clause-(a) violation in the output means the copied module source does not declare -- re-copy from the edited module. A ValueError out of _check_module_rel_path means the copy was not written under the patched ROOT at the module's real repo-relative path.
