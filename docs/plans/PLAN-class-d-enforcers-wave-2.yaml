    graduation: graduate
    graduation_check_id: none-grandfathered-kind-unrepresentable
  - step: 6
    phase: pre-deploy
    action: >-
      RED-PATH PROOF -- perturb real contracts on throwaway copies and observe the checks FAIL. Two
      shapes, both on tmp copies, never mutating the working tree. (a) FAIL-CLOSED: delete each
      top-level block a check reads; a check that iterates an absent target and passes is vacuous.
      (b) SEMANTIC DRIFT: mutate a pinned_lines ceiling in composite-action-shape.yaml and drop a
      value from iam-simulate-fixture.yaml's expected_decision_values, and confirm each check fails.
      (c) NESTED LEGS: perturb two keys that top-level block deletion structurally cannot isolate.
    command: |
      bin/venv-python - <<'EOF'
      import importlib, pathlib, shutil, tempfile, yaml
      # Every top-level block each check reads -- a single-block mutation would leave the other
      # assertion legs' vacuity unproven.
      PAIRS = [
          ("composite_action_shape_rosters", "composite-action-shape.yaml",
           ["known_r1_violators", "baseline_file", "known_r1_conformant", "closing_instance"]),
          ("iam_simulate_fixture_shape", "iam-simulate-fixture.yaml",
           ["expected_decision_values", "placeholders", "principal", "triples"]),
      ]
      REAL = pathlib.Path("docs/contracts")

      def check(suffix):
          mod = importlib.import_module("scripts.checks.contracts.validate_" + suffix)
          return getattr(mod, "validate_" + suffix)

      def copy_tree():
          dest = pathlib.Path(tempfile.mkdtemp()) / "contracts"
          shutil.copytree(REAL, dest)
          return dest

      for suffix, filename, blocks in PAIRS:
          fn = check(suffix)
          green = []
          fn(green, contracts_dir=REAL)
          assert green == [], (suffix, "green path must be clean", green)
          for block in blocks:
              tmp = copy_tree()
              path = tmp / filename
              doc = yaml.safe_load(path.read_text())
              assert block in doc, (filename, "expected top-level block absent from the real contract", block)
              del doc[block]
              path.write_text(yaml.safe_dump(doc))
              red = []
              fn(red, contracts_dir=tmp)
              assert red, (suffix, block, "VACUOUS -- passed with this assertion target absent")
              print("fail-closed OK", suffix, block)

      # NESTED perturbations -- two assertion legs that top-level block deletion cannot reach.
      # section_allowlist lives UNDER baseline_file, so deleting baseline_file kills the path leg
      # and the allowlist leg together and would let a check that never reads section_allowlist pass
      # every leg above. The per-triple decision leg is likewise masked: deleting
      # expected_decision_values or triples trips an earlier leg first.
      NESTED = [
          ("composite_action_shape_rosters", "composite-action-shape.yaml",
           lambda d: d["baseline_file"].pop("section_allowlist"), "section_allowlist"),
          # NOT a per-triple expected_decision mutation: build_triples (iam_simulate.py:104-106) already
          # raises on an unknown decision, so that perturbation trips leg 1 and proves nothing about a
          # later leg. Renaming a declared placeholder KEY leaves legs 1 and 2 green (the runner
          # substitutes ${account_id} regardless of what the contract declares) and isolates the
          # declared-vs-substituted parity leg, which no top-level deletion reaches.
          ("iam_simulate_fixture_shape", "iam-simulate-fixture.yaml",
           lambda d: d.__setitem__("placeholders", {"acct_id": d["placeholders"]["account_id"],
                                                    "region": d["placeholders"]["region"]}),
           "placeholders key parity"),
      ]
      for suffix, filename, mutate, label in NESTED:
          tmp = copy_tree()
          path = tmp / filename
          doc = yaml.safe_load(path.read_text())
          mutate(doc)
          path.write_text(yaml.safe_dump(doc))
          red = []
          check(suffix)(red, contracts_dir=tmp)
          assert red, (suffix, label, "VACUOUS -- nested assertion leg is never evaluated")
          print("nested-leg OK", suffix, label)

      tmp = copy_tree()
      path = tmp / "composite-action-shape.yaml"
      doc = yaml.safe_load(path.read_text())
      doc["known_r1_violators"][0]["pinned_lines"] += 1
      path.write_text(yaml.safe_dump(doc))
      drift = []
      check("composite_action_shape_rosters")(drift, contracts_dir=tmp)
      assert drift, "pinned_lines drift did not fail the roster parity check"
      print("semantic-drift OK", drift[0])

      tmp = copy_tree()
      path = tmp / "iam-simulate-fixture.yaml"
      doc = yaml.safe_load(path.read_text())
      doc["expected_decision_values"].remove("explicitDeny")
      path.write_text(yaml.safe_dump(doc))
      drift = []
      check("iam_simulate_fixture_shape")(drift, contracts_dir=tmp)
      assert drift, "expected_decision_values drift did not fail the fixture check"
      print("semantic-drift OK", drift[0])
      EOF
    expected: >-
      Eight 'fail-closed OK <name> <block>' lines (two checks, four blocks each), then two
      'nested-leg OK' lines, then two 'semantic-drift OK' lines naming the disagreeing surface. Exit 0.
    fix_if: >-
      'VACUOUS -- nested assertion leg is never evaluated' means the check reads its parent block but
      never the nested key -- the failure top-level deletion structurally cannot surface.
      'VACUOUS -- passed with this assertion target absent' means that check does not fail closed;
      make it append a failure when its target block or key is missing, empty or the wrong type. An
      empty list on a RED leg is the shared signature of two distinct faults -- a check that iterates
      nothing and passes, OR a check that ignores contracts_dir and silently re-reads the real tree;
      rule out the second before assuming the first. (An empty GREEN list is the pass condition, not
      a symptom.) NOTE Decision 159's 100%-coverage floor does NOT discriminate here -- a loop over an
      absent or empty collection executes every line while asserting nothing, which is exactly what
      leg (a) exists to catch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is the one-time live demonstration against the real tree; the durable form is each mirror
      test's own absent-target and drift red paths (step 7), and graduating both would register the
      same discrimination twice -- the identical reasoning wave 1 applied to its own step 6.
