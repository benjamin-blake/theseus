schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "class-d-enforcers-wave-2"
intent: >-
  Close rec-3059 by converting the last two Class D contracts carrying the never-resolving
  evaluator.none_grandfathered form to resolving {check: <name>} evaluators, then DELETE the
  grandfather form from the schema so it is unrepresentable rather than merely unused, and remove
  the referent-less evaluator_none_grandfathered_max ratchet pin. Advances the platform's
  verification-is-recursively-improvable thesis to its terminus for this debt class: a rule with no
  evaluator is not a rule, and the form that permitted such rules stops existing.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-class-d-enforcers-wave-2.yaml
phase: >-
  rec-3059 (Critical, open) second and FINAL enforcer wave, completing the first wave landed in #905
  (PLAN-class-d-contract-enforcers). Parent surface T2.56 (Normative / contract / ADR layering) --
  this plan closes NONE of T2.56's exit criteria (both concern instruction-layer shrinkage and
  DECISIONS-as-retrieved-ADR-log), so no closes_criteria is declared. Soft-warn exception category:
  ad_hoc_rec.
scope:
  - file: scripts/checks/contracts/validate_composite_action_shape_rosters.py
    action: Create
    purpose: >-
      Assert composite-action-shape.yaml's declared registries equal the live guard/config surfaces:
      known_r1_violators keys+pinned_lines vs _R1_KNOWN_VIOLATORS and the baseline r1: section;
      baseline_file.path vs _BASELINE_REL_PATH; section_allowlist.sections vs
      _KNOWN_BASELINE_SECTIONS; and that known_r1_conformant[].delegate / closing_instance.script
      resolve on disk.
  - file: scripts/checks/contracts/validate_iam_simulate_fixture_shape.py
    action: Create
    purpose: >-
      Run scripts/ci/iam_simulate.py's PURE (AWS-free) validation layer -- load_fixture,
      build_triples, principal_arn -- against iam-simulate-fixture.yaml with dummy non-numeric
      placeholders, plus parity legs the existing tests lack: expected_decision_values vs
      VALID_DECISIONS, declared placeholders vs the tokens the runner substitutes. It does NOT assert
      "every triple's expected_decision is drawn from the declared list": given the first two legs
      (build_triples already rejects any value outside VALID_DECISIONS, and leg 2 pins
      expected_decision_values TO VALID_DECISIONS) that leg is TAUTOLOGICAL -- it could never fail
      independently, and must not be added. Leg 2 is still genuinely exercised, by VP step 6's
      expected_decision_values drift perturbation.
  - file: tests/checks/contracts/test_validate_composite_action_shape_rosters.py
    action: Create
    purpose: >-
      Mirror test (Decision 131) -- green, roster-drift red, pinned_lines-drift red, allowlist-drift
      red, ABSENT/EMPTY-target red, missing-file and malformed-YAML red.
  - file: tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    action: Create
    purpose: >-
      Mirror test -- green, expected_decision_values-drift red, undeclared-placeholder red,
      malformed-triple red, ABSENT/EMPTY-target red, missing-file and malformed-YAML red.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      Two Entry literals (bare string module=/attr=), each pre=True with pre_globs=None and
      full_segment="full_after_lint" (Decision 169).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Two function_to_category rows, both schema_drift -- required by validate_ci_rca_taxonomy check
      1b (every registered check must resolve to a category).
  - file: docs/contracts/composite-action-shape.yaml
    action: Modify
    purpose: >-
      Flip evaluator to {check: validate_composite_action_shape_rosters}; amendment_log entry
      RECORDING THE DELIBERATE DEVIATION from the erased route (see constraints) and the resulting
      three-way parity set.
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Modify
    purpose: >-
      Flip evaluator to {check: validate_iam_simulate_fixture_shape}; amendment_log entry. ALSO correct
      the header prose, which goes false on this flip: lines 5-10 assert "It is deliberately NOT a
      validate.py check" and lines 18-23 say "grandfathered with evaluator.none_grandfathered ... see
      the enforcement_route", naming a block this flip deletes. Comment edits change neither the parsed
      dict (no amendment obligation) nor effective_lines (non-comment), so this correction is free on
      both the amendment and the 603-line axes -- but unlisted it would ship a self-contradicting
      contract.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Retire the none_grandfathered kind from evaluator_kinds, the grandfather_only_forms subsection,
      change_detection.evaluator_kind_change (lines 196-199 -- declares the deleted rule and
      cross-references a deleted sub-key), subject_namespace.non_seedable_exception (records
      exit-criteria-ledger's route in the deleted model's field shape), the census field, the
      pin_binding wording and the ratchet pin. Both prose residues are invisible to VP step 9's `bad`
      leg, which reads only contract.evaluator. Add the
      RETIREMENT GOVERNANCE NOTE (what was retired, why, reversal path) and an amendment_log entry.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      The contract-population route description names "the grandfather-only forms (status: active,
