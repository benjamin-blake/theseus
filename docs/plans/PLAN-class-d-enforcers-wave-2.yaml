constraints:
  - >-
    NO NUMBERED DECISION IS MINTED, and this is a deliberate call the human directed, the
    decision-scout verified, and the plan-critique gate contested -- so the argument is stated in
    full rather than asserted. (i) DELETION VACATES, IT DOES NOT CONTRADICT. Decision 168 clause 3's
    two prohibitions ("a new file may never declare it", "may never regress to it") stay trivially
    true once the kind cannot be declared at all, and "absent -> none_grandfathered is permitted" is a
    PERMISSION, not a guarantee that the form remains declarable -- vacating a permission contradicts
    nothing, and nothing in clause 3 commits to the form's continued existence. Decision 149's
    never-remove-headers rule bars number retirement and destructive merges, not clause vacation, and
    Decision 168 reversal condition (a) ("extend the union, never bypass the resolution bar") is not
    violated: removing a NEVER-RESOLVING kind strictly strengthens the bar. Decision 168 clause 4 pins
    only grandfathered_max, which this plan leaves at 17. (ii) THE UNION IS CONTRACT-RESIDENT BY
    DECISION 168's OWN WORDS: "the full shape grammar, evaluator-kind union, and change-detection
    rules live in docs/contracts/contract-population.yaml per Decision 86/127 routing, not restated
    here" -- so narrowing the union from three kinds to two is a field-semantics change, which
    decision-entry.yaml's significance.routing.field_semantics sends to a governance note in the
    OWNING contract and explicitly "Never a numbered Decision". (iii) THE RETIREMENT HALF IS NOT A
    SEPARABLE COMMITMENT, and this is the point the critique gate pressed. The deleted model, the
    removed pin and the retired graduated row are not three additional architectural commitments
    alongside the union narrowing -- they are its ENFORCEMENT COUNTERPARTS, which Decision 86/127
    collocation requires to move WITH the semantics they enforce. Routing a semantics change to a
    contract note while routing its own enforcement deletion to a Decision header would institute
    exactly the two-surface split that collocation rule exists to prevent, and would set a precedent
    that every future field-semantics narrowing mints a header for its own cleanup. Decision 150's bar
    ("a durable architectural commitment with reversal-relevant consequences") is met on the
    reversal-relevance limb by the MECHANISM the field_semantics row prescribes -- a governance note
    carrying the reversal path -- not by a header. Precedent: contract-population.yaml's own pins were
    installed and adjusted by contract edits plus amendment entries throughout migration-step-3 and
    wave 1, never by a per-change Decision. (iv) Do NOT cite Decision 160 point 3 in support of this:
    its "the amendment is stated only here" presupposes a new Decision as the amendment's home, so it
    argues for the opposite conclusion. An earlier draft of this plan cited it; the citation was wrong
    and is deliberately absent. (v) THE THIRD OPTION IS THE ONE TAKEN. The earlier binary framing
    (mint a Decision, or record only in the contracts) was a false dichotomy against a capability this
    repo already ratified: decision-entry.yaml's `amendment_forms` sanctions dated, NUMBER-FREE in-place
    annotation (`trailing_bracket` "[Amendment DATE: ...]", `blockquote_update` "> **Update (DATE):**
    ..."). Decision 168's body is the surface a retrieval-based reader loads, and neither contract
    governance note is reachable FROM it -- so the annotation is what actually closes the staleness gap.
    It mints no number, engages no Decision 150 bar, declares no `amends` edge, conflicts with no
    Decision 149 rule, and leaves validate_decision_currency's `amended` derivation untouched. The
    per-entry 6,144-byte authoring cap does NOT apply: _per_entry_cap_failures measures only entries
    ABSENT from the baseline, and Decision 168 is baseline-present (measured 5,650 bytes), so the
    annotation needs no trimming to fit. TWO AUTHORING HAZARDS for it:
    validate_supersession_annotations._EDGE_RE matches "amends Decision N" ANYWHERE in a block, so the
    annotation must not contain that phrase (write "clause 3's none_grandfathered half is inoperative",
    never "amends Decision 168"); and per amendment_forms.general_rule a blockquote-bold line TERMINATES
    a typed id-list field, so the annotation must be appended AFTER the **Related:** line, never
    inserted mid-entry. THE RECORD IS THEREFORE WRITTEN DOWN THREE PLACES: the
    Decision 168 annotation, plus governance notes in BOTH
    contract-population.yaml (Class D, amendment entry required) and verification-registry.yaml (Class
    A, top-level governance_notes key, no amendment entry required), each naming what was retired,
    why, and the reversal path (re-add the EnforcementRoute model and the EvaluatorSpec field).
  - >-
    DELIBERATE DEVIATION from composite-action-shape.yaml's own recorded enforcement route, which
    says to have the guard read known_r1_violators from the contract instead of its hardcoded
    _R1_KNOWN_VIOLATORS copy. Decision 162's R1 MEMBERSHIP clause makes that deviation MANDATORY, not
    optional: "a config-file edit alone can never admit a third violator; growing the set requires
    editing the guard's own source in a reviewed change." Collapsing to one contract-side copy would
    demote a reviewed-code-change bar to a YAML doc edit. Build the parity check instead and record
    the deviation in the contract's amendment_log entry -- EvaluatorSpec is exactly-one-kind, so the
    flip DELETES the route text and without the note the deviation leaves no trace (the same
    precedent wave 1 set for ci-rca-lifecycle.yaml's narrowing).
  - >-
    ACCEPTED COST of that deviation, stated precisely because an earlier draft overstated it: the
    plan does NOT create a third copy. composite-action-shape.yaml already declares
    known_r1_violators (keys plus pinned_lines 13/9) today, UNASSERTED -- the three-surface lockstep
    cost is already latent, and this plan converts an existing unverified copy into a machine-asserted
    parity set, which is what makes the flipped evaluator non-vacuous. What genuinely changes is that
    a future extraction PR now FAILS CI if it misses one of the three, instead of silently drifting.
    Verified at planning time: all three surfaces agree today, so the check lands green. State this in
    the amendment_log entry as the price of Decision 162's admission bar.
    Note the two constants live in DIFFERENT modules -- _R1_KNOWN_VIOLATORS in
    validate_composite_action_shell_bodies.py, _KNOWN_BASELINE_SECTIONS in _workflow_shell_bodies.py. Decision 165 does NOT bear against it -- it
    consolidates copies of a guard MECHANISM, not data rosters, and its drift concern is precisely
    what the machine-asserted parity closes. Do NOT "simplify" by deleting a copy.
  - >-
    Decision 168 evaluator grammar (the load-bearing bar): a {check: name} evaluator resolves ONLY if
    name is in registry.all_checks() AND in pre_sequence()/full_sequence(), AND the check's own module
    -- or a one-hop scripts/ import -- contains the contract BASENAME as an exact string literal, or as
    the final /-delimited segment of a WHITESPACE-FREE path-shaped literal, in EXECUTABLE context.
    Each new module must therefore carry its OWN basename literal in-module. Do NOT rely on
    scripts/checks/iam_tf/_write_companions.py's prose annotation ending in
    "...iam-simulate-fixture.yaml" -- the matcher-trap guard rejects whitespace-containing literals,
    and that string is the live instance the guard was written against.
  - >-
    Decision 104 (one concern per file, retained by Decision 169): ONE registered check per module.
    Both new checks get their own module under scripts/checks/contracts/, matching wave 1.
  - >-
    Decision 169: register via bare-string-literal Entry values in scripts/checks/contracts/_manifest.py.
    NEVER edit scripts/validate.py. module=/attr= must be plain ast.Constant strings -- an f-string or
    computed value silently severs the dependency_graph driver->check edge.
  - >-
    Decision 170: neither new check is in config/check_accounting_baseline.yaml, and that file's
    _BASELINE_SEED frozen constant means a config edit alone cannot grandfather them. Both modules
    MUST call registry.examined(n, unit=...) on a real count and registry.skipped(reason) on every
    early return -- a bare early return fails validate_check_accounting.
  - >-
    Decision 159 (unbaselined files keep 100%): no scripts/checks/contracts/* file carries a
    config/coverage_baseline.yaml entry, so both new modules must land at 100% LINE COVERAGE. The
    mirror tests must exercise every red path -- missing file, malformed YAML, absent/empty target and
    genuine drift. Do not add a coverage_baseline.yaml entry to escape this.
  - >-
    Decision 161 (mypy downward ratchet): an unregistered file's implicit baseline is 0 and no
    contracts-domain file is registered, so both modules must be mypy-clean. validate_mypy_ratchet is
    FULL-TIER ONLY -- a miss escapes --pre and reds main post-merge as a critical ci_rca rec, which is
    why VP step 11 runs the full tier before handoff.
  - >-
    Class D amendment rule: any parsed-content change to a Class D file REQUIRES a new amendment_log[]
    entry or validate_contract_drift fails. That is FOUR files here -- composite-action-shape.yaml,
    iam-simulate-fixture.yaml, contract-population.yaml and file-router.yaml. change_class must come
    from the closed 8-value vocabulary; use governance_note_add for the evaluator flips and the
    retirement note, and accepted_values_narrow for contract-population.yaml's evaluator-kind union
    narrowing. docs/contracts/verification-registry.yaml is the FIFTH contract touched but is CLASS A
    (ratified, contract_version 4) -- verify this before assuming, because an earlier draft of this
    plan miscounted it as Class D. Its ritual amendment trigger (check_amendment_for_diff) fires only
    on contract.description or a field's description/semantics, so adding the new top-level
    `governance_notes:` key needs no amendment_log entry. Do NOT put the note in contract.description:
    that WOULD trigger the ritual rule, and _amendment_entry_consistent rejects governance_note_add
    paired with semantic_break: false, so the prescribed change_class would red the gate.
  - >-
    Ratchet pins are equality-bound to the live census in BOTH directions, and the two SURVIVORS do
    NOT move: neither contract's status changes, so grandfathered stays 17 (16 status:active Class D +
    1 unshaped, exit-criteria-ledger.yaml) and status_active stays 16. Do NOT ratify either contract
    -- adding an evaluator never requires ratification. Re-derive both numbers from a live gate run
    before touching a pin; a Class D file landing on main between planning and implement moves them.
  - >-
    THREE graduated verification_registry rows are affected and each needs an EXPLICIT disposition --
    a census of one is wrong and was the first draft's error. (i) retire
    enforcement-route-required-on-none-grandfathered (guard_symbol EnforcementRoute, node_id in
    tests/test_contracts.py -- both deleted); (ii) re-author
    contracts-grandfather-only-forms-both-directions, whose node_id names
    test_absent_to_none_grandfathered_on_baseline_present_file_is_permitted, a test this plan deletes;
    (iii) re-author contract-census-declared-includes-env-taxonomy, whose command executes `assert
    meta.evaluator.none_grandfathered is None` and would raise AttributeError. Removal is not gated
    (validate_verification_registry runs differential admission on ADDED entries only), so the honest
    form is the recorded governance note, not a waiver.
  - >-
    Do NOT frame the row removal as exercising a retirement lifecycle. Decision 166 point 6's valve is
    the CD.29 mark-then-drop archival lifecycle, which is an UNRATIFIED candidate decision conditioned
    on the 6,000-line ceiling firing (registry.yaml is at 5,655 post-rebase). This is an ordinary removal recorded
    as a governance note; claiming the lifecycle would pre-empt CD.29.
  - >-
    Decision 101 (PUBLIC repo): the fixture check and its mirror test must use NON-NUMERIC dummy
    placeholders (e.g. "account-id-placeholder" / "region-placeholder"). A literal 12-digit
    account-id-shaped string would trip the pre-commit never-commit hook. Verified at planning time:
    non-numeric dummies satisfy both the unresolved-placeholder regex and the no-wildcard rule.
  - >-
    Both new checks must accept an injectable `contracts_dir: Path | None = None` (mirroring
    validate_contract_drift and both wave-1 precedents) and honour it for ALL contract reads, so VP
    step 6's red-path proof perturbs a temporary copy and never the working tree.
  - >-
    Both Entries use pre_globs=None (ungated, always runs in --pre), matching every existing pre=True
    entry in scripts/checks/contracts/_manifest.py. Do NOT narrow to globs: each assertion has TWO
    sides, so a glob set must name the contract AND every consumer path, and an incomplete glob is a
    SILENT --pre skip -- the same vacuous-pass family this plan exists to close. Measured at planning
    time, each check costs ~50ms (a YAML parse plus one light import), negligible against the fast
    tier's budget, so ungated is the correct trade despite rec-3117's open budget-breach rec.
  - >-
    FAIL CLOSED on a missing assertion target. Every check must append a failure when the block or key
    it reads is absent, empty or not the expected type -- never iterate nothing and pass. This is the
    vacuity shape Decision 159's 100%-line-coverage floor CANNOT catch (a loop over an empty
    collection executes every line while asserting nothing), so each mirror test carries an explicit
    absent/empty target red path and VP step 6 leg (a) proves it live across all eight blocks.
  - >-
    The iam-simulate check must NEVER touch AWS, invoke boto3, or assert a live simulate decision, and
    must never assert condition-key or identity/boundary-intersection semantics -- those stay a
    POST-APPLY concern owned by scripts/ci/iam_simulate.py's runner. That boundary is exactly what
    dissolves the contract's recorded blocker ("wiring it into --pre would red the very PR that fixes a
    legitimate gap"): a structural check cannot red a gap-fixing PR. Record this in the check's own
    docstring so a later reader does not "strengthen" it into the live assertion the route warned off.
  - >-
    The squash-merge body carries `Resolves: rec-3059, rec-3101`. rec-3059 is listed HERE (wave 1
    deliberately withheld it because wave-2 files remained); this plan completes it. rec-3103 is
    MOOTED, not resolved -- its six duplicated EnforcementRoute fixtures vanish with the model; close
    it separately with that as the resolution rather than via the trailer.
  - No rescue agents or workaround loops (Decision 55).
  - Only modify files listed in the Scope table; out-of-scope findings become recommendations, not inline fixes.
