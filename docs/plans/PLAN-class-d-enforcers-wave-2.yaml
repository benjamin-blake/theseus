  - file: tests/checks/contracts/validate_contract_drift/test_grandfather_only.py
    action: Modify
    purpose: >-
      FOUR of the five TestGrandfatherOnly tests construct the retired kind (lines 36, 49, 71, 100),
      not two -- verify by grep before editing, and DISPOSITION ALL FOUR. Delete line 49 (kind-change),
      line 71 (arrival-permission), and the whole TestEnforcementRoute class. ALSO DELETE line 36,
      test_new_file_declaring_none_grandfathered_fails: it exercises the new-file prohibition branch
