      new amendment_log[] entry.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Add the retirement record to the top-level `governance_notes:` key (a declared
      ContractDocument field, currently absent from this file) naming the one retired and two
      re-authored graduated rows, why, and the reversal path. NOTE this file is Class A (ratified,
      contract_version 4), NOT Class D -- the Class D amendment rule does not apply to it, and adding
      a new top-level key does not trip the ritual amendment trigger, which fires only on
      contract.description or a field's description/semantics.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append a dated, number-free annotation to Decision 168's body in one of the RATIFIED
