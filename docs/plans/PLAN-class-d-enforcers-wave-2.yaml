  - file: tests/checks/contracts/validate_contract_drift/test_ratchet.py
    action: Modify
    purpose: Two-pin fixtures; add rec-3101's skipped-contract cascade-suppression red path.
  - file: tests/checks/contracts/validate_contract_drift/test_real_population.py
    action: Modify
