bundled_recommendations:
  - rec-3059
  - rec-3101
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_contract_drift passes against the real tree and its census line reports
    grandfathered=17, status_active=16, skipped=0 and NO evaluator_none_grandfathered field at all.
  - >-
    contract-population.yaml declares exactly two ratchet pins (grandfathered_max: 17,
    status_active_max: 16), both equal to their live census buckets; _ratchet.PIN_KEYS contains
    exactly those two keys.
  - >-
    evaluator.none_grandfathered is UNREPRESENTABLE: EvaluatorSpec.model_validate({"none_grandfathered":
    <anything>}) raises a pydantic ValidationError via extra="forbid", EnforcementRoute is no longer
    importable from scripts.contracts_schema, and _population.check_evaluator_kind_change no longer exists.
  - >-
    Both new check names are in registry.all_checks(), in pre_sequence()/full_sequence(), and carry a
    config/ci_rca_taxonomy.yaml function_to_category row of schema_drift.
  - >-
    Both contracts' evaluators resolve under contract-population.yaml's evaluator_kinds.check grammar
    (_population.resolve_evaluator returns True), i.e. each check module contains its own contract
    basename as an executable-context string literal.
  - >-
    Both new checks discriminate: deleting ANY top-level block each reads makes it FAIL (fail-closed),
    and a semantic drift in either direction makes it FAIL -- both proven live in VP step 6 and
    guarded durably by red-path tests in each mirror test.
  - >-
    All three affected graduated registry rows carry an explicit, executed disposition: one retired,
    two re-authored and passing; and no registry row references EnforcementRoute or
    evaluator.none_grandfathered.
  - >-
    tests/checks/contracts/validate_contract_drift/test_real_population.py asserts UNCONDITIONALLY
    that every seeded contract's evaluator resolves -- no routed-debt branch survives.
  - Both new modules land at 100% line coverage and are mypy-clean under the full tier.
  - >-
    docs/contracts/iam-simulate-fixture.yaml's config/structural_size_budgets.yaml pin EQUALS its
    measured effective-line count with no slack (predicted 603 on both sides), and the entry's
    dec-168 marker text is unchanged so iam-simulate-budget-marker-recited stays green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm the two ci_rca_taxonomy rows exist (leg A) and the two check names are registered and
      tier-sequenced (leg B).
    command: bin/venv-python -c 'import yaml; m=yaml.safe_load(open("config/ci_rca_taxonomy.yaml"))["function_to_category"]; N=["validate_composite_action_shape_rosters","validate_iam_simulate_fixture_shape"]; bad=[n for n in N if m.get(n)!="schema_drift"]; assert not bad, bad; print("OK two taxonomy rows")' && bin/venv-python -c 'from scripts.checks import registry; N=["validate_composite_action_shape_rosters","validate_iam_simulate_fixture_shape"]; a=registry.all_checks(); s={x.name for x in [*registry.pre_sequence(),*registry.full_sequence()]}; bad=[(n, n in a, n in s) for n in N if not (n in a and n in s)]; assert not bad, bad; print("OK two registered and sequenced")'
    expected: Prints 'OK two taxonomy rows' then 'OK two registered and sequenced'; exit 0.
    fix_if: >-
      Leg A failing with None means the config/ci_rca_taxonomy.yaml row is absent or misspelled; a
      wrong value means it is not schema_drift. Leg B failing on the first flag means the
      @register decoration or the Entry module path is wrong; on the second, the Entry lacks
      pre=True and full_segment.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already enforced by two standing checks -- validate_ci_rca_taxonomy check 1b requires a
      function_to_category row for every registered check, and validate_check_manifests enforces the
      Entry grammar and graph-node resolution. Graduating this would be a third copy of the same
      invariant, exactly as waived in wave 1.
  - step: 2
    phase: pre-deploy
    action: Confirm both contracts' evaluators genuinely resolve under the Decision 168 check grammar.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.contracts import _population; from scripts.contracts import load_contract_meta; M={'composite-action-shape.yaml':'validate_composite_action_shape_rosters','iam-simulate-fixture.yaml':'validate_iam_simulate_fixture_shape'}; R=Path('.').resolve(); bad=[]; [bad.append((n,c,load_contract_meta(Path('docs/contracts')/n).evaluator.check,_population.resolve_evaluator(n,load_contract_meta(Path('docs/contracts')/n).evaluator,root=R))) for n,c in M.items() if not (load_contract_meta(Path('docs/contracts')/n).evaluator.check==c and _population.resolve_evaluator(n,load_contract_meta(Path('docs/contracts')/n).evaluator,root=R)[0])]; assert not bad, bad; print('OK: both evaluators resolve')"
    expected: "Prints 'OK: both evaluators resolve'; exit 0."
    fix_if: >-
      'neither <module> nor its one-hop scripts/ imports contain <basename>' means the check module
      lacks its contract basename as an executable-context string literal -- add it as a module-level
      constant that is genuinely READ. NOTE the MATCHER TRAP GUARD: a whitespace-containing
      path-shaped literal is REJECTED even when its final segment matches, which is precisely why
      scripts/checks/iam_tf/_write_companions.py's prose annotation ending in
      "...iam-simulate-fixture.yaml" does not certify -- do not rely on it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift already fails any Class D file whose declared evaluator does not
      resolve; a graduated copy would assert the same thing the gate under test already asserts.
  - step: 3
    phase: pre-deploy
    action: >-
      Run the population gate against the real tree; assert the surviving pins equal their buckets AND
      that the retired census field is GONE from the rendered line (absence, not a zero value).
    command: >-
      bin/venv-python -c "import io,contextlib; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; b=io.StringIO(); ctx=contextlib.redirect_stdout(b); ctx.__enter__(); v(f); ctx.__exit__(None,None,None); o=b.getvalue(); assert f==[], f; c=[l for l in o.splitlines() if 'Census:' in l][0]; print(c); assert ' grandfathered=17' in c and 'status_active=16' in c and 'skipped=0' in c, c; assert 'evaluator_none_grandfathered' not in c, 'retired census field still rendered'"
    expected: >-
      Census line prints with grandfathered=17, status_active=16, skipped=0, carries NO
      evaluator_none_grandfathered field, and the failure list is empty.
    fix_if: >-
      'does not equal the live census bucket' means a surviving pin drifted -- pins are
      equality-bound in BOTH directions. A non-zero skipped count means a contract failed shape,
      schema or evaluator resolution and was excluded from its bucket (and with rec-3101's fix the
      pin cascade is now suppressed, so the skip is the only message: fix the skipped contract, never
      lower the pin). 'retired census field still rendered' means Census.render() was not updated.
      NOTE the 17/16 values are re-derivable, not assumed -- neither contract's status changes, so a
      different live number means main moved under this branch; re-derive before editing a pin.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The durable half (every pin EQUALS its live census bucket) is already enforced inside
      validate_contract_drift, and the specific values 17/16 are a function of the live population --
      pinning today's numbers into the registry would create a check that any future Class D landing
      must edit. The field-absence half IS graduated, via step 5's unrepresentability row.
  - step: 4
    phase: pre-deploy
    action: Green path -- both new checks pass against the real tree.
    command: >-
      bin/venv-python -c "import importlib; N=['composite_action_shape_rosters','iam_simulate_fixture_shape']; bad={}; [bad.setdefault(n,f) for n in N for f in [[]] if (getattr(importlib.import_module('scripts.checks.contracts.validate_'+n),'validate_'+n)(f), f)[1]]; assert not bad, bad; print('OK: both checks green')"
    expected: "Prints 'OK: both checks green'; exit 0."
    fix_if: >-
      A non-empty failure list names the contract and the disagreeing surface. Decide direction
      deliberately -- for the composite roster the CODE (the frozen _R1_KNOWN_VIOLATORS constant)
      wins by Decision 162's membership clause; for the fixture, confirm which side is stale before
      editing either.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both checks are themselves registered and dispatched in the --pre and full tiers, so they
      already run as standing guards. A graduated step that merely invokes them would be a second
      dispatch path for the same assertions.
  - step: 5
    phase: pre-deploy
    action: >-
      UNREPRESENTABILITY PROOF -- the core claim of this plan. The grandfather kind cannot be declared,
      its model is gone, its kind-change rule is gone, its census field is gone, and PIN_KEYS carries
      exactly the two survivors.
    command: >-
      bin/venv-python -m pytest tests/test_contracts_schema.py::TestEvaluatorSpec::test_none_grandfathered_is_not_a_declarable_kind -q && bin/venv-python -c "import dataclasses; from scripts.checks.contracts import _population, _ratchet; import scripts.contracts_schema as cs; assert not hasattr(cs, 'EnforcementRoute'), 'EnforcementRoute still exported'; assert 'none_grandfathered' not in cs.EvaluatorSpec.model_fields, cs.EvaluatorSpec.model_fields.keys(); assert not hasattr(_population, 'check_evaluator_kind_change'), 'kind-change rule survived'; assert 'evaluator_none_grandfathered' not in {f.name for f in dataclasses.fields(_population.Census)}, 'census field survived'; assert _ratchet.PIN_KEYS == ('grandfathered_max','status_active_max'), _ratchet.PIN_KEYS; print('OK -- none_grandfathered is unrepresentable')"
    expected: >-
      The pytest node passes, then 'OK -- none_grandfathered is unrepresentable'; exit 0.
    fix_if: >-
      'EnforcementRoute still exported' or a surviving model field means the schema deletion is
      incomplete -- EvaluatorSpec's extra="forbid" is what makes the old form raise, so a leftover
      field silently keeps the kind declarable. A surviving check_evaluator_kind_change or census
      field means a consumer deletion was missed; grep for the symbol rather than assuming.
      CHECK_ID HONESTY: none-grandfathered-kind-unrepresentable names the FULL claim, so the graduated
      node must ASSERT the full claim -- test_none_grandfathered_is_not_a_declarable_kind must cover
      every assertion in this step's shell leg (model_validate raises, EnforcementRoute absent,
