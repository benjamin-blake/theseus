fallback_reevaluation:
  reevaluated_on: "2026-08-03"
  substrate_status: >-
    CD.27 is `state: pending` -- layer 2 is unratified, so the 12-month post-ratification maturity
    window CD.27's fallback_spec trigger is scoped to has not opened. The incumbent assignment
    (Lambda Durable Functions for the persona nodes) is unchanged by this plan. There is no
    operational maturity signal yet in either direction: no persona has landed, so the
    stability_definition_14d `unplanned_resume_rate` has no denominator, and no Lambda Durable
    Functions API-semantics regression has been observed or reported this session.
  verdict: continue_on_current_substrate
  basis: >-
    Neither driver in CD.27's fallback_spec is met (both re-read from the roadmap this session): the
    `unplanned_resume_rate` 5-percent threshold cannot be breached because the signal is not yet
    computable (zero persona-node executions), and no documented API-semantics regression exists.
    This plan forms no independent substrate judgement and changes no substrate: it edits
    docs/DECISIONS.md, docs/decisions-index.json and two pointer fields plus one intent sentence on
    tier_items T4.2 and T4.12. Its only substrate-adjacent content is Decision 164's reversal
    consequence, which records that a ROUTING reopen toward `claude -p` would eliminate
    `durable_functions` and `self_checkpointed_lambda_dynamodb` from the viable set -- an argument
    that raises the bar for abandoning the incumbent rather than lowering it, and which therefore
    cannot support a `fallback_triggered` verdict. `obligation_lapsed` is also wrong here: the
    obligation has not lapsed, it has not yet begun. The substantive layer-2 substrate verdict is
    owned by wave 5 (ESB-04), which files the comparative record CD.27's ratification requires; this
    entry deliberately does not pre-empt it.
acceptance_criteria:
  - >-
    docs/DECISIONS.md carries exactly one `## Decision 164:` header whose title, BEFORE the first
    opening parenthesis, contains all three of "LiteLLM", "claude -p" and "CLI-hosting class" -- the
    parser stores `title` as `re.sub(r"\s*\(.*?\)\s*$", "", raw_title)` (scripts/decisions_md.py:331),
    which drops everything from the FIRST parenthesis onward, so any load-bearing phrase placed after
    one is invisible to the decision-scout index. Measured on the verified prototype: stored title is
    155 chars and retains all three phrases.
  - >-
    The entry carries the three markers validate_decision_entry_conformance requires of a genuinely
    new entry (Status, Date, Decision), plus Intent, Reversal conditions and Related; `**Status:**` is
    Decided and `**Date:**` is 2026-08-03; and the optional markers appear in Decision 151 clause 1's
    narrative order -- `**Problem:**` BEFORE `**Intent:**` before `**Decision:**` (see the MARKER
    ORDER constraint). Every clause of this criterion is asserted by VP step 1, including
    `**Related:**`, which is an OPTIONAL marker no standing check covers
    (decision-entry.yaml `required_markers` is ['Status', 'Date', 'Decision']).
  - >-
    The entry's body states the routing rule as a principle (Decision 116's agentic/non-agentic split
    governs scheduled agents only and does not extend to the executor personas, notwithstanding that
    the personas satisfy 116's criterion) AND names all three distributed rationale strands the audit
    identified -- the ~$0.05/rec executor unit price, 116's own shared-Max-pool reversal condition,
    and Decision 47's lock-in lesson.
  - >-
    The entry records the reopen consequence in enough detail to be actionable: it names the
    CLI-hosting class, the two substrates that can host a session-shaped CLI outright
    (`long_running_container`, `hosted_cli_runner`) and at least the two that cannot without
    degenerating (`durable_functions` -- the CD.27 incumbent -- and `self_checkpointed_lambda_dynamodb`
    -- the ESB-02 fallback), and states that any future reopen must price that collapse explicitly.
  - >-
    The regenerated docs/decisions-index.json entry for 164 has `live: true`, `amends: [116, 122]`
    (SORTED -- build_index sorts, so the index form is not the title's [122, 116] order),
    `triage_excerpt_source: "Intent"`, a `triage_excerpt` of at most 320 characters that CONTAINS the
    phrase "CLI-hosting class", and `lambda` among its `category_tags`. All five measured on the
    verified prototype (excerpt 317 chars, untruncated).
  - >-
    Regenerating the index changes nothing else: the diff versus the origin/main baseline is exactly
    one ADDED entry, zero changed entries, zero removed entries, and an unchanged `metadata` object.
    Asserted executably by VP step 6 leg 2 (added in plan-critique round 2 -- this criterion previously
    had no executable carrier and survived only as prose in execution step 3).
  - >-
    Both Decision 122's and Decision 116's blocks carry a `[Amendment 2026-08-03:` trailer containing
    the literal "Decision 164", and neither trailer introduces a new `amends Decision N` /
    `Supersedes Decision N` relation phrase (which would manufacture a spurious supersession edge
    needing its own forward pointer).
  - >-
    validate_supersession_annotations passes with the (164, 122) edge present and discharged by
    annotation rather than by a waiver entry -- config/decision_supersession_waivers.yaml is NOT
    modified.
  - >-
    T4.2's `intent` cites Decision 164 in its LLM-transport paragraph; T4.2 carries
    `related_decisions: [116, 122, 164]` and T4.12 carries `[116, 164]`; and every decision number in
    either list resolves to a live `## Decision N:` header in docs/DECISIONS.md (there is no
    repo-wide referential guard on tier_item related_decisions today -- this plan asserts it for the
    two items it touches rather than building a repo-wide check for an XS finding).
  - >-
    Every graduated grep_count registry row whose `path` is docs/DECISIONS.md still reads its pinned
    count after this change -- all four of them, not just the one this entry could plausibly break.
    Measured on the verified prototype: `decision-125-header-present` gte 1 -> 1,
    `dec-122-ratification-header-present` eq 1 -> 1, `sloc-whole-repo-decision-130-header-present`
    gte 1 -> 1, `dec-163-header-present` eq 1 -> 1.
  - >-
    docs/DECISIONS.md stays inside both live ceilings: at most 120 `## Decision` headers and at most
    700,000 combined live+archive bytes. Re-measured on the verified prototype: 116 -> 117 headers,
    651,726 -> 659,782 combined bytes.
  - >-
    docs/decisions-index.json stays inside Decision 160 point 9's 110,000-byte pin, hard-enforced by
    tests/test_decisions_index.py::TestCommittedIndexSizePin (`assert size <= 110_000`, :413). Measured
    exactly on the verified prototype: 108,033 -> 108,906 bytes, a delta of 873 for this entry, leaving
    1,094 bytes of headroom. This criterion is DISCLOSURE, not new enforcement -- the pin guard already
    exists and this plan adds none -- but it is stated because the RUNWAY entry in context shows this
    pin, not the header ceiling, is now the first binding constraint by a factor of three.
  - >-
    tests/esb_text_fix/test_persona_routing_rationale.py passes, the whole tests/esb_text_fix package
    still passes beside it (waves 1-3 guards non-regressed), `bin/venv-python -m scripts.validate
    --pre` exits 0, and the FULL tier `bin/venv-python -m scripts.validate` exits 0 before the commit
    is made (handoff_policy.full_validation_required_before_commit, enforced by
    validate_handoff_full_tier via VP step 10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      KEYSTONE. The rationale and the reopen consequence are recorded, in the entry, as a principle
      -- not merely as a title. Reads the entry through the SHARED parser (scripts.decisions_md), so
      what is asserted is what every structural consumer sees, not what a bespoke regex sees.
      COVERAGE CLOSURE (plan-critique round 1 tightening, folded in rather than shipped past because
      this step is a GRADUATED row, so anything pinned here is durable, and because three acceptance
      criteria had no executable assertion -- which is exactly the declared-but-not-executed shape
      Decision 163 exists to close, and a plan that cites 163 must not carry it). Three additions:
      `Max x5 programmatic pool` closes AC3's third rationale strand (Decision 116's own shared-pool
      reversal condition, previously named in the AC but unpinned); `price that collapse explicitly`
      closes AC4's reopen-pricing clause; and the marker-order assertion closes AC2's ordering clause,
      making Decision 151 clause 1's convention EXECUTABLE on this plan's own artifact rather than
      only recorded as a constraint -- the discipline this plan applies to the corpus, turned on
      itself. Both new tokens were confirmed present verbatim (exactly one occurrence each) in the
      drafted body BEFORE being added, so they pin what is written rather than requiring new prose.
      ROUND 2 adds a fourth: `**Related:**`, closing the last unasserted clause of AC2. Related is an
      `optional_markers_fixed_spelling` entry, NOT one of decision-entry.yaml's three
      `required_markers` (['Status', 'Date', 'Decision'], re-read this session), so
      validate_decision_entry_conformance does not cover it and nothing else did either -- the AC named
      it and no command checked it.
      All four are non-vacuous, proven by negative probe against the spliced prototype: deleting the
      Max-x5 clause, deleting the word "explicitly", renaming `**Related:**` to `**Seealso:**`, and
      separately (a) genuinely swapping the Problem and Intent blocks and (b) removing the
      `**Problem:**` marker each fail this step. The order
      assertion uses `find` plus an explicit `>=0` check rather than `index`, so a MISSING marker
      fails with the same named AssertionError and its offsets rather than an opaque ValueError --
      both failure modes were run, not assumed.
    command: >-
      bin/venv-python -c "from scripts.decisions_md import parse_decisions_md; rows={r['decision_id']:r for r in parse_decisions_md()}; r=rows[164]; b=r['raw_block']; assert r['status']=='Decided', r['status']; assert r['decided_date']=='2026-08-03', r['decided_date']; assert r['intent'] and r['reversal_conditions'] and r['decision_text'], 'Intent/Reversal conditions/Decision marker missing'; order=[b.find(m) for m in ('**Problem:**','**Intent:**','**Decision:**')]; assert all(i>=0 for i in order) and order==sorted(order), ('marker order must be Problem -> Intent -> Decision per Decision 151 clause 1; offsets', order); missing=[t for t in ('SCHEDULED AGENTS ONLY','CLI-hosting class','long_running_container','hosted_cli_runner','self_checkpointed_lambda_dynamodb','durable_functions','0.05/rec','Max x5 programmatic pool','Decision 47','Escape-hatch preservation','price that collapse explicitly','**Related:**') if t not in b]; assert not missing, missing; assert '## Decision 122: Ratify CD.28' not in b, 'the dec-122 header literal is reproduced inside dec-164 and would double the graduated grep_count row'; t=r['title']; assert all(k in t for k in ('LiteLLM','claude -p','CLI-hosting class')), t; print('DEC164_RECORDED ok')"
    expected: >-
      Exit 0 and `DEC164_RECORDED ok` on stdout. Fails at origin/main with a KeyError on 164 (the
      entry does not exist there) -- the VF-05 differential.
    fix_if: >-
      A missing token means the drafted entry omits that half of the finding: add the missing
      rationale strand or substrate name to the Decision 164 body. `Max x5 programmatic pool` and
      `price that collapse explicitly` are the two strands whose ACs previously had no executable
      assertion -- if either is listed, the body has lost the shared-pool argument or the reopen-pricing
      obligation, and the fix is to restore that clause, never to drop the token. A marker-order
      failure prints the three offsets: a `-1` means that marker is absent (add it), and an
      out-of-order triple means the blocks need reordering to Problem -> Intent -> Decision per
      Decision 151 clause 1. A title assertion failure means a load-bearing phrase was placed after
      the first parenthesis -- move it before, since the parser truncates the stored title there. A
      `## Decision 122: Ratify CD.28` hit means the entry quotes dec-122's header verbatim -- reword
      the citation to plain "Decision 122".
    hermetic: true
    graduation: graduate
    graduation_check_id: dec-164-persona-routing-principle-recorded
  - step: 2
    phase: pre-deploy
    action: >-
      DISCOVERABILITY, asserted on the surface that actually delivers it. This is the step that
      distinguishes the chosen route from the rejected one: the decision-scout gate triages
      docs/decisions-index.json's title + triage_excerpt + category_tags, never DECISIONS.md
      wholesale, so an entry whose payload does not reach the index is not findable by the routine
      mechanism. Asserts the four index-projected properties by their measured values.
      RETIREMENT OWNER (record this alongside the registry row when graduating it): this row is the
      only one of the four that reads an INTERIM surface. Decision 160 point 13 designates the
      index-plus-targeted-reads mechanism as interim and assigns T1.5 c1 ownership of replacing
      decision-scout's Phase 1 step 1 with a queried portal/tool call. When that swap lands,
      docs/decisions-index.json stops being the triage surface and this row becomes either a
      maintenance obligation or a source of main-redness on the T1.5 implementer's PR. It RETIRES
      WITH T1.5 c1. The row is still correct to mint today -- it asserts the property that actually
      delivers this plan's ROUTE RULING -- but its successor obligation is recorded here rather than
      left for someone else to discover. It is recorded in the PLAN and in the guard module's
      docstring rather than in the registry row because docs/contracts/verification-registry.yaml's
      field set is closed at eight fields (check_id, primitive_slot, guard_target, guard_symbol,
      plan_slug, graduated_at, graduated_by, check_spec -- re-counted this session) with no
      notes/retires slot; widening a Class A governed-data contract to carry one forward-pointer is
      disproportionate to an XS finding and would need its own amendment_log entry.
    command: >-
      bin/venv-python -c "import json; d=json.load(open('docs/decisions-index.json')); e=[x for x in d['decisions'] if x['number']==164][0]; assert e['live'] is True, e['live']; assert e['amends']==[116,122], e['amends']; assert e['triage_excerpt_source']=='Intent', e['triage_excerpt_source']; assert len(e['triage_excerpt'])<=320, len(e['triage_excerpt']); assert 'CLI-hosting class' in e['triage_excerpt'], 'the reopen consequence is outside the 320-char triage window'; assert 'lambda' in e['category_tags'], e['category_tags']; print('DEC164_INDEX ok', e['amends'], e['triage_excerpt_source'], len(e['triage_excerpt']))"
    expected: >-
      Exit 0 and `DEC164_INDEX ok` on stdout, with the amends list, the excerpt source and the
      excerpt length echoed. Fails at origin/main with an IndexError (no entry numbered 164).
    fix_if: >-
      An `amends` mismatch means the title's relation phrase is not the whitelist-continuation form
      `amends Decision 122 and Decision 116` -- restore that exact form (a comma list or a bare
      "and 116" without the repeated word "Decision" is not a valid continuation). A
      triage_excerpt_source other than "Intent" means the `**Intent:**` marker is absent or empty --
      add it. A missing "CLI-hosting class" means the Intent's first 320 characters do not reach the
      consequence -- shorten the Intent's lead-in until it does. A missing `lambda` tag means neither
      the title nor the excerpt says "Lambda" -- name the personas as Lambda personas in the Intent.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec-164-index-triage-discoverable
  - step: 3
    phase: pre-deploy
    action: >-
      CLASS SWEEP, not site fix. The mechanically-enforced obligation covers only Decision 122 (see
      the MATCHER ASYMMETRY context entry); this step holds BOTH amended entries to the same
      forward-pointer standard, so the site the guard cannot see is not left to rot.
    command: >-
      bin/venv-python -c "from scripts.decisions_md import parse_decisions_md; rows={r['decision_id']:r for r in parse_decisions_md()}; bad=[n for n in (116,122) if '[Amendment 2026-08-03:' not in rows[n]['raw_block'] or 'Decision 164' not in rows[n]['raw_block']]; assert not bad, bad; import re; spurious={n:[m.group(0) for m in re.finditer('(?:Supersedes|supersedes|amends|Amends|partially supersedes) Decision [0-9]+', rows[n]['raw_block'].split('[Amendment 2026-08-03:')[1])] for n in (116,122)}; assert not any(spurious.values()), spurious; print('DEC164_POINTERS ok 116 122')"
    expected: >-
      Exit 0 and `DEC164_POINTERS ok 116 122` on stdout. Fails at origin/main because neither block
      carries the trailer.
    fix_if: >-
      A number in the failure list means that entry's `[Amendment 2026-08-03: ...]` trailer is
      missing or does not name "Decision 164" -- append it (the bracketed form, not the
      `> **Update (...)` form: both entries genuinely ARE amended here, which is the case
      amendment_forms' trailing_bracket shape exists for). A non-empty `spurious` mapping means a
      trailer text contains a relation phrase like "amends Decision N", which manufactures a new
      supersession edge needing its own forward pointer -- reword to a plain "Decision N" citation.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec-164-forward-pointers-on-both-amended-entries
  - step: 4
    phase: pre-deploy
    action: >-
      The finding's own acceptance clause ("T4.2's transport section cites it") plus the referential
      property no repo-wide guard supplies: tier_item related_decisions are unvalidated ints today, so
      a citation to a decision that does not exist would sit undetected. Asserts both touched items,
      and asserts the whole cited set resolves -- not just the number this plan adds.
    command: >-
      bin/venv-python -c "import pathlib, yaml; from scripts.decisions_md import decision_header_numbers; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); it={i['id']:i for i in d['tier_items']}; t42=it['T4.2']; t412=it['T4.12']; assert 'Decision 164' in t42['intent'], 'T4.2 intent does not cite Decision 164'; r42=t42.get('related_decisions') or []; r412=t412.get('related_decisions') or []; assert 164 in r42 and 164 in r412, (r42, r412); assert 116 in r42 and 122 in r42 and 116 in r412, (r42, r412); live=decision_header_numbers(paths=[pathlib.Path('docs/DECISIONS.md')]); dangling=sorted(n for n in set(r42)|set(r412) if n not in live); assert not dangling, dangling; print('ROADMAP_CITES_164 ok', sorted(r42), sorted(r412))"
    expected: >-
      Exit 0 and `ROADMAP_CITES_164 ok` on stdout with both related_decisions lists echoed. Fails at
      origin/main on the T4.2 intent assertion (T4.2 has no related_decisions key there at all --
      verified absent this session -- and its intent does not name Decision 164).
    fix_if: >-
      An intent failure means the citation sentence was not added to T4.2's LLM-transport paragraph
      -- add it there specifically, not to the persona list above it. A related_decisions failure
      means the key is missing or incomplete on that item -- set T4.2 to [116, 122, 164] and T4.12 to
      [116, 164]. A non-empty `dangling` list means a cited number has no live header: either the
      Decision was archived (cite the archived number only in prose, not in related_decisions) or the
      number is a typo.
    hermetic: true
    graduation: graduate
    graduation_check_id: roadmap-t4-persona-routing-cites-dec-164
  - step: 5
    phase: pre-deploy
    action: >-
      The supersession guard is satisfied by ANNOTATION, not by a waiver, and it is non-vacuous. The
      guard is FULL-tier only -- it does not run in --pre -- so a defect here reddens main rather
      than the PR, which is exactly the failure mode this run has already paid for once. Run it
      directly rather than trusting `--pre` to have covered it.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.decisions import validate_supersession_annotations as v; root=Path('.'); edges=v.extract_supersession_edges(root); assert (164,122,'docs/DECISIONS.md') in edges, 'the 164->122 amends edge is not extracted -- the title relation phrase changed shape'; f=[]; w=v._load_waivers(root, f); assert not f, f; assert not [x for x in w[0] if 164 in x], 'the edge was discharged by a waiver instead of by annotating the victim'; fail,n=v._check_supersession_annotations(root, w[0], []); assert not fail, 'supersession guard FAIL'; print('SUPERSESSION ok', n, 'edges')"
    expected: >-
      Exit 0 and `SUPERSESSION ok` on stdout with the total edge count (41 on the verified
      prototype; 40 on the unfixed tree).
    fix_if: >-
      A missing (164, 122) edge means the title no longer says `amends Decision 122` adjacently --
      restore it. A waiver hit means someone added a 164 entry to
      config/decision_supersession_waivers.yaml -- remove it and annotate Decision 122's block
      instead, per that file's own "annotate the victim instead" guidance. A guard FAIL names the
      unannotated victim -- append the forward-pointer trailer to that block.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates coverage a standing check already owns. validate_supersession_annotations is
      registered in the full tier and IS the standing regression guard for this property repo-wide;
      graduating a second row that re-asserts it would be the duplicate-guard case
      docs/contracts/verification-registry.yaml's dedup discipline exists to prevent. The step is
      kept as a VP step precisely because that guard is full-tier-only, so this is the only
      pre-merge look at it -- but the durable guard already exists and is not this plan's to mint.
  - step: 6
    phase: pre-deploy
    action: >-
      Two independent legs, because this step's own `action` used to claim a property its command did
      not assert -- the same declared-but-not-executed shape Decision 163 exists to close, at smaller
      scale, inside a plan that cites 163. LEG 1: the committed index is not stale, via the shipped
      freshness CLI (the same code path validate_decisions_index_freshness calls) rather than a
      re-derived comparison. LEG 2 (plan-critique round 2): regenerating it PERTURBED NOTHING ELSE --
      the diff versus the origin/main baseline is exactly one ADDED entry (164), zero changed, zero
      removed, `metadata` unchanged. This is AC6, which previously survived only as prose in execution
      step 3. The two legs are genuinely independent, proven rather than argued: perturbing dec-122's
      Problem text and REGENERATING leaves the index FRESH, so leg 1 passes and prints "Decisions
      index is current." while leg 2 fails with `AssertionError: [122]`. The freshness CLI alone
      cannot see corpus-wide churn, because committed == regenerated is true of a churned index too.
      WHAT THIS IS WORTH, stated so a reader does not over-read it: plan-critique found the property
