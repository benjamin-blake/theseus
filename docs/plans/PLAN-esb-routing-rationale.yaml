slug: "esb-routing-rationale"
intent: >-
  Close audit finding ESB-03 by recording, as a numbered Decision, why T4.2's executor personas route
  to the Decision 122 LiteLLM tiers even though they satisfy Decision 116's agentic criterion, and by
  recording the consequence nothing currently records -- that reopening the split would collapse the
  viable persona substrate set to the CLI-hosting class, taking the CD.27 incumbent and its own named
  fallback with it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-esb-routing-rationale.yaml
phase: >-
  Platform T4 (executor substrate) -- governance-record remediation against Decisions 122 and 116 and
  tier_items T4.2 / T4.12. Remediates finding ESB-03 of
  audits/executor-substrate-and-billing-shape-ad02653.yaml (finding entry at :866-886, re-derived this
  session). Wave 4 of a 5-wave remediation run; wave 1 (PLAN-esb-text-fix-bundle) landed the
  ESB-05/07/08/09/10/11 text fixes, wave 2 (PLAN-esb-workspace-store-criteria) landed CD.43's
  workspace-store criteria, wave 3 (PLAN-esb-fallback-spec-carrier) landed CD.27's fallback spec and
  the re-evaluation carrier. Wave 5 is the ESB-04 CD.27 layer-2 comparative record and ratification;
  this plan is deliberately authored so that none of its graduated registry rows read CD.27's state,
  CD.27's discipline_points, or the audit's cli_hosting table -- the three surfaces wave 5 will
  legitimately change.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Three sites. (a) NEW entry `## Decision 164:` recording the persona-routing rationale addressed
      to Decision 116's principle, plus the reversal consequence (substrate-set collapse to the
      CLI-hosting class). (b) A dated `[Amendment 2026-08-03: ...]` forward-pointer trailer appended
      to Decision 122's block, naming Decision 164 -- this is MECHANICALLY REQUIRED, not decorative:
      the title relation `amends Decision 122` makes validate_supersession_annotations extract a
      (164, 122) edge whose victim block must carry a `Decision 164` backpointer or the FULL-tier
      guard FAILs post-merge. (c) The SAME trailer shape appended to Decision 116's block -- NOT
      mechanically required (see the MATCHER ASYMMETRY context entry), added as the class-versus-site
      sweep so a reader arriving at either amended entry finds the successor.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate via `bin/venv-python -m scripts.decisions_index --write`. This is a committed,
      drift-checked artifact (validate_decisions_index_freshness FAILs on drift AND on absence), and
      it is the surface that makes the new entry discoverable -- the decision-scout gate triages
      `title` + `triage_excerpt` + `category_tags` from this file, never DECISIONS.md wholesale.
      Simulated this session against the real generator: the regeneration diff is exactly ONE added
      entry (164) with ZERO changed and ZERO removed entries.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Two tier_items, pointer-only -- no roadmap prose is rewritten and no CD is touched. (a) T4.2's
      "LLM transport" paragraph inside `intent` (:7137 on this tree) gains a sentence citing Decision
      164 as the recorded rationale for routing agentic personas to LiteLLM (the finding's own
      proposed_change: "T4.2's transport section cites it"), and T4.2 gains
      `related_decisions: [116, 122, 164]` (the key is absent today -- verified `None`). (b) T4.12's
      existing `related_decisions: [116]` becomes `[116, 164]`. T4.12's progress_note is NOT touched
      -- its "NOT a routing Decision and NOT an amendment to Decision 116" clause stays true of T4.12
      and is about T4.12, not about this plan.
  - file: tests/esb_text_fix/test_persona_routing_rationale.py
    action: Create
    purpose: >-
      The wave-4 module of the ESB guard package created by wave 1. Holds the failing-first unit
      guards behind the four graduated VP steps, the DECISIONS.md grep-row CLASS guard (see the
      GRADUATED GREP-ROW CLASS SWEEP context entry), and the durable narrative the registry rows
      cannot carry (the matcher asymmetry, the title-strip hazard, the retirement owner). Must name
      "docs/DECISIONS.md", "docs/decisions-index.json", "docs/ROADMAP-PLATFORM.yaml" and
      "config/agent/verification_registry/registry.yaml" as whole quoted string literals so
      affected_tests channel 2's data-edge match selects it into the --pre tier whenever any of the
      four changes, and must import from tests.esb_text_fix._anchors so channel 1 selects it when the
      shared helper changes.
