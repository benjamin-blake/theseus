schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-iam-bootstrap-adopt"
intent: >-
  First half of rec-3838: adopt the two non-CI-writable IAM roles (PlatformDev, PlatformAdmin) and
  all five inline policies on them into the admin-only terraform/bootstrap root with zero-diff
  imports, and re-anchor the standing IAM guards on that copy. Once the sibling plan releases them
  from terraform/personal, each Terraform state holds only what its applier may mutate, which
  removes the split-apply / stale-saved-plan race class (Decision 190's named pattern) at its
  source rather than managing it procedurally.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-bootstrap-adopt.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3838, plan 1 of 2 (sibling:
  PLAN-platform-iam-personal-release resolves rec-3838). No tier_item criterion claimed. Adjacent:
  T2.48 (in_progress; its files_in_scope names the personal policy files, not edited here) and
  T2.23 (bootstrap root, complete).
closes_criteria: []
scope:
  - file: terraform/bootstrap/platform_roles.tf
    action: Create
    purpose: >-
      aws_iam_role.platform_dev and aws_iam_role.platform_admin copied from terraform/personal with
      identical arguments (name, description, max_session_duration, PlatformDev-only
      permissions_boundary, trust documents built from var.account_id,
      var.agent_service_account_user_name and the two ExternalId variables). Resource-level `tags`
      reproduce the personal default_tags values bootstrap's default_tags do not carry
      (Account = "personal", ManagedBy = "Terraform") so tags_all is unchanged and the import is
      zero-diff. lifecycle prevent_destroy on both roles. Two import blocks (ids PlatformDev,
      PlatformAdmin).
  - file: terraform/bootstrap/platform_dev_policies.tf
    action: Create
    purpose: >-
      DailyOps (aws_iam_role_policy.platform_dev_runtime) copied with its hoisted policy local and
      its existing byte-size precondition. Personal-root object references become bootstrap
      locals built from literal names and var.account_id / var.aws_region (bucket, counters table,
      DuckLake Lambda function ARNs, keeping the local names ducklake_prod_data_prefix and
      ducklake_smoke_data_prefix); the two inference-credential secret ARNs come from
      data "aws_secretsmanager_secret" lookups by name (exact ARN, rendered document unchanged).
      role = aws_iam_role.platform_dev.id. Import block PlatformDev:DailyOps.
  - file: terraform/bootstrap/platform_admin_policies.tf
    action: Create
    purpose: >-
      AdminOps (aws_iam_role_policy.platform_admin_ops) copied with its hoisted local and byte-size
      precondition, plus lifecycle prevent_destroy and a precondition asserting the IAMFull
      statement is still present. Import block PlatformAdmin:AdminOps.
  - file: terraform/bootstrap/platform_admin_data_policies.tf
    action: Create
    purpose: >-
      PlatformDataLakeProvisioning, BootstrapStateProvisioning and DuckLakeBreakGlass copied, each
      hoisted into a local so a <= 10240 B size precondition can measure it (a precondition cannot
      reference self). BootstrapStateProvisioning gets lifecycle prevent_destroy and a
      precondition asserting its statements still name the agent-platform-bootstrap-tfstate bucket
      ARN and object ARN. The DuckLake DSN secret ARN comes from a data "aws_secretsmanager_secret"
      lookup by name. Three import blocks (PlatformAdmin:<policy name>).
  - file: terraform/bootstrap/variables.tf
    action: Modify
    purpose: >-
      Add agent_service_account_user_name (default "agent-service-account", matching personal)
      and platform_dev_external_id / platform_admin_external_id (sensitive, no default, supplied
      via the gitignored terraform.bootstrap.tfvars -- never a committed literal).
  - file: terraform/bootstrap/CLAUDE.md
    action: Modify
    purpose: >-
      Scope and pointer lines only (Decision 127): the module now also owns the two admin-tier
      identities and their inline policies; the import-verification section names them and points
      at docs/contracts/deploy-paths.yaml admin_out_of_band.procedure for the standing rule. The
      one-time adoption walkthrough lives in this plan's VP and the PR description (Decision 115),
      not in standing prose. The file sits within ~100 bytes of its config/prose_budgets.yaml
      budget (5151), so fund the lines by replacing the stale "State-migration ordering" section --
      it prescribes `terraform state rm`, which terraform/personal/main.tf now forbids -- with a
      one-line pointer to the import/removed pattern; net size must not exceed the budget
      (decompose, never raise -- Decision 128/166).
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Add one admin_out_of_band.procedure step, placed before the POST-APPLY step: a
      terraform/bootstrap apply that changes BootstrapStateProvisioning or AdminOps' IAMFull
      statement carries no other change, and its plan must show no trust-document diff on either
      role (bare-action wording, no restated guard classification -- Decision 126 point 2).
      amendment_log entry.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Add a test asserting the self-access isolation step exists, names both
      BootstrapStateProvisioning and IAMFull, and precedes the POST-APPLY step.
  - file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
    action: Create
    purpose: >-
      TestBootstrapOwnsPlatformIam (durable): the seven addresses are declared in terraform/bootstrap
      with correctly shaped import blocks; prevent_destroy on both roles, AdminOps and
      BootstrapStateProvisioning; every bootstrap copy of a personal-root name (bucket, counters
      table, DuckLake function names, data prefixes, the three secret names, the
      agent_service_account_user_name default, the boundary policy name) equals its personal-root
      source, compared as templates (never rendered ARNs, Decision 101); red cases for a dropped
      import, a missing prevent_destroy and a drifted constant. TestDualCopyParity (transitional,
      deleted by the sibling plan): while both roots declare an address, both copies carry the same
      Sid set and per-Sid Effect and action set.
  - file: config/agent/verification_registry/entries/platform-iam-bootstrap-owns-roles-and-policies.yaml
    action: Create
    purpose: graduate TestBootstrapOwnsPlatformIam (class-level node id) under this plan's slug
  - file: scripts/checks/iam_tf/validate_agent_observability_read_coverage.py
    action: Modify
    purpose: >-
      Read the DailyOps and AdminOps statements from terraform/bootstrap (resolving bootstrap
      locals) while still scanning terraform/personal for the observability-managed resources;
      fail loudly if either policy is absent from bootstrap.
  - file: tests/checks/iam_tf/test_validate_agent_observability_read_coverage.py
    action: Modify
    purpose: >-
      Re-lay the fixtures so the two agent-identity policies are written into a tmp
      terraform/bootstrap; add a red case where the policies exist only under terraform/personal.
  - file: tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py
    action: Modify
    purpose: >-
      Repoint _POLICY_FILE, the module docstring and the expected resource/condition constants
      to terraform/bootstrap/platform_dev_policies.tf and its bootstrap local forms; every red case
      unchanged. No executable surface outside the declared rec-4047 residual may still name a
      terraform/personal policy file after this plan and its sibling (the sibling's step 2 sweep).
  - file: config/agent/verification_registry/entries/platformadmin-metric-read-verbs-present.yaml
    action: Modify
    purpose: claim-preserving repoint of check_spec and guard_target to terraform/bootstrap/platform_admin_policies.tf
  - file: config/agent/verification_registry/entries/platformdev-state-convergence-denies-intact.yaml
    action: Modify
    purpose: claim-preserving repoint of check_spec and guard_target to terraform/bootstrap/platform_dev_policies.tf
  - file: config/agent/verification_registry/entries/personal-policies-carry-byte-preconditions.yaml
    action: Modify
    purpose: >-
      claim-preserving repoint of check_spec (both paths) and guard_target to terraform/bootstrap (check_id kept --
      immutable identity; the claim "these two policies carry exactly one minified-measure
      precondition" is unchanged)
  - file: config/agent/verification_registry/entries/cloudtrail-read-only-no-write-verbs.yaml
    action: Modify
    purpose: claim-preserving repoint of the LookupEvents presence grep and guard_target to terraform/bootstrap (the write-verb negation stays repo-wide over terraform/)
  - file: config/agent/verification_registry/entries/platformdev-bounded-platformadmin-excluded.yaml
    action: Modify
    purpose: claim-preserving repoint of check_spec and guard_target to terraform/bootstrap/platform_roles.tf
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Governance note recording the five claim-preserving repoints (admitted by run_differential
      because the bootstrap paths are absent on origin/main) and the declared residual: the
      platform-dev-data-lake-read-fence shard's guard_target keeps the old path, because a
      metadata-only edit would be re-submitted and rejected as tautological (its node_id passes at
      origin/main).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is NEVER auto-applied (terraform/bootstrap/CLAUDE.md, CD.35 Wave 4 / T2.23): every post-deploy step runs in the ADMIN container under agent_platform_admin, from merged main, after a human has reviewed the presented plan and explicitly directed the apply (Decision 126 human-gated admin tier)."
  - "ADMIN container precondition (Decision 120): bin/setup-cloud-env.sh ran with INSTALL_TERRAFORM=1 and a non-empty provider-mirror sync, so TF_CLI_CONFIG_FILE is set and terraform/bootstrap initialises. DEV containers cannot init any root (Decision 119) -- HCL validity is delegated to CI's required terraform-validate check, which covers terraform/bootstrap."
  - "HARD PREREQUISITE: rec-4044 (state-free IAM-change alarms on both roles) is closed before the adoption apply -- terraform/bootstrap has no drift probe (rec-3358), so detection must exist before these identities leave terraform/personal's hourly drift plan."
  - "No terraform/personal apply happens in this plan. The bootstrap import writes only bootstrap state, so no personal saved plan goes stale and the personal drift plan stays no-diff; the seven objects are dual-owned (identical HCL) until the sibling plan's gated forget."
  - "IAM precedence is unaffected: no Lambda code or IAM content changes; the adoption must not change any permission (zero-diff gate)."
acceptance_criteria:
  - terraform/bootstrap declares aws_iam_role.platform_dev, aws_iam_role.platform_admin and the five inline policies (platform_dev_runtime, platform_admin_ops, platform_admin_datalake, platform_admin_bootstrap_state, platform_admin_ducklake_breakglass), each with an import block whose id is the role name or role:policy name
  - Both roles, AdminOps and BootstrapStateProvisioning carry lifecycle prevent_destroy; BootstrapStateProvisioning and AdminOps carry preconditions protecting the bootstrap-state statements and the IAMFull statement; every bootstrap inline policy carries a <= 10240 B size precondition
  - Every bootstrap copy of a personal-root name equals its source, asserted as templates with no rendered account id anywhere in the repository
  - The admin adoption plan reads exactly seven imports and zero add, change or destroy across the whole bootstrap root; the trust documents show no diff
  - After the adoption apply, a bootstrap plan exits 0 and a before/after snapshot of both roles' complete IAM surface (role documents, inline and attached policy lists, the five inline documents) is identical
  - The standing IAM guards (fence test, observability read coverage, five registry shards) read the bootstrap copy and pass; the five repointed shards are admitted by run_differential
  - The personal convergence record stays green throughout; no terraform/personal apply is performed
verification_plan:
  - step: 1
    phase: pre-deploy
    action: bootstrap owns the seven addresses -- declared, imported, protected, and name-parity with terraform/personal
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py::TestBootstrapOwnsPlatformIam" -q
    expected: >-
      all tests pass, including the red cases (a dropped import block, a missing prevent_destroy, a
      drifted bucket/table/function/prefix/secret/user-name constant) proving each assertion can
      fail; red before this plan is implemented (the module does not exist), green after
    fix_if: an address is missing, an import id is malformed, a protection is absent, or a constant diverges from its terraform/personal source
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-iam-bootstrap-owns-roles-and-policies
  - step: 2
    phase: pre-deploy
    action: while both roots declare the seven addresses, the two copies carry identical statements
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py::TestDualCopyParity" -q
    expected: all tests pass -- every dual-declared policy has the same Sid set and per-Sid Effect and action set in both roots, with a red case for a one-sided edit
    fix_if: a copy diverges -- reconcile the bootstrap copy to the personal copy (the personal copy is what live state matches today)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Transitional by design: the sibling plan deletes TestDualCopyParity once terraform/personal
      stops declaring the addresses. Graduating it would force a registry node-id drop in the
      sibling plan, which Decision 187 forbids; the durable claim is graduated by step 1.
  - step: 3
    phase: pre-deploy
    action: the standing IAM guards pass against the bootstrap copy and no longer name the personal policy files
    command: |-
      run_shard() { bin/venv-python -c "import subprocess,sys,yaml; s=yaml.safe_load(open('config/agent/verification_registry/entries/'+sys.argv[1]+'.yaml')); c=s['check_spec']['command']; sys.exit('STALE '+sys.argv[1]) if 'terraform/personal/platform_' in str(c) else sys.exit(subprocess.run(c).returncode)" "$1"; }; bin/venv-python -m pytest tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py tests/checks/iam_tf/test_validate_agent_observability_read_coverage.py -q && run_shard platformadmin-metric-read-verbs-present && run_shard platformdev-state-convergence-denies-intact && run_shard personal-policies-carry-byte-preconditions && run_shard cloudtrail-read-only-no-write-verbs && run_shard platformdev-bounded-platformadmin-excluded && echo "FIVE SHARDS GREEN ON BOOTSTRAP"
    expected: >-
      both test modules pass (the observability module includes the new red case where the two
      policies exist only under terraform/personal), and all five repointed shards exit 0 with no
      remaining terraform/personal/platform_ path in their check_spec
    fix_if: a guard still reads terraform/personal, or a repointed shard is red against the bootstrap copy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Every assertion here is already a standing check -- the fence module is graduated as
      platform-dev-data-lake-read-fence, the observability validator is registered in
      scripts.validate, and the five shards are themselves registry rows. A new row would
      duplicate them.
  - step: 4
    phase: pre-deploy
    action: the admin procedure carries the self-access isolation rule before the POST-APPLY step
    command: bin/venv-python -m pytest "tests/test_deploy_paths_admin_procedure.py::test_admin_procedure_has_self_access_isolation_step" -q
    expected: the new test passes -- a step names BootstrapStateProvisioning and IAMFull, forbids bundling them with any other change, and sits before POST-APPLY; red before (the test does not exist), green after
    fix_if: the step is missing, names only one of the two statements, or is ordered after POST-APPLY
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is a pytest function in the always-run suite next to the two admin-procedure
      guards it extends, which are themselves ungraduated suite members; a registry row would
      duplicate what every full-tier run already executes.
  - step: 5
    phase: pre-deploy
    action: exactly seven import blocks are declared across the new bootstrap files
    command: test "$(cat terraform/bootstrap/platform_roles.tf terraform/bootstrap/platform_dev_policies.tf terraform/bootstrap/platform_admin_policies.tf terraform/bootstrap/platform_admin_data_policies.tf | grep -c '^import {')" -eq 7 && echo SEVEN_IMPORTS_DECLARED
    expected: exit 0 and the marker line is printed
    fix_if: the count is not 7 -- an address is missing its import block or one is duplicated
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A cheap tripwire for the implementer; the durable per-address import assertion (including id
      shape) is graduated by step 1, so a second row would duplicate it.
  - step: 6
    phase: pre-deploy
    action: fast-tier presubmit is clean, including run_differential admission of the new shard and the five repointed shards
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any fast-tier check fails -- in particular a bootstrap-scanning check (validate_iam_policy_size, validate_ci_refresh_read_coverage, validate_authority_budget, _write_companions) reacting to the new bootstrap resources; extend the check deliberately rather than filtering the new resources out
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses a graduate step whose
      argv head is -m scripts.validate.
  - step: 7
    phase: pre-deploy
    action: full-tier validation before commit, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a COMPLETED full run -- a timeout is blocked, not a pass; resume later and rerun the full tier from the start
    fix_if: any full-tier check fails -- do not commit or open the PR until it is green
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion_refusal as step 6.
  - step: 8
    phase: post-deploy
    action: ADMIN precondition -- provider mirror present and terraform/bootstrap initialises from merged main
    command: test -n "$TF_CLI_CONFIG_FILE" && git fetch origin main && git merge-base --is-ancestor HEAD origin/main && terraform -chdir=terraform/bootstrap init -input=false
    expected: TF_CLI_CONFIG_FILE is set, the checkout is at or behind merged main (never an unmerged branch), and init succeeds against the agent-platform-bootstrap-tfstate backend
    fix_if: rerun bin/setup-cloud-env.sh with INSTALL_TERRAFORM=1; check out origin/main
  - step: 9
    phase: post-deploy
    action: HARD GATE -- the IAM-change alarms prerequisite has landed
    command: |-
      bin/venv-python -c "import json; from scripts.ops_data_portal import sync; sync(['ops_recommendations']); rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()]; r=max((x for x in rows if x.get('id')=='rec-4044'), key=lambda x: x.get('last_updated_timestamp') or ''); assert r['status']=='closed', 'rec-4044 is '+r['status']+' -- STOP, the IAM-change alarms prerequisite has not landed'; print('rec-4044 closed')"
    expected: rec-4044 is closed; any other status stops the plan here
    fix_if: plan and land rec-4044 first -- never adopt these identities into a root with no detection
  - step: 10
    phase: post-deploy
    action: freeze precondition -- the personal convergence record is green with no pending marker
    command: bin/venv-python -c "import json,subprocess; r=json.loads(subprocess.run(['aws','s3','cp','s3://agent-platform-data-lake/convergence/personal/sandbox.json','-','--profile','agent_platform_admin'],check=True,capture_output=True,text=True).stdout); bad=[k for k in ('pending_gated','pending_codification','infra_error') if k in r]; assert r.get('status')=='green' and not bad, (r.get('status'), bad); print('CONVERGENCE GREEN, no pending marker')"
    expected: status green and none of the pending_gated / pending_codification / infra_error markers present
    fix_if: resolve the open episode first; also confirm (GitHub MCP) that no open PR touches terraform/personal/platform_*.tf, and hold such merges until the sibling plan's forget lands
  - step: 11
    phase: post-deploy
    action: materialise terraform.bootstrap.tfvars from the admin-readable personal tfvars secret without printing any value
    command: aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile agent_platform_admin --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > terraform/bootstrap/terraform.bootstrap.tfvars && git check-ignore -q terraform/bootstrap/terraform.bootstrap.tfvars && test "$(grep -c -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id)[[:space:]]*=' terraform/bootstrap/terraform.bootstrap.tfvars)" -eq 4 && echo "bootstrap tfvars materialised (values not printed)"
    expected: the four required keys are present, the file is gitignored, and no value reaches the terminal
    fix_if: a key is missing from the secret -- recover it per docs/contracts/terraform-cc-web-operations.yaml; never paste a value into chat, a PR or any committed file (Decision 101)
  - step: 12
    phase: post-deploy
    action: BEFORE snapshot of both roles' complete IAM surface, kept in scratch only
    command: |-
      D="${TMPDIR:-/tmp}/platform-iam-migration/before" && mkdir -p "$D" && for r in PlatformDev PlatformAdmin; do aws iam get-role --role-name "$r" --profile agent_platform_admin --output json > "$D/role-$r.json" && aws iam list-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$D/inline-$r.json" && aws iam list-attached-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$D/attached-$r.json"; done && for p in PlatformDev:DailyOps PlatformAdmin:AdminOps PlatformAdmin:PlatformDataLakeProvisioning PlatformAdmin:BootstrapStateProvisioning PlatformAdmin:DuckLakeBreakGlass; do aws iam get-role-policy --role-name "${p%%:*}" --policy-name "${p##*:}" --profile agent_platform_admin --output json > "$D/policy-${p%%:*}-${p##*:}.json"; done && test "$(ls "$D" | wc -l)" -eq 11 && echo "BEFORE snapshot: 11 documents captured"
    expected: 11 documents captured (2 roles, 2 inline lists, 2 attached lists, 5 inline policies); nothing printed but the count, because every document carries the account id
    fix_if: an AccessDenied or NoSuchEntity -- stop and reconcile; the snapshot is the evidence the adoption changed nothing
  - step: 13
    phase: post-deploy
    action: ADOPTION PLAN -- produce and PRESENT the bootstrap plan; it must be exactly seven zero-change imports
    command: M="${TMPDIR:-/tmp}/platform-iam-migration" && terraform -chdir=terraform/bootstrap plan -input=false -var-file=terraform.bootstrap.tfvars -out="$M/adopt.tfplan" && terraform -chdir=terraform/bootstrap show -json "$M/adopt.tfplan" > "$M/adopt.json" && bin/venv-python -c "import json,os,sys; p=json.load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'platform-iam-migration','adopt.json'))); rc=p.get('resource_changes',[]); want={'aws_iam_role.platform_dev','aws_iam_role.platform_admin','aws_iam_role_policy.platform_dev_runtime','aws_iam_role_policy.platform_admin_ops','aws_iam_role_policy.platform_admin_datalake','aws_iam_role_policy.platform_admin_bootstrap_state','aws_iam_role_policy.platform_admin_ducklake_breakglass'}; imp={r['address'] for r in rc if r['change'].get('importing')}; moving=[(r['address'],r['change']['actions']) for r in rc if r['change']['actions'] not in (['no-op'],['read'])]; sys.exit(f'STOP imports={sorted(imp)} changes={moving}') if imp!=want or moving else print('ADOPTION PLAN OK -- 7 to import, 0 to add, 0 to change, 0 to destroy')" && terraform -chdir=terraform/bootstrap show "$M/adopt.tfplan"
    expected: >-
      the assertion prints ADOPTION PLAN OK and the human-readable plan is PRESENTED to the operator.
      Any update means the bootstrap rendering differs from live -- including a trust-document diff
      (lockout risk: this apply assumes PlatformAdmin) or a tag diff -- and any create, replace or
      destroy anywhere in the bootstrap root (including the existing github_ci_apply resources) is
      a stop
    fix_if: STOP -- reconcile the bootstrap HCL to live (never apply a permission change during adoption), re-run step 13, never proceed to step 14 on a non-zero diff
  - step: 14
    phase: post-deploy
    action: ADOPTION APPLY -- only after explicit human acceptance of step 13's presented plan; record who accepted
    command: terraform -chdir=terraform/bootstrap apply "${TMPDIR:-/tmp}/platform-iam-migration/adopt.tfplan"
    expected: "Apply complete! Resources: 7 imported, 0 added, 0 changed, 0 destroyed. The presented plan is the control for this admin-tier apply (it is never guard-classified)."
    fix_if: do NOT run before a human has reviewed step 13's output and explicitly directed the apply (Decision 126); on any error stop and RCA (Decision 55)
  - step: 15
    phase: post-deploy
    action: bootstrap now owns the seven and its configuration matches live
    command: test "$(terraform -chdir=terraform/bootstrap state list | grep -c -E '^aws_iam_role(_policy)?\.platform_')" -eq 7 && terraform -chdir=terraform/bootstrap plan -input=false -var-file=terraform.bootstrap.tfvars -detailed-exitcode
    expected: seven platform_ addresses in bootstrap state and the follow-up plan exits 0 (no changes)
    fix_if: exit 2 means config and live disagree after the import -- stop and reconcile before the sibling plan merges
  - step: 16
    phase: post-deploy
    action: AFTER snapshot is identical to the BEFORE snapshot -- the adoption changed no permission
    command: |-
      B="${TMPDIR:-/tmp}/platform-iam-migration/before" && A="${TMPDIR:-/tmp}/platform-iam-migration/after" && mkdir -p "$A" && for r in PlatformDev PlatformAdmin; do aws iam get-role --role-name "$r" --profile agent_platform_admin --output json > "$A/role-$r.json" && aws iam list-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$A/inline-$r.json" && aws iam list-attached-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$A/attached-$r.json"; done && for p in PlatformDev:DailyOps PlatformAdmin:AdminOps PlatformAdmin:PlatformDataLakeProvisioning PlatformAdmin:BootstrapStateProvisioning PlatformAdmin:DuckLakeBreakGlass; do aws iam get-role-policy --role-name "${p%%:*}" --policy-name "${p##*:}" --profile agent_platform_admin --output json > "$A/policy-${p%%:*}-${p##*:}.json"; done && bin/venv-python -c "import json,os,sys; b=os.path.join(os.environ.get('TMPDIR','/tmp'),'platform-iam-migration'); norm=lambda d: (d.get('Role',{}).pop('RoleLastUsed',None), d)[1]; names=sorted(os.listdir(os.path.join(b,'before'))); diff=[n for n in names if norm(json.load(open(os.path.join(b,'before',n))))!=norm(json.load(open(os.path.join(b,'after',n))))]; sys.exit('CHANGED '+repr(diff)) if diff or len(names)!=11 else print('SNAPSHOTS IDENTICAL -- 11 documents, no permission changed')"
    expected: SNAPSHOTS IDENTICAL -- RoleLastUsed is the only field normalised away (it moves with ordinary use); document names only are printed on failure, never contents
    fix_if: any document changed -- stop, compare locally in scratch, and RCA before the sibling plan merges
  - step: 17
