constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Never `terraform state rm` and never a cross-backend `state mv` -- adoption is `import {}` only; release is the sibling plan's `removed` blocks (terraform/personal/main.tf header, Decision 178 clause 4 / Decision 183)
  - The adoption apply runs from merged main in the ADMIN container, only after a human has reviewed step 13's presented plan and explicitly directed it (Decision 126)
  - The adoption must be zero-diff -- never change a permission, a trust document or a tag during adoption; any change is a separate, later plan
  - Never widen the CI apply role to write these identities (Decision 180 clauses 2-3 are permanent)
  - "Public-repo boundary (Decision 101): snapshots, plan files, plan JSON and the bootstrap tfvars stay in scratch or gitignored paths and are never pasted into chat, a PR or a commit -- every IAM document and ARN carries the account id; the parity test compares templates, never rendered ARNs"
  - "Freeze: from step 14 until the sibling plan's gated forget converges, no terraform/personal PR touching the seven addresses merges; TestDualCopyParity fails any PR that edits one copy only"
  - rec-4044 must be closed before step 13 (step 9 is a hard stop)
  - Do not edit docs/ROADMAP-PLATFORM.yaml (T2.48 / T2.44 files_in_scope pointers go stale; roadmap edits are outside /plan and /implement bookkeeping)
