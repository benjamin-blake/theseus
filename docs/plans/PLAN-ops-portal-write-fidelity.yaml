    function (update_rec re-derives on merge), not merely at widening the CLI's mutable set. Anyone
    reading this plan as a complete fix for the derived-field defect should read that residual first.
  - >-
    Re-dispatch flag (Decision 163, WARN, resolved) -- the first draft asserted a universal
    "advertised-but-unhonoured flags loud-fail" rule and then immediately carved rec-2826's
    warn-and-discard treatment of --risk out of it without saying so. The intent field now states the
    exception inside the rule, so rec-2826's treatment is derivable from the stated principle.
  - >-
    Critique R1 (blocking, resolved -- the most valuable finding in this plan's review). The first
    draft's rejection tests would have passed against the unfixed code, making the entire verification
    plan vacuous on its central defect. Reproduced empirically before revising. The
    discriminating-test constraint above is the fix, and it is the thing an implementing agent must
    read first.
  - >-
    Critique R2 (blocking, resolved) -- the first draft's 62% coverage floor was 52+10, a round number
    rather than a calibration, and was unreachable within the plan's own scope: 77 of the 97 uncovered
    statements are out-of-scope action branches, the realistic reachable figure is about 56%, and the
    theoretical ceiling with every in-scope statement covered is about 64%. A floor the implementer
    cannot meet without breaching scope invites exactly the workaround behaviour Decision 55 forbids,
    so the floor is now 56% and the Missing-column clause carries the real weight.
  - >-
    Critique round 2 B1 (blocking, resolved) -- the round-1 fix hardened the test BODIES but left the
    SELECTORS vacuous, which is the same defect class one level up. Measured: "pytest
    tests/ops_data_portal/test_cli.py -k update_rec" exits 0 today with "2 passed, 4 deselected",
    because the selector already matches the pre-existing test_cli_update_rec_success and
    test_cli_update_rec_context. All three pytest VP steps now use explicit ::TestCLI::test_name node
    ids, which also fixes the plan-implement-registry linkage the graduate steps need, since
    TestSelectorCheck is node-id based rather than -k based.
  - >-
    Critique round 2 B2 (blocking, resolved) -- .github/workflows/rec-autoclose.yml line 103 hardcodes
    its own resolution string and applies it to every id in the Resolves trailer, so the trailer
    structurally cannot carry rec-2866's partial-delivery note. The overwrite is now its own post-merge
    execution step and VP step 7 asserts the resolution text, not merely the closed status.
  - >-
    Critique round 2 B3 (blocking, resolved) -- the follow-on rec was filed at the second-to-last
    execution step, yet its allocated id was needed by rejection-reason strings written near the start,
    which would have required editing already-merged code. The filing moved to execution step 1.
  - >-
    Critique round 2 S1 (adopted) -- compute_risk shells out to radon and reads coverage.xml, so the
    derived risk value is environment-dependent and a test asserting a hardcoded literal would be
    flaky. VP step 3 now requires comparing the two runs against each other. The same finding notes
    that the conditional-assignment edit cannot change persisted output, since
    _derive_computed_fields overwrites risk unconditionally; its value is removing a misleading
    required argument, not changing what is stored.
  - >-
    Critique R6 (should-fix, adopted) -- the first draft fixed three enumerated flags but left the
    mechanism that produced them intact, so a fourth flag added tomorrow would silently become the next
    ignored one. The _build_parser() extraction plus the exhaustive-classification test closes the
    class, per Decision 163's enforcement-shape principle.
  - >-
    rec-2808's acceptance names a test called test_cli_update_rec_title_and_acceptance_and_file. That
    exact name was deliberately NOT adopted, because --file is rejected rather than threaded under the
    Decision 65 resolution, and a test name implying otherwise would be misleading. rec-2808 is closed
    as a duplicate so its acceptance command is never run.
  - >-
    Grep confirmed that no existing caller anywhere in the repo passes --risk, --source,
    --context-v2-json, --file, --effort or --dry-run alongside --update-rec; every in-repo --update-rec
    call site (AGENTS.md:240, the implement and orient skills, scripts/ops_data_portal.py:510,
    scripts/preflight/ci_rca_signals.py:340) uses only --status, --resolution or --context. The new
    rejections therefore break no caller.
  - >-
    Making --risk optional on --file-rec is backward compatible: both file and effort remain required,
    so _derive_computed_fields always fires and the persisted risk value is unchanged whether or not
    the caller supplies --risk.
  - >-
    Branch was 1 commit behind origin/main at planning time. The Main Divergence Assessment found zero
    overlap with the scope files, so planning proceeded against the current view; the rebase happens at
    commit-flow time per the AGENTS.md rebase phase distinction.
  - >-
    cli.py measured 311 SLOC against the default 500 limit and is unregistered in
    config/sloc_budgets.yaml, so Decision 128 is not engaged by the planned delta of roughly 45 lines.
  - >-
    Baseline before any change: tests/ops_data_portal/test_cli.py has 6 passing tests, and cli.py
    measures 200 statements with 103 covered (51.5%, displayed as 52%).
  - >-
    Implement-time correction: VP steps 1-3 were drafted hermetic: true, but their tests live in
    tests/ops_data_portal/test_cli.py, which carries a module-level pytest.importorskip("duckdb")
    guard -- duckdb is absent from the fast pr-validate tier (requirements-fast.txt +
    requirements-dev.txt only, not the full requirements.txt), so validate_vp_replay.py's
    Interactive VP Replay (T3.15 c2, VF-01) cannot collect the explicit node ids there and reds
    the PR (exit 4, "found no collectors"). PLAN-portal-update-rec-context.yaml already marks its
    own tests/ops_data_portal/test_cli.py VP step hermetic: false for this identical reason;
    corrected all three steps to hermetic: false to match established precedent. This does not
    affect the Verification Graduation admission (scripts.verification_graduation.run_differential
    does not gate on the hermetic flag) -- all three checks were already admitted and registered
    before this correction. A first push fixing only steps 1-3 still reddened CI: VP step 4 (the
    whole-file coverage ratchet) also targets tests/ops_data_portal/test_cli.py and was still
    hermetic: true, so pytest-cov collected zero data in the fast tier ("No data was collected",
    --cov-fail-under exit 1) and the replay failed the same way. Corrected step 4 to
    hermetic: false in the same follow-up for the identical reason.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    The discriminating-test constraint has been read and understood BEFORE any test is written --
    a rejection test that omits the paired valid flag is vacuous and will pass against the bug.
execution_steps:
  - >-
    FIRST, before any cli.py edit, file the follow-on recommendation the human requested be kept
    separate, via get_rec_write_guidance then file_rec: propose that update_rec in
    scripts/ops_data_portal.py call _derive_computed_fields on the merged record whenever file or
    effort changes, so that --file and --effort can graduate from loud-fail to mutable without
    stranding risk and automatable. Note in its context that the defect is reachable today through the
    Python surface even after this plan lands. Target file scripts/ops_data_portal.py, source planning,
    and reference this plan and Decision 65. This step is FIRST because the allocated rec id is needed
    by the rejection-reason strings written in a later step -- filing it afterwards would require
    editing already-merged code.
  - >-
    scripts/ops_portal/cli.py -- extract the argparse construction from main() into a module-level
    _build_parser() that returns the configured parser, keeping the cross-module verb imports
    function-local inside main() as the module docstring requires, and giving _build_parser its own
    function-local import for the --since default. Behaviour-preserving; no flag, default or help
    string changes in this step.
  - >-
    scripts/ops_portal/cli.py -- add a --dry-run guard immediately after parse_args, before any action
    dispatch: if args.dry_run and not args.purge_postmortems_for, print an error to stderr naming
    --dry-run, stating it is supported only with --purge-postmortems-for and that every other action
    writes for real, then return 1.
  - >-
    scripts/ops_portal/cli.py -- add a module-level dest-to-rec-field map for the mutable --update-rec
    fields (status, resolution, execution_result, execution_date, execution_branch, execution_pr_url,
    rec_context->context, title, acceptance, priority, tags, dependencies, verification,
    verification_tier) and a module-level rejection table for target_file->--file, effort->--effort,
    risk->--risk, source->--source and context_v2_json->--context-v2-json, each carrying a reason that
    cites config/agent/data_quality/ops.yaml and says "not updatable via the CLI pending re-derivation"
    with the follow-on rec id. Module level, not function local, so both are greppable and directly
    testable.
  - >-
    scripts/ops_portal/cli.py -- rewrite the --update-rec branch to first reject any supplied flag in
    the rejection table (printing one stderr line per offending flag, returning 1 before any write),
    then build updates from the dest-to-field map, preserving the existing empty-updates error, and
    finally print the applied field list alongside the rec id on success.
  - >-
    scripts/ops_portal/cli.py -- remove "risk" from the --file-rec required list and move risk out of
    the literal fields dict into a conditional assignment alongside tags and dependencies, so
    _derive_computed_fields remains the sole authority for the persisted value (rec-2826).
  - >-
    scripts/ops_portal/cli.py -- rewrite the module docstring so it describes the current contract
    instead of asserting byte-identical parity with the pre-decomposition monolith, and state that
    unhonoured flags loud-fail per action, with the derived-field exception named.
  - >-
    tests/ops_data_portal/test_cli.py -- add regression tests, EVERY rejection test built per the
    discriminating-test constraint: --dry-run rejected for a complete --file-rec argument set and for
    --update-rec --status closed (with _fetch_rec_from_reader patched), asserting exit 1, writer not
    called, and stderr naming --dry-run; --dry-run still honoured for --purge-postmortems-for;
    --update-rec threading title/acceptance/priority/verification into the write payload; each of the
    five non-mutable flags paired with --status closed rejected without writing; the success message
    naming applied fields; --file-rec succeeding both without and with --risk (name these two to match
    the selector "risk_optional"); and an exhaustive-classification test (named to match the selector
    "update_rec") that introspects _build_parser() and asserts every dest in the two rec argument
    groups falls in exactly one classification set. Run each new test against the pre-change code and
    confirm it is RED before implementing the fix.
  - >-
    Execute Verification Plan -- run each step in order; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - >-
    Include the trailer "Resolves: rec-2945, rec-2866, rec-2826" in the squash-merge commit body so
    rec-autoclose closes the bundled recs.
  - >-
    After the merge, run the three human-confirmed duplicate closures, which were approved at the
    planning gate and are close_proposed rather than agent-initiated (Decision 103):
    --update-rec rec-3034 --status closed --resolution "Duplicate of rec-2866 (same defect, same file);
    fixed by ops-portal-write-fidelity"; --update-rec rec-2808 --status closed --resolution "Duplicate
    of rec-2866; --title/--acceptance exposed by ops-portal-write-fidelity"; --update-rec rec-2972
    --status closed --resolution "Duplicate of rec-2866; --title now updatable via
    ops-portal-write-fidelity".
  - >-
    After rec-autoclose has fired, overwrite rec-2866's resolution to record partial delivery:
    --update-rec rec-2866 --resolution "Partially delivered by ops-portal-write-fidelity: --title and
    --acceptance now thread on --update-rec, but the requested --file threading is deliberately
    rejected pending derived-field re-derivation -- see follow-on rec-NNNN". This is a SEPARATE
    mandatory step because .github/workflows/rec-autoclose.yml line 103 hardcodes its own resolution
    string for every id in the trailer, so the trailer cannot carry this text (Decision 103
    closure-proof).
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Single-file revert of scripts/ops_portal/cli.py restores the prior behaviour; no schema, no
  infrastructure and no warehouse migration is involved. The one irreversible side effect is the
  step 6 acceptance repair on rec-2866 and the duplicate closures, which are ordinary portal writes
  on an append-only store and are corrected forward by further portal updates rather than by
  reverting code. Step 6 is sequenced after the full-tier validate so no production row is written
  from a tree that has not passed the full tier.
