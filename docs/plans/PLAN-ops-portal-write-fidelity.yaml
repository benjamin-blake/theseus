schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ops-portal-write-fidelity"
intent: >-
  Close three write-fidelity defects on the ops data portal CLI, the single sanctioned agent write
  path to the operational warehouse, so that the CLI never reports success for a write it did not
  perform and never performs a write the caller asked it to preview. Governing rule, stated with its
  one exception so the exception is derivable rather than a carve-out: an advertised-but-unhonoured
  flag must loud-fail, EXCEPT the formula-derived fields risk and automatable, which are accepted
  advisorily and emit an override warning because Decision 66 Tier B places their value under the
  portal's control rather than the caller's. That exception is precisely why --risk is rejected on
  --update-rec (where nothing re-derives it) yet merely optional-and-advisory on --file-rec (where
  _derive_computed_fields always overwrites it). A structural test closes the defect class rather
  than only its three known instances.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ops-portal-write-fidelity.yaml
phase: >-
  Ad-hoc recommendation-driven forward fix on the Single Portal write surface (Decision 84). Claims
  no tier_item alignment and uses the ad_hoc_rec soft-warn exception category, so the Tier Item
  Freshness Gate does not fire. Bundles rec-2945, rec-2866 and rec-2826; rec-3034, rec-2808 and
  rec-2972 are closed as human-confirmed duplicates of rec-2866.
scope:
  - file: scripts/ops_portal/cli.py
    action: Modify
    purpose: >-
      Three defect fixes, one structural guard enabler, and one docstring correction. (1) Reject
      --dry-run for every action except --purge-postmortems-for, the only action that implements it,
      so a caller who reads --dry-run as a global preview flag can never silently obtain a permanent
      warehouse write. (2) Replace the hardcoded six-field --update-rec allowlist with an explicit
      dest-to-rec-field map that threads every genuinely mutable field, and loud-fail the advertised
      flags that must NOT be mutable on the update path. (3) Remove risk from the --file-rec required
      list and model it like automatable -- accepted optionally for override-detection only, never
      authoritative. (4) Extract parser construction into a module-level _build_parser() so a test can
      introspect the registered flags and prove every one is classified; this is a behaviour-preserving
      refactor. (5) Correct the module docstring, which currently asserts the CLI surface is
      byte-identical to the pre-decomposition monolith; this change alters exit codes and error
      strings, so leaving that claim in place would be a knowingly-false invariant.
  - file: tests/ops_data_portal/test_cli.py
    action: Modify
    purpose: >-
      Add red-then-green regression tests for all three defects, plus the structural test that closes
      the class, in the established CLI test home (Decision 130/131: map_source_to_test returns None
      for scripts/ops_portal/cli.py, so there is no mirror obligation and no new tests/ops_portal/
      directory may be created). Every rejection test must be constructed so that the PRE-FIX
      behaviour is a genuine write -- see the discriminating-test constraint below, which is the
      single most important correctness requirement in this plan.
bundled_recommendations:
  - rec-2945
  - rec-2866
  - rec-2826
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Passing --dry-run with an otherwise-valid, otherwise-succeeding --file-rec or --update-rec
    invocation exits 1, prints an error naming --dry-run to stderr, and reaches no warehouse write
    boundary.
  - >-
    Passing --dry-run with --purge-postmortems-for continues to preview exactly as before
    (no regression on the one action that implements the flag).
  - >-
    --update-rec threads status, resolution, execution_result, execution_date, execution_branch,
    execution_pr_url, context, title, acceptance, priority, tags, dependencies, verification and
    verification_tier into the update payload actually handed to update_rec.
  - >-
    --update-rec exits 1 without writing when passed --file, --effort, --risk, --source or
    --context-v2-json ALONGSIDE an otherwise-valid update, and the error names the specific flag. The
    derived-field group (--file, --effort, --risk) says it is not updatable via the CLI pending
    re-derivation and points at the follow-on rec; --source and --context-v2-json give their own
    reason and do NOT reference that rec, since no re-derivation is pending for either.
  - >-
    A successful --update-rec prints the exact list of fields applied, so a caller can confirm what
    was written rather than inferring it from a bare success string.
  - >-
    --file-rec succeeds without --risk, and still accepts --risk when supplied (backward compatible),
    with the persisted risk value identical in both cases because it is always formula-derived.
  - >-
    Every argparse dest registered in the --file-rec fields and --update-rec fields groups is
    classified by exactly one of the threaded map or the rejection table -- so a future flag cannot
    silently become the next ignored flag. Measured this session: those two groups carry 19 dests
    total, and the planned threaded map (14) plus rejection table (5) covers all 19 with no overlap
    and none unclassified, so the test should assert exact partition, not mere containment.
  - >-
    The scripts/ops_portal/cli.py module docstring no longer asserts byte-identical parity with the
    pre-decomposition monolith.
  - >-
    rec-2945, rec-2866 and rec-2826 are closed by the merge, and rec-3034, rec-2808 and rec-2972 are
    closed as duplicates of rec-2866. rec-2866's closure resolution records partial delivery, because
    its stated ask included threading --file, which this plan deliberately rejects instead.
test_obligations:
  - source: scripts/ops_portal/cli.py
    behavior: >-
      --dry-run must never be silently ignored: it is honoured only for --purge-postmortems-for and
      loud-fails without writing for every other action.
    test_selector: tests/ops_data_portal/test_cli.py::TestCLI::test_cli_dry_run_rejected_for_file_rec
    verification_step: 1
    red_green_expectation: >-
      Red before: with an otherwise-complete argument set, --dry-run --file-rec exits 0 and calls the
      patched writer. Green after: exits 1, writer not called, stderr names --dry-run.
  - source: scripts/ops_portal/cli.py
    behavior: >-
      --update-rec threads every advertised mutable field into the write payload, and loud-fails the
      five non-mutable flags instead of silently discarding them.
    test_selector: tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_threads_title_acceptance_priority_verification
    verification_step: 2
    red_green_expectation: >-
      Red before: --update-rec rec-042 --status closed --title NEW exits 0 with a write payload whose
      title is unchanged, and --update-rec rec-042 --status closed --file x exits 0 having written
      while silently dropping file. Green after: the first writes the new title, the second exits 1
      without writing.
  - source: scripts/ops_portal/cli.py
    behavior: >-
      --file-rec accepts a filing without --risk, and never treats a supplied --risk as authoritative.
    test_selector: tests/ops_data_portal/test_cli.py::TestCLI::test_cli_file_rec_risk_optional_omitted
    verification_step: 3
    red_green_expectation: >-
      Red before: --file-rec without --risk exits 1 on the required-field check. Green after: exits 0
      with the formula-derived risk persisted. Note the with---risk case is a backward-compatibility
      guard, NOT a discriminating test -- it passes identically before and after.
  - source: scripts/ops_portal/cli.py
    behavior: >-
      Every flag registered in the two rec argument groups is classified as either threaded or
      rejected, so a newly added flag cannot silently become the next ignored one.
    test_selector: tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_flag_dest_classification_is_exhaustive
    verification_step: 2
    red_green_expectation: >-
      Red before: neither classification table exists, so the test cannot import them and errors on
      collection. Green after: the 19 registered dests partition exactly into the 14-entry threaded map
      and the 5-entry rejection table.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove --dry-run can no longer convert an intended preview into a real write, and that the one
      action which implements it still previews.
    command: bin/venv-python -m pytest "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_dry_run_rejected_for_file_rec" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_dry_run_rejected_for_update_rec" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_dry_run_still_previews_for_purge_postmortems" -q
    expected: >-
      Exits 0 with exactly 3 tests passed. Explicit node ids, never a -k selector, so a missing test is
      a collection error rather than a vacuous pass. Each rejection test supplies an
      OTHERWISE-COMPLETE, OTHERWISE-SUCCEEDING argument set (a full valid --file-rec; --update-rec with
      --status closed and _fetch_rec_from_reader patched), asserts exit 1, asserts the patched
      _ducklake_write was NOT called, and asserts stderr contains the literal string "--dry-run". The
      purge test asserts --dry-run --purge-postmortems-for still exits 0.
    fix_if: >-
      If a rejection test passes against unfixed code, the argument set is incomplete and the test is
      measuring pre-existing argument validation instead of the guard -- see the discriminating-test
      constraint. If stderr is asserted only to contain "ERROR", the assertion is satisfiable by the
      missing-required-field path and must be tightened to name --dry-run.
    hermetic: false
    graduation: graduate
    graduation_check_id: portal-cli-dry-run-rejected-outside-purge
  - step: 2
    phase: pre-deploy
    action: >-
      Prove --update-rec threads every advertised mutable field into the payload actually handed to
      update_rec, loud-fails the non-mutable ones without writing, and that no registered flag is
      left unclassified.
    command: bin/venv-python -m pytest "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_threads_title_acceptance_priority_verification" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_rejects_file_flag" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_rejects_effort_flag" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_rejects_risk_flag" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_rejects_source_flag" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_rejects_context_v2_json_flag" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_success_message_names_applied_fields" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_flag_dest_classification_is_exhaustive" -q
    expected: >-
      Exits 0 with exactly 8 tests passed. Explicit node ids are MANDATORY here: the selector
      "-k update_rec" already matches the two pre-existing tests test_cli_update_rec_success and
      test_cli_update_rec_context, so it exits 0 today with zero new tests written -- measured this
      session as "2 passed, 4 deselected". Threading tests assert the merged record passed to the
      patched _ducklake_write carries the new title/acceptance/priority/verification values, and the
      success-message test asserts the printed line names exactly the applied fields. Each of the five
      rejection tests pairs the rejected flag WITH a valid mutable flag (--status closed), asserts exit
      1, asserts _ducklake_write NOT called, and asserts stderr names the rejected flag. The
      exhaustive-classification test introspects _build_parser() and asserts every dest in the two rec
      argument groups is in exactly one classification set.
    fix_if: >-
      If a threaded field is absent from the write payload, the dest-to-field map is missing its
      argparse dest -- note --file maps to dest target_file and --context maps to dest rec_context. If
      a rejection test passes against unfixed code, it was written without the paired --status closed
      and is vacuous. If this step is ever reduced back to a -k selector, it stops verifying anything.
    hermetic: false
    graduation: graduate
    graduation_check_id: portal-cli-update-rec-field-fidelity
  - step: 3
    phase: pre-deploy
    action: >-
      Prove --file-rec no longer demands a value it discards, and that supplying it remains
      backward compatible (rec-2826).
    command: bin/venv-python -m pytest "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_file_rec_risk_optional_omitted" "tests/ops_data_portal/test_cli.py::TestCLI::test_cli_file_rec_risk_optional_supplied_is_backward_compatible" -q
    expected: >-
      Exits 0 with exactly 2 tests passed. The omitted-risk test is the discriminating one: it exits 1
      on the required-field check today and 0 after the fix. The supplied-risk test is a
      backward-compatibility guard that passes identically before and after, and the two tests assert
      the SAME persisted risk value as each other.
    fix_if: >-
      Do NOT assert a hardcoded literal risk value. compute_risk shells out to radon and reads
      coverage.xml, so the derived value is environment-dependent and a literal assertion will be
      flaky. Compare the two runs' persisted risk against each other, or against a direct
      compute_risk(file, effort) call. Note also that the persisted value cannot differ from the
      derived one either before or after this change, because _derive_computed_fields overwrites risk
      unconditionally whenever file and effort are present and both are required on --file-rec; the
      conditional-assignment edit removes a misleading required argument, it does not change persisted
      output.
    hermetic: false
    graduation: graduate
    graduation_check_id: portal-cli-file-rec-risk-optional
  - step: 4
    phase: pre-deploy
    action: >-
      Ratchet coverage on the changed file. Whole-file 100% is explicitly NOT the gate: of the 97
      statements currently uncovered in cli.py, 77 sit in action branches this plan does not touch
      (file_decision 24, update_decision 11, guidance/sync/selftests/back-validate 28, ci_rca
      finder+bump 14) and are unreachable from this test module. The real gate is the Missing-column
      clause; the floor exists only to stop coverage regressing.
    command: bin/venv-python -m pytest tests/ops_data_portal/test_cli.py -q --cov=scripts.ops_portal.cli --cov-report=term-missing --cov-fail-under=56
    expected: >-
      Exits 0 at 56% or above, and no line of the new --dry-run guard, the dest-to-field map loop, the
      rejection loop, the classification helper or the risk-optional branch appears in the Missing
      column.
    fix_if: >-
      If the floor is met but a new line appears in Missing, add the missing case as a test. Do NOT
      lower the floor to pass. Equally, do NOT chase a higher number by writing tests for the
      file_decision, update_decision or ci_rca branches -- those are out of this plan's scope, and the
      theoretical ceiling even with every in-scope statement covered is only about 64%.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The floor is calibrated to this file's current unrelated-branch composition, so graduating it
      into the standing registry would pin a number that any future test added to an unrelated cli.py
      action branch would move, producing registry churn unrelated to this plan's behaviour. Steps 1-3
      graduate the actual behavioural guarantees, which is where the durable regression value sits.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the full validation tier before commit, as a real executed step rather than a handoff_policy
      assertion (Decision 163). Sequenced BEFORE the live warehouse write of step 6 so that no
      production row is written from a tree that has not passed the full tier.
    command: bin/venv-python -m scripts.validate && ! grep -q "byte-identical" scripts/ops_portal/cli.py
    expected: >-
      Exits 0 with no failures, including validate_sloc_limits on the grown cli.py, and the module
      docstring no longer contains the now-false "byte-identical" parity claim.
    fix_if: >-
      If validate_sloc_limits fails, cli.py crossed 500 SLOC -- decompose per Decision 128, do not
      register a budget raise. The measured pre-change baseline is 311 SLOC against a 500 limit, so a
      failure here means the implementation grew the file far beyond the planned delta.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The full repository validator is not one stable registry node.
  - step: 6
    phase: pre-deploy
    action: >-
      Prove end-to-end against the live warehouse that --acceptance now reaches the writer, using the
      exact repair rec-3034 documented as silently failing. rec-2866's own acceptance names the
      nonexistent path tests/ops_portal, so this repair is both the fix's live proof and a real data
      correction. The replacement acceptance uses a :: node id, never a -k selector, per
      tests/CLAUDE.md.
    command: bin/venv-python -m scripts.ops_data_portal --update-rec rec-2866 --acceptance "bin/venv-python -m pytest tests/ops_data_portal/test_cli.py::TestCLI -q" && bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib,sys;rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];acc=next(r for r in reversed(rows) if r.get('id')=='rec-2866')['acceptance'];print(acc);sys.exit(0 if 'test_cli.py::TestCLI' in acc else 1)"
    expected: >-
      The update prints a success line naming acceptance among the applied fields, and the read-back
      after sync shows the repaired acceptance command, proving the field survived the round trip.
    fix_if: >-
      If the read-back still shows the old tests/ops_portal path, acceptance never entered the updates
      dict -- re-check the dest-to-field map. If the command errors on credentials, the static-key
      chain needs refreshing; this step is credential-dependent by design and cannot be faked.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Verify the closure obligation: the three bundled recs closed via the merge trailer, and the three
      human-confirmed duplicates closed against rec-2866.
    command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib,sys;rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];latest={};[latest.__setitem__(r.get('id'),r) for r in rows];[print(i, latest.get(i,{}).get('status')) for i in ['rec-2945','rec-2866','rec-2826','rec-3034','rec-2808','rec-2972']];bad=[i for i in ['rec-2945','rec-2866','rec-2826','rec-3034','rec-2808','rec-2972'] if latest.get(i,{}).get('status')!='closed'];res=latest.get('rec-2866',{}).get('resolution') or '';print('rec-2866 resolution:',res);sys.exit(1 if bad or 'follow-on' not in res.lower() else 0)"
    expected: >-
      All six ids print status closed, and rec-2866's resolution contains the partial-delivery note
      naming the follow-on rec id. Exits non-zero if any id is not closed or the resolution was never
      overwritten.
    fix_if: >-
      If a bundled rec is still open after roughly five minutes, rec-autoclose did not fire -- close it
      with the AGENTS.md fallback command. If a duplicate is still open, its human-confirmed close
      command was not run. If rec-2866 is closed but its resolution is the generic autoclose string,
      the partial-delivery overwrite step did not run -- rec-autoclose.yml line 103 hardcodes its own
      resolution text for every id in the trailer, so the overwrite is a separate, mandatory step.
constraints:
  - >-
    DISCRIMINATING-TEST CONSTRAINT (the single most important correctness requirement here). Asserting
    exit 1 plus "write boundary not called" is NECESSARY BUT NOT SUFFICIENT, and a test written that
    way passes against the UNFIXED code. Verified empirically this session: on current main,
    main(["--update-rec","rec-042","--file","x"]) already returns 1 with _ducklake_write never called,
    because --file is not in the six-field allowlist so updates stays empty and cli.py's
    "requires at least one update field" branch fires. The same vacuity applies to --dry-run
    --file-rec with an incomplete argument set, which exits 1 on the missing-required-field check
    regardless of any guard. Therefore: every rejection test MUST pair the rejected flag with an
    otherwise-valid, otherwise-succeeding invocation (--update-rec rec-042 --status closed --file x;
    a complete --file-rec argument set plus --dry-run) so the pre-fix behaviour is a genuine write
    (exit 0, writer CALLED) and the post-fix behaviour is exit 1 with the writer NOT called. Confirm
    each new test is red against the pre-change code before implementing the fix.
  - >-
    Only scripts/ops_portal/cli.py and tests/ops_data_portal/test_cli.py may be modified. The
    re-derivation widening that would make file/effort updatable belongs in update_rec in
    scripts/ops_data_portal.py and is explicitly OUT of scope -- it is filed as a separate follow-on
    recommendation in the follow-on-filing execution step, per the human's decision at the planning gate.
  - >-
    Do not make risk, automatable, source or context_v2_json updatable. risk and automatable are
    documented in config/agent/data_quality/ops.yaml as "Derived, never agent-set" (Decision 65), and
    _derive_computed_fields is called only from file_rec, never from update_rec. The rejection table's
    reason strings should CITE config/agent/data_quality/ops.yaml as the authority rather than restate
    the semantics, so this does not become a third surface asserting derivedness.
  - >-
    Reject-reason wording uses TWO distinct strings, because the five rejected flags are rejected for
    two different reasons. For --file, --effort and --risk (the derived-field group) the reason must
    say "not updatable via the CLI pending re-derivation" and point at the follow-on rec -- NOT a bare
    "not updatable", which would contradict update_rec's own docstring and
    _UPDATE_CONTENT_VALIDATED_FIELDS, both of which do support updating file. For --source and
    --context-v2-json the reason must NOT reference the follow-on rec, since neither is a derived field
    and no re-derivation is pending for them: --source is filing provenance and is immutable after the
    rec is filed, and --context-v2-json has no update_rec parameter at all.
  - >-
    Do not create tests/ops_portal/ -- tests/ops_data_portal/test_cli.py is the established home and
    map_source_to_test returns None for this source, so no mirror obligation applies (Decision 130/131).
  - >-
    The _build_parser() extraction must be behaviour-preserving: keep the cross-module verb imports
    function-local inside main() as the existing module docstring requires, and note that
    _build_parser needs its own function-local import for the --since default.
  - >-
    The exhaustive-classification test must reach argparse's private _action_groups / _group_actions
    to enumerate the two rec argument groups. This works and is intentional -- argparse exposes no
    public accessor for per-group actions, so do not spend time hunting for one.
  - >-
    tests/ops_data_portal/test_cli.py is 148 lines today and is unregistered in
    config/sloc_budgets.yaml. Decision 130 brought tests/ under SLOC governance, and roughly a dozen
    new tests plausibly land it near 400 lines. That is under the 500 default, but if it crosses,
    decompose into a sibling module (Decision 128) rather than registering a budget raise.
  - No rescue agents or workaround loops (Decision 55).
  - >-
    All recommendation writes transit the ops portal (Decision 84 Single Portal Invariant). Never edit
    logs/.recommendations-log.jsonl directly -- it is a read cache and never a write source.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND on both dispatches (119
    of 119 triaged each), the second re-dispatched against the revised approach after the human added
    rec-2826. CITE list: dec-84, dec-55, dec-66, dec-88, dec-48, dec-163, dec-65, dec-103, dec-124,
    dec-63, dec-130, dec-131, dec-132, dec-70, dec-159.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=PROCEED after 3 round(s)"
  - >-
    Scout flag 1 (Decision 65, WARN, resolved and verified in-session) -- the planning agent had
    excluded --risk from the mutable set because update_rec never re-derives it, but --file and
    --effort are the two inputs to compute_risk(file, effort) and compute_automatable(file, effort).
    Admitting them reaches the identical stale-derived-field harm by another route, and automatable
    gates executor eligibility (Decision 117). Verified directly: _derive_computed_fields is called
    only at scripts/ops_data_portal.py:347 inside file_rec. Human chose at the planning gate to
    loud-fail file/effort and file the re-derivation widening as a separate follow-on.
  - >-
    Scout flag 2 (Decision 103, WARN, resolved) -- duplicate is a semantic verdict, so the three dedup
    closures are close_proposed commands confirmed by the human at the planning gate, never
    agent-initiated closes. The scout also corrected the planning agent's citation of Decision 70 for
    closure semantics: Decision 103 is the authority; Decision 70 governs bootstrap-record deletion.
  - >-
    Scout flag 3 (Decision 124, NOTE, resolved) -- cli.py's module docstring asserts the CLI surface is
    byte-identical to the pre-decomposition monolith. This change alters exit codes and error strings,
    so the docstring is corrected in the same PR rather than left as a false invariant.
  - >-
    Re-dispatch flag (Decision 48, NOTE, resolved) -- the automated per-file coverage gate cannot fire
    on this scope: map_source_to_test returns None for scripts/ops_portal/**, a carve-out established
    by Decision 124, preserved verbatim by Decision 131 cl.1 and re-confirmed by Decision 159 cl.4.
    Verification step 4 is therefore the explicit manual discharge of the V2 coverage obligation. Do
    NOT extend map_source_to_test -- that widening was deliberately deferred.
  - >-
    Re-dispatch flag (Decision 55, NOTE, accepted as a scoped residual) -- the --file and --effort
    rejection guards the CLI surface only. A caller using the Python surface directly, as
    scripts.ops_data_portal.update_rec(rec_id, {"file": ...}), still strands risk and automatable
