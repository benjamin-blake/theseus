schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: url-only-invoke-guard
intent: >-
  Make the On The Loop DuckLake Lambdas that trust their caller's identity reachable only through their AWS_IAM Function
  URL, so requestContext.authorizer.iam can be trusted for telemetry tenant derivation (Decision 200 cl.1), and give the
  coming telemetry writer its own scoped catalog login. This is the admin-tier half of operator choice "A + D" (2026-10-08):
  a human-applied permissions-boundary change (three Deny statements, a CloudTrail data-event selector, a pre-staged
  role read for the new function), a PlatformDev grant change (Function-URL-only condition plus invoke on the telemetry
  writer), the same condition on the CI grants, a telemetry DSN secret container, an SQL migration for the scoped login,
  and the governing Decision. It is implemented and applied from the ADMIN container by an agent with the agent_platform_admin
  profile. PLAN-telemetry-writer-function and PLAN-telemetry-writer-deploy-wiring build the function on top of it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-url-only-invoke-guard.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), security groundwork carried by rec-4024; closes no exit criterion. T2.36:c2 is
  re-grounded here.
scope:
- file: terraform/bootstrap/github_ci_apply_boundary.tf
  action: Modify
  purpose: >-
    local.github_ci_apply_boundary_policy_json gains three Deny statements after DenyBoundaryPolicyModification. Each names
    exactly these resources, built from var.aws_region and var.account_id: function:agent-platform-ducklake-writer, function:agent-platform-ducklake-reader
    and function:agent-platform-ducklake-telemetry-writer, each also in its ":*" qualified form (naming a function that does
    not exist yet is valid). (1) Sid DenyDuckLakeDirectInvoke: Action lambda:InvokeFunction and lambda:InvokeAsync, Condition
    BoolIfExists {"lambda:InvokedViaFunctionUrl" = "false"} (live-verified 2026-10-06: URL calls keep working, direct
    invoke is AccessDenied). (2) Sid DenyDuckLakeResourcePolicyEdit: lambda:AddPermission and lambda:RemovePermission on
    the same function ARNs, unconditioned, so no bounded identity (including the CI apply role) can grant a service principal
    or another account a path that bypasses the boundary. (3) Sid DenyDuckLakeEventSourceMapping: lambda:CreateEventSourceMapping
    and lambda:UpdateEventSourceMapping on Resource "*" with Condition ArnLike {"lambda:FunctionArn" = the six ARNs}. A comment
    above the three says why each path exists (the boundary cannot see service principals or event source mappings) and
    that PlatformAdmin and root are outside the boundary by design (Decision 144 cl.3). No comment inside any Action array
    may contain a square bracket (the file's own warning). The 6,144 B precondition stays as is; the three statements add
    about 1.2 KB to about 1.5 KB.
- file: terraform/bootstrap/github_ci_apply_reads.tf
  action: Modify
  purpose: >-
    IAMRolesRead gains "arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-writer" with a pre-stage comment
    on the agent-platform-probe-liveproof-role precedent: PLAN-telemetry-writer-function creates the role, and without this
    entry the gated apply's own iam:GetRole after the create, and every later plan's refresh, fail closed.
- file: terraform/bootstrap/platform_security_trail.tf
  action: Modify
  purpose: >-
    aws_cloudtrail.platform_security gains a second event_selector: read_write_type "All", include_management_events false,
    data_resource { type = "AWS::Lambda::Function", values = the three unqualified function ARNs }. The existing management-event
    selector is unchanged, so the Decision 202 detectors and test_platform_role_iam_change_alarms.py keep their inputs. The
    telemetry writer's ARN is named before PLAN-telemetry-writer-function creates the function; CloudTrail's DataResource
    values are exact ARN strings, and if PutEventSelectors rejects a not-yet-existing function, step 5's fix_if applies.
    The alarm and metric filter on a non-URL invoke record are deferred until the record shape is measured (rec-4204).
- file: terraform/personal/platform_dev_policies.tf
  action: Modify
  purpose: >-
    In local.platform_dev_runtime_policy_json, DuckLakeInvokeRuntime is replaced by two statements: DuckLakeInvokeUrl (lambda:InvokeFunctionUrl
    on the writer, reader and telemetry writer, each unqualified and ":*") and DuckLakeInvokeViaUrlOnly (lambda:InvokeFunction
    on the same ARNs with Condition Bool {"lambda:InvokedViaFunctionUrl" = "true"}). Writer and reader ARNs keep their resource
    references; the telemetry writer's ARN is interpolated from var.aws_region, var.account_id and the literal function name,
    because the function is created later by PLAN-telemetry-writer-function. The stale comment (InvokeFunction alone authorizes
    the URL, InvokeFunctionUrl "not sufficient on its own") is corrected: both actions are required today (live-verified
    2026-10-06) and direct invoke is denied by the boundary. Every other reference to the DuckLakeInvokeRuntime Sid in the
    file (the comment near :86) names the two new Sids. The 10,240 B precondition stays; confirm the role's aggregate
    inline-policy headroom (the file's own note) in the targeted plan.
- file: terraform/personal/oidc_ci_roles.tf
  action: Modify
  purpose: >-
    In both github_ci_branch's and github_ci_pr's DuckLakeInvokeCI, split lambda:InvokeFunction into its own statement (DuckLakeInvokeCIViaUrlOnly)
    with condition { test = "Bool", variable = "lambda:InvokedViaFunctionUrl", values = ["true"] }; InvokeFunctionUrl and
    GetFunctionUrlConfig stay unconditioned in DuckLakeInvokeCI. The stale comments at :100-103 and :266-270 are corrected
    the same way. MaintenanceSmokeInvokeCI is unchanged (that function is not identity-trusting).
- file: terraform/personal/oidc_pipeline_roles.tf
  action: Modify
  purpose: >-
    github_ci_planner's DuckLakeWriterInvoke gets the same split: lambda:InvokeFunction conditioned on lambda:InvokedViaFunctionUrl
    = true in its own statement; InvokeFunctionUrl and GetFunctionUrlConfig unconditioned.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    Adds aws_secretsmanager_secret.ducklake_telemetry_writer_dsn named "agent-platform-ducklake-telemetry-writer-dsn" (container
    only; there is no aws_secretsmanager_secret_version resource, because the value is written out of band by the admin
    under the SECRET-VALUE-OUT-OF-BAND pattern of docs/contracts/secret-material-handling.yaml) with a description naming the role it holds, the quarterly
    manual rotation and the migration file. The apply role's SecretsManagerMetadataWrite covers CreateSecret on the agent-platform-* secret name prefix.
    The existing ducklake_ops role, database and DSN secret are unchanged.
- file: migrations/ducklake_telemetry_writer_role.sql
  action: Create
  purpose: >-
    Idempotent, password-free SQL run by the ducklake_ops owner login against the ducklake_ops database, on Neon now and
    on RDS after the swap's restore. A header in the ducklake_ops_schema.sql style says what it is, why (Decision 213 cl.3)
    and how to run it. Body: a DO block creating role ducklake_telemetry_writer if absent; ALTER ROLE ducklake_telemetry_writer
    LOGIN NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 10; ALTER ROLE ... SET statement_timeout
    = '60s'; GRANT CONNECT ON DATABASE ducklake_ops; GRANT USAGE ON SCHEMA ducklake_smoke; GRANT SELECT, INSERT, UPDATE,
    DELETE ON ALL TABLES IN SCHEMA ducklake_smoke; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA ducklake_smoke;
    ALTER DEFAULT PRIVILEGES FOR ROLE ducklake_ops IN SCHEMA ducklake_smoke GRANT the same table and sequence privileges.
    No CREATE on any schema, nothing on the ducklake_ops schema, nothing on public. The password is set separately by the
    admin (ALTER ROLE ... PASSWORD with a generated value that is never echoed, logged or committed). CONNECTION LIMIT 10
    is twice the function's reserved concurrency of 5, pending the per-container session measurement in plan 3 part 1's
    gate.
- file: scripts/ci/iam_simulate.py
  action: Modify
  purpose: >-
    context_entries carries a fixture value of YAML type bool as ContextKeyType "boolean" with the lowercase string value;
    strings keep "string" and lists "stringList". build_triples / placeholder resolution leave non-string values untouched.
    Needed because DenyDuckLakeDirectInvoke uses a Bool condition, which a string-typed context entry does not satisfy.
- file: tests/test_iam_simulate.py
  action: Modify
  purpose: >-
    test_context_entries_bool_value_is_a_boolean_key (a True context value yields ContextKeyType boolean and value "true");
    a build_triples case proving a bool context survives placeholder resolution; test_real_fixture_carries_the_url_only_rows
    (the five row ids exist with their expected decisions; red before). test_real_fixture_context_entries_are_well_formed
    (:359) widens its allowed ContextKeyType set from ("string", "stringList") to ("string", "stringList", "boolean"):
    a legitimate widening that follows the runner's new, tested type, not a loosened check, because the fixture now carries
    a Bool condition key.
- file: docs/contracts/iam-simulate-fixture.yaml
  action: Modify
  purpose: >-
    Five new rows, each with a one-line why (principal stays the CI apply role, which carries the boundary): url-only-direct-invoke-denied
    (lambda:InvokeFunction on the writer, required_context_keys lambda:InvokedViaFunctionUrl false, explicitDeny); url-only-direct-invoke-absent-key-denied
    (no context, explicitDeny); url-only-add-permission-denied (lambda:AddPermission on the writer, explicitDeny; without
    the new Deny the apply role's LambdaPermissionWrite would allow it); url-only-add-permission-scoped (lambda:AddPermission
    on function:agent-platform-simulate-probe, allowed, proving the Deny is scoped and EventBridge wiring elsewhere still
    applies); url-only-event-source-mapping-denied (lambda:CreateEventSourceMapping, an event-source-mapping ARN template,
    required_context_keys lambda:FunctionArn = the writer ARN, explicitDeny). One amendment_log entry. The file sits at
    597 of its 600 structural lines, so this plan raises the budget to 650 under Decision 213 cl.6 (config/structural_size_budgets.yaml).
    The contracts class's first relief valve was weighed: the amendment_log is about 35 lines and compacting it frees about
    ten, less than the roughly 40 the rows need, so the cited raise is still required.
    If the fixture shape check rejects a row (for example the event-source-mapping target), adapt the row to the check
    rather than the check to the row, and say so in the PR.
- file: config/structural_size_budgets.yaml
  action: Modify
  purpose: >-
    docs/contracts/iam-simulate-fixture.yaml's entry moves from 600 to 650 with the marker "# raise-approved: dec-213 URL-only
    simulate rows" (validate_sloc_budget_raises; Decision 213 cl.6 names the file and authorizes it). No other entry changes.
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    An amendment_log entry (governance_note_add) records that "human-run" for a secret value includes an ADMIN-container
    agent writing it under explicit per-mutation human direction (Decision 213 cl.5), and names agent-platform-ducklake-telemetry-writer-dsn
    as such a value. The default SECRET-VALUE-OUT-OF-BAND rule is unchanged.
- file: tests/checks/iam_tf/test_url_only_invoke_guard.py
  action: Create
  purpose: >-
    A standing guard over the real tree using tests/fixtures/terraform_hcl_blocks.py, each predicate with its own red case
    on synthetic HCL: (a) the boundary JSON carries the three Deny statements with exactly the named actions, the six function
    ARNs and the stated conditions (BoolIfExists false; ArnLike lambda:FunctionArn); (b) every Allow of lambda:InvokeFunction
    in terraform/personal whose resources reference the writer, reader or telemetry writer carries Bool lambda:InvokedViaFunctionUrl
    = true, and every Allow of lambda:InvokeFunctionUrl on them sits in an unconditioned statement (both are required for
    the URL). A resource references a function when it is aws_lambda_function.<name>.arn (bare or with ":*"), a local holding
    that name, or an interpolated string ending in function:agent-platform-ducklake-<writer|reader|telemetry-writer> (with
    or without ":*"); Resource "*" is out of the predicate's scope (PlatformAdmin, unbounded by Decision 144 cl.3), and the
    red cases cover each reference form; (c) the trail has a data_resource selector of type AWS::Lambda::Function naming the three functions, and the
    management selector is unchanged; (d) the migration file grants nothing on the ducklake_ops schema, no CREATE, and sets
    a CONNECTION LIMIT; (e) the bootstrap IAMRolesRead lists the telemetry writer role. Under 300 SLOC.
- file: config/agent/verification_registry/entries/url-only-invoke-guard.yaml
  action: Create
  purpose: Registry shard for graduated VP step 1 (check_id url-only-invoke-guard, command_exit_zero, the step's pytest target).
- file: docs/runbooks/ducklake-catalog-operations.md
  action: Modify
  purpose: >-
    One-line correction at :304: "PlatformDev's DuckLakeInvokeRuntime grant" names the split grant (DuckLakeInvokeUrl and
    DuckLakeInvokeViaUrlOnly). The file is grandfathered in a retiring class (Decision 127); nothing else changes.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Insert Decision 213 (re-check the number against main and open branches at implementation time; 211-212 are reserved
    by #1426) verbatim from execution step 3, with the merge date. Append dated amendment annotations (Decision 177, trailing
    "[Amendment <date>, Decision 213: ...]") to Decision 81 (cl.1 artifact list; cl.5 and cl.7 one chokepoint per table),
    Decision 91 (cl.1 identity-scoped verb sets; the realized DuckLakeInvokeRuntime grant is now split into DuckLakeInvokeUrl
    and DuckLakeInvokeViaUrlOnly) and Decision 126 (the clause-5 admin carve-out). Stay within the Decision 167 6,144 B entry
    cap (the draft measures about 5,990 B with iter_decision_sections; keep any wording change byte-neutral).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with the repo's decisions-index tooling after the insert (validate_decisions_index_freshness).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Re-ground T2.36 (tier-item-lifecycle.yaml stale-reference check): exit criterion c2's "Every telemetry emit transits the
    ducklake_writer boundary" becomes the telemetry writer boundary (agent-platform-ducklake-telemetry-writer, Decision 213),
    the intent's deliverable (2) ("telemetry emit routed through the ducklake_writer boundary") is re-grounded the same way,
    and files_in_scope gains src/lambdas/ducklake_telemetry_writer/ marked new. Statuses are unchanged. storage-substrate.yaml's
    telemetry_tables.write_boundary (:230) is a contract edit that ships with plan 3 part 1's verbs (its owner), as PLAN-telemetry-writer-function's
    constraints already record.
bundled_recommendations: []
followon_recs:
- rec-4203
- rec-4204
- rec-4205
- rec-4206
- rec-4207
infrastructure_dependencies:
- >-
  Who applies what. terraform/bootstrap is applied by hand under agent_platform_admin (terraform/bootstrap/CLAUDE.md), never
  by CI. In terraform/personal, the PlatformDev inline policy is CI-unexecutable by design (Decision 180), so it takes the
  SPLIT-APPLY step of docs/contracts/deploy-paths.yaml#admin_out_of_band.procedure: a targeted out-of-band apply of aws_iam_role_policy.platform_dev_runtime
  first, then the governed path for the rest, and the pending gated-apply run covering the same resource is rejected, never
  approved. The CI-role policy updates (github_ci_branch, github_ci_pr, github_ci_planner) are in budget and the secret
  container is a metadata create under the agent-platform-* secret name prefix, so the governed path auto-applies them.
- >-
  Admin container prerequisites: agent_platform_admin credentials; local terraform init for terraform/bootstrap (hashicorp-only,
  always works) and for terraform/personal (needs the Decision 120 provider filesystem mirror; if it is not synced, stop
  and tell Benjamin, because the PlatformDev split-apply has no other path); the five no-default personal tfvars recovered
  per docs/contracts/terraform-cc-web-operations.yaml; psql, or psycopg2 from the repo venv, for the migration.
- >-
  LAMBDA-DEPLOY DEFERRED (Decision 79): data-pipeline is affected only through the docs/ROADMAP-PLATFORM.yaml asset; no
  packaged code changes, and the asset refreshes on that artifact's next governed deploy. No DuckLake function is affected
  (no src/ change; the telemetry writer is created by PLAN-telemetry-writer-function).
- >-
  Ordering: all of steps 5-9 (bootstrap apply, PlatformDev and governed applies, the scoped login with its secret value,
  the live URL-only check and the detection check) complete before PLAN-telemetry-writer-function merges, because that
  plan's gated apply needs the role read and the secret, and its step 7 runs attach_check under the scoped login. PRE-APPLY drain check (deploy-paths.yaml):
  the new Denies narrow the apply role's AddPermission surface on the three functions; confirm no in-flight terraform/personal
  plan adds a permission to them (none exists on main).
- >-
  Side effects to expect: the Decision 202 detectors fire on the boundary policy version change (platform-security-platform-role-iam-change),
  on the PlatformDev inline-policy write and on the trail's PutEventSelectors (platform-security-detector-tamper). Each
  is expected; the report names them so nobody treats them as an incident. CloudTrail data events cost about 0.10 USD per
  100,000 events; the three functions see a few thousand invocations a day at most.
acceptance_criteria:
- >-
  The boundary denies, to every bounded principal: lambda:InvokeFunction / InvokeAsync on the writer, reader and telemetry
  writer unless the call comes through the Function URL; lambda:AddPermission / RemovePermission on them; and Create/UpdateEventSourceMapping
  targeting them. Live: a DryRun direct invoke of the writer and of the reader as PlatformDev is AccessDenied with a message
  that names a permissions boundary (the phrase the telemetry writer's checks rely on), and SigV4 describe through each
  URL is still 200.
- >-
  Every identity grant of lambda:InvokeFunction on those functions in terraform/personal carries Bool lambda:InvokedViaFunctionUrl
  = true, with lambda:InvokeFunctionUrl kept unconditioned; PlatformDev additionally holds both actions on the telemetry
  writer. PlatformAdmin is unchanged.
- >-
  The trail logs Lambda data events for the three functions; a denied direct-invoke record for the writer or reader is
  found in the trail's log group and its shape (eventName, errorCode, the field that marks a URL call) is recorded for
  rec-4204's alarm.
- >-
  The bootstrap IAMRolesRead lists the telemetry writer role; the telemetry DSN secret container exists and, after the admin
  steps, holds host, dbname, username ducklake_telemetry_writer, password and sslmode require.
- >-
  The scoped login exists with the migration's attributes and grants: it can read the smoke catalog's metadata schema,
  has no USAGE on the ducklake_ops schema and no CREATE on ducklake_smoke, ducklake_ops, public or the database, and a DuckLake
  ATTACH of the smoke catalog succeeds under it. Whether the ducklake_ops login is a neon_superuser member is measured
  and recorded.
- >-
  The simulate gate passes with the new rows; Decision 213 is in DECISIONS.md with annotations on Decisions 81, 91 and 126;
  T2.36's c2 and intent name the telemetry writer boundary; the standing guard and its red cases pass.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The standing URL-only guard over the real tree, with its red cases.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_url_only_invoke_guard.py -q
  expected: Exit 0. Red before (module absent; then the boundary, grant, trail and migration predicates fail on the unchanged tree).
  fix_if: Fix the Terraform or the SQL, not the guard, unless the guard asserts something the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: url-only-invoke-guard
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The simulate runner carries a boolean context key, and the fixture with the new rows still parses and passes its shape check.
  command: >-
    bin/venv-python -m pytest tests/test_iam_simulate.py tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    -q
  expected: Exit 0. Red before for the boolean context test and the url-only fixture rows test.
  fix_if: Fix the runner or the fixture rows; never loosen validate_iam_simulate_fixture_shape.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    tests/test_iam_simulate.py is already a standing suite and validate_iam_simulate_fixture_shape is a registered check;
    this step re-runs them as evidence for the new behaviour.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    Scope and safety shape against the merge base: only this plan's scope files changed; no 12-digit literal added anywhere;
    no aws_secretsmanager_secret_version added; PlatformAdmin's policy files untouched. (The no-bracket-in-Action-array-comment
    rule is a constraint the implementer reads from the boundary file's own warning; terraform validate in CI parses the
    result.)
  command: >-
    bin/venv-python -c "import subprocess,re,yaml;mb=subprocess.run(['git','merge-base','origin/main','HEAD'],capture_output=True,text=True,check=True).stdout.strip();ch=subprocess.run(['git','diff','--name-only',mb],capture_output=True,text=True,check=True).stdout.split();sc={e['file']
    for e in yaml.safe_load(open('docs/plans/PLAN-url-only-invoke-guard.yaml',encoding='utf-8'))['scope']};d=subprocess.run(['git','diff',mb],capture_output=True,text=True,check=True).stdout;add=[l
    for l in d.splitlines() if l.startswith('+') and not l.startswith('+++')];errs=[p+' outside scope' for p in ch if p not in sc];errs+=[p+' touched'
    for p in ch if p in ('terraform/personal/platform_admin_policies.tf','terraform/personal/platform_admin_data_policies.tf')];errs+=['12-digit
    literal' for l in add if re.search(r'\b\d{12}\b',l)];errs+=['secret version added' for l in add if 'aws_secretsmanager_secret_version' in
    l];print(chr(10).join(errs) or 'SHAPE_OK');assert not errs"
  expected: Exit 0 and SHAPE_OK.
  fix_if: >-
    Revert the out-of-shape edit; a 12-digit literal becomes interpolation; a secret value never enters Terraform. A file
    outside scope that a check forced (for example a regenerated index) is added to the PR description with the reason.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Diff-relative to the merge base by construction; step 1's graduated guard and the secret-material check are the standing equivalents.
- step: 4
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    After Benjamin's explicit "merge" and the squash-merge: plan terraform/bootstrap, PRESENT the plan, and apply only after
    Benjamin explicitly accepts it. The plan must show exactly three in-place updates (aws_iam_policy.github_ci_apply_boundary,
    aws_iam_policy.github_ci_apply_reads, aws_cloudtrail.platform_security) and nothing else; stop on any replace or destroy.
    Save the apply output to $BOOTSTRAP_APPLY_LOG, then run the standing simulate gate.
  command: >-
    test -s "$BOOTSTRAP_APPLY_LOG" && grep -q 'Apply complete! Resources: 0 added, 3 changed, 0 destroyed' "$BOOTSTRAP_APPLY_LOG"
    && bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml
  expected: Exit 0; the apply summary is exactly 0 added, 3 changed, 0 destroyed; the simulate gate reports zero mismatches.
  fix_if: >-
    A mismatch on a new row means the boundary statement is wrong; fix the HCL and re-apply through the same human gate. A
    mismatch on an old row is a regression: stop and report it. Never edit the fixture to match the live result. If PutEventSelectors
    rejects the telemetry writer's ARN because the function does not exist yet (the two policies may already have applied;
    a re-plan then shows only the trail): stop and tell Benjamin. The fallback is a follow-up PR that names only the writer
    and reader in the selector and in the guard's predicate (c), with the telemetry writer added by a bootstrap apply after
    PLAN-telemetry-writer-function creates it, tracked on rec-4204.
- step: 6
  phase: post-deploy
  action: >-
    PlatformDev split-apply (deploy-paths.yaml SPLIT-APPLY): from merged main, terraform/personal plan -target=aws_iam_role_policy.platform_dev_runtime,
    PRESENT it, apply on Benjamin's explicit acceptance, save the output to $PERSONAL_TARGET_LOG. Then reject (never approve)
    the pending tf-gated-apply run for the merge commit and let the governed path apply the remainder (the three CI role
    policies and the secret container), via the acknowledge-and-retry dispatch the contract names if the record latched;
    save that run's apply log to $GOVERNED_APPLY_LOG.
  command: >-
    test -s "$PERSONAL_TARGET_LOG" && grep -q 'Apply complete! Resources: 0 added, 1 changed, 0 destroyed' "$PERSONAL_TARGET_LOG"
    && test -s "$GOVERNED_APPLY_LOG" && grep -q 'aws_secretsmanager_secret.ducklake_telemetry_writer_dsn: Creation complete' "$GOVERNED_APPLY_LOG"
    && for r in github_ci_branch github_ci_pr github_ci_planner; do grep -q "aws_iam_role_policy.$r: Modifications complete" "$GOVERNED_APPLY_LOG"
    || exit 1; done && aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - --profile agent_platform_admin
    | bin/venv-python -c "import json,sys;c=json.load(sys.stdin);assert c['status']=='green', c.get('red_cause');print('CONVERGED')"
    && echo PERSONAL_APPLIED
  expected: Exit 0, CONVERGED and PERSONAL_APPLIED.
  fix_if: >-
    No provider mirror locally: stop and tell Benjamin (no other path exists for the PlatformDev policy). A red record: read
    red_cause (Decision 190) and follow the contract's heal; never approve the gated run for PlatformDev.
- step: 7
  phase: post-deploy
  action: >-
    The scoped login, under Decision 213 cl.5: present each mutation and run it only after Benjamin accepts it. As the ducklake_ops
    owner login (its DSN read from Secrets Manager under agent_platform_admin, never printed): measure and record whether
    ducklake_ops is a neon_superuser member (read-only, no acceptance needed); mutation 1, run migrations/ducklake_telemetry_writer_role.sql;
    mutation 2, set the role's password to a freshly generated value that is never displayed, logged or written to disk;
    mutation 3, write the secret value JSON (host, dbname and sslmode copied from the existing DSN; username ducklake_telemetry_writer;
    the new password) to agent-platform-ducklake-telemetry-writer-dsn. Then connect as the new login and check its reach
    (the check prints only booleans), and run a DuckLake ATTACH of the smoke catalog under it, which proves the DML-only
    grant set is enough before PLAN-telemetry-writer-function relies on it.
  command: >-
    AWS_DEFAULT_REGION=eu-west-2 bin/venv-python -c "import psycopg2;from src.common import ducklake_runtime as rt;d=rt.fetch_dsn('agent-platform-ducklake-telemetry-writer-dsn',profile='agent_platform_admin');assert
    d['username']=='ducklake_telemetry_writer';c=psycopg2.connect(rt.libpq_conninfo(d));q=c.cursor();q.execute(\"select
    has_schema_privilege('ducklake_smoke','USAGE'), has_schema_privilege('ducklake_ops','USAGE'), has_schema_privilege('ducklake_smoke','CREATE'),
    has_schema_privilege('ducklake_ops','CREATE'), has_schema_privilege('public','CREATE'), has_database_privilege(current_database(),'CREATE'),
    (select rolconnlimit from pg_roles where rolname=current_user)\");r=q.fetchone();print('SCOPE',r);assert r==(True,False,False,False,False,False,10);q.execute('select
    count(*) from ducklake_smoke.ducklake_metadata');print('SCOPED_LOGIN_OK')" && AWS_DEFAULT_REGION=eu-west-2 bin/venv-python -c "from scripts.ducklake_smoke
    import core,direct_gates;d=core.fetch_dsn('agent-platform-ducklake-telemetry-writer-dsn',profile='agent_platform_admin');assert
    direct_gates.attach_roundtrip(profile='agent_platform_admin',dsn=d)==1;print('SCOPED_ATTACH_OK')"
  expected: >-
    SCOPE (True, False, False, False, False, False, 10), SCOPED_LOGIN_OK and SCOPED_ATTACH_OK. The neon_superuser measurement for ducklake_ops is recorded
    in the report as a boolean (checked against Decision 107's "scoped non-owner role" control; the project thread files
    a rec if it is true).
  fix_if: >-
    USAGE on ducklake_ops or CREATE granted: the role inherited a privilege (check NOINHERIT and memberships) or a default
    privilege leaked; fix the migration, never widen the check. A failed read of ducklake_metadata: the table grant is
    missing; re-run the migration. ATTACH failing on a Postgres permission error: name the statement DuckLake issued and
    stop; Decision 213 is not yet relied on, so Benjamin decides whether the grant set grows (the reversal condition scoped-login-blocks-verbs).
    ATTACH failing because this container cannot INSTALL the DuckLake extensions: record it, and PLAN-telemetry-writer-function's
    step 7 attach_check becomes the first ATTACH proof. Never print the DSN or password.
- step: 8
  phase: post-deploy
  action: >-
    URL-only holds live for PlatformDev. If the agent_platform profile exists in this container: DryRun direct invoke of
    the writer and the reader is AccessDenied and the error names a permissions boundary (only the classification is printed,
    never the message, which carries ARNs), and SigV4 describe through each URL is 200. If the profile is absent, say so;
    the project thread runs the same check.
  command: >-
    for fn in writer reader; do ! aws lambda invoke --profile agent_platform --region eu-west-2 --function-name agent-platform-ducklake-$fn
    --invocation-type DryRun /dev/null 2> "${TMPDIR:-/tmp}/dry-$fn.err" && grep -q AccessDeniedException "${TMPDIR:-/tmp}/dry-$fn.err"
    && grep -qi 'explicit deny in a permissions boundary' "${TMPDIR:-/tmp}/dry-$fn.err" && echo "$fn BOUNDARY_DENIED" || exit 1; done
    && bin/venv-python -c "import boto3;from scripts.ducklake_smoke import core;[core._ok_json(core._sigv4_invoke(boto3.Session(profile_name='agent_platform',region_name='eu-west-2').client('ssm').get_parameter(Name='/agent-platform/ducklake/'+r+'_url')['Parameter']['Value'],{'action':'describe'},profile='agent_platform'))
    for r in ('writer','reader')];print('URL_ONLY_LIVE_OK')"
  expected: Exit 0 and URL_ONLY_LIVE_OK. The URLs are never printed.
  fix_if: >-
    A DryRun that succeeds: the boundary Deny is not in force; compare the live policy version with step 5. AccessDenied
    without the boundary phrase while step 5's simulate rows report explicitDeny: Lambda's message does not name the policy
    type, so stop and tell Benjamin before either telemetry-writer plan is implemented, because their checks assert the
    phrase and must be re-planned. A URL 403: the
    PlatformDev split or the boundary broke the URL path; restore URL access first (re-apply the previous PlatformDev policy
    through the same gate), then RCA.
- step: 9
  phase: post-deploy
  action: >-
    Detection: after step 8's DryRun attempts, the trail's CloudWatch log group (platform-security-cloudtrail) holds a Lambda
    data event for them within about 15 minutes. Record the record shape (eventName, errorCode, and which field distinguishes
    an InvokeFunctionUrl call) in the report for the follow-on alarm.
  command: >-
    aws logs filter-log-events --profile agent_platform_admin --region eu-west-2 --log-group-name platform-security-cloudtrail
    --start-time $(( ($(date +%s) - 3600) * 1000 )) --filter-pattern '{ ($.eventSource = "lambda.amazonaws.com") && ($.eventCategory
    = "Data") && ($.errorCode = "AccessDenied*") }' --max-items 5 --query 'events[].message' --output text | grep -Eq 'function:agent-platform-ducklake-(writer|reader)"'
    && echo DENIED_INVOKE_LOGGED
  expected: Exit 0 and DENIED_INVOKE_LOGGED; the record's eventName, errorCode and URL-marking field are written into the report (no ARN).
  fix_if: >-
    No denied record after 30 minutes: rerun the filter without the errorCode term. If step 8's URL calls appear but the
    denied DryRun does not, CloudTrail does not record denied DryRun invokes; record that on rec-4204 (its alarm then needs
    a non-DryRun probe). No data events at all: confirm the selectors with aws cloudtrail get-event-selectors; if InvokeFunctionUrl
    events need an advanced selector, record it on rec-4204 rather than widening this plan.
