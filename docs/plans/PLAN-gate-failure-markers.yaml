constraints:
- Only the files listed in scope may be modified.
- src/turn_capture/markers.py imports only the standard library (tests/turn_capture/test_package_boundary.py, .importlinter).
- >-
  Markers carry identifiers only: no free text, paths, values or labels, ASCII only, so nothing that could carry a secret
  reaches a transcript-derived row.
- >-
  The evidence file (logs/debug/validation-result.json) and the _ATTRIBUTIONS / failed_check_attributions shape stay
  unchanged: CI-RCA reads them (Decisions 142, 170).
- >-
  The "Failed checks:" block keeps its exact shape for its two stdout parsers (scripts/ci_rca/taxonomy.py
  _parse_failed_checks_block, scripts/executor/run_summary.py _extract_validation_failed_checks): marker lines follow the
  label lines directly, never start with "- " and never sit between the header and a label.
- No check, scaffold or hook is renamed or added; scripts/validate.py's SLOC must not increase (Decision 128).
- "No rows, contracts, parser_version or producer behavior change here; that is P-B's single parser_version 3 bump."
- No rescue agents or workaround loops (Decision 55).
context:
- >-
  Decision-scout verdict: FLAGS_FOUND (two NOTEs, both resolved in this plan: brand-neutral prefix per Decision 198;
  pattern derived from the contract per Decision 210 cl.3). CITE: 170, 169, 128, 131, 210, 201, 79. Decisions triaged:
  168 of 168. Roadmap items intersected: 21; CONFLICT: 0; RELATED: 21.
- "gates: decision-scout=FLAGS_FOUND (resolved); plan-critique=REVISE r1 (F1-F9 fixed), REVISE r2 confirming (C1-C9 fixed), escalated"
- >-
  Slice 3b split and spike: Benjamin, 2026-10-12 ("yes to the split of the plans, and yes to the spike"). Design inputs:
  /mnt/project-files/telemetry-slice3/step6b-3b-presentation.md, 3b-fable-consult/ADVICE.md (F8).
- >-
  Why rec-4172 is not bundled here: its acceptance oracle holds once this plan merges, but its requirements also have
  config/telemetry/parser_versions.yaml declare the signature prefixes each parser version emits, which is P-B's v3
  registry entry. P-B's squash trailer carries Resolves: rec-4172; this plan's closeout adds an update_rec note.
- >-
  Attribution: registered checks attribute through _ATTRIBUTIONS (dispatch_recording, both tiers; validate.py:93).
  Scaffold steps have no check identity (Decision 104/169), so run_scaffold records the step name in a separate
  accumulator; the scaffold names are the closed tuples in scripts/checks/registry.py (_PRE_TIER_LEADING_SCAFFOLDS,
  _PRE_TIER_TRAILING_SCAFFOLDS, _FULL_TIER_SKELETON). validation_result.clear() runs only in the full tier
  (validate.py:226-228); --pre relies on a fresh process, so tests reset both accumulators.
- >-
  Pre-commit: pinned, not wrapped. Wrapping cannot cover git-commit-time failures, which never pass through validate.py.
  pre-commit prints "- hook id: <id>" for a failing hook and also for a verbose passing one, so the block rule requires
  a non-zero exit code line or the files-modified line (pre_commit/commands/run.py, 4.6.2). The pre-commit scaffolds
  (precommit_changed, precommit_all_files) ALSO get a gate marker: in --pre, pre-commit's per-hook block prints early
  and inline (_scaffolding.py:136-148), so only the summary marker reliably lands in the output tail, and it also covers
  a pre-commit infrastructure failure that prints no per-hook block.
- >-
  Consumers: P-B parses markers from the FULL tool output (sidecar when persisted). The window and the event shape
  (parent tool_call, role gate_event.<n>) are P-B's, with two hand-offs: a pre-commit per-hook block can sit anywhere in
  a validate run's output (only the gate marker is at the tail), and whole-line markers are not tied to the process
  that printed them, so P-B scopes parsing to Bash calls that run the gates or declares the noise. tests/telemetry/test_process_event_name_rule.py already checks
  gate:<check> and precommit:<id> names; this plan adds scaffold names and the marker round trip.
- >-
  Known gaps (declared, no rec owed): a budget_assertion exit happens inside the scaffold before the summary
  (validate.py:505, :535, :548), so that run prints no markers; budget breaches are already recorded durably by their own
  rec filing and CI step-summary notice (Decision 153). --terraform-only dispatches no registered check,
  so it prints none. No ports.yaml row is owed: src/turn_capture is producer code, not executor, adapter or port code
  (Decision 212; P-B's scout reached the same reading).
- "Deploy-inert: src/turn_capture is excluded from data-pipeline.zip; scripts/ is not Lambda-packaged (Decision 79)."
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- Decisions 128, 169, 170 and 210 (only the cited clauses) read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Create src/turn_capture/markers.py with these pinned rules. SIGNATURE_PATTERN = "[A-Za-z0-9_][A-Za-z0-9_.-]{0,199}".
  Gate line: exactly "GATE-FAILURE v1 source=gate check=<sig>" as a whole line, after stripping ANSI CSI escape
  sequences and a trailing carriage return; any other version, extra token or leading text is not a marker.
  Pre-commit block: a whole line "- hook id: <sig>" opens a block that continues over the immediately following lines
  that start with "- "; the block is a failure iff it holds "- exit code: <n>" with n a non-zero integer, or exactly
  "- files were modified by this hook". parse_markers returns Marker(source, signature, line) in line order, line being
  the 0-based index in the input text. format_gate_marker raises ValueError on a check that does not fully match.
- >-
  In scripts/checks/validation_result.py add _SCAFFOLD_FAILURES (cleared in clear()), run_scaffold, failure_markers
  (unique check names from _ATTRIBUTIONS in first-seen order, then unique scaffold names in first-seen order,
  each through markers.format_gate_marker) and print_failure_summary, which prints "Failed checks:", one
  "  - <label>" line per entry of failed (unchanged), then one marker line per failure_markers() entry.
- >-
  In scripts/validate.py replace the three summary blocks and the two scaffold dispatch calls as the scope row says;
  change nothing else.
- >-
  Write the four test modules in scope (node names as in the verification plan). In tests/test_gate_failure_markers.py
  the pre-commit dependency is skipped NODE-locally (pytest.importorskip inside
  test_real_precommit_failure_output_parses_to_hook_id), never at module level, so the file stays collectable in the
  venv-less pr-validate tier where steps 1 and 2 run; that node points PRE_COMMIT_HOME at tmp_path.
  tests/checks/test_validation_result.py has 87 SLOC of headroom under 500 (Decision 130): keep its additions within
  it, and extend its autouse reset fixture to clear _SCAFFOLD_FAILURES. Step 2's node also asserts the scaffold names
  (registry.py _PRE_TIER_LEADING_SCAFFOLDS, _PRE_TIER_TRAILING_SCAFFOLDS, _FULL_TIER_SKELETON) are disjoint from
  all_checks(), since both print as check=<name>. Every test that prints a marker captures its output (capsys or
  capture_output) and uses synthetic check names no friction rule keys on (never validate_scope_boundary).
- Execute Verification Plan steps 1-6 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure sequence (implement skill, git-ops handoff_sequence), each outcome reported on its own: run the code-review
  gate (fresh sibling subagent); run scripts.session.github_readiness and report each state separately (unknown is
  unproven, never PASS); set implementation_declared true in this plan; rebase onto origin/main; write the
  retrospective evidence and run scripts.session.postflight --evidence; then VP step 7, the full tier on the committed,
  rebased, clean tree to completion, then scripts.checks.validation_result --verify-head exit 0. Any review-fix commit
  reruns both; a timeout is BLOCKED, never skipped. Push, open the PR, wait for CI by subscription, squash-merge; report
  push, PR, CI and merge outcomes separately.
- >-
  Closeout: add an update_rec note on rec-4172 (ops portal) naming what landed (markers.py grammar, validate summary
  markers, the pinned pre-commit lines) and that PLAN-telemetry-parser-v3 declares the per-version prefixes and resolves
  it; leave it open.
- 'Report: what was implemented and the verification results.'
work_areas: []
rollback: >-
  Revert the squash commit. Nothing persists outside the repository: markers are printed text and no producer reads them
  until P-B merges.
