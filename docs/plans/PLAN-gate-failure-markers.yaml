schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: gate-failure-markers
intent: >-
  Make this repository's gates self-describing (rec-4172): when scripts/validate.py fails, its summary prints one
  structured, versioned marker line per failed registered check or scaffold step (identifiers only), and pre-commit's own
  per-hook failure lines are pinned as the pre-commit grammar. Both are declared once in a stdlib grammar module the
  Claude Code turn-capture producer reads, so parser_version 3 (slice 3b plan P-B) can record gate:<check> and
  precommit:<hook> friction facts from structured markers, never from free text (W3 ruling friction-k3 (a)). Friction
  signals are the learning input for the platform's recursive self-improvement loop (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-gate-failure-markers.yaml
phase: >-
  T3.20 (agent-turn telemetry capture) groundwork, slice 3b plan P-A of three (Benjamin, 2026-10-12). Closes no exit
  criterion: P-B (parser_version 3) closes T3.20:c4 and P-C (hooks and transport) closes c1, c2 and c8. rec-4172 is
  resolved by P-B's merge, which also declares the per-version signature prefixes rec-4172 requires.
scope:
- file: src/turn_capture/markers.py
  action: Create
  purpose: >-
    Stdlib-only grammar module (the single declared home of both grammars; it lives in src/turn_capture because that
    package may import nothing outside itself and scripts -> src.turn_capture is the allowed direction). Defines
    GATE_MARKER_PREFIX "GATE-FAILURE" (brand-neutral, Decision 198), GATE_MARKER_VERSION 1, SIGNATURE_PATTERN (the
    process_event signature class), format_gate_marker(check) -> "GATE-FAILURE v1 source=gate check=<check>" (ValueError
    unless check fully matches SIGNATURE_PATTERN), and parse_markers(text) -> ordered list of Marker(source, signature,
    line) per the pinned rules in execution_steps.
- file: scripts/checks/validation_result.py
  action: Modify
  purpose: >-
    Owner of failure attribution (Decision 170). Adds the _SCAFFOLD_FAILURES accumulator (reset by clear()),
    run_scaffold(name, failed, fn), failure_markers() and print_failure_summary(failed). _ATTRIBUTIONS, the evidence
    record and its failed_checks/failed_check_attributions v2 shape stay byte-for-byte unchanged (Decision 142).
- file: scripts/validate.py
  action: Modify
  purpose: >-
    The three "Failed checks:" summary blocks (terraform-only, --pre, full) become one
    validation_result.print_failure_summary(failed) call each, and the two scaffold dispatch sites
    (run_python_checks and the --pre loop) call validation_result.run_scaffold(step.name, failed, scaffold_fns[step.name]).
    Net SLOC goes down (474 today, Decision 128).
- file: tests/turn_capture/test_markers.py
  action: Create
  purpose: >-
    Mirror test for markers.py (Decision 131): round trip, identifier rejection, whole-line matching, ANSI and CRLF
    tolerance, pre-commit block parsing, and SIGNATURE_PATTERN derived-equal to the contract's process_event class.
- file: tests/checks/test_validation_result.py
  action: Modify
  purpose: >-
    Covers run_scaffold, failure_markers (order, de-duplication, scaffold names after check names), clear() resetting
    the scaffold accumulator, and print_failure_summary's exact output.
- file: tests/validate/test_gate_failure_summary.py
  action: Create
  purpose: >-
    Drives validate.main() through --pre, the full tier and --terraform-only with stubbed sequences: the summary prints
    one marker per failed check and per failed scaffold step after the unchanged label lines; nothing on success.
- file: tests/test_gate_failure_markers.py
  action: Create
  purpose: >-
    rec-4172's acceptance node file: one marker per failed check and none on success through the real dispatch path;
    every registry check name, every scaffold step name and every .pre-commit-config.yaml hook id formats to a marker
    that parses back and whose <source>:<name> fits the contract pattern read from telemetry_observations.yaml; real
    pre-commit 4.6.2 failure output (a failing local fixture hook in a temporary repository) parses to the hook id.
- file: config/agent/verification_registry/entries/gate-failure-marker-per-failed-check.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 1. check_id gate-failure-marker-per-failed-check (filename equals
    check_id, Decision 176), primitive_slot command_exit_zero, check_spec.command is step 1's pytest node, guard_target
    scripts/checks/validation_result.py, guard_symbol null, plan_slug gate-failure-markers, graduated_by implement-agent.
- file: config/agent/verification_registry/entries/gate-marker-names-fit-process-event-pattern.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 2. check_id gate-marker-names-fit-process-event-pattern,
    primitive_slot command_exit_zero, check_spec.command is step 2's pytest node, guard_target src/turn_capture/markers.py,
    guard_symbol null, plan_slug gate-failure-markers, graduated_by implement-agent.
- file: config/agent/verification_registry/entries/gate-failure-summary-wired-in-validate-main.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 4. check_id gate-failure-summary-wired-in-validate-main,
    primitive_slot command_exit_zero, check_spec.command is step 4's pytest command, guard_target scripts/validate.py,
    guard_symbol null, plan_slug gate-failure-markers, graduated_by implement-agent.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  A failing registered check in --pre or the full tier makes the summary print exactly one line
  "GATE-FAILURE v1 source=gate check=<check name>" for that check after the unchanged "Failed checks:" label list; a
  failing scaffold step (including precommit_changed and precommit_all_files) prints one such line with its step name;
  a clean run prints none. A run that exits inside budget_assertion (validate.py:505, :535, :548) prints neither labels
  nor markers, as today.
- >-
  markers.parse_markers returns a Marker with source "gate" and the check name for every printed marker line, and
  one with source "precommit" and the hook id for every pre-commit hook block that carries a non-zero exit code or the files-modified line, proven against real pre-commit
  4.6.2 output; free text, partial lines and other versions are never returned.
- >-
  markers.SIGNATURE_PATTERN equals the signature class of telemetry_observations.yaml's process_event name pattern
  (read from the contract in the test), and every check, scaffold and pre-commit hook name fits that pattern as
  gate:<name> or precommit:<name>.
- >-
  The two stdout parsers of the summary block, scripts/ci_rca/taxonomy.py _parse_failed_checks_block and
  scripts/executor/run_summary.py _extract_validation_failed_checks, still return exactly the label list from the new
  summary output.
- >-
  validation-result.json and the _ATTRIBUTIONS shape are unchanged, scripts/validate.py's SLOC does not increase, and
  src/turn_capture stays stdlib-only (tests/turn_capture/test_package_boundary.py green).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run rec-4172's acceptance node for the real dispatch path: a stubbed failing check and scaffold through
    validation_result.dispatch_recording and run_scaffold, then print_failure_summary.
  command: >-
    bin/venv-python -m pytest tests/test_gate_failure_markers.py::test_one_marker_per_failed_check_and_none_on_success -q
  expected: >-
    Exit 0, 1 passed. Red before: the test file does not exist on the plan-only tree (pytest exit 4, target_absent).
  fix_if: >-
    Two markers for one check: failure_markers is not de-duplicating by check name. A marker on a clean run:
    print_failure_summary is called or prints markers when failed is empty.
  hermetic: true
  graduation: graduate
  graduation_check_id: gate-failure-marker-per-failed-check
  expected_literals:
  - 1 passed
- step: 2
  phase: pre-deploy
  action: >-
    Run the name-fit node: every registry check, scaffold step and pre-commit hook id round-trips through the grammar and
    fits the contract's process_event name pattern, read from docs/contracts/telemetry_observations.yaml.
  command: >-
    bin/venv-python -m pytest tests/test_gate_failure_markers.py::test_every_gate_and_precommit_name_fits_the_contract_pattern -q
  expected: >-
    Exit 0, 1 passed. Red before: target_absent (pytest exit 4).
  fix_if: >-
    A name fails the pattern: a new check, scaffold or hook id breaks the signature class; rename it, or widen the
    contract first through an amendment and a writer deploy (Decision 210 cl.4). A scaffold name collides with a check
    name: rename one. The contract read fails: the test hard-codes the regex instead of reading pattern_when.
  hermetic: true
  graduation: graduate
  graduation_check_id: gate-marker-names-fit-process-event-pattern
  expected_literals:
  - 1 passed
- step: 3
  phase: pre-deploy
  action: >-
    Run the real pre-commit node: a temporary git repository with a failing local hook (language fail) and a passing
    verbose hook, run through pre-commit 4.6.2; parse_markers must return only the failing hook id.
  command: >-
    bin/venv-python -m pytest tests/test_gate_failure_markers.py::test_real_precommit_failure_output_parses_to_hook_id -q
  expected: >-
    Exit 0, 1 passed. pre-commit is a dev-only dependency (requirements-dev.txt), so the node skips where it is absent.
  fix_if: >-
    No marker: pre-commit's per-hook lines changed (pre_commit/commands/run.py); re-pin the grammar and bump
    GATE_MARKER_VERSION only if the gate line also changes. The passing verbose hook parses: the block rule ignores the
    exit-code requirement.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A registry row would pass vacuously ("1 skipped") wherever pre-commit is absent (it is dev-only, not in
    requirements-fast.txt), and the node is side-effectful out of tree (hermetic_authoring (iv)): it runs git and
    pre-commit in a temporary repository with PRE_COMMIT_HOME pointed at tmp_path. The full tier runs it through the
    unit-test scaffold.
- step: 4
  phase: pre-deploy
  action: >-
    Run the validate.main() wiring nodes: --pre, full and --terraform-only summaries with stubbed sequences.
  command: >-
    bin/venv-python -m pytest tests/validate/test_gate_failure_summary.py::test_pre_tier_summary_prints_markers_after_labels
    tests/validate/test_gate_failure_summary.py::test_full_tier_summary_prints_markers_after_labels
    tests/validate/test_gate_failure_summary.py::test_clean_run_and_terraform_only_print_no_marker
    tests/validate/test_gate_failure_summary.py::test_stdout_consumers_still_read_only_the_labels -q
  expected: >-
    Exit 0, 4 passed. Red before: target_absent.
  fix_if: >-
    A summary site still prints its own label loop: one of the three blocks was not replaced. The scaffold marker is
    missing: a scaffold dispatch site still calls scaffold_fns[...]() directly. A consumer returns a marker as a label:
    a marker line starts with "- " after stripping.
  hermetic: true
  graduation: graduate
  graduation_check_id: gate-failure-summary-wired-in-validate-main
  expected_literals:
  - 4 passed
- step: 5
  phase: pre-deploy
  action: >-
    Run the three unit suites this plan creates or extends, whole-file.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_markers.py tests/checks/test_validation_result.py
    tests/validate/test_gate_failure_summary.py -q
  expected: >-
    Exit 0, all passed, none skipped.
  fix_if: >-
    A markers test fails: the pinned grammar in execution_steps is not what markers.py implements. A validation_result
    test fails: an accumulator survives clear() or failure_markers misorders.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-runs of this plan's own test files (vp-red-before.yaml hermetic_authoring (v)); the --pre pytest_diff
    and the full tier's unit-test scaffold run them on every change, so a registry row would duplicate that guard.
- step: 6
  phase: pre-deploy
  action: >-
    Prove the evidence shape and the module boundary are unchanged and validate.py did not grow.
  command: >-
    bin/venv-python -m pytest tests/validate/test_failed_check_attribution.py tests/turn_capture/test_package_boundary.py -q
    && bin/venv-python -c "import subprocess; base = subprocess.run(['git', 'show', 'origin/main:scripts/validate.py'],
    capture_output=True, text=True, check=True).stdout; count = lambda s: sum(1 for l in s.splitlines() if l.strip() and
    not l.strip().startswith('#')); new = count(open('scripts/validate.py', encoding='utf-8').read()); old = count(base);
    assert new <= old, (old, new); print('VALIDATE_SLOC_OK', old, new)"
  expected: >-
    Both pytest files pass, then the SLOC line prints with the new count at or below the base count.
  fix_if: >-
    Attribution tests fail: _ATTRIBUTIONS or dispatch_recording changed shape. SLOC grew: a summary block kept a loop.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    Lint the changed Python files and run the full tier, as the handoff policy requires before commit.
  command: >-
    bin/venv-python -m ruff check src/turn_capture/markers.py scripts/checks/validation_result.py scripts/validate.py
    tests/turn_capture/test_markers.py tests/checks/test_validation_result.py tests/validate/test_gate_failure_summary.py
    tests/test_gate_failure_markers.py && bin/venv-python -m scripts.validate
  expected: >-
    ruff exit 0, then the full tier ends with "All checks passed." and exit 0.
  fix_if: >-
    Any failure: fix at root and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
