      conflict markers); run_auto copies the non-ok literal into results["status"]. Never auto-resolves. (c)
      run_validate non-zero -> validate_failed. (d) NEW named seam run_verify_head() runs `[_common.PYTHON, "-m",
      "scripts.checks.validation_result", "--verify-head"]` through _common._run (same transport as run_validate), prints
      its output and returns its exit code; non-zero -> evidence_mismatch. RETIRE the post-push log-housekeeping leg
      from run_auto: nothing under logs/ is tracked (Decision 84 made the JSONL files read caches), so it is a no-op today
      and, if it ever fired, a commit-and-push of an unvalidated tree; the standalone --log-housekeeping CLI and
