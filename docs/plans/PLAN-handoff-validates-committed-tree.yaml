schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: handoff-validates-committed-tree
intent: >-
  Make the mandatory pre-handoff full-tier run (Decision 163) validate the exact COMMITTED tree that ships instead of an
  uncommitted working tree: /implement commits, rebases, runs the full tier on a clean committed tree, verifies the
  evidence attests that tree, and only then pushes -- and validation-result.json records the tree identity and
  cleanliness that make that attestation checkable. The mechanical push gate that enforces it is the sibling
  PLAN-handoff-evidence-gate (slice 2b).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-handoff-validates-committed-tree.yaml
phase: >-
  Soft-warn exception category ci_rca (hardening follow-on from the rec-4057/rec-4066 root cause; sibling
  PLAN-ci-rca-rec-trailer-acceptance-coverage); names NO tier_item, so the Tier Item Freshness Gate is skipped. T2.54
  (clause-to-check traceability) is cited, not claimed. Bundles rec-3033. Slice 2a of 2 (human-chosen split after
  plan-critique round 1 of the combined plan); 2b is PLAN-handoff-evidence-gate.
scope:
  - file: scripts/checks/validation_result.py
    action: Modify
    purpose: >-
      (1) Anchor RESULT_PATH at scripts.checks._common.ROOT (the invoking worktree), never the process cwd, and run every
      git probe with cwd=_common.ROOT -- the two halves of rec-3033's foreign-evidence shape. Every git probe KEEPS the
      `validation_result.subprocess.run` transport (six existing tests intercept it there; moving to _common.run would
      break test_write_completed_is_bounded_atomic_and_secret_free's git_head assertion).
      (2) clear(path: Path | None = None) resolves None to the module-level RESULT_PATH AT CALL TIME (today the default is
      bound at def time, so monkeypatching RESULT_PATH never redirects it). clear() -- already called exactly once at
      full-tier start by scripts/validate.py -- also snapshots head_tree_at_start (`git rev-parse HEAD^{tree}`) and
      tree_clean_at_start (`git status --porcelain` empty; .gitignore respected), held IN MEMORY (module state, like
      _ATTRIBUTIONS) and never on disk -- the full tier's own validate_vp_replay may touch the evidence path mid-run.
      (3) write_completed() adds head_tree_at_start, head_tree_at_end, tree_clean_at_start, tree_clean_at_end and
      worktree_toplevel, bumping schema_version 3 -> 4 ADDITIVELY: failed_checks and failed_check_attributions stay
      byte-identical in shape for the CI-RCA Priority-0 consumer (Decision 170 clause 1, T1.13; scripts/ci_rca/taxonomy.py
      keys on field names, never on schema_version); git_head is kept.
      (4) The 2b-facing interface, exported and documented as such: evidence_path_for(toplevel: Path) -> Path (the
      evidence file of an ARBITRARY worktree -- RESULT_PATH only names the importing one); load_record(path) ->
      tuple[dict | None, str] returning (record, "ok") or (None, "missing" | "unreadable"); and a pure predicate
      attests_head(record, *, head_tree, toplevel) -> (bool, rule) -- true only for scope "all", exit_code 0, empty
      failed_checks, both clean flags true, head_tree_at_start == head_tree_at_end == head_tree, and worktree_toplevel ==
      toplevel. `rule` is a STABLE code from a module-level ATTEST_RULES tuple (missing, unreadable, schema, scope,
      worktree, dirty_start, dirty_end, head_moved, tree_mismatch, failed_run, ok), evaluated in that order so failed_run
      is returned ONLY when every identity rule holds (slice 2b may branch on it). Plus a thin CLI `bin/venv-python -m
      scripts.checks.validation_result --verify-head` that composes load_record + attests_head against the current HEAD's
      tree and toplevel, printing the rule and exiting 0 only on "ok". scripts/validate.py needs no change. 96 SLOC today.
  - file: tests/checks/test_validation_result.py
    action: Modify
    purpose: >-
      test_write_completed_records_head_tree_and_clean_flags (schema_version 4, all five fields, v3 fields unchanged);
      test_git_head_resolves_from_invoking_worktree -- rec-3033's acceptance node, VERBATIM name, MODULE-LEVEL (never
      inside a class: the Decision 201 trailer evaluator runs exactly that node id) -- which `git init`s a TMP repository
      under tmp_path and runs `git worktree add` against THAT repository only (never the real checkout: that would write
      its .git/worktrees), with _common.ROOT pointed at the added worktree (setup commits via `git -c
      commit.gpgsign=false -c user.name=t -c user.email=t@example.invalid`); test_result_path_is_anchored_at_root;
      test_clear_default_resolves_at_call_time; load_record's three outcomes; and TestAttestsHead covering every
      predicate rule, including test_rejects_evidence_for_a_different_tree (graduated, VP step 1) built from two real
      distinct trees, never a mocked hash, plus the --verify-head CLI's exit codes. RE-SEAT
      test_write_completed_emits_schema_v3_with_failed_check_attributions (L121-139): its two `schema_version == 3`
      asserts become 4 and its failed_check_attributions asserts stay VERBATIM (the Priority-0 pin); keep its name
      (renaming churns a node id for no behaviour). The same MagicMock(stdout="abc123\n") now also answers the new
      status/toplevel probes, which is harmless to the existing asserts.
  - file: tests/checks/registry/test_accounting.py
    action: Modify
    purpose: >-
      Its five validation_result.clear() calls (lines 19, 83, 100, 152, 178) use the default RESULT_PATH, so any pytest
