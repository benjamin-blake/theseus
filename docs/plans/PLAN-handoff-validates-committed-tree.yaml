schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: handoff-validates-committed-tree
intent: >-
  Make the mandatory pre-handoff full-tier run (Decision 163) attest the exact committed tree that ships, and enforce it
  deterministically at the push/PR boundary instead of by skill prose: /implement commits first, rebases, runs the full
  tier on a clean committed tree, and only then pushes -- and a fail-closed gate refuses any push or remote write whose
  tree the evidence does not attest.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-handoff-validates-committed-tree.yaml
phase: >-
  Soft-warn exception category ci_rca (hardening follow-on from the rec-4057/rec-4066 root cause; sibling
  PLAN-ci-rca-rec-trailer-acceptance-coverage); names NO tier_item, so the Tier Item Freshness Gate is skipped. T2.54
  (clause-to-check traceability) is cited, not claimed: this plan's new contract clause names its enforcing check per
  T2.54:c1. Bundles rec-3033.
scope:
  - file: scripts/session/handoff_evidence.py
    action: Create
    purpose: >-
      The ONE shared checker both enforcement layers delegate to (Decision 162 thin-adapter spirit; no logic in hooks).
      Pure decision function plus CLI: `--check-push` (harness Bash and pre-push callers; reads pre-push stdin refs when
      given, else HEAD), `--check-remote-write --paths ...` (MCP direct-write tools), `--check-pr --head <branch>`. Rules,
      in order: (1) a push that only deletes a ref (all-zero local sha / --delete) is allowed; (2) the pushed diff vs
      merge-base(origin/main, pushed sha) is EXEMPT when every path matches git-ops.yaml::handoff_evidence_gate
      .exempt_path_globs READ FROM origin/main via `git show origin/main:docs/contracts/git-ops.yaml` (never the working
      tree -- Decision 187: a push that widens the exempt set must not exempt itself), and it is NEVER exempt when it
      touches docs/contracts/git-ops.yaml, .claude/settings.json, .pre-commit-config.yaml,
      .claude/hooks/handoff_evidence_gate.py, .claude/hooks/session_start_precommit.sh or this module; (3) otherwise
      require <worktree toplevel>/logs/debug/validation-result.json with scope "all", exit_code 0, empty failed_checks,
      tree_clean_at_start AND tree_clean_at_end true, head_tree_at_start == head_tree_at_end == the pushed sha's tree
      (`git rev-parse <sha>^{tree}`), and worktree_toplevel equal to the pushing worktree's toplevel (Decision 25
      parallel worktrees). Every git probe runs with cwd = the pushing worktree. Missing, unreadable, malformed or
      mismatched evidence BLOCKS with a remediation message naming the failed rule and the commit-first sequence; a
      remote-write of non-exempt paths always blocks (its content never existed locally); update_pull_request_branch
      always blocks (merge origin/main locally, validate, push). Target < 250 SLOC.
  - file: .claude/hooks/handoff_evidence_gate.py
    action: Create
    purpose: >-
      Thin PreToolUse adapter. For Bash: reuse never_on_main.py's command-splitting shape to find a `git ... push`
      segment (compound, env-prefixed, -C/--git-dir forms); DENY any push segment carrying --no-verify outright;
      otherwise call the shared checker. For mcp__github__ / mcp__github-full__ create_pull_request (checks the head
      branch's remote-tracking tip), push_files / create_or_update_file / delete_file (paths from tool_input) and
      update_pull_request_branch: call the checker. Exit 2 with the checker's message to block; exit 0 to allow. FAIL
      CLOSED when the checker itself errors on a push-shaped call; a tool input that is not push-shaped (or not parseable
      as one) is allowed, as never_on_main.py does.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Register the gate as a NEW PreToolUse entry whose matcher is
      "Bash|mcp__github(-full)?__(create_pull_request|push_files|create_or_update_file|delete_file|update_pull_request_branch)"
      running `bin/venv-python .claude/hooks/handoff_evidence_gate.py`. Leave the existing entry (never_on_main,
      fresh_branch_base, edit_scope_guard, scheduled_agent_log_only) byte-identical (Decision 138: augment, never replace).
  - file: .pre-commit-config.yaml
    action: Modify
    purpose: >-
      Add top-level `default_stages: [pre-commit]` so every existing hook stays commit-only, and a repo:local hook
      `handoff-evidence-gate` (language system, stages [pre-push], pass_filenames false, always_run true, entry
      `bin/venv-python -m scripts.session.handoff_evidence --check-push`) -- the layer that catches pushes the harness
      cannot see (scripts/session/postflight.py's subprocess push, non-harness clones). The checker reads git's pre-push
      stdin refs (or PRE_COMMIT_TO_REF) for the pushed sha.
  - file: .claude/hooks/session_start_precommit.sh
    action: Modify
    purpose: >-
      Install both hook types each session: `pre-commit install --hook-type pre-commit --hook-type pre-push`. This is the
      ONLY installer of the pre-push layer -- the executor carve-out Decision 163 point 3 keeps (named in git-ops.yaml);
      humans keep `git push --no-verify` as their escape hatch.
  - file: scripts/checks/validation_result.py
    action: Modify
    purpose: >-
      clear() -- already called exactly once at full-tier start by scripts/validate.py -- also snapshots
      head_tree_at_start (git rev-parse HEAD^{tree}) and tree_clean_at_start (`git status --porcelain` empty; .gitignore
      respected); write_completed() adds head_tree_at_end, tree_clean_at_end, head_tree_at_start, tree_clean_at_start and
      worktree_toplevel, bumping schema_version 3 -> 4 ADDITIVELY (failed_checks / failed_check_attributions stay
      byte-identical for the CI-RCA Priority-0 consumer, Decision 170 clause 1). Every git probe here runs with
      cwd=scripts.checks._common.ROOT (the invoking worktree), never the process cwd -- the rec-3033 fix; keep git_head for
      compatibility. scripts/validate.py itself needs no change. 96 SLOC today.
  - file: scripts/session/postflight.py
    action: Modify
    purpose: >-
      run_auto reorders to sanity/close -> evidence -> metrics -> commit -> (fetch + rebase onto origin/main) -> full
      tier -> push, returning validate_failed WITHOUT pushing when the post-commit full tier fails. Keep its
      config/coverage_baseline.yaml 84.4% floor (never lower it). 388 SLOC today; stay under 500.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Reorder "Run the full gate locally first" and the IMPLEMENTATION Commit Flow so the full tier runs AFTER `git add -A;
      git commit; git fetch origin main; git rebase origin/main` and BEFORE `git push`; the red-CI fix loop becomes
      fix -> commit -> full tier -> push; replace "current pre-commit HEAD" with a pointer to
      docs/contracts/git-ops.yaml::handoff_evidence_gate. PROSE BUDGET: 35,400 of 35,402 bytes
      (config/prose_budgets.yaml, ratchet-down only) -- the edit must be byte-neutral or shrink; relocate procedure detail
      into the git-ops.yaml clause (Decision 86), never raise the budget. Keep exactly one full-tier invocation, inside
      the closure (pinned by tests/test_workflow_skill_antidrift.py::test_full_tier_runs_once_and_only_in_the_step7_closure).
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Rewrite the "One-full-tier rule" paragraph: still one full run per push, now on the committed, rebased, clean tree;
      delete "no commit has happened at that point" and restate the cost basis as per push (every rebase or fix commit
      needs a fresh run). Keep the literal phrase "One-full-tier rule" (anti-drift pinned).
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Class D contract (Decision 168). Add `handoff_evidence_gate:` carrying the handoff sequence, the evidence fields,
      `exempt_path_globs: [docs/plans/**, docs/audit-prompts/**, docs/ROADMAP-PLATFORM.yaml]` with the base-ref read rule
      and the never-exempt self-protection list, `enforcing_checks` naming .claude/hooks/handoff_evidence_gate.py and the
      pre-push hook id handoff-evidence-gate, both delegating to scripts/session/handoff_evidence.py (T2.54:c1), and a
      Decision 181 per-surface coverage table: harness Bash git push [enforced]; harness MCP create_pull_request /
      push_files / create_or_update_file / delete_file / update_pull_request_branch [enforced]; subprocess and non-harness
      git push [enforced by pre-push]; human --no-verify [unenforced by design]; server-side merge on red [residual,
      rec-4080 / rec-2827]; per-file coverage floor in PR CI [residual, rec-3221]; executor loop [carve-out, Decision 67
      freeze]. Update push_pr_ci_merge_flow.steps (validate before push; red-fix loop re-validates). Add an
      amendment_log entry, bump contract_version 3 -> 4, and add the new hook and module paths to referenced_repo_paths.
  - file: docs/contracts/check-accounting.yaml
    action: Modify
    purpose: >-
      Add validation_result_schema_v4 (additive over v3: the five new fields) with an amendment_log entry; v3's pins are
      unchanged.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Mint Decision 202 (or the next free number at implement time -- numbering race) with the typed envelope
      (number, significance: numbered_decision + justification naming git-ops.yaml as the rejected contract-only home and
      decision-entry.yaml amendment_forms on Decision 163 as the rejected annotation route, per the Decision 181 routing
      precedent for a separately-reversible instance of 163's principle; amends: [163]). Content: validation evidence
      attests the pushed tree; commit-first order; fail-closed push/remote-write gate with no agent override; per-push
      cost basis; executor carve-out. Reversal conditions: (a) a false block of a correct handoff -> fix the checker,
      never add an agent override; (b) a full-tier PR-CI job lands (rec-3221) -> narrow the local gate to that
      verdict; (c) the executor goes live (Decision 67 reversal) -> re-derive the per-push cost basis. Add a dated
      "Amended by Decision 202" annotation line on Decision 163 (Decision 177 amendment_forms; never edit 163's body).
  - file: tests/test_session_handoff_evidence.py
    action: Create
    purpose: >-
      Mirror home (map_source_to_test resolves scripts/session/*.py to the grandfathered tests/test_session_<stem>.py).
      Real tmp git repositories with a bare `origin` (setup commits via `git -c commit.gpgsign=false -c user.name=t -c
      user.email=t@example.invalid`; GITHUB_EVENT_* cleared). TestPushDecision covers: matching evidence allows;
      test_blocks_when_evidence_tree_differs_from_pushed_tree (graduated); missing / malformed / failed / scope-pre
      evidence blocks; dirty-at-start or dirty-at-end blocks; head moved during the run blocks; foreign worktree_toplevel
      blocks; ref deletion allowed. TestExemptSet covers: plan-only and audit-only diffs allowed without evidence;
      test_exempt_set_is_read_from_base_ref_not_worktree (graduated: widening exempt_path_globs in the working tree does
      not exempt the push); touching any never-exempt path defeats the exemption. TestRemoteWrites covers non-exempt
      paths blocked, exempt paths allowed, update_pull_request_branch always blocked.
  - file: tests/hooks/test_handoff_evidence_gate.py
    action: Create
    purpose: >-
      Adapter tests driving the hook as a subprocess with JSON stdin: test_git_push_denied_without_matching_evidence;
      compound / env-prefixed / -C push forms detected; --no-verify denied; non-push Bash allowed; each MCP tool name on
      both servers routed; a checker exception on a push-shaped call blocks (exit 2);
      test_settings_registers_gate_on_push_and_remote_write_tools (parses .claude/settings.json: new entry present,
      matcher covers all eleven tool names, the pre-existing entry unchanged).
  - file: tests/hooks/test_session_start_precommit.py
    action: Create
    purpose: >-
      test_installs_pre_push_hook_type (the installer passes both --hook-type values);
      test_pre_push_stage_runs_handoff_gate_and_existing_hooks_stay_commit_only (parses .pre-commit-config.yaml:
      default_stages [pre-commit]; the handoff-evidence-gate hook is stages [pre-push] with the checker entry).
  - file: tests/checks/test_validation_result.py
    action: Modify
    purpose: >-
      test_write_completed_records_head_tree_and_clean_flags (schema_version 4, all five fields, v3 fields unchanged) and
      test_git_head_resolves_from_invoking_worktree -- rec-3033's acceptance node, VERBATIM name -- proving git probes
      resolve from the invoking worktree (a real `git worktree add` in tmp_path with ROOT pointed at it).
  - file: tests/session/postflight/test_auto.py
    action: Modify
    purpose: >-
      test_auto_commits_before_full_tier_and_pushes_only_after_pass (call order commit < validate < push via a shared
      call recorder) and a validate-after-commit failure that returns validate_failed without calling push; re-seat
      existing tests that assumed validate-first.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_handoff_full_tier_runs_after_commit_and_rebase: in the implement skill, the IMPLEMENTATION Commit Flow block
      orders `git commit` < `git rebase origin/main` < the full-tier invocation < `git push`; "pre-commit HEAD" appears in
      neither the skill nor the command; the command no longer says "no commit has happened". The existing
      test_full_tier_runs_once_and_only_in_the_step7_closure must keep passing unchanged.
  - file: config/agent/verification_registry/entries/handoff-evidence-tree-binding.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 1: check_id handoff-evidence-tree-binding, guard_target
      scripts/session/handoff_evidence.py, guard_symbol the pure decision function, check_spec.node_id
      tests/test_session_handoff_evidence.py::TestPushDecision::test_blocks_when_evidence_tree_differs_from_pushed_tree.
  - file: config/agent/verification_registry/entries/handoff-exempt-set-from-base-ref.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 2: check_id handoff-exempt-set-from-base-ref, check_spec.node_id
      tests/test_session_handoff_evidence.py::TestExemptSet::test_exempt_set_is_read_from_base_ref_not_worktree.
bundled_recommendations:
  - rec-3033
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The /implement handoff order is commit -> fetch + rebase -> full tier on a clean tree -> push in the skill, the command
    and postflight --auto alike, with exactly one full-tier invocation per push, and the anti-drift test pins it.
  - >-
    validation-result.json (schema_version 4) records head_tree_at_start/end, tree_clean_at_start/end and
    worktree_toplevel additively; failed_checks and failed_check_attributions are byte-identical in shape to v3.
  - >-
    A push (harness Bash, subprocess, or MCP remote write) whose non-exempt content is not attested by passing, clean,
    tree-matching evidence from the same worktree is refused by the shared checker, through both the PreToolUse hook and
    the pre-push hook; --no-verify is refused to agents.
  - >-
    Plan-only and audit-only pushes are allowed without evidence, the exempt set is read from origin/main, and a push that
    widens it or touches the gate's own files or registrations is never exempt.
  - >-
    rec-3033's acceptance node exists under its exact name and passes.
  - >-
    SKILL.md stays within its 35,402-byte prose budget with no raise; every touched Python file stays within its SLOC and
    coverage floors (postflight.py's 84.4% baseline not lowered).
  - >-
    docs/contracts/git-ops.yaml carries handoff_evidence_gate with enforcing_checks and the per-surface coverage table,
    contract_version 4, an amendment_log entry and the new referenced_repo_paths; Decision 202 (or next free) is minted
    with a conformant envelope and Decision 163 carries a dated amendment annotation.
  - >-
    After merge, in a session whose harness loaded the new settings, an agent `git push` of an unvalidated non-exempt
    commit is refused by the PreToolUse gate, and a subprocess push of the same commit is refused by the pre-push hook.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the graduated core invariant -- evidence for a different tree never authorizes a push.
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py::TestPushDecision::test_blocks_when_evidence_tree_differs_from_pushed_tree -q
    expected: >-
      Exit 0 with a one-test pass summary. On the un-implemented tree the module and node do not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      A pass that does not build a real tmp repository with two distinct trees proves nothing -- reject a mocked tree hash.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-evidence-tree-binding
  - step: 2
    phase: pre-deploy
    action: >-
      Run the graduated self-protection invariant -- the exempt set is read from origin/main, so a push that widens it in
      the working tree is not exempted by its own widening (Decision 187).
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py::TestExemptSet::test_exempt_set_is_read_from_base_ref_not_worktree -q
    expected: >-
      Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      A failure here means the checker read git-ops.yaml from disk rather than `git show origin/main:...`.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-exempt-set-from-base-ref
  - step: 3
    phase: pre-deploy
    action: Run the checker's full decision table.
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py -q
    expected: Exit 0; every TestPushDecision, TestExemptSet and TestRemoteWrites case passes.
    fix_if: Read the failing rule; the table in the scope row is the specification.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Steps 1 and 2 graduate the two load-bearing invariants; a shard over the whole file would duplicate them and pin
      incidental cases (Decision 86).
  - step: 4
    phase: pre-deploy
    action: Run the adapter, registration and installer tests.
    command: bin/venv-python -m pytest tests/hooks/test_handoff_evidence_gate.py tests/hooks/test_session_start_precommit.py -q
    expected: Exit 0; push-form detection, --no-verify refusal, MCP routing, fail-closed and both registration tests pass.
    fix_if: >-
      A registration failure means settings.json or .pre-commit-config.yaml drifted from the scope rows; never loosen the
      matcher to make it pass.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The adapter only routes to the checker whose invariants steps 1-2 graduate; registration drift is also caught by
      validate_git_ops_contract binding the new referenced_repo_paths.
  - step: 5
    phase: pre-deploy
    action: Run the evidence-writer tests, including rec-3033's acceptance node.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py -q
    expected: >-
      Exit 0, including test_write_completed_records_head_tree_and_clean_flags and
      test_git_head_resolves_from_invoking_worktree.
    fix_if: >-
      A v3-field shape change is a Priority-0 consumer break (T1.13 / Decision 170) -- restore it byte-identically.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_test_coverage re-measures validation_result.py at 100% on every diff touching it, and rec-3033's own
      acceptance re-runs its node at closure; a shard would duplicate both.
  - step: 6
    phase: pre-deploy
    action: Run the postflight auto-flow and skill anti-drift tests.
    command: bin/venv-python -m pytest tests/session/postflight/test_auto.py tests/test_workflow_skill_antidrift.py -q
    expected: >-
      Exit 0, including test_auto_commits_before_full_tier_and_pushes_only_after_pass,
      test_handoff_full_tier_runs_after_commit_and_rebase and the unchanged
      test_full_tier_runs_once_and_only_in_the_step7_closure.
    fix_if: A failing pre-existing anti-drift test means the reorder dropped a pinned invariant -- restore it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both files are already standing suites run on every diff that touches them; a shard would duplicate them.
  - step: 7
    phase: pre-deploy
    action: >-
      Measure every touched Python module's per-file coverage with the checker validate_test_coverage delegates to
      (baseline-aware, so postflight.py is held at its 84.4% floor).
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files scripts/session/handoff_evidence.py
      scripts/checks/validation_result.py scripts/session/postflight.py
    expected: >-
      Exit 0 with the PASS diagnostic verdict.
    expected_literals:
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: A missing-test error means the new module's test is not at tests/test_session_handoff_evidence.py.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_test_coverage, which enforces the same floors whenever these files change.
  - step: 8
    phase: pre-deploy
    action: >-
      Run the fast tier (prose budget, SLOC, git-ops contract binding, Decision-entry conformance, shard admission,
      graduation completeness) on the COMMITTED tree -- an uncommitted plan or shard is invisible to the diff-derived
      legs, as this plan's own authoring session demonstrated.
    command: test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate --pre
    expected: >-
      The clean-tree assertion passes (everything is committed), then zero failed checks; validate_prose_limits passes
      SKILL.md at or under 35,402 bytes; validate_git_ops_contract binds the new paths; both shards ADMITTED.
    fix_if: >-
      Read the summary, never the exit code (Decision 73). A prose-budget failure means relocate text to git-ops.yaml --
      never add a raise marker.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate (recursion refusal) and its exit code is not a kernel assertion outside CI; constituent
      checks are registered in their own right.
  - step: 9
    phase: pre-deploy
    action: >-
      Dogfood the new order for this plan's own handoff: commit, fetch + rebase onto origin/main, run the full tier on the
      clean tree, then confirm the new checker attests it before pushing.
    command: >-
      test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate
      && bin/venv-python -m scripts.session.handoff_evidence --check-push
    expected: >-
      The clean-tree assertion passes, Validation Summary (scope: all) PASS, then the checker exits 0 naming the attested
      tree.
    fix_if: >-
      A dirty-tree refusal means something was edited after the commit -- commit it and rerun the full tier from the
      start. A timeout is BLOCKED per handoff_policy.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on this session's transient commit and evidence state and invokes scripts.validate (recursion refusal).
  - step: 10
    phase: post-deploy
    action: >-
      In the first session whose harness has loaded the merged settings.json (hooks load at session start), prove the
      harness layer: attempt an agent push of an unvalidated non-exempt commit to a throwaway LOCAL bare remote.
    command: >-
      B=$(mktemp -d) && git init -q --bare "$B" && git switch -q -c handoff-gate-probe origin/main
      && printf 'probe\n' > scripts/_handoff_gate_probe.txt && git add scripts/_handoff_gate_probe.txt
      && git -c commit.gpgsign=false commit -q -m probe && git push "$B" HEAD:refs/heads/probe
    expected: >-
      The whole tool call is refused by the PreToolUse gate before it runs (so no branch or commit is created), with a
      message naming handoff_evidence_gate and the missing or mismatched evidence rule.
    fix_if: >-
      If the call RUNS, the harness has not loaded the new entry (start a fresh session) or the matcher is wrong. Clean up
      any probe branch with `git switch -q - && git branch -q -D handoff-gate-probe`.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      Prove the pre-push layer catches a push the harness cannot see (a subprocess push to a local bare remote), then
      clean up the probe branch.
    command: >-
      B=$(mktemp -d) && git init -q --bare "$B" && git switch -q -c handoff-gate-probe origin/main
      && printf 'probe\n' > scripts/_handoff_gate_probe.txt && git add scripts/_handoff_gate_probe.txt
      && git -c commit.gpgsign=false commit -q -m probe
      && bin/venv-python -c "import subprocess, sys; r = subprocess.run(['git', 'push', sys.argv[1], 'HEAD:refs/heads/probe'], capture_output=True, text=True); print(r.returncode, r.stderr[-600:]); raise SystemExit(0 if r.returncode != 0 and 'handoff' in r.stderr.lower() else 1)" "$B";
      rc=$?; git switch -q - && git branch -q -D handoff-gate-probe; exit $rc
    expected: >-
      The subprocess push exits non-zero with the handoff-evidence-gate message from the pre-push hook; the step exits 0
      and the probe branch is deleted.
    fix_if: >-
      A successful subprocess push means the pre-push hook is not installed (check .git/hooks/pre-push after
      session_start_precommit.sh) or default_stages hid it. Never "fix" by exempting scripts/.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      Sync the new Decision into ops_decisions and confirm rec-3033 closed via the Resolves trailer (not escape-classified,
      so the trailer route applies once its acceptance node holds).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md --profile agent_platform
      && bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      row = make_reader(profile='agent_platform').named('rec_by_id', id='rec-3033')[0]; print(row['status']);
      assert row['status'] == 'closed'"
    expected: The backfill reports the new Decision written or current, and rec-3033 reads back closed.
    fix_if: >-
      rec-3033 still open after trailer-closure concludes: read the trailer-closure job log for a refusal marker and follow
      git-ops.yaml::resolves_trailer's conditional fallback -- never force-close around a refusal.
    hermetic: false
