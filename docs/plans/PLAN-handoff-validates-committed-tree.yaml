      rebase that rewrites already-published commits makes remote.run_push's plain `git push --set-upstream` fail
      non-fast-forward (push_failed after a green full tier); remote.py stays out of scope because the --auto remote leg
      is gh-CLI-based and dormant on CC-web -- owned by rec-4092. Keep the config/coverage_baseline.yaml 84.4% floor
      (never lower it; ~0.06pp headroom today, so every new arm needs a direct test -- test_auto.py row); stay under 500
      SLOC (388 today).
