schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: handoff-validates-committed-tree
intent: >-
  Make the mandatory pre-handoff full-tier run (Decision 163) validate the exact COMMITTED tree that ships instead of an
  uncommitted working tree: /implement commits, rebases, runs the full tier on a clean committed tree, verifies the
  evidence attests that tree, and only then pushes -- and validation-result.json records the tree identity and
  cleanliness that make that attestation checkable. The mechanical push gate that enforces it is the sibling
  PLAN-handoff-evidence-gate (slice 2b).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-handoff-validates-committed-tree.yaml
phase: >-
  Soft-warn exception category ci_rca (hardening follow-on from the rec-4057/rec-4066 root cause; sibling
  PLAN-ci-rca-rec-trailer-acceptance-coverage); names NO tier_item, so the Tier Item Freshness Gate is skipped. T2.54
  (clause-to-check traceability) is cited, not claimed. Bundles rec-3033. Slice 2a of 2 (human-chosen split after
  plan-critique round 1 of the combined plan); 2b is PLAN-handoff-evidence-gate.
scope:
  - file: scripts/checks/validation_result.py
    action: Modify
    purpose: >-
      (1) Anchor RESULT_PATH at scripts.checks._common.ROOT (the invoking worktree), never the process cwd, and run every
      git probe with cwd=_common.ROOT -- the two halves of rec-3033's foreign-evidence shape. (2) clear() -- already
      called exactly once at full-tier start by scripts/validate.py -- also snapshots head_tree_at_start
      (`git rev-parse HEAD^{tree}`) and tree_clean_at_start (`git status --porcelain` empty; .gitignore respected), held
      IN MEMORY (module state, like _ATTRIBUTIONS) and never on disk -- the full tier's own validate_vp_replay may touch
      the evidence path mid-run.
      (3) write_completed() adds head_tree_at_start, head_tree_at_end, tree_clean_at_start, tree_clean_at_end and
      worktree_toplevel, bumping schema_version 3 -> 4 ADDITIVELY: failed_checks and failed_check_attributions stay
      byte-identical in shape for the CI-RCA Priority-0 consumer (Decision 170 clause 1, T1.13); git_head is kept.
      (4) A pure predicate attests_head(record, *, head_tree, toplevel) -> (bool, rule) -- true only for scope "all",
      exit_code 0, empty failed_checks, both clean flags true, head_tree_at_start == head_tree_at_end == head_tree, and
      worktree_toplevel == toplevel. `rule` is a STABLE code from a module-level ATTEST_RULES tuple (missing, unreadable,
      schema, scope, worktree, dirty_start, dirty_end, head_moved, tree_mismatch, failed_run, ok), evaluated in that order
      so failed_run is returned ONLY when every identity rule holds -- slice 2b branches on it (failed_run is the
      "validated this exact tree but it was red" case its human release valve handles). Plus a thin CLI `bin/venv-python -m scripts.checks.validation_result --verify-head`
      that evaluates it against the current HEAD and toplevel, printing the failed rule and exiting 1 on any mismatch or
      on a missing/unreadable/pre-v4 record. This is the single attestation predicate slice 2b's gate imports; it lives
      with the record it interprets. scripts/validate.py needs no change. 96 SLOC today.
  - file: tests/checks/test_validation_result.py
    action: Modify
    purpose: >-
      test_write_completed_records_head_tree_and_clean_flags (schema_version 4, all five fields, v3 fields unchanged);
      test_git_head_resolves_from_invoking_worktree -- rec-3033's acceptance node, VERBATIM name -- using a real
      `git worktree add` under tmp_path with _common.ROOT pointed at it (setup commits via `git -c commit.gpgsign=false
      -c user.name=t -c user.email=t@example.invalid`); test_result_path_is_anchored_at_root; and TestAttestsHead covering
      every predicate rule, including test_rejects_evidence_for_a_different_tree (graduated, VP step 1) built from two
      real distinct trees, never a mocked hash, plus the --verify-head CLI's exit codes.
  - file: tests/checks/registry/test_accounting.py
    action: Modify
    purpose: >-
      Its five validation_result.clear() calls (lines 19, 83, 100, 152, 178) use the default RESULT_PATH, so any pytest
      run from the repo root DELETES the real logs/debug/validation-result.json -- once that file is the handoff
      credential, a post-full-tier test run would silently revoke it. Pass tmp_path-based paths (or monkeypatch
      validation_result.RESULT_PATH to tmp_path) in every call; assert nothing else changes.
  - file: scripts/session/postflight.py
    action: Modify
    purpose: >-
      run_auto reorders to: close/sanity -> evidence -> metrics -> commit -> rebase (NEW named seam run_rebase(): `git
      fetch origin main` then `git rebase origin/main`, returning a distinct rebase_failed status on conflict and never
      auto-resolving) -> full tier (run_validate) -> verify-head (NEW named seam run_verify_head(), delegating to
      scripts.checks.validation_result's --verify-head predicate) -> push -> portal sync. A failed full tier returns
      validate_failed and a failed verify-head returns evidence_mismatch, both WITHOUT pushing. RETIRE the post-push
      log-housekeeping leg from run_auto: nothing under logs/ is tracked (Decision 84 made the JSONL files read caches),
      so it is a no-op today and, if it ever fired, a commit-and-push of an unvalidated tree; the standalone
      --log-housekeeping CLI is left untouched. Update the module docstring (line 16), run_auto's docstring (line 277) and
      the --auto help text (line 421) to the new order. Keep the config/coverage_baseline.yaml 84.4% floor (never lower
      it); stay under 500 SLOC (388 today).
  - file: tests/session/postflight/test_auto.py
    action: Modify
    purpose: >-
      Add TestAutoMode::test_auto_commits_before_full_tier_and_pushes_only_after_pass (graduated, VP step 2): one shared call recorder
      proves commit < rebase < validate < verify-head < push, and that push is never called when validate or
      verify-head fails; add test_rebase_conflict_returns_rebase_failed_without_validating. RE-SEAT every existing test
      that reaches the commit leg -- patch session_postflight.run_rebase and session_postflight.run_verify_head alongside
      the existing run_validate/run_commit/run_push patches -- so no test runs a real `git fetch`, `git rebase`,
      `git add` or `git commit` against the checkout; test_validate_failure_stops_early now patches run_commit,
      run_rebase and housekeeping.run_metrics and asserts push is not called (validate now runs AFTER commit);
      delete test_auto_log_housekeeping_failure_ignored (the leg is retired) and drop the run_log_housekeeping patches.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Reorder "Run the full gate locally first" and the IMPLEMENTATION Commit Flow so the sequence is `git add -A; git
      commit; git fetch origin main; git rebase origin/main; bin/venv-python -m scripts.validate; bin/venv-python -m
      scripts.checks.validation_result --verify-head; git push`, with `git push` as ITS OWN tool call; the red-CI fix loop
      becomes fix -> commit -> full tier -> verify-head -> push; replace "current pre-commit HEAD" with a pointer to
      docs/contracts/git-ops.yaml::handoff_sequence. KEEP the heading "Run the full gate locally first" and exactly one
      backticked full-tier invocation (both pinned by
      tests/test_workflow_skill_antidrift.py::test_full_tier_runs_once_and_only_in_the_step7_closure). PROSE BUDGET:
      35,400 of 35,402 bytes (config/prose_budgets.yaml, ratchet-down only) -- the edit must be byte-neutral or shrink;
      relocate procedure detail into git-ops.yaml (Decision 86), never raise the budget. Leave the VF-08
      stop-and-surface (nondeterminism) note intact (T3.19).
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Rewrite the "One-full-tier rule" paragraph: still one full run per push, now on the committed, rebased, clean tree
      and followed by --verify-head; delete "no commit has happened at that point" and restate the cost basis as per push
      (every rebase or fix commit needs a fresh run); keep the literal phrase "One-full-tier rule" (anti-drift pinned).
      Replace Step 8's stale "Friction logs will be committed ... --log-housekeeping" paragraph with the Decision 84 fact:
      friction is filed to the warehouse through scripts.ops_data_portal, and nothing under logs/ is committed.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Add test_handoff_full_tier_runs_after_commit_and_rebase: in the implement skill the IMPLEMENTATION Commit Flow
      orders `git commit` < `git rebase origin/main` < the full-tier invocation < `--verify-head` < `git push`; "pre-commit
      HEAD" appears in neither the skill nor the command; the command no longer says "no commit has happened" or
      "--log-housekeeping". The existing test_full_tier_runs_once_and_only_in_the_step7_closure must pass unchanged.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Class D contract (Decision 168). Add `handoff_sequence:` -- the ordered steps (commit -> fetch + rebase -> full tier
      on a clean tree -> --verify-head -> push as its own tool call), the schema-4 evidence fields and attests_head's
      rules, the per-push cost basis, and an `enforcement_coverage` list reusing implement-scope-boundary.yaml's row shape
      (surface / status / enforced_by | residual_owner / note -- T2.54:c1's existing vocabulary, cited not claimed; never a
      new `enforcing_checks` key). Rows (Decision 181 point 2, honest): postflight --auto push [status mechanical,
      enforced_by run_verify_head -- code invokes attests_head before its push]; interactive /implement push [status
      residual_agent_obligation, residual_owner rec-4083 -- --verify-head runs only when the agent follows the skill until
      PLAN-handoff-evidence-gate lands]; server-side merge on red [residual_agent_obligation, residual_owner rec-4080];
      per-file coverage floor in PR CI [residual_agent_obligation, residual_owner rec-3221]. Update push_pr_ci_merge_flow.steps
      (validate + verify-head before push; the red-fix loop re-validates). Add an amendment_log entry, bump
      contract_version to the LIVE value + 1 at implement time (PLAN-trailer-acceptance-junit-verdict also bumps it --
      read the live value, never assume 3), and add scripts/checks/validation_result.py to referenced_repo_paths. SIZE:
      353 of 500 effective lines today (graduated shard new-contracts-within-structural-size-class), shared with slice B
      and 2b -- budget this clause at <= 45 effective lines. Never add a bare `claude/` outside agent_branch_prefixes
      (graduated shard git-ops-carries-no-stale-prefix-premise).
  - file: config/agent/verification_registry/entries/git-ops-trailer-carrier-and-placement-rules.yaml
    action: Modify
    purpose: >-
      Its check_spec greps `contract_version:[[:space:]]*3`; validate_verification_registry only replays added or
      modified shards, so a bump without re-pointing leaves a silently false shard. Replace that one grep with a
      version-agnostic `contract_version:[[:space:]]*[0-9]+` assertion (the version literal is not what this shard
      guards), keeping its other three greps byte-identical.
  - file: docs/contracts/check-accounting.yaml
    action: Modify
    purpose: >-
      Add validation_result_schema_v4 (additive over v3: the five new fields, RESULT_PATH anchored at the invoking
      worktree) with an amendment_log entry; update contract.description's "schema_version 3" to 4. v3's pins unchanged.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Its check-accounting route description (around line 364) says "validation-result.json schema_version 3 shape";
      update to 4. Description text only.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add TWO dated annotations in decision-entry.yaml amendment_forms' pinned blockquote_update form
      (`> **Update (<implement date>):** ...`), each citing OPERATOR DIRECTION (the human chose commit-first and accepted
      the per-push cost, 2026-09-25/26 planning session) plus this plan as the source (Decision 151 clause 3(iii)).
      (1) Decision 163, after its existing Decision 169 annotation: the pre-handoff full tier now runs on the committed,
      rebased, clean tree and its evidence must attest HEAD's tree (--verify-head); point 3's cost basis becomes per push,
      still NOT extended to the automated executor; handoff_policy.full_validation_required_before_commit is a legacy
      name that now means "before push" (rename owned by rec-4084). (2) Decision 38, after its existing 2026-07-21
      Update: postflight --auto's ratified validate -> close -> metrics -> commit -> push order is now close -> evidence
      -> metrics -> commit -> rebase -> validate -> verify-head -> push -> portal sync, and the post-push log-housekeeping
      leg is retired (Decision 84: nothing under logs/ is tracked). Never edit either body (Decision 177; Decision 178
      retired the mechanical guard, so this is policy-only -- the reviewer checks it). No new Decision number here
      (Decision 167 routing_rule: a gloss on 163 point 3, not a separately reversible instance -- that is slice 2b's
      gate).
  - file: config/agent/verification_registry/entries/validation-evidence-attests-head-tree.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 1: check_id validation-evidence-attests-head-tree, guard_target
      scripts/checks/validation_result.py, guard_symbol attests_head, check_spec.node_id
      tests/checks/test_validation_result.py::TestAttestsHead::test_rejects_evidence_for_a_different_tree.
  - file: config/agent/verification_registry/entries/postflight-auto-commits-before-full-tier.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 2: check_id postflight-auto-commits-before-full-tier, guard_target
      scripts/session/postflight.py, guard_symbol run_auto, check_spec.node_id
      tests/session/postflight/test_auto.py::TestAutoMode::test_auto_commits_before_full_tier_and_pushes_only_after_pass.
bundled_recommendations:
  - rec-3033
followon_recs:
  - rec-4083
  - rec-4084
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The /implement handoff order is commit -> fetch + rebase -> full tier on a clean tree -> --verify-head -> push (push as
    its own tool call) in the skill, the command and postflight --auto alike, with exactly one full-tier invocation per
    push; the anti-drift test pins it and postflight's call-order test proves it.
  - >-
    validation-result.json (schema_version 4) records head_tree_at_start/end, tree_clean_at_start/end and
    worktree_toplevel additively at a RESULT_PATH anchored to the invoking worktree; failed_checks and
    failed_check_attributions are byte-identical in shape to v3.
  - >-
    `bin/venv-python -m scripts.checks.validation_result --verify-head` exits 0 only when the evidence attests the current
    HEAD's tree from this worktree, clean at start and end, scope all, exit 0 and no failures -- and exits 1 naming the
    failed rule otherwise (including for evidence of a different tree).
  - >-
    No test run from the repo root deletes or rewrites the real logs/debug/validation-result.json.
  - >-
    postflight --auto never pushes after a failed full tier, a failed verify-head or a rebase conflict, and no longer runs
    a post-push log-housekeeping commit.
  - >-
    rec-3033's acceptance node exists under its exact name and passes.
  - >-
    SKILL.md stays within its 35,402-byte prose budget with no raise; every touched Python file stays within its SLOC and
    coverage floors (postflight.py's 84.4% baseline not lowered).
  - >-
    git-ops.yaml carries handoff_sequence with enforcing_checks and the per-surface note, contract_version = live + 1, an
    amendment_log entry, the new referenced_repo_path, and stays <= 500 effective lines; the trailer-carrier shard is
    version-agnostic; Decisions 163 and 38 each carry one new dated Update annotation and unchanged bodies.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the graduated core invariant -- evidence for a different tree never attests HEAD.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py::TestAttestsHead::test_rejects_evidence_for_a_different_tree -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      A pass that does not build two real distinct trees in a tmp repository proves nothing -- reject a mocked tree hash.
    hermetic: true
    graduation: graduate
    graduation_check_id: validation-evidence-attests-head-tree
  - step: 2
    phase: pre-deploy
    action: Run the graduated ordering invariant -- postflight --auto commits before the full tier and pushes only after it passes.
    command: bin/venv-python -m pytest tests/session/postflight/test_auto.py::TestAutoMode::test_auto_commits_before_full_tier_and_pushes_only_after_pass -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      Exit 4 means the test was placed outside TestAutoMode or renamed -- the node id is pinned by the shard.
    hermetic: true
    graduation: graduate
    graduation_check_id: postflight-auto-commits-before-full-tier
  - step: 3
    phase: pre-deploy
    action: Run the whole evidence-writer suite, including rec-3033's acceptance node and the anchored RESULT_PATH test.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py tests/checks/registry/test_accounting.py -q
    expected: >-
      Exit 0, including test_git_head_resolves_from_invoking_worktree and test_result_path_is_anchored_at_root.
    fix_if: >-
      A v3-field shape change is a Priority-0 consumer break (T1.13 / Decision 170) -- restore it byte-identically.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Step 1 graduates the load-bearing invariant; validate_test_coverage re-measures validation_result.py at 100% on every
      diff touching it, and rec-3033's own acceptance re-runs its node at closure.
  - step: 4
    phase: pre-deploy
    action: Prove no test in the evidence and accounting suites touches the real evidence file.
    command: >-
      bin/venv-python -c "import hashlib, pathlib, subprocess, sys; p = pathlib.Path('logs/debug/validation-result.json');
      p.parent.mkdir(parents=True, exist_ok=True); p.write_text('{\"sentinel\": true}\n', encoding='utf-8');
      before = hashlib.sha256(p.read_bytes()).hexdigest();
      rc = subprocess.run([sys.executable, '-m', 'pytest', 'tests/checks/test_validation_result.py',
      'tests/checks/registry/test_accounting.py', '-q']).returncode;
      after = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else 'deleted'; p.unlink(missing_ok=True);
      print('sentinel', 'intact' if before == after else 'TOUCHED'); raise SystemExit(0 if rc == 0 and before == after else 1)"
    expected: >-
      Exit 0 and "sentinel intact": the real evidence path survives the suites byte-for-byte. On the un-implemented tree the
      accounting suite's clear() calls delete it (red before).
    fix_if: A "TOUCHED" result names a test still using the default RESULT_PATH -- give it a tmp path.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Deliberately NON-hermetic: it writes and removes the REAL logs/debug/validation-result.json, so it must never be
      replayed inside the full tier by validate_vp_replay (it would clobber that run's own evidence). The anchored-path
      unit test in step 3 is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Run the postflight suite and the skill anti-drift suite.
    command: bin/venv-python -m pytest tests/session/postflight tests/test_workflow_skill_antidrift.py -q
    expected: >-
      Exit 0, including test_rebase_conflict_returns_rebase_failed_without_validating,
      test_handoff_full_tier_runs_after_commit_and_rebase and the unchanged
      test_full_tier_runs_once_and_only_in_the_step7_closure; no test ran a real git fetch/rebase/commit.
    fix_if: >-
      A real git side effect in a test means a commit-leg test is missing the run_rebase/run_verify_head seams. A failing
      pre-existing anti-drift test means the reorder dropped a pinned invariant -- restore it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both are standing suites run on every diff that touches them; step 2 graduates the ordering invariant.
  - step: 6
    phase: pre-deploy
    action: >-
      Measure the touched Python modules' per-file coverage with the checker validate_test_coverage delegates to
      (baseline-aware, so postflight.py is held at its 84.4% floor). Diagnostic only; validate_test_coverage in step 8 is
      the gate.
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
      scripts/checks/validation_result.py scripts/session/postflight.py
    expected: Exit 0 with the PASS diagnostic verdict.
    expected_literals:
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: A missing line in run_rebase/run_verify_head means a failure arm is untested -- add it, never a pragma.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_test_coverage, which enforces the same floors whenever these files change.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the fast tier (prose budget, SLOC, git-ops contract binding and size shard, the re-pointed trailer shard,
      Decision-entry conformance, shard admission, graduation completeness) on the COMMITTED tree.
    command: test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate --pre
    expected: >-
      The clean-tree assertion passes, then zero failed checks; SKILL.md at or under 35,402 bytes; both new shards
      ADMITTED; the modified git-ops-trailer-carrier-and-placement-rules shard re-verified green.
    fix_if: >-
      Read the summary, never the exit code (Decision 73). A prose-budget failure means relocate text to git-ops.yaml --
      never add a raise marker.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate (recursion refusal) and its exit code is not a kernel assertion outside CI.
  - step: 8
    phase: pre-deploy
    action: >-
      Dogfood the new order for this plan's own handoff: after commit + fetch + rebase, run the full tier on the clean tree
      and verify the evidence attests HEAD before pushing.
    command: >-
      test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate
      && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The clean-tree assertion passes, Validation Summary (scope: all) PASS, then --verify-head exits 0 naming the attested
      tree.
    fix_if: >-
      A dirty-tree refusal means something was edited after the commit -- commit it and rerun from the start. A timeout is
      BLOCKED per handoff_policy.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on this session's transient commit and evidence state and invokes scripts.validate (recursion refusal).
  - step: 9
    phase: post-deploy
    action: >-
      After merge, confirm rec-3033 closed through the Resolves trailer (not escape-classified; its acceptance is a node id
      that holds at the merge sha, so Decision 201's trailer path can close it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      row = make_reader(profile='agent_platform').named('rec_by_id', id='rec-3033')[0]; print(row['status']);
      assert row['status'] == 'closed'"
    expected: rec-3033 reads back closed.
    fix_if: >-
      Still open after trailer-closure concludes: read the job log for a refusal marker and follow
      git-ops.yaml::resolves_trailer's conditional fallback -- never force-close around a refusal.
    hermetic: false
test_obligations:
  - source: scripts/checks/validation_result.py
    behavior: Evidence attests HEAD only for a clean, passing, same-worktree run of exactly HEAD's tree.
    verification_step: 1
    test_selector: tests/checks/test_validation_result.py::TestAttestsHead::test_rejects_evidence_for_a_different_tree
    red_green_expectation: Red before (predicate and node absent), green after.
  - source: scripts/session/postflight.py
    behavior: run_auto commits, rebases, validates and verifies before it pushes, and never pushes after a failure.
    verification_step: 5
    test_selector: tests/session/postflight
    red_green_expectation: Red before (validate runs first; no rebase or verify-head seams), green after.
  - source: docs/contracts/git-ops.yaml
    behavior: handoff_sequence names the order, the evidence rules and its enforcing check.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Clause presence and path binding are owned by the registered validate_git_ops_contract and the size shard; the
      behaviour the clause describes is pinned by steps 1-2 and the anti-drift test (Decision 86).
  - source: config/agent/verification_registry/entries/git-ops-trailer-carrier-and-placement-rules.yaml
    behavior: The shard stays true across a contract_version bump.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      validate_verification_registry replays every MODIFIED shard against HEAD, which is exactly this property; a
      dedicated test would duplicate it.
  - source: docs/contracts/check-accounting.yaml
    behavior: Declares validation_result_schema_v4 as additive over v3.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Prose schema note with no runtime reader; the fields it describes are pinned by step 3's tests (Decision 86).
  - source: docs/contracts/file-router.yaml
    behavior: The check-accounting route names schema_version 4.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Description text only; the router's structure is owned by its registered checks.
  - source: .claude/skills/implement/SKILL.md
    behavior: The Commit Flow runs the full tier and --verify-head after commit + rebase and before push.
    verification_step: 5
    test_selector: tests/test_workflow_skill_antidrift.py::test_handoff_full_tier_runs_after_commit_and_rebase
    red_green_expectation: Red before (validate precedes commit), green after.
  - source: .claude/commands/implement.md
