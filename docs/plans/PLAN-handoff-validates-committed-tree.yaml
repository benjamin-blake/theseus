rollback: >-
  Revert the squash commit: the settings entry, the pre-push hook and the reorder all go with it, restoring today's
  validate-then-commit flow; validation-result.json v4 fields are additive, so no consumer breaks either way. If the gate
  wedges agent work before a revert lands, a human pushes the revert directly (humans are not gated by the harness hook,
  and `--no-verify` bypasses the pre-push layer). Record the reversal against Decision 202's condition (a).
