bundled_recommendations:
  - rec-3033
followon_recs:
  - rec-4083
  - rec-4084
  - rec-4092
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The /implement handoff order is commit -> fetch + rebase -> full tier on a clean tree -> --verify-head -> push (push as
    its own tool call) in the skill, the command and postflight --auto alike, with exactly one full-tier invocation per
    push; the anti-drift test pins it and postflight's call-order test proves it.
  - >-
    validation-result.json (schema_version 4) records head_tree_at_start/end, tree_clean_at_start/end and
    worktree_toplevel additively at a RESULT_PATH anchored to the invoking worktree; failed_checks and
    failed_check_attributions are byte-identical in shape to v3.
  - >-
    `bin/venv-python -m scripts.checks.validation_result --verify-head` exits 0 only when the evidence attests the current
    HEAD's tree from this worktree, clean at start and end, scope all, exit 0 and no failures -- and exits 1 naming the
    failed rule otherwise (including for evidence of a different tree).
  - >-
    No test in tests/checks/test_validation_result.py or tests/checks/registry/test_accounting.py deletes or rewrites the
    real logs/debug/validation-result.json (VP step 4's sentinel), and a grep finds no other test calling clear() or
    write_completed() on the default path (verified at plan time: every other in-process validate.main() caller sets
    argv to --pre, which skips both, and the one full-tier caller, tests/validate/test_tiers.py, patches both).
  - >-
    postflight --auto never pushes after a fetch failure, a rebase conflict (which it aborts), a failed full tier or a
    failed verify-head; each returns its own status (fetch_failed, rebase_failed, validate_failed, evidence_mismatch);
    a re-run with no new edits reaches the full tier again instead of failing at commit; and it no longer runs a
    post-push log-housekeeping commit.
  - >-
    rec-3033's acceptance node exists under its exact name and passes.
  - >-
    SKILL.md stays within its 35,402-byte prose budget with no raise; every touched Python file stays within its SLOC and
    coverage floors (postflight.py's 84.4% baseline not lowered).
  - >-
    git-ops.yaml carries handoff_sequence with its enforcement_coverage rows (one mechanical, three residual with owners),
    contract_version = live + 1, an amendment_log entry, both new referenced_repo_paths, and stays <= 500 effective
    lines; the trailer-carrier shard pins the exact new contract_version literal and is ADMITTED by the differential
    gate; Decisions 163 and 38 each carry one new dated Update annotation and unchanged bodies.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the graduated core invariant -- evidence for a different tree never attests HEAD.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py::TestAttestsHead::test_rejects_evidence_for_a_different_tree -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      A pass that does not build two real distinct trees in a tmp repository proves nothing -- reject a mocked tree hash.
    hermetic: true
    graduation: graduate
    graduation_check_id: validation-evidence-attests-head-tree
  - step: 2
    phase: pre-deploy
    action: Run the graduated ordering invariant -- postflight --auto commits before the full tier and pushes only after it passes.
    command: bin/venv-python -m pytest tests/session/postflight/test_auto.py::TestAutoMode::test_auto_commits_before_full_tier_and_pushes_only_after_pass -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      Exit 4 means the test was placed outside TestAutoMode or renamed -- the node id is pinned by the shard.
    hermetic: true
    graduation: graduate
    graduation_check_id: postflight-auto-commits-before-full-tier
  - step: 3
    phase: pre-deploy
    action: Run the whole evidence-writer suite, including rec-3033's acceptance node and the anchored RESULT_PATH test.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py tests/checks/registry/test_accounting.py -q
    expected: >-
      Exit 0, including test_git_head_resolves_from_invoking_worktree and test_result_path_is_anchored_at_root.
    fix_if: >-
      A v3-field shape change is a Priority-0 consumer break (T1.13 / Decision 170) -- restore it byte-identically.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Step 1 graduates the load-bearing invariant; validate_test_coverage re-measures validation_result.py at 100% on every
      diff touching it, and rec-3033's own acceptance re-runs its node at closure.
  - step: 4
    phase: pre-deploy
    action: Prove no test in the evidence and accounting suites touches the real evidence file.
    command: >-
      bin/venv-python -c "import hashlib, pathlib, subprocess, sys; p = pathlib.Path('logs/debug/validation-result.json');
      p.parent.mkdir(parents=True, exist_ok=True); p.write_text('{\"sentinel\": true}\n', encoding='utf-8');
      before = hashlib.sha256(p.read_bytes()).hexdigest();
      rc = subprocess.run([sys.executable, '-m', 'pytest', 'tests/checks/test_validation_result.py',
      'tests/checks/registry/test_accounting.py', '-q']).returncode;
      after = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else 'deleted'; p.unlink(missing_ok=True);
      print('sentinel', 'intact' if before == after else 'TOUCHED'); raise SystemExit(0 if rc == 0 and before == after else 1)"
    expected: >-
      Exit 0 and "sentinel intact": the real evidence path survives the suites byte-for-byte. On the un-implemented tree the
      accounting suite's clear() calls delete it (red before).
    fix_if: A "TOUCHED" result names a test still using the default RESULT_PATH -- give it a tmp path.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Deliberately NON-hermetic: it writes and removes the REAL logs/debug/validation-result.json, so it must never be
      replayed inside the full tier by validate_vp_replay (it would clobber that run's own evidence). The anchored-path
      unit test in step 3 is the standing guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the postflight suite, the facade-surface pin, and both skill-text pins (the new ordering test and the two
      unchanged placement pins).
    command: >-
      bin/venv-python -m pytest tests/session/postflight tests/test_session_postflight_decomposition.py
      tests/test_workflow_skill_antidrift.py tests/test_implementation_retrospective_skill_contract.py -q
    expected: >-
      Exit 0, including test_rebase_conflict_returns_rebase_failed_without_validating,
      test_fetch_failure_returns_fetch_failed_without_validating, TestRebaseSeam, TestVerifyHeadSeam,
      test_clean_tree_is_noop_success, the re-seated test_auto_mode_does_not_call_stage_documents,
      test_handoff_full_tier_runs_after_commit_and_rebase, and the UNCHANGED
      test_full_tier_runs_once_and_only_in_the_step7_closure and
      test_implement_skill_documents_executable_ordered_closure; no test ran a real git fetch/rebase/commit.
    fix_if: >-
      An AssertionError "unstubbed real-git seam" names a run_auto test missing its run_rebase/run_verify_head patch --
      add the patch, never loosen the conftest stub. A failing placement pin means the SKILL edit broke the placement rule
      (scope row) -- restore the single backticked full-tier mention in closure item 4, before --evidence.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both are standing suites run on every diff that touches them; step 2 graduates the ordering invariant.
  - step: 6
    phase: pre-deploy
    action: >-
      Measure the touched Python modules' per-file coverage with the checker validate_test_coverage delegates to
      (baseline-aware, so postflight.py is held at its 84.4% floor). Diagnostic only; validate_test_coverage in step 8 is
      the gate.
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
      scripts/checks/validation_result.py scripts/session/postflight.py
    expected: Exit 0 with the PASS diagnostic verdict.
    expected_literals:
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: A missing line in run_rebase/run_verify_head means a failure arm is untested -- add it, never a pragma.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_test_coverage, which enforces the same floors whenever these files change.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the fast tier (prose budget, SLOC, git-ops contract binding and size shard, the re-pointed trailer shard,
      Decision-entry conformance, shard admission, graduation completeness) on the COMMITTED tree.
    command: test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate --pre
    expected: >-
      The clean-tree assertion passes (the work is committed on the session branch before this step -- steps 1-6 may run
      on the uncommitted tree, this one may not), then zero failed checks; SKILL.md at or under 35,402 bytes; both new
      shards ADMITTED; the modified git-ops-trailer-carrier-and-placement-rules shard ADMITTED (its exact new
      contract_version literal FAILS on origin/main and PASSES on HEAD).
    fix_if: >-
      Read the summary, never the exit code (Decision 73). A prose-budget failure means relocate text to git-ops.yaml --
      never add a raise marker. "not admitted -- tautological" on the trailer-carrier shard means its grep matches
      origin/main's contract_version -- pin the exact value this change leaves behind, never a pattern.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate (recursion refusal) and its exit code is not a kernel assertion outside CI.
  - step: 8
    phase: pre-deploy
    action: >-
      Dogfood the new order for this plan's own handoff: after commit + fetch + rebase, run the full tier on the clean tree
      and verify the evidence attests HEAD before pushing.
    command: >-
      test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate
      && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The clean-tree assertion passes, Validation Summary (scope: all) PASS, then --verify-head exits 0 naming the attested
      tree.
    fix_if: >-
      A dirty-tree refusal BEFORE the run means something was edited after the commit -- commit it and rerun from the
      start. A dirty_end that RECURS on a re-run with no edits means the full tier itself writes an unignored file -- a
      defect: STOP and RCA (Decision 55), never commit-and-rerun (that loops). A timeout is BLOCKED per handoff_policy.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on this session's transient commit and evidence state and invokes scripts.validate (recursion refusal).
  - step: 9
    phase: post-deploy
    action: >-
      After merge, confirm rec-3033 closed through the Resolves trailer (not escape-classified; its acceptance is a node id
      that holds at the merge sha, so Decision 201's trailer path can close it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      row = make_reader(profile='agent_platform').named('rec_by_id', id='rec-3033')[0]; print(row['status']);
      assert row['status'] == 'closed'"
    expected: rec-3033 reads back closed.
    fix_if: >-
      Still open after trailer-closure concludes: read the job log for a refusal marker and follow
      git-ops.yaml::resolves_trailer's conditional fallback -- never force-close around a refusal.
    hermetic: false
test_obligations:
  - source: scripts/checks/validation_result.py
    behavior: Evidence attests HEAD only for a clean, passing, same-worktree run of exactly HEAD's tree.
    verification_step: 1
    test_selector: tests/checks/test_validation_result.py::TestAttestsHead::test_rejects_evidence_for_a_different_tree
    red_green_expectation: Red before (predicate and node absent), green after.
  - source: scripts/session/postflight.py
    behavior: run_auto commits, rebases, validates and verifies before it pushes, and never pushes after a failure.
    verification_step: 5
    test_selector: tests/session/postflight
    red_green_expectation: Red before (validate runs first; no rebase or verify-head seams), green after.
  - source: docs/contracts/git-ops.yaml
    behavior: handoff_sequence names the order, the evidence rules and its enforcing check.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Clause presence and path binding are owned by the registered validate_git_ops_contract and the size shard; the
      behaviour the clause describes is pinned by steps 1-2 and the anti-drift test (Decision 86).
  - source: config/agent/verification_registry/entries/git-ops-trailer-carrier-and-placement-rules.yaml
    behavior: The shard stays true across a contract_version bump.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      validate_verification_registry replays every MODIFIED shard against HEAD, which is exactly this property; a
      dedicated test would duplicate it.
  - source: docs/contracts/check-accounting.yaml
    behavior: Declares validation_result_schema_v4 as additive over v3.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Prose schema note with no runtime reader; the fields it describes are pinned by step 3's tests (Decision 86).
  - source: docs/contracts/file-router.yaml
    behavior: The check-accounting route names schema_version 4.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Description text only; the router's structure is owned by its registered checks.
  - source: .claude/skills/implement/SKILL.md
    behavior: The Commit Flow runs the full tier and --verify-head after commit + rebase and before push.
    verification_step: 5
    test_selector: tests/test_workflow_skill_antidrift.py::test_handoff_full_tier_runs_after_commit_and_rebase
    red_green_expectation: Red before (validate precedes commit), green after.
  - source: .claude/commands/implement.md
    behavior: The One-full-tier rule states the committed-tree, per-push order and no longer instructs log-housekeeping.
    verification_step: 5
    test_selector: tests/test_workflow_skill_antidrift.py::test_handoff_full_tier_runs_after_commit_and_rebase
    red_green_expectation: Red before ("no commit has happened" present), green after.
  - source: config/agent/verification_registry/entries/validation-evidence-attests-head-tree.yaml
    behavior: check_id equals VP step 1's graduation_check_id and the check_spec is admitted by the differential gate.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Owned by validate_graduation_completeness and validate_verification_registry; a dedicated test would duplicate them.
  - source: config/agent/verification_registry/entries/postflight-auto-commits-before-full-tier.yaml
    behavior: check_id equals VP step 2's graduation_check_id and the check_spec is admitted by the differential gate.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Same as the sibling shard.
constraints:
  - >-
    This slice changes ORDER and EVIDENCE only; it adds no hook, no settings.json entry and no pre-push stage -- the
    mechanical gate is PLAN-handoff-evidence-gate (2b), which imports attests_head from this slice.
  - >-
    validation-result.json v3 fields stay byte-identical in shape (CI-RCA Priority-0 consumer, Decision 170 clause 1).
  - >-
    SKILL.md: byte-neutral or smaller against its 35,402-byte budget; relocate to git-ops.yaml (Decision 86); never add a
    `# raise-approved` marker. No SLOC budget raises (Decision 128/165).
  - >-
    git-ops.yaml: contract_version = live value + 1 (never assume 3); <= 500 effective lines; no bare `claude/` outside
    agent_branch_prefixes.
  - >-
    Decision 177: annotate Decisions 163 and 38 with one dated Update line each; never edit either body.
  - >-
    No test may run a real git fetch/rebase/add/commit against the checkout or touch the real evidence file.
  - >-
    Out-of-scope defects become recs via scripts.ops_data_portal (Decision 59); forward-fix only (Decision 55/72).
  - >-
    bin/venv-python never bare python; Linux/bash only; line length 127; type hints required; no emojis; no em dashes.
context:
  - "Root cause (PLAN-ci-rca-rec-trailer-acceptance-coverage commit bodies): the handoff full tier validated an uncommitted working tree; 17 modules use tracked-only _common.get_changed_files and ~27 call git diff directly, so new untracked files were invisible (#1243, #1273); evidence recorded only the pre-commit git_head and nothing read it (rec-3033)."
  - "Live demonstration while authoring the sibling plan: --pre on an uncommitted new PLAN reported graduation-completeness and VP-replay as 'no PLAN in the diff -- no-op'; after committing, both engaged."
  - "Human-chosen forks: commit-first binding; split into 2a (this: order + evidence) and 2b (fail-closed gate with an ask-a-human valve for validated-but-red, behind a live probe); per-push full-tier cost accepted."
  - "Carried from combined-plan critique round 1: F9 (contract_version collision + trailer shard), F10 (size ceiling), F11 (RESULT_PATH + test_accounting deletes real evidence), F13 (SKILL/command obligations), F14 (postflight seams, rebase status, retired housekeeping leg). Gate findings F1-F8, F12, F15-F17 move to 2b."
  - "2a critique round 1 (REVISE) folded in: F1 exact-literal shard re-pin (version-agnostic grep is rejected as tautological by the differential gate); F2 fail-closed conftest stub + test_metrics_housekeeping re-seat; F3 schema-v3 test re-seat, git probes stay on validation_result.subprocess.run; F4 SKILL placement rule vs two standing pins, simulated at 35,399 bytes; F5 clean-tree commit no-op, rebase --abort, fetch_failed; F6 declared residual -> rec-4092; F7 AC wording; F8 direct seam tests; F9-F11, F13, F14 advisories; F12 commit sequence. F15 (stale prose-budget shard) and the stale validation-result-schema-v2-attributions shard are rec-3286's refresh path, not inline edits."
  - "Frame challenge Q3 considered and rejected: validating HEAD inside scripts.verification_graduation.git_worktree would make dirty_start/dirty_end impossible by construction, but drops the gitignored local inputs the full tier reads (dq-latest.json, the recs cache) and adds a worktree + venv-symlink per run; the in-place clean-tree snapshot is kept."
  - "Decision routing (critique note, not blocking): annotations on 163 and 38 rather than a new Decision -- the rule (full tier before handoff) is unchanged and now applied to the tree that ships; the separately reversible MECHANISM (the push gate) is 2b's Decision."
  - "Gotchas: SKILL.md has 2 bytes of prose headroom and the anti-drift test anchors on the heading 'Run the full gate locally first' and one backticked full-tier mention; CC-web sets commit.gpgsign=true globally (tmp-repo commits pass -c commit.gpgsign=false); tests/conftest.py already clears GITHUB_EVENT_*."
  - "Known wording residual left as-is: scripts/validate.py prints 'Fix all failures before committing.' after what is now a post-commit run (wording only)."
  - "Sequencing: lands after PLAN-ci-rca-rec-trailer-acceptance-coverage; before or alongside PLAN-trailer-acceptance-junit-verdict (both bump git-ops.yaml -- live + 1); 2b lands after this slice."
  - "Decision-scout verdict FLAGS_FOUND. CITE list (verbatim): 163, 167, 177, 170, 84, 86, 201. CONTRADICT: 38 [WARN] (second Update annotation on 38), 181 [WARN] (enforcement_coverage rows; interactive path residual owned by rec-4083), 163 [NOTE] (legacy before_commit name noted; rename -> rec-4084). RELATED: 73, 89, 76, 25, 159, 148, 189, 132, 176, 168, 128, 165, 127, 142, 55. ROADMAP: T2.54 [CITE] (enforcement_coverage vocabulary), T2.48, T1.5, T1.17, T3.19 (keep SKILL.md's VF-08 note intact)."
  - "Decisions triaged: 154 of 154"
  - "Roadmap items intersected: 6; CONFLICT: 0; RELATED: 5"
  - "Scout gotcha: under commit-first the local full tier's validate_vp_replay implement leg replays this plan's hermetic steps, hence VP step 4 is non-hermetic and clear()'s start snapshot is held in memory, never on disk."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=PENDING (round 1 REVISE addressed; confirming round next)"
pre_implementation_checklist:
  - Branch confirmed not on main (harness-assigned session branch)
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (163, 38, 167, 170, 177, 181, 151, 84, 86, 25, 128, 165, 168, 201)
  - docs/contracts/git-ops.yaml and docs/contracts/decision-entry.yaml amendment_forms read
  - All scope files located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    scripts/checks/validation_result.py + tests/checks/test_validation_result.py: anchored RESULT_PATH and git cwd, start
    snapshot in clear(), schema-4 fields, attests_head predicate and --verify-head CLI.
  - >-
    tests/checks/registry/test_accounting.py: isolate every clear() from the real evidence path.
  - >-
    scripts/session/postflight.py + tests/session/postflight/{conftest,test_auto,test_metrics_housekeeping,
    test_validate_commit}.py: clean-tree commit no-op, run_rebase (fetch_failed / abort + rebase_failed / ok) and
    run_verify_head seams, the new order, retired housekeeping leg, docstrings, status enum and help text; the fail-closed
    conftest stub first, then re-seat every commit-leg test and add the direct seam tests.
  - >-
    .claude/skills/implement/SKILL.md (byte-neutral), .claude/commands/implement.md (One-full-tier rule, Step 8) and
    tests/test_workflow_skill_antidrift.py.
  - >-
    docs/contracts/git-ops.yaml handoff_sequence (<= 45 effective lines), push_pr_ci_merge_flow steps, amendment_log,
    contract_version live + 1, referenced_repo_paths; re-point the trailer-carrier shard; check-accounting.yaml v4 and
    file-router.yaml description; Decision 163 and Decision 38 Update annotations.
  - >-
    Graduation walk: both new shards (filename == check_id == graduation_check_id), then implementation_declared true.
  - >-
    Execute VP steps 1-6 (loop until pass; STOP and RCA on a third consecutive failed fix, Decision 55). COMMIT the work
    (VP step 7 refuses a dirty tree), then run VP step 7; commit any fix it forces. Then follow the NEW order for this
    plan's own handoff: `git commit` ONLY if `git status --porcelain` is non-empty (an empty commit exits 1), fetch +
    rebase, VP step 8, push as its own tool call.
  - >-
    Record the four closure facts separately: readiness states (github_readiness; unknown is never PASS); parent validator
    evidence (VP step 8 full-tier PASS and --verify-head exit 0 on the schema-4 record); structured postflight evidence
    (postflight --evidence); the real push / PR / CI / merge outcome.
  - >-
    PR body carries "Resolves: rec-3033"; squash-merge only once pr-validate is green on the head sha. After merge: VP
    step 9.
  - "Report: what was implemented; the VP compliance table; the four closure facts, each named separately."
work_areas: []
rollback: >-
  Revert the squash commit: the order returns to validate-then-commit and the evidence fields disappear; both are
  additive to their consumers, so nothing breaks either way. No hook is installed by this slice, so nothing can wedge.
