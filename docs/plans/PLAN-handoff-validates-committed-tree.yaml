      credential, a post-full-tier test run would silently revoke it. Replace the four setup_method bodies (L18-19, L82-83,
      L151-152, L177-178) with ONE module-level function-scoped autouse fixture that FIRST monkeypatches
      validation_result.RESULT_PATH to tmp_path / "validation-result.json" and THEN calls clear() (setup_method cannot take
