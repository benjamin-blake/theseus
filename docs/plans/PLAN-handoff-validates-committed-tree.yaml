      redirect because clear()'s default now resolves at call time (scope row 1 (2)). Assert nothing else changes.
  - file: scripts/session/postflight.py
    action: Modify
    purpose: >-
      run_auto reorders to: close/sanity -> evidence -> metrics -> commit -> rebase -> full tier (run_validate) ->
      verify-head -> push -> portal sync, with these POST-COMMIT FAILURE SEMANTICS (each stops WITHOUT pushing and leaves
      --auto re-runnable): (a) run_commit treats a clean tree as a NO-OP SUCCESS -- after `git add .`, a `git status
      --porcelain` probe (returncode 0, empty stdout) prints a nothing-to-commit line and returns 0 -- so re-running
      --auto after a red full tier or an evidence mismatch with no new edits no longer burns three attempts into
