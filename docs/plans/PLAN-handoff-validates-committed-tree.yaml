constraints:
  - >-
    No agent override of any kind (no env var, flag or marker lets an agent skip the gate) -- Decision 163 point 1's
    exceptionless shape. Humans keep `git push --no-verify` for the pre-push layer; agents are refused it.
  - >-
    Fail closed on evidence: missing, unreadable, malformed, failed, dirty, moved-HEAD, foreign-worktree or
    tree-mismatched evidence blocks. Only a tool call that is not push-shaped is allowed on a parse failure.
  - >-
    The exempt set is read from origin/main, and the gate's own files and registrations are never exempt (Decision 187).
  - >-
    SKILL.md: byte-neutral or smaller against its 35,402-byte budget; relocate to git-ops.yaml (Decision 86); never add a
    `# raise-approved` marker. Decision 128/165 for SLOC likewise -- no budget raises.
  - >-
    validation-result.json v3 fields stay byte-identical in shape (CI-RCA Priority-0 consumer, Decision 170 clause 1).
  - >-
    Leave never_on_main.py, fresh_branch_base.py, edit_scope_guard.py and scheduled_agent_log_only.py and their settings
    entry untouched (Decision 138: augment, do not replace).
  - >-
    Decision 177: annotate Decision 163 with a dated amendment line only; never edit its body.
  - >-
    Out-of-scope defects become recs via scripts.ops_data_portal (Decision 59); forward-fix only (Decision 55/72).
  - >-
    bin/venv-python never bare python; Linux/bash only; line length 127; type hints required; no emojis; no em dashes.
context:
  - "Root cause (see PLAN-ci-rca-rec-trailer-acceptance-coverage and its commit body): the handoff full tier validated the uncommitted working tree; 17 modules use tracked-only _common.get_changed_files and ~27 call git diff directly, so new untracked files were invisible (#1243, #1273); evidence recorded only the pre-commit git_head and nothing read it (rec-3033)."
  - "Live demonstration while authoring the sibling plan: --pre on an uncommitted new PLAN reported graduation-completeness and VP-replay as 'no PLAN in the diff -- no-op'; after committing, both engaged."
  - "Human-chosen forks: commit-first binding; harness PreToolUse hook + git pre-push; one plan (not split); accepted per-push full-tier cost."
  - "Gotchas: SKILL.md has 2 bytes of prose headroom; postflight pushes via subprocess (harness-invisible, hence pre-push); tests/test_workflow_skill_antidrift.py pins one full-tier invocation in the closure and the phrase 'One-full-tier rule'; pre-commit hooks without `stages` run at every installed stage, hence default_stages; CC-web sets commit.gpgsign=true globally (tmp-repo commits pass -c commit.gpgsign=false)."
  - "Operational risk accepted: the full tier's DQ step can go red on a DuckLake reader outage (T1.6 c8 open), which now blocks agent pushes until the reader recovers -- same rule as today, newly enforced."
  - "Residuals owned elsewhere (declared in the contract table): rec-4080 / rec-2827 (server-side merge on red), rec-3221 (coverage floor in PR CI), rec-3097 (validate_handoff_full_tier satisfiable by --help; related, not bundled)."
  - "Sequencing: lands after PLAN-ci-rca-rec-trailer-acceptance-coverage (disjoint scope); PLAN-trailer-acceptance-junit-verdict (slice B) is unaffected in scope but its implementer will be the first to run under the new order."
  - "Decision-scout verdict FLAGS_FOUND. CITE list (verbatim): 163, 138, 181, 177, 128, 165, 201. CONTRADICT: none. SPIRIT: 187 [WARN] (exempt set read from base ref + never-exempt self-protection list -- scope row 1), 163 [NOTE] (per-push cost basis and executor carve-out restated in Decision 202 and the contract). RELATED: 73, 76, 189, 135, 159, 132, 25, 168, 167, 83. ROADMAP: T2.54 [CITE] (enforcing_checks named), T1.13 (additive schema), T1.6 (reader risk), T1.5, T1.17."
