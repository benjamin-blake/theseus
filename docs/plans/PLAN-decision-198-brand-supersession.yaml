schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-198-brand-supersession"
intent: >-
  Retire Theseus and Guerdon as external brands in favour of On The Loop Labs Limited (company)
  and On The Loop (product, one mark covering both), so the platform's product-facing surfaces
  carry a single ratified mark before adoption rather than after, and so the identifier bindings
  that mark determines stop blocking the GitHub org transfer.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-198-brand-supersession.yaml
phase: >-
  No platform roadmap tier_item. Brand/identity governance in the same class as rec-3905 and
  PLAN-ontheloop-package-registries, filed under the soft-warn exception category ad_hoc_rec --
  the Tier Item Freshness Gate does not fire because no tier_item is claimed. TOUCHES (does not
  claim) T2.11b, T2.51 and T4.24, all deferred_post_mvp, plus the CD.23 detail text.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add Decision 198; append dated amendment blockquotes to Decisions 101, 195 and 196. All four
      edits are pure appends -- no existing body line is rewritten or removed (Decision 177).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate the committed index so validate_decisions_index_freshness stays green.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Correct four forward-standing surfaces: CD.23 detail text (portfolio framing), T2.11b
      files_in_scope comment plus its bare-string exit-criteria conversion, T2.51's three
      theseus.support references, and T4.24's three `theseus init` strings.
  - file: LICENSE
    action: Modify
    purpose: Licensed Work parameter Theseus -> On The Loop. The Licensor line is NOT touched.
  - file: LICENSING.md
    action: Modify
    purpose: >-
      Forward-standing licensed-work heading, plus a continuity note recording that On The Loop is
      the same Licensed Work formerly named Theseus. Historical statements stay verbatim.
  - file: CONTRIBUTING.md
    action: Modify
    purpose: Two forward-standing licensed-work references.
  - file: COMMERCIAL-LICENSE.md
    action: Modify
    purpose: One forward-standing licensed-work reference and the theseus.support contact sentence.
  - file: scripts/checks/hygiene/validate_licence_consistency.py
    action: Modify
    purpose: >-
      Add a licensed-work brand invariant pinning the LICENSE parameter and the forward-standing
      licence prose to one mark, and asserting the work-identity mapping so the licensed-work
      string and the repository slug cannot silently drift apart.
  - file: tests/checks/hygiene/test_validate_licence_consistency.py
    action: Modify
    purpose: Red-before/green-after unit coverage for the new invariant.
bundled_recommendations: ["rec-3922"]
followon_recs: ["rec-3986", "rec-3987"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/DECISIONS.md carries a new `## Decision 198:` entry whose heading-to-next-heading UTF-8
    span is at most 6144 bytes, carrying a bare ```yaml metadata envelope with number 198,
    amends [101, 195, 196] and a significance block claiming numbered_decision with a
    justification that names docs/contracts/package-registry-reservation.yaml as the contract
    home considered and rejected.
  - >-
    Decision 101's body carries a dated `> **Amended by Decision 198 (2026-09-21):**` blockquote
    replacing clause (a) in full, clause (d)'s single Guerdon trading-alpha sentence, clause (e)'s
    domain line, and clause (f)'s primary-audience line -- and every pre-existing line of
    Decision 101 survives byte-identical, including the clause (d) public-content boundary.
  - >-
    Decisions 195 and 196 each carry their own dated blockquote containing the literal string
    "Decision 198", so validate_supersession_annotations sub-check (a) resolves all three
    envelope-borne amends edges.
  - >-
    Decision 101's heading line is byte-identical to its pre-change form, retaining
    "Theseus / Guerdon / Semanto" as immutable provenance.
  - >-
    The CD.21 rationale line in docs/DECISIONS.md carrying the phrase "portfolio-positive
    architectural-evolution artefact" is byte-identical to its pre-change form.
  - >-
    docs/ROADMAP-PLATFORM.yaml contains no occurrence of "portfolio purposes", "portfolio-grade"
    or "theseus init", and no occurrence of "theseus.support" inside T2.51; the single surviving
    "portfolio-narrative purposes" occurrence is T2.10's, deferred to rec-3987.
  - >-
    T2.11b's exit_criteria are structured ledger entries (id/text/status) rather than bare
    strings, so validate_platform_roadmap rule (ii) passes on the touched item.
  - >-
    LICENSE names `Licensed Work: On The Loop` and its `Licensor: Benjamin Blake` line is
    unchanged, matching validate_licence_consistency's existing regex.
  - >-
    LICENSING.md, CONTRIBUTING.md and COMMERCIAL-LICENSE.md name On The Loop in every
    forward-standing licensed-work position, while the three historical statements
    (the 2026-08-15 licence change, the pre-boundary copy sentence, and the
    `agent-platform` -> `theseus` repository rename) are unchanged.
  - >-
    validate_licence_consistency fails on a tree where LICENSE's Licensed Work is reverted to
    Theseus, and passes on the implemented tree.
  - >-
    `bin/venv-python -m scripts.validate --pre` exits 0, and
    `bin/venv-python -m scripts.decisions_index --check` reports the index current.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm Decision 198 exists, is uniquely numbered, and carries the required metadata
      envelope fields including the amends edge set and the contract-first significance claim.
    command: >-
      test "$(grep -c '^## Decision 198:' docs/DECISIONS.md)" = 1 && sed -n '/^## Decision 198:/,/^## Decision /p'
      docs/DECISIONS.md | grep -q 'amends:' && sed -n '/^## Decision 198:/,/^## Decision /p' docs/DECISIONS.md
      | grep -q 'package-registry-reservation'
    expected: >-
      Exit 0. Exactly one Decision 198 heading; its envelope declares an amends edge set and its
      significance justification names the rejected contract home.
    fix_if: >-
      More than one heading means a numbering race -- another session took 198; renumber to the
      next free number and update every pointer. A missing significance justification fails the
      Decision 167 clause 2 envelope requirement.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm the Decision 198 entry fits the 6144-byte per-entry cap, measured the way
      validate_decisions_size measures it (heading-to-next-heading UTF-8 span).
    command: >-
      bin/venv-python -c "import re;raw=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1)))
      for m in re.finditer(r'^## Decision (\\d+):',raw,re.M)];i=[k for k,(_,n) in enumerate(h) if
      n==198][0];s=h[i][0];e=h[i+1][0] if i+1<len(h) else len(raw);b=len(raw[s:e].encode('utf-8'));print('D198_BYTES',b);assert
      b<=6144,'over per-entry cap: %d' % b"
    expected: >-
      Exit 0, printing the measured span. The entry is at most 6144 bytes, measured the same
      heading-to-next-heading UTF-8 way validate_decisions_size measures it. A WARN naming
      Decision 101's changed byte span is EXPECTED elsewhere and is not a gate.
    fix_if: >-
      A hard failure means Decision 198 exceeds 6144 bytes. Compact it by moving the
      clause-by-clause derivation and the trademark measurement detail into the PR body per
      git-ops.yaml's change_record_content_rule. Never raise the cap.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins one specific entry number, so as a standing registry row it would be permanently bound
      to Decision 198 while duplicating validate_decisions_size's forward-only per-entry cap leg,
      already a registered both-tier check.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the Decision 101 amendment is a pure APPEND -- the annotation is present and every
      superseded clause line still exists byte-identical, per Decision 177 clause 1.
    command: >-
      grep -q 'Amended by Decision 198' docs/DECISIONS.md && grep -q '^- \*\*Guerdon\*\* = external brand
      for the trading PRODUCT' docs/DECISIONS.md && grep -q '^Domain: `theseus.support` (Cloudflare-managed
      DNS, already owned).$' docs/DECISIONS.md && grep -q '^- Primary audience: data-engineering hiring
      managers' docs/DECISIONS.md
    expected: >-
      Exit 0. The dated annotation exists AND the original clause (a), (e) and (f) lines survive
      verbatim, proving the correction was appended rather than spliced.
    fix_if: >-
      A missing original line means a clause was rewritten in place, which violates Decision 177's
      exact-line append-only embedding. Restore the line and move the correction into the
      blockquote.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm each envelope-borne amends victim carries the superseder's number, satisfying
      validate_supersession_annotations sub-check (a) for all three edges.
    command: >-
      for n in 101 195 196; do sed -n "/^## Decision $n:/,/^## Decision [0-9]\+:/p" docs/DECISIONS.md |
      grep -q 'Decision 198' || { echo "MISSING POINTER ON $n"; exit 1; }; done; echo ALL_POINTERS_PRESENT
    expected: >-
      Exit 0 with a line reporting all pointers present, and no line reporting a missing pointer.
    fix_if: >-
      A missing pointer is a post-merge full-tier failure that files a critical ci_rca rec. Add a
      dated blockquote to the named victim containing the literal string "Decision 198", or drop
      that number from the envelope's amends list if the edge was not intended.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-198-amends-victim-pointers
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the two immutable-provenance anchors are untouched -- Decision 101's heading and the
      CD.21 retention rationale line that rec-3922 hard-excludes.
    command: >-
      git diff origin/main -- docs/DECISIONS.md | grep '^-' | grep -v '^---' > /tmp/d198-removed.txt;
      ! grep -q '## Decision 101:' /tmp/d198-removed.txt && ! grep -q 'portfolio-positive
      architectural-evolution artefact' /tmp/d198-removed.txt && echo ANCHORS_INTACT
    expected: >-
      Exit 0 with the anchors-intact line. No removed-line in the diff touches the Decision 101
      heading or the CD.21 rationale sentence.
    fix_if: >-
      Either anchor appearing as a removed line means the header was rewritten
      (never_remove_headers) or historical rationale was edited. Restore both byte-identically.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on a live git diff against origin/main, which is this session's transient repo state
      rather than a standing property of the tree a registry row could re-evaluate later.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the roadmap brand sweep landed and that the one deliberately-deferred occurrence
      (T2.10's, held at rec-3987) is the only survivor.
    command: >-
      ! grep -q 'portfolio purposes' docs/ROADMAP-PLATFORM.yaml && ! grep -q 'portfolio-grade'
      docs/ROADMAP-PLATFORM.yaml && ! grep -q 'theseus init' docs/ROADMAP-PLATFORM.yaml &&
      test "$(grep -c 'theseus.support' docs/ROADMAP-PLATFORM.yaml)" = 0 &&
      test "$(grep -c 'portfolio-narrative purposes' docs/ROADMAP-PLATFORM.yaml)" = 1
    expected: >-
      Exit 0. Zero occurrences of the three swept phrases and of theseus.support; exactly one
      surviving portfolio-narrative occurrence, which is T2.10's deferred criterion.
    fix_if: >-
      A non-zero swept phrase means a surface was missed. A portfolio-narrative count other than 1
      means T2.10 was edited (out of scope -- it forces a six-criterion ledger migration, see
      rec-3987) or its line was lost.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm T2.11b's exit criteria were converted to structured ledger entries, satisfying
      validate_platform_roadmap rule (ii) for the touched item, and that the roadmap still parses.
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));t=[x for x in
      d['tier_items'] if x['id']=='T2.11b'][0];c=t['exit_criteria'];assert
      not any(isinstance(e,str) for e in c), 'bare strings survive';assert all(e.get('status')=='open' for e
      in c), 'unexpected status';print('T2_11B_STRUCTURED', len(c))"
    expected: >-
      Exit 0 reporting the structured marker and the criterion count. No bare strings survive and
      every converted criterion is status open, so none requires a met_by.
    fix_if: >-
      A bare string surviving fails validate_platform_roadmap rule (ii) because the item is in the
      diff. A status other than open would demand a non-empty met_by, which this plan has no basis
      to supply for a deferred_post_mvp item.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the LICENSE parameter moved to the new mark while the Licensor line stayed put, and
      that the forward-standing licence prose moved with it but the historical statements did not.
    command: >-
      grep -q '^Licensed Work: \+On The Loop' LICENSE && grep -q '^Licensor: \+Benjamin Blake' LICENSE &&
      ! grep -q '^Licensed Work: \+Theseus' LICENSE && grep -q '^Theseus changed licence on 2026-08-15'
      LICENSING.md && grep -q 'agent-platform` -> `theseus`' LICENSING.md && ! grep -q '## Using Theseus'
      LICENSING.md && ! grep -q '^Theseus is source-available' CONTRIBUTING.md && ! grep -q '^Theseus is
      licensed under' COMMERCIAL-LICENSE.md && ! grep -q 'theseus.support' COMMERCIAL-LICENSE.md
    expected: >-
      Exit 0. LICENSE names On The Loop with the Licensor untouched; the two LICENSING.md
      historical statements survive verbatim; the four forward-standing prose positions no longer
      name Theseus and the stale contact domain is gone.
    fix_if: >-
      A changed Licensor line breaks Decision 195 clause 2, which moves that line and
      validate_licence_consistency's regex together only when the IP assignment executes -- revert
      it. A missing historical line means a dated record was falsified; restore it verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: licensed-work-mark-and-historical-split
    expected_literals: []
  - step: 9
    phase: pre-deploy
    action: >-
      Red-before/green-after the new licensed-work brand invariant: the unit test must fail
      against a tree whose LICENSE still names Theseus and pass against the implemented tree.
    command: >-
      bin/venv-python -m pytest tests/checks/hygiene/test_validate_licence_consistency.py::test_licensed_work_names_the_ratified_mark
      -q
    expected: >-
      One passing test on the implemented tree. Before implementing, the same node id must FAIL --
      run it first against the un-implemented tree and record the failure.
    fix_if: >-
      A test that passes before the change proves nothing and is a false guard. Strengthen it so
      it genuinely discriminates a LICENSE naming Theseus from one naming On The Loop.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The invariant graduates into validate_licence_consistency itself, a registered both-tier
      check that runs in --pre; a separate verification-registry row would duplicate the guard it
      is already becoming.
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm the committed decisions index was regenerated from the new corpus rather than left
      stale, and that the portal invariant was respected (no direct local write).
    command: >-
      bin/venv-python -m scripts.decisions_index --check && git diff --name-only origin/main |
      grep -q '^docs/decisions-index.json$' && ! git diff --name-only origin/main | grep -q
      '^logs/.decisions-index.jsonl$'
    expected: >-
      Exit 0. The index reports current, docs/decisions-index.json is in the diff, and the
      logs/ read cache is NOT -- it is a derivative projection, never a write source.
    fix_if: >-
      A drift report means the index was not regenerated: run
      `bin/venv-python -m scripts.decisions_index --write`. A modified logs/.decisions-index.jsonl
      is a Single Portal Invariant violation (Decision 84) and fails validate_decisions_local_writes.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 11
    phase: pre-deploy
    action: >-
      Run the authoritative fast presubmit tier over the whole change, covering every decisions,
      roadmap, licence and ops-governance check the edit touches.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. validate_decision_entry_conformance, validate_decisions_size,
      validate_decisions_index_freshness, validate_decision_currency, validate_decisions_local_writes,
      validate_platform_roadmap and validate_licence_consistency all pass. A WARN on Decision 101's
      accretion span is expected and non-gating.
    fix_if: >-
      Fix the named check rather than the symptom. Do not use --ignore-budget to get past a slow
      phase; a budget bypass is surfaced as fast-tier drift in the next preflight.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: >-
      Confirm rec-3922's own acceptance probe passes, closing the bundled recommendation on its
      stated terms.
    command: >-
      grep -q 'On The Loop' docs/DECISIONS.md && ! grep -q 'portfolio purposes' docs/ROADMAP-PLATFORM.yaml
    expected: Exit 0 -- rec-3922's recorded acceptance command, run verbatim.
    fix_if: >-
      A failure here means the bundled rec is not actually discharged; do not close it. Re-check
      steps 1 and 6.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
test_obligations:
  - source: scripts/checks/hygiene/validate_licence_consistency.py
    behavior: >-
      LICENSE's Licensed Work parameter and the forward-standing licence prose name the ratified
      mark (On The Loop), and the work-identity mapping to the repository slug is asserted so the
      two cannot silently drift apart.
    verification_step: 9
    test_selector: tests/checks/hygiene/test_validate_licence_consistency.py::test_licensed_work_names_the_ratified_mark
    red_green_expectation: >-
      Red before: with LICENSE naming Theseus the check reports a licensed-work failure. Green
      after: the implemented tree passes. The existing `^Licensed Work: +\S` regex accepts ANY
      non-empty value, so without this obligation nothing catches a silent revert.
  - source: LICENSE
    behavior: >-
      The Licensed Work parameter names the ratified mark On The Loop, and the Licensor parameter
      stays Benjamin Blake until the IP assignment executes (Decision 195 clause 2).
    verification_step: 9
    test_selector: tests/checks/hygiene/test_validate_licence_consistency.py::test_licensed_work_names_the_ratified_mark
    red_green_expectation: >-
      Red before: the node id fails while LICENSE still names Theseus. Green after: it passes. The
      same test guards both the check module and this file, because the invariant IS the
      relationship between them.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      No forward-standing retired-brand or portfolio-audience string survives in the roadmap --
      specifically `theseus init`, which today contradicts T4.24's own c8 (`otl init`).
    verification_step: 6
    command: "! grep -q 'theseus init' docs/ROADMAP-PLATFORM.yaml"
    red_green_expectation: >-
      Red before: three `theseus init` occurrences exist (T4.24 name, intent and c2), so the
      negated grep exits non-zero. Green after: zero occurrences remain.
  - source: docs/decisions-index.json
    behavior: >-
      The committed index stays a faithful derivation of the live corpus, so the decision-scout
      retrieval surface and validate_decisions_index_freshness never read a stale projection.
    verification_step: 10
    command: bin/venv-python -m scripts.decisions_index --check
    red_green_expectation: >-
      Red before: once Decision 198 and the three annotations land in docs/DECISIONS.md, --check
      reports drift against the un-regenerated index. Green after: regeneration makes it current.
      Against the pristine tree the index is already fresh -- the discrimination is against the
      mid-implementation tree, which is exactly the state this guard exists to catch.
constraints:
  - >-
    Decision 101's HEADING is never rewritten (decision-entry.yaml never_remove_headers); it keeps
    "Theseus / Guerdon / Semanto" permanently as immutable provenance.
  - >-
    Every edit to a ratified live body is a pure APPEND (Decision 177 clause 1). Decision 178
    retired the mechanical guard, not the policy -- do not splice, reword or delete an existing line.
  - >-
    Decision 101 clauses (b) and (c), and ALL of clause (d) except the single Guerdon trading-alpha
    sentence, survive verbatim. The clause (d) public-content boundary is cited by ~29 live
    enforcement surfaces; orphaning it is the failure mode this plan exists to avoid.
  - >-
    Do NOT touch LICENSE's `Licensor:` line or validate_licence_consistency's
    `^Licensor: +Benjamin Blake\s*$` regex -- Decision 195 clause 2 moves those two together, in one
    commit, only when the founder-to-company IP assignment legally executes. It has not.
  - >-
    Do NOT rename the repository. `benjamin-blake/theseus` is the repo name, promoted into the
    presentation layer by Decision 171 clause 1 and distinct from the external brand. Live reasons,
    re-derived rather than inherited (Decision 75 Frame-Lock): validate_licence_consistency's
    class-(a) patterns pin the slug across seven files, and rec-3902/rec-3905 own the org transfer.
  - >-
    Do NOT touch docs/ROADMAP-SEMANTO.yaml (rec-3986) or T2.10's exit criteria (rec-3987). Both are
    recorded, reasoned deferrals -- not oversights.
  - >-
    Do NOT touch docs/contracts/package-registry-reservation.yaml. A downstream authored plan
    rebases onto main after this merges and corrects its header line itself; editing it here is a
    scope collision.
  - >-
    If any Decision text cites dbt as the naming analogue, it MUST state that dbt Core is Apache-2.0
    while this repository is deliberately BUSL-1.1 -- otherwise a later agent reasons from
    "we follow dbt" to "our core should be permissive", which is wrong.
  - >-
    Decision 198 must not exceed 6144 bytes. On pressure, relocate derivation to the PR body
    (git-ops.yaml change_record_content_rule). Never raise the cap.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: 101, 177, 149, 127, 194, 184, 84. Decisions triaged: 150 of 150. Roadmap items intersected: 9; CONFLICT: 1; RELATED: 3."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - "Carries rec-3922 (open, High, effort L). Its cited line numbers have DRIFTED -- every anchor in this plan was re-derived by content on 2026-09-21."
  - "Scout WARN (Decision 150 significance): the org handle was typed operational_fact by Decision 195 clause 4, whose routing row reads 'Never a numbered Decision'. Envelope justification must argue it stopped being revisable -- crates.io publication is immutable (yank, never delete), the OIDC subject binds the org login AND its numeric id (rec-3902), and Decision 195's own org-handle-decided reversal condition directs a successor entry to record it."
  - "Scout WARN (Decision 195): validate_supersession_annotations unions envelope-borne amends edges with textual ones, so EVERY number in `amends:` needs a victim-side pointer. VP step 4 enforces this."
  - "Scout NOTE (Decision 196): clause 7, ratified 2026-09-20, reads 'the UNDECIDED organisation handle Decision 195 clause 4 routes to rec-3905'. That becomes stale. `otl` remains the CLI alias of `ontheloop` and is NOT the org handle `otl-labs` -- state the full map in Decision 198."
  - "Scout NOTE (Decision 171 / 75 Frame-Lock): the repo-name exclusion is justified on live grounds in constraints, not inherited from Decision 171's now-retired brand premise."
  - "Scout flag (Decision 184 clause 1): the private commercial repository is an ALREADY-NAMED destination -- 'the paid management plane is a separate repository importing it (Decision 178)'. Guerdon's forward intent points there; do not invent a second destination."
  - "Measured 2026-09-21: Decision 101 spans 5835 bytes, leaving 309 bytes to the 6144 cap. Any useful annotation exceeds it and trips the WARN-tier accretion leg. That is a WARN, never a gate (decision-entry.yaml size_governance.accretion_signal)."
  - "validate_platform_roadmap rule (ii) forbids bare-string exit criteria on ANY tier_item in the diff. Measured: T2.11b 6 bare / status open (free to convert, no met_by needed); T2.10 6 bare / status complete (would need researched met_by -> deferred, rec-3987); T2.51 and T4.24 already structured (free to touch). Line 849 is inside candidate_decisions (CD.23), not a tier_item, so the rule does not apply."
  - "Independent of trademark: `theseus` is already TAKEN on PyPI, npm and crates.io (measured 2026-09-21, package-registry-reservation.yaml amendment_log); `ontheloop` is unclaimed on all three. The platform could never ship under `theseus` on any registry."
  - "Company details for the entry: ON THE LOOP LABS LIMITED, registered in England and Wales, company no. 17468271, registered office 66 Paul Street, London, EC2A 4NA. These are public register facts, not confidential operational data (AGENTS.md public-content boundary)."
  - "Identifier map to record: org handle `otl-labs`; web `onthelooplabs.com`; email `otl-labs.com`; distribution namespace `ontheloop`; CLI alias `otl`. Settles Decision 195 clause 4 and discharges its org-handle-decided reversal condition."
  - "Trademark basis: UK00004363856, registered 2026-03-27, classes 9 and 42, limited by 'namely' to deterministic runtime software / customers' calculation and decision logic / real-time pricing and risk / market data processing and operational analytics. 'operational analytics' is why threading a specification around it is infeasible."
