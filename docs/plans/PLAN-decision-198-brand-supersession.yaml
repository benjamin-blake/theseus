schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-198-brand-supersession"
intent: >-
  Retire Theseus and Guerdon as external brands in favour of On The Loop Labs Limited (company)
  and On The Loop (product, one mark covering both), so the platform's product-facing surfaces
  carry a single ratified mark before adoption rather than after, and so the identifier bindings
  that mark determines stop blocking the GitHub org transfer.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-198-brand-supersession.yaml
phase: >-
  No platform roadmap tier_item. Brand/identity governance in the same class as rec-3905 and
  PLAN-ontheloop-package-registries, filed under the soft-warn exception category ad_hoc_rec --
  the Tier Item Freshness Gate does not fire because no tier_item is claimed. TOUCHES (does not
  claim) T2.10 (complete), T2.11b, T2.51 and T4.24 (all deferred_post_mvp), plus the CD.23
  detail text and the roadmap's own document.description.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add Decision 198; append dated amendment blockquotes to Decisions 101, 195 and 196. All four
      edits are pure appends -- no existing body line is rewritten or removed (Decision 177).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate the committed index so validate_decisions_index_freshness stays green.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Correct six forward-standing surfaces: document.description's "Theseus platform roadmap",
      CD.23's detail text, T2.10's portfolio-narrative exit criterion, T2.11b's files_in_scope
      comment plus its bare-string exit-criteria conversion, T2.51's three theseus.support
      references, and T4.24's three `theseus init` strings.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Title line names the retired brand. Layer 1 ambient load-set -- see the S1 prose-budget
      constraint, which leaves only single-digit byte headroom.
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Title line names the retired brand. Layer 2 knowledge base.
  - file: LICENSE
    action: Modify
    purpose: Licensed Work parameter Theseus -> On The Loop. The Licensor line is NOT touched.
  - file: LICENSING.md
    action: Modify
    purpose: >-
      Forward-standing licensed-work heading, plus a continuity note recording that On The Loop is
      the same Licensed Work formerly named Theseus. Historical statements stay verbatim.
  - file: CONTRIBUTING.md
    action: Modify
    purpose: Two forward-standing licensed-work references (lines 3 and 15).
  - file: COMMERCIAL-LICENSE.md
    action: Modify
    purpose: One forward-standing licensed-work reference and the theseus.support contact sentence.
  - file: scripts/checks/hygiene/validate_licence_consistency.py
    action: Modify
    purpose: >-
      Add a licensed-work brand invariant pinning the LICENSE parameter and the forward-standing
      licence prose to one mark, and asserting the work-identity mapping so the licensed-work
      string and the repository slug cannot silently drift apart.
  - file: tests/checks/hygiene/test_validate_licence_consistency.py
    action: Modify
    purpose: >-
      Red-before/green-after coverage for the new invariant. Also updates three EXISTING
      surfaces the new leg breaks -- the `_VALID_LICENSE` fixture, the line-113 `.replace`
      anchored on its literal, and TestAccountingDeclaration's hardcoded examined count.
bundled_recommendations: ["rec-3922"]
followon_recs: ["rec-3986", "rec-3990"]
infrastructure_dependencies:
  - >-
    data-pipeline (src/lambdas/data-pipeline/manifest.yaml, status: active) -- packages
    docs/ROADMAP-PLATFORM.yaml as an `assets:` entry, so compute_affected_artifacts() reports
    this plan as affecting it. NO DEPLOY IS PERFORMED: see the no-redeploy constraint and VP
    step 12, which assert the ground rather than leaving it implicit.
acceptance_criteria:
  - >-
    docs/DECISIONS.md carries a new `## Decision 198:` entry whose heading-to-next-heading UTF-8
    span is at most 6144 bytes, carrying a bare ```yaml metadata envelope with number 198,
    amends [101, 195, 196] and a significance block claiming numbered_decision. The justification
    answers BOTH routing challenges: it names docs/contracts/package-registry-reservation.yaml as
    the contract home considered and rejected (the field_semantics row), AND it addresses the
    operational_fact row that Decision 195 clause 4 used to type the org handle.
  - >-
    Decision 101's body carries a dated `> **Amended by Decision 198 (2026-09-21):**` blockquote
    replacing clause (a) in full, clause (d)'s single Guerdon trading-alpha sentence, clause (e)'s
    domain line, and clause (f)'s primary-audience line.
  - >-
    NO line within Decision 101's heading-to-next-heading span appears as a removed line in
    `git diff origin/main -- docs/DECISIONS.md`. This is the plan's highest-consequence invariant:
    ~29 live enforcement surfaces bind to clause (d)'s public-content boundary.
  - >-
    Decisions 195 and 196 each carry their own dated blockquote containing the literal string
    "Decision 198", so validate_supersession_annotations sub-check (a) resolves all three
    envelope-borne amends edges.
  - >-
    The CD.21 rationale line in docs/DECISIONS.md carrying the phrase "portfolio-positive
    architectural-evolution artefact" is byte-identical to its pre-change form.
  - >-
    docs/ROADMAP-PLATFORM.yaml contains ZERO case-insensitive occurrences of "portfolio purposes",
    "portfolio-grade", "portfolio-narrative", "theseus init", "theseus.support" and
    "Theseus platform", while its single `benjamin-blake/theseus` repository reference survives.
  - >-
    T2.11b's exit_criteria are structured ledger entries (id/text/status) rather than bare strings,
    per docs/contracts/exit-criteria-ledger.yaml -- adopted on that contract's own merit, NOT
    because validate_platform_roadmap rule (ii) demands it (it does not; see the context note).
  - >-
    AGENTS.md and docs/PROJECT_CONTEXT.md no longer name Theseus in their title lines, and both
    surfaces remain within their config/prose_budgets.yaml budgets (S1 root_ambient_load_set and
    S8), which validate_prose_limits enforces at zero headroom.
  - >-
    LICENSE names `Licensed Work: On The Loop` and its `Licensor: Benjamin Blake` line is
    unchanged, matching validate_licence_consistency's existing regex.
  - >-
    LICENSING.md, CONTRIBUTING.md and COMMERCIAL-LICENSE.md name On The Loop in every
    forward-standing licensed-work position (LICENSING.md:71, CONTRIBUTING.md:3 and :15,
    COMMERCIAL-LICENSE.md:3 and :24), while the historical statements (the 2026-08-15 licence
    change, the pre-boundary copy sentence, the `agent-platform` -> `theseus` repository rename,
    and the GitHub issues URL) are unchanged.
  - >-
    validate_licence_consistency fails on a tree where LICENSE's Licensed Work is reverted to
    Theseus, and passes on the implemented tree.
  - >-
    rec-3922 reads status closed after the portal update, and its own recorded acceptance command
    passes.
  - >-
    `bin/venv-python -m scripts.validate --pre` exits 0, and
    `bin/venv-python -m scripts.decisions_index --check` reports the index current.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm Decision 198 exists, is uniquely numbered, and carries the required metadata
      envelope including the amends edge set and BOTH significance rebuttals.
    command: >-
      test "$(grep -c '^## Decision 198:' docs/DECISIONS.md)" = 1 && sed -n '/^## Decision 198:/,/^## Decision /p'
      docs/DECISIONS.md | grep -q 'amends:' && sed -n '/^## Decision 198:/,/^## Decision /p' docs/DECISIONS.md
      | grep -q 'package-registry-reservation' && sed -n '/^## Decision 198:/,/^## Decision /p' docs/DECISIONS.md
      | grep -qi 'operational.fact'
    expected: >-
      Exit 0. Exactly one Decision 198 heading; its envelope declares an amends edge set and its
      significance justification answers both the field_semantics and operational_fact routing
      challenges.
    fix_if: >-
      More than one heading means a numbering race -- another session took 198; renumber to the
      next free number and update every pointer. A missing rebuttal fails Decision 167 clause 2's
      envelope requirement and the rec-3015/rec-3016 property tests.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm the Decision 198 entry fits the 6144-byte per-entry cap, measured the way
      validate_decisions_size measures it (heading-to-next-heading UTF-8 span).
    command: >-
      bin/venv-python -c "import re;raw=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1)))
      for m in re.finditer(r'^## Decision (\\d+):',raw,re.M)];i=[k for k,(_,n) in enumerate(h) if
      n==198][0];s=h[i][0];e=h[i+1][0] if i+1<len(h) else len(raw);b=len(raw[s:e].encode('utf-8'));print('bytes',b);assert
      b<=6144,'over per-entry cap: %d' % b"
    expected: >-
      Exit 0, printing the measured span. The entry is at most 6144 bytes. A WARN naming
      Decision 101's changed byte span is EXPECTED elsewhere and is not a gate.
    fix_if: >-
      A hard failure means Decision 198 exceeds 6144 bytes. Compact it by moving the
      clause-by-clause derivation and the trademark measurement detail into the PR body per
      git-ops.yaml's change_record_content_rule. Never raise the cap.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins one specific entry number, so as a standing registry row it would be permanently bound
      to Decision 198 while duplicating validate_decisions_size's forward-only per-entry cap leg,
      already a registered both-tier check.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the Decision 101 amendment is a pure APPEND -- the annotation is present and the
      superseded clause lines still exist byte-identical, per Decision 177 clause 1.
    command: >-
      grep -q 'Amended by Decision 198' docs/DECISIONS.md && grep -q '^- \*\*Guerdon\*\* = external brand
      for the trading PRODUCT' docs/DECISIONS.md && grep -q '^Domain: `theseus.support` (Cloudflare-managed
      DNS, already owned).$' docs/DECISIONS.md && grep -q '^- Primary audience: data-engineering hiring
      managers' docs/DECISIONS.md
    expected: >-
      Exit 0. The dated annotation exists AND the original clause (a), (e) and (f) lines survive
      verbatim, proving the correction was appended rather than spliced.
    fix_if: >-
      A missing original line means a clause was rewritten in place, which violates Decision 177's
      exact-line append-only embedding. Restore the line and move the correction into the
      blockquote.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: >-
      Close the byte-identity gap generally: assert that NO line inside Decision 101's
      heading-to-next-heading span was removed by this change. Spot-checking anchors is not
      enough for the plan's highest-consequence invariant.
    command: >-
      bin/venv-python -c "import re,subprocess;base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True,check=True).stdout;cur=open('docs/DECISIONS.md',encoding='utf-8').read();span=lambda
      t:(lambda m:t[m.start():(lambda n:n.start() if n else len(t))(re.compile(r'^##
      Decision ',re.M).search(t,m.end()))])(re.compile(r'^## Decision 101:',re.M).search(t));b=span(base).splitlines();c=set(span(cur).splitlines());miss=[l
      for l in b if l not in c];print('missing',len(miss));assert not miss,'removed from Decision 101: %r' % miss[:3]"
    expected: >-
      Exit 0 reporting zero missing lines. Every line of Decision 101 as it stands on origin/main
      is still present in the amended entry, including the whole clause (d) public-content
      boundary.
    fix_if: >-
      Any missing line means part of Decision 101 was deleted or reworded in place. Restore it
      byte-identically and express the correction only inside the appended blockquote.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Reads the origin/main image via git show, so it depends on this session's transient base-ref
      state rather than a standing property of the tree a registry row could re-evaluate later.
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm each envelope-borne amends victim carries the superseder's number, satisfying
      validate_supersession_annotations sub-check (a) for all three edges.
    command: >-
      for n in 101 195 196; do sed -n "/^## Decision $n:/,/^## Decision [0-9]\+:/p" docs/DECISIONS.md |
      grep -q 'Decision 198' || { echo "MISSING POINTER ON $n"; exit 1; }; done
    expected: >-
      Exit 0 with no line reporting a missing pointer.
    fix_if: >-
      A missing pointer is a post-merge full-tier failure that files a critical ci_rca rec. Add a
      dated blockquote to the named victim containing the literal string "Decision 198", or drop
      that number from the envelope's amends list if the edge was not intended.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-198-amends-victim-pointers
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the two immutable-provenance anchors are untouched -- Decision 101's heading
      (never_remove_headers) and the CD.21 retention rationale rec-3922 hard-excludes.
    command: >-
      git diff origin/main -- docs/DECISIONS.md | grep '^-' | grep -v '^---' > /tmp/d198-removed.txt;
      ! grep -q '## Decision 101:' /tmp/d198-removed.txt && ! grep -q 'portfolio-positive
      architectural-evolution artefact' /tmp/d198-removed.txt
    expected: >-
      Exit 0. No removed line in the diff touches the Decision 101 heading or the CD.21 rationale
      sentence.
    fix_if: >-
      Either anchor appearing as a removed line means the header was rewritten or historical
      rationale was edited. Restore both byte-identically.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on a live git diff against origin/main, this session's transient repo state rather
      than a standing property of the tree.
  - step: 7
    phase: pre-deploy
    action: >-
      Sweep the whole roadmap for every retired-brand and stale-audience token in one assertion,
      while proving the legitimate repository reference survives.
    command: >-
      test "$(grep -ciE 'portfolio purposes|portfolio-grade|portfolio-narrative|theseus init|theseus\.support|Theseus
      platform' docs/ROADMAP-PLATFORM.yaml)" = 0 && test "$(grep -c 'benjamin-blake/theseus' docs/ROADMAP-PLATFORM.yaml)" = 1
    expected: >-
      Exit 0. Zero matches across all six corrected surfaces (document.description, CD.23, T2.10,
      T2.11b, T2.51, T4.24), and the single benjamin-blake/theseus repository reference is intact
      -- the repository is NOT renamed by this plan.
    fix_if: >-
      A non-zero count means a surface was missed; `grep -niE` with the same pattern names the
      line. A repo-reference count other than 1 means the sweep over-reached into the repository
      name, which is out of scope.
    hermetic: true
    graduation: graduate
    graduation_check_id: roadmap-retired-brand-tokens-absent
    expected_literals: []
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm T2.11b's exit criteria were converted to structured ledger entries and that the
      roadmap still parses.
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));t=[x for x in
      d['tier_items'] if x['id']=='T2.11b'][0];c=t['exit_criteria'];assert
      not any(isinstance(e,str) for e in c),'bare strings survive';assert all(e.get('status')=='open' for e
      in c),'unexpected status';print('criteria',len(c))"
    expected: >-
      Exit 0 reporting the criterion count. No bare strings survive and every converted criterion
      is status open, so none requires a met_by.
    fix_if: >-
      A bare string surviving means the conversion was partial. A status other than open would
      demand a non-empty met_by, which this plan has no basis to supply for a deferred_post_mvp
      item.
    hermetic: true
    graduation: graduate
    graduation_check_id: t2-11b-exit-criteria-structured
    expected_literals: []
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the LICENSE parameter moved to the new mark while the Licensor line stayed put, and
      that the forward-standing licence prose moved with it but the historical statements did not.
    command: >-
      grep -q '^Licensed Work: \+On The Loop' LICENSE && grep -q '^Licensor: \+Benjamin Blake' LICENSE &&
      ! grep -q '^Licensed Work: \+Theseus' LICENSE && grep -q '^Theseus changed licence on 2026-08-15'
      LICENSING.md && grep -q 'agent-platform` -> `theseus`' LICENSING.md && ! grep -q '## Using Theseus'
      LICENSING.md && ! grep -q '^Theseus is source-available' CONTRIBUTING.md && ! grep -q 'offers Theseus
      under two licences' CONTRIBUTING.md && ! grep -q '^Theseus is licensed under' COMMERCIAL-LICENSE.md &&
      ! grep -q 'theseus.support' COMMERCIAL-LICENSE.md && grep -q 'github.com/benjamin-blake/theseus/issues'
      COMMERCIAL-LICENSE.md
    expected: >-
      Exit 0. LICENSE names On The Loop with the Licensor untouched; the LICENSING.md historical
      statements and the GitHub issues URL survive verbatim; all five forward-standing prose
      positions no longer name Theseus and the stale contact domain is gone.
    fix_if: >-
      A changed Licensor line breaks Decision 195 clause 2, which moves that line and
      validate_licence_consistency's regex together only when the IP assignment executes -- revert
      it. A missing historical line means a dated record was falsified; restore it verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: licensed-work-mark-and-historical-split
    expected_literals: []
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm the two agent-instruction surfaces were retitled AND still fit their prose budgets,
      which validate_prose_limits enforces at ZERO headroom.
    command: >-
      bin/venv-python -c "import os,yaml;b=yaml.safe_load(open('config/prose_budgets.yaml'));s1=os.path.getsize('CLAUDE.md')+os.path.getsize('AGENTS.md');s8=os.path.getsize('docs/PROJECT_CONTEXT.md');print('s1',s1,'s8',s8);assert
      s1<=b['S1']['root_ambient_load_set'],'S1 over budget by %d' % (s1-b['S1']['root_ambient_load_set']);assert
      s8<=b['S8']['docs/PROJECT_CONTEXT.md'],'S8 over budget'" && ! grep -q 'Theseus Platform' AGENTS.md &&
      ! grep -q '^# Theseus' docs/PROJECT_CONTEXT.md
    expected: >-
      Exit 0 printing both measured sizes. Neither surface names Theseus in its title and both sit
      at or under budget.
    fix_if: >-
      S1 had only 6 bytes of headroom when this plan was authored, so an over-budget failure is
      expected if the replacement title is longer than planned. Shorten the title, or reclaim
      bytes elsewhere in AGENTS.md -- do NOT raise the budget, which needs a
      `# raise-approved: dec-NNN` marker naming a real Decision header.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The budget half duplicates validate_prose_limits, a registered check; and the assertion is
      green on the un-implemented tree (both surfaces are currently in budget), so graduating it
      would redden this plan's own PR under the RED-BEFORE replay leg.
    expected_literals: []
  - step: 11
    phase: pre-deploy
    action: >-
      Red-before/green-after the new licensed-work brand invariant, and confirm the three existing
      tests the new leg touches still pass.
    command: >-
      bin/venv-python -m pytest tests/checks/hygiene/test_validate_licence_consistency.py -q
    expected: >-
      All tests pass, including the new
      test_licensed_work_names_the_ratified_mark. Before implementing, that node id must FAIL --
      run it first against the un-implemented tree and record the failure.
    fix_if: >-
      A test that passes before the change proves nothing and is a false guard. If
      TestAccountingDeclaration's examined count fails, the new leg changed how many files the
      check examines -- update the count and its explanatory comment rather than suppressing it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The invariant graduates into validate_licence_consistency itself, a registered both-tier
      check that runs in --pre; a separate verification-registry row would duplicate the guard it
      is already becoming.
  - step: 12
    phase: pre-deploy
    action: >-
      Assert the ground for performing NO Lambda redeploy despite touching a packaged asset of an
      active manifest -- rather than leaving that disposition implicit.
    command: >-
      grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q
      'ROADMAP-PLATFORM' .github/workflows/deploy-prod-lambdas.yml
    expected: >-
      Exit 0. The manifest still records both functions' schedules as disabled (Decision
      61/37/116), so no live consumer reads the packaged roadmap; and the governed deploy channel
      does not path-trigger on this file, so the merge ships no code.
    fix_if: >-
      If the schedules are no longer disabled, this plan's V2 tier no longer holds -- escalate to
      V3 and ship through .github/workflows/deploy-prod-lambdas.yml (workflow_dispatch), never a
      local build_lambda --deploy. If the workflow now path-triggers on the roadmap, rec-3990 has
      landed and this step should be retired.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green on the un-implemented tree (both facts already hold today), so graduating it would
      redden this plan's own PR under the RED-BEFORE replay leg; the durable form of this
      assertion is rec-3990's disposition, not a row pinned to this plan.
    expected_literals: []
  - step: 13
    phase: pre-deploy
    action: >-
      Confirm the committed decisions index was regenerated from the new corpus, and that the
      Single Portal Invariant was respected (no direct local write to the read cache).
    command: >-
      bin/venv-python -m scripts.decisions_index --check && git diff --name-only origin/main |
      grep -q '^docs/decisions-index.json$' && ! git diff --name-only origin/main | grep -q
      '^logs/.decisions-index.jsonl$'
    expected: >-
      Exit 0. The index reports current, docs/decisions-index.json is in the diff, and the logs/
      read cache is NOT -- it is a derivative projection, never a write source.
    fix_if: >-
      A drift report means the index was not regenerated: run
      `bin/venv-python -m scripts.decisions_index --write`. A modified logs/.decisions-index.jsonl
      is a Decision 84 violation and fails validate_decisions_local_writes.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 14
    phase: pre-deploy
    action: >-
      Confirm the bundled recommendation actually CLOSED, which is distinct from its acceptance
      probe passing.
    command: >-
      bin/venv-python -c "import json;rows=[json.loads(l) for l in
      open('logs/.recommendations-log.jsonl')];r=[x for x in rows if x.get('id')=='rec-3922'];assert
      r,'rec-3922 absent from the read cache';st=r[-1].get('status');print('status',st);assert
      st=='closed','rec-3922 status is %s' % st"
    expected: >-
      Exit 0 reporting status closed. update_rec writes through to the local JSONL and refreshes
      the read cache, so no separate pull is needed.
    fix_if: >-
      Status still open means execution step 14's update_rec call did not run or failed. Re-run it
      through the portal -- never hand-edit logs/.recommendations-log.jsonl, which
      validate_decisions_local_writes and the Single Portal Invariant forbid.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pinned to one recommendation id, so as a standing registry row it would assert a permanently
      frozen fact about rec-3922 rather than a reusable property of the tree.
    expected_literals: []
  - step: 15
    phase: pre-deploy
    action: >-
      Run rec-3922's own recorded acceptance command verbatim, so the rec is discharged on its
      stated terms rather than on this plan's paraphrase of them.
    command: >-
      grep -q 'On The Loop' docs/DECISIONS.md && ! grep -q 'portfolio purposes' docs/ROADMAP-PLATFORM.yaml
    expected: Exit 0 -- rec-3922's acceptance command, unmodified.
    fix_if: >-
      A failure means the bundled rec is not actually discharged on its own terms; do not close
      it. Re-check steps 1 and 7.
    hermetic: true
    graduation: not-applicable
    expected_literals: []
  - step: 16
    phase: pre-deploy
    action: >-
      Run the authoritative fast presubmit tier over the whole change, covering every decisions,
      roadmap, prose, licence and ops-governance check the edit touches.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. validate_decision_entry_conformance, validate_decisions_size,
      validate_decisions_index_freshness, validate_decision_currency, validate_decisions_local_writes,
      validate_platform_roadmap, validate_prose_limits and validate_licence_consistency all pass.
      A WARN on Decision 101's accretion span is expected and non-gating.
    fix_if: >-
      Fix the named check rather than the symptom. Do not use --ignore-budget to get past a slow
      phase; a budget bypass is surfaced as fast-tier drift in the next preflight.
    hermetic: false
    graduation: not-applicable
  - step: 17
    phase: pre-deploy
    action: >-
      Run the FULL presubmit tier before handoff, as handoff_policy.full_validation_required_before_commit
      declares. The fast tier alone does not discharge that declaration (rec-2965 / Decision 163).
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0 on a completed full run. This additionally exercises the full-tier-only decision
      checks -- notably validate_supersession_annotations, which is where a missing victim-side
      pointer on Decision 195 or 196 would otherwise surface post-merge as a critical ci_rca rec.
    fix_if: >-
      A timeout is `blocked`, not a pass: resume later and rerun the full tier from the start
      rather than committing on a partial run. A full-tier-only failure that reproduces on
      origin/main is not this plan's -- confirm against a clean tree before diagnosing.
    hermetic: false
    graduation: not-applicable
