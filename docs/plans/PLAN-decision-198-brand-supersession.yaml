  consequence, so `git revert` of the squash-merge commit fully restores the prior state. No Lambda
  is redeployed (see the no-deploy constraint), so no deployed artifact needs reverting. Two
  ordering notes: regenerate docs/decisions-index.json after any revert of docs/DECISIONS.md, or
