rollback: >-
  Every change is an additive text edit in version control with no runtime, infrastructure or data
  consequence, so `git revert` of the squash-merge commit fully restores the prior state. The one
  ordering constraint: regenerate docs/decisions-index.json after any revert of docs/DECISIONS.md,
  or validate_decisions_index_freshness fails in both tiers. Nothing here deploys, applies
  Terraform, or writes a warehouse row beyond the rec-3922 closure, which update_rec can reopen.
