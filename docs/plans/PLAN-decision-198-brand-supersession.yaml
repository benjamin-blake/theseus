      names the ratified mark (On The Loop), and LICENSING.md's continuity note names both the
      current and the former mark so a pre-rename licensee can still identify the work their grant
      covers. The leg reads no other file; the forward-standing positions in CONTRIBUTING.md,
      COMMERCIAL-LICENSE.md and README.md are guarded by VP step 9, which graduates into the
      registry as licensed-work-mark-and-historical-split.
    verification_step: 11
    test_selector: tests/checks/hygiene/test_validate_licence_consistency.py
    red_green_expectation: >-
      Red before: with LICENSE naming Theseus the new node id reports a licensed-work failure, and
      with LICENSING.md carrying no continuity note the second node id fails too. Green after: the
      whole module passes, including the three fixture surfaces the narrowed leg touches.
