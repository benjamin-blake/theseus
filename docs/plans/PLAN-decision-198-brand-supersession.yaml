    presentation layer by Decision 171 clause 1 and distinct from the external brand. Live reasons,
    re-derived rather than inherited (Decision 75 Frame-Lock): validate_licence_consistency's
    class-(a) patterns pin the slug across seven files, and rec-3902/rec-3905 own the org transfer.
  - >-
    NO LAMBDA DEPLOY. docs/ROADMAP-PLATFORM.yaml is an `assets:` entry of the status-active
    data-pipeline manifest, so the Lambda Deployment Assessment fires -- but the governed channel
    (.github/workflows/deploy-prod-lambdas.yml) does not path-trigger on it, and both functions'
    schedules are disabled (Decision 61/37/116), so the packaged copy has no live consumer. VP step
    12 asserts that ground. Never fall back to a local `build_lambda --deploy`, which is
    break-glass only. The standing gap is rec-3990.
  - >-
    S1 PROSE BUDGET IS EFFECTIVELY FULL. config/prose_budgets.yaml sets root_ambient_load_set to
    18943 against 18937 measured on 2026-09-21 -- SIX bytes of headroom, enforced at zero headroom
    by validate_prose_limits. The AGENTS.md title change must be net-neutral or near it. Reclaiming
    the two bytes lost to the non-ASCII em dash on that same line (AGENTS.md forbids em dashes) is
    the cheapest way to buy room. Do NOT raise the budget: that needs a `# raise-approved: dec-NNN`
    marker naming a real Decision header (Decision 128/165).
  - >-
    The four remaining internal "Theseus" occurrences -- `src/__init__.py:1`,
    `src/common/__init__.py:1`, `config/agent/data_quality/ops.yaml:209` and
    `config/agent/data_quality/decisions/ops_decisions.yaml:10` -- are DELIBERATELY retained as
    internal docstring/description prose, not external brand surfaces. Recorded so the residue is
    explicit rather than silent; revisit only with the repository rename.
  - >-
    Do NOT touch docs/ROADMAP-SEMANTO.yaml (rec-3986). It is a recorded, reasoned deferral --
    Semanto survives as the internal marketing/comms roadmap name only, never a public-facing mark.
  - >-
    Do NOT touch docs/contracts/package-registry-reservation.yaml. A downstream authored plan
    rebases onto main after this merges and corrects its header line itself; editing it here is a
    scope collision.
  - >-
    If any Decision text cites dbt as the naming analogue, it MUST state that dbt Core is Apache-2.0
    while this repository is deliberately BUSL-1.1 -- otherwise a later agent reasons from
    "we follow dbt" to "our core should be permissive", which is wrong.
  - >-
    Decision 198 must not exceed 6144 bytes. On pressure, relocate derivation to the PR body
    (git-ops.yaml change_record_content_rule). Never raise the cap.
  - No rescue agents or workaround loops (Decision 55).
