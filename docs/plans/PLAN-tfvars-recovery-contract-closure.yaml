constraints:
- Decision 101 public-repo boundary - no email address, AWS account id, ARN or ExternalId enters a tracked
  file. Role-alias SEMANTICS may be documented; literal addresses may not.
- DEP-13 / Decision 144 point 3 - PlatformDev is denied tfstate reads by design. The secret fetch must
  stay admin-only; do not add it to the DEV container path.
- Decision 84 Single Portal Invariant - rec closures go through scripts.ops_data_portal only; never edit
  logs/.recommendations-log.jsonl.
- Class D contract changes require an amendment_log entry (validate_contract_drift / check_amendment_log_for_class_d).
- Decision 86 - no new standing prose-architecture doc; the role-alias semantics ride the existing contract's
  per-variable table.
- No rescue agents or workaround loops (Decision 55).
- Out of scope by design - adding alerts_email to redaction_check.py's _SCRUB_SPECS and any owner_email
  / alerts_email VALUE change. Both belong to the sequenced follow-on plan, which must land the redaction
  fix BEFORE any value change reaches a PR.
- Decision 103 - a semantic relevance verdict never auto-closes a rec. rec-2843 closes deterministically
  with its own acceptance output recorded as proof; rec-3950's misdiagnosis verdict routes as close_proposed
  for operator confirmation.
- Decision 126 - materialisation is an enabler for the HUMAN-GATED break-glass loop only. An agent still
  never self-directs terraform apply. State this in the script comment and in the deploy-paths amendment
  so the change reads as tier hygiene, not as making the escape hatch more ambient.
- Decision 170 - the new leg must report its examined population so a vacuous pass is distinguishable
  from an enforced one.
- Decision 190 - rec-3950 carries source=tf_drift but was filed from the stale recovery procedure, not
  a measured plan diff; say so in the resolution so the drift lane's record stays honest.
- DEP-08 / rec-2663 consolidated 4-5 duplicated materialise-tfvars copies into one composite action; this
  plan must not create a second. The single implementation lives under the action directory (the delegate
  location the shell-bodies guard recognises) and BOTH the action and bin/setup-cloud-env.sh call it.
  The baseline's touch-it-fix-it rule makes the extraction mandatory once a baselined body is edited,
  so this is the sanctioned remedy, not scope creep.
- 'Collapsing action.yml''s three steps into one adapter MUST preserve the `working-directory` input and
  the adapter step''s `working-directory: ${{ inputs.working-directory }}` wiring. All four current call
  sites rely on the default ''.'', and the delegate writes terraform/personal/terraform.personal.tfvars
  relative to cwd, so dropping it is a silent wrong-path write on the terraform apply path.'
- '::add-mask:: is a GitHub-runner sentinel, not a redaction primitive. Gate its emission on $GITHUB_ACTIONS
  -- unset, the literal account_id and both ExternalIds would be printed to the local session transcript,
  breaching tfvars_and_remote_state_recovery.never_paste and Decision 101.'
- 'The INSTALL_TERRAFORM gate lives in bin/setup-cloud-env.sh, NEVER in the shared delegate. Measured
  2026-09-21: INSTALL_TERRAFORM appears zero times in .github/workflows/, so a guard in the shared unit
  would no-op the composite action at all four apply call sites and disable the reconcile heal verb Decision
  126 point 2 protects.'
