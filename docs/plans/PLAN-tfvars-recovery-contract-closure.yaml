schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tfvars-recovery-contract-closure
intent: Correct a stale, actively-misleading tfvars recovery procedure in two Class D contracts and make
  the correction machine-enforced, so a break-glass agent cannot follow a documented path that returns
  a wrong value. Supports the governed-deployment leg of the platform control plane.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tfvars-recovery-contract-closure.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Driven by rec-3950 plus a defect hit live in a break-glass session. Adjacent to T2.44's DEP-13 fence,
  which this plan preserves rather than modifies.
scope:
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: recoverable_vars says four no-default vars; there are five. Restructure where_values_live from
    one prose blob into a per-variable mapping, add the owner_vs_alerts_email non-interchangeability key
    and per-variable role-alias semantics (no literal addresses), and log the change in amendment_log
    (Class D obligation).
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: admin_out_of_band.procedure carries the same four-var list; correct to five and replace the
    inline per-variable detail with a pointer to the owning contract so this file stays navigation. Requires
    its own amendment_log entry (Class D).
- file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
  action: Modify
  purpose: 'Add a BIDIRECTIONAL third leg: every no-default variable declared in terraform/personal/*.tf
    appears in the contract''s where_values_live mapping (module subset of contract), AND every key listed
    there is still declared in the module (contract subset of module). The second direction is what stops
    a stale entry for a retired variable surviving in the standing guard.'
- file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
  action: Modify
  purpose: Cover the HCL no-default parser and all three red paths -- unlisted, stale and scalar-shaped
    -- plus a live contract-vs-module assertion that fails if a future variable lands undocumented or
    a retired one lingers.
bundled_recommendations:
- rec-3950
- rec-2843
followon_recs:
- rec-3975
- rec-3977
- rec-3978
infrastructure_dependencies: []
acceptance_criteria:
- terraform-cc-web-operations.yaml names all five no-default variables and gives each its own recovery
  source; no variable shares a source entry with another.
- The contract records that owner_email and alerts_email differ by design and that the resulting Owner
  tag-churn diff is a recovery artefact, never drift to apply.
- validate_terraform_cc_web_operations fails BOTH when a no-default variable declared in terraform/personal/*.tf
  is absent from where_values_live AND when where_values_live lists a key the module no longer declares;
  it passes on the corrected pair.
- No email address or AWS account id is introduced into any tracked file by this plan.
- rec-2843 is closed with its acceptance output recorded as the closure proof; rec-3950 is routed close_proposed
  with its misdiagnosis resolution recorded, and remains open pending operator confirmation (Decision
  103).
- tfvars_and_remote_state_recovery.recovery_procedure names the materialisation path, so the stale state-parse-only
  procedure this plan's intent calls out cannot survive it.
- deploy-paths.yaml's admin_out_of_band tfvars-recovery step names five variables and POINTS at the owning
  contract, with its inline per-variable location detail and its stale terraform/CLAUDE.md pointer removed
  -- not merely supplemented, which would leave it a second source of truth against Decision 126 point
  2.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Contract enumerates five no-default vars with per-variable sources
  command: bin/venv-python -c "import yaml; r=yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml'))['tfvars_and_remote_state_recovery'];
    t=r['where_values_live']; assert isinstance(t, dict), 'where_values_live is still a scalar prose blob';
    ks=sorted(k for k in t if k!='description'); assert ks==['account_id','alerts_email','owner_email','platform_admin_external_id','platform_dev_external_id'],
    ks; v=str(r['owner_vs_alerts_email']).lower(); assert 'owner_email' in v and 'alerts_email' in v,
    'key names both variables'; assert 'by design' in v, 'must state the values differ by design'; assert
    'recovery artefact' in v, 'must state the tag-churn diff is a recovery artefact'; assert 'materialise'
    in str(r['recovery_procedure']).lower(), 'recovery_procedure still prescribes only the state-parse
    path'; assert 'materialis' in str(r['admin_tier_only']).lower(), 'admin_tier_only still grounds itself
    only in tfstate reads and does not cover the materialisation path'; print('CONTRACT SHAPE OK')"
  expected: Prints CONTRACT SHAPE OK. Asserts the table covers exactly the five variables, that owner_vs_alerts_email
    names both variables and states they differ by design and that the tag-churn diff is a recovery artefact,
    AND that recovery_procedure now points at the materialisation path rather than only the state-parse
    it was written for.
  fix_if: '''where_values_live is still a scalar prose blob'' means the per-variable restructure has not
    landed. A short key list names the variable still missing. A bare KeyError means the owner_vs_alerts_email
    key is absent entirely; a named assertion says which of its clauses, or recovery_procedure''s materialisation
    pointer, is missing.'
  hermetic: true
  expected_literals:
  - CONTRACT SHAPE OK
  graduation: waive
  graduation_waiver_reason: Step 4 graduates ONLY the bidirectional coverage invariant, which is the clause
    that drifts mechanically as the module gains or retires variables. This step's other clauses -- owner_vs_alerts_email's
    by-design and recovery-artefact wording, and recovery_procedure naming the materialisation path --
    are one-time prose corrections with no mechanical drift vector, and any later edit to them is separately
    caught by validate_contract_drift's Class D amendment_log rule. A registry row over fixed prose substrings
    would be brittle without adding coverage.
- step: 2
  phase: pre-deploy
  action: Both Class D contracts gained an amendment_log entry relative to main
  command: 'bin/venv-python -c "import subprocess,yaml; h=lambda p: len(yaml.safe_load(open(p))[''amendment_log'']);
    b=lambda p: len(yaml.safe_load(subprocess.run([''git'',''show'',''origin/main:''+p],capture_output=True,text=True).stdout)[''amendment_log'']);
    ps=[''docs/contracts/terraform-cc-web-operations.yaml'',''docs/contracts/deploy-paths.yaml'']; [print(p,
    b(p), ''->'', h(p)) for p in ps]; assert all(h(p)>b(p) for p in ps); print(''AMENDMENT_LOG OK'')"'
  expected: Each contract prints a higher entry count than main, then AMENDMENT_LOG OK.
  fix_if: 'FIRST check whether the branch is rebased: measured 2026-09-21 the branch carried 5 amendment_log
    entries for deploy-paths.yaml against 6 on origin/main, so an un-rebased branch fails this step even
    when the work is correct. After rebasing, an AssertionError genuinely names a contract whose body
    changed with no new amendment_log entry (Decision 168; validate_contract_drift fails the PR).'
  hermetic: true
  expected_literals:
  - AMENDMENT_LOG OK
  graduation: waive
  graduation_waiver_reason: Depends on this session's transient origin/main base ref, so it is not a stable
    standing guard; _is_pr_relative would also exclude it post-merge.
- step: 3
  phase: pre-deploy
  action: 'RED-BEFORE: validator rejects a contract missing a declared no-default variable'
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    -k absent_from_table -q && bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    -k undeclared_variable -q && bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    -k scalar_where_values_live -q
  expected: 'Each of the three red-path selectors runs as its OWN invocation and passes. Chained, not
    or-joined: pytest exits 5 when a selector collects nothing, so a missing test breaks the chain. Measured
    2026-09-21 that an or-joined form exits 0 on a single match (1 passed, 8 deselected), which would
    green a one-directional leg.'
  fix_if: Exit 5 names the selector with no matching test -- that direction of the leg is unimplemented
    or untested. Never collapse these back into one or-joined -k.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: A red-path selector over this plan's own new tests; the module already runs
    in the standard pytest suite on every CI run, so a registry row would duplicate the same evidence.
- step: 4
  phase: pre-deploy
  action: 'RED-BEFORE (graduate): recovery table covers every no-default variable in the live module'
  command: bin/venv-python -c "import yaml; from scripts.checks.contracts.validate_terraform_cc_web_operations
    import _declared_no_default_variables as decl; from pathlib import Path; d=decl(Path('terraform/personal'));
    t=yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml'))['tfvars_and_remote_state_recovery']['where_values_live'];
    listed={k for k in t if k!='description'}; missing=sorted(d-listed); stale=sorted(listed-d); print('UNCOVERED',
    missing, 'STALE', stale); assert not missing and not stale and len(d)>=5"
  expected: Prints UNCOVERED [] STALE [] and exits 0.
  fix_if: UNCOVERED names a module variable absent from the recovery table; STALE names a table key the
    module no longer declares. This is the durable bidirectional invariant a future terraform/personal
    variable -- added or retired -- trips.
  hermetic: true
  expected_literals:
  - UNCOVERED [] STALE []
  graduation: graduate
  graduation_check_id: tfvars-recovery-table-covers-module
- step: 5
  phase: pre-deploy
  action: 'Decision 170: the new leg REPORTS its examined population (not merely returns it)'
  command: 'bin/venv-python -c "import io,contextlib,re; from scripts.checks.contracts.validate_terraform_cc_web_operations
    import validate_terraform_cc_web_operations as v; buf=io.StringIO(); f=[]

    with contextlib.redirect_stdout(buf): v(f)

    out=buf.getvalue(); m=re.search(r''(\\d+)\\s+no-default'', out); assert m and int(m.group(1))>0, out;
    print(''EXAMINED REPORTED'', m.group(1))"'
  expected: Prints EXAMINED REPORTED followed by a non-zero count. The check's output must name its scanned
    population as '<N> no-default ...', not a bare static label -- a label with no number fails.
  fix_if: 'No match means the leg reports no population, so a vacuous zero-variable pass is indistinguishable
    from an enforced one (Decision 170). A zero count means the parser matched nothing. Note registry.examined
    cannot carry this: it overwrites the single current declaration, so stdout is the only available channel
    and the assertion over it must be load-bearing.'
  hermetic: true
  expected_literals:
  - EXAMINED REPORTED
  graduation: waive
  graduation_waiver_reason: 'Step 4''s graduated row asserts the coverage invariant by inline set math
    and never invokes the validator, so it cannot observe this step''s reporting property -- this waiver
    does NOT defer to it. The reporting clause is a one-time authoring property of the leg: its absence
    is caught by validate_check_accounting''s declaration scan, and a registry row over a print format
    would be brittle without adding coverage.'
- step: 8
  phase: pre-deploy
  action: 'Decision 101 guard: no email address or account id introduced by this plan'
  command: bin/venv-python -c "import subprocess,re; d=subprocess.run(['git','diff','origin/main','--'],capture_output=True,text=True).stdout;
    adds=[l for l in d.splitlines() if l.startswith('+') and not l.startswith('+++')]; bad=[l for l in
    adds if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', l) or re.search(r'(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])',
    l)]; print('LEAKED', len(bad)); assert not bad, bad[:3]"
  expected: Prints LEAKED 0 across the whole diff against main -- no pathspec, matching AC wording.
  fix_if: A non-zero count prints the offending added lines; move the literal into the Secrets Manager
    entry and reference it by role instead.
  hermetic: true
  expected_literals:
  - LEAKED 0
  graduation: waive
  graduation_waiver_reason: 'Green by construction on the un-implemented tree (measured 2026-09-21: zero
    added lines match), so it carries no red-before signal; the standing equivalent is the pre-commit
    never-commit hook plus scripts/ci/redaction_check.py.'
- step: 10
  phase: pre-deploy
  action: Fast presubmit tier is green
  command: bin/venv-python -m scripts.validate --pre
  expected: Validation Summary reports all checks passed.
  fix_if: Address the named check; never bypass with --ignore-budget.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses an
    argv head of -m scripts.validate as a graduated check.
- step: 11
  phase: pre-deploy
  action: Full validation tier is green (handoff_policy.full_validation_required_before_commit)
  command: bin/venv-python -m scripts.validate
  expected: Full-tier Validation Summary reports all checks passed.
  fix_if: Address the named check. The full tier is the pre-handoff gate this plan's handoff_policy declares;
    a timeout is handoff_policy.timeout_disposition=blocked -- resume and rerun from the start, never
    partially.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses an
    argv head of -m scripts.validate as a graduated check.
- step: 13
  phase: post-deploy
  action: 'Closure obligation: both bundled recs reach a terminal or proposed state'
  command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json; rows=[json.loads(l)
    for l in open('logs/.recommendations-log.jsonl') if l.strip()]; d={r['id']:r for r in rows}; [print(i,
    d[i]['status'], bool(d[i].get('resolution'))) for i in ['rec-3950','rec-2843']]; assert d['rec-2843']['status']=='closed';
    assert d['rec-2843'].get('resolution'), 'rec-2843 closure proof not recorded'; assert d['rec-3950'].get('resolution'),
    'rec-3950 misdiagnosis resolution not recorded'"
  expected: Both recs print with a True resolution flag; rec-2843 prints closed. rec-3950's STATUS is
    deliberately not asserted -- it stays open pending operator confirmation (Decision 103) -- but its
    recorded resolution IS asserted, so skipping the close_proposed write fails the step.
  fix_if: rec-2843 still open means the deterministic closure did not run. rec-3950 staying open pending
    operator confirmation is EXPECTED, not a failure (Decision 103). Use the portal --sync surface; scripts.sync.ops
    accepts only 'sync' and calling it directly breaches AGENTS.md portal discipline.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: pre-deploy
  action: deploy-paths names five variables and points at the owning contract
  command: bin/venv-python -c "import yaml; s=str(yaml.safe_load(open('docs/contracts/deploy-paths.yaml'))['admin_out_of_band']['procedure']['steps']);
    assert 'alerts_email' in s, 'five-var list not corrected'; assert 'terraform-cc-web-operations' in
    s, 'pointer to the owning contract missing'; assert \"terraform/CLAUDE.md's remote-state recovery\"
    not in s, 'stale terraform/CLAUDE.md pointer still present -- detail was supplemented, not replaced';
    print('DEPLOY_PATHS POINTER OK')"
  expected: 'Prints DEPLOY_PATHS POINTER OK: five variables named, the owning contract pointed at, and
    the stale terraform/CLAUDE.md pointer gone.'
  fix_if: '''five-var list not corrected'' means the step still lists four. ''pointer missing'' means
    the per-variable detail was restated here instead of pointed at, which would make deploy-paths a second
    source of truth against Decision 126 point 2. Measured red 2026-09-21.'
  hermetic: true
  expected_literals:
  - DEPLOY_PATHS POINTER OK
  graduation: waive
  graduation_waiver_reason: A fixed-substring assertion over one contract's prose; adequate at authoring
    time but a reworded-yet-correct step would red it as a standing guard.
