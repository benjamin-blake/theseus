schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tfvars-recovery-contract-closure
intent: Make the break-glass tfvars recovery path correct, machine-enforced, and frictionless, so an admin-tier
  agent can produce a terraform plan without following a stale procedure that returns a wrong value. Supports
  the governed-deployment leg of the platform control plane.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-tfvars-recovery-contract-closure.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Driven by rec-3950 plus a defect hit live in a break-glass session. Adjacent to T2.44's DEP-13 fence,
  which this plan preserves rather than modifies.
scope:
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: recoverable_vars says four no-default vars; there are five. Restructure where_values_live from
    one prose blob into a per-variable mapping, add the owner_vs_alerts_email non-interchangeability key
    and per-variable role-alias semantics (no literal addresses), and log the change in amendment_log
    (Class D obligation).
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: admin_out_of_band.procedure carries the same four-var list; correct to five and replace the
    inline per-variable detail with a pointer to the owning contract so this file stays navigation. Requires
    its own amendment_log entry (Class D).
- file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
  action: Modify
  purpose: Add a third leg asserting every no-default variable declared in terraform/personal/*.tf appears
    in the contract's where_values_live mapping, so a new variable cannot drift unlisted.
- file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
  action: Modify
  purpose: Cover the HCL no-default parser and the unlisted / stale / scalar-shaped red paths, plus a
    live contract-vs-module assertion that fails if a future variable lands undocumented.
- file: bin/materialise-tfvars.sh
  action: Create
  purpose: Admin-only fetch of the agent-platform-terraform-personal-tfvars secret into the gitignored
    terraform/personal/terraform.personal.tfvars at mode 600. A delegated script (matching the existing
    bin/sync-deps.sh pattern) rather than inline, so it is testable against a stubbed aws binary instead
    of only greppable.
- file: bin/setup-cloud-env.sh
  action: Modify
  purpose: Delegate to bin/materialise-tfvars.sh inside the existing INSTALL_TERRAFORM=1 admin-only branch,
    after the AWS CLI install completes.
- file: tests/test_materialise_tfvars.py
  action: Create
  purpose: Behavioural tests driving bin/materialise-tfvars.sh with a stubbed aws on PATH - asserts the
    file contents, 600 permissions, the non-admin no-op, and fail-closed on a failed fetch.
bundled_recommendations:
- rec-3950
- rec-2843
followon_recs:
- rec-3975
infrastructure_dependencies: []
acceptance_criteria:
- terraform-cc-web-operations.yaml names all five no-default variables and gives each its own recovery
  source; no variable shares a source entry with another.
- The contract records that owner_email and alerts_email differ by design and that the resulting Owner
  tag-churn diff is a recovery artefact, never drift to apply.
- validate_terraform_cc_web_operations fails when a no-default variable declared in terraform/personal/*.tf
  is absent from where_values_live, and passes on the corrected pair.
- bin/materialise-tfvars.sh writes terraform.personal.tfvars at mode 600 from the secret when INSTALL_TERRAFORM=1,
  no-ops otherwise, and exits non-zero on a failed or empty fetch.
- No email address or AWS account id is introduced into any tracked file by this plan.
- rec-3950 and rec-2843 are closed with resolutions recorded.
- On the ADMIN container, bin/materialise-tfvars.sh produces a tfvars file carrying all five no-default
  variables at mode 600, verified against live Secrets Manager (V3 post-deploy leg).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Contract enumerates five no-default vars with per-variable sources
  command: bin/venv-python -c "import yaml; r=yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml'))['tfvars_and_remote_state_recovery'];
    t=r['where_values_live']; ks=sorted(k for k in t if k!='description'); assert ks==['account_id','alerts_email','owner_email','platform_admin_external_id','platform_dev_external_id'],
    ks; assert 'owner_vs_alerts_email' in r; print('CONTRACT SHAPE OK')"
  expected: Prints CONTRACT SHAPE OK with no AssertionError.
  fix_if: A KeyError means where_values_live is still a scalar prose blob; a short key list names the
    variable still missing.
  hermetic: true
  expected_literals:
  - CONTRACT SHAPE OK
  graduation: waive
  graduation_waiver_reason: The durable form of this assertion is the validate_terraform_cc_web_operations
    third leg added by this plan (step 4, graduated there). A second registry row asserting the same contract
    shape would duplicate it.
- step: 2
  phase: pre-deploy
  action: Both Class D contracts gained an amendment_log entry relative to main
  command: 'bin/venv-python -c "import subprocess,yaml; h=lambda p: len(yaml.safe_load(open(p))[''amendment_log'']);
    b=lambda p: len(yaml.safe_load(subprocess.run([''git'',''show'',''origin/main:''+p],capture_output=True,text=True).stdout)[''amendment_log'']);
    ps=[''docs/contracts/terraform-cc-web-operations.yaml'',''docs/contracts/deploy-paths.yaml'']; [print(p,
    b(p), ''->'', h(p)) for p in ps]; assert all(h(p)>b(p) for p in ps); print(''AMENDMENT_LOG OK'')"'
  expected: Each contract prints a higher entry count than main, then AMENDMENT_LOG OK.
  fix_if: An AssertionError names the contract whose body changed with no new amendment_log entry; validate_contract_drift
    fails the PR on it (Decision 168).
  hermetic: true
  expected_literals:
  - AMENDMENT_LOG OK
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: 'RED-BEFORE: validator rejects a contract missing a declared no-default variable'
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    -k "absent_from_table or scalar_where_values_live" -q
  expected: Both red-path tests pass, proving the guard fires on the drift shape and on the pre-fix scalar
    shape.
  fix_if: If these pass against a validator with no third leg they assert nothing; confirm they fail when
    the leg is reverted.
  hermetic: true
  expected_literals:
  - 2 passed
  graduation: waive
  graduation_waiver_reason: A red-path selector over this plan's own new tests; the module already runs
    in the standard pytest suite on every CI run, so a registry row would duplicate the same evidence.
- step: 4
  phase: pre-deploy
  action: Recovery table covers every no-default variable declared in the live module
  command: bin/venv-python -c "from scripts.checks.contracts.validate_terraform_cc_web_operations import
    validate_terraform_cc_web_operations as v; f=[]; v(f); print('FAILURES', f); assert not f"
  expected: Prints FAILURES [] and exits 0.
  fix_if: 'A non-empty list names the variable missing from, or stale in, the recovery table. This is
    the durable invariant: a future terraform/personal variable added without a table entry fails here.'
  hermetic: true
  expected_literals:
  - FAILURES []
  graduation: graduate
  graduation_check_id: tfvars-recovery-table-covers-module
- step: 5
  phase: pre-deploy
  action: 'Decision 170: the new leg reports a non-zero examined population'
  command: bin/venv-python -c "from scripts.checks.contracts.validate_terraform_cc_web_operations import
    _declared_no_default_variables as f; from pathlib import Path; n=len(f(Path('terraform/personal')));
    print('EXAMINED', n); assert n>=5"
  expected: Prints EXAMINED 5 (or higher) so a vacuous third leg cannot report enforced.
  fix_if: A zero count means the HCL parser matched nothing and the leg is vacuously passing (Decision
    170 accounting blindness).
  hermetic: true
  expected_literals:
  - EXAMINED 5
  graduation: waive
  graduation_waiver_reason: Anti-vacuity accounting for the step-4 check; it rides the same registry row
    rather than standing as a second one.
- step: 6
  phase: pre-deploy
  action: materialise-tfvars writes the file at 600 from a stubbed secret fetch and no-ops off-admin
  command: bin/venv-python -m pytest tests/test_materialise_tfvars.py -q
  expected: All materialise-tfvars behavioural tests pass, including the 600-mode, non-admin no-op, and
    empty-fetch fail-closed cases.
  fix_if: A permissions failure means no chmod; a no-op failure means the INSTALL_TERRAFORM guard is missing
    and the DEV container would fetch the secret.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: The test module runs in the standard pytest suite; graduating a second selector
    over the same module adds no independent signal.
- step: 7
  phase: pre-deploy
  action: setup-cloud-env delegates to the script inside the admin-only branch
  command: bin/venv-python -m pytest tests/test_setup_cloud_env.py -k "materialise" -q
  expected: The delegation-ordering test passes, asserting the call sits inside the INSTALL_TERRAFORM=1
    branch.
  fix_if: A failure means the fetch could run in the DEV container, handing PlatformDev values the DEP-13
    / Decision 144 pt 3 fence deliberately denies it.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: Same module-duplication reason as step 6; tests/test_setup_cloud_env.py already
    runs every CI.
- step: 8
  phase: pre-deploy
  action: 'Decision 101 guard: no email address or account id introduced by this plan'
  command: bin/venv-python -c "import subprocess,re; d=subprocess.run(['git','diff','origin/main','--','docs/contracts','bin','scripts','tests'],capture_output=True,text=True).stdout;
    adds=[l for l in d.splitlines() if l.startswith('+') and not l.startswith('+++')]; bad=[l for l in
    adds if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', l) or re.search(r'(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])',
    l)]; print('LEAKED', len(bad)); assert not bad, bad[:3]"
  expected: Prints LEAKED 0.
  fix_if: A non-zero count prints the offending added lines; move the literal into the Secrets Manager
    entry and reference it by role instead.
  hermetic: true
  expected_literals:
  - LEAKED 0
  graduation: waive
  graduation_waiver_reason: 'Green by construction on the un-implemented tree (measured 2026-09-21: zero
    added lines match), so it carries no red-before signal; the standing equivalent is the pre-commit
    never-commit hook plus scripts/ci/redaction_check.py.'
- step: 9
  phase: pre-deploy
  action: Full scope test modules pass
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    tests/test_materialise_tfvars.py tests/test_setup_cloud_env.py -q
  expected: All three modules pass with no failures.
  fix_if: A setup_cloud_env ordering failure means the delegation was inserted at the wrong point in the
    script.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: An aggregate re-run of modules already covered by steps 3, 6 and 7 and by
    the standard suite.
- step: 10
  phase: pre-deploy
  action: Fast presubmit tier is green
  command: bin/venv-python -m scripts.validate --pre
  expected: Validation Summary reports all checks passed.
  fix_if: Address the named check; never bypass with --ignore-budget.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses an
    argv head of -m scripts.validate as a graduated check.
- step: 11
  phase: post-deploy
  action: '[post-deploy] ADMIN-container live materialisation against real Secrets Manager'
  command: INSTALL_TERRAFORM=1 bash bin/materialise-tfvars.sh && bin/venv-python -c "import os, re, stat;
    p='terraform/personal/terraform.personal.tfvars'; st=os.stat(p); assert st.st_size>0, 'empty tfvars';
    assert stat.S_IMODE(st.st_mode)==0o600, oct(stat.S_IMODE(st.st_mode)); ks={m.group(1) for l in open(p)
    if (m:=re.match(r'\\s*([a-z_]+)\\s*=', l))}; req={'account_id','owner_email','platform_dev_external_id','platform_admin_external_id','alerts_email'};
    assert req <= ks, sorted(req-ks); print('MATERIALISED 5 keys mode-600')"
  expected: 'Prints MATERIALISED 5 keys mode-600. Asserts the real secret-to-file path end to end: non-empty,
    mode 600, and all five no-default variables present. Never prints a value.'
  fix_if: AccessDenied means the session is not on the PlatformAdmin chain (run only in the ADMIN container).
    A missing key names a variable absent from the secret body - add it to the secret, never to a tracked
    file. A mode mismatch means the chmod is missing.
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: post-deploy
  action: 'Closure obligation: both bundled recs reach a terminal or proposed state'
  command: bin/venv-python -m scripts.sync.ops pull >/dev/null && bin/venv-python -c "import json; rows=[json.loads(l)
    for l in open('logs/.recommendations-log.jsonl') if l.strip()]; d={r['id']:r for r in rows}; [print(i,
    d[i]['status']) for i in ['rec-3950','rec-2843']]; assert d['rec-2843']['status']=='closed'"
  expected: rec-2843 prints closed; rec-3950 prints its status after the operator acts on the close_proposed.
  fix_if: rec-2843 still open means the deterministic closure did not run. rec-3950 staying open pending
    operator confirmation is EXPECTED, not a failure (Decision 103).
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/checks/contracts/validate_terraform_cc_web_operations.py
  behavior: A no-default variable declared in terraform/personal/*.tf but absent from the contract's where_values_live
    mapping must fail the check; a scalar where_values_live must also fail.
  verification_step: 3
  test_selector: tests/checks/contracts/test_validate_terraform_cc_web_operations.py::TestRecoveryTableCoverage
  red_green_expectation: red before (the pre-fix contract fails both the scalar-shape and missing-alerts_email
    assertions), green after the contract and validator land together
- source: bin/materialise-tfvars.sh
  behavior: Writes the tfvars file at mode 600 under INSTALL_TERRAFORM=1, no-ops otherwise, and fails
    closed on an empty or failed fetch.
  verification_step: 6
  test_selector: tests/test_materialise_tfvars.py
  red_green_expectation: red before (the script does not exist), green after
- source: bin/setup-cloud-env.sh
  behavior: The materialise-tfvars delegation stays inside the INSTALL_TERRAFORM=1 admin-only branch and
    after the AWS CLI install.
  verification_step: 7
  test_selector: tests/test_setup_cloud_env.py
  red_green_expectation: red before (no delegation present), green after
constraints:
- Decision 101 public-repo boundary - no email address, AWS account id, ARN or ExternalId enters a tracked
  file. Role-alias SEMANTICS may be documented; literal addresses may not.
- DEP-13 / Decision 144 point 3 - PlatformDev is denied tfstate reads by design. The secret fetch must
  stay admin-only; do not add it to the DEV container path.
- Decision 84 Single Portal Invariant - rec closures go through scripts.ops_data_portal only; never edit
  logs/.recommendations-log.jsonl.
- Class D contract changes require an amendment_log entry (validate_contract_drift / check_amendment_log_for_class_d).
- Decision 86 - no new standing prose-architecture doc; the role-alias semantics ride the existing contract's
  per-variable table.
- No rescue agents or workaround loops (Decision 55).
- Out of scope by design - adding alerts_email to redaction_check.py's _SCRUB_SPECS and any owner_email
  / alerts_email VALUE change. Both belong to the sequenced follow-on plan, which must land the redaction
  fix BEFORE any value change reaches a PR.
- Decision 103 - a semantic relevance verdict never auto-closes a rec. rec-2843 closes deterministically
  with its own acceptance output recorded as proof; rec-3950's misdiagnosis verdict routes as close_proposed
  for operator confirmation.
- Decision 126 - materialisation is an enabler for the HUMAN-GATED break-glass loop only. An agent still
  never self-directs terraform apply. State this in the script comment and in the deploy-paths amendment
  so the change reads as tier hygiene, not as making the escape hatch more ambient.
- Decision 170 - the new leg must report its examined population so a vacuous pass is distinguishable
  from an enforced one.
- Decision 190 - rec-3950 carries source=tf_drift but was filed from the stale recovery procedure, not
  a measured plan diff; say so in the resolution so the drift lane's record stays honest.
context:
- 'Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND; CITE: 168, 127, 120, 113,
  144, 84, 101, 189, 59. Decisions triaged: 148 of 148. Roadmap items intersected: 4; CONFLICT: 0; RELATED:
  4'
- 'gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)'
- 'rec-3950 is MISDIAGNOSED, not drift. Verified live 2026-09-20: the SNS endpoint is a confirmed deliverable
  mailbox and the Owner tag is the GitHub no-reply identity, each correct for its own purpose. Its stated
  remediation would break alerting or pollute tags, and its acceptance string would commit an email literal
  into a .tf file. Close-propose as misdiagnosed; never execute it.'
- rec-2843 acceptance verified PASSING 2026-09-21 (redaction_check.py scrubs _OWNER to [OWNER_EMAIL]);
  deterministic close available. A parallel queue sweep may close it first - that is satisfied, not a
  conflict.
- alerts_email originates in terraform/personal/sns_alerts.tf (T2.18 FP-B / Decision 39), not variables.tf
  - why the hand-maintained four-var list never learned about it.
- PlatformAdmin GetSecretValue on the tfvars secret confirmed ALLOWED via iam simulate-principal-policy
  (source role_PlatformAdmin_AdminOps; no resource policy), so no IAM change is needed. Decision 120's
  provider-mirror sync is the admin-only fetch precedent this follows.
- 'Decision 166 headroom: contract at 357 lines against the 500 default; the per-variable mapping plus
  amendment_log entry must not require a raise marker.'
- Branch was 10 behind origin/main at authoring; deploy-paths.yaml gained an adjacent SPLIT-APPLY clause
  and terraform/personal/main.tf gained an S3 lifecycle block (not default_tags). Rebase before implementing.
- 'Prototype patch for the contract and validator legs: scratchpad uncommitted-doc-fix.patch (reusable).'
- Verification tier is V3 by explicit operator decision (2026-09-21). Decision 48's exhaustive V3 trigger
  list does not name bin/**, so V2 was literally defensible and was the scout's NOTE; the operator chose
  the more cautious tier because the new branch calls live Secrets Manager. Step 11 is the resulting real
  external-system leg.
- 'Decision 126 fork resolved by the operator (2026-09-21): accept materialisation as an admin-tier enabler
  rather than gating it behind an extra opt-in. Rationale recorded: the ADMIN profile is used rarely and
  almost solely for IAM work, so it is not an ambient surface, and Decision 120''s provider-mirror sync
  is the existing admin-only-fetch precedent this follows.'
- 'Planning-time split (Decision 59 routing): the alerts_email redaction gap is filed as rec-3975 and
  recorded in followon_recs, not left as plan prose. It is the HARD PREREQUISITE for the sequenced value-change
  plan - rec-3975 must land before any owner_email/alerts_email change reaches a PR, or the new address
  prints unredacted in a public speculative-plan comment.'
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- docs/contracts/terraform-cc-web-operations.yaml - correct recoverable_vars to five naming the declaring
  file, restructure where_values_live into a per-variable mapping with role-alias semantics, add owner_vs_alerts_email,
  add an amendment_log entry.
- docs/contracts/deploy-paths.yaml - correct the four-var list to five, replace inline detail with a pointer
  to the owning contract, add an amendment_log entry.
- scripts/checks/contracts/validate_terraform_cc_web_operations.py - add the no-default-variable coverage
  leg with brace-depth-aware HCL parsing so a nested validation block is not mistaken for a default.
- tests/checks/contracts/test_validate_terraform_cc_web_operations.py - add parser and red-path coverage
  plus the live-pair assertion.
- bin/materialise-tfvars.sh - create the admin-only secret fetch writing terraform.personal.tfvars at
  mode 600, fail-closed on empty output.
- bin/setup-cloud-env.sh - delegate to it inside the INSTALL_TERRAFORM=1 branch after the AWS CLI install.
- tests/test_materialise_tfvars.py - create behavioural tests driving the script with a stubbed aws binary.
- Close rec-3950 (misdiagnosed - no drift) and rec-2843 (already satisfied) via scripts.ops_data_portal,
  and name both in the squash-merge Resolves trailer.
- Execute Verification Plan - run each step; loop until pass; on unrecoverable failure stop and RCA (Decision
  55)
- 'Report: what was implemented, verification results'
work_areas: []
rollback: All changes are documentation, a validator leg, a new delegated script and tests - revert the
  commit. No infrastructure state is touched and no terraform apply runs, so there is nothing to unwind
  in AWS. The rec closures are reversible via ops_data_portal --update-rec.
