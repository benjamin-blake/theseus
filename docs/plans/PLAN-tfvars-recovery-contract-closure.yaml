schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: tfvars-recovery-contract-closure
intent: Make the break-glass tfvars recovery path correct, machine-enforced, and frictionless, so an admin-tier
  agent can produce a terraform plan without following a stale procedure that returns a wrong value. Supports
  the governed-deployment leg of the platform control plane.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-tfvars-recovery-contract-closure.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Driven by rec-3950 plus a defect hit live in a break-glass session. Adjacent to T2.44's DEP-13 fence,
  which this plan preserves rather than modifies.
scope:
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: recoverable_vars says four no-default vars; there are five. Restructure where_values_live from
    one prose blob into a per-variable mapping, add the owner_vs_alerts_email non-interchangeability key
    and per-variable role-alias semantics (no literal addresses), and log the change in amendment_log
    (Class D obligation).
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: admin_out_of_band.procedure carries the same four-var list; correct to five and replace the
    inline per-variable detail with a pointer to the owning contract so this file stays navigation. Requires
    its own amendment_log entry (Class D).
- file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
  action: Modify
  purpose: Add a third leg asserting every no-default variable declared in terraform/personal/*.tf appears
    in the contract's where_values_live mapping, so a new variable cannot drift unlisted.
- file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
  action: Modify
  purpose: Cover the HCL no-default parser and the unlisted / stale / scalar-shaped red paths, plus a
    live contract-vs-module assertion that fails if a future variable lands undocumented.
- file: bin/setup-cloud-env.sh
  action: Modify
  purpose: Inside the existing INSTALL_TERRAFORM=1 admin-only branch, after the AWS CLI install, delegate
    to the SAME single implementation the composite action uses -- so the local break-glass loop and CI
    can never diverge.
- file: tests/test_materialise_tfvars.py
  action: Create
  purpose: 'Behavioural tests driving .github/actions/materialise-tfvars/materialise_tfvars.sh with a
    stubbed aws on PATH under the literal GitHub composite argv (bash --noprofile --norc -e -o pipefail,
    satisfying R2): mode-600, fail-closed on empty fetch, the CI-shaped INSTALL_TERRAFORM-unset case,
    the rec-2285 first-''=''-split parse, and no secret on stdout off-runner.'
- file: tests/test_setup_cloud_env.py
  action: Modify
  purpose: 'Add the delegation-ordering test step 7 selects with -k materialise: asserts the materialise-tfvars
    call sits inside the INSTALL_TERRAFORM=1 admin-only branch and after the AWS CLI install. The module
    is an existing static contract test over the script text.'
- file: .github/actions/materialise-tfvars/materialise_tfvars.sh
  action: Create
  purpose: 'THE single materialise-tfvars implementation (honours the DEP-08 / rec-2663 consolidation).
    ALWAYS fetches when invoked -- no INSTALL_TERRAFORM guard; that gate is the local caller''s. Writes
    the gitignored tfvars at mode 600, preserves the rec-2285 first-''=''-split parse, and fails closed
    on an empty fetch. Emits ::add-mask:: for account_id and both ExternalIds ONLY when $GITHUB_ACTIONS
    is set: the runner intercepts that sentinel, a local ADMIN shell would instead print the literal secret
    into the session transcript, against this contract''s own never_paste clause and Decision 101. Lives
    under the action directory because that is the delegate location _delegated_script recognises (precedent:
    subagent-plan-review/review.sh).'
- file: .github/actions/materialise-tfvars/action.yml
  action: Modify
  purpose: 'Collapse the three inline shell bodies into one thin adapter: run: bash "${{ github.action_path
    }}/materialise_tfvars.sh", PRESERVING the working-directory input and its wiring. The r3 baseline
    sanctions extract OR raise-with-marker; extraction is the better option here because it is what lets
    the local caller share one implementation.'
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: Retire the three now-extracted r3 entries (::#0=5, ::#1=14, ::#2=4). Extraction shrinks the
    baseline, which is the sanctioned direction; re-register only if the guard still scans a residual
    inline body in the adapter.
bundled_recommendations:
- rec-3950
- rec-2843
followon_recs:
- rec-3975
- rec-3977
infrastructure_dependencies: []
acceptance_criteria:
- terraform-cc-web-operations.yaml names all five no-default variables and gives each its own recovery
  source; no variable shares a source entry with another.
- The contract records that owner_email and alerts_email differ by design and that the resulting Owner
  tag-churn diff is a recovery artefact, never drift to apply.
- validate_terraform_cc_web_operations fails when a no-default variable declared in terraform/personal/*.tf
  is absent from where_values_live, and passes on the corrected pair.
- .github/actions/materialise-tfvars/materialise_tfvars.sh ALWAYS fetches when invoked -- it carries no
  INSTALL_TERRAFORM guard -- writing the tfvars at mode 600 and failing closed on an empty or failed fetch.
  The admin-only gate lives in bin/setup-cloud-env.sh, the local caller, because CI never sets INSTALL_TERRAFORM
  and a guard in the shared unit would no-op the action at all four apply call sites.
- No email address or AWS account id is introduced into any tracked file by this plan.
- rec-2843 is closed with its acceptance output recorded as the closure proof; rec-3950 is routed close_proposed
  with its misdiagnosis resolution recorded, and remains open pending operator confirmation (Decision
  103).
- On the ADMIN container, .github/actions/materialise-tfvars/materialise_tfvars.sh produces a tfvars file
  carrying all five no-default variables at mode 600, verified against live Secrets Manager (V3 post-deploy
  leg).
- 'With $GITHUB_ACTIONS unset, the delegate emits no secret-shaped value on stdout or stderr; the ::add-mask::
  lines appear only on the runner.'
- tfvars_and_remote_state_recovery.recovery_procedure names the materialisation path, so the stale state-parse-only
  procedure this plan's intent calls out cannot survive it.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Contract enumerates five no-default vars with per-variable sources
  command: bin/venv-python -c "import yaml; r=yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml'))['tfvars_and_remote_state_recovery'];
    t=r['where_values_live']; ks=sorted(k for k in t if k!='description'); assert ks==['account_id','alerts_email','owner_email','platform_admin_external_id','platform_dev_external_id'],
    ks; v=str(r['owner_vs_alerts_email']).lower(); assert 'owner_email' in v and 'alerts_email' in v,
    'key names both variables'; assert 'by design' in v, 'must state the values differ by design'; assert
    'recovery artefact' in v, 'must state the tag-churn diff is a recovery artefact'; assert 'materialise'
    in str(r['recovery_procedure']).lower(), 'recovery_procedure still prescribes only the state-parse
    path'; print('CONTRACT SHAPE OK')"
  expected: Prints CONTRACT SHAPE OK. Asserts the table covers exactly the five variables, that owner_vs_alerts_email
    names both variables and states they differ by design and that the tag-churn diff is a recovery artefact,
    AND that recovery_procedure now points at the materialisation path rather than only the state-parse
    it was written for.
  fix_if: A named AssertionError says which clause is missing. A KeyError on where_values_live means it
    is still a scalar prose blob.
  hermetic: true
  expected_literals:
  - CONTRACT SHAPE OK
  graduation: waive
  graduation_waiver_reason: The durable form of this assertion is the validate_terraform_cc_web_operations
    third leg added by this plan (step 4, graduated there). A second registry row asserting the same contract
    shape would duplicate it.
- step: 2
  phase: pre-deploy
  action: Both Class D contracts gained an amendment_log entry relative to main
  command: 'bin/venv-python -c "import subprocess,yaml; h=lambda p: len(yaml.safe_load(open(p))[''amendment_log'']);
    b=lambda p: len(yaml.safe_load(subprocess.run([''git'',''show'',''origin/main:''+p],capture_output=True,text=True).stdout)[''amendment_log'']);
    ps=[''docs/contracts/terraform-cc-web-operations.yaml'',''docs/contracts/deploy-paths.yaml'']; [print(p,
    b(p), ''->'', h(p)) for p in ps]; assert all(h(p)>b(p) for p in ps); print(''AMENDMENT_LOG OK'')"'
  expected: Each contract prints a higher entry count than main, then AMENDMENT_LOG OK.
  fix_if: 'FIRST check whether the branch is rebased: measured 2026-09-21 the branch carried 5 amendment_log
    entries for deploy-paths.yaml against 6 on origin/main, so an un-rebased branch fails this step even
    when the work is correct. After rebasing, an AssertionError genuinely names a contract whose body
    changed with no new amendment_log entry (Decision 168; validate_contract_drift fails the PR).'
  hermetic: true
  expected_literals:
  - AMENDMENT_LOG OK
  graduation: waive
  graduation_waiver_reason: Depends on this session's transient origin/main base ref, so it is not a stable
    standing guard; _is_pr_relative would also exclude it post-merge.
- step: 3
  phase: pre-deploy
  action: 'RED-BEFORE: validator rejects a contract missing a declared no-default variable'
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    -k "absent_from_table or scalar_where_values_live" -q
  expected: The red-path selector collects at least one test and all collected tests pass (pytest exits
    5 on zero collected, so an empty selector is caught). Count deliberately not pinned.
  fix_if: If these pass against a validator with no third leg they assert nothing; confirm they fail when
    the leg is reverted.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: A red-path selector over this plan's own new tests; the module already runs
    in the standard pytest suite on every CI run, so a registry row would duplicate the same evidence.
- step: 4
  phase: pre-deploy
  action: 'RED-BEFORE (graduate): recovery table covers every no-default variable in the live module'
  command: bin/venv-python -c "import yaml; from scripts.checks.contracts.validate_terraform_cc_web_operations
    import _declared_no_default_variables as decl; from pathlib import Path; d=decl(Path('terraform/personal'));
    t=yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml'))['tfvars_and_remote_state_recovery']['where_values_live'];
    listed={k for k in t if k!='description'}; missing=sorted(d-listed); print('UNCOVERED', missing);
    assert not missing and len(d)>=5"
  expected: Prints UNCOVERED [] and exits 0.
  fix_if: 'Measured RED on the un-implemented tree 2026-09-21 (ImportError: _declared_no_default_variables
    does not exist yet), so it carries a genuine red-before signal rather than passing by construction.
    Post-fix, a non-empty list names the module variable still absent from the recovery table -- this
    is the durable invariant a future terraform/personal variable trips.'
  hermetic: true
  expected_literals:
  - UNCOVERED []
  graduation: graduate
  graduation_check_id: tfvars-recovery-table-covers-module
- step: 5
  phase: pre-deploy
  action: 'Decision 170: the new leg REPORTS its examined population (not merely returns it)'
  command: 'bin/venv-python -c "import io,contextlib; from scripts.checks.contracts.validate_terraform_cc_web_operations
    import validate_terraform_cc_web_operations as v; buf=io.StringIO(); f=[]

    import sys

    with contextlib.redirect_stdout(buf): v(f)

    out=buf.getvalue(); assert ''no-default'' in out, out; print(''EXAMINED REPORTED'')"'
  expected: Prints EXAMINED REPORTED -- the check's own output names the no-default population it scanned.
  fix_if: A missing mention means the leg examines variables without accounting for them, so a vacuous
    zero-variable pass is byte-identical to an enforced one (Decision 170).
  hermetic: true
  expected_literals:
  - EXAMINED REPORTED
  graduation: waive
  graduation_waiver_reason: Anti-vacuity accounting for the step-4 check; it rides the same registry row
    rather than standing as a second one.
- step: 6
  phase: pre-deploy
  action: materialise-tfvars writes the file at 600 from a stubbed secret fetch and no-ops off-admin
  command: bin/venv-python -m pytest tests/test_materialise_tfvars.py -q
  expected: 'All delegate behavioural tests pass: mode-600 write, fail-closed on empty fetch, the rec-2285
    first-''=''-split parse, ::add-mask:: for exactly account_id and the two ExternalIds under GITHUB_ACTIONS,
    and NO secret-shaped value on stdout with GITHUB_ACTIONS unset.'
  fix_if: 'A permissions failure means no chmod. A stdout-leak failure means the ::add-mask:: emission
    is not gated on $GITHUB_ACTIONS. Note there is deliberately NO no-op case here -- the delegate always
    fetches; the admin gate is the caller''s, asserted at step 7.'
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: The test module runs in the standard pytest suite; graduating a second selector
    over the same module adds no independent signal.
- step: 7
  phase: pre-deploy
  action: setup-cloud-env delegates to the script inside the admin-only branch
  command: bin/venv-python -m pytest tests/test_setup_cloud_env.py -k "materialise" -q
  expected: The delegation-ordering test passes, asserting the call sits inside the INSTALL_TERRAFORM=1
    branch.
  fix_if: A failure means the fetch could run in the DEV container, handing PlatformDev values the DEP-13
    / Decision 144 pt 3 fence deliberately denies it.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: Same module-duplication reason as step 6; tests/test_setup_cloud_env.py already
    runs every CI.
- step: 8
  phase: pre-deploy
  action: 'Decision 101 guard: no email address or account id introduced by this plan'
  command: bin/venv-python -c "import subprocess,re; d=subprocess.run(['git','diff','origin/main','--','docs/contracts','bin','scripts','tests'],capture_output=True,text=True).stdout;
    adds=[l for l in d.splitlines() if l.startswith('+') and not l.startswith('+++')]; bad=[l for l in
    adds if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}', l) or re.search(r'(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])',
    l)]; print('LEAKED', len(bad)); assert not bad, bad[:3]"
  expected: Prints LEAKED 0.
  fix_if: A non-zero count prints the offending added lines; move the literal into the Secrets Manager
    entry and reference it by role instead.
  hermetic: true
  expected_literals:
  - LEAKED 0
  graduation: waive
  graduation_waiver_reason: 'Green by construction on the un-implemented tree (measured 2026-09-21: zero
    added lines match), so it carries no red-before signal; the standing equivalent is the pre-commit
    never-commit hook plus scripts/ci/redaction_check.py.'
- step: 9
  phase: pre-deploy
  action: Full scope test modules pass
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    tests/test_materialise_tfvars.py tests/test_setup_cloud_env.py -q
  expected: All three modules pass with no failures.
  fix_if: A setup_cloud_env ordering failure means the delegation was inserted at the wrong point in the
    script.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: An aggregate re-run of modules already covered by steps 3, 6 and 7 and by
    the standard suite.
- step: 10
  phase: pre-deploy
  action: Fast presubmit tier is green
  command: bin/venv-python -m scripts.validate --pre
  expected: Validation Summary reports all checks passed.
  fix_if: Address the named check; never bypass with --ignore-budget.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses an
    argv head of -m scripts.validate as a graduated check.
- step: 11
  phase: pre-deploy
  action: Full validation tier is green (handoff_policy.full_validation_required_before_commit)
  command: bin/venv-python -m scripts.validate
  expected: Full-tier Validation Summary reports all checks passed.
  fix_if: Address the named check. The full tier is the pre-handoff gate this plan's handoff_policy declares;
    a timeout is handoff_policy.timeout_disposition=blocked -- resume and rerun from the start, never
    partially.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses an
    argv head of -m scripts.validate as a graduated check.
- step: 12
  phase: post-deploy
  action: '[post-deploy] ADMIN-container live materialisation against real Secrets Manager'
  command: INSTALL_TERRAFORM=1 bash .github/actions/materialise-tfvars/materialise_tfvars.sh && bin/venv-python
    -c "import os, re, stat; p='terraform/personal/terraform.personal.tfvars'; st=os.stat(p); assert st.st_size>0,
    'empty tfvars'; assert stat.S_IMODE(st.st_mode)==0o600, oct(stat.S_IMODE(st.st_mode)); ks={m.group(1)
    for l in open(p) if (m:=re.match(r'\\s*([a-z_]+)\\s*=', l))}; req={'account_id','owner_email','platform_dev_external_id','platform_admin_external_id','alerts_email'};
    assert req <= ks, sorted(req-ks); print('MATERIALISED 5 keys mode-600')"
  expected: 'Prints MATERIALISED 5 keys mode-600. Asserts the real secret-to-file path end to end: non-empty,
    mode 600, and all five no-default variables present. Never prints a value.'
  fix_if: AccessDenied means the session is not on the PlatformAdmin chain (run only in the ADMIN container).
    A missing key names a variable absent from the secret body - add it to the secret, never to a tracked
    file. A mode mismatch means the chmod is missing.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: 'Closure obligation: both bundled recs reach a terminal or proposed state'
  command: bin/venv-python -m scripts.sync.ops pull >/dev/null && bin/venv-python -c "import json; rows=[json.loads(l)
    for l in open('logs/.recommendations-log.jsonl') if l.strip()]; d={r['id']:r for r in rows}; [print(i,
    d[i]['status']) for i in ['rec-3950','rec-2843']]; assert d['rec-2843']['status']=='closed'"
  expected: rec-2843 prints closed; rec-3950 prints its status after the operator acts on the close_proposed.
  fix_if: rec-2843 still open means the deterministic closure did not run. rec-3950 staying open pending
    operator confirmation is EXPECTED, not a failure (Decision 103).
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: pre-deploy
  action: Decision 126 framing lands in the right place for each consumer
  command: grep -q 'never self-directed' .github/actions/materialise-tfvars/materialise_tfvars.sh && grep
    -q 'enabler for the human-gated break-glass loop only' bin/setup-cloud-env.sh && grep -q 'enabler
    for the human-gated break-glass loop only' docs/contracts/deploy-paths.yaml
  expected: Exits 0; the clause appears in both the script comment and the deploy-paths amendment.
  fix_if: The shared delegate is the GOVERNED CI apply path at four call sites, so the break-glass-enabler
    clause is false there; it carries the weaker, always-true 'never self-directed' framing instead. The
    break-glass-enabler clause belongs to the LOCAL caller and the deploy-paths amendment.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: A fixed-phrase grep is adequate at authoring time but unsound as a standing
    guard -- a reworded but still-correct comment would red it.
- step: 15
  phase: pre-deploy
  action: deploy-paths names five variables and points at the owning contract
  command: bin/venv-python -c "import yaml; s=str(yaml.safe_load(open('docs/contracts/deploy-paths.yaml'))['admin_out_of_band']['procedure']['steps']);
    assert 'alerts_email' in s, 'five-var list not corrected'; assert 'terraform-cc-web-operations' in
    s, 'pointer to the owning contract missing'; print('DEPLOY_PATHS POINTER OK')"
  expected: Prints DEPLOY_PATHS POINTER OK.
  fix_if: '''five-var list not corrected'' means the step still lists four. ''pointer missing'' means
    the per-variable detail was restated here instead of pointed at, which would make deploy-paths a second
    source of truth against Decision 126 point 2. Measured red 2026-09-21.'
  hermetic: true
  expected_literals:
  - DEPLOY_PATHS POINTER OK
  graduation: waive
  graduation_waiver_reason: A fixed-substring assertion over one contract's prose; adequate at authoring
    time but a reworded-yet-correct step would red it as a standing guard.
- step: 16
  phase: pre-deploy
  action: Composite-action shell-body guard accepts the extraction (R3 oracle)
  command: bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import
    validate_composite_action_shell_bodies as g; f=[]; g(f); print('GUARD FAILURES', f); assert not f"
  expected: 'Prints GUARD FAILURES []. GREEN BEFORE AND AFTER BY DESIGN -- this is a REGRESSION guard,
    not a red-before proof: the guard passes today because the three bodies are correctly baselined, and
    it must still pass once they are extracted. Measured green 2026-09-21 (exit 0).'
  fix_if: 'An R3 complaint is the live failure mode: either the adapter still carries a computing inline
    body (the delegation line must be its only substantive line, per _delegated_script), or a retired
    r3 baseline key still has a live body. R1/R2 cannot bind here -- this action declares no outputs:
    -- so do not chase them. The earlier `-m` invocation form was VACUOUS (the module has no __main__,
    so it exited 0 silently); this fallback form is the real oracle.'
  hermetic: true
  expected_literals:
  - GUARD FAILURES []
  graduation: waive
  graduation_waiver_reason: Already a registered validate.py check running in both presubmit tiers; a
    registry row would duplicate it.
- step: 17
  phase: pre-deploy
  action: 'Consolidation is real and the action''s interface is preserved: one implementation, no inline
    fetch, working-directory still honoured'
  command: test "$(grep -rl 'secretsmanager get-secret-value' bin/ .github/actions/ | wc -l)" = "1" &&
    grep -q 'secretsmanager get-secret-value' .github/actions/materialise-tfvars/materialise_tfvars.sh
    && ! grep -q 'secretsmanager get-secret-value' .github/actions/materialise-tfvars/action.yml && !
    test -e bin/materialise-tfvars.sh && grep -q 'materialise_tfvars.sh' bin/setup-cloud-env.sh && grep
    -q 'inputs.working-directory' .github/actions/materialise-tfvars/action.yml && echo 'SINGLE IMPLEMENTATION'
  expected: 'Prints SINGLE IMPLEMENTATION: the fetch exists only in the delegate script, and both callers
    reference it.'
  fix_if: A failure means a second copy survives anywhere under bin/ or .github/actions/ (reversing the
    DEP-08 / rec-2663 consolidation), a stray bin/materialise-tfvars.sh was created, or the collapsed
    adapter dropped the working-directory wiring -- the last silently writes the tfvars to the wrong path
    on the apply path. Census deliberately spans bin/ AND .github/actions/.
  hermetic: true
  expected_literals:
  - SINGLE IMPLEMENTATION
  graduation: waive
  graduation_waiver_reason: A fixed-substring census over one action directory; sound at authoring time,
    brittle as a standing guard if the fetch is ever reworded.
- step: 18
  phase: pre-deploy
  action: 'CI-SHAPED: the delegate fetches with INSTALL_TERRAFORM unset (the case all four apply call
    sites rely on)'
  command: bin/venv-python -m pytest tests/test_materialise_tfvars.py -k "install_terraform_unset" -q
  expected: The test drives the delegate with INSTALL_TERRAFORM absent and a stubbed aws, asserting the
    tfvars file IS written. Name the test test_writes_tfvars_when_install_terraform_unset.
  fix_if: 'A failure means the delegate carries the admin gate and would no-op in CI. Measured 2026-09-21:
    INSTALL_TERRAFORM appears zero times in .github/workflows/, so a guard in the shared unit silently
    disables terraform-apply-sandbox (x2) and reconcile (x2), taking the Decision 126 heal verb with it.'
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: The module already runs in the standard pytest suite; a registry row over
    the same selector adds no independent signal.
test_obligations:
- source: scripts/checks/contracts/validate_terraform_cc_web_operations.py
  behavior: A no-default variable declared in terraform/personal/*.tf but absent from the contract's where_values_live
    mapping must fail the check; a scalar where_values_live must also fail.
  verification_step: 3
  test_selector: tests/checks/contracts/test_validate_terraform_cc_web_operations.py::TestRecoveryTableCoverage
  red_green_expectation: red before (the pre-fix contract fails both the scalar-shape and missing-alerts_email
    assertions), green after the contract and validator land together
- source: .github/actions/materialise-tfvars/materialise_tfvars.sh
  behavior: 'The single implementation writes the tfvars at mode 600, emits ::add-mask:: for the three
    secret-shaped values, and fails closed on an empty fetch -- driven under the literal GitHub composite
    argv so CI and local behaviour cannot diverge (R2).'
  verification_step: 6
  test_selector: tests/test_materialise_tfvars.py
  red_green_expectation: red before (the script does not exist), green after
- source: bin/setup-cloud-env.sh
  behavior: The materialise-tfvars delegation stays inside the INSTALL_TERRAFORM=1 admin-only branch and
    after the AWS CLI install.
  verification_step: 7
  test_selector: tests/test_setup_cloud_env.py
  red_green_expectation: red before (no delegation present), green after
