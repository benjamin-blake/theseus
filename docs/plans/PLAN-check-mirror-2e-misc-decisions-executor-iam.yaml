constraints:
- No rescue agents or workaround loops (Decision 55) -- a mutant that cannot be killed within this scope becomes a recommendation via file_rec, never an inline check-module edit.
- Never weaken a check, an assertion, or an existing test to obtain green (Decision 181, docs/contracts/implement-scope-boundary.yaml CONTENT invariant). Every existing test in all six files is KEPT, not replaced or reworded.
- 'TESTS ONLY: the six scope files are the entire diff. No check module, no manifest Entry, no docs/contracts/ change, no repo-wide meta-gate, no config change, no SLOC budget change (Decision 59 LOCATION invariant).'
- '`git diff --stat -- scripts/checks/` must be empty before every commit (VP step 26 is the assertion form).'
- Mutants are NEVER applied to the working tree -- only to a scratch clone under the session scratchpad (never /tmp proper, never the repo), built with `git clone --shared` plus a symlinked .venv, and located by mutate2.py site id, never by a bare line number (deterministic, reviewable edits in the spirit of Decision 128).
- No SLOC budget raise and no raise-approved / baseline-lowered / waiver marker anywhere (Decision 128, Decision 165); if a mirror would exceed 500 SLOC, decompose it into a mirror package, never append to one of the 16 tests/checks files already over 400 SLOC -- none of the six here is, the largest being the GHAS mirror at 235 SLOC.
- Do NOT add examined()/skipped() declarations to any of these six checks (Decision 170) -- five of the six sit on config/check_accounting_baseline.yaml today, adding one is a check-module edit and therefore out of scope, and editing a baselined module without adopting the declaration in the same PR is precisely what validate_check_accounting's touch-it-fix-it arm fails on.
