acceptance_criteria:
- Each of the seven survivor sites, re-applied with mutate2.py --apply <site-id> in a fresh scratch clone that carries the new tests, makes its mirror FAIL; on the unmodified branch all six mirrors pass.
- Every new test drives the production site through the module under test -- the registered check function, its documented root/injection seam, or the named helper -- never a re-implementation of the logic inside the test.
- The two PASS-line guards are asserted from BOTH sides (line present on the clean fixture, absent on the failing one) and the assertion names the full sentence, not a bare 'PASS' substring.
- '`git diff --stat origin/main...HEAD -- scripts/checks/` is empty (no check module, manifest or helper is touched, so validate_check_accounting''s touch-it-fix-it arm never fires), and config/sloc_budgets.yaml, config/coverage_baseline.yaml and config/check_accounting_baseline.yaml are unchanged; the landed diff is the six test files, the plan file''s own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards.'
- check_per_file_coverage() reports no error for any of the six modules under test (all six at 100%, no coverage_baseline.yaml entry added).
- All six test files stay <= 500 SLOC, ruff-clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.
