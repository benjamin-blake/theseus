slug: check-mirror-2e-misc-decisions-executor-iam
intent: 'Kill the seven measured mutation survivors in the misc / decisions / executor / iam_tf check mirrors: two PASS-line accounting guards that no test observes, three defensive except-arms (an unreadable recommendations JSONL, an exception out of the ducklake requirements check, an unreadable ducklake derive surface), one exception-class distinction the GHAS probe''s two callers currently collapse, and one brace-balance comparison whose flip silently widens the terraform tags-block scan -- so that neutering or flipping any of the seven can no longer pass CI as a silent green.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-mirror-2e-misc-decisions-executor-iam.yaml
phase: Check-mirror behavioural coverage (defect surface of the Decision 169 mirror roster; measured by the Task 3 mutation sweep). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 3 slice 2 group 2e; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: tests/checks/decisions/test_validate_decisions_index_freshness.py
  action: Modify
  purpose: '62 SLOC today; all four existing tests assert failed[] only, so the `len(failed) == before` guard at validate_decisions_index_freshness.py:23 -- the check''s ONLY outcome channel, since it declares no examined()/skipped() and sits on config/check_accounting_baseline.yaml -- is observed by nothing and flipping it SURVIVES (re-verified in a scratch clone 2026-09-03). Add class TestPassLineIsGatedOnTheFailureDelta with two capsys tests asserting the exact sentence ''PASS: decisions index is current.'' is present on a freshly regenerated index and absent on a stale one. The four existing tests are kept unchanged.'
- file: tests/checks/decisions/test_validate_decision_currency.py
  action: Modify
  purpose: '175 SLOC today; same shape one level up -- the `len(failed) == before` guard at validate_decision_currency.py:185 gates the five-invariant summary line and no test reads stdout, so flipping it SURVIVES all 16 tests. Add class TestPassLineIsGatedOnTheFailureDelta reusing the module''s existing _build_tree(tmp_path) helper and the check''s own root= injection seam, asserting the full sentence ''PASS: all five currency invariants hold (1 live entries).'' on the healthy tree and its absence on an I3-violating tree. All 16 existing tests kept.'
- file: tests/checks/executor/test_validate_executor_boundary.py
  action: Modify
  purpose: 105 SLOC today; the OSError arm at validate_executor_boundary.py:64-67 is entered by no test (the existing seven all write a readable JSONL or none at all), so neutering its failed.append SURVIVES. Add class TestUnreadableRecommendationsLog driving the arm with the JSONL path created as a DIRECTORY (exists() true, read_text() raises IsADirectoryError) and asserting failed == ['Executor boundary validation'] exactly, plus class TestLineLevelTolerance covering the blank/comment/non-JSON `continue` branches, which takes the module from a measured 93.9% to 100% and removes a latent floor failure for the next PR that touches it. All seven existing tests kept.
- file: tests/checks/iam_tf/test_validate_terraform_tag_charset.py
  action: Modify
  purpose: '132 SLOC today; every existing fixture places its only literal assignment INSIDE the tags block, so flipping _tags_block_end''s `depth == 0` balance test (line 40) -- which makes the block span run past its own closing brace to the next unbalanced one -- changes nothing any of the 13 tests assert. Add class TestTagsBlockSpanStopsAtItsOwnClosingBrace with a resource whose body carries an S3-illegal literal AFTER the tags block closes: the registered check must stay green and declare examined(1), and _tags_block_end must return a span whose content is exactly the one tag line. All 13 existing tests kept.'
- file: tests/checks/misc/test_validate_ghas_probe.py
  action: Modify
  purpose: '235 SLOC today; neutering the ProbeAuthError raise at validate_ghas_probe.py:65 falls through to the ProbeTransportError raise on the next line, and BOTH callers catch the two classes in one except clause, so failed[] and the exit code are identical and all 24 tests SURVIVE. Add class TestAuthErrorsAreDistinctFromTransportErrors pinning the class identity directly (pytest.raises(ProbeAuthError) for 401 and for 403) plus the runner''s stdout wording (''auth error, cannot verify: HTTP 401''), which is the only other channel that separates the two arms. ProbeAuthError joins the file''s existing single import block. All 24 existing tests kept.'
- file: tests/checks/misc/test_validate_ducklake_version_lockstep.py
  action: Modify
  purpose: '66 SLOC today; the three existing tests drive only the happy path and the two expected-failure paths, so BOTH defensive except-arms survive neutering -- the requirements-check except-Exception append (line 41) and the unreadable-derive-surface OSError append (line 52). Add class TestUnexpectedFailuresAreReported with a shared _write_clean_tree(tmp_path) helper, one test patching scripts.sync.ducklake_version.sync to raise (exact failed[] equality) and one creating src/common/ducklake_runtime.py as a directory (read_errors filtered on the exact ''cannot read <surface>: '' prefix, asserted NON-EMPTY before being asserted equal to failed). All three existing tests kept.'
