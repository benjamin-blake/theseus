execution_steps:
- >-
  STEP 0 -- git fetch origin main and rebase. Set N = origin/main's max '## Decision NNN:' header + 1 (209 at
  drafting); if a header or a merged plan's draft already holds 209, use the next number held by neither. If N is not
  209, substitute N for 209 in the '## Decision 209:' header, the envelope number, the Warehouse ID, the stanza
  decision field and all three STEP 2 lines. DATE is the implement date. rec-4141 is a writer-allocated id filed
  at plan time (Decision 84 I-2) and already substituted literally throughout this plan. If this file still contains
