schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: open-core-paywall-and-repo-topology
intent: >-
  Record the operator-agreed open-core product boundary as one numbered Decision. The paywall is drawn on organisational
  scale and never on capability. The paid tier is a multi-tenant, metadata-only managed control plane over a
  customer-owned data plane, and the open core is the data plane. Crossing is governed by an explicit metadata
  allow-list. Any fully-hosted variant is single-tenant, and access is least-privilege and customer-revocable. Code is
  placed in three monorepos by platform-vs-product and visibility. This resolves Decision 184 clause 1's open
  adapter-residency question (cloud adapters stay public; only hosted compute is paid), relocates Decision 178's hosted
  products, and supersedes rec-3923. The concrete allow-list, the transport and a smart-routing add-on stay open.
  Governance encoding only: no code, package, repository, roadmap or contract lands.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-open-core-paywall-and-repo-topology.yaml
phase: >-
  No tier_item: an operator-directed product-boundary Decision (soft-warn category user_explicit_out_of_scope). It
  informs deferred_post_mvp T4.24, whose c3 (released-version rule) and c6 (Additional Use Grant amendment) it cites
  without closing or advancing any criterion.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    One new numbered Decision (209 at drafting; re-derived at STEP 0) titled 'Open-core paywall on organisational scale,
    never capability -- ... (amends Decision 184 clause 1, Decision 178 and Decision 101 point (f))'. The full drafted
    text is in STEP 1, at or under 6,144 bytes (about 6,090 drafted). It carries a bare yaml envelope (amends [184, 178,
    101], significance numbered_decision) and a monitored reversal stanza. STEP 2 adds a dated '> **Amended by Decision
    N (DATE):**' line to Decisions 184, 178 and 101, each in its prescribed place. No existing body line is edited
    (Decision 177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by scripts.decisions_index --write after the DECISIONS.md edit (never hand-edited, Decision 160/179).
bundled_recommendations: []
followon_recs: [rec-4141, rec-4142, rec-4143]
infrastructure_dependencies: []
acceptance_criteria:
- >-
  Exactly one Decision titled 'Open-core paywall on organisational scale, never capability ...' exists. It is at or under
  6,144 bytes and has a bare yaml envelope (number N, amends [184, 178, 101], value numbered_decision). Its title-borne
  amends edges parse to [184, 178, 101] and its body carries no other amends or supersedes edge. It carries clauses 1-5, the
  two-option Options-considered line and a monitored reversal stanza (split-friction, access-boundary,
  allow-list-transport). It records the tenancy model (a)-(d) as decided and the allow-list and transport as open,
  citing the follow-on rec rec-4141, rec-3624 and rec-3923. It contains no retired brand name (Decision 198), no pricing
  figure or currency symbol, and no 12-digit or ARN token (Decision 101 point (d)).
- >-
  Decisions 184, 178 and 101 each carry a dated Amended-by line naming N. 184's line is at the end of the entry; it
  discharges the adapter-residency condition for clause 1 only and leaves the grant leg with Decision 194 clause 4 and
  T4.24 c6. 178's line sits inside its Intent section and relocates products to the monorepo matching their
  visibility. 101's line joins its annotation block and discharges point (f) further, for boundary and architecture
  only. Every original body is intact. Decision 184 stays at or under 6,144 bytes.
  Decisions 194 and 171 are not edited.
- docs/decisions-index.json is fresh (scripts.decisions_index --check exits 0) and the full presubmit tier passes.
- After merge, rec-autoclose.yml's backfill lands dec-N in ops_decisions, and it is retrievable through the reader.
- >-
  After merge, rec-3923 is status superseded, and its resolution names dec-N and states what was carried and what was
  not (operator ruling, F2 option B).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Full presubmit tier (the pre-handoff run). It gates decision-entry conformance, the per-entry size cap, the
    supersession annotations (184, 178 and 101 carry the new number), reversal-stanza well-formedness, decision currency,
    decisions-index freshness and the graduated shards this diff adds.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 with the all-checks-passed summary, and --verify-head attests HEAD's committed tree.
  fix_if: >-
    A validate_decisions_size FAIL on the new entry means tighten its prose; never raise the cap. A
    validate_supersession_annotations FAIL means 184, 178 or 101 lacks its Amended-by line, or a body phrase reads
    'amends Decision N'. A decision-entry conformance FAIL means the envelope or a required marker drifted from STEP 1's text. A
    WARN-only accretion line for Decisions 178 and 101 (both already over the cap) is expected and is not a failure.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    THE PAYWALL DECISION EXISTS, IS ENVELOPED, FITS THE CAP, CARRIES EVERY CLAUSE AND STAYS INSIDE THE PUBLIC-CONTENT
    BOUNDARY. The entry is located by title, so the assertion survives the numbering race. Red on origin/main, where the
    entry is absent.
  command: &vp2cmd >-
    bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges as ae;
    t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in re.finditer(r'^## Decision (\d+):
    (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'Open-core paywall on organisational scale' in m.group(2)];
    assert len(es)==1, ('expected exactly one paywall Decision', [e.group(1) for e in es]); n=es[0].group(1);
    b=es[0].group(0); sz=len(b.encode('utf-8')); assert sz<=6144, ('over the 6144-byte cap', sz);
    assert re.search('^'+chr(96)*3+r'yaml\s*\nnumber: '+n+r'\b', b, re.M), 'no bare yaml envelope carrying number '+n;
    assert 'value: numbered_decision' in b; assert chr(10)+'amends: [184, 178, 101]'+chr(10) in b, 'envelope amends list';
    assert ae(es[0].group(2))==[184, 178, 101], ('title amends edges', ae(es[0].group(2)));
    edges=re.findall(r'(?:amends|Amends|supersedes|Supersedes) Decision (\d+)', b); assert edges==['184'],
    ('unexpected amends/supersedes edges', edges); assert 'dec-'+n+' (per Decision 84' in b and 'decision:
    '+n+chr(10) in b, 'Warehouse ID or stanza number drift'; bad=[w for w in ['Theseus','Guerdon','arn:',chr(36),chr(163),chr(8364)]
    if w in b]+re.findall(r'\b\d{12}\b', b); assert not bad, ('public-boundary or retired-name token', bad);
    need=['organisational scale, never capability','single-team governed-loop function','Everything one team needs to
    run the full governed loop on one repository is free','multi-repository operation','the multi-tenant control
    plane','tenancy-enforcement code stays in the public cloud adapter','Decision 200 clause 2','SSO/RBAC','retention
    policy set in the control plane over data that stays in the data plane','north stars and Tier C overrides','Tier B
    snapshot stay free','fleet telemetry dashboards over allow-listed Decision 199 metadata','cross-product DAG layer (multi-repository aggregation, not Decision 197','hosted compute','Decision 194 condition (b)','dbt Core','Dagster','Databricks','HashiCorp Cloud','Decision
    101 point (f)','no commercial surface, pricing or terms','managed control plane runs over a customer-owned data
    plane','the open core is the data plane','Decision 57','Decision 205','multi-tenant and holds metadata only','tenant
    data and agent transcripts never leave the data plane','explicit allow-list of metadata fields, never a
    deny-list','titles, paths, error messages','single-tenant (dedicated per customer), never multi-tenant for customer
    data','least-privilege, customer-revocable IAM','platform-vs-product and visibility','BUSL-1.1','Apache-2.0','stays
    platform-only (Decision 178)','curated projection (Decision 111)','ports and all adapters','docs serve','runs locally for the user','any public site stays bound by Decision 101 point
    (d)','rendering agent-consumed sources','single-project dashboard templates','examples/','small platform reference builds, never a
    product','marketing/','no new Decision 127 prose class','One public products monorepo','Decision 101 point (d)
    binds it, imported as Tier B via','otl init','showcase products that may also be hosted for revenue','the paid control plane and closed-code products
    (the trading product, Decision 198 clause 1)','share one access boundary today','released platform versions','T4.24
    c3','No other repository is created speculatively','cloud adapters stay public','Only hosted compute is
    paid','adapter-residency','for clause 1 only','Decision 194 clause 4','T4.24 c6','concrete metadata
    allow-list','customer-granted role','data plane pushes','rec-4141','smart-model-routing','rec-3624','Copybara/ShipIt','solo
    founder','Open products inside this repository','platform-only cleanse','yaml reversal-conditions','split-friction','access-boundary','allow-list-transport','rec-3923
    (superseded by this entry)']; miss=[p
    for p in need if p not in b]; assert not miss, ('paywall Decision text missing', miss); print('DEC_PAYWALL_OK', n, sz)"
  expected: Prints the marker, the minted number and the entry's byte size (about 6,090).
  fix_if: >-
    A missing phrase means a clause was paraphrased: restore STEP 1's text. Over the cap means tighten prose, never raise
    it. An extra edge means a body phrase reads 'amends/supersedes Decision N': reword it. A public-boundary token means
    remove it; never add a waiver.
  hermetic: true
  graduation: graduate
  graduation_check_id: open-core-paywall-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    DECISIONS 184, 178 AND 101 ARE AMENDED BY DATED LINES CITING THE NEW NUMBER, EACH IN ITS PLACE. 184's line is at the
    end of the entry and discharges clause 1 only, leaving the grant leg with Decision 194 clause 4 and T4.24 c6. 178's
    line sits inside its Intent section (Decision 151 clause 3(ii)). 101's line joins its annotation block before
    Problem. Every original body survives (Decision 177), no appended line uses the retired name, and Decision 184
    stays under the 6,144 cap. Red on origin/main, where no line cites the new Decision.
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for
    m in re.finditer(r'^## Decision (\d+): (.*?)\n', t, re.M) if 'Open-core paywall on organisational scale' in m.group(2)];
    assert len(es)==1, 'paywall Decision absent'; n=es[0].group(1); blk=lambda k: re.search(r'^## Decision '+k+r':.*?(?=^##
    Decision |\Z)', t, re.M|re.S).group(0); A=r'> \*\*Amended by Decision '+n+r' \(\d{4}-\d{2}-\d{2}\):\*\*';
    amd={'184':['adapter residency is decided','stay public','only hosted compute is paid','discharged for clause 1
    only','Decision 171 grant leg','Decision 194 clause 4','T4.24 c6','managed control plane','metadata only','released
    versions of the core'],'178':['products live in the products monorepo matching their visibility','public products
    monorepo','closed-code products','Decision 198 clause 1','paid control plane','platform-only','never a
    product'],'101':['Point (f)','further discharged for boundary and architecture only','organisational scale','metadata-only
    managed control plane','No commercial surface, pricing or terms','rest of that deferral stands','point (d) binds any
    public docs site']}; keep={'184':'whether they remain open or move private is OPEN','178':'hosted products live in
    their own repositories and import it','101':'Public-content boundary'}; place={'184':('**Related:**',None),'178':('**Intent:**','**Problem:**'),'101':('**Warehouse
    ID:**','**Problem:**')}; got={k:[l for l in blk(k).splitlines() if re.match(A, l)] for k in amd}; probs=[(k,'no
    Amended-by line citing '+n) for k in amd if not got[k]]; assert not probs, probs; probs=[(k,[w for w in ws if w not
    in got[k][-1]]) for k,ws in amd.items() if [w for w in ws if w not in got[k][-1]]]+[(k,'retired name in appended
    line') for k in amd if 'Theseus' in got[k][-1]]+[(k,'original body edited (Decision 177)') for k,s in keep.items()
    if s not in blk(k)]+[(k,'Amended-by line misplaced') for k,(lo,hi) in place.items() if not (blk(k).find(lo) <
    blk(k).find(got[k][-1]) and (hi is None or blk(k).find(got[k][-1]) < blk(k).find(hi)))]; assert not probs, probs;
    s184=len(blk('184').encode('utf-8')); assert s184<=6144, ('Decision 184 over 6144', s184); print('PAYWALL_ANNOTATIONS_OK',
    n, s184)"
  expected: Prints the marker, the minted number and Decision 184's byte size (about 5,510, or about 5,770 once the sibling line lands).
  fix_if: >-
    Place STEP 2's lines verbatim as the step directs: 184's line last before its --- separator, 178's inside its
    Intent section before Problem, and 101's after its last existing Amended-by blockquote before Problem. Never
    rewrite a body line.
  hermetic: true
  graduation: graduate
  graduation_check_id: open-core-paywall-annotations
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: The decisions index is regenerated, not hand-edited. Red between the DECISIONS.md edit and --write; green after.
  command: bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0.
  fix_if: Run bin/venv-python -m scripts.decisions_index --write and commit the result.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_decisions_index_freshness check registered in both validate tiers.
  expected_literals: []
- step: 5
  phase: post-deploy
  action: >-
    After the squash-merge, rec-autoclose.yml's DECISIONS.md backfill (Decision 84) lands dec-N. Confirm the reader
    returns it with the new title.
  command: >-
    bin/venv-python -c "import re,pathlib; from scripts.ops_portal.decisions import _fetch_decision_from_reader as f;
    t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); n=[m.group(1) for m in re.finditer(r'^## Decision
    (\d+): (.*)$', t, re.M) if 'Open-core paywall on organisational scale' in m.group(2)][0]; r=f('dec-'+n); assert r
    and 'Open-core paywall' in str(r), ('dec-'+n+' not in ops_decisions', r); print('DEC_WAREHOUSE_OK', n)"
  expected: Prints DEC_WAREHOUSE_OK and the number, run on an up-to-date main checkout after the backfill workflow is green.
  fix_if: >-
    None means the backfill has not run or failed. Inspect the rec-autoclose run for the merge commit, then run
    bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md (idempotent). A reader error means confirming
    aws sts get-caller-identity --profile agent_platform. There is no offline outbox (Decision 84 I-4).
  hermetic: false
- step: 6
  phase: post-deploy
  action: >-
    After STEP 6's portal write, rec-3923 reads back as superseded, with a resolution naming dec-N (operator ruling, F2
    option B). It is not bundled: the relevance gate returned stale_target, because its acceptance targets a contract
    file that never existed.
  command: >-
    bin/venv-python -c "import re,pathlib; from scripts.ops_data_portal import _fetch_rec_from_reader as f;
    t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); n=[m.group(1) for m in re.finditer(r'^## Decision
    (\d+): (.*)$', t, re.M) if 'Open-core paywall on organisational scale' in m.group(2)][0]; r=f('rec-3923'); assert r
    and r.get('status')=='superseded' and 'dec-'+n in str(r.get('resolution')), ('rec-3923 not superseded by dec-'+n,
    r and r.get('status'), r and r.get('resolution')); print('REC3923_SUPERSEDED_OK', n)"
  expected: Prints REC3923_SUPERSEDED_OK and the number.
  fix_if: >-
    A status other than superseded means STEP 6 did not run or was refused. Re-run it and read the portal error. A
    reader error means confirming aws sts get-caller-identity --profile agent_platform.
  hermetic: false
- step: 7
  phase: pre-deploy
  action: >-
    NO EXISTING DECISIONS.md LINE IS REMOVED OR REWRITTEN (Decision 177; AC2's "every original body intact" and
    "Decisions 194 and 171 are not edited"). The diff against origin/main adds lines only.
  command: test -z "$(git diff origin/main -- docs/DECISIONS.md | grep -E '^-[^-]')"
  expected: Exit 0 (no removed lines in the DECISIONS.md diff).
  fix_if: A removed line means a body was edited. Restore it and re-apply STEP 1-2 as insertions only.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    It asserts on this change's transient diff against origin/main, which is empty once merged, so a standing shard
    would be vacuous.
test_obligations:
- source: docs/DECISIONS.md
  behavior: >-
    The paywall Decision exists with its envelope, cap, clauses and public-boundary hygiene. VP 3 separately guards the
    184/178/101 annotations.
  verification_step: 2
  command: *vp2cmd
  red_green_expectation: Red on origin/main (no such entry), green after STEPS 1-2.
- source: docs/decisions-index.json
  behavior: The index is regenerated from DECISIONS.md, never hand-edited.
  verification_step: 4
  command: bin/venv-python -m scripts.decisions_index --check
  red_green_expectation: Red between the DECISIONS.md edit and --write, green after STEP 3.
constraints:
- >-
  PUBLIC REPOSITORY (Decision 101 point (d), Decision 111). No pricing figure, currency amount, customer, AWS account id,
  ARN, ExternalId or internal hostname. The private monorepo appears only as architecture-level placement that is
  already public through Decisions 184 and 198: never its name, organisation or internals (Decision 194 clause 3's
  discharge rule). VP 2 enforces the mechanical subset.
- >-
  DO NOT DECIDE what the operator left open. Clause 5(i) (the concrete metadata allow-list, and the transport: a
  control-plane pull through a customer-granted role vs a data-plane push) and clause 5(ii) (a smart-model-routing
  add-on) stay open. The tenancy model in clause 2 (a)-(d) IS decided (operator ruling, round 2): record it verbatim.
  Do not restate or narrow it. Do not widen the Additional Use Grant (Decision 194 clause 4 and T4.24
  c6 are the sole authority). Do not fire or edit Decision 184's no-free-tier or actions-policy conditions.
- >-
  Decision 177: Decision bodies are append-only. Only the new entry's title carries 'amends Decision ...'. 184, 178 and
  101 each gain one '> **Amended by Decision N (DATE):**' line:
  - 184's is the last line before the entry's --- separator (184's Intent is still true).
  - 178's goes INSIDE its Intent section, after the Intent sentence and before **Problem:**. Decision 151 clause
    3(ii) keeps its intent field and triage excerpt current.
  - 101's joins its existing annotation block, after the Decision 202 blockquote and before **Problem:**.
  Decisions 194 (6,063 bytes) and 171 (6,056 bytes) are cited, never annotated.
- >-
  Decision 167 clause 3: the new entry is at most 6,144 bytes (about 6,080 drafted, about 60 bytes of headroom).
  Tighten, never raise. If the date or rec id substitution adds bytes, trim the Related list first. Decision 184 must
  stay at or under 6,144 after both this plan's line and PLAN-cli-persona-backend's Update line (about 5,770
  combined). Decisions 178 (6,823) and 101 (7,740) are already over the cap, so their lines raise WARN-only accretion
  signals, never a fail.
- >-
  NAME: On The Loop is the platform's name (Decision 198). The retired names appear in no text this plan authors.
  Historical bodies are never edited to rename.
- >-
  rec-3923 is closed as superseded (operator ruling, F2 option B), never bundled. The relevance gate returned
  stale_target (its target contract never existed), so the ci.yml Resolves: trailer is NOT used: it would record the
  wrong status. The portal write runs post-merge (STEP 6), once dec-N exists.
- >-
  Decision 67 / CD.17 freeze: IMPLEMENTATION only. No code, package, new repository, examples/ tree, docs site,
  dashboard, contract or roadmap edit. Those are future work under their own plans. Clause 3(1) needs no new Decision
  127 prose class: the docs site renders agent-consumed sources locally, posts live under marketing/, and examples/
  holds no human-audience .md files.
- >-
  Decision 126: no terraform apply and no Lambda deploy. Neither scope file is Lambda-packaged
  (compute_affected_artifacts returns none), so no build, deploy or smoke step is warranted.
- Decision 55 -- no rescue loops; a red check is diagnosed and the edit corrected, never waived or re-pinned.
- >-
  Scope boundary (Decision 59): only the two scope files change, plus sanctioned derived paths. Those are the two
  graduated registry shards named in VP 2 and VP 3, .secrets.baseline line-number regeneration, and this plan's own
  bookkeeping fields. Out-of-scope findings become recs via the portal.
- No emojis; ASCII hyphens; no eval or exec; every command Linux/bash-compatible via bin/venv-python.
