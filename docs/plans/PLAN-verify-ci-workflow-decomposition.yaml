schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "verify-ci-workflow-decomposition"
intent: >-
  Decompose scripts/verify_ci_workflow.py (499 SLOC against the 500 cap, unregistered in
  config/sloc_budgets.yaml) into a facade package preserving its entire public surface, so the
  follow-on plan can add a guard without crossing the limit, and adopt the Decision 170
  examined()/skipped() declaration on validate_ci_workflow_guards, whose module this plan edits.
  Behaviour-preserving: every guard still runs, in the same order, with the same failures.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verify-ci-workflow-decomposition.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed). Decision 128 decompose-by-default,
  triggered by a file measured at 499 of 500 SLOC with no budget entry; Decision 170
  touch-it-fix-it, triggered by this plan editing a baselined check's own defining module. No
  exit criterion closes, hence no closes_criteria.
scope:
  - file: scripts/verify_ci_workflow.py
    action: Delete
    purpose: >-
      499 SLOC against the 500 default with no config/sloc_budgets.yaml entry, and
      --update-sloc-budgets will not seed a newly-oversized unregistered file. Decision 128 makes
      decomposition the response, never a raise.
  - file: scripts/verify_ci_workflow/__init__.py
    action: Create
    purpose: >-
      Facade re-exporting all 36 names the flat module defined (measured, not estimated), so every
      existing `from scripts.verify_ci_workflow import ...` site keeps working byte-for-byte.
      __all__ lists them, which is what keeps ruff F401 quiet on a pure re-export (the
      scripts/agent_sdk/__init__.py precedent).
  - file: scripts/verify_ci_workflow/__main__.py
    action: Create
    purpose: >-
      MANDATORY, not cosmetic. Two live consumers invoke the module form: the graduated registry
      row terraform-apply-sandbox-concurrency-event-keyed runs
      `python -m scripts.verify_ci_workflow terraform-apply-concurrency`, and
      tests/verify_ci_workflow/test_cli_main.py::TestCliMain calls
      runpy.run_module("scripts.verify_ci_workflow", run_name="__main__"). Both resolve a PACKAGE
      through pkg.__main__, so without this file both break.
  - file: scripts/verify_ci_workflow/_shared.py
    action: Create
    purpose: >-
      The workflow-YAML access helpers: _load, _get_steps_text, _get_step_run_text,
      _assert_runtime_lock. THREE are genuinely cross-group and measured so -- _load throughout,
      _get_steps_text at lines 55, 56, 174, 181, 294, _assert_runtime_lock at 60, 177, 193, 197.
      _get_step_run_text is NOT: its only call sites are lines 442-443, both inside
      _check_ci_rca_fetch_classification, so it belongs to _ci_rca alone. It is placed in _shared
      for cohesion with the other YAML-access helpers, which is a defensible reason but not the
      cross-group one an earlier draft gave. Moving it into _ci_rca instead is equally correct;
      what is not correct is claiming it spans groups.
  - file: scripts/verify_ci_workflow/_ci_yaml.py
    action: Create
    purpose: >-
      The ci.yml-shape guards and their private helpers: _check_jobs_and_flags,
      _is_truthy_concurrency_flag, _check_concurrency, _check_fetch_depth,
      _check_full_tier_runtime_lock, _MODULE_INVOCATION_RE, _CHECK_LIKE_RE,
      _check_validate_single_source, _admits_pull_request, _check_signal_green_needs. Exactly the
      six guards tests/verify_ci_workflow/test_ci_data_guards.py imports, plus their helpers.
  - file: scripts/verify_ci_workflow/_ci_rca.py
    action: Create
    purpose: >-
      The canary and ci-rca guards: _check_canary, _REQUIRED_CI_RCA_WORKFLOWS,
      _check_ci_rca_filter, _PATTERN_MATCHING_CONSTRUCT_RE, _CI_RCA_FETCH_STEP,
      _read_ci_rca_authority_sources, _ci_rca_fetch_source_comment, _decision_72_entry,
      _check_ci_rca_authority_anchor, _check_ci_rca_fetch_classification. Exactly the concern
      tests/verify_ci_workflow/test_ci_rca_and_canary.py covers.
  - file: scripts/verify_ci_workflow/_apply.py
    action: Create
    purpose: >-
      The apply/reconcile guards: _check_apply_rca_fallback, _check_terraform_apply_concurrency,
      the six _RECOVERY_* constants, _recovery_step_body, _check_recovery_workflow_topology.
      Exactly the concern tests/verify_ci_workflow/test_apply_and_terraform.py covers. Largest
      submodule at roughly 185 SLOC, well under the cap.
  - file: scripts/verify_ci_workflow/_cli.py
    action: Create
    purpose: >-
      _COMMANDS and main(), moved verbatim. _COMMANDS stays ONE dict object re-exported by the
      facade, which is what keeps tests/verify_ci_workflow/test_cli_main.py's
      patch.dict("scripts.verify_ci_workflow._COMMANDS", ...) intercepting: patch.dict mutates the
      dict in place rather than rebinding the attribute, so a re-export shares it.
  - file: tests/verify_ci_workflow/test_facade_surface.py
    action: Create
    purpose: >-
      New mirror test for the facade: all 36 names resolve through scripts.verify_ci_workflow,
      each resolves to its expected defining submodule, _load still normalises the PyYAML `on:`
      -> True key quirk, and every package module is under the SLOC cap.
  - file: scripts/checks/ci_guards/validate_ci_workflow_guards.py
    action: Modify
    purpose: >-
      Decision 170 touch-it-fix-it. This plan edits this module (its docstrings name the flat
      path), and validate_check_accounting keys touch-it-fix-it on the check's OWN defining module
      appearing in get_changed_files(), so the examined()/skipped() declaration must be adopted in
      the same PR. Adds registry.examined(len(guards), unit="ci_workflow_guards") on the success
      path and registry.skipped(reason) on the import/setup-failure path, modelled on the sibling
      scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py. The module-level _GUARDS
      try/except and the call-time try/except are untouched.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Remove the `validate_ci_workflow_guards` entry (currently line 45). The baseline is
      shrink-only with no marker escape grammar, so removal is the only sanctioned edit; the
      frozen _BASELINE_SEED constant is deliberately NOT edited (it is a ceiling that only shrinks
      when a check is retired, and the guard only checks current_baseline - _BASELINE_SEED).
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Four Entry pre_globs tuples name the literal string "scripts/verify_ci_workflow.py"
      (validate_ci_rca_trigger, validate_dependabot_automation, validate_branch_cleanup,
      validate_dispatch_gated_apply_topology). Re-point each to "scripts/verify_ci_workflow/**" or
      the --pre tier silently stops selecting those four checks when the package changes.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Remove the now-dangling "scripts/verify_ci_workflow.py" member of
      _CONCERN_SPLIT_TEST_PACKAGES. Measured: get_changed_source_files filters to paths that
      exist, and excludes __init__.py, so the deleted path is never scanned and the new package
      modules map to None either way -- the removal is the Delete row's closure obligation, not a
      coverage change. NOT a "sanctioned" disposition: Decision 131 clause 1 enumerates the
      return-None family as exactly scripts/executor/** and scripts/ops_portal/**, and this prefix
      is not among them. The mapping pin is therefore RETIRED here, deliberately, and carried by
      rec-3883 per Decision 187 (silence is not a disposition).
  - file: tests/checks/ci_guards/test__manifest.py
    action: Modify
    purpose: >-
      Two assertions pin "scripts/verify_ci_workflow.py" as a required glob and as a parametrised
      probe path for validate_ci_rca_trigger; re-point both to the package form.
  - file: tests/checks/ci_guards/test_validate_ci_workflow_guards.py
    action: Modify
    purpose: >-
      Add TestCheckAccountingDeclaration, covering the new declaration: an enforced run declares
      examined(len(_GUARDS)) and derives status "enforced"; a guard-import failure declares a skip
      and still records a single gate failure without raising.
  - file: tests/verify_ci_workflow/test_apply_and_terraform.py
    action: Modify
    purpose: >-
      Re-point 18 patch targets from scripts.verify_ci_workflow._load to
      scripts.verify_ci_workflow._apply._load. The `from scripts.verify_ci_workflow import ...`
      lines are NOT touched -- the facade keeps them working; only patch targets move. The move is
      REQUIRED BY PYTHON NAME-BINDING, not by convention: after the split each guard resolves _load
      from its own submodule globals, so patching the facade attribute would rebind a name nothing
      reads and the guards would silently run the real _load against live workflow files, asserting
      against production YAML. Decision 169's "patch the check's OWN defining module" is the
      precedent for the shape, not the reason it is mandatory.
  - file: tests/verify_ci_workflow/test_ci_data_guards.py
    action: Modify
    purpose: >-
      Re-point 26 patch targets to scripts.verify_ci_workflow._ci_yaml._load. Imports untouched.
  - file: tests/verify_ci_workflow/test_ci_rca_and_canary.py
    action: Modify
    purpose: >-
      Re-point 26 _load, 6 Path and 3 _read_ci_rca_authority_sources patch targets to
      scripts.verify_ci_workflow._ci_rca.*. Imports untouched.
