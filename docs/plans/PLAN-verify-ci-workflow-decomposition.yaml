followon_recs: ["rec-3882", "rec-3883", "rec-3884"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts.verify_ci_workflow is a package whose facade resolves all 36 names the flat module
    defined, and every existing import site (including the ten private guard names
    scripts/checks/ci_guards/validate_ci_workflow_guards.py imports at lines 19-30, _load in
    validate_pr_conflict_signal / validate_branch_cleanup / validate_dependabot_automation /
    validate_dispatch_gated_apply_topology, and _check_ci_rca_filter in validate_ci_rca_trigger)
    keeps working unchanged.
  - >-
    Every package module is under the 500-SLOC default and NO config/sloc_budgets.yaml entry is
    added for any of them.
  - >-
    _GUARDS still carries the same ten (label, function) pairs in the same order, with the SAME
    function objects the facade exports -- the identity the graduated registry row
    ci-rca-fetch-classification-guard-runs-in-pre-tier asserts with `in agg._GUARDS`.
  - >-
    `python -m scripts.verify_ci_workflow` and `python -m scripts.verify_ci_workflow
    <command>` both still work, and runpy.run_module("scripts.verify_ci_workflow",
    run_name="__main__") still reaches main().
  - >-
    validate_ci_workflow_guards declares an examined()/skipped() outcome, is absent from
    config/check_accounting_baseline.yaml, and validate_check_accounting passes; a dispatch of the
    check derives status "enforced" rather than "undeclared".
  - >-
    The four ci_guards Entry pre_globs select the package, so a package-only diff still dispatches
    those checks in the --pre tier.
  - >-
    No string-literal reference to the deleted path remains under scripts/, tests/ or .github/.
    Scoped deliberately, and stated so rather than reading repo-wide. DECLARED EXCLUSIONS
    (Decision 191's principle that an exclusion is a DECLARED cell and never an absence, applied
    BY ANALOGY -- its clause 1 literally governs DuckLake maintenance scope, not verification
    sweeps, so the transfer is deliberate rather than direct governance): (a) config/, whose five
    verification_registry guard_target values cannot be corrected here without a spurious
    tautological differential -- carried by rec-3882; (b) docs/, 84 hits across 31 files, all
    append-only historical records never retro-edited under Decision 177 -- plan documents,
    docs/SESSION_LOG.md and three docs/audit-prompts/AUDIT-*.md -- plus one contract,
    docs/contracts/ci-rca-lifecycle.yaml:458; (c) audits/, four hits in
    audits/gitops-agent-first-ddfb9cc.yaml:601,:1026 and
    audits/loop-spec-adoption-4d8bac4a.yaml:529,:828, frozen audit records on the same footing.
    SURVIVING PROVENANCE DOCSTRINGS, counted POST-implementation: SEVEN. An earlier revision said
    nine, which measured HEAD and contradicted this plan's own execution step 5 -- that step updates
    validate_ci_workflow_guards.py:13 and :69 itself, so those two do not survive. The seven are
    validate_ci_rca_trigger.py:15; validate_dispatch_gated_apply_topology.py:44;
    scripts/ci/reconcile_reachability.py:18; and the four tests/verify_ci_workflow/test_*.py module
    docstrings. The sweep matches quoted literals only, so none is caught by it. All seven are inert
    for ENFORCEMENT -- no route target resolves any of them. One is additionally stale as FACT:
    validate_dispatch_gated_apply_topology.py:44 claims the file "sits at exactly 500 SLOC" (it is
    499, and false outright once deleted), carried by rec-3884 rather than fixed inline (Decision 59).
    One further cosmetic residual, named so the accounting is exhaustive: main()'s usage string at
    scripts/verify_ci_workflow.py:637 reads "Usage: verify_ci_workflow.py <...>" and moves verbatim
    into _cli.py, where it names a file that no longer exists. It is a BARE BASENAME, so this
    criterion's path-scoped sweep is not wrong to miss it; no test asserts it; and both the
    ZERO-BEHAVIOUR-CHANGE constraint and Decision 59 argue against touching it here.
  - The full validation tier completes exit 0 before handoff (Decision 163).
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: The package exists, every module is under the SLOC cap, and the CLI command table is intact
    command: >-
      bin/venv-python -c "from pathlib import Path; import scripts.verify_ci_workflow as m;
      assert hasattr(m, '__path__'), 'scripts.verify_ci_workflow is not a package';
      pkg=Path(m.__path__[0]); mods=sorted(p.name for p in pkg.glob('*.py'));
      assert len(mods) >= 5, mods;
      over=[(p.name, n) for p in pkg.glob('*.py') for n in [sum(1 for l in
      p.read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'))]
      if n > 500]; assert not over, over;
      assert not Path('scripts/verify_ci_workflow.py').exists(), 'flat module still present';
      assert sorted(m._COMMANDS) == sorted(['jobs-and-flags', 'concurrency', 'fetch-depth',
      'canary', 'ci-rca-filter', 'apply-rca-fallback', 'validate-single-source',
      'signal-green-needs', 'terraform-apply-concurrency', 'ci-rca-fetch-classification',
      'full-tier-runtime-lock', 'recovery-workflow-topology']), sorted(m._COMMANDS);
      assert all(callable(f) for f in m._COMMANDS.values()); print('PACKAGE_SHAPE_OK', mods)"
    expected: PACKAGE_SHAPE_OK printed with the module list, exit 0
    fix_if: >-
      Measured red before implementation: the module has no __path__, so the first assert fires.
      A module over 500 SLOC means the split was uneven -- rebalance it, never add a
      config/sloc_budgets.yaml entry (Decision 128). The __path__ assertion must come FIRST: it is
      what keeps pkg.glob from returning [] and passing the budget assert vacuously on a tree
      where the package does not exist.
    graduation: graduate
    graduation_check_id: verify-ci-workflow-package-shape-and-module-budgets
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: The aggregator still wires the same ten guard objects, in the same order, through the facade
    command: >-
      bin/venv-python -c "from scripts.verify_ci_workflow import (_check_apply_rca_fallback,
      _check_canary, _check_ci_rca_fetch_classification, _check_concurrency, _check_fetch_depth,
      _check_jobs_and_flags, _check_recovery_workflow_topology, _check_signal_green_needs,
      _check_terraform_apply_concurrency, _check_validate_single_source);
      import scripts.checks.ci_guards.validate_ci_workflow_guards as agg;
      expected=[('jobs-and-flags', _check_jobs_and_flags), ('fetch-depth', _check_fetch_depth),
      ('concurrency', _check_concurrency), ('canary', _check_canary),
      ('apply-rca-fallback', _check_apply_rca_fallback),
      ('validate-single-source', _check_validate_single_source),
      ('signal-green-needs', _check_signal_green_needs),
      ('terraform-apply-concurrency', _check_terraform_apply_concurrency),
      ('ci-rca-fetch-classification', _check_ci_rca_fetch_classification),
      ('recovery-workflow-topology', _check_recovery_workflow_topology)];
      assert list(agg._GUARDS) == expected, agg._GUARDS;
      assert agg._load_guards() == expected, agg._load_guards();
      print('GUARDS_IDENTITY_OK', len(expected))"
    expected: GUARDS_IDENTITY_OK 10 printed, exit 0
    fix_if: >-
      A mismatch means the facade re-exported a wrapper rather than the function object itself
      (e.g. a lambda or a functools.wraps shim), which breaks the `in agg._GUARDS` identity check
      the graduated row ci-rca-fetch-classification-guard-runs-in-pre-tier performs. Re-export the
      objects, never copies.
    graduation: waive
    graduation_waiver_reason: >-
      Measured GREEN on the pre-implementation tree (GUARDS_IDENTITY_OK 10, exit 0) -- this is a
      zero-behaviour-change refactor, so its central regression guard necessarily already holds.
      Graduating it would be a false `graduate`: the plan-only red-before leg would classify it
      tautological and HARD-FAIL this plan's own PR. Deliberately not `not-applicable` either --
      the command is a single command_exit_zero shape and claiming the no-obligation row for it
      would be the classification gaming that disposition exists to catch.
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: Both live invocation forms of the package CLI still run every guard against the real workflows
    command: >-
      bin/venv-python -m scripts.verify_ci_workflow && bin/venv-python -m
      scripts.verify_ci_workflow terraform-apply-concurrency && echo PACKAGE_CLI_OK
    expected: OK printed twice, then PACKAGE_CLI_OK, exit 0
    fix_if: >-
      `python -m <package>` resolves through pkg.__main__, so a missing
      scripts/verify_ci_workflow/__main__.py fails here with "No module named
      scripts.verify_ci_workflow.__main__". This is also the exact command shape of the graduated
      registry row terraform-apply-sandbox-concurrency-event-keyed, so a failure here means that
      row breaks on merge. This run exercises the REAL, unpatched _load / _get_steps_text /
      _assert_runtime_lock paths in _shared.py.
    graduation: waive
    graduation_waiver_reason: >-
      Measured GREEN on the pre-implementation tree (both invocations print OK, exit 0): the flat
      module already answers `python -m`. The property this step protects is that the PACKAGE form
      keeps answering it, which cannot be expressed as a red-before on a tree where the package
      does not exist without degenerating into the step 1 shape. The incumbent graduated row
      terraform-apply-sandbox-concurrency-event-keyed already carries this exact command_exit_zero
      check_spec, so a new row would duplicate it under a different check_id.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: The pre-existing suites covering the moved code and its consumers pass end to end
    command: >-
      bin/venv-python -m pytest tests/verify_ci_workflow tests/checks/ci_guards
      tests/test_coverage_checker -q
    expected: all tests pass, 0 failures (measured 728 passed across these three directories before this change)
    fix_if: >-
      A `ModuleNotFoundError: scripts.verify_ci_workflow._ci_yaml` style failure means a patch
      target was re-pointed to a submodule that does not hold the function under test -- the
      mapping is one test file to one submodule and must stay that way. An assertion failure means
      the move was not verbatim: fix the move, never the assertion.
    graduation: waive
    graduation_waiver_reason: >-
      Measured GREEN on the pre-implementation tree: 617 passed across tests/verify_ci_workflow +
      tests/checks/ci_guards, and 728 across the THREE directories this step's own selector spans
      (both measured; 728 is what this step's `expected` field carries).
      A directory selector that is green on the base guards nothing while
      looking guarded, and the two genuinely new classes are graduated separately as steps 7 and 8
      with precise node ids.
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: The Decision 170 declaration is adopted, the baseline has shrunk, and the real ratchet passes
    command: >-
      bin/venv-python -c "from pathlib import Path;
      from scripts.checks.hygiene import validate_check_accounting as vca;
      import scripts.checks.ci_guards.validate_ci_workflow_guards as agg;
      assert vca._module_declares(Path(agg.__file__).read_text(encoding='utf-8')),
      'validate_ci_workflow_guards still declares no examined()/skipped() outcome';
      entries=set(vca._load_baseline_entries(Path('config/check_accounting_baseline.yaml').read_text(encoding='utf-8')));
      assert 'validate_ci_workflow_guards' not in entries, 'still baselined';
      failed=[]; vca.validate_check_accounting(failed); assert not failed, failed;
      print('ACCOUNTING_RATCHET_OK')"
    expected: ACCOUNTING_RATCHET_OK printed, exit 0
    fix_if: >-
      Measured red before implementation: the first assert fires with "still declares no
      examined()/skipped() outcome". The predicate is validate_check_accounting's OWN
      _module_declares, never a re-implementation, so the step cannot drift from the ratchet it
      proves. If the shrink-only leg complains instead, the baseline grew -- only removal is legal
      here, and _BASELINE_SEED must not be touched.
    graduation: graduate
    graduation_check_id: ci-workflow-guards-accounting-declaration-adopted
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: A real dispatch of the check derives an enforced outcome rather than an undeclared one
    command: >-
      bin/venv-python -c "from scripts.checks import registry;
      import scripts.checks.ci_guards.validate_ci_workflow_guards as agg; failed=[];
      ctx=registry.outcome_scope('validate_ci_workflow_guards'); ctx.__enter__();
      agg.validate_ci_workflow_guards(failed); ctx.__exit__(None, None, None);
      o=registry.build_outcome('validate_ci_workflow_guards', 'check',
      registry.pop_declaration(), bool(failed));
      assert o.status == 'enforced', (o, failed);
      assert o.examined_count == len(agg._GUARDS) > 0, (o, len(agg._GUARDS));
      print('ACCOUNTING_OUTCOME_OK', o)"
    expected: ACCOUNTING_OUTCOME_OK printed with status='enforced', exit 0
    fix_if: >-
      Measured red before implementation: status reads 'undeclared'. This is the observable
      Decision 170 exists for, not a proxy for it -- the AST scan in step 5 proves a declaration
      exists in the module, this proves one is actually reached on the enforced path. The count is
      compared to len(agg._GUARDS) rather than to a literal 10 deliberately, so a follow-on plan
      adding an eleventh guard does not redden this graduated row.
    graduation: graduate
    graduation_check_id: ci-workflow-guards-accounting-outcome-enforced
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The new unit coverage for the declaration passes
    command: >-
      bin/venv-python -m pytest
      tests/checks/ci_guards/test_validate_ci_workflow_guards.py::TestCheckAccountingDeclaration -q
    expected: all tests in the class pass
    fix_if: >-
      Measured exit 4 ("not found") before implementation, which is a legitimate target_absent
      red-before, never an unmeasurable arm. The class-qualified node id is deliberate: that file
      already passes wholesale on origin/main, so a file-level selector would be refused as
      tautological at admission. The skip-path case must assert that a guard-import failure still
      records exactly one gate failure and does NOT raise -- scripts/validate.py imports this
      module unconditionally.
    graduation: graduate
    graduation_check_id: ci-workflow-guards-accounting-declaration-unit
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: The facade's full 36-name surface and its defining-module map are covered by a mirror test
    command: >-
      bin/venv-python -m pytest
      tests/verify_ci_workflow/test_facade_surface.py::TestFacadeSurface -q
    expected: all tests in the class pass
    fix_if: >-
      Measured exit 4 (file absent) before implementation. The class must assert all 36 names
      resolve through the facade, that each resolves to its expected defining submodule (so a
      later edit cannot quietly move a guard between concerns), and that _load still normalises
      the PyYAML 1.1 bare `on:` key to data["on"] -- the one real behaviour _shared.py carries.
    graduation: graduate
    graduation_check_id: verify-ci-workflow-facade-surface-unit
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The four ci_guards pre_globs still select their checks when the package changes
    command: >-
      bin/venv-python -c "from fnmatch import fnmatch; from scripts.checks.ci_guards import
      _manifest; g={e.name: (e.pre_globs or ()) for e in _manifest.ENTRIES};
      targets=['validate_ci_rca_trigger', 'validate_dependabot_automation',
      'validate_branch_cleanup', 'validate_dispatch_gated_apply_topology'];
      probe='scripts/verify_ci_workflow/__init__.py';
      miss=[n for n in targets if not any(fnmatch(probe, x) for x in g[n])];
      assert not miss, miss;
      noise=[n for n in targets if any(fnmatch('README.md', x) for x in g[n])];
      assert not noise, noise; print('PRE_GLOBS_COVER_PACKAGE_OK')"
    expected: PRE_GLOBS_COVER_PACKAGE_OK printed, exit 0
    fix_if: >-
      Measured red before implementation: all four checks fail to match the package path. This is
      the silent failure mode of the whole refactor -- a stale literal glob does not error, it
      just stops dispatching those four checks in the --pre tier. The README.md conjunct is
      anti-vacuity: without it a catch-all glob would satisfy the step.
    graduation: graduate
    graduation_check_id: ci-guards-pre-globs-cover-verify-ci-workflow-package
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: The deleted flat module leaves no string-literal reference behind
    command: >-
      bin/venv-python -c "import subprocess; from pathlib import Path;
      assert Path('scripts/verify_ci_workflow/__init__.py').is_file(), 'facade package missing';
      assert not Path('scripts/verify_ci_workflow.py').exists(), 'flat module still present';
      r=subprocess.run(['git', 'grep', '-lI', '\"scripts/verify_ci_workflow[.]py\"', '--',
      'scripts', 'tests', '.github'], capture_output=True, text=True);
      assert r.returncode == 1, (r.returncode, r.stdout, r.stderr);
      print('NO_STALE_PATH_LITERALS')"
    expected: NO_STALE_PATH_LITERALS printed, exit 0
    fix_if: >-
      The Delete row fires the surface-retiring closure obligation. The pattern is the
      DOUBLE-QUOTED path, which is what makes it a data-position sweep: measured, it matches
      exactly the seven string literals in scripts/checks/ci_guards/_manifest.py,
      scripts/test_coverage_checker.py and tests/checks/ci_guards/test__manifest.py, and matches
      NONE of the nine provenance docstrings present AT HEAD (seven survive the change -- see
      acceptance criterion 7, which counts the post-implementation state). That distinction is
      load-bearing -- a bare-path sweep would drag
      scripts/checks/ci_guards/validate_ci_rca_trigger.py into scope, and that module is itself
      baselined in config/check_accounting_baseline.yaml, so editing it would force a SECOND
      Decision 170 adoption in this PR. git grep is used rather than `! rg`: rg's exit 2 on a
      missing path maps to shell success, so a negated rg would read an error as a clean sweep;
      git grep returns 1 for no-match and >1 for error, so `returncode == 1` asserts absence.
      The package assertion comes first and is red on the base, which is what admits the row.
    graduation: graduate
    graduation_check_id: verify-ci-workflow-flat-module-fully-retired
  - step: 11
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green end to end
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      validate_check_accounting, validate_sloc_limits, validate_check_manifests and
      validate_pre_glob_closure all read state this plan moves, so a half-applied decomposition
      reddens here rather than at a narrower step.
    graduation: waive
    graduation_waiver_reason: >-
      Recursion: a standing registry row invoking scripts.validate would re-enter the tier that
      dispatches it, and the graduate partition refuses that invocation shape statically at
      plan-PR time. Not not-applicable -- it is a single command_exit_zero shape.
  - step: 12
    phase: pre-deploy
    hermetic: false
    action: Full validation tier completes exit 0 before handoff
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      handoff_policy.full_validation_required_before_commit is declared true, and
      validate_handoff_full_tier fails any plan declaring it without a full-tier step. Step 11
      does not satisfy it. On timeout the disposition is blocked -- rerun from the start.
    graduation: waive
    graduation_waiver_reason: Same recursion reason as step 11, over the full tier rather than the fast one.
