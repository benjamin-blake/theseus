constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Only files in the Scope table may be modified; out-of-scope defects become recommendations via
    scripts.ops_data_portal, never inline fixes (Decision 59).
  - >-
    ZERO BEHAVIOUR CHANGE. Move function bodies verbatim -- no renames, no signature changes, no
    assertion-message edits, no new guards, no guard removals. Every guard must still run, in the
    same order, with the same failures. If a relocated test fails, the move is wrong, not the test.
  - >-
    EXPLICITLY OUT OF SCOPE: the signal-green job in .github/workflows/ci.yml. CORRECTED: an
    earlier draft said it was "owned by two sibling plans". It is not. The conflict-wake sibling
    plan WIDENS its head_ref predicate (it does not retire the job), and the RETIREMENT is owned by
    no plan that exists -- the same unsupported-owner claim that sibling struck from its own text.
    Also out of scope: any removal of _check_signal_green_needs (it moves verbatim into
    _ci_yaml.py and stays wired); scripts/checks/ci_guards/validate_pr_conflict_signal.py (its
    `from scripts.verify_ci_workflow import _load` keeps working through the facade and the file
    is not edited); and anything about branch-name prefixes or wake signals.
  - >-
    Do NOT add a config/sloc_budgets.yaml entry for any new module, and do NOT run
    --update-sloc-budgets as the fix. Decision 128 makes decomposition the response to a file at
    its ceiling; a raise would be the silent trade that Decision refuses.
  - >-
    Never raise during module import (AGENTS.md Safety). scripts/validate.py imports
    validate_ci_workflow_guards unconditionally, which is why its module-level _GUARDS assignment
    is wrapped in try/except -- that wrapper and the call-time try/except both stay exactly as
    they are; the new declaration calls go INSIDE them, never around them.
  - >-
    config/agent/verification_registry/entries/*.yaml are NOT edited. Five rows carry
    `guard_target: scripts/verify_ci_workflow.py` as provenance metadata, and guard_target is
    read only for presence (validate_verification_registry._schema_errors); modifying any of them
    makes it a diff-candidate for the VF-06 c2 differential admission gate, whose origin/main
    worktree revert would still PASS (behaviour is unchanged by a pure move) and therefore be
    refused as tautological.
  - >-
    SIBLING-PLAN ORDERING: PLAN-conflict-wake-prefix-realignment.yaml, authored alongside this
    one and open as a separate PR (this plan was split out to merge first),
    also modifies config/check_accounting_baseline.yaml (a DIFFERENT entry) and
    .github/workflows/ci.yml. Both baseline edits are shrink-only REMOVALS and the ratchet diffs
    against origin/main, so they are compatible whichever lands first; expect only a textual merge
    conflict on the baseline if they land close together. Resolve it by keeping BOTH removals --
    never by restoring an entry.
  - >-
    Ruff or lint failures in CI that this plan's diff did not introduce -- whole-tree lint surfacing
    a pre-existing violation, or a tool-pin bump landing a new rule -- are OUT OF SCOPE: STOP, raise
    it to the operator, do not fix inline (Decision 59).
  - >-
    Python 3.12, type hints, ruff line length 127, no emojis, ASCII hyphens only, comments only
    where the `why` is non-obvious. Invoke Python as bin/venv-python. Linux/bash commands only.
