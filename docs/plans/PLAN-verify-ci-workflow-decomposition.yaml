rollback: >-
  Revert the squash-merge commit. Nothing deploys and no data migrates; the package, the deleted
  flat module, the baseline removal and the pre_globs all move back together in one commit, and
  the accounting baseline is shrink-only in the forward direction only -- a revert restores the
  entry from the reverted diff rather than growing it, so validate_check_accounting's shrink-only
  leg is satisfied by the restored base.
