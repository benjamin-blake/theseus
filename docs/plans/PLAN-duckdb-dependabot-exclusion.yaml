schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "duckdb-dependabot-exclusion"
intent: >-
  Stop one SSOT-owned dependency from stranding an entire weekly grouped bump, and make the duckdb
  exclusion a monitored commitment that resurfaces on its own -- so it is retired on the evidence
  that the coordinated cascade exists, never silently forgotten as a standing exception.
plan_type: IMPLEMENTATION
verification_tier: V2
implementation_declared: true
plan_path: docs/plans/PLAN-duckdb-dependabot-exclusion.yaml
phase: T3.11
scope:
  - file: .github/dependabot.yml
    action: Modify
    purpose: >-
      Add `exclude-patterns: ["duckdb", "ducklake"]` to the pip `minor-and-patch` group. BOTH names,
      not just duckdb: `scripts/ci/dependabot_auto_merge.sh:50` carries `_DENIED_DEPENDENCIES="duckdb
      ducklake"`, and the new guard derives its assertion FROM that literal, so excluding only duckdb
      leaves the guard red on `ducklake`. An excluded dependency still gets its OWN PR, which the
      denylist quarantines alone -- that standing PR is the new-release signal Decision 99's
      one-file bump procedure needs as its trigger, and is why exclude-patterns was chosen over a
      top-level `ignore:` (which deletes the signal). PRICE THE COST HONESTLY in the inline comment,
      do not sell this as free: that standalone PR is permanently BLOCKED (the lockstep gate reds it
      and the denylist refuses to arm it), so `scripts/preflight/dependabot.py::_is_stranded` returns
      True for it from day one regardless of age (STRANDED_MERGE_STATES includes BLOCKED), and it
      permanently holds one of the five `open-pull-requests-limit` pip slots. The alert half is
      CONSERVATIVE rather than certain: check_stranded_prs sources from the gh CLI, which AGENTS.md
      keeps deliberately absent from both containers, so in agent sessions the bucket degrades to
      UNAVAILABLE rather than firing. The slot cost is unconditional; the nagging is not. A dedicated second `groups:` entry
      (`patterns: [duckdb, ducklake]`) was considered -- it would NAME the quarantined PR rather than
      leaving it anonymous -- and rejected: it buys a label at the cost of a second group construct
      whose sole membership is permanently unmergeable, and Dependabot's group-assignment precedence
      between a patterns group and an update-types group is not a property worth depending on.
      Comment must name Decision 99 as the owning commitment and the reversal-conditions stanza as
      the retirement criteria, so a reader of this file alone can find why.
  - file: scripts/checks/ci_guards/validate_dependabot_config.py
    action: Create
    purpose: >-
      New `--pre` check asserting that every name parsed out of `_DENIED_DEPENDENCIES` in
      scripts/ci/dependabot_auto_merge.sh is excluded from every group of every `package-ecosystem:
      pip` entry in .github/dependabot.yml. DERIVED, never enumerated (Decision 187): the denylist is
      read from the shell script at check time, so a future denylist addition fails this gate until
      the config catches up, which is the whole point. Scope the assertion to the pip ecosystem --
      duckdb is a PyPI distribution, so asserting its absence from the github-actions group would be
      vacuous and would force noise config into that entry. Note `ducklake` is NOT a pip requirement
      here at all (no requirements file declares it; it is a DuckDB extension), so its exclusion is
      inert defensive config that Dependabot could never act on -- it is carried because the derived
      assertion reads the denylist verbatim, which is the honest price of Decision 187, not because a
      ducklake pip bump is reachable. A denylist that cannot be
      parsed FAILS LOUDLY (never a silent pass): losing the regex silently converts this into a check
      that asserts nothing while reporting green. Record in the module docstring that the assertion
      is scoped to pip groups as a whole: a future pip group narrowly patterned on something duckdb
      could never match (say `patterns: ["boto3*"]`) would still be required to carry the
      exclude-patterns, which is the same noise-config trap the ecosystem scoping avoids -- revisit
      the scoping rather than adding the noise if that group ever appears. Declares
      `registry.examined(count,
      unit="dependabot_pip_groups")` on every reachable exit path (Decision 170); the
      `_BASELINE_SEED` in config/check_accounting_baseline.yaml is frozen, so a new check genuinely
      cannot be grandfathered. NEW SIBLING MODULE rather than a third assertion inside
      validate_dependabot_automation.py: that module itself has room (369 SLOC), so the argument is
      specifically about its MIRROR TEST, which is at 461 against the 500 limit -- Decision 128
      answers a crossing with decomposition, never a raise, and a separate cohesive module (config
      shape) beside the existing one (workflow shape) avoids the crossing entirely while standing on
      its own cohesion grounds.
  - file: tests/checks/ci_guards/test_validate_dependabot_config.py
    action: Create
    purpose: >-
      Mirror tests (Decision 131), including a `TestPassPath::test_passes_against_the_real_repo_config`
      node (VP step 2 targets it by that exact id). Pass path against the REAL repo files, plus one
      fail path per assertion, each mutating exactly one property of a valid fixture so no test fails
      for two reasons at once (the sibling module's established fixture discipline): a pip group with
      no exclude-patterns key at all; exclude-patterns present but missing one denied name; an
      unparseable or absent `_DENIED_DEPENDENCIES` literal failing loudly rather than passing
      vacuously. Plus the Decision 170 accounting assertions (examined declared on the pass path AND
      on the unreadable-config path), and a
      `TestTaxonomyRegistration::test_taxonomy_row_exists` node asserting
      `function_to_category["validate_dependabot_config"] == "code_regression"` -- the shape
      test_validate_raises_discrimination.py:513 already uses, and the linked obligation for the
      config/ci_rca_taxonomy.yaml scope row. Self-contained -- no cross-test imports.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      One `Entry(...)` literal registering the new check, BARE STRING module/attr only (Decision 169
      -- a computed or "module:attr" value severs the AST graph edge validate_check_manifests walks).
      `pre=True` with pre_globs closing over EVERY path the implementation reads, not just the two
      obvious ones: `.github/dependabot.yml`, `scripts/ci/dependabot_auto_merge.sh`,
      `scripts/checks/ci_guards/validate_dependabot_config.py` (its own module),
      `scripts/checks/_common.py` and `scripts/checks/registry.py`. Every sibling gated Entry lists
      that self-closure and `tests/checks/ci_guards/test__manifest.py::TestGatedEntryInputClosures`
      exists to enforce it -- under-inclusion is a recall bug, and omitting the module's own path
      means a PR editing only the checker would not dispatch it in `--pre`.
      `full_segment="full_after_lint"`, matching its sibling. Adding globs is a tightening and needs
      no tier-demotion marker (Decision 187).
  - file: tests/checks/ci_guards/test__manifest.py
    action: Modify
    purpose: >-
      Add a `TestGatedEntryInputClosures::test_dependabot_config_entry_closes_over_its_inputs` node
      (VP step 6 targets it by that exact id) asserting the new Entry exists, is pre-tier, and closes
      over all five pre_globs above. Assert membership and properties -- never an exact
      `len(ENTRIES) == N`, which breaks CI on the next unrelated check addition (tests/CLAUDE.md
      test-count coupling rule).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      `validate_dependabot_config: code_regression` row. Named by `scripts.roadmap.plan_obligations`
      as the one registration obligation a new check module owes as a scope row; the sibling
      validate_dependabot_automation carries the identical classification at :108.
  - file: tests/test_import_governance.py
    action: Modify
    purpose: >-
      Second, INDEPENDENT blocker on PR #1171, unrelated to duckdb.
      `TestCheckLockfileSync::test_mcp_declaration_rejects_major_two` (:229-237) asserts
      `Version("1.28.1") in Requirement(declaration).specifier`, so it fails on ANY mcp floor bump
      (the PR moves the floor to >=1.30.0) -- a version literal coupled to the thing it guards, the
      same defect class tests/CLAUDE.md names for counts and rec-2358 names for the duckdb fixtures.
      DO NOT fix it by deriving the probe from the declared floor: that makes the assertion
      tautological for every `>=floor,<2` form and is an assertion weakened to obtain green, which
      Decision 181 clause 1 forbids. Fix it with an INDEPENDENT oracle -- take the 1.x probe from the
      COMPILED requirements.txt pin -- and SPLIT the two properties into separately-named nodes so
      each has its own verifier: a new
      `TestCheckLockfileSync::test_mcp_declaration_admits_the_compiled_pin` (VP step 5 targets it by
      that exact id) carrying the cross-file "the pin satisfies the declared floor" assertion, and
      the existing `test_mcp_declaration_rejects_major_two` retaining `Version("2.0.0") not in
      specifier` unchanged. The split is what makes the fix positively verifiable rather than
      provable only by the absence of a literal. Keep both parametrised over requirements.in AND
      requirements-fast.txt -- the fast-tier leg is genuinely uncovered by
      `scripts/import_governance.py::check_lockfile_sync`, whose four-path set excludes it.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Amend Decision 99 IN PLACE -- no new Decision number. A group exclusion is a point-fix whose
      durable commitment (SSOT ownership of the duckdb floor) Decision 99 already owns, and
      docs/contracts/decision-entry.yaml's significance.routing sends that to an existing entry, not
      to a fresh header. Two pure INSERTIONS (Decision 177 branch 1 permits added lines; modifying or
      reordering the live body does not): a dated, source-cited `> **...:**` annotation recording the
      exclusion, its standalone-PR cost, and why the signal is preserved; and a fenced ```yaml
      reversal-conditions``` stanza with `decision: 99` (the parser MALFORMED-fails a stanza whose id
      does not match its enclosing header, decision_conditions.py:164). Decision 99 carries no stanza
      today, so this claims the slot rather than colliding. Write each condition as a self-describing
      STATE citing rec ids as EVIDENCE, never as the condition itself (Decision 103) -- a condition
      phrased as "rec-3841 is closed" rots silently the moment that rec is superseded. Include a
      condition covering the case where the quarantined-PR release signal degrades into pure noise,
      so the cost this exclusion accepts is itself monitored rather than merely disclosed.
  - file: docs/plans/PLAN-duckdb-dependabot-exclusion.yaml
    action: Create
    purpose: This plan.
bundled_recommendations:
  - rec-3832
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - Every name in dependabot_auto_merge.sh's _DENIED_DEPENDENCIES is excluded from every pip group in .github/dependabot.yml
  - A --pre check fails when a denylisted dependency is left inside a pip group, and fails loudly when the denylist cannot be parsed
  - The new check's Entry is pre-tier and closes over every path its implementation reads
  - Decision 99 carries a well-formed reversal-conditions stanza that scripts.preflight.decision_conditions reports as monitored
  - tests/test_import_governance.py asserts the mcp 1.x probe against the compiled pin in a named node, with no hardcoded version literal and the major-2 upper bound retained in its own node
  - After the regenerated group merges, main no longer carries the pre-bump mcp pin and duckdb is still pinned 1.5.4
  - rec-3832 is closed
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The guard rejects every way a denylisted dependency can survive in a pip group, and fails
      loudly rather than vacuously when the denylist itself cannot be read
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_dependabot_config.py -q
    expected: >-
      All cases pass -- including the group-with-no-exclude-patterns case, the
      exclude-patterns-missing-one-name case, the unparseable-denylist case appending a failure, and
      the taxonomy-row and Decision 170 accounting nodes (the command runs the whole file, which is
      why test_obligations links the config/ci_rca_taxonomy.yaml row to this step)
    fix_if: >-
      A config missing the exclusion passes the guard, or an unparseable denylist yields zero
      failures (a check that asserts nothing while reporting green)
    hermetic: false
    graduation: graduate
    graduation_check_id: dependabot-denylist-excluded-from-pip-groups
  - step: 2
    phase: pre-deploy
    action: The live repository config satisfies the guard against the real denylist, not a fixture
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_dependabot_config.py::TestPassPath::test_passes_against_the_real_repo_config" -q
    expected: Passes; the real .github/dependabot.yml excludes both duckdb and ducklake from the pip group
    fix_if: The real config still lets a denylisted name ride the pip group, or only duckdb was excluded and ducklake was forgotten
    hermetic: false
    graduation: graduate
    graduation_check_id: dependabot-real-config-excludes-denylisted-deps
  - step: 3
    phase: pre-deploy
    action: The Decision 99 reversal-conditions stanza parses, matches its enclosing header, and is actually monitored
    command: 'out=$(bin/venv-python -m scripts.preflight.decision_conditions) && printf ''%s\n'' "$out" | grep -qE "^Decision 99: (not-due|manual-review-due|fired)"'
    expected: >-
      A Decision 99 line is printed in a well-formed STATE and the CLI exits zero. The alternation
      admits all three live states (not-due today, plus manual-review-due and fired) on purpose, so
      the standing registry row does not false-red once review_by elapses or a condition fires --
      only MALFORMED is rejected
    fix_if: >-
      No Decision 99 line (the fence was never added, or sits outside Decision 99's block), or the
      stanza reports MALFORMED because decision/review_by/on_trigger/conditions is missing or the
      stanza id does not match the header. DO NOT simplify this command to a bare pipe into `grep -q
      "^Decision 99:"`: _cli prints `Decision 99: MALFORMED -- {error}` for every malformed branch,
      so that grep MATCHES a malformed stanza and the pipe discards _cli's exit 1 -- the step would
      then assert presence while its graduated slug claims monitoring. Binding the output first
      preserves the exit code; the state alternation rejects MALFORMED explicitly.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-99-reversal-stanza-monitored
  - step: 4
    phase: pre-deploy
    action: The mcp declaration assertion no longer carries a version literal coupled to the floor it guards
    command: test "$(grep -cE 'Version\("1\.[0-9]+\.[0-9]+"\)' tests/test_import_governance.py)" -eq 0
    expected: Zero hardcoded 1.x version literals; the 1.x probe now comes from the compiled requirements.txt pin
    fix_if: >-
      A hardcoded 1.x literal survives (the test still breaks on the next mcp bump). The pattern is
      deliberately the 1.x FAMILY, not the single literal Version("1.28.1"): once this bump merges
      that exact string can never recur, so a row pinned to it would be green-by-construction and
      would miss the next hardcoded literal -- the very regression it is named for. Note this step is
      the NEGATIVE half only and is satisfiable by deleting the test outright -- step 5 is the
      positive half that makes deletion insufficient
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-declaration-test-has-no-pinned-1x-literal
  - step: 5
    phase: pre-deploy
    action: >-
      The replacement compiled-pin oracle actually exists and holds, and the major-2 upper bound
      survives in its own node -- the positive counterpart to step 4
    command: bin/venv-python -m pytest "tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_admits_the_compiled_pin" "tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_major_two" -q
    expected: Both nodes pass across both parametrised files; the compiled pin satisfies the declared floor and 2.0.0 is still rejected
    fix_if: >-
      The admits-the-compiled-pin node does not exist (step 4 was satisfied by deletion), or the
      upper-bound node was dropped in the rewrite, or the new oracle reads the declared floor rather
      than the compiled pin and is therefore tautological (Decision 181 clause 1)
    hermetic: false
    graduation: graduate
    graduation_check_id: mcp-declaration-admits-compiled-pin
  - step: 6
    phase: pre-deploy
    action: The new check is selected by a PR that touches only the dependabot config, and its Entry closes over every path it reads
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test__manifest.py::TestGatedEntryInputClosures::test_dependabot_config_entry_closes_over_its_inputs" -q
    expected: Passes; the Entry is registered, pre-tier, and its pre_globs name all five closure paths
    fix_if: >-
      The Entry is full-tier only, or its globs miss .github/dependabot.yml or the module's own path,
      so a config-only or checker-only PR never dispatches the guard and the regression is caught
      only after merge
    hermetic: false
    graduation: graduate
    graduation_check_id: dependabot-config-guard-is-pre-tier-on-config-edits
  - step: 7
    phase: pre-deploy
    action: The rest of the import-governance suite still passes against the current, unbumped tree
    command: bin/venv-python -m pytest tests/test_import_governance.py -q
    expected: All tests pass; the rewritten assertions hold where the compiled pin satisfies the declared floor
    fix_if: The rewritten oracle is wrong about the current tree (e.g. it reads the wrong file or mis-parses the pin)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Green by construction on the unimplemented tree, so it cannot demonstrate red-before and a
      graduate disposition would be a false one (Decision 189). The discriminating condition is a
      BUMPED mcp floor, which exists only on the Dependabot head, not here; steps 4 and 5 graduate
      the properties that ARE red-before on this tree, and step 11 exercises the real bumped floor.
  - step: 8
    phase: pre-deploy
    action: Whole fast presubmit stays green with the new check wired in
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, with the new check listed among those run
    fix_if: The new check reds the live tree, or a manifest/accounting guard rejects its registration
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      MANDATORY, not discretionary: vp-red-before.yaml's recursion_refusal statically refuses any
      graduate pre-deploy step whose argv head is `-m scripts.validate`, on exactly this eligible-plan
      population. Kept as the integration gate proving the registration guards (manifest, accounting,
      taxonomy) accept the new module.
  - step: 9
    phase: pre-deploy
    action: Full-tier validation before handoff, as handoff_policy.full_validation_required_before_commit declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 across the whole fleet -- every check runs unconditionally, including the full-tier-only segments the diff-aware --pre tier never reaches (the complete pytest suite, the coverage floor)
    fix_if: >-
      A full-tier-only segment reds -- most likely the complete pytest suite surfacing a test the
      diff-aware --pre selection never ran, or the coverage floor. The registration guards
      (validate_check_manifests, validate_pre_glob_closure, validate_check_accounting) are all
      pre=True and are already exercised by step 8, so they are not what this step adds
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      MANDATORY, not discretionary, for the same reason as step 8: vp-red-before.yaml's
      recursion_refusal statically refuses any graduate pre-deploy step whose argv head is `-m
      scripts.validate`. This is the handoff gate handoff_policy.full_validation_required_before_commit
      requires; the registration guards are pre=True and step 8 already exercises them.
  - step: 10
    phase: post-deploy
    action: >-
      Dependabot regenerates the group without duckdb once the config change is on main. Identify the
      regenerated PR with mcp__github__pull_request_read before running this command
    command: git fetch origin "+refs/heads/dependabot/pip/*:refs/remotes/dependabot/pip/*" --quiet && ref=$(git for-each-ref --sort=-committerdate --format='%(refname)' refs/remotes/dependabot/pip/ | head -1) && test -n "$ref" && test -z "$(git diff origin/main..."$ref" -- requirements.in requirements.txt requirements-fast.txt requirements-dev.in requirements-dev.txt | grep -E '^[+-]duckdb')"
    expected: >-
      A dependabot/pip ref exists AND its requirements diff adds and removes no duckdb line at all.
      The ref is bound and required non-empty deliberately: without `test -n "$ref"` the inner
      for-each-ref yields nothing, the diff errors to stderr, and `test -z ""` exits 0 -- so "never
      regenerated" would pass vacuously as "regenerated clean"
    fix_if: >-
      A duckdb line appears in the diff (the exclude-pattern did not take -- check the group name and
      indentation), or no dependabot/pip ref is found because Dependabot neither recreated nor
      superseded, in which case post `@dependabot recreate` on the PR and re-run
  - step: 11
    phase: post-deploy
    action: >-
      The regenerated PR merged green, proving both blockers are gone against a real bumped mcp floor.
      Read its check runs with mcp__github__pull_request_read(method="get_check_runs") before merging
    command: git fetch origin main --quiet && git show origin/main:requirements.txt | grep -q '^duckdb==1.5.4' && ! git show origin/main:requirements.txt | grep -q '^mcp==1.28.1'
    expected: >-
      On main after the merge, duckdb is still pinned 1.5.4 (the exclusion held end to end) and the
      old mcp pin is gone (the ten updates actually landed)
    fix_if: >-
      duckdb moved AND the SSOT at config/lambda/ducklake/version.yaml still reads 1.5.4 (the
      exclusion leaked and the pin is now desynced -- revert the merge). If duckdb moved and the SSOT
      moved WITH it, that is the sanctioned rec-3791 cascade landing, not a leak: re-pin this step's
      expected value to the new version rather than reverting anything. Or the old mcp pin survives (the group never merged; check whether pr-validate is still red, and fix the
      oracle rather than the assertion's strength if the mcp test is the cause)
  - step: 12
    phase: post-deploy
    action: The bundled recommendation closes against the warehouse, not just locally
    command: 'bin/venv-python -m scripts.sync.ops sync && grep ''"id": "rec-3832"'' logs/.recommendations-log.jsonl | grep -q ''"status": "closed"'''
    expected: >-
      rec-3832 reads closed in the refreshed read cache. Both greps are ANCHORED on their json keys
      deliberately: rec-3843's row also contains the bare substring "rec-3832" (it is one of its four
      dependency edges), so an unanchored `grep rec-3832 | grep closed` passes as soon as rec-3843
      closes, whether or not rec-3832 did
    fix_if: >-
      Still open -- the squash-merge body omitted the `Resolves: rec-3832` trailer that
      rec-autoclose.yml keys on, or its acceptance command still names the old
      test_validate_dependabot_automation.py home and must be repointed via update_rec first
test_obligations:
  - source: .github/dependabot.yml
    behavior: >-
      Both denied names stay excluded from the pip minor-and-patch group, so a lockstep-owned floor
      can never rejoin a grouped bump and strand it
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_dependabot_config.py::TestPassPath::test_passes_against_the_real_repo_config
    red_green_expectation: red before (the real config excludes neither name), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: >-
      The new check is attributable to a failure category, so a red from it is classifiable by ci-rca
      rather than landing uncategorised
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_dependabot_config.py::TestTaxonomyRegistration::test_taxonomy_row_exists
    red_green_expectation: red before (node id does not exist, pytest exits 4), green after
  - source: scripts/checks/ci_guards/validate_dependabot_config.py
    behavior: >-
      A denylisted dependency left inside a pip group fails the check, and an unparseable
      _DENIED_DEPENDENCIES fails loudly rather than passing vacuously
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_dependabot_config.py
    red_green_expectation: red before (module and tests do not exist), green after
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: >-
      The new Entry stays pre-tier and closes over all five paths its implementation reads, so a
      config-only or checker-only PR dispatches the guard pre-merge
    verification_step: 6
    test_selector: tests/checks/ci_guards/test__manifest.py::TestGatedEntryInputClosures::test_dependabot_config_entry_closes_over_its_inputs
    red_green_expectation: red before (node id does not exist, pytest exits 4), green after
constraints:
  - No rescue agents or workaround loops (Decision 55)
  - >-
    Never weaken an assertion to obtain green (Decision 181 clause 1). The mcp fix must keep
    discriminating; if no non-vacuous form exists, file a recommendation instead of relaxing it.
  - >-
    Never raise a SLOC budget to absorb the new tests (Decision 128). If a scope file crosses 500,
    decompose it into a facade package; --update-sloc-budgets does not auto-seed a new oversized file.
  - >-
    Do not modify or reorder Decision 99's existing body (Decision 177). Both edits are pure
    insertions; the fenced stanza interior is the one mutable monitored surface.
  - >-
    The denylist is DERIVED from scripts/ci/dependabot_auto_merge.sh at check time and never
    re-listed in the CHECKER MODULE or in any pass-path assertion (Decision 187
    derive-don't-enumerate). Fail-path FIXTURES may and must carry literal denied names -- a fixture
    missing exactly one name IS the condition under test -- exactly as the sibling test file does at
    tests/checks/ci_guards/test_validate_dependabot_automation.py:55.
  - >-
    Do not hand-edit the Dependabot branch. The regenerated PR comes from Dependabot itself
    (@dependabot recreate); merging is squash, via mcp__github__merge_pull_request.
  - >-
    implementation_declared is set at /implement Step 7 after the graduation walk writes the registry
    rows -- never at plan-authoring time, which would exempt this plan from the Decision 189
    red-before leg it relies on.
