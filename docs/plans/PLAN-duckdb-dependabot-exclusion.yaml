execution_steps:
  - >-
    .github/dependabot.yml -- add exclude-patterns with BOTH duckdb and ducklake to the pip
    minor-and-patch group, plus the inline comment naming Decision 99 and the stanza.
  - >-
    scripts/checks/ci_guards/validate_dependabot_config.py -- parse _DENIED_DEPENDENCIES from the
    auto-merge delegate, assert exclusion across every pip group, fail loudly on an unparseable
    denylist, declare examined() on every exit path.
  - tests/checks/ci_guards/test_validate_dependabot_config.py -- pass path on the real files plus one fail path per assertion.
  - scripts/checks/ci_guards/_manifest.py -- register the Entry with bare-string module/attr and the two load-bearing pre_globs.
  - tests/checks/ci_guards/test__manifest.py -- membership and property assertions, no exact-count coupling.
  - config/ci_rca_taxonomy.yaml -- add the validate_dependabot_config row.
  - >-
    tests/test_import_governance.py -- repoint the mcp 1.x probe at the compiled requirements.txt
    pin, keeping the major-2 upper bound.
  - >-
    docs/DECISIONS.md -- insert the dated annotation and the decision-99 reversal-conditions stanza
    into Decision 99, conditions phrased as states.
  - Execute Verification Plan steps 1-7 -- run each; loop until pass.
  - >-
    Repoint rec-3832's acceptance at the realised test home via update_rec, then commit, PR, and
    squash-merge with a `Resolves: rec-3832` trailer.
  - >-
    Post @dependabot recreate on PR #1171, subscribe_pr_activity, and squash-merge the regenerated
    PR once green. Execute Verification Plan steps 8-10.
  - 'Report: what was implemented, verification results, and the merged PR number for the regenerated group.'
work_areas: []
rollback: >-
  Revert the .github/dependabot.yml exclude-patterns block to restore the previous grouping. The
  guard, the stanza and the mcp oracle are independently revertible and none is load-bearing for
  any runtime path -- nothing deploys, so rollback is a plain revert commit.
