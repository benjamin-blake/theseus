execution_steps:
- >-
  Create tests/checks/contracts/test_write_time_enforcement_decision.py with the two test functions named in
  test_obligations (stdlib + yaml; reuse the whitespace-normalising helper pattern from
  tests/telemetry/test_contract_amendments.py). Resolve N ONLY from a statement that OPENS with "Decision <N>:"
  (re.match on the stripped statement; fail if it does not), never the first citation anywhere -- the statement also cites
  207, 84 and others. test_write_time_enforcement_rule_declared: rule id present; statement (normalised, lower-case)
  contains "row-local", "required_when", "exactly-one-of", "own transaction", "arrival order", "clock domain" and
  "defence in depth"; design_time_walk contains "write-time-enforcement" and "Decision <N>".
  test_decision_entry_and_victim_annotation: DECISIONS.md has "## Decision <N>:"; its section contains "amends: [81]",
  "numbered_decision", "reversal-conditions", the owners rec-4024, rec-4158, rec-4063, rec-4101 and rec-4121, and one
  anchor per pinned clause -- "monotone", "arrival order", "single source", "fix at the source", "defence in depth" --
  so byte-cap tightening cannot silently drop a clause; Decision 81's section contains a line matching
  r"^\[Amendment \d{4}-\d{2}-\d{2}, Decision <N>:" (the date is the implementation date, never hard-coded). Run it and confirm it FAILS on the unchanged tree.
- >-
  Add the Decision to docs/DECISIONS.md. Pinned content (tighten wording as needed for the byte cap, never drop a
  clause): PROBLEM -- append-only store; a committed row that breaks a rule cannot be corrected in place (199 journal,
  207 grain); rules only in read-time DQ let invalid rows land permanently and every reader pays (Decision 70 precedent);
  today no telemetry value set, required_when or exactly-one-of rule is enforced at write; the 2026-09-29 probe found
  event_timestamp >= session_started_at broken by today's producer (8 hook events up to 9.9 s early). DECISION -- (1)
  row-local rules at write: decidable from one row's own values plus static contract data and the writer's clock (type,
  not-null, accepted values, conditional requiredness, exactly-one-of, format/bounds, in-row orderings); a violating
  row is rejected loudly and the whole request writes nothing (Decision 55; 207 reject semantics); a clock-dependent rule
  is monotone so an identical re-send stays a no-op. (2) Cross-row rules at write when (a) decidable inside the write's
  own transaction bounded to the batch's partitions with no extra catalog round-trip AND (b) its truth does not depend on
  the arrival order of independent producers; write-owned under this test: 207 grain MERGE, the ops writer's
  in-transaction referential check (81 cl.8, re-assigned from DQ), status DAG (103), I-2 allocation (84) -- the ops
  instances' 207 residuals stay with rec-4121 items 1-3; everything else is a DQ monitor, alarm-not-gate for CI (T1.6) -- references
  across independent producers (telemetry parent existence, R3), concurrent-append race duplicates, pending
  generations, cardinalities. (3) Single source: one declared rule source per table; checks derive from it, never hand-restated in writer
  code -- for telemetry the owning Class A contract; for the ops tables the choice (Class A contract, field_semantics,
  data_quality/ops.yaml, CD.12 Pydantic Annotated models) is rec-4158's, not re-decided here; an exemption sits beside the rule with reason and owning rec. (4) Fix at the source, never demote
  to DQ; a new accepted value ships contract amendment + writer deploy before any producer emits it. (5) Writer check
  primary on every adapter (plane-neutral, Decision 184 cl.2; its reject names the rule); engine constraints such as NOT
  NULL declared as defence in depth (Decision 100); Decision 207's own grain reversal condition (adopt engine unique keys)
  is unchanged. RATIONALE -- the write boundary is the only place a rule can prevent
  rather than detect. COVERAGE (Decision 181 cl.2) -- telemetry writer rec-4024 slice 2a (incl. the slice-3a producer's
  session_started_at pin); existing ops writers and contracts rec-4158 (incl. the Decision 65 single-source choice and
  Decision 64 bootstrap gates); every writer present and future: a writer-conformance check, an unenforced residual owned
  by rec-4158 until it lands (Decision 163); DQ side -- telemetry monitors rec-4063 and rec-4101, ops-history race
  duplicates rec-4121 item 4 -- all unenforced residuals until the T1.6 scheduled monitor substrate runs them (a
  DuckLake relationships check SKIPs today). REVERSAL CONDITIONS
  (review_by 2027-03-31, on_trigger "re-decide via /plan") -- write-time-rejects-block-valid-capture (re-examine the
  rule's definition first; demote only by amending this Decision); engine-constraints-on-every-adapter (re-decide which
  layer is primary). RELATED -- 207, 81 cl.5/cl.8, 84 I-2, 103, 55, 199, 184 cl.2, 100, 181 cl.2, 163, 70, T1.6, and
  CD.12 REFINED (not amended) in three respects: the ops single-source choice is deferred to rec-4158, not re-decided
  here; telemetry's single source is its owning Class A contract (already so under Decision 199); and its "FK across
  tables pre-commit" is narrowed to write-decidable references, references across independent producers staying DQ
  (already so under Decision 199 / R3) -- CD.12's eventual ratification reconciles with this Decision.
  Envelope significance justification: it amends Decision 81 cl.5 and cl.8 (widening the writer's duty beyond types and
  re-assigning the in-transaction referential check from DQ) and carries reversal conditions -- a re-assignment of a
  ratified Decision's clauses that no contract rule or amendment_forms note can carry; data-modeling-standard.yaml
  carries the operational rule (Decision 207 precedent). Append the dated
  annotation to Decision 81 (scope row 1). Regenerate docs/decisions-index.json.
- >-
  Add rule write-time-enforcement to docs/contracts/data-modeling-standard.yaml per its scope purpose, the step-7 walk
  sentence, the amendment_log entry and the version/updated/decisions_cited bumps.
- Execute Verification Plan steps 1 and 2 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- Write the registry row for graduated step 1 (check id write-time-enforcement-decision-declared).
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence),
  each reported on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness, record each state as
  reported. (b) Set implementation_declared true on this plan, then commit, git fetch origin main and git rebase
  origin/main (STOP on conflict -- a DECISIONS.md or decisions-index.json conflict is the expected shape of the numbering
  race: surface it, and renumber once it is resolved); if origin/main's highest Decision number moved past N-1, RENUMBER
  N everywhere -- heading, envelope number, reversal-conditions `decision:` field, any Warehouse ID marker, rule
  statement, design_time_walk, the contract's decisions_cited and amendment_log summary, and the Decision 81 annotation
  -- then prove no stale reference survives (rg -n "Decision <old N>|decision: <old N>|dec-<old N>" docs/DECISIONS.md
  docs/contracts/data-modeling-standard.yaml docs/decisions-index.json returns nothing), regenerate
  docs/decisions-index.json and re-run VP steps 1-2. (c) The parent full-tier verdict as its own fact: VP step 3 (bin/venv-python -m scripts.validate) on
  the committed, rebased, clean tree, then bin/venv-python -m scripts.checks.validation_result --verify-head; on timeout
  the disposition is blocked. (d) Structured postflight evidence via bin/venv-python -m scripts.session.postflight
  --evidence. (e) Push, open the PR, subscribe; on green CI squash-merge with the PR body as commit_message; report the
  real push/PR/merge outcome separately, including the Decision number taken.
rollback: >-
  Revert the squash commit; no runtime surface consumes the rule until rec-4024 slice 2a and rec-4158 land.
