schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: write-time-enforcement-decision
intent: >-
  Record the platform rule that, in the append-only lakehouse, every data rule a write can decide is enforced at the write
  boundary and data-quality monitors own only what a write cannot: a new numbered Decision (amending Decision 81 clause 5)
  plus a data-modeling-standard.yaml rule, so the telemetry writer (rec-4024 slice 2a) and the retroactive ops-writer work
  (rec-4158) build to one ratified standard. Clean, contract-bound telemetry is the learning signal for recursive
  self-improvement (PROJECT_CONTEXT); an invalid row that lands in an append-only store can never be corrected in place.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-write-time-enforcement-decision.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- platform-rule groundwork the slice-2a writer checks build to; closes NO exit
  criterion. Retroactive application to the existing ops writers and contracts is follow-on rec-4158; T1.6's DQ monitor
  keeps the cross-row rules this Decision assigns to DQ.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    (1) NEW numbered Decision N (N = origin/main max + 1 at implementation time; 210 expected), inserted newest-first after
    the preamble, modelled on Decision 207's shape (bare ```yaml envelope with number, amends: [81], significance
    numbered_decision + justification; Status/Date markers; Problem / Decision / Rationale / Coverage; a ```yaml
    reversal-conditions stanza; Related; trailing '---' separator), <= 6,144 bytes. Title: "Data rules are enforced at the
    write boundary wherever the write can decide them; data-quality monitors own only what a write cannot (amends Decision
    81 clauses 5 and 8)". Content is pinned in execution_steps step 2. (2) A dated trailing-bracket annotation (Decision 177
    dialect, decision-entry.yaml amendment_forms trailing_bracket form, the leading form of the Decision 207 precedent on
    Decision 81) appended at the end of Decision 81's body, "Decision N" on the FIRST line (dated the implementation day): "[Amendment 2026-09-29,
    Decision N: clause 5's schema-enforcement chokepoint is widened to every write-decidable data rule, not only types
    (ops-writer residual owned by rec-4158); clause 8's in-transaction referential existence check is write-owned under Decision N, while uniqueness under the
    concurrent-append race stays DQ.]" -- the victim annotation validate_supersession_annotations requires for the
    'amends Decision 81' phrase. No other Decision body is touched.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write (validate_decisions_index_freshness); never hand-edited.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    New rule `write-time-enforcement` directly after `grain-enforced-at-write`, its statement OPENING with "Decision N:"
    (so the guard test resolves N from the first citation) and carrying the operational detail the Decision points at: the row-local rule set (type, not-null, accepted values, required_when,
    exactly-one-of, format/bounds, in-row orderings); the two-part cross-row test (decidable inside the write's own
    transaction bounded to the batch's partitions with no extra catalog round-trip, AND its truth does not depend on the
    arrival order of independent producers) with the four write-owned cases under this test (Decision 207 grain MERGE,
    the ops writer's in-transaction referential check, the rec status DAG, Decision 84 I-2 id allocation -- the ops
    instances' Decision 207 residuals stay with rec-4121 items 1-3) and the DQ-owned remainder (references across
    independent producers -- telemetry parent existence, R3 -- concurrent-append race duplicates, pending generations,
    cardinalities); single source (write-time checks derive from the table's ONE declared rule source, never hand-restated in writer
    code -- for telemetry the owning Class A contract; for the ops tables the choice among the Class A contract,
    field_semantics.yaml, config/agent/data_quality/ops.yaml and the CD.12 Pydantic Annotated models is rec-4158's; an
    exemption sits beside the rule with reason and owning rec); monotone clock-dependent rules (an identical re-send stays a no-op, Decision 207); an in-row ordering between values
    minted by different producers' clocks (e.g. a transcript-less producer's event_timestamp against a handed-off
    session_started_at, rec-4028) crosses a clock domain and is enforced only with a declared skew bound in the owning
    contract, never as an exact comparison; fix at the source,
    never demote to DQ; a new accepted value ships contract + writer deploy before any producer emits it; writer check
    primary on every adapter, engine constraints (e.g. NOT NULL) declared as defence in depth. design_time_walk gains one
    sentence at step 7 (the reject-CRUD checklist): classify every declared data rule as write-decidable (enforce at write
    per rule write-time-enforcement, Decision N) or DQ-owned. Contract-level amendment_log entry
    (governance_note_add, semantic_break true); version 3 -> 4; updated_at/updated_by; decisions_cited gains N and 81 is
    already present. Stays within the contracts structural size budget (332 effective lines today).
- file: tests/checks/contracts/test_write_time_enforcement_decision.py
  action: Create
  purpose: >-
    Guard test (fast tier, stdlib + yaml): the data-modeling rule exists, cites its Decision, carries the row-local and
    cross-row tests; the walk points at it; DECISIONS.md carries the Decision with its coverage owners and amends 81; and
    Decision 81 carries the dated annotation naming Decision N. The Decision number is resolved from the rule's own
    citation, never hard-coded (the grain-enforced-at-write guard's pattern, tests/telemetry/test_contract_amendments.py).
bundled_recommendations: []
followon_recs:
- rec-4158
infrastructure_dependencies: []
acceptance_criteria:
- >-
  docs/DECISIONS.md carries the new Decision (<= 6,144 bytes, envelope with number, amends [81] and significance
  numbered_decision, a reversal-conditions stanza) whose Coverage names rec-4024, rec-4158, rec-4063, rec-4101 and rec-4121, and
  Decision 81's body ends with a dated trailing-bracket annotation naming it.
- docs/decisions-index.json is fresh against DECISIONS.md.
- >-
  docs/contracts/data-modeling-standard.yaml carries rule write-time-enforcement citing the new Decision, with the row-local
  set, the two-part cross-row test and its conformant cases, and design_time_walk step 7 points at it.
- tests/checks/contracts/test_write_time_enforcement_decision.py passes, and was red on the pre-change tree.
- The full validation tier passes (decision size, index freshness, entry conformance, supersession annotations, data-model standard).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The guard test for the rule, the Decision, its coverage owners and the Decision 81 annotation.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_write_time_enforcement_decision.py::test_write_time_enforcement_rule_declared
    tests/checks/contracts/test_write_time_enforcement_decision.py::test_decision_entry_and_victim_annotation -q
  expected: 'Exit 0, 2 passed. Red before: the module does not exist on the pre-change tree.'
  fix_if: A failing assertion names the missing rule text, coverage owner or annotation -- fix the document, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: write-time-enforcement-decision-declared
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The decision-corpus gates this entry trips (size cap, entry conformance, supersession annotation, index freshness) plus the data-model standard evaluator.
  command: >-
    bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as a;from
    scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as b;from
    scripts.checks.decisions.validate_supersession_annotations import validate_supersession_annotations as c;from
    scripts.checks.decisions.validate_decisions_index_freshness import validate_decisions_index_freshness as d;from
    scripts.checks.contracts.validate_data_model_standard import validate_data_model_standard as e;f=[];a(f);b(f);c(f);d(f);e(f,changed_files=['docs/contracts/data-modeling-standard.yaml']);print(f);assert
    not f;print('DECISION_GATES_OK')"
  expected: Exit 0, an empty failure list and the success marker printed.
  fix_if: >-
    Size -> tighten the entry, moving detail to the data-modeling rule; conformance -> fix the envelope or markers;
    supersession -> add or fix the Decision 81 annotation; index -> rerun scripts.decisions_index --write.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Every called gate already runs standing in scripts.validate; the size and conformance gates are diff-relative to
    origin/main, so replay against the merged tree has no new entry to examine.
- step: 3
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: docs/contracts/data-modeling-standard.yaml
  behavior: Rule write-time-enforcement exists, cites its Decision, states the row-local set and the two-part cross-row test; the walk points at it.
  verification_step: 1
  test_selector: tests/checks/contracts/test_write_time_enforcement_decision.py::test_write_time_enforcement_rule_declared
  red_green_expectation: red before (module absent, rule absent), green after
- source: docs/DECISIONS.md
  behavior: The Decision exists with envelope, amends 81, coverage owners and reversal conditions; Decision 81 carries the dated annotation.
  verification_step: 1
  test_selector: tests/checks/contracts/test_write_time_enforcement_decision.py::test_decision_entry_and_victim_annotation
  red_green_expectation: red before (module absent, entry absent), green after
- source: docs/decisions-index.json
  behavior: Regenerated index matches DECISIONS.md.
  verification_step: 2
  command: bin/venv-python -m scripts.decisions_index --check
  red_green_expectation: red before the regeneration (the new entry is missing from the index), green after
constraints:
