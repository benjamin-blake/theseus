- The Decision stays <= 6,144 bytes (Decision 167 cl.3); operational detail lives in the data-modeling rule.
- Annotate Decision 81 only by an appended dated line (Decision 177), never a mid-body edit.
- No new standing prose-architecture doc (Decision 86).
- No rescue agents or workaround loops (Decision 55).
