    invites the re-litigation Decision 87 exists to prevent. (The scd2 grain fact is still true and
    still worth recording -- it just answers a question nobody asked.)
    CLAUSE 5 IS NOT UNTOUCHED. Its verb-RBAC PRINCIPLE is a writer concern and survives -- do not fold
    the principle into clause 4 -- but the grant itself names `insert_revision`, whose target table
    this amendment retires. Re-point that one verb at the critique-append verb on the single plans
    table, in the same edit, and say so; leaving clause 5 granting a verb against a retired table is
