d_recommendations: []`). Once the ONE plans table holds human plans as well as executor ones, `rec_id` stops identifying a row, so the business key generalizes and T4.5's builder must not assume `rec_id` suffices. Write the NOTE, not the design: do NOT design the replacement key here -- that is T4.5's own data-model work (grain first, then merge key, per docs/contracts/data-modeling-standard.yaml). One T4.5 tracked field must carry the merge-key/business-key vocabulary, `rec_id` and a generalization token together; the same sentence parked on T4.6, or the three tokens split across name/intent/decomposition_hints, instructs nobody. VP step 3's business-key leg asserts it. This closes acceptance criterion 6, which until this round was bound by an acceptance criterion and a constraint with NO execution instruction and NO assertion anywhere."
