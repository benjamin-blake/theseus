schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-two-plane-roadmap-encoding"
intent: >-
  Encode the operator's Two-Plane Executor design into the platform roadmap; amend Decision 87 to
  break the plan-residency circularity the design exposes AND to collapse its proposed two-table
  plans split onto the ONE plans table that already exists; and complete decision-entry.yaml's
  routing table with the missing work-item row, so a roadmap entry can carry a rec id instead of a
  paragraph.
  The design stays in its hosted artifact (Decision 86). This plan selects NO substrate -- the
  decision_scout spike does that, after this encoding, and this is what gives it a properly-specified
  candidate to test.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-two-plane-roadmap-encoding.yaml
phase: >-
  Platform T4 (executor). Roadmap-and-governance precursor to T4.1/T4.2 and to the layer-2 substrate
  spike, which this plan gives an owner and sequences after itself.

fallback_reevaluation:
  reevaluated_on: "2026-08-18"
  substrate_status: >-
    CD.27's layer-2 incumbent remains the incumbent. This plan records the two-plane design as a
    CANDIDATE and selects nothing. The decision_scout spike -- named as the resolving instrument by
    CD.27's own ESB-04, ESB-06 and ESB-01 preconditions -- has not run.
  verdict: continue_on_current_substrate
  basis: >-
    An earlier draft recorded obligation_lapsed while also retiring the spike. That was doubly wrong:
    the lapse_condition fires only "if wave 5's Q5 spike pins a layer-2 substrate", so the claim
    rested on a trigger whose instrument the same plan deleted, and CD.27 would have become formally
    unratifiable because every declared precondition requires discharge. The spike is kept and owned.
    Until it runs, the incumbent stands and no obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The encoding. Records the two-plane design as a CANDIDATE (no selection anywhere); gives the
      layer-2 spike an owning tier item sequenced before T4.2; adds the MVP-critical items the design
      needs with reverse dependency edges; routes the design's open register onto exit_criteria; and
      sweeps the stale-substrate class across every sibling site in lifecycle-tracked fields. Also
      amends T4.5, T4.6 and T4.7, whose LIFECYCLE-TRACKED FIELDS restate the Decision 87 clauses this
      plan corrects -- round 2 amended the Decision and left the items contradicting it, and T4.5
      additionally names two tables that do not exist, so its intent is re-pointed at EXTENDING the one
      live plans table rather than building new entities. The consolidation reaches further than the two
      intents: verified on origin/main, `ops_plans` also survives in T4.6's exit_criteria AND
      decomposition_hints and in T4.7's exit_criteria -- an item this plan named nowhere before round 4. Line budget: 8,616 lines of 10,000 on origin/main -- 1,384 lines of
      headroom, which this plan's roadmap edits consume; re-measure after any rebase.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      AMEND DECISION 87, SCOPED TO RESIDENCY. Clause 2 times the git-to-warehouse flip to the
      autonomous producer's existence; the producer cannot function until its plans are
      warehouse-readable, so residency and producer are circular. The amendment makes warehouse
      RESIDENCY of executor plans a prerequisite for T4.2 -- and explicitly leaves the AUTHORITY flip
      for the human PLAN-*.yaml surface timed to T4.6. Round 2 conflated the two; a wholesale
      inversion would supersede Decision 85's git-authoritative clause pre-producer and break diff
      review of human plans for no gain. Executor plans are born warehouse-native and never had a git
      life, so there is nothing to flip for them.
      ALSO AMEND CLAUSE 4, SCOPED TO THE PLANS TABLE: clause 4 splits plan state across `ops_plans`
      and `ops_plan_revisions`, NEITHER OF WHICH EXISTS (verified: absent from
      config/lambda/ducklake/field_semantics.yaml's ops_tables, absent from
      docs/contracts/storage-substrate.yaml, referenced by zero lines of code). The live table is
      `ops_execution_plans`, which already carries plan_text, steps, revision, status and
      critique_history. Per the operator's ruling there is ONE plans table: clause 4 is amended to
      name a single plans table, the two-table split is retired as retired-before-built, and the
      surviving NAME IS DECIDED -- it is `ops_execution_plans`. The operator preferred `ops_plans` on
      the merits and subordinated that preference to the tiebreaker "whatever is easiest to
      standardise to is the correct answer"; measured at 469e19d, `ops_execution_plans` has 278 matching
      lines across 80 files, 32 of them load-bearing, and is the only name with any
      enforcement surface (terraform, field_semantics, .importlinter, the verification and data-quality registries, the portal and sync modules, 12
      test modules), while `ops_plans` has 30 prose-only lines across 8
      files, none load-bearing, and appears in no schema, terraform, code, config or test
      file. THE RETIREMENT RATIONALE MUST NAME THE RIGHT
      TARGET: `ops_plan_revisions` was never a history table, so "SCD2 already gives per-revision
      history" argues past it. Clause 4 calls it "machine-actionable revision directives (the
      imperative: change X -> Y), authored by the critique agent for planning-agent consumption", its
      verb is `insert_revision`, and T4.6's own intent names its consumer as "plan_agent reads its
      open-revision inbox" -- a critic-authored DIRECTIVE INBOX. The consolidation still holds, but
      because `critique_history` on the single plan row is the directive's home under the
      critic/gate authorship boundary this plan installs. An amended Decision carrying a visibly wrong
      rationale invites exactly the re-litigation Decision 87 exists to prevent.
      CLAUSE 5 IS THEREFORE NOT UNTOUCHED, as earlier rounds asserted: it grants critique personas
      `insert_revision`, a verb whose target table this amendment retires. Clause 5's verb-RBAC PRINCIPLE
      (writer-layer role scoping) survives intact, but the verb itself is re-pointed at the
      critique-append verb on the single plans table.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      COMPLETE THE ROUTING TABLE rather than add a second router. significance.routing already carries
      four rows deciding where content goes -- numbered_decision, cd_state_flip, operational_fact,
      field_semantics -- and operational_fact already routes to "a recommendation via file_rec, or a
      tier_item progress_note". The gap is a row for durable sequencing work. Round 2 proposed a
      standalone contract, which cannot land: the `none_grandfathered` evaluator kind no longer
      exists, so every new depth-1 Class D contract needs a RESOLVING evaluator with no debt-record
      escape hatch, and no in-scope surface could serve as one -- declaring a check would have been a
      second new mechanism. Extending this file inherits its working evaluator
      (validate_decision_entry_conformance) and removes the two-routers contradiction in the same
      edit. NOTE THE ATTRIBUTION: Decision 168 clause 3 PERMITTED `absent -> none_grandfathered` on
      baseline-present files; the kind was RETIRED by rec-3059 wave 2 on 2026-08-16
      (PLAN-class-d-enforcers-wave-2), recorded in docs/contracts/contract-population.yaml's
      2026-08-16 amendment_log entry and retirement_notes.evaluator_none_grandfathered. Editing this
      file also OBLIGES a new `amendment_log[]` entry: decision-entry.yaml is Class D (see its
      `contract:` block) with an existing amendment_log at :34, and contract-population.yaml's
      change_detection.amendment_log rule fails validate_contract_drift when a Class D file's
      canonical dump changes with no new entry.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate. Amending Decision 87 stales the committed index and
      validate_decisions_index_freshness fails on drift. Mechanical consequence of the amendment, not
      a separate change.

bundled_recommendations: []
closes_criteria: []
implementation_declared: true

infrastructure_dependencies:
  - >-
    Ops-portal reachability for every recommendation filing in the execution steps -- the out-of-file
    repairs, the dossier entries routed to recs, and the out-of-scope four-rows sites. Referenced by
    NAME, not by step number: this plan adds steps, and a numeric range stales on the next edit.
    Portal calls, not file edits -- which is why single-file scope never excused parking out-of-file
    repairs in an unread register. A write that cannot complete FAILS LOUD; there is no offline
    outbox, so re-file after restoring connectivity rather than deferring the reference.

acceptance_criteria:
  - "Decision 87's amendment scopes the inversion to RESIDENCY and states that the AUTHORITY flip for the human planning surface stays timed to T4.6."
  - "T4.5 and T4.6's own intents are amended to match -- round 2 amended the Decision and left the items restating the superseded clause."
  - "The one-plans-table consolidation reaches every LIFECYCLE-TRACKED field that carries the retired split, not just the two intents: T4.6's exit_criteria and decomposition_hints and T4.7's exit_criteria included. The out-of-scope tail (docs/DECISIONS.md :1874/:1876, docs/contracts/exit-criteria-ledger.yaml:46) is filed as a rec referenced by id, never fixed inline."
  - "Clause 4's retirement rationale names the right target: ops_plan_revisions was a critic-authored DIRECTIVE INBOX, not a history table, and the consolidation holds because critique_history is the directive home -- not because SCD2 supplies per-revision history."
  - "Clause 5's insert_revision grant is re-pointed at the critique-append verb on the single plans table; the plan no longer asserts clause 5 is untouched by the consolidation."
  - "T4.5 carries the business-key generalization: the live table's merge_key is rec_id alone and human plans have no rec_id, so its builder is told not to assume rec_id suffices as the business key."
  - "decision-entry.yaml's significance.routing gains a work-item row, and routing_rule's QUESTION (3) row enumeration is extended to include work_item -- keeping THREE questions, so the question-counts at :403, :406 and :412 do not stale."
  - "The routing row states the migration direction: recommendations are the destination form, the roadmap is the bootstrap, and the row names what the roadmap uniquely provides TODAY so the boundary moves as recs gain those capabilities."
  - "The routing table resolves 'deliberate deferral with a reason' -- round 2's three buckets could not, while the plan's own acceptance criteria required it."
  - "No roadmap field asserts a selected layer-2 substrate."
  - "A tier item owns the layer-2 spike, and CD.27's precondition text names that item's id, so ESB-04 / ESB-06 / ESB-01 can discharge against something that exists."
  - "The spike's exit criteria require a workspace-mutating leg and an unstubbed dispatch credential on the candidate arm."
  - "Lifecycle-tracked T4 fields carry CD.27's substrate-neutral P1/P2/P3 property language; candidate-specific mechanism is confined to the candidate decision body."
  - "The stale-substrate sweep detects every declared site, including the 'Durable Lambdas' phrasing and the name and intent fields, not only exit_criteria."
  - "The verb-RBAC obligation names its carrying item and lands as an exit criterion; a content pin is the MVP-side guarantee and the verb split routes to T4.5/T4.6."
  - "The read verb's spec requires pinning a writer-minted id or content hash, because merge_key is rec_id alone and a re-dispatched writer can emit the same revision twice."
  - "The dossier's eight 'Also unspecified' entries each resolve to a tier item, a rec id, or a recorded deferral."
  - "Every GOV/MECH/DATA/OPS identifier resolves to a lifecycle-tracked field, not intent prose."
  - "Newly filed rec ids are referenced from the roadmap -- asserted against origin/main's set, not against a non-empty count."
  - "A merge-node diff-path guard covers .github/workflows/** and the Decision 117 boundary patterns."
  - "The roadmap stays under the 10,000-line ceiling."
  - "Decision 87 clause 4 names exactly ONE plans table, `ops_execution_plans`, and the retired name is swept out of the WHOLE entry rather than clause 4 alone -- clause 3's read-projection sentence at :4581, clause 4's bullet at :4583, clause 6's grain sentence at :4590 and the Rationale at :4593, each RE-POINTED rather than deleted. The two-table split (a separate plans table plus ops_plan_revisions) is recorded as retired-before-built, with no migration and nothing to delete because neither table was ever created, and the retired token itself is not written back into the entry."
  - "T4.5's intent is re-pointed at EXTENDING the one live plans table; it no longer instructs a builder to create ops_plans and ops_plan_revisions as new entities."
  - "The plans-table NAME is DECIDED and bound: the single plans table is `ops_execution_plans`, and the prevalence measurement that decided it (278 matching lines across 80 files, 32 of them load-bearing, the implemented name and the only one carrying terraform, field_semantics, .importlinter, registry and 12-test-module enforcement, against 30 prose-only lines across 8 files for the REJECTED alternative name, none load-bearing) is recorded as the rationale, phrased WITHOUT writing the retired token back into the Decision 87 entry, which VP step 2's absence leg forbids. No surface leaves the name open, and the refuted empty-table `a rename is free today` argument appears nowhere."
  - "The encoding states that the warehouse row is the SOLE plan artifact -- the design's stage-04 S3 plan document is recorded as considered-and-rejected, not transcribed. The plan_s3_uri / plan-document-to-S3 vocabulary ALREADY RESIDENT in the roadmap (CD.27 detail, T4.1 intent, T4.2 intent) is re-pointed as considered-and-rejected in place; refraining from importing it is not sufficient. BOTH HALVES of each carrier field are re-pointed: the state machine carries identifiers only and no LLM-authored payload crosses it, so T4.1's `plan_summary` and T4.2's `plan summary` are re-pointed with payload-specific wording alongside the URI half."
  - "The encoding states that a critique verdict is written by the critic or the gate, never by the critiqued persona, and that the content pin's hash is scoped to the plan body EXCLUDING critique_history."
  - "The new work_item routing row carries the literal string `Never a numbered Decision`, so significance.value: work_item cannot be claimed on a numbered Decision entry."
  - "Every routing-COUNT statement inside decision-entry.yaml is corrected when the fifth row lands -- in BOTH directions: the four `four rows` / `four keys` undercounts at :364, :377, :382 and :408 AND :387's `for symmetry with the other three`, which a `four` search never reaches. Each out-of-scope site (AGENTS.md :197/:201, the Decision 150 body at :1164 and :1171, Decision 167's Problem line at :220 and clause 2 at :224, the planning skill at :376 and :382) is filed as a rec referenced by id."
  - "The three design items that carry no open-register identifier -- the read-path Neon cold-resume retry posture, the plans-table NAME ruling (`ops_execution_plans`), and the critique-authorship boundary with its critique_history-excluding content pin -- each land in a TIER-ITEM EXIT CRITERION, and the critique-authorship one in a SINGLE exit criterion, so neither the GOV/MECH/DATA/OPS routing step, nor a token split across criteria, nor the mandated candidate-decision write-up can silently discharge them. Stating them in the candidate decision as well is required elsewhere and is NOT sufficient here: VP step 10's design corpus is exit criteria only, precisely because the execution steps mandate this vocabulary into the candidate decision's detail and a CD detail is one unsplit blob."
  - "docs/contracts/decision-entry.yaml gains a new amendment_log[] entry in the same edit that changes any other top-level key."
  - "Every hermetic verification command has a RECORDED per-assertion fault-injection result -- origin/main (waived only for the declared regression guards), subject-removed fixture, decoy fixture."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier. Schema, dependency graph, contract conformance, decisions index and placement all gate here.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      A stale docs/decisions-index.json fails validate_decisions_index_freshness with a regenerate
      hint. A timeout is timeout_disposition blocked: resume the named check and rerun from the start.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      THE AMENDMENT IS RESIDENCY-SCOPED, CLAUSE 4 IS CONSOLIDATED, AND THE PLANS-TABLE NAME IS SWEPT INSIDE THE
      DECISION ITSELF. Round 2 asserted markers already present in Decision 87 (sixteen [Amendment markers exist, and
      T4.5 already appears in Related), so two of its four legs were dead. This asserts only what is genuinely new,
      and asserts the SCOPE. The AUTHORITY leg is paragraph-scoped on purpose: the bare word authority already occurs
      in Decision 87 on origin/main, so authority and T4.6 must co-occur in one paragraph or the leg proves nothing.
      The next three legs are the clause-4 consolidation, which round 3 bound through PROSE ONLY -- ops_plans,
      ops_plan_revisions, clause 4, retired-before-built and critique_history appeared ZERO times in the whole
      verification_plan, which is the exact shape that failed three consecutive rounds. The ops_plan_revisions leg is
      proximity-scoped at 200 chars for the same reason step 6's is: retirement framing dropped in the Rationale does
      not retire a clause-4 bullet 400 chars away, and a fixture proved it did not. THE LAST FOUR LEGS ARE NEW THIS
      ROUND, and they exist because everything above is FRAMING -- round 5 asserted the amendment's vocabulary and
      never once asserted its substance. (i) THE HEADLINE RULING, that the single plans table is ops_execution_plans,
      was machine-checked in the ROADMAP by step 3's two-sided sweep and NOWHERE in docs/DECISIONS.md: an
      implementation could amend clause 4 perfectly, leave clauses 3 and 6 naming the table the same entry had just
      retired, never write ops_execution_plans into Decision 87 at all, and stay green. That is round 2's defect --
      amend the Decision, leave the restatements -- reproduced two clauses over, INSIDE the Decision. So the sweep is
      two-sided here exactly as it is in step 3. Absence half: \bops_plans\b, a word-boundary regex that does NOT
      match ops_execution_plans, must be gone from the entry, and the message reports the docs/DECISIONS.md line
      number of every survivor. Presence half: ops_execution_plans must appear in the entry, so a sweep that DELETES
      the name instead of re-pointing it cannot green the leg. Both halves are ENTRY-SCOPED, not file-scoped, and that
      is fault-injected rather than asserted: Decision 136 carries bare ops_plans at :1874/:1876 which this plan files
      as a rec rather than edits, the pass fixture keeps them and the absence half stays green, and the
      elsewhere-decoy plants ops_execution_plans in Decision 136 alone and the presence half stays red. (ii) THE
      RETIREMENT RATIONALE leg. ops_plan_revisions was a critic-authored DIRECTIVE INBOX, not a history table, so an
      amendment reasoned as "SCD2 already gives per-revision history" is visibly wrong and invites the re-litigation
      Decision 87 exists to prevent. critique_history must therefore appear within 600 chars of the
      retired-before-built framing -- proximity-scoped, because the right word parked in the Problem paragraph is not
      the retirement's reason. (iii) THE CLAUSE-5 leg. Clause 5 grants critique personas insert_revision, a verb whose
      target table this amendment retires, and insert_revision appeared ZERO times in the whole verification_plan
      before this round. Every insert_revision occurrence in the entry must sit within 300 chars of retirement or
      re-point framing, so leaving clause 5 bare fails even when clause 4 is perfect.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 87:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 87 missing';
      b=m.group(0); ln=lambda q: t.count(chr(10), 0, m.start())+b.count(chr(10), 0, q)+1; assert
      re.search(r'residenc', b, re.I), 'the amendment does not scope the inversion to residency'; assert
      re.search(r'prerequisite', b, re.I), 'the amendment does not state the prerequisite'; assert [p for p in
      re.split(r'\n\s*\n', b) if re.search(r'authority', p, re.I) and re.search(r'T4\.6', p)], 'no single paragraph
      states that the AUTHORITY flip stays timed to T4.6 -- the bare word authority is already present on origin/main,
      so the two must co-occur'; assert re.search(r'circular', b, re.I), 'the amendment does not name the
      circularity'; assert re.search(r'retired-before-built|retired\s+before\s+built', b, re.I), 'clause 4 carries no
      retired-before-built framing -- the two-table split was not retired'; assert
      re.search(r'(single|one)\s+plans\s+table', b, re.I), 'clause 4 does not name a SINGLE plans table';
      unret=[m.start() for m in re.finditer(r'ops_plan_revisions', b) if not re.search(r'(retired|retirement|no
      longer|superseded|consolidat|single plans table|one plans table)', b[max(0, m.start()-200):m.end()+200], re.I)];
      assert not unret, f'Decision 87 still names ops_plan_revisions at {unret} with no retirement framing within 200
      chars -- clause 4 still instructs a two-table build'; bare=sorted(ln(x.start()) for x in
      re.finditer(r'\bops_plans\b', b)); assert not bare, f'the retired name ops_plans still stands INSIDE the
      Decision 87 entry at docs/DECISIONS.md lines {bare} -- the amendment names ONE plans table and the operator
      ruled it is ops_execution_plans, so EVERY in-entry site is re-pointed, not just clause 4 (the four carried on
      origin/main are clause 3 read-projection :4581, clause 4 bullet :4583, clause 6 grain :4590, Rationale :4593)';
      assert 'ops_execution_plans' in b, 'the Decision 87 entry names NO plans table at all -- ops_plans was swept out
      of the entry but ops_execution_plans was never written in, so the sweep DELETED the name instead of re-pointing
      it'; rbb=[x for x in re.finditer(r'retired-before-built|retired\s+before\s+built', b, re.I)]; assert
      any(re.search(r'critique_history', b[max(0, x.start()-600):x.end()+600]) for x in rbb), 'the
      retired-before-built framing does not name critique_history within 600 chars -- ops_plan_revisions was a
      critic-authored DIRECTIVE INBOX, not a history table, so the consolidation must hold because critique_history on
      the single plan row is the directive home, NOT because SCD2 already gives per-revision history';
      unpt=sorted(ln(x.start()) for x in re.finditer(r'insert_revision', b) if not
      re.search(r'(retire|re-point|repoint|no longer|superseded|consolidat|critique-append|single plans table|one
      plans table)', b[max(0, x.start()-300):x.end()+300], re.I)); assert not unpt, f'Decision 87 still grants
      insert_revision at docs/DECISIONS.md lines {unpt} with no retirement or re-point framing within 300 chars --
      clause 5 grants a verb whose target table this amendment retires'; print('OK Decision 87 residency-scoped and
      swept onto ops_execution_plans,', len(b.encode()), 'bytes')"
    expected: >-
      Exits 0 printing `OK Decision 87 residency-scoped and swept onto ops_execution_plans,` and a byte count. On
      origin/main it exits 1 on the FIRST leg, residency absent -- verified, not assumed. Fault-injected both ways
      against /tmp fixtures: with the amendment paragraph removed it fails on residency; with a decoy carrying
      residency, prerequisite and circular but leaving authority only in the paragraph that already holds it on main,
      it fails on the authority-and-T4.6 co-occurrence leg. Clause-4 legs fault-injected on their own fixtures: with
      the clause-4 consolidation deleted it fails naming the missing retired-before-built framing; with a DECOY that
      plants retired-before-built and single plans table in the Rationale while clause 4 still carries its
      ops_plan_revisions directive bullet, it still fails, naming the offset of the unpointered mention. THE FOUR NEW
      LEGS WERE FAULT-INJECTED AND THE RESULTS ARE RECORDED HERE, not promised. Seven scratch copies of
      docs/DECISIONS.md, each an otherwise-final tree with one thing changed, run against the command above verbatim
      (only the DECISIONS.md path substituted). Measured ON-TREE first, each new leg evaluated in isolation because
      the residency leg fires before any of them: all four are RED on origin/main -- bare ops_plans at file lines
      4581, 4583, 4590 and 4593; zero occurrences of ops_execution_plans anywhere in the entry; zero
      retired-before-built sites, so no critique_history proximity; and one unframed insert_revision at :4589. (a)
      SUBJECT-REMOVED, the amendment lands but the in-entry name is never swept: exit 1, "the retired name ops_plans
      still stands INSIDE the Decision 87 entry at docs/DECISIONS.md lines [4581, 4583, 4590, 4593]". (b) WRONG-LEG
      DECOY, only the clause-4 bullet re-pointed with clause 3, clause 6 and the Rationale left bare: exit 1, naming
      exactly those three and no others -- "lines [4581, 4590, 4593]". (c) ELSEWHERE DECOY, ops_execution_plans
      planted in Decision 136 but never written into Decision 87: exit 1 on the PRESENCE half, "the Decision 87 entry
      names NO plans table at all" -- proving both halves read the Decision 87 block and not the whole file. (d)
      DELETE-NOT-REPOINT DECOY, ops_plans removed from the entry but ops_execution_plans never introduced: the absence
      half passes and the PRESENCE half fails, exit 1, same message. (e) SCD2-RATIONALE DECOY, the amendment written
      with the wrong "SCD2 already gives per-revision history" reason: exit 1, "the retired-before-built framing does
      not name critique_history within 600 chars". (f) FAR-critique_history DECOY, critique_history present in the
      entry but parked in the Problem paragraph outside the window: exit 1, same message -- the leg is
      proximity-scoped, not presence-scoped. (g) CLAUSE-5-UNTOUCHED DECOY, everything else lands and clause 5 still
      grants the verb bare: exit 1, "Decision 87 still grants insert_revision at docs/DECISIONS.md lines [4589] with
      no retirement or re-point framing within 300 chars". (h) PASS fixture, fully amended and swept: exit 0. The
      seven pre-existing legs are held constant and GREEN across every one of (a) through (h) -- re-run alone as a
      control on each fixture -- so each result isolates a NEW leg rather than being masked by an existing leg firing
      first.
    fix_if: >-
      If the amendment inverts wholesale, human PLAN-*.yaml lose diff review for nothing. Executor plans are born
      warehouse-native; there is nothing to flip for them. Put the authority sentence and T4.6 in the same paragraph
      -- the leg is paragraph-scoped because the word alone is already there. If the ABSENCE half fails, the sweep
      stopped at clause 4: re-point every surviving in-entry site -- clause 3's read-projection sentence at :4581,
      clause 4's bullet at :4583, clause 6's grain sentence at :4590 and the Rationale at :4593 -- at
      `ops_execution_plans`. Do not reintroduce an open-naming pointer, the name is ruled, and do not write the
      retired name back into the entry even to say it is retired: describe the retired split as a separate plans table
      plus `ops_plan_revisions`, which the retirement-framing leg already covers. If the PRESENCE half fails, the
      entry was emptied rather than re-pointed: a Decision that told a builder to construct `ops_plans` must now tell
      that builder to EXTEND `ops_execution_plans`, and saying nothing is not the same as saying that. If the
      critique_history leg fails, the retirement rationale is aimed at the wrong target -- `ops_plan_revisions` was a
      critic-authored DIRECTIVE INBOX, so write that `critique_history` on the single plan row IS the directive's
      home, next to the retired-before-built framing rather than elsewhere in the entry; the SCD2 grain fact may stay
      as a supporting fact but is not the reason. If the insert_revision leg fails, clause 5 still grants a verb
      against a retired table: re-point it at the critique-append verb on the single plans table in the same edit.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one Decision's amendment text; graduating it pins one entry's wording forever.
  - step: 3
    phase: pre-deploy
    action: >-
