e critique-append verb on the single plans table. Clause 5's verb-RBAC PRINCIPLE (writer-layer role scoping, a writer concern rather than a schema one) survives and is not folded into clause 4 -- but the plan no longer claims clause 5 is untouched, because it is not. Name the single plans table `ops_execution_plans` -- the surviving NAME is RULED, not open -- and carry the prevalence rationale with it (278 matching lines across 80 files, 32 of them load-bearing, the implemented name and the only one with an enforcement surface, against 30 prose-only lines across 8 files for the REJECTED alternative name, none load-bearing) -- written into the entry WITHOUT the retired token itself, because VP step 2's absence leg fails on any bare occurrence inside the block. Do not write `name TBD`, an open-naming pointer, or the refuted empty-table argument. The ruling adds no files to the four-file scope: the table already exists."
