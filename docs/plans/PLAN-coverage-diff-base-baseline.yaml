execution_steps:
  - >-
    scripts/checks/_common.py - add push_context_base() exactly as specified in its scope
    row: returns a base ONLY in push context (GITHUB_EVENT_NAME == "push", OR current branch
    == "main" AND merge-base(origin/main, HEAD) == HEAD), preferring GITHUB_EVENT_BEFORE when
    it names a non-zero locally-present commit, else HEAD~1; returns None with a loud printed
    warning when HEAD~1 does not resolve. Then make get_changed_files() and
    get_status_aware_diff() each try it FIRST and fall back to their own current base
    untouched -- do not unify their bases.
  - >-
    scripts/test_coverage_checker.py - in get_changed_source_files() try
    _common.push_context_base() first (import scripts.checks._common via the already-injected
    ROOT sys.path) and keep the existing merge-base-or-HEAD block as the fallback; switch
    check_per_file_coverage's --cov argument to the target file's PARENT DIRECTORY, never a
    single .py path (rec-943; see the scope row for the verified reason a file path yields no
    coverage data at all); route the per-file verdict through the baseline compare helper.
    Keep the file under 500 SLOC.
  - >-
    config/sloc_budgets.yaml - register tests/test_checks_registry.py at its post-change SLOC
    with an inline "# raise-approved: dec-NNN tests for _common.push_context_base() must live
    in this file: the coverage checker pins _common.py's mirror home here via
    _CHECKS_REGISTRY_MECHANISM_FILES, and decomposing would require editing map_source_to_test
    in the same PR that repairs the coverage checker" marker, citing the carrying Decision.
    Verify validate_sloc_budget_raises accepts it (the marker must name a real "## Decision
    NNN:" header, so add the Decision entry first). SEQUENCING: the registered value is the
    file's POST-change SLOC, which is not known until the tests are written -- so run this
    step AFTER the test-authoring step, not before, and recount with the gate's own rule
    (non-blank, non-comment lines) rather than reusing the 497 planning-time figure.
  - >-
    Create scripts/checks/misc/coverage_baseline.py (load + compare + the
    validate_coverage_baseline_edits guard as specified in scope) and
    config/coverage_baseline.yaml; register the guard in scripts/checks/registry.py
    (pre_sequence adjacent to validate_sloc_budget_raises; full_sequence immediately after
    validate_test_coverage) and add the facade re-export line in scripts/validate.py.
  - >-
    scripts/checks/misc/validate_test_coverage.py - baseline-aware gate semantics: entry
    present -> fail iff measured < entry; absent -> fail iff measured < 100.
  - >-
    pyproject.toml - extend [tool.coverage.report] with exclude_also (NOT exclude_lines --
    exclude_also appends to coverage.py's built-in pragma default instead of replacing it)
    carrying the canonical __main__-guard pattern.
  - >-
    .github/workflows/ci.yml - fetch-depth: 2 on main-validate's actions/checkout step.
  - >-
    Seed config/coverage_baseline.yaml: measure (post-exclude_also, parent-directory) each file
    named in the scope entry's roster plus every source file in this plan's own diff; for
    each result < 100.0, record the floored-to-1-decimal value with the grandfather
    marker; files measuring 100 are omitted. Files whose mapped tests still yield no data
    after the rec-943 fix are recorded at their measured value, never guessed.
  - >-
    Close the known-unknowns tail before sealing the roster: sweep
    "grep -rl spec_from_file_location tests/" (34 files at planning time), map each back to its source
    via map_source_to_test, and measure those too -- the rec-943 fix makes this whole set
    newly measurable, so any sub-100 member would otherwise surface as a surprise red on a
    later merge rather than as a seeded, cited roster entry. Report the swept count and any
    additions in the completion report.
  - >-
    Write the tests listed in scope (tests/test_checks_registry.py additions,
    tests/test_test_coverage_checker.py, tests/checks/misc/test_coverage_baseline.py,
    tests/checks/misc/test_validate_test_coverage.py extensions). Every new test file
    stays under 500 SLOC (Decision 128/130).
  - >-
    docs/DECISIONS.md - append the carrying Decision (re-check next free number; drafted
    as 158): (1) class fix - push-context base selection centralised in
    _common.push_context_base(), which returns a base ONLY in push context and None
    otherwise, so each of the three consumers keeps its own existing base on the None path
    (get_changed_files() still diffs origin/main directly; the other two keep
    merge-base-or-HEAD). Push context is GITHUB_EVENT_NAME == "push" OR (current branch ==
    "main" AND merge-base(origin/main, HEAD) == HEAD); the branch-name conjunct is required,
    because merge-base == HEAD alone also matches every fresh harness session branch before
    its first commit. In push context the base is GITHUB_EVENT_BEFORE when it names a
    non-zero locally-present commit, else HEAD~1, and None with a loud warning if HEAD~1
    does not resolve. main-validate checks out fetch-depth 2 (squash convention, Decision
    76). A MEASUREMENT CORRECTION, not a relaxation (Decision 82 framing) - the diff-aware
    full-tier layer previously no-oped on main. Decision 135 pt 3's "contract unchanged"
    holds for all branch/PR callers; get_changed_files() does newly change behaviour ON main
    in push context, which is the correction itself. (2) coverage baseline -
    config/coverage_baseline.yaml is a one-time grandfather roster (Decision 130 style);
    changed files with an entry fail iff measured < entry, unbaselined files keep the 100%
    standard - narrowing Decision 48's V2 row by forward reference (100% remains the
    standard; baselined files are bounded grandfathered debt with paydown tracked by
    rec-2902 + the paydown rec). (3) tamper guard (Decision 128 mirror) -
    validate_coverage_baseline_edits fails lowering/new-sub-100 registration without an
    inline "# baseline-lowered: dec-NNN <reason>" marker naming a real Decision header;
    raises and removals unrestricted; sanctioned new-registration path for
    newly-discovered pre-existing debt cites this Decision with a measured-at-merge-base
    reason. (4) amends Decision 124's premise by forward reference ("on main post-merge
    the merge-base diff is empty so it no-ops" is corrected; the ops_portal carve-out is
    unaffected, VP-verified). (5) records two accepted residuals: the gate stays full-tier
    only, so this arms a post-merge-only tripwire - a change merged without a compliant
    local full run can still redden main (existing two-tier design per Decision 73, now
    live rather than dormant); and a multi-commit direct push to main (admin/break-glass)
    under-selects with a HEAD~1 base, which assumes the Decision 76 squash convention.
    (6) records the single deliberate test-SLOC raise on
    tests/test_checks_registry.py with its mechanism reason (the checker pins both
    mechanism files' only mirror home to that one file) - explicitly a re-introduction of
    test SLOC debt after the rec-2709 waves retired all 24 Decision 130 grandfathers, which
    is why it carries a retirement condition below. (7) reversal / retirement conditions -
    net roster growth over any 90-day window triggers a gate-design re-audit (Decision 62
    alarm-not-gate relocation is the escalation, never silent weakening); when the roster
    empties, the baseline clauses retire and Decision 48's V2 row reads unamended; the SLOC
    raise retires by folding the _CHECKS_REGISTRY_MECHANISM_FILES mapping into a
    concern-split test package; and if CD.30's diff-line-coverage ratchet (Platform
    End-State section 6) lands it likely obsoletes the per-file-100%-plus-roster mechanism
    outright, in which case this Decision is revisited rather than extended.
  - >-
    File the coverage-debt-paydown rec via the ops portal (get_rec_write_guidance() before
    file_rec()): scope = ratcheting the seeded roster to 100 (ops_writer.py drain/compact
    ~80 stmts post-exclude, sync/ops.py ~83 stmts, plus the remaining small entries);
    cite rec-2902 as the sibling tracker. The operator's follow-on plan bundles both.
  - >-
    Execute Verification Plan - run each pre-deploy step; loop until pass; on
    unrecoverable failure stop and RCA (Decision 55). Post-deploy steps run after the
    squash-merge per the git-ops flow.
  - >-
    'Report: what was implemented, verification results, seeded baseline roster with
    measured values, the filed paydown rec id, and the recorded Decision number.'
rollback: >-
  Single-PR revert restores the prior (blind) post-merge behaviour and the unbaselined
  gate - safe because the pre-change state is the status quo. If only the baseline proves
  faulty post-merge, reverting the baseline file alone is NOT safe (reddens main on the
  next sub-100 touch); revert the full PR or fix forward per Decision 55.
