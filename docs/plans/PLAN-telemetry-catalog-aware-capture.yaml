schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-catalog-aware-capture
intent: >-
  Telemetry slice 2c (rec-4292), the step before the production flip: capture follows the catalog the deployed writer
  serves, and every telemetry read client learns where that catalog is read from one deploy output. Capture accepts
  the writer's describe only for a known catalog with its paired data path, records the catalog each tree was sent
  to, and re-sends an in-flight tree whole when the writer's catalog changes. Terraform writes the writer's catalog
  pin to an SSM parameter beside its URL; the MCP tools, the monitor, completeness, the in-session check, the preflight
  gauge and golden replay route event verbs by it. The flip (PLAN-telemetry-production-flip) is then one Terraform
  change that moves writer, capture and reads together, with no blackout and nothing for stale checkouts to fetch.
  Nothing changes behaviour here: the writer and the deploy output both read ducklake_smoke. Telemetry is the learning
  signal for recursive self-improvement (PROJECT_CONTEXT); this makes the move to production safe for sessions that
  span it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-catalog-aware-capture.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), follow-on mode; closes no exit criterion (c2 is
  PLAN-telemetry-production-flip's, on this plan's ground). Built after PLAN-telemetry-production-catalog (c1) and
  PLAN-telemetry-reader-and-smoke-twin (the telemetry reader it routes to), before PLAN-telemetry-production-flip. V3:
  two ordered PRs. PR "deploy output" adds one non-IAM terraform/personal resource (an SSM parameter, auto-applied by
  the speculative-plan pipeline); PR "catalog awareness" changes capture, read clients and golden replay and is proven
  against the live smoke writer, the shared reader and the deployed telemetry reader. No Lambda redeploy (no
  deploy-ducklake-lambdas trigger path is touched).
scope:
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR deploy output: NEW aws_ssm_parameter.ducklake_telemetry_catalog beside aws_ssm_parameter.ducklake_telemetry_writer_url:
    name /agent-platform/ducklake/telemetry_catalog, type String, value = local.ducklake_telemetry_meta_schema (the
    writer's own pin local, so the flip's local move changes the writer and this output in one apply), tags Name
    "DuckLake Telemetry Catalog" and Purpose "T2.36 read routing". A deploy output in Decision 224 cl.1's sense
    (not_configuration.deploy_output), so it takes no project-configuration row. No IAM change: the apply role's SSM
    statement covers parameter/agent-platform/*, github_ci_branch reads /agent-platform/* (ci_ssm_refresh_read) and
    PlatformDev reads /agent-platform/ducklake/* (DuckLakeEndpointDiscovery).
- file: scripts/telemetry_capture/state.py
  action: Modify
  purpose: >-
    PR catalog awareness, rule ST-5. state.json's envelope gains "catalog" (the meta_schema the persisted cursor's rows
    were sent to, as the writer's describe named it). DEFAULT_CATALOG = "ducklake_smoke". Loaded gains catalog: str =
    DEFAULT_CATALOG (an envelope without the key reads it, so no pre-existing state re-sends at this PR's merge).
    save_cursor(cursor, root, loaded, *, catalog: str = DEFAULT_CATALOG) writes it; the regression refusal is
    unchanged. Defaults keep every existing call site (tests/telemetry_capture/test_verify.py,
    tests/telemetry/test_in_session_verify_chain.py) unchanged. Stays under 500 SLOC (196 today).
- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    PR catalog awareness. (1) RN-5 (_describe) returns (protocol, catalog) and accepts describe only when
    catalog.meta_schema is one of KNOWN_CATALOGS = ("ducklake_smoke", "ducklake_telemetry") AND catalog.data_path_is_smoke
    is exactly (meta_schema == "ducklake_smoke"), beside today's caps and blob-protocol checks; anything else stays
    describe_mismatch (stopped, cursor not persisted, never a halt). No switch or config file is read for the catalog:
    capture follows the deployed writer. (2) Rule RN-9: when a valid loaded cursor's recorded catalog differs from the
    catalog describe answered, the pass counts catalog_reset and calls record_turn again with resend_tree=True, so the
    whole tree (every turn, every finalization close) is sent to the writer's catalog; a 409 on that pass halts with
    reason grain_conflict_after_catalog_reset. (3) A sent pass persists the cursor with describe's catalog; a no-rows
    pass (no describe) keeps the loaded catalog. The module and RN-5 docstrings stop naming the smoke catalog. Stays
    under 500 SLOC (356 today).
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PR catalog awareness. record_turn gains keyword resend_tree: bool = False. When true with a cursor, base is
    cursor.reset(PARSER_VERSION) and the prior set is empty (the parser_version-bump path), so every row is re-emitted
    while the four pins and the finalization cuts are kept (Decision 207: an identical re-send is a no-op, and in a new
    catalog every row is first-sight). Rows themselves are unchanged, so PARSER_VERSION does not move. Not
    Lambda-packaged (data-pipeline excludes src/turn_capture).
- file: scripts/telemetry_capture/read_route.py
  action: Create
  purpose: >-
    PR catalog awareness: the one routing helper every telemetry read client uses. KNOWN_CATALOGS as in runner.py.
    resolve_catalog(profile=None) -> str: env DUCKLAKE_TELEMETRY_CATALOG (the deploy output's override for hermetic
    tests and CI, the DUCKLAKE_READER_URL precedent), then SSM /agent-platform/ducklake/telemetry_catalog; a value
    outside KNOWN_CATALOGS or an unreadable parameter raises TelemetryCatalogUnresolved naming the source, never the
    value read. EVENT_VERBS = frozenset of src.common.ducklake_event_read_verbs.EVENT_READS (pure data, no duckdb).
    TelemetryReader(DuckLakeReader) overrides _reader_url only: env DUCKLAKE_TELEMETRY_READER_URL, then SSM
    /agent-platform/ducklake/telemetry_reader_url, then lambda:GetFunctionUrlConfig on agent-platform-ducklake-telemetry-reader;
    loud RuntimeError naming the three sources otherwise; binding() returns describe's catalog object. RoutedReader(ops,
    events, catalog): named(verb) goes to events when verb is in EVENT_VERBS, else ops; describe() is ops.describe() when
    events is ops, else ops rows that are not event verbs merged with events.describe(); binding() is events.binding()
    on the telemetry route and None on the shared route; every other attribute (current_state, latest_snapshot, query)
    delegates to ops; catalog and event_function are attributes. make_routed_reader(profile=None): ducklake_smoke routes
    events to the shared DuckLakeReader, ducklake_telemetry to TelemetryReader.
- file: scripts/telemetry_capture/__main__.py
  action: Modify
  purpose: >-
    PR catalog awareness: _run_check and _cmd_verify build read_route.make_routed_reader() when no reader_factory is
    injected (replacing make_reader); nothing else changes.
- file: scripts/telemetry_capture/verify.py
  action: Modify
  purpose: >-
    PR catalog awareness: _load gains the catalog_skip token beside parser_version_skip: when the reader carries a
    catalog (getattr(raw_reader, "catalog", None), the routed reader's) and the tree's recorded catalog differs, the
    check stops with catalog_skip, so a check never reads a tree in the catalog it was not sent to. PER_TREE_SKIPS gains
    catalog_skip. About five lines; stays under 500 SLOC (474 today).
- file: scripts/agent_sdk/mcp_server.py
  action: Modify
  purpose: >-
    PR catalog awareness: create_server's default path builds the ops reader (make_reader) and then the routed reader;
    the ops describe stays fail-loud. If resolving the catalog, building the event reader or its describe fails, the
    server serves the ops tools only (the ops describe's rows that are not event verbs), writes one loud stderr line
    naming the failure class (never a URL or value) and serves no event tool; otherwise the tool list is the routed
    reader's merged describe and an event tool calls the routed reader. build_tool_registry and the injected-reader path
    are unchanged; the docstring names both outcomes.
- file: scripts/telemetry_verify/__main__.py
  action: Modify
  purpose: >-
    PR catalog awareness: main builds read_route.make_routed_reader() when no reader is injected; run_completeness_command
    takes catalog: str | None (None reads the routed reader's catalog, else read_route.resolve_catalog()); the gate reads
    completeness.first_judged_day(catalog) and prints status=before_catalog (exit 2) for a judged day before it or a
    catalog with no first day yet, keeping status=before_v4 for a smoke day before the v4 day. The monitor path is
    unchanged.
- file: scripts/telemetry_verify/completeness.py
  action: Modify
  purpose: >-
    PR catalog awareness: NEW first_judged_day(catalog) -> str | None: ducklake_smoke reads V4_FIRST_JUDGED_DAY at call
    time (the test fixture still patches it), ducklake_telemetry reads PRODUCTION_FIRST_JUDGED_DAY = None
    (PLAN-telemetry-production-flip sets it once the flip day is known), any other catalog None. Stays far under 500
    SLOC.
- file: scripts/preflight/_common.py
  action: Modify
  purpose: >-
    PR catalog awareness: NEW seam _make_event_reader(profile=None), a lazy call of read_route.make_routed_reader, beside
    _make_reader, so every preflight test stub has one name to patch.
- file: scripts/preflight/telemetry_health.py
  action: Modify
  purpose: >-
    PR catalog awareness: check_telemetry_health's default reader is _common._make_event_reader(), so the gauge's one
    telemetry_health_count call reaches whichever reader serves the writer's catalog; the tri-state and the fail-closed
    null semantics (Decision 215) are unchanged (a catalog resolution failure reads unavailable).
- file: scripts/ducklake_smoke/lambda_telemetry_golden_gates.py
  action: Modify
  purpose: >-
    PR catalog awareness. Env gains catalog: str (live_env reads read_route.resolve_catalog(); an unresolved catalog
    stops with ReplayStop("catalog_unresolved")) and live_env builds the reader with read_route.make_routed_reader;
    _resolve_urls is unchanged. Replay.start asserts, before any register call: describe's catalog.meta_schema equals
    Env.catalog with the RN-5 pairing, else ReplayStop("writer_catalog_mismatch"); every telemetry_health_count row's
    meta_schema equals it, else ReplayStop("reader_catalog_mismatch"); and on the ducklake_telemetry route the reader's
    binding() meta_schema equals it too. The deploy-record pair becomes (the routed reader's event_function,
    agent-platform-ducklake-telemetry-writer). Output stays counts and class names only. Stays under 500 SLOC (355 today).
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    PR catalog awareness: PC-01's description says event-verb reads route by the writer's catalog deploy output
    (/agent-platform/ducklake/telemetry_catalog) through scripts/telemetry_capture/read_route.py to the shared reader
    (smoke) or the telemetry reader's own Function URL (production), a further function_url client, so no port row is
    added (Decision 212 cl.6); an amendment_log entry.
- file: tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py
  action: Create
  purpose: >-
    PR deploy output, over the real terraform/personal tree (helpers from tests/fixtures/terraform_hcl_blocks):
