schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-catalog-aware-capture
intent: >-
  Telemetry slice 2c (rec-4292), the step before the production flip: capture learns which catalog it writes, and every
  telemetry read client learns where that catalog is read, from one switch. Capture checks the writer's catalog against
  config/telemetry/capture.yaml's new catalog key and re-sends an in-flight tree whole when that catalog changes; the
  MCP tools, the monitor, completeness, the in-session check, the preflight gauge and golden replay route event verbs
  by the same key, so the flip (PLAN-telemetry-production-flip) is one config plus Terraform change and stale checkouts
  follow origin/main. Golden replay asserts the catalog it writes to and reads from. Nothing changes behaviour here: the
  key reads ducklake_smoke. Telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this
  makes the move to production safe for sessions that span it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-catalog-aware-capture.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), follow-on mode; closes no exit criterion (PLAN-telemetry-production-flip
  closes T2.36:c2 on this plan's ground). Built after PLAN-telemetry-reader-and-smoke-twin's build (the telemetry
  reader it routes to must exist) and PLAN-telemetry-production-maintenance's and before PLAN-telemetry-production-flip. V3: one PR that changes capture, read
  clients, golden replay and two workflows and is proven against the live smoke writer, the shared reader and the
  deployed telemetry reader; no terraform and no Lambda redeploy (no deploy-ducklake-lambdas trigger path is touched).
scope:
- file: config/telemetry/capture.yaml
  action: Modify
  purpose: >-
    Gains `catalog: ducklake_smoke` (rule SW-4, read from origin/main by the SW-3 order) and a comment block saying the
    key names the catalog capture expects the deployed writer to serve, that it moves only with the writer's catalog
    binding (PLAN-telemetry-production-flip changes both together), and that read clients route event verbs by it.
    `enabled: true` is untouched.
- file: scripts/telemetry_capture/switch.py
  action: Modify
  purpose: >-
    Rule SW-4. The switch document is read once per call by the existing SW-3 order (origin/main, main, working tree).
    NEW switch_catalog(repo_root) -> tuple[str | None, str]: (catalog, source); an absent key reads DEFAULT_CATALOG =
    "ducklake_smoke" (the only catalog before slice 2c), a value that is not a string matching ^[a-z_][a-z0-9_]{0,62}$
    reads None. switch_state and switch_mode keep their signatures and results (enabled and the guards are unchanged);
    the catalog is read whatever the mode, so the SW-2 smoke override checks it too. Never raises.
- file: scripts/telemetry_capture/state.py
  action: Modify
  purpose: >-
    Rule ST-5. state.json's envelope gains "catalog" (the catalog the persisted cursor's rows were sent to). Loaded
    gains catalog: str (the envelope value; an envelope without the key reads "ducklake_smoke", so no pre-existing state
    re-sends at this PR's merge). save_cursor(cursor, root, loaded, *, catalog) writes it; the regression refusal is
    unchanged. Stays under 500 SLOC (196 today).
- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    (1) run_pass reads switch.switch_catalog(repo_root) after the mode check; a None catalog ends the pass "stopped"
    with diagnostic catalog_unresolved before any state is touched (never a halt). (2) RN-5 (_describe) replaces
    `data_path_is_smoke is True` with body["catalog"]["meta_schema"] equal to the switch catalog; any other value stays
    describe_mismatch (stopped, cursor not persisted, so the next pass retries). (3) Rule RN-9: when a valid loaded
    cursor's catalog differs from the switch catalog, the pass counts catalog_reset and calls record_turn with
    resend_tree=True, so the whole tree (every turn, every finalization close) is sent to the new catalog; a 409 on that
    pass halts with reason grain_conflict_after_catalog_reset. (4) Every persisted cursor carries the switch catalog.
    The module and RN-5 docstrings stop naming the smoke catalog. Stays under 500 SLOC (356 today).
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    record_turn gains keyword resend_tree: bool = False. When true with a cursor, base is cursor.reset(PARSER_VERSION)
    and the prior set is empty (the parser_version-bump path), so every row is re-emitted while the four pins and the
    finalization cuts are kept (Decision 207: an identical re-send is a no-op, and in a new catalog every row is
    first-sight). Rows themselves are unchanged, so PARSER_VERSION does not move. Not Lambda-packaged (data-pipeline
    excludes src/turn_capture).
- file: scripts/telemetry_capture/read_route.py
  action: Create
  purpose: >-
    The one routing helper every telemetry read client uses. EVENT_VERBS = frozenset of
    src.common.ducklake_event_read_verbs.EVENT_READS (pure data, no duckdb). TelemetryReader(DuckLakeReader) overrides
    _reader_url only: env DUCKLAKE_TELEMETRY_READER_URL, then SSM /agent-platform/ducklake/telemetry_reader_url (the
    client module's _resolve_function_url_via_ssm), then lambda:GetFunctionUrlConfig on
    agent-platform-ducklake-telemetry-reader; a loud RuntimeError naming the three sources otherwise. RoutedReader(ops,
    events, catalog): named(verb) goes to events when verb is in EVENT_VERBS, else ops; describe() is ops.describe() when
    events is ops, else ops rows that are not event verbs merged with events.describe(); every other attribute
    (current_state, latest_snapshot, query) delegates to ops; event_function names the function events read through.
    make_routed_reader(profile=None, *, repo_root=REPO_ROOT): catalog from switch.switch_catalog; ducklake_smoke routes
    events to the shared DuckLakeReader, ducklake_telemetry to TelemetryReader, anything else raises naming the value.
- file: scripts/telemetry_capture/__main__.py
  action: Modify
  purpose: >-
    _run_check and _cmd_verify build read_route.make_routed_reader() when no reader_factory is injected (replacing
    make_reader); nothing else changes.
- file: scripts/agent_sdk/mcp_server.py
  action: Modify
  purpose: >-
    create_server's default reader is read_route.make_routed_reader() (replacing make_reader), so the tool list is the
    merged describe and an event tool calls the routed reader. build_tool_registry, the injected-reader path and the
    fail-loud describe are unchanged. The docstring names the routing.
- file: scripts/telemetry_verify/__main__.py
  action: Modify
  purpose: >-
    main builds read_route.make_routed_reader() when no reader is injected; main and run_completeness_command gain
    catalog: str | None (None resolves switch.switch_catalog); the completeness gate reads
    completeness.first_judged_day(catalog) and prints status=before_catalog (exit 2) for a judged day before it or a
    catalog with no first day yet. The monitor path is unchanged.
- file: scripts/telemetry_verify/completeness.py
  action: Modify
  purpose: >-
    NEW first_judged_day(catalog) -> str | None: ducklake_smoke reads V4_FIRST_JUDGED_DAY at call time (the test
    fixture still patches it), ducklake_telemetry reads PRODUCTION_FIRST_JUDGED_DAY = None (PLAN-telemetry-production-flip
    sets it once the flip day is known), any other catalog None. Stays far under 500 SLOC.
- file: scripts/preflight/telemetry_health.py
  action: Modify
  purpose: >-
    check_telemetry_health's default reader is read_route.make_routed_reader(), so the gauge's one
    telemetry_health_count call reaches whichever reader serves the switch catalog; the tri-state and the fail-closed
    null semantics (Decision 215) are unchanged.
- file: scripts/ducklake_smoke/lambda_telemetry_golden_gates.py
  action: Modify
  purpose: >-
    Env gains catalog: str (live_env reads switch.switch_catalog(ROOT); a None catalog stops with
    ReplayStop("catalog_unresolved")) and live_env builds the reader with read_route.make_routed_reader. Replay.start
    asserts describe's catalog.meta_schema equals Env.catalog, else ReplayStop("writer_catalog_mismatch"), and that every
    telemetry_health_count row's meta_schema equals it, else ReplayStop("reader_catalog_mismatch"), both before any
    register call. The deploy-record pair becomes (the routed reader's event_function,
    agent-platform-ducklake-telemetry-writer). _resolve_urls stops exporting the shared reader URL (the routed reader
    resolves its own). Output stays counts and class names only. Stays under 500 SLOC (355 today).
- file: .github/workflows/telemetry-golden-replay.yml
  action: Modify
  purpose: >-
    The URL loop's role list gains telemetry_reader (exported masked as DUCKLAKE_TELEMETRY_READER_URL; the existing
    ${role//_/-} expansion names agent-platform-ducklake-telemetry-reader), on the same line, so the step body's line
    count is unchanged.
- file: .github/workflows/telemetry-verification.yml
  action: Modify
  purpose: >-
    The URL loop gains telemetry_reader and its function name uses ${role//_/-}, on the same lines, so the step body's
    line count is unchanged; URL and host are masked as today.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    PC-01's description says event-verb reads route by config/telemetry/capture.yaml's catalog through
    scripts/telemetry_capture/read_route.py to the shared reader (smoke) or the telemetry reader's own Function URL
    (production), a further function_url client, so no port row is added (Decision 212 cl.6); an amendment_log entry.
- file: docs/contracts/project-configuration.yaml
  action: Modify
  purpose: >-
    Decision 224 cl.1 and cl.6: not_configuration gains rollout_switch, a platform-owned rollout switch read from main,
    such as config/telemetry/capture.yaml (enabled, and catalog: the catalog capture expects the deployed writer to
    serve; it moves only with the writer's catalog binding), so the new key is recorded as not user-set configuration;
    an amendment_log entry.
- file: tests/telemetry_capture/test_switch.py
  action: Modify
  purpose: >-
    NEW test_switch_catalog_follows_main_with_a_smoke_default (origin/main's value wins over the checkout, an absent key
    reads ducklake_smoke, a malformed value reads None, a read failure never raises);
    test_the_committed_switch_is_on_and_still_guarded asserts {"enabled": True, "catalog": "ducklake_smoke"}.
- file: tests/telemetry_capture/test_state.py
  action: Modify
  purpose: >-
    NEW test_state_records_the_catalog_and_reads_absent_as_smoke (round trip with catalog; a pre-existing envelope
    without the key loads as ducklake_smoke; the regression refusal is unchanged).
- file: tests/telemetry_capture/test_runner.py
  action: Modify
  purpose: >-
    The fake writer's describe carries catalog.meta_schema (parametrised); test_describe_mismatch_stops_without_halting
    is parametrised over meta_schema; NEW test_describe_catalog_must_equal_the_switch_catalog,
    test_a_catalog_change_resends_the_whole_tree_keeping_pins (every row of a finalized and continued tree is re-sent
    once, the cursor is persisted with the new catalog, a second pass sends nothing),
    test_a_conflict_after_a_catalog_reset_halts_with_its_own_reason and test_an_unresolved_catalog_stops_before_any_state.
- file: tests/telemetry_capture/test_smoke.py
  action: Modify
  purpose: >-
    The fake describe carries catalog.meta_schema ducklake_smoke.
- file: tests/telemetry_capture/test_read_route.py
  action: Create
  purpose: >-
    test_event_verbs_route_by_the_switch_catalog, test_describe_merges_ops_rows_with_the_event_readers_rows,
    test_ops_reads_always_use_the_ops_reader, test_telemetry_reader_url_resolution_order (env, SSM, API, loud failure;
    boto3 faked), test_event_verb_set_equals_the_registry and test_unknown_catalog_raises_naming_it.
- file: tests/telemetry_capture/test_main.py
  action: Modify
  purpose: >-
    NEW test_verify_builds_the_routed_reader (the default factory is read_route.make_routed_reader);
    test_verify_builds_the_default_reader_when_none_is_injected follows it.
- file: tests/hooks/test_stop_log_turn.py
  action: Modify
  purpose: >-
    The fake describe carries catalog.meta_schema ducklake_smoke (the tmp repo switch has no catalog key).
- file: tests/hooks/test_session_end_log_turn.py
  action: Modify
  purpose: >-
    The fake describe carries catalog.meta_schema ducklake_smoke.
- file: tests/turn_capture/test_record_turn.py
  action: Modify
  purpose: >-
    NEW test_resend_tree_re_emits_every_row_keeping_pins_and_cuts (with a cursor at the end of a finalized and continued
    tree, resend_tree=True re-emits exactly the rows a cursor-less full parse emits plus every finalization close, keeps
    the pins, and the next cursor equals the normal one).
- file: tests/test_agent_sdk_mcp_server.py
  action: Modify
  purpose: >-
    NEW TestCreateServer::test_default_reader_is_the_routed_reader (make_routed_reader patched; an event tool and an ops
    tool reach their own fake readers through the merged describe).
- file: tests/telemetry_verify/test_main.py
  action: Modify
  purpose: >-
    The autouse fixture pins the catalog seam to ducklake_smoke (so the committed switch never reaches these tests);
    NEW test_main_builds_the_routed_reader and test_completeness_refuses_a_day_before_the_catalogs_first_judged_day.
- file: tests/telemetry_verify/test_completeness.py
  action: Modify
  purpose: >-
    NEW test_first_judged_day_is_per_catalog.
- file: tests/session/preflight/test_telemetry_health.py
  action: Modify
  purpose: >-
    NEW test_gauge_reads_through_the_routed_reader; the existing nodes patch the routed-reader seam where they patched
    _common._make_reader.
- file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
  action: Modify
  purpose: >-
    The fakes carry the catalog in describe and in telemetry_health_count rows; NEW
    test_writer_catalog_mismatch_stops_before_any_registration, test_reader_catalog_mismatch_stops_before_any_registration
    and test_deploy_records_follow_the_routed_reader.
- file: tests/test_telemetry_golden_replay_workflow.py
  action: Modify
  purpose: >-
    NEW test_the_telemetry_reader_url_is_resolved_and_masked.
- file: tests/test_telemetry_verification_workflow.py
  action: Modify
  purpose: >-
    NEW test_the_monitor_resolves_the_telemetry_reader_url.
- file: tests/checks/contracts/test_telemetry_catalog_routing_contracts.py
  action: Create
  purpose: >-
    test_pc01_names_the_routed_event_reads and test_capture_switch_is_recorded_as_a_rollout_switch.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-production-catalog built (catalog ducklake_telemetry
  exists, T2.36:c1 met), PLAN-telemetry-reader-and-smoke-twin built and deployed
  (agent-platform-ducklake-telemetry-reader with its SSM parameter, github_ci_branch and PlatformDev URL-only invoke and
  github_ci_branch GetFunctionUrlConfig on it) and PLAN-telemetry-production-maintenance built (T2.36:c5 met).
- >-
  No terraform and no Lambda redeploy: the PR touches no deploy-ducklake-lambdas trigger path and no terraform root. The
  two workflow edits take effect on their next run (golden replay after the next deploy and daily, the monitor daily).
- >-
  Merges under the standing rule (critique PROCEED, code review PROCEED, CI green): it carries no always-ask item. One
  DuckLake deploy or apply at a time is unaffected (this PR runs neither); no merge during the org-transfer freeze window.
acceptance_criteria:
- >-
  Capture checks the writer's catalog against the switch catalog (RN-5) and, when a tree's recorded catalog differs from
  the switch, re-sends the whole tree with its pins kept (RN-9), with no halt; with the switch on ducklake_smoke nothing
  changes for live sessions.
- >-
  Every telemetry read client (MCP tools, monitor, completeness, in-session check, preflight gauge, golden replay)
  routes event verbs by the switch catalog through scripts/telemetry_capture/read_route.py, and ops reads stay on the
  shared reader.
- >-
  Golden replay stops before any registration when the writer's or the reader's catalog differs from the switch
  catalog, and passes on smoke with zero mismatches after this PR.
- >-
  Both telemetry workflows resolve and mask the telemetry reader URL, and the telemetry reader is reachable through the
  routed client from a session.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prerequisites from the production catalog, reader and smoke twin, and production maintenance plans are on main.
  command: >-
    git fetch origin main --quiet && git show origin/main:docs/ROADMAP-PLATFORM.yaml > "${TMPDIR:-/tmp}/roadmap_cac.yaml"
    && bin/venv-python -c "import os,yaml;d=yaml.safe_load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'roadmap_cac.yaml')));
    it=[i for i in d['tier_items'] if i['id']=='T2.36'][0];s={c['id']:c['status'] for c in it['exit_criteria']};print(s);
    assert s['c1']=='met' and s['c5']=='met', s;print('PREREQS_OK')" && aws ssm get-parameter --name
    /agent-platform/ducklake/telemetry_reader_url --profile agent_platform --query Parameter.Name --output text
  expected: T2.36 c1 and c5 read met on main, PREREQS_OK, then the telemetry reader's SSM parameter name.
  fix_if: Stop; this plan builds only after both prerequisite plans' post-deploy steps passed.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: The switch exposes the catalog from main with a smoke default.
  command: bin/venv-python -m pytest tests/telemetry_capture/test_switch.py::test_switch_catalog_follows_main_with_a_smoke_default -q
  expected: Exit 0. Red before because the node is absent.
  fix_if: Fix switch_catalog against rule SW-4; never relax the SW-3 read order.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-switch-catalog-follows-main
- step: 3
  phase: pre-deploy
  action: RN-5 compares the writer's catalog with the switch catalog.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner.py::test_describe_catalog_must_equal_the_switch_catalog
    tests/telemetry_capture/test_runner.py::test_an_unresolved_catalog_stops_before_any_state -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: A mismatch must stop without halting and without persisting the cursor.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-describe-checks-switch-catalog
- step: 4
  phase: pre-deploy
  action: A catalog change re-sends the whole tree, keeps the pins and records the catalog.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner.py::test_a_catalog_change_resends_the_whole_tree_keeping_pins
    tests/telemetry_capture/test_runner.py::test_a_conflict_after_a_catalog_reset_halts_with_its_own_reason
    tests/telemetry_capture/test_state.py::test_state_records_the_catalog_and_reads_absent_as_smoke
    tests/turn_capture/test_record_turn.py::test_resend_tree_re_emits_every_row_keeping_pins_and_cuts -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: Fix the reset path; a missing finalization close row means the prior set was not emptied.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-catalog-reset-resends-tree
- step: 5
  phase: pre-deploy
  action: One helper routes event verbs by the switch catalog.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_read_route.py::test_event_verbs_route_by_the_switch_catalog
    tests/telemetry_capture/test_read_route.py::test_describe_merges_ops_rows_with_the_event_readers_rows
    tests/telemetry_capture/test_read_route.py::test_ops_reads_always_use_the_ops_reader
    tests/telemetry_capture/test_read_route.py::test_telemetry_reader_url_resolution_order
    tests/telemetry_capture/test_read_route.py::test_event_verb_set_equals_the_registry
    tests/telemetry_capture/test_read_route.py::test_unknown_catalog_raises_naming_it -q
  expected: Exit 0. Red before because the module and nodes are absent.
  fix_if: Fix read_route.py; never route by a hand-written verb list.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-read-route-by-switch-catalog
- step: 6
  phase: pre-deploy
  action: Every read client builds the routed reader, and completeness judges per catalog.
  command: >-
    bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::TestCreateServer::test_default_reader_is_the_routed_reader
    tests/telemetry_capture/test_main.py::test_verify_builds_the_routed_reader
    tests/telemetry_verify/test_main.py::test_main_builds_the_routed_reader
    tests/telemetry_verify/test_main.py::test_completeness_refuses_a_day_before_the_catalogs_first_judged_day
    tests/telemetry_verify/test_completeness.py::test_first_judged_day_is_per_catalog
    tests/session/preflight/test_telemetry_health.py::test_gauge_reads_through_the_routed_reader -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: Route the client through read_route; keep the injected-reader seams unchanged.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-read-clients-use-the-route
- step: 7
  phase: pre-deploy
  action: Golden replay asserts its catalog before any registration.
  command: >-
    bin/venv-python -m pytest
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_writer_catalog_mismatch_stops_before_any_registration
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_reader_catalog_mismatch_stops_before_any_registration
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_deploy_records_follow_the_routed_reader -q
  expected: Exit 0, three passed. Red before because the nodes are absent.
  fix_if: The assertion must run before register_tenant; fix start(), never the fakes' catalog.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The module imports duckdb at module scope (importorskip, hermetic exception (iii)); the full tier runs the file and
    the registry entry telemetry-golden-replay-over-fakes already guards the module.
- step: 8
  phase: pre-deploy
  action: Both telemetry workflows resolve the telemetry reader URL, masked.
  command: >-
    bin/venv-python -m pytest tests/test_telemetry_golden_replay_workflow.py::test_the_telemetry_reader_url_is_resolved_and_masked
    tests/test_telemetry_verification_workflow.py::test_the_monitor_resolves_the_telemetry_reader_url -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: Add the role on the existing loop line; keep the masking.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-workflows-resolve-the-telemetry-reader
- step: 9
  phase: pre-deploy
  action: ports.yaml and project-configuration.yaml record the routing and the switch.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_telemetry_catalog_routing_contracts.py::test_pc01_names_the_routed_event_reads
    tests/checks/contracts/test_telemetry_catalog_routing_contracts.py::test_capture_switch_is_recorded_as_a_rollout_switch
    -q && bin/venv-python -c "from scripts.checks.contracts.validate_project_configuration import
    validate_project_configuration as v;f=[];v(f);assert not f, f;print('PROJECT_CONFIG_OK')" && bin/venv-python -c "from
    scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;f=[];v(f);assert not f,
    f;print('CONTRACTS_OK')"
  expected: The nodes pass, then PROJECT_CONFIG_OK and CONTRACTS_OK. Red before because the module is absent.
  fix_if: Fix the contract text or its amendment_log entry; never loosen a validator.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time text check of two amended contracts plus standing validators that scripts.validate already runs in both
    tiers.
- step: 10
  phase: pre-deploy
  action: Lint, the touched suites and the full tier before the PR.
  command: >-
    bin/venv-python -m ruff check . && bin/venv-python -m ruff format --check . && bin/venv-python -m pytest
    tests/telemetry_capture tests/turn_capture/test_record_turn.py tests/hooks/test_stop_log_turn.py
    tests/hooks/test_session_end_log_turn.py tests/telemetry_verify tests/session/preflight/test_telemetry_health.py
    tests/test_agent_sdk_mcp_server.py -q && bin/venv-python -m scripts.validate
  expected: ruff exit 0, the touched suites pass, then the full tier ends with "All checks passed." and exit 0.
  fix_if: Fix at root and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: >-
    Merged: in a live cloud session on main, capture still lands on smoke under the new RN-5, the in-session check
    completes through the routed reader, golden replay passes with its catalog assertion, and the routed client reaches
    the deployed telemetry reader.
  command: >-
    git fetch origin main --quiet && git checkout origin/main --quiet && TREE=$(ls -t "$HOME"/.claude/projects/*/*.jsonl
    | head -1) && bin/venv-python -m scripts.telemetry_capture status --tree "$TREE" && AWS_PROFILE=agent_platform
    bin/venv-python -m scripts.telemetry_capture verify --tree "$TREE" --no-alarms && AWS_PROFILE=agent_platform
    bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates --no-alarms --assert-zero-mismatches &&
    AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.telemetry_capture.read_route import TelemetryReader;
    v=TelemetryReader().describe();assert 'session_tree_rows' in v and 'transcript_content' not in v;print('TELEMETRY_READER_ROUTE_OK')"
  expected: >-
    status shows sent passes and no describe_mismatch or catalog_unresolved after the merge; VERIFY status=completed;
    GOLDEN_SMOKE ... skew=0 mismatches=0 and exit 0; TELEMETRY_READER_ROUTE_OK.
  fix_if: >-
    A describe_mismatch on smoke means RN-5 reads the wrong field: revert and fix before the flip. A telemetry reader
    resolution failure means its SSM parameter or PlatformDev's invoke is missing: report it to PLAN-telemetry-reader-and-smoke-twin's owner.
  hermetic: false
  graduation: not-applicable
