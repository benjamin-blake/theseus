execution_steps:
- >-
  1. Run VP step 1. Rebase onto origin/main. Read PLAN-telemetry-reader-and-smoke-twin's merged telemetry reader
  (function name, SSM parameter, describe shape) and use it verbatim.
- >-
  2. PR deploy output: add aws_ssm_parameter.ducklake_telemetry_catalog and its pin test; run VP steps 2-3 (step 3 on
  the PR's final head); merge under the standing rule; run VP step 4.
- >-
  3. PR catalog awareness. Rules: ST-5 (state envelope catalog, absent reads smoke), RN-5 (a known catalog with its
  paired data path), RN-9 (a recorded catalog that differs from describe's re-sends the whole tree through
  record_turn(resend_tree=True); a 409 then halts as grain_conflict_after_catalog_reset), RD-1 (read_route: the
  catalog from the deploy output, event verbs by it, ops reads always on the shared reader). Edit state.py,
  runner.py, record_turn.py, read_route.py (new), verify.py, the clients (capture __main__, mcp_server, telemetry_verify
  __main__, the preflight seam and gauge, the golden gates), completeness.py and ports.yaml PC-01, with every test the
  scope names. Run VP steps 5-11. Open the PR, drive it green, merge under the standing rule, then run VP steps 12-13.
- 'Execute Verification Plan: run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55).'
- 'Report: what was implemented, the verification results, and that PLAN-telemetry-production-flip can start.'
rollback: >-
  Revert the code PR: old code ignores the state's catalog key and reads through make_reader. The deploy output can stay
