constraints:
- No behaviour change in production or smoke at merge; the switch reads ducklake_smoke.
- No new Decision; the routing implements Decision B (PLAN-telemetry-reader-and-smoke-twin, the telemetry reader identity) for the read side.
- query_ops and the shared reader handler are out of scope (the "Retire query_ops raw SQL" thread owns query_ops).
- No account id, ARN, hostname, URL or secret in any file, log line or PR body (Decision 101); gate output stays counts and class names.
- No rescue agents or workaround loops (Decision 55); a grain-conflict halt is reported, never cleared blindly.
- Every file stays under 500 SLOC (Decision 128); decompose rather than raise.
