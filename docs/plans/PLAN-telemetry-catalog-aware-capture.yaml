bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-production-catalog built (catalog ducklake_telemetry,
  T2.36:c1 met) and PLAN-telemetry-reader-and-smoke-twin deployed (agent-platform-ducklake-telemetry-reader with its SSM
  URL parameter, github_ci_branch and PlatformDev URL-only invoke on it). The maintenance plan is not a prerequisite.
- >-
  PR deploy output, pre-merge: the PR's speculative plan shows exactly one create, aws_ssm_parameter.ducklake_telemetry_catalog,
  and a PASS predicted guard verdict (VP step 3); post-merge it auto-applies (non-IAM) and the parameter reads
  ducklake_smoke (VP step 4). It merges before the code PR, so no client ever runs routing code against a missing
  parameter.
- >-
  PR catalog awareness: no terraform and no Lambda redeploy (no deploy-ducklake-lambdas trigger path). Both PRs merge
  under the standing rule (critique PROCEED, code review PROCEED, CI green): neither carries an always-ask item (the
  SSM parameter is not IAM). One DuckLake deploy or apply at a time; no merge during the org-transfer freeze window.
acceptance_criteria:
- >-
  The deploy output /agent-platform/ducklake/telemetry_catalog exists, reads the writer's pin local (ducklake_smoke
  today) and is pinned to that local by a standing guard.
- >-
  Capture accepts the writer's describe only for a known catalog with its paired data path (RN-5), records the catalog
  each tree was sent to, and re-sends the whole tree with its pins kept when the writer's catalog changes (RN-9), with
  no halt; with the writer on ducklake_smoke nothing changes for live sessions.
- >-
  Every telemetry read client (MCP tools, monitor, completeness, in-session check, preflight gauge, golden replay)
  routes event verbs by the deploy output through scripts/telemetry_capture/read_route.py; ops reads stay on the shared
  reader, and the MCP server keeps its ops tools when the event route is unavailable.
- >-
  Golden replay stops before any registration when the writer's or the reader's catalog differs from the deploy
  output, and passes on smoke with zero mismatches after the merge; the golden replay and verification workflows each
  complete one run on main through the routed reader.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prerequisites are on main (c1 met, the telemetry reader's URL parameter present).
  command: >-
    git fetch origin main --quiet && git show origin/main:docs/ROADMAP-PLATFORM.yaml > "${TMPDIR:-/tmp}/roadmap_cac.yaml"
    && bin/venv-python -c "import os,yaml;d=yaml.safe_load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'roadmap_cac.yaml')));
    it=[i for i in d['tier_items'] if i['id']=='T2.36'][0];s={c['id']:c['status'] for c in it['exit_criteria']};print(s);
    assert s['c1']=='met', s;print('PREREQS_OK')" && aws ssm get-parameter --name
    /agent-platform/ducklake/telemetry_reader_url --profile agent_platform --query Parameter.Name --output text
  expected: T2.36 c1 reads met on main, PREREQS_OK, then the telemetry reader's SSM parameter name.
  fix_if: Stop; this plan builds only after the production catalog plan and the reader-and-twin plan are done.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: PR deploy output. The catalog parameter is the writer's pin local.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py::test_catalog_deploy_output_is_the_writer_pin
    tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py::test_deploy_output_guard_rejects_a_literal_value -q
  expected: Exit 0. Red before because the module is absent.
  fix_if: Fix the Terraform value; never pin a literal catalog name.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-catalog-deploy-output-follows-the-pin
- step: 3
  phase: pre-deploy
  action: >-
    PR deploy output. Before merge, the PR's speculative plan is exactly the one create. Save the "Terraform Speculative
    Plan" PR comment body for the PR's final head (mcp__github__pull_request_read get_comments) to $SPEC_PLAN_FILE and
    export PR_HEAD_SHA.
  command: >-
    test -s "$SPEC_PLAN_FILE" && test -n "$PR_HEAD_SHA" && bin/venv-python -c "import os,re;t=open(os.environ['SPEC_PLAN_FILE'],encoding='utf-8',errors='replace').read();
    assert ('PR head SHA: '+chr(96)+os.environ['PR_HEAD_SHA']+chr(96)) in t, 'not the final head comment';m=re.search(r'Plan:
    (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('1','0','0'), m and m.group(0);assert
    'Predicted guard verdict: PASS' in t, 'not auto-apply';got={a:v for a,v in re.findall(r'# (\S+) (?:will|must) be
    (created|updated in-place|destroyed|replaced|read during apply)',t) if not a.startswith('data.')};assert
    got=={'aws_ssm_parameter.ducklake_telemetry_catalog':'created'}, got;print('SPEC_PLAN_OK',m.group(0))"
  expected: Exit 0 and SPEC_PLAN_OK with 1 to add, 0 to change, 0 to destroy and no other resource address.
  fix_if: Any other address or count is a stop; explain it mechanically before merging, never merge on an unexplained plan.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: post-deploy
  action: PR deploy output applied. The parameter reads the writer's current catalog.
  command: >-
    test "$(aws ssm get-parameter --name /agent-platform/ducklake/telemetry_catalog --profile agent_platform --query
    Parameter.Value --output text)" = ducklake_smoke && echo CATALOG_OUTPUT_OK
  expected: CATALOG_OUTPUT_OK.
  fix_if: A missing parameter means the apply has not landed; read the terraform run before opening the code PR.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: PR catalog awareness. RN-5 accepts only a known catalog with its paired data path.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner_catalog.py::test_describe_accepts_only_a_known_catalog_with_its_paired_data_path
    tests/telemetry_capture/test_runner_catalog.py::test_a_mispaired_describe_stops_without_halting -q
  expected: Exit 0. Red before because the module is absent.
  fix_if: A mismatch must stop without halting and without persisting the cursor.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-describe-pairs-catalog-and-data-path
- step: 6
  phase: pre-deploy
  action: PR catalog awareness. Capture records the writer's catalog and re-sends the whole tree when it changes.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner_catalog.py::test_a_pass_records_the_catalog_describe_answered
    tests/telemetry_capture/test_runner_catalog.py::test_a_catalog_change_resends_the_whole_tree_keeping_pins
    tests/telemetry_capture/test_runner_catalog.py::test_a_conflict_after_a_catalog_reset_halts_with_its_own_reason
    tests/telemetry_capture/test_runner_catalog.py::test_a_no_rows_pass_keeps_the_recorded_catalog
    tests/telemetry_capture/test_state.py::test_state_records_the_catalog_and_reads_absent_as_smoke
    tests/turn_capture/test_record_turn_resend.py::test_resend_tree_re_emits_every_row_keeping_pins_and_cuts -q
  expected: Exit 0. Red before because the modules and nodes are absent.
  fix_if: Fix the reset path; a missing finalization close row means the prior set was not emptied.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-catalog-reset-resends-tree
- step: 7
  phase: pre-deploy
  action: PR catalog awareness. One helper resolves the catalog and routes event verbs by it.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_read_route.py::test_catalog_resolves_env_then_ssm_and_refuses_unknown_values
    tests/telemetry_capture/test_read_route.py::test_event_verbs_route_by_the_deploy_output
    tests/telemetry_capture/test_read_route.py::test_describe_merges_ops_rows_with_the_event_readers_rows
    tests/telemetry_capture/test_read_route.py::test_ops_reads_always_use_the_ops_reader
