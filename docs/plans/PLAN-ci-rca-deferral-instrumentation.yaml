acceptance_criteria:
- >-
  Every entry of `logs/.preflight-report.json` `ci_rca_unresolved_recs` carries `prior_deferrals`
  with keys `count` (int), `plan_slugs` (list of slugs, de-duplicated, ordered by plan filename)
  and `owner_named` (a matched owner phrase, or null when the deferral lines name nobody); the
  derivation counts a plan exactly once per rec, and only when the rec id (matched EXACTLY) and
  the substring "defer" (matched CASE-INSENSITIVELY, in both the whole-file prefilter and the
  per-entry test) occur in the SAME top-level `context` entry of that PLAN-*.yaml. The production
  call passes no directory -- `annotate_prior_deferrals(correlation)` resolves its `plans_dir`
  default to `_common.ROOT / "docs" / "plans"` -- so these values are computed from the
  repository's own corpus regardless of the process working directory (round-3 critique finding
  F1). `owner_named` is DETERMINISTIC, not an implementation freedom: the walk iterates
  `sorted(plans_dir.glob("PLAN-*.yaml"))`, so the returned phrase is the one carried by the
  EARLIEST-SORTING plan (by PLAN-*.yaml filename) among those counted for that rec THAT NAMES AN
  OWNER -- a counted plan naming none is passed over, and `owner_named` is null only when no
  counted plan names one. A bare,
  filesystem-ordered `.glob` is a DEFECT, not an equivalent implementation -- re-executed against
  the live corpus at planning time it answers "another agent" where the sorted walk answers
  "operator-directed" (round-4 critique finding F1).
- >-
  Run against the repository's own docs/plans corpus, the scan reproduces the audit's pinned
  census with no adjustment: for rec-3292 and rec-3293 every audit-named slug that still EXISTS
  under docs/plans appears in `plan_slugs` and `count` equals `len(plan_slugs)`. The owner leg
  degrades the same way the subset leg does (round-2 critique finding F2): `owner_named` equals
  the phrase carried by the EARLIEST-sorting surviving audit plan that names one -- today
  "operator-directed", supplied by PLAN-ambient-prose-contract-relocation.yaml, the only plan in
  the corpus that supplies it -- weakens to "non-null" when an unknown plan sorts ahead of that
  plan, and drops to no assertion at all once no owner-bearing audit plan survives. It is never
  widened to accept null while an owner-bearing plan survives, because that is the discrimination
  the check exists to provide. Measured 2026-09-03 with a case-insensitive prototype: all eight
  audit plans survive, all eight are returned for both ids, and the per-plan owner phrases are
  "operator-directed" (ambient-prose-contract-relocation), "another agent"
  (cfg-migration-closeout, inline-defer-boundary-contract, reader-projection-substrate), "human
  deferred" (roadmap-blocking-edge-semantics) and none for the remaining three. The existence
  conditioning rests on OBSERVED PRACTICE, not on a decision governing .yaml deletion (round-3
  critique findings F2 and F3): plan files ARE deleted in this repository -- PR #969 (squash commit
  7b67e21d) removed 13 docs/plans/PLAN-*.yaml files in a single commit, among them
  PLAN-audit-remediation-wave-3.yaml, three PLAN-broker-credential-*.yaml files,
  PLAN-ducklake-ops-migration-fpb.yaml, two PLAN-iceberg-*.yaml files, five PLAN-t2-*.yaml files
  and PLAN-verifier-hermeticity.yaml (1+3+1+2+5+1 = 13) -- so a later deletion of an audit-named plan, including the one
  plan that supplies today's owner phrase, must DEGRADE this check rather than red it. Decision 174
  is cited only as the SAME-DIRECTION principle (a superseded planning-artefact FORMAT carries no
  working-tree retention obligation; retirement is by deletion with provenance in git history); it
  governs a format transition, NOT the deletion of an individual PLAN-*.yaml, and is not relied on
  as authority for one. Re-verified 2026-09-03 at origin/main bdf14215: the round-2 draft's claim
  that the working tree "has already retired PLAN-mypy-unit1-baseline-paydown.yaml" was FALSE --
  that file is present under docs/plans and `git log --diff-filter=D` shows no deletion of it --
  and the citation is replaced by the PR #969 evidence above without weakening the criterion.
- >-
  No module under `scripts/preflight/**` or `scripts/session/**` imports `scripts.rec_relevance`
  or mentions `run_acceptance_probe`; preflight computes the deferral facts only and executes no
  rec acceptance command (Decision 55, mirroring the surfacing-only rule stated at
  scripts/preflight/correlation.py:173).
- >-
  The preflight HARD BLOCK section renders a per-rec deferral line of the shape "deferred N times
  (plans: a, b, c; owner named: X)" -- with "+M more" once more than five slugs exist, and "owner
  named: none" when `owner_named` is null -- and the HARD BLOCK condition itself
  (`ci_rca_unresolved_recs` non-empty) is unchanged.
- >-
  With `ci_rca_unresolved_recs` empty, `annotate_prior_deferrals` performs no docs/plans walk at
  all (zero plan-file reads), so the common path costs nothing.
- >-
  .claude/commands/orient.md Step 3 carries a single "CI-RCA Triage rendering" home holding all
  four classification rows, the `prior_deferrals` render rule, the N >= 3 trigger, a SIDE-EFFECT
  GUARD CLAUSE (read the rec's `acceptance` string from the cache first; probe only when it is
  read-only -- a grep, a read-only inspection, or a pytest selector under a non-writing invocation
  carrying `-p no:cacheprovider` -- otherwise surface the string verbatim and emit the /plan
  prompt instead), a BOUNDED probe command carrying both `run_acceptance_probe=True` and an
  explicit `acceptance_timeout=` whose elapsed time is measured, a THREE-WAY routing rule
  (satisfied -> close-then-stamp naming `stamp_fixed_by_sha`; "did not complete" when the probe
  hits the timeout ceiling -> say so and treat it as no evidence either way; any other verdict ->
  the /plan prompt), and `recent_commits` sourced from the preflight cache's `recent_main_commits`
  -- a rule the subsection expresses WITHOUT the literal `git log` token (write it as e.g. "cache
  only", the rule the skill's Section 3 already carries), because VP step 6 asserts that token is
  absent from the subsection. In the same file, the Step 3 pointer to the skill's Deliverable
  Shape section carves out Section 2 ("except Section 2's CI-RCA triage rendering") and the
  "**Write nothing.**" paragraph carves out the Step 3 relevance probe by name.
  .claude/skills/orient/SKILL.md points at that section, no longer restates any classification
  row, and carries the MIRROR of the command's carve-out (round-2 critique finding F1): its
  `## Read-Only Contract` bullet list names the Step 3 relevance probe as the sole permitted
  subprocess, its frontmatter description and its line-8 "strictly read-only" sentence each carry
  a short qualifier pointing there, and its Inputs table registers
  `logs/.recommendations-log.jsonl` as the source of the `acceptance` string the probe reads.
  Neither surface asserts an unqualified absolute that the other contradicts.
- >-
  .claude/skills/orient/SKILL.md is smaller than its pre-change 23,444 bytes (projected ~23,278
  after the four edits), its S4 budget entry equals the new measured size exactly and carries no `# raise-approved:` marker, and
  `bin/venv-python -m scripts.validate` exits 0 with no prose or SLOC failure; no new
  config/sloc_budgets.yaml entry is registered and every touched Python file stays at or under
  500 SLOC.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    RED baseline on the unmodified tree -- prove the symbol and the test module are absent before
    anything is written. Run FIRST. Marked hermetic false for a stated reason, not for cost: this
    step deliberately INVERTS once the change lands, so replaying it against the
    implementation-bearing tree would exit 1.
  command: |-
    bin/venv-python -c "import pathlib; src=pathlib.Path('scripts/preflight/ci_rca_signals.py').read_text(encoding='utf-8'); wire=pathlib.Path('scripts/session/preflight.py').read_text(encoding='utf-8'); t=pathlib.Path('tests/session/preflight/test_ci_rca_signals_deferrals.py'); print('in_signals=', 'prior_deferrals' in src, '| in_preflight=', 'annotate_prior_deferrals' in wire, '| test_exists=', t.exists()); raise SystemExit(0 if 'prior_deferrals' not in src and 'annotate_prior_deferrals' not in wire and not t.exists() else 1)"
  expected: >-
    Exit 0 printing `in_signals= False | in_preflight= False | test_exists= False` (reproduced on
    the session HEAD at planning time). After the change this same command exits 1, which is the
    intended inversion.
  fix_if: >-
    Exit 1 on the unmodified tree means part of this change already landed -- STOP and re-derive
    the diff rather than writing over existing work.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Asserts the ABSENCE of the very symbols this plan introduces; it holds only on pre-change code,
    so graduating it would land a standing guard that fails permanently the moment the change
    merges.
- step: 2
  phase: pre-deploy
  action: >-
    GREEN unit -- the whole new test module passes, covering the scan rule, the annotate
    short-circuit, the render shape and the anti-drift assertions.
  command: |-
    bin/venv-python -m pytest tests/session/preflight/test_ci_rca_signals_deferrals.py -q
  expected: >-
    All tests pass (TestPreflightReportWiring may report as skipped in an interpreter without
    boto3; every other class must run and pass).
  fix_if: >-
    A TestScanPriorDeferrals failure means the context-entry rule is wrong (most likely the scan is
    matching the rec id and "defer" in DIFFERENT context entries, or counting a plan twice). A
    TestAnnotatePriorDeferrals failure on the empty-set case means the short-circuit is missing and
    the common path is paying for a full plans walk. A failure on
    `test_default_plans_dir_resolves_to_the_repo_corpus` means the `plans_dir=None` default is
    wrong: an AttributeError on `None.is_dir()` means it is never resolved at all, and a zero count
    means it resolves cwd-relatively (the method chdirs into `tmp_path` first). Resolve it to
    `_common.ROOT / "docs" / "plans"`; never satisfy the method by passing a directory into the
    call or by dropping the chdir -- both delete the discrimination the method exists to provide.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-module selector that CI's own pytest job already runs on every PR and merge; the three
    load-bearing behaviours inside it are graduated individually by steps 3, 5 and 6, so a fourth
    row invoking the whole file would duplicate a standing gate rather than add a guard.
- step: 3
  phase: pre-deploy
  action: >-
    Live-corpus fidelity -- the scan reproduces the audit's own pinned deferral census against the
    real docs/plans corpus, not a fixture. This is the step that would catch a scan reading the
    wrong field, joining across entries, mis-attributing the owner, or matching "defer"
    case-SENSITIVELY. BOTH legs are existence-conditioned on the audit-named plans that still
    exist (round-2 critique finding F2): the subset leg on `present`, and the owner leg on the
    earliest-sorting surviving plan that actually supplies an owner phrase -- so a plan-file
    DELETION degrades the assertion instead of reddening it, including deletion of the single plan
    that supplies today's phrase. The grounding is observed practice, not a decision about .yaml
    files (round-3 critique finding F3): PR #969 / commit 7b67e21d deleted 13 PLAN-*.yaml files at
    once; Decision 174 is the same-direction principle for a superseded artefact FORMAT only.
  command: |-
    bin/venv-python -c "from scripts.preflight.ci_rca_signals import _scan_prior_deferrals; from scripts.preflight import _common; plans=_common.ROOT/'docs'/'plans'; KNOWN={'ambient-prose-contract-relocation':'operator-directed','cfg-migration-closeout':'another agent','drain-glue-orphan-mcp-transport':None,'glue-delete-database-grant':None,'inline-defer-boundary-contract':'another agent','reader-projection-substrate':'another agent','roadmap-blocking-edge-semantics':'human deferred','sync-deps-test-hermeticity':None}; present=set(KNOWN) & {p.stem[5:] for p in plans.glob('PLAN-*.yaml')}; r=_scan_prior_deferrals({'rec-3292','rec-3293'}, plans); lead=lambda e:[s for s in e['plan_slugs'] if KNOWN.get(s)]; owner_ok=lambda e: True if not lead(e) else ((e['owner_named'] is not None) if [s for s in e['plan_slugs'] if s not in KNOWN and s<lead(e)[0]] else (e['owner_named']==KNOWN[lead(e)[0]])); print('present=',sorted(present),'| owners=',{i:r[i]['owner_named'] for i in r},'|',r); ok=all(present <= set(r[i]['plan_slugs']) and r[i]['count']==len(r[i]['plan_slugs']) and owner_ok(r[i]) for i in ('rec-3292','rec-3293')); raise SystemExit(0 if ok else 1)"
  expected: >-
    Exit 0 with `present=` listing all eight audit-named slugs today and `owners=` showing
    "operator-directed" for both ids. Each of rec-3292 and rec-3293 returns every present slug (a
    superset is allowed and expected once this plan's own file lands in docs/plans), count equal to
    len(plan_slugs), and an owner leg conditioned on the plan that supplies the phrase: today
    PLAN-ambient-prose-contract-relocation.yaml sorts first among the surviving owner-bearing audit
    plans, so the leg is the exact equality owner_named == "operator-directed"; retire that one
    plan and the expectation becomes "another agent" (cfg-migration-closeout, the next
    owner-bearing slug in filename order) with no edit to the command; let an unknown plan sort
    ahead of the earliest known one and the leg weakens to non-null; retire every owner-bearing
    audit plan and it drops out entirely. Measured at planning time with a case-insensitive
    prototype of exactly this rule: 8 and 8 slugs, owner "operator-directed", and the same rule
    reproduced rec-2923=9, rec-2836=8, rec-2710=6, rec-2762=6 -- the audit's census exactly (those
    four return owner_named null, so the owner leg is deliberately pinned to the two ids that
    carry one). The same prototype run case-SENSITIVELY returns rec-3292=5,
    rec-3293=5, rec-2836=6, rec-2923=7, rec-2710=6, rec-2762=5 -- it drops
    cfg-migration-closeout, drain-glue-orphan-mcp-transport and reader-projection-substrate. The
    owner lambda's degradation matrix (today; ambient retired; all owner-bearing retired;
    mis-read owner; dropped owner; unknown plan sorting ahead with and without an owner; this
    plan self-counting) was executed at planning time and each case behaved as stated.
  fix_if: >-
    FIRST diagnosis on ANY owner-leg failure -- ITERATION ORDER. `owners=` reporting "another
    agent" where "operator-directed" is expected means the scan walks a bare
    `plans_dir.glob("PLAN-*.yaml")` (filesystem order) instead of
    `sorted(plans_dir.glob("PLAN-*.yaml"))`; re-executed against the live corpus at planning time,
    the unsorted walk returns "another agent" from PLAN-cfg-migration-closeout and the sorted walk
    returns "operator-directed" from PLAN-ambient-prose-contract-relocation. Add the `sorted(...)`
    -- never edit the regex, the KNOWN map or the assertion to chase this. Only once the walk is
    confirmed sorted do the two remaining owner diagnoses below apply.
    A missing slug that `present=` still lists is almost certainly a CASE-SENSITIVE match: the
    dropped plans' context entries read "ci-rca DEFERRAL: ... Deferred ..." with no lowercase
    "defer" (both parse fine as plain strings, so this is not a block-scalar problem). Lower-case
    both the file prefilter and the per-entry test; never widen the assertion. A count above
    len(plan_slugs) means a plan is counted once per matching entry instead of once per plan. With the walk confirmed sorted, a
    failing owner leg means either the pinned `_OWNER_NAMED_RE` alternation no longer matches the
    phrase carried by the earliest surviving owner-bearing plan (fix the alternation, never the
    assertion) or the command's KNOWN map has gone stale against the corpus (re-derive the map
    from the plans that still exist). Never widen the leg to accept null while an owner-bearing
    plan survives -- that drops the discrimination the row exists to provide.
  hermetic: true
  graduation: graduate
  graduation_check_id: preflight-prior-deferrals-census-fidelity
- step: 4
  phase: pre-deploy
  action: >-
