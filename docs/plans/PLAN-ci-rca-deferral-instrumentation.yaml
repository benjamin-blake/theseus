- 'scripts/preflight/ci_rca_signals.py: add `_OWNER_NAMED_RE` (a pinned, case-insensitive alternation of the phrases observed in the corpus: another agent / operator-direct(ed|ion) / human-direct(ed|ion) / human deferred / operator ruling), `_scan_prior_deferrals(rec_ids, plans_dir)` and `annotate_prior_deferrals(correlation, plans_dir=None)`. The scan returns a zeroed payload for every requested id, returns immediately when `plans_dir` is not a directory, iterates sorted(plans_dir.glob("PLAN-*.yaml")) -- SORTED, never a bare .glob, which yields FILESYSTEM order (the cited precedent scripts/platform_roadmap_state.py:101 sorts for exactly this reason) -- reads each PLAN-*.yaml once, skips a file whose text names no requested id (exact match) or whose LOWER-CASED text lacks "defer", parses only the survivors, walks the top-level `context` list, counts a plan at most once per rec when the entry contains the exact rec id AND its lower-cased form contains "defer", de-duplicates and orders `plan_slugs` by plan filename, records as owner_named the lowercased owner phrase supplied by the EARLIEST-SORTING matching plan THAT SUPPLIES ONE, passing over a matching plan that names no owner (under the sorted walk that is simply the first owner phrase encountered -- which is the ONLY reason the walk must be sorted; round-4 critique finding F1: with a bare .glob the live corpus answers "another agent" instead of "operator-directed" and VP step 3 reds) or leaves null, and swallows per-file OSError/YAML errors. `annotate_prior_deferrals` RESOLVES a `plans_dir` of None to `_common.ROOT / "docs" / "plans"` -- absolute and cwd-INDEPENDENT, the identical path VP step 3 passes explicitly, and never a cwd-relative `docs/plans`; `_common` is already imported at the top of this module, so no new import is needed. That default is the only shape production ever calls (the preflight wiring passes no directory), so getting it wrong ships a permanently zeroed signal behind eleven green VP steps (round-3 critique finding F1). It returns the correlation unchanged when `unresolved` is empty (no directory access at all -- the short-circuit precedes the resolution and the scan call), else attaches `prior_deferrals` to each unresolved rec dict in place and returns the same dict. Its docstring states the aliasing: correlate_recs_with_commits appends the SAME dict objects to `unresolved` and to the full rec list, so the in-place annotation is also visible through report["ci_rca_recs"] -- additive and benign (acceptance criterion 1 constrains ci_rca_unresolved_recs only), but recorded so a later reader does not read the annotation as a copy.'
