- 'The Step 3 trigger text, in order. (1) The side-effect guard clause: read the rec''s `acceptance` string from `logs/.recommendations-log.jsonl` and probe ONLY when it is read-only -- a grep, a read-only inspection, or a pytest selector, and a pytest selector only after `-p no:cacheprovider` is appended to its pytest segment so the run creates no .pytest_cache; anything else is surfaced verbatim, unprobed, with the /plan prompt. (2) The literal fenced command, which reads the rec from the cache, appends that flag when the acceptance''s final `&&` segment invokes pytest, TIMES the call, and prints verdict, evidence, elapsed and a timed_out flag: `evaluate_rec_relevance(rec, run_acceptance_probe=True, acceptance_timeout=120, recent_commits=<report["recent_main_commits"]>)` with `timed_out = elapsed >= 0.95 * 120` (commits read from the preflight cache; phrase the source as e.g. cache only -- do NOT write the literal `git log` token into the subsection, since VP step 6 asserts its absence). (3) The three-way routing rule: verdict "satisfied" -> the SOFT PROMPT close-then-stamp row; timed_out true -> report "relevance probe did not complete (timed out at 120s)", state explicitly that this is NOT evidence the rec is still unresolved, surface the acceptance verbatim and emit the /plan prompt marked inconclusive; any other verdict -> name the verdict and emit the /plan prompt. The 120s ceiling is deliberate headroom over the engine''s 10s default: the round-1 critique measured the canonical rec-3293 acceptance at 2.26s where the audit had estimated ~20s, and a probe that silently times out is indistinguishable from "not satisfied" (scripts/rec_relevance.py:33-45).'
