schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-deferral-instrumentation
intent: >-
  Make the repeated ci-rca deferral visible where the decision is actually taken: preflight
  computes, per unresolved ci-rca rec, how many merged plans already logged a deferral rationale
  naming it, which plans, and any owner their text names; /orient renders that on the HARD BLOCK
  line and, at three or more deferrals, hands the agent the T3.8 relevance probe to run in-session
  so a fixed-but-open rec is closed once with proof instead of re-deferred by reflex. Preflight
  itself never executes a rec acceptance command.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-deferral-instrumentation.yaml
phase: >-
  CI-RCA deferral instrumentation (audit planning-decision-burden-735e69fc, originated remedy
  B5-O1, finding PDB-06). No tier_item slice and no closes_criteria; soft-warn exception category
  ad_hoc_rec (overseer run under the user directive of 2026-09-03, brief section 4 slice F).
  Cross-referenced items: T3.8 (complete -- its relevance engine is CALLED from /orient by this
  plan, not modified) and T3.9 (not_started -- owns the closure half, deliberately not
  re-specified here).
scope:
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: >-
    Add the deferral scan and its render. `_OWNER_NAMED_RE` (a pinned alternation grounded in the
    observed corpus), `_scan_prior_deferrals(rec_ids, plans_dir)` returning
    {rec_id: {count, plan_slugs, owner_named}} by walking
    `sorted(plans_dir.glob("PLAN-*.yaml"))` over docs/plans -- the walk is SORTED, mirroring the
    cited precedent scripts/platform_roadmap_state.py:101 verbatim, because `pathlib.Path.glob`
    yields FILESYSTEM order and `owner_named` is BY DEFINITION the phrase supplied by the
    EARLIEST-SORTING matching plan THAT SUPPLIES ONE (a matching plan naming no owner is passed
    over, exactly as acceptance criterion 2 and VP step 3 already state), never "the first
    encountered" in filesystem order (round-4 critique finding F1,
    the divergence re-executed against the live corpus at planning time: an unsorted walk returns
    "another agent" from PLAN-cfg-migration-closeout, a sorted walk returns "operator-directed"
    from PLAN-ambient-prose-contract-relocation, and the unsorted answer REDS VP step 3) -- with a
    CASE-INSENSITIVE `defer` substring prefilter, then a YAML parse of only the matching files
    whose per-entry `defer` test is likewise case-insensitive (the rec-id match stays exact,
    matching the audit's own census -- see context), and public
    `annotate_prior_deferrals(correlation, plans_dir=None)` which short-circuits to a no-op when
    `correlation["unresolved"]` is empty and otherwise attaches a `prior_deferrals` key to each
    unresolved rec dict in place. `plans_dir=None` is the SOLE production call shape (the
    scripts/session/preflight.py wiring passes no directory) and RESOLVES TO
    `_common.ROOT / "docs" / "plans"` -- an absolute, cwd-INDEPENDENT path, byte-identical to the
    one VP step 3 passes explicitly; `_common` is already imported at ci_rca_signals.py:10, so the
    resolution needs no new import, and it must never be a cwd-relative `docs/plans` (round-3
    critique finding F1: under a cwd-relative default the production path silently returns zeros
    from any working directory but the repo root, the render prints nothing at count 0, and every
    VP step still passes). `print_ci_rca_recs`'s HARD BLOCK branch renders the payload as a
    second indented line per rec. The correlation=None backward-compat branch is untouched.
    Degrades to an empty payload on any error and never raises (the `_check_convergence_rca_gap`
    pattern in this same file). The `annotate_prior_deferrals` docstring records the aliasing the
    round-2 critique noted: `correlate_recs_with_commits` (scripts/preflight/correlation.py:134
    and :136 -- the append sites; the only copy is the `rec = {**rec, ...}` sibling-cluster branch
    at :129, and the :84-105 span the earlier draft cited is the commit-match loop, round-3
    critique finding F4)
    appends the SAME dict objects to `unresolved` and to the full rec list, so annotating in place
    is also visible through `report["ci_rca_recs"]` -- additive and benign, stated so a later
    reader does not mistake the annotation for a copy. Projected +60 SLOC on 348 measured
    (500 ceiling, 152 headroom).
- file: scripts/session/preflight.py
  action: Modify
  purpose: >-
    One line, inserted between the `correlation.correlate_ci_rca_with_main(...)` assignment
    (line 291) and the `ci_rca_signals.print_ci_rca_recs(...)` call (line 294):
    `ci_rca_correlation = ci_rca_signals.annotate_prior_deferrals(ci_rca_correlation)`. Single call
    site, so the printed section and `report["ci_rca_unresolved_recs"]` (line 366) carry the same
    annotated dicts. +1 SLOC on 427 measured.
- file: tests/session/preflight/test_ci_rca_signals_deferrals.py
  action: Create
  purpose: >-
    The behaviour guard. Classes: TestScanPriorDeferrals (context-entry-only rule, the
    rec-id-and-defer-in-the-SAME-entry condition, an UPPER/MIXED-CASE fixture whose entry reads
    "ci-rca DEFERRAL: ... Deferred ..." with no lowercase "defer" and must still be counted,
    per-plan de-duplication, owner regex hit and miss, OWNER DETERMINISM --
    `test_owner_named_comes_from_the_earliest_sorting_plan` writes two fixture plans carrying
    DIFFERENT owner phrases, the later-sorting filename created FIRST, and asserts the
    EARLIER-sorting filename supplies `owner_named` irrespective of creation order (round-4
    critique finding F1; without it the owner leg is exercised only by VP step 3 against the live
    corpus, which is the unexercised-path-behind-green-steps shape round-3 finding F1 raised) --
    and an unreadable/malformed plan degrades rather
    than raises); TestAnnotatePriorDeferrals
    (empty unresolved set performs no plans walk; annotation is in place and returns the same
    object; likely_resolved entries are not annotated; and -- round-3 critique finding F1 -- the
    DEFAULT `plans_dir` exercised end-to-end by
    `test_default_plans_dir_resolves_to_the_repo_corpus`, which `monkeypatch.chdir(tmp_path)` FIRST,
    then calls `annotate_prior_deferrals({"unresolved": [{"id": "rec-3292"}], "likely_resolved":
    []})` with NO `plans_dir` argument and asserts `count >= len(present)` under the same existence
    conditioning VP step 3 uses -- the chdir is what makes the leg discriminating, since a
    cwd-relative default returns zeros from `tmp_path` while the `_common.ROOT` default does not);
    TestPrintPriorDeferralsRender (HARD BLOCK
    line shape, the "+M more" overflow past five slugs, "owner named: none" when null);
    TestOrientDeferralSurfacingContract (anti-drift over .claude/commands/orient.md and
    .claude/skills/orient/SKILL.md, including the CROSS-SURFACE consistency assertions the round-2
    critique's finding F1 requires: the skill restates no classification row, its Read-Only
    Contract names the same Step 3 probe exception the command's write-nothing paragraph names,
    its Inputs table registers logs/.recommendations-log.jsonl, and neither its frontmatter
    description nor its line-8 "strictly read-only" sentence stands as an unqualified absolute); TestPreflightReportWiring (end-to-end `_preflight.main()`
    report-key assertion, class-level skipif on a missing boto3, mirroring the module-level guard
    test_main_report.py carries for the same main()-integration pattern). Sibling-file naming
    follows the existing test_ci_rca_signals_abstention_matrix.py precedent; no module-level
    importorskip, so the anti-drift and unit classes still run in the boto3-less fast tier.
    Imports scripts.preflight.ci_rca_signals, scripts.preflight._common (for `ROOT`, used only by
    the default-resolution method) and tests.fixtures.session_preflight_module only.
- file: .claude/commands/orient.md
  action: Modify
  purpose: >-
    Step 2 gains "(each entry carries `prior_deferrals`)" beside `ci_rca_unresolved_recs`. Step 3
