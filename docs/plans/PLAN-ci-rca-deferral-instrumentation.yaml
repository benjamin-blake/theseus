  expected: >-
    Exit 0 with `violations= []` and `annotate_present= True`, over 21 files at planning-time HEAD.
    Two conjuncts by design (claim-ADDITIVE authoring; precedent: the 2026-08-31
    ci-rca-lifecycle-records-watched-set governance note in
    docs/contracts/verification-registry.yaml): the surfacing-only scan is the row's
    named claim and holds identically on origin/main, so the annotate_prior_deferrals-present
