constraints:
- >-
  Preflight NEVER executes a rec acceptance command. No `scripts.rec_relevance` import and no
  `run_acceptance_probe` token may appear under `scripts/preflight/**` or `scripts/session/**`
  (Decision 55; the surfacing-only rule stated at scripts/preflight/correlation.py:173). VP step 5
  is the standing guard, graduated as a claim-ADDITIVE row: the surfacing-only scan verbatim plus
  one discriminating assertion that `annotate_prior_deferrals` is present in
  scripts/preflight/ci_rca_signals.py (absent on origin/main), which is what lets
  scripts.verification_graduation.run_differential admit it at all. Precedent:
  docs/contracts/verification-registry.yaml governance note, 2026-08-31.
- >-
  The docs/plans walk is skipped entirely when `correlation["unresolved"]` is empty -- the common
  path must read zero plan files. The remedy's zero-dispatch, near-zero-cost claim depends on this
  short-circuit, not on the scan being fast.
- >-
  Do not weaken, relax, widen or gate the Decision 73 point 4 HARD BLOCK. `prior_deferrals` is
  advisory instrumentation attached beside the block; the block's condition
  (`ci_rca_unresolved_recs` non-empty) and its effect on /plan are unchanged.
- >-
  One subject, one home, and no surface left contradicting another. The CI-RCA triage rendering
  lives only in `.claude/commands/orient.md` Step 3; the probe exception that rendering creates is
  named in BOTH `.claude/commands/orient.md`'s write-nothing paragraph and
  `.claude/skills/orient/SKILL.md`'s Read-Only Contract, because the command instructs the agent
  to load that skill (orient.md:43) and a carve-out on one surface only reproduces the drift the
  relocation removes. Any input the relocated rendering introduces is registered in the skill's
  Inputs table.
- >-
  Preflight proposes nothing and closes nothing. Closure needs proof and a human turn (Decision
  103); the /orient probe informs the choice, and the close-then-stamp route is executed by the
  operator, never by a session-start path.
- >-
  The /orient probe is BOUNDED and self-reporting. It passes an explicit `acceptance_timeout` and
  measures elapsed time, because `_run_acceptance_probe` collapses failure and timeout into the
  same False (scripts/rec_relevance.py:33-45): a timeout read as "not satisfied" routes the agent
  to /plan and reproduces the reflex deferral this plan exists to break. A pytest-shaped
  acceptance is probed only under a non-writing invocation (`-p no:cacheprovider`); an acceptance
  that is not a grep, a read-only inspection or such a pytest selector is surfaced verbatim and
  never executed.
- >-
  No numbered Decision, no new contract, no new standing prose-architecture doc (Decision 86 and
  docs/contracts/decision-entry.yaml routing). `prior_deferrals` semantics live in the function
  docstring and the orient command, where every other preflight-report key's semantics live.
- >-
  Prose: every byte added to the capped S4 orient skill is funded in-file. This plan takes a net
  REDUCTION there and ratchets config/prose_budgets.yaml down to the measured value. Never add a
  `# raise-approved:` marker to that entry -- Decision 165 makes an unauthorised marker a CI
  failure in its own right, and a decrease needs none.
- >-
  SLOC ceiling 500 per file -- decompose, never raise (Decision 128; Decision 130 puts tests/ in
  scan scope, so the new test module counts). No config/sloc_budgets.yaml entry is added for any
  file this plan touches, no `# raise-approved:` marker is authored (Decision 165: a marker must
  name a Decision that AUTHORISES the entry, and none does here), and `--update-sloc-budgets` is
  not run.
- >-
  The scan must never raise inside preflight. Wrap the per-file read and parse so an unreadable or
  malformed PLAN-*.yaml is skipped, mirroring `_check_convergence_rca_gap`'s degrade-to-None
  posture in this same module.
- >-
  No cross-test imports (Decision 131): the new module imports stdlib,
  scripts.preflight.ci_rca_signals, scripts.preflight._common (for `ROOT`, used only by the
  default-resolution method) and tests.fixtures.session_preflight_module only, and must not import
  from any other test_* module.
- >-
  No exact-count assertions against growing collections, and no assertion that pins a named plan
  file into existence. The census check asserts an EXISTENCE-CONDITIONED subset (the audit slugs
  still present under docs/plans) plus internal consistency plus an owner leg that is conditioned
  on the plan which actually SUPPLIES the phrase, not merely on the set being non-empty (round-2
  critique finding F2): exact equality against the earliest-sorting surviving owner-bearing audit
  plan, weakening to non-null when an unknown plan sorts ahead of it, and dropping out entirely
  when no owner-bearing audit plan survives. So neither a later plan deferring an instrumented rec
  (which grows the set) nor a plan-file DELETION -- an observed practice in this repository, PR
  #969 / commit 7b67e21d deleted 13 PLAN-*.yaml files at once (round-3 critique findings F2/F3);
  Decision 174 stands only as the same-direction principle for a superseded artefact FORMAT and is
  NOT authority over an individual .yaml -- including deletion of the single plan that supplies
  today's phrase, can red it; and it is never widened to accept null while an owner-bearing plan
  survives. This plan creates no retention obligation on any docs/plans file.
- No rescue agents or workaround loops (Decision 55). Linux/bash commands only; `bin/venv-python`
  never bare `python` (AGENTS.md Shell invocations).
