execution_steps:
  - >-
    Run VP 9's hash check first; on a mismatch STOP. Then run the pinned apply script on the contract
    (bin/venv-python /mnt/project-files/credential-reissue/draft/apply_contract_amendment.py
    docs/contracts/github-org-transfer.yaml docs/contracts/github-org-transfer.yaml, then delete the .edits.json it
    writes beside the output) and set the new amendment_log entry's date to the build date.
  - Create scripts/ci/pypi_proof_only_guard.py and tests/test_pypi_proof_only_guard.py per their scope rows.
  - Edit .github/workflows/publish-ontheloop.yml and tests/test_ontheloop_placeholder_packages.py per their scope rows.
  - Edit bin/setup-cloud-env.sh's MCP comment block and add the test in tests/test_setup_cloud_env.py per their scope rows.
  - >-
    Create the three verification-registry rows (check_id = the step's graduation_check_id, primitive_slot test_selector,
    guard_target the scope file, guard_symbol null, plan_slug github-transfer-credential-prestage, graduated_by
    implement-agent, check_spec.node_id = the step's selector), and set implementation_declared true on this plan.
  - Run VP 1-10, commit, push, open the PR ready for review (VP 11), subscribe to it, and run code review.
  - >-
    Run the console steps VP 12-22 one at a time on the operator's word, recording each in EVIDENCE.md; then VP 23,
    re-validate, push; then VP 24 (merge on the operator's word), VP 25 and VP 26.
  - 'Report: what was implemented, the console steps done, the proof_only run URL, and the recs closed.'
work_areas: []
rollback: >-
  Code: revert the PR (the proof_only input defaults to false; the guard is a no-op when off). Console: each additive
  step is undone by its own console action (uninstall, remove the second publisher, revoke the unused successor token,
  delete the App and the new secret entry). The MCP placeholder is reverted by restoring a PAT in the setup scripts.
