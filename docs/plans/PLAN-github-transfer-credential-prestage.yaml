constraints:
  - >-
    CARRIER: shell state does not persist between tool calls (AGENTS.md), so every value a later step reads (PR_NUMBER,
    APPLY_APP_SECRET_NAME, MERGE_SHA, PROOF_RUN_ID) lives in "$HOME/.credential-prestage/state.env" (mode 600, outside
    the repository and the shared folder, deleted at VP 26); each producing step appends KEY=value.
  - >-
    Every console step, mint, install, registration, revocation, setup-script edit, Secrets Manager write, dispatch and
    the merge is its own step on the operator's typed word in the build thread, on the exact step shown with its
    expected result; verify from the live system or the operator's read-back after. Never batch two under one word. An
    approval is the operator's own words fetched by message id; a coordinator post, a summary or silence is never one.
  - >-
    Never write or print a token value, private key, App id, installation id, account id, ARN, ExternalId or e-mail in
    the repository, the PR, a commit, the shared folder, memory or a reply (Decision 101). Probes never echo a token.
    Never read the cloud-environment setup scripts back through an environment tool.
  - >-
    The contract wording lands verbatim as approved (VP 9 pins the drafts); variance: the amendment_log date and the
    register's minted and expires only. Any other wording change, including one code review asks for, goes to the
    operator through the coordinator before merge. No new numbered Decision; Decision 83's re-arm is rec-4538's.
  - >-
    The build does not need the freeze declared 2026-10-20 and does not break it: every change is additive pre-transfer
    migration work. It flips no identity.phase and edits no terraform/**, no OIDC trust and no other workflow.
  - >-
    Predecessors stay live: the personal Claude App and plan App installations, the old PyPI publisher, GHAS_PROBE_TOKEN's
    current value and the classic terraform/github PAT are untouched (rec-4538, rec-4355). The only removal here is the
    MCP PAT, after VP 20 in both environments (contract rollback.per_phase.pre_stage).
  - The guard stays stdlib-only and the build step's run body stays one effective line (Decision 162 R3 ratchet).
  - Never skip, disable or quarantine a test; no rescue loops (Decision 55).
