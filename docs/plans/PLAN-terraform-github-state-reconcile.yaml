schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-state-reconcile
intent: >-
  Re-key terraform/github's Terraform state from the pre-rename repository name (agent-platform) to the live one
  (theseus) with a state rm and an import-only apply run by the operator in AWS CloudShell, proven by the PR-time
  terraform/github plan reading 0 to change. This gives the GitHub organisation transfer the zero-diff baseline its
  contract requires (prerequisites.terraform-github-state-reconciled, Decision 218), makes a routine terraform/github
  apply safe again, and closes rec-3136.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-state-reconcile.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3136 (High). No tier_item criterion claimed. Satisfies
  docs/contracts/github-org-transfer.yaml prerequisites.terraform-github-state-reconciled (Decision 218), which blocks
  the transfer contract's pre_staged phase.
closes_criteria: []
scope:
  - file: terraform/github/imports.tf
    action: Create
    purpose: >-
      Five import blocks, one per resource this root manages, ids derived from var.repository_name (the ruleset id also
      from var.main_protection_ruleset_id). Inert while an address is in state; after a state rm they re-key it under
      the current name with GitHub reads only. Kept after use so a later rename or transfer re-keys by changing the
      variable defaults. Exact text: execution_steps step 2.
  - file: terraform/github/variables.tf
    action: Modify
    purpose: Append variable main_protection_ruleset_id (number, default the live ruleset id). Exact text in execution_steps step 3.
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Build PR: the approved wording (execution_steps step 4) -- CloudShell as the by-hand venue, the corrected AWS
      prerequisite, TF_VAR_github_token and curl in the runbook, the duplicated NEVER paragraph removed for the
      5253-byte prose budget, and a State reconcile section replacing First-time import (rec-3136's acceptance).
      Closure PR: the approved dated result line (execution_steps step 11).
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Create
    purpose: >-
      Static guard over the real terraform/github tree (behaviour in execution_steps step 5): every managed resource has
      exactly one import block, every id derives from var.repository_name, no literal owner or repository name, the
      ruleset id comes from a declared number variable; each predicate has its own red case on synthetic HCL.
  - file: config/agent/verification_registry/entries/terraform-github-import-blocks.yaml
    action: Create
    purpose: >-
      Graduation record for VP step 1 (filename == check_id == graduation_check_id): primitive_slot test_selector,
      guard_target terraform/github/imports.tf, guard_symbol null, plan_slug terraform-github-state-reconcile,
      graduated_by implement-agent, check_spec.node_id
      tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks.
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Closure PR only, after the OIDC pre-stage build merges: two evidence_ledger rows for
      prerequisites.terraform-github-state-reconciled, breakage_map.terraform_github_root rec pointer moved to the
      post-transfer re-key follow-on rec, one amendment_log row. Exact text: execution_steps step 11.
bundled_recommendations:
  - rec-3136
followon_recs:
  - rec-4355
infrastructure_dependencies:
  - >-
    rec-4335's two plans (PLAN-terraform-github-plan-state-grant, then PLAN-terraform-github-pr-plan): the planner's
    GetObject on tfstate/github/terraform.tfstate is applied, and the PR-time plan job (provisionally
    .github/workflows/terraform-github-plan.yml) runs on same-repo PRs touching terraform/github/**, can be re-run on
    the same head, and reports "TF_GITHUB_PLAN_REPORT verdict= import= add= change= destroy= replace= gated= drift=
    conflict= exit=" plus a VISIBILITY line. Order A (expected): the workflow PR's first run is clean (about five
    in-place updates) and merges; this build starts after it. Order B: that first run fails, or shows destroy or
    replace only on the five old-keyed resources; the workflow PR stays open, the coordinator starts this build, and
    the workflow PR's runs are E0 and (re-run) E2.
  - >-
    The terraform/github state object (S3 agent-platform-data-lake, key tfstate/github/terraform.tfstate, versioning
    Enabled, use_lockfile) is written only by the operator's CloudShell paste A (state rm) and paste B (import apply),
    or by a rollback on the operator's word. Pre-merge vs post-deploy: every state write is post-merge.
  - >-
    AWS CloudShell (eu-west-2) with outbound HTTPS to releases.hashicorp.com, registry.terraform.io, github.com and
    api.github.com, signed in as an operator identity that can read the terraform/github admin PAT secret and
    Get/Put/Delete tfstate/github/*. Unproven until VP step 9 runs.
  - >-
    The classic terraform/github admin PAT (repo, admin:repo_hook, read:org; Secrets Manager, name supplied by the
    operator at build time) is valid and sees security_and_analysis. If it is gone or expired, a replacement is an
    always-ask credential mint and the live walk waits.
  - 'No GitHub-side write: an import-only apply issues GitHub reads only; the only write is the S3 state object.'
acceptance_criteria:
  - >-
    terraform/github/imports.tf holds exactly one import block per managed resource in terraform/github, every id is
    derived from var.repository_name (the ruleset id also from var.main_protection_ruleset_id), and no import id
    carries a literal owner or repository name; the static test passes on the real tree and fails on each synthetic
    red case.
  - >-
    terraform/github/CLAUDE.md carries the approved wording exactly, rec-3136's acceptance holds (it contains
    'state rm github_repository.this' and 'reconcil'), and the file stays within its config/prose_budgets.yaml budget.
  - >-
    E0, before the reconcile: the PR-time terraform/github plan on the build PR reads import=0 add=0 change=5
    destroy=0 replace=0, and the five changed addresses are exactly the five name-keyed resources.
  - >-
    The operator's applied plan was import-only: Apply complete with 5 imported, 0 added, 0 changed, 0 destroyed, and
    the CloudShell re-plan exits 0 (No changes).
  - >-
    After the reconcile, the live S3 state keys all five instances on theseus with no agent-platform string left in
    them, and a re-run of the PR-time plan (E2) reads import=0 add=0 change=0 destroy=0 replace=0, with gated at most
    1 and only when its VISIBILITY line reports ruleset_bypass_actors hidden.
  - >-
    The closure PR lands the approved evidence_ledger rows, rec pointer, amendment_log row and dated CLAUDE.md line;
    rec-3136 is closed and its acceptance holds at the closing sha (Decision 201).
  - No account id, ARN, secret name or value, e-mail address, token or ExternalId appears in any changed file, PR body or PR comment (Decision 101).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Static import-block guard over the real terraform/github tree, with its synthetic red cases.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks -q
    expected: All tests in the class pass.
    expected_literals:
      - passed
    fix_if: >-
      A real-tree failure names the predicate: a resource without an import block, an import id with a literal name,
      or a missing or non-number ruleset variable -- fix imports.tf or variables.tf to the execution_steps text. A red
      case passing means the predicate is vacuous; fix the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: terraform-github-import-blocks
  - step: 2
    phase: pre-deploy
    action: rec-3136's acceptance plus the approved wording's markers in terraform/github/CLAUDE.md.
    command: >-
      grep -q 'state rm github_repository.this' terraform/github/CLAUDE.md && grep -q 'reconcil' terraform/github/CLAUDE.md
      && grep -q 'from AWS CloudShell' terraform/github/CLAUDE.md && ! grep -q 'profile agent_platform' terraform/github/CLAUDE.md
      && ! grep -q 'First-time import' terraform/github/CLAUDE.md
    expected: Exit 0.
    expected_literals: []
    fix_if: A missing or surviving marker means execution_steps step 4 was not applied verbatim; re-apply it. Never reword approved text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      rec-3136's own acceptance oracle is evaluated at closure under Decision 201; a standing grep on prose would pin
      wording the post-transfer literal sweep (rec-3903) must later rewrite.
  - step: 3
    phase: pre-deploy
    action: The CLAUDE.md change is exactly the approved diff (added and removed lines), nothing more.
    command: >-
      bin/venv-python -c "import subprocess,yaml; p=yaml.safe_load(open('docs/plans/PLAN-terraform-github-state-reconcile.yaml',encoding='utf-8'));
      want=p['execution_steps'][3].split(chr(10)*2,1)[1]; pick=lambda d: [l for l in d.splitlines() if l.startswith(('+','-')) and not l.startswith(('+++','---'))];
      got=subprocess.run(['git','diff','origin/main','--','terraform/github/CLAUDE.md'],capture_output=True,text=True,check=True).stdout;
      assert pick(want)==pick(got), 'CLAUDE.md differs from the approved diff'; print('CLAUDE_MD_APPROVED', len(pick(got)))"
    expected: Prints CLAUDE_MD_APPROVED followed by the changed-line count.
    fix_if: >-
      Any difference is an unapproved wording change: restore the approved text. If main changed the same lines since
      planning, stop and escalate to the planning thread through the coordinator; never re-word to fit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time binding of the build PR's diff to the operator-approved text; it depends on origin/main at build time,
      so it cannot be a standing check.
  - step: 4
    phase: pre-deploy
    action: Public-boundary sweep of every added line (Decision 101); the never-commit hook is the backstop, not the check.
    command: >-
      ! git diff origin/main -- terraform/github tests/checks/iam_tf/test_terraform_github_import_blocks.py
      config/agent/verification_registry/entries/terraform-github-import-blocks.yaml docs/contracts/github-org-transfer.yaml
      | grep '^+' | grep -Eq '[0-9]{12}|arn:aws|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId|secret-id [a-z]'
    expected: Exit 0 (no match).
    expected_literals: []
    fix_if: A match is a Decision 101 breach (or a real PAT secret name where the runbook keeps a placeholder); remove it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
  - step: 5
    phase: pre-deploy
    action: Fast presubmit tier (includes validate_prose_limits for the CLAUDE.md budget and the verification-registry checks).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named check's finding in the changed files only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness.
  - step: 6
    phase: pre-deploy
    action: >-
      E0 drift evidence. Order A: the PR-time plan run on this build PR's head. Fetch its job log with
      mcp__github__get_job_logs into $E0_LOG and its PR comment body with mcp__github__pull_request_read (get_comments)
      into $E0_COMMENT, then check. Order B: see fix_if.
    command: >-
      grep -o 'TF_GITHUB_PLAN_REPORT [A-Za-z0-9=_. -]*' "$E0_LOG" | tail -1 | grep -E 'import=0 add=0 change=5 destroy=0 replace=0'
      && for a in github_repository.this github_repository_ruleset.main_protection github_actions_repository_permissions.this
      github_workflow_repository_permissions.this github_repository_environment.tf_gated_apply; do grep -qF "$a" "$E0_COMMENT" || exit 1; done
      && echo E0_OK
    expected: >-
      The report line reads import=0 add=0 change=5 destroy=0 replace=0 and all five addresses are listed as updates:
      github_repository.this on name, the other four on repository (bypass_actors may also be listed on the ruleset only
      when the VISIBILITY line says ruleset_bypass_actors hidden; computed attributes shown as known after apply are
      fine). Then E0_OK. Post the counts, head sha and run URL on the PR (counts only).
    fix_if: >-
      Any other count or address, or any other changed argument, is pre-existing drift: STOP, do not merge, and escalate
      to the planning thread through the coordinator; config is reconciled to live by a plan amendment, never by an
      apply. If the job did not run on this PR, or rec-4335 merged a different report format, escalate the same way (a
      format difference is not a count difference). Order B (the coordinator relays it): E0 is instead the workflow
      PR's first run, which may have failed or shown destroy or replace; accept it only if every address it names is
      one of the five, record its counts or error class and run URL on this PR, and skip this command.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full presubmit tier, per handoff_policy.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0. Run it in the background with a timeout of at least 30 minutes; a timeout is a block, never a pass.
    fix_if: Fix the named check's finding in the changed files only.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness.
  - step: 8
    phase: post-deploy
    action: >-
      ADMIN, read-only -- preconditions for the live walk and the rollback point. MERGE_SHA is the build PR's
      squash-merge sha.
    command: >-
      R="${TMPDIR:-/tmp}/tfgithub-reconcile" && mkdir -p "$R" && test -n "$MERGE_SHA" && git fetch -q origin main
      && git merge-base --is-ancestor "$MERGE_SHA" origin/main
      && ! aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate.tflock --profile agent_platform_admin >/dev/null 2>&1
      && aws s3api head-object --bucket agent-platform-data-lake --key tfstate/github/terraform.tfstate --profile agent_platform_admin --query VersionId --output text > "$R/rollback-version"
      && test -s "$R/rollback-version"
      && aws s3 cp s3://agent-platform-data-lake/tfstate/github/terraform.tfstate - --profile agent_platform_admin --only-show-errors
      | bin/venv-python -c "import json,sys; w=sys.argv[1]; s=json.load(sys.stdin); K={('github_repository','this'):'name',('github_repository_ruleset','main_protection'):'repository',('github_actions_repository_permissions','this'):'repository',('github_workflow_repository_permissions','this'):'repository',('github_repository_environment','tf_gated_apply'):'repository'}; I={('github_repository','this'):w,('github_actions_repository_permissions','this'):w,('github_workflow_repository_permissions','this'):w,('github_repository_environment','tf_gated_apply'):w+':tf-gated-apply'}; F={(r['type'],r['name']):r['instances'][0]['attributes'] for r in s.get('resources',[]) if r.get('mode')=='managed' and (r['type'],r['name']) in K}; ok=[k for k,a in F.items() if a.get(K[k])==w and a.get('id')==I.get(k,a.get('id'))]; st=w!='agent-platform' and any('agent-platform' in json.dumps(a) for a in F.values()); print('STATE_KEYED',w,'count=%d'%len(ok),'resources=%d'%len(F),'stale' if st else 'clean'); assert len(ok)==5 and len(F)==5 and not st" agent-platform
    expected: >-
      Prints STATE_KEYED agent-platform count=5 resources=5 clean: the merge is on main, no lock object exists, the current
      state version is saved as the rollback point (never printed or posted), and the state is still in the
      pre-reconcile shape.
    fix_if: >-
      A lock object: someone is mid-operation; wait and ask the operator. count below 5: the state changed since E0;
      stop and RCA before any paste. Any AWS error: check the ADMIN chain (aws sts get-caller-identity --profile
      agent_platform_admin), never switch to the PlatformDev profile.
  - step: 9
    phase: post-deploy
    action: >-
      OPERATOR, AWS CloudShell, read-only -- paste 0 (readiness and baseline). The agent fills MERGE_SHA, the operator
      fills PAT_SECRET_ID; the exact text is execution_steps step 8.
    command: >-
      printf '%s\n' "$PASTE0_REPORT" | grep -cxE 'TERRAFORM_OK|PAT_ADMIN_VISIBLE|INIT_OK|COUNTS import=0 add=0 change=5 destroy=0|BASELINE_PLAN_FAILED'
      | grep -qx 4 && echo PASTE0_OK
    expected: >-
      The operator reports four lines: TERRAFORM_OK, PAT_ADMIN_VISIBLE, INIT_OK and a baseline matching E0 -- COUNTS
      import=0 add=0 change=5 destroy=0 in Order A, or, only in Order B when E0 itself failed, BASELINE_PLAN_FAILED.
      Nothing is written anywhere (plan -lock=false, the plan file is deleted in the paste).
    fix_if: >-
      Checksum mismatch: stop, do not run the binary. PAT_ADMIN_VISIBLE missing: the PAT is invalid or lacks admin;
      a new admin PAT is an always-ask credential mint, park it and wait. AccessDenied: the console identity cannot read
      the secret or the state; the operator chooses another identity (any IAM grant is always-ask). COUNTS different
      from E0: stop and escalate; never continue to paste A.
  - step: 10
    phase: post-deploy
    action: >-
      OPERATOR, AWS CloudShell, state mutation -- paste A (backup, state rm of the five, saved plan asserted
      import-only). Exact text: execution_steps step 9. The operator runs it only after steps 8 and 9 passed.
    command: >-
      printf '%s\n' "$PASTEA_REPORT" | grep -cxE 'BACKUP_OK|COUNTS import=5 add=0 change=0 destroy=0|PLAN_IMPORT_ONLY'
      | grep -qx 3 && echo PASTEA_OK
    expected: >-
      The operator reports BACKUP_OK, Successfully removed 5 resource instance(s), COUNTS import=5 add=0 change=0
      destroy=0, PLAN_IMPORT_ONLY, and five "will be imported" address lines -- and stops there to review.
    fix_if: >-
      No PLAN_IMPORT_ONLY: do NOT run paste B. Run paste R (execution_steps step 10) or, on the operator's word on the
      exact command, the agent's S3 version restore (rollback field); confirm with step 8's check (agent-platform);
      then escalate.
  - step: 11
    phase: post-deploy
    action: >-
      OPERATOR, AWS CloudShell, state mutation -- paste B (apply exactly the reviewed saved plan, then re-plan). Exact
      text: execution_steps step 9's second block. Run only after reviewing paste A's output.
    command: >-
      printf '%s\n' "$PASTEB_REPORT" | grep -qF 'Resources: 5 imported, 0 added, 0 changed, 0 destroyed.'
      && printf '%s\n' "$PASTEB_REPORT" | grep -qx 'POST_PLAN_EXIT=0' && echo PASTEB_OK
    expected: >-
      The operator reports Apply complete! Resources: 5 imported, 0 added, 0 changed, 0 destroyed. and POST_PLAN_EXIT=0.
    fix_if: >-
      An apply error: stop; state may hold some of the five. Run step 12's check against theseus and against
      agent-platform to see which, restore the rollback version on the operator's word if mixed, and RCA (Decision 55);
      never retry blindly. POST_PLAN_EXIT=2: a live diff appeared after import; do not apply, escalate.
  - step: 12
    phase: post-deploy
    action: ADMIN, read-only -- verify from the live state object, not from the operator's report.
    command: >-
      aws s3 cp s3://agent-platform-data-lake/tfstate/github/terraform.tfstate - --profile agent_platform_admin --only-show-errors
      | bin/venv-python -c "import json,sys; w=sys.argv[1]; s=json.load(sys.stdin); K={('github_repository','this'):'name',('github_repository_ruleset','main_protection'):'repository',('github_actions_repository_permissions','this'):'repository',('github_workflow_repository_permissions','this'):'repository',('github_repository_environment','tf_gated_apply'):'repository'}; I={('github_repository','this'):w,('github_actions_repository_permissions','this'):w,('github_workflow_repository_permissions','this'):w,('github_repository_environment','tf_gated_apply'):w+':tf-gated-apply'}; F={(r['type'],r['name']):r['instances'][0]['attributes'] for r in s.get('resources',[]) if r.get('mode')=='managed' and (r['type'],r['name']) in K}; ok=[k for k,a in F.items() if a.get(K[k])==w and a.get('id')==I.get(k,a.get('id'))]; st=w!='agent-platform' and any('agent-platform' in json.dumps(a) for a in F.values()); print('STATE_KEYED',w,'count=%d'%len(ok),'resources=%d'%len(F),'stale' if st else 'clean'); assert len(ok)==5 and len(F)==5 and not st" theseus
    expected: >-
      Prints STATE_KEYED theseus count=5 resources=5 clean: every one of the five instances keyed on theseus with the expected
      ids, and no agent-platform string left in them.
    fix_if: 'Anything else: restore the rollback version on the operator''s word and escalate.'
  - step: 13
    phase: post-deploy
    action: >-
      E2 -- a fresh PR-time plan run on the PR that gave E0 (Order A: the build PR; Order B: the workflow PR). A GitHub
      re-run reuses the original merge commit, which is enough when only state changed since that run (imports.tf is a
      no-op once the five are in state): mcp__github__actions_run_trigger rerun_workflow_run. If main has since changed
      any other terraform/github config, update that PR from main instead (the push starts a fresh run). Fetch the new
      job log into $E2_LOG and check it.
    command: >-
      L="$(grep -o 'TF_GITHUB_PLAN_REPORT [A-Za-z0-9=_. -]*' "$E2_LOG" | tail -1)" && echo "$L"
      && echo "$L" | grep -qE 'import=0 add=0 change=0 destroy=0 replace=0 gated=[01] ' && echo "$L" | grep -q 'conflict=0'
      && { echo "$L" | grep -q 'gated=0' || grep -Eq 'ruleset_bypass_actors[=: ]+hidden' "$E2_LOG"; } && echo E2_OK
    expected: >-
      E2_OK: 0 to import, add, change, destroy and replace, conflict 0; gated 0, or 1 only with ruleset_bypass_actors
      hidden (the operator's step 11 re-plan, which sees it, is authoritative for that field and for
      security_and_analysis).
    fix_if: >-
      Any change: compare its attribute names with step 11 (the PAT re-plan). A change the PAT plan does not show is an
      App visibility gap: record it as a declared exception only if it is bypass_actors, otherwise escalate. A change
      both show: escalate; never apply to converge.
  - step: 14
    phase: post-deploy
    action: >-
      Post the counts-only evidence comment on the merged build PR (V3 resolution), then save the PR's comments with
      mcp__github__pull_request_read (get_comments) into $BUILD_PR_COMMENTS and check it is there.
    command: grep -q 'STATE RECONCILE EVIDENCE' "$BUILD_PR_COMMENTS" && grep -q "$MERGE_SHA" "$BUILD_PR_COMMENTS" && echo EVIDENCE_POSTED
    expected: >-
      EVIDENCE_POSTED. The comment carries the marker line, the applied sha, E0 and E2 counts with run URLs, the
      operator's paste A and paste B counts with the date, and nothing else from CloudShell.
    fix_if: Post or correct the comment; never paste plan text, state content or any id other than the commit sha and run URLs.
  - step: 15
    phase: post-deploy
    action: >-
      Closure PR content, after the OIDC pre-stage build has merged: contract rows, rec pointer and the dated CLAUDE.md
      line; its own PR-time plan run reads 0 to change (E3).
    command: >-
      bin/venv-python -c "import yaml,pathlib; c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml',encoding='utf-8'));
      rows=[r for r in c['evidence_ledger'] if r['gate']=='prerequisites.terraform-github-state-reconciled'];
      assert len(rows)>=2, rows; row=[b for b in c['breakage_map'] if b['id']=='terraform_github_root'][0];
      assert row['rec'].startswith('rec-') and row['rec']!='rec-3136', row['rec'];
      assert any('PLAN-terraform-github-state-reconcile' in a['summary'] for a in c['amendment_log']);
      t=pathlib.Path('terraform/github/CLAUDE.md').read_text(encoding='utf-8'); assert 'Reconciled 20' in t;
      print('CLOSURE_OK', len(rows), row['rec'])"
    expected: >-
      CLOSURE_OK with the row count and the follow-on rec id; the closure PR's PR-time plan run reads import=0 add=0
      change=0 destroy=0 replace=0 (same gated rule as step 13).
    fix_if: >-
      Restore the approved texts from execution_steps step 11 (variance: dates, run URLs, the follow-on rec id, the
      bypass sentence present or absent as observed). If the CLAUDE.md budget no longer fits the line because another
      change grew the file, escalate to the planning thread; never raise the budget.
  - step: 16
    phase: post-deploy
    action: rec-3136 closed by the closure PR's Resolves trailer, with its acceptance holding at the closing sha.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-3136'); print(r['status']);
      assert r['status']=='closed', r['status']" && grep -q 'state rm github_repository.this' terraform/github/CLAUDE.md
      && grep -q 'reconcil' terraform/github/CLAUDE.md
    expected: Prints closed; both greps hold on main.
    fix_if: >-
      Still open: the squash body lacked a standalone 'Resolves: rec-3136' line; close it through
      scripts.ops_data_portal update_rec citing the closure merge sha and the E2 run URL.
  - step: 17
    phase: post-deploy
    action: OPERATOR, AWS CloudShell -- remove the working directory (state backup, provider cache) once step 16 passes.
