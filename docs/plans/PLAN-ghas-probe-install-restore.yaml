pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Read only the plan-cited decision sections -- 83, 177, 151, 170, 169, 101 -- not all of DECISIONS.md
  - >-
    Read scripts/checks/ci_guards/_workflow_shell_bodies.py first -- the guard reuses its
    _iter_workflows walk and _step_identity grammar rather than adding a second walker
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Confirm PLAN-monitor-liveness-sweep has NOT already landed a conflicting
    config/ci_rca_taxonomy.yaml or docs/DECISIONS.md change; BOTH of this slice's PRs merge first
execution_steps:
  - >-
    Add a `pip install pyyaml` step to ghas-probe.yml's probe job, between the setup-python step and
    the probe run step. Do NOT touch the existing run line, do NOT use requirements.txt (ci.yml:
    66-68 documents it as a ~3GB disk-filling install), and do NOT use the backlog-health venv shape
    -- both break the additive property this plan's rollback depends on.
  - >-
    Write scripts/checks/ci_guards/validate_workflow_dependency_install.py, reusing
    _workflow_shell_bodies._iter_workflows and _step_identity. Encode BOTH predicates as DATA, not
    prose. INVOCATION set: `python -m scripts.`, `.venv/bin/python -m scripts.`, `bin/venv-python`
    -- with the rule that a match inside a quoted argument is NOT a step invocation (ci-rca.yml:464
    carries `bin/venv-python` inside an --allowedTools string). INSTALL set: `pip install -r
    requirements*.txt`, `pip install <pkgs>`, `pip install -e .[dev]`, `python -m venv`, and a
    composite-action install. Declare examined()/skipped() (Decision 170) and print
    "dependency-install guard: enforced over N job(s)" on the NON-VACUOUS branch with a DIFFERENT
    vacuous-branch literal -- VP step 3 asserts on the former, so it is a load-bearing output
    contract, not cosmetic.
  - >-
    Register the Entry in scripts/checks/ci_guards/_manifest.py and add the function_to_category row
    in config/ci_rca_taxonomy.yaml.
  - >-
    Write the tests: pass paths for ALL FOUR real install shapes, and red cases for
    install-after-invoke, install-in-a-different-job, no-install, and the quoted-argument false
    positive. Call the real check entrypoint, never a reimplemented assertion.
  - >-
    Add config/agent/verification_registry/entries/ghas-probe-dependency-install.yaml with
    check_id: ghas-probe-dependency-install, matching VP step 2's graduation_check_id verbatim.
  - >-
    Execute Verification Plan steps 1-4 -- run each; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - Commit, push, open the PR, and merge once CI is green.
  - >-
    AFTER the code PR merges: execute VP steps 5 and 6 (dispatch the probe, read its control
    states). The evidence cannot be written before the run that produces it.
  - >-
    Then open a SECOND PR from a NEW branch off post-merge main (never commit on main) carrying only
    the docs/DECISIONS.md change: the dated Decision 83 evidence citing step 5's run id, the
    annotation retiring the "sole Actions run id" parenthetical, and the reversal-stanza re-arm. Run
    VP step 7 on that branch. THIS follow-up PR is what must merge before slice 2 begins, since
    slice 2 also edits docs/DECISIONS.md.
  - 'Report: what was implemented, verification results, and the run id cited in the annotation.'
work_areas: []
rollback: >-
  The workflow change is a single additive step -- reverting it returns the probe to its current
  blind state, which is not a safe resting place, so prefer forward-fix (Decision 73). The new check
  can be disabled by removing its Entry from _manifest.py without touching any other check.
