execution_steps:
  - >-
    Add a `pip install pyyaml` step to ghas-probe.yml's probe job, between the setup-python step and
    the probe run step. Do NOT touch the existing run line, do NOT use requirements.txt (ci.yml:
    66-68 documents it as a ~3GB disk-filling install), and do NOT use the backlog-health venv shape
    -- both break the additive property this plan's rollback depends on.
  - >-
    Write scripts/checks/ci_guards/validate_workflow_dependency_install.py, reusing
    _workflow_shell_bodies._iter_workflows and _step_identity. Encode BOTH predicates as DATA, not
    prose. INVOCATION set, FOUR shapes: `python -m scripts.`, `python3 -m scripts.`,
    `.venv/bin/python -m scripts.`, `bin/venv-python`. `python3` is NOT covered by the `python`
    entry -- "python -m scripts." is not a substring of "python3 -m scripts." -- and reconcile.yml
    and terraform-apply-sandbox.yml invoke ONLY via python3, so omitting it silently under-enforces
    over a quarter of the invoking corpus and makes the same-body branch below unreachable on live
