schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: trailer-closure-evidence-gate
intent: >-
  Stop `rec-autoclose.yml` closing recs on the mere PRESENCE of a `Resolves:` trailer. Two
  evidenced failure shapes are cured here: a trailer honoured on a plan-only merge that fixes
  nothing, and a word-wrapped prose line parsed as a trailer. Decision 103's closed->open ban
  makes each false closure cost successor rec ids plus a corrective PR.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-closure-evidence-gate.yaml
phase: >-
  Ad-hoc rec-driven ops-data-integrity fix (soft-warn exception category `ad_hoc_rec`); names no
  tier_item, so the Tier Item Freshness Gate is skipped. Slice 1 of a two-slice split; slice 2 is
  rec-3984, which owns acceptance verification entirely.
scope:
  - file: scripts/rec_trailer.py
    action: Modify
    purpose: >-
      rec-2922. `parse_resolves_trailer` uses a MULTILINE `^resolves\s*:` regex matching ANY
      line-initial `Resolves:`, so a word-wrapped prose line parses as a trailer (#803 closed three
      recs from a commit whose body explicitly disclaimed closing anything). Replace it with a
      BLOCK rule: split the message on blank lines and accept `Resolves:` lines only from a block
      whose EVERY line is `Key: value`-shaped (`^[A-Za-z][A-Za-z-]*:\s`). Accept ANY such block,
      NOT only the final one -- measured over 600 commits on origin/main, a final-block-only rule
      parses just 43 of the 122 commits carrying a `Resolves:` line, because the mandated
      `Co-Authored-By:` / `Claude-Session:` attribution footer forms the final block; the any-block
      rule loses 6 and still returns [] for #803's shape (verified against commit 73387861).
  - file: scripts/ops_portal/closure_gate.py
    action: Modify
    purpose: >-
      DRY extraction, behaviour-preserving. `_fix_commit_touches` already runs
      `git diff-tree --no-commit-id --name-only -r <sha>`; lift it into a module-level
      `changed_files(sha, root) -> set[str] | None` (None = unresolvable sha, preserving the
      existing fail-closed posture) and call it from `_fix_commit_touches`. The merge-leg gate
      consumes the same helper so the repo never grows a second `diff-tree` invocation.
  - file: scripts/ops_portal/trailer_closure_gate.py
    action: Create
    purpose: >-
      New pure-predicate module in closure_gate.py's posture (resolve a fact or return a verdict;
      never write, file, retry or downgrade a status -- Decision 55/72). Holds
      `merge_leg_refuses(changed) -> bool`: True when the changed set is None, EMPTY, or entirely
      under `docs/plans/`. Empty refuses deliberately -- `git diff-tree -r` on a true (non-squash)
      merge commit lists nothing, and a fail-open there would reinstate the defect. Imports the
      shared helper; contains no `subprocess` of its own. Target ~70 effective lines.
  - file: scripts/ops_portal/ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      `close_recs_from_trailer` consults `merge_leg_refuses` ONCE per run, before the per-rec loop,
      and refuses the whole trailer when it fires. It prints a Decision-155-shaped marker, leaves
      every named rec OPEN, and DOES NOT touch exit_code. CRITICAL: do NOT reuse
      `_mirror_refusal_to_step_summary` verbatim -- it hardcodes
      `## [REC-AUTOCLOSE] Decision 186 closure refusal` as the heading, so a merge-leg refusal
      would file itself in $GITHUB_STEP_SUMMARY as a Decision 186 closure-ARTIFACT refusal and
      feed `print_ci_rca_back_validation`'s refused-rec listing under a heading it does not
      implement -- this plan's own defect class (a governance signal asserting something untrue)
      reproduced in its remedy. Parametrise the helper's heading and add TWO distinct module-level
      constants: `_MERGE_LEG_REFUSAL_MARKER` for the plan-only arm and a separate one for the
      empty/None arm, so a future shift to true merge commits (which would make EVERY autoclose
      refuse while the workflow stays green by design) is greppable apart from a normal plan-leg
      refusal -- the loud-not-red posture the Decision 186 `ClosureArtifactRequired`
      catch already uses, because rec-autoclose sits in ci-rca.yml's watched set and reddening it
      would file a spurious critical ci_rca rec for correct behaviour. 364 effective lines today
      (136 headroom); keep it under 500 (Decision 128).
  - file: .github/workflows/rec-autoclose.yml
    action: Modify
    purpose: >-
      Header-comment only: document that a trailer whose merge diff is confined to `docs/plans/` is
      refused. The inline `run:` body is NOT touched -- its
      `autoclose::close-resolved-recs-from-resolves-trailer` key is pinned at 37 lines by the
      Decision 162 R3 ratchet, which is why the logic is importable Python. The comment also
      satisfies rec-3901's own acceptance grep for `docs/plans` in this file.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      `resolves_trailer` today says only "include in the squash-merge commit body" -- no carrier and
      no placement rule. Add BOTH, or the contract and the tightened parser contradict each other on
      day one. (i) CARRIER (rec-3901): the trailer belongs only on the IMPLEMENTATION merge; a plan
      merge carries none. (ii) PLACEMENT (rec-2922): it must sit in a block whose every line is
      `Key: value`-shaped -- never mid-paragraph -- and it may precede the attribution footer.
      Per Decision 168 and T2.54:c1 both clauses cite `validate_rec_autoclose_trailer_gate` as their
      enforcing evaluator so neither lands orphaned. MANDATORY COMPANION: this is a `class: D`
      contract and `resolves_trailer` is a top-level key, so changing its canonical dump without a
      new `amendment_log[]` entry FAILS `validate_contract_drift`
      (contract-population.yaml#change_detection.amendment_log). Add a dated entry
      (`date` / `semantic_break` / `change_class: field_add` / `summary`) and bump
      `contract_version` 1 -> 2, per this file's own convention.
  - file: scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py
    action: Create
    purpose: >-
      Registered `--pre` check pinning the delegation shape: rec-autoclose.yml still delegates to
      `close_recs_from_trailer`; that function references the merge-leg gate; and git-ops.yaml
      carries both new clauses. Per Decision 168 point 2 it must READ `docs/contracts/git-ops.yaml`
      (the basename present as an executable-context string literal) rather than hardcoding clause
      text, or the evaluator does not resolve. Must declare an examined()/skipped() outcome
      (Decision 170 -- `validate_check_accounting` runs in both tiers with no marker escape).
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Register the check as a bare string-literal `Entry` (Decision 169 / check-manifest.yaml) with
      `pre=True` and `full_segment="full_after_lint"` (17 of the domain's 18 entries use it; do not
      copy the lone `full_after_dependency_health` outlier). `pre_globs` MUST cover its whole import
      closure or `validate_pre_glob_closure` fails the PR with an uncovered-closure fail-open:
      `.github/workflows/**`, `scripts/ops_portal/**`, `docs/contracts/git-ops.yaml`,
      `scripts/checks/ci_guards/**`, AND `scripts/checks/_common.py` plus
      `scripts/checks/registry.py` -- every glob-gated ci_guards entry declares those last two,
      because any registered check imports `registry` and in practice `_common` for ROOT, and
      neither is matched by `scripts/checks/ci_guards/**`.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      A new check module obligates a `function_to_category` row (plan_obligations, enforced by
      validate_ci_rca_taxonomy): map `validate_rec_autoclose_trailer_gate` to its failure category
      so a red run classifies instead of falling through.
  - file: config/agent/verification_registry/entries/
    action: Create
    purpose: >-
      One graduated registry shard per `graduate` VP step, using each step's `graduation_check_id`
      verbatim as the row identity (Decision 132 / 176). `plan_obligations` reports this as
      "enforced elsewhere" by validate_graduation_completeness, so no mechanical check catches its
      omission from Scope -- it is listed explicitly for that reason.
  - file: tests/test_rec_trailer.py
    action: Modify
    purpose: >-
      Adds `TestWrappedProseNotATrailer` (rec-2922's named selector -- #803's shape, a `Resolves:`
      line wrapped inside a prose paragraph) and `TestPlanOnlyMergeRefusesTrailer` (rec-3901's named
      selector). Critically also adds `TestAttributionFooterStillParses`, a REGRESSION case pinning
      this repository's real commit shape -- a `Resolves:` block followed by a blank line and the
      `Co-Authored-By:` / `Claude-Session:` footer -- as STILL PARSING, so the any-block rule cannot
      silently regress to final-block-only. NON-VACUITY REQUIREMENT for
      `TestPlanOnlyMergeRefusesTrailer`: `parse_resolves_trailer` is a pure parser with no notion of
      a merge leg, and a plan merge's trailer is well-formed and SHOULD parse -- so a test that only
      calls the parser would be vacuous while still greening rec-3901's acceptance. It must assert
      the END-TO-END outcome: given a well-formed trailer AND a plan-only changed set,
      `merge_leg_refuses` returns True and no close is attempted. Import the gate here rather than
      re-testing the parser.
  - file: tests/ops_portal/__init__.py
    action: Create
    purpose: >-
      `tests/ops_portal/` does not exist yet; Decision 131 point 4 requires every mirror test
      package to carry an `__init__.py`. No check enforces it today, so it is named here rather
      than left to be discovered.
  - file: tests/ops_portal/test_trailer_closure_gate.py
    action: Create
    purpose: >-
      Mirror-named home (Decision 131) for the gate's own unit coverage: `merge_leg_refuses` over a
      plan-only set (refuses), a mixed set (proceeds), a code-only set (proceeds), and the empty /
      None sets (refuse, fail-closed); plus `changed_files` returning None on an unresolvable sha
      and `_fix_commit_touches` keeping its behaviour through the extraction.
  - file: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    action: Create
    purpose: >-
      The `test_<module>.py` mirror the ci_guards domain names uniformly (Decision 131): the check
      fails on each removal (workflow stops delegating; gate unreferenced; either git-ops clause
      absent) and passes intact, and declares an examined()/skipped() outcome.
  - file: tests/checks/ci_guards/test_rec_autoclose_merge_leg.py
    action: Create
    purpose: >-
      The path rec-3775's own acceptance command names, so the rec closes on its own terms: an
      end-to-end assertion that `close_recs_from_trailer` leaves every named rec OPEN on a
      plan-only changed set and closes them on a code-bearing one, with the warehouse boundary
      stubbed (the shape tests/ci_rca/test_close_recs_from_trailer.py already established).
bundled_recommendations:
  - rec-3775
  - rec-3901
  - rec-2922
followon_recs:
  - rec-3984
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A squash-merge whose entire diff is under `docs/plans/` closes NO rec named in its `Resolves:`
    trailer; each is left open with a greppable refusal marker in the step summary.
  - >-
    An unresolvable or empty changed-file set also refuses, so a true merge commit cannot fail open.
  - >-
    A commit body carrying a line-wrapped `Resolves:` inside a prose paragraph yields zero trailer
    ids, so #803's shape cannot recur.
  - >-
    A commit body carrying a `Resolves:` block followed by the mandated attribution footer STILL
    yields its ids -- the tightening must not break this repository's own commit convention.
  - >-
    The merge-leg refusal does not change the workflow's exit code, so rec-autoclose stays green
    and files no spurious source=ci_rca rec for a correct refusal.
  - >-
    `docs/contracts/git-ops.yaml` states both the carrier rule and the placement rule, and each
    cites its enforcing check.
  - >-
    Exactly one `diff-tree` invocation exists across closure_gate.py and trailer_closure_gate.py.
  - rec-3775, rec-3901 and rec-2922 are closed by this plan's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The shared helper exists and there is exactly one diff-tree call site
    command: grep -q "def changed_files" scripts/ops_portal/closure_gate.py && test 1 -eq $(grep -ho '"diff-tree"' scripts/ops_portal/closure_gate.py scripts/ops_portal/trailer_closure_gate.py | wc -l)
    expected: >-
      The helper is defined, and the argv literal "diff-tree" appears exactly once across both
      modules -- counting the real invocation, not prose. closure_gate.py mentions git diff-tree
      three times in docstrings and comments while invoking it once, which is why the assertion
      counts the quoted argv token rather than the prose spelling.
    fix_if: >-
      Two occurrences means the gate grew its own subprocess call instead of consuming the helper.
      Do not green this by deleting docstring prose -- the assertion counts argv literals only.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-gate-single-diff-tree-call-site
  - step: 2
    phase: pre-deploy
    action: The merge-leg gate exists and the closure caller consults it
    command: test -f scripts/ops_portal/trailer_closure_gate.py && grep -q "trailer_closure_gate" scripts/ops_portal/ci_rca_lifecycle.py && grep -q "merge_leg_refuses" scripts/ops_portal/ci_rca_lifecycle.py
    expected: Module present and referenced from close_recs_from_trailer -- not defined and left unwired.
    fix_if: An unreferenced module means the caller still closes unconditionally.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-gate-wired-into-closure-caller
  - step: 3
    phase: pre-deploy
    action: The gate's own unit coverage, including the fail-closed empty/None cases
    command: bin/venv-python -m pytest "tests/ops_portal/test_trailer_closure_gate.py" -q
    expected: Plan-only refuses; mixed and code-only proceed; empty and None refuse; the extraction is behaviour-preserving.
    fix_if: If the empty set proceeds, the gate fails OPEN on a true merge commit -- the defect reinstated.
    hermetic: false
    graduation: graduate
    graduation_check_id: trailer-gate-merge-leg-predicate
  - step: 4
    phase: pre-deploy
    action: The trailer parser refuses prose but still accepts this repo's real commit shape
    command: bin/venv-python -m pytest "tests/test_rec_trailer.py" -q -k "TestWrappedProseNotATrailer or TestPlanOnlyMergeRefusesTrailer or TestAttributionFooterStillParses"
    expected: >-
      All three new classes pass. The -k narrowing is load-bearing, not cosmetic: the unnarrowed
      file passes today (21 tests), which Decision 189's red-before leg classifies as tautological
      and hard-fails on this plan's own PR. Narrowed, it is target_absent until the classes exist.
      TestParseResolvesTrailer regression coverage rides step 9's full --pre run instead.
    fix_if: >-
      If the attribution-footer case returns [], the rule has collapsed to final-block-only -- which
      breaks 79 of 122 historical Resolves commits and this plan's own closure path.
    hermetic: false
    graduation: graduate
    graduation_check_id: rec-trailer-key-value-block-semantics
  - step: 5
    phase: pre-deploy
    action: End-to-end -- a plan-only merge leaves the trailer's recs open, a code merge closes them
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_rec_autoclose_merge_leg.py" "tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py" "tests/checks/ci_guards/test__workflow_shell_bodies.py" -q
    expected: Refusal leaves recs OPEN with exit 0; the check fails on each removal; the body ratchet is clean.
    fix_if: A non-zero exit on refusal would redden rec-autoclose and file a spurious critical ci_rca rec.
    hermetic: false
    graduation: graduate
    graduation_check_id: rec-autoclose-merge-leg-refusal-end-to-end
  - step: 6
    phase: pre-deploy
    action: The workflow documents the plan-leg refusal (rec-3901's own acceptance predicate)
    command: grep -q "docs/plans" .github/workflows/rec-autoclose.yml
    expected: Present in the header comment; the inline run body unchanged.
    fix_if: Absent means rec-3901's acceptance fails and the rec cannot close on its own terms.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-autoclose-documents-plan-leg-refusal
  - step: 7
    phase: pre-deploy
    action: The contract states carrier AND placement, each citing its evaluator
    command: grep -qi "implementation merge" docs/contracts/git-ops.yaml && grep -qiE "key:[[:space:]]*value" docs/contracts/git-ops.yaml && grep -q "validate_rec_autoclose_trailer_gate" docs/contracts/git-ops.yaml && grep -qE "contract_version:[[:space:]]*2" docs/contracts/git-ops.yaml
    expected: >-
      Both clauses present, both naming the enforcing check (Decision 168 / T2.54:c1), and the
      contract_version bumped alongside its amendment_log entry.
    fix_if: >-
      A placement rule in code but not in the contract is the contradiction this step exists to
      prevent; a clause with no named evaluator is the orphan T2.54:c1 exists to eliminate.
    hermetic: true
    graduation: graduate
    graduation_check_id: git-ops-trailer-carrier-and-placement-rules
  - step: 8
    phase: pre-deploy
    action: The check is registered, classified, declares its outcome, and the body ratchet holds
    command: grep -q "validate_rec_autoclose_trailer_gate" scripts/checks/ci_guards/_manifest.py && grep -q "validate_rec_autoclose_trailer_gate" config/ci_rca_taxonomy.yaml && grep -qE "examined\(|skipped\(" scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py && bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)"
    expected: Registered in manifest and taxonomy, declaring an examined()/skipped() outcome, with no unbaselined R1/R2/R3 violation.
    fix_if: A ratchet violation means logic leaked into the workflow body; move it into the gate module.
    hermetic: false
    graduation: graduate
    graduation_check_id: trailer-gate-registered-classified-and-ratchet-clean
  - step: 9
    phase: pre-deploy
    action: Fast presubmit gate
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0 with no entries under "Failed checks".
    fix_if: >-
      Read the summary, not the exit code -- `--pre` is advisory outside CI (Decision 73) and exits
      0 while printing failures. Fix on the branch; ci-rca watches main only.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full-tier validation before handoff, as handoff_policy requires
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 -- the complete tier (ruff, mypy, pytest, DQ runner, verifier harness) passes.
    fix_if: >-
      handoff_policy.timeout_disposition is `blocked` -- on a timeout, resume later and rerun the
      full tier from the start rather than treating a partial pass as green.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: The three bundled recs reached terminal status through the trailer this plan gates
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()]; bad=[i for i in ('rec-3775','rec-3901','rec-2922') if not any(r.get('id')==i and r.get('status')=='closed' for r in rows)]; raise SystemExit(1 if bad else 0)"
    expected: >-
      All three closed. This merge carries code, so the merge-leg gate permits it, and the trailer
      sits in a Key:value block ahead of the attribution footer, so the tightened parser reads it.
    fix_if: >-
      If all three stayed open, the parser rejected this plan's OWN trailer -- check the attribution
      footer regression case (step 4) before re-driving. A refusal on a plan-only merge is the gate
      working; a refusal here is not.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: rec-3867 stays open, its acceptance unsatisfied by this slice
    command: bin/venv-python -c "import json; rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()]; r=next(x for x in rows if x.get('id')=='rec-3867'); raise SystemExit(0 if r['status']=='open' else 1)"
    expected: Open. This slice implements no acceptance verification, so nothing about rec-3867 is satisfied.
    fix_if: If it closed, something closed a rec whose work was never done -- this plan's own defect class.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/rec_trailer.py
    behavior: >-
      A `Resolves:` line inside a prose paragraph yields no ids, while a `Resolves:` block followed
      by the attribution footer still yields its ids.
    verification_step: 4
    test_selector: tests/test_rec_trailer.py
    red_green_expectation: >-
      Red before: the MULTILINE regex matches the wrapped line and returns ids. Green after: prose
      returns [] and the real-repo footer shape still parses.
  - source: scripts/ops_portal/trailer_closure_gate.py
    behavior: >-
      merge_leg_refuses is True for a plan-only, empty or None changed set and False for any set
      carrying a non-plan path.
    verification_step: 3
    test_selector: tests/ops_portal/test_trailer_closure_gate.py
    red_green_expectation: >-
      Red before: the module does not exist, so collection fails. Green after: all five cases pass.
  - source: scripts/ops_portal/closure_gate.py
    behavior: >-
      changed_files returns the commit's paths and None for an unresolvable sha; _fix_commit_touches
      keeps its fail-closed behaviour through the extraction.
    verification_step: 3
    test_selector: tests/ops_portal/test_trailer_closure_gate.py
    red_green_expectation: >-
      Red before: the helper does not exist. Green after: extraction is behaviour-preserving.
  - source: scripts/ops_portal/ci_rca_lifecycle.py
    behavior: >-
      close_recs_from_trailer leaves every named rec OPEN on a plan-only merge and returns exit 0.
    verification_step: 5
    test_selector: tests/checks/ci_guards/test_rec_autoclose_merge_leg.py
    red_green_expectation: >-
      Red before: the caller closes unconditionally, so the still-open assertion fails. Green after:
      open, exit 0, marker emitted.
  - source: scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py
    behavior: >-
      The check fails when the workflow stops delegating, when the gate is unreferenced, or when
      either git-ops clause is absent.
    verification_step: 5
    test_selector: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    red_green_expectation: >-
      Red before: the check module does not exist. Green after: it fails on each removal and passes intact.
  - source: .github/workflows/rec-autoclose.yml
    behavior: >-
      The workflow header documents the plan-leg refusal, which is rec-3901's own acceptance predicate.
    verification_step: 6
    command: grep -q "docs/plans" .github/workflows/rec-autoclose.yml
    red_green_expectation: >-
      Red before: the file contains no `docs/plans` mention, so the grep exits 1. Green after: present.
  - source: docs/contracts/git-ops.yaml
    behavior: >-
      resolves_trailer states the carrier rule and the placement rule, each citing its enforcing check.
    verification_step: 7
    command: grep -qi "implementation merge" docs/contracts/git-ops.yaml
    red_green_expectation: >-
      Red before: the contract states neither rule. Green after: both present with their evaluator named.
  - source: config/ci_rca_taxonomy.yaml
    behavior: >-
      The new check has a function_to_category row so a red run classifies rather than falling through.
    verification_step: 8
    command: grep -q "validate_rec_autoclose_trailer_gate" config/ci_rca_taxonomy.yaml
    red_green_expectation: >-
      Red before: no row names the check. Green after: present and accepted by validate_ci_rca_taxonomy.
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: >-
      The check is registered as a bare string-literal Entry so scripts.validate actually dispatches it.
    verification_step: 8
    command: grep -q "validate_rec_autoclose_trailer_gate" scripts/checks/ci_guards/_manifest.py
    red_green_expectation: >-
      Red before: no such Entry, so the check never runs. Green after: registered and dispatched.
  - source: config/agent/verification_registry/entries/
    behavior: >-
      Each graduate VP step has a registry shard keyed by its graduation_check_id.
    verification_step: 10
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      Graduation completeness is enforced by validate_graduation_completeness inside the full tier,
      not by a per-shard unit test; a bespoke mirror test would duplicate that gate without adding
      discrimination.
constraints:
  - No rescue agents or workaround loops (Decision 55); the gate refuses and surfaces, never remediates.
  - >-
    Single Portal Invariant (Decision 84): closure writes stay `update_rec`-only. The gate decides
    whether to CALL it; it never writes, and never touches anything under logs/.
  - >-
    Loud-not-red is mandatory. The refusal must not set exit_code -- rec-autoclose is in ci-rca.yml's
    watched set, so a red run files a spurious critical rec for correct behaviour.
  - >-
    Decision 128 headroom, measured with the gate's own formula (non-blank, non-comment-only lines):
    ci_rca_lifecycle.py 364 (136 free), closure_gate.py 238 (262 free), rec_trailer.py 26 (474 free).
    No decomposition is owed at this size; if a delta threatens 500, decompose -- never register a raise.
  - >-
    Do not touch the workflow's inline `run:` body -- pinned at 37 lines by the Decision 162 R3
    ratchet. Logic belongs in importable Python.
  - >-
    Decision 170: the new check must declare an examined()/skipped() outcome, or
    validate_check_accounting fails the PR (both tiers, no marker escape).
  - >-
    Decision 168 point 2: the check must READ docs/contracts/git-ops.yaml -- the basename present as
    an executable-context string literal -- or the evaluator does not resolve.
