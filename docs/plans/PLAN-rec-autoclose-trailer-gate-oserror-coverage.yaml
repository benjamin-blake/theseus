schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: rec-autoclose-trailer-gate-oserror-coverage
intent: >-
  Close rec-3991, the open Critical source=ci_rca rec that currently hard-blocks every /plan
  session in this repository, by covering the one untested limb it names -- _read's
  "except OSError: return None" fallback in the rec-autoclose trailer merge-leg gate -- and by
  leaving a fix-bound, still-red-on-reintroduction closure artifact behind it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-rec-autoclose-trailer-gate-oserror-coverage.yaml
phase: >-
  Soft-warn exception category ci_rca; names NO tier_item, so the Tier Item Freshness Gate is
  skipped. The work advances no exit criterion of any roadmap item -- it repairs a defect filed
  against scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py by the ci-rca agent.
  Precedent: PLAN-trailer-closure-evidence-gate (the plan that landed the module under repair)
  scoped itself the same way. T3.9 (post-merge recommendation reconciliation) is the
  semantically nearest tier_item and is deliberately NOT claimed.
scope:
  - file: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      Add exactly one test, named test_read_returns_none_on_oserror, to the EXISTING
      TestRemovalNegatives class. The name and class are load-bearing: rec-3991's own acceptance
      command is
      "bin/venv-python -m pytest tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestRemovalNegatives::test_read_returns_none_on_oserror -q",
      so any other name or class makes the rec unsatisfiable. The test patches
      pathlib.Path.read_text to raise OSError (patch.object(pathlib.Path, "read_text",
      side_effect=OSError(...)) inside a registry.outcome_scope), invokes
      validate_rec_autoclose_trailer_gate(failed), and asserts BOTH limbs of the unreadable-source
      outcome: failed gains the "could not read" entry AND registry.pop_declaration() returns
      kind == "skipped". It must NOT patch this module's own _read binding -- every one of the
      five existing negatives does, which is exactly why lines 37-38 are uncovered. Measured
      SLOC 79 with 421 headroom to the 500 limit; the addition is ~18 lines, so no
      config/sloc_budgets.yaml entry and no raise (Decision 128/165).
  - file: config/agent/verification_registry/entries/rec-autoclose-trailer-gate-read-oserror.yaml
    action: Create
    purpose: >-
      Graduate VP step 1 into the verification registry as a test_selector shard so the new test
      becomes a standing regression guard AND so rec-3991's closure has a `shard:` artifact --
      the strongest closure_gate.KIND_STRENGTH member and the only kind Decision 186 point 4
      calls still-red-on-reintroduction. Fields mirror the closure-stamp-applicable-seam and
      ghas-probe-dependency-install precedents: check_id (== VP step 1's graduation_check_id),
      primitive_slot test_selector, guard_target
      scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py, guard_symbol _read,
      plan_slug rec-autoclose-trailer-gate-oserror-coverage, graduated_at, graduated_by, and
      check_spec.node_id set to the exact node id above. This file is the shard's defining file
      under the contract's per_kind_defining_file map, so creating it in the same squash-merge
      that lands the test is what makes the artifact resolve FIX-BOUND (Decision 186 point 4).
bundled_recommendations:
  - rec-3991
followon_recs:
  - rec-3996
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestRemovalNegatives::test_read_returns_none_on_oserror
    exists and passes -- rec-3991's acceptance command is satisfied verbatim, with no rename and
    no relocation to another class or file.
  - >-
    The new test drives the REAL _read helper: it raises OSError from pathlib.Path.read_text and
    does not patch the module's own _read binding, so lines 37-38 are genuinely executed rather
    than bypassed.
  - >-
    The test asserts BOTH limbs of the unreadable-source outcome -- a non-empty failed list
    carrying the "could not read" entry, and a registry declaration whose kind is "skipped". A
    test that merely reaches lines 37-38 without asserting the outcome does not satisfy this.
    NOT DISCRIMINATED BY ANY VP STEP IN THIS PLAN, and deliberately flagged as such: an
    assertion-free test that injects the OSError would still pass VP step 1 (exit 0, "1 passed"),
    still pass VP step 2 (lines 37-38 execute, so coverage reaches 100%), and would still be
    ADMITTED by the shard's differential gate. Physical PRESENCE of the two assertions is
    greppable in principle (a grep_count would express it), but presence is not the same property
    as asserting the right outcome, so this criterion is routed to CODE-REVIEW: the reviewer reads
    the test body and confirms both assertions are present and correct. Do not mark it met on the
    strength of a green VP.
  - >-
    scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py reports 100% line coverage
    with an empty Missing column when measured under that test file alone (49 statements, 0
    missed). Measured today at authoring time: 96%, missing 37-38.
  - >-
    The eight pre-existing tests in the file still pass unchanged, and no other file's coverage
    or test outcome regresses.
  - >-
    config/agent/verification_registry/entries/rec-autoclose-trailer-gate-read-oserror.yaml
    exists and is ADMITTED by validate_verification_registry's differential admission gate --
    the materialized check_spec fails at origin/main and passes at HEAD, never tautological and
    never skipped.
  - >-
    rec-3991 is status=closed in the warehouse with context_v2_json.closure_artifact ==
    "shard:rec-autoclose-trailer-gate-read-oserror" AND context_v2_json.fixed_by_sha set, both
    stamped by a SINGLE update_rec call, and the next session preflight reports an empty
    ci_rca_unresolved_recs list.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run rec-3991's own acceptance command verbatim -- the new OSError-injection test drives the
      real _read helper and passes.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestRemovalNegatives::test_read_returns_none_on_oserror -q
    expected: >-
      Exit 0 with a "1 passed" summary line. Measured on the un-implemented tree at authoring
      time this command exits 4 ("ERROR: not found ... no match in any of [<Class
      TestRemovalNegatives>]"), which scripts.checks.verification._vp_replay_classify
      classifies target_absent -- a valid Decision 189 red-before outcome, confirmed live.
    expected_literals:
      - "1 passed"
    fix_if: >-
      Exit 4 after implementation means the test was named or placed differently -- the name and
      class are fixed by rec-3991's acceptance string and cannot be changed. A pass that leaves
      step 2 red means the test patched the module's _read binding instead of
      pathlib.Path.read_text, so lines 37-38 were never executed.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-autoclose-trailer-gate-read-oserror
  - step: 2
    phase: pre-deploy
    action: >-
      Measure per-file line coverage of the guard module under its mirror test file alone and
      require 100% with an empty Missing column.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py -q --no-header --cov=scripts.checks.ci_guards.validate_rec_autoclose_trailer_gate --cov-report=term-missing --cov-fail-under=100
    expected: >-
      Exit 0, "9 passed", a coverage table row reading 49 statements, 0 missed, 100% with nothing
      in the Missing column, and the success line "Required test coverage of 100% reached."
      Measured at authoring time on the un-implemented tree: exit 1, 8 passed, 49 statements, 2
      missed, 96%, Missing 37-38, and "FAIL Required test coverage of 100% not reached. Total
      coverage: 95.92%". The literal is deliberately the full "... 100% reached" phrase, not the
      bare "100%": the bare form appears in the FAILING output too ("of 100% not reached") and so
      asserts nothing, while the full phrase is absent from it -- both verified by substring test
      at authoring time, and the success wording itself was observed live by running the same
      command with a satisfiable --cov-fail-under.
    expected_literals:
      - "Required test coverage of 100% reached"
    fix_if: >-
      A residual Missing entry naming 37-38 means the OSError never reached the real _read. A
      100% figure achieved while step 1 fails means the coverage came from some other test --
      re-read which test entered the branch before accepting the number.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the check VP step 1 already graduates. The standing guard against this defect
      recurring is the shard rec-autoclose-trailer-gate-read-oserror, whose test_selector fails
      the moment the OSError test is deleted -- which is precisely what would drop these two
      lines back out of coverage. A second standing guard asserting the derived 100% figure would
      restate that same fact at narrower scope (the rubric's "duplicates an already-graduated
      check" waive case, and the duplication Decision 86 forbids). Deliberately NOT justified by
      validate_test_coverage: that check derives its file set from the diff, and this PR does not
      modify the guard module, so it will not measure it here (plan-critique round 2, finding 2).
      The step stays in the VP as this plan's own red-to-green measurement.
  - step: 3
    phase: pre-deploy
    action: >-
      Run the fast presubmit tier, which is where the new shard's differential admission gate and
      the graduation-completeness legs actually fire.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      The printed summary reports zero failed checks. validate_verification_registry (pre=True,
      pre_globs include config/agent/verification_registry/**) runs the VF-06 differential for
      the newly added shard and must report it ADMITTED; validate_graduation_completeness must
      pass both legs; validate_plan_documents, validate_sloc_limits and validate_scope_boundary
      must all pass.
    fix_if: >-
      Read the summary, never the exit code -- Decision 73 makes --pre exit 0 while printing
      "Failed checks" outside CI. A "not admitted" differential means the shard's node id does
      not fail at origin/main; a "check does not pass on HEAD" means the test itself is red. An
      orphaned-shard failure means check_id and VP step 1's graduation_check_id disagree.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The command invokes scripts.validate, which docs/contracts/vp-red-before.yaml's
      recursion_refusal refuses statically for a graduate disposition, and Decision 73 makes its
      exit code meaningless outside CI (exit 0 while printing failures), so it is not expressible
      as a command_exit_zero kernel assertion. Its constituent checks are already registered.
  - step: 4
    phase: pre-deploy
    action: >-
      Run the full presubmit tier locally before handoff, as handoff_policy declares -- this is
      the tier that carries validate_test_coverage, the check whose post-merge failure filed
      rec-3991 in the first place.
    command: bin/venv-python -m scripts.validate
    expected: >-
      The printed summary reports zero failed checks. Note what the "Test coverage check" section
      can and cannot tell you here: it derives its file set from the diff, and this PR does not
      modify the guard module, so it will NOT re-measure that module on this branch. Its purpose
      at this step is to confirm the diff introduces no OTHER coverage regression; VP step 2 is
      the authoritative measurement of the guard module itself, and the post-merge full tier on
      main is where validate_test_coverage would have caught a recurrence.
    fix_if: >-
      A recurrence of "validate_rec_autoclose_trailer_gate.py: NN% line coverage (expected 100%)"
      means the fix did not take. Per handoff_policy.timeout_disposition, a timeout is BLOCKED --
      resume later and rerun the full tier from the start; never commit on a partial run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion refusal and Decision 73 exit-code caveat as step 3, at the full tier: the
      command invokes scripts.validate, which vp-red-before.yaml's recursion_refusal refuses
      statically for a graduate disposition, and its exit code is not a kernel assertion outside
      CI. Its constituent checks are each already registered in their own right.
  - step: 5
    phase: post-deploy
    action: >-
      RUN THIS ONLY AFTER the squash-merge has landed on main. Fetch origin/main, PROVE the
      resolved sha actually added the shard file, then close rec-3991 through the manual route
      with a fix-bound shard artifact -- rec-autoclose structurally cannot, because
      close_recs_from_trailer supplies no closure_artifact.
    command: >-
      git fetch origin main --quiet && SHARD=config/agent/verification_registry/entries/rec-autoclose-trailer-gate-read-oserror.yaml && test -f "$SHARD" && MERGE_SHA=$(git rev-list -1 origin/main -- "$SHARD") && test -n "$MERGE_SHA" && git diff-tree --no-commit-id --name-only -r "$MERGE_SHA" | grep -x "$SHARD" && bin/venv-python -m scripts.ops_data_portal --update-rec rec-3991 --status closed --resolution "Resolved by PLAN-rec-autoclose-trailer-gate-oserror-coverage: test_read_returns_none_on_oserror drives the real _read helper via a pathlib.Path.read_text OSError, covering lines 37-38 and returning the module to 100% line coverage." --closure-artifact "shard:rec-autoclose-trailer-gate-read-oserror" --closure-fix-sha "$MERGE_SHA" --profile agent_platform && bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;r=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];x=next(y for y in r if y['id']=='rec-3991');c=json.loads(x['context_v2_json']);print(x['status'],'|',c.get('closure_artifact'),'|',c.get('fixed_by_sha'));assert x['status']=='closed' and c.get('closure_artifact')=='shard:rec-autoclose-trailer-gate-read-oserror' and c.get('fixed_by_sha')"
    expected: >-
      MERGE_SHA resolves to the commit that ADDED the shard, the diff-tree guard echoes the shard
      path, the write succeeds, and the read-back prints closed, the shard token, and a
      fixed_by_sha equal to MERGE_SHA. The sha is derived FROM THE ARTIFACT
      (git rev-list -1 origin/main -- "$SHARD"), never from main's tip, and the single MERGE_SHA
      variable feeds both the guard and --closure-fix-sha so they can never disagree. Verified
      against a real precedent shard at authoring time: rev-list -1 still names the adding commit
      for closure-stamp-applicable-seam.yaml although main has advanced many merges since, and
      that sha's diff-tree lists the file.
    fix_if: >-
      TWO distinct failures, with different remedies -- do not apply the wrong one. (a) MERGE_SHA
      resolves EMPTY (rev-list prints nothing, exit 0, so `test -n` stops the chain): the
      squash-merge has not landed on origin/main yet. Wait for the merge, re-fetch, re-run. (b)
      MERGE_SHA resolves but names a commit that is not this plan's squash-merge -- possible only
      if a later commit also touched the shard, since main merges roughly every 30 minutes and
      rev-list -1 returns the MOST RECENT toucher. Decision 186 point 4 binds "added or modified",
      so a later modifying commit still resolves; if it is nonetheless the wrong fix attribution,
      name this plan's squash-merge sha explicitly and pass THAT to both the guard and
      --closure-fix-sha, which is exactly what closure_dependency.rec_2923_precedent does (it
      stamps the commit that actually fixed the defect, not a merge tip). The prohibition is
      narrow and survives both branches: never name a sha whose diff-tree does not carry the
      shard. Note that using main's tip is what this step deliberately avoids -- it would refuse
      PERMANENTLY once any other PR merges after this one, and no amount of re-fetching could
      recover it. Both closure flags MUST ride the same call (Decision 186 point 4); closing
      first and stamping afterwards no longer satisfies the route. A silent exit 0 with no output
      means the wrong entrypoint was used; scripts.ops_data_portal is the sanctioned one. Leave
      the bare `--sync` exactly as written: it takes NO --profile, because cli.py dispatches it as
      a parameterless sync() that uses the ambient AWS_PROFILE. Adding --profile there would be a
      call into a signature that does not exist -- do not "fix" the asymmetry with --update-rec.
    hermetic: false
  - step: 6
    phase: post-deploy
    action: >-
      Confirm the planning hard block is actually lifted -- the outcome this slice exists for.
    command: bin/venv-python -m scripts.session.preflight && bin/venv-python -c "import json;r=json.load(open('logs/.preflight-report.json'));u=r.get('ci_rca_unresolved_recs') or [];print('unresolved:',[x.get('id') for x in u]);assert all(x.get('id')!='rec-3991' for x in u)"
    expected: >-
      The preflight report's ci_rca_unresolved_recs no longer contains rec-3991. At authoring
      time it contained exactly one entry, rec-3991, so the expected steady state is an empty
      list.
    fix_if: >-
      rec-3991 still present means step 5's write did not land or the local read cache is stale;
      re-run the portal --sync and re-read, never edit logs/.recommendations-log.jsonl by hand
      (Single Portal Invariant).
    hermetic: false
test_obligations:
  - source: config/agent/verification_registry/entries/rec-autoclose-trailer-gate-read-oserror.yaml
    behavior: >-
      The shard's check_id equals VP step 1's graduation_check_id, and its materialized
      check_spec is admitted by the differential gate (fails at origin/main, passes at HEAD).
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Both properties are owned by registered checks -- validate_graduation_completeness fails on
      an orphaned shard or an unmatched graduate step, and validate_verification_registry runs
      the real VF-06 differential for every added-or-modified entry in the diff. A dedicated test
      would duplicate those registered verifiers over the same data rather than guard new
      behaviour (Decision 86). Mirrors the identical row in PLAN-ghas-probe-install-restore.
constraints:
  - >-
    NO "Resolves: rec-3991" trailer in the squash-merge commit body. rec-3991 is escape-classified
    on BOTH limbs (context_v2_json.escape_class == "no-edge" AND
    detection_gap.escape_mode == "tier_misplaced"), so Decision 186 point 1's predicate fires;
    close_recs_from_trailer threads closure_fix_sha but never closure_artifact, so the trailer
    would be REFUSED loud-not-red and leave the rec OPEN (Decision 186 point 7). This is a
    deliberate, contract-authorised departure from AGENTS.md's Resolves-trailer norm -- see
    docs/contracts/ci-rca-lifecycle.yaml closure_dependency.manual_route and its
    rec_2923_precedent.
  - >-
    Both closure flags ride the SAME update_rec call (Decision 186 point 4) -- the gate reads
    fixed_by_sha from the write it evaluates, so close-then-stamp-separately no longer satisfies
    the artifact route.
  - >-
    The artifact kind is shard:, the strongest closure_gate.KIND_STRENGTH member and the only one
    Decision 186 point 4 calls still-red-on-reintroduction. pytest:<nodeid> would also resolve
    fix-bound here and is deliberately not used.
  - >-
    Decision 170: validate_rec_autoclose_trailer_gate already declares examined()/skipped() on
    every reachable path. Do NOT add a new registered check, a new scripts/checks/ci_guards
    _manifest.py Entry, a new config/ci_rca_taxonomy.yaml function_to_category row, or a new
    check_accounting baseline entry.
  - >-
    Decision 131: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py is already
    the mirror home for the guard module. Do not create a second test file.
  - >-
    Decision 59 scope boundary: scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py is
    NOT in scope and its "except OSError: return None" limb stays exactly as written. rec-3991's
    preventive_action has TWO halves and BOTH are disposed here, so closing the rec discards
    neither (plan-critique round 2, finding 1). (1) PRIMARY, class-level: codify the
    OSError-injection negative-test obligation for every ci_guards module that reads via
    pathlib.Path.read_text inside a try/except OSError. DEFERRED, not declined -- it needs a new
    registered check, or a Class D contract clause plus a declared evaluator, which is far outside
    an XS test-only slice. Filed as rec-3996 and recorded in followon_recs, per the planning
    skill's Planning-time split clause. (2) The "as an alternative" refactor of _read (raise, or a
    discriminated Union[str, Exception]): DECLINED on the merits -- it is rec-3991's own stated
    alternative to the test rather than a newly-discovered defect, and the rec's acceptance
    command fixes the test-only route (decision-scout answer (c) concurred). An implementing agent
    must not refactor _read, and must not file a further rec for either half.
  - >-
    Scope the OSError patch to the validate_rec_autoclose_trailer_gate(failed) call only, inside a
    with block. A module- or session-scoped pathlib.Path.read_text patch would leak and redden
    unrelated tests under the suite's random ordering.
  - >-
    Decision 128/165/130: structural-size governance reaches tests/, but the test file is 79
    effective SLOC and unregistered (421 headroom to 500). Do not touch config/sloc_budgets.yaml
    and do not run --update-sloc-budgets -- no budget row and no raise-approved marker are owed.
  - >-
    Decision 159: do NOT reach for the coverage baseline. Baselining lines 37-38 would satisfy
    validate_test_coverage while leaving the limb untested and rec-3991's acceptance command
    unsatisfiable; the test is the only route that closes the rec.
  - >-
    Decision 132/176: VP step 1's graduate disposition obliges validate_graduation_completeness's
    implement leg to find a new-in-diff registry row whose plan_slug and check_id match the step,
    and Decision 176's re-grain fixes the record shape as one file per check_id at
    config/agent/verification_registry/entries/<check_id>.yaml. The filename MUST equal the
    check_id exactly, or both the shard: artifact and the graduation obligation fail.
  - >-
    Decision 73: --pre exits 0 while printing "Failed checks" outside CI. Read the summary, never
    the exit code.
  - >-
    Single Portal Invariant: every recommendation write goes through scripts.ops_data_portal.
    Never Edit or Write logs/.recommendations-log.jsonl; it is a read cache, never a write source.
  - >-
    Decision 55/72: forward-fix only. No rescue agents, no workaround loops, no --ignore-budget,
    no inline fix of any out-of-scope defect found along the way.
  - >-
    bin/venv-python never bare python/python3; Linux/bash only; line length 127; type hints
    required; no emojis; no em dashes.
