pre_implementation_checklist:
  - Branch confirmed not on main (harness-assigned session branch)
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (186, 189, 176, 132, 170, 163, 159, 142, 131, 130, 128/165, 103, 86, 84, 73, 72, 59, 55)
  - docs/contracts/ci-rca-lifecycle.yaml closure_obligation and closure_dependency read
  - Both files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Add test_read_returns_none_on_oserror to the EXISTING TestRemovalNegatives class in
    tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py. Import pathlib at module
    level alongside the existing unittest.mock import. Inside the test, open
    registry.outcome_scope("validate_rec_autoclose_trailer_gate") and
    patch.object(pathlib.Path, "read_text", side_effect=OSError("unreadable")) together, call
