pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- 'Only the plan-cited decision sections: Decisions 199, 207, 215 (full entries) and 177'
- VP steps 1 and 2 pass (the reader verbs build merged, deploy green, step 15 passed)
- The three approved texts in execution step 3 copied exactly
execution_steps:
- >-
  Run VP steps 1 and 2. If either fails, stop: the notes describe a build that is not yet on main. Record the reader
  verbs build PR number (#NNNN) and confirm the 207 test node name.
- >-
  In docs/DECISIONS.md, for each of Decisions 199, 207 and 215, insert one blank line and then the note below as a
  single physical line, immediately after the entry's last existing note line and before the blank line and `---`
  separator that end the entry. Replace YYYY-MM-DD with the landing date and #NNNN with the build PR number.
- |-
  The approved texts (verbatim):
  Decision 199: > **Update (YYYY-MM-DD):** clause 1 bounds derivations, not verbs: a window verb (sessions_window; operator ruling reader-k2 (a), 2026-10-04) is a bounded window of per-session derivations, each reading only its own session's calendar-day partition, capped per verb in the reader registry. Detail: telemetry_sessions.yaml WINDOW VERBS. Last clause-1 note; later ones need a numbered Decision.
  Decision 207: > **Update (YYYY-MM-DD):** the Coverage line's reader side is now enforced, not a residual: src/common/ducklake_event_reads.py reports a differing pair as conflicted_grain_keys and derivation_conflicted, never nulling, dropping or erroring the derivation, guarded by tests/common/test_ducklake_event_read_dedupe.py::test_conflicted_keys_are_reported_never_resolved (PLAN-telemetry-reader-verbs, #NNNN). rec-4024 no longer owns it; rec-4025 is unchanged.
  Decision 215: > **Update (YYYY-MM-DD):** clause 4's five reader invocations per session became six when PLAN-telemetry-reader-verbs (#NNNN) added preflight's creds-gated telemetry_health_count gauge; recs_read stays two calls, and a 1.2x rise is short of reader-invocations-doubled. The count is observed through log_invocation, not restated here: later changes to it are not annotated.
- >-
  Create config/agent/verification_registry/entries/reader-verbs-decision-notes.yaml: check_id
  reader-verbs-decision-notes, primitive_slot command_exit_zero, guard_target docs/DECISIONS.md, guard_symbol null,
  check_spec.command [bin/venv-python, -c, <step 3's Python program verbatim>], plan_slug reader-verbs-decision-notes,
  graduated_at the landing date, graduated_by implement-agent (shape: decision-215-residuals-repointed.yaml).
- >-
  Execute the Verification Plan: steps 3-6, then step 7 (full tier). Loop until each passes; regenerate the index only
  on step 5 drift. On an unrecoverable failure stop and RCA (Decision 55).
- >-
  Commit, push, open the PR (On The Loop in prose), run code review; on PROCEED and green CI squash-merge with
  `Resolves: rec-4324` in the body. Then run step 8.
- 'Report: the three notes as landed, the build PR they cite, VP results, the size WARN line, rec-4324 status.'
rollback: >-
  Revert the squash commit; the notes and the registry row leave together. rec-4324 reopens by update_rec if the revert
  lands after rec-autoclose closed it.
