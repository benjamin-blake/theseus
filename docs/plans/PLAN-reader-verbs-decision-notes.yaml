- 'fork: Decision 199 reading as an Update note, a numbered Decision, or the contract note alone | chosen: Update note, last clause-1 note | class: asked | precedent: Benjamin 2026-10-15 | precedent_kind: answered-fork | reversible: yes | persisted: docs/DECISIONS.md Decision 199'
- 'fork: land before, inside, or after the reader verbs build | chosen: separate PR after its merge and step 15 | class: asked | precedent: Benjamin 2026-10-15 | precedent_kind: answered-fork | reversible: yes | persisted: this plan constraints'
