schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "vp-red-before-gate"
intent: >-
  Refuse at plan-PR time any verification step marked graduate that is green by construction on
  the un-implemented tree, so it cannot be promoted into the standing registry. Red-by-absence
  (a selector naming a not-yet-written test) still passes here by design -- proving discrimination
  for that majority shape is rec-3776's half, at registry admission.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-red-before-gate.yaml
phase: >-
  Verification-system hardening. Rec-driven (rec-3770, source=planning); soft-warn exception
  category ad_hoc_rec, so the Tier Item Freshness Gate is skipped -- no tier_item is claimed and
  no exit criterion closes, hence no closes_criteria. Successor in spirit to the complete T3.15
  (validate_vp_replay), T3.18 (graduation producer + differential admission) and T3.21 (graduation
  prevention gate); none of their criteria are reopened.
scope:
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Inverted-polarity plan-only leg over graduate pre-deploy steps, the four-constant outcome
      vocabulary and its in-dispatch self-test, the negated-sweep lint, the shared cross-leg
      budget counter, and the widened accounting declaration. Projected 203 -> 350-430 SLOC,
      under the 500 default; watch validate_cc_limits (CC 20) on the classifier branching.
  - file: tests/checks/verification/test_validate_vp_replay.py
    action: Delete
    purpose: >-
      Decomposed into the package below. At 483 of the 500 default SLOC limit with no budget
      entry, this file cannot absorb the new cases; Decision 128 makes decomposition the default
      response, not a raise.
  - file: tests/checks/verification/validate_vp_replay/__init__.py
    action: Create
    purpose: Mirror-test package root, matching the validate_graduation_completeness precedent.
  - file: tests/checks/verification/validate_vp_replay/conftest.py
    action: Create
    purpose: Shared git-repo and plan fixtures lifted from the flat file.
  - file: tests/checks/verification/validate_vp_replay/test_implement_leg.py
    action: Create
    purpose: Existing green-after replay, content-keyed resolution and root-scoped base cases.
  - file: tests/checks/verification/validate_vp_replay/test_red_before_leg.py
    action: Create
    purpose: >-
      Tautology, the two red classes, unmeasurable (including timeout), non-graduate
      non-execution, and the relocated TestPlanOnlyLeg cases -- the plan-only leg is what this
      work inverts, so its existing DEFER/resolution coverage belongs here.
  - file: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
    action: Create
    purpose: Negated-sweep lint (including fail-open) and the shared cross-leg budget guard.
  - file: tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py
    action: Create
    purpose: >-
      Terminal declaration across both legs, the vacuity cross-check, mirror resolution, and the
      classifier self-test including a patch-to-mislabel red case.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Register scripts/checks/verification/validate_vp_replay.py in _CONCERN_SPLIT_TEST_PACKAGES.
      Measured: map_source_to_test returns the PACKAGE form only for a member of that hardcoded
      frozenset (34 members, none matching vp_replay), so without this the decomposed mirror is
      unresolvable and validate_red_case_floor FAILS -- a missing oracle, not a skip.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: Assert the new concern-split member resolves to the package.
  - file: config/agent/verification_registry/entries/root-scoped-diff-base-vp-replay-root-scoping.yaml
    action: Modify
    purpose: >-
      Re-point check_spec.node_id off the deleted flat file onto its new package module. This is a
      live test_selector shard; run_differential treats a non-PASS live result as a hard failure
      and an absent file does not match the narrow importorskip skip-reason.
  - file: config/agent/verification_registry/entries/vp-replay-content-keyed-can-still-fail.yaml
    action: Modify
    purpose: Re-point check_spec.node_id off the deleted flat file, same reason.
  - file: tests/checks/verification/validate_scope_boundary/test_plan_legs.py
    action: Modify
    purpose: >-
      Update the docstring reference to the flat mirror path so step 14's stale-reference sweep
      passes.
  - file: scripts/checks/contracts/validate_skill_prose_relocation.py
    action: Modify
    purpose: >-
      Add _REINLINE_MARKERS entries for both new stubs. Measured: the markers live in a hardcoded
      dict in this module, not in layer4_relocation_map, so a map row alone receives no re-inline
      guard at all.
  - file: tests/checks/contracts/test_validate_skill_prose_relocation.py
    action: Modify
    purpose: Cover the two new marker entries.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Add full_segment="full_after_lint" to the validate_vp_replay Entry so the check and its
      in-dispatch self-test also run in the full tier (a tightening, free under Decision 187
      point 3). Values stay bare string literals (Decision 169).
  - file: tests/checks/verification/test__manifest.py
    action: Modify
    purpose: Assert the validate_vp_replay Entry is dispatched in both tiers.
  - file: docs/contracts/vp-red-before.yaml
    action: Create
    purpose: >-
      Class D mechanism contract, status provisional_v0 (validate_contract_drift hard-fails a new
      Class D declaring status active), evaluator validate_vp_replay -- the outcome-class
      vocabulary, the graduate-only eligibility rule, the lint's scope and precedence, and the
      graduation-disposition authoring semantics relocated out of the planning skill.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      Register both relocated stubs in layer4_relocation_map. Both blocks are PROMOTED to level-two
      headings first (fork resolved at plan time): every one of the five existing rows keys on a
      "## " heading, and _slice_section slices heading-to-next-"## ", so leaving them as bold
      sub-blocks would make the first stub's slice swallow the second's body and both guards pass
      vacuously. Heading promotion costs a few dozen bytes against a 3031 B savings pool.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Route row (topic vp-red-before -> the new contract), matching the plan-obligations
      precedent this contract mirrors.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Net-byte-negative: the Hermetic authoring (885 B) and Graduation disposition authoring
      (2145 B) blocks collapse to read-trigger stubs pointing at the contract.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New numbered Decision with amends [148] negating its points 1 and 3, plus an appended
      dated pointer line on Decision 148.
bundled_recommendations: ["rec-3770"]
followon_recs: ["rec-3776", "rec-3777"]
infrastructure_dependencies: []
acceptance_criteria:
  - A graduate-marked pre-deploy step that exits 0 on the plan-only PR tree fails the check.
  - >-
    A graduate step that is genuinely red before passes, and its outcome is reported as
    target_absent or assertion_failed as two distinct classes, neither of which fails.
  - >-
    An unmeasurable outcome is a hard failure and never counted as red. The frozen set is exit
    126/127, rg/grep error exit 2, credential absence, AND subprocess timeout -- under inverted
    polarity a timeout otherwise reads as "not green" and PASSES, which is the rec-3770 defect
    class reproduced inside the rec-3770 fix.
  - waive and not-applicable steps are not executed by the plan-only leg and produce no warning.
  - >-
    The static negated-sweep lint runs over EVERY pre-deploy step regardless of disposition --
    that is its distinct value, since the dynamic leg executes only graduate steps -- rejecting a
    negated rg or grep naming an absent path and passing any command it cannot confidently parse.
    When the lint and the tautology leg both fire on one step, the tautology failure is reported
    and the lint finding is suppressed for that step (no double-reporting).
  - >-
    One shared aggregate budget counter spans both legs of validate_vp_replay within a dispatch,
    so the check's worst case stays 150s and Decision 182 point 2 needs no amendment.
  - >-
    The terminal accounting declaration counts plans acted on in EITHER leg, so a plan-only PR
    carrying graduate steps declares enforced, never vacuous.
  - >-
    validate_vp_replay classifies four fixture steps, one per outcome class, as a precondition of
    its own verdict; a mislabel appends to failed, so the check cannot report enforced while its
    classifier is broken. The self-test contributes to failed only, never to examined, and its
    measured wall-clock stays under 1s per dispatch.
  - >-
    .claude/skills/planning/SKILL.md is strictly smaller than at origin/main and needs no
    raise-approved marker.
  - >-
    The mirror tests decompose into tests/checks/verification/validate_vp_replay/, every module
    stays under the 500-SLOC default with no sloc_budgets entry, the flat file is deleted and
    unreferenced, and map_source_to_test still resolves the mirror for validate_red_case_floor.
  - The full validation tier completes exit 0 before handoff (Decision 163).
  - >-
    Both live vp-replay registry shards still resolve after the mirror decomposition and pass
    run_differential -- their check_spec.node_id is re-pointed onto the new package modules, and
    map_source_to_test returns the PACKAGE form for validate_vp_replay.py.
  - >-
    docs/contracts/vp-red-before.yaml exists, is Class D provisional_v0, its evaluator resolves to
    validate_vp_replay, and file-router.yaml routes topic vp-red-before at it.
  - >-
    Both relocated stubs are level-two headings registered in layer4_relocation_map AND carry a
    _REINLINE_MARKERS entry, so re-inlining either body reddens validate_skill_prose_relocation.
  - >-
    The new Decision entry carries an amends [148] field and a significance envelope whose claimed
    routing row matches its body.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: The decomposed mirror package passes end to end
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/ -q
    expected: all tests pass, 0 failures
    fix_if: non-zero exit; read the first failing nodeid before changing any production code
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication, not an excuse: this package-wide selector is a strict superset of
      steps 2-14, each of which graduates its own discriminating nodeid over these same modules.
      A directory-wide selector is in any case unadmittable, since run_differential rejects a
      check that passes on an origin/main worktree.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: A graduate step green on the un-implemented tree is a hard failure
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_graduate_step_exiting_zero_reddens
      -q
    expected: 1 passed
    fix_if: >-
      A pass here with no assertion means the fixture plan's step is not reaching the inverted
      leg -- check that implementation_declared is false in the fixture and that the step carries
      graduation graduate and phase pre-deploy.
    graduation: graduate
    graduation_check_id: vp-red-before-tautological-fails
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: target_absent and assertion_failed are distinct classes and neither fails the check
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_absent_and_assertion_classes_are_distinct_and_pass
      -q
    expected: 1 passed
    fix_if: >-
      If the two classes collapse, the classifier is reading only the exit code and not the
      collection-error signature -- pytest exits 4/5 for a missing nodeid and 1 for a genuine
      assertion failure.
    graduation: graduate
    graduation_check_id: vp-red-before-classes-distinct
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: An unmeasurable outcome hard-fails instead of reading as red
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_unmeasurable_outcomes_hard_fail
      -q
    expected: 1 passed
    fix_if: >-
      This is the defect class rec-3770 exists to kill, reproduced inside the fix: exit 127, a
      non-executable command, rg/grep exit 2, credential absence AND a subprocess timeout all exit
      non-zero and would otherwise be counted as a genuine red. Timeout is the live one --
      PER_STEP_TIMEOUT_SECONDS is 30 and round 1 of critique found a real 28.1s step in this very
      plan. _replay_step already treats TimeoutExpired as a divergence in the green-after
      direction; the inverted leg must NOT port that naively. A missing oracle and a satisfied
      oracle must not look alike (Decision 55).
    graduation: graduate
    graduation_check_id: vp-red-before-unmeasurable-hard-fails
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: waive and not-applicable steps are never executed on the plan-only leg
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_non_graduate_dispositions_not_executed
      -q
    expected: 1 passed
    fix_if: >-
      Executing them would both cost budget and invite a discretionary warn -- the exact middle
      Decision 163 forbids. Assert no subprocess is spawned for those steps, not merely that the
      check still exits 0.
    graduation: graduate
    graduation_check_id: vp-red-before-nongraduate-not-executed
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: The negated-sweep lint flags a missing path, fails open, and defers to the dynamic leg
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestNegatedSweepLint
      -q
    expected: all tests in the class pass
    fix_if: >-
      Verified in-container: rg exits 2 on a missing path and shell negation maps that to 0, so
      the sweep reads green. Over-detection is the worse failure -- a crude extractor produced
      visible false positives on trailing punctuation and multi-word tokens across the corpus --
      so an ambiguous parse must pass. The class must also cover the precedence rule: when the
      tautology leg fires on the same step, the lint finding is suppressed.
    graduation: graduate
    graduation_check_id: vp-red-before-negated-sweep-lint
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: One budget counter spans both legs and the self-test, and exhaustion fails loudly
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestSharedBudget
      -q
    expected: all tests in the class pass
    fix_if: >-
      The legs are exclusive PER PLAN but not per dispatch -- 8 of the last 285 plan-touching
      commits touch more than one plan file (one touched 49), so a single PR can carry one
      undeclared and one declared plan and run both legs. A per-leg counter would install a second
      in-tier allowance and falsify Decision 182 point 2. Exhaustion appends a budget-guard
      failure and stops; it never silently truncates.
    graduation: graduate
    graduation_check_id: vp-red-before-shared-budget-guard
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: A plan-only PR with graduate steps declares enforced, not vacuous
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestAccountingDeclaration::test_plan_only_leg_with_graduate_steps_is_not_vacuous
      -q
    expected: 1 passed
    fix_if: >-
      The current terminal declaration is examined(len(resolved), unit declared_plans), and
      resolved is empty on a plan-only PR -- so the check would declare vacuous while executing.
      The declaration must count plans acted on in either leg.
    graduation: graduate
    graduation_check_id: vp-red-before-accounting-not-vacuous
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: A broken classifier reddens the check that depends on it, in the same dispatch
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestClassifierSelfTest
      -q
    expected: all tests in the class pass
    fix_if: >-
      This is the only guard proving the classifier still works: one that mislabels every step as
      target_absent still exits 0 and still declares examined above zero. The class must include a
      red case that patches the classifier to mislabel and asserts the self-test reddens --
      otherwise the self-test is itself a tautology. Fixtures run unconditionally, before the
      first real step and before any precondition early-return, so no unrelated skip reason can
      mask them.
    graduation: graduate
    graduation_check_id: vp-red-before-classifier-self-test
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: The self-test's per-dispatch cost is bounded and asserted
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestClassifierSelfTest::test_self_test_wall_clock_under_one_second
      -q
    expected: 1 passed
    fix_if: >-
      The self-test runs before the empty-domain early return, so it costs on EVERY --pre
      dispatch including non-plan PRs. Decision 187's reversal condition c4 sets 1s as the
      common-path re-audit trigger for a sibling gate; adopt the same ceiling. If the measured
      cost approaches it, drop the fixture to a cheaper shape rather than moving the self-test
      behind the early return, which would reintroduce the masking this design removes.
    graduation: waive
    graduation_waiver_reason: >-
      A wall-clock assertion is the canonical NONDETERMINISTIC shape T3.15 c4 exists to surface;
      graduating it would install a timing gate in the standing registry that flakes on a loaded
      runner. The durable property -- that the self-test runs unconditionally and cheaply -- is
      carried by step 9's shard, which asserts the behaviour rather than its duration.
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: An independent count of graduate steps equals what the check declared examined
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestVacuityCrossCheck
      -q
    expected: all tests in the class pass
    fix_if: >-
      Catches the check silently not running on a plan whose graduate steps it should have
      executed -- the declared-vs-executed shape Decision 163 names. The independent count must be
      derived without reference to the check's own resolution path.
    graduation: graduate
    graduation_check_id: vp-red-before-vacuity-cross-check
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: validate_vp_replay is dispatched in the full tier as well as --pre
    command: bin/venv-python -m pytest tests/checks/verification/test__manifest.py::test_vp_replay_entry_runs_in_both_tiers
      -q
    expected: 1 passed
    fix_if: >-
      The Entry is currently pre True with no full_segment, so the check and its self-test run
      only in --pre. Adding full_segment is a tightening (free and unmarked under Decision 187
      point 3) and gives the self-test a post-merge surface on main, so environment drift surfaces
      there rather than at the next affected PR.
    graduation: graduate
    graduation_check_id: vp-replay-registered-in-both-tiers
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: The decomposed mirror still resolves for the red-case floor
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestMirrorResolution
      -q
    expected: all tests in the class pass
    fix_if: >-
      validate_red_case_floor resolves a check's mirror through map_source_to_test and FAILS on a
      missing file or an empty concern-split package -- a missing oracle and a satisfied oracle
      must not look alike. Assert the resolution lands on the package and that it carries at least
      one positive-outcome assertion derived from invoking the check.
    graduation: graduate
    graduation_check_id: vp-replay-mirror-resolves-after-decomposition
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: The deleted flat mirror file leaves no stale reference behind
    command: 'test ! -e tests/checks/verification/test_validate_vp_replay.py && ! rg -n "test_validate_vp_replay"
      --glob "!docs/plans/**" . && echo NO_STALE_REFERENCES'
    expected: NO_STALE_REFERENCES printed, exit 0
    fix_if: >-
      The plan carries an action Delete row, which fires the surface-retiring closure obligation.
      Note the negation hazard this very plan is about: a negated rg over a path that does not
      exist exits 0 for the wrong reason, so the `test ! -e` conjunct must come first and the rg
      must be rooted at `.`, which always exists.
    graduation: graduate
    graduation_check_id: vp-replay-flat-mirror-fully-retired
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: The planning skill shrank and needs no raise-approved marker
    command: 'git fetch origin main --quiet 2>/dev/null; B=$(git show origin/main:.claude/skills/planning/SKILL.md
      | wc -c); A=$(wc -c < .claude/skills/planning/SKILL.md); echo "base=$B head=$A"; test "$A"
      -lt "$B" && echo NET_BYTE_NEGATIVE_CONFIRMED'
    expected: NET_BYTE_NEGATIVE_CONFIRMED printed, exit 0
    fix_if: >-
      The file sits at exactly 44097 bytes against a 44097-byte budget -- zero headroom -- so any
      net addition needs a raise-approved marker naming an authorising Decision (Decision 165).
      The savings pool is the two named blocks, 3031 B together. If registering the stubs in
      layer4_relocation_map requires promoting them to headings, that costs bytes -- shrink the
      stub bodies rather than adding a marker.
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot differential whose polarity inverts on merge: it compares HEAD against
      origin/main, and once this plan merges origin/main carries the smaller file, so the same
      command returns non-zero forever after. A standing shard over it would fail permanently. The
      durable property -- that the file stays within budget -- is already owned by the standing
      validate_prose_budget_raises check.
  - step: 16
    phase: pre-deploy
    hermetic: false
    action: The new Class D contract conforms and its evaluator resolves
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_contract_drift.py -q
    expected: all tests pass
    fix_if: >-
      A Class D body may never carry Class A field-shaped or Class B verb-shaped content, and
      every Class D contract needs a real evaluator. resolve_evaluator requires the string
      vp-red-before.yaml to appear as a string constant in EXECUTABLE context in
      validate_vp_replay.py (or a one-hop scripts/ import) -- a docstring mention will not
      resolve. A new provisional_v0 Class D lands in census.declared, so
      contract-population.yaml's two 16/16 equality pins need no edit.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicative by construction: validate_contract_drift already runs over every contract on
      every dispatch in both tiers, so a shard replaying its mirror suite would add no guard the
      standing check does not already provide. Marked non-hermetic deliberately -- the wider
      drift-or-population selector measured 28.1s against the 30s per-step replay timeout and this
      plan adds a contract to the population it scans, so replaying it would flake red.
  - step: 17
    phase: pre-deploy
    hermetic: false
    action: The new Decision carries a significance envelope and an amends field
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py
      -q
    expected: all tests pass
    fix_if: >-
      Decision 167 requires a fenced yaml envelope with a significance value and justification on
      any new entry, capped at 6144 bytes. Decision 177 makes live bodies exact-line append-only,
      so the pointer on Decision 148 must be a newly appended line, never a mid-line splice.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicative by construction: validate_decision_entry_conformance and validate_decisions_size
      already gate every diff touching docs/DECISIONS.md in both tiers. Non-hermetic for the same
      replay-cost reason as step 16.
  - step: 18
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green end to end and the non-test half stays within budget
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, and the printed non-test half is at or under 240s
    fix_if: >-
      A non-test breach means the shared counter is not actually shared, or the per-step timeout
      is being multiplied across legs. Decision 182 derived 240 specifically to dominate this
      check's 150s maximum as the only in-tier allowance across all 112 --pre steps.
    graduation: not-applicable
  - step: 19
    phase: pre-deploy
    hermetic: false
    action: Full validation tier completes exit 0 before handoff
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      handoff_policy.full_validation_required_before_commit is declared true, and
      validate_handoff_full_tier fails any plan declaring it without a step invoking the full tier
      (scripts.validate WITHOUT --pre). Step 18 does not satisfy it. On timeout the disposition is
      blocked -- resume later and rerun the full tier from the start, never part-way.
    graduation: not-applicable
  - step: 20
    phase: pre-deploy
    hermetic: false
    action: rec-3770 is reconciled against the surfaces this plan actually creates
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl')]; r=[x for x in rows if
      x['id']=='rec-3770'][-1]; assert r['status']=='closed', r['status']; assert
      r['file']=='scripts/checks/verification/validate_vp_replay.py', r['file']; assert
      'validate_vp_replay' in r['acceptance'], r['acceptance']; print('REC_3770_CLOSED')"
    expected: REC_3770_CLOSED printed, exit 0
    fix_if: >-
      rec-3770 was filed naming scripts/roadmap/plan_obligations.py and a
      tests/test_plan_obligations.py selector, neither of which this plan creates. Reconcile via
      update_rec (which writes through and refreshes the read cache) BEFORE closure -- never close
      against a stale acceptance command, and never hand-edit the cache, which is read-only
      downstream of the warehouse. The assertions are deliberately POSITIVE (field equals the new
      surface) rather than "not in": a negative assertion passes vacuously on an absent or null
      field, which is this plan's own defect class. The sync verb is `sync`; `pull` does not exist
      (choices=["sync"]) and exits 2.
    graduation: waive
    graduation_waiver_reason: >-
      One-shot and rec-id-specific: the assertions name rec-3770 by id and its post-close state,
      so a standing shard would either pin a single closed rec forever or re-run a warehouse sync
      on every dispatch. Not not-applicable -- the command IS a single command_output_matches
      shape, and claiming the no-obligation row for it would be exactly the classification gaming
      criterion 12o exists to catch.
  - step: 21
    phase: pre-deploy
    hermetic: true
    action: The decomposed mirror resolves and both live shards still admit
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_map.py
      -q && bin/venv-python -c "from pathlib import Path; from scripts import test_coverage_checker
      as tcc; r=tcc.map_source_to_test(Path('scripts/checks/verification/validate_vp_replay.py'));
      assert r.is_dir(), r; import yaml,glob; n=[yaml.safe_load(open(f))['check_spec']['node_id']
      for f in glob.glob('config/agent/verification_registry/entries/*vp-replay*.yaml')]; assert
      all('validate_vp_replay/' in x for x in n), n; print('MIRROR_AND_SHARDS_REPOINTED')"
    expected: MIRROR_AND_SHARDS_REPOINTED printed, exit 0
    fix_if: >-
      Measured before this plan: map_source_to_test returns the FLAT file for validate_vp_replay.py
      and the PACKAGE only for members of the hardcoded _CONCERN_SPLIT_TEST_PACKAGES frozenset (34
      members, none matching vp_replay). Without the registration the decomposed mirror is
      unresolvable and validate_red_case_floor FAILS. The two shards
      (root-scoped-diff-base-vp-replay-root-scoping, vp-replay-content-keyed-can-still-fail) pin
      node_ids into the deleted file; run_differential treats a non-PASS live result as a hard
      failure and an absent file does not match its narrow importorskip skip-reason.
    graduation: graduate
    graduation_check_id: vp-replay-mirror-and-shards-repointed
  - step: 22
    phase: pre-deploy
    hermetic: true
    action: Both relocated stubs are registered and re-inline-guarded
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_skill_prose_relocation.py
      -q
    expected: all tests pass
    fix_if: >-
      _REINLINE_MARKERS is a hardcoded dict in the check module keyed on the exact stub heading, so
      a layer4_relocation_map row alone buys no re-inline guard. Both blocks must be level-two
      headings first: _slice_section slices heading-to-next-"## ", so as bold sub-blocks the first
      stub's slice swallows the second's body and both guards pass vacuously.
    graduation: graduate
    graduation_check_id: vp-red-before-stubs-registered-and-guarded
