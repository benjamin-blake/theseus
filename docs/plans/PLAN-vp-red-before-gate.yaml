    verification_step: 12
    test_selector: tests/checks/verification/test__manifest.py::TestVerificationManifest::test_vp_replay_entry_runs_in_both_tiers
    red_green_expectation: red before, green after
  - source: scripts/checks/contracts/validate_skill_prose_relocation.py
    behavior: Re-inlining either relocated body into its stub reddens the check.
    verification_step: 14
    test_selector: tests/checks/contracts/test_validate_skill_prose_relocation.py::TestReInlinedRelocationRedPath::test_vp_red_before_stub_reinline_reddens
    red_green_expectation: red before, green after
  - source: docs/contracts/vp-red-before.yaml
    behavior: Class D conformance, unique subject, and an evaluator that resolves.
    verification_step: 13
    command: c['evaluator']['check']=='validate_vp_replay'
    waiver_reason: >-
      This row is contract DATA, not behavior-capable source. Its assertable properties are
      conformance and evaluator resolution, which step 13 exercises directly against the live repo;
      a dedicated test asserting a YAML key equals itself would be the tautology this repo refuses.
  - source: docs/contracts/instruction-architecture.yaml
    behavior: Both new stubs appear in layer4_relocation_map with resolvable destinations.
    verification_step: 14
    command: tests/checks/contracts/test_validate_skill_prose_relocation.py::TestReInlinedRelocationRedPath::test_vp_red_before_stub_reinline_reddens
    waiver_reason: >-
      Map DATA whose only assertable property is that the registered check reads it and passes;
      step 14 asserts exactly that against the live repo plus the two new rows by name.
  - source: docs/contracts/file-router.yaml
    behavior: The new contract is discoverable under topic vp-red-before.
    verification_step: 13
    command: row.get('topic')=='vp-red-before'
    waiver_reason: >-
      Index DATA. Its only assertable property is presence of the route row, which step 13's second
      conjunct executes; a mirror test over the router index belongs to the router's own check.
constraints:
  - No rescue agents or workaround loops (Decision 55); an unmeasurable outcome fails loudly.
  - >-
    PREREQUISITE: PLAN-vp-replay-mirror-decomposition must be merged first. This plan adds modules
    to the package that plan creates and must NOT create, delete or re-point any mirror file itself.
  - >-
    Only files in the Scope table may be modified; out-of-scope defects become recommendations via
    scripts.ops_data_portal, never inline fixes (Decision 59).
  - >-
    Do NOT create a new check module and do NOT host the classifier self-test elsewhere. A new
    module would install a second in-tier budget allowance and falsify Decision 182 point 2. Two
    hosts were considered and rejected: validate_differential_gate_baseline, a serial early-return
    chain (six returns, three registry.skipped) that would mask an appended leg under an unrelated
    worktree skip reason -- the Decision 170 status-collapse recreated inside one check; and
    validate_graduation_completeness, which reads the same graduation field but owns none of the
    replay instrument, per-step timeout or aggregate budget this work extends. A third candidate
    deserves naming because rec-3770 itself proposes it: scripts/roadmap/plan_obligations.py, whose
    net_new_v4_implementation_plan_paths already derives this exact eligible population and is
    already dispatched at plan-PR time via validate_plan_scope_closure. It fails the same charter
    test for the same reason -- it owns no replay instrument, no per-step timeout and no aggregate
    budget, and it is a read-only registration-closure engine that executes nothing. Re-run that charter test on the two STATIC lints and it comes out differently on one conjunct: they
    share none of the replay instrument, so plan_obligations' "executes nothing" reads as a match
    rather than a disqualifier. They are co-located here anyway, for a reason the test does not
    capture: the precedence rule (a tautology failure SUPPRESSES the lint finding on the same step)
    needs both legs inside one dispatch, and a second module would install a second Decision 182 in-
    tier allowance. The eligibility predicate itself is the one piece that could live in
    scripts/checks/_common.py, the sole home
    Decision 148 established for plan-resolution helpers; it is kept inline here deliberately, since
    _common.py is not in scope and a one-call predicate does not yet have a second consumer.
  - >-
    Do NOT rename any registered check -- authorization is at check-NAME level (Decision 187) and
    the registry shard linkage matches on the (plan_slug, check_id) pair.
  - >-
    The eligibility predicate is diff status (added: A or ??) AND implementation_declared falsy.
    Never resolve_declared_plans' edge-trigger, and never implementation_declared alone. The
    negated-sweep lint binds the SAME plan set -- it widens the step disposition, never the plan
    population. Measured why that matters, under the stated rule `! rg` / `! grep` (a bare
    rg/grep-mention rule instead returns 287 plans, which is why the rule is stated rather than
    the digit pinned): 208 negated-sweep pre-deploy commands span 130 of 422 plans, so an
    unscoped lint would hard-fail any PR merely editing one of them, which is this
    same defect class on the second leg. Measured:
    that field landed 2026-08-17 and 335 of 422 plans do not carry it, so it reads falsy forever
    on every legacy plan; 80 of those carry graduate pre-deploy steps, and 54-59 name a tests/ path
    that exists today (the range is the token-extraction rule: 54 requiring the EXTRACTED PATH to end in .py -- a pytest nodeid does not, so the rule must split on
    :: first, exactly as the loose arm does --,
    59 on any tests/ path token with trailing punctuation stripped -- state the rule beside the
    digit, since every unstated-rule figure in this plan has had to be re-measured at least once). Keying on the field alone would route every one of them into the inverted
    leg and hard-fail any PR that edits them. resolve_declared_plans stays the implement leg's
    predicate, unchanged.
  - >-
    graduation graduate is the partition key, never the hermetic flag -- hermetic carries two
    meanings (replay cost and creds-freeness) and cannot partition: roughly 280 of 775 graduate
    steps are not marked hermetic. The recursion hazard is EMPIRICALLY EMPTY on the graduate
    partition today, and the refusal is PROPHYLACTIC rather than remedial. Say it that way: three
    successive drafts mismeasured this one figure, each landing a digit that did not match its own
    stated rule. The first filtered to NON-hermetic steps -- the complement of the partition this
    plan selects -- and reported 0. The second matched a loose scripts[/.]validate substring and
    reported 11 across 6 plans. The third stated an argv-head rule but reported the IMPORT rule's
    count, 8 across 5. Measured with the argv-head rule the refusal must itself use: 0 of 775
    graduate pre-deploy steps invoke scripts.validate. A further 8 across 5 plans (all
    hermetic: true, all already-merged) IMPORT the module, and scripts/validate.py ends in an
    `if __name__ == "__main__": main()` guard, so importing it dispatches nothing -- they are
    outside the refusal by design, not oversight, and widening the rule to catch them would refuse
    8 harmless steps.
    Prophylactic is defensible here, and the evidence is measured rather than counterfactual. The shape
    is not rare, it is near-universal: 497 pre-deploy steps across 362 of 422 plans invoke -m
    scripts.validate, and validate_handoff_full_tier makes one MANDATORY in all 120 schema_v4 plans
    (120 of 120 declare full_validation_required_before_commit and 120 of 120 carry such a step).
    Zero of the 497 are marked graduate -- 204 not-applicable, 113 waive, 180 pre-T3.21 with no
    field. So the population is empty because nobody has flipped a disposition, not because the
    shape is unreachable, and the flip is under active pressure: 12o treats not-applicable as
    suspect on a single command_exit_zero shape, which bin/venv-python -m scripts.validate plainly
    is, so those 204 are exactly what 12o pushes toward graduate. The refusal is the backstop for
    497 one-flip sites. The hazard is also created BY this plan's own leg -- before it a plan-only
    PR executes nothing. Steps 17 and 18 of
    this very plan are the first two commands that would trigger it, and they are waived for
    exactly that reason. So the contract carries the recursion warning currently at SKILL.md:202,
    re-keyed from the hermetic partition to the graduate partition, AND the static refusal -- and
    the refusal's tests are fixture-only by necessity, which the plan discloses rather than
    disguises.
  - >-
    When relocating, REWRITE rather than copy TWO sentences the same PR falsifies. First, in the
    Hermetic authoring block: "Steps are replayed at implement time by validate_vp_replay, not
    plan time: a plan-only PR defers with a printed reason" -- that is precisely the Decision 148
    point 1 clause this plan negates, so relocating it verbatim ships a contract describing
    behaviour this PR removes. Second, the clause "When unsure, prefer not-applicable". Under this gate a false graduate is no longer a detour but a
    hard plan-PR failure, so the sentence now points authors at the two dispositions nothing
    executes -- the exact incentive rec-3777 exists to monitor. Do not defer this to that rec.
context:
  - "Decision-scout verdict + CITE list: FLAGS_FOUND (round 2). Decisions triaged: 140 of 140.
    Roadmap items intersected: 7; CONFLICT: 0; RELATED: 6. CITE: 182, 170, 163, 177, 150, 167,
    165, 181, 128, 169."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Flag dispositions: D148 -> new Decision, amends [148]; the forcing argument is that only a
    Decision can negate a Decision's clause, NOT the byte cap (the 6144 per-entry cap hard-fails
    NEW entries only). D88 -> credential absence is unmeasurable and hard-fails. D132 -> cited for
    the two-leg model and disposition schema only; residual limitation A is NOT discharged. D187 ->
    dissolved when 12o proved to carry no red-before reading to shed.
  - >-
    amends scope: the Decision negates point 1's ruling ("no execution against an
    implementation-less tree" governs GREEN-AFTER replay only) AND retracts point 3's RATIONALE
    ("since they are replayed at implement time (not plan time)"); point 3's hermetic-default
    ruling survives, since hermetic still governs the implement leg.
  - >-
    Forks, all asked and reversible: graduate-only partition || extend vs new module -> extend
    (Decision 182 point 2) || self-test home -> in-dispatch precondition of validate_vp_replay
    (first decided as a third leg on validate_differential_gate_baseline, reversed on consult) ||
    split into two plans (round-3 critique). Reusable charter test from the reversal: a leg joins an
    existing check only if ALL of -- same instrument, same preconditions, same lifetime profile, no
    obligation evasion; a check may self-test ITS OWN instrument, no other module's.
  - >-
    Why the plan-only leg: a newly-added plan's tree IS the pre-implementation tree (Decision 76 --
    18 of the last 40 relevant commits are plan-first), so red-before needs no worktree/revert/.venv.
    Replaces hand-rolled prior art in 9 merged plans (PLAN-closure-stamp-applicability step 2).
    Coverage honesty: target_absent passes for free and test_selector is the dominant graduate
    shape -- measured over the WHOLE partition rather than a recency window, 446 of 775 graduate pre-deploy commands are pytest-shaped, 57 percent (rule: a word-boundary pytest
    token in the command) -- so this gate refuses only the
    green-by-construction case; neither gate
    catches a vacuous new test (T3.7, deferred). The lint earns its place on REACH, with the
    denominator stated: under the `! rg` / `! grep` rule, 208 negated-sweep pre-deploy commands
    span 130 of 422 plans, and 83 of them across 51 plans sit on waive or not-applicable steps --
    the population no dynamic leg reaches. Volume of actual FINDINGS is small and deliberately
    unpinned: a crude path extractor calls 52 of the 208 absent-path, but a visible fraction of
    those are extractor artifacts (bare CD.6/CD.17-shaped tokens), so the fail-open rule admits
    only the confidently-parsed remainder.
  - >-
    Risk named rather than left implicit: a plan-only PR today executes NOTHING; after this it
    shell-executes every graduate step command, including the 280 of 775 never marked hermetic.
    Measured with the argv-head rule the refusal itself uses: 0 of 775 graduate pre-deploy steps
    invoke scripts.validate and none makes a real AWS call, so the hazard is EMPTY today and the
    refusal is prophylactic -- see constraints[6] for why empty is expected and why prophylactic
    is still the right call. It is degraded loudly by the unmeasurable class plus that refusal --
    but an empty population is not a structural prevention, and the new Decision's body must say
    so plainly rather than claim a containment the corpus does not supply. followon_recs: rec-3776
    (admission accepts FAIL-by-absence for test_selector rows); rec-3777 (disposition drift).
pre_implementation_checklist:
  - Branch confirmed not on main
  - PLAN-vp-replay-mirror-decomposition confirmed merged to main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    docs/contracts/vp-red-before.yaml -- author the Class D contract first (unique subject
    vp-red-before, status provisional_v0, evaluator validate_vp_replay, with a
    re_ratification_trigger): the FOUR frozen outcome constants (tautological, target_absent,
    assertion_failed, unmeasurable) plus the five arms unmeasurable subsumes (exit 126, exit 127,
    rg/grep exit 2, credential absence, timeout); the eligibility predicate as step 3 states it
    (added A or ?? AND implementation_declared falsy, never the field alone), binding both the
    inverted leg and the lint; the lint's scope and precedence, the graduate-partition
    recursion refusal, and the graduation-disposition authoring semantics relocated from the
    planning skill with the prefer-not-applicable clause REWRITTEN per the constraint above.
    Mirror plan-obligations.yaml.
  - >-
    scripts/checks/verification/validate_vp_replay.py -- give _replay_step an expected-polarity
    parameter; replace the plan-only leg's DEFER print with the inverted replay over graduate
    pre-deploy steps, gated on the SAME predicate acceptance_criteria[1], constraints[5] and step 3
    state -- diff status A or ?? via _common.get_status_aware_diff(root) AND implementation_declared
    falsy, never the field alone. Forward `root` explicitly: validate_root_scoped_diff_base guards
    that primitive, and a bare call would make the predicate read the REAL repository while the
    mirror fixtures inject a tmp_path root, so the new tests would silently evaluate the wrong
    tree. Keep the
    existing branch for a plan resolved by resolve_declared_plans, which prints PASS (handed to the
    implement leg), not DEFER. Add the outcome classifier, the negated-sweep lint, the static
    scripts.validate recursion refusal (keyed on the invocation shape, never a bare substring --
    see the acceptance criterion), the shared
    cross-leg counter with a re-derived MAX_REPLAYED_STEPS, the grammar-pinned per-class summary
    line, and the widened declaration under a new unit. Run the fixture classifications
    unconditionally at the top of the dispatch, before any precondition early-return, appending to
    failed only -- never to examined. The contract filename must appear as a string constant in
    EXECUTABLE context (not a docstring) so resolve_evaluator resolves.
  - >-
    Add the three new mirror modules to the existing package; include a red case that patches the
    classifier to mislabel, and one unmeasurable test per arm so a single regressed arm is
    attributable. validate_red_case_floor requires at least one positive-outcome assertion derived
    from invoking the check.
  - >-
    scripts/checks/verification/_manifest.py -- add full_segment full_after_lint to the
    validate_vp_replay Entry, values staying bare string literals (Decision 169).
  - >-
    Promote both relocated blocks to level-two headings in the planning skill, then register each
    in layer4_relocation_map and add a _REINLINE_MARKERS entry per stub in
    validate_skill_prose_relocation.py, picking a marker phrase present in the relocated body and
    absent from the stub. Add the file-router route row. Re-point plan-critique 12o's inbound
    pointer at the contract so it does not become a two-hop through a stub.
  - >-
    .claude/skills/planning/SKILL.md -- collapse the two blocks to read-trigger stubs; verify the
    net byte delta is negative (step 16) before committing.
  - >-
    docs/DECISIONS.md -- draft the new numbered Decision. Its envelope's significance.value is the
    ROUTING TOKEN `numbered_decision`, never the row's description prose --
    validate_decision_entry_conformance checks value against the token set, so transcribing the
    description literally fails. The justification claims that row, whose description reads
    "durable architectural commitment with reversal-relevant consequences": the body reverses when
    and against which tree a verification step is executed, and its reversal condition is the one
    Decision 148 names (the two-PR flow replaced by co-present plan+code PRs, which would make the
    inverted leg dead code). The justification names the rejected alternatives concretely -- a
    contract governance note cannot negate a ratified Decision clause, and an amendment_forms
    annotation reframes rather than retracts. The body states the negation per the amends-scope
    context line above. Then append a dated pointer line on Decision 148 covering BOTH the negation
    and the relocation of the Hermetic authoring guidance that entry names verbatim.
  - >-
    Update rec-3770 via update_rec so its file and acceptance name the surfaces this plan creates,
    then Execute the Verification Plan -- run each step, loop until pass; on unrecoverable failure
    stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Revert the squash-merge commit. The check is additive and no data migration or deploy is
  involved; the only durable side effects are the new Decision entry and the two follow-on recs,
  both of which survive a code revert harmlessly.
