constraints:
  - No rescue agents or workaround loops (Decision 55); an unmeasurable outcome fails loudly.
  - >-
    Only files in the Scope table may be modified; out-of-scope defects become recommendations
    via scripts.ops_data_portal, never inline fixes (Decision 59).
  - >-
    Do NOT create a new check module, and do NOT host the classifier self-test in another check.
    A new module would install a second in-tier budget allowance and falsify Decision 182 point 2.
    Two hosts were considered and rejected: validate_differential_gate_baseline, whose body is a
    serial early-return chain (six returns, three of them registry.skipped) that would mask an
    appended leg under an unrelated worktree skip reason -- the Decision 170 status-collapse
    recreated inside one check; and validate_graduation_completeness, which does carry a plan-PR
    leg over the same graduation field but owns none of the replay instrument, the per-step
    timeout or the aggregate budget this work extends.
  - >-
    Do NOT rename any registered check -- authorization is at check-NAME level (Decision 187) and
    the registry shard linkage matches on the (plan_slug, check_id) pair.
  - >-
    The plan-critique skill is deliberately NOT in scope: it carries no red-before reading to shed
    (criterion 12o covers missing-disposition, suspect not-applicable and thin-waiver only), so no
    judgement pin is retired and no carrier rec is owed.
  - >-
    graduation graduate is the partition key, never the hermetic flag -- hermetic carries two
    meanings (replay cost and creds-freeness) and cannot partition: 258 of 731 graduate steps are
    not marked hermetic. The recursion/credential hazard this opens is measured and empirically
    empty today: 0 of those 258 invoke scripts.validate; 195 are pytest, and the 63-step residue
    is 28 other bin/venv-python invocations, 8 grep, 4 test, and assorted shell -- none making a
    real AWS call. Empirically empty is not structurally prevented, so the contract must ALSO
    carry the recursion warning currently at SKILL.md:202, re-keyed from the hermetic partition to
    the graduate partition, plus a static refusal of a graduate step whose command matches
    scripts.validate. Re-measure before widening the partition further.
  - >-
    When relocating the graduation-authoring prose, REWRITE rather than copy the clause "When
    unsure, prefer not-applicable". Under this gate a false graduate is no longer a detour but a
    hard plan-PR failure, so the sentence now points authors at the two dispositions nothing
    executes -- the exact incentive rec-3777 exists to monitor. Do not defer this to that rec.
