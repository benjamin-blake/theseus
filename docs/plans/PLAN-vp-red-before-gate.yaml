schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "vp-red-before-gate"
intent: >-
  Refuse at plan-PR time any verification step marked graduate that is green by construction on
  the un-implemented tree, so it cannot be promoted into the standing registry. Red-by-absence
  (a selector naming a not-yet-written test) still passes here by design -- proving discrimination
  for that majority shape is rec-3776's half, at registry admission.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-red-before-gate.yaml
phase: >-
  Verification-system hardening. Rec-driven (rec-3770, source=planning); soft-warn category
  ad_hoc_rec, so the Tier Item Freshness Gate is skipped -- no tier_item is claimed and no exit
  criterion closes, hence no closes_criteria. SLICE 2 of 2: PLAN-vp-replay-mirror-decomposition is
  the prerequisite refactor and MUST be merged before this plan starts, since every new test module
  here lands in the package that plan creates.
scope:
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Inverted-polarity plan-only leg over graduate pre-deploy steps, the five-constant outcome
      vocabulary and its in-dispatch self-test, the negated-sweep lint, the shared cross-leg budget
      counter with a re-derived step cap, and the widened accounting declaration. Projected 203 ->
      350-430 SLOC, under the 500 default; watch validate_cc_limits (CC 20) on the classifier.
  - file: tests/checks/verification/validate_vp_replay/conftest.py
    action: Modify
    purpose: >-
      Extend the package conftest with any fixture the three new modules need. In scope because
      validate_no_cross_test_imports makes conftest the only legal sharing channel between test
      modules, so without this row the new modules could neither reach a shared helper nor add one.
  - file: tests/checks/verification/validate_vp_replay/test_red_before_leg.py
    action: Create
    purpose: >-
      Tautology, the two red classes, every unmeasurable arm including timeout, non-graduate
      non-execution, and the post-implementation-edit shape that must NOT be refused.
  - file: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
    action: Create
    purpose: Negated-sweep lint (including fail-open and precedence) and the shared budget guard.
  - file: tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py
    action: Create
    purpose: >-
      Terminal declaration across both legs, the vacuity cross-check, and the classifier self-test
      including a patch-to-mislabel red case.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Add full_segment="full_after_lint" to the validate_vp_replay Entry so the check and its
      in-dispatch self-test also run in the full tier (a tightening, free under Decision 187
      point 3). Values stay bare string literals (Decision 169).
  - file: tests/checks/verification/test__manifest.py
    action: Modify
    purpose: Assert the validate_vp_replay Entry is dispatched in both tiers.
  - file: docs/contracts/vp-red-before.yaml
    action: Create
    purpose: >-
      Class D mechanism contract, subject vp-red-before, status provisional_v0
      (validate_contract_drift hard-fails a new Class D declaring status active), evaluator
      validate_vp_replay -- the outcome-class vocabulary, the eligibility predicate, the lint's
      scope and precedence, the graduate-partition recursion refusal, and the
      graduation-disposition authoring semantics relocated out of the planning skill.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: Register both relocated stubs in layer4_relocation_map.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: Route row (topic vp-red-before) so the new contract is discoverable.
  - file: scripts/checks/contracts/validate_skill_prose_relocation.py
    action: Modify
    purpose: >-
      Add a _REINLINE_MARKERS entry per new stub. The markers are a hardcoded dict in this module,
      NOT data in layer4_relocation_map, so a map row alone buys no re-inline guard.
  - file: tests/checks/contracts/test_validate_skill_prose_relocation.py
    action: Modify
    purpose: Cover the two new marker entries.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Net-byte-negative: the Hermetic authoring (886 B) and Graduation disposition authoring
      (2146 B) blocks are promoted to level-two headings and collapsed to read-trigger stubs.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Re-point criterion 12o's inbound pointer, which names the planning skill's "Graduation
      disposition authoring" section and would otherwise become a two-hop through a stub. Budget
      note: this file is 18621 against an 18693 budget -- 72 bytes of headroom, and it already
      carries a raise-approved marker -- so the replacement pointer must not be longer than the
      text it replaces by more than that.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New numbered Decision with amends [148], plus an appended dated pointer line on Decision 148
      covering both the negation and the relocation of the guidance it names.
bundled_recommendations: ["rec-3770"]
followon_recs: ["rec-3776", "rec-3777"]
infrastructure_dependencies: []
acceptance_criteria:
  - A graduate-marked pre-deploy step that exits 0 on the plan-only PR tree fails the check.
  - >-
    The inverted leg fires only on a plan that is ADDED in this diff (git status A or ??, via
    _common.get_status_aware_diff -- the primitive validate_plan_documents._added_plan_names
    already uses) AND whose implementation_declared is falsy. Both conjuncts are required. Any
    plan MODIFIED rather than added is exempt regardless of its declared state, which covers the
    whole post-implementation-edit population, not merely the 83 plans carrying the field.
  - >-
    A graduate step that is genuinely red before passes, and its outcome is reported as
    target_absent or assertion_failed as two distinct classes, neither of which fails.
  - >-
    An unmeasurable outcome is a hard failure and never counted as red. The frozen set is exit
    126/127, rg/grep error exit 2, credential absence, AND subprocess timeout -- under inverted
    polarity a timeout otherwise reads as "not green" and PASSES, which is the rec-3770 defect
    class reproduced inside the rec-3770 fix.
  - waive and not-applicable steps are not executed by the plan-only leg and produce no warning.
  - >-
    The static negated-sweep lint runs over EVERY pre-deploy step regardless of disposition -- its
    distinct value, since the dynamic leg executes only graduate steps -- rejecting a negated rg or
    grep naming an absent path and passing any command it cannot confidently parse. When the lint
    and the tautology leg both fire on one step, the tautology failure is reported and the lint
    finding is suppressed (no double-reporting).
  - >-
    One shared aggregate counter spans both legs within a dispatch. MAX_REPLAYED_STEPS is
    re-derived from the measured per-step cost so the 120s wall clock, not the step count, is the
    binding constraint -- a PR carrying two plans of this size must not hard-fail on the count cap.
    MAX_AGGREGATE_SECONDS and PER_STEP_TIMEOUT_SECONDS are unchanged, so no SECOND in-tier
    allowance is installed. Decision 182 point 2's 150s figure is preserved for the replay phase
    only: the classifier self-test runs unconditionally before any early-return and sits outside
    both constants, so the check's true green maximum is 150s plus a bounded self-test cost. Either
    fold that cost into MAX_AGGREGATE_SECONDS or state the bounded figure -- do not restate 150 as
    if unchanged.
  - >-
    The terminal declaration counts plans acted on in EITHER leg under a new unit naming that
    grain, and a plan-only PR whose plan carries ZERO graduate steps declares vacuous, not
    enforced.
  - >-
    validate_vp_replay classifies one fixture step per outcome class -- including the timeout arm
    -- as a precondition of its own verdict; a mislabel appends to failed, so the check cannot
    report enforced while its classifier is broken. The self-test contributes to failed only,
    never to examined.
  - >-
    .claude/skills/planning/SKILL.md is strictly smaller than at origin/main and needs no
    raise-approved marker.
  - >-
    docs/contracts/vp-red-before.yaml exists, is Class D provisional_v0 with a unique subject, its
    evaluator resolves to validate_vp_replay, and file-router.yaml routes topic vp-red-before at
    it -- asserted by invoking the real checks against the live repo, not a fixture.
  - >-
    Both relocated stubs are level-two headings present in layer4_relocation_map AND in
    _REINLINE_MARKERS, asserted against the live repo, so re-inlining either body reddens
    validate_skill_prose_relocation.
  - >-
    The new Decision entry carries an amends [148] field and a significance envelope whose claimed
    routing row matches its body, asserted against the live docs/DECISIONS.md.
  - The full validation tier completes exit 0 before handoff (Decision 163).
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: The mirror package passes end to end with the new modules added
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/ -q
    expected: all tests pass, 0 failures
    fix_if: >-
      A collection error means the prerequisite plan (PLAN-vp-replay-mirror-decomposition) has not
      merged -- this package must already exist. Do not create it here.
    graduation: waive
    graduation_waiver_reason: >-
      A directory-wide selector is a strict superset of steps 2-11 and is unadmittable in any case,
      since run_differential rejects a check that also passes on an origin/main worktree.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: A graduate step green on the un-implemented tree is a hard failure
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_graduate_step_exiting_zero_reddens
      -q
    expected: 1 passed
    fix_if: >-
      A pass with no assertion means the fixture plan is not reaching the inverted leg -- check
      that implementation_declared is false in the fixture and the step carries graduation graduate
      and phase pre-deploy.
    graduation: graduate
    graduation_check_id: vp-red-before-tautological-fails
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: A modified plan is not refused, whether or not it carries implementation_declared
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestEligibility
      -q
    expected: all tests in the class pass -- one per exempt shape
    fix_if: >-
      THE design defect this step exists to prevent, and it has TWO shapes -- one test each.
      (a) resolve_declared_plans is EDGE-triggered, so a plan already declaring
      implementation_declared true is not "resolved"; verified against merged main, 45822ef7
      (#1121) edits PLAN-backlog-health-detection.yaml, declared true and untouched by that diff,
      with 8 graduate steps whose targets all exist. (b) The LARGER shape: implementation_declared
      landed 2026-08-17 and 335 of 418 plans do not carry it at all, so it reads falsy forever --
      80 of those carry graduate steps and 55 name a live tests/ path, so keying on the field
      alone hard-fails any PR editing them. Both are exempt only under the added-in-diff conjunct.
      The class needs a fixture per shape: a declared-true modified plan, and a FIELD-ABSENT legacy
      plan whose graduate steps are green.
    graduation: graduate
    graduation_check_id: vp-red-before-eligibility-is-working-tree-state
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: target_absent and assertion_failed are distinct classes and neither fails the check
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_absent_and_assertion_classes_are_distinct_and_pass
      -q
    expected: 1 passed
    fix_if: >-
      If the two collapse, the classifier is reading only the exit code and not the
      collection-error signature -- pytest exits 4/5 for a missing nodeid and 1 for a genuine
      assertion failure.
    graduation: graduate
    graduation_check_id: vp-red-before-classes-distinct
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: Every unmeasurable arm hard-fails instead of reading as red, timeout included
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestUnmeasurable
      -q
    expected: all tests in the class pass, one per arm
    fix_if: >-
      exit 127, a non-executable command, rg/grep exit 2, credential absence AND a subprocess
      timeout all exit non-zero and would otherwise count as a genuine red. Timeout is the live arm
      -- PER_STEP_TIMEOUT_SECONDS is 30 and a real 28.1s step was measured during this plan's own
      critique. _replay_step already treats TimeoutExpired as a divergence in the green-after
      direction; the inverted leg must NOT port that naively. One test per arm, not one test with
      five asserts, so a single regressed arm is attributable.
    graduation: graduate
    graduation_check_id: vp-red-before-unmeasurable-hard-fails
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: waive and not-applicable steps are never executed on the plan-only leg
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_non_graduate_dispositions_not_executed
      -q
    expected: 1 passed
    fix_if: >-
      Executing them would cost budget and invite a discretionary warn -- the exact middle Decision
      163 forbids. Assert no subprocess is spawned, not merely that the check exits 0.
    graduation: graduate
    graduation_check_id: vp-red-before-nongraduate-not-executed
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The negated-sweep lint flags a missing path, fails open, and defers to the dynamic leg
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestNegatedSweepLint
      -q
    expected: all tests in the class pass
    fix_if: >-
      Verified in-container: rg exits 2 on a missing path and shell negation maps that to 0. Over-
      detection is the worse failure -- a crude extractor produced visible false positives on
      trailing punctuation and multi-word tokens across the corpus -- so an ambiguous parse must
      pass. Cover the precedence rule too: when the tautology leg fires on the same step, the lint
      finding is suppressed.
    graduation: graduate
    graduation_check_id: vp-red-before-negated-sweep-lint
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: The step cap is derived from measured cost and does not bind before the wall clock
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestSharedBudget
      -q
    expected: all tests in the class pass
    fix_if: >-
      MAX_REPLAYED_STEPS is 20 today and this plan alone carries 14 graduate steps, so two plans in
      one PR hit the count cap -- and measured per-step cost is 0.32s absent / 1.06s live, meaning
      the count cap binds long before the 120s wall clock. Re-derive the cap from that cost so the
      wall clock is the real constraint, and leave MAX_AGGREGATE_SECONDS and
      PER_STEP_TIMEOUT_SECONDS untouched so Decision 182 point 2's 150s figure stays literally
      true. The legs are exclusive per plan but NOT per dispatch: 8 of the last 285 plan-touching
      commits touch more than one plan file. Exhaustion appends a loud failure; it never truncates.
    graduation: graduate
    graduation_check_id: vp-red-before-step-cap-derived-from-cost
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The declaration distinguishes an executing plan from a zero-graduate one
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestAccountingDeclaration
      -q
    expected: all tests in the class pass
    fix_if: >-
      The current declaration is examined(len(resolved), unit declared_plans) and resolved is empty
      on a plan-only PR, so the check would declare vacuous while executing. Widening it naively
      inverts the bug: a plan-only PR whose plan carries ZERO graduate steps would declare enforced
      while executing nothing. Count the grain that was actually acted on, under a unit string
      naming that grain rather than the inherited declared_plans.
    graduation: graduate
    graduation_check_id: vp-red-before-accounting-grain-honest
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: A broken classifier reddens the check that depends on it, in the same dispatch
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestClassifierSelfTest
      -q
    expected: all tests in the class pass
    fix_if: >-
      The only guard proving the classifier still works: one that mislabels every step as
      target_absent still exits 0 and still declares examined above zero. Include a red case that
      patches the classifier to mislabel and asserts the self-test reddens -- otherwise the
      self-test is itself a tautology. The fixture set must cover the TIMEOUT arm, not only exit
      127; a sub-second timeout fixture keeps the cost bounded. Fixtures run unconditionally,
      before the first real step and before any precondition early-return, so no unrelated skip
      reason can mask them.
    graduation: graduate
    graduation_check_id: vp-red-before-classifier-self-test
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: An independent count of graduate steps equals what the check declared examined
    command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py::TestVacuityCrossCheck
      -q
    expected: all tests in the class pass
    fix_if: >-
      Catches the check silently not running on a plan whose graduate steps it should have executed
      -- the declared-vs-executed shape Decision 163 names. The independent count must be derived
      without reference to the check's own resolution path.
    graduation: graduate
    graduation_check_id: vp-red-before-vacuity-cross-check
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: validate_vp_replay is dispatched in the full tier as well as --pre
    command: bin/venv-python -m pytest tests/checks/verification/test__manifest.py::test_vp_replay_entry_runs_in_both_tiers
      -q
    expected: 1 passed
    fix_if: >-
      The Entry is pre True with no full_segment, so the check and its self-test run only in --pre.
      Adding full_segment is a tightening (free and unmarked under Decision 187 point 3) and gives
      the self-test a post-merge surface on main.
    graduation: graduate
    graduation_check_id: vp-replay-registered-in-both-tiers
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: The contract exists, conforms, resolves its evaluator and is routed -- on the live repo
    command: bin/venv-python -c "import yaml; from pathlib import Path; from scripts.checks.contracts.validate_contract_drift
      import validate_contract_drift as f; failed=[]; f(failed); assert not failed, failed;
      c=yaml.safe_load(Path('docs/contracts/vp-red-before.yaml').read_text())['contract']; assert
      c['class']=='D' and c['status']=='provisional_v0', c; assert c['evaluator']['check']=='validate_vp_replay',
      c; r=yaml.safe_load(Path('docs/contracts/file-router.yaml').read_text()); assert
      any(row.get('topic')=='vp-red-before' for row in r['routes']), 'no route row';
      print('CONTRACT_LIVE_AND_ROUTED')"
    expected: CONTRACT_LIVE_AND_ROUTED printed, exit 0
    fix_if: >-
      Asserted against the LIVE repo deliberately. The mirror suites for these checks run entirely
      on tmp_path fixtures and cannot observe the real contract -- replaying one would be the
      test-only anti-pattern. A Class D body may never carry Class A field-shaped or Class B
      verb-shaped content, needs a unique subject, and resolve_evaluator requires the string
      vp-red-before.yaml in EXECUTABLE context in validate_vp_replay.py -- a docstring will not
      resolve. The route conjunct matches r['routes'] rows on topic, NEVER any('vp-red-before' in
      str(v) for v in r.values()): file-router.yaml carries a top-level amendment_log whose
      summaries name the topic of every edit by convention, so the loose form would pass with no
      route row present -- green by construction, in the plan that exists to refuse that.
    graduation: graduate
    graduation_check_id: vp-red-before-contract-live-and-routed
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: Both stubs are registered and re-inline-guarded -- on the live repo
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_skill_prose_relocation.py::test_vp_red_before_stub_reinline_reddens
      -q && bin/venv-python -c "import yaml; from pathlib import Path; from
      scripts.checks.contracts.validate_skill_prose_relocation import validate_skill_prose_relocation
      as f, _REINLINE_MARKERS; failed=[]; f(failed); assert not failed, failed;
      m=yaml.safe_load(Path('docs/contracts/instruction-architecture.yaml').read_text())['layer4_relocation_map'];
      new=[r['stub_heading'] for r in m if 'vp-red-before' in r['destination']]; assert
      len(set(new))==2, new; assert all(h in _REINLINE_MARKERS and _REINLINE_MARKERS[h] for h in new), new;
      print('STUBS_REGISTERED_AND_GUARDED')"
    expected: the mirror node passes, then STUBS_REGISTERED_AND_GUARDED printed, exit 0
    fix_if: >-
      _REINLINE_MARKERS is a hardcoded dict in the check module keyed on the exact stub heading, so
      a layer4_relocation_map row alone buys no guard. Both blocks must be level-two headings
      first: _slice_section slices heading-to-next-level-two, so as bold sub-blocks the first
      stub's slice swallows the second's body and both guards pass vacuously. Two conjuncts on
      purpose: the mirror node proves the marker entries behave on a fixture repo, the live
      assertion proves they are actually wired to the real stubs -- neither alone is an oracle.
    graduation: graduate
    graduation_check_id: vp-red-before-stubs-registered-and-guarded
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: The new Decision carries amends [148] and a matching significance envelope -- live
    command: >-
      bin/venv-python -c "import re; from pathlib import Path; from
      scripts.checks.decisions.validate_decision_entry_conformance import
      validate_decision_entry_conformance as f; failed=[]; f(failed); assert not failed, failed;
      t=Path('docs/DECISIONS.md').read_text();
      hs=[m.start() for m in re.finditer(r'^## Decision \d+:', t, re.M)] + [len(t)];
      blks=[t[hs[i]:hs[i+1]] for i in range(len(hs)-1)];
      hit=[b for b in blks if re.search(r'amends:\s*\[148\]', b)]; assert len(hit)==1, len(hit);
      assert 'significance:' in hit[0], 'no significance envelope in the amending entry';
      print('DECISION_AMENDS_148_CONFORMS')"
    expected: DECISION_AMENDS_148_CONFORMS printed, exit 0
    fix_if: >-
      Decision 167 requires a fenced yaml envelope with a significance value and justification,
      capped at 6144 bytes. Decision 177 makes live bodies exact-line append-only, so the pointer
      on 148 must be a newly appended line, never a mid-line splice. Asserted live rather than via
      the conformance mirror, which writes its own DECISIONS.md into tmp_path. The block selection
      iterates headings and picks the one whose OWN body carries the amends field -- a single
      non-greedy regex over the whole 7000-line corpus binds across entries and would slice the
      newest heading's block instead, passing against the wrong entry.
    graduation: graduate
    graduation_check_id: vp-red-before-decision-amends-148-live
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: The planning skill shrank and needs no raise-approved marker
    command: 'git fetch origin main --quiet 2>/dev/null; B=$(git show origin/main:.claude/skills/planning/SKILL.md
      | wc -c); A=$(wc -c < .claude/skills/planning/SKILL.md); echo "base=$B head=$A"; test "$A"
      -lt "$B" && echo NET_BYTE_NEGATIVE_CONFIRMED'
    expected: NET_BYTE_NEGATIVE_CONFIRMED printed, exit 0
    fix_if: >-
      The file sits at exactly 44097 bytes against a 44097-byte budget -- zero headroom -- so any
      net addition needs a raise-approved marker naming an authorising Decision (Decision 165). The
      savings pool is the two named blocks, 3032 B together; heading promotion costs a few dozen
      bytes against that. If the delta is positive, shrink the stub bodies rather than add a marker.
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot differential whose polarity inverts on merge: it compares HEAD against
      origin/main, and once this lands origin/main carries the smaller file, so the command returns
      non-zero forever after. The durable property -- that the file stays within budget -- is
      already owned by the standing validate_prose_budget_raises check.
  - step: 17
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green end to end and the non-test half stays within budget
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, and the printed non-test half is at or under 240s
    fix_if: >-
      A non-test breach means the counter is not actually shared, or the per-step timeout is being
      multiplied across legs. Decision 182 derived 240 to dominate this check's 150s maximum as the
      only in-tier allowance across all 112 --pre steps.
    graduation: waive
    graduation_waiver_reason: >-
      Recursion: a standing shard invoking scripts.validate would re-enter the tier dispatching it,
      and this plan's own lint refuses a graduate step whose command matches scripts.validate. Not
      not-applicable -- the command is a single command_exit_zero shape, and claiming the
      no-obligation row for it would be the classification gaming 12o exists to catch.
  - step: 18
    phase: pre-deploy
    hermetic: false
    action: Full validation tier completes exit 0 before handoff
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      handoff_policy.full_validation_required_before_commit is declared true, and
      validate_handoff_full_tier fails any plan declaring it without a full-tier step. Step 17 does
      not satisfy it. On timeout the disposition is blocked -- rerun from the start, never part-way.
    graduation: waive
    graduation_waiver_reason: Same recursion reason as step 17, over the full tier rather than the fast one.
  - step: 19
    phase: pre-deploy
    hermetic: false
    action: rec-3770 is reconciled and closed
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl')]; r=[x for x in rows if
      x['id']=='rec-3770'][-1]; assert r['status']=='closed', r['status']; assert
      r['file']=='scripts/checks/verification/validate_vp_replay.py', r['file']; assert
      'validate_vp_replay' in r['acceptance'], r['acceptance']; print('REC_3770_CLOSED')"
    expected: REC_3770_CLOSED printed, exit 0
    fix_if: >-
      rec-3770 was filed naming scripts/roadmap/plan_obligations.py and a
      tests/test_plan_obligations.py selector, neither of which this plan creates. Reconcile via
      update_rec (which writes through and refreshes the cache) BEFORE closure. The assertions are
      deliberately POSITIVE -- a "not in" test passes vacuously on an absent field, which is this
      plan's own defect class. The sync verb is `sync`; `pull` does not exist and exits 2.
    graduation: waive
    graduation_waiver_reason: >-
      One-shot and rec-id-specific: the assertions name rec-3770 and its post-close state, so a
      standing shard would pin a single closed rec forever and re-run a warehouse sync every
      dispatch. Not not-applicable -- it IS a single command_output_matches shape.
test_obligations:
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: >-
      A graduate pre-deploy step that exits 0 on the un-implemented plan-only tree is refused,
      while a post-implementation plan edit is not.
    verification_step: 2
    test_selector: tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestRedBeforeLeg::test_graduate_step_exiting_zero_reddens
    red_green_expectation: red before, green after
  - source: scripts/checks/verification/_manifest.py
    behavior: The validate_vp_replay Entry is dispatched in both tiers.
    verification_step: 12
    test_selector: tests/checks/verification/test__manifest.py::test_vp_replay_entry_runs_in_both_tiers
    red_green_expectation: red before, green after
  - source: scripts/checks/contracts/validate_skill_prose_relocation.py
    behavior: Re-inlining either relocated body into its stub reddens the check.
    verification_step: 14
    test_selector: tests/checks/contracts/test_validate_skill_prose_relocation.py::test_vp_red_before_stub_reinline_reddens
    red_green_expectation: red before, green after
  - source: docs/contracts/vp-red-before.yaml
    behavior: Class D conformance, unique subject, and an evaluator that resolves.
    verification_step: 13
    command: c['evaluator']['check']=='validate_vp_replay'
    waiver_reason: >-
      This row is contract DATA, not behavior-capable source. Its assertable properties are
      conformance and evaluator resolution, which step 13 exercises directly against the live repo;
      a dedicated test asserting a YAML key equals itself would be the tautology this repo refuses.
  - source: docs/contracts/instruction-architecture.yaml
    behavior: Both new stubs appear in layer4_relocation_map with resolvable destinations.
    verification_step: 14
    command: tests/checks/contracts/test_validate_skill_prose_relocation.py::test_vp_red_before_stub_reinline_reddens
    waiver_reason: >-
      Map DATA whose only assertable property is that the registered check reads it and passes;
      step 14 asserts exactly that against the live repo plus the two new rows by name.
  - source: docs/contracts/file-router.yaml
    behavior: The new contract is discoverable under topic vp-red-before.
    verification_step: 13
    command: any(row.get('topic')=='vp-red-before' for row in r['routes'])
    waiver_reason: >-
      Index DATA. Its only assertable property is presence of the route row, which step 13's second
      conjunct executes; a mirror test over the router index belongs to the router's own check.
constraints:
  - No rescue agents or workaround loops (Decision 55); an unmeasurable outcome fails loudly.
  - >-
    PREREQUISITE: PLAN-vp-replay-mirror-decomposition must be merged first. This plan adds modules
    to the package that plan creates and must NOT create, delete or re-point any mirror file itself.
  - >-
    Only files in the Scope table may be modified; out-of-scope defects become recommendations via
    scripts.ops_data_portal, never inline fixes (Decision 59).
  - >-
    Do NOT create a new check module and do NOT host the classifier self-test elsewhere. A new
    module would install a second in-tier budget allowance and falsify Decision 182 point 2. Two
    hosts were considered and rejected: validate_differential_gate_baseline, a serial early-return
    chain (six returns, three registry.skipped) that would mask an appended leg under an unrelated
    worktree skip reason -- the Decision 170 status-collapse recreated inside one check; and
    validate_graduation_completeness, which reads the same graduation field but owns none of the
    replay instrument, per-step timeout or aggregate budget this work extends.
  - >-
    Do NOT rename any registered check -- authorization is at check-NAME level (Decision 187) and
    the registry shard linkage matches on the (plan_slug, check_id) pair.
  - >-
    The eligibility predicate is diff status (added: A or ??) AND implementation_declared falsy.
    Never resolve_declared_plans' edge-trigger, and never implementation_declared alone. Measured:
    that field landed 2026-08-17 and 335 of 418 plans do not carry it, so it reads falsy forever
    on every legacy plan; 80 of those carry graduate pre-deploy steps and 55 name a tests/ path
    that exists today. Keying on the field alone would route every one of them into the inverted
    leg and hard-fail any PR that edits them. resolve_declared_plans stays the implement leg's
    predicate, unchanged.
  - >-
    graduation graduate is the partition key, never the hermetic flag -- hermetic carries two
    meanings (replay cost and creds-freeness) and cannot partition: 258 of 731 graduate steps are
    not marked hermetic. The recursion/credential hazard is measured and empirically empty today: 0
    of those 258 invoke scripts.validate; 195 are pytest and the 63-step residue is 28 other
    bin/venv-python, 8 grep, 4 test and assorted shell, none making a real AWS call. Empirically
    empty is not structurally prevented, so the contract carries the recursion warning currently at
    SKILL.md:202 re-keyed from the hermetic partition to the graduate partition, plus a static
    refusal of a graduate step whose command matches scripts.validate.
  - >-
    When relocating, REWRITE rather than copy TWO sentences the same PR falsifies. First, in the
    Hermetic authoring block: "Steps are replayed at implement time by validate_vp_replay, not
    plan time: a plan-only PR defers with a printed reason" -- that is precisely the Decision 148
    point 1 clause this plan negates, so relocating it verbatim ships a contract describing
    behaviour this PR removes. Second, the clause "When unsure, prefer not-applicable". Under this gate a false graduate is no longer a detour but a
    hard plan-PR failure, so the sentence now points authors at the two dispositions nothing
    executes -- the exact incentive rec-3777 exists to monitor. Do not defer this to that rec.
context:
  - "Decision-scout verdict + CITE list: FLAGS_FOUND (round 2). Decisions triaged: 140 of 140.
    Roadmap items intersected: 7; CONFLICT: 0; RELATED: 6. CITE: 182, 170, 163, 177, 150, 167,
    165, 181, 128, 169."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Flag dispositions: D148 -> new Decision, amends [148]; the forcing argument is that only a
    Decision can negate a Decision's clause, NOT the byte cap (the 6144 per-entry cap hard-fails
    NEW entries only). D88 -> credential absence is unmeasurable and hard-fails. D132 -> cited for
    the two-leg model and disposition schema only; residual limitation A is NOT discharged. D187 ->
    dissolved when 12o proved to carry no red-before reading to shed.
  - >-
    amends scope: the Decision negates point 1's ruling ("no execution against an
    implementation-less tree" governs GREEN-AFTER replay only) AND retracts point 3's RATIONALE
    ("since they are replayed at implement time (not plan time)"); point 3's hermetic-default
    ruling survives, since hermetic still governs the implement leg.
  - >-
    Forks, all asked and reversible: graduate-only partition || extend vs new module -> extend
    (Decision 182 point 2) || self-test home -> in-dispatch precondition of validate_vp_replay
    (first decided as a third leg on validate_differential_gate_baseline, reversed on consult) ||
    split into two plans (round-3 critique). Reusable charter test from the reversal: a leg joins an
    existing check only if ALL of -- same instrument, same preconditions, same lifetime profile, no
    obligation evasion; a check may self-test ITS OWN instrument, no other module's.
  - >-
    Why the plan-only leg: a newly-added plan's tree IS the pre-implementation tree (Decision 76 --
    18 of the last 40 relevant commits are plan-first), so red-before needs no worktree/revert/.venv.
    Replaces hand-rolled prior art in 9 merged plans (PLAN-closure-stamp-applicability step 2).
    Coverage honesty: target_absent passes for free and test_selector is the dominant graduate
    shape (41 of 58 recent), so this gate refuses only the green-by-construction case; neither gate
    catches a vacuous new test (T3.7, deferred). The lint earns its place on reach not volume
    (measured: 5 commands across 2 plans) -- static, so it covers the waive and not-applicable
    steps the dynamic leg never executes.
  - >-
    Risk this change introduces, named rather than left implicit: a plan-only PR today executes
    NOTHING, and after this it shell-executes every graduate step command in the plan, including
    ones the author never marked hermetic. Measured empty today (0 of 258 invoke scripts.validate,
    none make a real AWS call) and degraded loudly rather than silently by the unmeasurable class,
    with a static scripts.validate refusal -- but empirically empty is not structurally prevented,
    and the new Decision's body must say so.
  - >-
    followon_recs: rec-3776 (admission accepts FAIL-by-absence for test_selector rows); rec-3777
    (disposition-drift monitor for the population this check never executes).
