schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-pin-authored-measure"
intent: >-
  Give every test that pins one Decision entry's byte size one shared measure, the entry as authored: the shared parser's
  heading-to-next-heading block minus its trailing run of dated annotations. docs/contracts/decision-entry.yaml
  size_governance caps an entry's span when it is authored and meters later annotations WARN-only (Decision 151 sanctions
  them), but seven pin tests count annotations against the 6,144 B cap. Decision 210's pin has 2 B left and the Decision 230
  pin has blocked two builds (#1677, #1718). Executes rec-4730.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-pin-authored-measure.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Test hygiene from the
  Decision-cap RCA (2026-10-29); closes no roadmap criterion.
closes_criteria: []
scope:
  - file: tests/fixtures/decision_entry.py
    action: Create
    purpose: >-
      The shared measure. cap_bytes() reads size_governance.per_entry_size_norm.cap_bytes from
      docs/contracts/decision-entry.yaml. decision_entry(text, number) returns the one block scripts.decisions_md
      .iter_decision_sections yields for that number (AssertionError on none or several). authored(entry) strips the
      maximal TRAILING run of dated annotation paragraphs (paragraphs split on blank lines), keeping the closing "---"
      separator and what follows it, and returns the entry unchanged when it has none. A paragraph is a dated annotation
      when it fully matches "[Amendment DATE ...]" (any source, may wrap lines) or every line starts with ">" and its first
      line opens "> **" with a DATE inside the bold prefix before ":**" (the contract's amendment_forms general rule,
      dated). DATE is YYYY-MM or YYYY-MM-DD. authored_bytes(entry) is len(authored(entry).encode("utf-8")).
  - file: tests/checks/decisions/test_decision_pin_measure.py
    action: Create
    purpose: >-
      Unit tests for the fixture (cases in acceptance_criteria[1]) and the guard in acceptance_criteria[3]. Absorbs
      test_authored_span_admits_only_dated_trailers from the Decision 230 test.
  - file: tests/checks/decisions/test_telemetry_production_catalog_decision.py
    action: Modify
    purpose: >-
      Decision 230 pin: size assertion becomes authored_bytes(entry) <= cap_bytes(); drop _CAP_BYTES, the private
      _authored() and its unit test (moved to the shared module); _entry() calls become decision_entry().
  - file: tests/checks/decisions/test_secret_parameters_decision.py
    action: Modify
    purpose: Decision 237 pin; same change (drop _CAP_BYTES and _entry, use the fixture).
  - file: tests/checks/decisions/test_telemetry_column_additions_decision.py
    action: Modify
    purpose: Decision 222 pin; same change.
  - file: tests/checks/decisions/test_read_side_session_end_decision.py
    action: Modify
    purpose: Decision 228 pin; same change.
  - file: tests/checks/decisions/test_neon_catalog_tuning_decision.py
    action: Modify
    purpose: Decision 214 pin; same change.
  - file: tests/checks/contracts/test_ops_rule_source_records.py
    action: Modify
    purpose: >-
      Decision 210 pin: size assertion becomes authored_bytes(decision_entry(_DECISIONS, number)) <= cap_bytes(); drop
      _DECISION_CAP_BYTES. _section() stays for the content assertions (it also reads Decisions 64 and 65).
  - file: tests/ci_rca/test_recovery_policy_surfaces.py
    action: Modify
    purpose: >-
      Decision 226 pin (not in rec-4730's list; found by grep): test_entry_stays_under_the_size_cap becomes
      authored_bytes(decision_entry(_read("docs/DECISIONS.md"), 226)) <= cap_bytes(), replacing len(_entry(226)...) < 6144.
      _entry() stays for the content assertions.
  - file: docs/plans/PLAN-decision-pin-authored-measure.yaml
    action: Create
    purpose: This plan.
bundled_recommendations:
  - rec-4730
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    tests/fixtures/decision_entry.py exposes cap_bytes(), decision_entry(text, number), authored(entry) and
    authored_bytes(entry) as scoped, and imports no test_* module (Decision 131).
  - >-
    test_decision_pin_measure.py proves: each trailing form is stripped with "---" kept (single-line and wrapped
    "[Amendment DATE, Decision N: ...]", "[Amendment DATE, rec-N: ...]", "[Amendment DATE: ...]", a wrapped
    "> **Update (DATE, PLAN-x, rec-N):**" blockquote, "> **Amended by Decision N (YYYY-MM):**", mixed runs); a
    trailer-free entry is returned unchanged and measures byte-identical to its iter_decision_sections block; an undated
    "> **Note:**" paragraph counts; body text after a trailer counts (so does that trailer); a dated annotation inside the
    body (e.g. Intent accretion) counts; growing the entry's own text by N bytes grows authored_bytes by N;
    decision_entry refuses a missing or duplicated heading; for every live entry, the authored text is a prefix of the
    block up to its separator.
  - >-
    All seven pins (Decisions 210, 214, 222, 226, 228, 230, 237) assert authored_bytes(<that Decision's
    decision_entry block>) <= cap_bytes(), and no other assertion in their files changes meaning. No _CAP_BYTES,
    _DECISION_CAP_BYTES or literal 6144 remains in them.
  - >-
    A guard test fails when any tests/**/test_*.py module that mentions DECISIONS.md (except
    test_validate_decisions_size.py and test_decision_pin_measure.py) carries a 6144, 6_144 or 6,144 literal or compares
    len(<expr>.encode(...)) (AST scan). It fails on today's tree (red before) and passes after.
  - >-
    A test asserts cap_bytes() equals both the contract value and validate_decisions_size._PER_ENTRY_CAP_BYTES, so the
    validator's constant and the pins cannot drift from the contract.
  - >-
    Headroom after the change matches the dry build (2026-10-29, origin/main 38593bdd): 210 1,016 B; 214 2,693; 222 1,567;
    226 147; 228 2,095; 230 77; 237 958. A 300 B dated annotation on Decision 210 passes its pin (fails today); 110 B of new
    clause text in Decision 230's body fails its pin.
  - >-
    No change to docs/DECISIONS.md, docs/contracts/decision-entry.yaml, scripts/decisions_md.py,
    scripts/checks/decisions/validate_decisions_size.py or any other non-test file.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The guard and the measure's semantics, by node.
    command: >-
      bin/venv-python -m pytest -q
      "tests/checks/decisions/test_decision_pin_measure.py::test_no_test_pins_a_decision_by_its_whole_span"
      "tests/checks/decisions/test_decision_pin_measure.py::test_entry_without_trailers_measures_as_the_validator_span"
      "tests/checks/decisions/test_decision_pin_measure.py::test_body_after_a_trailer_counts"
      "tests/checks/decisions/test_decision_pin_measure.py::test_cap_is_the_contract_cap"
    expected: exit 0; four tests pass. The guard node fails on today's tree.
    fix_if: >-
      The guard names a file: route its size assertion through the fixture. Never add a file to the guard's exemptions
      beyond the two named.
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      The nodes run in every tier as ordinary unit tests; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: The new test module and all seven pin files, whole.
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_decision_pin_measure.py
      tests/checks/decisions/test_telemetry_production_catalog_decision.py tests/checks/decisions/test_secret_parameters_decision.py
      tests/checks/decisions/test_telemetry_column_additions_decision.py tests/checks/decisions/test_read_side_session_end_decision.py
      tests/checks/decisions/test_neon_catalog_tuning_decision.py tests/checks/contracts/test_ops_rule_source_records.py
      tests/ci_rca/test_recovery_policy_surfaces.py
    expected: exit 0; every test passes (the dry build ran 48 passed).
    fix_if: A pin fails - read the entry; never edit Decision text or relax an assertion to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of files this plan's scope creates or modifies; the --pre affected set already runs them.
  - step: 3
    phase: pre-deploy
    action: Prove the two behaviours the change exists for, on in-memory copies of DECISIONS.md.
    command: >-
      bin/venv-python -c "from pathlib import Path; from tests.fixtures.decision_entry import authored_bytes, cap_bytes,
      decision_entry as d; t=Path('docs/DECISIONS.md').read_text(encoding='utf-8'); e=d(t,210);
      a=e.rstrip().removesuffix('---').rstrip()+'\n\n[Amendment 2026-10-30, Decision 999: '+'x'*300+'.]\n\n---\n\n';
      b=d(t,230); g=b.replace('**Related:**','Extra clause text '*6+'\n\n**Related:**',1);
      print('annotated-210', authored_bytes(a)<=cap_bytes(), 'grown-230', authored_bytes(g)<=cap_bytes())"
    expected: exit 0; prints the annotated Decision 210 within the cap and the grown Decision 230 over it.
    fix_if: >-
      annotated-210 False: the trailer pattern missed the bracket form. grown-230 True: body text is being stripped; fix
      authored(), never the probe.
    hermetic: true
    expected_literals: ["annotated-210 True grown-230 False"]
    graduation: waive
    graduation_waiver_reason: >-
      test_decision_pin_measure.py pins both behaviours on synthetic entries in every tier; this probe replays them on the
      live entries once.
  - step: 4
    phase: pre-deploy
    action: rec-4730's own acceptance grep.
    command: >-
      bash -c '! grep -rnE "len\((entry|body)\.encode\(.utf-8.\)\) <= _(DECISION_)?CAP_BYTES" tests/checks/ && echo no-whole-span-pins'
    expected: exit 0; prints the marker.
    fix_if: A file still matches - route it through the fixture.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Subsumed by the step 1 guard node, which is stricter and runs in every tier.
  - step: 5
    phase: pre-deploy
    action: Lint and format the scope.
    command: >-
      bin/venv-python -m ruff check tests/fixtures/decision_entry.py tests/checks/decisions tests/checks/contracts/test_ops_rule_source_records.py
      tests/ci_rca/test_recovery_policy_surfaces.py && bin/venv-python -m ruff format --check tests/fixtures/decision_entry.py
      tests/checks/decisions tests/checks/contracts/test_ops_rule_source_records.py tests/ci_rca/test_recovery_policy_surfaces.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure outside
      scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Confirm rec-4730 is closed (the squash-merge Resolves trailer closes it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4730']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-4730 closed.
    fix_if: Still open - the ci.yml closure job failed; read its log and close with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: tests/fixtures/decision_entry.py
    behavior: >-
      Trailing dated annotations are excluded, everything else counts, the cap comes from the contract, and no Decision pin
      measures the whole span.
    verification_step: 1
    test_selector: tests/checks/decisions/test_decision_pin_measure.py::test_no_test_pins_a_decision_by_its_whole_span
    red_green_expectation: red before (module and guard absent; the guard node fails on today's seven pins), green after.
