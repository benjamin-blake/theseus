    if it FAILS on an origin/main worktree and PASSES on HEAD, so the interpreter it runs under decides
    admission. Two traps, verified in this container: (a) NEVER `bin/venv-python` -- a differential
    worktree has no `.venv`, so it exits 1 for ENVIRONMENT reasons on the main leg and the row is
    falsely admitted on a non-semantic failure (this genuinely happened to
    `build-lambda-deploy-function-subset`, registry.yaml ~1746, graduated 2026-07-25 by the immediately
    preceding plan); (b) NEVER bare `python -m pytest` -- the PATH interpreter has no pytest ("No module
    named pytest"), so such a row FAILS on the HEAD leg too and is rejected as not-passing-on-HEAD,
    reddening --pre. Bare `python` is fine for a yaml/stdlib token check (yaml IS importable there),
    which is why the hazard is invisible by analogy to the existing command_exit_zero rows. The escape
    for pytest steps is `primitive_slot: test_selector`, whose TestSelectorCheck runs
    [sys.executable, -m, pytest, node_id] -- sys.executable is the LIVE venv interpreter (validate is
