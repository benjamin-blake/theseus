constraints:
- No rescue agents or workaround loops (Decision 55) -- a mutant that cannot be killed within this scope becomes a recommendation via file_rec, never an inline check-module edit.
- Never weaken a check, an assertion, or an existing test to obtain green (Decision 181, docs/contracts/implement-scope-boundary.yaml CONTENT invariant). Every existing test in the seven modified files is KEPT, not replaced or relaxed.
- 'TESTS ONLY: the eight scope files are the entire diff. No check module, no Entry/Check dataclass, no docs/contracts/*.yaml, no repo-wide check-mirror meta-gate, no config change, no SLOC budget change (Decision 59 LOCATION invariant).'
- '`git diff --stat -- scripts/checks/` must be empty before every commit (step 23 is the assertion form).'
- Mutants are NEVER applied to the working tree -- only to a scratch clone under the session scratchpad (never /tmp proper, never the repo), built with `git clone --shared` plus a symlinked .venv, and addressed by mutate2.py site id ('<function>:<kind>:<ordinal>'), never by a bare line number.
- Every mutate/revert cycle must purge __pycache__ in the clone before the pytest run. A mutate-run-revert cycle completed inside one second leaves a .pyc whose recorded source mtime still validates against the reverted file, so the module keeps executing MUTANT bytecode -- this produced a false GREEN at planning time and is the single most likely way to record a wrong verdict here.
- No SLOC budget raise and no raise-approved / baseline-lowered / waiver marker anywhere (Decision 128, Decision 165); if a mirror would exceed 500 SLOC, decompose it into a mirror package, never append to one of the 16 tests/checks files already over 400 SLOC.
- Do NOT add examined()/skipped() declarations to any check module (Decision 170) -- validate_actions_evidence, validate_claude_p_retry_wrapper, validate_contract_drift and validate_ops_portal_patch_targets sit on config/check_accounting_baseline.yaml (lines 37, 50, 55, 86) and adopting the declaration is a check-module edit, i.e. out of scope; the four contracts checks in scope already declare examined() unconditionally, which is precisely why their accounting flips are observable only on stdout.
- No test may import another test_* module (Decision 131) -- shared helpers stay in the file that uses them or in the package conftest; the new ci_guards mirror is self-contained and duplicates nothing from tests/test_ci_claude_p_retry.py, which keeps the pure-helper coverage.
- Always invoke Python as bin/venv-python (AGENTS.md `## Shell invocations`); commands must be Linux/bash-compatible.
- 'Decision 148: VP steps 1-5 (RED baselines) and 17-21 (mutant kills) stay hermetic: false because they run scratch-only artifacts and their survives-today assertion inverts against the implementation-bearing tree; each of those ten steps records that reason in-step. EVERY feature-verification step -- 6, 7 and 8-15 -- IS hermetic: true, adopting D148 point 3''s restored default. Both of the draft''s deferral grounds are now withdrawn: the budget ground did not survive measurement (round 1), and the backtick ground that kept step 8 out was a property of that step''s own expected PROSE rather than of its test (round 2, note 5) -- the prose is restated by shape, the verbatim message moves to fix_if and test_obligations, and the test''s exact list-equality assertion is untouched. Hermetic set = steps 6-15, 23, 24, 25 = 13 of the MAX_REPLAYED_STEPS=20 cap, roughly 18s of the MAX_AGGREGATE_SECONDS=120 aggregate budget with a 3.4s slowest step against PER_STEP_TIMEOUT_SECONDS=30, and a programmatic _BACKTICK_LITERAL_RE sweep returns ZERO literals for every one of the thirteen, so each is matched on exit code alone.'
- 'Decision 181 point 3 (residual arm): every new stdout assertion is POSITIVE -- the presence of a PASS/FAIL/self-hosting line on a fixture chosen so the flipped operator cannot produce it -- rather than an absence claim about output that a later change could legitimately add.'
- 'Decision 130: tests/ is inside both validate_sloc_limits and validate_cc_limits (20-branch CC ceiling); keep test bodies flat (helpers + parametrize, no branching ladders).'
- 'RED-baseline sha resolution (plan-critique round 1, BLOCKING 1): any scratch clone that must stand on the pre-change tree resolves BASE in the SOURCE repo first (BASE=$(git rev-parse origin/main)), detaches onto that sha, and asserts the clone HEAD equals BASE. Never check out the clone''s own origin/main -- git clone --shared fills refs/remotes/origin/* from the SOURCE''s refs/heads/*, so that ref is the source''s LOCAL main and resolved to a stale tree at planning time (4faa43b vs origin/main 67ca10f), turning a silent wrong-tree run into a reported SURVIVED.'
- 'Kill-clone population and verdict (plan-critique round 1, note 1): `git ls-files -mo --exclude-standard -- tests/` alone is blind to STAGED-but-uncommitted files, so steps 17-21 union it with `git diff --cached --name-only --diff-filter=ACMR -- tests/` and dedupe before the tar copy; and the KILLED gate requires a matched ''N failed'' line in addition to a non-zero exit, so a missing node id (exit 4) can never masquerade as a mutant kill.'
