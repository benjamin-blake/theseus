acceptance_criteria:
- Each of the ten killable survivor sites, re-applied with mutate2.py --apply in a scratch clone that carries the new tests, makes its mirror FAIL; on the unmodified branch every one of those mirrors passes (VP steps 1-5 record SURVIVED, steps 17-21 record KILLED, per site).
- scripts/checks/ci_guards/validate_claude_p_retry_wrapper.py has a mirror at its map_source_to_test path that calls the REGISTERED fn(failed) on a synthetic tree, with a red path asserting exact list equality and a green path asserting failed == [].
- check_per_file_coverage() reports no error for scripts/checks/ci_guards/validate_claude_p_retry_wrapper.py (it measures 100% through the new mirror; no config/coverage_baseline.yaml entry is added).
- The eleventh survivor (validate_actions_evidence.py:107-108, an isinstance re-check dominated by the identical guard at :94-95) is filed as a recommendation with a discriminating acceptance command -- NOT fixed inline. VP step 28 reads that id back through the ducklake_reader boundary, so the filing is proved rather than self-reported.
- '`git diff --stat origin/main...HEAD -- scripts/checks/` is empty (no check module or manifest Entry is touched), and step 24 shows config/sloc_budgets.yaml, config/coverage_baseline.yaml and config/check_accounting_baseline.yaml unchanged; the landed diff is the eight test files, the plan file''s own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards (implement-scope-boundary.yaml graduated_registry_shard).'
- All eight test files stay <= 500 SLOC, ruff-clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.
- A second recommendation is filed at implement time for the Decision 170 residue -- deriving the four contracts checks' PASS summary lines from the CheckOutcome accounting channel instead of a separate `len(failed) == error_count_before` comparison -- and is NOT fixed inline (scripts/ change, out of scope per Decision 59). Its id is read back alongside the first one by VP step 28.
