slug: check-mirror-2c-contracts-ci-guards
intent: 'Close the ten killable behavioural holes the Task 3 mutation sweep found in the contracts and ci_guards check mirrors: two unreached shape guards in validate_actions_evidence, two registered wrappers whose failed.append no test ever executes (validate_claude_p_retry_wrapper -- which gains its first map_source_to_test mirror -- and validate_ops_portal_patch_targets), and six stdout-only comparisons (contract-drift''s self-hosting and PASS/FAIL verdict lines plus the four Decision 170 `len(failed) == error_count_before` accounting flips) that no failed[] assertion can see. The eleventh survivor is unreachable dead code and becomes a recommendation, not an inline check-module edit.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-mirror-2c-contracts-ci-guards.yaml
phase: Check-mirror behavioural coverage (defect surface of the Decision 169 mirror roster; measured by the Task 3 mutation sweep). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 3 slice 2, group check-mirror-2c-contracts-ci-guards; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: tests/checks/ci_guards/test_validate_actions_evidence.py
  action: Modify
  purpose: '177 SLOC today. Add class TestUnreachedContractGuards (three methods, reusing the module-level _fixture/_contract/_write/_yaml helpers) for two guards a verified mutation survives: (a) the day-bounds TYPE raise at validate_actions_evidence.py:53, parametrised over 7.0 and True -- both pass the ORDER guard at :55-56 that raises the identical message, so only a type-shaped fixture discriminates them; (b) the critical-step arity raise at :115, once with a selector matching no step (surface.step rewritten to the same selector so the mutant raises nothing at all) and once with a duplicated step name. The existing matrix case at line 61 asserts match=''critical step'', which the downstream ''not tied to the selected critical step'' message also satisfies -- that is the masking mechanism. Existing 18 tests kept unchanged. Projected 213 SLOC.'
- file: tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py
  action: Create
  purpose: 'The map_source_to_test mirror for scripts/checks/ci_guards/validate_claude_p_retry_wrapper.py, which has none today -- tests/test_ci_claude_p_retry.py drives only the pure helper _check_claude_p_raw_invocations, so the registered wrapper''s per-violation append at line 45 is executed by no test (slice 1 deferred this file explicitly). Drives fn(failed) with the module''s own _common.ROOT monkeypatched to a tmp_path holding .github/workflows: an unwrapped `claude -p` step -> failed == [''claude_p_retry wrapper: agent.yml:4: unwrapped `claude -p` invocation''] exactly; a clean tree exercising every skip arm (blank line, comment, `command -v claude`, `claude --version`, a wrapped call) -> failed == [] plus the PASS line; and a directory named *.yml so the helper''s `except OSError: continue` arm runs, which is what carries the module to the 100% coverage floor the new mirror activates. Projected 53 SLOC.'
- file: tests/checks/ci_guards/test_validate_ops_portal_patch_targets.py
  action: Modify
  purpose: '73 SLOC today; all five existing tests drive the pure _find_violations(paths) core, so the registered wrapper''s ROOT/tests glob and its single append (validate_ops_portal_patch_targets.py:128) are reached by no test. Add class TestOpsPortalPatchTargetsWrapperEmission that patches scripts.checks._common.ROOT to a tmp_path holding tests/test_subject.py and asserts EXACT list equality: [''ops_portal facade patch-target guard''] for a stale facade patch on the moved caller file_decision, [] for the corrected submodule patch, with the stdout banner asserted on both sides. Imports the wrapper symbol alongside the existing _find_violations alias. Existing five tests kept. Projected 105 SLOC.'
- file: tests/checks/contracts/validate_contract_drift/test_census_accounting.py
  action: Modify
  purpose: '131 SLOC today, inside the T2.56 mirror PACKAGE (tests/checks/contracts/validate_contract_drift/). Add class TestRunSummaryOutput using the package conftest''s install_fake_git/write_contract/FakeGit/valid_class_a fixtures for the gate''s two stdout-only comparisons: the self-hosting line at :167, proved on a tree whose ONLY file is contract-population.yaml (a mixed tree cannot distinguish the flipped operator, which is why 97 existing tests miss it), and the verdict line at :384, asserted positively on both a clean run (''  PASS: 1 file(s) scanned, 1 governed contract(s).'') and a single-violation run (''  FAIL: 1 file(s) scanned -- 1 violation(s).''). Existing tests kept. Projected 177 SLOC.'
