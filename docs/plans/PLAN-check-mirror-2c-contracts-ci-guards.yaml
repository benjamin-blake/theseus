execution_steps:
- 'Run VP steps 1-5 on the unmodified tree and record the SURVIVED output per site. Each step resolves BASE in the SOURCE repo FIRST (`BASE=$(git rev-parse origin/main)`), builds its own clone with `git clone --shared --quiet "$PWD" "$C"`, detaches it onto that sha (`git -C "$C" checkout --quiet --detach "$BASE"`) and asserts the clone HEAD equals BASE -- so the baseline is the true pre-change tree no matter when the step runs. Checking out the clone''s OWN origin/main does NOT do this: a --shared clone fills refs/remotes/origin/* from the source''s refs/heads/*, so that ref is the source''s local main (stale at planning time, 4faa43b vs 67ca10f) and the step would succeed silently on the wrong tree. Then symlink .venv, applies one site at a time with mutate2.py --apply, purges __pycache__, runs that module''s mirror, then reverts. If any site fails to reproduce as SURVIVED, STOP and re-derive rather than writing a test for a hole that no longer exists.'
- tests/checks/ci_guards/test_validate_actions_evidence.py -- append class TestUnreachedContractGuards with the three methods VP steps 6-7 and step 16 select, reusing the module-level _fixture/_contract/_write/_yaml helpers. The day-bounds method is parametrized over 7.0 and True on retention_classes.ordinary_ci.minimum_days; the no-match selector method rewrites BOTH governed_jobs[0].critical_step and its surface.step to the same absent selector; the ambiguous method appends a second step carrying the critical step's name to the selected job in the copied workflow. Keep all 18 existing tests.
