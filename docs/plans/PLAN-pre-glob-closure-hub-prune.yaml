intent: 'Land the reviewed hub-artefact prune in scripts/checks/deps/validate_pre_glob_closure._PRUNED_EDGES -- TWO dict rows, each carrying an inline rationale (row 1 a five-line block, so the _schema target carries a behavioural argument distinct from the 17 manifests'' registration-edge argument and the pinned 17-target count declares its cross-PR coupling; row 2 a two-line block, because the true reason it is safe is a coverage argument about load_plan''s five callers, not a reachability one) -- and pin that roster against silent staleness with a test class that asserts every key and every target resolves to a real repo module AND that every declared edge is genuinely present in the import subgraph the auditor traverses, with the row count pinned EXACTLY at the reviewed two. Measured effect, reproduced in a scratch clone against 3aca5ce on 2026-09-04: the advisory banner moves from 40 of 47 glob-gated --pre checks / 930 findings to exactly 39 of 47 / 279 findings, with validate_root_scoped_diff_base the single check that goes clean. This is PR 1 of the Task 6 coordinated series and it does exactly one thing: it does NOT widen a single pre_globs declaration (that is the ~17-PR domain-scoped middle of the series), it does NOT flip the auditor to blocking (that is 4c, the last PR, landing alone), and it does NOT touch the module docstring''s wave-4c staging paragraph. The auditor stays ADVISORY on both channels: failed is still never appended to, and the registered wrapper still declares examined(47, unit=gated_pre_checks).'
