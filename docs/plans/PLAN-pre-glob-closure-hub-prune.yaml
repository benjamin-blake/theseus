rollback: 'Single squash commit, and unlike a roster-shrink change this one is FULLY REVERSIBLE both before and after merge -- nothing here is a one-way ratchet. Pre-merge: dropping the branch undoes everything. Post-merge: a straight revert restores the empty _PRUNED_EDGES literal and the previous test class together, and the tree is green again, because the auditor is ADVISORY on both channels at this stage -- it never appends to failed, so neither the pruned nor the unpruned roster can fail a tier. The two halves must be reverted TOGETHER: reverting the module alone leaves the roster tests red (three of them assert content that would no longer exist), and reverting the test file alone leaves the roster unpinned, which is the vacuous-green state this unit exists to remove. The graduated shard config/agent/verification_registry/entries/pre-glob-prune-roster-liveness.yaml is an ADD and is removed with the same revert; no accounting clause is tripped by its removal. Ordering note for the series: this PR is a prerequisite for the ~17 domain-scoped residual PRs only in the sense that it fixes the denominator they measure against -- none of them depends on it structurally, so reverting this one does not invalidate work already merged after it, it only restores the 930-finding census. What a revert must NOT be used for is escaping a count assertion: if VP step 5 measures something other than 279, the correct responses are to fix the roster or to record a moved baseline and rebase, never to revert the pin and merge an unpinned roster. Forward-fix applies to any post-merge defect (Decision 55): a stale row is DELETED from the roster, never renamed to something that happens to resolve.'
