acceptance_criteria:
- '_PRUNED_EDGES is exactly TWO dict rows and no more: scripts.checks.registry mapped to 18 targets (scripts.checks._schema plus the 17 domain _manifest modules, one per registered domain) and scripts.checks._common mapped to the single target scripts.roadmap.plan_document. The brief''s cap of 4 is read as DICT ENTRIES, not edges (see the constraints and context entries that settle this), so two rows sits well inside it -- and a test asserts len(_PRUNED_EDGES) == 2 AND len(_PRUNED_EDGES) <= 4. The EXACT clause is what binds (a third row reddens it and the exact-content test together); the <= 4 clause records the reviewed wave ceiling. The retired test_starts_empty pinned the count exactly at 0, so its replacement pinning it exactly at 2 is another exact pin and not a 0 -> 4 allowance (Decision 181 disposition).'
- 'Each of the two rows is immediately preceded by an inline rationale comment inside the literal block -- row 2 by a TWO-line rationale (one line cannot carry the corrected claim -- see the scope row), row 1 by a FIVE-line block whose first line is the Decision 169 registration-fan-out argument for the 17 _manifest targets, whose middle lines are the DISTINCT behavioural argument for the scripts.checks._schema target, whose fourth line is the row''s removal condition (the Decision 155 precedent shape: a narrow tolerance carries an explicit reversal condition), and whose fifth line declares the cross-PR coupling the pinned 17-target count creates for any future PR adding a check domain -- and a test asserts that property by ast-locating the _PRUNED_EDGES assignment and requiring the nearest preceding non-blank line of every row to start with ''#''.'
- 'On the branch tree the registered auditor prints exactly ''ADVISORY: 39 of 47 glob-gated --pre check(s) ... (279 finding(s) total)''. Both numbers are pinned exactly, not as a direction of travel: 39 and 279 were reproduced in a scratch clone against 3aca5ce on 2026-09-04, down from exactly 40 and 930 on the unmodified tree.'
- 'The prune is monotone and adds no finding anywhere: pruning only removes closure paths, so every gated check''s count moves down or stays equal. Exactly one check clears completely (validate_root_scoped_diff_base, 40 checks with findings -> 39), and the auditor''s own Entry stays clean (its dogfood test test_its_own_pre_globs_cover_its_own_closure passes unchanged).'
- 'The prune removes ZERO real gate coverage, verified by measurement rather than argument. THREE gated --pre checks read the manifest roster, not two, and each keeps all 18 pruned targets through its OWN declared globs, independently of this prune: validate_pre_glob_closure (declares scripts/checks/** AND scripts/checks/*/_manifest.py), validate_check_accounting (declares scripts/checks/**), and validate_check_manifests -- which does not go through registry at all but globs the manifests off the filesystem itself (_MANIFEST_GLOB = ''scripts/checks/*/_manifest.py'' at scripts/checks/deps/validate_check_manifests.py:20, consumed at :61) and declares scripts/checks/**, docs/contracts/check-manifest.yaml and scripts/dependency_graph.py. Re-measured 2026-09-04 against the live registry: all three are pre=True with pre_globs matching every one of the 18 target paths, so a manifest or _schema edit still selects each of them. Every other gated check reaches those 18 targets solely through registry''s Decision 169 registration import, and no check that imports _schema DIRECTLY loses it from its closure (0 of the 45 checks that lose _schema import it directly; the direct edge is untouched by a prune keyed on registry). Residual, declared rather than implied (Decision 135 spirit flag, Decision 181 point 2''s declare-your-coverage discipline) and declared across ALL THREE affected surfaces rather than only _schema: what the prune DOES remove is the auditor''s ability to ever again REPORT a gated check whose pre_globs miss scripts/checks/_schema.py, any of the 17 scripts/checks/*/_manifest.py files, or scripts/roadmap/plan_document.py -- 19 distinct paths across 39 of the 47 gated checks, measured 2026-09-04 by differencing the per-entry unmatched sets before and after. That is a reporting blind spot in an ADVISORY auditor, bounded by the three roster-readers'' own globs above, and it becomes load-bearing only at the wave-4c flip, which lands alone and re-reviews this roster.'
- 'The auditor is still ADVISORY on both channels and this unit does not flip it: the registered wrapper leaves failed == [] on the live tree and declares examined(47, unit=''gated_pre_checks''), and the module docstring -- including the wave-4c paragraph -- is byte-identical to origin/main (asserted by comparing ast.get_docstring on both revisions).'
- 'NO pre_globs declaration changed anywhere: the merge-base diff contains no added or removed line carrying the token pre_globs, and none of the 17 scripts/checks/*/_manifest.py files appears in the diff at all.'
- 'The FOUR roster tests that depend on the roster''s content are RED before the change and GREEN after. Measured 2026-09-04 in a scratch clone: 3 failed / 40 passed on the unmodified module with the new test file in place, then 43 passed / 0 failed with the literal applied -- a pair taken before the Decision 181 cap tightening, which moves the cap test from `<= 4` to `== 2 and <= 4` and therefore reddens it too, so the expected before-state is 4 failed / 39 passed. That 4 / 39 pair is DERIVED from the measurement by exactly one assertion and is re-confirmed by VP step 3, never assumed; the after-state total of 43 passed / 0 failed is unchanged because the class still holds five tests. The negative-control test is green in both states BY CONSTRUCTION and is declared as such rather than being claimed as a red-green pair.'
- The diff touches exactly the two scope rows plus this plan file and the single graduated verification-registry shard config/agent/verification_registry/entries/pre-glob-prune-roster-liveness.yaml (a Decision 176 sanctioned companion, never a scope row) -- asserted over _common.get_status_aware_diff(), the merge-base-relative, untracked-aware seam validate_scope_boundary itself consumes. Nothing under src/**, terraform/**, scripts/executor/**, config/**, docs/contracts/** or any deploy-trigger path.
- Both touched files stay under the 500-SLOC limit with headroom (measured 182 and 327 after the edit), neither is registered in config/sloc_budgets.yaml, and the diff contains no '# raise-approved:' marker and no new config/mypy_baseline.yaml, config/coverage_baseline.yaml or config/sloc_budgets.yaml entry (Decision 128, Decision 165, Decision 159, Decision 161).
- 'Per-file line coverage for scripts/checks/deps/validate_pre_glob_closure.py measures 100.0 under its own mirror suite (measured 2026-09-04: 77 statements, 0 missed), meeting Decision 159''s implicit-100% standard for a changed file with no coverage_baseline entry.'
- Selection breadth for the two-row scope measures 95 selected test modules against a 528-module census -- a 190.0s test-half allowance and a within_budget prediction under the Decision 182 formula, against the unwaivable 240s non-test budget. The scope is not grown to absorb any out-of-scope finding, and the before/after fast-tier wall clock (elapsed, non-test half, test half) is recorded in the PR body from VP steps 2 and 12.
- 'rec-3356 and rec-3387 stay OPEN and unbundled -- both are pre_globs-widening work this unit is forbidden to do -- and rec-3289 is cited as closed history only. bundled_recommendations is empty and the squash-merge commit body carries no Resolves: trailer.'
- '_PRUNED_EDGES stays LOCAL to this auditor and feeds no selection channel, so Decision 135 clause 1''s strictly-additive selection is untouched: the only .py files naming it are the module, its mirror test and the stale comment in scripts/checks/deps/_manifest.py, and scripts/checks/deps/affected_tests.py neither names it nor imports the auditor -- its reverse-dependency BFS still walks the FULL unpruned graph, so selection can still only grow. VP step 14 asserts both halves mechanically rather than leaving them as argument.'
- 'The stale standing-candidates comment at scripts/checks/deps/_manifest.py:55-59 -- which names scripts.lambda_manifest and scripts.roadmap.plan_document as the candidates for a reviewed _PRUNED_EDGES entry and therefore does not match the landing roster (registry -> _schema plus 17 manifests, _common -> plan_document) -- is filed as a recommendation via scripts.ops_data_portal, unbundled and with no Resolves: trailer (Decision 103), and is NOT edited here: that file is outside the two scope rows and VP step 8''s allowed set reddens on any edit to it (Decision 59).'
- 'The PR body states that this prune is a ONE-TIME hub allowance and NOT the pay-down method (Decision 163): the ~17 residual PRs close their findings by ADDING GLOBS, and the structural bound on the allowance is the exact two-row content pin plus the cap and rationale-comment tests. A gate staged to become mandatory is not made discretionary by widening its exception list, and this unit widens that list exactly twice, under review, with a stated removal condition.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'BEFORE, measured on the UNMODIFIED merge-base. In a throwaway clone checked out at origin/main, dispatch the registered auditor and assert its advisory banner reads 40 of 47 with 930 findings, with failed still empty. Run FIRST, before any working-tree edit. hermetic false for a stated reason and not for cost (Decision 148): it shells out to git clone and git checkout and asserts the pre-change census that this plan deliberately moves, so replaying it against the implementation-bearing tree would exit 1.'
  command: 'test "$(git rev-parse main)" = "$(git rev-parse origin/main)" || { echo "STOP (N1): local main has drifted from origin/main -- run git fetch origin main and re-run; a --shared clone resolves origin/main from the SOURCE refs/heads/main, so a stale local main would silently measure the wrong BEFORE census"; exit 1; }; C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && git -C "$C" checkout --quiet origin/main && cd "$C" && bin/venv-python -c "import io, contextlib; from scripts.checks import registry; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure; buf=io.StringIO(); failed=[]; r=contextlib.redirect_stdout(buf); r.__enter__(); s=registry.outcome_scope(''validate_pre_glob_closure''); s.__enter__(); validate_pre_glob_closure(failed); s.__exit__(None, None, None); r.__exit__(None, None, None); d=registry.pop_declaration(); line=next((l.strip() for l in buf.getvalue().splitlines() if ''ADVISORY:'' in l), ''''); print(line); print(''failed='', failed, ''| kind='', d.kind, ''| examined='', d.count, ''| unit='', d.unit); raise SystemExit(0 if failed == [] and d.kind == ''examined'' and d.count == 47 and ''40 of 47'' in line and ''(930 finding(s) total)'' in line else 1)"'
  expected: 'Exit 0, echoing the ADVISORY line for 40 of 47 glob-gated --pre check(s) with 930 findings, then failed= [] | kind= examined | examined= 47 | unit= gated_pre_checks. The predicate matches ''ADVISORY:'' WITH THE COLON on purpose: the module prints a header banner ''=== Pre-glob closure audit (ADVISORY, D2-3 / rec-3289) ==='' at validate_pre_glob_closure.py:202 BEFORE the summary line at :177, so a bare ''ADVISORY'' match selects the banner and the census assertion then fails unconditionally. Provenance, re-stated for the CORRECTED command (the earlier ''reproduced'' note was carried over from a hand-run census, not from this literal): on 2026-09-04 a --shared clone was built at origin/main (3aca5ce) and this payload executed verbatim -- it printed the 40 of 47 / 930 ADVISORY line and exited 0, while the same payload with the bare ''ADVISORY'' predicate printed the banner and exited 1.'
  fix_if: 'FIRST, before reading the count as a signal: if the step exits 1 while the echoed line is the ''=== Pre-glob closure audit (ADVISORY, ...) ==='' BANNER rather than a summary beginning ''ADVISORY:'', the predicate was reverted to the bare ''ADVISORY'' match -- restore the colon; that is a defect in this command, not a moved census. A DIFFERENT before-count on a correctly-matched summary line means main moved under this branch (another PR in the series landed a widened glob, or a check module grew an import). Record the actual measured pair verbatim in the PR body, rebase, and re-derive the AFTER pair from the same tree -- then update nothing in this plan without a human-directed amendment. NEVER edit the auditor, grow _PRUNED_EDGES, or widen a glob to reach 930. A STOP (N1) message instead of a census means local main is behind origin/main: fetch and re-run rather than measuring a stale BEFORE.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the pre-change census this plan exists to move, on a clone of origin/main; it holds only on pre-change code, so graduating it would land a guard that fails permanently the moment the change merges.
- step: 2
  phase: pre-deploy
  action: 'BEFORE fast-tier wall clock, on the same unmodified merge-base clone, so the PR body can carry a like-for-like before/after pair rather than an assertion of direction. Record the tier''s own printed ''This run''s local wall clock (Xs: non-test Ys, test Zs)'' figures and the predicted CI range. hermetic false: it runs the real tier against a real git tree and its numbers are local-hardware measurements this plan does not control.'
  command: 'test "$(git rev-parse main)" = "$(git rev-parse origin/main)" || { echo "STOP (N1): local main has drifted from origin/main -- run git fetch origin main and re-run; a --shared clone resolves origin/main from the SOURCE refs/heads/main, so a stale local main would silently measure the wrong BEFORE census"; exit 1; }; C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && git -C "$C" checkout --quiet origin/main && cd "$C" && bin/venv-python -m scripts.validate --pre'
  expected: Exit 0 on the unmodified merge-base. Record the printed elapsed, non-test-half and test-half seconds verbatim in the PR body as the BEFORE row; no number is asserted here, because local wall clock is hardware-dependent and the tier's own budget assertion is what gates.
  fix_if: 'A non-zero exit on the UNMODIFIED merge-base is a pre-existing main-branch failure, not this plan''s: stop, and route it per the post-merge full-tier protocol (ci-rca files it; do not patch inline). If the run is budget-breached on local hardware only, record the figure and note that CI''s measured non-test half is the gating quantity.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A one-off before-measurement on a clone of origin/main whose value is a local wall clock; the standing enforcement of both budgets is validate.py's own budget-assertion scaffold on every --pre run.
- step: 3
  phase: pre-deploy
  action: 'RED -- the three content-dependent roster tests fail against the UNPRUNED module. In a throwaway clone, copy the branch''s edited test file over the clone''s, then restore the module alone from origin/main, and run the roster class. Proves the new assertions are not vacuously green against an empty roster. hermetic false: it shells out to git clone and git checkout and asserts a failing pytest run.'
  command: 'test "$(git rev-parse main)" = "$(git rev-parse origin/main)" || { echo "STOP (N1): local main has drifted from origin/main -- run git fetch origin main and re-run; a --shared clone resolves origin/main from the SOURCE refs/heads/main, so a stale local main would silently measure the wrong BEFORE census"; exit 1; }; C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && cp tests/checks/deps/test_validate_pre_glob_closure.py "$C/tests/checks/deps/test_validate_pre_glob_closure.py" && git -C "$C" checkout --quiet origin/main -- scripts/checks/deps/validate_pre_glob_closure.py && cd "$C" && bin/venv-python -m pytest tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster -q -p no:cacheprovider --randomly-seed=12345; rc=$?; echo "pytest_rc=$rc"; test "$rc" -eq 1'
  expected: pytest exits 1 with 4 failed and 1 passed, and the step itself exits 0 because that exit is inverted. The four reds are test_the_roster_is_the_two_reviewed_hub_rows, test_row_count_is_exactly_the_reviewed_two_and_within_the_cap, test_every_declared_edge_is_live_in_the_import_subgraph and test_every_row_is_preceded_by_an_inline_rationale_comment; only the negative control is green in both states by construction. The 3-failed / 2-passed pair reproduced 2026-09-04 in a scratch clone predates the Decision 181 cap tightening, which moved the cap test from `<= 4` (green against an empty roster) to `== 2 and <= 4` (red against it); the 4 / 1 pair is DERIVED from that measurement by exactly one assertion and is re-confirmed by running this step, never assumed.
  fix_if: 0 failed means the roster tests are vacuous against an empty roster -- the non-vacuity guards (assert vpgc._PRUNED_EDGES, and the exact two-key assertion) are missing or were weakened; add them back, never delete the step. More than 4 failed means the new test class also depends on something else the module edit provides -- diagnose the extra failure rather than relaxing an assertion (Decision 181).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts a FAILING pytest run against pre-change code in a clone; graduating it would land a registry row that reddens permanently once the literal merges.
