  phase: pre-deploy
  action: 'GREEN -- the roster class passes with the two rows in place. This is the anti-staleness guard the whole task owes: keys and targets resolve to real repo modules, every declared edge is present in the live import subgraph, the cap holds, the negative control reports exactly the four dead-row shapes, and every row carries its inline rationale.'
  command: bin/venv-python -m pytest tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster -q -p no:cacheprovider --randomly-seed=12345
  expected: All five tests in the class pass, including the tightened cap assertion. Measured red-then-green in a scratch clone on 2026-09-04 with the cap test in its pre-tightening `<= 4` form; the `== 2` clause added by the Decision 181 disposition is satisfied by the same two-row roster and is re-confirmed here.
  fix_if: 'A dead-edge report names a row whose target registry no longer imports: that row now prunes nothing and must be DELETED, not renamed to something that happens to resolve. A missing-module report means a key or target was typo''d. Fix the roster, never the assertion (Decision 181).'
