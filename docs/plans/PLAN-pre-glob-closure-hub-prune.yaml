  command: bin/venv-python -c "import io, contextlib; from scripts.checks import registry; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure; buf=io.StringIO(); failed=[]; r=contextlib.redirect_stdout(buf); r.__enter__(); s=registry.outcome_scope('validate_pre_glob_closure'); s.__enter__(); validate_pre_glob_closure(failed); s.__exit__(None, None, None); r.__exit__(None, None, None); d=registry.pop_declaration(); line=next((l.strip() for l in buf.getvalue().splitlines() if 'ADVISORY:' in l), ''); print(line); print('failed=', failed, '| kind=', d.kind, '| examined=', d.count, '| unit=', d.unit); raise SystemExit(0 if failed == [] and d.kind == 'examined' and d.count == 47 and '39 of 47' in line and '(279 finding(s) total)' in line else 1)"
  expected: 'Exit 0, echoing the ADVISORY line for 39 of 47 glob-gated --pre check(s) with 279 findings, then failed= [] | kind= examined | examined= 47 | unit= gated_pre_checks. The ''ADVISORY:'' predicate carries the colon for the reason step 1''s expected records (the header banner at :202 also contains the bare word). Provenance, re-stated for the CORRECTED command: on 2026-09-04 the two-row literal was applied in a scratch clone of 3aca5ce and this payload executed verbatim -- it printed the 39 of 47 / 279 ADVISORY line and exited 0.'
