  action: Modify
  purpose: 'Replace the empty _PRUNED_EDGES literal with the two reviewed rows and nothing else. Row 1, key scripts.checks.registry, 18 targets: scripts.checks._schema plus the 17 domain _manifest modules, preceded by a FIVE-line rationale block rather than a single line (Decision 135 spirit-flag disposition): line 1 the Decision 169 registration-fan-out argument for the 17 _manifest targets (registry imports them only to assemble _ALL_ENTRIES); lines 2-3 the DISTINCT behavioural argument for the scripts.checks._schema target (a pure declaration module with no first-party imports, so the prune drops one path and nothing behind it; the 45 checks that lose it do not import it directly, and any check that reads Entry keeps it through its own direct edge); line 4 the row''s explicit removal condition, on the Decision 155 precedent shape (delete the row if a check is shown to need _schema or a manifest in its closure, or at the wave-4c flip); line 5 the cross-PR coupling the mirror test creates (the 17-target count is PINNED, so a PR adding an 18th check domain must extend this row in the same PR -- deliberate, because a new domain''s registration edge deserves the same review, but undeclared until now and invisible to a domain author who would never otherwise open this file). Exact wording is the implementer''s, bounded by the 127-character line limit. Row 2, key scripts.checks._common, one target scripts.roadmap.plan_document, preceded by a TWO-line rationale. The single line an earlier draft prescribed ("never on a check body''s path, recorded only by ast.walk") is FALSE OF THE CODE and must not be written: the import sits inside _common.load_plan (scripts/checks/_common.py:205-218, the deferred import at :214), and load_plan IS on the body path of five checks -- validate_scope_boundary.py:152, validate_vp_replay.py:176, validate_graduation_completeness.py:103 and :192, validate_handoff_full_tier.py:95 and validate_fallback_reevaluation.py:236 -- so scripts.roadmap.plan_document is a genuine runtime dependency of those bodies, not an ast.walk artefact. The rationale states the TRUE reason the row is safe, which is a coverage argument rather than a reachability one: the import is a deferred, PLC0415-exempt function-scope import in _common.load_plan, and of its five callers three are UNGATED (validate_scope_boundary, validate_vp_replay and validate_graduation_completeness all declare pre_globs=None, so they always run) while the two gated ones already declare scripts/roadmap/** independently (validate_fallback_reevaluation, validate_handoff_full_tier) -- so no gated check loses a path it needs. Re-verified 2026-09-04 against the live registry. Exact wording is the implementer''s, bounded by the 127-character line limit; a drafted pair measured 106 and 114 characters. NOTHING else in the module changes -- not the docstring (its wave-4c paragraph is updated when the flip lands, not now), not _closure_modules, not _unmatched_paths, not _audit, and not the registered wrapper -- with ONE named exception inside the same in-scope file: the header comment paragraph immediately above the literal, whose ''INTENTIONALLY EMPTY at introduction'' sentence becomes false the moment the rows land, is rewritten to record the wave-4b discharge and to keep the module''s own ''add an entry only with an inline comment'' rule stated. That paragraph is a comment, not the docstring, so VP step 8''s byte-identical docstring assertion is unaffected, and leaving it would ship a module whose comment contradicts the literal it introduces. Measured at 234 lines / 182 SLOC for the previously drafted one-line-rationale form; the added rationale lines and the header rewrite are comments, which the SLOC counter excludes, so SLOC stays 182 while the line count rises to roughly 240 (the earlier 238 estimate predates row 1''s fifth line and row 2''s second) -- both against a 500 limit and no config/sloc_budgets.yaml entry, and both re-measured (printed, never pinned) by VP step 10.'
