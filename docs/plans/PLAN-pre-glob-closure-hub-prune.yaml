constraints:
- Do NOT widen a single pre_globs declaration anywhere in this diff. Closing a domain's residual with real globs is the ~17-PR middle of the Task 6 series; this unit is PR 1 and a widened glob here is a hard STOP (VP step 8 asserts it mechanically).
- Do NOT flip the auditor to blocking. failed is never appended to, the Decision 55 loud-skip guard stays, and the module docstring's wave-4c staging paragraph is NOT updated -- that edit belongs to PR 4c, which lands alone after the backlog reaches zero.
- Do NOT add a third or fourth _PRUNED_EDGES row, and do NOT extend either row's target tuple beyond the 18 + 1 measured targets. Growing the roster is the cheapest way to make any finding vanish; the cap test and the exact-content test both redden if it happens.
- 'The ''at most 4 rows'' cap is read as DICT ENTRIES (importing modules), not edges: _PRUNED_EDGES maps ONE importing module to a TUPLE of dropped targets, and the brief''s own context calls the registry-to-17-manifests set ''one edge set''. Two rows, 19 edges. If a reviewer prefers the per-edge reading, that is a plan amendment, not an implement-time judgement call -- STOP and escalate rather than resolving it in the diff.'
- 'Replacing TestPrunedEdgesRoster::test_starts_empty is a SUPERSESSION, not a weakening (Decision 181): its whole contract was the staging precondition ''INTENTIONALLY EMPTY at introduction ... an entry may only be added with an inline reason (wave 4b pay-down)'', which this authorised wave-4b pay-down discharges, and it is replaced by five strictly stronger assertions on the same object. Say so explicitly in the PR body. Deleting any OTHER existing test, or relaxing any existing assertion, is forbidden.'
- Never satisfy a count assertion by editing the auditor, growing _PRUNED_EDGES, or widening a glob. If the BEFORE pair is not 40 of 47 / 930, record the real measurement and rebase -- the counts are evidence, not targets.
- 'No cross-test imports (Decision 131): the new class owns its helpers and imports only stdlib plus scripts.checks._common and the module under test -- never from a sibling test module, including the ones whose fixture style it follows.'
- 'Do NOT touch anything outside the two scope rows. In particular: no scripts/checks/*/_manifest.py, no config/** (no sloc_budgets, mypy_baseline, coverage_baseline or ci_rca_taxonomy edit), no docs/contracts/**, and nothing under src/**, terraform/**, scripts/executor/** or any deploy-trigger path. An out-of-scope blocking finding becomes a recommendation via scripts.ops_data_portal, never an inline fix (Decision 59, Decision 55).'
- 'Do NOT bundle a recommendation. rec-3356 and rec-3387 are cited because the brief directs it, but both are pre_globs-widening work this unit is forbidden to do, so neither is closed here and the squash-merge body carries no Resolves: trailer. rec-3289 is CLOSED history, never bundled work.'
- Do NOT add a '# raise-approved:' marker, a config/sloc_budgets.yaml entry, a config/mypy_baseline.yaml entry or a config/coverage_baseline.yaml entry to obtain green (Decision 128, Decision 165, Decision 161, Decision 159). Both files measure well under 500 SLOC and the module measures 100.0 line coverage.
- The graduated shard id is pre-glob-prune-roster-liveness, verified ABSENT among the 616 shards on disk at 2026-09-04. Decision 176's one-record-per-file grain makes filename equal check_id, so check_ids are a GLOBAL namespace and a generic name silently overwrites another plan's record; do not reach for a generic id.
- 'Record the honest before/after ledger in the PR body -- findings count, checks-with-findings count, selection breadth, and fast-tier wall clock (elapsed, non-test half, test half) for BOTH states. The brief makes this a merge precondition, not a courtesy: the done-criterion is gameable and the ledger is what makes the gaming visible.'
- 'The row-count pin is EXACT, not a headroom allowance (Decision 181 disposition): the cap test asserts len(_PRUNED_EDGES) == 2 as well as <= 4. The `<= 4` clause records the reviewed wave ceiling for a reader; it is not permission to fill it. Adding a third row is a plan amendment, not an implement-time judgement call -- STOP and escalate.'
- 'This prune is a ONE-TIME hub allowance, never the pay-down method (Decision 163): the ~17 residual PRs close their findings by ADDING GLOBS to the checks that under-declare them. Do not answer a residual finding in any later PR of this series with a new _PRUNED_EDGES row.'
- 'Each row carries an explicit REMOVAL condition in its inline rationale, on the Decision 155 precedent shape (a narrow tolerance is granted per call site and names what would reverse it): the row is deleted if a check is shown to need a pruned target in its closure, or at the wave-4c flip that re-reviews the roster. A stale row is DELETED, never renamed to something that happens to resolve.'
- 'Do NOT edit scripts/checks/deps/_manifest.py. Its comment at lines 55-59 names scripts.lambda_manifest and scripts.roadmap.plan_document as the standing candidates for a reviewed _PRUNED_EDGES entry and goes stale on merge, but that file is outside the two scope rows: file it as a recommendation via scripts.ops_data_portal (unbundled, no Resolves: trailer) and leave the comment alone (Decision 59, Decision 55, Decision 103).'
- The ONE comment edit permitted inside the module is the header paragraph directly above the literal -- the 'INTENTIONALLY EMPTY at introduction' sentence, which the rows falsify. Rewrite that paragraph to record the wave-4b discharge and keep the 'add an entry only with an inline reason' rule stated. The module DOCSTRING, including its wave-4c staging paragraph, stays byte-identical (VP step 8 asserts it).
