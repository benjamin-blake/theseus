- 'The module changes by EXACTLY ONE ROW plus its inline rationale comment, and by nothing else. Asserted in VP step 10 rather than by eyeball, on three surfaces at once: ast.get_docstring equality against `git show origin/main:scripts/checks/deps/validate_pre_glob_closure.py`; BYTE-IDENTITY of the whole file prefix up to the `_PRUNED_EDGES: dict` marker -- which covers the module docstring, the imports AND the _PRUNED_EDGES preamble comment including its WAVE 4b DISCHARGE paragraph; and BYTE-IDENTITY of the whole file suffix from the `# Per-check cap on printed paths` marker to EOF, which covers _MAX_PRINTED_PATHS, _UNRESOLVABLE_TEMPLATE and every helper and entry point below the literal. Prefix plus suffix leave exactly one region of the file free -- the literal body -- so ''and by nothing else'' is a measured claim rather than a reading of the diff; both marker strings are pinned to one occurrence per side (marker_counts=) so neither split can drift onto a duplicate. An earlier draft of this plan MANDATED a re-statement of that paragraph while this criterion barred completing it -- a mandated edit and a prohibition on finishing it, in one plan. The mandate is WITHDRAWN (the preamble stays byte-identical) and this criterion is replaced by the strictly stronger prefix pin, so the contradiction is resolved in the direction of MORE pinning, never less. The inaccuracy a third row leaves in that paragraph is filed as a recommendation at closure, named exactly in the recommendation-to-file context entry.'
- 'The known inaccuracy in the merged WAVE 4b DISCHARGE paragraph is FILED, not fixed here, and the diff proves it. The paragraph is byte-identical to origin/main''s -- VP step 10''s preamble_identical= half, reproduced in a scratch clone at e27d2d2 on 2026-09-04 as True on the unedited paragraph and False when a single word is inserted into its first line, so the assertion discriminates rather than merely passing -- and the PR body names the three defects a third row leaves in it (count, attribution, "one-time") and records that a recommendation carries them. Correcting it inline would be an out-of-scope edit under Decision 59 AND a claim about two merged PRs'' history written into permanent source, which is the exact class three critique rounds closed on. Note the surfaces are disjoint: ast.get_docstring does not cover a `#` comment, which is why the preamble is pinned by the prefix byte-identity half of criterion 6 rather than by the docstring half.'
- Every _PRUNED_EDGES row is RESOLVABLE (key and every target map to a real repo module present in the import subgraph), LIVE (every declared pair is genuinely an edge of that subgraph), and LOAD-BEARING (its key is in at least one gated check's unpruned closure AND applying the row strictly shrinks at least one gated closure). The third property is new in this unit and is what rec-3553 records as missing.
- 'Red-then-green is measured, not claimed: the three roster/effect tests fail against the unmodified module and pass against the modified one, and test_every_row_key_is_reachable_from_a_gated_closure fails when a deliberately inert row (scripts.build_lambda -> scripts.build_lambda_config, a live edge whose key no gated closure reaches) is injected into the real roster.'
- 'The negative control''s TWO fixtures are NAMED and MEASURED, not left to the implementer, because a control that fires on only one shape halves the discriminating power the reachability pin rests on. Shape 1 (unreachable key): scripts.build_lambda -> scripts.build_lambda_config -- view.has_edge True, key in NO gated check''s unpruned closure. Shape 2 (reachable key, prunes nothing): scripts.checks._scaffolding -> scripts.checks._common -- view.has_edge True, key in the unpruned closures of exactly 3 gated checks (validate_differential_gate_baseline, validate_verification_registry, validate_hermeticity_flags), and adding the row shrinks NO gated closure because scripts.checks._common is independently reachable from every gated check module. Both pairs and all four properties were measured in a scratch clone at e27d2d2 on 2026-09-04. Each row is judged ALONE against the UNPRUNED closure -- the roster patched to that single row versus the roster patched to empty -- for BOTH shapes, never against the live roster minus the row. Measured 2026-09-04 that the two bases coincide today for all three reviewed rows and for both fixtures, because no row key is a target of any row (key/target overlap is the empty set); the single-row basis is stated because it stays well defined if that disjointness ever breaks. A fixture that is not a live edge of the import subgraph would make the detector report for the wrong reason and does not satisfy this criterion.'
- 'The new row carries an inline rationale comment directly above it inside the literal -- enforced by the pre-existing test_every_row_is_preceded_by_an_inline_rationale_comment -- and that comment is EXACTLY the block the scope row carries verbatim: the edge, the inheritance route through scripts.checks._scaffolding and its module-scope import of _budget_recs, the two function-scope portal imports inside _file_budget_breach_rec and _file_budget_bypass_rec, the measured effect, the FOUR removal triggers (a check''s verdict shown to depend on portal code; a module-scope scripts.ops_data_portal import appearing in scripts/checks/_budget_recs.py; a check reaching _budget_recs shown to examine portal behaviour; the wave-4c flip) and the ceiling sentence naming this as the third of the operator''s four allowed rows. The module''s own rule for adding an entry requires the reason and a removal condition; the decision-scout''s Decision 135 and Decision 181 flags fix the removal condition''s content; and constraint 14 fixes what may NOT be in it -- every clause maps to a verification_plan step that fails if the clause is false, and no clause without such a step appears. No line number appears in the comment.'
