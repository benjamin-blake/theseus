- 'The alternative the brief requires be weighed, and why it is REJECTED here on measurement rather than on taste: widening instead would mean the three verification checks declaring scripts/ops_portal/**, scripts/executor/**, scripts/llm/** and src/common/**. Measured cost is real but modest -- 59 tracked files would newly select the three checks (`for d in scripts/ops_portal scripts/executor scripts/llm src/common; do git ls-files "$d" | wc -l; done` gives 14, 25, 5 and 15 at e27d2d2), and the three checks together run in about five seconds, re-measured 2026-09-04 by timing each Entry''s callable directly. That five is recorded as an order of magnitude and deliberately NOT as a pin: wall-clock timings move run to run, and a pinned timing is exactly the kind of prose number that rots. Against Decision 182''s unwaivable non-test half it is noise on any executor, portal, llm or src/common edit. Cost is therefore NOT the argument.'
- 'The argument that decides it is HONESTY of the declaration, and it cuts against widening: a glob is a claim that the file is an INPUT to the check. These three read docs/plans/** and config/agent/verification_registry/**; they never read portal, executor or llm code. Declaring scripts/executor/** on them would state something false, and a catch-all declaration silences this auditor for that whole subtree permanently -- the same fail-open blindness in the opposite direction, on the very surface Decision 169 keeps statically greppable. A _PRUNED_EDGES row is capped at four, carries a mandatory inline rationale, is pinned by liveness, exact-content and (from this unit) load-bearing tests, and reddens a build when it goes stale. Both routes make a finding vanish; only one leaves a reviewable, tested artefact behind.'
