scope:
- file: scripts/checks/deps/validate_pre_glob_closure.py
  action: Modify
  purpose: "Add exactly one row to the _PRUNED_EDGES literal, as the LAST entry after the scripts.checks._common row: `\"scripts.checks._budget_recs\": (\"scripts.ops_data_portal\",),`, directly beneath the inline rationale comment block reproduced verbatim below. NOTHING ELSE IN THE MODULE CHANGES. Not the module docstring (including its wave-4a/4b/4c staging paragraph); not the _PRUNED_EDGES PREAMBLE COMMENT, whose WAVE 4b DISCHARGE paragraph stays BYTE-IDENTICAL to origin/main -- the inaccuracy a third row leaves in that paragraph is FILED as a recommendation at closure, named exactly in the recommendation-to-file context entry, and is not fixed by this unit; not the two merged rows; not _glob_match, _module_to_repo_path, _closure_view, _closure_modules, _gated_entries, _unmatched_paths, _audit, the registered entry point, _MAX_PRINTED_PATHS or _UNRESOLVABLE_TEMPLATE. The check stays ADVISORY -- nothing is ever appended to `failed`. This unit adds a row and nothing else.\n\nThe comment is bounded by constraint 14: a clause may appear in it ONLY if a named verification_plan step FAILS were that clause false. It therefore carries exactly five things and no argument beyond them. Write it verbatim (the triple backticks are this plan's delimiters and are NOT part of the comment; every line inside them, including its four-space indent and `# ` prefix, is. Longest line 99 columns; ruff check and ruff format --check were confirmed clean on this exact block in a scratch clone at e27d2d2 on 2026-09-04):\n```\n    # scripts.checks._budget_recs -> scripts.ops_data_portal: the rec-FILING side channel every\n    # scaffolded check inherits through scripts.checks._scaffolding, which imports _budget_recs at\n    # module scope. Both portal imports are function-scope, inside _file_budget_breach_rec and\n    # _file_budget_bypass_rec.\n    # Measured effect of this row at e27d2d2 on 2026-09-04: the advisory backlog goes 279 -> 150\n    # findings, entirely in the three checks that reach _budget_recs, with the count of checks\n    # carrying findings unmoved at 39 of 47.\n    # REMOVE this row if a check's verdict is shown to depend on portal code, if _budget_recs\n    # acquires a MODULE-SCOPE scripts.ops_data_portal import, if a check reaching _budget_recs is\n    # shown to EXAMINE portal behaviour, and in any case at the wave-4c flip.\n    # CEILING: this is the THIRD of the operator's four allowed rows; a fourth exhausts the cap and\n    # a fifth would be a cap raise, not an addition.\n```\n\nCLAUSE -> STEP MAP, which is the whole licence for each clause being present. (1) The EDGE (scripts.checks._budget_recs -> scripts.ops_data_portal): VP step 4's exact-content pin (roster[_BUDGET_RECS] == (\"scripts.ops_data_portal\",)) and VP step 8's pre-existing liveness pin both fail if it is wrong. (2) INHERITED THROUGH scripts.checks._scaffolding, WHICH IMPORTS _budget_recs AT MODULE SCOPE: VP step 9's inherited_via_scaffolding= half fails, and it asserts THREE things, one per sub-clause of that phrase -- the _scaffolding -> _budget_recs edge exists; deleting the _scaffolding node makes _budget_recs unreachable from every gated check that reaches it today; and an AST pass over scripts/checks/_scaffolding.py finds a MODULE-SCOPE import of scripts.checks._budget_recs, reported separately as scaffolding_import_is_module_scope= so the three are distinguishable on failure. The third assertion is NOT redundant with the first two, and the plan does not argue that from taste: the import subgraph is scope-BLIND, so has_edge and the node-deletion reachability test both stay True if that import is ever moved into a function body. The in-repo proof is the already-merged scripts.checks._common -> scripts.roadmap.plan_document row, whose only import is FUNCTION-scope inside _common.load_plan and whose edge is nonetheless live in the same view. Negatively controlled in a scratch clone at e27d2d2 on 2026-09-04: rewriting scripts/checks/_scaffolding.py so the filing helpers are imported inside a function leaves has_edge True and leaves moved= and both censuses unchanged, and ONLY scaffolding_import_is_module_scope= flips to False, taking inherited_via_scaffolding= with it and exiting 1. Without that half the clause would be a claim no step could falsify, which constraint 14 forbids. (3) BOTH PORTAL IMPORTS ARE FUNCTION-SCOPE, INSIDE _file_budget_breach_rec AND _file_budget_bypass_rec (which is what \"rec-FILING side channel\" means, reduced to the two function names): VP step 9's portal_imports_are_rec_filing_only= half fails -- an AST pass over scripts/checks/_budget_recs.py asserting no module-scope portal import, exactly two portal import statements, and both of them inside those two functions. (4) THE MEASURED EFFECT (279 -> 150 with the count of checks carrying findings unmoved at 39 of 47): VP steps 1, 3 and 9 all fail. (5) THE CEILING SENTENCE: VP step 4's count pin (exactly three rows, still at or under the mirror's _CAP of 4) fails.\n\nNO OTHER CLAUSE IS PERMITTED, and the deletions are not stylistic. Earlier drafts of this comment asserted that scripts/validate.py's fast-tier budget-assertion scaffold holds the ONLY module-top importer of the two filing helpers -- FALSE at e27d2d2, where scripts/checks/_scaffolding.py also imports both at module top -- and enumerated which gated checks reach the portal and by which route, a passage that came back mis-measured twice. Those clauses are DELETED rather than corrected: a one-row prune does not need paragraphs of justification in permanent source, it needs one true sentence and a test. CITE SYMBOLS, NEVER LINE NUMBERS: nothing in the repo pins a line number, and a stale one would rot silently on any edit above it while still reading as evidence. The row is deliberately NARROWER than the principle its own reason states, and that is left to this plan rather than to the comment: scripts/checks/_budget_recs.py carries other scaffold-only function-scope imports (src.common.ducklake_reader_client inside _fetch_open_recs, scripts.aws_profile inside _file_budget_breach_rec) and this row prunes exactly ONE target. Measured 2026-09-04 that src/common/ducklake_reader_client.py and scripts/aws_profile.py REMAIN findings on all three affected checks after the prune, deliberately left live for the fail-closed glob-widening units. What stops a later agent from \"applying the principle\" by extending this key's target tuple -- which would prune more WITHOUT spending a row, since the operator's ceiling counts ROWS, not targets -- is the mirror's exact-content pin on the single-element tuple, which constraint 4 forbids relaxing. That pin, not the comment, is what makes the cap unevadable through targets."
- file: tests/checks/deps/test_validate_pre_glob_closure.py
  action: Modify
  purpose: 'All changes are confined to TestPrunedEdgesRoster, the Decision 131 mirror class that already owns the roster. Two class constants are added (_BUDGET_RECS, _PORTAL). Two existing pins are UPDATED in place from two rows to three -- test_the_roster_is_the_two_reviewed_hub_rows becomes test_the_roster_is_the_three_reviewed_hub_rows and additionally asserts roster[_BUDGET_RECS] == ("scripts.ops_data_portal",), and test_row_count_is_exactly_the_reviewed_two_and_within_the_cap becomes ..._three... asserting len == 3 and still <= the cap of 4. That update is a STRENGTHENING, not a weakening: an exact pin is replaced by an exact pin one larger, never by an inequality or a range, and the cap stays 4. Three tests are ADDED: test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure (the row''s effect, asserted on CLOSURES rather than on finding counts so the series'' later glob widenings cannot silently empty it), test_every_row_key_is_reachable_from_a_gated_closure (rec-3553''s named selector, backed by a new _inert_rows static helper), and test_the_inertness_detector_rejects_both_vacuous_row_shapes (the negative control that feeds _inert_rows a bogus roster and never reads the real one, fixtured with TWO named, measured pairs: scripts.build_lambda -> scripts.build_lambda_config for the unreachable-key shape, and scripts.checks._scaffolding -> scripts.checks._common for the reachable-but-inert shape). Each row is judged ALONE against the UNPRUNED closure -- the roster patched to that single row versus the roster patched to empty -- for BOTH shapes, never against the live roster minus the row. Measured 2026-09-04 that the two bases coincide today for all three reviewed rows and for both fixtures, because no row key is a target of any row (key/target overlap is the empty set); the single-row basis is stated because it stays well defined if that disjointness ever breaks.. No import is added and nothing is imported from a sibling test module (Decision 131); the file''s module docstring, every other class, and the existing _dead_rows liveness detector are untouched.'
