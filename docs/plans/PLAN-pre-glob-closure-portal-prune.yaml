- 'The auditor''s printed ADVISORY summary changes by exactly the measured amount and in exactly one direction: on the unmodified tree it reads 39 of 47 glob-gated checks and 279 findings; on the branch tree it reads 39 of 47 and 150 findings. The CHECK count does not move at all (39 -> 39); 129 findings do.'
- 'The per-check effect is confined to three checks and is measured, not asserted: validate_differential_gate_baseline 55 -> 12, validate_verification_registry 55 -> 12, validate_hermeticity_flags 52 -> 9, each losing the SAME 43 closure paths. Every other gated check''s finding count is byte-identical, in particular validate_recommendations_schema stays at 44 and validate_acceptance_literals stays at 10 -- the other two of the five gated checks that hold scripts.ops_data_portal in closure. They are unchanged for DIFFERENT reasons, each measured 2026-09-04 at e27d2d2 rather than assumed alike, and named rather than left implicit. validate_recommendations_schema: the portal IS one of its 44 findings, reached via scripts.executor.jsonl_store -> scripts.ops_data_portal (nx.shortest_path), a route this key does not sit on, and scripts/executor/jsonl_store.py is literally IN its declared pre_globs -- a genuine FUNCTIONAL dependency, where the brief''s fail-closed widening default is the honest answer. validate_acceptance_literals: it holds the portal in closure too (scripts.executor.acceptance_lint -> scripts.executor.jsonl_store -> scripts.ops_data_portal), but scripts/ops_data_portal.py is NOT among its 10 findings at all, because its declared glob is scripts/**, which already covers the whole scripts/ subtree; its entire residual is src/common/** (__init__, ducklake_metrics, ducklake_reader_client, ducklake_reads, ducklake_runtime, ducklake_scd2_schema, ducklake_spike, ducklake_tables, ducklake_version, ducklake_writes), so this row could not have moved its number in either direction. Closure membership and FINDING are distinct here, and conflating them is what an earlier draft of this criterion did when it called both checks alike a functional dependency. The three moved checks are the contrast: they reach the portal only through a scaffold-only side channel. One symptom, three dispositions, and the difference is measurable rather than a matter of taste. This is the containment property that makes the prune safe rather than merely convenient.'
