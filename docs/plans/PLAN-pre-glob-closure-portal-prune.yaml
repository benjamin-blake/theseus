verification_plan:
- step: 1
  phase: pre-deploy
  action: 'BEFORE state on the UNMODIFIED tree, run FIRST in a throwaway clone before any working-tree edit. The auditor must report 39 of 47 glob-gated checks with findings and 279 findings total, with `failed` empty. hermetic false for a stated reason and not for cost (Decision 148): it shells out to git clone and asserts a live-tree census this plan deliberately CHANGES, so replaying it against the implementation-bearing tree would exit 1.'
  command: 'C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && cd "$C" && bin/venv-python -c "import io, contextlib; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as audit; buf=io.StringIO(); failed=[]; ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); audit(failed); ctx.__exit__(None, None, None); lines=[l.strip() for l in buf.getvalue().splitlines() if ''ADVISORY:'' in l or l.strip().startswith(''PASS: all'')]; summary=lines[-1] if lines else ''NONE''; print(''failed='', failed, ''| summary='', summary); raise SystemExit(0 if not failed and ''39 of 47'' in summary and ''(279 finding(s) total)'' in summary else 1)"'
  expected: Exit 0 printing failed= [] and an ADVISORY summary containing "39 of 47 glob-gated --pre check(s)" and "(279 finding(s) total)". Reproduced 2026-09-04 in a scratch clone of main at e27d2d2 (the merged Task 6 PR 1 tree).
  fix_if: A different pair of numbers means the tree moved since planning -- another series PR landed, or a check''s pre_globs changed. STOP and re-derive the before/after pair from the live tree, then amend this plan''s pinned numbers; never adjust the row to hit a number. An empty summary means the auditor loud-skipped (Decision 55) -- read the SKIP line and fix the traversal, not the assertion.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the pre-change census that this plan exists to change, and shells out to git clone. Graduating it would land a registry row that fails permanently the moment the change merges.
- step: 2
  phase: pre-deploy
  action: 'RED -- with ONLY the mirror-test file written (module unedited), the three roster/effect pins must fail and no other test in the class may. Run in a throwaway clone into which the branch''s test file is copied, so the module is the committed, unmodified one. hermetic false: it shells out to git clone and asserts a FAILING pytest run that the finished branch inverts.'
  command: C=$(mktemp -d)/probe; git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv" && cp tests/checks/deps/test_validate_pre_glob_closure.py "$C/tests/checks/deps/" && cd "$C" && ! bin/venv-python -m pytest "tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster" -q -p no:cacheprovider --randomly-seed=12345 > red.log 2>&1; grep -E '^FAILED' red.log; test "$(grep -c '^FAILED' red.log)" = 3 && grep -q '^FAILED .*::test_the_roster_is_the_three_reviewed_hub_rows' red.log && grep -q '^FAILED .*::test_row_count_is_exactly_the_reviewed_three_and_within_the_cap' red.log && grep -q '^FAILED .*::test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure' red.log
  expected: 'Exit 0, printing exactly three FAILED lines and no others, and the step asserts BOTH the count and the three node ids BY NAME: test_the_roster_is_the_three_reviewed_hub_rows, test_row_count_is_exactly_the_reviewed_three_and_within_the_cap and test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure. Reproduced 2026-09-04 in a scratch clone -- three failed, five passed; the reachability pin and its negative control pass in BOTH states by construction and must not appear here. The count alone is not enough and the by-name greps are not optional: measured in that same clone, a misspelled or renamed node id makes pytest exit 4 with ZERO FAILED lines (so the count half already rejects it), but three UNRELATED failures would satisfy a bare count, and this is a step whose whole job is to say which three pins are failing first.'
  fix_if: 'Fewer than three FAILED lines means a pin is not actually failing-first -- most likely the effect test was written against finding counts (which the unmodified roster can coincidentally satisfy) instead of against closures. Zero FAILED lines with a non-zero pytest exit means the selector did not resolve (renamed node id, collection error, import failure): fix the selector, never drop the assertions to obtain exit 0. A count of three that fails a by-name grep means three OTHER tests are red -- read red.log before touching anything. More than three means a pre-existing roster test was weakened or broken; restore it. Never satisfy this step by editing the module first.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts a failing test run against pre-change code and shells out to git clone; it is true only before the change lands, so a registry row would redden permanently after merge.
- step: 3
  phase: pre-deploy
  action: 'AFTER state on the branch tree, pinned exactly: 39 of 47 glob-gated checks with findings and 150 findings total, `failed` still empty. hermetic false for a stated reason (Decision 148): it walks the live repository import graph and asserts a live-tree census.'
  command: 'bin/venv-python -c "import io, contextlib; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as audit; buf=io.StringIO(); failed=[]; ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); audit(failed); ctx.__exit__(None, None, None); lines=[l.strip() for l in buf.getvalue().splitlines() if ''ADVISORY:'' in l or l.strip().startswith(''PASS: all'')]; summary=lines[-1] if lines else ''NONE''; print(''failed='', failed, ''| summary='', summary); raise SystemExit(0 if not failed and ''39 of 47'' in summary and ''(150 finding(s) total)'' in summary else 1)"'
  expected: 'Exit 0 printing failed= [] and an ADVISORY summary containing "39 of 47 glob-gated --pre check(s)" and "(150 finding(s) total)". Reproduced 2026-09-04 in a scratch clone carrying exactly this row. The check-with-findings count deliberately does NOT move: a row that moved it would be closing a check by pruning rather than by declaring, which is the gaming shape the brief forbids.'
  fix_if: 150 with a check count other than 39 means the prune emptied a check''s finding list, which this row must not do -- inspect which check went clean and whether it genuinely no longer under-declares. A number other than 150 with 39 checks means the row''s targets are wrong or the tree moved; re-measure before touching the row.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Its assertion is a live-tree census that the series' own next PRs will legitimately move; a registry row pinning 150 would redden on the very next unit.
- step: 4
