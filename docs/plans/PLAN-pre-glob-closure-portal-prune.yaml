fect and the ceiling, each mapped to a step that fails if it is false (constraint 14), and every other clause is deleted. ROUND 4 -- one clause of the prescribed inline comment, ''which imports _budget_recs at module scope'', had no step that could fail were it false: VP step 9''s graph halves are scope-BLIND, as the merged scripts.checks._common -> scripts.roadmap.plan_document row proves in this same roster (its only import is function-scope inside _common.load_plan, and view.has_edge is still True). Under constraint 14 the choice was delete the clause or back it, and the plan BACKS it: VP step 9 gains an AST pass over scripts/checks/_scaffolding.py printing scaffolding_import_is_module_scope=, negatively controlled by moving that import into a function body (only that field and inherited_via_scaffolding= move; the censuses and has_edge do not). The same round closed a wording overreach the critique recorded as non-blocking in the STRENGTHENING direction as well: criterion 6 claimed VP step 10 asserted the module changes ''by nothing else'' while the step pinned only the docstring and the pre-literal prefix, so step 10 gains a byte-identity pin on the file SUFFIX from the `# Per-check cap on printed paths` marker to EOF plus a uniqueness guard on both markers, making the criterion true rather than narrowing it. No check, assertion, tolerance, budget, test or plan field was weakened in any of these edits; the three edits that changed a pin at all -- VP steps 2, 9 and 10 -- each made it stricter, and round 4 made steps 9 and 10 stricter again.'
