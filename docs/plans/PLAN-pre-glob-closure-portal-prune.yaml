rollback: 'Fully reversible in both directions, and deliberately so -- unlike the shrink-only roster changes elsewhere in this repo, nothing here is a one-way ratchet. Pre-merge the branch is simply dropped. Post-merge a revert PR that removes the _PRUNED_EDGES row and reverts the mirror file together restores the exact prior state: the auditor returns to 279 findings across 39 of 47 checks, no gate changes verdict (the check is ADVISORY on both channels and appends nothing to `failed` in either state), and no baseline, budget or shrink-only roster is implicated. The one ordering constraint is that the two files must move TOGETHER: the mirror tests pin the roster as an exact three-row content and count, so reverting the module alone reddens test_the_roster_is_the_three_reviewed_hub_rows and test_row_count_is_exactly_the_reviewed_three_and_within_the_cap, and reverting the tests alone leaves the row unpinned. The two graduated shards are ADDs and can be deleted without tripping any accounting clause. If a defect is found post-merge, prefer the forward fix (Decision 55): a row that turns out to reach further than reviewed is REMOVED, and the finding it was hiding is then closed the fail-closed way, by widening the affected check''s globs in the series'' next unit. Do not repair such a defect by narrowing the row''s targets to keep a lower number -- the number is not the goal.'
