schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: check-mirror-slice-1
intent: 'Close the four measured behavioural holes in the check-mirror roster: give the two registered checks that have no mirror at all (validate_workflow_agent_safety, validate_verification_harness) a mirror that calls fn(failed) on a synthetic tree, and strengthen the two mirrors whose assertions a verified mutation survives, so a neutered failed.append() in any of the four can no longer pass CI as a silent green.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-mirror-slice-1.yaml
phase: Check-mirror behavioural coverage (defect surface of the Decision 169 mirror roster; measured by the Task 3 mutation sweep). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 3 slice 1; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: tests/checks/ci_guards/test_validate_workflow_agent_safety.py
  action: Create
  purpose: 'Mirror (map_source_to_test target, verified) for scripts/checks/ci_guards/validate_workflow_agent_safety.py, which today has NO mirror -- its only repo-wide test reference is a name literal at tests/checks/registry/test_sequences.py:137. Drives the registered wrapper fn(failed) with scripts.check_workflow_agent_safety.WORKFLOWS_DIR monkeypatched to a tmp_path workflows tree (that module global, not scripts.checks._common.ROOT, is this check''s root knob -- the check imports no _common): a clean tree -> failed == [] plus the PASS line; a masked unguarded `claude -p` step and an unparseable workflow -> failed == ["Workflow agent-safety"] with the violation text on stdout. Plus one live-tree smoke test (no patch) asserting the real .github/workflows still passes.'
- file: tests/checks/verification/test_validate_verification_harness.py
  action: Create
  purpose: 'Mirror (map_source_to_test target, verified) for scripts/checks/verification/validate_verification_harness.py, which today has NO mirror -- only name literals at tests/checks/verification/test__manifest.py:101-102 and tests/checks/registry/test_sequences.py:144. Drives fn(failed) with scripts.verifiers.run_all_verifiers monkeypatched to an async fake, covering BOTH failed.append sites separately by stdout (they append the identical string): the HARD_GATE-fail branch, the except-Exception branch, an ADVISORY-fail discriminator that must stay silent, an all-PASS green, the sys.path inject/remove guard (patching the module''s _common.ROOT to a tmp_path so the injection branch actually runs -- required for the 100% floor, measured), and a live-registry smoke test.'
- file: tests/checks/contracts/test_validate_claude_md_pointer_invariant.py
  action: Modify
  purpose: '21 SLOC today; all four existing tests assert only the pure predicate check_claude_md_pointer_invariant()''s bool, so the registered wrapper''s single emission site (validate_claude_md_pointer_invariant.py:28) is executed by no test at all and neutering it to `pass` SURVIVES the whole suite (re-verified in a scratch clone 2026-09-02). Add class TestPointerInvariantFailureEmission with a _run(root) helper patching ...validate_claude_md_pointer_invariant._common.ROOT and asserting EXACT list equality: ["CLAUDE.md pointer invariant"] for a divergent CLAUDE.md and for an absent one, [] for a clean one. Existing four predicate tests are kept unchanged.'
- file: tests/checks/deps/test_validate_check_manifests.py
  action: Modify
  purpose: 157 SLOC today. The two tests that reach validate_check_manifests.py:112's `except (OSError, yaml.YAMLError)` append assert only `any("check-manifest.yaml" in f)`, a substring the DOWNSTREAM line-126 "did not parse to a YAML mapping" message also carries, so neutering line 112 SURVIVES (re-verified in a scratch clone 2026-09-02). Add class TestContractReadErrorIsReportedDistinctly reusing the file's existing module-level _write_tree/_run/_ENTRY_LITERAL/_VALID_CONTRACT helpers, with a _read_errors() filter that strips the masking message and then asserts the except-branch half is present ("check-manifest.yaml:" colon form plus the underlying exception text). Existing 15 tests kept unchanged.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
- Neutering scripts/checks/contracts/validate_claude_md_pointer_invariant.py:28 (`failed.append(...)` -> `pass`) in a scratch clone makes tests/checks/contracts/test_validate_claude_md_pointer_invariant.py FAIL; on the unmodified branch the same file passes.
- Neutering scripts/checks/deps/validate_check_manifests.py:112 in a scratch clone makes tests/checks/deps/test_validate_check_manifests.py FAIL; on the unmodified branch the same file passes.
- scripts/checks/ci_guards/validate_workflow_agent_safety.py and scripts/checks/verification/validate_verification_harness.py each have a mirror that calls the REGISTERED function fn(failed) on a synthetic tree, with at least one red-path test per distinct failure-emission site and one green path asserting failed == [].
- check_per_file_coverage() reports no error for either newly-mirrored module (both measure 100% through their new mirror; no config/coverage_baseline.yaml entry is added).
- '`git diff --stat origin/main...HEAD -- scripts/checks/` is empty (no check module or manifest Entry is touched), and step 23 shows config/sloc_budgets.yaml, config/coverage_baseline.yaml and config/check_accounting_baseline.yaml unchanged; the landed diff is the four test files, the plan file''s own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards (implement-scope-boundary.yaml graduated_registry_shard).'
- All four test files stay <= 500 SLOC, ruff-clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.
verification_plan:
- step: 1
  phase: pre-deploy
  action: RED baseline (survivor 1) -- prove TODAY that neutering the pointer-invariant wrapper's failed.append survives the existing mirror. Scratch clone only; the working tree is never mutated.
  command: MUT=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/mutate.py; CLONE=$(mktemp -d /tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/clone-red-XXXXXX); tar -C . --exclude=.venv --exclude=.git --exclude=__pycache__ --exclude=.pytest_cache -cf - . | tar -C "$CLONE" -xf - && ln -s "$PWD/.venv" "$CLONE/.venv" && bin/venv-python "$MUT" --clone "$CLONE" --file scripts/checks/contracts/validate_claude_md_pointer_invariant.py --site 'validate_claude_md_pointer_invariant:CLAUDE.md pointer invariant' --mode neuter-append && (cd "$CLONE" && PYTHONPATH="$CLONE" ./.venv/bin/python -m pytest tests/checks/contracts/test_validate_claude_md_pointer_invariant.py -q) && echo "SURVIVED $CLONE"
  expected: mutate.py prints CHANGED then MUTATED (it compares compiled bytecode and refuses to write an inert mutant), the diff at line 28 is `failed.append("CLAUDE.md pointer invariant")` -> `pass`, pytest reports 4 passed, and the step prints SURVIVED with the clone path. Reproduced at planning time on origin/main 4faa43b.
  fix_if: If pytest FAILS here the hole is already closed -- STOP and re-derive rather than writing tests for a survivor that no longer exists. If mutate.py is absent (a different session's scratchpad), re-author it first per execution step 1 -- locate the statement by AST inside the named function, never by bare line number, and assert compile() bytecode differs before recording anything.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the presence of the very gap this plan closes -- it holds only while the mirror is still weak, so graduating it would land a guard that must go red the moment step 19 succeeds. It is also multi-command and clone-scoped, outside every canonical primitive slot.
- step: 2
  phase: pre-deploy
  action: RED baseline (survivor 2) -- same procedure for the check-manifests contract-read except branch.
  command: 'MUT=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/mutate.py; CLONE=$(mktemp -d /tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/clone-red-XXXXXX); tar -C . --exclude=.venv --exclude=.git --exclude=__pycache__ --exclude=.pytest_cache -cf - . | tar -C "$CLONE" -xf - && ln -s "$PWD/.venv" "$CLONE/.venv" && bin/venv-python "$MUT" --clone "$CLONE" --file scripts/checks/deps/validate_check_manifests.py --site ''validate_check_manifests:{contract_path}: {exc}'' --mode neuter-append && (cd "$CLONE" && PYTHONPATH="$CLONE" ./.venv/bin/python -m pytest tests/checks/deps/test_validate_check_manifests.py -q) && echo "SURVIVED $CLONE"'
  expected: CHANGED/MUTATED at line 112, pytest reports 15 passed, step prints SURVIVED. The masking mechanism is what makes it survive - `contract_data = None` on line 113 still runs, so line 126's "... did not parse to a YAML mapping." message keeps `any("check-manifest.yaml" in f)` true. Reproduced at planning time.
  fix_if: A red here means the assertions were already strengthened; STOP and re-derive. An AmbiguousSiteError means the --site substring matched more than one failed.append -- narrow it, never fall back to a line number.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Same as step 1 - it asserts the pre-fix weakness and must stop holding once step 20 passes; multi-command and scratch-clone-scoped, so no canonical slot expresses it.
- step: 3
  phase: pre-deploy
  action: The pointer-invariant WRAPPER appends to failed when root CLAUDE.md diverges (mutant-killing red path).
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_claude_md_pointer_invariant.py::TestPointerInvariantFailureEmission::test_divergent_root_claude_md_appends_a_failure -q
  expected: 1 passed -- with _common.ROOT patched to a tmp_path holding "@AGENTS.md\nstray content\n", failed == ["CLAUDE.md pointer invariant"] exactly.
  fix_if: An empty failed means the patch target is wrong -- _common is imported as a MODULE (validate_claude_md_pointer_invariant.py:7), so the target is "scripts.checks.contracts.validate_claude_md_pointer_invariant._common.ROOT"; the default arg path="CLAUDE.md" is relative and is resolved against it.
  hermetic: false
  graduation: graduate
  graduation_check_id: pointer-invariant-wrapper-appends-on-divergence
- step: 4
  phase: pre-deploy
  action: The pointer-invariant wrapper appends when root CLAUDE.md is absent (the helper's OSError -> False path).
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_claude_md_pointer_invariant.py::TestPointerInvariantFailureEmission::test_missing_root_claude_md_appends_a_failure -q
  expected: 1 passed -- no CLAUDE.md written into tmp_path, failed == ["CLAUDE.md pointer invariant"].
  fix_if: If this passes but step 3 fails (or vice versa) only one arm of the branch is wired; both must assert exact list equality, not truthiness.
  hermetic: false
  graduation: graduate
  graduation_check_id: pointer-invariant-wrapper-appends-on-missing-file
- step: 5
  phase: pre-deploy
  action: Anti-vacuity green -- a clean root CLAUDE.md appends nothing (green companion of the graduated red paths at the same site).
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_claude_md_pointer_invariant.py::TestPointerInvariantFailureEmission::test_clean_root_claude_md_appends_nothing -q
  expected: 1 passed -- failed == [] for "@AGENTS.md\n".
  fix_if: A non-empty failed means the fixture wrote the wrong bytes (a trailing space or CRLF); the predicate compares content == "@AGENTS.md\n" exactly.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Anti-vacuity GREEN companion to the graduated red paths at the same emission site (steps 3-4, validate_claude_md_pointer_invariant.py:28); a shard here would duplicate a registry identity that the red-path rows already carry -- the differential admits a row for its discrimination, and the green half of the same site discriminates nothing on its own.
- step: 6
