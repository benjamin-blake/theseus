  action: The check-manifests contract-READ error is reported distinctly from the downstream not-a-mapping message (missing file case; mutant-killing red path).
  command: bin/venv-python -m pytest tests/checks/deps/test_validate_check_manifests.py::TestContractReadErrorIsReportedDistinctly::test_missing_contract_file_reports_the_read_error_distinctly -q
  expected: 1 passed -- after filtering out only messages ending with the exact suffix " did not parse to a YAML mapping.", at least one failure remains and it carries both "check-manifest.yaml:" (the colon form only the except branch emits) and "No such file or directory".
  fix_if: An empty read_errors list means the assertion is still satisfiable by the masking message -- the filter must run BEFORE the substring assertion, not alongside it.
  hermetic: false
  graduation: graduate
  graduation_check_id: check-manifest-contract-read-error-distinct
- step: 7
  phase: pre-deploy
  action: Same, for the invalid-YAML case (yaml.YAMLError arm of the same except).
  command: bin/venv-python -m pytest tests/checks/deps/test_validate_check_manifests.py::TestContractReadErrorIsReportedDistinctly::test_invalid_yaml_contract_reports_the_parse_error_distinctly -q
  expected: 1 passed -- the surviving non-masking failure carries "check-manifest.yaml:" and "flow sequence" (PyYAML's parser mark text for the unclosed flow sequence in the invalid contract fixture).
  fix_if: If a future PyYAML bump changes that wording, keep the _read_errors() non-emptiness assertion (which alone kills the mutant) and loosen only the second clause -- never delete the filter.
  hermetic: false
  graduation: graduate
  graduation_check_id: check-manifest-contract-yaml-error-distinct
