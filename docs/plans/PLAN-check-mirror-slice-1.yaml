  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::test_repo_root_is_injected_and_removed_when_absent_from_sys_path -q
  expected: 1 passed -- with the module's _common.ROOT patched to a tmp_path, failed == [] and sys.path equals its pre-call value.
