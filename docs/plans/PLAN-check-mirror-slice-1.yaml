  phase: pre-deploy
  action: Live-registry smoke -- the real (empty) verifier REGISTRY still passes through the wrapper.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::test_live_registry_passes -q
  expected: 1 passed -- unpatched call, failed == [].
  fix_if: A red here means a real verifier was added and is failing; that is a finding about the verifier, not the mirror.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.verifiers.REGISTRY is empty today, so this asserts a near-tautology whose only value is early-warning when a verifier is added; the full tier already dispatches this check (full_after_ensure_fresh_dq) on every merge.
- step: 18
  phase: pre-deploy
  action: All four mirrors green together, plus the two mirrors' own registration tests, with no cross-test sys.path or WORKFLOWS_DIR leakage.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_claude_md_pointer_invariant.py tests/checks/deps/test_validate_check_manifests.py tests/checks/ci_guards/test_validate_workflow_agent_safety.py tests/checks/verification/test_validate_verification_harness.py tests/checks/ci_guards/test__manifest.py tests/checks/verification/test__manifest.py tests/checks/registry -q
  expected: All pass (7 + 18 + 4 + 6 in the four mirrors, plus the manifest/registry suites unchanged).
  fix_if: An order-dependent failure means a test mutated global state without monkeypatch (use pytest's monkeypatch or unittest.mock.patch as a context manager everywhere; never assign module globals directly).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file and whole-directory selectors are exactly what CI's own pytest step already runs on every PR and merge; a registry shard here would re-run the standing gate rather than add a guard.
