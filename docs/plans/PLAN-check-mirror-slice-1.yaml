  graduation_waiver_reason: It reaches the SAME single emission site in the module under test that step 9 already graduates; the distinct upstream branch it exercises (the helper's YAML-parse violation) is already guarded on every merge by tests/test_check_workflow_agent_safety.py::test_bad_yaml_reports_parse_error.
