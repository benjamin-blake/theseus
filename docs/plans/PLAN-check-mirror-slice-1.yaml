  action: New mirror, green path -- a clean workflows tree leaves failed empty and prints the PASS line.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_workflow_agent_safety.py::TestWorkflowAgentSafetyEmission::test_clean_workflows_append_nothing -q
  expected: 1 passed -- failed == [] and "All headless claude -p steps assert their output." on stdout.
  fix_if: A failure means WORKFLOWS_DIR was not monkeypatched on the HELPER module (scripts.check_workflow_agent_safety), which is where that global lives; the check module itself imports it lazily inside the function.
