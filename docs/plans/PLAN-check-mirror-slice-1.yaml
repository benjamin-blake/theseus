  graduation: waive
  graduation_waiver_reason: Its purpose is coverage-floor closure for the sys.path branch (92.9% -> 100%, measured), and the standing guard for that is step 22's coverage assertion plus CI's own validate_test_coverage -- a separate registry shard would gate the same fact twice.
