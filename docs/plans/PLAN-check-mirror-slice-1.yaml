- step: 12
  phase: pre-deploy
  action: Verification-harness red path A -- a HARD_GATE FAIL result drives the post-loop failed.append.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::TestVerificationHarnessEmission::test_hard_gate_failure_appends_a_failure -q
  expected: '1 passed -- failed == ["Verification Harness"], stdout carries a "[FAIL]" result line and does NOT contain "Verification harness failed to run" (which is how this site is told apart from the except-branch site: both append the identical string).'
  fix_if: If the fake is not intercepted, patch scripts.verifiers.run_all_verifiers (the check does `from scripts.verifiers import ... run_all_verifiers` at CALL time inside its try block) with an async function; asyncio.run needs a coroutine, not a plain lambda.
  hermetic: false
  graduation: graduate
  graduation_check_id: verification-harness-appends-on-hard-gate-failure
- step: 13
  phase: pre-deploy
  action: Verification-harness red path B -- an exception from the harness drives the except-branch failed.append.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::TestVerificationHarnessEmission::test_harness_exception_appends_a_failure -q
  expected: 1 passed -- failed == ["Verification Harness"] and stdout carries the except-branch marker "[ERROR] Verification harness failed to run" followed by the raised message.
  fix_if: Assert the stdout marker, not just failed -- without it this test is indistinguishable from step 12 and a neutered except-append would be masked by the other site.
  hermetic: false
  graduation: graduate
  graduation_check_id: verification-harness-appends-on-run-exception
- step: 14
  phase: pre-deploy
  action: Verification-harness severity discriminator -- an ADVISORY FAIL must NOT fail the tier.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::TestVerificationHarnessEmission::test_advisory_failure_appends_nothing -q
  expected: 1 passed -- failed == [] for a FAIL result whose severity rank is below HARD_GATE.
  fix_if: A non-empty failed means the severity comparison was dropped or inverted; this test plus step 12 pin `res.severity.rank >= VerifierSeverity.HARD_GATE.rank` from both sides.
  hermetic: false
  graduation: graduate
  graduation_check_id: verification-harness-silent-on-advisory-failure
- step: 15
  phase: pre-deploy
  action: Verification-harness green path -- all-PASS results append nothing.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_harness.py::TestVerificationHarnessEmission::test_all_pass_appends_nothing -q
  expected: 1 passed -- failed == [] and a "[PASS]" result line on stdout.
  fix_if: A non-empty failed means the fake returned FAIL status; VerifierResult defaults severity to HARD_GATE, so the status is what must be PASS here.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Anti-vacuity GREEN companion to the graduated red paths at the same emission sites (steps 12-14, validate_verification_harness.py:38 and :41); the red-path rows carry the registry identity for those sites and a green-only row would duplicate it. It is also the empty-domain shape Decision 170 warns about (REGISTRY is [] today), which the mirror names explicitly.
