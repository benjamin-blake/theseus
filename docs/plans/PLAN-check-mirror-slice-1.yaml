  graduation: waive
  graduation_waiver_reason: Anti-vacuity GREEN companion to the graduated red path at the same emission site (step 9, validate_workflow_agent_safety.py:24); graduating it would register a second identity for one site whose red-path row is the standing guard, so it is waived as a duplicate identity, not as unnecessary.
- step: 9
  phase: pre-deploy
  action: New mirror, red path -- a masked unguarded `claude -p` step drives the wrapper's only failed.append.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_workflow_agent_safety.py::TestWorkflowAgentSafetyEmission::test_masked_unguarded_step_appends_a_failure -q
  expected: 1 passed -- failed == ["Workflow agent-safety"] exactly, and stdout carries "Workflow agent-safety violations:" plus the offending step name.
  fix_if: An empty failed means the synthetic workflow does not actually violate the rule -- it needs a raw `claude -p` invocation, a `|| true` (or continue-on-error) mask, and NO grep/test guard paired with `exit 1` / `::error::`.
  hermetic: false
  graduation: graduate
  graduation_check_id: workflow-agent-safety-wrapper-appends-on-violation
- step: 10
  phase: pre-deploy
  action: New mirror, second red fixture -- an unparseable workflow also reaches the wrapper's append.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_workflow_agent_safety.py::TestWorkflowAgentSafetyEmission::test_unparseable_workflow_appends_a_failure -q
  expected: 1 passed -- failed == ["Workflow agent-safety"] and "YAML parse error" on stdout.
  fix_if: If failed is empty the fixture parsed cleanly; a one-line workflow whose `jobs:` value opens an unclosed flow sequence is the shape that raises yaml.YAMLError.
