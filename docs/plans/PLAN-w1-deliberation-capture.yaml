  - "fork: one item vs split verb/monitor | chosen: one task item | class: consistency-only | precedent: CD.45 item-count cap 12 across about ten components; Decision 197 cl.3 grain; components 1-3 precedent | precedent_kind: contract | reversible: yes | persisted: fixture"
