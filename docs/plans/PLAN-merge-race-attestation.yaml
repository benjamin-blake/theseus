  moving after the pr-validate merge ref (CI-green -> merge window)" (residual_owner rec-4451), "bot-authored and
  Decision 203 exempt-only PRs" (rec-4452), "tests that skip at run time on an excluded dependency, invisible to the
  deferral map" (rec-4453), "a result=fail attestation" (rec-4087) and "an agent-written attestation CI cannot
  independently verify" (rec-4085).
- >-
  SKILL.md, implement.md and the antidrift test as scoped; the antidrift test asserts `--verify-head --stamp` on the
  Commit Flow line and keeps the commit < rebase < full tier < verify-head < push order. TestContract also carries
  the tripwire: validate.py's --pre block still builds its derivation input from get_status_aware_diff() and
