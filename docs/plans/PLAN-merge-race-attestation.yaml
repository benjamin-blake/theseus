execution_steps:
- >-
  validation_result.py: add ATTESTATION_TRAILER = "Full-Tier-Attestation"; a frozen Attestation(tree, result,
  heavy_deps: tuple[str, ...]); format_attestation() -> "tree=<sha> result=<pass|fail> heavy_deps=<a,b|none>";
  parse_attestation(value) with a strict full-match regex (tree 40-64 lowercase hex, result pass|fail, heavy_deps
  none or comma-joined [A-Za-z0-9_.-]+), None otherwise; read_attestation(rev, *, cwd) from `git log -1
  --format=%(trailers:key=Full-Tier-Attestation,valueonly,separator=%x0A) <rev>`, last non-empty value wins, None on
  any git error or parse failure.
- >-
  validation_result.py: stamp_head(rule) -> str, called only with verify_head()'s rule. ok -> result pass,
  failed_run -> result fail, any other rule -> return "not_stamped" with no amend. heavy_deps = sorted importable
  names from scripts.checks._pytest_diff._excluded_heavy_import_names() (lazy import inside the function; find_spec
  is not None, the inverse of the predicate that defers them). Target already on HEAD -> "already_stamped". Else pipe
  `git log -1 --format=%B HEAD` through `git interpret-trailers --if-exists replace --trailer
  "Full-Tier-Attestation: <value>"` into `git commit --amend --allow-empty -F -` (cwd _common.ROOT, the user's signing
  config untouched, no --no-verify), then require HEAD^{tree} unchanged -> "stamped" else "tree_changed". main():
  --stamp is valid only with --verify-head (parser.error otherwise); print verify-head's rule, then the stamp's;
  return --verify-head's exit code unchanged.
- >-
  validate_deferred_test_attestation.py: a pure evaluate(*, root=None, environ=None, affected_by=None) ->
  Verdict(rule, deferred, detail, warning), plus the @registry.register wrapper that prints the "=== Deferred-test
  attestation ===" header, the verdict and, on failure, the remediation ("rebase onto origin/main, run the full tier,
  `--verify-head --stamp`, push --force-with-lease"), and declares registry.skipped / examined / failure_detail; a
  failing rule appends the constant label "Deferred-test attestation". DEFERRAL_ATTEST_RULES in evaluation order:
  not_pull_request, bot_authored, exempt_only (skips); unresolvable_head, not_merge_ref (fails); nothing_deferred (vacuous pass);
  missing_attestation, stale_attestation, dependency_not_attested (fails); attested_tree (pass);
  base_moved_unknown_deferrals, base_moved_affects_deferred (fails); base_moved_unaffected (pass).
- >-
  Evaluation detail (every git call with cwd=root): GITHUB_EVENT_NAME must be pull_request. Payload from
  GITHUB_EVENT_PATH: pull_request.user.type == "Bot" -> bot_authored; pull_request.head.sha unreadable ->
  unresolvable_head; `git rev-parse HEAD^2` must equal it, else not_merge_ref. PR entries = validate.py's own --pre
  construction: _common.get_status_aware_diff(root) plus get_changed_files(root) as status "M". Every entry path
  exempt under scripts.session.handoff_evidence's base-ref clause (_base_ref_clause / _is_exempt, imported lazily;
  an unreadable clause exempts nothing) -> exempt_only. D = the deferral map's `deferred` mapping (file -> missing
  dep; missing, unparseable or not a mapping -> unknown) plus the cap residue: the manifest["deferred"] list the
  stdout-suppressed derive_affected_tests(pr_entries, repo_root=root) returns (its fallback -> unknown). D empty and known -> nothing_deferred. Then the trailer rules in order, recording
  result=fail as the verdict's warning. Merge tree = HEAD^{tree}; equal to the attested tree -> attested_tree. Else
  unknown D -> base_moved_unknown_deferrals. Else entries from `git diff --name-status --no-renames <attested>
  <merge>` go to affected_by (default _affected_by: stdout-suppressed derive_affected_tests(entries,
  repo_root=root), selected plus its manifest's deferred, fallback counting as reaching all of D); overlap ->
  base_moved_affects_deferred with the overlap and `git log --oneline -10 <head>..HEAD^1` in detail; else
  base_moved_unaffected.
- >-
  _manifest.py: the Entry with a comment naming its placement reasons. config/ci_rca_taxonomy.yaml: the row.
  postflight.py: run_verify_head's argv gains "--stamp"; update its docstring and run_auto's sequence line.
- >-
  git-ops.yaml: compact the amendment_log entries to single-line flow mappings first (text unchanged), then the edits
  named in its scope row. The deferral_attestation clause lists DEFERRAL_ATTEST_RULES verbatim. enforcement_coverage
  rows: {surface: "pr-validate run whose tier deferred a test", status: mechanical, enforced_by:
  "tests/checks/verification/test_validate_deferred_test_attestation.py::TestMergeRace"}; residual rows for "main
  moving after the pr-validate merge ref (CI-green -> merge window)" (residual_owner rec-4451), "bot-authored and
  Decision 203 exempt-only PRs" (rec-4452), "a result=fail attestation" (rec-4087) and "an agent-written
  attestation CI cannot independently verify" (rec-4085).
- >-
  SKILL.md and the antidrift test as scoped; the antidrift test asserts `--verify-head --stamp` on the Commit Flow
  line and keeps the commit < rebase < full tier < verify-head < push order.
- >-
  Tests: temporary repos (commit.gpgsign=false in the repo config) with a base, an attested head carrying the trailer,
  a main-moved commit, refs/remotes/origin/main at the base, and a `git merge --no-ff` merge commit checked out as
  HEAD; the deferral map under
  <root>/logs/debug; environ and the payload file injected; affected_by injected, except one test that exercises
  _affected_by against this repository's own tree (an edited test file selects itself).
- Execute Verification Plan steps 1-9 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure sequence (implement skill), each outcome reported on its own: code-review gate; github_readiness;
  implementation_declared true; rebase; retrospective evidence; VP step 9 (full tier, then --verify-head --stamp);
  push; PR; CI by subscription; squash merge; VP step 10.
- 'Report: what was implemented and the verification results.'
