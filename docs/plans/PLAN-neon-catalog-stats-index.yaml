  Move _emit_maintenance_metric and DATA_PATH to _shared.py (re-bound in handler.py), then action_control_health and
  action_catalog_stats verbatim into health_actions.py, route _ACTIONS to them, and re-point
  test_control_health_action.py and test_operational_actions.py; run tests/lambdas/ducklake_maintenance and confirm
  green before any behaviour change.
- >-
  Write the red tests named in test_obligations, then add ducklake_catalog_index_status.py, the SQL file,
  index_actions.py, the control_health report, catalog_stats' stats_index, catalog_reinit's ensure step, log_invocation
  and the reader/writer calls, both manifest entries and the contract entries. Metrics carry the MetaSchema dimension.
- Change history_retention_seconds and its comment; add the Terraform value test.
- >-
  Add Decision N. Pinned content (tighten for the byte cap, never drop a clause). TITLE: "The DuckLake catalog stays on
  Neon, tuned now and capped next, with measured triggers to move (amends Decision 107 and Decision 88)". ENVELOPE:
  significance value numbered_decision; justification "Resets Decision 107's swap-back triggers and adds a standing
  invariant to Decision 88, with reversal conditions -- a commitment no contract note or amendment_forms annotation can
  carry; ducklake_maintenance.yaml carries the verb's field semantics." PROBLEM: the operator proposed a pre-emptive
  move to RDS (cost ~$10/month and rising with agents, cold starts, egress); an independent review found the measured
  pain has cheaper causes: Lambda p95 26-55 s and commit p95 5.5 s against a 2,000 ms budget, with DuckLake's fix for
  the per-query stats scan (#859, PR #1147) inert because its index was never created; Terraform pins 6 h PITR while
  Decisions 88 and 107 assume 7 days. DECISION: (1) RDS is deferred, not rejected; its reviewed design is kept on
  rec-4223, and a move stays a metadata dump, restore and secret flip because the runtime uses only plain Postgres. (2)
  The stats index is created and kept by the operator-only ensure_catalog_indexes verb on every catalog schema;
  Decision 88 gains invariant (v): the stats index is present and valid on every catalog schema, reported by
  control_health every 6 hours (StatsIndexValid), with its alarm owned by rec-4220. (3) Neon history is 7 days (ruling
  on 107 cond. 2's RPO question); the compute moves into Terraform with a pinned maximum under rec-4220, so the bill
  cannot rise with agent count. (4) Per-invocation wall time is the latency signal (Decision 82's pinned term); commit
  latency and cold attach are attribution. (5) A file catalog (DuckDB file on S3 under conditional-write CAS) is adopted
  only when peak commit rate x swap time < 0.1, swap time < 1 s, maintenance commits reliably under CAS, a version-copy
  restore drill passes, and only after telemetry 2c. RATIONALE: fix the measured cause before paying for a backend
  change. REVERSAL CONDITIONS (review_by 2027-04-30, on_trigger "re-decide via /plan", each kind manual):
  capped-bill-exceeds-rds (Neon above ~$20/month for two billing cycles once rec-4220's cap is in place);
  wall-p95-over-budget-after-tuning (per-invocation p95 > 2,000 ms, or cold attach p95 over budget, for two consecutive
  windows after index and compute tuning); neon-tier-or-terms-change; private-network-required;
  file-catalog-conditions-met. RELATED: 107, 88, 82, 81 cl.6, 84, 143, 191, 200, 204, 212; rec-4170, rec-4220,
  rec-4221, rec-4223. ANNOTATIONS (dated the implementation day): Decision 107 -- "[Amendment <date>, Decision N: a
