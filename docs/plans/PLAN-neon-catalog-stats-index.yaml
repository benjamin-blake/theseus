- >-
  Add Decision N. Pinned content (tighten for the byte cap, never drop a clause). TITLE: "The DuckLake catalog stays on
  Neon, tuned and capped, with measured triggers to move (amends Decision 107 and Decision 88)". PROBLEM: the operator
  proposed a pre-emptive move to RDS (cost ~$10/month and rising with agents, cold starts, egress); an independent
  review found the measured pain has cheaper causes: Lambda p95 26-55 s and commit p95 5.5 s against a 2,000 ms
  budget, with DuckLake's fix for the per-query stats scan (#859, PR #1147) inert because its index was never created;
  Terraform pins 6 h PITR while Decisions 88 and 107 assume 7 days. DECISION: (1) RDS is deferred, not rejected; its
  pre-work design is on file (rds-swap) and a move stays a metadata dump, restore and secret flip because the runtime
  uses only plain Postgres. (2) The stats index is created and kept by the operator-only ensure_catalog_indexes verb on
  every catalog schema; Decision 88 gains invariant (v): the stats index is present and valid on every catalog schema,
  asserted by control_health. (3) Neon history is 7 days (ruling on 107 cond. 2's RPO question); compute settings move
  into Terraform with a pinned maximum in the follow-on plan, so the bill cannot rise with agent count. (4)
  Per-invocation wall time is the latency signal (Decision 82's pinned term); commit latency and cold attach are
  attribution. (5) A file catalog (DuckDB file on S3 under conditional-write CAS) is adopted only when peak commit
  rate x swap time < 0.1, swap time < 1 s, maintenance commits reliably under CAS, a version-copy restore drill passes,
  and only after telemetry 2c. RATIONALE: fix the measured cause before paying for a backend change. REVERSAL
  CONDITIONS (review_by 2027-04-30, on_trigger "re-decide via /plan", each kind manual): capped-bill-exceeds-rds (Neon
  above ~$20/month for two billing cycles); wall-p95-over-budget-after-tuning (per-invocation p95 > 2,000 ms, or cold
  attach p95 over budget, for two consecutive windows after index and compute tuning); neon-tier-or-terms-change;
  private-network-required; file-catalog-conditions-met. RELATED: 107, 88, 82, 81 cl.6, 84, 143, 191, 200, 204, 212;
