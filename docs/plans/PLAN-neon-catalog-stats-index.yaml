schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: neon-catalog-stats-index
intent: >-
  Keep the DuckLake catalog -- the metadata store under every warehouse read and write the platform's agents make --
  on Neon and make it fast and recoverable before re-deciding a move: engage DuckLake's upstream fix for the
  per-query full scan of ducklake_file_column_stats (issue #859, PR #1147) by creating the (table_id, column_id) index
  it needs through an operator-only maintenance verb, add the per-invocation telemetry that attributes today's 26-55 s
  Lambda tails, raise Neon point-in-time history to the 7 days Decisions 88 and 107 already assume, and record the
  deferred RDS move with its re-open triggers in a numbered Decision.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V3
plan_path: docs/plans/PLAN-neon-catalog-stats-index.yaml
phase: >-
  No tier_item: an operator-directed catalog tuning (soft-warn category user_explicit_out_of_scope). Relates to T2.19
  (c11 latency headroom evidence) and rec-4170 (writer commit latency above the 2,000 ms budget), which it measures
  but does not close. The compute cap and the index alarm are follow-on rec-4220; the deferred RDS design lives on
  rec-4223.
scope:
- file: src/lambdas/ducklake_maintenance/catalog_stats_index.sql
  action: Create
  purpose: >-
    The index DDL of record, beside the verb that applies it (an edit triggers the governed deploy and the drift
    sensor; the precedent is Decision 213's ducklake_telemetry_writer_role.sql). Header in the
    migrations/ducklake_ops_schema.sql style: what, why (issue #859 / PR #1147: DuckLake pushes the stats filter
    through postgres_query() only when an index on (table_id, column_id) exists; "the index must currently be manually
    created by the user"), and how it is applied (ensure_catalog_indexes, owner login, autocommit, a bounded
    statement_timeout, never inside a transaction). Body: exactly one statement with a {meta_schema} placeholder:
    CREATE INDEX CONCURRENTLY ducklake_file_column_stats_table_id_column_id_idx ON
    {meta_schema}.ducklake_file_column_stats (table_id, column_id); -- no IF NOT EXISTS (a failed concurrent build
    leaves an INVALID index that IF NOT EXISTS would accept).
- file: src/common/ducklake_catalog_index_status.py
  action: Create
  purpose: >-
    Read-only, the single source the verb, control_health and catalog_stats all read (no duplicated SQL):
    catalog_index_schemas(cur) -> the schemas holding a ducklake_file_column_stats table, from pg_catalog (Decision
    191's enumeration principle, never a hard-coded pair); catalog_index_status(cur, meta_schema) -> {present, valid,
    index_name, idx_scan, size_bytes, table_seq_scan, stats_reset}. present/valid hold for the fixed index name OR any
    equivalent index whose key columns are exactly (table_id, column_id) or (column_id, table_id), so a future
    DuckLake-created index is recognised and never duplicated; counters come from pg_stat_user_indexes and
    pg_stat_user_tables, stats_reset from pg_stat_database. Stdlib only (the caller passes the cursor). A new module
    rather than ducklake_maintenance.py growth because that file is at 446 of 500 SLOC (Decision 128); it ships in both
    the maintenance and maintenance-smoke bundles because catalog_stats imports it.
- file: src/lambdas/ducklake_maintenance/index_actions.py
  action: Create
  purpose: >-
    action_ensure_catalog_indexes(event, _con): a closed, operator-only verb (Decision 81 cl.6: no agent invocation;
    invoked over 443 or by a Lambda console test event like the other operational verbs) with no caller-supplied SQL,
    schema or index name. Refuses (rt.DuckLakeRuntimeError, the catalog_reinit refusal shape) unless confirm ==
    "ducklake_file_column_stats". As the ducklake_ops owner login (rt.fetch_dsn(), psycopg2 over rt.libpq_conninfo,
    autocommit = True, SET statement_timeout = '300s' -- well under the 900 s function timeout, so a build blocked by a
    long transaction ends as an INVALID index the next run rebuilds, not a Lambda timeout) it enumerates schemas through
    catalog_index_schemas and for each reads catalog_index_status: valid (fixed name or equivalent) -> no-op; invalid
    fixed-name index -> DROP INDEX CONCURRENTLY then build; absent -> build (the SQL file text formatted with the
    _require_identifier-validated schema); then re-reads and requires valid. Returns only ok, migration_sha256 (of the
    SQL file bytes) and schemas {name: {existed, valid_before, created, rebuilt, valid_after}}. Every psycopg2.Error is
    re-raised as rt.DuckLakeRuntimeError carrying only the exception class and SQLSTATE, never its message (a connect
    error names the host). Also exports ensure_index_for(meta_schema) for catalog_reinit. Maintenance bundle ONLY
    (Decision 204's mutate-half precedent). Under 200 SLOC.
- file: src/lambdas/ducklake_maintenance/health_actions.py
  action: Create
  purpose: >-
    Decomposition (Decision 128; the handler is at 497 of 500 SLOC): action_control_health and action_catalog_stats
    move here unchanged in behaviour, importing _emit_maintenance_metric and DATA_PATH from _shared.py (health_actions
    may never import handler.py -- the handler imports it for dispatch, the _shared.py import-cycle rule).
    control_health additionally opens one read-only psycopg2 session, reads catalog_index_status for every enumerated
    schema and emits, per schema (dimension MetaSchema), StatsIndexValid (0/1), FileColumnStatsIdxScan and
    FileColumnStatsSeqScan (cumulative counters) to DuckLakeMaintenance, plus a stats_index result key. The index check
    is REPORTED, never raised: a raise would trip the existing breaker alarm during the planned pre-index baseline; the
    StatsIndexValid alarm is rec-4220's, landed after the index exists. A status-read failure is reported in the result
    and as StatsIndexValid 0, never raised.
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: >-
    _emit_maintenance_metric and DATA_PATH move here from handler.py (the same cycle-breaking move Decision 204 made for
    EXTENSION_DIRECTORY); handler.py re-binds both names, so its remaining actions and tests are unaffected.
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: >-
    _ACTIONS registers "ensure_catalog_indexes" -> index_actions.action_ensure_catalog_indexes and points
    "control_health" / "catalog_stats" at health_actions; the moved bodies, _emit_maintenance_metric and DATA_PATH
    definitions are replaced by re-bindings from _shared; catalog_reinit calls index_actions.ensure_index_for(meta_schema)
    after its SELECT 1 proof and returns the result under "stats_index"; the module docstring's operational-verb list
    names the new verb as operator-only. Net SLOC falls.
- file: src/lambdas/ducklake_maintenance/manifest.yaml
  action: Modify
  purpose: >-
    includes gains index_actions.py, health_actions.py and src/common/ducklake_catalog_index_status.py; assets gains
    catalog_stats_index.sql; notes name the new operator-only verb.
- file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
  action: Modify
  purpose: >-
    includes gains src/common/ducklake_catalog_index_status.py (the smoke bundle ships ducklake_maintenance.py, whose
    catalog_stats now imports it). Nothing else changes; the smoke dispatch is untouched (Decision 143).
- file: src/common/ducklake_maintenance.py
  action: Modify
  purpose: >-
    catalog_stats adds "stats_index": ducklake_catalog_index_status.catalog_index_status(cur, meta_schema), read in its
    existing cursor. A few lines; read-only, inside Decision 88 cl.2's catalog_stats charter.
- file: src/common/ducklake_metrics.py
  action: Modify
  purpose: >-
    log_invocation(function, action, status, connect_ms, connect_reused, reopened, elapsed_ms): prints one compact
    JSON line {"event": "ducklake_invocation", ...those fields}, so the fields are filterable with a CloudWatch Logs
    JSON filter pattern (PlatformDev holds logs:FilterLogEvents, not logs:StartQuery). Fixed fields only: never a
    payload value, table row, host or error message.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    handler() measures elapsed time, records reopened (the dead-connection reopen branch) and calls log_invocation in a
    finally, so every path (200, 4xx, 5xx, connectionless) logs exactly one line; connect_ms and connect_reused come
    from the existing conn_meta (None on connectionless actions); action is logged only when it is a registered
    _ACTIONS key, otherwise the fixed token "unknown" (the 400 path's action is caller-supplied).
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: Same as the reader, one ducklake_invocation line per invocation on every path, registered action names only.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    history_retention_seconds 21600 -> 604800 (7 days, the paid Launch plan maximum), with its comment corrected (the
    6 h figure was the free-tier ceiling; Decisions 88 cl.3 and 107 rely on 7-day PITR between weekly dumps); the
    header's free-tier wording may be corrected in the same edit (comments only). A neon_* in-place update, so the guard
    routes the apply to tf-gated-apply (the operator approves). No other attribute changes.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: >-
    Class B verb entry ensure_catalog_indexes (operational, operator-only per Decision 81 cl.6, confirm, idempotent,
    non-destructive to data, enumerates schemas, returns booleans and the migration hash only), which also names the
    control_health metrics it is checked by (control_health has no verb entry today, and this plan does not add one);
    the catalog_stats entry's 200 body names stats_index; the governance callers line names the new verb; an
    amendment_log entry. The file is at 475 of 500 effective lines (contracts class, config/structural_size_budgets.yaml):
    keep the additions terse and, if needed, compact the oldest amendment_log entries (the class's relief valve);
    never raise the budget.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    NEW numbered Decision N (origin/main max + 1 at implementation time; 214 expected -- 213 is on main), amends
    [107, 88], <= 6,144 bytes, content pinned in execution_steps and ratified by the operator on 2026-10-09; dated
    trailing-bracket annotations on Decision 107 and Decision 88 naming it.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
- file: tests/common/test_ducklake_catalog_index_status.py
  action: Create
  purpose: >-
    Over a fake cursor: schema enumeration; present/valid for the fixed name, for an equivalent index in either column
    order, absent, and invalid; counters and stats_reset passed through; no write statement is ever issued.
- file: tests/lambdas/ducklake_maintenance/test_index_actions.py
  action: Create
  purpose: >-
    With rt.fetch_dsn and psycopg2.connect patched (the test_login_actions.py stubbing, so no psycopg2 import is
    needed): missing or wrong confirm refuses before any connection; autocommit and the statement_timeout are set
    before any DDL; schemas come from the enumeration; valid or equivalent -> no DDL; absent -> exactly the SQL file's
    statement for that schema; invalid -> DROP INDEX CONCURRENTLY then CREATE; a post-build invalid state raises;
    migration_sha256 equals the file's sha256; an OperationalError whose message names a host becomes a
    DuckLakeRuntimeError naming only class and SQLSTATE; the response never contains the host; ensure_index_for builds
    for one schema; and docs/contracts/ducklake_maintenance.yaml declares verbs.ensure_catalog_indexes with its confirm
    value (test_contract_declares_verb).
- file: tests/lambdas/ducklake_maintenance/test_health_actions.py
  action: Create
  purpose: >-
    control_health emits StatsIndexValid / FileColumnStatsIdxScan / FileColumnStatsSeqScan per enumerated schema with
    the MetaSchema dimension (metric sink captured), reports a status-read failure as StatsIndexValid 0 without
    raising; catalog_stats returns stats_index.
- file: tests/lambdas/ducklake_maintenance/handler/test_control_health_action.py
  action: Modify
  purpose: >-
    Re-point its monkeypatches (_emit_maintenance_metric, ducklake_control_health, DATA_PATH) and calls at
    health_actions, where the moved body now binds them; patch the new index-status read so the existing cases stay
    hermetic. Behaviour assertions unchanged.
- file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
  action: Modify
  purpose: >-
    The catalog_stats cases patch health_actions._emit_maintenance_metric; test_catalog_reinit_drops_then_reattaches
    patches index_actions.ensure_index_for (otherwise catalog_reinit reaches psycopg2, a heavy exclusion in
    requirements-fast.txt) and asserts the stats_index key.
- file: tests/lambdas/ducklake_maintenance/handler/test_dispatch.py
  action: Modify
  purpose: The dispatcher routes ensure_catalog_indexes, control_health and catalog_stats to their modules.
- file: tests/test_ducklake_maintenance.py
  action: Modify
  purpose: TestCatalogStats' fake cursor serves the index-status queries, and catalog_stats returns stats_index.
- file: tests/test_ducklake_reader_handler.py
  action: Modify
  purpose: >-
    test_one_invocation_line_per_path: exactly one ducklake_invocation line on success, 4xx (including an unregistered
    action, logged as "unknown"), 5xx, connectionless and reopen paths, with only the fixed fields (capsys).
- file: tests/lambdas/ducklake_writer/handler/test_invocation_log.py
  action: Create
  purpose: The writer's equivalent of the reader cases, including a row-rule 422 and an OCC-exhausted 503.
- file: tests/common/test_ducklake_metrics.py
  action: Modify
  purpose: test_log_invocation_fixed_fields -- one parseable line with exactly the fixed keys; extra keys are refused.
- file: tests/checks/iam_tf/test_neon_catalog_history_retention.py
  action: Create
  purpose: >-
    Text-level guard over terraform/personal/neon_ducklake_catalog.tf (tests/fixtures/terraform_hcl_blocks.py):
    neon_project.ducklake_catalog sets history_retention_seconds = 604800. Red before (21600).
- file: tests/checks/decisions/test_neon_catalog_tuning_decision.py
  action: Create
  purpose: >-
    test_decision_entry_and_annotations: the Decision exists with its envelope (amends [107, 88], significance
    numbered_decision), one anchor per clause, the five reversal-condition ids, rec-4223 and rec-4220 cited, and dated
    annotations on Decisions 107 and 88 naming it. N is resolved from the contract's ensure_catalog_indexes verb-entry
    citation, never hard-coded.
- file: config/agent/verification_registry/entries/ensure-catalog-indexes-verb.yaml
  action: Create
  purpose: Registry row for graduated VP step 1.
- file: config/agent/verification_registry/entries/ducklake-invocation-log-line.yaml
  action: Create
  purpose: Registry row for graduated VP step 3.
- file: config/agent/verification_registry/entries/neon-catalog-tuning-decision-declared.yaml
  action: Create
  purpose: Registry row for graduated VP step 5.
bundled_recommendations: []
followon_recs:
- rec-4220
- rec-4221
- rec-4222
- rec-4223
infrastructure_dependencies:
- >-
  neon_project.ducklake_catalog in-place update of history_retention_seconds only; the guard's neon_* rule routes it to
  tf-gated-apply, so the operator approves the Environment run. No IAM change: the maintenance role already reads the
  DSN secret it connects with, and psycopg2 is in the ducklake-deps layer.
- >-
  Lambda deploy: compute_affected_artifacts names five active artifacts -- ducklake_maintenance, ducklake_reader,
  ducklake_writer, ducklake_maintenance_smoke and ducklake_catalog_dr (the last only through the shared
  src/common/ducklake_metrics.py) -- all shipped by one run of the governed channel
  (.github/workflows/deploy-ducklake-lambdas.yml) at merge (Decision 125/126), with its per-function smoke gates.
  Recompute the set after rebasing (a newly active manifest that bundles ducklake_metrics.py adds to it and changes VP
  9's count). The merge waits for the operator's word (always-ask: governed DuckLake Lambda deploys).
- >-
  Sequencing: PLAN-url-only-invoke-guard's implementation is merged (#1432, cdc380d5): Decision 213 is taken and the
  maintenance handler is at 497 SLOC with provision_telemetry_login registered. Rebase on origin/main before work.
acceptance_criteria:
- >-
  ensure_catalog_indexes refuses without confirm, enumerates every catalog schema from pg_catalog, builds the index
  CONCURRENTLY under autocommit and a bounded statement_timeout, rebuilds an invalid one, leaves an equivalent index
  alone, and returns booleans and the migration hash only; it is registered only on the admin maintenance function and
  declared in the contract.
- >-
  catalog_reinit leaves the re-initialised schema with a valid index; control_health reports StatsIndexValid and both
  scan counters per schema without ever raising on them; catalog_stats reports stats_index; the moved actions behave as
  before.
- >-
  Reader and writer log exactly one ducklake_invocation line per invocation on every path, carrying only the fixed
  fields and registered action names.
- neon_ducklake_catalog.tf sets history_retention_seconds = 604800 and the apply goes through tf-gated-apply.
- >-
  Decision N (<= 6,144 bytes, amends [107, 88], significance numbered_decision, five-condition reversal stanza) exists
  and Decisions 107 and 88 carry dated annotations naming it.
- >-
  Post-deploy: the operator's invocation reports a valid index on ducklake_ops and ducklake_smoke; once warm containers
  have re-attached (6 h pickup), the per-window FileColumnStatsIdxScan delta is positive and the median per-window
  FileColumnStatsSeqScan delta is at most half the pre-index median, both reset-aware.
- The full validation tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The ensure verb's refusal, enumeration, build, rebuild, redaction and contract declaration.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test_index_actions.py::test_refuses_without_confirm
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_builds_absent_and_rebuilds_invalid_per_enumerated_schema
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_errors_never_carry_host
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_contract_declares_verb -q
  expected: 'Exit 0, 4 passed. Red before: the module does not exist.'
  fix_if: Fix the verb or the contract entry, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ensure-catalog-indexes-verb
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Index-status helpers, health emission, catalog_stats, dispatch and the moved actions' existing tests.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_catalog_index_status.py tests/lambdas/ducklake_maintenance/test_health_actions.py
    tests/lambdas/ducklake_maintenance/handler tests/test_ducklake_maintenance.py -q
  expected: Exit 0.
  fix_if: Fix the moved or new code; the moved control_health/catalog_stats behaviour must be unchanged.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file and whole-directory re-run of test files this plan creates or modifies (vp-red-before hermetic
    exception v); those files are the standing guard in the pytest tier, and a registry row would duplicate them.
- step: 3
  phase: pre-deploy
  action: The per-invocation log line on reader and writer.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_reader_handler.py::test_one_invocation_line_per_path
    tests/lambdas/ducklake_writer/handler/test_invocation_log.py::test_one_invocation_line_per_path
    tests/common/test_ducklake_metrics.py::test_log_invocation_fixed_fields -q
  expected: 'Exit 0, 3 passed. Red before: none of the three tests exists.'
  fix_if: Fix the handler or helper; never log a payload value.
  hermetic: false
  graduation: graduate
  graduation_check_id: ducklake-invocation-log-line
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: The Terraform value and its format.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_neon_catalog_history_retention.py -q && terraform fmt -check terraform/personal/neon_ducklake_catalog.tf
  expected: Exit 0.
  fix_if: Set the value or fix formatting; never run init/validate/plan locally (Decision 119; CI's terraform-validate is the authority).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    terraform fmt needs the terraform binary, which venv-less replay lacks; the pytest half is guarded standing by the
    test itself.
- step: 5
  phase: pre-deploy
  action: The Decision, its envelope, clause anchors, reversal ids and the annotations on 107 and 88.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_neon_catalog_tuning_decision.py::test_decision_entry_and_annotations -q
  expected: 'Exit 0, 1 passed. Red before: the module does not exist.'
  fix_if: Fix the Decision text or annotations, never the test; then rerun scripts.decisions_index --write.
  hermetic: true
  graduation: graduate
  graduation_check_id: neon-catalog-tuning-decision-declared
  expected_literals: []
- step: 6
  phase: pre-deploy
  action: Bundle completeness for every affected function.
  command: >-
    bin/venv-python -c "from scripts.checks.lambda_pkg.validate_lambda_bundle_completeness import
    validate_lambda_bundle_completeness as v;f=[];v(f);print(f);assert not f;print('BUNDLES_OK')"
  expected: Exit 0, an empty failure list and the success marker; every handler import resolves inside its bundle.
  fix_if: Add the missing include or asset to the manifest.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_lambda_bundle_completeness check, which runs in the full tier.
- step: 7
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    scripts.validate is refused as a graduated check (the recursion refusal); the full tier is itself the standing
    gate.
- step: 8
  phase: post-deploy
  action: >-
    The PR's speculative-plan comment shows exactly one in-place update (neon_project.ducklake_catalog,
    history_retention_seconds 21600 -> 604800) routed to tf-gated-apply; after the operator approves, the gated-apply
    job for the merge SHA succeeds. Capture its log with mcp__github__actions_list and mcp__github__get_job_logs and
    save it to $APPLY_LOG_FILE first.
  command: >-
    grep -c 'history_retention_seconds' "$APPLY_LOG_FILE" && grep -qE 'Apply complete! Resources: 0 added, 1 changed, 0 destroyed' "$APPLY_LOG_FILE"
  expected: The attribute appears and the apply completed; no other resource changed.
  fix_if: Any other resource in the plan is drift -- stop and report.
  hermetic: false
- step: 9
  phase: post-deploy
  action: >-
    The governed deploy shipped every affected function and its smoke gates passed. Capture the
    deploy-ducklake-lambdas.yml run for the merge SHA with mcp__github__actions_list (export its conclusion as
    $DEPLOY_RUN_CONCLUSION) and get_job_logs into $DEPLOY_LOG_FILE first.
  command: >-
    test "$DEPLOY_RUN_CONCLUSION" = success && test -s "$DEPLOY_LOG_FILE" && grep -oE
    'agent-platform-ducklake-(maintenance-smoke|maintenance|reader|writer|catalog-dr)' "$DEPLOY_LOG_FILE" | sort -u | wc -l
  expected: The run concluded success and the count equals the affected-artifact count (5 unless the rebase changed it).
  fix_if: Diagnose the failed job per the deploy channel's rules (Decision 125); never deploy by hand.
  hermetic: false
- step: 10
  phase: post-deploy
  action: >-
    Baseline with the new lines (at least 48 h after deploy, before the index): cold and warm elapsed percentiles,
    reopen count and Lambda Init Duration p95 per function, from FilterLogEvents (PlatformDev's grant), saved without
    hostnames to /mnt/project-files/neon-tuning/baseline.json.
  command: >-
    S=/mnt/project-files/neon-tuning; mkdir -p $S; for fn in reader writer; do aws logs filter-log-events --profile
    agent_platform --region eu-west-2 --log-group-name /aws/lambda/agent-platform-ducklake-$fn --start-time $(( ($(date
    +%s) - 172800) * 1000 )) --filter-pattern '{ $.event = "ducklake_invocation" }' --query 'events[].message' --output
    json > $S/inv-$fn.json && aws logs filter-log-events --profile agent_platform --region eu-west-2 --log-group-name
    /aws/lambda/agent-platform-ducklake-$fn --start-time $(( ($(date +%s) - 172800) * 1000 )) --filter-pattern 'REPORT'
    --query 'events[].message' --output json > $S/report-$fn.json; done && bin/venv-python -c "import json,re;S='$S';
    P=lambda v,q:sorted(v)[int(q*(len(v)-1))] if v else None;G=lambda L:{'n':len(L),'p50':P(L,.5),'p95':P(L,.95)};
    R=lambda fn:[json.loads(m) for m in json.load(open(f'{S}/inv-{fn}.json'))];o={fn:{'cold':G([r['elapsed_ms'] for r
    in R(fn) if r['connect_reused'] is False]),'warm':G([r['elapsed_ms'] for r in R(fn) if r['connect_reused'] is
    True]),'reopened':sum(1 for r in R(fn) if r['reopened']),'init_p95':P([float(x) for x in re.findall(r'Init
    Duration: ([0-9.]+)',' '.join(json.load(open(f'{S}/report-{fn}.json'))))],.95)} for fn in
    ('reader','writer')};json.dump(o,open(f'{S}/baseline.json','w'),indent=1);print(json.dumps(o))"
  expected: >-
    baseline.json written with cold and warm n/p50/p95, reopen counts and Init Duration p95 for reader and writer, each
    n greater than zero.
  fix_if: No lines found -- the deploy did not ship the log helper; check step 9.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    The operator invokes the verb once on production (Lambda console test event on agent-platform-ducklake-maintenance,
    event {"action": "ensure_catalog_indexes", "confirm": "ducklake_file_column_stats"}) and pastes the response into the
    thread; the agent saves it to $ENSURE_RESPONSE_FILE and exports INDEX_CREATED_AT (the response time, ISO 8601 UTC).
    Warm containers pick the index up at their next ATTACH (Neon's 5-minute scale-to-zero ends idle sessions and Lambda
    recycles idle containers); a few reset_warm_connection calls on reader and writer speed this up but are optional, so
    step 12 starts 6 h later.
  command: >-
    bin/venv-python -c "import json,os;r=json.load(open(os.environ['ENSURE_RESPONSE_FILE']));r=json.loads(r['body']) if 'body' in r else r;
    s=r['schemas'];assert r['ok'] and s['ducklake_ops']['valid_after'] and s['ducklake_smoke']['valid_after'];print('INDEX_VALID')"
  expected: >-
    INDEX_VALID printed: ok true and valid_after true for ducklake_ops and ducklake_smoke.
  fix_if: >-
    valid_after false -> re-run the verb (it rebuilds an invalid index); a refusal -> check the confirm value; never run
    DDL any other way.
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    Engagement proof, reset-aware, over at least two control_health windows after the 6 h pickup against the pre-index
    windows since deploy (export BASELINE_START as the deploy time): StatsIndexValid is 1 for ducklake_ops after
    INDEX_CREATED_AT, the summed post-index FileColumnStatsIdxScan delta is positive, and the median post-index
    FileColumnStatsSeqScan delta is at most half the pre-index median (a counter that drops is a reset: its new value is
    that window's delta).
  command: >-
    S=/mnt/project-files/neon-tuning; for m in StatsIndexValid FileColumnStatsIdxScan FileColumnStatsSeqScan; do aws
    cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
    --metric-name $m --dimensions Name=MetaSchema,Value=ducklake_ops --start-time "$BASELINE_START" --end-time $(date -u
    +%FT%TZ) --period 21600 --statistics Maximum --output json > $S/$m.json; done && bin/venv-python -c "import json,os;
    S='$S';T=os.environ['INDEX_CREATED_AT'];L=lambda m:[(p['Timestamp'],p['Maximum']) for p in
    sorted(json.load(open(f'{S}/{m}.json'))['Datapoints'],key=lambda p:p['Timestamp'])];D=lambda s:[(t,(b if b<a else
    b-a)) for (_,a),(t,b) in zip(s,s[1:])];M=lambda v:sorted(v)[len(v)//2];i=D(L('FileColumnStatsIdxScan'));
    q=D(L('FileColumnStatsSeqScan'));pre=[v for t,v in q if t<T];post=[v for t,v in q if t>=T];assert all(v==1 for t,v
    in L('StatsIndexValid') if t>=T);assert sum(v for t,v in i if t>=T)>0;assert M(post)<=0.5*M(pre);
    print('ENGAGED',M(pre),M(post))"
  expected: ENGAGED printed with the pre- and post-index median seq_scan deltas.
  fix_if: >-
    idx_scan delta zero after the pickup -> the fix is not engaging: record the extension build from a connect_probe
    and file a rec (never add other indexes speculatively); idx_scan positive but seq_scan not halved -> another reader
    of the table dominates (merge_ops, the weekly pg_dump): record the deltas and let step 13's latency numbers decide.
  hermetic: false
- step: 13
  phase: post-deploy
  action: >-
    Seven days after step 11: CommitLatencyMs p50/p95 and step 10's decomposition re-run for the same 7 days (change
    172800 to 604800 and baseline.json to after-7d.json), compared with step 10 and the 14-day CloudWatch baseline in
    context; record both on rec-4220, which carries the scale-to-zero choice and the index alarm.
  command: >-
    aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeWriter --metric-name
    CommitLatencyMs --start-time $(date -u -d '-7 days' +%FT%TZ) --end-time $(date -u +%FT%TZ) --period 604800
    --extended-statistics p50 p95 --output json
  expected: >-
    p50 and p95 recorded beside the baseline (p50 2.7 s, p95 5.5 s) and the after-7d decomposition beside
    baseline.json; rec-4220's context is updated through the portal with both.
  fix_if: Missing data -- check control_health and the deploy; do not re-run the index.
  hermetic: false
