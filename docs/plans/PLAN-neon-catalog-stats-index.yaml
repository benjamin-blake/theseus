constraints:
- Index DDL runs only through ensure_catalog_indexes, invoked by the operator; no agent invokes it (Decision 81 cl.6) and no other path runs DDL on the catalog.
- No new IAM, no new Terraform resource; the only Terraform change is history_retention_seconds (plus comment corrections).
- Nothing logs or returns a host, password, payload value or Postgres error message.
- The maintenance-smoke dispatch is unchanged (Decision 143); the verb is registered on the admin function only.
- Lambda code ships only through the governed deploy channel (Decision 125); no local build_lambda --deploy.
- No budget raise anywhere (Decision 128); the handler is decomposed and the index-status helpers get their own module.
- The Decision stays <= 6,144 bytes; 107 and 88 are annotated only by appended dated lines (Decision 177).
- No rescue agents or workaround loops (Decision 55).
