    hermetic: false
    graduation: graduate
    graduation_check_id: decomposed-sources-route-to-test-packages
  - step: 19
    phase: pre-deploy
    action: >-
      Symmetric gate on the MODIFIED-record set that execution step 4 introduces -- size its
      differential cost against the fast-tier budget before the gate runs it.
    command: >-
      bin/venv-python -c "from scripts.verification_graduation import load_entries;
      from scripts.checks.verification.validate_verification_registry import _modified_entries;
      rows=_modified_entries(load_entries());
      import yaml; plan=yaml.safe_load(open('docs/plans/PLAN-verification-registry-sharding.yaml'));
      owed=sum(1 for s in plan['verification_plan'] if s.get('graduation')=='graduate');
      n=len(rows); total=n+owed; print('modified:', n, 'added:', owed, 'total:', total,
      ts=sum(1 for e in rows if e.get('primitive_slot')=='test_selector')
      + sum(1 for s in plan['verification_plan'] if s.get('graduation')=='graduate'
      and s.get('command','').find('pytest')>=0); ce=total-ts;
      worst=ts*8.2+ce*4.5; print('test_selector:', ts, 'command_exit_zero:', ce,
      '-> worst-case', round(worst), 's of a 300s budget');
      assert worst < 150, f'{total} records project to {round(worst)}s, over half the fast-tier budget'"
    expected: >-
      modified 7 (the 8 self-referential records minus plan-obligations-enumeration-homed, retired),
      added 12 -> ~19 records. PER-SLOT, because the two slots differ by ~4x and the populations are
      mixed: ~7 test_selector at a measured 5.6s mean / 8.2s max, ~12 command_exit_zero at 1.3s mean
      / 4.5s max -> ~55s mean, ~111s worst case. Under the 150s half-budget assertion.
    fix_if: >-
      This plan's own migration is the first exerciser of the modified-record rule it introduces,
      on a check that already dominates the fast tier and has twice exceeded it. This gate sizes
      BOTH halves -- the modified set AND the added set step 5 counts -- because the fast tier pays
      for both in the same run. If the projection breaches, split the re-authoring across PRs
      rather than widening the budget.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A cost projection specific to this migration's own diff, not a standing invariant -- in
      steady state a PR re-authors zero or one record. The durable behavior (modified records ARE
      re-admitted) is graduated at step 6. Note this step calls the GATE's own _modified_entries
      selector rather than re-deriving a heuristic, so it gates the implementation rather than
      restating the plan's expectation -- a private re-derivation would print 8 and pass even if
      the implementation wrongly selected all 476.
