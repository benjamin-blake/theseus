execution_steps:
  - >-
    Add load_entries(), entries_at_ref(ref) and shard_path_for(check_id) to
    scripts/verification_graduation.py. Discovery is by directory glob, never a manifest; exclude
    entries/deprecated/; sort by filename. entries_at_ref lists the directory at a git ref
    (git ls-tree) and falls back to the legacy flat path for refs predating the migration, failing
    loud on an unreadable directory rather than returning an empty baseline.
  - >-
    Migrate all 476 records to config/agent/verification_registry/entries/<check_id>.yaml, one
    mapping per file, rendered at width=200 so no line exceeds the 2,000-char class cap. Assert
    round-trip equality against the pre-migration file BEFORE deleting it. Delete
    config/agent/verification_registry/registry.yaml. Create the empty entries/deprecated/ reservation.
  - >-
    Repoint validate_verification_registry and validate_graduation_completeness at the loader.
    Add the placement leg (filename == check_id) and the flat-file-resurrection leg.
  - >-
    Close the silent-modification hole -- select MODIFIED records for differential re-admission, not
    only novel check_ids, keeping the existing non-fatal skipped outcome as the escape hatch for
    legitimate re-pointing. Keep this hunk independently revertible.
  - >-
    Adopt the Decision 170 examined()/skipped() declaration in
    validate_verification_registry.py and remove its entry from config/check_accounting_baseline.yaml.
  - >-
    Re-author the self-referential records against the loader, preserving each record's check_id and
    claim; record the re-authoring in the contract's governance_notes per its RE-AUTHORED precedent.
  - >-
    Delete both raise-approved dec-166 entries from config/structural_size_budgets.yaml and
    re-ground the config class row's actual_purpose, relief_valve and unit_gameability_residual text.
  - >-
    Amend docs/contracts/verification-registry.yaml to contract_version 5 with semantic_break true
    and a non-prose change_class; re-ground both data-file path references.
  - >-
    Append a dated amendment_forms annotation to Decision 166 narrowing clause 6. Do NOT mint a new
    numbered entry. Name the routing row in the PR body per AGENTS.md's DD-B convention.
  - >-
    Update .claude/skills/implement/SKILL.md's graduation producer step to write
    entries/<check_id>.yaml, and re-ground the remaining flat-path references in
    scripts/checks/registry.py, scripts/ci/reconcile_reachability.py,
    docs/contracts/plan-obligations.yaml and docs/ROADMAP-PLATFORM.yaml (adding the T3.7
    successor note).
  - >-
    Repoint the five test modules binding the flat path and add the new test classes named in the
    Verification Plan.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55). Step 5 is a gate: do not proceed while newly-added record count is non-zero.
  - "Report: what was implemented, verification results, and the selector measurement from step 15."
