constraints:
  - No rescue agents or workaround loops (Decision 55); fail loud, fix forward, never auto-revert.
  - >-
    MINT a numbered Decision, and ALSO append a dated pointer annotation on Decision 166 -- the
    Decision 167/173 pairing form (167 annotated 150 and 160; 173 annotated 116, 122 and 164),
    never one instead of the other. Decision 147 is NOT an instance of the pairing form -- verified
    that Decision 114 carries no annotation and never mentions 147 -- so cite 147 only as the
    own-numbered-entry precedent, which is what it actually is. Routing per
    decision-entry.yaml significance.routing_rule: three of the four pieces are owned by existing
    rows (record grammar and loader semantics -> field_semantics in the owning contract;
    T3.7-as-successor -> work_item; the change record -> the PR body), but the PATH SELECTION
    itself -- choosing re-grain over clause 6's pre-committed CD.29 archival lifecycle, and
    retiring the size instrument -- is owned by NONE of them, so question 3 answers no and all
    three answer yes. Decision 147 is the near-exact precedent: responding to Decision 114's
    reversal trigger by selecting among Path A/C/D got its own numbered entry, not an annotation
    on 114. The entry carries the typed envelope (number, significance: numbered_decision with a
    justification naming the rejected contract alternative) and amends [166], and must fit the
    6,144-byte per-entry hard cap -- route measurement detail to the contract and the PR body.
    Corpus headroom verified affordable: 126/132 live headers, 108,079/112,000 index bytes,
    749,903/780,000 combined bytes.
  - >-
    Do NOT cite Decision 166 reversal condition (c) as authorizing the roster deletions. (c)
    governs a CLASS ROW and prescribes retiring that row; this plan keeps the config class row and
    deletes two GRANDFATHER ROSTER ENTRIES, a different object. The on-point condition is (f),
    which names 'its grain' verbatim -- and (f)'s TRIGGER has not fired (5,972 < 6,000; no second
    raise is proposed), so the plan elects (f)'s prescribed RESPONSE ahead of its trigger. Say that
    plainly rather than claiming pre-authorization. Separately, the deletions need no authorization
    at all: scripts/checks/_marker_guard.authorization_failure iterates current_entries only, so an
    entry present at base and absent at head is never examined.
  - >-
    The merged corpus exists only in memory. Never write a combined registry file to disk -- a
    materialized union recreates the contended hot file this plan removes. Record this in
    docs/contracts/verification-registry.yaml's governance_notes, not only here: a plan document is
    a workflow_outputs artifact nobody reads later.
  - >-
    No index or manifest listing the entry files. The directory listing IS the index; a committed
    manifest reintroduces the shared-append conflict. Record in the contract's governance_notes.
  - >-
    No cached aggregate (e.g. a stored corpus count). Any future count must be computed from the
    glob, never read from a number an author bumps. Record in the contract's governance_notes.
  - >-
    No per-entry line in config/structural_size_budgets.yaml for shards. Config-class governance
    (500 effective lines / 2,000 chars) covers new files implicitly -- keep it that way.
  - >-
    No "regenerate the merged YAML for readability" convenience artifact, in any form.
  - >-
    Records are insert-once. Retirement is git mv into the reserved, loader-excluded deprecated/
    subtree; no lifecycle machinery, status column, or version key is built by this plan. The
    contract must tell T3.7's implementer that deprecated/ is excluded from the live set and has to
    be read explicitly by any orphan sweep.
  - >-
    Re-author self-referential records in place, preserving check_id and the record's original
    claim. A record whose CLAIM changes requires a new check_id per the contract.
  - Do not rewrite docs/plans/ or audits/ artefacts -- they are historical records of past work.
  - Only files listed in Scope may be modified.
context:
  - >-
    rec-3231 (bundled): the flat entries[] sequence makes any two concurrent plans conflict
    deterministically. Reproduced in a git lab -- flat list conflicts, per-record files merge clean.
  - >-
    Measured against main @ 6b09dedd: 476 records, 5,972/6,000 effective lines (28 lines = 2.2
    block-style records of headroom), longest line 2,315 against an allowance of exactly 2,315
    (zero headroom), 108 distinct plan_slugs. Liveness, PREDICATE DEFINED (the brief's undefined '470/476' does not
    reproduce): guard_target path resolves 474/476; check_spec path-or-node-id file resolves
    474/476; BOTH resolve 473/476 -- so genuine retirement candidates number ~2-3, not 6.
  - >-
    The size ceiling is already being satisfied by reformatting, not restraint -- #940 and
    #948/#950 each landed a whole record as a single-line flow mapping (1 line vs ~12.8).
    config/structural_size_budgets.yaml:135 asserts this join-evasion "counterfactual fails here"
    because effective lines are paired with a 2,000-char companion, and that the residual is
    "confined to ... docs/ROADMAP-PLATFORM.yaml" -- both false for this file, whose own long-line
    allowance is 2,315, ABOVE that companion. Re-ground that text as part of this plan.
  - >-
    Per-record render measured at width=200: 476 files, mean 12.6 lines/file, longest line anywhere
    424 chars, YAML round-trip exact. Files classify into the config class (fnmatch config/*.yaml
    crosses /), so both raise entries are removable with no replacement.
  - >-
    All 476 check_ids verified safe as filename stems -- unique, max 58 chars, no separators, no
    case-insensitive collisions.
  - >-
    Differential admission costs 7.1s per record (measured). The baseline reader is therefore
    load-bearing: a lost baseline means 476 x 7.1s = ~56 minutes against a 300s fast-tier budget
    that this check already dominates and has twice exceeded.
  - >-
    EIGHT self-referential records, enumerated: coverage-checker-move-no-stale-refs,
    in-scope-graduated-rows-still-resolve, registry-other-lambda-writes-asserted,
    registry-rows-green-on-split-roots, fallback-reevaluation-check-registered,
    plan-obligations-enumeration-homed, structural-engine-green-and-scoped,
    no-retired-ci-role-in-live-surfaces. A literal-path grep finds only seven -- the eighth
    references the directory, not the file -- so match on 'verification_registry', not the full path.
  - >-
    Silent-modification hole proven by execution: replacing a record's check_spec with a tautology
    while keeping its check_id yields zero records to re-admit. The contract's governance_notes
    record prior in-place RE-AUTHORED rows -- those are instances of this defect, so cite them as
    evidence, not as authority. Fixed by this plan.
  - >-
    Grain rationale vs Decision 169's intermediate grain (18 manifests / ~120 checks): manifest
    records carry dispatch semantics (pre, pre_globs, full_segment) and registry.py derives tier
    sequence from them against six frozen-order anchors, so those records are ordered and NOT
    independent, with a stable parent key. This registry is an unordered set keyed by check_id
    (verified -- no positional access anywhere; the sole enumerate is an error-message index) whose
    candidate grouping keys are migrating (plan_slug, per T2.26/T4.16) or mutable (guard_target,
    197 values). Grain follows contention and ordering.
  - >-
    Decision 114/110 "N fragments an agent must reassemble" does not bind: verified by grep that no
    skill or command reads this registry whole -- the only agent-facing references are a per-record
    append instruction (.claude/skills/implement/SKILL.md:372) and a per-record obligation
    (plan-obligations.yaml:50). State this distinguisher explicitly; the flag fires on file count
    alone otherwise. Decision 147 chose Path A for ROADMAP-PLATFORM.yaml on the opposite fact.
  - >-
    THE ARITHMETIC IS THE ARGUMENT for narrowing clause 6 -- lead the Decision with it, not with the
    facade-versus-YAML distinction (a loader-plus-shard-directory is arguably the YAML analogue of a
    facade package, so that distinction is thin on its face). Four measured numbers: headroom is 28
    effective lines; CD.29 exercised to exhaustion reclaims ~2-3 records (~25-38 lines); clause 6's
    own measured growth rate is ~1,200 lines/month; and THIS PLAN's 12 graduate dispositions are
    ~155-165 effective lines. The pre-committed relief valve cannot absorb even the PR that
    triggers it -- absent the re-grain, this plan's own graduations would breach the 6,000 ceiling.
    Clause 6 also predicted '1.7 months of runway' from 3,987 lines on 2026-08-04; the file reached
    5,972 in under three weeks, roughly double the predicted rate.
  - >-
    Per-record files make clause 6's pre-committed valve CHEAPER, not foreclosed (retire = git mv
    into deprecated/). Do NOT argue the valve is unreachable: Decision 93 makes T3.7's
    deferred_post_mvp status reactivable, so unreachability is a choice, not a fact.
  - >-
    DISCHARGE THE ACCRETION PURPOSE EXPLICITLY -- do not delete the config class row's
    actual_purpose sentence silently. That sentence ('registries agents append to must surface
    lifecycle pressure instead of accreting silently') is about accretion, not comprehension, and
    476 files can become 4,760 with nothing surfacing. The argument that it has no subject:
    differential admission costs 7.1s per NEWLY-ADDED record, not per corpus record, so admission
    cost is invariant to corpus size; and the structural census measures 0.09-0.13s over 195 governed
    files, projecting to ~0.32-0.44s with +476 -- immaterial against reversal condition (b)'s
    'materially attributes to the census walk' bar. The whole-file-load half holds independently:
    exactly one agent-facing reference exists (.claude/skills/implement/SKILL.md:372), a per-record
    append instruction.
  - >-
    The count-budget successor obligation transfers to T3.7's registry orphan detection, which the
    roadmap already assigns (lines 1143, 6752, 6790) and which fires on a record dying rather than
    on a threshold. No runtime budget: verified that nothing executes the corpus as a standing
    suite -- the only production caller of run_differential is the newly-added-records path.
  - >-
    IN-REPO PRECEDENT, cheaper and more persuasive than the industry citations:
    config/agent/data_quality/decisions/ is already a directory of per-record YAML files under
    config/agent/ (5 files). Lead with it. Decision 169's own general clause -- table-shaped rather
    than logic-shaped decomposition: convert a growing set of similar items with no per-item
    control flow into a data table plus one generic interpreter -- affirmatively SUPPORTS this
    shape. Cite 169 in favour, not only to distinguish its manifest grain.
  - >-
    WHY NOT THE WAREHOUSE -- state this in the Decision, because it is the first question a reader
    asks of a registry-grain Decision. The differential gate reads its baseline AT A GIT REF
    (git show origin/main:...), which a DuckLake table structurally cannot serve; admission is a
    property of a commit and must run pre-merge and hermetically; the record must revert atomically
    with the code it verifies; and pre-merge CI on a public repo would need write credentials for
    records that may never merge. The warehouse's legitimate role here is a downstream read-only
    projection (the DECISIONS.md -> ops_decisions ETL pattern), never source of truth.
  - >-
    Industry precedent split: CPython Misc/NEWS.d, GitLab changelogs/unreleased, towncrier and reno
    are DRAINING fragment directories and support only the merge-conflict half. The cumulative half
    rests on Elastic detection-rules, SigmaHQ and Semgrep, none of which cap record count.
  - >-
    MODIFIED-RECORD DETECTION COMPARES PARSED RECORD MAPPINGS, never bytes or text. This is
    load-bearing and is the reason acceptance criterion 2 says field-identical rather than
    byte-identical: the migration re-renders every record at width=200, so a byte- or text-based
    detector would select all 476 records instead of the 8 whose content actually changed.
  - >-
    entries_at_ref NEEDS FOUR BRANCHES, not two. (i) ref resolves + entries/ present -> shards;
    (ii) ref resolves + entries/ absent + flat file present -> legacy fallback; (iii) ref resolves +
    both absent -> FAIL LOUD (this is the ~56-minute failure mode); (iv) ref does NOT resolve at all
    -> SKIP THE DIFFERENTIAL LEG with a printed reason, matching _marker_guard's 'SKIP: origin/main
    unreachable (advisory locally, authoritative in CI)'. Say SKIP THE LEG, never 'return an empty
    baseline': the incumbent _entries_at_ref returns [] on a nonzero git show and
    validate_verification_registry has NO reachability guard before _added_entries, so an empty
    return means all 476 records read as newly added -- reproducing the exact melt branch (iii)
    exists to prevent. Conflating (iii) and (iv) instead wedges every environment with an
    unreachable origin/main. Two further cases the incumbent TestEntriesAtRef already covers and
    the rewrite must keep: malformed YAML at the ref, and a non-dict document at the ref.
  - >-
    load_entries and entries_at_ref MUST take repo_root (defaulting None), matching
    scripts/verification_graduation.py's existing convention on git_worktree, run_differential,
    make_worktree_revert_runner and run_verifier_differential. Without it,
    validate_graduation_completeness's fixture suite cannot delegate to the loader without
    re-introducing rec-3166 -- 'the root seam had no paired base seam', i.e. reading the real
    repository while operating on an injected root.
  - "Decision-scout verdict + CITE list (verbatim decision ids): round 1 BLOCK (Decision 166 clause 6), round 2 FLAGS_FOUND, round 3 FLAGS_FOUND. CITE: dec-166, dec-165, dec-163, dec-170, dec-169, dec-168, dec-167, dec-162, dec-160, dec-153, dec-150, dec-147, dec-146, dec-137, dec-135, dec-132, dec-128, dec-118, dec-114, dec-110, dec-104, dec-93, dec-87, dec-86, dec-85, dec-73, dec-67, dec-55, dec-48, dec-43; CD.29, T3.1, T3.7, T2.26, T4.16."
  - "gates: decision-scout=FLAGS_FOUND after 3 round(s); plan-critique=REVISE round 1 (12 findings) then REVISE round 2 (5 blocking B1-B5 + 6 non-blocking N1-N6), all adopted; REVISE round 3 (F1-F3 blocking, all mechanical and introduced by the round-2 test decomposition; F4-F8 non-blocking), all adopted; convergence cap reached and escalated to the operator"
