  - step: 20
    phase: pre-deploy
    action: >-
      Both decomposed sources resolve to their test PACKAGE directories, not to the deleted files.
    command: >-
      bin/venv-python -c "from pathlib import Path;
      from scripts.test_coverage_checker import map_source_to_test;
      from scripts.checks.misc.validate_test_coverage import validate_test_coverage;
      srcs=['scripts/verification_graduation.py','scripts/checks/verification/validate_graduation_completeness.py'];
      [print(' ',s,'->',map_source_to_test(Path(s))) for s in srcs];
      assert all(map_source_to_test(Path(s)).is_dir() for s in srcs), 'still routing to a file';
      f=[]; validate_test_coverage(f); assert not f, f; print('both sources route to packages; coverage gate green')"
    expected: Both sources resolve to directories and validate_test_coverage appends nothing.
    fix_if: >-
      Resolution to a FILE means the _CONCERN_SPLIT_TEST_PACKAGES registration is missing -- the
      full tier will fail with 'missing test file'. A wrong directory name means the stem rule was
      not followed: _mirror_source_to_test derives the package from the SOURCE STEM, so
