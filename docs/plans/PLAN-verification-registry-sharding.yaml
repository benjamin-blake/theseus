execution_steps:
  - >-
    Add load_entries(repo_root=None), entries_at_ref(ref, repo_root=None) and
    shard_path_for(check_id) to scripts/verification_graduation.py -- repo_root defaulting to None
    matches the module's existing convention and preserves rec-3166's paired root/base seam.
    Discovery is by directory glob, never a manifest; exclude entries/deprecated/; sort by filename
    for deterministic order. entries_at_ref implements the FOUR-branch rule from Context: shards
    when the directory is present at the ref; legacy flat file when the directory is absent but the
    file is present; FAIL LOUD when the ref resolves and both are absent; and TOLERATE (advisory
    skip, incumbent posture) when the ref itself does not resolve.
  - >-
    Migrate all 476 records to config/agent/verification_registry/entries/<check_id>.yaml, one
    mapping per file, rendered at width=200 so no line exceeds the 2,000-char class cap. Assert
    round-trip equality against the pre-migration file BEFORE deleting it. Delete
    config/agent/verification_registry/registry.yaml. Create the entries/deprecated/ reservation with a .gitkeep placeholder -- git does not track empty directories, so without it the reservation would not survive a clone (precedent: config/lambda/ducklake-reader/.gitkeep).
  - >-
    Repoint validate_verification_registry and validate_graduation_completeness at the loader.
    Add the placement leg (filename == check_id) and the flat-file-resurrection leg.
  - >-
    Close the silent-modification hole -- select MODIFIED records for differential re-admission, not
    only novel check_ids, keeping the existing non-fatal skipped outcome as the escape hatch for
    legitimate re-pointing. Keep this hunk independently revertible.
  - >-
    Adopt the Decision 170 examined()/skipped() declaration in
    validate_verification_registry.py and remove its entry from config/check_accounting_baseline.yaml.
  - >-
    Re-author the EIGHT self-referential records (enumerated in Context) against the loader,
    preserving each record's check_id and claim; record the re-authoring in the contract's
    governance_notes per its RE-AUTHORED precedent. These are the first exercisers of the
    modified-record rule added above -- run VP step 19 before VP step 16 to size their differential
    cost against the fast-tier budget.
  - >-
    Retire plan-obligations-enumeration-homed into entries/deprecated/ -- git mv, check_id
