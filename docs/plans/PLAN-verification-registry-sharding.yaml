schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "verification-registry-sharding"
intent: >-
  Re-grain the graduated verification-check registry from one flat append-at-tail YAML sequence
  into a directory of one file per check_id behind a single loader, and close the differential
  admission gate's silent-modification hole, so concurrent plans stop conflicting deterministically
  and a graduated check can no longer be neutered without re-admission.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verification-registry-sharding.yaml
phase: >-
  PLATFORM T3.1 / CD.29 verification-graduation surface. Driven by rec-3231 (ad_hoc_rec soft-warn
  exception, so the Tier Item Freshness Gate is skipped -- no tier_item is claimed). Names T3.7 as
  the successor lifecycle instrument for the retired size roster entries.
scope:
  - file: config/agent/verification_registry/registry.yaml
    action: Delete
    purpose: >-
      the flat entries[] sequence is both the deterministic conflict surface (rec-3231) and the
      pinned size surface (5,972/6,000 effective lines, 2,315/2,315 longest line)
  - file: config/agent/verification_registry/entries/deprecated/.gitkeep
    action: Create
    purpose: >-
      makes the loader-excluded retirement reservation survive a clone; git does not track empty
      directories (precedent: config/lambda/ducklake-reader/.gitkeep)
  - file: config/agent/verification_registry/entries/*.yaml
    action: Create
    purpose: >-
      one file per check_id, 476 files; filename is the primary key so uniqueness becomes
      structural and concurrent authors touch disjoint paths
  - file: scripts/verification_graduation.py
    action: Modify
    purpose: >-
      add load_entries(), entries_at_ref(ref) and shard_path_for(check_id) as the sole read path;
      exclude the reserved deprecated/ subtree by glob
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      repoint at the loader; add the filename-equals-check_id placement leg and the
      flat-file-resurrection leg; treat MODIFIED records like added ones in the differential gate;
      adopt the Decision 170 examined()/skipped() declaration
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: repoint _current_registry_entries and _default_baseline_registry_entries at the loader
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      register both decomposed sources in _CONCERN_SPLIT_TEST_PACKAGES (Decision 131 clause 1) --
      the SOLE mechanism routing a source to a test PACKAGE DIRECTORY. Verified: map_source_to_test
      currently resolves scripts/verification_graduation.py and
      scripts/checks/verification/validate_graduation_completeness.py to the two FILES this plan
      deletes, so without this registration check_test_file_exists returns 'missing test file' and
      validate_test_coverage fails the full tier that VP step 16 runs. The tests/test_coverage_checker/
      precedent this plan cites required exactly this: that module is itself a member.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: re-ground the docstring's flat-path reference (docstring only, no behavior change)
  - file: scripts/ci/reconcile_reachability.py
    action: Modify
    purpose: re-ground the docstring's flat-path reference (docstring only, no behavior change)
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      delete both raise-approved dec-166 roster entries (no authorization needed -- see constraints);
      re-ground the config class row's actual_purpose and relief_valve, which name registry.yaml as
      the class cap's primary justification. Do NOT edit the roadmaps row's
      unit_gameability_residual, and do NOT assert in the Decision that deleting the registry's
      2,315 allowance restores that claim's literal truth -- long_line_budgets still carries
      logs/.retro-lite-log.jsonl (2,523) and logs/.execution-step-telemetry.jsonl (6,679), both in
      a class whose companion is 2,000. The honest distinguisher is that those two survivors are
      machine-APPENDED JSONL journals, not hand-joinable authored surfaces, so the join-evasion the
      residual describes has no author to exploit it there. State that; do not assume it
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: shrink-only removal of validate_verification_registry (Decision 170 touch-it-fix-it)
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Class A amendment contract_version 4 -> 5 with semantic_break true; re-ground both data-file
      path references; record the shard grammar, the loader as sole read path, the deprecated/
      reservation, and the re-authored rows in governance_notes
  - file: docs/contracts/plan-obligations.yaml
    action: Modify
    purpose: re-ground the flat-path reference at line 50
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      mint a numbered Decision carrying the path selection (re-grain over clause 6's pre-committed
      CD.29 archival lifecycle; retirement of the 6,000-line instrument; the accretion-successor
      disposition), with the typed significance envelope and amends [166]; AND append a dated
      amendment_forms pointer annotation on Decision 166 pointing at it (the Decision 167/173 pairing form
      -- number plus pointer, never one instead of the other)
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      re-ground the flat-path reference at line 7152; note T3.7 as the successor lifecycle
      instrument for the retired roster entries
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: graduation producer writes entries/<check_id>.yaml instead of appending to entries[]
  - file: tests/test_verification_graduation.py
    action: Delete
    purpose: >-
      SLOC decompose-by-default (Decision 128): measured 489/500 SLOC with 11 lines of headroom,
      unregistered in config/sloc_budgets.yaml, so validate_sloc_limits HARD-ERRORS once the new
      loader classes land and --update-sloc-budgets will not auto-seed it. Decomposed into the
      package below, mirroring the tests/test_coverage_checker/ precedent.
  - file: tests/verification_graduation/__init__.py
    action: Create
    purpose: package marker for the decomposed mirror of scripts/verification_graduation.py
  - file: tests/verification_graduation/conftest.py
    action: Create
    purpose: >-
      home for the shared git/seed helpers (_git, _init_repo, _commit_all, _seed_graduation_deps,
      _GRADUATION_DEPS, _MANIFEST_DOMAINS) used across the differential classes and needed by both
      new loader classes. Without it the implementer must duplicate ~60 SLOC or import across
      test_* modules, which validate_no_cross_test_imports fails in both tiers (Decision 131
      clause 2). The sibling package already has one; the asymmetry was the defect.
  - file: tests/verification_graduation/test_materialize.py
    action: Create
    purpose: existing materialize_check / materialize_check_in_tree classes, moved verbatim
  - file: tests/verification_graduation/test_differential.py
    action: Create
    purpose: existing run_differential / worktree classes, moved verbatim
  - file: tests/verification_graduation/test_loader.py
    action: Create
    purpose: >-
      new loader classes -- TestBaselineReaderSpansLayouts, TestDeprecatedSubtreeExcluded,
      TestLoaderOrdering, TestConcurrentGraduationsMergeClean
  - file: tests/checks/verification/test_validate_verification_registry.py
    action: Modify
    purpose: >-
      structural rewrite, not an addition: every existing fixture writes a flat registry.yaml, and
      the _entries_at_ref unit tests assert == [] on unresolvable refs -- the contract this plan
      partially reverses. Add the placement, flat-file-resurrection and modified-record classes
  - file: tests/checks/verification/test_validate_graduation_completeness.py
    action: Delete
    purpose: >-
      SLOC decompose-by-default (Decision 128): measured 495/500 SLOC with 5 lines of headroom and
      unregistered, so the N-file fixture rewrite plus TestShardedRegistryReaders would hard-error.
      Decomposed into the package below.
  - file: tests/checks/verification/validate_graduation_completeness/__init__.py
    action: Create
    purpose: package marker for the decomposed mirror
  - file: tests/checks/verification/validate_graduation_completeness/conftest.py
    action: Create
    purpose: >-
      the shared _write_registry fixture writer, rewritten from a single flat yaml.safe_dump to an
      N-file writer; measured 2 call sites (lines 223, 565) plus its definition, and 5
      _REGISTRY_REL bindings (lines 24, 86, 440, 460, 475), all of which move with it
  - file: tests/checks/verification/validate_graduation_completeness/test_plan_leg.py
    action: Create
    purpose: existing plan-PR-leg classes, moved verbatim
  - file: tests/checks/verification/validate_graduation_completeness/test_implement_leg.py
    action: Create
    purpose: >-
      existing implement-PR-leg classes plus TestShardedRegistryReaders; the incumbent
      test_current_entries_missing_file_is_empty is re-authored against the four-branch rule
  - file: tests/validate/test_driver_seam.py
    action: Modify
    purpose: repoint the two literal registry-path bindings
  - file: tests/esb_text_fix/test_persona_routing_rationale.py
    action: Modify
    purpose: >-
      repoint REGISTRY_PATH AND replace its registry["entries"] destructuring with the loader
  - file: tests/esb_text_fix/test_fallback_spec.py
    action: Modify
    purpose: repoint the registry reference
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Modify
    purpose: >-
      repoint REGISTRY_PATH AND replace its registry["entries"] destructuring with the loader
bundled_recommendations:
  - rec-3231
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Two branches cut from the same base, each adding one graduated check, both merge with no
    conflict in the registry (rec-3231's stated acceptance).
  - >-
    load_entries() returns exactly the 476 check_ids present in the pre-migration registry.yaml,
    with every field of every record identical after YAML round-trip (field-identical, not
    byte-identical -- the migration deliberately re-renders at width=200).
  - >-
    entries_at_ref() returns the full 476-record baseline for a ref carrying the legacy flat file
    AND for a ref carrying the shard directory, so the differential gate sees zero newly-added
    records across the migration.
  - >-
    A record whose check_spec is modified without changing its check_id IS re-admitted by the
    differential gate (the silent-neutering hole is closed).
  - >-
    A record whose filename does not equal its check_id fails validate_verification_registry, as
    does the reappearance of a flat config/agent/verification_registry/registry.yaml.
  - >-
    Both raise-approved dec-166 roster entries are absent from config/structural_size_budgets.yaml
    and both structural-size checks pass with no replacement roster entry for the registry. No
    Decision clause is cited as authorizing this: scripts/checks/_marker_guard.authorization_failure
    iterates current_entries only, so a roster removal is never examined.
  - >-
    Every re-authored self-referential record materializes and returns PASS.
  - >-
    validate_verification_registry declares examined()/skipped() and is absent from
    config/check_accounting_baseline.yaml.
  - >-
    No reference to config/agent/verification_registry/registry.yaml remains under the swept roots:
    scripts/, config/, tests/, docs/contracts/, docs/ROADMAP-PLATFORM.yaml, .claude/. Deliberately
    NOT swept, because they are historical records this plan's constraints forbid rewriting:
    docs/plans/, audits/, docs/audit-prompts/, docs/DECISIONS.md, and the generated
    docs/decisions-index.json. Baseline at plan time: 29 references (including self-references inside registry.yaml itself, which this plan deletes), all under files in scope. Verified RED today, exit 1.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Corpus fidelity -- the union of shards equals the pre-migration corpus exactly, by check_id
      set and by per-record field equality.
    command: >-
      bin/venv-python -c "import subprocess,yaml; from scripts.verification_graduation import
      load_entries; old=yaml.safe_load(subprocess.run(['git','show','origin/main:config/agent/verification_registry/registry.yaml'],capture_output=True,text=True,check=True).stdout)['entries'];
      new=load_entries(); a={e['check_id']:e for e in old}; b={e['check_id']:e for e in new};
      assert a.keys()==b.keys(), sorted(set(a)^set(b)); bad=[k for k in a if a[k]!=b[k]];
      assert not bad, bad; print(f'corpus fidelity OK: {len(b)} records, field-identical')"
    expected: "corpus fidelity OK: 476 records, field-identical"
    fix_if: >-
      A missing/extra check_id means the migration dropped or duplicated a record; a field
      mismatch means the YAML re-render was not round-trip exact (re-dump at width=200).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-shot migration-moment assertion against a pre-migration baseline that ceases to exist
      after this PR merges. The durable corpus-integrity properties are graduated separately at
      steps 2, 3 and 4.
  - step: 2
    phase: pre-deploy
    action: >-
      Placement is enforced -- a record whose filename does not equal its check_id fails the gate.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry.py::TestShardPlacement -q
    expected: All tests pass; a misplaced-record fixture produces a failure naming the filename/check_id mismatch.
    fix_if: >-
      A misplaced fixture passing means the placement leg is not wired into
      validate_verification_registry's failure path.
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-shard-filename-is-check-id
  - step: 3
    phase: pre-deploy
    action: >-
      Flat-file resurrection is rejected -- reappearance of registry.yaml, or records outside
      entries/, fails the gate.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry.py::TestFlatFileRejected -q
    expected: All tests pass; a fixture reintroducing a flat registry.yaml fails.
    fix_if: A resurrected flat file passing means the monolith can silently return.
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-flat-file-rejected
  - step: 4
    phase: pre-deploy
    action: >-
      The baseline reader spans both layouts -- entries_at_ref returns the full record set for a
      ref carrying the legacy flat file and for a ref carrying the shard directory.
    command: >-
      bin/venv-python -m pytest
      tests/verification_graduation/test_loader.py::TestBaselineReaderSpansLayouts
      tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::TestShardedRegistryReaders -q
    expected: >-
      All tests pass for both the legacy-flat ref and the shard-directory ref, across BOTH
      registry readers (validate_verification_registry and validate_graduation_completeness).
    fix_if: >-
      An empty baseline for either layout is the CI-melting failure -- every record would read as
      newly added, costing ~7.1s each (476 records is ~56 minutes against a 300s fast-tier budget
      this check already dominates). Must fail loud on a genuinely missing directory, never
      silently return an empty list (Decision 55).
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-baseline-reader-spans-layouts
  - step: 5
    phase: pre-deploy
    action: >-
      The migration itself triggers zero differential admissions, because every check_id survives.
    command: >-
      bin/venv-python -c "import yaml;
      from scripts.checks.verification.validate_verification_registry import _added_entries;
      from scripts.verification_graduation import load_entries;
      plan=yaml.safe_load(open('docs/plans/PLAN-verification-registry-sharding.yaml'));
      owed={s['graduation_check_id'] for s in plan['verification_plan'] if s.get('graduation')=='graduate'};
      added={e['check_id'] for e in _added_entries(load_entries())};
      print('added:', len(added), '| owed by this plan:', len(owed), '| migration-attributable:', sorted(added-owed));
      assert added <= owed, sorted(added-owed)"
    expected: >-
      "migration-attributable: []" -- the added set is a SUBSET of this plan's own 12 obligated
      graduation_check_ids. Zero before the graduation walk, exactly those 12 after it; either way
      the re-grain itself contributes nothing.
    fix_if: >-
      A NON-EMPTY migration-attributable set means the baseline reader is not resolving
      origin/main's layout; fix step 4 before proceeding -- do NOT let this PR run hundreds of
      worktree differentials. Asserting a bare zero here would be WRONG: this plan's 12
      graduate dispositions each obligate a new record (validate_graduation_completeness's
      implement-PR leg fails the PR without them), so the added set is legitimately 12 after the
      graduation walk. The invariant is subset-of-owed, not empty.
      NOTE: this step gates the ADDED set only and is structurally blind to the MODIFIED set that
      execution step 4 introduces -- step 19 is its symmetric gate and both must pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a property of this migration's own diff (no new check_ids) rather than a standing
      invariant; in steady state it is tautological. The durable property -- that the baseline
      reader resolves both layouts -- is graduated at step 4.
  - step: 6
    phase: pre-deploy
    action: >-
      The silent-modification hole is closed -- a record whose check_spec changes while its
      check_id stays the same IS re-admitted by the differential gate.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry.py::TestModifiedRecordReadmitted -q
    expected: >-
      All tests pass; a fixture replacing a record's check_spec with a tautology (bash -c 'exit 0')
      is selected for differential re-admission and rejected as non-discriminating.
    fix_if: >-
      If the mutated fixture is not selected, the gate still permits neutering a graduated check
      into a no-op. Keep this hunk independently revertible (Decision 170 clause 2 precedent).
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-modified-record-re-admitted
  - step: 7
    phase: pre-deploy
    action: >-
      The reserved deprecated/ subtree is excluded from the live set by the loader.
    command: bin/venv-python -m pytest tests/verification_graduation/test_loader.py::TestDeprecatedSubtreeExcluded -q
    expected: A record placed under entries/deprecated/ is absent from load_entries() output.
    fix_if: >-
      Inclusion means retirement by git mv would not actually retire anything; exclusion must be a
      loader glob rule, never a documented convention (Decision 168).
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-deprecated-subtree-excluded
  - step: 8
    phase: pre-deploy
    action: >-
      Loader ordering is deterministic and no consumer depends on directory order.
    command: bin/venv-python -m pytest tests/verification_graduation/test_loader.py::TestLoaderOrdering -q
    expected: load_entries() returns records sorted by filename, stable across repeated calls.
    fix_if: Non-deterministic ordering makes diffs and failure messages irreproducible.
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-loader-order-deterministic
  - step: 9
    phase: pre-deploy
    action: >-
      Both dec-166 roster entries are gone and the structural-size gates pass with no replacement
      entry for the registry.
    command: >-
      bin/venv-python -c "import yaml,pathlib; from scripts.checks.structural.size_limits import
      validate_structural_size_limits; from scripts.checks.structural.budget_raises import
      validate_structural_size_budget_raises; f=[]; validate_structural_size_limits(f);
      validate_structural_size_budget_raises(f); assert not f, f;
      reg=yaml.safe_load(pathlib.Path('config/structural_size_budgets.yaml').read_text());
      stale=[k for k in list(reg.get('budgets') or {})+list(reg.get('long_line_budgets') or {}) if
      'verification_registry' in k]; assert not stale, stale; print('size gates green; both registry
      raise entries removed')"
    expected: "size gates green; both registry raise entries removed"
    fix_if: >-
      A surviving roster key means the retirement under Decision 166 reversal condition (c) was
      not completed. A size violation on a shard means the per-record render exceeded the config
      class defaults (500 effective lines / 2,000 chars) -- re-dump at width=200.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-size-raises-removed
  - step: 10
    phase: pre-deploy
    action: >-
      Every re-authored self-referential record still materializes and returns PASS.
    command: >-
      bin/venv-python -c "from scripts.verification_graduation import load_entries,
      materialize_check; rows=[e for e in load_entries() if 'verification_registry' in
      str(e.get('check_spec')) or str(e.get('guard_target','')).startswith('config/agent/verification_registry')];
      bad=[e['check_id'] for e in rows if materialize_check(e).run().status.name!='PASS'];
      print('live self-referential records:', len(rows), 'failing:', bad); assert not bad, bad"
    expected: >-
      Seven LIVE self-referential records report PASS; failing list empty. The eighth,
      plan-obligations-enumeration-homed, is retired into deprecated/ by execution step 7 and is
      therefore absent from load_entries() -- it is not excluded by a special case here, it is
      simply no longer in the live set.
    fix_if: >-
      A failure means a re-authored check_spec still reads the deleted flat path or parses the old
      entries[] shape. Re-author against the loader, preserving the record's original claim.
      MEASURED PRE-EXISTING FAILURE: plan-obligations-enumeration-homed returns FAIL on today's
      tree -- its command_exit_zero spec asserts scripts/CLAUDE.md SHRANK relative to origin/main,
      a one-shot migration-moment assertion that went permanently red the moment it merged. Nobody
      noticed because graduated records are never re-executed as a standing suite. Do NOT re-author
      it: its claim is spent, so retire it (execution step 7). If it were re-authored instead, this
      plan's own new modified-record rule would select it and run_differential would return
      admitted=False ('does not pass on HEAD'), hard-failing the PR -- and the non-fatal skipped
      escape hatch does not apply, since _differential_skip_reason returns None for any slot that
      is not test_selector and this record is command_exit_zero.
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-self-referential-records-green
  - step: 11
    phase: pre-deploy
    action: >-
      rec-3231 acceptance -- two branches cut from the same base, each adding one graduated
      record, merge with no conflict.
    command: bin/venv-python -m pytest tests/verification_graduation/test_loader.py::TestConcurrentGraduationsMergeClean -q
    expected: >-
      The merge succeeds and both records are present; the same scenario against a single flat
      sequence conflicts (the discriminating half).
    fix_if: >-
      A conflict means records are still sharing a file. Note the one informative conflict that
      MUST survive: two branches minting the same check_id produce an add/add conflict.
    hermetic: false
    graduation: graduate
    graduation_check_id: registry-concurrent-graduations-merge-clean
  - step: 12
    phase: pre-deploy
    action: >-
      Decision 170 touch-it-fix-it is satisfied -- the module declares examined()/skipped() and is
      no longer baselined.
    command: >-
      bin/venv-python -c "import pathlib; from scripts.checks.hygiene.validate_check_accounting
      import validate_check_accounting; src=pathlib.Path('scripts/checks/verification/validate_verification_registry.py').read_text();
      assert 'examined(' in src or 'skipped(' in src, 'no declaration';
      base=pathlib.Path('config/check_accounting_baseline.yaml').read_text();
      assert 'validate_verification_registry' not in base, 'still baselined'; f=[];
      validate_check_accounting(f); assert not f, f; print('declaration adopted; baseline entry removed')"
    expected: "declaration adopted; baseline entry removed"
    fix_if: >-
      Editing a baselined check's defining module without adopting the declaration in the same PR
      fails validate_check_accounting. Removal is the permitted shrink-only direction.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-check-accounting-declared
  - step: 13
    phase: pre-deploy
    action: >-
      The Class A contract records the new layout at version 5 with a consistent amendment entry.
    command: >-
      bin/venv-python -c "import yaml,pathlib;
      d=yaml.safe_load(pathlib.Path('docs/contracts/verification-registry.yaml').read_text());
      assert d['contract']['contract_version']==5, d['contract']['contract_version'];
      e=d['amendment_log'][0]; assert (e['change_class']=='prose_improvement')!=bool(e['semantic_break']),
      e; assert 'registry.yaml' not in d['contract']['description'], 'stale data-file path';
      print('contract v5; amendment consistent; path re-grounded')"
    expected: "contract v5; amendment consistent; path re-grounded"
    fix_if: >-
      PREPEND the new amendment_log entry: the log is newest-first (2026-08-06, 2026-07-16,
      2026-07-04) so [0] is the newest, and an APPEND would leave this assertion inspecting the OLD
      entry, which satisfies the XOR and passes vacuously.
      contracts_enforcement._amendment_entry_consistent requires prose_improvement XOR
      semantic_break; a description/semantics edit with a non-prose change_class needs
      semantic_break true or it is rejected as category 6.
    hermetic: true
    graduation: graduate
    graduation_check_id: verification-registry-contract-v5-shard-layout
  - step: 14
    phase: pre-deploy
    action: >-
      Stale-reference sweep -- no live reference to the deleted flat path survives outside
      historical artefacts (docs/plans/, audits/).
    command: >-
      bin/venv-python -c "import subprocess,sys;
      r=subprocess.run(['git','grep','-n','config/agent/verification_registry/registry[.]yaml','--','scripts/','config/','tests/','docs/contracts/','docs/ROADMAP-PLATFORM.yaml','.claude/'],capture_output=True,text=True);
      hits=[l for l in r.stdout.splitlines() if l.strip()]; print('live_flat_path_refs=',len(hits));
      [print('  ',h[:140]) for h in hits[:10]]; sys.exit(1 if hits else 0)"
    expected: "live_flat_path_refs= 0"
    fix_if: >-
      Any hit is a consumer still bound to the deleted file. Baseline at plan time is 29 hits (verified RED, exit 1), so this step discriminates. Authored in Python deliberately:
      the shell form needed nested quoting that a YAML folded scalar mangles, and an unquoted
      --include=*.py globs against CWD (setup.py exists), silently narrowing the sweep.
      docs/plans/, audits/, docs/audit-prompts/, docs/DECISIONS.md and docs/decisions-index.json
      are deliberately unswept -- historical records this plan's constraints forbid rewriting.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-flat-path-no-live-refs
  - step: 15
    phase: pre-deploy
    action: >-
      Measure the affected-test selector's output on this migration diff against its CAP of 35 and
      record the result; do not assume the cap absorbs a 476-file add plus a delete referenced by
      five test modules.
    command: >-
      bin/venv-python -c "from scripts.checks.deps.affected_tests import derive_affected_tests, CAP;
      from scripts.checks import _common;
      sel=derive_affected_tests(_common.get_status_aware_diff(), repo_root=_common.ROOT);
      m=sel['manifest']; print('CAP:', CAP, '| selected:', len(sel.get('tests') or []),
      '| capped:', m.get('capped'), '| deferred:', m.get('deferred'));
      assert not m.get('capped'), 'selector hit CAP and truncated -- run the full tier'"
    expected: >-
      capped: False. Asserts the selector's OWN truncation flag, which is stronger than counting
      stdout lines -- scripts/checks/deps/affected_tests.py has no __main__, no argparse and no
      --base flag, so a module-invocation form would print nothing and exit 0 unconditionally,
      passing vacuously. Verified by execution.
    fix_if: >-
      Silent truncation would under-select tests for this PR -- a 476-file add plus a delete
      referenced by five test modules is exactly the shape that overflows. If the cap is hit,
      record the deferral and run the full tier (step 16) before handoff; do not widen CAP.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A real gate on the selector's own capped flag, so it IS kernel-expressible -- but its subject
      is this migration's own diff shape (a one-time 476-file add), not a standing property of the
      repository, so graduating it would register a guard with no future subject.
  - step: 16
    phase: pre-deploy
