rollback: >-
  Phases 1-2 (repo) revert by reverting their PRs; the parked-trigger shape is restored by re-adding
  the workflow_dispatch-only on: blocks. The phase 1 DESTROY is not revertible: the Athena workgroup,
  Glue database and CloudWatch log group are permanently gone (the two broker secrets are recoverable
  within AWS's 7-30 day window). Phase 3 IS reversible -- re-widen the grant in bootstrap HCL and
  re-apply through the same human gate; admin-tier grants do not transit the narrowed boundary, so the
  admin identity retains the authority to undo it. If phase 1 latches the record red, do not roll back:
  recover forward via reconcile.yml (Decision 158 route (ii)).
