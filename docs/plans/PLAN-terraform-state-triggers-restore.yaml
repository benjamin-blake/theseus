  - "Run VP steps 1, 2, 5, 6, 8. Step 2 is repeated here deliberately: it is what proves the drift test's RED half, and that test does not exist until this phase. Commit, push, open the PR, merge on green."
  - "PHASE 3 (ADMIN container, mirror-synced per infrastructure_dependencies). Run VP step 12, then VP step 13 -- both must be clean before anything else. Regenerate the gitignored terraform.bootstrap.tfvars and terraform.personal.tfvars. Run VP step 14: plan, assert the apply role is safe, PRESENT the plan to the human, apply only on explicit approval."
  - "Run VP steps 15 and 16, then step 17 (dispatch the CI-identity drift cycle) and END THE TURN. On the next wake run step 18 to assert that dispatched run. All four are phase 3 exit criteria -- none is optional, and step 18 is the only one that exercises the CI identity where the Decision 156 lockout lives."
