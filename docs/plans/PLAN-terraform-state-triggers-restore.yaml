schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "terraform-state-triggers-restore"
intent: >-
  Discharge Decision 178 clause 4: destroy the 14 retired terraform/personal resources still held in
  tfstate through the human-gated CD channel, restore the parked apply-sandbox and drift triggers, and
  reconcile the bootstrap root -- returning the governed provision path to its designed shape.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-state-triggers-restore.yaml
phase: T2.24

scope:
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      Phase 1. Restore the push (branches [main], paths terraform/personal/**) and pull_request (same
      paths) triggers removed by 7b67e21d; delete the TRIGGERS DISABLED parking comment. Restoring
      these is the PREREQUISITE for reconciliation, not a follow-on -- see context.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: >-
      Phase 1. Add a ONE-LINE pointer comment naming Decision 178 clause 4. Load-bearing role is as
      the path-filter carrier: both restored triggers filter on terraform/personal/**, so a
      workflows-only PR fires neither. Deliberately a pointer, not a change record (Decision 86 spirit
      flag; the record lives in the PR body and the Decision 178 annotation).
  - file: tests/test_terraform_drift_acceptance.py
    action: Modify
    purpose: >-
      Phases 1 and 2. Invert the two parked-shape pins into restored-shape assertions:
      test_apply_sandbox_workflow_is_workflow_dispatch_only ->
      test_apply_sandbox_workflow_triggers_are_restored (asserts push + pull_request + workflow_dispatch
      and the terraform/personal/** path filter on both), and
      test_drift_workflow_is_workflow_dispatch_only -> test_drift_workflow_cron_is_restored (asserts
      schedule cron '17 * * * *' + workflow_dispatch). Update both docstrings.
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      Phase 2. Restore schedule cron '17 * * * *'; delete the CRON DISABLED parking comment. Deferred
      to phase 2 so no tick can land between the phase 1 merge and the pending_gated stamp.
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Modify
    purpose: >-
      Phase 2. Remove the p2-glue-delete-database row (verb glue:DeleteDatabase, expected_decision
      allowed). The cleanse removed that grant from both the identity policy and the boundary but left
      the row, so after the phase 3 apply the mandated post-apply gate would report a mismatch.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      PHASE 1, and the structural half of the fix. INSERT a PRE-APPLY step INTO
      admin_out_of_band.procedure.steps immediately BEFORE the existing POST-APPLY simulate step
      (currently steps[5]) -- the list is ordered, so a pre-apply instruction appended after the
      post-apply one reads wrong. Phrased generically and token-free. Ships in phase 1 because the
      hazard is ALREADY LIVE and expires when phase 1 drains -- see context. Carries no
      terraform/personal/** path, so it does not disturb the path-filter design.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Create
    purpose: >-
      PHASE 1. Enforcement counterpart of the deploy-paths edit (AGENTS.md collocation rule). Asserts
      admin_out_of_band.procedure.steps carries a PRE-APPLY ordering step naming the grant-surface
      precondition, that the existing POST-APPLY simulate step survives, and that the pre-apply step
      precedes the post-apply one. Fails if any of the three is broken.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Phase 2. Append a dated annotation to Decision 178 recording clause 4 discharged, using the
      PINNED amendment_forms spelling "> **Update (DATE):**" as its OWN source-cited line. Never
      spliced into clause 4 (Decision 177 append-only dialect, retained as policy by Decision 178
      clause 3; its mechanical guard retired, so nothing catches a splice). NOT a new numbered entry
      (Decision 167 clause 4 routing).

bundled_recommendations: [rec-3294, rec-3295, rec-3296, rec-3297, rec-3299]

infrastructure_dependencies:
  - "terraform/personal destroy of 14 addresses -- guard exits 2 (destroy), routes to the tf-gated-apply GitHub Environment; a human reviewer approves before the apply runs."
  - "terraform/bootstrap apply (phase 3) -- admin tier, agent_platform_admin, ADMIN container; never auto-applied (terraform/bootstrap/CLAUDE.md). Agent presents the plan; human approves; agent applies (rec-3298 adjudication)."
  - "HARD ORDERING: phase 3 removes athena:*/glue:* from the apply role's boundary and identity policy -- the very grants phase 1's destroy consumes. Phase 3 must not run until phase 1 has fully drained."
  - "Regenerated gitignored terraform/bootstrap/terraform.bootstrap.tfvars (account_id, owner_email) for VP step 14, AND gitignored terraform/personal/terraform.personal.tfvars (the four no-default vars) for VP step 16. Neither is in a fresh clone; recover per terraform/CLAUDE.md's remote-state procedure. Never committed, never pasted into chat or a PR."
  - "ADMIN container preconditions for VP steps 13/16 (Decision 120): bin/setup-cloud-env.sh run with INSTALL_TERRAFORM=1, a non-empty tf-provider-mirror/ sync, and TF_CLI_CONFIG_FILE set -- without the synced mirror, local terraform init of terraform/personal fails on the third-party provider (Decision 119)."

acceptance_criteria:
  - "terraform-apply-sandbox.yml declares push (branches [main], paths terraform/personal/**), pull_request (paths terraform/personal/**) and workflow_dispatch; terraform-drift.yml declares schedule cron '17 * * * *' and workflow_dispatch."
  - "All 14 retired addresses are absent from terraform/personal state, destroyed via one human-approved tf-gated-apply run (never terraform state rm, never an unreviewed apply)."
  - "The sandbox convergence record is green with unapplied_backlog 0, no pending_gated marker and no infra_error marker, and rec-3294/3295/3296/3297/3299 are closed."
  - "docs/contracts/deploy-paths.yaml's admin_out_of_band.procedure carries a PRE-APPLY grant-surface ordering step, guarded by tests/test_deploy_paths_admin_procedure.py."
  - "After the phase 3 bootstrap apply, scripts.ci.iam_simulate exits 0 with zero mismatches, terraform plan -detailed-exitcode on terraform/personal exits 0, and one CI-identity plan cycle (dispatched terraform-drift.yml) completes clean."
  - ".github/workflows/terraform-apply-sandbox.yml stays within its registered 529 effective-line budget with no raise marker added."

verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Assert both workflows carry their restored triggers, via the inverted pins."
    command: "bin/venv-python -m pytest tests/test_terraform_drift_acceptance.py -q && grep -L 'TRIGGERS DISABLED' .github/workflows/terraform-apply-sandbox.yml && grep -L 'CRON DISABLED' .github/workflows/terraform-drift.yml"
    expected: "IN PHASE 1: all tests pass including test_apply_sandbox_workflow_triggers_are_restored (test_drift_workflow_cron_is_restored does not exist yet -- it lands in phase 2), and grep -L prints the apply-sandbox filename, proving its TRIGGERS DISABLED parking comment is gone. IN PHASE 2: all tests pass including test_drift_workflow_cron_is_restored, and both grep -L calls print their filename."
    fix_if: "A test failure means a trigger key or path filter is missing/misspelled. Note PyYAML resolves the bare `on` key to boolean True (YAML 1.1) -- the existing _triggers() helper already handles both spellings; reuse it, do not re-derive. A grep -L printing nothing means the parking comment survived: a restored trigger sitting under a comment asserting it is disabled is exactly the lying live surface Decision 178 condemns -- delete the comment."
    graduation: graduate
    graduation_check_id: tf-workflow-triggers-restored
  - step: 2
    phase: pre-deploy
    action: "Prove the inverted pins are red against the parked shape (they must fail without the workflow change, not merely pass with it)."
    command: "git stash push -- .github/workflows/terraform-apply-sandbox.yml .github/workflows/terraform-drift.yml; test $? -eq 0 || { echo 'STOP: stash failed, red half unproven'; exit 1; }; bin/venv-python -m pytest tests/test_terraform_drift_acceptance.py -q -k 'restored or cron_is_restored'; echo \"EXIT=$?\"; git stash pop"
    expected: "EXIT is non-zero (both inverted tests fail against the parked workflows), then the stash pop restores the change."
    fix_if: "EXIT=0 means the assertions do not actually discriminate the parked shape from the restored one -- tighten them to assert the trigger keys AND the path filters, not just key presence."
    graduation: waive
    graduation_waiver_reason: "Depends on this session's transient working-tree state (a stash round-trip of uncommitted edits); as a standing registry check it would have nothing to stash and would silently pass. The behaviour it proves is already graduated by step 1."
  - step: 3
    phase: pre-deploy
    action: "Assert the deploy-paths PRE-APPLY ordering step exists alongside the POST-APPLY simulate step."
    command: "bin/venv-python -m pytest tests/test_deploy_paths_admin_procedure.py -q"
    expected: "Pass: admin_out_of_band.procedure.steps contains both a PRE-APPLY grant-surface ordering step and the existing POST-APPLY simulate step."
    fix_if: "A failure means the contract edit was dropped or reworded past the assertion. Fix the contract, not the test -- the step is the enforcement surface a plan document cannot provide."
    graduation: graduate
    graduation_check_id: deploy-paths-preapply-ordering-step-present
  - step: 4
    phase: pre-deploy
    action: "Assert terraform-apply-sandbox.yml stays inside its registered structural budget after the trigger restoration."
    command: "bin/venv-python -c \"from scripts.checks.structural._classify import effective_lines; from pathlib import Path; n=effective_lines(Path('.github/workflows/terraform-apply-sandbox.yml').read_text(encoding='utf-8')); print(n); assert n <= 529, f'{n} > 529 budget'\""
    expected: "Prints a value <= 529 (measured 519 before the change; the restored trigger block is ~7 effective lines -> ~526)."
    fix_if: "Over 529: shrink the restored on: block to its minimal spelling. Do NOT raise the budget -- Decision 128 requires decomposition by default and Decision 165 requires an authorizing marker, which Decision 178 does not supply for structural-size entries."
    graduation: graduate
    graduation_check_id: apply-sandbox-effective-lines-within-budget
  - step: 5
    phase: pre-deploy
    action: "Assert the stale fixture row is gone and the fixture still passes its standing shape check."
    command: "bin/venv-python -c \"import yaml; d=yaml.safe_load(open('docs/contracts/iam-simulate-fixture.yaml')); ids=[r['id'] for r in d['triples']]; assert 'p2-glue-delete-database' not in ids, 'stale row still present'; print(len(ids))\" && bin/venv-python -c \"from scripts.checks.contracts.validate_iam_simulate_fixture_shape import validate_iam_simulate_fixture_shape as v; f=[]; v(f); assert not f, f\""
    expected: "Row absent; shape check passes (60 triples, one fewer than the 61 measured before the change)."
    fix_if: "If the triples key differs from the assumed name, read the fixture and adjust the accessor -- do not weaken the assertion to a substring grep."
    graduation: graduate
    graduation_check_id: iam-simulate-fixture-glue-row-absent
  - step: 6
    phase: pre-deploy
    action: "Assert the Decision 178 annotation landed as its own dated line and did NOT splice clause 4."
    command: "bin/venv-python -c \"import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); b=t.split('## Decision 178:')[1].split('\\n## Decision ')[0]; assert re.search(r'^> \\\\*\\\\*Update \\\\(', b, re.M), 'no dated Update annotation on Decision 178'; assert 'until an operator reconciles state' in b, 'clause 4 original wording was spliced/edited'; print('ok')\""
    expected: "Prints ok -- the annotation exists as its own line AND clause 4's original wording is byte-intact."
    fix_if: "A failure on the second assertion means clause 4 was edited in place. Revert that edit and re-add the content as a separate annotation line -- Decision 177's post-lock dialect retired the mid-line splice, and Decision 178 clause 3 retired the mechanical guard, so nothing else catches this."
    graduation: waive
    graduation_waiver_reason: "Asserts the body of one specific Decision entry at one point in time; as a standing registry check it would pin a snapshot of a single entry rather than guard a reusable behaviour. The general append-only dialect is Decision 177's concern, not this plan's."
  - step: 7
    phase: pre-deploy
    action: "Confirm the terraform/personal edit is comment-only and well-formed, without a provider-fetching init (Decision 119)."
    command: "command -v terraform >/dev/null && terraform fmt -check -recursive terraform/personal || echo 'terraform absent -- CI terraform-validate is authoritative'; git diff origin/main -- terraform/personal/main.tf | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -qvE '^[+-]\\s*#' ; echo \"NON_COMMENT_LINES_EXIT=$?\""
    expected: "NON_COMMENT_LINES_EXIT=1 (grep found no non-comment changed line), proving the edit adds no HCL. The fmt half runs only where the terraform binary exists: in the DEV container it is ABSENT (verified at planning time), so it prints the absent-notice and the required terraform-validate CI job is the authoritative fmt/validate verifier (Decision 119)."
    fix_if: "The two halves are deliberately decoupled with `;` rather than `&&` so a missing terraform binary cannot mask the diff assertion -- a chained `&&` would exit 127 and never print the value this step exists to check. NON_COMMENT_LINES_EXIT=0 means real HCL changed: that would alter the saved plan and is out of scope; revert it. If terraform IS present and fmt fails, run terraform fmt. Never author a local terraform init/validate/plan for this root in the routine flow (Decision 119) -- fmt -check is provider-free and is the only local terraform command permitted here."
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: "Full-tier validation before handoff (Decision 163)."
    command: "bin/venv-python -m scripts.validate"
    expected: "Exit 0, run to completion."
    fix_if: "Any failure blocks commit per handoff_policy. A timeout is dispositioned `blocked` -- resume later and rerun full from the start; do not partially accept."
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: "PHASE 1. On the PR, confirm the speculative-plan job actually RAN, then read its comment and confirm the plan is exactly the expected delta. FAIL CLOSED: absence of evidence is a STOP, never a pass."
    command: "gh pr checks --json name,state | grep -q speculative-plan || { echo 'STOP: speculative-plan job did not run'; exit 1; }; gh pr view --json comments --jq '.comments[].body' | grep -E 'to destroy|to add|to change' || { echo 'STOP: no speculative-plan comment found'; exit 1; }"
    expected: "The speculative-plan job appears in the PR's checks AND its comment reports 14 to destroy, 0 to add. A non-zero 'to change' count is EXPECTED and legitimate -- the same apply carries the cleanse's IAM policy UPDATEs in oidc.tf, oidc_ci_roles.tf, platform_roles.tf, prod_lambdas.tf and neon_ducklake_catalog.tf."
    fix_if: "Either STOP is a hard block on merging -- this is the only human review before an IRREVERSIBLE 14-resource destroy, so a missing comment must never be read as a clean plan. The comment is posted best-effort (gh pr comment ... || true) and the pull_request trigger it needs is introduced by THIS PR, so both misses are plausible. If the job did not run, the restored trigger or its path filter is wrong (phase 1 must touch terraform/personal/**). If the job ran but posted nothing, read the plan from the job log instead. If a create or replace appears, or the destroy count is not 14, STOP and diagnose: merge applies that saved plan.bin verbatim (Decision 77 no-TOCTOU)."
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: "PHASE 1 PREFLIGHT (ADMIN container), after step 9 and BEFORE the merge that dispatches the destroy. Prove the apply identity is authorized for every destroy verb the 14 addresses need, so an AccessDenied cannot half-run the apply and latch the record red."
    command: "bin/venv-python -m scripts.ci.iam_simulate --fixture /tmp/claude-scratch/destroy-preflight-fixture.yaml --profile agent_platform_admin"
    expected: "Exit 0, zero mismatches, covering the delete verb the provider issues for every one of the 14 addresses -- the IAM role and its role policy, the Lambda function and its permission, the CloudWatch log group, the two broker credential envelopes, the Glue database and the Athena workgroup."
    fix_if: "The fixture is a THROWAWAY written to the scratchpad, never committed -- it must declare principal.arn_template for agent-platform-github-ci-apply, since iam_simulate resolves the simulated identity from the fixture itself (scripts/ci/iam_simulate.py:138). A mismatch means the destroy would AccessDeny after human approval: stop, widen the grant in bootstrap HCL, and apply that through the phase 3 gate FIRST. Do not dispatch phase 1 on a mismatch."
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: "PHASE 1. After merge, confirm the guard routed and the gated-apply job is awaiting approval, then obtain the human approval and confirm the apply succeeded."
    command: "gh run list --workflow=terraform-apply-sandbox.yml --limit 1 --json databaseId,conclusion,status && gh run view --json jobs --jq '.jobs[] | {name, status, conclusion}'"
    expected: "apply-sandbox concludes success with routed=true; gated-apply enters status waiting; after the human approves in the tf-gated-apply Environment, gated-apply concludes success."
    fix_if: "If gated-apply shows skipped rather than waiting, the push trigger did not fire (the merge touched no terraform/personal/** path) -- that is the rec-3135 silent-success shape. If the apply fails and latches the record red, recovery is reconcile.yml (Decision 158 route (ii), gated-apply-reconcile behind the same Environment): a red record makes Reconcile reachable where the current green one does not. Never weaken the gate to get past this."
  - step: 12
    phase: post-deploy
    action: "PHASE 2/3 GATE. Read the convergence verdict through the sensor's own tested assessment, without triggering escalation. Run from an up-to-date main-tracking checkout, and assert the record's commit_sha directly rather than trusting a derived backlog of 0."
    command: "git fetch origin main --quiet && bin/venv-python -c \"import boto3, json, subprocess; from scripts.convergence_health.record import read_convergence_record; from scripts.convergence_health.assess import assess_health; s3=boto3.Session(profile_name='agent_platform').client('s3'); r=read_convergence_record(s3); v=assess_health(r); sha=r.get('commit_sha',''); anc=bool(sha) and subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main']).returncode==0; print(json.dumps({'status':v.status,'backlog':v.unapplied_backlog,'pending_gated':v.pending_gated,'infra_error':v.infra_error,'severity':v.severity,'record_sha':sha,'sha_is_ancestor_of_origin_main':anc})); assert v.status=='green' and v.unapplied_backlog==0 and v.pending_gated is None and v.infra_error is None and anc, 'GATE NOT SATISFIED'\""
    expected: "Exits 0, having printed status green, backlog 0, pending_gated null, infra_error null, severity none, and sha_is_ancestor_of_origin_main true. A non-zero exit is the gate refusing -- this step FAILS CLOSED, it does not merely report."
    fix_if: "count_unapplied_tf_commits FAILS OPEN -- its docstring states it 'Returns 0 on any error (record SHA may predate the current clone depth)' (scripts/convergence_health/record.py:101-108). From a stale checkout the git log errors and backlog 0 is returned vacuously, which is why ancestry is asserted explicitly: if sha_is_ancestor_of_origin_main is false the backlog figure is meaningless and the assert refuses. Ancestry is tested against the fetched origin/main REF -- never `git checkout origin/main`, which leaves a detached HEAD with no restore, and `never_on_main.py` keys on `git branch --show-current` (empty when detached), so a checkout here would silently disarm the never-edit-on-main hook for every later edit. Call assess_health directly as shown; do NOT run `python -m scripts.convergence_health`, which has no read-only mode and files a rec on every invocation (this is how rec-3299 came to exist). A non-clean verdict BLOCKS phases 2 and 3: heal the channel, never weaken the gate. The gate is deliberately stronger than minimal -- an unrelated red also blocks."
  - step: 13
    phase: post-deploy
    action: "PHASE 3 GATE (ADMIN container, immediately before the bootstrap apply to keep the TOCTOU window at minutes). Confirm all 14 addresses are gone from state."
    command: "terraform -chdir=terraform/personal init -backend-config=backend-sandbox.hcl -input=false && terraform -chdir=terraform/personal state list | grep -E 'aws_glue_catalog_database\\.ops|aws_athena_workgroup\\.production|null_resource\\.(create_ops_tables|create_ops_views|drop_ops_recommendations_view|drop_ops_decisions_view|drop_ops_priority_queue_view)|aws_cloudwatch_log_group\\.ops_compaction|aws_iam_role\\.ops_compaction|aws_iam_role_policy\\.ops_compaction|aws_lambda_function\\.ops_compaction|aws_lambda_permission\\.s3_invoke_ops_compaction|aws_secretsmanager_secret\\.alpaca_(paper|live)'; echo \"MATCH_EXIT=$?\""
    expected: "init succeeds, then MATCH_EXIT=1 (grep matched nothing -- every address is gone). This runs in ADMIN because PlatformDev is denied s3:GetObject on tfstate/personal/* by the DenyStateRead statement."
    fix_if: "The explicit init is REQUIRED and must not be dropped: terraform/personal/main.tf declares a PARTIAL S3 backend, so state list and plan both fail in a fresh ADMIN clone without -backend-config=backend-sandbox.hcl. init also needs the synced provider mirror (Decision 120 preconditions in infrastructure_dependencies) -- without it the third-party provider fetch 403s (Decision 119). Any grep match means phase 1 did not fully drain. STOP -- do not apply phase 3. Applying the grant narrowing while these resources remain in state is Decision 156 point 2's failure shape: every subsequent CD plan AccessDenies BEFORE the guard runs, including the reconcile path, locking the CD channel out of its own remedy."
  - step: 14
    phase: post-deploy
    action: "PHASE 3. Plan the bootstrap root, assert the apply role is not destroyed or replaced, present the plan to the human, and apply only on explicit approval."
    command: "terraform -chdir=terraform/bootstrap plan -var-file=terraform.bootstrap.tfvars -out=bootstrap.plan && terraform -chdir=terraform/bootstrap show -json bootstrap.plan | bin/venv-python -c \"import json,sys; p=json.load(sys.stdin); bad=[c['address'] for c in p.get('resource_changes',[]) if c['address'] in ('aws_iam_role.github_ci_apply','aws_iam_role_policy.github_ci_apply') and ('delete' in c['change']['actions'])]; assert not bad, f'STOP: destroy/replace on {bad}'; print('apply-role safe')\""
    expected: "Prints 'apply-role safe'; the plan shows IAM policy UPDATES only and zero resource removals. Present the plan output; the human approves or requests adjustments; then apply."
    fix_if: "A destroy/replace on the apply role is the module's own STOP condition (terraform/bootstrap/CLAUDE.md) -- it would break every in-flight CI job. Do not apply. Regenerate the gitignored tfvars (account_id, owner_email) if absent; never commit it and never paste its values into chat or a PR. Agent-executed apply after human plan approval is the adjudicated semantics -- see rec-3298."
  - step: 15
    phase: post-deploy
    action: "PHASE 3 EXIT (a). Run the contract-mandated post-apply grant-surface gate."
    command: "bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml"
    expected: "Exit 0, zero mismatches."
    fix_if: "A mismatch on a newly granted verb is a wrong boundary ceiling or resource scope -- fix in HCL and re-apply through the same human gate. A mismatch on a by_design denial is a GRANT LEAK, i.e. a security regression, not a fixture error."
  - step: 16
    phase: post-deploy
    action: "PHASE 3 EXIT (b). Verify global convergence locally (Decision 98 point 4(c))."
    command: "terraform -chdir=terraform/personal init -backend-config=backend-sandbox.hcl -input=false && terraform -chdir=terraform/personal plan -detailed-exitcode -var-file=terraform.personal.tfvars; echo \"EXIT=$?\""
    expected: "EXIT=0 (no changes)."
    fix_if: "The explicit init is required for the same partial-backend reason as step 13 (idempotent to re-run). EXIT=2 means a residual delta; EXIT=1 is an error. Neither is acceptable as a completion state -- diagnose before declaring phase 3 done. NOTE this plan runs under agent_platform_admin and therefore CANNOT exercise the CI roles' refresh surface, which is where the Decision 156 lockout actually lives -- steps 17 and 18 exist precisely to cover that gap and are not optional."
  - step: 17
    phase: post-deploy
    action: "PHASE 3 EXIT (c), part 1 of 2. Record a run-id high-water mark and dispatch one drift cycle under the CI identity -- the identity where the Decision 156 lockout actually lives, which step 16's admin-profile plan structurally cannot exercise. Then END THE TURN."
    command: "mkdir -p /tmp/claude-scratch && gh run list --workflow=terraform-drift.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0' > /tmp/claude-scratch/drift-highwater.txt && gh workflow run terraform-drift.yml && echo \"DISPATCHED; high-water=$(cat /tmp/claude-scratch/drift-highwater.txt) -- end the turn, assert in step 18\""
    expected: "A high-water run id is captured BEFORE the dispatch, and the dispatch is accepted."
    fix_if: "The high-water mark is mandatory. By phase 3 the hourly cron is restored, so recent completed drift runs always exist and `gh run list --limit 1` immediately after a dispatch commonly returns the PREVIOUS run -- GitHub takes seconds to register a dispatch. Asserting against that stale run is a false pass. Do NOT poll or sleep here (AGENTS.md forbids busy-waiting): dispatch, end the turn, and let step 18 assert on the next wake."
  - step: 18
    phase: post-deploy
    action: "PHASE 3 EXIT (c), part 2 of 2, on a later turn. Assert the DISPATCHED run -- not a stale cron run -- completed successfully AND left the convergence record green."
    command: "HW=$(cat /tmp/claude-scratch/drift-highwater.txt); ID=$(gh run list --workflow=terraform-drift.yml --event workflow_dispatch --limit 5 --json databaseId --jq \"[.[].databaseId | select(. > $HW)] | max // empty\"); test -n \"$ID\" || { echo 'STOP: dispatched run not registered/finished yet -- end the turn and re-check on the next wake'; exit 1; }; gh run view \"$ID\" --json status,conclusion --jq '\"\\(.status) \\(.conclusion)\"' | grep -qx 'completed success' || { echo 'STOP: drift run not completed-success'; exit 1; }; bin/venv-python -c \"import boto3; from scripts.convergence_health.record import read_convergence_record; from scripts.convergence_health.assess import assess_health; s3=boto3.Session(profile_name='agent_platform').client('s3'); v=assess_health(read_convergence_record(s3)); assert v.status=='green' and v.pending_gated is None, f'drift flipped the record: {v.status}'; print('CI-identity cycle clean')\""
    expected: "The dispatched run id exceeds the high-water mark, concludes completed/success, and the convergence record is STILL green -- proving the planner role can refresh-read every managed resource under the narrowed grant surface."
    fix_if: "Run conclusion ALONE is not sufficient evidence and must never be the only assertion: terraform-drift.yml exits 0 on PLAN_EC==2 (:274-276), so a drift-DETECTING run also concludes success. The record check is what distinguishes them -- ec=2 flips the record red via the Handle drift step. The AccessDenied case IS caught by conclusion alone (:286-288 exits 1) and is the lockout arriving: the narrowing removed a refresh-read the CI roles still need -- re-widen that specific grant in bootstrap HCL and re-apply through the phase 3 human gate. Do not leave the channel in this state. Note the restored cron also covers this window, so a lockout self-alarms by reding the record, which is what makes reconcile.yml reachable; treat such tf_drift recs as the alarm working, not a regression."
  - step: 19
    phase: post-deploy
    action: "Confirm the bundled staleness recs closed once the backlog drained."
    command: "bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c \"import json; rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl')]; cur={}; [cur.__setitem__(r['id'], r) for r in rows]; open_ids=[i for i in ('rec-3294','rec-3295','rec-3296','rec-3297','rec-3299') if cur.get(i,{}).get('status')=='open']; print('still open:', open_ids); assert not open_ids\""
    expected: "still open: [] -- all five auto-closed on the sensor tick after the backlog drained."
    fix_if: "If any remain open after a full sensor cycle, close them via the Resolves: trailer or an explicit update_rec call. Never edit logs/.recommendations-log.jsonl directly -- it is a read cache, never a write source."

