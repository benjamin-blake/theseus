    action: end-to-end fail-closed preflight against an unreachable reader (real preflight, forced URL)
    command: |-
      DUCKLAKE_READER_URL=https://127.0.0.1:9 bin/venv-python -m scripts.session.preflight >/dev/null 2>&1; bin/venv-python -c "
      import json
      d = json.load(open('logs/.preflight-report.json'))
      assert d['recs_read_status'] != 'ok', d['recs_read_status']
      assert d['ci_rca_unresolved_recs'] is None, d['ci_rca_unresolved_recs']
      print('FAIL_CLOSED_OK', d['recs_read_status'])
      "
    expected: prints FAIL_CLOSED_OK with recs_read_status reader_unreachable
    fix_if: the report shows [] (the false-zero) or ok
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: fast-tier presubmit
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0 (SLOC, prose budgets, read-engine roster, plan documents, contract amendments all green)
    fix_if: a budget or roster failure -- decompose or trim; never raise a budget without the Decision marker
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: the governed deploy shipped the v4 registry (describe lists the new verbs and not rec_by_id)
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import DuckLakeReader as R; v = R().describe();
      assert {'recs_by_ids', 'recs_for_files', 'open_recs_tally', 'preflight_signal_rows'} <= set(v) and 'rec_by_id' not in v, sorted(v);
      print('VERBS_OK', len(v))"
    expected: prints VERBS_OK (deploy-ducklake-lambdas.yml ran on the merge push)
    fix_if: the old registry is live -- confirm the governed workflow ran for the merge sha (Decision 126), never a local deploy
    hermetic: false
  - step: 15
    phase: post-deploy
    action: live typed 413 on the unfiltered recs read, one attempt
    command: |-
      bin/venv-python -c "
      import time
      from src.common.ducklake_reader_client import DuckLakeReader, ResponseTooLargeError
      t = time.time()
      try:
          DuckLakeReader().current_state('ops_recommendations')
      except ResponseTooLargeError as exc:
          print('TYPED_413', exc.status, round(time.time() - t, 1))
      else:
          raise SystemExit('unfiltered recs read did not overflow the cap')
      "
    expected: prints TYPED_413 413 with an elapsed time of a single invocation (no retry backoff)
    fix_if: a 502 or a retried call -- the handler guard or the client mapping did not deploy
    hermetic: false
  - step: 16
    phase: post-deploy
    action: live preflight serves recs signals from at most three bounded calls, with counts matching the warehouse
    command: |-
      bin/venv-python -m scripts.session.preflight >/dev/null 2>&1; bin/venv-python -c "
      import json
      from src.common.ducklake_reader_client import DuckLakeReader
      d = json.load(open('logs/.preflight-report.json'))
      assert d['recs_read_status'] == 'ok', d['recs_read_status']
      assert isinstance(d['ci_rca_unresolved_recs'], list)
      rr = d['recs_read']
      assert rr['calls'] <= 3, rr
      assert rr['bytes']['preflight_signal_rows'] < 1500000, rr
      live = {r['status']: r['n'] for r in DuckLakeReader().named('count_by_status')}['open']
      assert abs(d['open_recommendations'] - live) <= 2, (d['open_recommendations'], live)
      print('PREFLIGHT_OK', rr)
      "
    expected: prints PREFLIGHT_OK with calls <= 3 and the signal-rows byte count
    fix_if: unavailable on a healthy reader, more than three calls, or a count mismatch
    hermetic: false
  - step: 17
    phase: post-deploy
    action: bundled recs closed by the trailer-closure job (Closure Obligation), read through recs_by_ids
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import DuckLakeReader as R;
      rows, missing = R().recs_by_ids(['rec-4232', 'rec-2863', 'rec-2639']);
      st = {r['id']: r['status'] for r in rows}; assert not missing and set(st.values()) == {'closed'}, (st, missing);
      print('CLOSED_OK', st)"
    expected: prints CLOSED_OK with all three closed
    fix_if: a rec left open -- act only on the trailer-closure job's own log per implement.md Step 7's post-merge closeout fallback
    hermetic: false
