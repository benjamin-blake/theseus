execution_steps:
  - >-
    Reader: implement the handler response-size guard and tests/test_ducklake_reader_response_cap.py
    (step 1). Client: ResponseTooLargeError, recs_by_ids(), VERB_FIELDS and pin 4 (step 2).
  - >-
    Registry: NAMED_READS v4 per the scope purpose -- remove rec_by_id, add recs_by_ids,
    recs_for_files, open_recs_tally (predicates copied from _count_recommendations_reader) and
    preflight_signal_rows (PREFLIGHT_SIGNAL_SOURCES constant); update the parity tests (steps 3-4),
    ducklake_reader.yaml and read-engine.yaml.
  - >-
    Re-point every rec_by_id call site and test fake to recs_by_ids (write_validators,
    sensor_liveness, budget_ingest as one batch call, reconcile_target, ops_data_portal,
    rec_trailer_acceptance census, MCP server note, episode-lookup docstring, DQ/source-registry
    text).
  - >-
    Preflight: create scripts/preflight/recs_signals_source.py; wire scripts/session/preflight.py to
    it; recs_cache/ci_rca_signals/alerts/ci_rca_gauges/context_docs/probe_health per scope (None
    never []; acceptance and uncapped total on ci_rca entries; recs_read report block; budget_breach
    fallback removed). Keep near-cap files net-zero SLOC (steps 5, 6).
  - >-
    Retire the producers: sync/ops.py drops recs and deletes a stale file; ops_data_portal.py drops
    the two recs cache refreshes; trailer close, cost reconciliation and back-validate read verbs;
    the two registered checks declare skipped() (steps 7, 8).
  - >-
    Agent surfaces: planning SKILL.md, plan.md, implement SKILL.md, plan-critique SKILL.md, orient
    SKILL.md and orient.md, recommendation-relevance.yaml -- read via recs_by_ids / recs_for_files /
    the preflight report; planning SKILL.md keeps the `scripts.sync.ops sync` sentence and the CD.10
    interim marker (step 11). Measure bytes before and after each prose surface.
  - >-
    Decision (DECISIONS.md, next free number): title along the lines of "The full local
    recommendations cache is retired; completeness reads are bounded server-side verbs that fail
    closed, relevance reads are search verbs (amends Decision 88 and Decision 103)". Envelope:
    amends [88, 103], significance numbered_decision with the rejected-alternative clause
    (contract note / amendment_forms cannot carry a replaced invariant across two entries;
    Decision 214 precedent). Clauses: (1) no full-table ops_recommendations pull on any application
    path, logs/.recommendations-log.jsonl is no longer produced and sync removes a stale copy;
    (2) completeness reads are bounded named verbs complete by construction or disclosing
    complete/total, a missing signal is null/unavailable, never [], and an unavailable CI-RCA
    signal blocks plan commitment unless the human overrides; (3) relevance reads are lookup/search
    verbs (interim recs_for_files; graph-aware ranking rec-4235); bulk export, if any, is a claim
    check outside the response body (rec-4237); (4) replaces 88 cl.1(ii) for ops_recommendations --
    preflight makes at most three bounded recs calls per session and reports per-call bytes and
    call count (recs_read); (5) replaces 103's warmed-read-cache clause -- relevance gates read
    named verbs, one call per batch; (6) the reader returns a typed 413 response_too_large, never
    retried; (7) rec_by_id is consolidated into recs_by_ids. Coverage line (Decision 181): enforced
    by steps 1-12; residuals rec-4235 (cache-reference CI ban, open_recs verb), rec-4236 (executor
    and other residual readers), rec-4237 (export, schema scan). reversal-conditions block:
    preflight_signal_rows response above 3,000,000 bytes (move the arithmetic server-side);
    reader calls or egress per preflight materially above the pre-incident warm-sync baseline; a
    streaming or claim-check transport makes a full pull cheap and safe; more than three
    fail-closed planning blocks caused by reader outages in 30 days. If a prose budget raise is
    unavoidable, this Decision names the surface and the bounded delta. Then add dated
    annotations to Decision 88 cl.1(ii) and Decision 103 in amendment_forms grammar. At or under
    6,144 bytes.
  - >-
    AGENTS.md (byte-neutral), PROJECT_CONTEXT.md, ROADMAP-PLATFORM.yaml progress_notes (T2.19 c9,
    T1.5, T0.7c), log-storage.yaml, exit-criteria-ledger.yaml, check-accounting.yaml; prose_budgets.yaml
    only if forced.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - >-
    Post-merge: the governed deploy runs on the merge push; run steps 14-17. If rec-2639 or rec-2863
    stays open because its acceptance literal no longer fits, act only on the trailer-closure job's
    log per implement.md Step 7.
