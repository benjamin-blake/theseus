  - file: scripts/preflight/context_docs.py
    action: Modify
    purpose: recommendations_count from open_recs_tally instead of len(named("open_recs")) (which ships every open rec's context to count it)
  - file: scripts/preflight/_common.py
    action: Modify
    purpose: >-
      delete RECOMMENDATIONS_FILE (its only reader, recs_cache.count_recommendations, is deleted);
