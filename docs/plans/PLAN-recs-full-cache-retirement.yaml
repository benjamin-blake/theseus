      budget_breach_recent is deleted -- budget_breach rows arrive in signal_rows.
  - file: scripts/preflight/ci_rca_gauges.py
    action: Modify
    purpose: >-
      None-propagation for every gauge; --assert-dedup-clear reads signal_rows via
      fetch_recs_signal_inputs instead of RECS_JSONL and exits 1 when unavailable (never a
