schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "recs-full-cache-retirement"
intent: >-
  Retire the full local recommendations cache (rec-4232, Critical): the full ops_recommendations
  pull now exceeds the Lambda 6 MB synchronous response cap, so every sync fails and preflight
  silently degrades its CI-RCA hard block to an empty list. Completeness-critical reads move to
  bounded, server-side named verbs that fail closed; the reader returns a typed 413 instead of an
  opaque 502; every consumer of the cache is moved to a verb, made loud, or named as an owned
  residual; and a new Decision replaces Decision 88 cl.1(ii) and Decision 103's cache clause so the
  methodology stops promising agents a complete local copy of the warehouse.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-recs-full-cache-retirement.yaml
phase: >-
  ad_hoc_rec (rec-4232, Critical; soft-warn category, no tier_item claimed, so the Tier Item
  Freshness Gate is skipped). T2.19 c9, T1.5 c1 and T0.7c receive progress_notes only.
scope:
  # --- reader boundary -------------------------------------------------------------------------
  - file: src/lambdas/ducklake_reader/handler.py
    action: Modify
    purpose: >-
      Response-size guard on EVERY action (rec-4232): _handle builds the response dict, measures
      len(json.dumps(response).encode("utf-8")) -- the whole Function-URL envelope, since the body
      string is JSON-escaped again inside it -- and above MAX_RESPONSE_BYTES = 6_000_000 (headroom
      under the runtime's 6,291,556-byte RequestEntityTooLarge cap) returns HTTP 413 with body
      {ok: false, error_type: "response_too_large", action, bytes, cap, hint} where hint names
      "a narrower named verb, or the claim-check export (rec-4237)". The 413 path is logged through
      the existing single log_invocation line (status 413). No other dispatch change.
  - file: src/common/ducklake_named_reads.py
    action: Modify
    purpose: >-
      NAMED_READS_VERSION 3 -> 4. REMOVE rec_by_id (consolidated, owner direction 2026-10-09).
      ADD four ops_recommendations verbs, all fixed SQL with string binds (Decision 84 I-3):
      (1) recs_by_ids(ids) -- SELECT * WHERE list_contains(string_split(?, ','), id) ORDER BY id;
      one id or a comma-joined list; replaces rec_by_id for every caller. (2) recs_for_files(files)
      -- the INTERIM direct-hit relevance read: id, title, status, priority, effort, source, file,
      tags, created_timestamp for status = 'open' AND file in the comma-joined list, ORDER BY id
      (the graph-aware ranking that builds on it is rec-4235). (3) open_recs_tally() -- one row:
      open_count, aging_count, non_automatable_count over status = 'open', with predicates that
      mirror recs_cache._count_recommendations_reader's current derivation exactly (aging
      threshold and non-automatable test read from that function at implement time, never
      re-invented). (4) preflight_signal_rows() -- the bounded preflight read model: id, title,
      status, source, priority, file, automatable, acceptance, context, context_v2_json,
      created_timestamp, last_updated_timestamp WHERE source IN PREFLIGHT_SIGNAL_SOURCES OR
      (status = 'open' AND lower(priority) = 'critical') ORDER BY id. PREFLIGHT_SIGNAL_SOURCES is a
      module-level tuple (ci_rca, ci_rca_evidence_dispute, ci_rca_probe_health, tf_drift,
      budget_bypass, budget_breach) rendered into the SQL at import-free call time -- the single
      definition the preflight derivations' source literals are tested against. Measured live
      2026-10-09 without acceptance: 333 rows, 973,246 JSON bytes. open_recs is RETAINED
      unchanged (no preflight caller after this plan; its fate is rec-4235's call).
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      VERB_FIELDS: drop rec_by_id, add the four verbs (recs_by_ids -> ALL_TABLE_COLUMNS; the others
      their declared projections); _NAMED_READS_VERSION_PIN 4. New ResponseTooLargeError(ReaderInvokeError)
      raised by _invoke on HTTP 413 carrying bytes/cap from the typed body; 413 stays OUTSIDE
      _READER_TRANSIENT_STATUS {502, 503, 504} so it is never retried (Decision 155 cl.2).
      New DuckLakeReader.recs_by_ids(ids) -> (rows, missing): strips, de-duplicates, refuses more
      than 50 ids (ValueError), joins with ',' and returns the requested ids that did not resolve.
      This file also ships in the data-pipeline artifact (Decision 79 disposition: no deploy -- the
      change is additive for its callers, ResponseTooLargeError subclasses ReaderInvokeError so
      existing except clauses still catch it, and deploy-prod-lambdas.yml excludes src/common).
  - file: docs/contracts/ducklake_reader.yaml
    action: Modify
    purpose: >-
      Every verb's response_codes gain 413 "response_too_large"; typed_errors gain
      response_too_large; the audit invariant claiming all reader errors are 500-coded is restated
      to name the one 4xx (a size outcome, not client input). amendment_log entry: field_add,
      semantic_break false.
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      Verb roster matches the v4 registry (validate_read_engine_verbs): rec_by_id removed;
      recs_by_ids, recs_for_files, open_recs_tally, preflight_signal_rows added; the
      fetch-before-update line names recs_by_ids. amendment_log entry if the contract carries one.
  # --- preflight (completeness reads, fail closed) -----------------------------------------------
  - file: scripts/preflight/recs_signals_source.py
    action: Create
    purpose: >-
      fetch_recs_signal_inputs(reader=None, followon_ids=()) -> RecsSignalInputs: at most THREE
      reader calls -- open_recs_tally, preflight_signal_rows, and recs_by_ids(followon_ids) only
      when followon_ids is non-empty. Returns tally, signal_rows, followon_rows, status
      ("ok" | "unavailable"), error, and a recs_read record {calls, bytes: {verb: response bytes}}.
      ANY reader exception (ReaderInvokeError incl. ResponseTooLargeError, connection error,
      URL-resolution RuntimeError) yields status "unavailable" with every row field None --
      never an empty list (Decision 55). Lives in its own module so ci_rca_signals.py (497/500
      SLOC) does not grow.
