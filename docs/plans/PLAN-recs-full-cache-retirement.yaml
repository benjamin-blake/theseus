execution_steps:
  - >-
    Reader: implement the handler response-size guard and tests/test_ducklake_reader_response_cap.py
    (step 1). Client: ResponseTooLargeError, fetch_recs_by_ids, VERB_FIELDS and pin 4 (step 2).
  - >-
    Registry: NAMED_READS v4 per the scope purpose -- agent_facing field (outside read_version),
    rec_by_id kept and marked deprecated, open_recs not agent-facing, and recs_by_ids, recs_for_files,
    open_recs_tally (predicates copied from _count_recommendations_reader) and
    preflight_signal_rows(followon_ids) with the PREFLIGHT_SIGNAL_SOURCES constant and the
    heavy-column rule; confirm every derivation that reads acceptance/context/context_v2_json does so
    only on rows the rule populates (widen the 30-day window if one reads further back). Update the
    parity tests (steps 3-4), ducklake_reader.yaml, read-engine.yaml and the MCP projection (step 9).
  - >-
    Preflight: create scripts/preflight/recs_signals_source.py; wire scripts/session/preflight.py to
    it; summary, recs_cache, _common, ci_rca_signals, alerts, ci_rca_gauges, context_docs,
    correlation and probe_health per scope (None never []; no false liveness alert; acceptance and
    uncapped total on ci_rca entries; recs_read block; budget_breach fallback removed). Keep
    near-cap files net-zero SLOC (steps 5, 6, 9).
  - >-
    Retire the producers: sync/ops.py drops recs and both sync paths delete a stale file;
    ops_data_portal.py drops the two recs cache refreshes and refuses recs in sync(); trailer close
    (rec_by_id per id), cost reconciliation and back-validate read live rows; the two registered
    checks declare skipped(); re-point the ops_data_portal write-through tests to _ducklake_write call
    args (steps 7, 8).
  - >-
    Agent surfaces: planning SKILL.md, plan.md, implement SKILL.md, plan-critique SKILL.md, orient
    SKILL.md and orient.md, recommendation-relevance.yaml -- read via recs_by_ids / recs_for_files /
    the preflight report; planning SKILL.md keeps the `scripts.sync.ops sync` sentence and the CD.10
    interim marker and supersedes the creds-unavailable "Do NOT block" for the CI-RCA signal
    (step 12). Measure bytes before and after each prose surface.
  - >-
    Decision (DECISIONS.md, next free number), title beginning "The full local recommendations cache
    is retired". Envelope: amends [88, 103], significance numbered_decision whose justification names
    the rejected alternative (a contract note or amendment_forms annotation cannot carry a replaced
    invariant across two entries; Decision 214 precedent). Clauses: (1) no full-table
    ops_recommendations pull on any application path; logs/.recommendations-log.jsonl is no longer
    produced and both sync paths remove a stale copy. Rejected: prioritised truncation (Decision 55's
    false zero with a better order) and keyset pagination of the full table (it rebuilds the same
    complete local copy, loads agent context, and pays per-query egress on every page). (2)
    completeness reads are bounded named verbs, complete by construction or disclosing
    complete/total; a missing signal is null/unavailable, never []; an unavailable CI-RCA signal
    blocks plan commitment unless the human overrides, including when credentials are unavailable.
    (3) relevance reads are lookup/search verbs (interim recs_for_files; graph-aware ranking
    rec-4235); bulk export, if any, is a claim check outside the response body (rec-4237); verbs that
    are not agent tools declare agent_facing false. (4) replaces 88 cl.1(ii) for ops_recommendations:
    preflight makes exactly two bounded recs calls per session and reports call count and re-serialised
    row bytes (recs_read). (5) replaces 103's warmed-read-cache clause: relevance gates read named
    verbs, one call per batch. (6) the reader returns a typed 413 response_too_large, never retried.
    (7) rec_by_id is deprecated in favour of recs_by_ids and removed by rec-4240 once this plan's
    deploy is verified. Coverage line (Decision 181): enforced by plan steps 1-14; residuals rec-4235
    (cache-reference CI ban, open_recs fate), rec-4236 (executor, validate_executor_boundary and other
    residual readers), rec-4237 (export, schema scan), rec-4240 (rec_by_id removal); the probe-health
    and dedup recs close only through their escalation's own close path. reversal-conditions block:
    preflight_signal_rows re-serialised bytes above 3,000,000 (move the arithmetic server-side);
    more than six reader invocations per preflight session in total (the pre-incident baseline was
    four full-table pulls); a streaming or claim-check transport that makes a full pull cheap and
    safe; more than three fail-closed planning blocks caused by reader outages in 30 days. If a prose
    budget raise is unavoidable, name the surface and the bounded delta here. Then add dated
    annotations to Decision 88 cl.1(ii) and Decision 103 in amendment_forms grammar. At or under
    6,144 bytes (step 13).
  - >-
    AGENTS.md (byte-neutral), PROJECT_CONTEXT.md, ROADMAP-PLATFORM.yaml progress_note additions
    (T2.19, T1.5, T0.7c), log-storage.yaml, exit-criteria-ledger.yaml, check-accounting.yaml;
    prose_budgets.yaml only if forced.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - >-
    Post-merge: the governed deploy runs on the merge push; run steps 17-21. If rec-2639 or rec-2863
    stays open, act only on the trailer-closure job's log per implement.md Step 7.
  - "Report: what was implemented, verification results, measured preflight calls and bytes"
rollback: >-
  Revert the merge commit; the governed deploy workflow re-ships the v3 registry and the guard-free
  handler on the revert push. Nothing is lost: rec_by_id was never removed, and the retired cache was
  a derivative projection that nothing writes upstream from.
