      from src.common.ducklake_reader_client import DuckLakeReader, ResponseTooLargeError
      t = time.time()
      try:
          DuckLakeReader().current_state('ops_recommendations')
      except ResponseTooLargeError as exc:
          print('TYPED_413', exc.status, round(time.time() - t, 1))
