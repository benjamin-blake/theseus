schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "recs-full-cache-retirement"
intent: >-
  Retire the full local recommendations cache (rec-4232, Critical): the full ops_recommendations
  pull now exceeds the Lambda 6 MB synchronous response cap, so every sync fails and preflight
  silently degrades its CI-RCA hard block to an empty list. Completeness-critical reads move to
  bounded, server-side named verbs that fail closed; the reader returns a typed 413 instead of an
  opaque 502; every consumer of the cache is moved to a verb, made loud, or named as an owned
  residual; and a new Decision replaces Decision 88 cl.1(ii) and Decision 103's cache clause so the
  methodology stops promising agents a complete local copy of the warehouse. This is the EXPAND
  half of the rec_by_id -> recs_by_ids consolidation; the contract half is rec-4240.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-recs-full-cache-retirement.yaml
phase: >-
  ad_hoc_rec (rec-4232, Critical; soft-warn category, no tier_item claimed, so the Tier Item
  Freshness Gate is skipped). T2.19, T1.5 and T0.7c receive progress_note additions only.
scope:
  # --- reader boundary -------------------------------------------------------------------------
  - file: src/lambdas/ducklake_reader/handler.py
    action: Modify
    purpose: >-
      Response-size guard on EVERY action (rec-4232): _handle builds the response dict, measures
      len(json.dumps(response).encode("utf-8")) -- the whole Function-URL envelope, since the body
      string is JSON-escaped again inside it -- and above MAX_RESPONSE_BYTES = 6_000_000 (headroom
      under the runtime's 6,291,556-byte RequestEntityTooLarge cap) returns HTTP 413 with body
      {ok: false, error_type: "response_too_large", action, bytes, cap, hint} where hint names
      "a narrower named verb, or the claim-check export (rec-4237)". The 413 path is logged through
      the existing single log_invocation line (status 413). No other dispatch change.
  - file: src/common/ducklake_named_reads.py
    action: Modify
    purpose: >-
      NAMED_READS_VERSION 3 -> 4 (EXPAND only: no verb is removed). NamedRead gains
      agent_facing: bool = True, surfaced by describe_named_reads and EXCLUDED from read_version's
      definition (no existing verb re-versions). rec_by_id stays registered, its description
      marked "deprecated: use recs_by_ids (removal rec-4240)". open_recs gets agent_facing=False
      (about 1.9 MB of open-rec text is not an agent tool). ADD four ops_recommendations verbs,
      fixed SQL with string binds (Decision 84 I-3): (1) recs_by_ids(ids) -- SELECT * WHERE
      list_contains(string_split(?, ','), id) ORDER BY id; one id or a comma-joined list.
      (2) recs_for_files(files) -- the INTERIM direct-hit relevance read: id, title, status,
      priority, effort, source, file, tags, created_timestamp for status = 'open' AND file in the
      comma-joined list, ORDER BY id (graph-aware ranking builds on it in rec-4235).
      (3) open_recs_tally() -- one row: open_count, aging_count, non_automatable_count over
      status = 'open', predicates copied from recs_cache._count_recommendations_reader's current
      derivation (never re-invented). (4) preflight_signal_rows(followon_ids), agent_facing=False --
      the bounded preflight read model. Rows: source IN PREFLIGHT_SIGNAL_SOURCES, OR (status =
      'open' AND lower(priority) = 'critical'), OR (status = 'open' AND id in the comma-joined
      followon_ids; an empty string matches nothing). Columns: id, title, status, source, priority,
      file, automatable, created_timestamp, last_updated_timestamp always; acceptance, context and
      context_v2_json ONLY on rows that are open-critical, or are signal-source rows that are open,
      in_progress or created within the last 30 days (NULL otherwise) -- so all-time closed ci_rca
      rows stay narrow. PREFLIGHT_SIGNAL_SOURCES is one module-level tuple (ci_rca,
      ci_rca_evidence_dispute, ci_rca_probe_health, tf_drift, budget_bypass, budget_breach) that the
      derivations' source literals are tested against. Measured live 2026-10-09 with this shape:
      333 signal rows, 316,799 JSON bytes; plus 192 open follow-on rows of the 217 landed follow-on
      ids, 45,357 bytes narrow.
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      VERB_FIELDS gains the four verbs (recs_by_ids -> ALL_TABLE_COLUMNS; others their declared
      projections); rec_by_id kept; _NAMED_READS_VERSION_PIN 4. New
      ResponseTooLargeError(ReaderInvokeError) raised by _invoke on HTTP 413 with bytes/cap from the
      typed body; 413 stays OUTSIDE _READER_TRANSIENT_STATUS {502, 503, 504}, so it is never retried
      (Decision 155 cl.2). New MODULE-LEVEL helper fetch_recs_by_ids(reader, ids) -> (rows, missing)
      that calls reader.named("recs_by_ids", ids=...) -- it stays on the registered ops_verbs port
      verb `named` (Decision 212; no new adapter method) -- stripping, de-duplicating, refusing more
      than 50 ids with ValueError, and returning the requested ids that did not resolve. Bundled in
      the data-pipeline artifact: harmless there (its handlers call only current_state; the
      VERB_FIELDS/pin change and the new error subclass touch no path it runs), so no deploy
      (Decision 79; deploy-prod-lambdas.yml excludes src/common).
