acceptance_criteria:
  - >-
    An unfiltered read of ops_recommendations through the deployed reader returns HTTP 413
    response_too_large (bytes and cap in the body) within one attempt, never a 502 and never a
    client retry.
  - >-
    Session preflight on the deployed reader reports recs_read_status ok, makes at most three
    ops_recommendations reader calls (recs_read.calls), serves open counts from open_recs_tally
    (equal to count_by_status's open count, allowing a concurrent write), and the
    preflight_signal_rows response stays under 1,500,000 bytes.
  - >-
    With the reader unreachable, preflight reports recs_read_status reader_unreachable and JSON
    null (never []) for ci_rca_unresolved_recs and every other completeness list, and the planning
    skill treats that as a hard block at commitment unless the human overrides.
  - >-
    No full-table ops_recommendations pull remains: sync and warm_sync skip the table, file_rec and
    update_rec never write logs/.recommendations-log.jsonl, sync deletes a stale copy, and the
    trailer closure, cost reconciliation, back-validate, assert-clear probes and relevance gates
    read named verbs (or fail loudly) instead of the file.
  - >-
    rec_by_id no longer exists in the registry, the client, the MCP tool list or any application
    call site; recs_by_ids serves one id or up to 50 and reports missing ids.
  - >-
    The new numbered Decision is merged with amends [88, 103], a Decision 181 coverage line naming
    rec-4235 / rec-4236 / rec-4237 as residual owners, reversal conditions, and dated annotations
    on Decisions 88 and 103.
  - rec-4232, rec-2863 and rec-2639 close on merge through their acceptance commands.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: prove the handler refuses an oversized response with a typed 413 (rec-4232's own acceptance node)
    command: bin/venv-python -m pytest "tests/test_ducklake_reader_response_cap.py::TestReadOpsCurrentResponseCap" -q
    expected: all tests in the class pass
    fix_if: the guard measures the body instead of the whole envelope, or an in-cap response changes shape
    hermetic: true
    graduation: graduate
    graduation_check_id: reader-response-cap-typed-413
    expected_literals: ["passed"]
  - step: 2
    phase: pre-deploy
    action: prove the client maps 413 to ResponseTooLargeError without retrying, and recs_by_ids normalises, caps and reports missing ids
    command: bin/venv-python -m pytest "tests/common/ducklake_reader_client/test_response_too_large.py::TestResponseTooLargeNotRetried" -q
    expected: all tests in the class pass; exactly one POST per oversized call
    fix_if: 413 lands in _READER_TRANSIENT_STATUS or the error is a bare ReaderInvokeError
    hermetic: true
    graduation: graduate
    graduation_check_id: reader-client-413-not-retried
    expected_literals: ["passed"]
  - step: 3
    phase: pre-deploy
    action: prove the v4 registry (rec_by_id gone, four verbs present, signal sources rendered)
    command: bin/venv-python -m pytest "tests/test_ducklake_named_reads.py::TestRecsReadVerbsV4" -q
    expected: all tests in the class pass
    fix_if: a verb's params or SQL drift from the scope purpose, or rec_by_id is still registered
    hermetic: true
    graduation: graduate
    graduation_check_id: named-reads-v4-recs-verbs
    expected_literals: ["passed"]
  - step: 4
    phase: pre-deploy
    action: execute every new verb's SQL in DuckDB against fixture rows (projection parity; tally equals the Python derivation)
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_verb_fields_parity.py -q
    expected: all parity tests pass, including open_recs_tally against the derivation and recs_by_ids for one and several ids
    fix_if: a projection mismatch or a tally that diverges from _count_recommendations_reader's semantics
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      duckdb is a requirements-fast.txt heavy exclusion, so venv-less pr-validate cannot collect
      this file; the full tier already runs it on every main push, so a graduated copy would only
      duplicate that run.
  - step: 5
    phase: pre-deploy
    action: prove preflight's recs inputs fail closed and stay within three calls
    command: bin/venv-python -m pytest "tests/session/preflight/test_recs_signals_source.py::TestFailClosed" -q
    expected: all tests in the class pass
    fix_if: any failure path returns [] or a partial row set instead of None, or the ok path makes more than three calls
    hermetic: true
    graduation: graduate
    graduation_check_id: preflight-recs-inputs-fail-closed
    expected_literals: ["passed"]
  - step: 6
    phase: pre-deploy
    action: prove the five CI-RCA signal sites return None (not []) for unavailable input
    command: bin/venv-python -m pytest "tests/session/preflight/test_ci_rca_signals.py::TestUnavailableIsNotEmpty" -q
    expected: all tests in the class pass
    fix_if: any site still returns [] for None input
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-signals-unavailable-not-empty
    expected_literals: ["passed"]
  - step: 7
    phase: pre-deploy
    action: prove the cache producers are retired (sync skips recs and deletes a stale copy; portal writes never touch the file)
    command: bin/venv-python -m pytest "tests/sync/ops/test_pull.py::TestRecsCacheRetired" "tests/test_ops_portal_incremental_cache.py::TestRecsCacheNotWritten" -q
    expected: all tests in both classes pass
    fix_if: ops_recommendations is still pulled, or a portal write creates the recs cache file
    hermetic: true
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: prove trailer closure, cost reconciliation and the assert-clear probe read named verbs and fail loudly
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestRecsByIdsRead" "tests/test_cost_reconciliation.py::TestFindOpenCostRecViaReader" "tests/test_ci_rca_probe_health.py::TestAssertClearReaderBacked" -q
