constraints:
  - No full-table read of ops_recommendations on any application path; a missing signal is null/unavailable, never [] (Decision 55).
  - Named verbs only, fixed SQL, string binds, no caller SQL (Decision 84 I-3); query_ops stays DQ-only.
  - EXPAND only -- no verb is removed and no rec_by_id caller is migrated here (rec-4240); the merge-push trailer census and close use only verbs present in both registries.
  - 413 is never retried; _READER_TRANSIENT_STATUS stays {502, 503, 504} (Decision 155 cl.2).
  - Reader code ships only through deploy-ducklake-lambdas.yml on the merge push (Decision 126); no local build_lambda --deploy.
  - Decision 128 -- ci_rca_signals.py (497), ops_data_portal.py (489) and ci_rca_gauges.py (478) are near 500 SLOC; edits there are net-zero or negative, otherwise decompose (never raise).
  - Decision 127 prose budgets -- AGENTS.md/S1, orient SKILL.md (zero headroom), implement SKILL.md (28 bytes), plan-critique SKILL.md (94) and PROJECT_CONTEXT.md (31) stay within budget; any unavoidable raise carries a dec-215 marker the new Decision authorises.
  - Decision 167 -- the new Decision carries a yaml envelope with significance and stays at or under 6,144 bytes; amendments to 88 and 103 are dated annotations, never in-place edits (Decision 177).
  - Decision 201 cl.4 -- trailer reads stay in the census and close jobs; the evaluate job stays credential-free.
  - Decision 212 -- the client gains a module-level helper over the registered `named` port verb, never a new adapter method.
  - No rescue agents or workaround loops (Decision 55).
