    graduation_check_id: gc-ops-verb-contract-and-amendment
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the terraform invariants -- the gc_ops rule created DISABLED, and no lifecycle rule on the
      data-lake bucket.
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_is_created_disabled" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_no_lifecycle_configuration_targets_the_data_lake_bucket" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_maintenance_role_iam_is_not_widened" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_liveness_alarm_treats_missing_data_as_breaching" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_cron_does_not_collide_with_the_singleton_cadences" -q
    expected: >-
      The gc_ops rule state is DISABLED; no aws_s3_bucket_lifecycle_configuration targets
      aws_s3_bucket.data_lake anywhere in terraform/personal; the maintenance role's IAM is
      unwidened (PutMetricData namespace condition and prefix-scoped ListBucket intact); the
