schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: production-gc-and-storage-stability
intent: >-
  Turn on destructive garbage collection against the production DuckLake catalog behind a
  per-cycle safety invariant that can see over-reclaim, and start the observation window whose
  completion a follow-on plan uses to close T2.18 c2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-production-gc-and-storage-stability.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_gc_verification.py
    action: Create
    purpose: >-
      Post-pass verification, pure-predicate split from connection-owning exactly as Decision 188
      split ducklake_maintenance_ops. SAFETY: referenced_missing(live_paths, storage_paths) -- the
      |L \ S| direction, which is the over-reclaim signal a storage-size metric structurally cannot
      see (deleting live data makes storage look BETTER). EFFICACY: gc_debt_ratio(storage_bytes,
      live_bytes) -- (S-L)/L, the quantity GC controls, since absolute prefix bytes legitimately
      grow with ingestion. Also the INDEPENDENT safety check,
      verify_read_path(con, snapshot_id, tables): snapshot identity is CATALOG-level, so ONE
      pass-start id is captured and every table is re-read AT (VERSION => that id). It MUST force a
      real data scan -- a bare count(*) at a pinned snapshot is answerable from DuckLake
      catalog record-count metadata with every underlying Parquet file already deleted, and column
      min/max statistics have the same problem. Aggregate over actual column VALUES.
  - file: src/common/ducklake_gc_ops.py
    action: Create
    purpose: >-
      The gc_ops pass body, in its own module because the handler is at 458 SLOC against the
      500-SLOC limit with NO entry in config/sloc_budgets.yaml -- Decision 128 makes decomposition
      the default and a budget raise a deliberate exception, and action_merge_ops alone is ~110
      SLOC while gc_ops does strictly more. Three properties are load-bearing. (1) The live-set
      collection enumerates EVERY table returned by catalog enumeration, UNCONDITIONALLY -- it is
      never derived from scope.resolve_scope, and no policy input reaches it. Filtering it would not
      narrow what gets deleted (the destructive verbs are catalog-wide); it would narrow what G1 and
      G3 can SEE. (2) It runs NO per-table prelude: flush_inlined_data is a documented guaranteed
      no-op (inlining disabled at the connection level, ducklake_maintenance.py:13-15) and
      merge_adjacent_files is already run on every ops table every 6 hours by merge_ops -- 28x per
      week against gc_ops's 1x. One verb, one job: merge_ops compacts, gc_ops reclaims. (3) It calls
      run_guarded_gc UNMODIFIED -- this plan changes no shipped guard code. G4's byte half is
      therefore INERT for gc_ops (a would-delete path is absent from a no-prelude pass's live_before,
      so it sizes to zero) and the FILE-COUNT half is the only binding cap. That degradation is
      recorded, not papered over: see the G4 byte-half entry in context, and rec-3871, which
      owns the fix.
      (4) READ ORDERING IS LOAD-BEARING: it collects the CATALOG live set FIRST and lists STORAGE
      SECOND. In that order an interleaved write shows up as a spurious ORPHAN, which is harmless to
      referenced_missing; the reverse order manufactures a spurious REFERENCED-MISSING, which is the
      signature of the 3-object delta recorded at VP14 and would trip the safety gate on a race
      rather than on a real defect. Asserted by a test, not left to implementation order.
      (5) It EMITS the complete metric set every asserted signal depends on, all into the
      DuckLakeMaintenance namespace: GcReferencedMissing, GcWouldDeleteFiles, GcDebtRatio,
      GcDebtBytes, GcStorageObjects, GcSnapshotsRetainedMin (from run_guarded_gc's guard_stats g2
      snapshot re-read) and per-phase
      GcDeletedSnapshots / GcDeletedFiles / GcDeletedOrphans. An unemitted metric reads ABSENT, not
      breached -- the failure shape the namespace trap note calls the worst possible for a guard
      whose whole job is to be noticed. ORDERING IS LOAD-BEARING: GcReferencedMissing must be
      EMITTED BEFORE the referenced-missing raise, or the GcReferencedMissing >= 1 alarm never
      receives the datapoint that is the whole point of the alarm.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      Thin action_gc_ops dispatch entry delegating to src/common/ducklake_gc_ops.py. The verb is
      gc_ops, NOT gc: gc is already taken by the SMOKE host's weekly disposable-catalog pass
      (docs/contracts/ducklake_maintenance.yaml verbs.gc, measured), and the contract's own
      precedent for a production counterpart of a smoke verb is the merge -> merge_ops rename.
      Requires explicit data_path + meta_schema, refuses a no-arg invoke, and accepts dry_run
      (default False) -- mirroring action_merge_ops on the first two. BUDGET: the handler is at 458
      SLOC of 500 (measured), so the dispatch entry has 42 SLOC of headroom and must stay well
      inside it -- all real work belongs in ducklake_gc_ops. It must NOT call
      scope.resolve_scope: that function is the per-table-scoped path (handler.py:396, the matrix's
      only production consumer) and gc_ops has no per-table dimension. Keep the delegation thin so
      the file does not cross its limit.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: >-
      Weekly production gc_ops EventBridge rule + target + lambda permission, mirroring the
      merge_ops rule at lines 229-253. Resource "ducklake_maintenance_gc_ops", name
      "agent-platform-ducklake-maintenance-gc-ops" -- the un-suffixed name is ALREADY TAKEN by the
      smoke rule (ducklake_maintenance_smoke.tf:242, measured), so the obvious name is a hard
      apply-time collision. Created state = "DISABLED": Decisions 125/126 deploy the handler and
      the rule through DIFFERENT channels, so an ENABLED rule from the infra apply can fire
      action=gc_ops before the handler carrying the verb deploys -- a scheduled 400. Also a
      CloudWatch alarms -- see below -- which make THREE alarm blocks in this file.
      SCHEDULE (F51): schedule_expression cron(45 3 ? * SUN *) -- weekly, and deliberately OFFSET
      from the two existing cadences on this SINGLETON function. reserved_concurrent_executions is 1
      (Decision 81 cl.6), and this file already carries two explicit anti-throttle comments at :221
      and :262 for exactly this reason; merge_ops holds cron(30 *''/6 * * ? *) and control_health
      cron(15 *''/6 * * ? *), so any gc_ops cron at :15 or :30 past a 6-hourly hour collides and
      throttles with a 429 -- which, per the absence problem below, would be SILENT.
      RUNTIME (F51): timeout = 300 and memory_size = 1024 (lines 150-151) were sized before this
      verb existed. gc_ops is the heaviest verb this function will run -- a universal catalog
      live-set enumeration, the destructive sequence, a post-pass re-enumeration for the G1 re-check
      and G3, a VALUE-SCANNING read-path re-read of every table at a pinned snapshot (which by
      design forces real Parquet reads from S3), and a ListObjectsV2 walk of the production prefix.
      The implementer MUST assess that against 300s and raise timeout/memory in this same file if it
      does not fit. A timeout between the deletion at ducklake_maintenance_ops.py:231-232 and the G1
      re-check/G3 at :249-250 leaves production data deleted with NO safety verdict and NO metric.
      ABSENCE DETECTION (F50): the plan's own stated worst case is a metric reading ABSENT rather
      than breached. The shipped breaker alarm at :299-319 carries treat_missing_data =
      "notBreaching" (measured) -- mirroring that faithfully would make the new alarm OK-quiet in
      every absence case: namespace denial, 429 throttle, 300s timeout mid-pass, an exception before
      emission, or a rule that silently never fires. So: (1) the GcReferencedMissing >= 1 alarm sets
      treat_missing_data = "notBreaching" DELIBERATELY, because a weekly metric is legitimately
      absent six days in seven and that alarm is the breach detector, not the liveness detector;
      (2) a SECOND, new alarm is the liveness detector -- on the datapoint count of
      GcDeletedSnapshots over a lookback longer than one week with treat_missing_data = "breaching",
      in the shape of the existing evaluation_periods-based DR freshness alarm (Decision 88 cl.3's
      precedent in this codebase). Without (2) a pass that never runs is invisible for the whole
      nine-week window -- which is the window this plan exists to open.
      IAM needs no change and must not be widened: the role already carries s3:ListBucket scoped
      to the prod prefix (lines 112-122) and cloudwatch:PutMetricData CONDITIONED on
      cloudwatch:namespace == "DuckLakeMaintenance" (lines 123-133) -- every new metric must be
      emitted into that namespace or it is silently denied.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Document the admin gc_ops verb (payload including dry_run, response_codes, typed_errors)
      ALONGSIDE the existing smoke gc verb, never by renaming it, and add the amendment_log entry.
      change_class is a CLOSED 8-value vocabulary (scripts/contracts_schema.py:50-60): this is
      field_add with semantic_break: true, the Decision 191 precedent in this same amendment_log.
      The log holds 2 entries today (measured).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New Decision (body and envelope drafted in context) recording the Decision 88 cl.4 gate-clear,
      the rule that the maintenance_policy matrix governs per-table-scoped verbs ONLY, and the c2
      criterion reframe. MUST carry the Decision 167 fenced yaml envelope with number and
      significance (decision-entry.yaml metadata_envelope.required_fields: [number, significance])
      -- a heading and prose clauses alone fail validate_decision_entry_conformance. Plus a dated
      annotation on Decision 88 cl.2, whose parenthetical "the DR bucket and direct CloudWatch reads
      are IAM-blocked from the dev role by design" is factually stale -- platform_dev_policies.tf's
      ObservabilityMetricRead Sid (T2.48 / rec-2851) grants GetMetricStatistics / GetMetricData /
      ListMetrics, which this plan's read-back depends on.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Rewrite T2.18 c2's text from "S3 storage confirmed stable after N maintenance cycles" to the
      two assertions that actually adjudicate. STRENGTHENING, not weakening: the original is
      satisfied by a job that deletes the whole prefix, since over-reclaim reduces storage. Status
      stays OPEN -- exit-criteria-ledger.yaml forbids flipping met over text that does not
      adjudicate true at flip time, and N cycles have not elapsed. NOTE this file is a BUNDLED ASSET
      of data-pipeline (src/lambdas/data-pipeline/manifest.yaml:44), so editing it changes that
      artifact's zip content -- see VP13's disposition.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      COMMENT-ONLY edit to the maintenance_policy header (lines 18-32), collocating the rule with
      the field it governs per the AGENT-FIRST collocation norm: a catalog-wide verb takes no cell,
      because the matrix's single production consumer is scope.resolve_scope and such a verb has no
      per-table dimension. The header documents the matrix's universes and its CI gate today but
      says nothing about which verbs belong, which is how an earlier draft of this very plan talked
      itself into adding an inert gc_ops column. NO key is added or changed -- field_semantics.yaml
      is the bundled asset and is generated from the DATA, not the comments, so this edit changes no
      artifact content and leaves the affected-artifact set at two. Verified: the generated projection
      carries no comments from this header.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle ducklake_gc_verification.py and ducklake_gc_ops.py into the admin maintenance zip.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: Exclude both new modules from data-pipeline, mirroring the ducklake_maintenance_ops and ducklake_maintenance_scope exclusions.
  - file: tests/common/test_ducklake_gc_verification.py
    action: Create
    purpose: >-
      Unit coverage for referenced_missing, gc_debt_ratio and verify_read_path, with red cases: an
      over-reclaim fixture (a live path absent from storage) that MUST trip; a shared-bug fixture
      where the live-file function is wrong in both the action and referenced_missing and only the
      read-path check catches it; a VACUITY fixture where the catalog rows survive but the backing
      Parquet is gone, which a count(*)-only read-path check passes and a value-scanning one fails;
      and a debt-ratio fixture at the bound.
  - file: tests/common/test_ducklake_gc_ops.py
    action: Create
    purpose: >-
      The guard-blindness regression, this plan's most important test: the live set gc_ops computes
      G1, G3 and referenced_missing over contains EVERY table catalog enumeration returns, and is
      not derived from scope.resolve_scope. Asserted both ways -- the collector is not reachable
      from any policy input, and with a fixture-injected policy marking a class apply:false (a
      FIXTURE-ONLY construction; the shipped matrix has no gc_ops column at all) that class's live
      files are still present in the set. Plus: the catalog live set is collected BEFORE storage is
      listed (F52's race ordering, asserted by call order, not by comment); gc_ops issues no
      flush_inlined_data or
      merge_adjacent_files call, and gc_ops passes the UNIVERSAL CATALOG live set as live_before --
      never the ListObjectsV2 storage map -- so G4's byte half sizes to zero while the file-count
      half binds, and G3's before/after comparison keeps live-vs-live semantics. Passing the storage
      map there instead would silently corrupt G3: assert_catalog_sane would compute its drop as
      storage-bytes-before minus live-bytes-after, i.e. the GC-debt delta, making the 50 GiB bound
      meaningless in both directions.
  - file: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
    action: Create
    purpose: >-
      action_gc_ops requires explicit data_path and meta_schema and refuses a no-arg invoke; a
      dry_run invoke emits GcReferencedMissing and GcWouldDeleteFiles and performs no write of any
      kind; raises on non-zero referenced-missing rather than returning ok; never calls
      scope.resolve_scope. Also hosts TestSmokeScopeNotRepointed, which SHIPS the Decision 143 cl.2
      never-weaken invariant as a standing regression test rather than leaving it as a plan-time
      grep that is green by construction.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    action: Modify
    purpose: >-
      New class TestProductionGcRuleInvariants: the gc_ops rule is created DISABLED, and no
      aws_s3_bucket_lifecycle_configuration anywhere in terraform/personal/*.tf targets the
      data-lake bucket. The sweep MUST be over the whole directory, not the module's existing
      _ADMIN_TF / _SMOKE_TF constants: the only lifecycle config in the repo today is
      ducklake_catalog_dr.tf:74 (targeting the DR bucket, legitimately), so a two-file assertion is
      green-by-construction forever and could never see a rule added in s3.tf. A lifecycle expiration
      rule over the lakehouse prefix is over-reclaim by configuration, deleting live Parquet on an
      age rule the catalog knows nothing about. TWO existing tests in this file are order- or
      count-sensitive and both break if ignored: (1) test_admin_tf_has_exactly_one_alarm_block
      (line 63, asserts == 1) must expect 3 -- the breach alarm and the liveness alarm -- and be
      renamed; the module DOCSTRING at line 4 also asserts "each terraform file holds exactly one
      aws_cloudwatch_metric_alarm resource (measured)", which this change falsifies and which must be
      corrected in the same edit; (2)
      test_alarm_descriptions_retain_provenance_tag (line 77) reads
      _alarm_descriptions(_ADMIN_TF)[0] and asserts "T2.18 / CD.33 H1" is in it -- blocks come back
      in FILE ORDER, so the new GcReferencedMissing alarm MUST be placed AFTER the existing breaker
      alarm (line 299) or carry the same provenance tag. It must also carry an alarm_description at
      all (_alarm_descriptions_from_text asserts every block has one), whose text avoids the
      threshold shape this file pins against. The class also carries
      test_maintenance_role_iam_is_not_widened, pinning the maintenance role's
      cloudwatch:namespace == DuckLakeMaintenance condition and its prefix-scoped s3:ListBucket --
      the plan makes non-widening load-bearing (that namespace condition is what makes an unemitted
      metric read absent rather than breached), so it must be asserted, not merely asserted about.
bundled_recommendations: []
followon_recs:
  - rec-3870
  - rec-3871
infrastructure_dependencies:
  - terraform/personal/ducklake_maintenance.tf
  - ducklake_maintenance
  - data-pipeline
acceptance_criteria:
  - >-
    A new admin action_gc_ops exists on ducklake_maintenance, requires explicit data_path +
    meta_schema, accepts dry_run, and refuses a no-arg invoke. The verb is gc_ops because gc
    already names the SMOKE host's disposable-catalog pass; the merge -> merge_ops precedent in the
    same contract governs. Its body lives in src/common/ducklake_gc_ops.py, not in the handler,
    which is at 458 of 500 SLOC with no budget entry (Decision 128: decompose by default).
  - >-
    THE GUARD LIVE SET IS UNIVERSAL. The live-file inventory feeding live_before / live_now /
    live_after and referenced_missing enumerates EVERY table catalog enumeration returns, is not
    derived from scope.resolve_scope, and takes no policy input at all. Asserted two ways: the
    collector is unreachable from any policy input, and under a FIXTURE-INJECTED policy marking a
    class apply:false that class's live files are still in the set. This is the plan's central
    correctness property -- see the guard-blindness entry in context.
  - >-
    NO maintenance_policy CELL IS ADDED FOR gc_ops, and VERB_UNIVERSE stays ("merge_ops",).
    The matrix governs per-table-scoped verbs only: its single production consumer is
    scope.resolve_scope at handler.py:396, gc_ops has no per-table dimension, and a cell nothing
    reads is a declaration without behavior. config/lambda/ducklake/field_semantics.static.yaml and
    its generated projection are therefore UNTOUCHED by this plan, which also keeps
    ducklake_reader, ducklake_writer and ducklake_maintenance_smoke out of the affected-artifact set.
  - >-
    gc_ops runs NO per-table prelude. flush_inlined_data is a documented guaranteed no-op and
    merge_adjacent_files is already run on every ops table 6-hourly by merge_ops, so duplicating it
    would add writer-serialization contention (rec-3762) for no compaction benefit.
  - >-
    SAFETY, asserted every cycle and never retired: after each destructive pass
    GcReferencedMissing == 0, every table re-reads AT the pass-start CATALOG snapshot id with an
    unchanged value-level aggregate, and the catalog snapshot count is >= 2. Any breach raises; it
    is an incident, not a trend. Snapshot identity is CATALOG-level throughout -- expire_snapshots
    and G2 both read ducklake_snapshots('{catalog}') -- so the signature is
    verify_read_path(con, snapshot_id, tables), one id for the pass, never one per table.
  - >-
    The read-path check is INDEPENDENT of the delete-set computation AND non-vacuous. A fixture in
    which the live-file function is wrong in both the action and referenced_missing is caught by the
    read-path check and by nothing else; a second fixture in which catalog rows survive with their
    backing Parquet deleted is caught by the value-level aggregate and NOT by a row count.
  - >-
    NO SHIPPED GUARD CODE IS MODIFIED. gc_ops calls run_guarded_gc as it stands. Two consequences are
    recorded rather than fixed here, both owned by rec-3871. (a) G4's byte half is INERT for
    gc_ops: candidate_bytes joins would-delete paths against live_before, and with no merge prelude
    every candidate was superseded by an earlier pass and is already absent, so it sizes to zero --
    the FILE-COUNT half is the only binding cap. Note this premise is specific to a no-prelude verb:
    tests/common/test_ducklake_maintenance_ops.py::TestG4RealDryRunSizeColumn demonstrates on the
    pinned engine that a PRE-merge live_before does size merge-superseded candidates non-zero, so
    the smoke path's byte half is live and unaffected. (b) An over-cap backlog defers the whole pass
    with no partial drain. (c) G4 BOUNDS A PRE-EXPIRY SET AGAINST A POST-EXPIRY DELETION.
    run_guarded_gc computes would_delete_paths at :205-208, runs expire_snapshots at :218, bounds
    that PRE-expiry set at :227-228, and only then calls cleanup_old_files / delete_orphaned_files
    at :231-232 against whatever the engine computes post-expiry. On a catalog where expiry has
    NEVER run, the first pass's expiry is by construction the largest it will ever see, and the
    files it orphans become cleanup candidates only afterwards -- so a pre-expiry count
    systematically UNDERSTATES the first pass's real deletion volume, and on that pass neither G1's
    pre-check nor G4's bound covers the set actually deleted. G3's live-byte-drop bound and this
    plan's own post-pass referenced_missing and read-path checks are the cover. All three
    limitations are rec-3871's, not this plan's to fix -- they live in shipped guard code it must
    not edit. rec-3871 was filed BEFORE limitation (c) was discovered and its context names only (a)
    and (b), so this plan AMENDS it (execution step, and VP17 asserts the amendment landed): a
    follow-on rec that does not describe the defect it owns is an unowned defect wearing a rec id.
  - >-
    EFFICACY is expressed as GC DEBT, not absolute storage: GcDebtRatio = (storage_bytes -
    live_bytes) / live_bytes, emitted post-pass, with GcDebtBytes and GcStorageObjects alongside.
    Absolute prefix bytes are not the assertion -- live bytes legitimately grow with ingestion.
  - >-
    Each destructive phase emits its own NAMED deleted-count metric -- GcDeletedSnapshots,
    GcDeletedFiles, GcDeletedOrphans -- so a window in which nothing was deleted cannot read as
    success. "Stable" is never vacuously true. Every signal any verification step asserts has a
    corresponding emission obligation; no step adjudicates a metric nothing is required to emit.
  - >-
    MEASURE BEFORE BUILDING. Whether a bounded drain is needed at all is an OPEN MEASUREMENT: this
    catalog has never had the destructive sequence run, so its backlog is unknown. VP14's dry-run
    reports GcWouldDeleteFiles against G4_MAX_DELETE_FILES and gates the schedule enable on it.
    That reading is a PRE-EXPIRY lower bound, not a headroom certificate -- see limitation (c) --
    so the measurement is taken TWICE, at the only two points where each figure exists: VP14 reads
    the pre-expiry lower bound before the schedule is enabled, and VP16 reads the post-expiry figure
    after the first real pass, which is the first moment it is knowable. Building a cutoff-walk
    before either measurement would be speculative work on a live production guard; rec-3871 is
    conditioned on them.
  - >-
    Every metric is emitted into the DuckLakeMaintenance CloudWatch namespace. The role's
    PutMetricData grant is conditioned on exactly that namespace (ducklake_maintenance.tf:123-133),
    so a metric published anywhere else is silently denied and the safety invariant reads as absent
    rather than as breached.
  - >-
    A dry_run invoke is READ-ONLY: no deletion and no write of any kind. It emits
    GcReferencedMissing and GcWouldDeleteFiles, so the baseline gate can be taken WITHOUT running
    the destructive pass it exists to gate. The engine primitives already support this
    (_dry_run_cleanup_paths / _dry_run_orphan_paths, ducklake_maintenance.py:145-168).
  - >-
    The production gc_ops EventBridge rule is created DISABLED, named
    agent-platform-ducklake-maintenance-gc-ops (the un-suffixed name belongs to the smoke rule), and
    is enabled only after the baseline assertion passes AND the governed CD channel has deployed
    the handler carrying the verb. The infra and code channels are separate (Decisions 125/126).
  - >-
    The measurement uses managed primitives for storage (ListObjectsV2) and for the sink
    (CloudWatch); only the catalog-to-storage JOIN is application code, and the plan records why --
    no managed service has catalog semantics, which is why Iceberg, Delta and Hudi all ship their
    own orphan and fsck tooling.
  - >-
    No aws_s3_bucket_lifecycle_configuration targets the data-lake bucket. A lifecycle expiration
    rule over the lakehouse prefix would delete live Parquet on an age rule the catalog knows
    nothing about -- over-reclaim by configuration.
  - >-
    The new Decision carries a Decision 167 fenced yaml envelope with number and a significance
    value plus non-empty justification, not a heading and prose alone.
  - >-
    T2.18 c2's text is rewritten to the safety and efficacy assertions and its status stays OPEN.
    rec-3870 is ALREADY FILED (at plan time, not deferred to implement time) and seeded into
    followon_recs as the committed closer, so the rewritten criterion is never uncommitted.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the verification predicates hold, including the shared-bug fixture only the read-path check
      can catch and the vacuity fixture only a value-level aggregate can catch.
    command: bin/venv-python -m pytest tests/common/test_ducklake_gc_verification.py -q
    expected: >-
      All pass, including the over-reclaim fixture, the shared-bug fixture, the
      catalog-rows-survive-but-Parquet-deleted vacuity fixture, and the debt-ratio bound case.
    fix_if: >-
      The vacuity fixture passes under a count(*) read-path check -- a row count at a pinned snapshot
      is answerable from catalog metadata with every backing file deleted, which is the blind oracle
      this check exists to be independent of.
    graduation: graduate
    graduation_check_id: gc-verification-predicates-discriminate
  - step: 2
    phase: pre-deploy
    action: >-
      Prove action_gc_ops requires explicit params, honours dry_run as read-only, never calls
      resolve_scope, and raises on referenced-missing.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_gc_action.py -q
    expected: >-
      No-arg invoke refused; a dry_run invoke emits GcReferencedMissing and GcWouldDeleteFiles and
      writes nothing; non-zero referenced-missing raises rather than returning ok.
    fix_if: >-
      A non-zero referenced-missing returns 200 -- safety must raise, never report. Or dry_run writes.
      Or the handler reaches for scope.resolve_scope, which is the per-table-scoped path gc_ops has no
      business on.
    graduation: graduate
    graduation_check_id: admin-gc-ops-action-contract
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the guard live set is UNIVERSAL -- it takes no policy input, and a live file of a
      fixture-excluded class is still inside the set G1/G3 and referenced_missing are computed over
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal::test_live_set_collector_takes_no_policy_input" "tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal::test_policy_excluded_table_live_file_is_in_the_guard_live_set" -q
    expected: >-
      Both nodes pass: the collector is unreachable from any policy input, and a fixture-injected
      apply:false class still has its live files in the guard set.
    fix_if: >-
      The live set is derived from scope.resolve_scope or any policy input. That does not stop the
      catalog-wide destructive verbs touching a table -- it removes that table from what G1 can see,
      which is a guard hole wearing the costume of a scope narrowing.
    graduation: graduate
    graduation_check_id: guard-live-set-is-universal
  - step: 4
    phase: pre-deploy
    action: >-
      Prove gc_ops emits the full metric set, with GcReferencedMissing emitted BEFORE any
      referenced-missing raise. Its own step and its own registry identity: an unemitted metric
      reads ABSENT rather than breached, which is a different regression from a guard-live-set
      defect and must not surface under that name.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestMetricEmission::test_emits_the_full_metric_set_with_referenced_missing_before_any_raise" -q
    expected: >-
      The fake metrics sink receives all nine metrics, and GcReferencedMissing precedes any raise --
      otherwise the GcReferencedMissing >= 1 alarm never receives the datapoint that is its purpose.
    fix_if: >-
      A metric any verification step adjudicates is missing from the sink, or the raise precedes the
      emission. Either way the alarm goes quiet exactly when it matters.
    graduation: graduate
    graduation_check_id: gc-ops-emits-full-metric-set
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the shipped never-weaken test holds -- GC_TABLE_SCOPE was not repointed at production
      (Decision 143 cl.2 env-pinning).
    command: bin/venv-python -m pytest "tests/lambdas/ducklake_maintenance/handler/test_gc_action.py::TestSmokeScopeNotRepointed::test_gc_table_scope_still_holds_the_smoke_pair" "tests/lambdas/ducklake_maintenance/handler/test_gc_action.py::TestSmokeScopeNotRepointed::test_admin_handler_never_reads_gc_table_scope" -q
    expected: >-
      Both nodes pass -- GC_TABLE_SCOPE still holds the smoke pair, and the admin handler never
      references it.
    fix_if: >-
      The admin handler reads GC_TABLE_SCOPE, or the constant changed. Production scope comes from
      catalog enumeration; repointing the constant aims the SMOKE function at production, which
      Decision 143 cl.2 forbids.
    graduation: graduate
    graduation_check_id: gc-table-scope-stays-smoke-only
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the contract documents the gc_ops verb with dry_run, keeps the smoke gc verb, and carries
      an amendment entry using the closed vocabulary correctly.
    command: "bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8')); assert 'gc_ops' in d['verbs'], 'gc_ops verb undocumented'; assert 'gc' in d['verbs'], 'the smoke gc verb must survive the addition'; assert 'dry_run' in d['verbs']['gc_ops']['payload_schema_ref'], 'dry_run absent from the gc_ops payload'; a=d['amendment_log']; assert len(a)>=3, 'no amendment entry appended (2 exist today)'; assert a[-1]['change_class']=='field_add' and a[-1]['semantic_break'] is True, 'a new verb is field_add with semantic_break true'; print('contract + amendment ok')\""
    hermetic: true
    expected: >-
