  - >-
    CI-RCA DEFERRAL (Related-Work Check: all three fail). rec-3861 and rec-3863 are ruff-0.16.7
    ISC004 regressions on requirements-dev.txt and scripts/checks/_scaffolding.py -- no shared scope
    file, no shared Decision, different failure category. Deferred deliberately.
  - >-
    Decision 88 cl.4 GATE IS CLEARED, verified: the gate is the rec-2113 pg_restore drill; T2.26 c1
    is met (met_by 6cbfe6b1, 2026-07-04) and rec-2113 is closed. T2.18 c2's own text records the
    clearing. Decisions 188 and 191 both left cl.4 standing but untouched. No fresh drill required.
    Cite the clearing; do not restate the gate as open.
  - >-
    WHY THE CRITERION IS REWRITTEN. "S3 storage confirmed stable" is blind to over-reclaim --
    deleting live data makes storage look better, so a job that deleted the whole prefix would
    satisfy it. It is also unmeasurable as written: the data-lake bucket holds 12+ unrelated
    prefixes (agents/, convergence/, deploy-records/, lambda-packages/, recommendations/,
    tf-provider-mirror/, ...), so AWS/S3 bucket-wide metrics cannot isolate the lakehouse. And
    absolute storage on an ingesting lakehouse is not supposed to be stable. The rewrite is
    STRENGTHENING; status stays open per exit-criteria-ledger.yaml.
  - >-
    THE TRAP. referenced_missing shares the live set L with the delete-set computation, so a bug in
    the live-file function corrupts the action and its own check identically -- the recorded Iceberg
    remove_orphan_files class (s3:// vs s3a://, double slashes, URL-encoded paths). The read-path
    check (pass-start snapshot id, re-read AT VERSION, compare row count) is the INDEPENDENT
    assertion and the one the criterion rests on. A test that only exercises referenced_missing
    reproduces this workstream's recorded blind-oracle failure.
  - >-
    N = 9 weekly cycles, derived: 1 drain cycle excluded (it always looks like GC works) +
    ceil(max(grace 7, retention 30)/7) = 5 for a file to traverse write -> supersede -> grace ->
    delete inside the window + 3 steady-state samples (two points always fit a line). Constants
    measured at src/common/ducklake_maintenance.py:82-84.
  - >-
    Decision 100 justification to record verbatim in the plan's PR: no managed service has catalog
    semantics, so the catalog-to-storage join is inherently application state -- which is why
    Iceberg, Delta and Hudi all ship their own orphan/fsck tooling. AWS/S3 metrics are bucket-wide;
    Storage Lens gives prefix bytes but cannot separate live from dead and is blind to over-reclaim;
    S3 Inventory's crossover is 10^7-10^8 objects against ~13k here. Storage side uses
    ListObjectsV2 and the sink uses CloudWatch -- only the join is custom.
  - >-
    GUARD BLINDNESS -- the correctness centre of this plan, found by the plan-critique gate and
    verified against source. ducklake_expire_snapshots, ducklake_cleanup_old_files and
    ducklake_delete_orphaned_files are CATALOG-WIDE (src/common/ducklake_maintenance.py:36-37, and
    the three wrappers at :210/:252/:276 take a catalog and no table list). run_guarded_gc
    (ducklake_maintenance_ops.py:178-250) consumes its tables argument ONLY to build live_now and
    live_after, while would_delete_paths comes from the catalog-wide dry-run helpers. So excluding a
    class from the table list does NOT stop its files being expired, cleaned or orphan-deleted -- it
    removes that table live files from the set G1 (assert_reachability) and G3 (assert_catalog_sane)
    are computed against. The first draft of this plan excluded the control class that way and would
    have made ops_entity_counters LESS protected, not more. The live set is therefore universal and
    takes no policy input at all.
  - >-
    READ-PATH VACUITY. A bare count(*) at a pinned snapshot is answerable from DuckLake catalog
    record-count metadata, so it can return the pass-start count with every backing Parquet file
    already deleted. Column min/max statistics have the same problem. verify_read_path must
    aggregate over actual column VALUES, and the vacuity fixture (catalog rows survive, Parquet
    gone) is what proves it. Without this the plan own "independent" check is the blind oracle its
    existence is justified by.
  - >-
    VERB NAMESPACE, measured 2026-09-14. docs/contracts/ducklake_maintenance.yaml already documents
    a gc verb -- the SMOKE host weekly disposable-catalog pass -- and
    terraform/personal/ducklake_maintenance_smoke.tf:243 already owns the EventBridge rule name
    agent-platform-ducklake-maintenance-gc. The contract own precedent for a production counterpart
    of a smoke verb is merge -> merge_ops, and VERB_UNIVERSE in
    src/common/ducklake_maintenance_scope.py is ("merge_ops",) -- i.e. it is the PRODUCTION verb
    namespace. The production verb is therefore gc_ops, with rule name
    agent-platform-ducklake-maintenance-gc-ops. Naming it gc would give one verb two opposite scope
    semantics across two hosts and collide on the rule name at apply time.
  - >-
    WHY NO MATRIX COLUMN (round-3 finding F18, and the question the human asked of it). The
    maintenance_policy matrix was NEVER inert in the codebase: today it carries merge_ops only, for
    all three classes, and VERB_UNIVERSE is ("merge_ops",) -- both measured 2026-09-14, both live
    and correct. The inert thing was a column THIS PLAN proposed adding. It entered in draft 1 on
    the mistaken premise that the matrix could scope a catalog-wide verb (finding F1); when that
    premise was corrected the column's purpose evaporated, but drafts 2 and 3 fixed the CELL
    SEMANTICS instead of asking whether the cell should exist at all. The matrix has exactly ONE
    production consumer -- scope.resolve_scope at src/lambdas/ducklake_maintenance/handler.py:396,
    called with verb="merge_ops" -- and gc_ops has no per-table dimension, so nothing would ever
    have read the column. VERB_UNIVERSE is by construction the PER-TABLE-SCOPED verb universe;
    Decision 191 cl.2 governs how that universe is SOURCED, never which verbs belong in it, so
    leaving it at ("merge_ops",) satisfies cl.2 completely. Dropping the column also keeps
    ducklake_reader, ducklake_writer and ducklake_maintenance_smoke out of the affected set.
  - >-
    G4 BYTE HALF (round-3 finding F20). bound_deletions sizes candidate_bytes as a join of
    would_delete_paths against live_before (ducklake_maintenance_ops.py:227). A would-delete path is
    by definition NOT live, so that join returns 0 for every candidate and the byte half of G4 is
    inert -- rec-3773's exact fail-open condition, which Decision 188 was authored to retire,
    reached by a different route. gc_ops already collects a ListObjectsV2 storage path-to-size map
    for GcDebtRatio, so the live size source is in hand: gc_ops sizes candidate_bytes from THAT map.
    The file-count half stays as-is and is separately gated at VP13.
  - >-
    SLOC. src/lambdas/ducklake_maintenance/handler.py is 458 SLOC by the repo own counter against a
    500 limit, with NO entry in config/sloc_budgets.yaml. action_merge_ops alone is ~110 SLOC and
    gc_ops does strictly more, so the action body goes in its own module (Decision 128: decompose by
    default; a raise is a marked exception, not a frictionless edit).
  - >-
    AFFECTED ARTIFACTS, re-measured after the F18 column drop AND the F23 guard-module addition:
    THREE, all status active -- ducklake_maintenance and ducklake_maintenance_smoke (both bundle
    src/common/ducklake_maintenance_ops.py, which this plan modifies) and data-pipeline (the two new
    src/common modules plus docs/ROADMAP-PLATFORM.yaml, which is one of its bundled assets).
    ducklake_reader and ducklake_writer are NOT affected -- they were pulled in only by the
    regenerated field_semantics.yaml the F18 drop removed. VP12 gates the invoke on the governed CD
    run being green for the two DuckLake artifacts; data-pipeline's disposition is recorded there.
  - >-
    METRIC NAMESPACE TRAP. ducklake_maintenance.tf:123-133 conditions the role PutMetricData grant
    on cloudwatch:namespace == "DuckLakeMaintenance". A metric emitted anywhere else is silently
    denied, so the safety invariant would read as ABSENT rather than as breached -- the worst
    possible failure shape for a guard whose whole job is to be noticed.
  - >-
    DRAFTED DECISION. Heading: "## Decision NNN: Production destructive GC is licensed by a safety
    invariant that can see over-reclaim, not by a storage-size trend (Decided)". Envelope (MANDATORY
    per Decision 167 / decision-entry.yaml metadata_envelope.required_fields [number, significance]),
    a fenced yaml block carrying: number NNN; status Decided; decided_date; amends [88, 188] and related [191];
    significance value numbered_decision with justification "Licenses destructive GC against the
    production catalog for the first time and re-sources a ratified guard's byte budget for a verb
    that runs no compaction prelude -- a durable, reversal-relevant commitment about what may delete
    production data, not a contract-prose edit." FIVE clauses. (1) The Decision 88 cl.4 gate is cleared by
    T2.26 c1 / rec-2113; destructive GC is licensed on the admin function only, scoped by catalog
    enumeration, never by repointing the smoke constant. (2) The maintenance_policy matrix governs
    PER-TABLE-SCOPED verbs only. A catalog-wide verb takes no cell -- a cell nothing consults is a
    declaration without behavior -- and its guard live set is universal, taking no policy input:
    filtering it would narrow the guard, never the deletion.
    (3) GC verification is two assertions: a per-cycle safety invariant (referenced-missing zero, a
    value-level read-path check, the CATALOG-LEVEL snapshot floor) that raises on breach and never
    retires, and a windowed efficacy bound on GC DEBT rather than absolute storage. (4) T2.18 c2 is
    rewritten to those assertions because the original is satisfied by a job that deletes
    everything; the rewrite strengthens and the criterion stays open until N cycles elapse.
    (5) AMENDS DECISION 188 cl.2, which pins G4's sizing basis to a live inventory captured BEFORE
    merge can supersede a candidate. That premise does not transfer to a verb that runs no merge: a
    would-delete path is then already absent from any pass-start live inventory, so the byte half
    reads zero. For such a verb G4's byte source is the STORAGE inventory, an unknown size RAISES
    rather than counting as zero, and the bound is honoured by walking the deletion cutoff to the
    oldest slice that fits rather than deferring the pass wholesale. The caps are unchanged.
    Annotates Decision 88 cl.2, whose IAM-blocked parenthetical was superseded by T2.48 / rec-2851,
    and appends a dated amendment to Decision 188 per Decision 177.

