    guard implementation.
  - >-
    Add the gc_ops column to config/lambda/ducklake/field_semantics.static.yaml -- scd2 and
    append_only apply true, control apply false carrying a reason that claims only the prelude skip
    -- then regenerate field_semantics.yaml via scripts.schema_to_field_semantics. Never hand-edit
    the generated file.
  - Add gc_ops to VERB_UNIVERSE in src/common/ducklake_maintenance_scope.py (the check imports it and needs no edit), never derived from the matrix.
  - >-
    Add a thin action_gc_ops dispatch to the admin handler delegating to ducklake_gc_ops: explicit
