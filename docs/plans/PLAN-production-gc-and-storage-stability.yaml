    Create src/common/ducklake_gc_verification.py with referenced_missing and gc_debt_ratio as pure
    functions over already-fetched path/byte sets, plus verify_read_path(con, snapshot_id, tables)
    as the connection-owning independent check. It must force a real data scan -- aggregate over
    column VALUES, never a count(*) or a min/max that catalog metadata or column statistics can
    answer without touching storage. Keep the pure/connection split Decision 188 used.
  - >-
    Create src/common/ducklake_gc_ops.py holding the gc_ops pass body. Its live-set collection
    enumerates EVERY catalog table and takes no policy input -- do not call scope.resolve_scope. It
    runs NO flush/merge prelude. It calls run_guarded_gc -- never a second orchestration -- passing
    the ListObjectsV2 storage map it already collects for GcDebtRatio as the new candidate_sizes
    argument, so G4's byte half is live while G3 keeps its live_before baseline. Note run_gc passes
    ONE `tables` argument serving both the prelude and the guard live set; gc_ops must not inherit
    that conflation.
  - >-
    Add a thin action_gc_ops dispatch to the admin handler delegating to ducklake_gc_ops: explicit
