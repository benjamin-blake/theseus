rollback: >-
  The schedule ships DISABLED, so nothing destructive runs until VP14 is taken deliberately. Before
  that point rollback is a plain revert -- and with the matrix untouched there is no generated asset
  to regenerate. After it, disable the rule first, then revert. No catalog or S3 state is changed by
  merging this plan.
