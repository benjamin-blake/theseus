  verification_step: 6
  command: bin/venv-python -c "import yaml,io; d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8'));
    assert 'gc_ops' in d['verbs'], 'gc_ops verb undocumented'; assert 'gc' in d['verbs'], 'the smoke gc verb must survive
    the addition'; assert 'dry_run' in d['verbs']['gc_ops']['payload_schema_ref'], 'dry_run absent from the gc_ops payload';
    a=d['amendment_log']; assert len(a)>=3, 'no amendment entry appended (2 exist today)'; assert a[-1]['change_class']=='field_add'
