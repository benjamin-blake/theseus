    graduation_check_id: gc-ops-rule-disabled-and-no-lakehouse-lifecycle
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the maintenance_policy matrix and VERB_UNIVERSE are UNTOUCHED -- gc_ops is catalog-wide and
      takes no cell. This is a never-weaken assertion in the opposite direction from the usual: it
      guards against re-adding the inert column an earlier draft of this plan proposed.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestMatrixCarriesNoCatalogWideVerb::test_verb_universe_holds_only_per_table_scoped_verbs" "tests/common/test_ducklake_gc_ops.py::TestMatrixCarriesNoCatalogWideVerb::test_matrix_carries_no_gc_ops_cell" "tests/common/test_ducklake_gc_ops.py::TestMatrixCarriesNoCatalogWideVerb::test_matrix_header_documents_the_catalog_wide_rule" -q
    expected: >-
      All three nodes pass -- VERB_UNIVERSE holds only per-table-scoped verbs, no class carries a
      gc_ops cell, and the sidecar's maintenance_policy header documents WHY a catalog-wide verb
      takes none, so the rule lives with the field it governs rather than only in a plan file.
    fix_if: >-
      A gc_ops cell or VERB_UNIVERSE entry was added. The matrix single production consumer is
      scope.resolve_scope at handler.py:396; gc_ops has no per-table dimension, so a gc_ops cell is a
      CI-enforced field no code reads -- declaration without behavior.
    graduation: graduate
    graduation_check_id: matrix-carries-no-catalog-wide-verb
  - step: 9
    phase: pre-deploy
    action: >-
      Prove both new modules ship in the maintenance zip and are excluded from data-pipeline.
    command: "bin/venv-python -c \"import yaml,io; m=yaml.safe_load(io.open('src/lambdas/ducklake_maintenance/manifest.yaml',encoding='utf-8')); dp=yaml.safe_load(io.open('src/lambdas/data-pipeline/manifest.yaml',encoding='utf-8')); inc=set(m.get('includes') or []); exc=set(dp.get('excludes') or []); need={'src/common/ducklake_gc_verification.py','src/common/ducklake_gc_ops.py'}; assert need <= inc, 'maintenance manifest missing: '+str(sorted(need-inc)); assert need <= exc, 'data-pipeline excludes missing: '+str(sorted(need-exc)); print('manifests carry both modules')\""
    hermetic: true
    expected: >-
      ducklake_gc_verification.py and ducklake_gc_ops.py are in the maintenance manifest includes and
      in the data-pipeline excludes.
    fix_if: >-
      A module is missing from either list. tests/lambda_manifest/test_bundle_checks.py passes both
      before and after this change (measured), so it cannot be the assertion here.
    graduation: graduate
    graduation_check_id: gc-modules-bundled-and-excluded
  - step: 10
    phase: pre-deploy
    action: >-
      Prove the Decision landed WITH its Decision 167 envelope and the cl.2 staleness annotation.
    command: "bin/venv-python -c \"import io,re,yaml; F=chr(96)*3; t=io.open('docs/DECISIONS.md',encoding='utf-8').read(); m=re.search(r'^## Decision (\\d+): Production destructive GC[^\\n]*\\n+'+F+r'yaml\\n(.*?)\\n'+F, t, re.S|re.M); assert m, 'no Decision heading with a fenced yaml envelope'; e=yaml.safe_load(m.group(2)); assert e['number']==int(m.group(1)), 'envelope number disagrees with the heading'; assert e['significance']['value']=='numbered_decision', e['significance']; assert (e['significance'].get('justification') or '').strip(), 'significance justification is empty'; assert not (e.get('amends') or []), 'this Decision amends nothing -- 88/188/191 are related'; d88=re.search(r'^## Decision 88:.*?(?=^## Decision )', t, re.S|re.M); assert d88, 'Decision 88 section not found'; assert 'ObservabilityMetricRead' in d88.group(0), 'the cl.2 annotation must land INSIDE Decision 88, not merely somewhere in the file'; print('decision envelope ok')\""
    hermetic: true
    expected: >-
      The Decision heading exists, its fenced yaml envelope parses, number agrees with the heading,
      significance is numbered_decision with a non-empty justification, amends is empty, and the
      ObservabilityMetricRead annotation lands INSIDE the Decision 88 section -- a whole-file grep
      would be satisfied by the new entry's own body, which is why this is section-scoped.
    fix_if: >-
      A heading and prose clauses with no envelope -- decision-entry.yaml
      metadata_envelope.required_fields is [number, significance] and
      validate_decision_entry_conformance fails the entry.
    graduation: graduate
    graduation_check_id: gc-decision-envelope-and-annotation
  - step: 11
    phase: pre-deploy
    action: >-
      Prove T2.18 c2 no longer carries the unadjudicable text.
    command: "bin/venv-python -c \"import yaml,io,json; d=yaml.safe_load(io.open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); assert 'S3 storage confirmed stable after N maintenance cycles' not in json.dumps(d), 'c2 still carries the unadjudicable text'; print('c2 rewritten')\""
    hermetic: true
    expected: >-
      c2 no longer reads "S3 storage confirmed stable after N maintenance cycles".
    fix_if: >-
      c2 still carries the original -- that text is satisfied by a job deleting the whole prefix, so a
      follow-on could never honestly flip it met.
    graduation: graduate
    graduation_check_id: gc-c2-criterion-rewritten
  - step: 12
    phase: pre-deploy
    action: >-
      Full-tier validation before handoff.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0. This is where the amended test_admin_tf_has_exactly_one_alarm_block surfaces if it was
      left asserting == 1 against a file that now has two alarm blocks, and where
      test_alarm_descriptions_retain_provenance_tag surfaces if the new alarm was placed first.
    fix_if: >-
      Any check fails -- resolve before commit per handoff_policy.
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Confirm the governed CD channel deployed the handler carrying action=gc_ops BEFORE anything
      invokes the verb, and record the data-pipeline disposition on its true premise.
    command: "echo 'DISPATCH VIA MCP: mcp__github__actions_get for deploy-ducklake-lambdas.yml on the squash-merge commit. It must be green for ducklake_maintenance before VP14.'"
    expected: >-
      deploy-ducklake-lambdas.yml is green for the merge commit for ducklake_maintenance, and the
      maintenance smoke-gate passed (Decision 79 / CD.16 V3 tier). data-pipeline is the second
      affected artifact and requires NO deploy -- but NOT because its zip is unchanged: it IS
      changed, because docs/ROADMAP-PLATFORM.yaml is a bundled ASSET of that artifact
      (src/lambdas/data-pipeline/manifest.yaml:44) and this plan rewrites c2 in it. The correct
      ground is that the delta is INERT and unreachable by CD: scheduled agents are disabled
      (Decisions 61/37/116), and neither deploy-prod-lambdas.yml's on.push.paths nor
      PROD_SOURCE_PATHSPECS (scripts/convergence_health/code_drift.py:227-238) covers docs/**, so
      no deploy fires and no stale-code drift alarm raises.
    fix_if: >-
      The DuckLake run is red or absent. Do NOT invoke the verb -- a dispatch before the code lands
      is a 400 that tells you nothing about GC. Never fall back to a local break-glass deploy; see
      docs/contracts/deploy-paths.yaml. If the inert-delta premise fails to hold at implement time
      (a scheduled agent re-enabled, or the asset read at runtime), dispatch deploy-prod-lambdas.yml
      via workflow_dispatch to discharge the Decision 79 / CD.16 obligation for data-pipeline.
  - step: 14
    phase: post-deploy
    action: >-
      BASELINE GATE, before anything destructive runs. Precondition (OPERATOR, not this command):
      invoke action=gc_ops with dry_run=true against ducklake_ops -- explicit data_path +
      meta_schema -- which writes nothing. The admin Function URL is AWS_IAM and CI holds no invoke
      grant, so the invoke stays human-run; the READ-BACK below is agent-executable on the
      ObservabilityMetricRead grant, so the assertion is a real command rather than prose that
      always exits 0. This gate asserts referenced-missing is ZERO and records GcWouldDeleteFiles as
      a PRE-EXPIRY LOWER BOUND -- not a headroom certificate, per limitation (c). The post-expiry
      figure is unknowable until a real pass has run, so it is read at VP16, not here: nothing in
      this plan performs a destructive pass before VP15 enables the schedule, and the rollback note
      says so.
      ON THE RECORDED DELTA: 3,418 tracked vs 3,415 objects for one table (measured 2026-09-12) is
      3 catalog-tracked paths absent from storage -- i.e. referenced-missing == 3, so this gate is
      PREDICTED TO TRIP unless the cause is removed first. Two candidate causes, and they are
      distinguishable. (1) A read-ordering race: gc_ops MUST collect the catalog live set FIRST and
      list storage SECOND. In that order an interleaved write appears as a spurious ORPHAN, which is
      harmless here; the reverse order manufactures exactly this 3-object referenced-missing
      signature. Implement the ordering (it is a scope obligation on ducklake_gc_ops and asserted by
      a test) and re-take the reading. (2) Genuinely missing referenced files, which is an incident
      predating this plan and must be root-caused before any destructive pass -- deleting more while
      three referenced files are already unaccounted for is exactly the condition the safety
      invariant exists to refuse.
    command: aws cloudwatch get-metric-data --profile agent_platform --start-time "$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --metric-data-queries '[{"Id":"rm","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcReferencedMissing"},"Period":3600,"Stat":"Maximum"}},{"Id":"wd","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcWouldDeleteFiles"},"Period":3600,"Stat":"Maximum"}}]'
    expected: >-
      GcReferencedMissing == 0 after the read-ordering rule is in place, nothing written by the
      dry-run, and GcWouldDeleteFiles reported. That figure is a pre-expiry LOWER BOUND: it
      establishes only that the backlog is not already over G4_MAX_DELETE_FILES (20,000). It is not
      a headroom certificate and must not be read as one -- VP16 takes the post-expiry figure.
    fix_if: >-
      Baseline referenced-missing is non-zero -- STOP, do not enable the schedule. A post-GC value
      of 3 is unattributable against a baseline of 3, so the safety invariant cannot adjudicate;
      root-cause the delta first (measurement race, or genuinely missing referenced files).
      SEPARATELY, if GcWouldDeleteFiles >= G4_MAX_DELETE_FILES the schedule must NOT be enabled
      either: bound_deletions defers the WHOLE pass above the cap with no partial drain
      (ducklake_maintenance_ops.py:129-160). This catalog has never had expire/cleanup/orphan run,
      so its backlog is unmeasured -- if it is over cap, every pass defers forever, the backlog can
      never shrink, the N=9 window produces zero deletions and c2 can never adjudicate. Do NOT raise
      G4 (this plan's own no-weakening constraint, Decision 55): that is rec-3871's bounded drain,
      and it needs a Decision. If the metrics read ABSENT rather than zero, the operator invoke did
      not happen or was denied -- check that before reading anything into the silence.
  - step: 15
    phase: post-deploy
    action: Enable the schedule, only after VP13 and VP14 both pass. This is the FIRST step in this plan that permits a destructive pass; everything before it is read-only.
    command: "echo 'OPERATOR STEP: flip the agent-platform-ducklake-maintenance-gc-ops EventBridge rule state DISABLED -> ENABLED via the governed infra apply, AFTER the CD deploy is green and the baseline reads zero with G4 headroom confirmed.'"
    expected: The rule is ENABLED and the handler already serves action=gc_ops.
    fix_if: The handler does not yet serve the verb -- the schedule would fire a 400 unknown action.
  - step: 16
    phase: post-deploy
    action: >-
      Assert the safety invariant on the first real destructive cycle, AND take the post-expiry
      GcWouldDeleteFiles reading that VP14 structurally could not. This is where limitation (c)
      closes: VP14's figure was a pre-expiry lower bound on a never-expired catalog, and after this
      pass that premise no longer holds, so the understatement shrinks to something the next pass's
      bound can be judged against. An AGENT-EXECUTABLE read, not an operator echo -- the dev role
      carries GetMetricData via platform_dev_policies.tf ObservabilityMetricRead (T2.48 / rec-2851).
    command: aws cloudwatch get-metric-data --profile agent_platform --start-time "$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --metric-data-queries '[{"Id":"rm","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcReferencedMissing"},"Period":86400,"Stat":"Maximum"}},{"Id":"snap","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcSnapshotsRetainedMin"},"Period":86400,"Stat":"Minimum"}},{"Id":"debt","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDebtRatio"},"Period":86400,"Stat":"Average"}},{"Id":"dsnap","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedSnapshots"},"Period":86400,"Stat":"Sum"}},{"Id":"dfiles","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedFiles"},"Period":86400,"Stat":"Sum"}},{"Id":"dorph","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedOrphans"},"Period":86400,"Stat":"Sum"}},{"Id":"wd","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcWouldDeleteFiles"},"Period":86400,"Stat":"Maximum"}}]'
    expected: >-
      GcReferencedMissing max == 0, GcSnapshotsRetainedMin >= 2 (catalog-level), GcDebtRatio
      present, the sum of GcDeletedSnapshots + GcDeletedFiles + GcDeletedOrphans > 0, and
      GcWouldDeleteFiles present and below G4_MAX_DELETE_FILES on this post-pass reading. Every one
      of these is a metric the gc_ops scope row obliges the pass to emit -- the query adjudicates
      nothing it did not ask for. A metric reading ABSENT rather than breached means the pass did
      not run or never reached its emission: treat absence as a FAILURE of this step, never a pass.
    fix_if: >-
      Any safety signal breaches -- this is an incident. Disable the rule and RCA before the next
      pass; never widen a bound to make it pass (Decision 55). A metric that reads ABSENT rather
      than breached is the namespace condition biting -- check it was emitted into
      DuckLakeMaintenance.
  - step: 17
    phase: post-deploy
    action: >-
      Adjudicate rec-3870 after the observation window, and confirm rec-3871 carries limitation (c).
      Both recs were filed at PLAN time, so this step resolves committed closers rather than
      remembering to create them -- but rec-3871 predates limitation (c)'s discovery, so its
      amendment is asserted here rather than assumed.
    command: "echo 'OPERATOR STEP: after N = 9 weekly gc_ops cycles, adjudicate rec-3870 against the rewritten c2 -- both the per-cycle safety invariant and the windowed GC-debt efficacy bound -- and close it via scripts.ops_data_portal. N = 9: 1 drain cycle excluded, ceil(max(grace 7, retention 30)/7) = 5 for a file to traverse write->supersede->grace->delete, plus 3 steady-state samples.'"
    expected: >-
      rec-3870 is adjudicated against nine cycles of real data and closed, T2.18 c2 flips met only
      if both assertions adjudicate true, and rec-3871's context names all THREE limitations -- the
      inert byte half, the whole-pass defer, and the pre-expiry/post-expiry bound mismatch -- with
      an acceptance probe that cannot be satisfied while (c) stands.
    fix_if: >-
      rec-3871 still names only two limitations -- then limitation (c) is owned by nobody and this
      plan's acceptance criterion 7 is false. Or fewer than nine cycles produced a deletion (see
      VP16's post-expiry G4 reading -- a permanently
      deferred pass yields a window with no deletions at all), or a safety signal breached during
      the window. Neither permits flipping c2 met: exit-criteria-ledger.yaml forbids a flip over
      text that does not adjudicate true at flip time.
test_obligations:
- source: src/common/ducklake_gc_verification.py
  behavior: referenced_missing, gc_debt_ratio and a NON-VACUOUS value-scanning read-path check are correct and discriminating.
  verification_step: 1
  test_selector: tests/common/test_ducklake_gc_verification.py
  red_green_expectation: Red before (target_absent, exit 4 -- measured; module and test file both absent), green after.
- source: tests/common/test_ducklake_gc_verification.py
  behavior: The shared-bug fixture is caught by the read-path check and nothing else; the vacuity fixture is caught by a
    value aggregate and not by a row count.
  verification_step: 1
  test_selector: tests/common/test_ducklake_gc_verification.py
  red_green_expectation: Red before (file absent, exit 4 -- measured), green after.
- source: src/common/ducklake_gc_ops.py
  behavior: >-
    The live set enumerates every catalog table and takes no policy input; gc_ops runs no prelude,
    passes the catalog live set (never the storage map) as live_before, and emits every metric any
    verification step
    asserts -- GcReferencedMissing, GcWouldDeleteFiles, GcDebtRatio, GcDebtBytes, GcStorageObjects,
    GcSnapshotsRetainedMin and the three per-phase deleted counts.
  verification_step: 3
  test_selector: tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal::test_policy_excluded_table_live_file_is_in_the_guard_live_set
  red_green_expectation: Red before (target_absent, exit 4 -- measured), green after. This is the plan central correctness
    assertion.
- source: tests/common/test_ducklake_gc_ops.py
  behavior: TestGuardLiveSetIsUniversal exists and reddens if the live set is derived from resolve_scope or any policy input.
  verification_step: 3
  test_selector: tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal::test_policy_excluded_table_live_file_is_in_the_guard_live_set
  red_green_expectation: Red before (file and node absent, exit 4 -- measured), green after.
- source: src/common/ducklake_gc_ops.py
