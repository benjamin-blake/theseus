schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: production-gc-and-storage-stability
intent: >-
  Turn on destructive garbage collection against the production DuckLake catalog behind a
  per-cycle safety invariant that can see over-reclaim, and start the observation window whose
  completion a follow-on plan uses to close T2.18 c2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-production-gc-and-storage-stability.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_gc_verification.py
    action: Create
    purpose: >-
      Post-pass verification, split pure-predicate from connection-owning exactly as Decision 188
      split ducklake_maintenance_ops. SAFETY: referenced_missing(live_paths, storage_paths) -- the
      |L \ S| direction, which is the over-reclaim signal a storage-size metric structurally cannot
      see (deleting live data makes storage look BETTER). EFFICACY: gc_debt_ratio(storage_bytes,
      live_bytes) -- (S-L)/L, the quantity GC controls, since absolute prefix bytes legitimately
      grow with ingestion. Also the INDEPENDENT safety check: verify_read_path(con, snapshot_ids)
      re-reads each table AT (VERSION => its pass-start id) and compares row count. That check
      exists because referenced_missing shares the live set L with the delete-set computation, so a
      bug in the live-file function corrupts the action and its own check identically -- the
      recorded Iceberg remove_orphan_files failure class (s3:// vs s3a://, double slashes,
      URL-encoded paths making a live file look unreferenced).
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      New admin action_gc_ops. The verb is gc_ops, NOT gc: gc is already taken by the SMOKE host's
      weekly disposable-catalog pass (docs/contracts/ducklake_maintenance.yaml verbs.gc, measured),
      and the contract's own precedent for a production counterpart of a smoke verb is the
      merge -> merge_ops rename. Reusing gc would give one verb name two opposite scope semantics
      across two hosts. It requires an explicit data_path + meta_schema in the event and refuses a
      no-arg invoke, mirroring action_merge_ops. It resolves table scope by catalog enumeration
      crossed with the maintenance_policy matrix's gc_ops column (Decision 191's mechanism), NOT
      from GC_TABLE_SCOPE. It reuses the SAME G1-G4 fail-closed guard set the smoke gc path runs
      (Decision 188) -- this plan adds a host and a scope, never a second guard implementation. Per
      pass it records each table's pass-start snapshot id, runs the guarded destructive sequence,
      then emits GcReferencedMissing, GcDebtBytes, GcDebtRatio, GcStorageObjects,
      GcSnapshotsRetainedMin and per-phase GcDeleted{Snapshots,Files,Orphans}. A non-zero
      GcReferencedMissing or a failed read-path check RAISES -- safety is an incident, never a
      trend.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Add gc_ops to the matrix with a cell per class. scd2 and append_only apply true;
      control apply FALSE with the reason -- rec-3762 measured ops_entity_counters' files as LIVE
      rather than superseded, so destructive GC reclaims almost nothing there while adding
      expire/cleanup contention on the writer-owned allocation serialization point (Decision 84
      I-2). The exclusion is a declared cell with a reason, never an absence.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: GENERATED projection carrying the gc_ops column to the Lambda. Never hand-edited; regenerate via scripts.schema_to_field_semantics.
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: >-
      Add gc_ops to VERB_UNIVERSE, which is ("merge_ops",) today (measured at line 27). This
      constant -- NOT the check -- is where the declared verb universe lives;
      validate_maintenance_policy_matrix.py imports it and needs no edit, its verb_universe
      parameter being a test-injection seam. Decision 191 cl.2 requires the universe stay declared
      independently of maintenance_policy's own keys, or the gate becomes the blind oracle it was
      built to close.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: >-
      Weekly production gc_ops EventBridge rule + target + lambda permission, mirroring the
      merge_ops rule at lines 229-250. Resource "ducklake_maintenance_gc_ops", name
      "agent-platform-ducklake-maintenance-gc-ops" -- the un-suffixed
      "agent-platform-ducklake-maintenance-gc" is ALREADY TAKEN by the smoke rule
      (terraform/personal/ducklake_maintenance_smoke.tf:243, measured), so the obvious name is a
      hard apply-time collision. Created state = "DISABLED": Decisions 125/126 deploy the handler
      and the rule through DIFFERENT channels, so an ENABLED rule from the infra apply can fire
      action=gc_ops before the handler carrying the verb deploys -- a scheduled 400. VP12 enables
      it only after the baseline reads zero. Also a CloudWatch alarm on GcReferencedMissing >= 1.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Document the admin gc_ops verb (payload, response_codes, typed_errors) alongside the existing
      smoke gc verb, and add the amendment_log entry with an honest change_class -- this adds a
      verb, so not prose_improvement. The amendment_log holds 2 entries today (measured).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New Decision (body drafted in context) recording the Decision 88 cl.4 gate-clear and the c2
      criterion reframe. Plus a dated annotation on Decision 88 cl.2, whose parenthetical "the DR
      bucket and direct CloudWatch reads are IAM-blocked from the dev role by design" is factually
      stale -- platform_dev_policies.tf's ObservabilityMetricRead Sid (T2.48 / rec-2851) grants
      GetMetricStatistics / GetMetricData / ListMetrics, which this plan's read-back depends on.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Rewrite T2.18 c2's text from "S3 storage confirmed stable after N maintenance cycles" to the
      two assertions that actually adjudicate. STRENGTHENING, not weakening: the original is
      satisfied by a job that deletes the whole prefix, since over-reclaim reduces storage. Status
      stays OPEN -- exit-criteria-ledger.yaml forbids flipping met over text that does not
      adjudicate true at flip time, and N cycles have not elapsed.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle the new verification module into the admin maintenance zip.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: Exclude the new module from data-pipeline, mirroring the ducklake_maintenance_ops and ducklake_maintenance_scope exclusions.
  - file: tests/common/test_ducklake_gc_verification.py
    action: Create
    purpose: >-
      Unit coverage for referenced_missing, gc_debt_ratio and verify_read_path, with red cases:
      an over-reclaim fixture (a live path absent from storage) that MUST trip, a shared-bug
      fixture where the live-file function is wrong in both the action and referenced_missing and
      only the read-path check catches it, and a debt-ratio fixture at the bound.
  - file: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
    action: Create
    purpose: >-
      action_gc_ops requires explicit data_path and meta_schema and refuses a no-arg invoke;
      resolves scope from the matrix's gc_ops column with control excluded; raises on non-zero
      referenced-missing rather than returning ok. Also hosts TestSmokeScopeNotRepointed, which
      SHIPS the Decision 143 cl.2 never-weaken invariant as a standing regression test rather than
      leaving it as a plan-time grep that is green by construction.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Modify
    purpose: The gate rejects a matrix missing a gc_ops cell for any class, and rejects a false gc_ops cell with no reason.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    action: Modify
    purpose: >-
      New class TestProductionGcRuleInvariants: the gc_ops rule is created DISABLED, and no
      aws_s3_bucket_lifecycle_configuration targets the data-lake bucket -- a lifecycle expiration
      rule over the lakehouse prefix is over-reclaim by configuration, deleting live Parquet on an
      age rule the catalog knows nothing about.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - terraform/personal/ducklake_maintenance.tf
acceptance_criteria:
  - >-
    A new admin action_gc_ops exists on ducklake_maintenance, requires explicit data_path +
    meta_schema, and refuses a no-arg invoke. The verb is gc_ops because gc already names the SMOKE
    host's disposable-catalog pass; the merge -> merge_ops precedent in the same contract governs.
    GC_TABLE_SCOPE is UNCHANGED and still consumed only by the smoke handler -- Decision 143 cl.2
    env-pins the smoke dispatch to the disposable catalog, so repointing that constant at production
    is forbidden, and that invariant SHIPS as a test rather than a plan-time grep.
  - >-
    The maintenance_policy matrix declares gc_ops for all three classes: scd2 and append_only apply
    true, control apply false carrying the rec-3762 reason. The exhaustiveness gate fails a missing
    gc_ops cell, and gc_ops is added to VERB_UNIVERSE in src/common/ducklake_maintenance_scope.py --
    the DECLARED universe the gate imports, never read from the matrix's own keys.
  - >-
    SAFETY, asserted every cycle and never retired: after each destructive pass
    GcReferencedMissing == 0, every table re-reads at its pass-start snapshot id with unchanged row
    count, and snapshots retained >= 2 per table. Any breach raises; it is an incident, not a trend.
  - >-
    The read-path check is INDEPENDENT of the delete-set computation. A fixture in which the
    live-file function is wrong in both the action and referenced_missing is caught by the
    read-path check and by nothing else.
  - >-
    EFFICACY is expressed as GC DEBT, not absolute storage: GcDebtRatio = (storage_bytes -
    live_bytes) / live_bytes, emitted post-pass, with GcDebtBytes and GcStorageObjects alongside.
    Absolute prefix bytes are not the assertion -- live bytes legitimately grow with ingestion.
  - >-
    Each destructive phase emits its own deleted count, so a window in which nothing was deleted
    cannot read as success. "Stable" is never vacuously true.
  - >-
    The production gc_ops EventBridge rule is created DISABLED, named
    agent-platform-ducklake-maintenance-gc-ops (the un-suffixed name belongs to the smoke rule), and
    is enabled only after the baseline assertion passes. The infra and code channels are separate
    (Decisions 125/126), so an ENABLED rule can otherwise fire before the handler carrying the verb
    exists.
  - >-
    The measurement uses managed primitives for storage (ListObjectsV2) and for the sink
    (CloudWatch); only the catalog-to-storage JOIN is application code, and the plan records why --
    no managed service has catalog semantics, which is why Iceberg, Delta and Hudi all ship their
    own orphan and fsck tooling.
  - >-
    No aws_s3_bucket_lifecycle_configuration targets the data-lake bucket. A lifecycle expiration
    rule over the lakehouse prefix would delete live Parquet on an age rule the catalog knows
    nothing about -- over-reclaim by configuration.
  - >-
    T2.18 c2's text is rewritten to the safety and efficacy assertions and its status stays OPEN.
    The follow-on rec that closes it after N = 9 cycles is filed at implement time.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the verification predicates hold, including the shared-bug fixture only the read-path check can catch.
    command: bin/venv-python -m pytest tests/common/test_ducklake_gc_verification.py -q
    expected: All pass, including the over-reclaim fixture, the shared-bug fixture and the debt-ratio bound case.
    fix_if: >-
      The shared-bug fixture passes without the read-path check -- referenced_missing and the
      delete-set share the live set, so a test that only exercises referenced_missing cannot
      distinguish a correct live-file function from a broken one.
    graduation: graduate
    graduation_check_id: gc-verification-predicates-discriminate
  - step: 2
    phase: pre-deploy
    action: Prove action_gc_ops requires explicit params, resolves scope from the matrix, and raises on referenced-missing.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_gc_action.py -q
    expected: No-arg invoke refused; control class excluded by its policy cell; non-zero referenced-missing raises rather than returning ok.
    fix_if: A non-zero referenced-missing returns 200 -- safety must raise, never report.
    graduation: graduate
    graduation_check_id: admin-gc-ops-action-contract
  - step: 3
    phase: pre-deploy
    action: Prove the matrix declares gc_ops for every class with control excluded and reasoned.
    command: "bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('config/lambda/ducklake/field_semantics.static.yaml',encoding='utf-8')); m=d['maintenance_policy']; assert set(m)=={'scd2','append_only','control'}, m.keys(); assert all('gc_ops' in c for c in m.values()), 'a class has no gc_ops cell'; assert m['control']['gc_ops']['apply'] is False and m['control']['gc_ops'].get('reason'), 'control gc_ops must be excluded WITH a reason'; assert m['scd2']['gc_ops']['apply'] is True and m['append_only']['gc_ops']['apply'] is True; print('gc_ops column declared')\""
    expected: Every class has a gc_ops cell; control is false with a reason; scd2 and append_only are true.
    fix_if: A class lacks a gc_ops cell, or control is excluded without a reason -- an absence is not a declared exclusion.
    graduation: graduate
    graduation_check_id: maintenance-policy-gc-ops-column-declared
  - step: 4
    phase: pre-deploy
    action: Prove the shipped never-weaken test holds -- GC_TABLE_SCOPE was not repointed at production (Decision 143 cl.2 env-pinning).
    command: bin/venv-python -m pytest "tests/lambdas/ducklake_maintenance/handler/test_gc_action.py::TestSmokeScopeNotRepointed::test_gc_table_scope_still_holds_the_smoke_pair" "tests/lambdas/ducklake_maintenance/handler/test_gc_action.py::TestSmokeScopeNotRepointed::test_admin_handler_never_reads_gc_table_scope" -q
    expected: Both nodes pass -- GC_TABLE_SCOPE still holds the smoke pair, and the admin handler never references it.
    fix_if: >-
      The admin handler reads GC_TABLE_SCOPE, or the constant changed. Production scope comes from
      catalog enumeration crossed with the matrix's gc_ops column; repointing the constant aims the
      SMOKE function at production, which Decision 143 cl.2 forbids.
    graduation: graduate
    graduation_check_id: gc-table-scope-stays-smoke-only
  - step: 5
    phase: pre-deploy
    action: Prove the contract documents the gc_ops verb, keeps the smoke gc verb, and carries an honest amendment entry.
    command: "bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8')); assert 'gc_ops' in d['verbs'], 'gc_ops verb undocumented'; assert 'gc' in d['verbs'], 'the smoke gc verb must survive the addition'; a=d['amendment_log']; assert len(a)>=3, 'no amendment entry appended (2 exist today)'; assert a[-1]['change_class'] != 'prose_improvement', 'adding a verb is not a prose improvement'; print('contract + amendment ok')\""
    expected: Both gc_ops and gc are documented, a third amendment entry exists, and it is not prose_improvement.
    fix_if: Still prose_improvement, or gc_ops was added by RENAMING the smoke gc verb rather than alongside it.
    graduation: graduate
    graduation_check_id: gc-ops-verb-contract-and-amendment
  - step: 6
    phase: pre-deploy
    action: Prove the terraform invariants -- the gc_ops rule created DISABLED, and no lifecycle rule on the data-lake bucket.
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_is_created_disabled" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_no_lifecycle_configuration_targets_the_data_lake_bucket" -q
    expected: The gc_ops rule's state is DISABLED, and no aws_s3_bucket_lifecycle_configuration targets aws_s3_bucket.data_lake.
    fix_if: >-
      The rule is ENABLED -- Decisions 125/126 deploy rule and handler separately, so it can fire
      before the verb exists. Or a lifecycle rule targets the data lake, which is over-reclaim by
      configuration. Or the node ids do not resolve -- run pytest --collect-only before trusting a
      red (rec-3865).
    graduation: graduate
    graduation_check_id: gc-ops-rule-disabled-and-no-lakehouse-lifecycle
  - step: 7
    phase: pre-deploy
    action: Prove the matrix exhaustiveness gate now covers gc_ops and still declares its universes independently.
    command: bin/venv-python -m pytest "tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_missing_gc_ops_cell_fails" "tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_gc_ops_false_cell_without_reason_fails" -q
    expected: A matrix missing a gc_ops cell fails, and a false gc_ops cell without a reason fails.
    fix_if: gc_ops was added to the check file instead of to VERB_UNIVERSE in src/common/ducklake_maintenance_scope.py, or the gate reads it from the matrix's own keys -- Decision 191 cl.2.
    graduation: graduate
    graduation_check_id: policy-matrix-gate-covers-gc-ops
  - step: 8
    phase: pre-deploy
    action: Prove the new module ships and the regenerated asset carries the gc_ops column.
    command: "bin/venv-python -m pytest tests/lambda_manifest/test_bundle_checks.py -q && bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('config/lambda/ducklake/field_semantics.yaml',encoding='utf-8')); assert all('gc_ops' in c for c in d['maintenance_policy'].values()), 'gc_ops column absent from the bundled asset'; print('asset carries gc_ops')\""
    expected: Bundle checks pass, regeneration is clean, and the generated asset carries the gc_ops column.
    fix_if: The gc_ops column is in the sidecar but not the generated asset -- regenerate; never hand-edit field_semantics.yaml.
    graduation: graduate
    graduation_check_id: gc-ops-column-reaches-lambda-asset
  - step: 9
    phase: pre-deploy
    action: Prove the registration companions landed -- the Decision, its cl.2 annotation, and the rewritten c2 text.
    command: "grep -qE '^## Decision [0-9]+: Production destructive GC is licensed by a safety invariant' docs/DECISIONS.md && grep -q 'ObservabilityMetricRead' docs/DECISIONS.md && bin/venv-python -c \"import yaml,io,json; d=yaml.safe_load(io.open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); assert 'S3 storage confirmed stable after N maintenance cycles' not in json.dumps(d), 'c2 still carries the unadjudicable text'; print('c2 rewritten')\""
    expected: The Decision exists, the cl.2 annotation names the stale grant, and c2 no longer carries the unadjudicable wording.
    fix_if: >-
      c2 still reads "storage confirmed stable" -- that text is satisfied by a job deleting the
      whole prefix, so a follow-on could never honestly flip it met.
    graduation: graduate
    graduation_check_id: gc-registration-companions
  - step: 10
    phase: pre-deploy
    action: Full-tier validation before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Any check fails -- resolve before commit per handoff_policy.
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      BASELINE GATE, before any destructive pass. Resolve the recorded catalog-vs-storage delta
      (3,418 tracked vs 3,415 objects for one table, measured 2026-09-12) and assert
      referenced-missing is ZERO across the production catalog.
    command: "echo 'OPERATOR STEP: invoke action=gc_ops with dry_run=true against ducklake_ops (explicit data_path + meta_schema) and read GcReferencedMissing. It MUST be 0 before VP12 enables the schedule.'"
    expected: GcReferencedMissing == 0 at baseline.
    fix_if: >-
      Baseline is non-zero. STOP -- do not enable the schedule. A post-GC value of 3 is
      unattributable against a baseline of 3, so the safety invariant cannot adjudicate. Root-cause
      the delta first (measurement race, or genuinely missing referenced files).
  - step: 12
    phase: post-deploy
    action: Enable the schedule, only after VP11 reads zero.
    command: "echo 'OPERATOR STEP: flip the agent-platform-ducklake-maintenance-gc-ops EventBridge rule state DISABLED -> ENABLED via the governed infra apply, AFTER VP11 passes and after the handler carrying action=gc_ops has deployed.'"
    expected: The rule is ENABLED and the handler already serves action=gc_ops.
    fix_if: The handler does not yet serve the verb -- the schedule would fire a 400 unknown action.
  - step: 13
    phase: post-deploy
    action: Assert the safety invariant on the first real destructive cycle.
    command: "echo 'DISPATCH VIA MCP: mcp__github__get_job_logs / CloudWatch GetMetricData for GcReferencedMissing, GcSnapshotsRetainedMin and the read-path check result on the first scheduled pass.'"
    expected: GcReferencedMissing == 0, snapshots retained >= 2 per table, read-path row counts unchanged, and at least one phase deleted > 0.
    fix_if: >-
      Any safety signal breaches -- this is an incident. Disable the rule and RCA before the next
      pass; never widen a bound to make it pass (Decision 55).
  - step: 14
    phase: post-deploy
    action: File the follow-on rec that closes T2.18 c2 after the observation window.
    command: "echo 'OPERATOR STEP: file via scripts.ops_data_portal a rec to adjudicate the rewritten c2 after N = 9 weekly cycles -- 1 drain cycle excluded, ceil(30/7)=5 for a file to traverse write->supersede->grace->delete at the 30-day retention floor, plus 3 steady-state samples. Record its id in this plan history.'"
    expected: A follow-on rec exists naming N = 9 and the two assertions to adjudicate.
    fix_if: No rec filed -- the window would elapse with nothing scheduled to close the criterion.
test_obligations:
  - source: src/common/ducklake_gc_verification.py
    behavior: referenced_missing, gc_debt_ratio and the independent read-path check are correct and discriminating.
    verification_step: 1
    test_selector: tests/common/test_ducklake_gc_verification.py
    red_green_expectation: Red before (module absent), green after.
  - source: tests/common/test_ducklake_gc_verification.py
    behavior: The shared-bug fixture is caught by the read-path check and by nothing else.
    verification_step: 1
    test_selector: tests/common/test_ducklake_gc_verification.py
    red_green_expectation: Red before (file absent), green after.
  - source: src/lambdas/ducklake_maintenance/handler.py
    behavior: action_gc_ops requires explicit params, excludes the control class, and raises on referenced-missing.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
    red_green_expectation: >-
      Red before (target_absent, exit 4 -- measured). _ACTIONS holds no gc or gc_ops entry on the
      admin handler. Green after.
  - source: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
    behavior: The admin gc_ops verb's contract is exercised.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
    red_green_expectation: Red before (file absent), green after.
  - source: config/lambda/ducklake/field_semantics.static.yaml
    behavior: The gc_ops column is declared for all three classes with control excluded and reasoned.
    verification_step: 3
    command: "bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('config/lambda/ducklake/field_semantics.static.yaml',encoding='utf-8')); m=d['maintenance_policy']; assert set(m)=={'scd2','append_only','control'}, m.keys(); assert all('gc_ops' in c for c in m.values()), 'a class has no gc_ops cell'; assert m['control']['gc_ops']['apply'] is False and m['control']['gc_ops'].get('reason'), 'control gc_ops must be excluded WITH a reason'; assert m['scd2']['gc_ops']['apply'] is True and m['append_only']['gc_ops']['apply'] is True; print('gc_ops column declared')\""
    red_green_expectation: Red before -- the matrix declares only merge_ops (measured). Green after.
  - source: config/lambda/ducklake/field_semantics.yaml
    behavior: The gc_ops column reaches the bundled Lambda asset through a reproducible regeneration.
    verification_step: 8
    command: "bin/venv-python -m pytest tests/lambda_manifest/test_bundle_checks.py -q && bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('config/lambda/ducklake/field_semantics.yaml',encoding='utf-8')); assert all('gc_ops' in c for c in d['maintenance_policy'].values()), 'gc_ops column absent from the bundled asset'; print('asset carries gc_ops')\""
    red_green_expectation: Red before -- the generated asset has no gc_ops column. Green after.
  - source: src/common/ducklake_maintenance_scope.py
    behavior: VERB_UNIVERSE gains gc_ops, so the exhaustiveness gate covers it with the universe still declared independently.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_missing_gc_ops_cell_fails
    red_green_expectation: >-
      Red before (target_absent) -- VERB_UNIVERSE is ("merge_ops",) today, so a missing gc_ops cell
      passes and no fixture exercising it exists. Green after.
  - source: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    behavior: The gate's gc_ops red cases exist -- a missing cell and a false cell with no reason.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_missing_gc_ops_cell_fails
    red_green_expectation: Red before (node absent, exit 4 -- measured), green after.
  - source: terraform/personal/ducklake_maintenance.tf
    behavior: The gc_ops rule is created DISABLED and no lifecycle rule targets the data lake.
    verification_step: 6
    test_selector: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_is_created_disabled
    red_green_expectation: Red before (node absent, exit 4 -- measured; the rule does not exist), green after.
  - source: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
