    phase: post-deploy
    action: >-
      Assert the safety invariant on the first real destructive cycle. This is an AGENT-EXECUTABLE
      read, not an operator echo -- the dev role carries GetMetricData via platform_dev_policies.tf
      ObservabilityMetricRead (T2.48 / rec-2851).
    command: aws cloudwatch get-metric-data --profile agent_platform --start-time "$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --metric-data-queries '[{"Id":"rm","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcReferencedMissing"},"Period":86400,"Stat":"Maximum"}},{"Id":"snap","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcSnapshotsRetainedMin"},"Period":86400,"Stat":"Minimum"}},{"Id":"debt","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDebtRatio"},"Period":86400,"Stat":"Average"}},{"Id":"dsnap","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedSnapshots"},"Period":86400,"Stat":"Sum"}},{"Id":"dfiles","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedFiles"},"Period":86400,"Stat":"Sum"}},{"Id":"dorph","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcDeletedOrphans"},"Period":86400,"Stat":"Sum"}},{"Id":"cutoff","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcEffectiveOlderThanDays"},"Period":86400,"Stat":"Minimum"}}]'
    expected: >-
      GcReferencedMissing max == 0, GcSnapshotsRetainedMin >= 2 (catalog-level), GcDebtRatio
      present, GcEffectiveOlderThanDays present, and the sum of GcDeletedSnapshots +
      GcDeletedFiles + GcDeletedOrphans > 0. Every one of these is a metric the gc_ops scope row
      obliges the pass to emit -- the query adjudicates nothing it did not ask for.
    fix_if: >-
      Any safety signal breaches -- this is an incident. Disable the rule and RCA before the next
      pass; never widen a bound to make it pass (Decision 55). A metric that reads ABSENT rather
      than breached is the namespace condition biting -- check it was emitted into
      DuckLakeMaintenance.
  - step: 16
    phase: post-deploy
    action: >-
      Adjudicate rec-3870 after the observation window. The rec was filed at PLAN time, so this step
      resolves a committed closer rather than remembering to create one.
    command: "echo 'OPERATOR STEP: after N = 9 weekly gc_ops cycles, adjudicate rec-3870 against the rewritten c2 -- both the per-cycle safety invariant and the windowed GC-debt efficacy bound -- and close it via scripts.ops_data_portal. N = 9: 1 drain cycle excluded, ceil(max(grace 7, retention 30)/7) = 5 for a file to traverse write->supersede->grace->delete, plus 3 steady-state samples.'"
    expected: rec-3870 is adjudicated against nine cycles of real data and closed, and T2.18 c2 flips met only if both assertions adjudicate true.
    fix_if: >-
      Fewer than nine cycles produced a deletion (see VP13's G4 headroom gate -- a permanently
      deferred pass yields a window with no deletions at all), or a safety signal breached during
      the window. Neither permits flipping c2 met: exit-criteria-ledger.yaml forbids a flip over
      text that does not adjudicate true at flip time.
