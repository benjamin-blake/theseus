constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NEVER weaken a guard, bound or retry budget to make a signal pass. A safety breach is an
    incident: disable the schedule and RCA. Precedent set by the rec-3802 resolution (PR #1175) --
    when a guard trips on a fixture, fix the fixture.
  - >-
    Do NOT repoint GC_TABLE_SCOPE at production. Decision 143 cl.2 env-pins the smoke dispatch to
    the disposable catalog; production scope comes from enumeration crossed with the matrix.
  - >-
    NEVER add an S3 lifecycle expiration rule over the lakehouse prefix. It would delete live
    Parquet on an age rule the catalog knows nothing about -- over-reclaim by configuration, which
    no guard in the GC path can see.
  - The rule ships DISABLED. Enabling is a separate, gated step after the baseline reads zero.
  - field_semantics.yaml is GENERATED -- edit the sidecar and regenerate.
  - Never edit logs/*.jsonl directly; rec writes go through scripts.ops_data_portal (Decision 84).
context:
  - "decision-scout verdict: FLAGS_FOUND. Decisions triaged: 144 of 144"
  - "Roadmap items intersected: K: 3; CONFLICT: 0; RELATED: 2"
  - "CITE: Decision 88 (cl.4 is the gate this plan clears; cl.1(iii); cl.2 stale parenthetical annotated), Decision 188 (G1-G4 guard the destructive path, REUSED by gc_ops not reimplemented; cl.6), Decision 191 (cl.2 universes declared independently), Decision 81 (cl.6 fixes weekly cadence + retention floor + >=7d grace + no scheduled cleanup_all), Decision 143 (cl.1/cl.2 admin-only host, smoke env-pinned), Decision 84 (I-2 writer-owned counter), Decision 125/126 (two channels -- rule and handler deploy separately), Decision 129 (pt 1 EventBridgeRead covers agent-platform-* rules), Decision 119 (terraform plan is CI-delegated from CC-web), Decision 100 (managed primitives), Decision 55, Decision 79, Decision 150/177 (annotation dialect)"
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    CI-RCA DEFERRAL (Related-Work Check: all three fail). rec-3861 and rec-3863 are ruff-0.16.7
    ISC004 regressions on requirements-dev.txt and scripts/checks/_scaffolding.py -- no shared scope
    file, no shared Decision, different failure category. Deferred deliberately.
  - >-
    Decision 88 cl.4 GATE IS CLEARED, verified: the gate is the rec-2113 pg_restore drill; T2.26 c1
    is met (met_by 6cbfe6b1, 2026-07-04) and rec-2113 is closed. T2.18 c2's own text records the
    clearing. Decisions 188 and 191 both left cl.4 standing but untouched. No fresh drill required.
    Cite the clearing; do not restate the gate as open.
  - >-
    WHY THE CRITERION IS REWRITTEN. "S3 storage confirmed stable" is blind to over-reclaim --
    deleting live data makes storage look better, so a job that deleted the whole prefix would
    satisfy it. It is also unmeasurable as written: the data-lake bucket holds 12+ unrelated
    prefixes (agents/, convergence/, deploy-records/, lambda-packages/, recommendations/,
    tf-provider-mirror/, ...), so AWS/S3 bucket-wide metrics cannot isolate the lakehouse. And
    absolute storage on an ingesting lakehouse is not supposed to be stable. The rewrite is
    STRENGTHENING; status stays open per exit-criteria-ledger.yaml.
  - >-
    THE TRAP. referenced_missing shares the live set L with the delete-set computation, so a bug in
    the live-file function corrupts the action and its own check identically -- the recorded Iceberg
    remove_orphan_files class (s3:// vs s3a://, double slashes, URL-encoded paths). The read-path
    check (pass-start snapshot id, re-read AT VERSION, compare row count) is the INDEPENDENT
    assertion and the one the criterion rests on. A test that only exercises referenced_missing
    reproduces this workstream's recorded blind-oracle failure.
  - >-
    N = 9 weekly cycles, derived: 1 drain cycle excluded (it always looks like GC works) +
    ceil(max(grace 7, retention 30)/7) = 5 for a file to traverse write -> supersede -> grace ->
    delete inside the window + 3 steady-state samples (two points always fit a line). Constants
    measured at src/common/ducklake_maintenance.py:82-84.
  - >-
    Decision 100 justification to record verbatim in the plan's PR: no managed service has catalog
    semantics, so the catalog-to-storage join is inherently application state -- which is why
    Iceberg, Delta and Hudi all ship their own orphan/fsck tooling. AWS/S3 metrics are bucket-wide;
    Storage Lens gives prefix bytes but cannot separate live from dead and is blind to over-reclaim;
    S3 Inventory's crossover is 10^7-10^8 objects against ~13k here. Storage side uses
    ListObjectsV2 and the sink uses CloudWatch -- only the join is custom.
  - >-
    VERB NAMESPACE, measured 2026-09-14. docs/contracts/ducklake_maintenance.yaml already documents
    a gc verb -- the SMOKE host's weekly disposable-catalog pass -- and
    terraform/personal/ducklake_maintenance_smoke.tf:243 already owns the EventBridge rule name
    agent-platform-ducklake-maintenance-gc. The contract's own precedent for a production
    counterpart of a smoke verb is merge -> merge_ops, and VERB_UNIVERSE in
    src/common/ducklake_maintenance_scope.py is ("merge_ops",) -- i.e. it is the PRODUCTION verb
    namespace. The production verb is therefore gc_ops, with rule name
    agent-platform-ducklake-maintenance-gc-ops. Naming it gc would give one verb two opposite scope
    semantics across two hosts and collide on the rule name at apply time.
  - >-
    VERB_UNIVERSE LIVES IN src/common/ducklake_maintenance_scope.py:27, not in
    scripts/checks/contracts/validate_maintenance_policy_matrix.py, which imports it and whose
    verb_universe parameter is a test-injection seam. The check needs no edit.
  - >-
    DRAFTED DECISION. Heading: "## Decision NNN: Production destructive GC is licensed by a safety
    invariant that can see over-reclaim, not by a storage-size trend (Decided)". Three clauses.
    (1) The Decision 88 cl.4 gate is cleared by T2.26 c1 / rec-2113; destructive GC is licensed on
    the admin function only, scoped by declared class policy, never by repointing the smoke
    constant. (2) GC verification is two assertions: a per-cycle safety invariant (referenced-missing
    zero, read-path row counts unchanged, snapshot floor held) that raises on breach and never
    retires, and a windowed efficacy bound on GC DEBT rather than absolute storage. (3) T2.18 c2's
    text is rewritten to those assertions because the original is satisfied by a job that deletes
    everything; the rewrite strengthens and the criterion stays open until N cycles elapse.
    Annotates Decision 88 cl.2, whose IAM-blocked parenthetical was superseded by T2.48 / rec-2851.
