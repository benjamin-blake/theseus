constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NEVER weaken a guard, bound or retry budget to make a signal pass. A safety breach is an
    incident: disable the schedule and RCA. Precedent set by the rec-3802 resolution (PR #1175) --
    when a guard trips on a fixture, fix the fixture.
  - >-
    NEVER let any policy input reach the guard live set. The destructive verbs are catalog-wide;
    filtering the live set does not narrow what is deleted, it narrows what G1, G3 and
    referenced_missing can SEE.
  - >-
    NEVER add a gc_ops cell to maintenance_policy or a gc_ops entry to VERB_UNIVERSE. The matrix
    governs per-table-scoped verbs only -- its single production consumer is scope.resolve_scope at
    handler.py:396 -- and gc_ops has no per-table dimension, so a cell there is a CI-enforced field
    no code reads. A fixture may inject one to prove the guard ignores it; the shipped matrix may
    not carry one.
  - >-
    NEVER give gc_ops a per-table prelude. merge_ops already compacts every ops table 6-hourly and
    flush_inlined_data is a documented no-op; duplicating the merge adds writer-serialization
    contention (rec-3762) for nothing.
  - >-
    NEVER let gc_ops fall back to live_before for G4's candidate sizing. A would-delete path is by
    definition not live, so that join yields 0 for every candidate and leaves half a ratified guard
    inert -- rec-3773's exact fail-open condition, which Decision 188 exists to retire. gc_ops passes
    the ListObjectsV2 storage map as candidate_sizes, and an unknown size RAISES rather than
    counting as zero. The smoke path keeps its live_before default, unchanged.
  - >-
    Do NOT repoint GC_TABLE_SCOPE at production. Decision 143 cl.2 env-pins the smoke dispatch to
    the disposable catalog; production scope comes from catalog enumeration.
  - >-
    NEVER add an S3 lifecycle expiration rule over the lakehouse prefix. It would delete live
    Parquet on an age rule the catalog knows nothing about -- over-reclaim by configuration, which
    no guard in the GC path can see.
  - >-
    Emit every metric into the DuckLakeMaintenance CloudWatch namespace. The role's PutMetricData
    grant is conditioned on it, so a metric elsewhere is silently denied and reads as absent.
  - The rule ships DISABLED. Enabling is a separate, gated step after the CD deploy is green and the baseline reads zero with G4 headroom confirmed.
  - >-
    Do NOT raise the SLOC budget for src/lambdas/ducklake_maintenance/handler.py. It is at 458 of
    500 with no budget entry; Decision 128 makes decomposition the default and a raise a deliberate,
    marked exception.
  - Never edit logs/*.jsonl directly; rec writes go through scripts.ops_data_portal (Decision 84).
context:
  - "decision-scout verdict: FLAGS_FOUND. Decisions triaged: 144 of 144"
