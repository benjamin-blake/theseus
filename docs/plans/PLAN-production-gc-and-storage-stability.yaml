    command: "bin/venv-python -c \"import io,re,yaml; F=chr(96)*3; t=io.open('docs/DECISIONS.md',encoding='utf-8').read(); m=re.search(r'^## Decision (\\d+): Production destructive GC[^\\n]*\\n+'+F+r'yaml\\n(.*?)\\n'+F, t, re.S|re.M); assert m, 'no Decision heading with a fenced yaml envelope'; e=yaml.safe_load(m.group(2)); assert e['number']==int(m.group(1)), 'envelope number disagrees with the heading'; assert e['significance']['value']=='numbered_decision', e['significance']; assert (e['significance'].get('justification') or '').strip(), 'significance justification is empty'; assert 188 in (e.get('amends') or []), 'clause 5 amends Decision 188 -- declare it'; assert 191 not in (e.get('amends') or []), 'nothing in Decision 191 changes -- 191 is related, not amended'; assert 'ObservabilityMetricRead' in t, 'Decision 88 cl.2 annotation absent'; assert 'candidate_sizes' in t, 'the Decision 188 G4 byte-source amendment is not recorded'; print('decision envelope ok')\""
