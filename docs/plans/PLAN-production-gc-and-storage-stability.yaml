    functions over already-fetched path/byte sets, plus verify_read_path as the connection-owning
    independent check. verify_read_path must force a real data scan (aggregate over column VALUES),
    never a count(*) or a min/max that catalog metadata or column statistics can answer without
    touching storage. Keep the pure/connection split Decision 188 used.
  - >-
    Create src/common/ducklake_gc_ops.py holding the gc_ops pass body. Its live-set collection
    enumerates EVERY catalog table unconditionally; only the flush + merge_adjacent_files prelude
