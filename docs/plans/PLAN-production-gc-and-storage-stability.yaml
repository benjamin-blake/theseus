    terraform/personal/ducklake_maintenance.tf as resource "ducklake_maintenance_gc_ops" / name
    "agent-platform-ducklake-maintenance-gc-ops" (the un-suffixed name is the smoke rule's),
    state = "DISABLED", mirroring the merge_ops rule at lines 229-253, plus a CloudWatch alarm on
    GcReferencedMissing >= 1. Do not widen IAM.
  - Add both new modules to the maintenance manifest includes and the data-pipeline excludes.
  - >-
    Amend tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py's existing
