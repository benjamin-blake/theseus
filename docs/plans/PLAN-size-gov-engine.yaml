    d1cc5bb, so Decision 166 takes it to 119 -- ONE slot left. Max allocated number is 165.
    Combined live+archive is 667,556 of 700,000 bytes (32,444 free; mean entry 4,715 bytes), so a
    lean entry fits both ceilings. Decision 149's compaction is number-PRESERVING, so archival to
    docs/DECISIONS_ARCHIVE.md (Decision 146) is the only remaining header relief valve. Keep
    Decision 166 lean for this reason as well as for routing correctness.
  - >-
