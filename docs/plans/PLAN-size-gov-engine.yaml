    append-only with zero deletions, 66-167 lines each -- roughly 1,200 lines/month, because every
    graduating plan appends to it. A 500 cap grandfathered at current size would fail the next
    /implement PR, and the "each append is a reviewable cited raise" argument is FALSE:
    scripts.checks._marker_guard.authorization_failure matches the entry KEY and never its VALUE,
    so one marker permanently authorizes every future bump. That is Decision 128's own Problem
    statement reproduced. Resolution: a calibrated 6,000 ceiling (~1.8 months of runway) plus a
    pre-commitment in Decision 166 that when it fires the response is the CD.29 mark-then-drop
    archival lifecycle, NEVER a second raise (Decision 145 clause 3 shape). This is the audit's
    OWN prescribed valve for this class, not an exception to the rule the same PR installs:
    class_verdicts.config.relief_valve reads "archive/retire entries per lifecycle (valves 4/5);
    compact resolved rows; loud cited raise; decompose only where cohesion permits", with
    drain_owner naming the CD.29 lifecycle and stating the drain is NOT via file-splitting. The
    Python decompose-into-a-facade answer is explicitly Python-specific (audit Q4:
    sound-needs-generalization). Make that reasoning explicit in Decision 166's body.
  - >-
    A genuine two-gate collision, resolved structurally rather than by a workaround: Decision 132
    clause 2's implement-PR leg makes appending graduated verification rows MANDATORY pre-merge,
    while a tight cap on that same file would FAIL the PR adding them. The 6,000 ceiling is sized
    so both gates are satisfiable in one PR.
