constraints:
  - >-
    IMPLEMENTATION plan type only. STRATEGIC is frozen (Decision 67) and drains are human-planned
    recs, never executor work.
  - >-
    validate.py-first: a new check requires a scripts/checks/<domain>/ module with
    @registry.register, a sequence entry in scripts/checks/registry.py, AND a re-export line in
    scripts/validate.py. Never add a check to .github/workflows/ci.yml without adding it to
    validate.py first.
  - >-
    THE CRITICAL SEAM: the raise-guard MUST use make_section_extractor, never make_flat_extractor.
    The registry mixes a class table with flat rosters, so a flat extractor would parse
    `limit: 500` and `max_line_chars: 2000` as budget entries. Slice A built and tested this seam
    for exactly this consumer (docs/contracts/marker-grammar.yaml extractor_shapes).
  - >-
    Consume, never copy: scripts/checks/_marker_guard.py's eight-name surface (RegistrySpec,
    make_flat_extractor, make_section_extractor, default_base_reader, load_decision_bodies,
    authorization_failure, check_diff, check_present_markers) is the binding contract. This module
    is the sixth CONSUMER, not the sixth copy (SGE-07's whole point).
  - >-
    New modules stay under 500 effective lines and are NOT registered in config/sloc_budgets.yaml.
    Decompose within the package rather than raise (Decision 128, AGENTS.md SLOC governance). The
    enforcement must pass its own rule.
  - >-
    Exemption rationale is PROVENANCE and PRODUCTION-PATTERN based, NEVER consumer-tier based.
    Copy the audit's class_verdicts wording for generated ("no agent hand-edits a generated file;
    governance belongs on the producer"), workflow_outputs ("produced whole per run; post-merge
    edits are narrow FIELD FLIPS, never whole-file comprehension edits") and test_fixtures
    ("captured data asserted against, sometimes byte-for-byte; a cap is an NS-B tax"). Do not
    improvise tier-keyed reasons.
  - >-
    Every glob covers BOTH .yaml and .yml spellings. rec-2928 is open on exactly this defect and
    .github/ is 27 .yml to 1 .yaml today.
  - >-
    The counting rule is PINNED: non-blank lines whose first non-whitespace character is not `#`,
    applied verbatim to every class. No per-language comment handling. The audit records that its
    own regex block-comment stripper was fooled by `/*` inside AWS ARN strings ("...personal/*"
    through "Get*/List*" parsed as one giant comment) and that correct per-language counting needs
    a lexer -- the rule's simplicity is a determinism asset, not an oversight.
  - >-
    docs/ROADMAP-PLATFORM.yaml is FIXED under Decisions 114/147: do not edit it, do not split it,
    do not change _ROADMAP_MAX_LINES, and defer it by EXACT FILENAME (not by glob -- deferring the
    glob would leave docs/ROADMAP-PRODUCT.yaml governed by nothing, since
    validate_platform_roadmap.py hard-codes the one filename).
  - >-
    The roadmaps class row's `limit` is 500 -- the same standard limit every other governed class
    carries, NOT the audit's `class_verdicts.roadmaps.limit: 6000`. Stated explicitly because the
    scope row says to copy class_verdicts verbatim and this is the one deliberate departure: the
    designed 6,000 class ceiling is SGE-05's to ratify, and seeding it here would pre-empt a
    sibling slice's substantive call. 500 is the conservative, reversible choice and it holds
    today -- docs/ROADMAP-SEMANTO.yaml measures 134 effective lines and passes, ROADMAP-PRODUCT is
    pinned by its own roster entry, and ROADMAP-PLATFORM is deferred. It is also consistent with
    the audit's own roadmaps rationale that PLATFORM's treatment is "explicitly NOT a precedent
    for future roadmap files, which enter under the class ceiling".
  - >-
    docs/ROADMAP-PRODUCT.yaml is grandfathered at its current measured effective-line count only.
    Do NOT seed the designed 6,000 ceiling -- that call belongs to the sibling SGE-05 slice. For
    the record, the roadmaps relief valves are: compact in place (valve 4, proven by Decision 147),
    archive terminal items (valve 5), loud cited raise -- per-tier split is FORBIDDEN
    (Decisions 110/114).
  - >-
    Decision 166 carries ONLY the durable commitment, the 15 verbatim distinct roster keys, the amendments,
    the roster-expansion record, the CD.29 pre-commitment, reversal conditions and a
    `**Significance:**` marker. All mechanics live in config/structural_size_budgets.yaml
    (decision-entry.yaml significance.routing.field_semantics: field semantics belong in the
    owning contract/config, never in a numbered Decision). No new contract file is created -- the
    audit's DD-C puts the taxonomy home in the registry itself.
  - >-
    All 15 DISTINCT roster keys are named VERBATIM in Decision 166's body. Five are 2-segment keys for
    which scripts.checks._marker_guard._expand_ancestor_candidates generates NO ancestor
    candidate, so a directory mention cannot authorize them. Never grow RETRO_SCAN_GRANDFATHER to
    paper over an under-written Decision.
  - >-
    docs/decisions-index.json is REGENERATED via scripts.decisions_index, never hand-edited
    (validate_decisions_index_freshness runs in both tiers).
  - >-
    No rescue agents, no workaround loops (Decision 55). If a gate reds for a reason outside this
    scope, surface it as a recommendation via scripts/ops_data_portal -- do not fix it inline.
  - >-
    All recommendation writes go through `bin/venv-python -m scripts.ops_data_portal` (Single
    Portal Invariant). Call get_rec_write_guidance() before file_rec(). Never Edit or Write
    logs/.recommendations-log.jsonl -- it is a read cache, and a read cache is never a write
    source.
  - >-
    VP-step authoring hygiene (inherited from Slice A at cost): `! cmd` under `set -e` cannot fail
    (POSIX exempts inverted commands) -- use `if cmd; then echo FAIL; exit 1; fi`. A backticked
    literal in `expected` is extracted by validate_vp_replay and must genuinely appear in captured
    stdout+stderr, so `pytest -q` must not carry one. A grep that already passes on the unmodified
    tree is a vacuous assertion -- anchor every count on a measured population.

