schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: size-gov-engine
intent: >-
  Close audit findings SGE-01 (terraform has never been scanned by any size gate), SGE-02 (roster
  half -- machine-consumed config registries ungoverned) and SGE-04 (agent-consumed contracts
  accrete unguarded) by installing the structural-size governance class engine from
  draft_decision clauses 1-9 of audits/size-governance-expansion-3dee4a5.yaml: one registry
  (config/structural_size_budgets.yaml) carrying a first-match-wins class table plus flat per-file
  grandfather rosters, one limit gate (validate_structural_size_limits) in both presubmit tiers,
  and ONE raise-guard that binds to Slice A's shared scripts/checks/_marker_guard.py rather than
  minting a sixth copy. Completes the scope Decision 43 declared and Decision 130 extended
  whole-repo but implemented for Python only.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-size-gov-engine.yaml
phase: >-
  Platform governance-integrity. Slice B -- the KEYSTONE -- of the structural-size-governance-
  expansion overseer run driving audits/size-governance-expansion-3dee4a5.yaml (merged in #840) to
  completion. Audit-sourced; no tier_item id and no product-roadmap phase dependency. Consumes
  Slice A (Decision 165 / PLAN-size-gov-marker-guard, merged as d1cc5bb). Sibling slices SGE-05
  (ROADMAP-PRODUCT's designed 6,000 ceiling; the roadmap long-line companion; the raw-line
  gameability record) and SGE-03 (Decision 162 R3 body ratchet extended to workflow run: bodies,
  draft clause 8) land AFTER this slice and depend on the class table it installs.

scope:
  - file: config/structural_size_budgets.yaml
    action: Create
    purpose: >-
      The single new registry. Five top-level blocks, in this order (the order is load-bearing for
      the section extractors -- see the CRITICAL SEAM constraint):
      (1) `exclusions:` -- suffixes [".py", ".md"] and the vendored/tooling dir set
      {pip, lambda-packages, docker, .venv, node_modules, .git, personal_scripts}.
      (2) `generated_pinned:` -- the provenance-override membership list (row 1 of the class
      table). Load-bearing, NOT decorative: measured at d1cc5bb, docs/decisions-index.json,
      config/mypy_baseline.yaml, config/sloc_budgets.yaml and both tracked .terraform.lock.hcl
      files carry NO do-not-edit banner at all, so a banner-only test would drop
      docs/decisions-index.json (2,298 eff) into data_query and force a 17th roster entry.
      (3) `classes:` -- an ORDERED list of 12 rows, first-match-wins, each row carrying: slug,
      include globs (BOTH .yaml and .yml spellings wherever either can occur -- rec-2928),
      governed (bool), unit, limit, max_line_chars, actual_purpose (copied VERBATIM from the
      audit's class_verdicts), relief_valves, and for the roadmaps row a
      `defer_to_incumbent:` list holding the single exact filename docs/ROADMAP-PLATFORM.yaml.
      (4) `budgets:` -- the flat per-file effective-line grandfather roster (13 entries).
      (5) `long_line_budgets:` -- the flat per-file max-line-character grandfather roster (3
      entries).
      This file is also the field-semantics HOME for the class table, the counting rule, the glob
      grammar and the long-line threshold (Decision 86/127 collocation; the audit's own DD-C:
      "Taxonomy home: in the new registry itself"). It is a config registry, NOT a ritual
      contract -- no top-level `contract:`/`class:` block, so validate_contract_drift skips it
      (precedent: config/sloc_budgets.yaml, config/prose_budgets.yaml).
  - file: scripts/checks/structural/__init__.py
    action: Create
    purpose: >-
      Package marker only (mirrors scripts/checks/sloc/__init__.py, which is 1 line). Exempt from
      the SLOC gate by iter_gated_py_files' __init__.py skip; keep it that way -- do not turn it
      into a re-export facade carrying logic.
  - file: scripts/checks/structural/_classify.py
    action: Create
    purpose: >-
      The classification + measurement engine, shared by both new checks so their scan roots can
      never drift apart (the scripts/checks/sloc/_shared.py::iter_gated_py_files precedent).
      Provides: load_registry() (yaml.safe_load with a cached parse), classify_path(rel) ->
      slug implementing the layered first-match-wins key (exclusions, then the provenance
      override, then directory+extension globs, then the mandatory residual default),
      effective_lines(text), longest_line(text), and iter_measured_files() yielding
      (rel, slug) over `git ls-files` for every tracked, non-excluded, GOVERNED file --
      excluding exempt classes and excluding every path in the roadmaps row's
      defer_to_incumbent list. The provenance test is a NARROW banner regex over the first 10
      lines OR membership in generated_pinned. Must stay under 500 effective lines.
  - file: scripts/checks/structural/size_limits.py
    action: Create
    purpose: >-
      `validate_structural_size_limits`. Walks iter_measured_files(); for each file compares
      effective lines against (its `budgets:` entry if registered, else its class row's `limit`)
      and longest line against (its `long_line_budgets:` entry if registered, else its class
      row's `max_line_chars`). Registered in BOTH tiers, unscoped (no pre_globs), matching the
      validate_sloc_limits precedent -- measured whole-tree cost is 0.133s against Decision 73's
      300s budget, so pre_globs machinery would cost more complexity than it saves. Every failure
      message names the offending file's CLASS and that class row's recorded relief_valves, so
      the gate is actionable rather than a stop sign (the validate_decisions_size precedent).
      Must stay under 500 effective lines.
  - file: scripts/checks/structural/budget_raises.py
    action: Create
    purpose: >-
      `validate_structural_size_budget_raises` -- the SIXTH CONSUMER of
      scripts/checks/_marker_guard.py, never a sixth copy. Declares TWO module-level
      RegistrySpecs over the SAME rel_path (config/structural_size_budgets.yaml): _BUDGET_SPEC
      with make_section_extractor("budgets") and _LONG_LINE_SPEC with
      make_section_extractor("long_line_budgets"); both token "raise-approved", both
      gated_direction "up", both gates_new_entry=lambda _v: True. The check body is
      check_diff(spec) + check_present_markers(spec) over both specs, concatenated. Contains NO
      local Decision-header regex, NO local base reader, NO local entry parser -- Slice A owns
      all of that. Must stay under 500 effective lines.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Two `_c(...)` entries in pre_sequence() (validate_structural_size_limits immediately after
      validate_sloc_limits; validate_structural_size_budget_raises immediately after
      validate_sloc_budget_raises), and BOTH names in full_sequence() immediately after
      validate_sloc_limits. There is deliberately no "equivalent position" for the raise-guard in
      the full tier: validate_sloc_budget_raises is --pre-only, so full_sequence() carries
      validate_sloc_limits with no raise-guard sibling. Both new checks nonetheless run in BOTH
      tiers (draft clause 1: "both tiers, unscoped"), which acceptance criterion 3 and VP step 10
      enforce. Both UNSCOPED -- no pre_globs tuple. This is the validate.py-first requirement:
      a check that exists only in a CI workflow is forbidden.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Two re-export lines, PLUS a mandatory one-line SLOC reclaim. Dispatch is
      globals()[name](failed) with no walk_packages auto-discovery, so both check FUNCTIONS must
      become module-level globals here -- importing the modules is not sufficient, and without
      these lines `validate --pre` KeyErrors on the new names and the reachability tests in
      tests/test_checks_registry.py fail.
      THE ARITHMETIC IS BINDING: this file measures 499 SLOC at d1cc5bb, is ONE line under the
      limit, and is NOT registered in config/sloc_budgets.yaml -- so the naive +2 lands at 501 and
      reds validate_sloc_limits. Verified by executing the real gate against a simulated tree
      (499 green / 501 RED). The slice that installs structural size governance would otherwise
      have been failed by the incumbent size gate; that is the self-subjection property working
      as designed, and Decision 166 should say so.
      REMEDY (pinned, option (c) of the three the critique offered): collapse the existing 5-line
      parenthesised `from scripts.checks.sloc.sloc_limits import (...)` block (lines 230-234 at
      d1cc5bb) into ONE line --
      `from scripts.checks.sloc.sloc_limits import _load_sloc_budgets, _update_sloc_budgets, validate_sloc_limits  # noqa: F401,E402`
      -- which measures 125 characters, inside ruff's 127 limit. Net 499 - 4 + 2 = 497 SLOC, three
      lines of headroom. Verified end to end on a simulated tree: `ruff check` passes (import
      ordering included -- `structural` sorts after `sloc`), `ruff format --check` leaves it
      alone, and validate_sloc_limits is GREEN.
      The other two options were considered and REJECTED, deliberately and on the record:
      (a) co-locating both checks in one module breaks the scripts/checks/sloc/ cohesion this
      package mirrors and pushes one module toward its own 500 ceiling; (b) a re-export facade in
      scripts/checks/structural/__init__.py would work, but none of the 17 existing
      scripts/checks/*/__init__.py files does this, so it invents a repo pattern -- and it would
      do so by exploiting iter_gated_py_files' unconditional __init__.py exemption to dodge a
      budget, which is precisely the gaming this plan's own engine exists to prevent. A
      size-governance slice must not buy its own compliance with an exemption.
      A `# raise-approved: dec-166` registration of scripts/validate.py is FORBIDDEN: it
      contradicts Decision 128, AGENTS.md, and this plan's own acceptance criterion 10, and since
      scripts/validate.py is a 2-segment key it would force Decision 166 to name it verbatim,
      entangling the size-governance Decision with an unrelated raise.
      The two re-export lines are also length-constrained, which is why the modules are named
      size_limits.py and budget_raises.py rather than after their check names: the resulting
      imports measure 100 and 109 characters, whereas
      `...structural.validate_structural_size_budget_raises import ...` measures 134 and breaches
      ruff's limit. Registered CHECK names are unchanged.
      scripts/validate.py carries a coverage_baseline entry (80.7) -- do not disturb it.
  - file: tests/checks/structural/__init__.py
    action: Create
    purpose: Test-package marker mirroring tests/checks/sloc/__init__.py (Decision 131 mirror convention).
  - file: tests/checks/structural/test__classify.py
    action: Create
    purpose: >-
      Unit coverage for the classification engine against an INJECTED root (never the live tree):
      first-match-wins ordering (a generated file inside a hand-authored directory classifies by
      provenance, not location); both .yaml and .yml spellings per glob row; the residual default
      for an unmatched extension; the narrow banner regex NOT matching the bare word "generated"
      in prose (measured over-match: a loose regex matched audits/size-governance-expansion-
      3dee4a5.yaml and docs/plans/PLAN-dcg-decisions-index.yaml); generated_pinned membership
      outranking a missing banner; docs/ROADMAP-PLATFORM.yaml excluded from the measured set by
      exact filename while docs/ROADMAP-PRODUCT.yaml is included; and the pinned counting rule
      (a line whose first non-whitespace character is `#` is not counted; a `//` line in .tf IS
      counted -- no per-language cleverness).
  - file: tests/checks/structural/test_size_limits.py
    action: Create
    purpose: >-
      Unit coverage for the limit gate against an INJECTED root: a 501-effective-line file in a
      governed class with no roster entry FAILS; the same file with a roster entry at 501 PASSES;
      at 502 FAILS again (ratchet direction); a file with a 2,001-character line in a governed
      class FAILS on the long-line companion and PASSES with a long_line_budgets entry; an exempt
      class (workflow_outputs / test_fixtures / generated) at 5,000 effective lines PASSES; a
      file matching no class row is governed at 500 by the residual default; and the failure
      message names the file's class and that row's relief valves.
  - file: tests/checks/structural/test_budget_raises.py
    action: Create
    purpose: >-
      Unit coverage for the raise-guard: THE CRITICAL SEAM (a `classes:` block's `limit: 500` and
      `max_line_chars: 2000` scalars are absent from BOTH section extractions, while a flat
      extractor over the same text WOULD capture them -- assert both halves so the test proves
      the seam rather than merely observing it); the two sections do not cross-leak keys; an
      unmarked increase in either section fails; a marked increase citing a Decision that names
      the key passes; a marked increase citing a Decision that does NOT name the key fails
      (authorization, not existence); and the retroactive present-markers leg fails an unchanged
      but unbacked marker.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add `## Decision 166:` (166 is the next free number -- max live header at d1cc5bb is 165).
      LEAN by construction. Carries ONLY: the durable commitment, the 15 distinct roster keys named
      VERBATIM, the amendments (including the Decision 130 clause 1 clarification), the
      roster-expansion record, the CD.29 pre-commitment, reversal conditions, and a
      `**Significance:**` marker (Decision 150; template = Decision 153's body). NOTHING
      mechanical -- the class table, counting rule, glob grammar and long-line threshold live in
      config/structural_size_budgets.yaml per decision-entry.yaml
      significance.routing.field_semantics.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      REGENERATED via the scripts.decisions_index projection, never hand-edited.
      validate_decisions_index_freshness runs in both tiers and will red on a stale index.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      One `- topic: structural-size-budgets` route pointing at
      config/structural_size_budgets.yaml, mirroring the marker-grammar route Slice A added, so
      a future agent looking for the class table finds it without grepping.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Append one graduated verification row per VP step carrying `graduation: graduate`, each
      keyed on that step's graduation_check_id. NOTE the self-reference: this file is itself a
      governed roster entry in this same PR, seeded at a 6,000 ceiling that already accommodates
      these rows (measured 3,700 at d1cc5bb + ~150 for this PR). Decision 132 clause 2's
      implement-PR leg makes these rows mandatory pre-merge, so the ceiling is sized so both
      gates can be satisfied in one PR.
  - file: docs/plans/PLAN-size-gov-engine.yaml
    action: Create
    purpose: This plan document.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      SCOPE EXTENSION (human-approved, post-BLOCKED-handback, Fable advice-consult): re-derive
      the committed docs/decisions-index.json byte pin per Decision 160 point 9's own
      reassessment mandate ("A future owner should reassess whether this indirect bound remains
      adequate as the corpus grows past the header ceiling's current runway"). The prior
      110,000-byte pin had only 236 bytes of headroom before Decision 166 existed and is
      mathematically unroutable in scope (verified: even a maximally-terse Decision 166 body
      still produces a 110,151-byte index). Decisions 159/160 precedent: ship the governing
      Decision and the guard change in the same PR when an entry's own landing would otherwise
      fail the gate. Re-derived to 131,000 bytes (live term 120 x 764 measured bytes/row +
      archive term 54 x 726 measured bytes/row, both shown in the test's own docstring), not an
      arbitrary bump -- docs/decisions-index.json is recorded as a T1.5-interim surface whose
      consumer (decision-scout's Phase 1 index read) retires at T1.5 c1. This is the ONLY file
      added to scope; the human explicitly chose the minimal extension over also thinning the
      generator (that half is deferred to a filed recommendation, not this plan).

bundled_recommendations: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    config/structural_size_budgets.yaml exists and carries all five blocks; its `classes:` list
    has exactly 12 rows whose slugs are the audit's 12 pinned slugs (generated, terraform, config,
    contracts, ci_workflows, shell, lambda_manifests, roadmaps, workflow_outputs, test_fixtures,
    data_query, residual), in first-match-wins order, with `residual` last and mandatory.
  - >-
    Every glob row that can match a YAML file lists BOTH the .yaml and .yml spellings. Measured
    anchor: .github/ holds 27 .yml against 1 .yaml, so a .yaml-only ci_workflows glob would scan 1
    of 28 workflow files (rec-2928's live defect).
  - >-
    validate_structural_size_limits is registered in BOTH the --pre and full sequences in
    scripts/checks/registry.py, unscoped (pre_globs is None), AND re-exported as a module-level
    global of scripts/validate.py. Same for validate_structural_size_budget_raises. Neither check
    exists only in a CI workflow.
  - >-
    terraform/**/*.tf files are in the measured set (SGE-01 closed), docs/contracts/**/*.yaml are
    in the measured set (SGE-04 closed), and config/**/*.{yaml,yml} are in the measured set
    (SGE-02 roster half closed).
  - >-
    validate_structural_size_limits exits clean on the complete tree at the end of this PR --
    the installing PR is green BY CONSTRUCTION, not by exclusion (Decision 130 clause 2 precedent).
  - >-
    validate_structural_size_budget_raises binds to scripts/checks/_marker_guard.py via TWO
    RegistrySpecs using make_section_extractor exclusively. It contains no local Decision-header
    regex, no local base reader, and no local entry parser. A `limit: 500` scalar inside the
    `classes:` block is absent from BOTH section extractions.
  - >-
    All 15 DISTINCT roster keys are authorized by Decision 166 under
    scripts.checks._marker_guard.authorization_failure -- verified by executing the real
    function, not by inspection. ENTRIES vs KEYS: the rosters hold 16 ENTRIES (13 in `budgets:`,
    3 in `long_line_budgets:`) but only 15 DISTINCT KEYS, because
    config/agent/verification_registry/registry.yaml is seeded in BOTH rosters. Authorization is
    computed per key, so 15 verbatim path mentions in Decision 166 is the correct target, not 16.
    This is load-bearing: five of the 15 are 2-segment keys
    (terraform/iceberg_tables.tf, terraform/data_pipeline.tf, docs/ROADMAP-PRODUCT.yaml,
    logs/.retro-lite-log.jsonl, logs/.execution-step-telemetry.jsonl) for which
    _expand_ancestor_candidates generates NO ancestor candidate, so only a verbatim mention
    authorizes them.
  - >-
    The `long_line_budgets:` roster contains EXACTLY the set of governed-class files whose longest
    line exceeds 2,000 characters at implement time -- no over-seeding, no under-seeding.
  - >-
    docs/ROADMAP-PLATFORM.yaml is NOT in the measured set (deferred by exact filename to its
    incumbent validate_platform_roadmap gate, Decisions 114/147), while docs/ROADMAP-PRODUCT.yaml
    IS measured and carries a grandfather budget at its current measured size. _ROADMAP_MAX_LINES
    is unchanged and docs/ROADMAP-PLATFORM.yaml is not edited.
  - >-
    Every new module under scripts/checks/structural/ measures under 500 effective lines and NONE
    is registered in config/sloc_budgets.yaml -- the enforcement passes its own rule by
    decomposition, never by a budget raise (Decision 128).
  - >-
    Decision 166 exists, is lean, carries a `**Significance:**` marker, and contains no
    mechanical/field-semantics content. docs/decisions-index.json is regenerated, not hand-edited.
  - >-
    The CD.29 verification-registry archival-lifecycle recommendation is filed via the ops portal
    and is discoverable in the local read cache after a sync pull.
  - >-
    A full-tier `bin/venv-python -m scripts.validate` run completes with exit 0 before commit
    (handoff_policy obligation, Decision 163 clause 3).

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the raise-guard is a CONSUMER of Slice A's shared module, not a sixth copy: it imports
      _marker_guard, uses the section extractor exclusively, and mints no local Decision-header
      regex or base reader of its own.
    command: >-
      bin/venv-python -c "import pathlib;
      src=pathlib.Path('scripts/checks/structural/budget_raises.py').read_text(encoding='utf-8');
      assert '_marker_guard' in src, 'not bound to the shared module';
      assert 'make_section_extractor' in src, 'must use the section extractor';
      assert 'make_flat_extractor' not in src, 'flat extractor forbidden here -- it parses class-table scalars as budget entries';
      assert '## Decision' not in src, 'local Decision-header regex -- this is a sixth copy';
      assert 'subprocess' not in src, 'local base reader -- default_base_reader belongs to the shared module';
      print('GUARD_BINDING_OK')"
    expected: "Prints `GUARD_BINDING_OK`; exit 0."
    fix_if: >-
      A local regex, a local base reader, or make_flat_extractor is present. Delete it and bind to
      scripts.checks._marker_guard's eight-name surface (docs/contracts/marker-grammar.yaml
      binding_surface.exports). Slice A exists specifically so this module owns only its
      RegistrySpecs.
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-guard-binds-shared-marker-module
  - step: 2
    phase: pre-deploy
    action: >-
      Prove THE CRITICAL SEAM against the REAL registry file: each section-anchored extractor
      returns only its own section's roster keys, and neither returns the class table's scalars.
      This is the seam docs/contracts/marker-grammar.yaml's extractor_shapes clause was written
      for; a flat extractor would return `limit` and `max_line_chars` as budget entries.
    command: >-
      bin/venv-python -c "import pathlib;
      from scripts.checks.structural.budget_raises import _BUDGET_SPEC, _LONG_LINE_SPEC;
      text=pathlib.Path('config/structural_size_budgets.yaml').read_text(encoding='utf-8');
      b=_BUDGET_SPEC.extractor(text); l=_LONG_LINE_SPEC.extractor(text);
      leaked=[k for k in ('limit','max_line_chars','version') if k in b or k in l];
      assert not leaked, f'class-table scalars leaked into a roster extraction: {leaked}';
      assert 'terraform/iceberg_tables.tf' in b, 'budgets roster not extracted';
      assert 'logs/.retro-lite-log.jsonl' in l, 'long_line_budgets roster not extracted';
      assert 'terraform/iceberg_tables.tf' not in l and 'logs/.retro-lite-log.jsonl' not in b, 'the two sections cross-leaked';
      print('SECTION_SEAM_OK')"
    expected: "Prints `SECTION_SEAM_OK`; exit 0."
    fix_if: >-
      A scalar leaked -- the spec is using make_flat_extractor, or the registry's block ordering
      broke the anchor. make_section_extractor ends a section at the next column-0 NON-COMMENT
      line, so `classes:`, `budgets:` and `long_line_budgets:` must each start at column 0. If the
      sections cross-leaked, the two specs are sharing one extractor.
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-registry-section-scoped-extraction
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the engine measures the three finding surfaces, correctly scopes the roadmaps
      deferral, and is GREEN on the complete tree -- the green-by-construction acceptance for
      SGE-01, SGE-02 and SGE-04 in one executable assertion.
    command: >-
      bin/venv-python -c "import scripts.validate as v;
      from scripts.checks.structural import _classify;
      measured={rel for rel, _slug in _classify.iter_measured_files()};
      assert 'terraform/iceberg_tables.tf' in measured, 'terraform not scanned -- SGE-01 unclosed';
      assert 'config/agent/verification_registry/registry.yaml' in measured, 'config not scanned -- SGE-02 unclosed';
      assert 'docs/contracts/ops_recommendations.yaml' in measured, 'contracts not scanned -- SGE-04 unclosed';
      assert 'docs/ROADMAP-PRODUCT.yaml' in measured, 'ROADMAP-PRODUCT ungoverned -- the exempt-by-omission hole';
      assert 'docs/ROADMAP-PLATFORM.yaml' not in measured, 'PLATFORM must defer to validate_platform_roadmap (Decisions 114/147)';
      failed=[]; v.validate_structural_size_limits(failed);
      assert not failed, f'installing PR is NOT green by construction: {failed}';
      print('ENGINE_GREEN_AND_SCOPED')"
    expected: "Prints `ENGINE_GREEN_AND_SCOPED`; exit 0."
    fix_if: >-
      A membership assertion trips -- the class row's globs are wrong (check both .yaml/.yml
      spellings) or the exclusion set is over-broad. If the PLATFORM assertion trips, the
      deferral was scoped to the glob rather than the exact filename. If the green assertion
      trips, re-run the census and re-seed the roster from measured values -- never relax a
      class row to make the tree pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-engine-green-and-scoped
  - step: 4
    phase: pre-deploy
    action: >-
      Run the unit suite covering the failure paths the on-tree assertions structurally cannot
      reach: an unregistered 501-effective-line file failing, a roster entry at 501 passing and at
      502 failing, a 2,001-character line failing the companion, an exempt class passing at 5,000
      lines, the residual default governing an unmatched extension, an unmarked roster increase
      failing, and a marker citing a non-authorizing Decision failing.
    command: bin/venv-python -m pytest tests/checks/structural && echo STRUCTURAL_SUITE_PASSED
    expected: >-
      The pytest run reports zero failures and the chained echo emits
      `STRUCTURAL_SUITE_PASSED`; exit 0. (The literal is echoed rather than harvested from
      pytest's own report so validate_vp_replay's substring rule is satisfiable by construction.)
    fix_if: >-
      A failure-path test does not fail without the fix -- the test is asserting on a mocked path
      rather than the real check function. Every test must drive the real
      validate_structural_size_limits / validate_structural_size_budget_raises body against an
      injected root.
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-unit-suite-failure-paths
  - step: 5
    phase: pre-deploy
    action: >-
      Prove rec-2928's defect cannot recur: every tracked .yml AND .yaml file under .github/
      classifies as ci_workflows, anchored on the measured population so the assertion is not
      vacuous (a .yaml-only glob would cover 1 of 28).
    command: >-
      bin/venv-python -c "import subprocess;
      from scripts.checks.structural import _classify;
      out=subprocess.run(['git','ls-files','.github'],capture_output=True,text=True,check=True).stdout.split();
      yamls=[f for f in out if f.endswith(('.yml','.yaml'))];
      hit=[f for f in yamls if _classify.classify_path(f)=='ci_workflows'];
      assert len(yamls)>=28, f'population anchor moved: {len(yamls)} -- re-derive before relaxing';
