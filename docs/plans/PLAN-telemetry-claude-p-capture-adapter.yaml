  - >-
    3. claude_p_retry.sh with test_ci_claude_p_retry.py; VP 1.
  - >-
    4. transcript.py host_run(), host_run.py, then sessions.py, transcripts.py and record_turn.py (Ctx fields, the
    top-level rows, withheld) with test_host_run.py and the touched test modules at full line coverage of host_run.py.
  - >-
    5. runner.py, ci_pass.py and __main__.py with test_ci_pass.py and test_main.py; VP 3.
  - >-
    6. capture.yaml, the composite action and ci-rca.yml with test_telemetry_ci_capture_action.py; VP 4. Then the
    pairing rule with its tests; VP 8.
