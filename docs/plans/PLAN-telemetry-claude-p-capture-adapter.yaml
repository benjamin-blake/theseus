    expected: >-
      The manifest has 2 lines; ci-pass prints CI_CAPTURE off reason=ref_not_main sessions=2 and writes nothing. Then, by
      hand, each session's tree is found under ~/.claude/projects and record_turn at v8 with a full sidecar yields one
      top-level open row whose checkout_sha is the clone's HEAD. CLAUDE148_BIN is the scratch install's bin directory.
    fix_if: A session id is not honoured on 2.1.148 (fall back to the result JSON session_id and re-plan), or the tree is not found.
    hermetic: false
