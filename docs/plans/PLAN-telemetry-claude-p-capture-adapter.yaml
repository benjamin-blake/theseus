    phase: post-deploy
    action: >-
      The merge's governed deploys converged: deploy-ducklake-lambdas (writer, smoke with the updated agent vector) and
      deploy-prod-lambdas for the merge commit both concluded success.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="deploy-ducklake-lambdas.yml", workflow_runs_filter={"branch": "main"}) and the same for
      deploy-prod-lambdas.yml; select the run whose head_sha is the merge commit.
    expected: Both runs conclusion success at the merge commit (or a later commit that includes it).
    fix_if: The smoke stage fails on telemetry_agents required_when (the vector) or a deploy step fails; fix forward on a new PR.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      The first ci-rca run after the merge whose agent step ran (not dedup-skipped) is captured end to end: its job is
      green, its capture step printed CI_CAPTURE done with sent >= 1 and halted 0, and the production store holds the
      run's top-level pair. Wait for a natural run (about 0.7 a day); never dispatch ci-rca to manufacture one.
    command: >-
      mcp__github__get_job_logs for that run's rca job (grep '^CI_CAPTURE'), then AWS_PROFILE=agent_platform
      bin/venv-python -c "import sys;from datetime import date,timedelta;from scripts.telemetry_capture import
      read_route;r=read_route.make_routed_reader();d=date.today();rows=r.named('telemetry_root_sessions',day_from=(d-timedelta(days=1)).isoformat(),day_to=d.isoformat());h=[x
      for x in rows if (x.get('host_run_ref') or '').startswith('gha:'+sys.argv[1]+'/')];print('host_run_roots',len(h));assert h" <run_id>
      and session_tree_rows for one such root (counts by table and event_kind only).
    expected: >-
      CI_CAPTURE done sessions>=1 sent>=1 halted=0; host_run_roots >= 1; the tree holds a telemetry_agents open and close
      with no observation_id, telemetry_sessions open and close, and transcripts rows (full policy).
    fix_if: >-
      off reason=<token> (gate inputs), deferred pin_conflict, transcript_absent (session id not honoured on the runner),
      or a writer refusal: diagnose from the counts, file a rec, fix forward. The ci-rca job itself must never go red.
    hermetic: false
  - step: 13
    phase: post-deploy
    action: rec-4424 closed by the squash-merge Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4424']);print(rows[0]['status'])"
    expected: closed
    fix_if: Still open after the closure job ran; close it with update_rec citing the merge commit.
    hermetic: false
  - step: 14
    phase: post-deploy
    action: The next scheduled telemetry-golden-replay run on main replays the v8 corpus (incl. top-level rows) through the deployed writer and reader.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="telemetry-golden-replay.yml", workflow_runs_filter={"branch": "main"}); first run whose head includes the merge.
    expected: conclusion success.
    fix_if: A required_when or row-rule refusal on a v8 golden row; fix forward.
    hermetic: false
