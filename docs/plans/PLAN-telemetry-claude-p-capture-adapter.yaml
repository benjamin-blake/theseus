      clone the branch into a scratch git dir (so its .claude/settings.json pin hook fires), run the real wrapper there
      twice with a one-word prompt against one output file, then run ci-pass with a gate that reads off (ref
      refs/heads/probe) and parse each found tree locally with record_turn and a hand-written sidecar.
    command: >-
      bash scripts/ci/claude_p_retry.sh --help >/dev/null 2>&1; S=$(mktemp -d) && git clone -q --depth 1 . "$S/repo" &&
