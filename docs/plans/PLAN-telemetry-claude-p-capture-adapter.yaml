bundled_recommendations:
  - rec-4424
followon_recs: []
infrastructure_dependencies:
  - >-
    No Terraform and no IAM: ci-rca's existing branch role (agent-platform-github-ci-branch) already holds the telemetry
    writer URL invoke grant and SSM /agent-platform/* read (FINDINGS.md section 1).
  - >-
    Merge redeploys through governed CI channels only: field_semantics.yaml and src/row_rules consumers -> every DuckLake
    Lambda (deploy-ducklake-lambdas); ducklake_event_read_sql.py and ducklake_event_read_verbs.py -> the telemetry
    reader; ducklake_reader_client.py -> data-pipeline (deploy-prod-lambdas). The build re-runs compute_affected_artifacts
    over its final diff and names every artifact in the PR body. No break-glass deploy, no admin credential.
acceptance_criteria:
  - Every claude_p_retry.sh attempt runs under its own --session-id and leaves one manifest line; two invocations append to one manifest.
  - ci-pass captures an allow-listed workflow on refs/heads/main of otl-labs/ontheloop and is off, with one fixed token, for every other gate input; GITHUB_* is read only in capture.sh.
  - Hook capture stays off in Actions (switch_mode without a gate is unchanged); a switch git-show timeout after a resolved ref reads OFF (rec-4424).
  - The sidecar is written once and never overwritten with different content; rule P-5 defers a project_ref conflict.
  - Parser v8 writes one top-level telemetry_agents open/close pair per root session with observation_id NULL, host_run_ref, workflow_run_id and trigger; workflow = the allow-list key; withheld policy yields withheld_by_policy omissions; the golden corpus, registry and digest are at 8.
  - The writer rejects a top-level telemetry_agents row without host_run_ref and accepts sub-agent rows unchanged; the deploy smoke stays green.
  - Completeness counts top-level-run roots as captured_host_runs, never as captured_without_key.
  - The pairing rule fails an unpaired claude_p_retry.sh call site, a stale exemption and a listed claude.yml, and passes the real tree.
  - The first post-merge ci-rca agent run is captured end to end in production and its job stays green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Wrapper behaviour, including env -i and two invocations sharing one manifest.
    command: bin/venv-python -m pytest tests/test_ci_claude_p_retry.py -q
    expected: All tests pass; the session-id and manifest tests fail before the change.
    fix_if: A retry reuses a session id, a manifest line is missing or the manifest is truncated, or an exit code changes.
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: >-
      A pytest selector already run by the full test tier on every merge to main; a registry row would duplicate that
      standing guard.
  - step: 2
    phase: pre-deploy
    action: rec-4424's acceptance node and the CI gate.
    command: >-
