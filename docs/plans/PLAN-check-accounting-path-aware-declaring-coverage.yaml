schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: check-accounting-path-aware-declaring-coverage
intent: 'Build the path-aware declaring-coverage metric that docs/contracts/check-accounting.yaml''s ratchet_limitation names as deferred future work -- a CFG-lite walk of every registered check''s own control flow reporting how many reachable success-exit paths reach an examined()/skipped() declaration. REPORT-ONLY: it states no threshold, adds no status vocabulary member and never appends to its own failed list. It turns the accounting channel''s central blind spot (a declaration exists somewhere in a MODULE, not on every exit PATH) into a measured, standing observable, which is the precondition Decision 170 set for ever revisiting fail-closed vacuity.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-accounting-path-aware-declaring-coverage.yaml
phase: 'Platform verification-system hardening -- the Decision 170 accounting channel''s path-level observable. Ad hoc, soft-warn category ad_hoc_rec; no tier_item claimed and no roadmap exit criterion closed, so this plan declares no closes_criteria. Slice 0 (keystone) of a two-slice sequence: slice 1 is a separate later plan that uses this merged metric as its oracle to shrink config/check_accounting_baseline.yaml.'
scope:
- file: scripts/checks/hygiene/_declaring_coverage.py
  action: Create
  purpose: Non-registered CFG-lite walker helper -- declaration-name resolution, the per-construct control-flow walk, the success/failure exit classification, the undecidable vocabulary and is_fully_declared -- the bound-filter predicate a consumer must apply before reading declared/undeclared off any row. Separate module so the walker and the reporting check each stay far under 500 SLOC (Decision 128 decompose-by-default), following the scripts/checks/<domain>/_helper.py precedent (iam_tf/_read_coverage.py, contracts/_population.py).
- file: scripts/checks/hygiene/validate_declaring_coverage.py
  action: Create
  purpose: 'The registered, report-only check -- walks the live fleet, reads its fleet report line grammar from docs/contracts/check-accounting.yaml''s path_aware_declaring_coverage key at runtime through a report_grammar(contract_path=None) seam (Decision 168 evidence-of-reading: the module carries that contract path as a joined executable-context literal), prints the per-check and fleet report lines, terminally declares on each of its two reachable exits -- examined(n, unit=registered_checks) normally, skipped(reason) when the contract grammar is unavailable -- and leaves its failed list empty unconditionally.'
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: Add the Entry literal (bare string-literal module=/attr=, docs/contracts/check-manifest.yaml) registering the check in the full tier only (full_segment full_after_lint, no pre membership) -- registration surface 3.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Add the function_to_category row (code_regression) -- registration surface 4 and a hard precondition of validate_ci_rca_taxonomy's registry-totality assertion.
- file: tests/checks/hygiene/test__declaring_coverage.py
  action: Create
  purpose: Mirror test for the walker -- carries the behavioural pins (undeclared branch reported, monotone shrink, failure-dominated exit excluded, aliased/bare import forms recognised) and the stated CFG-lite limits, all as properties over synthetic in-memory sources.
- file: tests/checks/hygiene/test_validate_declaring_coverage.py
  action: Create
  purpose: Mirror test for the check -- report-only over a synthetic fleet, the fleet report line grammar derived from the contract, self-reports-as-fully-declared, and the registration surfaces.
- file: docs/contracts/check-accounting.yaml
  action: Modify
  purpose: 'Add exactly one amendment_log entry (change_class field_add) and the new top-level path_aware_declaring_coverage key defining the metric''s semantics beside its enforcement: what a success-exit path is, what reaching a declaration means, the stated CFG-lite limits, the undecidable vocabulary, the bound direction (undeclared is an upper bound, declared a lower bound, and both figures are evidence only on a row whose undecidable_reason is None), the grammar-unavailable routed set and the two report-line values. The report line is carried as TWO machine-readable values because a format template and a match regex are not the same string -- fleet_line_grammar (the str.format template the check reads back at runtime) and fleet_line_regex (the regex the graduated fleet-report-line shard carries verbatim as its expected) -- and the amendment_log entry NAMES validate_declaring_coverage as the key''s runtime reader while contract.evaluator stays validate_check_accounting, unwidened (Decision 168).'
- file: config/agent/verification_registry/entries/declaring-coverage-check-registered.yaml
  action: Create
  purpose: Graduated shard for the registration step (primitive_slot command_exit_zero).
- file: config/agent/verification_registry/entries/declaring-coverage-fleet-report-line.yaml
  action: Create
  purpose: Graduated shard for the live-fleet report-only run and report line grammar (primitive_slot command_output_matches).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- scripts/checks/hygiene/_declaring_coverage.py exists and, for a check callable's AST, returns per-check success-exit, declared, undeclared, failure-exit counts plus an undecidable reason drawn from a single declared vocabulary constant; the stated CFG-lite limits make undeclared an UPPER bound and declared a LOWER bound in every case, never the reverse.
- scripts/checks/hygiene/validate_declaring_coverage.py is registered through all seven surfaces (module, register decoration, hygiene _manifest.py Entry, ci_rca_taxonomy row, verification-registry shards for its graduated steps, mirror test, and a terminal accounting declaration on each of its two reachable exit paths -- examined() on the normal path, skipped() when the contract grammar is unavailable).
- 'The check is report-only: its failed list is empty for every fleet it is given, including a synthetic fleet whose rows carry undeclared success-exit paths, and it introduces no threshold and no new status vocabulary member. The contract-grammar-unavailable path declares skipped(reason) and still appends nothing, so the metric axis is report-only for every input and no raise can abort the tier.'
- The metric reports its OWN module as having zero undeclared success-exit paths, asserted by a named test node.
- 'docs/contracts/check-accounting.yaml carries exactly one new amendment_log entry and one new path_aware_declaring_coverage key, and that key carries BOTH machine-readable report-line values -- fleet_line_grammar (the str.format template the check formats its fleet line with) and fleet_line_regex (the match regex the declaring-coverage-fleet-report-line shard carries verbatim as its expected, asserted equal by step 6) -- whose mutual agreement is pinned by a named test node. The check reads fleet_line_grammar at runtime for its report line and its module resolves as a reader under scripts.checks.contracts._population.module_contains_literal. Step 13''s report_grammar() equals the contract value assertion CORROBORATES the key PATH only: the seam reads the same file the assertion reads, so on its own that equality is tautological and a hardcoded grammar string matching today''s contract value would still satisfy it. The DISCRIMINATING pin is the named test node TestContractDerivedGrammar, which points the report_grammar seam at a tmp_path contract carrying a DIFFERENT grammar and observes the emitted line change -- a check that hardcoded its grammar fails that node while still passing step 13 (Decision 168).'
- Both new source modules report 100 percent whole-file coverage, every new file stays under 500 SLOC, and no config/sloc_budgets.yaml entry, raise-approved marker or complexity waiver is added.
- config/check_accounting_baseline.yaml is byte-identical to origin/main and no roster-listed check's defining module appears in this branch's diff.
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE. Prove the check name is absent from both the manifest and the taxonomy at the untouched base, so every AFTER step below is a real differential rather than a restatement.
  command: bin/venv-python -c "import subprocess; ok=True; [print('BASE_ABSENT', p, subprocess.run(['git','show','origin/main:'+p], capture_output=True, text=True, encoding='utf-8').stdout.count('validate_declaring_coverage')) for p in ('scripts/checks/hygiene/_manifest.py','config/ci_rca_taxonomy.yaml')]; assert all(subprocess.run(['git','show','origin/main:'+p], capture_output=True, text=True, encoding='utf-8').stdout.count('validate_declaring_coverage')==0 for p in ('scripts/checks/hygiene/_manifest.py','config/ci_rca_taxonomy.yaml')); print('ABSENT_ON_ORIGIN_MAIN')"
  expected: Two BASE_ABSENT lines each ending in 0, then ABSENT_ON_ORIGIN_MAIN, exit 0. A non-zero count means the base already carries the name.
  fix_if: Non-zero occurrence count at origin/main, or git show fails -- fetch origin/main and re-run; if the name genuinely exists at base, this plan is a duplicate and must be re-scoped.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The assertion inverts by construction the moment this PR merges (origin/main will then carry the name), so it can never be a standing regression guard -- its whole value is the pre-merge differential the two graduated steps below are admitted against.
- step: 2
  phase: pre-deploy
  action: AFTER surfaces 1 and 2. The check module exists and its register decoration puts the name in the registry; resolve() returns the module's own callable late-bound.
  command: bin/venv-python -c "from scripts.checks import registry; import scripts.checks.hygiene.validate_declaring_coverage as m; assert registry.resolve('validate_declaring_coverage') is m.validate_declaring_coverage; assert 'validate_declaring_coverage' in registry.all_checks(); print('REGISTERED')"
  expected: REGISTERED on stdout, exit 0.
  fix_if: UnknownCheckError means the manifest Entry is missing or misspelled; an AttributeError means the register name and the function name disagree.
  hermetic: true
  graduation: graduate
  graduation_check_id: declaring-coverage-check-registered
- step: 3
  phase: pre-deploy
  action: AFTER surface 3. The hygiene manifest Entry uses bare string literals and places the check in the full tier only, with no pre-tier membership.
  command: bin/venv-python -c "from scripts.checks import registry; from scripts.checks.hygiene._manifest import ENTRIES; e=[x for x in ENTRIES if x.name=='validate_declaring_coverage'][0]; print('ENTRY', e.module, e.attr, e.pre, e.full_segment); assert e.module == 'scripts.checks.hygiene.validate_declaring_coverage' and e.attr == 'validate_declaring_coverage'; assert e.pre is False and e.pre_globs is None; assert e.full_segment == 'full_after_lint'; names={s.name for s in registry.full_sequence()}; pre={s.name for s in registry.pre_sequence()}; assert 'validate_declaring_coverage' in names and 'validate_declaring_coverage' not in pre; print('FULL_TIER_ONLY')"
  expected: An ENTRY line, then FULL_TIER_ONLY, exit 0.
  fix_if: A computed or f-string module value severs the dependency-graph edge (check-manifest.yaml); pre True would put a report-only metric into the Decision 182 fast-tier budget.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Subsumed by declaring-coverage-check-registered, which resolves through this exact Entry, and by validate_check_manifests, which already enforces the literal grammar as a standing gate; a second registry row would re-run the same oracle under a different name.
- step: 4
  phase: pre-deploy
  action: AFTER surface 4. The taxonomy carries the row and validate_ci_rca_taxonomy's registry-totality assertion still passes with the new check in the population.
  command: bin/venv-python -c "import yaml; from pathlib import Path; from scripts.checks import registry; t=yaml.safe_load(Path('config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8')); print('CATEGORY', t['function_to_category']['validate_declaring_coverage']); assert t['function_to_category']['validate_declaring_coverage'] in t['failure_categories']; f=[]; registry.resolve('validate_ci_rca_taxonomy')(f); assert f == [], f; print('TAXONOMY_TOTAL')"
  expected: A CATEGORY line, then TAXONOMY_TOTAL, exit 0.
  fix_if: A missing row fails the totality assertion; a category outside failure_categories breaks the CI-RCA Priority-0 attribution path.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_ci_rca_taxonomy already enforces registry totality on every run in both tiers, so a graduated row would duplicate a standing gate that fails louder and sooner than a registry shard would.
- step: 5
  phase: pre-deploy
  action: AFTER surface 6. Every named behavioural-pin class actually exists in the mirror tests (asserted by an AST scan, because a pytest -k selection that matches nothing still exits 0 -- the exact vacuity shape this plan exists to measure), and both mirror test modules run green.
  command: 'bin/venv-python -c "import ast; from pathlib import Path; pins={''tests/checks/hygiene/test__declaring_coverage.py'': [''TestDeclarationNameResolution'',''TestUndeclaredBranchReported'',''TestMonotoneShrink'', ''TestFailureDominatedExit'',''TestAliasedImportRecognised'',''TestStatedCfgLiteLimits'', ''TestUndecidable'',''TestSignatureShapes'',''TestExhaustedLiveStateSet''], ''tests/checks/hygiene/test_validate_declaring_coverage.py'': [''TestReportOnly'',''TestFleetSummaryLine'',''TestContractDerivedGrammar'',''TestFleetLineRegexDerivation'',''TestGrammarUnavailableSkips'',''TestMeasureFleet'', ''TestMetricReportsItselfFullyDeclared'',''TestRegisteredSurfaces'']}; missing={f: [n for n in names if n not in {c.name for c in ast.parse(Path(f).read_text(encoding=''utf-8'')).body if isinstance(c, ast.ClassDef)}] for f, names in pins.items()}; [print(''PINS'', f, ''missing='', m) for f, m in missing.items()]; assert not any(missing.values()), missing; print(''PIN_CLASSES_PRESENT'')" && bin/venv-python -m pytest tests/checks/hygiene/test__declaring_coverage.py tests/checks/hygiene/test_validate_declaring_coverage.py -q -p no:cacheprovider --randomly-seed=12345'
  expected: Two PINS lines each showing an empty missing list, then PIN_CLASSES_PRESENT, then a pytest summary in which every collected test passes and the collected count is greater than zero, exit 0.
  fix_if: A non-empty missing list means a pin class was renamed or dropped -- add the pin back rather than editing the plan's pin list (Decision 181). A pytest failure is fixed in the code under test, never by relaxing the assertion.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A test_selector registry row naming a test file absent from origin/main is trivially admitted by the differential (rec-2998, open), so graduating this step would buy a row whose admission proves nothing; the full-tier pytest run is the honest standing guard.
- step: 6
  phase: pre-deploy
  action: AFTER surface 5. Both graduated shards exist at their check_id-named paths and materialize through the verification registry loader without a GraduationError, and the fleet-report-line shard's expected regex is the contract's path_aware_declaring_coverage.fleet_line_regex value verbatim -- so the shard's match oracle cannot drift away from the contract that declares it.
  command: 'bin/venv-python -c "import yaml; from pathlib import Path; from scripts.verification_graduation import load_entries; rows={r[''check_id'']: r for r in load_entries()}; [print(''SHARD'', c, rows[c][''primitive_slot''], rows[c][''guard_target'']) for c in (''declaring-coverage-check-registered'',''declaring-coverage-fleet-report-line'')]; assert rows[''declaring-coverage-check-registered''][''primitive_slot''] == ''command_exit_zero''; assert rows[''declaring-coverage-fleet-report-line''][''primitive_slot''] == ''command_output_matches''; contract=yaml.safe_load(Path(''docs/contracts/check-accounting.yaml'').read_text(encoding=''utf-8'')); shard=yaml.safe_load(Path(''config/agent/verification_registry/entries/declaring-coverage-fleet-report-line.yaml'').read_text(encoding=''utf-8'')); assert shard[''check_spec''][''use_regex''] is True; assert shard[''check_spec''][''expected''] == contract[''path_aware_declaring_coverage''][''fleet_line_regex'']; print(''SHARD_EXPECTED_IS_CONTRACT_REGEX''); print(''SHARDS_LOADED'')"'
  expected: Two SHARD lines, then SHARD_EXPECTED_IS_CONTRACT_REGEX, then SHARDS_LOADED, exit 0.
  fix_if: A filename that does not equal its check_id, or an unknown primitive_slot, is rejected by the loader (Decision 176 per-file shards) -- scripts.verification_graduation.load_entries raises GraduationError rather than skipping, so a malformed shard reddens here instead of going silently missing from the differential gate. An expected value that differs from the contract's fleet_line_regex means the shard hand-wrote its regex instead of carrying the contract's -- copy the contract value verbatim (quoted, because it contains a colon-space) rather than editing the contract to match the shard.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Self-referential: a graduated shard whose job is to assert that graduated shards exist adds a third shard and no independent evidence; validate_verification_registry already loads every shard on every run.'
- step: 7
  phase: pre-deploy
  action: Surface 7 plus behavioural pins (d) and (e) against the LIVE fleet -- the metric runs, leaves its failed list empty, terminally declares examined over registered_checks on the normal path (the declaration is popped and its KIND and UNIT asserted, never its count), emits the fleet report line in the declared grammar, and reports its own module as having zero undeclared success-exit paths.
  command: 'bin/venv-python -c "from scripts.checks import registry; from scripts.checks.hygiene.validate_declaring_coverage import measure_fleet; f=[]; registry.resolve(''validate_declaring_coverage'')(f); d=registry.pop_declaration(); assert d is not None and d.kind == ''examined'' and d.unit == ''registered_checks'', d; print(''DECLARATION'', d.kind, d.unit); assert f == [], f; rows={r.check: r for r in measure_fleet()}; own=rows[''validate_declaring_coverage'']; print(''SELF'', own.success_exits, own.declared, own.undeclared, own.undecidable_reason); assert own.undecidable_reason is None and own.success_exits >= 1 and own.undeclared == 0; print(''SELF_FULLY_DECLARED'')"'
  expected: 'A fleet summary line matching the grammar fleet: checks=N success_exits=N declared=N undeclared=N undecidable=N, the report-only notice, a DECLARATION line reading examined then registered_checks, a SELF line whose last three values are a positive count then 0 then None, then SELF_FULLY_DECLARED, exit 0. Assert the line grammar, never its integers.'
  fix_if: A None or non-examined popped declaration means the normal exit stopped declaring terminally, which is the vacuity shape this whole channel exists to catch. A non-empty failed list means the check gained a failure path and is no longer report-only; a non-zero self-undeclared count means the check body grew an exit that skips its own declaration.
  hermetic: true
  graduation: graduate
  graduation_check_id: declaring-coverage-fleet-report-line
- step: 8
  phase: pre-deploy
  action: Coverage mechanism and floor. map_source_to_test resolves both new modules to their mirror tests, and the whole-file coverage of both modules is 100 percent (Decision 159 -- an unbaselined file keeps 100 percent, and the baseline tamper guard forbids registering a sub-100 file).
  command: bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import map_source_to_test, check_test_file_exists; [print('MAP', p, map_source_to_test(Path(p)).name, check_test_file_exists(Path(p))) for p in ('scripts/checks/hygiene/_declaring_coverage.py','scripts/checks/hygiene/validate_declaring_coverage.py')]; assert all(check_test_file_exists(Path(p))[0] for p in ('scripts/checks/hygiene/_declaring_coverage.py','scripts/checks/hygiene/validate_declaring_coverage.py'))" && bin/venv-python -m pytest tests/checks/hygiene/test__declaring_coverage.py tests/checks/hygiene/test_validate_declaring_coverage.py -q -p no:cacheprovider --randomly-seed=12345 --cov=scripts.checks.hygiene._declaring_coverage --cov=scripts.checks.hygiene.validate_declaring_coverage --cov-report=term-missing --cov-fail-under=100
  expected: Two MAP lines resolving to the mirrored test basenames with a True existence verdict, then a coverage table showing both modules at 100 percent with an empty Missing column, exit 0.
  fix_if: A Missing column entry is an unreachable defensive branch -- delete the dead branch or add the test that reaches it; never lower the floor or register a baseline entry.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Same shape as step 5''s waiver, aligned deliberately on the stricter of the two dispositions: the pytest half names test files absent from origin/main, so a graduated row would be trivially admitted by the differential (rec-2998, open) and would prove nothing. The Decision 159 whole-file floor enforced by the full-tier coverage gate is the honest standing guard.'
- step: 9
  phase: pre-deploy
  action: The declaration ratchet is untouched -- validate_check_accounting still passes, the roster file is byte-identical to origin/main, and no roster-listed check's defining module appears in this branch's status-aware diff (touch-it-fix-it).
  command: bin/venv-python -c "import inspect, subprocess, yaml; from pathlib import Path; from scripts.checks import _common, registry; f=[]; registry.resolve('validate_check_accounting')(f); assert f == [], f; base=subprocess.run( ['git','show','origin/main:config/check_accounting_baseline.yaml'], capture_output=True, text=True, encoding='utf-8'); cur=Path('config/check_accounting_baseline.yaml').read_text( encoding='utf-8'); print('ROSTER_UNCHANGED', base.stdout == cur); assert base.stdout == cur; roster=set(yaml.safe_load(cur)['entries']); touched={p for _s, p in _common.get_status_aware_diff()}; hits=sorted(n for n in roster & set(registry.all_checks()) if Path(inspect.getsourcefile(registry.resolve(n))).resolve().relative_to( _common.ROOT).as_posix() in touched); print('ROSTER_MODULES_TOUCHED', hits); assert not hits; print('NO_ROSTER_MODULE_EDITED')"
  expected: ROSTER_UNCHANGED True, ROSTER_MODULES_TOUCHED with an empty list, then NO_ROSTER_MODULE_EDITED, exit 0.
  fix_if: A non-empty hit list means an edit to a grandfathered check's module obligates adopting the declaration in the same PR -- revert the edit instead, since slice 0 declares no such scope row.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Branch-state dependent by construction (it reads this branch's diff against origin/main), so it has no meaning as a standing post-merge guard; validate_check_accounting itself is the standing gate and runs in both tiers.
- step: 10
  phase: pre-deploy
  action: Touched set equals declared scope in BOTH directions, with the declared set derived from the plan's own scope rather than restated inline (rec-3547) and the touched set read from the working-tree-aware seam because implement runs on an uncommitted tree. Direction A (touched is a subset of declared) is the LOCATION half of the Decision 59 scope-boundary commitment that validate_scope_boundary discharges.
  command: bin/venv-python -c "from scripts.checks import _common; from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary; from scripts.roadmap.plan_document import load; p='docs/plans/PLAN-check-accounting-path-aware-declaring-coverage.yaml'; base=_common.push_context_base() or 'origin/main'; resolved=_common.resolve_declared_plans(_common.get_changed_files(), _common.ROOT, base); print('RESOLVED', resolved); assert p in resolved; f=[]; validate_scope_boundary(f); print('BOUNDARY', f); assert f == []; declared={e.file for e in load(p).scope}; touched={x for _s, x in _common.get_status_aware_diff()}; missing=sorted(declared - touched); print('DECLARED_NOT_TOUCHED', missing); assert not missing; print('TOUCHED_SET_EXACT')"
  expected: A RESOLVED list containing this plan, BOUNDARY with an empty list, DECLARED_NOT_TOUCHED with an empty list, then TOUCHED_SET_EXACT, exit 0.
  fix_if: A non-empty BOUNDARY list is an undeclared touched path -- STOP and request a human-directed plan amendment; never append to the plan's own scope (Decision 59, docs/contracts/implement-scope-boundary.yaml). A non-empty DECLARED_NOT_TOUCHED list means a declared scope row was never written.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Depends on this session's transient branch state (the resolved plan and its uncommitted diff) and inverts once merged; validate_scope_boundary is already the standing gate for the touched-subset-of-declared direction in both tiers.
- step: 11
  phase: pre-deploy
  action: 'SLOC under 500 for every new file including tests, and no budget entry, raise-approved marker or complexity waiver introduced anywhere in scope (Decision 128 decompose-by-default, Decision 165 marker authorization). Also the Decision 166 non-Python half: the two governed structured files in scope -- docs/contracts/check-accounting.yaml in the contracts class and config/ci_rca_taxonomy.yaml in the config class, 500 effective lines each -- stay inside their class limits with no config/structural_size_budgets.yaml entry or raise marker added.'
  command: 'bin/venv-python -c "from pathlib import Path; from scripts.roadmap.plan_document import load; from scripts.checks import registry; plan=load(''docs/plans/PLAN-check-accounting-path-aware-declaring-coverage.yaml''); py=[e.file for e in plan.scope if e.file.endswith(''.py'')]; counts={p: sum(1 for l in Path(p).read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(''#'')) for p in py}; [print(''SLOC'', k, v) for k, v in sorted(counts.items())]; assert all(v < 500 for v in counts.values()), counts; assert all(''raise-approved'' not in Path(p).read_text(encoding=''utf-8'') and ''complexity-waiver'' not in Path(p).read_text(encoding=''utf-8'') for p in py); import yaml as y; budgets=(y.safe_load(Path(''config/sloc_budgets.yaml'').read_text( encoding=''utf-8'')) or {}).get(''budgets'') or {}; assert not (set(py) & set(budgets)),  sorted(set(py) & set(budgets)); f=[]; registry.resolve(''validate_sloc_budget_raises'')(f); assert f == [], f; f2=[]; registry.resolve(''validate_cc_limits'')(f2); assert f2 == [], f2; f3=[]; registry.resolve(''validate_structural_size_limits'')(f3); assert f3 == [], f3; f4=[]; registry.resolve(''validate_structural_size_budget_raises'')(f4); assert f4 == [], f4; print(''SLOC_AND_MARKERS_CLEAN'')"'
  expected: One SLOC line per scoped Python file, each count below 500, the two Decision 166 structural-size checks reporting no findings, then SLOC_AND_MARKERS_CLEAN, exit 0.
  fix_if: A count at or above 500, or a cyclomatic-complexity failure, is decomposed into a further sibling helper module with its own mirror test -- never a raise, a waiver marker or a budget registration. A structural-size finding on the contract or the taxonomy is resolved by compacting amendment history or deferring detail, never by a config/structural_size_budgets.yaml raise (Decision 166 relief valves, Decision 165 marker authorization).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_sloc_limits, validate_sloc_budget_raises and validate_cc_limits are already standing gates in the fast tier; this step's contribution is scoping them to this plan's own files at implement time, which a registry row could not express without hardcoding a file list that goes stale.
- step: 12
  phase: pre-deploy
  action: Lint and format the whole declared scope with the repo's own toolchain.
  command: bin/venv-python -m ruff check scripts/checks/hygiene/_declaring_coverage.py scripts/checks/hygiene/validate_declaring_coverage.py scripts/checks/hygiene/_manifest.py tests/checks/hygiene/test__declaring_coverage.py tests/checks/hygiene/test_validate_declaring_coverage.py && bin/venv-python -m ruff format --check scripts/checks/hygiene/_declaring_coverage.py scripts/checks/hygiene/validate_declaring_coverage.py scripts/checks/hygiene/_manifest.py tests/checks/hygiene/test__declaring_coverage.py tests/checks/hygiene/test_validate_declaring_coverage.py && bin/venv-python -m mypy scripts/checks/hygiene/_declaring_coverage.py scripts/checks/hygiene/validate_declaring_coverage.py
  expected: ruff reports all checks passed, ruff format reports the files already formatted, mypy reports no issues, exit 0.
