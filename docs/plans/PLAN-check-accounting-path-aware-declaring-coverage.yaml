- 'fleet_line_grammar was doing three jobs (runtime format template, shard match regex, step 7 prose) and a template and a regex are not the same string, so the contract now carries TWO values: fleet_line_grammar (the str.format template, asserted equal to report_grammar() by step 13) and fleet_line_regex (the shard''s verbatim expected, asserted equal by step 6), with TestFleetLineRegexDerivation pinning their agreement against a line the check actually emits. Step 7''s expected stays PROSE describing the rendered line with N standing for an integer no step asserts -- this was the one place an implementer could otherwise have written a literal-integer expected.'
