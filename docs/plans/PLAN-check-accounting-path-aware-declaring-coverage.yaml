execution_steps:
- Create scripts/checks/hygiene/_declaring_coverage.py -- the non-registered CFG-lite walker. Resolve examined()/skipped() through the module's own import aliases (from scripts.checks import registry with or without an alias; from scripts.checks.registry import examined/skipped with or without an alias; import scripts.checks.registry as X), never by matching a bare identifier. Walk the check callable's body carrying a two-boolean state per live path (declaration seen, failure sink seen), following if/elif/else, for/while with else, try/except/else/finally, match cases and with blocks; treat raise and an append or extend to the callable's first positional parameter as failure-dominated; dedupe live states so the walk is bounded without a path budget. Expose a frozen undecidable vocabulary (opaque_decorator, dynamic_declaration, function_not_found, source_unavailable), a per-check result record, and is_fully_declared -- the bound-filter predicate (decidable, at least one success exit, zero undeclared) every consumer owes, because an undecidable row reports undeclared=0 with the reason set and that zero is the ABSENCE of a measurement, not a full-declaration verdict.
- 'Decompose the statement dispatch into per-construct helper functions from the start -- a single dispatcher measures 24 cyclomatic branches against a limit of 20 -- and use an explicit isinstance chain rather than a node-type lookup table, which does not type-check under mypy. Carry no unreachable defensive branch: the 100 percent whole-file floor admits none.'
- 'Create scripts/checks/hygiene/validate_declaring_coverage.py -- the registered check. Expose report_grammar(contract_path=None) reading docs/contracts/check-accounting.yaml''s path_aware_declaring_coverage.fleet_line_grammar, with that path as a joined executable-context literal (the form contract-population.yaml''s evaluator_kinds.check admits), so the new key has a registered reader and not a test node alone (Decision 168). Give the check exactly two reachable exits, each terminally declaring: registry.skipped(reason) when the contract grammar is unavailable, and registry.examined(len(rows), unit=registered_checks) on the normal path. Print one per-check line per undeclared or undecidable check plus exactly one fleet summary line formatted from the contract-derived grammar and the report-only notice, and NEVER append to failed on either path. The seam parameter is the only added branch and both arms are exercised by the mirror test -- add no unreachable defensive fallback, and never let ANY grammar-unavailable shape raise through the dispatch, since validation_result.py calls a check with no try/except and a raise would abort the whole tier and destroy that run''s CI-RCA attribution substrate. The routed set -- every shape that must reach that ONE skipped(reason) exit rather than propagate -- is exactly: an unreadable or absent contract file (OSError), undecodable file bytes (UnicodeDecodeError), malformed YAML (yaml.YAMLError), a document that is not a mapping, a missing path_aware_declaring_coverage key, a missing or non-mapping fleet_line_grammar sub-key, and a fleet_line_grammar value present but not a string. Catch only those named exception classes -- never a bare except -- and let the non-exception shapes fall out as a None grammar. Select the per-check report lines through is_fully_declared so an undecidable row prints its reason and NO declared/undeclared figures a reader could take for a bound.'
- 'Register through the remaining surfaces: the Entry literal in scripts/checks/hygiene/_manifest.py (bare string literals, full_segment full_after_lint, no pre membership) and the validate_declaring_coverage code_regression row in config/ci_rca_taxonomy.yaml.'
- 'Amend docs/contracts/check-accounting.yaml -- exactly one amendment_log entry (change_class field_add) plus one new top-level path_aware_declaring_coverage key defining the success-exit and declared-exit semantics, the stated CFG-lite limits, the undecidable vocabulary, the bound direction and the two report-line values. State plainly that the metric is report-only and that the threshold and fail-closed arm stay deferred; add no threshold and no status vocabulary member. State the BOUND DIRECTION just as plainly -- every stated CFG-lite limit errs toward reporting more undeclared and never toward reporting declared, so undeclared is an upper bound and declared a lower bound and no consumer, slice 1 included, may read the integers as exact (pinned by TestStatedCfgLiteLimits). State the bound''s SCOPE in the same clause: declared and undeclared are evidence if and only if undecidable_reason is None, an undecidable row reports success_exits=0 declared=0 undeclared=0 with the reason set, and a consumer -- slice 1''s roster-deletion oracle above all -- must filter on that field FIRST through is_fully_declared. State the match rule the walk actually implements: a bare wildcard case with no guard does NOT suppress the implicit fall-through, so such a statement followed by a trailing return reports three success exits with one undeclared rather than two. State the grammar-unavailable routed set under its own sub-key, naming every shape that reaches the single skipped(reason) exit instead of raising through the tier dispatch. Carry TWO machine-readable report-line values, because a str.format template and a match regex are not the same string and one key cannot honestly serve both jobs: fleet_line_grammar (the template the check reads back at runtime and formats with) and fleet_line_regex (the regex the declaring-coverage-fleet-report-line shard carries verbatim as its expected). Their agreement is pinned by TestFleetLineRegexDerivation, which matches the regex against a line the check actually emits -- never by re-deriving one from the other on both sides of an assertion. Have the single amendment_log summary NAME validate_declaring_coverage as the key''s runtime reader while leaving contract.evaluator at validate_check_accounting -- Decision 168''s obligation is resolution by evidence of reading, and the declared evaluator is a single mapping that is not widened here.'
- 'Write both mirror tests failing-first, as properties over synthetic in-memory or tmp_path sources -- never over the live fleet''s integers. Carry the six core behavioural pins: undeclared branch reported then not reported once declared; monotone shrink; failure-dominated exit excluded; the metric''s own module fully declared; report-only over a synthetic fleet with undeclared rows; the aliased-import form recognised. Add a local autouse fixture that pops the registry declaration slot after each test so the slot does not leak between tests. Add the two Decision 168 pins as well: the emitted fleet line is formatted from the CONTRACT-derived grammar (TestContractDerivedGrammar -- proved by pointing the report_grammar seam at a tmp_path contract carrying a DIFFERENT grammar and observing the emitted line change, never by re-deriving the same value on both sides of the assertion), and an unavailable grammar declares skipped(reason) with an empty failed list (TestGrammarUnavailableSkips, PARAMETERIZED over every routed shape -- missing file, undecodable bytes, malformed YAML, non-mapping document, missing key, non-mapping sub-key, non-string grammar -- because a single uncaught shape aborts the whole full tier, plus a structural node asserting the module carries no bare except and catches only the named classes). Pin the bound filter too: an undecidable row is NOT reported fully declared by is_fully_declared and its report line prints its reason and no declared/undeclared figures. Pin the match rule with a match-statement synthetic in both the bare-wildcard and the no-wildcard shape. TestExhaustedLiveStateSet is named for the WALKER''s live-STATE lattice it exhausts over synthetic sources -- it reads no live fleet. Add TestFleetLineRegexDerivation, matching the contract''s fleet_line_regex against a fleet line the check actually emits, so the template and the regex cannot drift apart. TestRegisteredSurfaces carries the registration-surface pins that are not proven by a dispatch: the _manifest.py Entry (full-tier membership, no pre membership, resolve() reaching this module''s own callable) and the config/ci_rca_taxonomy.yaml function_to_category row with its category a declared failure_categories member.'
- 'Write the two graduated shards at config/agent/verification_registry/entries/ named exactly declaring-coverage-check-registered.yaml (command_exit_zero) and declaring-coverage-fleet-report-line.yaml (command_output_matches, use_regex true, expected the contract''s path_aware_declaring_coverage.fleet_line_regex value VERBATIM -- no anchors, so the interior indented line still matches after the loader strips the captured stdout; step 6 asserts that equality). Measured gotcha: the regex contains a colon-space, so its expected value MUST be quoted in the shard or the registry loader rejects the file as a malformed mapping. Both shards were measured differentially -- PASS on HEAD, FAIL on an origin/main tree -- which is the admission condition for graduating a step.'
- Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55). Never weaken a check, test, tolerance, budget or plan field to obtain green (Decision 181).
- 'Report: what was implemented, verification results'
