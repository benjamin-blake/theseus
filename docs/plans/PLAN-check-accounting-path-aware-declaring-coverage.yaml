constraints:
- 'A clause may appear in permanent source (module docstring, contract key, comment) ONLY if a named verification_plan step would FAIL were it false. The contract''s new key is made load-bearing by step 7''s grammar assertion and by the derive-and-assert test node that reads path_aware_declaring_coverage from the contract file. Under the Decision 168 adjustment the key is load-bearing at RUNTIME as well: the check derives its grammar from it, step 13 asserts both the reader resolution and the derivation, and removing the key degrades the check to a declared skip rather than a silent green.'
- Cite symbols, never line numbers, in every docstring, comment, contract clause and plan field.
- 'REPORT-ONLY is absolute: the metric''s failed list stays empty for every input, no threshold is stated anywhere, and no status_vocabulary member (in particular no warned member) is added. The LOAD-BEARING pin is the synthetic-fleet test node TestReportOnly (a fleet whose rows carry undeclared success-exit paths, asserted to leave failed empty), which holds for every input; verification_plan step 7''s live-fleet empty-failed assertion is corroboration whose demonstrative force is a property of today''s fleet, not of the plan. The contract-grammar-unavailable path is a declared skipped(reason) -- Decision 170''s discrimination rule reserves skipped for an unavailable input or unmet precondition -- never a failed append and never a raise, which would abort the whole tier because validation_result.py dispatches a check with no try/except. EVERY unavailable shape routes to that one skipped exit -- OSError, UnicodeDecodeError, yaml.YAMLError, a non-mapping document, a missing key, a missing or non-mapping sub-key and a non-string grammar value -- caught by named exception classes only, never a bare except.'
- No hermetic step's expected text may contain a backtick literal -- validate_vp_replay extracts every backtick-delimited substring from expected and asserts it against replayed stdout. Re-check after every plan revision.
- Every diff-inspecting step uses the working-tree-aware seam scripts.checks._common.get_status_aware_diff (never get_changed_files, which existence-filters deletions away) because implement runs on an UNCOMMITTED tree.
- The touched set equals the declared scope in BOTH directions, asserted by step 10; an undeclared touched path STOPS for a human-directed plan amendment and is never resolved by appending to this plan's own scope (Decision 59, docs/contracts/implement-scope-boundary.yaml).
- No check module listed in config/check_accounting_baseline.yaml is edited (touch-it-fix-it, Decision 162 r3 shape / Decision 170 POINT 3, the shrink-only adoption ratchet -- reversal arm (d) is the credential classifier and is not this obligation), and the roster file itself stays byte-identical to origin/main. Asserted by step 9. Slice 0 deletes no roster entry -- that is slice 1's work.
- Every file in scope, tests included, stays under 500 SLOC. A crossing is resolved by decomposing into a further sibling helper module with its own mirror test, never by a budget raise, a raise-approved marker, a complexity waiver or a baseline registration (Decision 128, Decision 165). Asserted by step 11. The two governed non-Python files in scope stay inside their Decision 166 class limits (contracts and config, 500 effective lines each) with no config/structural_size_budgets.yaml entry or raise marker; asserted by step 11 alongside the SLOC half.
- 'The stated CFG-lite limits are pinned by named tests rather than left implicit: nested helper functions are OUT of the walk at any depth; an except handler is entered from the try block''s entry state; break and continue end the walked path; exits are counted per (exit site x distinct reaching state) so the walk is bounded and needs no path budget. a match statement always contributes its own entry state to the fall-through set even when a bare wildcard case with no guard is present, so a match whose cases all return plus a trailing return reports three success exits with one undeclared and not two. Undecidable constructs are reported in their own category, never counted as declared, and they sit OUTSIDE the bound entirely: declared and undeclared are evidence only when undecidable_reason is None, so every consumer -- slice 1''s roster-deletion oracle included -- must filter on that field first through is_fully_declared, which the check itself uses to select its per-check report lines. Every stated limit errs toward reporting MORE undeclared and never toward reporting declared, so undeclared is an upper bound and declared a lower bound; that direction is stated in the contract key and pinned by TestStatedCfgLiteLimits.'
- 'Out of scope, stated: no enforcement threshold, no warned status, no roster deletion (slice 1), no change to validate_check_accounting''s module-level ratchet, no change to derive_status or build_outcome, no CI workflow edit, nothing under src/ or scripts/executor/**, no deploy-trigger file, no edit to AGENTS.md, docs/DECISIONS.md or any skill.'
- 'Decision 67: IMPLEMENTATION plan only; scripts/execute_recommendation.py and scripts/executor/** are untouched. Decision 86: no new prose doc under docs/ -- the metric''s semantics land in the existing contract, collocated with its enforcement.'
- 'No Decision is ratified, retired or drafted by this plan; rationale routes to this plan''s Context (Decision 170''s deferred-work clause already authorises the metric). Decision 167''s significance.routing_rule field_semantics row (Never a numbered Decision) is the positive authority for that routing: the metric''s field semantics belong in the contract key. Decision 177 (live-body append-only) binds forward -- a stated threshold, when one is eventually justified, lands as a dated annotation or its own numbered entry, never an in-place edit of Decision 170''s body.'
- Never weaken any check, assertion, tolerance, budget, test or plan field to obtain green (Decision 181).
- No rescue agents or workaround loops (Decision 55).
