  - "Register backlog_health in scripts/test_coverage_checker.py FIRST, so every module written after it is coverage-bound as it lands."
  - "Write scripts/backlog_health/census.py plus its mirror test: the structural read, the status=='open' post-read invariant, and the five-bucket classifier."
  - "Write scripts/backlog_health/probe.py plus its mirror test: unshare-isolated execution, per-probe and global budgets, four verdicts, main_sha stamping."
  - "Write scripts/backlog_health/classify.py plus its mirror test: satisfied-vs-vacuous, bootstrap-cohort split, dangling-dependency predicate."
  - "Write scripts/backlog_health/escalate.py on rec_episode.run_episode, plus __main__.py and __init__.py and their mirrors."
  - "Register the four sources in config/agent/data_quality/source_registry.yaml and widen check_source_registry's SCANNED_PATHS."
  - "Author .github/workflows/backlog-health.yml as three jobs; add its ci_rca_taxonomy row, its r3_workflows baseline entries, and the two github-actions-evidence artifact rows in the same pass."
  - "Land the rec-3309 half: examined/skipped declarations plus the check_accounting_baseline shrink and the red/green test."
  - "Add the Decision 103 dated annotation and the recommendation-relevance.yaml tracking edit with its amendment_log entry."
  - "Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)."
  - "File the follow-on recs named in Context (Decision 181 residual, Decision 143 OIDC-sub pin, writer-identity narrowing, the stale ducklake_reader.yaml rec-2170 KNOWN GAP line) and record their ids in followon_recs."
  - "Report: what was implemented, verification results."
work_areas: []
rollback: >-
  Reverting the commit removes the workflow and package; no scheduled run can then fire. Recs already
  filed by a run that happened before the revert stay open and are closed through the normal portal
  path. The check_accounting_baseline shrink is not revertible in place -- the guard forbids
  re-adding a removed entry -- so a revert must restore the check's examined/skipped declarations
  rather than put the name back on the roster.
