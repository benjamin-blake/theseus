rollback: >-
  Reverting the commit removes the workflow and package; no scheduled run can then fire. Recs already
  filed by a run that happened before the revert stay open and are closed through the normal portal
  path. The check_accounting_baseline shrink is not revertible in place -- the guard forbids
  re-adding a removed entry -- so a revert must restore the check's examined/skipped declarations
  rather than put the name back on the roster.
