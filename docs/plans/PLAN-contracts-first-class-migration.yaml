test_obligations:
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: >-
      Branch order routes D before load_contract; new files must carry an admissible shape; the
      grandfather-only forms are closed at birth and on kind change; Pass 2 resolves base by the
      three-way union and fails on conformance loss; the pin is typed, direction-guarded via the
      ratified marker, and bootstrap-safe.
    verification_step: 1
    test_selector: tests/checks/contracts/validate_contract_drift
    red_green_expectation: >-
      Red before, green after, per scripts/verification_checks.py is_admitted. Every POSITIVE fixture
      asserts its own error string so none can be satisfied by an incidental pre-existing failure --
      this matters most for the `active` and Class D cases, which today fail the unmodified gate for
      the unrelated reason that neither is yet an enum member. NEGATIVE fixtures assert the ABSENCE of
      failure and are therefore tautological as admission tests; the full list is: self-collision
      passes, comment-only passes, pin decrease passes, the baseline-present twin passes, the two
      baseline .md members pass, and the permitted `absent -> none_grandfathered` sweep transition.
      They are retained as regression guards. The round-2 blanket claim that no fixture could be
      incidentally satisfied is withdrawn as false, and this enumeration is the complete correction.
  - source: scripts/checks/contracts/_population.py
    behavior: >-
      Declared-shape validation, evaluator resolution by executable-context AST scan, Class-A/B shape
      detection, extension/depth/case conformance, subject uniqueness and census counting.
    verification_step: 11
    test_selector: tests/checks/contracts/test__population.py
    red_green_expectation: >-
      Red before, green after. The module does not exist before this plan, so every assertion has no
      code path; the evaluator-resolution poles in particular fail red because the current tree has no
      resolution rule at all.
  - source: scripts/contracts_schema.py
    behavior: >-
      ContractClass admits D; ContractStatus admits active; ContractMeta requires subject and
      evaluator for D and ratified_via for a ratified status; _validate_class_shape raises for D; and
      NO baseline-dependent rule lives here.
    verification_step: 12
    test_selector: tests/test_contracts_schema.py
    red_green_expectation: >-
      Red before, green after. Without the enum and validator additions a Class D ContractMeta raises
      on the unknown class value. The negative assertion -- that a grandfathered file carrying active
      LOADS -- is the standing guard against reintroducing the sweep-blocking contradiction.
  - source: scripts/contracts.py
    behavior: >-
      load_contract_meta validates a D envelope without constructing ContractDocument; the three
      active edges exist with no inbound edge to active; load_all_contracts still skips D.
    verification_step: 12
    test_selector: tests/test_contracts.py
    red_green_expectation: >-
      Red before, green after. Without load_contract_meta the Class D fixture raises
      ContractValidationError on its top-level body keys. Transition edges are additionally exercised
      through the gate at step 3, because asserting a frozenset literal would pass red/green while
      exercising no reachable behaviour.
  - source: scripts/checks/contracts/_shared.py
    behavior: >-
      The merge-base path-set baseline, the -M rename map and the id-keyed envelope reader each accept
      an explicit injection seam, delegate reachability to _common.origin_main_reachable, and return a
      sentinel distinguishable from an empty baseline.
    verification_step: 10
    test_selector: tests/checks/contracts/validate_contract_drift
    red_green_expectation: >-
      Red before, green after. Without the readers the gate cannot classify new-vs-baseline, so every
      new-file fixture fails. The injection seam is itself load-bearing: module-level memoization would
      be populated by the first fixture and ignore later monkeypatched runs.
  - source: scripts/test_coverage_checker.py
    behavior: The gate resolves to a concern-split test package rather than a single module.
    verification_step: 14
    test_selector: tests/test_coverage_checker
    red_green_expectation: >-
      Red before, green after. Without the registration map_source_to_test returns the .py path and the
      directory assertion fails.
  - source: docs/contracts/contract-population.yaml
    behavior: >-
      The self-hosting Class D contract is valid under the gate it defines and supplies the pin the
      gate reads.
    verification_step: 9
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k 'RealPopulation or SelfHosting'"
    waiver_reason: >-
      A declarative contract file with no behaviour of its own; its correctness IS the gate's
      self-hosting assertion in the linked step, which loads it, validates its shape and reads its pin.
      A separate unit test would re-assert the same property one layer down.
  - source: docs/contracts/marker-grammar.yaml
    behavior: The ratchet is registered as a governed surface of the ratified raise-approved token.
    verification_step: 8
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k Ratchet"
    waiver_reason: >-
      A token registry consumed by _marker_guard, which Decision 165 already guards; the linked step
      exercises the authorization path end to end, and the registry entry itself is declarative with no
      independent behaviour to assert.
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The route row resolves and its topic is the new contract's subject; the prose_allowlist no longer
      advertises a permission the population gate revokes.
    verification_step: 6
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k SubjectUniqueness"
    waiver_reason: >-
      A discovery index whose link validity and topic uniqueness are already enforced by
      validate_placement in both presubmit tiers; the topic-equals-subject property is what the linked
      step asserts, and the allowlist narrowing is covered by step 5's extension conformance.
  - source: config/agent/verification_registry/registry.yaml
    behavior: Three graduated rows carry the full shape and a node_id naming a specific test function.
    verification_step: 18
    command: "bin/venv-python -m scripts.validate --pre"
    waiver_reason: >-
      A registry whose row shape and differential admission are enforced by validate_verification_registry
      inside the linked step; that check materializes each added row and runs it against a git worktree,
      which is a stronger assertion than any unit test this plan could add.
  - source: docs/decisions-index.json
    behavior: The committed index matches the corpus after the new entry lands.
    verification_step: 13
    command: "bin/venv-python -m pytest tests/checks/decisions -q"
    waiver_reason: >-
      A generated projection, never hand-edited; validate_decisions_index_freshness in the linked step is
      its authoritative drift check, and a unit test asserting a regenerated artefact matches its
      generator would be tautological.
  - source: audits/contract-first-governance-33c8667.yaml
    behavior: The amendment line records the ratchet's rationale and points at the owning contract.
    verification_step: 19
    command: "bin/venv-python -m scripts.validate"
    waiver_reason: >-
      A run-record artefact, governed false in the workflow_outputs structural class, with no consumer
      that parses the amended field; the linked full-tier step confirms the file still parses. Asserting
      prose content in a test would pin an immutable evidence document to a string literal.
constraints:
  - "EXACTLY ONE new numbered Decision entry, with `amends: [118]` only. The single permitted
    additional docs/DECISIONS.md edit is the guard-mandated supersession annotation on Decision 118.
    The `[167]` edge is dropped: no clause of Decision 167 is amended, and declaring it bought a
    second mandated annotation with no substance."
  - "NO baseline-dependent rule may live in scripts/contracts_schema.py. A pydantic validator cannot
    see the baseline; an unconditional rejection there would make the grandfather-only forms
    unloadable and block the population sweep this plan names as its completing act."
  - "The evaluator obligation is RESOLUTION BY EVIDENCE OF READING, not naming and not mention. A
    docstring or comment occurrence must NOT satisfy it -- the round-3 draft's textual rule admitted
    _marker_guard, the very pair its acceptance criterion claimed it rejected. This is not a new bar;
    it makes explicit the assertion the design already rested on (CFG-03), and the Decision entry must
    frame it that way."
  - "The grandfather-only forms are closed at birth AND on evaluator KIND CHANGE, never on arrival
    from absent -- `absent -> none_grandfathered` is the sweep and must pass."
  - "Retain the literal `fields:`/`verbs:` rejection alongside the shape rule. Replacing names with a
    Class-A-only shape rule opened the Class B seam; both mechanisms are kept."
  - "The ratchet's raise gate binds to the RATIFIED mechanism -- `# raise-approved: dec-NNN` through
    _marker_guard.authorization_failure, registered in marker-grammar.yaml. A private existence-only
    token contradicts Decision 165 point 1 and is self-refuting in this plan of all plans."
  - "FORWARD-ONLY. The 21 gate-visible free-form files are NOT seeded here. No existing contract file's
    content changes except file-router.yaml (one route row plus the allowlist narrowing) and
    marker-grammar.yaml (one used_by entry)."
  - "The pin has ZERO slack by design and must not be rounded up; the conformance-loss rule, not the
    pin's exact value, is the primary defence against the delete-the-contract-block fallback."
  - Graduated registry rows are capped at THREE; each costs a real git-worktree differential inside the
    300s fast tier.
  - "pytest-invoking VP steps stay `hermetic: false` (planning skill, Decision 148). With zero hermetic
    steps validate_vp_replay replays nothing and its 120s aggregate cap never loads."
  - "All five changed source files default to 100% per-file coverage; none has a coverage_baseline
    entry. Close gaps with tests, never a baseline entry -- lowering would itself require a
    `# baseline-lowered:` marker citing an authorising Decision."
  - This plan does NOT flip Decision 167 clause 3 to hard-fail and does NOT constitute
    migration-step-3 completion.
  - "CFG-11's EXISTING .md pair stays grandfathered; the FORWARD-facing hole it implies does not."
  - Counts asserted in tests must be DERIVED, never hardcoded literals.
  - "Decompose, never raise -- the _population.py split is unconditional, not a contingency."
  - No rescue agents or workaround loops (Decision 55).
  - Tests are synthetic-fixture only via the contracts_dir seam plus explicit baseline injection, with
    the real live-population regression running with baseline legs ENABLED. No network, no credentials.
context:
  - "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (120 of 120 triaged).
    CITE: Decision 118, Decision 86, Decision 127, Decision 167, Decision 150, Decision 104,
    Decision 165, Decision 166, Decision 134, Decision 153, Decision 131, Decision 105."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE after 3 round(s), then operator-directed
    close with all findings applied and no fourth round"
  - "Review protocol: THREE parallel zero-context reviewers per round (plan-critique+architect,
    adversarial gate-defeat, blast-radius/convention). Rounds 1, 2 and 3 each returned 3/3 REVISE.
    This revision applies every round-3 finding; the operator directed no fourth round on the ground
    that the remaining defects are specification-level and are better validated against running code
    than in further paper review."
  - "Round-3 findings applied, each independently verified against the tree: the evaluator predicate
    was satisfied by a docstring mention and therefore ADMITTED _marker_guard (the pair the acceptance
    criterion claimed it rejected) -- replaced with an executable-context AST scan matching the
    basename as an exact literal, chosen over a joined-path match because the genuine idiom is
    segmented (validate_placement.py:19); the evaluator-transition rule was ambiguous and its literal
    reading failed all 21 sweep files -- restated as a kind change only; the Class-A-only shape rule
    OPENED the Class B seam a name-based rule had closed -- both mechanisms retained; the ratchet
    marker was existence-only and conflicted with Decision 165 point 1 -- rebound to the ratified
    raise-approved token via _marker_guard; the pin's base-absent state is this plan's own landing PR
    -- direction comparison now skips it; base resolution widened to union(path, -M, contract.id)
    because each alone is defeated by a cheaper edit; the census identity is true by construction over
    a partition -- demoted to a forgot-a-bucket guard with scanned/ritual/skipped carrying the
    discriminating load; validate_plan_documents failed this plan's own artefact -- five per-source
    waivers added; 100% per-file coverage on five sources was unpriced -- now a VP step and a
    constraint; _FakeGit had no legal home under the no-new-conftest line -- a package conftest.py is
    the sanctioned home; the _population.py split made unconditional; `amends: [167]` dropped as
    unjustified, taking one mandated annotation with it."
  - "Two of round 3's defects were regressions introduced by round 2's own fixes (the Class B seam and
    the private marker). That pattern -- specifying mechanism in prose, then discovering on execution
    that the rule is subtly wrong -- is why the operator closed paper review here: the remaining
    predicates are cheaper to validate by writing and running them than by another review round."
  - "Class D remains cheaper to author than A/B by design: mechanism bodies are heterogeneous and
    cannot carry Class A's per-field obligations. What the evaluator rule removes is the FREE choice --
    a D contract now requires a guard that demonstrably reads it. The residual gap is stated honestly:
    class selection for genuinely-A-or-B content is caught by the shape and name detectors, not by an
    author-intent check, and the Decision entry must say so rather than claiming cost-equalisation."
  - "Subject is a precision-optimal, recall-poor detector: it prevents FUTURE duplicate-subject claims
    and detects NONE of CFG-05's existing named instances. The topic-equals-subject rule prevents this
    plan from adding a third un-reconciled naming axis over one population."
  - "Fable advice-consults (three rounds) informed this design. Adopted: the one-taxonomy reading;
    envelope-only validation over a nested spec: key; the typed evaluator union; the canonical-dump
    change rule; the red-fixture-plus-census two-halves proof. Adapted: the grandfather form became a
    pinned ratchet rather than a seeded roster. Rejected: translating `status: active` to `ratified`,
    and keeping a countable `{none:}` form available to new files."
  - "Human rulings: (1) one unified taxonomy, since a self-selected lighter tier is a gradient not a
    classification; (2) extend ContractStatus rather than translate; (3) the ratchet's why persisted to
    the audit file as a dated amendment line pointing at the contract for the how; (4) `active`
    grandfathering-only; (5) annotate the amends victims rather than dropping edges or waiving the
    guard -- applied to the one edge that survives justification; (6) the grandfathered evaluator key is
    named `none_grandfathered` so it states WHY; (7) the evaluator must read its contract, framed as
    making an implicit assertion explicit rather than adding a bar."
  - "rec-2915 (open, High) -- registered checks must report examined-input counts. This plan implements
    that shape for THIS gate only and does not close the repo-wide rec; not bundled."
  - "Follow-on work filed and NOT in scope: rec-3053, rec-3054, rec-3055, rec-3056."
  - "A Critical recommendation obliging machine enforcers for contracts declaring the grandfathered
    evaluator form is filed at implement time; rec-3054 is its standing consumer."
  - "Numbering race: max header is 167; re-check at implement time. Headroom verified: 120/132 live
    headers, 691,421/780,000 combined bytes."
  - "Fast-tier budget (_FAST_TIER_BUDGET_SECONDS = 300): the gate gains one memoized git ls-tree, one
    git diff -M, and one git cat-file --batch of baseline Class D envelopes, plus a git show per changed
    Class D file; three graduated rows add three worktree differentials on the implementing PR only.
    Step 18 is the budget check and its fix_if directs reducing rows rather than raising the budget."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Re-checked the current max '## Decision NNN:' header before authoring the entry
  - Confirmed map_source_to_test's resolved package path before creating the test package
  - Confirmed the gate-visible non-ritual count before writing the pin
execution_steps:
  - "scripts/contracts_schema.py -- add ContractClass.D and ContractStatus.active; add optional typed
    subject/evaluator; validator requires both for D and ratified_via when status is ratified;
    _validate_class_shape raises for D. Add NO baseline-dependent rule here."
  - "scripts/contracts.py -- add load_contract_meta; add the three active edges with no inbound edge to
    active; make load_all_contracts skip D with a docstring note naming context_docs.py's bare except."
  - "scripts/checks/contracts/_shared.py -- add the merge-base path-set baseline, the -M rename map and
    the id-keyed envelope reader, each with an explicit injection seam."
  - "scripts/checks/contracts/_population.py -- create it FIRST, before touching the gate, so the
    decomposition is the starting shape rather than a retrofit."
  - "scripts/checks/contracts/validate_contract_drift.py -- implement (a)-(i) in that branch order,
    delegating to _population. Read the pin from the INJECTED contracts_dir."
  - "docs/contracts/contract-population.yaml -- author the Class D self-hosting contract with
    status ratified and ratified_via set; re-derive the pin before committing and record the
    zero-slack rationale."
  - "docs/contracts/marker-grammar.yaml -- add validate_contract_drift to tokens.raise-approved.used_by."
  - "docs/contracts/file-router.yaml -- add the route row (topic + targets) and narrow the
    prose_allowlist .md glob to the two grandfathered members."
  - "scripts/test_coverage_checker.py -- register the gate in _CONCERN_SPLIT_TEST_PACKAGES, then run
    map_source_to_test to LEARN the package path before creating it."
  - "Decompose the 457-SLOC test module into that package with __init__.py and a package conftest.py
    hosting _FakeGit and helpers, migrating all TEN classes and extending _FakeGit for git ls-tree,
    git diff -M and git cat-file. Then add the new fixture modules; every positive fixture asserts its
    own error string."
  - "tests/checks/contracts/test__population.py, tests/test_contracts.py, tests/test_contracts_schema.py,
    tests/test_coverage_checker/ -- add the module, loader, validator, transition and mapping coverage."
