schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "contracts-first-class-migration"
intent: >-
  Make docs/contracts/ a first-class destination for MECHANISM content by giving mechanism
  contracts a real class in the CD.25 taxonomy (Class D), whose defining obligation is a declared
  evaluator that DEMONSTRABLY READS the contract. That obligation is not a new bar -- it makes
  explicit an assertion the design already rested on implicitly (the audit's CFG-03 finding, "a
  rule with no evaluator is not a rule", and this plan's own claim that a Class D body's shape
  authority is its evaluator). Installs the obligation forward-only on NEW contract files, makes
  subject-uniqueness well-posed, extends amendment-log and transition enforcement to the new class,
  and pins the grandfathered population as a visible downward-only ratchet bound to the ratified
  marker-authorization mechanism.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-contracts-first-class-migration.yaml
phase: >-
  Migration step 3 (MECHANISM HALF ONLY) of audits/contract-first-governance-33c8667.yaml.
  Per-finding disposition, stated so a future session does not read these as closed -- CFG-04:
  substrate installed for depth-1 *.yaml and *.yml; its acceptance's second clause (seed the
  existing free-form files) is UNMET. CFG-05: mechanism installed; second clause UNMET, and the
  detector catches NONE of the audit's existing named instances. CFG-09: LEAST addressed and the
  only high-severity one -- amendment-log and transition checking reach Class D only, so an edit to
  marker-grammar.yaml, decision-entry.yaml or file-router.yaml still requires no log after this
  lands, and router coverage moves 8/39 -> 9/40. The completing act for all three is the population
  sweep. Steps 1 (PR #863) and 2 (Decision 167, PR #871) are merged. T2.56 is not_started with both
  criteria open; this plan closes none and declares no closes_criteria. EXPLICITLY NOT step-3
  completion, and it does NOT fire Decision 167 clause 3.
scope:
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      PURELY ADDITIVE. Add `D` to ContractClass; add `active` to ContractStatus (in force and
      consumed but never ritually ratified, so the sweep can seed grandfathered files honestly
      rather than asserting they are ratified); add optional typed `subject` and `evaluator` to
      ContractMeta with a validator requiring BOTH for D and requiring `ratified_via` whenever
      status is `ratified`; give _validate_class_shape an explicit D branch that RAISES rather than
      falling through to the Class C else-branch at line 181. CRITICAL -- NO new-vs-baseline rule
      here. A pydantic validator cannot see the baseline, so an unconditional rejection of the
      grandfather-only forms would make them unloadable for the sweep this plan names as its own
      completing act.
  - file: scripts/contracts.py
    action: Modify
    purpose: >-
      Add `load_contract_meta(path) -> ContractMeta`, ENVELOPE-ONLY, validating just
      `data["contract"]` and never constructing ContractDocument -- how Class D escapes
      `extra="forbid"` (contracts_schema.py:155) without relaxing the shared model. The rejected
      alternative (nesting D bodies under `spec:`) would push consumers one level down; the
      verified instance is validate_placement's top-level `routes:` read (validate_placement.py:19,38).
      Add `active->ratified`, `active->deprecated`, `active->superseded` to _ALLOWED_TRANSITIONS and
      deliberately NO inbound edge to `active`. load_all_contracts continues to return only A/B/C,
      explicitly skipping D -- load-bearing against a SILENT regression, since context_docs.py:270
      is a bare `except Exception: pass` that would swallow the error and kill the provisional scan.
  - file: scripts/checks/contracts/_population.py
    action: Create
    purpose: >-
      UNCONDITIONAL decomposition, not a contingency. The gate is 119 effective SLOC and this plan
      adds thirteen feature groups; Decision 128 makes decomposition the default response, and
      deciding it here avoids the choice being made under implementation pressure. Owns the
      declared-shape validation, evaluator resolution, Class-A/B shape detection, extension/depth
      conformance, subject-uniqueness and the census; the gate retains orchestration and Pass 1/2
      sequencing. Mirror-convention test home is tests/checks/contracts/test__population.py.
  - file: scripts/checks/contracts/_shared.py
    action: Modify
    purpose: >-
      Add the MERGE-BASE path-set baseline reader (one `git ls-tree`), keyed on the SAME ref Pass 2
      resolves -- using origin/main's tip would make a file deleted by another PR read as "new" in
      an untouched PR; the `-M` rename map; and one `git cat-file --batch` of baseline Class D
      envelopes for id-based base resolution. Each takes an explicit injection seam mirroring
      _baseline.BaselineReaderFn: module-level memoization keyed on ROOT would be populated by the
      first fixture and ignore later monkeypatched runs, making the suite order-dependent and
      silently vacuous. Reachability delegates to _common.origin_main_reachable. Deliberately NOT a
      generalisation of scripts/checks/decisions/_baseline.py -- that is a decision-NUMBER reader in
      the decisions domain, this is a PATH reader in the contracts domain, and Decision 104 forbids
      a cross-domain helper. Record that reasoning in the docstring.
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Orchestration plus Pass 2. (a) BRANCH ORDER -- Class D routes to load_contract_meta BEFORE
      load_contract / resolve_refs / check_required_inline_fields, or a D file satisfies the
      existing test at lines 70-72, falls through to load_contract and dies on extra=forbid.
      (b) Narrow the skip branch: neither shape and new-vs-baseline -> FAIL; else grandfathered.
      (c) Grandfather-only prohibitions enforced HERE, where new-vs-baseline is decidable: a new
      file may not declare `status: active` nor `evaluator.none_grandfathered`. (d) PASS 2 for
      Class D -- validate_status_transition on the ContractMeta pair; amendment-log on any canonical
      dump delta with `amendment_log` excluded; an EVALUATOR-KIND-CHANGE rule (below); and a
      CONFORMANCE-LOSS rule: base carried a valid shape, head does not -> FAIL, which closes the
      delete-the-contract-block fallback by identity instead of relying on the pin's exact value.
      (e) BASE RESOLUTION as a UNION -- path, then the `-M` rename map, then `contract.id` across
      baseline envelopes; NEW only if all three miss. Path alone is defeated by a rename;
      `-M` alone is defeated by a rename that rewrites past its ~50% similarity default; id alone is
      defeated by editing the id, which is one line and cheaper than either. (f) PIN -- strict
      `isinstance(int) and not isinstance(bool)`, non-negative; an INCREASE is gated through the
      RATIFIED mechanism (below), never a private marker; and a base in which the pin FILE DOES NOT
      EXIST skips the direction comparison, because that is exactly this plan's own landing PR.
      (g) CENSUS every run (see acceptance). (h) FAIL-CLOSED -- a missing docs/contracts directory
      FAILS (today it returns early and passes, silently evaporating every check at once);
      UnicodeDecodeError joins the except tuple (it subclasses ValueError, not OSError, so today it
      escapes as a traceback). (i) UNREACHABLE origin/main -> advisory-SKIP of the baseline-dependent
      legs with a printed reason, matching the _baseline.py precedent, while uniqueness, shape and
      evaluator resolution still run. NOT a FAIL: the shallow-checkout job is main-validate
      (ci.yml:85-96), so failing on unreachability would redden main on every post-merge run.
  - file: docs/contracts/contract-population.yaml
    action: Create
    purpose: >-
      The mechanism's semantics and the first Class D contract -- self-hosting, so the file defining
      the obligation satisfies it. `contract.status: ratified` with `ratified_via` naming this plan
      and its Decision (it cannot declare `active`, which is grandfather-only, and the new validator
      requires ratified_via for a ratified status). Its evaluator is
      `{check: validate_contract_drift}`, which genuinely reads it (the pin), so the file
      demonstrates the bar rather than asserting it. Carries the shape grammar, the evaluator-kind
      union and its AST resolution rule, the grandfather-only prohibitions, the subject namespace and
      topic-equals-subject rule, the change-detection / kind-change / conformance-loss rules, the
      census fields, and `ratchet.grandfathered_max`. Records that the pin has ZERO slack by design
      and must not be rounded up, and that the evaluator_none_grandfathered and status_active
      counters open at exactly ZERO (verified: no `subject:` key exists in docs/contracts today and
      `active` is not yet an enum member) and are reported but NOT pinned, because the sweep must be
      able to raise them once -- the kind-change rule is what guards them in the interim. Stay under
      the Decision 166 contracts-class limits (500 effective lines, 2,000 max line chars).
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: >-
      Register the ratchet as a governed surface of the EXISTING ratified `raise-approved` token
      (tokens.raise-approved.used_by gains validate_contract_drift). The round-3 draft minted a
      private `# ratchet-raise-approved:` marker with no `dec-NNN`, which is an EXISTENCE-only
      marker -- exactly the class Decision 165 point 1 narrowed away from when it consolidated five
      guards onto _marker_guard.py, and an undeclared fourth token against this file's three. It was
      also self-refuting: a plan whose thesis is "a rule with no evaluator is not a rule" cannot
      install a marker whose only evaluator is its own presence. The gate constructs a RegistrySpec
      (rel_path contract-population.yaml, token raise-approved, gated_direction up, flat extractor on
      ratchet.grandfathered_max) and calls _marker_guard.authorization_failure; NO edit to
      _marker_guard.py itself is required.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Two edits. (1) One route row for contract-population.yaml -- non-empty `topic` and a non-empty
      `targets` list per validate_placement's shape rules, with a topic that collides neither with
      the 82 existing topics (validate_placement's duplicate-topic gate) nor with any ritual contract
      id (this plan's own subject-uniqueness rule), since the topic BECOMES that file's subject under
      the topic-equals-subject rule. (2) Narrow the `prose_allowlist` glob
      `docs/contracts/**/*.md` to the two grandfathered members by name. Left as-is, the discovery
      index that Decision 66/86 make authoritative for "where does this file go" would keep
      advertising a permission the population gate revokes -- two live guards giving contradictory
      verdicts on the same new file, which is the drift-by-design anti-pattern this plan exists to
      reduce.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Register scripts/checks/contracts/validate_contract_drift.py in _CONCERN_SPLIT_TEST_PACKAGES
      (line 212). Two reviewers independently executed map_source_to_test and confirmed it then
      resolves to tests/checks/contracts/validate_contract_drift. Required because the existing test
      module is 457 effective SLOC against the 500 hard limit and is unregistered in
      config/sloc_budgets.yaml; Decision 128 makes decomposition the default, never a raise.
  - file: tests/checks/contracts/test_validate_contract_drift.py
    action: Delete
    purpose: >-
      Decomposed into the package below. Inventory is TEN test classes plus the _FakeGit helper --
      TestCategory1..8, TestReRatificationTriggerWellFormedness, TestCleanAndNoRitual. The count
      matters because check_test_file_exists accepts any single test_*.py in the package, so a
      silently dropped class would pass every gate. A full-tree scan confirms no live check, CI
      workflow or registry node_id references this module.
  - file: tests/checks/contracts/validate_contract_drift/
    action: Create
    purpose: >-
      Concern-split package with __init__.py, plus a package-level `conftest.py` that is the home for
      _FakeGit, _install_fake_git, _write and _valid_class_a. The round-3 draft said "no new
      conftest", which foreclosed the only sanctioned home -- validate_no_cross_test_imports fails
      any tests/** import whose final dotted component starts with `test_`, and its own docstring
      names conftest fixtures and tests/fixtures/ as the alternatives. _FakeGit MUST be extended to
      answer `git ls-tree`, `git diff -M --name-status` and `git cat-file --batch`: it currently
      returns rc=0 with empty stdout for any unrecognised command, which would yield an EMPTY
      baseline and make every tmp_path file read as new. Each split module must preserve the existing
      load-validate.py-by-path pattern so registry.all_checks() is populated for the evaluator
      resolution fixtures. Every fixture passes an explicit baseline_reader rather than relying on
      module state.
  - file: tests/checks/contracts/test__population.py
    action: Create
    purpose: Mirror-convention test home for the new _population.py module.
  - file: tests/test_coverage_checker/
    action: Modify
    purpose: >-
      Mapping test asserting the gate resolves to an existing test DIRECTORY after registration and
      that the pre-decomposition single-file module is gone (the closure obligation for the Delete row).
  - file: tests/test_contracts.py
    action: Modify
    purpose: >-
      load_contract_meta coverage (a D envelope validates with arbitrary body keys; missing subject
      or evaluator raises; `ratified` without `ratified_via` raises; a grandfathered file carrying
      `active` or `none_grandfathered` LOADS, which is the guard against reintroducing the
      sweep-blocking contradiction) and the new transition edges. Transition edges are ALSO exercised
      through the gate, because asserting a frozenset literal would pass red/green while exercising
      no reachable behaviour.
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: Coverage for the two enum widenings and the ContractMeta validator's new rules.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Exactly THREE graduated rows, each with the full shape -- check_id, primitive_slot,
      guard_target, guard_symbol, `plan_slug: contracts-first-class-migration` (the implement-PR leg
      matches on check_id AND plan_slug), graduated_at, graduated_by, and check_spec.node_id naming a
      specific test FUNCTION (the test_selector slot does _require("node_id"); a `pytest -k` class
      filter is not a node id). Three, not nine: each added row triggers a REAL git-worktree
      differential inside the 300s fast tier.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerated via `bin/venv-python -m scripts.decisions_index --write`.
      validate_decisions_index_freshness is ungated in --pre (registry.py:116) and fails on drift.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      EXACTLY ONE new numbered entry, PLUS the ONE guard-mandated supersession annotation its
      envelope requires. The envelope declares `amends: [118]` only -- the round-3 draft also
      declared `[167]`, but no clause of Decision 167 is amended: this plan states it does NOT fire
      167 clause 3, which is a clarification, not an amendment, and the over-declared edge bought a
      second mandated annotation with no substance behind it. validate_supersession_annotations
      harvests envelope edges (lines 86-90) and _is_annotated is satisfied by the bare substring
      "Decision 168" inside Decision 118's block; decision-entry.yaml:117-120 prescribes exactly this
      append-only accretion, so it conflicts with no immutability rule. The entry carries the three
      bold markers (Status / Date / Decision) plus an envelope with `number`,
      `significance.value: numbered_decision` and a non-empty `significance.justification`, under the
      6,144-byte WARN norm. It records the RULING only, citing contract-population.yaml for every
      shape, and states three honesty clauses: that the evaluator obligation makes an already-implicit
      assertion explicit rather than adding a bar; that this is NOT step-3 completion and the sweep is
      the completing act; and that subject-uniqueness PREVENTS future duplicate-subject claims while
      DETECTING none of CFG-05's existing named instances.
  - file: audits/contract-first-governance-33c8667.yaml
    action: Modify
    purpose: >-
      Append ONE dated amendment LINE to the meta.contract_notes BLOCK SCALAR (a `|-` scalar, not a
      mapping -- a YAML key there is a parse error), mirroring the `amendment_2026-08-07:` text-line
      precedent at line 27. Records the ratchet's WHY and points at contract-population.yaml for the
      HOW. States that findings, severities and Q1-Q9 verdicts are unchanged. audits/*.yaml is
      `governed: false` in the workflow_outputs class, so no size gate applies.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - A NEW depth-1 docs/contracts .yaml or .yml file carrying neither a ritual block nor a valid
    Class D shape FAILS, naming the file and the missing shape; the same file present at the
    merge-base baseline passes and counts as grandfathered.
  - A NEW tracked file under docs/contracts that is not a depth-1 .yaml/.yml FAILS unless
    baseline-present; the two existing .md members remain grandfathered, and the file-router
    prose_allowlist is narrowed to those two by name so no guard advertises what another revokes.
    The conformance-admitted set must be EXACTLY the globbed set (state the case-sensitivity
    invariant; `glob("*.yaml")` is case-sensitive).
  - "A Class D `evaluator` must RESOLVE by evidence of READING, not by mention. For
    `{check: <name>}`: the name must be a member of pre_sequence() or full_sequence() (registration
    alone is insufficient -- register() populates _REGISTRY at import independent of sequencing),
    AND the check's module, or a one-hop scripts/ module it imports, must contain the contract's
    BASENAME as a string literal in EXECUTABLE context. Docstrings and `#` comments are excluded via
    AST. Match is exact equality on the literal, not substring, so `file-router.yaml` does not match
    `my-file-router.yaml`. Basename rather than joined path, because the genuine idiom is segmented:
    validate_placement.py:19 builds `_common.ROOT / \"docs\" / \"contracts\" / \"file-router.yaml\"`,
    which a joined-path match would wrongly reject."
  - "The rule's two verified poles must both hold: validate_placement/file-router PASSES (executable
    literal at line 19), and _marker_guard/marker-grammar FAILS (its only occurrences are the module
    docstring at line 8 and a `#` comment at line 35). The round-3 draft's textual-reference rule
    ADMITTED the _marker_guard pair while its acceptance criterion claimed it rejected them -- the
    fixture must assert both poles, not just the negative."
  - "The grandfather-only forms are closed at birth (gate, new-vs-baseline) and in transition, where
    the transition rule is a KIND CHANGE only: FAIL iff the base document carried a resolving
    evaluator ({check} or {agent_surface}) and the head carries {none_grandfathered}. `absent ->
    none_grandfathered` on a baseline-present file is PERMITTED, because that is exactly the 21-file
    sweep -- the round-3 wording would have failed all 21 and blocked this plan's own completing act."
  - Loading a grandfathered file that legitimately carries `active` or `none_grandfathered` SUCCEEDS
    at the schema layer, so the sweep is not blocked by this plan's own substrate.
  - "Class-A AND Class-B smuggling are both detected. Retain the literal `fields:` / `verbs:`
    rejection AND add the shape rule over a descriptor set covering BOTH classes -- Class A's
    type / nullable / description / semantics / populated_by / dq_intent and Class B's
    payload_schema_ref / response_codes / typed_errors. The round-3 draft replaced names with a
    Class-A-only shape rule and thereby OPENED the Class B seam it had previously closed."
  - Two files declaring the same subject FAIL over the union of declared subjects and ritual contract
    ids, deduped per file; and a Class D file with a file-router route row whose subject differs from
    that row's topic FAILS.
  - A Class D file whose parsed content changed with no new amendment_log entry FAILS; a comment-only
    or formatting-only edit passes; base resolution is the union of path, the `-M` rename map and
    `contract.id`, so neither renaming, rewriting past the similarity threshold, nor editing the id
    sheds the obligation; and a file whose base carried a valid shape but whose head does not FAILS
    on conformance loss.
  - "The pin is strictly typed (int, not bool, non-negative); a base in which the pin file does not
    exist SKIPS the direction comparison, because that is this plan's own landing PR; and an INCREASE
    is authorised only through the ratified mechanism -- a `# raise-approved: dec-NNN <reason>` marker
    routed through _marker_guard.authorization_failure, registered in marker-grammar.yaml, never a
    private existence-only token. The value is the gate-visible non-ritual population, 21, with ZERO
    slack, verified four times independently as 37 .yaml = 16 ritual + 21 non-ritual plus 2 .md."
  - "The census prints scanned / ritual / declared / grandfathered / evaluator_none_grandfathered /
    status_active / skipped every run. Its discriminating assertions are `scanned > 0`, `ritual > 0`
    and `skipped == 0` against the real tree; the bucket identity
    `scanned == ritual + declared + grandfathered + skipped` is retained only as a forgot-a-bucket
    guard with INDEPENDENTLY computed counters, and is explicitly NOT claimed to answer the
    vacuous-pass concern -- over a mutually exclusive partition it cannot fail. Counts are derived
    from the scan, never hardcoded."
  - A missing docs/contracts directory FAILS rather than passing; a non-UTF-8 file fails as a
    category-1 defect rather than raising an uncaught traceback.
  - With origin/main unreachable the baseline-dependent legs advisory-SKIP with a printed reason while
    uniqueness, shape and evaluator resolution still run and the census still prints. This must NOT
    fail, because the shallow-checkout job is main-validate.
  - docs/contracts/contract-population.yaml passes the gate it defines, as a `ratified` Class D
    contract with `ratified_via` set and an evaluator that genuinely reads it.
  - The existing live population passes unchanged and preflight's provisional scan is unaffected.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      RED FIXTURE -- a NEW file with neither shape must fail, asserting the SPECIFIC error string.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k DeclaredShapeObligation"
    expected: "Pass. The message names the file and the missing shape; the baseline-present twin passes."
    fix_if: "No failure for a new keyless file -- the skip-branch narrowing did not take effect."
    hermetic: false
    graduation: graduate
    graduation_check_id: "contracts-new-file-declared-shape-required"
  - step: 2
    phase: pre-deploy
    action: >-
      EVALUATOR RESOLUTION -- both verified poles, plus the sequencing and indirection cases.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k EvaluatorResolution"
    expected: "validate_placement/file-router PASSES (executable literal); _marker_guard/marker-grammar FAILS (docstring + comment only); an unsequenced-but-registered check FAILS; a one-hop imported module carrying the literal PASSES; an unknown name FAILS."
    fix_if: "A docstring mention satisfies the rule -- the obligation is back to asserting delegation rather than verifying it."
    hermetic: false
    graduation: graduate
    graduation_check_id: "contracts-evaluator-must-read-its-contract"
  - step: 3
    phase: pre-deploy
    action: >-
      Grandfather-only forms in both directions, including the PERMITTED sweep transition.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k GrandfatherOnly"
    expected: "New-file active and new-file none_grandfathered fail with their own messages; a kind change from a resolving evaluator to none_grandfathered fails; `absent -> none_grandfathered` on a baseline-present file PASSES."
    fix_if: "Either direction is open, or the sweep transition fails and the completing act is blocked."
    hermetic: false
    graduation: graduate
    graduation_check_id: "contracts-grandfather-only-forms-both-directions"
  - step: 4
    phase: pre-deploy
    action: "Class-A AND Class-B smuggling detection, by name and by shape."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k Smuggling"
    expected: "A D file with literal `fields:` fails; with literal `verbs:` fails; with field-shaped `columns:` fails; with verb-shaped `operations:` carrying payload_schema_ref/response_codes fails; a genuine heterogeneous mechanism body passes."
    fix_if: "The Class B seam is open -- the shape rule covers only Class A descriptor keys."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible, but each graduated row costs a real git-worktree differential inside the
      300s fast tier (validate_verification_registry, registry.py:169). Three rows is this plan's
      priced budget; this check shares step 1's guard target and re-runs on every suite execution, so
      graduating it buys a second differential rather than new coverage.
  - step: 5
    phase: pre-deploy
    action: "Extension, depth and case conformance, including the pre-authorised .md path."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k ExtensionDepth"
    expected: "A new .yml is governed; a new .md and a nested .yaml fail; the two baseline .md members pass as grandfathered; the conformance-admitted set equals the globbed set under case variation."
    fix_if: "A one-character extension change escapes the obligation, or a .YAML file is conformant-but-unscanned."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same fast-tier differential budget. This check's subject is a glob whose correctness is also
      asserted against the real tree in step 9, so a graduated synthetic row would duplicate rather
      than extend the guard.
  - step: 6
    phase: pre-deploy
    action: "Subject uniqueness, per-file self-collision, and topic-equals-subject."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k SubjectUniqueness"
    expected: "Two files sharing a subject fail; a subject colliding with a ritual id fails; a ritual contract declaring its OWN id passes; a Class D file whose subject differs from its router topic fails."
    fix_if: "Collisions pass, self-collision false-positives, or the third naming axis goes unreconciled."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same fast-tier differential budget, and deliberately the lowest-value candidate: the detector is
      precision-optimal and recall-poor by design, so a standing synthetic guard asserts a property
      the live population cannot currently exercise.
  - step: 7
    phase: pre-deploy
    action: "Pass 2 -- amendment log, the three-way base resolution union, and conformance loss."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k PassTwo"
    expected: "Content change without an entry fails; comment-only passes; a rename, a rename-plus-rewrite past the -M threshold, and an edited contract.id each still resolve a base and still fail; base-had-shape/head-lacks-shape fails on conformance loss."
    fix_if: "Any of the three evasions sheds the amendment obligation, or whitespace is treated as an amendment."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same fast-tier differential budget, and the rename and id fixtures depend on a synthesized git
      history a standing registry row would have to reconstruct on every run -- expensive for a guard
      whose subject is already suite-covered.
  - step: 8
    phase: pre-deploy
    action: "The ratchet -- typing, direction, the ratified marker path, and the base-absent bootstrap."
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k Ratchet"
    expected: "An unmarked increase fails; an increase carrying `# raise-approved: dec-NNN` whose Decision body names the governed key passes via _marker_guard.authorization_failure; a marker citing an unrelated Decision fails; a decrease passes; missing key, string, bool and negative each fail; a base without the pin FILE skips the direction comparison; the pin is read from the INJECTED contracts_dir."
    fix_if: "The marker is existence-only, the landing PR wedges on base-absent, or the pin is read from the real tree so fixtures never trip it."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same fast-tier differential budget. The authorization half delegates to _marker_guard, which is
      already a registered, separately-guarded mechanism, so graduating here would duplicate a guard
      Decision 165 already owns.
  - step: 9
    phase: pre-deploy
    action: >-
      REGRESSION and CENSUS against the real population with the baseline legs ENABLED -- not the
      merge_base_rc=1 shortcut the existing real-population test uses, which would leave the census
      and ratchet unexercised against real git.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift -q -k 'RealPopulation or SelfHosting'"
    expected: "Zero failures against docs/contracts; scanned > 0, ritual > 0 and skipped == 0 with counts derived from the scan; contract-population.yaml passes the gate it defines."
    fix_if: "An existing contract regressed, a bucket is mis-assigned, or the self-hosting file cannot satisfy its own obligation."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Deliberately NOT graduated despite being kernel-expressible: it passes both before and after the
      change (a regression assertion, tautological as an admission test), so graduating it would
      launder a non-admitted check into the registry. Bundling it with the genuine census assertions
      under one id -- as an earlier draft did -- would have admitted it on their strength.
