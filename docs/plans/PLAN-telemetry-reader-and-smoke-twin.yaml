constraints:
- >-
  IMPLEMENTATION only (Decision 67). Decompose, never raise, an SLOC budget (Decision 128). No rescue loops: an
  unrecoverable live failure stops for RCA (Decision 55).
- >-
  PR 1 carries IAM (two roles, CI invoke grants) and Decision text, so it merges only on Benjamin's word in this build's
  thread, after code review PROCEED and green CI, and only once PLAN-telemetry-production-catalog's admin session record shows the boundary apply;
  approving the gated apply is his act. PR 2 carries no IAM and merges under the standing rule (governed CI deploys
  are not always-ask).
- >-
  Approved text lands verbatim except NNN, MMM, DATE and PR numbers; meaning-preserving corrections only, noted in the
  thread and PR; anything else goes back to Benjamin.
- >-
  The shared reader does not change behaviour: no edit to src/lambdas/ducklake_reader/, its Terraform resources, its
  pins or require_smoke_pin. Its telemetry slot is retired by PLAN-telemetry-production-flip, and its other surfaces belong to the query_ops
  retirement thread; never describe its caller-SQL path in a commit, PR or contract.
- >-
  Public repo (Decision 101): no account id, ARN, hostname, URL or secret in any committed file, commit, PR body or
  log line.
- >-
  Never weaken a test assertion to obtain green (Decision 181): every changed pin is a planned-change or growth-safe
  disposition recorded in weakening_dispositions.
- >-
  One DuckLake deploy or apply at a time; the coordinator sequences this plan's merges against other telemetry builds.
