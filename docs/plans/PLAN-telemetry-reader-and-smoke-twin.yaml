    its smoke telemetry pin until PLAN-telemetry-production-flip.
- file: terraform/personal/ducklake_telemetry_writer_smoke.tf
  action: Create
  purpose: >-
    PR 1. The twin (Decision N+1 cl.1), mirroring ducklake_telemetry_writer.tf: log group; role
    agent-platform-ducklake-telemetry-writer-smoke with the apply boundary and lambda_assume trust; inline policy
    DuckLakeTelemetryWriterSmokeRuntime with the writer's current statements bound to SMOKE only (Logs,
    TelemetryDsnRead on aws_secretsmanager_secret.ducklake_telemetry_writer_dsn -- the smoke scoped login --,
    Get/Put and prefix-conditioned List on local.ducklake_smoke_data_prefix, Get/Put and prefix-conditioned List on
    telemetry-blobs/${local.ducklake_smoke_meta_schema}/, PutMetricData on DuckLakeTelemetryWriter); no Delete anywhere
    and no production prefix. Function: same handler, s3_key lambda-packages/ducklake-telemetry-writer.zip, the
    writer's layers, timeout and memory, reserved_concurrent_executions = 5 (the gate's fan-out needs four concurrent
    containers; the smoke login's CONNECTION LIMIT is shared with the writer until PLAN-telemetry-production-flip moves the writer to its
    production login, and the deploy jobs never run the two gate sequences together), env TELEMETRY_META_SCHEMA =
    local.ducklake_smoke_meta_schema, TELEMETRY_DATA_PATH = local.ducklake_smoke_data_path, TELEMETRY_BLOB_ROOT =
    local.ducklake_telemetry_smoke_blob_root, TELEMETRY_DSN_SECRET_ID = the smoke secret's name, the extension and
    field-semantics paths; lifecycle ignore_changes = [source_code_hash] (Decision 125/126 conformance). AWS_IAM
    Function URL; SSM /agent-platform/ducklake/telemetry_writer_smoke_url; alarm ducklake-telemetry-writer-smoke-errors
    (the writer's Errors plus Url5xxCount expression, FunctionName dimension = this function); outputs
    ducklake_telemetry_writer_smoke_function_url and _function_name (core._function_url's terraform fallback name).
- file: terraform/personal/ducklake_telemetry_reader.tf
  action: Create
  purpose: >-  # pragma: allowlist secret
    PR 1. The telemetry reader (Decision N+1 cl.2): log group; role agent-platform-ducklake-telemetry-reader with the
    apply boundary; inline policy DuckLakeTelemetryReaderRuntime with exactly Logs, TelemetryReaderDsnRead
    (GetSecretValue on the reader secret container the production catalog plan adds,
    agent-platform-ducklake-telemetry-reader-dsn, by resource reference), TelemetryCatalogDataRead (s3:GetObject on
    ${bucket}/${local.ducklake_telemetry_data_prefix}/* only) and TelemetryCatalogDataList (ListBucket and
    GetBucketLocation with s3:prefix ${local.ducklake_telemetry_data_prefix}/* only). No PutObject, DeleteObject,
    blob-root statement, shared-DSN statement or metrics statement. Function: handler
    src.lambdas.ducklake_telemetry_reader.handler.handler, s3_key lambda-packages/ducklake-telemetry-reader.zip, the
    deps and extensions layers, timeout 120, memory 1024, reserved_concurrent_executions = half the reader login's
    CONNECTION LIMIT set by the production catalog plan's role SQL (the writer's two-sessions-per-container rule,
    Decision 213 cl.3), env TELEMETRY_META_SCHEMA
    = local.ducklake_telemetry_prod_meta_schema, TELEMETRY_DATA_PATH = local.ducklake_telemetry_data_path,
    TELEMETRY_DSN_SECRET_ID = the reader secret's name, DUCKLAKE_EXTENSION_DIRECTORY and DUCKLAKE_FIELD_SEMANTICS_PATH;
    no TELEMETRY_BLOB_ROOT, no DUCKLAKE_DATA_PATH or DUCKLAKE_META_SCHEMA; lifecycle ignore_changes =
    [source_code_hash]. AWS_IAM Function URL; SSM /agent-platform/ducklake/telemetry_reader_url; alarm
    ducklake-telemetry-reader-errors (Errors plus Url5xxCount); outputs ducklake_telemetry_reader_function_url and
    _function_name. Pinned to production from birth: it reads the empty production catalog until PLAN-telemetry-production-flip.
