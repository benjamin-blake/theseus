    "ducklake_smoke" (a fixed local the twin reads, never the flipping ducklake_telemetry_meta_schema),
    ducklake_telemetry_smoke_blob_root = "s3://<bucket>/telemetry-blobs/${local.ducklake_smoke_meta_schema}/" and
    ducklake_telemetry_prod_meta_schema = "ducklake_telemetry". Any of these the production catalog plan's build
