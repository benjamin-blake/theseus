rollback: >-
  PR 2: revert the PR; the deploy workflow returns to five jobs and the new functions keep their last code. PR 1: a
  revert removes the roles and functions through the gated apply; nothing reads the telemetry reader until
  PLAN-telemetry-production-flip, and the twin holds no state beyond smoke rows. The Decision is reversed by a later
  Decision, never by deleting its text.
