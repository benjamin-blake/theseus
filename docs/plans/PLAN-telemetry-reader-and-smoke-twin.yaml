acceptance_criteria:
- >-
  The smoke twin agent-platform-ducklake-telemetry-writer-smoke exists with its own role on the smoke prefixes and
  the smoke scoped login, is deployed by its own leg, passes the full --lambda-telemetry sequence, and
  deploy-telemetry runs only after its gate succeeds.
- >-
  The telemetry reader agent-platform-ducklake-telemetry-reader exists, pinned to ducklake_telemetry with a READ_ONLY
  attach on ducklake_telemetry_reader and S3 read on the production telemetry data prefix only; it serves exactly the
  event verbs minus transcript_content, answers 400 to query_ops and every unserved verb, bundles no content module,
  and passes --lambda-telemetry-reader from CI and from a PlatformDev session.
- >-
  The shared reader's behaviour is unchanged (its smoke pin, verbs and grants) and its deploy gates stay green.
- Decision N+1 lands verbatim from execution step 4 with its four dated annotations, on Benjamin's word.
