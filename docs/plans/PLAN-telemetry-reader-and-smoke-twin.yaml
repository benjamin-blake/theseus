- file: src/lambdas/ducklake_telemetry_reader/handler.py
  action: Create
  purpose: >-
    PR 1. The telemetry reader handler (Decision N+1 cl.2-3), under 300 SLOC. SERVED_VERBS = the EVENT_READS names
    minus transcript_content, a module constant derived from src.common.ducklake_event_read_verbs. Actions, exactly:
    describe (connectionless: {ok, function: "telemetry_reader", catalog: {meta_schema, data_path_is_smoke}, verbs:
    ev.describe_all() filtered to SERVED_VERBS}); attach_check ({ok, meta_schema, data_path_is_smoke, catalog_login --
    the DSN secret's username only --, read_only: true, connect_ms, reused}); named_read (a verb outside SERVED_VERBS
    answers 400 {error_type: unknown_verb, served} and never echoes the caller's verb; params are validated before any
    connection by the acquirer; rows from ev.execute with ev.event_read_version). Any other action answers 400 with the
    sorted action list and never echoes the action. Every connecting action first passes ev.require_production_pin,
    then binds the telemetry slot through ev.acquirer_for(..., pin=ev.require_production_pin,
    dsn_secret_id=TELEMETRY_DSN_SECRET_ID, read_only=True) with an ops acquirer that raises (this function has no ops
    slot). Error mapping copied in shape from the shared reader: 400 named_read_input, 413 response_too_large (the
    same 6,000,000-byte envelope guard), 500 version_mismatch and runtime, handler_errors.terminal for 500 unmapped and
    503 catalog_unavailable, reopen-once on a dead connection, one log_invocation line ("telemetry_reader") per
    request. It imports nothing from src.lambdas.ducklake_reader and never imports ducklake_event_content.
