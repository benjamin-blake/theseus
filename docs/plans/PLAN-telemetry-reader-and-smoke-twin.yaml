  the bootstrap apply that names both new functions in the three Decision 213 boundary denies, the Decision 202 trail
  selectors, PlatformDev's URL-only invoke on the telemetry reader and the apply and planner IAMRolesRead lists; the
  reader login provisioned against its secret container; the production catalog created and seeded. Without the
