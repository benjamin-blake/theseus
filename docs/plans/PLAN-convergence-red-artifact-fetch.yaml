  pipeline to its current (fragile but understood) behaviour. Part 3 is revert-safe in code but
  Decision 154 must be superseded by a follow-on Decision rather than deleted, per the reversal
  conditions recorded in it. FALLBACK IF THE GATED CREATE IS DENIED: if the operator's Reconcile run
  AccessDenies on iam:CreateRole, the T2.48 boundary widening is not live. Do NOT revert this plan --
  its three parts are independently correct and still wanted. Instead open a SEPARATE follow-on PR
  that removes terraform/personal/probe_dep02_role.tf (never created, so a no-op diff) and clear the
  red via the acknowledge_red_commit dispatch, then re-land the probe as further separate work on
  the now-hardened paths. That fallback is deliberately OUT OF PLAN and does not contradict this
  plan's no-terraform/personal constraint: the constraint scopes THIS plan's diff, precisely so this
  plan stays landable while the pipeline is red.
