    dispatch ref while its checkout is RED_SHA.
  - >-
    DECISION 154 (draft, to be filed at implement time -- re-check the max ## Decision header first,
    currently 153, since a concurrent PR may claim the number). Title: "Pre-apply failures write a
    non-blocking infra_error marker, not a red convergence latch". Body: the sandbox convergence
    record's red status means "an apply ran and left infrastructure in an unknown state". A failure
    in a step BEFORE terraform apply -- artifact build, init, plan fetch, tfvars materialisation --
    does not satisfy that predicate: the apply never ran, so infrastructure is in its last-known
    state. Such episodes now merge a non-status infra_error marker (status read-modify-written
    unchanged, read-back verified, mirroring the DEP-11 pending_gated shape) instead of latching
    red. Anti-masking is preserved structurally, by a DIFFERENT mechanism on each of the two path
    families -- state both, because a blanket claim is false. (i) SANDBOX paths (apply-sandbox,
    gated-apply): ci-rca watches terraform-apply-sandbox (ci-rca.yml workflows filter) and fires on
    the workflow_run failure conclusion independently of the record (Decision 142), so the episode
    still files a Critical rec; and because the marker leaves status green at an older commit while
    the merged tf change stays unapplied, convergence_health's stale_green_backlog trigger fires
    severity=high at ~2h and escalate.py files a rec -- the second, arguably stronger signal, and the
    one reversal condition (c) is really about. (ii) RECONCILE paths (apply-reconcile,
    gated-apply-reconcile):
    ci-rca does NOT watch reconcile.yml -- it is absent from the workflows filter, and reconcile.yml
    says so itself in its wake message. Masking is nonetheless impossible there for a structural
    reason: Reconcile only runs against an already-red record, so leaving status unchanged leaves it
    RED. The marker can never turn a red into a green; the operator is woken by reconcile's own PR
    wake comment and the still-red record. Loudness is NOT delivered by convergence_health severity:
    severity is emitted only by scripts/convergence_health/__main__.py, escalate.py derives its
    threshold from status/red_age/backlog/stuck_approvals and never reads it, and preflight does not
    read it at all -- so the "low" floor aids a human reading the health surface but files nothing.
    The marker input is fail-closed (default false; true only when no apply step ran AND a named
    pre-apply step failed). Amends Decision 92's write semantics by
    forward reference. Precedent: Decision 94's VP10 correction already ratified that a
    creds-stage failure writes NO red record at all, discharging anti-masking via ci-rca -- this
    Decision is strictly louder than that baseline; and Decision 126 point 5 / T2.39 already removed
    the STARVED reviewer class from the red-latch path on the same reasoning. REVERSAL CONDITIONS:
    revert to unconditional red if (a) any episode is observed where a pre-apply-classified failure
    did leave infrastructure mutated, (b) ci-rca stops firing independently of the record, so the
    marker becomes the only signal, or (c) infra_error markers are observed accumulating unactioned
    for more than 7 days, indicating the "loud" claim is false in practice. NEW CONVENTION NOTE:
    infra_error floors severity at "low" whereas its DEP-11 sibling pending_gated deliberately does
    not force a severity (see test_pending_gated_does_not_force_high_severity_on_its_own). The
    divergence is intentional -- pending_gated marks a healthy waiting state, infra_error marks a
    failure -- and severity must be applied as a FLOOR, never an override, so the existing
    stale_green_backlog "high" case is not downgraded.
