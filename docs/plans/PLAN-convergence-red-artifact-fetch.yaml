  - >-
    WHY THE RED IS STUCK. Both sanctioned heal paths are blocked, for different reasons. Reconcile
    checks out ref RED_SHA and rebuilds with mode:assert, so it re-hits the mismatch AND a fix
    landed on main never reaches its checkout -- this is why Part 2 alone cannot clear the episode.
    The acknowledge_red_commit dispatch skips the assert but re-plans fresh, and that plan still
