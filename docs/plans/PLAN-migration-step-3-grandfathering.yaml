execution_steps:
  - >-
    scripts/contracts_schema.py -- add an EnforcementRoute model (reason, consumer: str | None,
    mechanism, blocker, shape: Literal["check","agent_surface"]; extra="forbid"; every field except
    consumer non-empty) and retype EvaluatorSpec.none_grandfathered to it. Keep the exactly-one-kind
    validator intact.
  - >-
    scripts/checks/contracts/_population.py -- extend the literal matcher to accept a path-shaped
    string whose final segment equals the basename, rejecting any literal containing whitespace.
    Move the ratchet section (specs, validate_ratchet_pin, check_ratchet_direction) out to the new
    _ratchet.py and re-import.
  - >-
    scripts/checks/contracts/_ratchet.py (new) -- carry the three RegistrySpecs (grandfathered_max,
    status_active_max, evaluator_none_grandfathered_max), their direction checks (each skipping the
    comparison when the base carries no such entry, mirroring the existing landing-PR behaviour),
    and a pin-vs-census binding that FAILS on ANY inequality between a pin and its live census
    bucket (equality, not `>=` -- see acceptance criterion 4).
  - >-
    scripts/checks/contracts/validate_contract_drift.py -- validate each none_grandfathered route
    in Pass 1; wire the three pins and the census binding into the ratchet leg. Keep the module
    inside its domain _manifest.py (Decision 169).
  - >-
    scripts/checks/contracts/validate_instruction_architecture_layers.py -- assert the contract
    file exists (module-level full-path constant) and fail loudly when it does not, before
    delegating to the prompt-compliance loader.
  - >-
    Seed the 20 Class D blocks per the Scope purposes above. subject = the file-router topic for
    the 8 routed files, the basename stem otherwise. STATUS RULE (exact -- the loose reading
    yields different pins and fails VP step 5): contract.status CARRIES OVER the file's own
    existing top-level `status` where it declares one -- 4 declare `ratified` (build-lambda,
    inference-provider, instruction-architecture, log-storage) and 4 declare `active`
    (ci-rca-lifecycle, composite-action-shape, marker-grammar, recommendation-relevance); every
    file with NO top-level `status` becomes `active`. Do NOT key off `ratified_via`, which 8 files
    carry -- that reading yields status_active=12 / declared=6 / grandfathered=18 and breaks all
    three pins. `ratified_via` is carried over for the 4 ratified files only, where
    ContractMeta._validate_class_d_and_ratified requires it. contract_version = the file's existing
    contract_version where present, else 1. Leave existing top-level keys (version, status,
    projection_id) untouched -- converging those duplicates is out of scope and gets its own rec.
  - >-
    Transcribe the nine enforcement routes from the ROUTE MAP context entry into each file's
    enforcement_route (exit-criteria-ledger's goes in contract-population.yaml, since that file
    cannot carry a Class D envelope).
  - >-
    docs/contracts/contract-population.yaml -- amend evaluator_kinds.check (path-shaped literals),
    agent_surface (Layer-1 ambient instruction files admitted), none_grandfathered (the route
    grammar, now required), grandfather_only_forms.counters_open_at_zero (superseded by the three
    pins), the ratchet block (grandfathered_max 21 -> 19, the two new pins, the census-binding
    rule, and the RAISABILITY ASYMMETRY note in `raise_mechanism` prose -- see the context entry),
    and the exit-criteria-ledger exception. While in the ratchet block, also correct its stale
    header comment (lines 151-152): it reads "37 depth-1 *.yaml files ... = 16 ritual + 21
    non-ritual"; the tree is now 40 = 16 ritual + 3 declared + 21 grandfathered, and becomes
    40 = 16 + 5 + 19 after this sweep. Add the amendment_log entry Pass 2 requires -- the parsed
    dict changes, so an omitted entry FAILS the gate.
  - >-
    docs/contracts/decision-entry.yaml -- flip size_governance.per_entry_size_norm.tier to hard-fail
    and cite Decision 167 clause 3 as the authorizing pre-commitment.
  - >-
    config/structural_size_budgets.yaml -- raise the iam-simulate-fixture entry to its post-seed
    measured value, rewriting the reason to name this sweep and re-citing the marker to dec-168.
  - >-
    LAST, gated on every step above being green -- scripts/checks/decisions/validate_decisions_size.py:
    make the per-entry cap append to `failed` instead of printing only, quoting Decision 167 clause 3
    verbatim in the failure message, and RENAME `_per_entry_cap_warnings` (its name becomes actively
    misleading once it fails rather than warns). Preserve forward-only scope and the Decision 149
    compacted-stub exemption.
  - Write the tests named in test_obligations; each must fail before its change and pass after.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop
    and RCA (Decision 55)
  - "Report: what was implemented, verification results"
