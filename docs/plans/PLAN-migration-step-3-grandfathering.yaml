rollback: >-
  Every change is additive or a single-constant flip. Reverting the commit restores the pre-sweep
  state exactly: the 21 files return to free-form (baseline-present, so the gate grandfathers them
  again), grandfathered_max returns to 21, and the per-entry cap returns to WARN. No data
  migration, no deployed artifact, no warehouse write is involved.
