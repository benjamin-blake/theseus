      instruction files; replace none_grandfathered's free-text form with the required
      enforcement_route grammar; add the two new counter pins + the census-binding rule; ratchet
      grandfathered_max 21 -> 19; record exit-criteria-ledger as the single named non-seedable
      exception WITH its route; add the amendment_log entry Pass 2 requires.
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      EvaluatorSpec.none_grandfathered becomes a structured EnforcementRoute model (reason,
      consumer, mechanism, blocker, shape) instead of free text -- an unenforced claim cannot be
      filed without a route. Zero PRODUCTION instances (all 3 existing Class D files use
      {check: ...}), but TEN bare-string sites across SIX test modules must be retargeted -- see
      the two test scope rows added for the files that were previously out of scope.
  - file: scripts/checks/contracts/_population.py
    action: Modify
    purpose: >-
      Accept a path-shaped string literal whose final segment is the contract basename (rejecting
      any literal containing whitespace); move the ratchet section out to _ratchet.py.
  - file: scripts/checks/contracts/_ratchet.py
    action: Create
    purpose: >-
      Decision 128 decompose-by-default: the ratchet specs, direction checks, the two new counter
      pins, and the pin-vs-census binding. _population.py is at 402/500 SLOC and this plan's
      additions would crowd it.
  - file: scripts/checks/contracts/validate_contract_drift.py
