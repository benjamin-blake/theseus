- >-
  STEP 7 -- Run VP 2-9 and VP 11 on the working tree; loop until green; on an unrecoverable failure stop and RCA
  (Decision 55). Then register VP 2, 3, 5, 6 and 7 as graduated verification-registry shards under their
  graduation_check_ids (the sanctioned derived paths). Do not run VP 1 here: its --verify-head leg fails closed on an
  uncommitted tree.
- >-
  STEP 8 -- Closure (implement skill commit flow), each state kept separate. (a) Readiness: run bin/venv-python -m
  scripts.session.github_readiness and record each state as reported; unknown is unproven, never PASS, and a fetch or
  API PASS never authorizes push or PR. (b) Set implementation_declared: true in this plan (bookkeeping, after STEP 7's
  graduation walk). (c) Run bin/venv-python -m scripts.validate --pre. (d) Postflight evidence: write
  /tmp/implementation-retrospective.json with the ten scripts.session.postflight_evidence.CATEGORIES keys (bounded
  fact-string lists, [] if none, no credentials or raw output) and run bin/venv-python -m scripts.session.postflight
  --evidence /tmp/implementation-retrospective.json; confirm its gitignored output. (e) Commit, git fetch origin main
  and rebase, then run VP 1 (the full tier, then --verify-head) on the committed, rebased, clean tree immediately before
  push (docs/contracts/git-ops.yaml handoff_sequence); on red, fix, commit and re-run VP 1 from the start. (f) Push and
  open the PR per git-ops.yaml; no Resolves: trailer (no bundled rec). After merge, run VP 10 on an updated main.
- >-
  Report, each separately: the readiness states from STEP 8(a); validator evidence (VP 1's full-tier exit and
  --verify-head result, plus VP 2-9 and VP 11); the postflight evidence output from STEP 8(d); and the real push and PR
  outcome (branch, PR URL, CI state). Also report the minted number, the entry's byte size and the coupling id.
rollback: >-
  Pre-merge: close the PR. Post-merge: never delete the header or the annotation lines (Decision 149, Decision 177);
  reversal is a later superseding Decision via its reversal stanza. The ports, inference-provider and roadmap rows revert
  by an ordinary PR (pending rows and an accepted coupling; nothing reads them at runtime).
