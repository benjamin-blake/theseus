execution_steps:
- >-
  STEP 0 -- git fetch origin main and rebase. Implementation order is 232/233 -> 234 -> 235: confirm main carries the
  '## Decision 232:' and '## Decision 233:' headers and tier item T4.33 (product-surface-and-open-core); if not, STOP as
  blocked. Confirm no '## Decision 234:' header and no T4.34 item exists (operator and overseer allocations); if either
