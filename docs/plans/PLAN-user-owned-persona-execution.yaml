  PC-09, substitute it in STEP 1's clause 4, reversal condition and Coverage line and in STEP 4 (VP 2 and VP 5 locate
  the row by content). DATE is the implement date. Confirm rec-4561 is open (VP 11). Re-run bin/venv-python -m
  scripts.session.preflight and bin/venv-python -m scripts.ci_rca.red_overlap --plan
  docs/plans/PLAN-user-owned-persona-execution.yaml; a block halts the session (Decision 226).
- |
  STEP 1 -- docs/DECISIONS.md, new entry inserted immediately above the current top entry (newest-first), verbatim with DATE substituted (VP 2 asserts against it):

  ## Decision 234: User-owned persona execution -- a sandboxed local worktree host, owner-only subscriptions and a forge-neutral core (amends Decision 206 clause 2 and Decision 212 clause 5) (Decided)

  ```yaml
  number: 234
  status: Decided
  decided_date: "2026-10-23"
  amends: [206, 212]
  significance:
    value: numbered_decision
    justification: >-
      Durable, reversal-relevant execution and credential rule for user-owned substrate. Not a
      contract note: ports.yaml registers adapters, never rules. Not amendment_forms: it amends two
      entries.
  ```

  **Status:** Decided
  **Date:** 2026-10-23
  **Warehouse ID:** dec-234 (per Decision 84 backfill)

  **Problem:** Decision 206 clause 5 names no OS sandbox and persona_compute_host has no adapter for a user's own machine; Claude Code's built-in sandbox covers its shell commands only. Decision 206 clause 2 lets one person's subscription run verdict personas on others' work; Decision 212 clause 5 orders no forge after GitHub.

  **Intent:** A persona runs on its owner's machine in a sandbox applied from outside, whatever the model; a subscription never pays for another person's work; the core assumes no one forge.

  **Decision:**
  1. Adapter. The default local persona_compute_host adapter is a git worktree plus Anthropic's open-source sandbox-runtime (srt; Apache-2.0; research preview) wrapping the WHOLE persona process (Decision 206 clause 5), for any persona_backend: sandbox_runtime (macOS Seatbelt; Linux and WSL2 bubblewrap) is supported, sandbox_runtime_windows (dedicated local user, write-restricted token, Windows Filtering Platform filters; alpha upstream) experimental (Decision 212 clause 7). srt is pinned to an exact version. It is write-scoping plus network control, not containment: reads are not isolated across sandboxed sessions. Windows tools on the OS TLS stack (curl.exe, Invoke-WebRequest, dotnet restore, winget) cannot make HTTPS calls inside it: Decision 205 clause 2 keeps GitHub work in the shell, and an in-persona package restore is an experimental limit. WSL2, containers (local_container; Docker Desktop needs a paid licence at larger companies) and remote hosts stay the stronger tiers. On user-owned substrate the planning, implementation and consult personas default here; Decision 205 clause 1's verdict personas default to GitHub Actions and may be configured here, still posting a check run.
  2. Conformance. Both adapters run persona_compute_host's one gating suite against its local_container oracle (Decision 212 clauses 1-2), plus deterministic confinement legs -- a write outside the workspace is denied, a direct egress connection is denied -- with no LLM or credentials on GitHub-hosted Linux, macOS and Windows runners (Decision 205 clause 3, Decision 212 clause 2(a)), the Windows legs alarm-not-gate while experimental; their minutes count in T4.15 c10. A pin bump runs the suite. The provisional run_image verb generalises to a pinned runtime reference when these adapters land. Parity here is T4.27 c7's suite, not the one-digest rule (Decision 205 clause 2, T4.2 c13, T4.32 c1), which binds the Actions shell, twin and compute plane.
  3. Subscription rule (Decision 206 clause 2). A subscription runs only work its owner initiated: a run the owner starts, the owner's own unattended queue included (Decision 206 clause 6), never one another person's action triggers. A subscription-backed verdict persona on GitHub Actions runs only on a pull request its owner authored: the thin shell checks the author against the subscription owner, and any other pull request runs on a team API key (byok) through LiteLLM or the verdict fails, never skips (Decision 205 clause 2). The vendor's terms of service still apply. First-party operator use (Decision 184 clause 4) is unchanged.
  4. Forge hedge (Decision 212 clause 5). GitHub first. On demand the candidate order is a self-hosted forge (Forgejo or Gitea: one binary, built-in reviews, CI largely GitHub-Actions-compatible), then GitLab, then bare git, each first needing Decision 184 clause 3 and Decision 205 clause 2 re-decided (coupling PC-02); no adapter row is registered before demand (Decision 212 clause 7). Core surfaces specified after this Decision reference a generic change id, never a pull request number; the existing pull-request coupling (ports.yaml PC-09) is accepted while the repository bootstraps. Local model servers (Ollama, vLLM) are reached through LiteLLM, no port (Decision 212 clause 6); their calls carry billing_shape local -- tokens stored, cost derived at read (Decision 199 clause 1, Decision 217 clause 4) -- the vocabulary change being rec-4561.
  5. Timing. The adapters are post-MVP (T4.34, Decision 93).

  **Options considered:** Claude Code on the web as persona compute -- parked: vendor platform risk (a vendor may restrict such a lane at scale even where currently permitted), never load-bearing. The CLI's built-in sandbox alone -- rejected: shell commands only. Containers by default -- rejected: heavier to install.

  ```yaml reversal-conditions
  decision: 234
  review_by: 2027-06-30
  on_trigger: "re-decide via /plan"
  conditions:
    - id: srt-preview-ends
      kind: manual
      description: "srt leaves preview with breaking changes, relicenses or is abandoned: re-pin, fork or replace it."
    - id: confinement-fails
      kind: manual
      description: "A confinement leg fails on a supported OS at the pinned version: demote that adapter to experimental."
    - id: forge-or-local-versioning
      kind: manual
      description: "A non-GitHub forge is needed, fully local product work starts in earnest, or demand forces local versioning: plan clause 4's next candidate; re-decide PC-09."
  ```

  **Coverage (Decision 181 cl.2):** the adapter rows, tiers and PC-09 -- validate_ports_contract; T4.34's deferred status -- validate_platform_roadmap; cl.1-3 -- T4.34 c1-c7 and T4.27 c10-c11, residual until built; cl.4's change-id rule -- unenforced, owner T4.23 c6; its billing_shape local -- rec-4561.

  **Related:** Decisions 93, 184, 185, 194, 199, 205, 206, 211, 212, 217; T4.15, T4.27, T4.32, T4.34.

