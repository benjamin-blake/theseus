schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "production-catalog-gc-guardrail-repair"
intent: >-
  Make DuckLake production maintenance real: repair a GC guardrail that fails open, restore
  compaction coverage to all live ops_* tables, and schedule guarded destructive GC against the
  production catalog so catalog metadata (the Neon read-egress driver) stops growing unbounded.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-production-catalog-gc-guardrail-repair.yaml
phase: T2.18
closes_criteria:
  - T2.18:c2
  - T2.18:c6
  - T2.18:c8
scope:
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      Retire file_fraction; replace check_gc_breaker with fail-CLOSED structural guards (G1-G4);
      stop swallowing introspection exceptions; retire the smoke-only GC_TABLE_SCOPE/HOT_TABLE_SCOPE
      constants in favour of the shared registry resolver.
  - file: src/common/ducklake_maintenance_ops.py
    action: Create
    purpose: >-
      Production-catalog orchestration: registry-driven table resolution, gc_ops, gc_ops_preview,
      batched expiry, per-pass deletion throttle, and the maintenance self-report payload.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      Add gc_ops / gc_ops_preview / maintenance_report actions; repoint action_merge_ops at the
      registry resolver; emit the self-report payload in every merge_ops return.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle ducklake_maintenance_ops.py into the deployed zip.
  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Make the gc gate capable of failing -- pre-age a fixture so files_cleaned > 0 is asserted, and
      add a negative case that must trip the breaker. Audit the other three gates for the same shape.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: >-
      EventBridge rules/targets/permissions for gc_ops_preview (enabled) and gc_ops (DISABLED);
      counters merge as its own invocation; Errors/Throttles/Duration alarms and a merge heartbeat.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: S3 lifecycle configuration filtered to the ducklake/ prefix ONLY (never tfstate/ or convergence/).
  - file: tests/test_ducklake_maintenance.py
    action: Modify
    purpose: Discriminating guardrail tests, including the fail-open regression (rec-3764).
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Create
    purpose: Unit coverage for registry resolution, throttle, batched expiry and the self-report.
  - file: tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py
    action: Create
    purpose: Handler dispatch, guard refusal and self-report coverage for the new actions.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Create
    purpose: Assert discovery COVERAGE over every registry table, not convergence of those examined.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Reopen c8, rewrite c6 (its text pins the retired metric), re-ground c2 to a bounded observable.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: New Decision amending Decision 81 clause 6 / CD.33 H1, plus a dated Decision 88 D3b clearance line.
bundled_recommendations:
  - rec-3764
  - rec-3762
  - rec-3760
  - rec-3761
  - rec-3759
  - rec-2216
  - rec-2218
  - rec-2220
followon_recs:
  - rec-3763
infrastructure_dependencies:
  - >-
    terraform/personal EventBridge rules/targets + aws_lambda_permission use the guard's known-safe
    shape (principal events.amazonaws.com, lambda:InvokeFunction, agent-platform-* function) and the
    S3 lifecycle rule rides s3:PutLifecycleConfiguration already scoped to agent-platform-data-lake
    in github_ci_apply_policy.tf -- no IAM role or trust change, so the apply stays auto-apply
    (Decision 77). Verification is CI-delegated per Decision 119; never a local terraform plan.
  - >-
    The gc_ops EventBridge rule ships state = "DISABLED". Enabling it is an operator action, not an
    agent action, and no CI identity gains invoke on the admin-gated function (Decision 143).
acceptance_criteria:
  - >-
    check_gc_breaker's replacement RAISES DuckLakeMaintenanceError when any catalog-introspection
    query fails, instead of returning breaker_tripped=False with a zero denominator (rec-3764).
  - >-
    file_fraction is gone from src/common/ducklake_maintenance.py; the guard set is G1 reachability
    (would_delete intersect live == empty), G2 retention-floor re-assertion, G3 catalog-sanity
    precondition, G4 a per-pass deletion THROTTLE (bounded work, remainder next pass) -- not an abort.
  - >-
    merge and GC table scope resolve from config/lambda/ducklake/field_semantics.yaml's ops_tables
    registry, with a coverage assertion that fails on a non-empty unexamined set; a LIKE pattern is
    no longer the source of scope, and GC_TABLE_SCOPE/HOT_TABLE_SCOPE no longer carry a second scope.
  - >-
    ops_entity_counters is compacted by its OWN invocation on a quiet cadence, never inside the
    every-6h merge_ops pass, and a test asserts rec-id allocation still succeeds under a concurrent merge.
  - >-
    The gc smoke gate fails when run against a build carrying the pre-fix breaker (it can no longer
    pass vacuously on a freshly-recreated catalog).
  - >-
    An S3 lifecycle rule expires noncurrent versions under the ducklake/ prefix ONLY; tfstate/,
    convergence/ and tfplan/ carry no rule.
  - >-
    expire_snapshots runs in bounded batches, never one transaction over ~13,848 snapshots.
  - >-
    A maintenance_report read-only action returns per-table live-file counts, deletion-queue depth
    and last-pass outcome from catalog metadata, and the same payload rides every merge_ops return.
  - >-
    A merge_ops failure or timeout files a recommendation through the portal (Decision 62 alarm-not-gate
    shape, Decision 61 source-discriminated), so the signal is agent-readable without the rec-3763 grant.
  - >-
    One guarded production GC pass has completed with files_cleaned > 0, the reachability invariant
    satisfied, and prefix object count/bytes recorded before and after.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the fail-open regression is closed -- introspection failure must raise, not pass.
    command: bin/venv-python -m pytest tests/test_ducklake_maintenance.py::test_breaker_raises_when_catalog_introspection_fails -q
    expected: PASSES after the fix; FAILS against current main (today the breaker returns breaker_tripped=False)
    fix_if: Breaker still returns a permissive dict on a raising connection -- remove the bare except and re-raise.
    graduation: graduate
    graduation_check_id: gc-breaker-fails-closed-on-introspection-error
  - step: 2
    phase: pre-deploy
    action: Prove the reachability invariant (G1) aborts when a would-delete path is still live.
    command: bin/venv-python -m pytest tests/test_ducklake_maintenance.py::test_g1_aborts_when_would_delete_intersects_live -q
    expected: Raises DuckLakeMaintenanceError naming the intersecting path; zero destructive calls issued.
    fix_if: Destructive calls appear in the recorded SQL after an intersection -- move the assertion before them.
    graduation: graduate
    graduation_check_id: gc-reachability-invariant-empty-intersection
  - step: 3
    phase: pre-deploy
    action: Prove file_fraction is retired and no percentage abort survives.
    command: "! rg -n 'file_fraction|GC_BREAKER_FILE_FRACTION' src/common/ducklake_maintenance.py src/lambdas/ducklake_maintenance_smoke/handler.py"
    expected: No matches (exit 0 via the negation).
    fix_if: A percentage survives -- retire it; do not re-baseline the denominator.
    graduation: graduate
    graduation_check_id: gc-file-fraction-retired
  - step: 4
    phase: pre-deploy
    action: Prove the per-pass throttle bounds deletions and defers the remainder.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k throttle -q
    expected: A 24000-candidate pass deletes at most the cap and reports a non-zero deferred remainder.
    fix_if: The pass deletes everything or raises -- the throttle is an abort, not a bound; make it bound.
    graduation: graduate
    graduation_check_id: gc-per-pass-deletion-throttle
  - step: 5
    phase: pre-deploy
    action: Prove scope COVERAGE over the registry, not convergence of what the predicate returned.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py -q
    expected: >-
      Resolver returns every live ops_tables entry; a catalog table absent from the examined set fails
      the coverage assertion (the rec-3762 class, per Decision 170 examined-vs-skipped).
    fix_if: The test passes with a table missing -- assert over the registry, not over the returned list.
    graduation: graduate
    graduation_check_id: merge-scope-registry-coverage
  - step: 6
    phase: pre-deploy
    action: Prove rec-id allocation survives a concurrent compaction of the counter table.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k counters_occ -q
    expected: Allocation returns a unique id under a simulated concurrent merge; no duplicate ids.
    fix_if: Allocation fails or duplicates -- the counters merge must not share the hot cadence.
    graduation: graduate
    graduation_check_id: entity-counters-merge-occ-safe
  - step: 7
    phase: pre-deploy
    action: Prove expiry is batched, never one transaction over the whole snapshot set.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k batched_expiry -q
    expected: A 13848-snapshot fixture issues multiple bounded expire calls, none unbounded.
    fix_if: A single unbounded expire call is issued -- add the batch loop.
    graduation: graduate
    graduation_check_id: expire-snapshots-batched
  - step: 8
    phase: pre-deploy
    action: Anchor the fake's semantics against the real engine on the pinned runtime.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k real_catalog -q
    expected: >-
      Against a file-backed DuckLake catalog on the pinned duckdb version, list_files returns
      current-snapshot only, merge converges to ~2 files/partition, and the deletion queue does not
      drain after cleanup -- the three semantics the unit fakes encode.
    fix_if: >-
      Engine behaviour differs from the fakes -- correct the FAKES, never the assertions. If the test
      SKIPS for a missing extension in every context, that is the rec-3759 false-green shape: record
      where it must run and fail the plan's VP rather than accepting a universal skip.
    graduation: waive
    graduation_waiver_reason: >-
      Needs the ducklake extension installed at test time, so it can skip in a constrained runner.
      Graduating a check that may skip would register a guard whose green is not evidence -- exactly
      the rec-3759 defect this plan exists to fix. The always-running unit checks (steps 1-7) carry
      the regression guard; this step is their truth-anchor.
  - step: 9
    phase: pre-deploy
    action: Prove the lifecycle rule is prefix-scoped and cannot touch the platform's integrity anchor.
    command: "rg -n 'ducklake/' terraform/personal/main.tf && ! rg -n 'noncurrent_version_expiration' terraform/personal/main.tf | rg -v 'ducklake'"
    expected: The lifecycle rule carries a ducklake/ prefix filter; no unfiltered rule exists.
    fix_if: >-
      A rule lacks a prefix filter -- add it. The bucket also holds tfstate/, convergence/ and tfplan/;
      an unfiltered rule would expire the platform's own recovery substrate (Decision 92).
    graduation: graduate
    graduation_check_id: ducklake-lifecycle-prefix-scoped
  - step: 10
    phase: pre-deploy
    action: Prove the destructive rule ships disabled and CI gains no invoke on the admin function.
    command: "rg -n 'state *= *\"DISABLED\"' terraform/personal/ducklake_maintenance.tf && ! rg -n 'github_ci' terraform/personal/ducklake_maintenance.tf"
    expected: The gc_ops rule is DISABLED; no CI principal appears in the admin function's file.
    fix_if: The rule ships ENABLED or a CI principal appears -- revert both (Decision 143 blast radius).
    graduation: graduate
    graduation_check_id: gc-ops-rule-ships-disabled
  - step: 11
    phase: pre-deploy
    action: Run the handler, smoke-gate and terraform-artifact test set.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py tests/test_ducklake_artifacts.py -q
    expected: >-
      All pass, including the gate-discrimination case, the DISABLED-rule and no-CI-invoke assertions,
      the lifecycle prefix-scoping assertion and the manifest bundling assertion.
    fix_if: >-
      A terraform assertion fails -- fix the .tf, never the assertion. A gate assertion fails -- the
      gate is still vacuous; make it exercise a catalog holding superseded files.
    graduation: graduate
    graduation_check_id: maintenance-handler-and-artifact-suite
  - step: 12
    phase: pre-deploy
    action: Full presubmit before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green (Decision 181).
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: Confirm the governed CD channel deployed the maintenance artifacts.
    command: bin/venv-python -m scripts.ci_status --workflow deploy-ducklake-lambdas.yml --latest
    expected: deploy-maintenance and maintenance-smoke jobs green on the merge commit.
    fix_if: Red -- read the job log and fix forward; never re-run hoping for green (Decision 55).
  - step: 14
    phase: post-deploy
    action: OPERATOR (admin session) -- read-only preview of what a production GC pass would do.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"gc_ops_preview","meta_schema":"ducklake_ops"}' /tmp/gc_preview.json && cat /tmp/gc_preview.json
    expected: >-
      Reports live files, deletion-queue depth, orphan candidates and the throttle's planned batch;
      reachability intersection is empty. No destructive call issued.
    fix_if: >-
      Non-empty intersection, or the action errors -- STOP and RCA. Do not enable the gc_ops rule.
  - step: 15
    phase: post-deploy
    action: OPERATOR -- take a fresh catalog DR dump, then run ONE throttled production GC pass.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"gc_ops","meta_schema":"ducklake_ops","data_path":"s3://agent-platform-data-lake/ducklake/","confirm":"ducklake_ops"}' /tmp/gc_pass.json && cat /tmp/gc_pass.json
    expected: files_cleaned > 0, breaker not tripped, deferred remainder reported, no live file deleted.
    fix_if: >-
      Breaker raises -- that is the guard working; RCA the reported reason. Never relax a threshold or
      pass a force_* override to obtain a pass (Decision 55 / Decision 181).
  - step: 16
    phase: post-deploy
    action: Record prefix storage before/after the pass as c2's bounded evidence.
    command: aws s3 ls --recursive --summarize s3://agent-platform-data-lake/ducklake/ --profile agent_platform | tail -3
    expected: >-
      Current-version object count falls materially from the 37,322 baseline measured 2026-09-12.
      Billed bytes only fall after the lifecycle noncurrent window elapses -- record both, and do not
      read a delete-marker-only drop as reclaimed storage.
    fix_if: Object count unchanged -- the pass deleted nothing; re-read the gc_ops return before rerunning.
