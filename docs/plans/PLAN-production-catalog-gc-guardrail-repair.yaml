rollback: >-
  The gc_ops EventBridge rule ships DISABLED, so no scheduled destructive pass exists until an
  operator enables it -- rollback is disabling that rule. Deletions from an executed pass are
  recoverable for the 35-day lifecycle noncurrent window (bucket versioning is ENABLED and the
  maintenance role holds s3:DeleteObject but NOT s3:DeleteObjectVersion, so a pass creates delete
  markers and cannot destroy a version); recovery is removing the delete markers under ducklake/. The
  guardrail, resolver and manifest changes are pure code and revert with the commit. The
  field_semantics regeneration reverts by restoring the sidecar and re-running the generator.
