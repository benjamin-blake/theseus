pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (81 cl.6, 88 cl.1(iii)+cl.2+cl.4, 84 I-2, 143, 55, 177, 136)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - config/lambda/ducklake/field_semantics.yaml ops_tables read as the scope registry
execution_steps:
  - >-
    Replace check_gc_breaker in src/common/ducklake_maintenance.py: delete file_fraction and the bare
    except blocks in _collect_file_paths/_dry_run_*/_count_files/_sum_file_bytes so introspection
    failure RAISES; implement G1 reachability (would_delete intersect live must be empty), G2
    retention-floor re-assertion after expiry, G3 catalog-sanity precondition (abort if a table's live
    set is empty or live bytes dropped beyond an absolute bound vs the last recorded pass), and G4 a
    per-pass deletion throttle that bounds work and defers the remainder. Take would-delete byte sizes
    from the dry-run's own size column, never from the current-snapshot dict.
  - >-
    Create src/common/ducklake_maintenance_ops.py: resolve table scope from field_semantics.yaml
    ops_tables (live entries), expose a coverage assertion over the registry, implement batched
    expire_snapshots, the throttled destructive pass, the read-only preview, and the self-report
    payload. Retire GC_TABLE_SCOPE/HOT_TABLE_SCOPE as a second scope source.
  - >-
    Modify src/lambdas/ducklake_maintenance/handler.py: add gc_ops (confirm=<meta_schema> guard
    mirroring catalog_reinit), gc_ops_preview and maintenance_report; repoint action_merge_ops at the
    registry resolver and the public file-count accessors (rec-2216/2218/2220); compact
    ops_entity_counters only via its own invocation; attach the self-report payload to every
    merge_ops return; file a rec through the portal on merge failure or timeout (Decision 62/61).
  - >-
    Update src/lambdas/ducklake_maintenance/manifest.yaml to bundle the new module.
