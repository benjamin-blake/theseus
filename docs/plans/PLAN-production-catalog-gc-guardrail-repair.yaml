  - source: terraform/personal/main.tf
    behavior: The lifecycle rule is prefix-filtered to ducklake/ and never reaches tfstate/ or convergence/.
    verification_step: 11
    test_selector: tests/test_ducklake_artifacts.py::test_lifecycle_rule_is_ducklake_prefix_scoped
    red_green_expectation: Red before (no rule exists), green after.
  - source: terraform/personal/ducklake_maintenance.tf
    behavior: The destructive rule ships DISABLED and no CI principal reaches the admin function.
    verification_step: 11
    test_selector: tests/test_ducklake_artifacts.py::test_gc_ops_rule_disabled_and_no_ci_invoke
    red_green_expectation: Red before (no gc_ops rule exists), green after.
  - source: src/lambdas/ducklake_maintenance/manifest.yaml
    behavior: The new module is bundled into the deployed artifact.
    verification_step: 11
    test_selector: tests/test_ducklake_artifacts.py::test_maintenance_manifest_includes_ops_module
    red_green_expectation: Red before, green after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: Roadmap bookkeeping only -- no runtime behaviour.
    verification_step: 12
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      Waived -- data edit, not behaviour. Criterion truth-maintenance is enforced by
      validate_platform_roadmap and the plan-critique gate, not by a new test.
  - source: docs/DECISIONS.md
    behavior: Decision-record content only -- no runtime behaviour.
    verification_step: 12
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      Waived -- prose artefact. Envelope/field grammar is enforced by the existing decisions-md
      validators, not by a new behavioural test.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NEVER relax a guardrail, threshold or assertion to obtain green (Decision 55 / Decision 181).
    This plan RETIRES a metric that cannot pass in steady state; it does not raise one. Any temptation
    to pass force_file_fraction / force_byte_budget against production is out of bounds.
  - >-
    The lifecycle rule MUST carry a ducklake/ prefix filter. agent-platform-data-lake also holds
    tfstate/, convergence/ and tfplan/ -- an unfiltered rule would expire the platform's own recovery
    substrate (Decision 92; the bootstrap policy already names this bucket the integrity anchor).
  - >-
    ops_entity_counters is the writer's OCC keyspace serialization row (Decision 84 I-2). It must not
    be compacted inside the every-6h merge_ops pass: 3,418 tiny files would push the invocation past
    the 300s timeout and take the other tables with it, and the merge commit conflicts with in-flight
    rec-id allocation while the maintenance path has no retry budget.
  - >-
    No CI identity gains invoke on the admin-gated ducklake_maintenance function (Decision 143).
    Enabling the gc_ops rule is an operator action, recorded in VP steps 13-14.
  - >-
    terraform/personal is CI-delegated: no local terraform init/validate/plan (Decision 119). Code
    deploys ride the governed CD channel, never build_lambda --deploy (Decision 125/126).
  - >-
    Decision 177: Decision 81 and Decision 88 bodies are append-only -- both edits land as dated
    appended lines, never an in-place body rewrite.
  - >-
    SLOC governance -- decompose into the new module rather than raising a budget (Decision 128).
