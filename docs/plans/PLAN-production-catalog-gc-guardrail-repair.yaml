  - source: src/lambdas/ducklake_maintenance_smoke/handler.py
    behavior: The smoke handler runs against the new guard set and breaker_probe still forces a trip.
    verification_step: 8
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py::test_breaker_probe_still_forces_a_trip
    red_green_expectation: Red before (the probe forces two retired parameters), green after.
  - source: scripts/ducklake_smoke/lambda_maintenance_gates.py
    behavior: Both smoke gates discriminate -- they fail against a build carrying the pre-fix breaker.
    verification_step: 8
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py::test_gc_gate_fails_on_prefix_breaker
    red_green_expectation: >-
      Red before (force_recreate_tables True and an unconditional early-return OK make both gates
      unfailable -- five consecutive green CD runs while four defects were live), green after.
  - source: terraform/personal/main.tf
    behavior: Every noncurrent_version_expiration block is inside a rule filtered to the ducklake/ prefix.
    verification_step: 9
    test_selector: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::test_lifecycle_rules_are_ducklake_prefix_scoped
    red_green_expectation: Red before (no rule exists); the prefix-less red-case fixture must fail.
  - source: terraform/personal/ducklake_maintenance.tf
    behavior: The gc_ops rule specifically ships DISABLED, asserted by resource name.
    verification_step: 9
    test_selector: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::test_gc_ops_rule_ships_disabled
    red_green_expectation: >-
      Red before (no gc_ops rule); the red-case fixture (gc_ops ENABLED beside an unrelated DISABLED
      rule) must fail -- the superseded grep form was MEASURED passing on exactly that fixture.
  - source: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    behavior: The terraform assertions themselves discriminate, proven by red-case fixtures.
    verification_step: 9
