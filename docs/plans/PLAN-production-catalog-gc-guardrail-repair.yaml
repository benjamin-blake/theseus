constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NEVER relax a guardrail, threshold or assertion to obtain green (Decision 55 / Decision 181). This
    plan RETIRES a metric that cannot pass in steady state; it does not raise one. Passing a force_*
    override against production to obtain a pass is out of bounds.
  - >-
    Do not graduate any VP step whose red case has not been shown to fail. The superseded grep form of
    the DISABLED assertion was measured PASSING with gc_ops ENABLED; graduating it would have
    installed a permanently-green guard over this plan's most dangerous invariant.
  - >-
    The lifecycle rule MUST be prefix-filtered to ducklake/. The data-lake bucket also holds tfstate/,
    convergence/ and tfplan/ -- an unfiltered rule would expire the platform's own recovery substrate,
    which the bootstrap policy explicitly calls the integrity anchor (Decision 92).
  - >-
    ops_entity_counters is the writer's OCC keyspace serialization row (Decision 84 I-2). It must not
    be compacted inside the every-6h merge_ops pass: 3,418 tiny files would push the invocation past
    the 300s timeout and take the other tables with it, and the merge commit conflicts with in-flight
    rec-id allocation while the maintenance path has no retry budget.
  - >-
    The coverage oracle is the live catalog. A registry-scoped assertion is refused by construction --
    it cannot detect a catalog table absent from the registry, which is the defect being fixed.
  - No CI identity gains invoke on the admin-gated function (Decision 143).
  - >-
    terraform/personal is CI-delegated -- no local terraform init/validate/plan (Decision 119). Code
    deploys ride the governed CD channel, never build_lambda --deploy (Decision 125/126).
  - >-
    Decision 177: Decision 81 and Decision 88 bodies are append-only. Both edits land as dated appended
    lines, never an in-place body rewrite.
  - >-
    SLOC governance -- G1-G4 land in the new module (Decision 128). ducklake_maintenance.py has 57
    lines of headroom and its test file 72; plan the test split rather than a budget raise.
