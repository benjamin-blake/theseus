      denominator and a permissive verdict.
    verification_step: 1
    test_selector: tests/test_ducklake_maintenance.py::test_breaker_raises_when_catalog_introspection_fails
    red_green_expectation: >-
      Red before (today the shipped function returns breaker_tripped=False on a raising connection --
      demonstrated 2026-09-12), green after.
  - source: src/common/ducklake_maintenance_ops.py
    behavior: >-
      Deletion is bounded per pass with the remainder deferred, and expiry is batched rather than one
      unbounded transaction.
    verification_step: 4
    test_selector: tests/common/test_ducklake_maintenance_ops.py::test_throttle_bounds_pass_and_defers_remainder
    red_green_expectation: Red before (module absent), green after.
  - source: src/lambdas/ducklake_maintenance/handler.py
    behavior: >-
      Table scope resolves from the ops_tables registry and coverage is asserted over the registry,
      so a table the old LIKE predicate missed fails the check.
    verification_step: 5
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_discovery_covers_every_registry_table
    red_green_expectation: >-
      Red before (the LIKE predicate omits ops_entity_counters -- 3,418 live files, measured), green after.
  - source: scripts/ducklake_smoke/lambda_maintenance_gates.py
    behavior: The gc gate discriminates -- it fails against a build carrying the pre-fix breaker.
    verification_step: 11
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py::test_gc_gate_fails_on_prefix_breaker
    red_green_expectation: >-
      Red before (force_recreate_tables=True makes breaker_tripped=False true by construction -- five
