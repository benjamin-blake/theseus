schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "production-catalog-gc-guardrail-repair"
intent: >-
  Make DuckLake production maintenance real: replace a GC guardrail that fails open, restore
  compaction coverage to every live catalog table, and land a guarded destructive GC verb so catalog
  metadata (the measured Neon read-egress driver) stops growing unbounded.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-production-catalog-gc-guardrail-repair.yaml
phase: T2.18
closes_criteria:
  - T2.18:c2
  - T2.18:c8
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Create
    purpose: >-
      Guard set G1-G4 and production orchestration -- live-catalog table resolution, registry
      cross-check, batched expiry, per-pass deletion throttle, preview, self-report. G1-G4 land HERE
      (not in the 443-SLOC sibling, which has only 57 lines of headroom) per Decision 128.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      Retire file_fraction, GC_BREAKER_FILE_FRACTION, GC_BREAKER_BYTES, GC_TABLE_SCOPE and
      HOT_TABLE_SCOPE; stop swallowing introspection exceptions in the five helpers that do; keep the
      maintenance primitives and re-point run_gc/run_merge at the new guard set.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      Add gc_ops / gc_ops_preview / maintenance_report; re-point action_merge_ops at the live-catalog
      resolver; re-raise after metric emission on the EventBridge path so the Lambda records an Error
      (today every classified failure returns 500 and records none).
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle ducklake_maintenance_ops.py into the deployed zip.
  - file: src/lambdas/ducklake_maintenance_smoke/handler.py
    action: Modify
    purpose: >-
      Rebind off the five retired names and the two retired run_gc/check_gc_breaker parameters, and
      re-home action_breaker_probe onto a G1-G4 forcing mechanism -- it exists ONLY to force
      file_fraction=0.0/byte_budget=0, so retiring those leaves the fourth c9 CD gate without a subject.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      Add src/common/ducklake_maintenance_ops.py to excludes. The wildcard src/ include would
      otherwise drag the new module into data-pipeline.zip, re-opening the DuckLake maintenance code
      leak a prior session deliberately closed and making a third active artifact affected.
  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Make the gc gate capable of failing -- pre-age a fixture and assert files_cleaned greater than
      zero -- and remove lambda_maintenance_breaker's unconditional early-return OK. Both unfailable today.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: >-
      gc_ops_preview rule (ENABLED) and gc_ops rule (DISABLED); counters compaction as its own
      invocation; Errors/Throttles/Duration alarms plus a merge heartbeat; rewrite the alarm
      description that pins the retired file-fraction metric.
  - file: terraform/personal/ducklake_maintenance_smoke.tf
    action: Modify
    purpose: >-
      Remove the GC_BREAKER_FILE_FRACTION / GC_BREAKER_BYTES env vars and rewrite the alarm
      description pinning the retired metric.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: >-
      aws_s3_bucket_lifecycle_configuration on the data lake, every rule prefix-filtered to
      ducklake/ ONLY -- the bucket also holds tfstate/, convergence/ and tfplan/.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Register ops_entity_counters as a plain (non-SCD2) bookkeeping table. It has no merge_key and
      no history/current pair, so it fits neither the Class A contract projection nor the existing
      sidecar SCD2 shape -- it needs its own block and a resolver notion of a plain table.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Regenerated output (GENERATED -- DO NOT EDIT). Produced by
      scripts.schema_to_field_semantics; the --check drift gate must stay green.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Ratified Class B verb contract: add gc_ops / gc_ops_preview / maintenance_report, retire the
      gc verb's force_file_fraction / force_byte_budget payload fields and its file-fraction
      typed_error, and receive the Decision 137 partitioning and Decision 155 partial-completion
      dispositions (routed here to keep the new Decision under the 6144-byte cap).
  - file: tests/test_ducklake_maintenance.py
    action: Modify
    purpose: >-
      Discriminating guardrail tests; delete test_breaker_no_trip_empty_catalog and the
      retired-constant assertions in test_guardrail_constants, which CODIFY the defects being fixed.
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Create
    purpose: G1-G4, throttle, batched expiry, resolver, OCC-safety and the real-engine anchor.
  - file: tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py
    action: Create
    purpose: Handler dispatch, confirm-guard refusal, re-raise-on-EventBridge and self-report coverage.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Create
    purpose: >-
      Live-catalog coverage assertion plus the registry cross-check, each with a red case that fails
      without the fix.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    action: Create
    purpose: >-
      Block-scoped terraform assertions (resource-header slice, the repo's established pattern in
      tests/checks/iam_tf/test_oidc_trust_slug_invariants.py) -- a line-oriented grep cannot express
      either property. Each carries a red-case fixture.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Rewrite c6, reopen and rewrite c8, split c2 into c2 (mechanism) plus new c10 (executed pass).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New Decision amending Decision 81 clause 6 / CD.33 H1 (drafted inline in context), plus a dated
      appended line on Decision 88 recording the clause-4 D3b gate clearance.
bundled_recommendations:
  - rec-3764
  - rec-3762
  - rec-3760
  - rec-3761
  - rec-3759
  - rec-2216
  - rec-2218
  - rec-2220
followon_recs:
  - rec-3763
infrastructure_dependencies:
  - >-
    EventBridge rules/targets plus aws_lambda_permission use the guard's one known-safe shape
    (principal events.amazonaws.com, action lambda:InvokeFunction, agent-platform-* function). The S3
    lifecycle rule rides s3:PutLifecycleConfiguration, already granted to github_ci_apply and scoped to
    the data-lake bucket. NO IAM role, policy or trust change is made by this plan, so the apply stays
    on the Decision-77 auto-apply path. Verification is CI-delegated (Decision 119).
  - >-
    The gc_ops rule ships state DISABLED. This is a CONVENTION-level control on an auto-applying
    surface, NOT the resource-shape boundary Decision 143 point 1 prefers -- an agent could flip it in
    the same terraform edit. Accepted with a named compensating guard (VP9 pins the rule's state by
    resource name, and enabling is recorded as operator work in VP17). The resource-shape alternative
    (a second function) is named in the Decision as the successor if this control proves insufficient.
  - >-
    No CI identity gains invoke on the admin-gated ducklake_maintenance function. github_ci_branch
    keeps invoke on the smoke function ARN only (Decision 143).
acceptance_criteria:
  - >-
    The guard set RAISES DuckLakeMaintenanceError when any catalog-introspection query fails, instead
    of collapsing the denominator to zero and returning a permissive verdict (rec-3764).
  - >-
    G1 reachability: the would-delete set and the live set are disjoint, asserted before any
    destructive call and re-asserted after; a non-empty intersection aborts the pass.
  - >-
    G2 retention floor re-asserted after expiry; G3 catalog-sanity precondition aborts on an empty
    live set or a live-byte drop beyond an absolute bound; G4 bounds deletions per pass and defers
    the remainder (a THROTTLE, not an abort), with byte sizes read from the dry-run's own size column.
  - >-
    The five retired names are absent from every one of the seven surfaces that carry them today (two
    Python modules, two .tf files' env vars and alarm descriptions, the verb contract, the runbook).
  - >-
    Merge/GC scope resolves from the LIVE CATALOG (information_schema), with field_semantics ops_tables
    as a CROSS-CHECK that reports any catalog table missing from the registry. A registry-only oracle
    is refused: ops_entity_counters is a live catalog table absent from the registry, so a
    registry-scoped assertion would go green while rec-3762's defect survives.
  - >-
    ops_entity_counters is registered in the sidecar as a plain bookkeeping table, the regenerated
    field_semantics.yaml passes its --check drift gate, and the cross-check reports zero unregistered
    catalog tables.
  - >-
    ops_entity_counters is compacted by its OWN invocation on a quiet cadence, never inside the
    every-6h merge_ops pass, and a test asserts rec-id allocation still succeeds under a concurrent merge.
  - >-
    action_breaker_probe still forces a guaranteed guard trip under the G1-G4 set, so the fourth c9
    CD smoke gate retains a subject.
  - >-
    handler() re-raises after emitting its metric on the EventBridge path, so a classified failure
    records a Lambda Error and the new Errors alarm can fire. Today every classified failure returns
    500 and records no Errors datapoint, which would leave the alarm permanently inert.
  - >-
    The gc smoke gate and the breaker smoke gate both FAIL against a build carrying the pre-fix
    breaker; neither can pass on a freshly-recreated catalog.
  - >-
    Every noncurrent_version_expiration block in main.tf sits inside a rule carrying a ducklake/
    prefix filter; tfstate/, convergence/ and tfplan/ carry no lifecycle rule.
  - >-
    The gc_ops EventBridge rule specifically carries state DISABLED, asserted by resource name rather
    than by any DISABLED string in the file.
  - expire_snapshots runs in bounded batches, never one transaction over the ~13,848-snapshot set.
  - All eight bundled recommendations reach a terminal status, verified after a portal sync.
  - >-
    One guarded production GC pass has completed with files_cleaned greater than zero, the
    reachability invariant satisfied, and prefix object count recorded before and after
    (operator-executed; closes the new c10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the fail-open regression is closed -- introspection failure must raise, not pass.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails -q
    expected: >-
      Passes after the fix. Demonstrated red before: the shipped check_gc_breaker returns
      breaker_tripped False with total_files 0 against a connection that raises on introspection.
    fix_if: Any helper still returns an empty default on exception -- remove the bare except and re-raise.
    graduation: graduate
    graduation_check_id: gc-guards-fail-closed-on-introspection-error
  - step: 2
    phase: pre-deploy
    action: Prove G1 aborts when a would-delete path is still referenced by a live snapshot.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py::test_g1_aborts_when_would_delete_intersects_live -q
    expected: Raises DuckLakeMaintenanceError naming the intersecting path; zero destructive SQL recorded.
    fix_if: Destructive calls appear in the recorded SQL after an intersection -- move G1 before them.
    graduation: graduate
    graduation_check_id: gc-reachability-invariant-empty-intersection
  - step: 3
    phase: pre-deploy
    action: >-
      Sweep ALL SEVEN surfaces carrying the retired names -- both Python modules, both .tf files, the
      verb contract and the runbook. Includes the byte-budget half, not just file_fraction.
    command: "! rg -n 'file_fraction|GC_BREAKER_FILE_FRACTION|GC_BREAKER_BYTES|GC_TABLE_SCOPE|HOT_TABLE_SCOPE|force_file_fraction|force_byte_budget' src/common/ducklake_maintenance.py src/lambdas/ducklake_maintenance_smoke/handler.py src/lambdas/ducklake_maintenance/handler.py terraform/personal/ducklake_maintenance.tf terraform/personal/ducklake_maintenance_smoke.tf docs/contracts/ducklake_maintenance.yaml docs/runbooks/ducklake-catalog-operations.md"
    expected: No matches on any of the seven surfaces (exit 0 via the negation).
    fix_if: >-
      Any surface still carries a retired name -- retire it there too. A half-retirement leaving the
      byte budget behind is the Decision 187 point 2 unreplaced-pin failure.
    graduation: graduate
    graduation_check_id: gc-retired-metric-names-swept
  - step: 4
    phase: pre-deploy
    action: Prove G4 bounds deletions per pass and defers the remainder rather than aborting.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k throttle -q
    expected: A 24,435-candidate pass deletes at most the cap and reports a non-zero deferred remainder.
    fix_if: The pass deletes everything or raises -- the throttle is an abort; make it a bound.
    graduation: graduate
    graduation_check_id: gc-per-pass-deletion-throttle
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the coverage oracle is the LIVE CATALOG and that the registry cross-check reports an
      unregistered catalog table -- the exact rec-3762 shape.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py -q
    expected: >-
      Resolver returns every catalog table; the cross-check flags any catalog table missing from
      ops_tables; a red-case fixture with an unregistered table FAILS without the fix.
    fix_if: >-
      The test passes with an unregistered table present -- the oracle is still the registry. Assert
      over the live catalog and treat the registry as the cross-check, never the reverse.
    graduation: graduate
    graduation_check_id: merge-scope-live-catalog-coverage
  - step: 6
    phase: pre-deploy
    action: Prove rec-id allocation survives a concurrent compaction of the counter table.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k counters_occ -q
    expected: Allocation returns a unique id under a simulated concurrent merge; no duplicate ids.
    fix_if: Allocation fails or duplicates -- the counters merge must not share the hot cadence.
    graduation: graduate
    graduation_check_id: entity-counters-merge-occ-safe
  - step: 7
    phase: pre-deploy
    action: Prove expiry is batched, never one transaction over the whole snapshot set.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k batched_expiry -q
    expected: A 13,848-snapshot fixture issues multiple bounded expire calls, none unbounded.
    fix_if: A single unbounded expire call is issued -- add the batch loop.
    graduation: graduate
    graduation_check_id: expire-snapshots-batched
  - step: 8
    phase: pre-deploy
    action: >-
      Prove breaker_probe still forces a guaranteed trip, and that both smoke gates can fail against a
      build carrying the pre-fix breaker.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py -q
    expected: The probe raises; both gate-discrimination cases fail on a pre-fix build.
    fix_if: >-
      The probe no longer trips -- it was re-homed onto nothing, and the fourth c9 CD gate becomes
      vacuous. A gate case passes on a pre-fix build -- it is still unfailable.
    graduation: graduate
    graduation_check_id: breaker-probe-and-smoke-gate-discrimination
  - step: 9
    phase: pre-deploy
    action: >-
      Prove the lifecycle rule is BLOCK-SCOPED to ducklake/ and the gc_ops rule is DISABLED by resource
      name. Both are block-scoped properties a line grep cannot express; both carry red-case fixtures.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py -q
    expected: >-
      Every noncurrent_version_expiration block sits inside a ducklake/-filtered rule; the gc_ops rule
      resource carries state DISABLED; both red-case fixtures FAIL the assertions.
    fix_if: >-
      A red-case fixture passes -- the assertion is non-discriminating; do not graduate it until the
      red case fails. The superseded grep form was MEASURED passing with gc_ops ENABLED.
    graduation: graduate
    graduation_check_id: ducklake-maintenance-tf-block-invariants
  - step: 10
    phase: pre-deploy
    action: Prove the handler re-raises on the EventBridge path so the Errors alarm has a subject.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_gc_ops.py -k reraise -q
    expected: A classified failure on a direct (non-Function-URL) invoke raises after metric emission.
    fix_if: >-
      The handler still returns 500 on that path -- the Lambda records no Errors datapoint and the
      alarm is inert for every classified failure.
    graduation: graduate
    graduation_check_id: maintenance-handler-reraises-on-eventbridge-path
  - step: 11
    phase: pre-deploy
    action: Prove the field_semantics regeneration is drift-free after registering the counter table.
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0 -- the committed generated file matches what the sidecar plus contracts produce.
    fix_if: Drift reported -- regenerate and commit the output; never hand-edit the generated file.
    graduation: graduate
    graduation_check_id: field-semantics-drift-free-after-counters-registration
  - step: 12
    phase: pre-deploy
    action: Prove the new module cannot leak into the data-pipeline artifact.
    command: bin/venv-python -c "import yaml,sys; m=yaml.safe_load(open('src/lambdas/data-pipeline/manifest.yaml')); sys.exit(0 if 'src/common/ducklake_maintenance_ops.py' in (m.get('excludes') or []) else 1)"
    expected: exit 0 -- the new module is excluded, so data-pipeline is not an affected artifact.
    fix_if: >-
      Not excluded -- the wildcard src/ include drags it into data-pipeline.zip, re-opening the closed
      code leak and making a third active artifact affected with no deploy step (Decision 79).
    graduation: graduate
    graduation_check_id: data-pipeline-excludes-maintenance-ops-module
  - step: 13
    phase: pre-deploy
    action: Full presubmit before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green (Decision 181).
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: Confirm the governed CD channel deployed the maintenance artifacts.
    command: "echo 'DISPATCH VIA MCP: mcp__github__actions_get(owner=benjamin-blake, repo=theseus, workflow_id=deploy-ducklake-lambdas.yml) for the merge commit, then mcp__github__get_job_logs for the deploy-maintenance and maintenance-smoke jobs'"
    expected: deploy-maintenance and maintenance-smoke jobs green on the merge commit.
    fix_if: Red -- read the job log and fix forward; never re-run hoping for green (Decision 55).
  - step: 15
    phase: post-deploy
    action: Verify the bundled recommendations closed. Sync the read cache, then assert terminal status.
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib,sys; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; want={'rec-3764','rec-3762','rec-3760','rec-3761','rec-3759','rec-2216','rec-2218','rec-2220'}; still={r['id'] for r in rows if r['id'] in want and r.get('status')=='open'}; print('still open:', sorted(still)); sys.exit(1 if still else 0)"
    expected: exit 0 -- no bundled rec remains open after the Resolves trailer fires.
    fix_if: >-
      A rec is still open -- either the Resolves trailer omitted it or its acceptance probe does not
      pass. Close it through the portal with evidence; never edit the read cache.
  - step: 16
    phase: post-deploy
    action: OPERATOR (admin session) -- read-only preview of what a production GC pass would do.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"gc_ops_preview","meta_schema":"ducklake_ops"}' /tmp/gc_preview.json && cat /tmp/gc_preview.json
    expected: >-
      Reports live files, deletion-queue depth, orphan candidates and the throttle's planned batch;
      the G1 intersection is empty. No destructive call issued.
    fix_if: Non-empty intersection, or the action errors -- STOP and RCA. Do not enable the gc_ops rule.
  - step: 17
    phase: post-deploy
    action: >-
      OPERATOR -- take a fresh catalog DR dump, then run ONE throttled production GC pass. This closes
      c10; the agent cannot perform it (PlatformDev holds no invoke on this function).
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"gc_ops","meta_schema":"ducklake_ops","data_path":"s3://agent-platform-data-lake/ducklake/","confirm":"ducklake_ops"}' /tmp/gc_pass.json && cat /tmp/gc_pass.json
    expected: files_cleaned greater than zero, no guard tripped, deferred remainder reported, no live file deleted.
    fix_if: >-
      A guard raises -- that is the guard working; RCA the reported reason. Never relax a bound or pass
      a force_* override to obtain a pass (Decision 55 / Decision 181).
  - step: 18
    phase: post-deploy
    action: Record prefix object count before/after the pass as c10's bounded evidence.
    command: aws s3 ls --recursive --summarize s3://agent-platform-data-lake/ducklake/ --profile agent_platform | tail -3
    expected: >-
      Current-version object count falls materially from the 37,322 baseline measured 2026-09-12.
      Billed bytes fall only after the lifecycle noncurrent window elapses -- record both, and do not
      read a delete-marker-only drop as reclaimed storage.
    fix_if: Object count unchanged -- the pass deleted nothing; re-read the gc_ops return before rerunning.
test_obligations:
  - source: src/common/ducklake_maintenance_ops.py
    behavior: >-
      The guard set fails CLOSED on introspection error, G1 aborts on a non-empty intersection, G4
      bounds each pass, and expiry is batched.
    verification_step: 1
    test_selector: tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails
    red_green_expectation: >-
      Red before (the shipped check_gc_breaker returns breaker_tripped False on a raising connection,
      demonstrated 2026-09-12), green after.
  - source: src/common/ducklake_maintenance.py
    behavior: >-
      The five retired names are gone from the module (the fail-closed behaviour itself is owned by
      the ducklake_maintenance_ops.py obligation above, which step 1 executes).
    verification_step: 3
    command: "! rg -n 'file_fraction|GC_BREAKER_FILE_FRACTION|GC_BREAKER_BYTES|GC_TABLE_SCOPE|HOT_TABLE_SCOPE|force_file_fraction|force_byte_budget' src/common/ducklake_maintenance.py src/lambdas/ducklake_maintenance_smoke/handler.py src/lambdas/ducklake_maintenance/handler.py terraform/personal/ducklake_maintenance.tf terraform/personal/ducklake_maintenance_smoke.tf docs/contracts/ducklake_maintenance.yaml docs/runbooks/ducklake-catalog-operations.md"
    red_green_expectation: Red before (all five names present today), green after.
  - source: src/lambdas/ducklake_maintenance/handler.py
    behavior: >-
      Scope resolves from the live catalog with a registry cross-check that reports unregistered tables.
    verification_step: 5
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_unregistered_catalog_table_is_reported
    red_green_expectation: >-
      Red before (the LIKE predicate omits ops_entity_counters -- 3,418 live files measured -- and a
