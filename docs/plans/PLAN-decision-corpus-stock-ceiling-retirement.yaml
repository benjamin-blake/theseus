schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-corpus-stock-ceiling-retirement
intent: Retire the decision corpus's three mechanical stock ceilings -- the live-header count, the committed-index
  byte pin, and the combined-byte ceiling -- now that bounded retrieval has replaced ambient loading,
  so corpus governance rests on the per-entry authoring cap and Decision 150's significance bar rather
  than on stock guards that are days from wedging with no lever left.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-corpus-stock-ceiling-retirement.yaml
phase: T2.56
closes_criteria:
- T2.56:c2
scope:
- file: scripts/checks/decisions/validate_decisions_size.py
  action: Modify
  purpose: Retire _DECISIONS_LIVE_MAX_H2, _DECISIONS_COMBINED_MAX_BYTES, _decisions_size_issues(), _LIVE_H2_RE
    and _RELIEF_VALVES with their FAIL branches; the check survives as the per-entry cap enforcer only.
    Preserve the Decision 170 one-declaration-per-exit-path contract.
- file: tests/checks/decisions/test_validate_decisions_size.py
  action: Modify
  purpose: Delete the stock-ceiling boundary classes (TestDecisionsSizeIssuesLiveH2, TestDecisionsSizeIssuesCombined,
    TestDecisionsSizeIssuesReliefValveMessage, TestBridgeCeilingValues) and the stock-ceiling legs of
    TestValidateDecisionsSizeRegisteredCheck and TestPerEntryCapThroughRegisteredCheck; add TestStockCeilingsRetired
    as the consolidated standing guard. Per-entry-cap and declaration-adoption coverage is retained untouched.
- file: tests/test_decisions_index.py
  action: Modify
  purpose: Delete TestCommittedIndexSizePin and its _COMMITTED_INDEX_MAX_BYTES constant.
- file: tests/checks/decisions/test_validate_decisions_index_freshness.py
  action: Modify
  purpose: Delete TestIndexMaxBytesContractPin -- both its tests regex _COMMITTED_INDEX_MAX_BYTES out
    of tests/test_decisions_index.py and assert the lever_by_ceiling_matrix index row, so both fail hard
    in the --pre tier once the constant and the matrix retire.
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: Drop size_governance.live_max_h2_headers, .combined_max_bytes, .index_max_bytes and the whole
    lever_by_ceiling_matrix (its accrual_rate row is subsumed by per_entry_size_norm, which stays); append
    the Class D amendment_log[] entry required by check_amendment_log_for_class_d.
- file: config/prose_budgets.yaml
  action: Modify
  purpose: Lines 9-11 justify excluding docs/DECISIONS.md because "they are governed by validate_decisions_size
    (Decision 134/145), not this registry (two guards on one surface would be redundant)" -- materially
    false once that check governs only per-entry size. Re-ground the comment to cite Decision 179 and
    the per-entry cap. Add NO budget entry for DECISIONS.md (the registry is ratchet-down-only and zero-headroom,
    so seeding it would wedge immediately).
- file: scripts/decisions_index.py
  action: Modify
  purpose: Its module docstring states the 112,000-byte pin as the live design rationale for excluding
    significance from the projection and for live-only skeleton scoping. Re-ground that prose to cite
    Decision 179. VP step 1 cannot see this file -- it contains "112,000", none of the grep tokens.
- file: docs/DECISIONS.md
  action: Modify
  purpose: Add the single ratifying entry Decision 179 (drafted verbatim in execution step 8; 6,097 bytes
    measured, under the 6,144 cap). It takes live header slot 132, which PASSES the 132-header ceiling
    (the guard fires on > 132) -- the same-PR forcing constraint is the index pin, not this ceiling; see
    constraints.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerate after Decision 179 lands so validate_decisions_index_freshness passes.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: /implement bookkeeping only -- flip T2.56 exit criterion c2 to met with evidence on a verified
    VP pass. c1 stays open and is explicitly out of scope.
- file: config/agent/verification_registry/entries/decisions-index-pin-112000-fresh-and-under.yaml
  action: Delete
  purpose: git mv to entries/deprecated/ -- its check_spec regexes the retired _COMMITTED_INDEX_MAX_BYTES.
- file: config/agent/verification_registry/entries/decision-entry-index-ceiling-homed.yaml
  action: Delete
  purpose: git mv to entries/deprecated/ -- same retired constant plus the retired matrix row.
- file: config/agent/verification_registry/entries/decisions-live-ceiling-retired-others-intact.yaml
  action: Delete
  purpose: git mv to entries/deprecated/ -- its "others intact" claim becomes false on this change.
- file: config/agent/verification_registry/entries/deprecated/decisions-index-pin-112000-fresh-and-under.yaml
  action: Create
  purpose: Retirement destination (Decision 176 point 5 -- git mv, no status column, no version key).
- file: config/agent/verification_registry/entries/deprecated/decision-entry-index-ceiling-homed.yaml
  action: Create
  purpose: Retirement destination.
- file: config/agent/verification_registry/entries/deprecated/decisions-live-ceiling-retired-others-intact.yaml
  action: Create
  purpose: Retirement destination.
- file: config/agent/verification_registry/entries/decisions-stock-ceilings-retired.yaml
  action: Create
  purpose: One consolidated standing guard replacing the three retired entries -- asserts the retired
    constants, contract keys and registry rows all stay absent.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
- scripts.checks.decisions.validate_decisions_size exposes none of _DECISIONS_LIVE_MAX_H2, _DECISIONS_COMBINED_MAX_BYTES,
  _DECISIONS_LIVE_MAX_BYTES, _decisions_size_issues, _LIVE_H2_RE or _RELIEF_VALVES; docs/contracts/decision-entry.yaml's
  parsed size_governance carries none of the four retired keys; and no retired-constant reference survives
  on the LIVE surface -- excluding config/agent/verification_registry/entries/deprecated/ (retired shards
  keep their bodies verbatim per Decision 176 point 5), tests/checks/decisions/test_validate_decisions_size.py
  (the standing guard must name the tokens to assert their absence), and docs/contracts/decision-entry.yaml
  (its amendment_log records the removal by name; its keys are checked structurally instead).
- validate_decisions_size still HARD-FAILS a new-in-diff decision entry over 6,144 bytes, and the registered
  check returns no failure against the real corpus with Decision 179 landed.
- Decision 179 exists in docs/DECISIONS.md, measures <= 6,144 bytes heading-to-next-heading, carries the
  fenced yaml envelope with number 179, amends [134, 160, 166] and significance.value == numbered_decision,
  and is the ONLY entry added by this change.
- docs/decisions-index.json is regenerated and byte-equal to build_index().
- docs/contracts/decision-entry.yaml size_governance carries no live_max_h2_headers, combined_max_bytes
  or index_max_bytes key and no lever_by_ceiling_matrix, retains per_entry_size_norm, and has exactly
  one new amendment_log[] entry.
- The three retired registry entries are absent from load_entries() and present under entries/deprecated/;
  decisions-stock-ceilings-retired loads and its added-entry differential passes.
- validate_decisions_size still composes exactly one Decision 170 declaration on each reachable exit path.
- bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Assert every retired stock-ceiling symbol is gone from the guard module AND that the contract's
    parsed size_governance carries none of the retired keys. Structural only -- no free-text grep, so
    the assertion cannot be defeated by the guard's own source naming the tokens it forbids.
  command: 'bin/venv-python -c "import yaml,pathlib; import scripts.checks.decisions.validate_decisions_size
    as m; gone=[''_DECISIONS_LIVE_MAX_H2'',''_DECISIONS_COMBINED_MAX_BYTES'',''_DECISIONS_LIVE_MAX_BYTES'',''_decisions_size_issues'',''_LIVE_H2_RE'',''_RELIEF_VALVES''];
    still=[a for a in gone if hasattr(m,a)]; assert not still, still; sg=yaml.safe_load(pathlib.Path(''docs/contracts/decision-entry.yaml'').read_text())[''size_governance''];
    stale={''live_max_h2_headers'',''combined_max_bytes'',''index_max_bytes'',''lever_by_ceiling_matrix''}
    & set(sg); assert not stale, sorted(stale); assert ''per_entry_size_norm'' in sg, sorted(sg); print(''retired:
    6 symbols absent, 4 contract keys absent, per_entry_size_norm retained'')"'
  expected: 'Exit 0, prints: retired: 6 symbols absent, 4 contract keys absent, per_entry_size_norm retained'
  fix_if: A symbol survives -- delete it. A contract key survives -- remove it from size_governance. per_entry_size_norm
    missing -- it is RETAINED by Decision 179 point 4 and must not be removed.
  hermetic: true
  graduation: graduate
  graduation_check_id: decisions-stock-ceilings-retired
- step: 2
  phase: pre-deploy
  action: 'One-shot residual sweep: no retired-constant reference survives on the live surface. Three
    pathspec excludes, each load-bearing -- entries/deprecated/ (retired shards keep bodies verbatim,
    Decision 176 point 5), the guard''s own test file (it must name the tokens to assert their absence),
    and decision-entry.yaml (its amendment_log names the removed keys per file-router.yaml precedent;
    step 1 checks its keys structurally instead). This is also the Closure Obligation stale-reference
    sweep for the three Delete rows.'
  command: 'bin/venv-python -c "import subprocess; r=subprocess.run([''git'',''grep'',''-lE'',''_COMMITTED_INDEX_MAX_BYTES|lever_by_ceiling_matrix|live_max_h2_headers|combined_max_bytes|index_max_bytes'',''--'',''tests/'',''scripts/'',''config/'',''docs/contracts/'','':!config/agent/verification_registry/entries/deprecated/'','':!tests/checks/decisions/test_validate_decisions_size.py'','':!docs/contracts/decision-entry.yaml''],capture_output=True,text=True);
    assert r.returncode in (0,1), ''git error rc=%d: %s'' % (r.returncode, r.stderr); assert r.returncode==1,
    ''residual refs: ''+r.stdout; print(''no residual references on the live surface'')"'
  expected: 'Exit 0, prints: no residual references on the live surface'
  fix_if: Named files still carry a retired token. On the pre-change tree this sweep flags exactly five
    files -- validate_decisions_size.py, test_decisions_index.py, test_validate_decisions_index_freshness.py
    and the two live registry shards -- all of which this plan already scopes; anything else in the output
    is a surface the plan missed. A git error (rc 128) now reports stderr rather than an empty payload.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-shot migration sweep whose correctness depends on three exclusions that
    are themselves artifacts of this change; as a standing guard it would fail against its own source
    file. The durable claim is graduated structurally via step 1's check_id.
- step: 3
  phase: pre-deploy
  action: Prove the per-entry cap still hard-fails an over-cap new entry and stays silent on a historical
    one -- the retained flow lever must be untouched by the stock-ceiling surgery.
  command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -k "PerEntryCap
    or StockCeilingsRetired or DeclarationAdoption" -q
  expected: All selected tests pass; TestStockCeilingsRetired and the per-entry-cap classes are present
    and green.
  fix_if: A per-entry-cap test fails -- the surgery removed shared machinery the cap depends on (_per_entry_cap_failures,
    the baseline reader, or the cost gate); restore it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The per-entry cap already has its own graduated standing guard (decisions-per-entry-cap-hard-fails);
    graduating a second selector over the same behavior would duplicate it. TestStockCeilingsRetired is
    graduated once, via step 1's check_id.
- step: 4
  phase: pre-deploy
  action: 'Run the registered check against the REAL tree with Decision 179 landed and assert it reports
    no failure. NOTE: this is a corpus-regression check, NOT a retirement check -- at 132 headers and
    767,701 combined bytes it passes identically whether the ceilings are retired or intact. Step 1 is
    the only step with discriminating power over the retirement.'
  command: bin/venv-python -c "import re,pathlib; from scripts.checks.decisions.validate_decisions_size
    import validate_decisions_size; live=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
    h=len(re.findall(r'^## Decision \\d+:',live,re.M)); assert h==132, h; f=[]; validate_decisions_size(f);
    assert f==[], f; print('real corpus passes at',h,'live headers')"
  expected: 'Exit 0, prints: real corpus passes at 132 live headers'
  fix_if: A failure is appended -- read the printed FAIL line. A per-entry FAIL means Decision 179 is
    over 6,144 bytes and must be trimmed. A stock-ceiling FAIL here would mean a constant survived AND
    the corpus grew past it between planning and implementation.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Pins a point-in-time corpus header count (132) that goes stale the moment
    Decision 180 lands -- the same staleness reason step 4 is waived for. It also needs an origin/main
    diff base for the baseline read. The durable retirement claim is graduated once, via step 1's check_id.
- step: 5
  phase: pre-deploy
  action: Assert Decision 179 is under the per-entry cap, carries the required envelope fields, and is
    the ONLY new entry this change adds (Decision 167 reversal condition (b) forbids multi-entry cap-evasion
    landings).
  command: bin/venv-python -c "import yaml,re,pathlib; from scripts.decisions_md import iter_decision_sections;
    from scripts.checks.decisions._baseline import baseline_decision_numbers; root=pathlib.Path('.');
    base=baseline_decision_numbers(root); live=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
    new=[(int(m.group(1)),b) for m,b in iter_decision_sections(live) if int(m.group(1)) not in base];
    assert len(new)==1 and new[0][0]==179, [n for n,_ in new]; n,block=new[0]; size=len(block.encode());
    assert size<=6144, size; env=yaml.safe_load(re.search(r'\`\`\`yaml\\n(.*?)\`\`\`',block,re.S).group(1));
    assert env['number']==179 and env['significance']['value']=='numbered_decision', env; assert sorted(env['amends'])==[134,160,166],
    env['amends']; assert env['significance']['justification'].strip(); print('Decision 179 ok:',size,'bytes')"
  expected: 'Exit 0, prints: Decision 179 ok: <size> bytes, with size <= 6144'
  fix_if: More than one new entry -- split the extra out. Over cap -- trim the body. Missing or partial
    envelope -- add number, amends and the significance value plus justification.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Pins one specific decision number, so it goes stale the moment Decision 180
    lands. The durable halves are already enforced generally by validate_decisions_size's per-entry cap
    and by validate_decision_entry_conformance's envelope leg.
- step: 6
  phase: pre-deploy
  action: Assert the committed index was regenerated and is byte-equal to a fresh build.
  command: bin/venv-python -c "import json,pathlib; from scripts.decisions_index import build_index; p=pathlib.Path('docs/decisions-index.json');
    d=json.loads(p.read_text()); assert d==build_index(), 'committed index is stale -- regenerate'; n=len(p.read_bytes());
    assert any(r['number']==179 for r in d['decisions']), 'Decision 179 missing from index'; print('index
    fresh:',n,'bytes,',len(d['decisions']),'rows')"
  expected: Exit 0, prints the index byte size and row count, with Decision 179 present.
  fix_if: 'Stale -- regenerate the committed index with the repo''s generator and re-run. This step is
    the reason the pin retirement must ride this PR: the new row exceeds the 293-byte headroom.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Freshness already has a registered enforcer (validate_decisions_index_freshness)
    in both tiers; a graduated duplicate would assert the same equality twice.
- step: 7
  phase: pre-deploy
  action: Assert the contract dropped every ceiling key and the matrix, kept per_entry_size_norm, and
    grew exactly one amendment_log[] entry (Class D obligation).
  command: bin/venv-python -c "import yaml,pathlib,subprocess; from scripts.contracts_schema import ChangeClass;
    head=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text()); sg=head['size_governance'];
    assert not ({'live_max_h2_headers','combined_max_bytes','index_max_bytes','lever_by_ceiling_matrix'}
    & set(sg)), sorted(sg); assert 'per_entry_size_norm' in sg, sorted(sg); base=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/decision-entry.yaml'],capture_output=True,text=True).stdout);
    hl,bl=head['amendment_log'],base['amendment_log']; assert len(hl)==len(bl)+1, (len(hl),len(bl)); valid={c.value
    for c in ChangeClass}; assert hl[-1]['change_class'] in valid, (hl[-1]['change_class'], sorted(valid));
    print('contract ok:',sorted(sg),hl[-1]['change_class'])"
  expected: Exit 0, printing the surviving size_governance keys (per_entry_size_norm only) and the new
    amendment's change_class.
  fix_if: A ceiling key survives -- remove it. amendment_log unchanged -- append the Class D entry. change_class
    rejected -- it is outside scripts.contracts_schema.ChangeClass's closed 8-value vocabulary; Class
    D contracts are NOT schema-validated on amendment_log, so nothing else in CI would catch it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Its durable half -- the ceiling keys stay absent from the contract -- is carried
    by the graduated TestStockCeilingsRetired class itself (execution step 2 authors the contract-key
    and residual-reference assertions INTO that class, not just module-attribute checks). The amendment_log
    delta and the change_class vocabulary check are one-shot migration assertions that cannot be standing
    guards.
- step: 8
  phase: pre-deploy
  action: Assert the three ceiling registry entries left the live loader, landed under entries/deprecated/,
    and that the consolidated replacement loads.
  command: bin/venv-python -c "import pathlib; from scripts.verification_graduation import load_entries;
    e=load_entries(); ids={(x.get('check_id') if isinstance(x,dict) else x) for x in (e.values() if isinstance(e,dict)
    else e)}; gone=['decisions-index-pin-112000-fresh-and-under','decision-entry-index-ceiling-homed','decisions-live-ceiling-retired-others-intact'];
    still=[g for g in gone if g in ids]; assert not still, still; d=pathlib.Path('config/agent/verification_registry/entries/deprecated');
    missing=[g for g in gone if not (d/(g+'.yaml')).exists()]; assert not missing, missing; assert 'decisions-stock-ceilings-retired'
    in ids, 'replacement guard not loaded'; print('registry retirement ok')"
  expected: 'Exit 0, prints: registry retirement ok'
  fix_if: An entry still loads -- it was copied rather than git mv'd. Missing under deprecated/ -- complete
    the move. Replacement absent -- create it with filename equal to its check_id.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts the outcome of this one migration; once the entries are retired the
    claim is permanently true and re-adding them would be a deliberate act already caught by validate_verification_registry's
    added-entry differential.
- step: 9
  phase: pre-deploy
  action: Run the three touched test modules in full to confirm no orphaned import, class or assertion
    survives the deletions.
  command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py tests/checks/decisions/test_validate_decisions_index_freshness.py
    tests/test_decisions_index.py -q
  expected: All tests pass; no collection error from a deleted constant or class.
  fix_if: ImportError or NameError on a deleted symbol -- remove the orphaned import or assertion in the
    module the traceback names.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole-module pytest sweep over three files, run to catch orphaned imports
    and dead classes left by the deletions -- a one-shot migration concern, not a standing regression
    claim. The behaviours worth guarding are already graduated (step 1's check_id) or pre-existing (decisions-per-entry-cap-hard-fails).
- step: 10
  phase: pre-deploy
  action: Run the authoritative fast tier end to end.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0 -- all checks pass, including validate_decisions_size, the index freshness check, the
    Class D contract enforcer and the verification-registry differential.
  fix_if: Read the named failing check and fix its cause; never bypass with --ignore-budget for a content
    failure.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/checks/decisions/validate_decisions_size.py
  behavior: 'The three stock ceilings stay retired: none of _DECISIONS_LIVE_MAX_H2, _DECISIONS_COMBINED_MAX_BYTES,
    _DECISIONS_LIVE_MAX_BYTES, _decisions_size_issues, _LIVE_H2_RE or _RELIEF_VALVES is a module attribute,
    and docs/contracts/decision-entry.yaml''s parsed size_governance carries none of the four retired
    keys while retaining per_entry_size_norm. (The Decision 167 per-entry cap and the Decision 170 declaration
    contract are pre-existing behaviours with their own retained tests, exercised by VP step 3.)'
  verification_step: 3
  test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestStockCeilingsRetired
  red_green_expectation: Red before (the constants exist, so the absence assertions fail), green after;
    the retained per-entry-cap and declaration-adoption classes stay green throughout.
constraints:
- EXACTLY ONE numbered Decision (179). Decision 167 reversal condition (b) forbids landing two or more
  entries in one PR to evade the per-entry cap -- VP step 4 enforces the count mechanically.
- Decision 179 and the guard retirement MUST land in the SAME commit and PR. The entry's own index row
  is 410 bytes against 293 bytes of pin headroom, so splitting them red-lines CI on whichever lands first
  (Decision 159/160/166 acute-landing precedent).
- 'Decision 177 append-only: do NOT edit the live bodies of Decisions 134, 160 or 166. The amendment is
  stated only in Decision 179, per the forward-direction convention (Decision 126/143).'
- The per-entry authoring cap (6,144 bytes, hard-fail) is RETAINED and must not be weakened.
- T2.56 c1 (ambient prose shrink) is OUT OF SCOPE. Do not touch AGENTS.md, CLAUDE.md or the skills layer;
  do not flip c1.
- Registry retirement is git mv to entries/deprecated/ only -- no status column, no version key (Decision
  176 point 5).
- No rescue agents or workaround loops (Decision 55).
