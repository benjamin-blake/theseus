execution_steps:
- 'Modify scripts/checks/decisions/validate_decisions_size.py -- delete _DECISIONS_LIVE_MAX_H2, _DECISIONS_COMBINED_MAX_BYTES,
  _LIVE_H2_RE, _RELIEF_VALVES and _decisions_size_issues() entirely, along with the block that calls it
  and appends its issues to `failed`. Keep _PER_ENTRY_CAP_BYTES, _per_entry_cap_failures, _new_entries_examined_count,
  the baseline reader seam and the cost gate. Rewrite the module and function docstrings to describe a
