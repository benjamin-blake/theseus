  behavior: 'The three stock ceilings stay retired: none of _DECISIONS_LIVE_MAX_H2, _DECISIONS_COMBINED_MAX_BYTES,
    _DECISIONS_LIVE_MAX_BYTES, _decisions_size_issues, _LIVE_H2_RE or _RELIEF_VALVES is a module attribute,
    and docs/contracts/decision-entry.yaml''s parsed size_governance carries none of the four retired
    keys while retaining per_entry_size_norm. (The Decision 167 per-entry cap and the Decision 170 declaration
    contract are pre-existing behaviours with their own retained tests, exercised by VP step 3.)'
  verification_step: 3
  test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestStockCeilingsRetired
  red_green_expectation: Red before (the constants exist, so the absence assertions fail), green after;
    the retained per-entry-cap and declaration-adoption classes stay green throughout.
- source: docs/contracts/decision-entry.yaml
  behavior: size_governance carries none of the four retired keys and retains per_entry_size_norm, and
    the Class D amendment_log[] gains one entry whose change_class is inside ChangeClass's closed vocabulary.
  verification_step: 7
  command: bin/venv-python -c "import yaml,pathlib,subprocess; from scripts.contracts_schema import ChangeClass;
    head=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text()); sg=head['size_governance'];
    assert not ({'live_max_h2_headers','combined_max_bytes','index_max_bytes','lever_by_ceiling_matrix'}
    & set(sg)), sorted(sg); assert 'per_entry_size_norm' in sg, sorted(sg); base=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/decision-entry.yaml'],capture_output=True,text=True).stdout);
    hl,bl=head['amendment_log'],base['amendment_log']; assert len(hl)==len(bl)+1, (len(hl),len(bl)); valid={c.value
    for c in ChangeClass}; e=hl[-1]; assert e['change_class']=='accepted_values_narrow', e['change_class'];
    assert e['change_class'] in valid; assert e['semantic_break'] is False, e['semantic_break']; assert
    'Decision 179' in e['summary'] and 'decision-corpus-stock-ceiling-retirement' in e['summary'], e['summary'];
    print('contract ok:',sorted(sg),hl[-1]['change_class'])"
  red_green_expectation: Red before (all four keys present, amendment_log unchanged), green after.
- source: docs/decisions-index.json
  behavior: The committed index is byte-equal to build_index() and carries a row for the new entry.
  verification_step: 6
  command: bin/venv-python -c "import json,pathlib; from scripts.decisions_index import build_index; p=pathlib.Path('docs/decisions-index.json');
    d=json.loads(p.read_text()); assert d==build_index(), 'committed index is stale -- regenerate'; n=len(p.read_bytes());
    assert any(r['number']==179 for r in d['decisions']), 'Decision 179 missing from index'; print('index
    fresh:',n,'bytes,',len(d['decisions']),'rows')"
  red_green_expectation: Red before (the index lacks the new row, so it is stale), green after regeneration.
- source: config/agent/verification_registry/entries/deprecated/decisions-index-pin-112000-fresh-and-under.yaml
  behavior: The three retired shards are absent from load_entries() and present under entries/deprecated/,
    and the consolidated replacement guard loads.
  verification_step: 8
