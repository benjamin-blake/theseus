schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "closure-stamp-applicability"
intent: >-
  Restore the Layer-2 durable closure edge (rec-autoclose) so an ordinary recommendation named in a
  Resolves trailer closes instead of reddening main, give the closure-stamp precondition one
  exported definition every caller consults rather than one each re-derives, and stop the same loop
  silently swallowing writer-transport failures as "not found in portal".
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-closure-stamp-applicability.yaml
phase: >-
  CI-RCA forward-fix for rec-3738 (soft-warn category ci_rca; no tier_item claimed, Freshness Gate
  skipped). Touches T1.13's contract surface (docs/contracts/ci-rca-lifecycle.yaml
  closure_obligation) but does NOT target any of T1.13's exit criteria (c2, c3, c5, c9 all remain
  open and untouched) -- closes_criteria is empty by design, not by omission. The new
  stamp_precondition clause is authored mappable to its enforcing check per T2.54 c1.
scope:
  - file: scripts/ops_portal/closure_gate.py
    action: Modify
    purpose: >-
      Export closure_stamps_applicable(raw: object) -> bool, defined as
      bool(parse_context_json(raw)) -- PARSED-DICT domain, reusing this module's own permissive
      parse. The parsed domain is the only one consistent across both callers: the trailer holds a
      raw JSON cell while the sweep holds an already-parsed dict, and bool() over the raw cell
      would disagree between them ("{}" is truthy, {} is not). It is the STAMPABILITY precondition,
      explicitly NOT Decision 186 point 1's escape-class predicate, and is kept out of
      assert_closure_obligation's call path so it can never read as a second gate.
  - file: scripts/ops_data_portal.py
    action: Modify
    purpose: >-
      Two changes. (1) update_rec's closure-stamp precondition consumes the shared predicate; the
      ValueError message names it so a human learns the sha was inapplicable, not malformed, while
      retaining the pinned substring "no existing context_v2_json". This is NOT
      behaviour-identical -- see constraints: a blob of "{}", "null", "[]" or malformed JSON flips
      from stamp-accepted to refused. That is a deliberate STRENGTHENING (a blob that parses to
      nothing has no more room to record closure evidence than an absent one), never a weakening,
      so Decision 186 point 8 is not engaged; it is pinned by its own test. (2) Add
      RecNotFound(RuntimeError) and raise it at the referential-existence check (line ~482) so the
      trailer loop can discriminate an absent rec from a transport failure.
  - file: scripts/ops_portal/ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      Two changes. (1) close_recs_from_trailer builds closure_* kwargs conditionally via the shared
      predicate (line ~413); on a cache miss it omits the stamp (a later refusal is loud-not-red,
      Decision 186 pt 7). (2) Narrow `except RuntimeError` (line ~421) to `except RecNotFound` so
      only an absent rec is a skip; every other RuntimeError -- reader-unreachable,
      writer_transport.py:164 referential 409, writer_transport.py:181 HTTP failure -- falls
      through to exit_code=1. NEVER match on a message substring: that is the fragility this plan
      exists to cure.
  - file: scripts/ci_rca/inactivity_sweep.py
    action: Modify
    purpose: >-
      close_inactive_recs adopts the same predicate for its closure_waiver_* kwargs (line ~70),
      passing the already-parsed `ctx` it holds. Latent today (every open ci_rca rec carries a
      blob) -- REQUIRED, not optional: the point of this plan is one definition, not one fixed
      caller (Decision 163).
  - file: tests/ci_rca/test_close_recs_from_trailer.py
    action: Modify
    purpose: >-
      Seam contract tests driving close_recs_from_trailer against the REAL update_rec with only the
      warehouse boundary stubbed -- the shape
      tests/test_ci_rca_inactivity_sweep.py::test_sweep_closes_escape_classified_rec_end_to_end
      already established as this repo's precedent. Splits
      test_trailer_closure_passes_commit_sha_into_the_gated_write, which pins the unconditional
      pass, into blob / no-blob cases (a strengthening, never a relaxation -- Decision 181). Adds
      the RecNotFound-vs-transport split cases.
  - file: tests/ops_data_portal/test_closure_gate.py
    action: Modify
    purpose: >-
      Pin the containment property is_escape_classified(parse_context_json(raw)) implies
      closure_stamps_applicable(raw), so a future widening of the predicate cannot silently drop a
      required fix-commit binding (Decision 186 point 8's fourth weakening form).
  - file: tests/ops_data_portal/test_update_rec_content_validation.py
    action: Modify
    purpose: >-
      Add the newly-refusing case (a blob of "{}" / malformed JSON now raises) as a red-before
      test, and strengthen the existing refusal test to also match the predicate name. Its pinned
      substring "no existing context_v2_json" is at line ~385 and must survive.
  - file: tests/test_ci_rca_inactivity_sweep.py
    action: Modify
    purpose: >-
      PERMISSION ROW, expected to be a no-op. Re-derived: both waiver tests build rows via
      _row(..., last_seen=old), so `_ctx` is {"last_seen": ...} -- already non-empty under the
      parsed-dict predicate, so the waiver kwargs stay threaded and the line ~82 assertion passes
      unchanged. Listed only so a needed fixture adjustment is not blocked by scope boundary.
  - file: .github/workflows/rec-autoclose.yml
    action: Modify
    purpose: >-
      Decouple the DECISIONS.md ETL from the CLOSURE step's failure specifically -- not from every
      prior step's. Give the closure step an `id`, then gate the backfill step on
      "!cancelled() && <install>.outcome == 'success' && <creds>.outcome == 'success' &&
      steps.detect-decisions.outputs.changed == 'true'". A bare !cancelled() would also run the
      backfill after Install dependencies or the OIDC step failed, producing a second misleading
      red on an already-red job. The value MUST be YAML-quoted -- unquoted, `!` opens a tag and
      `&&` an anchor, which is a ScannerError that breaks the whole file for yaml.safe_load and for
      GitHub. Touches no run-body, so the R3 ratchet is unaffected.
  - file: tests/ops_data_portal/test_decisions_divergence_guard.py
    action: Modify
    purpose: >-
      Update the single assertion at line ~269 that pins the backfill step's if condition. It MUST
      stay an exact-equality pin against the new full string -- do NOT degrade it to substring
      containment, which is Decision 181 point 3's dominant residual weakening arm (unenforced,
      rec-3357). The DCG-03 co-gating property the pin exists for must remain asserted.
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Add stamp_precondition under the existing closure_obligation section -- names the predicate,
      states its parsed-dict domain, states it is stampability and not the gate predicate, and
      ENUMERATES the sanctioned consumer call sites (Decision 155's adopt-with-a-clause rule).
      File is at 464/500 effective; keep it short.
  - file: config/agent/verification_registry/entries/closure-stamp-applicable-seam.yaml
    action: Create
    purpose: Standing guard for VP step 3 (blob-less trailer rec closes cleanly). Decision 176 one-record-per-file shard.
  - file: config/agent/verification_registry/entries/closure-stamp-containment.yaml
    action: Create
    purpose: Standing guard for VP step 4 (escape-classified implies stampable -- the Decision 186 point 8 containment property).
  - file: config/agent/verification_registry/entries/closure-stamp-single-definition.yaml
    action: Create
    purpose: Standing guard for VP step 5 (every call site consults the predicate; none re-derives it).
  - file: config/agent/verification_registry/entries/closure-transport-failure-reddens.yaml
    action: Create
    purpose: Standing guard for VP step 6 (a writer-transport RuntimeError sets exit_code=1 instead of being skipped).
  - file: config/agent/verification_registry/entries/rec-autoclose-backfill-not-cancelled.yaml
    action: Create
    purpose: Standing guard for VP step 7 (the backfill if condition survives closure failure but not cancellation or a failed install/creds step).
bundled_recommendations: ["rec-3738", "rec-3730"]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - close_recs_from_trailer closes a rec carrying no context_v2_json with exit code 0 and exactly one warehouse write
  - The same seam test exits non-zero against the pre-fix tree at origin/main (differential red-before proof)
  - update_rec, close_recs_from_trailer and close_inactive_recs each consult closure_stamps_applicable; a zero count in any one of the three fails the check
  - is_escape_classified(parse_context_json(raw)) implies closure_stamps_applicable(raw) is pinned by test
  - A context_v2_json blob of "{}" or malformed JSON now refuses a closure_* kwarg, pinned by a red-before test
  - A writer-transport RuntimeError during closure sets exit_code=1, while an absent rec (RecNotFound) still skips with exit code unchanged
  - The backfill step runs when the closure step fails, but not on cancellation nor after a failed install or credentials step, and the divergence-guard pin remains an exact equality
  - After merge, rec-3730 is closed in the warehouse with a resolution beginning "Auto-closed by rec-autoclose workflow"
  - After merge, rec-3738 is closed with a resolvable fix-bound closure_artifact
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: Seam contract suite passes against the real update_rec
    command: bin/venv-python -m pytest tests/ci_rca/test_close_recs_from_trailer.py -q
    expected: all tests pass, 0 failures
    fix_if: non-zero exit; a failure here means the caller still threads an inapplicable kwarg
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication, not a general excuse: this whole-file selector is a strict superset of
      steps 3 and 6, which each graduate their own discriminating nodeid over this same file. A
      third shard here would re-run those two guards under a broader selector.
  - step: 2
    phase: pre-deploy
    action: Differential red-before -- the new seam test must FAIL on the pre-fix tree
    command: >-
      W="${TMPDIR:-/tmp}/prefix-cs"; rm -rf "$W"; git worktree add -f "$W" origin/main >/dev/null
      2>&1 && cp tests/ci_rca/test_close_recs_from_trailer.py "$W/tests/ci_rca/" && (cd "$W" &&
      bin/venv-python -m pytest
      tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json -q);
      rc=$?; git worktree remove --force "$W"; test "$rc" -ne 0 && echo "PREFIX_RED ok (rc=$rc)"
    expected: '`PREFIX_RED ok` is printed, and the step exits 0 only because the pre-fix run exited non-zero'
    fix_if: >-
      the step exits non-zero, meaning the pre-fix run PASSED -- the test is not an oracle, rewrite
      it. Any non-zero pre-fix rc counts (1 for a failure, 2 for a collection error).
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: rec-3738's own acceptance command, verbatim
    command: bin/venv-python -m pytest tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json -q
    expected: 1 passed
    fix_if: the rec's acceptance predicate is unsatisfied; the rec cannot be closed
    graduation: graduate
    graduation_check_id: closure-stamp-applicable-seam
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: Containment pin, plus the invariant's strengthened refusal cases
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_closure_gate.py
      tests/ops_data_portal/test_update_rec_content_validation.py -q
    expected: all pass, including the containment case and the new empty-parse refusal case
    fix_if: >-
      a containment failure means the predicate could drop a required fix-commit binding (Decision
      186 pt 8); a refusal-case failure means the strengthening did not land
    graduation: graduate
    graduation_check_id: closure-stamp-containment
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: Single-definition proof -- every call site consults the predicate, none re-derives it
    command: >-
      for f in scripts/ops_data_portal.py scripts/ops_portal/ci_rca_lifecycle.py
      scripts/ci_rca/inactivity_sweep.py; do grep -q closure_stamps_applicable "$f" || { echo
      "MISSING in $f"; exit 1; }; done; echo ALL_THREE_ADOPTED
    expected: ALL_THREE_ADOPTED printed, exit 0
    fix_if: >-
      MISSING names a call site that still re-derives the invariant by hand. A per-file loop is
      required here because `grep -c` over several files exits 0 when ANY file matches, so a
      partial adoption would pass unnoticed.
    graduation: graduate
    graduation_check_id: closure-stamp-single-definition
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: A writer-transport failure reddens; an absent rec still skips
    command: >-
      bin/venv-python -m pytest
      "tests/ci_rca/test_close_recs_from_trailer.py::test_writer_transport_failure_sets_exit_code"
      "tests/ci_rca/test_close_recs_from_trailer.py::test_absent_rec_skips_without_exit_code" -q
    expected: 2 passed
    fix_if: >-
      exit code 5 means the nodeids do not exist -- name them exactly as authored. A transport
      failure leaving exit_code 0 means a writer 502 still silently drops a closure (Decision 55
      fail-open).
    graduation: graduate
    graduation_check_id: closure-transport-failure-reddens
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The backfill if condition survives closure failure but not cancellation or a failed install/creds step
    command: >-
      bin/venv-python -c "import yaml;s=[x for x in
      yaml.safe_load(open('.github/workflows/rec-autoclose.yml'))['jobs']['autoclose']['steps'] if
      x.get('name')=='Backfill decisions to warehouse'][0]['if'];print(s);assert '!cancelled()' in s
      and \"steps.detect-decisions.outputs.changed == 'true'\" in s and 'always()' not in s and
      s.count(\"outcome == 'success'\") >= 2"
    expected: the if expression prints and the assertion holds
    fix_if: >-
      a ScannerError means the if value was left YAML-unquoted (`!` opens a tag, `&&` an anchor) --
      quote it. An AssertionError means always() was used, the DCG-03 co-gating clause was dropped,
      or the install/credentials outcome guards are missing.
    graduation: graduate
    graduation_check_id: rec-autoclose-backfill-not-cancelled
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: DCG-03 co-gating pin and the R3 workflow ratchet both still hold
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_decisions_divergence_guard.py
      tests/checks/ci_guards/test__workflow_shell_bodies.py -q
    expected: 'all pass; the ratchet is untouched because no run-body changed'
    fix_if: >-
      a ratchet failure means a run-body was edited -- revert that; the if-condition edit alone is
      intended. A divergence-guard failure means the pin was not updated to the new full string.
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication against step 7's shard, which graduates the new if-condition property
      itself. What remains here is two PRE-EXISTING suites (the DCG-03 pin and the R3 ratchet) the
      full tier already owns; graduating them would register a second guard over properties this
      plan did not create.
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The sweep's waiver path is unchanged in behaviour by the predicate adoption
    command: bin/venv-python -m pytest tests/test_ci_rca_inactivity_sweep.py -q
    expected: all pass, waiver kwargs still threaded for blob-carrying ci_rca recs
    fix_if: a regression here means the predicate suppressed a waiver the gate requires
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Fast tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: address each reported check; never bypass with --ignore-budget
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Full tier (handoff_policy gate -- must complete before commit)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: on timeout the disposition is blocked -- resume later and rerun full from the start
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: The live post-merge rec-autoclose run closed rec-3730 end-to-end
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib;r=[json.loads(l)
      for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()];x=next(y for y in r if y['id']=='rec-3730');print(x['status'],'|',x['resolution']);assert
      x['status']=='closed' and x['resolution'].startswith('Auto-closed by rec-autoclose workflow')"
    expected: closed, with the workflow-authored resolution -- not a hand-written one
    fix_if: >-
      still open means the fix did not take on the live path; read the run's closure step. A
      hand-written resolution means someone closed it manually and the end-to-end leg is unproven.
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: Close rec-3738 with a fix-bound artifact (autoclose structurally cannot -- it supplies no closure_artifact)
    command: >-
      git fetch origin main --quiet && bin/venv-python -m scripts.ops_portal.cli --update-rec
      rec-3738 --status closed --resolution "Resolved by PLAN-closure-stamp-applicability:
      closure-stamp precondition exported and adopted at every call site; seam contract test added."
      --closure-artifact
      "pytest:tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json"
      --closure-fix-sha "$(git rev-parse origin/main)" --profile agent_platform
    expected: the write succeeds; the artifact resolves because the merge commit touches that test file
    fix_if: >-
      ClosureArtifactRequired means the fix sha does not touch the artifact's defining file -- the
      leading git fetch exists because a stale origin/main ref is the usual cause; confirm
      git rev-parse origin/main is the squash-merge sha that carries the test.
    graduation: not-applicable
test_obligations:
  - source: scripts/ops_portal/ci_rca_lifecycle.py
    behavior: a trailer-named rec carrying no context_v2_json closes cleanly, exit 0, one warehouse write
    verification_step: 3
    test_selector: tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json
    red_green_expectation: red before (ValueError, exit 1, zero writes), green after
  - source: scripts/ops_portal/closure_gate.py
    behavior: closure_stamps_applicable is total over escape-classified recs and never suppresses the gate
    verification_step: 4
    test_selector: tests/ops_data_portal/test_closure_gate.py
    red_green_expectation: red before (predicate absent), green after
  - source: scripts/ops_data_portal.py
    behavior: >-
      a context_v2_json blob that parses to nothing (empty object, null, malformed) refuses a
      closure_* kwarg before any write, as an absent blob already does
    verification_step: 4
    test_selector: tests/ops_data_portal/test_update_rec_content_validation.py
    red_green_expectation: >-
      red before -- an empty-object blob is truthy today so the stamp is accepted and silently
      lands in a blob with no room for it; green after the parsed-dict predicate refuses it
  - source: scripts/ci_rca/inactivity_sweep.py
    behavior: waiver kwargs are still threaded for blob-carrying ci_rca recs after predicate adoption
    verification_step: 9
    test_selector: tests/test_ci_rca_inactivity_sweep.py
    waiver_reason: >-
      Latent path with no reachable red-before: no live rec reaches the blob-less branch (every
      open ci_rca rec carries a blob) and both existing waiver tests build rows via
      _row(..., last_seen=old), so `_ctx` is already non-empty under the parsed-dict predicate. The
      obligation waived is a NEW guard; the existing waiver assertions must stay green through the
      adoption, which step 9 verifies.
  - source: .github/workflows/rec-autoclose.yml
    behavior: the DECISIONS.md ETL runs despite a closure-step failure, but not on cancellation nor after a failed install or credentials step
    verification_step: 8
    test_selector: tests/ops_data_portal/test_decisions_divergence_guard.py
    red_green_expectation: red before (the if condition lacks !cancelled() and the outcome guards), green after
  - source: docs/contracts/ci-rca-lifecycle.yaml
    behavior: the stamp_precondition clause names the predicate, its parsed-dict domain and its sanctioned call sites
    verification_step: 10
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      A contract clause carries no behaviour of its own to guard -- its enforcement is the check it
      maps to, and the three call sites it enumerates are guarded by VP step 5's graduated
      single-definition shard. The clause's own structural validity is asserted by the contract
      validators the fast tier already runs. A dedicated test would assert the presence of prose.
  - source: config/agent/verification_registry/entries/closure-stamp-applicable-seam.yaml
    behavior: the blob-less-close guard runs as a standing registry check, not only as this plan's VP step
    verification_step: 3
    test_selector: tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json
    red_green_expectation: >-
      red before -- the shard does not exist so no standing guard covers the behaviour; green after,
      admitted by the real differential gate (fails on an origin/main worktree, passes on HEAD)
  - source: config/agent/verification_registry/entries/closure-stamp-containment.yaml
    behavior: the escape-classified-implies-stampable containment property runs as a standing registry check
    verification_step: 4
    test_selector: tests/ops_data_portal/test_closure_gate.py
    red_green_expectation: >-
      red before -- the shard does not exist; green after, admitted by the real differential gate
  - source: config/agent/verification_registry/entries/closure-stamp-single-definition.yaml
    behavior: the all-three-call-sites-adopted proof runs as a standing registry check
    verification_step: 5
    command: grep -q closure_stamps_applicable
    red_green_expectation: >-
      red before -- the shard does not exist; green after, admitted by the real differential gate
  - source: config/agent/verification_registry/entries/closure-transport-failure-reddens.yaml
    behavior: the transport-failure-reddens guard runs as a standing registry check
    verification_step: 6
    test_selector: tests/ci_rca/test_close_recs_from_trailer.py::test_writer_transport_failure_sets_exit_code
    red_green_expectation: >-
      red before -- the shard does not exist; green after, admitted by the real differential gate
  - source: config/agent/verification_registry/entries/rec-autoclose-backfill-not-cancelled.yaml
    behavior: the backfill if-condition guard runs as a standing registry check
    verification_step: 7
    command: yaml.safe_load(open('.github/workflows/rec-autoclose.yml'))
    red_green_expectation: >-
      red before -- the shard does not exist; green after, admitted by the real differential gate
constraints:
  - No rescue agents or workaround loops (Decision 55); the broad except-Exception stays fail-loud
  - >-
    Decision 186 point 8 ratchet -- do NOT narrow the gate predicate, unbind a status, add a waiver
    category, soften the category pattern, or drop the fix-commit binding. This plan changes none of
    them; the containment pin (VP step 4) is what guarantees the fourth, and the predicate's
    parsed-dict domain STRENGTHENS the precondition rather than narrowing it
  - Decision 186 point 2 -- assert_closure_obligation remains the SOLE enforcement site; the exported predicate must not enter its call path
  - Decision 84 single-portal invariant -- callers select kwargs, never open a second write path
  - Decision 181 -- existing tests may be strengthened or split, never relaxed to obtain green; the divergence-guard pin stays an exact equality, never a substring
  - Decision 148 point 3 -- hermetic is declared on every creds-free deterministic pre-deploy step so validate_vp_replay independently re-executes it; never on the scripts.validate steps (recursion)
  - Never discriminate exceptions by message substring -- add a typed exception instead
  - Decision 128 -- scripts/ops_data_portal.py has ~30 effective lines of headroom against the implicit 500; the predicate adoption plus RecNotFound must fit, never a budget raise
  - docs/contracts/ci-rca-lifecycle.yaml is at 464/500 effective -- the stamp_precondition key must stay short
