constraints:
  - No rescue agents or workaround loops (Decision 55); the broad except-Exception stays fail-loud
  - >-
    Decision 186 point 8 ratchet -- do NOT narrow the gate predicate, unbind a status, add a waiver
    category, soften the category pattern, or drop the fix-commit binding. This plan changes none of
    them; the containment pin (VP step 4) is what guarantees the fourth, and the predicate's
    parsed-dict domain STRENGTHENS the precondition rather than narrowing it
  - Decision 186 point 2 -- assert_closure_obligation remains the SOLE enforcement site; the exported predicate must not enter its call path
  - Decision 84 single-portal invariant -- callers select kwargs, never open a second write path
  - Decision 181 -- existing tests may be strengthened or split, never relaxed to obtain green; the divergence-guard pin stays an exact equality, never a substring
  - >-
    Decision 148 point 3 -- hermetic is declared on every creds-free deterministic pre-deploy step
    so validate_vp_replay independently re-executes it, with exactly three named carve-outs: the
    two scripts.validate steps (12 and 13 -- recursion), and STEP 2 (critique round 3, S4). Step 2
    is creds-free and deterministic but its assertion is a FAILURE on origin/main, which inverts
    once this plan merges: a replay on the post-merge main run would find the fix present, get rc 0
    and report red for a step that is working exactly as designed. Step 2 must therefore stay
    non-hermetic, and the constraint is written to carve it out BY NAME rather than by a rule that
    silently readmits it
  - Never discriminate exceptions by message substring -- add a typed exception instead
  - >-
    Contract call_sites enumeration is authored under the key `call_sites:` inside
    closure_obligation.stamp_precondition, and its parity test resolves membership by IMPORT
    (ast.parse over scripts/**/*.py), never by textual mention -- a textual predicate would count
    the parity test itself and every docstring as a member (critique round 3, S5)
  - >-
    TRANSIENT-READER DISPOSITION (critique round 2, S7; SIZED in round 3, Strategic Risk 3): after
    the narrowing, a DuckLake reader 502/503/504 inside the closure loop reaches except Exception
    and reddens main. That is CHOSEN, not overlooked -- Decision 55 loudness over a silent drop,
    and a dropped closure on this ci_rca:watched workflow is the very fail-open the plan repairs.
    SECOND-ORDER COST, now sized: this workflow is ci_rca:watched, so the red is not merely noise --
    classify_closed_head can file a FALSE Critical REGRESSION rec off a transient (Decision 155's
    Problem section records exactly this), which then consumes a /plan slot and can itself be
    forward-fixed into a workaround. Expected frequency is the observed transient rate on this one
    loop (Decision 155 cites run 30101021966 as the single observed instance), so the accepted cost
    is roughly one false Critical per transient, each dismissible in triage. Decision 155 ships
    scripts/ops_portal/reader_transient.py::is_reader_unavailable; adopting that skip-with-marker
    here would need its own clause naming this call site (155 clause 3), so it is deliberately NOT
    imported. A contract edit adding this to closure_obligation.refusal_contract was CONSIDERED and
    REJECTED on the SLOC margin -- ci-rca-lifecycle.yaml is at 464/500 with the stamp_precondition
    clause plus its amendment_log entry already projected to ~483, so a second clause would force a
    forbidden raise. Recorded instead as a follow-on rec (see context) plus Decision 155's reversal
    condition (a), which is operator-observed: if this reddens main on transients in practice,
    revisit via /plan rather than widening the except in place
  - Decision 128 -- scripts/ops_data_portal.py is at 470/500 effective (measured), projected ~481; the predicate adoption plus RecNotFound must fit, never a budget raise
  - >-
    docs/contracts/ci-rca-lifecycle.yaml is at 464/500 effective (measured) and projects to ~483
    ONLY IF the new amendment_log entry's `summary:` is a SINGLE long folded line, this file's
    existing convention (2026-09-11 and 2026-09-07 entries) -- a hand-wrapped summary adds 6-10
    lines and blows the budget. tests/test_ci_rca_lifecycle.py is at 457, projected ~463. No budget
    raise is permitted for any of the three (Decision 128/165). DO NOT "correct" this contract
    ceiling as non-existent: critique round 4 (S1) challenged it on the ground that
    validate_sloc_limits gates only .py files, and the challenge was REFUTED -- the enforcing gate
    is validate_structural_size_limits (Decision 166, scripts/checks/structural/size_limits.py),
    reading config/structural_size_budgets.yaml's `contracts` class (include
    ["docs/contracts/*.yaml", "docs/contracts/*.yml"], governed true, unit effective-lines, limit
    500, max_line_chars 2000). ci-rca-lifecycle.yaml carries no per-file budget entry, so it
    inherits the class limit of 500, and a raise would require an inline `# raise-approved: dec-NNN`
    marker of the kind three sibling contracts already carry (iam-simulate-fixture.yaml 600,
    ops_recommendations.yaml 556, decision-entry.yaml 508)
