schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "closure-stamp-applicability"
intent: >-
  Restore the Layer-2 durable closure edge (rec-autoclose) so an ordinary recommendation named in a
  Resolves trailer closes instead of reddening main, give the closure-stamp precondition one
  exported definition every caller consults rather than one each re-derives, and stop the same loop
  silently swallowing writer-transport failures as "not found in portal".
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-closure-stamp-applicability.yaml
phase: >-
  CI-RCA forward-fix for rec-3738 (soft-warn category ci_rca; no tier_item claimed, Freshness Gate
  skipped). Touches T1.13's contract surface (docs/contracts/ci-rca-lifecycle.yaml
  closure_obligation) but does NOT target any of T1.13's exit criteria (c2, c3, c5, c9 all remain
  open and untouched) -- closes_criteria is empty by design, not by omission. The new
  stamp_precondition clause is authored mappable to its enforcing check per T2.54 c1.
scope:
  - file: scripts/ops_portal/closure_gate.py
    action: Modify
    purpose: >-
      Export closure_stamps_applicable(raw: object) -> bool, defined as
      bool(parse_context_json(raw)) -- PARSED-DICT domain, reusing this module's own permissive
      parse. The parsed domain is the only one consistent across both callers: the trailer holds a
      raw JSON cell while the sweep holds an already-parsed dict, and bool() over the raw cell
      would disagree between them ("{}" is truthy, {} is not). It is the STAMPABILITY precondition,
      explicitly NOT Decision 186 point 1's escape-class predicate, and is kept out of
      assert_closure_obligation's call path so it can never read as a second gate.
  - file: scripts/ops_data_portal.py
    action: Modify
    purpose: >-
      Two changes. (1) update_rec's closure-stamp precondition consumes the shared predicate; the
      ValueError message names it so a human learns the sha was inapplicable, not malformed, while
      retaining the pinned substring "no existing context_v2_json". This is NOT
      behaviour-identical -- see constraints: a blob of "{}", "null", "[]" or malformed JSON flips
      from stamp-accepted to refused. That is a deliberate STRENGTHENING, never a weakening, so
      Decision 186 point 8 is not engaged; it is pinned by its own test. Justification (corrected in
      critique round 2 -- do NOT claim the stamp has "no room to land", which is mechanically false:
      {}.update(stamps) would mint a valid blob): the ratified contract is that the closure_* kwargs
      stamp INTO an existing blob and NEVER MINT ONE, stated in
      tests/ops_data_portal/test_update_rec_content_validation.py:367-374's own docstring. Treating a
      blob that parses to nothing as "no blob" is a consistency fix under that contract. (2) Add
      RecNotFound(RuntimeError) and raise it at the referential-existence check (line ~482) so the
      trailer loop can discriminate an absent rec from a transport failure. 470/500 effective SLOC
      measured, ~481 projected -- no budget raise (Decision 128/165).
  - file: scripts/ops_portal/ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      Two changes. (1) close_recs_from_trailer builds closure_* kwargs conditionally via the shared
      predicate (line ~413); on a cache miss it omits the stamp (a later refusal is loud-not-red,
      Decision 186 pt 7). (2) Narrow `except RuntimeError` (line ~421) to `except RecNotFound` so
      only an absent rec is a skip; every other RuntimeError -- reader-unreachable,
      writer_transport.py:164 referential 409, writer_transport.py:181 HTTP failure -- falls
      through to exit_code=1. The broad `except Exception` at line 425 keeps its stderr marker
      "rec-autoclose: ERROR closing <rec-id>" unchanged; VP step 2's oracle matches on that
      RUNTIME line, so do not reword it. NEVER match on a message substring to classify an
      exception: that is the fragility this plan exists to cure.
  - file: scripts/ci_rca/inactivity_sweep.py
    action: Modify
    purpose: >-
      close_inactive_recs adopts the same predicate for its closure_waiver_* kwargs (line ~70),
      passing the already-parsed `ctx` it holds. Latent today (every open ci_rca rec carries a
      blob) -- REQUIRED, not optional: the point of this plan is one definition, not one fixed
      caller (Decision 163). COVERAGE SHAPE IS MANDATORY (critique round 4, S2): this file measures
      EXACTLY 100.0% line coverage (48 of 48 statements, measured against
      tests/test_ci_rca_inactivity_sweep.py) and has NO entry in config/coverage_baseline.yaml, so
      check_per_file_coverage's default 100% bar is live and blocking in VP step 13. The
      test_obligations row for this file waives a NEW test, so the stamp-omitted arm gets no test of
      its own -- therefore author the conditional so that arm carries NO STATEMENT of its own:
      `kwargs = {}`, then `if closure_stamps_applicable(ctx): kwargs = {"closure_waiver_category":
      ..., "closure_waiver_reason": ...}`, then `update_rec(..., **kwargs)`. An if/else with an
      explicit `else:`, a log line, or a bare `continue` in the omitted arm is an uncovered
      statement that drops the file below 100% and fails the handoff gate. The ONLY sanctioned
      alternative is to drop that obligation's waiver and add an empty-`_ctx` test case covering
      the omitted arm.
  - file: tests/ci_rca/test_close_recs_from_trailer.py
    action: Modify
    purpose: >-
      Seam contract tests driving close_recs_from_trailer against the REAL update_rec with only the
      warehouse boundary stubbed -- the shape
      tests/test_ci_rca_inactivity_sweep.py::test_sweep_closes_escape_classified_rec_end_to_end
      already established as this repo's precedent. Splits
      test_trailer_closure_passes_commit_sha_into_the_gated_write, which pins the unconditional
      pass, into blob / no-blob cases (a strengthening, never a relaxation -- Decision 181). Adds
      test_writer_transport_failure_sets_exit_code and test_absent_rec_skips_without_exit_code.
      HARD REQUIREMENT (critique round 3, B1): this file MUST STAY IMPORTABLE ON origin/main. VP
      step 2 copies it onto a pre-fix worktree, so RecNotFound must be resolved LAZILY -- inside
      the test body, or via getattr(portal, "RecNotFound", RuntimeError) -- never as a module-level
      `from scripts.ops_data_portal import RecNotFound`, which is an ImportError there and makes
      pytest exit 4 under a nodeid selector (measured), destroying the oracle. The literal
      "rec-autoclose: ERROR closing rec-" must NOT appear anywhere in this file's source: VP step 2
      refuses to run if it does, because a source match would make its signature conjunct true for
      any assertion failure.
  - file: tests/test_ci_rca_lifecycle.py
    action: Modify
    purpose: >-
      REQUIRED by the except narrowing (critique round 2, B4).
      TestCloseRecsFromTrailerRefusalContract::test_non_gate_exception_still_exits_nonzero (:551-561)
      raises RuntimeError("warehouse unreachable: 503") and asserts rc == 0 -- its own comment
      mislabels that fixture as 'not found', which is the conflation bug written into the test. The
      narrowing inverts it to rc == 1. Flip that arm and ADD a RecNotFound arm retaining rc == 0, so
      both halves are pinned separately. Without this row the implementer hits a
      validate_scope_boundary LOCATION STOP mid-flight. 457 effective SLOC measured, ~463 projected.
  - file: tests/ops_data_portal/test_closure_gate.py
    action: Modify
    purpose: >-
      TWO NEW TEST METHODS, each its own nodeid and its own shard (critique round 3, B2 -- one
      node_id slot cannot carry two properties, and a whole-file selector over a file that is
      byte-identical to origin/main is rejected by run_differential as tautological). (1)
      TestStampApplicability::test_escape_classified_implies_stampable pins the containment property
      is_escape_classified(parse_context_json(raw)) implies closure_stamps_applicable(raw), so a
      future widening cannot silently drop a required fix-commit binding (Decision 186 point 8's
      fourth weakening form). (2) TestContractParity::test_stamp_precondition_call_sites_match_importers
      is a NEW method -- do NOT extend the existing
      TestContractParity::test_closure_vocabularies_match_contract (:131-141), which passes on
      origin/main and is therefore unadmittable, leaving the Decision 163 remedy with no standing
      guard. Specification (critique round 3, S5): search domain is scripts/**/*.py (walked from the
      repo root, excluding __pycache__); the contract clause key read is
      closure_obligation.stamp_precondition.call_sites; and the membership predicate is an IMPORT of
      the symbol resolved by ast.parse -- an ImportFrom naming closure_stamps_applicable, or an
      Import of scripts.ops_portal.closure_gate paired with an attribute reference -- NEVER a
      textual mention, which would make the parity test itself and every docstring a false member.
      Assert set equality in both directions so an unlisted importer and a listed non-importer each
      fail.
  - file: tests/ops_data_portal/test_update_rec_content_validation.py
    action: Modify
    purpose: >-
      Add the newly-refusing case as its OWN new nodeid --
      test_closure_kwarg_on_a_blob_parsing_to_nothing_refuses_before_any_write -- covering "{}",
      "null" and malformed JSON, mirroring
      test_closure_kwarg_on_a_rec_without_context_v2_json_refuses_before_any_write (:367). Also
      strengthen that pre-existing refusal test to match the predicate name. Its pinned substring
      "no existing context_v2_json" is at line ~385 and must survive.
  - file: tests/test_ci_rca_inactivity_sweep.py
    action: Modify
    purpose: >-
      PERMISSION ROW, expected to be a no-op. Re-derived: both waiver tests build rows via
      _row(..., last_seen=old), so `_ctx` is {"last_seen": ...} -- already non-empty under the
      parsed-dict predicate, so the waiver kwargs stay threaded and the line ~82 assertion passes
      unchanged. Listed only so a needed fixture adjustment is not blocked by scope boundary.
  - file: .github/workflows/rec-autoclose.yml
    action: Modify
    purpose: >-
      Decouple the DECISIONS.md ETL from the CLOSURE step's failure specifically -- not from every
      prior step's. FIRST add `id: install-deps` to "Install dependencies" and `id: aws-creds` to
      "Configure AWS credentials (OIDC -- branch role)": today `detect-decisions` is the job's ONLY
      step id, so a condition referencing steps.<install>.outcome would resolve against an empty
      context, make the conjunction false, and silently retire the ETL entirely -- the opposite of
      the intent (critique round 2, B2). Then set the backfill step's if to
      "!cancelled() && steps.install-deps.outcome == 'success' && steps.aws-creds.outcome ==
      'success' && steps.detect-decisions.outputs.changed == 'true'". No id is needed on the closure
      step: !cancelled() already covers its failure. A bare !cancelled() would run the backfill after
      Install dependencies or the OIDC step failed, adding a second misleading red to an already-red
      job. The value MUST be YAML-quoted -- unquoted, `!` opens a tag and `&&` an anchor, a
      ScannerError that breaks the whole file for yaml.safe_load and for GitHub. Touches no
      run-body, so the R3 ratchet is unaffected.
  - file: tests/ops_data_portal/test_decisions_divergence_guard.py
    action: Modify
    purpose: >-
      Update the single assertion at line 269 that pins the backfill step's if condition. It MUST
      stay an exact-equality pin against the new full string -- do NOT degrade it to substring
      containment, which is Decision 181 point 3's dominant residual weakening arm (unenforced,
      rec-3357). CRITICAL (critique round 3, S7): line 269 sits INSIDE
      TestSubstantiveSignalPin::test_rec_autoclose_exits_nonzero_on_failed_rows, which is verbatim
      the check_spec.node_id of the already-graduated shard
      config/agent/verification_registry/entries/rec-autoclose-failed-counter-exit-present.yaml --
      Decision 155's mechanically enforced reversal condition (c). Editing this nodeid's body is
      therefore editing a live shard's enforcement surface. The sibling assertions at lines 267-268
      (no `continue-on-error` key on the step; no `|| true` in its run) and the sys.exit AST walk
      below MUST survive untouched, and the whole test must still pass so the shard stays admitted;
      change only the expected if-string on line 269.
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Add stamp_precondition under the existing closure_obligation section -- names the predicate,
      states its parsed-dict domain, states it is stampability and not the gate predicate, and
      ENUMERATES the sanctioned consumer call sites under the key `call_sites:` (Decision 155's
      adopt-with-a-clause rule), bound to reality by the parity assertion in
      tests/ops_data_portal/test_closure_gate.py rather than left as prose. ALSO add the companion
      amendment_log entry ('change_class: field_add') -- omitting it fails
      check_amendment_log_for_class_d, whose canonical-dump diff fires on any contract field
      addition (critique round 2, S1). Budget: 464/500 effective measured; ~483 projected, and that
      margin HOLDS ONLY IF the amendment_log entry's `summary:` is one long folded line, this
      file's existing convention (see the 2026-09-11 and 2026-09-07 entries) -- a hand-wrapped
      multi-line summary blows the budget, and no raise is permitted.
  - file: config/agent/verification_registry/entries/closure-stamp-applicable-seam.yaml
    action: Create
    purpose: Standing guard for VP step 3 (blob-less trailer rec closes cleanly). Decision 176 one-record-per-file shard.
  - file: config/agent/verification_registry/entries/closure-stamp-containment.yaml
    action: Create
    purpose: Standing guard for VP step 4 (escape-classified implies stampable -- the Decision 186 point 8 containment property). One nodeid, one property.
  - file: config/agent/verification_registry/entries/closure-stamp-contract-parity.yaml
    action: Create
    purpose: Standing guard for VP step 5 (the contract's stamp_precondition.call_sites list equals the set of scripts/**/*.py files importing the predicate -- the Decision 163 remedy's own guard).
  - file: config/agent/verification_registry/entries/closure-stamp-empty-parse-refusal.yaml
    action: Create
    purpose: Standing guard for VP step 6 (a context_v2_json blob that parses to nothing refuses a closure_* kwarg).
  - file: config/agent/verification_registry/entries/closure-stamp-single-definition.yaml
    action: Create
    purpose: Standing guard for VP step 7 (every call site consults the predicate; none re-derives it).
  - file: config/agent/verification_registry/entries/closure-transport-failure-reddens.yaml
    action: Create
    purpose: Standing guard for VP step 8 (a writer-transport RuntimeError sets exit_code=1 instead of being skipped).
  - file: config/agent/verification_registry/entries/rec-autoclose-backfill-not-cancelled.yaml
    action: Create
    purpose: Standing guard for VP step 9 (the backfill if condition survives closure failure but not cancellation or a failed install/creds step).
bundled_recommendations: ["rec-3738", "rec-3730"]
followon_recs: ["rec-3749", "rec-3750", "rec-3751", "rec-3752"]
infrastructure_dependencies: []
acceptance_criteria:
  - close_recs_from_trailer closes a rec carrying no context_v2_json with exit code 0 and exactly one warehouse write
  - >-
    The differential against origin/main is an ORACLE, not merely non-zero (critique round 3, S10):
    on a worktree at origin/main carrying the copied seam test, pytest exits EXACTLY 1 AND the run
    output carries the runtime marker "rec-autoclose: ERROR closing rec-". A collection exit (4 or
    5) is an environment refusal reported as SETUP_FAILED_COLLECTION, never a red
  - update_rec, close_recs_from_trailer and close_inactive_recs each consult closure_stamps_applicable; a zero count in any one of the three fails the check
  - is_escape_classified(parse_context_json(raw)) implies closure_stamps_applicable(raw) is pinned by its own test nodeid
  - >-
    The contract's closure_obligation.stamp_precondition.call_sites list equals, in both
    directions, the set of scripts/**/*.py files that IMPORT the predicate, pinned by its own new
    test nodeid rather than left as unenforced prose
  - A context_v2_json blob of "{}" or malformed JSON now refuses a closure_* kwarg, pinned by a red-before test
  - A writer-transport RuntimeError during closure sets exit_code=1, while an absent rec (RecNotFound) still skips with exit code unchanged
  - The backfill step runs when the closure step fails, but not on cancellation nor after a failed install or credentials step, and the divergence-guard pin remains an exact equality
  - After merge, rec-3730 is closed in the warehouse with a resolution beginning "Auto-closed by rec-autoclose workflow"
  - After merge, rec-3738 is closed with a resolvable fix-bound closure_artifact
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: Seam contract suite passes against the real update_rec
    command: bin/venv-python -m pytest tests/ci_rca/test_close_recs_from_trailer.py -q
    expected: all tests pass, 0 failures
    fix_if: non-zero exit; a failure here means the caller still threads an inapplicable kwarg
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication, not a general excuse: this whole-file selector is a strict superset of
      steps 3 and 8, which each graduate their own discriminating nodeid over this same file. A
      third shard here would re-run those two guards under a broader selector -- and a whole-file
      selector is in any case unadmittable, since run_differential rejects a check that passes on
      an origin/main worktree.
  - step: 2
    phase: pre-deploy
    action: Differential red-before -- the new seam test must FAIL on the pre-fix tree
    command: >-
      W="${TMPDIR:-/tmp}/prefix-cs"; git worktree remove --force "$W" 2>/dev/null; git worktree
      prune; git worktree add -f "$W" origin/main >/dev/null || { echo SETUP_FAILED_WORKTREE; exit
      2; }; ln -s "$PWD/.venv" "$W/.venv" || { echo SETUP_FAILED_SYMLINK; exit 2; }; test -x
      "$W/.venv/bin/python" || { echo SETUP_FAILED_VENV; exit 2; }; cp
      tests/ci_rca/test_close_recs_from_trailer.py "$W/tests/ci_rca/" || { echo SETUP_FAILED_COPY;
      exit 2; }; if grep -q "rec-autoclose: ERROR closing rec-"
      "$W/tests/ci_rca/test_close_recs_from_trailer.py"; then echo SETUP_FAILED_SENTINEL_IN_SOURCE;
      exit 2; fi; out=$(cd "$W" && bin/venv-python -m pytest
      tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json -q
      2>&1); rc=$?; git worktree remove --force "$W"; printf '%s\n' "$out" | tail -5; case "$rc" in
      4|5) echo "SETUP_FAILED_COLLECTION rc=$rc"; exit 2;; esac; test "$rc" -eq 1 && printf '%s'
      "$out" | grep -q "rec-autoclose: ERROR closing rec-" && echo PREFIX_RED_CONFIRMED
    expected: PREFIX_RED_CONFIRMED printed, exit 0
    fix_if: >-
      Every SETUP_FAILED_* marker is an ENVIRONMENT refusal and must NEVER be read as red.
      SETUP_FAILED_SYMLINK/SETUP_FAILED_VENV: a bare worktree has no .venv (gitignored, never
      checked out), so bin/venv-python falls back to a PATH interpreter that cannot import pydantic
      and exits non-zero having run no test -- the vacuous pass this step's first draft shipped; the
      `test -x` arm exists because `ln -s` succeeds on a DANGLING target, so the symlink's own exit
      status proves nothing (critique round 3, S2). Mirrors
      verification_graduation._provision_venv_symlink / _probe_environment_on_fail.
      SETUP_FAILED_COLLECTION means rc was 4 or 5: under a NODEID selector both a missing nodeid and
      a module-level ImportError yield 4, not 2 -- measured, and the round-2 fix_if's "rc 2" claim
      was wrong (critique round 3, B1). Its usual cause is a module-level
      `from scripts.ops_data_portal import RecNotFound` in the copied file; resolve RecNotFound
      lazily instead. SETUP_FAILED_SENTINEL_IN_SOURCE means the copied file's source contains the
      runtime marker this step greps for, which would make the signature conjunct true for ANY
      assertion failure in that nodeid -- remove the literal from the test source (critique round 3,
      S1). Only rc == 1 PLUS the runtime marker "rec-autoclose: ERROR closing rec-" (written to
      stderr by ci_rca_lifecycle.py:425's broad except and captured in the failure report) is a
      genuine red; the old conjunct matched "no existing context_v2_json", which the copied file's
      own docstrings and pytest.raises(match=...) carry, so it was not runtime-only.
    graduation: waive
    graduation_waiver_reason: >-
      NOT a duplication waiver and NOT not-applicable (critique round 3, S3 -- the round-2
      reclassification of steps 10/11 one step away makes not-applicable the 12o suspect shape
      here). This step is a ONE-SHOT differential whose polarity INVERTS the moment this plan
      merges: it asserts a FAILURE on origin/main, and after the squash-merge origin/main carries
      the fix, so the same command returns rc 0 forever after. A standing shard over it would fail
      permanently -- graduation is impossible in principle, not merely duplicative. The property it
      proves once is carried forward by step 3's shard, whose differential admission
      (run_differential: FAIL on an origin/main worktree, PASS on HEAD) re-derives the same
      red-before fact against a moving base on every run. This step is also deliberately NOT
      hermetic, for the same inversion reason -- see the Decision 148 point 3 constraint.
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: rec-3738's own acceptance command, verbatim
    command: bin/venv-python -m pytest tests/ci_rca/test_close_recs_from_trailer.py::test_closes_rec_lacking_context_v2_json -q
    expected: 1 passed
    fix_if: the rec's acceptance predicate is unsatisfied; the rec cannot be closed
    graduation: graduate
    graduation_check_id: closure-stamp-applicable-seam
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: Containment pin -- every escape-classified rec is stampable
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_closure_gate.py::TestStampApplicability::test_escape_classified_implies_stampable"
      -q
    expected: 1 passed
    fix_if: >-
      a failure means the predicate could drop a required fix-commit binding (Decision 186 pt 8's
      fourth weakening form). Exit 4 means the nodeid does not exist -- author it exactly as named.
      This step selects ONE NEW nodeid, not the whole file: a whole-file selector over a file
      byte-identical to origin/main is rejected by run_differential as tautological, so the shard
      would never be admitted (critique round 3, B2).
    graduation: graduate
    graduation_check_id: closure-stamp-containment
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: Contract parity -- the enumerated call_sites equal the set of files importing the predicate
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_closure_gate.py::TestContractParity::test_stamp_precondition_call_sites_match_importers"
      -q
    expected: 1 passed
    fix_if: >-
      a failure means the contract's closure_obligation.stamp_precondition.call_sites list drifted
      from the scripts/**/*.py files that actually IMPORT the predicate (ast-resolved, never a
      textual mention). This is a NEW nodeid, deliberately not an extension of the pre-existing
      TestContractParity::test_closure_vocabularies_match_contract, which passes on origin/main and
      would therefore be unadmittable -- leaving the Decision 163 remedy with no standing guard at
      all (critique round 3, B2).
    graduation: graduate
    graduation_check_id: closure-stamp-contract-parity
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: The strengthened refusal -- a blob that parses to nothing is refused, as an absent one already was
    command: >-
      bin/venv-python -m pytest
      "tests/ops_data_portal/test_update_rec_content_validation.py::test_closure_kwarg_on_a_blob_parsing_to_nothing_refuses_before_any_write"
      -q
    expected: 1 passed
    fix_if: >-
      a failure means the strengthening did not land. The full tier (step 13) still runs this whole
      file, so a WEAKENING of the pre-existing absent-blob refusal (Decision 181) surfaces there;
      this step names one NEW nodeid because a whole-file selector cannot be admitted as a shard
      (critique round 3, B2).
    graduation: graduate
    graduation_check_id: closure-stamp-empty-parse-refusal
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: Single-definition proof -- every call site consults the predicate, none re-derives it
    command: >-
      for f in scripts/ops_data_portal.py scripts/ops_portal/ci_rca_lifecycle.py
      scripts/ci_rca/inactivity_sweep.py; do grep -q closure_stamps_applicable "$f" || { echo
      "MISSING in $f"; exit 1; }; done; echo ALL_THREE_ADOPTED
    expected: ALL_THREE_ADOPTED printed, exit 0
    fix_if: >-
      MISSING names a call site that still re-derives the invariant by hand. A per-file loop is
      required here because `grep -c` over several files exits 0 when ANY file matches, so a
      partial adoption would pass unnoticed. NOT ceremony against step 5, despite the real overlap
      (critique round 4, S3): step 5's set-equality subsumes this step's positive direction whenever
      the contract lists these same three files, so the two diverge in exactly one case -- a
      COORDINATED regression in which a caller drops the import AND the contract drops that file's
      call_sites row, which step 5 then reads as parity and PASSES. This step is the only guard that
      fails there; do not delete it as redundant.
    graduation: graduate
    graduation_check_id: closure-stamp-single-definition
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: A writer-transport failure reddens; an absent rec still skips
    command: >-
      bin/venv-python -m pytest
      "tests/ci_rca/test_close_recs_from_trailer.py::test_writer_transport_failure_sets_exit_code"
      "tests/ci_rca/test_close_recs_from_trailer.py::test_absent_rec_skips_without_exit_code" -q
    expected: 2 passed
    fix_if: >-
      exit code 4 means the nodeids do not exist -- name them exactly as authored. A transport
      failure leaving exit_code 0 means a writer 502 still silently drops a closure (Decision 55
      fail-open). ASYMMETRY IS DELIBERATE (critique round 4, S4): this step names TWO nodeids but
      carries ONE graduation_check_id, so the standing shard closure-transport-failure-reddens
      guards the TRANSPORT arm only. test_absent_rec_skips_without_exit_code is covered by step 1's
      whole-file selector and the full tier, and gets NO shard of its own -- a chosen scope limit
      (one check_spec.node_id slot carries one property, and validate_graduation_completeness
      matches on plan_slug + check_id alone, so the single id satisfies it), not an oversight. Do
      not split this step to chase symmetry.
    graduation: graduate
    graduation_check_id: closure-transport-failure-reddens
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The backfill if condition survives closure failure but not cancellation or a failed install/creds step
    command: >-
      bin/venv-python -c "import re,yaml;j=yaml.safe_load(open('.github/workflows/rec-autoclose.yml'))['jobs']['autoclose']['steps'];ids={x['id']
      for x in j if x.get('id')};s=[x for x in j if x.get('name')=='Backfill decisions to
      warehouse'][0]['if'];refs=set(re.findall(r'steps\.([A-Za-z0-9_-]+)\.',s));print(s,'| refs=',refs,'|
      ids=',ids);assert '!cancelled()' in s, 'missing !cancelled()';assert 'always()' not in s,
      'always() also runs on cancellation -- use !cancelled()';assert
      \"steps.detect-decisions.outputs.changed == 'true'\" in s, 'DCG-03 co-gating clause
      dropped';assert s.count(\"outcome == 'success'\") >= 2, 'install/creds outcome guards
      missing';assert refs <= ids, 'unresolvable step refs (add id to those steps): '+str(refs-ids)"
    expected: the if expression, its step refs and the job's real ids all print, and the assertion holds
    fix_if: >-
      a ScannerError means the if value was left YAML-unquoted (`!` opens a tag, `&&` an anchor) --
      quote it. "unresolvable step refs" names an id referenced but never defined, which makes the
      conjunction false and silently retires the ETL -- add the id to that step. Other
      AssertionErrors mean always() was used, the DCG-03 co-gating clause was dropped, or the
      install/credentials outcome guards are missing.
    graduation: graduate
    graduation_check_id: rec-autoclose-backfill-not-cancelled
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: DCG-03 co-gating pin and the R3 workflow ratchet both still hold
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_decisions_divergence_guard.py
      tests/checks/ci_guards/test__workflow_shell_bodies.py -q
    expected: 'all pass; the ratchet is untouched because no run-body changed'
    fix_if: >-
      a ratchet failure means a run-body was edited -- revert that; the if-condition edit alone is
      intended. A divergence-guard failure means the pin was not updated to the new full string, or
      that the line-269 edit disturbed a sibling assertion inside the ALREADY-GRADUATED nodeid
      TestSubstantiveSignalPin::test_rec_autoclose_exits_nonzero_on_failed_rows (shard
      rec-autoclose-failed-counter-exit-present, Decision 155 reversal condition (c)) -- restore
      the :267-268 continue-on-error / `|| true` assertions and the sys.exit AST walk untouched.
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication against step 9's shard, which graduates the new if-condition property
      itself. What remains here is two PRE-EXISTING suites (the DCG-03 pin, already covered by the
      graduated shard rec-autoclose-failed-counter-exit-present, and the R3 ratchet) that the full
      tier already owns; graduating them would register a second guard over properties this plan
      did not create.
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: The sweep's waiver path is unchanged in behaviour by the predicate adoption
    command: bin/venv-python -m pytest tests/test_ci_rca_inactivity_sweep.py -q
    expected: all pass, waiver kwargs still threaded for blob-carrying ci_rca recs
    fix_if: a regression here means the predicate suppressed a waiver the gate requires
    graduation: waive
    graduation_waiver_reason: >-
      Concrete duplication of an existing suite this plan does not change: the sweep's waiver
      assertions and its real-gate end-to-end case both pre-date this work and the full tier already
      owns them. This step is a no-op permission check confirming the predicate adoption did not
      disturb them; a shard would register a second guard over behaviour this plan did not create --
      the same reasoning step 10 carries (critique round 2, S5).
  - step: 12
    phase: pre-deploy
    action: Fast tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: address each reported check; never bypass with --ignore-budget
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: Full tier (handoff_policy gate -- must complete before commit)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: on timeout the disposition is blocked -- resume later and rerun full from the start
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: The live post-merge rec-autoclose run closed rec-3730 end-to-end
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;r=[json.loads(l)
      for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()];x=next(y for y in r if y['id']=='rec-3730');print(x['status'],'|',x['resolution']);assert
      x['status']=='closed' and x['resolution'].startswith('Auto-closed by rec-autoclose workflow')"
    expected: closed, with the workflow-authored resolution -- not a hand-written one
    fix_if: >-
      still open means the fix did not take on the live path; read the run's closure step. A
      hand-written resolution means someone closed it manually and the end-to-end leg is unproven.
      Use the portal's own --sync flag, never `scripts.sync.ops sync`: AGENTS.md reserves the pull
      CLI for operators and the agent surface is the portal (critique round 3, S6).
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: Close rec-3738 with a fix-bound artifact (autoclose structurally cannot -- it supplies no closure_artifact)
    command: >-
      git fetch origin main --quiet && bin/venv-python -m scripts.ops_data_portal --update-rec
      rec-3738 --status closed --resolution "Resolved by PLAN-closure-stamp-applicability:
      closure-stamp precondition exported and adopted at every call site; seam contract test added."
      --closure-artifact "shard:closure-stamp-applicable-seam"
      --closure-fix-sha "$(git rev-parse origin/main)" --profile agent_platform && bin/venv-python -m
      scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;r=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()];x=next(y for y in r if
      y['id']=='rec-3738');c=json.loads(x['context_v2_json']);print(x['status'],'|',c.get('closure_artifact'),'|',c.get('fixed_by_sha'));assert
      x['status']=='closed' and c.get('closure_artifact') and c.get('fixed_by_sha')"
    expected: the write succeeds AND the read-back shows closed with both closure_artifact and fixed_by_sha stamped
    fix_if: >-
      The artifact kind is `shard:`, the STRONGEST member of closure_gate.KIND_STRENGTH (shard,
      pytest, check, fixture) and per Decision 186 point 4 the only kind carrying the
      still-red-on-reintroduction property -- the same squash-merge commit creates
      config/agent/verification_registry/entries/closure-stamp-applicable-seam.yaml, so it resolves
      fix-bound identically to the pytest form the earlier drafts used (critique round 3, S9). A
      silent exit 0 with no output means the wrong entrypoint was used -- scripts.ops_portal.cli has
      no __main__ guard and does nothing (critique round 2, B3); scripts.ops_data_portal is the
      sanctioned one. ClosureArtifactRequired means the fix sha does not touch the artifact's
      defining file (for shard:<id> that is the entry YAML itself) -- the leading git fetch exists
      because a stale origin/main ref is the usual cause; confirm git rev-parse origin/main is the
      squash-merge sha. A read-back assertion failure means the write landed the wrong status or
      lost its stamps.
    graduation: not-applicable
