constraints:
- IMPLEMENTATION only (Decision 67 freeze); one scope file; append CD.45 only -- no tier_item, no other CD and no other byte of docs/ROADMAP-PLATFORM.yaml changes.
- 'Do NOT ratify: no DECISIONS.md entry, no portal write, no realization_evidence and no [Realized marker (candidate-decision-ratification.yaml R2 and second_signal); ratification is the operator''s later act, and Decision 197''s body is never edited here (Decision 177).'
- Do NOT create the fixture, its model, evaluator, sunset check, file-router route, docs/CLAUDE.md class row or structural_size_budgets.yaml entry -- the design stream's W0/W1 plans own them. A route to a missing target fails validate_placement, and a budgets raise needs a raise-approved marker whose Decision body names the path (Decisions 165/166), so registration cannot precede the file or the ratification.
- No ad hoc trim elsewhere in the roadmap to offset the added lines (Decision 147 reversal condition; escalation owned by open rec-3960). The file must stay at or below 10,000 lines (Decision 114).
- 'Numbering race: re-check the next free CD id at implement time (grep ''  - id: CD.'' in the roadmap on origin/main and open branches); if CD.45 was taken, use the next free id and update the id literals in the block, VP 1 and the narrowly_supersedes clause text together.'
- Wording must avoid leg C's blocking phrases (docs/contracts/roadmap-liveness.yaml) and the tier-as-phase pattern validate_environment_taxonomy scans for.
- No rescue agents or workaround loops (Decision 55). No emojis; ASCII hyphens only.
- The implementing session performs the open-branch CD-id sweep and rebases onto origin/main before push (execution_steps[0]); plan-critique could not perform the sweep (credential service 503).
