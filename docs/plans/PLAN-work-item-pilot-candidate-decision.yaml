- "docs/ROADMAP-PLATFORM.yaml: insert this block VERBATIM (20 lines, two-space list indent as the siblings) directly after CD.44's final line and before the blank line that precedes tier_items: -- no other change:\n  - id: CD.45\n    title: Work-item model design proceeds now through ONE provisional_v0 pilot fixture in the Decision 197 clause-3 grain (amends Decision 197 clause 8 sequencing; a one-off, never precedent)\n    detail: |\n      SEQUENCING (amends Decision 197 clause 8): the clause-3 design walk may proceed now through ONE pilot population outside T4.23, relaxing \"recording the\n      destination while deliberately not building it\" for that fixture alone; merge keys, identity and columns stay clause 8's (T4.23 c13/c14), roadmap migration\n      still follows T4.23's port, no lift of the roadmap's current shape occurs, and Decision 197's body changes only on ratification (Decision 177). PILOT: a\n      telemetry-feedback-loop design fixture populates work_items, work_item_criteria and work_item_edges; its consideration register (why/how, plane per\n      Decision 209, maturity ladder, failure_signal per Decision 196 clause 7, verification, rollback, open questions) is a per-item extension block (clause 4),\n      never columns. ONE-OFF, for two recorded reasons: (a) pilot data for the clause-3 model; (b) authored under delegated authority in an unattended operator\n      window. Status provisional_v0; re_ratification/sunset trigger first_of(T4.23:c6 met, 2027-01-31 review): its rows lift into the store or it is restructured\n      (rehomed or reshaped) per the operator's review; its evaluator enforces the schema, an item-count cap and a single-instance guard (no second such fixture).\n      Declining this CD means restructuring the fixture as the operator decides, never deleting it; never precedent for roadmap-like files before the store\n      exists. NOT A ROADMAP: docs/work-item-pilot/telemetry-feedback-loop.yaml (residual size class; never-shipped data, Decision 197 clause 1), outside\n      docs/ROADMAP-*.yaml (Decisions 110/114/147); sized by schema and item count; more lines need a ratified Decision naming the path (Decisions 166/165). Never\n      read by /orient, preflight or a pick surface (Decision 108); edges into ROADMAP-PLATFORM are id-only pilot rows.\n    gates: []\n    affects: [T4.23, T4.24, T3.3, T3.4, T2.36, T3.20]\n    state: pending\n    filed_via: pending_log_decision_lambda\n    narrowly_supersedes: {decision_id: 197, clause: \"clause 8 sequencing, for the one CD.45 pilot fixture only (detail SEQUENCING)\"}\n"
- Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
