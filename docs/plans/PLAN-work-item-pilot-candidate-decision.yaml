slug: work-item-pilot-candidate-decision
intent: 'File one pending candidate decision, CD.45, that amends Decision 197 clause 8''s sequencing so the clause-3 work-item model''s design walk can proceed now through ONE provisional_v0 pilot fixture (a telemetry-feedback-loop design population in the destination grain), sanctioned as a mechanically bounded one-off and never a precedent for roadmap-like files. Filing only: the operator ratifies later; the fixture and its evaluator are the design stream''s own W0/W1 plans.'
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-work-item-pilot-candidate-decision.yaml
phase: 'user_explicit_out_of_scope (soft-warn category: operator-directed governance CD filing; no tier_item claimed, no exit criterion closed). CD.45 names T4.23, T4.24, T3.3, T3.4, T2.36 and T3.20 in affects (in-scope-of, never gating).'
scope:
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Append the verbatim 20-line CD.45 block from execution_steps after CD.44's last line, before the blank line preceding tier_items:. No other byte of the file changes (no tier_item, no other CD, no trim).
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: scripts.lambda_manifest.compute_affected_artifacts([''docs/ROADMAP-PLATFORM.yaml'']) returns {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']} because the roadmap is a packaged asset of the active data-pipeline artifact (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke-test is owed: the edit is asset-only candidate_decisions bookkeeping with no packaged code change, and the asset refreshes with the artifact''s next governed deploy. V1 stands, following PLAN-criterion-shape-forks-routing.yaml and PLAN-governance-and-work-item-boundary.yaml.'
acceptance_criteria:
- docs/ROADMAP-PLATFORM.yaml carries CD.45 as the LAST candidate_decisions entry, in R2's pending shape (state pending, filed_via pending_log_decision_lambda, no ratified_as, no realization_evidence, no '[Realized' marker), with gates [] and affects [T4.23, T4.24, T3.3, T3.4, T2.36, T3.20], narrowly_supersedes decision_id 197, in at most 20 lines (VP 1).
- 'CD.45''s detail carries all four operator terms, as confirmed at Step 6b: the reworded clause-8 sequencing delta with keys left to clause 8 and Decision 197''s body untouched (Decision 177); the pilot population in the clause-3 grain with its consideration register as a clause-4 extension block; the one-off sanction with both reasons, provisional_v0, the sunset trigger, item-count cap and single-instance guard; and the not-a-roadmap placement with the named path and class, Decision 108 sole-source and id-only edges (VP 1).'
- 'No eligibility, blocking, ratification-lane or gate projection changes: PlatformRoadmapState.to_preflight_dict is identical for origin/main''s roadmap and the branch roadmap (VP 2).'
- validate_platform_roadmap (schema and the 10,000-line ceiling), validate_candidate_decision_ratification (R2), validate_candidate_decision_supersession and validate_roadmap_liveness pass; check_roadmap_regrowth reports and fails nothing (VP 3).
- The full presubmit tier exits 0 (VP 4).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Parse the roadmap and assert CD.45's position, R2 and out-of-lane shape, non-gating edges, narrowly_supersedes, the load-bearing terms, and the 20-line target.
  command: 'bin/venv-python -c "import yaml;s=open(''docs/ROADMAP-PLATFORM.yaml'',encoding=''utf-8'').read();L=s.splitlines();d=yaml.safe_load(s);cds=d[''candidate_decisions''];c=[x for x in cds if x[''id'']==''CD.45''][0];t='' ''.join(c[''detail''].split());assert cds[-1][''id'']==''CD.45'',''CD.45 is not the last candidate_decision'';assert c[''state'']==''pending'' and c.get(''filed_via'')==''pending_log_decision_lambda'' and ''ratified_as'' not in c and not c.get(''realization_evidence''),''R2 or ratification-lane shape'';assert c[''gates'']==[] and c[''affects'']==[''T4.23'',''T4.24'',''T3.3'',''T3.4'',''T2.36'',''T3.20''],''gates/affects'';assert c[''narrowly_supersedes''][''decision_id'']==197,''narrowly_supersedes'';assert ''[Realized'' not in t,''realized marker'';miss=[k for k in [''amends Decision 197 clause 8'',''T4.23 c13/c14'',''Decision 177'',''work_items, work_item_criteria and work_item_edges'',''Decision 209'',''Decision 196 clause 7'',''extension block'',''delegated authority'',''provisional_v0'',''T4.23:c6'',''2027-01-31'',''restructured (rehomed or reshaped)'',''never deleting it'',''item-count cap'',''single-instance guard'',''docs/work-item-pilot/telemetry-feedback-loop.yaml'',''Decision 197 clause 1'',''Decision 108'',''id-only''] if k not in t];assert not miss,miss;n=L.index(''tier_items:'')-1-L.index(''  - id: CD.45'');assert n<=20,(''CD.45 block lines'',n);print(''CD.45 shape OK'',n)"'
  expected: Exit 0 printing CD.45 shape OK followed by the block's line count (at most 20).
  fix_if: An IndexError means CD.45 is absent (red before). A named assertion means the appended block drifted from the verbatim text in execution_steps -- re-copy it; never edit the assertion. If a concurrent PR took CD.45, see constraints (numbering race).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The asserted fields are CD.45's PRE-ratification shape, which its own ratification legitimately flips (state, ratified_as, filed_via per candidate-decision-ratification.yaml), so a standing registry row would stay green only until the one edit it exists to allow. The durable shape invariants already run standing in both tiers (validate_candidate_decision_ratification R2, validate_platform_roadmap schema), and the fixture's one-off terms get their standing guard in the fixture's own W0 evaluator.
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: 'Eligibility-invariance differential (Decision 147 point 3''s method): compare to_preflight_dict for origin/main''s roadmap and the branch roadmap.'
  command: bin/venv-python -c "import subprocess,tempfile,json;from pathlib import Path;from scripts.platform_roadmap_state import load,PlatformRoadmapState as S;b=subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True,encoding='utf-8',check=True).stdout;t=Path(tempfile.mkdtemp())/'base.yaml';t.write_text(b,encoding='utf-8');p=Path('docs/plans');f=lambda x:json.dumps(S(load(x)).to_preflight_dict(plans_dir=p),sort_keys=True,default=str);assert 'CD.45' not in b,'base already carries CD.45';assert f(t)==f(Path('docs/ROADMAP-PLATFORM.yaml')),'projection drift';print('projections identical')"
  expected: Exit 0 printing projections identical (about 12 s measured locally, 10% of the replay aggregate).
  fix_if: Projection drift means CD.45 gates or surfaces something -- check gates is [], realization_evidence is absent and detail carries no [Realized marker. 'base already carries CD.45' means the base ref collapsed or a concurrent PR claimed the id.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: An invariance differential is green before and after by construction (it proves the edit changes nothing), so it has no red-before polarity to graduate; it is also PR-relative against origin/main, so a registry row would be vacuous once the base collapses post-merge.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Run the five standing roadmap guards directly against the edited file.
  command: bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as a;from scripts.checks.roadmap.validate_candidate_decision_ratification import validate_candidate_decision_ratification as b;from scripts.checks.roadmap.validate_candidate_decision_supersession import validate_candidate_decision_supersession as c;from scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as d;from scripts.checks.roadmap.check_roadmap_regrowth import check_roadmap_regrowth as e;f=[];[g(f) for g in (a,b,c,d,e)];assert not f,f;print('roadmap guards pass')"
  expected: Exit 0 printing roadmap guards pass; the regrowth line reads about lines=9799 headroom=201 escalate=true (report-only).
  fix_if: A schema FAIL means malformed YAML or an unknown CandidateDecision key; an R2 FAIL means ratified_as or a dec pointer in filed_via; a ceiling FAIL means the file passed 10,000 lines -- escalate per Decision 147 (rec-3960), never trim ad hoc.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates five checks already registered and standing in the --pre and full tiers; a registry row would re-run them for no added independence.
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Full presubmit tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: 'Diagnose the named failing check on the branch (Decision 55: no rescue loops); a failure unrelated to this one-block edit is recorded, not patched inline (implement-scope-boundary.yaml).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff gate itself, not a regression guard.
