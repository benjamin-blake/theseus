  edit and places the staged text under a "## Staged roadmap bookkeeping" heading in the PR body; under ruling (b), /implement
  runs the walk as written.'
- 'Out of scope: docs/ROADMAP-PLATFORM.yaml (data-pipeline Lambda asset, Decisions 79/125: staged only), scripts/validate.py
  (Decision 169), config/check_accounting_baseline.yaml (Decision 170: the check declares examined and never enters it), src/common/ducklake_reader_client.py
  and docs/contracts/read-engine.yaml (cited, not edited).'
- 'No recommendation is claimed, bundled, filed, closed or trailered (charter Decision 67 never-item). A later-found open
  rec owning c10 or audit F-004 is PARKED, never bundled by a delegate.'
- 'c8 and c9 are not closed or flipped: the guard is evidence for them only (context). The guard scans scripts/sync/ops.py,
  scripts/ops_portal/cache.py and scripts/ops_data_portal.py read-only and never edits them; the sync() / _sync_table exit-code
  gap stays with the parked c9 flip.'
- 'Ops-store plane only: src/telemetry/** is allowlisted as a separate plane (Decision 184 cl.2 plane-neutral kernel); its
  producer boundary belongs to the W1 capture-producer design (rec-4026).'
- 'Detection is AST Name/Attribute/Import nodes, never raw strings (R3''s non-docstring string match is the one exception,
  for the retired flag only); a finding on the real tree is reported, never allowlisted inline. Widening ALLOWLIST or DECLARED_READERS
  is a reviewed code edit with a reason; the test pins both counts (Decisions 181/187).'
- No net-new suppressions (noqa, type ignore, pragma no cover, skip, xfail) in the diff (project Goodhart countermeasure);
  every new test fails on broken code. New module stays under 500 SLOC unregistered (Decision 128).
- No rescue agents or workaround loops (Decision 55). No emojis; ASCII hyphens only.
