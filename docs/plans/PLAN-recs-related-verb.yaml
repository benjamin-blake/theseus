execution_steps:
  - >-
    1. Registry and contract: add recs_related to src/common/ducklake_named_reads.py (version 5, deprecate the two
    descriptions), VERB_FIELDS + pin 5 in src/common/ducklake_reader_client.py, docs/contracts/read-engine.yaml; update
    tests/test_ducklake_named_reads.py, the parity test's _PARAM_VALUES, the MCP projection node; write
    tests/recs_related/test_verb_sql.py. Run VP steps 1-3 and 11.
  - |-
    2. SQL reference -- the planning-time prototype, validated on duckdb 1.5.4 against the behaviours step 2 asserts
    (adapt names to the registry style; {tbl} is the current projection; binds in params order):
      WITH q AS (SELECT unnest(string_split(?, ',')) AS path),
      near AS (SELECT split_part(x, '|', 1) AS path, CAST(split_part(x, '|', 2) AS DOUBLE) AS w
               FROM (SELECT unnest(string_split(?, ',')) AS x) WHERE x <> ''),
      terms_in AS (SELECT split_part(x, '|', 1) AS term, CAST(split_part(x, '|', 2) AS DOUBLE) AS w
                   FROM (SELECT unnest(string_split(?, ',')) AS x) WHERE x <> ''),
      ex AS (SELECT string_split(?, ',') AS ids),
      guard AS (SELECT CASE WHEN len(ids) > 200 THEN error('recs_related: exclude_ids over 200 ids -- narrow the query') END AS g FROM ex),
      openr AS (SELECT * FROM {tbl} WHERE status = 'open'),
      n AS (SELECT count(*) AS n_open FROM openr),
      terms AS (SELECT t.term, t.w, '(^|[^a-z0-9_])' || regexp_escape(t.term) || '($|[^a-z0-9_])' AS pat,
                (SELECT count(*) FROM openr o WHERE regexp_matches(lower(o.title || ' ' || coalesce(o.context, '')),
                 '(^|[^a-z0-9_])' || regexp_escape(t.term) || '($|[^a-z0-9_])')) AS df FROM terms_in t),
      scored AS (SELECT o.id, o.title, o.status, o.priority, o.effort, o.source, o.file, o.created_timestamp,
          (o.file IN (SELECT path FROM q) OR (right(o.file, 1) = '/' AND EXISTS (SELECT 1 FROM q WHERE starts_with(q.path, o.file)))) AS direct,
          coalesce((SELECT max(nr.w) FROM near nr WHERE nr.path = o.file), 0) AS near_w,
          coalesce((SELECT sum(t.w * ln(1 + n.n_open / (1 + t.df))) FROM terms t, n
                    WHERE regexp_matches(lower(o.title || ' ' || coalesce(o.context, '')), t.pat)), 0) AS term_w,
          coalesce((SELECT count(*) FROM terms t, n WHERE t.df <= 0.05 * n.n_open
                    AND regexp_matches(lower(o.title || ' ' || coalesce(o.context, '')), t.pat)), 0) AS admitting_hits,
          (SELECT string_agg(t.term, ' ' ORDER BY t.term) FROM terms t
           WHERE regexp_matches(lower(o.title || ' ' || coalesce(o.context, '')), t.pat)) AS matched_terms,
          left(o.context, 200) AS snippet
        FROM openr o, guard, ex WHERE guard.g IS NULL AND NOT list_contains(ex.ids, o.id))
      SELECT id, title, status, priority, effort, source, file, created_timestamp, direct, near_w + term_w AS score,
             matched_terms, snippet, count(*) OVER () AS total, count(*) FILTER (WHERE direct) OVER () AS direct_total
      FROM scored WHERE direct OR near_w > 0 OR admitting_hits > 0
      ORDER BY direct DESC, CASE lower(priority) WHEN 'critical' THEN 0 WHEN 'high' THEN 1 WHEN 'medium' THEN 2
               WHEN 'low' THEN 3 ELSE 4 END, score DESC, created_timestamp DESC, id
      LIMIT least(CAST(? AS INTEGER), 100)
  - >-
    3. Channel modules and their tests (envelope, neighbourhood, mentions, history, terms), each generic over files and
    returning neighbours or terms plus a channel status. Run VP steps 4-8.
  - >-
    4. Core and CLI (related_recs.py, __main__.py, __init__.py) and their tests. Run VP steps 9-10, then the live CLI
    against the v4 reader ONLY to confirm it fails loudly with an unknown-verb error before the deploy (never a silent
    empty result); do not depend on the live verb pre-merge.
  - >-
    5. Planning surfaces (planning SKILL.md, plan.md) byte-neutral; docs/contracts/ports.yaml SA-01; file-router route;
    the Decision 215 amendment annotation naming rec-4279 and rec-4240 (both exist; Decision 181). Run VP steps 12-13.
  - >-
    6. Full validation (VP step 14) to completion, then the PR with "Resolves: rec-4235" in the squash body. After merge
    and a green deploy-ducklake-lambdas.yml run, VP steps 15-17.
  - "7. Report: what was implemented, verification results, the live step 16 envelope."
