schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "recs-related-verb"
intent: >-
  Planning agents find the open recommendations relevant to the files they are about to change -- including recs anchored on
  neighbouring files that a direct hit misses because the 500-SLOC limit spreads each concern over many small files --
  as one ranked, bounded, explained page instead of an unranked direct-hit list. Ships rec-4235's verb half: one
  server-ranked reader verb (recs_related) fed by a repo-side neighbourhood expansion (imports, package siblings, tests
  mirror, patch_string edges, text mentions, git change coupling, rename aliases, lexical terms) behind a grep-like CLI over
  one Python core, and moves the planning surfaces off the interim recs_for_files read (Decision 215 clause 3).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-recs-related-verb.yaml
phase: >-
  ad_hoc_rec rec-4235 (High; soft-warn category, no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Realises Decision 215 clause 3's deferred graph-aware ranking. Claims, moves and closes no tier_item criterion; adds one
  ports.yaml structural_assumptions row that T4.24 c9 consumes later.
scope:
  # --- reader verb (Lambda-packaged: src/common/ducklake_named_reads.py is in the ducklake_reader manifest includes) ---
  - file: src/common/ducklake_named_reads.py
    action: Modify
    purpose: >-
      NAMED_READS_VERSION 4 -> 5 (EXPAND only, no verb removed). New NamedRead recs_related on ops_recommendations, params
      ("files", "near", "terms", "exclude_ids", "limit") in that bind order, paginable False, agent_facing False, a
      description saying it is a relevance lookup behind scripts.recs_related and not a bulk path. Fixed SQL, every bind a
      string (Decision 84 I-3); execution step 2 carries the planning-time prototype validated on duckdb 1.5.4 (the Lambda
      pin). Semantics: `files` (comma list) is the DIRECT tier -- exact anchor match, plus a trailing-slash directory anchor
      that prefixes a query file; `near` is "path|weight" pairs (CAST, never TRY_CAST, so a malformed weight fails loudly);
      `terms` is "term|weight" pairs of plain lower-case literals the SQL escapes with regexp_escape and matches as whole
      tokens ('(^|[^a-z0-9_])' || regexp_escape(term) || '($|[^a-z0-9_])') over lower(title || ' ' || context), each hit
      scored w * ln(1 + n_open / (1 + df)) with df counted over open recs; a term whose df exceeds 5% of open recs only
      re-ranks and never admits a row alone (decision-scout NOTE, Decision 215 cl.1). `exclude_ids` (keyset-by-exclusion
      paging) over 200 ids raises via DuckDB error() -- loud, never a silent empty. A row is a candidate iff direct OR
      near weight > 0 OR an admitting term hit; status = 'open' only. ORDER BY direct DESC, priority rank (critical 0, high
      1, medium 2, low 3, else 4), score (near weight + term score) DESC, created_timestamp DESC, id; LIMIT
      least(CAST(? AS INTEGER), 100). Projects id, title, status, priority, effort, source, file, created_timestamp, direct,
      score, matched_terms, snippet (left(context, 200)), total (count(*) OVER ()), direct_total (count(*) FILTER (WHERE
      direct) OVER ()). All-empty binds return zero rows. recs_for_files' and open_recs' descriptions gain a leading
      "deprecated: ... (removal rec-4240)" (expand/contract, Decision 215 cl.7 precedent); no other verb's SQL, params or
      paginable flag changes, so no other read_version moves.
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      VERB_FIELDS gains recs_related's exact column tuple (the projection order above); _NAMED_READS_VERSION_PIN 5. No
      adapter method is added (Decision 212: client additions are module helpers over named()).
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      read_surface.named_verbs.verbs.ops_recommendations gains recs_related; deprecated_verbs gains recs_for_files and
      open_recs (removal rec-4240); the recs_cache line names recs_related (through scripts.recs_related) as the relevance
      read; one relevance_read block carrying the output field semantics (direct, score, matched_terms, snippet, total,
      direct_total), the 100-row page cap, the 200-id exclude cap, the 5% term ceiling, and "a relevance lookup, not a bulk
      path -- bulk export is rec-4237"; amendment_log entry (Decision 168). validate_read_engine_verbs stays green.
  # --- client core + CLI (scripts/recs_related/, every module < 500 SLOC, Decision 128) ---
  - file: scripts/recs_related/__init__.py
    action: Create
    purpose: Facade re-exporting related_recs, the channel entry points and the envelope types (Decision 124 pattern).
  - file: scripts/recs_related/envelope.py
    action: Create
    purpose: >-
      The single output schema (dataclasses): Hit (id, title, priority, status, effort, source, file, tier
      direct|near|term, score, why list, snippet) and Envelope (query, hits, total, direct_total, returned, complete,
      direct_complete, channels {name: ok|unavailable: reason}, next_exclude), with to_json(). The CLI's JSON is asserted
      against it, and rec-4280's MCP outputSchema will be generated from it.
  - file: scripts/recs_related/neighbourhood.py
    action: Create
    purpose: >-
      Structural channel, generic over files (no rec vocabulary, Decision 197 cl.7): for each query file, Python imports via
      scripts.dependency_graph's public API only (build_graph + import_subgraph; dependency_graph.py is NOT modified, so
      Decision 135's affected-set derivation is untouched) -- upstream 1-hop (files the query imports) and downstream 1-hop
      (files importing it); patch_string edges either direction; package siblings (same directory); tests mirror via
      scripts.test_coverage_checker.map_source_to_test (Decision 131's single naming source, read-only). Returns
      (path, relation set) neighbours plus a channel status.
  - file: scripts/recs_related/mentions.py
    action: Create
    purpose: >-
      Text-reference channel the import graph cannot see (37% of anchors are yaml/md/yml/tf/sh): repo paths and dotted
      src/scripts/tests module names referenced in the query file's own text, matched precisely (path or quoted-token,
      never a bare substring -- Decision 135 cl.1(b); reuse scripts/checks/deps/affected_tests.py's matcher where it is
      importable) and resolved to tracked files (git ls-files). Outbound only (inbound measured at zero lift).
  - file: scripts/recs_related/history.py
    action: Create
    purpose: >-
      Git channel over first-parent HEAD history: (1) change coupling -- commits touching <= 30 files only, shared-commit
      count and confidence (shared / commits touching the query file) per partner; (2) aliases -- the query file's earlier
      names from rename records, plus the pre-split module path when the query file sits in a package that replaced a
      same-named .py (Decision 128 decomposition). A shallow clone or a git failure marks the channel unavailable in the
      envelope; it never raises and never silently reports zero (Decision 215 cl.2).
  - file: scripts/recs_related/terms.py
    action: Create
    purpose: >-
      Lexical channel: repo path, dotted module, stem (skipping generic stems such as __init__, conftest, manifest, skill,
      handler, claude, readme), basename, and up to 40 top-level def/class names of length >= 5 read by AST (never import
      or exec). Lower-cased, restricted to [a-z0-9_./-] (no comma or pipe can reach a bind), deduplicated; free-text --terms
      are sanitised the same way; at most 40 terms per call.
  - file: scripts/recs_related/related_recs.py
    action: Create
    purpose: >-
      The core, a module helper over the existing `named` port verb (Decision 212): related_recs(files, terms, limit,
      exclude_ids, reader=None) -> Envelope. Builds the five binds with the measured weights pinned in one module constant
      -- near per path = sum over query files of upstream 4, downstream 1, sibling 1, tests mirror 1, patch_string 1, mention
      0.5, coupling 0.5*min(shared, 5) + 0.5*confidence (near list capped at 400 paths by weight, truncation reported);
      aliases join the direct tier; terms = stem 16, module 1, basename 0.5, path 0.5, symbol 0.5 -- then makes EXACTLY ONE
      reader.named("recs_related", ...) call and attaches a why list to every hit from the expansion map and matched_terms.
      Envelope: complete = returned + len(exclude_ids) >= total; next_exclude carries the seen ids; at 200 excluded ids
      paging stops with complete false and a narrow-the-query hint (decision-scout NOTE). A reader failure raises (Decision
      55); it never returns an empty result.
  - file: scripts/recs_related/__main__.py
    action: Create
    purpose: >-
      CLI over the core only: bin/venv-python -m scripts.recs_related FILE [FILE ...] [--terms "a b"] [--limit N (default
      20, max 100)] [--exclude IDS] [--table]. JSON (Envelope.to_json) by default, --table for one line per hit plus an
      envelope line. No files and no terms exits 2; a reader failure exits 1 with the error on stderr.
  # --- tests (mirror package, every directory carries __init__.py) ---
  - file: tests/recs_related/__init__.py
    action: Create
    purpose: Mirror test package marker (prepend import mode).
  - file: tests/recs_related/test_envelope.py
    action: Create
    purpose: Hermetic class TestEnvelope -- field set, tier values, to_json round-trip, completeness arithmetic.
  - file: tests/recs_related/test_neighbourhood.py
    action: Create
    purpose: >-
      Hermetic class TestNeighbourhood over a tmp repo tree: upstream and downstream 1-hop, patch_string, siblings, the
      tests mirror through map_source_to_test, a missing file yields no neighbours and an ok status.
  - file: tests/recs_related/test_mentions.py
    action: Create
    purpose: >-
      Hermetic class TestMentions: path and dotted-module mentions in yaml, md and py resolve to tracked files; untracked
      paths, self mentions and bare-substring look-alikes drop.
  - file: tests/recs_related/test_history.py
    action: Create
    purpose: >-
      Hermetic class TestHistory over a tmp git repo (git init in tmp_path): coupling counts and confidence, the 30-file
      commit filter, rename and split aliases, the shallow-clone and git-failure channel status.
  - file: tests/recs_related/test_terms.py
    action: Create
    purpose: Hermetic class TestTerms -- derivation, stoplist, AST symbols without import, sanitising, the 40-term cap.
  - file: tests/recs_related/test_related_recs.py
    action: Create
    purpose: >-
      rec-4235's acceptance file. Fully hermetic (fake reader, tmp repo, no duckdb, no credentials) because the Decision 201
      closure verdict runs it in the static sandbox on the merge push, before the deploy. Class TestRelatedRecs: one
      named("recs_related") call with the expected binds and weights; every hit carries a why; aliases join files;
      complete, direct_complete and next_exclude arithmetic; the 200-id stop; a reader error propagates; an empty query is
      refused.
  - file: tests/recs_related/test_verb_sql.py
    action: Create
    purpose: >-
      Executes recs_related's REGISTERED SQL in in-memory DuckDB (pytest.importorskip("duckdb"); the table built from
      resolve_table_spec("ops_recommendations"), {tbl} substituted as the parity test does). Asserts: direct tier first,
      then priority, score, recency; the trailing-slash directory anchor; whole-token matching (no substring hit) and
      regexp_escape (a '.' in a term is literal); a common term (df over 5%) never admits a row alone but re-ranks; the
      exclude filter and the >200-id error; the 100-row cap; total and direct_total; non-open rows never returned; all-empty
      binds return nothing; a malformed near weight raises.
  - file: tests/recs_related/test___main__.py
    action: Create
    purpose: Hermetic class TestCli -- argument parsing, JSON and --table output, exit 2 on an empty query, exit 1 on a reader error.
  - file: tests/test_ducklake_named_reads.py
    action: Modify
    purpose: >-
      test_named_reads_version_is_4 becomes ..._is_5. New class TestRecsRelatedVerbV5: registered on ops_recommendations
      with its five params in bind order, paginable False, agent_facing False; recs_for_files and open_recs still registered
      with descriptions starting "deprecated:"; no pre-existing verb re-versioned (read_version of every other verb equals
      its v4 value computed in-test). TestRecsReadVerbsV4.test_agent_facing_flags' exemption set gains recs_related.
  - file: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    action: Modify
    purpose: _PARAM_VALUES gains castable values for near ("a.py|1"), terms ("x|1") and limit ("5") so the parity harness executes recs_related's SQL.
  - file: tests/test_agent_sdk_mcp_server.py
    action: Modify
    purpose: >-
      TestAgentFacingProjection.test_real_registry_hides_open_recs_and_preflight_signal_rows also asserts recs_related is not
      projected. Hermetic only (rec-4273/rec-4275); no live call added; mcp_server.py itself is untouched.
  # --- planning surfaces ---
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      "Suggest Aligned Recommendations": the INTERIM recs_for_files paragraph becomes `bin/venv-python -m scripts.recs_related
      <scope files>` (ranked hits with why and a completeness envelope; --terms for keyword search; bodies via recs_by_ids).
      Byte-neutral or smaller (Decision 127: 786 bytes headroom at planning time; never raise the budget).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Step 3's recs_for_files call (line 48) becomes the scripts.recs_related CLI over the likely scope files.
  # --- contracts and governance ---
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      structural_assumptions gains SA-01 (status open, owning_item T4.24:c9, location scripts/recs_related/): the expansion
      assumes a src/scripts/tests Python layout, the tests/ mirror naming convention, and first-parent squash-merge history
      on the default branch (Decision 211 cl.2, Decision 212). No coupling finding: the core reuses named() over the
      function_url adapter, already PC-01. amendment_log entry (Decision 168).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: One route (topic recs-related, target scripts/recs_related/, one-line description) plus a one-line amendment_log entry. Additive only.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One dated amendment_forms annotation appended to Decision 215 (never an in-place edit, Decision 177): clause 3's
      graph-aware ranking shipped as recs_related behind scripts.recs_related (PLAN-recs-related-verb, rec-4235);
      recs_for_files and open_recs are deprecated and removed by rec-4240; the Coverage residuals rec-4235 owned
      (cache-reference CI ban, audit dedup instructions) now belong to rec-4279 (Decision 181 point 2). No new numbered
      Decision.
bundled_recommendations:
  - rec-4235
followon_recs:
  - rec-4279
  - rec-4280
  - rec-4281
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    recs_related is registered (registry v5, agent_facing False) and its SQL ranks direct hits first, then priority, score
    and recency, at most 100 rows per call with total and direct_total disclosed; a common term never admits a row alone;
    more than 200 excluded ids fails loudly.
  - >-
    One related_recs call (CLI or core) makes exactly one reader call and returns hits that each carry a why, plus an
    Envelope reporting completeness, per-channel status and next_exclude; a reader failure raises, never an empty result.
  - The planning skill and plan.md tell agents to use scripts.recs_related; neither instructs recs_for_files.
  - recs_for_files and open_recs remain registered with deprecated descriptions; no pre-existing verb is re-versioned.
  - After deploy-ducklake-lambdas.yml ships the merge, the live reader describes recs_related and the CLI answers against it.
  - rec-4235 is closed by the merge's Resolves trailer; Decision 215 carries the dated annotation naming rec-4279 and rec-4240.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Registry v5 carries recs_related with its params, flags and deprecations, and re-versions nothing else.
    command: bin/venv-python -m pytest tests/test_ducklake_named_reads.py::TestRecsRelatedVerbV5 -q
    expected: Exit 0, all nodes pass. Red before, the class is absent (pytest exit 4).
    fix_if: A param, flag, description or read_version assertion fails; fix the registry entry, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-verb-registered
    expected_literals:
      - passed
  - step: 2
    phase: pre-deploy
    action: The registered SQL ranks, bounds and guards correctly when executed in DuckDB.
    command: bin/venv-python -m pytest tests/recs_related/test_verb_sql.py -q
    expected: Exit 0, all nodes pass.
    fix_if: Ordering, token boundary, escaping, term ceiling, exclude guard, cap or completeness columns diverge; fix the SQL.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on duckdb, absent from requirements-fast.txt (vp-red-before hermetic_authoring rule iii), so venv-less
      pr-validate cannot replay it; the full tier runs it on every PR that touches the registry or this test.
  - step: 3
    phase: pre-deploy
    action: VERB_FIELDS parity executes recs_related's SQL and matches its declared columns.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_verb_fields_parity.py -q
    expected: Exit 0.
    fix_if: The VERB_FIELDS tuple or a bind value drifts from the SQL.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing standing duckdb-dependent parity suite (rule iii) that already guards every registered verb, the new one included.
  - step: 4
    phase: pre-deploy
    action: Envelope schema and completeness arithmetic.
    command: bin/venv-python -m pytest tests/recs_related/test_envelope.py::TestEnvelope -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Fix scripts/recs_related/envelope.py, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-envelope
    expected_literals:
      - passed
  - step: 5
    phase: pre-deploy
    action: Structural channel -- imports up and down, patch_string, siblings, tests mirror.
    command: bin/venv-python -m pytest tests/recs_related/test_neighbourhood.py::TestNeighbourhood -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Fix scripts/recs_related/neighbourhood.py; never modify scripts/dependency_graph.py.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-neighbourhood
    expected_literals:
      - passed
  - step: 6
    phase: pre-deploy
    action: Text-mention channel.
    command: bin/venv-python -m pytest tests/recs_related/test_mentions.py::TestMentions -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Fix scripts/recs_related/mentions.py; never fall back to bare-substring matching.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-mentions
    expected_literals:
      - passed
  - step: 7
    phase: pre-deploy
    action: Git channel -- coupling, aliases, unavailable status.
    command: bin/venv-python -m pytest tests/recs_related/test_history.py::TestHistory -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Fix scripts/recs_related/history.py; a git failure must surface as channel status, never as zero partners.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-history
    expected_literals:
      - passed
  - step: 8
    phase: pre-deploy
    action: Lexical channel.
    command: bin/venv-python -m pytest tests/recs_related/test_terms.py::TestTerms -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Fix scripts/recs_related/terms.py.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-terms
    expected_literals:
      - passed
  - step: 9
    phase: pre-deploy
    action: Core (rec-4235 acceptance class) -- one call, binds and weights, why, envelope, paging stop, loud failure.
    command: bin/venv-python -m pytest tests/recs_related/test_related_recs.py::TestRelatedRecs -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: More than one named() call, a hit without why, a wrong completeness flag, or an error swallowed into an empty result.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-one-call-why-envelope
    expected_literals:
      - passed
  - step: 10
    phase: pre-deploy
    action: CLI contract.
    command: bin/venv-python -m pytest tests/recs_related/test___main__.py::TestCli -q
    expected: Exit 0. Red before, module and class absent (exit 4).
    fix_if: Exit codes or output shape diverge from the Envelope.
    hermetic: true
    graduation: graduate
    graduation_check_id: recs-related-cli
    expected_literals:
      - passed
  - step: 11
    phase: pre-deploy
    action: The MCP projection still hides non-agent-facing verbs, recs_related included.
    command: >-
      bin/venv-python -m pytest
      tests/test_agent_sdk_mcp_server.py::TestAgentFacingProjection::test_real_registry_hides_open_recs_and_preflight_signal_rows -q
    expected: Exit 0, 1 passed.
    fix_if: recs_related is projected -- its agent_facing flag is wrong; fix the registry, never the test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green on the un-implemented tree (recs_related is absent, so it is trivially not projected), which would make a
      red-before replay tautological; step 1's graduated class already pins agent_facing False.
  - step: 12
    phase: pre-deploy
    action: Stale-reference sweep -- both planning surfaces name the CLI and neither instructs recs_for_files.
    command: >-
      grep -o -m1 'scripts.recs_related' .claude/skills/planning/SKILL.md && grep -o -m1 'scripts.recs_related'
      .claude/commands/plan.md && ! grep -n 'recs_for_files' .claude/skills/planning/SKILL.md .claude/commands/plan.md
    expected: Exit 0, the CLI module printed once per file. Red before, the first grep finds nothing (exit 1).
    fix_if: A surface still instructs the interim verb, or the CLI is not named.
    hermetic: true
    graduation: graduate
    graduation_check_id: planning-surfaces-use-recs-related
    expected_literals:
      - scripts.recs_related
  - step: 13
    phase: pre-deploy
    action: The live ports contract (with SA-01) still validates.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py::test_real_contract_passes -q
    expected: Exit 0, 1 passed.
    fix_if: SA-01's shape or owning_item does not resolve (T4.24:c9 must exist).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Existing standing node, green before and after; the full tier's validate_ports_contract guards the row.
  - step: 14
    phase: pre-deploy
    action: Full validation before handoff (prose budgets, SLOC, read-engine verbs, placement, coverage, plan documents).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Any check red; fix at root cause, never raise a prose or SLOC budget (Decisions 127/128).
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      After deploy-ducklake-lambdas.yml succeeds on the merge push (Decision 125/126 governed channel; Decision 79 V3
      smoke), the live reader describes recs_related as non-agent-facing with its five params.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import DuckLakeReader as R;
      v = R().describe()['recs_related']; print(v['agent_facing'], v['params'])"
    expected: >-
      False ['files', 'near', 'terms', 'exclude_ids', 'limit']. A KeyError means the deploy has not shipped v5: check the
      workflow run; never run the local break-glass build (Decision 125).
    fix_if: Verb absent or flags wrong after a green deploy run -- RCA the packaging, never retry-loop (Decision 55).
    hermetic: false
  - step: 16
    phase: post-deploy
    action: Live CLI on the file carrying the most open recs (scripts/preflight/ci_rca_signals.py, 16 at planning time).
    command: bin/venv-python -m scripts.recs_related scripts/preflight/ci_rca_signals.py --limit 20
    expected: >-
      JSON Envelope with at most 20 hits; the first min(direct_total, 20) hits have tier direct; direct_total >= 16;
      total > returned; every hit carries a non-empty why; every channel ok (the session clone is unshallowed).
    fix_if: Unbounded, unranked or unexplained output -- RCA against step 2's SQL tests.
    hermetic: false
  - step: 17
    phase: post-deploy
    action: rec-4235 closed by the merge's Resolves trailer (closure obligation).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import DuckLakeReader as R;
      print(R().named('recs_by_ids', ids='rec-4235')[0]['status'])"
    expected: closed
    fix_if: Still open -- read the ci.yml closure job; the acceptance file must be fully hermetic.
    hermetic: false
test_obligations:
  - source: src/common/ducklake_named_reads.py
    behavior: recs_related registered with its bounded, ranked, guarded SQL; nothing else re-versioned
    verification_step: 1
    test_selector: tests/test_ducklake_named_reads.py::TestRecsRelatedVerbV5
    red_green_expectation: red before (class absent), green after
  - source: src/common/ducklake_reader_client.py
    behavior: VERB_FIELDS matches recs_related's SQL columns
    verification_step: 3
    test_selector: tests/common/ducklake_reader_client/test_verb_fields_parity.py::test_verb_fields_match_registry_sql
    red_green_expectation: red before (no VERB_FIELDS entry for a registered verb), green after
  - source: scripts/recs_related/envelope.py
    behavior: single output schema and completeness arithmetic
    verification_step: 4
    test_selector: tests/recs_related/test_envelope.py::TestEnvelope
    red_green_expectation: red before (module absent), green after
