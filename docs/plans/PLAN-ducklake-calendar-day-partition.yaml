  - step: 19
    phase: post-deploy
    action: prove the deployed EC6 probe measures one partition tuple per calendar day in the real Lambda runtime
    command: >-
      DUCKLAKE_WRITER_URL="$(bin/venv-python -c "from scripts.ops_portal.writer_transport import
