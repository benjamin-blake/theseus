    expected: prints the marker -- this branch changes no telemetry contract, storage-substrate or roadmap byte
    fix_if: a diff means this plan drifted into rec-4065's scope; revert that file
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this branch's transient diff against its merge-base, which is meaningless as a
      standing regression guard once the branch merges.
  - step: 15
    phase: pre-deploy
    action: run every touched module's mirror-home suite
    command: >-
      bin/venv-python -m pytest tests/common tests/test_ducklake_scd2_schema.py
      tests/test_ducklake_control_tables.py tests/test_schema_to_field_semantics.py
      tests/test_field_semantics_partition.py tests/lambdas tests/ducklake_neon_smoke_test
      tests/checks/ops_governance tests/checks/contracts tests/lambda_manifest
      tests/test_ducklake_facade.py -q
    expected: >-
      all pass. Baseline measured 2026-09-25 in a scratch worktree: removing the silent defaults
      alone failed 22 tests, all fixture-only (tests/fixtures/ducklake_fakes.py,
      tests/test_ducklake_scd2_schema.py, tests/common/test_ducklake_writes.py)
    fix_if: >-
      a failure naming _count_files_for_predicate means an EC6 dependent was missed (see step 8);
      a failure outside the three fixture homes that names a missing partition means a production
      caller relied on the removed default -- stop and RCA (Decision 55)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates scripts.validate's affected-set pytest selection, which already runs these suites
      in both tiers.
  - step: 16
    phase: pre-deploy
    action: run the authoritative fast presubmit tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: read the named check's own failure text; never weaken a check to obtain green (Decision 181)
    hermetic: false
    graduation: not-applicable
  - step: 17
    phase: pre-deploy
    action: run the full presubmit tier before handoff, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a completed full-tier run
    fix_if: on timeout the disposition is blocked -- resume later and rerun the full tier from the start, never commit on a partial run
    hermetic: false
    graduation: not-applicable
  - step: 18
    phase: post-deploy
    action: confirm the governed DuckLake code-deploy channel built, deployed and smoked all five Lambdas on the merge commit (Decision 79)
    command: >-
      mcp__github__actions_list for workflow deploy-ducklake-lambdas.yml on main, then
      mcp__github__get_job_logs for the run whose head_sha equals the squash-merge SHA
    expected: >-
      all five jobs conclude success -- deploy-maintenance, maintenance-smoke, reconcile-gate,
      deploy-serving, smoke -- and both deploy-record freshness asserts match the merge SHA.
      deploy-serving does not wait on maintenance-smoke, so read BOTH smoke jobs, not only the last
    fix_if: >-
      never fall back to a local build_lambda --ducklake-only --deploy (Decision 125/126); an
      ImportError means a manifest include is missing (step 9/10); a partition error means a
      deployed resolver refused a spec -- RCA it
