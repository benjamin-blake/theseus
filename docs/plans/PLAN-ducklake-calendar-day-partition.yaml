    expected: >-
      prints PARTITION OK with history_partition_tuples equal to history_calendar_days (>= 3) and
      the probed-day / probed-bucket file counts below their totals. The writer URL resolves under
      agent_platform (measured 2026-09-25)
    fix_if: >-
      tuples < days means the deployed package still carries the day() spec -- re-check step 18's
      deploy-serving job rather than deploying locally; a metadata-schema error means the
      alias-qualified partition-value read needs the META_SCHEMA-qualified form ducklake_maintenance
      uses
    hermetic: false
  - step: 20
    phase: post-deploy
    action: confirm both bundled recommendations closed on merge
    command: >-
      mcp__ducklake-reads__rec_by_id id=rec-4068, then mcp__ducklake-reads__rec_by_id
      id=rec-3808
    expected: both rows read status closed
    fix_if: >-
      an ACCEPTANCE-VERDICT refusal by the Decision 201 trailer_acceptance_gate: fix the cause,
      then use the close_proposed command printed in the trailer-closure job log -- the manual
      portal close is FORBIDDEN here (docs/contracts/git-ops.yaml resolves_trailer). Only a
      transport failure or a merge-leg refusal sanctions bin/venv-python -m
      scripts.ops_data_portal --update-rec ... --status closed; never edit the local cache
    hermetic: false
