    production tables is admin-tier and operator-invoked (Decision 126 / 143 cl.2 / 151 cl.2); the
    live ALTER + operator-directed legacy-file rewrite is rec-4070
  - Governed deploy only via deploy-ducklake-lambdas.yml (Decision 125/126); never build_lambda --ducklake-only --deploy
  - >-
