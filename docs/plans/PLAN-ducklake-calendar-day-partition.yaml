schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ducklake-calendar-day-partition"
intent: >-
  Make every DuckLake history table partition by UTC calendar day instead of day-of-month
  (rec-4068), and install the controls the plan-time RCA identified -- one shared calendar-prefix
  validator enforced at generation and at resolution for every table the DuckLake writer creates,
  a single-source contract spec, a non-blind EC6 partition probe, a real-engine conformance test
  and a pinned UTC session -- so the durable ops substrate the telemetry and executor tiers build
  on cannot silently re-acquire an engine-semantics partition defect.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-calendar-day-partition.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
scope:
  - file: src/common/ducklake_partition_spec.py
    action: Create
    purpose: >-
      pure, import-safe predicate validate_partition_spec(spec) raising PartitionSpecError (a
      ValueError): parse the top-level transform list; accept identity columns and bucket(N, col);
      accept temporal transforms (year/month/day/hour) only when, per column, they form exactly a
      calendar prefix -- year; year,month; year,month,day; year,month,day,hour -- in that order;
      reject an empty spec, an unknown transform, and any month/day/hour lacking its coarser
      components. Imports no other ducklake_* module (Decision 80 acyclic discipline)
  - file: src/common/ducklake_scd2_schema.py
    action: Modify
    purpose: >-
      MODULE-SCOPE import of validate_partition_spec (so scripts.lambda_manifest --check-bundles
      catches a missing manifest include). resolve_table_spec drops the silent
      day(created_timestamp) / bucket(8, ...) defaults: partition_transforms (smoke) and
      partition.history are required, partition.current is required iff write_mode == scd2
      (append_only tables such as ops_smoke_events resolve without one) -- a missing required key
      is a loud SchemaGateError (Decision 55). Every resolved partition string passes through
      validate_partition_spec, re-raised as SchemaGateError (runtime defense in depth before any
      ALTER). If the edit pushes the file past 500 SLOC (474 today), decompose (Decision 128)
  - file: src/common/ducklake_tables.py
    action: Modify
    purpose: >-
      correct the two stale comments that name day(created_timestamp) as the history partition
      (docstring line ~31, inline comment line ~58); no code change
  - file: src/common/ducklake_runtime.py
    action: Modify
    purpose: >-
      open_connection issues SET TimeZone='UTC' so TIMESTAMPTZ partition values are UTC calendar
      components by construction, not by the Lambda environment default (Decision 96 UTC intent;
      ICU is statically linked in duckdb 1.5.4, so it works with autoload disabled)
  - file: scripts/field_semantics_partition.py
    action: Create
    purpose: >-
      decomposition home for the generator's new partition logic (Decision 128; the generator's
      mirror test is at 479 SLOC and telemetry slice 1 also grows it): parse a contract's
      governance.partition_by 'history=<spec>; current=<spec>' (';' separates roles because the
      calendar triple contains commas) into the ops_tables partition mapping, raising on an SCD2
      contract with no parseable partition_by; and validate_emitted_partitions(doc) running
      validate_partition_spec over EVERY emitted partition (ops_tables incl. sidecar-spliced
      dormant/smoke tables, smoke tables.*.partition, partition_transforms)
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: >-
      replace the hardcoded day(created_timestamp) partition literal with the parsed
      governance.partition_by (T2.33 single-source projection) and call
      validate_emitted_partitions before emitting, so the existing --pre
      validate_field_semantics_drift gate ('generator raised') fails pre-merge on a
      non-calendar-prefix spec
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: >-
      governance.partition_by -> 'history=year(created_timestamp), month(created_timestamp),
      day(created_timestamp); current=bucket(8, id)'; the created_timestamp semantics sentence that
      says 'Partitions the history table via day(created_timestamp)' names the triple, with a
      FIELD-level created_timestamp amendment_log entry (change_class prose_improvement,
      semantic_break false -- the field's meaning is unchanged; validate_contract_drift category 6);
      plus a contract-level amendment_log entry recording the governance.partition_by change
  - file: docs/contracts/ops_decisions.yaml
    action: Modify
    purpose: >-
      governance.partition_by correction plus a contract-level amendment_log entry (its
      created_timestamp semantics do not name day(), so no field-level entry is needed)
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      smoke tables.history.partition, fields.created_timestamp.partition_role,
      partition_transforms.history, and the history partitions of the dormant (ops_priority_queue,
      ops_execution_plans) and smoke_ops_tables (ops_smoke_events) blocks -> the calendar-day
      triple; the created_timestamp verified_by probe text names a cross-month case
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: regenerated projection only -- run scripts.schema_to_field_semantics, never hand-edit (T2.29:c8)
  - file: src/lambdas/ducklake_writer/smoke_actions.py
    action: Modify
    purpose: >-
      EC6 partition_probe writes rows whose created_timestamp values share ONE day-of-month across
      a month boundary AND a year boundary (e.g. 2026-01-24, 2026-02-24, 2027-01-24), reads each
      live history/current file's partition values from
      __ducklake_metadata_<CATALOG_ALIAS>.ducklake_file_partition_value (alias-qualified reads of
      that schema work on the Neon catalog -- measured 2026-09-25 through the deployed reader), and
      reports LAYOUT measurements: history_calendar_days, history_partition_tuples,
      history_files_in_probed_day, history_total, current_files_in_probed_bucket, current_total.
      These are metadata-derived layout facts, not engine-pruning evidence, and are named as such.
      Deletes _count_files_for_predicate (its ducklake_list_files predicate always raised and fell
      back to comparing a ROW count to a FILE count) and the hardcoded current_partitions_scanned
  - file: src/lambdas/ducklake_writer/handler.py
    action: Modify
    purpose: >-
      drop the _count_files_for_predicate re-export (line ~31) -- deleting the helper without it
      fails the writer Lambda at import; re-export the new metadata helper only if a test needs it
  - file: scripts/ducklake_smoke/lambda_ec_gates.py
    action: Modify
    purpose: >-
      lambda_partition's discriminating assertion is history_partition_tuples ==
      history_calendar_days >= 3, plus history_files_in_probed_day < history_total and
      current_files_in_probed_bucket < current_total; its OK line prints the measured values
  - file: src/lambdas/ducklake_writer/manifest.yaml
    action: Modify
    purpose: add src/common/ducklake_partition_spec.py to includes (Decision 79 -- includes are explicit, no transitive resolution)
  - file: src/lambdas/ducklake_reader/manifest.yaml
    action: Modify
    purpose: add src/common/ducklake_partition_spec.py to includes
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: add src/common/ducklake_partition_spec.py to includes
  - file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
    action: Modify
    purpose: add src/common/ducklake_partition_spec.py to includes
  - file: src/lambdas/ducklake_catalog_dr/manifest.yaml
    action: Modify
    purpose: add src/common/ducklake_partition_spec.py to includes
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      add src/common/ducklake_partition_spec.py to excludes, beside the existing ducklake_* excludes,
      so the wildcard src/ include does not drag DuckLake runtime code into data-pipeline.zip or mark
      data-pipeline affected
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      rule partition-every-table declares the grain for time partitions ('one partition per UTC
      calendar day of the table's creation/event column'), the DuckLake calendar-prefix spelling
      (year(c), month(c), day(c)), and the engine false-friend rule (partition transform names do
      not port between engines -- Iceberg day() is days-since-epoch, DuckLake day() is
      day-of-month; verify a partition spec against the pinned engine, not by name);
      design_time_walk step 6 names grain + pinned-engine verification; amendment_log entry
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      dated trailing-bracket amendments (amendment_forms, Decision 177 dialect; no new number,
      source = operator direction confirming this plan, Decision 151 provenance), EACH carrying the
      literal 'year(created_timestamp), month(created_timestamp), day(created_timestamp)' that VP
      step 13 asserts: on Decision 137 -- CD.9's day() was an Iceberg-v2 days-since-epoch
      transform, on DuckLake the same token is day-of-month, the DuckLake realization is that
      literal (created_timestamp, the column Decision 81 cl.7 and the live catalog use, reconciling
      the body's last_updated_timestamp), enforced by src/common/ducklake_partition_spec.py, live
      remediation rec-4070; on Decision 81 -- cl.7's 'day(created_timestamp)' and its
      Capability-basis 'day() transform verified' were verified only on single-month data; the
      corrected spelling is that literal. docs/decisions-index.json regenerates as the sanctioned
      decisions_index_regeneration companion
  - file: tests/common/test_ducklake_partition_spec.py
    action: Create
    purpose: >-
      predicate cases -- green: the calendar triple, year only, year+month, the full quad,
      bucket(8, id), identity counter_name, a bucket mixed with a calendar prefix; red: day() alone,
      month() alone, hour() alone, month+day without year, day before month, a prefix split across
      two columns, empty spec, unknown transform
  - file: tests/test_field_semantics_partition.py
    action: Create
    purpose: >-
      mirror test for scripts/field_semantics_partition.py -- test_partition_derived_from_contract_governance
      (a changed partition_by flows into the generated ops_tables partition),
      test_generate_rejects_day_of_month_partition (a day(created_timestamp) spec makes generate()
      raise), parse edge cases (missing role, missing partition_by on an SCD2 contract)
  - file: tests/common/test_ducklake_partition_conformance.py
    action: Create
    purpose: >-
      integration-marked real-DuckLake conformance (local catalog attached as ops_catalog, extension
      version from pinned_duckdb_version(), Decision 99): for every table in the generated
      projection plus the smoke pair, create via the real create_scd2_tables / create_control_table,
      insert rows sharing a day-of-month across month and year boundaries, run
      ducklake_merge_adjacent_files, and assert every live file holds exactly one UTC calendar day;
      test_create_control_table_repeated_call_is_idempotent (rec-3808 acceptance name) and the
      scd2 twin assert a repeated non-force create raises nothing and leaves one active
      partition_info row
  - file: tests/common/test_ducklake_tables.py
    action: Modify
    purpose: >-
      add rec-4068's acceptance test_history_partition_is_calendar_day_triple (hermetic: FakeCon +
      the committed projection, no integration marker, no extension -- Decision 201 closure-time
      evaluator); retarget test_create_scd2_tables_applies_partitions, which asserts the defective
      'SET PARTITIONED BY (day(created_timestamp))' verbatim
  - file: tests/test_ducklake_scd2_schema.py
    action: Modify
    purpose: >-
      add test_resolve_table_spec_refuses_missing_or_non_calendar_partition (incl. an append_only
      table resolving with no current partition); give the synthetic fixtures that relied on the
      removed default an explicit partition block and move the line ~434 fixture to the triple
  - file: tests/fixtures/ducklake_fakes.py
    action: Modify
    purpose: >-
      the shared _SEMANTICS fixture gains an explicit partition_transforms block (the triple +
      bucket(8, rec_id)) -- it relied on the silent default being removed
  - file: tests/common/test_ducklake_writes.py
    action: Modify
    purpose: _APPEND_ONLY_RT_SEMANTICS fixture (line ~508) moves from day(created_timestamp) to the triple
  - file: tests/common/test_ducklake_runtime.py
    action: Modify
    purpose: add test_open_connection_pins_utc_timezone
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: >-
      test_partition_synthesized's 'day(created_timestamp)' expectation moves to the triple -- an
      in-place edit only; new generator tests live in tests/test_field_semantics_partition.py
      (this file is 479 SLOC)
  - file: tests/lambdas/ducklake_writer/handler/test_envelope_dispatch.py
    action: Modify
    purpose: >-
      add test_handler_partition_probe_measures_calendar_day_tuples; retarget
      test_handler_partition_probe off the deleted _count_files_for_predicate patch
  - file: tests/lambdas/ducklake_writer/handler/test_metadata_helpers.py
    action: Modify
    purpose: >-
      delete the two _count_files_for_predicate tests (lines ~77-97) with the helper; cover the new
      partition-value metadata helper (success + a metadata read that raises fails loud, never 0)
  - file: tests/test_ducklake_facade.py
    action: Modify
    purpose: >-
      drop _count_files_for_predicate from the handler re-export roster (line ~136) and retarget the
      partition_probe patch-propagation test (lines ~277-282) onto the new helper
  - file: tests/ducklake_neon_smoke_test/test_lambda_ec_gates.py
    action: Modify
    purpose: >-
      add test_lambda_partition_fails_on_collapsed_calendar_days (tuples < calendar days -> FAIL);
      move the existing ok/fail fixtures onto the measured fields
bundled_recommendations: ["rec-4068", "rec-3808"]
followon_recs: ["rec-4070", "rec-4071", "rec-4072", "rec-4073"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    every history partition in the generated field_semantics.yaml (smoke pair, ops_recommendations,
    ops_decisions, ops_priority_queue, ops_execution_plans, ops_smoke_events) is exactly
    year(created_timestamp), month(created_timestamp), day(created_timestamp); current partitions
    stay bucket(8, <merge_key>) and ops_entity_counters stays identity on counter_name
  - >-
    the generator derives contract-backed partitions from governance.partition_by, and generating
    with any non-calendar-prefix temporal spec (day() alone, month() alone) raises, so the existing
    --pre validate_field_semantics_drift gate refuses it pre-merge
  - resolve_table_spec raises SchemaGateError on a missing or non-calendar-prefix partition instead of defaulting
  - every DuckLake session opened by open_connection runs with TimeZone UTC
  - >-
    the new predicate module ships in all five DuckLake bundles and data-pipeline is not affected by
    it; the retired EC6 helpers leave no reference in src, scripts or tests
  - >-
    on a real DuckLake engine, rows sharing a day-of-month across month and year boundaries stay in
    distinct partitions through ducklake_merge_adjacent_files for every declared table, and a
    repeated non-force create is idempotent (rec-3808)
  - >-
    the deployed EC6 writer probe reports, in the real Lambda runtime, one measured partition tuple
    per calendar day across a month and a year boundary, with no hardcoded field
  - >-
    data-modeling-standard.yaml and Decisions 137/81 state the calendar-day grain, the DuckLake
    spelling and the engine false-friend lesson; no telemetry contract or ROADMAP entry is edited
  - rec-4068 and rec-3808 close on merge
verification_plan:
  - step: 1
    phase: pre-deploy
    action: prove the calendar-prefix predicate accepts only calendar prefixes
    command: bin/venv-python -m pytest tests/common/test_ducklake_partition_spec.py -q
    expected: every green and red case passes; day() alone and month() alone are rejected
    fix_if: >-
      a red case passes -- the parser is matching transform names without checking per-column
      order and coarser-component presence
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-spec-calendar-prefix
  - step: 2
    phase: pre-deploy
    action: prove every resolved history spec is the calendar triple and the resolver refuses missing or day-of-month specs
    command: >-
      bin/venv-python -m pytest
      tests/common/test_ducklake_tables.py::test_history_partition_is_calendar_day_triple
      tests/test_ducklake_scd2_schema.py::test_resolve_table_spec_refuses_missing_or_non_calendar_partition
      -q
    expected: both tests pass; create_scd2_tables issues SET PARTITIONED BY with the triple for every history table
    fix_if: >-
      the triple test fails -- field_semantics.yaml was not regenerated after the sidecar/contract
      edit; the refusal test fails -- a silent default survived in resolve_table_spec
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-history-partition-calendar-day-triple
  - step: 3
    phase: pre-deploy
    action: prove the generator derives partitions from the contract and refuses a day-of-month spec
    command: bin/venv-python -m pytest tests/test_field_semantics_partition.py -q
    expected: >-
      all pass, including test_partition_derived_from_contract_governance and
      test_generate_rejects_day_of_month_partition
    fix_if: >-
      the derivation test fails -- the generator still carries its own literal; the rejection
      test fails -- validate_emitted_partitions is not run over every emitted partition
    hermetic: false
    graduation: graduate
    graduation_check_id: field-semantics-generator-partition-from-contract
  - step: 4
    phase: pre-deploy
    action: prove the committed projection carries the calendar triple on all seven history partition sites
    command: >-
      bin/venv-python -c "import yaml;
      d=yaml.safe_load(open('config/lambda/ducklake/field_semantics.yaml', encoding='utf-8'));
      T='year(created_timestamp), month(created_timestamp), day(created_timestamp)';
      hs=[d['partition_transforms']['history'], d['tables']['history']['partition']]+[v['partition']['history'] for v in d['ops_tables'].values() if 'history' in v.get('partition', {})];
      bad=[h for h in hs if h != T]; assert not bad, bad;
      print('HISTORY_CALENDAR_DAY', len(hs))"
    expected: >-
      prints the marker with count 7 (smoke partition_transforms + smoke tables.history + five
      ops_tables history entries). Measured red on the planning tree 2026-09-25: AssertionError
      listing seven day(created_timestamp) entries
    fix_if: a listed entry still reads day(created_timestamp) -- its sidecar or contract source was missed
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-projection-history-calendar-day
    expected_literals: ["HISTORY_CALENDAR_DAY 7"]
  - step: 5
    phase: pre-deploy
    action: confirm the generated projection matches its sources after regeneration
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0 -- no drift and the generator raised nothing
    fix_if: drift means field_semantics.yaml was hand-edited; a raise names the non-calendar-prefix spec
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already registered as validate_field_semantics_drift in both validate tiers and green on the
      un-implemented tree by construction, so it cannot serve as a red-before graduate step and
      would duplicate the existing check.
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: prove every DuckLake session is pinned to UTC
    command: bin/venv-python -m pytest tests/common/test_ducklake_runtime.py::test_open_connection_pins_utc_timezone -q
    expected: the test passes; open_connection issues SET TimeZone='UTC' before any partitioned write
    fix_if: the SET is missing or issued after ATTACH-time writes could occur
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-session-utc-timezone
  - step: 7
    phase: pre-deploy
    action: prove the EC6 probe and its smoke gate measure calendar-day partitions instead of asserting constants
    command: >-
      bin/venv-python -m pytest
      tests/lambdas/ducklake_writer/handler/test_envelope_dispatch.py::test_handler_partition_probe_measures_calendar_day_tuples
      tests/ducklake_neon_smoke_test/test_lambda_ec_gates.py::test_lambda_partition_fails_on_collapsed_calendar_days
      -q
    expected: both pass -- the probe response carries measured tuples/days, and the gate fails when tuples collapse
    fix_if: >-
      the gate passes on collapsed tuples -- lambda_partition still keys off a removed constant
      or the row-vs-file comparison
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-ec6-probe-measures-calendar-days
  - step: 8
    phase: pre-deploy
    action: sweep the retired EC6 helpers and the silent default literal out of every live surface
    command: &step8_sweep >-
      bash -c "! grep -rn --include='*.py' -e '_count_files_for_predicate' -e 'current_partitions_scanned'
      src scripts tests && ! grep -rn --include='*.py' -F '\"day(created_timestamp)\"' src scripts"
    expected: >-
      exit 0 with no output. Red on the planning tree: smoke_actions.py, handler.py,
      lambda_ec_gates.py and four test files still carry the helper/constant, and
      ducklake_scd2_schema.py / schema_to_field_semantics.py carry the quoted default literal.
      Tests are excluded from the second grep because refusal tests legitimately quote the bad spec
    fix_if: a hit names the surface still carrying a retired name -- delete it rather than aliasing it
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-ec6-tautology-helpers-retired
    expected_literals: []
  - step: 9
    phase: pre-deploy
    action: prove the new module ships in all five DuckLake bundles and data-pipeline is unaffected by it
    command: &step9_bundles >-
      bin/venv-python -c "from scripts.lambda_manifest import compute_affected_artifacts as c;
      a=c(['src/common/ducklake_partition_spec.py']);
      assert 'data-pipeline' not in a and {'ducklake_writer','ducklake_reader','ducklake_maintenance','ducklake_maintenance_smoke','ducklake_catalog_dr'} <= set(a), a;
      print('PARTITION_SPEC_BUNDLED', len(a))"
    expected: >-
      prints the marker with count 5. Measured red on the planning tree 2026-09-25: AssertionError
      showing only data-pipeline affected (via its wildcard src/ include)
    fix_if: data-pipeline listed -- its excludes entry is missing; a DuckLake artifact missing -- its includes entry is missing
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-spec-bundled
    expected_literals: ["PARTITION_SPEC_BUNDLED 5"]
  - step: 10
    phase: pre-deploy
    action: stage every Lambda bundle and prove each handler's import graph resolves with the new module
    command: bin/venv-python -m scripts.lambda_manifest --check-bundles
    expected: every artifact reports OK handlers import-resolved, assets present (1.3s locally, 2026-09-25)
    fix_if: an ImportError naming ducklake_partition_spec means a manifest include is missing -- never import it function-locally to dodge the check
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green on the un-implemented tree and already enforced as validate_lambda_bundle_completeness
      in the full tier, so a registry row would duplicate that check.
    expected_literals: []
  - step: 11
    phase: pre-deploy
    action: prove the declared specs behave as calendar days on the pinned real engine
    command: bin/venv-python -m pytest tests/common/test_ducklake_partition_conformance.py -m integration -q -rs
    expected: >-
      every test passes with zero skips, including
      test_create_control_table_repeated_call_is_idempotent. The ducklake extension downloads over
      the network in CC-web (measured 2026-09-25: INSTALL ducklake succeeded, version d318a545)
    fix_if: >-
      a skip means the extension did not load -- resolve that before claiming the step (a skip is
      not a pass); a failure naming a table means its declared spec collapses distinct days
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Integration-marked: CI deselects integration tests and blocks sockets until rec-4071
      provisions the pinned extension, so a registry row today would be a permanently skipped guard.
  - step: 12
    phase: pre-deploy
    action: confirm rec-3808's own acceptance oracle holds
    command: grep -rl 'def test_create_control_table_repeated_call_is_idempotent' tests/ --include='*.py' | grep -q .
    expected: exit 0 -- the named real-connection idempotency test exists
    fix_if: the conformance test used a different name; rename it to the rec's acceptance name
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is rec-3808's own stored acceptance command, which the Decision 201 closure-time gate
      already evaluates on the Resolves trailer; graduating it would duplicate that evaluation.
    expected_literals: []
  - step: 13
    phase: pre-deploy
    action: prove the contracts, the modeling standard and Decisions 137/81 state the calendar-day rule
    command: &step13_docs_check >-
      bin/venv-python -c "import yaml;
      T='year(created_timestamp), month(created_timestamp), day(created_timestamp)';
      pb=[yaml.safe_load(open('docs/contracts/'+c+'.yaml', encoding='utf-8'))['governance']['partition_by'] for c in ('ops_recommendations','ops_decisions')];
      assert all(p.startswith('history='+T+';') for p in pb), pb;
      dm=yaml.safe_load(open('docs/contracts/data-modeling-standard.yaml', encoding='utf-8'));
      st=[r['statement'] for r in dm['rules'] if r['id']=='partition-every-table'][0];
      assert 'calendar day' in st and 'year(' in st and 'day-of-month' in st, st;
      dec=open('docs/DECISIONS.md', encoding='utf-8').read();
      secs=[dec.split(h,1)[1].split(chr(10)+'## Decision ',1)[0] for h in ('## Decision 137:','## Decision 81:')];
      assert all(T in s for s in secs), 'Decision 137/81 annotation missing';
      print('PARTITION_DOCS_CALENDAR_DAY')"
    expected: prints the marker after the contract, standard and decision assertions all hold
    fix_if: a failing assertion names the surface still carrying the day-of-month spelling
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-docs-calendar-day
    expected_literals: []
  - step: 14
    phase: pre-deploy
    action: prove the telemetry contracts and the roadmap are untouched by this branch (T2.36:c1 stays with telemetry slice 1 / rec-4065)
    command: >-
      git diff --quiet "$(git merge-base HEAD origin/main)" -- 'docs/contracts/telemetry*'
