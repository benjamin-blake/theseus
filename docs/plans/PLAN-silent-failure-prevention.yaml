schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: silent-failure-prevention
intent: >-
  Stop the three gaps that hid rec-4589 for two months. (1) No silent success: recording CLI modes that can skip or
  fail while exiting 0 print a STATUS v1 line (PLAN-retire-session-cli's grammar and parser), so the capture records a
  skip as a skip; a roster and a fast-tier check keep the emitters honest. First roster: ops portal --file-rec (its
  ci_rca dedup and stale-rerun paths return an existing id with exit 0, indistinguishable from a fresh filing) and
  --update-rec, postflight --metrics (returns 0 when its child steps fail) and postflight --evidence. (2) Rec hygiene:
  never append unrelated work to an existing rec, a rec's file is the surface its acceptance checks, and followon_recs
  defers to an existing rec only when that rec's acceptance fails while the work is undone -- authored in the
  contracts, served through get_rec_write_guidance, pinned by a parity test. (3) Deleting a writer disposes of every
  caller: tier-item-lifecycle's replacement closure check, the planning skill and plan-critique 12k require each caller
  of a deleted writer to be removed, rewired or made to fail loudly. Bundles rec-3875 (the portal's cli.py exits 0
  silently under python -m). Exit codes and stdout contracts do not change; nothing deploys.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-silent-failure-prevention.yaml
phase: >-
  Defect prevention for rec-4589 (dead session CLI that reported success), together with
  PLAN-telemetry-field-realization; PLAN-retire-session-cli (rec-4589 plan 1) builds first and owns the STATUS v1
  grammar, formatter, parser and writer deploy. Feeds T3.20 (agent-turn telemetry capture) with status rows but closes
  no criterion: no open T3.20 criterion names CLI status reporting, so closes_criteria is deliberately empty.
closes_criteria: []
scope:
- file: scripts/status_line.py
  action: Create
  purpose: >-
    emit_status(source, result, reason=None) -> None, the one emitter helper: deferred-imports
    src.turn_capture.markers (the scripts/checks/validation_result.py precedent), builds the line with
    format_status_marker and prints it as one whole line to sys.stderr, flushed. stderr, not stdout, so the --file-rec
    rec-id line and the --metrics JSON stay the only stdout content (tests parse them); a Claude Code Bash tool_result's
    content carries stderr after stdout, which is what the v6 parser scans (last 200 lines of a repo-CLI command).
    Raises nothing the formatter does not (a bad literal is a bug the roster check catches first).
- file: tests/test_status_line.py
  action: Create
  purpose: >-
    emit_status writes exactly one line to stderr and nothing to stdout; the line parses back through
    markers.parse_markers to Marker("status", "<source>.<result>", ..., result=<result>) for done, skipped and failed,
    with and without reason.
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: >-
    file_rec's body moves into file_rec_with_outcome(fields, profile=None, _migration_int_id=None, _skip_sync=False,
    context_v2_json=None) -> FileRecOutcome; file_rec keeps its exact signature and returns .rec_id, so its 30-odd
    callers and every patch site are unchanged (both stay facade-defined, Decision 124 patch-epicentre). The open-dedup
    branch returns FileRecOutcome(existing_id, inserted=False, reason="ci_rca_open_duplicate"), the closed-head drop
    branch FileRecOutcome(head.rec_id, inserted=False, reason="ci_rca_stale_rerun"), the insert FileRecOutcome(rec_id,
    inserted=True, reason=None). Stays at or under 500 SLOC (480 at main 2850f7be; no budget raise, decompose if it
    crosses).
- file: scripts/ops_portal/_common.py
  action: Modify
  purpose: FileRecOutcome NamedTuple (rec_id str, inserted bool, reason str | None), re-exported by the facade.
- file: scripts/ops_portal/cli.py
  action: Modify
  purpose: >-
    --file-rec calls file_rec_with_outcome and, after printing the rec id (unchanged), emits ops_portal.file_rec done
    when inserted, skipped with the outcome's reason when not; missing required fields and the
    ValidationError/ValueError path emit failed (reason missing_required or invalid_fields) and keep exit 1.
    --update-rec emits ops_portal.update_rec done after its confirmation line, failed (invalid_update) on the
    rejected-flag, no-field and ValidationError/ValueError paths, exit codes unchanged. rec-3875: add
    `if __name__ == "__main__": sys.exit(main())` so python -m scripts.ops_portal.cli is the CLI, not a silent no-op.
- file: tests/ops_data_portal/test_cli_status_lines.py
  action: Create
  purpose: >-
    Through main() with the existing patch points (_ducklake_write, find_open_ci_rca_rec_by_fingerprint,
    closed_head_of_chain): an insert emits done; an open fingerprint match emits skipped reason=ci_rca_open_duplicate
    and the stale-rerun drop skipped reason=ci_rca_stale_rerun; invalid fields and missing required fields emit failed
    with exit 1; --update-rec done and failed; in every case stdout is byte-identical to today's (the rec id line or the
    confirmation line). test_emitted_lines_parse_as_status_markers feeds the captured stderr through
    markers.parse_markers.
- file: tests/ops_data_portal/test_cli.py
  action: Modify
  purpose: test_cli_module_runs_under_python_m (rec-3875) -- a subprocess run of python -m scripts.ops_portal.cli --help exits 0 and prints usage.
- file: tests/test_ops_portal_facade.py
  action: Modify
  purpose: _REQUIRED_PUBLIC gains file_rec_with_outcome and FileRecOutcome.
- file: scripts/postflight/housekeeping.py
  action: Modify
  purpose: >-
    run_metrics emits postflight.metrics done when both child steps exit 0, else failed with reason
    metrics_exit_nonzero or plan_audit_exit_nonzero (the first failing child), after printing its JSON; it still
    returns 0 and its stdout is still exactly the JSON (exit code unchanged by design: --auto chains on it). --auto
    inherits the line because it redirects only stdout.
- file: scripts/session/postflight.py
  action: Modify
  purpose: >-
    --evidence emits postflight.evidence done after write and render, and failed (invalid_evidence) before re-raising
    when the file is unreadable, not JSON, or postflight_evidence.validate refuses it (exit stays non-zero).
- file: tests/session/postflight/test_status_lines.py
  action: Create
  purpose: >-
    run_metrics: done when both children exit 0, failed with the right reason when either exits non-zero, return 0 and
    json.loads(stdout) succeeds in all three; --evidence done on a valid file, failed plus a raised error on an invalid
    one; --auto's captured stderr carries the metrics line.
- file: config/telemetry/status_sources.yaml
  action: Create
  purpose: >-
    The emitter roster, one row per source: ops_portal.file_rec, ops_portal.update_rec, postflight.metrics,
    postflight.evidence, each with module (repo path), command (the documented invocation, e.g. "bin/venv-python -m
    scripts.ops_data_portal --file-rec") and results (the subset it emits). Header names the residual owner rec-4602
    (recording CLIs not yet listed).
- file: scripts/checks/hygiene/validate_status_line_emitters.py
  action: Create
  purpose: >-
    Registered fast-tier check (Decision 169 manifest, Decision 170 registry.examined(n, unit="status sources")). Pure
    function emitter_errors(roster, modules) over parsed inputs; the wrapper reads the roster and AST-parses every .py
    under scripts/, src/ and .claude/hooks/. Rules: E1 each source fullmatches markers.SIGNATURE_PATTERN and is at most
    markers.STATUS_SOURCE_MAX characters; E2 results are a non-empty subset of markers.STATUS_RESULTS; E3 each row's
    module exists and calls emit_status with that literal source once per declared result (literal result argument),
    and every reason literal fullmatches the signature class; E4 every emit_status call anywhere uses literal source
    and result arguments and names a source the roster assigns to that module; E5 each command contains one of
    markers.STATUS_COMMAND_TOKENS, so the v6 parser scans it; E6 only src/turn_capture/markers.py and
    scripts/status_line.py call format_status_marker or hold the literal "STATUS v1". Each error names source and file.
    Imports PyYAML, ast and the markers constants (deferred); under 500 SLOC.
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: >-
    Entry validate_status_line_emitters, pre=True, pre_globs: config/telemetry/status_sources.yaml, scripts/**/*.py,
    src/**/*.py, .claude/hooks/**; full_segment beside validate_subprocess_encoding.
- file: tests/checks/hygiene/test__manifest.py
  action: Modify
  purpose: TestStatusLineEmittersRegistered -- dispatched in pre and full; pre_globs include the roster and scripts/**/*.py.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: "validate_status_line_emitters: code_regression (an emitter or roster drifted, like validate_subprocess_encoding)."
- file: tests/checks/hygiene/test_validate_status_line_emitters.py
  action: Create
  purpose: >-
    test_each_rule_fails_closed, parametrised over a planted defect per rule E1-E6 (each asserting its own error);
    test_clean_synthetic_roster_passes; test_live_repository_passes (the real roster and tree yield no errors).
- file: tests/turn_capture/test_status_events.py
  action: Modify
  purpose: >-
    SANCTIONED ASSERTION CHANGE (planned in PLAN-retire-session-cli, which created the guard for this hand-off):
    test_no_status_emitter_outside_markers allows exactly src/turn_capture/markers.py and scripts/status_line.py to call
    format_status_marker or hold "STATUS v1"; every other file still fails it. The property (one formatting home per
    side of the boundary) is unchanged; rule E6 restates it in the registered check.
- file: config/agent/verification_registry/entries/status-line-emitters.yaml
  action: Create
  purpose: Graduated shard for VP step 5 (test_selector, guard_target the new check, guard_symbol emitter_errors).
- file: config/agent/verification_registry/entries/status-line-cli-emitters.yaml
  action: Create
  purpose: Graduated shard for VP step 3 (test_selector tests/ops_data_portal/test_cli_status_lines.py, guard_target scripts/ops_portal/cli.py, guard_symbol main).
- file: config/agent/verification_registry/entries/status-line-postflight-emitters.yaml
  action: Create
  purpose: Graduated shard for VP step 4 (test_selector tests/session/postflight/test_status_lines.py, guard_target scripts/postflight/housekeeping.py, guard_symbol run_metrics).
- file: config/agent/verification_registry/entries/rec-hygiene-rules-served.yaml
  action: Create
  purpose: Graduated shard for VP step 7 (test_selector tests/test_rec_hygiene_rules.py, guard_target config/agent/data_quality/ops.yaml).
- file: config/agent/verification_registry/entries/deleted-writer-caller-disposition.yaml
  action: Create
  purpose: Graduated shard for VP step 8 (test_selector on the new anti-drift node, guard_target docs/contracts/tier-item-lifecycle.yaml).
- file: docs/contracts/ops_recommendations.yaml
  action: Modify
  purpose: >-
    Class A (Benjamin's word). Authored home of two rules, as field governance_notes (not semantics, so no category-6
    redefinition and no writer projection; the rules are composition guidance, not a stored-value meaning). file gains:
    "file names the surface the acceptance probe checks (the file whose change makes acceptance pass), so file-keyed
    discovery (recs_for_files) returns the rec; acceptance that never touches file means the rec is mis-keyed."
    context gains: "Never append unrelated work to an existing rec (a rider): file a new rec and name the first in
    dependencies. A context change through update_rec refines the rec's own problem only." Each field gets one
    flow-form governance_note_add amendment entry. Budget 556 effective lines, 552 at main: compact file's 2026-10-04
    block-form entry to one flow line first, then measure; never a raise.
- file: config/agent/data_quality/ops.yaml
  action: Modify
  purpose: >-
    Served copy (Decision 65: contract authored, ops.yaml served): file and context semantics each append the same rule
    sentence, so get_rec_write_guidance() returns it before composition (Decision 66). Single-line strings, no line growth.
- file: docs/contracts/exit-criteria-ledger.yaml
  action: Modify
  purpose: >-
    plan_followon_recs governance_notes gains: "Naming an EXISTING rec defers to it only when that rec's acceptance
    fails while the deferred work is undone; otherwise file a new follow-on rec (no riders,
    ops_recommendations.yaml context)." The Decision 181 line names rec-4603 for the unmechanised arm beside rec-3524.
    One contract-level flow-form amendment entry.
- file: tests/test_rec_hygiene_rules.py
  action: Create
  purpose: >-
    Parity: each rule sentence (two module constants) appears, whitespace-normalised, in the contract field's
    governance_notes and in get_rec_write_guidance()["<field>"]["semantics"]; the ledger rule appears in
    plan_followon_recs governance_notes. Red before (sentences absent).
- file: docs/contracts/tier-item-lifecycle.yaml
  action: Modify
  purpose: >-
    replacement_closure_check gains step (5), Dispose of every caller: whenever the plan deletes or retires a writer
    (a function, CLI mode or flag that records state), whatever the tier_item's name, list every caller, flag, command
    or skill step, docstring and test that names it, and verify each is removed, rewired to the replacement, or fails
    loudly (non-zero exit naming the retirement). A stub that keeps the old name and its success output is a FAIL. The
    Decision 181 line: mechanised detection is rec-4604's. One flow-form amendment entry (Class D mechanism contract).
- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    Closure obligation trigger 2 adds: the plan lists every caller of a deleted writer as removed, rewired or
    fail-loud; a stub keeping the old name and success output fails. About +180 bytes against 857 headroom.
- file: .claude/skills/plan-critique/SKILL.md
  action: Modify
  purpose: >-
    12k trigger 2's Required line becomes "- Required: a VP step proving the old surface dead; for a deleted writer,
    each caller disposed per `tier-item-lifecycle.yaml#replacement_closure_check` (5)." (156 bytes replacing 165; the
    file sits at its zero-headroom budget, so the edit must be net non-positive). The REVISE message names callers.
- file: .claude/skills/code-review/SKILL.md
  action: Modify
  purpose: >-
    Dimension 10 gains "- **Deleted writer**: callers disposed per `replacement_closure_check` (5)". Paid for by
    replacing the file's 54 em dashes with ASCII hyphens (AGENTS.md style rule; 2 bytes each), so the file stays under
    its 12609 budget with no raise.
- file: tests/test_workflow_skill_antidrift.py
  action: Modify
  purpose: >-
    test_closure_obligation_requires_caller_disposition: replacement_closure_check carries step (5) with "fails loudly"
    and "stub"; planning's trigger 2 and plan-critique's 12k section name the caller disposition; code-review names
    replacement_closure_check. Existing 12k pins are untouched.
bundled_recommendations: [rec-3875]
followon_recs: [rec-4602, rec-4603, rec-4604, rec-4605]
infrastructure_dependencies:
  - >-
    FREEZE: nothing in this plan builds, pushes or merges until Benjamin says the repository transfer freeze is over
    (memory PAUSE, 2026-10-20). The build then rebases onto the renamed repository's main.
  - >-
    Release order: this build merges only after PLAN-retire-session-cli has merged and its deploy verification is green
    (the writer accepts status:<source>.<result> process events). Before that, a status row would be refused and halt
    the session's capture (runner.py writes halt.json on writer_refused).
  - >-
    No Lambda-packaged file, Terraform or IAM change: compute_affected_artifacts over scope is empty (scripts/, tests/,
    config/telemetry, config/agent, .claude/skills and docs/contracts are not packaged), and field_semantics.yaml is
    untouched (ops_recommendations governance_notes do not project; VP 9).
acceptance_criteria:
  - >-
    Every roster CLI mode reports its outcome: --file-rec prints done for an insert and skipped with
    ci_rca_open_duplicate or ci_rca_stale_rerun when it returns an existing id; --update-rec, postflight --metrics and
    --evidence print done or failed; each line parses through the v6 parser's markers.parse_markers as a status marker;
    stdout and exit codes are byte- and value-identical to today's.
  - >-
    validate_status_line_emitters is registered in both tiers, fails with a source- and file-naming error for each of
    E1-E6, and passes on the real tree; the roster names its residual owner rec-4602.
  - >-
    The two rec rules are authored in docs/contracts/ops_recommendations.yaml and served verbatim by
    get_rec_write_guidance(); the followon_recs rule is in exit-criteria-ledger.yaml; the parity test proves both.
  - >-
    replacement_closure_check step (5), the planning trigger, plan-critique 12k and the code-review pointer require
    caller disposition for a deleted writer, pinned by an anti-drift node; no prose, SLOC or structural budget is
    raised.
  - rec-3875 -- python -m scripts.ops_portal.cli --help prints usage, and rec-3875 is closed on merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition: PLAN-retire-session-cli is merged with the grammar this plan builds on, this branch is rebased, and
      the freeze is lifted. Its deploy verification being green is confirmed with the coordinator before the merge
      (not checkable from the tree).
    command: >-
      git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && grep -q "def
      format_status_marker" src/turn_capture/markers.py && grep -q "STATUS_SOURCE_MAX" src/turn_capture/markers.py &&
      grep -q "STATUS_COMMAND_TOKENS" src/turn_capture/markers.py && test -f tests/turn_capture/test_status_events.py &&
      echo PRECONDITION_OK
    expected: PRECONDITION_OK.
    fix_if: Main moved -- rebase. A missing symbol or file means the sibling has not merged -- stop and wait for the coordinator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A sequencing precondition on a sibling plan's merge, not a behaviour of this change; as a standing guard it would
      only re-assert that another plan landed.
  - step: 2
    phase: pre-deploy
    action: emit_status writes one parseable whole line to stderr and nothing to stdout.
    command: bin/venv-python -m pytest tests/test_status_line.py -q
    expected: Every node passes. Red before (scripts/status_line.py absent).
    fix_if: A line on stdout, two lines, or a parse mismatch is a helper bug.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Every roster emitter goes through this helper, and the graduated step 3 and 4 nodes parse the helper's real
      output through markers.parse_markers, so a helper regression reddens those standing guards.
  - step: 3
    phase: pre-deploy
    action: >-
      The portal emits done, skipped (both reasons) and failed on the right paths, stdout and exit codes unchanged, and
      the lines parse as status markers.
    command: bin/venv-python -m pytest tests/ops_data_portal/test_cli_status_lines.py -q
    expected: Every node passes. Red before (no STATUS line is emitted; file_rec_with_outcome absent).
    fix_if: A dedup path reporting done means file_rec_with_outcome lost the branch's outcome; a stdout diff means the line went to stdout.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: status-line-cli-emitters
  - step: 4
    phase: pre-deploy
    action: postflight --metrics reports failed when a child step fails while still returning 0 with JSON stdout; --evidence reports done and failed.
    command: bin/venv-python -m pytest tests/session/postflight/test_status_lines.py tests/session/postflight/test_metrics_housekeeping.py -q
    expected: Every node passes, including the unchanged test_returns_combined_json. Red before (no line emitted).
    fix_if: A JSON parse failure in test_returns_combined_json means the line was printed to stdout.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: status-line-postflight-emitters
  - step: 5
    phase: pre-deploy
    action: Each roster rule fails closed on a planted defect.
    command: >-
      bin/venv-python -m pytest
      tests/checks/hygiene/test_validate_status_line_emitters.py::test_each_rule_fails_closed -q
    expected: >-
      The node passes; it is parametrised over E1 (bad source, overlong source), E2 (unknown result), E3 (module
      missing the call, missing a declared result, bad reason), E4 (unlisted source, non-literal source), E5 (command
      the parser never scans) and E6 (a stray format_status_marker call), each asserting its own error.
    fix_if: A rule that does not fire, or fires without naming source and file, is a check bug.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: status-line-emitters
  - step: 6
    phase: pre-deploy
    action: >-
      The real tree passes, the check is registered in both tiers, the sibling's guard admits exactly the two formatting
      homes, and the check accounts for every roster row.
    command: >-
      bin/venv-python -m pytest
      tests/checks/hygiene/test_validate_status_line_emitters.py::test_live_repository_passes
      tests/checks/hygiene/test__manifest.py::TestStatusLineEmittersRegistered
      tests/turn_capture/test_status_events.py::test_no_status_emitter_outside_markers -q && bin/venv-python -c "from
      scripts.checks.hygiene.validate_status_line_emitters import validate_status_line_emitters as v; f=[]; v(f);
      print('FAILED' if f else 'STATUS_EMITTERS_OK', len(f))"
    expected: The nodes pass, then STATUS_EMITTERS_OK 0 after the check's PASS line reporting 4 status sources examined.
    fix_if: A live failure means an emitter and its roster row disagree -- fix the emitter or the row, never the rule.
    hermetic: true
    expected_literals: [STATUS_EMITTERS_OK 0]
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: The rec rules are authored in the contracts and served verbatim through get_rec_write_guidance.
    command: bin/venv-python -m pytest tests/test_rec_hygiene_rules.py tests/test_rec_write_guidance.py -q
    expected: Every node passes. Red before (rule sentences absent).
    fix_if: A parity failure means the contract and ops.yaml wording diverged -- copy the contract sentence.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: rec-hygiene-rules-served
  - step: 8
    phase: pre-deploy
    action: The deletion rule is present at every surface and the existing 12k pins still hold.
    command: >-
      bin/venv-python -m pytest
      tests/test_workflow_skill_antidrift.py::test_closure_obligation_requires_caller_disposition
      tests/test_workflow_skill_antidrift.py::test_critique_verifies_rather_than_rederives
      tests/test_workflow_skill_antidrift.py::test_planning_enforcement_names_the_critique_check_id -q
    expected: All three nodes pass. The first is red before (step (5) and the caller wording absent).
    fix_if: A failing existing pin means the 12k edit removed pinned text -- restore it.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: deleted-writer-caller-disposition
  - step: 9
    phase: pre-deploy
    action: >-
      No budget is raised and the writer projection is untouched: prose, SLOC and structural size checks pass,
      ops_recommendations.yaml is at or under 556 effective lines, and field_semantics.yaml has no diff.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from
      scripts.checks.sloc.sloc_limits import validate_sloc_limits as s; from scripts.checks.structural.size_limits import
      validate_structural_size_limits as z; f=[]; p(f); s(f); z(f); print('FAILED' if f else 'BUDGETS_OK', len(f))" &&
      git diff --exit-code origin/main -- config/lambda/ducklake/field_semantics.yaml config/prose_budgets.yaml
      config/sloc_budgets.yaml config/structural_size_budgets.yaml && bin/venv-python -m
      scripts.schema_to_field_semantics --check
    expected: BUDGETS_OK 0, no diff on the four files, and the generator reports no drift.
    fix_if: A prose breach -- trim the edit (never a raise); a size breach on ops_recommendations.yaml -- compact more amendment history.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: rec-3875's acceptance passes.
    command: bin/venv-python -m scripts.ops_portal.cli --help | grep -qi usage && echo REC_3875_OK
    expected: REC_3875_OK.
    fix_if: Empty output means the __main__ guard is missing.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: tests/ops_data_portal/test_cli.py::test_cli_module_runs_under_python_m runs in the fast tier and pins the same behaviour.
  - step: 11
    phase: pre-deploy
    action: Full validation on the final working tree, before the commit (handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, including validate_status_line_emitters, validate_contract_drift and the budget checks.
    fix_if: Fix the reported check and re-run from step 2.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      After the squash merge (body "Resolves: rec-3875"), the closure job has closed rec-3875; and in a fresh session on
      merged main, a deliberately refused update (--update-rec rec-3875 with no update field) produces one captured
      status:ops_portal.update_rec.failed process event in that session's telemetry.
    command: >-
      bin/venv-python -c "from scripts.recs_related.related_recs import make_reader; r=make_reader();
      s=[x['status'] for x in r.named('recs_by_ids', ids='rec-3875')]; print('rec-3875', s); assert s==['closed'];
      print('CLOSED_OK')"
    expected: >-
      CLOSED_OK; then session_process_event_rollup for the fresh session's id lists status:ops_portal.update_rec.failed
      with count 1 (read by the coordinator after that session's Stop hook has run).
    fix_if: >-
