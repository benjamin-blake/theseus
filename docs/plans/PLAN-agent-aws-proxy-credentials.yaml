schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agent-aws-proxy-credentials"
intent: >-
  Take the long-lived agent_static AWS key out of the DEV and ADMIN cloud containers. Each environment's agent proxy
  holds it as an AWS network secret and signs only the project region's STS host; the container holds placeholder
  credentials from a repo-owned credential_process script; and identity checks read the real assumed role from a second
  region's STS host, because the proxy re-signs every call to the allowed host as the IAM user. Executes rec-4510 and is
  Plan A of the four-plan credential-proxy split (B two IAM users and ExternalIds removed, C GitHub secret hardening,
  D Secrets Manager to SSM), so agents never hold a real AWS key while the Pattern-B role model stays unchanged.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-agent-aws-proxy-credentials.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4510.
scope:
  - file: scripts/aws_profile.py
    action: Modify
    purpose: >-
      Add IDENTITY_PROBE_REGION = "eu-west-1", caller_arn(profile) and a `python -m scripts.aws_profile caller-arn
      [--profile P]` CLI. caller_arn builds boto3.Session(profile_name=resolve_aws_profile(profile)), takes its frozen
      credentials (the profile's own AssumeRole, on the profile's region, proxy-signed in a cloud session), then calls
      GetCallerIdentity from a SEPARATE boto3 STS client with region_name=IDENTITY_PROBE_REGION built from those
      credentials, and returns the Arn. It never overrides the profile's region (that would move the inner AssumeRole off
      the proxy-allowed host) and never prints or logs credential values. The CLI prints only the Arn (exit 0), or one
      error line naming the exception type to stderr (exit 1). The module docstring carries the rule: an STS call made with
      role credentials must never target the project region's STS host. Nothing raises at import.
  - file: tests/test_aws_profile.py
    action: Modify
    purpose: >-
      Credential-free tests (mocked boto3.Session / botocore Stubber, no network): the identity client is created with
      region_name IDENTITY_PROBE_REGION and the resolved credentials, and the profile session is never given a region
      override; profile None (CI/Lambda) uses the default chain; the CLI prints the Arn and exits 0, and on a raised
      botocore error prints one stderr line and exits 1 without echoing credential values; IDENTITY_PROBE_REGION differs
      from the region in config/aws-region.
  - file: bin/aws-proxy-placeholder-credentials
    action: Create
    purpose: >-
      Executable bash credential_process script printing exactly {"Version": 1, "AccessKeyId": "proxy-injected-key-id",
      "SecretAccessKey": "proxy-injected-secret"}. No Expiration (static, no refresh loop) and no SessionToken (a fake
      token adds X-Amz-Security-Token, which could break the proxy re-sign). Values are not key-shaped, so the never-commit
      shape hook (.pre-commit-config.yaml block-sensitive-identifiers) stays quiet.
  - file: tests/test_aws_proxy_placeholder_credentials.py
    action: Create
    purpose: >-
      Runs the script and asserts the exact JSON (Version 1, both fields, no Expiration, no SessionToken) and that no value
      matches the never-commit AKIA/ASIA/AIDA shape; then resolves a credential_process profile pointing at it through
      botocore with a temp AWS_CONFIG_FILE and empty AWS_SHARED_CREDENTIALS_FILE, asserting the placeholder access key id.
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Header: replace the DEV and ADMIN templates. Each environment now has (1) an AWS (SigV4) network secret in the
      environment settings holding the agent_static access key, allowed host sts.eu-west-2.amazonaws.com only, and (2) a
      private setup-field block that writes ~/.aws/config only: [profile agent_static] with credential_process naming the
      installed copy's absolute path ($HOME/.local/bin/aws-proxy-placeholder-credentials) and region; [profile
      agent_platform] (DEV and ADMIN); [profile agent_platform_admin] (ADMIN only, both profiles kept, AWS_PROFILE=
      agent_platform_admin and INSTALL_TERRAFORM=1 in the env-var field unchanged); `rm -f "$HOME/.aws/credentials"`; and
      `cd /home/user/ontheloop` (was the pre-transfer /home/user/agent-platform). Account id and ExternalIds stay
      <PLACEHOLDER> tokens. Body: a new numbered step, before the session_start hooks, installs
      bin/aws-proxy-placeholder-credentials to $HOME/.local/bin with `install -m 0755` only when the copy is missing or
      differs (cmp). Responsibility-split and "What it does" comments updated.
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      Header template has no aws_secret_access_key and no /home/user/agent-platform, names credential_process, the
      network-secret step and cd /home/user/ontheloop; the install step precedes `bash .claude/hooks/session_start_aws.sh`;
      running the extracted install block twice against a temp HOME leaves one identical executable copy.
  - file: .claude/hooks/session_start_aws.sh
    action: Modify
    purpose: >-
      Report the identity from `bin/venv-python -m scripts.aws_profile caller-arn --profile "$PROFILE"` (repo root from
      CLAUDE_PROJECT_DIR, else the script's own location) instead of `aws sts get-caller-identity`. Gate on ~/.aws/config
      existing (a credentials file is no longer expected); skip with a message when bin/venv-python or the venv is absent;
      always exit 0 (advisory). Hint text names the environment's AWS network secret and the ExternalId in ~/.aws/config,
      not ~/.aws/credentials.
  - file: tests/hooks/test_session_start_aws.py
    action: Create
    purpose: >-
      Runs the real hook in a temp repo root with a stub bin/venv-python and a temp HOME: prints "OK: assumed <arn>" from
      the helper, warns and exits 0 when the helper exits 1, skips when ~/.aws/config is absent, and a stub `aws` on PATH
      that records its argv is never invoked with "sts".
  - file: tests/test_sts_call_sites.py
    action: Create
    purpose: >-
      Census guard for the proxy side effect: scans tracked files under scripts/, src/, bin/ and .claude/hooks/ for STS
      usage (boto3 client("sts" ...), "sts" CLI argv lists, `aws sts`) and asserts the set of matching files equals an
      explicit allow-list (scripts/aws_profile.py, scripts/checks/_scaffolding.py, scripts/preflight/aws_infra.py,
      scripts/sync/ops.py, scripts/ci/iam_simulate.py, scripts/ci/security_detector_probe.py). A new file fails with a
      message pointing at the rule in scripts/aws_profile.py's docstring; an allow-listed file that no longer matches also
      fails (no stale entries).
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      admin_out_of_band.pre_merge_live_plan rule[1] (ENVIRONMENT CHECK) becomes the approved text (context: approved
      texts, 4a); one amendment_log entry naming pre_merge_live_plan and this plan.
  - file: scripts/checks/verification/validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      ENV_MARKERS replaced (not OR-widened) from ("get-caller-identity", "ADMIN_CHAIN_OK") to ("caller-arn",
      "ADMIN_CHAIN_OK") to match the amended contract. Decision 235 clause 1: this plan is the human-confirmed plan
      naming the change (see context, approvals).
  - file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      The fixture env-check command becomes the helper form; add a case where a net-new admin-root plan whose
      ENVIRONMENT CHECK step carries only the old get-caller-identity form is flagged; the existing marker-literal parity
      test keeps every ENV_MARKERS literal present in deploy-paths.yaml.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Assert rule[1] carries the caller-arn helper command and no longer the get-caller-identity form.
  - file: scripts/preflight/aws_infra.py
    action: Modify
    purpose: >-
      _handle_credentials_startup guidance names `bin/venv-python -m scripts.aws_profile caller-arn --profile <p>` and the
      environment's AWS network secret instead of "refresh ~/.aws/credentials"; the check_credentials docstring notes it
      is exit-code only and stays correct under the proxy. check_credentials behaviour is unchanged.
  - file: tests/session/preflight/test_aws_infra.py
    action: Modify
    purpose: Assert the new guidance text names the helper and the network secret and no longer says ~/.aws/credentials.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      AWS-04 location and ANT-03 kind become the approved values (see context, approved texts, 4f); target, stage and status
      unchanged (rotation stays with Plan B); one amendment_log correction entry.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the approved dated Update annotation to Decision 113 after its 2026-10-21 Update (Decision 177 annotation
      form; no body edit, no new numbered Decision).
  - file: AGENTS.md
    action: Modify
    purpose: Replace the approved sentence at line 114 (see context, approved texts, 4d).
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: Replace the approved sentence in the creds_status preflight bullet (see context, approved texts, 4e).
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: Replace the approved sentence in the creds_status preflight bullet (see context, approved texts, 4e).
bundled_recommendations:
  - rec-4510
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform` prints an Arn containing
    assumed-role/PlatformDev/ in the ADMIN container both before the cut-over (static key) and after it (proxy-signed),
    and `--profile agent_platform_admin` prints one containing assumed-role/PlatformAdmin/.
  - >-
    The identity call is made from a separate STS client in IDENTITY_PROBE_REGION built from the resolved role
    credentials; the profile's own region is never overridden; IDENTITY_PROBE_REGION differs from config/aws-region.
  - >-
    bin/aws-proxy-placeholder-credentials prints valid credential_process JSON with fixed non-key-shaped values, no
    Expiration and no SessionToken, and botocore resolves a profile pointing at it.
  - >-
    bin/setup-cloud-env.sh contains no aws_secret_access_key and no /home/user/agent-platform; its templates write
    ~/.aws/config only, describe the network secret with the single allowed STS host, keep both profiles in ADMIN, and its
    body installs the placeholder script before the session_start hooks, idempotently.
  - >-
    .claude/hooks/session_start_aws.sh reports the helper's Arn, never calls `aws sts`, and always exits 0.
  - >-
    The deploy-paths ENVIRONMENT CHECK and validate_admin_root_premerge_gate's ENV_MARKERS use the caller-arn form; a
    net-new admin-root plan carrying only the old get-caller-identity form is flagged.
  - >-
    tests/test_sts_call_sites.py fails when STS usage appears in a file outside its allow-list.
  - >-
    After Benjamin's cut-over, a new ADMIN session has no ~/.aws/credentials and no aws_secret_access_key under ~/.aws,
    reports PlatformDev and PlatformAdmin through the helper, prints ADMIN_CHAIN_OK, reads the DuckLake reader as
    PlatformDev, is denied PlatformDev's tfstate read (403), is denied an AssumeRole into PlatformAdmin without an
    ExternalId, and has the placeholder rejected on S3. The DEV checks pass in a DEV session or are recorded unproven.
  - >-
    rec-4510 is closed (re-grounded acceptance passes) and the full tier exits 0 before the PR is opened.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the helper unit tests (region pinning, default chain, CLI output and error path, region inequality).
    command: bin/venv-python -m pytest tests/test_aws_profile.py -q
    expected: exit 0; every test passes. Before the change the caller_arn import fails, so the new tests error.
    fix_if: >-
      A test sees region_name eu-west-2 on the identity client or a region override on the profile session -- the
      helper is re-introducing the proxy re-sign; fix the helper, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: aws-profile-caller-arn
  - step: 2
    phase: pre-deploy
    action: Run the placeholder-script tests, including botocore resolution through credential_process.
    command: bin/venv-python -m pytest tests/test_aws_proxy_placeholder_credentials.py -q
    expected: exit 0; every test passes. Before the change the script does not exist and the tests fail.
    fix_if: >-
      botocore rejects the JSON -- check Version is the integer 1 and both keys are present; never add an Expiration or a
      SessionToken to make it pass.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: aws-proxy-placeholder-credentials
  - step: 3
    phase: pre-deploy
    action: Run the setup-script contract tests (template content, path fix, install ordering and idempotence).
    command: bin/venv-python -m pytest tests/test_setup_cloud_env.py -q
    expected: exit 0; every test passes, including the existing ordering and tfvars tests.
    fix_if: >-
      The ordering test fails -- the install step must sit before `bash .claude/hooks/session_start_aws.sh`; the
      idempotence test fails -- keep the cmp guard.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: setup-cloud-env-proxy-template
  - step: 4
    phase: pre-deploy
    action: Run the hook tests against the real hook with stubbed helper and aws.
    command: bin/venv-python -m pytest tests/hooks/test_session_start_aws.py -q
    expected: exit 0; every test passes; the recorded aws argv never contains sts.
    fix_if: The hook still calls aws sts, or exits non-zero on a helper failure -- it is advisory and must exit 0.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: session-start-aws-caller-arn
  - step: 5
    phase: pre-deploy
    action: >-
      Run the admin-gate check and contract tests: the helper-form check passes, an old-form-only plan is flagged, every
      ENV_MARKERS literal is present in deploy-paths.yaml, and rule[1] carries the helper command.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_admin_root_premerge_gate.py tests/test_deploy_paths_admin_procedure.py -q
    expected: exit 0; every test passes.
    fix_if: >-
      The marker-parity test fails -- the contract text and ENV_MARKERS disagree; the contract text is the approved 4a
      wording, so fix ENV_MARKERS, never re-word the contract without Benjamin.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: admin-chain-check-caller-arn
  - step: 6
    phase: pre-deploy
    action: Run the preflight credential tests (unchanged exit-code behaviour, new guidance text).
    command: bin/venv-python -m pytest tests/session/preflight/test_aws_infra.py -q
    expected: exit 0; every test passes.
    fix_if: An existing check_credentials test fails -- its behaviour must not change; revert any edit beyond the text.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      The behaviour guarded is guidance wording only; check_credentials' exit-code behaviour is already covered by the
      existing permanent tests in this file, which this step re-runs.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the STS call-site census, then prove it discriminates: a scratch copy of the repo tree with one extra STS call
      in a new file must fail it.
    command: >-
      bin/venv-python -m pytest tests/test_sts_call_sites.py -q && d=$(mktemp -d) && git worktree add -q "$d" HEAD
      && printf 'import boto3\nboto3.client("sts")\n' > "$d/scripts/sts_probe_tmp.py" && git -C "$d" add scripts/sts_probe_tmp.py
      && (cd "$d" && ! bin/venv-python -m pytest tests/test_sts_call_sites.py -q >/dev/null 2>&1) && echo CENSUS_DISCRIMINATES;
      git worktree remove --force "$d"
    expected: The census passes on the branch, and the scratch tree with the extra call fails it, printing CENSUS_DISCRIMINATES.
    fix_if: >-
      The scratch tree passes -- the scan misses boto3 client("sts") in a new file; widen the pattern, not the allow-list.
      If the worktree has no .venv, point bin/venv-python at the main checkout's interpreter via the test's own repo-root
      parameter instead.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: rec-4510's re-grounded acceptance, verbatim (set via update_rec in execution step 1).
    command: bin/venv-python -m pytest tests/test_aws_profile.py -q && ! grep -q aws_secret_access_key bin/setup-cloud-env.sh && ! grep -q '/home/user/agent-platform' bin/setup-cloud-env.sh
    expected: exit 0.
    fix_if: A grep hit -- the template still writes a credentials file or the old path; fix the header.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates steps 1 and 3, whose graduated tests already assert the same grep conditions permanently; this step
      exists only to replay the rec's closure oracle.
  - step: 9
    phase: pre-deploy
    action: >-
      Live, read-only, in the implementing ADMIN container before the cut-over (still on the static key): the helper
      reports both roles, and the approved ENVIRONMENT CHECK prints ADMIN_CHAIN_OK. Output is reduced to role names; no
      account id or ARN is printed.
    command: >-
      bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform | grep -o 'assumed-role/PlatformDev/'
      && bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform_admin | grep -o 'assumed-role/PlatformAdmin/'
      && (bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT)
    expected: Prints assumed-role/PlatformDev/, assumed-role/PlatformAdmin/ and ADMIN_CHAIN_OK.
    fix_if: >-
      Exit 1 from the helper -- read its one-line error; a network error on sts.eu-west-1 means the container's network
      policy blocks it (stop and report; do not switch the probe region to eu-west-2).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in this plan's scope is fixed on the branch; never skip a test, relax an assertion, or add a baseline or
      budget entry. A failure outside scope becomes a rec via scripts.ops_data_portal (Decision 59, Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      After merge, Benjamin's ADMIN cut-over (network secret with the existing key, allowed host sts.eu-west-2 only;
      setup field re-pasted from the merged header) and a NEW ADMIN session: no long-lived key material in ~/.aws.
    command: test ! -e "$HOME/.aws/credentials" && ! grep -rq aws_secret_access_key "$HOME/.aws" && grep -q credential_process "$HOME/.aws/config" && echo NO_STATIC_KEY
    expected: Prints NO_STATIC_KEY.
    fix_if: A credentials file remains -- the setup field was not re-pasted from the new header or the snapshot predates it; ask Benjamin to re-paste and start a new session.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: In the new ADMIN session, the helper reports both roles through the proxy and the ENVIRONMENT CHECK prints ADMIN_CHAIN_OK (step 9's command).
    command: >-
      bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform | grep -o 'assumed-role/PlatformDev/'
      && bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform_admin | grep -o 'assumed-role/PlatformAdmin/'
      && (bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT)
    expected: Prints assumed-role/PlatformDev/, assumed-role/PlatformAdmin/ and ADMIN_CHAIN_OK.
    fix_if: >-
      AssumeRole fails with InvalidClientTokenId -- the network secret's allowed host or key is wrong (Benjamin's console
      step); the role is right but the helper prints user/ -- the identity client is on eu-west-2; stop and RCA.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Scope boundary in the new ADMIN session (read-only): role credentials work off the STS host as PlatformDev (DuckLake
      reader), PlatformDev is still denied its tfstate read, the IAM user cannot assume PlatformAdmin without an
      ExternalId, and the placeholder key is rejected on S3 (the proxy signs only STS). The known side effect is recorded:
      an unpinned get-caller-identity returns the IAM user.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; print('READER_OK', len(make_reader().named('count_by_status')) > 0)"
      ; aws s3api head-object --bucket agent-platform-data-lake --key tfstate/personal/sandbox/terraform.tfstate --profile agent_platform 2>&1 | grep -oE '403|Forbidden' | head -1
      ; acct=$(aws configure get role_arn --profile agent_platform | cut -d: -f5); aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe 2>&1 | grep -o AccessDenied | head -1
      ; aws s3 ls --profile agent_static 2>&1 | grep -oE 'InvalidAccessKeyId|SignatureDoesNotMatch|AccessDenied' | head -1
      ; aws sts get-caller-identity --profile agent_platform --query Arn --output text 2>&1 | grep -o 'user/agent-service-account'
    expected: >-
      Prints READER_OK True, then 403 (or Forbidden), then AccessDenied, then a rejection code for the placeholder, then
      user/agent-service-account (the recorded side effect). Nothing else is printed.
    fix_if: >-
      The tfstate read succeeds -- the scope boundary did not hold; stop, do not retry, report to Benjamin (security). The
      admin AssumeRole succeeds without an ExternalId -- trust policy changed; stop and report. The side-effect line is
      absent -- the proxy behaviour changed; record it (not a failure) and tell the coordinator, since Plans B and D rely on it.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      DEV, in a session in the DEV environment after Benjamin's DEV cut-over (paste-able probe prompt in the handoff):
      no static key; the helper reports PlatformDev; the IAM user cannot assume PlatformAdmin with DEV's own ExternalId or
      with none; PlatformDev's tfstate read is denied.
    command: >-
      test ! -e "$HOME/.aws/credentials" && ! grep -rq aws_secret_access_key "$HOME/.aws" && echo NO_STATIC_KEY
      ; bin/venv-python -m scripts.aws_profile caller-arn --profile agent_platform | grep -o 'assumed-role/PlatformDev/'
      ; acct=$(aws configure get role_arn --profile agent_platform | cut -d: -f5); aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe --external-id "$(aws configure get external_id --profile agent_platform)" 2>&1 | grep -o AccessDenied | head -1
      ; aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe 2>&1 | grep -o AccessDenied | head -1
      ; aws s3api head-object --bucket agent-platform-data-lake --key tfstate/personal/sandbox/terraform.tfstate --profile agent_platform 2>&1 | grep -oE '403|Forbidden' | head -1
    expected: >-
      Prints NO_STATIC_KEY, assumed-role/PlatformDev/, AccessDenied, AccessDenied, 403 (or Forbidden). This proves the
      ExternalId gate only, not principal separation (rec-4043 / Plan B).
    fix_if: >-
      Either AssumeRole into PlatformAdmin succeeds -- stop, report to Benjamin immediately (security). No DEV session is
      available -- record DEV as unproven in the PR comment; never substitute the ADMIN results.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      After squash-merge with "Resolves: rec-4510", confirm the trailer-closure job closed the rec (closure obligation).
    command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-4510'); print(r['status']); assert r['status']=='closed'"
    expected: Prints closed; exit 0.
    fix_if: >-
      Still open -- read the trailer-closure job log; on a transport or merge-leg refusal use the sanctioned --update-rec
      fallback; on an acceptance-verdict refusal use only the printed close_proposed command (git-ops.yaml
      resolves_trailer). Never edit a local cache.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/aws_profile.py
    behavior: >-
      caller_arn reads the identity from a separate IDENTITY_PROBE_REGION client built from the resolved role
      credentials, never from the profile's region, and the CLI never echoes credentials.
    verification_step: 1
    test_selector: tests/test_aws_profile.py
    red_green_expectation: red before (caller_arn does not exist; the new tests error on import), green after.
  - source: bin/aws-proxy-placeholder-credentials
    behavior: Prints valid, non-key-shaped credential_process JSON with no Expiration or SessionToken that botocore resolves.
    verification_step: 2
    test_selector: tests/test_aws_proxy_placeholder_credentials.py
    red_green_expectation: red before (script missing), green after.
  - source: bin/setup-cloud-env.sh
    behavior: >-
      Templates write config only, name the network secret and the current repo path, keep both ADMIN profiles; the body
      installs the placeholder script idempotently before the session_start hooks.
    verification_step: 3
    test_selector: tests/test_setup_cloud_env.py
    red_green_expectation: red before (old template carries aws_secret_access_key and the old path), green after.
  - source: .claude/hooks/session_start_aws.sh
