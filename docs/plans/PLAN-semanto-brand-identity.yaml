  command: from scripts.roadmap.platform_roadmap import RoadmapDocument
  red_green_expectation: >-
    Red before -- s['S1.10'] raises KeyError (exit 1). Green after; waived, not graduated (S1.5 owns the standing
    Semanto validator).
