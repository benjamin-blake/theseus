schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: semanto-brand-identity
intent: >-
  Record the On The Loop brand-identity work as deferred_post_mvp Semanto rows -- the illustration commission, the
  OTL monogram logo system, the typography and the trademark filing -- and re-ground S1.9's positioning on
  milestone-and-gate dependency mapping, while discharging rec-3986 so the roadmap names On The Loop as the sole
  external brand (Decision 198) and points at Decision 101's clauses instead of restating them. When any S1.x item
  reactivates post-MVP it then starts from the current brand, audience pointer and open-core boundary, never from
  retired text, and every brand value it inherits is visibly provisional.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-semanto-brand-identity.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category) with bundled ad_hoc_rec rec-3986: no docs/ROADMAP-PLATFORM.yaml
  tier_item is claimed and no exit criterion is closed. The plan re-grounds deferred_post_mvp Semanto rows S1.1,
  S1.2, S1.6 and S1.9 and adds S1.10-S1.13, all deferred_post_mvp, with no depends_on edge from a live item
  (Decision 93). Names no CD.27-gated item, so no fallback_reevaluation block is owed. Slice semanto-brand-identity
  of overseer run otl-product-direction.
scope:
- file: docs/ROADMAP-SEMANTO.yaml
  action: Modify
  purpose: >-
    rec-3986 re-grounding of the header comment, document.description, agent_instructions and rows S1.1, S1.2 and
    S1.6 (On The Loop as the sole external brand; Decision 101 clauses pointed at as amended by Decisions 171, 198,
    202 and 209, never restated); S1.9 re-grounded with four open criteria; new deferred_post_mvp rows S1.10
    (illustration commission), S1.11 (OTL monogram logo system), S1.12 (typography) and S1.13 (trademark filing).
bundled_recommendations:
- rec-3986
followon_recs:
- rec-4557
infrastructure_dependencies: []
acceptance_criteria:
- docs/ROADMAP-SEMANTO.yaml validates against RoadmapDocument, every tier_item stays deferred_post_mvp, and no
  docs/ROADMAP-PLATFORM.yaml item depends_on an S1.x id (Decision 93).
- No retired brand text remains -- zero matches for hiring managers, theseus.support and (case-insensitively)
  theseus -- and the header, S1.1, S1.2 and S1.6 point at Decision 101 as amended (Decisions 171, 198, 202, 209)
  instead of restating its clauses (b), (e) and (f).
- S1.10-S1.13 exist with S1.11 and S1.12 depending on S1.10 and S1.13 on S1.11, user_action_required on S1.10 and
  S1.13, and structured open exit criteria; every colour, palette and typeface value is marked provisional, and the
  brand tokens and colour rule are named as inputs to the visual-grammar contract, never defined in the roadmap.
- The agent_instructions, S1.10 c3, S1.11 c6 and S1.12 c2 state that the logo marks, illustrations, brand art and
  visual style are On The Loop Labs Limited's, all rights reserved, covered neither by BUSL-1.1 nor by Apache-2.0
  after the Decision 194 flip, every asset carrying its own notice; follow-on rec-4557 owns the explicit
  licence-surface exclusion.
- S1.9 carries the milestone-and-gate headline, the Signaller archetype (Decision 232), model-agnostic wording, the
  Decision 221 clause 4 hypothesis rule and the Decision 209 clause 1 boundary as four open criteria.
- rec-3986's acceptance is re-authored to a decidable form that the trailer census buckets probeable (Decision
  201), and the squash commit's Resolves rec-3986 trailer closes it.
- The file stays inside the roadmaps size class (500 effective lines, 2,000-character lines; Decision 166) and the
  full validate tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    rec-3986's oracle in its decidable form (Decision 201): no retired brand text -- the restated hiring-manager
    audience line and the retired domain -- remains in the Semanto roadmap.
  command: >-
    test "$(grep -c 'hiring managers' docs/ROADMAP-SEMANTO.yaml)" -eq 0 && test "$(grep -c 'theseus.support'
    docs/ROADMAP-SEMANTO.yaml)" -eq 0
  expected: Exit 0 -- both counts are zero.
  fix_if: >-
    A non-zero count names the token: remove the restatement or point at Decision 101 as amended instead (S1.6's
    audience line, S1.2's domain). Never narrow the grep to make it pass.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: semanto-retired-brand-tokens-absent
- step: 2
  phase: pre-deploy
  action: >-
    Load the edited roadmap through RoadmapDocument (no validator reads this file until S1.5) and assert the
    slice's state -- statuses, the new rows' edges and flags, S1.9's and S1.11's criteria, the provisional markers,
    the visual-grammar-contract inputs, the all-rights-reserved brand-art rule and its rec-4557 owner, the pointer
    form, vendor-neutral wording, no live dependent -- plus the Decision 232 header the overseer sequenced this
    implementation behind.
  command: >-
    bin/venv-python -c "import re, yaml; from pathlib import Path; from scripts.roadmap.platform_roadmap import
    RoadmapDocument; t = Path('docs/ROADMAP-SEMANTO.yaml').read_text(); d =
    RoadmapDocument.model_validate(yaml.safe_load(t)); s = {i.id: i for i in d.tier_items}; ai =
    d.document.agent_instructions; assert all(i.status == 'deferred_post_mvp' for i in d.tier_items), [i.id for i
    in d.tier_items if i.status != 'deferred_post_mvp']; assert [s[k].depends_on for k in ('S1.10', 'S1.11',
    'S1.12', 'S1.13')] == [[], ['S1.10'], ['S1.10'], ['S1.11']]; assert s['S1.10'].user_action_required and
    s['S1.13'].user_action_required; assert 'milestones and gates' in s['S1.9'].name and [c.id for c in
    s['S1.9'].exit_criteria] == ['c1', 'c2', 'c3', 'c4']; assert all(c.status == 'open' for k in ('S1.9', 'S1.10',
    'S1.11', 'S1.12', 'S1.13') for c in s[k].exit_criteria); assert 'Signaller' in s['S1.9'].intent and 'Decision
    232' in s['S1.9'].intent; assert all('provisional' in s[k].intent for k in ('S1.11', 'S1.12')) and 'Special
    Elite' in s['S1.12'].intent; assert all('visual-grammar contract' in x for x in (s['S1.10'].intent,
    s['S1.11'].intent, s['S1.12'].intent, ai)); assert 'On The Loop Labs Limited' in s['S1.10'].intent and
    'rec-4385' in s['S1.13'].intent and 'rec-4389' in ai; assert 'rec-4557' in ai and all('all rights
    reserved' in x for x in (ai, s['S1.10'].exit_criteria[2].text, s['S1.11'].exit_criteria[5].text)); assert
    [c.id for c in s['S1.11'].exit_criteria] == ['c1', 'c2', 'c3', 'c4', 'c5', 'c6']; assert not re.search('(?i)theseus|hiring managers|OSS
    community|unchanged per Decision 101|cheaper than', t); assert not
    re.search(r'(?i)\b(anthropic|openai|gemini|mistral)\b', t); assert not re.search(r'depends_on:.*\bS1\.',
    Path('docs/ROADMAP-PLATFORM.yaml').read_text()); assert re.search('(?m)^## Decision 232:',
    Path('docs/DECISIONS.md').read_text()); print('SEMANTO_BRAND_IDENTITY_OK')"
  expected: Exit 0 and the marker; no assertion trips.
  fix_if: >-
    A KeyError or failed assertion names the row or token: conform the row to execution steps 2-9 verbatim. A
    failure on the Decision 232 assertion means the sibling slice product-surface-and-open-core has not merged --
    STOP and return BLOCKED (pre_implementation_checklist), never drop the assertion or the citation. A
    ValidationError names the malformed field.
  hermetic: true
  expected_literals:
  - SEMANTO_BRAND_IDENTITY_OK
  graduation: waive
  graduation_waiver_reason: >-
    It asserts this plan's own transient roadmap state -- every row deferred_post_mvp, S1.10-S1.13's edges and
    flags, S1.9's four criteria all open, the Decision 232 header -- which a legitimate per-item reactivation
    (Decision 93), criterion flip or later re-grounding would redden; the standing Semanto validator is S1.5's, and
    the durable retired-token invariant is graduated by step 1.
- step: 3
  phase: pre-deploy
  action: >-
    Full validate tier (handoff gate): YAML parse, plan schema, the structural-size class engine over
    docs/ROADMAP-SEMANTO.yaml (roadmaps class, 500 effective lines, 2,000-character lines), the verification
    registry over the graduated shard, and every other check.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 -- every check passes, including validate_structural_size_limits on the edited roadmap.
  fix_if: >-
    Read the failing check and fix the offending file; never weaken a check or raise a size limit. A size failure
    means the edit overshot (the draft measured 356 effective lines): compact the new rows' prose.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    It invokes scripts.validate, so the graduate partition would be refused statically (recursion_refusal), and PR
    CI already runs the --pre tier; this is the Decision 163 handoff full-tier run, not a standing guard.
- step: 4
  phase: pre-deploy
  action: >-
    Closure precondition (Decision 201): rec-3986's re-authored acceptance (execution step 12) is read back from the
    DuckLake reader, the trailer census buckets it probeable, and it holds on the edited tree. Reads the reader
    (credentials).
  command: >-
    bin/venv-python -c "import subprocess; from src.common.ducklake_reader_client import fetch_recs_by_ids,
    make_reader; from scripts.rec_trailer_acceptance import census; rows, _ = fetch_recs_by_ids(make_reader(),
    ['rec-3986']); e = census(['rec-3986'], rows=rows); assert [x['bucket'] for x in e] == ['probeable'], e;
    assert subprocess.run(rows[0]['acceptance'], shell=True).returncode == 0, rows[0]['acceptance'];
    print('REC_3986_ACCEPTANCE_PROBEABLE_AND_HOLDS')"
  expected: Prints the marker.
  fix_if: >-
    Bucket unprobeable_shape: the acceptance was not re-authored or still uses negated grep -q; redo execution
    step 12. Writer or reader unreachable: leave rec-3986 open, say so in the PR body, and do not block the merge
    on it (PLAN-terraform-lock-coherence precedent).
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    CLOSURE OBLIGATION (bundled rec): rec-3986 is closed by the squash commit's Resolves rec-3986 trailer (ci.yml
    closure job, acceptance verdict holds). Reads the DuckLake reader (credentials).
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(), ['rec-3986']); s = [r['status'] for r in rows]; assert s == ['closed'], s;
    print('REC_3986_CLOSED')"
  expected: Prints the marker.
  fix_if: >-
    Still open: confirm the squash body carried the trailer and the closure job ran with a holds verdict; never
    force-close it (Decision 201's amendment of Decision 186).
  hermetic: false
  graduation: not-applicable
