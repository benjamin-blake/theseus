  behavior: No retired brand text (the restated hiring-manager audience line, the retired domain) remains.
  verification_step: 1
  command: >-
    test "$(grep -c 'hiring managers' docs/ROADMAP-SEMANTO.yaml)" -eq 0 && test "$(grep -c 'theseus.support'
    docs/ROADMAP-SEMANTO.yaml)" -eq 0
  red_green_expectation: >-
    Red before -- both tokens are present on origin/main, so the first test exits 1. Green after; graduated as
    semanto-retired-brand-tokens-absent.
- source: docs/ROADMAP-SEMANTO.yaml
  behavior: >-
    S1.10-S1.13 exist deferred_post_mvp with their edges, flags and open criteria, S1.9 carries four criteria, and
    the file validates against RoadmapDocument.
