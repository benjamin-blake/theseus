pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- Only the plan-cited decision sections read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- Seed the smoke catalog via rt.write_scd2 INSIDE the `if event.get("force_recreate_tables")` block in action_gc (handler.py:81-82), so the CD fixture seeds while the plain gc verb stays write-free
- Add test_gc_gate_fails_when_storage_grew to tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py, pinning expected files_before/files_after for the seeded fixture
- Re-ground the lambda_maintenance_gates.py docstring and cover the newly-live files_before>0 branch
- In map_source_to_test, resolve to the mirror target only when the grandfathered flat home does not exist on disk, inserted at the fall-through `return home` (line 368) -- never before the _RETIRING_GRANDFATHER_HOMES
  branch
- Add the repo-wide non-regression test pinning the unmapped set to exactly two files
- Append the compact dated c6/c9 re-grounding annotation naming rec-3802, flipping no status
- Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
- 'Report: what was implemented, verification results'
work_areas: []
rollback: Every change is additive or textual and revertable by reverting the squash commit; no schema, no infrastructure, and no ratified guard is altered.
