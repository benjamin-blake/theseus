infrastructure_dependencies:
- >-
  src/lambdas/data-pipeline/manifest.yaml (active artifact data-pipeline) is edited (one excludes line), so
  compute_affected_artifacts() flags data-pipeline via its manifest rule. NO deploy is performed or needed: the
  only zip delta is the packaged manifest.yaml, which no data-pipeline runtime code reads (the kernel files are
  excluded and never enter the zip); neither deploy-prod-lambdas.yml nor deploy-ducklake-lambdas.yml path-triggers
  on any changed file (VP step 13); PROD_SOURCE_PATHSPECS drift detection excludes the manifest. No .tf file and no
  DuckLake-Lambda-packaged file is in scope.
acceptance_criteria:
- >-
  src/telemetry/identity.py reproduces every vector in tests/telemetry/fixtures/identity_vectors.yaml byte-exactly
  (H hex and id), and the test ALSO recomputes each vector independently (hashlib + struct + unicodedata + an
  in-test stdlib Crockford encoder, never importing src.telemetry); python-ulid appears only in a separate
  cross-check test behind a function-scope pytest.importorskip("ulid"). Vectors cover at least: one per domain tag (telemetry_sessions:session_id,
  telemetry_observations:observation_id, telemetry_transcripts:transcript_id, telemetry_agents:agent_run_id, and a
  '<table>:event' event_id); an FK-equality pair (child FK over the parent's tag and ref == parent key); a sub-agent
  session ref '<sessionId>:<agentId>' carrying the ROOT session_started_at prefix; an NFC-equivalence pair
  (composed vs decomposed ref -> same id); a lowercase-tenant canonicalisation pair; a sub-millisecond truncation
  case (.999999 -> ms .999, never rounded up); a non-UTC offset normalised to the same ms; a multi-byte UTF-8 ref
  (length prefix counts bytes); a whitespace-bearing ref (never trimmed); an epoch (1970-01-01T00:00:00Z) and a far-future
  (9999-12-31T23:59:59.999Z) time basis; a decode_time_prefix round trip; and one vector carrying its full preimage
  hex. Negative vectors: empty ref, ref with NUL / LF, ref of 4097 UTF-8 bytes, non-str ref, a 25-char tenant, a
  tenant containing I, a tenant whose first char is 8 (overflow), a naive or pre-epoch time basis, an unknown
  domain tag.
- >-
  identity.py rejects (IdentityError): a naive, pre-epoch or > 2**48-1 ms timestamp; a tenant/project that is not
  a 26-char Crockford ULID (I/L/O/U, overflow, wrong length); an empty, non-str, control-character (Unicode Cc/Cs)
  or > 4096-UTF-8-byte ref; any domain tag not in the closed DOMAIN_TAGS registry. canonical_ulid upper-cases then
  validates with the stdlib Crockford strict parse (26 chars, no I/L/O/U, first char <= '7');
  canonical_ref NFC-normalises and never trims or case-folds.
  KEY_PLANS covers the four tables with each row's own key from entity_ref (transcripts: entity_ref must equal
  external_ref; sessions: entity_ref is the session_ref) and each FK computed with the PARENT's tag over the named
  caller ref (session_ref, parent_session_ref, observation_ref, parent_observation_ref); a required ref that is
  absent raises, an optional one yields NULL. decode_time_prefix(derive_entity_key(...)) returns the ms-truncated
  time basis.
- >-
  docs/contracts/telemetry-event-envelope.yaml governance_notes names tests/telemetry/fixtures/identity_vectors.yaml,
  the file exists and parses, the note scopes "normative" to the positive vectors and labels the negative vectors
  kernel input policy, and the contract carries one new top-level amendment_log entry (governance_note_add,
  semantic_break false); no field, contract.description or contract_version changes.
- >-
  timestamps.py: parse_iso8601_utc accepts exactly the pinned RFC 3339 profile ('Z'/'z' or +/-HH:MM offset, 'T'/'t'/
  space separator, 1-9 fraction digits truncated to ms, comma or dot decimal) and returns a UTC tz-aware datetime;
  rejects (TimestampError) naive ('2026-09-25T10:00:00'), date-only ('2026-09-25'), basic format
  ('20260925T100000Z'), week dates, '+02' and '+0200' offsets, '24:00:00', ':60', non-str and malformed input -- the
  forms datetime.fromisoformat would otherwise accept are tested explicitly; truncate_to_ms floors; epoch_ms is
  exact integer arithmetic (no float).
- >-
  append_events: a connection whose TimeZone is not 'UTC' is rejected before any SQL (a test sets
  TimeZone='America/New_York' on in-memory DuckDB and asserts the rejection and that no transaction opened); an
  empty batch returns inserted 0 without opening a transaction; a non-empty batch runs BEGIN, exactly
  ONE MERGE statement and COMMIT; the MERGE is insert-only (WHEN NOT MATCHED THEN INSERT; no UPDATE/DELETE clause),
  matches ON t.event_id = s.event_id AND t.parser_version = s.parser_version AND t.session_started_at >= <day floor
  of the batch's min session_started_at> AND t.session_started_at < <day floor of its max + 1 day> (bound
  parameters; a test captures the SQL and asserts the bounds), sources a multi-row VALUES list of bound parameters
  CAST to each column's sql_type, and never interpolates a value; catalog/table/column identifiers are validated.
  Ids: every KEY_PLANS column and event_id on every stored row equals an independent identity recomputation from
  the row's refs, tenant_id and project_id; a caller-supplied event_id, key column, tenant_id, project_id or
  created_timestamp is rejected. Replaying a batch returns inserted 0 and leaves the row count unchanged; the same
  event under a higher parser_version inserts one new row. created_timestamp is minted once per call (now() UTC, or
  the injected tz-aware now) and is identical on every row of the batch. Strict type gate before any SQL: VARCHAR
  takes str only; BIGINT takes int (never bool) within int64; DOUBLE takes int or float (never bool), finite only;
  BOOLEAN takes bool only; VARCHAR[] takes list[str]; TIMESTAMP WITH TIME ZONE takes a tz-aware datetime only
  (converted to UTC, truncated to ms) -- each rejection is tested because DuckDB's own casts coerce silently (1.5 to
  2, True to 1, naive to UTC). An unknown column, a missing/None NOT NULL column (parser_version included: a NULL
  key never matches, so replays would duplicate) is rejected before any SQL. Intra-batch rows sharing (event_id,
  parser_version): byte-identical ones collapse to one (AppendResult.collapsed counts them); differing ones reject
  the whole batch naming the event_id, never first-wins. A SQL failure mid-batch rolls back (zero rows written),
  re-raises, and leaves the connection usable. Error messages name the column and event_id, never payload values.
  The primitive mints nothing but created_timestamp and never retries (OCC retry stays the writer verb's,
  rec-4024).
- >-
  EventTableSpec.from_projection rejects an entry that carries merge_key or current_table, whose write_mode is not
  append_only, whose dedupe_key is not [event_id, parser_version], whose partition_column is not session_started_at,
  whose history partition is not the calendar-day triple over session_started_at,
  that lacks event_id/parser_version/session_started_at/created_timestamp, or whose derived-role set differs from
  {event_id, created_timestamp, tenant_id, project_id} plus the table's KEY_PLANS columns.
- >-
  Integration (local DuckLake file catalog on the venv's pinned duckdb/ducklake, Decision 99; table partitioned
  by the triple year(), month(), day() of session_started_at before the first write; DATA_INLINING_ROW_LIMIT 0, which IS the production setting --
  Decision 107 / CD.34 disabled inlining for all tables including telemetry, set on every connection by
  src/common/ducklake_runtime.py): one
  single-session batch adds exactly one data file; replaying it adds zero data files and zero rows; and the
  day-bounded MERGE reads exactly one data file when the touched-day, adjacent-day and same-day-of-month
  files all span the batch's event_id range; and, with TimeZone set to 'UTC' and at least two seed files per date,
  compaction reduces the file count to exactly the number of distinct dates with no file mixing two calendar
  dates. VP step 6 runs it on real DuckLake and fails on any skip; an
  extension-load failure is an environment defect to fix, never a skip or a deferral.
- >-
  Generator: _map_iceberg_type maps bigint->BIGINT and double->DOUBLE; a table_class event contract projects to
  {status, write_mode: append_only, history_table: <contract id>, partition: {history: <governance.partition_by>},
  partition_column: session_started_at, dedupe_key: [event_id, parser_version], entity_key: <the table's own key
  column>, columns} with no merge_key/current_table/entity_id_prefix/id_keyspace; columns in contract declaration
  order; derivation.timing read fields have no column (a timing read field with realized true raises); role derived
  for event_id, created_timestamp, tenant_id, project_id and every KEY_PLANS column, all other columns role input; a
  column is NOT NULL iff (nullable false OR resolved dq_intent(_local).not_null.enforced true) AND it declares no
  dq_intent.required_when, and a required_when column carries that condition as column metadata; fail-closed ValueError
  on a missing envelope column, a partition_by that is not exactly "year(C), month(C), day(C)" over one projected
  TIMESTAMP WITH TIME ZONE column C (a bare day(C) is rejected, with a message naming DuckLake's day-of-month
  semantics), or a migration_columns entry; generate() accepts an event contract with no merge_key. All four real telemetry
  contracts project without error (e.g. telemetry_sessions has no duration_seconds column and workflow projects
  nullable).
- >-
  Partition spec (rec-4065): all four telemetry contracts' governance.partition_by and telemetry-lexicon's
  temporal.partition values are "year(session_started_at), month(session_started_at), day(session_started_at)"; no
  docs/contracts/*.yaml string outside amendment_log/previous_versions names a bare day(session_started_at),
  "day() partition" or "day()-partition"; every touched contract carries its amendment_log entries (category 6
  and Class D rituals pass); Decision 199 carries the 2026-09-25 Update line; T2.36's roadmap note names the
  calendar-day partition (exit_criteria c1). The live ops tables' identical day(created_timestamp) defect is rec-4068, not this slice.
- >-
  Nothing ships: _CONTRACT_TABLE_IDS gains no telemetry id; `bin/venv-python -m scripts.schema_to_field_semantics
  --check` reports no drift; nothing under config/lambda/ducklake/, src/common/ducklake_*.py or src/lambdas/ducklake_*/
  changes; no changed file matches either deploy workflow's push path globs; data-pipeline excludes src/telemetry
  and compute_affected_artifacts over the kernel files returns no artifact.
- >-
  Plane-neutral (Decision 184 cl.2): src/telemetry runtime imports are the stdlib only (duckdb only under
  TYPE_CHECKING; no python-ulid); src/telemetry/__init__.py re-exports nothing (append_events is reachable only as
  src.telemetry.append, for the future write-boundary verb); .importlinter's src-telemetry-is-plane-neutral contract
  forbids scripts, src.common, src.data and src.lambdas, its scripts-never-import-telemetry-append contract forbids
  scripts from importing src.telemetry.append, and lint-imports passes.
- >-
  SLOC: every created/modified Python file is <= 500 SLOC (tests/test_schema_to_field_semantics.py included) and
  config/sloc_budgets.yaml is unchanged (Decision 128).
- >-
  file-router.yaml carries the telemetry-kernel route and the scripts-root allowlist entry with a Class D
  amendment_log entry; validate_placement passes.
- >-
  rec-4024's context records what slice 1 delivered and the slice-2 obligations, and its acceptance is re-pointed
  from tests/common/test_ducklake_append.py to tests/telemetry/test_append.py::test_append_events_replay_is_noop
  (keeping its field_semantics grep); rec-4025's context records the delivered vector path. rec-4065 closes through
  the squash-merge's Resolves trailer.
- >-
  bin/venv-python -m scripts.validate --pre and the full tier bin/venv-python -m scripts.validate both exit 0.
