slug: telemetry-kernel-identity-append
intent: >-
  Friction-telemetry slice 1 (the kernel half of rec-4024): land the plane-neutral, hermetic, deploy-inert
  telemetry kernel -- the Decision 199 identity derivation with committed golden vectors, the append_events
  MERGE-insert primitive, the generator's table_class event projection branch (unregistered) and an ISO-8601
  tz-aware decode helper -- so slice 2 (writer verb, registration, provisioning) builds on proven, vector-pinned
  code; and correct the telemetry partition spec from day(session_started_at), which DuckLake reads as
  day-of-month, to the calendar-day triple year(), month(), day() (rec-4065, bundled). Friction telemetry is the foundation of automated RCA and recursive self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-kernel-identity-append.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- kernel groundwork only; closes NO exit criterion (c1 needs the
  tables registered/provisioned and field_semantics.yaml regenerated, which is slice 2 / rec-4024).
scope:
- file: src/telemetry/__init__.py
  action: Create
  purpose: >-
    Package marker for the plane-neutral telemetry kernel (Decision 184 cl.2 port rule: runs in the Lambda and
    against a local DuckLake file catalog). Docstring only; names telemetry-event-envelope.yaml as the normative spec.
- file: src/telemetry/timestamps.py
  action: Create
  purpose: >-
    parse_iso8601_utc (tz-aware decode for the future verb edge against a PINNED RFC 3339 grammar regex, not
    datetime.fromisoformat's version-dependent superset: offset required (Z/z or +/-HH:MM); fraction 1-9 digits
    truncated to ms; rejects naive, date-only, basic format, week dates, +HH/+HHMM offsets, 24:00, :60 and non-str;
    normalises to UTC), require_aware_utc, truncate_to_ms (floor, never round) and epoch_ms (exact integer ms,
    rejects pre-epoch and > 2**48-1). One TimestampError(ValueError) type.
- file: src/telemetry/identity.py
  action: Create
  purpose: >-
    The envelope identity spec, exactly: canonical_ulid, canonical_ref (NFC; non-empty; no Unicode Cc/Cs; <= 4096
    UTF-8 bytes; never trimmed or case-folded), a CLOSED DOMAIN_TAGS registry (the four entity tags + four
    '<table>:event' tags; an unknown tag raises), identity_hash (sha256 over 4-byte big-endian length-prefixed NFC
    UTF-8 [tag, tenant_id, project_id, ref]), derive_entity_key (ULID(root session_started_at ms + H[0:10])),
    derive_event_id (ULID(event_timestamp ms + H[0:10]) over external_ref, tag '<table>:event'), decode_time_prefix
    (a held session_id -> its session_started_at; the envelope's sanctioned route for transcript-less producers,
    contract risk R7) and a closed per-table KEY_PLANS registry (column, parent domain tag, caller ref field,
    required) that is the single source of which ref feeds which key column. ULID assembly and canonical ULID
    parsing are STDLIB ONLY (a 26-char Crockford base32 encoder/decoder over the 16 raw bytes; first char <= '7';
    I/L/O/U rejected), because pr-validate installs neither python-ulid nor duckdb (requirements-fast.txt) and the
    graduated VP rows must pass there. One IdentityError(ValueError) type.
- file: src/telemetry/append.py
  action: Create
  purpose: >-
    EventTableSpec (+ from_projection over a generator event entry) and append_events(con, table_spec, rows, *,
    tenant_id, project_id, catalog, now=None) -> AppendResult(submitted, collapsed, inserted). The primitive IS the
    write boundary the contracts name ("populated_by: the write boundary (rec-4024's append_events verb), derived
    from ..."): it derives every KEY_PLANS key and event_id from the caller's refs and REJECTS any caller-supplied
    derived column; stamps tenant_id/project_id (already resolved, canonical) and one created_timestamp; runs a
    strict Python type gate before any SQL; collapses byte-identical intra-batch duplicates and rejects conflicting
    ones; then one transaction, one insert-only MERGE over a typed multi-row VALUES source ON (event_id,
    parser_version) AND session_started_at within the batch's UTC calendar-day range; replay is a no-op. Before
    BEGIN it raises unless current_setting('TimeZone') is 'UTC' (DuckLake evaluates year()/month()/day() in the
    session TimeZone, so a non-UTC writer files a UTC date under the wrong day); it never SETs the caller's zone,
    and its error names the remedy (SET TimeZone='UTC'). The check is exact: DuckDB's default reads 'Etc/UTC',
    'GMT' or 'Etc/Unknown' depending on TZ, all rejected, so callers set it explicitly.
- file: src/telemetry/gate.py
  action: Create
  purpose: >-
    The append primitive's pre-SQL row gate, split out so append.py stays well under 500 SLOC: unknown/derived
    column rejection, strict per-sql_type Python type checks (bool is never int; finite doubles; int64 range;
    tz-aware datetimes converted to UTC and ms-truncated; list[str]), NOT NULL checks, and intra-batch duplicate
    handling (collapse byte-identical, reject conflicting). Pure; stdlib only.
- file: scripts/field_semantics_event_projection.py
  action: Create
  purpose: >-
