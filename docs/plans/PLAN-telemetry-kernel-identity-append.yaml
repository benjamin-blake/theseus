constraints:
- >-
  Deploy inertness (the V2 ground): no change to src/common/ducklake_*.py, src/lambdas/ducklake_*/**, config/lambda/ducklake/**
  (field_semantics.yaml and field_semantics.static.yaml included) or the deploy workflows; do not add telemetry
  ids to _CONTRACT_TABLE_IDS; do not regenerate field_semantics.yaml. If any of these becomes necessary, STOP and
  report -- the slice would become V3.
- >-
  Decision 128: config/sloc_budgets.yaml is untouched; any file nearing 500 SLOC is decomposed (facade pattern for
  source; parametrize/split for tests), never raised. src/common/ducklake_scd2_schema.py (474/500) is not touched.
- >-
  Plane-neutral (Decision 184 cl.2): src/telemetry imports only the stdlib at runtime (python-ulid only inside a
  test's importorskip cross-check); duckdb only under TYPE_CHECKING; no boto3/botocore, src.common.ducklake_*, src.lambdas.* or scripts.* imports. No exception
  at import time (AGENTS.md).
- >-
  Do not re-litigate Decisions 199/200. Ratified telemetry contract edits are limited to the envelope's vector
  pointer and the rec-4065 partition respelling (calendar day was always the intent). If a real contract cannot be
  projected, STOP and report. The ops tables' day(created_timestamp) defect (rec-4068) is out of scope: no change to
  ops contracts, config/lambda/ducklake/** or src/common/ducklake_*.py.
- >-
  SQL safety: every value is a bound parameter; only validated identifiers are interpolated; no eval/exec.
- >-
  The primitive is the id-deriving write boundary (keys and event_id from refs, never caller-supplied) but mints
  nothing except created_timestamp and never retries (OCC retry, row caps, the implausible-event_timestamp skew
  check, project_ref/tenant resolution and registration belong to the writer verb, rec-4024). parent_observation_id
  existence is NOT checked at append (contract risk R3, filed as a slice-2 blocker). Read-side dedupe is not this
  slice.
- >-
  Golden vectors are generated from an independent derivation (never by calling src.telemetry) and committed
  ASCII-only; no emojis anywhere; plain ASCII hyphens.
- Every behaviour change lands with a test that fails without it (AGENTS.md); no rescue agents or workaround loops (Decision 55).
