execution_steps:
- >-
  Confirm VP step 1. Read src/common/ducklake_event_read_sql.py (compose, dedupe_ctes, the window scope), the
  EventRead registry and bind_values, the reader smoke's _telemetry_read_checks, lambda_telemetry and the append and
  blob gates' send path, and scripts/telemetry_capture/transport.py.
- >-
  The verbs: TELEMETRY_JOINS and MAX_TREE_ROWS data, the three templates, the tree binding and max_rows clamp,
  VERB_FIELDS. Then tests/common/test_ducklake_event_reads.py's two nodes (VP step 6).
- >-
  scripts/telemetry_verify/orphans.py and rows.py with their mirror tests, and the boundary allow-list's yaml entry (VP
  step 2).
- >-
  docs/contracts/ducklake_reader.yaml, two audit_invariants appended after the transcript_content entries: (1)
  "Verification verbs (telemetry slice 4, rec-4025; none agent-facing; smoke catalog only until slice 2c, rec-4292):
  session_tree_rows(session_id, offset, max_rows) returns every stored row of one root session's tree (all four tables,
  every parser_version, no dedupe) as table_name, row_json and total_rows, scoped to the root's calendar-day partition
  and its session_started_at pin, max_rows at most 2000; telemetry_orphan_counts(day_from, day_to, as_of) returns per
  day and telemetry join the child rows, the orphaned child rows split by whether their tree is quiescent past the idle
  threshold, the quiescent and pending tree counts and the conflicted grain-key count, over R4/R5-deduped rows of
  real-purpose projects; telemetry_root_sessions(day_from, day_to) returns each real-purpose root session's session_id,
  entity_ref, harness_session_key, branch, session_started_at and last_event_timestamp. Windows span at most 7 days." (2) "Exception to
  'Rows are derived, never raw' above: session_tree_rows returns the stored rows of exactly one root session's tree,
  every column but telemetry_transcripts.content, for verification callers inside the data plane; a page above the
  envelope guard answers 413 response_too_large and the caller lowers max_rows. Its callers print counts only." Plus
  an amendment_log entry (governance_note_add, semantic_break false).
- >-
  tests/common/test_ducklake_event_verification_verbs.py over the golden chain: test_tree_rows_return_every_stored_row_exactly_once
  (every corpus and verification tree: the decoded rows equal the stored rows minus content, by grain key and every
  column), test_tree_rows_page_to_the_same_set_at_any_page_size (max_rows 1, 7 and 2000), test_orphan_counts_match_the_independent_count
  (finalized trees report zero; a planted child row whose parent is absent, inserted directly, reads pending at an
  exact-threshold as_of and quiescent past it; the verb equals orphans.orphan_counts on every case),
  test_telemetry_joins_restate_the_contract, and test_root_sessions_carry_join_keys_for_real_projects_only
  (a root sessions row carrying harness_session_key, inserted directly, returns it; a parser_version 3 tree returns
  null; a synthetic and a drill project's roots excluded).
- >-
  scripts/ducklake_smoke/lambda_telemetry_golden_gates.py and its wiring and tests (VP steps 7-9); the reader smoke
  checks (VP step 8).
- >-
  The alarm source. Append to config/agent/data_quality/source_registry.yaml: canonical_id telemetry_verify;
  description "Telemetry verification findings (telemetry slice 4, rec-4025): the in-session source check compares a
  captured session's stored rows with a fresh re-parse of its transcript and its tokens with Claude Code's cost-state
  ledger; the daily verification monitor re-derives sampled sessions' verb outputs, counts orphans and compares
  captured sessions with the harness session lists."; signal_interpretation "Alarm-not-gate (Decision 210 cl.3,
  Decision 61) -- one deduped rec per finding class (update_rec on persistence; no duplicate filing). Volume tracks how
  often stored telemetry disagrees with its source or its contract derivations and should be zero; declared residual
  classes (owner recs named in the finding) are counted, never filed. Never blocks capture, merges or deploys." Then
  run bin/venv-python -m scripts.schema_to_field_semantics; its diff must be exactly telemetry_verify added to each
  registry-sourced accepted_values list. Any other diff means main's projection drifted: stop and escalate to the
  coordinator, never commit unrelated projection changes. Then tests/telemetry_verify/test_alarm_source.py (VP step 2).
- Execute VP steps 1-11; loop until each passes.
- Code review (the code-review skill in a fresh context); fix every blocking finding.
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the readiness
  check; set implementation_declared true; rebase on origin/main and re-run VP step 1; VP step 12 on the committed, clean tree, then
  scripts.checks.validation_result --verify-head; the postflight evidence file and scripts.session.postflight
  --evidence; push; PR; CI green on the head. No Resolves trailer (rec-4025 stays open). Merge on code review PROCEED and
  green CI under the standing rule (a CI-run DuckLake deploy with no IAM, spend or manual step and no Class A text), only
  when no other DuckLake deploy or apply is in flight.
- >-
  After merge, VP steps 13-16 against the deploy run for the merge commit; then update rec-4025's context through the
  portal with the merge SHA and the GOLDEN_SMOKE line. On an unrecoverable V3 failure stop and RCA (Decision 55).
- "Report: what was implemented, each VP step's output (the GOLDEN_SMOKE line and step 16's counts verbatim), and any finding filed."
rollback: >-
