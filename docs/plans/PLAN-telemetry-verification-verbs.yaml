constraints:
- >-
  The three verbs are not agent-facing, carry no tenant predicate and read the smoke catalog only, like every event
  verb until slice 2c (rec-4292 lifts the pin together with tenant-scoped reads). No verb returns
  telemetry_transcripts.content; transcript payloads stay with transcript_content.
- >-
  No change to any existing verb's SQL, data or read_version (VP step 6), to the writer, the producer or the kernel. The
  golden gate reads two data files under tests/ (the derived_golden files and the corpus case JSON) and imports no tests
  module.
- >-
  Nothing prints or raises a row value: smoke lines and failures carry counts, tree names and verb names only (Decision
  101; the smoke runs in public CI logs).
- >-
  SLOC (Decision 128): every Python file in scope stays under 500 SLOC (src/common/ducklake_reader_client.py is at 405,
  ducklake_event_reads.py at 280, ducklake_event_read_sql.py at 232, lambda_ec_gates.py at 299); a file that would not is
  split behind its facade, listed in the report; a budget raise is never the fix.
- No Terraform, IAM, writer change or Decision text. No rescue agents or workaround loops (Decision 55).
