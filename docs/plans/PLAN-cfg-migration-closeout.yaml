  - "Two false claims this plan corrects: contract-population.yaml subject_namespace.non_seedable_exception asserts scripts/roadmap/platform_roadmap.py parses the ledger (that module has no docs/contracts reference at all); exit-criteria-ledger.yaml governance_notes asserts validate_contract_drift 'skips' files with no contract: key (it buckets them as grandfathered DEBT)."
