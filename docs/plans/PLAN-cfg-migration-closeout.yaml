  - "Decision 179 pt 5(ii) authorizes (a) and already names rec-3243 as the owner of amendment metering -- not a new commitment, do not mint one. Decision 136 (dec-136, 2026-07-16) ratified CD.39, the exit-criteria ledger mechanism: it is (b)'s ratified_via, resolving the no-mintable-ratification-event problem."
  - "Scout flag resolved (Decision 128): decision-entry.yaml measures exactly 500 effective lines against a 508 pin under an operator FREEZE; a tight draft costs ~15 lines vs 8 headroom. Operator chose compact-while-adding to land <500, retiring the note via its own retires_when. A raise is unavailable (Decision 165 needs a Decision body naming the entry; dec-179 does not)."
  - "Scout flag resolved (Decision 168): decision-entry.yaml is ITSELF Class D, so its edit needs its own amendment_log entry, not just contract-population.yaml's."
  - "Scout flag resolved (Decision 170): WARN legs live strictly inside the fall-through path, outside examined() -- which is why docs/contracts/check-accounting.yaml is deliberately NOT in scope."
  - "Scout flag resolved (Decision 163): a never-gating WARN is the declared-but-ungated shape, so size_governance must carry a named flips_to_hard_fail_when trigger."
