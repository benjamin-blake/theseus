schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "cfg-migration-closeout"
intent: >-
  Close the three residuals of the contract-first-governance migration ledger: make
  annotation accretion on decision entries visible (WARN telemetry, never a gate), declare
  the last undeclared docs/contracts file with an honest shape, and run CFG-05's one-time
  duplicate-subject recall pass over the now-fully-declared contract population. Governance
  the platform can see is governance it can steer -- this closes the migration's last
  measurement and population gaps without minting a numbered Decision.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-cfg-migration-closeout.yaml
phase: >-
  T2.56
scope:
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Add the WARN-tier accretion signal (two legs) and a baseline_body_reader injection seam.
      Must never append to `failed` and must not alter the existing five terminal declarations.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      size_governance gains the accretion_signal block; intent_accretion_note's now-false
      "no validator, no stored guard" sentence is corrected; plus the Class D amendment_log
      entry its own change_detection rule requires. Must land at or under 500 effective lines,
      paid for by amendment_log compaction (see execution_steps -- the arithmetic is load-bearing).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Convert free-form -> Class A ritual contract (contract: block + fields: mapping). Also
      sweeps the retired ops_plans reference to ops_execution_plans (rec-3213).
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Retire subject_namespace.non_seedable_exception, correct its false evaluator claim,
      lower ratchet.grandfathered_max 17 -> 16, record the CFG-05 recall sweep outcome in
      honesty_clauses, add the required amendment_log entry.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Retire the docs/contracts/decision-entry.yaml budgets entry AND its frozen budget_notes
      entry together, once the file lands at or under 500 effective lines. Removal only --
      frozen_base_violations names this exact pairing "the prescribed retirement".
  - file: audits/contract-first-governance-33c8667.yaml
    action: Modify
    purpose: >-
      Append a dated `amendment_YYYY-MM-DD:` line INSIDE the audit.meta.contract_notes block
      scalar (there is no audit.migration key -- see context), recording all three residuals
      closed and the CFG-05 sweep outcome, mirroring the amendment_2026-08-24 line's form.
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: >-
      TestAmendmentDeltaCap (rec-3243's acceptance selector, verbatim) plus WARN-never-fails,
      standing-pressure, and declaration-preservation coverage.
  - file: tests/checks/contracts/validate_contract_drift/test_real_population.py
    action: Modify
    purpose: >-
      Assert exit-criteria-ledger.yaml now loads as a valid Class A ritual contract; correct
      the stale roster comment naming it the non-seedable exception.
bundled_recommendations:
  - rec-3243
  - rec-3213
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_decisions_size emits a WARN naming the byte delta and new span for a BASELINE
    decision entry whose body CHANGED SIZE in the diff (delta != 0, not delta > 0 -- see the
    Decision 178 note in context) and whose new span exceeds 6,144 bytes, and NEVER appends to
    `failed` for any accretion condition.
  - >-
    validate_decisions_size emits exactly one aggregate standing-pressure line counting entries
    over 6,144 x 1.2 bytes. Measured at plan time: 23 live + 1 archive = 24 across both corpus
    files (the separate "35 over the plain cap" figure is LIVE-ONLY -- do not conflate the bases).
  - >-
    The module's five terminal registry.examined()/registry.skipped() declarations are
    unchanged in count and placement, and the examined() unit still counts only NEW entries.
  - >-
    docs/contracts/exit-criteria-ledger.yaml declares contract.class A and passes the three
    DISCRIMINATING ritual legs: load_contract, resolve_refs, check_required_inline_fields.
    (check_re_ratification_trigger also runs but is vacuous at status: ratified -- it returns []
    unless status is provisional_v0, so it is not evidence of anything.)
  - >-
    validate_contract_drift passes against the real population with census grandfathered=16,
    ritual=16 and skipped=0, and contract-population.yaml's ratchet.grandfathered_max equals 16.
  - >-
    docs/contracts/decision-entry.yaml measures AT OR UNDER 500 effective lines (the gate is
    `if eff > limit`), and both its config/structural_size_budgets.yaml budgets entry and its
    frozen budget_notes entry are gone.
  - >-
    Both edited Class D contracts (decision-entry.yaml, contract-population.yaml) carry a
    genuinely NEW dated amendment_log entry -- a date absent from the origin/main version, not
    merely an edited existing entry.
  - >-
    The CFG-05 recall sweep is executed over all governed contracts; every real overlap is
    filed as a recommendation through the ops portal (never fixed inline), and the outcome is
    recorded in BOTH homes naming the sweep date, the number of contracts compared, and either
    the filed rec ids or an explicit EMPTY token.
  - >-
    rec-3213's acceptance holds: exit-criteria-ledger.yaml contains no whole-word ops_plans
    and does contain ops_execution_plans.
  - >-
    No live surface still names exit-criteria-ledger.yaml as the non-seedable exception
    (stale-reference sweep for the retired surface).
  - No numbered Decision is added to docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove the WARN tier never gates: an accretion condition severe enough to warn must leave
      `failed` empty. This is the load-bearing safety property of the whole (a) leg.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'warn_never_fails or WarnNeverFails'"
    expected: >-
      Tests pass; the accretion legs assert `failed == []` while WARN text is present on stdout.
      (A zero-match -k exits 5, so this step cannot pass vacuously.)
    fix_if: >-
      A failure here means the WARN leg appended to `failed` -- it is a gate, not telemetry.
      Remove the append; the legs must only print.
    graduation: graduate
    graduation_check_id: decisions-size-warn-never-fails
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      Exercise the amendment-delta leg end to end via the injected baseline_body_reader seam:
      a baseline entry whose span CHANGED and now exceeds the cap WARNs and names both delta
      and new span; a changed-but-under-cap entry stays silent; an unchanged baseline entry
      stays silent; a SHRUNK over-cap entry still WARNs (delta != 0, per the Decision 178 note);
      a new-in-diff entry still HARD-FAILS through the existing per-entry cap (no regression).
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py::TestAmendmentDeltaCap -q"
    expected: >-
      All TestAmendmentDeltaCap cases pass. This selector is rec-3243's acceptance command
      verbatim -- the class name must match exactly.
    fix_if: >-
      Silence on a changed-past-cap entry means the leg compares the wrong span or the body
      reader returned None; a WARN on an unchanged entry means the delta comparison is absent
      and it is really a static over-cap rule.
    graduation: waive
    graduation_waiver_reason: >-
      The named pytest class IS rec-3243's standing acceptance selector and is already a
      permanent repo test; graduating it would create a second identity for the same guard, and
      the registry row would then need keeping in lockstep with a selector the rec already pins.
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify the standing-pressure aggregate is exactly ONE line (not one per entry), so the
      operator brief's >20%-over-cap ask lands as telemetry rather than a 24-line noise floor.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'standing_pressure'"
    expected: "Tests pass; the aggregate leg emits a single line carrying a count and the largest offender."
    fix_if: >-
      More than one line means the aggregate leg is iterating per entry -- collapse it to a
      single summary line.
    graduation: graduate
    graduation_check_id: decisions-size-standing-pressure-single-line
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      Regression-guard the Decision 170 declaration discipline: all five reachable exit paths
      still carry exactly one terminal declaration, and examined() still counts NEW entries only.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'DeclarationAdoption'"
    expected: "All TestDeclarationAdoption cases pass unchanged from the pre-change baseline."
    fix_if: >-
      A failure means the WARN legs were placed on a declaration path or changed the examined
      population; move them strictly inside the fall-through, before its single examined() call.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the already-standing TestDeclarationAdoption suite, which validate_check_accounting
      independently enforces repo-wide; a registry row would be a third surface for one property.
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove the converted ledger is a genuine Class A ritual contract by driving it through the
      three DISCRIMINATING Class A legs (load_contract, resolve_refs, check_required_inline_fields),
      not by grepping for a contract: block.
    command: "bin/venv-python -c \"import pathlib; from scripts.contracts import load_contract, resolve_refs; from scripts.contracts_enforcement import check_required_inline_fields; p=pathlib.Path('docs/contracts/exit-criteria-ledger.yaml'); d=load_contract(p); resolve_refs(d, p.parent); e=check_required_inline_fields(d); assert d.contract.class_.value=='A', d.contract.class_; assert not e, e; assert d.contract.ratified_via and 'dec-136' in d.contract.ratified_via, d.contract.ratified_via; print('CLASS A OK', d.contract.id, sorted(d.fields))\""
    expected: >-
      Prints CLASS A OK with contract id exit-criteria-ledger and the field roster; zero
      check_required_inline_fields errors; ratified_via names dec-136.
    fix_if: >-
      check_required_inline_fields errors name a field missing description/semantics/populated_by/
      dq_intent -- every inline Class A field needs all four. A ContractDocument extra="forbid"
      error names a legacy top-level key still needing relocation under contract:/fields:.
    graduation: graduate
    graduation_check_id: exit-criteria-ledger-is-class-a
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: >-
      Run the real-population drift gate and assert the census moved exactly as predicted, with
      the equality-bound pin moved in the same change. skipped==0 is load-bearing: the pin
      binding is SUPPRESSED when skipped>0, so a malformed conversion could otherwise pass
      the pin check silently.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift/test_real_population.py -q && bin/venv-python -c \"import re,pathlib,io,contextlib; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift; f=[]; buf=io.StringIO(); ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); validate_contract_drift(f, contracts_dir=pathlib.Path('docs/contracts')); ctx.__exit__(None,None,None); out=buf.getvalue(); print(out); assert f==[], f; c=dict(p.split('=') for p in re.search(r'Census:(.*)', out).group(1).split()); assert c['grandfathered']=='16', c; assert c['ritual']=='16', c; assert c['skipped']=='0', c; y=pathlib.Path('docs/contracts/contract-population.yaml').read_text(); assert re.search(r'grandfathered_max:\\s*16', y), 'pin not lowered to 16'; print('CENSUS+PIN OK')\""
    expected: "Gate passes with failed == []; census grandfathered=16 ritual=16 skipped=0; pin reads 16."
    fix_if: >-
      A pin-vs-census inequality error means the pin and the conversion did not land together --
      fix the pin, never the census. A smuggling error means the file was given a Class D
      envelope instead of Class A. skipped>0 means the converted file failed to load at all.
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift already fails CI on any pin-vs-census inequality via its own
      pin_binding rule, and the census values are a point-in-time population fact that changes
      with the next contract landing; a registry row asserting 16 would become a false
      regression the moment a new contract lands.
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify the size-budget resolution: decision-entry.yaml declares the accretion_signal with
      its flip trigger, measures at or under 500 effective lines, and both its budgets entry and
      its frozen budget_notes entry are retired together.
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<=500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    expected: "Prints CONTRACT+SIZE+BUDGET OK with a line count at or under 500; no decision-entry.yaml reference remains in the budgets file."
    fix_if: >-
      Over 500 means compaction did not offset the additions. Do NOT reach for a raise: the
      operative bar is budget_raises.frozen_base_violations LEG 1 -- an entry frozen in BASE
      whose value increased fails "regardless of any marker", and legs 2 and 3 close the
      unfreeze-then-raise and deferral bypasses. (A `# raise-approved: dec-175` marker WOULD
      satisfy Decision 165's authorization test; the freeze is a separate, direction-only rule
      that overrides it.) Compact further within the amendment_log, or defer detail per the
      contracts-class relief_valve; splitting the file is forbidden by collocation doctrine.
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot migration assertion, not a standing invariant: once the entry is retired the
      budget half is vacuously true forever, and pinning "<=500" as a permanent guard would
      silently re-impose a budget the retirement deliberately removes.
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove BOTH edited Class D contracts carry a genuinely NEW dated amendment_log entry. The
      gate's own rule is insufficient here: it compares entry objects, so COMPACTING an existing
      entry already makes it "not in base_log" and passes -- and this plan compacts entries by
      design. Assert a new DATE, not merely a new object.
    command: "bin/venv-python -c \"import yaml,pathlib,subprocess; ok=True\nfor rel in ('docs/contracts/decision-entry.yaml','docs/contracts/contract-population.yaml'):\n    head=yaml.safe_load(pathlib.Path(rel).read_text())\n    base=yaml.safe_load(subprocess.run(['git','show','origin/main:'+rel],capture_output=True,text=True).stdout)\n    hd={e['date'] for e in (head.get('amendment_log') or [])}\n    bd={e['date'] for e in (base.get('amendment_log') or [])}\n    new=hd-bd\n    print(rel,'-> new amendment dates:',sorted(new) or 'NONE')\n    ok = ok and bool(new)\nassert ok, 'a Class D contract changed with no NEW-dated amendment_log entry'\nprint('AMENDMENT_LOG OK')\""
    expected: "Both files print at least one new amendment date, then AMENDMENT_LOG OK."
    fix_if: >-
      NONE for a file means its amendment_log was only edited, not extended -- add an entry with
      a genuinely new date, semantic_break, a change_class from the closed 8-value vocabulary,
      and a summary.
    graduation: waive
    graduation_waiver_reason: >-
      The new-DATE property is specific to this plan's compact-and-extend edit; the standing
      guard is validate_contract_drift's own amendment_log rule, which runs on every Class D
      PR. A permanent registry row asserting a new date would false-positive on any future PR
      that legitimately touches neither contract.
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify rec-3213's bundled closure using its own acceptance command, and sweep the retired
      non_seedable_exception surface in the same step (no live surface may still name the ledger
      as the non-seedable exception).
    command: "! grep -rqw ops_plans docs/contracts/exit-criteria-ledger.yaml && grep -q 'ops_execution_plans' docs/contracts/exit-criteria-ledger.yaml && ! grep -rq 'non_seedable_exception' docs/contracts/ scripts/ tests/ && echo 'REC-3213 + STALE-REF SWEEP OK'"
    expected: "Prints REC-3213 + STALE-REF SWEEP OK."
    fix_if: >-
      A whole-word ops_plans survived the Class A restructure, or a live surface still names
      non_seedable_exception. Both must be swept; the retired exception may survive only as
      amendment history, never as a live rule.
    graduation: waive
    graduation_waiver_reason: >-
      Both halves are one-shot retirement assertions that close with rec-3213 and the surface
      retirement; once swept they are permanently vacuous, so a standing registry row guards
      nothing.
  - step: 10
    phase: pre-deploy
    hermetic: false
    action: >-
      Prove the CFG-05 sweep was performed AND recorded in both homes, discriminating a real
      record from a pasted string: a genuinely NEW dated amendment line inside
      audit.meta.contract_notes (diffed against origin/main, so it cannot pass on the existing
      2026-08-24 line) that names CFG-05, the contract count compared, and either filed rec ids
      or an explicit EMPTY token -- with the same evidence mirrored in the honesty clause.
    command: "bin/venv-python -c \"import yaml,pathlib,subprocess,re; rel='audits/contract-first-governance-33c8667.yaml'; head=yaml.safe_load(pathlib.Path(rel).read_text())['audit']['meta']['contract_notes']; base=yaml.safe_load(subprocess.run(['git','show','origin/main:'+rel],capture_output=True,text=True).stdout)['audit']['meta']['contract_notes']; hl=[l.strip() for l in head.splitlines() if l.strip().startswith('amendment_')]; bl=[l.strip() for l in base.splitlines() if l.strip().startswith('amendment_')]; new=[l for l in hl if l not in bl]; assert len(new)==1, ('expected exactly one new amendment line inside audit.meta.contract_notes, got', new); r=new[0]; assert 'CFG-05' in r, 'sweep record does not name CFG-05'; assert re.search(r'[0-9]+ contracts', r), 'sweep record names no contract count'; assert re.search(r'rec-[0-9]+', r) or 'EMPTY' in r, 'record names neither filed rec ids nor an explicit EMPTY'; h=yaml.safe_load(pathlib.Path('docs/contracts/contract-population.yaml').read_text())['honesty_clauses']['subject_uniqueness_is_precision_not_recall']; assert re.search(r'20[0-9][0-9]-[0-9]{2}-[0-9]{2}', h), 'honesty clause carries no sweep date'; assert re.search(r'rec-[0-9]+', h) or 'EMPTY' in h, 'honesty clause records no outcome'; print('SWEEP RECORDED OK'); print(r[:200])\""
    expected: >-
      Prints SWEEP RECORDED OK and the new ledger line, which names CFG-05, an N-contracts
      count, and either rec ids or EMPTY; the honesty clause carries a date and the same outcome.
    fix_if: >-
      "expected exactly one new amendment line" means the record went somewhere other than
      audit.meta.contract_notes (there is NO audit.migration key -- see context) or was written
      twice. A missing count or outcome token means the record is unfalsifiable prose; an
      unrecorded sweep is indistinguishable from one never run, which is what CFG-05 exists to close.
    graduation: waive
    graduation_waiver_reason: >-
      A one-time sweep record: once landed, "exactly one new amendment line vs origin/main"
      becomes false on the very next audit-ledger amendment, so a standing registry row would
      false-positive on unrelated future work.
  - step: 11
    phase: pre-deploy
    hermetic: false
    action: >-
      Confirm no numbered Decision was minted (the operator's hard constraint) by comparing the
      live decision-header set against origin/main.
    command: "bin/venv-python -c \"import subprocess; from scripts.decisions_md import iter_decision_headings; live=open('docs/DECISIONS.md',encoding='utf-8').read(); base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True).stdout; a={int(m.group(1)) for m in iter_decision_headings(live)}; b={int(m.group(1)) for m in iter_decision_headings(base)}; assert a==b, f'new decision headers minted: {sorted(a-b)}'; print('NO NEW DECISION OK', len(a), 'headers unchanged')\""
    expected: "Prints NO NEW DECISION OK with an unchanged header count (133 at plan time)."
    fix_if: >-
      A new header means content was routed to a numbered Decision instead of the contract
      governance note / rec home that decision-entry.yaml's significance.routing prescribes.
    graduation: waive
    graduation_waiver_reason: >-
      Scoped to THIS plan's no-mint constraint, not a repo invariant: minting Decisions is the
      normal, sanctioned path, so a standing "no new decision headers vs origin/main" registry
      row would false-positive on every legitimate future Decision.
  - step: 12
    phase: pre-deploy
    hermetic: false
    action: >-
      Run the authoritative fast-tier presubmit over the whole change.
    command: "bin/venv-python -m scripts.validate --pre"
    expected: "All checks pass, exit 0."
    fix_if: >-
      Diagnose and fix on the branch. Do NOT use --ignore-budget to get past a wall-clock
      breach; the preflight already records 4 recent bypasses.
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    hermetic: false
    action: >-
      Run the FULL validation tier before commit/PR, as
      handoff_policy.full_validation_required_before_commit declares. Required by
      validate_handoff_full_tier (registered in BOTH tiers per Decision 163): a plan declaring
      the policy with no full-tier VP step fails the gate.
    command: "bin/venv-python -m scripts.validate"
    expected: "Completed full-tier run exits 0."
    fix_if: >-
      On timeout, handoff_policy.timeout_disposition is `blocked` -- resume later and rerun the
      full tier from the start; do not commit on a partial run.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/validate_decisions_size.py
    behavior: >-
      The accretion signal WARNs on a baseline entry whose span changed and now exceeds the cap,
      stays silent otherwise, and NEVER appends to `failed` under any accretion condition.
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestAmendmentDeltaCap
    red_green_expectation: >-
      Red before (the class does not exist and the module has no accretion leg at all -- an
      entry grown from 5,775 to 6,389 bytes produces no output); green after.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      The file is a loadable Class A ritual contract whose every inline field carries the four
      required descriptor keys, and whose ratified_via names dec-136.
    verification_step: 6
    test_selector: tests/checks/contracts/validate_contract_drift/test_real_population.py::TestRealPopulationRegression::test_real_population_passes_with_baseline_legs_enabled
    red_green_expectation: >-
      Red before (the file is unshaped and the census reports grandfathered=17, so with the pin
      at 16 the run fails; with the pin left at 17 the conversion makes it fail the other way);
      green only when conversion and pin land together.
  - source: docs/contracts/contract-population.yaml
    behavior: >-
      The equality-bound grandfathered_max pin tracks the live census after the conversion, and
      the retired non_seedable_exception no longer claims an evaluator that does not exist.
    verification_step: 6
    test_selector: tests/checks/contracts/validate_contract_drift/test_real_population.py::TestRealPopulationRegression::test_real_population_passes_with_baseline_legs_enabled
    red_green_expectation: >-
      Red before if the pin is left at 17 after the conversion -- pin_binding fails on inequality
      in EITHER direction, and this selector asserts `failed == []`. NOTE: TestContractPopulationSelfHosting
      canNOT go red here; the pin error string carries no filename, so it never matches that
      test's substring assertion.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      size_governance declares the WARN tier and its flip-to-hard-fail trigger, and the file
      stays at or under 500 effective lines with its budget entry retired.
    verification_step: 7
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<=500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    red_green_expectation: >-
      Red before (no accretion_signal key exists and the file measures exactly 500 with its
      budgets entry present); green after.
  - source: config/structural_size_budgets.yaml
    behavior: >-
      The decision-entry.yaml budgets entry and its frozen budget_notes entry are retired
      together, never separately (a note outliving its entry, or vice versa, is drift that
      _e4_frozen_note_integrity fails).
    verification_step: 7
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<=500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    red_green_expectation: "Red before (two references present: the budgets pin and the frozen note); green after."
  - source: audits/contract-first-governance-33c8667.yaml
    behavior: >-
