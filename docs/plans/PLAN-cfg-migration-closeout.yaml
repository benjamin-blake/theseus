schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "cfg-migration-closeout"
intent: >-
  Close the three residuals of the contract-first-governance migration ledger: make
  annotation accretion on decision entries visible (WARN telemetry, never a gate), declare
  the last undeclared docs/contracts file with an honest shape, and run CFG-05's one-time
  duplicate-subject recall pass over the now-fully-declared contract population. Governance
  the platform can see is governance it can steer -- this closes the migration's last
  measurement and population gaps without minting a numbered Decision.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-cfg-migration-closeout.yaml
phase: >-
  T2.56
scope:
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Add the WARN-tier accretion signal (two legs) and a baseline_body_reader injection seam.
      Must never append to `failed` and must not alter the existing five terminal declarations.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      size_governance gains the accretion_signal block (tier, both legs, flip-to-hard-fail
      trigger); plus the Class D amendment_log entry its own change_detection rule requires.
      Must land UNDER 500 effective lines (see execution_steps compaction step).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Convert free-form -> Class A ritual contract (contract: block + fields: mapping). Also
      sweeps the retired ops_plans reference to ops_execution_plans (rec-3213).
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Retire subject_namespace.non_seedable_exception, correct its false evaluator claim,
      lower ratchet.grandfathered_max 17 -> 16, record the CFG-05 recall sweep outcome in
      honesty_clauses, add the required amendment_log entry.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Retire the docs/contracts/decision-entry.yaml budgets entry AND its frozen budget_notes
      entry together, once the file lands under 500 effective lines (the note's own
      retires_when branch). Removal only -- gated_direction is "up", so this is unrestricted.
  - file: audits/contract-first-governance-33c8667.yaml
    action: Modify
    purpose: >-
      Dated amendment_2026-09-01 key on audit.migration recording all three residuals closed
      and the recall sweep's outcome, mirroring the amendment_2026-08-24 empty-wave form.
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: >-
      TestAmendmentDeltaCap (rec-3243's acceptance selector, verbatim) plus WARN-never-fails,
      standing-pressure, and declaration-preservation coverage.
  - file: tests/checks/contracts/validate_contract_drift/test_real_population.py
    action: Modify
    purpose: >-
      Assert exit-criteria-ledger.yaml now loads as a valid Class A ritual contract; correct
      the stale roster comment naming it the non-seedable exception.
bundled_recommendations:
  - rec-3243
  - rec-3213
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_decisions_size emits a WARN naming the byte delta and new span for a BASELINE
    decision entry whose body grew in the diff and whose new span exceeds 6,144 bytes, and
    NEVER appends to `failed` for any accretion condition.
  - >-
    validate_decisions_size emits exactly one aggregate standing-pressure line counting
    baseline entries currently over 6,144 x 1.2 bytes (24 against the tree at plan time).
  - >-
    The module's five terminal registry.examined()/registry.skipped() declarations are
    unchanged in count and placement, and the examined() unit still counts only NEW entries.
  - >-
    docs/contracts/exit-criteria-ledger.yaml declares contract.class A, loads through
    load_contract + resolve_refs, and passes check_required_inline_fields and
    check_re_ratification_trigger with zero errors.
  - >-
    validate_contract_drift passes against the real population with census grandfathered=16
    and ritual=16, and contract-population.yaml's ratchet.grandfathered_max equals 16.
  - >-
    docs/contracts/decision-entry.yaml measures under 500 effective lines, and both its
    config/structural_size_budgets.yaml budgets entry and its frozen budget_notes entry are gone.
  - >-
    Both edited Class D contracts (decision-entry.yaml, contract-population.yaml) carry a new
    dated amendment_log entry, satisfying check_amendment_log_for_class_d.
  - >-
    The CFG-05 recall sweep is executed over all governed contracts; every real overlap is
    filed as a recommendation through the ops portal (never fixed inline), and the outcome --
    including an empty outcome -- is recorded in BOTH the audit ledger and contract-population.yaml.
  - >-
    rec-3213's acceptance holds: exit-criteria-ledger.yaml contains no whole-word ops_plans
    and does contain ops_execution_plans.
  - No numbered Decision is added to docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove the WARN tier never gates: an accretion condition severe enough to warn must leave
      `failed` empty. This is the load-bearing safety property of the whole (a) leg.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'warn_never_fails or WarnNeverFails'"
    expected: "Tests pass; the accretion legs assert `failed == []` while WARN text is present on stdout."
    fix_if: >-
      A failure here means the WARN leg appended to `failed` -- it is a gate, not telemetry.
      Remove the append; the legs must only print.
    graduation: graduate
    graduation_check_id: decisions-size-warn-never-fails
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      Exercise the amendment-delta leg end to end via the injected baseline_body_reader seam:
      a baseline entry grown past the cap WARNs and names both the delta and the new span; a
      baseline entry grown but still under the cap stays silent; a new-in-diff entry still
      HARD-FAILS through the existing per-entry cap (no regression).
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py::TestAmendmentDeltaCap -q"
    expected: >-
      All TestAmendmentDeltaCap cases pass. This selector is rec-3243's acceptance command
      verbatim -- the class name must match exactly.
    fix_if: >-
      Silent on a grown-past-cap entry means the leg compares the wrong span or the body reader
      returned None; a WARN on an ungrown entry means the delta comparison is absent and it is
      really a static over-cap rule.
    graduation: waive
    graduation_waiver_reason: >-
      The named pytest class IS rec-3243's standing acceptance selector and is already a
      permanent repo test; graduating it into the verification registry would create a second
      identity for the same guard, and the registry row would then have to be kept in lockstep
      with a selector the rec already pins.
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify the standing-pressure aggregate is exactly ONE line (not one per entry), so the
      audit's literal >20%-over-cap ask lands as telemetry rather than a 24-line noise floor.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'standing_pressure'"
    expected: "Tests pass; the aggregate leg emits a single line carrying a count and the largest offender."
    fix_if: >-
      More than one line means the aggregate leg is iterating per entry -- collapse it to a
      single summary line.
    graduation: waive
    graduation_waiver_reason: >-
      Output-shape assertions (one line, not N) are not one of the six canonical primitive
      slots -- the property is "cardinality of printed lines", which no slot expresses without
      a bespoke command; it is covered permanently by the repo test instead.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      Regression-guard the Decision 170 declaration discipline: all five reachable exit paths
      still carry exactly one terminal declaration, and examined() still counts NEW entries only.
    command: "bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -q -k 'DeclarationAdoption'"
    expected: "All TestDeclarationAdoption cases pass unchanged from the pre-change baseline."
    fix_if: >-
      A failure means the WARN legs were placed on a declaration path or changed the examined
      population; move them strictly inside the fall-through, before its single examined() call.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the already-standing TestDeclarationAdoption suite, which validate_check_accounting
      independently enforces repo-wide; a registry row would be a third surface for one property.
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove the converted ledger is a genuine Class A ritual contract by driving it through all
      four drift-gate Class A legs, not merely by grepping for a contract: block.
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift/test_real_population.py -q && bin/venv-python -c \"import pathlib; from scripts.contracts import load_contract, resolve_refs; from scripts.contracts_enforcement import check_required_inline_fields, check_re_ratification_trigger; p=pathlib.Path('docs/contracts/exit-criteria-ledger.yaml'); d=load_contract(p); resolve_refs(d, p.parent); e=check_required_inline_fields(d)+check_re_ratification_trigger(d); assert d.contract.class_.value=='A', d.contract.class_; assert not e, e; assert d.contract.ratified_via, 'ratified_via must name a real ratification event'; print('CLASS A OK', d.contract.id, d.contract.ratified_via, sorted(d.fields))\""
    expected: >-
      Prints CLASS A OK with contract id exit-criteria-ledger, ratified_via naming dec-136, and
      the field roster. Zero enforcement errors.
    fix_if: >-
      check_required_inline_fields errors name a field missing description/semantics/populated_by/
      dq_intent -- every inline Class A field needs all four. A ContractDocument extra="forbid"
      error names a legacy top-level key still needing relocation under contract:/fields:.
    graduation: graduate
    graduation_check_id: exit-criteria-ledger-is-class-a
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: >-
      Run the real-population drift gate and assert the census moved exactly as predicted, with
      the equality-bound pin moved in the same change (the landmine: the pin is bound by
      EQUALITY in both directions, so a stale 17 fails just as hard as a wrong census).
    command: "bin/venv-python -m pytest tests/checks/contracts/validate_contract_drift/test_real_population.py -q && bin/venv-python -c \"import re,pathlib; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift; import io,contextlib; f=[]; buf=io.StringIO(); ctx=contextlib.redirect_stdout(buf); ctx.__enter__(); validate_contract_drift(f, contracts_dir=pathlib.Path('docs/contracts')); ctx.__exit__(None,None,None); out=buf.getvalue(); print(out); assert f==[], f; c=dict(p.split('=') for p in re.search(r'Census:(.*)', out).group(1).split()); assert c['grandfathered']=='16', c; assert c['ritual']=='16', c; assert c['skipped']=='0', c; y=pathlib.Path('docs/contracts/contract-population.yaml').read_text(); assert re.search(r'grandfathered_max:\\s*16', y), 'pin not lowered to 16'; print('CENSUS+PIN OK')\""
    expected: "Gate passes with failed == []; census grandfathered=16 ritual=16 skipped=0; pin reads 16."
    fix_if: >-
      A pin-vs-census inequality error means the pin and the conversion did not land together --
      fix the pin, never the census. A smuggling error means the file was given a Class D
      envelope instead of Class A.
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift already fails CI on any pin-vs-census inequality via its own
      pin_binding rule, and the census values are a point-in-time population fact that will
      legitimately change with the next contract landing; a pinned registry row asserting 16
      would become a false regression the moment a new contract lands.
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify the size-budget resolution (Option A): decision-entry.yaml is under 500 effective
      lines AND both its budgets entry and its frozen budget_notes entry are retired together,
      as that note's own retires_when branch requires.
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    expected: "Prints SIZE OK with a line count under 500; no decision-entry.yaml reference remains in the budgets file."
    fix_if: >-
      Over 500 means the compaction did not offset the additions -- compact the two newest
      amendment_log summaries further rather than raising the pin (a raise is unavailable:
      Decision 165 needs a Decision body naming this entry, and none may be minted).
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot migration assertion, not a standing invariant: once the entry is retired the
      check is vacuously true forever, and pinning "<500" as a permanent guard would silently
      re-impose a budget the retirement deliberately removed.
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: >-
      Prove the Class D amendment_log obligation is met for BOTH edited Class D contracts by
      running the gate's own rule against each head document, not by eyeballing the YAML.
    command: "bin/venv-python -c \"import yaml,pathlib; from scripts.checks.contracts._population import check_amendment_log_for_class_d as chk; ok=True;\nimport subprocess\nfor rel in ('docs/contracts/decision-entry.yaml','docs/contracts/contract-population.yaml'):\n    head=yaml.safe_load(pathlib.Path(rel).read_text())\n    base=yaml.safe_load(subprocess.run(['git','show',f'origin/main:{rel}'],capture_output=True,text=True).stdout)\n    err=chk(base,head)\n    print(rel,'->',err or 'amendment_log OK')\n    ok = ok and not err\nassert ok, 'a Class D contract changed with no new amendment_log entry'\""
    expected: "Both files print amendment_log OK."
    fix_if: >-
      An error naming a file means its parsed content changed with no new amendment_log[] entry
      -- add one with a date, semantic_break, change_class from the closed 8-value vocabulary,
      and a summary.
    graduation: waive
    graduation_waiver_reason: >-
      Exactly duplicates validate_contract_drift's own Pass 2 amendment_log rule, which already
      runs on every PR touching a Class D contract; a registry row would guard nothing new.
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: >-
      Verify rec-3213's bundled closure literally, using its own acceptance command.
    command: "! grep -rqw ops_plans docs/contracts/exit-criteria-ledger.yaml && grep -q 'ops_execution_plans' docs/contracts/exit-criteria-ledger.yaml && echo 'REC-3213 OK'"
    expected: "Prints REC-3213 OK -- no whole-word ops_plans remains, ops_execution_plans is present."
    fix_if: >-
      A whole-word ops_plans survived the Class A restructure; the retired two-table split must
      not be carried into the new fields: mapping.
    graduation: waive
    graduation_waiver_reason: >-
      This is rec-3213's own acceptance literal and closes with the rec; once the reference is
      swept the assertion is permanently vacuous, so a standing registry row guards nothing.
  - step: 10
    phase: pre-deploy
    hermetic: false
    action: >-
      Execute the CFG-05 recall sweep and prove it was actually run rather than asserted: the
      sweep must enumerate every governed contract's subject/id, adjudicate the semantically
      adjacent clusters pairwise, and record the outcome in BOTH homes. Any real overlap is
      filed through the ops portal (get_rec_write_guidance() before file_rec, Decision 66) --
      never fixed inline. An empty outcome is recorded identically.
    command: "bin/venv-python -c \"import pathlib,yaml; a=pathlib.Path('audits/contract-first-governance-33c8667.yaml').read_text(); c=pathlib.Path('docs/contracts/contract-population.yaml').read_text(); assert 'amendment_2026-09-01' in a, 'audit ledger carries no dated sweep record'; assert 'CFG-05' in a, 'sweep record does not name CFG-05'; p=yaml.safe_load(c)['honesty_clauses']['subject_uniqueness_is_precision_not_recall']; assert 'sweep' in p.lower(), 'honesty clause not updated with the sweep outcome'; print('SWEEP RECORDED'); print(p[:400])\""
    expected: >-
      Prints SWEEP RECORDED and the amended honesty clause, which must state the sweep date, the
      number of contracts compared, and either the filed rec ids or an explicit empty result.
    fix_if: >-
      A missing dated key or an unamended honesty clause means the sweep was performed but not
      recorded -- an unrecorded sweep is indistinguishable from one never run, which is the
      precise failure CFG-05 exists to close.
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    hermetic: false
    action: >-
      Confirm no numbered Decision was minted (the operator's hard constraint) by comparing the
      live decision-header set against origin/main.
    command: "bin/venv-python -c \"import subprocess; from scripts.decisions_md import iter_decision_headings; live=open('docs/DECISIONS.md',encoding='utf-8').read(); base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True).stdout; a={int(m.group(1)) for m in iter_decision_headings(live)}; b={int(m.group(1)) for m in iter_decision_headings(base)}; assert a==b, f'new decision headers minted: {sorted(a-b)}'; print('NO NEW DECISION OK', len(a), 'headers unchanged')\""
    expected: "Prints NO NEW DECISION OK with an unchanged header count."
    fix_if: >-
      A new header means content was routed to a numbered Decision instead of the contract
      governance note / rec home that decision-entry.yaml's significance.routing prescribes.
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    hermetic: false
    action: >-
      Run the authoritative fast-tier presubmit over the whole change.
    command: "bin/venv-python -m scripts.validate --pre"
    expected: "All checks pass, exit 0."
    fix_if: >-
      Diagnose and fix on the branch. Do NOT use --ignore-budget to get past a wall-clock
      breach; the preflight already records 4 recent bypasses.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/validate_decisions_size.py
    behavior: >-
      The accretion signal WARNs on a baseline entry grown past the cap and stays silent
      otherwise, and NEVER appends to `failed` under any accretion condition.
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestAmendmentDeltaCap
    red_green_expectation: >-
      Red before (the class does not exist and the module has no accretion leg at all -- an
      entry grown from 5,775 to 6,389 bytes produces no output); green after.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      The file is a loadable Class A ritual contract whose every inline field carries the four
      required descriptor keys, and whose ratified_via names a real ratification event.
    verification_step: 5
    test_selector: tests/checks/contracts/validate_contract_drift/test_real_population.py::TestRealPopulationRegression
    red_green_expectation: >-
      Red before (the file is unshaped: load_contract raises, and the census reports
      grandfathered=17); green after, with grandfathered=16 and ritual=16.
  - source: docs/contracts/contract-population.yaml
    behavior: >-
      The equality-bound grandfathered_max pin tracks the live census after the conversion, and
      the retired non_seedable_exception no longer claims an evaluator that does not exist.
    verification_step: 6
    test_selector: tests/checks/contracts/validate_contract_drift/test_real_population.py::TestContractPopulationSelfHosting
    red_green_expectation: >-
      Red before if the pin is left at 17 after the conversion (pin_binding fails on inequality
      in EITHER direction); green once the pin moves to 16 in the same change.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      size_governance declares the WARN tier and its flip-to-hard-fail trigger, and the file
      stays under 500 effective lines with its budget entry retired.
    verification_step: 7
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    red_green_expectation: >-
      Red before (no accretion_signal key exists and the file measures exactly 500); green after.
  - source: config/structural_size_budgets.yaml
    behavior: >-
      The decision-entry.yaml budgets entry and its frozen budget_notes entry are retired
      together, never separately (a note outliving its entry, or vice versa, is drift).
    verification_step: 7
    command: "bin/venv-python -c \"import pathlib,yaml; from scripts.checks.structural._classify import effective_lines; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(); d=yaml.safe_load(t); s=d['size_governance']; b=pathlib.Path('config/structural_size_budgets.yaml').read_text(); n=effective_lines(t); assert 'accretion_signal' in s, list(s); assert 'flips_to_hard_fail_when' in s['accretion_signal'], list(s['accretion_signal']); assert n<500, n; assert 'docs/contracts/decision-entry.yaml' not in b, 'budgets entry and/or frozen note still present'; print('CONTRACT+SIZE+BUDGET OK', n)\""
    red_green_expectation: "Red before (two references present: the budgets pin and the frozen note); green after."
constraints:
  - >-
    NO numbered Decision (operator constraint, and independently correct): decision-entry.yaml's
    significance.routing sends (a) and (b) to field_semantics governance notes in the owning
    contracts and (c) to operational_fact recs -- all three say "Never a numbered Decision".
    Precedent on point: contract-population.yaml retirement_notes.*.no_decision_minted.
  - >-
    The accretion signal is WARN-tier ONLY -- it must never append to `failed`. Annotations are
    sanctioned (Decision 177), so this is telemetry. Per Decision 163 it must nonetheless carry a
    named flip-to-hard-fail trigger so it is a staged lever, not an open-ended advisory.
  - >-
    exit-criteria-ledger.yaml must NOT be restructured into a Class D envelope. Its
    exit_criterion_object is genuinely field-shaped and trips the gate's own Class-A smuggling
    detector; evading that detector is the exact anti-pattern contract-population.yaml names.
  - >-
    A structural size-budget RAISE for decision-entry.yaml is unavailable: Decision 165 requires a
    marker naming a Decision whose body authorizes that entry, dec-179's body does not, and no new
    Decision may be minted. Compact-while-adding is the only route.
  - >-
    CFG-05 overlaps are FILED as recommendations, never fixed inline (Decision 55 / AGENTS.md
    out-of-scope rule). Portal writes only -- never edit logs/ caches.
  - Only files listed in scope may be modified.
  - No rescue agents or workaround loops (Decision 55).
