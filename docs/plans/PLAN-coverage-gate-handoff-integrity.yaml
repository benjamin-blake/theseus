rollback: >-
  Every change is additive and independently revertable. Reverting the ratification test commit
  restores the 92.1% state (main goes red again on the next push touching the file). Reverting the
  new check plus its registry and facade lines restores prior behaviour and returns scripts/validate.py
  to 498 SLOC, with no historical-plan impact since the check is diff-scoped and the 9 non-compliant
  historical plans were never gated. Decision 163 is append-only and would be retired by a superseding
  entry rather than deletion, per the repo's amend-only convention.
