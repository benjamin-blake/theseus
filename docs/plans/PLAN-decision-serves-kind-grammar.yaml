    assert d['values'] == ['direction', 'mechanism'] and d['contract']['evaluator']['check'] ==
    'validate_decision_entry_conformance', 'kind contract'"
  red_green_expectation: red before (file absent), green after
- source: docs/decisions-index.json
  behavior: the committed index is regenerated after the builder change and stays fresh.
  verification_step: 4
  command: bin/venv-python -m scripts.decisions_index --check
  waiver_reason: >-
    Generated artifact, regenerated by scripts.decisions_index and never hand-edited; the standing freshness check and
    VP 4's band test own its correctness.
- source: docs/contracts/plan-obligations.yaml
  behavior: contract.description and amendment_log carry the approved decision_drafts sentence; no registration_surfaces row changes.
  verification_step: 6
  test_selector: tests/test_plan_obligations.py
  waiver_reason: >-
    Description and amendment_log text only. No row the check reads changes, so no check behaviour changes; VP 2 proves
    the text landed and the unchanged plan_obligations suite proves the gate verdict did not move.
- source: config/agent/verification_registry/entries/decision-entry-serves-kind-enforced.yaml
  behavior: Registry shard for the graduated step-5 check.
  verification_step: 8
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: config/agent/verification_registry/entries/decisions-index-serves-kind-band.yaml
  behavior: Registry shard for the graduated step-4 check.
  verification_step: 8
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: config/agent/verification_registry/entries/plan-decision-drafts-report.yaml
  behavior: Registry shard for the graduated step-6 check.
  verification_step: 8
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: docs/ROADMAP-PLATFORM.yaml
  behavior: T4.36 c4 walks open -> met with met_by decision-serves-kind-grammar.
