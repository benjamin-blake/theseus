  verification_step: 2
  command: >-
    bin/venv-python -c "import yaml; m=yaml.safe_load(open('docs/contracts/decision-entry.yaml',
    encoding='utf-8'))['metadata_envelope']; assert 'kind' in m['required_fields'] and 'serves' in
    m['optional_fields'] and {'closed_key_set', 'number_assignment', 'draft_check'} <= set(m) and {'kind', 'serves'}
