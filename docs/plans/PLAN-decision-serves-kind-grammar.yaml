schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-serves-kind-grammar
intent: >-
  Separate direction from mechanism in the decision record, in a form every agent reads the same way. Every new
  Decision declares kind {value: direction | mechanism, justification} in its typed envelope, classified by one
  persisted test and rubric (docs/contracts/decision-kind.yaml); new Decisions may also declare which north stars they
  serve (serves: [NS.n]). Both are forward-only and index-projected, so the emergent-north-star detector and any later
  per-kind autonomy ceiling read a typed input. The planning agent's deterministic report
  (scripts.roadmap.plan_obligations) applies the same rules to drafted Decisions before their wording is approved, and
  the operator's ruling that a Decision number is assigned at implementation (MAX + 1, Decision 217 clause 5) is
  persisted and checked. kind grants and gates nothing yet (Decision 235 is the ladder pattern only). Bound by the
  north-star Decision (Decision NNN clause 8, PLAN-north-star-tier-a).
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-decision-serves-kind-grammar.yaml
phase: >-
  T4.36 (North stars as a Tier A file), created by PLAN-north-star-tier-a. Closes T4.36 c4 only. Builds only after two
  BUILD PRs have merged, not just their plan PRs: PLAN-north-star-tier-a's (docs/contracts/north-star.yaml, the
  north-star Decision and T4.36 must exist on main) and the decision-entry.yaml compaction plan's (Benjamin
  2026-10-27: compact the contract instead of raising its size pin), which leaves decision-entry.yaml at or under 470
  effective lines with its frozen size note retired. VP step 1 checks both.
closes_criteria: [T4.36:c4]
scope:
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: >-
    The approved text applied verbatim (execution_steps VERBATIM entries E1-E3): required_fields gains kind;
    optional_fields gains serves; closed_key_set, number_assignment and draft_check follow optional_fields;
    field_shapes.kind (a one-line pointer to decision-kind.yaml) and field_shapes.serves follow field_shapes.significance;
    one amendment_log row. Lands at or under the 500-effective-line contracts limit with no budgets entry: the
    compaction plan made the room (this edit adds 30 effective lines, measured on the approved text).
- file: docs/contracts/decision-kind.yaml
  action: Create
  purpose: >-
    Class D contract, the single definition of kind (VERBATIM entry K, 55 effective lines): shape, values, test,
    own_clauses, direction_when, human_gate, mechanism_when, tie_break, semantics, consumer_contract, enforcement.
    Evaluator validate_decision_entry_conformance, which reads values from it at check time and names its path as a
    module constant (validate_contract_drift resolves the evaluator on that basename). Born ratified (ratified_via the
    north-star Decision clause 8), so no contract-population.yaml ratchet pin moves. Pointed at by decision-entry.yaml,
    the planning skill and plan-critique, and later by the operator_decision journal row and any autonomy ladder.
- file: scripts/decisions_md.py
  action: Modify
  purpose: >-
    _envelope_has_well_formed_shape type-checks serves (list of str) and kind (mapping). parse_decisions_md rows gain
    index-only keys serves (list; [] when an enveloped entry declares none; None without an envelope) and kind (the
    value string or None). A placeholder-tolerant heading iterator (iter_placeholder_headings, for "## Decision NNN:")
    sits beside iter_decision_headings so no consumer hand-rolls a heading regex (Decision 134 cl.3). Never added to
    the warehouse backfill columns, DecisionPayload or DQ config (Decision 84). Stays under 500 SLOC (441 at plan time):
    keep the additions small.
- file: scripts/decisions_index.py
  action: Modify
  purpose: >-
    build_index projects serves and kind (the value) only on rows that are live AND carry a well-formed envelope
    ([] / null when undeclared inside that band); pre-envelope and archive rows carry neither key (Decision 179 read
    cost). Docstring states the band rule.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write.
- file: scripts/checks/decisions/envelope_rules.py
  action: Create
  purpose: >-
    Pure rule functions over parsed inputs (no file reads), shared by the conformance check and plan_obligations (one
    rule set, two callers): kind_issues (missing, value outside the values passed in, empty justification);
    serves_issues (^NS\.\d+$, non-empty, duplicate-free, resolves against the ids passed in); unknown_key_issues
    (closed_key_set); malformed_envelope_detail (names the offending field when extract_entry_envelope returns None);
    number_issues (a new number must exceed the baseline maximum; an unsubstituted NNN heading fails);
    dangling_serves_warnings and carried_by_mechanism_warnings (WARN text names the lawful remedy, Decision 177).
- file: scripts/checks/decisions/validate_decision_entry_conformance.py
  action: Modify
  purpose: >-
    Adds _KIND_CONTRACT_REL_PATH = "docs/contracts/decision-kind.yaml" beside _CONTRACT_REL_PATH; reads kind values
    from it and the serves target from decision-entry.yaml field_shapes.serves.resolves_against, then calls
    envelope_rules. New-in-diff entries: kind, serves, closed-key and number rules FAIL; a present-but-malformed
    envelope names its bad field. Every run (including the no-new-entries early return): an unsubstituted
    "## Decision NNN" heading FAILs; the two WARN rules print WARN lines, never appended to failed. A missing or
    unparseable north-star or decision-kind contract fails closed when a new entry needs it (Decision 170). Bundled
    rec-3260: both registry.examined calls use unit="decision_entries_checked". The stale "at its 500-SLOC budget"
    comment is corrected.
- file: scripts/roadmap/plan_decision_drafts.py
  action: Create
  purpose: >-
    Finds drafted Decision blocks -- "## Decision NNN:" or "## Decision <n>:" headings inside a plan's string values,
    or in a markdown draft file -- via scripts.decisions_md's iterators, reads the same contracts the check reads, and
    applies envelope_rules to each with NNN accepted as the number. Returns findings: the FAIL-class rules as findings,
    a concrete number as a WARN-class finding ("assign at implementation: Decision 217 cl.5"). When kind is missing or
    invalid, the finding quotes decision-kind.yaml's test so the drafter has the definition in hand (Decision 66).
    Never raises.
- file: scripts/roadmap/plan_obligations.py
  action: Modify
  purpose: >-
    build_report appends a "decision drafts" section from plan_decision_drafts for the plan; main gains
    --decision-draft <path> (report on a markdown draft alone; exactly one of --plan or --decision-draft). Still
    always exits 0; validate_plan_scope_closure's gating verdict is unchanged.
- file: docs/contracts/plan-obligations.yaml
  action: Modify
  purpose: >-
    The approved sentence appended to contract.description (VERBATIM entry P1) and one amendment_log row saying the
    same (VERBATIM entry P2).
- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    Decision Significance Gate: "Three property tests" becomes "Four property tests" (VERBATIM entry S1) and property
    test 4, kind classified, follows test 3 (VERBATIM entry S2). +434 B measured, within config/prose_budgets.yaml's
    44,097 B pin (43,522 B at plan time); no raise.
- file: .claude/skills/plan-critique/SKILL.md
  action: Modify
  purpose: >-
    12p judges the claimed kind.value the way it judges significance (VERBATIM entries C1-C3). +1 B measured, within
    the 18,693 B pin (18,684 B at plan time). The category-consistency verdict and its REVISE consequence stay exactly
    as strong (Decision 167's reversal condition names 12p as a gate).
- file: tests/decisions_md/test_envelope.py
  action: Modify
  purpose: Shapes accepted/rejected for serves and kind; the row keys; iter_placeholder_headings matches NNN and digits only.
- file: tests/test_decisions_index_envelope_fields.py
  action: Create
  purpose: >-
    Keys only on live enveloped rows ([] / null when undeclared), declared values carried, absent elsewhere; neither key
    in scripts.ops_portal.decisions._DECISION_BACKFILL_COLS.
- file: tests/checks/decisions/test_envelope_rules.py
  action: Create
  purpose: Each rule function over synthetic inputs, every FAIL and WARN case, remedy text present in WARNs.
- file: tests/checks/decisions/test_validate_decision_entry_conformance_serves_kind.py
  action: Create
  purpose: >-
    tmp_path repo with synthetic contracts, north-star file and DECISIONS.md, baseline_reader injected. FAIL: missing
    kind, kind north_star, empty justification, bad/duplicate/unresolved serves, unknown key, number not above the
    baseline max, a leftover NNN heading (also on the no-new-entries path), missing contract with a declared field.
    WARN-not-fail: dangling baseline serves, mechanism in carried_by. PASS: a conforming new entry; adding a value to
    the synthetic decision-kind.yaml admits it with no code change.
- file: tests/fixtures/decision_drafts/nnn_conforming.md
  action: Create
  purpose: A drafted "## Decision NNN:" entry with a conforming envelope (significance, kind), used by tests and VP 7.
- file: tests/test_plan_decision_drafts.py
  action: Create
  purpose: >-
    A plan embedding an NNN Decision with a conforming envelope reports clean; missing kind reports a finding quoting
    the test; a concrete number reports the WARN; a markdown draft via --decision-draft; a plan with no drafted
    Decision reports "none"; main() exits 0 in every case; an unreadable path is a finding, not a raise.
- file: config/agent/verification_registry/entries/decision-entry-serves-kind-enforced.yaml
  action: Create
  purpose: Graduated shard for VP step 5.
- file: config/agent/verification_registry/entries/decisions-index-serves-kind-band.yaml
  action: Create
  purpose: Graduated shard for VP step 4.
- file: config/agent/verification_registry/entries/plan-decision-drafts-report.yaml
  action: Create
  purpose: Graduated shard for VP step 6.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Bookkeeping walk only -- T4.36 c4 open -> met, met_by decision-serves-kind-grammar.
bundled_recommendations: [rec-3260]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- A new Decision without kind, with a value outside decision-kind.yaml's values, or with an empty justification fails validate_decision_entry_conformance with a message naming the field.
- serves is optional; a malformed, duplicate or unresolved id fails a new entry; unknown envelope keys fail a new entry.
- A new Decision number must exceed the baseline maximum, and an unsubstituted "## Decision NNN" heading fails on every run.
- plan_obligations reports drafted-Decision findings for a plan (--plan) or a markdown draft (--decision-draft), quoting the kind test when kind is missing, and still exits 0.
- docs/contracts/decision-kind.yaml is the single definition of kind; decision-entry.yaml, the planning skill and plan-critique point at it.
- Every VERBATIM entry in execution_steps is present in its target file, with only DATE and the north-star Decision number substituted.
- docs/decisions-index.json carries serves and kind on live enveloped rows only and is fresh; neither reaches the warehouse.
- decision-entry.yaml stays within the 500-effective-line contracts limit, and this plan does not touch config/structural_size_budgets.yaml.
- rec-3260 is closed.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition, run once before the first edit -- both prerequisite builds have merged and this branch is rebased: the north-star file, its Decision
    and T4.36 c4 exist; decision-entry.yaml is at or under 470 effective lines with no frozen size note; every
    insertion anchor the VERBATIM entries name is still present.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    docs/contracts/north-star.yaml && grep -qE "^## Decision [0-9]+: North stars are a Tier A file" docs/DECISIONS.md
    && bin/venv-python -c "import yaml; from scripts.checks.structural._classify import effective_lines as e;
    d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8')); t=[i for i in d['tier_items'] if
    i['id']=='T4.36'][0]; assert any(c['id']=='c4' for c in t['exit_criteria']), 'T4.36 c4';
    s=open('docs/contracts/decision-entry.yaml', encoding='utf-8').read(); assert e(s) <= 470, e(s);
    b=yaml.safe_load(open('config/structural_size_budgets.yaml', encoding='utf-8')); assert
    'docs/contracts/decision-entry.yaml' not in (b.get('budget_notes') or {}), 'frozen note';
    a=[('docs/contracts/decision-entry.yaml', '  required_fields: [number, significance]'),
    ('docs/contracts/decision-entry.yaml', '  optional_fields: [status, decided_date, amends, supersedes]'),
    ('docs/contracts/decision-entry.yaml', '      justification: A non-empty one-line reason the claimed routing row
    applies.'), ('docs/contracts/plan-obligations.yaml', '    by .claude/skills/planning/SKILL.md.'),
    ('.claude/skills/planning/SKILL.md', 'Three property tests gate the draft'), ('.claude/skills/planning/SKILL.md',
    '   the significance bar on its own terms.'), ('.claude/skills/plan-critique/SKILL.md', 'This is the reviewer-side
    control that does not exist anywhere else in this gate'), ('.claude/skills/plan-critique/SKILL.md', 'A
    claimed-row/body mismatch is REVISE-worthy on its own')]; m=[x for x in a if x[1] not in open(x[0],
    encoding='utf-8').read()]; assert not m, m" && echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    A missing north-star file, Decision or criterion means PLAN-north-star-tier-a's build has not merged; an
    effective-line count over 470 or a surviving frozen note means the compaction build has not merged; a missing
    anchor means a prerequisite reworded an insertion point. In every case stop and tell the coordinator; never raise
    the pin and never re-place approved text on a guess.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A sequencing precondition on two sibling plans' merges, not a behaviour of this change.
- step: 2
  phase: pre-deploy
  action: >-
    The approved text landed verbatim -- every VERBATIM execution step is present in its target file, with DATE and
    "Decision NNN clause" (the north-star Decision) as the only substitutions.
  command: >-
    bin/venv-python -c "import re, yaml; p=yaml.safe_load(open('docs/plans/PLAN-decision-serves-kind-grammar.yaml',
    encoding='utf-8')); n=re.search(r'^## Decision (\d+): North stars are a Tier A file', open('docs/DECISIONS.md',
    encoding='utf-8').read(), re.M).group(1); d=str(yaml.safe_load(open('docs/contracts/decision-kind.yaml',
    encoding='utf-8'))['amendment_log'][0]['date']); v=[s.split(chr(10), 1) for s in p['execution_steps'] if
    s.startswith('VERBATIM ')]; bad=[h for h, t in v if t.replace('DATE', d).replace('Decision NNN clause', 'Decision
    ' + n + ' clause') not in open(h.split()[1], encoding='utf-8').read()]; assert len(v) == 11 and not bad, (len(v),
    bad); print('VERBATIM_OK', len(v))" && bin/venv-python -c "import yaml;
    m=yaml.safe_load(open('docs/contracts/decision-entry.yaml', encoding='utf-8'))['metadata_envelope']; assert 'kind'
    in m['required_fields'] and 'serves' in m['optional_fields'] and {'closed_key_set', 'number_assignment',
    'draft_check'} <= set(m) and {'kind', 'serves'} <= set(m['field_shapes']), 'envelope keys'" && bin/venv-python -c
    "import yaml; d=yaml.safe_load(open('docs/contracts/decision-kind.yaml', encoding='utf-8')); assert d['values'] ==
    ['direction', 'mechanism'] and d['contract']['evaluator']['check'] == 'validate_decision_entry_conformance', 'kind
    contract'"
  expected: VERBATIM_OK 11 and both assertions pass. Red before (decision-kind.yaml absent).
  fix_if: >-
    A named entry means its text was retyped, rewrapped or placed differently -- copy it from this plan again. Never
    edit the plan's VERBATIM text to match the file: that text is what Benjamin approved.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    A landing check. The approved text may later be amended lawfully under its own approval, which a standing guard
    would block.
- step: 3
  phase: pre-deploy
  action: The parser accepts the new shapes, rejects wrong types as malformed, surfaces the row keys and iterates NNN headings.
  command: bin/venv-python -m pytest tests/decisions_md/test_envelope.py -q
  expected: Every node passes. Red before (no row keys, no placeholder iterator).
  fix_if: A scalar serves or a string kind yielding an envelope means the shape check was not extended.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    The graduated step 4, 5 and 6 nodes read the parser's real output, so a parser regression reddens those standing
    guards.
- step: 4
  phase: pre-deploy
  action: The index projects serves and kind on live enveloped rows only, and the committed index is fresh.
  command: bin/venv-python -m pytest tests/test_decisions_index_envelope_fields.py -q && bin/venv-python -m scripts.decisions_index --check
  expected: Every node passes and the freshness check exits 0. Red before (module absent; keys absent).
  fix_if: Keys on a pre-envelope row break the band rule; a freshness failure means the index was not regenerated.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: decisions-index-serves-kind-band
- step: 5
  phase: pre-deploy
  action: Each FAIL rule fails closed on a planted defect, each WARN rule warns without failing, and the kind vocabulary is read from decision-kind.yaml.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_envelope_rules.py
    tests/checks/decisions/test_validate_decision_entry_conformance_serves_kind.py -q
  expected: Every node passes. Red before (modules absent).
  fix_if: A WARN case appending to failed, or a FAIL case passing, is a rule bug.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: decision-entry-serves-kind-enforced
- step: 6
  phase: pre-deploy
  action: The planning-time report finds drafted Decisions in plans and markdown drafts, applies the same rules, and exits 0.
  command: bin/venv-python -m pytest tests/test_plan_decision_drafts.py tests/test_plan_obligations.py -q
  expected: Every node passes, including the unchanged plan_obligations nodes. Red before (module absent).
  fix_if: A non-zero exit or a changed registration verdict means the report leaked into the gate.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: plan-decision-drafts-report
- step: 7
  phase: pre-deploy
  action: >-
    Dogfood -- the committed conforming NNN draft fixture runs clean through the CLI, and the live corpus passes the
    conformance check with no new WARN line.
  command: >-
    bin/venv-python -m scripts.roadmap.plan_obligations --decision-draft
    tests/fixtures/decision_drafts/nnn_conforming.md && bin/venv-python -m pytest tests/checks/decisions/ -q
  expected: The report names one drafted Decision with no findings; every check node passes.
  fix_if: A finding on the fixture means NNN or the kind mapping is mishandled.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: >-
    Budgets and registration -- no structural, SLOC or prose raise; decision-entry.yaml within 500 effective lines; the
    new contract's evaluator resolves; the fields never reach the warehouse.
  command: >-
    test -z "$(git diff origin/main -- config/structural_size_budgets.yaml config/sloc_budgets.yaml
    config/prose_budgets.yaml)" && bin/venv-python -c "from scripts.checks.structural._classify import effective_lines
    as e; from scripts.ops_portal.decisions import _DECISION_BACKFILL_COLS as c; n=e(open('docs/contracts/decision-entry.yaml',
    encoding='utf-8').read()); assert n <= 500, n; assert 'serves' not in c and 'kind' not in c; print('effective', n)"
    && bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;
    f=[]; v(f); print(chr(10).join(f)); raise SystemExit(1 if f else 0)" && bin/venv-python -m scripts.validate --pre
  expected: >-
    The budget files are unchanged, decision-entry.yaml prints at or under 500, the drift gate passes with one more
    governed contract than origin/main, and --pre exits 0.
  fix_if: >-
    Over 500 effective lines means the text grew beyond the approved 30 lines or the compaction left less room -- stop
    and tell the coordinator, never raise. An evaluator finding means the check module lacks the decision-kind.yaml
    path constant. A prose overrun means a skill edit added text -- trim to the approved text, never raise.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: rec-3260 acceptance holds, and the rec is closed after merge.
  command: test $(grep -c 'unit="decision_entries_checked"' scripts/checks/decisions/validate_decision_entry_conformance.py) -eq 2
  expected: Exit 0; after merge, recs_by_ids shows rec-3260 closed via the Resolves trailer.
  fix_if: A count other than 2 means one examined call kept the old unit.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: A one-off label fix; the accounting check already reads the unit.
test_obligations:
- source: scripts/decisions_md.py
  behavior: serves/kind shape check, index-only row keys, placeholder heading iterator.
  verification_step: 3
  test_selector: tests/decisions_md/test_envelope.py
  red_green_expectation: red before (keys and iterator absent), green after
- source: scripts/decisions_index.py
  behavior: serves/kind projected on live enveloped rows only.
  verification_step: 4
  test_selector: tests/test_decisions_index_envelope_fields.py
  red_green_expectation: red before (module absent), green after
- source: scripts/checks/decisions/envelope_rules.py
  behavior: every FAIL and WARN rule over parsed inputs.
  verification_step: 5
  test_selector: tests/checks/decisions/test_envelope_rules.py
  red_green_expectation: red before (module absent), green after
- source: scripts/checks/decisions/validate_decision_entry_conformance.py
  behavior: rules wired into the new-in-diff FAIL and every-run paths; vocabulary read from decision-kind.yaml.
  verification_step: 5
  test_selector: tests/checks/decisions/test_validate_decision_entry_conformance_serves_kind.py
