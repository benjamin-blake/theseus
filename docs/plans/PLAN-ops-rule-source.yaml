schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-rule-source
intent: >-
  rec-4158 plan A of three (Decision 210 cl.3): make each ops table's Class A contract the ONE declared source of every
  data rule its rows must satisfy -- reconciled from the seven surfaces that hold ops_recommendations rules today -- prove
  every declared rule and effective date against the live warehouse, and record the choice in the Decisions, the
  write-time-enforcement rule and the roadmap. Deploy-inert: plan B moves enforcement into the writer (V3), plan C
  switches the portal and DQ to the same rules and lands the all-writer conformance check. A single, verified rule source
  is what lets the writer reject bad rows in an append-only store where they can never be corrected later.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ops-rule-source.yaml
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 Coverage: existing ops writers and contracts); no tier_item claimed. Re-grounds the
  text of T1.6 (name, intent, c7) and T2.29 (intent, c5, c6) to the chosen source; closes no exit criterion.
scope:
- file: docs/contracts/ops_recommendations.yaml
  action: Modify
  purpose: >-
    Declare these rules, field by field ("05-01" = exclude_before "2026-05-01"): id: not_null, pattern
    '^(rec-[0-9]+|agent-[0-9]+|test-[a-z0-9-]+)$'; title: not_null 05-01, min_length {value: 10, exclude_before:
    "2026-09-01"}; source: unchanged dq_intent_local (not_null 05-01), values from the registry via its $ref; effort:
    not_null 05-01, accepted_values [XS, S, M, L, XL] 05-01; priority: not_null 05-01, [Critical, High, Medium, Low]
    05-01; status: not_null, [open, closed, failed, declined, superseded]; automatable: not_null 05-01; risk: not_null
    05-01, [low, medium, high] 05-01; file: not_null 05-01, min_length 1 05-01, pattern
    '^([^/\\A-Za-z][^\\]*|[A-Za-z]([^:\\][^\\]*)?|[A-Za-z]:([^/\\][^\\]*)?)$' (equal to _validate_file_path on every non-empty string, checked exhaustively at planning to length 4); context:
    not_null 05-01, min_length 80 05-01; acceptance: not_null 05-01, min_length 1 05-01, acceptance_lint {require_discrimination: true} with
    exemption {class: repository_state, reason: the lint reads the repository tree, owner: the portal}; dependencies:
    array_element_format '^rec-[0-9]+$', array_element_reference with exemption {class: cross_row, reason: an
    existence lookup outside the batch's partitions (Decision 210 cl.2(a)), owner: the portal pre-check, DQ monitor
    T1.6}; tags: array_element_format '^[a-z][a-z0-9-]*$' exclude_before 2026-09-08; last_updated_timestamp: not_null,
    not_before created_timestamp; every other field keeps not_null {enforced: false} (no rule).
    not_null means IS NOT NULL (the telemetry meaning); a string column the portal also requires non-blank carries a
    blank-rejecting rule (min_length >= 1, accepted values, or the registry). Layout: every dq_intent block in the file is
    rewritten in YAML flow style (the telemetry_sessions.yaml precedent; same data, fewer lines) so the file stays within
    its 556 effective-line budget (validate_structural_size_limits) with no budget raise and no amendment_log compaction.
    status: description lists the five enforced values (drops in_progress and deferred, adds failed) with a field-level
    amendment_log entry (change_class prose_improvement, semantic_break false: the enforced set never changed). One
    contract-level amendment_log entry (change_class governance_note_add, semantic_break true) names rec-4158 plan A and
    the single-source choice. nullable flags, descriptions of other fields, and the projected field_semantics.yaml are
    unchanged.
- file: docs/contracts/ops_decisions.yaml
  action: Modify
  purpose: >-
    Declare these rules in flow style: id: not_null, pattern '^dec-[0-9]+$'; title and status: not_null; status:
    accepted_values [Decided, Superseded, Open] with exclude_before "2026-06-12" (the 28 legacy free-text statuses were
    all created before it; their normalisation at the ETL source is T1.5 Phase 4, named in the field's governance_notes);
    decision_id: integer_of {column: id, pattern: '^dec-([0-9]+)$'}; last_updated_timestamp: not_before
    created_timestamp. One contract-level amendment_log entry.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    Rule write-time-enforcement statement: replace "for the ops tables the choice among ... is rec-4158's; an exemption
    sits beside the rule with its reason and owning rec" with the recorded choice (the owning Class A contract;
    field_semantics.yaml its generated projection; ops.yaml and the CD.12 Pydantic models DQ-side artefacts, never a
    write-time rule source), the closed exemption grammar (write_time_exemptions {class, reason, owner}; class cross_row,
    repository_state, or temporary with an open owning rec) and the OLDER-ROWS rule (a rule binds every column of a row
    created on or after its exclude_before, and any column a write changes, decided from the existing-row fetch the
    writer already makes; on insert every rule binds; on ops_recommendations no exclude_before is earlier than the
    Decision 64 anchor 2026-05-01, and a later date is that rule's own effective date, never a moved anchor). Keeps every
    phrase tests/checks/contracts/test_write_time_enforcement_decision.py anchors. amendment_log entry; updated_by.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Three dated annotations, appended, never mid-body (Decision 177 pinned forms): a trailing "[Amendment 2026-MM-DD,
    rec-4158: ...]" on Decision 210 recording cl.3's ops choice, the older-rows rule and the exemption classes (detail
    pointer to data-modeling-standard.yaml); a "> **Update (2026-MM-DD):**" on Decision 65 (for the ops tables the
    canonical field-semantic and write-time rule authority is the owning Class A contract; ops.yaml's write_time flags
    are a transitional, parity-checked copy until rec-4158 plan C retires them, and its DQ checks and the
    description/semantics text Decision 66 guidance reads stay until T1.6 c7); a "> **Update (2026-MM-DD):**" on Decision
    64 (2026-05-01 is also the floor for every write-time rule's exclude_before on ops_recommendations; a rule introduced
    later carries its own later date -- a rule-effective date, never a moved anchor). Decision 210 stays under the
    6,144-byte per-entry cap.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write; never hand-edited.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Re-grounding only (tier-item-lifecycle stale-reference rule): CD.12 detail gains a dated amendment line (for the ops
    and telemetry tables the single write-time rule source is the owning Class A contract; the Pydantic models are a
    consumer projection, never a source; its alarm-not-gate, handler-invariant and DqDeleted points are unaffected;
    ratification reconciles with this). T1.6 name, intent's deferred-phase sentence and c7 read the Class A contracts'
    declared rules instead of Annotated metadata. T2.29 intent (items 5-6 and the closing SSOT sentence), c5 (measured
    2026-09-29: one current row, of any status, created before 2026-09-01 has a title under 10 stripped characters, so
    the title rule carries exclude_before 2026-09-01) and c6 (the validator registry re-points to the Class A contract's
    declared rules -- rec-4158 plan C -- or stays the last ops.yaml runtime reader with T1.6 as retirement owner) are
    re-grounded. Each change carries the date and rec-4158. No status, criterion count or dependency changes.
- file: scripts/contract_rules.py
  action: Create
  purpose: >-
    The declared rules of an ops Class A contract, read from the RAW contract YAML (never scripts/contracts.py's resolved
    view, which replaces a $ref field's dq_intent wholesale). declared_rules(table) -> tuple[DeclaredRule, ...]
    (frozen: table, column, kind, params, exclude_before, exemption); a $ref to source-lineage.yaml registry_key takes
    its accepted values from the registry that file's allowed_values names (the telemetry projection's rule) plus its
    dq_intent_local. grammar_problems(table) -> list[str] fails closed on: a rule key outside the closed vocabulary
    (not_null, accepted_values, min_length, pattern, array_element_format, array_element_reference, acceptance_lint,
    not_before, integer_of, write_time_exemptions); an unknown sub-key; an invalid regex or one outside the
    RE2-and-Python subset (no lookaround, no backreference); enforced false on any leg but not_null; not_null enforced
    false on a nullable false field; an exclude_before that is not an ISO date, or on ops_recommendations earlier than
    2026-05-01; a producer-side key (acceptance_lint, array_element_reference) without a write_time_exemptions entry of
    class cross_row or repository_state; an exemption whose class is outside the closed set, that lacks reason or owner,
    or whose class temporary names an owner that is not a rec id. Stdlib plus PyYAML; no network.
- file: scripts/ops_rule_census.py
  action: Create
  purpose: >-
    Live census: compiles every writer rule from contract_rules.declared_rules for ops_recommendations and ops_decisions
    into a DQ Check exactly as scripts/data_quality_compile.py's expression branch does (the same FROM form,
    created_timestamp >= DATE gate for exclude_before), translates with to_ducklake_sql and runs them through
    scripts.data_quality_execute.run_checks -- no new query_ops caller. Predicates: not_null IS NOT NULL; accepted_values
    IS NULL OR IN; min_length on the Python str.strip() result (the SQL character class equals exactly the characters
    str.isspace() accepts); pattern and array_element_format via regexp_full_match; not_before; integer_of. Producer-side
    rules are listed as exempt, never compiled. CLI: --table, --json, --dry-run (prints compiled SQL, no reader). Prints
    one line per rule with its violator count and a final summary line; exit 0 iff every compiled rule has zero
    violators, exit 1 otherwise, exit 2 if any check is UNAVAILABLE or ERROR (never a silent pass, Decision 55).
- file: scripts/checks/contracts/validate_ops_rule_source.py
  action: Create
  purpose: >-
    Registered check (owner platform; Decision 170 accounting via registry.examined over declared rules). Fails on: any
    contract_rules.grammar_problems for ops_recommendations or ops_decisions; any write_time test in
    config/agent/data_quality/ops.yaml for those tables without an equal contract rule on the same column (kind
    mapping: not_null -> contract not_null plus, on a VARCHAR column, a blank-rejecting rule (min_length >= 1,
    accepted_values or the registry $ref), accepted_values as a set, min_length value, array_element_format pattern, path_syntax -> the
    contract's file pattern, acceptance_lint and array_element_reference -> the declared producer-side key; gates are
    compared only through the floor rule; the retired write-time expression builder is ignored); the contract's
    ops_recommendations status accepted values differing from STATUS_TRANSITIONS["ops_recommendations"]["enforced"],
    scripts/executor/jsonl_store._VALID_STATUSES or the Recommendation status Literal. Transitional by design: plan C
    folds it into the all-writer conformance check when ops.yaml's write_time role retires.
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: >-
    Entry for validate_ops_rule_source, pre=True, pre_globs: docs/contracts/ops_recommendations.yaml,
    docs/contracts/ops_decisions.yaml, docs/contracts/source-lineage.yaml, config/agent/data_quality/ops.yaml,
    config/agent/data_quality/source_registry.yaml, scripts/contract_rules.py, scripts/executor/jsonl_store.py,
    src/common/ducklake_scd2_schema.py, scripts/checks/contracts/**, scripts/checks/_common.py,
    scripts/checks/registry.py; full_segment full_after_lint.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: function_to_category row validate_ops_rule_source -> schema_drift.
- file: tests/test_contract_rules.py
  action: Create
  purpose: >-
    Mirror test (alone reaches the per-file coverage floor validate_test_coverage applies): the exact declared rule set
    of both real contracts equals the rule lists in their scope rows; registry-sourced source values; every grammar_problems branch fails
    closed on a fixture contract; the vacuous not_null reading.
- file: tests/test_ops_rule_census.py
  action: Create
  purpose: >-
    Mirror test, duckdb-free: each rule kind compiles to its predicate and gate; exempt rules are listed, not compiled;
    exit codes 0/1/2 from a stubbed run_checks; the whitespace class equals the str.isspace() set.
- file: tests/test_ops_rule_census_duckdb.py
  action: Create
  purpose: >-
    Module-level pytest.importorskip("duckdb"): every compiled predicate, run on an in-memory DuckDB table seeded with
    passing and violating rows (including tab, no-break-space and ideographic-space padding, and drive-letter, absolute
    and backslash paths), agrees row-for-row with the Python reference (str.strip, re.fullmatch, the portal's
    _validate_file_path) -- so the census cannot under-count what the writer will reject.
- file: tests/checks/contracts/test_validate_ops_rule_source.py
  action: Create
  purpose: >-
    Mirror test: the real tree passes; each failure branch fails on a fixture (an ops.yaml write_time rule missing from
    the contract, status vocabulary drift, enforced false on a rule leg, exclude_before below the floor, a producer-side
    key without its exemption, a temporary exemption without a rec owner); the portal's _validate_file_path and
    _validate_context_length agree with the contract's file pattern and context min_length on one fixture corpus.
- file: tests/checks/contracts/test_ops_rule_source_records.py
  action: Create
  purpose: >-
    The recorded choice: Decision 210's trailing annotation names rec-4158 and the Class A contract; Decisions 65 and 64
    carry their dated updates; the write-time-enforcement statement names the ops source, the exemption classes and the
    older-rows rule and no longer says the choice is rec-4158's; CD.12, T1.6 c7 and T2.29 c5/c6 carry the re-grounded
    text. Decision numbers are resolved from headers, never hard-coded beyond 64, 65 and 210.
bundled_recommendations: []
followon_recs:
- rec-4158
infrastructure_dependencies: []
acceptance_criteria:
- Both ops contracts declare exactly the rule lists in their scope rows, and contract_rules.grammar_problems returns nothing for either.
- validate_ops_rule_source passes on the tree and fails on each fixture defect; it is registered with a manifest Entry and
  a taxonomy row.
- The live census reports zero violators for every compiled rule of both tables, with every exclude_before gate applied,
  and lists the two producer-side rules as exempt.
- The census's SQL predicates agree row-for-row with the Python reference on DuckDB, including Unicode whitespace.
- Decisions 210, 65 and 64 carry their dated annotations; the write-time-enforcement statement records the choice, the
  exemption classes and the older-rows rule; CD.12, T1.6 and T2.29 are re-grounded; docs/decisions-index.json is fresh.
- Nothing deploys -- field_semantics.yaml regenerates byte-identical and no Lambda-packaged, terraform or workflow file
  changes.
- rec-4158 carries a dated note that plan A landed and plans B and C remain.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Declared rules read from the real contracts, and the grammar fails closed.
  command: >-
    bin/venv-python -m pytest tests/test_contract_rules.py::test_ops_recommendations_declares_the_rule_table
    tests/test_contract_rules.py::test_ops_decisions_declares_the_rule_table
    tests/test_contract_rules.py::test_source_values_come_from_the_registry
    tests/test_contract_rules.py::test_grammar_fails_closed -q
  expected: Exit 0, 4 passed. Red before, because the module and its tests do not exist.
  fix_if: A rule missing or extra against the scope rows' rule lists -> fix the contract; never loosen the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-contract-rule-table
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The registered parity and grammar check, on the real tree and on fixture defects.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_validate_ops_rule_source.py::test_real_tree_passes
    tests/checks/contracts/test_validate_ops_rule_source.py::test_each_defect_fails
    tests/checks/contracts/test_validate_ops_rule_source.py::test_portal_validators_agree_with_contract -q
  expected: Exit 0, 3 passed. Red before, because the check does not exist.
  fix_if: A real-tree failure -> fix the contract or the parity mapping; never add an allow-list.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-rule-source-parity
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Census compiler and exit codes, duckdb-free.
  command: >-
    bin/venv-python -m pytest tests/test_ops_rule_census.py::test_each_rule_kind_compiles
    tests/test_ops_rule_census.py::test_exempt_rules_are_listed_not_compiled
    tests/test_ops_rule_census.py::test_exit_codes
    tests/test_ops_rule_census.py::test_whitespace_class_equals_isspace -q
  expected: Exit 0, 4 passed. Red before, because the module does not exist.
  fix_if: A predicate that drifts from the Python reference -> fix the compiler, never the reference.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-rule-census-compile
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Census SQL semantics equal the Python reference on a real DuckDB engine.
  command: bin/venv-python -m pytest tests/test_ops_rule_census_duckdb.py -q
  expected: Exit 0 with no test skipped (duckdb is installed in the dev environment).
  fix_if: A disagreement -> fix the predicate; if RE2 cannot express a declared pattern, change the pattern at the source.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    duckdb is a heavy-exclusion dependency of the fast tier (requirements-fast.txt), so this module is collected only in
    the full tier; graduating it into the fast-tier registry would never execute it.
- step: 5
  phase: pre-deploy
  action: The recorded choice in the Decisions, the standard and the roadmap; the Decision 210 guard still holds.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_ops_rule_source_records.py
    tests/checks/contracts/test_write_time_enforcement_decision.py -q
  expected: Exit 0, every test passed, none skipped.
  fix_if: An anchor phrase lost from the standard -> restore it; a Decision over its byte cap -> tighten the annotation.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: Live census against the warehouse (read-only, through the DQ harness).
  command: bin/venv-python -m scripts.ops_rule_census
  expected: >-
    Exit 0; every compiled rule of ops_recommendations and ops_decisions prints 0 violators; acceptance_lint and
    array_element_reference print as exempt; the summary line reports 0 violators.
  fix_if: >-
    A violator under a declared date -> the date is wrong: STOP and return to /plan (Decision 210 cl.4; never widen a
    gate silently). Exit 2 (reader unavailable) -> retry once after the reader recovers; never treat it as clean.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: Deploy-inertness -- the projection is unchanged and nothing packaged moved.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && git diff --quiet origin/main -- config/lambda
    src/common src/lambdas terraform .github/workflows && echo INERT_OK
  expected: Exit 0 and the success marker printed.
  fix_if: A projection change -> a dq_intent edit leaked into the generator; revert it (projection is plan B).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Compares against origin/main, a per-PR transient state; the projection half is already the registered
    validate_field_semantics_drift check.
- step: 8
  phase: pre-deploy
  action: Full validation tier before handoff (includes the structural-size budget on ops_recommendations.yaml).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: The rec-4158 note landed (after the bookkeeping step).
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;
    c=(f('rec-4158') or {}).get('context') or '';print('PLAN A DELIVERED' in c);assert 'PLAN A DELIVERED' in c"
  expected: Exit 0 and True printed.
  fix_if: Missing -> re-run the bookkeeping step through update_rec (fetch-before-update); never edit the cache.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/contract_rules.py
  behavior: Reads the declared rules from the raw contracts, sources registry values, and fails closed on every grammar defect.
  verification_step: 1
  test_selector: tests/test_contract_rules.py::test_grammar_fails_closed
  red_green_expectation: red before (module absent), green after
- source: docs/contracts/ops_recommendations.yaml
  behavior: Declares exactly the rule list in its scope row.
  verification_step: 1
  test_selector: tests/test_contract_rules.py::test_ops_recommendations_declares_the_rule_table
  red_green_expectation: red before (no accepted_values, patterns or dates declared), green after
- source: docs/contracts/ops_decisions.yaml
  behavior: Declares exactly the rule list in its scope row.
  verification_step: 1
  test_selector: tests/test_contract_rules.py::test_ops_decisions_declares_the_rule_table
  red_green_expectation: red before (no id pattern, status values or integer_of declared), green after
- source: scripts/checks/contracts/validate_ops_rule_source.py
