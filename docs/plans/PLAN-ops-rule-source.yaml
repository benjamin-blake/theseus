- source: docs/contracts/data-modeling-standard.yaml
  behavior: The write-time-enforcement statement records the ops source, the exemption classes and the older-rows rule.
  verification_step: 5
  test_selector: tests/checks/contracts/test_ops_rule_source_records.py::test_standard_records_the_ops_source
  red_green_expectation: red before (the statement still defers the choice to rec-4158), green after
- source: docs/ROADMAP-PLATFORM.yaml
  behavior: CD.12, T1.6 and T2.29 carry the re-grounded text.
  verification_step: 5
  test_selector: tests/checks/contracts/test_ops_rule_source_records.py::test_roadmap_is_regrounded
  red_green_expectation: red before (Annotated metadata named as the source), green after
- source: docs/decisions-index.json
  behavior: Regenerated index matches the annotated corpus.
  verification_step: 8
  command: bin/venv-python -m scripts.validate
  waiver_reason: Generated artefact; the existing validate_decisions_index_freshness check fails on a stale index in the full tier run by step 8.
constraints:
- Deploy-inert -- no Lambda-packaged file, field_semantics.yaml, terraform or workflow change (Decision 79); enforcement is plan B.
- The portal, ops.yaml, src/schemas and the writer keep their current behaviour; plan C switches the portal and DQ.
- No contract budget raise and no amendment_log compaction; the flow-style rewrite is the only line relief (Decision 166, 128).
- Every pattern stays in the RE2-and-Python common subset; a rule live data breaks is a STOP back to /plan, never a widened gate (Decision 210 cl.4).
- Reads go through the DQ harness and named verbs only (Decision 84 I-3); no cache replay, no direct warehouse access.
- No rescue agents or workaround loops (Decision 55).
