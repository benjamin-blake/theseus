  verification_step: 2
  test_selector: tests/checks/contracts/test_validate_ops_rule_source.py::test_each_defect_fails
  red_green_expectation: red before (check absent), green after
- source: scripts/checks/contracts/_manifest.py
  behavior: Registers validate_ops_rule_source so the --pre and full tiers run it.
  verification_step: 2
  test_selector: tests/checks/contracts/test_validate_ops_rule_source.py::test_real_tree_passes
  red_green_expectation: red before (no entry), green after
- source: config/ci_rca_taxonomy.yaml
  behavior: Classifies the new check for ci-rca.
  verification_step: 8
  command: bin/venv-python -m scripts.validate
