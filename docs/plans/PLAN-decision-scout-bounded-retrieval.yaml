  - >-
    No prose-budget raise for .claude/skills/decision-scout/SKILL.md -- the budget must ratchet
    DOWN. Decision 152's reversal clause mandates the SPIRIT axis become leaner and query-driven
    "rather than prose-budget-funded"; the freed whole-file-read text funds the new protocol.
