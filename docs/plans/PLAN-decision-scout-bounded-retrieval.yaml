    does change, and this is not asserted away: Decision 152 gate (ii) requires a verbatim quote of
    the violated entry, which under bounded retrieval is only available for shortlisted entries
    unless the index carries an excerpt -- hence triage_excerpt. Gate (ii) is WIDENED to admit a
    Decision-clause quote, which is what takes coverage from 115 to 135 of 139. Measured residual:
    4 entries (63, 64, 65, 67 -- all live, the terse pre-77 band already in the fidelity baseline)
    carry no quotable marker at all; for those a SPIRIT flag can fire only if the entry is
    shortlisted. VP step 9 measures
    SPIRIT loss, and the governing Decision records this residual as the honest cost.
  - >-
    Triage and fetch must both remain credential-free and hermetic. The committed index and the
    source files are all in-tree. A degraded or truncated triage is stated VISIBLY in the report --
    never silent (Decision 55).
  - >-
    The header ceiling (120) and combined ceiling (700_000) are RETAINED. Decision 150's
    significance bar is complementary to the size guards, not a substitute. After retirement the
    HEADER ceiling is the FIRST binding constraint (~4 days at measured inflow), with the combined
    ceiling (~8 days) behind it -- the governing Decision's reversal conditions must key to the
    header axis, not the byte axis.
  - >-
    LAMBDA GATE DISPOSITION -- compute_affected_artifacts() flags the active `data-pipeline`
    artifact because docs/ROADMAP-PLATFORM.yaml is in scope, but that file appears only under the
    manifest's `assets:` key, never `handlers:`/`includes:`, and both functions are
    schedule-disabled. V2 with no deploy steps is correct, matching the precedent of
    PLAN-platform-roadmap-trim (Decision 147's own plan, which rewrote 2,667 roadmap lines at V2)
    and PLAN-t5-3-scheduled-surface-rehome (V1). Stated here so the mechanical check's disagreement
