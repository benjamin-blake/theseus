rollback: >-
  Every change is a file edit on a branch; revert the merge commit to restore the whole-file-read
  protocol and the live-byte ceiling. The ops_decisions backfill is content-hash-gated and
  append-preserving (SCD2), so reverting docs/DECISIONS.md simply produces a new version on the next
  backfill -- no warehouse rollback is needed and no row is destroyed. No infrastructure, no Lambda
  deploy, no schema change, no credentialed write beyond the backfill, so there is nothing to
  un-deploy. If VP step 9 shows CITE regressions that cannot be closed by enriching the projection,
  revert the SKILL.md change alone and keep the index `live` field -- they are independently useful.
