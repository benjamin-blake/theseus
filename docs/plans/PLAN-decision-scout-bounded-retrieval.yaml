constraints:
  - >-
    ZERO-EGRESS RETRIEVAL (Decision 88 invariant (ii), "never an ad-hoc re-fetch of data in hand").
    The shortlist body fetch reads the SOURCE FILES by targeted section, not the warehouse. An
    earlier draft routed it through the decision_by_id verb; that would have metered Neon egress
    per /plan for bodies already on disk (the synced cache already holds raw_block for 139/140
    rows). The verb and T0.8's MCP server remain available and are deliberately deferred to T1.5,
    so this plan needs no credentials, no egress, and no MCP dependency, and the scout gate cannot
    fail because a reader blipped. Reading docs/DECISIONS.md is reading the SOURCE OF TRUTH
    (Decision 84/146: it is the authoring surface and sole ETL source, upstream of the warehouse),
    not replaying a read cache -- the warehouse-as-SoT invariant is not engaged.
