schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-scout-bounded-retrieval"
intent: >-
  Unwedge the decision-authoring path by removing the reason its ceiling exists: repoint the
  decision-scout gate from a whole-file read of docs/DECISIONS.md onto the already-built committed
  index plus targeted reads of only the shortlisted entries, then RETIRE the live-byte ceiling --
  the response Decision 145's own reversal conditions name. The retained HEADER ceiling (120) is
  the first binding constraint afterwards (~4 days at measured inflow), with the combined ceiling
  (~8 days) behind it. No ceiling constant is raised.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-scout-bounded-retrieval.yaml
phase: >-
  Platform T1 (decision-knowledge persistence). Interim retrieval arrangement ahead of T1.5's
  portal cutover -- explicitly NOT the cutover itself (Decision 134 clause 5). Includes a T0.8
  roadmap-bookkeeping closeout surfaced by the Tier Item Freshness Gate.

scope:
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      Add a `live: bool` field to each projected row, derived from source-file provenance via
      decisions_md.decision_header_numbers(paths=[docs/DECISIONS.md]). The shared parser is NOT
      modified -- decision_header_numbers already accepts an explicit paths list, so provenance is
      derivable in the generator without changing parse_decisions_md's row shape (which feeds the
      ops_decisions ETL allowlist). ALSO add `triage_excerpt` (<=320 chars, fallback order
      Intent -> Problem -> Context/Rationale -> Decision), `triage_excerpt_source` naming which
      marker it came from, and `triage_excerpt_truncated` (bool) so a truncated fragment can never
      be presented as a complete quote. This is the Decision 152 gate (ii) anchor: a SPIRIT flag
      must quote the violated entry VERBATIM, and without an excerpt a spirit violation in a
      NON-shortlisted entry is structurally unquotable. MEASURED under this exact spec
      (json.dumps indent=2, sort_keys=True, as _EXPORT_PATH is written): projection = 97,782 bytes,
      19.6% of the live file, an 80% cut; 135 of 139 entries quotable, the 4 residual being 63/64/65/67
      -- the terse pre-77 band already carried in the fidelity baseline. The Decision-clause fallback
      is what takes coverage from 115 to 135; `**Decision:**` is a REQUIRED marker per
      docs/contracts/decision-entry.yaml, so it is the most reliable anchor available. This widens
      Decision 152 gate (ii) to admit a Decision-clause quote, which the SKILL.md rewrite must state
      and the governing Decision must record.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated committed projection carrying the new `live` field.
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Replace Phase 1 step 1's whole-file read with index triage plus targeted reads of only the
      shortlisted entries from the source files; fix the Quality-Gate checkbox at line 134 that
      independently mandates a full-file read; REWRITE (never delete) the Lambda-migration-contract
      section more tersely, folding in the explicit T1.5 c1 pointer rec-2774 asks for; re-ground
      the Decision 105 mis-cite at line 26. Must end strictly smaller than 11379 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the decision-scout SKILL.md budget DOWN to its new smaller size, performing the
      revisit Decision 152's reversal clause mandates ("leaner and query-driven rather than
      prose-budget-funded"). No raise; a decrease needs no marker, so the dec-152 raise marker is
      reduced or removed to match.
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      RETIRE _DECISIONS_LIVE_MAX_BYTES, its `live_max_bytes` parameter in _decisions_size_issues,
      and its FAIL branch. _DECISIONS_LIVE_MAX_H2 (120) and _DECISIONS_COMBINED_MAX_BYTES (700_000)
      are UNCHANGED and remain enforced -- the combined ceiling continues to bound the live file
      (live <= 700_000 minus archive bytes, ~588_930 today). Rewrite the docstring, which currently
      grounds the retired ceiling in the whole-file read this plan removes. ALSO rewrite
      `_RELIEF_VALVES` (lines 24-28), which is emitted in the COMBINED-breach message and still
      advises "archive superseded entries" -- provably inert against the combined ceiling, since
      archival only moves bytes between the two counted files. This demotes a relief valve Decision
      146 ratified, so the governing Decision must record a Decision 146 amendment alongside the
      Decision 151 one.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Remove size_governance.live_max_bytes to match the validator (the validator is the SoT) and
      document the bounded-retrieval model plus the combined ceiling as the live-file backstop.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Author the governing Decision entry recording the retirement, the reversal-trigger
      adjudication, the Decision 145 / 134 clause 2 amendments, the Decision 152 revisit, the
      Decision 151 backstop consequence, the dated runway, and the interim-not-cutover framing.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Flip T0.8 status not_started -> complete with completed_at + evidence note (built and merged:
      scripts/agent_sdk/mcp_server.py, registered in .mcp.json). Also replace T1.5 c1's FRAGILE
      line-number citation "SKILL.md:18-20" with a section-name citation, since this plan rewrites
      that section. Do NOT edit the `- id: T0.8` line itself (see the guard note in context).
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      rec-2479: replace the plan-template pre_implementation_checklist entry "DECISIONS.md read"
      with wording containing the exact phrase "only the plan-cited decision sections" (the rec's
      recorded acceptance string). Net non-positive bytes.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Assert `live` correctness against file provenance (derived from decision_header_numbers(),
      never hardcoded counts) and determinism across two builds. ALSO cover the three new excerpt
      fields: each of the four fallback branches (Intent / Problem / Context / Decision), the
      empty-excerpt branch, the 320-char cap, and the truncation flag. NOTE: the existing
      `set(entry.keys()) == expected_keys` assertion at lines 35-39 WILL fail the moment the three
      new keys land and must be extended in the same commit.
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: >-
      Drop the retired live-ceiling assertions. THREE sites consume the constant and must change
      together: the module-level import (line 9), TestDecisionsSizeIssues' live-boundary cases
      (lines 22-38), the comment at line 64, and TestDecisionsSizeIssuesReliefValveMessage (lines
      93-95) -- the last must be re-pointed onto a COMBINED breach and assert the REWRITTEN valve
      text, never that the guard still advises archival. Pin 120 and 700_000; add a case proving a
      live file above the old 500_000 value passes while a combined breach FAILs.
  - file: tests/test_decision_scout_retrieval.py
    action: Create
    purpose: >-
      Curated retrieval probes: for each (approach keyword-set -> expected decision number) pair,
      assert the committed index carries discriminating signal for the expected entry. A mechanical
      proxy for triage recall; the live-dispatch comparison in VP step 9 is the real measurement.

bundled_recommendations:
  - rec-2783
  - rec-2774
  - rec-2479

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    docs/decisions-index.json carries a boolean `live` field on every entry; the count of live:true
    rows equals the live-file `## Decision` header count, and live:false equals the archive header
    count. Every entry with an Intent, Problem, Context or Decision marker carries a non-empty
    `triage_excerpt` with `triage_excerpt_source` naming its origin and `triage_excerpt_truncated`
    set correctly (135 of 139 at authoring time; residual 63/64/65/67). The committed projection is
    at most 110,000 bytes -- pinned so the figure recorded in the governing Decision (97,782 B,
    19.6% of the live file) cannot silently drift.
  - >-
    scripts.decisions_index regenerates byte-identically on consecutive runs and
    validate_decisions_index_freshness passes.
  - >-
    .claude/skills/decision-scout/SKILL.md contains no instruction to read the entire or full
    docs/DECISIONS.md (including the Quality-Gate checkbox), names docs/decisions-index.json as the
    triage source, names T1.5 (rec-2774's recorded acceptance), and is STRICTLY SMALLER than 11379
    bytes with config/prose_budgets.yaml ratcheted down to match.
  - >-
    No file under .claude/ carries an IMPERATIVE to read the entire or full docs/DECISIONS.md, and
    no LIVE surface (docs/ROADMAP-PLATFORM.yaml, docs/contracts/, .claude/) cites
    .claude/skills/decision-scout/SKILL.md by line number. Frozen historical artifacts
    (docs/audit-prompts/, docs/plans/) are deliberately excluded -- they are not edited.
  - >-
    _DECISIONS_LIVE_MAX_BYTES no longer exists in
    scripts/checks/decisions/validate_decisions_size.py; _DECISIONS_LIVE_MAX_H2 is still 120 and
    _DECISIONS_COMBINED_MAX_BYTES is still 700000, and the combined guard still FAILs on a
    synthetic breach.
  - >-
    A LIVE decision-scout dispatch on the bounded protocol loses NO CITE entry AND NO SPIRIT flag
    relative to the pre-change whole-file baseline, across at least two probe briefs. This is an
    ordering-constrained SELF-ATTESTATION over gitignored evidence, not a CI-enforced gate: its one
    hard property is that the baseline is captured before the rewrite exists, so it cannot be
    retro-fitted to a lossy bounded run without deliberate falsification.
  - >-
    A new `## Decision NNN:` entry exists recording the ceiling retirement, the Decision 145/152
    reversal-trigger adjudication, the Decision 145 / 134 clause 2 / 146 amendments, the widening of
    Decision 152 gate (ii) to admit a Decision-clause quote, the Decision 151 backstop consequence,
    the newly-unguarded docs/decisions-index.json surface, the DATED runway of the surviving ceilings with a named
    owner, and that this arrangement is interim and NOT the T1.5 portal cutover; ops_data_portal
    --backfill-decisions-md completes green with the new entry in ops_decisions.
  - >-
    docs/ROADMAP-PLATFORM.yaml T0.8 reads status: complete with completed_at and an evidence note,
    and every one of its six exit criteria is independently confirmed met.
  - The curated retrieval probes pass, and bin/venv-python -m scripts.validate --pre exits 0.
  - >-
    .claude/skills/planning/SKILL.md contains the exact phrase "only the plan-cited decision
    sections" (rec-2479's recorded acceptance string).
  - >-
    Post-merge, rec-2783, rec-2774 and rec-2479 all read status closed in the synced local cache,
    and BOTH follow-on recommendations exist: the successor watch on the surviving binding ceilings
    (rec-2783's named resolution) and the deferred per-entry authoring size norm on which the
    runway disclosure's honesty depends.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the committed index's live/archive split matches file provenance via the SHARED parser
      (DAF-03 one-parser rule -- no second header regex), and that every triage_excerpt names its
      source. Read-only; regeneration is an execution step, not a verification side effect.
    command: >-
      bin/venv-python -c "import json,pathlib;
      from scripts.decisions_md import decision_header_numbers as H;
      R=pathlib.Path('docs');
      live=H(paths=[R/'DECISIONS.md']); arc=H(paths=[R/'DECISIONS_ARCHIVE.md']);
      d=json.load(open('docs/decisions-index.json'))['decisions'];
      L={x['number'] for x in d if x['live']}; A={x['number'] for x in d if not x['live']};
      exc=[x for x in d if (x.get('triage_excerpt') or '').strip()];
      size=len(pathlib.Path('docs/decisions-index.json').read_bytes());
      print('live',len(L),len(live),'archive',len(A),len(arc),'excerpts',len(exc),'bytes',size);
      assert L==live and A==arc, 'provenance mismatch';
      assert all(x.get('triage_excerpt_source') for x in exc), 'excerpt without source';
      assert all('triage_excerpt_truncated' in x for x in d), 'missing truncation flag';
      assert len(exc) >= len(d)-4, f'excerpt coverage regressed: {len(exc)}/{len(d)}';
      assert size <= 110000, f'projection over pin: {size}'"
    expected: >-
      Prints matching counts and exits 0; the live and archive number SETS equal what
      decision_header_numbers() reports per file, every non-empty excerpt names its source and
      carries a truncation flag, at most 4 entries lack an excerpt, and the committed projection is
      within the 110,000-byte pin.
    fix_if: >-
      Counts diverge -- the generator is deriving provenance from something other than
      decision_header_numbers(paths=[live]). Note build_index()'s dict comprehension at
      scripts/decisions_index.py:62 is LAST-occurrence-wins across the two files (overlap is zero
      today, so this is latent); if a number ever appears in both files the archive copy would win
      and its `live` flag would be wrong.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decisions-index-live-count-matches-file"
  - step: 2
    phase: pre-deploy
    action: Assert the index is deterministic and the committed copy is not drifted.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0, no drift reported.
    fix_if: >-
      Drift reported -- a volatile field leaked into the projection, or the committed JSON was not
      regenerated (bin/venv-python -m scripts.decisions_index --write) after the generator change.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_decisions_index_freshness, already registered in both the --pre and full
      tiers; graduating it would register a second check on one surface.
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the scout protocol changed as specified -- no whole/full-file read anywhere in the
      skill, the index named as triage source, and T1.5 named (rec-2774).
    command: >-
      bash -c '! grep -qE -e "entire.{0,8}docs/DECISIONS\.md" -e "full.{0,12}DECISIONS\.md"
      .claude/skills/decision-scout/SKILL.md
      && grep -qE "decisions-index.json" .claude/skills/decision-scout/SKILL.md
      && grep -qE "T1\.5" .claude/skills/decision-scout/SKILL.md'
    expected: >-
      Exit 0 -- both whole-file-read phrasings are gone (including the Quality-Gate checkbox at
      line 134 and the description/intent prose at lines 3 and 8), the index is named, and T1.5 is
      named.
    fix_if: >-
      Non-zero exit. The `full` alternation is the one an earlier draft of this plan missed: line
      134's "You read the full DECISIONS.md (not a truncated section)" is a normative self-check
      that mandates a whole-file read in different words. If the T1.5 clause is missing, the
      Lambda-migration-contract rewrite dropped rec-2774's pointer.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decision-scout-bounded-read-protocol"
  - step: 4
    phase: pre-deploy
    action: Assert the scout skill shrank (Decision 152's mandated revisit -- leaner, not budget-funded).
    command: >-
      bin/venv-python -c "import yaml,pathlib; K='.claude/skills/decision-scout/SKILL.md';
      size=len(pathlib.Path(K).read_bytes());
      budget=yaml.safe_load(open('config/prose_budgets.yaml'))['S4'][K];
      print('size',size,'budget',budget,'was 11379');
      assert size < 11379, f'skill did not shrink: {size}';
      assert budget < 11379, f'budget not ratcheted down: {budget}';
      assert size <= budget, f'over budget: {size} > {budget}'"
    expected: >-
      Exit 0 -- the file is strictly smaller than the old 11379, the S4 budget entry was ratcheted
      strictly below 11379, and the file is within its new budget.
    fix_if: >-
      Non-zero exit. Fund the new protocol text by compressing the Lambda-migration-contract and
      why-a-subagent sections IN PLACE -- do not delete them; docs/ROADMAP-PLATFORM.yaml T1.5 c1
      and .claude/skills/planning/SKILL.md both reference that contract. Never take a prose-budget
      raise here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The byte assertion is subsumed by validate_prose_limits once config/prose_budgets.yaml is
      ratcheted down -- the registry enforces current<=budget in the --pre tier, so graduating this
      would be a second check on the same surface. The behavioural half is graduated as step 3.
  - step: 5
    phase: pre-deploy
    action: >-
      Stale-reference sweep -- no agent-instruction surface still mandates a whole-corpus read, and
      no surface cites the rewritten skill by line number.
    command: >-
      bash -c 'test $(grep -rlE -e "[Rr]ead the (\*\*)?(entire|full)(\*\*)?.{0,12}DECISIONS\.md"
      -e "DECISIONS\.md read" .claude/ 2>/dev/null | wc -l) -eq 0
      && ! grep -rqE "decision-scout/SKILL\.md:[0-9]" docs/ROADMAP-PLATFORM.yaml docs/contracts/ .claude/'
    expected: Exit 0 -- zero matching files across .claude/, and no line-number citation anywhere.
    fix_if: >-
      A match remains. The pattern deliberately targets the IMPERATIVE form ("Read the entire/full
      ... DECISIONS.md") and NOT every mention: pre-change it matches exactly three sites --
      decision-scout/SKILL.md:26 (Phase 1) and :134 (the Quality-Gate checkbox), and
      planning/SKILL.md:514 (the plan-template checklist, rec-2479). It must NOT match
      .claude/commands/plan.md:47 or planning/SKILL.md:423, which INSTRUCT AGENTS NOT to load the
      file -- this step is graduated, so a mention-matching pattern would permanently forbid writing
      "do not load the full DECISIONS.md". The line-number clause is scoped to LIVE surfaces only;
      docs/audit-prompts/ and docs/plans/ carry three further citations and are frozen historical
      artifacts that must not be edited. RESIDUAL (accepted): the pattern still cannot parse a
      negation, so once graduated it also forbids phrasings like "Do not read the entire
      docs/DECISIONS.md" or "Never read the full DECISIONS.md", and the bare `DECISIONS.md read`
      alternation forbids noun-phrases such as "the bounded DECISIONS.md read protocol". Failures are
      loud and rephrasable -- prefer "do not load the full corpus" / "the bounded retrieval
      protocol".
    hermetic: true
    graduation: graduate
    graduation_check_id: "no-whole-decisions-read-instructions"
  - step: 6
    phase: pre-deploy
    action: >-
      Assert the live-byte ceiling is retired, the two surviving ceilings are untouched, and the
      combined guard still fires on a synthetic breach.
    command: >-
      bin/venv-python -c "import scripts.checks.decisions.validate_decisions_size as m;
      assert not hasattr(m,'_DECISIONS_LIVE_MAX_BYTES'), 'live ceiling not retired';
      assert m._DECISIONS_LIVE_MAX_H2 == 120, m._DECISIONS_LIVE_MAX_H2;
      assert m._DECISIONS_COMBINED_MAX_BYTES == 700000, m._DECISIONS_COMBINED_MAX_BYTES;
      f=[]; m.validate_decisions_size(f); assert not f, f;
      big=m._decisions_size_issues('x'*400000, 'y'*400000);
      assert any('combined' in i for i in big), big;
      print('retired; 120/700000 intact; combined guard fires')"
    expected: >-
      Exit 0 -- the live-byte constant is gone, header and combined constants unchanged, the real
      corpus passes, and a synthetic 800KB corpus still trips the combined FAIL.
    fix_if: >-
      Assertion fires -- the constant survives (retire it, its parameter at line 36, and its FAIL
      branch at lines 48-53), a surviving ceiling was silently moved, or _decisions_size_issues'
      signature changed so the synthetic breach no longer reaches the combined branch.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decisions-live-ceiling-retired-others-intact"
  - step: 7
    phase: pre-deploy
    action: Curated retrieval probes -- the index carries discriminating signal for known targets.
    command: bin/venv-python -m pytest tests/test_decision_scout_retrieval.py -q
    expected: All probes pass.
    fix_if: >-
      A probe fails -- the index projection lacks signal for that decision. Do NOT weaken the probe;
      either enrich the projection (e.g. carry the typed Intent field) or record the miss as a known
      retrieval gap in the governing Decision.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decision-scout-retrieval-probes"
  - step: 8
    phase: pre-deploy
    action: Assert the T0.8 closeout is grounded -- status, date, AND every exit criterion confirmed.
    command: >-
      bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      seen={};
      w=lambda o:[w(v) for v in o.values()] if isinstance(o,dict) and (seen.setdefault(o.get('id'),o) or True)
      else [w(i) for i in o] if isinstance(o,list) else None; w(d);
      t=seen['T0.8']; assert t['status']=='complete', t['status']; assert t.get('completed_at'), 'no completed_at';
      assert t.get('progress_note') or t.get('note'), 'no evidence note';
      assert pathlib.Path('scripts/agent_sdk/mcp_server.py').exists(), 'deliverable missing';
      assert 'ducklake-reads' in pathlib.Path('.mcp.json').read_text(), 'not registered';
      print('T0.8', t['status'], t['completed_at'], '|', len(t['exit_criteria']), 'criteria')"
    expected: >-
      Exit 0 -- status complete, completed_at present, an evidence note present, and the two
      deliverable facts (module exists, server registered) independently confirmed.
    fix_if: >-
      Assertion fires. Note the criteria are bare strings today; adjudicate all six by hand before
      flipping status (the write leg is explicitly DEFERRED per Decision 143 and tracked
      separately, so it does not block completion). Do NOT touch the `- id: T0.8` line itself --
      validate_platform_roadmap guard (ii) keys touched_ids off `^[+-]\s+- id: (\S+)`, so editing
      that line would demand converting all six criteria to ExitCriterion objects in this PR.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time landing assertion about a single tier_item's status, not a durable invariant.
      Graduating it would pin T0.8's status in the standing registry forever with no regression
      value, and the registry would fail the day a legitimate future edit revisits the item.
  - step: 9
    phase: pre-deploy
    action: >-
      Live recall measurement -- the bounded protocol must lose no CITE and no SPIRIT flag relative
      to the whole-file baseline, across at least two probe briefs.
    command: >-
      bin/venv-python -c "import json,pathlib;
      bp=pathlib.Path('logs/debug/scout-baseline.json'); np=pathlib.Path('logs/debug/scout-bounded.json');
      assert bp.exists(), 'baseline missing -- it must be captured BEFORE the SKILL.md rewrite';
      assert np.exists(), 'bounded run missing -- dispatch the rewritten scout on the SAME briefs';
      b=json.loads(bp.read_text()); n=json.loads(np.read_text());
      assert len(b)>=2, f'need >=2 probe briefs, got {len(b)}';
      assert set(b)==set(n), f'probe-name mismatch: {sorted(set(b)^set(n))}';
      miss={k:{a:sorted(set(b[k].get(a,[]))-set(n[k].get(a,[]))) for a in ('cite','spirit')
      if set(b[k].get(a,[]))-set(n[k].get(a,[]))} for k in b};
      miss={k:v for k,v in miss.items() if v};
      print('probes:', sorted(b)); print('regressions:', miss); assert not miss, miss"
    expected: >-
      Exit 0 -- for each of >=2 probe briefs, every CITE and every SPIRIT flag the whole-file
      baseline produced is also produced by the bounded protocol.
    fix_if: >-
      A CITE or SPIRIT entry went missing -- the index projection lacks the signal that surfaced it.
      For SPIRIT specifically, Decision 152 gate (ii) requires a verbatim quote, so a miss means the
      entry's triage_excerpt is absent or too short; widen the excerpt before anything else. Do NOT
      relax the probe or drop the missing decision. If the BASELINE file is absent the execution
      order was violated -- recover via `git show origin/main:.claude/skills/decision-scout/SKILL.md`
      and re-run. If the BOUNDED file is absent, the post-rewrite dispatch was skipped.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible in shape (command_exit_zero) but it reads two gitignored artifacts produced
      by this session's own scout dispatches -- exactly the "depends on this session's transient
      repo state" waiver case. Graduating it would make the standing registry fail on every future
      run where logs/debug/ is empty, and the registry is hermetic-only (same reasoning as steps 10
      and 11).
  - step: 10
    phase: pre-deploy
    action: >-
      ETL the new Decision entry to ops_decisions and confirm the fidelity tripwire and orphan guard
      stay green.
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md
    expected: >-
      Exits 0; the new decision number appears in ops_decisions; no fidelity-tripwire RuntimeError
      and no orphaned-current-row divergence.
    fix_if: >-
      Fidelity tripwire fires -- the new entry parses to an empty governing section; fix the entry
      grammar per docs/contracts/decision-entry.yaml rather than allowlisting it. If the reader is
      credential-unavailable, re-run after refreshing the agent_platform chain (Decision 55 -- never
      skip silently).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Non-hermetic credentialed warehouse write. The graduation registry is hermetic-only, so this
      cannot become a standing check even though its shape (command_exit_zero) is kernel-expressible
      -- the same reasoning applied to step 11.
  - step: 11
    phase: pre-deploy
    action: Full fast-tier presubmit.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any check fails -- fix forward; never weaken a check to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step IS the presubmit suite; graduating it into the verification registry would make the
      registry invoke itself. The skill also forbids marking a validate --pre step hermetic
      (recursion).
