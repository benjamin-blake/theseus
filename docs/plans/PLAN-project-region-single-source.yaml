    each concluded success (they never run on a PR, so this is their live proof).
  command: 'echo ''VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="benjamin-blake", repo="theseus",
    resource_id=<each of the four workflow files>, workflow_runs_filter={"event": "schedule"}) -- the first run created after
    the merge time, conclusion success'''
  expected: Four success conclusions on runs created after the merge.
  fix_if: A failure at the aws-region or sign-in step is this change; fix forward. Deploy and dispatch-only workflows (deploy-*,
    reconcile, provider-mirror-seed, tf-gated-apply-prototype) are proven structurally by the guard and live on their next
