schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: project-region-single-source
intent: 'Close Decision 202 clause 4''s two declared residuals (rec-4067): the AWS region lives in one committed file, config/aws-region,
  which every workflow sign-in and every Terraform S3 backend reads and a presubmit guard enforces, so the platform stays
  shippable as a tool whose users set exactly one region.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-project-region-single-source.yaml
phase: 'ad_hoc_rec (soft-warn category): rec-4067, the Decision 202 clause 4 residual owner. No tier_item is claimed and no
  exit criterion is closed; rec-4403 (one home per kind of user-set configuration for otl init, T4.24) cites this plan as
  its worked example.'
scope:
- file: config/aws-region
  action: Create
  purpose: 'The project''s one AWS region: exactly one line, eu-west-2, with a trailing newline and nothing else (no comment).
    Read by .github/actions/aws-region, by hand-run terraform init and by validate_project_region.'
- file: .github/actions/aws-region/action.yml
  action: Create
  purpose: 'Composite action, no inputs. One step, id resolve, shell bash, whose body is exactly `bash "${{ github.action_path
    }}/resolve.sh"` (Decision 162 R1 anchored delegate: no set -e line beside it). Output aws_region with value ${{ steps.resolve.outputs.aws_region
    }}. Description names config/aws-region and rec-4067. No ${{ }} outside runs and outputs (validate_composite_action_manifests);
    never calls configure-aws-credentials (validate_actions_account_id_masking R4).'
- file: .github/actions/aws-region/resolve.sh
  action: Create
  purpose: 'Reads "$GITHUB_ACTION_PATH/../../../config/aws-region" (the checkout the action was loaded from) and strips whitespace.
    Missing or empty: prints ::error::REGION_MISSING naming the file and exits 1. Not matching ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$:
    prints ::error::REGION_INVALID with the rejected value and exits 1. Otherwise appends AWS_REGION=<r> and AWS_DEFAULT_REGION=<r>
    to $GITHUB_ENV and aws_region=<r> to $GITHUB_OUTPUT and prints REGION_OK <r>. Runs under GitHub''s inherited errexit (bash
    --noprofile --norc -e -o pipefail) and checks every failure path explicitly, as materialise_tfvars.sh does.'
- file: .github/actions/build-ducklake-artifacts/action.yml
  action: Modify
  purpose: 'The region input drops `default: "eu-west-2"` and its description says it falls back to AWS_REGION (exported by
    the aws-region action or the sign-in). The step env mapping becomes REGION: ${{ inputs.region || env.AWS_REGION }}. The
    inline body is untouched (22 effective lines, build-ducklake-artifacts::#0 baseline unchanged).'
- file: .github/workflows/backlog-health.yml
  action: Modify
  purpose: 'jobs census and escalate: add the aws-region step after each job''s checkout; both sign-ins take aws-region from
    env.AWS_REGION. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/ci-rca-inactivity-sweep.yml
  action: Modify
  purpose: 'job sweep: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the redundant step-level
    AWS_DEFAULT_REGION entry (the action exports it). Common rule: no comment or scalar in the file contains an AWS region
    id afterwards.'
- file: .github/workflows/ci-rca.yml
  action: Modify
  purpose: 'job rca: add the aws-region step after checkout; the sign-in takes env.AWS_REGION. Common rule: no comment or
    scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/ci.yml
  action: Modify
  purpose: 'pr-validate (no sign-in; its --pre step builds boto3 clients): add the aws-region step after checkout and delete
    that step''s AWS_DEFAULT_REGION env entry; main-validate, trailer-census, trailer-closure and terraform-validate: add
    the step after checkout, sign-ins take env.AWS_REGION, and main-validate''s redundant step-level AWS_DEFAULT_REGION entry
    goes. Job names (pr-validate, terraform-validate are required checks, Decision 83) are unchanged. Common rule: no comment
    or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/convergence-health.yml
  action: Modify
  purpose: 'job health-check: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the job-level
    AWS_DEFAULT_REGION entry. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/cost-reconciliation.yml
  action: Modify
  purpose: 'job reconcile: add the aws-region step after checkout; the sign-in takes env.AWS_REGION. Common rule: no comment
    or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/dedup-probe.yml
  action: Modify
  purpose: 'job probe: add the aws-region step after checkout; the sign-in takes env.AWS_REGION. Common rule: no comment or
    scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/deploy-ducklake-lambdas.yml
  action: Modify
  purpose: 'jobs deploy-maintenance, maintenance-smoke, deploy-serving and smoke: add the aws-region step after each checkout;
    sign-ins take env.AWS_REGION; delete the four job-level AWS_DEFAULT_REGION entries; the four aws CLI --region flags become
    --region "$AWS_REGION" (same line count; r3_workflows ceilings and step names unchanged). Common rule: no comment or scalar
    in the file contains an AWS region id afterwards.'
- file: .github/workflows/deploy-prod-lambdas.yml
  action: Modify
  purpose: 'jobs deploy and smoke: add the aws-region step after each checkout; sign-ins take env.AWS_REGION; delete both
    job-level AWS_DEFAULT_REGION entries; the three aws CLI --region flags become --region "$AWS_REGION". Common rule: no
    comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/main-canary.yml
  action: Modify
  purpose: 'job canary: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the redundant step-level
    AWS_DEFAULT_REGION entry. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/rec-autoclose.yml
  action: Modify
  purpose: 'job autoclose: add the aws-region step after checkout; the sign-in takes env.AWS_REGION. Common rule: no comment
    or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/reconcile.yml
  action: Modify
  purpose: 'Delete the workflow-level AWS_DEFAULT_REGION entry. resolve-target: add a step with id region using ./.github/actions/aws-region
    right after its checkout, a job output aws_region bound to steps.region.outputs.aws_region, and its sign-in takes env.AWS_REGION.
    apply-reconcile, gated-apply-reconcile and file-reconcile-starved-rec (all already need resolve-target) take aws-region
    from needs.resolve-target.outputs.aws_region and gain NO step: the two red-commit jobs resolve every local action from
    RED_SHA, which predates config/aws-region (Decision 154 clause 2 unchanged). Net +2 effective lines: 534 -> 536, exactly
    the config/structural_size_budgets.yaml ceiling. Common rule: no comment or scalar in the file contains an AWS region
    id afterwards.'
- file: .github/workflows/security-detector-liveness.yml
  action: Modify
  purpose: 'job probe: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the job-level AWS_DEFAULT_REGION
    entry. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: 'Delete the workflow-level AWS_DEFAULT_REGION entry. apply-sandbox, speculative-plan, advisory-status and gated-apply:
    add the one-line step `- uses: ./.github/actions/aws-region` right after each job''s checkout (unnamed, no id; step 0
    stays the checkout) and each sign-in takes env.AWS_REGION. Net +3 effective lines: 547 -> 550, exactly the budget ceiling.
    The CI terraform init reads AWS_REGION exported by the sign-in. Common rule: no comment or scalar in the file contains
    an AWS region id afterwards.'
- file: .github/workflows/terraform-drift.yml
  action: Modify
  purpose: 'job drift-detect: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the job-level
    AWS_DEFAULT_REGION entry. Its inline init (backend-sandbox.hcl) then reads AWS_REGION from the sign-in. Common rule: no
    comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/terraform-github-plan.yml
  action: Modify
  purpose: 'job plan: add the aws-region step after checkout; the sign-in takes env.AWS_REGION. Its terraform init then reads
    AWS_REGION (the terraform/github backend names no region). This PR edits the workflow, so it runs on the PR itself. Common
    rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/terraform-provider-mirror-seed.yml
  action: Modify
  purpose: 'job seed-mirror: add the aws-region step after checkout; the sign-in takes env.AWS_REGION; delete the job-level
    AWS_DEFAULT_REGION entry. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: .github/workflows/tf-gated-apply-prototype.yml
  action: Modify
  purpose: 'job gate-smoke-test has no checkout today: add actions/checkout@v7 and then the aws-region step before the sign-in,
    which takes env.AWS_REGION. Common rule: no comment or scalar in the file contains an AWS region id afterwards.'
- file: terraform/bootstrap/main.tf
  action: Modify
  purpose: Delete the region line from the backend "s3" block; the S3 backend then reads AWS_REGION or an init-time -backend-config
    region. A one-line comment may say so (no region id in it). terraform fmt clean.
- file: terraform/github/main.tf
  action: Modify
  purpose: Delete the region line from the backend "s3" block, as for bootstrap. No other change in this root (the org-transfer
    rewrite and PLAN-terraform-github-state-reconcile own the rest).
- file: terraform/personal/backend-sandbox.hcl
  action: Modify
  purpose: Delete the region line; the header comment says the region comes from AWS_REGION in CI or a -backend-config region
    from config/aws-region at hand-run init. Bucket, key, encrypt and use_lockfile unchanged.
- file: terraform/personal/variables.tf
  action: Modify
  purpose: neon_region_id's description drops the bare region id ("co-locates with the data lake in the project region");
    its default (aws-eu-west-2) and every other variable are unchanged, so the plan is empty. aws_region's default stays,
    pinned to config/aws-region by the guard.
- file: scripts/checks/ci_guards/validate_project_region.py
  action: Create
  purpose: 'Registered fast-tier check, filesystem-only (Decision 208). Rules: (1) config/aws-region is one valid region id;
    (2) no AWS region or availability-zone id in any YAML string scalar under .github/workflows/** and .github/actions/**
    (region-agnostic: (?<![\w-])(af|ap|ca|cn|eu|il|me|mx|sa|us|us-gov)-(central|north|south|east|west|northeast|southeast|northwest|southwest)-\d[a-z]?(?![\w-]),
    so the Neon id aws-eu-west-2 is not matched); (3) no such id in comment-stripped terraform/**/*.tf or *.hcl except the
    default of variable "aws_region" in terraform/bootstrap/variables.tf and terraform/personal/variables.tf, each of which
    must equal config/aws-region; no backend "s3" block or backend*.hcl sets region; (4) every configure-aws-credentials step''s
    aws-region is ${{ env.AWS_REGION }} with an earlier ./.github/actions/aws-region step in the same job that itself follows
    a checkout, or ${{ needs.<job>.outputs.aws_region }} where that job is in needs and binds aws_region to a step using the
    action; (5) no workflow, job or step env sets AWS_REGION or AWS_DEFAULT_REGION. Failure text names file, job and step,
    never a value beyond the region id. Declares examined() with the number of files and sign-in steps scanned (Decision 170).
    Under 500 SLOC; split into a helper module if it grows.'
- file: scripts/checks/ci_guards/_manifest.py
  action: Modify
  purpose: One Entry(name="validate_project_region", module="scripts.checks.ci_guards.validate_project_region", attr="validate_project_region",
    pre=True, pre_globs=(".github/workflows/**", ".github/actions/**", "terraform/**", "config/aws-region", "scripts/checks/ci_guards/validate_project_region.py",
    "scripts/checks/_common.py", "scripts/checks/registry.py"), full_segment="full_after_lint") (Decision 169 bare literals).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'function_to_category row validate_project_region: code_regression.'
- file: tests/checks/ci_guards/test_validate_project_region.py
  action: Create
  purpose: Mirror test (Decision 131). One red case per rule on tmp trees (a literal aws-region, a literal in a run body,
    an AZ id, a backend region line, a backend*.hcl region, a default differing from the file, an unwired sign-in, a reader
    step before checkout, a needs-output from a job that does not run the action, an env AWS_DEFAULT_REGION, an empty and
    an invalid config/aws-region), the Neon id and a comment-only mention staying green, and test_real_tree_passes running
    the check on the real repository with no failures and a non-zero examined count.
- file: tests/test_aws_region_action.py
  action: Create
  purpose: 'Drives resolve.sh under the literal composite argv ("bash", "--noprofile", "--norc", "-e", "-o", "pipefail"),
    Decision 162 R2, in a tmp tree laid out like the repo (tmp/.github/actions/aws-region/resolve.sh, tmp/config/aws-region)
    with tmp GITHUB_ENV and GITHUB_OUTPUT files: valid value exports both env vars and the output and prints REGION_OK; missing
    file and whitespace-only file print REGION_MISSING and exit 1 writing nothing; an invalid value prints REGION_INVALID
    and exits 1. Wiring: action.yml''s only step is the anchored delegate and the output binds steps.resolve.outputs.aws_region.'
- file: tests/test_security_detector_liveness_workflow.py
  action: Modify
  purpose: 'The reserved-session-name red case''s mutation anchors move to the new sign-in text (aws-region: ${{ env.AWS_REGION
    }}); the assertion and every other case are unchanged (no weakening, Decision 181).'
- file: terraform/bootstrap/CLAUDE.md
  action: Modify
  purpose: |-
    "### 2. Initialise": the one-line command block is replaced by APPROVED TEXT (verbatim, no variance):
    ```bash
    terraform -chdir=terraform/bootstrap init \
      -backend-config="region=$(tr -d '[:space:]' < config/aws-region)"
    ```

    The backend block names no region (rec-4067): init takes it from config/aws-region, the project's one region, and later plan and apply runs reuse it. A `.terraform` directory initialised before that change needs this init run once before its next plan or apply.
- file: terraform/github/CLAUDE.md
  action: Modify
  purpose: |-
    "Apply runbook" step 3: the comment line and the init command are replaced by APPROVED TEXT (verbatim inside the existing bash block, no variance):
    # 3. Initialise (S3 backend in agent-platform-data-lake; the region comes from config/aws-region, rec-4067).
    #    A .terraform directory initialised before rec-4067 needs this init once before its next plan or apply.
    terraform -chdir=terraform/github init \
      -backend-config="region=$(tr -d '[:space:]' < config/aws-region)"
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: 'tfvars_and_remote_state_recovery.state_location becomes APPROVED TEXT (verbatim, folded-scalar wrapping may vary):
    State: `s3://agent-platform-data-lake/tfstate/personal/sandbox/terraform.tfstate` (region from `config/aws-region`), wired
    via `terraform -chdir=terraform/personal init -backend-config=backend-sandbox.hcl -backend-config="region=$(tr -d ''[:space:]''
    < config/aws-region)"`. Also: config/aws-region joins referenced_repo_paths (sorted), and one amendment_log entry (prose_improvement,
    newest first) records the repoint with rec-4067.'
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Decision 202 gains one dated Update paragraph after its last existing Update paragraph (after any pointer the
    personal-release build added), separated by a bare `>` line, before the closing ---, wrapped like its neighbours. APPROVED
    LINE (verbatim; only DATE varies, the merge date, Decision 177 blockquote_update form): > **Update (DATE):** clause 4''s
    declared residuals are closed (rec-4067). config/aws-region holds the project region; workflow jobs read it through .github/actions/aws-region,
    which fails closed on an empty or invalid value and exports AWS_REGION and AWS_DEFAULT_REGION, and every sign-in takes
    aws-region from it. No backend block or backend file names a region: the S3 backend reads AWS_REGION, or a -backend-config
    region set at init from the file. validate_project_region fails any other AWS region id in .github/ YAML or terraform/
    HCL, and either aws_region default that differs from the file. Unenforced, outside clause 4: Python, config and runbook
    region defaults and the Neon region id (rec-4404). PLAN-project-region-single-source.'
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write after the Decision 202 edit (may be byte-identical).
bundled_recommendations:
- rec-4067
followon_recs:
- rec-4404
infrastructure_dependencies:
- 'No resource change: backend configuration only in terraform/bootstrap, terraform/github and terraform/personal; every plan
  is empty.'
- 'terraform/bootstrap (admin-only): read-only pre-merge ADMIN plan at the PR head (steps 7-10); nothing is applied by hand
  at any point.'
- 'terraform/personal: the PR''s speculative plan shows no changes and the push run applies no changes through CI at merge
  (Decision 77); it must not merge inside personal-release''s freeze window.'
- 'terraform/github: its PR-time read-only plan (terraform-github-plan.yml) runs on this PR; no hand apply is needed (no resource
  change).'
acceptance_criteria:
- config/aws-region is the only committed home of the project region outside the two aws_region variable defaults, which validate_project_region
  pins equal to it.
- No workflow or composite action under .github/ contains an AWS region id in any scalar or comment; every configure-aws-credentials
  step takes aws-region from the aws-region action's AWS_REGION or reconcile's resolve-target output; no env entry sets AWS_REGION
  or AWS_DEFAULT_REGION.
- The terraform/bootstrap and terraform/github backend blocks and terraform/personal/backend-sandbox.hcl name no region; CI
  inits read AWS_REGION from the sign-in and hand-run inits pass -backend-config region from config/aws-region.
- validate_project_region is registered in both tiers and fails each violation class on a red tree.
- reconcile.yml and terraform-apply-sandbox.yml stay within their structural size ceilings (536 and 550) with no raise.
- The approved Decision 202 Update line and the three runbook and contract texts land verbatim.
- The bootstrap plan at the PR head shows no changes with the region from config/aws-region only; the PR's CI and the merge's
  push and first scheduled runs are green.
- rec-4067 closes through its strengthened acceptance.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The guard's rules each fail on their red tree and pass on the real repository.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_project_region.py -q
  expected: Exit 0; every red case is detected, the Neon id and a comment-only mention stay green, and test_real_tree_passes
    passes with a non-zero examined count.
  fix_if: 'A red case passing means the rule is vacuous: fix the check, never the case. test_real_tree_passes failing names
    the file and job still holding a literal or an unwired sign-in.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file run of a test file this plan creates, inside every --pre affected set; the registered
    check validate_project_region is itself the standing guard in both tiers, so a registry row would duplicate it.
- step: 2
  phase: pre-deploy
  action: resolve.sh exports the region on a valid file and fails closed with its sentinels otherwise, under GitHub's literal
    composite argv.
  command: bin/venv-python -m pytest tests/test_aws_region_action.py -q
  expected: Exit 0; valid, missing, whitespace-only and invalid cases plus the action wiring nodes pass.
  fix_if: Any failure -> fix resolve.sh or action.yml; a passing missing-file case that wrote GITHUB_ENV means a failure path
    is not checked.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file run of a test file this plan creates; it runs in every --pre and full pass via the
    affected set, and Decision 162 R2 requires it to exist, so a registry row adds nothing.
- step: 3
  phase: pre-deploy
  action: 'The real tree holds the region in one file: the registered check passes, no workflow or action holds the literal
    anywhere (comments included, matching rec-4067''s own acceptance), and no backend sets a region.'
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_project_region.py::test_real_tree_passes -q && !
    grep -rqE "eu-west-2" .github/ && ! grep -qE "^[[:space:]]*region[[:space:]]*=" terraform/bootstrap/main.tf terraform/github/main.tf
    terraform/personal/backend-sandbox.hcl
  expected: Exit 0.
  fix_if: 'A grep hit names the leftover literal or backend line: remove it (a comment counts for the raw grep). A node failure:
    see step 1.'
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: Duplicates the registered check validate_project_region plus rec-4067's own acceptance, which
    the closure job runs at merge.
- step: 4
  phase: pre-deploy
  action: 'Fast tier green with the CI region environment the action now exports (pr-validate gains AWS_REGION beside AWS_DEFAULT_REGION):
    size ceilings, composite-action rules, account-id masking, OIDC fail-open, the liveness workflow test and scope all pass.'
  command: AWS_REGION=$(tr -d '[:space:]' < config/aws-region) AWS_DEFAULT_REGION=$(tr -d '[:space:]' < config/aws-region)
    bin/venv-python -m scripts.validate --pre
  expected: Exit 0. validate_structural_size_limits reports reconcile.yml at 536 and terraform-apply-sandbox.yml at 550 or
    below.
  fix_if: 'A size failure means a workflow grew past its shape in scope: rework to the scoped shape or STOP and escalate (decompose,
    never raise). Any other failure: fix the cause in scope; an out-of-scope fix goes back to the planning thread.'
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: The three edited HCL roots stay fmt-clean (provider-free; validate and plan are CI's terraform-validate and the
    plan jobs, Decision 119).
  command: terraform fmt -check terraform/bootstrap terraform/github terraform/personal
  expected: Exit 0, no file listed.
  fix_if: Run terraform fmt on the listed file and re-check.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: 'The approved texts landed verbatim (Decision 202: only the date varies; the three runbook and contract texts: no
    variance beyond YAML folding).'
  command: |-
    PYTHONPATH=. bin/venv-python - <<'EOF'
    import re, sys, yaml
    from pathlib import Path
    plan = yaml.safe_load(Path("docs/plans/PLAN-project-region-single-source.yaml").read_text())
    rows = {r["file"]: r["purpose"] for r in plan["scope"]}
    norm = lambda x: " ".join(x.split())
    line = re.sub(r"^>\s*", "", rows["docs/DECISIONS.md"].split("Decision 177 blockquote_update form): ", 1)[1].strip())
    pat = re.escape(norm(line)).replace(re.escape("(DATE)"), r"\(\d{4}-\d{2}-\d{2}\)")
    dec = Path("docs/DECISIONS.md").read_text()
    paras = [norm(" ".join(l[1:].strip() for l in p.splitlines())) for p in re.split(r"\n>\s*\n|\n\n", dec) if p.startswith("> **Update (")]
    d_ok = sum(1 for p in paras if re.fullmatch(pat, p)) == 1
    boot = rows["terraform/bootstrap/CLAUDE.md"].split("no variance):\n", 1)[1]
    gh = rows["terraform/github/CLAUDE.md"].split("no variance):\n", 1)[1]
    cc = rows["docs/contracts/terraform-cc-web-operations.yaml"].split("may vary): ", 1)[1].split(" Also: ", 1)[0]
    b_ok = norm(boot) in norm(Path("terraform/bootstrap/CLAUDE.md").read_text())
    g_ok = norm(gh) in norm(Path("terraform/github/CLAUDE.md").read_text())
    c = yaml.safe_load(Path("docs/contracts/terraform-cc-web-operations.yaml").read_text())
    c_ok = norm(cc) == norm(c["tfvars_and_remote_state_recovery"]["state_location"])
    print("decision", d_ok, "bootstrap", b_ok, "github", g_ok, "contract", c_ok)
    sys.exit(0 if d_ok and b_ok and g_ok and c_ok else 1)
    EOF
  expected: Exit 0 and "decision True bootstrap True github True contract True" printed.
  fix_if: 'A False names the text that drifted: restore it verbatim from the scope row. Never edit the approved text in the
    plan to match.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A one-time landing check of approved prose, not a standing invariant; Decision 177's append-only
    convention and code review guard later edits.
- step: 7
  phase: pre-deploy
  action: 'ENVIRONMENT CHECK (ADMIN): this session holds the admin chain, so it runs the pre-merge gate itself; ADMIN_CHAIN_ABSENT
    means the PR waits at CI-green and steps 8-10 go to an ADMIN session.'
  command: aws sts get-caller-identity --profile agent_platform_admin --query Arn --output text 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/'
    && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK (this project runs in the ADMIN environment).
  fix_if: 'ADMIN_CHAIN_ABSENT: hold the merge and hand steps 8-10 to an ADMIN session (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan).'
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: PRE-MERGE GATE (ADMIN, read-only) -- materialise terraform.bootstrap.tfvars without printing any value.
  command: aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile agent_platform_admin
    --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*='
    > terraform/bootstrap/terraform.bootstrap.tfvars && git check-ignore -q terraform/bootstrap/terraform.bootstrap.tfvars
    && test "$(grep -c -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id)[[:space:]]*='
    terraform/bootstrap/terraform.bootstrap.tfvars)" -eq 4 && echo "bootstrap tfvars materialised (values not printed)"
  expected: The four required keys are present, the file is gitignored, and no value reaches the terminal.
  fix_if: 'A missing key or an unignored file: STOP, delete the file, report (never print it).'
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: PRE-MERGE GATE (ADMIN, read-only) -- at the CI-green $PR_HEAD_SHA, with AWS_REGION and AWS_DEFAULT_REGION unset,
    a fresh init that names no region fails on the missing region (no hidden source left), an init given the region from config/aws-region
    succeeds, and the full bootstrap plan shows no changes.
  command: 'test -n "$PR_HEAD_SHA" && W="${TMPDIR:-/tmp}/region-gate-worktree" && git fetch origin "$PR_HEAD_SHA" && git worktree
    add --detach "$W" "$PR_HEAD_SHA" && cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" && R=$(tr
    -d ''[:space:]'' < "$W/config/aws-region") && { env -u AWS_REGION -u AWS_DEFAULT_REGION TF_DATA_DIR="$W/.probe-noregion"
    terraform -chdir="$W/terraform/bootstrap" init -input=false -no-color 2>&1 | grep -q ''Missing region value''; neg=$?;
    } && env -u AWS_REGION -u AWS_DEFAULT_REGION terraform -chdir="$W/terraform/bootstrap" init -input=false -no-color -backend-config="region=$R"
    > /dev/null && env -u AWS_REGION -u AWS_DEFAULT_REGION terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false
    -no-color -var-file=terraform.bootstrap.tfvars -detailed-exitcode > /dev/null; rc=$?; git worktree remove --force "$W";
    test "$neg" -eq 0 && test "$rc" -eq 0 && echo "PRE-MERGE PLAN OK: no region source but config/aws-region; bootstrap plan
    no changes at $PR_HEAD_SHA"'
  expected: The PRE-MERGE PLAN OK line naming the sha. Nothing is applied; -lock=false keeps the read off the state lock;
    plan output is discarded (it embeds ARNs). Post the line and $PR_HEAD_SHA on the PR (counts-only, Decision 101); a new
    head re-runs steps 8-10.
  fix_if: 'neg non-zero: some region source survived (an env var, the block, a profile) -- find it before merge. rc 2: the
    bootstrap root has pending changes unrelated to this PR; STOP and report them to the coordinator, never apply. rc 1: read
    the error (output was discarded; re-run init or plan by hand without -no-color in the worktree, never posting its text).'
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: CLEANUP (ADMIN) -- remove the tfvars and any leftover worktree; also run after any STOP.
  command: rm -f terraform/bootstrap/terraform.bootstrap.tfvars && git worktree prune && test ! -e "${TMPDIR:-/tmp}/region-gate-worktree"
    && test ! -e terraform/bootstrap/terraform.bootstrap.tfvars && echo "SCRATCH CLEARED"
  expected: SCRATCH CLEARED.
  fix_if: Remove the named path by hand and re-run.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: 'Live on the PR head: ci.yml (pr-validate, terraform-validate), terraform-github-plan (init with the region from
    the sign-in; report posted, no destroy or replace) and terraform-apply-sandbox''s speculative-plan and advisory-status
    jobs (plan shows no changes; guard PASS) are green, and each aws-region step logged REGION_OK.'
  command: 'echo ''VIA MCP: mcp__github__pull_request_read(method="get_check_runs", owner="benjamin-blake", repo="theseus",
    pullNumber=<this PR>) for the head sha; mcp__github__get_job_logs for the speculative-plan and terraform-github-plan jobs
    (grep REGION_OK and the plan summary); mcp__github__pull_request_read(method="get_comments") for the Terraform Speculative
    Plan and terraform/github plan report comments'''
  expected: All named checks success at $PR_HEAD_SHA; speculative plan comment says no changes; the terraform/github report
    shows no destroy or replace.
  fix_if: 'A REGION_MISSING / REGION_INVALID or Missing region value line names the unwired job: fix it in scope and push.
