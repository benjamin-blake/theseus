    - --profile agent_platform_admin | bin/venv-python -c "import json,os,sys; r=json.load(sys.stdin); ok=r.get(''status'')==''green''
    and r.get(''commit_sha'')==os.environ[''MERGE_SHA''] and not any(k in r for k in (''pending_gated'',''pending_codification'',''infra_error''));
    print(''convergence green at merge'', ok); sys.exit(0 if ok else 1)" && echo ''VIA MCP: mcp__github__actions_list(method="list_workflow_runs",
    resource_id="ci.yml" | "rec-autoclose.yml" | "terraform-apply-sandbox.yml", workflow_runs_filter={"event": "push"}) for
    head_sha $MERGE_SHA'''
  expected: convergence green at merge True; the three push runs concluded success.
