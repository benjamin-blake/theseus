- 'Decision 202 clause 4 and Decision 181 clause 2: no region literal survives in .github/ (raw text, comments included) or
  terraform/ HCL except the two pinned aws_region defaults; the rest is a declared residual owned by rec-4404.'
- 'Decision 154 clause 2: reconcile.yml''s RED_SHA jobs gain no local-action step; they take the region from resolve-target''s
  output.'
- 'Decisions 166 and 128: reconcile.yml <= 536 and terraform-apply-sandbox.yml <= 550 effective lines; decompose or rework,
  never raise. A sign-in wrapper action is barred by validate_actions_account_id_masking R4.'
- 'Decision 162: the aws-region action is an R1 thin adapter with an R2 literal-argv test; edited inline run bodies keep their
  step names and line counts (r3_workflows baseline unchanged).'
- 'Decision 83: no job is renamed (pr-validate and terraform-validate are required checks).'
- 'Decisions 77 and 126: no agent runs terraform apply; Terraform contact is read-only (the ADMIN plan, CI speculative plans)
  plus CI''s own no-change apply at merge.'
- 'Decision 101: all evidence counts-only; no account id, ARN or ExternalId in any output, comment or commit; plan text is
  discarded.'
- 'Approved texts land verbatim (variance: the Decision 202 date only; folded-scalar wrapping in the contract).'
- 'Every existing test keeps passing; only the liveness test''s mutation anchors move with the new text (Decision 181: no
  weakened assertion).'
- Every scope file stays under 500 SLOC (Decision 128). No rescue agents or workaround loops (Decision 55).
