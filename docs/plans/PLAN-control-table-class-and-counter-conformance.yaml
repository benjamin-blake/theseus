schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "control-table-class-and-counter-conformance"
intent: >-
  Separate the registry's read and write capability so governance registration stops granting
  exposure, then fix the unconditional counter advance and land a governed `control` table class
  so writer-internal control state is registered, partitioned, maintained and health-checked.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-control-table-class-and-counter-conformance.yaml
phase: T2.26
scope:
  - file: src/common/ducklake_table_capabilities.py
    action: Create
    purpose: >-
      PR1. Per-entry, per-direction capability resolution (read_boundary / write_boundary) over the
      ops_tables registry. Its own module so ducklake_scd2_schema.py (468/500) takes no accretion.
  - file: src/common/ducklake_scd2_schema.py
    action: Modify
    purpose: >-
      PR1 shim: ops_table_names gains a direction argument delegating to the capabilities module.
      PR2 shim: control-class spec resolution delegates to ducklake_control_tables. Shims only --
      _order_columns is never widened and ScdTableSpec keeps its SCD2 shape.
  - file: src/lambdas/ducklake_reader/handler.py
    action: Modify
    purpose: PR1. Its four _require_ops_table call sites pass direction=read, so a table with read_boundary none is refused.
  - file: src/common/ducklake_reads.py
    action: Modify
    purpose: >-
      PR1. named_read resolves its table through the capability gate so a future verb cannot bind a
      non-application table; its {tbl} substitution assumes a current projection a control table lacks.
  - file: scripts/data_quality_execute.py
    action: Modify
    purpose: PR1. Delete the hardcoded _OPS_TABLES frozenset (:19) in favour of the registry-derived read-capable list.
  - file: docs/contracts/ducklake_reader.yaml
    action: Modify
    purpose: PR1. Document the per-table read surface so describe publishes what each table admits.
  - file: src/common/ducklake_writes.py
    action: Modify
    purpose: PR2. Make _advance_entity_counter no-op-free so a key at or below current_value performs no catalog write.
  - file: src/common/ducklake_control_tables.py
    action: Create
    purpose: PR2. Control spec dataclass, column ordering and single-table DDL, WHOLLY contained here.
  - file: src/common/ducklake_tables.py
    action: Modify
    purpose: PR2. Control-class create path -- one table, partitioned before first write.
  - file: src/common/ducklake_runtime.py
    action: Modify
    purpose: PR1+PR2. Re-export the capability and control-class surfaces through the facade every Lambda uses.
  - file: src/lambdas/ducklake_writer/handler.py
    action: Modify
    purpose: >-
      PR1: its five _require_ops_table call sites pass direction=write. PR2: create_ops_tables
      provisions a control-class table and the write verbs refuse write_boundary writer_internal.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: PR2. control_health implementation -- assert per control table row count, counter floor and live-file ceiling.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: PR2. control_health action plus its metric emission.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: PR2. Explicit includes row for the two new modules (this manifest uses an explicit include list, so a new module is NOT auto-bundled).
  - file: src/lambdas/ducklake_writer/manifest.yaml
    action: Modify
    purpose: PR2. Explicit includes row for the two new modules.
  - file: src/lambdas/ducklake_reader/manifest.yaml
    action: Modify
    purpose: PR2. Explicit includes row for the two new modules.
  - file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
    action: Modify
    purpose: PR2. Explicit includes row for the two new modules.
  - file: src/lambdas/ducklake_catalog_dr/manifest.yaml
    action: Modify
    purpose: PR2. Explicit includes row for the two new modules.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      PR2. EXCLUDES row for both new modules. This artifact deliberately excludes DuckLake runtime
      code; its `includes: - src/` wildcard would otherwise auto-bundle them and widen its affected set.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: PR2. control_health schedule plus a ControlTableInvariantViolation alarm mirroring the breaker alarm.
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: PR1 capability fields; PR2 control-class projection with entity_id_prefix / id_keyspace optional.
  - file: scripts/checks/contracts/validate_table_registration.py
    action: Create
    purpose: >-
      PR3. Admission control -- resolve module-level constant references in CREATE TABLE statements
      under src/ and fail when the resolved name is absent from the registry.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: PR3. One Entry registering the new check (Decision 169 -- validate.py is never edited).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: PR3. function_to_category row for the new check module.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      PR2. Third write mode `control` with its invariants, the dq_scope/health-binding rule, the Q3
      divergence note, and the reversal conditions the contract-only routing would otherwise omit.
  - file: docs/contracts/ops_entity_counters.yaml
    action: Create
    purpose: PR2. Class A contract -- table_class control, read_boundary none, write_boundary writer_internal, dq_scope exempt with its health binding.
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: PR2. Register the table so every table-driven governance surface sees it.
  - file: docs/contracts/ducklake_writer.yaml
    action: Modify
    purpose: PR2. Correct the allocation wording and record that control-table reads occur inside the writer transaction or via the admin health verb.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: PR1 capability fields on every entry; PR2 the control entry with reconcile_scope exempt AND its exempt_reason companion.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated registry output (generated; drift-gated).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR3. Dated annotation on Decision 137 naming the counter_name per-table partition exception
      (amendment_forms shape). NO new numbered Decision.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: PR3. Re-ground T2.52 c1 and T2.26 c2, and add a T2.26 progress note recording this plan's contribution.
  - file: tests/common/test_ducklake_table_capabilities.py
    action: Create
    purpose: PR1. Direction-aware allow-list resolution, including that dormant and smoke entries are refused at the read boundary.
  - file: tests/lambdas/ducklake_reader/test_read_boundary_capability.py
    action: Create
    purpose: PR1. Reader refuses a table whose read_boundary is none, and named_read cannot bind one.
  - file: tests/common/test_ducklake_control_tables.py
    action: Create
    purpose: PR2. Control spec shape, DDL, partition and write-verb refusal.
  - file: tests/common/test_ducklake_writes.py
    action: Modify
    purpose: PR2. Red-before regression that a no-op advance performs no catalog write.
  - file: tests/test_ducklake_facade.py
    action: Modify
    purpose: PR1+PR2. Facade surface list after both splits.
  - file: tests/lambda_manifest/test_bundle_checks.py
    action: Modify
    purpose: >-
      PR2. Two-sided bundling invariant -- every artifact bundling ducklake_scd2_schema.py also bundles
      the new modules, AND every artifact excluding it also excludes them.
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: PR1 capability projection; PR2 control-class projection.
  - file: tests/common/test_ducklake_maintenance.py
    action: Modify
    purpose: PR2. control_health asserts the counter invariants and emits its metric.
  - file: tests/checks/contracts/test_validate_table_registration.py
    action: Create
    purpose: PR3. Admission-check discrimination, constant resolution, and a non-zero examined count over real src/.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    terraform/personal/ducklake_maintenance.tf gains an EventBridge rule/target/permission for
    control_health and a CloudWatch alarm, both in the guard's known-safe shape (principal
    events.amazonaws.com, agent-platform-* function, no IAM role or trust change), so the apply stays
    auto-apply (Decision 77). Verification is CI-delegated per Decision 119; never a local plan.
  - >-
    FIVE active artifacts bundle ducklake_scd2_schema.py via explicit include lists -- ducklake_writer,
    ducklake_reader, ducklake_maintenance, ducklake_maintenance_smoke, ducklake_catalog_dr. A new module
    is NOT auto-bundled there and must be added explicitly. data-pipeline is the inverse case: its
    `includes: - src/` wildcard WOULD auto-bundle it, and its excludes block deliberately keeps DuckLake
    runtime code out, so it needs an excludes row. Verified via compute_affected_artifacts.
  - >-
    data-pipeline deploys through deploy-prod-lambdas.yml, not deploy-ducklake-lambdas.yml. Its manifest
    edit adds no code to the artifact, so it needs no deploy verification beyond its own workflow.
  - >-
    The PR2 migration needs the writer quiesced via reserved concurrency on an existing function -- an
    operator action, not a new resource, so no gated apply is involved.
acceptance_criteria:
  - >-
    ops_table_names resolves per direction: a registry entry with read_boundary none is refused by every
    reader verb and by named_read, while remaining writable by the writer verbs that own it.
  - >-
    The dormant and smoke registry entries are no longer admitted to the application read boundary,
    closing an exposure that exists on main today.
  - >-
    scripts/data_quality_execute.py derives its table scope from the registry; the hardcoded _OPS_TABLES
    frozenset is gone.
  - >-
    A no-op counter advance performs no catalog write: the test named in test_obligations asserts it
    against the observation surface named in verification_plan step 5, and fails against current main.
  - >-
    docs/contracts/data-modeling-standard.yaml declares a third write mode `control` whose invariants
    include a hard row ceiling, partition-on-key, no-op-free writes, a mandatory maintenance_binding,
    and a dq_scope rule requiring either DQ checks or an explicit exemption naming a health binding.
  - >-
    ops_entity_counters resolves as a control-class table partitioned on counter_name with no
    history_table and no current_table, carries read_boundary none and write_boundary writer_internal,
    and is present in storage-substrate.yaml.
  - >-
    write_ops, file_ops and update_ops each loud-fail on a writer_internal table rather than falling
    through write_scd2 into the SCD2 branch against current_table=None.
  - >-
    Every artifact that bundles ducklake_scd2_schema.py also bundles both new modules, AND every
    artifact that excludes it also excludes them -- asserted as a two-sided invariant so the
    data-pipeline exclusion cannot silently rot.
  - >-
    control_health asserts, per control table, that the row count equals expected, that current_value is
    at or above the max allocated id, and that the live-file count is below its ceiling; it emits
    ControlTableInvariantViolation and a CloudWatch alarm fires on a non-zero value.
  - >-
    The admission check fails when a CREATE TABLE under src/ resolves to a table absent from the
    registry, resolves module-level constant references, and reports examined() over real src/ above zero.
  - >-
    No caller outside the control module reaches ensure_entity_counters_table; the counter table is
    created only by create_ops_tables, partitioned and registered.
  - >-
    Post-migration, clause8_checks.current_merge_key_unique on ops_recommendations reports PASSING.
  - >-
    No scope file crosses its SLOC budget; the capability and control logic land as new modules.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "PR1. Prove direction-aware capability resolution, including that dormant and smoke entries lose read admission."
    command: bin/venv-python -m pytest tests/common/test_ducklake_table_capabilities.py::test_read_direction_refuses_non_application_tables -q
    expected: Read direction admits only entries whose read_boundary is application; dormant and smoke entries are refused.
    fix_if: The list is still undifferentiated -- gate on the per-entry field, never on a name pattern or status string.
    graduation: graduate
    graduation_check_id: registry-read-direction-refuses-non-application
  - step: 2
    phase: pre-deploy
    action: "PR1. Prove the reader and named_read honour the gate."
    command: bin/venv-python -m pytest tests/lambdas/ducklake_reader/test_read_boundary_capability.py -q
    expected: Every reader verb refuses a read_boundary none table, and named_read cannot bind one.
    fix_if: A verb still resolves the table -- the call site did not pass direction=read.
    graduation: graduate
    graduation_check_id: reader-honours-read-boundary
  - step: 3
    phase: pre-deploy
    action: "PR1. Prove the divergent client list is gone."
    command: "! rg -n '_OPS_TABLES' scripts/data_quality_execute.py"
    expected: No match (exit 0 via negation) -- DQ scope derives from the registry.
    fix_if: The frozenset survives -- replace it with the registry-derived read-capable list.
    graduation: graduate
    graduation_check_id: dq-scope-registry-derived
  - step: 4
    phase: pre-deploy
    action: "PR1. Prove the capability fields project and the drift gate is clean."
    command: bin/venv-python -m pytest tests/test_schema_to_field_semantics.py::test_capability_fields_projected -q
    expected: Every ops_tables entry carries read_boundary and write_boundary after generation.
    fix_if: An entry lacks a field -- the generator must default it explicitly, never implicitly.
    graduation: graduate
    graduation_check_id: capability-fields-projected
  - step: 5
    phase: pre-deploy
    action: "PR2. Prove a no-op counter advance performs no catalog write."
    command: bin/venv-python -m pytest tests/common/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files -q
    expected: >-
      PASSES after the fix; FAILS against current main. OBSERVATION SURFACE -- implement as a Python-side
      read-then-conditional-write and assert on the recording connection fake's executed-SQL list (no
      UPDATE issued). A SQL-predicate form cannot be discriminated by a fake, because the UPDATE is still
      issued and only matches zero rows.
    fix_if: The assertion cannot distinguish a no-op from a write -- switch to the read-then-conditional surface.
    graduation: graduate
    graduation_check_id: entity-counter-advance-noop-free
  - step: 6
    phase: pre-deploy
    action: "PR2. Prove control-class resolution returns a single partitioned table and the write verbs refuse it."
    command: bin/venv-python -m pytest tests/common/test_ducklake_control_tables.py -q
    expected: Spec carries table + partition counter_name with history_table/current_table None; write_ops, file_ops and update_ops each raise.
    fix_if: A verb falls through to the SCD2 branch against current_table=None -- add the refusal before dispatch.
    graduation: graduate
    graduation_check_id: control-class-spec-and-write-refusal
  - step: 7
    phase: pre-deploy
    action: "PR2. Prove the control projection drops the SCD2 assumptions."
    command: bin/venv-python -m pytest tests/test_schema_to_field_semantics.py::test_control_class_projection -q
    expected: Projection emits a single table, partition on the key column, and no entity_id_prefix / id_keyspace.
    fix_if: KeyError on ops_config -- those keys are hard-indexed; make them optional for the control class.
    graduation: graduate
    graduation_check_id: control-class-registry-projection
  - step: 8
    phase: pre-deploy
    action: "PR2. Prove both decompositions preserved the runtime facade surface."
    command: bin/venv-python -m pytest "tests/test_ducklake_facade.py::test_ducklake_runtime_facade_reexports_symbol" -q
    expected: Every symbol the facade exported before the splits still resolves through src/common/ducklake_runtime.py.
    fix_if: A symbol disappeared -- re-export it from its new module rather than deleting it from the facade list.
    graduation: graduate
    graduation_check_id: ducklake-facade-reexports-every-symbol
  - step: 9
    phase: pre-deploy
    action: "PR2. Prove the two-sided bundling invariant -- included where the SCD2 schema is, excluded where it is not."
    command: bin/venv-python -m pytest tests/lambda_manifest/test_bundle_checks.py::test_new_ducklake_modules_track_scd2_schema_membership -q
    expected: >-
      The five artifacts bundling ducklake_scd2_schema.py also bundle both new modules; data-pipeline,
      which excludes it, also excludes them. This runs in --pre; --check-bundles does not (it is
      registered at full_after_lint via validate_lambda_bundle_completeness), which is why this
      assertion is needed rather than relying on the staged-import oracle to gate the PR.
    fix_if: An artifact is missing a row -- add it; if data-pipeline gained the module, add the exclude instead.
    graduation: graduate
    graduation_check_id: control-modules-track-scd2-membership
  - step: 10
    phase: pre-deploy
    action: "PR2. Staged-import closure across every active artifact (standing owner: validate_lambda_bundle_completeness)."
    command: bin/venv-python -m scripts.lambda_manifest --check-bundles
    expected: All active artifacts stage and their handlers import cleanly.
    fix_if: An artifact fails to import -- fix its manifest; never narrow the check.
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: "PR2. Prove control_health asserts the counter invariants."
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance.py -k control_health -q
    expected: Row count, counter floor and live-file ceiling each assert independently; a violation emits a non-zero metric.
    fix_if: A violation returns ok -- the verb reports rather than asserts; make each invariant a failing condition.
    graduation: graduate
    graduation_check_id: control-health-asserts-invariants
  - step: 12
    phase: pre-deploy
    action: "PR3. Prove the admission check discriminates on real code, not only a synthetic fixture."
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_table_registration.py -q
    expected: >-
      Fails on an unregistered table, passes when registered, resolves module-level constant references
      (every CREATE TABLE under src/ interpolates a variable or constant -- none is a bare literal), and
      reports examined() over the real src/ tree above zero.
    fix_if: examined() is zero -- the check resolves literals only and is Decision 170 vacuous.
    graduation: graduate
    graduation_check_id: create-table-must-be-registered
  - step: 13
    phase: pre-deploy
    action: "PR3. Prove no caller outside the control module reaches the ungoverned creation helper."
    command: test -z "$(rg -l 'ensure_entity_counters_table\(' src/ scripts/ --glob '!*control_tables*' || true)"
    expected: Empty result. The `test -z` form is used so an rg error exit cannot false-pass the sweep.
    fix_if: A caller survives -- route it through create_ops_tables; never leave a conditional fallback.
    graduation: graduate
    graduation_check_id: ungoverned-counter-creation-retired
  - step: 14
    phase: pre-deploy
    action: "PR3. Prove the Decision 137 annotation is present and 137's baseline body is intact."
    command: rg -n 'counter_name' docs/DECISIONS.md | rg -q 'Amendment|Update' && rg -c '^## Decision 137' docs/DECISIONS.md
    expected: >-
      A dated amendment trailer naming the counter_name exception exists under Decision 137, and the
      entry still has exactly one header. amendment_forms enforcement is convention-only (no validator
      since Decision 178 retired validate_live_entry_immutability), so this grep IS the evidence.
    fix_if: No trailer -- add it in a sanctioned amendment_forms shape; never rewrite 137's body in place.
    graduation: graduate
    graduation_check_id: decision-137-amendment-trailer-present
  - step: 15
    phase: pre-deploy
    action: Fast presubmit, including SLOC budgets.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, including validate_sloc_limits and validate_sloc_budget_raises.
    fix_if: A file is over budget -- decompose further; never register a raise for this plan.
    graduation: not-applicable
  - step: 16
    phase: pre-deploy
    action: Full presubmit before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green.
    graduation: not-applicable
  - step: 17
    phase: post-deploy
    action: Confirm the governed CD channel deployed the five DuckLake artifacts.
    command: mcp__github__actions_list(owner="benjamin-blake", repo="theseus", workflow_id="deploy-ducklake-lambdas.yml", perPage=1)
    expected: >-
      Latest run green on the merge commit, with the writer, reader, maintenance, maintenance-smoke and
      catalog-dr jobs succeeded. data-pipeline is NOT in this workflow -- its manifest edit adds no code,
      so it needs no deploy verification here.
    fix_if: Red -- read the job log via mcp__github__get_job_logs and fix forward; never re-run hoping for green.
  - step: 18
    phase: post-deploy
    action: OPERATOR -- quiesce the writer, then provision the control table.
    command: aws lambda put-function-concurrency --function-name agent-platform-ducklake-writer --reserved-concurrent-executions 0 --profile agent_platform_admin --region eu-west-2 && aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_entity_counters","force_recreate_tables":true,"confirm_force_recreate":"ops_entity_counters"}' /tmp/control.json && cat /tmp/control.json
    expected: >-
      Reserved concurrency 0 is in force BEFORE the invoke -- this is the enforcement behind "quiesced".
      The table is recreated partitioned on counter_name. counter_seed is null here by design: the control
      class has no entity_id_prefix, so the keyspace reseed is step 19.
    fix_if: Reserved concurrency did not apply -- STOP; a concurrent allocation during the drop window is the 2026-06-11 duplicate-id failure mode.
  - step: 19
    phase: post-deploy
    action: OPERATOR -- reseed the rec keyspace counter, then restore writer concurrency.
    command: aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_recommendations"}' /tmp/reseed.json && cat /tmp/reseed.json && aws lambda delete-function-concurrency --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2
    expected: counter_seed equals the current max rec-NNNN in ops_recommendations_history; concurrency restored only after the seed is confirmed.
    fix_if: counter_seed is below the table max -- STOP and RCA; do not restore concurrency onto a stranded counter.
  - step: 20
    phase: post-deploy
    action: OPERATOR -- run control_health and confirm the invariants hold on live state.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"control_health","meta_schema":"ducklake_ops"}' /tmp/health.json && cat /tmp/health.json
    expected: >-
      One counter row, current_value at or above the max allocated id, live-file count below ceiling,
      ControlTableInvariantViolation emitted as 0. This is the periodic assertion that replaces DQ
      coverage for control tables, and it is what the contract's dq_scope exemption names.
    fix_if: A violation is reported -- STOP and RCA (Decision 55); do not restore traffic onto a corrupt counter.
  - step: 21
    phase: post-deploy
    action: Prove the duplicate-id failure mode is absent, and measure the amplification.
    command: bin/venv-python -m scripts.data_quality_runner --table ops_recommendations && aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"catalog_stats","meta_schema":"ducklake_ops"}' /tmp/stats.json && cat /tmp/stats.json
    expected: >-
      clause8_checks.current_merge_key_unique PASSES. ops_entity_counters live-file count stays FLAT
      across subsequent update_rec calls -- that flatness, not the absolute count, is this plan's
      evidence, because the pre-existing files await the sibling session's compaction cadence.
    fix_if: A uniqueness failure appears -- the reseed raced an allocation; STOP and RCA. If the count climbs per update_rec, the guard is not on the executed path.
test_obligations:
  - source: src/common/ducklake_table_capabilities.py
    behavior: Allow-list resolution is direction-aware; non-application tables are refused at the read boundary.
    verification_step: 1
    test_selector: tests/common/test_ducklake_table_capabilities.py::test_read_direction_refuses_non_application_tables
    red_green_expectation: Red before (module absent; ops_table_names is undifferentiated), green after.
  - source: src/lambdas/ducklake_reader/handler.py
    behavior: Every reader verb passes direction=read and refuses a read_boundary none table.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_reader/test_read_boundary_capability.py::test_reader_refuses_read_boundary_none
    red_green_expectation: Red before (the reader admits every registry key, dormant and smoke included), green after.
  - source: src/common/ducklake_reads.py
    behavior: named_read cannot bind a table that is not read-capable.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_reader/test_read_boundary_capability.py::test_named_read_cannot_bind_non_application_table
    red_green_expectation: Red before, green after.
  - source: scripts/data_quality_execute.py
    behavior: DQ table scope derives from the registry rather than a hardcoded frozenset.
    verification_step: 3
    command: "! rg -n '_OPS_TABLES' scripts/data_quality_execute.py"
    red_green_expectation: Red before (the frozenset is present at :19), green after.
  - source: src/common/ducklake_writes.py
    behavior: A counter advance at or below current_value performs no catalog write.
    verification_step: 5
    test_selector: tests/common/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files
