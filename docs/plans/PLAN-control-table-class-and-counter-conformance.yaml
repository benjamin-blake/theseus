schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "control-table-class-and-counter-conformance"
intent: >-
  Close the writer-internal control-state gap: fix the unconditional counter advance that turns the
  rec-id allocator into a global write lock, then add a governed `control` table class so the next
  control table cannot be created unregistered, unpartitioned and invisible to maintenance.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-control-table-class-and-counter-conformance.yaml
phase: T2.26
scope:
  - file: src/common/ducklake_writes.py
    action: Modify
    purpose: Make _advance_entity_counter no-op-free (conditional predicate), removing the write amplification and the cross-writer OCC contention.
  - file: src/common/ducklake_control_tables.py
    action: Create
    purpose: Control-class spec resolution + single-table DDL, as a decomposition target so ducklake_scd2_schema.py stays under its 500 SLOC default.
  - file: src/common/ducklake_scd2_schema.py
    action: Modify
    purpose: Delegate control-class resolution to the new submodule; keep the existing public facade surface intact.
  - file: src/common/ducklake_tables.py
    action: Modify
    purpose: Control-class create path -- one table, partitioned before first write.
  - file: src/lambdas/ducklake_writer/handler.py
    action: Modify
    purpose: create_ops_tables provisions a control-class table; retire the ad-hoc CREATE TABLE from the write path.
  - file: src/lambdas/ducklake_writer/manifest.yaml
    action: Modify
    purpose: Bundle the new control-tables module into the deployed zip.
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: Control-class projection branch; entity_id_prefix / id_keyspace become optional for that class.
  - file: scripts/checks/contracts/validate_table_registration.py
    action: Create
    purpose: Admission control -- fail CI when a CREATE TABLE literal under src/ names a table absent from the registry.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: One Entry registering the new check (Decision 169 -- validate.py is never edited).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check module, required of every new registered check.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: Third sanctioned write mode `control` with its governing invariants.
  - file: docs/contracts/ops_entity_counters.yaml
    action: Create
    purpose: Class A ritual contract for the counter table, carrying table_class control.
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: Register the table so it is visible to every table-driven governance surface.
  - file: docs/contracts/ducklake_writer.yaml
    action: Modify
    purpose: Correct the allocation wording and record that control-table reads occur inside the writer transaction.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: contract_table_ops entry for the control table.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated registry output (generated file; drift-gated).
  - file: config/agent/data_quality/ops.yaml
    action: Modify
    purpose: Register DQ checks for the control table (row count == 1 per keyspace, current_value monotonic non-decreasing) so its correctness is asserted through the same instrument as every other table.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Dated annotation on Decision 137 naming the counter_name per-table partition exception (amendment_forms shape). NO new numbered Decision -- the control class routes to its owning contract.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Re-ground T2.52 c1 wording, which presumes the write-mode set is scd2/append_only.
  - file: tests/common/test_ducklake_control_tables.py
    action: Create
    purpose: Control-class spec resolution, DDL shape and partition assertions.
  - file: tests/test_ducklake_writes.py
    action: Modify
    purpose: Red-before regression that a no-op advance writes no files and raises no OCC conflict.
  - file: tests/checks/contracts/test_validate_table_registration.py
    action: Create
    purpose: Admission-check discrimination plus the Decision 170 examined/skipped declaration.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    _advance_entity_counter issues no catalog write when the supplied key is at or below the counter:
    a test asserts the tracked file count is unchanged across an update_ops whose key is not above current_value.
  - >-
    docs/contracts/data-modeling-standard.yaml declares a third write mode `control` whose invariants
    include a hard row ceiling, partition-on-key, no-op-free writes and a mandatory maintenance_binding.
  - >-
    ops_entity_counters resolves from the registry as a control-class table partitioned on counter_name,
    with no history_table and no current_table, and is present in storage-substrate.yaml.
  - >-
    A registered check fails when a CREATE TABLE literal under src/ names a table absent from the registry,
    and declares examined/skipped counts per Decision 170.
  - >-
    Decision 137 carries a dated appended annotation naming the counter_name partition as an explicit
    per-table exception, in a sanctioned amendment_forms shape, with no new numbered Decision minted
    and no in-place edit of 137's body.
  - >-
    config/agent/data_quality/ops.yaml declares checks for ops_entity_counters asserting exactly one row
    per keyspace and a non-decreasing current_value, and the DQ runner reports them PASSING against the live table.
  - >-
    No scope file crosses its SLOC budget; the control-class logic lands as a new module, not as accretion.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the no-op advance writes nothing.
    command: bin/venv-python -m pytest tests/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files -q
    expected: PASSES after the fix; FAILS against current main, where GREATEST matches the row unconditionally.
    fix_if: Files still appear -- the UPDATE lacks its current_value < ? guard.
    graduation: graduate
    graduation_check_id: entity-counter-advance-noop-free
  - step: 2
    phase: pre-deploy
    action: Prove no unguarded GREATEST advance survives.
    command: "! rg -n 'GREATEST\\(current_value' src/common/ducklake_writes.py | rg -v 'current_value <'"
    expected: No match (exit 0 via negation).
    fix_if: An unguarded form survives -- add the predicate; never widen the test.
    graduation: graduate
    graduation_check_id: counter-advance-guard-present
  - step: 3
    phase: pre-deploy
    action: Prove the control-class shape, its projection, and that the decomposition kept the facade and bundle intact.
    command: bin/venv-python -m pytest tests/common/test_ducklake_control_tables.py tests/test_schema_to_field_semantics.py tests/test_ducklake_facade.py tests/test_ducklake_artifacts.py -q
    expected: Spec carries table + partition counter_name with history_table/current_table None; the control projection emits no entity_id_prefix; the facade surface is unchanged; the new module is bundled.
    fix_if: The resolver still demands history_table -- branch on table_class before the SCD2 path.
    graduation: graduate
    graduation_check_id: control-class-spec-shape
  - step: 4
    phase: pre-deploy
    action: Prove the admission check discriminates and declares its counts.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_table_registration.py -q
    expected: Fails on an unregistered CREATE TABLE fixture, passes when registered, and declares examined/skipped.
    fix_if: It passes with an unregistered table -- assert over CREATE TABLE literals, not over the registry.
    graduation: graduate
    graduation_check_id: create-table-must-be-registered
  - step: 5
    phase: pre-deploy
    action: Prove the registry projects the control table correctly and the drift gate is clean.
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0; regenerated output carries ops_entity_counters with partition counter_name and no entity_id_prefix.
    fix_if: Drift reported -- regenerate; never hand-edit the generated file.
    graduation: graduate
    graduation_check_id: control-table-registry-projection
  - step: 6
    phase: pre-deploy
    action: Prove no file crossed its SLOC budget.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, including validate_sloc_limits and validate_sloc_budget_raises.
    fix_if: A file is over budget -- decompose further; never register a raise for this plan.
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full presubmit before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green.
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Confirm the governed CD channel deployed the writer.
    command: bin/venv-python -m scripts.ci_status --workflow deploy-ducklake-lambdas.yml --latest
    expected: Writer deploy and smoke jobs green on the merge commit.
    fix_if: Red -- read the job log and fix forward; never re-run hoping for green.
  - step: 9
    phase: post-deploy
    action: OPERATOR, with file_rec traffic quiesced -- provision the control table and reseed the counter.
    command: aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_entity_counters"}' /tmp/counters.json && cat /tmp/counters.json
    expected: counter_seed equals the current max rec-NNNN; the table is partitioned on counter_name.
    fix_if: counter_seed is below the table max -- STOP; a concurrent allocation raced the reseed.
  - step: 10
    phase: post-deploy
    action: Measure the amplification is gone.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"maintenance_report","meta_schema":"ducklake_ops"}' /tmp/report.json && cat /tmp/report.json
    expected: ops_entity_counters live-file count is orders of magnitude below the 3,418 baseline and stable across subsequent update_rec calls.
    fix_if: The count still climbs per update_rec -- the guard is not on the executed path.
  - step: 11
    phase: post-deploy
    action: Prove the control table's DQ checks are defined and passing against the live table.
    command: bin/venv-python -m scripts.data_quality_runner --table ops_entity_counters
    expected: Both checks reported and PASSING -- one row for the ops_recommendations keyspace, current_value non-decreasing.
    fix_if: Checks report as undefined -- they were not registered in ops.yaml; a FAIL on row count means the duplicate-row state recurred, so STOP and RCA.
