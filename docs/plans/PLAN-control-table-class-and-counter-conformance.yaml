constraints:
- No rescue agents or workaround loops (Decision 55).
- NEVER weaken an assertion or raise a budget to obtain green (Decision 55 / Decision 181 / Decision 128).
- 'Decision 84 I-2 is PRESERVED: allocation stays writer-owned and inside the DuckLake write transaction. This
  plan changes the counter table''s SHAPE, GOVERNANCE and EXPOSURE, never its substrate.'
- 'Decision 177/178: Decision 137 takes a dated appended annotation, never an in-place body rewrite. Enforcement
  is convention-only -- validate_live_entry_immutability was retired -- so VP step 14 is the evidence, not a validator.'
- 'Decision 169: a new check is a registered module plus one _manifest.py Entry. scripts/validate.py is not edited.'
- NO new numbered Decision. decision-entry.yaml's routing_rule needs all three questions to answer yes; question
  3 fails because the field_semantics row ('constraints of a data field or config key -> the owning contract;
  never a numbered Decision') already owns the control-class invariants.
- ducklake_scd2_schema.py has 32 SLOC of headroom (468/500) and takes SHIMS ONLY. Capability resolution lives
  in ducklake_table_capabilities.py and control-class logic in ducklake_control_tables.py; _order_columns and
  ScdTableSpec are never widened.
- 'FIVE artifacts bundle ducklake_scd2_schema.py via EXPLICIT include lists, so a new module is not auto-bundled
  and must be added to each. data-pipeline is the INVERSE: its `includes: - src/` wildcard would auto-bundle it,
  and its excludes block deliberately keeps DuckLake runtime code out. Adding the module to data-pipeline''s includes
  would ship DuckLake code in that zip and widen its affected set -- exactly what its manifest comment forbids.'
- Control tables are never exposed through the APPLICATION read boundary. They remain readable by their owning
  writer in-transaction and by the admin maintenance health verb -- writer-owned, not writer-opaque. Do not widen
  query_ops or named_read to reach them.
- 'The migration runs under reserved-concurrency-0 on the writer. "Quiesced" is that mechanism, never a prose
  intention: a concurrent self-seed race minted duplicate rec ids on 2026-06-11.'
- 'Inlining stays globally disabled (Decision 107/CD.34). A per-table inlining exception was considered and rejected:
  it relocates cost into catalog egress and complicates GC policy.'
- Lambda code deploys ride the governed CD channel; never build_lambda --deploy (Decision 125/126).
