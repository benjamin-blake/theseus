rollback: >-
  The code changes revert with the commit. The counter table is derived state: create_ops_tables on
  ops_recommendations reseeds the keyspace counter from the history-table max, so a failed migration is
  recovered by restoring reserved-concurrency-0, re-running that verb, and confirming
  clause8_checks.current_merge_key_unique before restoring concurrency -- never by restoring data.
