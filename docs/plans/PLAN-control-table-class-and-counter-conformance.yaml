rollback: >-
  Code changes revert with their commit. The counter table is derived state: create_ops_tables on
  ops_recommendations reseeds the keyspace counter from the history-table max, so a failed migration is
  recovered by restoring reserved-concurrency-0, re-running that verb, and confirming control_health
  plus clause8_checks.current_merge_key_unique before restoring concurrency -- never by restoring data.
  PR1 is independently revertible: restoring the undifferentiated ops_table_names re-opens the
  pre-existing exposure but breaks nothing that depends on the new fields.
