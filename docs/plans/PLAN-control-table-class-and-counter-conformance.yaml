- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: PR3. One Entry registering the new check (Decision 169 -- validate.py is never edited).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: PR3. function_to_category row for the new check module.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
