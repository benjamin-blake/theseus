schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: control-table-class-and-counter-conformance
intent: Separate the registry's read and write capability so governance registration stops granting exposure,
  then fix the unconditional counter advance and land a governed `control` table class so writer-internal control
  state is registered, partitioned, maintained and health-checked.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-control-table-class-and-counter-conformance.yaml
phase: T2.26
scope:
- file: src/common/ducklake_scd2_schema.py
  action: Modify
  purpose: 'Shim only: control-class spec resolution delegates to ducklake_control_tables. _order_columns is never
    widened and ScdTableSpec keeps its SCD2 shape (468/500 SLOC, 32 headroom).'
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: Refuse a CONTROL-CLASS table at its three _require_ops_table call sites -- the symmetric partner of
    the writer-side refusal. Narrow and class-specific; the general per-direction capability field is rec-3771,
    deliberately NOT in this plan.
- file: src/common/ducklake_reads.py
  action: Modify
  purpose: 'named_read refuses a control-class table: its {tbl} substitution assumes a current projection a control
    table lacks, so a future verb must not be able to bind one.'
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: Record that control-class tables are not reachable through any reader verb.
- file: src/common/ducklake_writes.py
  action: Modify
  purpose: PR2. Make _advance_entity_counter no-op-free so a key at or below current_value performs no catalog
    write.
- file: src/common/ducklake_control_tables.py
  action: Create
  purpose: PR2. Control spec dataclass, column ordering and single-table DDL, WHOLLY contained here.
- file: src/common/ducklake_tables.py
  action: Modify
  purpose: PR2. Control-class create path -- one table, partitioned before first write.
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: PR1+PR2. Re-export the capability and control-class surfaces through the facade every Lambda uses.
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: 'PR1: its five _require_ops_table call sites pass direction=write. PR2: create_ops_tables provisions
    a control-class table and the write verbs refuse write_boundary writer_internal.'
- file: src/common/ducklake_maintenance.py
  action: Modify
  purpose: PR2. control_health implementation -- assert per control table row count, counter floor and live-file
    ceiling.
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: PR2. control_health action plus its metric emission.
- file: src/lambdas/ducklake_maintenance/manifest.yaml
  action: Modify
  purpose: PR2. Explicit includes row for the two new modules (this manifest uses an explicit include list, so
    a new module is NOT auto-bundled).
- file: src/lambdas/ducklake_writer/manifest.yaml
  action: Modify
  purpose: PR2. Explicit includes row for the two new modules.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: PR2. Explicit includes row for the two new modules.
- file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
  action: Modify
  purpose: PR2. Explicit includes row for the two new modules.
- file: src/lambdas/ducklake_catalog_dr/manifest.yaml
  action: Modify
  purpose: PR2. Explicit includes row for the two new modules.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: 'PR2. EXCLUDES row for both new modules. This artifact deliberately excludes DuckLake runtime code;
    its `includes: - src/` wildcard would otherwise auto-bundle them and widen its affected set.'
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: PR2. control_health schedule plus a ControlTableInvariantViolation alarm mirroring the breaker alarm.
- file: scripts/schema_to_field_semantics.py
  action: Modify
  purpose: Control-class projection with entity_id_prefix / id_keyspace optional.
- file: scripts/checks/ops_governance/validate_reconcile_pending_gate.py
  action: Modify
  purpose: Teach _write_mode and _check_diff_added_column_gap the control class. Today the leg globs docs/contracts/ops_*.yaml,
    defaults an unknown write mode to scd2, demands history+current sides and never consults reconcile_scope --
    so the new contract would fail --pre on arrival.
- file: tests/checks/ops_governance/test_validate_reconcile_pending_gate.py
  action: Modify
  purpose: Cover the control-class path through the diff-added-column gap leg.
- file: scripts/checks/contracts/validate_table_registration.py
  action: Create
  purpose: PR3. Admission control -- resolve module-level constant references in CREATE TABLE statements under
