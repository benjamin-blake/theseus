execution_steps:
  - >-
    Fix src/common/ducklake_writes.py: give _advance_entity_counter a conditional predicate so a key at
    or below current_value performs no catalog write. Keep it inside the caller's transaction.
  - >-
    Create src/common/ducklake_control_tables.py carrying control-class spec resolution and single-table
    DDL; have ducklake_scd2_schema.py and ducklake_tables.py delegate to it, preserving the facade surface.
  - >-
    Teach scripts/schema_to_field_semantics.py the control projection: single table, partition on the key
    column, entity_id_prefix/id_keyspace optional.
  - >-
    Author docs/contracts/ops_entity_counters.yaml (Class A, table_class control) and its
    contract_table_ops sidecar entry; register in storage-substrate.yaml; regenerate field_semantics.yaml.
  - >-
    Add the `control` write mode and its invariants to docs/contracts/data-modeling-standard.yaml.
  - >-
    Add scripts/checks/contracts/validate_table_registration.py plus its _manifest.py Entry, declaring
    examined/skipped counts.
  - >-
    Move counter-table creation onto the governed create_ops_tables path and retire the ad-hoc
    CREATE TABLE IF NOT EXISTS from the write path.
  - >-
    Append the dated annotation to Decision 137 naming the counter_name per-table partition exception
    (amendment_forms trailing_bracket or blockquote_update shape, Decision 177 append-only). Mint NO new
    numbered Decision: the control class's invariants are constraints on the write_modes key, which
    decision-entry.yaml's field_semantics routing row assigns to the owning contract.
  - Re-ground T2.52 c1 wording in docs/ROADMAP-PLATFORM.yaml.
  - Write the tests named in test_obligations, each failing against current main before the fix.
  - Execute the Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, and which acceptance criteria are evidenced.'
work_areas: []
rollback: >-
  The code changes revert with the commit. The counter table is derived state: bootstrap_entity_counter
  reseeds it from the recommendations-table max, so a failed migration is recovered by re-running the
  provisioning verb with traffic quiesced rather than by restoring data.
