- file: config/lambda/ducklake/field_semantics.yaml
  action: Modify
  purpose: Regenerated registry output (generated; drift-gated).
- file: docs/DECISIONS.md
  action: Modify
  purpose: PR3. Dated annotation on Decision 137 naming the counter_name per-table partition exception (amendment_forms
    shape). NO new numbered Decision.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Add T2.26:c10 (governed control-table class; ops_entity_counters conforms) as the criterion this plan
    closes, and re-ground T2.52 c1 plus T2.26 c2.
- file: tests/lambdas/ducklake_reader/__init__.py
  action: Create
  purpose: Test package marker -- every sibling test package carries one.
- file: tests/lambdas/ducklake_reader/test_control_table_refusal.py
  action: Create
  purpose: Reader verbs and named_read both refuse a control-class table.
- file: tests/common/test_ducklake_control_tables.py
  action: Create
  purpose: PR2. Control spec shape, DDL, partition and write-verb refusal.
- file: tests/common/test_ducklake_writes.py
  action: Modify
  purpose: PR2. Red-before regression that a no-op advance performs no catalog write.
- file: tests/test_ducklake_facade.py
  action: Modify
  purpose: PR1+PR2. Facade surface list after both splits.
- file: tests/lambda_manifest/test_bundle_checks.py
  action: Modify
  purpose: PR2. Two-sided bundling invariant -- every artifact bundling ducklake_scd2_schema.py also bundles the
    new modules, AND every artifact excluding it also excludes them.
- file: tests/test_schema_to_field_semantics.py
  action: Modify
  purpose: PR1 capability projection; PR2 control-class projection.
- file: tests/test_ducklake_maintenance.py
  action: Modify
  purpose: PR2. control_health asserts the counter invariants and emits its metric.
- file: tests/checks/contracts/test_validate_table_registration.py
  action: Create
  purpose: PR3. Admission-check discrimination, constant resolution, and a non-zero examined count over real src/.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- terraform/personal/ducklake_maintenance.tf gains an EventBridge rule/target/permission for control_health and
  a CloudWatch alarm, both in the guard's known-safe shape (principal events.amazonaws.com, agent-platform-* function,
  no IAM role or trust change), so the apply stays auto-apply (Decision 77). Verification is CI-delegated per
  Decision 119; never a local plan.
- 'FIVE active artifacts bundle ducklake_scd2_schema.py via explicit include lists -- ducklake_writer, ducklake_reader,
  ducklake_maintenance, ducklake_maintenance_smoke, ducklake_catalog_dr. A new module is NOT auto-bundled there
  and must be added explicitly. data-pipeline is the inverse case: its `includes: - src/` wildcard WOULD auto-bundle
  it, and its excludes block deliberately keeps DuckLake runtime code out, so it needs an excludes row. Verified
  via compute_affected_artifacts.'
- data-pipeline deploys through deploy-prod-lambdas.yml, not deploy-ducklake-lambdas.yml. Its manifest edit adds
  no code to the artifact, so it needs no deploy verification beyond its own workflow.
- The PR2 migration needs the writer quiesced via reserved concurrency on an existing function -- an operator
  action, not a new resource, so no gated apply is involved.
acceptance_criteria:
- 'Both boundaries refuse a control-class table symmetrically: write_ops / file_ops / update_ops loud-fail on
  it, and every reader verb plus named_read refuse it -- so registering for governance does not grant application
  read access.'
- 'A no-op counter advance performs no catalog write: the test named in test_obligations asserts it against the
  observation surface named in verification_plan step 5, and fails against current main.'
- docs/contracts/data-modeling-standard.yaml declares a third write mode `control` whose invariants include a
  hard row ceiling, partition-on-key, no-op-free writes, a mandatory maintenance_binding, and a dq_scope rule
  requiring either DQ checks or an explicit exemption naming a health binding.
- ops_entity_counters resolves as a control-class table partitioned on counter_name with no history_table and
  no current_table, carries read_boundary none and write_boundary writer_internal, and is present in storage-substrate.yaml.
- write_ops, file_ops and update_ops each loud-fail on a writer_internal table rather than falling through write_scd2
  into the SCD2 branch against current_table=None.
- Every artifact that bundles ducklake_scd2_schema.py also bundles both new modules, AND every artifact that excludes
  it also excludes them -- asserted as a two-sided invariant so the data-pipeline exclusion cannot silently rot.
- control_health asserts, per control table, that the row count equals expected, that current_value is at or above
  the max allocated id, and that the live-file count is below the ceiling declared as health.live_file_ceiling
  in docs/contracts/ops_entity_counters.yaml; it emits ControlTableInvariantViolation and a CloudWatch alarm fires
  on a non-zero value.
- The admission check fails when a CREATE TABLE under src/ resolves to a table absent from the registry, resolves
  module-level constant references, and reports examined() over real src/ above zero.
- No caller outside the control module reaches ensure_entity_counters_table; the counter table is created only
  by create_ops_tables, partitioned and registered.
- Post-migration, clause8_checks.current_merge_key_unique on ops_recommendations reports PASSING.
- No scope file crosses its SLOC budget; the capability and control logic land as new modules.
verification_plan:
- step: 1
  phase: pre-deploy
  action: PR2. Prove a no-op counter advance performs no catalog write.
  command: bin/venv-python -m pytest tests/common/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files
    -q
  expected: PASSES after the fix; FAILS against current main. OBSERVATION SURFACE -- implement as a Python-side
    read-then-conditional-write and assert on the recording connection fake's executed-SQL list (no UPDATE issued).
    A SQL-predicate form cannot be discriminated by a fake, because the UPDATE is still issued and only matches
    zero rows.
  fix_if: The assertion cannot distinguish a no-op from a write -- switch to the read-then-conditional surface.
  graduation: graduate
  graduation_check_id: entity-counter-advance-noop-free
- step: 2
  phase: pre-deploy
  action: PR2. Prove control-class resolution returns a single partitioned table and the write verbs refuse it.
  command: bin/venv-python -m pytest tests/common/test_ducklake_control_tables.py -q
  expected: Spec carries table + partition counter_name with history_table/current_table None; write_ops, file_ops
    and update_ops each raise.
  fix_if: A verb falls through to the SCD2 branch against current_table=None -- add the refusal before dispatch.
  graduation: graduate
  graduation_check_id: control-class-spec-and-write-refusal
- step: 3
  phase: pre-deploy
  action: Prove the reader and named_read both refuse a control-class table.
  command: bin/venv-python -m pytest tests/lambdas/ducklake_reader/test_control_table_refusal.py -q
  expected: Every reader verb refuses a control-class table and named_read cannot bind one -- the symmetric partner
    of the writer-side refusal.
  fix_if: A verb still resolves the table -- add the class check at the _require_ops_table call sites and in named_read
    table resolution.
  graduation: graduate
  graduation_check_id: reader-refuses-control-class-table
- step: 4
  phase: pre-deploy
  action: PR2. Prove the control projection drops the SCD2 assumptions.
  command: bin/venv-python -m pytest tests/test_schema_to_field_semantics.py::test_control_class_projection -q
  expected: Projection emits a single table, partition on the key column, and no entity_id_prefix / id_keyspace.
  fix_if: KeyError on ops_config -- those keys are hard-indexed; make them optional for the control class.
  graduation: graduate
  graduation_check_id: control-class-registry-projection
- step: 5
  phase: pre-deploy
  action: Prove the reconcile gate recognises the control class before --pre ever sees the new contract.
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_reconcile_pending_gate.py -q
  expected: A control-class contract needs no history/current reconcile sides. Today the leg globs docs/contracts/ops_*.yaml,
    defaults an unknown write mode to scd2 and never consults reconcile_scope, so the new contract would fail
    --pre on arrival.
  fix_if: The gate still demands both sides -- teach _write_mode the control class; never declare false pending_reconcile
    entries to appease it.
  graduation: graduate
  graduation_check_id: reconcile-gate-knows-control-class
- step: 6
  phase: pre-deploy
  action: PR2. Prove both decompositions preserved the runtime facade surface.
  command: bin/venv-python -m pytest "tests/test_ducklake_facade.py::test_ducklake_runtime_facade_reexports_symbol"
    -q
  expected: Every symbol the facade exported before the splits still resolves through src/common/ducklake_runtime.py.
  fix_if: A symbol disappeared -- re-export it from its new module rather than deleting it from the facade list.
  graduation: waive
  graduation_waiver_reason: 'The facade list and the runtime move together in one commit, so a reverted-tree differential
    cannot discriminate: make_worktree_revert_runner materialises origin/main list AND origin/main runtime, which
    pass. Graduating it would register a guard whose green is not evidence. Its regression value is carried by
    the always-running suite.'
- step: 7
  phase: pre-deploy
  action: PR2. Prove the two-sided bundling invariant -- included where the SCD2 schema is, excluded where it
    is not.
  command: bin/venv-python -m pytest tests/lambda_manifest/test_bundle_checks.py::test_new_ducklake_modules_track_scd2_schema_membership
    -q
  expected: The five artifacts bundling ducklake_scd2_schema.py also bundle both new modules; data-pipeline, which
    excludes it, also excludes them. This runs in --pre; --check-bundles does not (it is registered at full_after_lint
    via validate_lambda_bundle_completeness), which is why this assertion is needed rather than relying on the
    staged-import oracle to gate the PR.
  fix_if: An artifact is missing a row -- add it; if data-pipeline gained the module, add the exclude instead.
  graduation: graduate
  graduation_check_id: control-modules-track-scd2-membership
- step: 8
  phase: pre-deploy
  action: 'PR2. Staged-import closure across every active artifact (standing owner: validate_lambda_bundle_completeness).'
  command: bin/venv-python -m scripts.lambda_manifest --check-bundles
  expected: All active artifacts stage and their handlers import cleanly.
  fix_if: An artifact fails to import -- fix its manifest; never narrow the check.
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: PR2. Prove control_health asserts the counter invariants.
  command: bin/venv-python -m pytest tests/test_ducklake_maintenance.py::test_control_health_asserts_counter_invariants
    tests/test_ducklake_maintenance.py::test_control_health_action_dispatches -q
  expected: Row count, counter floor and live-file ceiling each assert independently; a violation emits ControlTableInvariantViolation=1
    to the DuckLakeMaintenance namespace.
  fix_if: A violation returns ok -- the verb reports rather than asserts; make each invariant a failing condition.
  graduation: graduate
  graduation_check_id: control-health-asserts-invariants
- step: 10
  phase: pre-deploy
  action: PR3. Prove the admission check discriminates on real code, not only a synthetic fixture.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_table_registration.py -q
  expected: Fails on an unregistered table, passes when registered, resolves module-level constant references
    (every CREATE TABLE under src/ interpolates a variable or constant -- none is a bare literal), and reports
    examined() over the real src/ tree above zero.
  fix_if: examined() is zero -- the check resolves literals only and is Decision 170 vacuous.
  graduation: graduate
  graduation_check_id: create-table-must-be-registered
- step: 11
  phase: pre-deploy
  action: PR3. Prove no caller outside the control module reaches the ungoverned creation helper.
  command: test -z "$(rg -l 'ensure_entity_counters_table\(' src/ scripts/ --glob '!*control_tables*' || true)"
  expected: Empty result. The `test -z` form is used so an rg error exit cannot false-pass the sweep.
  fix_if: A caller survives -- route it through create_ops_tables; never leave a conditional fallback.
  graduation: graduate
  graduation_check_id: ungoverned-counter-creation-retired
- step: 12
  phase: pre-deploy
  action: PR3. Prove the Decision 137 annotation is present and 137's baseline body is intact.
  command: rg -n 'counter_name' docs/DECISIONS.md | rg -q 'Amendment|Update' && rg -c '^## Decision 137' docs/DECISIONS.md
  expected: A dated amendment trailer naming the counter_name exception exists under Decision 137, and the entry
    still has exactly one header. amendment_forms enforcement is convention-only (no validator since Decision
    178 retired validate_live_entry_immutability), so this grep IS the evidence.
  fix_if: No trailer -- add it in a sanctioned amendment_forms shape; never rewrite 137's body in place.
  graduation: graduate
  graduation_check_id: decision-137-amendment-trailer-present
- step: 13
  phase: pre-deploy
  action: Fast presubmit, including SLOC budgets.
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0, including validate_sloc_limits and validate_sloc_budget_raises.
  fix_if: A file is over budget -- decompose further; never register a raise for this plan.
  graduation: not-applicable
- step: 14
  phase: pre-deploy
  action: Full presubmit before handoff.
  command: bin/venv-python -m scripts.validate
  expected: exit 0
  fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green.
  graduation: not-applicable
- step: 15
  phase: post-deploy
  action: Confirm the governed CD channel deployed the five DuckLake artifacts.
  command: mcp__github__actions_list(owner="benjamin-blake", repo="theseus", workflow_id="deploy-ducklake-lambdas.yml",
    perPage=1)
  expected: Latest run green on the merge commit across the workflow real jobs -- deploy-maintenance, maintenance-smoke,
    reconcile-gate, deploy-serving and smoke (maintenance+smoke ship in one job; writer/reader/catalog-dr in another).
    Note reconcile-gate re-runs validate_reconcile_pending_gate at deploy time, so the control-class teaching
    must be in.
  fix_if: Red -- read the job log via mcp__github__get_job_logs and fix forward; never re-run hoping for green.
- step: 16
  phase: post-deploy
  action: OPERATOR -- quiesce the writer, then provision the control table.
  command: aws lambda put-function-concurrency --function-name agent-platform-ducklake-writer --reserved-concurrent-executions
    0 --profile agent_platform_admin --region eu-west-2 && aws lambda invoke --function-name agent-platform-ducklake-writer
    --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_entity_counters","force_recreate_tables":true,"confirm_force_recreate":"ops_entity_counters"}'
    /tmp/control.json && cat /tmp/control.json
  expected: 'Reserved concurrency 0 is in force BEFORE the invoke -- this is the enforcement behind "quiesced".
    The table is recreated partitioned on counter_name. counter_seed is null here by design: the control class
    has no entity_id_prefix, so the keyspace reseed is step 19.'
  fix_if: Reserved concurrency did not apply -- STOP; a concurrent allocation during the drop window is the 2026-06-11
    duplicate-id failure mode.
- step: 17
  phase: post-deploy
  action: OPERATOR -- reseed the rec keyspace counter, then restore writer concurrency.
  command: aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region
    eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_recommendations"}'
    /tmp/reseed.json && cat /tmp/reseed.json && aws lambda delete-function-concurrency --function-name agent-platform-ducklake-writer
    --profile agent_platform_admin --region eu-west-2
  expected: counter_seed equals the current max rec-NNNN in ops_recommendations_history; concurrency restored
    only after the seed is confirmed.
  fix_if: counter_seed is below the table max -- STOP and RCA; do not restore concurrency onto a stranded counter.
- step: 18
  phase: post-deploy
  action: OPERATOR -- run control_health and confirm the invariants hold on live state.
  command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin
    --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"control_health","meta_schema":"ducklake_ops"}'
    /tmp/health.json && cat /tmp/health.json
  expected: One counter row, current_value at or above the max allocated id, live-file count below ceiling, ControlTableInvariantViolation
    emitted as 0. This is the periodic assertion that replaces DQ coverage for control tables, and it is what
    the contract's dq_scope exemption names.
  fix_if: A violation is reported -- STOP and RCA (Decision 55); do not restore traffic onto a corrupt counter.
- step: 19
  phase: post-deploy
  action: Prove the duplicate-id failure mode is absent, and measure the amplification.
  command: bin/venv-python -m scripts.data_quality_runner --table ops_recommendations && aws lambda invoke --function-name
    agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format
    raw-in-base64-out --payload '{"action":"catalog_stats","meta_schema":"ducklake_ops"}' /tmp/stats.json && cat
    /tmp/stats.json
  expected: clause8_checks.current_merge_key_unique PASSES. ops_entity_counters live-file count stays FLAT across
    subsequent update_rec calls -- that flatness, not the absolute count, is this plan's evidence, because the
    pre-existing files await the sibling session's compaction cadence.
  fix_if: A uniqueness failure appears -- the reseed raced an allocation; STOP and RCA. If the count climbs per
    update_rec, the guard is not on the executed path.
test_obligations:
- source: src/lambdas/ducklake_reader/handler.py
  behavior: Every reader verb refuses a control-class table.
  verification_step: 3
  test_selector: tests/lambdas/ducklake_reader/test_control_table_refusal.py::test_reader_refuses_control_table
  red_green_expectation: Red before (no class check exists at the reader call sites), green after.
- source: src/common/ducklake_reads.py
  behavior: named_read cannot bind a control-class table.
  verification_step: 3
  test_selector: tests/lambdas/ducklake_reader/test_control_table_refusal.py::test_named_read_cannot_bind_control_table
  red_green_expectation: Red before, green after.
- source: src/common/ducklake_writes.py
  behavior: A counter advance at or below current_value performs no catalog write.
  verification_step: 1
  test_selector: tests/common/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files
  red_green_expectation: Red before (GREATEST matches the row unconditionally), green after.
- source: src/common/ducklake_control_tables.py
  behavior: Control specs resolve to a single partitioned table with no history/current pair.
  verification_step: 2
  test_selector: tests/common/test_ducklake_control_tables.py::test_control_spec_has_no_history_pair
  red_green_expectation: Red before (module absent), green after.
- source: src/common/ducklake_tables.py
  behavior: Control-class creation issues one CREATE plus one SET PARTITIONED BY.
  verification_step: 2
  test_selector: tests/common/test_ducklake_control_tables.py::test_control_ddl_single_table
  red_green_expectation: Red before, green after.
- source: src/lambdas/ducklake_writer/handler.py
  behavior: The write verbs refuse a writer_internal table instead of falling through to the SCD2 branch.
  verification_step: 2
  test_selector: tests/common/test_ducklake_control_tables.py::test_write_verb_refusal_on_control_table
  red_green_expectation: Red before (no refusal exists; write_scd2 would run against current_table=None), green
    after.
- source: src/common/ducklake_scd2_schema.py
  behavior: Both shims delegate without widening _order_columns or the SCD2 spec shape.
  verification_step: 2
  test_selector: tests/common/test_ducklake_control_tables.py::test_scd2_schema_delegates_without_widening
  red_green_expectation: Red before (resolve_table_spec hard-requires history_table), green after.
- source: scripts/schema_to_field_semantics.py
