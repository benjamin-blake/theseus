schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "control-table-class-and-counter-conformance"
intent: >-
  Close the writer-internal control-state gap: fix the unconditional counter advance that turns the
  rec-id allocator into a global write lock, then add a governed `control` table class so the next
  control table cannot be created unregistered, unpartitioned and invisible to maintenance.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-control-table-class-and-counter-conformance.yaml
phase: T2.26
closes_criteria:
  - T2.26:c7
scope:
  - file: src/common/ducklake_writes.py
    action: Modify
    purpose: Make _advance_entity_counter no-op-free so a key at or below current_value performs no catalog write and raises no OCC conflict.
  - file: src/common/ducklake_control_tables.py
    action: Create
    purpose: >-
      Control-class spec dataclass, its column ordering and single-table DDL, WHOLLY contained here so
      ducklake_scd2_schema.py takes only a delegation shim and _order_columns is never widened.
  - file: src/common/ducklake_scd2_schema.py
    action: Modify
    purpose: Delegate control-class resolution to the new module (shim only; the file has 32 SLOC of headroom).
  - file: src/common/ducklake_tables.py
    action: Modify
    purpose: Control-class create path -- one table, partitioned before first write.
  - file: src/common/ducklake_runtime.py
    action: Modify
    purpose: Re-export the control-class surface through the facade every Lambda reaches the runtime through.
  - file: src/lambdas/ducklake_writer/handler.py
    action: Modify
    purpose: >-
      create_ops_tables provisions a control-class table; retire the ad-hoc CREATE TABLE from the write
      path; refuse a control-class table at write_ops / file_ops / update_ops.
  - file: src/lambdas/ducklake_writer/manifest.yaml
    action: Modify
    purpose: Bundle the new control-tables module.
  - file: src/lambdas/ducklake_reader/manifest.yaml
    action: Modify
    purpose: Bundle the new module -- this artifact already bundles ducklake_scd2_schema.py and would ImportError without it.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle the new module (same import-closure reason).
  - file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
    action: Modify
    purpose: Bundle the new module (same import-closure reason).
  - file: src/lambdas/ducklake_catalog_dr/manifest.yaml
    action: Modify
    purpose: Bundle the new module (same import-closure reason).
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: Bundle the new module (same import-closure reason).
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: Control-class projection branch; entity_id_prefix / id_keyspace optional for that class.
  - file: scripts/checks/contracts/validate_table_registration.py
    action: Create
    purpose: >-
      Admission control -- resolve module-level constant references in CREATE TABLE statements under src/
      and fail when the resolved table name is absent from the registry.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: One Entry registering the new check (Decision 169 -- validate.py is never edited).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check module.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Third sanctioned write mode `control` with its governing invariants, plus a governance note recording
      why a new check module rather than a leg on validate_data_model_standard, and the reversal conditions
      the contract-only routing would otherwise leave unstated.
  - file: docs/contracts/ops_entity_counters.yaml
    action: Create
    purpose: Class A ritual contract for the counter table, carrying table_class control.
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: Register the table so every table-driven governance surface sees it.
  - file: docs/contracts/ducklake_writer.yaml
    action: Modify
    purpose: Correct the allocation wording and record that control-table reads occur inside the writer transaction.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: contract_table_ops entry carrying reconcile_scope exempt (a control table has no history/current pair to reconcile).
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated registry output (generated; drift-gated).
  - file: config/agent/data_quality/ops.yaml
    action: Modify
    purpose: Register DQ checks for the control table -- exactly one row per keyspace, current_value non-decreasing.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated annotation on Decision 137 naming the counter_name per-table partition exception (amendment_forms
      shape). NO new numbered Decision -- the control class routes to its owning contract.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Re-ground T2.52 c1 (presumes the write-mode set is scd2/append_only) and T2.26 c2 (this plan's own finding is evidence against it).
  - file: tests/common/test_ducklake_control_tables.py
    action: Create
    purpose: Control-class spec shape, DDL, partition and write-verb refusal coverage.
  - file: tests/common/test_ducklake_writes.py
    action: Modify
    purpose: Red-before regression that a no-op advance performs no catalog write.
  - file: tests/test_ducklake_facade.py
    action: Modify
    purpose: Facade surface list after the control split (ensure_entity_counters_table is pinned there today).
  - file: tests/test_ducklake_artifacts.py
    action: Modify
    purpose: Assert every artifact bundling ducklake_scd2_schema.py also bundles the new control module.
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: Control-class projection coverage.
  - file: tests/checks/contracts/test_validate_table_registration.py
    action: Create
    purpose: Admission-check discrimination, constant resolution, and a non-zero examined count over real src/.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    No terraform change. The affected ACTIVE Lambda artifact set is all six that bundle
    ducklake_scd2_schema.py -- ducklake_writer, ducklake_reader, ducklake_maintenance,
    ducklake_maintenance_smoke, ducklake_catalog_dr, data-pipeline -- and all six deploy through the
    governed CD channel (Decision 125/126). Never build_lambda --deploy.
  - >-
    The step 13/14 migration needs the writer quiesced. Reserved concurrency is an operator action on
    an existing function, not a new resource; no IAM or trust change, so no gated apply is involved.
acceptance_criteria:
  - >-
    A no-op counter advance performs no catalog write: the test named in test_obligations asserts it
    against the observation surface named in verification_plan step 1, and fails against current main.
  - >-
    docs/contracts/data-modeling-standard.yaml declares a third write mode `control` whose invariants
    include a hard row ceiling, partition-on-key, no-op-free writes and a mandatory maintenance_binding.
  - >-
    ops_entity_counters resolves from the registry as a control-class table partitioned on counter_name,
    with no history_table and no current_table, and is present in storage-substrate.yaml.
  - >-
    write_ops, file_ops and update_ops each loud-fail on a control-class table rather than falling through
    write_scd2 into the SCD2 branch against current_table=None.
  - >-
    Every Lambda artifact that bundles ducklake_scd2_schema.py also bundles the control module, and
    --check-bundles passes handler-import closure for all six active artifacts.
  - >-
    The admission check fails when a CREATE TABLE under src/ resolves to a table absent from the registry,
    resolves module-level constant references rather than literals only, and reports an examined() count
    over the real src/ tree greater than zero.
  - >-
    The ad-hoc CREATE TABLE IF NOT EXISTS write path is unreachable: no call site remains and the stale
    reference sweep in verification_plan step 8 is clean.
  - >-
    Decision 137 carries a dated appended annotation naming the counter_name partition as an explicit
    per-table exception, in a sanctioned amendment_forms shape, with no new numbered Decision minted.
  - >-
    config/agent/data_quality/ops.yaml declares checks for ops_entity_counters asserting exactly one row
    per keyspace and a non-decreasing current_value, and the DQ runner reports them PASSING against the live table.
  - >-
    Post-migration, clause8_checks.current_merge_key_unique on ops_recommendations reports PASSING -- the
    2026-06-11 duplicate-id failure mode is observed absent rather than assumed absent.
  - >-
    No scope file crosses its SLOC budget; the control-class logic lands as a new module, not as accretion.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove a no-op counter advance performs no catalog write.
    command: bin/venv-python -m pytest tests/common/test_ducklake_writes.py::test_advance_counter_noop_writes_no_files -q
    expected: >-
      PASSES after the fix; FAILS against current main. OBSERVATION SURFACE -- the implementer picks ONE and
      the test asserts on it: (a) Python-side read-then-conditional-write, asserted via the recording
      connection fake's executed-SQL list (no UPDATE issued); or (b) a SQL predicate, asserted against a
      real local duckdb+ducklake catalog via ducklake_list_files count before/after. (a) is preferred --
      a fake cannot discriminate a zero-row-match UPDATE under (b).
    fix_if: The assertion cannot distinguish a no-op from a write -- the chosen surface is (b) against a fake; switch to (a) or to a real catalog.
    graduation: graduate
    graduation_check_id: entity-counter-advance-noop-free
  - step: 2
    phase: pre-deploy
    action: Prove control-class resolution returns a single partitioned table, not a history/current pair.
    command: bin/venv-python -m pytest tests/common/test_ducklake_control_tables.py -q
    expected: Spec carries table + partition counter_name; history_table and current_table are None; DDL issues one CREATE plus one SET PARTITIONED BY.
    fix_if: The resolver still demands history_table -- branch on table_class before the SCD2 path.
    graduation: graduate
    graduation_check_id: control-class-spec-shape
  - step: 3
    phase: pre-deploy
    action: Prove the generator projects a control contract without SCD2 assumptions.
    command: bin/venv-python -m pytest tests/test_schema_to_field_semantics.py -q
    expected: Projection emits a single table, partition on the key column, and no entity_id_prefix / id_keyspace.
    fix_if: KeyError on ops_config -- those keys are hard-indexed; make them optional for the control class.
    graduation: graduate
    graduation_check_id: control-class-registry-projection
  - step: 4
    phase: pre-deploy
    action: Prove the decomposition preserved the runtime facade surface.
    command: bin/venv-python -m pytest tests/test_ducklake_facade.py -q
    expected: Every symbol the facade exported before the split still resolves through src/common/ducklake_runtime.py.
    fix_if: A symbol disappeared -- re-export it from the new module rather than deleting it from the facade list.
    graduation: graduate
    graduation_check_id: ducklake-facade-surface-complete
  - step: 5
    phase: pre-deploy
    action: Prove every artifact bundling the SCD2 schema also bundles the control module, and that handler imports close.
    command: bin/venv-python -m pytest tests/test_ducklake_artifacts.py -q && bin/venv-python -m scripts.lambda_manifest --check-bundles
    expected: >-
      All six active artifacts stage and their handlers import cleanly. This is the ONLY import-closure
      oracle in the repo and nothing else calls it; without this step a missing manifest row ships and
      four functions cold-start into ImportError after merge.
    fix_if: An artifact fails to import -- add the control module to that manifest's includes; never narrow the check.
    graduation: graduate
    graduation_check_id: lambda-bundle-import-closure
  - step: 6
    phase: pre-deploy
    action: Prove the generic write verbs refuse a control-class table.
    command: bin/venv-python -m pytest tests/common/test_ducklake_control_tables.py -k write_verb_refusal -q
    expected: write_ops, file_ops and update_ops each raise on a control-class table; none reaches write_scd2.
    fix_if: A verb falls through to the SCD2 branch against current_table=None -- add the refusal before dispatch.
    graduation: graduate
    graduation_check_id: control-class-write-verb-refusal
  - step: 7
    phase: pre-deploy
    action: Prove the admission check discriminates on real code, not only a synthetic fixture.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_table_registration.py -q
    expected: >-
      Fails on an unregistered table, passes when registered, resolves module-level constant references
      (every CREATE TABLE under src/ today interpolates a variable or constant -- none is a bare literal),
      and reports examined() over the real src/ tree greater than zero.
    fix_if: examined() is zero -- the check resolves literals only and is Decision 170 vacuous; add constant resolution and an explicit disposition for the spec-driven DDL sites.
    graduation: graduate
    graduation_check_id: create-table-must-be-registered
  - step: 8
    phase: pre-deploy
    action: Prove the retired ad-hoc creation path is unreachable (closure obligation, surface-retiring).
    command: "! rg -n 'ensure_entity_counters_table\\(' src/ scripts/ --glob '!*control_tables*'"
    expected: No call site remains outside the control-tables module (exit 0 via negation).
    fix_if: A caller survives -- route it through create_ops_tables; never leave a conditional fallback.
    graduation: graduate
    graduation_check_id: adhoc-create-table-path-retired
  - step: 9
    phase: pre-deploy
    action: Prove the registry regenerates cleanly with the control entry.
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0; ops_entity_counters present with reconcile_scope exempt, which _enforce_reconcile_pending_subset requires.
    fix_if: Raises on reconcile_scope -- the sidecar entry omits the key; it must be 'ducklake' or 'exempt'.
    graduation: graduate
    graduation_check_id: control-table-drift-clean
  - step: 10
    phase: pre-deploy
    action: Fast presubmit, including SLOC budgets.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, including validate_sloc_limits and validate_sloc_budget_raises.
    fix_if: A file is over budget -- decompose further; never register a raise for this plan.
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Full presubmit before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Any check fails -- fix at source; never weaken an assertion to obtain green.
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: Confirm the governed CD channel deployed every affected artifact.
    command: mcp__github__actions_list(owner="benjamin-blake", repo="theseus", workflow_id="deploy-ducklake-lambdas.yml", perPage=1)
    expected: Latest run green on the merge commit, with the writer, reader, maintenance, maintenance-smoke and catalog-dr jobs all succeeded.
    fix_if: Red -- read the job log via mcp__github__get_job_logs and fix forward; never re-run hoping for green.
  - step: 13
    phase: post-deploy
    action: OPERATOR -- quiesce the writer, then provision the control table.
    command: aws lambda put-function-concurrency --function-name agent-platform-ducklake-writer --reserved-concurrent-executions 0 --profile agent_platform_admin --region eu-west-2 && aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_entity_counters","force_recreate_tables":true,"confirm_force_recreate":"ops_entity_counters"}' /tmp/control.json && cat /tmp/control.json
    expected: >-
      Reserved concurrency 0 is in force BEFORE the invoke -- this is the enforcement behind "quiesced",
      not a prose constraint. The table is recreated partitioned on counter_name. counter_seed is null
      here by design: the control class has no entity_id_prefix, so action_create_ops_tables does not
      seed it -- the keyspace reseed is step 14.
    fix_if: Reserved concurrency did not apply -- STOP; a concurrent allocation during the drop window is the 2026-06-11 duplicate-id failure mode.
  - step: 14
    phase: post-deploy
    action: OPERATOR -- reseed the rec keyspace counter, then restore writer concurrency.
    command: aws lambda invoke --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"create_ops_tables","table":"ops_recommendations"}' /tmp/reseed.json && cat /tmp/reseed.json && aws lambda delete-function-concurrency --function-name agent-platform-ducklake-writer --profile agent_platform_admin --region eu-west-2
    expected: counter_seed equals the current max rec-NNNN in ops_recommendations_history; concurrency restored only after the seed is confirmed.
    fix_if: counter_seed is below the table max -- STOP and RCA; do not restore concurrency onto a stranded counter.
  - step: 15
    phase: post-deploy
    action: OPERATOR -- compact, then measure. A recreate plus ALTER does not by itself rewrite the pre-existing files.
    command: aws lambda invoke --function-name agent-platform-ducklake-maintenance --profile agent_platform_admin --region eu-west-2 --cli-binary-format raw-in-base64-out --payload '{"action":"catalog_stats","meta_schema":"ducklake_ops"}' /tmp/stats.json && cat /tmp/stats.json
    expected: >-
      ops_entity_counters live-file count is orders of magnitude below the 3,418 baseline and stays flat
      across subsequent update_rec calls. If the count is still high immediately after step 13, that is the
      pre-existing file set awaiting the sibling session's compaction cadence -- re-read after it runs
      rather than treating it as a failed fix; the FLAT-across-updates property is this plan's evidence.
    fix_if: The count climbs per update_rec -- the guard is not on the executed path; re-run step 1 against the deployed artifact.
  - step: 16
    phase: post-deploy
    action: Prove the duplicate-id failure mode is absent and the control table's own DQ checks pass.
    command: bin/venv-python -m scripts.data_quality_runner --table ops_recommendations && bin/venv-python -m scripts.data_quality_runner --table ops_entity_counters
    expected: clause8_checks.current_merge_key_unique PASSES on ops_recommendations; both control-table checks reported and PASSING.
    fix_if: A uniqueness failure appears -- the reseed raced an allocation; STOP and RCA (Decision 55), do not re-run the reseed blindly.
