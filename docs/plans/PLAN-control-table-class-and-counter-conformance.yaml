  - No rescue agents or workaround loops (Decision 55).
  - NEVER weaken an assertion or raise a budget to obtain green (Decision 55 / Decision 181 / Decision 128).
  - >-
    Decision 84 I-2 is PRESERVED, not amended: allocation stays writer-owned and inside the DuckLake
    write transaction. This plan changes the counter table's SHAPE and GOVERNANCE, never its substrate.
  - >-
    Decision 177: Decision 137's body is append-only -- the per-table partition exception lands as a
    dated appended annotation, never an in-place body rewrite.
  - >-
    Decision 169: a new check is a registered module plus one _manifest.py Entry. scripts/validate.py
    is not edited.
  - >-
    NO new numbered Decision. decision-entry.yaml's routing_rule needs all three questions to answer
    yes; question 3 fails because the field_semantics row ('constraints of a data field or config key
    -> the owning contract; never a numbered Decision') already owns the control-class invariants. The
    Decision 137 exception takes the amendment_forms shape at zero header cost (rec-3016 property test).
  - >-
    ducklake_scd2_schema.py has 32 SLOC of headroom (468/500). The control spec dataclass and its column
    ordering live WHOLLY in the new module; _order_columns is not widened in place. The file lands at
    roughly 475-480, so the NEXT edit to it trips the budget and must decompose.
  - >-
    Six ACTIVE artifacts bundle ducklake_scd2_schema.py. Any new module it imports must be added to all
    six manifests, or four functions -- reader included -- cold-start into ImportError. --check-bundles
    is the only oracle for this and nothing else calls it.
  - >-
    The step 13/14 migration runs under reserved-concurrency-0 on the writer. "Quiesced" is that
    mechanism, never a prose intention: a concurrent self-seed race is what minted duplicate rec ids
    on 2026-06-11, and the hot path never self-seeds for exactly that reason.
  - >-
    Inlining stays globally disabled (Decision 107/CD.34). A per-table inlining exception was
    considered and rejected: it relocates cost into catalog egress and complicates GC policy.
  - Lambda code deploys ride the governed CD channel; never build_lambda --deploy (Decision 125/126).
