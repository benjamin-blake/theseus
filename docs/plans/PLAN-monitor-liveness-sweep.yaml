execution_steps:
  - >-
    Write scripts/convergence_health/sensor_liveness_success.py: for each derived peer, query
    `?event=schedule&status=success&per_page=1` through the SAME injected caller seam, compare the
    age against staleness_threshold_seconds(peer's own cron), and return a per-peer verdict that
    distinguishes stale / fresh / unobservable. PARAMETERISE _assess_peer's query and anchor label
    rather than reimplementing its arithmetic -- its own docstring (:262-263) says it is shared by
    detect_stale_loops and --liveness-probe "so the two never compute staleness differently", and a
    reimplementation would quietly break that named invariant. Parameterising also inherits the
    _query_last_run dead-query raise and the intro:{sha} never-succeeded fallback for free, both of
    which are the wanted behaviour. Accounting: one additional bounded GitHub call per
    peer per tick (11 -> 21 calls hourly, negligible against the 5,000/hour limit). The cost that
    matters is on the WAREHOUSE side -- see constraints -- because a never-auto-closed stale peer
    makes every subsequent tick pay find_recs.
  - >-
    Wire the leg into detect_stale_loops as a second finding class, delegating rather than
    inlining so sensor_liveness.py stays within its four lines of SLOC headroom. Append the leg
    marker AFTER the start-anchored title prefix, never before it.
  - >-
    Lift the episode-identity block (_episode_title, _parse_episode_title, _is_open_loop_row,
    _filter_resolved_rows, _same_anchor_best_row, _cross_anchor_newest, _episode_context) into
    scripts/convergence_health/sensor_liveness_episodes.py, re-keyed on (loop, leg). This is what
    funds the SLOC budget AND what makes two legs independently resolvable -- the previous draft
    asserted the grain was preserved, which was wrong: every matcher keys on (loop) alone, so two
    legs stale on one peer would flip-flop one rec's title every hour forever.
  - >-
    Widen _charge's sweeps_max (currently len(peers)+1) so two finding classes cannot raise a FALSE
    structural-violation RuntimeError, and decide the _FLEET_LOOP_KEY behaviour for two legs --
    a single "__fleet__" literal collides on the open matcher if both legs collapse.
  - >-
    Make the acceptance oracle leg-aware across all THREE of its surfaces, not just the CLI:
    _probe_acceptance (sensor_liveness.py:314) must emit a leg selector, stale_peers_for_probe
    (sensor_liveness.py:594) must return leg-aware results instead of a flat loop-name list, and
    _dispatch's argv parse (__main__.py:173-176) must accept that selector. Extending only the CLI
    cannot discriminate a leg, and would make a CADENCE-leg rec's acceptance start failing whenever
    only the success leg is stale -- a regression of acceptance_criteria[1], not a fix. DECIDE the
    bare form, do not leave it to inference: `--liveness-probe {loop}` with NO selector means the
    CADENCE leg, because _decide_action (:440-446) rewrites only title and context on update, so
    every already-filed cadence rec keeps its stored selector-less acceptance string forever. A bare
    form meaning "stale on any leg" would start failing those legacy recs on a success-only outage
    -- the same regression, reintroduced through the back door. SYMMETRICALLY, decide the untagged
    legacy TITLE the same way: _is_open_loop_row (:342-355) matches title.startswith("Loop: {loop}.
    "), and re-keyed on (loop, leg) it must treat a title with NO leg marker as CADENCE. Live, not
    hypothetical -- rec-3860 is open right now as "Loop: main-canary.yml. Episode:
    run:31336661344. Bucket: 8. ..." with no marker, so if untagged does not map to cadence the
    first post-merge tick files a DUPLICATE open rec against that peer. Give it a test using
    rec-3860's exact legacy title shape; no test this plan otherwise names would catch it, because
    every existing test injects its own open_recs titles.
  - >-
    Extend loop_liveness_stale's description and signal_interpretation in
    config/agent/data_quality/source_registry.yaml to cover both legs.
    Append the dated Decision 62 annotation ONLY -- recording both the dead-alarm correction and
    that the threshold is now cron-derived, so Decision 83's "more than 14 days" prose agrees only
    by coincidence. Do NOT touch Decision 83: arming its predicate is rec-3979's, and doing it here
    reds --pre on every PR. Re-read Decision 177's dialect first; this is an append, never a splice.
  - >-
    Write the tests, including the runs-fire-but-all-red case, and add
    config/agent/verification_registry/entries/loop-liveness-success-age.yaml with check_id
    loop-liveness-success-age matching VP step 1's graduation_check_id verbatim.
  - >-
    Execute Verification Plan steps 1-5 -- run each; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - >-
    Update rec-3974 through the portal so it explicitly owns the two gh-based preflight detectors
    this plan defers -- its current context excludes them on the assumption this plan would carry
    them, which is a circular deferral. VP step 7 asserts the update landed.
  - >-
    Commit WITHOUT a Resolves trailer -- this plan closes no rec; rec-3092's surviving ask is the
