constraints:
  - >-
    Decision 88 governs NEON CATALOG EGRESS, not the GitHub API -- an earlier draft cited it against
    Actions calls, which was an over-read. GitHub cost here is fine and bounded: the tick goes from
    11 calls to 21, hourly, ~500/day against a 5,000/hour authenticated limit. The REAL Decision 88
    exposure is on the warehouse side and must be named: detect_stale_loops is "lazy and bounded --
    a healthy tick issues zero warehouse reads" only because of its `if not stale: return` early
    exit. The recurring cost is SMALLER than an earlier draft of this constraint claimed, and the
    claim is corrected here rather than left conservative-but-wrong: _reconcile_episode guards the
    resolved sweep behind `if existing is None:` (:473-477), so a peer whose rec is already filed
    and open pays ZERO sweeps per tick, not one. The only per-tick warehouse read while anything is
    stale is the single source-scoped find_recs("loop_liveness_stale") at :566-567, which the second
    leg does not change -- read that as the STEADY-STATE read, not an exhaustive one: in the
    post-closure dwell window (rec resolved, peer still stale, _decide_action returning "drop")
    `existing` is None every tick, so the sweep and a possible rec_by_id run each tick for the whole
    mute window. Another reason the per-loop-per-tick memo below is mandatory, not an optimisation. Sweep cost is per EPISODE, paid on first file and on a cross-anchor
    re-open, so a peer stale on both legs pays at most two at those moments. Keep the sweep prefix
    loop-wide (`Loop: {loop}.%`), discriminate the leg CLIENT-SIDE in _filter_resolved_rows, and
    MEMOISE _resolved_rows_for_loop per loop per tick -- Decision 88 invariant (ii) forbids an
    ad-hoc re-fetch of data already in hand, and the loop-wide prefix makes the memo trivial.
  - >-
    NO second register. derive_scheduled_peers() walks every .github/workflows/*.yml on:.schedule
    block at run time, and PLAN-sensor-liveness.yaml:827 records that its audit rejected a declared
    register as "a fourth register over the same population". The success leg reuses the derived
    peer set and the cron-derived threshold; it introduces no liveness_sla_days field, no new
    source, and no new workflow.
  - >-
    Decision 128 decompose-by-default: sensor_liveness.py is at 496 SLOC against the unregistered
    500 default and ci_rca_signals.py at 497. The leg goes in a sibling module and VP step 5 proves
    no budget entry was added.
  - >-
    CHANGE the episode grain from (loop) to (loop, leg); PRESERVE everything else about it --
    FILE/UPDATE ONLY and NEVER auto-closed, restored cadence does not resolve a filed rec, a human
    does. Three surfaces currently declare the old grain and ALL must be corrected in this plan, not
    left to contradict it: constraints here, scripts/convergence_health/sensor_liveness.py:21-23's
    module docstring ("the open matcher keys on (loop) ALONE"), and
    config/agent/data_quality/source_registry.yaml:212 ("the open matcher keys on the loop alone").
    The leg marker must follow the start-anchored `Loop: {k}. Episode: {a}. Bucket: {n}.` title
    prefix, never precede it, or recs_by_title_prefix's whole-pattern LIKE bind stops matching
    (Decision 142).
  - >-
    Decision 55 fail-loud, no outbox: a dead query raises rather than reporting an empty, reassuring
    population. Do not catch a transport failure into a fresh verdict.
  - >-
    Decision 177 append-only: every baseline line of Decision 62 survives verbatim, and the
    2026-06-16 clause is corrected BY a dated appended annotation naming it, never by a splice.
    Decision 83 is NOT touched by this plan at all -- arming its predicate is rec-3979's, and doing
    it here would red --pre on every PR (validate_reversal_stanzas is pre=True with no pre_globs and
    turns any predicate exception into MALFORMED, while ci.yml's pr-validate carries neither
    GITHUB_TOKEN nor id-token). Do not treat clause 4's stanza carve-out as a licence to set
    `predicate:` here.
  - >-
    Decision 101 -- run ids and control-state words only; no tokens, response bodies or account ids.
  - >-
    NOT in scope: adding any workflow to the ci-rca watched set. _VALID_CI_RCA_VALUES is
    ("watched","excluded") and watched is bidirectionally locked to ci-rca.yml's filter, so
    "watched but advisory" is unrepresentable and watching means a Critical queue hard-block. If
    hour-scale detection is ever needed the sanctioned route is a NEW non-blocking value in that
    enum -- a reviewable data-model change owned by T1.13 -- never a flip of the binary field.
  - No rescue agents or workaround loops (Decision 55); no check skipped, disabled or weakened.
