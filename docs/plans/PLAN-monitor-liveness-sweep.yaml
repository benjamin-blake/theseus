schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "monitor-liveness-sweep"
intent: >-
  Close the one real gap in the landed scheduled-loop liveness backstop: it asserts that a schedule
  is still FIRING, never that it is still SUCCEEDING, so a monitor whose runs fire on cadence and
  fail every time is invisible to it. Add a success-age leg on the same hourly carrier, and arm
  Decision 83's probe-monitor-blind predicate off it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-monitor-liveness-sweep.yaml
phase: >-
  Slice 2 of 2. Depends on PLAN-ghas-probe-install-restore's BOTH PRs merging first (its code PR and
  its follow-up Decision 83 evidence PR), because this slice also edits docs/DECISIONS.md and arms a
  predicate inside the same Decision 83 reversal-conditions stanza that slice 1 re-arms. Scoped as
  ad_hoc_rec (bundles rec-3092, no tier_item claimed).
scope:
  - file: scripts/convergence_health/sensor_liveness_success.py
    action: Create
    purpose: >-
      The success-age leg. Computes each peer's newest `?event=schedule&status=success` run age and
      classifies it against the SAME cron-derived threshold. A SIBLING module, not an inline
      addition: sensor_liveness.py measures 496 SLOC against the unregistered 500 default (exact
      counter: non-blank non-comment lines), so four lines of headroom remain and Decision 128
      makes decomposition the default response, never a budget raise.
  - file: scripts/convergence_health/sensor_liveness.py
    action: Modify
    purpose: >-
      Wire the second leg into detect_stale_loops and delegate to the new module. Must NET-SHRINK or
      hold at most 500 SLOC -- verified by VP step 5, not assumed.
  - file: scripts/preflight/decision_conditions.py
    action: Modify
    purpose: >-
      Register the probe-monitor-blind predicate (today only roadmap_items_complete is registered),
      computing it from the same success-age function so Decision 83's condition (b) fires
      mechanically rather than as prose. The slot at docs/DECISIONS.md:6849-6853 already declares
      `kind: repo_state`, `predicate: null` and the description "no successful ghas-probe run in
      more than 14 days" -- a SUCCESS predicate, which is exactly what this leg computes.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Extend loop_liveness_stale's description and signal_interpretation to cover the success leg.
      Reuses the registered source rather than minting a second one -- same population, same
      carrier, same episode grain, same FILE/UPDATE-ONLY-NEVER-CLOSE posture.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated APPENDED annotation on Decision 62 recording that its 2026-06-16 clause ("the silent-cron
      failure mode 62 worried about is mitigated by a persistent-unavailability alarm (Decision
      74)") named an alarm that does not operate on the primary dev surface, and that the operative
      mitigation is now the derived-peer liveness backstop plus this success leg. Sets
      `predicate: probe-monitor-blind` in Decision 83's fenced reversal-conditions stanza.
      Append-only (Decision 177); the fenced stanza interior is the one carve-out (clause 4).
  - file: tests/convergence_health/test_sensor_liveness_success.py
    action: Create
    purpose: >-
      The success-age classification, including the case this plan exists for: runs firing on
      cadence, every one of them red, cadence leg silent, success leg stale.
  - file: tests/convergence_health/test_sensor_liveness.py
    action: Modify
    purpose: >-
      Prove the two legs compose without regressing the cadence leg, and that the start-anchored
      title grammar (`Loop: {k}. Episode: {a}. Bucket: {n}.`) is preserved so recs_by_title_prefix's
      whole-pattern LIKE bind still matches (Decision 142).
  - file: tests/session/preflight/test_decision_conditions.py
    action: Create
    purpose: predicate registration and evaluation, including the unobservable case
  - file: config/agent/verification_registry/entries/loop-liveness-success-age.yaml
    action: Create
    purpose: graduated shard admitted by VP step 1
bundled_recommendations:
  - rec-3092
followon_recs:
  - rec-3974
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A peer whose scheduled runs fire on cadence but never succeed within its cron-derived threshold
    is classified stale by the success leg, while the existing cadence leg stays silent on it.
  - >-
    The cadence leg's behaviour is unchanged: a peer with no `event=schedule` run at all is still
    classified exactly as before, with the same anchor, bucket and title grammar.
  - >-
    probe-monitor-blind is registered and evaluates from the success-age function, so Decision 83's
    condition (b) is machine-evaluated rather than prose.
  - >-
    scripts/convergence_health/sensor_liveness.py remains at or below 500 SLOC with no
    config/sloc_budgets.yaml entry added.
  - rec-3092 is closed by this plan's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the success-age classification against a stubbed caller, including the
      runs-fire-but-all-red case that motivated this plan and the no-token unobservable case.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness_success.py tests/session/preflight/test_decision_conditions.py -q
    expected: all pass, including the all-red-runs case and the unobservable case
    expected_literals:
      - "passed"
    fix_if: >-
      A test that stubs the success-age function itself proves nothing -- it must drive the real
      classifier against a stubbed HTTP caller, the injection seam detect_stale_loops already uses.
    hermetic: true
    graduation: graduate
    graduation_check_id: loop-liveness-success-age
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the cadence leg did not regress and the start-anchored title grammar survives.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py -q
    expected: >-
      the existing cadence-leg suite passes unchanged, including the fleet-collapse and
      episode-dedupe cases
    expected_literals:
      - "passed"
    fix_if: >-
      A title-prefix test failing means the leg marker was inserted BEFORE the anchored
      `Loop: {k}. Episode: {a}. Bucket: {n}.` prefix; recs_by_title_prefix binds the whole LIKE
      pattern with no implicit wildcard, so the marker must come after it (Decision 142).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is a regression assertion over an already-graduated suite (the cadence leg landed with
      PLAN-sensor-liveness and carries its own registry shard); re-admitting the same behaviour
      under a second check_id would duplicate an existing registry entry.
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the success leg is red-before against the real repository state: ghas-probe.yml fires on
      cadence today but its last success is 2026-09-07, so the leg must classify it stale while the
      cadence leg does not.
    command: bin/venv-python -m scripts.convergence_health.sensor_liveness --liveness-probe --dry-run
    expected: >-
      ghas-probe.yml is reported stale by the success leg and NOT by the cadence leg, with its
      threshold shown as the cron-derived 1209600s
    fix_if: >-
      If ghas-probe.yml reports fresh on the success leg, slice 1 has already restored it and this
      red-before window has closed -- substitute any peer whose last success predates its threshold,
      or construct the case against a pinned fixture rather than weakening the assertion.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: run the fast presubmit tier as a pre-check before pushing
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      validate_sloc_limits failing on sensor_liveness.py means the leg was added inline rather than
      delegated to the sibling module -- move it, do not raise the budget (Decision 128).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered --pre tier itself; there is no isolated behaviour here to admit
      beyond the tier, whose own checks are already registered.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the FULL validation tier before commit, as
      handoff_policy.full_validation_required_before_commit declares, and confirm the SLOC ceiling
      held.
    command: bin/venv-python -m scripts.validate
    expected: >-
      exit 0 across the full tier, with no config/sloc_budgets.yaml entry added for
      scripts/convergence_health/sensor_liveness.py
    fix_if: >-
      A new sloc_budgets.yaml entry appearing in the diff means the decomposition was abandoned for
      a budget raise; Decision 128 makes that a deliberate, marker-carrying exception, not a
      side effect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered full tier, already the authoritative post-merge verifier -- nothing
      isolated to admit to the verification registry.
  - step: 6
    phase: post-deploy
    action: >-
      Observe the next scheduled convergence-health tick and confirm the success leg ran against the
      live API on its real carrier, not only under test.
    command: "echo 'READ VIA MCP: mcp__github__actions_list(method=\"list_workflow_runs\", owner=\"benjamin-blake\", repo=\"theseus\", resource_id=\"convergence-health.yml\") then mcp__github__get_job_logs for the sensor-liveness step'"
    expected: >-
      the tick concludes success and its log shows the success leg evaluating every derived peer,
      with a per-peer verdict and no unhandled exception
    fix_if: >-
      A raise on a dead query is CORRECT behaviour (Decision 55 fail-loud, no outbox) -- do not
      catch it into a reassuring empty population. A 401/403 means the workflow token lacks
      actions:read; fix the permission, not the classifier.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: confirm rec-3092 closed on merge and the DECISIONS.md edit stayed append-only
    command: |-
      bin/venv-python -m scripts.sync.ops sync && git fetch origin main --quiet && git diff --numstat origin/main -- docs/DECISIONS.md && grep '"rec-3092"' logs/.recommendations-log.jsonl | grep -c '"status": "closed"'
    expected: >-
      the numstat deletions field is 0, and the rec-3092 closed-status grep returns a non-zero count
    fix_if: >-
      A non-zero deletions count means Decision 62's 2026-06-16 clause was spliced rather than
      annotated -- restore it and append a dated correction naming the clause. A zero grep count
      means the Resolves trailer did not fire; close rec-3092 through the portal rather than editing
      the read cache, which is never a write source.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/convergence_health/sensor_liveness_success.py
    behavior: >-
      A peer whose runs fire on cadence but never succeed inside its threshold is classified stale;
      a peer succeeding inside its threshold is not; an unobservable API yields an explicit
      unobservable verdict, never a reassuring fresh.
    verification_step: 1
    test_selector: tests/convergence_health/test_sensor_liveness_success.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/convergence_health/sensor_liveness.py
    behavior: >-
      Both legs compose; the cadence leg's anchors, buckets, fleet collapse and start-anchored title
      grammar are unchanged.
    verification_step: 2
    test_selector: tests/convergence_health/test_sensor_liveness.py
    red_green_expectation: >-
      The existing suite is green before and must stay green after -- this is the regression leg;
      the new behaviour's red-before lives in step 1.
  - source: scripts/preflight/decision_conditions.py
    behavior: probe-monitor-blind is registered and evaluates from the success-age function
    verification_step: 1
    test_selector: tests/session/preflight/test_decision_conditions.py
    red_green_expectation: red before (only roadmap_items_complete is registered), green after
  - source: config/agent/data_quality/source_registry.yaml
    behavior: loop_liveness_stale's declared semantics cover both legs
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Registry shape is already owned by the registered check_source_registry check, which fails
      --pre on a malformed or unregistered source. A dedicated test would re-assert an existing
      registered verifier over the same data, the second-surface drift Decision 86 forbids.
  - source: docs/DECISIONS.md
    behavior: the Decision 62 correction is additive and the Decision 83 predicate slot is armed
    verification_step: 7
    command: |-
      bin/venv-python -m scripts.sync.ops sync && git fetch origin main --quiet && git diff --numstat origin/main -- docs/DECISIONS.md && grep '"rec-3092"' logs/.recommendations-log.jsonl | grep -c '"status": "closed"'
    waiver_reason: >-
      Append-only conformance is asserted mechanically by VP step 7's numstat deletions field rather
      than by a unit test; Decision 178 retired validate_live_entry_immutability, so this diff
      assertion is the operative check and a test over DECISIONS.md prose would assert nothing more.
  - source: config/agent/verification_registry/entries/loop-liveness-success-age.yaml
    behavior: the shard's check_id equals VP step 1's graduation_check_id
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Shard-to-step correspondence is owned by the registered validate_graduation_completeness
      check, which fails --pre on an orphaned shard or an unadmitted graduate step. A dedicated test
      would duplicate that registered verifier.
constraints:
  - >-
    NO second register. derive_scheduled_peers() walks every .github/workflows/*.yml on:.schedule
    block at run time, and PLAN-sensor-liveness.yaml:827 records that its audit rejected a declared
    register as "a fourth register over the same population". The success leg reuses the derived
    peer set and the cron-derived threshold; it introduces no liveness_sla_days field, no new
    source, and no new workflow.
  - >-
    Decision 128 decompose-by-default: sensor_liveness.py is at 496 SLOC against the unregistered
    500 default and ci_rca_signals.py at 497. The leg goes in a sibling module and VP step 5 proves
    no budget entry was added.
  - >-
    Preserve the episode grain exactly: keyed on (loop) alone, FILE/UPDATE ONLY and NEVER
    auto-closed -- restored cadence does not resolve a filed rec, a human does. The leg marker must
    follow the start-anchored `Loop: {k}. Episode: {a}. Bucket: {n}.` title prefix, never precede
    it, or recs_by_title_prefix's whole-pattern LIKE bind stops matching (Decision 142).
  - >-
    Decision 55 fail-loud, no outbox: a dead query raises rather than reporting an empty, reassuring
    population. Do not catch a transport failure into a fresh verdict.
  - >-
    Decision 177 append-only: every baseline line of Decisions 62 and 83 survives verbatim. The
    2026-06-16 clause is corrected BY a dated appended annotation naming it, never by a splice.
    Clause 4 carves out the fenced reversal-conditions stanza interior, which is what makes setting
    `predicate:` there legal.
  - >-
    Decision 101 -- run ids and control-state words only; no tokens, response bodies or account ids.
  - >-
    NOT in scope: adding any workflow to the ci-rca watched set. _VALID_CI_RCA_VALUES is
    ("watched","excluded") and watched is bidirectionally locked to ci-rca.yml's filter, so
    "watched but advisory" is unrepresentable and watching means a Critical queue hard-block. If
    hour-scale detection is ever needed the sanctioned route is a NEW non-blocking value in that
    enum -- a reviewable data-model change owned by T1.13 -- never a flip of the binary field.
  - No rescue agents or workaround loops (Decision 55); no check skipped, disabled or weakened.
context:
  - >-
    Decision-scout verdict FLAGS_FOUND. CITE list (verbatim): 62, 74, 83, 151, 150, 55, 170, 169,
    61, 103, 72, 128, 48, 86, 73. Decisions triaged: 150 of 150. Roadmap items intersected: 9;
    CONFLICT: 1; RELATED: 7.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    RESHAPED after round 1 -- see this plan's commit body for the full before/after. Round 1 found
    scripts/convergence_health/sensor_liveness.py (landed 2026-09-18) already runs this backstop
    with a DERIVED peer set on the hourly convergence-health cron, and that PLAN-sensor-liveness.yaml:827
    records its audit rejecting the declared-register shape the earlier draft proposed. Verified:
    derive_scheduled_peers() returns 10 peers including ghas-probe.yml at a 1209600s threshold.
  - >-
    Residual gap, the whole of this plan: sensor_liveness.py:215 asks `?event=schedule&per_page=1`
    -- newest scheduled RUN, unfiltered by conclusion -- so it catches "stopped firing" and misses
    "fires and every run fails", the 2026-09-14 ghas-probe mode.
  - >-
    Decision 163 answered by the reshape: the threshold is DERIVED from each peer's cron, so there
    is no declared number to be discretionary about (clause 1's "remove the exception path
    entirely"). The earlier draft's escalation-ladder answer was prose with no implementation and
    is withdrawn.
  - >-
    rec-3092's premise ("no liveness advisory exists", filed 2026-08-11) was superseded by
    PLAN-sensor-liveness. Its surviving ask is the probe-monitor-blind predicate, delivered here;
    its stored acceptance is three greps a dead implementation would satisfy, so VP step 1's
    functional tests are the operative proof.
  - >-
    T1.6 [CONFLICT, scout]: same mechanism class, already advanced by PLAN-sensor-liveness, not by
    this plan. No roadmap edit; the criterion's subject remains the DQ runner.
  - >-
    Deferred to rec-3974 (followon): ci_rca_signals.py's two gh-based detectors return None for
    both healthy and unobservable. Real, but its own blast radius -- 11 test modules patch those
    symbols by string, a graduated shard pins one, and the file is at 497/500 SLOC -- so bundling
    it here would rebuild the 25-file plan this reshape removed.
pre_implementation_checklist:
  - Branch confirmed not on main
  - >-
    BOTH of PLAN-ghas-probe-install-restore's PRs merged to main -- the code PR and the follow-up
    Decision 83 evidence PR -- since this slice edits the same Decision 83 stanza
  - docs/PROJECT_CONTEXT.md read
  - >-
    Read scripts/convergence_health/sensor_liveness.py IN FULL before writing anything, including
    its module docstring, which states the derived-peer, episode-grain, title-anchoring and
    never-close invariants this plan must preserve
  - >-
    Read only the plan-cited decision sections -- 62, 74, 83, 177, 128, 142, 55, 101 -- not all of
    DECISIONS.md
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Write scripts/convergence_health/sensor_liveness_success.py: for each derived peer, query
    `?event=schedule&status=success&per_page=1` through the SAME injected caller seam, compare the
    age against staleness_threshold_seconds(peer's own cron), and return a per-peer verdict that
    distinguishes stale / fresh / unobservable. Accounting note: this is one additional bounded
    call per peer per tick (10 peers, hourly) alongside the existing per-peer run query.
  - >-
    Wire the leg into detect_stale_loops as a second finding class, delegating rather than
    inlining so sensor_liveness.py stays within its four lines of SLOC headroom. Append the leg
    marker AFTER the start-anchored title prefix, never before it.
  - >-
    Register the probe-monitor-blind predicate in scripts/preflight/decision_conditions.py,
    computing it from the same success-age function -- one implementation, two consumers.
  - >-
    Extend loop_liveness_stale's description and signal_interpretation in
    config/agent/data_quality/source_registry.yaml to cover both legs.
  - >-
    Append the dated Decision 62 annotation and set `predicate: probe-monitor-blind` in Decision
    83's fenced stanza. Re-read Decision 177's dialect first; this is an append plus a carved-out
    in-stanza field, never a splice.
  - >-
    Write the tests, including the runs-fire-but-all-red case, and add
    config/agent/verification_registry/entries/loop-liveness-success-age.yaml with check_id
    loop-liveness-success-age matching VP step 1's graduation_check_id verbatim.
  - >-
    Execute Verification Plan steps 1-5 -- run each; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - >-
    Update rec-3974 through the portal so it explicitly owns the two gh-based preflight detectors
    this plan defers, rather than leaving them excluded by its current context text.
  - >-
    Commit with a 'Resolves: rec-3092' trailer, push, open the PR, merge on green, then execute
    VP steps 6 and 7.
  - 'Report: what was implemented, verification results, and the success leg''s first live verdicts.'
work_areas: []
rollback: >-
  The success leg is additive and injected behind the same seam as the cadence leg: removing its
  call site restores the prior behaviour exactly, with no schema, table or rec-grain change to undo.
  Filed recs are never auto-closed, so a rollback leaves any already-filed rec for human triage --
  which is the intended posture, not a leak.
