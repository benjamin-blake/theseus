schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "monitor-liveness-sweep"
intent: >-
  Give every alarm-not-gate scheduled monitor a machine-enforced liveness SLA and a detective
  control that fires on ABSENCE of a successful run, so a monitor that stops working is detected
  within one cadence period instead of going unnoticed for weeks -- and repair the two existing
  liveness detectors that silently report healthy because the binary they shell out to is not
  installed.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-monitor-liveness-sweep.yaml
phase: >-
  Slice 2 of 2. DEPENDS ON PLAN-ghas-probe-install-restore (slice 1) being merged first: both touch
  config/ci_rca_taxonomy.yaml and docs/DECISIONS.md, and arming Decision 83's probe-monitor-blind
  predicate against a probe that cannot run would mint a condition that fires on its own corrective.
  Scoped as ad_hoc_rec (bundles rec-3092, no tier_item claimed), mirroring
  PLAN-backlog-health-detection; a T1.6 progress_note records that the generic substrate exists so
  the roadmap does not misstate its own state.
scope:
  - file: scripts/github_rest.py
    action: Create
    purpose: >-
      Shared urllib GitHub REST client, extracted verbatim from validate_ghas_probe.py's existing
      _headers/_get rather than written fresh. No new dependency; no gh. Decision 100 -- call
      GitHub's own API, do not vendor a substitute.
  - file: scripts/checks/misc/validate_ghas_probe.py
    action: Modify
    purpose: consume the extracted client so there is exactly one GitHub REST transport
  - file: scripts/monitor_liveness/__init__.py
    action: Create
    purpose: facade re-exporting the package's public surface (Decision 80/104/124 pattern)
  - file: scripts/monitor_liveness/port.py
    action: Create
    purpose: >-
      The NAMED PORT (Decision 184): last_success_age(workflow) -> Fresh | Stale | Unavailable, a
      tri-state that never conflates "healthy" with "could not observe". Transport-agnostic.
  - file: scripts/monitor_liveness/github_adapter.py
    action: Create
    purpose: the GitHub Actions adapter behind the port -- one adapter, not the interface itself
  - file: scripts/monitor_liveness/sweep.py
    action: Create
    purpose: >-
      Taxonomy-driven sweep over every ci_rca:excluded scheduled row carrying liveness_sla_days.
      ONE batched Actions API read per invocation, never one call per row (Decision 88 invariant --
      its D4 driver was exactly a preflight per-session fan-out).
  - file: scripts/preflight/ci_rca_signals.py
    action: Modify
    purpose: >-
      REMOVE _check_ci_rca_liveness and _check_convergence_sensor_liveness (both shell out to gh,
      which AGENTS.md states is deliberately not installed; both catch OSError -- FileNotFoundError
      is an OSError -- and return None, which they ALSO return for healthy). They MOVE to
      monitor_liveness rather than being edited in place: this file is 593 raw lines against an
      unregistered 500-SLOC default, so growing it would force a budget raise Decision 128 forbids
      as the default response.
  - file: scripts/preflight/monitor_liveness.py
    action: Create
    purpose: preflight consumer -- renders stale rows AND unavailable observations as distinct lines
  - file: scripts/session/preflight.py
    action: Modify
    purpose: wire the consumer and add the monitor_liveness_alert report key
  - file: scripts/preflight/summary.py
    action: Modify
    purpose: print the alert, including the UNAVAILABLE case
  - file: scripts/preflight/decision_conditions.py
    action: Modify
    purpose: >-
      Register the probe-monitor-blind predicate (today only roadmap_items_complete is registered)
      so Decision 83's reversal condition (b) fires mechanically instead of as prose.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Add liveness_sla_days to every ci_rca:excluded scheduled row, and REWORD the six rationale
      strings asserting "a red scheduled run is already its own alarm" -- a claim rec-3092 records
      as empirically falsified and which has now failed twice.
  - file: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
    action: Modify
    purpose: >-
      Make ci_rca:excluded + scheduled + no liveness_sla_days an invalid state. This is the
      structural half of the control and the reason the class cannot silently regrow.
  - file: .github/workflows/backlog-health.yml
    action: Modify
    purpose: >-
      Add the liveness sweep to the existing three-job monitor rather than creating a new workflow
      (which would need its own watcher). Holds Decision 103's one-structural-read-per-episode shape.
  - file: scripts/backlog_health/escalate.py
    action: Modify
    purpose: file/update/close one rollup rec via the landed scripts.rec_episode.run_episode
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: register the new monitor_liveness_blind source
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated APPENDED annotation on Decision 62 recording that its 2026-06-16 mitigation clause
      ("mitigated by a persistent-unavailability alarm (Decision 74)") was false in practice, and
      arming Decision 83's reversal-conditions predicate slot. Append-only (Decision 177); the
      fenced reversal-conditions stanza is the one carve-out (clause 4).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: T1.6 progress_note only -- no criterion flip (Status-Trusted-Never-Inferred)
  - file: tests/monitor_liveness/test_port.py
    action: Create
    purpose: tri-state contract, including the no-gh-on-PATH and API-unreachable cases
  - file: tests/monitor_liveness/test_sweep.py
    action: Create
    purpose: stale/fresh/unavailable bucketing and the single-batched-read budget
  - file: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
    action: Modify
    purpose: red case for an excluded scheduled row missing liveness_sla_days
  - file: tests/test_session_preflight_decomposition.py
    action: Modify
    purpose: >-
      FROZEN_REPORT_KEYS grows by one. THREE edits, not one: the frozenset member, the
      len(...) == 51 self-check at line 134, and the in-test assertion plus docstring at lines
      376-381. Fixing only the obvious one leaves the rest failing.
  - file: config/agent/verification_registry/entries/monitor-liveness-staleness.yaml
    action: Create
    purpose: graduated shard for the admitting VP step
bundled_recommendations:
  - rec-3092
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    last_success_age returns three distinguishable states, and returns Unavailable -- never Fresh --
    when the GitHub API cannot be reached or no token is present.
  - >-
    validate_ci_rca_adjudication FAILS on a ci_rca:excluded scheduled row that declares no
    liveness_sla_days.
  - >-
    A preflight run surfaces a stale monitor as its own report key, and surfaces an unobservable
    sweep as a DISTINCT unavailable line rather than as silence.
  - >-
    No module under scripts/preflight/ shells out to gh; the two retired detectors have no
    remaining references.
  - >-
    The backlog-health sweep files exactly one rollup rec per episode via run_episode, and closes it
    when the finding set empties.
  - rec-3092 is closed by this plan's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the port's tri-state contract, especially that an unreachable API yields Unavailable and
      never Fresh -- the exact conflation this plan exists to remove.
    command: bin/venv-python -m pytest tests/monitor_liveness/test_port.py tests/monitor_liveness/test_sweep.py -q
    expected: all pass, including the unreachable-API and missing-token cases
    expected_literals:
      - "passed"
    fix_if: >-
      A test that asserts Unavailable by patching the port itself proves nothing -- it must drive
      the real adapter against a stubbed transport that raises.
    hermetic: true
  - step: 2
    phase: pre-deploy
    action: >-
      Red-before on the structural half: strip liveness_sla_days from one excluded scheduled row and
      confirm the extended adjudication check rejects it.
    command: git stash push config/ci_rca_taxonomy.yaml && bin/venv-python -m scripts.validate --pre; echo "EXIT:$?"; git stash pop
    expected: >-
      --pre exits non-zero and the failure names validate_ci_rca_adjudication and the row missing
      liveness_sla_days
    expected_literals:
      - "EXIT:1"
    fix_if: >-
      EXIT:0 means the new assertion is not reached for that row -- most likely the scheduled-row
      predicate reads the taxonomy instead of the workflow's own `on:` block, so a row the taxonomy
      does not mark scheduled escapes the requirement.
    hermetic: true
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the gh retirement is complete, not partial -- no module under scripts/preflight/ still
      shells out to it, and the two retired detector symbols have no remaining callers.
    command: "! grep -rn '\"gh\"' scripts/preflight/ && ! grep -rn '_check_ci_rca_liveness\\|_check_convergence_sensor_liveness' scripts/ --include=*.py; echo \"SWEEP:$?\""
    expected: both greps find nothing, so the sweep reports clean
    expected_literals:
      - "SWEEP:0"
    fix_if: >-
      A surviving reference means a caller still expects the old None-means-both contract; repoint
      it at the port rather than re-adding a shim.
    hermetic: true
  - step: 4
    phase: pre-deploy
    action: >-
      Run the live sweep from this container against the real Actions API and confirm it reports the
      state we already measured independently.
    command: bin/venv-python -m scripts.monitor_liveness.sweep --json
    expected: >-
      one batched API read; every excluded scheduled row resolves to Fresh, Stale or Unavailable;
      no row is silently omitted
    fix_if: >-
      If every row reports Unavailable, GITHUB_TOKEN is absent or unscoped -- that is a real
      Unavailable, and the sweep is behaving correctly; confirm the token before treating it as a
      defect.
    hermetic: false
  - step: 5
    phase: pre-deploy
    action: prove the preflight report key lands and the frozen-key test was fully updated
    command: bin/venv-python -m pytest tests/test_session_preflight_decomposition.py -q
    expected: passes with the frozen key count at 52
    expected_literals:
      - "passed"
    fix_if: >-
      A failure naming len(FROZEN_REPORT_KEYS) means only one of the three sites was updated -- the
      frozenset member, the line-134 self-check, and the line-376-381 assertion plus docstring all
      move together.
    hermetic: true
  - step: 6
    phase: pre-deploy
    action: run the fast presubmit tier as a pre-check before pushing
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    expected_literals:
      - "All checks passed"
    fix_if: >-
      validate_sloc_limits failing on scripts/preflight/ci_rca_signals.py means the detectors were
      copied rather than MOVED -- delete the originals.
    hermetic: true
  - step: 7
    phase: post-deploy
    action: >-
      Dispatch backlog-health in dry_run and confirm the sweep job reports findings without filing,
      then confirm a real episode files exactly one rollup rec.
    command: "echo 'DISPATCH VIA MCP: mcp__github__actions_run_trigger(method=\"run_workflow\", owner=\"benjamin-blake\", repo=\"theseus\", workflow_id=\"backlog-health.yml\", ref=\"main\", inputs={\"dry_run\":\"true\"}), then poll mcp__github__actions_get and read the sweep job via mcp__github__get_job_logs'"
    expected: >-
      the sweep job reports per-row liveness verdicts and, in dry_run, files nothing; the episode
      budget stays at one structural read
    fix_if: >-
      More than one rollup rec per episode means run_episode was called per row instead of per
      class -- Decision 103's episode budget is the constraint, not a style preference.
    hermetic: false
  - step: 8
    phase: post-deploy
    action: confirm rec-3092 closed on merge and the DECISIONS.md edits stayed append-only
    command: bin/venv-python -m scripts.sync.ops sync && git fetch origin main --quiet && git diff origin/main -- docs/DECISIONS.md | grep -c '^-[^-]'; echo "DELETIONS:$?"
    expected: rec-3092 reads closed in the refreshed cache, and the DECISIONS.md diff has no deletion lines
    fix_if: >-
      Any deletion line means Decision 62's 2026-06-16 amendment clause was spliced rather than
      annotated. Restore it and append a dated correction that names the clause instead.
    hermetic: false
test_obligations:
  - source: scripts/monitor_liveness/port.py
    behavior: >-
      Fresh, Stale and Unavailable are distinguishable; an unreachable API or absent token yields
      Unavailable, never Fresh.
    verification_step: 1
    test_selector: tests/monitor_liveness/test_port.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/monitor_liveness/sweep.py
    behavior: every excluded scheduled row resolves to a state via ONE batched API read
    verification_step: 1
    test_selector: tests/monitor_liveness/test_sweep.py
    red_green_expectation: red before, green after
  - source: scripts/monitor_liveness/github_adapter.py
    behavior: the adapter maps transport failure to Unavailable rather than raising or returning Fresh
    verification_step: 1
    test_selector: tests/monitor_liveness/test_port.py
    red_green_expectation: red before, green after
  - source: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
    behavior: an excluded scheduled row with no liveness_sla_days is rejected
    verification_step: 2
    command: git stash push config/ci_rca_taxonomy.yaml && bin/venv-python -m scripts.validate --pre; echo "EXIT:$?"; git stash pop
    red_green_expectation: >-
      Red before (the assertion does not exist, so a stripped row passes); green after, with step 2
      proving the rejection against the real taxonomy.
  - source: scripts/preflight/ci_rca_signals.py
    behavior: no gh subprocess and no silent None-means-healthy path survives in this module
    verification_step: 3
    command: "! grep -rn '\"gh\"' scripts/preflight/ && ! grep -rn '_check_ci_rca_liveness\\|_check_convergence_sensor_liveness' scripts/ --include=*.py; echo \"SWEEP:$?\""
    red_green_expectation: red before (both greps hit today), green after
  - source: scripts/preflight/monitor_liveness.py
    behavior: a stale row and an unobservable sweep render as DISTINCT preflight lines
    verification_step: 5
    test_selector: tests/test_session_preflight_decomposition.py
    red_green_expectation: red before, green after
  - source: scripts/session/preflight.py
    behavior: the report carries monitor_liveness_alert as a top-level key
    verification_step: 5
    test_selector: tests/test_session_preflight_decomposition.py
    red_green_expectation: >-
