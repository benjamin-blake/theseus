  - source: scripts/preflight/summary.py
    behavior: the alert prints, including the UNAVAILABLE case
    verification_step: 5
    test_selector: tests/test_session_preflight_decomposition.py
    red_green_expectation: red before, green after
  - source: scripts/preflight/decision_conditions.py
    behavior: probe-monitor-blind is registered and evaluates against the port
    verification_step: 1
    test_selector: tests/monitor_liveness/test_port.py
    red_green_expectation: red before (only roadmap_items_complete is registered), green after
  - source: scripts/backlog_health/escalate.py
    behavior: one rollup rec per episode, closed when the finding set empties
    verification_step: 7
    command: "echo 'DISPATCH VIA MCP: mcp__github__actions_run_trigger(method=\"run_workflow\", owner=\"benjamin-blake\", repo=\"theseus\", workflow_id=\"backlog-health.yml\", ref=\"main\", inputs={\"dry_run\":\"true\"}), then poll mcp__github__actions_get and read the sweep job via mcp__github__get_job_logs'"
    red_green_expectation: >-
      Waiver: the episode path is exercised live in step 7 rather than unit-tested, because
      run_episode's file/update/close orchestration is already covered by the landed
      backlog_health suite and re-mocking it here would assert on the mock.
  - source: scripts/github_rest.py
    behavior: a single shared transport; HTTP and URL errors surface as typed failures
    verification_step: 1
    test_selector: tests/monitor_liveness/test_port.py
    red_green_expectation: red before, green after
  - source: scripts/checks/misc/validate_ghas_probe.py
    behavior: the probe still reports the three control states through the extracted client
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      Waiver: behaviour is unchanged by construction -- this is a transport extraction, and the
      probe's own live behaviour is slice 1's VP step 6. --pre re-runs its existing suite.
constraints:
  - >-
    Decision 177 append-only: no baseline line of Decision 62 or 83 may be edited. The 2026-06-16
    mitigation clause is corrected BY a dated appended annotation that names it, never by a splice.
    The fenced reversal-conditions stanza is the one carve-out (clause 4), so arming the predicate
    slot there is legal.
  - >-
    Decision 88 invariant: ONE batched Actions read per sweep invocation. A per-row fan-out in
    preflight is the exact shape that drove D4. A row absent from the batched page is treated as
    Stale, not Fresh -- the conservative direction.
  - >-
    Decision 184 port rule: last_success_age is the named port; the GitHub client is one adapter.
    A local-tier install with no Actions API must get Unavailable, not a crash.
  - >-
    Decision 170: the extended adjudication check declares examined()/skipped(); "could not
    examine" is never an empty domain.
  - >-
    Decision 103: the sweep holds backlog-health's one-structural-read-per-episode budget and files
    at CLASS level via run_episode -- never per-row, never touching an individual rec by id.
  - >-
    Decision 128 decompose-by-default: the two detectors MOVE into monitor_liveness. No SLOC budget
    raise; scripts/preflight/ci_rca_signals.py must shrink.
  - >-
    NOT in scope: adding any workflow to the ci-rca watched set. _VALID_CI_RCA_VALUES is
    ("watched","excluded") and watched is bidirectionally locked to ci-rca.yml's filter, so
    "watched but advisory" is unrepresentable and watching means a Critical queue hard-block.
  - >-
    Decision 101 -- run ids and control-state words only; no tokens, response bodies or account
    ids.
  - No rescue agents or workaround loops (Decision 55); no check skipped, disabled or weakened.
