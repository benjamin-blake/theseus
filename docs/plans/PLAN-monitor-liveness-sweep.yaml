rollback: >-
  The success leg is additive and injected behind the same seam as the cadence leg: removing its
  call site restores the prior behaviour exactly, with no schema, table or rec-grain change to undo.
  Filed recs are never auto-closed, so a rollback leaves any already-filed rec for human triage --
  which is the intended posture, not a leak.
