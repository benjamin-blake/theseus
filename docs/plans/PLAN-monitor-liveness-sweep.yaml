pre_implementation_checklist:
  - Branch confirmed not on main
  - PLAN-ghas-probe-install-restore merged to main first -- confirm before starting
  - docs/PROJECT_CONTEXT.md read
  - >-
    Read only the plan-cited decision sections -- 62, 74, 83, 177, 151, 170, 169, 103, 88, 184, 128,
    101, 72 -- not all of DECISIONS.md
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Extract _headers/_get from scripts/checks/misc/validate_ghas_probe.py into scripts/github_rest.py
    and repoint the probe at it. Behaviour-preserving; no new dependency.
  - >-
    Build scripts/monitor_liveness/ -- port.py (the tri-state named port), github_adapter.py (the
    one adapter), sweep.py (taxonomy-driven, ONE batched read), __init__.py facade.
  - >-
    MOVE _check_ci_rca_liveness and _check_convergence_sensor_liveness out of
    scripts/preflight/ci_rca_signals.py into the package, re-expressed over the port as tri-state.
    Delete the originals -- copying leaves the SLOC budget breached and the gh path alive.
  - >-
    Add liveness_sla_days to every ci_rca:excluded scheduled row in config/ci_rca_taxonomy.yaml and
    reword the six "a red run is already its own alarm" rationales. Record, in the ghas-probe row's
    rationale, that a ci-rca watch was considered and rejected, and that the sanctioned route if
    hour-scale detection is ever needed is a NEW non-blocking value in the ci_rca enum -- a
    reviewable data-model change owned by T1.13 -- never a flip of the binary field.
  - >-
    Extend validate_ci_rca_adjudication with the liveness_sla_days assertion plus examined/skipped
    declarations, and add its red case to the existing mirror test.
  - >-
    Wire the preflight consumer, the report key, and the summary line. Update ALL THREE
    FROZEN_REPORT_KEYS sites together.
  - Register the probe-monitor-blind predicate in scripts/preflight/decision_conditions.py.
  - >-
    Add the sweep job to .github/workflows/backlog-health.yml, the rollup source to
    escalate.py, and the source registry entry.
  - >-
    Append the dated Decision 62 annotation and arm Decision 83's predicate slot. Append-only --
    re-read Decision 177's dialect before touching either entry.
  - Add the T1.6 progress_note. No criterion flip.
  - Add the graduated verification-registry shard.
  - >-
    Execute Verification Plan steps 1-6 -- run each; loop until pass; on unrecoverable V3 failure
    stop and RCA (Decision 55).
  - >-
    Commit with a 'Resolves: rec-3092' trailer, push, open the PR, merge on green, then execute VP
    steps 7 and 8.
  - 'Report: what was implemented, verification results, and the sweep''s first live verdict set.'
work_areas: []
rollback: >-
  The sweep and its preflight consumer are additive and can be disabled by removing the
  liveness_sla_days rows, which the extended check then rejects -- so rollback means reverting the
  check extension in the same commit, not the rows alone. The detector MOVE is not safely
  reversible piecemeal: reverting it restores two silently-blind detectors, so prefer forward-fix
  (Decision 73).
