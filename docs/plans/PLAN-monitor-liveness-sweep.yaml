schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "monitor-liveness-sweep"
intent: >-
  Close the one real gap in the landed scheduled-loop liveness backstop: it asserts that a schedule
  is still FIRING, never that it is still SUCCEEDING, so a monitor whose runs fire on cadence and
  fail every time is invisible to it. Add a success-age leg on the same hourly carrier, with
  leg-aware episode identity so the two legs resolve independently.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-monitor-liveness-sweep.yaml
phase: >-
  Slice 2 of 2. Depends on PLAN-ghas-probe-install-restore's BOTH PRs merging first (its code PR and
  its follow-up Decision 83 evidence PR) because both slices edit docs/DECISIONS.md -- though they
  now touch DIFFERENT entries, slice 1 Decision 83 and this slice Decision 62, since arming the
  Decision 83 predicate split out to rec-3979 at round 2. Scoped as ad_hoc_rec, no tier_item
  claimed; this plan closes no rec (followon only).
scope:
  - file: scripts/convergence_health/sensor_liveness_success.py
    action: Create
    purpose: >-
      The success-age leg. Computes each peer's newest `?event=schedule&status=success` run age and
      classifies it against the SAME cron-derived threshold. A SIBLING module, not an inline
      addition: sensor_liveness.py measures 496 SLOC against the unregistered 500 default (exact
      counter: non-blank non-comment lines), so four lines of headroom remain and Decision 128
      makes decomposition the default response, never a budget raise.
  - file: scripts/convergence_health/sensor_liveness.py
    action: Modify
    purpose: >-
      Wire the second leg into detect_stale_loops, delegate identity to sensor_liveness_episodes,
      and widen `_charge`'s sweeps_max cap, which is currently len(peers)+1 and would raise a FALSE
      structural-violation RuntimeError once two classes sweep. Also decide and state the
      _FLEET_LOOP_KEY behaviour for two legs -- a single "__fleet__" literal cannot carry both
      without colliding on the open matcher.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Extend loop_liveness_stale's description and signal_interpretation to cover the success leg.
      Reuses the registered source rather than minting a second one -- same population, same
      carrier, same episode grain, same FILE/UPDATE-ONLY-NEVER-CLOSE posture.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated APPENDED annotation on Decision 62 ONLY, recording that its 2026-06-16 clause ("the
      silent-cron failure mode 62 worried about is mitigated by a persistent-unavailability alarm
      (Decision 74)") named an alarm that does not operate on the primary dev surface, and that the
      operative mitigation is now the derived-peer backstop plus this success leg. The annotation
      also records that the leg's threshold is CRON-DERIVED, so Decision 83's condition (b) prose
      ("more than 14 days") now agrees only by coincidence -- 0 7 * * 1 x 2 = 1209600s -- and would
      silently redefine itself if that cron changed. Decision 83 is NOT edited here: arming its
      predicate is split to rec-3979. Append-only (Decision 177).
  - file: scripts/convergence_health/__main__.py
    action: Modify
    purpose: >-
      Extend `--liveness-probe` to cover the success leg. Without this every success-leg rec is
      stamped with `_probe_acceptance`'s oracle, which routes through stale_peers_for_probe ->
      _assess_peer and measures CADENCE only -- so the rec would pass its own stored acceptance
      while the success leg is still stale. A new finding class whose acceptance cannot discriminate
      it is worse than no rec.
  - file: scripts/convergence_health/sensor_liveness_episodes.py
    action: Create
    purpose: >-
      The named Decision 128 decomposition that funds F2's grain change. Lifts the episode
      identity block -- _episode_title, _parse_episode_title, _is_open_loop_row,
      _filter_resolved_rows, _same_anchor_best_row, _cross_anchor_newest, _episode_context -- out of
      sensor_liveness.py behind the Decision 80/104/124 facade, re-keyed on (loop, leg). This is the
      mechanism the previous draft was missing: it asserted sensor_liveness.py "must NET-SHRINK"
      without naming what moves, which is an outcome, not a decomposition step.
  - file: tests/convergence_health/test_sensor_liveness_episodes.py
    action: Create
    purpose: leg-aware matcher behaviour, including the cross-leg cases F2 names
  - file: tests/convergence_health/test_sensor_liveness_success.py
    action: Create
    purpose: >-
      The success-age classification, including the case this plan exists for: runs firing on
      cadence, every one of them red, cadence leg silent, success leg stale.
  - file: tests/convergence_health/test_sensor_liveness.py
    action: Modify
    purpose: >-
      Prove the two legs compose without regressing the cadence leg, and that the start-anchored
      title grammar (`Loop: {k}. Episode: {a}. Bucket: {n}.`) is preserved so recs_by_title_prefix's
      whole-pattern LIKE bind still matches (Decision 142).
  - file: config/agent/verification_registry/entries/loop-liveness-success-age.yaml
    action: Create
    purpose: graduated shard admitted by VP step 1
bundled_recommendations: []
followon_recs:
  - rec-3092
  - rec-3974
  - rec-3979
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A peer whose scheduled runs fire on cadence but never succeed within its cron-derived threshold
    is classified stale by the success leg, while the existing cadence leg stays silent on it.
  - >-
    The cadence leg's behaviour is unchanged: a peer with no `event=schedule` run at all is still
    classified exactly as before, with the same anchor, bucket and title grammar.
  - >-
    A success-leg rec's stored acceptance command discriminates the success leg: it reports STALE
    while the success leg is stale, rather than passing on the cadence leg's verdict.
  - >-
    Both scripts/convergence_health/sensor_liveness.py and the new sensor_liveness_episodes.py sit
    at or below 500 SLOC with NO config/sloc_budgets.yaml entry added and no raise-approved marker.
  - >-
    Episode identity is keyed on (loop, leg): two legs stale on one peer produce two independently
    resolvable episodes, and neither overwrites the other's title or context on a later tick.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the success-age classification against a stubbed caller, including the
      runs-fire-but-all-red case that motivated this plan and the no-token unobservable case.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness_success.py tests/convergence_health/test_sensor_liveness_episodes.py -q
    expected: >-
      all pass, including the all-red-runs case, the unobservable case, and the leg-aware matcher
      cases (two legs stale on one peer resolve independently and neither overwrites the other)
    expected_literals:
      - "passed"
    fix_if: >-
      A test that stubs the success-age function itself proves nothing -- it must drive the real
      classifier against a stubbed HTTP caller, the injection seam detect_stale_loops already uses.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The success-leg classifier's standing admission rides step 3's pinned-observation shard, which
      asserts the same code path against real measured data rather than hand-built fixtures; a
      second shard over the same guard_target would duplicate that registry entry.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the cadence leg did not regress and the start-anchored title grammar survives.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py -q
    expected: >-
      the cadence-leg suite passes with every BEHAVIOURAL assertion preserved. Two tests change
      in place and must: test_call_budget_caps_equal_len_peers_plus_one (:518) pins
      sweeps_max == len(peers)+1, which the second finding class widens, and
      test_healthy_tick_issues_zero_warehouse_reads (:496) stubs no &status=success URL, so the
      success leg's query would hit the dead-query raise
    expected_literals:
      - "passed"
    fix_if: >-
      A title-prefix test failing means the leg marker was inserted BEFORE the anchored
      `Loop: {k}. Episode: {a}. Bucket: {n}.` prefix; recs_by_title_prefix binds the whole LIKE
      pattern with no implicit wildcard, so the marker must come after it (Decision 142).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This is a regression assertion over an already-graduated suite (the cadence leg landed with
      PLAN-sensor-liveness and carries its own registry shard); re-admitting the same behaviour
      under a second check_id would duplicate an existing registry entry.
  - step: 3
    phase: pre-deploy
    action: >-
      Replay the PINNED live observation from this plan's context as a fixture through the real
      classifier, and prove the success leg reports STALE on it while the cadence leg reports
      fresh. The live window is not re-queried: it self-closes the moment slice 1 restores the
      probe, and this plan's own phase ordering requires slice 1 to merge first.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness_success.py -k pinned_ghas_probe_observation -q
    expected: >-
      the pinned observation classifies success-leg STALE and cadence-leg fresh against the
      cron-derived 1209600s threshold
    expected_literals:
      - "passed"
    fix_if: >-
      If the fixture classifies cadence-leg stale too, the age arithmetic is reading the wrong
      field -- the pinned last RUN is 6954s old (fresh) while the pinned last SUCCESS is 1217716s
      old (stale); that divergence IS the defect this plan closes, so a fixture collapsing them
      proves nothing.
    hermetic: true
    graduation: graduate
    graduation_check_id: loop-liveness-success-age
  - step: 4
    phase: pre-deploy
    action: run the fast presubmit tier as a pre-check before pushing
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      validate_sloc_limits failing on sensor_liveness.py means the leg was added inline rather than
      delegated to the sibling module -- move it, do not raise the budget (Decision 128).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered --pre tier itself; there is no isolated behaviour here to admit
      beyond the tier, whose own checks are already registered.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the FULL validation tier before commit, as
      handoff_policy.full_validation_required_before_commit declares, and confirm the SLOC ceiling
      held.
    command: bin/venv-python -m scripts.validate
    expected: >-
      exit 0 across the full tier, with no config/sloc_budgets.yaml entry added for
      scripts/convergence_health/sensor_liveness.py
    fix_if: >-
      A new sloc_budgets.yaml entry appearing in the diff means the decomposition was abandoned for
      a budget raise; Decision 128 makes that a deliberate, marker-carrying exception, not a
      side effect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered full tier, already the authoritative post-merge verifier -- nothing
      isolated to admit to the verification registry.
  - step: 6
    phase: post-deploy
    action: >-
      Observe the next scheduled convergence-health tick and confirm the success leg ran against the
      live API on its real carrier, not only under test.
    command: "echo 'READ VIA MCP: mcp__github__actions_list(method=\"list_workflow_runs\", owner=\"benjamin-blake\", repo=\"theseus\", resource_id=\"convergence-health.yml\") then mcp__github__get_job_logs for the sensor-liveness step'"
    expected: >-
      the tick concludes success and its log shows the success leg evaluating every derived peer,
      with a per-peer verdict and no unhandled exception
    fix_if: >-
      A raise on a dead query is CORRECT behaviour (Decision 55 fail-loud, no outbox) -- do not
      catch it into a reassuring empty population. A 401/403 means the workflow token lacks
      actions:read; fix the permission, not the classifier.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      confirm the DECISIONS.md edit stayed append-only and that rec-3974's circular deferral was
      actually repaired
    command: |-
      bin/venv-python -m scripts.sync.ops sync && git fetch origin main --quiet && git diff --numstat origin/main -- docs/DECISIONS.md && grep '"rec-3974"' logs/.recommendations-log.jsonl | grep -c 'ci_rca_signals'
    expected: >-
      the numstat deletions field is 0 (Decision 83 untouched, Decision 62 append-only), and
      rec-3974's refreshed context names ci_rca_signals as owned rather than excluded
    fix_if: >-
      A non-zero deletions count means Decision 62's 2026-06-16 clause was spliced rather than
      annotated -- restore it and append a dated correction naming the clause. A zero grep count
      means rec-3974 still excludes the two detectors, leaving them owned by nobody; update it
      through the portal, never by editing the read cache, which is never a write source.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/convergence_health/sensor_liveness_success.py
    behavior: >-
      A peer whose runs fire on cadence but never succeed inside its threshold is classified stale;
      a peer succeeding inside its threshold is not; an unobservable API yields an explicit
      unobservable verdict, never a reassuring fresh.
    verification_step: 1
    test_selector: tests/convergence_health/test_sensor_liveness_success.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/convergence_health/sensor_liveness.py
    behavior: >-
      Both legs compose; the cadence leg's anchors, buckets, fleet collapse and start-anchored title
      grammar are unchanged.
    verification_step: 2
    test_selector: tests/convergence_health/test_sensor_liveness.py
    red_green_expectation: >-
      Green before; updated in place for the widened budget cap and the success-URL stub, with every
      behavioural assertion preserved. The new behaviour's red-before lives in steps 1 and 3.
  - source: scripts/convergence_health/sensor_liveness_episodes.py
    behavior: >-
      Episode identity is keyed on (loop, leg): two legs stale on one peer resolve independently,
      neither overwrites the other's title or context, and the fleet key does not collide.
    verification_step: 1
    test_selector: tests/convergence_health/test_sensor_liveness_episodes.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/convergence_health/__main__.py
    behavior: >-
      --liveness-probe reports the success leg, so a success-leg rec's stored acceptance oracle
      discriminates it rather than passing on the cadence verdict.
    verification_step: 1
    test_selector: tests/convergence_health/test_sensor_liveness_success.py
    red_green_expectation: >-
      Red before: today the oracle routes through _assess_peer and measures cadence only, so a
      success-leg rec would pass its own acceptance while stale. Green after.
  - source: config/agent/data_quality/source_registry.yaml
    behavior: loop_liveness_stale's declared semantics cover both legs
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Registry shape is already owned by the registered check_source_registry check, which fails
      --pre on a malformed or unregistered source. A dedicated test would re-assert an existing
      registered verifier over the same data, the second-surface drift Decision 86 forbids.
  - source: docs/DECISIONS.md
    behavior: the Decision 62 correction is additive; Decision 83 is not edited by this plan
    verification_step: 7
    command: |-
      bin/venv-python -m scripts.sync.ops sync && git fetch origin main --quiet && git diff --numstat origin/main -- docs/DECISIONS.md && grep '"rec-3974"' logs/.recommendations-log.jsonl | grep -c 'ci_rca_signals'
    waiver_reason: >-
      Append-only conformance is asserted mechanically by VP step 7's numstat deletions field rather
      than by a unit test; Decision 178 retired validate_live_entry_immutability, so this diff
      assertion is the operative check and a test over DECISIONS.md prose would assert nothing more.
  - source: config/agent/verification_registry/entries/loop-liveness-success-age.yaml
    behavior: the shard's check_id equals VP step 1's graduation_check_id
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Shard-to-step correspondence is owned by the registered validate_graduation_completeness
      check, which fails --pre on an orphaned shard or an unadmitted graduate step. A dedicated test
      would duplicate that registered verifier.
constraints:
  - >-
    Decision 88 governs NEON CATALOG EGRESS, not the GitHub API -- an earlier draft cited it against
    Actions calls, which was an over-read. GitHub cost here is fine and bounded: the tick goes from
    11 calls to 21, hourly, ~500/day against a 5,000/hour authenticated limit. The REAL Decision 88
    exposure is on the warehouse side and must be named: detect_stale_loops is "lazy and bounded --
    a healthy tick issues zero warehouse reads" only because of its `if not stale: return` early
    exit. Recs are never auto-closed, so once any peer is success-stale every hourly tick pays
    find_recs -- about 24 warehouse reads/day where there were zero. That uses a registered named
    verb, so invariant (ii) holds, but the cost is real and previously unaccounted.
  - >-
    NO second register. derive_scheduled_peers() walks every .github/workflows/*.yml on:.schedule
    block at run time, and PLAN-sensor-liveness.yaml:827 records that its audit rejected a declared
    register as "a fourth register over the same population". The success leg reuses the derived
    peer set and the cron-derived threshold; it introduces no liveness_sla_days field, no new
    source, and no new workflow.
  - >-
    Decision 128 decompose-by-default: sensor_liveness.py is at 496 SLOC against the unregistered
    500 default and ci_rca_signals.py at 497. The leg goes in a sibling module and VP step 5 proves
    no budget entry was added.
  - >-
    Preserve the episode grain exactly: keyed on (loop) alone, FILE/UPDATE ONLY and NEVER
    auto-closed -- restored cadence does not resolve a filed rec, a human does. The leg marker must
    follow the start-anchored `Loop: {k}. Episode: {a}. Bucket: {n}.` title prefix, never precede
    it, or recs_by_title_prefix's whole-pattern LIKE bind stops matching (Decision 142).
  - >-
    Decision 55 fail-loud, no outbox: a dead query raises rather than reporting an empty, reassuring
    population. Do not catch a transport failure into a fresh verdict.
  - >-
    Decision 177 append-only: every baseline line of Decisions 62 and 83 survives verbatim. The
    2026-06-16 clause is corrected BY a dated appended annotation naming it, never by a splice.
    Clause 4 carves out the fenced reversal-conditions stanza interior, which is what makes setting
    `predicate:` there legal.
  - >-
    Decision 101 -- run ids and control-state words only; no tokens, response bodies or account ids.
  - >-
    NOT in scope: adding any workflow to the ci-rca watched set. _VALID_CI_RCA_VALUES is
    ("watched","excluded") and watched is bidirectionally locked to ci-rca.yml's filter, so
    "watched but advisory" is unrepresentable and watching means a Critical queue hard-block. If
    hour-scale detection is ever needed the sanctioned route is a NEW non-blocking value in that
    enum -- a reviewable data-model change owned by T1.13 -- never a flip of the binary field.
  - No rescue agents or workaround loops (Decision 55); no check skipped, disabled or weakened.
