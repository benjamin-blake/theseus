acceptance_criteria:
  - >-
    plan-critique tags every finding blocking or nit beside its origin tag and anchor, a Frame Challenge answer is never
    a nit, REVISE means at least one blocking finding, and measured figures are stated as hypotheses the reviser
    re-measures (rec-3742); the 600KB literal is gone (rec-2775). VP step 1.
  - >-
    planning Step 9: every round a full fresh read with no count cap; a PROCEED listing nits gets the nits applied and
    ONE dispatched fresh confirming round with no card; escalation only on recurrence, a disputed blocking finding or a
    change to approved scope, tier or a cited Decision; an open escalation is a stop and its answer is recorded;
    carriers named for both dispatch modes, including the Fable consult (rec-2802, rec-3515); both revisit conditions
    count gate_rounds (rec-3514); the antidrift test pins all of it (rec-3517). VP step 1.
  - >-
    The Decision Scout gate's convergence rule is finding-shaped, anchored on the BLOCKing decision id, with no count
    cap; "findings, not rounds" appears at least three times (rec-3526). VP step 1.
  - >-
    plan.md Step 9 and overseer-dispatch.yaml restate no round cap and defer to the skill; the alignment-contract sweep
    and menu pins stay green. VP steps 1 and 3.
  - >-
    PlanDocument accepts a gate_rounds list with the GateRound rules in scope, and the template carries it in place of
    the free-text gates line (rec-3041). VP step 2.
  - >-
    validate_plan_documents fails a newly-added v5 plan in CI whose gate_rounds lacks a final plan-critique PROCEED or
    has an unanswered escalation, warns locally, and ignores existing plans. VP step 2.
  - >-
    Neither skill grows: planning <= 43,522 B and plan-critique <= 18,684 B, both under their unchanged budgets;
    plan_document.py <= 500 SLOC. VP step 4.
  - Every bundled rec's own acceptance command exits 0 (VP step 5), and each is closed after merge (VP step 8).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Clause pins on the skill, command and contract surfaces.
    command: >-
      bin/venv-python -m pytest -q
      "tests/test_workflow_skill_antidrift.py::test_critique_gate_convergence_is_finding_shaped"
      "tests/test_workflow_skill_antidrift.py::test_open_escalation_stops_the_loop_and_records_the_answer"
      "tests/test_workflow_skill_antidrift.py::test_decision_scout_convergence_is_finding_shaped"
      "tests/test_workflow_skill_antidrift.py::test_oscillation_revisit_condition_is_countable"
      "tests/test_workflow_skill_antidrift.py::test_contested_residue_consult_names_its_dispatch_carrier"
      "tests/test_workflow_skill_antidrift.py::test_plan_template_records_gate_rounds_not_a_gates_line"
      "tests/test_workflow_skill_antidrift.py::test_plan_command_and_overseer_contract_defer_to_the_skill_rule"
      "tests/test_workflow_skill_antidrift.py::test_critic_tags_every_finding_with_a_stable_anchor"
      "tests/test_workflow_skill_antidrift.py::test_critic_tags_severity_and_states_figures_as_hypotheses"
    expected: exit 0; nine tests pass. On origin/main eight of them fail (all but the stable-anchor pin).
    fix_if: >-
      A pin fails: the surface text differs from execution_steps[1]-[4]; restore the approved text. Never edit a pin to
      match drifted text.
    hermetic: true
    expected_literals: ["9 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Ordinary unit tests that run in every tier through the --pre affected set; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Schema and plan-PR check behaviour, under CI=true so the fail branch is exercised.
    command: >-
      CI=true bin/venv-python -m pytest -q tests/roadmap/plan_document/test_gate_rounds.py
      "tests/checks/roadmap/test_validate_plan_documents.py::TestGateRoundRecord"
    expected: exit 0; every test passes (the dry build ran 22 passed).
    fix_if: >-
      A GateRound rule or the validator differs from scope; fix the code, never the assertion. A count other than 22
      means a parametrization changed: reconcile with the dry-build diff before proceeding.
    hermetic: true
    expected_literals: ["22 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Ordinary unit tests in every tier; the CI=true prefix only selects the fail branch the plan PR exercises.
  - step: 3
    phase: pre-deploy
    action: Whole files of every suite that reads the changed surfaces, under CI=true.
    command: >-
      CI=true bin/venv-python -m pytest -q tests/test_workflow_skill_antidrift.py tests/test_project_alignment_contract.py
      tests/checks/roadmap/test_validate_plan_documents.py tests/roadmap/plan_document tests/test_plan_fork_classification_contract.py
      tests/test_implementation_retrospective_skill_contract.py tests/test_deploy_paths_admin_procedure.py
      tests/ci_rca/test_recovery_policy_surfaces.py tests/checks/prose tests/checks/contracts tests/test_prose_context.py
    expected: exit 0; every test passes.
    fix_if: >-
      A failure names a pinned literal in a changed surface: restore it or justify the change in weakening_dispositions
      first. The alignment sweep failing on "Step 6a" or "Step 6b": reword that surface (labels are retired).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of suites the --pre affected set already selects for these scope files.
  - step: 4
    phase: pre-deploy
    action: Size governance, measured.
    command: >-
      bin/venv-python -c "from pathlib import Path; p=Path('.claude/skills/planning/SKILL.md').stat().st_size;
      c=Path('.claude/skills/plan-critique/SKILL.md').stat().st_size;
      s=sum(1 for l in Path('scripts/roadmap/plan_document.py').read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'));
