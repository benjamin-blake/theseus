schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-severity-convergence"
intent: >-
  Make plan critique converge without operator cards while every round stays a full fresh read and no count caps the
  rounds: the critic tags each finding blocking or nit, a nits-only round is applied and re-read once by a dispatched
  fresh critic, the human is asked only on a recurring finding, a disputed blocking finding or a change to approved
  scope, an open escalation stops the thread, and every gate round is recorded in a typed `gate_rounds` field the
  plan-PR check holds new plans to. Removes operator load and adds measurement (joint review J-01; operator ruling
  2026-10-29 "measure twice, cut once": no critique round is cut).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-severity-convergence.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Workflow
  methodology from the Project Review joint review (area A); closes no roadmap criterion. T4.29 (plan_critic persona)
  is RELATED: its c5 flip inherits this rule unchanged, and gate_rounds stays at round grain (per-finding rows are
  rec-4434's, T4.29 c2).
closes_criteria: []
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Decision Scout convergence rule rewritten finding-shaped (rec-3526, rec-2802); NO_FLAGS bullet's free-text gates
      restatement replaced by a gate_rounds pointer (rec-3041); template gates line replaced by the gate_rounds field;
      Step 9 convergence rule rewritten (severity, nits get ONE dispatched confirming round, escalation triggers, open
      escalation is a stop, countable revisit, consult carrier; rec-3514, rec-3515); Step 10 mirror line. Exact text in
      execution_steps[1]. Measured on the dry build: 43,522 -> 43,518 B (budget 44,097, Decision 127; no raise).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Finding Tags (blocking/nit beside the existing origin tag; Frame Challenge never a nit), Recommendation semantics
      (REVISE iff a blocking finding), step 14 figures-as-hypotheses (rec-3742); funded by four compactions and the
      rotting 600KB literal (rec-2775). Exact text in execution_steps[2]. Measured: 18,684 -> 18,629 B (budget 18,693).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 9 summary sentence re-pointed at the new rule (the round-4 wording goes); keeps the verbatim escalation menu
      and the split gloss that tests/test_project_alignment_contract.py pins. S3, measured only (Decision 127).
  - file: docs/contracts/overseer-dispatch.yaml
    action: Modify
    purpose: >-
      The two trampoline_sequence lines that restate a retired 3-round cap defer to the planning skill's rules, plus
      one amendment_log row (Decision 168 Class D). 492 -> 493 effective lines against the 500 contracts-class limit
      (Decision 166). Never writes the retired label "Step 6a" (tests/test_project_alignment_contract.py sweep).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      GateRound model and optional PlanDocument.gate_rounds: gate enum, verdict per gate, plan-critique REVISE iff
      blocking > 0, escalation_choice only on an escalated row (the five-choice menu), rounds numbered 1..N per gate,
      schema_version >= 5. Planner-reported counts only, never a status or approval input (Decision 87 as amended by
      205). 450 -> 487 SLOC on the dry build (unregistered; 500 limit, Decision 128 -- decompose if it crosses).
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Newly-added schema_version >= 5 plans must carry a gate_rounds record ending in a plan-critique PROCEED with
      every escalated row answered: FAIL when CI == "true" (the plan PR, opened only after PROCEED), WARN in a local
      run (the planner runs --pre between rounds, before the record can be complete). Decision 163 structural
      enforcement. 130 -> 150 SLOC.
  - file: tests/roadmap/plan_document/test_gate_rounds.py
    action: Create
    purpose: Schema obligations for GateRound and gate_rounds.
  - file: tests/checks/roadmap/test_validate_plan_documents.py
    action: Modify
    purpose: >-
      TestGateRoundRecord (CI fail, local warn, answered escalation, existing plans exempt); the two added-plan fixtures
      that assert a clean pass gain a complete gate_rounds record so they hold under CI=true.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Pins every clause above on the skill, command and contract surfaces (rec-3517: the convergence clauses get the
      standing assertions PR #1050 claimed), including the rec-3514 and rec-3515 node names their acceptance runs.
