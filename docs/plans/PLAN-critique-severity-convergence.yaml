  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Rebase onto origin/main first and re-measure both skill sizes; if either surface changed on main since c30b8fff,
    re-anchor each replacement below on the new text without changing the approved wording.
  - |-
    .claude/skills/planning/SKILL.md -- apply exactly:
    (a) Decision Scout Gate, NO_FLAGS bullet: replace the tail ` and "gates: decision-scout=<verdict>; plan-critique=<verdict> after <N> round(s))".` with `; add a `gate_rounds` row per scout round.`
    (b) Replace the two lines `**Convergence rule:**` and `Do not loop more than 3 times. ... How would you like to proceed?"` with the single line:
    **Convergence rule -- findings, not rounds:** re-dispatch after each pivot; escalate at once when a pivot is re-BLOCKed on the same decision id, naming whether the intent contradicts it (re-scope) or it needs revisiting (file a rec). Carrier (AskUserQuestion, chat or GATE_REQUEST) and stop as in Step 9.
    (c) Template: delete the context item `"gates: decision-scout=<verdict>; plan-critique=<verdict> after <N> round(s)" # REQUIRED ITEM (WF-08)` and insert directly above `pre_implementation_checklist:` the two lines:
    gate_rounds: # REQUIRED on new plans; one row per gate round (+gate_run_id if dispatched)
      - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 2, nits: 1} # +escalation_choice if escalated
    (d) Step 9: replace everything from `**Convergence rule -- findings, not rounds:**` up to (not including) `This gate reviews the PLAN artefact` with these three paragraphs, each followed by a blank line:
    **Convergence rule -- findings, not rounds:**

    Every round is a full fresh read and no count caps them. The critic tags each finding blocking or nit (plan-critique's Finding Tags); REVISE means at least one blocking finding. Fix every finding, record one disposition each (fixed, or disputed with evidence -- re-measure a figure before applying it), and run `bin/venv-python -m scripts.validate --pre` before EVERY re-dispatch (a pre-check; Decision 73 makes `--pre` authoritative only via PR CI). REVISE -> re-dispatch. Clean PROCEED -> done. PROCEED listing nits -> apply them and dispatch ONE fresh confirming round, no card; it ends the loop unless it returns a blocking finding (its own nits are applied, not re-read). Write each round to `gate_rounds`.

    **Escalate** only on: a finding recurring at a tag+anchor you recorded fixed (oscillation interrupts, not the count); a disputed blocking finding; or a fix that would change approved scope, tier or a cited Decision. Present, per finding, the finding verbatim with tags and anchor; why it did not converge; your recommendation; and, when re-escalating, a clause that starts a new series naming the predecessor rounds -- plus the five choices: accept-with-deferral / re-scope / split / abandon / one more round. Carrier: AskUserQuestion if held, else chat; dispatched, GATE_REQUEST `open_questions`. An open escalation is a stop: no round, no plan edit, until the human answers; record the answer as the row's `escalation_choice` (accept-with-deferral is human-authored only). Revisit when 20 plans carry `gate_rounds`: did a confirming round ever find a blocking finding, and were findings after round 5 real?

    **Contested-residue consult:** On a disputed blocking finding only, consult `model: "fable"` per the overseer skill's Fable Advice-Consult Protocol (dispatched: request it in the same GATE_REQUEST) -- a third fresh reading of THIS plan against the repo's own Decisions, not industry practice. It recommends a disposition and decides nothing. Revisit after 10 contested escalations; demote if it changed nothing in 8 or more.
    (e) Step 10 item 8: replace `Apply the Step 9 Convergence rule in kind: findings, not rounds -- fix mechanical findings first, escalate at once on a recurring tag+anchor, and run one autonomous confirming round once both agents converge before escalating disputed residue in the pinned shape.` with `Apply the Step 9 Convergence rule in kind: findings, not rounds -- nits get one confirming round, recurrence or dispute escalates in the pinned shape.`
  - |-
    .claude/skills/plan-critique/SKILL.md -- apply exactly:
    (a) Phase 1 step 3: drop ` (ROADMAP-PLATFORM.yaml alone is >600KB)` so the sentence ends `-- do not `Read` the file in full.`
