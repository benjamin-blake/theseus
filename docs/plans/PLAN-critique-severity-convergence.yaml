      && grep -qi 'hypothes' .claude/skills/plan-critique/SKILL.md && grep -qi 're-measure' .claude/skills/plan-critique/SKILL.md
      && grep -q "Contested-residue consult" .claude/skills/planning/SKILL.md
      && bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py::test_contested_residue_consult_names_its_dispatch_carrier -q
      && grep -q "ONE fresh confirming round" tests/test_workflow_skill_antidrift.py
      && bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py::test_critique_gate_convergence_is_finding_shaped -q
      && ! grep -qF 'plan-critique=<verdict> after <N> round(s)' .claude/skills/planning/SKILL.md
      && grep -q 'gate_run_id' .claude/skills/planning/SKILL.md
      && ! grep -q 600KB .claude/skills/plan-critique/SKILL.md && echo bundled-acceptance-ok
    expected: exit 0; prints bundled-acceptance-ok last.
    fix_if: >-
      Name the failing clause's rec and fix the surface; never edit a rec's acceptance to pass (a wrong acceptance is
      re-pointed through update_rec with the reason, Decision 84).
    hermetic: false
    graduation: not-applicable
  - step: 6
