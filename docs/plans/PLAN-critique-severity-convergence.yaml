    expected: exit 0; prints all three as True (dry build 43,518 B, 18,629 B, 487 SLOC).
    fix_if: >-
      A skill grew: compact the same file (never raise the budget; that is a Decision-marked ask). SLOC over 500:
      decompose plan_document.py into a facade package (Decision 128), never register a raise.
    hermetic: true
    expected_literals: ["planning-ok True critique-ok True sloc-ok True"]
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits and validate_sloc_limits enforce the budgets in every tier; this step pins the stricter
      no-growth target the operator set for this plan.
  - step: 5
    phase: pre-deploy
    action: Each bundled rec's own acceptance command, verbatim.
    command: >-
      ! grep -q "40 cap-hitting plans" .claude/skills/planning/SKILL.md
      && bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py::test_oscillation_revisit_condition_is_countable -q
      && ! grep -q 'Do not loop more than 3 times' .claude/skills/planning/SKILL.md
      && test $(grep -c 'findings, not rounds' .claude/skills/planning/SKILL.md) -ge 3
