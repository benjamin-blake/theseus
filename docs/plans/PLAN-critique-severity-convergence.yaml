      scripts/checks/roadmap/validate_plan_documents.py tests/roadmap/plan_document/test_gate_rounds.py
      tests/checks/roadmap/test_validate_plan_documents.py tests/test_workflow_skill_antidrift.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
