    action: Lint and format the Python scope.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap/plan_document.py scripts/checks/roadmap/validate_plan_documents.py
      tests/roadmap/plan_document/test_gate_rounds.py tests/checks/roadmap/test_validate_plan_documents.py
