schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-contract-risk-amendments
intent: >-
  Settle three of the four write-side telemetry contract risks that block slice 2 (rec-4024's writer verb and
  project registration) -- R3 parent existence, R6 project_id stability, R7 exact-ms session_started_at handoff --
  as amendments to the ratified contracts (R8, the parser_version policy, is split to its own plan, rec-4061), so no telemetry row is rejected or stored
  under a wrong id once real data flows. Friction telemetry is the learning signal for recursive self-improvement
  (PROJECT_CONTEXT); ids and rejected rows are the unrecoverable half of it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-contract-risk-amendments.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- contract groundwork for slice 2; closes NO exit criterion (c1 needs
  the tables provisioned by rec-4024). Clears three of the four blocking dependencies rec-4024 carries in the
  warehouse; rec-4061 (R8) remains, planned separately.
scope:
- file: docs/contracts/parent-observation-id.yaml
  action: Modify
  purpose: >-
    R3 (rec-4058). Rewrite write_time_validation: the write boundary NEVER checks that a non-null parent exists
    (Decision 199 tolerates concurrent and out-of-order producers by construction; a child may land before its
    parent); ULID format and value stay generator-guaranteed. Referential integrity moves to a DQ relationships
    check (non-null parent_observation_id with no matching observation_id in the same session) run as a
    non-gating scheduled monitor (Decision 62 as amended) over QUIESCENT trees only, so an in-flight child is not
    a violation; readers tolerate a dangling parent whether transient or permanent (a parent that is never emitted,
    e.g. after a producer crash or an R7 deferral, is a DQ finding, never a read error). That monitor does not exist yet (relationships
    checks SKIP on the DuckLake backend, scripts/data_quality_execute.py:73-79, and carry no session or quiescence
    scoping), so the text names its owner, follow-on rec-4101, which also owns the quiescence window. Update the field governance_notes to match;
    add a field-level amendment_log entry (governance_note_add, semantic_break true, migration_story: no populator
    or table exists). contract_version stays 2.
- file: docs/contracts/project-id.yaml
  action: Modify
  purpose: >-
    R6 (rec-4059). Add to project_id semantics: a registered (tenant_id, project_ref) -> project_id resolution is
    IMMUTABLE: a (tenant_id, project_ref) is never re-bound to a different project_id, 'unregistered'
    auto-registrations included (Decision 200 clause 1 'permanent id'); remapping to a
    canonical project via canonical_project_id on the SCD2 ops_projects dimension is read-side only and never
    changes what the write boundary resolves (Decision 200 clause 3: never by rewriting facts); every producer of
    one trace tree supplies the ROOT session's project_ref (a transcript-less producer receives it alongside
    session_ref), so project_id -- a hash input to every key -- is constant across a tree; stated outright: a
    telemetry row's project_id is its trace tree's ROOT project, so a sub-agent acting in another repository is
    attributed to the root's project. The tree's project_ref is PINNED once, at the ROOT session's first record (the
    same pin point as session_started_at): every row of the tree, the root's own later turns included, carries that
    pinned value, never a per-turn or per-producer re-read of repository configuration; a producer that has not
    received the root's project_ref DEFERS emission (mirroring R7) and never substitutes its own. Field-level
    amendment_log entry (governance_note_add, semantic_break true)
    whose summary cites Decision 199's identity hash (FK equality needs identical project_id inputs) as the reason,
    so the root-project attribution reads as field semantics, not a re-decision of Decision 200 clause 1.
    contract_version stays 2.
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    R7 (rec-4060) on session_started_at semantics: a producer without the root transcript receives
    session_started_at ONLY as an integer epoch-millisecond value or as a held entity/FK key of the tree (e.g. the
    root session_id; NEVER an event_id, whose prefix is its own event_timestamp) decoded with
    src/telemetry/identity.py decode_time_prefix -- never seconds, floats or a
    re-serialised string; an unusable handoff DEFERS emission, never coerces. Scoped to the producer-to-producer
    handoff only: both forms decode to a tz-aware UTC value and the stored column is unchanged (Decision 96 clause
    4). One field-level amendment_log entry on session_started_at (governance_note_add, semantic_break true,
    summary citing Decision 96 clause 4). contract_version stays 1.
- file: docs/contracts/_joins.yaml
  action: Modify
  purpose: >-
    Header COMMENT only (lines 12-14): referential integrity for telemetry is a DQ-relationships concern, not a
    write-time one (R3). YAML comment, so no parsed body change and no Class D amendment_log entry is owed.
- file: tests/telemetry/test_contract_amendments.py
  action: Create
  purpose: >-
    Three MODULE-LEVEL tests whose names are fixed by the recs' acceptance commands:
    test_parent_observation_existence_is_dq_not_write_time, test_project_ref_resolution_is_pinned,
    test_session_started_at_handoff_is_exact_ms (rec-4061's test_parser_version_bump_policy_declared is added to
    this module by the separate R8 plan). Load contracts via
    scripts.contracts load_contract; phrase checks case-insensitive over whitespace-normalised text; each also
    asserts the field-level amendment_log entry exists with governance_note_add + semantic_break true. The R7
    test additionally asserts decode_time_prefix recovers session_started_at exactly from a derived session_id
    (derive_entity_key round trip), and that the contract text excludes event_id as a handoff key; the R6 test
    asserts the root-first-record pin and the deferral; the R3 test asserts the old write-time parent-existence
    requirement is ABSENT from the live write_time_validation text, that the text names rec-4101 as the monitor's
    owner, and that the _joins.yaml header no longer calls
    telemetry referential integrity a write-time concern (raw file text, since it is a comment).
- file: config/agent/verification_registry/entries/telemetry-contract-risk-amendments.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 1 (graduation_check_id telemetry-contract-risk-amendments),
    per validate_graduation_completeness; guard_target is the comma-separated list of the four touched contracts
    (parent-observation-id, project-id, telemetry-event-envelope, _joins), following the
    telemetry-event-journal-contract-shape.yaml precedent.
bundled_recommendations:
- rec-4058
- rec-4059
- rec-4060
followon_recs:
- rec-4101
- rec-4061
infrastructure_dependencies: []
acceptance_criteria:
- >-
  parent-observation-id.yaml no longer contains 'must reference an existing telemetry_observations.observation_id';
  its write_time_validation states the write boundary does not check parent existence and names the DQ
  monitor over quiescent trees with its owner rec-4101.
- >-
  project-id.yaml project_id semantics states a (tenant_id, project_ref) is never re-bound to a different project_id, the
  canonical_project_id remap is read-side only, and every producer of a trace tree supplies the root session's
  project_ref, pinned once at the root session's first record (never re-read per turn), deferring emission when it
  does not hold it.
- >-
  telemetry-event-envelope.yaml session_started_at semantics names integer epoch-milliseconds and a held entity/FK
  key (never an event_id) decoded via decode_time_prefix as the only handoff forms, with deferral on an unusable
  handoff; parser_version, event_id and created_timestamp are untouched (R8 is planned separately).
- Each amended field carries a new amendment_log entry (governance_note_add, semantic_break true); contract_version unchanged on all three contracts.
- >-
  The three bundled rec acceptance commands pass; the existing contract suites
  (tests/checks/contracts/test_telemetry_event_journal_contracts.py, tests/test_contracts.py,
  tests/test_contracts_schema.py) stay green; the category-6 amendment check is clean against origin/main.
- rec-4058, rec-4059 and rec-4060 close via the Resolves trailer on the implementation squash merge; rec-4061 stays open.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new contract-amendment test module (the three bundled rec acceptance tests).
  command: bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py -q
  expected: 'Exit 0, 3 passed. Red before: the module does not exist on the pre-change tree.'
  fix_if: >-
    A failing assertion names the contract field and missing rule -- fix the contract text, not the test, unless
    the test asserts something the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-contract-risk-amendments
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Run each rec's own acceptance command exactly as filed (what the Resolves-trailer closure will run).
  command: >-
    ! grep -q 'must reference an existing telemetry_observations.observation_id' docs/contracts/parent-observation-id.yaml
    && bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py::test_parent_observation_existence_is_dq_not_write_time
    tests/telemetry/test_contract_amendments.py::test_project_ref_resolution_is_pinned tests/telemetry/test_contract_amendments.py::test_session_started_at_handoff_is_exact_ms
    -q && echo ACCEPTANCE_OK
  expected: Exit 0, 3 passed and the success marker printed.
  fix_if: The grep leg fails -> the old write-time sentence survives somewhere in parent-observation-id.yaml; remove it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Duplicates step 1's graduated test module plus a one-off grep for text this plan deletes; the rec acceptance
    runs again at trailer closure.
  expected_literals:
  - ACCEPTANCE_OK
- step: 3
  phase: pre-deploy
  action: >-
    Confirm the existing telemetry contract suite and the contract document model still pass (contract_version
    pins, no stale 'minted once' phrasing, extra=forbid parsing).
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/test_contracts.py
    tests/test_contracts_schema.py tests/telemetry/test_identity.py -q
  expected: Exit 0; no failures.
  fix_if: >-
    A contract_version assertion fails -> the version was bumped; revert to unchanged. A stale-pattern failure ->
    reword the new text (never 'minted once' / 'never re-mints').
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing registered test modules; graduating them again duplicates standing coverage.
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Confirm the category-6 amendment ritual for the three amended contracts against origin/main.
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from
    scripts.contracts_enforcement import check_amendment_for_diff;base=lambda f:yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in ('parent-observation-id','project-id','telemetry-event-envelope')];print(chr(10).join(errs) or 'AMENDMENTS_OK');assert
    not errs"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A category-6 error names a field -- add its field-level amendment_log entry with governance_note_add +
    semantic_break true.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main by construction; the standing equivalent is scripts.validate's contract drift gate.
- step: 5
  phase: pre-deploy
  action: >-
    Stale-reference sweep: no live contract text still requires write-time parent existence or a lossy
    session_started_at handoff.
  command: >-
    ! grep -rn 'must reference an existing\|write-time + DQ-relationships' docs/contracts/ && echo SWEEP_OK
  expected: Exit 0 and the success marker printed.
  fix_if: A hit names a surviving restatement -- reword it (a comment) or amend it (a field) in the same change.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Pins literal phrasing this plan deletes; both halves (parent-observation-id.yaml and the _joins.yaml header
    comment) are also asserted by step 1's graduated R3 test.
  expected_literals:
  - SWEEP_OK
- step: 6
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    Closure: after the squash merge carrying 'Resolves: rec-4058, rec-4059, rec-4060', confirm all three recs read
    closed in the warehouse.
  command: >-
    bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib; r={json.loads(l)['id']:json.loads(l)['status']
    for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()}; bad=[k for k in
    ('rec-4058','rec-4059','rec-4060') if r.get(k)!='closed']; print('open:', bad); raise SystemExit(1 if bad else 0)"
  expected: Exit 0, empty open list.
  fix_if: >-
    The sync's recs pull is unreachable -> read each rec directly via the reader's named verb (ducklake-reads
    rec_by_id per rec) instead of the cache. trailer-closure no-op'd (squash body lacked the trailer) -> Decision
    201 manual update_rec fallback citing the transport failure; an acceptance refusal -> fix the failing
    acceptance, never force-close.
test_obligations:
- source: docs/contracts/parent-observation-id.yaml
  behavior: Write boundary never checks parent existence; integrity is a DQ monitor over quiescent trees owned by rec-4101; amendment_log entry present.
  verification_step: 1
  test_selector: tests/telemetry/test_contract_amendments.py::test_parent_observation_existence_is_dq_not_write_time
  red_green_expectation: red before (module absent, old write-time sentence present), green after
- source: docs/contracts/project-id.yaml
  behavior: >-
    project_ref -> project_id resolution immutable; remap read-side only; root project_ref pinned once at the root
    session's first record for the whole tree (no per-turn re-read); a producer without it defers.
  verification_step: 1
  test_selector: tests/telemetry/test_contract_amendments.py::test_project_ref_resolution_is_pinned
  red_green_expectation: red before, green after
- source: docs/contracts/telemetry-event-envelope.yaml
  behavior: >-
    R7: session_started_at handoff is integer epoch-ms or a decoded entity/FK key, never an event_id
    (decode_time_prefix round trip exact).
  verification_step: 1
  test_selector: tests/telemetry/test_contract_amendments.py::test_session_started_at_handoff_is_exact_ms
  red_green_expectation: red before, green after
- source: docs/contracts/_joins.yaml
  behavior: Header comment no longer calls telemetry referential integrity a write-time concern.
  verification_step: 5
  command: "! grep -rn 'must reference an existing\\|write-time + DQ-relationships' docs/contracts/ && echo SWEEP_OK"
  red_green_expectation: red before (phrase present), green after
- source: config/agent/verification_registry/entries/telemetry-contract-risk-amendments.yaml
  behavior: Registry row for the graduated step-1 check.
  verification_step: 6
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    Generated verification-registry metadata for step 1's graduation; validate_graduation_completeness (full tier)
    is its standing check.
constraints:
- >-
  Contracts, one test module and its registry row ONLY. No code under src/ or scripts/ (src/telemetry is
  Lambda-manifest-packaged; src/common/ducklake_*.py and config/lambda/ducklake/** trigger the governed deploy
  channel), no field_semantics.yaml change (telemetry tables are not in _CONTRACT_TABLE_IDS, so no generated
  drift), no Decision edit, no roadmap edit.
- >-
  Amend within the ratified Decision 199/200 model: no field added or removed, no identity-spec, partition or
  dedupe or parser_version change (R8 is split out), no contract_version bump (precedent: PLAN-telemetry-kernel-identity-append amended the same
  envelope without one; tests pin contract_version == 2 on the Class C contracts).
- >-
  Category 6: every description/semantics diff carries a NEW field-level amendment_log entry; governance_note_add
  pairs with semantic_break true (scripts/contracts_enforcement.py:115-124). New live text never says 'minted
  once' or 'never re-mints' (existing stale-pattern test).
- >-
  R7 wording is scoped to the producer-to-producer handoff; the stored session_started_at stays a tz-aware UTC
  timestamptz (Decision 96 clause 4, unamended).
- Every contract stays within the contracts structural size cap; no budget raise.
- >-
  Amendment summaries PARAPHRASE, never quote, the removed R3 sentence: rec-4058's acceptance grep and VP step 5
  scan the whole file, amendment_log and previous_versions included.
- No rescue agents or workaround loops (Decision 55).
context:
