pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- 'Only the plan-cited decision sections read: 199, 200, 118, 150, 96 (clause 4), 62'
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Create tests/telemetry/test_contract_amendments.py with the three module-level tests (see scope). Run it and
  confirm it FAILS on the unchanged contracts.
- Amend parent-observation-id.yaml (R3) and the _joins.yaml header comment per scope.
- Amend project-id.yaml (R6) per scope.
- Amend telemetry-event-envelope.yaml session_started_at (R7) per scope.
- Write the registry row for graduated step 1.
- >-
  Portal bookkeeping (get_rec_write_guidance first, Decision 66): update_rec rec-4024 (context: slice 2 must NOT
  check parent existence at write time -- rec-4101 owns integrity; project_ref resolution immutable, remap
  read-side only; writer-bound session_started_at must carry millisecond precision, since the pinned RFC 3339
  profile accepts a fraction-less value and would silently decode it to .000; the reader's parser_version rule is
  pending rec-4061's plan) and rec-4026 (context: the first
  producer owes the exact-ms session_started_at and root project_ref handoff rules).
- >-
  Execute Verification Plan steps 1-6 (stage new files first: git add --intent-to-add on every Create row) -- loop
  until pass; never weaken an assertion; on an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): (1) GitHub readiness --
  bin/venv-python -m scripts.session.github_readiness, each state recorded as reported, where unknown is unproven
  and never PASS; (2) parent validator evidence -- VP step 6's completed full-tier exit 0, Validation Summary
  (scope: all) PASS and the matching logs/debug/validation-result.json; (3) structured postflight evidence --
  bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json with the
  scripts.session.postflight_evidence.CATEGORIES keys; (4) the real outcome -- commit, push, PR, CI green on the head
  (event-driven wake, never polled), and the squash merge with commit_message carrying 'Resolves: rec-4058,
  rec-4059, rec-4060' in its own trailer block (rec-4024, rec-4061 and rec-4101 are NOT named), then VP step 7. A
  readiness PASS never stands in for a push or PR outcome.
- 'Report: what was amended, verification results, rec closure state'
