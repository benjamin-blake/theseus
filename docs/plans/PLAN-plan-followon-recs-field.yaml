schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-followon-recs-field"
intent: >-
  Give a deferred plan half a typed record and a filing moment: add PlanDocument.followon_recs
  (rec-id list, token-shape validated) and make /implement Step 7's closure and /plan Step 8 file
  the half as a follow-on-tagged rec whose id is written back into the parent plan, so committed
  work stops vanishing into chat, PR bodies and free-text context -- the handoff-durability half
  of the platform's plan->work loop.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-followon-recs-field.yaml
phase: >-
  No tier_item (soft-warn ad_hoc_rec category): audit remediation for
  audits/planning-decision-burden-735e69fc.yaml finding PDB-01, remedies B1-R5 (schema field) and
  B1-R1 (producer step). T-1.23 (complete) owns follow-on planning at criterion grain only; T4.5
  (deferred_post_mvp) and T4.3 (not_started) are the end-state owners and neither is startable.
scope:
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add followon_recs (list[str], default []) to PlanDocument plus a rec-id token-shape
      validator mirroring _closes_criteria_tokens.
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Modify
    purpose: >-
      Add TestFollowonRecs: default, accept, reject non-rec tokens, loader-level rejection, and
      the pinned asymmetry that bundled_recommendations stays unvalidated.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Step 7 gains the deferred-half filing step (portal command, follow-on tag, parent-plan
      context prefix, write-back into followon_recs) placed before the closure's
      implementation_declared item; Step 9's IMPLEMENTATION report line names the ids filed.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 8 gains the planning-time split clause: file the other half now and list its id in this
      plan's followon_recs.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Add the followon_recs template line; relocate the closes_criteria field-format block to the
      ledger contract, leaving a pointer that covers both linkage fields (net negative bytes).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Receive the relocated referential rule (plan_closes_criteria.write_time_validation) and add
      plan_followon_recs field semantics, the discovery-marker convention, and the per-surface
      coverage declaration naming the owning rec for the residual behavioural arm.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Sanction the /implement Step 7 write-back: add followon_recs to
      sanction_rows.implementing_plan_bookkeeping.permitted_field_edits, with the dated
      amendment_log entry the Class D drift check requires.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      Assert followon_recs is a permitted bookkeeping field edit and that the amendment_log names
      this plan.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Pin the four prose/contract assertions that have no other enforcement counterpart (the Step 7
      filing step and its position, the planning-time clause, the template line + pointer, the
      contract destination).
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    PlanDocument admits followon_recs as list[str] defaulting to [], rejects any entry that is not
    a rec-NNNN token (both via model_validate and via the loader/CLI path), and every existing
    docs/plans/PLAN-*.yaml still validates unchanged.
  - >-
    bundled_recommendations is deliberately left unvalidated, pinned by a test that a legacy prose
    entry still loads (PLAN-t1-11-plan-yaml-migration.yaml carries two).
  - >-
    /implement Step 7 carries the deferred-half filing step -- the literal portal command
    (--guidance first, then --file-rec naming --title, --file, --context, --acceptance, --effort,
    --priority, --risk, --source manual, --tags follow-on) followed by writing the returned id
    back into this plan's followon_recs -- positioned at the head of Step 7 and textually AHEAD of
    its handoff sentence "Apply the appropriate **Commit Flow**" (implement.md:108 at authoring
    time), which is where the implement skill's closure items 3-4 -- the ones that set
    implementation_declared true -- begin. The block OPENS with an applicability guard -- it fires
    "only if this session deferred a half", and if nothing was deferred it is a no-op and closure
    proceeds directly to items 3-4 -- and it says what to do when the portal is unreachable (fail
    loudly per Decision 84 I-4; re-file after restoring connectivity; never skip silently and never
    compose an id client-side). /plan Step 8 carries the planning-time split clause, equally
    conditional ("only if this plan defers a half"), naming followon_recs. In both cases the parent
    plan's followon_recs is the authoritative link, and the rec's follow-on tag plus the "Deferred
    half of PLAN-<parent-slug>" context prefix is the discovery marker only.
  - >-
    The planning skill's template carries the followon_recs line, and its field-format section
    points at docs/contracts/exit-criteria-ledger.yaml instead of restating the referential rule.
  - >-
    exit-criteria-ledger.yaml carries plan_followon_recs (semantics, populated_by, and
    governance_notes declaring per-surface coverage, the discovery marker, and an owning rec id
    for the unenforced behavioural arm) plus plan_closes_criteria.write_time_validation (the
    relocated rule), and still validates against ContractDocument.
  - >-
    implement-scope-boundary.yaml lists followon_recs in
    sanction_rows.implementing_plan_bookkeeping.permitted_field_edits and carries a new dated
    amendment_log entry (semantic_break false, change_class field_add) naming this plan.
  - >-
    .claude/skills/planning/SKILL.md is net-shrunk by this change on its own terms: the 427-byte
    closes_criteria block is removed and everything this plan adds to that surface -- the
    <=336-byte two-field pointer section plus the 64-byte template line, <=400 bytes together --
    is measured against it, so the delta is negative whichever sibling slices have merged first and
    the funding never borrows another slice's freed bytes. The file also ends at or below its
    55716-byte authoring baseline and its 55792 budget, and no budget entry is raised.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Exercise the new schema field and its token validator, including the loader path.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/test_optional_fields.py::TestFollowonRecs -q
    expected: >-
      All TestFollowonRecs tests pass (>=7 collected), covering default [], accepted rec ids,
      rejected prose/whitespace, rejected non-rec token, loader-level rejection via validate_paths,
      and the bundled_recommendations asymmetry.
    fix_if: >-
      A reject case passes validation (validator not wired or regex too loose), or the accept case
      fails (field missing / extra=forbid not updated).
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-document-followon-recs-token-shape
  - step: 2
    phase: pre-deploy
    action: Confirm the additive field breaks no historical plan through the real loader CLI.
    command: bin/venv-python -m scripts.roadmap.plan_document
    expected: >-
      Exit 0 with a PASS line for every docs/plans/PLAN-*.yaml on disk and no FAIL line -- the new
      field defaults on plans that omit it.
    fix_if: >-
      Any FAIL line appears; most likely cause is applying the rec-id validator to
      bundled_recommendations, which one merged schema_version-1 plan populates with prose.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the shipped validate_plan_documents check, which runs this same whole-corpus load
      in both the --pre and full tiers; a second registry row would double-report one defect.
  - step: 3
    phase: pre-deploy
    action: >-
      Exercise the anti-drift pins on the three prose surfaces, the ledger destination, and the
      scope-boundary contract's new permitted field edit.
    command: bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py tests/test_scope_boundary_contract.py -q
    expected: >-
      All tests pass, including the four new anti-drift assertions and the new boundary-contract
      assertion. The implement assertion pins THREE things, not membership alone: the filing block
      is in the Step 7 slice; step7.index("Deferred half (follow-on split)") <
      step7.index("Apply the appropriate **Commit Flow**") (the handoff sentence at which the
      implement skill's closure items 3-4 begin); and the applicability guard is present and
      likewise ahead of it -- "only if this session deferred a half" in step7 with
      step7.index("only if this session deferred a half") < step7.index("Apply the appropriate
      **Commit Flow**"), plus "no-op" in the same block -- so an UNCONDITIONAL rewrite goes red.
      It also pins "follow-on rec ids" inside the Step 9 slice. The plan assertion pins the Step 8
      clause AND its guard token "only if this plan defers a half". The remaining two pin the
      planning template line plus its ledger pointer, and plan_followon_recs /
      plan_closes_criteria.write_time_validation in the contract.
    fix_if: >-
      Any new assertion fails -- the instruction text drifted from the field it documents, the
      relocation left the skill restating a rule the contract now owns, or the write-back was added
      to implement.md without sanctioning it in the boundary contract. A missing guard token means
      the filing step was written unconditionally, which would mint a spurious follow-on rec and put
      a portal write on the pre-declaration critical path every session; restore the guard, never
      delete the assertion.
    hermetic: false
    graduation: graduate
    graduation_check_id: followon-half-filing-step-pinned
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the planning-skill edit is self-funded by measuring THIS plan's own added text against
      the block it removes -- a net-negative delta, not a headroom floor that a sibling's merged
      savings could satisfy.
    command: >-
      bin/venv-python -c "import pathlib,yaml; p='.claude/skills/planning/SKILL.md';
      b=yaml.safe_load(pathlib.Path('config/prose_budgets.yaml').read_text(encoding='utf-8'))['S4'][p];
      t=pathlib.Path(p).read_text(encoding='utf-8'); c=len(pathlib.Path(p).read_bytes());
      hd='### closes_criteria / followon_recs field format'; i=t.index(hd);
      j=t.find(chr(10)+'#', i+len(hd)); sec=len(t[i:j if j>0 else len(t)].encode('utf-8'));
      tl='followon_recs: [] # deferred halves as follow-on rec ids, or []' in t;
      add=sec+64; print('current',c,'budget',b,'pointer',sec,'template',tl,'added',add,'removed',427,'net',add-427);
      raise SystemExit(0 if c<=b and c<=55716 and sec<=336 and tl and add<427 else 1)"
    expected: >-
      Exits 0 with net negative: pointer <= 336 (drafted 323), template True, added <= 400 against
      427 removed, net -27 budgeted and -40 as drafted; current <= 55716 (the authoring baseline)
      and <= budget 55792. The added/removed arithmetic is computed from this plan's own text, so
      it holds identically whether the branch is cut before or after slice A merges.
    fix_if: >-
      net >= 0 or pointer > 336 means the trade-out was not taken or the added text overran its
      budgeted size -- shrink the pointer or complete the relocation. template False means the
      template line was omitted or reworded (VP step 3 pins its presence too). current above 55716
      means the surface grew despite a negative local net, i.e. unrelated bytes rode along in this
      commit. Never raise the budget entry, and never re-baseline this check onto a sibling slice's
      freed bytes -- borrowing that headroom is exactly the shape it exists to refuse.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits already gates current<=budget in both tiers; the added-vs-removed
      arithmetic here is this plan's one-off funding proof against its own diff, not a standing
      regression guard -- as a registry row it would pin a specific heading's byte size forever and
      fail every later legitimate re-wording of that surface.
  - step: 5
    phase: pre-deploy
    action: Confirm the relocation is lossless -- the skill points, the contract carries, nothing dangles.
    command: >-
      bin/venv-python -c "import pathlib,yaml,sys;
      s=pathlib.Path('.claude/skills/planning/SKILL.md').read_text(encoding='utf-8');
      d=yaml.safe_load(pathlib.Path('docs/contracts/exit-criteria-ledger.yaml').read_text(encoding='utf-8'));
      w=d['fields']['plan_closes_criteria'].get('write_time_validation') or '';
      ok='docs/contracts/exit-criteria-ledger.yaml' in s and 'check (iii) in validate_platform_roadmap' not in s
      and 'check (iii) in validate_platform_roadmap' in w and 'plan_followon_recs' in d['fields'];
      print('relocation_ok', ok); sys.exit(0 if ok else 1)"
    expected: relocation_ok True, exit 0.
    fix_if: >-
      False means the rule was deleted rather than relocated (not in the contract), or duplicated
      (still in the skill) -- a pointer whose destination does not carry the content is the failure
      this step exists to catch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The durable half of this assertion is graduated by step 3's selector; the absence clause
      ("no longer in the skill") is transitional to this relocation and would misfire the moment a
      later plan legitimately re-words that section.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the contract still validates against ContractDocument and that the new field's
      coverage declaration names an owning rec for its unenforced behavioural arm.
    command: >-
      bin/venv-python -c "import pathlib,re,yaml; from scripts.contracts_schema import ContractDocument;
      doc=ContractDocument.model_validate(yaml.safe_load(pathlib.Path('docs/contracts/exit-criteria-ledger.yaml').read_text(encoding='utf-8')));
      f=doc.fields['plan_followon_recs']; g=f.governance_notes or '';
      assert f.type=='list[str]' and f.semantics and f.populated_by and g;
      assert 'follow-on' in g and re.search(r'rec-\d+', g); print('contract schema ok')"
    expected: prints "contract schema ok", exit 0.
    fix_if: >-
      A Pydantic error names an unknown FieldSpec key (extra=forbid) or a missing required shape --
      correct the key names against scripts/contracts_schema.py FieldSpec, never by loosening it.
      A missing rec-NNNN means execution step 3's owning rec was never filed or its id never landed
      in governance_notes -- file it through the portal, do not delete the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift already schema-validates every docs/contracts/*.yaml in both tiers;
      graduating a second whole-file schema gate would duplicate that check's own coverage, and the
      rec-id clause is this plan's one-off Decision 181 coverage proof, not a standing guard.
  - step: 7
    phase: pre-deploy
    action: Confirm the schema module stays inside the 500-SLOC ceiling (decompose, never raise).
    command: >-
      bin/venv-python -c "import pathlib,sys; p='scripts/roadmap/plan_document.py';
      n=len([l for l in pathlib.Path(p).read_text(encoding='utf-8').splitlines() if l.strip() and not
      l.strip().startswith('#')]); print(p, n, 'SLOC'); sys.exit(0 if n<=500 else 1)"
    expected: prints roughly 367 SLOC (354 at authoring time plus the field, constant and validator), exit 0.
    fix_if: >-
      Above 500 -- decompose into a facade package (Decision 80/104/124 pattern); do not register a
      budget entry and do not run --update-sloc-budgets (Decision 128).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_sloc_limits enforces the same whole-repo ceiling in both tiers; this step is the
      plan-local early warning, and a per-file registry row would shadow that check.
  - step: 8
    phase: pre-deploy
    action: >-
      Full-tier validation before handoff, as handoff_policy.full_validation_required_before_commit
      declares (Decision 163); executed exactly once at /implement Step 7 closure item 4, after
      implementation_declared is true and every tracked write has landed.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, Validation Summary (scope: all) PASS."
    fix_if: >-
      A full-tier-only failure is in scope to fix on the branch; never skip a test, lower a floor or
      relax a check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, so not-applicable would be the classification-gaming
      shape plan-critique 12o catches -- but graduating it is impractical (PLAN-check-mirror-2a
      precedent): the registry row would invoke scripts.validate from inside the registry that
      scripts.validate itself runs, and its evidence artefact logs/debug/validation-result.json
      (scope all) is this session's transient state.
test_obligations:
  - source: scripts/roadmap/plan_document.py
    behavior: >-
      followon_recs exists, defaults to [], and rejects any entry that is not a rec-NNNN token --
      through both model_validate and the loader/CLI path.
    verification_step: 1
    test_selector: tests/roadmap/plan_document/test_optional_fields.py::TestFollowonRecs
    red_green_expectation: >-
      red before (unknown field under extra=forbid, and the reject cases pass validation), green
      after.
  - source: .claude/commands/implement.md
    behavior: >-
      Step 7 instructs the implementer to file a deferred half as a follow-on-tagged rec through
      the portal and write the returned id into the plan's followon_recs -- CONDITIONALLY: the block
      opens with the guard "only if this session deferred a half" and declares itself a no-op
      otherwise. The block and its guard both sit at the head of Step 7, textually ahead of the
      "Apply the appropriate **Commit Flow**" handoff sentence -- where the implement skill's
      closure items 3-4 set implementation_declared true -- and not at Step 8; Step 9's
      IMPLEMENTATION report bullet names any "follow-on rec ids" filed.
    verification_step: 3
    test_selector: tests/test_workflow_skill_antidrift.py::test_implement_step7_files_the_deferred_half_and_writes_followon_recs
    red_green_expectation: >-
      red before (Step 7 has no filing step, no guard token and no Step 9 report mention), green
      after. An unconditional rewrite that drops the guard token is also red -- that is the
      assertion's purpose, not a side effect.
  - source: .claude/commands/plan.md
    behavior: >-
      Step 8 instructs a planning-time split -- conditionally, guarded by "only if this plan defers
      a half" -- to file the other half and record its id in followon_recs.
    verification_step: 3
    test_selector: tests/test_workflow_skill_antidrift.py::test_plan_step8_names_the_planning_time_split_filing
    red_green_expectation: >-
      red before (no split clause at Step 8), green after; an unguarded clause is red on the guard
      token.
  - source: .claude/skills/planning/SKILL.md
    behavior: >-
      The plan template carries the followon_recs line and the field-format section points at the
      ledger contract rather than restating the referential rule.
    verification_step: 3
    test_selector: tests/test_workflow_skill_antidrift.py::test_planning_template_carries_followon_recs_and_points_at_the_ledger_contract
    red_green_expectation: red before (no template line; rule still inline), green after.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      The contract carries plan_followon_recs with the discovery-marker convention, and
      plan_closes_criteria.write_time_validation carries the relocated referential rule.
    verification_step: 3
    test_selector: tests/test_workflow_skill_antidrift.py::test_exit_criteria_ledger_carries_both_plan_linkage_fields
    red_green_expectation: red before (neither key exists), green after.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: >-
      followon_recs is a permitted implementing_plan_bookkeeping field edit, and the amendment_log
      carries a dated entry naming this plan.
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py::TestContractShape::test_bookkeeping_row_permits_the_followon_recs_write_back
    red_green_expectation: >-
      red before (followon_recs absent from permitted_field_edits and no amendment_log entry names
      this plan), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55); an unrecoverable VP failure stops and RCAs.
  - >-
    Single Portal Invariant (Decision 84): every filing instruction added here routes through
    scripts.ops_data_portal; rec ids are writer-allocated, never composed client-side, and
    --guidance runs before --file-rec (Decision 66 Precision Context Injection).
  - >-
    extra=forbid on PlanDocument is respected by ADDING the field to the model, never by loosening
    the config; the validator checks token shape only -- existence of the rec is not checkable at
    --pre time (the rec cache is gitignored).
  - >-
    Prose budgets ratchet down only: the planning-skill addition is funded by the same-plan
    relocation, and no config/prose_budgets.yaml or config/sloc_budgets.yaml entry is raised.
  - >-
    Decision 86 routing: field semantics land in the owning contract; no new standing prose doc,
    and the skill keeps a pointer whose destination actually receives the content.
  - >-
    Public-repo boundary (Decision 101) -- no account ids, ARNs, credentials or internal hostnames
    in any added instruction text or example command.
