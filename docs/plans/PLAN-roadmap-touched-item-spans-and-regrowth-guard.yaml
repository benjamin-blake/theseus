slug: roadmap-touched-item-spans-and-regrowth-guard
intent: 'Replace validate_platform_roadmap''s newline-spanning touched-item regex with a pure span-based attribution over the roadmap''s tier_items line spans, driven by a checked-in fixture built from the last 40 real roadmap commits, and add the Decision 147 anti-regrowth observable rec-2781 asks for. Both surfacings are ADVISORY: the presubmit exit code is identical with and without them on every input, because a span-based FAILING arm would have blocked 14 of those 40 commits on bare-string criteria the repo has not paid down -- a counterfactual verification step 2 COMPUTES from the fixture''s stored post-image bare-string set rather than one this plan asserts in prose. The measured attribution defect is large -- the regex names 12 tier_items across the 40 commits where the spans say 118, misses 107, and falsely names one.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-touched-item-spans-and-regrowth-guard.yaml
phase: Platform verification-system hardening -- the roadmap criteria-integrity guard's attribution half plus Decision 147's anti-regrowth observable. Ad hoc, soft-warn category ad_hoc_rec; no tier_item is claimed and no roadmap exit criterion is closed, so this plan declares no closes_criteria and edits docs/ROADMAP-PLATFORM.yaml not at all.
scope:
- file: scripts/checks/roadmap/_roadmap_spans.py
  action: Create
  purpose: 'Non-registered pure helper: ItemSpan/ChangedLines, item_spans(text, block_key) scoped to one top-level block, whose per-entry spans end at each entry''s LAST CONTENT LINE (_content_end trims the trailing blank and comment-only lines that separate one entry from the next, so the roadmap''s inter-entry tier section-header comments belong to NO entry and an edit to one attributes to nothing -- the same class of false attribution as the legacy defects this module replaces, measured at a702e43 on the three live section headers), changed_lines(diff_text) over unified-diff hunks, touched_item_ids(pre_spans, post_spans, changed), the attribute(pre_text, post_text, diff_text) wrapper, and legacy_regex_item_ids(diff_text) -- the frozen pre-rec-2781 detector retained ONLY as criterion (ii)''s unchanged failing-arm input and as the oracle the superset property is measured against. No git, no filesystem, no subprocess, so the checked-in fixture drives the same functions the live check drives. Separate module so the helper and both checks each stay far under 500 SLOC (Decision 128 decompose-by-default), following the scripts/checks/<domain>/_helper.py precedent (hygiene/_declaring_coverage.py, iam_tf/_read_coverage.py).'
- file: scripts/checks/roadmap/validate_platform_roadmap.py
  action: Modify
  purpose: 'Three changes, none of which alters an exit code. (a) criterion (ii)''s inline re.findall is replaced by _roadmap_spans.legacy_regex_item_ids, the same pattern behind a named, tested symbol -- the failing arm''s input set stays byte-identical. (b) a new report-only helper prints the span attribution beside it, reading the origin/main image through the EXISTING scripts/checks/_marker_guard.default_base_reader seam (git show origin/main:<path>, cwd _common.ROOT, encoding utf-8, None on an unreachable ref -- the missing-base contract this advisory needs) rather than writing a second git show seam, which Decision 104 sole-home discipline forbids: how many tier_items each names, the ids the legacy detector missed, and the ids it named that no span touched. (c) Decision 170 arm (d): one terminal registry.examined(len(doc.tier_items), unit=tier_items) covering the module''s single reachable success exit, which is what lets its roster line go.'
- file: scripts/checks/roadmap/check_roadmap_regrowth.py
  action: Create
  purpose: 'The registered, report-only rec-2781 guard, signature check_roadmap_regrowth(failed: list[str], roadmap_path: Path | None = None) -- the named injection seam step 7 drives, defaulting to _common.ROOT / docs / ROADMAP-PLATFORM.yaml and adding no exit that escapes the declared routing step 8 measures as undeclared 0 (step 8 asserts undeclared 0 with is_fully_declared true, never a fixed exit triple, so the enumerated exception handlers below may raise the reachable-exit count without breaking it). Prints roadmap growth against the Decision 147 compaction baseline (lines, baseline, growth, headroom to the Decision 114 ceiling, plus the named trip threshold as escalate true/false -- true once headroom falls below 500 lines, printed unconditionally and never failing) and the terminal-content prose that has re-accumulated under Decision 147 points 1 and 2 -- ratified/superseded candidate_decisions carrying more than the one compact line point 1 retains, and complete/reserved tier_items carrying progress_note/note/decomposition_hints, multi-line intent or a non-empty files_in_scope. Never appends to failed, never writes the roadmap, and NEVER RAISES: scripts/checks/validation_result.py dispatch_recording runs a check inside registry.outcome_scope with NO try/except, so any exception escaping the guard aborts the whole tier run and destroys that run''s CI-RCA attribution substrate. It declares terminally on BOTH reachable exits -- MEASURED 2 success exits / 2 declared / 0 undeclared, superseding this plan''s earlier 3-exit prediction -- examined(n, unit=terminal_records) on the normal exit, and ONE skipped(reason) exit that EVERY unusable-input shape routes to with failed left untouched: OSError (an absent or unreadable roadmap), UnicodeDecodeError (undecodable bytes), yaml.YAMLError (malformed YAML -- a LIVE fast-tier input, since the Entry''s pre_globs gate this guard on docs/ROADMAP-* and validate_platform_roadmap already carries its own except _yaml.YAMLError arm for the same document), a non-mapping document, a non-list tier_items or candidate_decisions, and a tier_items or candidate_decisions list whose ENTRIES are not mappings (a null entry, the shape a stray dash line produces, or a scalar entry). That last shape is enumerated deliberately: it is a list, so a non-list guard passes it through, and the guard then reaches raw_item.get() on an int, a str or None and raises AttributeError -- the incumbent validate_platform_roadmap is not exposed to it because it reaches its raw-item loop only after a successful Pydantic load, whereas this guard does its own bare yaml.safe_load with no schema. A SECOND, disjoint hazard is closed the same way and is deliberately NOT enumerated as a further exception class: a mapping entry whose status/state VALUE is itself a YAML list or mapping passes every shape gate above and then makes a bare raw_item.get(''status'') in {complete, reserved} membership test raise TypeError on the unhashable value, which escapes dispatch_recording exactly as any other raise would. Both fields are therefore read through _state_of, a by-name string guard: a non-string value is neither terminal nor non-terminal, is counted on the printed MALFORMED-STATE line (zero on the live document) and reaches no membership test at all. What the guard is total over is EVERY SHAPE ITS MIRROR TEST''S MATRIX DRIVES -- TestUnavailableRoadmapSkips for the skipped(reason) class and TestNonStringStateIsCountedNotRaised for the by-name-guard class -- not an exhaustive list frozen in prose. Only named exception classes are caught and there is no bare except anywhere in the module, exactly as the validate_declaring_coverage precedent routes its own strictly larger unavailable-input set to one skipped exit. That declaration is an ADMISSION REQUIREMENT, not a nicety: validate_check_accounting arm (a) fails any registered check that declares nothing and is absent from config/check_accounting_baseline.yaml, and arm (b) admits no roster name outside the frozen _BASELINE_SEED, which this check is not in -- report-only status is no exemption, and scripts/checks/hygiene/validate_declaring_coverage.py (REPORT-ONLY-absolute, 2 / 2 / 0) is the precedent followed literally.'
- file: scripts/checks/roadmap/_manifest.py
  action: Modify
  purpose: 'One Entry literal for check_roadmap_regrowth (bare string module=/attr=, pre=True with pre_globs covering its whole transitive first-party import closure plus its roadmap input, full_segment full_after_lint). validate_platform_roadmap''s own Entry gains TWO pre_globs lines, not one -- scripts/checks/_marker_guard.py, which its new default_base_reader import puts in its first-party closure, AND scripts/decisions_md.py, which _marker_guard imports transitively for its load_decision_bodies helper (its existing scripts/checks/roadmap/** glob already covers the new _roadmap_spans import). The count is MEASURED, not predicted: validate_pre_glob_closure reports 1 uncovered closure path for this Entry at the base (scripts/checks/__init__.py, the spine file the manifest docstring says is deliberately never globbed and that every sibling Entry carries), 2 with only _marker_guard.py added, and 1 again -- parity with the base -- with both lines present; check_roadmap_regrowth''s own Entry likewise shows only scripts/checks/__init__.py. The row''s own pre_globs-cover-the-whole-transitive-closure obligation authorises the second line, no verification step counts the lines, and a wider glob only makes MORE PRs run the check, never fewer. Without them validate_pre_glob_closure -- advisory at wave 4a, blocking at 4c -- prints this module as an uncovered import and a PR editing only _marker_guard would silently skip the check in the fast tier.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: One function_to_category row assigning check_roadmap_regrowth to schema_drift, the category its three roadmap-document siblings (validate_platform_roadmap, validate_candidate_decision_ratification, validate_tier_floor) already carry. Without it validate_ci_rca_taxonomy's registry-totality assertion fails.
- file: config/check_accounting_baseline.yaml
  action: Modify
  purpose: 'Delete exactly one entry line, validate_platform_roadmap. Arm (d) (touch-it-fix-it) obliges only the DECLARATION -- validate_check_accounting is measured green with the declaration in and the roster line still present -- so the DELETION''s mechanical obligation is tests/checks/hygiene/test_validate_check_accounting.py''s TestRosterCarriesNoFullyDeclaringModule, driven both ways: roster line retained FAILS naming validate_platform_roadmap 1/1/0 and telling the reader to strike it, roster line struck passes. That is why this row''s test_obligation names that module rather than a roadmap mirror. Shrink-only, so a deletion is always admissible; the frozen _BASELINE_SEED constant is NOT edited, and no other roster name moves.'
- file: tests/fixtures/roadmap_touched_items.py
  action: Create
  purpose: 'Fixture generator and loader (a tests/fixtures helper, never a test module). Generates the JSON below from real git history -- the id-index of every tier_items entry per image, the changed-line runs per side, the expected span attribution, and the legacy detector''s raw and true-positive sets. It also computes, per commit, bare_string_criteria_ids -- the POST-image tier_item ids still holding a bare-string exit criterion, which is exactly the shape criterion (ii)''s failing arm rejects on a touched item, so step 2 can COMPUTE the advisory-framing counterfactual instead of quoting it from this plan. Exposes load_fixture(), whose rows carry commit, pre_spans, post_spans, changed, expected, legacy_raw (the detector''s unfiltered matches), legacy_true_positives and bare_string_criteria, reconstructing ItemSpan lists from the id-index so the tests and the generator share one encoding; and known_false_attributions(), returning the curated (commit, item_id, mechanism) triples step 4 asserts the residue against. HYGIENE, stated because two invariants depend on it: the git-shelling generator is reachable ONLY through an explicit entry point (a main()/argparse guard), NOTHING executes at import and no exception is raised at import time (AGENTS.md), so importing this module inside step 12''s depth-truncated clone shells nothing; and every git call passes encoding=utf-8, errors=replace with text=True or validate_subprocess_encoding reddens the tier.'
- file: tests/fixtures/roadmap_touched_items.json
  action: Create
  purpose: 'The checked-in fixture: 40 commits, 38 pooled per-image id-indexes, 168,331 bytes over 88 lines (MEASURED after generation, superseding the prototype''s 104 KB estimate; the one-record-per-line dumps() shape is why the line count is small and the byte count is not). Materialized ONCE from the real commits so no test ever reads live git history -- main-validate checks out at fetch-depth 2, where the 40 parents are unreachable. Its header names the exact generation command. It also carries one CURATED top-level block, known_legacy_false_attributions -- the (commit, item_id, mechanism) triples for every legacy-named real tier_item that no span touches (one today: 6f15d11 / T2.42 / the added blank line the pattern spanned into the context id line below it) -- which step 4 compares the computed residue against and which a regeneration never silently rewrites. ENCODING BINDING, stated because two surfaces read one datum under different names and a slip would otherwise break step 2 or step 3 with no single field to fix: the top-level keys are commits and known_legacy_false_attributions; each commits row carries commit, expected_touched, legacy_regex_raw, legacy_regex_true_positives and bare_string_criteria_ids beside its two pooled id-index references and its per-side changed-line runs; and load_fixture() exposes those same five as the row attributes commit, expected, legacy_raw, legacy_true_positives and bare_string_criteria, with the id-index references rehydrated into pre_spans and post_spans (ItemSpan lists) and the runs into changed. Step 2 reads the JSON keys directly; steps 3 and 4 read the loader attributes. tests/fixtures/* is governed:false in config/structural_size_budgets.yaml, so no size budget or raise is involved.'
- file: tests/checks/roadmap/test__roadmap_spans.py
  action: Create
  purpose: Mirror test for the pure helper -- the fixture-driven 40-commit equality and superset properties, plus synthetic pins for the block scoping (a nested exit_criteria id and a candidate_decisions id are never tier_item ids), the span end rule (adjacent spans meet only when nothing separates them; an inter-entry section-header comment or blank line attributes to nothing while a body edit beside it still attributes), context lines not counting as changed lines, the advisory-framing counterfactual computed from the fixture's bare-string field, and the two measured legacy defects reproduced as named cases.
- file: tests/checks/roadmap/test_check_roadmap_regrowth.py
  action: Create
  purpose: Mirror test for the guard -- report-only over an over-ceiling synthetic roadmap, the terminal-state selectors, the one-compact-line allowance Decision 147 point 1 retains, the skipped(reason) routing for an unreadable and a non-mapping roadmap, the TestNonStringStateIsCountedNotRaised matrix (status/state as a YAML list, a mapping, null or a number -- selected by nothing, counted on the MALFORMED-STATE line, and raising nothing where an unguarded membership test raises TypeError), and the derive-and-assert that the baseline constant equals the 7,329 figure Decision 147's own entry in docs/DECISIONS.md states.
- file: tests/checks/roadmap/test_validate_platform_roadmap.py
  action: Modify
  purpose: Two new classes only, no existing case touched -- TestAccountingDeclaration (the run declares examined over tier_items on the success path and the module measures fully declared) and TestSpanAttributionAdvisory (the advisory lines are printed, name the span-missed ids, and leave failed empty; the origin/main-unreachable arm prints its own skip line).
- file: config/agent/verification_registry/entries/roadmap-span-attribution-matches-fixture.yaml
  action: Create
  purpose: Graduated shard for verification step 3 (command_exit_zero) -- the fixture's 40 stored attributions all reproduce through the pure detector.
- file: config/agent/verification_registry/entries/roadmap-regrowth-growth-line-report-only.yaml
  action: Create
  purpose: 'Graduated shard for verification step 6 (command_output_matches, use_regex true) -- the guard emits its growth line in the declared grammar, including the escalate trip field, and leaves failed empty. Constructed so the REVERT tree fails it (Decision 132): the command imports check_roadmap_regrowth, which does not exist at origin/main, so the differential is a real FAIL rather than a tautological admission.'
- file: config/agent/verification_registry/entries/roadmap-platform-check-fully-declared.yaml
  action: Create
  purpose: 'Graduated shard for verification step 8 (command_exit_zero) -- validate_platform_roadmap declares on every reachable success exit and is absent from the grandfather roster and from the frozen _BASELINE_SEED. Its check_spec.command is authored INDEPENDENTLY of step 8''s and MUST NOT copy step 8''s base-relative roster-diff leg (the assertion that origin/main''s roster minus the current one is exactly the struck name): that leg INVERTS on merge, because origin/main then carries the shrunk roster, so a shard copying it installs a standing registry row that fails forever on main. validate_graduation_completeness binds plan_slug and check_id only, never command equality, so the narrower standing command is a legitimate graduation.'
