constraints:
- A clause may appear in permanent source (module docstring, comment, constant) ONLY if a named verification_plan step would FAIL were it false. The two measured legacy defects are made load-bearing by the fixture cases step 10 runs; the compaction-baseline constant by the DECISIONS.md derive-and-assert node in the same step; the report-only claim by steps 6 and 7; and the pre-image half of touched_item_ids (a deleted item is attributed from its pre-image span) by the named TestDeletedItemAttributedFromPreImage case step 10 asserts and runs, because the 40-commit population moves on only 1 of 40 under a post-image-only mutant and would not fail were the clause false.
- Cite symbols, never line numbers, in every docstring, comment and plan field.
- 'ADVISORY IS ABSOLUTE. Neither new surfacing appends to failed on any input, neither writes docs/ROADMAP-PLATFORM.yaml, and the presubmit exit code is identical with and without them -- which requires that NEITHER EVER RAISES, because validation_result.dispatch_recording wraps a check body in registry.outcome_scope with no try/except and an escaping exception would abort the tier and change that exit. Every unusable-input shape (OSError, UnicodeDecodeError, yaml.YAMLError, a non-mapping document, a non-list tier_items or candidate_decisions, and a tier_items or candidate_decisions list whose ENTRIES are not mappings (a null entry, the shape a stray dash line produces, or a scalar entry -- either of which makes an unguarded raw_item.get() raise AttributeError, a shape the incumbent validate_platform_roadmap is NOT exposed to because it reaches its raw-item loop only after a successful Pydantic load, while this guard does its own bare yaml.safe_load with no schema)) routes to one declared skipped(reason) exit; and the SECOND, DISJOINT raise class -- a mapping entry whose status/state VALUE is unhashable (a YAML list or mapping) or otherwise not a string -- is read through a by-name string guard so no set-membership test can raise TypeError, reaching the normal examined() exit counted on a printed MALFORMED-STATE line. What the guard is total over is EVERY SHAPE ITS MIRROR-TEST MATRIX DRIVES, not a list of shapes frozen in this constraint. Pinned by step 7, which drives an over-ceiling roadmap, all eight unusable shapes and both non-string-state shapes through the guard. Criterion (ii) keeps the legacy attribution as its failing-arm input verbatim; the growth line''s escalate field is an OBSERVABLE, not a gate: it reads true below 500 lines of headroom and still appends nothing (Decision 163 point 1 -- an explicitly optional check is sanctioned, an unstated intent to gate is not). Flipping the gate to the span attribution is DEFERRED for a measured reason (it would have blocked 14 of the 40 fixture commits on the 88 tier_items that still carry bare-string criteria) and is carried as a follow-on rec filed at implement time, not done here.'
- No hermetic step's expected text may contain a backtick literal -- validate_vp_replay extracts every backtick-delimited substring from expected and asserts it against replayed stdout. Re-check after every plan revision.
- Every diff-inspecting step uses the working-tree-aware seam scripts.checks._common.get_status_aware_diff (never get_changed_files, which existence-filters deletions away) because implement runs on an UNCOMMITTED tree.
- The touched set equals the declared scope in BOTH directions, asserted by step 13; an undeclared touched path STOPS for a human-directed plan amendment and is never resolved by appending to this plan's own scope (Decision 59, docs/contracts/implement-scope-boundary.yaml).
- No test may read live git history. main-validate checks out at fetch-depth 2, where the 40 fixture parents do not exist; the evidence is materialized ONCE into tests/fixtures/roadmap_touched_items.json whose header names its generation command, and step 12 proves the property inside a depth-truncated clone. The DETECTOR may call git -- it runs inside the presubmit against origin/main as today -- but its span logic is a pure function over pre_text, post_text and hunks that the fixture drives directly.
- 'Every file in scope, tests and the fixture-consuming module included, stays under 500 SLOC. A crossing in a scripts/ file is resolved by decomposing into a further sibling helper module with its own mirror test; a crossing in a TEST module is resolved by lifting shared synthetic-source construction into tests/fixtures/ (a second test module for one source would break the Decision 131 one-mirror convention map_source_to_test implements). Never by a budget raise, a raise-approved marker, a complexity waiver or a baseline registration (Decision 128, Decision 165). Decision 130 is the authority for scanning the tests half: iter_gated_py_files walks every hand-authored directory, its one-time 24-file tests/ grandfather is explicitly not a precedent for future test growth, and tests/fixtures/roadmap_touched_items.py plus the three test modules are gated at 500 with no roster path. Asserted by step 15.'
- 'Decision 181 non-weakening, proved over a superset of the set the LIVE check consumes (both-image membership, where the live filter is post-image only) rather than over a pre-intersected fixture field: every legacy-named real tier_item that the span attribution does not contain is an ENUMERATED, mechanism-named false positive stored in the fixture (one today, T2.42 at 6f15d11), asserted by step 4. A plain superset over the fixture''s legacy_regex_true_positives field would be a tautology -- that field is itself the legacy set intersected with the span expectation, so it can only fail where step 3 already has. No check, assertion, tolerance, budget, test or plan field is weakened to obtain green, no fixture expectation is ever edited to match a detector, and the curated false-positive block is never silently rewritten by a regeneration to whatever residue the run happened to produce.'
- 'Decision 170 arm (a): the NEW registered check must declare examined()/skipped() on every reachable exit on introduction -- it is in neither config/check_accounting_baseline.yaml nor the frozen _BASELINE_SEED, arm (b) forbids adding it to either, and report-only status is not an exemption (scripts/checks/hygiene/validate_declaring_coverage.py is the precedent). Arm (d): editing validate_platform_roadmap''s module obliges adopting the declaration on every reachable success exit (measure_check undeclared 0) and deleting its config/check_accounting_baseline.yaml line in the same diff, with the roster-truth test staying green. Asserted by steps 8 and 10. The frozen _BASELINE_SEED constant is not edited and no other roster name moves.'
