  action: 'Fixture hermeticity at the depth main-validate actually runs at, proven not promised: run all three mirror test modules inside a depth-truncated clone where the 40 fixture parents are unreachable, mirroring main-validate''s fetch-depth 2 checkout. A test that reaches for one of those parents dies there. WHAT THIS STEP DOES NOT PROVE, stated so its sentinel is not over-read: a depth-2 clone still retains two commits, so this is evidence that no test reaches the FIXTURE PARENTS, not that no test reads git history at all. The stronger property -- nothing on the load path shells out under any circumstances -- is owned by TestFixtureLoadIsHermetic in tests/checks/roadmap/test__roadmap_spans.py, which runs load_fixture() with subprocess.run patched to RAISE. The clone keeps origin/main''s copy of every file this step does not overwrite, so the copy list must carry every COMPANION the three modules read, not only the modules themselves: the whole tests/fixtures directory (a list naming two files by name would miss any shared synthetic-source helper step 15''s SLOC remedy lifts there, producing a collection error), config/ci_rca_taxonomy.yaml (whose base copy carries no check_roadmap_regrowth row, so the taxonomy lookup the test_obligation for that file declares would raise KeyError against the base file) and config/check_accounting_baseline.yaml (whose base copy still carries the struck validate_platform_roadmap line).'
  command: T=$(mktemp -d); if ! git clone --quiet --depth 2 --no-local "file://$PWD" "$T/repo"; then rm -rf "$T"; echo SHALLOW_CLONE_FAILED; exit 1; fi; cp -r tests/checks/roadmap/. "$T/repo/tests/checks/roadmap/"; cp -r tests/fixtures/. "$T/repo/tests/fixtures/"; cp config/ci_rca_taxonomy.yaml config/check_accounting_baseline.yaml "$T/repo/config/"; cp scripts/checks/roadmap/_roadmap_spans.py scripts/checks/roadmap/check_roadmap_regrowth.py scripts/checks/roadmap/validate_platform_roadmap.py scripts/checks/roadmap/_manifest.py "$T/repo/scripts/checks/roadmap/"; ln -s "$PWD/.venv" "$T/repo/.venv" 2>/dev/null || true; echo TRUNCATED_DEPTH=$(git -C "$T/repo" rev-list --count HEAD); ( cd "$T/repo" && bin/venv-python -m pytest tests/checks/roadmap/test__roadmap_spans.py tests/checks/roadmap/test_check_roadmap_regrowth.py tests/checks/roadmap/test_validate_platform_roadmap.py -q -p no:cacheprovider --randomly-seed=12345 ); rc=$?; rm -rf "$T"; if [ $rc -ne 0 ]; then echo TRUNCATED_HISTORY_RUN_FAILED_rc_$rc; exit 1; fi; echo NO_TEST_REACHES_THE_FIXTURE_PARENTS
  expected: A TRUNCATED_DEPTH line reporting a small commit count, a pytest summary in which every collected test passes, then NO_TEST_REACHES_THE_FIXTURE_PARENTS, exit 0. The sentinel names exactly what a depth-2 clone can witness; TestFixtureLoadIsHermetic carries the stronger shells-nothing property.
  fix_if: 'DISTINGUISH THE TWO FAILURE CLASSES BEFORE ACTING. (1) A ModuleNotFoundError, an ImportError, a pytest collection error, a KeyError on a config row, or a FileNotFoundError naming a path this step never copied is a MISSING-COMPANION-FILE fault in this step''s own copy list -- the clone retains origin/main''s version of every uncopied file -- so add the companion path to the copy list and re-run; it is not hermeticity evidence and never justifies deleting the test. (2) A failure naming a bad object, an unknown revision, or a non-zero git exit means a test reached for live history -- move the datum into the checked-in fixture and regenerate it with the command in the fixture header. SHALLOW_CLONE_FAILED names a scratch-environment fault, not a test defect. If the failing case is a PRE-EXISTING sibling in test_validate_platform_roadmap.py rather than one of this plan''s own, it is out-of-scope hermeticity debt: file it through scripts/ops_data_portal.py as a recommendation, do NOT fix it inline, and STOP for a human-directed decision (Decision 59, docs/contracts/implement-scope-boundary.yaml). Never narrow this step''s module selection to make it pass -- the third module is here precisely because its two new classes drive the git seams this step exists to test.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The step builds a throwaway shallow clone of the working repository, which is session-transient state a registry primitive cannot reproduce. The standing form of the same property is TestFixtureLoadIsHermetic in tests/checks/roadmap/test__roadmap_spans.py, which AST-scans the pure helper for any subprocess or git import, runs load_fixture() with subprocess.run patched to RAISE (so a shell on the load path fails loudly rather than returning non-zero), and imports the generator module under the same patch to prove nothing executes at import.
