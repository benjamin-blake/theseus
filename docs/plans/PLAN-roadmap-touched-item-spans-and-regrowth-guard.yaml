acceptance_criteria:
- 'scripts/checks/roadmap/_roadmap_spans.py exists and its span attribution reproduces, for all 40 fixture commits, exactly the item set whose YAML spans contain a changed line. What is ACCEPTED is that exact per-commit reproduction (step 3) together with a strictly lossy legacy detector carrying a non-zero false-attribution cell (step 2), never a fixed set of integers, because the counts move with any fixture regeneration -- the same framing steps 2 and 4 already use. Measured evidence at a702e43: 118 span attributions where the legacy detector names 12, with 107 missed and 1 falsely named.'
- Every legacy-named tier_item that the span attribution does not contain is a PROVEN false positive, enumerated by name with its mechanism in the fixture -- measured over the set the live check actually consumes (the legacy detector's raw matches filtered to real tier_item ids across both images -- a deliberate superset of the live filter, which tests membership against the POST-image tier_items only, so the enumerated residue can only be larger than the live one, never smaller), which is exactly one case today, T2.42 at 6f15d11. Nothing else the old detector caught is lost (Decision 181).
- validate_platform_roadmap prints the span attribution beside the legacy one and appends to failed exactly what it appended before -- criterion (ii)'s failing-arm input is the same legacy set, now behind a named tested symbol.
- 'check_roadmap_regrowth is registered, report-only, and prints roadmap growth since the Decision 147 compaction baseline -- with the named trip threshold as an escalate field that reads true below 500 lines of headroom -- plus the terminal-content prose re-accumulated under Decision 147 points 1 and 2; its failed list is empty for every input -- an over-ceiling roadmap where escalate reads true, and every shape its mirror test''s matrix drives. Two disjoint classes: the UNUSABLE-INPUT shapes (absent or unreadable, undecodable bytes, malformed YAML, a non-mapping document, a non-list tier_items or candidate_decisions, and a tier_items or candidate_decisions list whose ENTRIES are not mappings -- a null entry from a stray dash line, or a scalar entry, the shapes that make an unguarded raw_item.get() raise AttributeError), each routing to one declared skipped(reason) exit; and the NON-STRING STATE shapes (a mapping entry whose status/state is a YAML list, a mapping, null or a number -- the shapes that make an unguarded set-membership test raise TypeError on an unhashable value), each read through the by-name string guard, selected by neither terminal branch, counted on the MALFORMED-STATE line and reaching the normal examined() exit. Neither class escapes as an exception that would abort the tier. It declares examined()/skipped() on every reachable exit (measure_check undeclared=0), which Decision 170 arm (a) requires of it because the frozen _BASELINE_SEED offers no grandfather path, and it is added to neither config/check_accounting_baseline.yaml nor that seed.'
- validate_platform_roadmap declares examined()/skipped() on every reachable success exit (measure_check undeclared=0), its config/check_accounting_baseline.yaml line is deleted, and the roster-truth test stays green.
- 'No test reads live git history: the 40-commit evidence is a checked-in fixture, and the new tests pass inside a depth-truncated clone.'
- docs/ROADMAP-PLATFORM.yaml is byte-identical to origin/main and no tier status, criterion wording or item body is edited by this plan.
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE. At the untouched base the two new check-side modules and the fixture are absent, validate_platform_roadmap is on the grandfather roster, and the path-aware metric reports its single success exit UNDECLARED -- so every AFTER step below is a real differential.
  command: bin/venv-python -c "import subprocess, yaml; from scripts.checks import registry; from scripts.checks.hygiene._declaring_coverage import measure_source; absent=[p for p in ('scripts/checks/roadmap/_roadmap_spans.py','scripts/checks/roadmap/check_roadmap_regrowth.py','tests/fixtures/roadmap_touched_items.json') if subprocess.run(['git','show','origin/main:'+p], capture_output=True, text=True, encoding='utf-8').returncode == 0]; print('BASE_PRESENT', absent); assert absent == [], absent; base=subprocess.run(['git','show','origin/main:config/check_accounting_baseline.yaml'], capture_output=True, text=True, encoding='utf-8').stdout; assert 'validate_platform_roadmap' in yaml.safe_load(base)['entries']; src=subprocess.run(['git','show','origin/main:scripts/checks/roadmap/validate_platform_roadmap.py'], capture_output=True, text=True, encoding='utf-8').stdout; row=measure_source(src, 'validate_platform_roadmap'); print('BASE_COVERAGE', row.success_exits, row.declared, row.undeclared); assert row.undeclared == 1 and row.declared == 0; print('BASE_STATE_CONFIRMED')"
  expected: BASE_PRESENT with an empty list, a BASE_COVERAGE line reading 1 0 1, then BASE_STATE_CONFIRMED, exit 0.
  fix_if: A non-empty BASE_PRESENT list means the base already carries one of these paths and this plan is a duplicate -- re-scope. A BASE_COVERAGE line already reading undeclared 0 means the declaration landed elsewhere first; drop the accounting half and keep the attribution half.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Every assertion inverts by construction the moment this PR merges (origin/main then carries the modules, the declaration and the shrunk roster), so it can never stand as a regression guard -- its whole value is the pre-merge differential the graduated steps are admitted against.
- step: 2
  phase: pre-deploy
  action: 'BEFORE, quantified, in two halves. (a) Drive the checked-in fixture''s 40 real commits through the frozen legacy detector and print the confusion against the stored span expectations -- the measured defect this plan repairs. (b) Compute the ADVISORY-FRAMING COUNTERFACTUAL from the fixture''s stored post-image bare-string set: the commits a span-driven criterion (ii) FAILING arm would have blocked, against the same count for the legacy detector. Half (b) is the load-bearing justification for shipping both surfacings advisory, so it is computed by this step rather than carried in the plan''s prose.'
  command: bin/venv-python -c "import json; from pathlib import Path; d=json.loads(Path('tests/fixtures/roadmap_touched_items.json').read_text(encoding='utf-8')); rows=d['commits']; span=sum(len(r['expected_touched']) for r in rows); tier=sum(len(r['legacy_regex_true_positives']) for r in rows); missed=sum(len(set(r['expected_touched']) - set(r['legacy_regex_raw'])) for r in rows); false=sum(len(set(r['legacy_regex_raw']) & {i for rec in rows for i in rec['expected_touched']} - set(r['expected_touched'])) for r in rows); agree=sum(1 for r in rows if set(r['expected_touched']) == set(r['legacy_regex_true_positives'])); print('CONFUSION commits=', len(rows), 'span=', span, 'legacy_true=', tier, 'missed=', missed, 'false=', false, 'agree=', agree); assert len(rows) == 40; assert missed > 0 and span > tier and false > 0; span_blocked=sum(1 for r in rows if set(r['expected_touched']) & set(r['bare_string_criteria_ids'])); legacy_blocked=sum(1 for r in rows if set(r['legacy_regex_raw']) & set(r['bare_string_criteria_ids'])); print('COUNTERFACTUAL span_blocked=', span_blocked, 'legacy_blocked=', legacy_blocked, 'head_bare=', len(rows[0]['bare_string_criteria_ids'])); assert legacy_blocked == 0 and span_blocked > 0; print('LEGACY_DETECTOR_IS_LOSSY_AND_THE_SPAN_ARM_WOULD_HAVE_BLOCKED')"
  expected: 'A CONFUSION line reading commits= 40 span= 118 legacy_true= 11 missed= 107 false= 1 agree= 6, then a COUNTERFACTUAL line reading span_blocked= 14 legacy_blocked= 0 head_bare= 88, then LEGACY_DETECTOR_IS_LOSSY_AND_THE_SPAN_ARM_WOULD_HAVE_BLOCKED, exit 0. The 14 and the 0 are the design fork made measurable: what is asserted is that the legacy arm blocks NOTHING and the span arm blocks SOMETHING, which is the whole case for landing advisory; head_bare is the same 88-of-166 finish line step 23 requires the follow-on rec to carry, read off the newest fixture commit. The integers are evidence about today''s fixture; what is asserted is the 40-commit population, the strict loss, and a NON-ZERO false-attribution count -- the confusion cell the design fork and step 4''s enumerated residue both turn on, which is why it is printed rather than computed and discarded.'
  fix_if: 'A zero span_blocked count would mean the bare-string paydown has landed and criterion (ii) can consume the span attribution directly -- that is the follow-on gate-flip rec becoming actionable, not a failure to patch here; STOP and re-scope rather than deleting the assertion. A zero missed count means the fixture was regenerated against a different base or the legacy sets were recomputed with the new detector -- regenerate with the command named in the fixture header and re-read. A zero false count means the same thing from the other side: the false cell is the one step 4 enumerates by name, so regenerate rather than relax it.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: This measures the detector this plan retires; the standing property worth guarding is the span detector's own correctness, graduated as step 3, not a permanent record of how bad its predecessor was.
- step: 3
  phase: pre-deploy
  action: AFTER, the core property. Every one of the fixture's 40 stored expectations reproduces exactly through the pure span detector, driven from the stored id-indexes and changed-line runs -- no git, no roadmap read.
  command: bin/venv-python -c "from tests.fixtures.roadmap_touched_items import load_fixture; from scripts.checks.roadmap._roadmap_spans import touched_item_ids; rows=load_fixture(); bad=[(r.commit, sorted(touched_item_ids(r.pre_spans, r.post_spans, r.changed)), r.expected) for r in rows if sorted(touched_item_ids(r.pre_spans, r.post_spans, r.changed)) != r.expected]; print('FIXTURE commits=', len(rows), 'mismatches=', len(bad), bad[:3]); assert len(rows) == 40 and not bad; print('SPAN_MATCHES_ALL_40')"
  expected: A FIXTURE line reading commits= 40 mismatches= 0 and an empty list, then SPAN_MATCHES_ALL_40, exit 0.
  fix_if: A mismatch names the commit and both sets. Fix the detector, never the stored expectation -- an expectation edited to match a detector proves nothing (Decision 181).
  hermetic: true
  graduation: graduate
  graduation_check_id: roadmap-span-attribution-matches-fixture
- step: 4
  phase: pre-deploy
  action: 'Decision 181 non-weakening, proved over the set the LIVE check consumes rather than over a pre-intersected fixture field: on every fixture commit the legacy detector''s raw matches filtered to real tier_item ids across BOTH images -- a deliberate SUPERSET of the live membership filter, which iterates the CURRENT file''s tier_items and tests raw_item.get(''id'') in touched_ids, i.e. post-image ids only, so the residue this step must enumerate can only be larger than the live one, never smaller; in practice the two coincide, because a pre-only id names a deleted item whose pre-image span always contains changed lines and is therefore already in the span set, contributing no residue -- are contained in the span attribution EXCEPT for the enumerated, mechanism-named false positives the fixture stores by name, one today (T2.42 at 6f15d11). Written this way the assertion can fail independently of step 3; a plain superset over legacy_regex_true_positives could not, because that field is the legacy set already intersected with the span expectation.'
  command: 'bin/venv-python -c "from tests.fixtures.roadmap_touched_items import known_false_attributions, load_fixture; from scripts.checks.roadmap._roadmap_spans import touched_item_ids; rows=load_fixture(); trip=known_false_attributions(); named={(c, i) for c, i, _m in trip}; ids=lambda r: {s.item_id for s in r.pre_spans} | {s.item_id for s in r.post_spans}; consumed=lambda r: set(r.legacy_raw) & ids(r); span=lambda r: touched_item_ids(r.pre_spans, r.post_spans, r.changed); residue={(r.commit, i) for r in rows for i in (consumed(r) - span(r))}; total=sum(len(consumed(r)) for r in rows); print(''LEGACY_CONSUMED'', total, ''RESIDUE'', sorted(residue), ''NAMED'', sorted(named)); assert total > 0 and named and all(m.strip() for _c, _i, m in trip); assert residue == named, sorted(residue ^ named); print(''EVERY_CONSUMED_LEGACY_NAME_OUTSIDE_THE_SPANS_IS_ENUMERATED'')"'
  expected: A LEGACY_CONSUMED line reading 12 followed by a RESIDUE list and a NAMED list that are equal and non-empty -- one pair today, commit 6f15d11 and tier_item T2.42, whose stored mechanism records the added blank line the legacy pattern spanned into the context id line below it -- then EVERY_CONSUMED_LEGACY_NAME_OUTSIDE_THE_SPANS_IS_ENUMERATED, exit 0. What is asserted is that the residue equals the curated set, that the curated set is non-empty and every entry carries a mechanism, and that the consumed total is non-zero; the integers are evidence about today's fixture.
