    purpose: >-
      The recorded calibration series (193 pr-validate budget blocks 2026-09-14..28, per-run pytest
      session totals and reactive/escalation flags, 106 selections as indices into `modules`, the
      three out-of-window incident selections, per-rec dispositions, the planning module-cost
