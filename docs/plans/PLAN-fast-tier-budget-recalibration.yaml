    action: Delete
    purpose: >-
      Planning evidence committed with this plan because its sources are perishable
      (selection-manifest artifacts retain 14 days; the earliest of the 196 expired on
      2026-09-28). Moved, never edited, by `git mv` to the fixture path below -- one surface, no copy.
