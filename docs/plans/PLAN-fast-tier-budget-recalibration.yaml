      exempt test_fixtures class. Read-only input to the calibration tests; its `_schema` key is the
      field-semantics home. A one-shot committed snapshot, not a recurring cross-run query (the
      recurring registration is follow-on rec-4126, Decision 135 reversal (c)).
  - file: scripts/checks/deps/module_cost_table.py
    action: Create
    purpose: >-
      Owner of the module-cost table's format, stdlib only (validate.py imports selection_budget,
      which imports this; module scope must stay yaml/networkx-free, the --terraform-only path).
      (1) generate(junit_paths) -> dict: per test module, the SUM of junit testcase `time` grouped
      by the testcase `file` attribute (xunit1; a testcase lacking `file` is a loud error naming
      the junit_family requirement, never a classname guess). (2) CLI `python -m
      scripts.checks.deps.module_cost_table --junit X.xml [--junit ...] --write PATH`: writes JSON
      with sort_keys and indent=1 whose first key is `_banner` carrying the literal "GENERATED --
      DO NOT EDIT" and the exact regeneration command (Decision 166 provenance override, within the
      first 10 lines), plus `generated_on`, `source` and `modules` {path: worker-seconds rounded to
      3dp}. (3) read_at_base_ref(root) -> CostTableRead(status, costs, default_cost): resolves `git
      merge-base HEAD origin/main` (Decision 187 point 1 and its c5 merge-base clause), tests path
      existence with `git ls-tree <merge-base> -- <path>` and reads with `git show`; status "ok";
      "absent" ONLY when the merge-base resolves and ls-tree reports no such path (the installing
      PR); "unreadable" on every other failure -- merge-base or git error, invalid JSON, missing
      `modules` -- never raising (Decision 55). default_cost = the 90th percentile of the table's
      costs (statistics.quantiles n=10, method inclusive): the likeliest unknown module is the PR's
      own new test. (4) selection_cost(selected, read, root, *, require_on_disk=True) -> float:
      dedupes, and with require_on_disk counts only paths that exist under root (the census-clamp
      analogue: a corrupted or inflated selector cannot price phantom modules); an unknown path
      costs default_cost ONLY when its basename is test_*.py -- conftest.py, tests/fixtures/* and
      every other non-test path in a selection cost 0.0, since they never appear in junit (pricing
      them at p90 inflated the cost sum ~8% on the binding run and understated k_min; Fable consult
      2026-09-28). Well under 500 SLOC. Its git calls in tests run with -c commit.gpgsign=false and
      a fixed identity (the tests/hooks/test_handoff_evidence_gate.py _GIT_ENV precedent -- this
      container signs commits globally).
  - file: tests/checks/deps/test_module_cost_table.py
    action: Create
    purpose: >-
      Decision 131 mirror; full-tier 100% per-file coverage of module_cost_table.py from this file
      alone. Covers: generate() sums per `file` and fails loudly without it; CLI output's first
      key is the banner and the file round-trips; read_at_base_ref's three statuses on a tmp git
      repo (table committed at the merge-base -> ok; path absent at a resolvable merge-base ->
      absent; no origin/main ref, and invalid JSON at base -> unreadable), including a PR whose
      WORKING-TREE table differs from base (the base copy wins, so a PR cannot inflate its own
      allowance); default_cost is the p90; selection_cost dedupes, prices unknowns at the default,
      and with require_on_disk ignores a phantom path. No imports from other test modules.
