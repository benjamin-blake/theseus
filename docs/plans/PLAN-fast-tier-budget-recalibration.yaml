constraints:
  - Implement only after PLAN-fast-tier-ulid-parity's implementation PR has merged (rec-4077 closed); merge origin/main first.
  - The unwaivable non-test arm, the branch order and CEILING_SECONDS (1500) are unchanged; the new term only subtracts a capped, predicate-gated amount and adds no outcome.
  - Never weaken an assertion to obtain green (Decision 181) -- literal fixtures are re-pinned to derived expressions that still breach; no run is dropped from the calibration series; rounding in the calibration tests is never widened. The 240 -> 270 move is this Decision's authorized re-derivation (Decision 182 reversal (a)), routed through rec-4093.
  - Preserve every node id a graduated registry record names (TestAllowance, TestClassifyBranchOrder, TestBudgetVerdict::test_hard_fail_reflects_exit_code, TestNonTestHalfBudget, TestBreadthDerivedTestBudget, TestLocalPrediction, TestBudgetBlockCarriesTheSplit, TestNewOutcomesFileNoRec, TestBudgetBreachCiTelemetry, TestBudgetAssertion::test_breach_rec_receives_a_real_dominant_phase and the census-clamp nodes) and test_execution_allowance's signature, so no existing registry record needs re-authoring; the replay-allowance mirror record stays true (270 > 120 + 71.766).
