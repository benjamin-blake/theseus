schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: fast-tier-budget-recalibration
intent: >-
  Re-derive Decision 182's fast-tier budget contract from the recorded CI population instead of its
  three calibration runs, now that reversal conditions (a) and (c) have fired: the test half is
  budgeted from per-module MEASURED cost (the same function gates CI and predicts at plan time), the
  pre-commit tool-pin escalation becomes its own governed term instead of inflating the unwaivable
  non-test half, and NON_TEST_BUDGET_SECONDS is re-derived to dominate the corrected measured worst.
  One new numbered Decision amends 182; the ~28 symptom recs of the old contract are dispositioned
  with per-rec evidence. The gate stops failing healthy PRs for composition or runner noise and
  keeps a composition-aware runaway bound; slow-test drift detection moves per-module to the
  post-merge table diff (rec-4125).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-fast-tier-budget-recalibration.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped
  and no closes_criteria is declared). Bundles rec-4093, rec-3929 and rec-3677. Slice 2 of 2: MUST
  NOT be implemented until docs/plans/PLAN-fast-tier-ulid-parity.yaml's implementation PR (rec-4077)
  has merged -- this plan's own PR selects two runtime-ulid test modules and its symptom sweep cites
  that fix.
scope:
