      full local unit-suite run with -o junit_family=xunit1), never hand-edited. config/agent/ is
      the agent/CI zone, never Lambda-bundled (config/CLAUDE.md).
  - file: scripts/checks/deps/selection_budget.py
    action: Modify
    purpose: >-
      (a) Constants: NON_TEST_BUDGET_SECONDS 240.0 -> 270.0; new PRECOMMIT_ESCALATION_ALLOWANCE_SECONDS
      = 120.0 and PRECOMMIT_PHASE_NAME = "precommit_changed"; new NOISE_MARGIN = the maximum
      same-commit primary-session spread (max/min) over fixture groups keyed (branch, selection,
      date) with >= 2 attempts and a minimum primary session >= 60s -- the CI-runner noise property,
      invariant to the table's scale, hence its own named constant (1.449 at planning, 12 groups);
      new RECORDED_K_MIN = the zero-false-positive fit k_min (1.043 at planning, non-test paths
      costing 0); new COST_COEFFICIENT = ceil10(RECORDED_K_MIN x NOISE_MARGIN) (1.6 at planning;
      Benjamin 2026-09-28 after a second Fable consult -- a hard duration gate on shared runners is
      never set at the noise floor, and this repo records a green re-run as NONDETERMINISTIC, so
      the margin, not re-runs, must absorb runner noise), PREPASS_FIXED_SECONDS = 1.6 and
      PREPASS_PER_MODULE_SECONDS = 0.041 (the measured collect-only prepass + session overhead, OLS
      1.56 + 0.0406 n over 55 single-invocation runs); TEST_BASE_SECONDS 180.0 and CEILING_SECONDS
      1500.0 unchanged; PER_MODULE_SECONDS 2.0 KEPT as the legacy fallback rate;
      FLOOR_TOTAL_SECONDS stays the expression NON_TEST + TEST_BASE (450.0). The test cap becomes
      the DERIVED expression CEILING_SECONDS - NON_TEST_BUDGET_SECONDS -
      PRECOMMIT_ESCALATION_ALLOWANCE_SECONDS (1110.0), in both allowance paths, so the worst-case
      asserted total across all three governed terms is exactly CEILING_SECONDS. (b)
      test_execution_allowance(n_selected, census=None) keeps its signature and legacy formula (the
      graduated census-clamp mutant probe patches it) with only the cap expression changed; new
      cost_based_allowance(cost_s, n_selected, census=None) = min(max(TEST_BASE_SECONDS,
      COST_COEFFICIENT x cost_s + PREPASS_FIXED_SECONDS + PREPASS_PER_MODULE_SECONDS x
      min(n_selected, census)), cap). (c) New escalation_carve_out(phase_times, *,
      precommit_escalated) -> float = min(phase_times.get(PRECOMMIT_PHASE_NAME, 0.0),
      PRECOMMIT_ESCALATION_ALLOWANCE_SECONDS) when escalated, else 0.0 -- excess above the
      allowance stays in the unwaivable half, so no new outcome exists and
      budget_ingest.INGESTED_OUTCOMES is unaffected. (d) classify() gains keyword cost_s: float |
      None = None -- when given, the allowance is cost_based_allowance; when None, the legacy
      test_execution_allowance; derivation_ok False still collapses to TEST_BASE_SECONDS; branch
      order unchanged. (e) budget_extra_keys gains precommit_escalated, escalation_s, cost_s,
      cost_table_status and cost_ratio ((test_s - overhead) / cost_s, null off the cost path);
      validate.py prints ONE advisory line when cost_ratio exceeds RECORDED_K_MIN (the recorded
      envelope) -- rec-free by construction, never an outcome, never in INGESTED_OUTCOMES, branch
      order untouched; the recorded ratio is the series the next coefficient derivation reads. (f) Prediction uses the SAME function as the gate: predict_test_half and
      predict_ci_elapsed take keyword cost_s -- (PREDICT_COST_RATIO_LOW x cost_s + overhead,
      COST_COEFFICIENT x cost_s + overhead) with PREDICT_COST_RATIO_LOW the median of (single_s -
      overhead) / cost over ALL 98 test-green runs (the population k_min is drawn from, not the 14-run
      single_s > TEST_BASE subset its max binds on; 0.37 at planning with non-test paths at 0) -- and fall back to the legacy floor+slopes when cost_s is None;
      _PREDICT_NON_TEST_LOW/HIGH re-derive to the recorded green governed non-test median/max
      (56.4 / 158.0 at planning). _report() reads the table via the module attribute module_cost_table.read_at_base_ref (lazy
      module import, never `from ... import read_at_base_ref`, so every seam pin binds),
      prints its status, and prints whether the scope touches a pre-commit global input (lazy
      import of scripts.checks._scaffolding.precommit_escalates). (g) Module docstring restated for
      the three-term contract, and the declare-or-split reading restated truthfully: because the
      predictor's high end IS the gate's allowance function, a plan-time `breach` is reachable only
      when the allowance is clamped at the 1110s cap or collapsed to TEST_BASE_SECONDS by a
      derivation fallback (derivation_ok False) -- otherwise breadth is declared, never split;
      a CI breach now signals drift (tests slower than their measured cost), which no plan-time
      scope change predicts. PRECOMMIT_ESCALATION_ALLOWANCE_SECONDS
      is derived as ceil10(recorded escalated precommit_changed max 108.618) + 10s headroom for the
      tracked-file growth detect-secrets scans = 120.0 -- a different quantity from
      REPLAY_ALLOWANCE_SECONDS (also 120.0, by coincidence). MUST stay <= 500 SLOC (282 at
      planning); overflow moves to module_cost_table.py, never a budget raise (Decision 128).
