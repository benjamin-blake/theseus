acceptance_criteria:
  - The test half is budgeted by cost_based_allowance over a module-cost table read at the merge-base; the installing PR (absent) uses the legacy 2.0 x n rule and an unreadable base fails closed to 180s; a PR cannot raise its own allowance by editing the table (VP steps 3, 6).
  - COST_COEFFICIENT == ceil10(RECORDED_K_MIN x NOISE_MARGIN) exactly, with NOISE_MARGIN the recorded same-commit max spread and COST_COEFFICIENT >= k_min as a floor; these, the prepass term and the predictor constants are each pinned to the committed calibration series by a test that fails if the table or the series moves without a re-derivation; the implement-time margin actually obtained on the binding run is recorded (VP steps 2, 4).
  - The governed non-test half subtracts min(precommit_changed, 120) only when the pre-commit phase actually escalated (run_precommit_checks' returned decision); excess re-enters the unwaivable half; NON_TEST_BUDGET_SECONDS is 270, the ceil-10 of the corrected joint worst 261.8, and the cap is CEILING - NON_TEST - ESCALATION = 1110 (VP steps 1, 5, 7).
  - The plan-time predictor uses the gate's own cost function and ranks rec-3677's pair correctly where the legacy predictor ranks it backwards (VP step 3).
  - One new Decision amends 182 only, within 6,144 bytes, with its waiver row and a fresh index (VP steps 10, 12).
  - rec-4093, rec-3929 and rec-3677 close through the squash-merge Resolves trailer; the symptom recs are dispositioned through confirmed close_proposed commands with per-rec evidence; the five follow-on recs (rec-4124..rec-4128) are filed and listed in followon_recs (VP steps 14, 15).
