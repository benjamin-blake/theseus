er, BUDGET_RECS: (PORTAL,)}),\n        (\"e_the_common_row_deleted\", {k: v for k, v in true_roster.items() if k != COMMON}),\n    ],\n}\n\ndef verdict(pin, roster):\n    with patch.object(vpgc, \"_PRUNED_EDGES\", roster):\n        try:\n            getattr(cls(), pin)()\n        except AssertionError:\n            return \"rejected\"\n        except Exception as exc:\n            return \"blew_up:\" + type(exc).__name__\n    return \"accepted\"\n\nmissing = sorted(pin for pin in (ROSTER_PIN, COUNT_PIN) if not callable(getattr(cls, pin, None)))\nwrongly_accepted, blew_up, positive = [], [], {}\nif not missing:\n    for pin, cases in mutants.items():\n        for name, roster in cases:\n            outcome = verdict(pin, roster)\n            if outcome == \"accepted\":\n                wrongly_accepted.append(pin + \" ACCEPTED \" + name)\n            elif outcome != \"rejected\":\n                blew_up.append(pin + \" \" + name + \" \" + outcome)\n    positive = {pin: verdict(pin, true_roster) for pin in (ROSTER_PIN, COUNT_PIN)}\nmarkers = {\"module\": list(getattr(mirror, \"pytestmark\", [])), \"class\": list(getattr(cls, \"pytestmark\", []))}\nprint(\"removed=\", removed)\nprint(\"added=\", added)\nprint(\"net_method_delta=\", len(after) - len(before))\nprint(\"pins_missing=\", missing, \"| cap=\", getattr(cls, \"_CAP\", None))\nprint(\"mutants_wrongly_accepted=\", wrongly_accepted)\nprint(\"mutants_that_blew_up=\", blew_up)\nprint(\"positive_control_true_roster=\", positive)\nprint(\"pytestmark=\", markers)\nok = removed == [\"test_row_count_is_exactly_the_reviewed_three_and_within_the_cap\",\n                 \"test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure\",\n                 \"test_the_roster_is_the_three_reviewed_hub_rows\"]\nok = ok and added == [COUNT_PIN, ROSTER_PIN]\nok = ok and len(after) - len(before) == -1\nok = ok and not missing and getattr(cls, \"_CAP\", None) == 4\nok = ok and not wrongly_accepted and not blew_up\nok = 