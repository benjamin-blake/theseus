acceptance_criteria:
- scripts/checks/_scaffolding.py no longer imports _file_budget_breach_rec or _file_budget_bypass_rec, and an import of either from scripts.checks._scaffolding raises ImportError while scripts.validate still exposes both, bound to the same function objects scripts.checks._budget_recs defines.
- _PRUNED_EDGES holds exactly two rows (scripts.checks.registry and scripts.checks._common), the reviewed cap is still four, and two of the operator's four allowed rows are unspent.
- 'Green is unobtainable by suppression, asserted at step 14 as POSITIVE STRUCTURE rather than as a lowered number (Decision 181): _PRUNED_EDGES carries exactly scripts.checks._common and scripts.checks.registry and no scripts.checks._budget_recs key; NO gated check''s audited closure reaches scripts.checks._budget_recs at all, so the auditor traverses a true graph and finds nothing rather than being told to ignore what it finds; and scripts.ops_data_portal is suppressed by NO row -- validate_recommendations_schema still REPORTS scripts/ops_data_portal.py among its uncovered paths. Measured 2026-09-04 in a scratch clone carrying the finished diff.'
- 'REPORTED EVIDENCE, never the criterion (Decision 181): the advisory auditor reports 39 of 47 glob-gated checks with findings and 144 findings total with failed still empty, down from 150, and the only checks that move are validate_differential_gate_baseline, validate_hermeticity_flags and validate_verification_registry, each losing exactly scripts/checks/_budget_recs.py and src/common/ducklake_reader_client.py. No check gains a path. A finding-count target cannot distinguish true severance from suppression, which is why the criterion above is structural.'
- 'Every prose clause this diff falsifies is corrected in the SAME PR -- all NINE, in six files: scripts/validate.py''s direct-import comment AND its module docstring''s retained-re-exports clause, which names only the _common/_scaffolding primitives and stops enumerating this file''s back-compat surface the moment two of those names are sourced directly from scripts.checks._budget_recs; scripts/checks/_budget_recs.py''s module docstring AND its _mirror_to_step_summary cycle clause; scripts/checks/_scaffolding.py''s docstring step enumeration; scripts/checks/_pytest_diff.py''s mirroring clause; tests/validate/test_budget.py''s module-level reachability comment, whose retained-re-export-or-module-local disjunction stops covering the two helper names this diff re-sources; and BOTH renamed roster pins'' docstrings in tests/checks/deps/test_validate_pre_glob_closure.py, which describe the deleted three-row world (the _budget_recs row''s exactly-pinned target tuple, and three of the operator''s four rows spent). Step 9 fails if any one of the nine survives: an ABSENCE leg for every one of the nine obsolete phrasings, plus a PRESENCE leg for each of the six corrections that prescribe a replacement phrase (the other three are pure strikes, where the absence IS the correction). The count rose from five to eight after a plan-critique sweep and to nine after the coordinator''s completed mechanical sweep, each time because a live-source clause was measured falsified by this same diff with no step failing on it; historical decision prose and committed prior plan documents under docs/plans/ stay excluded by the IMMUTABLE RECORDS note in context.'
- 'The severance is sound, not merely convenient (Decision 135): no module imports either name from scripts.checks._scaffolding and no file under tests/ carries the patch string scripts.checks._scaffolding.<either name> (both measured empty), and the narrowed reverse-dependency set is recorded as an ACCEPTED, MEASURED consequence -- the non-test transitive ancestor set of scripts.checks._budget_recs falls from thirteen modules to six, losing scripts.checks._scaffolding, scripts.verification_graduation and the five scripts.checks.verification.* checks, so a future edit to _budget_recs.py selects a strictly smaller affected set.'
- Both halves ship together, proven both ways -- the source half alone reddens the roster mirror with exactly two named failures, and the module half alone regresses the auditor to 279 findings.
- 'Every roster-GENERAL pin still passes and survives under its own name: step 6 asserts the exact seven-passed summary with no skipped, xfailed or deselected member, and step 7''s method-NAME roster diff against origin/main shows three methods removed, two added, a net method delta of minus one (the deleted row-specific effect test) and no survivor deleted or renamed. Neither the mirror module nor the roster class carries a pytestmark -- read at RUNTIME in the same step -- so neither whole-class disabling route is open. The two RENAMED exact pins are proven EXACT BEHAVIOURALLY and never by reading their source: step 7''s mutation battery injects mutant rosters over vpgc._PRUNED_EDGES and requires the roster pin to REJECT the pre-change three-row roster, a swapped _common target, a registry row with scripts.checks._schema dropped, a registry row carrying an eighteenth _manifest target, and a roster with the _common row deleted, and the count pin to reject the three-row and the one-row mutants, with a positive control requiring both to ACCEPT the true roster. NOT CLAIMED, deliberately: surviving pin BODIES are not pinned byte-identical. That leg is deleted -- three critique rounds found three different leaks in three source-parsing forms of the same proof -- and this criterion claims only what steps 6 and 7 now actually establish.'
- The retired shard is absent from the live registry loader and present under entries/deprecated/, both sibling shards stay live, and the corpus's dangling-node_id set is unchanged.
- 'No pre_globs declaration changes: every scripts/checks/*/_manifest.py is byte-identical to origin/main.'
- The touched set is exactly the nine declared scope paths plus this plan.
- rec-3556's and rec-3561's acceptance commands both pass verbatim on the finished tree.
- bin/venv-python -m scripts.validate --pre and bin/venv-python -m scripts.validate both exit 0, with the fast-tier wall clock recorded before and after in the PR body.
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE census on the UNMODIFIED tree, in a throwaway clone checked out at origin/main. The auditor must report 39 of 47 glob-gated checks carrying findings, 150 findings total, and an empty failed list.
  command: "set -e\nBASE=$(git rev-parse origin/main); D=$(mktemp -d); C=$D/probe\ngit clone --shared --quiet . \"$C\" && ln -s \"$PWD/.venv\" \"$C/.venv\"\ngit -C \"$C\" checkout --quiet \"$BASE\"\ncd \"$C\" && bin/venv-python - <<'PY'\nimport contextlib, io\nfrom scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as audit\nbuf, failed = io.StringIO(), []\nwith contextlib.redirect_stdout(buf):\n    audit(failed)\nsummary = [ln.strip() for ln in buf.getvalue().splitlines() if \"ADVISORY:\" in ln or ln.strip().startswith(\"PASS: all\")][-1]\nprint(\"failed=\", failed, \"| summary=\", summary)\nok = not failed and \"39 of 47\" in summary and \"(150 finding(s) total)\" in summary\nraise SystemExit(0 if ok else 1)\nPY"
  expected: Exit 0 printing an empty failed list and an ADVISORY summary naming 39 of 47 glob-gated checks and 150 findings total. Reproduced 2026-09-04 in a scratch clone of the tree at d87bb68, the merged Task 6 PR 2 tree.
  fix_if: A different pair means main moved under this plan. Re-derive the whole census set (steps 1, 3 and 4) before touching a line; do NOT adjust the target numbers to whatever main now prints.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A pre-change census that this plan exists to change, and it shells out to git clone and git checkout. A registry row pinning 150 would fail permanently the moment this change merges.
- step: 2
  phase: pre-deploy
  action: RED, half A -- the row cannot survive the re-export's deletion. In a throwaway clone at origin/main carrying ONLY the two source edits (scripts/checks/_scaffolding.py and scripts/validate.py), the roster mirror must report exactly two failures, both named, and six passes. This is the measured proof that this unit cannot ship the deletion and keep the row.
  command: 'set -e

    BASE=$(git rev-parse origin/main); D=$(mktemp -d); C=$D/probe

    git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv"

    git -C "$C" checkout --quiet "$BASE"

    cp scripts/checks/_scaffolding.py "$C/scripts/checks/_scaffolding.py"

    cp scripts/validate.py "$C/scripts/validate.py"

    cd "$C"

    ! bin/venv-python -m pytest "tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster" -q -p no:cacheprovider --randomly-seed=12345 > red.log 2>&1

    grep -E ''^FAILED|passed'' red.log

    test "$(grep -c ''^FAILED'' red.log)" = 2

    grep -q ''^FAILED .*::test_every_row_key_is_reachable_from_a_gated_closure'' red.log

    grep -q ''^FAILED .*::test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure'' red.log

    grep -q ''key scripts.checks._budget_recs is in no gated check'' red.log

    grep -q ''2 failed, 6 passed'' red.log'
  expected: 'Exit 0. The log carries exactly two FAILED lines, naming test_every_row_key_is_reachable_from_a_gated_closure and test_the_budget_recs_row_removes_the_portal_from_every_scaffolded_closure, the reachability report "key scripts.checks._budget_recs is in no gated check''s closure", and the summary 2 failed, 6 passed. Reproduced 2026-09-04 in a scratch clone. These are the PR 2 pins doing their job: both halves ship together or neither does.'
  fix_if: Fewer than two failures means the pins are weaker than PR 2 measured them; more means the source edits touched something outside the two names. Diagnose before proceeding -- never relax a pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts a deliberately failing pytest run inside a mutated throwaway clone. A registry row invoking it would record a green that depends on a half-applied tree, which cannot exist after merge.
- step: 3
  phase: pre-deploy
  action: 'RED, half B -- the mirror image, and a measurement that CORRECTS the coordinator brief. In a throwaway clone at origin/main carrying ONLY the module edit (the row removed, the re-export still present), the auditor regresses to 279 findings, not 144 and not 150: the row was suppressing the whole scripts.ops_data_portal subtree, so removing it alone puts back 129 findings, not 6.'
  command: "set -e\nBASE=$(git rev-parse origin/main); D=$(mktemp -d); C=$D/probe\ngit clone --shared --quiet . \"$C\" && ln -s \"$PWD/.venv\" \"$C/.venv\"\ngit -C \"$C\" checkout --quiet \"$BASE\"\ncp scripts/checks/deps/validate_pre_glob_closure.py \"$C/scripts/checks/deps/validate_pre_glob_closure.py\"\ncd \"$C\" && bin/venv-python - <<'PY'\nimport contextlib, io\nfrom scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as audit\nbuf, failed = io.StringIO(), []\nwith contextlib.redirect_stdout(buf):\n    audit(failed)\nsummary = [ln.strip() for ln in buf.getvalue().splitlines() if \"ADVISORY:\" in ln][-1]\nprint(\"half_b_summary=\", summary)\nraise SystemExit(0 if not failed and \"(279 finding(s) total)\" in summary and \"39 of 47\" in summary else 1)\nPY"
  expected: 'Exit 0 printing an ADVISORY summary naming 279 findings total and 39 of 47 checks. Reproduced 2026-09-04 in a scratch clone. The coordinator brief''s "puts back 6 findings" is overturned by this measurement: 6 is the delta only once the re-export is already gone.'
  fix_if: A count other than 279 means the pre-PR-2 baseline moved. Re-measure both halves before proceeding; the half-B number is evidence for the both-halves-together constraint and is not adjustable.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts a live-tree census of a half-applied tree that cannot exist after merge, and it shells out to git clone and git checkout.
- step: 4
  phase: pre-deploy
  action: 'AFTER census plus the per-check delta, computed as a whole-roster difference against a clone at origin/main rather than as anecdotes: totals move 150 to 144 with the check count fixed at 39, exactly three checks move, each loses exactly scripts/checks/_budget_recs.py and src/common/ducklake_reader_client.py, no check gains a path, and no check newly acquires findings.'
  command: 'set -e

    BASE=$(git rev-parse origin/main); D=$(mktemp -d); C=$D/probe

    CEN=''import json

    from scripts.checks import _common

    from scripts.checks.deps import validate_pre_glob_closure as v

    root = _common.ROOT

    view = v._closure_view(root)

    cen = {e.name: sorted(v._unmatched_paths(e, view, root)) for e in v._gated_entries()}

    print(json.dumps({k: p for k, p in cen.items() if p}))''

    git clone --shared --quiet . "$C" && ln -s "$PWD/.venv" "$C/.venv"

    git -C "$C" checkout --quiet "$BASE"

    (cd "$C" && bin/venv-python -c "$CEN" > "$D/before.json")

    bin/venv-python -c "$CEN" > "$D/after.json"

    D="$D" bin/venv-python - <<''PY''

    import json, os

    d = os.environ["D"]

    before = json.load(open(d + "/before.json"))

    after = json.load(open(d + "/after.json"))

    bt, at = sum(len(v) for v in before.values()), sum(len(v) for v in after.values())

    moved = {k: (len(before[k]), len(after.get(k, []))) for k in before if before[k] != after.get(k, [])}

    lost = {k: sorted(set(before[k]) - set(after.get(k, []))) for k in moved}

    gained = {k: sorted(set(after.get(k, [])) - set(before[k])) for k in moved}

    new = sorted(set(after) - set(before))

    print("before=", (bt, len(before)), "| after=", (at, len(after)))

    print("moved=", sorted(moved.items()))

    print("lost=", sorted(lost.items()))

    print("gained_any=", any(gained.values()), "| new_checks_with_findings=", new)

    want = ["scripts/checks/_budget_recs.py", "src/common/ducklake_reader_client.py"]

    ok = (bt, len(before)) == (150, 39) and (at, len(after)) == (144, 39)

    ok = ok and sorted(moved) == ["validate_differential_gate_baseline", "validate_hermeticity_flags", "validate_verification_registry"]

    ok = ok and all(v == want for v in lost.values()) and not any(gained.values()) and not new

    raise SystemExit(0 if ok else 1)

    PY'
  expected: Exit 0 printing before= (150, 39), after= (144, 39), a moved list of exactly validate_differential_gate_baseline (12 to 10), validate_hermeticity_flags (9 to 7) and validate_verification_registry (12 to 10), each losing the same two paths, with no gained paths and no newly-affected check. Reproduced 2026-09-04. The row only ever suppressed scripts.ops_data_portal; deleting the re-export additionally removes src/common/ducklake_reader_client.py, which the row never covered -- strictly more fail-closed, not less.
  fix_if: A check that GAINS a path means the edit changed the graph in a way this unit does not intend. A moved set larger than three means the deletion reached further than the rec-filing hub.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Pins live-tree finding censuses that the series' remaining glob-widening PRs will legitimately move, and it shells out to git clone and git checkout.
- step: 5
  phase: pre-deploy
  action: 'The roster pin, under its restored pre-PR-2 name: exactly two rows, both target tuples pinned exactly, the reviewed cap still four.'
  command: bin/venv-python -m pytest "tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster::test_the_roster_is_the_two_reviewed_hub_rows" "tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster::test_row_count_is_exactly_the_reviewed_two_and_within_the_cap" -q -p no:cacheprovider --randomly-seed=12345
  expected: Two passed. The content pin asserts the sorted keys are exactly scripts.checks._common and scripts.checks.registry, that the _common row is the single-element plan_document tuple, and that the registry row still carries _schema plus seventeen manifest targets; the count pin asserts two rows exactly and still at or under the cap of four.
  fix_if: A third key means the row was not removed. An inequality in place of either exact pin is a Decision 181 weakening and must be reverted, not accepted.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Exact-content pins the series is expected to move again: two of the four allowed rows remain, so a later domain PR may legitimately raise the count. A graduated row would freeze a number this series is designed to change.'
- step: 6
  phase: pre-deploy
  action: 'Every roster-GENERAL pin still green after the shrink -- liveness, reachability, the inline-rationale-comment pin, and both negative controls -- run as the whole roster class, with the exact seven-passed summary ASSERTED rather than merely recorded. STRENGTHENED after a plan-critique measurement: a plain exit-0 pytest run is green on a class whose survivor has been disabled, so this step now fails unless exactly seven members passed and none was skipped, xfailed or deselected.'
  command: 'set -e

    LOG=$(mktemp)

    bin/venv-python -m pytest "tests/checks/deps/test_validate_pre_glob_closure.py::TestPrunedEdgesRoster" -q -p no:cacheprovider --randomly-seed=12345 > "$LOG" 2>&1 || { tail -20 "$LOG"; exit 1; }

    tail -2 "$LOG"

    grep -qE "(^| )7 passed[ ,]" "$LOG"

    '
  expected: 'Exit 0 printing a pytest summary of exactly seven passed and nothing else -- down one from eight because the row-specific effect test is deleted with its subject. The grep matches the seven-passed COUNT WITHOUT anchoring the trailing in-form, because pytest renders a warning-bearing run as 7 passed, 1 warning in 3.14s, which the anchored form silently misses; the leading anchor still keeps 17 passed from matching. A survivor that is present but DISABLED does not match at all: on this seven-member class a skipped member renders as 6 passed, 1 skipped -- not seven passed, one skipped, which is the EIGHT-member unmodified-tree rendering. Measured 2026-09-04 in scratch clones at d87bb68: eight passed on the unmodified tree, so this step exits 1 there; 7 passed in 3.19s on the finished tree with the grep exiting 0; and 6 passed, 1 skipped in 3.38s after a skip marker was added to test_every_row_key_is_reachable_from_a_gated_closure on the finished tree, where the grep exits 1 and so does the step. All four renderings were fed to the grep directly: the two seven-passed forms match, the disabled form and the 17-passed form do not. The two already-graduated survivors (pre-glob-prune-roster-liveness and pre-glob-prune-row-reachable-from-gated-closure) are inside this selection and must both pass. This is the run-time half of the pair whose static half is step 7.'
  fix_if: 'Any survivor failing means the shrink broke a roster-general property, which is the thing this plan claims it does not do. Stop and diagnose; do not adjust the survivor. A count other than seven with everything green means a member was added or removed beyond the one deletion this plan declares -- reconcile against step 7''s method-roster diff. A skipped or xfailed member means a survivor was disabled rather than deleted: restore it, never relax this grep to accept a lower passed count, and never re-anchor it on the in-form, which a warning line would break.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The two load-bearing members of this selection are already graduated as pre-glob-prune-roster-liveness and pre-glob-prune-row-reachable-from-gated-closure; a third row over the same class would duplicate standing guards, and the seven-count this step now asserts is a number the series' later units may legitimately move.
- step: 7
