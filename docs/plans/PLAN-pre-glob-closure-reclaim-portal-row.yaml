constraints:
- 'Constraint 1 (clause discipline): a clause may appear in permanent source -- a comment, a docstring, or a committed plan field -- ONLY if a named verification_plan step FAILS were that clause false. All NINE corrected clauses are bound to steps 9 and 14: scripts/validate.py''s direct-import comment AND its module docstring''s retained-re-exports clause; scripts/checks/_budget_recs.py''s module docstring and its _mirror_to_step_summary cycle clause; scripts/checks/_scaffolding.py''s docstring step enumeration; scripts/checks/_pytest_diff.py''s mirroring clause; tests/validate/test_budget.py''s reachability disjunction; and both renamed roster pins'' docstrings in tests/checks/deps/test_validate_pre_glob_closure.py. The previous comment''s --terraform-only is unaffected consequence is DELETED rather than restated because no step backs it. The constraint binds this plan''s own fields too, which is why step 7''s source-parsing proof was REPLACED by a behavioural mutation battery and every claim that rested on its deleted byte-identity leg was NARROWED rather than restated, once a plan-critique measurement showed a materially gutted pin satisfied that leg.'
- 'Constraint 2: cite SYMBOLS, never line numbers -- nothing in this plan or in any file it touches pins a line number. tests/validate/test_budget.py joins scope carrying exactly such a citation inside the clause this diff falsifies, so the correction there drops it and step 9 asserts its absence. Measured 2026-09-04, the same citation survives in ONE other file this plan does not touch (tests/validate/test_scaffold_gates.py) plus a shorter variant in tests/validate/test_tiers.py; both stay declared residuals rather than becoming inline fixes (Decision 59). The ONE line-number literal anywhere in this plan is the claim string inside step 9 and its paired test obligation, which assert that citation''s ABSENCE from the corrected comment -- an absence pin, the opposite of a line-number dependency, and it disappears from the repo''s live surface the moment the correction lands.'
- 'Constraint 3 (Decision 181): nothing in the diff may widen a glob, relax an assertion, delete a surviving test, or lower a budget to obtain green -- and the plan''s own ACCEPTANCE may not be a lowered number, which is why the headline criterion is the positive structure step 14 asserts and the 150-to-144 move is demoted to reported evidence. The two pin reversions and the one test deletion are the named exception and are JUSTIFIED AND PINNED by step 7, not waved through: the exact pins go exact-to-exact one row SMALLER because the roster genuinely shrank, the four-row cap is untouched, and the deleted test is deleted because its SUBJECT no longer exists -- supersession by removal of the thing pinned, not relaxation of a surviving assertion.'
