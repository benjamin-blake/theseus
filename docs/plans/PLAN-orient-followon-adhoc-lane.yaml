- 'followon_recs holds exactly the OPEN recs whose id appears in the followon_recs list of a docs/plans/PLAN-*.yaml carrying implementation_declared: true, each as {id, title, parent_plan}; a rec named by a plan whose implementation has not landed, a closed rec, and an id no rec row matches are all absent.'
- 'open_critical_recs holds exactly the open rows with priority Critical whose source is not the exact string ''ci_rca'' -- an open Critical `ci_rca_evidence_dispute` row IS present -- each as {id, title, source}; re-derived independently from the same cache the two sets are equal, and on the tree''s current cache that set is {rec-2816, rec-3240} (the cache holds zero OPEN ci_rca-family rows, so the predicate choice does not move today''s set). That id pair is MEASURED AT PLANNING TIME (2026-09-03 cache), not a fixed expectation: VP step 3 asserts set equality against an independent re-derivation over the same rows, never membership of these two ids, so a third open Critical rec filed later -- or the CLOSURE of one of these two -- moves both sides together and is a pass, not a failure. That equality is the WHOLE assertion -- the population size is printed for the record and never asserted, so an empty open-Critical set is a pass too (critique r2 REVISE 2 removed the earlier non-empty guard).'
- logs/.preflight-report.json carries followon_recs and open_critical_recs at top level after a preflight run, and both are [] (never a missing key) when the warm recommendation pull failed.
- '.claude/commands/orient.md Step 2 lists followon_recs, open_critical_recs, priority_queue and recs_read_status, and Step 3 carries the lane rule as a TRAILING subsection of Section 6 (after the in_progress follow-on prompts, the eligible-item prompts and the overlap matrix): a cap of 3 prompts TOTAL across the three buckets with one clause saying that three or more open Critical recs displace the follow-on and queue buckets, Critical -> follow-on -> queue order, one render per rec, additive to the five roadmap slots, omitted when all three keys are empty AND recs_read_status is ok, a DEGRADED rendering naming recs_read_status whenever it is anything else -- so a degraded RECOMMENDATION read is never silently omitted for the two rec keys (followon_recs, open_critical_recs), while the QUEUE bucket is explicitly OUT of that guarantee because the preflight report carries no independent queue-read status -- and the spec states that queue residual in one clause; cache-only.'
- .claude/skills/orient/SKILL.md carries the ad-hoc-lane pointer (bearing the literal tokens 'Critical recs' and 'non-blocking'), the literal restatement marker `Preserve the "do NOT surface` occurs exactly ONCE in the file after the edit (two occurrences before, at :97 and :103; the rule's defining statement at :91 is not a restatement and stays), and the file measures a byte delta of AT MOST 0 against origin/main (VP step 7 asserts cur - base <= 0) while staying at or under its config/prose_budgets.yaml S4 budget.
