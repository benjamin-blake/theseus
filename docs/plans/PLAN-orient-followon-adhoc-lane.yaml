verification_plan:
- step: 0
  phase: pre-deploy
  action: PRECONDITION (runs FIRST, after the rebase and before every other step; numbered 0 so the 1-15 sequence and every reference to it stays stable) -- bind this reader to slice B's ACTUAL field shape rather than to an assumption. Every other assertion about followon_recs runs against fixtures this plan authors, so nothing else here can tell 'B shipped the field as assumed' from 'B named it differently or filled it with prose' (critique r1 recommendation 4).
  command: bin/venv-python -c "from scripts.roadmap.plan_document import PlanDocument; f=PlanDocument.model_fields.get('followon_recs'); print('present=', f is not None, '| annotation=', f.annotation if f else None); raise SystemExit(0 if f is not None and 'list' in str(f.annotation) and 'str' in str(f.annotation) else 1)"
  expected: 'After the rebase onto a main carrying PLAN-plan-followon-recs-field: exit 0 printing present= True and a list-of-str annotation. On the pre-rebase tree (6afee9ad) it exits 1 printing present= False | annotation= None, and grep -l followon_recs docs/plans/*.yaml returns 0 files -- both measured at planning time.'
  fix_if: present= False AFTER the rebase means slice B has not merged, or named the field differently -- STOP and reconcile the reader against B's actual field name before writing any derivation; never invent the field here (that would ship a key nothing populates). A non-list annotation means B's shape differs from this plan's assumption -- re-derive _landed_followon_rec_ids against it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts a PRECONDITION of this plan's rebase (slice B's field must exist before this reader is written). Once both slices are merged the assertion is a tautology over B's own schema, which B's PlanDocument tests own; a standing shard here would duplicate them.
- step: 1
  phase: pre-deploy
  action: 'RED baseline -- prove on the unmodified tree that none of the three helpers exists. Run FIRST, before any edit. hermetic false for a stated reason, not for cost: this step deliberately INVERTS once the change lands, so a replay against the implementation-bearing tree would exit 1.'
  command: bin/venv-python -c "from scripts.preflight import recs_cache; absent=[n for n in ('_derive_followon_recs','_derive_open_critical_recs','_landed_followon_rec_ids') if not hasattr(recs_cache,n)]; print('absent=',absent); raise SystemExit(0 if len(absent)==3 else 1)"
  expected: Exit 0 printing absent= ['_derive_followon_recs', '_derive_open_critical_recs', '_landed_followon_rec_ids'] (reproduced at planning time on 6afee9ad). After the edit the same command exits 1, which is the intended inversion.
  fix_if: Exit 1 on unmodified code means a helper already landed (a sibling slice touched the module) -- STOP and re-derive the diff rather than re-adding what is there.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the ABSENCE of the very helpers this plan adds; graduating it would land a standing check that fails permanently the moment the change merges.
- step: 2
  phase: pre-deploy
  action: 'GREEN unit (pytest step) -- the derivation tests pass: readiness gate discriminates landed from un-landed parents, closed and dangling ids drop out, the substring gate skips unrelated plans, source == ''ci_rca'' rows are excluded from the Critical lane while an open Critical `ci_rca_evidence_dispute` row IS surfaced, ordering is oldest-first, and both derivations survive a _make_reader that raises.'
  command: bin/venv-python -m pytest tests/session/preflight/test_recs_cache_adhoc_lane.py::TestAdHocLaneDerivations -q
  expected: All tests in TestAdHocLaneDerivations pass. Execution step 4 writes the tests BEFORE the recs_cache edit, so the red half is the class PRESENT and every test in it FAILING on the absent recs_cache helpers (AttributeError/ImportError), whose absence VP step 1 measures independently. Because this module carries no importorskip guard (VP step 16 asserts it), a 'found no collectors' / exit-4 result here means the class or the module was never added -- it can no longer be the boto3-skip signature that this wording would have masked in the gated tests/session/preflight/test_recs_cache.py (critique r2 REVISE 1 item 5).
  fix_if: A readiness-gate failure means the walk is reading a plan's followon_recs without checking implementation_declared; a reader failure means a derivation reached _make_reader instead of using the rows argument.
  hermetic: false
  graduation: graduate
  graduation_check_id: preflight-derives-followon-and-critical-rec-keys
- step: 3
  phase: pre-deploy
  action: Live-tree discrimination -- run both derivations against the real read cache and the real docs/plans/ tree, and cross-check the Critical set against an INDEPENDENT re-derivation over the same rows (a different expression, not the function's own output).
  command: bin/venv-python -c "import json,pathlib; from scripts.preflight import recs_cache; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; derived={r['id'] for r in recs_cache._derive_open_critical_recs(rows)}; expected={r.get('id') for r in rows if r.get('status')=='open' and str(r.get('priority','')).lower()=='critical' and str(r.get('source','')) != 'ci_rca'}; fol=recs_cache._derive_followon_recs(rows); print('critical=',sorted(derived),'| expected=',sorted(expected),'| count=',len(derived),'| followon=',[r['id'] for r in fol]); raise SystemExit(0 if derived==expected else 1)"
  expected: 'Exit 0 with critical= equal to expected=. count= is PRINTED FOR THE RECORD, never asserted: it reads 2 on the cache measured at planning time ({rec-2816, rec-3240}), but an EMPTY set is a legitimate pass -- either rec can close during this multi-slice run (rec-3240 is implement-session-sourced on scripts/validate.py, inside this run''s blast radius), and a correct derivation over an empty population must not read as red (critique r2 REVISE 2, which is why the earlier `and derived` non-empty guard is gone). followon= is printed too -- empty until a merged plan declares followon_recs and its implementation has landed.'
  fix_if: 'A mismatch between critical= and expected= means the filter and the stated rule have diverged -- fix the filter, never the cross-check. count= 0 is NOT a failure and NOT evidence of a stale cache: confirm by inspection that no open non-ci_rca Critical rec remains (optionally after `bin/venv-python -m scripts.sync.ops sync`) and move on.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Reads logs/.recommendations-log.jsonl, a gitignored per-clone read cache absent in CI, and its expected value is whatever the warehouse holds that day -- a standing shard would be environment- dependent. The invariant it proves is guarded hermetically by the graduated step-2 shard.
