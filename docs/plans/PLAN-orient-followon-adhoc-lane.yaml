scope:
- file: scripts/preflight/recs_cache.py
  action: Modify
  purpose: 'Add three module-level helpers, all pure over the ops_recommendations rows the warm-up sync already pulled (Decision 88 invariant ii -- no reader call, no rec-cache re-read): `_landed_followon_rec_ids(plans_dir)` walks docs/plans/PLAN-*.yaml under the T-1.23 substring gate (a document whose text never mentions the key cannot declare one) and maps each rec id named in a plan''s `followon_recs` to that plan''s slug, but only for plans carrying `implementation_declared: true`; `_derive_followon_recs(rows, plans_dir=None)` intersects that map with the OPEN rows and returns [{id, title, parent_plan}]; `_derive_open_critical_recs(rows)` returns [{id, title, source}] for open rows with priority Critical whose source is not the exact string ''ci_rca'' -- an open Critical `ci_rca_evidence_dispute` (or `ci_rca_probe_health`) row IS surfaced, because the Decision 73 halt and the three ci_rca preflight keys all match the exact source only, so such a row has no other lane. Both lists are ordered oldest-created-first (rows with an unparseable created_timestamp last, ties broken by id). ~55 SLOC onto 182 of a 500 ceiling -- no budget entry, no decomposition needed.'
- file: scripts/session/preflight.py
  action: Modify
  purpose: 'Wire both derived keys into the written report as top-level `followon_recs` and `open_critical_recs`, computed inline from `recs_rows_cache` after the Phase-B fan-out (same placement as the other derived gauges). A degraded warm pull (recs_rows_cache None) yields [] for both while recs_read_status keeps reporting the degradation -- never a silent false zero (Decision 55). The READER half of that same claim is carried by the orient.md scope row''s degraded clause, which keys off `recs_read_status`: the writer emitting [] is only honest if the renderer refuses to read that [] as a zero (critique r1 F1). +2 to 4 SLOC onto 427 of a 500 ceiling.'
- file: tests/session/preflight/test_recs_cache_adhoc_lane.py
  action: Create
  purpose: 'Add the three classes in a NEW, boto3-free sibling module instead of extending tests/session/preflight/test_recs_cache.py, whose module-level `pytest.importorskip("boto3")` (:14) makes every class in it INVISIBLE to pr-validate -- the authoritative pre-merge tier (Decision 73). boto3 ships only in requirements.txt (the post-merge main-validate job); pr-validate installs requirements-fast + requirements-dev, neither of which carries it (.github/workflows/ci.yml). MEASURED at critique r2: a class selector against an importorskip-gated module exits 4 (''found no collectors''), TestSelectorCheck reads any non-zero return as FAIL, and scripts/verification_graduation.py''s rec-2655 graceful-skip branch then records the shard admitted=False, skipped=True -- so all three graduated shards would print ''skipped (non-fatal)'' and never be admitted in the fast tier (critique r2 REVISE 1). Precedent: tests/session/preflight/test_ci_rca_gauges_abstention_label.py exists for exactly this reason. ALL THREE classes move, including the main()-patching wiring class: both `scripts.preflight.recs_cache` and the tests/fixtures/session_preflight_module fixture import with boto3 blocked at the meta_path level, and 12 of 12 main()-integration tests in tests/session/preflight/test_main_report.py PASS under that block (both measured), so no fast-tier residual has to be declared for the wiring half. The classes: TestAdHocLaneDerivations (readiness gate discriminates a landed parent from an un-landed one; a closed or never-filed rec id is absent; a plan file that never names the key is not parsed; both derivations run with scripts.preflight._common._make_reader patched to raise, proving the zero-reader-call property; the Critical filter drops source == ''ci_rca'' rows, non-Critical rows and closed rows, and SURFACES an open Critical `ci_rca_evidence_dispute` row -- that last assertion is the discriminator between the chosen exact predicate and the rejected startswith(''ci_rca'') one, and fails under the rejected option; ordering is oldest-first with unparseable timestamps last), TestAdHocLaneReportWiring (main() writes both keys into the report; the injected Critical row surfaces; a degraded pull yields [] for both), and TestOrientAdHocLaneContract (the orient command and skill render the keys; the command''s Step 2 input list names `recs_read_status` and its lane rule carries the DEGRADED branch keyed off that status, so the omit-when-empty rule cannot swallow an unknown Critical population; the skill''s literal restatement MARKER `Preserve the "do NOT surface` occurs exactly once after the edit -- the test counts that marker string, not the rule text, because the rule''s DEFINING statement in the Ratifiable-CDs block at :91 legitimately remains; and the ledger contract''s followon_recs_readiness.derivation names all three tokens the code keys on -- `implementation_declared`, `followon_recs` and status `open`). The module carries NO module-level importorskip; VP step 16 asserts that and graduates it. ~160-210 SLOC in a NEW file of a 500 ceiling, so the r1 headroom worry disappears with it (test_recs_cache.py stays untouched at 318 SLOC and leaves this plan''s scope).'
- file: tests/test_session_preflight_decomposition.py
  action: Modify
  purpose: 'PLAN AMENDMENT (added after the implementation reached its Commit Flow; see the amendment note in context). This module freezes the preflight report''s top-level key set exactly -- FROZEN_REPORT_KEYS is a frozenset guarded by its own `assert len(FROZEN_REPORT_KEYS) == N, "frozen report key list itself drifted -- fix the constant, not the assertion"`. The scripts/session/preflight.py scope row above adds two top-level report keys, so this constant MUST gain `followon_recs` and `open_critical_recs` and its count must go 48 -> 50, or the module fails by construction. The companion edit is mechanically unavoidable and carries no independent design content: it is the frozen mirror of a change this plan already declares. It was missed at planning time -- unlike docs/decisions-index.json, which is generated and therefore covered by the decisions_index_regeneration sanction row, this constant is hand-maintained and CAN be pre-declared, so its absence is a planning omission rather than a gap in docs/contracts/implement-scope-boundary.yaml. Declaring it here is the narrow fix; adding a fourth sanction row would have sanctioned the whole companion class for every future plan, which is a governance loosening that should be a considered decision rather than a side effect of one missed scope row.'
- file: .claude/commands/orient.md
  action: Modify
  purpose: 'Step 2 gains `followon_recs`, `open_critical_recs`, `priority_queue` AND `recs_read_status` in the cache-input list -- the last is what lets the renderer tell a DEGRADED recommendation pull from a genuinely empty lane (critique r1 F1; `recs_read_status` is absent from that list today). Step 3 gains the ad-hoc lane''s full rendering spec as a TRAILING subsection of Section 6 -- rendered after the in_progress follow-on prompts, after the eligible-item prompts and after their overlap matrix, so the matrix stays contiguous with the roadmap prompts it covers (Fork 6; the audit''s B1-R4 (b) ''after the in_progress follow-ons, never competing for the five roadmap slots'') -- and it is the relocation target for the skill''s section spec, landing on the measured-only S3 surface per Decision 127. The rule: at most THREE prompts TOTAL across the three buckets, ordered open Critical recs -> ready follow-on recs -> priority-queue head, so three or more open Critical recs displace the follow-on and queue buckets entirely and ONE CLAUSE says so, making an empty follow-on bucket read as Critical-first displacement rather than ''nothing ready''; a rec rendered once even when it is in two keys; additive to and never consuming the five roadmap slots; the whole subsection omitted when all three keys are empty AND `recs_read_status` is `ok`; when `recs_read_status` is anything else the subsection is instead rendered as DEGRADED naming that status (never omitted), mirroring the skill''s own `decision_conditions` degradation clause at .claude/skills/orient/SKILL.md:121 and its missing-key rule at :50, so an unknown Critical population never reads as a silent zero (Decision 55) -- this is the reader half of the same claim the preflight scope row makes on the writer side; and cache-only (never a rec-cache read or a reader call; absent keys mean an older preflight, so re-run preflight). The same spec carries two one-clause statements that cost no extra surface: (i) the lane renders id/title/parent only and relevance is judged by /plan''s Recommendation Relevance Gate when the prompt is RUN -- no relevance verdict is computed or cached at preflight (Decision 55 surfacing-only, Decision 103); and (ii) the ad-hoc prompts sit OUTSIDE the overlap matrix and the keystone ranking because they are rec-grain (a rec carries no files_in_scope/depends_on to project), which is what the audit adjudicated as ''never competing for the five roadmap slots'' (B1-R4 (b), Decision 90). Carrying cost, stated rather than left implied (critique r1): the finished subsection runs materially larger than the audit''s ''+3 orient.md lines'' (B1-R4) and ''+2 lines'' (B4-O1) estimates -- roughly 12-18 rendered lines once cap, bucket order, displacement, degraded, one-render, additivity, omission, cache-only and the two Decision-103/90 clauses are all stated -- which is accepted because S3 is measured-only with NO config/prose_budgets.yaml entry (Decision 127), not because the estimate held. Round-3 addendum (critique r2 R4): the spec states in ONE clause that the oldest-first order INSIDE the open-Critical bucket is a deterministic TIE-BREAK, not an urgency rank -- an older Critical rec is not the more urgent one, it is merely the stable choice under the cap -- so a reader never mistakes bucket order for severity order once a third Critical rec makes the ordering load-bearing. It costs no budgeted bytes (S3 is measured-only). Round-3 addendum (critique r3, VERIFIED IN-TREE at authoring of this revision): the spec ALSO closes the QUEUE half of the degradation guarantee by DECLARING it, in one clause -- the queue bucket is rendered from `priority_queue`, and the preflight report carries NO independent queue-read status. `priority_queue_source` is derived from `creds_status` ALONE (scripts/session/preflight.py:363) and still reads `ducklake_reader` when the per-table `ops_priority_queue` warm pull fails: that failure resolves `pq_cache` to None (scripts/session/preflight.py:240-242, per table), `read_priority_queue` falls through to `_read_priority_queue_cache` (scripts/preflight/priority_queue.py:102-104), and that returns [] with a STDERR-ONLY warning /orient never reads (it reads the JSON report). A degraded queue read is therefore INDISTINGUISHABLE from an empty queue, and the DEGRADED branch -- which keys off `recs_read_status` -- does not fire for it. The spec says so as an unenforced residual in the same Decision-181-clause-2 form this plan already uses twice, rather than leaving an unqualified absolute standing; it does not widen the trigger to `creds_status != ok`, because creds down already implies `recs_read_status != ok` (creds down => warm sync skipped => recs_rows_cache None => reader_unreachable), so that disjunct is redundant and would not close this per-table window. Costs no budgeted bytes either (S3 is measured-only).'
- file: .claude/skills/orient/SKILL.md
  action: Modify
  purpose: 'Net byte delta AT MOST ZERO, measured: ADD a Section 6 pointer block naming the ad-hoc lane (open Critical recs, ready follow-on recs, priority queue; non-blocking; cap 3; rendering rule in the orient command) whose TOTAL addition -- block text PLUS every separator byte it needs (its own newlines and blank line) -- is at most 223 bytes, and REMOVE the duplicate sentence that ends the Realization-candidates paragraph at .claude/skills/orient/SKILL.md:103 together with its single leading space: 222 + 1 = 223 bytes freed. That sentence restates the Ratifiable-CD exclusion rule already stated at :97 and DEFINED in the Ratifiable-CDs block at :91. The pointer is also what makes rec-3054''s own acceptance command (''critical recs'' + ''non-blocking'' present in this file) pass in-tree instead of being closed unmet by a trailer.'
- file: docs/contracts/exit-criteria-ledger.yaml
  action: Modify
  purpose: 'Add the `followon_recs_readiness` field entry beside slice B''s `plan_followon_recs` entry (that is the CONTRACT-side key name slice B lands, mirroring the existing plan_closes_criteria convention -- the contract carries no `followon_recs:` key at all; corrected at critique r4 R2) in the same `fields:` mapping once the rebase onto PLAN-plan-followon-recs-field has landed it (fall back to placing it after `plan_closes_criteria` only if the rebased tree does not carry B''s entry) -- description, semantics, populated_by, write_time_validation, dq_intent (the four category-2 required inline keys plus one) and a `derivation` block pinning the rule ONCE: one entry per OPEN rec named in the `followon_recs` of a plan carrying implementation_declared true. The readiness rule is stated in that `derivation` block and NOWHERE else in the contract, and it never restates slice B''s `plan_followon_recs` field semantics (the CONTRACT-side key; critique r4 R2) (one store per fact -- AGENTS.md''s Agent-First collocation rule and Decision 86''s no-second-surface routing; citation corrected at critique r2, Decision 115''s own holding being that the durable half rides the plan YAML) -- it names that field and says what preflight does with it. Append the entry to the CONTRACT-LEVEL `amendment_log` (the top-level ContractDocument.amendment_log key), NOT to the new FieldSpec''s own log (critique r1 names this): a field-level log records diffs to an EXISTING field''s description/semantics (scripts/contracts_enforcement.py:83-85) and a brand-new field has no such diff to record, while the contract-level log is what records the contract''s own evolution -- and is the log the deferred Decision-136 description widening will have to append to. The contract carries no top-level amendment_log today (verified), so this plan creates the key with one entry: date, semantic_break false, change_class field_add, summary naming this plan. No existing description or semantics is edited, so no category-6 obligation is triggered. The `derivation` block also carries a one-clause GRAIN disambiguation (critique r2 R5): the rec-grain `followon_recs` preflight key is NOT the tier-item-grain `platform_roadmap.in_progress[].needs_followon_plan` gauge that sits in the same report.'
