rollback: >-
  Revert the merge. The source is additive: with the trailer-junit-verdict job removed and the
  routing change reverted, every pytest-carrying acceptance returns to slice A's static probe, which
  is the pre-slice-B behaviour. Nothing outside the trailer path changes, because the routing lives
  in the trailer census stage and the junit module has no other importer. rec-3984's corrected
  acceptance survives a revert and is the one field that must be re-decided rather than restored --
  it should stay corrected, since the acceptance it replaces tests slice A only.
