schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: trailer-acceptance-junit-verdict
intent: >-
  Add the SECOND verdict source to the closure-time trailer acceptance gate slice A installs: a
  junit ::node_id verdict READ from the authoritative pytest-junit report the same push run already
  produced, claimed by a STATIC three-arm partition of the acceptance text so that exactly one
  source ever produces a verdict for any one rec, and the pure pytest node-id population is decided
  by the record CI already emitted rather than by a second run of the same test.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-acceptance-junit-verdict.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec (carrying rec rec-3984); names NO tier_item, so the Tier
  Item Freshness Gate is skipped. Identical scoping to slice A (PLAN-trailer-acceptance-static-gate,
  merged #1253) by operator-confirmed slice boundary. T3.9 is the nearest tier_item and is
  deliberately NOT claimed, for the reason slice A records under its own T3.9 boundary note.
scope:
  - file: docs/plans/PLAN-trailer-acceptance-junit-verdict.yaml
    action: Modify
    purpose: >-
      This plan's own path -- always touched per docs/contracts/implement-scope-boundary.yaml's
      implementing_plan_bookkeeping sanction row, whose permitted_field_edits lists
      implementation_declared FIRST. Flip implementation_declared to true after code review and a
      full-tier pass. Omitting this row leaves the plan out of the diff and makes
      validate_graduation_completeness, validate_scope_boundary and validate_vp_replay all no-op,
      satisfying VP step 13 VACUOUSLY (slice-0 lesson, cost a full code-review round there).
  - file: scripts/rec_trailer_acceptance_junit.py
    action: Create
    purpose: >-
      The junit verdict SOURCE, a sibling of slice A's scripts/rec_trailer_acceptance.py rather than
      a growth of it (Decision 128 decompose-by-default; slice A's module is not yet in the tree so
      its post-implementation SLOC cannot be measured at plan time, and growing an unmeasurable file
      is exactly the crossing Decision 128 forbids planning blind). Concerns, all pure and
      filesystem-only: (a) JUNIT_ARMS, a frozen total outcome vocabulary
      {passed, failed, errored, skipped, absent, report_unavailable}; (b) verdict_for_junit(arm), a
      TOTAL map onto slice A's ACCEPTANCE_VERDICTS where ONLY `passed` yields `holds` and every
      other arm yields `fails` (failed/errored) or `unmeasurable` (skipped/absent/
      report_unavailable) -- positive evidence admits, everything else collapses into refusal;
      (c) GRAMMAR_ARMS, a DECLARED-cell classification of an acceptance command's shape onto a
      ROUTE, never onto a bare admit/refuse. Exactly three destinations, and every arm names one:
      `single_node_chain` -> JUNIT; `unparseable` (the tokenizer raises) -> REFUSE as
      out_of_grammar, because a command we cannot parse must never be handed to an executor;
      and `mixed_conjunction`, `mixed_other_operator`, `negated_segment`, `no_node_id` and
      `selector_flag` (a pytest segment carrying -k/-m/--deselect, whose selection the report
      cannot be keyed against) -> STATIC, i.e. slice A's probe path, entirely unchanged. Each arm
      carries its own reason string and an unrecognised shape falls to a named residual arm routed
      to STATIC, never silently (Decision 191 spirit: the destination is a declared cell, never an
      absence). Note the asymmetry and keep it: the residual default is STATIC (slice A's existing
      behaviour, no regression) but the PARSE-FAILURE arm is REFUSE (fail-closed), because those
      are different risks -- an unrecognised-but-parseable shape is merely outside junit's
      competence, while an unparseable one is a command whose segments we cannot enumerate at all;
      (d)
      node_key(node_id) -> (classname, name), the INVERSE reconstruction; (e)
      index_report(path) -> {(classname, name): arm}; (f) outcome_for(index, node_id) covering the
      parametrize-prefix expansion and the multi-node conjunction; (g)
      junit_verdict(census_doc, junit_path, sha) -> {sha, report_available, source: "junit",
      records: [...]} in slice A's record shape with source "junit". MUST NOT import
      closure_stamps_applicable (constraint 11, inherited from slice A).
  - file: tests/test_rec_trailer_acceptance_junit.py
    action: Create
    purpose: >-
      Mirror test. VERIFIED AT PLAN TIME by running scripts.test_coverage_checker.map_source_to_test
      on the new module: it resolves to exactly this path, so Decision 131's mirror rule is
      satisfied without a colocation exception. Covers TestJunitVerdict (the total arm map; the
      class-based and parametrized node-id inversions against a fixture report carrying NO file=
      attribute; the absent-report arm resolving EVERY entry to unmeasurable rather than a silent
      pass) and TestJunitGrammar (each arm's declared route, the non-empty reason on every arm, the
      parse-failure arm routing to refusal rather than to the probe, and totality of the arm
      classification over a corpus of real acceptance shapes).
  - file: scripts/rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      DEPENDS ON SLICE A'S DECLARED INTERFACE -- this module does not exist in the tree today; slice
      A creates it and an implementer must land A first. Three changes. (1) ROUTING in the census
      stage, a STATIC THREE-ARM PARTITION computed from the acceptance TEXT ALONE -- no report, no
      disk resolution, no execution, no network, and therefore incapable of failing open. An entry
      whose acceptance is a pure, parseable, single top-level segment naming one or more pytest
      `::node_id` targets carries route "junit" and is removed from the probe payload. An entry
      whose acceptance carries a pytest invocation but CANNOT BE TOKENIZED is REFUSED as
      out_of_grammar and is likewise never probed -- a command whose segments cannot be enumerated
      must not reach an executor. EVERY OTHER ENTRY keeps slice A's "static" route completely
      unchanged, including the mixed &&-joined, negated, piped and bare-`pytest <path>` shapes:
      slice A's probe runs those chains exactly as it would without this plan, so this plan
      regresses nothing. The routing is gated on the command's GRAMMAR, never on whether the junit
      report exists -- that distinction is load-bearing: gating on the report would make a missing
      artifact fall back to probing, which is the absence-of-evidence shape this run removed from
      slice A. `scripts.backlog_health.probe.is_pytest_command` remains the predicate for "this
      command runs pytest" (reused, never re-minted -- probe.run_one branches on it for its own
      pytest timeout, so a second predicate could disagree with the executor's); the partition
      narrows WITHIN that set rather than replacing it.
      (2) rejoin gains the junit verdict document and REFUSES when a rec_id appears in BOTH
      documents -- two sources for one rec is the TAP hazard at the transport layer, and a routing
      defect must fail the closure rather than pick a winner. (3) a junit-verdict CLI verb as a
      THIN ADAPTER (Decision 162 spirit), and the close verb gains --junit-verdict. `source` stays
      the extension point slice A declared; this plan adds exactly one new value.
  - file: tests/test_rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      DEPENDS ON SLICE A'S DECLARED INTERFACE -- slice A creates this file. Add TestJunitRouting:
      the partition is computed from the command text with the junit report absent (proving it is
      static); a pure single-segment node-id command leaves the probe payload; a mixed, negated,
      piped or bare-path pytest command REMAINS in the probe payload exactly as under slice A; an
      unparseable pytest-carrying command is refused and reaches neither route; and rejoin refuses
      a rec_id present in both verdict documents. The mixed-stays-probed arm is the one that proves
      no regression, so it is not optional. Do NOT disturb slice A's TestVerdictMapping or
      TestCensus classes -- both carry graduated shards.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      One new push-only job plus one needs edit. trailer-junit-verdict declares
      `needs: [trailer-census, main-validate]`, `if: always() && github.event_name == 'push'` (a
      BARE always() is read by scripts/verify_ci_workflow/_ci_yaml.py::_admits_pull_request as
      PR-gating and would force the job into signal-green.needs -- verified by reading that
      function: an `if` naming push and not pull_request returns False), and
      `permissions: {contents: read}` with NO id-token grant and no secret env (Decision 143, the
      same split slice A gives its evaluator job). Its artifact download is a `uses:` step
      (actions/download-artifact) with `continue-on-error: true` and NO run-id input -- so
      provenance is STRUCTURAL: the report can only be the current run's. A `uses:` step carries no
      `run:` body and is not governed by the R3 ratchet at all. Its only `run:` body is the
      one-line thin adapter. trailer-closure gains trailer-junit-verdict in `needs` and passes
      --junit-verdict. DECLARED COST, stated here because it changes agent-visible behaviour:
      trailer-closure now waits behind `main-validate`, so trailer closure completes roughly 16 to
      20 minutes after the merge rather than within a couple of minutes. That is unavoidable --
      consuming the authoritative verdict means waiting for the run that produces it -- and it
      interacts directly with slice A's post-merge closeout instruction, which slice A rewrote from
      a "~5 min" wall clock to "wait for the trailer-closure job to CONCLUDE". An agent following
      that instruction must treat a twenty-minute wait as EXPECTED rather than as a hang, and slice
      A's own scope row for .claude/skills/implement/SKILL.md is where that expectation belongs;
      confirm during implementation that A's wording does not reintroduce a wall-clock threshold.
      SECOND INTERACTION, from PLAN-backlog-health-probe-decides-pytest: that plan's new registered
      check validate_sandbox_runner_test_deps arms on marker M2 -- a job whose step bodies invoke
      scripts.backlog_health's probe verb OR any module importing scripts.backlog_health.probe.
      scripts/rec_trailer_acceptance.py imports that module for is_pytest_command, so THIS job may
      arm M2 even though it never probes. Complying costs one install line and is the fail-safe
