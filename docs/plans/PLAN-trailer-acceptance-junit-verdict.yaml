schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: trailer-acceptance-junit-verdict
intent: >-
  Add the SECOND verdict source to the closure-time trailer acceptance gate slice A installs: a
  junit ::node_id verdict READ from the authoritative pytest-junit report the same push run already
  produced, plus an unconditional exclusion of every pytest-carrying acceptance from the sandboxed
  static probe -- so one test never yields two verdicts that can disagree with no tiebreak.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-trailer-acceptance-junit-verdict.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec (carrying rec rec-3984); names NO tier_item, so the Tier
  Item Freshness Gate is skipped. Identical scoping to slice A (PLAN-trailer-acceptance-static-gate,
  merged #1253) by operator-confirmed slice boundary. T3.9 is the nearest tier_item and is
  deliberately NOT claimed, for the reason slice A records under its own T3.9 boundary note.
scope:
  - file: docs/plans/PLAN-trailer-acceptance-junit-verdict.yaml
    action: Modify
    purpose: >-
      This plan's own path -- always touched per docs/contracts/implement-scope-boundary.yaml's
      implementing_plan_bookkeeping sanction row, whose permitted_field_edits lists
      implementation_declared FIRST. Flip implementation_declared to true after code review and a
      full-tier pass. Omitting this row leaves the plan out of the diff and makes
      validate_graduation_completeness, validate_scope_boundary and validate_vp_replay all no-op,
      satisfying VP step 13 VACUOUSLY (slice-0 lesson, cost a full code-review round there).
  - file: scripts/rec_trailer_acceptance_junit.py
    action: Create
    purpose: >-
      The junit verdict SOURCE, a sibling of slice A's scripts/rec_trailer_acceptance.py rather than
      a growth of it (Decision 128 decompose-by-default; slice A's module is not yet in the tree so
      its post-implementation SLOC cannot be measured at plan time, and growing an unmeasurable file
      is exactly the crossing Decision 128 forbids planning blind). Concerns, all pure and
      filesystem-only: (a) JUNIT_ARMS, a frozen total outcome vocabulary
      {passed, failed, errored, skipped, absent, report_unavailable}; (b) verdict_for_junit(arm), a
      TOTAL map onto slice A's ACCEPTANCE_VERDICTS where ONLY `passed` yields `holds` and every
      other arm yields `fails` (failed/errored) or `unmeasurable` (skipped/absent/
      report_unavailable) -- positive evidence admits, everything else collapses into refusal;
      (c) GRAMMAR_ARMS, a DECLARED-cell classification of an acceptance command's shape, with one
      admitted arm (single_node_chain) and four refused arms each carrying its own reason string
      (mixed_conjunction, mixed_other_operator, negated_segment, no_node_id) plus a fifth
      (selector_flag) for a pytest segment carrying -k/-m/--deselect, whose selection the report
      cannot be keyed against; an unrecognised shape falls to a named residual arm, never silently
      (Decision 191 spirit: exclusion is a declared cell, never an absence); (d)
      node_key(node_id) -> (classname, name), the INVERSE reconstruction; (e)
      index_report(path) -> {(classname, name): arm}; (f) outcome_for(index, node_id) covering the
      parametrize-prefix expansion and the multi-node conjunction; (g)
      junit_verdict(census_doc, junit_path, sha) -> {sha, report_available, source: "junit",
      records: [...]} in slice A's record shape with source "junit". MUST NOT import
      closure_stamps_applicable (constraint 9, inherited from slice A).
  - file: tests/test_rec_trailer_acceptance_junit.py
    action: Create
    purpose: >-
      Mirror test. VERIFIED AT PLAN TIME by running scripts.test_coverage_checker.map_source_to_test
      on the new module: it resolves to exactly this path, so Decision 131's mirror rule is
      satisfied without a colocation exception. Covers TestJunitVerdict (the total arm map; the
      class-based and parametrized node-id inversions against a fixture report carrying NO file=
      attribute; the absent-report arm resolving EVERY entry to unmeasurable rather than a silent
      pass) and TestJunitGrammar (every arm's admission or refusal, the declared reason on each
      refused arm, and totality of the arm classification over a corpus of shapes).
  - file: scripts/rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      DEPENDS ON SLICE A'S DECLARED INTERFACE -- this module does not exist in the tree today; slice
      A creates it and an implementer must land A first. Three changes. (1) ROUTING in the census
      stage: an entry whose acceptance satisfies the EXISTING, ratified predicate
      scripts.backlog_health.probe.is_pytest_command is removed from the probe payload
      UNCONDITIONALLY and carries route "junit"; every other entry keeps slice A's "static" route
      unchanged. This is the TAP exclusion and it is not conditional on the junit report existing,
      on the grammar admitting the command, or on the census bucket -- a pytest command is never
      executed by this pipeline under any branch. Reusing probe.is_pytest_command rather than
      minting a second predicate is deliberate: probe.run_one already branches on it for its
      pytest timeout, so a second predicate could disagree with the one the executor itself uses.
      (2) rejoin gains the junit verdict document and REFUSES when a rec_id appears in BOTH
      documents -- two sources for one rec is the TAP hazard at the transport layer, and a routing
      defect must fail the closure rather than pick a winner. (3) a junit-verdict CLI verb as a
      THIN ADAPTER (Decision 162 spirit), and the close verb gains --junit-verdict. `source` stays
      the extension point slice A declared; this plan adds exactly one new value.
  - file: tests/test_rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      DEPENDS ON SLICE A'S DECLARED INTERFACE -- slice A creates this file. Add TestTapExclusion:
      a pytest-carrying acceptance never reaches the probe payload for every census bucket
      including probeable; the same holds when the junit report is missing and when the grammar
      refuses the command; and rejoin refuses a rec_id present in both verdict documents. Do NOT
      disturb slice A's TestVerdictMapping or TestCensus classes -- both carry graduated shards.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      One new push-only job plus one needs edit. trailer-junit-verdict declares
      `needs: [trailer-census, main-validate]`, `if: always() && github.event_name == 'push'` (a
      BARE always() is read by scripts/verify_ci_workflow/_ci_yaml.py::_admits_pull_request as
      PR-gating and would force the job into signal-green.needs -- verified by reading that
      function: an `if` naming push and not pull_request returns False), and
      `permissions: {contents: read}` with NO id-token grant and no secret env (Decision 143, the
      same split slice A gives its evaluator job). Its artifact download is a `uses:` step
      (actions/download-artifact) with `continue-on-error: true` and NO run-id input -- so
      provenance is STRUCTURAL: the report can only be the current run's. A `uses:` step carries no
      `run:` body and is not governed by the R3 ratchet at all. Its only `run:` body is the
      one-line thin adapter. trailer-closure gains trailer-junit-verdict in `needs` and passes
      --junit-verdict. VERIFIED at plan time that adding main-validate to a `needs` list cannot
      sweep this job into the full-tier set: _full_tier_jobs derives membership from a job's own
      steps_text containing the literal `scripts.validate`, never from the needs graph
      (scripts/verify_ci_workflow/_shared.py lines 48-64). No step text may contain
      `scripts.validate`, and no check-like module name matching ^(validate|verify|check) may
      appear (_check_validate_single_source). ci.yml measures 220 effective lines today against the
      ci_workflows class's 500 (Decision 166); slice A lands three jobs first, so measure again
      before writing.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Register the ONE new inline `run:` body under r3_workflows at its exactly-measured effective
      count. The r3_workflows RegistrySpec sets gates_new_entry True and _marker_guard.check_diff
      requires a marker on EVERY new entry regardless of value, so a thin adapter shrinks the count
      but never removes the marker obligation. The entry carries
      `# raise-approved: dec-NNN <reason>` citing THE DECISION SLICE A LANDS, whose body is required
      by slice A's own scope row to mention `.github/workflows/ci.yml`. DO NOT HARDCODE THAT NUMBER
      -- slice A resolves it at ITS implement time, so resolve it here by grepping DECISIONS.md for
      the landed entry that names ci.yml and the verdict layer. Decision 165 point 2 makes this
      marker RETROACTIVELY authorization-checked on every --pre and full run, not only in the diff
      that adds it, so a wrong number reddens main forever rather than once.
  - file: scripts/checks/ci_guards/validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      EXTEND the registered check again (never a new one) -- its pre_globs already cover
      .github/workflows/** and docs/contracts/git-ops.yaml, and config/ci_rca_taxonomy.yaml already
      carries its function_to_category row, so extension needs no new glob, no taxonomy row and no
      check_accounting_baseline entry. pre_globs are WIDENED BY NOTHING and NARROWED BY NOTHING, so
      Decision 187 point 3's tier-demotion marker is not engaged. The new assertions are DERIVED,
      NOT ENUMERATED (Decision 187 point 1, applied at the scout's flag): they iterate EVERY ci.yml
      job whose steps reference a verdict artifact and assert of each that it declares no id-token
      permission and no secret env, rather than pinning the single literal job name
      trailer-junit-verdict -- a renamed or DUPLICATED verdict job is then caught, which a name
      literal would miss. Two further assertions: every such job's artifact download step names no
      run-id (the same-run provenance binding), and docs/contracts/git-ops.yaml states the
      source-admission clause. Reading git-ops.yaml by basename literal is already how Decision 168
      point 2's evaluator binding resolves here and stays unchanged. Keep examined()/skipped() on
      every reachable path (Decision 170) and raise the examined count. Update the module DOCSTRING,
      which slice A already rewrites -- re-point it again rather than leaving A's count stale.
  - file: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      Add TestJunitJobAssertions with a passing AND a failing limb for each new assertion --
      including a fixture in which a SECOND, differently-named verdict-consuming job declares
      id-token, which the derived assertion must FAIL and a name-literal assertion would pass. Slice
      A raises and renames TestPassPath's examined-count test; raise it again to the new count
      under whatever name A leaves it, and re-read that file before editing rather than assuming
      the name. Do NOT rename or relocate
      TestRemovalNegatives::test_read_returns_none_on_oserror -- the graduated shard
      rec-autoclose-trailer-gate-read-oserror pins it. 98 effective lines today, 402 headroom
      before slice A's additions.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Add a `sources` sub-key to the trailer_acceptance_gate key slice A creates, plus a new
      amendment_log[] entry and a contract_version bump (2 -> 3 is slice A's; this plan takes 3 ->
      4 -- read the live value, never assume). Content: the two verdict sources and the population
      each covers; the SOURCE-ADMISSION rule (no verdict source may execute a command whose outcome
      an authoritative record already carries -- the TAP rule, which is what makes the junit route
      a retrieval of the rec's own oracle rather than a substitute for it, and therefore what keeps
      Decision 103's "the deterministic probe is the rec's existing acceptance oracle" satisfied);
      the DECLARED grammar arms with a reason per refused arm; the same-run provenance binding and
      why it is structural rather than content-keyed (a junit report carries no sha); the rejoin
      disjointness refusal; and ONE declared residual naming its owner per Decision 181 clause 2 --
      the refused mixed and bare-pytest shapes, owned by rec-4002 with the measured population
      recorded there. 304 effective lines today against the 500 the graduated shard
      new-contracts-within-structural-size-class pins by a live grep, so slice A's edit plus this
      one must stay well inside it.
  - file: config/agent/verification_registry/entries/git-ops-trailer-carrier-and-placement-rules.yaml
    action: Modify
    purpose: >-
      RE-POINT, the silent-rot correction. This shard's check_spec greps
      `contract_version:[[:space:]]*2` against docs/contracts/git-ops.yaml. Slice A re-points it to
      3; this plan bumps the contract again, so it must be re-pointed to the value THIS change
      leaves behind or the shard asserts a false fact. Nothing would redden if it were left --
      validate_verification_registry replays only added-or-modified entries -- which is precisely
      why it must be corrected deliberately. Its other three greps are unaffected.
  - file: config/agent/verification_registry/entries/trailer-acceptance-pytest-is-never-probed.yaml
    action: Create
    purpose: >-
      Graduate VP step 1 as a test_selector shard over TestTapExclusion. This is the load-bearing
      invariant of the whole slice -- the property that makes the TAP hazard structurally
      impossible rather than merely avoided (Decision 163: executed, not declared) -- so it gets
      its own standing guard. VP steps 5 waives against this row.
  - file: config/agent/verification_registry/entries/trailer-acceptance-junit-verdict-positive-evidence-only.yaml
    action: Create
    purpose: >-
      Graduate VP step 2 as a test_selector shard over TestJunitVerdict, covering the total arm map,
      the node-id inversion that does not depend on a file= attribute, and the absent-report arm.
      VP steps 6 and 7 waive against this row.
  - file: config/agent/verification_registry/entries/trailer-acceptance-junit-grammar-arms-declared.yaml
    action: Create
    purpose: >-
      Graduate VP step 3 as a test_selector shard over TestJunitGrammar, pinning that every refused
      shape lands in a NAMED arm carrying a reason rather than falling through an absence. VP step 8
