bundled_recommendations:
  - rec-3984
followon_recs:
  - rec-4002
  - rec-4003
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    NO pytest command authored by a recommendation is ever executed by this pipeline. An entry whose
    acceptance satisfies scripts.backlog_health.probe.is_pytest_command is removed from the probe
    payload unconditionally -- for every census bucket, whether or not the junit report exists, and
    whether or not the grammar admits the command. There is one verdict per test and it is the one
    the merge gate itself consumed.
  - >-
    The junit verdict admits ONLY on positive evidence: a testcase present in the report for the
    named node with no failure, error or skipped child. failed and errored yield `fails`; skipped,
    absent and report_unavailable yield `unmeasurable`. There is no branch in which the absence of
    a signal reads as a pass, and the arm map is TOTAL and asserted total.
  - >-
    A node id is resolved against the report by INVERTING the mapping -- the known target node id is
    converted into the (classname, name) pair the report carries -- never by reconstructing a path
    from classname. Verified at plan time: pyproject.toml sets no junit_family, pytest's default
    xunit2 applies, and a report generated from this repo's own suite carries ZERO `file=`
    attributes, with classname="tests.ci_rca.test_close_recs_from_trailer" for a module-level test
    and a dotted class suffix for a class-based one. scripts/ci_rca/fingerprint.py's
    _nodeid_from_testcase is therefore NOT reused; its defect is filed as rec-4003.
  - >-
    A parametrized target without a bracket suffix matches every report entry whose name is the
    target or starts with target[, and all must pass -- pytest's own selection semantics. A segment
    naming several node ids passes only when every one of them does.
  - >-
    Every acceptance shape is classified into a NAMED grammar arm -- one admitted, five refused,
    each refused arm carrying its own reason string. A shape matching no arm falls to a named
    residual arm and refuses; it never falls through silently (Decision 191: exclusion is a declared
    cell, never an absence).
  - >-
    The junit job declares permissions {contents: read} with no id-token grant and no secret env,
    and the registered guard asserts that of EVERY ci.yml job consuming a verdict artifact -- a
    derived set, not the single job-name literal -- so a renamed or duplicated verdict job cannot
    escape it (Decision 143 boundary, Decision 187 derivation discipline).
  - >-
    Provenance is structural: the artifact download step names no run-id and no cross-run token, so
    the report can only be the current push run's, whose head_sha is the merge commit slice A's
    predicate compares against. The guard asserts the absence of a run-id input, which is a positive
    check on the step's own shape rather than a claim about what did not happen.
  - >-
    rejoin REFUSES when a rec_id carries records in both verdict documents. Two sources for one rec
    is the TAP hazard at the transport layer, and a routing defect fails the closure rather than
    silently electing a winner.
  - >-
    This slice is a strict TIGHTENING, never a weakening (Decision 186 point 8): measured over 1330
    open recs, 82 that slice A alone would have closed by probing now refuse. No rec closes under
    slice B that would not have closed under slice A. The refused population is declared in
    docs/contracts/git-ops.yaml with rec-4002 as its named owner, with the per-arm counts recorded
    there (66 mixed &&-only, 8 mixed with another operator, 8 negated; the 73 bare-pytest recs were
    already refused by slice A's require_decidable).
  - >-
    NO new numbered Decision is minted. The three Decision 167 property tests were run and route
    this content to the existing contract home: the envelope test is moot because no entry is
    drafted; the contract-first test resolves because
    docs/contracts/git-ops.yaml#trailer_acceptance_gate already exists, is Class D and is already
    evaluator-bound by this plan's own registered check (Decision 168 point 2); and the
    amendment_forms test names the fallback -- if a reviewer holds that the TAP rule needs
    Decision-level force, it routes to a DATED ANNOTATION on slice A's landed Decision (Decision 177
    dialect), never to a fresh number.
  - >-
    rec-3984 is resolved by this plan and named in its Resolves: trailer, and its acceptance is
    UPDATED FIRST so the oracle that closes it actually tests what the rec is about. Its acceptance
    as filed names three greps that slice A alone satisfies, so trailer-closing it unchanged would
    be the exact false-closure shape this two-slice run exists to stop. The corrected acceptance is
    a single pure pytest ::node_id naming this slice's TAP-exclusion test, which makes rec-3984
    junit-routed: it closes only if the junit source it asked for actually works.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      A pytest-carrying acceptance is never sent to the static probe, under every branch -- and
      rejoin refuses a rec_id carried by both sources.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestTapExclusion" -q
    expected: >-
      The probe payload excludes every pytest-carrying entry for every census bucket including
      probeable, with the junit report present and absent and with the grammar admitting and
      refusing; and a rec_id present in both verdict documents raises rather than resolving.
    fix_if: >-
      A probeable pytest entry survives into the payload -- the TAP hazard is live and one test can
      yield two verdicts. Or rejoin picks a winner instead of refusing.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-pytest-is-never-probed
    expected_literals:
      - "passed"
  - step: 2
    phase: pre-deploy
    action: >-
      The junit arm map is total, admits only on positive evidence, and resolves class-based and
      parametrized node ids without a file= attribute.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance_junit.py::TestJunitVerdict" -q
    expected: >-
      Every JUNIT_ARMS member maps to exactly one ACCEPTANCE_VERDICTS member with only passed
      yielding holds; a class-based node id resolves against a fixture report carrying no file=
      attribute; and an absent report resolves every entry to unmeasurable.
    fix_if: >-
      An arm maps to None, or a missing testcase resolves to holds -- absence would then read as a
      pass. Or the class-based lookup fails, which means the reconstruction was copied from
      fingerprint.py rather than inverted.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-junit-verdict-positive-evidence-only
    expected_literals:
      - "passed"
  - step: 3
    phase: pre-deploy
    action: Every acceptance shape lands in a named grammar arm carrying a reason; none falls through an absence.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance_junit.py::TestJunitGrammar" -q
    expected: >-
      The admitted arm accepts a single-segment multi-node command; each refused arm is returned for
      its own shape and carries a non-empty reason; and an unrecognised shape returns the named
      residual arm rather than None.
    fix_if: >-
      A shape returns None or falls to the admitted arm by default -- the grammar is then a pattern
      someone thought of rather than a declared classification, and an unanticipated shape would be
      probed or closed.
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-acceptance-junit-grammar-arms-declared
    expected_literals:
      - "passed"
  - step: 4
    phase: pre-deploy
    action: >-
      The extended guard asserts, over a DERIVED set of verdict-consuming jobs, that each is
      credential-free and downloads only from its own run.
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestJunitJobAssertions" -q
    expected: >-
      Each new assertion has a passing AND a failing limb, including a fixture whose SECOND,
      differently-named verdict-consuming job declares id-token and is caught; the run-id absence
      assertion fails when a cross-run download is introduced; and the check still declares
      examined()/skipped() on every path.
    fix_if: >-
      The id-token limb passes on the differently-named job -- the assertion is keyed on a job-name
      literal, so a duplicate escapes it (Decision 187 point 1).
    hermetic: true
    graduation: graduate
    graduation_check_id: trailer-junit-job-credential-free-and-same-run
    expected_literals:
      - "passed"
  - step: 5
    phase: pre-deploy
    action: A rec_id present in both verdict documents refuses the rejoin rather than electing a source.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance.py::TestTapExclusion::test_rejoin_refuses_a_rec_id_present_in_both_verdict_documents" -q
    expected: The rejoin raises; neither record is used.
    fix_if: One record wins silently -- a routing defect would then close a rec on whichever source happened to be ordered first.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 1, which still graduates: this node id is literally a member of
      step 1's class selector tests/test_rec_trailer_acceptance.py::TestTapExclusion, so step 1's
      standing guard runs this exact assertion on every subsequent diff. A second registry row would
      pin the same method twice.
  - step: 6
    phase: pre-deploy
    action: An absent or unreadable junit report resolves EVERY junit-routed entry to unmeasurable, never to a pass.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance_junit.py::TestJunitVerdict::test_absent_report_resolves_every_entry_to_unmeasurable" -q
    expected: report_available is false and every record carries verdict unmeasurable with arm report_unavailable.
    fix_if: >-
      Any entry resolves to holds -- the pipeline would then close recs on the strength of a
      measurement that never happened, which is the failure Decision 190 rules out for the
      convergence record and the same shape here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 2, which still graduates: this node id is literally a member of
      step 2's class selector tests/test_rec_trailer_acceptance_junit.py::TestJunitVerdict, so the
      standing guard step 2 installs runs this exact assertion.
  - step: 7
    phase: pre-deploy
    action: A class-based node id resolves against a report carrying no file= attribute -- the inversion, not fingerprint.py's reconstruction.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance_junit.py::TestJunitVerdict::test_class_based_node_id_resolves_without_file_attribute" -q
    expected: The target tests/x.py::TestKlass::test_y matches the testcase classname="tests.x.TestKlass" name="test_y".
    fix_if: >-
      The lookup misses -- the code reconstructs a path from classname (fingerprint.py's branch,
      which yields tests/x/TestKlass.py) instead of inverting a known node id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 2, which still graduates: this node id is literally a member of
      step 2's class selector TestJunitVerdict, so it is covered by that standing guard.
  - step: 8
    phase: pre-deploy
    action: Every refused grammar arm carries its own declared reason string.
    command: bin/venv-python -m pytest "tests/test_rec_trailer_acceptance_junit.py::TestJunitGrammar::test_every_refused_arm_declares_a_reason" -q
    expected: Each refused arm maps to a non-empty reason, and the reason set has no duplicates.
    fix_if: >-
      An arm has an empty reason -- the refusal then tells an operator nothing about which rewrite
      would make the acceptance decidable.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 3, which still graduates: this node id is literally a member of
      step 3's class selector tests/test_rec_trailer_acceptance_junit.py::TestJunitGrammar.
  - step: 9
    phase: pre-deploy
    action: The credential assertion is derived, so a differently-named duplicate verdict job declaring id-token is caught.
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestJunitJobAssertions::test_fails_when_a_verdict_consuming_job_declares_id_token" -q
    expected: The check appends to failed for the fixture job, whatever that job is named.
    fix_if: It passes -- the assertion enumerates a job name instead of deriving the set, so the Decision 143 boundary has a rename-shaped hole.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 4, which still graduates: this node id is literally a member of
      step 4's class selector
      tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py::TestJunitJobAssertions.
  - step: 10
    phase: pre-deploy
    action: docs/contracts/git-ops.yaml declares the source-admission clause the registered evaluator reads.
