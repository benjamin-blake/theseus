constraints:
  - >-
    HARD DEPENDENCY ON SLICE A. PLAN-trailer-acceptance-static-gate merged as #1253 but landed as a
    PLAN DOCUMENT ONLY -- scripts/rec_trailer_acceptance.py, ACCEPTANCE_VERDICTS,
    assert_acceptance_verdict, update_rec's acceptance_verdict kwarg,
    close_recs_from_trailer's require_acceptance_verdict, and ci.yml's trailer-census /
    trailer-acceptance-evaluate / trailer-closure jobs DO NOT EXIST IN THE TREE. Every scope row
    naming them is written against slice A's DECLARED interface. Slice A must be implemented and
    merged before this plan is implemented; re-read each of those surfaces before editing and do
    not assume a name slice A's plan text used for one it actually shipped.
  - >-
    HARD ORDERING DEPENDENCY, not a note. Implement in this order: (1)
    PLAN-trailer-acceptance-static-gate (slice A), (2)
    PLAN-backlog-health-probe-decides-pytest, (3) THIS PLAN. Step 2 is load-bearing for step 3's
    correctness, not merely nice to have, for two independently sufficient reasons measured at
    plan time. (a) The probe job installs only requirements.txt and `pytest` ships in
    requirements-dev.txt / requirements-fast.txt, NOT requirements.txt -- so on today's probe every
    mixed chain routed to the static path returns a confident `fails` that means "the evaluator has
    no pytest", not "your acceptance did not hold". (b) scripts/backlog_health/probe.py's
    _isolated_argv builds `... && exec {cmd}`, and in bash `exec A && B` replaces the shell with A
    so B never runs -- verified directly in this session: `probe.run_one("/bin/true && /bin/false")`
    returns **pass**. A compound chain's verdict is therefore computed from its FIRST SEGMENT ALONE,
    which for the dominant `grep -q X f && pytest f::Node` shape means the pytest leg never ran and
    the false pass is attributed to the whole command. Both defects are repaired by step 2. Landing
    this plan before step 2 would route 153 recs to a probe that cannot decide them correctly.
  - >-
    THE LOAD-BEARING INVARIANT: consume the authoritative verdict rather than producing a second one
    for the population where a second one is avoidable. This is achieved by a STATIC PARTITION, not
    by an unconditional exclusion: the route is a function of the acceptance text alone, so exactly
    one source ever produces a verdict for any one rec, and the partition cannot fail open because
    it consults nothing that can be missing. Gating on the GRAMMAR is sound; gating on whether the
    junit report exists would NOT be, because a missing artifact would silently fall back to the
    probe, which is the absence-of-evidence shape this run removed from slice A. Do not conflate the
    two kinds of conditioning.
  - >-
    Decision 143 (inherited from slice A, SETTLED): the junit job holds permissions
    {contents: read}, no id-token grant and no writer secret, and the guard's assertion of that is
    escape-free -- no marker, no allowlist, no skip path.
  - >-
    Decision 187 point 1 derivation discipline: the guard's new assertions iterate a DERIVED set of
    verdict-consuming ci.yml jobs, never a committed job-name roster. A name literal would be
    escaped by a rename or a duplicate, which is exactly the failure mode that Decision retired the
    four roster constants for. pre_globs are neither widened nor narrowed, so point 3's
    tier-demotion marker is not engaged.
  - >-
    Decision 186 point 2 ONE ENFORCEMENT SITE: this plan adds a verdict SOURCE, never a second gate.
    Nothing asserts a verdict outside update_rec. Decision 186 point 8's weakening ratchet is not
    engaged because every change here refuses strictly more than slice A alone.
  - >-
    Decision 103's binding clause -- "The deterministic probe is the rec's existing acceptance
    shell-command oracle. No new acceptance machinery is introduced." -- is satisfied, not crossed
    again: the junit record IS the outcome of running the rec's own oracle, retrieved rather than
    re-produced, which is strictly more faithful to that clause than a sandboxed re-run. State this
    in the contract clause; it is the argument a reviewer will ask for. The verdict LAYER's crossing
    of 103 is slice A's and is already amended by slice A's landed Decision.
  - >-
    Decision 191 (spirit, surfaced by the decision-scout gate): "Exclusion is a DECLARED cell
    (apply false + reason), never an absence." The grammar therefore enumerates its refused arms with
    per-arm reasons instead of admitting a shape pattern and letting everything else fall through.
  - >-
    Decision 190 (same discipline, different surface): an unreadable measurement resolves to the
    non-benign verdict. An absent or malformed junit report is report_unavailable -> unmeasurable for
    EVERY junit-routed entry, never a pass for any of them, mirroring slice A's isolation_unavailable
    arm and Decision 142 point 2's already-ratified best-effort, never-blocking junit consumption.
  - >-
    Do NOT reuse scripts/ci_rca/fingerprint.py::_nodeid_from_testcase. Verified live at plan time:
    pyproject.toml sets no junit_family, so xunit2 applies and no file= attribute is emitted, which
    forces that function's classname branch, and that branch computes classname.replace(".","/") +
    ".py" -- mangling every class-based node id. rec-4003 owns the fix on the ci-rca side; Decision 59
    forbids fixing it inline here.
  - >-
    scripts/rec_trailer_acceptance_junit.py MUST NOT import closure_stamps_applicable. The graduated
    shard tests/ops_data_portal/test_closure_gate.py::TestContractParity::
    test_stamp_precondition_call_sites_match_importers derives importers of that symbol by AST, and a
    new importer would require editing ci-rca-lifecycle.yaml's stamp_precondition.call_sites in the
    same PR -- a contract this plan deliberately does not touch.
  - >-
    docs/contracts/ci-rca-lifecycle.yaml is DELIBERATELY NOT in scope, a departure from the dossier's
    slice boundary, on measured grounds: it stands at 476 effective lines today and slice A's own
    scope row budgets about 20 more against the contracts class's 500, leaving roughly 4. Slice A
    also already widens closure_dependency.trap from rec-autoclose to the CI workflow, which is the
    clause a junit dependency would have needed. The junit-specific dependency is sited in
    git-ops.yaml instead, which has 196 effective lines of headroom before slice A's edit.
    config/ci_rca_taxonomy.yaml is likewise not in scope: the operator moved its rec-autoclose
    rationale correction into slice A.
  - >-
    Decision 128 SLOC and the live 500-line pins: the junit source is a NEW sibling module rather
    than growth of slice A's un-measurable one. docs/contracts/git-ops.yaml is pinned at 500
    effective lines by the graduated shard new-contracts-within-structural-size-class, which greps it
    live, and .github/workflows/ci.yml sits in the ci_workflows 500 class (Decision 166) at 220
    effective lines before slice A's three jobs.
  - >-
    Decision 189 red-before: the partition is graduation == "graduate" ALONE; hermetic false does NOT
    exempt. All four graduate steps were replayed against this tree during planning and each exits 4
    (target_absent): the two new test modules do not exist and TestTapExclusion / TestJunitJobAssertions
    name classes that do not. No graduate step invokes scripts.validate. Use POSIX grep, never rg
    (absent from the runner, and rg_portability_lint refuses it).
  - >-
    Decision 73: --pre exits 0 while printing "Failed checks" outside CI. Read the SUMMARY, never the
    exit code. The full tier takes 16 to 20 minutes on this container and is not waivable.
  - >-
    Decision 55/72: no rescue agents, no workaround loops. The gate refuses and surfaces; it never
    files, retries, synthesises or downgrades. A junit verdict that is not holds leaves the rec OPEN
    with slice A's marker and its close_proposed command.
  - >-
    COHESION WARNING, load-bearing for the waivers: VP steps 5 to 10 all waive against a class
    selector that literally contains their node id. A later refactor that moves any of those methods
    out of its class would silently un-cover it with nothing failing. If the classes are ever tidied,
    re-home the graduated shard in the same change.
  - bin/venv-python never python/python3; Linux/bash only; line length 127; type hints; no emojis; no em dashes; no comments unless the why is non-obvious.
