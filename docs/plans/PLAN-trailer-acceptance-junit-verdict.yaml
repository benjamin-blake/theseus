      tests slice A only. Re-run the portal update; never hand-edit the cache (Single Portal
      Invariant). Ordering matters: the gate reads the acceptance AT CLOSURE TIME, so the correction
      must precede the squash merge, not follow it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
