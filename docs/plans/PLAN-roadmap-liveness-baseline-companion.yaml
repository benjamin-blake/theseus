schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "roadmap-liveness-baseline-companion"
intent: >-
  Close the second instance of the scope-boundary blocking contradiction by modelling
  config/roadmap_liveness_baseline.yaml as the forced companion it is: one sanction row derives it
  for any plan whose declared scope includes docs/ROADMAP-PLATFORM.yaml, so a roadmap edit that
  drains a toxic id can carry its own leg-A(d) shrink instead of buying a dedicated amendment PR.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-liveness-baseline-companion.yaml
phase: >-
  Platform verification-system hardening. Ad hoc, soft-warn category ad_hoc_rec; no tier_item claimed
  and no roadmap exit criterion closed, so this plan declares no closes_criteria. RELATED (not
  targeted): T2.55 (frozen shrink-only baselines -- this plan keeps one, it converts none), T2.54
  (clause-to-check traceability -- adds one more clause/pin-test edge).
scope:
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Add the roadmap_liveness_baseline_shrink sanction row (trigger.kind scope_contains_file, file
      docs/ROADMAP-PLATFORM.yaml, path_template config/roadmap_liveness_baseline.yaml) and its dated
      amendment_log entry. Additive only -- no existing row, field, or string is modified.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      Pin the new row's trigger kind, trigger file and path_template, and pin that its amendment_log
      entry carries the determinism argument, the Decision 75 conscious-choice note and both named
      three residuals -- so none of it degrades to prose nothing asserts (Decision 163).
  - file: tests/checks/verification/validate_scope_boundary/conftest.py
    action: Modify
    purpose: >-
      Add the new row to the _DEFAULT_SANCTION_ROWS fixture so every sibling test module exercises the
      real five-row set rather than a stale four-row copy.
  - file: tests/checks/verification/validate_scope_boundary/test_roadmap_liveness_baseline_row.py
    action: Create
    purpose: >-
      Evaluator arms for the new row: roadmap-in-scope sanctions the baseline path; roadmap absent from
      scope still STOPs on it; the row derives nothing beyond its one path.
  - file: docs/plans/PLAN-roadmap-liveness-baseline-companion.yaml
    action: Modify
    purpose: implementation_declared and graduation bookkeeping at closure.
bundled_recommendations: []
followon_recs:
  - rec-3704
infrastructure_dependencies: []
closes_criteria: []
acceptance_criteria:
  - >-
    A plan whose declared scope includes docs/ROADMAP-PLATFORM.yaml may touch
    config/roadmap_liveness_baseline.yaml with no finding, while the identical plan and touched set
    STOP against origin/main's copy of the contract.
  - >-
    A plan whose declared scope omits docs/ROADMAP-PLATFORM.yaml still STOPs on that same touched
    path, and the row derives exactly one path -- config/roadmap_liveness_baseline.yaml -- and nothing
    else.
  - >-
    scripts/checks/verification/validate_scope_boundary.py is byte-identical to origin/main:
    enforcement changed by DATA, not code (the row reuses the already-dispatched scope_contains_file
    trigger kind).
  - >-
    The amendment_log entry argues eligibility on DETERMINISM/LATITUDE -- naming that leg A(a)
    (measured subset-of baseline) and leg A(d) (baseline subset-of measured) jointly pin entries to
    exactly toxic_node_ids(live roadmap), so the grant confers no entry-level freedom -- carries a
    Decision 75 conscious-choice note naming three rejected alternatives, and names THREE residuals:
    the header comment block is unpinned; _BASELINE_SEED and algorithm edits are deliberately uncovered
    and still STOP; and the eligibility key's "a path a tool mechanically regenerates" half no longer
    describes every row in the map, disclosed here and routed to the provisional_v0 re-ratification rather
    than amended in place.
  - >-
    The amendment_log summary does NOT contain the literal token sanction_row_eligibility:
    tests/test_scope_boundary_contract.py asserts exactly one entry carries it, and that entry is the
    2026-09-07 one. The ineligibility contrast is argued descriptively instead.
  - >-
    Decision 59's guard is not weakened -- sanction_row_eligibility is byte-identical to origin/main,
    the tri-surface STOP disposition string is byte-identical across contract row, deviation_trigger
    branch (b) and the check module, no existing sanction row or field is modified, and no row derives
    a tests/** path.
  - >-
    A follow-on rec exists in the warehouse for the self-sanctioning gap (a diff that declares
    docs/contracts/implement-scope-boundary.yaml in its own scope can add a row sanctioning its own
    touched path; only the two-act amendment_procedure prevents this today), its id is recorded in this
    plan's followon_recs, and both halves are asserted by VP step 6 rather than left to inspection.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: false
    action: >-
      THE REPORTED CONTRADICTION REPRODUCED AND CLEARED. One scratch root, one synthetic plan declaring
      only docs/ROADMAP-PLATFORM.yaml in scope, one touched set that includes
      config/roadmap_liveness_baseline.yaml. Leg 1: origin/main's copy of the contract MUST produce the
      out-of-scope finding on that path -- this is the reported STOP, and it is what makes the step red
      before the change. Leg 2: the working-tree contract MUST produce zero findings on the identical
      inputs. Both legs prototyped at plan time on e1370d4f; leg 1 passed and leg 2 failed exactly as a
      red-before step should.
    command: |-
      S=$(mktemp -d) && mkdir -p "$S/docs/contracts" "$S/docs/plans" && bin/venv-python - "$S" <<'PY'
      import pathlib, subprocess, sys, yaml
      from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary

      root = pathlib.Path(sys.argv[1])
      contract = root / "docs/contracts/implement-scope-boundary.yaml"
      plan = {
          "schema_version": 2, "slug": "probe", "intent": "probe", "plan_type": "IMPLEMENTATION",
          "verification_tier": "V2", "plan_path": "docs/plans/PLAN-probe.yaml", "phase": "probe",
          "scope": [{"file": "docs/ROADMAP-PLATFORM.yaml", "action": "Modify", "purpose": "probe"}],
          "acceptance_criteria": ["probe"], "execution_steps": ["probe"], "implementation_declared": True,
          "verification_plan": [{"step": 1, "phase": "pre-deploy", "action": "probe",
                                 "command": "true", "expected": "probe", "fix_if": "probe"}],
      }
      (root / "docs/plans/PLAN-probe.yaml").write_text(yaml.safe_dump(plan), encoding="utf-8")
      touched = ["docs/plans/PLAN-probe.yaml", "docs/ROADMAP-PLATFORM.yaml", "config/roadmap_liveness_baseline.yaml"]

      def findings(contract_text):
          contract.write_text(contract_text, encoding="utf-8")
          out = []
          validate_scope_boundary(out, plan_paths=["docs/plans/PLAN-probe.yaml"], changed_files=touched, root=root)
          return out

      base = subprocess.run(["git", "show", "origin/main:docs/contracts/implement-scope-boundary.yaml"],
                            capture_output=True, text=True, encoding="utf-8", check=True).stdout
      leg1 = findings(base)
      assert any("roadmap_liveness_baseline.yaml" in f and "outside declared scope" in f for f in leg1), \
          f"leg 1: origin/main contract did NOT stop: {leg1}"
      leg2 = findings(pathlib.Path("docs/contracts/implement-scope-boundary.yaml").read_text(encoding="utf-8"))
      assert leg2 == [], f"leg 2: working-tree contract still stops: {leg2}"
      print("DIFFERENTIAL-OK")
      PY
    expected: DIFFERENTIAL-OK
    fix_if: >-
      Leg 1 does not stop -- the row already exists at origin/main, so rebase and re-read; never satisfy
      this leg by weakening the assertion. Leg 2 still stops -- the row was authored under a trigger
      kind validate_scope_boundary does not dispatch (it fails loudly on an unimplemented kind rather
      than skipping), or trigger.file does not equal the declared scope path byte-for-byte.
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: >-
      THE ROW DOES NOT OVER-GRANT, AND THE EVALUATOR IS OTHERWISE UNCHANGED. The whole
      validate_scope_boundary package suite, including the new module's negative arm (a plan NOT scoping
      the roadmap still STOPs on the baseline path) and its derives-nothing-else arm. Red on origin/main:
      the new module does not exist there and the conftest fixture carries four rows, not five.
    command: bin/venv-python -m pytest tests/checks/verification/validate_scope_boundary -q
    expected: all tests pass, including the three new arms
    fix_if: >-
      The negative arm passes when it should fail -- the trigger was authored as an unconditional
      allowlist rather than scope_contains_file, which is the flat-allowlist shape the contract's own
      pin test forbids. A pre-existing arm regresses -- the new fixture row changed a shared expectation;
      fix the fixture, never the assertion.
    graduation: waive
    graduation_waiver_reason: >-
      This whole-package selector already executes as a standing guard in the FULL tier (pre-handoff
      local and post-merge main), so a registry shard would re-run an already-standing guard rather than
      add one. Claimed for the full tier only -- --pre dispatches pytest over derive_affected_tests'
      affected set, which is not a standing-sweep claim.
  - step: 3
    phase: pre-deploy
    hermetic: false
    action: >-
      THE CONTRACT CLAUSES ARE PINNED. The scope-boundary contract test, including the new pins on the
      row's trigger kind/file/path_template and on the amendment_log entry's determinism argument,
      Decision 75 note and three named residuals. Red on origin/main (the row and its entry do not exist
      there, so the new pins raise). This step is also what catches the exactly-one-entry pin on the
      sanction_row_eligibility token if the new summary wrongly names it.
    command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py -q
    expected: all tests pass, including test_sanction_rows_are_conditional_not_flat_allowlist at five rows
    fix_if: >-
      test_bookkeeping_row_documents_the_two_act_amendment_procedure fails on "expected exactly one
      amendment_log entry naming sanction_row_eligibility" -- the new summary used the literal token.
      The repair is to argue the ineligibility contrast descriptively; never loosen that pin.
      test_sanction_row_eligibility_excludes_hand_written_test_files fails -- the new row derives or
      triggers on a tests/** path, which it must not.
    graduation: waive
    graduation_waiver_reason: >-
      Same standing-guard duplication as step 2: this selector already runs unscoped in the FULL tier.
      Step 4 carries this plan's genuinely new, graduated invariant instead.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      THE ROW EXISTS AND DERIVES EXACTLY ONE PATH -- this plan's genuinely new, standing invariant, and
      the only assertion here that no existing test already makes. Red on origin/main (the row is absent,
      so the lookup raises KeyError).
    command: |-
      bin/venv-python -c "import yaml,pathlib; r=yaml.safe_load(pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text(encoding='utf-8'))['sanction_rows']['roadmap_liveness_baseline_shrink']; assert r['trigger']['kind']=='scope_contains_file', r['trigger']; assert r['trigger']['file']=='docs/ROADMAP-PLATFORM.yaml', r['trigger']; assert r['sanctions']['path_template']=='config/roadmap_liveness_baseline.yaml', r['sanctions']; assert r.get('prohibited_field_edits')==[], r; print('ROW-SHAPE-OK')"
    expected: ROW-SHAPE-OK
    fix_if: >-
      KeyError on the row name -- the row was authored under a different key; the graduated check_id and
      this command pin the name roadmap_liveness_baseline_shrink. An assertion on trigger.kind fails --
      a new bespoke kind was invented instead of reusing scope_contains_file, which would require the
      evaluator edit this plan forbids.
    graduation: graduate
    graduation_check_id: scope-boundary-roadmap-liveness-row-shape
  - step: 5
    phase: pre-deploy
    hermetic: false
    action: >-
      NON-WEAKENING BYTE-IDENTITY AGAINST origin/main. Two surfaces this change must not move at all:
      the evaluator module (enforcement changes by data, not code) and the sanction_row_eligibility
      block (settled by PR #1111; this plan satisfies it rather than re-litigating it). Byte-identity is
      what step 3's existing content pins cannot assert -- they check tokens, not that nothing moved.
    command: |-
      git diff --quiet origin/main -- scripts/checks/verification/validate_scope_boundary.py || { echo "EVALUATOR MOVED"; exit 1; }
      bin/venv-python - <<'PY'
      import pathlib, subprocess, yaml
      head = yaml.safe_load(pathlib.Path("docs/contracts/implement-scope-boundary.yaml").read_text(encoding="utf-8"))
      base = yaml.safe_load(subprocess.run(
          ["git", "show", "origin/main:docs/contracts/implement-scope-boundary.yaml"],
          capture_output=True, text=True, encoding="utf-8", check=True).stdout)
      assert head["sanction_row_eligibility"] == base["sanction_row_eligibility"], "sanction_row_eligibility moved"
      assert head["invariants"] == base["invariants"], "invariants block moved"
      assert head["unmodelled_companions"] == base["unmodelled_companions"], "unmodelled_companions moved"
      assert head["deviation_trigger"] == base["deviation_trigger"], "deviation_trigger moved"
      base_rows, head_rows = base["sanction_rows"], head["sanction_rows"]
      assert set(head_rows) - set(base_rows) == {"roadmap_liveness_baseline_shrink"}, set(head_rows) ^ set(base_rows)
      for name, row in base_rows.items():
          assert head_rows[name] == row, f"pre-existing sanction row {name} was modified"
      print("NON-WEAKENING-OK")
      PY
    expected: "Both legs silent, then NON-WEAKENING-OK."
    fix_if: >-
      EVALUATOR MOVED -- the row was made to work by editing the check; revert it and author the row under
      the already-dispatched scope_contains_file kind instead. Any "moved"/"modified" assertion -- an
      existing clause was edited; this plan is additive only, so restore it rather than relaxing the
      assertion.
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: >-
      THE FOLLOW-ON REC EXISTS AND THIS PLAN NAMES IT. Discharges acceptance criterion 7, which nothing
      else asserts. Both halves: the self-sanctioning rec is readable from the warehouse after a pull
      (never asserted from the pre-existing local cache -- a read cache is not evidence of a write), and
      its id appears in this plan's own followon_recs, so the deferred half is traceable from the plan
      rather than only from the warehouse.
    command: |-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python - <<'PY'
      import json, pathlib, yaml
      plan = yaml.safe_load(pathlib.Path("docs/plans/PLAN-roadmap-liveness-baseline-companion.yaml").read_text(encoding="utf-8"))
      ids = plan.get("followon_recs") or []
      assert ids, "followon_recs is empty -- the self-sanctioning rec was not recorded in the plan"
      rows = {r["id"]: r for r in (json.loads(l) for l in pathlib.Path("logs/.recommendations-log.jsonl").read_text().splitlines() if l.strip())}
      for rid in ids:
          assert rid in rows, f"{rid} named in followon_recs is absent from the warehouse projection"
          assert rows[rid]["status"] == "open", f"{rid} is not open"
      print("FOLLOWON-OK")
      PY
    expected: FOLLOWON-OK
    fix_if: >-
      followon_recs is empty -- file the rec through the portal first, then write its returned id back
      into this plan (a permitted_field_edit under the implementing_plan_bookkeeping row). A named id is
      absent from the projection -- the write did not reach the warehouse; portal writes fail loudly with
      no offline outbox (Decision 84 I-4). Confirm the chain with
      `aws sts get-caller-identity --profile agent_platform` and re-file. Never repair by editing
      logs/.recommendations-log.jsonl, which is a read cache and never a write source.
    graduation: waive
    graduation_waiver_reason: >-
      Credential-dependent and one-time by construction: it reaches the DuckLake reader through the
      agent_platform assume-role chain and asserts a fact about THIS plan's own closure bookkeeping, so a
      registry shard would either re-run a credentialed call on every validate or pin a plan-specific id
      that means nothing after merge. Not not-applicable -- the command is a plain exit-zero shape, so the
      honest disposition is a waiver with its reason, not a silent classification.
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: >-
      Full presubmit tier (Decision 163 checked pre-handoff run). validate_scope_boundary runs against
      this plan's own implement diff here, so this step is also the plan's self-dogfood: every touched
      path must fall inside its own five declared scope rows, with the plan file covered by the
      implementing_plan_bookkeeping row.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      validate_scope_boundary reports an undeclared touched path on this plan's own diff -- STOP. The
      escape is the two-act amendment_procedure, never a unilateral append to this plan's scope; that is
      the guard working as designed on the very plan that widens it. validate_contract_drift reports a
      Class D parsed-content change with no new amendment_log entry -- add the entry.
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: >-
      The roadmap_liveness_baseline_shrink row derives config/roadmap_liveness_baseline.yaml for a plan
      whose declared scope contains docs/ROADMAP-PLATFORM.yaml, and derives nothing for a plan that omits
      it.
    verification_step: 2
    test_selector: tests/checks/verification/validate_scope_boundary/test_roadmap_liveness_baseline_row.py
    red_green_expectation: >-
      Red before -- the module does not exist at origin/main and the conftest fixture carries four rows,
      so the positive arm's touched path is unsanctioned. Green after.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: >-
      The row and its amendment_log entry are pinned in the contract test: trigger kind, trigger file,
      path_template, the determinism argument, the Decision 75 note and all three named residuals.
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py::TestContractShape::test_roadmap_liveness_baseline_row_declared_and_argued
    red_green_expectation: >-
      Red before -- neither the row nor its amendment_log entry exists at origin/main, so the pin raises
      KeyError. Green after.
constraints:
  - >-
    ADDITIVE ONLY on docs/contracts/implement-scope-boundary.yaml. No existing sanction row, no existing
    field, and no part of the tri-surface STOP disposition string is modified. sanction_row_eligibility
    is left byte-identical -- PR #1111 settled that key; this plan satisfies it, it does not re-litigate
    it, and it does not amend the "a path a tool mechanically regenerates" wording (that grammar question
    belongs to the provisional_v0 re-ratification this row is the fifth of six entries toward).
  - >-
    The amendment_log summary must NOT contain the literal token sanction_row_eligibility.
    tests/test_scope_boundary_contract.py asserts exactly one entry carries it. Argue the ineligibility
    contrast descriptively instead.
  - >-
    Do NOT modify scripts/checks/verification/validate_scope_boundary.py. The row reuses the
    already-dispatched scope_contains_file trigger kind, so enforcement changes by DATA, not code -- the
    contract's own design property (Decision 59 discharge, plan_obligations precedent).
  - >-
    Do NOT add a --shrink-baseline or any other regeneration arm, and do NOT edit
    scripts/platform_roadmap_liveness.py, docs/contracts/roadmap-liveness.yaml, or
    config/roadmap_liveness_baseline.yaml. Both Fable advice-consults independently rejected tool
    regeneration (see context); the module declares itself "Pure and report-only", the nearest precedent
    (config/check_accounting_baseline.yaml) is hand-shrunk with no tooling, and a header-preserving writer
    would freeze the baseline's own "Two toxic SCCs, 19 node ids total" prose that a drain falsifies.
  - >-
    Do NOT edit docs/ROADMAP-PLATFORM.yaml or docs/plans/PLAN-step-functions-executor-host.yaml. Both
    belong to the in-flight session on claude/step-functions-executor-host-g2uadf; a main-side edit to
    either creates a rebase conflict for exactly the session this plan exists to unblock.
  - >-
    No numbered Decision. decision-entry.yaml's routing_rule question 3 fails: the field_semantics row
    already owns this content, and the 2026-09-04 secrets_baseline_regeneration row -- the same class --
    took an amendment_log entry, not a number (Decision 86, Decision 167).
  - >-
    No high-entropy or secret-shaped literals in the new test fixtures. None of this plan's five scope
    files is among .secrets.baseline's six results-map keys today, so the secrets_baseline_regeneration
    row does not fire and no baseline churn is expected. The hazard is precise: a fixture literal tripping
    the detect-secrets hook adds a key for a file OUTSIDE this plan's declared scope, which leaves
    .secrets.baseline touched but unsanctioned (an in-scope key would instead make that row fire and cover
    it) -- the declaration gap the row's own trigger.description already records as a known residual.
  - >-
    Decision 131 test colocation: the new module lives in the existing
    tests/checks/verification/validate_scope_boundary/ package and imports shared helpers only from its
    conftest -- validate_no_cross_test_imports fails a test_* to test_* import in both tiers.
  - >-
    F3 disposition (plan-critique round 1): the row's subject is not tool-regenerated, so the eligibility
    clause's "a path a tool mechanically regenerates" half stops describing every row in the map on merge.
    DISCLOSE, do not amend -- name the clause as a residual in the amendment_log entry and route the
    grammar question to the provisional_v0 re-ratification, which exists for exactly this. This is the
    option the human's own commissioned Fable consult advised ("leave the eligible wording untouched...
    settling the tool-vs-check-governed grammar belongs there, once") and which plan-critique offers
    explicitly as the alternative to widening. Widening additively in this PR remains the live
    alternative if the human prefers it; it would also require narrowing VP step 5's equality assertion
    to the ineligible sub-key.
  - >-
    Do NOT edit rec-3579 or rec-3580. Their acceptance oracles already use the file's real two-space
    `^  - ` list grammar and are non-vacuous (matching 7 and 12 of the baseline's 19 entries). An earlier
    claim in this plan that they were one-space and vacuous was a textwrap.shorten display artifact and is
    withdrawn; "correcting" a correct predicate would introduce the very defect it claimed to remove.
  - No rescue agents or workaround loops (Decision 55).
  - Out-of-scope bugs become recommendations via scripts.ops_data_portal, never inline fixes (Decision 59).
