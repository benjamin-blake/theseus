schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "terraform-decompose-oidc-rename"
intent: >-
  Drain the two terraform-class grandfather roster entries that block the pending in-place
  repository rename, by decomposing terraform/personal/oidc.tf and
  terraform/bootstrap/github_ci_apply.tf into sibling .tf files within their SAME roots and
  deleting their roster rows -- and decouple the repository's own IAM verification checks from
  hardcoded single-.tf-file paths so the split cannot break them, and no future split can either.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-decompose-oidc-rename.yaml
phase: >-
  Platform governance -- Decision 166 terraform-class grandfather drain wave 1 of 2 (rec-3024 is
  the standing drain owner for all five files; this wave takes the two that block the rename).
scope:
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      Retain the header, the locals block, aws_iam_openid_connect_provider.github_actions and the
      two shared refresh-read policy documents (ci_ssm_refresh_read, ci_full_refresh_read); move
      the four role blocks out. Re-ground the convergence_writer_session_name 4-site enumeration
      and the retired-role overview comments (rec-2820a). Target 243 effective lines.
  - file: terraform/personal/oidc_ci_roles.tf
    action: Create
    purpose: >-
      Receive github_ci_branch and github_ci_pr verbatim (role, policy document, role policy).
      Target 253 effective lines.
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Create
    purpose: >-
      Receive github_ci_planner and github_ci_deploy verbatim, including the planner's lifecycle
      precondition and the deploy precondition that references it as "above". Target 186 lines.
  - file: terraform/bootstrap/github_ci_apply.tf
    action: Modify
    purpose: >-
      Retain the header, locals{github_repo}, both import{} blocks and aws_iam_role.github_ci_apply
      with its dual-sub trust policy; move the three policy documents out. This is the file the
      rename's dual-trust sub-claim edit will touch. Target 37 effective lines.
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Create
    purpose: >-
      Receive locals{github_ci_apply_policy_json} together with aws_iam_role_policy.github_ci_apply,
      whose lifecycle precondition self-references that local. Target 403 effective lines.
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Create
    purpose: >-
      Receive locals{github_ci_apply_reads_policy_json}, aws_iam_policy.github_ci_apply_reads and
      aws_iam_role_policy_attachment.github_ci_apply_reads. Target 160 effective lines.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Create
    purpose: >-
      Receive locals{github_ci_apply_boundary_policy_json} and
      aws_iam_policy.github_ci_apply_boundary with its 6,144 B precondition. Target 95 lines.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      DELETE the two drained budgets: rows (terraform/personal/oidc.tf,
      terraform/bootstrap/github_ci_apply.tf). No number is raised; no marker is added.
  - file: scripts/checks/iam_tf/_read_coverage.py
    action: Modify
    purpose: >-
      Replace _BOOTSTRAP_TF_REL (single file) with a bootstrap ROOT constant plus a shared helper
      returning the concatenated text of every *.tf in a root, so the `policy = local.<name>` hoist
      resolves across sibling files. Resolution pool widens; attribution stays per-resource.
  - file: scripts/checks/iam_tf/_write_companions.py
    action: Modify
    purpose: >-
      Consume the new bootstrap root constant at both boundary re-read sites (lines ~372, ~469).
  - file: scripts/checks/iam_tf/_write_coverage.py
    action: Modify
    purpose: Update the failure-message text that names a single .tf file so it names the root.
  - file: scripts/checks/iam_tf/validate_convergence_writer_isolation.py
    action: Modify
    purpose: >-
      Parse the whole terraform/personal root instead of oidc.tf alone, preserving the per-named-
      resource attribution the exactly-one-conditioned-Allow cardinality assertion depends on. ADDITIONALLY adopt the Decision 170 check-accounting declaration: this module is one of the
      96 baselined checks that declares no examined()/skipped() outcome, and validate_check_accounting's
      touch-it-fix-it leg FAILS any edited baselined module that has not adopted it. Per
      docs/contracts/check-accounting.yaml's discrimination_rule: an EMPTY derived input domain declares
      examined(0) (status vacuous); skipped(reason) is reserved for an UNAVAILABLE INPUT or UNMET
      PRECONDITION (missing artefact, unreadable root) and must NEVER be used for an empty domain. The
      examined unit is a design output of THIS plan, since the repoint widens the domain from one file to
      a root of *.tf files -- declare the unit accordingly, and treat structurally identical early returns
      identically.
  - file: scripts/checks/iam_tf/validate_invoke_implies_resolve.py
    action: Modify
    purpose: >-
      Parse the whole terraform/personal root; the invoke/resolve statements now span three files. ADDITIONALLY adopt the Decision 170 check-accounting declaration: this module is one of the
      96 baselined checks that declares no examined()/skipped() outcome, and validate_check_accounting's
      touch-it-fix-it leg FAILS any edited baselined module that has not adopted it. Per
      docs/contracts/check-accounting.yaml's discrimination_rule: an EMPTY derived input domain declares
      examined(0) (status vacuous); skipped(reason) is reserved for an UNAVAILABLE INPUT or UNMET
      PRECONDITION (missing artefact, unreadable root) and must NEVER be used for an empty domain. The
      examined unit is a design output of THIS plan, since the repoint widens the domain from one file to
      a root of *.tf files -- declare the unit accordingly, and treat structurally identical early returns
      identically.
  - file: scripts/checks/iam_tf/validate_ci_refresh_read_coverage.py
    action: Modify
    purpose: >-
      Read both roots by directory (planner statements from personal, apply statements from
      bootstrap) rather than by two hardcoded filenames. ADDITIONALLY adopt the Decision 170 check-accounting declaration: this module is one of the
      96 baselined checks that declares no examined()/skipped() outcome, and validate_check_accounting's
      touch-it-fix-it leg FAILS any edited baselined module that has not adopted it. Per
      docs/contracts/check-accounting.yaml's discrimination_rule: an EMPTY derived input domain declares
      examined(0) (status vacuous); skipped(reason) is reserved for an UNAVAILABLE INPUT or UNMET
      PRECONDITION (missing artefact, unreadable root) and must NEVER be used for an empty domain. The
      examined unit is a design output of THIS plan, since the repoint widens the domain from one file to
      a root of *.tf files -- declare the unit accordingly, and treat structurally identical early returns
      identically.
  - file: scripts/checks/iam_tf/validate_authority_budget.py
    action: Modify
    purpose: >-
      Swap the WHOLE hcl_text source (L40) to root-concatenated bootstrap text. This check makes
      FOUR textual assertions against that one variable and ALL FOUR lose their markers to the
      split: (a) boundary_policy_name, (b) role/<prefix>* inside IAMRoleWriteBounded
      (_check_v2_prefix), (c) DenySelfInlinePolicyWrite plus the self-exclusion ARN, and (d) the v1
      enumerated fallback. The retained 37-line file references the boundary only as a resource
      reference, never as the literal string these greps need. Patching leg (a) alone leaves (b)
      and (c) RED. Leg (d) is LATENT rather than red -- terraform/bootstrap/authority_budget.json
      sets in_budget_managed_role_prefix, so _check_v2_prefix runs and _check_v1_enumerated is
      unreachable in the current tree; it reads the same hcl_text and so must be repointed with the
      others, but do not hunt a failure from it that cannot currently fire. ADDITIONALLY adopt the Decision 170 check-accounting declaration: this module is one of the
      96 baselined checks that declares no examined()/skipped() outcome, and validate_check_accounting's
      touch-it-fix-it leg FAILS any edited baselined module that has not adopted it. Per
      docs/contracts/check-accounting.yaml's discrimination_rule: an EMPTY derived input domain declares
      examined(0) (status vacuous); skipped(reason) is reserved for an UNAVAILABLE INPUT or UNMET
      PRECONDITION (missing artefact, unreadable root) and must NEVER be used for an empty domain. The
      examined unit is a design output of THIS plan, since the repoint widens the domain from one file to
      a root of *.tf files -- declare the unit accordingly, and treat structurally identical early returns
      identically.
  - file: tests/checks/iam_tf/test__read_coverage.py
    action: Modify
    purpose: Add a decoy+split fixture regression case (red before the repoint, green after).
  - file: tests/checks/iam_tf/test__write_companions.py
    action: Modify
    purpose: Add a split fixture regression case for the boundary re-read.
  - file: tests/checks/iam_tf/test_validate_convergence_writer_isolation.py
    action: Modify
    purpose: >-
      Add a split fixture case AND a decoy case proving a convergence reference in an unrelated
      sibling .tf neither satisfies nor breaks the cardinality assertion.
  - file: tests/checks/iam_tf/test_validate_invoke_implies_resolve.py
    action: Modify
    purpose: Add a split fixture regression case.
  - file: tests/checks/iam_tf/test_validate_authority_budget.py
    action: Modify
    purpose: Add a split fixture regression case.
  - file: tests/checks/iam_tf/validate_ci_refresh_read_coverage/test_end_to_end.py
    action: Modify
    purpose: Add a split fixture regression case across both roots.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      21 rows name one of the two files as guard_target and 28 have a check_spec referencing either
      root. Repoint the single-file grep specs to root-scoped equivalents; correct
      ci-role-boundary-attach-count-eq-6 (asserts 6, measures 4 since T2.49 merged 6 CI roles into
      4); assert-on or remove the computed-unused other_lambda_writes (rec-2820b). SLOT CHANGE
      REQUIRED for exactly two rows -- passrole-grant-present-identity-and-boundary and
      updaterole-present-identity-and-boundary are primitive_slot grep_count with
      path: terraform/bootstrap/github_ci_apply.tf and operator gte count 2, which asserts the verb
      appears in BOTH the identity policy AND the boundary ceiling. The split puts those two layers
      in different files and GrepCountCheck.run() reads a single Path (a directory raises
      IsADirectoryError), and there is no root-scoped grep_count. They must move to
      command_exit_zero asserting PER-FILE presence -- count(_policy.tf) >= 1 AND
      count(_boundary.tf) >= 1 -- with comments stripped (grep -vE '^[[:space:]]*#') and
      quoted-token matching (grep -cF "\"<verb>\""), mirroring the existing
      instanceprofile-untagoidc-verbs-both-layers row. A "total >= 2 across the two files" form is
      NOT equivalent and must not be used: it passes on 2-in-_policy.tf / 0-in-_boundary.tf, the
      exact single-layer grant the assertion exists to catch. Note also that today's gte 2 does NOT
      actually assert both layers for passrole-grant-present-identity-and-boundary -- its pattern
      iam:PassRole is UNQUOTED and matches the comments at github_ci_apply.tf:280 and :391, so the
      count of 2 is satisfiable by comments alone. The prescribed form is strictly STRONGER and is
      green on the current tree for both rows (measured 1/1 each with comments stripped).
      A THIRD row needs the same per-file treatment and is easy to miss because its slot does NOT
      change: instanceprofile-untagoidc-verbs-both-layers is already command_exit_zero and already
      uses the comment-stripped quoted-token shape, but it greps the single file
      github_ci_apply.tf, so after the split it returns 0 for each of its three verbs
      (iam:ListInstanceProfilesForRole, iam:RemoveRoleFromInstanceProfile,
      iam:UntagOpenIDConnectProvider -- each measured 1-in-_policy.tf / 1-in-_boundary.tf) and goes
      RED. Convert its COMMAND to the same per-file both-layers form; do NOT root-scope it, which
      would yield a total of 2 per verb and pass even with one layer deleted. Opposite calibration
      for one row -- all-three-policy-docs-carry-size-precondition distributes 1/1/1 across
      _policy/_reads/_boundary, so a ROOT-SCOPED TOTAL is the correct repoint there and a per-file
      form would be wrong. Apply the per-file rule to both-layers CARDINALITY rows only.
bundled_recommendations:
  - rec-2820
infrastructure_dependencies:
  - >-
    terraform/personal (LIVE, guard-gated auto-apply per Decision 77): movement only within one
    root. Resource addresses are root-scoped, so no address changes, no terraform state mv, and no
    apply is required -- the speculative plan MUST be empty. A non-empty plan means the split was
    not pure: STOP and find the error rather than applying.
  - >-
    terraform/bootstrap (NEVER auto-applied, Decision 77/126 operator tier): movement only. No
    apply is required at all; bootstrap state is unaffected by file reorganisation.
  - >-
    /terraform/bootstrap/ is CODEOWNERS-protected (.github/CODEOWNERS, DEP-05 / Decision 144), so
    this PR requires code-owner review from benjamin-blake before merge. Do not expect autonomous
    merge.
acceptance_criteria:
  - Every touched and newly created .tf file measures under 500 effective lines.
  - >-
    The two terraform roster rows are deleted from config/structural_size_budgets.yaml, the
    dec-166 terraform-grandfather marker count falls 5 -> 3, and no budget value increases.
  - >-
    The multiset of non-comment, non-blank lines in each root's affected file set is byte-identical
    before and after the split (movement, not rewriting).
  - >-
    All seven pre-tier iam_tf checks pass against the split tree, and each repointed module carries a new regression
    test that fails against the pre-repoint single-file implementation.
  - >-
    Root-wide parsing widens only the resolution pool, never the attribution scope: a decoy policy
    block in an unrelated sibling .tf neither satisfies nor breaks any assertion, and an
    unresolvable local.<name> fails loud rather than silently passing.
  - rec-2820 is resolved -- no overview comment describes the retired github_ci_plan / github_ci_drift roles as live, and other_lambda_writes is asserted-on or removed.
  - >-
    All 28 PRE-EXISTING verification-registry rows whose check_spec references either touched root
    EXECUTE green against the split tree (27 are green today; one, ci-role-boundary-attach-count-eq-6,
    is already red). The population excludes this plan's own graduated rows by plan_slug -- without
    that exclusion it is 32 and self-recursive -- and the two grep_count rows are converted to
    command_exit_zero preserving a genuine both-layers semantic.
  - bin/venv-python -m scripts.validate --pre is green, and the full tier is green before handoff.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the new split-fixture regression tests. These must be written and observed RED against
      the pre-repoint single-file implementation BEFORE the checks are changed.
    command: bin/venv-python -m pytest tests/checks/iam_tf/ tests/checks/structural/ tests/checks/verification/ -q
    expected: >-
      All green after the repoint. Before the repoint the newly added split/decoy cases FAIL,
      proving the gap is real and the tests are not tautological. GRADUATION CONSTRAINT (Decision
      132): the registry row's check_spec MUST be a test_selector naming the single NEW node
      tests/checks/iam_tf/test_validate_convergence_writer_isolation.py::TestValidateConvergenceWriterIsolation::test_resolves_planner_document_from_sibling_tf_file
      -- that node is ABSENT on origin/main, so pytest exits non-zero there (FAIL) and passes on
      HEAD, which is what the differential admission gate requires. The node id is CLASS-QUALIFIED
      deliberately: every test in that module is a method of TestValidateConvergenceWriterIsolation
      and no module-level `def test_` exists, so an unqualified id would not resolve on HEAD and
      run_differential would hard-fail its "passes on HEAD" leg. Do NOT graduate this step's
      whole-directory command: it passes on origin/main and would be rejected as tautological.
    fix_if: >-
      A new case passes before the repoint -- it is not exercising cross-file resolution; rewrite
      it so the local/statement genuinely lives in a sibling .tf file.
    graduation: graduate
    graduation_check_id: "iam-tf-root-scoped-resolution-tests"
  - step: 2
    phase: pre-deploy
    action: Run every pre-tier iam_tf check against the split tree via the domain manifest.
    command: bin/venv-python -c "import importlib,sys; from scripts.checks.iam_tf._manifest import ENTRIES; failed=[]; [getattr(importlib.import_module(e.module), e.attr)(failed) for e in ENTRIES if e.pre]; print('FAILED:', failed); sys.exit(1 if failed else 0)"
    expected: "Exit 0 with FAILED: [] -- all SEVEN pre=True entries run; the four repointed ones resolve statements across the split files."
    fix_if: >-
      Any check reports it cannot parse or cannot resolve a policy document -- it is still reading a
      single hardcoded filename, or the local hoist moved away from its consuming resource.
    graduation: waive
    graduation_waiver_reason: >-
      Structurally un-admittable, not merely inconvenient: this asserts "the pre-tier iam_tf checks
      are green", which is TRUE on origin/main by construction (main is green). Decision 132's
      differential admission gate reverts to origin/main in a real git worktree and requires the row
      to FAIL there; this property cannot fail there, so the row would be rejected as tautological.
      No narrowing fixes it -- the property is not differential. The differential guard for this
      migration is step 13 instead.
  - step: 3
    phase: pre-deploy
    action: Measure every touched and newly created .tf file against the 500 class limit.
    command: bin/venv-python -c "import sys; from pathlib import Path; from scripts.checks.structural._classify import effective_lines; fs=['terraform/personal/oidc.tf','terraform/personal/oidc_ci_roles.tf','terraform/personal/oidc_pipeline_roles.tf','terraform/bootstrap/github_ci_apply.tf','terraform/bootstrap/github_ci_apply_policy.tf','terraform/bootstrap/github_ci_apply_reads.tf','terraform/bootstrap/github_ci_apply_boundary.tf']; r=[(f,effective_lines(Path(f).read_text(encoding='utf-8'))) for f in fs]; [print(f,n) for f,n in r]; sys.exit(0 if all(n<500 for _,n in r) else 1)"
    expected: All seven files print a value under 500; exit 0.
    fix_if: >-
      Any file is at or above 500 -- rebalance which blocks land in which file. Never add a roster
      row or a raise marker (Decision 128/165/166).
    graduation: graduate
    graduation_check_id: "terraform-split-files-under-500"
  - step: 4
    phase: pre-deploy
    action: >-
      Assert the terraform/personal split is pure movement -- the non-comment content of the new
      file set equals the non-comment content of the pre-split oidc.tf.
    command: >-
      bash -c "diff <(git show f4c4f39343e3524289261c14381943ec5634f508:terraform/personal/oidc.tf | grep -vE '^[[:space:]]*(#|$)' | sort) <(cat terraform/personal/oidc.tf terraform/personal/oidc_ci_roles.tf terraform/personal/oidc_pipeline_roles.tf | grep -vE '^[[:space:]]*(#|$)' | sort)"
    expected: >-
      Empty diff, exit 0. Comment lines are excluded by construction, so the required comment
      re-grounding and rec-2820a do not perturb this assertion -- and HCL comments are stripped by
      the parser, so they cannot affect terraform plan either.
    fix_if: >-
      Any line appears on one side only -- a resource, attribute or ARN was edited, indented
      differently, or dropped during the move. Restore it verbatim; do not "fix forward".
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot movement-purity assertion meaningful only against this wave's specific pre-split
      baseline commit. Graduated as a standing check it would compare an unrelated future diff
      against a stale baseline and pass vacuously. The baseline is a HARDCODED SHA rather than a
      live origin/main ref or a shell variable: the commit-flow rebase (AGENTS.md Git-ops) moves
      origin/main mid-implementation and would silently re-baseline the assertion, and each Bash
      tool invocation is independent so an exported variable would not survive between steps.
  - step: 5
    phase: pre-deploy
    action: Assert the terraform/bootstrap split is pure movement, same construction as step 4.
    command: >-
      bash -c "diff <(git show f4c4f39343e3524289261c14381943ec5634f508:terraform/bootstrap/github_ci_apply.tf | grep -vE '^[[:space:]]*(#|$)' | sort) <(cat terraform/bootstrap/github_ci_apply.tf terraform/bootstrap/github_ci_apply_policy.tf terraform/bootstrap/github_ci_apply_reads.tf terraform/bootstrap/github_ci_apply_boundary.tf | grep -vE '^[[:space:]]*(#|$)' | sort)"
    expected: Empty diff, exit 0.
    fix_if: >-
      Any divergence -- most likely an IAM action, Sid or ARN altered while relocating a policy
      document. Restore verbatim. This root carries the apply role's own authority; do not improvise.
    graduation: waive
    graduation_waiver_reason: >-
      Same one-shot baseline-bound property as step 4; meaningful only for this wave's pre-split
      origin/main revision of github_ci_apply.tf.
  - step: 6
    phase: pre-deploy
    action: >-
      Assert the roster drained -- both keys absent, marker count 5 -> 3, and no value raised
      (this is also the partial-progress evidence against rec-3024's own acceptance metric).
    command: bin/venv-python -c "import sys,yaml; d=yaml.safe_load(open('config/structural_size_budgets.yaml')); b=d.get('budgets',{}); tf=[k for k in b if str(k).endswith('.tf')]; gone=[k for k in ('terraform/personal/oidc.tf','terraform/bootstrap/github_ci_apply.tf') if k in b]; print('remaining_tf_keys=',sorted(tf)); print('should_be_absent_but_present=',gone); sys.exit(1 if gone or len(tf)!=3 else 0)"
    expected: >-
      should_be_absent_but_present=[] and exactly three .tf keys remain (iceberg_tables,
      data_pipeline, platform_roles -- rec-3024's residual wave). Cross-check with
      `grep -c 'raise-approved: dec-166 terraform class grandfather' config/structural_size_budgets.yaml`
      which must fall from 5 to 3.
    fix_if: >-
      A key is still present, or a raise marker was added. Removals are unrestricted
      (_marker_guard.check_diff iterates current entries only) -- no marker is ever needed to drain.
    graduation: graduate
    graduation_check_id: "oidc-bootstrap-absent-from-size-roster"
  - step: 7
    phase: pre-deploy
    action: >-
      rec-2820(a) closure evidence -- no overview/header comment still describes the retired
      github_ci_plan / github_ci_drift roles as live composers or writers.
    command: >-
      bash -c 'n=$(grep -REn "^[[:space:]]*#.*github_ci_(plan|drift)\b" terraform/personal/ terraform/bootstrap/ | grep -vE "[Ff]rom github_ci_(plan|drift)" | grep -vE "github_ci_plan \(PR-sub" | wc -l | tr -d " "); echo "stale_retired_role_comments=$n"; [ "$n" -eq 0 ]'
    expected: >-
      stale_retired_role_comments=0. Currently RED at 8, not 4: oidc.tf:40, :41, :211, :215, :453,
      :731, :943 and github_ci_apply.tf:105. TOKEN-based, not an enumerated phrase list, so a NEWLY
      introduced stale mention is caught too -- an earlier phrase-allowlist draft of this step was
      fail-open, matching 0 of 8 because its longest phrase spanned the oidc.tf:40/41 line break and
      line-oriented grep cannot see across it. The PRESERVE set is exactly 8 lines and is excluded by
      the two -v filters: the per-statement "From github_ci_plan:" / "From github_ci_drift:"
      provenance annotations (7 lines, which rec-2820 explicitly keeps) and the past-tense merge
      header at oidc.tf:735 ("github_ci_plan (PR-sub ... ) + github_ci_drift (main-sub ...)").
      github_ci_plan\b does not match github_ci_planner (verified: 11 occurrences, 0 false hits).
    fix_if: >-
      A count above zero means a comment still asserts a false CURRENT state -- e.g. oidc.tf:453
      naming github_ci_drift as a live convergence writer (the real set is {github_ci_apply,
      github_ci_planner main-sub}) or oidc.tf:731 saying github_ci_drift is "added below". Re-ground
      to the 2-role reality (github_ci_planner + github_ci_deploy). Do NOT instead widen the two
      preserve filters to make the count fall -- that reintroduces the fail-open shape.
    graduation: graduate
    graduation_check_id: "no-retired-ci-role-overview-comments"
  - step: 8
    phase: pre-deploy
    action: >-
      rec-2820(b) closure evidence -- the verification registry's computed other_lambda_writes is
      either asserted-on or removed, never computed-and-discarded.
    command: >-
      bin/venv-python -c 'import yaml,sys; d=yaml.safe_load(open("config/agent/verification_registry/registry.yaml")); cmds=[(e["check_id"]," ".join(map(str,(e.get("check_spec") or {}).get("command") or []))) for e in d.get("entries",[])]; bad=[cid for cid,c in cmds if "other_lambda_writes" in c and "$other" not in ";".join(p for p in c.split(";") if "echo" not in p)]; print("computed_but_ungated=",bad); sys.exit(1 if bad else 0)'
    expected: >-
      computed_but_ungated= [] and exit 0. Parses each row's check_spec structurally and requires
      that any row computing other_lambda_writes references it OUTSIDE its echo payload, i.e. in a
      real assertion. Currently red -- it reports ['deploy-role-updatefunctioncode-prefix'].
    fix_if: >-
      A check_id is listed: that row still computes the value without gating on it. Either reference
      $other in a real assertion or delete the computation entirely. Note the test is FAIL-CLOSED by
      design -- it looks for the literal $other outside the echo payload, so an arithmetic form like
      (( other == 0 )) that never writes $other would still be flagged. That direction cannot produce
      a false green, so prefer a $other-referencing assertion (or deletion) over widening the test.
      NOTE: this step's own graduated row lives in registry.yaml and its command string contains
      other_lambda_writes, so it falls inside its own scan scope. It passes only because the literal
      $other lands in a ;-segment containing no echo -- preserve that shape if the row is reformatted.
    graduation: graduate
    graduation_check_id: "registry-other-lambda-writes-asserted"
  - step: 9
    phase: pre-deploy
    action: >-
      Run the creds-free terraform gate. Decision 119: this is CI-DELEGATED -- the required
      terraform-validate CI job runs this identical command and is the AUTHORITATIVE verifier.
    command: bin/venv-python -m scripts.validate --terraform-only
    expected: >-
      Exit 0. On CC-web terraform is absent from PATH, so run_terraform_creds_free prints a visible
