      path literals, so an unexcluded predicate would report 28 pre-graduation and 32 after. TWO
      FILTERS, TWO DIFFERENT JOBS -- keep both. The plan_slug filter does the population-stability
      work; the "materialize_check" filter does the RECURSION-SAFETY work and is the one that must
      never be dropped, because it holds regardless of how plan_slug is spelled. A
      present-but-MISTYPED slug is caught by nothing: validate_verification_registry's schema leg
      checks plan_slug presence only, and it runs BEFORE validate_graduation_completeness (the only
