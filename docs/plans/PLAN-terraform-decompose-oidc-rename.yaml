constraints:
  - >-
    MOVEMENT ONLY in the .tf files. No resource, attribute, trust policy, IAM action, Sid, ARN,
    condition or permission may change. The only permitted non-move edits are FULL-LINE `#`
    comments, which the HCL parser strips (invisible to terraform plan) and which steps 4/5 exclude
    by construction. This does NOT extend to trailing comments, `//` or `/* */` forms: steps 4/5
    strip only lines whose first non-whitespace character is `#`, so editing a TRAILING comment
    (notably the `# pragma: allowlist secret` on the OIDC thumbprint) breaks the purity assertion.
    All EIGHT rec-2820a targets enumerated in VP step 7 were verified to be full-line comments (the
    detector's ^[[:space:]]*# anchor guarantees it), so the scoped work is safe.
  - >-
    Do NOT add a `# raise-approved:` marker and do NOT increase any number in
    config/structural_size_budgets.yaml. Decision 166's ratified relief valve for the terraform
    class is decomposition; Decision 128 makes decompose the default; Decision 165 requires a raise
    marker to name an authorizing Decision. The correct outcome is FEWER roster rows.
  - >-
    Each hoisted `locals { ..._policy_json }` MUST travel into the same file as the resource whose
    lifecycle precondition self-references it. The hoist exists precisely because a precondition
    cannot reference `self`; separating them would break the byte-limit guard silently at apply.
  - >-
    Root-wide parsing must widen ONLY the resolution pool, never the attribution scope. Every
    statement stays keyed to its owning named resource/document. FAIL-LOUD applies to BOTH
    indirections (Decision 129 clause 4): an unresolvable `local.<name>` AND an unresolvable
    `data.aws_iam_policy_document.<name>`. The second is the live hazard:
    validate_invoke_implies_resolve._resolve_statements returns [] for a missing document name and
    the caller then takes its `PASS (vacuous)` branch, so a role whose document fails to resolve
    under the widened pool passes silently; validate_convergence_writer_isolation assertion (d) has
    the same shape. The new tests must DISTINGUISH "role does not invoke" (legitimately vacuous, see
    the existing test_invoke_implies_resolve_vacuous_pass_for_non_invoking_role) from "document
    could not be resolved" (must FAIL).
  - >-
    No terraform apply on any root. If any plan shows a diff, the split was not pure -- STOP and
    find the error (Decision 55: no workaround loops, no rescue agents).
  - >-
    Do not author a local `terraform init/validate/plan` for these roots (Decision 119); the
    required terraform-validate CI job is the authoritative verifier. Decision 120's provider
    mirror relaxes but does not remove that delegation.
  - >-
    terraform/bootstrap changes are the human/operator tier (Decision 126) and CODEOWNERS-protected
    (Decision 144 / DEP-05). Author the split; never self-direct an apply.
  - >-
    Preserve the OIDC provider thumbprint's `# pragma: allowlist secret` trailing comment and every
    `try()` wrapper verbatim when relocating blocks.
  - >-
    config/agent/verification_registry/registry.yaml sits at ZERO long-line headroom: its longest
    line is 2315 chars and long_line_budgets pins it at exactly 2315. Two DIFFERENT checks are
    involved, do not conflate them -- a line exceeding 2315 fails validate_structural_size_limits,
    while validate_structural_size_budget_raises fires only on RAISING the pinned entry. Calibration:
    the 2315-char line belongs to an unrelated row (t4x-persona-contracts-mechanism-word-free); the
    longest line among the ~21 rows this plan repoints is 829 chars, so root-scoping them (roughly
    +10 chars per occurrence) has ample slack. The REAL trap is a NEW graduated row whose one-line
    command runs long. Remedy either way is a YAML block scalar breaking the command across lines --
    never a ceiling raise, which constraint 2 forbids. Effective lines are fine (5397 of 6000 as of
    the rebase onto main 8e17984, which added ~68 lines of new rows; re-measure rather than trusting
    this figure if main advances again).
  - No rescue agents or workaround loops (Decision 55)
