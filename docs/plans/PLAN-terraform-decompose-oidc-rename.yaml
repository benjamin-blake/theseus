rollback: >-
  Revert the PR as a single unit -- Half A and Half B are coupled and must never be reverted
  independently (reverting only the check repoint while the .tf files stay split would red
  validate --pre; reverting only the split would red the new regression tests). No infrastructure
  rollback is required or possible: no apply is performed on any root, resource addresses are
  unchanged throughout, and the convergence record is untouched by a no-op plan. If VP step 12
  reports red post-merge, that indicates the split was NOT pure -- do not auto-remediate; review the
  ci_rca rec, then clear via the workflow_dispatch acknowledge-and-retry unlatch naming the red
  commit (Decision 55/72, CD.35).
