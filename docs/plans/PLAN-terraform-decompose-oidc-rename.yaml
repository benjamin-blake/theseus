      injecting the plan's changed-file set -- it reports all four modules as "edited on this branch
      but still declares no examined()/skipped() outcome". Note the four ARE in the 96-entry
      baseline; read membership with the module's own _load_baseline_entries, not a naive YAML parse.
    fix_if: >-
      Any module is listed: adopt the declaration in THAT module per the discrimination_rule --
      examined(0) for an empty derived domain, skipped(reason) only for an unavailable input or
      unmet precondition, never the two swapped. "Leave the module unedited" is NOT an available
      remedy here, since the repoint requires editing all four. Optionally shrink
      config/check_accounting_baseline.yaml by the four adopted names (shrink-only, removals
      unrestricted) -- not required for the gate to pass.
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_accounting is itself a registered pre-tier check that runs on every PR touching
      scripts/checks/**; a graduated registry row asserting "that check is green" would duplicate an
      already-enforced standing gate and, like step 2, states a property that is TRUE on origin/main
