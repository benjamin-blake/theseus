      makes this step differential and therefore genuinely graduate-eligible without renaming any
      check_id. THE plan_slug EXCLUSION IS LOAD-BEARING -- DO NOT DROP IT ON A REFORMAT. Once
      graduated, this row's own command string is stored verbatim in check_spec and contains the
      literals "terraform/personal"/"terraform/bootstrap", so without the exclusion the row SELECTS
      ITSELF; CommandExitZeroCheck.run() calls subprocess.run with NO timeout (zero occurrences of
      timeout in scripts/verification_checks.py) and each level re-reads the live registry and
      re-spawns, so the result is an unbounded, untimed process chain that HANGS validate --pre, the
      full tier and PR CI rather than failing red. Excluding by plan_slug also holds the population
