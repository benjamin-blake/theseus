      entry-point modules triggers validate_check_accounting's touch-it-fix-it leg, which FAILS any
      edited baselined module that has not adopted examined()/skipped().
    command: >-
      bin/venv-python -c 'from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting as v; f=[]; v(f); print("FAILED:",f); raise SystemExit(1 if f else 0)'
    expected: >-
