      moved -- repoint it to the root, BUT root-scoping is explicitly NOT the remedy for any row
      whose assertion is a both-layers cardinality, because a root-scoped total passes on a
      single-layer grant; (b) the two grep_count rows cannot be repointed in their slot at all;
      (c) instanceprofile-untagoidc-verbs-both-layers needs a per-file command change with no slot
