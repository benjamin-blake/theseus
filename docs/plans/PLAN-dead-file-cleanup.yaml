schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: false
slug: dead-file-cleanup
intent: >-
  Delete 206 verified-dead one-shot agent artefacts (195 legacy docs/plans/archive/*.md plans,
  5 decommissioned logs/ files, 6 orphaned audit artefacts; 4.01 MB), retire the two file-router
  routes and the one log-storage example entry whose targets those deletions remove, and record the
  governance edits deletion requires. A repo-wide sweep proved the Python tree is 100%
  import-reachable (428/429 non-test modules; the one outlier is a 1-line package marker), so NO
  source code is in scope -- all deadweight is accumulated workflow output. docs/plans/PLAN-*.yaml
  are explicitly OUT of scope pending their DuckLake upload. terraform/ contributes ZERO deletions.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-dead-file-cleanup.yaml
phase: >-
  Repository hygiene (ad-hoc, user-explicit). No tier_item; docs-and-artefacts only, zero runtime
  code change. This is NOT the RS-07 lagged sweep -- that obligation is defined for completed .yaml
  plans and constraint 1 explicitly defers it. This sweep retires the .md format that RS-07's FIRST
  sweep had already relocated into docs/plans/archive/.
scope:
  - file: docs/plans/archive/
    action: Delete
    purpose: >-
      All 195 legacy PLAN-*.md files (3.59 MB), the deprecated pre-T1.11 planning format superseded
      one-way by schema-validated .yaml (Decision 85). VERIFIED zero mechanisms read this directory:
      `grep -rn "plans/archive" scripts/ tests/ config/ .github/ .claude/ docs/contracts/` returns
      nothing. Three dead depth-1 .md plan paths survive in code and are deliberately NOT retired by
      this plan (scripts/roadmap/find_plan.py:68 PLAN-{slug}.md, :73 legacy PLAN.md, and
      scripts/roadmap/plan_audit.py:52-53 + :225-226); all three resolve against docs/plans/ depth-1,
      where zero .md files exist, so they are unaffected. The directory holds exactly 195 entries, all
      .md, all tracked, zero untracked strays. It is not a file-router route target. Deleting every
      member removes the directory, but the plan asserts only "no .md remains under it" (see step 1)
      so a future RS-07 lagged .yaml sweep may legitimately re-create it.
  - file: logs/.metrics-analysis-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry. VERIFIED zero inbound references repo-wide and no file-router route.
      The file-router `metrics-analysis-log` topic targets logs/.session-metrics-log.jsonl -- a
      DIFFERENT, retained file -- so that route is untouched. Frozen at its 2026-05-28 commit.
  - file: logs/.token-budget-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry (330 lines). VERIFIED no writer or reader in scripts/ or src/; the only
      references are historical prose in CHANGELOG and the INTENT-telemetry decommission list. No
      file-router route. Frozen at 2026-05-28.
  - file: logs/.transcript-index.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry, superseded by the telemetry_transcripts table. VERIFIED single inbound
      reference is docs/INTENT-telemetry-system.md:577, which lists it as REPLACED. No writer, no
      file-router route. Frozen at 2026-05-28.
  - file: logs/.friction-analysis-log.jsonl
    action: Delete
    purpose: >-
      VERIFIED no production reader or writer. The only tests/ hits are synthetic fixture STRINGS
      (test_validate_placement.py:84 passes it to _mock_ls_files; test_env_git.py:318 embeds it in a
      fake porcelain string) -- neither opens the real file. Has TWO contract references that must be
      retired with it: the file-router route and docs/contracts/log-storage.yaml:66. Frozen 2026-05-28.
  - file: logs/.rejected-suggestions.jsonl
    action: Delete
    purpose: >-
      Cron rejection memory, 1 line. VERIFIED zero code references anywhere -- its only inbound
      reference in the repo is the file-router route retired below. Frozen at 2026-05-28.
  - file: audits/dependency-management-c8a2a17.md
    action: Delete
    purpose: >-
      Orphaned audit output. VERIFIED by fixpoint reference analysis (matching full path, basename,
      stem, bare slug, and sha-stripped slug): no live file references it. Its paired prompt is also
      deleted, so the slug leaves the repo as a complete unit.
  - file: audits/dependency-management-c8a2a17.yaml
    action: Delete
    purpose: >-
      Structured companion of the above; same fixpoint verdict. Not read by any command --
      config/agent/verification_registry/registry.yaml opens exactly one audits/ file
      (executor-roadmap-review-7d57a0d.yaml at :3438), which is NOT in scope.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.md
    action: Delete
    purpose: Orphaned audit output; same fixpoint verdict. Paired prompt deleted below.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.yaml
    action: Delete
    purpose: Structured companion of the above; same fixpoint verdict.
  - file: docs/audit-prompts/AUDIT-dependency-management.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted. VERIFIED not referenced by any
      mechanism; registry.yaml greps only AUDIT-decision-knowledge-persistence-scalability.md (which
      already does not exist) and AUDIT-terraform-deployment-strategy.md, neither in scope.
  - file: docs/audit-prompts/AUDIT-platform-roadmap-strategic-audit.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted; same verdict. audits/ goes 57 -> 53
      and docs/audit-prompts/ goes 25 -> 23, so neither directory empties and both stay valid
      file-router route targets.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      DELETE the friction-analysis-log route (:288-290) and the rejected-suggestions-log route
      (:306-308) outright. Do NOT mark them `runtime: true`: :13-16 defines that marker as "a route
      whose target is a warehouse read-cache: a gitignored or otherwise untracked file that is
      REGENERATED AT RUNTIME (Decision 84 local-cache model)". Neither target is regenerated (neither
      has any writer) and neither is gitignored, unlike all four genuine runtime rows (north-star-log
      has a live writer at scripts/north_star_tracker.py:106; recommendations-log, decisions-index and
      execution-checkpoint-state are gitignored at .gitignore:130,134,129). Flipping the marker would
      permanently silence the dead-target scan on a false semantic basis. Add an amendment_log entry
      with change_class: accepted_values_narrow (closed vocabulary at scripts/contracts_schema.py:50-60;
      file-router.yaml:44 is direct precedent for that class removing an entry). KEEP the
      prose_allowlist glob docs/plans/**/*.md unchanged: 4 docs/plans/reports/*.md still match it.
  - file: docs/contracts/log-storage.yaml
    action: Modify
    purpose: >-
      Remove `.friction-analysis-log.jsonl` from patterns.locally_produced.examples at :66 -- it names
      a file this plan deletes. Class D contract (log-storage.yaml:8), so the edit also requires its own
      amendment_log entry (change_class: accepted_values_narrow) per contract-population.yaml:232-236.
      NOTE: validate_log_storage_registry.py:38-62 reads only the `routing` block, so a stale entry here
      would NOT red CI -- which is why the new test in scope guards it mechanically rather than relying
      on this sweep. Decision 86's inbound-reference sweep is the governing obligation.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add ONE numbered Decision, drafted verbatim below so the category-consistency gate can be
      rendered at plan time rather than deferred to implement time where no reviewer stands. Heading:
      "## Decision NNN: A deprecated planning-artefact format carries no working-tree retention
      obligation -- retirement is by deletion, with provenance in git history (amends Decision 85)
      (Decided)". Envelope: number: NNN; status: Decided; decided_date: <implement date>;
      amends: [85]; significance.value: numbered_decision; significance.justification: "Establishes a
      forward-standing, reversal-relevant rule governing every future deprecated-format retirement, so
      the next format transition needs no fresh adjudication. A docs/contracts/*.yaml governance-note
      home was considered and REJECTED: no existing contract owns artefact-format lifecycle (file-router
      owns placement, log-storage owns log routing, decision-entry owns entry grammar), so a note there
      would create a new orphan surface rather than populate an existing one." Also state, in the body,
      why the Decision-85 amendment trailer alone is insufficient: the trailer records that ONE clause
      was descriptive, whereas the rule must bind future formats that Decision 85 never contemplated --
      an amendment cannot carry a commitment broader than the entry it amends. ALSO append a dated
      trailer under Decision 85 itself in the pinned trailing_bracket form (decision-entry.yaml:130-134,
      Decision 168 pattern): "[Amendment YYYY-MM-DD: the working-tree half of this clause was descriptive
      of ratification-time state, not a forward retention directive -- see Decision NNN.]". Removes and
      renumbers no header (Decision 149). The entry must ALSO carry the three required bold markers
      -- `**Status:**`, `**Date:**`, `**Decision:**` (decision-entry.yaml:74-79) -- and the trailing
      `---` block separator required of new-in-diff entries (:185-205); both are forward-enforced by
      validate_decision_entry_conformance.py. Per AGENTS.md's change-record content rule, what changed /
      why now / measurements go in the PR body, NOT the entry.
  - file: docs/CLAUDE.md
    action: Modify
    purpose: >-
      Rewrite the "Plans lifecycle (RS-07)" section (lines 40-59). It currently defines the archival
      criterion as "a depth-1 docs/plans/ file is archived iff its extension is .md" and points at
      docs/plans/archive/ -- a directory this plan empties. Restate as: .md is the retired format and
      carries no working-tree retention obligation; .yaml plans stay at the docs/plans/ root pending
      their DuckLake upload; the lagged .yaml sweep remains deferred. HARD CONSTRAINT: the file is at
      3813 bytes against a 3813-byte budget (config/prose_budgets.yaml:37) -- ZERO headroom. The rewrite
      MUST NOT grow the file. Shrinking is safe (prose_limits.py:79-83 routes under-budget to a
      non-blocking advisory); growing by one byte hard-fails validate_prose_limits, registered pre=True
      with no pre_globs (scripts/checks/prose/_manifest.py:12-18). Keep the RS-07 heading so
      config/structural_size_budgets.yaml:145's `relief_valve: "archival lifecycle (RS-07)"` stays
      resolvable.
  - file: tests/checks/hygiene/validate_placement/test_dead_route_detection.py
    action: Create
    purpose: >-
      New test. Its load-bearing content is a REGRESSION guard; do not claim novel behavioural coverage.
      The runtime-vs-dead-target semantics are ALREADY asserted by
      tests/checks/hygiene/validate_placement/test_validate_placement.py:61-72
      (test_dead_target_reports_failure) and :74-88 (test_runtime_row_parent_tracked_passes), so a
      _dead_targets_for_route pair here would be a second entry point to the same behaviour, not new
      coverage -- include it only as cheap defence-in-depth, never as this test's justification. THE
      assertion that earns its place: assert topics `friction-analysis-log` and
      `rejected-suggestions-log` are absent from
      docs/contracts/file-router.yaml routes. Assert on TOPIC NAMES, never on the deleted file paths --
      a hardcoded `.friction-analysis-log.jsonl` literal would itself red verification step 3 (its regex
      alternatives all require a leading literal dot, so bare topic strings are safe).
  - file: tests/contracts_enforcement/test_log_storage_examples_resolve.py
    action: Create
    purpose: >-
      New test asserting every entry in docs/contracts/log-storage.yaml's
      patterns.locally_produced.examples (six entries at :61-67) satisfies at least one of: git-tracked
      under logs/, OR gitignored, OR carrying a `runtime: true` file-router route. All three arms are
      REQUIRED -- "git-tracked under logs/" alone is FALSE for three of the six and would make this test
      unpassable. VERIFIED status of each today: .retro-lite-log.jsonl and .execution-step-telemetry.jsonl
      are tracked; .recommendations-log.jsonl is gitignored (.gitignore:130) AND runtime-routed;
      .session-telemetry.jsonl is gitignored (.gitignore:133); .north-star-log.jsonl is neither tracked
      nor gitignored but IS runtime-routed (file-router.yaml:297-300); .friction-analysis-log.jsonl is
      tracked today. Hardcodes no basename, so it cannot red verification step 3. Genuinely red/green in
      the prescribed order: once .friction-analysis-log.jsonl is `git rm`'d it satisfies NO arm (it is
      not in .gitignore and its route is non-runtime and is deleted at execution step 7), so the test is
      RED at execution step 6 and GREEN once execution step 8 removes the entry.
  - file: tests/checks/hygiene/validate_placement/test_validate_placement.py
    action: Modify
    purpose: >-
      Repoint the synthetic fixture string at :84 (_mock_ls_files) from the deleted
      logs/.friction-analysis-log.jsonl to a still-tracked path UNDER logs/ (e.g.
      logs/.retro-lite-log.jsonl). The path is NOT arbitrary: the route under test is runtime: true
      targeting logs/.recommendations-log.jsonl, and _dead_targets_for_route (validate_placement.py:100-104)
      asserts the PARENT DIR logs/ appears in the mocked snapshot -- repointing outside logs/ reds
      test_runtime_row_parent_tracked_passes.
  - file: tests/session/preflight/test_env_git.py
    action: Modify
    purpose: >-
      Repoint the fake `git status --porcelain` string at :318 and its assertion at :323 off the deleted
      logs/.friction-analysis-log.jsonl to a still-tracked path UNDER logs/. Also not arbitrary:
      test_log_sync_committed_when_only_logs_dirty asserts status == "committed" precisely because every
      dirty path is under logs/; a path outside logs/ inverts the case the test exists to cover.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    No .md file remains under docs/plans/archive/ (all 195 deleted). The directory itself may cease to
    exist; the assertion is deliberately on .md membership, not directory absence, so a future RS-07
    lagged .yaml sweep may re-create it.
  - >-
    All 5 in-scope logs/ files are deleted; the other 5 tracked logs/ files
    (.customizations-manifest.json, .execution-step-telemetry.jsonl, .plan-audit-log.jsonl,
    .retro-lite-log.jsonl, .session-metrics-log.jsonl) are UNTOUCHED, each having a live writer or reader.
  - >-
    All 6 in-scope audit artefacts are deleted, and audits/ and docs/audit-prompts/ both remain
    non-empty and above the thresholds verification step 2 asserts (>=50 and >=20 tracked files).
  - >-
    No pre-existing docs/plans/PLAN-*.yaml file is deleted, modified, or renamed. Evaluated against the
    MERGE BASE (`git diff --name-status origin/main...HEAD`), never main's tip: the only permitted entry
    is the single 'A' row for this plan file itself.
  - Zero files under terraform/ are modified or deleted, likewise evaluated against the merge base.
  - >-
    docs/contracts/file-router.yaml no longer declares the friction-analysis-log or
    rejected-suggestions-log routes, carries a new amendment_log entry, and still declares the
    prose_allowlist glob docs/plans/**/*.md. Neither route is marked runtime: true.
  - >-
    docs/contracts/log-storage.yaml no longer lists .friction-analysis-log.jsonl and carries its own new
    amendment_log entry.
  - >-
    docs/DECISIONS.md carries one new numbered Decision matching the drafted heading and envelope, with
    significance.value numbered_decision and amends: [85].
  - >-
    Decision 85 carries a dated amendment trailer in the pinned trailing_bracket form pointing at the
    new Decision.
  - >-
    docs/CLAUDE.md's RS-07 section no longer references docs/plans/archive/ as a live destination, and
    the file is at most 3813 bytes (config/prose_budgets.yaml:37 has zero headroom).
  - >-
    No file under scripts/, src/, tests/, .github/, bin/ or config/ references any deleted path.
  - >-
    bin/venv-python -m scripts.validate --pre passes with the file-router placement check reporting zero
    dead targets, AND the full tier (bin/venv-python -m scripts.validate) passes, as
    handoff_policy.full_validation_required_before_commit requires.
verification_plan:
  - step: 1
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-targets-removed
    action: >-
      Prove all 206 in-scope paths are gone. Asserts only the negative (deleted-paths-stay-deleted)
      half, so the graduated kernel check never becomes a standing mandate that some other file must
      exist. The archive clause asserts NO .md REMAINS rather than directory absence, so a future RS-07
      lagged .yaml sweep that re-creates docs/plans/archive/ cannot red this registered check.
    command: >-
      test -z "$(git ls-files docs/plans/archive | grep '\.md$')" && test ! -f
      logs/.metrics-analysis-log.jsonl && test ! -f logs/.token-budget-log.jsonl && test ! -f
      logs/.transcript-index.jsonl && test ! -f logs/.friction-analysis-log.jsonl && test ! -f
      logs/.rejected-suggestions.jsonl && test ! -f audits/dependency-management-c8a2a17.md && test ! -f
      audits/dependency-management-c8a2a17.yaml && test ! -f
      audits/platform-roadmap-strategic-audit-ffd58dc.md && test ! -f
      audits/platform-roadmap-strategic-audit-ffd58dc.yaml && test ! -f
      docs/audit-prompts/AUDIT-dependency-management.md && test ! -f
      docs/audit-prompts/AUDIT-platform-roadmap-strategic-audit.md && echo SWEEP-COMPLETE
    expected: SWEEP-COMPLETE
    fix_if: >-
      Pre-edit this exits 1 at the first clause, which lists 195 tracked .md files. All 6 audit
      artefacts are named individually -- an earlier draft asserted only 3 and could not prove
      acceptance criterion 3. If a clause fails post-edit, that path was missed; delete it with `git rm`,
      never plain `rm` (validate_placement snapshots `git ls-files`, the index, so a plain rm leaves the
      path tracked and this step green while the scan still sees it).
  - step: 2
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      Deliberately NOT graduated. The command is kernel-expressible (a single chained test), so
      not-applicable would be the wrong disposition -- but freezing "these five logs and these directory
      counts must hold" into the verification registry would install a permanent retention mandate that
      no Decision ratifies and that would red a future legitimate retirement of any one of them. Its
      value is as a plan-local blast-radius check for THIS sweep, not as a standing obligation.
    action: >-
      Prove the deliberately-retained neighbours survived -- the assertion that distinguishes this sweep
      from an over-broad glob.
    command: >-
      test -f logs/.retro-lite-log.jsonl && test -f logs/.session-metrics-log.jsonl && test -f
      logs/.plan-audit-log.jsonl && test -f logs/.execution-step-telemetry.jsonl && test -f
      logs/.customizations-manifest.json && test "$(git ls-files audits | wc -l)" -ge 50 && test "$(git
      ls-files docs/audit-prompts | wc -l)" -ge 20 && echo SURVIVORS-INTACT
    expected: SURVIVORS-INTACT
    fix_if: >-
      A failure means the sweep deleted a RETAINED artefact -- restore it from git. Losing
      logs/.retro-lite-log.jsonl is the worst case: it is READ by the registered
      validate_prompt_compliance check (scripts/checks/contracts/validate_prompt_compliance.py:26). A
      count failure means a glob ate audits/ or docs/audit-prompts/ wholesale. Counts are 57 and 25
      today, 53 and 23 post-sweep, so the thresholds carry headroom for unrelated merges.
  - step: 3
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-no-live-code-refs
    action: >-
      Prove no live code, test, config or workflow still names a deleted path. Genuine red/green: it
      currently returns 3 hits across the 2 stale-fixture files in scope, and also catches either new
      test if it hardcodes a deleted path instead of asserting structurally.
    command: >-
      test -z "$(git grep -nE 'plans/archive|\.metrics-analysis-log|\.token-budget-log|\.transcript-index|\.friction-analysis-log|\.rejected-suggestions'
      -- scripts/ src/ tests/ .github/ bin/ config/ ':!*.pyc')" && echo NO-LIVE-REFS
    expected: NO-LIVE-REFS
    fix_if: >-
      Pre-edit this prints exactly 3 hits: test_validate_placement.py:84, test_env_git.py:318 and :323.
      Repoint those fixture strings; do NOT delete the tests. If it reds AFTER the change, the likeliest
      cause is a new test hardcoding a deleted path -- assert on topic names or resolve entries
      structurally instead. Deliberately scoped to code directories: docs/ and audits/ prose citations to
      archived .md plans are historical record and are expected to remain (constraint 6).
  - step: 4
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      Not admittable, by this step's own nature. The registry's differential gate
      (validate_verification_registry.py:40-74 -> verification_graduation.run_differential:237-249)
      requires a candidate check to FAIL in an origin/main worktree and PASS on HEAD; this command is
      GREEN on the unmodified tree (it is a partial-application guard), so it would be refused as
      tautological and would red validate --pre. It is additionally duplicative: validate_placement is
      already a registered check running in both tiers.
    action: >-
      Prove the file-router dead-target scan is green after the two routes are retired. This is a
      partial-application guard, not before/after evidence -- it is GREEN on the unmodified tree and
      reds only in the intermediate state where files are deleted but the routes still reference them.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene import validate_placement; f=[];
      validate_placement.validate_placement(f); assert not f, f; print('PLACEMENT-PASS')"
    expected: PLACEMENT-PASS
    fix_if: >-
      If this reports "dead target(s)" naming logs/.friction-analysis-log.jsonl or
      logs/.rejected-suggestions.jsonl, the route deletion is missing or incomplete. Do NOT resolve it by
      restoring the log files, and do NOT resolve it by adding `runtime: true` -- that marker means
      "regenerated at runtime" (file-router.yaml:13-16) and neither file has a writer, so it would be a
      false claim that permanently silences this scan.
  - step: 5
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-route-regression-guard
    action: >-
      Red/green evidence for the file-router edit. The behavioural half exercises
      _dead_targets_for_route directly on synthetic routes, so it cannot pass merely because a file is
      absent; the regression half pins the two retired topics.
    command: bin/venv-python -m pytest "tests/checks/hygiene/validate_placement/test_dead_route_detection.py" -q
    expected: all tests pass
    fix_if: >-
      Authored per execution step 5 while the routes are still declared, so its regression half is
      genuinely RED on first run and goes GREEN at execution step 7. If the behavioural half passes
      before the detector is exercised, it is asserting on the wrong thing -- it must build a route dict
      and a tracked set and call _dead_targets_for_route, not merely inspect the committed YAML.
  - step: 6
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: log-storage-examples-resolve
    action: >-
      Red/green evidence for the log-storage.yaml edit -- assert every
      patterns.locally_produced.examples entry is tracked under logs/, OR gitignored, OR carries a
      runtime: true file-router route. Generic and hardcode-free, so it survives future example changes
      and cannot red step 3.
    command: bin/venv-python -m pytest "tests/contracts_enforcement/test_log_storage_examples_resolve.py" -q
    expected: all tests pass
    fix_if: >-
      Authored per execution step 6, AFTER the log deletions and BEFORE the contract edit, so it is
      genuinely RED on first run (.friction-analysis-log.jsonl is then listed but satisfies no arm) and
      GREEN at execution step 8. All THREE arms are required: a tracked-only predicate is false for
      .recommendations-log.jsonl, .session-telemetry.jsonl and .north-star-log.jsonl and can never go
      green. If it is green on first run, it is not resolving entries against `git ls-files` /
      `git check-ignore` / the router at all.
  - step: 7
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      Not admittable, and actively harmful if it were. In an origin/main worktree the merge-base diff is
      empty, so both clauses pass and the differential gate
      (validate_verification_registry.py:40-74) refuses it as tautological. Were it admitted, a standing
      check asserting "no docs/plans/PLAN-*.yaml shows a non-A row and no terraform/ file changes" would
      red every future terraform change and every /implement graduate-to-waive disposition flip -- the
      normal post-merge plan edit. Plan-local carve-out guard only.
    action: >-
      Prove the two explicit out-of-scope carve-outs held: the .yaml plan corpus is untouched (pending
      DuckLake upload) and terraform/ is untouched. The terraform half matters because deleting a .tf
      from an applied root is a DESTROY operation, not cleanup.
    command: >-
      test -z "$(git diff --name-only origin/main...HEAD -- terraform/)" && test -z "$(git diff
      --name-status origin/main...HEAD -- 'docs/plans/PLAN-*.yaml' | grep -v '^A')" && echo
      CARVE-OUTS-INTACT
    expected: CARVE-OUTS-INTACT
    fix_if: >-
      THREE-DOT (origin/main...HEAD) is required and is not a stylistic choice. Two-dot `git diff
      origin/main` compares against main's TIP, so every plan merged to main after this branch point
      surfaces as a phantom 'D' and reds the step for reasons unrelated to the sweep -- an earlier draft
      had exactly that bug. Three-dot compares against the merge base, matching
      contract-population.yaml's own base_resolution semantics. Clause 2 permits exactly the 'A' row for
      this plan file while rejecting any D, M or rename R. Any terraform/ diff must be reverted
      outright -- this plan deletes nothing there.
  - step: 8
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      docs/CLAUDE.md's byte budget is already enforced by the registered validate_prose_limits check,
      which sources the number from config/prose_budgets.yaml. Graduating a registry copy would freeze
      the literal 3813 and then block a future legitimate `# raise-approved: dec-NNN` raise -- the same
      frozen-constant brittleness this plan corrected elsewhere. Plan-local guard only.
    action: >-
      Prove the docs/CLAUDE.md rewrite did not grow the file past its zero-headroom prose budget. This
      is the most likely accidental CI failure in the plan, and the scope guard blocks the obvious
      remedy (config/prose_budgets.yaml is deliberately not in scope).
    command: >-
      bin/venv-python -c "from scripts.checks.prose import prose_limits; f=[];
      prose_limits.validate_prose_limits(f); assert not f, f; print('PROSE-OK')"
    expected: PROSE-OK
    fix_if: >-
      config/prose_budgets.yaml:37 pins docs/CLAUDE.md at 3813 bytes and the file is currently exactly
      3813 -- zero headroom. If this reds, SHORTEN the RS-07 rewrite; do not raise the budget. Shrinking
      is always safe (prose_limits.py:79-83 routes under-budget to a non-blocking advisory). The command
      reads the budget from config rather than hardcoding it, so it stays correct if the budget moves.
  - step: 9
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      The decisions corpus checks are already registered and graduated in their own right; a registry row
      re-running the same pytest selectors would duplicate an existing gate rather than add coverage.
      This step proves THIS plan's DECISIONS.md edit parses, not a new standing check.
    action: >-
      Prove the new Decision entry and the Decision 85 amendment trailer are well-formed and the
      decisions corpus still parses and indexes.
    command: bin/venv-python -m pytest tests/decisions_md/ tests/test_decisions_index.py -q
    expected: all tests pass
    fix_if: >-
      A parse failure means the entry's header, envelope or trailer deviates from
      docs/contracts/decision-entry.yaml's grammar -- fix the entry, never the parser. The trailer must
      use the pinned trailing_bracket form (:130-134). If a size check complains, docs/DECISIONS.md is
      near its Decision 134 ceiling and the entry must be tightened; change-record content belongs in the
      PR body, not the entry.
  - step: 10
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      This is the repository-wide presubmit gate itself, authoritative in PR CI per Decision 73's
      two-tier model. Graduating a registry check that shells out to the whole validate run would be
      circular, so its disposition is a deliberate waiver rather than a new kernel check.
    action: >-
      Run BOTH presubmit tiers over the complete change set. The full tier is mandatory, not optional:
      this plan declares handoff_policy.full_validation_required_before_commit, and
      scripts/checks/verification/validate_handoff_full_tier.py:109-115 FAILS any such plan whose
      verification_plan contains no `-m scripts.validate` invocation without --pre. An earlier draft
      declared the policy with only a --pre step and was red on arrival for exactly that reason.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    expected: "All checks passed."
    fix_if: >-
      The likeliest failures, in order: (1) handoff-full-tier, if the full-tier segment was dropped --
      the matcher splits on && and requires a segment with `-m scripts.validate` and no --pre, which the
      second half of this command supplies; (2) validate_prose_limits on docs/CLAUDE.md -- diagnose with
      step 8 and SHORTEN the rewrite; (3) validate_contract_drift reporting a Class D contract whose
      content changed with no new amendment_log entry -- add it to file-router.yaml or log-storage.yaml;
      (4) validate_placement dead targets -- diagnose with step 4. Never disable or narrow a check to get
      green.
test_obligations:
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The dead-target scan reports a non-runtime route whose target is untracked and does NOT report an
      equivalent runtime route, and the two routes whose targets this plan deletes are retired rather
      than exempted -- so route retirement cannot be substituted by a false runtime: true label.
    verification_step: 5
    test_selector: tests/checks/hygiene/validate_placement/test_dead_route_detection.py
    red_green_expectation: >-
      RED before -- authored at execution step 5 while both routes are still declared and their targets
      already deleted, so the regression half fails. GREEN at execution step 7 when the routes are
      retired. The behavioural half calls _dead_targets_for_route on synthetic routes, so it proves the
      detector's semantics rather than passing because a file happens to be absent.
  - source: docs/contracts/log-storage.yaml
    behavior: >-
      Every patterns.locally_produced.examples entry is tracked under logs/, OR gitignored, OR carries a
      runtime: true file-router route, so the contract cannot keep asserting the existence of a retired
      artefact that satisfies none of the three.
    verification_step: 6
    test_selector: tests/contracts_enforcement/test_log_storage_examples_resolve.py
    red_green_expectation: >-
      RED before -- authored at execution step 6, after the log deletions and before the contract edit,
      so .friction-analysis-log.jsonl is listed while satisfying no arm (untracked, not gitignored, and
      its route non-runtime). GREEN at execution step 8 when the entry is removed. Hardcodes no basename,
      so it cannot red verification step 3, and it is the generic control whose absence let this row
      escape the plan-time fixpoint sweep.
constraints:
  - >-
    Do NOT delete, move, or modify any docs/plans/PLAN-*.yaml file. They are held in-repo pending upload
    to the DuckLake warehouse table, which is not yet ready (author direction, this session).
  - >-
    Do NOT delete or modify anything under terraform/. A 10-agent adversarial sweep produced 30+
    dead-file claims and refuted every one. The bare terraform/ root is not applied by any workflow but
    IS a live CI-gated governance surface: scripts/checks/_terraform.py:72 lists "terraform" in
    _TERRAFORM_ROOTS, so the required terraform-validate job runs init/validate/fmt against it as a
    single HCL graph. terraform/personal/ auto-applies on merge to main -- deleting a .tf there is a
    DESTROY operation.
  - >-
    Do NOT mark the two retired file-router routes `runtime: true`. That marker asserts the target is a
    gitignored/untracked file regenerated at runtime (file-router.yaml:13-16, Decision 84 local-cache
    model). Neither target has a writer and neither is gitignored, so the label would be false and would
    permanently silence the dead-target scan for a genuinely dead route.
  - >-
    Do NOT remove the prose_allowlist glob docs/plans/**/*.md from docs/contracts/file-router.yaml. Four
    docs/plans/reports/*.md files still match it, and narrowing a Decision 127 clause-1(d) permanent
    prose class needs its own cited amendment.
  - >-
    Do NOT delete the remaining 5 tracked logs/ files. Each has a live writer or reader; in particular
    logs/.retro-lite-log.jsonl is READ by the registered validate_prompt_compliance check.
  - >-
    Prose citations to archived .md plans in docs/DECISIONS.md, docs/SESSION_LOG*.md,
    docs/ROADMAP-PLATFORM.yaml and logs/*.jsonl are historical record and MUST be left as-is -- narrative
    mentions, not functional dependencies. This carve-out does NOT extend to docs/contracts/: a contract
    is a machine-read surface, which is why log-storage.yaml is in scope.
  - >-
    Do NOT grow docs/CLAUDE.md. It sits at exactly its 3813-byte budget with zero headroom, and
    config/prose_budgets.yaml is not in scope, so the scope guard blocks the raise remedy.
  - >-
    Do NOT edit docs/DECISIONS.md to remove or renumber any existing header. Decision 149's
    never-remove-headers rule stands; this plan ADDS one entry and appends one amendment trailer.
  - >-
    Use `git rm` / plain deletion via Bash. The .claude/hooks/edit_scope_guard.py PreToolUse hook gates
    Edit/Write/MultiEdit/NotebookEdit only -- its docstring states "Bash is NOT gated". `git rm` (not
    `rm`) is required so the index updates: validate_placement snapshots `git ls-files`.
  - >-
    Evaluate every diff-based assertion against the MERGE BASE (`origin/main...HEAD` three-dot, or
    `$(git merge-base origin/main HEAD)`), never two-dot `origin/main`. Two-dot compares against main's
    tip and reports every post-branch-point merge as a phantom deletion.
context:
  - >-
    ORIGIN: user-requested repo-wide dead-file sweep. The premise inverted during discovery -- there is
    NO dead Python code. An AST import-reachability graph over 1068 .py files (roots: bin/,
    .claude/hooks/, setup.py, Lambda handlers, __main__, top-level scripts, plus string-literal module
    references from _manifest.py Entry declarations and CI workflows) found 428 of 429 non-test modules
    reachable. The single outlier, scripts/checks/product/trading/__init__.py, is a 1-line package marker
    required for its package to import. T3.11-T3.13 already shipped scripts/dead_code_detector.py,
    scripts/dependency_graph.py and .importlinter, which cover CODE orphanhood; nothing covers ARTEFACT
    orphanhood, which is why this sweep was hand-derived.
  - >-
    METHOD: candidates were derived by fixpoint reference analysis -- a file is orphaned only if every
    inbound textual reference comes from another file also being deleted -- matching full path, basename,
    PLAN-/AUDIT- stem, bare slug, and sha-stripped slug. The bare-slug term earned its place on the
    depth-1 .yaml corpus, where docs/ROADMAP-PLATFORM.yaml pins plans by bare slug via `met_by:` and
    scripts/checks/roadmap/validate_platform_roadmap.py:62-73 existence-checks them; it saved 24 false
    positives there. It is NOT what makes THIS deletion safe: that check resolves `PLAN-{met_by}.yaml` at
    docs/plans/ depth-1 only, so an archive/*.md file could never satisfy or break it. The method's real
    limitation is that it swept only the plans/audits/prompts zones and code directories, which is how
    docs/contracts/log-storage.yaml:66 escaped -- found later at the plan-critique gate, and now guarded
    mechanically by the test at verification step 6.
  - >-
    REHEARSED: a 204-file deletion was applied in an isolated git worktree against origin/main and
    validated -- `validate --pre` returned EXIT=0 including "File router placement check (RS-04): PASS:
    86 route(s), zero dead targets", and pytest across tests/checks/hygiene/, roadmap/, structural/,
    contracts/, tests/docs/, test_plan_obligations.py, test_decisions_index.py and tests/decisions_md/
    returned 1037 passed. The worktree was removed; no repo state changed. The 204 vs 206 delta is
    exactly logs/.friction-analysis-log.jsonl and logs/.rejected-suggestions.jsonl, added to scope after
    the rehearsal. TREAT THE REHEARSAL AS EVIDENCE THE BULK DELETION IS CI-SAFE, NOT as evidence for the
    plan as now written: it used the since-rejected runtime: true flip rather than route deletion, and
    predated the log-storage.yaml, prose-budget and full-tier findings.
  - >-
    DECISION-GATE HISTORY: the decision-scout gate returned BLOCK on Decision 85, whose clause reads
    "Historical PLAN-*.md files remain in the working tree and commit history; none are retroactively
    converted (one-way, non-rolling migration)." The author (this repo's owner) clarified in-session that
    this was descriptive of ratification-time state, not a forward retention directive. The new Decision
    is nonetheless authored as a forward-standing rule rather than as that clarification, because a
    retrospective reading routes as operational_fact, which Decision 167 clause 2 rejects for a numbered
    entry.
  - >-
    WHY DELETION IS WORTH IT: docs/plans/archive/ is out of the validate_plan_documents glob (which is
    non-recursive) but NOT out of the agent grep path. Measured share of repo-wide `git grep -l` hits
    landing in docs/plans/archive/: validate.py 139/643 (21%), ops_recommendations 60/284 (21%),
    "terraform apply" 40/175 (22%). The 195 files are 9.7% of tracked files and ~10% of tracked bytes. In
    an agent-first repository that grep noise is the actual cost.
  - >-
    RS-07 DISPOSITION: audits/repository-structure-cb02572.yaml:533 records the ideal state as
    "completed/deprecated plans under docs/plans/archive/". That finding carries no status field and no
    mechanical obligation, and its acceptance clause (:539, "docs/plans/ root contains no completed
    deprecated-format .md plan files") is still satisfied by deletion. Note the superseding disposition in
    the new Decision or the PR body so a future reader of RS-07 is not left holding a reversed remedy
    with no pointer.
  - >-
    LOGS TRIAGE: of 10 tracked logs/ files, 5 are dead and 5 live. All 5 dead ones are frozen at their
    2026-05-28 commit, predating the entire current plan corpus. The 5 retained ones each have a live
    writer or reader (scripts/list_customizations.py:141, scripts/executor/step_runner.py:591 +
    run_summary.py:128, scripts/roadmap/plan_audit.py:303, scripts/prompt_compliance.py:145 +
    validate_prompt_compliance.py:26, scripts/session/metrics.py:162). Removing those 5 would mean
    removing the features that write them -- that is rec-031's much larger scope, deliberately excluded.
  - >-
    REC LINKAGE: rec-031 [High] "Workflow orphan cleanup: remove/collapse LLM-era scripts, agents, and
