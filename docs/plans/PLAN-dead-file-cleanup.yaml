context:
  - >-
    ORIGIN: user-requested repo-wide dead-file sweep. The premise inverted during discovery -- there is
    NO dead Python code. An AST import-reachability graph over 1068 .py files (roots: bin/,
    .claude/hooks/, setup.py, Lambda handlers, __main__, top-level scripts, plus string-literal module
    references from _manifest.py Entry declarations and CI workflows) found 428 of 429 non-test modules
    reachable. The single outlier, scripts/checks/product/trading/__init__.py, is a 1-line package marker
    required for its package to import. T3.11-T3.13 already shipped scripts/dead_code_detector.py,
    scripts/dependency_graph.py and .importlinter, which cover CODE orphanhood; nothing covers ARTEFACT
    orphanhood, which is why this sweep was hand-derived.
  - >-
    METHOD: candidates were derived by fixpoint reference analysis -- a file is orphaned only if every
    inbound textual reference comes from another file also being deleted -- matching full path, basename,
    PLAN-/AUDIT- stem, bare slug, and sha-stripped slug. The bare-slug term is load-bearing: a first pass
    matching only stems produced 24 false positives, because docs/ROADMAP-PLATFORM.yaml pins plans by
    bare slug via `met_by:`, which scripts/checks/roadmap/validate_platform_roadmap.py:62-73
    existence-checks as a hard CI failure. That analysis nonetheless MISSED
    docs/contracts/log-storage.yaml:66 (found at the plan-critique gate), which is why constraint 6 now
    names docs/contracts/ explicitly rather than relying on the sweep.
  - >-
    REHEARSED: a 204-file deletion of this shape was applied in an isolated git worktree against
    origin/main and validated. `validate --pre` returned EXIT=0 with all checks passing, including "File
    router placement check (RS-04): PASS: 86 route(s), zero dead targets". pytest across
    tests/checks/hygiene/, roadmap/, structural/, contracts/, tests/docs/, test_plan_obligations.py,
    test_decisions_index.py and tests/decisions_md/ returned 1037 passed. The worktree was removed; no
    repo state changed. CAVEAT: the rehearsal used the since-rejected `runtime: true` flip rather than
    route deletion, and predated the log-storage.yaml and prose-budget findings -- treat it as evidence
    the deletion set is CI-safe, not as evidence the current contract edits are.
  - >-
    DECISION-GATE HISTORY: the decision-scout gate returned BLOCK on Decision 85, whose clause reads
    "Historical PLAN-*.md files remain in the working tree and commit history; none are retroactively
    converted (one-way, non-rolling migration)." The author (this repo's owner) clarified in-session that
    this was descriptive of the state at ratification, not a forward retention directive. The new
    Decision must nonetheless be authored as a forward-standing rule rather than as that clarification,
    because a retrospective reading routes as operational_fact, which Decision 167 clause 2 rejects for a
    numbered entry.
  - >-
    WHY DELETION IS WORTH IT: docs/plans/archive/ is out of the validate_plan_documents glob (which is
    non-recursive) but NOT out of the agent grep path. Measured share of repo-wide `git grep -l` hits
    landing in docs/plans/archive/: validate.py 139/643 (21%), ops_recommendations 60/284 (21%),
    "terraform apply" 40/175 (22%). The 195 files are 9.7% of tracked files and ~10% of tracked bytes. In
    an agent-first repository that grep noise is the actual cost.
  - >-
    LOGS TRIAGE: of 10 tracked logs/ files, 5 are dead and 5 live. All 5 dead ones are frozen at their
    2026-05-28 commit, predating the entire current plan corpus. The 5 retained ones each have a live
    writer or reader (scripts/list_customizations.py:141, scripts/executor/step_runner.py:591 +
    run_summary.py:128, scripts/roadmap/plan_audit.py:303, scripts/prompt_compliance.py:145 +
    validate_prompt_compliance.py:26, scripts/session/metrics.py:162). Removing those 5 would mean
    removing the features that write them -- that is rec-031's much larger scope, deliberately excluded.
  - >-
    REC LINKAGE: rec-031 [High] "Workflow orphan cleanup: remove/collapse LLM-era scripts, agents, and
    logs" covers 18 removable components including 7 log files. This plan removes 5 logs, so it ADVANCES
    but does not close rec-031. It is deliberately NOT in bundled_recommendations and the squash commit
    must NOT carry a Resolves: trailer for it -- closing it would be false.
  - >-
    FOLLOW-ON, and its relationship to this plan's graduations: verification steps 1 and 3, once
    graduated, become a narrow anti-regrowth guard for THESE 206 paths specifically. They are not a
    general detector. File one recommendation for a general mechanical artefact-orphan detector, scoped
    to DETECTION ONLY -- never auto-deletion, per Decision 70's refusal to create a routine destructive
    path. This mirrors Decision 147 clause 4, which filed rec-2781 rather than shipping the one-shot
    compaction bare. Use `bin/venv-python -m scripts.ops_data_portal` (call get_rec_write_guidance()
    before file_rec()).
  - >-
    DECISIONS TO CITE in the new entry and the PR body: 85 (the clause being amended), 121 (retire a
    sanctioned prose artefact outright via a numbered Decision -- the template here), 147 (provenance
    survives in git history; follow-on rec pattern), 70 (physical deletion stays exceptional and
    deliberate), 86 (inbound-reference sweep before deleting a grandfathered doc), 127 (sanctioned prose
    taxonomy -- why the prose glob is kept), 166 (workflow_outputs exempt class survives; no
    structural_size_budgets edit implied), 167 (significance/category consistency), 168 (Class D
    declared-evaluator and the amendment-trailer pattern), 115 (retire-by-convention without a guard).
