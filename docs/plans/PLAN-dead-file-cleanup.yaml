rollback: >-
  Every change is a deletion or an additive text edit, all captured in one squash commit, so
  `git revert <sha>` restores all 206 files and reverses the four text edits atomically. No
  infrastructure, warehouse table, deployed artefact or runtime state is touched, so there is nothing
  to unwind outside git. If a problem surfaces after merge, revert first and re-derive the orphan set
  rather than patching forward -- a partial restore risks leaving a route marked runtime: true while
  its target is tracked again, which is the one state the new test in scope is written to catch.
