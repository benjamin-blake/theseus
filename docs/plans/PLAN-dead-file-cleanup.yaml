schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: false
slug: dead-file-cleanup
intent: >-
  Delete 206 verified-dead one-shot agent artefacts (195 legacy docs/plans/archive/*.md plans,
  5 decommissioned logs/ files, 6 orphaned audit artefacts; 4.01 MB), retire the two file-router
  routes whose targets those deletions remove, and record the governance edits deletion requires.
  A repo-wide sweep proved the Python tree is 100% import-reachable (428/429 non-test modules; the
  one outlier is a 1-line package marker), so NO source code is in scope -- all deadweight is
  accumulated workflow output. docs/plans/PLAN-*.yaml are explicitly OUT of scope pending their
  DuckLake upload. terraform/ contributes ZERO deletions.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-dead-file-cleanup.yaml
phase: >-
  Repository hygiene (ad-hoc, user-explicit). No tier_item; docs-and-artefacts only, zero runtime
  code change. This is NOT the RS-07 lagged sweep -- that obligation is defined for completed .yaml
  plans and constraint 1 explicitly defers it. This sweep retires the .md format that RS-07's FIRST
  sweep had already relocated into docs/plans/archive/.
scope:
  - file: docs/plans/archive/
    action: Delete
    purpose: >-
      All 195 legacy PLAN-*.md files (3.59 MB), the deprecated pre-T1.11 planning format superseded
      one-way by schema-validated .yaml (Decision 85). VERIFIED zero mechanisms read this directory:
      `grep -rn "plans/archive" scripts/ tests/ config/ .github/ .claude/ docs/contracts/` returns
      nothing. Three dead depth-1 .md plan paths survive in code and are deliberately NOT retired by
      this plan (scripts/roadmap/find_plan.py:68 PLAN-{slug}.md, :73 legacy PLAN.md, and
      scripts/roadmap/plan_audit.py:52-53 + :225-226); all three resolve against docs/plans/ depth-1,
      where zero .md files exist, so they are unaffected by deleting archive/. The directory holds
      exactly 195 entries, all .md, all tracked, zero untracked strays, so `git rm` removes it cleanly.
      It is not a file-router route target.
  - file: logs/.metrics-analysis-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry. VERIFIED zero inbound references repo-wide and no file-router route.
      The file-router `metrics-analysis-log` topic targets logs/.session-metrics-log.jsonl -- a
      DIFFERENT, retained file -- so that route is untouched. Frozen at its 2026-05-28 commit.
  - file: logs/.token-budget-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry (330 lines). VERIFIED no writer or reader in scripts/ or src/; the only
      references are historical prose in CHANGELOG and the INTENT-telemetry decommission list. No
      file-router route. Frozen at 2026-05-28.
  - file: logs/.transcript-index.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry, superseded by the telemetry_transcripts table. VERIFIED single inbound
      reference is docs/INTENT-telemetry-system.md:577, which lists it as REPLACED. No writer, no
      file-router route. Frozen at 2026-05-28.
  - file: logs/.friction-analysis-log.jsonl
    action: Delete
    purpose: >-
      VERIFIED no production reader or writer. The only tests/ hits are synthetic fixture STRINGS
      (test_validate_placement.py:84 passes it to _mock_ls_files; test_env_git.py:318 embeds it in a
      fake porcelain string) -- neither opens the real file. Has TWO contract references that must be
      retired with it: the file-router route (below) and docs/contracts/log-storage.yaml:66. Frozen at
      2026-05-28.
  - file: logs/.rejected-suggestions.jsonl
    action: Delete
    purpose: >-
      Cron rejection memory, 1 line. VERIFIED zero code references anywhere -- its only inbound
      reference in the repo is the file-router route retired below. Frozen at 2026-05-28.
  - file: audits/dependency-management-c8a2a17.md
    action: Delete
    purpose: >-
      Orphaned audit output. VERIFIED by fixpoint reference analysis (matching full path, basename,
      stem, bare slug, and sha-stripped slug): no live file references it. Its paired prompt is also
      deleted, so the slug leaves the repo as a complete unit.
  - file: audits/dependency-management-c8a2a17.yaml
    action: Delete
    purpose: >-
      Structured companion of the above; same fixpoint verdict. Not read by any command --
      config/agent/verification_registry/registry.yaml opens exactly one audits/ file
      (executor-roadmap-review-7d57a0d.yaml at :3438), which is NOT in scope.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.md
    action: Delete
    purpose: Orphaned audit output; same fixpoint verdict. Paired prompt deleted below.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.yaml
    action: Delete
    purpose: Structured companion of the above; same fixpoint verdict.
  - file: docs/audit-prompts/AUDIT-dependency-management.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted. VERIFIED not referenced by any
      mechanism; registry.yaml greps only AUDIT-decision-knowledge-persistence-scalability.md (which
      already does not exist) and AUDIT-terraform-deployment-strategy.md, neither in scope.
  - file: docs/audit-prompts/AUDIT-platform-roadmap-strategic-audit.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted; same verdict. audits/ goes 57 -> 53
      and docs/audit-prompts/ goes 25 -> 23, so neither directory empties and both stay valid
      file-router route targets.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      DELETE the friction-analysis-log route (:288-290) and the rejected-suggestions-log route
      (:306-308) outright. Do NOT mark them `runtime: true`: :13-16 defines that marker as "a route
      whose target is a warehouse read-cache: a gitignored or otherwise untracked file that is
      REGENERATED AT RUNTIME (Decision 84 local-cache model)". Neither target is regenerated (this
      plan's own analysis proves neither has any writer) and neither is gitignored, unlike all four
      genuine runtime rows (north-star-log has a live writer at scripts/north_star_tracker.py:106;
      recommendations-log, decisions-index and execution-checkpoint-state are gitignored at
      .gitignore:130,134,129). Flipping the marker would permanently silence the dead-target scan on a
      false semantic basis. A route to an artefact that no longer exists is not a discovery route --
      retire it. Add an amendment_log entry with change_class: accepted_values_narrow (from the closed
      8-value vocabulary at scripts/contracts_schema.py:50-60). KEEP the prose_allowlist glob
      docs/plans/**/*.md unchanged: 4 docs/plans/reports/*.md still match it.
  - file: docs/contracts/log-storage.yaml
    action: Modify
    purpose: >-
      Remove `.friction-analysis-log.jsonl` from patterns.locally_produced.examples at :66 -- it names
      a file this plan deletes. This is a Class D contract, so the edit also requires its own
      amendment_log entry (change_class: accepted_values_narrow) per
      docs/contracts/contract-population.yaml:233-235. NOTE: validate_log_storage_registry.py:38-62
      only compares the `routing` block against s3_log_store's fallback constants, so a stale entry
      here would NOT red CI -- which is exactly why it must be caught deliberately. Decision 86's
      inbound-reference sweep is the governing obligation.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add ONE numbered Decision, authored as a FORWARD-STANDING COMMITMENT (significance.value:
      numbered_decision; justification: it establishes a durable, reversal-relevant rule for every
      future deprecated-format retirement, not a point-fix). Frame it as: "a deprecated
      planning-artefact format carries no working-tree retention obligation; retirement is by
      deletion, with provenance surviving in git history (Decision 147)." Do NOT frame it as a
      retrospective reading of Decision 85's sentence -- that shape reads as operational_fact under
      docs/contracts/decision-entry.yaml's routing, which Decision 167 clause 2 rejects outright for a
      numbered entry. Declare `amends: [85]` in the envelope, and add a dated amendment trailer under
      Decision 85 itself (the Decision 168 pattern: "[Amendment YYYY-MM-DD: ...]"), so a future reader
      of Decision 85's retention clause finds the pointer. Removes/renumbers no header (Decision 149).
      Per AGENTS.md's change-record content rule, what changed / why now / measurements go in the PR
      body, NOT this entry.
  - file: docs/CLAUDE.md
    action: Modify
    purpose: >-
      Rewrite the "Plans lifecycle (RS-07)" section (lines 40-59). It currently defines the archival
      criterion as "a depth-1 docs/plans/ file is archived iff its extension is .md" and points at
      docs/plans/archive/ -- a directory this plan deletes. Restate as: .md is the retired format and
      carries no working-tree retention obligation; .yaml plans stay at the docs/plans/ root pending
      their DuckLake upload; the lagged .yaml sweep remains deferred. HARD CONSTRAINT: the file is at
      3813 bytes against a 3813-byte budget (config/prose_budgets.yaml:37) -- ZERO headroom. The
      rewrite MUST NOT grow the file. Shrinking is safe (prose_limits.py:79-83 routes under-budget to a
      non-blocking advisory); growing by one byte hard-fails validate_prose_limits, which
      scripts/checks/prose/_manifest.py:12-18 registers pre=True with no pre_globs. Leave
      config/structural_size_budgets.yaml:145's `relief_valve: "archival lifecycle (RS-07)"` reference
      resolvable -- do not delete the RS-07 heading itself.
  - file: tests/checks/hygiene/validate_placement/test_dead_route_detection.py
    action: Create
    purpose: >-
      New test with TWO assertions. (a) Behavioural guard: build a synthetic routes payload containing
      a route whose target is neither tracked nor marked runtime, and assert
      validate_placement._dead_targets_for_route (or the public path) reports it dead -- this is the
      property that actually protects the repo, and it cannot pass vacuously. (b) Regression guard:
      assert the topics `friction-analysis-log` and `rejected-suggestions-log` are absent from
      docs/contracts/file-router.yaml's routes. Assert on TOPIC NAMES, never on the deleted file paths
      -- a hardcoded `.friction-analysis-log.jsonl` literal would itself red verification step 3.
  - file: tests/checks/hygiene/validate_placement/test_validate_placement.py
    action: Modify
    purpose: >-
      Repoint the synthetic fixture string at :84 (_mock_ls_files) from the deleted
      logs/.friction-analysis-log.jsonl to a still-tracked path. The fixture is arbitrary and the test
      passes either way, but leaving a deleted path in a fixture is exactly the stale reference this
      sweep exists to remove.
  - file: tests/session/preflight/test_env_git.py
    action: Modify
    purpose: >-
      Repoint the fake `git status --porcelain` string at :318 and its assertion at :323 off the
      deleted logs/.friction-analysis-log.jsonl to a still-tracked path. Same rationale as above.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    All 195 docs/plans/archive/*.md files are deleted and the docs/plans/archive/ directory no longer
    exists in the working tree.
  - >-
    All 5 in-scope logs/ files are deleted; the other 5 tracked logs/ files
    (.customizations-manifest.json, .execution-step-telemetry.jsonl, .plan-audit-log.jsonl,
    .retro-lite-log.jsonl, .session-metrics-log.jsonl) are UNTOUCHED, each having a live writer or reader.
  - >-
    All 6 in-scope audit artefacts are deleted, and audits/ and docs/audit-prompts/ both remain
    non-empty (53 and 23 files respectively).
  - >-
    No pre-existing docs/plans/PLAN-*.yaml file is deleted, modified, or renamed. The only permitted
    entry in `git diff --name-status origin/main -- 'docs/plans/PLAN-*.yaml'` is the single 'A' row for
    this plan file itself.
  - Zero files under terraform/ are modified or deleted.
  - >-
    docs/contracts/file-router.yaml no longer declares the friction-analysis-log or
    rejected-suggestions-log routes, carries a new amendment_log entry, and still declares the
    prose_allowlist glob docs/plans/**/*.md. Neither route is marked runtime: true.
  - >-
    docs/contracts/log-storage.yaml no longer lists .friction-analysis-log.jsonl and carries its own
    new amendment_log entry.
  - >-
    docs/DECISIONS.md carries one new numbered Decision, framed as a forward-standing commitment with
    a declared significance.value of numbered_decision and `amends: [85]`, plus a dated amendment
    trailer under Decision 85. docs/CLAUDE.md's RS-07 section no longer references docs/plans/archive/.
  - >-
    docs/CLAUDE.md is at most 3813 bytes after the rewrite (config/prose_budgets.yaml:37 has zero
    headroom).
  - >-
    No file under scripts/, src/, tests/, .github/, bin/ or config/ references any deleted path.
  - >-
    bin/venv-python -m scripts.validate --pre passes, with the file-router placement check reporting
    zero dead targets.
verification_plan:
  - step: 1
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-targets-removed
    action: >-
      Prove all 206 in-scope paths are gone. Deliberately asserts ONLY the negative
      (deleted-paths-stay-deleted) half, so the graduated kernel check never becomes a standing
      mandate that some other file must exist forever. Survivors are asserted separately in step 2,
      which is intentionally NOT graduated.
    command: >-
      test ! -d docs/plans/archive && test ! -f logs/.metrics-analysis-log.jsonl && test ! -f
      logs/.token-budget-log.jsonl && test ! -f logs/.transcript-index.jsonl && test ! -f
      logs/.friction-analysis-log.jsonl && test ! -f logs/.rejected-suggestions.jsonl && test ! -f
      audits/dependency-management-c8a2a17.md && test ! -f audits/dependency-management-c8a2a17.yaml &&
      test ! -f audits/platform-roadmap-strategic-audit-ffd58dc.md && test ! -f
      audits/platform-roadmap-strategic-audit-ffd58dc.yaml && test ! -f
      docs/audit-prompts/AUDIT-dependency-management.md && test ! -f
      docs/audit-prompts/AUDIT-platform-roadmap-strategic-audit.md && echo SWEEP-COMPLETE
    expected: SWEEP-COMPLETE
    fix_if: >-
      Pre-edit this exits 1 at the first clause because docs/plans/archive/ still exists. All 6 audit
      artefacts are named individually -- an earlier draft asserted only 3 and could not prove
      acceptance criterion 3. If a clause fails post-edit, that path was missed by the sweep; delete it
      with `git rm`, never plain `rm` (validate_placement snapshots `git ls-files`, the index).
  - step: 2
    phase: pre-deploy
    graduation: not-applicable
    action: >-
      Prove the deliberately-retained neighbours survived -- the assertion that distinguishes this
      sweep from an over-broad glob. NOT graduated on purpose: freezing "these five logs must exist"
      into the verification registry would install a permanent retention mandate that no Decision
      ratifies and that would red a future legitimate retirement.
    command: >-
      test -f logs/.retro-lite-log.jsonl && test -f logs/.session-metrics-log.jsonl && test -f
      logs/.plan-audit-log.jsonl && test -f logs/.execution-step-telemetry.jsonl && test -f
      logs/.customizations-manifest.json && test "$(git ls-files audits | wc -l)" -ge 50 && test "$(git
      ls-files docs/audit-prompts | wc -l)" -ge 20 && echo SURVIVORS-INTACT
    expected: SURVIVORS-INTACT
    fix_if: >-
      A failure here means the sweep deleted a RETAINED artefact -- restore it immediately from git.
      Losing logs/.retro-lite-log.jsonl is the worst case: it is READ by the registered
      validate_prompt_compliance check (scripts/checks/contracts/validate_prompt_compliance.py:26). A
      directory-count failure means a glob ate audits/ or docs/audit-prompts/ wholesale.
  - step: 3
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-no-live-code-refs
    action: >-
      Prove no live code, test, config or workflow still names a deleted path. Genuine red/green: it
      currently returns 3 hits across the 2 stale-fixture files in scope, and also catches the new test
      if it hardcodes a deleted path instead of asserting on topic names.
    command: >-
      test -z "$(git grep -nE 'plans/archive|\.metrics-analysis-log|\.token-budget-log|\.transcript-index|\.friction-analysis-log|\.rejected-suggestions'
      -- scripts/ src/ tests/ .github/ bin/ config/ ':!*.pyc')" && echo NO-LIVE-REFS
    expected: NO-LIVE-REFS
    fix_if: >-
      Pre-edit this prints exactly 3 hits: test_validate_placement.py:84, test_env_git.py:318 and :323.
      Repoint those fixture strings; do NOT delete the tests. If it reds AFTER the change, the most
      likely cause is the new test hardcoding a deleted path -- assert on topic names instead. The
      regex requires a leading literal dot, so the topic strings friction-analysis-log and
      rejected-suggestions-log do NOT match and are safe to use. Deliberately scoped to code
      directories: docs/ and audits/ prose citations to archived .md plans are historical record and
      are expected to remain (see constraint 6).
  - step: 4
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-router-dead-target-scan
    action: >-
      Prove the file-router dead-target scan is green after the two routes are retired. This is a
      partial-application guard, not before/after evidence -- it is GREEN on the unmodified tree and
      reds only in the intermediate state where files are deleted but the routes still reference them.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene import validate_placement; f=[];
      validate_placement.validate_placement(f); assert not f, f; print('PLACEMENT-PASS')"
    expected: PLACEMENT-PASS
    fix_if: >-
      If this reports "dead target(s)" naming logs/.friction-analysis-log.jsonl or
      logs/.rejected-suggestions.jsonl, the route deletion is missing or incomplete. Do NOT resolve it
      by restoring the log files, and do NOT resolve it by adding `runtime: true` -- that marker means
      "regenerated at runtime" (file-router.yaml:13-16) and neither file has a writer, so the marker
      would be a false claim that permanently silences this scan.
  - step: 5
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-route-detection-behavioural-guard
    action: >-
      Red/green evidence for the contract edit -- assert the dead-target detector actually fires on a
      synthetic non-runtime untracked route, and that the two retired topics are absent. The
      behavioural half is what makes this non-vacuous: an assertion that merely checked the topics were
      gone would also pass on a repo that had silenced them by mislabelling.
    command: bin/venv-python -m pytest "tests/checks/hygiene/validate_placement/test_dead_route_detection.py" -q
    expected: all tests pass
    fix_if: >-
      Pre-edit this exits 4 with "file or directory not found" because the test does not exist yet. If
      the behavioural assertion passes before the detector is exercised, it is asserting on the wrong
      thing -- it must construct a route with an untracked, non-runtime target and assert the check
      reports it, not merely inspect the committed YAML.
  - step: 6
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-claude-md-prose-budget
    action: >-
      Prove the docs/CLAUDE.md rewrite did not grow the file past its zero-headroom prose budget. This
      is the single most likely accidental CI failure in the plan, and the scope guard would block the
      obvious remedy (editing config/prose_budgets.yaml, which is not in scope).
    command: >-
      test "$(wc -c < docs/CLAUDE.md)" -le 3813 && bin/venv-python -c "from scripts.checks.prose import
      prose_limits; f=[]; prose_limits.validate_prose_limits(f); assert not f, f; print('PROSE-OK')"
    expected: PROSE-OK
    fix_if: >-
      config/prose_budgets.yaml:37 pins docs/CLAUDE.md at 3813 bytes and the file is currently exactly
      3813 -- zero headroom. If this reds, SHORTEN the RS-07 rewrite; do not raise the budget. Shrinking
      is always safe (prose_limits.py:79-83 routes under-budget to a non-blocking advisory). Raising
      would require adding config/prose_budgets.yaml to scope with a `# raise-approved: dec-NNN` marker,
      which is a deliberate, reviewable exception and not the intended path here.
  - step: 7
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-carve-outs-intact
    action: >-
      Prove the two explicit out-of-scope carve-outs held: the .yaml plan corpus is untouched (pending
      DuckLake upload) and terraform/ is untouched. The terraform half matters because deleting a .tf
      from an applied root is a DESTROY operation, not cleanup.
    command: >-
      test -z "$(git diff --name-only origin/main -- terraform/)" && test -z "$(git diff --name-status
      origin/main -- 'docs/plans/PLAN-*.yaml' | grep -v '^A')" && echo CARVE-OUTS-INTACT
    expected: CARVE-OUTS-INTACT
    fix_if: >-
      The second clause permits exactly the 'A' row for this plan file (which the branch adds) while
      rejecting any D, M or rename R entry. An earlier draft also asserted a hardcoded count of 359,
      which was dropped: it reds spuriously after the execution-step rebase whenever an unrelated plan
      merges to main, and clause 2 already catches every deletion, modification and rename. Any
      terraform/ diff must be reverted outright -- this plan deletes nothing there.
  - step: 8
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      The decisions corpus checks are already registered and graduated in their own right; adding a
      registry row that re-runs the same pytest selectors would duplicate an existing gate rather than
      add coverage. This step proves THIS plan's DECISIONS.md edit parses, not a new standing check.
    action: >-
      Prove the new Decision entry and the Decision 85 amendment trailer are well-formed and the
      decisions corpus still parses and indexes.
    command: bin/venv-python -m pytest tests/decisions_md/ tests/test_decisions_index.py -q
    expected: all tests pass
    fix_if: >-
      A parse failure means the entry's header, envelope or required markers deviate from
      docs/contracts/decision-entry.yaml's grammar -- fix the entry, never the parser. If a size check
      complains, docs/DECISIONS.md is near its Decision 134 ceiling and the entry must be tightened; the
      change-record content belongs in the PR body, not the entry.
  - step: 9
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      This is the repository-wide presubmit gate itself, already authoritative in PR CI per Decision
      73's two-tier model. Graduating a registry check that shells out to the whole --pre tier would be
      circular, so its disposition is a deliberate waiver rather than a new kernel check.
    action: >-
      Run the authoritative fast-tier presubmit over the complete change set. A deletion-only diff still
      dispatches the plan/roadmap/placement checks, because the pre_globs gate reads
      get_status_aware_diff(), which retains status-D entries.
    command: bin/venv-python -m scripts.validate --pre
    expected: "All checks passed."
    fix_if: >-
      The three most likely failures, in order: (1) validate_prose_limits on docs/CLAUDE.md exceeding
      3813 bytes -- diagnose with step 6 and SHORTEN the rewrite; (2) validate_contract_drift reporting
      a Class D contract whose content changed with no new amendment_log entry -- add the missing entry
      to file-router.yaml or log-storage.yaml; (3) validate_placement dead targets -- diagnose with
      step 4. A 204-file deletion of this shape was rehearsed in an isolated worktree and returned
      EXIT=0, so a failure outside these three indicates a divergence from the rehearsed change set.
      Never disable or narrow a check to get green.
test_obligations:
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The dead-target scan reports a route whose target is neither git-tracked nor marked runtime, and
      the two routes whose targets this plan deletes are retired rather than exempted -- so route
      retirement cannot be substituted by a false runtime: true label that silences the scan.
    verification_step: 5
    test_selector: tests/checks/hygiene/validate_placement/test_dead_route_detection.py
    red_green_expectation: >-
      RED before -- the test file does not exist, and once written its regression half fails because
      both topics are still declared while their targets are still tracked. GREEN after the two routes
      are retired and the log files deleted. The behavioural half asserts on a synthetic route, so it
      exercises the detector directly rather than passing merely because a file is absent.
  - source: docs/contracts/log-storage.yaml
    behavior: >-
      patterns.locally_produced.examples no longer names .friction-analysis-log.jsonl, a file this plan
      deletes, so the contract stops asserting the existence of a retired artefact.
    verification_step: 9
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Deliberate per-source waiver, not an oversight. The edited key is a non-executable examples list:
      validate_log_storage_registry.py:38-62 compares only the `routing` block against s3_log_store's
      fallback constants and never reads `patterns.locally_produced.examples`, so no assertion on this
      key can go red-to-green through a real gate. A test hardcoding the deleted basename to assert its
      absence would additionally red verification step 3, which greps tests/ for exactly that literal --
      so the obvious test is actively harmful here. The genuine controls are the mandatory Class D
      amendment_log entry (enforced by validate_contract_drift via step 9) and the pre-implementation
      contract sweep in the checklist, which is what surfaced this row in the first place.
constraints:
  - >-
    Do NOT delete, move, or modify any docs/plans/PLAN-*.yaml file. They are held in-repo pending upload
    to the DuckLake warehouse table, which is not yet ready (author direction, this session).
  - >-
    Do NOT delete or modify anything under terraform/. A 10-agent adversarial sweep produced 30+
    dead-file claims and refuted every one. The bare terraform/ root is not applied by any workflow but
    IS a live CI-gated governance surface: scripts/checks/_terraform.py:72 lists "terraform" in
    _TERRAFORM_ROOTS, so the required terraform-validate job runs init/validate/fmt against it as a
    single HCL graph. terraform/personal/ auto-applies on merge to main -- deleting a .tf there is a
    DESTROY operation.
  - >-
    Do NOT mark the two retired file-router routes `runtime: true`. That marker asserts the target is a
    gitignored/untracked file regenerated at runtime (file-router.yaml:13-16, Decision 84 local-cache
    model). Neither target has a writer and neither is gitignored, so the label would be false and would
    permanently silence the dead-target scan for a genuinely dead route.
  - >-
