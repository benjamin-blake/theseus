  - >-
    FOLLOW-ON, and its relationship to this plan's graduations: verification steps 1 and 3, once
    graduated, become a narrow anti-regrowth guard for THESE 206 paths specifically; steps 5 and 6 become
    standing structural guards for the two contracts. None is a general detector. File one recommendation
