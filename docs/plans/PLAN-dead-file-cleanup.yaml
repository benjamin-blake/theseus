work_areas: []
rollback: >-
  Every change is a deletion or an additive/subtractive text edit, all captured in one squash commit, so
  `git revert <sha>` restores all 206 files and reverses the five text edits atomically. No
  infrastructure, warehouse table, deployed artefact or runtime state is touched, so there is nothing to
  unwind outside git. If a problem surfaces after merge, revert first and re-derive the orphan set rather
  than patching forward -- a partial restore risks leaving a retired route absent while its target is
  tracked again, or a contract amendment_log entry describing a change that is no longer present.
