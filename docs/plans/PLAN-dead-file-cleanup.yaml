schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: false
slug: dead-file-cleanup
intent: >-
  Delete 206 verified-dead one-shot agent artefacts (195 legacy docs/plans/archive/*.md plans,
  5 decommissioned logs/ files, 6 orphaned audit artefacts; 4.01 MB) and record the governance
  edits that deletion requires. A repo-wide sweep proved the Python tree is 100% import-reachable
  (428/429 non-test modules; the one outlier is a 1-line package marker), so NO source code is in
  scope -- all deadweight is accumulated workflow output. docs/plans/PLAN-*.yaml are explicitly
  OUT of scope pending their DuckLake upload. terraform/ contributes ZERO deletions.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-dead-file-cleanup.yaml
phase: >-
  Repository hygiene (ad-hoc, user-explicit). Discharges the RS-07 lagged-sweep obligation for the
  deprecated .md planning format. No tier_item; docs-and-artefacts only, zero runtime code change.
scope:
  - file: docs/plans/archive/
    action: Delete
    purpose: >-
      All 195 legacy PLAN-*.md files (3.59 MB), the deprecated pre-T1.11 planning format superseded
      one-way by schema-validated .yaml (Decision 85). VERIFIED zero mechanisms read this directory:
      `grep -rn "plans/archive" scripts/ tests/ config/ .github/ .claude/ docs/contracts/` returns
      nothing. The only .md plan path in code is scripts/roadmap/find_plan.py:68, a DEPTH-1
      (docs/plans/PLAN-{slug}.md) deprecated fallback that is already dead -- zero depth-1 .md files
      exist. The directory disappears entirely; it is not a file-router route target, so the
      validate_placement dead-target scan is unaffected.
  - file: logs/.metrics-analysis-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry. VERIFIED zero inbound references repo-wide and no file-router route.
      Note the file-router `metrics-analysis-log` topic targets logs/.session-metrics-log.jsonl -- a
      DIFFERENT, retained file -- so no route is touched. Frozen at its 2026-05-28 commit.
  - file: logs/.token-budget-log.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry (330 lines). VERIFIED no writer or reader in scripts/ or src/; the
      only references are historical prose in CHANGELOG and the INTENT-telemetry decommission list.
      No file-router route. Frozen at 2026-05-28.
  - file: logs/.transcript-index.jsonl
    action: Delete
    purpose: >-
      Decommissioned telemetry, superseded by the telemetry_transcripts table. VERIFIED single
      inbound reference is docs/INTENT-telemetry-system.md:577, which lists it as REPLACED. No
      writer, no file-router route. Frozen at 2026-05-28.
  - file: logs/.friction-analysis-log.jsonl
    action: Delete
    purpose: >-
      VERIFIED no production reader or writer. The only tests/ hits are synthetic fixture STRINGS
      (tests/checks/hygiene/validate_placement/test_validate_placement.py:84 passes it to
      _mock_ls_files; tests/session/preflight/test_env_git.py:318 embeds it in a fake porcelain
      string) -- neither opens the real file. Requires the file-router route flip below, else the
      dead-target scan reds. Frozen at 2026-05-28.
  - file: logs/.rejected-suggestions.jsonl
    action: Delete
    purpose: >-
      Cron rejection memory, 1 line. VERIFIED zero code references anywhere -- its ONLY inbound
      reference in the entire repo is the file-router route at docs/contracts/file-router.yaml:307.
      Requires the route flip below. Frozen at 2026-05-28.
  - file: audits/dependency-management-c8a2a17.md
    action: Delete
    purpose: >-
      Orphaned audit output. VERIFIED by fixpoint reference analysis (matching full path, basename,
      stem, bare slug, and sha-stripped slug): no live file references it. Its paired prompt is also
      deleted below, so the slug leaves the repo as a complete unit.
  - file: audits/dependency-management-c8a2a17.yaml
    action: Delete
    purpose: >-
      Structured companion of the above; same fixpoint verdict. Not read by any command --
      config/agent/verification_registry/registry.yaml opens exactly one audits/ file
      (executor-roadmap-review-7d57a0d.yaml at :3438), which is NOT in scope.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.md
    action: Delete
    purpose: >-
      Orphaned audit output; same fixpoint verdict. Paired prompt deleted below.
  - file: audits/platform-roadmap-strategic-audit-ffd58dc.yaml
    action: Delete
    purpose: >-
      Structured companion of the above; same fixpoint verdict.
  - file: docs/audit-prompts/AUDIT-dependency-management.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted. VERIFIED not referenced by any
      mechanism; registry.yaml greps only AUDIT-decision-knowledge-persistence-scalability.md (which
      already does not exist) and AUDIT-terraform-deployment-strategy.md, neither in scope.
  - file: docs/audit-prompts/AUDIT-platform-roadmap-strategic-audit.md
    action: Delete
    purpose: >-
      Consumed one-shot audit prompt whose output is also deleted; same verdict. audits/ and
      docs/audit-prompts/ each retain 53 and 23 files respectively, so neither directory empties and
      the validate_placement dead-target scan stays green on both route targets.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add ONE numbered Decision recording that Decision 85's clause "Historical PLAN-*.md files
      remain in the working tree and commit history" was DESCRIPTIVE of the state at ratification,
      not a forward retention directive (author's clarification, this session). Cite the Decision 121
      precedent (retire a sanctioned prose artefact outright via a numbered Decision) and Decision
      147 (provenance for finished work survives in git history). Per AGENTS.md's change-record
      content rule, what changed / why now / measurements belong in the PR body, NOT this entry.
  - file: docs/CLAUDE.md
    action: Modify
    purpose: >-
      Rewrite the "Plans lifecycle (RS-07)" section (lines 40-59). It currently defines the archival
      criterion as "a depth-1 docs/plans/ file is archived iff its extension is .md" and points at
      docs/plans/archive/ -- a directory this plan deletes. Restate the lifecycle as: .md is the
      retired format and carries no working-tree retention obligation; .yaml plans stay at the
      docs/plans/ root pending their DuckLake upload. Remove the now-false claim that the
      file-router prose_allowlist entry exists to cover docs/plans/archive/*.md.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Add `runtime: true` to the friction-analysis-log route (:288-290) and the
      rejected-suggestions-log route (:306-308), exempting them from the validate_placement
      dead-target scan exactly as the existing north-star-log (:297-300), recommendations-log,
      decisions-index and execution-checkpoint-state routes already are. This is the semantically
      correct label, not a workaround -- both are untracked runtime artefacts after this sweep. Add
      a matching amendment_log entry per the CFG-11 / Decision 171 precedent. KEEP the
      prose_allowlist glob docs/plans/**/*.md unchanged: 4 docs/plans/reports/*.md still match it.
  - file: tests/checks/hygiene/validate_placement/test_runtime_log_routes.py
    action: Create
    purpose: >-
      New test asserting both log routes declare `runtime: true` AND that their targets are untracked
      -- the red/green evidence for the file-router configuration edit, satisfying the AGENTS.md rule
      that every configuration edit adds a test failing without the change. Placed under the existing
      validate_placement test package so it sits with the check it protects.
  - file: tests/checks/hygiene/validate_placement/test_validate_placement.py
    action: Modify
    purpose: >-
      Repoint the synthetic fixture string at :84 (_mock_ls_files) from the deleted
      logs/.friction-analysis-log.jsonl to a still-tracked path. The fixture is arbitrary and the
      test passes either way, but leaving a deleted path in a fixture is exactly the stale reference
      this sweep exists to remove.
  - file: tests/session/preflight/test_env_git.py
    action: Modify
    purpose: >-
      Repoint the fake `git status --porcelain` string at :318 and its assertion at :323 off the
      deleted logs/.friction-analysis-log.jsonl to a still-tracked path. Same rationale as above.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    All 195 docs/plans/archive/*.md files are deleted and the docs/plans/archive/ directory no longer
    exists in the working tree.
  - >-
    All 5 in-scope logs/ files are deleted; the other 5 tracked logs/ files
    (.customizations-manifest.json, .execution-step-telemetry.jsonl, .plan-audit-log.jsonl,
    .retro-lite-log.jsonl, .session-metrics-log.jsonl) are UNTOUCHED, each having a live writer or
    reader.
  - >-
    All 6 in-scope audit artefacts are deleted; audits/ and docs/audit-prompts/ both remain non-empty.
  - >-
    Zero pre-existing docs/plans/PLAN-*.yaml files are deleted, moved, or modified. The count is 359 --
    the 358 that existed before this branch, plus this plan file itself, which the branch adds.
  - >-
    Zero files under terraform/ are modified or deleted.
  - >-
    docs/contracts/file-router.yaml declares runtime: true on the friction-analysis-log and
    rejected-suggestions-log routes, carries a matching amendment_log entry, and still declares the
    prose_allowlist glob docs/plans/**/*.md.
  - >-
    docs/DECISIONS.md carries one new numbered Decision clarifying Decision 85's working-tree clause,
    and docs/CLAUDE.md's RS-07 section no longer references docs/plans/archive/.
  - >-
    No file under scripts/, src/, tests/, .github/, bin/ or config/ references any deleted path.
  - >-
    bin/venv-python -m scripts.validate --pre passes, with the file-router placement check reporting
    zero dead targets.
verification_plan:
  - step: 1
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-targets-removed
    action: >-
      Prove every in-scope path is gone and that the deliberately-retained neighbours survive. The
      survival half is not decoration -- it is what distinguishes this sweep from an over-broad
      deletion, and it is the assertion that would catch a glob that ate logs/ or audits/ wholesale.
    command: >-
      test ! -d docs/plans/archive && test ! -f logs/.metrics-analysis-log.jsonl && test ! -f
      logs/.token-budget-log.jsonl && test ! -f logs/.transcript-index.jsonl && test ! -f
      logs/.friction-analysis-log.jsonl && test ! -f logs/.rejected-suggestions.jsonl && test ! -f
      audits/dependency-management-c8a2a17.md && test ! -f
      audits/platform-roadmap-strategic-audit-ffd58dc.md && test ! -f
      docs/audit-prompts/AUDIT-dependency-management.md && test -f logs/.retro-lite-log.jsonl && test
      -f logs/.session-metrics-log.jsonl && test -f logs/.plan-audit-log.jsonl && test -f
      logs/.execution-step-telemetry.jsonl && test -f logs/.customizations-manifest.json && echo
      SWEEP-COMPLETE
    expected: SWEEP-COMPLETE
    fix_if: >-
      Pre-edit this exits 1 at the first `test ! -d docs/plans/archive` because the directory still
      exists. If it fails on one of the trailing `test -f` clauses instead, the sweep deleted a
      RETAINED log -- restore it immediately; those five have live writers or readers and losing
      logs/.retro-lite-log.jsonl in particular breaks the validate_prompt_compliance check.
  - step: 2
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-no-live-code-refs
    action: >-
      Prove no live code, test, config or workflow still names a deleted path. This is the check that
      catches the stale test fixtures in scope -- it fails until both are repointed.
    command: >-
      test -z "$(git grep -nE 'plans/archive|\.metrics-analysis-log|\.token-budget-log|\.transcript-index|\.friction-analysis-log|\.rejected-suggestions'
      -- scripts/ src/ tests/ .github/ bin/ config/ ':!*.pyc')" && echo NO-LIVE-REFS
    expected: NO-LIVE-REFS
    fix_if: >-
      Pre-edit this prints the two synthetic fixture hits in
      tests/checks/hygiene/validate_placement/test_validate_placement.py and
      tests/session/preflight/test_env_git.py. Repoint those fixture strings; do NOT delete the tests.
      Deliberately scoped to code directories only -- docs/ and audits/ prose citations to archived
      .md plans are historical record and are expected to remain (see Constraints).
  - step: 3
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-router-dead-target-scan
    action: >-
      Prove the file-router dead-target scan is green, i.e. the two runtime flips actually exempt the
      now-untracked log targets. This is the single mechanic that would otherwise red the PR.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene import validate_placement; f=[];
      validate_placement.validate_placement(f); assert not f, f; print('PLACEMENT-PASS')"
    expected: PLACEMENT-PASS
    fix_if: >-
      If this reports "dead target(s)" naming logs/.friction-analysis-log.jsonl or
      logs/.rejected-suggestions.jsonl, the runtime: true flip is missing or misindented -- it must sit
      at the same indent as `description:` within the route mapping. Do NOT fix this by restoring the
      log files or by deleting the routes; the runtime marker is the intended resolution and matches
      the existing north-star-log route exactly.
  - step: 4
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-runtime-route-declaration
    action: >-
      Red/green evidence for the file-router configuration edit -- assert both routes declare
      runtime: true and that their targets are untracked, so the exemption is truthful rather than a
      blanket silencer.
    command: bin/venv-python -m pytest "tests/checks/hygiene/validate_placement/test_runtime_log_routes.py" -q
    expected: 2 passed
    fix_if: >-
      Pre-edit this exits 4 with "file or directory not found" because the test does not exist yet.
      The test must assert BOTH halves -- runtime: true present AND `git ls-files` returning empty for
      each target. Asserting only the marker would stay green if someone later marked a still-tracked
      route runtime, which is the failure mode this test exists to prevent.
  - step: 5
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: dead-file-sweep-yaml-plans-and-terraform-untouched
    action: >-
      Prove the two explicit out-of-scope carve-outs held: the .yaml plan corpus is intact (pending
      DuckLake upload) and terraform/ is untouched. The terraform half matters because deleting a .tf
      from an applied root is a DESTROY operation, not cleanup.
    command: >-
      test "$(ls docs/plans/PLAN-*.yaml | wc -l)" = "359" && test -z "$(git diff --name-only
      origin/main -- terraform/)" && test -z "$(git diff --name-status origin/main --
      'docs/plans/PLAN-*.yaml' | grep -v '^A')" && echo CARVE-OUTS-INTACT
    expected: CARVE-OUTS-INTACT
    fix_if: >-
      359 = the 358 pre-existing .yaml plans plus THIS plan file, which is itself a docs/plans/PLAN-*.yaml
      and is added by the same branch -- the third clause allows that single 'A' entry while rejecting any
      'D' or 'M'. A count other than 359 means a .yaml plan was deleted or moved -- restore it; those are pending
      warehouse upload and 51 of them are additionally pinned by met_by in docs/ROADMAP-PLATFORM.yaml,
      which scripts/checks/roadmap/validate_platform_roadmap.py:62-73 existence-checks. Any terraform/
      diff must be reverted outright: this plan deletes nothing there.
  - step: 6
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      The decisions corpus checks are already registered and graduated in their own right; adding a
      registry row that re-runs the same pytest selectors would duplicate an existing gate rather than
      add coverage. This step exists to prove THIS plan's DECISIONS.md edit parses, not to introduce a
      new standing check.
    action: >-
      Prove the new Decision entry is well-formed and the decisions corpus still parses and indexes --
      an entry that breaks the grammar would red the decisions checks on merge.
    command: bin/venv-python -m pytest tests/decisions_md/ tests/test_decisions_index.py -q
    expected: all tests pass
    fix_if: >-
      A parse failure means the new entry's header or required markers deviate from
      docs/contracts/decision-entry.yaml's grammar -- fix the entry, never the parser. If a size check
      complains, docs/DECISIONS.md is near its Decision 134 ceiling and the entry must be tightened
      (the change-record content belongs in the PR body, not the entry).
  - step: 7
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      This is the repository-wide presubmit gate itself, already authoritative in PR CI per Decision
      73's two-tier model. Graduating a registry check that shells out to the whole --pre tier would be
      circular, so its disposition is a deliberate waiver rather than a new kernel check.
    action: >-
      Run the authoritative fast-tier presubmit over the complete change set. A deletion-only diff
      still dispatches the plan/roadmap/placement checks, because the pre_globs gate reads
      get_status_aware_diff(), which retains status-D entries.
    command: bin/venv-python -m scripts.validate --pre
    expected: "All checks passed."
    fix_if: >-
      This was rehearsed in an isolated worktree against the 204-file deletion and returned EXIT=0
      with "86 route(s), zero dead targets", so a failure here indicates a divergence from the
      rehearsed change set -- most likely a deleted .yaml plan or an untouched-terraform violation.
      Diagnose against steps 3 and 5 before touching any check. Never disable or narrow a check to get
      green.
test_obligations:
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The friction-analysis-log and rejected-suggestions-log routes declare runtime: true, exempting
      their now-untracked targets from the validate_placement dead-target scan while keeping the
      exemption truthful (targets genuinely untracked).
    verification_step: 4
    test_selector: tests/checks/hygiene/validate_placement/test_runtime_log_routes.py
    red_green_expectation: >-
      RED before -- the test file does not exist, and once written it fails because neither route
      carries runtime: true while both targets are still tracked. GREEN after the routes are flipped
      and both log files are deleted.
constraints:
  - >-
    Do NOT delete, move, or modify any docs/plans/PLAN-*.yaml file. They are held in-repo pending
    upload to the DuckLake warehouse table, which is not yet ready (author direction, this session).
  - >-
    Do NOT delete or modify anything under terraform/. A 10-agent adversarial sweep produced 30+
    dead-file claims and refuted every one. The bare terraform/ root is not applied by any workflow
    but IS a live CI-gated governance surface: scripts/checks/_terraform.py:72 lists "terraform" in
    _TERRAFORM_ROOTS, so the required terraform-validate job runs init/validate/fmt against it as a
    single HCL graph. terraform/personal/ auto-applies on merge to main -- deleting a .tf there is a
    DESTROY operation.
  - >-
    Do NOT remove the prose_allowlist glob docs/plans/**/*.md from docs/contracts/file-router.yaml.
    Four docs/plans/reports/*.md files still match it, and narrowing a Decision 127 clause-1(d)
    permanent prose class needs its own cited amendment.
  - >-
    Do NOT delete the remaining 5 tracked logs/ files. Each has a live writer or reader; in particular
    logs/.retro-lite-log.jsonl is READ by the registered validate_prompt_compliance check, so deleting
    it would red CI.
  - >-
    Do NOT edit docs/DECISIONS.md to remove or renumber any existing header. Decision 149's
    never-remove-headers rule stands; this plan ADDS one entry and changes no existing one.
  - >-
    Prose citations to archived .md plans in docs/DECISIONS.md, docs/SESSION_LOG*.md,
    docs/ROADMAP-PLATFORM.yaml and logs/*.jsonl are historical record and MUST be left as-is. They are
    narrative mentions, not functional dependencies; nothing validates them. Rewriting ~15 governance
    citations is explicitly out of scope and would balloon the diff.
  - >-
    Use `git rm` / plain deletion via Bash. The .claude/hooks/edit_scope_guard.py PreToolUse hook
    gates Edit/Write/MultiEdit/NotebookEdit only -- its docstring states "Bash is NOT gated" -- so no
    scope-guard interaction is expected for the deletions themselves.
context:
  - >-
    ORIGIN: user-requested repo-wide dead-file sweep. The premise inverted during discovery -- there
    is NO dead Python code. An AST import-reachability graph over 1068 .py files (roots: bin/,
    .claude/hooks/, setup.py, Lambda handlers, __main__, top-level scripts, plus string-literal module
    references from _manifest.py Entry declarations and CI workflows) found 428 of 429 non-test
    modules reachable. The single outlier, scripts/checks/product/trading/__init__.py, is a 1-line
    package marker required for its package to import. T3.11-T3.13 already shipped
    scripts/dead_code_detector.py, scripts/dependency_graph.py and .importlinter.
  - >-
    METHOD: candidates were derived by fixpoint reference analysis -- a file is orphaned only if every
    inbound textual reference comes from another file also being deleted -- matching full path,
    basename, PLAN-/AUDIT- stem, bare slug, and sha-stripped slug. The bare-slug term is load-bearing:
    a first pass matching only stems produced 24 false positives, because docs/ROADMAP-PLATFORM.yaml
    pins plans by bare slug via `met_by:`, which
    scripts/checks/roadmap/validate_platform_roadmap.py:62-73 existence-checks as a hard CI failure.
  - >-
    REHEARSED: the full 204-file deletion was applied in an isolated git worktree against origin/main
    and validated. `validate --pre` returned EXIT=0 with all checks passing, including "File router
    placement check (RS-04): PASS: 86 route(s), zero dead targets". pytest across
    tests/checks/hygiene/, roadmap/, structural/, contracts/, tests/docs/, test_plan_obligations.py,
    test_decisions_index.py and tests/decisions_md/ returned 1037 passed. The runtime-route flip was
    separately rehearsed and returned PLACEMENT-PASS. The worktree was removed; no repo state changed.
  - >-
    DECISION-GATE HISTORY: the decision-scout gate returned BLOCK on Decision 85, whose clause reads
    "Historical PLAN-*.md files remain in the working tree and commit history; none are retroactively
    converted (one-way, non-rolling migration)." The author (this repo's owner) clarified in-session
    that this was DESCRIPTIVE of the state at ratification, not a forward retention directive. That
    clarification is the substance of the new Decision entry in scope; it is recorded rather than
    assumed, because docs/CLAUDE.md's RS-07 section currently cites the clause as the REASON archival
    was chosen over deletion.
  - >-
    WHY DELETION IS WORTH IT: docs/plans/archive/ is out of the validate_plan_documents glob (which is
    non-recursive) but NOT out of the agent grep path. Measured share of repo-wide `git grep -l` hits
    landing in docs/plans/archive/: validate.py 139/643 (21%), ops_recommendations 60/284 (21%),
    "terraform apply" 40/175 (22%). The 195 files are 9.6% of tracked files and 10.4% of tracked bytes.
    In an agent-first repository that grep noise is the actual cost.
  - >-
    LOGS TRIAGE: of 10 tracked logs/ files, 5 are dead and 5 live. All 5 dead ones are frozen at their
    2026-05-28 commit, predating the entire current plan corpus. The 5 retained ones each have a live
    writer or reader (scripts/list_customizations.py:141, scripts/executor/step_runner.py:591 +
    run_summary.py:128, scripts/roadmap/plan_audit.py:303, scripts/prompt_compliance.py:145 +
    validate_prompt_compliance.py:26, scripts/session/metrics.py:162). Removing those 5 would mean
    removing the features that write them -- that is rec-031's much larger scope, deliberately excluded.
  - >-
    REC LINKAGE: rec-031 [High] "Workflow orphan cleanup: remove/collapse LLM-era scripts, agents, and
    logs" covers 18 removable components including 7 log files. This plan removes 5 logs, so it
    ADVANCES but does not close rec-031. It is deliberately NOT in bundled_recommendations and the
    squash commit must NOT carry a Resolves: trailer for it -- closing it would be false.
  - >-
    FOLLOW-ON: file one recommendation for a mechanical anti-regrowth guard (source=code_review or
    workflow-audit), scoped to DETECTION ONLY -- never auto-deletion, per Decision 70's refusal to
    create a routine destructive path. This mirrors Decision 147 clause 4, which filed rec-2781 for the
    same purpose rather than shipping the one-shot compaction bare. Use
    `bin/venv-python -m scripts.ops_data_portal` (call get_rec_write_guidance() before file_rec()).
  - >-
    DECISIONS TO CITE in the new entry and the PR body: 85 (the clause being clarified), 121 (retire a
    sanctioned prose artefact outright via a numbered Decision -- the template here), 147 (provenance
    survives in git history; follow-on rec pattern), 70 (physical deletion stays exceptional and
    deliberate), 86 (inbound-reference sweep before deleting a grandfathered doc), 127 (sanctioned
    prose taxonomy -- why the prose glob is kept), 166 (workflow_outputs exempt class survives; no
    structural_size_budgets edit implied), 115 (retire-by-convention without adding a guard).
pre_implementation_checklist:
  - >-
    Confirm the branch is a harness-assigned claude/... branch and NOT main
    (`git branch --show-current`).
  - >-
    Re-run the orphan derivation before deleting, so the set reflects main at implement time rather
    than at plan time: confirm `ls docs/plans/archive/*.md | wc -l` is 195 and that
    `grep -rn "plans/archive" scripts/ tests/ config/ .github/ .claude/ docs/contracts/` is still empty.
    If either has changed, STOP and re-derive.
  - >-
    Confirm `ls docs/plans/PLAN-*.yaml | wc -l` is 358 before starting, to have a pre-change baseline
    for verification step 5.
  - >-
    Read docs/contracts/decision-entry.yaml before writing the new Decision entry -- it owns the
    required markers and the significance/routing rule that decides whether content belongs in the
    entry or in the PR body.
  - >-
    Determine the next Decision number from docs/DECISIONS.md (DECISIONS.md is the numbering
    authority; never allocate client-side from the warehouse cache).
execution_steps:
  - >-
    Delete the 195 legacy .md plans: `git rm -q docs/plans/archive/*.md`. Confirm the directory is
    gone (git removes it once empty).
  - >-
    Delete the 5 dead logs: `git rm -q logs/.metrics-analysis-log.jsonl logs/.token-budget-log.jsonl
