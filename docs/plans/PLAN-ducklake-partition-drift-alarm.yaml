  - "CITE: Decision 84, 88, 62, 55, 79, 125, 126, 131, 184, 191, 201; RELATED 190, 143"
  - "gates: decision-scout=FLAGS_FOUND (shared with the remediation plan; dispositions there); plan-critique r1=REVISE -- all 9 items applied"
  - >-
    Split from the rec-4070 plan by human direction 2026-09-26 ('include drift detection now', then
    'split into two plans, each with its own review gates'). Scout flags for this half: warm
    connection + live-file metadata only (Decision 88), a structural no-caller-SQL verb (Decision 84
    I-3), do not copy the Decision 103 mis-cite, mirror paths per map_source_to_test (Decision 131),
    keep the layout module adapter-ready (Decision 184).
  - >-
    The gap: #1277 changed the declared spec on 2026-09-25; all five live ops history tables stayed
    on day-of-month until the remediation plan's ADMIN run -- nothing compared declared to live.
  - >-
    Critique r1 corrected a false premise: the reader and writer share the owner-privileged
