constraints:
  - >-
    DEPENDS ON PLAN-ducklake-partition-layout-remediation being merged: this plan consumes its pinned
    READ-half API (PartitionLayoutError, TableLayout incl. table_class, read_partition_layout,
    PartitionDrift, compare_to_declared) from src/common/ducklake_partition_layout.py and must not
    re-implement layout reading; implement only after that plan's code PR merges (its ADMIN run need
    not have happened)
  - >-
    Read-only by dispatch -- no reader verb reaches DDL and assert_read_only_sql confines query_ops;
    the bundle never ships ducklake_partition_rewrite.py; IAM is not the guard for catalog DDL
    (rec-4097 tracks the credential-level fix)
  - No IAM change -- the new workflow reuses the existing branch identity; a permission error is a stop-and-report, not a grant
  - Governed deploy only via deploy-ducklake-lambdas.yml (Decision 125/126); data-pipeline is a justified no-deploy (Decision 79, step 5)
  - No caller SQL (Decision 84 I-3); live-file metadata only, the warm connection, and a native 6-hourly schedule (Decision 88)
  - >-
    rec-4094's acceptance is test_partition_drift.py::test_partition_drift_episode_lifecycle (a
    decidable ::node_id under Decision 201's require_decidable grammar); Decision 201's offline
    evaluator runs it under unshare -rmn, so test_partition_drift.py is network- and
    credential-free. Never change that acceptance without re-running step 6
  - No rescue agents or workaround loops (Decision 55)
