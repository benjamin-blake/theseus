schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ducklake-partition-drift-alarm"
intent: >-
  Detect declared-vs-live DuckLake partition drift continuously (rec-4094): a read-only reader verb
  exposes each registered table's live partition layout and its comparison with the declared spec,
  and a convergence-health sensor files one deduped High rec while any table drifts or keeps
  legacy-scheme files the policy matrix says can be rewritten -- closing the gap that let a
  declared-spec change (#1277) sit unapplied on every live history table with nothing noticing.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-partition-drift-alarm.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
scope:
  - file: src/lambdas/ducklake_reader/handler.py
    action: Modify
    purpose: >-
      action_partition_layout(event, con): no caller SQL (Decision 84 I-3), on the warm connection
      (Decision 88 cl.1(i)); returns {ok, tables: {physical: TableLayout fields incl. table_class},
      drifts: [PartitionDrift fields]} from PLAN-ducklake-partition-layout-remediation's pinned READ
      half (read_partition_layout + compare_to_declared) -- never a second layout implementation.
      Added to _ACTIONS (not connectionless). PartitionLayoutError (an unclassified registered
      table) subclasses DuckLakeRuntimeError, so the dispatcher's existing mapping returns a typed
      500 -- never an unhandled 5xx that the client retries as a Neon cold-resume. No-DDL is
      STRUCTURAL, not IAM: the reader holds the same owner-privileged ducklake_ops catalog
      credential as the writer and a catalog-only ALTER is not S3-denied, so the guarantee is that
      the reader bundle ships no mutating module and no reader verb issues DDL
  - file: src/lambdas/ducklake_reader/manifest.yaml
    action: Modify
    purpose: >-
      includes += src/common/ducklake_partition_layout.py (READ half) and
      src/common/ducklake_maintenance_scope.py (its registry classifier). NEVER
      src/common/ducklake_partition_rewrite.py (the maintenance-only MUTATE half).
      ducklake_partition_spec.py, ducklake_control_tables.py, ducklake_scd2_schema.py and
      ducklake_writes.py are already included
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      DuckLakeReader.partition_layout() -> dict invoking {action: partition_layout}; loud-fail on an
      error body or unreachable reader (Decision 55), mirroring describe(). This file also ships in
      the ACTIVE data-pipeline artifact (its manifest's `includes: - src/`). Decision 79 disposition
      for data-pipeline: NO DEPLOY -- the change is one additive method that no data-pipeline
      handler calls (step 5 proves it on the staged bundle), and deploy-prod-lambdas.yml's paths
      filter excludes src/common, so the next governed data-pipeline deploy picks it up inertly
  - file: scripts/convergence_health/partition_drift.py
    action: Create
    purpose: >-
      detect_partition_drift(profile=None, *, reader=None, portal_caller=None, open_recs=None,
      now=None, force=False, check_only=False) modelled on code_drift.py's DuckLake sensor.
      CADENCE GATE (Decision 88): returns {action: skipped} without a reader call unless
      now.hour % 6 == 0 (UTC) or force -- about 120 catalog-metadata reads a month, not 720;
      partition drift only moves on a declared-spec change. One reader call. POLICY-AWARE THRESHOLD
      (Decision 191): over_threshold iff any drift, or any table whose
      load_policy()[table_class]['rewrite_partition_layout']['apply'] is true has
      legacy_scheme_files > 0; control-class legacy files are reported in context and never hold the
      alarm open (there is no sanctioned rewrite for them). check_only (forces the gate) returns the
      verdict without any portal call. Otherwise run_episode(source="ducklake_partition_drift", ...)
      files ONE deduped rec (never source=ci_rca) with PINNED fields -- title "DuckLake partition
      drift -- live partition layout differs from declared", file
      docs/contracts/ducklake_maintenance.yaml, priority High, effort S, risk medium,
      verification_tier V2, acceptance "bin/venv-python -m scripts.convergence_health
      --partition-drift --check-only"; context names each over-threshold table's declared vs live
      transforms and legacy count, lists control-class legacy separately, and names the remediation
      owner (the ducklake_maintenance.yaml partition procedure; first episode rec-4070).
      build_update returns None when the rebuilt context equals the existing one (no SCD2 row per
      unchanged tick); build_close closes when clear (alarm-not-gate, Decision 55 / Decision 62's
      2026-06-16 monitor precedent). Does NOT copy code_drift.py's Decision 103 citation (a mis-cite
      -- Decision 103 is rec relevance)
  - file: scripts/convergence_health/__main__.py
    action: Modify
    purpose: >-
      main_partition_drift(check_only=False) + the --partition-drift flag (with optional
      --check-only: exit 0 iff no over-threshold drift, never writes), mirroring
      main_ducklake_drift; usage docstring updated
  - file: scripts/convergence_health/__init__.py
    action: Modify
    purpose: export detect_partition_drift and main_partition_drift; the docstring's submodule list gains partition_drift.py
  - file: .github/workflows/convergence-health.yml
    action: Modify
    purpose: >-
      a 'Detect DuckLake partition drift (rec-4094)' step running
      `.venv/bin/python -m scripts.convergence_health --partition-drift` as the job's LAST step,
      after 'Assert scheduled loop liveness (LSA-02)', so a failure of the new verb (a deploy-window
      400, an unclassified-table 500) never skips the silent-cron backstop the Decision 62
      2026-09-25 correction names; plus a header comment line like the other sensors'. Same cron and
      agent-platform-github-ci-branch identity (the role trailer-census already reads the reader
      with -- no IAM change). Liveness needs no registration: sensor_liveness derives it from the
      workflow schedule
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      register canonical_id ducklake_partition_drift (description, alarm-not-gate
      signal_interpretation naming the 6h cadence gate and the policy-aware threshold, added_date)
      beside ducklake_code_drift
  - file: docs/contracts/ducklake_reader.yaml
    action: Modify
    purpose: >-
      verbs.partition_layout (payload, response, typed_errors.runtime naming PartitionLayoutError
      -> 500; read-only; live-file metadata only). Amend two audit_invariants: 'Closed boundary'
      states that S3 GetObject-only IAM denies Parquet writes but NOT catalog DDL (the reader holds
      the owner-privileged catalog credential), so no-DDL is structural -- no mutating module
      (ducklake_partition_rewrite.py) in the bundle and no DDL-issuing verb; 'T2.26' states that
      partition_layout exposes a control-class table's catalog METADATA only (transforms, scheme
      id, live/legacy file counts) and never row content, which is not application read access.
      amendment_log entry per validate_contract_drift
  - file: docs/contracts/ops_entity_counters.yaml
    action: Modify
    purpose: >-
      a new audit_invariants line cross-referencing ducklake_reader.yaml's T2.26 amendment:
      partition_layout exposes this table's catalog metadata only, never its rows -- the 'Never
      reachable through query_ops, named_read, read_ops_current, or read_ops_history' invariant
      stands. amendment_log entry per validate_contract_drift
  - file: tests/test_ducklake_reader_handler.py
    action: Modify
    purpose: >-
      test_partition_layout_action_returns_layouts_and_drifts and
      test_partition_layout_action_maps_unclassified_table_to_typed_500, on the existing
      _open_reader_connection monkeypatch seam and FakeCon (layout functions patched)
  - file: tests/common/ducklake_reader_client/test_partition_layout.py
    action: Create
    purpose: mirror-home test for DuckLakeReader.partition_layout (invoke shape, loud-fail on an error body)
  - file: tests/convergence_health/test_partition_drift.py
    action: Create
    purpose: >-
      rec-4094's acceptance file, NETWORK- AND CREDENTIAL-FREE (Decision 201's offline evaluator
      runs it under unshare -rmn): injected fake reader, portal_caller, open_recs and now. Cases --
      drift files one rec with the pinned fields; persistence with an unchanged context is a no-op
      update (build_update None) and a changed one updates; clear closes; a legacy-only
      control-class table does not trip the alarm while a legacy scd2 table does; the cadence gate
      skips at a non-multiple-of-6 hour without calling the reader and runs when forced;
      check_only returns the verdict with zero portal calls; a reader failure raises, never a silent
      all-clear; source is ducklake_partition_drift, never ci_rca
  - file: tests/convergence_health/test___main__.py
    action: Modify
    purpose: --partition-drift and --partition-drift --check-only dispatch to main_partition_drift (patch-at-import, mirroring the TestDispatch cases)
bundled_recommendations: ["rec-4094"]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    the deployed reader's partition_layout verb returns, for every registered ops table, its class,
    live transforms, active scheme id, live and legacy-scheme file counts, plus the declared-vs-live
    drift list -- computed by the shared READ half, with no caller SQL; an unclassified table is a
    typed 500
  - >-
    python -m scripts.convergence_health --partition-drift files exactly one deduped High rec
    (source ducklake_partition_drift) while any table drifts or a rewrite-eligible table keeps
    legacy-scheme files, writes no history row while nothing changes, and closes it when clear;
    --check-only exits 0 iff there is no such drift and never writes
  - the reader bundle ships the READ half and never ducklake_partition_rewrite.py
  - the convergence-health workflow runs the sensor as its last step, on its existing cron and identity, with no IAM change
  - rec-4094 closes on merge
verification_plan:
  - step: 1
    phase: pre-deploy
    action: prove the sensor's episode behaviour, offline
    command: bin/venv-python -m pytest tests/convergence_health/test_partition_drift.py -q
    expected: >-
      all pass -- file on drift, no-op on unchanged persistence, close on clear, control-class
      legacy ignored, cadence gate, check_only writes nothing, loud on reader failure
    fix_if: >-
      a test reaches a real reader, portal or AWS credential -- it must inject every collaborator or
      rec-4094 cannot close under Decision 201's offline evaluator
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-drift-sensor-episodes
  - step: 2
    phase: pre-deploy
    action: prove the reader verb, its typed error, and the client method
    command: >-
      bin/venv-python -m pytest
      tests/test_ducklake_reader_handler.py::test_partition_layout_action_returns_layouts_and_drifts
      tests/test_ducklake_reader_handler.py::test_partition_layout_action_maps_unclassified_table_to_typed_500
      tests/common/ducklake_reader_client/test_partition_layout.py -q
    expected: all pass
    fix_if: an unclassified table surfaces as an unhandled exception -- PartitionLayoutError must map to the typed 500
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-layout-reader-verb
  - step: 3
    phase: pre-deploy
    action: prove the workflow runs the sensor last and the contracts and registry are wired
    command: &step3_wiring >-
      bin/venv-python -c "import yaml;
      wf=yaml.safe_load(open('.github/workflows/convergence-health.yml', encoding='utf-8'));
      jobs=[j for j in wf['jobs'].values() if any('--partition-drift' in s.get('run','') for s in j.get('steps',[]))];
      assert len(jobs)==1, 'workflow step'; st=jobs[0]['steps'];
      assert '--partition-drift' in st[-1].get('run',''), 'partition-drift must be the last step';
      assert any('LSA-02' in s.get('name','') for s in st[:-1]), 'liveness step precedes it';
      reg=yaml.safe_load(open('config/agent/data_quality/source_registry.yaml', encoding='utf-8'));
      assert 'ducklake_partition_drift' in [e['canonical_id'] for e in reg['entries']], 'source registry';
      rc=yaml.safe_load(open('docs/contracts/ducklake_reader.yaml', encoding='utf-8'));
      assert 'PartitionLayoutError' in str(rc['verbs']['partition_layout']['typed_errors']), 'typed error';
      inv=rc['audit_invariants'];
      assert any(i.startswith('Closed boundary') and 'ducklake_partition_rewrite' in i for i in inv), 'boundary invariant';
      assert any(i.startswith('T2.26') and 'partition_layout' in i for i in inv), 'T2.26 invariant';
      oc=yaml.safe_load(open('docs/contracts/ops_entity_counters.yaml', encoding='utf-8'));
      assert any('partition_layout' in i for i in oc['audit_invariants']), 'counters invariant';
      print('PARTITION_DRIFT_WIRED')"
    expected: prints the marker. Red on the planning tree -- no workflow step runs --partition-drift ('workflow step')
    fix_if: the named assertion identifies the missing or misplaced wiring
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-drift-wired
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: prove the staged reader bundle carries the READ half and never the MUTATE half
    command: &step4_bundle >-
      bin/venv-python -c "import pathlib, tempfile;
      from scripts.lambda_manifest import compute_affected_artifacts as c, load_all, stage_bundle;
      a=c(['src/common/ducklake_partition_layout.py']);
      assert 'ducklake_reader' in a and 'data-pipeline' not in a, a;
      d=pathlib.Path(tempfile.mkdtemp()); stage_bundle(load_all()['ducklake_reader'], d);
      assert (d/'src/common/ducklake_partition_layout.py').is_file(), 'read half missing';
      assert (d/'src/common/ducklake_maintenance_scope.py').is_file(), 'classifier missing';
      assert not list(d.rglob('ducklake_partition_rewrite*.py')), 'MUTATE half shipped in the reader';
      print('READER_BUNDLE_READ_HALF_ONLY')"
    expected: >-
      prints the marker. Red on the planning tree: the module does not exist and only
      data-pipeline's wildcard matches it (assertion on a); after
      PLAN-ducklake-partition-layout-remediation lands, still red ('ducklake_reader' absent) until
      this plan adds the reader include
    fix_if: ducklake_reader missing -- add the READ-half include; 'MUTATE half shipped' -- remove it, never widen the reader
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-layout-in-reader
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: prove the data-pipeline no-deploy disposition -- no staged data-pipeline code calls the new client method
    command: >-
      bin/venv-python -c "import pathlib, tempfile;
      from scripts.lambda_manifest import load_all, stage_bundle;
      d=pathlib.Path(tempfile.mkdtemp()); stage_bundle(load_all()['data-pipeline'], d);
      hits=sorted(str(p.relative_to(d)) for p in d.rglob('*.py') if 'partition_layout' in p.read_text(encoding='utf-8', errors='replace'));
      assert set(hits) <= {'src/common/ducklake_reader_client.py'}, hits;
      assert not list(d.rglob('ducklake_partition_*.py')), 'a partition module leaked into data-pipeline';
      print('DATA_PIPELINE_NO_CALLER', hits)"
    expected: prints the marker with at most the client file listed
    fix_if: a data-pipeline caller appears -- the disposition no longer holds; add a governed deploy-prod-lambdas.yml dispatch plus a smoke step instead
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A no-caller proof is green by construction before and after implementation; it backs this
      plan's Decision 79 no-deploy disposition at implement time, and bundle import resolution is
      already enforced by validate_lambda_bundle_completeness.
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: stage every bundle and resolve each handler's imports
    command: bin/venv-python -m scripts.lambda_manifest --check-bundles
    expected: every artifact OK -- the reader resolves ducklake_partition_layout and ducklake_maintenance_scope
    fix_if: an ImportError in the reader bundle names a module missing from its includes
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green on the un-implemented tree and already enforced as validate_lambda_bundle_completeness
      in the full tier, so a registry row would duplicate it.
    expected_literals: []
  - step: 7
    phase: pre-deploy
    action: run every touched module's mirror-home suite
    command: >-
      bin/venv-python -m pytest tests/convergence_health tests/test_ducklake_reader_handler.py
      tests/common/ducklake_reader_client tests/checks/ops_governance tests/checks/contracts
      tests/test_ducklake_facade.py -q
    expected: all pass
    fix_if: a source-registry check failure means the new source literal was not registered
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates scripts.validate's affected-set pytest selection in both tiers.
  - step: 8
    phase: pre-deploy
    action: run the authoritative fast presubmit tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: read the named check's own failure text; never weaken a check to obtain green (Decision 181)
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: run the full presubmit tier before handoff, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a completed full-tier run
    fix_if: on timeout the disposition is blocked -- rerun from the start, never commit on a partial run
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: confirm the governed channel deployed the reader on the merge commit
    command: >-
      mcp__github__actions_list for workflow deploy-ducklake-lambdas.yml on main, then
      mcp__github__get_job_logs for the run whose head_sha equals the squash-merge SHA
    expected: all five jobs succeed, including deploy-serving (reader) and smoke
    fix_if: never fall back to build_lambda --ducklake-only --deploy (Decision 125/126)
    hermetic: false
  - step: 11
    phase: post-deploy
    action: exercise the deployed reader verb with the DEV identity and record its response size (Decision 88)
    command: >-
      bin/venv-python -c "import json, sys; sys.path.insert(0,'.'); from src.common.ducklake_reader_client import DuckLakeReader;
      b=DuckLakeReader(profile='agent_platform').partition_layout();
      t=b['tables']; assert 'ops_recommendations_history' in t and 'ops_entity_counters' in t, sorted(t);
      assert all(v.get('table_class') for v in t.values()), 'table_class missing';
      print('LAYOUT', len(t), 'tables', len(b['drifts']), 'drifts', sum(v['legacy_scheme_files'] for v in t.values()), 'legacy', len(json.dumps(b)), 'bytes')"
    expected: >-
      prints the table, drift and legacy counts and the response size. Before the remediation
      plan's ADMIN run: five drifts (the ops history tables, live day vs declared year,month,day).
      After its ALTER: zero drifts; after its rewrites: zero legacy. Every state is correct; record
      which, and the byte count
    fix_if: an error body means the reader bundle lacks a module (step 6) or the verb is unregistered
    hermetic: false
  - step: 12
    phase: post-deploy
    action: confirm the first gated scheduled sensor run behaved as the live state requires
    command: >-
      mcp__github__actions_list for workflow convergence-health.yml on main (the first scheduled run
      starting at a UTC hour divisible by 6 after the deploy), mcp__github__get_job_logs for its
      'Detect DuckLake partition drift' step, then mcp__ducklake-reads__recs_by_title_prefix
      prefix="DuckLake partition drift -- live partition layout differs from declared"
    expected: >-
      the step succeeds; ungated ticks log a cadence skip. If step 11 showed drift or rewrite-eligible
      legacy, exactly one open ducklake_partition_drift rec exists whose context names rec-4070; if
      not, none. When the remediation's ADMIN run lands later, the next gated run closes the rec --
      an end-to-end proof of the alarm
    fix_if: >-
      two recs for one episode means the dedup key is wrong; a red step on a reader error is correct
      loud failure -- diagnose, never silence; a red tick between merge and the reader deploy (400
      unknown action) is the known deploy-window transient and needs no fix
    hermetic: false
  - step: 13
    phase: post-deploy
    action: confirm rec-4094 closed on merge
    command: mcp__ducklake-reads__rec_by_id id=rec-4094
    expected: "status closed via the 'Resolves: rec-4094' trailer"
    fix_if: >-
      an ACCEPTANCE-VERDICT refusal: fix the cause, then use the close_proposed command printed in the
      trailer-closure job log -- the manual portal close is FORBIDDEN there (git-ops.yaml resolves_trailer)
    hermetic: false
test_obligations:
  - source: src/lambdas/ducklake_reader/handler.py
    behavior: the reader exposes a read-only partition_layout verb backed by the READ half, with a typed 500 on an unclassified table
    verification_step: 2
    test_selector: tests/test_ducklake_reader_handler.py::test_partition_layout_action_maps_unclassified_table_to_typed_500
    red_green_expectation: red before (no such action), green after
  - source: src/lambdas/ducklake_reader/manifest.yaml
    behavior: the reader bundle carries the READ half and the classifier, never the MUTATE half
    verification_step: 4
    command: *step4_bundle
    red_green_expectation: red before (the reader does not list the module), green after
  - source: src/common/ducklake_reader_client.py
    behavior: the client invokes partition_layout and fails loud on an error body
    verification_step: 2
    test_selector: tests/common/ducklake_reader_client/test_partition_layout.py
    red_green_expectation: red before (method and test absent), green after
  - source: scripts/convergence_health/partition_drift.py
    behavior: one deduped policy-aware rec per drift episode, gated to 6h, closed when clear, loud on reader failure
    verification_step: 1
    test_selector: tests/convergence_health/test_partition_drift.py
    red_green_expectation: red before (module and test absent), green after
  - source: scripts/convergence_health/__main__.py
    behavior: --partition-drift and --check-only dispatch to the sensor
    verification_step: 7
    test_selector: tests/convergence_health/test___main__.py
    red_green_expectation: red before (the new dispatch assertion fails), green after
  - source: scripts/convergence_health/__init__.py
    behavior: the package exports the sensor entry points
    verification_step: 7
    test_selector: tests/convergence_health/test___main__.py
    red_green_expectation: red before (import of main_partition_drift fails), green after
  - source: .github/workflows/convergence-health.yml
    behavior: the cron job runs the sensor as its last step, after the liveness assertion
    verification_step: 3
    command: *step3_wiring
    red_green_expectation: red before (no --partition-drift step), green after
  - source: config/agent/data_quality/source_registry.yaml
    behavior: the sensor's source is registered
    verification_step: 3
    command: *step3_wiring
    red_green_expectation: red before, green after
  - source: docs/contracts/ducklake_reader.yaml
    behavior: the reader contract declares partition_layout, its typed error and the amended boundary and T2.26 invariants
    verification_step: 3
    command: *step3_wiring
    red_green_expectation: red before, green after
  - source: docs/contracts/ops_entity_counters.yaml
    behavior: the counters contract records that partition_layout exposes metadata only
    verification_step: 3
    command: *step3_wiring
    red_green_expectation: red before, green after
constraints:
  - >-
    DEPENDS ON PLAN-ducklake-partition-layout-remediation being merged: this plan consumes its pinned
    READ-half API (PartitionLayoutError, TableLayout incl. table_class, read_partition_layout,
    PartitionDrift, compare_to_declared) from src/common/ducklake_partition_layout.py and must not
    re-implement layout reading; implement only after that plan's code PR merges (its ADMIN run need
    not have happened)
  - "Read-only by structure -- the reader bundle never ships ducklake_partition_rewrite.py and no reader verb issues DDL; the reader's catalog credential is owner-privileged, so IAM is not the guard"
  - No IAM change -- the workflow keeps its existing identity; a permission error is a stop-and-report, not a grant
  - Governed deploy only via deploy-ducklake-lambdas.yml (Decision 125/126); data-pipeline is a justified no-deploy (Decision 79, step 5)
  - No caller SQL (Decision 84 I-3); live-file metadata only, the warm connection, and a 6h cadence gate (Decision 88)
  - tests/convergence_health/test_partition_drift.py is network- and credential-free -- rec-4094 closes only through Decision 201's offline evaluator
  - No rescue agents or workaround loops (Decision 55)
