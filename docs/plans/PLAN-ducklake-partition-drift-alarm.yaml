  - step: 12
    phase: post-deploy
    action: exercise the deployed reader verb with the DEV identity and record its response size (Decision 88)
    command: >-
      bin/venv-python -c "import json, sys; sys.path.insert(0,'.'); from src.common.ducklake_reader_client import DuckLakeReader;
      from src.common.ducklake_maintenance_scope import build_registry;
      b=DuckLakeReader(profile='agent_platform').partition_layout(); t=b['tables']; reg=set(build_registry());
      assert set(t) <= reg, sorted(set(t) - reg);
      assert {'ops_recommendations_history', 'ops_decisions_history', 'ops_entity_counters'} <= set(t), sorted(t);
      assert all(v.get('table_class') for v in t.values()), 'table_class missing';
      print('LAYOUT', len(t), 'tables', len(b['drifts']), 'drifts', sum(v['legacy_scheme_files'] for v in t.values()), 'legacy', len(json.dumps(b)), 'bytes; registered-not-live:', sorted(reg - set(t)))"
    expected: >-
      prints the table, drift and legacy counts, the response size and any registered table not yet
      live. Before the remediation plan's ADMIN run: five drifts (the ops history tables, live day
      vs declared year,month,day). After its ALTER: zero drifts; after its rewrites: zero legacy.
      Every state is correct; record which, and the byte count
    fix_if: >-
      an error body naming PartitionLayoutError means a live table is missing from the DEPLOYED
      reader's bundled registry -- register it (the subset assertion only compares this checkout's
      registry with the deployed one); any other error body means the reader bundle lacks a module
      (step 7) or the verb is unregistered
    hermetic: false
  - step: 13
    phase: post-deploy
    action: confirm the first scheduled ducklake-partition-drift run behaved as the live state requires
    command: >-
      mcp__github__actions_list for workflow ducklake-partition-drift.yml on main (its first
      scheduled run after the deploy), mcp__github__get_job_logs for its 'Detect DuckLake partition
      drift' step, then mcp__ducklake-reads__recs_by_title_prefix title_prefix="DuckLake partition drift
      -- live partition layout differs from declared"
    expected: >-
      the run succeeds. If step 12 showed drift or rewrite-eligible legacy, exactly one open
      ducklake_partition_drift rec exists whose context leads with the tracking-only line naming
      rec-4070 and whose acceptance is the --assert-clear command; if not, none. When the
      remediation's ADMIN run lands later, the next scheduled run closes the rec -- an end-to-end
      proof of the alarm
    fix_if: >-
      two recs for one episode means the dedup key is wrong; a red run on a reader error is correct
      loud failure that sensor_liveness's success leg escalates if it persists -- diagnose, never
      silence; a red run between merge and the reader deploy (400 unknown action) is the known
      deploy-window transient and needs no fix
    hermetic: false
  - step: 14
    phase: post-deploy
    action: confirm rec-4094 closed on merge
    command: mcp__ducklake-reads__rec_by_id id=rec-4094
    expected: "status closed via the 'Resolves: rec-4094' trailer (the census judged its ::node_id acceptance decidable and green)"
    fix_if: >-
      an ACCEPTANCE-VERDICT refusal: fix the cause, then use the close_proposed command printed in the
      trailer-closure job log -- the manual portal close is FORBIDDEN there (git-ops.yaml resolves_trailer)
    hermetic: false
