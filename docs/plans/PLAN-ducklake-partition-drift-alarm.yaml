rollback: >-
  NOT a single revert: validate_schedule_removal_markers (--pre) refuses deleting a schedule-bearing
  workflow in one PR, with no marker escape. Retirement is mark-then-drop across two PRs -- (1)
  remove the schedule under a '# schedule-removal-approved: dec-NNN <reason>' marker whose Decision
  names ducklake-partition-drift.yml, together with the code revert (the governed channel then
  redeploys the prior reader); (2) delete the workflow file with its ci_rca_taxonomy row and both
  r3_workflows entries. FORBIDDEN: a code-only revert that leaves the scheduled --partition-drift
  step -- __main__._dispatch falls through to main() on an unknown flag, so the step would run the
  tf-convergence escalation every 6h and go silently green, and sensor_liveness would read it as
  healthy. The sensor only files, updates and closes its own rec; close any open
  ducklake_partition_drift rec with a resolution naming the retirement.
