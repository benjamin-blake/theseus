schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "repo-rename-relicense"
intent: >-
  Promote the already-ratified Theseus brand from presentation-layer-only to the repository
  identity by renaming benjamin-blake/agent-platform -> benjamin-blake/theseus in place, and flip
  future versions from Apache-2.0 to a BUSL-1.1 source-available posture, so the platform the
  North Star describes can be commercialised without abandoning the public curated portal.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-repo-rename-relicense.yaml
phase: >-
  Platform governance. No tier_item: this is ad-hoc work originating in audit PR #898
  (audits/private-repo-self-hosted-ci-9a545d2.yaml, Q1 intent I-B, Q9 licence branch, BEN-01).
  Soft-warn exception category user_explicit_out_of_scope, so the Tier Item Freshness Gate does
  not fire.

scope:
  # ---- PR-1: pre-rename dual trust (gated apply + operator admin apply) ----
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      Replace scalar local.github_repo with local.github_repos holding both slugs; this file owns
      the local that all four personal-root roles interpolate.
  - file: terraform/personal/oidc_ci_roles.tf
    action: Modify
    purpose: >-
      Expand github_ci_branch (2 subs) and github_ci_pr (2 subs) to iterate local.github_repos,
      yielding 8 entries during transition.
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: >-
      Expand github_ci_planner (1 main sub + 2 pr subs) and github_ci_deploy (1 main sub) to
      iterate local.github_repos, yielding 8 entries during transition.
  - file: terraform/bootstrap/github_ci_apply.tf
    action: Modify
    purpose: >-
      Dual-slug the apply role across BOTH Decision 94 sub forms (ref:refs/heads/main and
      environment:tf-gated-apply), yielding 4 entries during transition.

  # ---- PR-2: the rename (operator-directed terraform/github apply) ----
  - file: terraform/github/variables.tf
    action: Modify
    purpose: repository_name default flips from agent-platform to theseus.
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      Add prevent_destroy to the tf-gated-apply Environment. It currently has none, and a destroy
      fails OPEN: GitHub recreates a protection-rule-free environment on first job reference while
      the OIDC environment: sub still matches, silently ungating every gated apply.
  - file: terraform/github/repo.tf
    action: Modify
    purpose: >-
      Delete the now-redundant import block (id = var.repository_name). The resource is in state,
      so it is a no-op, but it is coupled to the variable this plan flips.
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Net-neutral slug substitution across ALL THREE old-slug occurrences (lines 6, 88, 91: the
      module subject line, the "import the existing agent-platform repository" sentence, and the
      import fallback command). This file sits at EXACTLY its 5253-byte prose budget, so the
      net-neutral constraint must be computed across all three substitutions, not two.

  # ---- PR-4: relicense + decision record (LAST -- see the F8 ordering note in context) ----
  - file: LICENSE
    action: Modify
    purpose: Parameterised BUSL-1.1 replaces the Apache-2.0 text.
  - file: LICENSE-APACHE
    action: Create
    purpose: Verbatim Apache-2.0 text, preserved as the governing licence for pre-flip versions.
  - file: LICENSING.md
    action: Create
    purpose: >-
      Forward-only licence boundary statement, anchored on an annotated tag and the last pre-flip
      SHA. Deliberately NOT named NOTICE: pre-flip snapshots are Apache-licensed and Apache-2.0
      section 4(d) gives that filename a specific redistribution meaning this file does not carry.
  - file: CONTRIBUTING.md
    action: Create
    purpose: >-
      Contribution posture and copyright-assignment statement. Dual licensing depends on sole
      copyright ownership, which GitHub ToS inbound=outbound does NOT supply.
  - file: COMMERCIAL-LICENSE.md
    action: Create
    purpose: Placeholder commercial-licence contact stub; no legal terms, no pricing.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Add COMMERCIAL-LICENSE.md, LICENSING.md and CONTRIBUTING.md to prose_allowlist.allowed_globs
      under one named permanent class ("licence-and-attribution artefacts"), never
      grandfathered_globs, which is ratchet-only and may not grow. Decision 171 names the class;
      the precedent is Decision 101(c)'s scoped marketing/** carve-out.
  - file: README.md
    action: Modify
    purpose: >-
      H1 becomes theseus; License section rewritten; CLA/copyright-assignment note added; AND the
      "Human portal files" row of the Documentation Model table refreshed to include the new root
      licence artefacts, which that row currently omits.
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: >-
      Title line names the project Theseus. No slug string exists in this file today, so this is a
      naming edit, not a substitution. Only 36 bytes of prose-budget headroom -- keep it net-neutral.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add Decision 171 (rename + relicense, amending Decisions 101 AND 127), AND add the reciprocal
      "Amended by Decision 171" forward-pointer inside Decision 101's own block. The pointer must
      name WHICH clauses move: point (b)'s repository-name row only (re-affirming the other four
      as frozen), point (f)'s paid-service deferral (discharged for the licence half), AND point
      (f)'s "secondary aspiration: open-source community" -- BUSL-1.1 is source-available, NOT OSI
      open source, and the CLA/copyright-assignment note changes contribution posture directly.
      DECISION 127 NEEDS ITS OWN reciprocal pointer plus a substantive amendment: add the
      licence-and-attribution artefact class to its point-1 permanent-class enumeration. Without
      the pointer, validate_supersession_annotations reddens post-merge main (it builds an edge per
      envelope amends id and FAILS unless the victim's block names "Decision 171"); without the
      class addition, the prose allowlist grows while the taxonomy governing it does not, which is
      exactly the drift Decision 127 point 3 exists to prevent. Editing 101 and 127 is NOT
      cap-measured -- validate_decisions_size skips baseline numbers -- so neither annotation
      competes for Decision 171's 6,144 bytes.

  # ---- PR-3: reference sweep + trust cleanup (narrow trust promptly after live proof) ----
  # NOTE: validate_licence_consistency and its THREE companion registration rows (_manifest.py,
  # config/ci_rca_taxonomy.yaml, the mirror test) ship in PR-4, NOT PR-3 -- the check asserts
  # licence-file consistency, which cannot hold until LICENSE/LICENSING.md land. Its slug-staleness
  # half is proven red-green by fixtures in the mirror test, not by tree state, so shipping it
  # whole in PR-4 loses no evidence. The two coverage top-ups below
  # (tests/checks/misc/test_validate_ghas_probe.py, tests/convergence_health/test_approvals.py)
  # ship with PR-3 alongside the modules they cover: test_coverage_checker enforces 100% on every
  # CHANGED Python file, so deferring either to PR-4 reds PR-3's own merge gate.
  # REMOVED FROM SCOPE (rec-3145): terraform/bootstrap/github_ci_apply_policy.tf's temporary
  # IAMRoleReconcile widening (rec-3132) is NOT reverted by this plan. The revert was tied to
  # PR-3's trust contraction, and Decision 172 point 4 rehomed that contraction to rec-3142. The
  # widening must SURVIVE until rec-3142 runs -- rec-3142's personal-root contraction needs
  # github_ci_apply to hold iam:UpdateAssumeRolePolicy on github_ci_planner and github_ci_deploy,
  # which is exactly what the widening grants. Reverting it here would strand that contraction
  # behind the same AccessDenied that partially failed PR-1's gated apply. The revert obligation
  # therefore travels WITH rec-3142, in the same bootstrap apply that narrows the trust, and
  # strictly after the personal-root contraction lands.
  - file: scripts/checks/misc/validate_ghas_probe.py
    action: Modify
    purpose: _DEFAULT_REPO slug (the CI path already reads GITHUB_REPOSITORY; only the local default is stale).
  - file: scripts/session/github_readiness.py
    action: Modify
    purpose: Hardcoded api.github.com/repos/<slug> URL in the authenticated readiness probe.
  - file: scripts/convergence_health/escalate.py
    action: Modify
    purpose: Acceptance-probe command string embedding the old slug.
  - file: scripts/convergence_health/approvals.py
    action: Modify
    purpose: >-
      Three bare `repo: str = "agent-platform"` defaults building reconcile/apply workflow-run
      URLs. Missed by a full-slug grep; found by the decision-scout gate.
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Line 61 names GITHUB_MCP_PAT as single-repo-scoped to agent-platform -- the identical
      criterion by which ghas-probe.yml:26 is in scope. Line 38's cd /home/user/agent-platform is
      an on-disk checkout path and must be LEFT ALONE (the directory name is rename-independent).
  - file: .github/workflows/ghas-probe.yml
    action: Modify
    purpose: Credential-header comment naming the GHAS_PROBE_TOKEN's repo scope.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exit-criterion prose naming the trusted repo. Text-only edit on an existing criterion, so
      the bare-string guard (which keys on added/removed `- id:` lines) does not fire.
  - file: scripts/checks/hygiene/validate_licence_consistency.py
    action: Create
    purpose: >-
      Registered check guarding two invariants: licence-file/LICENSING.md/README consistency, and
      no old-slug reference in class-(a) paths. The allowlist is a path->PATTERN map, not a bare
      path list: escalate.py needs FULL-SLUG matching (line 39 is class-(a) while lines 43/47's
      s3://agent-platform-data-lake are class-(b) in the SAME file), whereas approvals.py needs
      BARE-TOKEN matching (repo: str = "agent-platform"). One pattern for both yields either a
      vacuous pass on approvals.py or a permanent red on escalate.py. The check ALSO carries the
      BUSL parameter assertions (Licensor, Licensed Work, Change Date, Change License, Additional
      Use Grant present and non-placeholder, with the non-limitation clause inside the grant value)
      -- VP step 4's graduation waiver names this check as their standing home, so omitting them
      would make that waiver false. A THIRD pattern class is required for bin/setup-cloud-env.sh:
      line 61's "single-repo (agent-platform)" is class-(a), but line 38's cd /home/user/... is a
      checkout path and line 205's s3://agent-platform-data-lake is class-(b) -- and a bare-token
      pattern matches all three, since `-` is a word boundary. Pin that path to a line-anchored or
      context-qualified pattern, and make VP step 9 assert PER-PATH coverage of the allowlist
      rather than only an aggregate examined() count, or a silently-dropped path is invisible.
  - file: scripts/checks/hygiene/_manifest.py
    action: Modify
    purpose: Entry literal for the new check (registration surface 3).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check (registration surface 4).
  - file: tests/checks/hygiene/test_validate_licence_consistency.py
    action: Create
    purpose: Mirror test (registration surface 6); must reach 100% line coverage on the new module.
  - file: tests/checks/misc/test_validate_ghas_probe.py
    action: Modify
    purpose: >-
      Top up validate_ghas_probe.py from 91% to 100% -- the changed-file coverage gate admits no
      partial coverage on a touched module -- AND add a positive assertion that _default_repo()
      returns benjamin-blake/theseus with GITHUB_REPOSITORY unset. The sweep's own guard proves
      only that the old slug is absent; absence is not the same claim as correctness.
  - file: tests/convergence_health/test_approvals.py
    action: Modify
    purpose: Keep changed-file line coverage at 100% for approvals.py.

bundled_recommendations: []

infrastructure_dependencies:
  - >-
    terraform/personal (oidc.tf, oidc_ci_roles.tf, oidc_pipeline_roles.tf): assume_role_policy
    diff -> terraform_apply_guard.py exits 2 (fail-closed) -> gated-apply job behind the
    tf-gated-apply Environment. CI applies the saved plan.bin; no re-plan (Decision 77 no-TOCTOU).
  - >-
    terraform/bootstrap (github_ci_apply.tf): NO CI apply path and none may be added -- the root
    exists to break the self-grant cycle (T2.23). Operator-only, agent_platform_admin profile,
    admin container. The agent authors the diff and files a rec; a human executes the apply.
  - >-
    terraform/github (variables.tf): NO CI apply path; human-gated operator-directed apply only
    (Decision 77). Verified appliable from the admin container 2026-08-14: terraform init
    succeeds, integrations/github v6.12.1 signature-verified, state readable, 5 managed resources.
  - >-
    LAMBDA DEPLOY-GATING WAIVER (Decision 79 / CD.16 + CD.24). compute_affected_artifacts() over
    this scope returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} -- that file is an
    assets: entry of src/lambdas/data-pipeline/manifest.yaml, which is status: active, so the
    artifact is formally affected. NO build/deploy/smoke-test step is planned, deliberately: the
    change is a one-line prose substitution inside an existing exit criterion, the asset is
    consumed as agent CONTEXT rather than executed, and both dispatcher functions
    (agent-platform-scheduled-agent-dispatcher, agent-platform-findings-processor) are inert:
    the dispatcher is schedule-disabled (Decision 61/37/116, AGENTS.md re-enable runbook) and
    findings-processor is S3-event-driven (prod_lambdas.tf, s3:ObjectCreated on agents/*.jsonl)
    whose only producers ARE those disabled agents. A
    redeploy would ship a doc tweak to a function that never runs. This waiver is explicit
    because validate_lambda_deploy_gating is advisory-only and would not have caught the omission.
  - >-
    EXECUTION CONTEXT, corrected. The DEV container has no `terraform` and no `gh`; `api.github.com`
    is EGRESS-BLOCKED (403 even unauthenticated -- the proxy README says report it, never route
    around it); and only the agent_static/agent_platform profiles exist, so iam:GetRole and
    cloudtrail:* are both denied. VP steps 14-23 are therefore
    ADMIN-CONTAINER steps requiring agent_platform_admin and real github.com egress -- they are not
    runnable from a routine CC-web session, and an earlier draft wrongly implied they were. Steps
    1-13 are DEV-runnable (grep/python/git/diff only). All terraform validate/plan stays
    CI-delegated to the required terraform-validate check and the speculative-plan job.

acceptance_criteria:
  - >-
    The repository resolves at github.com/benjamin-blake/theseus with history, issues, pull
    requests, stars and the commit/PR reference graph intact, and the old URL 301-redirects to it.
  - >-
    REALIZED DIFFERENTLY (Decision 172, rec-3145) -- the original wording said "under the theseus
    slug", which the rename made false. GitHub applies the immutable subject
    repo:OWNER@OWNER-ID/REPO@REPO-ID to any repository renamed after 2026-07-15, so
    benjamin-blake/theseus mints ONLY repo:benjamin-blake@217728084/theseus@1252427466:<context>
    and the name-only slug mints nothing. The criterion as realized: all five OIDC roles
    authenticate live under the IMMUTABLE subject. Four are proven (branch 21:12:36Z, planner
    20:59:14Z, apply 21:20:37Z on BOTH Decision 94 sub forms, pr in the terraform-validate job log
    at 22:11:49Z, all 2026-08-15); github_ci_deploy is PENDING and owned by rec-3143, which no plan
    drives -- it advances on the next ducklake/prod Lambda deploy.
  - >-
    REHOMED to rec-3142 (Decision 172 point 4) -- NOT this plan. The trust contraction is a
    future, separately-evidenced act. The two legacy name-only entries stay trusted until every
    role records live proof under the immutable sub AND a follow-on contraction removes them
    explicitly. Narrowing to the name-only theseus entry, as this plan originally specified, would
    delete the only entry that works and re-break OIDC completely.
  - >-
    LICENSE is parameterised BUSL-1.1 (Licensor "Benjamin Blake", Change License Apache-2.0,
    Change Date = flip date + 4 years); LICENSE-APACHE holds the verbatim prior Apache text; and
    LICENSING.md states the forward-only boundary in a form that survives squash-merge SHA churn.
  - >-
    validate_licence_consistency is registered across SIX of the seven Decision 169/170 surfaces
    -- surface 5 (a verification_registry row) is owed per GRADUATED verification_plan step and
    this plan graduates none, per VP step 3's waiver -- passes
    in both presubmit tiers, and declares examined()/skipped() rather than relying on the frozen
    check-accounting baseline.
  - >-
    Decision 171 exists with a well-formed Decision 167 envelope declaring amends [101, 127], BOTH
    amended entries carry the reciprocal forward-pointer, Decision 127's point-1 enumeration gains
    the licence-and-attribution class, and the entry is synced to ops_decisions.
  - >-
    No AWS resource, IAM role, S3 bucket, SSM path, Glue database or Lambda is renamed; the
    agent-platform-* infrastructure namespace is untouched.

verification_plan:
  # ---------- PR-1 pre-deploy: structural proof before any apply ----------
  - step: 1
    phase: pre-deploy
    action: Both slugs present in the trust locals of both roots.
    command: >-
      grep -q 'benjamin-blake/theseus' terraform/personal/oidc.tf &&
      grep -q 'benjamin-blake/agent-platform' terraform/personal/oidc.tf &&
      grep -q 'benjamin-blake/theseus' terraform/bootstrap/github_ci_apply.tf &&
      grep -q 'benjamin-blake/agent-platform' terraform/bootstrap/github_ci_apply.tf
    expected: Exit 0. Both roots name both slugs.
    fix_if: >-
      Non-zero means a root still carries a single slug. Renaming with only one slug trusted
      breaks every AssumeRoleWithWebIdentity the instant the rename lands.
    graduation: waive
    graduation_waiver_reason: >-
      The dual-slug state is deliberately transient and is REMOVED by this same plan at step 23.
      Graduating it would install a standing guard asserting a condition the plan intends to
      delete, which would then fail on every PR after cleanup.
  - step: 2
    phase: pre-deploy
    action: No scalar local.github_repo survivor anywhere in either root.
    command: "! grep -rn 'local\\.github_repo\\b' terraform/personal/ terraform/bootstrap/"
    expected: Exit 0 (no matches). Every sub site consumes the list local, not the old scalar.
    fix_if: >-
      A match means a sub entry was missed and that role will trust only one slug. Note \b after
      'repo' does not match inside 'github_repos', so this finds scalar survivors only.
    graduation: waive
    graduation_waiver_reason: >-
      The DUAL-SLUG state exists only during the transition window and is narrowed at cleanup, so
      a standing guard would assert a condition this plan deletes. Note the list local itself is
      RETAINED at cleanup as a one-element list -- PR-3 must not revert to the scalar, or this very
      step fails when PR-3 runs it.
  - step: 3
    phase: pre-deploy
    action: Decision 94 invariant -- the apply role's trust carries BOTH sub forms.
    command: >-
      grep -q 'ref:refs/heads/main' terraform/bootstrap/github_ci_apply.tf &&
      grep -q 'environment:tf-gated-apply' terraform/bootstrap/github_ci_apply.tf
    expected: Exit 0. Both the ref form and the environment form are present.
    fix_if: >-
      Losing the environment form silently breaks the gated-apply path -- the job assumes a sub
      GitHub overrides to the environment claim. This is the exact VP9 regression Decision 94 was
      written to prevent, and it must hold before, during and after the dual-trust window.
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible and genuinely worth graduating, but NOT graduatable from this plan.
      validate_graduation_completeness's implement-PR leg fires on any feat(repo-rename-relicense)
      commit and demands a NEW-IN-DIFF registry row; _new_registry_rows excludes any check_id
      already on the origin/main baseline. This plan spans four PRs, each carrying such a commit,
      so a row in PR-1 satisfies PR-1 and then fails PRs 2-4 once it is baselined -- there is NO
      placement of one row that satisfies all four. Same cross-PR structural class as the dropped
      hermetic markers. The invariant is still asserted in-plan by this step and by the
      terraform/bootstrap/github_ci_apply.tf test obligation; a follow-on rec graduates
      bootstrap-apply-trust-both-sub-forms from a single-PR plan where new-in-diff is satisfiable.
  - step: 4
    phase: pre-deploy
    action: BUSL-1.1 parameter block is complete with no unfilled placeholders.
    command: >-
      grep -q 'Business Source License 1.1' LICENSE &&
      grep -q '^Licensor: *Benjamin Blake' LICENSE &&
      grep -q '^Licensed Work:' LICENSE &&
      grep -qE '^Change Date: *20[0-9]{2}-[0-9]{2}-[0-9]{2}' LICENSE &&
      grep -q '^Change License: *Apache-2.0' LICENSE &&
      grep -q '^Additional Use Grant:' LICENSE &&
      awk '/^Additional Use Grant:/,/^Change Date:/' LICENSE
      | grep -qiE 'without limitation|not exhaustive' &&
      ! awk '/^Licensor:/,/^-----/' LICENSE | grep -qE '\[[^]]*\]'
    expected: >-
      Exit 0. Every BUSL parameter is populated and NO bracket placeholder survives anywhere in the
      Parameters block -- which now includes canonical BUSL-1.1's "please visit: [ ]" line, the
      alternative-licensing contact slot that sits AFTER Change License: and was outside an earlier
      range. That slot must point at COMMERCIAL-LICENSE.md or the maintainer address; shipping it
      empty while the repo advertises commercial licences is the defect this widened range catches.
    fix_if: >-
      An unfilled parameter makes the grant defective. A missing Change Date in particular leaves
      the licence with no conversion trigger at all.
    graduation: waive
    graduation_waiver_reason: >-
      This invariant IS graduated, but as the registered check validate_licence_consistency (a
      scope row) rather than as a verification-registry row. A registry row would invoke the same
      assertions a second time from a second home, creating two places to drift.
  - step: 5
    phase: pre-deploy
    action: LICENSE-APACHE is the verbatim pre-flip Apache text, not a paraphrase.
    command: >-
      git show origin/main:LICENSE > "${TMPDIR:-/tmp}/pre-flip-licence.txt" &&
      diff -q "${TMPDIR:-/tmp}/pre-flip-licence.txt" LICENSE-APACHE
    expected: Exit 0. LICENSE-APACHE is byte-identical to the Apache text that governed pre-flip versions.
    fix_if: >-
      Any drift means the preserved licence is not the one those versions were actually released
      under, which undermines the forward-only claim LICENSING.md makes.
    graduation: waive
    graduation_waiver_reason: >-
      The comparison base is origin/main at flip time, a moving reference that stops being
      meaningful once the flip has landed; a standing guard would compare against the wrong tree
      forever after. The durable half (LICENSE-APACHE exists and is Apache text) is covered by
      validate_licence_consistency.
  - step: 6
    phase: pre-deploy
    action: LICENSING.md's boundary SHA equals the last pre-flip commit.
    command: >-
      test "$(grep -oE '[0-9a-f]{40}' LICENSING.md | head -1)" = "$(git rev-parse origin/main)"
    expected: >-
      Exit 0. The SHA in LICENSING.md is the tip of main this branch was cut from.
    fix_if: >-
      A mismatch means main advanced after LICENSING.md was written. Rebase onto origin/main,
      update the SHA, and re-run. Run this immediately before the final push. To re-verify AFTER
      the squash-merge, compare against the flip commit's FIRST PARENT (git rev-parse HEAD^1),
      NOT origin/main -- post-merge origin/main IS the flip commit, so re-running the command
      verbatim is guaranteed to fail and would be a false alarm.
      DEVIATION -- TAG HALF RETIRED AT IMPLEMENT TIME (operator decision, 2026-08-16). This step
      originally also asserted that an annotated apache-final tag resolved to the same commit.
      `git push origin apache-final` fails from the DEV container on every attempt, including
      four retries with exponential backoff, while a branch push over the same remote succeeds --
      the agent proxy blocks tag refs specifically. CC-web is this project's only dev surface, so
      there is no other container from which an agent could push it, and a local-only tag is not
      an anchor. The boundary is therefore anchored on the 40-hex SHA alone, which LICENSING.md
      already carries, backed by its provenance-scoped self-verifying rule -- that rule was
      designed to survive SHA churn and does not depend on a tag existing. The local tag was
      created and then DELETED rather than left behind, so no artefact names a referent the
      public repository does not have.
    graduation: waive
    graduation_waiver_reason: >-
      Same moving-reference problem as step 5: the assertion is anchored on origin/main at flip
      time, so a standing guard would compare against the wrong tree forever after the flip lands.
      The durable half (LICENSING.md exists and names a real commit) is covered by
      validate_licence_consistency.
  - step: 7
    phase: pre-deploy
    action: COMMERCIAL-LICENSE.md is sanctioned by the prose allowlist.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/contracts/file-router.yaml'));
      a=set(d['prose_allowlist']['allowed_globs']); g=set(d['prose_allowlist']['grandfathered_globs']);
      w={'COMMERCIAL-LICENSE.md','LICENSING.md','CONTRIBUTING.md'};
      assert w <= a, w - a; assert not (w & g), w & g; print('sanctioned')"
    expected: Exit 0. All three new tracked .md files are sanctioned; none is parked in the ratchet-only list.
    fix_if: >-
      validate_prose_allowlist scans every tracked .md repo-wide and fails an unsanctioned one.
      grandfathered_globs may only shrink, so parking it there is not an option.
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_allowlist is itself the standing repo-wide guard for exactly this property;
      a registry row would duplicate a check that already runs in both tiers.
  - step: 8
    phase: pre-deploy
    action: The new check declares examined()/skipped() per Decision 170 and is not baselined.
    command: >-
      grep -qE '(registry\.)?(examined|skipped)\(' scripts/checks/hygiene/validate_licence_consistency.py &&
      ! grep -q 'validate_licence_consistency' config/check_accounting_baseline.yaml
    expected: Exit 0. The module declares an outcome and does not appear in the frozen baseline.
    fix_if: >-
      validate_check_accounting AST-scans every registered check and fails an undeclared,
      unbaselined one. The baseline is bounded by a frozen _BASELINE_SEED and has no marker escape
      grammar, so a new check cannot be grandfathered -- it must declare.
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_accounting already enforces this for every registered check in both tiers;
      a per-plan registry row would guard one check against a rule that is already universal.
  - step: 9
    phase: pre-deploy
    action: The new check passes against the swept tree, and would have failed before the sweep.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene.validate_licence_consistency import
      validate_licence_consistency as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)"
    expected: >-
      Exit 0 with an empty failure list. The check ships in PR-4, AFTER PR-3's sweep, so red is
      NOT observable against the tree -- it is demonstrated by mirror-test fixtures carrying the
      old slug (step 10). What this step proves is that the check is non-vacuous against the real
      tree: it must report a non-zero examined() count, never an empty domain.
    fix_if: >-
      A pass with examined(0) is a VACUOUS pass -- the path allowlist is wrong or empty -- and is
      exactly what Decision 170's declarative channel exists to make visible. Check the declared
      count, not just the exit code.
    graduation: waive
    graduation_waiver_reason: >-
      The check itself is the standing guard and runs in both presubmit tiers via its manifest
      Entry; graduating a VP step that invokes the same callable adds a second registration of one
      guard.
  - step: 10
    phase: pre-deploy
    action: Mirror test passes and the new module is fully covered.
    command: >-
      bin/venv-python -m pytest tests/checks/hygiene/test_validate_licence_consistency.py -q
    expected: All tests pass.
    fix_if: >-
      test_coverage_checker enforces 100% line coverage on every CHANGED Python file, so partial
      coverage of the new module fails the merge gate even if the tests themselves pass.
    graduation: waive
    graduation_waiver_reason: >-
      The mirror test is already a permanent part of the suite and runs on every full-tier
      execution; a registry test_selector row would schedule the same file twice.
  - step: 11
    phase: pre-deploy
    action: The new check is dispatchable through the real registry, not merely defined.
    command: >-
      bin/venv-python -c "from scripts.checks import registry;
      n={s.name for s in registry.pre_sequence()} | {s.name for s in registry.full_sequence()};
      assert 'validate_licence_consistency' in n, sorted(n)[:8]; print('dispatchable')"
    expected: Exit 0, prints dispatchable.
    fix_if: >-
      Absence means the hygiene _manifest.py Entry is missing or misspelled. A module with a
      @register decoration but no Entry is never dispatched -- it silently does nothing.
    graduation: waive
    graduation_waiver_reason: >-
      Manifest/registry integrity is already covered by tests/checks/registry/test_manifest_contracts.py
      and the domain manifest test, both of which run repo-wide rather than per-plan.
  - step: 12
    phase: pre-deploy
    action: Decision 171's envelope is well-formed and Decision 101 carries the reciprocal pointer.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text();
      b=re.search(r'## Decision 171:.*?(?=\\n## Decision )', t, re.S).group(0);
      import yaml; env=yaml.safe_load(re.search(r'\`\`\`yaml\\n(.*?)\`\`\`', b, re.S).group(1));
      assert env['number']==171, env; am=env.get('amends') or [];
      assert 101 in am and 127 in am, am; assert (env.get('significance') or {}).get('justification');
      assert len(b.encode()) <= 6144, len(b.encode());
      [__import__('sys').exit('Decision %d lacks the reciprocal forward-pointer' % v)
      for v in (101, 127) if 'Decision 171' not in
      re.search(r'## Decision %d:.*?(?=\\n## Decision )' % v, t, re.S).group(0)];
      assert 'licence-and-attribution' in
      re.search(r'## Decision 127:.*?(?=\\n## Decision )', t, re.S).group(0),
      'Decision 127 point 1 lacks the new licence-and-attribution class'; print('ok')"
    expected: >-
      Exit 0. Envelope declares amends [101, 127], carries a significance justification, is within
      the size norm, and BOTH amended entries point back at Decision 171.
    fix_if: >-
      validate_supersession_annotations builds a graph edge from the envelope's amends list and
      FAILS unless the amended entry names its amender. Without the reciprocal pointer, post-merge
      main goes red and spawns a critical ci_rca rec.
    graduation: waive
    graduation_waiver_reason: >-
      validate_decision_entry_conformance and validate_supersession_annotations already enforce
      envelope well-formedness and edge reciprocity for every entry; this step is a pre-flight
      rehearsal of guards that already exist.
  - step: 13
    phase: pre-deploy
    action: Pre-handoff full-tier validation (Decision 163), run in EACH of the four PRs.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 on a completed run.
    fix_if: >-
      A timeout is not a pass -- handoff_policy.timeout_disposition is blocked, so resume later
      and rerun from the start. Do not commit or open the PR on an incomplete run.
    graduation: not-applicable

  # ---------- PR-1 post-deploy: live trust proof ----------
  - step: 14
    phase: post-deploy
    action: After the personal-root gated apply, all four personal roles trust the new slug live.
    command: >-
      set -o pipefail; for r in agent-platform-github-ci-branch agent-platform-github-ci-pr
      agent-platform-github-ci-planner agent-platform-github-ci-deploy; do
      D=$(aws iam get-role --role-name "$r" --profile agent_platform_admin
      --query 'Role.AssumeRolePolicyDocument' --output json) || { echo "READ FAILED: $r"; exit 1; };
      test -n "$D" || { echo "EMPTY doc: $r"; exit 1; };
      echo "$D" | grep -q 'benjamin-blake/theseus'
      || { echo "MISSING theseus sub: $r"; exit 1; }; done; echo all-four-ok
    expected: Prints all-four-ok. Read from live IAM, never from the Terraform plan.
    fix_if: >-
      A missing role means its sub list was not expanded. Do NOT proceed to the rename -- that
      role's workflows will fail to authenticate the moment the slug changes.
  - step: 15
    phase: post-deploy
    action: After the operator bootstrap apply, the apply role carries all four sub entries.
    command: >-
      set -o pipefail; T=$(aws iam get-role --role-name agent-platform-github-ci-apply
      --profile agent_platform_admin --query 'Role.AssumeRolePolicyDocument' --output json) &&
      test -n "$T" &&
      echo "$T" | grep -q 'theseus:ref:refs/heads/main' &&
      echo "$T" | grep -q 'theseus:environment:tf-gated-apply' &&
      echo "$T" | grep -q 'agent-platform:ref:refs/heads/main' &&
      echo "$T" | grep -q 'agent-platform:environment:tf-gated-apply' && echo four-subs-ok
    expected: Prints four-subs-ok -- two slugs times two Decision 94 sub forms.
    fix_if: >-
      Fewer than four means the operator apply did not land or dropped a form. The environment
      form is the one that breaks gated-apply silently; treat its absence as a hard stop.
  - step: 16
    phase: post-deploy
    action: >-
      ADMIN-CONTAINER STEP. No unrelated regression under the OLD slug with dual trust in place. NOTE this is a
      weak-positive check only: ci.yml:197-198's assume is continue-on-error, so a green run does
      NOT prove both slugs are trusted -- steps 14 and 15 are the actual trust evidence.
    command: >-
      curl -sf -H "Authorization: Bearer $(cat ~/.config/gh-mcp/token)"
      -H "Accept: application/vnd.github+json"
      "https://api.github.com/repos/benjamin-blake/agent-platform/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=1"
      | jq -e '.workflow_runs[0].conclusion == "success"'
    expected: jq exits 0 -- the most recent push-to-main CI run succeeded with both slugs trusted.
    fix_if: >-
      Red here means dual trust itself broke something. Fix before renaming; this is the last
      moment where the old slug is still the live name and rollback is free.

  # ---------- PR-2 post-deploy: the rename ----------
  - step: 17
    phase: post-deploy
    action: ADMIN-CONTAINER STEP. The repository answers at the new slug with its identity and history intact.
    command: >-
      curl -sf -H "Authorization: Bearer $(cat ~/.config/gh-mcp/token)"
      -H "Accept: application/vnd.github+json"
      https://api.github.com/repos/benjamin-blake/theseus
      | jq -e '.name == "theseus" and .full_name == "benjamin-blake/theseus" and .private == false'
    expected: jq exits 0. Name flipped, still public.
    fix_if: >-
      A 404 means the apply did not land. If .private is true the apply changed visibility, which
      is an explicit non-goal -- revert immediately.
  - step: 18
    phase: post-deploy
    action: ADMIN-CONTAINER STEP. The old URL redirects rather than 404s, so historical references still resolve.
    command: >-
      test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $(cat ~/.config/gh-mcp/token)"
      https://api.github.com/repos/benjamin-blake/agent-platform)" = "301"
    expected: HTTP 301.
    fix_if: >-
      Anything else means the redirect is absent and every archived plan, DECISIONS run URL and
      audit reference to the old slug is now dead. The old name must never be reused for a new
      repository or the redirect breaks permanently.
  - step: 19
    phase: post-deploy
    action: ADMIN-CONTAINER STEP. Repo-attached configuration survived the rename (the verification list IS the deliverable).
    command: >-
      B="https://api.github.com/repos/benjamin-blake/theseus"; H="Authorization: Bearer $(cat ~/.config/gh-mcp/token)";
      curl -sf -H "$H" "$B/rulesets" | jq -e 'map(select(.name=="main-protection")) | length == 1' &&
      curl -sf -H "$H" "$B/environments/tf-gated-apply" | jq -e '.protection_rules | length > 0' &&
      curl -sf -H "$H" "$B/actions/variables?per_page=100" | jq -e '.variables | map(.name) | index("AWS_ACCOUNT_ID") != null' &&
      curl -sf -H "$H" "$B/actions/secrets?per_page=100" | jq -e '.secrets | map(.name) | index("GHAS_PROBE_TOKEN") != null' &&
      curl -sf -H "$H" "$B/codeowners/errors" | jq -e '.errors | length == 0' &&
      curl -sf -H "$H" "$B" | jq -e '.security_and_analysis.secret_scanning.status == "enabled"
      and .security_and_analysis.secret_scanning_push_protection.status == "enabled"' && echo config-intact
    expected: >-
      Prints config-intact -- ruleset, gated-apply Environment with reviewers, Actions variable,
      Actions secret, CODEOWNERS parsing clean, and GHAS secret scanning plus push protection.
    fix_if: >-
      Any failure identifies exactly which repo-attached setting did not survive. Rename is
      expected to preserve all of these; this step exists to prove it rather than assume it.
  - step: 20
    phase: post-deploy
    action: The fine-grained GHAS_PROBE_TOKEN's repo scope survived the rename.
    command: >-
      set -o pipefail; test -n "$PREV_RUN_ID" || { echo "PREV_RUN_ID unset -- capture the newest
      dispatch run id BEFORE dispatching"; exit 1; };
      H="Authorization: Bearer $(cat ~/.config/gh-mcp/token)";
      curl -sf -X POST -H "$H" -H "Accept: application/vnd.github+json"
      https://api.github.com/repos/benjamin-blake/theseus/actions/workflows/ghas-probe.yml/dispatches
      -d '{"ref":"main"}' &&
      curl -sf -H "$H" "https://api.github.com/repos/benjamin-blake/theseus/actions/workflows/ghas-probe.yml/runs?event=workflow_dispatch&per_page=1"
      | jq -e --argjson prev "$PREV_RUN_ID"
      '.workflow_runs[0].id > $prev and .workflow_runs[0].conclusion == "success"'
    expected: >-
      Dispatch accepted AND a STRICTLY NEWER run concluded success. Capture PREV_RUN_ID from the
      same endpoint BEFORE dispatching -- ghas-probe has pre-existing green dispatch runs (AGENTS.md
      cites run 31536138747 from 2026-08-11), so an unpinned query yields a false pass that never
      exercises the post-rename token. Re-run the second half until the run leaves "in_progress";
      a null conclusion is not a pass. ADMIN-CONTAINER STEP -- api.github.com
      is egress-blocked from the DEV container.
    fix_if: >-
      ghas-probe is loud-fail by design: a rotated, expired or mis-scoped token exits non-zero
      rather than skipping. A failure here means the PAT is repo-name-scoped rather than
      repo-ID-scoped and must be re-minted against the new name.
  - step: 21
    phase: post-deploy
    action: >-
      REHOMED to rec-3142 (Decision 172 / rec-3145). Originally gated PR-3's contraction on live
      proof that four personal-root roles were assumed under the new slug. The evidence exists but
      under the IMMUTABLE subject, not the name slug: branch 21:12:36Z, planner 20:59:14Z, apply
      21:20:37Z (BOTH Decision 94 sub forms), pr 22:11:49Z, all 2026-08-15. github_ci_deploy is
      still PENDING and owned by rec-3143. Since this plan no longer contracts, the step gates
      nothing here and its evidence obligation travels to rec-3142.
    command: "true  # rehomed -- see rec-3142 and rec-3143"
    expected: Not executed by this plan.
    fix_if: >-
      Do NOT resurrect this step here. Contracting on four-of-five evidence is exactly what
      rec-3142 sequences against rec-3143.
    graduation: not-applicable
  - step: 22
    phase: post-deploy
    action: >-
      REHOMED to rec-3142. Proved the apply role on BOTH Decision 94 sub forms via PR-3's own
      gated apply. This plan's PR-3 has no apply, so there is no run to observe. The equivalent
      proof already landed during the Decision 172 recovery (apply 21:20:37Z, both sub forms).
    command: "true  # rehomed -- see rec-3142"
    expected: Not executed by this plan.
    fix_if: Do NOT resurrect here; rec-3142 owns the contraction that this verified.
    graduation: not-applicable
  - step: 23
    phase: post-deploy
    action: >-
      REHOMED to rec-3142. Asserted that after cleanup no role trusts the old slug. This plan
      performs no cleanup, and asserting the absence of entries Decision 172 deliberately RETAINS
      would fail by design.
    command: "true  # rehomed -- see rec-3142"
    expected: Not executed by this plan.
    fix_if: >-
      Do NOT resurrect here. Decision 172 point 4 keeps the legacy entries trusted on purpose
      until rec-3142 removes them with live proof.
    graduation: not-applicable
  - step: 25
    phase: post-deploy
    action: >-
      REHOMED to rec-3142. Asserted the temporary IAMRoleReconcile widening (rec-3132) was fully
      reverted. The widening must now SURVIVE this plan: rec-3142's personal-root contraction
      needs github_ci_apply to hold iam:UpdateAssumeRolePolicy on planner and deploy. Reverting it
      here would strand that contraction behind the same AccessDenied that partially failed PR-1.
    command: "true  # rehomed -- see rec-3142"
    expected: Not executed by this plan.
    fix_if: >-
      Do NOT revert the widening in this plan. The revert belongs in the SAME bootstrap apply that
      narrows the trust, strictly after the personal-root contraction lands.
    graduation: not-applicable
  - step: 24
    phase: post-deploy
    action: Decision 171 reached the warehouse.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md &&
      bin/venv-python -m scripts.sync.ops sync &&
      grep -q '"id": "dec-171"' logs/.decisions-index.jsonl
    expected: Backfill succeeds and dec-171 appears in the refreshed read cache.
    fix_if: >-
      DECISIONS.md is the numbering authority and ops_decisions is rebuilt from it. Never write
      the row directly -- re-run the backfill after fixing the entry.

