rollback: >-
  Four independent reverts, each safe alone. (1) The sysmon pin is one env assignment -- delete
  it and the C-tracer cost returns, with no schema, contract or artifact change (the artifact is
  byte-identical either way). (2) The warn band is one branch in _scaffold_budget_assertion plus
  one filer -- delete both and the assertion returns to its exact Decision 153 shape; no data
  migration, since drift recs are ordinary ops_recommendations rows discriminated by source. (3)
  The preflight alert is an additive derivation returning None when no drift recs exist. (4) The
  phase breakdown is a print. The Decision carries its own reversal conditions and would be
  superseded by a dated entry, never by editing its body (Decision 177).
