schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "fast-tier-coverage-tracing-regression"
intent: >-
  Restore the --pre fast tier to its ratified 300s budget by repaying a coverage-tracing
  regression that consumes half the budget for a report-only artifact, and close the
  per-phase-cost blind spot that let that regression land and persist undetected.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-fast-tier-coverage-tracing-regression.yaml
phase: >-
  Platform / validation-tier health. No tier_item claimed: this is a soft-warn exception
  (ci_rca-adjacent regression repair on the sole pre-merge merge gate), surfaced by the
  preflight budget_bypass_alert and budget_breach_summary rather than by roadmap eligibility.
scope:
  - file: scripts/checks/_pytest_diff.py
    action: Modify
    purpose: >-
      Run the ONE coverage-traced pytest invocation under COVERAGE_CORE=sysmon (PEP 669),
      with a loud Decision-55 guard that prints the retained C-tracer cost rather than
      silently substituting when sys.monitoring or coverage>=7.4 is unavailable.
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Print the per-phase elapsed breakdown from INSIDE _scaffold_budget_assertion (the last
      pre_sequence step) so it survives the sys.exit(1) breach paths, and add the 255s warn
      band as a fifth, forced-scope-aware outcome.
  - file: scripts/checks/_budget_recs.py
    action: Modify
    purpose: >-
      Add the warn-band drift rec filer and parameterize the dedupe finder on source, so a
      budget_drift rec dedupes against budget_drift rather than never matching (or worse,
      overwriting an open budget_breach rec).
  - file: scripts/preflight/alerts.py
    action: Modify
    purpose: >-
      Add the budget_drift alert derivation. Without this the drift rec surfaces in NO
      preflight alert and Decision 178's "named review trigger" claim would be false at merge.
  - file: scripts/preflight/summary.py
    action: Modify
    purpose: >-
      Add print_budget_drift_alert, mirroring print_budget_bypass_alert. This module is
      presentation-only: every alert dict it renders is computed elsewhere and passed in.
  - file: scripts/session/preflight.py
    action: Modify
    purpose: >-
      The orchestrator that closes the chain: import the drift check, submit it to the phase_b
      pool alongside _check_budget_bypass_alert, collect the result, write
      report["budget_drift_alert"], and call the summary printer. Without this row the alert is
      computed and printable but never assembled into the report -- alerts.py and summary.py
      alone do not surface anything.
  - file: tests/validate/test_warn_band.py
    action: Create
    purpose: >-
      Home for ALL new warn-band, phase-breakdown and drift-rec tests. A new sibling in the
      same Decision-131 mirror directory, deliberately chosen over growing test_budget.py
      (403 SLOC) past the Decision 128 500-SLOC default.
  - file: tests/validate/test_budget.py
    action: Modify
    purpose: >-
      Adjust only those existing assertions that the new breakdown print or the reordered
      branch structure disturbs. No new test classes land here.
  - file: tests/validate/test_pytest_diff_coverage.py
    action: Modify
    purpose: >-
      Cover the sysmon env on the coverage invocation, the loud-guard fallback path, and a
      BOUNDED ctrace-vs-sysmon artifact-equivalence proof.
  - file: tests/session/preflight/test_alerts.py
    action: Modify
    purpose: Cover the budget_drift alert derivation and its zero-reader-call degradation path.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the numbered Decision (amends 153) ratifying the warn band as an
      explicitly-declared alarm-not-gate, with its derivation rule and reversal conditions.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The coverage-traced pytest invocation in scripts/checks/_pytest_diff.py runs with
    COVERAGE_CORE=sysmon, and on a bounded fixed selection the artifact it produces is equal
    field-for-field to the artifact the default C tracer produces on that same selection.
  - >-
    On a representative affected set (>=30 modules), the coverage-traced invocation completes
    in under 90s. (Plan-time context, NOT asserted by the VP: the identical selection costs
    210.3s under the default C tracer and 60.1s with no coverage at all.)
  - >-
    When sys.monitoring is unavailable or coverage is older than 7.4, the run prints a LOUD
    named notice that the C-tracer cost is being retained, and does not silently proceed as
    though sysmon were active (Decision 55).
  - >-
    Every --pre run prints a phase breakdown naming all six scaffold phases individually, the
    aggregate check-registry total, and the ten slowest individual checks -- and the breakdown
    ALWAYS contains whatever phase dominant_phase resolves to. It is emitted on the pass path,
    the warn path, both forced paths, and the ordinary breach path.
  - >-
    Elapsed in [255s, 300s] on a NON-forced run prints a phase-attributed warn notice, mirrors
    it to GITHUB_STEP_SUMMARY, and exits zero. Locally it files exactly one drift rec, deduped
    per (branch, dominant_phase) against prior budget_drift recs. In CI it files no rec at all
    and the step-summary mirror is the only surface, matching _file_budget_breach_rec's
    existing CI early-return.
  - >-
    A run with full_suite_forced true never files a drift rec and never emits a warn notice at
    any elapsed value -- Decision 153 rules a forced run is deterministic, not drift.
  - >-
    Elapsed below 255s files no drift rec and issues zero reader calls.
  - >-
    Elapsed above 300s on a non-forced run retains the existing breach behaviour exactly
    (breach rec + exit 1) and does not additionally file a drift rec for the same run.
  - >-
    A filed budget_drift rec surfaces in the preflight report as its own alert key, verified by
    a test, so the Decision's named review trigger is true rather than aspirational.
  - >-
    docs/DECISIONS.md gains a single new '## Decision N:' entry with a conformant yaml metadata
    envelope naming amends [153], its reversal conditions in the monitored
    'yaml reversal-conditions' stanza dialect, a body at or under Decision 167 clause 3's
    6,144-byte per-entry hard cap, and no pre-existing entry body edited.
  - >-
    After the PR merges, the open budget_breach and budget_bypass recs are closed via the ops
    portal, enumerated from the live open_recs reader verb, and a re-query confirms zero remain
    open.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove sysmon repays the regression on a real affected set. Clears stale coverage
      parallel-mode data first and after: leftover .coverage.vm.pid* files from an interrupted
      run make the json report exit non-zero and read as a false test failure (observed at plan
      time), and they are commit-eligible artifacts in the tree (origin/main #963 finding).
    command: >-
      rm -f .coverage .coverage.vm.pid* ; bin/venv-python -c "import subprocess,sys,time,os;
      from scripts.checks.deps.affected_tests import derive_affected_tests; from scripts.checks
      import _common; m=['scripts/checks/roadmap/validate_fallback_reevaluation.py','docs/ROADMAP-PLATFORM.yaml','docs/contracts/verification-registry.yaml','tests/esb_text_fix/test_decision_scope_notes.py','tests/esb_text_fix/test_resume_property_vocabulary.py','tests/provider_agnostic_tier_model/test_role_based_tier_model.py'];
      t=sorted(derive_affected_tests([('M',f) for f in m],repo_root=_common.ROOT)['selected']);
      flags=['-n','auto','--timeout','60','--timeout-method=thread','--randomly-seed=20260710','-q','-m','not
      integration','--cov=src','--cov=scripts','--cov-fail-under=0','--cov-report=json:/tmp/vp1-cov.json'];
      s=time.monotonic(); r=subprocess.run([sys.executable,'-m','pytest',*flags,*t],cwd=_common.ROOT,capture_output=True,text=True,env={**os.environ,'COVERAGE_CORE':'sysmon'});
      print('MODULES',len(t),'RC',r.returncode); print('SYSMON_S',round(time.monotonic()-s,1))"
      ; rm -f .coverage .coverage.vm.pid*
    expected: >-
      MODULES at or above 30, RC 0, and SYSMON_S under 90. Measured five times at plan time on
      this command shape: 67.0 / 68.7 / 68.4 / 67.2 / 68.6 seconds.
    fix_if: >-
      SYSMON_S at or above 90 means sysmon is not engaging -- confirm COVERAGE_CORE reaches the
      subprocess env and coverage>=7.4 is installed; do NOT proceed by raising the budget. A
      non-zero RC alongside a passing plain run means stale coverage data survived the rm --
      widen the clear rather than treating it as a real test failure.
    graduation: waive
    graduation_waiver_reason: >-
      Wall-clock timing on a shared 4-vCPU runner is exactly the flappy signal this plan
      declines to install as a gate (see the Decision's alarm-not-gate rationale); graduating it
      into the standing registry would recreate the noise problem the plan argues against. The
      durable regression guard is step 2's artifact-equivalence check, which is deterministic
      and IS graduated.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove sysmon does not under-measure, on a BOUNDED fixed selection, asserting core-vs-core
      equality rather than absolute counts (which move every commit).
    command: >-
      bin/venv-python -m pytest tests/validate/test_pytest_diff_coverage.py -q
    expected: >-
      All tests pass, including an equivalence test that runs one small fixed selection under
      both cores and asserts covered_lines, num_statements, missing_lines and the per-file
      covered_lines map are EQUAL between them. (Plan-time whole-set evidence, not asserted
      here: 8208/35143 lines across 416 files, zero files differing.)
    fix_if: >-
      Any divergence means sysmon measures differently on this codebase -- stop, do not ship the
      pin, and reassess (branch coverage is not configured here, which is precisely the
      condition under which the two cores agree).
    graduation: graduate
    graduation_check_id: "pytest-diff-coverage-core-artifact-equivalence"
  - step: 3
    phase: pre-deploy
    action: >-
      Exercise the warn band, the breach band and BOTH forced-scope paths as mutually exclusive
      outcomes, and prove the warn path exits zero.
    command: >-
      bin/venv-python -m pytest "tests/validate/test_warn_band.py::TestHeadroomWarnBand" -q
    expected: >-
      All tests pass: warn fires at 255s and 299s on a non-forced run; silent at 254s; exits
      zero; mirrors to GITHUB_STEP_SUMMARY; breach at 301s still exits 1; a forced run never
      warns at any elapsed; no run ever produces both a drift and a breach rec.
    fix_if: >-
      A warn below 255s means the derivation is wrong; a warn that exits non-zero means the band
      was wired as a gate, contradicting the Decision; a warn on a forced run contradicts
      Decision 153 clause 1.
    graduation: graduate
    graduation_check_id: "fast-tier-warn-band-exits-zero"
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the reader budget: zero reader calls below the threshold, at most one above, and
      that drift dedupes against drift rather than against breach.
    command: >-
      bin/venv-python -m pytest "tests/validate/test_warn_band.py::TestDriftRecReaderBudget" -q
    expected: >-
      Tests pass showing _fetch_open_recs is not called for a sub-255s run, is called at most
      once for a warn-band run, that the source-parameterized finder matches a prior
      budget_drift rec, and that it never matches or mutates an open budget_breach rec.
    fix_if: >-
      Any reader call on a fast in-budget run means the read was hoisted above the crossing. A
      drift rec matching a breach rec means the finder was not parameterized and a warn is
      overwriting breach telemetry.
    graduation: graduate
    graduation_check_id: "fast-tier-warn-band-no-reader-call-under-threshold"
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the phase breakdown is emitted on the ordinary pass path AND survives the breach
      path's sys.exit, and that it always contains dominant_phase.
    command: >-
      bin/venv-python -m pytest "tests/validate/test_warn_band.py::TestPhaseBreakdown" -q
    expected: >-
      Tests pass asserting the breakdown names all six scaffold phases, the check-registry
      aggregate and the ten slowest checks; that dominant_phase is always present in it; and
      that it is emitted on the pass, warn, forced and breach paths alike.
    fix_if: >-
      A breakdown missing on the breach path means it is printed after the pre_sequence loop
      rather than inside _scaffold_budget_assertion, which sys.exit(1)s from within the loop.
    graduation: graduate
    graduation_check_id: "fast-tier-phase-breakdown-emitted-on-all-paths"
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the new Decision entry clears all three decision gates -- append-only immutability,
      entry-grammar conformance, and the per-entry size cap -- with a command that can actually
      fail.
    command: >-
      bin/venv-python -c "import sys; from scripts import validate; f=[];
      [validate._dispatch_check(n,f) for n in
      ('validate_live_entry_immutability','validate_decision_entry_conformance','validate_decisions_size')];
      print('DECISION_GATE_FAILURES:',f or 'none'); sys.exit(1 if f else 0)"
    expected: >-
      Exit 0 and 'DECISION_GATE_FAILURES: none'. Verified decidable at plan time: exits 0 clean,
      and an injected failure exits 1 (the prior pipe-to-grep form could never exit non-zero).
    fix_if: >-
      An immutability failure means the entry spliced an existing body -- rewrite as a pure
      append. A size failure means the body exceeds Decision 167 clause 3's 6,144 bytes --
      TRIM it; reversal condition (a) of that Decision forbids raising the cap to fit.
    graduation: graduate
    graduation_check_id: "decision-entry-gates-exit-zero"
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the drift rec actually reaches the preflight surface, so the Decision's named review
      trigger is real.
    command: >-
      bin/venv-python -m pytest tests/session/preflight/test_alerts.py -q
    expected: >-
      Tests pass showing a budget_drift rec produces a populated budget_drift alert key in the
      preflight report, and that a None cache degrades to None without a reader call.
    fix_if: >-
      A drift rec that surfaces nowhere makes the Decision's review trigger false -- the alarm
      would have no listener, which is precisely the Decision 163 failure mode this plan claims
      to avoid.
    graduation: graduate
    graduation_check_id: "preflight-surfaces-budget-drift-alert"
  - step: 8
    phase: pre-deploy
    action: >-
      Full-tier gate before handoff, and the end-to-end proof that the fast tier fits its budget
      with the breakdown visible.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0. The --pre leg reports elapsed comfortably under 300s with the phase breakdown
      printed (projection from measured data: CI's failing 378s run becomes ~235s, leaving 65s /
      22% headroom).
    fix_if: >-
      Still above 300s after the pin lands means a SECOND cost source exists beyond coverage
      tracing -- read the new breakdown, which now names it directly, and scope that separately
      rather than raising the budget.
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      AFTER the PR merges, close the open budget recs and confirm none remain. Post-merge by
      design: closing pre-merge would close 77 recs against a fix that might never land.
    command: >-
      bin/venv-python -m scripts.sync.ops pull && bin/venv-python -c "import json,pathlib;
      rows=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];
      n=[r for r in rows if r.get('source') in ('budget_breach','budget_bypass') and
      r.get('status')=='open']; print('STILL_OPEN',len(n)); import sys; sys.exit(1 if n else 0)"
    expected: >-
      STILL_OPEN 0 and exit 0, after the closure loop has run. Enumerate the ids to close from
      the live open_recs reader verb (never from the read cache, which is a projection); the
      command above re-syncs and then re-queries purely as the confirmation leg.
    fix_if: >-
      A non-zero STILL_OPEN means the closure loop missed rows -- re-enumerate from open_recs
      and re-run. Never edit logs/*.jsonl directly; closure goes through --update-rec only.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/_pytest_diff.py
    behavior: >-
      The coverage-traced invocation carries COVERAGE_CORE=sysmon and falls back LOUDLY, never
      silently, when PEP 669 is unavailable.
    verification_step: 2
    test_selector: tests/validate/test_pytest_diff_coverage.py::TestPrimaryInvocationCarriesCoverageFlags
    red_green_expectation: >-
      Red before (no env is passed to the invocation today, so the sysmon assertion fails),
      green after.
  - source: scripts/validate.py
    behavior: >-
      A non-forced run in [255s, 300s] warns, attributes the dominant phase and exits zero; a
      forced run never warns; a run above 300s still breaches; every path prints the breakdown.
    verification_step: 3
    test_selector: tests/validate/test_warn_band.py::TestHeadroomWarnBand
    red_green_expectation: >-
      Red before (no warn band exists; a 260s run is silent today), green after.
  - source: scripts/checks/_budget_recs.py
    behavior: >-
      The drift rec dedupes against budget_drift via a source-parameterized finder, costs at
      most one reader call, and never matches or mutates an open budget_breach rec.
    verification_step: 4
    test_selector: tests/validate/test_warn_band.py::TestDriftRecReaderBudget
    red_green_expectation: Red before (no drift filer exists), green after.
  - source: scripts/preflight/alerts.py
    behavior: A budget_drift rec surfaces as its own preflight alert key.
    verification_step: 7
    test_selector: tests/session/preflight/test_alerts.py::TestBudgetDriftAlert
    red_green_expectation: >-
      Red before (alerts.py filters only ci_rca / budget_bypass / budget_breach, so a drift rec
      surfaces nowhere), green after.
  - source: scripts/preflight/summary.py
    behavior: The budget_drift alert is rendered by a dedicated summary printer.
    verification_step: 7
    test_selector: tests/session/preflight/test_alerts.py::TestBudgetDriftAlert
    red_green_expectation: Red before, green after.
  - source: scripts/session/preflight.py
    behavior: >-
      The assembled preflight report carries a budget_drift_alert key populated from the drift
      check, so the alert reaches the operator rather than stopping at the derivation.
    verification_step: 7
    test_selector: tests/session/preflight/test_alerts.py::TestBudgetDriftAlert
    red_green_expectation: >-
      Red before (no such report key exists), green after.
constraints:
  - >-
    Do NOT raise _FAST_TIER_BUDGET_SECONDS. The tier fits 300s once the regression is repaid;
    raising it would ratify the drift. Decision 153 point 3 is explicit that the fast tier
    retains exactly ONE design budget.
  - >-
    Do NOT move the diff-coverage classifier to the full tier. Under sysmon it costs ~7s, and
    the pre-merge patch-coverage signal that #946 installed is worth that. (Acknowledged
    tension, deliberately not reopened here: the artifact is report-only and gates nothing, so
    "should it be on the pre-merge gate at all" is a fair question -- but it is #946's question,
    3 days old, and reversing it is out of scope for a regression repair.)
  - >-
    Do NOT make the local run advisory while CI stays hard. Considered and rejected during
    planning: CI breaches on the same diff (run 32857137736, 378s, FAILURE), so a local-only
    relaxation would hide the problem while the merge gate still blocks.
  - >-
    The warn band is an ALARM, not a gate. It must never exit non-zero and must never ratchet.
    Decision 163 forbids declared-but-ungated surfaces that carry the appearance of enforcement;
    the honest answer is to label it as an alarm AND give it a real listener (scripts/preflight/
    alerts.py, in scope) plus a graduated exits-zero check pinning the no-teeth property. An
    alarm no surface reads would be Decision 163's failure mode transposed, not avoided.
  - >-
    255s is DERIVED (int(300 * 0.85)), never independently negotiated. If the budget ever moves
    the band is re-derived from it. Same not-a-tier discipline Decision 153 point 3 applied to
    its 1500s forced-run ceiling; apply Decision 153 point 4's four properties explicitly in the
    new entry.
  - >-
    The budget assertion has FOUR outcomes today, not three: bypass, forced-waiver,
    forced-ceiling-breach, ordinary breach (scripts/validate.py:313-356). The warn band is a
    FIFTH, and it must be unreachable whenever full_suite_forced is true.
  - >-
    Phase timings are printed to stdout and the existing GITHUB_STEP_SUMMARY mirror ONLY. Do not
    create a machine-readable cross-run timing store: Decision 135 point 5 defers manifest
    registration to T2.36, triggered by the "first written cross-run query", and this plan
    deliberately does not arm that trigger. T2.36 is not actioned here.
  - >-
    Considered and rejected as the breakdown's home: selection-manifest.json's existing
    "timings" block (affected_tests.py:348,452). It is a shipped, never-read-back, CI-uploaded
    channel and would work -- but its grain is one record per affected-set DERIVATION, written
    before any phase runs, and appending post-hoc phase wall-clock to it would require a second
    write and conflate two grains. Also rejected: validation-result.json, whose v3 schema is
    pinned by Decision 170 / check-accounting.yaml and which --pre does not write at all.
  - >-
    Decision 128 / SLOC: tests/validate/test_budget.py is 403 SLOC and
    tests/validate/test_pytest_diff.py is 465, both against the unregistered-file 500 default.
    ALL new warn-band tests land in the new tests/validate/test_warn_band.py sibling -- never by
    growing test_budget.py toward the cap, and never by adding a budget-raise entry.
  - >-
    docs/DECISIONS.md is append-only and exact-line immutable in both tiers with no waiver route
    (Decision 177). Decision 153's body is NOT edited. Decision 167 clause 3's 6,144-byte
    per-entry cap is a HARD fail, and recent entries sit at 6122-6137 bytes -- budget the body
    accordingly and TRIM to fit; Decision 167 reversal condition (a) forbids raising the cap.
  - >-
    Re-check the highest '## Decision N:' header at implement time. 178 was next free at
    planning; a concurrent PR may claim it, and shifting to the next free number at execution
    time is safe and expected.
  - >-
    pr-validate installs its deps unconstrained (ci.yml:71-72, unlike main-validate's
    -c requirements.lock), and requirements-dev.txt pins pytest-cov>=4.1.0 with no coverage
    floor. Add coverage>=7.4 to requirements-dev.txt ONLY if the loud guard proves it necessary
    in CI; otherwise record it as an accepted residual in the PR body rather than widening scope.
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (130 of 130
    triaged). CITE: Decision 73, Decision 153, Decision 135, Decision 177, Decision 167,
    Decision 159, Decision 128, Decision 130, Decision 165, Decision 55, Decision 61, Decision
    84, Decision 170. RELATED: Decision 169, Decision 142, Decision 103, Decision 154, Decision
    100, Decision 48, Decision 131, Decision 88, Decision 163, Decision 151, Decision 62."
  - >-
    "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE then PROCEED after 2 round(s)"
  - >-
    ATTRIBUTION. preflight budget_breach_summary reports count=9, by_phase={"pytest_diff": 9}
    -- 9 of 9 recent breaches attribute to one phase. 77 budget recs are open (46 breach + 31
    bypass); 92 events total since 2026-07-04; bypass elapsed distribution (n=33) min 4.4,
    median 5.9, max 9.3 min.
  - >-
    ACUTE CAUSE. Commit 94c2f82e (#946, 2026-08-22, "report-only patch coverage classifier")
    attached --cov=src --cov=scripts to the primary pytest_diff invocation. Measured on a
    reconstructed real breaching affected set (35 modules / 693 tests): 60.1s with no coverage,
    210.3s with coverage under the default C tracer (+150.2s / +250%), 67.0s with
    COVERAGE_CORE=sysmon. Saving 143.3s -- roughly half the entire 300s budget.
  - >-
    THE ARTIFACT GATES NOTHING. Its sole consumer,
    scripts/checks/misc/validate_diff_coverage.py line 393, reads "del failed  # never appended
    to -- report-only by construction". The fast tier was paying half its budget for a report.
  - >-
    EQUIVALENCE PROOF (plan time, whole set). ctrace vs sysmon on the same selection:
    covered_lines 8208 = 8208, num_statements 35143 = 35143, missing_lines 26935 = 26935,
    percent 23.4 = 23.4, 416 files both, files with differing covered_lines = 0. No branch
    coverage is configured (pyproject [tool.coverage.run] sets source/omit only), which is
    exactly the condition under which the two cores agree. Environment: Python 3.12.3, coverage
    7.15.4 (sysmon requires >=7.4); COVERAGE_CORE is set nowhere in the repo today.
  - >-
    THIS BREACHES CI, NOT JUST LOCAL SESSIONS. Run 32857137736 on branch
    claude/executor-substrate-guard-deferral-liui1n, job pr-validate, step "Validate fast tier":
    17:17:56 -> 17:24:14 = 378s, conclusion FAILURE, log verbatim "ERROR: Fast tier exceeded
    budget (5 min). Elapsed: 6.3 min. Dominant phase: pytest_diff." Every content check PASSED.
    --ignore-budget is forbidden in CI by validate.py's own guard, so the PR was hard-blocked
    with no escape hatch. pr-validate installs requirements-fast.txt AND requirements-dev.txt,
    so pytest-cov and a sysmon-capable coverage are both present there.
  - >-
    THE DETECTION GAP (the structural defect). #946's own PR (run 32591487373) passed CI in
    about 4 minutes because its own affected set was small; the +150s only materialised later on
    larger diffs. validate.py computes phase_times for every pre_sequence step and then discards
    it, surfacing a single dominant_phase string only at the moment of failure. So a change can
    consume half the budget and nothing notices until the cliff -- where the only remedies are
    --ignore-budget locally or a blocked PR in CI. That is why bypass became routine rather than
    exceptional.
  - >-
    PHASE COUNT, CORRECTED AT CRITIQUE. registry.pre_sequence() returns 86 steps -- 80 checks
    plus 6 scaffolds (lint, precommit_changed, mypy_diff, pytest_diff, verifier_coverage_report,
    budget_assertion) -- and validate.py:388 records phase_times for EVERY one, so dominant_phase
    can resolve to a check name, not only a scaffold. An earlier draft of this plan wrongly said
    "six phases". budget_assertion is the LAST step, which is why the breakdown is printed from
    inside it: that is the one site reached on the pass, warn, forced and breach paths alike
    (the breach paths sys.exit(1) from lines 345/356, inside the loop).
  - >-
    NOT A "MANY SLOW CHECKS" PROBLEM. The entire check registry costs 40.1s measured (slowest
    single check: validate_platform_roadmap at 5.67s). The affected-set cap is a COUNT cap (35
    modules), not a time cap, so it bounds breadth but not cost. Affected-set derivation itself
    costs 4.5s.
  - >-
    WHY HEADROOM KEEPS BEING RE-CONSUMED. Test files grew 111 (2026-06-12) -> 136 -> 161 -> 372
    (2026-07-25) -> 540 (now). Two prior plans already reclaimed headroom on this same gate --
    PLAN-fast-tier-budget-overrun and PLAN-pre-validation-performance -- and it was re-consumed.
    This plan therefore pairs the repayment with the detection fix; repayment alone would be the
    third instance of the same treadmill.
  - >-
    PROJECTION. 378s (CI measured, failing) - 143.3s (measured saving) = 234.7s, leaving 65.3s
    / 22% headroom under the 300s budget. The warn band was originally drafted at 70% (210s) and
    corrected to 85% (255s) during planning because 210s would fire on nearly every post-fix run
    at ~235s, making it noise from day one.
  - >-
    THRESHOLD RESOLUTION ON THE DECISION 163 FLAG. Three options were put to the operator: (A)
    alarm-not-gate, explicitly declared; (B) shrink-only wall-clock ratchet with real teeth; (C)
    telemetry only. The operator chose A. Rationale: a wall-clock ratchet on a shared 4-vCPU
    runner flaps, and a flappy gate gets bypassed -- recreating this very problem in a new form.
    Critique sharpened this correctly: option A is only a legitimate answer to 163 if the alarm
    has a LISTENER, which is why scripts/preflight/alerts.py and summary.py are now in scope and
    verification step 7 exists.
  - >-
    ALARM-NOT-GATE PRIOR ART. Decision 62's 2026-06-16 amendment coins the term (CD.12), and
    Decision 159 applies it to a threshold trigger inside its parent entry without minting a
    number. The new entry must cite both and explain why this case differs (a standing band
    inside a ratified enforcement gate plus a new rec stream and a new preflight surface, versus
    a threshold note scoped to one parent Decision).
  - >-
    SIGNIFICANCE ROUTING, REDONE AT CRITIQUE. The first draft's justification was transposed
    near-verbatim from Decision 177 and named decision-entry.yaml as the rejected contract home
    -- which governs decision ENTRIES and is not a plausible home for a fast-tier wall-clock
    band. The real competing home is docs/contracts/check-accounting.yaml, where Decision 170
    already houses validation-check semantics; it is rejected because it documents what checks
    RECORD, not whether a ratified enforcement gate gains a standing third elapsed band with its
    own rec stream. Property test 3 (rec-3016) must also be performed explicitly: Decision
    167/177 keep an amendment_forms dated append to Decision 153 legal, and the entry must state
    why that shape is insufficient here (it carries a new forward commitment, not a correction,
    which Decision 151 clause 3(iii) withholds from an agent absent operator direction).
  - >-
    OPEN RECS DISPOSITION. The 77 open budget recs are auto-filed telemetry duplicating one
    condition, not 77 distinct findings. They are deliberately NOT in bundled_recommendations (a
    77-id Resolves: trailer is unworkable and would misrepresent them as individually-scoped
    work). Closure moved POST-MERGE at critique: verification step 9 is phase post-deploy, so
    recs are never closed against a fix that has not landed.
  - >-
    SOFT-WARN EXCEPTION, no tier_item claimed. Preflight at planning time: venv ok, creds ok,
    branch claude/pre-budget-breaches-ezuf3v, ci_rca_unresolved_recs empty (no hard block),
    uncommitted_changes false, ops_outbox empty. origin/main has since advanced (#963,
    PLAN-coverage-sidefile-gitignore -- a plan document only, no scope overlap); re-run preflight
    at implement time and rebase before pushing.
  - >-
    non_automatable_softcap_breached is true (992 of 1140 open recs). Surfaced as planning
    context only; per Decision 73 individual review is suspended until CD.17 / T4.2 reverses.
    data_quality.last_run is null -- DQ has no baseline; non-blocking and unrelated to this
    plan's scope (no data pipeline or table schema is touched).
