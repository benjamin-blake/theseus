  test_selector: tests/test_ci_rca_fetch_logs.py::TestRunLogTailOverlap
  waiver_reason: Registry metadata only; the selector it names is the evidence, and the registry checks validate the row shape.
constraints:
- Envelope schema stays ci-rca-log-evidence/v2 -- no new envelope key, no validator change in log_evidence.py, no change to
  evidence_input.py or the evidence bundle.
- No "external cause / no rec" CI-RCA outcome (operator ruling 2026-10-30).
- The bounded transport strings _check_ci_rca_fetch_classification pins stay verbatim; no workflow edit.
- No complexity waiver, SLOC or structural-size budget raise (Decisions 43, 128, 166) -- decompose instead.
- Contract wording is operator-approved text; a change to it needs a plan amendment (always-ask, governing contract text).
- No rescue agents or workaround loops (Decision 55); out-of-scope defects become recs via scripts/ops_data_portal.
context:
