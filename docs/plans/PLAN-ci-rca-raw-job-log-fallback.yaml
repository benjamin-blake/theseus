execution_steps:
- scripts/ci_rca/fetch_logs.py -- implement scope row (1)-(5). Keep `_run_log(primary_command, max_bytes, max_lines)`,
  `_run_log(command, remaining, remaining_lines)` and the remaining/remaining_lines lines verbatim (GAL-01). Keep the name
  primary_tail, and say in _run_log's docstring that the tail is trimmed so head plus tail never duplicates bytes (rec-3002's
  acceptance greps for both, Decision 201). Compute the trim with max(), not a new branch. Update the
  comment above reliable_window -- fallback windows now carry per-job tails, and fallback truncation still reports unknown counts.
- tests/test_ci_rca_fetch_logs.py -- add TestUnfinalizedStepMetadata (cases for acceptance_criteria[0]-[3]; the oversized case
  drives the real _run_log through a patched subprocess.Popen as test_end_to_end_oversized_log_retains_tail_anchor_in_published_envelope
  does) and TestRunLogTailOverlap (acceptance_criteria[4]); adjust only the fixtures and two pins named in scope. The
  no-failed-step shape those fixtures used to carry is asserted by TestUnfinalizedStepMetadata (Decision 181). The file is
  348 SLOC today; keep it at or under 500 (Decision 130, VP step 5).
- |-
  docs/contracts/ci-rca-lifecycle.yaml -- apply exactly (operator-approved text):
  (a) In evidence_scope.conclusion_domain replace `null covers a
      not-started step, routine in a cancelled job (_failed_jobs explicitly selects cancelled jobs).` with
      `null covers a step with no conclusion: not started (routine in a cancelled job, which _failed_jobs selects)
      or unfinalized by GitHub (gh emits "", fetch_logs records null).`
  (b) In evidence_scope.log_retrieved_derivation replace `retrieval_path="fallback" (gh run view --job <id> --log, which returns a queried job's WHOLE
      log):` with `retrieval_path="fallback" (a queried job's WHOLE log: gh run view --job <id> --log, or the raw
      job log, gh api repos/<repo>/actions/jobs/<id>/logs, for a job with no failed step or a null
      conclusion, whose unfinalized step the step-split log drops; such a job routes the whole run
      here):`
  (c) Insert as the first amendment_log row, one line:
      {date: "2026-10-30", semantic_break: false, change_class: governance_note_add, summary: "PLAN-ci-rca-raw-job-log-fallback (rec-4776): conclusion_domain's null also covers a step GitHub left unfinalized (gh's empty string is recorded as null); log_retrieved_derivation names the raw job log the fallback reads for a job with no failed step or a null conclusion."}
- Create the two verification-registry rows (check_id, primitive_slot test_selector, guard_target scripts/ci_rca/fetch_logs.py,
  guard_symbol fetch_run_log / _run_log, plan_slug ci-rca-raw-job-log-fallback, node_id the VP step 1 / 2 selector).
- Execute Verification Plan -- run each pre-deploy step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
- Commit with the trailer line Resolves rec-4776, rec-3002 (colon after Resolves) in the squash body; after merge run VP step 8.
- 'Report: what was implemented, verification results'
work_areas: []
rollback: Revert the squash commit; CI-RCA returns to today's routing (an unfinalized job is refused again).
