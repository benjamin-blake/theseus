  later finalized the metadata (step 9 of job 124209654871 now reads completed/failure), so the state is a transient lag that
  cannot be reproduced on demand; the tests carry the recorded shape."
- "Measured 2026-10-30 on job 124209654871: the raw job log is 6,798,475 B / 41,827 lines; bound_text_windowed at the default
  256 KB / 4000-line cap keeps the 'short test summary', the FAILED line, 'Failed checks:' and the ##[error] line in its tail."
- "gh api follows the 302 to the log blob (inferred: gh run view --log downloads the same blob store through the same client;
