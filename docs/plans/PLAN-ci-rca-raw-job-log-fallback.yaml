schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-raw-job-log-fallback
intent: >-
  Make CI-RCA diagnose a red main even when GitHub has not finished recording a failed job's steps: read that job's raw
  log through the existing bounded head+tail window instead of refusing (invalid evidence scope) or publishing a
  "complete" envelope that silently omits the failing step (rec-4776). Bundles rec-3002 (the head+tail join duplicates
  bytes), since this plan reuses that join on the fallback path.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-raw-job-log-fallback.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). ci_rca forward fix
  for rec-4776 (High) and rec-3002 (Medium).
scope:
- file: scripts/ci_rca/fetch_logs.py
  action: Modify
  purpose: >-
    (1) _step_scope records a step conclusion of "" as null. (2) New helper _unfinalized_job_ids: a failed job is unfinalized
    when no step has a failure/timed_out/cancelled conclusion or any step's conclusion is "" or null. (3) fetch_run_log skips
    the --log-failed primary when any failed job is unfinalized and goes straight to the per-job fallback. (4) _fallback_logs
    fetches an unfinalized job with `gh api repos/<repo>/actions/jobs/<id>/logs` (raw job log) and a finalized job with the
    unchanged `gh run view --job <id> --log`, and keeps each job's transport tail (per-job bound_text_windowed over
    stdout + tail within that job's remaining budget) instead of the head alone. (5) rec-3002: _run_log trims the overlap
    between its head buffer and its rolling tail buffer, so head + tail never repeats bytes. Envelope stays
    ci-rca-log-evidence/v2; retrieval_path stays "fallback". 354 -> ~395 SLOC (500 limit).
- file: tests/test_ci_rca_fetch_logs.py
  action: Modify
  purpose: >-
    New class TestUnfinalizedStepMetadata (rec-4776's acceptance selector) and TestRunLogTailOverlap (rec-3002). The four
    existing fallback tests whose fixture jobs carry no failed step (steps [] or all-success) gain one failed step so they
    keep exercising the step-split path they were written for; their assertions do not change. The two
    TestStreamingTransport assertions that pin the old overlapping tail ("bcde", "one\ntwo\nthree") change to the
    trimmed tail ("e", "three") -- planned-change, acceptance_criteria[4].
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    evidence_scope.conclusion_domain and evidence_scope.log_retrieved_derivation gain the operator-approved wording in
    execution_steps[2]; one amendment_log row. 495 -> 499 effective lines against the 500 contracts limit (Decision 166).
- file: config/agent/verification_registry/entries/ci-rca-unfinalized-step-raw-log.yaml
  action: Create
  purpose: Registry row graduating VP step 1 (test_selector slot), check_id ci-rca-unfinalized-step-raw-log.
- file: config/agent/verification_registry/entries/ci-rca-run-log-tail-no-overlap.yaml
  action: Create
  purpose: Registry row graduating VP step 2 (test_selector slot), check_id ci-rca-run-log-tail-no-overlap.
bundled_recommendations:
- rec-4776
- rec-3002
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- A failed job whose steps carry conclusion "" (the run 41098287859 shape) publishes a valid envelope; its scope records
  those steps as null; no --log-failed call is made; the job's log comes from `gh api repos/<repo>/actions/jobs/<id>/logs`.
- A run mixing a finalized failed job and an unfinalized one queries both in the fallback, the finalized one through the
  unchanged step-split command, and publishes a valid envelope with log_retrieved true for every step of both.
- An oversized raw job log, streamed through the real _run_log transport, publishes an envelope whose body keeps the
  log's tail anchor ("Failed checks:") with complete=false; a raw log that fits publishes complete=true with the whole log.
- A raw-log fetch that fails or returns nothing fails the attempt (no envelope written, existing retry and refusal
  annotation), never a complete=true envelope.
- rec-3002, a planned change to _run_log's tail -- when the stream fits within head plus the tail buffer, stdout + tail equals
  the stream exactly; when it does not, tail is the last max_bytes bytes, unchanged.
- Runs whose failed jobs all carry a failed step and no ""/null step keep today's routing (primary first, step-split
  fallback) -- every existing test in the file passes, with only the fixture and pin changes named in scope.
- The ci-rca-lifecycle contract carries the approved wording and stays at or under 500 effective lines.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Unfinalized-metadata routing, normalisation, raw transport, mixed jobs and fail-loud (rec-4776 acceptance).
  command: bin/venv-python -m pytest tests/test_ci_rca_fetch_logs.py::TestUnfinalizedStepMetadata -q
  expected: exit 0, every case passes. Before the change the class does not exist (pytest exits 4).
  expected_literals:
  - passed
  fix_if: A case fails -- fix fetch_logs.py, never the case. If the envelope is refused, the "" normalisation is missing; if a
    --log-failed call appears, the routing check runs too late.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-unfinalized-step-raw-log
- step: 2
  phase: pre-deploy
  action: _run_log head/tail overlap trimmed (rec-3002).
  command: bin/venv-python -m pytest tests/test_ci_rca_fetch_logs.py::TestRunLogTailOverlap -q
  expected: exit 0. Before the change the class does not exist.
  expected_literals:
  - passed
  fix_if: stdout + tail repeats bytes, or a gap case lost its last max_bytes -- fix the overlap arithmetic in _run_log.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-run-log-tail-no-overlap
- step: 3
  phase: pre-deploy
  action: Whole fetch_logs, log_evidence and evidence-input suites plus the GAL-01 workflow guard tests stay green.
  command: bin/venv-python -m pytest tests/test_ci_rca_fetch_logs.py tests/test_ci_rca_log_evidence.py tests/test_ci_rca_evidence_input.py
    tests/verify_ci_workflow/test_ci_rca_and_canary.py -q
  expected: exit 0.
  fix_if: An existing case fails -- if it is one of the fixtures named in scope, give its job a failed step; otherwise the
    routing changed a finalized run, which acceptance_criteria[5] forbids. Never edit another existing assertion.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: GAL-01 bounded-retrieval guard still holds on the new source.
  command: bin/venv-python -c "from scripts.verify_ci_workflow._ci_rca import _check_ci_rca_fetch_classification as c; c(); print('GAL_OK')"
  expected: Prints GAL_OK.
  expected_literals: []
  fix_if: An AssertionError names a missing invariant string -- keep the bounded _run_log calls verbatim (the raw command is
    assigned to `command`, not a new call shape).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_ci_workflow_guards check, which already runs this function on every
    tier.
- step: 5
  phase: pre-deploy
  action: Complexity and size stay inside their limits without a waiver or budget raise.
  command: bin/venv-python -c "import ast; from scripts.checks.sloc._shared import _BRANCH_TYPES, _CC_LIMIT; from scripts.checks.structural._classify
    import effective_lines; s=open('scripts/ci_rca/fetch_logs.py').read(); t=ast.parse(s); cc={n.name:sum(isinstance(x,_BRANCH_TYPES)
    for x in ast.walk(n)) for n in ast.walk(t) if isinstance(n,ast.FunctionDef)}; bad={k:v for k,v in cc.items() if v>_CC_LIMIT};
    f=lambda x:len([l for l in x.splitlines() if l.strip() and not l.strip().startswith('#')]); sl=max(f(s), f(open('tests/test_ci_rca_fetch_logs.py').read())); e=effective_lines(open('docs/contracts/ci-rca-lifecycle.yaml').read());
    assert not bad and sl<=500 and e<=500 and 'complexity-waiver' not in s, (bad, sl, e); print('LIMITS_OK', max(cc.values()), sl, e)"
  expected: Prints LIMITS_OK with the largest function's branch count (at most 20), the file's SLOC (at most 500) and the
    contract's effective lines (at most 500); the SLOC figure is the larger of fetch_logs.py and its test file.
  expected_literals: []
  fix_if: fetch_run_log crosses 20 branches -- extract the primary/fallback selection into a helper (do not add a waiver); the
    contract crosses 500 -- tighten the approved wording only through a plan amendment.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_cc_limits, validate_sloc_limits and structural-size checks, which
    gate every file on every tier.
- step: 6
  phase: pre-deploy
  action: Approved contract wording landed verbatim.
  command: bin/venv-python -c "import yaml; p=yaml.safe_load(open('docs/plans/PLAN-ci-rca-raw-job-log-fallback.yaml')); c=yaml.safe_load(open('docs/contracts/ci-rca-lifecycle.yaml'));
    s=c['evidence_scope']; a=' '.join([s['conclusion_domain'], s['log_retrieved_derivation']]); need=['unfinalized by GitHub',
    'gh api repos/<repo>/actions/jobs/<id>/logs', 'routes the whole run here']; miss=[n for n in need if n not in a]; row=c['amendment_log'][0];
    assert not miss and 'rec-4776' in row['summary'], miss; print('CONTRACT_OK')"
  expected: Prints CONTRACT_OK.
  expected_literals: []
  fix_if: A phrase is missing -- copy the wording again from execution_steps[2]; never reword it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Bound to this plan's approved wording; the contract carries no executable rule for it to guard.
- step: 7
  phase: pre-deploy
  action: Live check that the raw job-log endpoint serves the failing step and the window keeps it (Decision 48), on the
    incident job 124209654871 while GitHub retains its logs.
  command: bin/venv-python -c "import subprocess; from scripts.ci_rca.log_evidence import bound_text_windowed, DEFAULT_MAX_BYTES,
    DEFAULT_MAX_LINES; t=subprocess.run(['curl','-sSL','https://api.github.com/repos/otl-labs/ontheloop/actions/jobs/124209654871/logs'],
    capture_output=True, text=True, encoding='utf-8', errors='replace').stdout; b,l=bound_text_windowed(t, DEFAULT_MAX_BYTES,
    DEFAULT_MAX_LINES); tail=b.split('[elided]')[-1]; assert 'Failed checks:' in tail and 'test_historical_plans_all_validate' in tail,
    len(t); print('RAW_WINDOW_OK', len(t))"
  expected: Prints RAW_WINDOW_OK and the log size (6,798,475 B when measured on 2026-10-30). If GitHub has expired the log
    (an empty or error body), record that in the build report instead; the hermetic steps stand.
  fix_if: The log is present but the tail lacks the failure lines -- stop and report; the window design does not hold for this
    log shape, which is a plan amendment, not an inline fix.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: Both bundled recs closed by the merge's Resolves trailer.
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
    rows, missing = fetch_recs_by_ids(make_reader(), ['rec-4776','rec-3002']); print([(r['id'], r['status']) for r in rows], missing)"
  expected: Both recs show a closed status and none are missing.
  fix_if: A rec is still open -- check the squash commit carries the Resolves trailer naming both recs and the trailer-closure job's
    acceptance verdict; never close by hand without the operator.
  hermetic: false
test_obligations:
- source: scripts/ci_rca/fetch_logs.py
  behavior: An unfinalized failed job routes to the raw job log through the bounded window; "" is recorded as null; a failed
    raw fetch fails loud; finalized runs keep today's routing.
  verification_step: 1
  test_selector: tests/test_ci_rca_fetch_logs.py::TestUnfinalizedStepMetadata
  red_green_expectation: red before (class absent; the incident shape is refused with "invalid evidence scope step entry"),
    green after.
- source: scripts/ci_rca/fetch_logs.py
  behavior: _run_log's head plus tail never repeats bytes (rec-3002).
  verification_step: 2
  test_selector: tests/test_ci_rca_fetch_logs.py::TestRunLogTailOverlap
  red_green_expectation: red before (class absent; today's tail overlaps the head), green after.
- source: docs/contracts/ci-rca-lifecycle.yaml
  behavior: Approved evidence-scope wording present and the amendment row added.
  verification_step: 6
  command: docs/contracts/ci-rca-lifecycle.yaml
  waiver_reason: Prose contract text with no executable rule; VP step 6 checks the approved wording and VP step 5 the size.
- source: config/agent/verification_registry/entries/ci-rca-unfinalized-step-raw-log.yaml
