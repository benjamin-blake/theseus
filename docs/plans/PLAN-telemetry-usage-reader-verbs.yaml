    fix_if: Fix scripts/telemetry_usage.py or the registry entries; never the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file run of a test file this plan creates, always inside the --pre affected-test selection; step 2 graduates the registration node.
  - step: 2
