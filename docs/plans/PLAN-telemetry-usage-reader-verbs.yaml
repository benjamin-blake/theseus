constraints:
  - No caller SQL; every value is a bound parameter (Decision 84 I-3). The verbs compose the shared dedupe; no rule is restated.
  - Per-tree and per-session rows only; no cross-tree aggregation in SQL (Decision 199 cl.1 and its 2026-10-16 note; telemetry_sessions.yaml WINDOW VERBS). Cross-thread sums live in the CLI.
  - No transcript content, no content_uri, no dollar figure (Decision 236 cl.3; Decision 101 2026-10-17 note). Token classes are never summed into one total in a verb row.
  - No `surface` column or vocabulary. telemetry_sessions.surface is declared read-derived by PLAN-telemetry-top-level-agent-run and its verb is rec-4713; these verbs carry branch, is_root, agent_name and workflow instead.
  - No Class A contract, Decision, capture, producer, table, IAM or Terraform change. No budget raise (Decision 128).
  - PlatformDev only (--profile agent_platform / resolve_aws_profile); never the ADMIN profile. No break-glass deploy (Decisions 125/126).
  - No rescue agents or workaround loops (Decision 55).
