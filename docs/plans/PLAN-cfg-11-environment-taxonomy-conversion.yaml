schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "cfg-11-environment-taxonomy-conversion"
intent: >-
  Close audit finding CFG-11 by converting docs/contracts/environment-taxonomy.md into a
  declared-subject Class D contract, so the platform's most operationally dangerous contract is
  governed by the same population, evaluator and size gates as every other contract rather than
  sitting outside all of them.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-cfg-11-environment-taxonomy-conversion.yaml
phase: >-
  T2.56 (Normative / contract / ADR layering) -- the CFG-11 residual of migration step 3 of
  audits/contract-first-governance-33c8667.yaml. Closes NO T2.56 exit criterion (c1/c2 both remain
  open), matching the precedent set by PLAN-contracts-first-class-migration and
  PLAN-migration-step-3-grandfathering; this plan declares no closes_criteria.
scope:
  - file: docs/contracts/environment-taxonomy.yaml
    action: Create
    purpose: >-
      The converted Class D contract. contract.class D, a NON-active status, a unique subject, and
      evaluator {check: validate_environment_taxonomy}. Transcribes the .md's Axis A platform
      table, guard-classification table, Axis B phase table, vocabulary-reservation table, and
      sections 1/4/5/6/7. Section 5's conformance status becomes a TYPED field
      (conformance.ducklake_class / conformance.prod_class, values DECOUPLED|COUPLED). Measured
      source: 193 effective lines / 412-char longest line; projected landing 250-330 effective
      lines against the contracts class's 500 limit (benchmarks: contract-population.yaml 215,
      decision-entry.yaml 458). Note _classify.effective_lines excludes any line whose first
      non-whitespace character is '#', so transcribed headings inside block scalars do not count.
  - file: docs/contracts/environment-taxonomy.md
    action: Delete
    purpose: Superseded one-way by the .yaml above; removal is what closes CFG-11's coverage hole.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      shape_grammar.extension_and_depth asserts as live fact that BOTH delegate-cli.md and
      environment-taxonomy.md are baseline-present grandfathered members and that the file-router
      prose_allowlist is "narrowed to those two by name". This conversion falsifies that clause
      inside the gate contract governing the act. Correct it to name delegate-cli.md only, and add
      the amendment_log[] entry its own change_detection.amendment_log rule requires.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Remove the now-stale prose_allowlist.allowed_globs entry "docs/contracts/environment-taxonomy.md".
      This narrows allowed_globs (permitted; the ratchet-only rule binds grandfathered_globs).
      AMENDMENT-LOG REQUIRED: this file is itself Class D (status active), and removing a list
      element changes its parsed dict, so validate_contract_drift's check_amendment_log_for_class_d
      fails without a new amendment_log[] entry. No routes: entry names either .md contract, so no
      route breaks. DELIBERATE CALL: the new .yaml
      is NOT given a routes: entry either. check_topic_equals_subject binds only routed files and
      validate_placement is a dead-target check, not a registration-completeness check, so adding a
      route would import a topic==subject obligation for no discovery gain this plan needs. If a
      route is added later, its topic MUST equal the contract's subject.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      NOT merely a citation sweep. THREE graduated checks execute against this contract and must be
      repointed or re-expressed: (1) environment-taxonomy-stale-lambda-note-removed (grep_count,
      check_spec.path, pattern "No such Lambda exists today", eq 0); (2)
      environment-taxonomy-records-infra-error (grep_count, check_spec.path, pattern "infra_error",
      gte 1); (3) env-taxonomy-section6-lockfile-committed (command_exit_zero) whose body extracts
      markdown section 6 via `awk '/^## 6\./{f=1} /^## 7\./{f=0} f'` -- a COLUMN-0 markdown heading
      match that cannot match YAML, where the section becomes a key or an indented block scalar.
      A path swap does NOT save entry (3): re-express it against the YAML structure, or retire it
      with a recorded reason. Entries (1) and (2) need their pattern preserved by the transcription
      as well as their path repointed -- confirm the target strings survive into the .yaml.
  - file: scripts/checks/iam_tf/validate_environment_taxonomy.py
    action: Modify
    purpose: >-
      Repoint the allowlist path and messages to the .yaml. This check is also the declared
      evaluator: the path-shaped literal "docs/contracts/environment-taxonomy.yaml" resolves under
      contract-population.yaml's evaluator_kinds.check grammar (whitespace-free, final segment
      equals the basename).
  - file: scripts/checks/ops_governance/validate_deploy_channel_conformance.py
    action: Modify
    purpose: >-
      Rewrite _taxonomy_state from prose-paragraph regex parsing (a re.search for a
      "**Conformance status" paragraph, then whole-word DECOUPLED/COUPLED matching with a guard
      against COUPLED matching inside DECOUPLED) into a structured read of the new typed
      conformance field. Retire _DUCKLAKE_TAXONOMY_MARKER / _PROD_TAXONOMY_MARKER. Preserve both
      class legs (ducklake and prod) and the ambiguous/missing-value failure branches -- the
      MISSING-KEY branch especially, since a typed read that defaults on a missing key is the exact
      silent-pass shape this rewrite must not introduce.
  - file: tests/checks/iam_tf/test_validate_environment_taxonomy.py
    action: Modify
    purpose: >-
      ADD a case asserting the .yaml contract is allowlisted (skipped by the lint). The module
      currently contains NO reference to the contract path at all -- test_allowlisted_file_skipped
      uses docs/DECISIONS.md -- so there is nothing to "re-ground"; without a new case this
      module's result is identical before and after the change.
  - file: tests/checks/ops_governance/test_validate_deploy_channel_conformance.py
    action: Modify
    purpose: >-
      Replace prose-paragraph fixtures (the module builds a fake taxonomy doc with a
      "**Conformance status:**" paragraph and a {ducklake_marker} placeholder) with typed-field
      fixtures. The module today covers matching / stale-channel-class / stale-marker / no-functions
      / partial plus the prod mirrors -- it has NO ambiguous-value case and NO missing-marker case.
      All three of ambiguous-value, missing-marker and missing-key must therefore be ADDED, not
      merely kept, for BOTH classes.
  - file: tests/checks/contracts/validate_contract_drift/test_extension_depth.py
    action: Modify
    purpose: >-
      test_two_baseline_md_members_pass_as_grandfathered encodes a two-member fiction after this
      change. Re-ground it to the single remaining baseline .md member (delegate-cli.md).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      TWO obligations. (A) T-1.19 upgrade: (i) convert exit_criteria from bare strings to the
      id/text/status ledger shape, per Decision 136 and at the human's explicit direction. Accuracy
      note: this is VOLUNTARY, not forced by CI -- validate_platform_roadmap check (ii) derives
      touched_ids from `^[+-]\s+- id: (\S+)` and matches them against TIER_ITEM ids, so the `- id:
      c1` lines this conversion emits capture `c1`, which matches no tier_item, and a
      note-or-files_in_scope-only edit emits no `- id:` line at all. Do not justify the upgrade by
      that check; (ii)
      re-ground the stale files_in_scope path docs/REPORT-delegate-cli-consumer-identification.md
      (a docs/-root path the RS-03 docs_root_allowlist no longer admits) to docs/plans/reports/;
      (iii) record the CFG-11 dedup correction on the item note; (iv) record delegate-cli.md's
      remaining census and size invisibility, and that conversion closes both for free, as an
      explicit conscious-deferral act; (v) note that T-1.19 has never ruled convert-vs-RETIRE for
      delegate-cli.md. T-1.19 STAYS deferred_post_mvp; nothing depends on it, so Decision 93's
      no-live-dep invariant holds. (B) CITATION SWEEP: this file carries 8 environment-taxonomy.md
      citations, several inside completed tier_items' historical progress_notes. They ARE swept
      (the roadmap is a live, continuously-edited governed surface -- it is NOT in the
      workflow_outputs write-once class, which covers docs/plans/ and audits/ only), so VP step 5
      deliberately does not exclude it.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decisions 77 and 125 do not merely cite the .md -- they DESIGNATE it canonical SoT by name.
      Append a dated, source-cited annotation to those TWO entries only, using
      docs/contracts/decision-entry.yaml's amendment_forms (general_rule / blockquote_update); the
      live precedent is Decision 118's own appended "> **Amended by Decision 168 (2026-08-10):**"
      trailer. Do NOT edit any H2 heading, including Decision 125's parenthetical (Decision 149,
      never-remove-headers). Every other historical citation is left stale-by-design.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate after the two annotations so validate_decisions_index_freshness stays green.
  - file: scripts/terraform_apply_guard.py
    action: Modify
    purpose: Comment-only citation update (line 134).
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Citation sweep (2 path-form references, line 36) AND the stale "four DuckLake Lambdas" fact.
      BUDGET-CRITICAL: AGENTS.md sits inside the S1 root ambient load-set, whose prose budget has
      only 18 BYTES of headroom (33,183 current vs 33,201 pinned in config/prose_budgets.yaml).
      Two ".md" -> ".yaml" swaps cost +4 bytes; "four" -> "five" is byte-neutral. Any additional
