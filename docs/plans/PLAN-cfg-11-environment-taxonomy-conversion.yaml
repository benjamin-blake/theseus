    action: Modify
    purpose: >-
      Citation sweep (2 path-form references, incl. one "section 5" cross-reference at line ~245).
      S4-budgeted at 55,816 bytes with the file at 55,810 -- 6 bytes of headroom; keep the edit
      byte-neutral-or-smaller or reseed the budget DOWN, never up.
  - file: .github/actions/write-convergence-record/action.yml
    action: Modify
