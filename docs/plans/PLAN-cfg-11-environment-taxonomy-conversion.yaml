bundled_recommendations:
  - rec-2751
infrastructure_dependencies:
  - >-
    terraform/personal/*.tf and backend-sandbox.hcl are in scope for COMMENT-ONLY citation edits
    (verified: all six citation lines begin with '#', as does scripts/terraform_apply_guard.py:134).
    No resource, IAM, trust or destroy diff is introduced, so the deterministic guard classifies
    the change as a no-op and it does not route to the tf-gated-apply Environment. Because the PR
    touches terraform/**, it still enters the speculative-plan pipeline (PR-time plan reviewed and
    saved, re-applied at merge with no re-plan, Decision 77 no-TOCTOU). The full pipeline mechanics
    are owned by the contract this plan converts -- after conversion, cite
    docs/contracts/environment-taxonomy.yaml, never the deleted .md.
  - >-
    These rows are deliberately NOT split into a separate PR: any terraform/** touch enters the
    speculative-plan pipeline regardless, so splitting runs the pipeline twice and strands
    terraform/ comments citing a deleted file between merges -- contradicting this plan's own
    atomicity rationale.
  - >-
    Per Decision 119 and terraform/CLAUDE.md, CC-web cannot fetch provider checksums: NEVER author
    a local terraform init/validate/plan command. terraform is not even installed in this
    environment. The authoritative verifiers are CI's required terraform-validate check (which
    already runs `fmt -check` across both roots at ci.yml:168) and the speculative-plan job.
acceptance_criteria:
  - >-
    docs/contracts/environment-taxonomy.yaml exists as a valid Class D contract with a unique
    subject and an evaluator that genuinely RESOLVES by evidence-of-reading, and
    docs/contracts/environment-taxonomy.md no longer exists.
  - >-
    validate_contract_drift passes against the real tree with the converted file counted in the
    `declared` bucket (5 -> 6), `grandfathered` unchanged at 19, `status_active` unchanged at 16,
    and skipped == 0 -- so no ratchet pin needs to move and no raise marker is introduced.
  - >-
    validate_deploy_channel_conformance determines conformance from the typed conformance field,
    not from prose-paragraph regex matching, and still fails on a doc/terraform disagreement for
    BOTH the ducklake class and the prod class, including when the typed key is MISSING.
  - >-
    Every reference to the old contract REACHES ITS TARGET, not merely avoids the old filename: no
    live surface cites docs/contracts/environment-taxonomy.md, AND no surviving reference points at
    a markdown anchor (#slug) or a numbered markdown section that no longer exists -- each has been
    re-expressed against a real YAML key path. Historical citations in docs/DECISIONS.md and
    docs/decisions-index.json are deliberately retained, and Decisions 77 and 125 each carry a
    dated append-only annotation recording the new path.
  - >-
    All three graduated verification-registry checks that execute against this contract still
    execute and still assert their intended property -- verified by RUNNING them, not by grepping
    their paths.
  - >-
    The converted contract is within the contracts structural-size class (500 effective lines,
    2000-char lines) with NO entry added to config/structural_size_budgets.yaml budgets: or
    long_line_budgets:, and no `# raise-approved` marker anywhere in this change.
  - >-
    T-1.19 carries id/text/status exit criteria, a files_in_scope path under docs/plans/reports/,
    and a note recording the CFG-11 dedup correction, delegate-cli.md's residual, and the
    unmade convert-vs-retire ruling -- while remaining status deferred_post_mvp.
  - >-
    The terraform/** diff (against the merge base) contains no added or removed non-comment line.
  - >-
    validate_prose_limits stays green across ALL six byte-pinned in-scope surfaces: the S1
    aggregate (AGENTS.md) at or under 33,201; .claude/skills/planning/SKILL.md at or under 55,816;
    src/lambdas/CLAUDE.md at or under 1,313; terraform/github/CLAUDE.md at or under 5,266;
    src/data/handlers/CLAUDE.md at or under 4,307; terraform/CLAUDE.md at or under 30,497 -- with
    no prose budget raised, and any budget the edit leaves slack in reseeded DOWN.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the contract drift gate against the real tree; it must pass with the converted file
      present and the .md gone.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import
      validate_contract_drift; f=[]; validate_contract_drift(f); print('FAILURES:', f); assert not
      f, f"
    expected: "Exit 0, FAILURES: []"
    fix_if: >-
      A (shape) failure means the contract: block is malformed. A (grandfather) failure means the
      new file declared status: active or evaluator.none_grandfathered -- both are closed at birth
      for a NEW file. A (subject) failure means the subject collides with an existing Class D
      subject or ritual contract id. An (amendment) failure -- "parsed content changed but no new
      amendment_log[] entry was added" -- is EXPECTED on FOUR files unless each got an entry:
      contract-population.yaml, file-router.yaml, build-lambda.yaml and deploy-paths.yaml are all
      Class D, and every one of them takes a parsed-value edit in this change.
    graduation: waive
    graduation_waiver_reason: >-
      Not admissible as a graduated check: validate_contract_drift already PASSES on origin/main
      today (verified live, FAILURES: []), so run_differential's revert leg would return "not
      admitted -- revert did not produce FAIL (tautological)". The property is also already a
      registered, sequenced check in both tiers; graduating a row that re-runs the whole gate would
      duplicate it. Step 2 carries the differential signal instead.
    hermetic: true
  - step: 2
    phase: pre-deploy
    action: >-
      Assert the census buckets moved exactly as predicted -- this is what proves no ratchet pin
      needs to move and that no raise marker is required anywhere in this change.
    command: >-
      bin/venv-python -c "import io, contextlib, sys; from
      scripts.checks.contracts.validate_contract_drift import validate_contract_drift; buf =
      io.StringIO(); failed = []; ctx = contextlib.redirect_stdout(buf); ctx.__enter__();
      validate_contract_drift(failed); ctx.__exit__(None, None, None); out = buf.getvalue();
      sys.stdout.write(out); line = next(l for l in out.splitlines() if
      l.strip().startswith('Census:')); assert failed == [], failed; assert ' declared=6
      grandfathered=19 evaluator_none_grandfathered=8 status_active=16 skipped=0' in line, line;
      print('CENSUS-OK')"
    expected: >-
      "CENSUS-OK". The assertion pins the tail of the census line (five buckets: declared,
      grandfathered, evaluator_none_grandfathered, status_active, skipped); `scanned` and `ritual`
      are left unpinned so an unrelated contract landing concurrently does not produce a spurious
      failure. The assert runs INSIDE python (no shell pipe), so a gate failure cannot be swallowed
      by a downstream exit status.
    fix_if: >-
      grandfathered != 19 means the .md deletion moved a pinned bucket -- it must not, since the
      census never scanned .md files. declared != 6 means the converted file did not land in the
      declared bucket (it declared a grandfather-only form, or its evaluator failed to resolve and
      it fell into skipped). status_active != 16 means the new file declared status: active, which
      is closed at birth for a NEW file.
    graduation: graduate
    graduation_check_id: contract-census-declared-includes-env-taxonomy
    hermetic: true
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the declared evaluator genuinely resolves (evidence of READING, not mention) -- the
      single property Decision 168 exists to enforce.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.contracts import
      _population; from scripts.contracts import load_contract_meta; m =
      load_contract_meta(Path('docs/contracts/environment-taxonomy.yaml')); r, d =
      _population.resolve_evaluator('environment-taxonomy.yaml', m.evaluator, root=Path('.'));
      print(r, d); assert r, d"
    expected: "True, with detail naming validate_environment_taxonomy's module as containing the basename in executable context"
    fix_if: >-
      False means the repointed literal is absent, is inside a docstring or comment (both excluded),
      or is a path-shaped literal containing whitespace (rejected by the matcher-trap guard). Put
      the path literal in executable context.
    graduation: graduate
    graduation_check_id: env-taxonomy-evaluator-resolves
    hermetic: true
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the conformance check reads the TYPED field and still discriminates. The module's
      existing seam (patch("scripts.checks._common.ROOT", tmp_path) with fabricated .tf /
      build-lambda.yaml / taxonomy fixtures) already carries a wrong-value case; the missing-key
      case must be added, since a typed read that defaults on a missing key is the silent-pass
      shape this rewrite could introduce.
    command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_deploy_channel_conformance.py -q
    expected: All tests pass, including the disagreement, ambiguous-value AND missing-key branches for BOTH the ducklake and prod classes.
    fix_if: >-
      If the disagreement or missing-key test passes while the implementation defaults, the check is
      not reading the typed field at all -- that is a vacuous pass, not a green check.
    graduation: graduate
    graduation_check_id: deploy-channel-conformance-missing-key-fails
    hermetic: false
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm no LIVE surface still cites the deleted .md. Historical write-once artifacts and the
      decision corpus are excluded by design; docs/ROADMAP-PLATFORM.yaml is deliberately NOT
      excluded (it is a live governed surface, not a write-once workflow output).
    command: >-
      git grep -l "environment-taxonomy\.md" -- . ':!audits/' ':!docs/plans/' ':!docs/audit-prompts/'
      ':!docs/DECISIONS.md' ':!docs/decisions-index.json' | tee /dev/stderr | wc -l | grep -qx 0
    expected: Exit 0 with an empty file list.
    fix_if: Any listed file is an unswept live citation; update it. Do NOT add new exclusions to silence this.
    graduation: graduate
    graduation_check_id: env-taxonomy-md-no-live-citations
    hermetic: true
  - step: 6
    phase: pre-deploy
    action: Confirm the .md is deleted and the prose allowlist no longer advertises permission for it.
    command: >-
      test ! -f docs/contracts/environment-taxonomy.md && ! grep -q "environment-taxonomy.md"
      docs/contracts/file-router.yaml && echo CLEAN
    expected: "CLEAN"
    fix_if: >-
      A surviving allowlist entry advertises a permission the population gate revokes -- exactly the
      contradiction contract-population.yaml's extension_and_depth clause warns about.
    graduation: graduate
    graduation_check_id: env-taxonomy-md-deleted-and-delisted
    hermetic: true
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the converted contract sits inside the contracts size class with NO budgets entry and
      no raise marker -- the Decision 165 honesty condition this plan committed to.
    command: >-
      bin/venv-python -c "from scripts.checks.structural import _classify; import pathlib;
      p='docs/contracts/environment-taxonomy.yaml'; t=pathlib.Path(p).read_text(encoding='utf-8');
      e=_classify.effective_lines(t); L=_classify.longest_line(t); c=_classify.classify_path(p,
      text=t); reg=pathlib.Path('config/structural_size_budgets.yaml').read_text(encoding='utf-8');
      print(c, e, L); assert c == 'contracts', c; assert e <= 500, e; assert L <= 2000, L; assert p
      not in reg, 'a budgets entry was added -- use the defer-detail relief valve instead'"
    expected: "contracts, <=500 effective lines, <=2000-char longest line, and the path absent from config/structural_size_budgets.yaml"
    fix_if: >-
      Over 500 effective lines: do NOT add a budgets entry and do NOT split the file (collocation
      doctrine forbids splitting one subject). Use the contracts class relief valve "defer detail" --
      move non-normative narrative (sections 6/7 detail) out to the consuming checks or T-1.19's
      note. Projected landing is 250-330 lines, so this valve is unlikely to be needed.
    graduation: graduate
    graduation_check_id: env-taxonomy-yaml-within-contracts-class
    hermetic: true
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the roadmap validates after the T-1.19 ledger upgrade, and that T-1.19 is still
      deferred_post_mvp with structured criteria and a re-grounded report path.
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_platform_roadmap import
      validate_platform_roadmap; f=[]; validate_platform_roadmap(f); assert not f, f;
      d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t=[i for i in d['tier_items'] if
      i['id']=='T-1.19'][0]; assert t['status']=='deferred_post_mvp', t['status']; assert
      all(isinstance(c, dict) and 'id' in c for c in t['exit_criteria']), t['exit_criteria']; assert
      not any('docs/REPORT-' in p for p in t['files_in_scope']), t['files_in_scope']; print('T-1.19
      OK')"
    expected: "T-1.19 OK"
    fix_if: >-
      A failure here means the ledger conversion is incomplete or malformed (validate_platform_roadmap
      enforces criterion-object shape and closes_criteria referential integrity). Note check (ii)'s
      bare-string rule does NOT fire on this edit -- see the scope row's accuracy note -- so a green
      validate_platform_roadmap alone does not prove the conversion happened; the explicit
      isinstance assertions in this command are what prove it. A surviving docs/REPORT- path is the
      RS-03 docs_root_allowlist violation this plan re-grounds.
    graduation: graduate
    graduation_check_id: t-1-19-ledger-upgraded
    hermetic: true
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm the terraform diff is comment-only -- no added or removed non-comment line -- against
      the MERGE BASE. Provider-free; never runs init/validate/plan, and never invokes the terraform
      binary at all (it is not installed here; CI owns fmt/validate/plan).
    command: >-
      git fetch origin main --quiet; test -z "$(git diff origin/main...HEAD -- terraform/ | grep -E
      '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*#')" && echo COMMENT-ONLY
    expected: "COMMENT-ONLY"
    fix_if: >-
      Any non-comment line in the terraform diff means this change stopped being a no-op and now
      carries real infrastructure risk -- revert it; it is out of this plan's scope.
    graduation: waive
    graduation_waiver_reason: >-
      Inherently diff-scoped and therefore not a durable standing guard: in a reverted origin/main
      worktree the diff is empty so the assertion passes on both sides (not admissible under
      run_differential), and post-merge it is vacuously true forever. Its value is entirely
      pre-merge, which is exactly where this VP runs it.
    hermetic: true
  - step: 10
    phase: pre-deploy
    action: Regenerate the decisions index after the two append-only annotations and confirm freshness.
    command: >-
      bin/venv-python -c "from scripts.checks.decisions.validate_decisions_index_freshness import
      validate_decisions_index_freshness; f=[]; validate_decisions_index_freshness(f); assert not f,
      f; print('index fresh')"
    expected: "index fresh"
    fix_if: Regenerate docs/decisions-index.json via its generator before re-running.
    graduation: waive
    graduation_waiver_reason: >-
      An identical freshness assertion is already a registered, sequenced check
      (validate_decisions_index_freshness); graduating a second registry row asserting the same
      property would duplicate an existing standing guard rather than add coverage.
    hermetic: true
  - step: 11
    phase: pre-deploy
    action: >-
      Confirm rec-2751's stale content did not survive transcription: the converted contract must
      exist AND must not describe the DuckLake Lambda set as "four".
    command: >-
      test -f docs/contracts/environment-taxonomy.yaml && ! grep -iE "four DuckLake"
      docs/contracts/environment-taxonomy.yaml && grep -q "ducklake_maintenance_smoke"
      docs/contracts/environment-taxonomy.yaml && echo COUNT-CORRECTED
    expected: >-
      "COUNT-CORRECTED". Both halves matter: the negative conjunct alone is satisfiable by DELETING
      the sentence, so the positive conjunct on ducklake_maintenance_smoke is what proves the fifth
      function was actually named. This mirrors rec-2751's own acceptance oracle, which
      rec-autoclose.yml never evaluates (it calls update_rec straight from the Resolves: trailer).
    fix_if: >-
      The stale count was transcribed forward. Correct it against the live terraform: there are FIVE
      aws_lambda_function resources across terraform/personal/ducklake_*.tf (writer, reader,
      maintenance, catalog_dr, maintenance_smoke). Before restating the conformance claim, check
      which of the five actually carry lifecycle { ignore_changes = [source_code_hash] } -- do not
      assert a conformance property for maintenance_smoke without reading its resource.
    graduation: waive
    graduation_waiver_reason: >-
      A one-time transcription-correctness check with no durable regression surface: once the count
      is right in the converted contract, nothing in the normal course of work re-introduces "four",
      so a standing registry row would guard a property that cannot regress. (The command IS
      differential-admissible with the test -f conjunct present -- it fails on origin/main where the
      .yaml is absent -- so this is a deliberate waive on durability grounds, not an admissibility
      failure.)
    hermetic: true
  - step: 12
    phase: pre-deploy
    action: >-
      Prove the vocabulary lint allowlists the canonical contract at its NEW path -- via a case that
      does not exist at origin/main.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_environment_taxonomy.py -q
    expected: All tests pass, including the newly ADDED case asserting the .yaml contract is skipped by the lint.
    fix_if: >-
      A failure usually means the allowlist still names the deleted .md, so the converted contract is
      linted as an ordinary changed doc and its two-axis vocabulary (which legitimately spans both
      axes) trips the phase-as-env / tier-as-phase patterns.
    graduation: graduate
    graduation_check_id: env-taxonomy-yaml-allowlisted-by-lint
    hermetic: false
  - step: 13
    phase: pre-deploy
    action: >-
      EXECUTE the three repointed verification-registry entries rather than grepping their paths --
      the only way to catch that env-taxonomy-section6-lockfile-committed's column-0 markdown awk
      extraction cannot match YAML.
    command: >-
      bin/venv-python -c "import yaml; from scripts.verification_graduation import
      materialize_check; rows=[r for r in
      yaml.safe_load(open('config/agent/verification_registry/registry.yaml'))['entries'] if
      r['check_id'] in ('environment-taxonomy-stale-lambda-note-removed',
      'environment-taxonomy-records-infra-error', 'env-taxonomy-section6-lockfile-committed')];
      print(len(rows), 'entries'); assert rows, 'no entries matched -- check the registry key';
      [print(r['check_id'], materialize_check(r).run().status) for r in rows]"
    expected: >-
      Either all three entries report CheckStatus.PASS, or env-taxonomy-section6-lockfile-committed
      is absent because it was deliberately retired with a recorded reason (in which case 2 entries
      print). Verified pre-change baseline: all three currently PASS against the .md, so any FAIL
      here is a regression this change introduced, not a pre-existing condition.
    fix_if: >-
      A FAIL on entries 1 or 2 means the transcription dropped the string their pattern matches
      ("No such Lambda exists today" / "infra_error") -- restore it or re-express the check. A FAIL
      on entry 3 is EXPECTED if it was merely path-swapped: its awk extraction needs re-expression
      against the YAML structure, or the entry must be retired with a reason. Note the two API
      facts this command depends on, both verified: `materialize_check` lives in
      scripts/verification_graduation.py (NOT scripts/verification_checks.py), and the registry's
      top-level key is `entries` (NOT `checks`).
    graduation: waive
    graduation_waiver_reason: >-
      Not admissible: validate_verification_registry's _added_entries matches by check_id, so a
      REPOINTED entry is never "added" and no differential runs for it at all. The durable
      regression guard for these three properties is the registry entries themselves, which already
      exist; this step exists to prove they still execute after repointing.
    hermetic: true
  - step: 14
    phase: pre-deploy
    action: >-
      Confirm no surviving reference points at a markdown anchor or numbered markdown section of the
      converted contract -- the failure mode a mechanical s/.md/.yaml/ would leave behind.
    command: >-
      test -z "$(git grep -nE 'environment-taxonomy[^ \"]*#' -- . ':!audits/' ':!docs/plans/'
      ':!docs/audit-prompts/' ':!docs/DECISIONS.md' ':!docs/decisions-index.json')" && test -z "$(git
      grep -nE 'environment-taxonomy\.yaml.{0,60}[Ss]ection [0-9]' -- . ':!audits/' ':!docs/plans/'
      ':!docs/audit-prompts/' ':!docs/DECISIONS.md' ':!docs/decisions-index.json')" && echo
      NO-DANGLING-ANCHORS
    expected: "NO-DANGLING-ANCHORS"
    fix_if: >-
      A hit is a reference that survived the path swap but no longer resolves: markdown anchors
      (#5-lambda-codeinfra-...) and "section N" phrases have no referent in YAML. Re-express each as
      the real top-level key path in the converted contract.
    graduation: graduate
    graduation_check_id: env-taxonomy-no-dangling-anchor-refs
    hermetic: true
  - step: 15
    phase: pre-deploy
    action: Confirm the ambient-prose byte budgets stay green after the AGENTS.md and SKILL.md edits.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits;
      f=[]; validate_prose_limits(f); assert not f, f; print('prose budgets green')"
    expected: "prose budgets green"
    fix_if: >-
      SIX in-scope surfaces are pinned, TWO at zero headroom: src/lambdas/CLAUDE.md (1313/1313) and
      terraform/github/CLAUDE.md (5266/5266), then src/data/handlers/CLAUDE.md (5 bytes),
      planning/SKILL.md (6), terraform/CLAUDE.md (14, against two references) and the S1 aggregate
      via AGENTS.md (18). Apply the bare-basename valve from the constraints (-15 bytes per
      reference) rather than raising a budget -- a raise needs a Decision-cited marker this plan
      forbids, and reseeding down is impossible at zero headroom.
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits is already a registered, sequenced check asserting exactly this
      property; graduating a duplicate row would add no coverage. Included as a VP step because the
      headroom is unusually tight and an implementer would otherwise discover the breach only at
      full validation.
    hermetic: true
  - step: 16
    phase: post-deploy
    action: >-
      On the PR, confirm CI's required terraform-validate check and the speculative-plan job are
      green and the saved plan reports no infrastructure changes. CI is the authoritative verifier
      for terraform fmt/validate/plan (Decision 119); this cannot be asserted locally.
    command: >-
      echo "Read the PR check runs via mcp__github__pull_request_read (get_check_runs); require
      terraform-validate green and the speculative-plan job reporting no resource changes."
    expected: terraform-validate green; speculative plan shows 0 to add, 0 to change, 0 to destroy.
    fix_if: >-
      A non-empty plan means a scope file carried a resource-affecting edit despite VP step 9 --
      stop and reconcile against step 9 before merging; do not approve a plan this change did not
      intend to produce.
  - step: 17
    phase: post-deploy
    action: >-
      After the squash-merge, confirm rec-2751 actually closed via the Resolves: trailer and
      rec-autoclose.yml rather than assuming it.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && grep -c '"id": "rec-2751".*"status":
      "closed"' logs/.recommendations-log.jsonl
    expected: "1 (rec-2751 closed)"
    fix_if: >-
      If still open, the trailer did not fire; close it manually with `bin/venv-python -m
      scripts.ops_data_portal --update-rec rec-2751 --status closed --resolution "..."` per
      Decision 70.
  - step: 18
    phase: pre-deploy
    action: >-
      FINAL GATE before commit: run the full validation tier (not --pre). handoff_policy declares
      full_validation_required_before_commit, so the commit waits for a completed exit 0; on
      timeout the disposition is `blocked` -- resume later and rerun full from the start.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 with no failed checks.
    fix_if: >-
      Fix each reported failure and rerun from the start -- a partial rerun does not satisfy the
      handoff policy. Expect the plan-document and handoff-full-tier checks to be the sensitive
      ones for this change's own artifact.
    graduation: waive
    graduation_waiver_reason: >-
      This step invokes the entire presubmit suite; graduating it as a single registry row would
      assert "all checks pass" as one kernel primitive, which is neither a discrete property nor
      differentially meaningful -- every constituent check is already independently registered and
      sequenced.
    hermetic: false
