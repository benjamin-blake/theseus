constraints:
  - "No new numbered Decision (human hard constraint). The conversion rides Decision 168's existing Class D authority and Decision 118/CD.25's conversion-as-default ritual; Decision 121 is not a counter-precedent (it minted a number to RETIRE a contract and frames retirement as the exception)."
  - "No `# raise-approved:` marker anywhere in this change -- not in config/structural_size_budgets.yaml, not in config/prose_budgets.yaml, not in contract-population.yaml. A dec-168 citation on a budgets entry for this file WOULD pass the guard by ancestor-path match, but dec-168's body authorizes migration-step-3 sweep seeds, not this file's size -- citing it would satisfy the guard while defeating what Decision 165 built it to prove."
  - "Do NOT split the converted contract into multiple files: the contracts class relief_valve states splitting a single subject is forbidden by collocation doctrine. If over budget, defer detail instead."
  - "Do NOT edit any `## Decision NNN:` heading, including Decision 125's parenthetical (Decision 149, never-remove-headers). Annotations are append-only inside the body, per decision-entry.yaml's amendment_forms."
  - "Do NOT rewrite historical citations in audits/, docs/plans/, docs/audit-prompts/ (write-once workflow_outputs class) or the bulk of docs/DECISIONS.md -- only the two SoT-designating entries (77, 125) get an annotation. docs/ROADMAP-PLATFORM.yaml is NOT in that class and IS swept."
