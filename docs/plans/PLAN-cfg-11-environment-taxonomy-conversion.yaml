  Single-commit revert restores the .md and every repointed consumer together. The conversion is
  atomic by construction: the .md deletion, the two check repoints, the three registry-entry
  repoints and the citation sweep must land in the same change, because a half-landed state leaves
  either a contract with no consumers or consumers pointing at a deleted file. Nothing is deployed
  and no infrastructure changes, so revert is the complete rollback.
