---
schema_version: 1
slug: "ducklake-applied-schema-gate"
intent: >-
  Enforce, in the governed DuckLake code-deploy channel, that a serving Lambda never ships code
  requiring an ops-table column the physical table does not have -- the sequencing hole that took
  ops_decisions hard-down for read AND write on 2026-07-24. Enforcement is static and zero-egress: a
  merge-time declaration gate plus a deploy-time refusal that splits the maintenance deploy (which
  must land FIRST, because it performs the reconcile) from the serving deploy (which must land LAST).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-applied-schema-gate.yaml
phase: >-
  No tier_item alignment. Soft-warn exception category `hotfix` -- forward-fix follow-up to a live
  production incident (ducklake-writer-errors CloudWatch alarm, 2026-07-24T14:31:12Z). Consumes
  T2.26 c9's landed result (ops_execution_plans is DuckLake-resident) but does not advance T2.26.
scope:
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Extend `contract_table_ops` to carry an entry for ALL SIX ops tables (it currently holds only
      ops_recommendations and ops_decisions), each with three new keys: `reconcile_scope`
      (ducklake | exempt, with `exempt_reason`); `pending_reconcile` ({history: [...], current: [...]})
      listing columns whose physical ALTER is owed; and `reconciled`
      ({history: {<column>: {at, evidence}}, current: {<column>: {...}}}) recording the
      reconcile_columns response that justified each clear. The per-COLUMN key is required, not
      cosmetic: a per-side-only shape cannot express a table with two pending columns of which one
      reconciled, which is exactly the half-reconciled state the declared grain exists to catch. Seed ops_decisions.pending_reconcile with
      `intent` on both sides (history-only for append_only tables -- see APPEND-ONLY in context). Also
      amend the block's own comments: the file header item 4 and the `contract_table_ops` block comment
      both describe it as holding operational keys for "contract-backed tables", which becomes
      self-contradictory once four non-contract tables are added. See DECLARATION HOME in context for why
      contract_table_ops -- and not the dormant/smoke blocks -- is the only home that does not leak into
      the generated artefact.
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: >-
      Add a standalone subset-validation pass over EVERY `contract_table_ops` entry (not only the two
      in `_CONTRACT_TABLE_IDS`), mirroring `_enforce_migration_columns_subset` (rec-2232), so the four
      non-contract tables are validated even though the emission path never reads them. Emit none of
      the three new keys.
  - file: scripts/checks/ops_governance/validate_reconcile_pending_gate.py
    action: Create
    purpose: >-
      One module, two entrypoints sharing one predicate. Merge-time check (registered in both
      validate.py tiers): fail closed on an unclassified ops table; fail when a column added IN THE DIFF
      to EITHER a `docs/contracts/ops_*.yaml` contract OR a `dormant_ops_tables`/`smoke_ops_tables`
      `columns:` block is absent from pending_reconcile; fail when a pending_reconcile or reconciled
      entry names an undeclared column; fail when a `current`-side entry names a table whose
      `write_mode` is append_only. Plus a `--deploy-gate`
      entrypoint returning non-zero while any reconcile_scope=ducklake table has a non-empty
      pending_reconcile, called verbatim by the workflow so the two cannot drift.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: Register validate_reconcile_pending_gate in BOTH the --pre and full tiers.
  - file: scripts/validate.py
    action: Modify
    purpose: Add the facade re-export import so the @registry.register decorator executes.
  - file: scripts/build_lambda_deploy.py
    action: Modify
    purpose: >-
      Add an `only_functions: set[str] | None` parameter to `update_lambda_functions()` (line 84 --
      note this is the real symbol; there is no `deploy_functions`) filtering the map from
      `_build_ducklake_function_zip_keys()`. Raise on an unrecognised name, and raise ValueError if
      passed with only_ducklake=False -- the prod branch builds a different map and subsetting it is
      out of scope. Required because --ducklake-only is currently all-or-nothing across five functions.
  - file: scripts/build_lambda.py
    action: Modify
    purpose: >-
      Add `--ducklake-functions <comma-list>` threading through to only_functions -- the accepted
      vocabulary is the FULL AWS function names that key _build_ducklake_function_zip_keys() (e.g.
      agent-platform-ducklake-writer), not bare slugs -- and
      `--ducklake-deploy-only` which skips the build/upload phase and calls update_lambda_functions()
      against artifacts already in S3. Both absent, behaviour is byte-identical to today, so every
      existing caller and the Decision 125 break-glass path are untouched. deploy-only is what keeps
      the split from building and re-uploading the same artifacts twice (see DOUBLE-BUILD in context).
  - file: .github/workflows/deploy-ducklake-lambdas.yml
    action: Modify
    purpose: >-
      Restructure into five jobs: deploy-maintenance (ungated; builds+uploads ALL artifacts once, then
      deploys maintenance + maintenance-smoke) -> maintenance-smoke (needs deploy-maintenance; the four
      --lambda-maintenance-* gates) and reconcile-gate (needs deploy-maintenance; calls --deploy-gate)
      -> deploy-serving (needs reconcile-gate; --ducklake-deploy-only for writer + reader + catalog-dr)
      -> smoke (needs deploy-serving; --lambda-attach + --lambda-reader). Each leg's deploy-record
      freshness assertion is narrowed to its own function set. Both deploy jobs publish a `deployed`
      output; deploy-serving lists BOTH reconcile-gate and deploy-maintenance in `needs` (Actions cannot
      read a non-listed job's outputs) and gates on deploy-maintenance's `deployed`, and smoke gates on
      deploy-serving's. reconcile-gate carries its own setup-python + pip install pyyaml pydantic.
  - file: docs/contracts/build-lambda.yaml
    action: Modify
    purpose: >-
      MANDATORY, not optional: tests/test_build_lambda_config.py::test_cli_flag_equivalence asserts exact
      set equality between build_parser()'s option strings and this contract's `cli_flags:` list, so
      adding --ducklake-functions and --ducklake-deploy-only without registering them here is a
      deterministic CI failure. Also re-ground `deploy_channels.ducklake_functions.governed_channel`,
      whose prose describes the channel as "runs build_lambda --ducklake-only --deploy, gates on
      --lambda-attach/--lambda-reader smoke" -- the five-job restructure falsifies that sentence, and
      validate_deploy_channel_conformance will NOT catch it (it reads channel_class/ignore_changes, not
      this prose). This is the #544 doc-drift class.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Decision 126 cl.2 navigation obligation -- describe the new red-pipeline state (serving deploy
      refused, reconcile owed, remedy is an admin-tier verb the agent cannot invoke) by EXTENDING
      `deploy_code.recovery`. Do NOT add a new top-level key: the file's three top-level intents ARE
      Decision 126 cl.1's three-intent model, and a fourth would assert an intent that decision does not
      recognise. Must also disambiguate from the existing `reconcile:` entry, which is the TERRAFORM
      reconcile and does something entirely different. Pointer only; never a second source of truth.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Decision 132 cl.2 -- registry rows for the FIVE `graduate`-dispositioned VP steps (1, 2, 4, 5, 7).
  - file: tests/checks/ops_governance/test_validate_reconcile_pending_gate.py
    action: Create
    purpose: Unit coverage over the merge-time gate and the --deploy-gate entrypoint.
  - file: tests/build_lambda_deploy/test_function_subset.py
    action: Create
    purpose: >-
      Unit coverage that only_functions filters the deploy set, an unknown name raises rather than
      silently deploying nothing, only_functions with only_ducklake=False raises, omitting it preserves
      all-five behaviour, and --ducklake-deploy-only performs no build/upload.
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: >-
      Cover the new subset-validation pass over all six contract_table_ops entries (acceptance
      criterion 2), keeping the new generator lines above the CD.30 diff-line-coverage ratchet.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    All six ops tables from generate()['ops_tables'] carry an explicit reconcile_scope, and the gate
    FAILS if any is unset. Classification: `ducklake` for ops_recommendations, ops_decisions,
    ops_priority_queue, ops_execution_plans and ops_smoke_events; `exempt` for ops_session_log alone.
  - >-
    ops_decisions.pending_reconcile lists `intent` under BOTH history and current; ops_smoke_events is
    seeded history-only and a current-side entry for it is REJECTED; and the generator rejects any
    pending_reconcile or reconciled entry naming an undeclared column -- for the two
    contract tables that means absent from the Class A contract, and for the four non-contract tables
    absent from that table's own column block in the sidecar (they have no Class A contract).
  - >-
    validate_reconcile_pending_gate FAILS a PR that adds a column WITHOUT a matching pending_reconcile
    entry, whether that column was added to a docs/contracts/ops_*.yaml contract OR to a
    dormant_ops_tables/smoke_ops_tables `columns:` block, and the message contains the literal
    reconcile_columns invoke.
  - >-
    `bin/venv-python -m scripts.schema_to_field_semantics --check` exits 0 -- the generated
    field_semantics.yaml is byte-unchanged by this plan, so none of the three new keys reaches the
    Lambda-bundled artefact.
  - >-
    update_lambda_functions(only_functions=...) deploys exactly the named subset; an unrecognised name
    raises; only_functions with only_ducklake=False raises ValueError; omitting it deploys all five as
    before; and --ducklake-deploy-only performs no build or upload.
  - >-
    deploy-ducklake-lambdas.yml contains exactly the jobs deploy-maintenance, maintenance-smoke,
    reconcile-gate, deploy-serving, smoke -- the old single `deploy` job is GONE -- with
    deploy-maintenance ungated, maintenance-smoke and reconcile-gate both needing deploy-maintenance,
    deploy-serving needing reconcile-gate, and reconcile-gate actually invoking --deploy-gate.
  - >-
    The check is registered in both validate.py tiers and `bin/venv-python -m scripts.validate --pre`
    exits 0 on this branch within the Decision 153 / Decision 73 300s budget.
  - >-
    OPERATOR-GATED, merge-blocking: the deployed ducklake_maintenance deploy record proves it carries
    the column BEFORE the reconcile runs; reconcile_columns then reports `intent` in added_history and
    added_current; ducklake_reader current_state("ops_decisions") returns rows; and
    --backfill-decisions-md writes dec-151 and dec-152 without a 502.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the merge-time gate -- unclassified table FAILS, diff-added-but-undeclared column FAILS,
      declared column PASSES, non-subset pending/reconciled entry FAILS, unreachable origin/main
      advisory-SKIPs with a printed reason rather than false-greening.
    command: >-
      bin/venv-python -m pytest tests/checks/ops_governance/test_validate_reconcile_pending_gate.py -q
    expected: >-
      All tests pass. The undeclared-column test asserts the failure string contains both the column
      name and the substring "reconcile_columns".
    fix_if: >-
      If the unclassified-table test passes when it should fail, the gate is iterating the sidecar
      rather than the contract -- invert it; generate()['ops_tables'] is authoritative. If the
      advisory-skip false-greens, it must print its reason and be unreachable when origin/main resolves.
    hermetic: false
    graduation: graduate
    graduation_check_id: "reconcile-pending-gate-unit-tests"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the deploy split is real: only_functions filters the set, an unknown name raises,
      only_ducklake=False raises, the default deploys all five, and deploy-only never builds. Also run
      the build-contract equivalence suite, which fails closed if the two new CLI flags are not
      registered in docs/contracts/build-lambda.yaml.
    command: >-
      bin/venv-python -m pytest tests/build_lambda_deploy/test_function_subset.py
      tests/test_build_lambda_config.py -q
    expected: All tests pass.
    fix_if: >-
      A test passing with an unknown function name means the filter silently intersects to empty -- a
      subset deploy that deploys nothing and reports success is exactly the false-green this plan
      exists to remove. Raise on unrecognised names.
    hermetic: false
    graduation: graduate
    graduation_check_id: "build-lambda-deploy-function-subset"
  - step: 3
    phase: pre-deploy
    action: >-
      Run the real merge-time gate against the real repo: all six ops tables classified, and the seeded
      ops_decisions/intent crossing declared rather than undeclared.
    command: >-
      bin/venv-python -c "from scripts.checks.ops_governance.validate_reconcile_pending_gate import
      validate_reconcile_pending_gate as v; f=[]; v(f); print('FAILURES=%d' % len(f)); assert not f, f"
    expected: Prints FAILURES=0, exit 0.
    fix_if: >-
      FAILURES>0 naming an unclassified table means reconcile_scope was seeded only for the tables this
      incident touched. Classify all six against docs/ROADMAP-PLATFORM.yaml T2.26 exit criteria and each
      table's own sidecar `status` -- NOT against AGENTS.md, which is stale on ops_execution_plans
      (rec-2852). Never silence the gate by narrowing the table set it iterates.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step runs the check that execution step 4 registers as a standing guard in both validate.py
      tiers (registration confirmed by VP step 4), so a registry row would duplicate an already-standing
      check. Deliberately NOT hermetic: it exercises the origin/main diff leg, which residual risk 1
      records as advisory-SKIPping when the ref does not resolve -- a hermetic replay could silently
      take that path.
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm registration in BOTH validate.py tiers. The pattern is deliberately loose on the _c() call
      shape because current main writes many --pre entries as _c(name, pre_globs=(...)) on one line.
    command: >-
      test "$(grep -c 'validate_reconcile_pending_gate' scripts/checks/registry.py)" = "2"
      && grep -q "validate_reconcile_pending_gate" scripts/validate.py && echo REGISTERED_BOTH_TIERS
    expected: Prints REGISTERED_BOTH_TIERS, exit 0.
    fix_if: >-
      A count of 1 means the check landed in one tier only. Decide and record whether the --pre entry is
      pre_globs-gated; if it is, the globs MUST include both docs/contracts/ops_*.yaml and
      config/lambda/ducklake/field_semantics.static.yaml, or a column-add PR skips the gate entirely.
    hermetic: true
    graduation: graduate
    graduation_check_id: "reconcile-pending-gate-registered-both-tiers"
  - step: 5
    phase: pre-deploy
    action: >-
      Assert the exact workflow job topology, including that the old ungated single `deploy` job is
      gone and that the gate job really invokes the shared entrypoint.
    command: >-
      bin/venv-python -c "import yaml; w=yaml.safe_load(open('.github/workflows/deploy-ducklake-lambdas.yml'));
      j=w['jobs']; n=lambda x: [x] if isinstance(x, str) else list(x or []);
      assert set(j)=={'deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'}, sorted(j);
      assert 'reconcile-gate' not in n(j['deploy-maintenance'].get('needs'));
      assert 'deploy-maintenance' in n(j['maintenance-smoke']['needs']);
      assert 'reconcile-gate' not in n(j['maintenance-smoke']['needs']);
      assert 'deploy-maintenance' in n(j['reconcile-gate']['needs']);
      assert 'reconcile-gate' in n(j['deploy-serving']['needs']);
      assert 'deploy-maintenance' in n(j['deploy-serving']['needs']);
      assert 'deploy-serving' in n(j['smoke']['needs']);
      assert '--deploy-gate' in yaml.dump(j['reconcile-gate']);
      assert 'pip install' in yaml.dump(j['reconcile-gate']);
      assert \"needs.deploy-maintenance.outputs.deployed\" in yaml.dump(j['deploy-serving']);
      assert \"needs.deploy-serving.outputs.deployed\" in yaml.dump(j['smoke']);
      print('JOB_TOPOLOGY_OK')"
    expected: Prints JOB_TOPOLOGY_OK, exit 0.
    fix_if: >-
      If maintenance is gated behind reconcile-gate, the reconcile becomes a silent no-op:
      reconcile_columns derives its ALTER list from the DEPLOYED maintenance function's bundled
      field_semantics.yaml, so a maintenance function that never received the column adds nothing and
      reports columns_pre_existing=true. If a stray `deploy` job survives alongside the new set, serving
      code ships past the refusal and the whole gate is decorative -- the exact-set assertion catches
      that half-migration. deploy-serving must list deploy-maintenance in `needs` as well as
      reconcile-gate, because GitHub Actions does not expose a non-listed job's outputs: without it the
      DEPLOY_ROLE_PROVISIONED bootstrap window (where deploy goes green with `deployed` unset) turns a
      designed green no-op into a hard red, as deploy-serving would call --ducklake-deploy-only against
      per-sha S3 keys nothing ever uploaded. And reconcile-gate needs its own setup-python +
      `pip install pyyaml pydantic`: bin/venv-python falls back to a PATH interpreter and exits 1 when
      the deps are absent, which would wedge the channel red on every run regardless of reconcile state.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ducklake-deploy-job-topology"
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the new sidecar keys never reach the Lambda-bundled artefact -- the assertion the whole
      Lambda Deployment Assessment rests on.
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: Exit 0 -- generated field_semantics.yaml byte-identical to the committed file.
    fix_if: >-
      A failure means a new key reached the emission path. The four non-contract tables MUST be declared
      under contract_table_ops, not under dormant_ops_tables/smoke_ops_tables -- those blocks are spliced
      VERBATIM into the output, so anything added there ships inside four active Lambda packages and
      drags this plan into a per-Lambda build/deploy/smoke obligation it is scoped to avoid.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Inadmissible as a differential, not merely inconvenient: validate_verification_registry materialises
      each new row against an origin/main worktree and requires FAIL there, but `--check` is green on main
      BY CONSTRUCTION -- validate_field_semantics_drift already guarantees main is self-consistent. The row
      would be tautological (PASS on both sides) and would redden --pre. Step 7 carries the graduated
      coverage instead, over a test node that genuinely does not exist on main.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the generator rejects an undeclared pending/reconciled column, and rejects a current-side
      entry on an append_only table (acceptance criterion 2).
    command: >-
      bin/venv-python -m pytest
      tests/test_schema_to_field_semantics.py::TestReconcileScopeSubset -q
    expected: >-
      All cases pass: undeclared column under pending_reconcile raises; undeclared column under
      reconciled raises; a current-side entry for ops_smoke_events (write_mode append_only) raises;
      a declared column on both sides is accepted.
    fix_if: >-
      If the append_only case does not raise, the validator is not consulting write_mode -- an
      unreconcilable current-side entry on ops_smoke_events would block every serving deploy forever
      with no sanctioned escape (see APPEND-ONLY in context).
    hermetic: false
    graduation: graduate
    graduation_check_id: "field-semantics-reconcile-scope-subset-rejection"
  - step: 8
    phase: pre-deploy
    action: Confirm the gate lands non-wedging -- the fast presubmit tier is green on this branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, within the Decision 153 / Decision 73 300s fast-tier budget.
    fix_if: >-
      If --pre goes red on the new check, the seeded sidecar entries are malformed. Do not delete the
      check or drop `intent` from the contract to get green. If the run breaches the budget, the gate is
      doing more than a static YAML read plus one _common diff -- narrow it, do not raise the budget.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The command is a bare command_exit_zero over `scripts.validate --pre` itself. Graduating it into
      config/agent/verification_registry/registry.yaml -- which `validate --pre` consumes -- is circular:
      the registry row would assert the success of the runner evaluating it.
  - step: 9
    phase: post-deploy
    action: >-
      PREREQUISITE TO THE RECONCILE. Prove the deployed ducklake_maintenance actually carries `intent`
      before invoking the reconcile. Without this, an all-empty reconcile result is indistinguishable
      from a successful no-op and the operator would clear pending_reconcile over a still-broken table.
      Verified executable by the agent during planning: PlatformDev holds s3:GetObject on this prefix.
    command: >-
      aws s3 cp s3://agent-platform-data-lake/deploy-records/ducklake/agent-platform-ducklake-maintenance.json -
      --profile agent_platform --region eu-west-2
      | bin/venv-python -c "import json,subprocess,sys; r=json.load(sys.stdin); s=r.get('source_git_sha');
      assert s, 'source_git_sha null -- break-glass local deploy, provenance unknown; redeploy via the workflow';
      subprocess.run(['git','merge-base','--is-ancestor','f0e701d',s], check=True);
      print('MAINTENANCE_CARRIES_INTENT', s)"
    expected: >-
      Prints MAINTENANCE_CARRIES_INTENT with the sha. As of this planning session the record already
      reads source_git_sha=f0e701d1b6a6ac361a2ba0820c802953f218ed3f (deployed 2026-07-24T14:27:46Z) --
      the very commit that introduced `intent` -- so this precondition is already satisfied for the
      recovery leg.
    fix_if: >-
      A null source_git_sha means the function was last deployed by the break-glass local path, which
      does not stamp GITHUB_SHA -- redeploy through the workflow rather than guessing. An older sha means
      deploy-maintenance has not run since the column landed. Do NOT proceed to step 10 on either; the
      reconcile would silently add nothing. If the s3 read AccessDenies, stop and request the record from
      the operator -- do not skip the precondition.
  - step: 10
    phase: post-deploy
    action: >-
      OPERATOR-EXECUTED, HUMAN-DIRECTED BREAK-GLASS (Decision 126 cl.1; Decision 151 cl.2 -- "never
      autonomous"; Decision 143 cl.2 -- admin-tier, unreachable from PlatformDev or CI). The implementing
      agent MUST NOT attempt this and holds no lambda:InvokeFunction on ducklake_maintenance. Stop and
      request it. Capture the FULL response body -- it is the evidence recorded in step 13.
    command: >-
      aws lambda invoke --function-name agent-platform-ducklake-maintenance --cli-binary-format
      raw-in-base64-out --payload
      '{"action":"reconcile_columns","data_path":"s3://agent-platform-data-lake/ducklake/","meta_schema":"ducklake_ops","table":"ops_decisions"}'
      --profile agent_platform_admin --region eu-west-2 /tmp/reconcile-ops-decisions.json
      && cat /tmp/reconcile-ops-decisions.json
    expected: >-
      ok=true AND `intent` appears in added_history AND added_current. Given step 9 proved the deployed
      spec carries `intent`, an all-empty added_* with columns_pre_existing=true is acceptable ONLY as
      evidence of a prior successful reconcile -- it is a HARD FAILURE if step 9 was skipped or stale.
    fix_if: >-
      `intent` in one of added_history/added_current but not the other means only one physical table
      reconciled -- do NOT clear pending_reconcile for the missing side. AccessDenied means the wrong
      profile; never widen a CI or PlatformDev role to reach this function.
  - step: 11
    phase: post-deploy
    action: >-
      Verify the incident is resolved through the closed named-verb read boundary (Decision 84 I-3):
      ops_decisions reads again. The single warm catalog read this plan spends (Decision 88). Row-key
      presence is a secondary signal only -- step 10's response body is the authoritative schema oracle,
      because a freshly added column is NULL for every row and may be omitted from row serialization.
    command: >-
      bin/venv-python -c "from src.common.iceberg_reader import make_reader;
      r=make_reader(profile='agent_platform'); rows=r.current_state('ops_decisions');
      assert rows, 'no rows returned'; print('OPS_DECISIONS_READ_OK rows=%d intent_key_present=%s'
      % (len(rows), 'intent' in rows[0]))"
    expected: >-
      Prints OPS_DECISIONS_READ_OK with a non-zero row count. intent_key_present may legitimately be
      False if the reader omits null-valued keys -- that is NOT a failure.
    fix_if: >-
      A continuing HTTP 502 means the reconcile did not land -- re-read step 10's response body. Do NOT
      weaken _assert_no_orphaned_current_rows (scripts/ops_portal/decisions.py:163) or add a 502
      tolerance (Decision 149 cl.3: the guard is never weakened to accommodate a broken substrate).
  - step: 12
    phase: post-deploy
    action: >-
      Confirm the write path recovered via the sanctioned ETL (Decision 84: the only legitimate re-write
      path; never re-stage from logs/.decisions-index.jsonl).
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md 2>&1 | tail -5
    expected: >-
      Fidelity report shows failed=0, with no "ducklake_writer write_ops ops_decisions failed (HTTP 502)"
      line for dec-151 or dec-152.
    fix_if: >-
      A surviving 502 on a specific decision id means that entry carries a further unreconciled column --
      add it to pending_reconcile and re-run steps 9-10; do not skip the entry.
  - step: 13
    phase: post-deploy
    action: >-
      Close the loop with recorded proof: move `intent` from pending_reconcile into `reconciled` for both
      history and current, pasting step 10's added_history/added_current as the evidence value, commit, and
      confirm the deploy gate now permits.
    command: >-
      bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate
      && echo DEPLOY_GATE_CLEAR
    expected: Prints DEPLOY_GATE_CLEAR, exit 0.
    fix_if: >-
      Still refusing means pending_reconcile was cleared on only one of history/current. Clear a side ONLY
      when step 10's response body evidences that side reconciled -- clearing it to make the gate green is
      the exact failure this plan exists to prevent, and the `reconciled` evidence field exists so a later
      reader can tell the difference.
constraints:
  - >-
    No rescue agents or workaround loops (Decision 55). A failing post-deploy leg stops and RCAs.
  - >-
    reconcile_columns is ADMIN-TIER and never autonomous (Decision 143 cl.2; Decision 151 cl.2;
    Decision 126 cl.1). The implementing agent stops and requests operator execution for VP step 10.
    Never widen a CI or PlatformDev role to reach ducklake_maintenance.
  - >-
    Both gates must be STATIC and zero-egress (Decision 88). Neither may invoke ducklake_maintenance to
    introspect the catalog -- github_ci_branch is never granted invoke on it, and
    ducklake_maintenance_smoke is env-pinned to the disposable smoke catalog and structurally cannot see
    production ops_decisions. That blindness is why deploy run 8 reported green over a broken table.
  - >-
    The merge-time check and the deploy gate MUST be one module with two entrypoints. Two implementations
    of the same predicate will drift, and the drifting one will be the deploy gate, because it runs least.
  - >-
    The gate uses scripts/checks/_common helpers (ROOT, run, get_changed_files/get_status_aware_diff) --
    Decision 104 makes _common the SOLE home for these, and Decision 135 owns the affected-set diff. Do
    not roll a private git-diff helper.
  - >-
    The gate must stay a static YAML read plus one _common diff. Decision 153 preserves hard-fail on the
    --pre 300s budget for every non-full_suite_forced breach.
  - >-
    Do not hand-edit config/lambda/ducklake/field_semantics.yaml -- it is GENERATED (Decision 65,
    Decision 118). Sidecar keys are authored in field_semantics.static.yaml.
  - >-
    Signal and sequencing only. Do not add write buffering, an outbox, retry/replay, or any path that
    re-stages ops rows from logs/.decisions-index.jsonl (Decision 84 I-4).
  - >-
    `--ducklake-functions` and `--ducklake-deploy-only` must both default to today's behaviour when
    omitted, so every existing caller and the Decision 125 break-glass path are byte-identical.
  - >-
    An ungated deploy must never be an unverified deploy. deploy-maintenance ships production code
    regardless of the reconcile state, so its own smoke leg must run on the same condition
    (Decision 55 false-green avoidance, the rationale already written into this workflow).
  - >-
    Files outside the Scope table are not modified. Out-of-scope findings become recommendations via
    scripts/ops_data_portal.py, not inline fixes.
