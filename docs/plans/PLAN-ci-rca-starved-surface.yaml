constraints:
- >-
  No rescue agents or workaround loops (Decision 55). On an unrecoverable V3 failure, stop and RCA
  rather than patching around it.
- >-
  Only files in the Scope table may be modified. In particular: do NOT extract
  write-convergence-record's ~94-line inline body in this plan -- it is the highest-blast-radius
  script in the system and belongs in its own separately-reviewed change (execution step 13 files
  the rec).
- >-
  The assert MUST sit after ALL FIVE existing skip/marker branches -- refused, still-actionable,
  routed, pre-apply-failure, STARVED -- and immediately before the green/red write. Making it a
  first step is a rejected design, not a refactoring preference. The count is five, verified
  against the file at lines 102/106/110/145/180 with the write at 184.
- >-
  An explicit `revise` must keep latching red (Decision 154 point 4) and `starved` must keep
  skipping the write (T2.39 c3). Only the undefined value changes behaviour.
- >-
  archive_transcripts.sh must be total (always exit 0) and must never emit a bare `|| true`; every
  failure path prints its own distinct marker.
- >-
  Portal-only writes (Decision 84 / Single Portal Invariant): never edit logs/*.jsonl. The rec-2664
  filing job must run under the branch role, which holds DuckLakeInvokeCI.
- >-
  The new check must be filesystem-only -- no network, no subprocess -- to stay inside the fast
  tier's budget (Decision 153).
- >-
  Before placing any new test class in an existing module, grep that module for `importorskip`; if
  present, use a guard-free file. The sibling plan's implementation lost CI job 91219816511 to
  exactly this.
- >-
  GRADUATION ROWS MUST BE DIFFERENTIAL-ADMISSIBLE, and this generalises beyond this plan. Every
  `graduation: graduate` step whose `command` names a test module that ALREADY EXISTS on
  origin/main must register a `check_spec.node_id` scoped to a class or function that is NEW IN
  THIS PR (e.g. `tests/test_subagent_review_wiring.py::TestStarvedMarker`) -- never the whole
  module. validate_verification_registry runs the real differential in the --pre tier: it reverts
  to an origin/main worktree and requires the check to FAIL there and PASS on HEAD. A whole-module
  node_id on a pre-existing module passes on both, is rejected as tautological, and reds the fast
  tier. This binds VP6, VP7 and VP9. It does NOT bind VP1/VP3/VP4 (new test files, absent on
  origin/main), VP2 (imports a module that does not exist there) or VP8 (`reconcile_starved`
  unregistered there) -- those fail on revert for free. It also resolves the VP7/VP9 identical-
  command collision, since their narrowed node_ids differ.
- >-
  If any scope file crosses its SLOC budget, decompose it into a facade package (Decision 128).
  Never a budget raise, never a bare --update-sloc-budgets re-seed.
- No emojis; ASCII hyphens only; ruff formatting at line length 127.
