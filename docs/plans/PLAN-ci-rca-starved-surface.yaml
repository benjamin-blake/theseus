  fall-through exactly as before, so a false-positive hard fail is not a trap. The class guard:
  remove its registry entries and the baseline file (the Decision 162 revert path). The marker and
  archival are additive and side-effect-free on the verdict. The rec-2664 job is a leaf and can be
  deleted without touching reconcile's route set. rec closures are reversible via the portal
  (`--update-rec ... --status open`); never by editing the local cache.
