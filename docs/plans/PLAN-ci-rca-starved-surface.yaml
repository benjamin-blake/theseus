execution_steps:
- >-
  Create .github/actions/write-convergence-record/assert_review_outcome.sh -- the strict consumer.
  Reads REVIEW_STEP_OUTCOME and REVIEW_OUTCOME from env; enforces the two-sided contract; prints a
  distinct ::error:: naming both values on violation; exits non-zero. Clears inherited errexit
  explicitly and does not depend on it for control flow.
- >-
  Create tests/test_convergence_review_outcome_contract.py driving it under the literal
  `bash --noprofile --norc -e -o pipefail` argv across the full truth table. Write the ran+EMPTY
  case FIRST and watch it fail against a stub before implementing -- it is the rec-2923 counterfactual.
- >-
  Modify write-convergence-record/action.yml: add the `review-step-outcome` input (default ""), and
  invoke the assert from the existing body AFTER ALL FIVE skip/marker branches -- refused (102),
  still-actionable (106), routed (110), pre-apply-failure (145), STARVED (180) -- and immediately
  BEFORE the green/red write (184), via an explicit `if ! bash ...; then exit 1; fi`.
- >-
  Wire the call sites: terraform-apply-sandbox.yml (apply-sandbox pairs from steps.review; gated-apply
  passes empty) and reconcile.yml (extend the `resolved` aggregator to emit review_step_outcome from
  the same branch as review_outcome; gated-apply-reconcile passes empty). Extend
  tests/verify_ci_workflow/test_apply_and_terraform.py with the pairing invariant.
- >-
  Modify review.sh to emit the STARVED marker on each starved exit path, mirrored to
  $GITHUB_STEP_SUMMARY.
- >-
  Create archive_transcripts.sh (total, always exit 0, own failure marker) and add the always-run
  second step to subagent-plan-review/action.yml. Extend tests/test_subagent_review_wiring.py with
  the marker and archival-totality cases, including aws-absent and aws-failing.
- >-
  Create scripts/checks/ci_guards/validate_composite_action_shell_bodies.py implementing R1/R2/R3
  with Decision-162-citing failure messages, plus config/composite_action_body_baseline.yaml seeded
  at the post-edit state with its r1 and r3 sections MEASURED, not assumed. Register in
  scripts/checks/registry.py (--pre and full) and scripts/validate.py. Do NOT add the check to
  tests/test_checks_registry.py's per-tier membership floors: that file sits at exactly its 643
  raise-approved budget, the addition is optional, and the sibling this guard mirrors
  (validate_composite_action_manifests) is not floored either.
- >-
  Create tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py with negative fixtures for
  each rule and TestBaselineRatchet for growth, new-entry, and marker-override cases.
- >-
  Add the `reconcile_starved` source to config/agent/data_quality/source_registry.yaml; check
  validate_test_count_coupling's coupling and satisfy it if it fires.
- >-
  Add the rec-2664 filing job to reconcile.yml -- non-terminal, branch role, and gated on
  `always() && needs.apply-reconcile.outputs.review_outcome == 'starved'` (the bare `needs:` form is
  skipped on the failing episode it serves) -- plus the `review_outcome` job output on
  apply-reconcile. Add the job-shape assertions to tests/verify_ci_workflow/test_apply_and_terraform.py
  in the same step, since the existing topology guard passes vacuously on this job.
- >-
  Author Decision 162 in docs/DECISIONS.md (re-checking the max header first), regenerate
  docs/decisions-index.json via `--write`, create docs/contracts/composite-action-shape.yaml,
  register it in file-router.yaml, and extend ci-rca-lifecycle.yaml with the marker, archival-prefix
  and rec-2923 manual-closure notes.
- >-
  Execute the Verification Plan -- run each step, loop until pass. On an unrecoverable V3 failure,
  stop and RCA (Decision 55). Full validation must complete and exit 0 before the commit.
- >-
  Post-merge portal work, in this order: (a) close rec-2923 via `ops_data_portal --update-rec
  rec-2923 --status closed --resolution "<live closure proof>"` then
  `stamp_fixed_by_sha('rec-2923', '0726593d465f3772c004dd1bbb8585f6491b5376')`; (b) file the
  follow-on rec to teach rec-autoclose an explicit fixed-by override; (c) file the owned follow-on
  rec to extract the baselined bodies under the new R1 shape, citing this plan and Decision 162 --
  scoped to the r1 entries FIRST (deterministic-guard, fetch-saved-plan: known instances of the
  exact rec-2923 class), then the r3 entries, with write-convergence-record last as the largest and
  highest-blast-radius. rec-2664 closes via the Resolves trailer.
- 'Report: what was implemented, verification results, and the state of both recs.'
