  this stays a one-off rather than a recurring hand-edit.
- >-
  THE FABLE ADVICE-CONSULT THAT RESHAPED THIS PLAN. An earlier draft addressed only the producer.
  The consult's headline correction: the incident had TWO independent failures, and the consumer
  accepting an empty value is the one that turned a contained reviewer stall into a false
  platform-halting red. A strict consumer ranks above every producer-side control, because a
  consumer that switch-cases on a value and treats "anything unrecognised, including empty" as a
  legitimate branch is a latent bug regardless of how the producer fails. Adopted: strict consumer
  as the centrepiece; ratchet instead of a non-failing advisory (CI warnings have a measured
  half-life of about one sprint before becoming wallpaper); best-effort archival isolated and
  never silent; manual fix attribution; mint the ADR and have the lint message cite it. The
  "write the safe answer first, then overwrite on success" shape already in review.sh has a name --
  fail-safe defaults, Saltzer and Schroeder 1975.
- >-
  DIVERGENCE FROM THE CONSULT, stated rather than buried. It preferred archival as a separate step
  with `continue-on-error`. `continue-on-error` on composite-action steps is a long-standing GitHub
  grey area, so the design instead makes the script TOTAL (always exit 0) and relies only on `if:`,
  which is well-supported on composite steps. Same isolation guarantee, no dependence on contested
  behaviour. It also warned that a separate step needs the transcript handed across a step boundary
  -- here it does not: the files sit in the action's working directory, readable by the next step.
- >-
  TWO DESIGN ERRORS THE SECOND SCOUT ROUND CAUGHT, both corrected in Scope. (i) The assert was
  going to be the action's FIRST step; that would place it ahead of the refused / still-actionable /
