  those four and immediately before the green/red write, where the rec-2923 shape lands anyway.
  (ii) `review-step-outcome: ${{ steps.review.outcome }}` is WRONG at reconcile's call site, which
  already draws its value from the `resolved` aggregator across the saved-plan and DEP-10
  fresh-replan paths -- it would have paired one path's step outcome with the other path's value.
  The aggregator now emits both halves from the same branch. Decision 154 point 4's aggregator ban
  is grounded in the apply-step subset rule and does not reach review steps.
- >-
  ANTI-MASKING ACCOUNT FOR THE NEW REFUSAL BRANCH, required by the scout. When the assert fires the
  step exits non-zero and the record is NOT written, leaving the PRIOR record in place. That is
  behaviourally identical to the already-sanctioned STARVED skip. It is not masked, on three
  independent surfaces: the job goes red in Actions; ci-rca watches the sandbox path and files a
  Critical (Decision 142); and stale_green_backlog escalates at severity=high within roughly two
  hours. Implementation must CONFIRM the backlog escalation actually covers this new branch rather
  than assuming inheritance from the STARVED branch.
- >-
  DECISION 162 SCOPE AND BUDGET. Live `## Decision` header count is 114; minting takes it to 115
  against a 120 ceiling (Decision 134), with the combined byte ceiling at 633,301 of 700,000 and
  Decision 145's live-byte ceiling retired by Decision 160. Headroom is 5 headers -- if it reaches
  ~2, the response is Decision 149's compact-in-place relief valve, not declining to record
  decisions. The entry needs a Significance line citing Decision 150 (the bar it clears: a durable
  repo-wide authoring commitment, guard-enforced, with reversal conditions) and explicit reversal
  conditions naming the revert path (delete the check registration and the baseline file).
- >-
  RATCHET SEEDING, and why it is not a quiet exemption. The baseline is seeded at the state THIS PR
  leaves the repo in, so the change installing the rule is not punished by it -- a one-time
  grandfather in the sense of Decision 130 clause 2, explicitly NOT a precedent. Touch-it-fix-it
  binds from the next edit onward, and the only override is Decision 128's own loud grammar: an
  inline `# raise-approved: dec-NNN <reason>` marker naming a real Decision header. A free-form
  documented escape was the first draft and was rejected by the scout as quieter than the mechanism
  it mirrors.
- >-
  SEQUENCING, deliberate. The narrow rule ships now and the write-convergence-record extraction is
  scheduled separately with an owner. Bundling the highest-blast-radius refactor into incident
  remediation is how remediation changes cause the next incident -- reviewers focus on the new rule
  and wave the refactor through. The original justification -- "a rule that flags nothing on
  arrival is still worth having, and ratchets that start at zero are easiest to keep at zero" --
  was falsified by the plan-critique gate: R1 does NOT start at zero, it starts at two of a
  universe of three output-declaring actions. The surviving and stronger argument is monotonicity:
  the r1 set can only shrink, has no marker escape, and its two members are recorded as known
  instances of the rec-2923 class rather than as ordinary long bodies. A rule that blocks every
  future instance while naming its two legacy ones is worth more than a rule deferred until the
  legacy ones are cleaned up, because the deferral is what lets a third appear.
