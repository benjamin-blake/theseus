- >-
  WHY NO `Resolves: rec-2923` TRAILER. rec-autoclose stamps context_v2_json.fixed_by_sha to the
  MERGE sha. Decision 142 point 3 then decides regression-vs-drop by asking whether a new failure's
  commit is an ancestor of fixed_by_sha. Stamping this plan's merge sha would make that test lie in
