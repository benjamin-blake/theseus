  merge would be classified as a stale duplicate and suppressed. So rec-2923 closes via
  ci-rca-lifecycle.yaml's documented closure_dependency.manual_route with an explicit
  stamp_fixed_by_sha('rec-2923', '0726593...'), and bundled_recommendations deliberately carries
