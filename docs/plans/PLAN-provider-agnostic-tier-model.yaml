# Authored by /plan (planning skill, schema 4). Governance amendment only -- no transport,
# credential or traffic change. The Decision text below is a DRAFT: /implement authors it into
# docs/DECISIONS.md after re-verifying the next free decision number.
schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "provider-agnostic-tier-model"
intent: >-
  Convert the executor inference tier model from vendor-anchored prose into a role-based,
  provider-agnostic commitment -- the tiers are ROLES and provider identity is configuration held in
  docs/contracts/inference-provider.yaml -- so a provider swap is a contract edit rather than a
  Decision amendment, and providers can later become a measured performance variable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-provider-agnostic-tier-model.yaml
phase: >-
  Platform governance -- executor inference-tier model (amends the CD.28 tier ratification and its
  persona-routing rationale; sequenced before the layer-2 substrate comparative spike so the spike's
  inference story needs no provider exception).
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the new numbered Decision (drafted verbatim in execution_steps; number re-verified at
      implement time) and add one dated in-place annotation to Decision 122 and one to Decision 164.
      Neither existing body is rewritten.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the deterministic projection (scripts.decisions_index --write) so the new header and
      the two amended entries are reflected; --check must be clean and the committed file must stay
      under the 112,000-byte index ceiling.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Make the contract the sole home for provider VALUES: tier rows gain role / billing_shape /
      cold_start_assertion / current_provider, the file gains the billing-shape cold-start rule, and
      the litellm_tier_models notes are re-worded as current selections. Adds the required
      amendment_log entry. provider_defaults.executor_path is NOT touched.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Re-home the forward intent: new tier item T4.17 (providers as a measured performance variable),
      an additive Decision-173 annotation on CD.28's discipline_points, and a re-grounding annotation
      plus one config-resolution exit criterion on the LiteLLM-transport tier item.
  - file: tests/provider_agnostic_tier_model/__init__.py
    action: Create
    purpose: Test package marker (tests/CLAUDE.md mirror-package convention -- prepend import mode).
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Create
    purpose: >-
      Mirror tests for every behaviour-capable scope row: contract tier-row role/billing_shape shape
      and the fixed-allowance implication, the untouched valid-provider set, the Decision entry's
      role-based commitment plus its two annotations, and the roadmap re-homing.
  - file: docs/plans/PLAN-provider-agnostic-tier-model.yaml
    action: Create
    purpose: This plan artefact, carrying the drafted Decision text and annotations.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/DECISIONS.md carries one new numbered Decision whose fenced yaml envelope declares
    number/status/decided_date, amends [122, 164], and significance.value: numbered_decision with a
    justification naming BOTH rejected alternatives (the inference-provider.yaml governance-note home
    and a dated amendment_forms annotation) and why each was rejected.
  - >-
    That entry's body states, as separate clauses: the role model (primary / warm-fetched fallback /
    deferred aggregator) with DeepSeek-direct and Anthropic-direct recorded as CURRENT SELECTIONS and
    examples; provider values routed to the contract; Decision 164's argument restated as billing-shape
    and transport-shape claims; the billing-shape cold-start rule; and the T4.2 implementation-gap
    disclosure naming the live scripts/llm/client.py behaviour.
  - >-
    The entry carries a "**Reversal conditions:**" section AND a ```yaml reversal-conditions stanza
    that parses under scripts.preflight.decision_conditions with four manual conditions.
  - >-
    The new entry's block is <= 6,144 bytes; live '## Decision' headers stay <= 132 and
    DECISIONS.md + DECISIONS_ARCHIVE.md combined stay <= 780,000 bytes.
  - >-
    Decisions 122 and 164 each gain exactly one dated "[Amendment 2026-08-19: ...]" annotation naming
    the new decision number, and `git diff origin/main -- docs/DECISIONS.md` shows no removed content
    line anywhere in the file (additive-only edit; no body rewrite).
  - >-
    docs/contracts/inference-provider.yaml: every tier_model.tiers row carries role, billing_shape (in
    the declared vocabulary), cold_start_assertion and current_provider; no row carries a bare
    `provider:` key; the fixed_non_rollover_allowance row declares cold_start_assertion:
    remaining_allowance; the file declares cold_start_assertion_rule; a new amendment_log entry is
    present.
  - >-
    provider_defaults.executor_path.valid_providers stays ["gemini"] and
    scripts/llm/model_registry.py's _VALID_PROVIDERS / _DEFAULT_EXECUTOR_PROVIDER are unmodified --
    validate_inference_provider_registry passes unchanged.
  - >-
    docs/ROADMAP-PLATFORM.yaml: tier item T4.17 exists with >= 4 structured exit criteria and
    depends_on [T4.2]; CD.28 carries the additive Decision-173 annotation with every pre-existing
    discipline point byte-identical; the LiteLLM-transport tier item carries the re-grounding
    annotation and the config-resolution criterion; validate_platform_roadmap passes.
  - >-
    docs/decisions-index.json is regenerated, `scripts.decisions_index --check` exits 0, and the
    committed index stays under 112,000 bytes.
  - >-
    tests/provider_agnostic_tier_model/test_role_based_tier_model.py passes on the finished tree and
    fails on revert of the contract, roadmap or DECISIONS edits (per-test red/green recorded in the
    implement report).
  - >-
    `bin/venv-python -m scripts.validate` completes with exit 0 before the commit, and the post-merge
    `--backfill-decisions-md` records the new dec-NNN row in ops_decisions.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure the new Decision entry against the per-entry authoring cap (number-agnostic match).
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.decisions_md import
      iter_decision_sections; blocks=[b for _,b in
      iter_decision_sections(Path('docs/DECISIONS.md').read_text()) if 'tiers are ROLES' in b];
      assert len(blocks)==1, len(blocks); n=len(blocks[0].encode()); print('entry bytes', n); assert
      n<=6144, n"
    expected: Exactly one matching entry; its byte size prints and is <= 6144.
    fix_if: >-
      Over the cap -> tighten the entry's prose (never raise the cap, and never split the commitment
      across two numbers). Zero or two matches -> the title marker drifted from the drafted text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_size's per-entry cap sub-check already hard-fails any new-in-diff entry over
      6,144 bytes; a registry row would guard the same property a second time.
  - step: 2
    phase: pre-deploy
    action: Run the new mirror tests (contract shape, untouched provider set, Decision text, roadmap re-homing).
    command: bin/venv-python -m pytest tests/provider_agnostic_tier_model/ -q
    expected: All tests pass, including the fixed-allowance -> remaining-allowance implication test.
    fix_if: >-
      A failure names the exact drifted surface (contract row missing role/billing_shape, roadmap item
      absent, annotation missing the new number) -- fix the artefact, never weaken the assertion.
    hermetic: false
    graduation: graduate
    graduation_check_id: inference-tier-rows-role-and-billing-shape
  - step: 3
    phase: pre-deploy
    action: Regenerate the decisions index and confirm the committed projection is fresh.
    command: bin/venv-python -m scripts.decisions_index --write && bin/venv-python -m scripts.decisions_index --check
    expected: --write updates docs/decisions-index.json; --check exits 0 with no drift.
    fix_if: >-
      --check still reports drift -> the working tree changed after --write; re-run both. A generator
      crash means the new entry's envelope or status marker is malformed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_index_freshness is already the standing guard for index drift; this step is
      the regeneration action itself, not a new invariant.
  - step: 4
    phase: pre-deploy
    action: Confirm the regenerated index stays under the committed index-size ceiling.
    command: bin/venv-python -m pytest tests/test_decisions_index.py -q
    expected: Passes, including TestCommittedIndexSizePin (index < 112,000 bytes).
    fix_if: >-
      Size pin breached -> compact a superseded body per Decision 149 rather than raising the pin; the
      new row costs roughly 760 bytes against ~4,600 bytes of headroom measured at plan time.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The committed-index size pin already exists as a test-borne ceiling; duplicating it in the
      verification registry would guard one byte count from two places.
  - step: 5
    phase: pre-deploy
    action: Prove the T4.2-owned valid-provider boundary is untouched by this governance edit.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_inference_provider_registry import
      validate_inference_provider_registry as v; f=[]; v(f); print(f); assert not f, f"
    expected: Empty failure list -- contract provider_defaults and model_registry constants still agree.
    fix_if: >-
      Any failure means the edit touched valid_providers / default or the retired set; revert that
      hunk -- its removal is owned by T4.2, not by this plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_inference_provider_registry is itself the registered standing check; graduating a
      wrapper around it would double-register the same parity assertion.
  - step: 6
    phase: pre-deploy
    action: Validate the roadmap schema and criteria integrity after the new tier item and annotations.
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import
      validate_platform_roadmap as v; f=[]; v(f); assert not f, f"
    expected: No failures -- T4.17 parses, its criteria are structured, depends_on resolves, no cycle.
    fix_if: >-
      A bare-string-criteria failure names the touched item -> convert that item's criteria to
      ExitCriterion objects. A dangling depends_on means the referenced item id is wrong.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap already gates roadmap structure in both tiers; this step invokes that
      guard rather than adding a new invariant.
  - step: 7
    phase: pre-deploy
    action: Confirm the new reversal-conditions stanza is well-formed and monitored.
    command: bin/venv-python -m scripts.preflight.decision_conditions
    expected: One line for the new decision; exit 0 (no MALFORMED stanza anywhere in the corpus).
    fix_if: >-
      MALFORMED -> a required stanza key (decision / review_by / on_trigger / conditions) or a
      condition key (id / kind / description) is missing, or kind is outside {manual, repo_state}.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_reversal_stanzas already gates stanza well-formedness at merge; this step is the local
      pre-commit exercise of the same parser.
  - step: 8
    phase: pre-deploy
    action: Validate this plan document and its registration obligations.
    command: >-
      bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-provider-agnostic-tier-model.yaml
      && bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-provider-agnostic-tier-model.yaml
    expected: Schema PASS, and the obligations report lists one row per behaviour-capable scope file.
    fix_if: A schema error names the offending field; an unlinked obligation names the missing step id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents enforces plan schema and the per-source obligation rule repo-wide; a
      registry row for this one plan file would guard nothing durable.
  - step: 9
    phase: pre-deploy
    action: Prove the DECISIONS.md edit is additive -- no existing body rewritten.
    command: >-
      bash -c 'git fetch origin main --quiet; removed=$(git diff origin/main -- docs/DECISIONS.md |
      grep "^-" | grep -cv "^---"); echo removed=$removed; test "$removed" -eq 0'
    expected: Zero removed lines in docs/DECISIONS.md; exit 0.
    fix_if: >-
      A non-zero count means an existing entry was reworded or reflowed -- restore it and re-apply the
      change as a dated append-only annotation (docs/contracts/decision-entry.yaml amendment_forms).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is against this branch's diff versus origin/main -- transient session state, not a
      property a standing registry check could re-evaluate after merge.
  - step: 10
    phase: pre-deploy
    action: Fast presubmit tier (decision-entry conformance, size governance, graduation completeness).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; the DECISIONS conformance and size checks report PASS on the new entry.
    fix_if: >-
      A conformance failure names the missing envelope field, required marker, or block separator;
      fix the entry, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step invokes the presubmit harness itself; graduating it would make the verification
      registry a caller of validate.py (recursion).
  - step: 11
    phase: pre-deploy
    action: Full presubmit tier before commit, per handoff_policy.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, including the full-tier supersession-annotation and decision-currency guards.
    fix_if: >-
      A supersession-annotation failure means Decision 122 or 164 does not carry the new number --
      add the missing dated annotation. Never revert to green; forward-fix (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion argument as step 10 -- the full tier is the harness this plan is verified by, not
      a candidate registry primitive.
  - step: 12
    phase: post-deploy
    action: Run the DECISIONS.md -> ops_decisions ETL so the new entry lands in the warehouse.
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md
    expected: >-
      Exit 0; the run reports a new SCD2 version for the new dec-NNN and re-projected versions for
      dec-122 / dec-164 (their content hashes changed).
    fix_if: >-
      Portal unreachable -> confirm the chain with `aws sts get-caller-identity --profile
      agent_platform` and re-run. Never edit logs/.decisions-index.jsonl directly (Single Portal
      Invariant); the local JSONL is a read cache, never a write source.
test_obligations:
  - source: docs/contracts/inference-provider.yaml
    behavior: >-
      Every tier row stays role-keyed with a billing_shape from the declared vocabulary, and a
      fixed_non_rollover_allowance tier keeps cold_start_assertion: remaining_allowance.
    verification_step: 2
    test_selector: tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_tier_rows_are_role_keyed_with_billing_shape
    red_green_expectation: >-
      RED before the edit (tier rows carry a bare `provider:` key and no billing_shape /
      cold_start_assertion), GREEN after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      The forward intent keeps an owner: tier item T4.17 exists with structured criteria, the
      LiteLLM-transport item carries the config-resolution criterion, and CD.28 carries the additive
      role-model annotation.
    verification_step: 2
    test_selector: tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_provider_variable_tier_item_and_transport_criterion
    red_green_expectation: RED before the roadmap edit (no T4.17, no criterion, no annotation), GREEN after.
  - source: docs/decisions-index.json
    behavior: >-
      The committed projection stays a fresh, deterministic export of the two decision files after the
      new header and the two annotations land.
    verification_step: 3
    command: bin/venv-python -m scripts.decisions_index --check
    red_green_expectation: >-
      RED before regeneration (--check exits 1 on drift once DECISIONS.md changes), GREEN after
      --write.
constraints:
  - >-
    Governance-record change only: no transport, credential, model or traffic change. Do NOT edit
    scripts/llm/client.py, scripts/llm/model_registry.py or scripts/smoke_test_inference_credentials.py
    -- all three are T4.2-owned (AGENTS.md: out-of-scope bugs become recommendations, not inline fixes).
  - >-
    HARD: do not touch provider_defaults.executor_path.valid_providers / default or
    model_registry._VALID_PROVIDERS / _DEFAULT_EXECUTOR_PROVIDER. validate_inference_provider_registry
    enforces SET EQUALITY between them and disjointness of retired_providers; _VALID_PROVIDERS ==
    {"gemini"} today and its removal is owned by T4.2.
  - >-
    The provider VALUES are re-homed, never deleted: DeepSeek-direct and Anthropic-direct stay in the
    contract as the current selections. This plan removes the redundant prose COPY, not the record of
    what is selected.
  - >-
    Decisions 122 and 164 are amended by dated in-place annotation only -- never rewritten, never
    compacted; no clause of CD.28's discipline_points is reworded (the annotation is additive, matching
    the CD.27 annotation precedent).
  - >-
    Re-verify the next free decision number at implement time (`grep -o '^## Decision [0-9]*'
    docs/DECISIONS.md | sort -n | tail -1`): 173 was free at plan time, but numbers are not reserved
    and a concurrent PR may claim it. Shifting to the next free number is safe -- update the envelope
    `number`, the Warehouse ID line, both annotations, the stanza's `decision:` key, T4.17's
    related_decisions, and every "Decision 173" reference in the contract and roadmap edits together.
  - >-
    Single Portal Invariant: decision/rec writes go only through scripts.ops_data_portal. Never edit
    logs/.decisions-index.jsonl or logs/.recommendations-log.jsonl, and never call sync.ops / ops_writer
    directly.
  - >-
    Decision 67: IMPLEMENTATION plan only; no STRATEGIC scoping. Decision 55: forward-fix, no rescue
    agents, no workaround loops -- an unrecoverable failure stops and files a rec.
  - No emojis anywhere; ASCII hyphens only; ruff line length 127; type hints on new test helpers.
  - >-
    Do NOT bundle any layer-2 substrate-spike (T4.15) work, and do NOT bundle a fix for the open
    ci-rca recs -- see the deferral rationale in context.
context:
  - >-
    OPERATOR DIRECTIVE (verbatim substance, in-session): "the design is meant to be completely
    provider agnostic -- when I made dec-122, the ratification should have specified that the tier 1
    and 2 choices were suggestions for what should have been used at the time. but the point of LiteLLM
    was that we can change models easily as they come out. in fact, providers will become a variable at
    a later date to measure performance metrics. so hardcoding (or formalising in prose) certain
    providers is the wrong approach. we should specify that deepseek and anthropic were examples of a
    primary and fallback mechanism".
  - >-
    CONFIRMATION GATE (planning skill Step 6b): satisfied by that directive, which confirms all three
    decisions this plan rests on -- the CONTENT (role-based tiers; DeepSeek/Anthropic as examples of a
    primary/fallback mechanism), the INSTRUMENT (a numbered Decision rather than a dated in-place
    annotation alone), and the SEQUENCING (this amendment lands BEFORE the layer-2 two-plane substrate
    spike, so that spike's inference story needs no provider exception). No separate AskUserQuestion
    confirmation was solicited; the directive IS the confirmation and is recorded here as such.
  - >-
    CI-RCA DEFERRAL (planning skill Related-Work Check): rec-3211 and rec-3212 are open, unresolved,
    source=ci_rca, priority=critical -- a coverage regression on scripts/platform_roadmap_state.py
    measured at 98.58% against a 100% floor (uncovered lines 115 and 125-126). This plan satisfies none
    of the three related-work conditions: no scope-file overlap (it does not touch
    scripts/platform_roadmap_state.py), no shared Decision Record, and a different failure category
    (pytest coverage regression vs a governance-prose amendment). Deferred deliberately -- they are
    being handled separately, and this plan must not bundle an inline fix (Decision 55 / Decision 72:
    no un-reviewed patching of a ci-rca failure).
  - >-
    Decision-scout verdict + CITE list (verbatim decision ids): decision-scout was NOT RUN by this
    authoring pass -- it is a subagent-dispatch gate owed before merge (planning skill Step 6a). CITE
    list assembled from this session's own targeted reads, all verified against the working tree:
    dec-122, dec-164, dec-116, dec-121, dec-047 (archived), dec-086, dec-127, dec-133, dec-167,
    dec-149, dec-084, dec-055, CD.28, CD.27.
  - >-
    gates: decision-scout=NOT_RUN (owed before merge; re-dispatch in a fresh context per Step 6a);
    plan-critique=NOT_RUN after 0 round(s) (owed before merge; must run zero-context per Step 9).
  - >-
    Size headroom measured at plan time (2026-08-19): the drafted entry is 6,030 bytes against the
    6,144-byte per-entry cap (114 bytes spare -- any prose growth must be paid for by a cut);
    DECISIONS.md + DECISIONS_ARCHIVE.md combined would be 747,146 of 780,000 bytes; live headers 126 of
    132; docs/decisions-index.json 107,367 of 112,000 bytes with a marginal live row costing ~760 bytes.
  - >-
    Why a numbered Decision and not a contract note or a bare annotation (Decision Significance Gate,
    all three property tests): (i) the envelope carries significance.value: numbered_decision plus a
    justification; (ii) the contract home WAS considered -- the provider VALUES do route to
    docs/contracts/inference-provider.yaml, and this plan performs exactly that re-homing -- but the
    commitment "providers are configuration, not architecture" constrains how future DECISIONS may be
    written, which a contract governance note cannot carry; (iii) amendment_forms was considered and
    rejected because this amends TWO entries (122 and 164) and changes what a future provider swap
    REQUIRES (an amendment becomes a config edit), which clears the bar on its own terms. Decision 133
    is the in-corpus precedent for converting a cited-as-given premise into a conscious,
    reversal-conditioned choice; Decision 164 followed that same shape.
  - >-
    Implementation-gap honesty is mandatory (audit finding ESB-02,
    audits/executor-substrate-and-billing-shape-ad02653.yaml): CD.27 recorded a control that did not
    operate, which produced a false dismissal in a later audit. Provider-agnostic is therefore recorded
    as the COMMITMENT with the implementation reaching it at T4.2 -- scripts/llm/client.py raises
    LLMResponseError for any provider except gemini and discards system_prompt today, and no tier
    routing exists in code. Verified in the working tree this session.
  - >-
    Known gap, routed not fixed: scripts/smoke_test_inference_credentials.py hardcodes the two
    provider -> Secrets-Manager-envelope mappings (agent-platform-deepseek-api-key,
    agent-platform-anthropic-api-key) and the two model ids. Under clause 2 that mapping belongs in the
    contract. It is T4.2 transport work and out of scope here -- /implement files a follow-on rec via
    `file_rec` instead of editing it.
  - >-
    Known gap, deliberately untouched: docs/ROADMAP-PLATFORM.yaml's cost_projection block prices
    executor volume in DeepSeek units. Those are MEASUREMENTS of a priced estimate at a date, not an
    architectural commitment, so they stay vendor-specific and are not re-homed by this plan.
  - >-
    Why the roadmap forward intent gets a NEW tier item rather than an exit criterion on an existing
    one: decision-entry.yaml's `work_item` routing row sends durable sequencing work needing
    MVP-boundary classification or criterion lifecycle to a tier_item. The measurement capability is
    post-transport work with its own criteria, so overloading the XL transport item would bury it;
    T4.17 owns it and depends_on the transport item.
  - >-
    Roadmap check (ii) note: validate_platform_roadmap fails any tier_item whose own '- id:' line
    appears in the diff while it still has bare-string criteria. T4.17 is authored with structured
    criteria, so it passes; the transport item's '- id:' line is not in the diff (only its intent block
    and one appended criterion are), so its pre-existing bare-string criteria are not forced into
    conversion by this plan and are left alone.
  - >-
    Class D contract discipline: docs/contracts/inference-provider.yaml is Class D, so
    check_amendment_log_for_class_d FAILS any parsed-content change with no new amendment_log entry --
    the amendment_log row is part of the edit, not optional.
  - >-
    Main divergence: this branch was cut from current origin/main at session start (HEAD fc0fee9, no
    Scope-file overlap observed in the branch diff). If a rebase becomes necessary mid-plan, re-check
    the decision number and the size headroom figures above, both of which move with main.
pre_implementation_checklist:
  - Branch confirmed not on main (harness claude/... session branch)
  - docs/PROJECT_CONTEXT.md read
  - >-
    Only the plan-cited decision sections read (122, 164, 133, 167, 172 for shape; 47 header) -- never
    docs/DECISIONS.md whole (630 KB)
  - >-
    Re-verified the next free '## Decision NNN' number and updated every reference if it moved off 173
  - docs/contracts/decision-entry.yaml significance / metadata_envelope / amendment_forms sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Re-verify the next free decision number: `grep -o '^## Decision [0-9]*' docs/DECISIONS.md | awk
    '{print $3}' | sort -n | tail -1` (172 at plan time, so 173 is the drafted number). If it moved,
    substitute the new number everywhere the drafted text, annotations, stanza, contract and roadmap
    edits mention 173.
  - |
    DECISIONS.md edit 1 of 3 -- append the following entry verbatim (modulo the number re-check) after
    the current highest-numbered entry, preserving the blank line before it and the trailing '---'.
    BEGIN DECISION DRAFT
    ## Decision 173: Executor inference tiers are ROLES -- provider identity is configuration, not architecture; a fallback tier's cold-start assertion follows its billing shape (amends Decision 122 and Decision 164) (Decided)

    ```yaml
