    ```

    **Status:** Decided
    **Date:** 2026-08-19
    **Warehouse ID:** dec-173

    **Problem:**
    Decision 122 ratified the executor tier model in VENDOR terms: it names DeepSeek model ids and their
    scheduled `deepseek-v4-flash` remap, names the Anthropic "Max x5 programmatic pool", and keys both
    reversal conditions to one vendor's unit price and another's pool utilization. Decision 164's rationale
    is anchored the same way (~$0.05/rec on DeepSeek-direct; the fixed, non-rollover Max x5 pool). LiteLLM
    was adopted precisely so models and providers can change as they ship, and provider is expected to
    become a measured performance VARIABLE later -- vendor identity recorded as architecture inverts that,
    making a routine configuration change read as requiring a Decision amendment. Those values are also a
    redundant SECOND copy of `litellm_tier_models` in `docs/contracts/inference-provider.yaml`, content
    Decision 86/127 routes to the owning contract.

    **Intent:** Tier 1 and Tier 2 were the right SELECTIONS at ratification and were EXAMPLES of a
    primary/fallback mechanism, never the architecture. The ROLES are the commitment.

    **Decision:**
    1. **The tiers are ROLES.** Tier 1 = primary route; Tier 2 = independent-vendor warm-fetched fallback
       (Decision 47's lock-in escape hatch), validated at every harness cold start; Tier 3 = deferred
       aggregator. DeepSeek-direct and Anthropic-direct are the CURRENT selections, examples of that
       mechanism, and Decision 122's naming of them is a selection record. Unchanged from that entry:
       LiteLLM as the sole Layer-1 inference surface with provider-SDK imports forbidden, Bedrock retired
       as a substrate, the role pair itself, and its Decision-121 reconciliation.
    2. **Provider VALUES live in the contract, not in prose.** Which provider and model ids fill a tier is
       stated in `docs/contracts/inference-provider.yaml`; changing it is a contract edit needing no
       Decision amendment. It does NOT touch `provider_defaults.executor_path` or
       `scripts/llm/model_registry.py`'s `_VALID_PROVIDERS` / `_DEFAULT_EXECUTOR_PROVIDER` -- the interim
       transport set held in set-equality by `validate_inference_provider_registry`, owned by T4.2.
    3. **Decision 164's argument is restated as SHAPE claims**, which is what lets it survive a swap:
       METERED marginal cost versus a FIXED, NON-ROLLOVER ALLOWANCE, and an HTTP transport
       (runtime-agnostic) versus a CLI transport (needs a CLI-hosting runtime). Neither is a claim about a
       vendor, so that entry's conclusion and its substrate-collapse pricing obligation survive a
       tier-membership change.
    4. **New rule, conditional on billing shape:** a fallback tier billed as a FIXED, NON-ROLLOVER
       ALLOWANCE requires a remaining-allowance assertion at cold start; a METERED fallback requires only a
       credential-liveness probe. This supersedes the ">10% remaining Anthropic pool" wording in CD.28's
       discipline points, now the fixed-allowance INSTANCE of the rule, and makes `billing_shape` a
       contract field.
    5. **Provider-agnostic is the COMMITMENT; the implementation reaches it at T4.2.**
       `scripts/llm/client.py` raises `LLMResponseError` for any provider but `gemini` and discards
       `system_prompt`; no tier routing exists in code until T4.2's LiteLLM transport lands. It moves no
       traffic and edits no transport. Disclosed per ESB-02 in
       `audits/executor-substrate-and-billing-shape-ad02653.yaml`, where a recorded control that did not
       operate produced a false dismissal downstream.

    **Reversal conditions:** each stanza condition below reopens the QUESTION; none pre-decides the
    answer. The price and utilization conditions are Decision 122's own, re-keyed onto role and billing
    shape.

    ```yaml reversal-conditions
    decision: 173
    review_by: 2026-11-19
    on_trigger: "re-decide via /plan whether the role model still holds; update or re-arm this stanza"
    conditions:
      - id: fallback-billing-shape-change
        kind: manual
        description: "Fallback-tier billing changes between metered and fixed-non-rollover-allowance -> re-derive clause 4's cold-start assertion"
      - id: primary-unit-price-move
        kind: manual
        description: "The primary tier's metered unit price moves >5x either way -> re-decide tier membership"
      - id: fixed-allowance-saturation
        kind: manual
        description: "A fixed-non-rollover-allowance fallback sustains >70% utilization over 30 days -> file a rec for overflow capacity"
      - id: single-provider-collapse
        kind: manual
        description: "Only one provider stays reachable behind LiteLLM -> re-decide the role model"
    ```

    **Related:** Decision 122 (amended -- vendor-anchored ratification converted to roles), Decision 164
    (amended -- its volume and substrate argument restated as shape claims), Decision 116 (scheduled-agent
    split, unchanged), Decision 121 (the interim single-provider state clause 5 discloses), Decision 47
    (lock-in lesson; archived), Decision 86 + Decision 127 (values to the owning contract, forward intent
    to a tier_item), Decision 133, Decision 167, Decision 84, Decision 55. CD.28 (ratified as Decision 122;
    its vendor-worded discipline points annotated, never rewritten), tier_items T4.2 and T4.17.

    ---
    END DECISION DRAFT
