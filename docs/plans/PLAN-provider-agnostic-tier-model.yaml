# Authored by /plan (planning skill, schema 4); revised after the decision-scout and plan-critique
# gates returned findings. Governance amendment only -- no transport, credential or traffic change.
# The Decision text below is a DRAFT: /implement authors it into docs/DECISIONS.md after
# re-verifying the next free decision number.
schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "provider-agnostic-tier-model"
intent: >-
  Convert the executor inference tier model from vendor-anchored prose into a role-based,
  provider-agnostic commitment -- the tiers are ROLES and provider identity is configuration held in
  docs/contracts/inference-provider.yaml -- so a provider swap is a contract edit rather than a
  Decision amendment, and providers can later become a measured performance variable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-provider-agnostic-tier-model.yaml
phase: >-
  Platform governance -- executor inference-tier model (amends the CD.28 tier ratification, its
  persona-routing rationale, and the scheduled-agent split's shared-allowance reversal condition;
  sequenced before the layer-2 substrate comparative spike so the spike's inference story needs no
  provider exception).
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the new numbered Decision (drafted verbatim in execution_steps; number re-verified at
      implement time) and add one dated in-place annotation to EACH of Decisions 116, 122 and 164.
      No existing body is rewritten.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the deterministic projection (scripts.decisions_index --write) so the new header and
      the three amended entries are reflected; --check must be clean and the committed file must stay
      under the 112,000-byte index ceiling.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Make the contract the sole home for provider VALUES, with exactly ONE copy of provider identity
      inside the file: tier_model.tiers rows become role-keyed (role / billing_shape /
      cold_start_assertion / selection_ref) and carry NO provider name, while
      model_id_formats.litellm_tier_models becomes the single provider-identity home (gains a
      `provider:` key per tier plus a tier_3 row). Adds cold_start_assertion_rule, the three
      selection_constraints, Decision-173 in decisions_cited, and the required amendment_log entry.
      provider_defaults.executor_path and retired_providers are NOT touched.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Re-home the forward intent: new tier item T4.17 (providers as a measured performance variable)
      carrying the transport config-resolution criterion in STRUCTURED ExitCriterion form, an
      additive Decision-173 annotation on CD.28's discipline_points, and an additive re-grounding
      annotation on T4.2's intent block. Lambda Deployment Assessment: this file is a bundled ASSET
      of the active `data-pipeline` artifact, not handler or include code, so no build/deploy/
      smoke-test step is required and V2 is not escalated to V3 (see the context clause).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Author the graduated registry row verification step 2's `graduation: graduate` disposition
      obligates (Decision 132 implement-PR leg): check_id inference-tier-rows-role-and-billing-shape,
      plan_slug provider-agnostic-tier-model, guard_target docs/contracts/inference-provider.yaml.
      Not Lambda-packaged (config/agent/ is excluded per AGENTS.md / Decision 79).
  - file: tests/provider_agnostic_tier_model/__init__.py
    action: Create
    purpose: Test package marker (tests/CLAUDE.md mirror-package convention -- prepend import mode).
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Create
    purpose: >-
      Mirror tests for every behaviour-capable scope row: contract tier-row role/billing_shape shape
      with the single-provider-identity-home, vendor-independence and retired-providers invariants;
      the billing-shape cold-start implication in BOTH directions; the untouched valid-provider set;
      the Decision entry's role-based commitment plus its three annotations; the roadmap re-homing;
      and the graduated registry row.
  - file: docs/plans/PLAN-provider-agnostic-tier-model.yaml
    action: Create
    purpose: This plan artefact, carrying the drafted Decision text and annotations.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/DECISIONS.md carries one new numbered Decision whose fenced yaml envelope declares
    number/status/decided_date, amends [116, 122, 164], and significance.value: numbered_decision
    with a justification naming BOTH rejected alternatives (the inference-provider.yaml
    governance-note home and a dated amendment_forms annotation) and why each was rejected.
  - >-
    That entry's body states, as separate clauses: the role model (primary / independent-vendor
    warm-fetched fallback / deferred aggregator) with DeepSeek-direct and Anthropic-direct recorded
    as CURRENT SELECTIONS and examples; provider values routed to the contract WITH all three limits
    (no retired_providers id may fill a role; primary and fallback must resolve to different
    providers; a swap changing the vendor or billing shape under Decision 116's shared-allowance
    coupling re-arms Decisions 116's and 164's reversal conditions and owes a dated annotation on
    both); Decision 164's argument restated as billing-shape and transport-shape claims with its
    condition (c) re-read onto the primary role's metered unit price; the billing-shape cold-start
    rule INCLUDING the Deferred-tier not_applicable case; and the T4.2 implementation-gap disclosure
    naming the live scripts/llm/client.py behaviour.
  - >-
    The entry carries a "**Reversal conditions:**" section AND a ```yaml reversal-conditions stanza
    that parses under scripts.preflight.decision_conditions with four manual conditions.
  - >-
    The new entry's block is <= 6,144 bytes; live '## Decision' headers stay <= 132 and
    DECISIONS.md + DECISIONS_ARCHIVE.md combined stay <= 780,000 bytes.
  - >-
    Decisions 116, 122 and 164 each gain exactly one dated "[Amendment 2026-08-19: ...]" annotation
    naming the new decision number, and `git diff origin/main -- docs/DECISIONS.md` shows no removed
    content line anywhere in the file (additive-only edit; no body rewrite). The 164 annotation
    re-reads its condition (c) onto the primary role's metered unit price and its condition (a) onto
    the fallback role's fixed-non-rollover allowance; the 116 annotation re-keys its shared-Max-pool
    condition onto that same allowance while leaving the scheduled-agent split itself unchanged.
  - >-
    docs/contracts/inference-provider.yaml: every tier_model.tiers row carries role, billing_shape
    (in the declared vocabulary), cold_start_assertion and selection_ref; NO tier row carries a
    `provider:` or `current_provider:` key (provider identity has exactly one home,
    model_id_formats.litellm_tier_models, which now carries a `provider:` key per tier and a tier_3
    row); the fixed_non_rollover_allowance row declares cold_start_assertion: remaining_allowance;
    the file declares cold_start_assertion_rule and the three selection_constraints
    (retired_providers_excluded, vendor_independence, coupled_reversal_conditions); the primary and
    fallback selection_refs resolve to DIFFERENT providers, neither of them a retired_providers id;
    a new amendment_log entry is present whose change_class names the reshape (fields added, the
    tier rows' bare `provider:` key removed, tier 3's name openrouter -> aggregator) with
    semantic_break: false, since no code reads tier_model.
  - >-
    provider_defaults.executor_path.valid_providers stays ["gemini"] and
    scripts/llm/model_registry.py's _VALID_PROVIDERS / _DEFAULT_EXECUTOR_PROVIDER are unmodified --
    validate_inference_provider_registry passes unchanged, and retired_providers is byte-identical.
  - >-
    docs/ROADMAP-PLATFORM.yaml: tier item T4.17 exists with >= 5 structured ExitCriterion entries
    (one of them the transport config-resolution criterion) and depends_on [T4.2]; CD.28 carries the
    additive Decision-173 annotation with every pre-existing discipline point byte-identical; tier
    item T4.2 (by that literal id) carries the additive Decision-173 re-grounding paragraph in its
    intent block and its exit_criteria list is byte-identical (no criterion added, none converted);
    validate_platform_roadmap passes.
  - >-
    config/agent/verification_registry/registry.yaml carries a NEW row with check_id
    inference-tier-rows-role-and-billing-shape and plan_slug provider-agnostic-tier-model whose
    check_spec node_id names test_tier_rows_are_role_keyed_with_billing_shape, and that row passes
    validate_verification_registry's differential admission gate (fails on origin/main, passes on
    HEAD).
  - >-
    docs/decisions-index.json is regenerated, `scripts.decisions_index --check` exits 0, and the
    committed index stays under 112,000 bytes.
  - >-
    tests/provider_agnostic_tier_model/test_role_based_tier_model.py passes on the finished tree and
    fails on revert of the contract, roadmap, registry or DECISIONS edits (per-test red/green
    recorded in the implement report).
  - >-
    `bin/venv-python -m scripts.validate` completes with exit 0 before the commit, and the post-merge
    `--backfill-decisions-md` records the new dec-NNN row in ops_decisions.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure the new Decision entry against the per-entry authoring cap (number-agnostic match).
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.decisions_md import
      iter_decision_sections; blocks=[b for _,b in
      iter_decision_sections(Path('docs/DECISIONS.md').read_text()) if 'tiers are ROLES' in b];
      assert len(blocks)==1, len(blocks); n=len(blocks[0].encode()); print('entry bytes', n); assert
      n<=6144, n"
    expected: Exactly one matching entry; its byte size prints and is <= 6144.
    fix_if: >-
      Over the cap -> tighten the entry's prose (never raise the cap, and never split the commitment
      across two numbers). Zero or two matches -> the title marker drifted from the drafted text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_size's per-entry cap sub-check already hard-fails any new-in-diff entry over
      6,144 bytes; a registry row would guard the same property a second time.
  - step: 2
    phase: pre-deploy
    action: >-
      Run the new mirror tests (contract shape and its three selection invariants, the billing-shape
      implication both ways, the untouched provider set, the Decision text and its three annotations,
      the roadmap re-homing, the graduated registry row).
    command: bin/venv-python -m pytest tests/provider_agnostic_tier_model/ -q
    expected: All six tests pass, including the fixed-allowance -> remaining-allowance implication.
    fix_if: >-
      A failure names the exact drifted surface (tier row missing role/billing_shape, a tier row
      still carrying a provider name, primary and fallback resolving to one vendor, a role filled
      from retired_providers, T4.17 absent, an annotation missing the new number, registry row
      absent) -- fix the artefact, never weaken the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: inference-tier-rows-role-and-billing-shape
  - step: 3
    phase: pre-deploy
    action: Regenerate the decisions index and confirm the committed projection is fresh.
    command: bin/venv-python -m scripts.decisions_index --write && bin/venv-python -m scripts.decisions_index --check
    expected: --write updates docs/decisions-index.json; --check exits 0 with no drift.
    fix_if: >-
      --check still reports drift -> the working tree changed after --write; re-run both. A generator
      crash means the new entry's envelope or status marker is malformed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_index_freshness is already the standing guard for index drift; this step is
      the regeneration action itself, not a new invariant.
  - step: 4
    phase: pre-deploy
    action: Confirm the regenerated index stays under the committed index-size ceiling.
    command: bin/venv-python -m pytest tests/test_decisions_index.py -q
    expected: Passes, including TestCommittedIndexSizePin (index < 112,000 bytes).
    fix_if: >-
      Size pin breached -> compact a superseded body per Decision 149 rather than raising the pin; the
      new row costs roughly 980 bytes against ~4,600 bytes of headroom measured at plan time.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The committed-index size pin already exists as a test-borne ceiling; duplicating it in the
      verification registry would guard one byte count from two places.
  - step: 5
    phase: pre-deploy
    action: Prove the T4.2-owned valid-provider boundary and the retired set are untouched by this edit.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_inference_provider_registry import
      validate_inference_provider_registry as v; f=[]; v(f); print(f); assert not f, f"
    expected: Empty failure list -- contract provider_defaults and model_registry constants still agree.
    fix_if: >-
      Any failure means the edit touched valid_providers / default or the retired set; revert that
      hunk -- its removal is owned by T4.2, not by this plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_inference_provider_registry is itself the registered standing check; graduating a
      wrapper around it would double-register the same parity assertion.
  - step: 6
    phase: pre-deploy
    action: Validate the roadmap schema and criteria integrity after the new tier item and annotations.
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import
      validate_platform_roadmap as v; f=[]; v(f); assert not f, f"
    expected: No failures -- T4.17 parses, its criteria are structured, depends_on resolves, no cycle.
    fix_if: >-
      A bare-string-criteria failure names the touched item -> convert that item's criteria to
      ExitCriterion objects. A dangling depends_on means the referenced item id is wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap already gates roadmap structure in both tiers; this step invokes that
      guard rather than adding a new invariant.
  - step: 7
    phase: pre-deploy
    action: Confirm the new reversal-conditions stanza is well-formed and monitored.
    command: bin/venv-python -m scripts.preflight.decision_conditions
    expected: One line for the new decision; exit 0 (no MALFORMED stanza anywhere in the corpus).
    fix_if: >-
      MALFORMED -> a required stanza key (decision / review_by / on_trigger / conditions) or a
      condition key (id / kind / description) is missing, kind is outside {manual, repo_state}, or
      the stanza's `decision:` value disagrees with the heading number.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_reversal_stanzas already gates stanza well-formedness at merge; this step is the local
      pre-commit exercise of the same parser.
  - step: 8
    phase: pre-deploy
    action: Validate this plan document and its registration obligations.
    command: >-
      bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-provider-agnostic-tier-model.yaml
      && bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-provider-agnostic-tier-model.yaml
    expected: Schema PASS, and the obligations report lists one row per behaviour-capable scope file.
    fix_if: A schema error names the offending field; an unlinked obligation names the missing step id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents enforces plan schema and the per-source obligation rule repo-wide; a
      registry row for this one plan file would guard nothing durable.
  - step: 9
    phase: pre-deploy
    action: Prove the DECISIONS.md edit is additive -- no existing body rewritten.
    command: >-
      bash -c 'git fetch origin main --quiet; removed=$(git diff origin/main -- docs/DECISIONS.md |
      grep "^-" | grep -cv "^---"); echo removed=$removed; test "$removed" -eq 0'
    expected: Zero removed lines in docs/DECISIONS.md; exit 0.
    fix_if: >-
      A non-zero count means an existing entry was reworded or reflowed -- restore it and re-apply the
      change as a dated append-only annotation (docs/contracts/decision-entry.yaml amendment_forms).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is against this branch's diff versus origin/main -- transient session state, not a
      property a standing registry check could re-evaluate after merge.
  - step: 10
    phase: pre-deploy
    action: >-
      Run the differential admission gate over the newly-added verification-registry row (Decision
      132 / VF-06 c2).
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_verification_registry import
      validate_verification_registry as v; f=[]; v(f); assert not f, f"
    expected: >-
      The new row is reported admitted -- the named test node fails in an origin/main worktree and
      passes on HEAD.
    fix_if: >-
      "not admitted -- revert did not produce FAIL (tautological)" means the assertion does not
      actually depend on the contract edit; strengthen the test. A schema error names the missing
      registry field.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Not replayable and not registrable: this step materializes a real origin/main git worktree and
      re-runs pytest inside it, so it is neither hermetic nor a candidate registry primitive --
      validate_verification_registry IS the standing registered guard it invokes.
  - step: 11
    phase: pre-deploy
    action: Fast presubmit tier (decision-entry conformance, size governance, graduation completeness).
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; the DECISIONS conformance and size checks report PASS on the new entry.
    fix_if: >-
      A conformance failure names the missing envelope field, required marker, or block separator;
      fix the entry, never the check. A graduation-completeness failure means the registry row's
      (plan_slug, check_id) pair does not match step 2's declared graduation_check_id.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step invokes the presubmit harness itself; graduating it would make the verification
      registry a caller of validate.py (recursion).
  - step: 12
    phase: pre-deploy
    action: Full presubmit tier before commit, per handoff_policy.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, including the full-tier supersession-annotation and decision-currency guards.
    fix_if: >-
      A supersession-annotation failure means Decision 116, 122 or 164 does not carry the new number
      -- add the missing dated annotation. Never revert to green; forward-fix (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion argument as step 11 -- the full tier is the harness this plan is verified by, not
      a candidate registry primitive.
  - step: 13
    phase: post-deploy
    action: Run the DECISIONS.md -> ops_decisions ETL so the new entry lands in the warehouse.
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md
    expected: >-
      Exit 0; the run reports a new SCD2 version for the new dec-NNN and re-projected versions for
      dec-116 / dec-122 / dec-164 (their content hashes changed).
    fix_if: >-
      Portal unreachable -> confirm the chain with `aws sts get-caller-identity --profile
      agent_platform` and re-run. Never edit logs/.decisions-index.jsonl directly (Single Portal
      Invariant); the local JSONL is a read cache, never a write source.
test_obligations:
  - source: docs/contracts/inference-provider.yaml
    behavior: >-
      Every tier row stays role-keyed with a billing_shape from the declared vocabulary and a
      selection_ref instead of a provider name; a fixed_non_rollover_allowance tier keeps
      cold_start_assertion: remaining_allowance; the primary and fallback roles resolve to different
      providers; and no role resolves to a retired_providers id.
    verification_step: 2
    test_selector: tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_tier_rows_are_role_keyed_with_billing_shape
    red_green_expectation: >-
      RED before the edit (tier rows carry a bare `provider:` key and no role / billing_shape /
      cold_start_assertion / selection_ref), GREEN after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      The forward intent keeps an owner: tier item T4.17 exists with structured criteria including
      the transport config-resolution criterion, tier item T4.2 carries the re-grounding annotation
      with its exit_criteria untouched, and CD.28 carries the additive role-model annotation.
    verification_step: 2
    test_selector: tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_provider_variable_tier_item_and_transport_criterion
    red_green_expectation: RED before the roadmap edit (no T4.17, no criterion, no annotation), GREEN after.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      The graduated row verification step 2's `graduate` disposition obligates exists and is
      well-formed: check_id inference-tier-rows-role-and-billing-shape, plan_slug
      provider-agnostic-tier-model, primitive_slot test_selector, and a check_spec node_id naming the
      contract-shape test.
    verification_step: 2
    test_selector: tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_graduated_registry_row_matches_declared_disposition
    red_green_expectation: >-
      RED before the row is authored (no entry with that (plan_slug, check_id) pair), GREEN after.
      Verification step 10 separately proves the row clears differential admission.
  - source: docs/decisions-index.json
    behavior: >-
      The committed projection stays a fresh, deterministic export of the two decision files after the
      new header and the three annotations land.
    verification_step: 3
    command: bin/venv-python -m scripts.decisions_index --check
    red_green_expectation: >-
      RED before regeneration (--check exits 1 on drift once DECISIONS.md changes), GREEN after
      --write.
constraints:
  - >-
    Governance-record change only: no transport, credential, model or traffic change. Do NOT edit
    scripts/llm/client.py, scripts/llm/model_registry.py or scripts/smoke_test_inference_credentials.py
    -- all three are T4.2-owned (AGENTS.md: out-of-scope bugs become recommendations, not inline fixes).
  - >-
    HARD: do not touch provider_defaults.executor_path.valid_providers / default or
    model_registry._VALID_PROVIDERS / _DEFAULT_EXECUTOR_PROVIDER. validate_inference_provider_registry
    enforces SET EQUALITY between them and disjointness of retired_providers; _VALID_PROVIDERS ==
    {"gemini"} today and its removal is owned by T4.2. retired_providers itself stays byte-identical --
    the new Decision only forbids filling a tier ROLE from it.
  - >-
    Nothing is deleted from any prose record. Authority for the provider values MOVES to
    docs/contracts/inference-provider.yaml, and every existing prose copy stays byte-identical and is
    annotated rather than rewritten: Decision 122's body, Decision 164's body, Decision 116's body,
    T4.2's intent paragraph naming Tier 1 = DeepSeek-direct / Tier 2 = Anthropic-direct / Tier 3 =
    OpenRouter, and CD.28's discipline points. The ONLY removed keys anywhere are the bare `provider:`
    key on the three tier_model.tiers rows (whose value moves into litellm_tier_models, the single
    provider-identity home) -- verification step 9 asserts zero removed lines in docs/DECISIONS.md.
  - >-
    Decisions 116, 122 and 164 are amended by dated in-place annotation only -- never rewritten, never
    compacted; no clause of CD.28's discipline_points is reworded (the annotation is additive, matching
    the CD.27 annotation precedent).
  - >-
    Do NOT convert T4.2's six bare-string exit criteria to ExitCriterion objects and do NOT append a
    criterion to them -- four live guards in tests/esb_text_fix/ pin that list bare and index
    exit_criteria[0] as a string (test_resume_property_vocabulary.py::test_t42_criteria_remain_bare_strings,
    ::test_c1_asserts_workspace_continuity_and_names_no_backing_store, ::test_property_bound_sites_...,
    ::test_nine_de_mechanised_sites_...), and CD.27's maturity-monitoring discipline point quotes c1
    verbatim. T4.2 receives the additive intent annotation ONLY; the config-resolution criterion is
    homed on T4.17 in structured form instead (see context).
  - >-
    Re-verify the next free decision number at implement time (`grep -o '^## Decision [0-9]*'
    docs/DECISIONS.md | sort -n | tail -1`): 173 was free at plan time (highest live header 172), but
    numbers are not reserved and a concurrent PR may claim it. Shifting to the next free number is
    safe -- update the envelope `number`, the Warehouse ID line, all THREE annotations, the stanza's
    `decision:` key, T4.17's related_decisions, and every "Decision 173" reference in the contract and
    roadmap edits together.
  - >-
    Single Portal Invariant: decision/rec writes go only through scripts.ops_data_portal. Never edit
    logs/.decisions-index.jsonl or logs/.recommendations-log.jsonl, and never call sync.ops / ops_writer
    directly.
  - >-
    Decision 67: IMPLEMENTATION plan only; no STRATEGIC scoping. Decision 55: forward-fix, no rescue
    agents, no workaround loops -- an unrecoverable failure stops and files a rec.
  - No emojis anywhere; ASCII hyphens only; ruff line length 127; type hints on new test helpers.
  - >-
    Do NOT bundle any layer-2 substrate-spike (T4.15) work, and do NOT bundle a fix for the open
    ci-rca recs -- see the deferral rationale in context.
context:
  - >-
    OPERATOR DIRECTIVE (verbatim substance, in-session): "the design is meant to be completely
    provider agnostic -- when I made dec-122, the ratification should have specified that the tier 1
    and 2 choices were suggestions for what should have been used at the time. but the point of LiteLLM
    was that we can change models easily as they come out. in fact, providers will become a variable at
    a later date to measure performance metrics. so hardcoding (or formalising in prose) certain
    providers is the wrong approach. we should specify that deepseek and anthropic were examples of a
    primary and fallback mechanism".
  - >-
    CONFIRMATION GATE (planning skill Step 6b): satisfied by that directive, which confirms all three
    decisions this plan rests on -- the CONTENT (role-based tiers; DeepSeek/Anthropic as examples of a
    primary/fallback mechanism), the INSTRUMENT (a numbered Decision rather than a dated in-place
    annotation alone), and the SEQUENCING (this amendment lands BEFORE the layer-2 two-plane substrate
    spike, so that spike's inference story needs no provider exception). No separate AskUserQuestion
    confirmation was solicited; the directive IS the confirmation and is recorded here as such.
  - >-
    gates: decision-scout=FLAGS_FOUND (run in a fresh context, 1 round); plan-critique=REVISE (run in
    a fresh context, 1 round). Both dispatched against the pre-revision plan; this revision applies
    their findings. Re-dispatch is not owed unless the plan changes again materially.
