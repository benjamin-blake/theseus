rollback: >-
  Every change is additive or a pure regex/contract edit on a read path; no warehouse write, no
  infrastructure, no deploy. Reverting the commit restores the prior extractor behavior and index
  content exactly. The one corpus edit (Decision 146's trailer) is an append-only annotation that
  reverts cleanly with it. Projection nuance: the ELEVEN corrected related_decisions rows never reach
  ops_decisions in either direction (content-hash gating leaves them unchanged), and Decision 160's
  amends value lives only in the regenerated index file -- but Decision 146 is the exception, since
  its trailer changes its own raw_block and therefore its content_hash, so dec-146 WILL re-project
  at the next backfill carrying the corrected parse. That is benign and arguably desirable; a
  revert would simply re-project it again with the trailer removed.
