schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-extractor-grammar-fixes"
intent: >-
  Close audit finding CFG-06 by fixing the decision-corpus typed-extractor grammar divergences as a
  class: state each typed extractor's continuation forms and terminator set in
  docs/contracts/decision-entry.yaml, repoint the extractors at named constants derived from that
  statement, and pin the contract-to-code linkage with tests so the next divergence fails CI instead
  of silently corrupting a warehouse column.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-extractor-grammar-fixes.yaml
phase: >-
  Platform hardening -- decision-corpus contract fidelity. Audit finding CFG-06
  (audits/contract-first-governance-33c8667.yaml, merged). No tier_item: this is the ad_hoc_rec
  soft-warn exception category (rec-2971 / rec-2990 / rec-2991), so the Tier Item Freshness Gate
  does not fire.
scope:
  - file: scripts/decisions_md.py
    action: Modify
    purpose: >-
      Replace three ad-hoc inline lookaheads with two named terminator constants
      (_MARKER_SECTION_TERMINATOR for prose marker sections, _TYPED_ID_LIST_TERMINATOR for typed
      id-list fields) and widen the title-relation continuation grammar so comma- and
      and-separated citations with repeated "Decision" tokens parse.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Add the field_grammar section (per-extractor continuation forms, terminator sets, qualifier
      forms, known_divergent_grammars, projection-residue note) and the block_separator section;
      extend shared_parser_note to cover field extractors, not just header grammar; and RESTATE
      amendment_forms as a general blockquote-annotation rule with non-exhaustive examples, rather
      than the closed two-shape list it declares today.
  - file: tests/test_decision_field_grammar.py
    action: Create
    purpose: >-
      Contract-derived property tests: load field_grammar from decision-entry.yaml and assert the
      parser honours every declared accepted/rejected form, and that the module's terminator
      constants equal the contract's stated regexes (contract-to-code drift becomes a CI failure).
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Add the block_separator sub-check, reading the rule from decision-entry.yaml and applying it
      to new-in-diff decision numbers only, alongside the existing required_markers sub-check.
  - file: tests/checks/decisions/test_validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Cover the block_separator sub-check via the existing root / baseline_reader injection seams:
      a new-in-diff entry missing the separator FAILS, one carrying it PASSES, and the historical
      band stays grandfathered.
  - file: tests/test_decisions_md.py
    action: Modify
    purpose: >-
      Coverage-gate relief valve only. validate_test_coverage (full tier) measures
      scripts/decisions_md.py by running ONLY this mapped test file, which currently sits at
      exactly 100 percent with no config/coverage_baseline.yaml entry. If the decisions_md.py edits
      introduce any statement this file does not reach, add the minimal covering case HERE. It has
      exactly 12 SLOC of headroom before the 500 unregistered cap (488 measured). If more than 12
      is required, STOP and re-plan: decomposing this 610-line, 16-class module is out of scope
      here and has no execution or verification step, and a budget raise is forbidden (Decision
      128 / 165, no authorizing Decision). Do NOT relocate the contract-derived property tests into
      this file; they belong in tests/test_decision_field_grammar.py.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add a dated [Amendment ...] trailer to Decision 146 naming Decision 160, closing the dangling
      forward pointer the widened amends grammar exposes (option 3b).
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate; Decision 160's amends row becomes [134, 145, 146] (sorted by
      scripts/decisions_index.py:173, not the parser's first-occurrence order).
bundled_recommendations:
  - rec-2971
  - rec-2990
  - rec-2991
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    extract_amends_edges parses all four continuation forms (", N" / ", Decision N" / "and N" /
    "and Decision N"), so Decision 160's real title yields [145, 134, 146]; and all four rejection
    forms still reject (the "mirrors" clause boundary, the "2nd amendment" ordinal, the inverse
    "as amended by", and the CD.NN namespace).
  - >-
    Decision 160's row in docs/decisions-index.json records amends [134, 145, 146]. The index
    SORTS (scripts/decisions_index.py:173), so the row order differs from the parser's
    first-occurrence order [145, 134, 146] -- both are correct at their own layer. CFG-06's own
    acceptance text states the parser order for the index row; it is wrong and is not inherited.
  - >-
    _extract_related_decisions terminates at the GENERAL blockquote-annotation rule ("\n> **",
    covering every observed and future annotation spelling) plus the non-blockquote "[Amendment "
    form, so all ELEVEN affected entries drop their trailer-borne ids exactly: 60 loses 73; 62
    loses 73, 81 and 74; 68 loses 73; 71 loses 73; 74 loses 112; 87 loses 103; 89 loses 83; 103
    loses 103; 105 loses 150; 116 loses 164 and 122; 122 loses 164. Cross-checked against an
    INDEPENDENT paragraph-break rule ("\n\n"), which agrees on all 146 rows -- so the general rule
    is not over-greedy.
  - >-
    Decision 146's related_decisions is unchanged by its new trailer and does NOT absorb 160 --
    the plan's own corpus edit is a live regression case for rec-2990.
  - >-
    A fixture Intent section carrying a dated in-section accretion keeps that accretion in the
    typed intent value (Decision 151 clause 3(ii) forward-compatibility; the prose terminator set
    deliberately excludes the amendment openers).
  - >-
    docs/contracts/decision-entry.yaml carries a field_grammar section naming both terminator sets
    with their per-set justification, a block_separator section, an amendment_forms entry stating
    the GENERAL blockquote-annotation rule with non-exhaustive examples, and a shared_parser_note
    that names the field extractors rather
    than only the header grammar -- all asserted against the REAL contract by VP step 12, not only
    against step 6's synthetic fixture.
  - >-
    tests/test_decision_field_grammar.py fails if either terminator constant in
    scripts/decisions_md.py diverges from the regex the contract states.
  - >-
    validate_decision_entry_conformance fails a new-in-diff entry whose block lacks the trailing
    separator and passes one that carries it, with the 21-entry historical band grandfathered.
  - >-
    Decision 146's block contains the literal "Decision 160" (satisfying _is_annotated) and
    extract_supersession_edges reports no new edge originating at 146.
  - >-
    docs/decisions-index.json is byte-identical to a fresh build_index(), and exactly one row
    (Decision 160) differs from the pre-change index.
  - >-
    docs/contracts/decision-entry.yaml stays under the Decision 166 contracts-class budget: fewer
    than 500 effective lines and longest line under 2000 chars, with no budget raise.
  - >-
    Both presubmit tiers exit 0: `bin/venv-python -m scripts.validate --pre` (step 10) and the FULL
    `bin/venv-python -m scripts.validate` (step 13), the latter being the only tier that exercises
    validate_decision_entry_conformance, validate_supersession_annotations and validate_test_coverage.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the widened title-relation grammar against all four accepted continuation forms
      (including Decision 160's real title) and all four rejection forms.
    command: >-
      bin/venv-python -c 'from scripts.decisions_md import extract_amends_edges as e;
      cases=[("amends Decision 145, Decision 134 clause 2, and Decision 146",[145,134,146]),
      ("amends Decision 122, 116",[122,116]),("amends Decision 122 and Decision 116",[122,116]),
      ("amends Decision 122 and 116",[122,116]),("amends Decision 104, mirrors Decision 132",[104]),
      ("amends Decision 73, 2nd amendment; builds on 80/104/124/131",[73]),
      ("as amended by Decision 116",[]),("amends CD.28 clause 3",[])];
      bad=[(t,e(t),x) for t,x in cases if e(t)!=x]; assert not bad, bad; print("PASS",len(cases))'
    expected: "Prints PASS 8; exit 0."
    fix_if: >-
      A rejection case returning extra ids means the continuation regex is over-greedy (it must
      stop at a non-Decision word, an ordinal, or a bare slash-list); an accepted case returning
      a short list means the repeated-Decision-token or bare-number branch is missing.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-amends-continuation-grammar
  - step: 2
    phase: pre-deploy
    action: Confirm the regenerated index records Decision 160's full amends edge set.
    command: >-
      bin/venv-python -c 'import json;
      rows={d["number"]:d for d in json.load(open("docs/decisions-index.json"))["decisions"]};
      a=rows[160]["amends"]; assert a==[134,145,146], a; print("PASS",a)'
    expected: "Prints PASS [134, 145, 146]; exit 0 -- SORTED, unlike step 1's parser-level order."
    fix_if: >-
      Still [145] means the index was not regenerated after the parser fix -- rerun the
      regeneration step rather than hand-editing the JSON.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins one corpus row rather than a property; step 1 graduates the general grammar that
      produces it. Graduating this would fail on any legitimate future re-titling of Decision 160,
      converting a routine authoring edit into a CI break.
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm the typed-id-list terminator drops exactly the trailer-borne ids on all eleven
      affected entries, and that Decision 146 does not absorb 160 from the trailer this plan adds.
    command: >-
      bin/venv-python -c 'from scripts.decisions_md import parse_decisions_md;
      r={x["decision_id"]:x for x in parse_decisions_md()};
      exp={60:[48,51,78,55,57],62:[57,60],68:[36,37,60],71:[68],74:[68,72,73],
      87:[84,85,76,81,86,69,78,70,75,57],89:[60,68],103:[70,84,88,55],
      105:[90,84,92,103,104,76,86],116:[49,52,117],122:[116,49,121,47,84,105,40]};
      bad={n:(r[n]["related_decisions"],v) for n,v in exp.items() if r[n]["related_decisions"]!=v};
      assert not bad, bad; assert 160 not in r[146]["related_decisions"], r[146]["related_decisions"];
      print("PASS", len(exp))'
    expected: "Prints PASS 11; exit 0. All eleven trailer-affected rows match, including 60/62/68/71."
    fix_if: >-
      A retained trailer id means the terminator is enumerating spellings again instead of using
      the general "\\n> \\*\\*" rule -- rows 60/62/68/71 depend on the general form and are exactly
      what a closed opener list misses. A missing legitimate id means the terminator fires inside
      the Related line itself (check the "\\n" anchor).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts today's exact corpus contents, which legitimately change whenever an author edits a
      Related line. The durable property (a trailer never contributes ids) is graduated via step 5.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the Decision 151 clause 3(ii) forward-compatibility case: an Intent section carrying a
      dated in-section accretion retains it in the typed intent value.
    command: >-
      bin/venv-python -m pytest
      tests/test_decision_field_grammar.py::test_intent_retains_dated_in_section_accretion -q
    expected: "1 passed."
    fix_if: >-
      A truncated intent means the amendment openers leaked into _MARKER_SECTION_TERMINATOR. The
      prose set must NOT terminate on them -- Decision 151 requires Intent clarifications to
      accrue inside the section and remain part of the typed value.
    hermetic: false
    graduation: graduate
    graduation_check_id: decision-intent-accretion-preserved
  - step: 5
    phase: pre-deploy
    action: >-
      Run the full contract-derived property suite: every accepted/rejected form the contract
      declares, plus the constant-to-contract pin.
    command: bin/venv-python -m pytest tests/test_decision_field_grammar.py -q
    expected: >-
      All tests pass. Cases are DERIVED from the contract (parametrised over field_grammar), so
      coverage of declared forms is structural rather than asserted. Crucially the suite includes a
      CROSS-RULE AGREEMENT property: the production _TYPED_ID_LIST_TERMINATOR must agree, on all
      146 corpus entries, with an independently-implemented paragraph-break rule ("\\n\\n"). That
      property fails on ANY future unlisted annotation spelling, which a hard-coded opener count
      cannot -- it is what would have caught rows 89/105 and 60/62/68/71 at planning time.
    fix_if: >-
      A pin failure means scripts/decisions_md.py and decision-entry.yaml disagree -- fix whichever
      is wrong, never loosen the assertion to make them agree. A cross-rule disagreement means the
      corpus grew an annotation shape the terminator does not cover: widen the GENERAL rule, never
      append another special-case opener. SEPARATELY, if the
      full tier's validate_test_coverage later fails on scripts/decisions_md.py, the cause is that
      it measures coverage by running ONLY tests/test_decisions_md.py (100 percent today, no
      baseline entry) -- add the minimal covering case to that file, which is in scope for exactly
      this purpose.
    hermetic: false
    graduation: graduate
    graduation_check_id: decision-field-grammar-contract-pin
  - step: 6
    phase: pre-deploy
    action: >-
      Dogfood the block_separator sub-check through the existing root / baseline_reader injection
      seams (this plan mints no Decision, so the check is vacuous against the live corpus).
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py -q
    expected: "All tests pass, including the new missing-separator FAIL and carries-separator PASS cases."
    fix_if: >-
      If the missing-separator case passes, the sub-check is not reached (confirm it runs per
      new-in-diff number, alongside _missing_markers, not only when markers are absent). If an
      EXISTING test breaks instead, the likely cause is the fixture: _CONTRACT_YAML carries no
      block_separator key, and test_contract_missing_required_markers_key_fails asserts
      len(failed) == 1. Decide deliberately whether a missing block_separator key is its own
      failure or a tolerated absence, then update the fixture or the assertion to match -- do not
      silently relax the count.
    hermetic: false
    graduation: graduate
    graduation_check_id: decision-block-separator-forward-enforced
  - step: 7
    phase: pre-deploy
    action: Confirm the contract edit stays inside the Decision 166 contracts-class budget.
    command: >-
      bin/venv-python -c 'from pathlib import Path;
      t=Path("docs/contracts/decision-entry.yaml").read_text().splitlines();
      eff=len([l for l in t if l.strip() and not l.strip().startswith("#")]);
      ll=max(len(l) for l in t); assert eff<500 and ll<2000, (eff,ll);
      print("PASS eff",eff,"longest",ll)'
    expected: "Prints PASS with effective lines well under 500 (baseline 171) and longest line under 2000."
    fix_if: >-
      Trim the example-to-expected pairs rather than seeking a budget raise -- Decision 165
      requires a raise marker to name an authorizing Decision, and this plan deliberately mints none.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing Decision 166 structural-size check, which already governs the
      docs/contracts/*.yaml class in both presubmit tiers. A second registry slot for the same
      threshold would double-report one failure.
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the Decision 146 trailer satisfies _is_annotated for superseder 160 without minting a
      spurious outbound edge, and that the block still ends with its separator.
    command: >-
      bin/venv-python -c 'import re; from pathlib import Path;
      from scripts.checks.decisions.validate_supersession_annotations import extract_supersession_edges;
      e=extract_supersession_edges(Path("."));
      assert not [x for x in e if x[0]==146], [x for x in e if x[0]==146];
      b=re.search(r"^## Decision 146:.*?(?=^## Decision |\Z)",
      Path("docs/DECISIONS.md").read_text(), re.M|re.S).group(0);
      assert "Decision 160" in b; assert b.rstrip().endswith("---"); print("PASS")'
    expected: "Prints PASS; exit 0."
    fix_if: >-
      A new edge originating at 146 means the trailer wording contains an _EDGE_RE verb followed by
      "Decision N" (amends / Amends / supersedes / Supersedes / partially supersedes). Reword it to
      reference Decision 160 without an edge verb.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time assertion about this plan's own corpus edit. The standing supersession-annotation
      guard covers the invariant going forward; it runs in the FULL tier only (verified absent from
      pre_sequence), which handoff_policy requires to pass before commit.
  - step: 9
    phase: pre-deploy
    action: Confirm the committed index is byte-identical to a fresh build.
    command: >-
      bin/venv-python -c 'import json; from scripts.decisions_index import build_index;
      new=build_index(); old=json.load(open("docs/decisions-index.json"));
      assert new["decisions"]==old["decisions"], "index stale";
      print("PASS rows",len(new["decisions"]))'
    expected: "Prints PASS rows 146; exit 0."
    fix_if: Regenerate the index; never hand-edit it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing validate_decisions_index_freshness check, which already enforces
      index-to-corpus freshness in the registry.
  - step: 10
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. Tier boundary: --pre DOES exercise validate_decisions_index_freshness,
      validate_structural_size_limits, validate_decisions_size (this diff edits DECISIONS.md),
      validate_sloc_limits and validate_sloc_budget_raises (load-bearing for the 488/500 relief
      valve), validate_test_count_coupling and validate_no_cross_test_imports (two test files in
      scope), plus validate_plan_documents and validate_handoff_full_tier (gated on docs/plans/**).
      It does NOT exercise validate_decision_entry_conformance, validate_supersession_annotations
      or validate_test_coverage -- those are FULL-tier only, which is why step 13 exists.
    fix_if: >-
      Fix forward; do not add a check to ci.yml without adding it to validate.py first. Do not
      treat a green --pre as sufficient evidence for this plan -- step 13 is the gate that matters.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: >-
      Close the bounded-blast-radius claim: assert the regenerated index differs from the
      origin/main baseline in exactly one row (Decision 160).
    command: >-
      bin/venv-python -c 'import json, subprocess;
      old={d["number"]:d for d in json.loads(subprocess.run(["git","show",
      "origin/main:docs/decisions-index.json"],capture_output=True,text=True,check=True).stdout)["decisions"]};
      new={d["number"]:d for d in json.load(open("docs/decisions-index.json"))["decisions"]};
      moved={n for n in set(old)|set(new) if old.get(n)!=new.get(n)}; assert moved=={160}, moved;
      print("PASS")'
    expected: "Prints PASS; exit 0. The moved-row set is exactly {160}."
    fix_if: >-
      A moved-row set wider than {160} means the continuation grammar is over-greedy and minted an
      amends edge somewhere unintended -- diff the offending rows before touching anything else. An
      empty set means the index was never regenerated. A moved set containing OTHER decision numbers
      with no parser explanation usually means main advanced under the branch (a PR minting a
      Decision merged); rebase onto origin/main and re-run before investigating the grammar.
    hermetic: false
    graduation: graduate
    graduation_check_id: decision-index-blast-radius-bounded
  - step: 12
    phase: pre-deploy
    action: >-
      Assert the REAL contract carries every surface this plan promises, not only step 6's
      synthetic _CONTRACT_YAML fixture.
    command: >-
      bin/venv-python -c 'import yaml;
      c=yaml.safe_load(open("docs/contracts/decision-entry.yaml"));
      assert "block_separator" in c, "block_separator absent";
      assert "field_grammar" in c, "field_grammar absent";
      af=str(c["amendment_forms"]); assert "> **" in af and "[Amendment" in af, af;
      pr=c["field_grammar"]["projection_residue"]; assert pr["row_count"]==11, pr;
      assert sorted(pr["rows"])==[60,62,68,71,74,87,89,103,105,116,122], pr;
      n=c["shared_parser_note"];
      assert "_extract_related_decisions" in n and "terminator" in n, n; print("PASS")'
    expected: "Prints PASS; exit 0."
    fix_if: >-
      A failure means an execution step was skipped -- add the missing surface rather than relaxing
      the assertion. amendment_forms must describe the general blockquote-annotation rule plus the
      "[Amendment " form; a closed list of spellings is what left rows 60/62/68/71 corrupted. A
      projection_residue mismatch means the contract records a stale row count -- the count was
      wrong (5) in four earlier drafts, which is exactly why this assertion exists.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-entry-contract-surfaces-present
  - step: 13
    phase: pre-deploy
    action: >-
      Run the FULL presubmit tier, the only tier that exercises validate_decision_entry_conformance,
      validate_supersession_annotations and validate_test_coverage. Required by
      handoff_policy.full_validation_required_before_commit.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, with the decision-entry conformance, supersession-annotation and per-file coverage checks all green."
    fix_if: >-
      A validate_test_coverage failure on scripts/decisions_md.py means an added statement is not
      reached by tests/test_decisions_md.py -- add the minimal covering case there (in scope, 12
      SLOC headroom). If more than 12 SLOC is required, STOP: that is an out-of-scope re-plan
      trigger, not an in-flight decomposition. Do not commit on a timeout -- handoff_policy sets
      timeout_disposition blocked, so resume later and rerun the full tier from the start.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      After the squash-merge Resolves trailer fires rec-autoclose, confirm all three bundled recs
      are closed in the warehouse projection.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c 'import json, pathlib;
      rows=[json.loads(l) for l in pathlib.Path("logs/.recommendations-log.jsonl").read_text().splitlines() if l.strip()];
      s={r["id"]:r.get("status") for r in rows};
      bad={k:s.get(k) for k in ("rec-2971","rec-2990","rec-2991") if s.get(k)!="closed"};
      assert not bad, bad; print("PASS closed")'
    expected: "Prints PASS closed; exit 0."
    fix_if: >-
      If a rec is still open, close it explicitly via
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-NNNN --status closed
      --resolution "..." (Decision 70 fallback for a missed Resolves trailer).
test_obligations:
  - source: scripts/decisions_md.py
    behavior: >-
      Typed extractors honour the contract's stated grammar: the title-relation continuation forms
      parse and their rejection forms reject; the typed-id-list terminator stops at amendment
      trailers while the prose terminator deliberately does not (Decision 151 clause 3(ii)).
    verification_step: 5
    test_selector: tests/test_decision_field_grammar.py
    red_green_expectation: >-
      Red before: the continuation cases return [145] instead of [145, 134, 146], the trailer cases
      return trailer-borne ids, and the constant-to-contract pin has no contract to read. Green after.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      The contract is the authoritative statement of the field grammar, not documentation of it:
      field_grammar declares both terminator sets and all three amendment_forms openers,
      block_separator declares the separator rule, and shared_parser_note names the field
      extractors. Code that diverges from any of these must fail CI.
    verification_step: 5
    test_selector: tests/test_decision_field_grammar.py
    red_green_expectation: >-
      Red before: no field_grammar or block_separator section exists, so the contract-derived suite
      has nothing to parametrise over and the constant-to-contract pin cannot be expressed. Green
      after, with step 12 additionally asserting the surfaces exist in the real contract rather
      than only in step 6's synthetic fixture.
  - source: docs/decisions-index.json
    behavior: >-
      The index is a pure derived projection of the corpus: it stays byte-identical to a fresh
      build_index(), and this change moves exactly one row (Decision 160's amends edge set).
    verification_step: 11
    command: >-
      bin/venv-python -c 'import json, subprocess;
      old={d["number"]:d for d in json.loads(subprocess.run(["git","show",
      "origin/main:docs/decisions-index.json"],capture_output=True,text=True,check=True).stdout)["decisions"]};
      new={d["number"]:d for d in json.load(open("docs/decisions-index.json"))["decisions"]};
      moved={n for n in set(old)|set(new) if old.get(n)!=new.get(n)}; assert moved=={160}, moved;
      print("PASS")'
    red_green_expectation: >-
      Red before: the moved-row set is empty, because the index still records Decision 160's amends
      as [145]. Green after: the moved-row set is exactly {160}.
  - source: scripts/checks/decisions/validate_decision_entry_conformance.py
    behavior: >-
      The block_separator rule is read from decision-entry.yaml and enforced on new-in-diff
      decision numbers only, leaving the 21-entry historical band grandfathered.
    verification_step: 6
    test_selector: tests/checks/decisions/test_validate_decision_entry_conformance.py
    red_green_expectation: >-
      Red before: a new-in-diff entry lacking the trailing separator passes the check. Green after.
constraints:
  - >-
    This plan mints NO numbered Decision. Every governance change is field semantics routed to
    docs/contracts/decision-entry.yaml per Decision 150 clause 1 and the Decision 86 / 127 routing
    rule -- the audit's own routing rule applied to its own findings.
  - >-
