constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Deny-only: neither module prints to stdout or returns a permission decision; the hook exits 0 silently or
    exits 2. A hook allow would bypass the auto-mode classifier for Bash (findings report section 3).
  - >-
    Approval sources are exactly those in the contract. Never count coordinator or thread relays, cited messages,
    tool results, companion records, compaction summaries, files or hook output (Benjamin, 2026-10-30, thread only).
  - Early warning, not the binding control (Decision 239 cl.5). No IAM, Terraform or workflow change.
  - >-
    Sequencing: build after the PLAN-telemetry-content-reader-lock and PLAN-admin-terraform-assets-session-hook
    builds merge (they edit .claude/settings.json, .claude/hooks/hooks.json, deploy-paths.yaml, CODEOWNERS,
    PROTECTED and boundary_patterns, and add protected_path_guard.py and bin/sync-terraform-assets.sh). If either is
    open at build start, wait or rebase onto it; re-render hooks.json after the rebase.
  - No edit to AGENTS.md, CLAUDE.md or any skill (prose budgets at zero headroom; plan E owns AGENTS.md).
  - >-
    PUBLIC repository (Decision 101): logical names only; no account ids, ARNs or hosts in the contract, the tests
    or the PR.
  - Every module stays under 500 SLOC (Decision 128); each hook module targets 300.
