pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - The two sequencing builds confirmed merged (or this branch rebased onto them)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - |-
    docs/contracts/protected-actions.yaml -- create with exactly this text, less its two-space margin (approved by Benjamin at step 6b):

      # Protected-action gate (rec-4518). Class D mechanism contract: the actions an agent session runs only after the
      # operator acknowledges them in that session, the acknowledgement grammar, and the recovery procedure for refusals.
      # Read at run time from origin/main by .claude/hooks/protected_action_gate.py (PreToolUse; project threads load it
      # through the ontheloop plugin's hooks.json). PUBLIC repository (Decision 101): logical names only.
      contract:
        id: protected-actions
        class: D
        contract_version: 1
        status: provisional_v0
        description: >-
          The protected-action classes, the in-session approval grammar the gate reads from the session transcript, the
          build-start ask, the fail-closed and tamper rules, the known limits, and the refusal procedure.
          validate_admin_root_premerge_gate checks this file against environment-taxonomy.yaml axis_a and enforces
          approval.build_start on net-new admin-root plans.
        subject: protected-actions
        evaluator:
          check: validate_admin_root_premerge_gate
        provisional_v0:
          authored_at: "2026-10-30"
          authored_via: "PLAN-protected-action-gate"
          rationale: >-
            First shape. The approval grammar is tested only against this repository's project-thread and direct-session
            transcript formats, which the harness may change; provisional_v0 lets it settle before it is treated as stable.
      amendment_log:
        - date: "2026-10-30"
          semantic_break: false
          change_class: field_add
          summary: >-
            PLAN-protected-action-gate (rec-4518): created. Classes tf-state-change, secret-read and admin-credential; the
            in-session approval grammar and the build-start ask; fail-closed and tamper rules; the refusal procedure.
          migration_story: New contract; nothing migrates.

      authority: >-
        None. The gate is an early warning (Decision 239 cl.5; Decision 143 cl.1 puts enforcement outside the agent's
        loop): it only refuses, never returns an allow decision, and so never bypasses the auto-mode classifier. An approve
        line acknowledges the warning for this gate alone. It grants no authority and is not an engine verb (Decision 233);
        each class's binding_control is what binds.

      gate:
        hook: .claude/hooks/protected_action_gate.py
        tools: [Bash, Monitor, Edit, Write, MultiEdit, NotebookEdit]
        contract_source: >-
          git show origin/main:docs/contracts/protected-actions.yaml in CLAUDE_PROJECT_DIR (else the hook input cwd),
          never the working tree (Decision 203 cl.4 precedent).
        live_roots:
          terraform/bootstrap: bootstrap
          terraform/github: github
          terraform/personal: sandbox
        live_roots_note: >-
          Each live root maps to its environment-taxonomy.yaml axis_a row, the sole source for its apply gating
          (Decision 92 pt 5). Every admin-only row's root must be listed here.
        admin_profiles: [agent_platform_admin]
        on_deny: >-
          Exit 2. The message names the class, the target, the binding control, and the exact approve line the operator
          writes in this thread, beside the exact command.

      classes:
        - id: tf-state-change
          matches: >-
            A terraform invocation whose subcommand is in subcommands, or state followed by one of state_subcommands, run
            against a live root. The root directory is the -chdir= value, else the directory of a preceding cd in the same
            command, else the hook input cwd; a directory whose last two parts are terraform/<root> counts, so a throwaway
            worktree does. A directory the gate cannot resolve (a shell variable) has target unknown.
          subcommands: [apply, destroy, import, force-unlock, taint, untaint]
          state_subcommands: [rm, mv, push, replace-provider]
          target: the live root's last path part (bootstrap, github or personal), or unknown, which is never approvable
          approval: one_shot_at_commit
          binding_control: >-
            The apply_gating of the root's axis_a row (gate.live_roots). An agent applies only after the operator has seen
            the plan and directed the apply (Decision 126 cl.1; deploy-paths.yaml admin_out_of_band.procedure).
        - id: secret-read
          matches: >-
            aws secretsmanager get-secret-value or batch-get-secret-value; aws ssm get-parameter, get-parameters,
            get-parameters-by-path or get-parameter-history with --with-decryption; inline Python naming get_secret_value,
            batch_get_secret_value or WithDecryption=True; or a command that runs one of entry_points.
          entry_points: [".github/actions/materialise-tfvars/materialise_tfvars.sh", "bin/sync-terraform-assets.sh --tfvars"]
          target: the --secret-id, --name, --names or --path value, else any
          approval: session
          binding_control: >-
            IAM: the reading role's value grant on that secret or parameter (Decisions 157 and 237;
            secret-material-handling.yaml).
        - id: admin-credential
          matches: >-
            A command that selects an admin profile (--profile <p>, --profile=<p>, AWS_PROFILE=<p>, profile_name='<p>' or
            profile='<p>', either quote), or that runs aws or terraform while the hook's own AWS_PROFILE is an admin profile.
          target: the profile name
          approval: session
          binding_control: >-
            IAM trust on the admin role and the CloudTrail IAM-change detector (Decisions 144, 202 and 225), and the
            operator's rule that the admin profile serves only named bootstrap and admin deploys (rec-4707).

      not_protected:
        - >-
          terraform plan, show, output, state list and state pull on a live root: state reads are bound by IAM
          (Decision 238 cl.1). Run with an admin profile they are admin-credential.
        - aws ssm get-parameter(s) without --with-decryption, and any secretsmanager or ssm metadata call.

      approval:
        grammar:
          session: "approve <class> <target>"
          one_shot_at_commit: "approve <class> <target> <commit>"
        grammar_notes: >-
          Case-insensitive; one approval per line or per comma-separated item; one message may carry several. Target any
          covers every target of a session class. <commit> is at least 7 hex characters of a commit id.
        lifetimes:
          session: The rest of that session. A new thread needs its own approval.
          one_shot_at_commit: >-
            One matching tool call made after the approval line, and only while the root's HEAD starts with <commit> and no
            tracked file under the root differs from HEAD. Any later matching call uses it up, whether or not it ran.
        sources: >-
          In a project thread: a wake message with from="human" and trust="principal" -- its text, except that for a
          decision-card tap only the chosen option's label counts. In a direct session: a user turn the person typed.
        never_counted: >-
          Coordinator or thread relays, including the operator's messages they cite; tool results; file contents; hook
          output; the agent's own messages.
        build_start:
          context_prefix: "Approvals at build start:"
          rule: >-
            A net-new IMPLEMENTATION plan whose scope changes a non-Markdown file under an admin-only root
            (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan) carries a context line starting with context_prefix.
            It lists the approve line for every session class its steps need and the exact commands each covers. The build
            posts that list as its first ask, before any work, so one reply in that thread clears this gate and the
            auto-mode classifier. Only session classes may be listed; a one_shot_at_commit class is asked when its plan is
            shown.

      fail_closed:
        - An unreadable or unparseable transcript denies a protected command.
        - >-
          An unreadable or invalid contract at origin/main denies every command that names a coarse keyword (terraform,
          secretsmanager, ssm, get_secret_value, WithDecryption, an admin profile, an entry point), naming the failure and
          git fetch origin main.
        - A git error while checking a one_shot_at_commit approval denies.
        - Malformed hook input allows (the never_on_main precedent, Decision 138), because nothing can be classified.

      tamper:
        - The gate denies Edit, Write, MultiEdit and NotebookEdit on any file in the transcript's directory.
        - >-
          It denies a Bash or Monitor command that names the transcript's directory and writes (>, tee, sed -i, cp, mv, rm,
          truncate, dd, ln, or an inline interpreter). Reading it stays allowed.
        - The hook and this contract are code-owned by the operator (.github/CODEOWNERS).

      known_limits:
        - >-
          Shell indirection is not parsed: bash -c strings, eval, variables other than a -chdir root, aliases, and scripts
          that call terraform or aws internally.
        - >-
          The hook runs from the working tree, so a session that edits it disables it for that session; CODEOWNERS review
          catches the edit at merge, and the binding controls still hold.
        - Approvals are read only from the transcript the hook input names.
        - The gate never loosens auto mode. A command it lets through can still be refused by the classifier.

      procedure:
        description: >-
          Agent-led steps when a protected action or its approval is refused. Each step starts with the refusal it answers.
        steps:
          - >-
            GATE DENY (the message names a protected-actions class): post the exact command and the deny's approve line to
            the operator in this thread, and run the command only after the operator writes that line here. For
            tf-state-change, first present the plan output at the named commit (deploy-paths.yaml
            admin_out_of_band.procedure); a target of unknown is rewritten with -chdir=terraform/<root>, never approved.
          - >-
            CLASSIFIER VERDICT ("Denied by auto mode classifier"): only the operator's own message in this thread naming the
            exact command clears it, so every ask lists the exact commands beside the approve lines.
          - >-
            CONTENT CHECK ("a safety check separate from auto mode blocked this request because of earlier conversation
            content"): no approval clears it. Stop, record the state, and continue in a fresh thread with a handoff.
          - >-
            RELAYED APPROVAL: neither the classifier nor this gate counts an approval relayed by the coordinator or another
            thread; ask the operator to answer in this thread.
  - >-
    .claude/hooks/protected_action_gate.py -- stdlib plus PyYAML, imported lazily; module docstring in the
    never_on_main style (behaviour, exit codes, the contract as the source of every list), and the string
    permissionDecision appears nowhere in the file. main() reads stdin JSON; a decode error or a non-mapping input
    exits 0. (1) Tamper rules, before any contract read: for Edit, Write, MultiEdit or NotebookEdit, deny when
    tool_input file_path (or notebook_path) resolves inside the directory of transcript_path, else exit 0; for Bash
    or Monitor, deny when the command names that directory or the transcript file name together with a write form
    (>, tee, sed -i, cp, mv, rm, truncate, dd, ln, python -c, python3 -c, perl -e, or a heredoc). (2) Fast path: a
    Bash or Monitor command containing none of the module constant COARSE (terraform, secretsmanager, ssm,
    get_secret_value, WithDecryption, materialise_tfvars, sync-terraform-assets, agent_platform_admin), while the
    hook's own AWS_PROFILE is not an admin profile, exits 0 before any git call, YAML import or transcript read.
    (3) Contract: repo is CLAUDE_PROJECT_DIR, else the input cwd; run git -C <repo> show
    origin/main:docs/contracts/protected-actions.yaml (5 s timeout) and yaml.safe_load it; a git error, a parse
    error or a missing gate, classes or approval key denies, naming the failure and "git fetch origin main". (4)
    Segments: split on newlines, &&, ||, ; and |; strip each segment's leading NAME=value assignments into a
    segment env (its AWS_PROFILE wins over the hook's), carry a cd <dir> segment's directory to later segments,
    and shlex-split the rest (whitespace split on a shlex error). (5) Classify per the contract: tf-state-change
    (the terraform token, an optional -chdir=, then a subcommand in subcommands or state plus one of
    state_subcommands; the root directory is -chdir resolved against the segment's directory, else that
    directory, else the input cwd; the target is the live root whose last two path parts equal the directory's;
    a directory containing $ is unknown; a resolved directory outside every live root is not protected),
    secret-read (the verbs in matches, the entry_points, and the inline Python names; target the --secret-id,
    --name, --names or --path value, else any) and admin-credential (the selection forms in matches, or the hook's
    AWS_PROFILE is an admin profile and the segment runs aws or terraform; target the profile). (6) Approvals: read
    transcript_path as JSONL (missing, unreadable or a bad line denies). Only entries of type user whose
    message.content is a string are sources. Thread mode when any of them contains "<wake ": take the text of
    <message> elements whose attributes include from="human" and trust="principal" and that sit outside any
    <relay> or <cited> element, html.unescape it, and when it starts with 'Chose "' keep only the quoted label.
    Direct mode otherwise: strings that are not isMeta and do not start with "<". Match lines and comma-separated
    items case-insensitively against the grammar. A session-class hit is approved by a line naming its class and
    its target or any. A one-shot hit with target unknown denies with the -chdir instruction; otherwise run git
    -C <root dir> rev-parse HEAD and git -C <root dir> status --porcelain --untracked-files=no -- . (a git error
    denies), then walk the transcript in order: each approve line for that class and target adds a credit
    carrying its commit, and each assistant tool_use for Bash or Monitor whose id differs from the input's
    tool_use_id and whose command classifies to the same class and target uses up the oldest credit. It is
    approved when an unused credit's commit is a prefix of HEAD and the status output is empty. (7) All hits
    approved: exit 0 silently. Otherwise exit 2 with the on_deny message for the first unapproved hit: class,
    target, binding_control, the exact approve line (one-shot: with the first 12 characters of HEAD), that the
    operator writes it in this thread beside the exact command, and the procedure's CLASSIFIER VERDICT step. Wrap
    the body so an unexpected exception denies when COARSE matched and allows otherwise.
