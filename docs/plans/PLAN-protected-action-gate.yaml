    Write, MultiEdit or NotebookEdit, deny when tool_input file_path (or notebook_path) resolves inside the
    directory of transcript_path, else exit 0; for Bash or Monitor, deny when the command names that directory or
    the transcript file name together with a write form (>, tee, sed -i, cp, mv, rm, truncate, dd, ln, python -c,
    python3 -c, perl -e, or a heredoc). (2) Fast path: exit 0 before any git call, YAML import or transcript read
    when the command contains none of the module constant COARSE (terraform, secretsmanager, ssm, get_secret_value,
    WithDecryption, materialise_tfvars, sync-terraform-assets, agent_platform_admin) and either the hook's own
    AWS_PROFILE is not an admin profile or the command has no aws or terraform token. (3) Contract: repo is
    CLAUDE_PROJECT_DIR, else the input cwd; run git -C <repo> show origin/main:docs/contracts/protected-actions.yaml
    (5 s timeout) and yaml.safe_load it; a git error, a parse error or a missing gate, classes or approval key
    denies (the fast path already let everything else through), naming the failure and "git fetch origin main".
    (4) Segments (match module): split on newlines, &&, ||, ; and |; also lift each $(...) and backtick body,
    including those inside NAME=value assignments and quoted words, into a segment of its own; strip each
    segment's leading NAME=value assignments into a segment env (its AWS_PROFILE and TF_VAR_aws_profile win over
    the hook's AWS_PROFILE); carry a cd <dir> segment's directory to later segments; shlex-split the rest
    (whitespace split on a shlex error). (5) Classify per the contract: tf-state-change (the terraform token, an
    optional -chdir=, then a subcommand in subcommands, state plus one of state_subcommands, workspace plus one of
    workspace_subcommands, or init with one of init_flags; the root directory is -chdir resolved against the
    segment's directory, else that directory, else the input cwd; the target is the live root whose last two path
    parts equal the directory's; a directory containing $ is unknown; a resolved directory outside every live root
    is not protected), secret-read (the verbs in matches, the entry_points, and the inline Python names; target the
    --secret-id, --name, --names or --path value, else any) and admin-credential (the selection forms in matches;
    a terraform call that contacts AWS on an admin_default_roots root with no non-admin aws_profile set through
    -var aws_profile=, -var=aws_profile= or TF_VAR_aws_profile=; or the hook's AWS_PROFILE is an admin profile, the
    segment selects no non-admin profile, and it runs aws or a terraform call that contacts AWS; target the
    profile; record whether the hit is ambient-only). (6) Approvals: read transcript_path as JSONL (missing,
    unreadable or a bad line denies). Sources (match module) are user records whose message.content is a string,
    with a non-empty promptId, no sourceToolUseID, no turnCompanion, and isMeta and isCompactSummary not true. Thread
    mode when any source starts with "<wake ": only sources that start with "<wake " count, and from each only the
    text of <message> elements whose attributes include from="human" and trust="principal" and that sit outside any
    <relay>, <coordinator-relay> or <cited> element, html.unescaped; when that text starts with 'Chose "' keep only
    the quoted label. Direct mode otherwise: sources that do not start with "<". Split the text into lines and each
    line into comma-separated items; an item counts only when, trimmed and with whitespace collapsed, it equals an
    approve form case-insensitively. A session-class hit is approved by an item naming its class and its target or
    any. A one-shot hit with target unknown denies with the -chdir instruction; otherwise run git -C <root dir>
    rev-parse HEAD and git -C <root dir> status --porcelain --untracked-files=no -- . (a git error denies), then walk
    the transcript in order: each approve item for that class and target adds a credit carrying its commit, and
    each assistant tool_use for Bash or Monitor whose id differs from the input's tool_use_id and whose command
    classifies to the same class and target uses up the oldest credit. It is approved when an unused credit's
    commit is a prefix of HEAD and the status output is empty. (7) All hits approved: exit 0 silently. Otherwise
    exit 2 with the on_deny message on stderr for the first unapproved hit: class, target, binding_control, the exact
    approve line (one-shot: with the first 12 characters of HEAD), that the operator writes it in this thread beside
    the exact command, the AWS_PROFILE=agent_platform re-run when the hit is ambient-only, and the procedure's
    CLASSIFIER VERDICT step. Wrap the body so an unexpected exception denies when the fast path would not have
    passed the command and allows otherwise.
