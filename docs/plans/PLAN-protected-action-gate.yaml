    roots bullet still names three clauses (plan A owns that skill; the contract and the check are authoritative).
  - "Not bundled: rec-4519 (inventory investigation, partly answered by the findings report), rec-4080 (merge gate)."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - The two sequencing builds confirmed merged (or this branch rebased onto them)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - |-
    docs/contracts/protected-actions.yaml -- create with exactly this text, less its two-space margin (signed off by Benjamin at step 6b; the critique-round wording changes await his word, see the Approvals context line):

      # Protected-action gate (rec-4518). Class D mechanism contract: the actions an agent session runs only after the
      # operator acknowledges them in that session, the acknowledgement grammar, and the recovery procedure for refusals.
      # Read at run time from origin/main by .claude/hooks/protected_action_gate.py (PreToolUse; project threads load it
      # through the ontheloop plugin's hooks.json). PUBLIC repository (Decision 101): logical names only.
      contract:
        id: protected-actions
        class: D
        contract_version: 1
        status: provisional_v0
        description: >-
          The protected-action classes, the in-session approval grammar the gate reads from the session transcript, the
          build-start ask, the fail-closed and tamper rules, the known limits, and the refusal procedure.
          validate_admin_root_premerge_gate checks this file against environment-taxonomy.yaml axis_a and enforces
          approval.build_start on net-new admin-root plans.
        subject: protected-actions
        evaluator:
          check: validate_admin_root_premerge_gate
        provisional_v0:
          authored_at: "2026-10-30"
          authored_via: "PLAN-protected-action-gate"
          rationale: >-
            First shape. The approval grammar is tested only against this repository's project-thread and direct-session
            transcript formats, which the harness may change; provisional_v0 lets it settle before it is treated as stable.
      amendment_log:
        - date: "2026-10-30"
          semantic_break: false
          change_class: field_add
          summary: >-
            PLAN-protected-action-gate (rec-4518): created. Classes tf-state-change, secret-read and admin-credential; the
            in-session approval grammar and the build-start ask; fail-closed and tamper rules; the refusal procedure.
          migration_story: New contract; nothing migrates.

      authority: >-
        None. The gate is an early warning (Decision 239 cl.5; Decision 143 cl.1 puts enforcement outside the agent's
        loop): it only refuses, never returns an allow decision, and so never bypasses the auto-mode classifier. An approve
        line acknowledges the warning for this gate alone. It grants no authority and is not an engine verb (Decision 233);
        each class's binding_control is what binds.

      gate:
        hook: .claude/hooks/protected_action_gate.sh
        modules:
          - .claude/hooks/protected_action_gate.sh
          - .claude/hooks/protected_action_gate.py
          - .claude/hooks/protected_action_match.py
          - scripts/session/handoff_push_parse.py
        tools: [Bash, Monitor, Edit, Write, MultiEdit, NotebookEdit]
        contract_source: >-
          git show origin/main:docs/contracts/protected-actions.yaml in CLAUDE_PROJECT_DIR (else the hook input cwd),
          never the working tree (Decision 203 cl.4 precedent).
        shell_parsing: >-
          The handoff gate's lexer (scripts/session/handoff_push_parse.py) splits a command into simple commands and
          recovers $(...) and backtick bodies, bash -c and eval strings, and heredocs fed to a shell; other heredoc bodies
          are data. A command word matches by basename after leading NAME=value assignments and the wrappers env, command,
          exec, nohup, nice, time, timeout <duration> and sudo, and the words after a standalone -- are classified as a
          command of their own.
        live_roots:
          terraform/bootstrap: bootstrap
          terraform/github: github
          terraform/personal: sandbox
        live_roots_note: >-
          Each live root maps to its environment-taxonomy.yaml axis_a row, the sole source for its apply gating
          (Decision 92 pt 5). Every admin-only row's root must be listed here. A root directory is matched by its literal
          last two path parts, so -chdir="$W/terraform/bootstrap" is bootstrap.
        admin_profiles: [agent_platform_admin]
        self_serve_profile: agent_platform
        on_deny: >-
          Exit 2. The message names the class, the target, the binding control, and the exact approve line the operator
          writes in this thread, beside the exact command. When the only hit is admin-credential from the hook's own
          AWS_PROFILE, it also names the self-serve fix: re-run with AWS_PROFILE=<self_serve_profile>.

      classes:
        - id: tf-state-change
          matches: >-
            A terraform invocation, run against a live root, whose subcommand is in subcommands; or state followed by one of
            state_subcommands; or workspace followed by one of workspace_subcommands; or init with one of init_flags. The
            root directory is the -chdir= value, else the directory of a preceding cd in the same command, else the hook
            input cwd. A directory whose last two parts are not literal has target unknown.
          subcommands: [apply, destroy, import, refresh, test, force-unlock, taint, untaint]
          state_subcommands: [rm, mv, push, replace-provider]
          workspace_subcommands: [new, delete]
          init_flags: [-migrate-state, -force-copy]
          target: the live root's last path part (bootstrap, github or personal), or unknown, which is never approvable
          approval: one_shot_at_commit
          binding_control: >-
            The apply_gating of the root's axis_a row (gate.live_roots). An agent applies only after the operator has seen
            the plan and directed the apply (Decision 126 cl.1; deploy-paths.yaml admin_out_of_band.procedure).
        - id: secret-read
          matches: >-
            aws secretsmanager get-secret-value or batch-get-secret-value; aws ssm get-parameter, get-parameters,
            get-parameters-by-path or get-parameter-history with --with-decryption; inline Python naming get_secret_value,
            batch_get_secret_value or WithDecryption=True; or a command that runs one of entry_points.
          entry_points:
            - .github/actions/materialise-tfvars/materialise_tfvars.sh
            - bin/sync-terraform-assets.sh --tfvars
            - scripts/ci/neon_api_key.sh
          target: the --secret-id, --name, --names or --path value, else any
          approval: session
          binding_control: >-
            IAM: the reading role's value grant on that secret or parameter (Decisions 157 and 237;
            secret-material-handling.yaml).
        - id: admin-credential
          matches: >-
            (1) A command that selects an admin profile: --profile <p>, --profile=<p>, AWS_PROFILE=<p>,
            TF_VAR_aws_profile=<p>, -var aws_profile=<p>, -backend-config=profile=<p>, profile_name='<p>' or profile='<p>'
            (either quote). (2) A terraform call that contacts AWS (any subcommand not in offline_subcommands, and not init
            -backend=false) on a root in admin_default_roots, whose provider defaults aws_profile to an admin profile,
            unless the call sets aws_profile (-var or TF_VAR_) to a non-admin profile. (3) An aws call, or a terraform call
            that contacts AWS, while the hook's own AWS_PROFILE is an admin profile, unless the command sets AWS_PROFILE (or,
            for aws, --profile) to a non-admin profile; -var and TF_VAR_ do not clear this, because the terraform backends
            read the ambient profile.
          admin_default_roots: [terraform/bootstrap, terraform/personal]
          offline_subcommands: [fmt, validate, version, providers, graph, help, -help, -version]
          target: the profile name
          approval: session
          binding_control: >-
            IAM trust on the admin role and the CloudTrail IAM-change detector (Decisions 144, 202 and 225), and the
            operator's rule that the admin profile serves only named bootstrap and admin deploys (rec-4707).

      not_protected:
        - >-
          terraform plan, show, output, state list and state pull on a live root: state reads are bound by IAM
          (Decision 238 cl.1). Run with an admin profile, including a root's default one, they are admin-credential.
        - aws ssm get-parameter(s) without --with-decryption, and any secretsmanager or ssm metadata call.

      approval:
        grammar:
          session: "approve <class> <target>"
          one_shot_at_commit: "approve <class> <target> <commit>"
        grammar_notes: >-
          Case-insensitive; a whole line, or a whole comma-separated item, is one approval, so a line that only mentions
          one ("do not approve ...") is none; one message may carry several. Target any covers every target of a session
          class. <commit> is at least 7 hex characters of a commit id.
        lifetimes:
          session: The rest of that session. A new thread needs its own approval.
          one_shot_at_commit: >-
            One matching tool call made after the approval line, and only while the root's HEAD starts with <commit> and no
            file under the root, tracked or untracked and not ignored, differs from HEAD. Any later matching call uses it
            up, whether or not it ran. A call from a subagent (the hook input carries agent_id) is never covered, because
            its calls are not in the transcript that counts the credit: one-shot actions run in the main session.
        sources: >-
          A user turn the person typed: a user record with string content, a promptId, no sourceToolUseID or
          turnCompanion, and neither isMeta nor isCompactSummary (src/turn_capture/streams.py's prompt rule). In a project
          thread that record must be a wake whose origin kind is human, and only its <message> elements with from="human"
          and trust="principal", outside any relay or citation, count; for a decision-card tap only the chosen option's
          label counts.
        never_counted: >-
          Coordinator or thread relays, including the operator's messages they cite; tool results; companion records;
          compaction summaries; file contents; hook output; the agent's own messages.
        build_start:
          context_prefix: "Approvals at build start:"
          rule: >-
            A net-new IMPLEMENTATION plan whose scope changes a non-Markdown file under an admin-only root
            (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan) carries a context line starting with context_prefix.
            It lists the approve line for every session class its steps need and the exact commands each covers. The build
            posts that list as its first ask, before any work. One reply in that thread clears this gate, and because it
            names the exact commands it is also the in-thread approval the auto-mode classifier looks for (harness
            behaviour this repository does not own). Only session classes may be listed; a one_shot_at_commit class is
            asked when its plan is shown.

      fail_closed:
        - An unreadable or unparseable transcript, or an empty transcript_path, denies a protected command.
        - >-
          An unreadable or invalid contract at origin/main denies every command that names a coarse keyword (terraform,
          secretsmanager, ssm, get_secret_value, WithDecryption, an admin profile, an entry point), and every aws or
          terraform call while the hook's own AWS_PROFILE is an admin profile, naming the failure and git fetch origin main.
        - A lexer error on a command that names a coarse keyword denies it.
        - A git error while checking a one_shot_at_commit approval, or a root path that is not literal, denies it.
        - >-
          The registered shim (gate.hook) maps a timeout or any interpreter exit other than 0 and 2 to a deny when the
          payload names a coarse keyword, and to an allow otherwise, so a broken interpreter never wedges every command.
        - Malformed hook input allows (the never_on_main precedent, Decision 138), because nothing can be classified.

      tamper:
        - The gate denies Edit, Write, MultiEdit and NotebookEdit on any file in the transcript's directory.
        - >-
          It denies a Bash or Monitor command that names the transcript's directory and writes (>, tee, sed -i, cp, mv, rm,
          truncate, dd, ln, or an inline interpreter). Reading it stays allowed.
        - >-
          gate.modules and this contract are code-owned by the operator (.github/CODEOWNERS) and listed in the PROTECTED
          ratchet (scripts/checks/misc/sensitive_value_detectors.py), so protected_path_guard refuses an edit to them that
          no declared plan scopes.

      known_limits:
        - >-
          Indirection the lexer does not recover is not parsed: variables other than a literal root path, aliases,
          functions, and scripts that call terraform or aws internally, including a script written elsewhere that then
          writes the transcript.
        - >-
          A hook failure on a payload that names no coarse keyword is allowed, so a crash skips the tamper rules; an empty
          transcript_path skips them too.
        - >-
          The hook runs from the working tree, so a Bash edit to gate.modules disables it for that session, and an edit to
          .claude/.claude-plugin/plugin.json turns off every plugin hook; CODEOWNERS review catches either at merge.
        - Approvals are read, and one-shot credits used up, only in the transcript the hook input names.
        - The gate never loosens auto mode. A command it lets through can still be refused by the classifier.
        - The binding controls hold whatever the gate misses.

      procedure:
        description: >-
          Agent-led steps when a protected action or its approval is refused. Each step starts with the refusal it answers.
        steps:
          - >-
            GATE DENY (the message names a protected-actions class): post the exact command and the deny's approve line to
            the operator in this thread, as a message rather than a decision card (card labels hold at most 40 bytes), and
            run the command only after the operator writes that line here. For tf-state-change, first present the plan
            output at the named commit (deploy-paths.yaml admin_out_of_band.procedure), from the main session with a literal
            -chdir=terraform/<root>; a target of unknown is rewritten, never approved. An admin-credential hit from the
            hook's own AWS_PROFILE alone is re-run with the self-serve profile when the step does not need admin rights; ask
            only when it does.
          - >-
            CLASSIFIER VERDICT ("Denied by auto mode classifier"): only the operator's own message in this thread naming the
            exact command clears it, so every ask lists the exact commands beside the approve lines.
          - >-
            CONTENT CHECK ("a safety check separate from auto mode blocked this request because of earlier conversation
            content"): no approval clears it. Stop, record the state, and continue in a fresh thread with a handoff.
          - >-
            RELAYED APPROVAL: neither the classifier nor this gate counts an approval relayed by the coordinator or another
            thread; ask the operator to answer in this thread.
  - >-
    .claude/hooks/protected_action_gate.sh -- the registered command, modelled on handoff_evidence_gate.sh with no
    set -e or set -u: read the payload, run timeout -k 5 20 "$CLAUDE_PROJECT_DIR/bin/venv-python"
    "$CLAUDE_PROJECT_DIR/.claude/hooks/protected_action_gate.py" with it on stdin, pass exit 0 and exit 2 (and
    stderr) through, and map any other exit or a timeout to exit 2 with a one-line stderr reason when the payload
    contains a word in the shim's COARSE list (the Python COARSE plus aws and terraform when AWS_PROFILE is an admin
    profile), else to exit 0. .claude/hooks/protected_action_gate.py (entry) and .claude/hooks/protected_action_match.py
    (pure helpers the entry imports from its own directory; the match module puts the repo root on sys.path as
    handoff_evidence_gate.py does and imports scripts.session.handoff_push_parse's lexer) -- stdlib plus PyYAML,
    imported lazily; module docstrings in the never_on_main style (behaviour, exit codes, the contract as the source
    of every list); the strings permissionDecision and hookSpecificOutput appear in no gate module, and nothing
    writes to stdout. main() reads stdin JSON; a decode error or a non-mapping input exits 0. (1) Tamper rules,
    before any contract read and skipped when transcript_path is empty: for Edit, Write, MultiEdit or NotebookEdit,
    deny when tool_input file_path (or notebook_path) resolves inside the directory of transcript_path, else exit 0;
    for Bash or Monitor, deny when the command names that directory or the transcript file name together with a
    write form (>, tee, sed -i, cp, mv, rm, truncate, dd, ln, python -c, python3 -c, perl -e, or a heredoc). (2)
    Fast path: exit 0 before any git call, YAML import or transcript read when the command contains none of the
    module constant COARSE (terraform, secretsmanager, ssm, get_secret_value, WithDecryption, materialise_tfvars,
    sync-terraform-assets, neon_api_key, agent_platform_admin) and either the hook's own AWS_PROFILE is not an admin
    profile or the command has no aws or terraform word. (3) Contract: repo is CLAUDE_PROJECT_DIR, else the input
    cwd; run git -C <repo> show origin/main:docs/contracts/protected-actions.yaml (5 s timeout) and yaml.safe_load
    it; a git error, a parse error or a missing gate, classes or approval key denies (the fast path already let
    everything else through), naming the failure and "git fetch origin main". (4) Shell walk (match module), the
    is_push_shaped order: strip_heredocs and strip_line_continuations; recurse into each _find_balanced_spans body
    and each _shell_c_and_eval_args string; elide the spans; _tokenize (a ValueError denies, the fast path having
    already passed non-coarse text) and _split_simple_commands. Per simple command: strip leading NAME=value
    assignments into a command env (its AWS_PROFILE and TF_VAR_aws_profile win over the hook's AWS_PROFILE); a
    command of only assignments, or export NAME=value, carries them to later commands, as cd <dir> carries its
    directory; skip the wrappers env (with its assignments), command, exec, nohup, nice, time, timeout <duration>
    and sudo; take the command word by basename; and classify the words after a standalone -- as a further command.
    (5) Classify per the contract: tf-state-change (terraform, an optional -chdir=, then a subcommand in
    subcommands, state plus one of state_subcommands, workspace plus one of workspace_subcommands, or init with one
    of init_flags; the root directory is -chdir resolved against the command's directory, else that directory, else
    the input cwd; the target is the live root whose last two path parts equal the directory's literal last two
    parts, so "$W/terraform/bootstrap" is bootstrap; non-literal last parts are unknown; a directory outside every
    live root is not protected), secret-read (the verbs in matches, the entry_points by path suffix, and the inline
    Python names; target the --secret-id, --name, --names or --path value, else any) and admin-credential (the three
    rules in matches: the selection forms; the admin_default_roots rule, cleared only by a non-admin -var
    aws_profile=, -var=aws_profile= or TF_VAR_aws_profile=; and the ambient rule, cleared only by a non-admin
    AWS_PROFILE in the command env or, for aws, --profile; target the profile; record whether the hit is
    ambient-only). (6) Approvals: an empty transcript_path, or a missing, unreadable or bad-line JSONL file, denies.
    Sources (match module) are user records whose message.content is a string, with a non-empty promptId, no
    sourceToolUseID, no turnCompanion, and isMeta and isCompactSummary not true. Thread mode when any source starts
    with "<wake ": only sources that start with "<wake " and whose origin.kind is "human" count, and from each only
    the text of <message> elements whose attributes include from="human" and trust="principal" and that sit outside
    any <relay>, <coordinator-relay> or <cited> element, html.unescaped; when that text starts with 'Chose "' keep
    only the quoted label. Direct mode otherwise: sources that do not start with "<". Split the text into lines and
    each line into comma-separated items; an item counts only when, trimmed and with whitespace collapsed, it equals
    an approve form case-insensitively. A session-class hit is approved by an item naming its class and its target or
    any. A one-shot hit denies when the hook input carries a non-empty agent_id (run it in the main session), when
    its target is unknown or its root path is not literal (use -chdir=terraform/<root>); otherwise run git -C <root
    dir> rev-parse HEAD and git -C <root dir> status --porcelain --untracked-files=normal -- . (a git error denies),
    then walk the transcript in order: each approve item for that class and target adds a credit carrying its commit,
    and each assistant tool_use for Bash or Monitor whose id differs from the input's tool_use_id and whose command
    classifies to the same class and target uses up the oldest credit. It is approved when an unused credit's commit
    is a prefix of HEAD and the status output is empty. (7) All hits approved: exit 0 silently. Otherwise exit 2 with
    the on_deny message on stderr for the first unapproved hit: class, target, binding_control, the exact approve
    line (one-shot: with the first 12 characters of HEAD), that the operator writes it in this thread beside the
    exact command, the AWS_PROFILE=agent_platform re-run when the hit is ambient-only, and the procedure's CLASSIFIER
    VERDICT step. Wrap the body so an unexpected exception denies when the fast path would not have passed the
    command and allows otherwise.
  - >-
    tests/hooks/test_protected_action_gate.py -- every hook run is a subprocess of sys.executable on the real
    .claude/hooks/protected_action_gate.py (the shim only in test_shim_maps_hook_failure_by_payload) with JSON on
    stdin and a pinned env (PATH, HOME, CLAUDE_PROJECT_DIR set
    to the fixture repo, AWS_PROFILE=agent_platform unless the test sets it); the shared run helper asserts stdout
    is empty on every run. A fixture builds a tmp git repo (git -c commit.gpgsign=false) holding
    docs/contracts/protected-actions.yaml copied from the working tree and terraform/bootstrap, terraform/github and
    terraform/personal directories with one tracked file each, and points refs/remotes/origin/main at its commit. A
    helper writes JSONL transcripts whose records carry the real fields (type, promptId, message.content, and for
    wakes the real wake > project > thread > message shape with from, trust, author and id attributes and
    html-escaped text, and origin kind human). Exactly these twenty-nine functions, parametrized only where stated
    (thirty-two cases):
    test_protected_action_denied_without_authorisation[tf-state-change, secret-read, admin-credential] (terraform
    -chdir=terraform/github apply; aws ssm get-parameter --name /secret/x --with-decryption; aws --profile
    agent_platform_admin iam list-roles; exit 2 and stderr names the class, target, binding control and approve
    line); test_session_class_approval_from_principal_allows[secret-read, admin-credential];
    test_tf_state_change_approval_allows_one_call_at_its_commit (approve with HEAD's first 7 characters allows the
    first apply; with that apply recorded as an earlier tool_use, a second is denied);
    test_tf_state_change_approval_refused_after_new_commit_or_local_change (a later commit, an edit to the tracked
    file and an untracked override.tf each deny; an ignored .terraform/ directory does not);
    test_subagent_one_shot_call_is_denied (the same approved apply with agent_id set is denied, naming the main
    session);
    test_tf_state_change_covers_every_state_writing_form (refresh, test, import, destroy, state rm, workspace new,
    workspace delete, init -migrate-state and init -force-copy on terraform/github are denied; state list and
    workspace select pass); test_unknown_root_is_never_approvable (-chdir=$ROOT apply is denied even with "approve
    tf-state-change unknown <sha>", naming -chdir); test_approval_for_another_class_or_target_does_not_count;
    test_relays_tool_results_and_agent_text_do_not_count (a <cited author="user"> approval inside a coordinator
    relay, the line in a tool_result block, in an assistant message, and in a from="agent" trust="relay" message);
    test_non_prompt_user_records_do_not_count (the approve line in a sourceToolUseID companion, a turnCompanion
    record, a record with no promptId, an isCompactSummary record, an isMeta <relay from="coordinator"> record with a
    <cited author="user"> approval (and the same without isMeta), a wake whose origin kind is not human, and, in
    thread mode, a non-wake string carrying a principal <message>); test_only_whole_lines_and_items_count ("do not approve secret-read any" and an approve
    form inside a sentence do not count; "approve secret-read any, approve admin-credential agent_platform_admin"
    approves both); test_card_tap_counts_only_the_chosen_label; test_direct_session_typed_approval_counts (an isMeta
    string does not); test_unprotected_commands_pass_without_reading_the_transcript (terraform fmt -check and
    validate on terraform/bootstrap; plan, show and state list on terraform/github; terraform -chdir=terraform/bootstrap
    plan -var aws_profile=agent_platform; git push; grep -n agent_platform_admin docs; aws sts get-caller-identity
    --profile agent_platform; echo "approve admin-credential agent_platform_admin"; transcript_path at a missing
    file); test_root_resolution_from_chdir_cd_and_cwd (cd terraform/personal && terraform apply -> personal; cwd
    terraform/github -> github; -chdir=/tmp/wt/terraform/bootstrap -> bootstrap; -chdir="$W/terraform/bootstrap"
    plan -> admin-credential for bootstrap and apply -> denied asking for a literal path; apply in a directory under
    no live root passes); test_secret_read_covers_every_value_verb (get-secret-value, batch-get-secret-value, the four ssm
    verbs with --with-decryption, inline get_secret_value, both entry points; get-parameter without
    --with-decryption passes); test_command_substitution_is_classified (TF_VAR_neon_api_key="$(aws ssm get-parameter
    --name /secret/neon-api-key --with-decryption --profile agent_platform_admin --query Parameter.Value --output
    text)" terraform -chdir=terraform/personal apply is denied, and with only the tf-state-change one-shot approved it
    is still denied for secret-read; the backtick form likewise); test_wrappers_tails_and_shell_strings_are_classified
    ($HOME/.local/bin/terraform, timeout 600 terraform, env X=1 terraform and nohup terraform applies on
    terraform/github; bash scripts/ci/neon_api_key.sh run -- terraform -chdir=terraform/github apply is denied for
    secret-read and tf-state-change; bash -c "terraform -chdir=terraform/github apply" and eval likewise);
    test_heredoc_bodies_are_data (a git commit -F - heredoc naming --profile agent_platform_admin passes; bash <<EOF
    feeding terraform -chdir=terraform/github apply is denied); test_admin_profile_selection_forms (--profile x,
    --profile=x, AWS_PROFILE=x, TF_VAR_aws_profile=x, -var aws_profile=x, -backend-config=profile=x,
    profile_name='x' and profile="x" with x the admin profile, and terraform -chdir=terraform/bootstrap plan with no
    override, are denied as admin-credential); test_ambient_admin_profile_rules (with the hook's AWS_PROFILE the admin
    profile: aws s3 ls is denied and the message names AWS_PROFILE=agent_platform; terraform
    -chdir=terraform/personal plan -var aws_profile=agent_platform is still denied; AWS_PROFILE=agent_platform aws s3
    ls, export AWS_PROFILE=agent_platform && aws s3 ls, AWS_PROFILE=agent_platform terraform -chdir=terraform/personal
    plan -var aws_profile=agent_platform, aws --profile agent_platform sts get-caller-identity, terraform fmt and git
    status pass);
    test_transcript_writes_are_denied_and_reads_pass (Write and Edit into the transcript directory, echo >> and sed
