    verification_step: 1
    test_selector: tests/hooks/test_protected_action_gate.py::test_contract_shape_and_coarse_keywords
    red_green_expectation: red before (contract and test absent), green after.
  - source: .claude/settings.json
    behavior: The gate is registered on the six tools and rendered into the plugin.
    verification_step: 1
    test_selector: tests/hooks/test_protected_action_gate.py::test_registered_rendered_and_code_owned
    red_green_expectation: red before (no registration), green after.
  - source: .claude/hooks/hooks.json
    behavior: The plugin's hooks file is the render of settings.json, so project threads load the gate.
    verification_step: 1
    test_selector: tests/hooks/test_protected_action_gate.py::test_registered_rendered_and_code_owned
    red_green_expectation: red before (no rendered group), green after.
  - source: .github/CODEOWNERS
    behavior: The operator owns the hook and the contract.
    verification_step: 1
    test_selector: tests/hooks/test_protected_action_gate.py::test_registered_rendered_and_code_owned
    red_green_expectation: red before (no lines), green after.
  - source: scripts/checks/verification/validate_admin_root_premerge_gate.py
    behavior: >-
      Fails on an incoherent protected-actions contract; flags a net-new admin-root plan with no approvals line or a
      one-shot class in it.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_admin_root_premerge_gate.py::TestRedCasesByClause::test_no_approvals_line_flags_approvals_clause
    red_green_expectation: red before (test absent), green after.
  - source: docs/contracts/deploy-paths.yaml
    behavior: pre_merge_live_plan names in-session approval and no longer credits a standing one.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_admin_root_premerge_gate.py::TestDriftPin::test_deploy_paths_points_at_in_session_approval
    red_green_expectation: red before (the standing clause is present), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Deny-only: the hook never prints JSON and never returns a permission decision; it exits 0 silently or exits 2.
    A hook allow would bypass the auto-mode classifier for Bash (findings report section 3).
  - >-
    Approval sources are exactly those in the contract. Never count coordinator or thread relays, cited messages,
    tool results, files or hook output (Benjamin, 2026-10-30, thread only).
  - Early warning, not the binding control (Decision 239 cl.5). No IAM, Terraform or workflow change.
  - >-
    Sequencing: build after the PLAN-telemetry-content-reader-lock and PLAN-admin-terraform-assets-session-hook
    builds merge (both edit .claude/settings.json, .claude/hooks/hooks.json, deploy-paths.yaml and CODEOWNERS). If
    either is open at build start, wait or rebase onto it; re-render hooks.json after the rebase.
  - No edit to AGENTS.md, CLAUDE.md or any skill (prose budgets at zero headroom; plan E owns AGENTS.md).
  - >-
    PUBLIC repository (Decision 101): logical names only; no account ids, ARNs or hosts in the contract, the tests
    or the PR.
  - Every module stays under 500 SLOC (Decision 128); the hook targets 450.
