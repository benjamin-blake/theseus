schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-iam-personal-release"
intent: >-
  Second half of rec-3838: release PlatformDev, PlatformAdmin and their five inline policies from
  the CI-applied terraform/personal state through one human-gated forget that touches no live
  object, so the CD pipeline never again plans these seven IAM addresses, which its identity cannot write. The plan also locks
  the one-state-per-applier rule in a standing guard, records the relocation as dated Update
  amendments on Decisions 180 and 183, and makes rec-4043 (a separate admin principal) a gate on
  executor re-enable in the roadmap.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-personal-release.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3838, plan 2 of 2 (predecessor:
  PLAN-platform-iam-bootstrap-adopt). No tier_item criterion is closed and no executor work is
  delivered; the one roadmap edit is human-directed bookkeeping that adds an open,
  executor-gating exit criterion naming rec-4043 (see the docs/ROADMAP-PLATFORM.yaml scope row).
closes_criteria: []
scope:
  - file: terraform/personal/platform_roles.tf
    action: Modify
    purpose: >-
      Replace both aws_iam_role blocks with seven `removed { from = <address> lifecycle { destroy
      = false } }` blocks (the two roles and the five inline policies) under a banner pointing at
      terraform/bootstrap. The file is kept, not deleted, so its config/structural_size_budgets.yaml
      key and the structural-registry-section-scoped-extraction shard that asserts that key stay
      valid.
  - file: terraform/personal/platform_dev_policies.tf
    action: Delete
    purpose: DailyOps now lives in terraform/bootstrap/platform_dev_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_policies.tf
    action: Delete
    purpose: AdminOps now lives in terraform/bootstrap/platform_admin_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_data_policies.tf
    action: Delete
    purpose: the three data policies now live in terraform/bootstrap/platform_admin_data_policies.tf; their removed blocks are in platform_roles.tf
  - file: tests/checks/iam_tf/test_platform_iam_admin_root_only.py
    action: Create
    purpose: >-
      Standing guard for the one-state-per-applier rule: terraform/personal declares no
      aws_iam_role named PlatformDev or PlatformAdmin, and no aws_iam_role_policy,
      aws_iam_role_policy_attachment, aws_iam_policy_attachment (its `roles = [...]` list),
      aws_iam_role_policies_exclusive or aws_iam_role_policy_attachments_exclusive targeting either --
      by resource reference or by literal role name, the literal check keyed ONLY on those resources'
      `role` / `roles` arguments, so legitimate mentions elsewhere (rec-4044's EventBridge patterns,
      the literal role ARNs in oidc.tf's IAMRolesRead) cannot false-positive; each of the seven relocated addresses has exactly one removed block with lifecycle
      destroy = false in terraform/personal. (That bootstrap declares and imports them is the
      predecessor's graduated TestBootstrapOwnsPlatformIam; this guard does not duplicate it.) Red
      cases for a re-added role, an inline policy attached by literal role name, a managed-policy
      attachment, an aws_iam_policy_attachment naming a role in `roles`, an *_exclusive resource, and
      a removed block missing destroy = false; a negative-of-the-negative case proving an
      EventBridge pattern naming PlatformDev does not trip the guard.
  - file: config/agent/verification_registry/entries/platform-iam-admin-root-only.yaml
    action: Create
    purpose: graduate the admin-root-only guard under this plan's slug
  - file: tests/checks/iam_tf/test_platform_iam_dual_copy_parity.py
    action: Delete
    purpose: >-
      The predecessor's transitional dual-copy parity module -- terraform/personal no longer declares
      the addresses, so there is nothing left to compare. The graduated
      tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py is untouched and must stay green
      (its parity sources live in files this plan keeps).
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Add test_split_apply_step_excludes_platform_iam asserting the SPLIT-APPLY step no longer names
      PlatformDev/PlatformAdmin inline-policy writes as its trigger and instead names terraform/bootstrap as their home,
      while the PRE-APPLY, self-access isolation and POST-APPLY steps survive in order.
  - file: config/agent/verification_registry/entries/deploy-paths-split-apply-excludes-platform-iam.yaml
    action: Create
    purpose: graduate the SPLIT-APPLY narrowing test (function-level node id) under this plan's slug
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Narrow the SPLIT-APPLY step: PlatformDev/PlatformAdmin roles and inline policies are
      terraform/bootstrap admin applies (no split, no -target); the split survives only for any
      remaining terraform/personal address the CI apply role cannot execute by design. Bare-action
      wording, no restated guard classification (Decision 126 point 2); amendment_log entry.
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: >-
      Repoint every live reference to the relocated identities: admin_tier_only's policy-file
      references (DailyOps' DenyStateRead, AdminOps' SecretsManagerAdmin) move to terraform/bootstrap;
      where_values_live's platform_dev_external_id / platform_admin_external_id state-fallback
      sources and admin_tier_only's state-fallback sentence name the terraform/bootstrap state
      (PlatformAdmin-only), because after the forget terraform/personal's state no longer holds the
      trust documents; referenced_repo_paths gains terraform/bootstrap/platform_roles.tf. The three
      variables stay documented as declared in terraform/personal until rec-4048 retires them.
      amendment_log entry.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      axis_a.bootstrap scope wording names the admin-tier identities (PlatformDev, PlatformAdmin
      and their inline policies) alongside the CI/CD role's own IAM and the authority budget;
      apply_gating unchanged (admin-only, never auto-apply); amendment_log entry.
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: >-
      Repoint the "Out-of-band IAM grants" CODIFIED bullets to terraform/bootstrap and co-move the
      recovery row with the narrowed SPLIT-APPLY (Decision 183 reversal (b) names this row). The
      file is exactly at its 11450-byte config/prose_budgets.yaml budget, so the edit must be net
      byte-neutral or smaller -- trim the historical codification narrative, which git history and
      Decision 180 already carry.
  - file: docs/runbooks/ducklake-catalog-operations.md
    action: Modify
    purpose: repoint the DuckLakeBreakGlass authority pointer (already stale at terraform/personal/platform_roles.tf) to terraform/bootstrap/platform_admin_data_policies.tf; no other content (Decision 127 retiring class)
  - file: .claude/hooks/session_start_aws.sh
    action: Modify
    purpose: >-
      One-line operator-hint repoint: the AccessDenied hint names terraform/bootstrap/platform_dev_policies.tf
      (PlatformDev's runtime grant) instead of terraform/personal/platform_roles.tf, which now holds
      only removed blocks. Message text only; no control flow changes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Two dated append-only annotations (Decision 177; decision-entry.yaml amendment_forms
      blockquote_update, human-directed 2026-09-25 in place of a numbered Decision): a
      `> **Update (DATE):**` on Decision 180 and a reciprocal one on Decision 183 point 4. Required
      content is listed in context; clause texts stay verbatim.
  - file: docs/decisions-index.json
    action: Modify
    purpose: regenerate only if validate_decisions_index_freshness reports drift after the DECISIONS.md annotations
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Human-directed bookkeeping (2026-09-25): add T4.2 exit criterion c8, status open, requiring
      that rec-4043 is closed before any executor persona runs -- the executor holds its own
      boundary-carrying agent-platform-* role and never the shared service-account key, and
      PlatformAdmin trusts only a principal whose key exists solely in the admin container. No
      other roadmap field changes (T2.48 / T2.44 files_in_scope pointers are left as history).
bundled_recommendations: ["rec-3838"]
followon_recs: ["rec-4043", "rec-4047", "rec-4048", "rec-4049", "rec-4050", "rec-4052", "rec-4053"]
infrastructure_dependencies:
  - "PRECONDITION: PLAN-platform-iam-bootstrap-adopt is fully deployed -- terraform/bootstrap state holds all seven addresses and a bootstrap plan exits 0 (the predecessor's step 16 proved it; this plan's step 12 re-checks it before merge). Merging this plan before that would leave the seven objects unmanaged (harmless to live IAM, but it breaks the chain of custody)."
  - "The merge routes seven `forget` actions to the tf-gated-apply Environment (scripts/terraform_apply_guard.py treats a non-inert action on an IAM-sensitive type as out-of-budget; environment-taxonomy.yaml is the classification SoT). A forget issues no AWS API call, so github_ci_apply can execute it; one human approval."
  - "APPROVAL WINDOW: approve the gated run within 2.0 hours of merge. Until then the hourly terraform-drift plan measures the forgets as resource_changes with no resource_drift, writes a pending_codification marker before it consults pending_gated, and escalates that marker to red at 2.0h (Decision 190 point 3; ordering defect owned by rec-4050 -- if rec-4050 has landed before this merge, the window no longer applies). A missed window is recoverable: the gated-apply job has no convergence precondition, and its green write replaces the record, so approving the still-pending run converges it. Side effect: every non-escalating hourly drift tick in that window files a source=tf_drift 'pending-codification delta' rec (terraform-drift.yml:290-312) that nothing auto-closes -- step 20 closes them."
  - "Freeze: no other terraform/personal PR merges between this PR's speculative plan and the gated forget -- a state-serial bump in between makes the saved plan stale and fails closed (the 2026-09-20 failure shape); recovery is the workflow_dispatch acknowledge-and-retry path."
  - "ADMIN container (Decision 120) for steps 11-18: bin/setup-cloud-env.sh with INSTALL_TERRAFORM=1 and a non-empty provider-mirror sync materialises terraform/personal/terraform.personal.tfvars only; step 11 materialises terraform/bootstrap/terraform.bootstrap.tfvars. DEV containers cannot init any root (Decision 119)."
acceptance_criteria:
  - terraform/personal declares no PlatformDev/PlatformAdmin role, inline policy, attachment or exclusive-set resource; seven removed blocks with destroy = false cover the seven relocated addresses; the three personal policy files are deleted
  - Before merge, the predecessor's adoption is complete, rec-4044 is closed, and the PR's saved speculative plan contains exactly seven forget actions and nothing else
  - After the gated forget the personal convergence record is green at the merge commit, a terraform/personal plan exits 0, terraform/personal state holds none of the seven addresses, and a bootstrap plan still exits 0
  - A before/after snapshot of both roles' complete IAM surface is identical across the release -- no live permission changed
  - deploy-paths.yaml, terraform-cc-web-operations.yaml (including the ExternalId recovery sources), environment-taxonomy.yaml, terraform/CLAUDE.md, the DuckLake runbook and the session-start hook point at terraform/bootstrap; no swept surface still names a deleted personal policy file except the declared residual rec-4047
  - Decisions 180 and 183 each carry a dated Update annotation recording the relocation, with their original clause texts unchanged
  - T4.2 carries an open exit criterion c8 naming rec-4043
  - rec-3838 is closed via the squash-merge Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the one-state-per-applier guard -- terraform/personal holds no PlatformDev/PlatformAdmin IAM, and every relocated address is released through a removed block
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_iam_admin_root_only.py -q
    expected: >-
      all tests pass, including the red cases (a re-added role, an inline policy attached by
      literal role name, a managed-policy attachment, an *_exclusive resource, a removed block
      without destroy = false); red before this plan is implemented (the module does not exist),
      green after
    fix_if: personal still declares an address or attachment, or a removed block is missing or destroy-capable
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-iam-admin-root-only
  - step: 2
    phase: pre-deploy
    action: stale-reference sweep -- no swept surface names a deleted personal policy file, and the prose and hook pointers moved to terraform/bootstrap
    command: |-
      ! grep -rnE 'terraform/personal/platform_(dev|admin|admin_data)_policies\.tf' terraform scripts tests .github config .claude docs/runbooks --include='*.tf' --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.md' --exclude=platform-dev-data-lake-read-fence.yaml && ! grep -q 'terraform/personal/platform_roles.tf' .claude/hooks/session_start_aws.sh && grep -q 'terraform/bootstrap/platform_dev_policies.tf' .claude/hooks/session_start_aws.sh && grep -q 'terraform/bootstrap/platform_admin_data_policies.tf' docs/runbooks/ducklake-catalog-operations.md && grep -q 'terraform/bootstrap/platform_roles.tf' terraform/CLAUDE.md && ! grep -nE 'split-apply.*(PlatformDev|PlatformAdmin)|(PlatformDev|PlatformAdmin).*split-apply' terraform/CLAUDE.md && echo STALE_REFS_NONE
    expected: >-
      exit 0 and the marker is printed -- the old paths are gone and the hook, runbook and
      terraform/CLAUDE.md positively name terraform/bootstrap, with no terraform/CLAUDE.md line still
      routing PlatformDev/PlatformAdmin through the split-apply (Decision 183 reversal (b)'s co-moving
      recovery row); the only excluded file is the declared residual shard owned by rec-4047; remaining comment-only
      pointers to terraform/personal/platform_roles.tf (which now holds the removed blocks) are
      owned by rec-4052
    fix_if: a hit remains -- repoint it to terraform/bootstrap
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time closure sweep for the Delete rows (closure obligation 2). The durable half -- no
      PlatformDev/PlatformAdmin IAM declared in terraform/personal -- is graduated by step 1; a
      path-string sweep would only re-flag the declared rec-4047 residual.
  - step: 3
    phase: pre-deploy
    action: the admin procedure routes PlatformDev/PlatformAdmin IAM to terraform/bootstrap and keeps its guard steps in order
    command: bin/venv-python -m pytest "tests/test_deploy_paths_admin_procedure.py::test_split_apply_step_excludes_platform_iam" -q
    expected: the new SPLIT-APPLY narrowing test passes -- red before (the function does not exist), green after; the module's other admin-procedure tests keep passing under step 10's full tier
    fix_if: the SPLIT-APPLY step still names PlatformDev/PlatformAdmin inline-policy writes as its trigger, or a guard step was lost
    hermetic: false
    graduation: graduate
    graduation_check_id: deploy-paths-split-apply-excludes-platform-iam
  - step: 4
