schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-iam-personal-release"
intent: >-
  Second half of rec-3838: release PlatformDev, PlatformAdmin and their five inline policies from
  the CI-applied terraform/personal state through one human-gated forget that touches no live
  object, so the CD pipeline never again plans IAM its identity cannot write. The plan also locks
  the one-state-per-applier rule in a standing guard, records the relocation as dated Update
  amendments on Decisions 180 and 183, and makes rec-4043 (a separate admin principal) a gate on
  executor re-enable in T4.2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-personal-release.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3838, plan 2 of 2 (predecessor:
  PLAN-platform-iam-bootstrap-adopt). No tier_item criterion is closed and no executor work is
  delivered; the one roadmap edit is human-directed bookkeeping that adds an open,
  executor-gating exit criterion naming rec-4043 (see the docs/ROADMAP-PLATFORM.yaml scope row).
closes_criteria: []
scope:
  - file: terraform/personal/platform_roles.tf
    action: Modify
    purpose: >-
      Replace both aws_iam_role blocks with seven `removed { from = <address> lifecycle { destroy
      = false } }` blocks (the two roles and the five inline policies) under a banner pointing at
      terraform/bootstrap. The file is kept, not deleted, so its config/structural_size_budgets.yaml
      key and the structural-registry-section-scoped-extraction shard that asserts that key stay
      valid.
  - file: terraform/personal/platform_dev_policies.tf
    action: Delete
    purpose: DailyOps now lives in terraform/bootstrap/platform_dev_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_policies.tf
    action: Delete
    purpose: AdminOps now lives in terraform/bootstrap/platform_admin_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_data_policies.tf
    action: Delete
    purpose: the three data policies now live in terraform/bootstrap/platform_admin_data_policies.tf; their removed blocks are in platform_roles.tf
  - file: tests/checks/iam_tf/test_platform_iam_admin_root_only.py
    action: Create
    purpose: >-
      Standing guard for the one-state-per-applier rule: terraform/personal declares no aws_iam_role
      named PlatformDev or PlatformAdmin and no aws_iam_role_policy attached to either (by resource
      reference or by literal role name); each of the seven relocated addresses has exactly one
      removed block with lifecycle destroy = false in terraform/personal; each is declared and
      imported in terraform/bootstrap. Red cases for a re-added role, a re-added inline policy
      attached by literal name, a removed block missing destroy = false, and an address removed
      from personal but never declared in bootstrap.
  - file: config/agent/verification_registry/entries/platform-iam-admin-root-only.yaml
    action: Create
    purpose: graduate the admin-root-only guard under this plan's slug
  - file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
    action: Modify
    purpose: >-
      Delete the transitional TestDualCopyParity class (terraform/personal no longer declares the
      addresses). TestBootstrapOwnsPlatformIam, the graduated class, is untouched.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Add a test asserting the SPLIT-APPLY step no longer names PlatformDev/PlatformAdmin
      inline-policy writes as its trigger and instead names terraform/bootstrap as their home,
      while the PRE-APPLY, self-access isolation and POST-APPLY steps survive in order.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Narrow the SPLIT-APPLY step: PlatformDev/PlatformAdmin roles and inline policies are
      terraform/bootstrap admin applies (no split, no -target); the split survives only for any
      remaining terraform/personal address the CI apply role cannot execute by design. Bare-action
      wording, no restated guard classification (Decision 126 point 2); amendment_log entry.
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: >-
      Repoint admin_tier_only's policy-file references (DailyOps' DenyStateRead, AdminOps'
      SecretsManagerAdmin) from terraform/personal/*_policies.tf to terraform/bootstrap;
      amendment_log entry. The three trust variables stay documented until rec-4048 retires them.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      axis_a.bootstrap scope wording names the admin-tier identities (PlatformDev, PlatformAdmin
      and their inline policies) alongside the CI/CD role's own IAM and the authority budget;
      apply_gating unchanged (admin-only, never auto-apply); amendment_log entry.
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: >-
      Repoint the "Out-of-band IAM grants" CODIFIED bullets to terraform/bootstrap and co-move the
      recovery row with the narrowed SPLIT-APPLY (Decision 183 reversal (b) names this row). The
      file is exactly at its 11450-byte config/prose_budgets.yaml budget, so the edit must be net
      byte-neutral or smaller -- trim the historical codification narrative, which git history and
      Decision 180 already carry.
  - file: docs/runbooks/ducklake-catalog-operations.md
    action: Modify
    purpose: repoint the DuckLakeBreakGlass authority pointer (already stale at terraform/personal/platform_roles.tf) to terraform/bootstrap/platform_admin_data_policies.tf; no other content (Decision 127 retiring class)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Two dated append-only annotations (Decision 177; decision-entry.yaml amendment_forms
      blockquote_update, human-directed 2026-09-25 in place of a numbered Decision): a
      `> **Update (DATE):**` on Decision 180 and a reciprocal one on Decision 183 point 4. Required
      content is listed in execution_steps; clause texts stay verbatim.
  - file: docs/decisions-index.json
    action: Modify
    purpose: regenerate only if validate_decisions_index_freshness reports drift after the DECISIONS.md annotations
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Human-directed bookkeeping (2026-09-25): add T4.2 exit criterion c8, status open, requiring
      that rec-4043 is closed before any executor persona runs -- the executor holds its own
      boundary-carrying agent-platform-* role and never the shared service-account key, and
      PlatformAdmin trusts only a principal whose key exists solely in the admin container. No
      other roadmap field changes (T2.48 / T2.44 files_in_scope pointers are left as history).
bundled_recommendations: ["rec-3838"]
followon_recs: ["rec-4043", "rec-4047", "rec-4048", "rec-4049", "rec-4050"]
infrastructure_dependencies:
  - "PRECONDITION: PLAN-platform-iam-bootstrap-adopt is fully deployed -- terraform/bootstrap state holds all seven addresses and a bootstrap plan exits 0 (step 8). Merging this plan before that would leave the seven objects unmanaged (harmless to live IAM, but it breaks the chain of custody)."
  - "The merge routes seven `forget` actions to the tf-gated-apply Environment (scripts/terraform_apply_guard.py treats a non-inert action on an IAM-sensitive type as out-of-budget; environment-taxonomy.yaml is the classification SoT). A forget issues no AWS API call, so github_ci_apply can execute it; one human approval."
  - "APPROVAL WINDOW: approve the gated run within 2.0 hours of merge. Until then the hourly terraform-drift plan measures the forgets as resource_changes with no resource_drift, writes a pending_codification marker before it consults pending_gated, and escalates that marker to red at 2.0h (Decision 190 point 3; ordering defect deferred to rec-4050). If the window is missed, approving the gated run still converges the record green -- other personal applies queue behind the pending run in the shared concurrency group either way."
  - "Freeze: no other terraform/personal PR merges between this PR's speculative plan and the gated forget -- a state-serial bump in between makes the saved plan stale and fails closed (the 2026-09-20 failure shape); recovery is the workflow_dispatch acknowledge-and-retry path."
  - "ADMIN container (Decision 120) for steps 8-10 and 12-14: bin/setup-cloud-env.sh with INSTALL_TERRAFORM=1 and a non-empty provider-mirror sync, which also materialises terraform/personal/terraform.personal.tfvars; DEV containers cannot init any root (Decision 119)."
acceptance_criteria:
  - terraform/personal declares no PlatformDev/PlatformAdmin role and no inline policy on either; seven removed blocks with destroy = false cover the seven relocated addresses; the three personal policy files are deleted
  - The PR's saved speculative plan contains exactly seven forget actions and nothing else
  - After the gated forget the personal convergence record is green at the merge commit, terraform/personal state holds none of the seven addresses, and a bootstrap plan still exits 0
  - A before/after snapshot of both roles' complete IAM surface is identical across the release -- no live permission changed
  - deploy-paths.yaml, terraform-cc-web-operations.yaml, environment-taxonomy.yaml, terraform/CLAUDE.md and the DuckLake runbook point at terraform/bootstrap; no executable surface still names a deleted personal policy file except the declared residual rec-4047
  - Decisions 180 and 183 each carry a dated Update annotation recording the relocation, with their original clause texts unchanged
  - T4.2 carries an open exit criterion c8 naming rec-4043
  - rec-3838 is closed via the squash-merge Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the one-state-per-applier guard -- terraform/personal holds no PlatformDev/PlatformAdmin IAM, and every relocated address is removed here and owned in bootstrap
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_iam_admin_root_only.py -q
    expected: >-
      all tests pass, including the red cases (a re-added role, an inline policy attached by
      literal role name, a removed block without destroy = false, an address released from
      personal but not declared in bootstrap); red before this plan is implemented (the module does
      not exist), green after
    fix_if: personal still declares an address, a removed block is missing or destroy-capable, or bootstrap lacks a released address
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-iam-admin-root-only
  - step: 2
    phase: pre-deploy
    action: stale-reference sweep -- no executable surface names a deleted personal policy file
    command: |-
      ! grep -rnE 'terraform/personal/platform_(dev|admin|admin_data)_policies\.tf' terraform scripts tests .github config .claude --include='*.tf' --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --exclude=platform-dev-data-lake-read-fence.yaml && echo STALE_REFS_NONE
    expected: exit 0 and the marker is printed; the only excluded file is the declared residual shard owned by rec-4047
    fix_if: a hit remains -- repoint it to terraform/bootstrap, or if it is historical provenance inside a contract amendment_log, leave it and narrow the sweep with a stated reason
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time closure sweep for the Delete rows (closure obligation 2). The durable half -- no
      PlatformDev/PlatformAdmin IAM declared in terraform/personal -- is graduated by step 1; a
      path-string sweep would only re-flag the declared rec-4047 residual.
  - step: 3
    phase: pre-deploy
    action: the admin procedure routes PlatformDev/PlatformAdmin IAM to terraform/bootstrap and keeps its guard steps in order
    command: bin/venv-python -m pytest tests/test_deploy_paths_admin_procedure.py -q
    expected: all tests pass, including the new SPLIT-APPLY narrowing test (red before, green after) and the pre-existing PRE-APPLY, self-access isolation and POST-APPLY ordering tests
    fix_if: the SPLIT-APPLY step still names PlatformDev/PlatformAdmin inline-policy writes as its trigger, or a guard step was lost
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The assertions are pytest functions in the always-run suite beside the admin-procedure
      guards they extend; a registry row would duplicate what every full-tier run executes.
  - step: 4
    phase: pre-deploy
    action: contract, roadmap and decision bookkeeping landed as specified
    command: |-
      bin/venv-python -c "import re,sys,yaml; strip=lambda o: {k: strip(v) for k,v in o.items() if k!='amendment_log'} if isinstance(o,dict) else ([strip(x) for x in o] if isinstance(o,list) else o); cc=str(strip(yaml.safe_load(open('docs/contracts/terraform-cc-web-operations.yaml')))); tx=str(yaml.safe_load(open('docs/contracts/environment-taxonomy.yaml'))['axis_a']['bootstrap']); rm=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t42=next(i for i in rm['tier_items'] if i['id']=='T4.2'); c8=[c for c in t42['exit_criteria'] if isinstance(c,dict) and 'rec-4043' in c.get('text','')]; d=open('docs/DECISIONS.md').read(); blk=lambda n: re.split(r'(?m)^## Decision ',d.split('## Decision '+str(n)+':',1)[1])[0]; u=lambda b: [l for l in b.splitlines() if l.startswith('> **Update (2026-') and 'terraform/bootstrap' in l]; errs=[e for e,bad in [('cc-web still names personal policy files','terraform/personal/platform_dev_policies.tf' in cc or 'terraform/personal/platform_admin' in cc),('taxonomy bootstrap row lacks the admin-tier identities','PlatformAdmin' not in tx),('T4.2 has no open rec-4043 criterion',not (c8 and c8[0].get('status')=='open')),('Decision 180 lacks the dated Update',not u(blk(180))),('Decision 183 lacks the reciprocal Update',not u(blk(183))),('Decision 180 clause 6 text was edited','Rejected for now under Decision 144 clause 3' not in blk(180))] if bad]; sys.exit('; '.join(errs)) if errs else print('BOOKKEEPING OK')"
    expected: BOOKKEEPING OK -- red before implementation (every leg fails on today's tree), green after
    fix_if: a named leg failed -- apply that edit; never rewrite clause 6 or point 4 in place (Decision 177)
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      One-time bookkeeping assertions over prose and roadmap surfaces; the contracts carry their
      own amendment logs, decision annotations are append-only by Decision 177, and the T4.2
      criterion is tracked by the roadmap's own lifecycle validators thereafter.
  - step: 5
    phase: pre-deploy
    action: fast-tier presubmit is clean, including run_differential admission of the new shard, validate_plan_documents, the prose budgets and the decisions-index freshness check
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any fast-tier check fails -- a prose budget overrun on terraform/CLAUDE.md is fixed by trimming, never by a raise (Decision 128/166)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses a graduate step whose
      argv head is -m scripts.validate.
  - step: 6
    phase: pre-deploy
    action: full-tier validation before commit, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a COMPLETED full run -- a timeout is blocked, not a pass; resume later and rerun the full tier from the start
    fix_if: any full-tier check fails -- do not commit or open the PR until it is green
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion_refusal as step 5.
  - step: 7
    phase: pre-deploy
    action: PRE-MERGE GATE (ADMIN) -- the predecessor's adoption is complete and the personal record is quiet
    command: |-
      test -n "$TF_CLI_CONFIG_FILE" && terraform -chdir=terraform/bootstrap init -input=false && test "$(terraform -chdir=terraform/bootstrap state list | grep -c -E '^aws_iam_role(_policy)?\.platform_')" -eq 7 && terraform -chdir=terraform/bootstrap plan -input=false -var-file=terraform.bootstrap.tfvars -detailed-exitcode && bin/venv-python -c "import json,subprocess; r=json.loads(subprocess.run(['aws','s3','cp','s3://agent-platform-data-lake/convergence/personal/sandbox.json','-','--profile','agent_platform_admin'],check=True,capture_output=True,text=True).stdout); bad=[k for k in ('pending_gated','pending_codification','infra_error') if k in r]; assert r.get('status')=='green' and not bad, (r.get('status'), bad); print('PRE-MERGE GATE OK')"
    expected: bootstrap owns seven platform_ addresses with a no-change plan, and the personal record is green with no pending marker; confirm via GitHub MCP that no other open PR touches terraform/personal
    fix_if: STOP -- finish PLAN-platform-iam-bootstrap-adopt's post-deploy steps first; never merge this plan ahead of the adoption
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: PRE-MERGE GATE (ADMIN) -- BEFORE snapshot of both roles' complete IAM surface, scratch only
    command: |-
      D="${TMPDIR:-/tmp}/platform-iam-release/before" && mkdir -p "$D" && for r in PlatformDev PlatformAdmin; do aws iam get-role --role-name "$r" --profile agent_platform_admin --output json > "$D/role-$r.json" && aws iam list-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$D/inline-$r.json" && aws iam list-attached-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$D/attached-$r.json"; done && for p in PlatformDev:DailyOps PlatformAdmin:AdminOps PlatformAdmin:PlatformDataLakeProvisioning PlatformAdmin:BootstrapStateProvisioning PlatformAdmin:DuckLakeBreakGlass; do aws iam get-role-policy --role-name "${p%%:*}" --policy-name "${p##*:}" --profile agent_platform_admin --output json > "$D/policy-${p%%:*}-${p##*:}.json"; done && test "$(ls "$D" | wc -l)" -eq 11 && echo "BEFORE snapshot: 11 documents captured"
    expected: 11 documents captured; only the count is printed, because every document carries the account id (Decision 101)
    fix_if: an AccessDenied or NoSuchEntity -- stop and reconcile
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: PRE-MERGE GATE (ADMIN) -- the PR's saved speculative plan is exactly seven forgets and nothing else
    command: |-
      M="${TMPDIR:-/tmp}/platform-iam-release" && test -n "$PR_NUMBER" && test -n "$PR_HEAD_SHA" && terraform -chdir=terraform/personal init -input=false -backend-config=backend-sandbox.hcl && aws s3 cp "s3://agent-platform-data-lake/tfplan/personal/${PR_NUMBER}/${PR_HEAD_SHA}.bin" "$M/release.tfplan" --profile agent_platform_admin && terraform -chdir=terraform/personal show -json "$M/release.tfplan" > "$M/release.json" && bin/venv-python -c "import json,os,sys; p=json.load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'platform-iam-release','release.json'))); rc=p.get('resource_changes',[]); want={'aws_iam_role.platform_dev','aws_iam_role.platform_admin','aws_iam_role_policy.platform_dev_runtime','aws_iam_role_policy.platform_admin_ops','aws_iam_role_policy.platform_admin_datalake','aws_iam_role_policy.platform_admin_bootstrap_state','aws_iam_role_policy.platform_admin_ducklake_breakglass'}; forget={r['address'] for r in rc if r['change']['actions']==['forget']}; other=[(r['address'],r['change']['actions']) for r in rc if r['change']['actions'] not in (['no-op'],['read'],['forget'])]; sys.exit(f'STOP forget={sorted(forget)} other={other}') if forget!=want or other else print('RELEASE PLAN OK -- exactly 7 to forget, nothing else')"
    expected: RELEASE PLAN OK; the PR's speculative-plan comment also shows the predicted guard verdict BLOCKED (routed to tf-gated-apply), which is expected
    fix_if: a destroy, update or any extra address means the removed blocks or the deletions are wrong -- stop, fix the PR, re-run
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: after merge, the human approves the tf-gated-apply run and the forget converges green
    command: |-
      test -n "$MERGE_SHA" && bin/venv-python -c "import json,os,subprocess; r=json.loads(subprocess.run(['aws','s3','cp','s3://agent-platform-data-lake/convergence/personal/sandbox.json','-','--profile','agent_platform_admin'],check=True,capture_output=True,text=True).stdout); bad=[k for k in ('pending_gated','pending_codification','infra_error') if k in r]; assert r.get('status')=='green' and r.get('commit_sha')==os.environ['MERGE_SHA'] and not bad, (r.get('status'), r.get('commit_sha')==os.environ['MERGE_SHA'], bad); print('FORGET CONVERGED GREEN at the merge commit')"
    expected: status green, commit_sha equals the squash-merge SHA, no pending marker -- the gated run was approved within the 2.0h window
    fix_if: red because the window was missed -- approving the still-pending gated run converges it; red for any other reason -- follow deploy-paths.yaml's reconcile row and RCA (Decision 55)
  - step: 11
    phase: post-deploy
    action: PlatformDev's DEP-13 fence still evaluates correctly after the release
    command: |-
      bin/venv-python -c "import subprocess,json,sys; acct=subprocess.run(['aws','sts','get-caller-identity','--profile','agent_platform_admin','--query','Account','--output','text'],check=True,capture_output=True,text=True).stdout.strip(); role='arn'+':aws:iam::'+acct+':role/PlatformDev'; B='arn'+':aws:s3:::agent-platform-data-lake'; ctx=lambda pfx: ['--context-entries','ContextKeyName=s3'+':prefix,ContextKeyValues='+pfx+',ContextKeyType=string'] if pfx else []; sim=lambda a,r,pfx: json.loads(subprocess.run(['aws','iam','simulate-principal-policy','--policy-source-arn',role,'--action-names',a,'--resource-arns',r,'--profile','agent_platform_admin','--output','json']+ctx(pfx),check=True,capture_output=True,text=True).stdout)['EvaluationResults'][0]; rows=[('s3:GetObjectVersion',B+'/tfstate/personal/terraform.tfstate',None,'explicitDeny'),('s3:GetObjectVersion',B+'/tfplan/personal/probe',None,'explicitDeny'),('s3:GetObjectVersion',B+'/convergence/personal/probe',None,'explicitDeny'),('s3:GetObjectVersion',B+'/ducklake/probe.parquet',None,'allowed'),('s3:ListBucketVersions',B,'tfstate/personal/','explicitDeny'),('s3:ListBucketVersions',B,'ducklake/','allowed')]; res=[(a,pfx,want,sim(a,r,pfx)) for a,r,pfx,want in rows]; bad=[(a,pfx,want,e.get('EvalDecision'),e.get('MissingContextValues')) for a,pfx,want,e in res if (e.get('MissingContextValues') or []) or e.get('EvalDecision')!=want]; sys.exit('FENCE FAIL '+repr(bad)) if bad else print('FENCE OK -- 6 rows, both verbs, all three fenced prefixes')"
    expected: FENCE OK -- the same six rows PLAN-datalake-read-visibility step 10 proved
    fix_if: any row diverges -- stop and RCA; the forget must not have changed any permission
  - step: 12
    phase: post-deploy
    action: ownership moved -- personal state no longer holds the seven, bootstrap still owns them with no diff
    command: |-
      test "$(terraform -chdir=terraform/personal state list | grep -c -E '^aws_iam_role(_policy)?\.platform_(dev|admin)')" -eq 0 && test "$(terraform -chdir=terraform/bootstrap state list | grep -c -E '^aws_iam_role(_policy)?\.platform_')" -eq 7 && terraform -chdir=terraform/bootstrap plan -input=false -var-file=terraform.bootstrap.tfvars -detailed-exitcode && echo "OWNERSHIP MOVED -- personal 0, bootstrap 7, bootstrap plan no-change"
    expected: zero platform_dev/platform_admin addresses in personal state, seven in bootstrap state, and the bootstrap plan exits 0
    fix_if: an address is still in personal state (the forget did not apply) or bootstrap now shows a diff -- stop and RCA
  - step: 13
    phase: post-deploy
    action: AFTER snapshot is identical to step 8's BEFORE snapshot -- the release changed no permission
    command: |-
      B="${TMPDIR:-/tmp}/platform-iam-release/before" && A="${TMPDIR:-/tmp}/platform-iam-release/after" && mkdir -p "$A" && for r in PlatformDev PlatformAdmin; do aws iam get-role --role-name "$r" --profile agent_platform_admin --output json > "$A/role-$r.json" && aws iam list-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$A/inline-$r.json" && aws iam list-attached-role-policies --role-name "$r" --profile agent_platform_admin --output json > "$A/attached-$r.json"; done && for p in PlatformDev:DailyOps PlatformAdmin:AdminOps PlatformAdmin:PlatformDataLakeProvisioning PlatformAdmin:BootstrapStateProvisioning PlatformAdmin:DuckLakeBreakGlass; do aws iam get-role-policy --role-name "${p%%:*}" --policy-name "${p##*:}" --profile agent_platform_admin --output json > "$A/policy-${p%%:*}-${p##*:}.json"; done && bin/venv-python -c "import json,os,sys; b=os.path.join(os.environ.get('TMPDIR','/tmp'),'platform-iam-release'); norm=lambda d: (d.get('Role',{}).pop('RoleLastUsed',None), d)[1]; names=sorted(os.listdir(os.path.join(b,'before'))); diff=[n for n in names if norm(json.load(open(os.path.join(b,'before',n))))!=norm(json.load(open(os.path.join(b,'after',n))))]; sys.exit('CHANGED '+repr(diff)) if diff or len(names)!=11 else print('SNAPSHOTS IDENTICAL -- 11 documents, no permission changed')"
    expected: SNAPSHOTS IDENTICAL; only RoleLastUsed is normalised away; on failure only document names are printed
    fix_if: any document changed -- stop and RCA
  - step: 14
    phase: post-deploy
    action: rec-3838 closed by the squash-merge Resolves trailer
    command: |-
      bin/venv-python -c "import json; from scripts.ops_data_portal import sync; sync(['ops_recommendations']); rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()]; r=max((x for x in rows if x.get('id')=='rec-3838'), key=lambda x: x.get('last_updated_timestamp') or ''); assert r['status']=='closed', 'rec-3838 is '+r['status']; print('rec-3838 closed')"
    expected: rec-3838 is closed (rec-autoclose.yml on the Resolves trailer)
    fix_if: |-
      still open -- confirm the squash body carried `Resolves: rec-3838` and that rec-autoclose ran; close via update_rec only with the closure artifact the trailer gate expects
test_obligations:
  - source: terraform/personal/platform_roles.tf
    behavior: terraform/personal declares no PlatformDev/PlatformAdmin IAM and releases all seven addresses through removed blocks with destroy = false.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_platform_iam_admin_root_only.py
