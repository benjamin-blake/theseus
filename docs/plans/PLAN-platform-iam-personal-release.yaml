constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Never `terraform state rm` or a cross-backend `state mv` -- release is `removed { lifecycle { destroy = false } }` only, applied by CI through the gated Environment (terraform/personal/main.tf header, Decision 178 clause 4 / Decision 183)
  - Merge only after pre-merge gates 11-14 pass -- the predecessor's adoption complete, rec-4044 closed, the saved plan exactly seven forgets
  - The release must change no live permission; the removed blocks must never allow a destroy
  - "Approve the tf-gated-apply run within 2.0h of merge (Decision 190 point 3) unless rec-4050 has landed; the drift ordering defect is rec-4050's, not worked around here"
  - "Freeze: no other terraform/personal PR merges between this PR's speculative plan and the gated forget, and no terraform/bootstrap apply runs until the forget converges (restated from the predecessor)"
  - Decision 177 -- the Decision 180 and 183 annotations are dated append-only lines; clause 6 and point 4 texts stay verbatim; no new numbered Decision (human-directed 2026-09-25)
  - terraform/CLAUDE.md must end at or under its 11450-byte prose budget -- trim, never raise (Decision 128/166)
  - "Public-repo boundary (Decision 101): snapshots, plan files and plan JSON stay in scratch and step 21 removes them, including after any STOP; no ARN, account id or ExternalId in any committed file, chat or PR"
  - Never widen the CI apply role to write these identities (Decision 180 clauses 2-3 are permanent)
  - "The only roadmap edit is T4.2 c8 (human-directed); T2.48 / T2.44 files_in_scope pointers are left as history"
