rollback: >-
  Before merge: close the PR; nothing changed. After the gated forget: live IAM is untouched and
  terraform/bootstrap owns the seven, so no permission is at risk. To return ownership to
  terraform/personal, revert this PR's HCL and replace the removed blocks with `import {}` blocks
  for the seven addresses (a zero-diff import in personal passes the guard as no-op), then forget
  them from terraform/bootstrap with `removed { lifecycle { destroy = false } }` via an admin
  apply. Retire the platform-iam-admin-root-only and deploy-paths-split-apply-excludes-platform-iam
  registry rows by git mv to config/agent/verification_registry/entries/deprecated/ (they would
  otherwise go red). Never `state rm`, never a cross-backend `state mv`. Revert the Decision
  annotations with a further dated Update, never an in-place edit (Decision 177).
