  terraform/bootstrap owns the seven, so no permission is at risk. To return ownership to
  terraform/personal, revert this PR's HCL and replace the removed blocks with `import {}` blocks
  for the seven addresses (a zero-diff import in personal passes the guard as no-op), then forget
  them from terraform/bootstrap with `removed { lifecycle { destroy = false } }` via an admin
  apply. Never `state rm`, never a cross-backend `state mv`. Revert the Decision annotations with a
  further dated Update, never an in-place edit (Decision 177).
