    action: the surviving adoption checks stay green after the release
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py -q
    expected: TestBootstrapOwnsPlatformIam passes with the personal policy files deleted and platform_roles.tf reduced to removed blocks; the transitional dual-copy parity module no longer exists
    fix_if: a parity leg reads a file this plan deleted or emptied -- re-anchor it on a surviving source in the same PR, never delete the graduated class
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      TestBootstrapOwnsPlatformIam is already graduated by the predecessor as
