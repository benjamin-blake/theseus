schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "datalake-read-visibility"
intent: >-
  Make the lakehouse's own billed storage visible to the identity that owns lakehouse maintenance.
  T2.18 c2's efficacy half is GcDebtRatio, whose storage term comes from a current-versions-only
  listing, so on a versioned bucket it cannot see the bytes it purports to measure; these
  version-level reads are what make that term truthful, and they are fenced off the state prefixes
  in the same change.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-datalake-read-visibility.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: terraform/personal/platform_dev_policies.tf
    action: Modify
    purpose: >-
      Grant PlatformDev s3:GetLifecycleConfiguration and s3:GetBucketVersioning at the bucket ARN,
      s3:ListBucketVersions at the bucket ARN under an s3:prefix condition admitting BOTH DuckLake
      data prefixes, and s3:GetObjectVersion on those two object prefixes only. Add the two DEP-13
      Deny statements those verbs require -- an OBJECT-level Deny covering the whole version-read
      verb family, and a separate BUCKET-level, s3:prefix-conditioned Deny for
      s3:ListBucketVersions.
  - file: tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py
    action: Create
    purpose: >-
      Standing guard on grant and fence SHAPES, not merely verb strings -- an inert Deny (one whose
      resource shape its verb can never match) must be rejected. Deliberately a NEW module so this
      plan shares no file with PLAN-ducklake-noncurrent-version-reclaim.
  - file: config/agent/verification_registry/entries/platform-dev-data-lake-read-fence.yaml
    action: Create
    purpose: graduate the fence guard as a standing check under this plan's slug
  - file: tests/fixtures/ducklake_recovery_drill.json
    action: Create
    purpose: >-
      Committed evidence of the copy-forward recovery rehearsal, the pre-rule forensic inventory of
      production delete markers and noncurrent versions, and the drill's own measured version-count
      residual. Lands in a SECOND commit -- see the sequencing note in context.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - "aws_iam_role_policy.platform_dev_runtime is CI-unexecutable BY DESIGN: iam:PutRolePolicy is scoped to role/agent-platform-* (terraform/bootstrap/github_ci_apply_policy.tf Sid IAMRoleWriteBounded) and aws_iam_role.platform_dev is named PlatformDev (platform_roles.tf:33). Decision 180 clauses 2-3 are permanent -- never widen the CI role to avoid the split."
  - "SPLIT-APPLY (docs/contracts/deploy-paths.yaml admin_out_of_band.procedure): apply this address out-of-band under agent_platform_admin first (init -> plan -target -> PRESENT -> explicit human acceptance -> apply), then the governed path carries any remainder."
  - "ADMIN container precondition (Decision 120): bin/setup-cloud-env.sh ran with INSTALL_TERRAFORM=1 and the provider mirror sync succeeded, so TF_CLI_CONFIG_FILE is set and local init of terraform/personal succeeds."
  - "The four no-default tfvars are recovered from remote state per terraform/CLAUDE.md, never pasted into chat, a PR, or any committed file (Decision 101)."
  - "Permissions-boundary ceiling is clear: PlatformDev carries agent-platform-github-ci-apply-boundary whose DataPlaneAllow grants s3:*, so all new verbs are ceiling-covered and the inert-grant failure mode does not apply."
  - "EVERY post-deploy step in this plan runs in the ADMIN container under agent_platform_admin. Measured 2026-09-20: PlatformDev AccessDenies on iam:SimulatePrincipalPolicy, so the fence proof CANNOT run in an ordinary DEV session. Granting that verb to PlatformDev is deliberately NOT proposed -- see context."
acceptance_criteria:
  - PlatformDev can read the data-lake bucket lifecycle configuration; the call is AccessDenied before this change
  - PlatformDev can list object versions under BOTH DuckLake data prefixes, so rec-3892's smoke-prefix corpus becomes readable
  - s3:GetObjectVersion is granted only on the two DuckLake object prefixes, never bucket-wide
  - s3:ListBucketVersions is granted at the bucket ARN with an s3:prefix condition admitting only the DuckLake data prefixes
  - An OBJECT-level Deny refuses the version-read verb family on tfstate/personal/*, tfplan/personal/* and convergence/personal/*, and simulate-principal-policy returns explicitDeny -- not implicitDeny -- for s3:GetObjectVersion against a tfstate key
  - A separate BUCKET-level, s3:prefix-conditioned Deny refuses s3:ListBucketVersions against the fenced prefixes, and the guard rejects the inert object-prefix form of that statement
  - A committed fixture records a successful copy-forward recovery of a real GC-deleted production data file, including its MEASURED version-count delta
  - The same fixture records the pre-rule inventory of production delete markers and noncurrent versions, preserving rec-3892's production-side evidence before any expiry rule can age it out
verification_plan:
  - step: 1
    phase: pre-deploy
    action: PlatformDev carries the bucket-config and version-level read actions
    command: grep -q "s3:GetLifecycleConfiguration" terraform/personal/platform_dev_policies.tf && grep -q "s3:GetObjectVersion" terraform/personal/platform_dev_policies.tf && grep -q "s3:ListBucketVersions" terraform/personal/platform_dev_policies.tf
    expected: exit 0 -- all three read actions present in the DailyOps inline policy
    fix_if: any action absent
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      The durable form of this assertion is a method on the fence guard module, graduated by step 2
      under platform-dev-data-lake-read-fence. A registry shard carries exactly one check_spec, so
      pointing both steps at that check_id would leave this one a graduation in name only.
  - step: 2
    phase: pre-deploy
    action: the fence guard passes -- grant and Deny SHAPES, not merely verb strings
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py -q
    expected: >-
      all tests pass, including red cases for a bucket-wide GetObjectVersion grant, a missing Deny,
      an s3:prefix condition admitting only one DuckLake prefix, and the INERT object-prefix form of
      the ListBucketVersions Deny. The object-level Deny must cover the whole version-read family --
      s3:GetObjectVersion, s3:GetObjectVersionAcl, s3:GetObjectVersionTagging and
      s3:GetObjectVersionAttributes -- even though only the first is granted, so a later grant of a
      sibling verb cannot silently land outside the fence.
    fix_if: a grant is unscoped, or a Deny carries a resource shape its verb can never match
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-dev-data-lake-read-fence
  - step: 3
    phase: pre-deploy
    action: fast-tier presubmit is clean before any apply
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any fast-tier check fails
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      docs/contracts/vp-red-before.yaml#recursion_refusal statically refuses a graduate step whose
      argv head is -m scripts.validate. Kernel-expressible but REFUSED, which is what waive records
      and not-applicable would leave unrecorded.
  - step: 4
    phase: pre-deploy
    action: full-tier validation before commit, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a COMPLETED full run -- handoff_policy.timeout_disposition is blocked, so a timeout is not a pass; resume later and rerun the full tier from the start
    fix_if: any full-tier check fails -- do not commit or open the PR until it is green
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion_refusal as step 3 -- an argv head of -m scripts.validate is statically refused
      from the graduate partition.
  - step: 5
    phase: post-deploy
    action: ADMIN precondition -- recover the tfvars and confirm local init succeeds via the Decision 120 mirror
    command: test -n "$TF_CLI_CONFIG_FILE" && cd terraform/personal && terraform init -backend-config=backend-sandbox.hcl -input=false
    expected: TF_CLI_CONFIG_FILE is set (an unset value means the mirror sync did not run and the ADMIN loop is unavailable) and init succeeds; recover the four no-default tfvars from remote state per terraform/CLAUDE.md BEFORE step 6, or its plan fails on missing required variables
    fix_if: rerun bin/setup-cloud-env.sh with INSTALL_TERRAFORM=1 and confirm a non-empty mirror sync
  - step: 6
    phase: post-deploy
    action: SPLIT-APPLY part 1 -- produce and PRESENT the targeted plan
    command: mkdir -p "${TMPDIR:-/tmp}/ducklake-drill" && cd terraform/personal && terraform plan -target=aws_iam_role_policy.platform_dev_runtime -out="${TMPDIR:-/tmp}/ducklake-drill/platform-dev-reads.tfplan" && terraform show "${TMPDIR:-/tmp}/ducklake-drill/platform-dev-reads.tfplan"
    expected: exactly one in-place update to aws_iam_role_policy.platform_dev_runtime and no other address; the scratch path is defined inline in every step that uses it, because each Bash invocation is independent and an export does not carry over
    fix_if: the plan touches any address beyond platform_dev_runtime -- stop and re-scope rather than widening the target
  - step: 7
    phase: post-deploy
    action: SPLIT-APPLY part 2 -- apply only after explicit human acceptance, and record who accepted
    command: cd terraform/personal && terraform apply "${TMPDIR:-/tmp}/ducklake-drill/platform-dev-reads.tfplan"
    expected: apply succeeds; the PRESENTED plan output from step 6 IS the substituted control for this address (it is never guard-classified), so record the accepting human and feed the outcome into T2.48 c6's auto-apply track record
    fix_if: do NOT run this step before a human has reviewed step 6's output and explicitly directed the apply (Decision 126 clause 1)
  - step: 8
    phase: post-deploy
    action: the lifecycle read works -- rec-3892's own check-first item, asserted rather than eyeballed
    command: bin/venv-python -c "import subprocess,sys; p=subprocess.run(['aws','s3api','get-bucket-lifecycle-configuration','--bucket','agent-platform-data-lake','--profile','agent_platform'],capture_output=True,text=True); blob=(p.stdout+p.stderr); sys.exit('FAIL -- AccessDenied, the grant did not land') if 'AccessDenied' in blob else None; ok = p.returncode==0 or 'NoSuchLifecycleConfiguration' in blob; sys.exit('FAIL -- unexpected error '+blob[:200]) if not ok else None; print('LIFECYCLE READ OK -- present' if p.returncode==0 else 'LIFECYCLE READ OK -- absent (NoSuchLifecycleConfiguration)')"
    expected: exits 0 on either a lifecycle document or NoSuchLifecycleConfiguration, and NON-ZERO on AccessDenied -- the discriminator is an assertion, not prose; record present/absent into the drill fixture
    fix_if: non-zero -- s3:GetLifecycleConfiguration did not apply
  - step: 9
    phase: post-deploy
    action: version listing works on BOTH DuckLake prefixes
    command: aws s3api list-object-versions --bucket agent-platform-data-lake --prefix ducklake/ --max-keys 1 --profile agent_platform && aws s3api list-object-versions --bucket agent-platform-data-lake --prefix ducklake-neon-smoke/ --max-keys 1 --profile agent_platform
    expected: BOTH succeed -- the smoke prefix matters because it holds rec-3892's 1,400-marker corpus, and an s3:prefix condition admitting only ducklake/* would not match ducklake-neon-smoke/
    fix_if: the smoke call is AccessDenied -- the s3:prefix condition admits only one prefix; widen it to both DuckLake data prefixes
  - step: 10
    phase: post-deploy
    action: the DEP-13 fence returns explicitDeny, not merely a denial
    command: |-
      bin/venv-python -c "import subprocess,json,sys; acct=subprocess.run(['aws','sts','get-caller-identity','--profile','agent_platform_admin','--query','Account','--output','text'],check=True,capture_output=True,text=True).stdout.strip(); role='arn'+':aws:iam::'+acct+':role/PlatformDev'; B='arn'+':aws:s3:::agent-platform-data-lake'; ctx=lambda pfx: ['--context-entries','ContextKeyName=s3'+':prefix,ContextKeyValues='+pfx+',ContextKeyType=string'] if pfx else []; sim=lambda a,r,pfx: json.loads(subprocess.run(['aws','iam','simulate-principal-policy','--policy-source-arn',role,'--action-names',a,'--resource-arns',r,'--profile','agent_platform_admin','--output','json']+ctx(pfx),check=True,capture_output=True,text=True).stdout)['EvaluationResults'][0]; rows=[('s3:GetObjectVersion',B+'/tfstate/personal/terraform.tfstate',None,'explicitDeny'),('s3:GetObjectVersion',B+'/tfplan/personal/probe',None,'explicitDeny'),('s3:GetObjectVersion',B+'/convergence/personal/probe',None,'explicitDeny'),('s3:GetObjectVersion',B+'/ducklake/probe.parquet',None,'allowed'),('s3:ListBucketVersions',B,'tfstate/personal/','explicitDeny'),('s3:ListBucketVersions',B,'ducklake/','allowed')]; res=[(a,pfx,want,sim(a,r,pfx)) for a,r,pfx,want in rows]; bad=[(a,pfx,want,e.get('EvalDecision'),e.get('MissingContextValues')) for a,pfx,want,e in res if (e.get('MissingContextValues') or []) or e.get('EvalDecision')!=want]; sys.exit('FENCE FAIL '+repr(bad)) if bad else print('FENCE OK -- 6 rows, both verbs, all three fenced prefixes')"
    expected: >-
      six rows pass. BOTH fenced verbs are simulated, not just the object one -- s3:GetObjectVersion
      against all THREE fenced prefixes (tfstate, tfplan, convergence) and s3:ListBucketVersions
      against the bucket ARN under an s3 prefix context entry, which is the statement most at risk
      of being inert and which an HCL text assertion structurally cannot evaluate. explicitDeny is
      the whole point -- implicitDeny would mean the probe is refused by ABSENCE of Allow and would
      read identically with the Deny omitted or inert. The two allowed rows prove the Allow's own
      prefix condition admits the production prefix and that the bucket-level Deny is not
      over-broad. THE CONTEXT ENTRY IS MANDATORY on the list rows -- without it the simulator
      returns implicitDeny plus a non-empty MissingContextValues and the row would prove nothing,
      so the command fails loudly on any missing context value rather than reading it as a pass.
      Verified 2026-09-20 that this tool discriminates all three decisions against the PlatformDev
      principal, and that the added verbs are implicitDeny today, so this is a genuine before/after.
    fix_if: >-
      FIRST hypothesis on any mismatch is IAM eventual consistency, not a policy defect -- this step
      runs moments after step 7's apply, so wait and re-run once before editing anything. A
      MISSING_CONTEXT row means the context entry was dropped, not that the fence failed. Only if a
      mismatch survives a settle-and-retry -- implicitDeny on a fenced prefix means the Deny is
      missing or carries a resource shape its verb can never match; a bare denial on an allowed row
      means the grant did not land. This step runs ONLY under agent_platform_admin; PlatformDev
      AccessDenies on iam:SimulatePrincipalPolicy.
  - step: 11
    phase: post-deploy
    action: capture the pre-rule forensic inventory of BOTH prefixes
    command: mkdir -p "${TMPDIR:-/tmp}/ducklake-drill" && for P in ducklake/ ducklake-neon-smoke/; do aws s3api list-object-versions --bucket agent-platform-data-lake --prefix "$P" --profile agent_platform --output json > "${TMPDIR:-/tmp}/ducklake-drill/$(echo "$P" | tr / _)json"; done && bin/venv-python -c "import json,os,glob; d=os.environ.get('TMPDIR','/tmp')+'/ducklake-drill'; [print(os.path.basename(f), json.load(open(f)).get('IsTruncated'), len([x for x in json.load(open(f)).get('Versions',[]) if not x['IsLatest']]), len(json.load(open(f)).get('DeleteMarkers',[]))) for f in sorted(glob.glob(d+'/*json'))]"
    expected: >-
      per prefix, IsTruncated is false and the noncurrent-version and delete-marker counts are
      recorded into the fixture. Baseline measured 2026-09-20 -- production 19,360 noncurrent and
      19,360 markers; smoke 1,400 and 1,400. The smoke corpus is the ONLY surviving record of the
      deleter rec-3892 names, and the sibling plan's rule does not sweep it.
    fix_if: IsTruncated is true -- paginate fully; a partial inventory is not evidence
  - step: 12
    phase: post-deploy
    action: rehearse copy-forward recovery, capturing the per-key version count BEFORE the drill
    command: bin/venv-python -c "import json,os,subprocess; d=os.environ.get('TMPDIR','/tmp')+'/ducklake-drill'; inv=json.load(open(d+'/ducklake_json')); latest={x['Key'] for x in inv.get('DeleteMarkers',[]) if x['IsLatest']}; c=[x for x in inv.get('Versions',[]) if x['Key'] in latest and x['Size']>0 and '-' not in x['ETag'].strip(chr(34))]; assert c, 'no candidate -- needs a delete marker over a sized, NON-multipart noncurrent version'; k=sorted(c,key=lambda x:(x['Key'],x['LastModified']),reverse=True)[0]; key=k['Key']; pre=len([x for x in inv.get('Versions',[]) if x['Key']==key])+len([x for x in inv.get('DeleteMarkers',[]) if x['Key']==key]); json.dump({'key':key,'version_id':k['VersionId'],'size':k['Size'],'etag':k['ETag'],'pre_versions':pre},open(d+'/candidate.json','w')); print('candidate selected, pre-drill versions on this key', pre)" && bin/venv-python -c "import json,os,subprocess; d=os.environ.get('TMPDIR','/tmp')+'/ducklake-drill'; c=json.load(open(d+'/candidate.json')); b='agent-platform-data-lake'; subprocess.run(['aws','s3api','copy-object','--bucket',b,'--key',c['key'],'--copy-source',b+'/'+c['key']+'?versionId='+c['version_id'],'--profile','agent_platform'],check=True,capture_output=True); h=json.loads(subprocess.run(['aws','s3api','head-object','--bucket',b,'--key',c['key'],'--profile','agent_platform'],check=True,capture_output=True,text=True).stdout); assert h['ContentLength']==c['size'],(h['ContentLength'],c['size']); assert h['ETag']==c['etag'],(h['ETag'],c['etag']); print('RECOVERED -- ContentLength and ETag match the noncurrent version')"
    expected: >-
      the restored object's ContentLength and ETag match the noncurrent version exactly. Candidate
      selection excludes multipart ETags by construction, because copy-object on a multipart source
      yields a whole-object MD5 that will never equal an -N-suffixed source ETag -- that would fail
      on a CORRECT recovery. Measured 2026-09-20 that all 19,360 production candidates are
      non-multipart, so the filter excludes nothing today and is a guard against future drift.
    fix_if: >-
      the assertion on candidate presence fires -- re-take step 11's inventory, it is stale. A
      copy-object refusal means GetObjectVersion is not reaching the object prefix.
  - step: 13
    phase: post-deploy
    action: re-hide the restored object and assert the MEASURED version delta
    command: bin/venv-python -c "import json,os,subprocess; d=os.environ.get('TMPDIR','/tmp')+'/ducklake-drill'; c=json.load(open(d+'/candidate.json')); b='agent-platform-data-lake'; subprocess.run(['aws','s3api','delete-object','--bucket',b,'--key',c['key'],'--profile','agent_platform'],check=True,capture_output=True); r=json.loads(subprocess.run(['aws','s3api','list-object-versions','--bucket',b,'--prefix',c['key'],'--profile','agent_platform'],check=True,capture_output=True,text=True).stdout); post=len([x for x in r.get('Versions',[]) if x['Key']==c['key']])+len([x for x in r.get('DeleteMarkers',[]) if x['Key']==c['key']]); delta=post-c['pre_versions']; assert delta==2,(c['pre_versions'],post,delta); print('RESIDUAL measured --', c['pre_versions'], '->', post, 'delta', delta)"
    expected: >-
      the delta is exactly 2 -- copy-forward adds a version and a bare delete-object adds a SECOND
      delete marker. This is a MEASURED delta against the pre-drill count captured in step 12, not
      an absolute floor and not a hand-authored constant. True restoration would need
      s3:DeleteObjectVersion, which this plan deliberately does not grant. Both list legs filter on
      exact key equality, so a sibling key sharing the prefix cannot inflate the count.
    fix_if: the delta is not 2 -- something else wrote to the key mid-drill; re-take and re-run
  - step: 14
    phase: post-deploy
    action: the drill evidence is committed, honest about the residual, and free of raw object paths
    command: bin/venv-python -c "import json; d=json.load(open('tests/fixtures/ducklake_recovery_drill.json')); assert d['recovered'] is True; assert d['etag_match'] is True; assert d['version_residual'] == 2; assert 'key_sha256' in d and 'key' not in d; assert d.get('lifecycle_configuration_present') is not None; assert d['pre_rule_inventory']['production']['markers'] > 0 and d['pre_rule_inventory']['production']['noncurrent'] > 0; assert d['pre_rule_inventory']['smoke']['markers'] > 0 and d['pre_rule_inventory']['smoke']['noncurrent'] > 0; print('drill evidence OK', d['captured_at'])"
    expected: assertions pass -- the fixture records key_sha256 rather than a raw key (Decision 101), the measured residual, the lifecycle-read result, and BOTH prefixes' pre-rule inventories
    fix_if: the fixture records a raw object key, or a residual it did not measure
test_obligations:
  - source: terraform/personal/platform_dev_policies.tf
    behavior: >-
      The PlatformDev data-lake reads stay prefix-scoped, and BOTH DEP-13 Deny statements keep the
      version-read verb family off the tfstate, tfplan and convergence prefixes with a resource
      shape their verbs can actually match.
    verification_step: 2
    test_selector: tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py
    red_green_expectation: red before, green after
  - source: config/agent/verification_registry/entries/platform-dev-data-lake-read-fence.yaml
    behavior: >-
      The graduated fence check is admitted by run_differential (its check_spec FAILS at
      origin/main, where the guard module does not exist) and is found new-in-diff under this
      plan's slug.
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before, green after
constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Never widen the CI apply role to avoid the SPLIT-APPLY -- Decision 180 clauses 2-3 are permanent
  - s3:GetObjectVersion is granted on the DuckLake object prefixes only; a bucket-wide grant reopens the DEP-13 ExternalId-in-state escalation path
  - Do NOT grant PlatformDev iam:SimulatePrincipalPolicy to make the fence proof self-service -- see the context note
  - Public-repo boundary (Decision 101) -- the drill fixture records a key digest, never raw lakehouse object paths, ARNs or account ids; tfvars are never pasted into chat, a PR, or any committed file. Note AWS CLI error text embeds the caller ARN, so probe output is redacted before it is shared anywhere public
  - The recovery drill is NOT self-reverting; it leaves a measured +2 version residual on one key
context:
  - "Decision-scout verdict + CITE list: FLAGS_FOUND. CITE: Decision 192, 180, 126, 120, 181, 132, 176, 189, 191, 188. Decisions triaged: 148 of 148. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 3."
  - "gates: decision-scout=FLAGS_FOUND (2 rounds, 148 of 148 triaged each); plan-critique=PROCEED after 4 round(s); round 4 autonomous confirming round per the convergence rule"
  - "Sequencing: this plan lands FIRST. PLAN-ducklake-noncurrent-version-reclaim depends on the grants here, and on step 11's inventory being captured before any expiry rule exists."
  - "closes_criteria is EMPTY deliberately. T2.18 c2 is the sole open criterion and its closer is rec-3870 over the N-cycle window (rec-3870 re-grounded N to roughly 5 at 2026-09-20T05:06Z, pending confirmation at cycle 2 -- do not hardcode 9); this plan is an ENABLER for c2's efficacy half, not its closer. Precedent: PLAN-compaction-scope-policy-matrix.yaml:16,500 on this same tier item."
  - "rec-3892 is NOT bundled here. Its stored acceptance is a two-clause conjunction whose clause 2 names TestDataLakeLifecycleGoverned, which the SIBLING plan creates; closing it here would close a rec whose own acceptance command cannot pass."
  - "This plan also discharges rec-3907's second half (the unrehearsed recoverability). rec-3907 itself is bundled and closed by the sibling, whose closure step cites this plan's fixture."
  - "Decision 113 / Decision 144 clause 3 (DEP-13): DenyStateRead currently denies only s3:GetObject on tfstate/personal/*; s3:GetObjectVersion is a distinct action outside that Deny. The trust document carrying sts:ExternalId lives in tfstate (platform_roles.tf:56), so this is the escalation path, not a formality."
  - "IAM action-type asymmetry, load-bearing: s3:GetObjectVersion is OBJECT-level (Resource bucket/key) but s3:ListBucketVersions is BUCKET-level (Resource bucket ARN, prefix-scopable only via the s3:prefix condition key). A Deny listing ListBucketVersions against an object-prefix ARN never matches and is INERT -- a text assertion over HCL cannot see that, which is why step 2 asserts resource SHAPE and step 10 uses simulate."
  - "A prefix-conditioned Deny cannot fence an unprefixed or shorter-prefix list, so the Allow's own s3:prefix condition is the PRIMARY fence and the Deny is defence-in-depth."
  - "Fence-proof mechanism, measured 2026-09-20 under agent_platform_admin: aws iam simulate-principal-policy evaluates the PlatformDev principal correctly, returning explicitDeny on the two Denies that already exist (GetObject on tfstate, PutObject on convergence), implicitDeny on the three verbs this plan adds, and allowed on a verb PlatformDev already holds. That three-way discrimination is what makes the fence checkable. An earlier draft tried to express this through the EXISTING docs/contracts/iam-simulate-fixture.yaml; that specific file is not usable, because principal_arn reads ONE fixture-level principal (agent-platform-github-ci-apply) with no per-row override, so every row would have simulated the wrong identity, and build_triples rejects any wildcard in a target ARN. Note the RUNNER is not the obstacle -- scripts/ci/iam_simulate.py takes --fixture as a first-class parameter, so a SECOND fixture whose principal is PlatformDev is architecturally supported and would give the declared expectation table, the required_context_keys to ContextEntries path, and the fix-in-HCL-never-by-editing-the-expectation discipline for free. It is not adopted here for one honest reason -- validate_iam_simulate_fixture_shape is hardwired to a single _CONTRACT_NAME, so a second fixture would get no PR-time shape check, trading a guarded inline command for an unguarded declarative one. Revisit if that validator is generalised."
  - "DELIBERATE NON-GRANT: PlatformDev AccessDenies on iam:SimulatePrincipalPolicy, so the fence proof is admin-only. Granting it was considered and refused on three grounds -- it is a permission-enumeration primitive on the ambient identity every CC-web session assumes, which cuts against the very DEP-13 posture this plan strengthens; it would need its own SPLIT-APPLY and its own fence proof; and the verifier should not be the verified, the same actor/observer separation Decision 188/192 apply to GC. The cost is zero, because every post-deploy step here already runs in the ADMIN container where the SPLIT-APPLY happens."
  - "DECLARED RESIDUAL (Decision 181 clause 2 / Decision 187 point 2 -- silence is not a disposition): this plan does NOT widen scripts/checks/iam_tf/validate_agent_observability_read_coverage.py, so the new PlatformDev S3 coverage is unasserted and could drift back out. Owner: rec-3946. Two reasons it is not fixed here -- _resource_covered is Effect-BLIND (reproduced: a Deny-only statement returns covered=True), so a naive row would go green on the very Deny this plan adds and stay green with the Allow deleted; and the containment predicate needed for a real red case requires a DECLARED per-role instance set, since a domain derived from the role's own grants is tautological. Both are changes to a shipped check, not to this plan's surface."
  - "Blast-radius note for rec-3946's implementer: terraform/personal holds TWO aws_s3_bucket resources (data_lake, ducklake_catalog_dr). The module's test_real_tree_all_covered examines 9 observability-managed resources (the module has 11 tests -- different number, do not conflate). A naive PlatformDev row reddens it for the DR bucket, and the tempting remedy -- widening PlatformDev's S3 Resource to arn:aws:s3:::agent-platform-* -- would reach the bootstrap state bucket and the DR bucket, neither of which any DEP-13 Deny fences."
  - "FIXTURE SEQUENCING: tests/fixtures/ducklake_recovery_drill.json can only be produced by post-deploy steps 11-13, which run after the SPLIT-APPLY, which runs after the PR. It therefore lands in a SECOND commit with the full tier re-run, not in the commit that handoff_policy gates."
  - "Drill corpus verified 2026-09-20: production holds 19,360 candidates (a delete marker over a sized noncurrent version), 100% of them non-multipart, so a candidate is guaranteed to exist and the ETag assertion is sound. Step 12 still filters on both properties rather than assuming they hold."
  - "PlatformDev DailyOps measures approximately 2,036 B minified against the 10,240 B Decision 156 ceiling; the precondition is per-policy, not the per-role aggregate."
