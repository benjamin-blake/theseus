work_areas: []
rollback: >-
  Revert the platform_dev_policies.tf change and re-apply out-of-band under agent_platform_admin.
  The grants are read-only and additive, so reverting removes visibility without affecting any write
  path. The recovery drill is NOT self-reverting -- copy-forward adds a version and the bare
  delete-object adds a second delete marker, a measured +2 residual on one key (true restoration
  would need s3:DeleteObjectVersion, deliberately ungranted). The key's digest is recorded in the
  fixture so the sibling plan's expiry rule can account for it; the residual ages out with the rest
  of the prefix.
