pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Baseline recorded before editing -- compiled check count is 43 and both budgeted files are at budget
execution_steps:
  - >-
    rec-3308 first. In scripts/data_quality_compile.py, add a module-level declared set of
    write-time-only test types (path_syntax, acceptance_lint) that _compile_column_test recognises
    and returns None for, documented as deliberately not SQL-compilable; then raise ValueError for
    any test type in neither that set nor the compilable set. Malformed params of a RECOGNISED type
    keep returning None -- do not change those two existing tests.
  - >-
    In scripts/ops_portal/write_validators.py, make _load_write_time_validators raise on a
    write_time test name it does not recognise. Verify against ops.yaml first that every existing
    write_time name is recognised, so the raise cannot fire on current config.
  - >-
    Rewrite tests/test_data_quality_compile.py::test_compile_column_test_invalid for the new raise
    contract and add the step 1 and step 2 nodes.
