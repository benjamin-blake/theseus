      portal connectivity and re-file. Do NOT proceed to step 13 with (a) unfiled, or rec-2917's
      close would discard a live measured proposal.
  - step: 12
    phase: post-deploy
    action: Closure obligation -- confirm the three bundled recs actually closed via the Resolves trailer.
    command: |-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; by={r['id']: r for r in rows}; [print(i, by[i]['status']) for i in ('rec-2915','rec-3089','rec-3085')]; assert all(by[i]['status']=='closed' for i in ('rec-2915','rec-3089','rec-3085'))"
    expected: All three print "closed" and the assertion passes.
    fix_if: >-
      rec-autoclose.yml did not fire or the trailer was malformed; fall back to the explicit
      `--update-rec <id> --status closed --resolution "..."` portal call per Decision 70.
  - step: 13
    phase: post-deploy
    action: >-
      Surface the rec-2917 close proposal for human confirmation. Decision 103 forbids closing a
      semantically-judged relevance verdict directly -- this emits the command and stops. Verdict is
      `superseded` naming step 11's successor rec, NOT `contradicted`: only the "empty set" phrasing
      was invalidated, while the substantive tree-scoped proposal survives and has been re-filed.
    command: |-
      bin/venv-python -c "import sys; from scripts.ops_data_portal import propose_or_close_rec; successor=sys.argv[1]; cmd=propose_or_close_rec('rec-2917','superseded',f'Empty-set premise invalidated: push_context_base() + ci.yml fetch-depth 2 (dec-159) resolve the post-merge diff base to HEAD~1 -- measured, get_changed_files() returned 5 files under simulated push context. The surviving tree-scoped/change-scoped proposal is re-filed as {successor}.',deterministic=False); print(cmd)" <successor-rec-id-from-step-11>
    expected: >-
      Prints a `--update-rec rec-2917 --status closed ... # relevance=superseded` command naming the
      successor rec. The implementing agent PRINTS it and does not run it; the operator decides.
    fix_if: >-
      The function returns None (the verdict was mistyped as relevant/unknown), the successor id
      placeholder was left unsubstituted, or the agent runs the printed command itself -- which
      would be an unauthorised semantic auto-close.
