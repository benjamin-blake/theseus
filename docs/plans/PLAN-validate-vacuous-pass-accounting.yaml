      checks are non-undeclared; and BOTH "vacuous" and "enforced" appear among real statuses,
      demonstrating the observable discriminates on live run data. (>=97 not 101 because the full tier holds 97 of the 101
      registered checks: 3 are pre-only AND validate_terraform_try is in neither tier.)
