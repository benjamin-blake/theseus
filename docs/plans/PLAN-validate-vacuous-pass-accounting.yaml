constraints:
  - >-
    Do NOT edit scripts/validate.py (Decision 169): dispatch and tier sequence come from the
    per-domain manifests. The ensure_fresh_dq skip is recorded by wrapping inside
    scripts/checks/_scaffolding.py itself, not by adding a scaffold wrapper to the driver loop.
  - >-
    scripts/checks/_scaffolding.py measures 469 SLOC against the 500 unregistered ceiling, leaving
    31 lines of headroom -- enough for the outcome_scope wrapper AND the named credential
    classifier constraint 5 requires. The budget is NOT the binding constraint here; the earlier
    "wrapper only, no logic in this file" framing was unsatisfiable and is retracted. If the file
    does cross 500, DECOMPOSE into a facade package (Decision 128) -- never raise the budget, never
    rely on --update-sloc-budgets (it does not auto-seed a newly-oversized unregistered file).
  - >-
    None of the nine pre-existing Python scope files is pinned in config/coverage_baseline.yaml, so
    every one carries the 100%-per-file standard -- and five of them start BELOW it. Measured this
    session: validate_test_coverage 72% (16 missed), _scaffolding 92% (22), check_graduation_guard
    91% (8), validate_scheduled_agent_logs 91% (5), validate_lambda_deploy_gating 94% (2); the other
    four are already 100%. That is roughly 53 pre-existing uncovered statements on top of the new
    code, and it is the largest schedule risk in this plan. Do NOT add baseline entries to escape it
    -- a new sub-100 entry needs a `# baseline-lowered: dec-NNN` marker and is a reviewable
    exception, not a convenience.
  - >-
    failed_checks and failed_check_attributions are a live consumer contract read by
    scripts/ci_rca/taxonomy.py's Priority-0 path and the ci-rca.yml artifact flow (Decision 142
    lineage; the ci-rca-evidence-fidelity work owns it). Additive fields only; never reorder,
    rename, or re-type those two.
  - >-
    (5) The skip declaration in ensure_fresh_dq_results must attach to a NAMED deterministic
    classifier (scripts/ops_portal/reader_transient.py:36-40's two-tier shape, Decision 155), not to the blanket
    `except Exception:` currently at :205 (its try: opens at :198) -- that handler spans the boto3 import, profile
    resolution, Session construction and the STS call, so a skip on it would launder real bugs into
    accounted skips. Discrimination basis must be explicit about its own limits: botocore types are
    NOT reliably importable at classify time (tests/validate/test_scaffold_gates.py:83-90 stubs
    sys.modules["boto3"] = MagicMock() precisely because boto3 is absent there), so the isinstance
    tier degrades to nothing under test and a named message-pattern tier must carry the
    discrimination -- mirror scripts/ops_portal/reader_transient.py's isinstance-guarded-by-ImportError plus
    message-fallback structure rather than assuming types are available.
  - >-
    (5a) The classifier INSTALLS a fail-closed behaviour that does not exist today: currently
    ensure_fresh_dq_results swallows every exception, prints, and returns with `failed` untouched.
    After this change a non-matching exception APPENDS to `failed` and reddens the full tier. An
    earlier revision described this as "keeping the Decision 55 fail-closed default" -- that was
    factually wrong, there is no such default on this path to keep. Two currently-passing tests
    assert the old behaviour and MUST be reworked, not deleted:
    tests/validate/test_scaffold_gates.py:158 (test_ensure_fresh_dq_skips_when_sso_unavailable) and
    :175 (test_ensure_fresh_dq_skips_when_credentials_unavailable). Both raise a bare
    Exception("Token has expired") / Exception("ProfileNotFound") and assert failed == []; a
    type-based classifier matches neither, so both go red. Rewrite them to raise realistic
    credential exceptions and add a companion case pinning the new non-matching-exception path.
  - >-
    (5b) DISCRIMINATION RULE for the plan's central observable, stated once here and made
    authoritative in docs/contracts/check-accounting.yaml: a check whose derived input DOMAIN is
    empty declares examined(0), yielding status `vacuous`. `skipped(reason)` is reserved for an
    UNAVAILABLE INPUT OR UNMET PRECONDITION -- a missing credential, an absent artefact, a
    recursion guard, an engagement condition that does not hold -- and is never used for an empty
    domain. Apply it uniformly across the tranche; an earlier revision gave structurally identical
    early returns opposite treatments in _check_graduation_guard and validate_lambda_deploy_gating,
    which would have made the plan's own headline observable author-discretionary.
  - >-
    validate_check_accounting keeps the AST scan of ~101 modules fully IN-PROCESS -- no per-module
    subprocess fan-out and no pytest spawn -- so the fast tier stays inside its 5-minute budget. It
    MAY make the two bounded git reads the shrink-only comparison structurally requires, using the
    sanctioned primitives: scripts/checks/_marker_guard.default_base_reader (a single
    `git show origin/main:<path>`, carrying the missing-base SKIP at _marker_guard.py:324 this
    baseline copies) and _common.get_changed_files() for the touch-it-fix-it changed-file set.
    Precedent is live and in the same tier: validate_coverage_baseline_edits,
    validate_mypy_baseline_edits and validate_sloc_budget_raises are all --pre members TODAY and all
    read their base through that same helper (verified this session). An earlier revision said
    "filesystem-only with no subprocess ... the AST scan is the whole check", which was both wrong
    on the precedent and unsatisfiable against AC 6 / VP step 6 -- net-growth detection needs a base
    to compare against, touch-it-fix-it needs the changed-file set, and "an absent base ref SKIPs
    loudly" is meaningless with no git read at all. That framing is retracted. Decision 153's
    subprocess-free clause is scoped to the composite-action guard, not to baseline guards.
  - >-
    config/check_accounting_baseline.yaml ships with NO marker escape grammar. This is a deliberate
    choice recorded in the contract, not an omission (Decision 165 makes scripts/checks/_marker_guard.py
    the mandatory home for any marker grammar, so adding one later means going there).
  - >-
    Do not implement fail-closed vacuity enforcement. A vacuous full-tier check still passes after
    this plan. Wording the Decision as though it were enforced would be exactly Decision 163's
    declared-versus-executed failure mode.
  - >-
    Do not fix validate_scheduled_agent_logs. Its inertness is a producer-disabled condition owned
    by T4.12, not a defect this plan can close; the base blindness is secondary and latent. File
    both as a rec (VP step 11) rather than fixing inline.
  - >-
    Do not close rec-2917 automatically, and do not close it at all until step 11's successor rec is
    filed. Decision 103 requires a close_proposed command for human confirmation on any
    semantically-judged relevance verdict.
  - No rescue agents or workaround loops (Decision 55).
