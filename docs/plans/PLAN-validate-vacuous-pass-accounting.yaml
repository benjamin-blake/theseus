      discovered defect is discarded (AGENTS.md: out-of-scope bugs become recommendations, never
      inline fixes).
    command: bin/venv-python -m scripts.ops_data_portal --guidance
    expected: >-
      Guidance prints; the implementing agent then files TWO recs via file_rec: (a) the surviving
      rec-2917 proposal -- classify registered checks tree-scoped vs change-scoped and run
      tree-scoped ones UNSCOPED in the full tier (rec-2917's own measurement stands: unscoped over
      921 candidate docs yields 0 violations, so validate_environment_taxonomy goes green whole-repo
      immediately and gains an enforcement surface it has never had); (b) validate_scheduled_agent_logs
      is doubly inert -- its producers are disabled (T4.12) AND its raw `git diff origin/main...HEAD`
      base ignores push_context_base(), so it must be revisited when T4.12 re-enables the agents.
