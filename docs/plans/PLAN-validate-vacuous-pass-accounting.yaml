    revive it. The base blindness is real but secondary and latent. The keystone VP step was rebuilt
    on the graduation guard instead (step 9), where the red-green is genuine and hermetic.
  - >-
    THE GRADUATION GUARD IS THE REAL DEAD GATE, confirmed empirically on the clean tree: it bases off
    `git diff HEAD` -- the WORKING TREE -- which is empty on every CI checkout, so it early-returns
    on every CI run and has never enforced there. This is deeper than rec-3085 describes: the guard
    never reaches the dq-latest.json branch that rec cites. Fixed here by operator decision. The fix
    is TWO call sites, not one: the diff base plus the paired `git show HEAD:{path}` old-content
    read -- repointing only the diff would leave the guard live but permanently blind, since
    old_map would equal new_map and no false->true flip could ever be detected.
  - >-
    GRAIN DECLARATION for check_outcomes (AGENTS.md data-modeling default: name the grain before
    designing the record). ONE ROW PER DISPATCHED CHECK, PLUS ANY SCAFFOLD THAT OPENS AN
    outcome_scope -- because the ensure_fresh_dq scaffold shares the collection, a check-only grain
    would be mixed the moment rec-3085's half lands. Each row therefore carries `kind`
    ("check" | "scaffold") alongside the status and the step name, whose field is named `check` --
    matching VP step 10's probe, which keys rows on r['check']; the contract must declare that
    same field name so the executable assertion and the derive-and-assert contract cannot drift. KNOWN GAP, constraint-1-imposed:
    full_sequence() dispatches 103 steps (97 checks + 6 scaffolds -- lint, unit_tests,
    terraform_checks, dependency_health, ensure_fresh_dq, precommit_all_files) but only
    ensure_fresh_dq is wrapped here, because the other five closures live in scripts/validate.py
    lines 112-140 which constraint 1 forbids editing. Achievable row count is therefore 98 at the time of writing, rising to 99 once this plan's own
    validate_check_accounting joins the full tier. Do NOT carry either literal into
    docs/contracts/check-accounting.yaml as an assertion -- tests/CLAUDE.md's count-coupling rule
    applies and Decision 168 makes that file derive-and-assert authoritative; state the RULE, not
    a number.
    Do NOT state the wider "one row per dispatched step" form in the contract -- Decision 168 makes
    the contract derive-and-assert authoritative, so an unachievable grain there would ship exactly
    the false-authoritative-statement defect that rule exists to prevent. Separately,
    ensure_fresh_dq_results' fresh-cache early return (_scaffolding.py:189-193) declares nothing and
    will read `undeclared`; declare it as a skip (the runner was not needed) rather than leaving the
    plan's own new scaffold row undeclared on the common path.
    Write mode is append-within-run then whole-file replace: the evidence
    file is regenerated every full run and never read as history, so this is not an SCD2 or
    event-journal table and needs no merge key, identity or partitioning -- it is a run artifact.
    That distinction is worth stating because the natural successor home for this stream at T2.36
    IS telemetry_observations, where the full data-modeling walk WOULD apply; this plan does not
    create that dependency and does not claim any T2.36 criterion.
  - >-
    SECOND live behaviour change to expect, in addition to the guard below: the ensure_fresh_dq
    classifier (constraint 5a) installs a fail-closed path where none exists today. A non-credential
    exception in the DQ probe -- a genuine bug in profile resolution, say -- will now redden the full
    tier instead of printing and returning green. That is the intended correction, but it is a
    behaviour change to the full tier that was previously undeclared here, and it is why two
    currently-passing tests must be reworked rather than merely extended.
  - >-
    Live behaviour change to expect: the guard starts actually enforcing in CI for the first time. It
    only appends a failure when DQ YAML changed AND an enforced:false->true flip happened AND that
    check's verdict is not PASS, so blast radius is narrow -- but non-zero, and a PR doing exactly
    that will now be blocked where it previously sailed through. See rollback, which treats this hunk
    as independently revertible. The round-1 critique noted (non-blocking) that Decision 162's
    sequencing argument would favour splitting this fix into its own atomic plan; the operator chose
    to bundle it, and the independent-revert path is the mitigation.
  - >-
    Ordering: the base fix must not land BEFORE the skip declarations, because the fix is what first
    makes rec-3085's hole reachable in CI (pre-fix the guard never got far enough to care whether
    dq-latest.json existed). The reverse order is harmless -- landing skip declarations first is a
    no-op on an inert guard. An earlier revision overstated this as "must land together".
  - >-
    rec-2917 EXCLUDED and closed as `superseded`, operator-confirmed, with a successor rec filed
    FIRST (VP step 11). Its "empty set CI domain" phrasing is invalidated: Decision 159's
    push_context_base() plus ci.yml's fetch-depth 2 resolve the post-merge base to HEAD~1 -- measured
    on this branch, get_changed_files() returned 5 real files under simulated push context. But its
    substantive proposal is untouched and still measured-good: push_context_base() yields one
    squashed PR's files, not the whole tree, so tree-scoped checks still never see the repo at rest,
    and rec-2917's own finding that validate_environment_taxonomy run unscoped over 921 candidate
    docs yields 0 violations still stands. Closing as `contradicted` with nothing behind it would
    discard that; hence `superseded` plus a successor.
  - >-
    rec-3086 (_marker_guard laundering a skip into an affirmative pass) is DEFERRED, not closed, per
    the operator's original framing. It stays open and untouched. It is the same defect family one
    layer down, and the natural second consumer of this plan's vocabulary.
  - >-
    Decision 62's premise is stale and should be cited as such rather than worked around: it declined
    a separate DQ scheduled routine because ensure_fresh_dq_results() handles the auto-invoke on "the
    EC2 self-hosted runner, which has SSO credentials". That runner was retired (CD.21 / Decision
    112), which is precisely why rec-3085's creds-absent path exists at all.
  - >-
    T2.55 lineage is PARTIALLY inherited, and the plan does not claim otherwise. This delivers
    T2.55 c1's shape (a frozen shrink-only baseline with no exception grammar) and adds a
    touch-it-fix-it clause so a maintained check cannot stay exempt indefinitely. It does NOT close
    c2 (an owned burn-down plan naming a pace and an owner for the 96 grandfathered entries); that
    remains T2.55's to own, and this plan claims no criterion on it.
  - >-
    RATCHET LIMITATION, to be stated plainly in the Decision text rather than discovered later: the
    AST ratchet proves a declaration EXISTS in a check module, not that EVERY exit path reaches one.
    rec-2915's own measurement was 35 unconditional-success early-return sites across 24 checks --
    exactly the path-level shape a module-level scan cannot see. The deferred fail-closed trigger
    must therefore key on a path-aware metric (e.g. declaring-path coverage of the adopted set), not
    on the undeclared CHECK count, which is blind to the same gap.
  - >-
    Baseline seed arithmetic, measured this session: 101 registered checks and 101 manifest entries;
    5 adopted in this plan's tranche; 96 baseline entries at seed. 36 checks are full-tier-only and
    3 are pre-only; validate_terraform_try is registered but dispatched in neither tier, so the tier
    union is 100 (which is why VP step 10 asserts >=97, not 101). The baseline being ~95% of the
    population is the honest starting point -- stock-grandfathered / flow-zero-tolerance is this
    repo's ratified pattern (Decisions 130, 159, 162), and it is what gives rec-2915's "make the
    next instance unbuildable" property.
  - >-
    rec-2915's acceptance string names `tests/test_checks_registry.py`, a path that does not exist
    and does not match the current mirror convention (registry.py resolves to the tests/checks/registry/
    PACKAGE via map_source_to_test). The acceptance is re-grounded onto
    tests/checks/registry/test_accounting.py; do not create a file at the stale path to satisfy a
    literal grep, which validate_placement would reject anyway.
  - >-
    The existing scripts/ci_rca/vacuous_pass.py is a DIFFERENT object despite the name collision: it
    parses pytest COLLECTION vacuity out of a CI log for the RCA evidence bundle on a red main run.
    This plan's object is per-check examined-input vacuity on any run, green ones included. Do not
    merge them or route one through the other. Separately, rec-3089 names
    scripts/ci_rca/probe_health.py as "the right shape for the accounting, applied to a different
    object" -- worth one look at implement time for the rollup shape, not a dependency.
  - >-
    Known cosmetic drift, out of scope and deliberately not fixed: scripts/ci_rca/taxonomy.py:103 and
    scripts/ci_rca/evidence/__init__.py's --help string both describe this artifact as
    "schema_version 2" and go stale at the bump. Neither affects behaviour (the consumer reads by
    key). Noted so the next reader does not mistake it for a live contract claim.
  - >-
    Decision draft (text to be authored at implement time; re-check the current max `## Decision NNN:`
    header first, since numbers are not reserved at draft time and a concurrent PR may have claimed
    it). Commitment: the registered-check contract gains a second, declarative output channel; a
    check may declare the input set it examined or that it skipped; the run evidence records that
    per check; and adoption is governed by a shrink-only ratchet that a new check can never join and
    that an edited baselined check cannot ignore. Explicitly NOT committed: fail-closed enforcement
    of vacuity. State the module-versus-path limitation above. Deferred-work trigger: revisit
    fail-closed once a path-aware declaring-coverage metric on the adopted set passes a stated
    threshold. Reversal conditions: if the accounting proves to be noise (no vacuous finding drives a
    fix within a stated window) or the ratchet wedges unrelated PRs, unwind is channel + baseline +
    schema v3 together, since consumers key off the v3 shape. Must carry the fenced yaml metadata
    envelope and a significance routing claim (numbered_decision), per Decisions 167/150.
  - >-
    IMPLEMENT-TIME NOTE (post-hoc, added at execution): constraint 2's predicted scenario
    materialized -- scripts/checks/_scaffolding.py crossed 500 SLOC once the accounting/DQ-
    classifier code landed (measured 507). Per that constraint's own instruction, DECOMPOSED
    rather than raised: the pre-existing, unrelated heavy-dependency test-deferral machinery
    (run_pytest_diff and its helpers, ~350 SLOC, no coupling to this plan's accounting work) moved
    to a new sibling module, scripts/checks/_pytest_diff.py, with scripts/checks/_scaffolding.py
    re-exporting its public surface for facade back-compat (mirrors the existing _terraform.py
    pattern in the same file). scripts/test_coverage_checker.py's _ORCHESTRATION_SCAFFOLDING_FILES
    set gained the new module's basename so it maps to the same tests/validate/ home _scaffolding.py
    and _terraform.py already use. tests/validate/test_pytest_diff.py gained direct-unit tests for
    two previously-uncovered branches (_excluded_and_absent's empty-input guard,
    _match_changed_test_path's directory-target ValueError branch) to hold 100% coverage on the
    newly-split file. None of these three files carry any accounting-channel logic; the split is a
    pure Decision 128 decompose-by-default mechanical move, out of this plan's own scope table by
    construction (a file that did not exist when the plan was authored), but recorded here so a
    future reader does not need to reverse-engineer it from the diff.
