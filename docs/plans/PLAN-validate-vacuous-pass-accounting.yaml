schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "validate-vacuous-pass-accounting"
intent: >-
  Give the registered-check contract a second output channel so a vacuous pass, a skip and an
  enforced pass stop collapsing into one indistinguishable green, and record that channel in the
  run evidence. This is the observable the recursive-improvement loop needs before any gate can be
  trusted as enforcement rather than as mere absence of failure.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-validate-vacuous-pass-accounting.yaml
phase: >-
  Platform hygiene / verification-system integrity. Not a tier_item slice -- rec-driven
  (source=manual + architectural-review), so the Tier Item Freshness Gate is skipped under the
  ad_hoc_rec soft-warn exception category. Adjacent to T3.7 (validation-suite meta-validation,
  deferred_post_mvp), T2.54 (clause-to-check traceability, not_started) and T2.55 (frozen
  shrink-only baselines, not_started); this plan supplies the per-check examined/skip observable
  and claims no criterion on any of them. See the T2.55 partial-inheritance note in context.
scope:
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Add the per-run accounting channel next to Check: the ambient accumulator, the public
      examined(count, unit=)/skipped(reason) API check bodies call, an outcome_scope(name, kind=)
      context manager for non-check scaffolds, the CheckOutcome record (carrying `kind`, see the
      grain declaration in context), and the single status-derivation function
      (failed|skipped|vacuous|enforced|undeclared). Chosen as the home because every
      check module already imports this module, so no check gains a new import, and rec-2915 names
      registry.Check as the natural home. Also extends the module docstring's SIX-surface
      registration enumeration to SEVEN by naming the declaration obligation, so a new check's
      author meets it before composing the body (Decision 66 pre-composition injection).
  - file: scripts/checks/validation_result.py
    action: Modify
    purpose: >-
      dispatch_recording() brackets each check call with the accounting scope and harvests the
      outcome (it currently measures a check ONLY by diffing len(failed), which is the mechanism
      that makes a skip and a pass byte-identical). write_completed() emits schema_version 3 with
      check_outcomes plus ran_checks/skipped_checks/vacuous_checks/undeclared_checks rollups.
      failed_checks and failed_check_attributions keep their exact v2 shape (Decision 142).
  - file: scripts/checks/_scaffolding.py
    action: Modify
    purpose: >-
      ensure_fresh_dq_results() records its creds-absent early return as a declared skip
      (rec-3085 half 1). Requires TWO edits, not one: a
      registry.outcome_scope("ensure_fresh_dq", kind="scaffold") wrapper, AND narrowing the blanket
      `except Exception:` at :205 (its try: opens at :198) via a named module-level classifier, because a skip
      attached to the blanket handler would launder real bugs into accounted skips. See constraint 5
      -- the earlier "wrapper only, no logic here" framing was unsatisfiable against the live code
      and is retracted. THIS INSTALLS A NEW FAIL-CLOSED BEHAVIOUR (constraint 5a): today the handler
      swallows every exception and never touches `failed`; after this change a non-matching
      exception appends to `failed`. That is a live full-tier behaviour change, not a preserved
      default.
  - file: scripts/checks/roadmap/check_graduation_guard.py
    action: Modify
    purpose: >-
      Two changes. (a) Base fix: derive the changed-DQ-YAML set from _common.get_changed_files()
      (which honours push_context_base()) instead of `git diff HEAD`, and repoint the paired
      `git show HEAD:{path}` old-content read at the same base. `git diff HEAD` reads the WORKING
      TREE; every CI checkout is clean, so the guard has early-returned on every CI run since it
      shipped and has never enforced there. Repointing only the diff would leave the guard live
      but permanently blind (old_map == new_map, so no false->true flip is ever detected) -- both
      call sites must move together. (b) Declare examined counts and record the dq-latest.json
      missing/unreadable/no-checks degradations as skips rather than silent WARN-and-return
      (rec-3085 half 2). Also pay the measured 91%/8-statement pre-existing coverage debt
      (lines 73-75, 98, 103, 106, 114-115).
  - file: scripts/checks/misc/validate_test_coverage.py
    action: Modify
    purpose: >-
      Declare examined counts (the count already exists -- the check prints "N source files
      checked" to stdout with no structured channel). Per constraint 5b all THREE early returns are
      classified, not two: the recursion guard (:40) and the checker-absent return (:45) are unmet
      preconditions -> skipped, while the no-source-file-changes return (:50) is an empty domain ->
      examined(0)/vacuous. Also pay the measured 72%/16-statement pre-existing
      coverage debt (lines 11-27, the whole _load_coverage_checker body, plus 41-42) -- the worst
      coverage gap in scope.
  - file: scripts/checks/misc/validate_scheduled_agent_logs.py
    action: Modify
    purpose: >-
      Declare on every reachable exit path per constraint 5b: the empty-diff return is an empty
      domain -> examined(0)/vacuous, while the "not a scheduled-agent branch" return is an UNMET
      PRECONDITION -> skipped(reason). Pay the measured 91%/5-statement coverage debt.
      DIAGNOSIS CORRECTED (see context): this check's domain is
      empty because the scheduled-agent producers are DISABLED (T4.12), not because of its diff
      base -- it engages only when every changed path is under logs/, which no ordinary branch or
      squashed merge satisfies. Its raw `git diff origin/main...HEAD` base is a real but SECONDARY
      latent defect that only starts to matter if T4.12 re-enables the producers. Neither is fixed
      here; both are filed as a follow-on rec (VP step 11).
  - file: scripts/checks/iam_tf/validate_environment_taxonomy.py
    action: Modify
    purpose: Declare the examined count of candidate docs. Already at 100% coverage.
  - file: scripts/checks/lambda_pkg/validate_lambda_deploy_gating.py
    action: Modify
    purpose: >-
      Apply constraint 5b's discrimination rule: BOTH the no-changed-files and the
      no-affected-artifacts early returns are empty DOMAINS, so both declare examined(0) -> vacuous,
      NOT skipped. (An earlier revision called these skips, which contradicted the identical shape
      in _check_graduation_guard; the rule now settles it uniformly.) On the implementing branch
      this check is the deterministic source of the live `vacuous` reading VP step 10 asserts, since
      no Lambda artifact is affected. Also pay the measured 94%/2-statement coverage debt.
  - file: scripts/checks/hygiene/validate_check_accounting.py
    action: Create
    purpose: >-
      The adoption ratchet, and rec-2915's structural-prevention half. AST-scans each registered
      check's defining module for an examined()/skipped() declaration and fails when a check absent
      from config/check_accounting_baseline.yaml declares none. MUST genuinely read
      docs/contracts/check-accounting.yaml -- naming the basename as an executable-context string
      literal and derive-and-asserting the status vocabulary from it, exactly as
      scripts/checks/deps/validate_check_manifests.py:59 does for its own contract -- because Decision 168's
      evaluator-resolution rule fails a new Class D file whose declared evaluator does not resolve.
      Filesystem-only, no subprocess, so it is safe in the fast tier (Decision 153). Carries a
      frozen in-module constant cross-check so a config-file edit alone can never admit a new
      member (Decision 162).
  - file: scripts/checks/hygiene/_manifest.py
    action: Modify
    purpose: >-
      One Entry literal (bare string-literal module=/attr=) registering validate_check_accounting
      in BOTH tiers -- pre=True with
      pre_globs=("scripts/checks/**", "config/check_accounting_baseline.yaml") and
      full_segment="full_after_lint". The baseline path is in the glob deliberately: a PR editing
      ONLY the baseline would otherwise be skipped in the authoritative pre-merge tier
      (validate.py:92-103 skips a glob-gated check on a successful non-empty derivation with zero
      matches) and caught only post-merge.
  - file: config/check_accounting_baseline.yaml
    action: Create
    purpose: >-
      Shrink-only grandfather roster of the 96 checks not adopted in this plan's tranche (101
      registered minus 5 adopted). Copies Decision 159's one-time-roster template: no marker escape
      grammar at all (deliberate, per Decision 165 -- recorded as a choice, not an omission), a
      tamper guard, a missing-base SKIP so this seeding PR does not fail its own gate, and an
      explicit reversal clause. Carries a touch-it-fix-it clause (Decision 162 r3 shape): editing a
      baselined check's module obliges adopting the declaration in the same PR, so grandfathered
      stock cannot sit permanently exempt while still being actively maintained.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One function_to_category row for validate_check_accounting (Decision 169 surface 4). All five
      adopted checks already carry rows -- verified, no other edit needed.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One row per VP step declared graduate (steps 1, 2, 4, 6, 7, 8, 9).
      validate_verification_registry materialises each NEWLY-ADDED row and requires it to FAIL on
      origin/main and PASS on HEAD. Steps 2, 4 and 7 target test files that already exist and are
      GREEN on origin/main, so a whole-file node_id would be rejected as not-admitted -- each of
      those three check_specs must name a node id that is new in this diff (the specific new test
      class or function), exactly as step 9 already does with ::TestBaseDerivation. Steps 1, 6 and
      8 are safe as-is (new file, new file, and a probe that raises on a missing path).
  - file: docs/contracts/check-accounting.yaml
    action: Create
    purpose: >-
      Class D mechanism contract owning the field semantics this plan creates -- the CheckOutcome
      status vocabulary, THE skipped-versus-vacuous DISCRIMINATION RULE (constraint 5b) as the
      single derivation authority, the declared GRAIN of check_outcomes, the
      validation-result.json schema_version 3 shape, and the baseline grammar including the
      touch-it-fix-it clause. Required because Decision 150 routes field semantics to the owning
      contract, never into a numbered Decision entry. Self-hosting like check-manifest.yaml:
      subject check-accounting, evaluator {check: validate_check_accounting}. Envelope must carry
      id, class D, contract_version 1, status ratified, ratified_via
      "Decision NNN / PLAN-validate-vacuous-pass-accounting", description, subject, evaluator, and
      a top-level `amendment_log: []`. New Class D files may not declare status: active
      (grandfather-only, Decision 168).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: One routes[] entry with topic check-accounting (topic-equals-subject self-hosting rule).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The numbered Decision (see the Decision-draft block in context). Commitment scope is the
      CHANNEL plus the DECLARATION RATCHET -- both structurally enforced -- with fail-closed
      vacuity enforcement named as explicitly deferred future work carrying its own trigger, never
      as a stated-but-ungated universal rule (Decision 163). Must also state the ratchet's
      module-versus-path limitation plainly (see context). Requires the fenced yaml metadata
      envelope immediately after the heading plus a significance routing claim (Decisions 167/150).
  - file: tests/checks/registry/test_accounting.py
    action: Create
    purpose: Status-derivation and accumulator-lifecycle tests for the spine.
  - file: tests/checks/test_validation_result.py
    action: Modify
    purpose: schema v3 emission, rollup correctness, and v2-field byte-compatibility tests.
  - file: tests/ci_rca/taxonomy/test_priority_zero_and_refusal.py
    action: Modify
    purpose: >-
      Assert _load_attributions() and Priority-0 classification still resolve from a
      schema_version 3 record. This is the module that actually owns attribution testing;
      test_load_and_classify.py's declared concern is load_taxonomy/classify_failure and it
      contains no attribution test, so putting one there would violate the concern split both
      files cite (Decision 128).
  - file: tests/fixtures/ci_rca/taxonomy_data.py
    action: Modify
    purpose: >-
      Extend write_validation_result() to emit a schema_version 3 record so the consumer test
      above has a v3 fixture. Shared-fixture home, not a test module, so it is exempt from the
      cross-test-import guard by construction.
  - file: tests/validate/test_scaffold_gates.py
    action: Modify
    purpose: >-
      ensure_fresh_dq_results records a declared skip when the credential classifier matches, and
      for any other exception records no skip and appends to `failed`. REQUIRES REWORKING the two
      existing tests at :158 and :175, which raise bare Exception("Token has expired") /
      Exception("ProfileNotFound") and assert failed == [] -- both go red under constraint 5a and
      must be rewritten to raise realistic credential exceptions, with a new companion case pinning
      the non-matching path. Plus the pre-existing uncovered branches in this file's scaffold targets.
  - file: tests/checks/roadmap/test_check_graduation_guard.py
    action: Modify
    purpose: >-
      A TestBaseDerivation class carrying both halves of VP step 9's red-green (changed-file base
      AND old-content ref), the rec-3085 dq_unavailable case named by that rec's acceptance, and the
      8 pre-existing uncovered statements. TWO `_make_run` helpers must have their old-content
      branch re-keyed, not one -- line 104 (TestGraduationGuard) AND line 278
      (TestGraduationGuardUnavailableCarveout, stale keying at :287). Both match on
      `"show" in joined and "HEAD:" in joined`, which stops matching once the read is repointed to
      `git show <base>:...` and silently falls through to stdout "". The second is the dangerous
      one: its two tests (:296, :314) still PASS with an emptied old_map, because
      old_map.get(key, False) is already False so the flip is still detected -- so the UNAVAILABLE
      carve-out silently stops being tested against a populated old_map, and neither VP step 4 nor
      step 5's coverage gate notices (line 95 stays covered via the first helper).
  - file: tests/checks/misc/test_validate_test_coverage.py
    action: Modify
    purpose: Declared-examined/skip tests plus the 16 pre-existing uncovered statements.
  - file: tests/checks/misc/test_validate_scheduled_agent_logs.py
    action: Modify
    purpose: >-
      Declared-examined/skip tests on all four exit paths (including the all-logs engagement path
      that the disabled producers never reach in practice) plus the 5 uncovered statements.
  - file: tests/checks/iam_tf/test_validate_environment_taxonomy.py
    action: Modify
    purpose: Declared-examined tests.
  - file: tests/checks/lambda_pkg/test_validate_lambda_deploy_gating.py
    action: Modify
    purpose: Declared-examined/skip tests plus the 2 uncovered statements.
  - file: tests/checks/hygiene/test_validate_check_accounting.py
    action: Create
    purpose: >-
      Ratchet tests -- undeclared-new-check fails, baseline growth fails, frozen-constant
      cross-check, touch-it-fix-it, absent-base SKIP, and the contract derive-and-assert.
  - file: tests/checks/hygiene/test__manifest.py
    action: Modify
    purpose: Mirror-test coverage of the new Entry, including both-tier dispatch membership.
bundled_recommendations:
  - rec-2915
  - rec-3089
  - rec-3085
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A registered check that examines zero inputs, one that examines N>0, one that declares a skip,
    one that appends to `failed`, and one that declares nothing are five DISTINGUISHABLE outcomes
    after a real dispatch_recording() pass -- not four collapsed into "not failed".
  - >-
    logs/debug/validation-result.json is schema_version 3 and carries per-check outcome rows plus
    ran/skipped/vacuous/undeclared rollups, while failed_checks and failed_check_attributions keep
    their exact schema_version 2 shape and remain readable by scripts.ci_rca.taxonomy's Priority-0
    attribution path.
  - >-
    With the credential classifier matching AND logs/debug/dq-latest.json absent AND at least one
    changed DQ YAML file in the diff (the precondition that makes the guard reach its dq-latest
    branch at all), both ensure_fresh_dq_results and _check_graduation_guard record declared skips;
    neither contributes a silent pass. An exception the classifier does NOT match records no skip.
  - >-
    _check_graduation_guard derives BOTH its changed-file set and its old-content read from the
    push-aware committed base, so a clean working tree containing a committed DQ YAML change is
    EXAMINED rather than vacuous -- a reading that was impossible before this change, when the
    working-tree base made every clean CI checkout an unconditional early return.
  - >-
    All five adopted checks (_check_graduation_guard plus the four full-tier-only diff consumers)
    declare an examined count or a skip on every reachable exit path, applying constraint 5b's
    discrimination rule uniformly, and all nine pre-existing Python scope files measure 100%
    per-file coverage. Evidence mapping: VP step 5's --cov-fail-under=100 gates four of the nine
    directly; the remaining five (_scaffolding, check_graduation_guard, registry, validation_result,
    hygiene/_manifest) are gated by the standing validate_test_coverage check inside VP step 10's
    full-tier run, which enforces the same 100% per-file standard on every changed unbaselined file.
  - >-
    validate_check_accounting is registered in BOTH pre_sequence() and full_sequence(), fails a new
    check module that declares no outcome and is absent from the baseline, fails any net growth of
    config/check_accounting_baseline.yaml, fails an edited-but-unadopted baselined check, and
    cannot be satisfied by a config-file edit alone.
  - >-
    docs/contracts/check-accounting.yaml passes validate_contract_drift: its declared evaluator
    resolves because validate_check_accounting names the contract basename as an executable-context
    string literal and derive-and-asserts its status vocabulary.
  - >-
    A live full-tier run emits schema_version 3 evidence in which at least one real check records
    "vacuous" and at least one records "enforced" -- the observable discriminates on real run data,
    not only on fixtures.
  - >-
    rec-2915, rec-3089 and rec-3085 are closed via the Resolves: trailer; the two follow-on findings
    (the surviving rec-2917 scope_kind proposal, and the validate_scheduled_agent_logs
    disabled-producer/base-blindness pair) are FILED as recommendations BEFORE rec-2917's close
    proposal is emitted; and that proposal carries verdict `superseded` naming its successor rec,
    never `contradicted` with nothing behind it.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the five outcome states are distinguishable through a REAL dispatch pass, not a direct
      unit call on the derivation helper.
    command: bin/venv-python -m pytest tests/checks/registry/test_accounting.py -q
    expected: >-
      Passes. Cases assert examined(0)+no-append => "vacuous", examined(3)+no-append => "enforced",
      skipped(reason) => "skipped", no declaration => "undeclared", and any append to the failed
      list => "failed" regardless of what was declared. Lifecycle, stated precisely because the sloppy form
      contradicts VP step 10: the per-dispatch DECLARATION SLOT resets on each outcome_scope entry,
      while the ROW ACCUMULATOR resets per RUN via validation_result.clear() -- mirroring the
      existing _ATTRIBUTIONS contract at validation_result.py:14-17. Resetting the row list per
      dispatch would leave exactly one row in the evidence file and fail step 10's len(o)>=97.
    fix_if: >-
      A state collapses into another (most likely vacuous into enforced when count==0 is treated as
      falsy rather than as a declared zero), or accumulator state leaks between dispatches.
    hermetic: true
    graduation: graduate
    graduation_check_id: check-accounting-status-derivation
  - step: 2
    phase: pre-deploy
    action: Prove the evidence record carries skip accounting and stays backward-compatible.
    command: bin/venv-python -m pytest tests/checks/test_validation_result.py -q
    expected: >-
      Passes. schema_version is 3; check_outcomes and the ran/skipped/vacuous/undeclared rollups are
      present and mutually consistent; failed_checks and failed_check_attributions are byte-identical
      to what schema_version 2 produced for the same inputs; the outcome list is a snapshot, so a
      later clear() cannot mutate an already-written record.
    fix_if: >-
      Rollups disagree with check_outcomes, a v2 consumer field changed shape or ordering, or the
      record holds a live reference to the accumulator.
    hermetic: true
    graduation: graduate
    graduation_check_id: validation-result-v3-skip-accounting
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the CI-RCA attribution consumer is unbroken by the version bump -- the one downstream
      reader of this file (Decision 142).
    command: bin/venv-python -m pytest tests/ci_rca/taxonomy/test_priority_zero_and_refusal.py -q
    expected: >-
      Passes, including a new case whose fixture emits a schema_version 3 record and asserts
      _load_attributions() still resolves the (check, label) pairs and Priority-0 classification
      still fires ahead of the log-derived ladder.
    fix_if: >-
      Attribution loading degrades to an empty list on a v3 record, which would silently demote
      CI-RCA to its weaker log-derived ladder without failing anything.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The durable regression guard for this contract belongs on the CONSUMER's version-agnostic
      read, which the tests/ci_rca/taxonomy/ package already owns as a suite; graduating a second
      registry row pinned to this plan's slug would split ownership of the same guard across two
      homes with no added discrimination.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove rec-3085's composite hole is closed on BOTH surfaces, and that the skip is narrow
      (Decision 155) rather than a blanket exception swallow.
    command: bin/venv-python -m pytest tests/validate/test_scaffold_gates.py tests/checks/roadmap/test_check_graduation_guard.py -q
    expected: >-
      Passes. With the credential classifier matching and dq-latest.json absent,
      ensure_fresh_dq_results records a declared skip naming the creds cause, and
      _check_graduation_guard (given a changed DQ YAML in the diff, so it reaches that branch)
      records a declared skip rather than a silent WARN-and-return. An exception the classifier does
      NOT match records no skip and does not suppress the failure.
    fix_if: >-
      Either surface still returns silently, or the skip declaration is attached to the blanket
      `except Exception:` still present at _scaffolding.py:205 rather than to a named classifier --
      which would launder real bugs into accounted skips.
    hermetic: true
    graduation: graduate
    graduation_check_id: dq-unavailable-records-skip
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the adopted tranche declares on every reachable exit path, and that the measured
      pre-existing coverage debt on these files is paid.
    command: bin/venv-python -m pytest tests/checks/misc/test_validate_test_coverage.py tests/checks/misc/test_validate_scheduled_agent_logs.py tests/checks/iam_tf/test_validate_environment_taxonomy.py tests/checks/lambda_pkg/test_validate_lambda_deploy_gating.py -q --cov=scripts.checks.misc.validate_test_coverage --cov=scripts.checks.misc.validate_scheduled_agent_logs --cov=scripts.checks.iam_tf.validate_environment_taxonomy --cov=scripts.checks.lambda_pkg.validate_lambda_deploy_gating --cov-report=term-missing --cov-fail-under=100
    expected: >-
      Passes at 100% on all four files. Baseline measured before this plan: validate_test_coverage
      72% (16 missed, lines 11-27 + 41-42), validate_scheduled_agent_logs 91% (5),
      validate_environment_taxonomy 100%, validate_lambda_deploy_gating 94% (2).
    fix_if: >-
      Coverage lands under 100% on any of the four. Do NOT add a config/coverage_baseline.yaml entry
      to escape it -- that needs a `# baseline-lowered: dec-NNN` marker and is a reviewable
      exception, not a convenience (constraint 3).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The declaration guarantee is graduated once and structurally by validate_check_accounting
      (step 6) across the whole 101-check population; the coverage half is already a standing
      repo-wide gate (validate_test_coverage itself), so graduating four per-file rows here would
      pin this plan's specific tranche membership as if it were the durable rule and go stale the
      moment the ratchet shrinks past them.
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the ratchet is a real gate in all five directions, including the config-edit-alone
      admission path (Decision 162) and touch-it-fix-it.
    command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_check_accounting.py -q
    expected: >-
      Passes. A synthetic check module declaring no outcome and absent from the baseline FAILS; the
      same module added to the baseline still FAILS because the frozen in-module constant does not
      list it; a module that declares examined()/skipped() PASSES; any net growth of the baseline
      FAILS; an edited baselined check that has not adopted FAILS (touch-it-fix-it); and an absent
      base ref SKIPs loudly rather than passing silently.
    fix_if: >-
      Any direction passes when it should fail -- especially config-edit-alone admission, which
      would make the baseline self-amending and reproduce the very class of gate this plan exists
      to make visible.
    hermetic: true
    graduation: graduate
    graduation_check_id: check-accounting-ratchet-shrink-only
  - step: 7
    phase: pre-deploy
    action: Prove the new check is actually dispatched in both tiers, not merely defined.
    command: |-
      bin/venv-python -m pytest tests/checks/hygiene/test__manifest.py -q && bin/venv-python -c "from scripts.checks import registry; pre={s.name for s in registry.pre_sequence() if s.kind=='check'}; full={s.name for s in registry.full_sequence() if s.kind=='check'}; assert 'validate_check_accounting' in pre, 'absent from pre_sequence'; assert 'validate_check_accounting' in full, 'absent from full_sequence'; print('both tiers OK')"
    expected: >-
      The mirror test passes (Entry present and well-formed, dispatched in both tiers), then the
      live registry probe exits 0 and prints "both tiers OK". The one-liner is a dependency-free
      second opinion on the same fact, deliberately not sharing the test's fixtures.
    fix_if: >-
      The Entry sets pre/full_segment wrongly, or resolve() cannot import the module. A check that
      is registered but dispatched in neither tier is the exact failure mode this plan exists to
      surface, so it must not ship as one.
    hermetic: true
    graduation: graduate
    graduation_check_id: check-accounting-registered-both-tiers
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the new Class D contract's declared evaluator RESOLVES, which Decision 168 requires and
      validate_contract_drift enforces -- a new Class D file whose evaluator does not resolve fails
      its own gate.
    command: |-
      bin/venv-python -c "from scripts.checks import registry; failed=[]; registry.resolve('validate_contract_drift')(failed); assert not failed, failed; import pathlib; src=pathlib.Path('scripts/checks/hygiene/validate_check_accounting.py').read_text(encoding='utf-8'); assert 'check-accounting.yaml' in src, 'contract basename absent as a literal'; print('contract evaluator resolves')"
    expected: >-
      validate_contract_drift appends nothing, the evaluator basename is present as a literal in the
      check module, and the probe prints "contract evaluator resolves".
    fix_if: >-
      validate_contract_drift fails on the new file -- most likely because the check never mentions
      its contract. The fix is to make the check genuinely READ the contract (derive-and-assert the
      status vocabulary from it, as validate_check_manifests.py does), not to insert a decorative
      string literal to satisfy the resolver.
    hermetic: true
    graduation: graduate
    graduation_check_id: check-accounting-contract-evaluator-resolves
  - step: 9
    phase: pre-deploy
    action: >-
      THE DISCRIMINATING PROOF, replacing the earlier live-dead-gate step that could not work. Show
      red-green on a real defect: the graduation guard's base fix converts a reading that was
      unconditionally vacuous into an examined one, hermetically and replayably in CI.
    command: bin/venv-python -m pytest "tests/checks/roadmap/test_check_graduation_guard.py::TestBaseDerivation" -q
    expected: >-
      Passes. TWO assertions, because the fix has two call sites and only one of them is otherwise
      observable. (a) CHANGED-FILE HALF: given a clean working tree and a DQ YAML change present in
      the committed diff against the push-aware base, the guard records examined>0 and evaluates the
      flip; the same fixture on the pre-fix working-tree base records examined==0 (vacuous). (b)
      OLD-CONTENT HALF: inspect the recorded _common.run call list and assert (i) no invocation
      matches the retired git diff HEAD ... -- config/agent/data_quality/ shape, and (ii) the git
      show argument's ref equals the base the diff used, not the literal "HEAD". Pinned as a node
      id rather than a -k selector, per tests/CLAUDE.md and because the graduation registry row
      needs a node_id. Note _common.get_changed_files() does NOT expose the base it used (it
      computes push_context_base() or "origin/main" internally, with its own fallback to "HEAD" on
      a non-zero returncode), so assertion (ii) is only satisfiable if the guard re-derives the
      base itself with that same default -- see the execution step.
    fix_if: >-
      Assertion (a) passes on pre-fix code -- the fixture left the DQ change in the working tree, so
      both bases agree and the discrimination is destroyed; commit it instead. Assertion (b) is the
      one that must not be dropped: the existing _make_run helper keys its old-content branch on
      `"show" in joined and "HEAD:" in joined`, so once the read is repointed that branch stops
      matching, stdout falls through to "", old_map becomes {} and EVERY enforced:true reads as a
      flip -- silent over-blocking that no existing test catches, because
      test_blocks_new_enforced_true_when_fail already exercises the empty-old_map case. Update BOTH
      _make_run helpers' keying as part of this step -- line 104 and line 278; the second is in
      TestGraduationGuardUnavailableCarveout and its tests keep passing while silently losing their
      populated-old_map coverage.
