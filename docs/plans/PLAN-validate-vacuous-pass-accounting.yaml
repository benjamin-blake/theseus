    graduation: graduate
    graduation_check_id: graduation-guard-committed-base-derivation
  - step: 10
    phase: pre-deploy
    action: >-
      Prove the spine produces real evidence on a real full-tier run and discriminates on live data
      rather than only on fixtures.
    command: |-
      bin/venv-python -m scripts.validate && bin/venv-python -c "import json,pathlib; d=json.loads(pathlib.Path('logs/debug/validation-result.json').read_text(encoding='utf-8')); assert d['schema_version']==3, d['schema_version']; rows=d['check_outcomes']; o={r['check']: r for r in rows}; assert len(o)>=97, len(o); adopted=['_check_graduation_guard','validate_test_coverage','validate_environment_taxonomy','validate_lambda_deploy_gating','validate_scheduled_agent_logs']; assert all(o[c]['status']!='undeclared' for c in adopted), [o[c] for c in adopted]; seen={r['status'] for r in rows}; assert 'vacuous' in seen and 'enforced' in seen, sorted(seen); print(sorted(seen), len(o))"
    expected: >-
