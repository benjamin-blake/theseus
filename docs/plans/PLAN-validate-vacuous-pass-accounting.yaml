  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    DIAGNOSIS CORRECTION (round-1 critique, F1b; verified independently). An earlier revision of
    this plan asserted that validate_scheduled_agent_logs is dead because its raw
    `git diff origin/main...HEAD` base ignores push_context_base(), and proposed using it as a live
    dead-gate target. That is the wrong mechanism. The check engages only when EVERY changed path is
    under logs/; any ordinary branch or squashed merge contains non-logs files and takes the
    "Not a scheduled-agent branch" skip instead. Its domain is empty because the scheduled-agent
    producers are DISABLED (SCHEDULED_AGENTS_ENABLED=false plus two DISABLED EventBridge rules in
