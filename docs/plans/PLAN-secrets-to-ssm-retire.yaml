constraints:
- >-
  Always-ask, each needing Benjamin's own typed word in the build thread: the merge (IAM and seven destroys), the
  tf-gated-apply approval (his, in GitHub), the exact admin apply command (VP step 9), and the console deletion of the
  two out-of-band secrets (his own action). The contract rewrite (execution step 5) was shown to him before the plan PR
  merged.
- "Every Secrets Manager deletion keeps the 30-day recovery window; never force-delete (Decision 157 residual (b))."
- "The bootstrap apply runs only after the personal gated apply is green: the apply role's DeleteSecret grants must still be live for the destroys."
- "Secrets Manager itself stays: the org-transfer operator credentials remain there (Decision 218), and so do PlatformAdmin's SecretsManagerAdmin and the metadata prefix Sids."
- "Public repo (Decision 101): no account id, ARN or value in any file or evidence."
- "Identity calls stay off the eu-west-2 STS host (Plan A)."
- No rescue agents or workaround loops (Decision 55).
context:
