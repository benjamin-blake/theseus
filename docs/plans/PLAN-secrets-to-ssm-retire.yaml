constraints:
- >-
  Always-ask, each needing Benjamin's own typed word in the build thread: the merge (IAM and seven destroys), the
  tf-gated-apply approval (his, in GitHub), the exact admin apply command (VP step 9), and the console deletion of the
  two out-of-band secrets (his own action). The contract texts (execution steps 5 and 6) were shown to him before the plan PR
  merged.
- "Every Secrets Manager deletion keeps the 30-day recovery window; never force-delete (Decision 157 residual (b))."
- "The bootstrap apply runs only after the personal gated apply is green: the apply role's DeleteSecret grants must still be live for the destroys."
- "Secrets Manager itself stays: the org-transfer operator credentials remain there (Decision 218), and so do PlatformAdmin's SecretsManagerAdmin and the metadata prefix Sids."
- "Public repo (Decision 101): no account id, ARN or value in any file or evidence."
- "Identity calls stay off the eu-west-2 STS host (Plan A)."
- No rescue agents or workaround loops (Decision 55).
context:
- "Decision-scout verdict (combined plan D design, 2026-10-25): FLAGS_FOUND; this plan's flags are Decision 157 residual (b) (recovery window), Decision 175 (domains rows and the contract rewrite), Decision 235 cl.1 (the two rewritten infra tests named in scope), Decision 77/92 (destroys route). Decisions triaged: 187 of 187."
- "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
- "Approval: Benjamin, 2026-10-25, cmsg_01Cqz6E4mzSv6kkGCSCub3WMAjLdkvPmWNohzfkYYcP1rE ('write the plan') on step6b-presentation.md F6-A plan 3 (retire after a soak), with the placement-review changes in cmsg_01Cqz6E4mzSv6kkGCSCub3WM6UrqhveXKbb7s9CosdE7Ar. Deleting the two out-of-band secrets is his console action, not an agent's (no new grant)."
- "Start conditions: secrets-to-ssm-cutover merged at least 7 days earlier with its VP steps 6-8 green; plan B's admin apply not in flight (B removes the ExternalIds from tfvars and, if it lands after secrets-to-ssm-cutover, edits the SSM parameter, not the secret)."
- "Why a removed block: the DSN secret version's destroy would call an extra Secrets Manager verb the apply role may not hold; forgetting the version and destroying the secret schedules the same deletion."
- "Related-work check (scripts.ci_rca.red_overlap, 2026-10-25): verdict clear, no reds."
- "V3 resolution: terraform/personal applies only at merge and terraform/bootstrap is admin-only and applies after it (Decision 126). The pre-merge evidence is the soak line (VP step 5), the speculative-plan comment (VP step 6) and the bootstrap gate's counts line (VP step 7) for the CI-green head, posted with $PR_HEAD_SHA; they substitute for the pre-merge post-deploy evidence the implement V3 Merge Gate and code-review V3 check require. The behavioural acceptance (Decision 48) is VP steps 8-10 after merge, evidenced by a counts-only comment on the merged PR naming the applied sha."
