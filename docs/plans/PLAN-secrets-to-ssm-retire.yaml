schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: secrets-to-ssm-retire
intent: >-
  Plan 4, the last of plan D (Secrets Manager to SSM Parameter Store). After a soak with no read of the old secrets,
  retire them: terraform/personal destroys the seven Secrets Manager envelopes it manages (30-day recovery window kept)
  and forgets the DSN secret version, and every Secrets Manager value grant, old env var and secret-ARN output for the
  nine goes; terraform/bootstrap drops the enumerated Secrets Manager grants and lookups for them; Benjamin deletes the
  two out-of-band secrets (neon-api-key, the tfvars) in the console; the secret-material-handling contract says
  Secrets Manager is left only for operator-held credentials. Spend falls by about USD 4 a month.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-retire.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4539's SSM half (closed here). No tier_item criterion claimed. Last of
  plan D's five plans.
scope:
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    Delete resource "aws_secretsmanager_secret" ducklake_neon_catalog_dsn and the four scoped-login envelopes, the
    ducklake_neon_catalog_dsn_secret_arn output and their comment blocks; replace resource
    "aws_secretsmanager_secret_version" "ducklake_neon_catalog_dsn" with a removed block (lifecycle destroy = false), so
    the version leaves state without an API call and the secret's own destroy schedules the deletion. The DSN
    SecureString parameter stays; comments that say "Secrets Manager" are reworded.
- file: terraform/personal/inference_credentials.tf
  action: Modify
  purpose: >-
    Delete both envelopes and both ARN outputs. The file keeps a header comment saying the keys live at their /secret/
    parameters, out of band (Decision N), or the file is deleted if nothing else remains (then action Delete).
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: Delete NeonDsnRead from the writer and reader roles; NeonDsnParameterRead stays.
- file: terraform/personal/ducklake_catalog_dr.tf
  action: Modify
  purpose: Delete NeonDsnRead.
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: Delete NeonDsnRead (five secret ARNs).
- file: terraform/personal/ducklake_maintenance_smoke.tf
  action: Modify
  purpose: Delete NeonDsnRead and the DUCKLAKE_DSN_SECRET_ID env var.
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: Delete TelemetryDsnRead and TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_writer_smoke.tf
  action: Modify
  purpose: Delete TelemetryDsnRead and TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_reader.tf
  action: Modify
  purpose: Delete TelemetryReaderDsnRead and TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/oidc.tf
  action: Modify
  purpose: >-
    In ci_full_refresh_read delete every value-capable Secrets Manager statement left (N1's two drift-conditioned Neon
    reads and SecretsManagerTfvarsRead). SecretsManagerMetadataRead (metadata prefix, Decision 157) stays.
- file: terraform/bootstrap/github_ci_apply_reads.tf
  action: Modify
  purpose: Delete SecretsManagerValueReadEnumerated (its four ARNs are all retired). SecretsManagerMetadataRead and SecretParameterValueRead stay.
- file: terraform/bootstrap/github_ci_apply_policy.tf
  action: Modify
  purpose: >-
    Delete SecretsManagerDuckLakeNeonDSN and SecretsManagerUpdateEnumerated. SecretsManagerMetadataWrite (prefix,
    metadata-only, ForceDeleteWithoutRecovery false) stays, so the rule for any future Terraform-managed secret is unchanged.
- file: terraform/bootstrap/platform_dev_policies.tf
  action: Modify
  purpose: Delete InferenceCredentialsRead and its two data "aws_secretsmanager_secret" lookups; InferenceCredentialsParameterRead stays.
- file: terraform/bootstrap/platform_admin_data_policies.tf
  action: Modify
  purpose: Delete NeonCatalogDsnRead and its data "aws_secretsmanager_secret" lookup (SecretParameterAdmin covers the parameter).
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    Rewrite for the retired store, pinned in execution step 5: the Secrets Manager pattern applies only to
    operator-held credentials outside Terraform; value_exceptions loses the secret version entry (the DSN parameter
    entry stays); domains rows name the parameters; amendment_log entry. The evaluator's Secrets Manager version rule
    stays, now with no declared exception (nothing weakens, Decision 235).
- file: docs/contracts/iam-simulate-fixture.yaml
  action: Modify
  purpose: >-
    Rows whose verbs the retired Sids granted on the nine secrets flip to implicitDeny or are removed (p0-6 enumerated
    UpdateSecret, the DSN Sid's verbs); the metadata-write prefix rows stay; amendment_log entry. Stays within its
    structural budget.
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    AWS-07, NEON-05, NEON-06, ANT-05 and INF-01 drop the Secrets Manager wording; one evidence_ledger entry and one
    amendment_log entry (Class D).
- file: tests/test_secrets_manager_retired.py
  action: Create
  purpose: >-
    No terraform/personal file declares an aws_secretsmanager_secret or _version resource or a Secrets Manager value
    grant, env var or output for the nine; the bootstrap Sids in scope are gone and their SSM counterparts remain; the
    removed block is present; red cases on synthetic HCL.
- file: tests/checks/iam_tf/test_validate_secret_material_handling.py
  action: Modify
  purpose: Real-tree expectations follow the empty Secrets Manager exception list; the synthetic red case for an undeclared version stays.
- file: tests/checks/iam_tf/test_telemetry_production_catalog_infra.py
  action: Modify
  purpose: Its secret-envelope assertions become parameter-name assertions (planned change, Decision 235 cl.1 named here).
- file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
  action: Modify
  purpose: Its inference and DSN secret lookups become the parameter Sids (planned change, named here).
- file: config/agent/verification_registry/entries/secrets-manager-retired.yaml
  action: Create
  purpose: Graduation record for VP step 1 (check_spec.node_id tests/test_secrets_manager_retired.py).
bundled_recommendations:
- rec-4539
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/personal at merge: seven aws_secretsmanager_secret destroys (30-day recovery window, the provider default;
  Decision 157 residual (b)), one version forgotten by the removed block, in-place updates of the eight Lambda role
  policies, the planner policy and four Lambda environments. The destroys ROUTE the plan to tf-gated-apply; Benjamin
  approves it there. The apply role's DeleteSecret grants (SecretsManagerDuckLakeNeonDSN, SecretsManagerMetadataWrite)
  are still live at this point.
- >-
  terraform/bootstrap (admin-only): only after that gated apply is green, Benjamin's word on the exact command, then an
  ADMIN apply from main updating four policies in place. Serialized with plan B's admin apply.
- Benjamin deletes neon-api-key and agent-platform-terraform-personal-tfvars in the AWS console with the 30-day recovery window (no grant is added for it).
- No code path changes, so no Lambda deploy channel fires.
acceptance_criteria:
- "Before merge, the soak holds -- at least 7 days since secrets-to-ssm-cutover merged, and every one of the nine secrets' LastAccessedDate is on or before the cutover date (VP step 5)."
- terraform/personal and terraform/bootstrap hold no Secrets Manager resource, value grant, env var or output for the nine, and the SSM counterparts remain (TestSecretsManagerRetired).
- After the gated apply and the admin apply, all nine secrets are scheduled for deletion, the live roles deny GetSecretValue on them, and the Lambdas, apply and drift runs stay green (VP steps 8-10).
- rec-4539 closes through the Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The Secrets Manager surface for the nine is gone and the SSM surface remains
  command: bin/venv-python -m pytest tests/test_secrets_manager_retired.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a predicate misreads real HCL -- fix it without loosening; a leftover -- remove it
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-manager-retired
- step: 2
  phase: pre-deploy
  action: The IAM and coverage suites pass with the narrower tree
  command: bin/venv-python -m pytest tests/checks/iam_tf -q
  expected: all pass; the read and write coverage maps keep their Secrets Manager types (nothing declares them now)
  fix_if: a failure -- fix the HCL or the named test; never delete a check
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Provider-free formatting check on both touched roots
  command: terraform fmt -check terraform/personal && terraform fmt -check terraform/bootstrap
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt.
- step: 4
  phase: pre-deploy
  action: ENVIRONMENT CHECK -- the soak read, the gate and the admin apply need the ADMIN chain
  command: >-
    : 'Plan A replaced the aws sts get-caller-identity form with caller-arn';
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- the PR waits at CI-green; steps 5, 7, 9 and 10 go to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: The soak holds -- no read of any old secret since the cutover (metadata only)
  command: |-
    test -n "$CUTOVER_DATE" && CUTOVER_DATE="$CUTOVER_DATE" bin/venv-python -c "import boto3, datetime, os; c=datetime.date.fromisoformat(os.environ['CUTOVER_DATE']); assert (datetime.date.today()-c).days >= 7, 'soak shorter than 7 days'; sm=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('secretsmanager'); names=['neon-api-key','agent-platform-terraform-personal-tfvars','ducklake-neon-catalog-dsn','agent-platform-deepseek-api-key','agent-platform-anthropic-api-key','agent-platform-ducklake-telemetry-writer-dsn','agent-platform-ducklake-telemetry-writer-prod-dsn','agent-platform-ducklake-telemetry-reader-dsn','agent-platform-ducklake-smoke-maintainer-dsn']; late=[n for n in names if (d:=sm.describe_secret(SecretId=n).get('LastAccessedDate')) and d.date() > c]; print('SOAK late', late); assert not late, late; print('SOAK_OK 9')"
  expected: SOAK_OK 9, posted on the PR with $PR_HEAD_SHA; CUTOVER_DATE is secrets-to-ssm-cutover's merge date
  fix_if: a late read -- something still reads Secrets Manager; find it with CloudTrail (read-only) and fix it in its own PR before this one merges
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: The speculative plan on the PR shows exactly the planned changes
  command: >-
    echo 'VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="otl-labs", repo="ontheloop",
    pullNumber=<this PR>) -- read the "Terraform Speculative Plan" comment for the PR head sha'
  expected: >-
    0 to add, 13 to change in place, 7 to destroy (the seven envelopes), the version forgotten (not destroyed);
    predicted verdict ROUTE to tf-gated-apply
  fix_if: any other change -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    PRE-MERGE GATE (ADMIN) -- read-only plan of terraform/bootstrap at the CI-green PR head: exactly four in-place
    policy updates
  command: |-
    test -n "$PR_HEAD_SHA" && M="${TMPDIR:-/tmp}/ssm-retire-gate" && (umask 077 && mkdir -p "$M") && aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --profile agent_platform_admin --query Parameter.Value --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > "$M/bootstrap.tfvars" && W="$M/wt" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" > /dev/null && rc=0 && { terraform -chdir="$W/terraform/bootstrap" init -input=false > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -var-file="$M/bootstrap.tfvars" -out="$M/head.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap" show -json "$M/head.tfplan" > "$M/head.json"; } || rc=1; git worktree remove --force "$W"; rm -f "$M/head.tfplan" "$M/bootstrap.tfvars"; test $rc -eq 0 && M="$M" bin/venv-python - <<'EOF'
    import json, os, sys
    m = os.environ["M"]
    rc = json.load(open(f"{m}/head.json")).get("resource_changes", [])
    os.remove(f"{m}/head.json")
    moving = sorted((r["type"], tuple(r["change"]["actions"])) for r in rc if r["change"]["actions"] not in (["no-op"], ["read"]))
    out = {"add": sum("create" in a for _, a in moving), "change": sum(a == ("update",) for _, a in moving), "destroy": sum("delete" in a for _, a in moving), "types": sorted({t for t, _ in moving})}
    print(json.dumps(out))
    sys.exit(0 if out == {"add": 0, "change": 4, "destroy": 0, "types": ["aws_iam_policy", "aws_iam_role_policy"]} else "PRE-MERGE PLAN STOP")
    EOF
  expected: "one counts-only JSON line {\"add\": 0, \"change\": 4, \"destroy\": 0, ...}; posted with $PR_HEAD_SHA; a new head re-runs it"
  fix_if: any other count or a plan error -- stop and RCA; never apply before merge
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: The gated personal apply is green and the seven envelopes are scheduled for deletion
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; sm=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('secretsmanager'); names=['ducklake-neon-catalog-dsn','agent-platform-deepseek-api-key','agent-platform-anthropic-api-key','agent-platform-ducklake-telemetry-writer-dsn','agent-platform-ducklake-telemetry-writer-prod-dsn','agent-platform-ducklake-telemetry-reader-dsn','agent-platform-ducklake-smoke-maintainer-dsn']; got=sum(sm.describe_secret(SecretId=n).get('DeletedDate') is not None for n in names); print('SCHEDULED', got); assert got==7; print('ENVELOPES_RETIRED_OK')"
  expected: the tf-gated-apply run for the merge commit is green (MCP actions_list / actions_get), then SCHEDULED 7 and ENVELOPES_RETIRED_OK
  fix_if: the apply is red -- follow deploy-paths.yaml's reconcile row, never a local apply
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: HUMAN-DIRECTED ADMIN APPLY of terraform/bootstrap from main, only after step 8, on Benjamin's word on the exact command
  command: >-
    echo 'ADMIN: present terraform -chdir=terraform/bootstrap plan -input=false -var-file=<scratch bootstrap.tfvars>
    -out=<scratch>/apply.tfplan with its counts line, then terraform -chdir=terraform/bootstrap apply
    <scratch>/apply.tfplan; run it only after Benjamin replies naming this PR; delete the scratch files in the same step'
  expected: his message id recorded; apply exits 0 with 0 added, 4 changed, 0 destroyed
  fix_if: the counts differ from the gate's -- stop and show him
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: HUMAN -- Benjamin deletes the two out-of-band secrets in the console; then the live state is checked
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); sm=s.client('secretsmanager'); iam=s.client('iam'); a=s.client('sts', region_name='eu-west-1', endpoint_url='https://sts.eu-west-1.amazonaws.com').get_caller_identity()['Account']; oob=sum(sm.describe_secret(SecretId=n).get('DeletedDate') is not None for n in ('neon-api-key','agent-platform-terraform-personal-tfvars')); b='arn:aws:secretsmanager:eu-west-2:'+a+':secret:'; d=lambda role,n: iam.simulate_principal_policy(PolicySourceArn='arn:aws:iam::'+a+':role/'+role, ActionNames=['secretsmanager:GetSecretValue'], ResourceArns=[b+n+'-AbCdEf'])['EvaluationResults'][0]['EvalDecision']; got=(oob, d('agent-platform-github-ci-apply','neon-api-key'), d('agent-platform-github-ci-planner','agent-platform-terraform-personal-tfvars'), d('PlatformDev','agent-platform-deepseek-api-key'), d('agent-platform-ducklake-writer','ducklake-neon-catalog-dsn')); print('LIVE', got); assert got==(2,'implicitDeny','implicitDeny','implicitDeny','implicitDeny'), got; print('SECRETS_MANAGER_RETIRED_LIVE_OK')"  # pragma: allowlist secret
  expected: >-
    His message saying both are deleted (recovery window 30 days), then LIVE (2, 'implicitDeny', 'implicitDeny',
    'implicitDeny', 'implicitDeny') and SECRETS_MANAGER_RETIRED_LIVE_OK; then the next deploy-ducklake-lambdas,
    terraform-apply-sandbox and terraform-drift runs on main are green (MCP). eu-west-1 STS endpoint (Plan A). Post
    only the tuple.
  fix_if: any other tuple -- stop and RCA
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: rec-4539 closed through the Resolves trailer
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4539']); print(sorted((r['id'], r['status']) for r
    in rows))"
  expected: "[('rec-4539', 'closed')] -- closed by retire-github-pat-secret already, or by this merge's closure job if it was reopened for the SSM half"
  fix_if: open -- read the closure job log
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run (recursion refusal for graduation); step 1 carries the durable regression.
- step: 13
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
