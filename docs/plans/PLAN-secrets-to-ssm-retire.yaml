- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- Confirm the start conditions and Decision N's number; record CUTOVER_DATE.
- >-
  terraform/personal edits as in scope. The removed block: removed { from =
  aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn  lifecycle { destroy = false } }. Delete each old Sid and
  env var whole; reword surviving comments that name Secrets Manager for these values.
- terraform/bootstrap edits as in scope; keep every other Sid byte-identical.
- Write tests/test_secrets_manager_retired.py, update the two named infra tests and the secret-material test, create the registry entry.
- |-
  docs/contracts/secret-material-handling.yaml --
    patterns.secret_value_out_of_band: "Terraform manages no Secrets Manager value. A credential still held in Secrets
    Manager is operator-held and outside Terraform (the org-transfer credentials, Decision 218); if one is ever
    Terraform-managed again, Terraform holds only the envelope and the value is set out of band. Secret tag values use
    the ASCII tag charset only -- no parentheses."
    patterns.domains: the inference line becomes "inference API keys -- /secret/ parameters, out of band (Decision
    N)"; the DSN line becomes "DuckLake Neon catalog DSN -- terraform/personal/neon_ducklake_catalog.tf (SecureString
    value exception)"; add "scoped catalog logins -- /secret/ parameters, out of band (Decision 213, 230, N)". The
    Neon provider API key, SSM secret parameters, terraform-personal tfvars and CI/OIDC grants lines stay as N1,
    secrets-to-ssm-grants and secrets-to-ssm-cutover left them.
    patterns.provider_credential_ephemeral_input (N1's T5): "never in the tfvars secret" becomes "never in the tfvars
    parameter".
    value_exceptions: delete the aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn entry; keep the
    aws_ssm_parameter entry, its reason reworded to drop "until that secret is retired".
    amendment_log (prepend): {date, semantic_break: false, change_class: accepted_values_narrow, summary:
    "PLAN-secrets-to-ssm-retire (Decision N): the nine credentials' Secrets Manager copies are retired; the version
    exception is removed, the domains name the /secret/ parameters, and the evaluator's version rule stays with no
    declared exception."}
- |-
  docs/contracts/terraform-cc-web-operations.yaml (N1's texts) --
    speculative_plan_job, T4's "holds no Secrets Manager value read on the Neon key or DSN" becomes "holds no value
    read on the Neon key or DSN parameters".
    capability_split, T4b becomes "the refresh-read metadata surface with no secret value read except the tfvars
    parameter (the Neon key and catalog DSN parameter reads belong to the reserved drift session only; PR plans run
    with a stub key and skip refresh)".
    planner_main_sub_iam, T4c becomes "the same refresh-time read surface as the PR-sub statement, plus
    ssm:GetParameter on the Neon key and catalog DSN parameters conditioned on aws:userid naming the reserved drift
    session (DriftSessionSecretParameterRead)".
    amendment_log: one entry, summary "PLAN-secrets-to-ssm-retire (Decision N): the planner's drift-only value read is
    the SSM parameter statement; the Secrets Manager copies are retired."
- >-
  The planner check and its tests as in scope; record a weakening_dispositions entry (planned-change, citing
  acceptance_criteria[1]) for each re-pointed N1 case and for every other candidate validate_weakening_candidates lists
  before VP step 12.
- Inventory and fixture edits as in scope, each with its amendment_log entry.
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml): VP steps 1-3, implementation_declared true,
  rebase on origin/main, VP steps 12-13 on the committed clean tree, postflight retrospective, push, the PR with
  "Resolves: rec-4539" in its body, subscribe_pr_activity. At the CI-green head run VP steps 4-7 and post the results
  with $PR_HEAD_SHA. Code review in a fresh context with the V3 resolution line quoted. Ask Benjamin to reply "merge"
  naming the PR; squash-merge on code review PROCEED, green CI, the posted evidence and his word. Then, on events: his
  tf-gated-apply approval, VP step 8, VP step 9 on his word, his console deletion and VP step 10, VP step 11, and a
  counts-only comment on the merged PR.
- 'Report: what was implemented, the VP results, the LIVE tuple and the rec state'
rollback: >-
  Inside the 30-day recovery window: an admin restore-secret for each (Benjamin's word on the exact commands), then a
  revert PR carrying import blocks for the seven envelopes (a bare revert's CreateSecret fails on the reserved names)
  and the version, and a bootstrap revert applied by the admin. Consumers read SSM throughout, so nothing breaks while
  this happens.
