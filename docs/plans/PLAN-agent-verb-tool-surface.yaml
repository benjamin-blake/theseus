    Stated explicitly so the R1-R3 ratification guard does not later find a text/build mismatch: the
    realized surface is a CLIENT-SIDE PROJECTION over the existing reader Lambda, and deliberately
    differs from CD.10's literal per-Lambda text.
  - >-
    SCOUT FLAG 2 RESOLVED (Decision 88 [NOTE]) -- the feared blocker does not exist. Decision 88
    invariant (ii) EXPLICITLY sanctions named-verb reads ("a genuinely-needed warehouse read uses a
    registered named verb (Decision 84 I-3)"). The "never call _make_reader()" rule is NOT in
    Decision 88 or AGENTS.md; it lives at .claude/skills/planning/SKILL.md:223, scoped to the
    relevance gate only. No rule needs narrowing for this plan, and that gate rule is left
    unnarrowed here.
  - >-
    SCOUT SPIRIT FLAG MITIGATED (Decision 126 [NOTE], ambience beats sanction) -- agents reach for
    whatever surface is most VISIBLE, not whichever is sanctioned. Mitigation is structural, not
    prose: VP step 7 asserts the cache-first guidance is carried inside every projected tool's
    DESCRIPTION via the shared projection template, so verbs added later inherit it automatically.
  - >-
    TIER CORRECTION, verified against the manifest graph -- the decision-scout reported that
    src/common/iceberg_reader.py "appears in ZERO Lambda manifests" and concluded V2. That is FALSE:
    compute_affected_artifacts over this scope returns {data-pipeline, ops-compaction}, both
    status:active, so this is V3 (VP step 10). Caught by running the graph rather than trusting the
    report. Round-1 critique separately corrected this plan's own "SEVEN active manifests" claim for
    ducklake_scd2_schema.py to FIVE.
  - >-
    DEPLOY-TRIGGER GAP, disclosed -- .github/workflows/deploy-prod-lambdas.yml (the governed channel)
    triggers on push paths covering src/data/handlers/** and named scripts/* files, but NOT
    src/common/**. So a shared-module change that the manifest graph says affects two ACTIVE prod
    artifacts will not auto-deploy on merge. VP step 10 therefore uses workflow_dispatch explicitly.
    The general gap -- governed-channel trigger paths diverging from the manifest graph, which can
    silently skip a prod deploy -- is out of scope here. File it as a recommendation during
    implementation via scripts.ops_data_portal (source=implement-agent, target
    .github/workflows/deploy-prod-lambdas.yml) rather than leaving it as an unowned note.
  - >-
    OPERATOR DESIGN INTENT (the anchor for this work) -- fetching one recommendation should be one
    query returning one row. Pulling entire tables into a local cache and then re-querying that
    cache in Python is backwards for KB-scale data. VP step 11 is the direct end-to-end proof, and
    it must traverse the MCP tool surface: round-1 critique caught that the original step called
    DuckLakeReader.named() directly and PASSED ON UNMODIFIED MAIN, proving nothing. The
    complementary question -- whether Decision 88 invariant (ii)'s cache-first rule should still
    gate verb use at all -- is SPLIT OUT to rec-2867 to keep this scope tight, per operator
    direction. That rec carries Decision 88's clause-2 measurement obligation (never discharged; no
    egress figures recorded anywhere) and the observation that the D2 cold-ATTACH driver, which
    dominated the 2026-06-15 breach, has since been fixed by the warm-connection cache in
    src/common/ducklake_runtime.py.
  - >-
    KNOWN LIMITATION, disclosed -- MCP fetches the tool list once at server startup, so a verb newly
    added to NAMED_READS surfaces only on the next session (server restart). The derivation property
    (VP step 2) still holds; freshness is per-session, not live. This is inherent to the stdio
    transport and is NOT a derivation defect -- recorded here so a future session does not
    misdiagnose it as one.
  - >-
    Recon findings that shaped the scope: 12 NAMED_READS verbs exist with typed param schemas;
    describe_named_reads() is served by BOTH handlers and labelled agent-facing (CD.10/CD.15) yet
    NOTHING under scripts/ consumes it; DuckLakeReader has named() and query() but NO describe(), so
