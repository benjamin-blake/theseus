    the whole gap; .mcp.json registers only github-full; no mcp package is pinned. A live call to
    the DEPLOYED reader confirms describe answers with 12 verbs today.
  - >-
    Operator decisions recorded at the planning gates: (1) use the official `mcp` SDK rather than
