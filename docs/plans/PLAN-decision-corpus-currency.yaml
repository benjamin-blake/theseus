    verification_step: 4
    command: "bin/venv-python -m pytest 'tests/checks/decisions/test_validate_decision_currency.py::TestContractVocabularyIsCausal' -q"
    red_green_expectation: >-
      Red before (no currency key in the contract, so the check cannot load a vocabulary), green after. The
      fixture feeds a truncated vocabulary and requires a violation, so a generator-sourced token list turns
      it red again.
  - source: config/prose_budgets.yaml
    behavior: The S4 decision-scout entry is ratcheted down to the measured post-edit size, a decrease that needs no marker.
    verification_step: 7
    command: "bin/venv-python -c \"import pathlib; n=len(pathlib.Path('.claude/skills/decision-scout/SKILL.md').read_bytes()); assert n<=11325, (n, 11325); print(f'skill {n} B within the pre-existing 11,325 B budget')\""
    waiver_reason: >-
      A budget registry has no behaviour of its own to red/green: it is a declarative pin whose enforcement
      lives in validate_prose_limits and validate_prose_budget_raises, both already running on every --pre
      invocation. The linked command deliberately asserts against the ORIGIN/MAIN value so the same commit
      cannot satisfy it by lowering the bar.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      BOTH appended rows -- decisions-index-currency-derivation (guard_target scripts/decisions_md.py,
      guard_symbol derive_currency) and compaction-stub-predicate-single-source (guard_target
      scripts/checks/decisions/validate_decision_entry_conformance.py, guard_symbol _is_compacted_stub) --
      carry the full required field set (check_id, primitive_slot command_exit_zero, guard_target,
      guard_symbol, plan_slug decision-corpus-currency, graduated_at, graduated_by, check_spec) and pass the
      differential admission gate.
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    waiver_reason: >-
      The registry is an append-only record of graduated checks, not behaviour: its correctness is
      adjudicated by validate_verification_registry's own differential admission gate, which runs in --pre
      and already fails a row that does not fail at origin/main.
  - source: config/ci_rca_taxonomy.yaml
    behavior: >-
      validate_decision_currency resolves in function_to_category as schema_drift, satisfying
      validate_ci_rca_taxonomy's registry-totality assertion (the Priority-0 attribution precondition).
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    waiver_reason: >-
      A category map has no behaviour of its own to red/green: it is a declarative row whose only consumer is
      validate_ci_rca_taxonomy's totality assertion, which is registered UNGATED in --pre and fails on any
      registered check absent from the map. Adding the row IS the fix and the assertion IS the test; a
      bespoke unit test would restate the guard without adding an independent signal.
  - source: docs/decisions-index.json
    behavior: The committed artifact matches what the generator produces, so the currency projection is present in the file decision-scout reads.
    verification_step: 8
    command: "bin/venv-python -m scripts.decisions_index --check"
    waiver_reason: >-
      A generated artifact is never hand-authored and has no behaviour independent of its generator, whose
      derivation is covered by tests/decisions_md/test_currency.py. Drift is already enforced by
      validate_decisions_index_freshness, registered UNGATED in the --pre tier.
constraints:
  - >-
    Projection-only on the corpus. No decision entry is edited, no retroactive rewriting, no new authoring
    obligation on grandfathered entries, and nothing that touches the roughly 19,830 inbound "Decision N" citations (the count drifts as entries land).
  - >-
    ONLY the currency value 'superseded_compacted' may remove an entry from a consumer's active set. A
    supersession pointer, an inbound supersedes edge, and an amends edge annotate and NEVER filter, and never
    reduce severity. The guard that mints supersession pointers (validate_supersession_annotations, whose
    _EDGE_RE matches "Supersedes|supersedes|amends|Amends|partially supersedes" identically) structurally
    cannot distinguish full from partial supersession, which is why the pointer is unfit as a filter signal.
  - >-
    The compaction-stub predicate is promoted BEHAVIOUR-VERBATIM -- the existing two-marker logic, with
    identical results on every input. This explicitly PERMITS the extract-method refactor execution step 1
    mandates (splitting the status half into status_is_superseded and having is_compacted_stub call it);
    what it forbids is any change to what the predicate DECIDES. Do NOT strengthen it to Decision 149's full
    four-marker stub grammar during this plan: measured, the two-marker
    and four-marker predicates classify the IDENTICAL set on the real corpus ({44, 58}), while strengthening
    breaks a parametrized case in a test file at exactly 500 SLOC that cannot absorb an edit, and diverges
    from decision-entry.yaml's own compacted_stub_exemption text, which is written in two-marker terms.
  - >-
    NEVER derive the stub predicate by literal substring match against the contract's
    compaction.stub_grammar.body_markers. Measured: that approach matches NEITHER real stub (the fourth
    marker is the template '**Superseded by: Decision N**' with a literal N) and DOES match Decision 149
    itself, whose body quotes the stub grammar verbatim -- filtering the compaction-lifecycle Decision out of
    the blocking gate. The pointer must resolve through the parser's existing extract_superseded_by regex.
  - >-
    The governance prohibition above is enforced by scripts/checks/decisions/validate_decision_currency.py,
    registered in --pre. No numbered Decision is minted (operator ruling: the proof of a decision belongs in
    the code). This routing is compelled, not merely permitted: Decision 150's field_semantics row routes
    exactly this content to the owning contract and says "Never a numbered Decision", and Decision 167 clause
    2 rejects that claim outright on any entry minting a number. ACCEPTED COST, stated plainly: reversal
    conditions are MONITORED only as a fenced ```yaml reversal-conditions stanza inside a DECISIONS.md entry
    (scripts/preflight/decision_conditions.py). The block this plan writes into the contract's currency
    section is documentation with no monitor, no review_by, and no preflight surfacing -- it does not
    reproduce what a Decision would have provided, and no claim is made that it does.
  - >-
    The prose budget is hard: the .claude/skills/decision-scout/SKILL.md edit must land at or below 11,325
    bytes measured against the ORIGIN/MAIN budget value. A raise-approved marker is unavailable under
    Decision 165 without a Decision naming this path, and Decision 160 point 7 deliberately removed the
    previous marker. If it cannot fit, the abort path is NOT "ship the projection half alone" as-is: I5 and VP step 6 both
    assert the skill's consumer clauses, so dropping the skill edit while keeping five invariants reds the
    new check. Aborting means dropping I5 (four invariants), deleting VP step 6, and re-planning the
    consumer half as its own slice. NOTE step 7's fix_if states only the "re-plan the consumer half" half of
    this; the I5-and-VP-6 removal is stated HERE and nowhere else, so do not treat fix_if as the complete
    abort procedure.
  - >-
    No amends_scope envelope field (operator ruling: the corpus supersedes and rewrites rather than amending
    scope in place). Decision 167's envelope is unchanged. Do NOT mint clause identifiers.
  - >-
    Reversed and Deferred are deliberately NOT in the vocabulary: the live census is zero such entries, so a
    token would be dead vocabulary. Invariant I4 fails the build if one appears, and ships with an
    empty-at-install grandfather hook declared as a MODULE-LEVEL CONSTANT IN THE CHECK, never as a contract
    key -- Decision 165 clause 4's RETRO_SCAN_GRANDFATHER precedent is explicit that "growing the hook later
    is a reviewed code edit, never a config edit", and putting it in YAML would invert the half of the
    precedent that makes it a control. Decision 149 clause 3 is NOT cited here: its orphan_baseline seeds
    dec-010 rather than shipping empty, so it is not an empty-at-install precedent.
  - >-
    Must survive T1.5's portal cutover unchanged. Do not couple the scout's step 7 to the JSON file's path
    or shape beyond the currency field name.
  - Only files in the Scope table may be modified. If an entry's markers are wrong, that is a recommendation, not an inline fix.
  - docs/decisions-index.json is generated. Never hand-edit it.
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Single Portal Invariant: closure goes through the Resolves trailer or scripts.ops_data_portal. Never call
    scripts.sync.ops directly and never edit logs/.recommendations-log.jsonl.
