schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-flip
intent: >-
  Telemetry slice 2c's last plan (rec-4292): real session capture moves from the disposable smoke catalog to the
  production telemetry catalog, and the shared reader stops serving telemetry. The existing writer flips to
  ducklake_telemetry behind a light deploy gate together with the capture switch, so capture and every read client
  (routed by PLAN-telemetry-catalog-aware-capture) move at once; once production capture, golden replay, the monitor and
  the preflight gauge are proven, the shared reader drops its telemetry slot, env and blob grant, so production
  telemetry is read only through its own reader identity. Telemetry is the learning signal for recursive
  self-improvement (PROJECT_CONTEXT); this makes it real production data, verified on the production catalog.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-flip.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), follow-on mode; closes T2.36:c2 (every emit transits the telemetry writer,
  now on production). c1 is PLAN-telemetry-production-catalog's, c5 PLAN-telemetry-production-maintenance's; c3 (met
  on smoke only) is re-verified on production here. Built after PLAN-telemetry-catalog-aware-capture. V3: two ordered
  PRs. PR "flip" applies terraform/personal (the writer role's env, secret and S3 grants) and moves the capture switch;
  PR "cleanup" redeploys the shared reader and the telemetry reader through deploy-ducklake-lambdas.yml (Decision 126)
  and applies terraform/personal (the shared reader loses its telemetry env and blob grant).
closes_criteria:
- T2.36:c2
scope:
- file: config/telemetry/capture.yaml
  action: Modify
  purpose: >-
    PR flip: `catalog: ducklake_telemetry` (the key PLAN-telemetry-catalog-aware-capture added); `enabled: true` is
    untouched.
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: >-
    PR flip: ducklake_telemetry_meta_schema = "ducklake_telemetry" (the pin moves with Decision A, so the blob root local
    follows) and its comment names Decision A instead of "until a Decision moves it (slice 2c)". Every reference to
    local.ducklake_telemetry_meta_schema or local.ducklake_telemetry_blob_root that is NOT the production writer or the
    telemetry reader is re-pointed to smoke-valued locals (the shared reader's TELEMETRY_META_SCHEMA and
    TELEMETRY_BLOB_ROOT env and its TelemetryBlobRead resource; any smoke binding PLAN-telemetry-reader-and-smoke-twin left on
    the pin local), so the shared reader's applied values do not change in this PR. PR cleanup: the shared reader loses
    TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH and TELEMETRY_BLOB_ROOT and the TelemetryBlobRead statement;
    S3DataReadOnly and S3ListDataPrefix keep the production and smoke data prefixes (the T2.17 ops gates and rollback,
    Decision 78 cl.7).
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR flip: the writer's env TELEMETRY_META_SCHEMA = local.ducklake_telemetry_meta_schema (now ducklake_telemetry),
    TELEMETRY_DATA_PATH = local.ducklake_telemetry_data_path, TELEMETRY_BLOB_ROOT = local.ducklake_telemetry_blob_root,
    TELEMETRY_DSN_SECRET_ID = the production writer secret (agent-platform-ducklake-telemetry-writer-prod-dsn, the
    resource PLAN-telemetry-production-catalog declared); the role policy's TelemetryDsnRead names that secret only,
    TelemetryCatalogDataReadWrite and TelemetryCatalogDataList name the ducklake-telemetry/ prefix only,
    TelemetryBlobReadWrite and TelemetryBlobList name telemetry-blobs/ducklake_telemetry/ only; still no Delete action.
    reserved_concurrent_executions stays 5; its comment names the re-size trigger the production catalog plan recorded
    instead of "slice 2c re-sizes it". Function name, URL, SSM parameter and alarms are unchanged, so capture's cached
    writer URL stays valid.
