infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-catalog-aware-capture built and its post-deploy
  step passed (capture and read clients route by the switch catalog); PLAN-telemetry-production-catalog's admin session
  done (the production writer login and its secret value; the bootstrap fence and boundary entries applied; Decision A
  on main); PLAN-telemetry-reader-and-smoke-twin deployed (the smoke twin carries the heavy gate; the telemetry reader
  is served; Decision B on main); PLAN-telemetry-production-maintenance built (T2.36:c5 met).
- >-
  PR flip, pre-merge: the speculative plan on the PR shows only the writer's env and inline-policy updates (in-budget,
  auto-apply, T2.25 / Decision 92 point 5) and no change to the shared reader's applied values; anything routed to
  tf-gated-apply waits for Benjamin's approval there. Benjamin's word is required before merge (IAM on the writer role,
  the Class B writer contract). Post-merge: capture.yaml reaches sessions at their next fetch of main; until the apply
  lands, describe answers the smoke catalog and capture passes stop with describe_mismatch (no halt, nothing persisted),
  then resume against production and re-send each in-flight tree whole. No Lambda code deploys in this PR, so the
  light gate runs from the session (VP step 6) and in the next deploy run.
- >-
  PR cleanup, after the flip's post-deploy steps pass: the merge triggers deploy-ducklake-lambdas (shared reader and
  telemetry reader code) and a terraform/personal apply that removes the shared reader's telemetry env and blob grant
  (a narrowing, in budget). Either order is safe: the new handler reads no telemetry env, and no client routes an event
  verb to the shared reader once the switch reads ducklake_telemetry. Benjamin's word is required before merge (IAM,
  reader contract semantics).
- >-
  One DuckLake deploy or apply at a time (the coordinator sequences merges); no merge during the org-transfer freeze
  window.
acceptance_criteria:
- >-
  T2.36:c2: after the flip, real Claude Code session capture lands in ducklake_telemetry through
  agent-platform-ducklake-telemetry-writer (the implementing session's own tree reads back through the production
  writer's probe and the in-session check), and no staging writer exists on any telemetry path.
- >-
  Sessions in flight at the flip re-send their trees to production with no halt and no grain conflict.
- >-
  Golden replay passes on ducklake_telemetry with zero mismatches and no skew; the monitor completes on production; the
  preflight gauge reads pass on ducklake_telemetry (T2.36:c3 re-verified in production).
- >-
  The production writer's deploy gate keeps the Decision 213 direct-invoke denial and the Decision 216 can_create check
  and writes no append, blob or project-registration row; ontheloop is registered on production.
- >-
  After the cleanup the shared reader serves no event verb and holds no telemetry env or blob grant; production
  telemetry is read only through the telemetry reader.
- >-
  The stale-reference guard passes (no live contract text names rec-4292 outside query_ops lines, no retired smoke read
  surface remains), rec-4292 is closed by the cleanup PR's Resolves trailer, and T2.36:c2 reads met with met_by
  telemetry-production-flip.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prerequisites from the three earlier slice 2c plans are on main.
  command: >-
    git fetch origin main --quiet && git show origin/main:config/telemetry/capture.yaml | grep -q '^catalog: ducklake_smoke$'
    && test -f scripts/telemetry_capture/read_route.py && git show origin/main:docs/ROADMAP-PLATFORM.yaml >
    "${TMPDIR:-/tmp}/roadmap_flip.yaml" && bin/venv-python -c "import os,yaml;d=yaml.safe_load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'roadmap_flip.yaml')));
    it=[i for i in d['tier_items'] if i['id']=='T2.36'][0];s={c['id']:c['status'] for c in it['exit_criteria']};print(s);
    assert s['c1']=='met' and s['c5']=='met', s;print('PREREQS_OK')"
  expected: Main's switch carries catalog ducklake_smoke, the routing helper exists, T2.36 c1 and c5 read met, PREREQS_OK.
  fix_if: Stop; this plan builds only after PLAN-telemetry-catalog-aware-capture and both earlier plans are done.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: PR flip. The pin targets the production catalog and the shared reader's applied values stay on smoke.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_infra_pins.py::test_telemetry_pin_targets_the_production_catalog
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_shared_reader_telemetry_env_stays_on_smoke_until_cleanup -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: Fix the Terraform, never the guard; the shared reader must not follow the moved pin local.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-pin-targets-production
- step: 3
  phase: pre-deploy
  action: PR flip. The light production gate keeps the denial and can_create checks and writes no test rows.
  command: >-
    bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py::test_production_gate_expects_the_production_binding
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py::test_production_gate_keeps_the_denial_and_can_create_checks
