  command: >-
    test "$(aws ssm get-parameter --name /agent-platform/ducklake/telemetry_catalog --profile agent_platform --query
    Parameter.Value --output text)" = ducklake_telemetry && aws lambda get-function-configuration --function-name
    agent-platform-ducklake-telemetry-writer --profile agent_platform --query LastModified --output text | tee
    "${TMPDIR:-/tmp}/flip_converged.txt" && export DUCKLAKE_TELEMETRY_WRITER_URL=$(aws ssm get-parameter --name
    /agent-platform/ducklake/telemetry_writer_url --profile agent_platform --query Parameter.Value --output text) &&
    AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-telemetry-production
  expected: >-
    The deploy output reads ducklake_telemetry, the writer's LastModified is printed and saved, then
    LAMBDA_TELEMETRY_PRODUCTION OK with TELEMETRY_PROVISION_OK, TELEMETRY_PROBE_OK and TELEMETRY_SELF_ONLY_OK.
  fix_if: >-
    A smoke binding means the apply has not landed (read the terraform run); a drift refusal means a production column
    add is owed (an admin step, Decision 222 cl.3); stop and report either.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: Register ontheloop on production (explicit, so its row reads registered from the first write).
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture register --project-ref ontheloop --name "On
    The Loop platform" --remote https://github.com/benjamin-blake/theseus
  expected: >-
    The register_tenant line reads ok and the register_project line reads ok (created true, or false when a first
    append already auto-registered it).
  fix_if: A 403 means the caller is not URL-authorized on the writer; stop and report.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    T2.36:c2 evidence. After step 6, end one turn so this session's Stop hook runs a pass, then the implementing
    session's own tree reads back from production through the writer, and no telemetry path has a staging writer.
  command: >-
    TREE=$(ls -t "$HOME"/.claude/projects/*/*.jsonl | head -1) && bin/venv-python -c "import json,os,pathlib;t=pathlib.Path(os.environ['TREE']);
    s=json.loads((t.parent/t.stem/'telemetry-capture'/'state.json').read_text());assert s.get('catalog')=='ducklake_telemetry',
    s.get('catalog');print('STATE_CATALOG_OK')" && AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture
    probe --tree "$TREE" --require telemetry_sessions,telemetry_observations && AWS_PROFILE=agent_platform bin/venv-python
    -m scripts.telemetry_capture verify --tree "$TREE" --no-alarms && ! rg -n "ops-outbox|put_object|upload_file"
    scripts/telemetry_capture src/turn_capture src/telemetry_client .claude/hooks
  expected: >-
    STATE_CATALOG_OK; probe prints rows for both required tables (the writer binds ducklake_telemetry, so these are
    production rows); VERIFY status=completed; the rg finds nothing.
  fix_if: >-
    A smoke state catalog means no pass has sent since the flip (end another turn); no rows means capture is stopping
    (read the tree's diagnostics for describe_mismatch); a grain-conflict halt means a re-send diverged: stop and report,
    never clear the halt blindly.
