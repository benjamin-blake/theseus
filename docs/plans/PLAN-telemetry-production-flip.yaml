schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-flip
intent: >-
  Telemetry slice 2c's last plan (rec-4292): real session capture moves from the disposable smoke catalog to the
  production telemetry catalog, and the shared reader stops serving telemetry. One Terraform change moves the writer's
  catalog pin, so the writer's env, grants and login secret and the catalog deploy output change in one apply; capture
  and every read client follow them (PLAN-telemetry-catalog-aware-capture), with no blackout window. A light production
  deploy gate replaces the heavy vectors on the production writer. Once production capture, golden replay, the monitor
  and the preflight gauge are proven, the shared reader stops serving event verbs and then loses its telemetry env and
  blob grant, so production telemetry is read only through its own reader identity. Telemetry is the learning signal
  for recursive self-improvement (PROJECT_CONTEXT); this makes it real production data, verified on the production
  catalog.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-flip.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), follow-on mode; closes T2.36:c2 (every emit transits the telemetry writer,
  now on production). c1 is PLAN-telemetry-production-catalog's, c5 PLAN-telemetry-production-maintenance's; c3 (met on
  smoke only) is re-verified on production here. Built after PLAN-telemetry-catalog-aware-capture. V3: four ordered PRs.
  PR "flip" applies terraform/personal (the writer's env, inline policy and the catalog deploy output); PR "cleanup"
  redeploys the shared reader, the telemetry reader and the telemetry writer code through deploy-ducklake-lambdas.yml
  (Decision 126); PR "narrow" applies terraform/personal (the shared reader's env and inline policy); PR "bookkeeping"
  flips c2 and resolves rec-4292.
closes_criteria:
- T2.36:c2
scope:
