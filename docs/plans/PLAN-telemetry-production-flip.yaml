infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-catalog-aware-capture built (capture follows the
  writer; reads route by /agent-platform/ducklake/telemetry_catalog); PLAN-telemetry-production-catalog's admin session
  done (the production writer login and its secret value; the bootstrap fence and boundary entries applied; Decision
  A); PLAN-telemetry-reader-and-smoke-twin deployed (telemetry-twin-smoke, deploy-telemetry and telemetry-smoke jobs on
  main, the telemetry reader served; Decision B); PLAN-telemetry-production-maintenance built (T2.36:c5 met).
- >-
  PR flip, pre-merge: the speculative plan shows exactly three in-place updates
  (aws_lambda_function.ducklake_telemetry_writer, aws_iam_role_policy.ducklake_telemetry_writer,
  aws_ssm_parameter.ducklake_telemetry_catalog), nothing on the shared reader and a PASS predicted guard verdict (VP step
  5). Benjamin's word is required before merge (IAM on the writer role, the Class B writer contract). Post-merge the one
  apply moves writer, capture (describe) and reads (the deploy output) together; in-flight trees re-send whole to
  production. The PR touches no deploy trigger path, so the light gate runs from the session (VP step 6) and in the
  next deploy run.
- >-
  PR cleanup, after VP steps 6-9 pass: the merge triggers deploy-ducklake-lambdas (the shared reader, the telemetry
  reader and the telemetry writer and twin, whose manifest notes change); no terraform. Benjamin's word is required
  before merge (reader contract semantics).
- >-
  PR narrow, after VP step 14 passes (so the code deploy and the configuration apply never touch the shared reader at
  once): the speculative plan shows exactly two in-place updates (aws_lambda_function.ducklake_reader,
  aws_iam_role_policy.ducklake_reader) and a PASS verdict (VP step 16). Benjamin's word is required (IAM).
- >-
  PR bookkeeping touches docs/ROADMAP-PLATFORM.yaml, a manifest asset of the data-pipeline artifact
  (compute_affected_artifacts): a data-only change; its zip refreshes at the next governed deploy of that artifact
  (decoupled_build_pipeline), so no deploy step is owed here.
- >-
  One DuckLake deploy or apply at a time (the coordinator sequences merges); no merge during the org-transfer freeze
  window.
acceptance_criteria:
- >-
  T2.36:c2: after the flip, real Claude Code session capture lands in ducklake_telemetry through
  agent-platform-ducklake-telemetry-writer (the implementing session's own tree reads back through the production
  writer's probe and the in-session check), and no staging writer exists on any telemetry path.
- >-
  Sessions in flight at the flip re-send their trees to production with no halt and no grain conflict.
- >-
  Golden replay passes on ducklake_telemetry with zero mismatches and no skew; the monitor completes on production; the
  preflight gauge reads pass on ducklake_telemetry (T2.36:c3 re-verified in production).
- >-
  The production writer's deploy gate keeps the Decision 213 direct-invoke denial and the Decision 216 can_create check
  and writes no append, blob or project-registration row, and no job runs heavy vectors against the production writer;
  ontheloop is registered on production.
- >-
  After the cleanup and narrow PRs the shared reader serves no event verb and holds no telemetry env or blob grant;
  production telemetry is read only through the telemetry reader.
- >-
  The stale-reference guard passes, every rec-4292 item has a home in the closure ledger, rec-4292 is closed by the
  bookkeeping PR's Resolves trailer, and T2.36:c2 reads met with met_by telemetry-production-flip.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prerequisites from the four earlier slice 2c plans are on main.
  command: >-
    git fetch origin main --quiet && git show origin/main:.github/workflows/deploy-ducklake-lambdas.yml | grep -E
    '^  (telemetry-twin-smoke|deploy-telemetry|telemetry-smoke):' | wc -l | grep -qx 3 && git show
    origin/main:scripts/telemetry_capture/read_route.py > /dev/null && test "$(aws ssm get-parameter --name
    /agent-platform/ducklake/telemetry_catalog --profile agent_platform --query Parameter.Value --output text)" =
    ducklake_smoke && aws ssm get-parameter --name /agent-platform/ducklake/telemetry_reader_url --profile agent_platform
    --query Parameter.Name --output text && git show origin/main:docs/ROADMAP-PLATFORM.yaml > "${TMPDIR:-/tmp}/roadmap_flip.yaml"
    && bin/venv-python -c "import os,yaml;d=yaml.safe_load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'roadmap_flip.yaml')));
    it=[i for i in d['tier_items'] if i['id']=='T2.36'][0];s={c['id']:c['status'] for c in it['exit_criteria']};print(s);
    assert s['c1']=='met' and s['c5']=='met', s;print('PREREQS_OK')"
  expected: >-
    The three telemetry jobs and the routing helper are on main, the deploy output reads ducklake_smoke, the telemetry
    reader's SSM parameter exists, T2.36 c1 and c5 read met, PREREQS_OK.
  fix_if: Stop; this plan builds only after the four earlier slice 2c plans are done.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: PR flip. The pin targets the production catalog and the shared reader's applied values stay on smoke.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_infra_pins.py::test_telemetry_pin_targets_the_production_catalog
    tests/checks/iam_tf/test_telemetry_shared_reader_pins.py::test_shared_reader_telemetry_env_stays_on_smoke_until_narrowed -q
  expected: Exit 0. Red before because the nodes are absent.
  fix_if: Fix the Terraform, never the guard; the shared reader must not follow the moved pin local.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-pin-targets-production
- step: 3
  phase: pre-deploy
  action: >-
    PR flip. The light production gate keeps the denial and can_create checks and writes no test rows; no job runs the
    heavy vectors against the production writer; the new flag dispatches.
  command: >-
    bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_production_gate.py::test_production_gate_expects_the_production_binding
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_production_gate.py::test_production_gate_keeps_the_denial_and_can_create_checks
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_production_gate.py::test_production_gate_runs_no_append_or_registration_vector
    tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py::test_no_job_runs_heavy_vectors_against_the_production_writer
    tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py::test_telemetry_smoke_runs_the_production_gate
    tests/ducklake_neon_smoke_test/test_main_dispatch.py::test_main_lambda_telemetry_production_dispatch
    tests/ducklake_neon_smoke_test/test_main_dispatch.py::test_main_lambda_telemetry_flag_is_retired -q
  expected: Exit 0. Red before because the module and nodes are absent.
  fix_if: Remove any write vector from the production gate; never drop the DryRun or can_create check.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-production-gate-is-light
- step: 4
  phase: pre-deploy
  action: PR flip. The touched suites, Terraform format and the full tier pass.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_infra_pins.py tests/checks/iam_tf/test_telemetry_shared_reader_pins.py
    tests/ducklake_neon_smoke_test/test_lambda_telemetry_gates.py tests/ducklake_neon_smoke_test/test_lambda_telemetry_production_gate.py
    tests/ducklake_neon_smoke_test/test_main_dispatch.py tests/verify_ci_workflow -q && terraform -chdir=terraform/personal
    fmt -check && bin/venv-python -m ruff check . && bin/venv-python -m scripts.validate
  expected: The suites pass, fmt and ruff exit 0, then "All checks passed." and exit 0.
  fix_if: Fix at root and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    PR flip. Before merge, the PR's speculative plan is exactly the three in-place updates. Save the "Terraform
    Speculative Plan" PR comment body for the PR's final head (mcp__github__pull_request_read get_comments) to
    $SPEC_PLAN_FILE and export PR_HEAD_SHA.
  command: >-
    test -s "$SPEC_PLAN_FILE" && test -n "$PR_HEAD_SHA" && bin/venv-python -c "import os,re;t=open(os.environ['SPEC_PLAN_FILE'],encoding='utf-8',errors='replace').read();
    assert ('PR head SHA: '+chr(96)+os.environ['PR_HEAD_SHA']+chr(96)) in t, 'not the final head comment';m=re.search(r'Plan:
    (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('0','3','0'), m and m.group(0);assert
    'Predicted guard verdict: PASS' in t, 'not auto-apply';got={a:v for a,v in re.findall(r'# (\S+) (?:will|must) be
    (created|updated in-place|destroyed|replaced|read during apply)',t) if not a.startswith('data.')};want={a:'updated
    in-place' for a in ('aws_lambda_function.ducklake_telemetry_writer','aws_iam_role_policy.ducklake_telemetry_writer','aws_ssm_parameter.ducklake_telemetry_catalog')};
    assert got==want, got;assert 'ducklake_reader' not in ' '.join(got), got;print('SPEC_PLAN_OK',m.group(0))"
  expected: Exit 0 and SPEC_PLAN_OK with 0 to add, 3 to change, 0 to destroy and no shared-reader address.
  fix_if: >-
    Any shared-reader address means a reference still follows the pin local (re-point it to a smoke local); an
    aws_iam_role address means the role description was edited (revert it); any other count is a stop to explain
    before merging.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: >-
