  action: Modify
  purpose: >-
    PR flip: ducklake_telemetry_meta_schema = "ducklake_telemetry" (the pin moves with Decision A; the blob root local and
    the catalog deploy output follow) and its comment names Decision A instead of "until a Decision moves it (slice 2c)".
    The shared reader's TELEMETRY_META_SCHEMA and TELEMETRY_BLOB_ROOT env and its TelemetryBlobRead resource are
    re-pointed to local.ducklake_smoke_meta_schema and local.ducklake_telemetry_smoke_blob_root (the locals
    PLAN-telemetry-reader-and-smoke-twin added), so the shared reader's applied values do not change in this PR; any
    other reference to the moving locals that is not the production writer is re-pointed the same way. PR narrow: the
    shared reader loses TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH and TELEMETRY_BLOB_ROOT and the TelemetryBlobRead
    statement; S3DataReadOnly and S3ListDataPrefix keep the production and smoke data prefixes (the T2.17 ops gates and
    rollback, Decision 78 cl.7). The reader role's description stays as it is (rec-4292 item 5's choice: a role
    attribute update leaves the apply budget).
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR flip: the writer's env TELEMETRY_META_SCHEMA = local.ducklake_telemetry_meta_schema (now ducklake_telemetry),
    TELEMETRY_DATA_PATH = local.ducklake_telemetry_data_path, TELEMETRY_BLOB_ROOT = local.ducklake_telemetry_blob_root,
    TELEMETRY_DSN_SECRET_ID = the production writer secret (agent-platform-ducklake-telemetry-writer-prod-dsn, the
    resource PLAN-telemetry-production-catalog declared); the role policy's TelemetryDsnRead names that secret only,
    TelemetryCatalogDataReadWrite and TelemetryCatalogDataList name the ducklake-telemetry/ prefix only,
    TelemetryBlobReadWrite and TelemetryBlobList name telemetry-blobs/ducklake_telemetry/ only; still no Delete action.
    aws_ssm_parameter.ducklake_telemetry_catalog follows the moved local unedited. The header comment says the function
    binds the production catalog; the role's description attribute is left stale on purpose, with a comment beside it
    saying so (an aws_iam_role update is outside in_budget_resource_types and would route the flip to tf-gated-apply).
