schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: secrets-to-ssm-expand
intent: >-
  Plan 2 of plan D (Secrets Manager to SSM Parameter Store). Expand without switching anyone over: terraform/personal
  gains the /secret/ name and ARN map, the Neon catalog DSN as a Terraform-managed SecureString (the one declared value
  exception, same value as today's secret), an ssm:GetParameter grant beside every existing Secrets Manager value grant
  on the DuckLake Lambda roles, the planner's three parameter reads (tfvars, and the Neon key and DSN conditioned on the
  drift session), and new parameter-name env vars beside the old ones. After merge, the admin copy run puts the other
  eight values into SSM. Every consumer still reads Secrets Manager until secrets-to-ssm-cutover.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-expand.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4539's SSM half. No tier_item criterion claimed. Third of plan D's five
  plans (retire-github-pat-secret, secrets-to-ssm-grants, this plan, secrets-to-ssm-cutover, secrets-to-ssm-retire).
scope:
- file: terraform/personal/secret_parameters.tf
  action: Create
  purpose: >-
    locals secret_parameter_names (nine keys, each "/secret/<current Secrets Manager name>": neon_api_key,
    terraform_personal_tfvars, ducklake_neon_catalog_dsn, deepseek_api_key, anthropic_api_key, telemetry_writer_dsn,
    telemetry_writer_prod_dsn, telemetry_reader_dsn, smoke_maintainer_dsn) and secret_parameter_arns (the same keys,
    "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter${name}"). A header comment names Decision N (from
    secrets-to-ssm-grants) and says only the DSN is Terraform-managed.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    The DSN JSON moves into local.ducklake_neon_dsn_document, used unchanged by
    aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn (no diff) and by the new resource "aws_ssm_parameter"
    "ducklake_neon_catalog_dsn" (name the literal "/secret/ducklake-neon-catalog-dsn", type SecureString, tier
    Standard, no key_id, description and tags as the secret's). New output ducklake_neon_catalog_dsn_parameter_name.
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: Writer and reader roles each gain Sid NeonDsnParameterRead (ssm:GetParameter on the DSN parameter ARN) beside NeonDsnRead.
- file: terraform/personal/ducklake_catalog_dr.tf
  action: Modify
  purpose: The DR role gains NeonDsnParameterRead beside NeonDsnRead.
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: The maintenance role gains NeonDsnParameterRead on the five parameter ARNs matching its NeonDsnRead (the DSN and four logins).
- file: terraform/personal/ducklake_maintenance_smoke.tf
  action: Modify
  purpose: Gains NeonDsnParameterRead on the smoke maintainer parameter and env var DUCKLAKE_DSN_PARAMETER beside DUCKLAKE_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: Gains TelemetryDsnParameterRead on the telemetry writer parameter and env var TELEMETRY_DSN_PARAMETER beside TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_writer_smoke.tf
  action: Modify
  purpose: Same as the writer (TelemetryDsnParameterRead, TELEMETRY_DSN_PARAMETER).
- file: terraform/personal/ducklake_telemetry_reader.tf
  action: Modify
  purpose: Gains TelemetryReaderDsnParameterRead on the reader parameter and TELEMETRY_DSN_PARAMETER beside TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/oidc.tf
  action: Modify
  purpose: >-
    In ci_full_refresh_read (the planner): SecretParameterTfvarsRead (ssm:GetParameter on the tfvars parameter, which
    every plan reads), SecretParameterDriftRead (ssm:GetParameter on the Neon key and DSN parameters, Condition
    StringLike aws:userid "*:tf-drift-convergence-writer", the pattern N1 uses for its Secrets Manager reads) and
    SecretParameterMetadataRead (ssm:ListTagsForResource on the DSN parameter). Nothing else in the file changes.
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    value_exceptions gains aws_ssm_parameter.ducklake_neon_catalog_dsn (file terraform/personal/neon_ducklake_catalog.tf,
    the same in-band reason), plus the amendment_log entry pinned in execution step 4.
- file: tests/test_secret_parameters_expand.py
  action: Create
  purpose: >-
    Text predicates on terraform/personal: the nine names equal "/secret/" plus the matching aws_secretsmanager_secret
    name (or the two out-of-band names); the DSN parameter shape and the shared document local; each role's parameter
    grant equals its Secrets Manager grant mapped to parameter ARNs (the role table); the three planner statements and
    the drift condition; the env vars; red cases on synthetic HCL.
- file: config/agent/verification_registry/entries/secret-parameters-expand.yaml
  action: Create
  purpose: Graduation record for VP step 1 (check_spec.node_id tests/test_secret_parameters_expand.py).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/personal at merge through terraform-apply-sandbox.yml: 1 create (aws_ssm_parameter.ducklake_neon_catalog_dsn)
  and in-place updates of the eight Lambda role policies, aws_iam_role_policy.github_ci_planner and four
  aws_lambda_function environments. In-budget inline-policy updates on boundary-carrying agent-platform-* roles and a
  non-IAM create auto-apply behind the guard (Decision 77/92 pt 5); a ROUTE instead goes to tf-gated-apply for
  Benjamin. The apply role's DSN write and read come from secrets-to-ssm-grants' admin apply.
- No code path changes, so no Lambda deploy channel fires.
- The admin copy run (VP step 8) after the apply, in ADMIN under PlatformAdmin's SecretParameterAdmin grant.
acceptance_criteria:
- terraform/personal declares the nine names, the DSN SecureString as the one declared exception, the per-role parameter grants mirroring the Secrets Manager grants, the planner's three reads with the drift condition, and the new env vars (TestSecretParametersExpand).
- After the apply, the DSN parameter's value equals the DSN secret's value, and every grant simulates as planned (VP step 7).
- After the copy run, all eight out-of-band parameters exist and equal their secrets (SECRETS_TO_SSM_COPY_OK 8/8), and nothing reads them yet.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The expand surface has the planned shape
  command: bin/venv-python -m pytest tests/test_secret_parameters_expand.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a predicate misreads real HCL -- fix it without loosening; a shape difference -- fix the HCL
  hermetic: true
  graduation: graduate
  graduation_check_id: secret-parameters-expand
- step: 2
  phase: pre-deploy
  action: The rules from secrets-to-ssm-grants pass on the new surface (the first real SecureString)
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf -q && bin/venv-python -m scripts.checks.iam_tf.validate_secret_material_handling
    && bin/venv-python -m scripts.checks.iam_tf.validate_secret_parameter_grants
  expected: all pass; validate_ci_refresh_read_coverage covers the DSN parameter for the planner and apply roles through ssm:GetParameter
  fix_if: a coverage failure -- add the missing grant in scope; never relax a check
  hermetic: true
  graduation: waive
  graduation_waiver_reason: These suites and checks already run in the fast tier; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Provider-free formatting check on the touched root
  command: terraform fmt -check terraform/personal
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt.
- step: 4
  phase: pre-deploy
  action: The speculative plan on the PR shows exactly the planned changes
  command: >-
    echo 'VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="otl-labs", repo="ontheloop",
    pullNumber=<this PR>) -- read the "Terraform Speculative Plan" comment for the PR head sha'
  expected: >-
    1 to add (aws_ssm_parameter.ducklake_neon_catalog_dsn), 13 to change in place (eight Lambda role policies, the
    planner policy, four Lambda functions' environments), 0 to destroy; predicted guard verdict auto-apply
  fix_if: any other change, or the DSN secret version shows a diff -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: ENVIRONMENT CHECK before the live reads
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- hand steps 6-8 to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: The apply is green and the DSN parameter holds the same value as the DSN secret (compared in memory, never printed)
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3, hmac; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); a=s.client('secretsmanager').get_secret_value(SecretId='ducklake-neon-catalog-dsn')['SecretString']; p=s.client('ssm').get_parameter(Name='/secret/ducklake-neon-catalog-dsn', WithDecryption=True)['Parameter']; got=(p['Type'], hmac.compare_digest(a, p['Value'])); print('LIVE', got); assert got==('SecureString', True), got; print('DSN_PARAMETER_MATCH_OK')"
  expected: >-
    the apply run for the merge commit is green (mcp__github__actions_list / actions_get), then LIVE ('SecureString',
    True) and DSN_PARAMETER_MATCH_OK. The apply role's own create and re-read are the first live proof that the aws/ssm
    key decrypts under the boundary.
  fix_if: the apply is red -- follow deploy-paths.yaml's reconcile row, never a local apply; a KMS AccessDenied -- stop and RCA (the key assumption in secrets-to-ssm-grants' context failed)
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: Live simulate of the new grants (read-only, ADMIN)
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); iam=s.client('iam'); a=s.client('sts', region_name='eu-west-1', endpoint_url='https://sts.eu-west-1.amazonaws.com').get_caller_identity()['Account']; p='arn:aws:ssm:eu-west-2:'+a+':parameter/secret/'; d=lambda role,n,ctx=None: iam.simulate_principal_policy(PolicySourceArn='arn:aws:iam::'+a+':role/'+role, ActionNames=['ssm:GetParameter'], ResourceArns=[p+n], **({'ContextEntries':[{'ContextKeyName':'aws:userid','ContextKeyValues':['AROAEXAMPLE:'+ctx],'ContextKeyType':'string'}]} if ctx else {}))['EvaluationResults'][0]['EvalDecision']; pl='agent-platform-github-ci-planner'; got=(d('agent-platform-ducklake-writer','ducklake-neon-catalog-dsn'), d('agent-platform-ducklake-writer','agent-platform-ducklake-telemetry-writer-dsn'), d('agent-platform-ducklake-maintenance','agent-platform-ducklake-smoke-maintainer-dsn'), d(pl,'agent-platform-terraform-personal-tfvars','terraform-plan-pr'), d(pl,'neon-api-key','terraform-plan-pr'), d(pl,'neon-api-key','tf-drift-convergence-writer'), d(pl,'ducklake-neon-catalog-dsn','terraform-plan-pr')); print('LIVE', got); assert got==('allowed','implicitDeny','allowed','allowed','implicitDeny','allowed','implicitDeny'), got; print('EXPAND_GRANTS_LIVE_OK')"
  expected: >-
    LIVE ('allowed', 'implicitDeny', 'allowed', 'allowed', 'implicitDeny', 'allowed', 'implicitDeny') and
    EXPAND_GRANTS_LIVE_OK. Role names are the live names in the touched .tf files (fix the literal if one differs).
    eu-west-1 STS endpoint (Plan A). Post only the tuple.
  fix_if: any other tuple -- stop and RCA
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: HUMAN-DIRECTED ADMIN COPY RUN -- the eight out-of-band values into SSM, on Benjamin's word on the exact command
  command: >-
    echo 'ADMIN: present the exact command bin/venv-python -m scripts.secrets_to_ssm_copy --profile agent_platform_admin;
    run it only after Benjamin replies naming it; then run it again with --verify'
  expected: >-
    His message id recorded; the run prints eight "created" lines and SECRETS_TO_SSM_COPY_OK 8/8; the --verify run
    prints eight "unchanged" lines and SECRETS_TO_SSM_COPY_OK 8/8. The tier column shows whether tfvars needed Advanced
    (USD 0.05 a month). No value or hash is printed.
  fix_if: a mismatch or failure line -- stop and show him the output; never pass --overwrite without his word naming it
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run (recursion refusal for graduation); step 1 carries the durable regression.
- step: 10
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
