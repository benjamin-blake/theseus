constraints:
- >-
  Always-ask, each needing Benjamin's own typed word in the build thread: the merge (IAM), a tf-gated-apply approval if
  the guard routes, the copy run's exact command (VP step 8), and any --overwrite. The contract entry text (execution
  step 4) was shown to him before the plan PR merged.
- "Freeze: from the copy run until secrets-to-ssm-cutover merges, no value is written to any of the eight Secrets Manager secrets (no scoped-login rotation, no tfvars edit). If one must change, change both stores on his word and re-run --verify."
- "No consumer reads SSM in this plan; the old env vars and grants stay until secrets-to-ssm-retire."
- "Public repo (Decision 101): no account id or ARN in any file or posted evidence."
- "Identity calls stay off the eu-west-2 STS host (Plan A)."
- No rescue agents or workaround loops (Decision 55).
context:
- "Decision-scout verdict (combined plan D design, 2026-10-25): FLAGS_FOUND; this plan's flags are Decision 175 (the first SecureString, enforced by secrets-to-ssm-grants' rules) and 157 (value reads enumerated per ARN). Decisions triaged: 187 of 187."
- "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
- "Approval: Benjamin, 2026-10-25, cmsg_01Cqz6E4mzSv6kkGCSCub3WMAjLdkvPmWNohzfkYYcP1rE ('write the plan') on step6b-presentation.md, with the placement-review changes in cmsg_01Cqz6E4mzSv6kkGCSCub3WM6UrqhveXKbb7s9CosdE7Ar (the main DSN stays a Terraform value exception; the planner's Neon key and DSN reads are drift-conditioned only; no Neon re-mint in D)."
- "Start conditions: secrets-to-ssm-grants merged and its admin apply done (its VP step 9 green); N1 merged with the mechanism in /mnt/project-files/secrets-to-ssm/n1-interface.md (PR plans -refresh=false, the Neon key as an ephemeral input variable, drift reads on aws:userid); N2 merged (rec-4230: PR plan files are no longer public, which matters because a PR plan that creates the DSN parameter carries its value). If N1's merged mechanism differs, return to the planner before the first edit."
- "Why the planner needs no PR-time DSN read: N1 runs PR plans with -refresh=false, so only drift refreshes the parameter; drift runs as the tf-drift-convergence-writer session."
- "Related-work check (scripts.ci_rca.red_overlap, 2026-10-25): verdict clear, no reds."
- "V3 resolution: terraform/personal applies only at merge, so the pre-merge V3 evidence is the speculative-plan comment for the PR head (VP step 4); the behavioural acceptance is VP steps 6-8 after merge, posted as a counts-only comment on the merged PR."
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Confirm the start conditions; read Decision N's number from secrets-to-ssm-grants' merged DECISIONS.md entry.
- >-
  terraform/personal/secret_parameters.tf and neon_ducklake_catalog.tf as in scope. The jsonencode object moves to
  local.ducklake_neon_dsn_document byte-for-byte (same keys, same order), so the secret version plans no change.
- >-
  The seven Lambda files and oidc.tf as in scope. Each new Sid sits directly after its Secrets Manager counterpart with
  a one-line comment naming Decision N and secrets-to-ssm-retire as the plan that removes the old one. Resources use
  local.secret_parameter_arns.<key>; env vars use local.secret_parameter_names.<key>. The planner condition is
  StringLike {"aws:userid" = "*:tf-drift-convergence-writer"}, written like N1's conditioned statements next to it.
- |-
  docs/contracts/secret-material-handling.yaml -- append to value_exceptions:
    - resource: "aws_ssm_parameter.ducklake_neon_catalog_dsn"
      file: terraform/personal/neon_ducklake_catalog.tf
      reason: >-
        The same in-band DSN as aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn, held as an SSM
        SecureString (Decision N cl.3) until that secret is retired. IN-BAND by construction (CD.34).
  and prepend to amendment_log: {date: "<implementation date>", semantic_break: false, change_class: field_add,
  summary: "PLAN-secrets-to-ssm-expand (Decision N): the Neon catalog DSN's SecureString parameter is the second
  declared value exception, beside the secret version it mirrors until secrets-to-ssm-retire."}
- Write tests/test_secret_parameters_expand.py and the registry entry.
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml): VP steps 1-3, implementation_declared true,
  rebase on origin/main, VP steps 9-10 on the committed clean tree, postflight retrospective, push, PR,
  subscribe_pr_activity. Read the speculative plan (VP step 4) and post its change line and verdict in the build thread,
  asking Benjamin to reply "merge" naming the PR. Code review in a fresh context with the V3 resolution line quoted.
  Squash-merge on code review PROCEED, green CI and his word. Then, on events: VP steps 5-7; ask for the copy run (VP
  step 8) and run it on his word; post the counts-only results on the merged PR.
- 'Report: what was implemented, the VP results, the LIVE tuples and the copy-run summary'
rollback: >-
  Nothing reads SSM yet, so a revert PR is safe at any point: its apply destroys the DSN parameter and removes the new
  grants and env vars. The eight copied parameters are not Terraform-managed; Benjamin may leave them or have the admin
  delete them (his word on the exact command).
