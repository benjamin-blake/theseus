execution_steps:
  - >-
    Create scripts/platform_roadmap_liveness.py. Public surface: build_blocking_graph(doc) returning
    edges plus a per-edge demand label, toxic_sccs(doc) returning the toxic components, and
    toxic_node_ids(doc) returning the flat sorted id set the baseline keys on. NON_TERMINAL = tier
    items whose status is not_started, in_progress or deferred_post_mvp, plus candidate_decisions
    whose state is pending; every edge with a terminal endpoint is pruned. Edge demands -- depends_on
    and blocked_by until complete demand `complete`; cd.gates, decision_required_before and
    blocked_by until ratified demand `ratified`; the Decision 105 reverse edge from a pending CD to
    each gated item demands `evidence`. Use networkx.strongly_connected_components over a DiGraph --
    networkx>=3.6.1 is declared in BOTH requirements.txt and requirements-fast.txt and is already
    imported by two --pre checks (scripts/checks/deps/affected_graph.py,
    validate_pre_glob_closure.py) and scripts/dependency_graph.py -- never a hand-rolled recursive
    Tarjan kernel, whose every branch the full tier's 100%-line-coverage gate would have to cover.
    An SCC is toxic iff it holds an internal edge demanding `complete`. Add a --report CLI printing the SCC count and the sorted node ids. Never raise on a
    malformed document -- return an empty result and let the caller declare skipped().
  - >-
    Create scripts/checks/roadmap/validate_roadmap_liveness.py, decorated @registry.register with
    owner="platform". Leg A mirrors validate_check_accounting's (a)/(b)/(c) structure exactly.
    (a) PRIMARY, unconditional, base-independent -- fail any id in toxic_node_ids(doc) absent from
    the HEAD baseline. This is the assertion that makes the check a liveness gate rather than a
    config-file lint: a PR that closes a fresh completion-demanding ring touches no config file and
    grows no baseline, so (b) and (c) alone would pass it. (b) frozen-constant cross-check -- fail
    any HEAD baseline id absent from the in-module _BASELINE_SEED, so a config edit alone can never
    admit a member. (c) shrink-only diff -- read the baseline at the diff base via
    _marker_guard.default_base_reader and fail any id at HEAD but absent at base. On an unreadable
    base, SCOPE THE SKIP TO (c) ONLY: print a loud SKIP line for the diff sub-leg and CONTINUE --
    legs (a), (b), B and C need no base and must keep enforcing. default_base_reader returns None
    for both an unreachable origin/main and a path absent at base and cannot tell them apart, which
    is exactly why the precedent prints "advisory locally, seeding-safe in CI" rather than
    returning. Reserve registry.skipped() for a genuinely check-wide degradation (an unloadable
    roadmap); a scoped SKIP still ends in registry.examined(...). Leg B -- for every
    exit criterion whose status is rehomed, resolve met_by and fail unless that item carries at
    least one open criterion; use the normalizing loader, never yaml.safe_load plus isinstance dict.
    Leg C -- parse the base roadmap PER ITEM via TierItem.model_validate (never the whole document,
    whose graph validator can raise on an older base), diff criteria KEYED ON TEXT, and for each
    added or text-changed criterion fail if its text names a NON_TERMINAL id with a blocking phrase
    and carries no blocked_by entry for that ref. Declare registry.examined(...) or
    registry.skipped(...) on every reachable exit path.
  - >-
    Create config/roadmap_liveness_baseline.yaml with the 19 seed ids under an entries key, plus a
    header comment recording -- shrink-only, no marker escape grammar of any kind, bounded by the
    module's frozen _BASELINE_SEED, missing-base SKIP, the owning drain recs rec-3579 and rec-3580,
    and the Decision 159 style reversal condition (if no toxic finding drives a drain within two
    quarters, unwind the ratchet with the check rather than leaving a permanently exempt roster).
  - >-
    Register the Entry in scripts/checks/roadmap/_manifest.py with pre=True and
    full_segment="full_after_lint", using bare string literals. pre_globs must cover the whole
    transitive first-party import closure -- docs/ROADMAP-*, docs/DECISIONS.md,
    docs/DECISIONS_ARCHIVE.md, scripts/decisions_md.py, scripts/platform_roadmap_models.py,
    scripts/platform_roadmap_state.py, scripts/platform_roadmap_gate_rules.py,
    scripts/platform_roadmap_liveness.py, scripts/roadmap/**, scripts/checks/roadmap/**,
    scripts/checks/_common.py, scripts/checks/registry.py, scripts/checks/_marker_guard.py,
    config/roadmap_liveness_baseline.yaml AND docs/contracts/roadmap-liveness.yaml. That last one is
    load-bearing, not decorative: execution step 6 makes the contract the SOLE source of leg C's
    blocking-phrase grammar, read at run time, so omitting it means a PR that widens or narrows the
    phrase set silently SKIPS the gate in --pre and only reddens post-merge -- the fail-open
    under-inclusion class this manifest's own docstring warns about. Precedent:
    validate_plan_scope_closure carries docs/contracts/plan-obligations.yaml in both its pre_globs
    and its _CLOSURE_INPUTS row.
  - Add the config/ci_rca_taxonomy.yaml function_to_category row -- validate_roadmap_liveness -> schema_drift.
  - >-
    Create docs/contracts/roadmap-liveness.yaml as a Class D contract. status MUST be
