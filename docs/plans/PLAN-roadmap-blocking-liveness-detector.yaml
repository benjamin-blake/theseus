    module) with the precision basis for the chosen phrase set, the PER-SURFACE residual map that
    Decision 181 clause 2 actually requires -- one row per unenforced surface naming either its
    enforcing check or its owning rec: leg C's pre-existing prose corpus (rec-3581) AND the
    starvation class the toxic-SCC rule structurally excludes (rec-3582: a pending CD whose every
    gated item is parked can never accrue realization evidence, so criteria blocked_by it are
