schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "roadmap-blocking-liveness-detector"
intent: >-
  Make roadmap deadlock machine-visible: a registered check that builds the heterogeneous blocking
  graph, reports strongly connected components that structurally cannot progress, and ratchets the
  measured stock down shrink-only -- closing the gap where validate_platform_roadmap passes green
  while two live cores are deadlocked.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-blocking-liveness-detector.yaml
phase: >-
  Roadmap-governance enforcement; consumes the ExitCriterion.blocked_by / CandidateDecision.affects
  surface added by PLAN-roadmap-blocking-edge-semantics (commit c1f818f3, PR 1070). Soft-warn
  exception category ad_hoc_rec (rec-3395, rec-3394), so the Tier Item Freshness Gate is skipped:
  claims no tier_item slice and closes no criterion. Boundary: T2.54 owns instruction-layer
  clause-to-check traceability and is NOT advanced here; T2.55 owns retiring marker escapes on the
  SLOC/coverage registries and is not touched.
scope:
  - file: scripts/platform_roadmap_liveness.py
    action: Create
    purpose: >-
      Pure graph module. Builds the blocking graph over NON_TERMINAL nodes, classifies every edge by
      the terminal state it demands, runs networkx SCC, and returns toxic SCCs (>=1 internal
      completion-demanding edge). Report-only; never raises at load. Exposes a --report CLI.
  - file: scripts/checks/roadmap/validate_roadmap_liveness.py
    action: Create
    purpose: >-
      The registered check. Leg A liveness ratchet vs the baseline, leg B rehome coverage
      (hard-fail), leg C diff-scoped criterion-level prose-to-structural (hard-fail). Declares
      examined()/skipped() on every reachable exit path (Decision 170).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      Add the gated Entry (bare string literals, Decision 169) with pre_globs covering the whole
      transitive first-party import closure -- see execution_steps for the exact glob list.
  - file: config/roadmap_liveness_baseline.yaml
    action: Create
    purpose: >-
      Frozen shrink-only baseline, one entry per tier_item/CD id, seeded at the 19 measured toxic
      nodes. No marker escape grammar of any kind. Grain precedent is
      config/check_accounting_baseline.yaml (Decision 170 point 3) -- a flat entries list in one
      file -- NOT Decision 176, whose grain is one file per record and whose rationale (tail-append
      conflicts on an accreting list) does not bind a 19-line roster that only ever shrinks.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row -- validate_roadmap_liveness -> schema_drift (surface 4 of 7)
  - file: docs/contracts/roadmap-liveness.yaml
    action: Create
    purpose: >-
      Class D contract: node-class semantics, edge-demand taxonomy, baseline grammar, and the
      PER-SURFACE Decision 181 clause 2 discharge -- leg C's prose residual (rec-3581), the
      starvation residual the toxic-SCC rule structurally cannot see (rec-3582), and leg B's
      necessary-but-not-sufficient bound. Not a general clause-to-check index.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Two registrations, not one -- the route whose topic equals the new contract's subject
      (Decision 168), AND the scripts_root_allowlist.allowed_files entry for the new depth-1 module
      (validate_placement scans every tracked depth-1 scripts/ file, not just diff-added ones).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Its blocked_by semantics currently reads "carries no runtime consumer beyond the schema
      validator today -- rec-3395 (open) is the deferred liveness-detector follow-on that will read
      it". This plan SHIPS that consumer and closes rec-3395, so the sentence is false on merge.
      Name validate_roadmap_liveness as the consumer, plus the accompanying amendment_log entry.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Sole edit -- add blocked_by [{ref: CD.41, until: ratified}] to T2.53 c6, the only edge the
      verbatim text licenses. T2.51 c3 is NOT edited (its text disclaims the block).
  - file: config/agent/verification_registry/entries/roadmap-liveness-graph-semantics.yaml
    action: Create
    purpose: verification-registry shard for the graduated graph-semantics step (Decision 132/176)
  - file: config/agent/verification_registry/entries/roadmap-liveness-rehome-target-carries-open-criterion.yaml
    action: Create
    purpose: verification-registry shard for the graduated rehome-coverage step
  - file: config/agent/verification_registry/entries/roadmap-liveness-legc-text-keyed.yaml
    action: Create
    purpose: verification-registry shard for the graduated leg-C insertion-robustness step
  - file: config/agent/verification_registry/entries/roadmap-liveness-measured-toxic-covered-by-baseline.yaml
    action: Create
    purpose: verification-registry shard for the graduated leg-A primary-assertion step
  - file: config/agent/verification_registry/entries/roadmap-liveness-baseline-shrink-only.yaml
    action: Create
    purpose: verification-registry shard for the graduated baseline shrink-only step
  - file: tests/checks/roadmap/test__manifest.py
    action: Modify
    purpose: >-
      Add the _CLOSURE_INPUTS row for validate_roadmap_liveness -- that dict is hand-maintained at
      one row per gated Entry, so a new Entry without a row is silently uncovered by
      TestClosureMembersAreCovered.
  - file: tests/test_platform_roadmap_liveness.py
    action: Create
    purpose: graph-module unit tests over synthetic fixtures (mirror of the graph module)
  - file: tests/checks/roadmap/test_validate_roadmap_liveness.py
    action: Create
    purpose: check mirror test -- three legs, ratchet teeth, accounting declaration
bundled_recommendations: ["rec-3395", "rec-3394"]
followon_recs: ["rec-3579", "rec-3580", "rec-3581", "rec-3582"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts/platform_roadmap_liveness.py classifies an SCC toxic iff it contains an internal edge
    demanding `complete` of a member; a pending-CD build-then-ratify cycle is never toxic.
  - >-
    Run against the live roadmap the detector reports exactly 2 toxic SCCs spanning 19 node ids, and
    config/roadmap_liveness_baseline.yaml holds exactly those 19 ids.
  - >-
    A roadmap edit closing a fresh completion-demanding ring that recruits ANY node absent from the
    HEAD baseline fails under leg A(a), and the only admission path -- editing the baseline -- is
    itself refused by the frozen _BASELINE_SEED.
  - >-
    The ratchet tightens, it does not merely refuse to grow: a baselined id that is no longer
    measured toxic FAILS under leg A(d) until it is removed, so a PR draining a core must shrink the
    roster in the same change and a later edit cannot re-close that ring against a stale roster.
  - >-
    The baseline carries no marker escape: adding an id absent from the in-module frozen
    _BASELINE_SEED fails, and an unreadable diff base SKIPs only leg A's diff sub-leg (c) while legs
    A(a), A(b), A(d), B and C keep enforcing.
  - >-
    Leg C's failure message names the re-sequence escape, so an author whose new criterion closes a
    ring is never left with deleting the prose as the only in-PR move.
  - >-
    Leg B fails a roadmap in which a rehomed criterion's met_by target carries no open criterion, and
    passes on the live roadmap (0 violations), using the normalizing loader so bare-string criteria
    are counted as open.
  - >-
    Leg C fails a criterion added or edited in the diff whose text names a NON_TERMINAL roadmap id
    with a blocking phrase and carries no matching blocked_by entry, and reports no finding when a
    criterion is merely inserted into a bare-string list ahead of unchanged siblings.
  - >-
    Leg C's blocking-phrase grammar is declared in docs/contracts/roadmap-liveness.yaml -- the check
    holds no second copy -- and the contract states the recall/precision basis on which the phrase
    set was chosen.
  - >-
    platform_roadmap_liveness.py is registered in docs/contracts/file-router.yaml's
    scripts_root_allowlist.allowed_files, so validate_placement does not report it as a root stray.
  - >-
    validate_roadmap_liveness is registered, dispatched from the roadmap manifest, present in
    config/ci_rca_taxonomy.yaml function_to_category, absent from config/check_accounting_baseline.yaml,
    and declares examined()/skipped() on every reachable exit path.
  - >-
    T2.53 c6 carries blocked_by [{ref: CD.41, until: ratified}], the roadmap still loads, and the
    toxic-SCC count is unchanged at 2.
  - rec-3395 and rec-3394 are closed with evidence, and the full validation tier exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the discriminator over synthetic fixtures -- a pending-CD build-then-ratify 2-cycle is
      benign; a ring carrying an internal completion-demanding edge is toxic; a blocked_by until
      ratified edge alone never makes a ring toxic; the rec-3394 shape (rehome-out criterion plus a
      blocked_by until ratified edge to a CD that gates the rehome source) yields no toxic SCC.
    command: bin/venv-python -m pytest tests/test_platform_roadmap_liveness.py -q
    expected: All tests pass, exit status 0, and no test is skipped.
    fix_if: >-
      A benign CD cycle is reported toxic (the ratified/evidence edge kinds leaked into the
      completion-demanding set), or the rec-3394 fixture reports a toxic SCC (the until value is
      being ignored and every blocked_by edge is treated as completion-demanding).
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-graph-semantics
  - step: 2
    phase: pre-deploy
    action: >-
      Run the detector against the live roadmap and confirm it reports exactly 2 toxic SCCs spanning
      19 node ids, and that the seeded baseline holds exactly those ids.
    command: bin/venv-python -m scripts.platform_roadmap_liveness --report
    expected: >-
      Output names 2 toxic SCCs and 19 total toxic node ids, listing CD.11, CD.27, CD.38, CD.40,
      CD.43, T2.18, T2.19, T2.26, T2.36, T3.2, T3.20, T4.1, T4.10a, T4.13, T4.2, T4.3, T4.4, T4.9 and
      T4.9a. Exit status 0.
    fix_if: >-
      A third SCC appears (an unlicensed blocked_by edge was transcribed onto T2.51 c3), or the count
      drops to 1 (blocked_by was excluded from the graph, which loses the T2.26 core), or T4.9 is
      missing (deferred_post_mvp was excluded from NON_TERMINAL).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The 19-id set is the measured stock at authoring time and is expected to SHRINK as rec-3579 and
      rec-3580 drain their cores. Graduating it would pin a transient census as a standing
      regression guard and would red the build on exactly the progress the ratchet exists to reward.
      Step 3's shrink-only assertion is the durable form of this check and is graduated instead.
  - step: 3
    phase: pre-deploy
    action: >-
      Exercise leg A's PRIMARY assertion -- every measured toxic node id must appear in the HEAD
      baseline. A synthetic roadmap that closes a fresh completion-demanding ring must FAIL the check
      even though it touches no config file and produces no baseline growth.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k Coverage -q
    expected: All selected tests pass, exit status 0, and at least one test is selected.
    fix_if: >-
      The fresh-ring fixture passes. That means the check only ever compares the baseline file
      against its own diff base and never compares it against the measured toxic set, so the gate is
      a config-file lint rather than a liveness gate and the defect it exists to catch walks through.
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-measured-toxic-covered-by-baseline
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the ratchet has teeth in every direction -- adding an id absent from the frozen in-module
      _BASELINE_SEED fails even though the config edit alone is well-formed; a baselined id that is
      no longer measured toxic FAILS under leg A(d) until removed, and passes once removed; and an
      unreadable diff base SKIPs sub-leg (c) loudly rather than treating missing as empty or
      disabling the base-independent legs.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k Ratchet -q
    expected: All selected tests pass, exit status 0, and at least one test is selected.
    fix_if: >-
      Adding an unseeded id passes, meaning the frozen-constant cross-check is not consulted and a
      config edit alone can admit a new member; or the missing-base case is treated as an EMPTY base,
      which reads all 19 HEAD ids as grown and FAILS the seeding PR -- the scoped SKIP exists to be
      seeding-safe, which is the opposite of letting a PR through. If legs B and C stop enforcing
      when the base is unreachable, the skip was applied check-wide instead of to sub-leg (c).
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-baseline-shrink-only
  - step: 5
    phase: pre-deploy
    action: >-
      Leg B rehome coverage -- fails when a rehomed criterion's met_by target carries no open
      criterion, passes on the live roadmap, and counts bare-string criteria as open via the
      normalizing loader.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py::TestRehomeCoverage::test_rehome_target_must_carry_open_criterion -q
    expected: The selected test passes and exit status is 0.
    fix_if: >-
      The live roadmap reports 3 violations for T0.4 c4, T1.16 c7 and T3.6 c5 -- that is the naive
      yaml.safe_load plus isinstance dict path, which misses the 419 bare-string criteria that
      normalize to status open only through the loader.
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-rehome-target-carries-open-criterion
  - step: 6
    phase: pre-deploy
    action: >-
      Leg C insertion robustness -- inserting a criterion at the head of a bare-string list must
      report exactly one added criterion, not one per downstream sibling whose synthetic index id
      shifted.
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k "LegC or Insertion" -q
    expected: All selected tests pass, exit status 0, and at least one test is selected.
    fix_if: >-
      The insertion fixture reports 7 findings instead of 1 -- the base-versus-head comparison is
      keyed on the synthetic criterion id rather than on criterion text.
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-liveness-legc-text-keyed
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the seven registration surfaces -- the check resolves through the registry, the
      manifest Entry dispatches it, the ci_rca taxonomy carries its row, and it is NOT grandfathered
      into the check-accounting baseline.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q &&
      bin/venv-python -m pytest tests/checks/roadmap/test__manifest.py
      tests/checks/registry/test_manifest_contracts.py -q &&
      grep -q "validate_roadmap_liveness" config/ci_rca_taxonomy.yaml &&
      ! grep -q "validate_roadmap_liveness" config/check_accounting_baseline.yaml
    expected: Tests pass, the taxonomy grep succeeds, the accounting-baseline grep finds nothing, and the chained command exits 0.
    fix_if: >-
      validate_ci_rca_taxonomy reports the registered check absent from function_to_category, or
      validate_check_accounting reports it as undeclared because examined()/skipped() is missing on
      some reachable exit path.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the roadmap transcription landed, still loads under the Pydantic schema, and did not
      change the toxic-SCC count.
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_platform_roadmap.py
      tests/checks/roadmap/test_validate_roadmap_liveness.py -q &&
      bin/venv-python -m scripts.platform_roadmap_liveness --report
    expected: Tests pass, the report again names 2 toxic SCCs and 19 toxic node ids, and the chained command exits 0.
    fix_if: >-
      The roadmap fails to load because until ratified was paired with a tier_item ref rather than a
      candidate_decision, or the toxic count moved off 2, meaning an edge beyond the single licensed
      T2.53 c6 to CD.41 entry was transcribed.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: >-
      Discharge the Closure Obligation -- refresh the read cache from the warehouse and confirm both
      bundled recommendations are closed.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows=[json.loads(l)
      for l in open('logs/.recommendations-log.jsonl')]; assert all(any(r['id']==i and
      r['status']=='closed' for r in rows) for i in ('rec-3394','rec-3395')), 'bundled rec not closed'"
    expected: The sync completes, the assertion holds for both ids, and exit status is 0.
    fix_if: >-
      The assertion raises, meaning a bundled rec is still open. rec-3395 needs its acceptance
      re-pointed at the shipped selector via update_rec before closure, and rec-3394 needs its
      closure evidence recorded rather than being closed bare. Do NOT weaken this back to a
      substring grep: `grep rec-3395 ... | grep -c closed` matches any line CONTAINING the literal,
      and three cache lines mention rec-3395 today (rec-3395, rec-3579, rec-3582), so a follow-on
      rec closing would green the step while the bundled rec stayed open.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Run the fast presubmit tier over the change set.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit status 0 with no FAIL lines in the summary.
    fix_if: >-
      validate_placement reports platform_roadmap_liveness.py as a scripts/ root stray (its
      allowlist entry is missing), or validate_structural_size_limits reports the new config or
      contract file past its class budget. Note validate_pre_glob_closure is ADVISORY by design -- it
      prints findings and never appends to failed -- so it can flag an uncovered import without
      failing this step; read its output even when the tier is green.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: >-
      Run the FULL presubmit tier to discharge handoff_policy.full_validation_required_before_commit
      before any commit or handoff (Decision 163).
    command: bin/venv-python -m scripts.validate
    expected: Exit status 0 with no FAIL lines in the Validation Summary.
    fix_if: >-
      validate_test_coverage reports either new module below 100% line coverage -- the full tier is
      the only tier that runs the whole-file coverage gate, so a branch missed by the fast tier
      surfaces here.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/platform_roadmap_liveness.py
    behavior: >-
      An SCC is toxic iff it holds an internal edge demanding complete of a member; ratified and
      realization-evidence edges never make a ring toxic; NON_TERMINAL admits deferred_post_mvp.
    verification_step: 1
    test_selector: tests/test_platform_roadmap_liveness.py::TestToxicClassification::test_ratified_only_ring_is_benign
    red_green_expectation: >-
      red before (module absent), green after; and red if the until value is ignored so every
      blocked_by edge is treated as completion-demanding.
  - source: scripts/checks/roadmap/validate_roadmap_liveness.py
    behavior: >-
      Leg A(a) fails any MEASURED toxic node id absent from the HEAD baseline, unconditionally and
      independently of the diff base -- the assertion that makes this a liveness gate rather than a
      config-file lint.
    verification_step: 3
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestCoverage::test_new_toxic_node_absent_from_baseline_fails
    red_green_expectation: >-
      red before (no check exists, so a fresh ring passes), green after; and red again if leg A is
      reduced to the baseline-vs-base diff, which is the exact regression this row guards.
  - source: scripts/checks/roadmap/validate_roadmap_liveness.py
    behavior: >-
      Leg B fails a rehome target with no open criterion; leg C fails an added or edited criterion
      naming a blocker with no blocked_by, and is insertion-robust because it keys on criterion text.
    verification_step: 5
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestRehomeCoverage::test_rehome_target_must_carry_open_criterion
    red_green_expectation: >-
      red before (check absent), green after; and red if the check parses the roadmap with
      yaml.safe_load plus isinstance dict, which reports 3 false violations on the live roadmap.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: >-
      The new Entry dispatches validate_roadmap_liveness in both tiers using bare string literals,
      with pre_globs covering its whole transitive first-party import closure.
    verification_step: 7
    test_selector: tests/checks/roadmap/test__manifest.py::TestRoadmapManifest::test_entry_resolves_to_a_callable_named_its_own_attr
    red_green_expectation: red before (Entry absent, check never dispatched), green after.
  - source: config/roadmap_liveness_baseline.yaml
    behavior: >-
      The roster is shrink-only and bounded by the module's frozen _BASELINE_SEED -- an id may be
      removed, but an id absent from that constant can never be admitted by a config edit alone.
    verification_step: 4
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestRatchet::test_unseeded_id_addition_fails
    red_green_expectation: >-
      red before (no ratchet exists, so any baseline edit passes), green after; and red again if the
      frozen-constant cross-check is dropped and only the diff comparison remains.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      T2.53 c6 carries exactly the licensed blocked_by edge to CD.41 until ratified, and that edge
      adds no toxic SCC because a ratified-demanding edge is never completion-demanding.
    verification_step: 8
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestTranscription::test_cd41_ratified_edge_adds_no_toxic_scc
    red_green_expectation: >-
      red if the transcription is written with until complete (a third toxic core appears), green
      with until ratified; pins the semantic distinction the whole discriminator rests on.
  - source: config/ci_rca_taxonomy.yaml
    behavior: validate_roadmap_liveness resolves to the schema_drift failure category.
    verification_step: 7
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q
    waiver_reason: >-
      Coverage is already enforced repo-wide by validate_ci_rca_taxonomy check 1b, which fails any
      registered check absent from function_to_category. A plan-local test would re-assert that
      existing gate against itself rather than guard new behavior; the linked command runs the real
      gate instead.
  - source: docs/contracts/roadmap-liveness.yaml
    behavior: >-
      Class D conformance -- unique subject, an evaluator naming a check that resolves, and a
      top-level amendment_log.
    verification_step: 10
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Contract conformance is enforced repo-wide by validate_contract_drift and the Decision 168
      evaluator-resolution guard, both of which run in the fast tier over this exact file. A
      plan-local unit test would duplicate that engine without adding a distinct assertion.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      Its blocked_by semantics names validate_roadmap_liveness as the field's runtime consumer, so
      the contract stops claiming the consumer is a deferred follow-on once this plan ships it.
    verification_step: 10
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      The edit is a prose re-grounding plus its mandatory amendment_log entry; validate_contract_drift
      enforces amendment-log-on-change repo-wide in the fast tier over this exact file, and no
      deterministic oracle exists for prose truth. A plan-local test would assert a sentence, not a
      behavior.
  - source: docs/contracts/file-router.yaml
    behavior: A route exists whose topic equals the new contract's subject.
    verification_step: 10
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Route-to-subject agreement and the docs-root allowlist are enforced repo-wide by
      validate_placement and the file-router drift check, both of which run in the fast tier over
      this file. The obligation is discharged by running those gates, not by a duplicate test.
  - source: config/agent/verification_registry/entries/roadmap-liveness-measured-toxic-covered-by-baseline.yaml
    behavior: The graduated leg-A primary-assertion check is admitted as a standing regression guard.
    verification_step: 3
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k Coverage -q
    waiver_reason: >-
      The shard is a declarative registry record, not behavior. Its admission is gated by
      validate_verification_registry's differential check, and the assertion it records is VP step 3,
      which the linked command runs directly.
  - source: config/agent/verification_registry/entries/roadmap-liveness-baseline-shrink-only.yaml
    behavior: The graduated baseline shrink-only check is admitted as a standing regression guard.
    verification_step: 4
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_roadmap_liveness.py -k Ratchet -q
    waiver_reason: >-
      The shard is a declarative registry record, not behavior. Its admission is gated by
      validate_verification_registry's differential check, and the assertion it records is VP step 4,
      which the linked command runs directly.
  - source: config/agent/verification_registry/entries/roadmap-liveness-graph-semantics.yaml
    behavior: The graduated graph-semantics check is admitted as a standing regression guard.
    verification_step: 1
    command: bin/venv-python -m pytest tests/test_platform_roadmap_liveness.py -q
    waiver_reason: >-
      The shard is a declarative registry record, not behavior. Its admission is gated by
      validate_verification_registry's differential check against origin/main, and the assertion it
      records is VP step 1, which the linked command runs directly.
  - source: config/agent/verification_registry/entries/roadmap-liveness-rehome-target-carries-open-criterion.yaml
    behavior: The graduated rehome-coverage check is admitted as a standing regression guard.
