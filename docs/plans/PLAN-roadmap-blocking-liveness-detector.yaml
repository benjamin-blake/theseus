rollback: >-
  Delete the check module, its manifest Entry, the ci_rca_taxonomy row, the baseline, the contract
  and its file-router route, and revert the T2.53 c6 blocked_by edit. The graph module is
  import-only and inert once unregistered. Nothing in the roadmap's load path changes, so no data
  migration is involved and the revert is a single commit.
