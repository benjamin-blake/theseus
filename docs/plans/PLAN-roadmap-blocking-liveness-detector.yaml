execution_steps:
  - >-
    Create scripts/platform_roadmap_liveness.py. Public surface: build_blocking_graph(doc) returning
    edges plus a per-edge demand label, toxic_sccs(doc) returning the toxic components, and
    toxic_node_ids(doc) returning the flat sorted id set the baseline keys on. NON_TERMINAL = tier
    items whose status is not_started, in_progress or deferred_post_mvp, plus candidate_decisions
    whose state is pending; every edge with a terminal endpoint is pruned. Edge demands -- depends_on
    and blocked_by until complete demand `complete`; cd.gates, decision_required_before and
    blocked_by until ratified demand `ratified`; the Decision 105 reverse edge from a pending CD to
    each gated item demands `evidence`. Tarjan SCC, then toxic iff an internal edge demands
    `complete`. Add a --report CLI printing the SCC count and the sorted node ids. Never raise on a
    malformed document -- return an empty result and let the caller declare skipped().
  - >-
    Create scripts/checks/roadmap/validate_roadmap_liveness.py, decorated @registry.register with
    owner="platform". Leg A -- compute toxic_node_ids, read config/roadmap_liveness_baseline.yaml at
    HEAD and at the diff base via _marker_guard.default_base_reader, fail on any id present at HEAD
    but absent at base, and additionally fail any HEAD id absent from the in-module frozen
    _BASELINE_SEED; on an unreadable base call registry.skipped and return. Leg B -- for every
    exit criterion whose status is rehomed, resolve met_by and fail unless that item carries at
    least one open criterion; use the normalizing loader, never yaml.safe_load plus isinstance dict.
    Leg C -- parse the base roadmap PER ITEM via TierItem.model_validate (never the whole document,
    whose graph validator can raise on an older base), diff criteria KEYED ON TEXT, and for each
    added or text-changed criterion fail if its text names a NON_TERMINAL id with a blocking phrase
    and carries no blocked_by entry for that ref. Declare registry.examined(...) or
    registry.skipped(...) on every reachable exit path.
  - >-
    Create config/roadmap_liveness_baseline.yaml with the 19 seed ids under an entries key, plus a
    header comment recording -- shrink-only, no marker escape grammar of any kind, bounded by the
    module's frozen _BASELINE_SEED, missing-base SKIP, the owning drain recs rec-3579 and rec-3580,
    and the Decision 159 style reversal condition (if no toxic finding drives a drain within two
    quarters, unwind the ratchet with the check rather than leaving a permanently exempt roster).
  - >-
    Register the Entry in scripts/checks/roadmap/_manifest.py with pre=True and
    full_segment="full_after_lint", using bare string literals. pre_globs must cover the whole
    transitive first-party import closure -- docs/ROADMAP-*, docs/DECISIONS.md,
    docs/DECISIONS_ARCHIVE.md, scripts/decisions_md.py, scripts/platform_roadmap_models.py,
    scripts/platform_roadmap_state.py, scripts/platform_roadmap_gate_rules.py,
    scripts/platform_roadmap_liveness.py, scripts/roadmap/**, scripts/checks/roadmap/**,
    scripts/checks/_common.py, scripts/checks/registry.py, scripts/checks/_marker_guard.py and
    config/roadmap_liveness_baseline.yaml.
  - Add the config/ci_rca_taxonomy.yaml function_to_category row -- validate_roadmap_liveness -> schema_drift.
  - >-
    Create docs/contracts/roadmap-liveness.yaml as a Class D contract. status MUST be
    provisional_v0 -- ratified requires a ratified_via this plan cannot supply (it drafts no
    Decision) and active is pinned by the status_active_max ratchet; plan-obligations.yaml is the
    precedent. The evaluator names validate_roadmap_liveness, and resolution is BY EVIDENCE OF
    READING, not mention -- validate_roadmap_liveness.py (or a one-hop scripts/ import) must carry
    the literal string "roadmap-liveness.yaml" in executable context or
    _population.resolve_evaluator refuses it. Body carries a unique subject, a top-level
    amendment_log, the NON_TERMINAL node-class and edge-demand semantics, the baseline grammar,
    LEG C'S BLOCKING-PHRASE GRAMMAR as the single source the check reads (never a second copy in the
    module) with the precision basis for the chosen phrase set, and the leg-C residual declaration
    naming rec-3581 (Decision 181 clause 2). Cross-reference T2.54 as owner of instruction-layer
    clause-to-check traceability.
  - >-
    Two file-router registrations, both required. (a) The route whose topic equals the contract
    subject. (b) Add platform_roadmap_liveness.py to scripts_root_allowlist.allowed_files, beside
    its three siblings platform_roadmap_models.py, platform_roadmap_state.py and
    platform_roadmap_gate_rules.py -- validate_placement's _scripts_root_stray_files scans EVERY
    tracked depth-1 scripts/ file, not only diff-added ones, so without this the build fails on a
    file the plan itself created.
  - >-
    Add the _CLOSURE_INPUTS row for validate_roadmap_liveness in
    tests/checks/roadmap/test__manifest.py, listing the same closure the Entry's pre_globs cover.
    One row per gated Entry is that dict's stated convention; omitting it leaves the new Entry
    silently uncovered by TestClosureMembersAreCovered.
  - >-
    Edit docs/ROADMAP-PLATFORM.yaml -- add blocked_by [{ref: CD.41, until: ratified, note citing the
    verbatim clause}] to T2.53 c6 ONLY. Do not touch T2.51 c3.
  - >-
    Write tests/test_platform_roadmap_liveness.py and
    tests/checks/roadmap/test_validate_roadmap_liveness.py over synthetic fixtures, including the
    rec-3394 shape (a rehome-out criterion plus a blocked_by until ratified edge to a CD gating the
    rehome source yields no toxic SCC) so the instance survives as a semantic pin rather than a live
    roadmap assertion. Include the bare-string insertion fixture for leg C and the ratchet-teeth
    cases for leg A.
  - >-
    Add the three verification-registry shards under config/agent/verification_registry/entries/ for
    the graduated steps, filenames equal to their check_ids.
  - >-
    Execute the Verification Plan -- run each step, loop until pass; on an unrecoverable failure stop
    and RCA rather than weakening an assertion (Decision 55, Decision 181 clause 1).
  - >-
    Close the bundled recs through the ops portal, re-pointing BOTH dangling acceptance selectors
    first (call get_rec_write_guidance before update_rec, Decision 66). rec-3395 names
    validate_prose_blocking_edges.py and rec-3394 names
    tests/checks/roadmap/test_prose_blocking_edges.py -- neither path this plan ever creates, so each
    must be re-pointed at its shipped selector in
    tests/checks/roadmap/test_validate_roadmap_liveness.py before closure, never closed over a
    dangling oracle. Close rec-3394 citing the T2.51 c3 disclaimer clause, the T2.51 c4
    ratification-precedes-completion clause, the transcription commit, and detector output showing
    T2.51 and T2.53 in no toxic SCC. Never edit logs/ directly.
  - 'Report: what was implemented, verification results, and the final toxic-SCC census.'
