    162). Selection moves into the loop; NO gh call site gains or loses its adjacent exit-status
    capture, and no new gh call is added.
  - >-
    The guard must never assert a literal prefix value. Asserting "agent/" appears would recreate
    the exact rot this plan removes, one string later.
  - >-
    EXPLICITLY OUT OF SCOPE: scripts/verify_ci_workflow.py (decomposed separately at 499/500 SLOC),
    and the RETIREMENT of the signal-green job. This plan WIDENS signal-green's predicate so the
    green wake reaches agent/* PRs; retirement is a later separate change that NO PLAN YET OWNS, so
    rec-3046's verify_ci_workflow.py conjunct routes to a filed carrier rec and not to a named
    plan. CORRECTION, recorded rather than silently fixed: an earlier draft asserted that a sibling
    plan already owned signal-green's retirement and that the cross-site assertion against ci.yml's
    if: would therefore be born dead. No such plan exists. Both claims are struck, ci.yml is in
    scope as a widening, and the cross-site assertion IS built, as VP step 8.
  - >-
    Do NOT edit _BASELINE_SEED in scripts/checks/hygiene/validate_check_accounting.py; the baseline
    is shrink-only and removal from the YAML is the entire legal edit.
  - >-
    rec-3866 NON-INTERFERENCE. Execution step 7 rewrites docs/contracts/git-ops.yaml's
    wake_signals.ci_green_comment, which is open rec-3866's exact surface: its oracle is
    `grep -q "check_suite.completed\\|check_run.completed" ... && ! grep -q "NOT a CI-success
    webhook" ...`, and that banned string sits at git-ops.yaml:196 INSIDE the sentence being
    reworded. rec-3866 is deliberately NOT bundled here -- this plan neither measures nor fixes the
    native-green-wake documentation. So the reword must correct ONLY the prefix premise and must
    leave the "NOT a CI-success webhook" clause and the absence of check_suite.completed exactly as
    found; half-satisfying an open rec's oracle in passing is the rec-3867 defect wearing different
    clothes. If the prefix correction cannot be made without touching that clause, STOP and raise
    it rather than deciding rec-3866's disposition inside this plan.
  - >-
    Widening signal-green is deliberately NOT justified by need: rec-3866 measured native
    check_suite.completed green wakes arriving 2/2, so the comment path is redundant on green, and
    a third and fourth delivery were observed on this plan's own PR. It is widened because it is
    CURRENTLY BROKEN on every agent/* PR and rec-3046 names that conjunct -- a broken surface is
    either fixed or retired, never left broken as a silent no-op. Retirement is the better end
    state and no plan yet owns it; this plan makes the surface honest in the meantime.
  - >-
    Discriminator deferral, recorded rather than buried (plan-critique frame challenge, operator
    direction 2026-09-15): a wake label or body token stamped at PR creation via
    mcp__github__create_pull_request is available TODAY, and declaring the class at the producer is
    the shape Decision 191's own remedy names. It is deferred because this plan is a live-outage
    fix and label self-registration still needs a story for PRs not created through that tool. The
    review trigger is deliberately NOT solely executor unfreeze, which is undated under Decision
    67: revisit at the FIRST of (a) executor unfreeze, (b) any second measured miss of the prefix
    discriminator, or (c) the next change that would add a third consumer of the prefix fact.
  - >-
    Ruff or lint failures in CI that this plan's diff did not introduce -- whole-tree lint
    surfacing a pre-existing violation, or a tool-pin bump landing a new rule -- are OUT OF SCOPE:
    STOP, raise it to the operator, and do not fix inline. The defect class (a ruff bump escaping
    diff-scoped --pre lint because a lockfile-only PR changes no .py files) was live while this
    plan was authored and was closed on main by #1186-#1189, so a recurrence is a signal about that
    machinery, not about this change. Per implement-scope-boundary.yaml an out-of-scope bug becomes
    a recommendation, never an inline fix.
