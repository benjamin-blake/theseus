schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "conflict-wake-prefix-realignment"
intent: >-
  Make the merge-conflict wake fire on every agent-session PR whatever prefix the harness assigns,
  by replacing an invisible jq-side name filter with a declared prefix set the script consumes and
  reports on, and by replacing the existence-only guard that let the previous filter rot silently.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-conflict-wake-prefix-realignment.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed). Trigger is rec-3046's measured outage plus
  rec-3874's live-probe finding. No exit criterion closes, hence closes_criteria stays empty.
scope:
  - file: scripts/ci/pr_conflict_signal.sh
    action: Modify
    purpose: >-
      Declare _WAKE_HEAD_PREFIXES and _WAKE_HEAD_PREFIXES_TRANSITIONAL; move SELECTION out of the
      gh --jq into the script's own loop (--jq keeps projection only); report a per-prefix tally
      naming the unmatched population every run AND mirror that tally to GITHUB_STEP_SUMMARY
      whenever the unmatched population is non-empty; emit a GITHUB_STEP_SUMMARY notice when a
      transitional prefix matches zero open PRs; add the missing --limit. The summary mirror is
      load-bearing, not cosmetic: this job is continue-on-error, so a stdout-only tally is invisible
      in a green run and the NEXT rename would be as silent as this one was. The script's own
      Decision 155 marker rationale (lines 30-33) states the principle -- operator-observable
      instead of buried in a per-run job log.
  - file: scripts/checks/ci_guards/validate_pr_conflict_signal.py
    action: Modify
    purpose: >-
      Replace the existence-only ("claude/" in script_text) row with structural assertions over the
      declaration and its consumption, plus a --limit assertion; adopt the Decision 170
      examined()/skipped() declaration, which editing this baselined module obliges.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Remove the validate_pr_conflict_signal entry (shrink-only ratchet). The frozen _BASELINE_SEED
      in scripts/checks/hygiene/validate_check_accounting.py is deliberately NOT edited.
  - file: tests/checks/ci_guards/test_validate_pr_conflict_signal.py
    action: Modify
    purpose: >-
      Discrimination coverage for the new assertions, including the case the old check could not
      catch: a script whose declaration is absent but whose prose still contains a prefix literal.
  - file: tests/test_pr_conflict_signal_wiring.py
    action: Modify
    purpose: >-
      Behavioural enumeration through the existing gh shim: the sweep polls exactly the declared
      prefixes, skips everything else, and names the unmatched population.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Correct the stale premise at lines 51 and 146 (the harness no longer assigns claude/) while
      preserving Decision 76 clause 2's rule that agents do not create their own branch; keep the
      thin one-line trigger and route the prefix fact to the contract (Decision 86 / T2.56).
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      branching_topology becomes the canonical home for the prefix fact, the declared-set rationale
      and its reversal condition; adds the amendment_log entry the Class D contract owes. The stale
      claude/-only premises at branch_rule, push_pr_ci_merge_flow.steps[0],
      wake_signals.ci_green_comment and wake_signals.merge_conflict are corrected in the same edit,
      and merge_conflict gains the 2026-09-15 probe evidence rec-3874's oracle names.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      Widen the signal-green head_ref predicate from the single claude/ literal to the declared
      prefix set, so the CI-green comment wake fires on agent/* PRs. A WIDENING, not a retirement:
      signal-green keeps running alongside the native check_suite wake until a sibling plan retires
      it. Delivers rec-3046's ci.yml conjunct and makes the cross-site assertion live rather than
      born dead.
  - file: .github/workflows/pr-conflict-signal.yml
    action: Modify
    purpose: >-
      Correct the header and step-name prose at lines 6, 8 and 44, which still describe the workflow
      as polling claude/* only. This file invokes the very script this plan fixes; leaving its own
      description of that script stale is the drift this plan exists to close.
  - file: scripts/preflight/dependabot.py
    action: Modify
    purpose: >-
      Correct the module docstring at line 4, which states pr-conflict-signal.yml polls claude/*
      only. Docstring-only edit, no behaviour surface, so it forces no tier escalation.
bundled_recommendations: ["rec-3046", "rec-3874"]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The sweep polls mergeability for every open PR whose head ref matches a declared prefix and for
    no other PR; its run log names the unmatched prefixes it skipped; and a non-empty unmatched
    population is mirrored to GITHUB_STEP_SUMMARY so it is visible without opening a green job.
  - >-
    The guard fails when the declaration is absent, malformed, unconsumed, or when the transitional
    set is not a subset of the declared set -- and passes none of those on prose alone.
  - >-
    The guard never asserts a literal prefix value, so narrowing the declared set reddens no guard
    assertion. Narrowing is a coordinated edit, not a one-line one: the script declaration, the
    contract key and the ci.yml predicate move together, which VP steps 6 and 8 enforce.
  - >-
    The gh enumeration carries an explicit --limit, so the sweep cannot silently truncate at the
    30-PR default.
  - >-
    validate_pr_conflict_signal declares an examined()/skipped() outcome, is absent from
    config/check_accounting_baseline.yaml, and validate_check_accounting passes.
  - >-
    docs/contracts/git-ops.yaml branching_topology declares the same prefix set the script declares,
    records why a prefix set is used rather than an enumerated universe, and carries the reversal
    condition for the executor-unfreeze namespace collision.
  - >-
    .github/workflows/ci.yml's signal-green predicate admits every declared prefix, so the CI-green
    comment fires on an agent/* PR, and the predicate and the sweep declaration name the same set.
  - >-
    docs/contracts/git-ops.yaml carries no stale claude/-only premise, and
    wake_signals.merge_conflict records the 2026-09-15 conflict-wake probe and its negative result
    -- which is rec-3874's acceptance oracle, delivered rather than assumed.
  - >-
    No surface still describes the conflict sweep as polling claude/* only -- the invoking workflow
    and scripts/preflight/dependabot.py included.
  - >-
    AGENTS.md names no branch prefix outside a .claude/ directory path, no longer forbids agent/,
    and still states that agents work on the harness-assigned branch -- Decision 76 clause 2's rule
    survives the reword that removes its stale premise.
  - The full validation tier completes exit 0 before commit.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: false
    action: The sweep selects exactly the declared prefixes and reports the population it skipped
    command: bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py -k declared_prefixes -q
    expected: all selected tests pass
    fix_if: >-
      Collects nothing today (exit 5), which is the red-before. After implementation a failure means
      the bash selection admitted or dropped the wrong head; assert against the gh call log's
      mergeable: entries, never against stdout prose. NAMING IS LOAD-BEARING, not cosmetic: this
      selector is `-k declared_prefixes` and this is the GRADUATED step, so any test it does not
      select is absent from the standing registry row. The two observability behaviours
      test_obligations[0] calls load-bearing -- the GITHUB_STEP_SUMMARY mirror of a non-empty
      unmatched population, and the transitional-zero retirement notice -- MUST therefore carry
      `declared_prefixes` in their test names (e.g.
      test_declared_prefixes_unmatched_population_mirrored_to_summary). Widening the selector to the
      whole file is NOT the alternative: all 24 tests pass today, so a file-level selector is green
      before implementation and would be classed tautological.
    graduation: graduate
    graduation_check_id: conflict-sweep-selects-declared-prefixes-only
  - step: 2
    phase: pre-deploy
    hermetic: false
    action: The guard rejects a declaration that is absent, malformed, unconsumed, or prose-only
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_pr_conflict_signal.py -k declaration -q
    expected: all selected tests pass
    fix_if: >-
      Collects nothing today (exit 5). The prose-only case is the one the retired check could not
      catch and is mandatory: a fixture whose declaration is stripped but which still contains a
      prefix literal in a log message must FAIL the guard.
    graduation: graduate
    graduation_check_id: conflict-signal-guard-rejects-prose-only-declaration
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: The guard passes on the real script and never hardcodes a prefix value
    command: >-
      bin/venv-python -c "from pathlib import Path;
      import scripts.checks.ci_guards.validate_pr_conflict_signal as m; failed=[];
      m.validate_pr_conflict_signal(failed); assert not failed, failed;
      src=Path(m.__file__).read_text(encoding='utf-8');
      assert 'agent/' not in src and ('claude/' not in src or src.count('claude/') == src.count('.claude/')),
      'guard hardcodes a prefix literal';
      print('GUARD_VALUE_AGNOSTIC_OK')"
    expected: GUARD_VALUE_AGNOSTIC_OK printed, exit 0
    fix_if: >-
      Red before implementation: the module today contains the literal "claude/" at line 171, so the
      second assertion fires. If it fires after implementation the replacement reintroduced the rot
      with a new string -- assert the declaration's shape, never its value.
    graduation: graduate
    graduation_check_id: conflict-signal-guard-asserts-shape-not-value
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: The gh enumeration carries an explicit limit so the sweep cannot truncate silently
    command: >-
      bin/venv-python -c "import re; from pathlib import Path;
      from scripts.checks.ci_guards.validate_pr_conflict_signal import _join_continuations;
      lines=_join_continuations(Path('scripts/ci/pr_conflict_signal.sh').read_text(encoding='utf-8'));
      listing=[l for l in lines if re.search(r'(?:^|\\$\\()\\s*gh\\s+pr\\s+list\\b', l)];
      assert listing, 'no gh pr list call site found';
      assert all(re.search(r'--limit\\s+\\d+', l) for l in listing), listing;
      assert len(listing) == 1, listing;
      print('GH_LIST_LIMIT_OK', len(listing))"
    expected: GH_LIST_LIMIT_OK 1 printed, exit 0
    fix_if: >-
      Red before implementation: the call site carries no --limit, so gh silently caps at 30 and a
      31st open PR is never swept. scripts/ci/branch_cleanup.py already sets 200; match it.
    graduation: graduate
    graduation_check_id: conflict-sweep-gh-list-declares-limit
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: The Decision 170 declaration is adopted and the accounting baseline has shrunk
    command: >-
      bin/venv-python -c "from pathlib import Path;
      from scripts.checks.hygiene import validate_check_accounting as vca;
      import scripts.checks.ci_guards.validate_pr_conflict_signal as m;
      assert vca._module_declares(Path(m.__file__).read_text(encoding='utf-8')),
      'validate_pr_conflict_signal still declares no examined()/skipped() outcome';
      entries=set(vca._load_baseline_entries(Path('config/check_accounting_baseline.yaml').read_text(encoding='utf-8')));
      assert 'validate_pr_conflict_signal' not in entries, 'still baselined';
      failed=[]; vca.validate_check_accounting(failed); assert not failed, failed;
      print('ACCOUNTING_RATCHET_OK')"
    expected: ACCOUNTING_RATCHET_OK printed, exit 0
    fix_if: >-
      Red before implementation: the first assertion fires. The predicate is
      validate_check_accounting's own _module_declares, never a re-implementation, so this step
      cannot drift from the ratchet it proves. Do not edit _BASELINE_SEED -- the baseline is
      shrink-only and removal from the YAML is the whole legal edit.
    graduation: graduate
    graduation_check_id: conflict-signal-guard-accounting-declaration-adopted
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: The contract declares the same prefix set the script declares, with its reversal condition
    command: >-
      bin/venv-python -c "import re, yaml; from pathlib import Path;
      from scripts.checks.ci_guards.validate_pr_conflict_signal import _join_continuations;
      lines=_join_continuations(Path('scripts/ci/pr_conflict_signal.sh').read_text(encoding='utf-8'));
      decl=[l for l in lines if re.match(r'^_WAKE_HEAD_PREFIXES=\\(', l)];
      assert len(decl)==1, decl;
      body=re.search(r'\\((.*?)\\)', decl[0]).group(1);
      script_set=set(re.findall(r'[A-Za-z0-9._-]+/', body));
      bt=yaml.safe_load(open('docs/contracts/git-ops.yaml'))['branching_topology'];
      assert set(bt['agent_branch_prefixes'])==script_set, (bt.get('agent_branch_prefixes'), script_set);
      assert bt.get('agent_branch_prefixes_reversal'), 'no reversal condition recorded';
      print('CONTRACT_MATCHES_SCRIPT_OK', sorted(script_set))"
    expected: CONTRACT_MATCHES_SCRIPT_OK printed with the sorted set, exit 0
    fix_if: >-
      Red before implementation: neither the script declaration nor the contract key exists. After
      implementation a mismatch means the contract and the script drifted -- the contract is the
      declared universe's published half and must equal the enforced half exactly.
    graduation: graduate
    graduation_check_id: git-ops-branching-prefixes-match-sweep-declaration
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: Every presence-of-wording assertion -- the surviving rule, rec-3874's probe evidence, rec-3866 non-interference
    command: >-
      bin/venv-python -c "import re; from pathlib import Path;
      a=Path('AGENTS.md').read_text(encoding='utf-8');
      g=Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8');
      pat=r'not create (an |a )?.?agent/';
      assert not re.search(pat, a, re.I), 'AGENTS.md still forbids agent/';
      assert not re.search(pat, g, re.I), 'git-ops.yaml still forbids agent/';
      bad=[(i, l.strip()) for i, l in enumerate(a.splitlines(), 1)
      if 'claude/' in l and '.claude/' not in l];
      assert not bad, bad;
      assert 'harness-assigned' in a, 'AGENTS.md no longer states agents work on the harness-assigned branch';
      assert 'conflict-wake-probe' in g, 'probe evidence absent (rec-3874 oracle)';
      assert 'no native wake' in g, 'probe result absent (rec-3874 oracle)';
      assert 'NOT a CI-success webhook' in g, 'rec-3866 non-interference: its oracle string was removed';
      assert 'check_suite.completed' not in g, 'rec-3866 non-interference: its oracle token was introduced';
      print('WORDING_AND_NONINTERFERENCE_OK')"
    expected: WORDING_AND_NONINTERFERENCE_OK printed, exit 0
    fix_if: >-
      Exits 1 today, which is the pre-state. Decision 76 clause 2's RULE must survive the reword --
      the replacement must still say agents work on the harness-assigned branch and do not create
      their own; only the claude/ premise is corrected.
    graduation: waive
    graduation_waiver_reason: >-
      The graduation line this plan draws, stated once and now APPLIED rather than merely stated:
      STRUCTURAL ABSENCE of a token class graduates (steps 9 and 10 -- no claude/ occurrence
      survives outside a .claude/ path or a declared prefix VALUE; reword-proof, so a standing
      registry row over it is durable). PRESENCE of specific wording waives. Round 3 caught step 9
      violating this rule while step 7's waiver stated it: step 9 carried two English-phrase
      assertions ('conflict-wake-probe', 'no native wake') beside its structural sweep. Those moved
      HERE, so this step is now the single home for every presence-of-wording assertion -- the
      surviving harness-assigned rule, rec-3874's probe evidence, and rec-3866's two-sided
      non-interference -- and step 9 is pure structure. Waived because a standing row over English
      phrases inside a folded scalar this plan is itself rewording would redden on any re-wrap. The earlier claim that vp-red-before's negated-sweep lint makes it ineligible was
      wrong and is struck: that lint is not gated to graduate and fires only when the negated path
      is absent, whereas both paths here exist.
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: The signal-green predicate admits exactly the prefixes the sweep declares
    command: >-
      bin/venv-python -c "import re; from pathlib import Path;
      from scripts.checks.ci_guards.validate_pr_conflict_signal import _join_continuations;
      lines=_join_continuations(Path('scripts/ci/pr_conflict_signal.sh').read_text(encoding='utf-8'));
      decl=[l for l in lines if re.match(r'^_WAKE_HEAD_PREFIXES=\\(', l)];
      assert len(decl)==1, decl;
      body=re.search(r'\\((.*?)\\)', decl[0]).group(1);
      script_set=set(re.findall(r'[A-Za-z0-9._-]+/', body));
      q=chr(39);
      ci=Path('.github/workflows/ci.yml').read_text(encoding='utf-8');
      job=[l for l in ci.splitlines() if 'startsWith(github.head_ref' in l];
      assert job, 'no head_ref predicate found in ci.yml';
      ci_set=set(re.findall('head_ref, *'+q+'([A-Za-z0-9._-]+/)'+q, ' '.join(job)));
      assert ci_set==script_set, (sorted(ci_set), sorted(script_set));
      print('CI_PREDICATE_MATCHES_DECLARATION_OK', sorted(ci_set))"
    expected: CI_PREDICATE_MATCHES_DECLARATION_OK printed with the sorted set, exit 0
    fix_if: >-
      Red before implementation: the script declares nothing, so the first assertion fires. After
      implementation a mismatch means one wake consumer was widened without the other -- which is
      exactly the drift that produced this outage. This is a WIDENING; retiring signal-green is a
      separate later change and must not be done here.
    graduation: graduate
    graduation_check_id: ci-signal-green-predicate-matches-sweep-declaration
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The contract carries no claude/ occurrence outside a .claude/ path or a declared prefix value
    command: >-
      bin/venv-python -c "import yaml; from pathlib import Path;
      d=yaml.safe_load(Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8')) or {};
      bt=d.get('branching_topology') or {};
      assert bt.get('agent_branch_prefixes'), 'branching_topology.agent_branch_prefixes not declared';
      walk=lambda n, p: ([x for k, v in n.items() for x in walk(v, p + [str(k)])] if isinstance(n, dict)
      else [x for v in n for x in walk(v, p)] if isinstance(n, list)
      else [(p, n)] if isinstance(n, str) else []);
      bad=[(p, s) for p, s in walk(d, [])
      if 'claude/' in s.replace('.claude/', '')
      and not any(k.startswith('agent_branch_prefixes') for k in p)];
      assert not bad, bad;
      print('GIT_OPS_PREFIX_STRUCTURAL_OK')"
    expected: GIT_OPS_PREFIX_STRUCTURAL_OK printed, exit 0
    fix_if: >-
      Red before implementation: branching_topology declares no prefix set, so the first assertion
      fires. AUTHORING CONSTRAINT, stated because round 4 found it latent: this walks PARSED YAML
      VALUES keyed by path, not raw lines, so block vs flow sequence style is irrelevant (an earlier
      line-based version silently REQUIRED block style and would have reddened on
      `agent_branch_prefixes: ["agent/", "claude/"]`). What it does still require: no string value
      anywhere in the contract outside the agent_branch_prefixes* keys may contain claude/ -- so the
      new _rationale and _reversal text, the reworded merge_conflict evidence and the amendment_log
      entry must refer to the declared set rather than repeating the literal. REWRITTEN in round 2 after the gate proved the previous phrase-list version broken:
      it embedded backticks inside a double-quoted shell string, so command substitution mangled
      the fourth phrase to 'harness-assigned ' -- a substring the CORRECTED contract still
      contains, which would have left this graduate step permanently red and frozen that command
      into a standing registry row. Note what this means about red-before: it classified the broken
      command assertion_failed, because a broken command is red before AND after. The replacement
      is STRUCTURAL, not editorial -- every claude/ occurrence must be either a .claude/ directory
      path or a DECLARED prefix value, so it is order-independent and survives any reword.
    graduation: graduate
    graduation_check_id: git-ops-carries-no-stale-prefix-premise
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: No surface still describes the conflict sweep as polling claude/* only
    command: >-
      bin/venv-python -c "from pathlib import Path;
      paths=['.github/workflows/pr-conflict-signal.yml', 'scripts/preflight/dependabot.py'];
      bad=[(p, i+1, l.strip()) for p in paths
      for i, l in enumerate(Path(p).read_text(encoding='utf-8').splitlines())
      if 'claude/' in l and '.claude/' not in l];
      assert not bad, bad; print('NO_STALE_SWEEP_PREMISE_OK')"
    expected: NO_STALE_SWEEP_PREMISE_OK printed, exit 0
    fix_if: >-
      Red before implementation: pr-conflict-signal.yml lines 6, 8 and 44 and dependabot.py line 4
      all still say claude/. This is the Decision-191 / 12k stale-reference sweep, and it is a
      POSITIVE file-content assertion over paths that exist, not a negated path sweep, so the
      negated-sweep lint does not apply. ci.yml is deliberately excluded -- step 8 owns it, and its
      predicate legitimately names claude/ as a declared transitional prefix.
    graduation: graduate
    graduation_check_id: no-surface-describes-sweep-as-claude-only
  - step: 11
    phase: pre-deploy
    hermetic: false
    action: The pre-existing suites over the touched surfaces still pass
    command: >-
      bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py
      tests/checks/ci_guards/test_validate_pr_conflict_signal.py -q
    expected: all tests pass
    fix_if: >-
      Distinguish two causes before touching anything. (a) MANDATED MIGRATION: the gh projection
      gains headRefName, so the 8 two-column "list" control maps in tests/test_pr_conflict_signal_wiring.py
      (lines 207, 230, 254, 272, 289, 315, 345, 374) go from TSV arity 2 to 3, and the guard suite's
      _VALID_SCRIPT (line 49) and test_missing_claude_filter_fails (line 199) carry hardcoded
      claude/ literals that must move. ALSO MANDATED, and easy to misdiagnose: three existing
      assertions at tests/test_pr_conflict_signal_wiring.py:244 (TestRetryOnFailedCall), :262
      (TestUnknownNeverFalseWakes) and :320 (TestMarkerEmission) assert summary_text == "". A
      fixture migrated to agent/-only heads makes the transitional prefix claude/ match zero, which
      FIRES the retirement notice this plan mandates, so those three assertions must be updated to
      expect it. Note :244 sits in TestRetryOnFailedCall -- do NOT read that failure as a retry
      regression under (b); it is this change working as designed. Migrate all of these -- they are
      part of this change, not a regression. (b) REGRESSION: a failure in the retry or exit-status cases means the selection
      move disturbed the load-bearing errexit and bounded-retry semantics (rec-2735). There, and
      only there, fix the move and never the test.
    graduation: waive
    graduation_waiver_reason: >-
      Green on the pre-implementation tree, so graduating it would be a false graduate that the
      red-before replay classes tautological and hard-fails on this plan's own PR. The genuinely new
      behaviour is graduated precisely as steps 1 and 2.
  - step: 12
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green end to end
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      validate_check_accounting, validate_pr_conflict_signal and the prose gates all read state this
      plan moves, so a half-applied change reddens here rather than at a narrower step. CHECK
      validate_prose_limits FIRST on a red here: S1 root_ambient_load_set has ONE byte of headroom
      (18942 of 18943, config/prose_budgets.yaml:36), so any net-additive AGENTS.md reword fails
      this step and the cause is the byte budget, not the logic.
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate, which the graduate partition refuses statically at plan-PR time as a
      recursion hazard. Not not-applicable -- it is a single command_exit_zero shape.
  - step: 13
    phase: pre-deploy
    hermetic: false
    action: Full validation tier completes exit 0 before handoff
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      handoff_policy.full_validation_required_before_commit is true, and validate_handoff_full_tier
      fails any plan declaring it without a full-tier step. Step 12 does not satisfy it.
    graduation: waive
    graduation_waiver_reason: Same recursion refusal as step 12, over the full tier rather than the fast one.
  - step: 14
    phase: post-deploy
    action: rec-3046 and rec-3874 are closed, and their acceptance oracles passed rather than being assumed
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json, subprocess;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()];
      by={r['id']: r for r in rows}; ids=['rec-3046', 'rec-3874'];
      open_ids=[(i, by[i]['status']) for i in ids if by[i]['status'] != 'closed'];
      assert not open_ids, open_ids;
      rcs=[(i, subprocess.run(['bash', '-c', by[i]['acceptance']]).returncode) for i in ids];
      assert all(rc == 0 for _, rc in rcs), rcs;
      print('RECS_CLOSED_AND_ORACLES_PASS_OK')"
    expected: RECS_CLOSED_AND_ORACLES_PASS_OK printed, exit 0
    fix_if: >-
      If either is still open the Resolves trailer was omitted from the squash body. If rec-3046
      closed while its oracle still names a conjunct this plan does not deliver, that is the
