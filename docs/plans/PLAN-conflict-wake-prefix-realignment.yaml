rollback: >-
  Revert the squash-merge commit EXCEPT TWO hunks, which must BOTH be retained: (1) the
  config/check_accounting_baseline.yaml removal, and (2) the registry.examined()/skipped()
  declaration added to scripts/checks/ci_guards/validate_pr_conflict_signal.py. Everything else --
  the sweep's selection change, the guard's assertions, the ci.yml predicate, the prose -- reverts
  cleanly. Nothing deploys.
  This field has been WRONG TWICE and the history is kept because each error is instructive.
  (a) The first draft claimed the baseline "is shrink-only forward, so a revert restores the entry
  rather than growing it". False: validate_check_accounting leg (c) (:231-243) computes
  grown = current_baseline - base_baseline against origin/main, and post-merge origin/main no longer
  carries the entry, so re-adding it FAILS "an entry may be removed, never (re-)added".
  (b) Round 3 fixed (a) by exempting only the baseline line, and thereby created a leg (a) failure:
  a revert of the squash-merge reverts the DECLARATION too, leaving the module undeclared AND
  unbaselined. VERIFIED by simulating that exact state and running the real check -- leg (a)
  (:212-220) fails with "validate_pr_conflict_signal: declares no examined()/skipped() outcome and
  is not in config/check_accounting_baseline.yaml". Round 3's own text was self-contradictory,
  asserting both that "the guard [returns] to its prior row" and that it "keeps its declaration".
  Only ONE post-rollback state is legal: declared AND unbaselined. Leg (a) passes because the
  module declares; leg (c) passes because the baseline did not grow.
