schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "step-functions-executor-host"
intent: >-
  Route rec-3386's strategy-session positions into governance and re-frame the autonomous executor so
  that Step Functions is a HOST of the per-rec loop rather than the loop's DEFINITION: the definition
  becomes a repo-owned ASL-subset document rendered from a typed Python builder, executed natively by
  Step Functions in the operator's cloud tier and, post-MVP, by a repo-owned interpreter in an open-core
  free tier that runs on user-owned substrate with no Theseus cloud. Two numbered Decisions carry it
  (184 the open-core boundary and its policies; 185 the loop definition and the staged leash).
  Governance and roadmap encoding only -- no kernel code lands here.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-step-functions-executor-host.yaml
phase: >-
  Platform T4 (executor). Governance precursor that re-scopes T4.1 to the Step Functions host and
  T4.15 to persona-compute hosts, and adds the loop-definition items (T4.19, T4.20), the boundary
  guard (T4.21) and the deferred platform-packaging items (T4.22-T4.24) that T4.1 and T4.15 now
  sequence behind.
fallback_reevaluation:
  reevaluated_on: "2026-09-04"
  substrate_status: >-
    CD.27's layer-2 incumbent (Lambda Durable Functions) remains the incumbent. This plan moves the
    layer-1 DEFINITION into the repository and re-scopes the T4.15 spike to persona-compute hosts under
    that fixed definition; it selects no layer-2 substrate and CD.43's store stays TBD. The T4.15 spike
    has not run.
  verdict: continue_on_current_substrate
  basis: >-
    No Lambda Durable Functions API-semantics regression is recorded and the unplanned_resume_rate
    signal has no data (no persona has executed). The fallback_spec's lapse_condition fires only if the
    Q5 spike pins a non-replay layer-2 substrate; the spike is re-scoped here, not run, so neither the
    trigger nor the lapse has fired and the obligation carries forward unchanged.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Two new numbered Decisions (184 and 185 at drafting; re-checked at implement time): 184 records
      the open-core local-first boundary, the substrate port rule with its North Star reading, the
      Actions workload class, the credential policy and the licence dependency; 185 records the loop
      model (ASL subset, two engines, Python), the scoped Decision 39 narrowing and Decision 100
      reading, the staged leash and the GitHub App merge identity, plus the options considered. Each
      carries its own envelope and monitored reversal stanza. Dated append-only annotations on Decision
      39 (scoped to the cloud host) and Decision 117 (boundary mechanism amended) point at 184.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by scripts.decisions_index --write after the DECISIONS.md edit (never hand-edited, Decision 160/179).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      north_star NS.3 and NS.5 detail amendments; CD.27 layer-1 wording plus a free-tier-host
      discipline point and the hosted_cli_runner elimination annotation; CD.43 elimination note; CD.44
      GOV-2 amendment; T4.1 re-scoped to the Step Functions host with the App credential criterion
      referencing T4.21; T4.10a and T4.11 re-pointed at the loop definition with the hard-ceiling
      criterion; T4.15 re-scoped to persona-compute hosts; T4.16 c11 consumes the boundary-guard check;
      T4.9 c1 and T4.9a c1 substrate-neutral (rec-3226); T4.8, T4.9a and T3.10 re-homed off the frozen
      Life-1 tree (rec-3219); T2.11b c5 wording; new items T4.19-T4.24.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Decision 117 boundary_patterns gain the loop kernel path, the rendered ASL, the persona and
      loop-policy contracts, config/agent/executor/personas.yaml, .github/CODEOWNERS, the leash's own implementation (executor_boundary_guard, underscore spelling) and scripts/checks/executor/, so no rec targeting them ever derives automatable.
  - file: config/agent/verification_registry/entries/roadmap-t4-containment-resequence-invariants.yaml
    action: Modify
    purpose: >-
      Graduated shard that pins T4.10a and T4.11 depends_on by equality; re-pinned in the same commit to
      the edges this plan re-points (T4.10a -> [T1.12]; T4.11 -> [T4.1, T4.10a, T4.19]) so VP 1's
      registry replay stays green. Re-pinning a graduated equality to the new edges is not a CONTENT
      weakening: the check still pins by equality.
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: Behavioral test that compute_automatable returns False for every new boundary path (red on origin/main for the non-Python paths).
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Executor end-state and critical-path wording to definition/host framing and a refreshed roadmap_tier_id_set stamp, within the 14,032-byte S8 budget.
  - file: README.md
    action: Modify
    purpose: Autonomous Executor and Lambda Tooling Platform rows reworded to definition/host framing (Decision 111 curated portal).
  - file: .secrets.baseline
    action: Modify
    purpose: >-
      TRANSITIONAL, hand-tracked pending PLAN-secrets-baseline-sanction-row (#1076, rec-3570). Regeneration
      companion of the docs/ROADMAP-PLATFORM.yaml row: the detect-secrets pre-commit hook re-serialises the
      baseline's four roadmap entries (hex-entropy met_by values at lines 4748, 4785, 4827 and 7122 today,
      all below the north_star, CD.27, CD.43, CD.44 and T2.11b edit sites) with shifted line_number fields
      and a new generated_at; no hashed_secret, filename or type changes. implement-scope-boundary.yaml still
      lists .secrets.baseline under unmodelled_companions, so the row is declared here as
      PLAN-glue-delete-database-grant did; if #1076's sanction row has merged by implement time the row is
      redundant and harmless. Step 22 proves the diff is line-number-only.
bundled_recommendations: [rec-3386, rec-3226, rec-3219]
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - Two numbered Decisions exist, one titled with 'Open-core local-first platform' and one with 'repo-owned ASL-subset definition', each under 6,144 bytes with a bare yaml envelope claiming significance numbered_decision, and the union of their text carries every clause phrase step 2 names plus rec-3386's own acceptance patterns.
  - Decision 39 and Decision 117 each carry a dated '> **Amended by Decision N (DATE):**' annotation pointing at the loop-definition Decision, with their original text untouched (Decision 177 append-only).
  - docs/decisions-index.json is fresh (scripts.decisions_index --check exits 0).
  - CD.27 layer 1 is headed 'Loop definition' and names the ASL subset and the cloud-tier host; a discipline point records the free-tier host as a scoped Decision 39 supersession; the ESB-04 clause stays verbatim; hosted_cli_runner's elimination is annotated on the pinned set, on CD.43 and in CD.44; north_star NS.3 and NS.5 carry the cloud-tier reading; the ten named registry shards replay green (step 24) and every citation this plan adds resolves to the two minted entries (step 23).
  - T4.1 is re-scoped to render-and-deploy with its four persona-node typing lines and bare-string criteria preserved, depends on T4.19, T4.20 and T4.21, and its credential criterion pins a GitHub App absent from bypass_actors whose live probe is owned by T4.21 c3.
  - T4.15 lists four arms with hosted_cli_runner eliminated, runs arm-zero on the T4.20 oracle, depends on T4.19 and T4.20, and c10 records the Actions workload-class ruling including the reselling-clause note.
  - T4.19, T4.20, T4.21 exist not_started and T4.22, T4.23, T4.24 exist deferred_post_mvp, with no live item depending on a deferred one and no mechanism vocabulary in their lifecycle fields; T4.16 depends on T4.21.
  - rec-3226's and rec-3219's acceptance commands pass on the edited roadmap, and T3.10 declares no path under scripts/executor/.
  - compute_automatable returns False for the new boundary paths; the roadmap stays under 10,000 lines; PROJECT_CONTEXT.md stays at or under 14,032 bytes with a fresh tier-id stamp; README rows no longer describe Step Functions as the loop.
  - The full presubmit tier passes; rec-3386, rec-3226 and rec-3219 close via the Resolves trailer on merge; the two follow-on recs for rec-3386 items (5) and (6) exist in the warehouse.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier (Decision 163 checked pre-handoff run). Roadmap schema and graph, Decision 93 edges, decision-entry conformance, size cap, index freshness, prose budgets and supersession annotations all gate here; the registry replay differential-gates the diff-modified containment shard and this plan's own new shards only (validate replays diff-added and diff-modified shards, never unmodified ones), so VP 6, 7, 8 and 10's preservation legs are what guard the CD.27, CD.43 and T4.1 pins this plan touches.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      validate_decisions_size FAIL on a new entry means a clause must be tightened, never a raise.
      validate_supersession_annotations FAIL means a victim (39 or 117) lacks its pointer annotation.
      validate_decisions_index_freshness FAIL means regenerate with --write. A cd27-* or cd43-*
      registry FAIL means a pinned phrase or block was edited rather than annotated -- restore it.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      BOTH NEW DECISIONS EXIST, ARE ENVELOPED, FIT THE CAP, AND TOGETHER CARRY EVERY CLAUSE AND
      rec-3386's OWN ACCEPTANCE PATTERNS. Entries are located by TITLE so the assertion survives the
      numbering race; the phrase set is asserted over the UNION of the located entries; the fence is
      built from chr(96) so the command is shell-safe. Red on origin/main (no such title exists).
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      r=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8');
      es=[m for m in re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if
      ('Open-core local-first' in m.group(2)) or ('repo-owned ASL-subset definition' in m.group(2))];
      assert len(es)>=2, f'expected the open-core AND the loop-definition Decision entries, found {[m.group(1) for m in es]}';
      fence='^'+chr(96)*3+'yaml'; probs=[];
      [probs.append('Decision '+m.group(1)+' lacks a bare yaml envelope with number '+m.group(1)) for m in es
      if not re.search(fence+r'\s*\nnumber: '+m.group(1)+r'\b', m.group(0), re.M)];
      [probs.append('Decision '+m.group(1)+' envelope lacks value: numbered_decision') for m in es if 'value:
      numbered_decision' not in m.group(0)]; [probs.append('Decision '+m.group(1)+' is
      '+str(len(m.group(0).encode('utf-8')))+' bytes, over the 6144 cap') for m in es if
      len(m.group(0).encode('utf-8'))>6144]; assert not probs, probs; body='\n'.join(m.group(0) for m in es);
      need=['user-owned substrate','named port','waitForTaskToken','GitHub App','bypass_actors','verdict
      plane','persona compute','LiteLLM','Additional Use Grant','separate repository','Options
      considered','yaml reversal-conditions','amends Decision 39','amends Decision 117','Decision 100','Decision
      75','Decision 178','free tier','Step Functions','restart-tolerant','T4.19','T4.21','T4.24','NS.3','NS.5','reselling'];
      miss=[p for p in need if p not in body]; assert not miss, f'open-core/loop Decision text missing {miss}';
      assert re.search(r'general.computing|actions.abuse', t+r, re.I) and re.search(r'subscription.oauth|consumer.subscription', t+r, re.I), 'rec-3386 acceptance patterns absent';
      print('OK', [m.group(1) for m in es])"
    expected: "OK ['184', '185'] (numbers shift together under the numbering race; step 23 guards the citations)."
    fix_if: A missing phrase means a clause was dropped or paraphrased; an over-cap entry means tighten that entry's prose; a missing envelope means the fenced yaml block is not immediately after the heading.
    hermetic: true
    graduation: graduate
    graduation_check_id: open-core-loop-definition-decision-clauses
  - step: 3
    phase: pre-deploy
    action: DECISION 39 IS SCOPED BY APPENDED ANNOTATION, NOT EDITED. Red on origin/main (Decision 39 carries only a 2026-08-02 Update line).
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 39:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 39 missing';
      b=m.group(0); a=[l for l in b.splitlines() if re.match(r'> \*\*Amended by Decision \d+
      \(\d{4}-\d{2}-\d{2}\):\*\*', l)]; assert a, 'Decision 39 carries no dated Amended-by annotation';
      l=a[-1]; miss=[w for w in ('scoped','cloud','free-tier','Custom DAG engine','sole cloud-tier') if w not in
      l]; assert not miss, f'Decision 39 annotation missing {miss}'; assert 'Rejected. Step Functions IS a
      managed DAG engine' in b, 'the original rejected-alternative text was edited, not annotated (Decision 177
      append-only)'; print('OK')"
    expected: OK
    fix_if: The annotation must be one appended blockquote line in the pinned '> **Amended by Decision N (DATE):**' form naming all five words; never rewrite the 2026 body.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec39-scoped-to-cloud-host-annotation
  - step: 4
    phase: pre-deploy
    action: DECISION 117'S ENFORCEMENT MECHANISM IS AMENDED BY APPENDED ANNOTATION. Red on origin/main.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 117:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 117 missing';
      b=m.group(0); a=[l for l in b.splitlines() if re.match(r'> \*\*Amended by Decision \d+
      \(\d{4}-\d{2}-\d{2}\):\*\*', l)]; assert a, 'Decision 117 carries no dated Amended-by annotation';
      l=a[-1]; miss=[w for w in ('bypass_actors','src/executor_loop/','docs/contracts/personas/','.github/CODEOWNERS','scripts/checks/executor/','rec-3218','GitHub App') if w not in l]; assert not miss, f'Decision 117 annotation missing {miss}'; assert 'is unchanged from
      Decision 44' in b, 'original enforcement line edited rather than annotated'; print('OK')"
    expected: OK
    fix_if: Same append-only rule as step 3; the annotation must name every new pattern class and the non-bypass identity invariant.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec117-boundary-amended-for-loop-kernel
  - step: 5
    phase: pre-deploy
    action: The decisions index is regenerated, not hand-edited. Red between adding the entries and running --write; green after.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0.
    fix_if: Run `bin/venv-python -m scripts.decisions_index --write` and commit the result.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the standing validate_decisions_index_freshness check registered in both validate tiers; a second registry slot would run the same freshness comparison twice.
  - step: 6
    phase: pre-deploy
    action: >-
      CD.27 LAYER 1 IS THE LOOP DEFINITION HOSTED ON STEP FUNCTIONS, WITH EVERY PINNED PHRASE PRESERVED.
      Presence legs are red on origin/main ('1. Loop definition', the scoped-supersession point, the
      elimination annotation); preservation legs guard the phrases the cd27-* registry checks and the
      grep_count check pin.
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.27'][0]; det=cd['detail'];
      assert re.search(r'^\s*1\. Loop definition', det, re.M), 'CD.27 layer 1 is not headed Loop definition';
      assert 'ASL' in det and 'cloud-tier host' in det, 'layer 1 does not name the ASL subset and the cloud-tier host';
      assert 'NOT an in-executor escape-hatch task' in det, 'escape-hatch phrase lost';
      assert 'Native Parallel state fans out critic personas' in det, 'native-construct sentence lost';
      pts=[p for p in cd['discipline_points'] if isinstance(p,str)];
      assert any(('scoped supersession' in p and 'Decision 39' in p and 'free-tier' in p) for p in pts), 'no discipline point records the free-tier host as a scoped Decision 39 supersession';
      assert any((p.startswith('Layer-2 ratification precondition (ESB-04)') and 'MANAGED orchestration primitive' in p) for p in pts), 'ESB-04 clause no longer verbatim';
      assert any(('hosted_cli_runner' in p and 'eliminated' in p) for p in pts), 'hosted_cli_runner elimination not annotated on the pinned set';
      fsp=[p for p in cd['discipline_points'] if isinstance(p,dict) and 'fallback_spec' in p]; assert len(fsp)==1 and 'eliminated' in fsp[0]['fallback_spec']['lapse_condition'], 'fallback_spec.lapse_condition still names hosted_cli_runner as a live example';
      print('OK')"
    expected: OK
    fix_if: A lost phrase means restore the original text and add the amendment as a bracketed dated note beside it instead of rewording it.
    hermetic: true
    graduation: graduate
    graduation_check_id: cd27-layer1-definition-hosted-on-step-functions
  - step: 7
    phase: pre-deploy
    action: CD.44 GOV-2 CARRIES THE COMPUTE-PLANE RE-MAPPING AS A BRACKETED AMENDMENT NAMING THE RESIDUAL LITERAL SITES. Red on origin/main (CD.44 has no '[Amendment' text).
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.44'][0]; det=cd['detail'];
      m=re.search(r'GOV-2.*?\[Amendment[^\]]*\]', det, re.S);
      assert m and 'long_running_container' in m.group(0) and 'hosted_cli_runner' in m.group(0) and 'cost_projection' in m.group(0) and 'lapse_condition' in m.group(0), 'CD.44 GOV-2 carries no bracketed amendment re-mapping the compute plane onto the container arm and naming the residual cost_projection sites';
      assert 'The candidate selects nothing' in str(cd['discipline_points']), 'selects-nothing discipline lost';
      print('OK')"
    expected: OK
    fix_if: Append the bracketed amendment after the GOV-2 paragraph; never rewrite GOV-1 or the selects-nothing discipline.
    hermetic: true
    graduation: graduate
    graduation_check_id: cd44-gov2-compute-plane-container-arm
  - step: 8
    phase: pre-deploy
    action: >-
      T4.1 IS THE STEP FUNCTIONS HOST. Presence legs (render, committed, rendered-ASL path, T4.19/T4.20/T4.21
      edges, oracle-trace criterion, App credential criterion owned by T4.21 c3) are red on origin/main;
      preservation legs keep the four persona-node typing lines the t4x-persona-contracts-mechanism-word-free
      check counts and the bare-string criteria shape.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']}; t=ti['T4.1'];
      assert 'render' in t['intent'] and 'committed' in t['intent'], 'T4.1 intent not re-scoped to render-and-deploy';
      nodes=[l for l in t['intent'].splitlines() if '[' in l and 'T4.2]' in l]; assert len(nodes)==4, nodes;
      fs=' '.join(map(str,t['files_in_scope'])); assert 'src/executor_loop/rendered/executor_loop.asl.json' in fs, 'rendered ASL not in T4.1 files_in_scope';
      assert {'T4.19','T4.20','T4.21'}<=set(t['depends_on']), t['depends_on'];
      ec=t['exit_criteria']; assert all(isinstance(c,str) for c in ec), 'T4.1 criteria must stay bare strings';
      assert 'T4.20' in ec[0] and 'trace' in ec[0], ec[0];
      cred=[c for c in ec if 'GitHub credential model' in c];
      assert len(cred)==1 and all(w in cred[0] for w in ('GitHub App','bypass_actors','rec-2827','T4.21 c3')), 'credential criterion not pinned to a non-bypass App owned by T4.21 c3';
      print('OK')"
    expected: OK
    fix_if: If the node count is not 4 the state-machine shape block was edited -- restore it verbatim; if criteria became objects revert to bare strings.
    hermetic: true
    graduation: graduate
    graduation_check_id: t41-rescoped-to-step-functions-host
  - step: 9
    phase: pre-deploy
    action: T4.10a PRECEDES THE DEFINITION AND T4.11 IS DEFINITION-CARRIED WITH HARD CEILINGS AND THE ALIGNED TERRAFORM FILENAME; the containment shard is re-pinned to the same edges in the same commit (VP 1 replays it). Red on origin/main.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']};
      assert ti['T4.10a']['depends_on']==['T1.12'], ti['T4.10a']['depends_on'];
      assert 'T4.10a' in ti['T4.19']['depends_on'], ti['T4.19']['depends_on'];
      t=ti['T4.11']; assert 'T4.19' in t['depends_on'], t['depends_on'];
      ec={c['id']:c['text'] for c in t['exit_criteria']};
      assert 'c6' in ec and 'raise-approved' in ec['c6'], ec.get('c6');
      assert 'loop definition' in ec['c2'] and 'Step Functions state machine enforces' not in ec['c2'], ec['c2'];
      assert 'enforced by Step Functions state (not by' not in t['intent'], 'T4.11 intent still definition-in-Step-Functions shaped';
      fs=' '.join(map(str,t['files_in_scope'])); assert 'executor_step_functions.tf' in fs and 'executor_state_machine.tf' not in fs, fs;
      print('OK')"
    expected: OK
    fix_if: Re-point the edges, reword c2 and the intent, align the terraform filename to T4.1's, add c6 as an ExitCriterion object with status open; if VP 1's registry replay fails on roadmap-t4-containment-resequence-invariants, the shard's two pinned lists differ from the YAML order written -- align them.
    hermetic: true
    graduation: graduate
    graduation_check_id: t410a-t411-repointed-to-loop-definition
  - step: 10
    phase: pre-deploy
    action: T4.15 COMPARES PERSONA-COMPUTE HOSTS UNDER A FIXED DEFINITION AND c10 KEEPS THE RESELLING NOTE. Red on origin/main (hosted_cli_runner is an arm, no arm-zero, no T4.19 edge, c10 argues proportionality).
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']}; t=ti['T4.15']; it=t['intent'];
      hits=[m.start() for m in re.finditer('hosted_cli_runner', it)];
      assert hits and all(re.search(r'eliminat|removed', it[max(0,h-240):h+240]) for h in hits), 'T4.15 still lists hosted_cli_runner as an arm';
      assert 'T4.19' in t['depends_on'] and 'T4.20' in t['depends_on'], t['depends_on'];
      ec={c['id']:c['text'] for c in t['exit_criteria']};
      assert 'persona compute' in ec['c10'] and 'verdict plane' in ec['c10'] and 'reselling' in ec['c10'], ec['c10'];
      assert 'DISTINCT WORKFLOW RUNS' in ec['c9'], 'c9 formulation lost'; assert 'eliminated' in ec['c1'], 'c1 still reads the five-member set';
      assert 'mocked personas' in it.lower() and 'arm-zero' in it.lower(), 'arm-zero on the oracle not stated';
      print('OK')"
    expected: OK
    fix_if: Every hosted_cli_runner mention in the intent must sit inside elimination framing; c9 is preserved verbatim; c10 is reworded, not deleted, and keeps the clause-3 reselling sentence.
    hermetic: true
    graduation: graduate
    graduation_check_id: t415-rescoped-to-persona-compute-hosts
  - step: 11
    phase: pre-deploy
    action: THE WORDING SWEEP LANDED -- T4.16 c11 CONSUMES THE GUARD CHECK RUN AND DEPENDS ON T4.21, T2.11b c5 USES THE DEFINITION WORDING, north_star NS.3/NS.5 CARRY THE CLOUD-TIER READING, CD.43 CARRIES THE ELIMINATION NOTE, T4.12 POINTS AT THE ACTIONS RULING. Red on origin/main.
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']};
      ec={c['id']:c['text'] for c in ti['T4.16']['exit_criteria']};
      assert 'T4.21' in ec['c11'] and 'check run' in ec['c11'], ec['c11'];
      assert 'T4.21' in ti['T4.16']['depends_on'], ti['T4.16']['depends_on'];
      txt=' '.join((c['text'] if isinstance(c,dict) else str(c)) for c in ti['T2.11b']['exit_criteria']);
      assert 'loop definition' in txt and 'Lambda Durable Functions executor' not in txt, 'T2.11b c5 still labels the executor mechanism-first';
