    ## Decision 184: The executor loop is a repo-owned ASL-subset definition; Step Functions is its cloud host; the leash is staged (amends Decision 39 and Decision 117) (Decided)

    ```yaml
    number: 184
    status: Decided
    decided_date: 2026-09-04
    amends: [39, 117]
    significance:
      value: numbered_decision
      justification: "Durable, reversal-relevant architecture commitment spanning CD.27, T4.1 and T4.15; a contract note cannot scope Decision 39; amendment_forms cannot amend two entries at once"
    ```

    **Status:** Decided
    **Date:** 2026-09-04
    **Warehouse ID:** dec-184 (per Decision 84 backfill)

    **Problem:** The corpus reads Step Functions as the executor loop's DEFINITION (CD.27, T4.1, T4.11, CD.44), so the loop can only run on AWS, which Decision 183 forbids for the free tier. Decisions 39 and 75 read a repo-owned loop as frame-lock because the portability requirement was never recorded, and the rules that leash the executor live inside that AWS-side definition.

    **Intent:** The loop's definition is a committed document the repository owns; Step Functions executes it in the cloud tier and a repo-owned interpreter in the free tier; the executor cannot loosen its own leash on either.

    **Decision:** Amends Decision 39 (scoped) and amends Decision 117.
    1. Loop model. A typed Python builder renders a committed Amazon States Language document restricted to the named subset T4.19's contract records (Retry and Catch on deterministic states only, Decision 55; JSONPath only; lambda:invoke with waitForTaskToken; one named .sync long-task port; no Map, JSONata or intrinsics), enforced by a registered check. Two engines execute it: Step Functions natively in the cloud tier; a repo-owned Python interpreter with a restart-tolerant journal in the free tier (T4.22). The definition and its moto-oracle harness (T4.20) precede the T4.1 host. Python for both.
    2. Decision 39 scoped; Decision 100 read. Decision 39 governs the cloud host: Step Functions is the sole cloud-tier engine and its custom-DAG-engine rejection stands there; the free-tier interpreter is a scoped supersession admitted only where no managed orchestrator exists. Decision 100's premise, a reachable managed primitive, is absent on user-owned substrate, so it is not overridden. The definition is a literal committed document, the conscious frame Decision 75's constraints clause licenses.
    3. Leash, staged. The kernel path, rendered ASL and persona contracts join Decision 117 boundary_patterns; a base-ref required check on a pull_request_target workflow that never checks out the PR head refuses executor-authored diffs to them (T4.21; Decision 143); kernel-side hard ceilings bound loop-policy values behind a raise-approved marker (Decision 128); the executor's file_pr and merge identity is a GitHub App absent from branch-protection bypass_actors (Decision 83). The released-version rule (the executor runs an installed kernel, never the tree it edits) binds at first_of(concurrency above 1, free-tier package ships) (T4.24).

    **Options considered:** Rust, Go, TypeScript, a CDK/jsii-authored definition, compiled-engine hybrids, Java Step Functions Local and the TestState API -- rejected: every loop call crosses into Python (LiteLLM, DuckDB, moto), the governance net is Python-only, only Python has a maintained ASL interpreter, and the Rust audit's RLE-02/03 apply. moto's interpreter as the free-tier engine behind a journal wrapper -- deferred to T4.22: a test double with mock-config semantics, antlr and jsonpath runtime dependencies for end users, and no restart journal. Hand-authored ASL in Terraform -- rejected: untestable before deploy, free to use AWS-only constructs. A local engine before T4.1 -- rejected: M-L delay for no MVP benefit. Full record in the plan PR.

    ```yaml reversal-conditions
    decision: 184
    review_by: 2027-03-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: subset-outgrown
        kind: manual
        description: "A construct outside the subset is needed: amend the allowlist, engine follows."
      - id: app-identity-infeasible
        kind: manual
        description: "Non-bypass App identity infeasible: base-ref check is audit-only; released-version rule moves into MVP."
      - id: moto-engine-adoptable
        kind: manual
        description: "A maintained standalone Python ASL interpreter becomes adoptable: T4.22 is an adoption, not a build."
    ```

    **Related:** Decision 183 (the boundary this architecture serves), Decision 39 (amended, scoped), Decision 117 (amended), Decisions 55, 75, 83, 100, 128, 143, 173; CD.27, CD.38, CD.44; rec-2827, rec-3218; audits ad02653, 7d57a0d, 842ff92.

