execution_steps:
  - |-
    STEP 1 -- DRAFT THE DECISION. Re-check the next free number (max '## Decision NNN:' header plus one; 183 at
    planning). Insert the entry in the file's newest-first position (immediately before the current highest
    entry's header). Measure with `bin/venv-python -m scripts.validate --pre` (validate_decisions_size); if the
    entry exceeds 6,144 bytes after tightening, apply the split partition recorded in context verbatim. Draft
    text (tighten wording, never drop a clause; keep every phrase step 2 asserts):

    ## Decision 183: Open-core local-first platform -- the executor loop is a repo-owned ASL-subset definition; Step Functions is its cloud host (amends Decision 39 and Decision 117) (Decided)

    ```yaml
    number: 183
    status: Decided
    decided_date: 2026-09-04
    amends: [39, 117]
    significance:
      value: numbered_decision
      justification: "Durable, reversal-relevant commitment spanning CD.27, T4.1 and T4.15; a contract note cannot scope Decision 39; amendment_forms cannot amend two entries at once"
    ```

    **Status:** Decided
    **Date:** 2026-09-04
    **Warehouse ID:** dec-183 (per Decision 84 backfill)

    **Problem:** The corpus reads Step Functions as the executor loop's DEFINITION (CD.27, T4.1, T4.11, CD.44), so the loop can only run on AWS. rec-3386 records the operator's direction: the governed loop must run on user-owned substrate with no Theseus cloud. Decisions 39 and 75 read a repo-owned loop as frame-lock because that requirement was never recorded.

    **Intent:** Theseus is open-core: this repository runs the full governed loop locally from a user's own LLM API key and GitHub token, and the same loop runs on AWS for the operator; cloud services are adapters behind ports, never the definition.

    **Decision:** Amends Decision 39 (scoped) and amends Decision 117.
    1. Boundary. The free tier IS the platform (this repository, BUSL-1.1); the paid management plane is a separate repository importing it (Decision 178). The AWS adapters stay here today; whether they remain open or move private is OPEN (reversal stanza), never pre-decided.
    2. Port rule. Every cloud service is reached through a named port; the AWS implementation is one adapter; each port has a tracked local-adapter item (T4.23, T4.24). DuckLake stays the sole ops-store backend per deployment (Decision 84 I-1; a local file catalog is the same format, Decision 78); the closed named-verb boundary (Decision 81) becomes a module boundary locally.
    3. Loop model. The per-rec loop's definition is repo-owned: a typed Python builder renders a committed Amazon States Language document restricted to the named subset T4.19's contract records (Retry and Catch on deterministic states only, Decision 55; JSONPath only; lambda:invoke with waitForTaskToken; one named .sync long-task port; no Map, JSONata or intrinsics), enforced by a registered check. Two engines execute it: Step Functions natively in the cloud tier; a repo-owned Python interpreter with a restart-tolerant journal in the free tier (T4.22). The definition and its moto-oracle harness (T4.20) precede the T4.1 host. Python for both.
    4. Decision 39 scoped; Decision 100 read. Decision 39 governs the cloud host: Step Functions is the sole cloud-tier engine and its custom-DAG-engine rejection stands there; the free-tier interpreter is a scoped supersession admitted only where no managed orchestrator exists. Decision 100's premise, a reachable managed primitive, is absent on user-owned substrate, so it is not overridden. The definition is a literal committed document, the conscious frame Decision 75's constraints clause licenses.
    5. Leash, staged. The kernel path, rendered ASL and persona contracts join Decision 117 boundary_patterns; a base-ref required check on a pull_request_target workflow that never checks out the PR head refuses executor-authored diffs to them (T4.21); kernel-side hard ceilings bound loop-policy values behind a raise-approved marker (Decision 128); the executor's file_pr and merge identity is a GitHub App absent from branch-protection bypass_actors (Decision 83). The released-version rule (the executor runs an installed kernel, never the tree it edits) binds at first_of(concurrency above 1, free-tier package ships) (T4.24).
    6. Actions workload class. GitHub Actions is the verdict plane in all modes (CD.38) and never persona compute: persona sessions are general-computing-shaped workloads under the Actions usage policy's burden clause, with suspension risk; the safe set is event-triggered repo-lifecycle work. hosted_cli_runner leaves T4.15's arms. Scheduled-agent placement stays T4.12 cD's call.
    7. Credential policy. Consumer-subscription OAuth is not a Theseus product credential in any tier; API keys via LiteLLM are the only product inference lane (roles per Decision 173). Operator use of Claude Code surfaces is first-party, out of product scope; Decision 116's scheduled-agent lane is unchanged.
    8. Licence. BUSL-1.1 is a placeholder pending monetary direction; an Additional Use Grant amendment under Decision 171 precedes any free-tier release.

    **Options considered:** Rust, Go, TypeScript, a CDK/jsii-authored definition, compiled-engine hybrids, Java Step Functions Local and the TestState API -- rejected: every loop call crosses into Python, the governance net is Python-only, only Python has a maintained ASL interpreter, and the Rust audit's RLE-02/03 apply. Hand-authored ASL in Terraform -- rejected: untestable before deploy, free to use AWS-only constructs. A local engine before T4.1 -- rejected: M-L delay for no MVP benefit. Full record in the plan PR.

    ```yaml reversal-conditions
    decision: 183
    review_by: 2027-03-31
    on_trigger: "re-decide via /plan"
    conditions:
      - id: adapter-residency
        kind: manual
        description: "Adapter residency decided: amend clause 1 and the Decision 171 grant."
      - id: subset-outgrown
        kind: manual
        description: "A construct outside the subset is needed: amend the allowlist, engine follows."
      - id: no-free-tier
        kind: manual
        description: "No free-tier work within two quarters: drop T4.22-T4.24; clauses 3-4 stand as Decision 39 future-state."
      - id: actions-policy
        kind: manual
        description: "GitHub allows agent sessions explicitly, or CI leaves hosted runners: reopen clause 6 and T4.15 c10."
      - id: app-identity-infeasible
        kind: manual
        description: "Non-bypass App identity infeasible: base-ref check is audit-only; released-version rule moves into MVP."
    ```

    **Related:** Decision 39 (amended, scoped), Decision 117 (amended), Decisions 55, 75, 78, 81, 83, 84, 100, 116, 128, 171, 173, 178; CD.27, CD.38, CD.44; rec-3386, rec-2827.
  - |-
