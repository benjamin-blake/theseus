schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "step-functions-executor-host"
intent: >-
  Route rec-3386's strategy-session positions into governance and re-frame the autonomous executor so
  that Step Functions is a HOST of the per-rec loop rather than the loop's DEFINITION: the definition
  becomes a repo-owned ASL-subset document rendered from a typed Python builder, executed natively by
  Step Functions in the operator's cloud tier and, post-MVP, by a repo-owned interpreter in an open-core
  free tier that runs on user-owned substrate with no Theseus cloud. Governance and roadmap encoding
  only -- no kernel code lands here.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-step-functions-executor-host.yaml
phase: >-
  Platform T4 (executor). Governance precursor that re-scopes T4.1 to the Step Functions host and
  T4.15 to persona-compute hosts, and adds the loop-definition items (T4.19, T4.20), the boundary
  guard (T4.21) and the deferred platform-packaging items (T4.22-T4.24) that T4.1 and T4.15 now
  sequence behind.
fallback_reevaluation:
  reevaluated_on: "2026-09-04"
  substrate_status: >-
    CD.27's layer-2 incumbent (Lambda Durable Functions) remains the incumbent. This plan moves the
    layer-1 DEFINITION into the repository and re-scopes the T4.15 spike to persona-compute hosts under
    that fixed definition; it selects no layer-2 substrate and CD.43's store stays TBD. The T4.15 spike
    has not run.
  verdict: continue_on_current_substrate
  basis: >-
    No Lambda Durable Functions API-semantics regression is recorded and the unplanned_resume_rate
    signal has no data (no persona has executed). The fallback_spec's lapse_condition fires only if the
    Q5 spike pins a non-replay layer-2 substrate; the spike is re-scoped here, not run, so neither the
    trigger nor the lapse has fired and the obligation carries forward unchanged.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New numbered Decision (183 at drafting; re-checked at implement time) recording the open-core
      local-first commitment, the substrate port rule, the loop model (ASL subset, two engines,
      Python), the scoped Decision 39 narrowing and Decision 100 reading, the staged leash, the GitHub
      App merge identity, the Actions workload class, the credential policy, the licence dependency,
      the options considered, and a monitored reversal stanza; dated append-only annotations on
      Decision 39 (scoped to the cloud host) and Decision 117 (boundary mechanism amended).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by scripts.decisions_index --write after the DECISIONS.md edit (never hand-edited, Decision 160/179).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      CD.27 layer-1 wording plus a free-tier-host discipline point and the hosted_cli_runner
      elimination annotation; CD.44 GOV-2 amendment; T4.1 re-scoped to the Step Functions host with
      the App credential criterion; T4.10a and T4.11 re-pointed at the loop definition with the
      hard-ceiling criterion; T4.15 re-scoped to persona-compute hosts; T4.16 c11 consumes the
      boundary-guard check; T4.9 c1 and T4.9a c1 substrate-neutral (rec-3226); T4.8, T4.9a and T3.10
      re-homed off the frozen Life-1 tree (rec-3219); T2.11b c5 wording; new items T4.19-T4.24.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Decision 117 boundary_patterns gain the loop kernel path, the rendered ASL, the persona and
      loop-policy contracts, config/agent/executor/personas.yaml, .github/CODEOWNERS and the
      boundary-guard workflow name, so no rec targeting them ever derives automatable.
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: Behavioral test that compute_automatable returns False for every new boundary path (red on origin/main for the non-Python paths).
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Executor end-state and critical-path wording to definition/host framing, byte-neutral or shrinking under the 14,032-byte S8 budget.
  - file: README.md
    action: Modify
    purpose: Autonomous Executor and Lambda Tooling Platform rows reworded to definition/host framing (Decision 111 curated portal).
bundled_recommendations: [rec-3386, rec-3226, rec-3219]
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - A numbered Decision titled with 'Open-core local-first platform' exists (or the pre-authorised two-entry split), each entry under 6,144 bytes with a bare yaml envelope claiming significance numbered_decision, and the union of their text carries every clause phrase step 2 names.
  - Decision 39 and Decision 117 each carry a dated '> **Amended by Decision N (DATE):**' annotation pointing at the new Decision, with their original text untouched (Decision 177 append-only).
  - docs/decisions-index.json is fresh (scripts.decisions_index --check exits 0).
  - CD.27 layer 1 is headed 'Loop definition' and names the ASL subset and the cloud-tier host; a discipline point records the free-tier host as a scoped Decision 39 supersession; the ESB-04 clause stays verbatim; hosted_cli_runner's elimination is annotated on the pinned set; every CD.27-pinned registry check still passes.
  - T4.1 is re-scoped to render-and-deploy with its four persona-node typing lines and bare-string criteria preserved, depends on T4.19 and T4.20, and pins the file_pr/merge identity to a GitHub App absent from bypass_actors with a live probe.
  - T4.15 lists four arms with hosted_cli_runner eliminated, runs arm-zero on the T4.20 oracle, depends on T4.19 and T4.20, and c10 records the Actions workload-class ruling.
  - T4.19, T4.20, T4.21 exist not_started and T4.22, T4.23, T4.24 exist deferred_post_mvp, with no live item depending on a deferred one and no mechanism vocabulary in their lifecycle fields.
  - rec-3226's and rec-3219's acceptance commands pass on the edited roadmap, and T3.10 declares no path under scripts/executor/.
  - compute_automatable returns False for the new boundary paths; the roadmap stays under 10,000 lines; PROJECT_CONTEXT.md stays at or under 14,032 bytes; README rows no longer describe Step Functions as the loop.
  - The full presubmit tier passes; rec-3386, rec-3226 and rec-3219 close via the Resolves trailer on merge; the two follow-on recs for rec-3386 items (5) and (6) exist in the warehouse.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Full presubmit tier (Decision 163 checked pre-handoff run). Roadmap schema and graph, Decision 93 edges, the seven CD.27/T4.x registry checks, decision-entry conformance, size cap, index freshness, prose budgets and supersession annotations all gate here.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0, `All checks passed`."
    fix_if: >-
      validate_decisions_size FAIL on the new entry means the split fallback applies (execution step 1).
      validate_supersession_annotations FAIL means a victim (39 or 117) lacks its pointer annotation.
      validate_decisions_index_freshness FAIL means regenerate with --write. A cd27-* registry FAIL
      means a pinned CD.27 phrase or discipline point was edited rather than annotated -- restore it.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      THE NEW DECISION EXISTS, IS ENVELOPED, FITS THE CAP, AND CARRIES EVERY CLAUSE. Entries are located
      by TITLE ('Open-core local-first' or 'repo-owned ASL-subset definition') so the assertion survives
      both the numbering race and the pre-authorised two-entry split; the phrase set is asserted over the
      UNION of the located entries. Red on origin/main (no such title exists).
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      es=[m for m in re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if
      ('Open-core local-first' in m.group(2)) or ('repo-owned ASL-subset definition' in m.group(2))];
      assert es, 'no open-core / loop-definition Decision entry found'; probs=[];
      [probs.append('Decision '+m.group(1)+' lacks a bare yaml envelope with number '+m.group(1)) for m in es
      if not re.search(r'^```yaml\s*\nnumber: '+m.group(1)+r'\b', m.group(0), re.M)];
      [probs.append('Decision '+m.group(1)+' envelope lacks value: numbered_decision') for m in es if 'value:
      numbered_decision' not in m.group(0)]; [probs.append('Decision '+m.group(1)+' is
      '+str(len(m.group(0).encode('utf-8')))+' bytes, over the 6144 cap') for m in es if
      len(m.group(0).encode('utf-8'))>6144]; assert not probs, probs; body='\n'.join(m.group(0) for m in es);
      need=['user-owned substrate','named port','waitForTaskToken','GitHub App','bypass_actors','verdict
      plane','persona compute','LiteLLM','Additional Use Grant','separate repository','Options
      considered','yaml reversal-conditions','amends Decision 39','amends Decision 117','Decision 100','Decision
      75','Decision 178','free tier','Step Functions','restart-tolerant','T4.19','T4.21','T4.24'];
      miss=[p for p in need if p not in body]; assert not miss, f'open-core/loop Decision text missing {miss}';
      print('OK', [m.group(1) for m in es])"
    expected: "OK ['183'] (or OK ['183', '184'] under the split)."
    fix_if: A missing phrase means a clause was dropped or paraphrased; an over-cap entry means apply the split partition in execution step 1; a missing envelope means the fenced yaml block is not immediately after the heading.
    hermetic: true
    graduation: graduate
    graduation_check_id: open-core-loop-definition-decision-clauses
  - step: 3
    phase: pre-deploy
    action: DECISION 39 IS SCOPED BY APPENDED ANNOTATION, NOT EDITED. Red on origin/main (Decision 39 carries only a 2026-08-02 Update line).
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 39:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 39 missing';
      b=m.group(0); a=[l for l in b.splitlines() if re.match(r'> \*\*Amended by Decision \d+
      \(\d{4}-\d{2}-\d{2}\):\*\*', l)]; assert a, 'Decision 39 carries no dated Amended-by annotation';
      l=a[-1]; miss=[w for w in ('scoped','cloud','free-tier','Custom DAG engine','sole cloud-tier') if w not in
      l]; assert not miss, f'Decision 39 annotation missing {miss}'; assert 'Rejected. Step Functions IS a
      managed DAG engine' in b, 'the original rejected-alternative text was edited, not annotated (Decision 177
      append-only)'; print('OK')"
    expected: OK
    fix_if: The annotation must be one appended blockquote line in the pinned '> **Amended by Decision N (DATE):**' form naming all five words; never rewrite the 2026 body.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec39-scoped-to-cloud-host-annotation
  - step: 4
    phase: pre-deploy
    action: DECISION 117'S ENFORCEMENT MECHANISM IS AMENDED BY APPENDED ANNOTATION. Red on origin/main.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision 117:.*?(?=^## Decision |\Z)', t, re.M|re.S); assert m, 'Decision 117 missing';
      b=m.group(0); a=[l for l in b.splitlines() if re.match(r'> \*\*Amended by Decision \d+
      \(\d{4}-\d{2}-\d{2}\):\*\*', l)]; assert a, 'Decision 117 carries no dated Amended-by annotation';
      l=a[-1]; miss=[w for w in ('bypass_actors','src/executor_loop/','docs/contracts/personas/','.github/CODEOWNERS','rec-3218','GitHub
      App') if w not in l]; assert not miss, f'Decision 117 annotation missing {miss}'; assert 'is unchanged from
      Decision 44' in b, 'original enforcement line edited rather than annotated'; print('OK')"
    expected: OK
    fix_if: Same append-only rule as step 3; the annotation must name every new pattern class and the non-bypass identity invariant.
    hermetic: true
    graduation: graduate
    graduation_check_id: dec117-boundary-amended-for-loop-kernel
  - step: 5
    phase: pre-deploy
    action: The decisions index is regenerated, not hand-edited. Red between adding the entry and running --write; green after.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0.
    fix_if: Run `bin/venv-python -m scripts.decisions_index --write` and commit the result.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the standing validate_decisions_index_freshness check registered in both validate tiers; a second registry slot would run the same freshness comparison twice.
  - step: 6
    phase: pre-deploy
    action: >-
      CD.27 LAYER 1 IS THE LOOP DEFINITION HOSTED ON STEP FUNCTIONS, WITH EVERY PINNED PHRASE PRESERVED.
      Presence legs are red on origin/main ('1. Loop definition', the scoped-supersession point, the
      elimination annotation); preservation legs guard the phrases the cd27-* registry checks and the
      grep_count check pin.
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.27'][0]; det=cd['detail'];
      assert re.search(r'^\s*1\. Loop definition', det, re.M), 'CD.27 layer 1 is not headed Loop definition';
      assert 'ASL' in det and 'cloud-tier host' in det, 'layer 1 does not name the ASL subset and the cloud-tier host';
      assert 'NOT an in-executor escape-hatch task' in det, 'escape-hatch phrase lost';
      assert 'Native Parallel state fans out critic personas' in det, 'native-construct sentence lost';
      pts=[p for p in cd['discipline_points'] if isinstance(p,str)];
      assert any(('scoped supersession' in p and 'Decision 39' in p and 'free-tier' in p) for p in pts), 'no discipline point records the free-tier host as a scoped Decision 39 supersession';
      assert any('MANAGED orchestration primitive' in p for p in pts), 'ESB-04 clause no longer verbatim';
      assert any(('hosted_cli_runner' in p and 'eliminated' in p) for p in pts), 'hosted_cli_runner elimination not annotated on the pinned set';
      print('OK')"
    expected: OK
    fix_if: A lost phrase means restore the original text and add the amendment as a bracketed dated note beside it instead of rewording it.
    hermetic: true
    graduation: graduate
    graduation_check_id: cd27-layer1-definition-hosted-on-step-functions
  - step: 7
    phase: pre-deploy
    action: CD.44 GOV-2 CARRIES THE COMPUTE-PLANE RE-MAPPING AS A BRACKETED AMENDMENT. Red on origin/main (CD.44 has no '[Amendment' text).
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.44'][0]; det=cd['detail'];
      m=re.search(r'GOV-2.*?\[Amendment[^\]]*\]', det, re.S);
      assert m and 'long_running_container' in m.group(0) and 'hosted_cli_runner' in m.group(0), 'CD.44 GOV-2 carries no bracketed amendment re-mapping the compute plane onto the container arm';
      assert 'The candidate selects nothing' in str(cd['discipline_points']), 'selects-nothing discipline lost';
      print('OK')"
    expected: OK
    fix_if: Append the bracketed amendment after the GOV-2 paragraph; never rewrite GOV-1 or the selects-nothing discipline.
    hermetic: true
    graduation: graduate
    graduation_check_id: cd44-gov2-compute-plane-container-arm
  - step: 8
    phase: pre-deploy
    action: >-
      T4.1 IS THE STEP FUNCTIONS HOST. Presence legs (render, committed, rendered-ASL path, T4.19/T4.20
      edges, oracle-trace criterion, App credential criterion) are red on origin/main; preservation legs
      keep the four persona-node typing lines the t4x-persona-contracts-mechanism-word-free check counts and
      the bare-string criteria shape.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']}; t=ti['T4.1'];
      assert 'render' in t['intent'] and 'committed' in t['intent'], 'T4.1 intent not re-scoped to render-and-deploy';
      nodes=[l for l in t['intent'].splitlines() if '[' in l and 'T4.2]' in l]; assert len(nodes)==4, nodes;
      fs=' '.join(map(str,t['files_in_scope'])); assert 'src/executor_loop/rendered/executor_loop.asl.json' in fs, 'rendered ASL not in T4.1 files_in_scope';
      assert {'T4.19','T4.20'}<=set(t['depends_on']), t['depends_on'];
      ec=t['exit_criteria']; assert all(isinstance(c,str) for c in ec), 'T4.1 criteria must stay bare strings';
      assert 'T4.20' in ec[0] and 'trace' in ec[0], ec[0];
      cred=[c for c in ec if 'GitHub credential model' in c];
      assert len(cred)==1 and all(w in cred[0] for w in ('GitHub App','bypass_actors','rec-2827','live probe')), 'credential criterion not pinned to a non-bypass App with a live probe';
      print('OK')"
    expected: OK
    fix_if: If the node count is not 4 the state-machine shape block was edited -- restore it verbatim; if criteria became objects revert to bare strings.
    hermetic: true
    graduation: graduate
    graduation_check_id: t41-rescoped-to-step-functions-host
  - step: 9
    phase: pre-deploy
    action: T4.10a PRECEDES THE DEFINITION AND T4.11 IS DEFINITION-CARRIED WITH HARD CEILINGS. Red on origin/main (T4.10a depends on T4.1; T4.11 has five criteria and names Step Functions state).
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']};
      assert ti['T4.10a']['depends_on']==['T1.12'], ti['T4.10a']['depends_on'];
      assert 'T4.10a' in ti['T4.19']['depends_on'], ti['T4.19']['depends_on'];
      t=ti['T4.11']; assert 'T4.19' in t['depends_on'], t['depends_on'];
      ec={c['id']:c['text'] for c in t['exit_criteria']};
      assert 'c6' in ec and 'raise-approved' in ec['c6'], ec.get('c6');
      assert 'loop definition' in ec['c2'] and 'Step Functions state machine enforces' not in ec['c2'], ec['c2'];
      assert 'enforced by Step Functions state (not by' not in t['intent'], 'T4.11 intent still definition-in-Step-Functions shaped';
      print('OK')"
    expected: OK
    fix_if: Re-point the edges and reword c2 and the intent; add c6 as an ExitCriterion object with status open.
    hermetic: true
    graduation: graduate
    graduation_check_id: t410a-t411-repointed-to-loop-definition
  - step: 10
    phase: pre-deploy
    action: T4.15 COMPARES PERSONA-COMPUTE HOSTS UNDER A FIXED DEFINITION. Red on origin/main (hosted_cli_runner is an arm, no arm-zero, no T4.19 edge, c10 argues proportionality).
    command: >-
      bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']}; t=ti['T4.15']; it=t['intent'];
      hits=[m.start() for m in re.finditer('hosted_cli_runner', it)];
      assert hits and all(re.search(r'eliminat|removed', it[max(0,h-240):h+240]) for h in hits), 'T4.15 still lists hosted_cli_runner as an arm';
      assert 'T4.19' in t['depends_on'] and 'T4.20' in t['depends_on'], t['depends_on'];
      ec={c['id']:c['text'] for c in t['exit_criteria']};
      assert 'persona compute' in ec['c10'] and 'verdict plane' in ec['c10'], ec['c10'];
      assert 'DISTINCT WORKFLOW RUNS' in ec['c9'], 'c9 formulation lost';
      assert 'mocked personas' in it and 'arm-zero' in it, 'arm-zero on the oracle not stated';
      print('OK')"
    expected: OK
    fix_if: Every hosted_cli_runner mention in the intent must sit inside elimination framing; c9 is preserved verbatim; c10 is reworded, not deleted.
    hermetic: true
    graduation: graduate
    graduation_check_id: t415-rescoped-to-persona-compute-hosts
  - step: 11
    phase: pre-deploy
    action: T4.16 c11 CONSUMES THE GUARD CHECK RUN AND T2.11b c5 USES THE DEFINITION WORDING. Red on origin/main.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']};
      ec={c['id']:c['text'] for c in ti['T4.16']['exit_criteria']};
      assert 'T4.21' in ec['c11'] and 'check run' in ec['c11'], ec['c11'];
      txt=' '.join((c['text'] if isinstance(c,dict) else str(c)) for c in ti['T2.11b']['exit_criteria']);
      assert 'loop definition' in txt and 'Lambda Durable Functions executor' not in txt, 'T2.11b c5 still labels the executor mechanism-first';
      print('OK')"
    expected: OK
    fix_if: Reword c11's final clause to consume the T4.21 check run; reword T2.11b c5 without changing its status.
    hermetic: true
    graduation: graduate
    graduation_check_id: t416-c11-consumes-boundary-guard-check
  - step: 12
    phase: pre-deploy
    action: rec-3226 ACCEPTANCE -- the sole-verifier rule is substrate-neutral at T4.9 c1 and T4.9a c1. Red on origin/main (the incumbent-shaped phrase is present twice).
    command: >-
      bin/venv-python -c "import re,pathlib; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8');
      assert 'the executor runs neither in AWS' not in raw, 'incumbent-shaped sole-verifier wording survives';
      assert raw.count('only verifier / validation runner')>=2, 'sole-verifier rule dropped rather than reworded';
      assert len(re.findall(r'distinct workflow runs?|T4\.15 c9', raw, re.I))>=3, 'substrate-neutral formulation not adopted at 3+ sites';
      print('OK')"
    expected: OK
    fix_if: Reword both criteria to the T4.15 c9 'distinct workflow runs' formulation while keeping the 'only verifier / validation runner' phrase.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-3226-sole-verifier-substrate-neutral
  - step: 13
    phase: pre-deploy
    action: rec-3219 ACCEPTANCE -- no live or deferred item declares work inside the frozen Life-1 tree. Red on origin/main.
    command: >-
      bin/venv-python -c "import re,yaml,pathlib; raw=pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8');
      assert not re.search(r'^ +- scripts/executor/(lock_registry|rec_scheduler|github_checks)\.py', raw, re.M), 'rec-3219 acceptance: Life-1 paths still declared';
      d=yaml.safe_load(raw); ti={t['id']:t for t in d['tier_items']};
      bad=[(i,f) for i in ('T4.8','T4.9a','T3.10') for f in ti[i].get('files_in_scope',[]) if str(f).startswith('scripts/executor/')];
      assert not bad, bad; print('OK')"
    expected: OK
    fix_if: Re-home the paths onto src/executor_loop/ (Life-2) or, for T3.10, drop them with a progress_note deferring the write-site retirement to T5.6 deletion.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-3219-life1-tree-paths-rehomed
  - step: 14
    phase: pre-deploy
    action: >-
      THE SIX NEW TIER ITEMS ARE REGISTERED WITH THE RIGHT LIFECYCLE STATE, NO LIVE-TO-DEFERRED EDGE, NO
      MECHANISM VOCABULARY, AND THEIR LOAD-BEARING FILES AND CRITERIA. Red on origin/main (none exist).
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      ti={t['id']:t for t in d['tier_items']};
      want={'T4.19':'not_started','T4.20':'not_started','T4.21':'not_started','T4.22':'deferred_post_mvp','T4.23':'deferred_post_mvp','T4.24':'deferred_post_mvp'};
      miss=[i for i in want if i not in ti]; assert not miss, f'missing tier items {miss}';
      bad=[(i,ti[i]['status']) for i,s in want.items() if ti[i]['status']!=s or ti[i]['tier']!='T4' or ti[i].get('strategic')]; assert not bad, bad;
      dead=[(t['id'],dep) for t in d['tier_items'] if t['status'] in ('not_started','in_progress') for dep in t.get('depends_on',[]) if dep in ti and ti[dep]['status']=='deferred_post_mvp'];
      assert not dead, f'live item depends on deferred item: {dead}';
      blob=' '.join(str(ti[i]) for i in want).lower(); banned=[w for w in ('durable function','checkpoint-replay','forced timeout') if w in blob]; assert not banned, banned;
      fs=lambda i: ' '.join(map(str, ti[i].get('files_in_scope',[])));
      assert 'docs/contracts/executor-loop-definition.yaml' in fs('T4.19') and 'src/executor_loop/rendered/executor_loop.asl.json' in fs('T4.19'), fs('T4.19');
