execution_steps:
- >-
  Confirm VP step 1. Read the contract formulas named in the derive.py scope row, then src/common/ducklake_event_reads.py
  (execute, compared_columns, VERB_FIELDS in src/common/ducklake_reader_client.py) for the output columns only.
- >-
  dedupe.py and derive.py, then test_dedupe.py and test_derive.py (VP step 2). The oracle takes rows as plain dicts
  keyed by stored column name (timestamps as timezone-aware datetimes or ISO strings, normalised once on entry) and
  returns lists of dicts with the verb's VERB_FIELDS columns in order. Window verbs take a projects mapping
  (project_id -> purpose) for the real-purpose filter. Stamps: generations as (producer, parser_version) pairs ordered by
  producer; conflicted_grain_keys as (table_name, producer, event_id, parser_version) ordered; derivation_conflicted.
- >-
  tests/fixtures/telemetry_verification_trees.py, using the corpus builders (assistant, tool_result, hook, attachment,
  child, make_files). Trees: (a) subagent_nonfinal_midstream: a root that spawns one sync sub-agent whose toolUseResult
  carries usage equal to the child's last call's FINAL usage; the child makes three calls: one single-line final call,
  one mid-stream two-line call (thinking plus tool_use) whose lines carry stop_reason null and output_tokens 4, and a final
  two-line handback call with stop_reason null and output_tokens 8 where the spawn usage says 768. (b)
  subagent_background_failed: a background spawn whose <task-notification> carries <status>failed</status> (status values
  other than completed are inferred from Claude Code's notice format, not observed). (c) resume_with_cost_state: turn 1
  on the main model (records carry requestedModel claude-test-1[1m], message.model claude-test-1), a sync sub-agent on
  claude-sub-1 with one non-final call, then a cost-state record whose modelUsage holds the main model's exact prefix sums
  on input, cache read and cache creation with output 12 above the transcript sum, the sub-agent model exact, and
  claude-haiku-aux present only in the ledger; then a SessionStart:resume hook group and a turn 2 whose calls lie after
  the cut. Each tree's docstring names the measurement it reproduces (planning-facts.md).
- >-
  ledger.py and test_ledger.py (VP step 3). Finding vocabulary (stable names the later plans consume; DECLARED maps a
  declared class to its owner rec as module data): ledger_exact; ledger_output_residual_nonfinal (declared, rec-4354:
  output short and at least one non-final call in the prefix for that model); ledger_auxiliary_only (declared: a ledger
  model with no transcript record whose name starts with an AUXILIARY_MODEL_PREFIXES entry, seeded ("claude-haiku-",)
  from the two measurements); ledger_bounded_auxiliary (declared: an auxiliary-prefix model that also has transcript
  records, compared as ledger >= transcript per class); ledger_bounded_compaction (declared: a SessionStart:compact,
  PreCompact or PostCompact hook attachment before the cut, compared as a bound, because the compaction call has no
  assistant record [inferred]); and the alarm classes ledger_input_class_mismatch, ledger_output_residual_unexplained
  (output short with no non-final call), ledger_output_excess and ledger_model_unexplained (a non-auxiliary ledger-only
  model, or a transcript model absent from the ledger). Each cost-state record is reconciled against the prefix before its
  own line (cumulative reading, the declared expectation, measured only on single-record sessions); the result carries
  the record's index so a mismatch on a later record is visible as such.
- >-
  shape.py and test_shape.py (VP step 3). Vocabulary: nonfinal_call (declared, rec-4354) counted by stream kind and
  position; nonfinal_root_call (alarm: a non-final, non-aborted root call, never yet observed); spawn_usage_equal;
  spawn_corrects_nonfinal (declared, rec-4354: input classes equal, the child's last call non-final, spawn output
  higher); spawn_usage_mismatch (alarm); background_status_mismatch (declared, rec-4358 while it is open: a status other
  than completed against a success close); sidecar_pinned_absent_present (alarm: no owner rec yet); stop_hook_summaries
  (count and hookCount sum, a denominator only).
- >-
  tests/fixtures/telemetry_golden_chain.py, tests/telemetry/fixtures/derived_golden.yaml and
  tests/telemetry/test_derived_layer_reconciliation.py. derived_golden.yaml shape: a header comment stating the authoring
  rule; trees: a list of {tree: "corpus:<golden case file>" or "verification:<tree name>", pass: final or stop, why,
  expect: [{verb, session: root or "agent:<agentId>", params (absolute ISO as_of values, two per state verb: one inside
  and one beyond the 24 h idle threshold of the tree's last event), rows: [asserted subset of columns], why}]}.
  Author expectations for the derivation-relevant subset: hooks_resume_and_compact, resume_after_interrupt,
  close_cancelled_mid_stream, close_cancelled_running_tool, close_failed_api_error, subagent_sync,
  subagent_background_with_completion, subagent_background_without_completion, nested_subagent_depth2,
  fork_session_nested, multiblock_response_interleaved_tool_results, gate_and_precommit_markers, hook_blocked_tool_call,
  tool_result_error, sidecar_present, no_reply_session, and the three verification trees, at pass final and, for at least
  hooks_resume_and_compact and subagent_background_with_completion, also at pass stop.
- >-
  Nodes of test_derived_layer_reconciliation.py: test_golden_fixtures_reconcile (rec-4025's acceptance node; VP step 4);
  test_every_tree_agrees_with_the_oracle_and_holds_invariants (every producer golden tree plus every verification tree,
  each emitted session, every session-bound verb at two as_of values, verb output equal to oracle output; the seven
  foreign-key pairs of tests/turn_capture/test_capture_ducklake_integration.py's FKS list, restated in the chain helper
  (never imported from a test module), resolve for finalized trees; survivors equal emitted rows; no conflicted key; one
  generation at PARSER_VERSION); test_replay_order_and_late_delivery_leave_derived_values_unchanged (every batch twice
  inserts 0 the second time; reversed batch and row order; Stop passes at every prompt cut then the final pass, using
  tests/fixtures/turn_capture_real.PrefixTree or an equivalent prefix of the root file; append_events now = event time
  plus three days); test_conflicts_are_reported_and_generations_retire (a differing re-send raises GrainConflictError and
  inserts nothing; a conflicting pair inserted directly with telemetry_read_db.insert_rows is reported by every verb's
  stamps and by the oracle; a full PARSER_VERSION + 1 re-append leaves one generation; a sessions-only bump retires the
  other tables' rows in verbs and oracle alike); test_harness_detects_planted_verb_defects (monkeypatch the EVENT_READS
  entry's sql for four mutations and assert the reconciliation reports at least one mismatch for each: the token rollup's
  sum(tokens_output) replaced by max(tokens_output); the state tie order "(event_kind = 'close') DESC" replaced by ASC; the
  R5c collapse removed (o AS SELECT * FROM o_ev); the idle comparison ">" replaced by ">="); and
  test_golden_fixtures_reconcile_on_local_ducklake (integration-marked; the step 4 expectations on open_local_lake).
- >-
  tests/telemetry_verify/test_real_transcript_checks.py (VP step 7), then docs/contracts/file-router.yaml.
- Execute VP steps 1-8; loop until each passes.
- Code review (the code-review skill in a fresh context); fix every blocking finding.
