schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-golden-harness
intent: >-
  Telemetry slice 4's first leg (rec-4025): prove the derived layer end to end on known inputs before the feedback loop
  trusts it. Every producer golden transcript tree runs through the real producer, the real append kernel and every
  derivation reader verb, and the results must equal values written by hand from the Class A contract formulas AND an
  independent re-derivation written from the same formulas without the reader's SQL. The plan also lands the pure check
  library (independent re-derivation, Claude Code ledger reconciliation, transcript shape counts) that the in-session
  source check and the verification monitor plans reuse.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-golden-harness.yaml
phase: >-
  T3.20 and T2.36: telemetry slice 4 (verification), carried by rec-4025, over T2.36's read layer and T3.20's capture surface. First of four
  slice 4 plans (golden harness, verification verbs, in-session source check, verification monitor), approved by Benjamin's
  "write the plan" on 2026-10-17 (cmsg_012XgaFy8VaDQbxP5D8nC958MdLJawKLhVPEQqyXDX82iS) on the approach in
  /mnt/project-files/telemetry-slice4/step6b-presentation.md. Closes no exit criterion: T3.20 c3 closes with the verification
  monitor plan, and rec-4025 stays open as the slice's carrier until that plan lands.
closes_criteria: []
scope:
- file: scripts/telemetry_verify/__init__.py
  action: Create
  purpose: >-
    Package facade (telemetry slice 4 check library). Re-exports the public surface of dedupe, derive, ledger and shape
    only; no logic, no I/O at import.
- file: scripts/telemetry_verify/dedupe.py
  action: Create
  purpose: >-
    Independent stdlib implementation of the envelope's generation and read-side dedupe rules over plain row dicts:
    R4 generations (max parser_version of each producer's open rows per session), R5a retirement, R5b event collapse,
    R5c model_call entity collapse (claude_code then litellm then others, latest event_timestamp, created_timestamp,
    producer, event_id), and the Decision 207 conflict report (a grain key whose rows differ on any compared column,
    computed before retirement). Compared columns come from src.common.ducklake_event_reads.compared_columns (governed
    data, declared shared with the reader). Never imports duckdb, the reader SQL module or anything under tests/.
- file: scripts/telemetry_verify/derive.py
  action: Create
  purpose: >-
    Independent re-derivation of every session-bound and window derivation verb from deduped rows, written from the
    contract formulas (telemetry_sessions.yaml:156-162 state, :241 duration_seconds, :200 and :355 process events, :214
    rework, :229 exceptions; telemetry_agents.yaml:190-251 run totals and duration; telemetry_observations.yaml:267 cost),
    never from src/common/ducklake_event_read_sql.py: session_state_and_duration, agent_run_state_and_duration,
    agent_run_token_rollup, session_process_event_rollup, session_friction_rollup, model_call_cost_estimate,
    sessions_window and sessions_window_all_purposes, each returning the verb's VERB_FIELDS columns including the three
    stamps (generations, conflicted_grain_keys, derivation_conflicted). Governed data it shares with the reader, declared
    in its module docstring: IDLE_THRESHOLD_SECONDS and FRICTION_RULES from src/common/ducklake_event_read_verbs.py (the
    rules are data; the matcher is this module's own).
- file: scripts/telemetry_verify/ledger.py
  action: Create
  purpose: >-
    Claude Code ledger reconciliation over one transcript tree, read through the TranscriptTree protocol
    (src/turn_capture/transcript.py) with its own json walk, never src/turn_capture/streams.py: find each cost-state
    record in the root stream (modelUsage per model, keyed by the requestedModel string); sum the four token classes of
    the prefix before that record's line, per model (the record's requestedModel, else message.model), over root
    responses (last record per message.id; synthetic and API-error records excluded) plus every sub-agent stream whose
    spawn record precedes the cut; then classify every model into the finding vocabulary in execution_steps[3].
- file: scripts/telemetry_verify/shape.py
  action: Create
  purpose: >-
    Source-shape counts over one transcript tree with its own json walk (independent of the producer's parse):
    non-final model calls (owner record without stop_reason and not isAbortedMidStream) by stream kind (root or
    sub-agent) and position (final call of its stream or mid-stream); each sync spawn's toolUseResult.usage against its
    child's last call; each background spawn's completion-notice status (the <status> element of the
    <task-notification>), compared with given agent close outcomes; tool-results sidecars pinned absent in a given
    cursor that now exist; and the root's stop_hook_summary records with their hookCount. Findings use the vocabulary in
    execution_steps[4].
- file: tests/telemetry_verify/__init__.py
  action: Create
  purpose: Mirror test package marker (prepend import mode).
- file: tests/telemetry_verify/test_dedupe.py
  action: Create
  purpose: >-
    Mirror tests for dedupe.py, stdlib and yaml only (fast tier). Node test_oracle_matches_every_dedupe_vector runs all
    vectors of tests/telemetry/fixtures/dedupe_vectors.yaml (survivors and conflicted grain keys per table), plus unit
    cases for R5c precedence and a NULL-versus-value conflict.
- file: tests/telemetry_verify/test_derive.py
  action: Create
  purpose: >-
    Mirror tests for derive.py, stdlib and yaml only. Node test_oracle_matches_every_committed_derivation_case rebuilds
    each case of tests/telemetry/fixtures/derivation_cases.yaml as rows (the same identity derivation
    tests/common/test_ducklake_event_read_verbs.py uses) and asserts every one of its expectations; node
    test_oracle_matches_every_friction_vector asserts the facts and totals of tests/telemetry/fixtures/friction_vectors.yaml.
- file: tests/telemetry_verify/test_ledger.py
  action: Create
  purpose: >-
    Mirror tests for ledger.py. Node test_cut_bounded_reconciliation_classifies_every_model drives the verification trees
    and hand-built variants through every finding class in execution_steps[3], including the cut (records after the
    cost-state line excluded), the requestedModel key, a second cost-state record, an auxiliary model with and without
    transcript records, and a compaction before the cut.
- file: tests/telemetry_verify/test_shape.py
  action: Create
  purpose: >-
    Mirror tests for shape.py. Node test_nonfinal_calls_are_counted_at_every_position plus nodes for the spawn-usage leg,
    background statuses, sidecar pins and Stop hook summaries, each over the verification trees and hand-built variants.
- file: tests/telemetry_verify/test_real_transcript_checks.py
  action: Create
  purpose: >-
    Integration-marked, local only (never CI; real trees exist only in a live session). Runs ledger and shape over every
    real tree found the way tests/fixtures/turn_capture_real.py finds them (TURN_CAPTURE_REAL_TRANSCRIPTS, else
    ~/.claude/projects/*/*.jsonl), prints counts only (never content), prints LEDGER_UNPROVEN when no tree holds a
    cost-state record, and fails only on an alarm-class finding.
- file: tests/fixtures/telemetry_verification_trees.py
  action: Create
  purpose: >-
    Shared helper (never a test_ module): the slice 4 trap trees, built at runtime with the producer corpus builders in
    tests/fixtures/turn_capture_corpus.py, kept OUT of the producer golden corpus so its parser_versions.yaml golden
    digest does not move. Trees in execution_steps[2].
- file: tests/fixtures/telemetry_golden_chain.py
  action: Create
  purpose: >-
    Shared helper: build a catalog under the reader's telemetry alias (tests/fixtures/telemetry_read_db.py
    open_memory_catalog, or open_local_lake for the DuckLake leg), register one real-purpose project row, append a tree's
    record_turn batches through src.telemetry.append.append_events with the contract-derived specs
    (tests/fixtures/turn_capture_ducklake.load_specs), read every stored row back, resolve a session selector (root, or
    agent:<agentId>) to its stored session_id by entity_ref, and run a verb through src.common.ducklake_event_reads.execute.
    Holds back transcript rows above the inline threshold exactly as tests/turn_capture/test_capture_ducklake_integration.py
    does (the kernel facade has no blob route).
- file: tests/telemetry/fixtures/derived_golden.yaml
  action: Create
  purpose: >-
    The hand-authored expectations file (shape in execution_steps[5]): per tree, the pass kind, and per expectation the
    verb, session selector, params (two as_of values for every state verb) and the asserted subset of output columns,
    each with a one-line why naming the contract formula input it follows.
- file: tests/telemetry/test_derived_layer_reconciliation.py
  action: Create
  purpose: >-
    rec-4025's acceptance module. Module-level pytest.importorskip("duckdb"), not integration-marked except the local
    DuckLake node. Nodes in execution_steps[6], including rec-4025's acceptance node test_golden_fixtures_reconcile.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    Add the telemetry-verify route (targets [scripts/telemetry_verify/]) after the telemetry-capture route, with an
    additive amendment_log entry; compact the oldest entries to one line each if the Decision 166 limit requires it (the
    PLAN-telemetry-blob-route precedent).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The independent oracle (scripts/telemetry_verify dedupe and derive) reproduces every expectation in
  tests/telemetry/fixtures/derivation_cases.yaml, every dedupe vector's survivors and conflicted keys and every friction
  vector's facts and totals, and imports neither duckdb nor src/common/ducklake_event_read_sql.py nor anything under
  tests/ (VP step 2).
- >-
  For every tree with expectations in derived_golden.yaml, the chain (record_turn, append_events, catalog, reader verb)
  and the oracle over the stored rows both equal the hand-authored values (test_golden_fixtures_reconcile, VP step 4).
- >-
  For all 35 producer golden trees and every verification tree, at both pass kinds where the tree finalizes: the verb
  output equals the oracle output for every emitted session and every session-bound verb at two as_of values; every
  foreign key of the seven FK pairs resolves for finalized trees; survivors equal the emitted rows; no grain key is conflicted; and each session
  has exactly one generation, at PARSER_VERSION (VP step 5).
- >-
  Replay and delivery cannot move a derived value: an identical re-send inserts 0 rows; reversed batch order, incremental
  Stop-pass delivery at every prompt cut, and a late delivery (append_events now three days after the events) leave
  every verb output unchanged (VP step 5).
- >-
  A differing re-send is refused (GrainConflictError) and writes nothing; a stored conflicting pair is reported in every
  verb's stamps and identically by the oracle; re-appending a tree at PARSER_VERSION + 1 leaves only the new generation
  live, and a partial bump retires the unbumped tables' rows in both the verbs and the oracle (VP step 5).
- >-
  Mutation evidence: each of the four planted verb-SQL defects in execution_steps[6] makes the reconciliation report at
  least one mismatch, so the harness is shown to discriminate (VP step 5).
- >-
  The ledger check classifies every model of every cost-state cut on the verification trees and unit vectors into the
  documented finding classes, alarms only on the alarm classes, and excludes everything after the cut (VP step 3).
- >-
  The shape checks count non-final calls by stream kind and position, compare sync spawn usage with the child's last
  call, read background notice statuses, find pinned-absent sidecars that now exist and count Stop hook summaries, all
  without importing src/turn_capture/streams.py (VP step 3).
- The same expectations pass on a local DuckLake catalog, run before handoff (VP step 6).
- >-
  The real-transcript checks run on the implementing session's own tree and report counts, or LEDGER_UNPROVEN when no
  tree holds a cost-state record (VP step 7).
- docs/contracts/file-router.yaml routes scripts/telemetry_verify/ (validate_placement passes in the full tier, VP step 9).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Precondition. The files this plan builds on exist at the shapes it names.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    tests/fixtures/turn_capture_corpus.py && test -f tests/fixtures/telemetry_read_db.py && test -f
    tests/fixtures/turn_capture_ducklake.py && test -f tests/fixtures/telemetry_dedupe_reference.py && grep -q
    "def append_events" src/telemetry/append.py && grep -q "def compared_columns" src/common/ducklake_event_reads.py &&
    grep -q "FRICTION_RULES" src/common/ducklake_event_read_verbs.py && grep -q "def execute" src/common/ducklake_event_reads.py &&
    echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    A missing helper or symbol means main moved; stop and escalate to the coordinator for a plan amendment, never adapt the
    scope inline.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition on other plans' files, not a behaviour of this change; as a standing guard it would only
    re-assert that those files exist.
- step: 2
  phase: pre-deploy
  action: The oracle reproduces every committed dedupe, derivation and friction expectation, with no reader SQL behind it.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify/test_dedupe.py::test_oracle_matches_every_dedupe_vector
    tests/telemetry_verify/test_derive.py::test_oracle_matches_every_committed_derivation_case
    tests/telemetry_verify/test_derive.py::test_oracle_matches_every_friction_vector -q
  expected: Exit 0, all three nodes pass. Red before because the nodes and the package are absent.
  expected_literals: []
  fix_if: >-
    A disagreement with a committed expectation means the oracle misreads the contract formula; re-read the formula and fix
    the oracle. Never edit derivation_cases.yaml, dedupe_vectors.yaml or friction_vectors.yaml to match the oracle; if a
    committed expectation itself contradicts its contract formula, stop and escalate to the coordinator.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-oracle-matches-committed-cases
- step: 3
  phase: pre-deploy
  action: The ledger and shape checks classify every documented case.
  command: >-
    bin/venv-python -m pytest tests/telemetry_verify/test_ledger.py::test_cut_bounded_reconciliation_classifies_every_model
    tests/telemetry_verify/test_shape.py::test_nonfinal_calls_are_counted_at_every_position -q
  expected: Exit 0, both nodes pass. Red before because they are absent.
  expected_literals: []
  fix_if: >-
    A misclassified model or a miscounted call means the walk differs from execution_steps[3] or [4]; fix the walk, never
    widen a declared class to absorb a mismatch.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-verify-ledger-and-shape-classify
- step: 4
  phase: pre-deploy
  action: The chain and the oracle both equal the hand-authored expectations (rec-4025's acceptance node).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile -q &&
    test -d tests/telemetry/fixtures
  expected: Exit 0. Red before because the module is absent.
  fix_if: >-
    When the verb and the oracle agree with each other but not with the authored value, re-derive the value by hand from
    the formula before changing anything. When the verb alone disagrees, that is a reader defect: stop, file it through the
    portal (out-of-scope bug, never an inline fix to src/) and escalate to the coordinator. Never copy a value from either
    output into derived_golden.yaml.
  hermetic: false
  graduation: graduate
  graduation_check_id: telemetry-derived-layer-golden-reconcile
- step: 5
  phase: pre-deploy
  action: >-
    Whole-corpus agreement, structural invariants, replay and delivery independence, conflicts, generations and the
    mutation evidence.
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_every_tree_agrees_with_the_oracle_and_holds_invariants
    tests/telemetry/test_derived_layer_reconciliation.py::test_replay_order_and_late_delivery_leave_derived_values_unchanged
    tests/telemetry/test_derived_layer_reconciliation.py::test_conflicts_are_reported_and_generations_retire
    tests/telemetry/test_derived_layer_reconciliation.py::test_harness_detects_planted_verb_defects -q
  expected: Exit 0, all four nodes pass.
  fix_if: >-
    An oracle-versus-verb disagreement on a tree with no authored expectation is resolved exactly as step 4 says. A
    planted defect that survives means the harness misses that class of error: add the authored expectation or the
    oracle comparison that catches it, never drop the mutation.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The module imports duckdb through a module-level importorskip and the fast tier excludes duckdb, so the venv-less PR
    tier collects nothing; the full tier (pre-handoff and on main) runs these nodes; step 4 graduates the module's
    acceptance node.
- step: 6
  phase: pre-deploy
  action: The same expectations on a local DuckLake catalog (partitioned, inlining off, UTC).
  command: >-
    bin/venv-python -m pytest
    tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile_on_local_ducklake -m integration -q
  expected: Exit 0. The extension helper fails, never skips, when ducklake cannot load (rec-4071).
  fix_if: >-
    A DuckLake-only failure (in-memory green) is an engine difference: report it with the failing tree and verb, file it
    through the portal and escalate; never relax the expectation for one engine.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    The check library over this session's own real transcript tree (counts only). Run it after the session has resumed at
    least once if possible, so a cost-state record exists.
  command: bin/venv-python -m pytest tests/telemetry_verify/test_real_transcript_checks.py -m integration -q -s
  expected: >-
    Exit 0, with one count line per tree (models, finding classes, non-final calls by kind and position), or
    LEDGER_UNPROVEN when no tree holds a cost-state record. Report the lines verbatim.
  fix_if: >-
    An alarm-class finding on a real tree is a real finding: report it, file it through the portal and escalate to the
    coordinator; never add a declared class to silence it.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: Every new source file has its mirror test and full coverage.
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
    scripts/telemetry_verify/dedupe.py scripts/telemetry_verify/derive.py scripts/telemetry_verify/ledger.py
    scripts/telemetry_verify/shape.py
  expected: Exit 0.
  fix_if: A coverage gap needs a direct assertion in the module's mirror test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The full tier's coverage gate already enforces the same rule on every merge; a registry row would duplicate it.
- step: 9
  phase: pre-deploy
  action: Lint and run the full tier on the committed, clean tree before the push, as the handoff policy requires.
  command: >-
    bin/venv-python -m ruff check scripts/telemetry_verify tests/telemetry_verify tests/telemetry tests/fixtures &&
    bin/venv-python -m scripts.validate
  expected: Exit 0 from both.
  fix_if: Fix the reported finding at its root (Decision 55); never skip, disable or quarantine a test.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/telemetry_verify/dedupe.py
  behavior: Generations, R5 dedupe, the R5c collapse and the conflict report match every committed dedupe vector.
  verification_step: 2
  test_selector: tests/telemetry_verify/test_dedupe.py::test_oracle_matches_every_dedupe_vector
  red_green_expectation: red before (node and module absent), green after
- source: scripts/telemetry_verify/derive.py
  behavior: Every derivation verb's output follows its contract formula on every committed derivation case.
  verification_step: 2
  test_selector: tests/telemetry_verify/test_derive.py::test_oracle_matches_every_committed_derivation_case
  red_green_expectation: red before (node and module absent), green after
- source: scripts/telemetry_verify/ledger.py
  behavior: A cost-state cut is reconciled per model and every model lands in its documented finding class.
  verification_step: 3
  test_selector: tests/telemetry_verify/test_ledger.py::test_cut_bounded_reconciliation_classifies_every_model
  red_green_expectation: red before (node and module absent), green after
- source: scripts/telemetry_verify/shape.py
  behavior: Non-final calls are counted at every position and stream kind, independently of the producer's parse.
  verification_step: 3
  test_selector: tests/telemetry_verify/test_shape.py::test_nonfinal_calls_are_counted_at_every_position
  red_green_expectation: red before (node and module absent), green after
- source: scripts/telemetry_verify/__init__.py
  behavior: The facade exposes the four modules' public surface.
  verification_step: 2
  test_selector: tests/telemetry_verify/test_dedupe.py::test_oracle_matches_every_dedupe_vector
  waiver_reason: >-
    Re-exports only, with no logic of its own; every step 2 and step 3 node imports through it, and the coverage gate
    excludes __init__.py by rule.
- source: tests/fixtures/telemetry_golden_chain.py
  behavior: A tree's batches land through the real kernel and every verb runs over them.
  verification_step: 4
  test_selector: tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile
  waiver_reason: >-
    A shared test helper, exercised end to end by the step 4 and step 5 nodes; it has no behaviour outside them.
- source: tests/fixtures/telemetry_verification_trees.py
  behavior: The trap trees reproduce the measured transcript shapes.
  verification_step: 3
  test_selector: tests/telemetry_verify/test_shape.py::test_nonfinal_calls_are_counted_at_every_position
  waiver_reason: >-
    A shared test helper whose trees are asserted by the step 3 to step 5 nodes; it has no behaviour of its own.
- source: tests/telemetry/fixtures/derived_golden.yaml
  behavior: The hand-authored derived values for the authored trees.
  verification_step: 4
  test_selector: tests/telemetry/test_derived_layer_reconciliation.py::test_golden_fixtures_reconcile
  red_green_expectation: red before (file and node absent), green after
- source: docs/contracts/file-router.yaml
  behavior: The new package is routed for discovery.
  verification_step: 9
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    A data row whose target resolution validate_placement checks in both tiers; the full-tier run in step 9 is its
    evidence.
constraints:
- >-
  Expected values in derived_golden.yaml are written by hand from the contract formulas before the first run of the
  verbs or the oracle against them, each with its one-line why; never copied from verb or oracle output, never edited
  to make a run pass. A disagreement is resolved by re-deriving by hand (VP step 4 fix_if).
- >-
  No change under src/ (producer, kernel, reader, writer) and no change to the reader's SQL; a reader defect the harness
  finds is filed through the portal and escalated to the coordinator (scope escalation rule; Decision 59), never fixed
  here. No change to tests/fixtures/turn_capture/golden/, config/telemetry/parser_versions.yaml or any existing test
  module; the verification trees live in tests/fixtures/telemetry_verification_trees.py.
- >-
  scripts/telemetry_verify imports only the standard library, src.turn_capture.transcript (tree access and raw lines),
  src.common.ducklake_event_reads (compared_columns, governed data) and src.common.ducklake_event_read_verbs
  (IDLE_THRESHOLD_SECONDS, FRICTION_RULES); never duckdb, src.common.ducklake_event_read_sql, src.turn_capture.streams,
  src.turn_capture.observations or anything under tests/. Pure functions over passed-in data: no network, no catalog
  read, no file write (Decision 84 I-3).
- >-
  Nothing prints transcript content or a row value beyond counts, model names and finding classes (this repository and
  its CI logs are public; Decision 101).
- >-
  The extended stop_reason dashboard in tests/turn_capture/test_real_transcript_conformance.py stays with rec-4354's
  owner (the producer fixes plan); this plan does not modify that file.
- >-
  SLOC (Decision 128): every new module stays under 500 SLOC; if one would not, split it within scripts/telemetry_verify/
  and list the split in the report (the facade keeps the public surface); a budget raise is never the fix.
- No rescue agents or workaround loops (Decision 55).
