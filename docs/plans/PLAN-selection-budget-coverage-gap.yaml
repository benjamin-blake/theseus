schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "selection-budget-coverage-gap"
intent: >-
  Close CI-RCA rec-3551 by covering the two untested branches in
  scripts/checks/deps/selection_budget.py, restoring the file to the 100%-per-file floor and
  clearing the unresolved-ci-rca hard block that gates all other planning work.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-selection-budget-coverage-gap.yaml
phase: >-
  ci_rca soft-warn exception category; no tier_item claimed. Adjacent to T3.7 (deferred_post_mvp,
  diff-line-coverage ratchet) and T2.55 (shrink-only baselines) -- neither is advanced here.
scope:
  - file: tests/checks/deps/test_selection_budget.py
    action: Modify
    purpose: >-
      Add TestBudgetVerdict and TestCountTestModules (neither class exists today) covering
      selection_budget.py lines 113 and 123 -- the only two uncovered statements.
bundled_recommendations:
  - rec-3551
followon_recs:
  - rec-3232
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts/checks/deps/selection_budget.py measures 100% per-file line coverage under the
    per-file coverage checker (scripts.test_coverage_checker --check-coverage), which reports 98.4%
    today. That tool self-labels its standalone output DIAGNOSTIC; the authoritative gate is
    validate_test_coverage, which VP step 3's full-tier run exercises.
  - >-
    BudgetVerdict.hard_fail is asserted True for a non-zero exit_code and False for exit_code 0.
  - >-
    count_test_modules returns 0 for a root whose tests/ subdirectory is absent, without raising.
  - >-
    rec-3551's own acceptance command passes verbatim; both node ids it names resolve.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run rec-3551's acceptance command verbatim -- the rec's own closure oracle. Both node ids
      are absent today (TestBudgetVerdict and TestCountTestModules do not exist), so this is a
      genuine red-before probe, not a re-run of an already-passing file.
    command: bin/venv-python -m pytest tests/checks/deps/test_selection_budget.py::TestBudgetVerdict::test_hard_fail_reflects_exit_code tests/checks/deps/test_selection_budget.py::TestCountTestModules::test_returns_zero_when_tests_dir_absent
    expected: >-
      exit 0; 2 passed. Before the change this exits 4 with a pytest "not found" collection error.
    fix_if: >-
      A node id does not resolve -- the class or method name diverges from rec-3551's acceptance
      string. Rename the test to match the rec verbatim rather than editing the rec.
    hermetic: true
    graduation: graduate
    graduation_check_id: selection-budget-branch-tests-present
  - step: 2
    phase: pre-deploy
    action: >-
      Assert 100% per-file coverage through the same baseline-aware code path the full-tier gate
      uses (rec-943 parent-directory --cov spec included). The tool prints DIAGNOSTIC VERDICT when
      run standalone; step 3 runs the authoritative gate. Do not
      substitute a hand-rolled "pytest --cov=... --cov-fail-under=100": the parent-directory form
      that rec-943 mandates measures the whole scripts/checks/deps package, so --cov-fail-under
      fails at ~27.8% regardless of this file (verified at planning time).
    command: bin/venv-python -m scripts.test_coverage_checker --check-coverage --files scripts/checks/deps/selection_budget.py
    expected: >-
      exit 0. Today this exits 1 with "scripts/checks/deps/selection_budget.py: 98.4% line
      coverage (expected 100%)" -- the exact string rec-3551 cites.
    fix_if: >-
      Still short of 100%: read the reported Missing line numbers and add the covering assertion.
      Never register the file in config/coverage_baseline.yaml to obtain green -- that is a
      Decision 181 gate-weakening, and Decision 159 clause 3 gates any new sub-100 entry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an already-permanent gate. validate_test_coverage enforces this identical
      per-file oracle in the full tier for any diff touching this file, so a graduated second
      per-file coverage invocation would pay a pytest fork on every registry run to re-assert what
      the full tier already asserts. Step 1's test_selector guard covers the residual case the
      full-tier gate misses (the tests being deleted without selection_budget.py being touched).
  - step: 3
    phase: pre-deploy
    action: >-
      Discharge the handoff obligation with a real full-tier run. This is the step whose
      NON-EXECUTION on PR #1063 is this rec's systemic root cause -- the plan declared it and
      nothing verified it ran. Run it to completion and read the Validation Summary.
    command: bin/venv-python -m scripts.validate
    expected: exit 0; no "Coverage below 100%" entry in the Validation Summary.
    fix_if: >-
      A full-tier-only failure is in scope for this plan to fix on the branch -- it is precisely
      the signal that would otherwise land on main as a fresh ci_rca rec. Never skip a test, relax
      an assertion, or add a baseline or budget entry to get green. A failure unrelated to this
      plan's scope becomes a recommendation via scripts.ops_data_portal, not an inline fix
      (Decision 59 LOCATION invariant, Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-
      After squash-merge with a "Resolves: rec-3551" trailer, confirm rec-autoclose closed the rec
      in the warehouse (closure obligation for a rec-resolving plan).
    command: bin/venv-python -m scripts.sync.ops sync && grep rec-3551 logs/.recommendations-log.jsonl | grep -c closed
    expected: >-
      Non-zero count -- the rec-3551 row in the refreshed read cache carries closed status.
    fix_if: >-
      Still open: the Resolves trailer was missing or malformed in the squash-merge body. Close it
      via bin/venv-python -m scripts.ops_data_portal --update-rec rec-3551, never by editing the
      local cache (AGENTS.md read-cache-is-never-a-write-source invariant).
test_obligations:
  - source: tests/checks/deps/test_selection_budget.py
    behavior: >-
      selection_budget.py's BudgetVerdict.hard_fail property stays exercised, so it does not
      silently revert to uncovered. Scoped to match the single selector below (the schema accepts
      exactly one); the sibling count_test_modules branch is guarded by the same linked VP step 1,
      whose command names both node ids, and by acceptance criterion 3.
    verification_step: 1
    test_selector: tests/checks/deps/test_selection_budget.py::TestBudgetVerdict::test_hard_fail_reflects_exit_code
    red_green_expectation: >-
      red before, green after -- the node id does not resolve today (pytest exits 4, "not found"),
      and passes once the class is added.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Add tests; never add a config/coverage_baseline.yaml entry for selection_budget.py. Baselining
    to obtain green is a Decision 181 CONTENT-invariant gate-weakening, and Decision 159 clause 3's
    tamper guard requires a raise-approved marker for any new sub-100 entry -- those two are the
    SHIPPED controls that bind. T2.55:c1 points the same way but is forward intent only (T2.55 is
    not_started, c1 open), so cite it as direction, never as an enforcing gate. Decision 159's
    roster is a one-time grandfather, not precedent.
  - >-
    Do not modify scripts/checks/deps/selection_budget.py. The source is correct; only its test
    coverage is short. Editing the source to delete the uncovered branches would change behaviour
    to satisfy a coverage metric.
  - >-
    Tests colocate at the Decision 131 mirror path already in use
    (tests/checks/deps/test_selection_budget.py); do not create a second test home.
  - >-
    Class and method names must match rec-3551's acceptance string verbatim -- that string is the
    rec's closure oracle and rec-autoclose replays it.
  - >-
    Out of scope: the prevention mechanism. It is owned by rec-3232 (see context) and is a
    separate plan by explicit human decision at the Step 6b fork.
