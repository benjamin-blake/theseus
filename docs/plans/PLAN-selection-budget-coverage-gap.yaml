    Decision 177. Decisions triaged: 135 of 135. Roadmap items intersected: 25; CONFLICT: 2;
    RELATED: 22.
  - >-
    "gates: decision-scout=FLAGS_FOUND; plan-critique=PROCEED after 1 round(s); 5 should-fix findings applied"
  - >-
    Scout flags Decision 182 [WARN], Decision 153 [SPIRIT], Decision 103 [WARN], Decision 128
    [WARN], T3.7 [CONFLICT], T3.9 [CONFLICT] attach to the DEFERRED prevention half, not here --
