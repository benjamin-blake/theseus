schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "skills-layer-prose-relocation"
intent: >-
  Discharge T2.56 c1's last undischarged conjunct -- the Layer 4 skills surface -- by relocating
  restated procedure and field semantics out of the two outlier SKILL.md entry files into the
  contracts that already own those subjects, leaving anchored read-triggers, and ratcheting
  config/prose_budgets.yaml down so the shrink is durable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-skills-layer-prose-relocation.yaml
phase: >-
  T2.56 Normative / contract / ADR layering -- follow-on closing the last open criterion (c1).
  c2 was met 2026-08-31 (PLAN-decision-corpus-stock-ceiling-retirement / Decision 179); c1's
  AGENTS.md and terraform/CLAUDE.md conjuncts were met 2026-09-01
  (PLAN-ambient-prose-contract-relocation). This plan closes the third.
closes_criteria:
  - "T2.56:c1"
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Relocate SIX restated sections (Candidate Decision Ratification, Data-Model Assessment,
      Recommendation Relevance Gate, Main Divergence Assessment, Follow-on /plan mode, Tier Item
      Freshness Gate) to their subject-owning contracts, leaving heading + tiered read-trigger +
      anchored pointer. 14,586 b movable by the measurement method in constraints -- NOT the
      18,043 b SEVEN-section total (the six relocated sections measure 15,002 b), which counts headings and pinned sub-blocks that
      cannot move. "## Infrastructure & Lambda Assessment" is deliberately NOT relocated (round-4
      J1): of its 3,041 b only 708 b is movable, 1,241 b is pinned verbatim by the graduated shard
      planning-skill-lambda-deploy-channel-guidance-present, 820 b is the CD.35 pointer, and 216 b
      has no destination -- the carve-outs cost more than the move buys.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Relocate the Tier_item bookkeeping walk (11,610 b movable of 11,666 b) and the CD
      Ratification Bookkeeping body at lines 417-466 (3,963 b movable of 4,420 b -- the heading
      and preamble at 410-416 stay, and they carry the candidate-decision-ratification.yaml
      basename that contract's agent_surface evaluator resolves on), leaving the same stub shape.
  - file: docs/contracts/tier-item-lifecycle.yaml
    action: Create
    purpose: >-
      New Class D contract receiving the procedural residue only -- the bookkeeping Walk, the
      THREE-STEP BODY of Decomposition-hint exemption inheritance (find the parent / inherit the
      flag / read-only resolution), Replacement closure check, Parallel-with-code-review state
      machine, Follow-on /plan mode and Tier Item Freshness Gate. The Decomposition-hint split is
      load-bearing and exact: tests/test_implement_skill_decomposition_hints.py slices
      "## Tier_item bookkeeping" to the next "## " and requires, INSIDE that slice, the heading
      "### Decomposition-hint exemption inheritance" plus the tokens decomposition_hints,
      atomic_plans, bootstrap_completion_exempt, read-only, T-1.12, T1.12 and inherit -- those
      stay as a one-sentence stub carrying all seven; only the procedure moves. CORRECTION
      (round 8, verified by execution): an earlier round claimed the tokens must appear ONLY in
      that subsection because test_assertion_helper_has_teeth is a mutation test. That mechanism
      is FALSE -- the strip regex removes the header, and assert_inheritance_documented raises at
      `assert header in section` BEFORE inspecting any token, so token leakage elsewhere in the
      slice cannot make the mutant green (confirmed: leaking all seven tokens still raises). The
      real requirement is simply that the header and all seven tokens live inside the
      "## Tier_item bookkeeping" slice, pinned by test_inheritance_clause_present_in_live_skill
      and the co-location test. No contortion is needed in wording the read-trigger. Its
      contract.description states why it is not a second home for exit-criteria-ledger.yaml's
      subject, and both files carry a pointer to the other. Its governance prose must ALSO name
      the Decision 181 residual this plan creates and leaves unowned: validate_skill_prose_relocation
      verifies a stub EXISTS with an anchored pointer and a tier word, but NOTHING verifies an
      agent actually followed the pointer -- a mandatory read-trigger is an agent obligation, not
      a mechanically enforced one. Declare it in the residuals shape exit-criteria-ledger.yaml
      already uses for plan_followon_recs (residual + named owner), with rec-3748 as the owner
      since a clause-to-check index is the mechanism that would eventually close it. It must ALSO
      justify the one body
      whose subject is not tier-item lifecycle -- "Parallel-with-code-review state machine", an
      implement-time concurrency protocol housed here because the artefact it stages is the
      roadmap edit the rest of this contract governs. Naming that explicitly is what keeps the
      file a subject, not a grab-bag (round-7 F5). If the justification will not write cleanly,
      leave the state machine inline instead: implement carries 7,318 b of margin, so retaining
      it is free. Projected size: ~15.5 KB of relocated
      prose is roughly 190 content lines at this repo's YAML wrap plus envelope and
      amendment_log. At this repo's MEASURED contract density (59.5-65.3 b per effective line
      across file-router, git-ops, exit-criteria-ledger, candidate-decision-ratification and
      verification-registry) that is ~255-280 effective lines, not the ~230-260 a naive 80 b/line
      estimate gives -- still comfortably inside the 500 limit.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Receive the criterion-level FIELD SEMANTICS half -- closes_criteria flip rules and the
