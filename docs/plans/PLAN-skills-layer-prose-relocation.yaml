constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    RELOCATE, never rewrite. Moved prose keeps its wording; a semantic change disguised as a
    relocation defeats the no-content-lost verification and the plan-critique honesty check.
  - >-
    Never weaken a check or a standing test to make a relocation land -- restore the pinned
    token in the surviving stub instead (docs/contracts/implement-scope-boundary.yaml CONTENT
    invariant).
  - >-
    ONGOING COST, stated so it is chosen rather than discovered (round-8 I4): equality-seeding
    both S4 entries means every future edit to either skill must re-seed config/prose_budgets.yaml
    in the SAME commit or red both validate_prose_limits and the graduated
    planning-skill-surfaces-fallback-reevaluation shard. Every other S4 entry today carries 4-72 b
    of slack, so this is a new and stricter regime for the two files most likely to be edited. It
    is the registry's intended design and the ratchet only works this way -- but it is a standing
    friction on the hot path, not a one-time win.
  - >-
    Never raise a prose budget, a structural size budget, or a contract-population ratchet pin
    in this plan. The declared valves are, in order: relocate more (the Preflight Constraints
    overflow valve), and compact amendment_log history. Both budget registries here ratchet
    down only.
  - >-
    Never split a SKILL.md into @-imported fragments (Decision 110/114 anti-fragmentation). The
    sanctioned S4 valves are relocation to a contract and deferral to an auxiliary file the
    surface points at -- and a new .md under .claude/skills/ would fail validate_prose_allowlist
    anyway, since .claude/skills/**/SKILL.md is the only allowed glob there.
  - >-
    exit-criteria-ledger.yaml and verification-registry.yaml are Class A ritual contracts:
    ContractDocument is extra="forbid" over a closed top-level key set, so neither may receive a
    new top-level key. Field-level semantics and audit_invariants are their only receiving surfaces.
  - >-
    A new Class D contract may never declare status active (grandfather-only, closed at birth).
    Use ratified with ratified_via naming this plan, per git-ops.yaml's precedent.
  - >-
    Every stub pointer names file#anchor, never a bare filename, and every stub's tier
    (mandatory | conditional) comes from layer4_relocation_map -- the check reads the map, not
    hardcoded sentences, so a later re-wording is a map edit rather than a ratchet fight.
  - >-
    MEASUREMENT METHOD (round-4 J1/J3 -- this plan twice pinned derived byte counts that were
    wrong, because it measured whole sections). A section's MOVABLE bytes are its total, minus its
    own heading line, minus every sub-block pinned in place by a graduated registry shard, a
    standing test, or this plan's own acceptance criteria. Re-derive with: read the SKILL.md,
    slice each named section from its "## " heading to the next "## ", subtract len(heading line)
    and the pinned spans, and project as current_bytes - sum(movable) + (stub_count * 260), where
    260 b is the per-section allowance for heading + imperative read-trigger + anchored pointer.
    Authoring-time output, which the implementer MUST re-run and record rather than copy: planning
    movable 14,586 over 6 sections -> 42,731 (margin 2,269); implement movable 15,573 over 2 ->
    32,682 (margin 7,318); per-section movable planning = 3,060 / 2,224 / 1,655 / 1,343 / 2,423 /
    3,881 and implement = 11,610 / 3,963. Every byte figure in this plan is an output of this
    method. HONEST SHORTCUT, stated because this plan has three times shipped derived figures
    that were wrong: the published per-section figures are total MINUS HEADING ONLY -- they do NOT
    subtract the pinned spans the method names (the 2,492 b "### Decomposition-hint exemption
    inheritance" subsection, the 302 b "### closes_criteria / followon_recs field format" block,
    the sole docs/contracts/exit-criteria-ledger.yaml mention, the substantive _joins.yaml
    mention). Those retained bytes -- roughly 350-450 b in planning -- are absorbed by the stated
    margins, so feasibility is unaffected. The implementer MUST re-run the full method, subtract
    the pinned spans, and record actuals; treat the figures above as a heading-subtracted upper
    bound, never as the answer.
  - >-
    Registering validate_skill_prose_relocation touches SEVEN surfaces, not the three
    plan_obligations models. Read scripts/checks/registry.py:10-31 for the authoritative list
    rather than trusting this restatement: the check module itself; its @register decoration; its
    domain _manifest.py Entry (plus a Decision 187 tier-demotion marker if an Entry is demoted --
    this plan demotes none); its config/ci_rca_taxonomy.yaml row; a graduated registry shard per
    graduate-disposition VP step; its mirror test, which validate_red_case_floor requires to carry
    a genuinely failing path; and Decision 170's examined()/skipped() accounting declaration on
    every reachable exit path -- the one a stale plan-obligations.yaml will not remind you of, and
    the reason rec-3747 exists.
  - >-
    docs/contracts/_joins.yaml's agent_surface evaluator names planning/SKILL.md and resolves on
    the sole _joins.yaml mention at :259, inside the relocated Data-Model Assessment. Its
    surviving stub must therefore name _joins.yaml SUBSTANTIVELY -- inside the imperative
    read-trigger, naming the join/correlation-key obligation it governs -- never as a token kept
    alive to satisfy the checker. Upgrading that evaluator to a {check: ...} form is real work on
    a contract this plan does not otherwise touch, so it stays out of scope; the disposition here
    is to keep the evidence relation honest, not to strengthen it.
  - >-
    scripts/checks/contracts/validate_skill_prose_relocation.py MUST carry the literal
    "docs/contracts/tier-item-lifecycle.yaml" as a module-level executable-context string --
    the _CONTRACT_REL_PATH idiom at validate_git_ops_contract.py:18. This is not stylistic:
    _population.py's _evaluator_resolves calls module_contains_literal(module, basename) and
    excludes docstrings and # comments, so a purely map-driven module (whose only literal is
    instruction-architecture.yaml, with tier-item-lifecycle.yaml appearing solely as YAML data
    in a destination value) makes the new contract's evaluator UNRESOLVABLE and fails
    validate_contract_drift. Reconcile with the map-driven rule by reading the map FROM the
    named literal path constants -- the map still supplies tiers and destinations; only the two
    contract paths are literals.
  - >-
    file-router.yaml amendment_log compaction is date-and-citation preserving: compact the four
    oldest entries -- the two dated 2026-08-13 and the two dated 2026-08-16 -- by shortening
    their summary bodies, never by deleting an entry, and keep every date and every
    Decision/plan citation intact. Governance history is compacted, never dropped. The file is
    at 478 of 500 effective lines, so a route (~7) plus its own amendment_log entry (~5) fits
    even unaided; compaction is margin, not necessity.
  - >-
    c1 DISPOSITION (round-4 J2, stated not implied): c1 reads "retrievable by pointer rather than
    loaded ambiently", and the mandatory share stays ambient with an added hop. This plan flips c1
    to met with the split recorded in the progress_note rather than rewriting c1, because the
    exit-criteria truth-maintenance rule fires on a criterion whose MECHANISM was realized
    differently -- and c1's mechanism (relocate to contracts, retrieve by pointer) is exactly what
    shipped. What is partial is the criterion's stated BENEFIT for the mandatory share, which is a
    disclosure obligation, not a mechanism mismatch. Rewriting c1 to describe its own partial
    benefit would also rewrite the AGENTS.md and terraform/CLAUDE.md conjuncts already closed
    under it. If a later reader disagrees, the progress_note carries the measured split to reopen
    on.
  - >-
    T2.56 c1 covers Layer 1 (both consumers) and Layer 4 (interactive only). Layer 5
    (config/agent/executor/**) is outside c1 by instruction-architecture.yaml's consumer table
    and is owned by rec-3718 -- do not shrink executor prompts in this plan.
