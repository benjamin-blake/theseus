schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "skills-layer-prose-relocation"
intent: >-
  Discharge T2.56 c1's last undischarged conjunct -- the Layer 4 skills surface -- by relocating
  restated procedure and field semantics out of the two outlier SKILL.md entry files into the
  contracts that already own those subjects, leaving anchored read-triggers, and ratcheting
  config/prose_budgets.yaml down so the shrink is durable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-skills-layer-prose-relocation.yaml
phase: >-
  T2.56 Normative / contract / ADR layering -- follow-on closing the last open criterion (c1).
  c2 was met 2026-08-31 (PLAN-decision-corpus-stock-ceiling-retirement / Decision 179); c1's
  AGENTS.md and terraform/CLAUDE.md conjuncts were met 2026-09-01
  (PLAN-ambient-prose-contract-relocation). This plan closes the third.
closes_criteria:
  - "T2.56:c1"
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Relocate seven restated sections (Candidate Decision Ratification, Data-Model Assessment,
      Recommendation Relevance Gate, Infrastructure & Lambda Assessment, Main Divergence
      Assessment, Follow-on /plan mode, Tier Item Freshness Gate; 18,043 b measured) to their
      subject-owning contracts, leaving heading + tiered read-trigger + anchored pointer.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Relocate the Tier_item bookkeeping walk (11,666 b) and the CD Ratification Bookkeeping
      Protocol / Batch-wave / Rejection-handling bodies (4,420 b), leaving the same stub shape.
  - file: docs/contracts/tier-item-lifecycle.yaml
    action: Create
    purpose: >-
      New Class D contract receiving the procedural residue only -- the bookkeeping Walk,
      Decomposition-hint exemption inheritance, Replacement closure check, Parallel-with-
      code-review state machine, Follow-on /plan mode and Tier Item Freshness Gate. Its
      contract.description states why it is not a second home for exit-criteria-ledger.yaml's
      subject, and both files carry a pointer to the other.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Receive the criterion-level FIELD SEMANTICS half -- closes_criteria flip rules and the
      exit-criteria truth-maintenance (realized-differently) rule -- into the existing status /
      met_by field entries and audit_invariants. Class A: the top-level key set is closed
      (ContractDocument extra="forbid"), so no new top-level key may be added here.
  - file: docs/contracts/candidate-decision-ratification.yaml
    action: Modify
    purpose: >-
      Expand the EXISTING lane_steps.plan.draft and lane_steps.implement.execute keys (present
      at line 198) with the relocated protocols. Leaf values stay scalar strings or lists --
      never a mapping-of-mappings carrying Class A descriptor keys. The same smuggling_detection
      constraint binds the NEW tier-item-lifecycle.yaml and every other Class D destination in
      this plan, not only this file.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Receive the design-time data-model walk beside the rules it already enumerates, AND amend
      this file's own header self-description in the same edit -- it currently states it
      "ENUMERATES ... and INDEXES the existing detailed sources rather than absorbing them",
      which absorbing the walk makes false.
  - file: docs/contracts/recommendation-relevance.yaml
    action: Modify
    purpose: Receive the planning-time relevance gate protocol beside the verdict enum.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      MERGE the main-divergence assessment INTO the existing
      rebase_phase_distinction.assessment_time key, which already states the same rule verbatim
      -- do NOT add a sibling key, which would recreate exactly the Decision 86 second-home risk
      this plan exists to close. Update referenced_repo_paths if the merged text names a repo
      path not already listed, since that list is what validate_git_ops_contract verifies.
  - file: docs/contracts/build-lambda.yaml
    action: Modify
    purpose: >-
      Receive the LAMBDA-DEPLOYMENT half of the Infrastructure & Lambda Assessment only, beside
      deploy_channels. The CD.35/T2.21 speculative-plan paragraph is NOT relocated: it is
      already nothing but a pointer at environment-taxonomy.yaml ("the sole SoT ... Do not
      re-derive the mechanics here"), so moving it into a contract whose subject is
      build-lambda would be churn plus a topic-equals-subject regression (Decision 168 clause
      4). That paragraph stays in the surviving stub. One body, one destination.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      Add layer4_relocation_map -- the machine-readable table whose row schema is exactly five
      fields: stub_heading, surface (which SKILL.md the stub lives in), destination
      (file#anchor), enforcing_check, tier (mandatory | conditional) that the new check and its mirror test both read from, so
      the clause-to-check binding is data rather than prose and seeds T2.54 rather than
      diverging from it. Precedent: this file already received relocated decision-scout skill
      body as gate_subagent_retrieval (2026-09-03).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Route tier-item-lifecycle (topic equals subject) and compact amendment_log in the same
      edit -- the file measures 478 of 500 effective lines, so the route plus its own mandatory
      amendment_log entry must be paid for by compaction, never a raise.
  - file: scripts/checks/contracts/validate_skill_prose_relocation.py
    action: Create
    purpose: >-
      Registered check enforcing the relocation invariants over BOTH skills, driven by
      layer4_relocation_map: entry files under budget, relocated sentences not re-inlined,
      every stub present with its declared tier wording and anchored pointer, every
      agent_surface anchor basename surviving. Replaces the weaker agent_surface-only
      evaluator the scout flagged under Decision 181.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Register the new check Entry so it resolves in pre_sequence()/full_sequence().
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: Add the function_to_category row every registered check must carry.
  - file: tests/checks/contracts/test_validate_skill_prose_relocation.py
    action: Create
    purpose: Mirror test for the new check module (red before the module lands, green after).
  - file: .claude/skills/orient/SKILL.md
    action: Modify
    purpose: >-
      Re-point FOUR references whose targets relocate: lines 66 and 68 (the Freshness Gate as
      "the single authoritative definition ... in the planning skill", and the do-not-re-author
      note) and lines 93 and 105 (the planning skill's "Candidate Decision Ratification"
      section). Each must name the destination contract anchor instead. Pointer-swap only; the
      file measures 23,258 b against a 23,278 b budget -- only 20 b of headroom, and lines 93 and
      105 net-GROW under a longer contract anchor. Declared valve for this file (constraint 4's
      valves do not apply): trim the two re-pointed sentences at 93 and 105 so the file stays at
      or under 23,278 b. VP step 13 asserts the bound.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Re-point two references whose bodies relocate: line 22 (Main Divergence Assessment ->
      git-ops.yaml) and line 56 (Data-Model Assessment -> data-modeling-standard.yaml). The stub
      headings survive, so neither reference DANGLES -- this is a reachability re-point so a
      reader of the command file reaches the authoritative body in one hop. Layer 3 is
      measured-only under Decision 127 (no prose budget entry), so the edit is budget-free.
  - file: .claude/commands/orient.md
    action: Modify
    purpose: >-
      Re-point line 104's "Recommendation Relevance Gate" at recommendation-relevance.yaml. As
      with plan.md the stub heading survives, so this is reachability, not a dangling fix. Layer
      3, budget-free.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Re-point line 204's "the implement skill's Tier_item bookkeeping walk", which becomes
      semantically stale once the walk lives in tier-item-lifecycle.yaml. Class A ritual
      contract: the edit lands inside the existing governance_notes string, adding NO top-level
      key, and carries an amendment_log entry.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Re-seed both S4 entries at the measured post-relocation byte counts and delete their now
      obsolete "# raise-approved: dec-150" markers. Decreases and marker removal on a decrease
      are unrestricted (validate_prose_budget_raises gated_direction "up").
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated amendment trailer on Decision 150 only. Clauses 1-2 name the planning skill's Step-5b
      Significance-Gate note and the implement skill's batch-wave clause by LOCATION. Only clause
      2's body relocates -- the Decision Significance Gate section clause 1 names
      (planning/SKILL.md:353-376) is NOT in this plan's relocation list, so the trailer annotates
      clause 1's now-imprecise phrasing rather than claiming it moved. The Decision's own routing
      already says the exact shape lives in candidate-decision-ratification.yaml, so intent
      survives (decision-entry.yaml amendment_forms). Amendment-only: no new numbered Decision, so
      the category-consistency gate does not fire. Size note: the entry already spans 6,219 b
      against a 6,144 b per-entry cap, so the trailer fires the WARN-tier
      accretion_signal.amendment_delta_leg, which never appends to the failed list (the hard-fail
      leg is new-in-diff only) -- do not attempt to stay under a cap the entry already exceeds.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Stage exit-criteria truth maintenance on THREE complete items whose bare-string criteria
      assert the relocated bodies live inside the skills -- T-1.21 c1 (Freshness Gate section
      "with the four checks"), T-1.22 c1 (Replacement closure check) and c2 (exit-criteria
      truth-maintenance rule), T3.8 c4 -- NOT c3, which is about deterministic auto-close -- whose text reads "A rec-side freshness gate exists in the planning skill (analogue of the T-1.21 Tier Item Freshness Gate), and the implement skill re-checks a bundled rec's relevance before implementing it".
      Rewrite each to the realized pointer-plus-contract mechanism, preserving the original
      wording in the item note. This is obligated by the very rule this plan relocates
      (implement/SKILL.md: a criteria-vs-reality mismatch on an already-complete item stages a
      criteria rewrite, never a silent pass). Touching these items forces their bare-string
      criteria into the structured ledger, since validate_platform_roadmap forbids a touched
      item retaining bare strings -- budget for all twelve criteria across the three items. Also
      re-ground T2.56 files_in_scope (it names AGENTS.md / docs/decisions-index.json /
      docs/contracts/ / terraform/CLAUDE.md and omits the skills layer c1 names) and append the
      progress note recording measured shrink, the seven untouched Layer 4 files, the Layer 5
      out-of-scope statement, and rec-3718.
bundled_recommendations:
  - "rec-3378"
followon_recs:
  - "rec-3718"
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .claude/skills/planning/SKILL.md measures under 45,000 bytes (from 55,757) and
    .claude/skills/implement/SKILL.md under 40,000 bytes (from 47,735) -- rec-3378's acceptance
    command passes, and rec-3378 reaches status closed after merge.
  - >-
    config/prose_budgets.yaml's two S4 entries EQUAL the measured post-relocation byte counts
    and carry no raise-approved marker, so the ratchet locks the shrink in rather than leaving
    headroom validate_prose_limits treats as a non-blocking advisory.
  - >-
    Every repo path and every contract basename named in the relocated prose at origin/main is
    still named either in the surviving stub or in its destination contract -- no content lost
    in transit.
  - >-
    The two agent_surface evaluator anchors survive: planning/SKILL.md still names _joins.yaml
    (its only occurrence today is inside the relocated Data-Model Assessment) and
    implement/SKILL.md still names candidate-decision-ratification.yaml, so neither contract's
    evaluator stops resolving under validate_contract_drift.
  - >-
    Every string a graduated registry entry or a standing test pins verbatim in either skill
    survives: the "Deploy channel by artifact class (Decision 125)" heading; the single PLAN
    template section and its fifteen surfaced field names; the "### Decomposition-hint exemption
    inheritance" header with its seven tokens inside the bookkeeping section; the shared venv_ok
    row verbatim in BOTH skills; "### Deviation trigger" free of auto-file tokens; "### Pre-Push
    Rebase"; "implement-scope-boundary.yaml"; "implementation_declared"; the single
    "bin/venv-python -m scripts.validate" occurrence inside the Step 7 closure; "fails
    plan-critique 12k"; "context: # <= 40 rendered lines"; the Confirmation Gate block's pointer
    plus its two forbidden restatements; and -- all three inside relocated sections, so all three
    at real risk -- the heading "### closes_criteria / followon_recs field format", the sole
    occurrence of "docs/contracts/exit-criteria-ledger.yaml" anywhere in planning/SKILL.md (both
    pinned by tests/test_workflow_skill_antidrift.py), and the heading
    "### Parallel-with-code-review state machine" (required by VP step 13's stub-heading leg).
  - >-
    Each relocation stub carries an anchored pointer naming file#key, never a bare filename, and
    exactly three mandatory-read stubs exist in planning (data-model grain, ratification draft,
    tier-item freshness gate) and two in implement (bookkeeping walk, ratification execute);
    every other stub is conditional.
  - >-
    docs/contracts/instruction-architecture.yaml's layer4_relocation_map carries the five-field
    row schema (stub_heading, surface, destination, enforcing_check, tier) and is complete in
    both directions -- every surviving stub appears in the map and every map row resolves to a
    live stub heading, a live destination anchor, the registered check name and a valid tier.
  - >-
    validate_skill_prose_relocation is registered, resolves in both pre_sequence() and
    full_sequence(), carries a config/ci_rca_taxonomy.yaml row, and fails on a re-inlined
    relocation (proved red-then-green by the mirror test).
  - >-
    docs/contracts/tier-item-lifecycle.yaml's {check: validate_skill_prose_relocation} evaluator
    RESOLVES under scripts/checks/contracts/_population.py::_evaluator_resolves -- the check
    module carries the contract's path as an executable-context literal, and the mirror test has
    a case asserting the resolver returns True for it.
  - >-
    Every edited and created contract stays at or under 500 effective lines with no new entry in
    config/structural_size_budgets.yaml -- docs/contracts/file-router.yaml specifically, whose
    route plus amendment_log entry is paid for by amendment_log compaction in the same edit.
  - >-
    The new contract declares class D, status ratified, ratified_via this plan, a resolving
    {check: validate_skill_prose_relocation} evaluator and a file-router route whose topic
    equals its subject, so contract-population.yaml's grandfathered_max and status_active_max
    stay 16/16 with no raise marker.
  - >-
    Every edited Class D contract carries a new amendment_log[] entry (change_detection.
    amendment_log fails a canonical-dump change without one), and exit-criteria-ledger.yaml
    receives no new top-level key.
  - >-
    The three complete tier_items whose criteria assert a relocated body lives in a skill --
    T-1.21 c1, T-1.22 c1 and c2, T3.8 c4 -- are rewritten to the realized pointer-plus-contract
    mechanism with the original wording preserved in each item's note, and all twelve criteria
    across those three items are migrated to the structured ledger as validate_platform_roadmap
    requires of a touched item.
  - >-
    T2.56 c1 flips to met with met_by naming this plan's slug, and the item's progress_note
    records the measured shrink, the seven untouched Layer 4 skill files with sizes, the
    statement that Layer 5 (config/agent/executor/**) is outside c1 by
    instruction-architecture.yaml's consumer table, rec-3718 as the Layer 5 owner, AND the
    mandatory/conditional split -- so a later reader of "T2.56:c1 = met" sees that 25,474 of the
    34,129 relocated bytes stay behind mandatory read-triggers (18,043 + 16,086 relocated;
    9,388 + 16,086 mandatory), i.e. that this criterion bought de-duplication for that share
    rather than ambient-load reduction.
  - >-
    bin/venv-python -m scripts.validate --pre exits 0, AND the full tier
    bin/venv-python -m scripts.validate exits 0 before commit
    (handoff_policy.full_validation_required_before_commit).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure both S4 entry files against rec-3378's thresholds.
    command: "test $(wc -c < .claude/skills/planning/SKILL.md) -lt 45000 && test $(wc -c < .claude/skills/implement/SKILL.md) -lt 40000"
    expected: exit 0 -- planning under 45,000 bytes and implement under 40,000 bytes.
    fix_if: >-
      Either file is still over. Relocate the declared overflow valve -- Preflight Constraints
      out of BOTH skills into a second Class D contract, KEEPING the venv_ok row verbatim in
      each (test_workflow_skill_antidrift pins it in both). Never trim semantics and never raise
      a prose budget.
    hermetic: true
    graduation: graduate
    graduation_check_id: skills-layer-entry-files-under-target
  - step: 2
    phase: pre-deploy
    action: >-
      Assert each S4 budget entry EQUALS its file's measured bytes and no longer carries a
      raise-approved marker.
    command: >-
      bin/venv-python -c "import pathlib,re,sys;
      raw=pathlib.Path('config/prose_budgets.yaml').read_text();
      S=['.claude/skills/planning/SKILL.md','.claude/skills/implement/SKILL.md'];
      rows={s: re.search('^ +'+re.escape(s)+r': *(\d+)(.*)$', raw, re.M) for s in S};
      bad=[s for s in S if rows[s] is None or int(rows[s].group(1)) != len(pathlib.Path(s).read_bytes())
      or 'raise-approved' in rows[s].group(2)];
      print('entries not equal-to-measured, or still marked:', bad); sys.exit(1 if bad else 0)"
    expected: >-
      exit 0 -- both entries equal the measured post-relocation byte counts exactly and carry no
      raise-approved comment. RED on the unchanged tree (55,792 != 55,757; 47,830 != 47,735;
      both markers present), so the step genuinely discriminates.
    fix_if: >-
      A named entry was not re-seeded to its measured size, or its obsolete dec-150 marker
      survives. Note validate_prose_limits alone cannot establish this -- it routes the
      under-budget case to a NON-blocking advisory that never reaches its failed list, which is
      why this step reads the registry directly.
    hermetic: true
    graduation: graduate
    graduation_check_id: prose-budgets-s4-entries-equal-measured-and-marker-free
  - step: 3
    phase: pre-deploy
    action: Assert both agent_surface evaluator anchors survive in their naming skill.
    command: "grep -q '_joins.yaml' .claude/skills/planning/SKILL.md && grep -q 'candidate-decision-ratification.yaml' .claude/skills/implement/SKILL.md"
    expected: exit 0 -- both basenames still present.
    fix_if: >-
      A missing basename breaks that contract's evaluator resolution under
      validate_contract_drift. Restore the mention inside the surviving stub -- _joins.yaml's
      only occurrence today is planning/SKILL.md:259, inside the relocated Data-Model Assessment.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both greps pass on origin/main (the two basenames are present there today), so the
      differential admission gate would correctly refuse the row as tautological. The assertion
      is durably carried instead by validate_skill_prose_relocation, whose own row
      (skill-prose-relocation-check-registered) DOES discriminate because the module is absent
      on origin/main.
  - step: 4
    phase: pre-deploy
    action: Run every standing test that pins verbatim content in either skill.
    command: "bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py tests/test_implement_skill_decomposition_hints.py tests/test_implementation_retrospective_skill_contract.py tests/test_plan_fork_classification_contract.py tests/test_prose_context.py tests/checks/prose/test_prose_limits.py -q"
    expected: all pass -- no pinned string, heading or token was lost or reworded in transit.
    fix_if: >-
      A failure names the exact pinned token. Restore it in the surviving stub rather than
      editing the test -- these guards are not weakened to make a relocation land
      (implement-scope-boundary.yaml CONTENT invariant).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Each of these six modules is already a standing regression guard that runs in the full
      tier, so a registry row re-running them would duplicate existing coverage rather than add
      a new guard -- and it would pass identically on origin/main, which the differential
      admission gate refuses.
  - step: 5
    phase: pre-deploy
    action: >-
      Execute the check_spec of every graduated registry shard that guards either skill, so the
      step proves their assertions still hold rather than only that the shards parse.
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_verification_registry import validate_verification_registry as f; e=[]; f(e); print(e); raise SystemExit(1 if e else 0)" && bin/venv-python -c "import yaml,pathlib,subprocess,sys,re;
      ids=['planning-skill-lambda-deploy-channel-guidance-present','planning-skill-surfaces-fallback-reevaluation','scope-boundary-deviation-trigger-adds-no-auto-file-path','scope-boundary-relocations-not-reinlined','implement-flow-sets-declaration','prose-allowlist-matcher-honors-recursive-double-star'];
      bad=[];
      spec=lambda i: yaml.safe_load(pathlib.Path(f'config/agent/verification_registry/entries/{i}.yaml').read_text());
      run=lambda c: subprocess.run(c,capture_output=True,text=True).returncode;
      [bad.append(i) for i in ids if (lambda s: (run(s['check_spec']['command'])!=0) if s['primitive_slot']=='command_exit_zero'
      else (len(re.findall(s['check_spec']['pattern'], pathlib.Path(s['check_spec']['path']).read_text()))<s['check_spec']['count'])) (spec(i))];
      print('shards failing:',bad); sys.exit(1 if bad else 0)"
    expected: >-
      exit 0 -- the registry validates and all SIX shards guarding these skills still pass their
      own assertions, including the two with real teeth against this plan
      (planning-skill-surfaces-fallback-reevaluation's budget + PLAN-template-section + fifteen
      field names, and scope-boundary-relocations-not-reinlined's surviving pointer and
      "### Pre-Push Rebase" heading).
    fix_if: >-
      A named shard means a relocation broke a graduated guard. Restore the asserted content in
      the surviving stub; never delete or edit a registry shard to make a relocation pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This step re-executes six EXISTING graduated records by id; a new registry row wrapping
      them would be a check whose whole content is "run these six checks", which the differential
      admission gate would correctly reject as adding no discrimination beyond its own members.
  - step: 6
    phase: pre-deploy
    action: Prove the new check discriminates, and that its registration surfaces resolve.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_skill_prose_relocation.py tests/checks/contracts/test__manifest.py -q && bin/venv-python -c "from scripts.checks.contracts.validate_skill_prose_relocation import validate_skill_prose_relocation as f; e=[]; f(e); print(e); raise SystemExit(1 if e else 0)" && bin/venv-python -c "from scripts.checks.ci_guards.validate_ci_rca_taxonomy import validate_ci_rca_taxonomy as f; e=[]; f(e); print(e); raise SystemExit(1 if e else 0)"
    expected: >-
      Mirror test passes (including its negative case re-inlining a relocated sentence into a
      fixture skill), the contracts-domain Entry aggregation test passes, the check exits 0
      against the live tree, and the ci_rca taxonomy row resolves.
    fix_if: >-
      A green negative case means the check is tautological -- it must genuinely discriminate a
      re-inlined tree from the relocated one, not merely assert the pointer exists.
    hermetic: false
    graduation: graduate
    graduation_check_id: skill-prose-relocation-check-registered
  - step: 7
    phase: pre-deploy
    action: >-
      Assert the layer4_relocation_map is complete in both directions AND that each destination
      anchor RESOLVES to a real key in the parsed destination YAML -- so a stub pointing at a key
      that never landed fails.
    command: >-
      bin/venv-python -c "import yaml,pathlib,sys; P=pathlib.Path;
      m=yaml.safe_load(P('docs/contracts/instruction-architecture.yaml').read_text()).get('layer4_relocation_map');
      sys.exit(1) if m is None and print('layer4_relocation_map absent from instruction-architecture.yaml') is None else None;
      sk={'planning': P('.claude/skills/planning/SKILL.md').read_text(), 'implement': P('.claude/skills/implement/SKILL.md').read_text()};
      def_res=lambda doc,keys: doc if not keys else (None if not isinstance(doc,dict) or keys[0] not in doc else def_res(doc[keys[0]], keys[1:]));
      bad=[];
      [bad.append(('unknown surface',r.get('stub_heading'))) for r in m if r.get('surface') not in sk];
      [bad.append(('stub heading absent',r.get('stub_heading'))) for r in m if r.get('surface') in sk and r['stub_heading'] not in sk[r['surface']]];
      [bad.append(('bad tier',r.get('stub_heading'))) for r in m if r.get('tier') not in ('mandatory','conditional')];
      [bad.append(('wrong check',r.get('stub_heading'))) for r in m if r.get('enforcing_check')!='validate_skill_prose_relocation'];
      [bad.append(('unanchored destination',r.get('stub_heading'))) for r in m if '#' not in str(r.get('destination',''))];
      rows=[r for r in m if '#' in str(r.get('destination',''))];
      [bad.append(('destination file missing',r['stub_heading'])) for r in rows if not P(r['destination'].split('#')[0]).exists()];
      [bad.append(('anchor key unresolved',r['stub_heading'])) for r in rows if P(r['destination'].split('#')[0]).exists()
      and def_res(yaml.safe_load(P(r['destination'].split('#')[0]).read_text()), r['destination'].split('#')[1].split('.')) is None];
      print('map rows:',len(m)); print('failures:',bad); sys.exit(1 if bad else 0)"
    expected: >-
      exit 0 -- every row carries the five-field schema, names a live stub heading in the surface
      it declares, and its destination anchor resolves as a dotted key path against the parsed
      destination YAML. A relocated body that never landed at its named key fails here.
