execution_steps:
  - >-
    Commit 1 (additive, near-zero risk) -- author docs/contracts/tier-item-lifecycle.yaml (class
    D, status ratified, ratified_via this plan, evaluator {check:
    validate_skill_prose_relocation}, subject tier-item-lifecycle, description stating why it is
    not a second home for exit-criteria-ledger.yaml and naming T2.54 as successor); add the
    relocated bodies to it and to exit-criteria-ledger.yaml, candidate-decision-ratification.yaml
    (expanding lane_steps), data-modeling-standard.yaml, recommendation-relevance.yaml,
    git-ops.yaml and build-lambda.yaml, each with its own amendment_log entry; add
    layer4_relocation_map to instruction-architecture.yaml; route the new contract in
    file-router.yaml and compact its amendment_log in the same edit; write
    scripts/checks/contracts/validate_skill_prose_relocation.py, its _manifest.py Entry, its
    config/ci_rca_taxonomy.yaml row and its mirror test. Run VP steps 7 and 10 here; step 6 cannot pass until commits 2-3 land the stubs the check asserts.
  - >-
    Commit 2 (planning removal) -- replace the seven relocated sections in
    .claude/skills/planning/SKILL.md with heading + tiered read-trigger + anchored pointer,
    preserving every pinned token named in the acceptance criteria (especially the _joins.yaml
    basename and the "Deploy channel by artifact class (Decision 125)" heading); re-seed the
    planning entry in config/prose_budgets.yaml at its measured size and delete its raise
    marker. Run VP steps 1-5, 8, 13.
  - >-
    Commit 3 (implement removal) -- do the same for the two relocated sections in
    .claude/skills/implement/SKILL.md, keeping the "### Decomposition-hint exemption
    inheritance" header and its seven tokens inside the surviving bookkeeping section and the
    candidate-decision-ratification.yaml basename; re-seed the implement entry and delete its
    raise marker; re-ground T2.56 files_in_scope and append the progress note. Run VP steps
    1-13.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; if a threshold is missed,
    take the declared overflow valve rather than a budget raise; on an unrecoverable failure
    stop and RCA (Decision 55).
  - >-
    Bookkeeping walk -- flip T2.56:c1 to met with met_by naming this plan's slug, then surface
    T2.56 as QUALIFYING for status complete (all criteria met) for operator confirmation; never
    auto-flip the item.
  - >-
    Commit flow -- single PR with the three commits above, Resolves: rec-3378 in the PR body so
    the squash-merge inherits it, VP compliance table appended, then subscribe and merge on
    green.
  - 'Report: what was implemented, verification results, and the measured post-relocation byte counts.'
rollback: >-
  Every change is additive-then-subtractive across three separable commits. Reverting commits 2
  and 3 restores both SKILL.md files and their budget entries with the destination contracts
  left in place (harmless duplication, the pre-existing state); reverting commit 1 as well
  returns the tree to origin/main. No data migration, no deploy, nothing outside git.
