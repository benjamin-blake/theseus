    validate_skill_prose_relocation}, subject tier-item-lifecycle, description stating why it is
    not a second home for exit-criteria-ledger.yaml and naming T2.54 as successor); add the
    relocated bodies to it and to exit-criteria-ledger.yaml, candidate-decision-ratification.yaml
