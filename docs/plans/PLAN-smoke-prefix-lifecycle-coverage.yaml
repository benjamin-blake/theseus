  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - "Scout flag dispositions: dec-103 WARN dissolved by inverting the split direction (stored oracles stay at their recorded node ids, so no acceptance relocation is needed); dec-131 NOTE pivoted (shared helpers hoisted to tests/fixtures/, not duplicated); dec-192 NOTE adopted (VP step 12 asserts reachability, not a storage delta); dec-187 WARN adopted (disposition table below)."
