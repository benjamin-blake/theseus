constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Decision 128/130 -- the 497/500 crossing is met by DECOMPOSITION. Do not add a
    config/sloc_budgets.yaml entry for either module, and do not run --update-sloc-budgets to seed one.
  - >-
    Decision 181 / docs/contracts/implement-scope-boundary.yaml CONTENT invariant -- the whole-block to
    per-rule reshape must be net-tightening. No assertion, budget or acceptance criterion may be weakened;
    every reshaped guard ships with a red case proving it discriminates.
  - >-
    Decision 187 -- no node id disappears inside a retirement. Every one of the twelve origin/main node
    ids is dispositioned in the context table as re-pointed, retained or reshaped.
  - >-
    Decision 103 -- do NOT relocate TestDataLakeLifecycleGoverned. Both rec-3892's and rec-3945's stored
    acceptance oracles name its current module path; moving it would make rec-3945 unprobeable to closure.
    The split moves the GC concern instead, which no stored oracle names.
  - >-
    Decision 119 -- no local terraform init/validate/plan for terraform/personal. Every terraform VP step
    is grep-only; CI's terraform-validate check and the speculative-plan job are authoritative.
  - >-
    Decision 126 -- infra intent is a PR touching terraform/**; CI plans and applies. Never a
    self-directed terraform apply.
  - >-
    Decision 66 -- call get_rec_write_guidance() BEFORE the rec-3892 update_rec composition, not after a
    rejection.
  - >-
    Decision 88 / warehouse-as-source-of-truth -- logs/.recommendations-log.jsonl is a read cache, never a
    write source. Both rec writes go through scripts.ops_data_portal.
  - >-
    grep, never rg, in every pre-deploy VP step (validate_vp_replay's _rg_portability_pre_pass).
  - >-
    noncurrent_days stays bound to SNAPSHOT_RETAIN_DAYS (30) for BOTH rules. Revisiting the retention
    window is rec-3870's business, not this plan's.
context:
