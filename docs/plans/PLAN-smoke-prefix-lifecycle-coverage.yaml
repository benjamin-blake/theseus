rollback: >-
  s3:DeleteLifecycleConfiguration is granted NOWHERE in terraform/ (recorded as _UNGRANTED_DESTROY,
  admin-tier), so removing the resource outright is both guard-BLOCKED and AccessDenied for the CI apply
  role. The in-band rollback is therefore to revert the second rule block in terraform/personal/main.tf
  and let CI apply the one-rule configuration, which is an UPDATE and auto-applies. Objects already
  expired are not recoverable by rollback; the smoke corpus is disposable by construction (the CI gate
  recreates it under force_recreate_tables on every push), which is why this rule is hygiene rather than
  a data-durability change.
