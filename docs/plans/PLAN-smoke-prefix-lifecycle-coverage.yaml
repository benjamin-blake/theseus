schema_version: 5
implementation_declared: false
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: smoke-prefix-lifecycle-coverage
intent: >-
  Close rec-3945 by extending the data-lake S3 lifecycle rule to the DuckLake smoke prefix, now that
  rec-3892's unexplained-deleter RCA is resolved, converting a declared exclusion into declared
  coverage without weakening any lifecycle assertion.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-smoke-prefix-lifecycle-coverage.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: terraform/personal/main.tf
    action: Modify
    purpose: >-
      Add a SECOND rule block to aws_s3_bucket_lifecycle_configuration.data_lake, prefix-scoped to
      "${local.ducklake_smoke_data_prefix}/" on the same shape as the production rule
      (noncurrent_version_expiration with noncurrent_days bound to SNAPSHOT_RETAIN_DAYS,
      expiration.expired_object_delete_marker true, abort_incomplete_multipart_upload, and NO
      current-version expiration). The trailing slash is load-bearing -- local.ducklake_prod_data_prefix
      is the bare string "ducklake", which also prefix-matches "ducklake-neon-smoke/", so the two
      prefixes stay separately declared and are never collapsed into one rule. Rewrite the header
      comment at :135, which currently states the exclusion rationale this plan retires.
  - file: tests/fixtures/terraform_hcl_blocks.py
    action: Create
    purpose: >-
      New home for the shared HCL-text helpers -- _find_resource_block (11 call sites, 10 of them GC-side)
      and _tf_dir_file_texts (8 call sites, ALL lifecycle-side; hoisted for cohesion with its siblings, not
      because the GC half needs it) -- PLUS a new
      brace-balanced `rule { ... }` splitter, which does not exist today and which AC 5 cannot be met
      without: rule bodies nest (filter, noncurrent_version_expiration, expiration,
      abort_incomplete_multipart_upload), so a flat rule\s*\{([^}]*)\} regex will not split them. Also hoist
      _TERRAFORM_PERSONAL_DIR, which BOTH halves need (:147 GC-side to derive _DR_TF; :367-428 lifecycle-side).
      Each reshaped guard is extracted here as a module-level PREDICATE the class method delegates to, so a
      red case can invoke the real guard and assert pytest.raises(AssertionError) instead of merely
      re-asserting that its own fixture was mutated -- the weakness the four existing red cases at :475-511
      carry.
      tests/fixtures/ is an importable package that
      does not start with "test_", so it is exempt by construction from validate_no_cross_test_imports
      (Decision 131 clause 2). Hoisted, never duplicated: two copies would be a second surface to drift.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    action: Modify
    purpose: >-
      Keep TestDataLakeLifecycleGoverned and TestDataLakeLifecycleRedCases IN PLACE so both stored rec
      acceptance oracles stay collectable at their recorded node ids (Decision 103). Move the GC/alarm
      concern out (see the sibling module). Reshape every lifecycle assertion from whole-resource-block
      matching to PER-RULE matching, remove ducklake_smoke_data_prefix from
      _DECLARED_LIFECYCLE_EXCLUSIONS, and add test_smoke_prefix_is_covered_not_excluded -- the node
      rec-3945's stored acceptance names, which does not yet exist. Import the hoisted helpers from
      tests.fixtures.terraform_hcl_blocks.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py
    action: Create
    purpose: >-
      Sibling module receiving the GC/alarm concern -- TestProductionGcRuleInvariants (107 SLOC),
      TestGcOpsEnablementBaseline (75), TestAlarmDescriptionsPinNoThreshold (48) and
      TestThresholdShapeRedCases (26). TestProductionGcRuleInvariants carries SEVEN test methods, not the five
      the registry names -- the two unregistered ones (test_liveness_alarm_period_product_stays_inside_the_putmetricalarm_cap,
      test_referenced_missing_alarm_treats_missing_data_as_not_breaching) move with the class and lose
      nothing. The alarm-side module helpers move too and have no consumer in the lifecycle concern:
      _ADMIN_TF, _SMOKE_TF, _ALARM_RESOURCE_RE, _ALARM_DESCRIPTION_RE, _THRESHOLD_SHAPE_RE,
      _alarm_blocks_from_text, _alarm_descriptions_from_text, _alarm_descriptions and _SYNTHETIC_MIXED_TF --
      PLUS eight more the departing classes require, enumerated by call site so the move is mechanical rather
      than a debugging session: _DR_TF (:283), _FIXTURE_PATH (:558,562), _CRON_MINUTE_RE (:267-269),
      _CRON_FIELDS_RE (:284-285), _INTENDED_GC_OPS_STATE (:189-200), _PRODUCTION_CATALOG_TABLE_FLOOR
      (:549,586), _DRAIN_DEPLOY_RUN_ID (:608-617) and _DRAIN_DEPLOY_COMPLETED_AT (:614,617), plus the json and
      datetime imports only TestGcOpsEnablementBaseline uses. _TERRAFORM_PERSONAL_DIR is NOT in this list --
      both halves need it, so it hoists to tests/fixtures/ instead.
      This is the Decision 128/130 decomposition that discharges the 497/500 unregistered-file limit; NO
      config/sloc_budgets.yaml entry is added in either direction.
  - file: config/agent/verification_registry/entries/ducklake-maintenance-tf-invariants.yaml
    action: Delete
    purpose: >-
      All thirteen of this shard's node ids relocate to the two new shards below, leaving it empty, so it
      is retired rather than modified. A Modify could not discharge either graduate step in any case:
      validate_graduation_completeness._new_registry_rows admits only check_ids ABSENT from the
      origin/main baseline, and the match at :210 additionally requires row['plan_slug'] == this plan's
      slug -- this shard is present at baseline under plan_slug ducklake-noncurrent-version-reclaim.
  - file: config/agent/verification_registry/entries/deprecated/ducklake-maintenance-tf-invariants.yaml
    action: Create
    purpose: >-
      Retirement copy in the loader-excluded subtree (load_entries is a single-level glob), retained for
      provenance only. Mirrors the retire-and-rehome shape PR #1225 established.
  - file: config/agent/verification_registry/entries/data-lake-lifecycle-per-rule-invariants.yaml
    action: Create
    purpose: >-
      NEW shard for step 5's graduate obligation, carrying the eight surviving TestDataLakeLifecycleGoverned
      node ids plus test_smoke_prefix_is_covered_not_excluded, at their UNCHANGED module path.
      MUST carry plan_slug: smoke-prefix-lifecycle-coverage (not the old plan's slug), graduated_at (the
      implementing date) and graduated_by. guard_target terraform/personal/main.tf. Admissible under
      run_differential because the new coverage node does not exist at origin/main.
  - file: config/agent/verification_registry/entries/ducklake-maintenance-gc-rule-invariants.yaml
    action: Create
    purpose: >-
      NEW shard for step 6's graduate obligation, carrying the five re-pointed GC node ids at the new
      module path. MUST carry plan_slug: smoke-prefix-lifecycle-coverage -- a verbatim relocation that
      copies plan_slug: ducklake-noncurrent-version-reclaim forward fails the :210 match -- plus
      graduated_at and graduated_by. guard_target terraform/personal/ducklake_maintenance.tf. Admissible
      under run_differential because the module does not exist at origin/main.
bundled_recommendations: ["rec-3945"]
followon_recs: []
infrastructure_dependencies:
  - >-
    aws_s3_bucket_lifecycle_configuration UPDATE (a second rule block on an existing resource): no
    delete, no trust diff, no IAM, no resource-based policy -- deterministic guard exit 0, auto-apply
    (Decision 77 / Decision 126 clause 1), still subject to subagent review. This does NOT route to
    tf-gated-apply.
  - >-
    agent-platform-github-ci-apply already holds s3:PutLifecycleConfiguration on the data-lake bucket
    (terraform/bootstrap/github_ci_apply_policy.tf:76) and the refresh-read s3:GetLifecycleConfiguration
    (github_ci_apply_reads.tf:34). No terraform/bootstrap edit and no IAM scope growth is owed.
  - >-
    Decision 119: no local terraform init/validate/plan for terraform/personal -- terraform is not
    installed in the DEV container and provider checksums are egress-blocked. CI's required
    terraform-validate check and the speculative-plan job are the authoritative verifiers; every
    terraform VP step here is grep-only.
  - >-
    VP step 14 calls update_rec on rec-3892, which is already CLOSED. scripts/ops_portal/closure_gate.py
    binds {closed, declined, superseded} and fires its obligation on the TRANSITION, so a context-only
    append with no status change is expected to pass -- but this path is unexercised here and step 14 is
    the sole carrier of the RCA evidence this plan declares non-optional. If the portal refuses the
    append, file the evidence as a fresh rec rather than forcing a status flip -- and note that taking
    that branch AMENDS THIS PLAN: step 14 asserts the evidence literals against rec-3892.context
    specifically, so it must be re-pointed at the new rec id in the same commit. Do not leave step 14
    asserting against a rec that will never carry the evidence.
  - >-
    PlatformDev already holds s3:GetLifecycleConfiguration, s3:GetBucketVersioning and
    s3:ListBucketVersions on both DuckLake prefixes (platform_dev_policies.tf:159-185, landed #1223), so
    the post-deploy steps read live state from the dev identity without an admin container.
acceptance_criteria:
  - >-
    rec-3945's stored acceptance command passes verbatim, at its recorded node id: grep for
    ducklake_smoke_data_prefix in terraform/personal/main.tf succeeds AND
    tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_smoke_prefix_is_covered_not_excluded
    passes. The node id is unchanged by the split -- an oracle relocation was NOT required.
  - >-
    rec-3892's stored acceptance command also still passes verbatim at its recorded node id
    (TestDataLakeLifecycleGoverned as a whole), proving the decomposition broke no stored oracle.
  - >-
    aws_s3_bucket_lifecycle_configuration.data_lake carries exactly TWO rules; the smoke rule derives
    its prefix from local.ducklake_smoke_data_prefix with a trailing slash, binds noncurrent_days to
    SNAPSHOT_RETAIN_DAYS, sets expired_object_delete_marker true, and declares no current-version
    expiration.
  - >-
    _DECLARED_LIFECYCLE_EXCLUSIONS no longer names ducklake_smoke_data_prefix, and the coverage sweep
    proves POSITIVE coverage for both *_data_prefix locals derived from the .tf text rather than passing
    through an exclusion (Decision 191).
  - >-
    Every lifecycle assertion is per-rule, demonstrated by red-case fixtures: a two-rule configuration
    whose SECOND rule carries a wrong noncurrent_days, a Disabled status, a missing
    expired_object_delete_marker, or a slash-less prefix FAILS the corresponding guard. Under the
    pre-existing whole-block assertions each of those fixtures passed.
  - >-
    Both test modules measure under 500 SLOC and neither appears in config/sloc_budgets.yaml -- the
    crossing was met by decomposition, not by a budget raise (Decision 128).
  - >-
    validate_no_cross_test_imports passes: neither test module imports the other, and the shared HCL
    helpers resolve from tests/fixtures/.
  - >-
    All thirteen pre-existing registry node ids remain reachable under the disposition table in context --
    five re-pointed, three retained unchanged, five reshaped strictly stronger, none dropped
    (Decision 187: silence is not a disposition).
  - >-
    Post-apply, the live bucket reports two lifecycle rules with the smoke rule Enabled, and
    GcReferencedMissing remains 0 on the next smoke gc cycle -- reachability, not a storage delta
    (Decision 192).
  - >-
    rec-3892 carries the RCA resolution recorded via the portal, and rec-3945 reads closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the smoke prefix local reaches the lifecycle configuration
    command: grep -q 'local.ducklake_smoke_data_prefix}/' terraform/personal/main.tf
    expected: exit 0 -- grep, never rg; validate_vp_replay's _rg_portability_pre_pass lints every pre-deploy step of an added plan at any disposition
    fix_if: non-zero means the second rule was not added, or its prefix was retyped as a literal instead of derived from the local
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Subsumed by step 5's per-rule prefix guard, which asserts the same property structurally across every rule rather than as a fixed-string presence check anywhere in the file.
  - step: 2
    phase: pre-deploy
    action: the smoke rule is a SECOND rule, not a rewritten production rule
    command: test 2 -eq "$(grep -c '^    id     = ' terraform/personal/main.tf)"
    expected: exactly two rule ids in the file -- the production rule must survive intact alongside the new smoke rule
    fix_if: 1 means the production rule was replaced rather than joined; 3 or more means an unintended extra rule landed
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: An indentation-anchored count is adequate at authoring time but too brittle to stand as a registry guard; step 5's per-rule sweep carries the durable form.
  - step: 3
    phase: pre-deploy
    action: the smoke prefix is no longer a declared exclusion
    command: bin/venv-python -c "import tests.checks.iam_tf.test_ducklake_maintenance_tf_invariants as m; assert 'ducklake_smoke_data_prefix' not in m._DECLARED_LIFECYCLE_EXCLUSIONS, m._DECLARED_LIFECYCLE_EXCLUSIONS; print('SMOKE_NOT_EXCLUDED')"
    expected: the exclusion roster no longer names the smoke prefix, so the coverage sweep must prove positive coverage instead of passing through a declared absence
    fix_if: the entry survives -- the sweep would still pass vacuously and rec-3945 would be closed on an exclusion rather than on coverage
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Duplicates the property step 5's new coverage node asserts directly and structurally; graduating a grep over the roster literal would pin the implementation shape rather than the behaviour.
  - step: 4
    phase: pre-deploy
    action: no test module imports another test module after the split
    command: bin/venv-python -m scripts.checks.hygiene.validate_no_cross_test_imports
    expected: exit 0 -- the shared HCL helpers must resolve from tests/fixtures/, which is exempt by construction, never by one test module importing the other
    fix_if: a failure names the importing module; hoist the remaining shared helper into tests/fixtures/terraform_hcl_blocks.py rather than duplicating it or adding a grandfather entry
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Already a standing repo-wide check with its own enforcement path; graduating a second registry row for the same guard would duplicate an existing check rather than add coverage.
  - step: 5
    phase: pre-deploy
    action: the reshaped per-rule lifecycle guards and the new coverage node all pass
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_exactly_one_lifecycle_configuration_targets_the_data_lake_bucket" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_read_helper_sweeps_every_tf_file_in_the_directory" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_rule_status_is_enabled" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_prefix_is_derived_from_the_declared_local_with_a_trailing_slash" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_no_current_version_expiration_rule" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_expired_object_delete_marker_is_present" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_noncurrent_days_bound_to_snapshot_retain_days" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_every_declared_data_prefix_local_is_covered_or_declared_excluded" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_smoke_prefix_is_covered_not_excluded" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleRedCases::test_second_rule_with_wrong_noncurrent_days_fails" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleRedCases::test_second_rule_disabled_fails" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleRedCases::test_second_rule_missing_expired_object_delete_marker_fails" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleRedCases::test_second_rule_prefix_without_trailing_slash_fails" "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleRedCases::test_smoke_local_absent_from_coverage_fails" -q
    expected: >-
      all fourteen node ids resolve and pass -- the nine guards AND the five new red cases, so AC 5 is
      verified by the step that claims it and this step's fix_if is firable. ENUMERATED EXPLICITLY, never as a bare class selector: a bare
      ::TestDataLakeLifecycleGoverned absorbs the not-yet-existing method and exits 0, which
      validate_vp_replay's red-before leg classifies as tautological and hard-fails. Measured on the
      un-implemented tree, this enumerated form exits 4 (target_absent) and the leg PASSES. The critical
      reshape is the noncurrent_days guard, which today searches only the FIRST
      noncurrent_version_expiration block and would let a second rule carrying a wrong value pass
      undetected.
    fix_if: a red case passing means the reshape was not net-tightening -- a guard that cannot fail is not a guard (Decision 181)
    hermetic: false
    graduation: graduate
    graduation_check_id: data-lake-lifecycle-per-rule-invariants
  - step: 6
    phase: pre-deploy
    action: the re-pointed GC/alarm node ids pass at their new module path
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py -q
    expected: all moved classes pass unchanged at the new path -- the move is a relocation, never a rewrite, and the module does not exist at origin/main so this command is RED before implementation
    fix_if: an import error means the hoisted helpers were not re-pointed; a behavioural failure means the move altered a test rather than relocating it
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-maintenance-gc-rule-invariants
  - step: 7
    phase: pre-deploy
    action: both test modules cleared the SLOC limit by decomposition, not by a budget raise
    command: bin/venv-python -c "import pathlib; from scripts.checks.sloc._shared import _SLOC_LIMIT; import yaml; b=(yaml.safe_load(pathlib.Path('config/sloc_budgets.yaml').read_text()) or {}).get('budgets') or {}; ms=['tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py','tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py']; [print(m, len([l for l in pathlib.Path(m).read_text().splitlines() if l.strip() and not l.strip().startswith('#')])) for m in ms]; assert all(len([l for l in pathlib.Path(m).read_text().splitlines() if l.strip() and not l.strip().startswith('#')]) <= _SLOC_LIMIT for m in ms), 'over limit'; assert not any(m in b for m in ms), 'a budget entry was registered -- Decision 128 requires decomposition'; print('SLOC_OK_NO_BUDGET_ENTRY')"
    expected: both modules at or under the limit with no budget registration
    fix_if: an over-limit module means the split was uneven -- rebalance by class; a budget entry means the decompose-by-default rule was bypassed
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: validate_sloc_limits and validate_sloc_budget_raises already enforce both halves repo-wide in the --pre tier; a registry row here would duplicate a standing check.
  - step: 8
    phase: pre-deploy
    action: every pre-existing registry node id is still reachable
    command: bin/venv-python -c "import yaml,pathlib,subprocess; old=subprocess.run(['git','show','origin/main:config/agent/verification_registry/entries/ducklake-maintenance-tf-invariants.yaml'],capture_output=True,text=True).stdout; ids=[x for x in (yaml.safe_load(old) or {})['check_spec']['command'] if '::' in x]; now=[]; [now.extend([y for y in (yaml.safe_load(p.read_text()) or {}).get('check_spec',{}).get('command',[]) if '::' in y]) for p in pathlib.Path('config/agent/verification_registry/entries').glob('*.yaml')]; names=[i.rsplit('::',1)[1] for i in ids]; missing=[n for n in names if not any(n==c.rsplit('::',1)[1] for c in now)]; assert not missing, f'node ids dropped without disposition -- {missing}'; print('ALL_NODE_IDS_REACHABLE')"
    expected: every test-function name carried by the origin/main shard is still carried by some live shard, re-pointed or retained
    fix_if: a named missing node id must be re-pointed, or deliberately retired with a filed rec recorded in the disposition table -- never dropped inside a retirement (Decision 187)
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Asserts a property of this specific migration against origin/main, which is transient session state by construction and not a standing regression guard.
  - step: 9
    phase: pre-deploy
    action: the retired shard's check_id is unreachable from every live surface
    command: test 0 -eq "$(grep -rn 'ducklake-maintenance-tf-invariants' --include=*.py --include=*.yaml . | grep -v '^./docs/plans/' | grep -v 'entries/deprecated/' | wc -l)"
    expected: zero live references to the retired check_id outside historical plan artefacts and the loader-excluded deprecated subtree, both of which are immutable records rather than live surfaces
    fix_if: a surviving reference means the shard was retired while something still resolves it -- re-point that consumer at whichever new shard now carries the node id
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: A repo-wide grep for a retired check_id string is a one-time migration assertion against this diff, not a standing property any future change could regress.
  - step: 10
    phase: pre-deploy
    action: fast-tier gate
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0 -- in particular validate_verification_registry admits BOTH NEW shards via run_differential
      (data-lake-lifecycle-per-rule-invariants fails at origin/main because
      test_smoke_prefix_is_covered_not_excluded does not exist there;
      ducklake-maintenance-gc-rule-invariants fails because its module does not exist there), and
      validate_graduation_completeness finds, for each graduate step, a registry row that is BOTH
      new-in-diff AND carries plan_slug smoke-prefix-lifecycle-coverage. A modified pre-existing row
      cannot satisfy that match, which is why the old shard is retired rather than edited.
    fix_if: a differential rejection means a shard passes unchanged at origin/main and carries no new property; re-read the sibling plan's run_differential note before re-submitting
    hermetic: false
    graduation: waive
    graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal -- the refusal binds the GRADUATE partition, so a graduate step may never invoke scripts.validate; waive is required here, not merely convenient. (This step already carries hermetic false.)
  - step: 11
    phase: pre-deploy
    action: full-tier gate before handoff
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a COMPLETED full run -- handoff_policy.timeout_disposition is blocked, so a timeout is not a pass; resume later and rerun full from the start
    fix_if: any failure blocks the commit; forward-fix, never a workaround (Decision 55)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal -- the refusal binds the GRADUATE partition, so a graduate step may never invoke scripts.validate; waive is required here, not merely convenient. (This step already carries hermetic false.)
  - step: 12
    phase: post-deploy
    action: the live bucket carries both rules with the smoke rule Enabled and correctly bound
    command: aws s3api get-bucket-lifecycle-configuration --bucket agent-platform-data-lake --profile agent_platform --output json > "${TMPDIR:-/tmp}/dl-lifecycle.json" && bin/venv-python -c "import json,os; from src.common.ducklake_maintenance import SNAPSHOT_RETAIN_DAYS; d=json.load(open(os.environ.get('TMPDIR','/tmp')+'/dl-lifecycle.json')); rs=d['Rules']; assert len(rs)==2, [r.get('ID') for r in rs]; sm=[r for r in rs if r['Filter'].get('Prefix')=='ducklake-neon-smoke/'][0]; assert sm['Status']=='Enabled', sm['Status']; assert sm['NoncurrentVersionExpiration']['NoncurrentDays']==SNAPSHOT_RETAIN_DAYS, sm; assert 'Days' not in sm.get('Expiration',{}) and 'Date' not in sm.get('Expiration',{}), sm; print('SMOKE_RULE_LIVE')"
    expected: >-
      two rules live, the smoke rule Enabled, its NoncurrentDays equal to the Python constant, and NO
      current-version expiration argument -- a current-version age rule would delete live Parquet the
      catalog still references, which is the one shape this resource must never carry.
    fix_if: a Disabled rule reclaims nothing while satisfying every structural assertion; a missing rule means the apply did not land -- check the CI apply job rather than re-applying locally
  - step: 13
    phase: post-deploy
    action: reachability holds on the next smoke gc cycle -- the safety invariant, not a storage delta
    command: aws cloudwatch get-metric-statistics --namespace DuckLakeMaintenance --metric-name GcReferencedMissing --start-time "$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 3600 --statistics Maximum --profile agent_platform --output json | bin/venv-python -c "import json,sys; d=json.load(sys.stdin); pts=d.get('Datapoints',[]); assert pts, 'NO DATAPOINTS -- an unemitted metric reads ABSENT, not breached; confirm a smoke gc cycle ran before reading this as a pass'; assert max(p['Maximum'] for p in pts)==0.0, pts; print('REFERENCED_MISSING_ZERO', len(pts))"
    expected: >-
      at least one datapoint and every one of them zero. This is the Decision 192 per-cycle safety
      invariant applied to the newly-governed prefix: an AWS-native lifecycle rule carries no
      reachability assertion of its own, so the catalog-live set must be shown disjoint from what the
      rule expires. An empty result is an explicit failure, never a pass -- absence is the worst failure
      shape for a guard whose job is to be noticed.
    fix_if: non-zero referenced_missing after the rule went live is a real catalog/storage inconsistency -- RCA it (Decision 55), never re-run to green
