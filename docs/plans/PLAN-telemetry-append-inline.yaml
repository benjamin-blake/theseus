    with no account id, ARN or hash. One amendment_log entry. telemetry_probe stays out of contract scope.
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    content.semantics only: while the inline_within_threshold exemption stands, the write boundary refuses inline content
    above the threshold with 413 payload_too_large naming the rule, so nothing above the threshold is stored inline before
    the blob route (owner rec-4024). One field-level amendment_log entry (governance_note_add). No rule, value or
    contract_version change.
- file: docs/contracts/project-id.yaml
  action: Modify
