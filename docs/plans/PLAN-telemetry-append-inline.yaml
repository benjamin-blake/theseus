schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-append-inline
intent: >-
  Telemetry slice 2a-2, plan 3 part 2 (rec-4024 carrier, T2.36): ship append_telemetry, the producer verb, on the
  separate telemetry writer function (agent-platform-ducklake-telemetry-writer) for inline rows into the isolated
  ducklake_smoke catalog. One request carries up to four table batches for one project; the request grammar and every
  contract row rule run before any database work; one transaction registers a first-sight project under part 1's
  counter-row lock and writes every batch with one MERGE each, so an identical re-send is a no-op and a differing row is
  refused with nothing written (Decisions 199, 200, 207, 210). This is the write half slice 3b's producer (rec-4026)
  needs; plan 4's blob route follows and closes rec-4024.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-append-inline.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Writer-verb work carried by rec-4024; closes no exit criterion (c2 needs a
  producer and the production catalog, 2c; T3.20 c8 needs the hook half, rec-4026). Builds on
  PLAN-telemetry-registration-verbs (#1431) and the three plans merged in #1430.
scope:
- file: src/telemetry/request.py
  action: Create
  purpose: >-
    The plane-neutral append request grammar (stdlib only; imports src.telemetry.timestamps and nothing else from the
    kernel, so the .importlinter turn_capture fence stays open for a producer-side lint; Decision 184 cl.2, Decision 212
    cl.2). parse_append_request(body, shapes) -> AppendRequest(project_ref, component, batches as ordered (table, rows)
    pairs, producer, parser_version). Rules, in this order: body keys within the allowlist {action, project_ref,
    component, batches} (so catalog, meta_schema, data_path, tenant_id and project_id are refused with no denylist);
    project_ref a non-empty str; component optional, default 'unknown', else ^[a-z][a-z0-9_-]{0,63}$; batches a non-empty
    list of objects with exactly the keys table and rows; table in the closed set the shapes name, each at most once;
    GENERATION_MARKER_TABLE telemetry_sessions last when present (write_order; telemetry-event-envelope.yaml R7); rows a
    list of objects; at least one row in the request; every present producer and parser_version value identical across
    the request (mixed_producer; envelope R1). Two temporary rules owned by rec-4024 and removed by plan 4 live here so
    every plane refuses alike (Decision 210 cl.5; decision scout): a row carrying the table's content-rule uri column is
    refused (request, reason blob_route_unavailable), and while the table's inline_within_threshold exemption exists an
    inline content whose UTF-8 length exceeds the contract threshold is refused (payload_too_large, rule
    inline_within_threshold, the threshold number). Then every present TIMESTAMP WITH TIME ZONE column is decoded with
    parse_wire_timestamp into new row dicts (schema_gate, reason wire_timestamp). TableShape.from_spec reads an
    EventTableSpec by attribute (TYPE_CHECKING import only): timestamp columns, the content rule's inline and uri columns,
    and the threshold only while exempt. RequestError(ValueError) carries error_type, table, row, column, rule, reason and
    threshold, and its message names only those, never a value.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    Value-free structured kernel errors (Fable consult part 2 Q3). GateError gains keyword-only table, row, column and
    reason (closed tokens: unknown_column, derived_column, type, range, not_null, required_ref, invalid_ref, time_range,
    grain_key_null), default None, every raise site in this module passing column and reason; the BIGINT range and
    non-finite DOUBLE messages stop echoing the value. RowRuleGateError(GateError) adds rule and is built from a
    RowRuleError (table, rule, column). GrainConflictError gains table, event_id and row; collapse_or_reject_duplicates
    sets event_id and the 0-based index of the second conflicting row. Existing pinned message texts keep matching.
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    _derive_row raises RowRuleGateError from the RowRuleError (the __cause__ pin in test_name_rule_ducklake_integration.py
    stays true) and wraps IdentityError and TimestampError raised by derive_entity_key / derive_event_id into GateError
    naming the ref field or timestamp column (reason invalid_ref / time_range), value-free and `from exc`; today they escape
    prepare_batch unmapped and echo the input, against its docstring. prepare_batch fills table and the row's 0-based index
    into a GateError or GrainConflictError lacking them; PreparedBatch gains source_index (event_id -> first index as sent);
    execute_prepared parses event_id from its own TELEMETRY_GRAIN_CONFLICT token and raises GrainConflictError(table,
    event_id, row) (event_id and row None if the parse misses, never a mapping failure). No other change.
- file: src/common/ducklake_telemetry_append.py
  action: Create
  purpose: >-
    The append adapter, imported only by the telemetry writer's edge (never by ducklake_runtime's closure or scripts/: the
    scripts-never-import-telemetry-append fence). append_request(con, request, *, tenant_id, specs, semantics, now=None,
    metric_sink=None) -> AppendOutcome(tenant_id, project_id, project_registration created|existing, per-table
    AppendResult, occ_retries, commit_ms). project_id from part 1's project-binding cache, else part 1's lookup_project
    before any transaction; on a miss whose purpose_for(project_ref) is not real, TelemetryRequestError(403,
    project_unregistered, {remedy: register_project}) before any transaction (project-id.yaml reserved namespace). now
    minted once. prepare_batch for every batch BEFORE BEGIN with the known id or SENTINEL_PROJECT_ID ('0' * 26), so a 422
    or an in-batch 409 never opens a transaction (verdicts do not depend on the id; Fable consult part 2 Q2). Then one
    run_telemetry_txn (part 1; terminal classes re-raise before is_occ_collision) whose body: on a miss,
    resolve_or_register_project(explicit=False) under the counter-row lock; re-runs prepare_batch only when the resolved id
    differs from the prepared one; asserts every prepared row's project_id equals the resolved id (the sentinel never
    reaches a MERGE); execute_prepared per batch in request order. The binding enters part 1's cache only after
    run_telemetry_txn returns. Never logs or returns a row value or principal.ref.
- file: src/lambdas/ducklake_telemetry_writer/telemetry_edge.py
  action: Create
  purpose: >-
    Lambda-only transport policy and the verb body. MAX_REQUEST_BYTES 5 MiB (5242880), MAX_ROWS_PER_TABLE 2000,
    MAX_ROWS_PER_REQUEST 5000, each a TelemetryRequestError 413 (payload_too_large / too_many_rows) checked from
    TelemetryRequest.request_bytes and the raw body before the kernel parse (rows counted only in well-formed batches;
    a malformed shape is left to the kernel's 400). Event specs and table shapes built once per container from the bundled
    field_semantics.yaml. action_append_telemetry(request, con, deps): caps, parse_append_request (a RequestError becomes
    TelemetryRequestError with its status by error_type: request / write_order / mixed_producer 400, payload_too_large
    413, schema_gate 422, and its value-free fields), tenant from part 1's lookup_tenant on request.principal (missing ->
    403 tenant_unresolved, remedy register_tenant), append_request, then the response {ok, tenant_id, project_id,
    project_registration, tables: {table: {submitted, collapsed, inserted}}, occ_retries, commit_ms}. describe_entry()
    gives the verb's description, params_schema and the three caps.
- file: src/lambdas/ducklake_telemetry_writer/telemetry_log.py
  action: Create
  purpose: >-
    C6 (REVIEW.md C6): emit_request_line(action, status, error_type, request, body) prints ONE JSON line to stdout for every
    request the handler answers: verb, component (from the body when a valid string, else 'unknown'), status, error_type,
    per-table submitted and inserted, request_bytes, tenant_id, project_id, occ_retries, commit_ms, connect_reused and
    caller_role (CallerPrincipal.role_name only). Never an account id, an ARN, a hash of either (Decision 101;
    ops_tenants.yaml:63-72) or a row value. For the five data verbs (append_telemetry, register_tenant,
    register_project, provision_telemetry, telemetry_probe) the line carries a CloudWatch Embedded Metric Format _aws
    block: namespace DuckLakeTelemetryWriter, metric RequestCount with dimension set [Verb] (five series; operator
    accepted the spend 2026-10-08; no component dimension); describe and attach_check get the line without the block.
    OccRetryCount and CommitLatencyMs stay with run_telemetry_txn's sink and are not repeated here. No PutMetricData call
    on the request path; ducklake_metrics.py is unchanged.
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Modify
  purpose: >-
    (1) Dispatch append_telemetry (connectionful, through the pinned warm-connection opener), and describe gains
    telemetry_edge.describe_entry(). (2) Error-map rows, most specific first and before part 1's DuckLakeRuntimeError
    row: RowRuleGateError -> 422 row_rule {table, row, rule, column, exclude_before from the spec's rules};
    GateError -> 422 schema_gate {table, row, column, reason}; GrainConflictError -> 409 grain_conflict {table, event_id,
    row}; bodies built from attributes only, never str(exc). (3) The response builder calls telemetry_log.emit_request_line
    once per answered request, success and every mapped error alike.
- file: src/lambdas/ducklake_telemetry_writer/telemetry_actions.py
  action: Modify
  purpose: >-
    telemetry_probe accepts optional {project_ref, session_ref, session_started_at} (all three or none, else 400
    bad_request); when given it adds grain_counts: per table, rows and distinct (producer, event_id, parser_version) keys
    whose session_id is the derived session key, bounded to that session's calendar day (ADVICE Q19; no conflicted_keys:
    rows > keys is the legal identical-duplicate race, Fable design 2.5), plus each table's live data-file count and bytes
    from ducklake_list_files on the pinned catalog (a measurement for the ingestion-shape decision, never a check).
    Nothing else changes.
- file: src/lambdas/ducklake_telemetry_writer/manifest.yaml
  action: Modify
  purpose: >-
    includes += src/telemetry/request.py, src/common/ducklake_telemetry_append.py and
    src/lambdas/ducklake_telemetry_writer/telemetry_edge.py and telemetry_log.py; notes name append_telemetry.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: >-
    excludes += src/common/ducklake_telemetry_append.py by name (part 1's test pins every src/common/ducklake_telemetry_*.py
    excluded). Manifest only, zip contents unchanged, no data-pipeline deploy (Decision 79; the part 1 precedent).
- file: scripts/ducklake_smoke/telemetry_append_vectors.py
  action: Create
  purpose: >-
    Data only (imports nothing from src.telemetry): a minimal valid four-table golden payload in wire form for one session
    under a given project_ref, and the negative cases as (name, mutation, expected status, error_type, rule or column).
    Shared by the live gate and its hermetic test.
- file: scripts/ducklake_smoke/lambda_telemetry_append_gates.py
  action: Create
  purpose: >-
    lambda_telemetry_append(url, project_ref, *, profile, region), called by lambda_telemetry after part 1's vectors with
    part 1's freshly registered synthetic:deploy-smoke-<uuid> ref, so every data vector writes under an explicitly
    registered synthetic project and the gate never mints a real-looking one (writer-boundary consult, 2c item 2). Each a
    loud SmokeTestFailure (Decision 55): golden append -> 200, existing, inserted == submitted per table, and
    telemetry_probe's grain_counts match; identical re-send -> 200, inserted 0 everywhere; one observation column mutated
    -> 409 grain_conflict naming the table and row, grain_counts unchanged; sessions batch first -> 400 write_order; a
    fraction-less session_started_at -> 422 schema_gate naming the column; a process_event named never_on_main -> 422
    row_rule, rule pattern_when, column name (rec-4176's Decision 48 deferral, plan3-inputs.md); inline content of
    threshold + 1 bytes -> 413 naming inline_within_threshold; a content_uri -> 400; a catalog key -> 400; two producers
    -> 400 mixed_producer; an unregistered drill: ref -> 403 project_unregistered; an omission row (content_omitted_reason,
    no content) -> 200; a near-cap request of about 4.9 MiB (transcript rows under the threshold, within the row caps) ->
    200 with commit_ms printed (the payload-ceiling measurement the writer-boundary consult asks for); a body one byte
    over 5 MiB -> 413 payload_too_large. Around the golden append it prints "append_files_per_commit=<n>" and
    "append_commit_ms=<ms>" from the probe's file counts and the response (measurements for the ingestion-shape decision,
    never asserted). One auto-registration vector appends to a fresh NON-reserved ref -> 200,
    created; it first asserts telemetry_probe reports data_path_is_smoke true and FAILS the gate otherwise, so 2c must
    replace it before the function binds production. Prints the markers TELEMETRY_APPEND_OK, TELEMETRY_RESEND_NOOP,
    TELEMETRY_GRAIN_CONFLICT_OK, TELEMETRY_REJECTS_OK, TELEMETRY_NEAR_CAP_OK and TELEMETRY_AUTOREGISTER_OK, a
    "near_cap_commit_ms=<value>" line, ids and counts only; never an account id, URL or host.
- file: scripts/ducklake_smoke/lambda_telemetry_gates.py
  action: Modify
  purpose: lambda_telemetry calls lambda_telemetry_append after part 1's vectors, passing the URL and part 1's registered ref.
- file: docs/contracts/ducklake_telemetry_writer.yaml
  action: Modify
  purpose: >-
    Verb append_telemetry: payload_schema_ref (the request shape, component, the three caps), response_codes and
    typed_errors (400 request / write_order / mixed_producer / bad_request, 403 tenant_unresolved / project_unregistered,
    409 grain_conflict, 413 payload_too_large / too_many_rows, 422 row_rule / schema_gate, 503 occ_exhausted, 500 runtime).
    audit_invariants gain: one transaction per request; within a request data batches precede the sessions marker
    (cross-request order is the producer's, R7); an identical re-send is a no-op and a differing row writes nothing
