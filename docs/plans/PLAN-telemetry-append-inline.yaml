bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  No Terraform and no IAM change. Every runtime resource comes from #1430 (the function, URL, scoped login and secret,
  env pins, the DuckLakeTelemetryWriter metric grant, PlatformDev's URL-only invoke, the deploy map and the
  --lambda-telemetry smoke step) and PLAN-telemetry-registration-verbs (#1431). EMF metrics need no PutMetricData grant.
- >-
  Ordering: this implementation merges only after (a) PLAN-telemetry-registration-verbs is implemented, deployed and its
  live gate recorded the lock converging (TELEMETRY_PROJECT_CONVERGED); (b) the RDS move is paused to tune Neon first
  (Benjamin 2026-10-09), so part 2 is sized on Neon; if a catalog swap lands first, part 1's gate re-runs on the new
  backend before this merges; (c) Benjamin gives his explicit word for the deploy. If (a) shows divergent ids, Decision 200's
  registration-not-idempotent reversal condition fires and this plan returns to /plan.
- >-
  The merge redeploys the six DuckLake functions through deploy-ducklake-lambdas.yml (src/telemetry/** and
  src/common/ducklake_*.py are push paths; Decisions 79/125/126); the shared writer's bundle does not change.
  LAMBDA-DEPLOY DEFERRED for data-pipeline: its manifest only gains one exclude, zip contents unchanged.
acceptance_criteria:
- >-
  A well-formed four-table request writes every batch in one transaction and answers 200 with per-table submitted,
  collapsed and inserted counts; a first-sight non-reserved project_ref is registered in that same transaction; an
  identical re-send inserts nothing; a row differing under an existing grain key answers 409 naming the table, event_id
  and row index, and nothing from the request (registration included) is written.
- >-
  Every request-grammar violation is refused before any database work with a mapped, value-free status: unknown or
  selector/identity keys, a bad component, a malformed batch, an unknown or repeated table, the sessions batch not last
  (400 write_order), mixed producer or parser_version (400 mixed_producer), an empty request (400), a caller content_uri
  (400), inline content above the threshold while the exemption stands (413 naming inline_within_threshold), over-cap
  bodies and row counts (413), and a timestamp without exactly three fraction digits (422 naming the column).
- >-
  Every kernel rejection is a typed, value-free response: a row-rule break is 422 row_rule naming table, row, rule,
  column and exclude_before (the never_on_main vector answers pattern_when / name); a type, NOT NULL, ref or time-range
  break is 422 schema_gate naming table, row, column and reason; no telemetry error escapes as an unmapped Lambda error.
- >-
  An unregistered drill:/synthetic: project_ref answers 403 project_unregistered before any transaction; concurrent
  first-sight appends of one project_ref converge on one project_id; a grain conflict is never retried as an OCC
  collision; OCC exhaustion answers 503.
- >-
  Each answered request emits exactly one C6 line, never carrying an account id, ARN or hash of either; the five data
  verbs' lines carry the EMF block, and after deploy RequestCount for append_telemetry exists in DuckLakeTelemetryWriter.
- >-
  After the governed deploy of the merge commit, every append vector of the --lambda-telemetry gate passes in CI and in an
  independent PlatformDev run, and the function's Errors metric is zero since the deploy.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The plane-neutral request grammar refuses every malformed request with a value-free typed error, in order, and decodes wire timestamps.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_request.py::test_allowlist_refuses_selector_and_identity_keys
    tests/telemetry/test_request.py::test_closed_table_set_each_table_once
    tests/telemetry/test_request.py::test_sessions_batch_must_be_last
    tests/telemetry/test_request.py::test_one_producer_and_parser_version_per_request
    tests/telemetry/test_request.py::test_empty_request_is_refused
    tests/telemetry/test_request.py::test_component_grammar_and_default
    tests/telemetry/test_request.py::test_wire_timestamps_need_exactly_three_fraction_digits
    tests/telemetry/test_request.py::test_inline_content_above_threshold_is_refused_only_while_exempt
    tests/telemetry/test_request.py::test_content_uri_is_refused_until_the_blob_route
    tests/telemetry/test_request.py::test_errors_never_carry_a_value -q
  expected: Exit 0, 10 passed. Red before, because the module and its test do not exist.
  expected_literals: []
  fix_if: A miss -> fix request.py, never loosen a test. A threshold read from a literal -> read it from the bundled projection (Decision 210 cl.3).
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-append-request-grammar
- step: 2
  phase: pre-deploy
  action: Kernel errors carry value-free structure and no gate message echoes a value.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_gate.py::test_gate_errors_carry_column_and_reason
    tests/telemetry/test_gate.py::test_gate_messages_never_echo_the_value
    tests/telemetry/test_gate.py::test_row_rule_gate_error_carries_the_rule
    tests/telemetry/test_gate.py::test_in_batch_grain_conflict_names_event_id_and_row -q
  expected: Exit 0, 4 passed. Red before, because the nodes do not exist.
  expected_literals: []
  fix_if: A value in a message -> remove it from the message, never from the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-append-kernel-errors
- step: 3
  phase: pre-deploy
  action: prepare_batch and execute_prepared raise only typed kernel errors, enriched with table and row, the stored conflict's event_id parsed.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_append.py::test_row_rule_break_raises_row_rule_gate_error
    tests/telemetry/test_append.py::test_bad_ref_and_pre_epoch_timestamp_are_gate_errors
    tests/telemetry/test_append.py::test_prepare_batch_names_table_and_row
    tests/telemetry/test_append.py::test_stored_grain_conflict_names_event_id_and_row -q
  expected: Exit 0, 4 passed (duckdb present in the full venv). Red before, because the nodes do not exist.
  fix_if: An IdentityError or TimestampError escaping -> wrap it in _derive_row; a broken __cause__ pin -> raise `from` the RowRuleError.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    test_append.py imports duckdb at module level and requirements-fast.txt has none, so venv-less replay collects nothing
    (vp-red-before.yaml hermetic_authoring iii); step 2 graduates the gate-owned half and the full tier runs these nodes.
