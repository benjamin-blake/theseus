schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-entry-flow-governance"
intent: >-
  Install the flow-side governance pair on NEW docs/DECISIONS.md entries -- a typed metadata
  envelope, a required Significance routing-row claim, and a per-new-entry byte cap -- so the
  decision corpus's size ceilings pace growth instead of scheduling their own raises, and so the
  sole front-door control on corpus shape stops being self-certified with no record.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-entry-flow-governance.yaml
phase: >-
  Migration step 2 of audits/contract-first-governance-33c8667.yaml (findings CFG-01, CFG-03,
  CFG-07 plus the 2026-08-07 post-run adversarial-review amendments). Platform tier_item T2.56
  (normative/contract/ADR layering) is the eventual owner of this corpus's shape; this plan closes
  none of its exit criteria and declares no closes_criteria. Step 1 (PLAN-decision-ceiling-bridge,
  PR #863) has landed; step 3 (destination readiness) owns this plan's WARN-to-hard-fail flip.
scope:
  - file: scripts/checks/decisions/_baseline.py
    action: Create
    purpose: >-
      Single shared origin/main baseline reader (decision numbers present at origin/main, None as
      the advisory-skip sentinel), memoized per root so the two --pre consumers share ONE git
      invocation (Decision 153 fast-tier budget). Reachability MUST delegate to the existing
      scripts.checks._common.origin_main_reachable (_common.py:229, already consumed by
      validate_graduation_completeness / validate_vp_replay / validate_reconcile_pending_gate /
      validate_fallback_reevaluation) -- validate_decision_entry_conformance's private
      _origin_main_reachable duplicate (line 42) is DELETED, not relocated. Moving a duplicate
      would perpetuate the second-implementation pattern Decision 134 clause 3 rejects.
  - file: scripts/decisions_md.py
    action: Modify
    purpose: >-
      Add envelope extraction (a fenced ```yaml block immediately following a '## Decision N:'
      heading) and make parse_decisions_md read it FIRST for status / decided_date / amends /
      title_supersedes, falling back to today's bold-marker and title-relation grammar when absent.
      Surface a new `significance` row key. Public helper for the checks to reuse -- never a second
      envelope parser (Decision 134 clause 3 shared-parser mandate).
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      Inherit envelope-sourced amends/supersedes/status/decided_date edges through the shared
      parser rather than re-deriving them; record in the module docstring that `significance` is
      deliberately NOT projected into docs/decisions-index.json (the 131,000-byte pin, Decision 166
      point 9, and the index-only precedent set by intent/amends/title_supersedes).
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Enforce on new-in-diff entries only: (i) a well-formed envelope is present; (ii) its
      `significance` value names one of decision-entry.yaml's four significance.routing tokens plus
      a non-empty one-line justification, and the two rows whose own contract text reads "Never a
      numbered Decision" FAIL; (iii) an envelope field and its bold-marker twin must not carry
      conflicting values; (iv) the envelope's `number` matches the heading number. Reads the token
      vocabulary from the contract at check time, never a hardcoded copy.
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Add a forward-only per-NEW-entry byte cap of 6,144 bytes (heading-to-next-heading UTF-8 span)
      landing WARN-TIER -- it prints a named warning and MUST NOT append to `failed`. Historical
      entries are never measured. Uses the shared baseline reader; on an unreachable origin/main the
      per-entry cap advisory-skips while the two existing stock ceilings still run. NOTE this check
      is registered UNGATED in pre_sequence() (registry.py:115), unlike the glob-gated conformance
      check -- so gate the new per-entry path on the two DECISIONS files changing, or the baseline
      git read fires on every --pre run in the repo rather than only DECISIONS-touching ones.
  - file: scripts/checks/decisions/validate_supersession_annotations.py
    action: Modify
    purpose: >-
      Union envelope-borne amends/supersedes edges into extract_supersession_edges so an
      envelope-bearing entry cannot silently escape the annotation guard -- _EDGE_RE matches only
      the textual "amends Decision N" prose form, which a typed envelope no longer emits.
      Non-regression obligation, not a feature.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Register validate_decision_entry_conformance in the --pre tier, glob-gated on
      docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md. Today it is full-tier only, so it fires
      post-merge on main and never gates the PR -- CFG-03's stated acceptance ("fails --pre") is
      not achievable without this.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Add the metadata_envelope section (field list; info string pinned to BARE `yaml`, never
      `yaml reversal-conditions`; placement immediately after the heading and before the
      Problem/Intent/Decision marker order registry.yaml:3576 pins; forward-only scope;
      compacted-stub exemption); add the audit's three-question routing rule with its
      standing-commitment clause to the significance section, the routing rule under a
      `routing_rule` key and the standing-commitment clause under a sibling `standing_commitment`
      key (both machine-checkable at step 13 -- a prose-substring assertion would false-pass on the
      existing "forward-standing" wording); declare the Significance obligation as
      a `metadata_envelope.required_fields` entry -- NEVER by appending "Significance" to the
      top-level `required_markers:` list, which must stay exactly [Status, Date, Decision]. The audit
      f2 is explicit that the claim is carried in the envelope "not as a fifth bold marker", and
      `_missing_markers` would otherwise demand a literal `**Significance:**` bold marker on every
      new entry, breaking the existing required_markers pin in
      tests/checks/decisions/test_validate_decision_entry_conformance.py:236. In size_governance:
      FIRST correct the two stale values --
      live_max_h2_headers 120 -> 132 and combined_max_bytes 700000 -> 780000, both stale against the
      validator since PR #863 -- THEN add the lever-by-ceiling matrix and the per-entry cap under
      the key `per_entry_size_norm` (rec-2934's acceptance grep). Building the matrix on top of two
      stale cells would ship a wrong matrix. Field semantics only (Decision 86/127) -- no rationale
      prose here.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add exactly ONE new entry, Decision 167, ratifying the whole ruling (envelope + required
      Significance claim + cap value + routing-rule home). Authored under the 6,144-byte cap,
      carrying its own envelope as the first exemplar, and carrying ruling / rationale / reversal
      conditions / pointers only. ALSO append a dated `> **Amended by Decision 167 (2026-08-07):**`
      annotation trailer to Decisions 150 and 160 -- required by validate_supersession_annotations,
      whose _is_annotated needs the literal string "Decision 167" in each victim's block. This is
      the contract's sanctioned amendment_forms dated append, NOT a body rewrite.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate via `scripts.decisions_index --write` so the freshness check passes with the Decision 167 row.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Add "scripts/decisions_md.py" to _CONCERN_SPLIT_TEST_PACKAGES (13 existing members), remapping
      it from the single file tests/test_decisions_md.py to the test PACKAGE tests/decisions_md/.
      Without this, validate_test_coverage measures decisions_md.py by running ONLY
      tests/test_decisions_md.py (no config/coverage_baseline.yaml entry, so the threshold is 100%),
      and the new envelope code -- whose tests live elsewhere -- would drop it below 100% and fail
      the full tier, breaking this plan's own handoff_policy.
  - file: tests/test_decisions_md.py
    action: Delete
    purpose: >-
      Moved into the tests/decisions_md/ concern-split package. Deleting rather than editing also
      dissolves the 488/500 SLOC pressure that forced the separate-module design in the first place
      -- the split across package members IS the Decision 128 decomposition.
  - file: tests/decisions_md/test_parse.py
    action: Create
    purpose: >-
      The existing tests/test_decisions_md.py content moved verbatim (including the
      byte-reconstruction invariant), split so each package member stays under budget. No assertion
      is weakened or dropped in the move.
  - file: tests/decisions_md/test_envelope.py
    action: Create
    purpose: >-
      Envelope precedence, fallback on the grandfathered band, byte-reconstruction preservation
      under an envelope, and the bare-`yaml` info-string boundary against Decision 133's
      ```yaml reversal-conditions form. Together with test_parse.py this package must give
      scripts/decisions_md.py 100% per-file coverage, since it has no coverage_baseline entry.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Envelope-sourced edges reach the index; `significance` is absent from the projection. Also
      re-point its line-85 docstring reference to the retired tests/test_decisions_md.py at the new
      package path (step 14's live-reference sweep).
  - file: tests/checks/test__marker_guard.py
    action: Modify
    purpose: >-
      Docstring-only edit: re-point the line-134 reference to the retired tests/test_decisions_md.py
      at the new tests/decisions_md/ package path. In scope solely to satisfy step 14's
      live-reference sweep; no assertion changes. 369 SLOC, ample headroom.
  - file: tests/checks/decisions/test_validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Significance presence, the strict token rejection, envelope/body conflict, number mismatch,
      historical-band grandfathering. ALSO update the relocation's call sites: this module imports
      _default_baseline_decision_numbers from validate_decision_entry_conformance at line 26 and
      exercises it at lines 261/272 plus the no-git-repo skip case. Moving the symbol without
      re-pointing that import breaks module COLLECTION, so VP steps 3, 4 and 8 would all fail before
      asserting anything.
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: Per-entry cap WARN-tier semantics -- over-cap new entry warns without failing; historical over-cap entries are silent.
  - file: tests/checks/decisions/test_validate_supersession_annotations.py
    action: Modify
    purpose: Envelope-borne amends/supersedes edges are discovered by the annotation guard.
  - file: tests/checks/decisions/test__baseline.py
    action: Create
    purpose: >-
      Shared baseline reader -- reachable branch, unreachable-sentinel branch, and single-read
      memoization per root. The DOUBLE underscore is mandatory, not a typo: map_source_to_test
      prefixes `test_` onto the stem `_baseline`, so validate_test_coverage demands exactly
      tests/checks/decisions/test__baseline.py (precedent: tests/checks/test__marker_guard.py,
      tests/checks/structural/test__classify.py). _baseline.py has no config/coverage_baseline.yaml
      entry, so this file alone must reach 100% per-file coverage of the module.
  - file: tests/checks/decisions/test_conformance_registration.py
    action: Create
    purpose: >-
      validate_decision_entry_conformance is present in pre_sequence() carrying
      pre_globs=("docs/DECISIONS.md", "docs/DECISIONS_ARCHIVE.md"), and resolves as a module-level
      global in scripts/validate.py. A NEW module because tests/test_checks_registry.py is at
      643/643 SLOC with ZERO headroom under a dec-159 raise-approved pin -- any added line fails
      both validate_sloc_limits and validate_sloc_budget_raises in --pre. That file is deliberately
      NOT in scope and must not be edited; do not raise its budget.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Add one row per `graduation: graduate` verification step (NINE rows -- steps 1, 3, 4, 5, 6, 7,
      8, 10, 11; step 2 is waived as differentially inadmissible), keyed by the step's
      graduation_check_id, per Decision 132 / T3.21's implement-PR obligation. Headroom is ample
      (~4,426 of the 6,000 effective-line ceiling). Each row must name a SINGLE canonical primitive
      that genuinely FAILS in an origin/main worktree -- for the multi-file pytest steps (1, 10, 11)
      pin the test_selector node to a net-new module's node id, never the whole compound command
      (CommandExitZeroCheck.command is a list[str] run without shell=True, so a `&&` chain cannot be
      materialized at all).
bundled_recommendations:
  - rec-2934
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A genuinely-new decision entry lacking a well-formed metadata envelope fails
    `validate --pre`; all 146 grandfathered entries still pass (119 live + 27 archive -- the
    conformance check and the parser both read BOTH files).
  - >-
    docs/contracts/decision-entry.yaml's size_governance ceilings equal validate_decisions_size's
    constants (132 / 780000), its significance section carries the three-question routing rule and
    the standing-commitment clause, size_governance carries the lever-by-ceiling matrix and the
    `per_entry_size_norm` key, and the top-level required_markers list is still exactly
    [Status, Date, Decision].
  - >-
    rec-2934 is satisfied: `grep -q 'per_entry_size_norm' docs/contracts/decision-entry.yaml`
    exits 0, and the squash-merge commit body carries `Resolves: rec-2934`.
  - >-
    A new entry whose envelope `significance` value is absent, is not one of decision-entry.yaml's
    four significance.routing tokens, carries no one-line justification, or names `operational_fact`
    or `field_semantics` fails `validate --pre` with a message quoting the row's own "Never a
    numbered Decision" text and naming the correct destination.
  - >-
    A new entry whose envelope field conflicts with its bold-marker twin (e.g. envelope
    `status: Decided` against `**Status:** Superseded`) fails; agreement or absence of either side
    passes.
  - >-
    A new entry exceeding 6,144 bytes emits a named WARNING from validate_decisions_size and does
    NOT append to `failed`; an existing entry over 6,144 bytes produces no output at all.
  - >-
    parse_decisions_md reads the envelope first and the bold-marker/title grammar as fallback:
    for every decision number present at both origin/main and HEAD, every parsed field is
    byte-identical to its origin/main value.
  - >-
    An envelope-bearing entry declaring `amends` or `supersedes` is visible to
    validate_supersession_annotations' edge extraction (no silent escape of the annotation guard).
  - >-
    validate_decision_entry_conformance appears in the --pre sequence, glob-gated on the two
    DECISIONS files, and is reachable via scripts/validate.py's facade re-export.
  - >-
    docs/contracts/decision-entry.yaml carries the metadata_envelope section, the three-question
    routing rule with its standing-commitment clause, the lever-by-ceiling matrix, and the cap
    value; the four routing tokens the conformance check enforces are read from it, not hardcoded.
  - >-
    Decision 167 exists, is under 6,144 bytes, carries its own envelope, and passes the new
    conformance and cap checks it installs.
  - >-
    `bin/venv-python -m scripts.validate` (full tier) exits 0 on the complete tree.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Envelope precedence and fallback -- an entry whose envelope status/date/amends disagree with
      its bold markers and title parenthetical parses to the ENVELOPE values; an entry with no
      envelope parses to the bold-marker/title values unchanged.
    command: bin/venv-python -m pytest tests/decisions_md/ -q
    expected: >-
      Every envelope precedence and fallback test in tests/decisions_md/test_envelope.py passes, and
      every assertion moved from the old tests/test_decisions_md.py into
      tests/decisions_md/test_parse.py (including the byte-reconstruction invariant) still passes.
    fix_if: >-
      A failure showing bold-marker values winning means the envelope read is layered after the
      fallback instead of before it; a failure on a no-envelope fixture means the fallback path was
      replaced rather than retained.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-md-envelope-precedence
  - step: 2
    phase: pre-deploy
    action: >-
      Live-corpus non-regression -- parse every decision present at BOTH origin/main and HEAD under
      the new parser and assert each parsed field is byte-identical to the same entry parsed from
      the origin/main blob. This is the guard that the dual-grammar window changed nothing for the
      119 grandfathered entries.
    command: >-
      bin/venv-python -c "import subprocess,sys,tempfile,pathlib; from scripts.decisions_md import
      parse_decisions_md; d=pathlib.Path(tempfile.mkdtemp());
      [(d/n).write_bytes(subprocess.run(['git','show',f'origin/main:docs/{n}'],capture_output=True).stdout)
      for n in ('DECISIONS.md','DECISIONS_ARCHIVE.md')];
      base={r['decision_id']:r for r in parse_decisions_md([d/'DECISIONS.md',d/'DECISIONS_ARCHIVE.md'])};
      cur={r['decision_id']:r for r in parse_decisions_md()};
      keys=[k for k in ('title','status','problem','intent','decision_text','context','decided_date','related_decisions','reversal_conditions','superseded_by','amends','title_supersedes')];
      bad=[(n,k) for n in sorted(set(base)&set(cur)) for k in keys if base[n][k]!=cur[n][k]];
      print('DRIFT:',bad) or sys.exit(1) if bad else print(f'OK: {len(set(base)&set(cur))} shared entries identical')"
    expected: >-
      Prints "OK: 146 shared entries identical" and exits 0, with no DRIFT line. 146 is the count
      across BOTH files -- 119 live plus 27 archive, verified at planning time. Do NOT "fix" a 146
      result down to 119 by dropping DECISIONS_ARCHIVE.md from the command; that would halve this
      plan's strongest non-regression guard.
    fix_if: >-
      Any DRIFT tuple names an entry/field the envelope logic changed for the grandfathered band --
      the envelope read must be strictly additive and must never fire on an entry with no envelope.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Structurally inadmissible as a graduated row, not merely inconvenient. Newly-added
      verification_registry rows go through _run_added_entry_differentials, which materializes the
      check_spec inside a REAL origin/main worktree (make_worktree_revert_runner) and requires it to
      FAIL there. This step compares parse_decisions_md over an origin/main blob against
      parse_decisions_md over the tree -- inside an origin/main worktree both sides are the same
      corpus, so it PASSES and the gate rejects the row as "not admitted -- revert did not produce
      FAIL (tautological)", failing --pre and full. The durable half of this property (envelope
      reads never fire on an entry without an envelope) IS graduated, at step 1 as
      decisions-md-envelope-precedence, against committed fixtures rather than against origin/main.
  - step: 3
    phase: pre-deploy
    action: >-
      Significance enforcement -- required presence, the four-token vocabulary read from the
      contract, the non-empty one-line justification, and the strict rejection of the two
      "Never a numbered Decision" rows on a new entry.
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py -k "significance" -q
    expected: >-
      Presence, unknown-token, empty-justification, operational_fact and field_semantics cases
      all FAIL the check; numbered_decision and cd_state_flip pass; historical-band entries
      without the element are untouched. (Post-authoring correction: this repo's global pytest
      addopts nets pytest -q to default verbosity, so no test names print for a passing run --
      these tokens can never appear literally in captured output and are deliberately unbackticked
      here so vp-replay's backtick-substring extraction does not require them.)
    fix_if: >-
      An `operational_fact` fixture passing means the strict branch is not wired; a historical-band
      fixture failing means the new-in-diff gate was bypassed and the check is retro-enforcing.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-entry-significance-strict-token
  - step: 4
    phase: pre-deploy
    action: >-
      Envelope integrity -- envelope/bold-marker conflict on one field fails; agreement passes;
      absence of the bold marker passes; an envelope `number` disagreeing with its heading fails.
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py -k "envelope" -q
    expected: Conflict and number-mismatch cases fail the check; agreement and marker-absent cases pass.
    fix_if: >-
      An agreeing fixture failing means the conflict rule is comparing presence rather than value;
      a conflicting fixture passing means the bold-marker twin is never read for comparison.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-entry-envelope-integrity
  - step: 5
    phase: pre-deploy
    action: >-
      Per-entry cap WARN-tier semantics -- an over-cap NEW entry produces a named warning and leaves
      `failed` EMPTY; an over-cap HISTORICAL entry produces nothing; a new entry at exactly 6,144
      bytes is silent (boundary).
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decisions_size.py -k "per_entry" -q
    expected: >-
      The over-cap new-entry case asserts failed equals an empty list and a warning string naming
      the cap and the entry; the historical over-cap case asserts no output; the boundary case is
      silent. (Post-authoring correction: "failed == []" is Python source, never printed by a
      passing pytest -q run, so it is deliberately unbackticked here -- see step 3's note.)
    fix_if: >-
      A non-empty `failed` means the cap was wired hard-fail instead of WARN-tier -- the flip is
      owned by migration step 3, not this plan. Silence on the over-cap new entry means the baseline
      reader is not classifying it as new.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-size-per-entry-cap-warn-tier
  - step: 6
    phase: pre-deploy
    action: >-
      Supersession-guard non-regression -- an envelope-bearing entry declaring `amends: [150]` and
      `supersedes: [X]` yields the same edges the textual "amends Decision 150" prose form would.
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_supersession_annotations.py -k "envelope" -q
    expected: extract_supersession_edges returns the envelope-declared edges; the guard's annotation obligation applies to them.
    fix_if: >-
      Zero edges returned means only _EDGE_RE's prose form is consulted -- the envelope union was
      not wired, and envelope entries silently escape the guard.
    hermetic: true
    graduation: graduate
    graduation_check_id: supersession-envelope-borne-edges
  - step: 7
    phase: pre-deploy
    action: >-
      Shared baseline reader -- one git read per validate run across both consumers (Decision 153
      fast-tier budget), plus the unreachable-origin advisory-skip sentinel.
    command: bin/venv-python -m pytest tests/checks/decisions/test__baseline.py -q
    expected: >-
      The memoization test asserts exactly ONE subprocess git invocation when both checks run
      against one root; the unreachable case returns the None sentinel rather than raising.
    fix_if: >-
      More than one invocation means each check still calls its own reader -- collapse them onto the
      shared module. A raise on the unreachable case breaks the advisory-skip contract.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-baseline-reader-single-read
  - step: 8
    phase: pre-deploy
    action: >-
      Contract/check token parity -- the four significance.routing tokens the check enforces are
      exactly the keys in decision-entry.yaml, and the two rejected rows are identified from the
      contract's own "Never a numbered Decision" text rather than a hardcoded list.
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py -k "contract_parity" -q
    expected: >-
      The test derives the token set and the rejected subset from the contract file and asserts the
      check agrees; adding a fifth routing row to the fixture contract changes the accepted set with
      no code edit.
    fix_if: >-
      A divergence means the token list was copied into the module -- the same hardcoded-copy defect
      decision-entry.yaml's shared_parser_note and test_decision_field_grammar.py exist to prevent.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-entry-contract-token-parity
  - step: 9
    phase: pre-deploy
    action: >-
      Decision 167 self-conformance -- the entry this plan authors is under the cap it installs, and
      its envelope PARSES through the new public helper (not a substring test: Decision 133's
      ```yaml reversal-conditions stanza would satisfy a bare substring check) and sits immediately
      after the heading. Also confirms validate_reversal_stanzas stays green corpus-wide, so the
      envelope's bare-`yaml` info string provably does not collide with the monitored fenced form.
    command: >-
      bin/venv-python -c "import sys; from pathlib import Path;
      from scripts.decisions_md import iter_decision_sections, extract_entry_envelope;
      b=dict((int(m.group(1)),blk) for m,blk in iter_decision_sections(Path('docs/DECISIONS.md').read_text(encoding='utf-8')))[167];
      n=len(b.encode('utf-8')); env=extract_entry_envelope(b);
      after_heading=b.split(chr(10),1)[1].lstrip().startswith(chr(96)*3+'yaml'+chr(10));
      print(f'D167 {n} B / 6144 cap; envelope={env is not None}; position_ok={after_heading}; sig={(env or {}).get(chr(115)+chr(105)+chr(103)+chr(110)+chr(105)+chr(102)+chr(105)+chr(99)+chr(97)+chr(110)+chr(99)+chr(101))!r}');
      sys.exit(0 if n<=6144 and env and after_heading else 1)" &&
      bin/venv-python -c "from scripts.checks.ops_governance.validate_reversal_stanzas import validate_reversal_stanzas as v;
      f=[]; v(f); import sys; print('reversal stanzas failed:',f); sys.exit(1 if f else 0)"
    expected: >-
      Prints "D167 <n> B / 6144 cap; envelope=True; position_ok=True" with n at or under 6144 and a
      significance value naming a routing row, then reports zero reversal-stanza failures. Exit 0.
    fix_if: >-
      Over the cap -- move specification out to docs/contracts/decision-entry.yaml (the intended
      pressure) or compress the Related pointer block; never split into a sibling entry, which burns
      a second header against the first-binding ceiling.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a property of one specific entry authored by this plan, not a standing repository
      invariant -- graduating it would pin a permanent guard to decision number 167. The general
      property (every new entry under the cap) is graduated at step 5 as
      decisions-size-per-entry-cap-warn-tier.
  - step: 10
    phase: pre-deploy
    action: >-
      Index edges, freshness and projection boundary -- envelope-declared amends/supersedes reach
      the index through the shared parser, the regenerated index matches the committed file, and
