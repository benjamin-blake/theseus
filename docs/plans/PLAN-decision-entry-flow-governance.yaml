constraints:
  - >-
    FORWARD-ONLY. The 146-entry historical band (119 live + 27 archive) is never retro-enforced and
    no ratified body is REWRITTEN (Decision 151 precedent; the audit's corpus_shape is
    extract_machine_semantics_only, forward-only). "New" means a decision number absent from the
    origin/main baseline, the same test the conformance check already applies. The dated
    `> **Amended by Decision 167 (2026-08-07):**` trailers appended to Decisions 150 and 160 are NOT
    rewrites -- they are the append-only accretion decision-entry.yaml's amendment_forms sanctions,
    and they are required by validate_supersession_annotations regardless of the envelope, since
    Decision 167's own title says "amends Decision 150 and Decision 160" and _EDGE_RE scans the
    whole block including the heading.
  - >-
    ZERO-HEADROOM FILES -- do NOT edit tests/test_checks_registry.py (643/643 SLOC, dec-159
    raise-approved pin). It is not in scope; its assertion lives in the new
    tests/checks/decisions/test_conformance_registration.py. tests/test_decisions_md.py (488/500) is
    NOT edited either -- it is DELETED and its content moved into the tests/decisions_md/ package,
    which is the decomposition. Do not raise either budget: Decision 128 is decompose-by-default,
    and a raise would need its own `# raise-approved: dec-NNN` marker naming an authorizing Decision.
  - >-
    The per-entry cap lands WARN-TIER. It prints and MUST NOT append to `failed`. The hard-fail flip
    is owned by migration step 3 (destination readiness) -- landing it hard here is the
    pressure-before-destination mistake the audit's own sequence warns against, since routing is
    one-way-at-entry and no lifecycle mechanism undoes a misroute later.
  - >-
    Cap value is 6,144 bytes (heading-to-next-heading UTF-8 span), ruled by the operator at Step 6b.
    Do not change it during implementation. If Decision 167 will not fit, move specification into
    docs/contracts/decision-entry.yaml -- never raise the cap, and never split into a sibling entry
    (two capped entries burn two headers against the first-binding ceiling).
  - >-
    Exactly ONE new numbered Decision entry. Decision 167 covers the entire ruling (envelope +
    Significance element + cap value + routing-rule home) as a single entry.
  - >-
    Envelope delimiter is a fenced ```yaml block with a BARE `yaml` info string, NOT a `---` fence
    and never `yaml reversal-conditions`. `---` is triply overloaded here: the pinned
    block_separator, the trailing separator the conformance check requires on every new block, and a
    field terminator in both parser terminator constants. The bare-`yaml` info string is what keeps
    the envelope distinct from Decision 133's monitored ```yaml reversal-conditions stanza, which
    scripts/preflight/decision_conditions.py matches on the exact info string and closes with
    `^```$` -- pin this in the contract and cover it at step 9.
  - >-
    Mechanics route to docs/contracts/decision-entry.yaml, rationale to Decision 167 (Decision
    86/127). No new standing prose-architecture doc under docs/ (Decision 86 intent-doc freeze).
  - >-
    `significance` is NOT added to _DECISION_BACKFILL_COLS, DecisionPayload,
    config/agent/data_quality, or docs/decisions-index.json -- it is parser-surfaced and check-read
    only, mirroring the index-only treatment of intent/amends/title_supersedes (Decision 84
    warehouse-safety boundary; Decision 166 point 9 index pin).
  - >-
    Compacted stubs (Decision 149) are EXEMPT from the envelope obligation -- a compaction replaces a
    body it never authored, and its stub_grammar fixes `**Status:** Superseded`, which would
    otherwise trip the envelope/body conflict rule. State the exemption in decision-entry.yaml.
  - >-
    One shared origin/main baseline read across both --pre consumers (Decision 153 fast-tier budget).
    Do not add a second git invocation to the fast tier, and do not add a THIRD reachability
    implementation -- _baseline.py delegates to scripts.checks._common.origin_main_reachable and the
    private duplicate in validate_decision_entry_conformance is deleted.
  - >-
    validate_decisions_size currently takes only `failed` and has no injection seam; its tests patch
    scripts.checks._common.ROOT. Add an explicit `baseline_reader` (and `root`) seam mirroring
    validate_decision_entry_conformance's, or the WARN-tier per-entry path is untestable -- in a
    tmp_path with no git repo the shared reader returns the None sentinel and advisory-skips.
  - >-
    Do not hardcode the routing-token vocabulary. The check reads it from decision-entry.yaml at
    check time, as it already does for required_markers (contract is the single source of truth).
  - No rescue agents or workaround loops (Decision 55). A cap or conformance failure fails loud and is forward-fixed.
  - Only files in the Scope table may be modified.
