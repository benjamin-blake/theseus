  Every change is additive and forward-only. Reverting the commit restores the prior grammar with no
  data migration: the envelope is read-preferred but never required by the parser (the bold-marker
  fallback is retained), no ratified body is rewritten, and the only corpus change is the single
  Decision 167 entry plus the regenerated index. If the cap proves mis-set in production, it is a
  one-constant change in validate_decisions_size.py at WARN tier, which fails nothing while it is
  retuned -- the reason the audit staged it WARN-first.
