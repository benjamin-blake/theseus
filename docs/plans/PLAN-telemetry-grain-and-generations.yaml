    which has no duckdb) and keeps test_contract_amendments.py fast-tier importable. Homed in tests/fixtures/ per
    tests/CLAUDE.md's shared-helper rule (name never starts with test_, Decision 131). Not production code (Decision 84 I-3);
    rec-4024's reader verbs must pass the same vectors on DuckLake.
- file: tests/telemetry/test_dedupe_vectors.py
