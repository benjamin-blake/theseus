schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-grain-and-generations
intent: >-
  Make "enforce the table's declared grain at the write boundary" a platform data-modeling standard (a new numbered Decision
  plus a data-modeling-standard.yaml rule) and apply it to the telemetry writer kernel, then settle when a telemetry producer
  bumps parser_version and how readers pick the authoritative rows (rec-4061 R8, bundling rec-4062's final-usage tiebreak)
  as generation-aware contract amendments pinned by executable conformance vectors -- so no producer ships against rec-4024
  under a write path that silently drops conflicting rows or a read rule that cannot retire rows a new parser stops emitting
  or re-keys. Friction and cost telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-grain-and-generations.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- contract and kernel groundwork for slice 2; closes NO exit criterion (c1 needs
  the tables provisioned by rec-4024). Clears rec-4061, the last open contract-risk dependency of rec-4024
  (rec-4058/4059/4060 merged in #1295).
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    (1) NEW numbered Decision (N = origin/main max + 1 at implementation time; 207 expected after the two persona plans)
    "Grain enforced at the write boundary", scoped by write_mode class (Decision 191 cl.1), never by table name: it binds
    INSERT-GRAIN tables -- append_only journals and SCD2 history tables. The enforced grain key is, for an SCD2 history
    table, its write ULID (one row per write), and for an append_only table, its declared merge/dedupe key (telemetry:
    producer, event_id, parser_version). Each declares its grain key; its write boundary
    treats a re-send identical under an existing grain key as a no-op and REJECTS LOUDLY (fails the write, names the key) a
    row whose content differs under an existing grain key -- never silently dropped, never first-wins or last-wins. Where the
    engine offers it, the reject is the native single-statement primitive (Decision 100 spirit; no second catalog read,
    Decision 88 cl.1 egress budget).
    Reader rule (append_only journals): a reader returns one row per grain key; for a differing pair (only reachable
    through the concurrent-append race Decision 81 cl.3's no-serialization model allows) which row is returned is
    unspecified, the key is reported as conflicted, and DQ flags it -- a conflict is never resolved silently. SCD2 history
    readers (e.g. the rec_history named verb) are exempt: a duplicate write ULID there is detected by DQ (rec-4121 item 4),
    not by readers. Enforcement boundary: the
    write-time lookup is bounded to the batch's partitions (Decision 88), so the enforced physical grain includes the
    partition column; a cross-partition collision is a producer defect the table's own identity rules must make impossible
    (for telemetry, R7's pinned session_started_at). A stored or computed whole-row
    content hash as tiebreak was considered and rejected: it hides the defect. OUT OF SCOPE: Type-1 current projections
    (derived, rebuildable from history, Decision 81 cl.8 upserts by design), control-class tables (the Decision 84 I-2
    counter), and replacement-shaped derived materializations (T2.52 c1). Builds on Decision 81 cl.3 and 199 cl.1-2 without
    amending them; the telemetry physical grain (producer, event_id, parser_version) refines 199 cl.1's logical one row per
    lifecycle event. Decision 181 cl.2 coverage: writer side -- telemetry kernel (this plan); named non-compliant residuals
    owned by rec-4121: the ops writer's idempotency replay and history MERGE on the write ULID, and ops_smoke_events
    (append_only, grain event_id, but write_ops MERGEs on a per-call write ULID, so a re-write inserts a duplicate); DQ side -- telemetry grain-conflict,
    pending-generation and null-producer monitors (rec-4063), ops-history duplicate-ULID-with-differing-content check
    (rec-4121; its context was widened at planning time to own it and the ops_smoke_events residual); reader side -- telemetry reader verbs (rec-4024) and the derived-layer harness (rec-4025); SCD2 history readers exempt,
    DQ-covered (rec-4121 item 4). Future consumers:
    T4.23 c9, T3.20 c2. Envelope significance numbered_decision; contract-first justification names
    data-modeling-standard.yaml (the rule lands there too) and why it cannot be the only home (changes writer failure
    semantics across write_mode classes, binds present and future writers, needs reversal conditions) and why an
    amendment_forms annotation on 199 is not enough (platform-wide, not telemetry-only). Reversal conditions include DuckLake
    shipping engine-enforced unique keys (adopt them; Decision 100). <= 6,144 bytes (Decision 167 cl.3): keep the carve-outs
    and coverage terse, pointing at the contract rule for detail. (2) Dated trailing-bracket annotations (Decision 177
    dialect, decision-entry.yaml amendment_forms) on Decision 81 cl.3 and Decision 84 I-2: the history MERGE on the write
    ULID and the file_ops replay are a named residual of Decision N, fixed by rec-4121.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated for the new Decision (validate_decisions_index_freshness); never hand-edited.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    New rule `grain-enforced-at-write` beside `grain-first`, citing the new Decision and carrying its write_mode scope and
    carve-outs: the declared grain key is enforced by the write boundary (identical re-send = no-op; conflicting row = loud
    rejection); an append_only reader returns one row per grain key and reports a differing pair as conflicted, never
    resolving it silently (SCD2 history readers exempt, DQ-covered); DQ owns the race window; enforcement is bounded to the
    batch's partitions, so the partition column is part of the enforced physical grain. design_time_walk step 1 (grain) gains
    one sentence: declare the grain key and enforce it at the write boundary per rule grain-enforced-at-write. Contract-level
    amendment_log entry; bump decisions_cited, version and updated_* as the file's own header convention requires.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    collapse_or_reject_duplicates takes the 3-column telemetry grain key (signature widens from tuple[str, str]); within a
    batch, two rows under one grain key that differ only in created_timestamp or producer_version collapse, any other
    difference raises (a new pure helper returns the differing column names and is used here). A new check rejects a NULL in
    any grain-key column (AppendError naming the column).
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    Grain key (producer, event_id, parser_version). (a) append_events enforces the grain-key columns non-null itself,
    independent of spec.not_null (a directly-built EventTableSpec must not admit producer=None -- a NULL never matches the ON
    clause and would re-insert on every replay); producer also joins _STRUCTURAL_NOT_NULL. (b)
    EventTableSpec.from_projection requires dedupe_key [producer, event_id, parser_version] and adds producer to its
    required-column tuple (append.py:93), so a projection without it fails at spec construction. (c) The single insert-only MERGE
    becomes the native reject-on-conflict statement verified on duckdb 1.5.4 + ducklake: ON producer, event_id,
    parser_version and the batch's day bounds; WHEN MATCHED AND (t.<c1>, ..., t.<cn>) IS DISTINCT FROM (s.<c1>, ..., s.<cn>)
    -- every stored column except created_timestamp and producer_version -- THEN ERROR naming the event_id; WHEN NOT MATCHED
    THEN INSERT. One statement, same transaction, no second catalog read (Decision 88 cl.1 egress budget); a conflict raises, the transaction rolls back
    and nothing in the batch is inserted. The ERROR arm's message carries a fixed token (TELEMETRY_GRAIN_CONFLICT) plus the
    event_id; after ROLLBACK, only an exception whose text carries that token is re-raised as AppendError -- every other
    engine error (binder, DuckLake OCC/transaction) propagates unchanged, preserving rec-4024's retry distinction (the module
    stays duckdb-free at runtime, test_package_boundary.py, so the match is on the token, never the exception class).
    Identical and producer_version-only re-sends stay a no-op. Module docstring updated.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    dedupe_key projects as [producer, event_id, parser_version]; producer joins _ENVELOPE_REQUIRED_FIELDS; module docstring
    (line 13) restates the new key.
- file: tests/fixtures/event_contracts/fixture-event-envelope.yaml
  action: Modify
  purpose: Add a producer field so the fixture-based projection tests satisfy the widened _ENVELOPE_REQUIRED_FIELDS.
- file: tests/fixtures/event_contracts/fixture_events.yaml
  action: Modify
  purpose: $ref the fixture envelope's producer field.
- file: tests/telemetry/test_gate.py
  action: Modify
  purpose: >-
    New module-level tests test_grain_key_includes_producer (two producers, same event_id and parser_version, both kept;
    producer_version-only difference collapses; content difference raises) and test_grain_key_null_column_rejected.
- file: tests/telemetry/test_append.py
  action: Modify
  purpose: >-
    Add producer to _COLUMNS and _row(). TestMergeShapeAndBounds: line 206's `"WHEN MATCHED" not in sql` (the insert-only
    guard) is REPLACED, not deleted, by positive assertions that the only MATCHED arm ends THEN ERROR (no THEN UPDATE, no
    THEN DELETE) and that WHEN NOT MATCHED THEN INSERT remains; line 207's ON-string assertion gains producer.
    TestEventTableSpecFromProjection._base_entry gains the producer column and the 3-column dedupe_key.
    test_sql_failure_rolls_back_and_connection_stays_usable additionally asserts the binder error is NOT an AppendError.
    New module-level tests: test_cross_batch_grain_conflict_rejected (nothing inserted, AppendError names the event_id),
    test_producer_version_only_resend_is_noop, test_cross_producer_same_event_id_both_insert,
    test_null_producer_rejected_without_spec_not_null (spec whose not_null omits producer), and
    test_from_projection_rejects_two_column_dedupe_key. test_append_events_replay_is_noop stays green.
- file: tests/telemetry/test_append_ducklake_integration.py
  action: Modify
  purpose: >-
    Add producer to the fixture columns, to _row() (lines 96-107) and to the positional seed INSERTs (lines 177-181,
    216-219). Real local DuckLake
    (pytest -m integration): cross-batch conflict rejected and the table unchanged; cross-producer same event_id both
    stored; identical and producer_version-only replays insert 0; a NULL producer rejected; the one-file-per-write
    assertion (TestSingleSessionBatchOneFile, from line 135) and the day-bounded single-file read assertion
    (TestDayBoundedMergeReadsExactlyOneFile, lines 166-200) still hold with the new MERGE.
- file: tests/test_field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Update the dedupe_key assertion (line 58); new module-level test_dedupe_key_is_telemetry_grain asserting
    [producer, event_id, parser_version] for the fixture and for the four real telemetry contracts.
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    (1) parser_version description/semantics/populated_by: R1 -- a per-producer, hand-maintained integer constant on every
    row the producer emits in all four tables; increments iff the producer's normalised output (event_ids, entity keys, every
    stored column except created_timestamp and producer_version) for any golden input differs from the previous version;
    never for identical output or a build change alone; never decrements, never reused (a revert ships as a NEW higher
    number); an identity-spec change or a change to ANY session entity_ref grammar (root or sub-agent -- the generation
    unit is the session, so a re-keyed session escapes R5a retirement) bumps EVERY producer and requires a Decision (R10); the
    registry and golden-corpus check that enforce it are rec-4122. Replaces "from its own build/version identity" and the
    unconsumed whole-root-tree sentence. (2) producer semantics: part of the grain key; parser_version is comparable only
    between rows sharing a producer (R2). (3) event_id.semantics and created_timestamp.description: the grain is (producer,
    event_id, parser_version), enforced at write per the new Decision; pointer to the READ-SIDE rule. (4) external_ref
    description: "Unique within (tenant, project, table)" rescoped to (tenant, project, table, producer) -- the model_call
    ref is shared across producers by design. (5) governance_notes: replace MODEL_CALL DEDUPE and the "REFS ARE UNIQUE ...
    writer's own anti-join best-effort only" sentence with GENERATIONS AND READ-SIDE DEDUPE --
    R3 marker: P's telemetry_sessions open row for S at v commits all of P's rows for S in all four tables at v; its
    event_id is stable across versions.
    R4: V*(P,S) = max parser_version of P's open rows for S within S's partition.
    R5 layered rule, bounded to that partition: (a) retire P's rows for S with parser_version != V* when V* is defined (below
    retired, above pending); (b) event collapse per (producer, event_id): keep the highest parser_version remaining after (a)
    (so V* when defined, the highest version when not -- a non-replayable producer); among rows at that version keep the
    earliest created_timestamp, which the write-time rule makes content-identical except in the concurrent race, where the
    reader returns one row per grain key (which one is unspecified) and reports the key as conflicted -- the conflict
    report is the normative output and the conflict is never resolved silently; (c) model_call entity collapse per
    observation_id: producer precedence claude_code, litellm, then others, then event_timestamp DESC (final usage wins,
    rec-4062), then created_timestamp asc, then producer asc, then event_id asc (a total order).
    R6: a telemetry_agents row belongs to its own (child) session_id's generation.
    R7 producer obligations: a producer never emits two different rows under one grain key (a model_call is emitted only
    once its source record carries final usage); every emitted column is a pure function of the source records plus the
    inputs pinned with the cursor, and incremental emission equals a full re-parse for every row already emitted; a replayable producer on a bump re-parses the whole root tree from the
    start, writes data rows first and ONE telemetry_sessions batch of every tree session's rows LAST, binds its cursor to
    parser_version and resets it on mismatch, never emits v for S after a v+1 marker, and REUSES the pinned project_ref and
    session_started_at persisted with its cursor across a reset (never re-reading config), so a re-emission cannot re-key
    the tree.
    R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
    DQ intents (owner rec-4063): more than one distinct row per grain key; pending generations older than 2h; null producer.
    Name tests/telemetry/fixtures/dedupe_vectors.yaml as this rule's CONFORMANCE VECTORS (normative, like
    identity_vectors.yaml). Field-level amendment_log entries (governance_note_add, semantic_break true) plus one
    contract-level entry. contract_version stays 1.
