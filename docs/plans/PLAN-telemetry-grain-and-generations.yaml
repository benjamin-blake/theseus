schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-grain-and-generations
intent: >-
  Make "enforce the table's declared grain at the write boundary" a platform data-modeling standard (a new numbered Decision
  plus a data-modeling-standard.yaml rule) and apply it to the telemetry writer kernel, then settle when a telemetry producer
  bumps parser_version and how readers pick the authoritative rows (rec-4061 R8, bundling rec-4062's final-usage tiebreak)
  as generation-aware contract amendments pinned by executable conformance vectors -- so no producer ships against rec-4024
  under a write path that silently drops conflicting rows or a read rule that cannot retire rows a new parser stops emitting
  or re-keys. Friction and cost telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-grain-and-generations.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- contract and kernel groundwork for slice 2; closes NO exit criterion (c1 needs
  the tables provisioned by rec-4024). Clears rec-4061, the last open contract-risk dependency of rec-4024
  (rec-4058/4059/4060 merged in #1295).
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    NEW numbered Decision (N = origin/main max + 1 at implementation time; 207 expected after the two persona plans) "Grain
    enforced at the write boundary", scoped by write_mode class (Decision 191 cl.1), never by table name: it binds
    INSERT-GRAIN tables -- append_only journals and SCD2 history tables. Each declares its grain key; its write boundary
    treats a re-send identical under an existing grain key as a no-op and REJECTS LOUDLY (fails the write, names the key) a
    row whose content differs under an existing grain key -- never silently dropped, never first-wins or last-wins. Readers
    keep the first write only among content-identical duplicates; a differing pair (only reachable through the concurrent-append
    race Decision 81 cl.3's no-serialization model allows) is reported by the reader and flagged by DQ on the existing DQ path
    (Decision 62), never silently picked. A stored or computed whole-row content hash as tiebreak was considered and rejected:
    it hides the defect. OUT OF SCOPE: Type-1 current projections (derived, rebuildable, Decision 81 cl.8 upserts by
    design), control-class tables (the Decision 84 I-2 counter), and replacement-shaped derived materializations (T2.52 c1).
    Builds on Decision 81 cl.3 and 199 cl.1-2 without amending them; the telemetry physical grain (producer, event_id,
    parser_version) refines 199 cl.1's logical one row per lifecycle event. Names the known non-compliant residual (the ops
    writer's idempotency replay returns the original result without comparing content, src/common/ducklake_writes.py
    file_ops replay check, and the history MERGE on the write ULID) and its follow-on rec-4121 (Decision 181 cl.2
    coverage declaration). Future consumers: T4.23 c9, T3.20 c2. Envelope significance numbered_decision; contract-first
    justification names data-modeling-standard.yaml (the rule lands there too) and why it cannot be the only home (changes
    writer failure semantics across write_mode classes, binds present and future writers, needs reversal conditions) and why
    an amendment_forms annotation on 199 is not enough (platform-wide, not telemetry-only). Reversal conditions include
    DuckLake shipping engine-enforced unique keys (adopt them, retire the compare; Decision 100). <= 6,144 bytes.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated for the new Decision (validate_decisions_index_freshness); never hand-edited.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    New rule `grain-enforced-at-write` beside `grain-first`, citing the new Decision and carrying its write_mode scope and
    carve-outs: the declared grain key is enforced by the write boundary (identical re-send = no-op; conflicting row = loud
    rejection); readers never tiebreak conflicting grain-key rows; DQ owns the race window. Contract-level amendment_log entry.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    collapse_or_reject_duplicates takes the telemetry grain key (producer, event_id, parser_version); a new pure helper
    compares an incoming row with a stored row over every stored column except created_timestamp and producer_version and
    returns the differing column names (reused by append.py).
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    Grain key (producer, event_id, parser_version): producer joins _STRUCTURAL_NOT_NULL; EventTableSpec.from_projection
    requires dedupe_key [producer, event_id, parser_version]; inside the existing transaction, before the insert-only MERGE,
    SELECT stored rows matching the batch's grain keys within its day bounds -- same connection and transaction, pruned to the
    batch's calendar-day partitions (Decision 88 cl.1) -- and raise AppendError naming the first conflicting event_id and
    columns (ROLLBACK, nothing inserted); the MERGE ON clause gains producer. Identical re-sends stay
    a no-op; a producer_version-only difference is not a conflict. Docstring updated.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: dedupe_key projects as [producer, event_id, parser_version]; producer joins _ENVELOPE_REQUIRED_FIELDS.
- file: tests/telemetry/test_gate.py
  action: Modify
  purpose: Within-batch key includes producer (two producers, same event_id and parser_version, both kept); the comparison helper ignores created_timestamp/producer_version and names differing columns.
- file: tests/telemetry/test_append.py
  action: Modify
  purpose: >-
    test_append_events_replay_is_noop stays green; new: cross-batch conflicting row rejected with nothing inserted;
    producer_version-only re-send is a no-op; two producers sharing event_id and parser_version both insert; null producer
    rejected; from_projection rejects the old two-column dedupe_key.
- file: tests/telemetry/test_append_ducklake_integration.py
  action: Modify
  purpose: >-
    Real local DuckLake (pytest -m integration): cross-batch conflict rejected and the table unchanged; cross-producer same
    event_id both stored; identical replay inserts 0.
- file: tests/test_field_semantics_event_projection.py
  action: Modify
  purpose: Projected dedupe_key == [producer, event_id, parser_version] for the fixture and the four real telemetry contracts.
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    (1) parser_version description/semantics/populated_by: R1 -- a per-producer, hand-maintained integer constant on every
    row the producer emits in all four tables; increments iff the producer's normalised output (event_ids, entity keys, every
    stored column except created_timestamp and producer_version) for any golden input differs from the previous version;
    never for identical output or a build change alone; never decrements, never reused (a revert ships as a NEW higher
    number); an identity-spec or root session_ref grammar change bumps EVERY producer and requires a Decision (R10).
    Replaces "from its own build/version identity" and the unconsumed whole-root-tree sentence. (2) producer semantics: part
    of the grain key; parser_version is comparable only between rows sharing a producer (R2). (3) event_id.semantics and
    created_timestamp.description: grain is (producer, event_id, parser_version), enforced at write per the new Decision;
    pointer to the READ-SIDE rule. (4) governance_notes: replace MODEL_CALL DEDUPE with GENERATIONS AND READ-SIDE DEDUPE --
    R3 marker (P's telemetry_sessions open row for S at v commits all of P's rows for S in all four tables at v; its
    event_id is stable across versions), R4 V*(P,S) = max parser_version of P's open rows for S within S's partition, R5
    layered rule (a retire != V* when defined -- below retired, above pending; b event collapse per (producer, event_id):
    parser_version desc, created_timestamp asc, applied only to content-identical duplicates -- a differing pair under one
    grain key is reported, never silently picked; c model_call entity collapse per observation_id: precedence claude_code,
    litellm, then others, then event_timestamp DESC (final usage wins, rec-4062), created_timestamp asc), R6 a
    telemetry_agents row belongs to its own (child) session_id's generation, R7 replayable-producer obligations (re-parse the
    whole root tree from the start; data rows first; ONE telemetry_sessions batch of every tree session's rows LAST; cursor
    bound to parser_version, reset on mismatch; never emit v for S after a v+1 marker; emit a model_call only once its source
    record carries final usage), R8 non-replayable producers (no open marker, never re-emit, a bump retires nothing), and the
    DQ intents handed to the telemetry DQ slice (pending generations older than 2h; more than one distinct row per grain key;
    null producer). Name tests/telemetry/fixtures/dedupe_vectors.yaml as this rule's CONFORMANCE VECTORS (normative, like
    identity_vectors.yaml). Field-level amendment_log entries (governance_note_add, semantic_break true) plus one
    contract-level entry. contract_version stays 1.
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    producer gains dq_intent_local not_null enforced true (R2); event_kind governance_notes_local names the open row as the
    producer's generation marker (pointer to the envelope). At 499/500 effective lines: compact the rec-4073 contract-level
    amendment_log summary (relief valve 1) so the file stays within the cap -- never a raise.
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: producer gains dq_intent_local not_null enforced true (R2).
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: producer gains dq_intent_local not_null enforced true (R2).
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: >-
    producer gains dq_intent_local not_null enforced true (R2); session_id governance_notes_local adds that the row commits
    with the CHILD session's generation marker (R6).
- file: tests/telemetry/fixtures/dedupe_vectors.yaml
  action: Create
  purpose: >-
    Normative conformance vectors for the READ-SIDE rule: one vector per situation 1-10 of the R8 facts brief (identical
    rebuild; content change at unchanged event_ids; dropped rows/kinds; added kinds; re-keyed event_ids; revert as v+2; deploy
    mid-session for claude_code (pending v+1 rows hidden until the marker lands, then v retired) and for litellm (v and v+1
    coexist); child-keyed agents rows committed by the child marker; cross-producer model_call incl. a shared event_id;
    same-build replay) plus a partial-then-final model_call under one parser_version (rec-4062) and a crashed re-emission
    (data at v+1, no marker). Each vector lists input rows per table and the expected surviving event_ids per table.
- file: tests/telemetry/dedupe_reference.py
  action: Create
  purpose: >-
    Test-side reference implementation (oracle) of R4/R5 as DuckDB SQL over in-memory tables built from a vector, returning
    the authoritative rows per table. Not production code (Decision 84 I-3: callers never ship SQL); rec-4024's reader verbs
    must pass the same vectors on DuckLake. Name must not start with test_ (Decision 131).
- file: tests/telemetry/test_dedupe_vectors.py
  action: Create
  purpose: >-
    Parametrised over every vector: builds the tables, runs the reference, asserts surviving event_ids exactly; plus a
    meta-test that every situation 1-10 has a vector and that the envelope governance_notes name this fixture.
- file: tests/telemetry/test_contract_amendments.py
  action: Modify
  purpose: >-
    Add the two MODULE-LEVEL tests named by the rec acceptance commands (module landed in #1295; append, never recreate):
    test_parser_version_bump_policy_declared (R1/R2/R3/R10 phrasing over whitespace-normalised text; populated_by no longer
    says build identity; producer not_null enforced on all four tables; amendment_log entries present) and
    test_model_call_tiebreak_prefers_final_usage (governance_notes order model_call by event_timestamp desc after producer
    precedence; no live text keeps earliest created_timestamp as the model_call tiebreak; the partial-then-final vector's
    final-usage row survives the reference); plus test_grain_enforced_at_write_rule_declared (data-modeling-standard.yaml
    carries rule grain-enforced-at-write citing the new Decision). Update the module docstring's R8 sentence.
- file: config/agent/verification_registry/entries/telemetry-dedupe-vectors.yaml
  action: Create
