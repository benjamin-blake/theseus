execution_steps:
- >-
  Tests first: extend tests/telemetry/test_gate.py, test_append.py, test_append_ducklake_integration.py and
  tests/test_field_semantics_event_projection.py (plus the two event_contracts fixtures) for the grain key; create the
  dedupe vectors, the stdlib reference and test_dedupe_vectors.py; add the three tests to
  tests/telemetry/test_contract_amendments.py. Confirm the new nodes FAIL on the unchanged tree.
- Change src/telemetry/gate.py, src/telemetry/append.py and scripts/field_semantics_event_projection.py per scope.
- >-
  Add the Decision to docs/DECISIONS.md with the annotations on 81 cl.3 and 84 I-2, regenerate docs/decisions-index.json,
  add the data-modeling-standard.yaml rule.
- Amend telemetry-event-envelope.yaml and the four table contracts per scope; compact telemetry_sessions' amendment_log.
- Write the two registry rows for graduated steps 1 and 3.
- Execute Verification Plan steps 1-9 -- loop until pass (Decision 55).
- >-
  Portal bookkeeping (fetch-before-update via rec_by_id, prepend a dated note, never overwrite): rec-4024 (grain is now
  (producer, event_id, parser_version) with native reject; readers use the GENERATIONS rule and must pass dedupe_vectors.yaml
  on DuckLake and report conflicted keys -- replacing its "row uniqueness (event_id, parser_version)" and "max per
  (session_id, producer)" wording); rec-4063 (owns the three DQ monitors named in the envelope); rec-4025 (consume the
  vectors); rec-4064 (its R10 is settled by R5a, its R5 by the external_ref rescope). rec-4121 and rec-4122 were
  already widened at planning time (ops_smoke_events residual and ops-history DQ; R7 determinism check) -- verify, do not repeat.
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence),
  each reported on its own and never merged into one PASS. (a) READINESS: run bin/venv-python -m
  scripts.session.github_readiness and record each state exactly as reported -- unknown is unproven, and readiness never
  authorizes a push.
- (b) Set implementation_declared true on this plan (sanctioned bookkeeping edit), then re-run step 9's --pre sibling (bin/venv-python -m scripts.validate --pre).
- >-
  (c) Commit, then git fetch origin main and git rebase origin/main (STOP on conflict; re-check the Decision number), then
  PARENT VALIDATOR EVIDENCE: VP step 9 -- the full tier on the committed, rebased, clean tree -- followed by
  bin/venv-python -m scripts.checks.validation_result --verify-head so logs/debug/validation-result.json attests HEAD's tree. On timeout
  the disposition is blocked: rerun from the start, never push on a partial run. Any fix commit repeats (c).
- >-
  (d) STRUCTURED POSTFLIGHT EVIDENCE: write a scratch JSON file (session scratchpad) holding exactly the
  scripts.session.postflight_evidence.CATEGORIES keys, then run bin/venv-python -m scripts.session.postflight --evidence
  <that file>.
- >-
  (e) REAL OUTCOMES, reported separately from (a)-(d): push and open the PR ready for review; subscribe to PR activity; on
  green CI squash-merge via mcp__github__merge_pull_request with commit_message carrying 'Resolves: rec-4061, rec-4062' in
  its own trailer block; event-driven, never poll; then run step 10. Report the minted Decision number, the graduated check
  ids and the rec closure state.
