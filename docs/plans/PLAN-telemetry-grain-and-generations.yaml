    tests/test_contracts_schema.py tests/test_field_semantics_event_projection.py tests/telemetry -q
  expected: Exit 0; no failures.
  fix_if: >-
    A contract_version assertion fails -> revert the bump. A pre-existing test asserting the OLD two-column key or
    insert-only shape fails -> update that test to the new shape as scoped (replace a guard, never delete it); a failure in a
    new behaviour test -> fix the kernel or contract.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing registered test modules; graduating them again duplicates standing coverage.
  expected_literals: []
- step: 7
  phase: pre-deploy
  action: Category-6 amendment ritual for the five amended telemetry contracts against origin/main.
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from
    scripts.contracts_enforcement import check_amendment_for_diff;base=lambda f:yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in ('telemetry-event-envelope','telemetry_sessions','telemetry_observations','telemetry_transcripts','telemetry_agents')];print(chr(10).join(errs)
    or 'AMENDMENTS_OK');assert not errs"
  expected: Exit 0 and the success marker printed.
  fix_if: A category-6 error names a field -- add its field-level amendment_log entry with a consistent change_class/semantic_break pair.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Diff-relative to origin/main by construction; the standing equivalent is scripts.validate's contract drift gate.
- step: 8
  phase: pre-deploy
  action: Size cap and stale-phrase sweep over the contracts (old grain, best-effort suppression, MODEL_CALL DEDUPE, old tiebreak).
  command: >-
    bin/venv-python -c "from scripts.checks.structural._classify import effective_lines;import re,glob;big=[(f,effective_lines(open(f).read()))
    for f in glob.glob('docs/contracts/telemetry*.yaml') if effective_lines(open(f).read())>500];pat=re.compile(r'build/version
    identity|then (the )?earliest created_timestamp|best-effort only|anti-join on \(event_id, parser_version\)|MODEL_CALL
    DEDUPE|Unique within \(tenant, project, table\)');stale=[f for f in glob.glob('docs/contracts/*.yaml') if
    pat.search(re.sub(r'\s+',' ',open(f).read()))];print(big,stale);assert not big and not stale;print('SIZE_SWEEP_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    An oversized contract -> compact its amendment_log (relief valve 1), never raise. A stale hit -> reword or amend that text
    (an amendment_log summary quoting the old phrase must paraphrase it).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Size is guarded standing by validate_structural_size_limits; the phrase sweep pins text this plan deletes and step 5's
    graduated module asserts the replacement rules.
  expected_literals:
  - SIZE_SWEEP_OK
- step: 9
  phase: pre-deploy
  action: Full validation tier before handoff (decisions size/index freshness, data-model standard, SLOC, graduation completeness).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    Closure -- after the squash merge carrying 'Resolves: rec-4061, rec-4062', confirm both recs read closed.
  command: >-
    bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib; r={json.loads(l)['id']:json.loads(l)['status']
    for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()}; bad=[k for k in
    ('rec-4061','rec-4062') if r.get(k)!='closed']; print('open:', bad); raise SystemExit(1 if bad else 0)"
  expected: Exit 0, empty open list.
  fix_if: >-
    The recs cache sync pulls 0 recommendations (reader 502) -> confirm each status with the ducklake-reads rec_by_id named
    read instead; trailer closure no-op'd -> Decision 201 manual update_rec fallback citing the transport failure; an
    acceptance refusal -> fix the failing acceptance, never force-close.
