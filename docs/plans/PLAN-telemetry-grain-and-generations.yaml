  action: Run the conformance vectors through the reference read rule.
  command: bin/venv-python -m pytest tests/telemetry/test_dedupe_vectors.py -q
  expected: 'Exit 0, all vectors pass. Red before: the module and fixture do not exist on the pre-change tree.'
  fix_if: >-
    A vector names the table and the unexpected/missing event_id -- fix the reference SQL if it departs from the contract rule,
    else fix the vector; never loosen an expectation to match output.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-dedupe-vectors
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Grain enforcement in the kernel, unit tier (conflict rejected, re-sends no-op, cross-producer kept, null producer rejected).
  command: bin/venv-python -m pytest tests/telemetry/test_append.py tests/telemetry/test_gate.py tests/test_field_semantics_event_projection.py -q
  expected: 'Exit 0. Red before: the new conflict/cross-producer tests fail on the pre-change kernel (the MERGE silently drops).'
  fix_if: >-
    A conflict test inserts a row -> the pre-MERGE comparison is missing or scoped wrong; a replay test raises -> the
    comparison includes created_timestamp or producer_version.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-grain-enforced-at-write
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Grain enforcement on a real local DuckLake catalog (Decision 99 pinned engine).
  command: bin/venv-python -m pytest tests/telemetry/test_append_ducklake_integration.py -m integration -q
  expected: Exit 0; no skips (the fixture fails, never skips, when the extension is unavailable).
  fix_if: A DuckLake-only failure (e.g. the pre-MERGE SELECT under the transaction) -> fix append.py, never mark the test skip.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Integration tier by construction (network-installed extension); step 2's graduated unit tests guard the same behaviour on every PR.
- step: 4
  phase: pre-deploy
  action: Run each rec's acceptance command exactly as filed, plus the data-modeling rule test.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py::test_parser_version_bump_policy_declared
