    with that number and title names rec-4121, rec-4063, rec-4024 and rec-4025 as coverage owners and ops_smoke_events as
    a residual and SCD2 history readers as exempt and DQ-covered; the Decision 81 and Decision 84 sections each carry a
    dated annotation naming rec-4121 and that Decision). Update the module
    docstring's R8 sentence.
- file: config/agent/verification_registry/entries/telemetry-dedupe-vectors.yaml
