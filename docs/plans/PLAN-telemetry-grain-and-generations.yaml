    with the CHILD session's generation marker (R6).
- file: tests/telemetry/fixtures/dedupe_vectors.yaml
  action: Create
  purpose: >-
    Normative conformance vectors for the READ-SIDE rule: one vector per situation 1-10 of the R8 facts brief (identical
    rebuild; content change at unchanged event_ids; dropped rows/kinds; added kinds; re-keyed event_ids; revert as v+2; deploy
    mid-session for claude_code (pending v+1 rows hidden until the marker lands, then v retired) and for litellm (v and v+1
    coexist); child-keyed agents rows committed by the child marker; cross-producer model_call incl. a shared event_id;
    same-build replay) plus a partial-then-final model_call (rec-4062), a crashed re-emission (data at v+1, no marker), a
    non-replayable producer with rows at two versions (R5b without V*), two "others"-rank producers tied on model_call
    (R5c total order), a concurrent-race pair differing under one grain key (expected: the key listed as conflicted; which
    of the tied rows is returned is not asserted), and a re-keyed sub-agent session under an ordinary bump (pins that the old
    child stays authoritative -- the reason R10 forbids session-ref grammar changes outside a Decision). Each vector lists input rows per table, the expected surviving event_ids per table and the
    expected conflicted grain keys.
- file: tests/fixtures/telemetry_dedupe_reference.py
