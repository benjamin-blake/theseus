acceptance_criteria:
- >-
  DECISIONS.md carries the new grain-enforced-at-write Decision (<= 6,144 bytes, envelope significance numbered_decision with
  a contract-first justification, Decision 181 cl.2 coverage owners named) and dated annotations on Decision 81 cl.3 and 84
  I-2; decisions-index.json is fresh; data-modeling-standard.yaml carries rule grain-enforced-at-write citing it.
- >-
  append_events rejects (native MERGE ... THEN ERROR, one statement) a cross-batch row whose content differs under an existing
  (producer, event_id, parser_version), inserting nothing from the batch; keeps identical and producer_version-only re-sends
  as no-ops; stores two producers' rows sharing event_id and parser_version; rejects a NULL grain-key column even when the
  spec's not_null omits it -- on the unit tier and on real local DuckLake.
- >-
  telemetry-event-envelope.yaml parser_version states the bump-iff-output-changes rule, per-producer scope, never-per-build,
  never-reused/revert-is-new-version and the identity-spec clause; populated_by no longer says "build/version identity"; R7
  carries the pinned project_ref/session_started_at reuse obligation.
- >-
  Envelope governance_notes carry the GENERATIONS AND READ-SIDE DEDUPE rule and name tests/telemetry/fixtures/dedupe_vectors.yaml
  as conformance vectors; no live contract text keeps "earliest created_timestamp" as a model_call tiebreak, "best-effort only"
  write suppression, a MODEL_CALL DEDUPE pointer, or external_ref "Unique within (tenant, project, table)".
- producer is not_null enforced on all four tables; every vector passes the reference; both rec acceptance commands pass.
- >-
  Existing contract, projection and kernel suites stay green; category-6 amendment check clean against origin/main; every
  telemetry contract within 500 effective lines with no budget raise; contract_version unchanged on all five contracts.
- rec-4061 and rec-4062 close via the Resolves trailer on the implementation squash merge.
