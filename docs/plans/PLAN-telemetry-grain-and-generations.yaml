  DECISIONS.md carries the new grain-enforced-at-write Decision (<= 6,144 bytes, envelope significance numbered_decision with
  a contract-first justification); decisions-index.json is fresh; data-modeling-standard.yaml carries rule
  grain-enforced-at-write citing it.
- >-
  append_events rejects a cross-batch row whose content differs under an existing (producer, event_id, parser_version),
  inserting nothing; keeps identical and producer_version-only re-sends as no-ops; stores two producers' rows sharing
  event_id and parser_version; rejects a null producer -- on the unit tier and on real local DuckLake.
- >-
