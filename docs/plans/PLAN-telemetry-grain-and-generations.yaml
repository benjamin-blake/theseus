constraints:
- >-
  Sequencing: PLAN-cli-persona-backend (in implementation) edits telemetry_observations.yaml and
  tests/checks/contracts/test_telemetry_event_journal_contracts.py; if it merges first, rebase onto it (it takes
  telemetry_observations.yaml to about 480/500 -- this plan adds about two lines there). Take the next free Decision number
  at implementation time; other in-flight plans also add Decisions.
- >-
  Code limited to src/telemetry/{append,gate}.py and scripts/field_semantics_event_projection.py -- deploy-inert
  (compute_affected_artifacts returns {} for every scope file; src/telemetry is excluded from data-pipeline.zip). No change
  under src/common/ducklake_*.py, src/lambdas/** or config/lambda/ducklake/** (governed deploy channel); the ops writer's
  residual is rec-4121's. No field_semantics.yaml change (telemetry is not in _CONTRACT_TABLE_IDS); no roadmap edit.
- >-
  Within the ratified Decision 199/200 model: no identity-spec or partition change; no contract_version bump; the writer
  stays insert-only (a rejection writes nothing). No duckdb import reaches a fast-tier module (test_dedupe_vectors.py,
  test_contract_amendments.py, tests/fixtures/telemetry_dedupe_reference.py).
- >-
  Category 6: every description/semantics diff carries a NEW field-level amendment_log entry with a consistent
  change_class/semantic_break pair. Every contract stays within the 500 effective-line cap by compaction, never a raise.
- No rescue agents or workaround loops (Decision 55).
