execution_steps:
- "docs/work-item-pilot/telemetry-feedback-loop.yaml: create with exactly this body (the L5 leg asserts cap 12 and the sunset terms):\n# CD.45 pilot fixture (provisional_v0). NOT A ROADMAP: never read by /orient, preflight or a pick surface (Decision 108).\n# Grain: Decision 197 clause 3. Register: clause 4 extension block. Keys, identity and columns stay clause 8's (T4.23 c13/c14).\n# Evaluator: validate_work_item_pilot (scripts/checks/roadmap/). Schema, caps and sunset are frozen in code; this header repeats them.\nfixture:\n  id: telemetry-feedback-loop\n  status: provisional_v0\n  authority: CD.45\n  grain: decision-197-clause-3\n  item_count_cap: 12\n  sunset:\n    first_of: [{criterion_met: \"T4.23:c6\"}, {review_on: \"2027-01-31\"}]\n    outcome: lift rows into the store, or restructure (rehome or reshape) per the operator's review; never delete\n  edges_disposition: pilot_only -- re-authored by the implementation merge on lift (Decision 197 clause 5), never lifted as-is\nwork_items: []\nwork_item_criteria: []\nwork_item_edges: []\n"
- "scripts/checks/roadmap/_work_item_pilot_model.py: Pydantic v2 models, all ConfigDict(extra='forbid'): FixtureHeader (fields as in the body above; first_of a two-element list of single-key maps); Transition {from_ (alias from), to, trigger {metric, comparator in >=,<=,==,>,<, threshold number}}; Maturity {rung, transitions: exactly the three adjacent rung pairs in order}; FailureSignal {signal, metric, source - all non-empty}; Evidence {kind in file_line | check | rec | roadmap | decision, ref} where file_line refs must be path:line and roadmap refs must resolve (checked in L4); Row {id, text <=160}; ConsiderationRegister {why <=240, how <=240, planes non-empty unique subset of [data_plane, control_plane], maturity, failure_signal, verification non-empty criterion ids, rollback <=240, evidence 1..4, settled 1..3 Rows, contested 0..3 Rows, open_questions 0..3 Rows}; WorkItem {id ^pwi-[a-z0-9-]+$, kind in epic | task, title <=120, extension {consideration_register}}; Criterion {work_item, criterion_id ^c[0-9]+$, text <=240, method_kind in execution | review | unresolved_legacy, status in open | met}; Edge {from_ (alias from), to, kind in depends_on | part_of}; Fixture {fixture, work_items, work_item_criteria, work_item_edges}. Constants: FIXTURE_PATH, PILOT_DIR, ITEM_COUNT_CAP=12, MAX_CRITERIA_PER_ITEM=3, MAX_EDGES_FROM_ITEM=3, MAX_EVIDENCE=4, MAX_ROWS=3, SUNSET_CRITERION='T4.23:c6', SUNSET_REVIEW_DATE=date(2027,1,31), EDGE_KINDS, RUNGS. No file I/O at import (AGENTS.md safety)."
- "scripts/checks/roadmap/validate_work_item_pilot.py: @registry.register('validate_work_item_pilot', owner='platform') def validate_work_item_pilot(failed: list[str], *, today: date | None = None) -> None (injectable clock: no registered check reads the wall clock for a verdict today, so the date leg is test-pinned on both sides). Locate ROOT/FIXTURE_PATH; absent -> FAIL and append. Then registry.examined(1, unit='fixtures') before any leg. L1 parse plus Fixture.model_validate, then referential integrity: unique item ids, unique (work_item, criterion_id), every criterion and edge-from names an item, every verification id names a criterion of that item, per-item criteria and edges-from within caps, no self-edge, no duplicate edge. L2 len(work_items) <= ITEM_COUNT_CAP. L3 single instance: git ls-files under ROOT for *.yaml/*.yml; any file other than FIXTURE_PATH with a column-0 work_items:, work_item_criteria: or work_item_edges: key, or any other tracked file under PILOT_DIR, fails, unless that path is named in a docs/DECISIONS.md '## Decision NNN:' section (rehome exit). L4 edge targets: a pilot item id, a ROADMAP-PLATFORM tier_items id, a Tx:cN criterion whose tier item carries that criterion id, or a candidate_decisions id (the Tx:cN criterion target is reserved for the parked third edge kind; it still resolves under depends_on/part_of but W1 should not rely on it); anything else (including rec-NNNN) fails; roadmap evidence refs resolve the same way and file_line refs name a tracked path. L5 header item_count_cap == ITEM_COUNT_CAP and header sunset equals SUNSET_*. L6 sunset: triggered when T4.23's exit criterion c6 has status met or (today or date.today()) >= SUNSET_REVIEW_DATE; when triggered and FIXTURE_PATH (or PILOT_DIR) is in _common.get_changed_files(ROOT), fail unless CD.45's state in ROADMAP-PLATFORM is not pending or a docs/DECISIONS.md Decision section names docs/work-item-pilot/; when triggered and untouched, print a SUNSET REACHED report line and do 