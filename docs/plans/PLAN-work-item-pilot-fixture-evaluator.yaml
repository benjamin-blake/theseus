pre_implementation_checklist:
- Branch confirmed not on main (claude/ prefix)
- docs/PROJECT_CONTEXT.md read
- 'Only the plan-cited decision sections read: Decisions 197 (clauses 3, 4, 5, 8), 209 (clause 2), 196 (clause 7), 170, 108'
- CD.45 read in docs/ROADMAP-PLATFORM.yaml; T4.23 c6 and c10 read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- "docs/work-item-pilot/telemetry-feedback-loop.yaml: create with this body; the three comment lines are free, and everything\
  \ below them must equal render() of the parsed fixture byte-for-byte (L2), so if render() quotes or orders a scalar differently,\
  \ the shipped body follows render() and the content below stays normative (L5 asserts cap 12 and the sunset terms):\n# CD.45\
  \ pilot fixture (provisional_v0). NOT A ROADMAP: never read by /orient, preflight or a pick surface (Decision 108).\n# Grain:\
  \ Decision 197 clause 3. Register: clause 4 extension block. Keys, identity and columns stay clause 8's (T4.23 c13/c14).\n\
  # Evaluator: validate_work_item_pilot (scripts/checks/roadmap/). Schema, caps and sunset are frozen in code; this header\
  \ repeats them.\nfixture:\n  id: telemetry-feedback-loop\n  status: provisional_v0\n  authority: CD.45\n  grain: decision-197-clause-3\n\
  \  item_count_cap: 12\n  sunset:\n    first_of: [{criterion_met: \"T4.23:c6\"}, {review_on: \"2027-01-31\"}]\n    outcome:\
  \ lift rows into the store, or restructure (rehome or reshape) per the operator's review; never delete\n  edges_disposition:\
  \ pilot_only -- re-authored by the implementation merge on lift (Decision 197 clause 5), never lifted as-is\nwork_items:\
  \ []\nwork_item_criteria: []\nwork_item_edges: []\n"
- 'scripts/checks/roadmap/_work_item_pilot_model.py: Pydantic v2 models, all ConfigDict(extra=''forbid''). FixtureHeader (fields
  as in the body above; first_of a two-element list of single-key maps). Transition {from_ (alias from), to, trigger {metric
  <=120, comparator in >=,<=,==,>,<, threshold number}}. Maturity {rung in RUNGS, transitions: exactly the three adjacent
  rung pairs in order}. FailureSignal {signal, metric <=120, source <=120}. Evidence {kind in file_line | check | decision
  | roadmap | rec, ref <=200}; CI_RESOLVABLE_KINDS = {file_line, check, decision, roadmap}. Row {id ^[skq][0-9]+$ <=8, text}.
  ConsiderationRegister {why, how, planes non-empty unique subset of [data_plane, control_plane], maturity, failure_signal,
  verification 1..MAX_CRITERIA_PER_ITEM unique criterion ids, rollback, evidence 1..MAX_EVIDENCE, settled 1..MAX_ROWS, contested
  0..MAX_ROWS, open_questions 0..MAX_ROWS} with a model validator requiring at least one evidence entry whose kind is in CI_RESOLVABLE_KINDS.
  WorkItem {id ^pwi-[a-z0-9-]+$ <=64, kind in epic | task, title, extension {consideration_register}}. Criterion {work_item
  <=64, criterion_id ^c[0-9]+$ <=8, text, method, status in open | met}, where method is a discriminated union on kind (T4.23:c10
