schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: work-item-pilot-fixture-evaluator
intent: >-
  Stand up W0 of the CD.45 telemetry-feedback-loop pilot: an empty provisional_v0 fixture in the Decision 197 clause-3
  work-item grain, its consideration-register schema held in code, and one registered evaluator check that enforces the
  schema, a line-budget-derived item-count cap, a single-instance guard, id-only edge targets against ROADMAP-PLATFORM and
  the first_of(T4.23:c6 met, 2027-01-31 review) sunset, plus discovery registration. W1 then adds only complete items.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-work-item-pilot-fixture-evaluator.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category: operator-directed design-stream W0 under pending CD.45, binding while
  pending; no tier_item claimed, no exit criterion closed). CD.45 names T4.23, T4.24, T3.3, T3.4, T2.36 and T3.20 in
  affects (in-scope-of, never gating).
scope:
- file: docs/work-item-pilot/telemetry-feedback-loop.yaml
  action: Create
  purpose: >-
    The one CD.45 pilot fixture, shipped empty: a fixture header (id, status provisional_v0, authority CD.45, grain,
    item_count_cap 12, sunset first_of, edges_disposition pilot_only) and three empty lists work_items,
    work_item_criteria, work_item_edges. Verbatim body in execution_steps[0].
- file: scripts/checks/roadmap/_work_item_pilot_model.py
  action: Create
  purpose: >-
    Pydantic extra=forbid models for the fixture (header, work item, consideration register, criterion row, edge row)
    plus the frozen constants: FIXTURE_PATH, ITEM_COUNT_CAP=12, per-item list caps, free-text length caps, SUNSET
    (criterion T4.23:c6, review date 2027-01-31), the closed edge vocabulary and the maturity rungs. No I/O at import.
- file: scripts/checks/roadmap/validate_work_item_pilot.py
  action: Create
  purpose: >-
    The registered check validate_work_item_pilot: legs L1 schema and referential integrity, L2 item-count cap, L3
    single-instance guard, L4 edge-target resolution against ROADMAP-PLATFORM, L5 header-equals-code for cap and sunset,
    L6 sunset write-freeze with its two sanctioned exits. Declares registry.examined(1, unit="fixtures") once the
    fixture is located, before any leg, so every later exit path is declared.
- file: scripts/checks/roadmap/_manifest.py
  action: Modify
  purpose: >-
    Append one Entry(name="validate_work_item_pilot", pre=True, full_segment="full_after_lint") whose pre_globs cover
    the check's whole read closure ("docs/work-item-pilot/**", "*.yaml", "*.yml", "docs/DECISIONS.md",
    "scripts/checks/roadmap/**", "scripts/checks/_common.py", "scripts/checks/registry.py"); "*.yaml" is needed because
    L3 scans every tracked YAML, and docs/work-item-pilot/** keeps the L6 freeze in the --pre affected set (Decision 135).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Add function_to_category row validate_work_item_pilot -> schema_drift, beside its roadmap-domain siblings.
- file: tests/checks/roadmap/test_validate_work_item_pilot.py
  action: Create
  purpose: >-
    Mirror test: one red-before case per leg and exit, the green empty-skeleton case, the registration case, and the
    budget-reconciliation case (a rendered worst-case fixture at ITEM_COUNT_CAP and every per-item list cap stays within
    the residual class's 500 effective lines, counting each item's own work_item_criteria and work_item_edges rows).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    Add route topic work-item-pilot, targets [docs/work-item-pilot/telemetry-feedback-loop.yaml], description naming
    CD.45, provisional_v0, not-a-roadmap and the evaluator; plus one amendment_log field_add entry.
- file: docs/CLAUDE.md
  action: Modify
  purpose: >-
    Add one Class -> home row: "Work-item pilot fixture (CD.45 one-off, provisional_v0; not a roadmap)" ->
    docs/work-item-pilot/.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
- docs/work-item-pilot/telemetry-feedback-loop.yaml exists with the execution_steps[0] body, classifies residual, and validate_work_item_pilot passes on it (VP 1, VP 4).
- 'Each leg reddens on its own broken input: unknown key, kind plan, missing failure_signal metric, prose-only evidence, verification naming an absent criterion, over-length free text, item count above 12, a second fixture, an unresolvable edge target, a rec-id edge target, an edge kind outside the closed vocabulary (including the parked informs), header cap or sunset differing from code, and a post-sunset diff touching the fixture (VP 2).'
- 'The sunset leg lets the fixture change after the trigger only through its two exits: CD.45 no longer pending in ROADMAP-PLATFORM, or a docs/DECISIONS.md Decision section naming docs/work-item-pilot/; with neither, a post-sunset diff touching it fails and a diff not touching it passes declared (VP 2).'
- A worst-case fixture rendered at ITEM_COUNT_CAP with every per-item list at its cap, including each item's MAX_CRITERIA_PER_ITEM criterion rows and MAX_EDGES_FROM_ITEM edge rows, measures at most 500 effective lines under scripts.checks.structural._classify.effective_lines, and ITEM_COUNT_CAP + 1 such items measure more than 500, so 12 is the derived maximum (VP 2).
- validate_work_item_pilot is registered in the roadmap manifest, dispatched in both tiers, mapped in config/ci_rca_taxonomy.yaml, and declares examined(1) on its pass path, so its outcome row reads enforced, never undeclared (VP 3).
- validate_placement passes with the new route, and docs/CLAUDE.md carries the class row (VP 4).
- The full presubmit tier exits 0 (VP 5).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new check against the real tree and assert the fixture path, residual class and a clean pass.
  command: bin/venv-python -c "from scripts.checks.structural._classify import classify_path;from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;f=[];v(f);assert not f,f;c=classify_path('docs/work-item-pilot/telemetry-feedback-loop.yaml');assert c=='residual',c;print('pilot fixture OK',c)"
  expected: Exit 0 printing the pass line; red before because the module and the fixture do not exist (ModuleNotFoundError).
  fix_if: A FAIL line names the leg; fix the fixture body against execution_steps[0] or the module, never the assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The registered check itself runs this exact call standing in both tiers once VP 3's registration lands; a registry row would execute the same function a second time for no added independence.
  expected_literals: [pilot fixture OK residual]
- step: 2
  phase: pre-deploy
  action: Run the mirror test (every leg red-before case, both sunset exits, the green skeleton and the budget reconciliation).
  command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_work_item_pilot.py -q -p no:randomly
  expected: Exit 0, all tests pass.
  fix_if: A failing leg case means the leg does not detect its broken input; fix the leg. A failing budget case means a cap was raised without re-deriving it (plan context); lower the cap, never raise the line budget.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file pytest re-run of a test file this plan creates (hermetic_authoring clause v); pytest already runs it standing in both tiers through the pytest phase, so a registry row adds no independence.
- step: 3
  phase: pre-deploy
  action: Confirm registration across the manifest, both tier sequences, the ci_rca taxonomy and the accounting declaration.
  command: bin/venv-python -c "import yaml;from scripts.checks import registry;from scripts.checks.roadmap import _manifest;e=[x for x in _manifest.ENTRIES if x.name=='validate_work_item_pilot'][0];assert e.pre and e.full_segment=='full_after_lint';assert '*.yaml' in e.pre_globs and 'docs/work-item-pilot/**' in e.pre_globs and 'docs/DECISIONS.md' in e.pre_globs;assert 'validate_work_item_pilot' in [s.name for s in registry.pre_sequence()] and 'validate_work_item_pilot' in [s.name for s in registry.full_sequence()];t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert t['validate_work_item_pilot']=='schema_drift';f=[];registry.resolve('validate_work_item_pilot')(f);d=registry.pop_declaration();assert d and d.kind=='examined' and d.count==1,d;print('registration OK')"
  expected: Exit 0 printing the registration line.
  fix_if: An IndexError means the Entry is missing; a KeyError means the taxonomy row is missing; a None declaration means examined() is not reached on the pass path. If Step objects expose the name under a different attribute, read scripts/checks/registry.py's Step and use that attribute; do not weaken the membership assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates standing guards - test__manifest.py resolves every Entry, validate_ci_rca_taxonomy enforces the taxonomy row and validate_check_accounting enforces the declaration in both tiers.
  expected_literals: [registration OK]
- step: 4
  phase: pre-deploy
  action: Run validate_placement and assert the route and the docs/CLAUDE.md row.
  command: bin/venv-python -c "import yaml;from scripts.checks.hygiene.validate_placement import validate_placement as v;f=[];v(f);assert not f,f;r=[x for x in yaml.safe_load(open('docs/contracts/file-router.yaml'))['routes'] if x['topic']=='work-item-pilot'][0];assert r['targets']==['docs/work-item-pilot/telemetry-feedback-loop.yaml'],r;assert 'docs/work-item-pilot/' in open('docs/CLAUDE.md').read();print('discovery OK')"
  expected: Exit 0 printing the discovery line.
  fix_if: An IndexError means the route is missing; a validate_placement FAIL means the target is untracked (git add the fixture first) or the row is malformed.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_placement already runs standing in both tiers and fails on any unresolvable route target; the route's existence and docs row are one-time registration facts, not a regression surface.
  expected_literals: [discovery OK]
- step: 5
  phase: pre-deploy
  action: Full presubmit tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: 'Diagnose the named failing check on the branch (Decision 55: no rescue loops); a failure unrelated to this scope is recorded, not patched inline (implement-scope-boundary.yaml).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff gate itself, not a regression guard.
test_obligations:
- source: scripts/checks/roadmap/validate_work_item_pilot.py
  behavior: Each of legs L1-L6 fails its own broken input, both sunset exits release the freeze, the empty skeleton passes, and examined(1) is declared on every exit path.
  verification_step: 2
  test_selector: tests/checks/roadmap/test_validate_work_item_pilot.py
  red_green_expectation: Red before (the module does not exist, so collection fails with ModuleNotFoundError); green after.
- source: scripts/checks/roadmap/_work_item_pilot_model.py
  behavior: The models reject unknown keys, kind plan, a missing failure_signal metric or source, prose-only evidence, over-length text and over-cap lists; and the frozen caps keep a worst-case fixture within 500 effective lines.
  verification_step: 2
  test_selector: tests/checks/roadmap/test_validate_work_item_pilot.py
  red_green_expectation: Red before (module absent); green after. The budget case reddens if any cap is raised without re-derivation.
- source: scripts/checks/roadmap/_manifest.py
  behavior: The validate_work_item_pilot Entry exists with pre=True, full_after_lint and a pre_globs closure covering every YAML file and docs/DECISIONS.md.
  verification_step: 2
  test_selector: tests/checks/roadmap/test_validate_work_item_pilot.py
  red_green_expectation: Red before (TestRegistration resolves the Entry by name, so an absent Entry raises StopIteration rather than silently not parametrizing); green after.
- source: config/ci_rca_taxonomy.yaml
  behavior: validate_work_item_pilot maps to schema_drift.
  verification_step: 2
  test_selector: tests/checks/roadmap/test_validate_work_item_pilot.py
  red_green_expectation: Red before (TestRegistration hits a KeyError on the missing row); green after.
- source: docs/contracts/file-router.yaml
  behavior: The work-item-pilot route resolves to the tracked fixture.
  verification_step: 4
  command: bin/venv-python -c "import yaml;from scripts.checks.hygiene.validate_placement import validate_placement as v;f=[];v(f);assert not f,f;r=[x for x in yaml.safe_load(open('docs/contracts/file-router.yaml'))['routes'] if x['topic']=='work-item-pilot'][0];assert r['targets']==['docs/work-item-pilot/telemetry-feedback-loop.yaml'],r;assert 'docs/work-item-pilot/' in open('docs/CLAUDE.md').read();print('discovery OK')"
  red_green_expectation: Red before (validate_placement passes but the route lookup raises IndexError, no work-item-pilot route); green after.
constraints:
- IMPLEMENTATION only (Decision 67 freeze); eight scope files; the >5-file heuristic is suspended under the freeze.
- 'Nothing is ratified: CD.45 stays pending; no docs/DECISIONS.md edit, no portal write, no ROADMAP-PLATFORM edit, no tier-item or criterion status flip.'
- 'The fixture ships EMPTY (zero work_items, criteria and edges). W1 adds items, each complete on the register when it lands; W1 rows use the flow-row style of the test exemplar, and W1 parks on the 500-effective-line residual limit rather than raising it (a raise needs a ratified Decision naming the path, Decisions 165/166, always-ask).'
- Caps, sunset, edge vocabulary and rungs are frozen in code; the fixture header repeats cap and sunset only so L5 can assert equality. Changing any of them is a reviewed code edit that must re-run the budget reconciliation.
- Edge targets are id-only into ROADMAP-PLATFORM (tier item, Tx:cN criterion, CD id) or pilot item ids; rec ids are excluded because CI has no rec cache (check-accounting.yaml decision_181_residuals). Edges are pilot rows, never merge-written (Decision 197 clause 5, Decision 205 clause 5) and are re-authored on lift, never lifted as-is.
- The fixture is never read by /orient, preflight or a pick surface (Decision 108); only the evaluator and its test read it.
- New modules stay under 500 SLOC unregistered (Decision 128); if the check nears it, move helpers into _work_item_pilot_model.py rather than registering a raise.
- No net-new suppressions (noqa, type ignore, pragma no cover, skip, xfail) in the diff (project Goodhart countermeasure).
- No rescue agents or workaround loops (Decision 55). No emojis; ASCII hyphens only.
