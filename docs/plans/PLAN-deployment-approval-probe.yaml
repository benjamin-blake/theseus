constraints:
  - Do not approve anything real. The only approval in this plan is the operator's own click on the positive-control run
    of the inert probe Environment. Never point the script at tf-gated-apply, tf-trusted-plan or any run of another
    workflow.
  - Session credential legs and probe dispatches run under the operator's go-ahead (message cmsg_012XgaFy8VaDQbxP5D8nC958FPB3hao7EcZcmdHLojyBFb, answering the setup posted in
    cmsg_012XgaFy8VaDQbxP5D8nC958H1VRVd9VnJnPVBS91S6K5W); relay both ids to the implementation thread.
  - Never print, log, commit or store a token value or Authorization header (Decision 101, public repo).
  - No Environment is created, edited or deleted by an agent. Environment-write capability is read from permission maps
    only; when unreadable it is reported UNKNOWN (an open residual), never tested by a mutation.
  - The gh-cli leg's `gh api` subprocess is a deliberate, leg-confined exception to the AGENTS.md mcp-over-gh rule (gh is
    a credential surface under test); no other code path uses gh.
  - terraform/github is applied by the operator only (Decision 126 admin tier; never CI, never an agent). The probe needs
    no apply; the operator's UI creation is the only setting change, and the import block adopts it later.
  - No IAM, OIDC trust, secret, Neon or Lambda change. No id-token permission in the probe workflow.
  - The probe reports; it does not remediate. If any leg approves, the remedy (a reviewer identity agents never hold) is
    brought to the operator.
  - No rescue agents or workaround loops (Decision 55).
