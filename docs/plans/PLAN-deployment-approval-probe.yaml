rollback: >-
  The operator deletes the Environment in the GitHub UI first, then the revert PR lands (a refresh drops the deleted
  object from state, so the PR-time plan shows no destroy); or the revert adds a removed block with lifecycle destroy =
  false. The Environment and workflow are inert, so
  leaving them in place has no effect on any real gate.
