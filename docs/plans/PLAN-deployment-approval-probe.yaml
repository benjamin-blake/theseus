schema_version: 5
implementation_declared: false
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "deployment-approval-probe"
intent: >-
  Prove or disprove, against GitHub's own record, that none of the GitHub credentials an agent session holds directly
  (the agent proxy's injected credential and every local path to it, plus the CI GITHUB_TOKEN) can approve a pending
  deployment that waits on the operator as the required reviewer of a GitHub Environment; credentials reachable only by
  pushing a workflow that reads a repo secret are named residuals, not legs. Reviewer-gated Environments
  are the binding control behind tf-gated-apply (Decisions 92/94) and the planned telemetry content-reader deploy lock
  (rec-4481 plan 3); both wait on this result (rec-4695). The probe uses an arbitrary inert Environment and workflow and
  never touches a real gate. It only reports: a remedy, if one is needed, is the operator's call.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-deployment-approval-probe.yaml
phase: >-
  ad_hoc_rec (rec-4695, High): premise check for T2.22's reviewer gate (Decision 94) and the rec-4481 content-reader
  deploy lock. No tier_item criterion is closed (closes_criteria empty: the premise is not a roadmap exit criterion).
scope:
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      Add resource github_repository_environment.deployment_approval_probe, environment "deployment-approval-probe",
      mirroring tf_gated_apply exactly so the result transfers to the control in use: reviewers.users =
      var.gated_apply_reviewer_user_ids (no new variable, no literal id), prevent_self_review = false (required: the
      agent dispatches as the operator's identity, and self-review blocking would make every leg a structural refusal),
      can_admins_bypass left at the provider default as on tf_gated_apply, deployment_branch_policy protected_branches =
      true / custom_branch_policies = false. No prevent_destroy (it is not a control). The operator creates the
      Environment in the GitHub UI first (infrastructure_dependencies); this resource codifies it and is adopted through
      the import block below on the next operator apply of this root, with no change. A header comment says: inert probe
      target for rec-4695, created in the UI and imported, never referenced by any OIDC trust, never by a job holding
      id-token or secrets. Also correct tf_gated_apply's stale header lines that say the apply role
      trust is "pinned to refs/heads/main" and "the sub is still refs/heads/main": Decision 94 made the trust list both
      ref:refs/heads/main and environment:tf-gated-apply; and its lines saying protected_branches = true restricts the
      job to main, which the tf_trusted_plan note in the same file contradicts under a ruleset-only main (comment-only;
      no attribute changes).
  - file: terraform/github/imports.tf
    action: Modify
    purpose: >-
      Add `import { to = github_repository_environment.deployment_approval_probe, id =
      "${var.repository_name}:deployment-approval-probe" }`, the tf_gated_apply block's shape, so the UI-created
      Environment is adopted into state and the rec-3136 re-key path stays whole
      (tests/checks/iam_tf/test_terraform_github_import_blocks.py requires one import block per managed resource and
      needs no EXEMPT entry). The Environment must exist before the PR-time plan runs, or the plan fails on a missing
      import target.
  - file: .github/workflows/deployment-approval-probe.yml
    action: Create
    purpose: >-
      Inert probe target, `name: deployment-approval-probe`. on: workflow_dispatch only, with one boolean input bot_leg
      (default false); no push, pull_request or schedule trigger. Top-level permissions {}. Job `gated`: environment
      deployment-approval-probe, permissions {}, timeout-minutes 5, no checkout, no secrets, one step echoing that the
      gate opened. Job `bot-attempt`: if inputs.bot_leg, no environment, permissions exactly {contents: read, actions:
      read, deployments: write}, timeout-minutes 10; checkout, then `python3 -m scripts.session.deployment_approval_probe
      --leg ci-bot --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --wait-pending 180` with GITHUB_TOKEN from secrets.GITHUB_TOKEN; the step
      writes the JSON line to $GITHUB_STEP_SUMMARY and the job fails on any nonzero exit (APPROVED, PROBE_INVALID or
      INCONCLUSIVE; no `|| true`, no continue-on-error). No
      id-token permission anywhere, no other secret, no setup-python install (the module is stdlib-only, so
      validate_workflow_dependency_install needs no install step). Header comment: inert, alarm-free manual probe for
      rec-4695; never a required check (Decision 83); never add id-token or secrets.
  - file: scripts/session/deployment_approval_probe.py
    action: Create
    purpose: >-
      Stdlib-only session probe (urllib, subprocess, json, argparse, os), run as
      `python -m scripts.session.deployment_approval_probe`. Three modes. Every mode takes a required --repo OWNER/NAME
      (no default: scripts.repo_identity falls back to the pre-transfer name when GITHUB_REPOSITORY is unset, and a
      redirect would make the probe vacuous); the workflow passes "$GITHUB_REPOSITORY", sessions pass otl-labs/ontheloop.
      All requests use an opener that never follows redirects. Before anything else, GET /repos/{repo} must answer 200
      with full_name equal to --repo; otherwise PROBE_INVALID.
      (1) `--leg L --run-id N [--wait-pending S]`: one approval attempt with one credential leg against one run.
      Legs (fixed list, nothing discovered): proxy (no Authorization header; the agent proxy substitutes the session
      credential), gh-cli (subprocess `gh api` with --include, using gh's own auth), env:GH_TOKEN, env:GITHUB_TOKEN,
      env:GITHUB_PERSONAL_ACCESS_TOKEN (Bearer from that variable), token-file (~/.config/gh-mcp/token unless missing or
      the literal placeholder proxy-injected), git-credential (`git credential fill` for https/github.com with
      GIT_TERMINAL_PROMPT=0, password used as Bearer), ci-bot (GITHUB_TOKEN inside Actions; classified apart from the
      session legs). A leg whose credential is absent -> UNAVAILABLE with the reason; no request is sent.
      Precheck with the leg's credential, falling back to the proxy leg for reads only: GET the run (its path must be
      .github/workflows/deployment-approval-probe.yml and its status waiting or in_progress, since in a bot_leg run the
      bot-attempt job is itself running), then poll GET pending_deployments up to --wait-pending seconds until exactly
      one pending entry exists and it is the environment named deployment-approval-probe (record its id,
      current_user_can_approve and the reviewer logins). When that read is proxy-blocked (the proxy blocks environment
      reads, github-org-transfer.yaml), the leg records pending_read PROXY_BLOCKED and uses --environment-id (the id
      the ci-bot leg read from GitHub, VP 7), with current_user_can_approve unknown; when both exist they must match.
      The run pin still holds: a probe-workflow run only ever has the probe Environment pending, so no other id can be
      approved. Any other failure -> PROBE_INVALID and no POST. The ci-bot leg always reports the environment id it
      read. The POST body is
      {environment_ids: [that id], state: approved, comment: "rec-4695 probe leg <L>"}; the environment name, the
      workflow path and the state are module constants, there is no parameter that names another environment, run
      filter or state, and no reusable approve function is exported (Decision 233 cl.4 scout note).
      Classification of the POST, in order: 2xx -> APPROVED; 3xx -> PROBE_INVALID; no X-GitHub-Request-Id header ->
      PROXY_BLOCKED; 401 -> UNAVAILABLE (credential rejected); 403 whose message is "Resource not accessible by
      integration", or any X-Accepted-GitHub-Permissions header -> TOKEN_LACKS_PERMISSION; 403 or 422 with a request id
      while the precheck recorded current_user_can_approve false -> NOT_REVIEWER; any other 4xx (a 404, or a 403/422
      while current_user_can_approve was true), or a pending entry that is gone when re-read right after the POST ->
      INCONCLUSIVE (also a 403/422 with a request id while current_user_can_approve is unknown); 5xx or transport error
      -> UNAVAILABLE. Exit 0 for NOT_REVIEWER, TOKEN_LACKS_PERMISSION,
      PROXY_BLOCKED, UNAVAILABLE; 1 for APPROVED; 2 for PROBE_INVALID and INCONCLUSIVE.
      (2) `--capability --leg L`: read-only, no run needed: GET /repos/{repo} (permissions.admin, permissions.maintain),
      GET /user/installations (each installation's app_slug and permission map, for user-to-server tokens), GET
      /repos/{repo}/environments/deployment-approval-probe (reviewers, prevent_self_review, can_admins_bypass, branch
      policy, protection rule types). Records each read's status and request-id presence (a proxy refusal is recorded as
      PROXY_BLOCKED, never as an error) and the X-OAuth-Scopes and X-Accepted-GitHub-Permissions header values, and
      reports environment-write capability as YES (an installation map with administration write), NO (a map without
      it) or UNKNOWN (no map readable).
      (3) `--observe --run-id N`: read-only: GET /actions/runs/{N}/approvals (each review's state and user login) and
      the run's jobs (gated job status and conclusion).
      Output: one JSON line per invocation with the leg, run id, HTTP statuses, request-id presence, the allowlisted
      headers above, GitHub's error message (truncated to 200 characters) and the verdict. Never a token value, an
      Authorization header or a credential-helper field other than presence; tokens are held only in local variables
      and are never in an exception message (Decision 101: public repo).
  - file: tests/test_session_deployment_approval_probe.py
    action: Create
    purpose: >-
      Fake HTTP opener and fake subprocess (no network): each POST classification (200 -> APPROVED; 301 and 307 ->
      PROBE_INVALID; 422 with request id and can_approve false -> NOT_REVIEWER; 422 with can_approve true ->
      INCONCLUSIVE; 404 -> INCONCLUSIVE; pending entry gone after the POST -> INCONCLUSIVE; 403 integration message ->
      TOKEN_LACKS_PERMISSION; X-Accepted-GitHub-Permissions -> TOKEN_LACKS_PERMISSION; response without
      X-GitHub-Request-Id -> PROXY_BLOCKED; 401 -> UNAVAILABLE; 503 -> UNAVAILABLE) with its exit code; a repo GET whose
      full_name differs from --repo, or that answers a redirect -> PROBE_INVALID; a run whose path is another workflow, a
      completed run, an in_progress run with no pending entry after the wait, a pending deployment for another environment
      (tf-gated-apply) and two pending environments each -> PROBE_INVALID with no POST sent; an in_progress run with one
      pending probe entry (the ci-bot shape) proceeds to the POST; a proxy-blocked pending read with --environment-id
      proceeds with can_approve unknown, and a 422 then -> INCONCLUSIVE; a pending read whose id differs from
      --environment-id -> PROBE_INVALID; --capability maps an installation map to YES/NO and no map to UNKNOWN; --repo is
      required; the POST body carries only the probe environment's id; an absent env variable, a placeholder token file, an
      empty `git credential fill` answer -> UNAVAILABLE with no request sent; the proxy leg sends no Authorization
      header; a sentinel token value never appears in stdout, stderr or a raised exception's text for any leg; the module
      exposes no public function that takes an environment name or state; --capability and --observe send GET only.
  - file: tests/test_deployment_approval_probe_workflow.py
    action: Create
    purpose: >-
      Parse the workflow (scripts.verify_ci_workflow._load) and environments.tf: workflow_dispatch is the only trigger
      and bot_leg is its only input; top-level permissions {}; job gated declares environment deployment-approval-probe,
      permissions {}, no uses/checkout and no `secrets.` reference; job bot-attempt has no environment, exactly the three
      permissions above, is conditioned on inputs.bot_leg, and references no secret other than GITHUB_TOKEN; no job has
      id-token; the run step invokes scripts.session.deployment_approval_probe with --leg ci-bot. The Terraform resource
      exists with environment "deployment-approval-probe", reviewers users = var.gated_apply_reviewer_user_ids,
      prevent_self_review = false, protected_branches = true, and no literal numeric id. No file under
      terraform/bootstrap or terraform/personal names deployment-approval-probe (never an OIDC subject).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Add deployment-approval-probe: tier not_a_gate, ci_rca excluded, owner platform; rationale: manual inert probe
      target for rec-4695, dispatched only by an agent running the probe with the operator's go-ahead; its waiting and
      cancelled runs are expected states, not failures.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows gains one entry per inline `run:` body of the new workflow (gated's echo step, bot-attempt's probe
      step), keyed "<workflow-rel-path>::<job-id>::<step-identity>" at its exactly measured effective line count, no
      padding and no marker (registration, not a raise; precedent PLAN-telemetry-causal-chain-probe).
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Add a short "deployment-approval-probe Environment" section: what it is (inert rec-4695 probe target mirroring
      tf-gated-apply), that it was created in the GitHub UI and is adopted by its import block on the next run of the
      existing apply runbook (same gated_apply_reviewer_user_ids var, no new variable),
      that dispatches come from main, that no OIDC trust or secret may ever reference it, and when to re-run the probe
      (any change to the Claude GitHub App's permissions, to repo ownership or admins, or to the reviewer set; command
      pointer to the plan's VP 5-9). Also correct the "State reconcile (rec-3136)" paragraph, which still says "the other
      four addresses" and "5 to import" while imports.tf holds 7 blocks (8 after this plan): name the count from
      imports.tf instead of restating addresses. Say that later terraform/github PR plans show "1 to import" for this
      resource until the operator next applies the root, and that tf-gated-apply's protected_branches = true may not
      restrict deploys to main under the ruleset-only main.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    The operator creates the Environment in the GitHub UI before the implementation PR opens (Settings, Environments, New
    environment "deployment-approval-probe"; required reviewer: the operator only; Prevent self-review off; Allow
    administrators to bypass left at its default, as tf-gated-apply; deployment branches: protected branches only; no
    wait timer, no secrets or variables). No CloudShell apply is needed for the probe: the PR codifies it with an import
    block (PR-time terraform-github-plan must show 1 to import, 0 to add, 0 to destroy, and no change beyond the known
    visibility-gated ruleset bypass_actors diff) and the next
    operator apply of terraform/github adopts it. A dispatch before the Environment exists would let GitHub auto-create a
    rule-free environment and run the gated job at once, so VP 5 verifies the protection rule before any dispatch.
  - >-
    The workflow must be on main and is dispatched with ref main (workflow_dispatch needs the file on the default
    branch). protected_branches = true may not restrict deploys to main under a ruleset-only main (environments.tf
    tf_trusted_plan note); VP 5 records the branch policy GitHub reports, and the result lists it as a known limit of
    tf-gated-apply's mirrored setting.
  - No IAM, no OIDC trust, no secret, no Lambda, no Neon resource is created or changed.
acceptance_criteria:
  - The deployment-approval-probe Environment exists with the operator as its only required reviewer and
    prevent_self_review false, shown by VP 4's PR-time App plan (no change on the imported resource) and the operator's
    Settings read, and no Terraform or OIDC trust outside terraform/github names it.
  - A positive-control run approved by the operator in the Actions UI shows an approved review by the operator and the
    gated job concluding success, so a refusal elsewhere is not vacuous; a rerun of that run waits for approval again.
  - Every session credential leg (proxy, gh-cli, the three env variables, token-file, git-credential) has a recorded
    verdict from its own freshly dispatched run, and the ci-bot leg has one from a bot_leg run.
  - For every probe run other than the positive control, GitHub's approvals record is empty and the gated job never
    started, confirmed by --observe and by the operator in the Actions UI (GitHub's server-side record is the authority;
    the script's JSON is supporting evidence, Decision 202 spirit note).
  - The result is recorded on rec-4695 and reported to the content-reader planning thread, with the GitHub-refused legs
    (NOT_REVIEWER, TOKEN_LACKS_PERMISSION) listed apart from the proxy-blocked ones, a note on whether the explicit
    credential legs collapsed onto the proxy credential (same responses as the proxy leg), environment-write capability
    (NO, YES or UNKNOWN; UNKNOWN is an open residual, never a pass) and the named residuals. Verdict -- FAILS if any leg
    is APPROVED; INCONCLUSIVE if a PROBE_INVALID or INCONCLUSIVE leg remains or the proxy leg was unavailable;
    HOLDS_BY_GITHUB if every available session leg was refused by GitHub; HOLDS_BY_PROXY_POLICY if no leg approved but
    at least one was only proxy-blocked (the control then rests on Anthropic's proxy policy, outside GitHub and this
    repo).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit tests for the probe's classification, pinning and secret hygiene.
    command: bin/venv-python -m pytest tests/test_session_deployment_approval_probe.py -q
    expected: All tests pass; they fail before the module exists.
    fix_if: Any classification, pin or sentinel-leak test fails.
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: >-
      The step is a pytest selector already run by the full test tier on every merge to main; a registry row would
      duplicate that standing guard.
  - step: 2
    phase: pre-deploy
    action: Static tests for the workflow, the Terraform resource and the import-block guard.
    command: >-
      bin/venv-python -m pytest tests/test_deployment_approval_probe_workflow.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q
    expected: All tests pass.
    fix_if: A permission, trigger, secret, environment or import-block assertion fails.
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: >-
      The step is a pytest selector already run by the full test tier on every merge to main; a registry row would
      duplicate that standing guard.
  - step: 3
    phase: pre-deploy
    action: Provider-free format check of the edited root (Decision 119; no local init or plan).
    command: terraform fmt -check -diff terraform/github
    expected: Exit 0, no diff.
    fix_if: Any formatting diff.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already enforced by the required ci.yml terraform-validate job (scripts.validate --terraform-only runs fmt -check
      across terraform/github), and green by construction before the change.
  - step: 4
    phase: pre-deploy
    action: >-
      Read the PR's terraform-github-plan result (the authoritative plan for this root): exactly one
      github_repository_environment.deployment_approval_probe to import and nothing else.
    command: >-
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<PR>)
      then mcp__github__get_job_logs for the terraform-github-plan job
    expected: >-
      1 to import, 0 to add, 0 to destroy for deployment_approval_probe; any change is only the known visibility-gated
      github_repository_ruleset.main_protection bypass_actors diff (the report's VISIBILITY line, VISIBILITY_GATED_ONLY).
    fix_if: >-
      An import error (the Environment was not created first: ask the operator), or any add, change or destroy (a UI
      setting differs from the resource: align the resource to the mirror settings, or ask the operator); stop on any
      change to an address other than the visibility-gated ruleset bypass_actors.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      Confirm the Environment before any dispatch. Gating evidence: VP 4's PR-time App plan (1 to import and no change on
      deployment_approval_probe, so its reviewers, prevent_self_review and branch policy match the resource) plus the
      operator's own read in Settings (HUMAN; the agent proxy blocks environment reads, github-org-transfer.yaml
      transfer_window_checklist step 3). Then record the non-gating capability read.
    command: >-
      bin/venv-python -m scripts.session.deployment_approval_probe --repo otl-labs/ontheloop --capability --leg proxy
    expected: >-
      One JSON line; the repository read answers 200 with full_name otl-labs/ontheloop; each other read is recorded with
      its status and request-id presence (environment and installation reads may be PROXY_BLOCKED), and environment-write
      capability is reported as NO, YES or UNKNOWN from whatever the installation permission map shows.
    fix_if: >-
      The repository read fails or redirects: stop (no dispatch) and bring the read path to the operator. A blocked
      environment or installation read is recorded, not fixed.
    hermetic: false
  - step: 6
    phase: post-deploy
    action: >-
      Positive control: dispatch one run (bot_leg false) via mcp__github__actions_run_trigger run_workflow on ref main;
      resolve its id with mcp__github__actions_list list_workflow_runs (resource_id deployment-approval-probe.yml, event
      workflow_dispatch, status waiting, the newest run created after the dispatch); the operator approves it in the
      Actions UI; observe it; then rerun it with rerun_workflow_run, confirm it waits again, and cancel it.
    command: >-
      bin/venv-python -m scripts.session.deployment_approval_probe --repo otl-labs/ontheloop --observe --run-id
      <control run id>
    expected: >-
      approvals lists one approved review by the operator; the gated job concluded success; after the rerun the gated
      job is waiting again.
    fix_if: >-
      No approval recorded or the job never ran (the probe cannot see an approval; stop). If the observe reads are
      proxy-blocked, the operator confirms the same in the Actions UI and the result says the observation was manual.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: >-
      CI-bot leg first, on its own run: dispatch with bot_leg true and resolve the run id as in VP 6. Its JSON (job log or
      step summary, read with mcp__github__get_job_logs) records the probe Environment's numeric id from GitHub's own
      pending_deployments answer; the session legs reuse that id when the proxy blocks their pending read.
    command: >-
      mcp__github__actions_run_trigger(method="run_workflow", owner="otl-labs", repo="ontheloop",
      workflow_id="deployment-approval-probe.yml", ref="main", inputs={"bot_leg": true}); then
      mcp__github__get_job_logs for the bot-attempt job; then bin/venv-python -m scripts.session.deployment_approval_probe
      --repo otl-labs/ontheloop --observe --run-id <bot run id>
    expected: >-
      bot-attempt concluded success with a NOT_REVIEWER or TOKEN_LACKS_PERMISSION verdict and an environment_id; the
      approvals record is empty; the gated job is still waiting (then cancelled).
    fix_if: >-
      bot-attempt failed: APPROVED -> stop and report; PROBE_INVALID or INCONCLUSIVE -> fix the cause and re-run on a
      fresh run.
    hermetic: false
  - step: 8
    phase: post-deploy
    action: >-
      Session legs, one fresh run each (bot_leg false), as a per-leg sequence: dispatch on main, resolve the run id as in
      VP 6 and record it for VP 9, run the leg, cancel the run with mcp__github__actions_run_trigger cancel_workflow_run.
      Legs in order: proxy, gh-cli, env:GH_TOKEN, env:GITHUB_TOKEN, env:GITHUB_PERSONAL_ACCESS_TOKEN, token-file,
      git-credential.
    command: >-
      bin/venv-python -m scripts.session.deployment_approval_probe --repo otl-labs/ontheloop --leg <leg> --run-id
      <that leg's run id> --environment-id <id from VP 7> --wait-pending 180
    expected: >-
      One JSON line per leg; no verdict is APPROVED; each available leg is NOT_REVIEWER, TOKEN_LACKS_PERMISSION or
      PROXY_BLOCKED; the proxy leg is not UNAVAILABLE.
    fix_if: >-
      APPROVED on any leg: stop dispatching, cancel, record which leg, and bring the remedy to the operator.
      PROBE_INVALID because the proxy blocks the run read itself: stop the session legs and bring the read path to the
      operator (do not retry). Any other PROBE_INVALID or INCONCLUSIVE: fix the run selection and re-run that leg on a
      fresh run once; a repeat is reported as not-HOLDS.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: >-
      Server-side record for every probe run except the control, plus the hosted GitHub MCP surface check (it exposes no
      raw-API tool, so it is a tool-surface leg, not an HTTP leg).
    command: >-
      bin/venv-python -m scripts.session.deployment_approval_probe --repo otl-labs/ontheloop --observe --run-id <each run
      id recorded in VP 7 and 8>; ToolSearch(query="+github deployment review approve pending")
    expected: >-
      Every approvals list empty and every gated job cancelled without starting; no mcp__github__ tool approves or
      reviews a deployment. The operator confirms the same in the Actions UI (the authority if observe reads are
      blocked).
    fix_if: Any approval recorded on a leg run (premise fails; report).
    hermetic: false
  - step: 10
    phase: post-deploy
    action: Record the result.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --profile agent_platform --update-rec rec-4695 --context "<existing
      context plus the per-leg verdicts and run ids>" (plus --status closed --resolution "<verdict>" when the premise
      HOLDS); result JSON written to /mnt/project-files/deployment-approval-probe/RESULT.json
    expected: >-
      rec-4695 carries the verdict. HOLDS_BY_GITHUB with environment-write NO: rec-4695 closed with the evidence
      (re-run triggers live in terraform/github/CLAUDE.md, so no follow-on rec is needed). Any other verdict: rec-4695
      stays open with the result, and the operator decides (whether proxy policy is enough, or the remedy); the report
      also points at Decision 233's reversal condition approval-authority-absent and T4.33 c3, which rest on the same
      premise.
    fix_if: Portal write fails loudly; restore connectivity and re-file (Decision 84 I-4).
    hermetic: false
  - step: 11
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: >-
      exit 0 (includes the R3-workflow shell-body baseline, the ci_rca taxonomy coverage, the workflow dependency-install
      guard and the size budgets for the new workflow and environments.tf).
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline entry to turn a
      red check green (the planned r3_workflows registration excepted). A failure outside scope becomes a rec via
      scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: Read rec-4695 back and assert its status matches the verdict.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
