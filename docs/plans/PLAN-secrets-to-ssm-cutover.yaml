  terraform-cc-web-operations ephemeral_runtime_vars.neon_api_key.source becomes "SSM SecureString
  /secret/neon-api-key, fetched at run time by scripts/ci/neon_api_key.sh run inside each trusted terraform step; never
  in the tfvars parameter".
  deploy-paths admin_out_of_band.procedure.steps, N1's entry becomes "terraform/personal also needs the ephemeral
  variable neon_api_key on every plan and every apply, including apply of a saved plan: set TF_VAR_neon_api_key from
  the /secret/neon-api-key SSM parameter (aws ssm get-parameter --with-decryption) under agent_platform_admin inside
  the same shell command that runs terraform; never write it to a file, a tfvars, chat, or a PR. The tfvars
  materialisation recovery does not supply it."
  terraform-cc-web-operations admin_tier_only, the sentence beginning "The Secrets Manager materialisation path above
  requires" becomes "The SSM materialisation path above requires `ssm:GetParameter` with decryption on the
  `/secret/agent-platform-terraform-personal-tfvars` parameter, which among container profiles only `PlatformAdmin`
