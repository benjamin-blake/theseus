schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: secrets-to-ssm-cutover
intent: >-
  Plan 3 of plan D (Secrets Manager to SSM Parameter Store). Every consumer switches to SSM in one code change, with the
  /secret/ parameter names as code defaults and no Secrets Manager fallback: the DuckLake runtime's single DSN fetch,
  the scoped-login map and its provisioning procedure, the telemetry and smoke handlers (the parameter env vars set by
  secrets-to-ssm-expand), the Neon API helper, the inference smoke script, materialise_tfvars.sh and N1's
  scripts/ci/neon_api_key.sh (the one Neon key fetch every trusted terraform step runs). Code ships through the
  governed DuckLake deploy channel, plus one dispatched prod-Lambda deploy because the data-pipeline artifact packages
  the Neon API helper; terraform/personal is not touched, so the old secrets stay intact for rollback until
  secrets-to-ssm-retire.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-cutover.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4539's SSM half. No tier_item criterion claimed. Fourth of plan D's five
  plans (retire-github-pat-secret, secrets-to-ssm-grants, secrets-to-ssm-expand, this plan, secrets-to-ssm-retire).
scope:
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: >-
    DSN_SECRET_ID becomes DSN_PARAMETER_NAME = "/secret/ducklake-neon-catalog-dsn"; fetch_dsn(parameter_name=
    DSN_PARAMETER_NAME, *, profile=None) reads ssm get_parameter(Name, WithDecryption=True) and parses the same JSON,
    and raises ValueError for a name outside /secret/ (a stale Secrets Manager id fails loudly). No secretsmanager client.
- file: src/common/ducklake_event_reads.py
  action: Modify
  purpose: The dsn_secret_id keyword becomes dsn_parameter (pass-through only).
- file: src/lambdas/ducklake_maintenance/catalog_logins.py
  action: Modify
  purpose: Login.secret_id becomes parameter_name, each value "/secret/<the current secret name>".
- file: src/lambdas/ducklake_maintenance/login_actions.py
  action: Modify
  purpose: TELEMETRY_DSN_SECRET_ID becomes TELEMETRY_DSN_PARAMETER and login reads use login.parameter_name.
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Modify
  purpose: Reads TELEMETRY_DSN_PARAMETER (set by secrets-to-ssm-expand) instead of TELEMETRY_DSN_SECRET_ID.
- file: src/lambdas/ducklake_telemetry_reader/handler.py
  action: Modify
  purpose: Reads TELEMETRY_DSN_PARAMETER; its "is not set" error names the new variable.
- file: src/lambdas/ducklake_maintenance_smoke/handler.py
  action: Modify
  purpose: Reads DUCKLAKE_DSN_PARAMETER, default rt.DSN_PARAMETER_NAME.
- file: src/lambdas/ducklake_catalog_dr/manifest.yaml
  action: Modify
  purpose: The description says the DSN is runtime-fetched from SSM Parameter Store.
- file: src/common/neon_api.py
  action: Modify
  purpose: >-
    fetch_api_key reads ssm /secret/neon-api-key with decryption; the docstring names the operator grant. No Lambda
    calls it (only scripts/ducklake_smoke/canary.py does), but the data-pipeline artifact (active) packages it, so the
    change ships through a dispatched deploy-prod-lambdas run (VP step 11), whose push path filter does not cover it.
- file: scripts/smoke_test_inference_credentials.py
  action: Modify
  purpose: >-
    Reads ssm /secret/agent-platform-<provider>-api-key with decryption; --secret-id becomes --parameter-name; the
    missing-value hint names put-parameter. Still PlatformDev (InferenceCredentialsParameterRead).
- file: scripts/ducklake_smoke/core.py
  action: Modify
  purpose: DSN_SECRET_ID becomes DSN_PARAMETER_NAME (same value as the runtime's).
- file: scripts/ducklake_neon_smoke_test.py
  action: Modify
  purpose: Imports DSN_PARAMETER_NAME.
- file: .github/actions/materialise-tfvars/materialise_tfvars.sh
  action: Modify
  purpose: >-
    The one fetch becomes aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars
    --with-decryption --query Parameter.Value --output text; the error strings and header comment name SSM; the three
    failure modes and the silent success path are unchanged.
- file: scripts/ci/neon_api_key.sh
  action: Modify
  purpose: >-
    N1's script. Both subcommands' one fetch becomes aws ssm get-parameter --name /secret/neon-api-key
    --with-decryption --query Parameter.Value --output text; the PR skip, the fail-closed empty and error paths, the
    single ::add-mask:: line, the per-process TF_VAR_neon_api_key export and the no-file rule are unchanged. No workflow
    changes: terraform-apply-sandbox.yml, terraform-drift.yml and the init-retry delegate call this script, and
    reconcile.yml calls the dispatch-ref copy, so a pre-cutover red commit still heals (the SSM value is the copied
    value, and a pre-N1 config ignores the TF_VAR). The callers' roles hold the SSM read since secrets-to-ssm-grants
    (agent-platform-github-ci-apply) and secrets-to-ssm-expand (the planner's drift session).
- file: tests/test_ci_neon_api_key.py
  action: Modify
  purpose: >-
    The stub aws answers ssm get-parameter (and fails on any secretsmanager call); every existing assertion stays,
    re-pointed at the SSM verb. New case: the stub is called with --name /secret/neon-api-key and --with-decryption.
- file: tests/test_secrets_to_ssm_cutover.py
  action: Create
  purpose: >-
    No consumer reads Secrets Manager: fetch_dsn calls only ssm get_parameter with decryption and rejects a non-/secret/
    name; every LOGINS parameter_name is under /secret/; the three handlers read the new env vars; neon_api and the
    inference smoke use ssm; materialise_tfvars.sh and neon_api_key.sh fetch with ssm get-parameter and no
    secretsmanager call, and no file under .github/workflows names any of the nine secret names after a secretsmanager
    verb (text predicates); the secret-material-handling domains lines for the Neon key and the tfvars name their
    /secret/ parameters; red cases on synthetic sources.
- file: tests/common/test_ducklake_runtime.py
  action: Modify
  purpose: Stubs move from secretsmanager to ssm (same payload assertions).
- file: tests/test_neon_api.py
  action: Modify
  purpose: Stubs move to ssm.
- file: tests/test_smoke_test_inference_credentials.py
  action: Modify
  purpose: Stubs and the flag move to ssm and --parameter-name.
- file: tests/test_ducklake_maintenance_smoke_handler.py
  action: Modify
  purpose: The env var and default move to DUCKLAKE_DSN_PARAMETER.
- file: tests/lambdas/ducklake_telemetry_writer/test_handler.py
  action: Modify
  purpose: The env var moves to TELEMETRY_DSN_PARAMETER.
- file: tests/lambdas/ducklake_telemetry_reader/test_handler.py
  action: Modify
  purpose: The env var moves to TELEMETRY_DSN_PARAMETER.
- file: tests/lambdas/ducklake_maintenance/test_login_actions.py
  action: Modify
  purpose: Follows the parameter_name rename.
- file: tests/lambdas/ducklake_maintenance/test_catalog_logins.py
  action: Modify
  purpose: Follows the parameter_name rename and asserts the /secret/ values.
- file: tests/common/ducklake_event_reads/test_telemetry_acquirer.py
  action: Modify
  purpose: Follows the dsn_parameter rename.
- file: tests/ducklake_neon_smoke_test/test_core.py
  action: Modify
  purpose: Follows the DSN_PARAMETER_NAME rename.
- file: tests/test_materialise_tfvars_delegate.py
  action: Modify
  purpose: The stubbed aws CLI answers ssm get-parameter; the three failure messages are asserted unchanged except for the store name.
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: >-
    scoped_login_provisioning.mutation_1_write_secret writes the login with ssm put_parameter(Name=
    cl.LOGINS[L].parameter_name, Type SecureString, Overwrite True) under agent_platform_admin; the description says
    "parameter" for "secret"; N1's admin_out_of_band.procedure.steps entry for TF_VAR_neon_api_key names the
    /secret/neon-api-key parameter (text pinned in execution step 4); amendment_log entry (Decision N cl.6).
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: >-
    The tfvars recovery steps name the /secret/agent-platform-terraform-personal-tfvars parameter and the ssm
    get-parameter command; N1's ephemeral_runtime_vars.neon_api_key.source names the SSM parameter (text pinned in
    execution step 4); amendment_log entry.
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    Two domains lines name where the values now live (text pinned in execution step 4): N1's Neon provider API key line
    and secrets-to-ssm-grants' terraform-personal tfvars line. amendment_log entry. No pattern or value_exceptions edit
    (secrets-to-ssm-retire rewrites those).
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    AWS-07, NEON-05, NEON-06, ANT-05 and INF-01 location becomes AWS SSM Parameter Store (kind wording to match);
    one evidence_ledger entry and one amendment_log entry (oldest-first, Class D).
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: The secrets adapter coupling row (Decision 212) names SSM Parameter Store and the /secret/ family; amendment_log entry if the file is Class D.
- file: config/agent/verification_registry/entries/secrets-to-ssm-cutover.yaml
  action: Create
  purpose: Graduation record for VP step 1 (check_spec.node_id tests/test_secrets_to_ssm_cutover.py).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  Code: the merge fires .github/workflows/deploy-ducklake-lambdas.yml (src/lambdas/ducklake_*/**, src/common/ducklake_*.py),
  the governed channel (Decision 125/126), which builds, deploys and smoke-invokes every DuckLake function. The grants
  and parameters exist since secrets-to-ssm-expand, so order is safe.
- >-
  Code: src/common/neon_api.py is packaged by the data-pipeline artifact (active, Decision 79), and
  deploy-prod-lambdas.yml's push path filter does not include it, so after merge the build thread dispatches that
  governed workflow on main (workflow_dispatch, on Benjamin's word) to ship the artifact and run its two smoke gates.
  No Lambda calls fetch_api_key, so the deploy changes no runtime read.
- >-
  Workflows: the next terraform-apply-sandbox and terraform-drift runs read tfvars (materialise_tfvars.sh) and the Neon
  key (scripts/ci/neon_api_key.sh) from SSM under the apply role (secrets-to-ssm-grants) and the planner's drift
  session (secrets-to-ssm-expand). terraform/personal is not touched by this merge, so no apply runs for it.
acceptance_criteria:
- No consumer in src/, scripts/, .github/actions or .github/workflows calls Secrets Manager for any of the nine secrets, and every default name is a /secret/ parameter (TestSecretsToSsmCutover).
- Before merge, the copy --verify run prints SECRETS_TO_SSM_COPY_OK 8/8 with eight unchanged lines and the DSN parameter still matches the secret.
- After merge, the DuckLake deploy and its smokes are green, the dispatched deploy-prod-lambdas run and its smokes are green, the next terraform-apply-sandbox and terraform-drift runs are green, and the inference smoke passes under PlatformDev.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Every consumer reads SSM and nothing reads Secrets Manager
  command: bin/venv-python -m pytest tests/test_secrets_to_ssm_cutover.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a red case passes silently, or a real-source case fails -- fix the consumer, never the predicate's intent
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-to-ssm-cutover
- step: 2
  phase: pre-deploy
  action: The updated consumer suites pass
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_runtime.py tests/test_neon_api.py
    tests/test_smoke_test_inference_credentials.py tests/test_ducklake_maintenance_smoke_handler.py
    tests/lambdas/ducklake_telemetry_writer tests/lambdas/ducklake_telemetry_reader tests/lambdas/ducklake_maintenance
    tests/common/ducklake_event_reads tests/ducklake_neon_smoke_test tests/test_materialise_tfvars_delegate.py
    tests/test_ci_neon_api_key.py tests/checks/iam_tf/test_validate_planner_secret_value_reads.py
    tests/test_setup_cloud_env.py -q
  expected: all pass
  fix_if: a failure -- fix the consumer or the stub; a removed assertion needs a weakening_dispositions entry, never a silent delete
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Stale-reference sweep for Secrets Manager reads of the nine secrets
  command: >-
    ! grep -rn --exclude-dir=__pycache__ -e 'secretsmanager' -e 'get_secret_value' -e 'DSN_SECRET_ID' -e 'TELEMETRY_DSN_SECRET_ID'
    src/common src/lambdas scripts/ducklake_smoke scripts/ducklake_neon_smoke_test.py scripts/smoke_test_inference_credentials.py
    scripts/ci/neon_api_key.sh .github/actions/materialise-tfvars .github/actions/terraform-init-retry && echo CUTOVER_SWEEP_OK
  expected: prints CUTOVER_SWEEP_OK
  fix_if: any hit -- move it to SSM; terraform/personal and contract history are outside the sweep
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Grep sweep restating step 1's graduated assertions.
- step: 4
  phase: pre-deploy
  action: ENVIRONMENT CHECK before the live reads
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- hand steps 5, 7 and 8 to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: The copy is still exact at the CI-green head (read-only), so cutover reads the same values
  command: >-
    bin/venv-python -m scripts.secrets_to_ssm_copy --profile agent_platform_admin --verify && bin/venv-python -c "import
    boto3, hmac; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2');
    a=s.client('secretsmanager').get_secret_value(SecretId='ducklake-neon-catalog-dsn')['SecretString'];
    v=s.client('ssm').get_parameter(Name='/secret/ducklake-neon-catalog-dsn', WithDecryption=True)['Parameter']['Value'];
    assert hmac.compare_digest(a, v); print('DSN_PARAMETER_MATCH_OK')"
  expected: eight unchanged lines, SECRETS_TO_SSM_COPY_OK 8/8, then DSN_PARAMETER_MATCH_OK; posted on the PR with $PR_HEAD_SHA
  fix_if: a mismatch -- a value changed during the freeze; stop and show Benjamin; --overwrite only on his word naming it
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: The governed DuckLake deploy for the merge commit is green, including every function's smoke
  command: >-
    echo 'VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
    resource_id="deploy-ducklake-lambdas.yml") -- the run for the merge sha, then actions_get for its jobs'
  expected: conclusion success; every function's smoke job green, including the telemetry writer twin, the telemetry reader and the maintenance smoke
  fix_if: red -- RCA the run; rollback is a revert PR (the old secrets still exist); never a local build_lambda --deploy
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: The pipeline reads tfvars and the Neon key from SSM -- the next apply and drift runs are green
  command: >-
    echo 'VIA MCP: actions_list for terraform-drift.yml (trigger it with mcp__github__actions_run_trigger on main if no
    scheduled run follows the merge within a day) and for the next terraform-apply-sandbox.yml run on main; read
    the "Materialise tfvars" step and the init-retry neon-api-key check step'
  expected: both runs success, with the materialise step silent on success and the neon-api-key check passing (it now reads SSM)
  fix_if: an AccessDenied on GetParameter -- compare with secrets-to-ssm-expand's VP step 7 and stop; never re-grant Secrets Manager reads by hand
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: The inference smoke reads its keys from SSM under PlatformDev
  command: bin/venv-python -m scripts.smoke_test_inference_credentials --provider deepseek
  expected: the fetch line names /secret/agent-platform-deepseek-api-key and the provider call succeeds; no key printed
  fix_if: AccessDenied -- secrets-to-ssm-grants' PlatformDev Sid is missing live; stop and RCA
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run (recursion refusal for graduation); step 1 carries the durable regression.
- step: 10
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
- step: 11
  phase: post-deploy
  action: GOVERNED DEPLOY DISPATCH -- ship the data-pipeline artifact that packages neon_api.py, on Benjamin's word
  command: >-
    echo 'VIA MCP, after Benjamin replies "deploy" naming this PR: mcp__github__actions_run_trigger(method="run_workflow",
    owner="otl-labs", repo="ontheloop", workflow_id="deploy-prod-lambdas.yml", ref="main"), then actions_list and
    actions_get for that run and its deploy and smoke jobs'
  expected: deploy and smoke jobs success, deployed=true, each deploy record's source_git_sha equals the merge commit or a later main commit
  fix_if: red -- RCA the run; never a local build_lambda --deploy; the code path it ships is not called by either function, so a red smoke is unrelated drift to RCA, not a reason to revert
  hermetic: false
  graduation: not-applicable
