  scripts and .github edits as in scope. materialise_tfvars.sh keeps its pairwise-distinct FETCH_FAILED, EMPTY_SECRET
  and WRITE_FAILED messages (the tokens stay; the text says SSM).
- >-
  Contracts: each Class D file gets its amendment_log entry (prepend or append per the file's order), change_class
  correction, summary "PLAN-secrets-to-ssm-cutover (Decision N): <what moved to SSM>"; the inventory ledger entry reads
  "PLAN-secrets-to-ssm-cutover: values copied to SSM Parameter Store and every consumer reads them there; the Secrets
  Manager copies are retired by secrets-to-ssm-retire". Pinned texts (each replaces the N1 or secrets-to-ssm-grants
  text named):
  secret-material-handling patterns.domains, N1's Neon line becomes "Neon provider API key --
  terraform/personal/neon_ducklake_catalog.tf (ephemeral input variable neon_api_key; value out of band in the
  /secret/neon-api-key SSM parameter; never in state or saved plans)", and the tfvars line becomes "terraform-personal
