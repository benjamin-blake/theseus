  `ssm:GetParameter` grant on /secret/ is scoped to the two inference-key parameters only
  (`InferenceCredentialsParameterRead`), never this one."
  terraform-cc-web-operations apply_posture, "from the `agent-platform-terraform-personal-tfvars` Secrets Manager entry
