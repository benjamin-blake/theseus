rollback: >-
  A revert PR restores the Secrets Manager reads; the old secrets, grants and env vars are untouched until
  secrets-to-ssm-retire, so the revert's governed deploy is enough. Any secret value written after cutover (a scoped-login
  rotation) exists only in SSM; before reverting, copy it back on Benjamin's word. The revert of neon_api.py ships
  only through another deploy-prod-lambdas dispatch on his word.
