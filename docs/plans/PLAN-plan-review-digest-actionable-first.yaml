  - "Approval: Benjamin 2026-10-28 11:59Z cmsg_01Cqz6E4mzSv6kkGCSCub3WMRr9jmq2g7auLeJ3yRiKfgQ: 1a (overflow -> distinct STARVED), 2a (print redacted REVISE reason), 3b (PR-time fit line now); confirmed as 'write the plan' 12:01Z cmsg_01Cqz6E4mzSv6kkGCSCub3WM9XaQu9yLFzoARp7BukVdQo."
  - "Overflow heal route (scout WARN on Decision 183, accepted under 1a): neither heal verb clears an overflow episode; recovery is a Track B forward-fix PR raising the cap or trimming the change, with Decision 154's stale_green_backlog as backstop. Routing oversized plans to tf-gated-apply was considered and not chosen (needs environment-taxonomy.yaml text, Decision 92 pt 5)."
  - "Why old reviewer passed the same truncation: pre-#1678 it had Read on plan.json (old marker said see plan.json); #1678 removed tools by design."
  - "scripts/ci/plan_digest.py is the sha256 saved-plan integrity hash (DEP-07), unrelated to terraform_plan_digest.py; do not confuse them."
  - "Reconcile shares the composite action (Decision 158); its file-reconcile-starved-rec text says max-turns for every STARVED - left as is; the step log carries the distinct overflow marker."
  - "rec-4675 (#1690) still reads open despite its Resolves trailer; not this plan's work (reported to the coordinator)."
  - "Decision-scout: FLAGS_FOUND (SPIRIT WARN 183 addressed above); Decisions triaged: 189 of 189; Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1. CITE: 55, 77, 101, 162, 183, 201, 226, 235, 128. Related: 154, 158, 92, 190, 126."
  - "Fable consult: /mnt/project-files/plan-review-revise-unblock/ADVICE.md (adopted Q1-Q5; Q6 adopted by Benjamin's 3b)."
  - "red_overlap: verdict clear (rec-4674 rule repairs_this_red, Track B, SLO 4h, age 14.1h at write)."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=PENDING"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (55, 77, 101, 162, 183, 201, 226, 235, 128)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Edit scripts/ci/terraform_plan_digest.py and tests/test_terraform_plan_digest.py as scoped; run VP 1. Post: the
    #1687-scale replay is under the cap and lists every actionable line.
  - Edit scripts/ci/review_verdict.py and tests/test_review_verdict.py; run VP 2.
  - Edit review.sh and create tests/test_subagent_review_overflow_and_reason.py; run VP 3.
  - >-
    Edit the speculative-plan job, register the digest_fit body in config/composite_action_body_baseline.yaml at its
    measured line count, and create tests/test_plan_review_digest_fit_wiring.py; run VP 4.
  - Run VP 5 (full tier) to completion.
  - >-
    Open the PR with "Resolves: rec-4674" in the body; merge on code review PROCEED and green CI only after Benjamin's word
    on the final diff (security change to the auto-apply gate). Then tell the thread so Benjamin can run
    acknowledge-and-retry (VP 7); VP 6 waits for the next terraform/personal PR.
  - "Report: what was implemented, verification results, VP 6/7 status."
rollback: >-
  Revert the PR; the digest returns to one line per entry at 8000 bytes, review.sh loses the overflow marker and reason
  line, and the PR comment loses the fit line. Nothing in AWS changes.
