    plan is the same routed set (an unrelated terraform merge refused on the red record would otherwise ride into the approved
    plan). Save the dispatch run's apply-sandbox job log (mcp__github__get_job_logs) to $DISPATCH_PLAN_LOG_FILE.
  command: >-
    test -s "$DISPATCH_PLAN_LOG_FILE" && bin/venv-python -c "import os,re;t=re.sub(r'\x1b\[[0-9;]*m','',open(os.environ['DISPATCH_PLAN_LOG_FILE'],encoding='utf-8',errors='replace').read());
