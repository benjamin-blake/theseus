schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-apply-parity
intent: >-
  Forward-fix the failed tf-gated-apply of PR #1442 (rec-4243) so the telemetry writer function lands and the companion
  deploy-wiring plan and plan 3 part 1 can proceed (T2.36). Terraform stops reading CI-built Lambda artifacts altogether:
  every source_code_hash read in terraform/personal goes, a --pre check keeps it that way, and every copy of the false
  claim that a saved-plan apply never re-reads files is corrected. Telemetry is the learning signal for recursive
  self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-writer-apply-parity.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Forward fix under PLAN-telemetry-writer-function for ci-rca rec-4243; closes no
  exit criterion.
scope:
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    Delete the source_code_hash argument of aws_lambda_function.ducklake_telemetry_writer and realign its attribute group
    to terraform fmt: `s3_bucket = aws_s3_bucket.data_lake.id` and `s3_key    = "lambda-packages/ducklake-telemetry-writer.zip"`.
    Keep lifecycle { ignore_changes = [source_code_hash] } (validate_deploy_channel_conformance reads it, and the provider
    still records the deployed hash, so a code deploy never shows as drift). In the APPLY POSTURE header, say in one
    sentence that Terraform reads no build artifact (environment-taxonomy.yaml conformance).
- file: terraform/personal/ducklake_maintenance_smoke.tf
  action: Modify
  purpose: >-
    The same deletion and realignment on aws_lambda_function.ducklake_maintenance_smoke (`s3_key    = "lambda-packages/ducklake-maintenance-smoke.zip"`),
    and the same sentence in its CODE/INFRA COUPLING header.
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: >-
    Delete source_code_hash from aws_lambda_layer_version.ducklake_deps and .ducklake_extensions (their attribute groups
    keep their alignment, since compatible_runtimes is the longest key) and from aws_lambda_function.ducklake_writer and
    .ducklake_reader (realign to `s3_bucket = ...` / `s3_key    = "lambda-packages/ducklake-<writer|reader>.zip"`). Keep
    every ignore_changes block. Reword the two comments that say "source_code_hash is try()-guarded" (layers section and
    functions section) to say no source_code_hash is set, and in each layer's SILENT-FREEZE GUARD say Terraform never
    republishes a layer on content change (it did not before either; rec-4253).
- file: terraform/personal/ducklake_catalog_dr.tf
  action: Modify
  purpose: >-
    Delete source_code_hash from aws_lambda_layer_version.ducklake_pgclient and aws_lambda_function.ducklake_catalog_dr,
    realigning each to `s3_bucket = ...` / `s3_key    = "lambda-packages/ducklake-<pgclient-layer|catalog-dr>.zip"`; keep
    both ignore_changes blocks; reword any comment that says the hash is try()-guarded.
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: >-
    Delete source_code_hash from aws_lambda_function.ducklake_maintenance and realign (`s3_key    = "lambda-packages/ducklake-maintenance.zip"`);
    keep its ignore_changes block.
- file: terraform/personal/prod_lambdas.tf
  action: Modify
  purpose: >-
    Delete local.prod_source_hash (and the blank line after it, so the locals block opens with scheduled_agent_dispatcher_function)
    and its two uses in aws_lambda_function.scheduled_agent_dispatcher and .findings_processor, realigning each to `s3_bucket = ...`
    / `s3_key    = "lambda-packages/data-pipeline.zip"`; keep both ignore_changes blocks; reword the "source_code_hash try()-guarded"
    comment above the two functions.
- file: scripts/checks/iam_tf/validate_terraform_no_build_artifact_reads.py
  action: Create
  purpose: >-
    A registered check, @registry.register("validate_terraform_no_build_artifact_reads", owner="platform"). Public helper
    find_build_artifact_reads(tf_root, is_ignored) returns sorted (relative path, line, reason) findings over every *.tf
    under tf_root, skipping .terraform/, with whole-line # and // comments blanked offset-preserving (validate_terraform_try's
    idiom). Two rules: (a) any HCL string that contains "${path.module}" and, later in the same string, "lambda-packages/"
    (this catches a direct file-function argument and an indirection through a local; an s3_key literal has no path.module
    and is legitimate); (b) any file-family call (regex \bfile\w*\s*\() whose first argument is a string literal that resolves,
    after substituting ${path.module} with the file's directory, to a path is_ignored reports as ignored (the check passes
    a `git check-ignore -q` probe from the repo root; a build output or a downloaded file is never a plan input). The
    check scans the whole terraform/ tree like validate_terraform_try, calls registry.examined(count, unit="tf_files"),
    and each finding names file:line, the rule and the fix (address code by s3_bucket/s3_key and ship it through the
    deploy channel; docs/contracts/environment-taxonomy.yaml conformance; rec-4243). No import-time work.
- file: scripts/checks/iam_tf/_manifest.py
  action: Modify
  purpose: >-
    One Entry for the check in the validate_terraform_tag_charset shape: pre=True, pre_globs ("terraform/**/*.tf",
    "scripts/checks/iam_tf/validate_terraform_no_build_artifact_reads.py", "scripts/checks/_common.py", "scripts/checks/registry.py"),
    full_segment="full_after_lint".
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    function_to_category row validate_terraform_no_build_artifact_reads: environment, beside validate_terraform_try and
    validate_terraform_tag_charset (alphabetical order).
- file: tests/checks/iam_tf/test_validate_terraform_no_build_artifact_reads.py
  action: Create
  purpose: >-
    Mirror test, 100% line coverage of the new module. test_real_tree_has_no_build_artifact_reads runs the check over
    the real tree with the real git probe and asserts no findings. Red cases on synthetic HCL in tmp_path with an injected
    is_ignored: a direct try(filemd5("${path.module}/../../lambda-packages/x.zip"), null) (flagged, rule a); a locals indirection
    p = "${path.module}/../../lambda-packages/x.zip" then filemd5(local.p) (flagged on the local's line, rule a); a file()
    of an ignored path (flagged, rule b); an s3_key = "lambda-packages/x.zip" literal, a commented-out read, and a file()
    of a tracked in-tree file (none flagged). Plus the registered check's failure path appending to failed and its pass
    path, and that it declares examined.
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: >-
    In conformance.ducklake_detail, replace the clause "and this decoupling is precisely why a verbatim saved-plan apply
    never re-evaluates filemd5() against the local tree regardless of where that fetch step's working directory lands"
    with the invariant (keep the phrase "never reads a build artifact" on one physical line): Terraform never reads a build
    artifact; function and layer code is addressed only by s3_bucket/s3_key, no resource sets source_code_hash (the lifecycle
    block stays so a code deploy never shows as drift), and code ships through the code-deploy channel. A saved plan is
    applied only where every file the configuration reads is byte-identical to the plan job's (same checkout sha, lock
    file, Terraform and provider versions); nothing a job builds or downloads is a plan input, because Terraform re-evaluates
    file functions when it applies a saved plan and nothing masks a create (rec-4243; guard validate_terraform_no_build_artifact_reads).
    Add a 2026-10-10 amendment_log entry (semantic_break false; change_class from the contract's allowed values) naming
    the correction. No apply-model, guard-classification or typed conformance field changes.
- file: terraform/CLAUDE.md
  action: Modify
  purpose: >-
    Replace the "Optional artifacts" hard-rule line (250 bytes) verbatim with this 242-byte line, in place: "- **Optional
    artifacts**: `try()`-wrap `filemd5()`/`file()` on optional in-tree files. Terraform never reads a build artifact (no
    `source_code_hash`; guard `validate_terraform_no_build_artifact_reads`; environment-taxonomy.yaml conformance)." It
    drops the md5(file("module_file.tf")) example, points at the contract instead of restating it, and names the guard.
    Zero prose headroom (Decision 43/127), so it must not grow; the terraform-cc-web-operations.yaml pointer stays.
- file: AGENTS.md
  action: Modify
  purpose: >-
    Replace the Safety bullet "- Always wrap `filemd5()` and `file()` Terraform calls on optional artifacts with `try()`."
    (91 bytes) verbatim with this 90-byte bullet: "- Wrap Terraform `filemd5()`/`file()` in `try()`; Terraform never reads a build
    artifact." No other change (public surface, Decision 101; Benjamin chose this edit on 2026-10-10).
- file: config/prose_budgets.yaml
  action: Modify
  purpose: >-
    Ratchet S1 root_ambient_load_set and S2 terraform/CLAUDE.md down to their measured sizes after the two edits (1 and
    8 bytes smaller). The prose-budgets-reseeded-to-measured registry check asserts budget equals measured, so this is
    required. A decrease needs no raise marker; never an increase.
- file: .github/workflows/reconcile.yml
  action: Modify
  purpose: >-
    Comment-only. The comments at the red-commit checkout (around :205-212) and at both fetch steps (around :318-330 and
    :728-739) justify the side-checkout download with "every DuckLake function and layer carries ignore_changes ..., so
    the verbatim saved-plan apply never re-evaluates filemd5 against the local tree". Replace that reasoning with: Terraform
    reads no build artifact (environment-taxonomy.yaml conformance; validate_terraform_no_build_artifact_reads), so nothing
    under lambda-packages/ is a plan input and the server-side copy onto the fixed key is the load-bearing output (rec-4248
    makes the fetch copy-only). Drop the stale ducklake_lambdas.tf line numbers. No non-comment line changes.
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: >-
    Comment-only. The apply-sandbox build comment (around :270-272) and the speculative-plan build comment (around :571-573)
    say the build exists so filemd5() resolves to a real hash. Reword: the build uploads the reviewed bytes to the fixed
    and per-sha S3 keys that the configuration addresses by s3_key and that gated-apply fetches; Terraform reads no local
    zip. No non-comment line changes.
- file: config/agent/verification_registry/entries/saved-plan-parity-guidance.yaml
  action: Create
  purpose: >-
    Verification-registry shard for graduated VP step 3: check_id saved-plan-parity-guidance, plan_slug telemetry-writer-apply-parity,
    primitive_slot command_exit_zero with step 3's command wrapped as ["bash", "-c", "<command>"] (it uses ! and &&; precedent
    agents-md-contradiction-resolved.yaml), guard_target docs/contracts/environment-taxonomy.yaml,terraform/CLAUDE.md,AGENTS.md,.github/workflows/reconcile.yml,
    graduated_by implement-agent.
bundled_recommendations:
- rec-4243
followon_recs: []
infrastructure_dependencies:
- >-
  Live state (run 38046095276, gated-apply job, c21ba7da): applied aws_iam_role, aws_cloudwatch_log_group and aws_iam_role_policy
  for the telemetry writer, the shared writer's policy and environment, and github_ci_planner's policy. Not applied: the
  telemetry function, its Function URL, SSM parameter and errors alarm, and github_ci_branch's policy. The convergence
  record is red on c21ba7da (rec-4243). The partial state is consistent and nothing calls the function yet.
- >-
  Zero-diff by construction: source_code_hash is Optional and Computed in hashicorp/aws 5.100.0 (the failure message
  "was known, but now unknown" proves the provider computes it), and every touched resource carries ignore_changes on
  it, which substitutes the prior state value; an omitted Optional+Computed attribute never diffs. Step 6 proves it before
  merge: the fix PR's speculative plan must name exactly the five remaining addresses and nothing else.
- >-
  Fix PR speculative plan, checked by step 6: exactly 4 to add (function, URL, SSM parameter, alarm), 1 to change (aws_iam_role_policy.github_ci_branch,
  whose document is read during apply because it references the function being created), 0 to destroy; predicted guard
  verdict BLOCKED (the new aws_lambda_function_url routes it); the new function shows source_code_hash as (known after
  apply); no other resource address. github_ci_pr's re-render in #1442's plan was a deferred read caused by the writer's
  pending environment change, which is now applied. Any other delta is a stop.
- >-
  The merge applies nothing: the push run's convergence precondition refuses on the red record (CONVERGENCE_RED), which
  is expected and dedupes to rec-4243. Recovery per docs/contracts/deploy-paths.yaml's reconcile row (the fix merged after
  the red commit): dispatch terraform-apply-sandbox.yml with acknowledge_red_commit = the red sha, not Reconcile, which
  would re-apply c21ba7da's HCL. The dispatch plans fresh at main HEAD, step 7 checks that plan before Benjamin is asked,
  the guard routes it, and gated-apply applies it via SANDBOX_FRESH_PLAN_ARTIFACT (Decision 183) after his tf-gated-apply
  approval, which is the governed-deploy authorization. The one update is github_ci_branch's policy, not a PlatformDev
  or PlatformAdmin write, so Decision 183 point 4's admin split-apply does not apply.
- >-
  Code at creation: the function is created from the fixed key lambda-packages/ducklake-telemetry-writer.zip, last written
  by an upload-only run (this fix PR's own speculative plan rebuilds it from the same source as #1442). This is PLAN-telemetry-writer-function's
  accepted Decision 154 deviation. The telemetry writer is not in the deploy map yet (build_lambda_config.py _DUCKLAKE_FUNCTION_ZIP_KEYS),
  so until PLAN-telemetry-writer-deploy-wiring lands, another PR's upload-only run can redefine its live stub; deploy-wiring
  should run right after this apply, and its DEPLOY_RECORD_OK step proves the merged-sha bytes. The immutable-reference
  fix for creates is rec-4254.
- >-
  Apply-role grants for the four creates are in terraform/bootstrap/github_ci_apply_policy.tf (CreateFunction, TagResource,
  PutFunctionConcurrency and CreateFunctionUrlConfig on function:agent-platform-*, the PassRole Sid, PutMetricAlarm, ssm:PutParameter
  and AddTagsToResource). The failed run stopped at plan expansion, so they are unexercised, and PlatformDev cannot simulate
  them; a second apply-time failure would leave the record red and heal the same way.
- >-
  Lambda deployment (Decision 79): no Lambda-packaged file changes, so no artifact build or deploy is triggered. Ordering:
  this apply precedes PLAN-telemetry-writer-deploy-wiring and plan 3 part 1.
acceptance_criteria:
- >-
  No terraform/personal resource sets source_code_hash and local.prod_source_hash is gone; every lifecycle ignore_changes
  = [source_code_hash] block remains; CI's terraform-validate (fmt -check) passes.
- >-
  validate_terraform_no_build_artifact_reads is registered in --pre with terraform/**/*.tf globs and a ci_rca taxonomy
  row; it passes on the fixed tree, its scan over origin/main's terraform/personal finds exactly the ten reads (four in
  ducklake_lambdas.tf, two in ducklake_catalog_dr.tf, one each in ducklake_maintenance.tf, ducklake_maintenance_smoke.tf,
  ducklake_telemetry_writer.tf and prod_lambdas.tf), and its mirror test covers both rules and the legitimate cases.
- >-
  The fix PR's speculative plan is exactly 4 to add, 1 to change, 0 to destroy, routed, naming only the five remaining
  addresses, with source_code_hash unknown on the new function.
- >-
  The phrase claiming a saved-plan apply never re-evaluates filemd5 appears nowhere outside docs/plans; the contract, terraform/CLAUDE.md
  and AGENTS.md state that Terraform never reads a build artifact; terraform/CLAUDE.md no longer recommends the md5(file())
  fallback; the workflow comment edits change no non-comment line. The guidance guard is graduated as saved-plan-parity-guidance.
- rec-4243's acceptance is the mirror test's real-tree node, and the rec is closed by the implementation PR's Resolves trailer.
- >-
  After Benjamin approves the acknowledge-and-retry run, the convergence record is green and PLAN-telemetry-writer-function's
  post-deploy steps 6-9 pass, with step 6 as amended alongside this plan; the dispatch's own plan was checked before he
  was asked to approve.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The new check's mirror test passes, real tree included.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_terraform_no_build_artifact_reads.py -q
  expected: Exit 0. Red before on the unfixed tree (execution step 1 records the real-tree node failing on the ten reads).
  fix_if: >-
    A real-tree finding: drop the argument (code is addressed by s3_bucket/s3_key), never loosen the rule. A red case that
    passes: the rule is too narrow.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The registered --pre check validate_terraform_no_build_artifact_reads is the standing guard on every .tf change, and
    this mirror test runs in both tiers; graduating would duplicate it. Whole-file selector of a file this plan creates.
- step: 2
  phase: pre-deploy
  action: >-
    The check would have caught rec-4243 and the Reconcile hazard: scan origin/main's terraform/personal, which still carries
    all ten reads until this PR merges.
  command: >-
    d="$(mktemp -d)" && git archive origin/main terraform/personal | tar -x -C "$d" && bin/venv-python -c "import sys,pathlib,collections;from
    scripts.checks.iam_tf.validate_terraform_no_build_artifact_reads import find_build_artifact_reads as f;r=f(pathlib.Path(sys.argv[1])/'terraform'/'personal',lambda
    p:False);c=collections.Counter(pathlib.Path(x[0]).name for x in r);assert c=={'ducklake_lambdas.tf':4,'ducklake_catalog_dr.tf':2,'ducklake_maintenance.tf':1,'ducklake_maintenance_smoke.tf':1,'ducklake_telemetry_writer.tf':1,'prod_lambdas.tf':1},
    dict(c);print('CHECK_RED_ON_MAIN', sum(c.values()))" "$d"
  expected: Exit 0 and CHECK_RED_ON_MAIN 10.
  fix_if: >-
    A different count: either the scan misses the real idiom (fix the rule) or main has another read; add it through a
    human-directed amendment rather than widening silently.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Reads origin/main by construction, so it is meaningful only before this PR merges; the registered check is the standing
    equivalent over the working tree.
- step: 3
  phase: pre-deploy
  action: >-
    The false claim is gone everywhere and the rule is stated: no file outside docs/plans says a saved-plan apply never
    re-evaluates filemd5, terraform/CLAUDE.md no longer recommends the md5(file()) fallback, and the contract, terraform/CLAUDE.md
    and AGENTS.md each say Terraform never reads a build artifact.
  command: >-
    ! git grep -qE 'never re-evaluates [f]ilemd5' -- . ':!docs/plans' && ! grep -qF 'md5(file("module_file.tf"))' terraform/CLAUDE.md
    && grep -qF 'never reads a build artifact' docs/contracts/environment-taxonomy.yaml && grep -qF 'never reads a build artifact'
    terraform/CLAUDE.md && grep -qF 'never reads a build artifact' AGENTS.md && echo GUIDANCE_OK
  expected: Exit 0 and the marker. Red before on the plan-only PR, where the false phrase and the old example are present.
  fix_if: >-
    Reword the edited sentence so the phrase sits on one physical line; never weaken the guard's negated patterns. The
    bracketed [f] keeps the pattern from matching its own registry shard.
  hermetic: true
  graduation: graduate
  graduation_check_id: saved-plan-parity-guidance
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: >-
    Shape: no source_code_hash argument or prod_source_hash local remains; every ignore_changes block survives; each edited
    function and the pgclient layer is fmt-aligned; the workflow edits are comment-only; the diff touches only scope files
    (and this plan's own bookkeeping); no 12-digit literal is added; AGENTS.md and terraform/CLAUDE.md do not grow.
  command: >-
    bin/venv-python -c "import subprocess,re,pathlib,yaml;from tests.fixtures.terraform_hcl_blocks import find_resource_block as f;
    g=lambda *a:subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout;
    mb=g('merge-base','origin/main','HEAD').strip();errs=[];tf=pathlib.Path('terraform/personal');
    errs+=[str(p)+':source_code_hash_set' for p in tf.glob('*.tf') if re.search(r'^\s*source_code_hash\s*=',p.read_text(encoding='utf-8'),re.M)];
    errs+=['prod_source_hash_left' for p in [tf/'prod_lambdas.tf'] if 'prod_source_hash' in p.read_text(encoding='utf-8')];
    ic=lambda s:len(re.findall(r'ignore_changes\s*=\s*\[source_code_hash\]',s));
    errs+=[p.name+':ignore_changes_lost' for p in tf.glob('*.tf') if ic(p.read_text(encoding='utf-8'))<ic(subprocess.run(['git','show',mb+':'+str(p)],capture_output=True,text=True).stdout)];
    al=[('ducklake_telemetry_writer.tf','aws_lambda_function','ducklake_telemetry_writer'),('ducklake_maintenance_smoke.tf','aws_lambda_function','ducklake_maintenance_smoke'),('ducklake_lambdas.tf','aws_lambda_function','ducklake_writer'),('ducklake_lambdas.tf','aws_lambda_function','ducklake_reader'),('ducklake_catalog_dr.tf','aws_lambda_function','ducklake_catalog_dr'),('ducklake_catalog_dr.tf','aws_lambda_layer_version','ducklake_pgclient'),('ducklake_maintenance.tf','aws_lambda_function','ducklake_maintenance'),('prod_lambdas.tf','aws_lambda_function','scheduled_agent_dispatcher'),('prod_lambdas.tf','aws_lambda_function','findings_processor')];
    errs+=[n+':fmt_alignment' for p,t,n in al if not re.search(r'\n  s3_bucket = aws_s3_bucket\.data_lake\.id\n  s3_key    = \x22lambda-packages/',f((tf/p).read_text(encoding='utf-8'),t,n))];
    errs+=[w+':non_comment_change' for w in ('.github/workflows/reconcile.yml','.github/workflows/terraform-apply-sandbox.yml') for l in g('diff','-U0',mb,'--',w).splitlines() if l[:1] in '+-' and not l.startswith(('+++','---')) and l[1:].strip() and not l[1:].lstrip().startswith('#')];
    nf=g('ls-files','--others','--exclude-standard').split();ch=g('diff','--name-only',mb).split()+nf;
    pf='docs/plans/PLAN-telemetry-writer-apply-parity.yaml';sc={e['file'] for e in yaml.safe_load(open(pf,encoding='utf-8'))['scope']}|{pf};
    errs+=[p+':outside_scope' for p in ch if p not in sc];
    add=[l for l in g('diff',mb).splitlines() if l.startswith('+')]+[l for q in nf for l in pathlib.Path(q).read_text(encoding='utf-8').splitlines()];
    errs+=['twelve_digit_literal_added' for l in add if re.search(r'\b\d{12}\b',l)];
    errs+=[q+':prose_grew' for q in ('AGENTS.md','terraform/CLAUDE.md') if len(pathlib.Path(q).read_bytes())>len(subprocess.run(['git','show',mb+':'+q],capture_output=True,check=True).stdout)];
    print(chr(10).join(errs) or 'SHAPE_OK');assert not errs"
  expected: Exit 0 and SHAPE_OK.
  fix_if: >-
    Revert any out-of-scope or non-comment workflow edit; realign exactly as the scope rows show (CI's fmt -check is authoritative;
    there is no local terraform binary, Decision 119).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to the merge base by construction; the registered check, validate_deploy_channel_conformance, validate_prose_limits
    and CI's terraform-validate are the standing equivalents.
- step: 5
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    Before merge, the PR's speculative plan is exactly the remaining set and proves every other edit is zero-diff. Save
    the "Terraform Speculative Plan" PR comment body for the PR's final head (mcp__github__pull_request_read get_comments;
    re-pushes leave several) to $SPEC_PLAN_FILE and export PR_HEAD_SHA.
  command: >-
    test -s "$SPEC_PLAN_FILE" && test -n "$PR_HEAD_SHA" && bin/venv-python -c "import os,re;t=open(os.environ['SPEC_PLAN_FILE'],encoding='utf-8',errors='replace').read();
    assert ('PR head SHA: '+chr(96)+os.environ['PR_HEAD_SHA']+chr(96)) in t, 'not the final head comment';
    m=re.search(r'Plan: (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('4','1','0'), m and m.group(0);
    assert 'Predicted guard verdict: BLOCKED' in t, 'not routed';
    want={'aws_lambda_function.ducklake_telemetry_writer':'created','aws_lambda_function_url.ducklake_telemetry_writer':'created','aws_ssm_parameter.ducklake_telemetry_writer_url':'created','aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors':'created','aws_iam_role_policy.github_ci_branch':'updated in-place'};
    got={a:v for a,v in re.findall(r'# (\S+) (?:will|must) be (created|updated in-place|destroyed|replaced|read during apply)',t) if not a.startswith('data.')};
    assert got==want, got;
    blk=t.split('# aws_lambda_function.ducklake_telemetry_writer will be created',1)[-1].split('\n  # ',1)[0];
    assert re.search(r'source_code_hash\s+= \(known after apply\)',blk), 'source_code_hash not unknown';print('SPEC_PLAN_OK',m.group(0))"
  expected: Exit 0 and SPEC_PLAN_OK with 4 to add, 1 to change, 0 to destroy and no other resource address.
  fix_if: >-
    Any other address or count is a stop: explain it mechanically (a deferred data-source read, an unrelated merge, a non-zero
    diff from a deletion) and report it to Benjamin before merging. Never merge on a plan you cannot account for.
