schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-apply-parity
intent: >-
  Forward-fix the failed tf-gated-apply of PR #1442 (rec-4243) so the telemetry writer function lands and the companion
  deploy-wiring plan and plan 3 part 1 can proceed (T2.36). The fix removes the plan/apply input asymmetry that broke the
  create, and adds a standing guard: a terraform/personal expression may read only a Lambda zip that every apply route
  provides exactly as the plan job had it. It also corrects the apply-model contract and the Terraform guidance that told
  the original plan a saved-plan apply never re-reads files. Telemetry is the learning signal for recursive self-improvement
  (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-writer-apply-parity.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Forward fix under PLAN-telemetry-writer-function for ci-rca rec-4243; closes no
  exit criterion.
scope:
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    Delete the source_code_hash argument of aws_lambda_function.ducklake_telemetry_writer and realign the two remaining
    lines of that attribute group to terraform fmt: `s3_bucket = aws_s3_bucket.data_lake.id` and `s3_key    = "lambda-packages/ducklake-telemetry-writer.zip"`.
    Keep lifecycle { ignore_changes = [source_code_hash] } (validate_deploy_channel_conformance reads it, and it keeps any
    later code deploy from showing as drift). In the APPLY POSTURE header, add one sentence: the function sets no source_code_hash
    because a create must not read a zip the gated-apply and Reconcile jobs do not fetch (rec-4243). No other change.
- file: terraform/personal/ducklake_maintenance_smoke.tf
  action: Modify
  purpose: >-
    The same deletion and realignment on aws_lambda_function.ducklake_maintenance_smoke (`s3_bucket = ...`, `s3_key    = "lambda-packages/ducklake-maintenance-smoke.zip"`),
    plus the same sentence in its CODE/INFRA COUPLING header. Its zip is also outside DUCKLAKE_ARTIFACT_NAMES, so any re-create
    through gated-apply or Reconcile would fail the same way; the guard below cannot pass without it. Zero-diff plan: ignore_changes
    substitutes the prior state value for an ignored attribute, so the live function shows no change.
- file: tests/fixtures/lambda_package_reads.py
  action: Create
  purpose: >-
    The parity predicate, shared by the guard tests and VP step 2 (tests/fixtures is the importable helper home; tests/CLAUDE.md).
    lambda_package_reads(tf_dir) scans every *.tf under tf_dir (skipping .terraform/), blanks whole-line # and // comments
    with offsets preserved (validate_terraform_try's idiom), and returns {zip basename: ["path:line", ...]} for every string
    argument of a Terraform file-family function (regex \bfile\w*\s*\(\s*"[^"]*lambda-packages/([^"/]+)", covering filemd5,
    file, filebase64sha256, fileexists and the rest) that names a lambda-packages zip. unfetched_lambda_package_reads(tf_dir)
    is fail-closed: it returns every read whose zip is neither in scripts/ci/ducklake_artifacts.py's DUCKLAKE_ARTIFACT_NAMES
    (what fetch mode downloads and assert mode byte-checks) nor in docs/contracts/build-lambda.yaml's pipelines.prod.artifacts
    (zips no terraform job builds, such as data-pipeline.zip in prod_lambdas.tf, absent at plan and at apply alike), so
    an unlisted zip is flagged too. The contract is resolved from the repo root (Path(__file__).resolve().parents[2]),
    never from tf_dir, because step 2 passes a temporary tree holding only terraform/personal. The module docstring
    declares the coverage (decision-scout NOTE 181): lambda-packages zips the DuckLake build produces, the only artifacts
    a terraform job builds today; any other file read that differs between jobs is the residual rec-4248 owns (plan with
    the apply jobs' artifacts). No import-time work.
- file: tests/test_ducklake_artifacts.py
  action: Modify
  purpose: >-
    Two tests. test_terraform_reads_only_fetched_lambda_packages runs the predicate over the real terraform/personal tree
    and asserts it is empty; the failure message names each zip and site and the two fixes (drop the argument on a
    decoupled function, Decision 125/126, or add the zip to DUCKLAKE_ARTIFACT_NAMES), and the docstring states the rule:
    Terraform re-evaluates file functions when it applies a saved plan, so a zip present in the plan job and absent in the
    apply job changes a planned value and the provider rejects the apply (rec-4243). A non-vacuity floor asserts the scan
    finds ducklake-writer.zip (membership, not a count; tests/CLAUDE.md count-coupling rule). test_parity_scan_flags_only_unfetched_reads
    writes synthetic HCL to tmp_path reading ducklake-telemetry-writer.zip (flagged), ducklake-writer.zip (fetched), data-pipeline.zip
    (never built by a terraform job), an unlisted zip (flagged: fail-closed) and a commented-out read of ducklake-maintenance-smoke.zip
    (flagged if the comment were not blanked), and asserts the predicate returns exactly the telemetry and unlisted zips.
    The test text names ducklake_telemetry_writer.tf, ducklake_maintenance_smoke.tf, build-lambda.yaml and ducklake_artifacts.py,
    so --pre's affected-set data edges select it when those change; its docstring declares the gap that a brand-new .tf
    file is caught by the mandatory pre-handoff full tier rather than --pre (critique F2; rec-4248 closes the class at the
    job level). The file
    stays under 500 SLOC (370 today).
- file: config/agent/verification_registry/entries/gated-apply-artifact-parity.yaml
  action: Create
  purpose: >-
    Verification-registry shard for graduated VP step 1: check_id gated-apply-artifact-parity (filename equals check_id),
    plan_slug telemetry-writer-apply-parity, primitive_slot command_exit_zero with step 1's two pytest node ids, guard_target
    scripts/ci/ducklake_artifacts.py,terraform/personal/ducklake_telemetry_writer.tf,terraform/personal/ducklake_maintenance_smoke.tf,
    graduated_by implement-agent.
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: >-
    In conformance.ducklake_detail, replace the false sentence "...this decoupling is precisely why a verbatim saved-plan
    apply never re-evaluates filemd5() against the local tree regardless of where that fetch step's working directory lands"
    with its true scope: ignore_changes keeps an existing function's or layer's prior source_code_hash, so a re-evaluated
    filemd5() cannot change it on an update; Terraform still re-evaluates file functions when it applies a saved plan and
    nothing masks a create, so a resource created on any apply route reads only an artifact every apply route provides exactly
    as the plan job had it (DUCKLAKE_ARTIFACT_NAMES on gated-apply and Reconcile; name the set, never its size), and a decoupled function whose
    zip is outside that set sets no source_code_hash (rec-4243; guarded by gated-apply-artifact-parity). Add a 2026-10-10
    amendment_log entry (semantic_break false; change_class from the contract's own allowed values, governance_note_add
    if it fits) naming the correction. No apply-model, guard-classification or typed conformance field changes.
- file: terraform/CLAUDE.md
  action: Modify
  purpose: >-
    Replace the "Optional artifacts" hard-rule line (250 bytes) verbatim with this 245-byte line, keeping its position:
    "- **Optional artifacts**: `try()`-wrap `filemd5()`/`file()`. Saved-plan applies re-read files, so read only artifacts
    every apply route has (`DUCKLAKE_ARTIFACT_NAMES`; guard `gated-apply-artifact-parity`; environment-taxonomy.yaml conformance)."
    It drops the md5(file("module_file.tf")) example, which fails the same way, and points at the contract for the
    decoupled-function rule instead of restating it (decision-scout WARN 92: one owner). The surface is at zero prose headroom
    (config/prose_budgets.yaml, Decision 43/127), so the edit must not grow it. No other edit; the terraform-cc-web-operations.yaml
    pointer stays (validate_terraform_cc_web_operations).
- file: AGENTS.md
  action: Modify
  purpose: >-
    Replace the Safety bullet "- Always wrap `filemd5()` and `file()` Terraform calls on optional artifacts with `try()`."
    (91 bytes) verbatim with this 88-byte bullet: "- Wrap Terraform `filemd5()`/`file()` in `try()`; read only what every apply
    route has." The root ambient load set is at zero prose headroom (Decision 43/127), so the edit must not grow it. No
    other AGENTS.md change (public surface, Decision 101; Benjamin chose this edit on 2026-10-10).
- file: config/prose_budgets.yaml
  action: Modify
  purpose: >-
    Ratchet S1 root_ambient_load_set and S2 terraform/CLAUDE.md down to their measured sizes after the two edits (3 and 5
    bytes smaller), clearing validate_prose_limits' below-budget advisory. A decrease needs no raise marker
    (validate_prose_budget_raises); never an increase.
- file: config/agent/verification_registry/entries/saved-plan-parity-guidance.yaml
  action: Create
  purpose: >-
    Verification-registry shard for graduated VP step 3: check_id saved-plan-parity-guidance, plan_slug telemetry-writer-apply-parity,
    primitive_slot command_exit_zero with step 3's command, guard_target docs/contracts/environment-taxonomy.yaml,terraform/CLAUDE.md,AGENTS.md,
    graduated_by implement-agent.
bundled_recommendations:
- rec-4243
followon_recs: []
infrastructure_dependencies:
- >-
  Live state (run 38046095276, gated-apply job, c21ba7da): applied aws_iam_role, aws_cloudwatch_log_group and
  aws_iam_role_policy for the telemetry writer, the shared writer's policy and environment, and github_ci_planner's policy.
  Not applied: the telemetry function, its Function URL, SSM parameter and errors alarm, and github_ci_branch's policy.
  The convergence record is red on c21ba7da (rec-4243). The partial state is consistent and nothing calls the function yet.
- >-
  Fix PR speculative plan, checked by step 5 before merge: exactly 4 to add (function, URL, SSM parameter, alarm), 1 to
  change (aws_iam_role_policy.github_ci_branch, whose document is read during apply because it references the function
  being created), 0 to destroy; predicted guard verdict BLOCKED (the new aws_lambda_function_url routes it to tf-gated-apply);
  the function block shows source_code_hash as (known after apply). No change on the smoke function and none on github_ci_pr:
  its re-render in #1442's plan was a deferred read caused by the writer's pending environment change, which is now applied.
  Any other delta is unexplained: stop and root-cause it before merging.
- >-
  The merge applies nothing: the push run's convergence precondition refuses on the red record (CONVERGENCE_RED), which is
  expected and dedupes to rec-4243. Recovery per docs/contracts/deploy-paths.yaml's reconcile row (the fix merged after the
  red commit): dispatch terraform-apply-sandbox.yml with acknowledge_red_commit = the red sha, not Reconcile, which would
  re-apply c21ba7da's HCL. The dispatch plans fresh at main HEAD, the guard routes it, and gated-apply applies that plan.bin
  via SANDBOX_FRESH_PLAN_ARTIFACT (Decision 183) after Benjamin approves the tf-gated-apply Environment. That approval is
  the governed-deploy authorization. Gated-apply still fetches only the seven artifacts, which is now enough. The one
  update is github_ci_branch's policy, not a PlatformDev or PlatformAdmin write, so Decision 183 point 4's admin split-apply
  does not apply.
- >-
  Code at creation: unchanged from PLAN-telemetry-writer-function's accepted Decision 154 deviation. The function is created
  from the fixed key lambda-packages/ducklake-telemetry-writer.zip, last written by an upload-only run (this fix PR's speculative
  plan rebuilds it from the same source as #1442); the companion deploy-wiring plan's governed deploy replaces it before plan
  3 part 1 relies on the function, and that plan's DEPLOY_RECORD_OK step proves the merged-sha bytes (Decision 154 SPIRIT
  note; the alternative that would close it is the 'fetch both zips' fork in context).
- >-
  Apply-role grants for the four creates are in terraform/bootstrap/github_ci_apply_policy.tf (CreateFunction, TagResource,
  PutFunctionConcurrency and CreateFunctionUrlConfig on function:agent-platform-*, the PassRole Sid, PutMetricAlarm,
  ssm:PutParameter and AddTagsToResource). They were never exercised by the failed run, which stopped at plan expansion,
  and PlatformDev cannot simulate them (iam:SimulatePrincipalPolicy is denied). A second apply-time failure would leave
  the record red and heal the same way.
- >-
  Lambda deployment (Decision 79): no Lambda-packaged file changes, so no artifact build or deploy is triggered; deploy-ducklake-lambdas.yml
  does not run on this merge. Ordering: this apply precedes PLAN-telemetry-writer-deploy-wiring and plan 3 part 1.
acceptance_criteria:
- >-
  Neither aws_lambda_function.ducklake_telemetry_writer nor aws_lambda_function.ducklake_maintenance_smoke sets source_code_hash;
  both keep ignore_changes = [source_code_hash]; CI's terraform-validate (fmt -check) passes.
- >-
  The parity guard passes on the fixed tree, and run against origin/main's terraform/personal it names exactly ducklake-maintenance-smoke.zip
  and ducklake-telemetry-writer.zip; its synthetic case flags an unfetched build and ignores a fetched zip, a never-built
  zip and a comment. The check is graduated as gated-apply-artifact-parity.
- >-
  The fix PR's speculative plan is exactly 4 to add, 1 to change, 0 to destroy with the named resources, routed to tf-gated-apply,
  with source_code_hash unknown on the new function and no change on the smoke function or github_ci_pr.
- >-
  The apply-model contract no longer says a saved-plan apply never re-evaluates filemd5(); it, terraform/CLAUDE.md and AGENTS.md
  state that a file read must name an artifact every apply route provides; terraform/CLAUDE.md no longer recommends the
  md5(file()) fallback. The check is graduated as saved-plan-parity-guidance.
- rec-4243's acceptance names the guard, and the rec is closed by the implementation PR's Resolves trailer.
- >-
  After Benjamin approves the acknowledge-and-retry run, the convergence record is green and PLAN-telemetry-writer-function's
  post-deploy steps 6-9 pass, with step 6 as amended alongside this plan: the two gated applies together created the planned
  seven resources and updated the planned four; the stub answers through its URL under the scoped login and refuses direct
  invoke; the writer and reader smoke gates pass; a drift run is clean.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The parity guard passes over the real Terraform tree, with its synthetic red case.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_artifacts.py::test_terraform_reads_only_fetched_lambda_packages tests/test_ducklake_artifacts.py::test_parity_scan_flags_only_unfetched_reads
    -q
  expected: >-
    Exit 0. Red before: both nodes are absent on the plan-only PR (Decision 189), and on the unfixed tree the first fails
    naming the smoke and telemetry zips (execution step 1 records that run).
  fix_if: >-
    A named zip and site: fix the Terraform (drop the argument on a decoupled function), never the predicate, unless the
    predicate flags a zip the plan job does not build.
  hermetic: true
  graduation: graduate
  graduation_check_id: gated-apply-artifact-parity
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    The guard would have caught rec-4243: run the predicate over origin/main's terraform/personal (still carrying both
    arguments until this PR merges).
  command: >-
    d="$(mktemp -d)" && git archive origin/main terraform/personal | tar -x -C "$d" && bin/venv-python -c "import sys,pathlib;from
    tests.fixtures.lambda_package_reads import unfetched_lambda_package_reads as u;r=u(pathlib.Path(sys.argv[1])/'terraform'/'personal');assert
    sorted(r)==['ducklake-maintenance-smoke.zip','ducklake-telemetry-writer.zip'], r;print('GUARD_RED_ON_MAIN', sorted(r))"
    "$d"
  expected: Exit 0 and GUARD_RED_ON_MAIN with the two zips.
  fix_if: >-
    Another zip listed: a third unfetched read exists on main; add it to this plan's scope through a human-directed amendment
    rather than widening silently. Neither listed: the scan does not match the real idiom; fix the predicate.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Reads origin/main by construction, so it is meaningful only before this PR merges; step 1's graduated guard is the standing
    equivalent over the working tree.
- step: 3
  phase: pre-deploy
  action: >-
    The instruction fixes hold: the apply-model contract no longer claims a saved-plan apply never re-evaluates filemd5(),
    terraform/CLAUDE.md no longer recommends the md5(file()) fallback, and all three files state the apply-route rule.
  command: >-
    ! grep -qF 'never re-evaluates filemd5()' docs/contracts/environment-taxonomy.yaml && ! grep -qF 'md5(file("module_file.tf"))'
    terraform/CLAUDE.md && grep -qF 'DUCKLAKE_ARTIFACT_NAMES' terraform/CLAUDE.md && grep -qF 'every apply route' terraform/CLAUDE.md
    && grep -qF 'every apply route' docs/contracts/environment-taxonomy.yaml && grep -qF 'every apply route' AGENTS.md && echo
    GUIDANCE_OK
  expected: Exit 0 and the marker. Red before on the plan-only PR, where the false sentence and the old example are still present.
  fix_if: Reword the edited sentence to carry the phrase; never delete the guard's negated phrases from the guard instead.
  hermetic: true
  graduation: graduate
  graduation_check_id: saved-plan-parity-guidance
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: >-
    Shape: each function block drops source_code_hash, keeps ignore_changes and the fmt alignment; the diff touches only
    scope files (and this plan's own bookkeeping); no 12-digit literal is added; AGENTS.md and terraform/CLAUDE.md do not
    grow (zero prose headroom; step 5's validate_prose_limits is the standing check).
  command: >-
    bin/venv-python -c "import subprocess,re,pathlib,yaml;from tests.fixtures.terraform_hcl_blocks import find_resource_block as f;
    g=lambda *a:subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout;
    errs=[];
    blocks={n:f(pathlib.Path('terraform/personal/'+p).read_text(encoding='utf-8'),'aws_lambda_function',n) for n,p in (('ducklake_telemetry_writer','ducklake_telemetry_writer.tf'),('ducklake_maintenance_smoke','ducklake_maintenance_smoke.tf'))};
    errs+=[n+':source_code_hash_set' for n,b in blocks.items() if re.search(r'^\s*source_code_hash\s*=',b,re.M)];
    errs+=[n+':ignore_changes_missing' for n,b in blocks.items() if not re.search(r'ignore_changes\s*=\s*\[source_code_hash\]',b)];
    errs+=[n+':fmt_alignment' for n,b in blocks.items() if not re.search(r'\n  s3_bucket = aws_s3_bucket\.data_lake\.id\n  s3_key    = \x22lambda-packages/',b)];
    mb=g('merge-base','origin/main','HEAD').strip();nf=g('ls-files','--others','--exclude-standard').split();ch=g('diff','--name-only',mb).split()+nf;
    pf='docs/plans/PLAN-telemetry-writer-apply-parity.yaml';sc={e['file'] for e in yaml.safe_load(open(pf,encoding='utf-8'))['scope']}|{pf};
    errs+=[p+':outside_scope' for p in ch if p not in sc];
    add=[l for l in g('diff',mb).splitlines() if l.startswith('+')]+[l for q in nf for l in pathlib.Path(q).read_text(encoding='utf-8').splitlines()];
    errs+=['twelve_digit_literal_added' for l in add if re.search(r'\b\d{12}\b',l)];
    errs+=[q+':prose_grew' for q in ('AGENTS.md','terraform/CLAUDE.md') if len(pathlib.Path(q).read_bytes())>len(subprocess.run(['git','show',mb+':'+q],capture_output=True,check=True).stdout)];
    print(chr(10).join(errs) or 'SHAPE_OK');assert not errs"
  expected: Exit 0 and SHAPE_OK.
  fix_if: >-
    Revert any out-of-scope edit; realign the attribute group exactly as the scope rows show (CI's fmt -check is authoritative;
    there is no local terraform binary, Decision 119).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to the merge base by construction; step 1's graduated guard, validate_deploy_channel_conformance and CI's
    terraform-validate are the standing equivalents.
- step: 5
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 on a completed full run. handoff_policy.timeout_disposition is blocked, so a timeout is not a pass: resume and
    rerun the full tier from the start.
  fix_if: Fix the named check; never raise a budget or skip a check.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    Before merge, the PR's speculative plan is exactly the remaining set. Save the "Terraform Speculative Plan" PR comment
    body for the PR's final head (mcp__github__pull_request_read get_comments; re-pushes leave several) to $SPEC_PLAN_FILE
    and export PR_HEAD_SHA.
  command: >-
    test -s "$SPEC_PLAN_FILE" && test -n "$PR_HEAD_SHA" && bin/venv-python -c "import os,re;t=open(os.environ['SPEC_PLAN_FILE'],encoding='utf-8',errors='replace').read();
    assert ('PR head SHA: '+chr(96)+os.environ['PR_HEAD_SHA']+chr(96)) in t, 'not the final head comment';
    m=re.search(r'Plan: (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('4','1','0'), m and m.group(0);
    assert 'Predicted guard verdict: BLOCKED' in t, 'not routed';
    new=('aws_lambda_function.ducklake_telemetry_writer','aws_lambda_function_url.ducklake_telemetry_writer','aws_ssm_parameter.ducklake_telemetry_writer_url','aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors');
    miss=[r for r in new if not re.search(r'# '+re.escape(r)+r' will be created',t)]+([] if re.search(r'# aws_iam_role_policy\.github_ci_branch will be updated in-place',t) else ['github_ci_branch']);
    bad=[r for r in ('aws_lambda_function.ducklake_maintenance_smoke','aws_iam_role_policy.github_ci_pr') if re.search(r'# '+re.escape(r)+r' (will|must) be',t)];
    blk=t.split('# aws_lambda_function.ducklake_telemetry_writer will be created',1)[-1].split('\n  # ',1)[0];
    bad+=[] if re.search(r'source_code_hash\s+= \(known after apply\)',blk) else ['source_code_hash_not_unknown'];
    assert not miss and not bad,(miss,bad);print('SPEC_PLAN_OK',m.group(0))"
  expected: Exit 0 and SPEC_PLAN_OK with 4 to add, 1 to change, 0 to destroy.
  fix_if: >-
    Any deviation is a stop: explain each extra or missing change mechanically (a deferred data-source read, an unrelated
    merge, real drift) and report it to Benjamin before merging. Never merge on a count you cannot account for.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    After the merge and the acknowledge-and-retry dispatch, and before asking Benjamin to approve, the dispatch's fresh
    plan is exactly the routed remaining set (critique F3: an unrelated terraform merge refused on the red record would
    otherwise ride into the approved plan unseen). Save the dispatch run's apply-sandbox job log (mcp__github__get_job_logs)
    to $DISPATCH_PLAN_LOG_FILE.
  command: >-
    test -s "$DISPATCH_PLAN_LOG_FILE" && bin/venv-python -c "import os,re;t=re.sub(r'\x1b\[[0-9;]*m','',open(os.environ['DISPATCH_PLAN_LOG_FILE'],encoding='utf-8',errors='replace').read());
    assert 'CONVERGENCE_ACK' in t, 'precondition did not accept the acknowledgement';assert 'Apply complete!' not in t, 'applied without the gate';
    m=re.search(r'Plan: (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('4','1','0'), m and m.group(0);
    new=('aws_lambda_function.ducklake_telemetry_writer','aws_lambda_function_url.ducklake_telemetry_writer','aws_ssm_parameter.ducklake_telemetry_writer_url','aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors');
    miss=[r for r in new if not re.search(r'# '+re.escape(r)+r' will be created',t)]+([] if re.search(r'# aws_iam_role_policy\.github_ci_branch will be updated in-place',t) else ['github_ci_branch']);
    assert not miss, miss;print('DISPATCH_PLAN_OK',m.group(0))"
  expected: Exit 0 and DISPATCH_PLAN_OK with 4 to add, 1 to change, 0 to destroy.
  fix_if: >-
    Any delta: do not ask for approval. Tell Benjamin what changed and recommend rejecting the pending deployment; the record
    stays red and the next dispatch re-plans. Never approve or apply on his behalf.
- step: 8
  phase: post-deploy
  action: >-
    After the merge (push run refused on the red record), the acknowledge-and-retry dispatch and Benjamin's tf-gated-apply
    approval: run PLAN-telemetry-writer-function's step 6 as amended (the two gated applies together match the plan; record
    green on the retry run). Set RETRY_SHA, RETRY_RUN_ID, FIRST_APPLY_LOG_FILE and RETRY_APPLY_LOG_FILE as that step's action
    says.
  command: >-
    bin/venv-python -c "import subprocess,yaml;s={x['step']:x for x in yaml.safe_load(open('docs/plans/PLAN-telemetry-writer-function.yaml',encoding='utf-8'))['verification_plan']};subprocess.run(s[6]['command'],shell=True,check=True)"
  expected: Exit 0 and APPLY_CONVERGED with 4 added, 1 changed, 0 destroyed for the retry.
  fix_if: >-
    Follow that step's fix_if. A second failed apply: stop, RCA (Decision 55) and tell Benjamin; never apply locally and
    never dispatch a third attempt without his word.
- step: 9
  phase: post-deploy
  action: The stub is live through its URL under the scoped login and refuses direct invoke (PLAN-telemetry-writer-function step 7, unchanged).
  command: >-
