execution_steps:
- >-
  Start from main after this plan's PR has merged (step 4 diffs against the merge base, so a branch without the merged
  plan amendment flags it). Write tests/fixtures/lambda_package_reads.py and the two tests first; run step 1 on the unchanged Terraform and record
  that the real-tree test fails naming exactly the smoke and telemetry zips.
- Edit the two .tf files and the three instruction files; run steps 1-4.
- >-
  Update rec-4243 through the ops portal (get_rec_write_guidance first, then update_rec): acceptance becomes step 1's
  first node selector (a ::node_id, so Decision 201's decidability check passes) and context_v2_json.closure_artifact becomes
  shard:gated-apply-artifact-parity (Decision 186: rec-4243 is escape-classified, so closure needs an artifact the fix
  commit changed, and a registry shard is the kind that goes red again if the defect returns); append to its context that the coalesce/md5(file) fallback
  fails the same check and that the heal verb is acknowledge-and-retry, not Reconcile. This lands before the merge, because
  the closure verdict is keyed to the acceptance text and the closing sha. Narrow rec-4245 the same way to what this plan
  leaves: the executor prompt string in scripts/executor/step_context.py (frozen, Decision 67), with acceptance
  ! grep -qF "md5(file('module_file.tf'))" scripts/executor/step_context.py && grep -qF 'DUCKLAKE_ARTIFACT_NAMES' scripts/executor/step_context.py.
  Write both registry shards; run step 5.
- >-
  Push, open the PR with Resolves rec-4243 in the squash body, drive CI green, run step 6 on the speculative-plan comment.
  Squash-merge, confirm the push run refused with CONVERGENCE_RED, dispatch terraform-apply-sandbox.yml (mcp__github__actions_run_trigger,
  ref main, acknowledge_red_commit c21ba7da56a5640bc7c368af6cb8b50ae92b3e78), run step 7 on its apply-sandbox log, and
  only then ask Benjamin to approve the tf-gated-apply run.
- Execute steps 8-12. Loop until they pass, never weakening an assertion. On an unrecoverable failure stop and RCA (Decision 55).
- 'Report: what landed, the verification results, and that the deploy-wiring plan and plan 3 part 1 are unblocked'
rollback: >-
  Before the retry: revert the squash commit (nothing was applied). After it: the function exists with no source_code_hash
  in state or config; reverting the HCL alone re-adds a file read on an existing resource, which ignore_changes neutralises,
  so a revert is cosmetic. Removing the function is PLAN-telemetry-writer-function's rollback.
