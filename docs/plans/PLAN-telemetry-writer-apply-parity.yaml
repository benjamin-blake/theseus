constraints:
- >-
  No local terraform init, validate, plan or apply (Decision 119). CI's terraform-validate and the speculative plan are authoritative;
  never apply locally, even on the red record.
- >-
  Change only the source_code_hash argument, its attribute group's alignment and one header sentence in each .tf file.
  Do not change DUCKLAKE_ARTIFACT_NAMES, the build-ducklake-artifacts action, terraform-apply-sandbox.yml, reconcile.yml
  or any other resource; in the three instruction files change only the named sentence or bullet (plus the contract's
  amendment_log entry), using the scope rows' verbatim lines so AGENTS.md and terraform/CLAUDE.md shrink rather than grow
  (no prose budget raise, Decision 165). The structural follow-ups are the RCA's recs.
- >-
  Dispatch the retry only after the merge and only when step 6 showed the routed 4/1/0 plan; if the dispatch's own guard
  does not route, stop and ask Benjamin. Benjamin's tf-gated-apply approval is the deploy authorization.
- 'Public repository (Decision 101): no account id, ARN or hostname literal anywhere, including PR text and pasted logs.'
- No rescue agents or workaround loops (Decision 55).
