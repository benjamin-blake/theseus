  recs rec-4245..4249 (rec-4248 re-scoped to a copy-only fetch), rec-4253 (layer publication) and rec-4254 (immutable code references). #1442's reviewed plan showed a literal source_code_hash on the
  create; filemd5 was never the provider's documented form (base64 SHA-256), so removal loses no detection.
