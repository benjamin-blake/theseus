    red_green_expectation: Red before -- the key is absent from the generated asset. Green after.
  - source: scripts/checks/contracts/validate_maintenance_policy_matrix.py
    behavior: The exhaustiveness gate discriminates and rejects a self-supplied universe.
    verification_step: 4
    test_selector: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    red_green_expectation: Red before (module absent), green after.
  - source: tests/common/test_ducklake_writes.py
    behavior: Sustained conflict at the real serialization point exhausts the budget loudly rather than mis-allocating.
