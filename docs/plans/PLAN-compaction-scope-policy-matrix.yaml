  Revert the handler, the sidecar and the contract together (validate_contract_drift and the
  generated asset couple them), then regenerate field_semantics.yaml. The matrix is additive, so
  reverting restores the predicate without data migration -- no catalog or S3 state changes in this
  plan. The Decision entry, if already merged, is superseded rather than deleted.
