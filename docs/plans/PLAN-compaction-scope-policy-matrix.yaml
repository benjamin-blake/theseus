schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: compaction-scope-policy-matrix
intent: >-
  Replace the naming-convention predicate that decides which tables the production compaction
  cadence touches with catalog enumeration crossed against a declared per-class, per-verb policy
  matrix, so a table can never be silently omitted from maintenance it requires and a new table
  class costs one policy row rather than a scheduler edit.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-compaction-scope-policy-matrix.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Home of the maintenance_policy matrix (class x verb -> {apply, reason}). The sidecar, NOT the
      Class B contract: ContractDocument and VerbSpec are both extra="forbid" and a Class B contract
      may not define fields, so the matrix has no legal placement there (reproduced against
      scripts/contracts_schema.py:106,204,229). The sidecar is the designed home for non-contract
      content, already carries the sibling operational classifications (dormant_ops_tables,
      smoke_ops_tables, contract_table_ops), and regenerates into an already-bundled Lambda asset --
      which also closes the runtime-availability gap. Collocating policy with the class declaration
      is the consulted principle applied literally.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Regenerated projection carrying the matrix to the Lambda. GENERATED -- never hand-edited;
      produced by scripts.schema_to_field_semantics after the sidecar edit. Already listed in the
      maintenance manifest assets (manifest.yaml:27), so no assets change is needed.
  - file: src/common/ducklake_maintenance_scope.py
    action: Create
    purpose: >-
      Pure, connection-free scope resolution over already-fetched catalog rows: classify_table,
      load_policy, resolve_scope and reconcile_catalog. No I/O, so every predicate is directly
      unit-testable -- the split Decision 188 used for ducklake_maintenance_ops. New module rather
      than growing handler.py (measured 417 SLOC, budget 500) -- decompose by default, Decision 128.
      It also absorbs the per-table loop body so action_merge_ops cyclomatic complexity (measured 14
      against the 20 limit in scripts/checks/sloc/_shared.py) does not cross on the rewrite.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops: replace the LIKE-predicate discovery query (lines 373-376) with an
      unfiltered information_schema enumeration, classify every row, and apply the merge_ops policy
      cell. Unclassifiable tables are COLLECTED, not raised on immediately -- every classified table
      still gets merged and the aggregate raises after the loop, matching the merge-failure shape
      below. A pre-loop raise would turn one stray table into a total cadence outage, which
      Decision 188 fail-closed precedent does not license for a NON-destructive verb. Wrap the
      per-table maint.merge_adjacent_files call (line 401) so one table failure isolates but stays
      loud (Decision 188 pt 3 as extended by this plan's Decision): per_table carries
      error/merge_unavailable, a metric is emitted, and the aggregate raises after the loop. Null
      BOTH sides of a count pair when either read fails (rec-3785). Report skipped[], unclassified[]
      and the reconciliation result.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Repoint merge_ops payload_schema_ref prose from "ALL live ops_* SCD2 table pairs ... discovered
      via information_schema" to enumeration-plus-declared-policy, naming the sidecar as the matrix
      home (the contract references the structure; it cannot hold it). Amend response_codes for
      skipped[]/unclassified[]/reconciliation and per-table error, and the 500 typed_errors for the
      post-loop aggregate raises. Add the amendment_log entry this edit owes, with an honest
      change_class/semantic_break pair -- the last entry (lines 184-192) is prose_improvement /
      semantic_break false, which cannot describe added response fields and new typed errors.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      Retire MAINTENANCE_SCOPE_NOTE prescription to introduce a catalog query "WHERE table_name LIKE
      'ops_%'" -- it prescribes the exact anti-pattern this plan removes. Correct the two unratified
      "T2.19 exit criterion" claims (line 62 HOT_TABLE_SCOPE comment and line 354 run_hot_merge
      docstring): verified false against all 15 T2.19 criteria; the claim traces only to a T2.18
      progress_note. GC_TABLE_SCOPE / HOT_TABLE_SCOPE VALUES are NOT changed -- Decision 88 cl.4 and
      Decision 143 cl.2.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle the new scope module. The matrix rides the already-listed field_semantics.yaml asset, so assets are unchanged.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: Exclude the new module, mirroring the ducklake_maintenance_ops exclusion at manifest.yaml:32.
  - file: scripts/checks/contracts/validate_maintenance_policy_matrix.py
    action: Create
    purpose: >-
      Exhaustiveness gate that scales with CLASSES, not tables. Both universes are DECLARED, never
      inferred from the matrix itself (a matrix that supplies its own key set is self-referential and
      trivially green -- the blind-oracle shape this plan exists to close): the class universe is
      derived from write_mode across the registry union, and the verb universe is an explicit list.
      Every class needs a cell for every verb; a false cell needs a reason.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Register the new check module in the contracts domain manifest.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check module, so a CI failure in it classifies.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      New Decision (body drafted in context) committing to enumerate-and-classify scope resolution
      AND extending Decision 188 pt 3 two-site carve-out to the merge_adjacent_files
      isolate-and-raise-after shape. 188 pt 3 names exactly two _count_files sites; a third isolation
      site needs an explicit clause, not a contract edit -- Decision 188 own significance
      justification sets that precedent.
  - file: tests/common/test_ducklake_maintenance_scope.py
    action: Create
    purpose: >-
      Unit coverage for classify_table / load_policy / resolve_scope / reconcile_catalog, with red
      cases: unclassifiable table, missing policy cell, self-referential universe, and
      catalog/registry divergence in BOTH directions including a dormant registered table.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Create
    purpose: >-
      rec-3762 named acceptance node test_discovery_covers_non_scd2_ops_tables, plus the
      loud-isolation contract and the post-loop aggregate raise for unclassifiable tables.
  - file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
    action: Modify
    purpose: Re-point existing merge_ops tests at the policy-driven loop; add rec-3785 named acceptance node.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Create
    purpose: Red cases for the exhaustiveness gate -- missing cell, missing reason, unknown class, and a self-referential universe that must be rejected.
  - file: tests/lambda_manifest/test_bundle_checks.py
    action: Modify
    purpose: >-
      VP7 assertion that the scope module ships in the maintenance zip and is excluded from
      data-pipeline. Scoped explicitly -- no sanction_rows entry in implement-scope-boundary.yaml
      covers it, so an unscoped edit fails validate_scope_boundary LOCATION.
bundled_recommendations:
  - rec-3762
  - rec-3785
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    action_merge_ops discovers tables by unfiltered information_schema enumeration; no
    naming-convention predicate survives anywhere in the maintenance path.
  - >-
    Every enumerated table resolves to a declared class (scd2 | append_only | control, from
    write_mode across the registry union). Unclassifiable tables are collected and named in a
    post-loop raise -- never silently skipped, and never aborting the pass before the classified
    tables are merged.
  - >-
    The class universe covers all THREE classes present today: scd2, control (ops_entity_counters)
    and append_only (ops_smoke_events). No class inherits a default.
  - >-
    ops_entity_counters is in merge_ops scope and reported in per_table, included by its declared
    policy cell rather than by a naming accident (rec-3762).
  - >-
    The OCC budget the counter compaction relies on is stated as a measured quantity, not an
    assumption: the plan records the merge window against OCC_MAX_ATTEMPTS=5 / OCC_MAX_BACKOFF_S=1.0,
    names the real conflict message is_occ_collision must match, and a post-deploy step asserts
    file_rec succeeded during a merge window (rec-3762 HAZARD).
  - >-
    One table merge_adjacent_files failure does not prevent the remaining tables merges, AND the
    invocation still fails: per_table carries the error, a metric is emitted, and the aggregate
    raises after the loop.
  - Both sides of a files_before/files_after pair are null when either count read fails (rec-3785).
  - >-
    maintenance_policy is a STRUCTURE in the sidecar, reaching the Lambda through the regenerated
    field_semantics.yaml asset; a class missing any verb cell, or a false cell missing a reason,
    fails validate.py.
  - >-
    The exhaustiveness gate class and verb universes are DECLARED independently of the matrix. A
    matrix supplying its own key set is rejected by a red-case fixture.
  - >-
    reconcile_catalog runs inside action_merge_ops, its result is carried in the response, and a VP
    step asserts it. The universe is the CATALOG; registered-but-absent tables are dispositioned by
    the registry own status field (live | dormant | smoke).
  - MAINTENANCE_SCOPE_NOTE no longer prescribes a LIKE-predicate scope expansion, and no unratified T2.19 hot_merge claim survives.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the scope module pure predicates hold, including every red case.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_scope.py -q
    expected: All pass, including unclassifiable, missing-cell, self-referential-universe, and both divergence directions.
    fix_if: >-
      Any red case passes unfixed. A reconciliation test whose universe is the registry rather than
      the catalog reproduces this workstream recorded blind-oracle failure and must be rejected.
    graduation: graduate
    graduation_check_id: maintenance-scope-predicates-discriminate
  - step: 2
    phase: pre-deploy
    action: Prove discovery covers a non-SCD2 ops table and the loud-isolation contract holds.
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_discovery_covers_non_scd2_ops_tables tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_one_table_merge_failure_isolates_but_still_raises -q
    expected: Discovery returns a control-class table; a failing table does not prevent the others; the invocation still terminates non-successfully.
    fix_if: Isolation returns ok/200 while a table merge raised -- the fail-open class Decision 188 closed.
    graduation: graduate
    graduation_check_id: merge-ops-discovery-and-loud-isolation
  - step: 3
    phase: pre-deploy
    action: Prove the naming-convention predicate and the unratified T2.19 claims are gone (X -> Y cutover sweep; the sweep is a post-condition ASSERTION, never an edit instruction).
    command: "for f in src/lambdas/ducklake_maintenance/handler.py src/common/ducklake_maintenance.py src/common/ducklake_maintenance_scope.py docs/contracts/ducklake_maintenance.yaml; do test -f \"$f\" || { echo \"MISSING SWEEP SURFACE: $f\"; exit 1; }; done; ! rg -n \"ops_%_history|ops_%_current|LIKE 'ops_%'|T2.19 exit criterion\" src/lambdas/ducklake_maintenance/handler.py src/common/ducklake_maintenance.py src/common/ducklake_maintenance_scope.py docs/contracts/ducklake_maintenance.yaml"
    expected: >-
      Zero matches across all four surfaces. The pattern matches BOTH T2.19 claim sites
      (ducklake_maintenance.py lines 62 and 354), which the scope row names.
    fix_if: >-
      A match survives, or a path is missing and the bare negated rg exits 0 (rg exits 2 on a missing
      path and the negation maps it to success) -- which is why the precondition runs first. The
      precondition currently supplies the red exit; confirm the sweep half is independently red by
      running the rg alone before implementing.
    graduation: waive
    graduation_waiver_reason: >-
      Compound command (existence precondition then negated multi-path sweep) that no CANONICAL_SLOTS
      primitive expresses; collapsing it to a grep_count slot reintroduces the rg-exit-2 false pass
      the precondition exists to prevent (vp-red-before.yaml negated_sweep_lint).
  - step: 4
    phase: pre-deploy
    action: Prove the policy matrix is exhaustive over classes x verbs and that the gate rejects a self-supplied universe.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_maintenance_policy_matrix.py -q
    expected: Missing cell, missing reason, unknown class, and self-referential universe each fail the gate.
    fix_if: A fixture whose class universe comes from the matrix own keys passes -- the gate is self-referential and trivially green.
    graduation: graduate
    graduation_check_id: maintenance-policy-matrix-exhaustive
  - step: 5
    phase: pre-deploy
    action: >-
      Prove id allocation survives compaction contention at the REAL serialization point --
      _allocate_entity_id UPDATE (ducklake_writes.py:281-284) inside file_scd2 retry loop
      (:369-426), which is what file_rec drives.
    command: bin/venv-python -m pytest tests/common/test_ducklake_writes.py::test_allocate_entity_id_exhausts_budget_under_sustained_conflict -q
    expected: >-
      A conflict sustained past OCC_MAX_ATTEMPTS raises OCCRetryExhaustedError rather than allocating
      a duplicate or silently succeeding -- the failure mode a long merge window would produce.
    fix_if: >-
      The test asserts only the single-collision retry path. That is ALREADY covered by
      test_file_scd2_occ_retry_reallocates (tests/common/test_ducklake_writes.py:468), so a test of
      that shape is a rename of existing coverage, not new evidence. The uncovered case is budget
      EXHAUSTION under sustained conflict, which is what a 3,418-file merge window risks.
    graduation: graduate
    graduation_check_id: entity-allocation-exhaustion-under-sustained-conflict
  - step: 6
    phase: pre-deploy
    action: Prove the whole count pair is nulled when either side fails (rec-3785 own acceptance node).
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py::test_merge_ops_nulls_only_the_failed_side_of_a_table -q
    expected: A single-sided count failure nulls both sides and sets count_unavailable.
    fix_if: >-
      A half-populated pair is still reported. The node id matches rec-3785 stored acceptance
      selector verbatim so the rec own probe resolves at closure -- do not rename it.
    graduation: graduate
    graduation_check_id: merge-ops-count-pair-nulled-together
  - step: 7
    phase: pre-deploy
    action: Prove the new module is bundled into the maintenance zip and excluded from data-pipeline.
    command: bin/venv-python -m pytest tests/lambda_manifest/test_bundle_checks.py::test_maintenance_scope_module_bundled_and_excluded -q
    expected: The scope module is in the maintenance manifest includes and the data-pipeline excludes.
    fix_if: The module is absent from either list -- the Lambda ImportErrors at runtime.
    graduation: graduate
    graduation_check_id: maintenance-scope-module-manifest-wiring
  - step: 8
    phase: pre-deploy
    action: Prove the matrix reaches the deployed Lambda -- present in the regenerated asset, and the regeneration is reproducible.
    command: "bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c \"import yaml,io; d=yaml.safe_load(io.open('config/lambda/ducklake/field_semantics.yaml',encoding='utf-8')); assert 'maintenance_policy' in d, 'matrix absent from the bundled asset'; print('matrix present')\""
    expected: Regeneration is clean (no drift) and the matrix is present in the asset the manifest ships.
    fix_if: >-
      The matrix is in the sidecar but not the generated file -- the generator does not splice that
      key and needs a passthrough, or the file was hand-edited (it is GENERATED -- DO NOT EDIT).
    graduation: graduate
    graduation_check_id: maintenance-policy-matrix-reaches-lambda-asset
  - step: 9
    phase: pre-deploy
    action: Prove the registration companions landed -- the numbered Decision and the ci_rca taxonomy row.
    command: "rg -q '^## Decision [0-9]+: .*(enumerat|scope resolution)' docs/DECISIONS.md && rg -q 'validate_maintenance_policy_matrix' config/ci_rca_taxonomy.yaml"
    expected: Both present; the Decision body carries the Decision 188 pt 3 carve-out extension clause.
    fix_if: Either is absent. A Decision without the carve-out clause leaves the third isolation site unauthorized.
    graduation: graduate
    graduation_check_id: maintenance-scope-registration-companions
  - step: 10
    phase: pre-deploy
    action: Full-tier validation before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Any check fails -- resolve before commit per handoff_policy.
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Confirm the governed CD channel deployed the affected active artifacts and that a scheduled
      merge_ops run reports the control table.
    command: "echo 'DISPATCH VIA MCP: mcp__github__actions_get(owner=benjamin-blake, repo=theseus, workflow_id=deploy-ducklake-lambdas.yml) for the merge commit, then mcp__github__get_job_logs for the maintenance deploy job'"
    expected: >-
      Deploy succeeded for ducklake_maintenance; a subsequent merge_ops run lists ops_entity_counters
      in per_table with files_after <= files_before, and carries a reconciliation result.
    fix_if: The table is absent from per_table -- the policy cell or classification did not take effect in the deployed build.
  - step: 12
    phase: post-deploy
    action: >-
      Discharge the rec-3762 HAZARD against production: assert a portal write succeeded inside a
      merge window, rather than assuming the OCC budget absorbed the contention.
    command: "echo 'DISPATCH VIA MCP: mcp__github__get_job_logs for the merge_ops invocation window, then run scripts.ops_data_portal --file-rec for a disposable probe rec timed inside that window; assert it returns an id rather than OCCRetryExhaustedError'"
    expected: file_rec allocates normally during a merge pass; no OCCRetryExhaustedError in the writer logs for that window.
    fix_if: >-
      Allocation exhausts the budget. That is the rec-3762 hazard realised -- separate the control
      table onto a quiet cadence (the rec stated alternative) rather than raising OCC_MAX_ATTEMPTS,
      which would be a Decision 55 violation.
  - step: 13
    phase: post-deploy
    action: Verify the bundled recommendations closed. Sync the read cache, then assert terminal status.
    command: "bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c \"import json,pathlib,sys; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; want={'rec-3762','rec-3785'}; seen={r['id'] for r in rows if r['id'] in want}; missing=want-seen; still={r['id'] for r in rows if r['id'] in want and r.get('status')=='open'}; print('missing from cache:', sorted(missing), '| still open:', sorted(still)); sys.exit(1 if (missing or still) else 0)\""
    expected: Both recs present in the cache and terminal.
    fix_if: Either is still open -- the Resolves trailer did not reach the squash-merge commit body of the IMPLEMENT leg.
test_obligations:
  - source: src/common/ducklake_maintenance_scope.py
    behavior: Classification, policy lookup and catalog reconciliation are correct and discriminating.
    verification_step: 1
    test_selector: tests/common/test_ducklake_maintenance_scope.py
    red_green_expectation: Red before (module absent), green after.
  - source: src/lambdas/ducklake_maintenance/handler.py
    behavior: Discovery covers non-SCD2 tables; a per-table merge failure isolates but still raises.
    verification_step: 2
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_discovery_covers_non_scd2_ops_tables
    red_green_expectation: Red before -- the LIKE predicate cannot return a control-class table. Green after.
  - source: config/lambda/ducklake/field_semantics.static.yaml
    behavior: The matrix is declared in the sidecar and is exhaustive over classes x verbs.
    verification_step: 4
