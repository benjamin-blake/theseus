acceptance_criteria:
- Each of the twelve Task 3 survivors in domains roadmap/sloc/prose -- validate_platform_roadmap neuter-append 0/2/3/4/5, validate_candidate_decision_supersession neuter-append 0/1, validate_sloc_limits flip-compare:2, validate_complexity flip-compare 3/4/5, and prose_limits _check_entry flip-compare:1 -- makes its own mirror FAIL when re-applied in a scratch clone carrying the new tests, and every one of the five mirrors passes on the unmutated branch.
- Each of the five validate_platform_roadmap mutants reddens exactly ONE new test, so every emission site has its own named guard rather than a shared one (the five sites append an identical string, so stdout markers carry the attribution).
- The SLOC and prose ratchet-down advisories and the validate_complexity prompt-density arm are asserted on the channel they actually write to (capsys stdout, and the list validate_complexity returns), with a fixture on each side of every flipped comparison.
- Measured per-file coverage for all five check modules is at or above its recorded pre-change value (76.8 / 84.4 / 100.0 / 78.1 / 100.0) and no config/coverage_baseline.yaml entry is added.
- '`git diff --stat origin/main...HEAD -- scripts/checks/` is empty (no check module or manifest Entry is touched), and the SLOC step shows config/sloc_budgets.yaml, config/coverage_baseline.yaml, config/check_accounting_baseline.yaml and config/prose_budgets.yaml unchanged; the landed diff is the five test files, the plan file''s own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards (implement-scope-boundary.yaml graduated_registry_shard).'
- All five test files stay <= 500 SLOC (none was over 400 before the change), ruff-clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.
