slug: check-mirror-2b-roadmap-sloc-prose
intent: 'Kill the twelve verified mutation survivors in the roadmap, sloc and prose check domains by strengthening the five existing mirrors that already own those modules: seven unreached failed.append sites (five in validate_platform_roadmap, two in validate_candidate_decision_supersession) get a fixture that drives the registered wrapper down exactly one failure path, and five unobserved comparisons (the SLOC and prose ratchet-down advisories, and the whole prompt-density arm of validate_complexity) get assertions on the stdout / returned-warnings channel they actually write to, so a neutered append or a flipped comparison in any of the five can no longer pass CI as a silent green.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-mirror-2b-roadmap-sloc-prose.yaml
phase: Check-mirror behavioural coverage (defect surface of the Decision 169 mirror roster; measured by the Task 3 mutation sweep). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 3 slice 2, group check-mirror-2b-roadmap-sloc-prose; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: tests/checks/roadmap/test_validate_platform_roadmap.py
  action: Modify
  purpose: '236 SLOC today. Five of the wrapper''s six failed.append sites are reached by NO test: the mirror''s eight wrapper tests all write a well-formed roadmap and therefore only ever reach the line-136 ''Platform roadmap criteria integrity'' append, while lines 46 (roadmap file absent), 141 (except ImportError), 144 (except ValidationError), 147 (except yaml.YAMLError) and 150 (except Exception) are dead to the suite -- neutering each to `pass` SURVIVES all 15 tests (re-verified in a scratch clone 2026-09-02). Add class TestPlatformRoadmapWrapperFailureEmission with a static _write_roadmap(tmp_path, body) / _run(tmp_path) pair patching ''scripts.checks._common.ROOT'' (the knob the existing tests already use) and five methods, one per site, each asserting EXACT list equality failed == [''Platform roadmap schema validation''] plus that site''s own stdout marker (all five append the identical string, so the marker is what attributes the failure to a site). The ImportError arm is driven by patch.dict(sys.modules, {''scripts.roadmap.platform_roadmap'': None}) and the catch-all arm by patching that module''s load to raise RuntimeError. Existing 15 tests are kept unchanged.'
- file: tests/checks/roadmap/test_validate_candidate_decision_supersession.py
  action: Modify
  purpose: '82 SLOC today. Both early-return failed.append sites -- line 39 (roadmap file absent) and line 52 (load() raised) -- are unreached: every existing fixture writes a well-formed roadmap, so neutering either SURVIVES all 6 tests (re-verified 2026-09-02). Add class TestCandidateDecisionSupersessionWrapperEmission with a static _run(tmp_path) patching ''scripts.checks._common.ROOT'' and two methods asserting failed == [''Candidate decision supersession guard''] exactly plus the distinguishing stdout marker (''not found'' vs ''could not load roadmap:''). Existing 6 tests kept unchanged.'
- file: tests/checks/sloc/test_sloc_limits.py
  action: Modify
  purpose: 189 SLOC today. The ratchet-down ADVISORY branch at sloc_limits.py:111 writes ONLY to stdout, and the existing test_registered_file_below_budget_passes_advisory asserts only `failed == []` -- which holds on both sides of the comparison, so flipping `sloc < budget` to `sloc >= budget` SURVIVES all 14 tests (re-verified 2026-09-02). Add class TestSlocRatchetAdvisoryEmission with its own _write_budget / _run helpers (no cross-class reuse) and two capsys tests -- below budget must PRINT the advisory, exactly at budget must print none. Existing 14 tests kept unchanged.
- file: tests/checks/sloc/test_complexity.py
  action: Modify
  purpose: '119 SLOC today. The entire prompt-density arm (complexity.py:154 len(prompt_entries) >= 3, :158 stdev > 0, :161 density > threshold) is entered by the existing fixtures but never produces an observable warning, because every existing prompt fixture has a UNIFORM density -- all three flips SURVIVE the 5-test mirror (re-verified 2026-09-02). Add class TestPromptDensityOutliers with a _write_prompts(tmp_path, plain_count, with_outlier) fixture builder (nine zero-density files plus one density-1.0 outlier: mean 0.1, stdev 0.3162, threshold 0.7325) and a _prompt_warning_files() helper that returns the type==''prompt'' warning paths from the value validate_complexity RETURNS, then asserts membership (kills :154 and :158) and exact list equality (kills :161) plus a uniform-density green. Existing 5 tests kept unchanged.'
- file: tests/checks/prose/test_prose_limits.py
  action: Modify
  purpose: '193 SLOC today. Twin of the SLOC survivor: the ratchet-down advisory at prose_limits.py:79 (_check_entry) writes only to stdout, and both existing under-budget and at-budget tests assert only `failed == []`, so flipping `current_bytes < budget` to `current_bytes >= budget` SURVIVES all 20 tests (re-verified 2026-09-02). Add class TestProseRatchetAdvisoryEmission with its own _run helper reusing the module-level _write / _write_budgets functions and the mirror''s established three-patch context (scripts.checks._common.ROOT, scripts.preflight.prose_context._common.ROOT, and _resolve_s2_directory_claude_files), and two capsys tests on either side of the comparison. Existing 20 tests kept unchanged.'
