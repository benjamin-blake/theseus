acceptance_criteria:
  - >-
    Default mode: on success the mirror holds the stub's files, the resolved tfrc names the mirror dir, the output and
    log read `mirror-sync: OK`, exit 0; the aws call carries `--profile agent_platform` whatever AWS_PROFILE says; a
    first failure is retried once after the backoff; NO_CREDENTIALS and NO_REGION are not retried; a hung attempt
    reports TIMEOUT; all attempts failing removes a pre-existing resolved tfrc, prints a WARNING with the class, exits
    1; an empty sync writes no tfrc and reports EMPTY_MIRROR; default mode never runs the delegate.
  - >-
    --tfvars mode runs the delegate with AWS_PROFILE=agent_platform_admin even when the ambient profile is
    agent_platform, prints `tfvars-fetch: OK` on success, and on a delegate failure whose stderr carries an ARN, a
    12-digit run and an AROA id prints the class and a scrubbed line with none of them; same for default mode output
    and log.
  - >-
    The hook prints one skip line and calls no aws when ~/.aws/config lacks the agent_platform_admin profile; in an
    ADMIN config it runs default mode only; it exits 0 when the script fails or terraform is absent (with a WARNING);
    it is registered in .claude/settings.json SessionStart with timeout 60 and hooks.json is the render.
  - >-
    bin/setup-cloud-env.sh, outside comments, runs no `aws s3`, `aws secretsmanager`, `aws ssm` or `aws sts` command,
    no materialise_tfvars call and names no tf-provider-mirror, and still runs bin/sync-deps.sh (which installs
    terraform when INSTALL_TERRAFORM=1).
  - >-
    The repointed registry entry passes on HEAD and fails on origin/main; validate_terraform_cc_web_operations and the
    deploy-paths evaluator pass; texts T1-T8 are present verbatim (allowed variance: T5/T8 dates are the build's
    commit date; line wrapping).
  - >-
    Post-deploy, in a NEW ADMIN session: the start-up output shows `[session_start_terraform_assets] mirror-sync: OK`;
    a scratch-copy terraform init through the mirror installs kislerdm/neon from it; PlatformDev can read the prefix;
    one on-demand --tfvars run writes a non-empty mode-600 tfvars with clean output, then the file is removed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Script behaviour, by node.
    command: >-
      bin/venv-python -m pytest -q
      "tests/test_sync_terraform_assets.py::test_mirror_sync_success_writes_resolved_tfrc_and_log"
      "tests/test_sync_terraform_assets.py::test_mirror_sync_runs_as_platform_dev_whatever_the_ambient_profile"
      "tests/test_sync_terraform_assets.py::test_failed_attempt_is_retried_once"
      "tests/test_sync_terraform_assets.py::test_credential_and_region_errors_are_not_retried"
      "tests/test_sync_terraform_assets.py::test_hung_attempt_reports_timeout"
      "tests/test_sync_terraform_assets.py::test_failed_sync_removes_resolved_tfrc_and_exits_one"
      "tests/test_sync_terraform_assets.py::test_empty_sync_writes_no_resolved_tfrc"
      "tests/test_sync_terraform_assets.py::test_default_mode_never_runs_the_delegate"
      "tests/test_sync_terraform_assets.py::test_tfvars_mode_pins_the_admin_profile"
      "tests/test_sync_terraform_assets.py::test_output_and_log_never_carry_account_id_arn_or_unique_id"
    expected: >-
      exit 0; every node passes (the masking node is parametrized over default and --tfvars modes). Each fails before
      the change (the script does not exist).
    fix_if: >-
      Fix the script, never the assertion. A masking failure means raw stderr reached stdout or the log.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: sync-terraform-assets-behaviour
  - step: 2
    phase: pre-deploy
    action: Hook gating, exit 0 and registration, by node.
    command: >-
      bin/venv-python -m pytest -q
      "tests/hooks/test_session_start_terraform_assets.py::test_dev_session_skips_without_an_aws_call"
      "tests/hooks/test_session_start_terraform_assets.py::test_admin_session_runs_the_mirror_sync_only"
      "tests/hooks/test_session_start_terraform_assets.py::test_failed_sync_still_exits_zero_with_a_warning"
      "tests/hooks/test_session_start_terraform_assets.py::test_missing_terraform_warns_and_still_syncs"
      "tests/hooks/test_session_start_terraform_assets.py::test_hook_is_registered_with_a_timeout"
      "tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings"
    expected: exit 0; six nodes pass; the first five fail before the change.
    fix_if: Fix the hook or the registration; re-render hooks.json from settings.json, never hand-edit it.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: session-start-terraform-assets-hook
  - step: 3
    phase: pre-deploy
    action: Setup no longer fetches terraform assets; the rest of its contract holds.
    command: bin/venv-python -m pytest -q tests/test_setup_cloud_env.py
    expected: exit 0; test_setup_fetches_no_terraform_assets passes and fails before the change.
    fix_if: >-
      A removed test needs a weakening_dispositions entry (planned-change citing this plan, or refactor citing its
      successor node in step 1 or 2); never delete an unrelated assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of a test file this plan modifies; the existing setup-cloud-session-bootstrap-parity registry
      row already runs this file as a standing check.
  - step: 4
    phase: pre-deploy
    action: The repointed registry entry admits (fails on origin/main, passes on HEAD).
    command: >-
      bin/venv-python -c "import scripts.checks.verification.validate_verification_registry as v; f=[];
      v.validate_verification_registry(f); assert not f, f; print('REGISTRY_ADMITTED')"
    expected: exit 0, prints REGISTRY_ADMITTED.
    fix_if: >-
      If the entry passes on origin/main, its command still reads bin/setup-cloud-env.sh; point it at the new script.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Governing texts present verbatim and their contract evaluators green.
    command: >-
      grep -qF 'never signs setup-script requests' docs/contracts/terraform-cc-web-operations.yaml
      && grep -qF 'bash bin/sync-terraform-assets.sh --tfvars`, which pins' docs/contracts/terraform-cc-web-operations.yaml
      && grep -qF 'The tfvars this loop needs are never fetched automatically' docs/contracts/terraform-cc-web-operations.yaml
      && ! grep -qF "container's existence is the" docs/contracts/terraform-cc-web-operations.yaml
      && grep -qF 'synced it and wrote $HOME/.terraform-mirror.tfrc' docs/contracts/deploy-paths.yaml
      && grep -qF 'session_start_terraform_assets.sh (bin/sync-terraform-assets.sh)' config/terraform/cc-web.tfrc
      && grep -qF 'PLAN-admin-terraform-assets-session-hook):** the mirror sync moved out of' docs/DECISIONS.md
      && bin/venv-python -m pytest -q tests/test_materialise_tfvars_delegate.py
      tests/checks/contracts/test_validate_terraform_cc_web_operations.py tests/test_deploy_paths_admin_procedure.py
      && echo TEXTS_OK
    expected: exit 0, prints TEXTS_OK.
    fix_if: Copy the text from execution step 6 verbatim; never reword approved text.
    hermetic: true
    expected_literals: ["TEXTS_OK"]
    graduation: waive
    graduation_waiver_reason: >-
      Text presence of approved wording, already guarded by the contracts' own evaluators; a registry row would pin
      prose that later approved amendments may legitimately change.
  - step: 6
    phase: pre-deploy
    action: Full tier, to completion (handoff evidence).
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      In-scope failure: fix on the branch, never skip a test or add a baseline. Out-of-scope failure: a rec via
      scripts.ops_data_portal (Decision 59).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      In a NEW ADMIN session started after merge, read the session's own start-up output and re-run the hook and the
      file checks.
    command: >-
      bash .claude/hooks/session_start_terraform_assets.sh
      ; test -n "$(ls -A "$HOME/.terraform-mirror" 2>/dev/null)" && test -s "$HOME/.terraform-mirror.tfrc"
      && test "$HOME/.terraform-mirror.tfrc" -nt "$HOME/.aws/config" && echo MIRROR_SYNCED || echo MIRROR_MISSING
      ; grep -qE '[0-9]{12}|arn:' "$HOME/.terraform-mirror.log" && echo LOG_LEAK || echo LOG_CLEAN
    expected: >-
      The session's start-up output already showed a [session_start_terraform_assets] mirror-sync OK line; the re-run
      prints mirror-sync OK; then MIRROR_SYNCED and LOG_CLEAN. Plan A's VP 11 token MIRROR_SYNCED is met.
    fix_if: >-
      WARNING with a class: read the class; NO_CREDENTIALS or INVALID_TOKEN means the network secret or profile chain
      (run .claude/hooks/session_start_aws.sh); ACCESS_DENIED means PlatformDev lost the prefix (rec-4748). Report the
      class to Benjamin; never switch the sync to the admin profile.
    hermetic: false
  - step: 8
    phase: post-deploy
    action: >-
      Real init through the mirror on a scratch copy (Decision 120's ADMIN relaxation of Decision 119's VP rule; no
      backend, lockfile read-only, nothing in the checkout changes).
    command: >-
      d=$(mktemp -d) && cp -r terraform/personal "$d/p" && rm -rf "$d/p/.terraform"
      && (cd "$d/p" && TF_CLI_CONFIG_FILE="$HOME/.terraform-mirror.tfrc" terraform init -backend=false -lockfile=readonly
      -input=false -no-color 2>&1 | grep -E 'Installed kislerdm/neon|successfully initialized'); rm -rf "$d"
    expected: >-
      Prints a line "Installed kislerdm/neon v<ver> (unauthenticated)" (filesystem-mirror install; a direct fetch reads
      "self-signed") and "Terraform has been successfully initialized!". Probed on 2026-10-30 with v0.13.0.
    fix_if: >-
      "self-signed" means the mirror config was not used: check the tfrc path and contents. An init error: record it,
      tell Benjamin; never edit the lock file.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: PlatformDev still reads the mirror prefix (Decision 238 fence awareness).
    command: >-
      aws s3 ls s3://agent-platform-data-lake/tf-provider-mirror/ --recursive --profile agent_platform 2>&1
      | grep -c 'tf-provider-mirror/registry.terraform.io/'
    expected: a count of at least 3 (9 objects on 2026-10-30).
    fix_if: AccessDenied or 0 - record it, tell Benjamin, and raise rec-4748's priority; do not widen any grant here.
    hermetic: false
  - step: 10
    phase: post-deploy
    action: >-
      One on-demand tfvars fetch (a read-only PlatformAdmin secret read, approved as part of this plan), checked
      without printing it, then removed.
    command: >-
      bash bin/sync-terraform-assets.sh --tfvars > /tmp/tfv.out 2>&1; rc=$?
      ; T=terraform/personal/terraform.personal.tfvars
      ; echo "rc=$rc"; test -s "$T" && test "$(stat -c %a "$T")" = 600 && echo TFVARS_OK || echo TFVARS_BAD
      ; grep -qE '[0-9]{12}|arn:' /tmp/tfv.out && echo OUT_LEAK || echo OUT_CLEAN
      ; rm -f "$T" /tmp/tfv.out
    expected: rc=0, TFVARS_OK, OUT_CLEAN.
    fix_if: >-
      rc=1: read the printed class (never cat the file). OUT_LEAK: stop, delete the output, tell Benjamin (Decision 101).
    hermetic: false
