pre_implementation_checklist:
  - Branch confirmed not on main (harness-assigned session branch)
  - docs/PROJECT_CONTEXT.md read
  - "Only the plan-cited decision sections read: 192, 193, 188, 177, 151, 167, 179, 150, 100, 55"
  - "docs/contracts/decision-entry.yaml amendment_forms read before drafting the annotation"
  - Decision 192's current span located and its existing Decision 193 blockquote identified
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    docs/DECISIONS.md -- insert the annotation directly after the existing "> **Amended by
    Decision 193 (2026-09-15):**" blockquote and its continuation lines, and before the blank line
    preceding "**Problem:**". The authored text, which measured 6,118 of the 6,144-byte norm and
    carries all four required content elements, is reproduced here verbatim so the implementer
    need not re-derive it (adjust only if a constraint above demands a trim):
  - >-
    VERBATIM ANNOTATION TEXT (measured 6,118 of the 6,144-byte span, 26 bytes margin; wrap each
    line at width 96 with a "> " prefix, which is the width already used by Decision 192's
    existing blockquote). Re-run VP step 4 after any edit -- do not trust the authored figure.
    Stress-tested at re-wrap widths 88/90/96: the span stays at or below 6,121 and the grep token
    survives intact at every width.
  - >-
    "> **Update (2026-09-21):** clause 3(b)'s GcDebtRatio bound now has an S3 reclaimer. The
    standing \"NEVER add an S3 lifecycle expiration rule over the lakehouse prefix\"
    (PLAN-production-gc-and-storage-stability.yaml:815) forbids a CURRENT-VERSION age rule that
    would delete live Parquet the catalog does not track; that stands. A NONCURRENT-version rule
    is categorically distinct -- it touches only versions already outside the G1 live set
    (Decision 188 cl.2) -- so this RECORDS the scoping f1a9cb2a (#1225) shipped and grants no new
    delete authority. Scoping is PER-PREFIX from the declared `*_data_prefix` locals, each either
    covered or declared-excluded, enforced by `TestDataLakeLifecycleGoverned`. `noncurrent_days`
    binds `SNAPSHOT_RETAIN_DAYS` as an OPERATOR RECOVERY window, NOT catalog time travel: gc_ops
    runs after expire_snapshots. RESIDUAL: `list_storage` uses ListObjectsV2, so clause 3(b) and
    G4's byte cap (Decision 193 cl.1) stay current-versions-only and under-report billed bytes;
    clause 3(a)'s G1 invariant is UNAFFECTED."
  - >-
    DATE COUPLING: 2026-09-21 appears in FOUR coupled places -- the annotation text, VP step 2's
    `s.find('> **Update (2026-09-21):**')` literal, acceptance criterion 1, and the registry row's
    graduated_at. If the implementation date differs, ALL FOUR move together; changing only the
    annotation makes VP step 2 hard-fail and leaves acceptance criterion 1 unsatisfied. VP step
    2's literal is itself a multi-word phrase -- the same wrap-fragility class VP step 1's token
    avoids -- so it must remain UNWRAPPED on the annotation's first line; at 26 characters it
    always is, but do not re-wrap the opener.
  - >-
    config/agent/verification_registry/entries/decision-192-noncurrent-lifecycle-amendment.yaml --
    create with check_id equal to the filename stem (the placement leg of
    validate_verification_registry requires filename == check_id), primitive_slot
    command_exit_zero, guard_target docs/DECISIONS.md, guard_symbol null, plan_slug
    decision-192-noncurrent-lifecycle-amendment, graduated_at the implementation date, and a
    check_spec whose command is the VP step 1 awk-slice pipeline. TWO mechanical requirements.
    (1) A shell pipeline enters check_spec as ["bash", "-c", "<pipeline>"], matching the sibling
    rows that carry pipelines (e.g. cc-web-signing-hook-registered.yaml); a bare ["awk", ...]
    argv would never see the `| grep`. (2) The awk slice is what makes the row admissible -- a
    whole-file grep would pass on origin/main too and the VF-06 differential gate would reject it
    as tautological ("not admitted").
  - >-
    Run the Verification Plan in order; steps 1-4 are cheap and diagnose each other. Do NOT
    regenerate docs/decisions-index.json unless step 3 reports drift; if it does, understand the
    cause before regenerating, then commit the regenerated file (it is already in scope).
  - >-
    Commit. No Resolves trailer -- this plan closes no recommendation. State in the commit body
    that the annotation records an already-shipped scoping and grants no new delete authority.
  - "Report: the final D192 span in bytes, whether the index needed regeneration, and the VP results."
rollback: >-
  Delete the annotation lines from Decision 192, delete the registry entry, and revert
  docs/decisions-index.json if it was regenerated. Fully reversible: the annotation is additive,
  perturbs no typed field, and nothing in the live system reads it -- the cost of rollback is
  precisely the re-litigation risk this plan exists to remove.
