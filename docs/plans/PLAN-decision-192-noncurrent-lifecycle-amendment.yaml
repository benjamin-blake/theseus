schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-192-noncurrent-lifecycle-amendment"
intent: >-
  Record in the governance corpus why the live S3 noncurrent-version lifecycle rule over the
  production lakehouse prefix does not violate the standing no-lifecycle-expiration constraint, so
  the exemption is not re-litigated and a live production rule is never "corrected" away by a
  future reader who finds the constraint text and not the reason it was narrowed.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-decision-192-noncurrent-lifecycle-amendment.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One dated, append-only blockquote_update annotation on Decision 192, placed after the
      existing Decision 193 amendment blockquote and BEFORE the "**Problem:**" heading.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      CONDITIONAL regeneration. The annotation adds no typed amends/supersedes edge and Decision
      192's indexed excerpt is sourced from its Problem section, which the annotation sits above,
      so the committed index is expected to stay byte-identical. VP step 3 asserts that rather
      than assuming it; regenerate ONLY if it reports drift.
  - file: config/agent/verification_registry/entries/decision-192-noncurrent-lifecycle-amendment.yaml
    action: Create
    purpose: Graduated presence guard for the annotation (check_id equals filename).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Decision 192's span in docs/DECISIONS.md carries a dated "> **Update (2026-09-21):**"
    annotation that (a) restates that a CURRENT-VERSION age expiration remains forbidden, (b)
    states why a NONCURRENT-version rule is categorically distinct, (c) declares the durable
    PER-PREFIX scoping SHAPE (each declared *_data_prefix local either covered or
    declared-excluded) AND the check that enforces it -- never a point-in-time prefix roster,
    which PLAN-smoke-prefix-lifecycle-coverage falsifies -- and (d) records the residual
    current-versions-only blindness bounding both clause 3(b) and G4's byte cap.
  - >-
    The annotation states that it RECORDS the scoping f1a9cb2a (#1225) already shipped and grants
    no new delete authority -- the human-settled routing claim for taking the amendment route
    rather than minting a number (Decision 150 / Decision 167 clause 4).
  - >-
    No typed field of Decision 192 or of any other entry changes, the live entry count stays 150,
    and docs/decisions-index.json remains current WITHOUT regeneration.
  - >-
    Decision 192's body span stays at or under the 6,144-byte per-entry norm, achieved by trimming
    rather than by any budget raise (Decision 167's own reversal text).
  - No existing clause body in Decision 192 is edited; the annotation lands as its own lines.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The annotation is present INSIDE Decision 192's span. The awk slice is load-bearing: a
      whole-file grep would pass if the text landed in the wrong entry, which is the most likely
      authoring error here.
    command: "awk '/^## Decision 192:/,/^## Decision 191:/' docs/DECISIONS.md | grep -q 'TestDataLakeLifecycleGoverned'"
    expected: "Exit 0."
    fix_if: >-
      THREE causes, in order of likelihood. (1) The annotation is absent. (2) It landed outside
      Decision 192's span (wrong entry, or after the "---" separator). (3) The grep token was
      split by a line wrap -- this is why the token is the single unhyphenated identifier
      `TestDataLakeLifecycleGoverned` rather than a multi-word phrase: textwrap breaks on spaces
      AND hyphens, so any phrase here is wrap-fragile. Do NOT move correctly-placed text to chase
      cause (3), and never widen the awk slice to make the check pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-192-noncurrent-lifecycle-amendment
  - step: 2
    phase: pre-deploy
    action: >-
      Placement and grammar: the annotation sits ABOVE the Problem heading (so it cannot terminate
      the typed Related id-list, and cannot perturb the indexed excerpt), and no existing clause
      body was edited (Decision 177 append-only).
    command: "bin/venv-python -c \"import pathlib,sys; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); i=t.find('## Decision 192:'); j=t.find('## Decision 191:'); s=t[i:j]; u=s.find('> **Update (2026-09-21):**'); p=s.find('**Problem:**'); r=s.find('**Related:**'); assert u!=-1, 'annotation missing from the D192 span'; assert u<p, 'annotation must sit ABOVE **Problem:** -- below it risks the indexed excerpt and the typed Related list'; assert r>p, 'Related heading not found after Problem -- entry shape changed unexpectedly'; print('placement OK: update@%d < problem@%d < related@%d' % (u,p,r))\""
    expected: "Prints placement OK with the update offset strictly less than the Problem offset."
    fix_if: >-
      An assertion naming 'ABOVE **Problem:**' means the annotation was appended at the end of the
      entry; move it to directly after the existing Decision 193 blockquote. Do not relax the
      ordering assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time placement assertion for this specific annotation's offsets inside one named
      entry. It has no recurring subject once the annotation lands, and the durable half of the
      property (that no typed field is perturbed) is already carried by step 3's index-freshness
      check and by validate_decision_currency in the standing tiers.
  - step: 3
    phase: pre-deploy
    action: >-
      The corpus still parses to 150 entries, no typed field of any entry shifted, and the
      committed decisions index is STILL CURRENT WITHOUT REGENERATION -- which is the empirical
      proof that the annotation introduced no amends/supersedes edge.
    command: "bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c \"from scripts.decisions_md import parse_decisions_md; from pathlib import Path; rows=parse_decisions_md([Path('docs/DECISIONS.md')]); assert len(rows)==150, ('live entry count moved', len(rows)); print('entries:', len(rows))\""
    expected: "'Decisions index is current.' then 'entries: 150'."
    fix_if: >-
      Index drift means the annotation DID perturb a projected field -- investigate which before
      regenerating; a blockquote should add no edge, so drift is a signal the text was
      misformatted (e.g. it parsed as an 'Amended by Decision N' relation). Only after
      understanding the cause, regenerate with `bin/venv-python -m scripts.decisions_index --write`
      and commit the result. An entry count other than 150 means a heading was introduced.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both legs duplicate checks already graduated and registered in the standing tiers
      (validate_decisions_index_freshness, DCG-08, runs in --pre and full). Graduating a second
      copy keyed to this plan would add a redundant registry row asserting the same property.
  - step: 4
    phase: pre-deploy
    action: >-
      Decision 192's body span stays within the 6,144-byte per-entry norm, so the annotation emits
      no rec-3243 amendment-delta accretion warning.
    command: "bin/venv-python -c \"import pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); n=len(t[t.find('## Decision 192:'):t.find('## Decision 191:')].encode()); print('D192 span', n, 'of 6144'); assert n<=6144, ('over the per-entry norm by %d bytes -- TRIM, never raise (Decision 167)' % (n-6144))\""
    expected: "Prints a span at or below 6144; measured at authoring time as 6118 (26 bytes margin)."
    fix_if: >-
      Over the norm: TRIM the annotation (drop a path in favour of a greppable symbol name, or
      shorten a clause). Decision 167's own reversal text makes trimming or compaction the
      sanctioned response to cap pressure -- never a raise to fit, and never dropping one of the
      four required content elements in acceptance criterion 1.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The per-entry norm already has a registered enforcer (validate_decisions_size) whose
      baseline leg covers exactly this amendment-delta case as WARN-tier telemetry. This step is
      the plan's own tighter, one-time assertion against a single entry; graduating it would
      install a permanent hard gate on one named entry that the governance model deliberately
      keeps advisory for baseline entries.
  - step: 5
    phase: pre-deploy
    action: >-
      Run the FULL presubmit tier, as handoff_policy.full_validation_required_before_commit
      declares. It carries validate_decisions_size, validate_decision_currency,
      validate_decisions_index_freshness, validate_decision_entry_conformance,
      validate_verification_registry (including the VF-06 differential admission gate on the new
      registry row) and validate_graduation_completeness.
    command: "bin/venv-python -m scripts.validate"
    expected: "Exit 0."
    fix_if: >-
      A verification-registry differential failure ("not admitted") means the new row's check_spec
      does not discriminate -- confirm the awk slice is present in the command, since a
      whole-file grep would pass on origin/main too and be rejected as tautological. A
      validate_decision_currency failure means a typed currency invariant moved; re-read step 3's
      output before touching the index.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      scripts.validate is the aggregate presubmit entrypoint, not a kernel primitive; graduating
      it would recurse the validation harness into its own registry, which the vp-red-before
      contract's graduate-partition recursion refusal explicitly declines.
test_obligations:
  - source: docs/DECISIONS.md
    behavior: >-
      Decision 192's span must carry the dated annotation explaining why a noncurrent-version-only
      lifecycle rule does not violate the standing no-lifecycle-expiration constraint.
    verification_step: 1
    command: "awk '/^## Decision 192:/,/^## Decision 191:/' docs/DECISIONS.md | grep -q 'TestDataLakeLifecycleGoverned'"
    red_green_expectation: >-
      Red before: verified empirically at authoring time -- the command exits 1 against the
      current tree (assertion_failed, a legitimate red-before outcome). Green after the annotation
      lands.
  - source: config/agent/verification_registry/entries/decision-192-noncurrent-lifecycle-amendment.yaml
    behavior: >-
      The graduated row must name the span-scoped command, so the VF-06 differential gate can
      prove the guard discriminates against origin/main.
    verification_step: 5
    command: "bin/venv-python -m scripts.validate"
    waiver_reason: >-
      This file IS a verification record, not behavior-capable source. A test asserting its
      contents would restate validate_verification_registry, which already enforces the schema,
      check_id uniqueness, filename==check_id placement and the VF-06 differential leg over every
      row in the directory. A second surface asserting the same properties is drift by design.
  - source: docs/decisions-index.json
    behavior: >-
      The committed index must stay current; the annotation must introduce no amends/supersedes
      edge.
    verification_step: 3
    command: "bin/venv-python -m scripts.decisions_index --check"
    waiver_reason: >-
      A generated artefact with an already-registered freshness enforcer
      (validate_decisions_index_freshness / DCG-08, in both the --pre and full tiers). The plan
      asserts the property at step 3 rather than adding a duplicate standing guard for it.
constraints:
  - >-
    The annotation RECORDS an already-shipped scoping; it grants no new delete authority. The
    authority was created by f1a9cb2a (#1225) through that plan's own gates. This routing claim
    (amendment rather than a new numbered Decision) was put to the human at Step 6b after the
    decision-scout raised it as a Decision 150 NOTE, and settled in favour of the annotation --
    it must be STATED in the annotation text, never left implicit (Decision 167 clause 4).
  - >-
    Decision 177 append-only: the annotation lands as its OWN line(s). Do NOT edit any existing
    clause body, the yaml significance envelope, the Rationale, or the Related list of Decision
    192, and do NOT touch the existing "> **Amended by Decision 193 (2026-09-15):**" blockquote.
  - >-
    Placement is ABOVE the "**Problem:**" heading, directly after the Decision 193 blockquote. Two
    reasons, both load-bearing: a blockquote-bold line TERMINATES a typed id-list field
    (decision-entry.yaml amendment_forms general_rule), so placing it after "**Related:**" would
    truncate that field; and Decision 192's indexed excerpt is sourced from its Problem section,
    so an annotation above it cannot perturb the committed index.
  - >-
    Use the PINNED blockquote_update spelling "> **Update (2026-09-21):** ...". Decision 192
    already carries a blockquote annotation, so this matches the entry's own dialect. It
    deliberately does NOT use the trailing_bracket "[Amendment 20...]" form, and therefore does
    not increment rec-3265's acceptance counter -- correct, because Decision 192 is outside that
    rec's D25..D168 ledger (2026-08-24 census; 192 was decided 2026-09-15).
  - >-
    NEVER reintroduce the claim that the S3 recovery window must be >= the catalog's time-travel
    window. That reasoning is WRONG and was discarded during planning. The shipped and correct
    rationale is that noncurrent_days binds SNAPSHOT_RETAIN_DAYS as an OPERATOR MANUAL-RECOVERY
    window, NOT catalog time travel, because gc_ops runs after expire_snapshots so every file it
    deletes already sits outside the snapshot horizon and no read path pins a version id
    (terraform/personal/main.tf, the comment on the noncurrent_version_expiration block).
  - >-
    Do NOT modify terraform/personal/main.tf, the iam_tf test module, or anything under src/.
    This plan is governance-only; the lifecycle rule already shipped.
    The annotation must NOT name rec-3892 or rec-3945 as live gates. VERIFIED 2026-09-21 by live
    warehouse read (rec_by_id, not the local cache): BOTH ARE CLOSED. rec-3892's RCA verdict is
    PREMISE REFUTED -- no unmodeled deleter exists in the smoke prefix; all 1,400 smoke delete
    markers fall in two Sunday bursts predating the sampled window. rec-3945 is resolved by
    PLAN-smoke-prefix-lifecycle-coverage, which extends the rule to the smoke prefix. That change
    was NOT yet on origin/main at 34a5a57b when this plan was authored, so an annotation claiming
    "production prefix ONLY" would be false within hours of being dated -- precisely the
    re-litigation trigger this plan exists to remove. State the durable per-prefix SHAPE instead.
  - >-
    Cap pressure is answered by TRIMMING, never a raise (Decision 167 reversal text). If the
    annotation must grow, drop a file path in favour of a greppable symbol name before dropping
    any of acceptance criterion 1's four required content elements.
  - No rescue agents or workaround loops (Decision 55).
