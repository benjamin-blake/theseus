    scripts/ops_writer.py -- add a module-level constant _OUTBOX_BASE = ROOT / "logs" / ".ops-outbox"
    beside ROOT (line 27). In _write_to_outbox (line ~280) replace the
    Path(__file__).parent.parent-derived path with "outbox_dir = _OUTBOX_BASE / table", reading the
    module global at call time so tests can patch it. In drain() (line ~670) DELETE the local
    "outbox_base = ROOT / ..." assignment and reference _OUTBOX_BASE directly at both of its use
    sites -- this deletion is what keeps the change net-zero SLOC. Path stays imported for ROOT, so
    no F401 cascade.
  - >-
    tests/fixtures/outbox_guard.py -- create the pure helper: import DUCKLAKE_MIGRATED_TABLES from
    scripts.sync.ops and use it VERBATIM as the retired set (plus a predicate for the *_pending
    suffix); an ABSOLUTE outbox base computed once from the repo root; a snapshot(base) returning the
    set of files that short-circuits to an empty set when the base does not exist; and a diff
    function returning newly-added files. Do not derive, subtract from, or copy the table set.
  - >-
    tests/conftest.py -- add an autouse fixture using that helper. At session start, fail loudly if
    any file already exists in a RETIRED dir, naming every offending path and the exact rm
    remediation (Decision 149 -- do not baseline it away); files in legacy staging dirs may be
    baselined. Per test, snapshot before and compare in teardown (after the yield); on a new file,
    delete it so the tree is left clean and then fail the test naming BOTH the reporting test id and
    the offending path. Under -n auto the reporting test may not be the writer -- word the message so
    it does not over-claim (see the XDIST ATTRIBUTION LIMIT constraint). Keep the file under 500
    lines (Decision 130).
  - >-
    tests/ops_writer/test_outbox_emit.py -- rewrite test_write_to_outbox_directly to patch
    scripts.ops_writer._OUTBOX_BASE to tmp_path and call writer._write_to_outbox(table, entry)
    normally (no .__func__, no Path patch), asserting the file landed under tmp_path with the right
    payload; DELETE the "Fallback: write directly" block entirely. Rewrite
    test_s3_failure_writes_to_outbox to drop fake_write_to_outbox and let the real method run against
    the patched _OUTBOX_BASE. Re-point test_write_to_outbox_failure_is_swallowed at a genuinely
    unwritable _OUTBOX_BASE (an existing file, so mkdir raises NotADirectoryError) instead of
    patching Path.
