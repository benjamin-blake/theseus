schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "executor-substrate-evidence-fold"
intent: >-
  Persist the 2026-08-21 executor substrate-billing evidence round -- nine operator runtime
  estimates, two external doc-pass results, and the GitHub Actions usage-policy predicate -- into
  the roadmap's cost_projection and tier item T4.15, and encode one substrate-neutral design
  commitment: verification and validation run on GitHub Actions REGARDLESS of which layer-2
  persona substrate the spike selects. Evidence-persistence and predicate-encoding only. This plan
  SELECTS NO SUBSTRATE (CD.44 discipline point 1: selection is T4.15's act).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-substrate-evidence-fold.yaml
phase: >-
  Platform T4 (executor). Tier item T4.15 -- the layer-2 substrate comparative spike. This plan
  adds evidence and exit criteria to that item; it closes none of its criteria and completes
  nothing.

fallback_reevaluation:
  reevaluated_on: "2026-08-21"
  substrate_status: >-
    CD.27's layer-2 incumbent remains the incumbent. This plan records billing and runtime
    evidence bearing on the comparison and selects nothing. Two candidates assessed this round
    (aws_native_codebuild_runner, agentcore_managed_runtime) were never members of CD.27's pinned
    five, so recording their elimination narrows no pinned option. The spike owned by T4.15 has
    not run.
  verdict: continue_on_current_substrate
  basis: >-
    Recorded voluntarily -- this plan names no CD.27-gated tier item, so the carrier no-ops and no
    verdict is compelled. CD.27's fallback_spec trigger is a Durable-Functions API-SEMANTICS
    regression, on which this round's evidence bears not at all: nothing here touches resume
    semantics, checkpoint granularity or the fallback's cutover. The verdict is therefore
    continue-on-current-substrate by absence of any triggering event, not by adjudicating one. The
    billing evidence discriminates against one never-pinned candidate on price and eliminates a
    second never-pinned candidate on structure; the pinned five stay economically
    indistinguishable at any fixed scale point, so no fallback condition is engaged and no
    obligation lapses.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      The evidence fold and the predicate encoding. Adds cost_projection.operator_estimates (nine
      OE entries in the compact flow style of audits/private-repo-self-hosted-ci-9a545d2.yaml's
      assumed_inputs); adds two ASSESSED rows to executor_substrate_billing's per-substrate
      envelope, each declaring a provenance class and in_pinned_candidate_set: false; BACKFILLS
      provenance_class onto the seven incumbent priced rows the amended guard now scans (the four
      pinned envelope rows plus the three durable_execution_corrected_rates rows) -- the pinned
      rows ARE edited, in this one additive field, and their envelope figures and rate_basis are
      untouched except for long_running_container's band; widens long_running_container's envelope
      to the recomputed band and reconciles non_discrimination_conclusion's delta clause to a
      fixed-scale-point reading; extends THREE existing substrate_reevaluation_triggers rows IN
      PLACE to name the ToS predicate (the row COUNT must stay 4 -- a standing guard pins it); and
      adds T4.15 exit criteria c9 and c10. Line budget: 8,995 of 10,000 at authoring time
      (Decision 114 ceiling, Decision 147 compactness norm) -- roughly 1,005 lines of headroom, of
      which this plan consumes a visible slice; re-measure after any rebase.
  - file: tests/esb_text_fix/test_cost_projection.py
    action: Modify
    purpose: >-
      Amend the priced-row provenance guard so the two new rows can land WITHOUT the guard
      degrading to existence-only (Decision 165). Replaces the single hardcoded
      "AWS Price List bulk offer files" + "2026-08-01" needle pair with a CLOSED ENUMERATION of
      provenance classes, each carrying its own mandatory needle, retrieval date and region rule;
      an unrecognised or absent provenance_class FAILS, and the fault injection is PER CLASS so a
      second class cannot be admitted while enforcing nothing. ALSO fixes a live selection gap: the
      affected_tests channel-2 data edge is a PER-FILE text scan, and this module carries no
      literal "docs/ROADMAP-PLATFORM.yaml" token, so it is not selected into --pre on a
      roadmap-only PR today -- the guard this plan is amending would not run on the very edit it
      exists to police. Add the literal. Also carries bundled rec-2946: the SFN transition guard
      parses tx_per_rec and rate out of the roadmap line it checks instead of hardcoding them as
      Python literals.
  - file: tests/esb_text_fix/test_substrate_evidence_fold.py
    action: Create
    purpose: >-
      The standing home for this wave's roadmap-content assertions, so they survive as regression
      guards instead of being one-shot checks discarded after implementation. Six test functions
      covering the operator estimates, the two assessed rows' set-membership declarations, the
      narrowed conclusion and its reconciled per-scale-point delta arithmetic, T4.15 c9, T4.15 c10,
      and the in-place trigger extension. A separate module rather than more bulk in
      test_cost_projection.py: that module's subject is the priced-row guard contract, this one's
      is the evidence fold, and splitting keeps both well under the SLOC limit. It must carry the
      literal token "docs/ROADMAP-PLATFORM.yaml" in its own text so the affected_tests channel-2
      data edge selects it into --pre on any roadmap change: that channel is a PER-FILE text scan
      (scripts/checks/deps/affected_tests.py::_data_edge_channel reads each tests/**/*.py and looks
      for the changed data file's literal relpath or quoted basename), so importing _anchors
      propagates NOTHING -- only three sibling modules carry the literal today and are selected;
      test_cost_projection.py does not.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Two changes. (1) rec-2946's second surface: the graduated check
      sfn-transition-line-arithmetic-consistent duplicates the same tx_per_rec=30 /
      rate=0.000025 hardcoding as a bash one-liner, so fixing only the pytest guard would leave the
      rec half-open -- update its check_spec to parse the stated assumptions from the roadmap line.
      (2) Admit this wave's eight graduated checks as primitive_slot: test_selector rows pointing
      at the pytest node ids landed in the two test modules.

bundled_recommendations:
  - rec-2946

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    cost_projection.operator_estimates exists with exactly nine entries OE-01..OE-09, each
    carrying id, input, assumed_value, why and sensitivity, under a source label that names the
    2026-08-21 session and explicitly disclaims measurement. Every why field is one line
    (Decision 110: the roadmap's ratified property is structured data, not narrative).
  - >-
    executor_substrate_billing.per_substrate_envelope_usd_per_month carries the two new ASSESSED
    rows, each declaring provenance_class and in_pinned_candidate_set false. The four pinned rows
    remain present and remain members of the pinned set; they are EDITED in exactly four respects
    and no others -- every priced row gains provenance_class, the four pinned envelope rows gain
    in_pinned_candidate_set true, long_running_container's envelope widens to its recomputed band,
    and long_running_container gains its utilisation_basis (criterion 12). No pinned row's
    rate_basis, region or note-borne rate figure changes.
  - >-
    EVERY priced row the guard scans -- all four envelope rows plus all three
    durable_execution_corrected_rates rows, plus the two new rows -- declares a recognised
    provenance_class. EVERY row of per_substrate_envelope_usd_per_month additionally declares
    in_pinned_candidate_set explicitly, true or false. No row relies on a default for either field,
    and the delta arithmetic selects its rows by the explicit flag rather than by absence -- a
    future row added without it must fail, not be silently counted as pinned.
  - >-
    No arn:aws: literal reaches cost_projection; the Step Functions optimized integration is named
    as codebuild:startBuild.sync without the ARN prefix (Decision 101 + the standing public-repo
    boundary guard).
  - >-
    The priced-row guard is a closed enumeration of THREE classes -- the incumbent AWS-Price-List
    class and two published-pricing-page classes, one regional and one region-unqualified, split
    because the region rule is a property of the CLASS and the two new rows need opposite region
    rules (codebuild is eu-west-2, agentcore's published rates are region-unqualified); collapsing
    them into one class makes one of the two real rows an unintended decoy. Proven non-vacuous PER
    CLASS: for EACH of the three, a row carrying that class with a wrong needle is REJECTED and a
    row carrying that class with the correct needle but a wrong retrieval date is REJECTED; a row
    declaring an unrecognised class is REJECTED; a row declaring no class is REJECTED; and a
    well-formed row of each class is ACCEPTED. The region-unqualified class additionally requires
    region == not_region_qualified AND a substantive region_caveat naming the service and the
    reason, not merely a non-empty string. The region rule is never a per-row opt-out.
  - >-
    non_discrimination_conclusion records that it NARROWED -- economics now discriminate against
    the codebuild-class candidate only -- states that CD.27's pinned five are unchanged, and
    reconciles its delta clause to a FIXED-SCALE-POINT reading, citing
    executor_substrate_billing.provenance's block-level "recorded scale 100-300 recs/month" as what
    licenses reading a band low as the 100-rec point and a band high as the 300-rec point. The
    clause PUBLISHES both maxima as figures, and the guard PARSES those figures out of the clause
    and asserts EQUALITY with the maxima it computes from the pinned bands -- not a constant
    ceiling, which would stay green while the published figure silently went false (the same
    hardcoded-expectation defect bundled rec-2946 exists to remove).
  - >-
    T4.15 gains exit criterion c9 (status open) binding verification and validation to GitHub
    Actions regardless of the selected substrate, excluding verification wall-clock from the
    spike's per-arm measurements, citing Decision 163 clause 3 for the interactive/executor
    scoping, citing Decision 112's reversal condition as the conscious carry-forward trigger
    (Decision 75), stating that BOTH T4.9 c1 and T4.9a c1 are NOT rehomed, and expressing the
    persona/verifier boundary as workflow-run separation so the criterion does not go vacuous on
    the hosted_cli_runner arm.
  - >-
    T4.15 gains exit criterion c10 (status open) requiring the ratifying record to state the
    GitHub Actions usage-policy fit -- clause 5 satisfied, clause 4 binding, a measured burden
    posture, named re-evaluation triggers, and the BUSL-1.1 clause-3 note.
  - >-
    substrate_reevaluation_triggers still has EXACTLY four rows; the A2+ row, the repo-visibility
    row and the order-of-magnitude scale row each name the ToS predicate in place; no row is
    duplicated and no row is added.
  - >-
    rec-2946 is discharged on both surfaces: the pytest guard and the graduated registry check
    each derive tx_per_rec and rate from the roadmap line's own stated assumptions, proven by a
    mutation probe rather than by the guard merely passing.
  - >-
    Every content assertion this plan makes about the roadmap is landed as a pytest test function
    and admitted to the verification registry as a primitive_slot test_selector row, so the new
    content carries standing regression coverage rather than one-shot checks.
  - >-
    long_running_container declares a utilisation_basis distinguishing its Price-List RATE
    provenance (2026-08-01, unchanged) from the operator-estimate UTILISATION that produces its
    band high, so the machine-readable provenance_class does not read the whole row as
    Price-List-provenanced. This field is ASSERTED, not merely written: it carries the plan's own
    anti-existence-only thesis, so shipping it unguarded would be the declared-vs-executed shape
    Decision 163 clause 2 names. The assertion lands inside
    test_new_envelope_rows_declare_set_membership_and_verdicts, which is already graduated as
    substrate-rows-declare-set-membership -- no ninth registry row is needed.
  - >-
    docs/ROADMAP-PLATFORM.yaml stays within the 10,000-line ceiling and the full presubmit tier
    exits 0.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Pre-handoff full presubmit tier. Schema validation, dependency graph, the roadmap line
      ceiling, contract conformance, coverage and the whole test suite. Required by
      handoff_policy and structurally enforced by validate_handoff_full_tier (Decision 163).
    command: |-
      bin/venv-python -m scripts.validate
    expected: Exit 0, no FAIL lines.
    fix_if: >-
      Any FAIL. Do not commit on a red full tier -- timeout_disposition is blocked, so a timed-out
      run resumes later and reruns full from the start rather than downgrading to --pre.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible in principle as command_exit_zero, but graduating it is circular: the
      registry row would invoke the very harness that runs the registry, so the check would be its
      own consumer. The obligation it discharges is already structurally enforced for every plan by
      validate_handoff_full_tier (Decision 163), which is a stronger instrument than a registry row
      keyed to this one plan.
  - step: 2
    phase: pre-deploy
    action: >-
      THE OPERATOR ESTIMATES ARE STRUCTURED, COMPLETE, AND HONEST ABOUT THEIR PROVENANCE. Nine
      entries, five required fields each, a source label that disclaims measurement, and one-line
      why fields so the roadmap does not accrete narrative (Decision 110 / Decision 147).
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_operator_estimates_block_is_complete_and_disclaimed -q
    expected: 1 passed.
    fix_if: >-
      A missing entry or field, an absent disclaimer, or a why field over the character cap -- move
      the extended justification to the PR body per the AGENTS.md change-record content rule.
    hermetic: false
    graduation: graduate
    graduation_check_id: operator-estimates-block-complete
  - step: 3
    phase: pre-deploy
    action: >-
      THE TWO NEW ENVELOPE ROWS LAND WITHOUT DISTURBING THE PINNED SET OR THE PUBLIC BOUNDARY, AND
      EVERY PRICED ROW DECLARES ITS PROVENANCE. Both new rows carry an assessment verdict and
      in_pinned_candidate_set: false so a later reader can tell assessed-but-unpinned from pinned
      (CD.44 GOV-2); the four pinned rows survive and declare in_pinned_candidate_set true; all
      nine priced rows declare a recognised class (the seven-row backfill included);
      long_running_container declares a utilisation_basis separating its Price-List rate provenance
      from its operator-estimate utilisation; and no ARN literal reaches cost_projection.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_new_envelope_rows_declare_set_membership_and_verdicts -q
    expected: 1 passed -- both new rows present with verdicts and set membership, all nine priced rows classed, utilisation_basis present, no ARN literal.
    fix_if: >-
      A missing row, a missing in_pinned_candidate_set declaration on either side of the partition,
      a priced row without a provenance_class (the backfill was skipped), a missing
      utilisation_basis, a dropped pinned row, or an arn:aws: literal. Name the integration
      codebuild:startBuild.sync without the prefix.
    hermetic: false
    graduation: graduate
    graduation_check_id: substrate-rows-declare-set-membership
  - step: 4
    phase: pre-deploy
    action: >-
      THE AMENDED PROVENANCE GUARD IS A CLOSED ENUMERATION, NON-VACUOUS PER CLASS. Decision 165's
      category error is admitting a second class by relaxing into "some non-empty rate_basis
      exists". Fault-inject PER CLASS in both directions -- every class must reject a wrong needle
      AND a wrong date, an unrecognised class and a class-less row must be rejected, and a
      well-formed row of each class must be accepted -- so a class declared with an empty or
      generic needle cannot slip through by riding on a sibling class's decoy.
    command: |-
      bin/venv-python -m pytest "tests/esb_text_fix/test_cost_projection.py::test_every_cost_line_names_region_and_rate_basis" "tests/esb_text_fix/test_cost_projection.py::test_priced_row_provenance_fault_injection_per_class" -q
    expected: All selected provenance/priced-row cases pass, including one wrong-needle and one wrong-date rejection per declared class.
    fix_if: >-
      Any decoy accepted means the guard is vacuous for that class -- tighten it rather than
      shipping. Any well-formed row rejected means the class spec disagrees with the rows the plan
      actually writes; reconcile the spec, never loosen it to whatever the row happens to say.
    hermetic: false
    graduation: graduate
    graduation_check_id: priced-row-provenance-closed-enumeration
  - step: 5
    phase: pre-deploy
    action: >-
      THE NON-DISCRIMINATION CONCLUSION NARROWS RATHER THAN INVERTS, AND ITS DELTA CLAUSE STILL
      COMPUTES. The prior conclusion justified non-discrimination on envelope deltas <= approx
      $10-15/month. Widening the container band makes the CROSS-scale-point spread $19, which does
      not refute the claim but does refute the clause as literally written -- so the clause is
      restated per-scale-point and the arithmetic is asserted numerically, not by keyword.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_non_discrimination_conclusion_narrowed_and_deltas_reconcile -q
    expected: 1 passed -- the maxima parsed from the clause (4.0 at the band low, 12.0 at the band high) equal the maxima computed from the pinned bands.
    fix_if: >-
      A conclusion naming only the elimination reads as a partial selection and breaches CD.44
      discipline point 1 -- restore the surviving pinned-set claim. An inequality means the clause
      publishes a figure the bands no longer produce: fix the clause to match the bands, never
      relax the assertion to a ceiling that both would pass.
    hermetic: false
    graduation: graduate
    graduation_check_id: non-discrimination-conclusion-narrowed
  - step: 6
    phase: pre-deploy
    action: >-
      T4.15 c9 -- THE SUBSTRATE-NEUTRAL VERIFICATION SPLIT, WITH ITS AUTHORITY, ITS REVERSAL
      CONDITION AND ITS NON-REHOMING ALL NAMED. The criterion must bind across every arm, exclude
      verification wall-clock from the per-arm measurements, cite Decision 163 CLAUSE 3 specifically
      (the whole resolution rests on that clause, not on the Decision generally), carry Decision
      112's reversal condition so the carry-forward is conscious (Decision 75), state that BOTH
      T4.9 c1 and the LIVE T4.9a c1 are not rehomed (Decision 136), and express the boundary as
      workflow-run separation so it does not go vacuous on the arm whose substrate IS GitHub
      Actions.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_t415_c9_verification_split -q
    expected: 1 passed.
    fix_if: >-
      A missing clause-3 citation, a missing T4.9a reference, or an in-substrate phrasing that
      collapses on the hosted arm. Do not satisfy this by editing T4.9 or T4.9a -- both are out of
      scope; the re-grounding of their own c1 text is filed as a rec instead.
    hermetic: false
    graduation: graduate
    graduation_check_id: t415-c9-verification-split-encoded
  - step: 7
    phase: pre-deploy
    action: >-
      T4.15 c10 -- THE GITHUB ToS PREDICATE, WITH THE BINDING CLAUSE IDENTIFIED. Clause 5 is
      satisfied and clause 4 is the constraint; a record that names only the satisfied clause has
      recorded the easy half. The retrieval date, the measured burden posture and the BUSL-1.1
      note all have to survive.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_t415_c10_github_tos_predicate -q
    expected: 1 passed.
    fix_if: >-
      A missing clause-4 identification is the substantive failure -- clause 5 alone understates
      the predicate the spike must discharge.
    hermetic: false
    graduation: graduate
    graduation_check_id: t415-c10-tos-predicate-encoded
  - step: 8
    phase: pre-deploy
    action: >-
      THE TRIGGER ROWS ARE EXTENDED IN PLACE, NOT DUPLICATED. A standing guard pins the count at
      exactly four. All THREE ToS re-evaluation triggers named by c10 -- the A2+ concurrency raise,
      the repo-visibility flip and order-of-magnitude rec growth -- must each land on the existing
      row that already carries that event, so no row is added and no event fires twice.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/test_substrate_evidence_fold.py::test_reevaluation_triggers_extended_in_place -q
    expected: 1 passed -- 4 rows, three of them naming the ToS predicate.
    fix_if: >-
      A count other than 4 means rows were added instead of extended. Revert to in-place edits.
    hermetic: false
    graduation: graduate
    graduation_check_id: substrate-reevaluation-triggers-extended
  - step: 9
    phase: pre-deploy
    action: >-
      BUNDLED rec-2946 IS DISCHARGED ON BOTH SURFACES. The guard must derive tx_per_rec and rate
      from the roadmap line's own stated assumptions, so that changing the stated assumption
      changes what the guard expects. Proven by feeding the parser a MUTATED line -- a guard that
      still returns 30 and 0.000025 for a line stating 40 is still hardcoded -- and by asserting
      the graduated registry check_spec no longer carries the literals.
    command: |-
      bin/venv-python -m pytest "tests/esb_text_fix/test_cost_projection.py::test_sfn_transition_line_recomputes_exactly" "tests/esb_text_fix/test_cost_projection.py::test_sfn_assumptions_follow_the_stated_line" -q && ! grep -q "tx_per_rec, rate = 30, 0.000025" tests/esb_text_fix/test_cost_projection.py && echo "OK rec-2946 acceptance grep satisfied"
    expected: All SFN cases pass, then "OK rec-2946 acceptance grep satisfied".
    fix_if: >-
      A parser that ignores the mutation is still hardcoded. A registry check_spec still carrying
      the literals leaves the rec half-open -- fix both or do not claim the rec. The trailing grep
      is rec-2946's OWN acceptance string, negated as the rec states it: if that exact literal
      survives anywhere in the file -- including as an expected tuple in a non-mutated case --
      rec-autoclose.yml will fail to close the rec on merge even though the logic is fixed.
    hermetic: false
    graduation: graduate
    graduation_check_id: sfn-assumptions-parsed-not-hardcoded
  - step: 10
    phase: pre-deploy
    action: >-
      THE WHOLE ESB GUARD PACKAGE IS GREEN, THE EIGHT NEW REGISTRY ROWS RESOLVE TO REAL NODE IDS,
      AND THE LINE CEILING SURVIVES -- re-measured rather than quoted. Baseline at authoring time,
      measured for THIS command's scope rather than for one module: 69 passed across
      tests/esb_text_fix/, and 8,995 roadmap lines. A test_selector row pointing at a node id that does not exist is
      a guard that can never fail, which is the vacuous-pass shape Decision 170 names.
    command: |-
      bin/venv-python -m pytest tests/esb_text_fix/ -q && bin/venv-python -c "import pathlib,subprocess,yaml; ids=[e['check_spec']['node_id'] for e in yaml.safe_load(open('config/agent/verification_registry/registry.yaml'))['entries'] if e.get('plan_slug')=='executor-substrate-evidence-fold' and e.get('primitive_slot')=='test_selector']; assert len(ids)>=8, 'expected at least 8 graduated test_selector rows for this plan, found %d'%(len(ids),); r=subprocess.run(['bin/venv-python','-m','pytest','--collect-only','-q']+ids, capture_output=True, text=True); assert r.returncode==0, 'a graduated node id does not resolve:\n'+r.stdout[-1500:]; n=len(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8').splitlines()); assert n <= 10000, 'roadmap is %d lines, over the Decision 114 ceiling'%(n,); print('OK %d graduated node ids resolve; roadmap %d lines, %d of headroom'%(len(ids), n, 10000-n))"
    expected: All esb_text_fix tests pass, then "OK 8 graduated node ids resolve; roadmap N lines, M of headroom".
    fix_if: >-
      A red sibling guard means this wave broke a neighbouring ESB assertion. An unresolvable node
      id means a registry row was minted against a test that does not exist. A breached ceiling
      escalates per Decision 147's reversal condition rather than being trimmed ad hoc.
    hermetic: false
    graduation: not-applicable

test_obligations:
  - source: tests/esb_text_fix/test_cost_projection.py
    behavior: >-
      The priced-row provenance guard is a closed enumeration -- an unrecognised or absent
      provenance_class is rejected, and each declared class independently enforces its own needle,
      retrieval date and region rule against per-class fault injection.
    verification_step: 4
    test_selector: tests/esb_text_fix/test_cost_projection.py::test_every_cost_line_names_region_and_rate_basis
    red_green_expectation: >-
      Red before, green after. On the pre-change guard the two new rows fail the hardcoded
      "AWS Price List bulk offer files" / "2026-08-01" needle pair, and agentcore additionally
      fails region == eu-west-2 because its published rates are region-unqualified; after the
      amendment both pass through their declared provenance classes while every per-class decoy is
      still rejected.
  - source: tests/esb_text_fix/test_cost_projection.py
    behavior: >-
      The SFN transition guard derives tx_per_rec and the per-transition rate from the roadmap line
      it checks, so a line stating a different assumption yields a correspondingly different
      expectation (bundled rec-2946).
    verification_step: 9
    test_selector: tests/esb_text_fix/test_cost_projection.py::test_sfn_transition_line_recomputes_exactly
    red_green_expectation: >-
      Red before, green after on the mutation probe: the pre-change guard returns 30 and 0.000025
      regardless of what the line says, so a line stating 40 transitions/rec still yields the
      30-based expectation; after the change the parsed value follows the text.
  - source: tests/esb_text_fix/test_substrate_evidence_fold.py
    behavior: >-
      Every content delta this wave writes into the roadmap -- the operator estimates, the two
      assessed rows and their set-membership declarations, the narrowed conclusion and its
      per-scale-point delta arithmetic, T4.15 c9 and c10, and the in-place trigger extension --
      stays asserted as a standing regression guard rather than a one-shot implementation check.
    verification_step: 10
    test_selector: tests/esb_text_fix/test_substrate_evidence_fold.py
    red_green_expectation: >-
      Red before, green after. The module does not exist on origin/main, so every case fails to
      collect; after implementation all six pass against the edited roadmap. Each case additionally
      fails on the unedited roadmap, which is the red half the graduated registry rows preserve.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Schema-valid and acyclic within the Decision 114 ceiling, with criterion-status integrity
      maintained on the touched tier_item.
    verification_step: 1
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The roadmap is DATA, not behaviour, and its schema, dependency graph, criterion-status
