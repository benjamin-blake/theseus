constraints:
  - >-
    THIS PLAN SELECTS NO SUBSTRATE. CD.44 discipline point 1: selection is T4.15's act. Do not
    touch CD.27's incumbent, CD.43's TBD_at_CD.43_ratification marker, or CD.44's candidate state.
  - >-
    Do NOT record any elimination of a PINNED candidate. The two rows this plan eliminates
    (codebuild-class, agentcore-class) were never members of CD.27's pinned five, which is the only
    reason recording them is not a selection. Per-invocation duration-ceiling evidence was
    deliberately EXCLUDED from this wave at the operator's direction -- the estimates derive from
    interactive sessions and are not a basis for ruling out lambda-class arms.
  - >-
    The pinned rows may be edited ONLY to add provenance_class, to add in_pinned_candidate_set:
    true, and -- for long_running_container alone -- to widen the envelope band and add its
    utilisation_basis. No pinned row's rate_basis, region, or underlying rate figure changes; the
    2026-08-01 AWS Price List basis stays intact on all of them. Membership is declared on BOTH
    sides of the partition rather than inferred from absence of the flag, so a future row added
    without it fails the guard instead of being silently counted as pinned.
  - >-
    CD.44 discipline point 2 / ESB-05: candidate-specific mechanism and evidence live in
    cost_projection only. Deliverables 3 and 4 are substrate-neutral by construction -- c9 and c10
    bind every arm identically -- which is what makes them admissible in a lifecycle-tracked field.
  - >-
    Decision 101 public-repo boundary: no AWS account ids, no ARNs, no ExternalIds, no internal
    hostnames. All figures here are public rates, durations and published pricing. The
    arn:aws:states ARN form is NOT written -- name the integration codebuild:startBuild.sync.
  - >-
    Decision 110 / Decision 147: ROADMAP-PLATFORM.yaml is structured data, not narrative. Use the
    compact flow-mapping style of audits/private-repo-self-hosted-ci-9a545d2.yaml's assumed_inputs;
    hold each why to one line (200-char cap, asserted) and each new substrate note to a bounded
    record (1500-char cap, asserted), routing extended derivation to the PR body.
  - >-
    Decision 165: the guard amendment must not degrade to existence-only. The new provenance
    classes are admitted as a CLOSED ENUMERATION, each with its own mandatory needle, retrieval
    date and region rule, fault-injected PER CLASS, never as a per-row opt-out. The region rule is
    a property of the class, which is why the published-pricing-page provenance needs TWO classes
    rather than one: a single class cannot carry both codebuild's eu-west-2 requirement and
    agentcore's region-unqualified waiver. A class that waives eu-west-2 requires a substantive
    caveat, not merely a non-empty string.
  - >-
    Decision 136: new exit criteria are {id, text, status} objects, never bare strings --
    validate_platform_roadmap fails a diff-touched item retaining bare-string criteria.
  - >-
    The substrate_reevaluation_triggers row COUNT stays exactly 4 -- extend text, never add rows.
  - >-
    Decision 114 / Decision 147: the roadmap stays under 10,000 lines. A breach escalates rather
    than being trimmed ad hoc.
  - >-
    Decision 55: no rescue agents or workaround loops. A failing verification step is diagnosed and
    fixed, never routed around; out-of-scope defects become recommendations, not inline fixes.
  - Only the four files in Scope may be modified.

