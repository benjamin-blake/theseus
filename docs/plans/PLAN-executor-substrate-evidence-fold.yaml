execution_steps:
  - >-
    docs/ROADMAP-PLATFORM.yaml -- add cost_projection.operator_estimates as a SIBLING of
    executor_substrate_billing, shaped {source: <label>, entries: [...]}. The source label reads:
    "operator estimate, 2026-08-21 session; judgment from interactive /plan + /implement
    observation, NOT measurement; automated-executor tasks expected simpler than interactive
    sessions". Nine entries in compact flow-mapping style, one line per why and per sensitivity --
    OE-01 persona wall-clock (plan_agent first draft <=20 min, plan_critic ~6, decision_scout ~4,
    revision cycles ~10+6, simple rec ~10 all-planning-included; sensitivity HIGH, dominant cost
    term everywhere); OE-02 convergence cycles (avg 2 plan-critique cycles, worst observed 5
    interactively, non-convergence worst case ~1.5 h of planning wall-clock); OE-03 implement_agent
    (5-30 min of edit time ONCE verification and validation are excluded per c9; interactively
    those add ~30 min verification plus ~30 min full validate.py); OE-04 code_reviewer (5 min avg /
    10 max, critical+high fix incorporation <=5 min, medium/low rec filing ~1 min); OE-05 CPU duty
    (thinking-dominated and LLM-blocked, plan_agent ~5 of 30 min on tools, plan_critic the highest
    tool share, decision_scout minimal, blended planning-time duty ~20 percent; sensitivity decides
    agentcore-versus-Fargate ordering only at a ~42 percent break-even, not the headline); OE-06
    memory (2 GB per persona assumed, 4 GB safe ceiling, CC-web interactive container 16 GB / 4
    vCPU at ~0.6 GB observed idle, pytest the driver and full-suite runs excluded); OE-07 composed
    per-rec billed persona time (typical ~72 min, simple ~21, bad ~140 at 5 cycles and 30 min
    implement; composition rule -- billed time is the SUM of persona invocations because
    waitForTaskToken states are non-billed, so convergence loops multiply invocations rather than
    idle); OE-08 throughput (60 recs/month initial at 2/day supervised, 300/month the scale case,
    rec-level concurrency stays 1, persona-level concurrency up to 5); OE-09 failure and re-run rate
    (rare once a session is established, clustered at connection setup, DeepSeek personas assumed
    less reliable than interactive Claude, drives checkpoint frequency). Keep every why at or under
    200 characters.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- BACKFILL provenance_class onto the seven incumbent priced rows
    the amended guard scans, so none relies on a default: the four
    per_substrate_envelope_usd_per_month rows (durable_functions, sfn_over_stateless_workers,
    self_checkpointed_lambda_dynamodb, long_running_container) and the three
    durable_execution_corrected_rates rows (per_operation_usd, data_written_usd_per_gb,
    retention_usd_per_gb_month). All seven take the AWS-Price-List class, which is exactly what
    their existing rate_basis strings already assert. Additionally add in_pinned_candidate_set:
    true to the FOUR envelope rows (not to the three corrected-rate rows, which are rate lines and
    not candidates), so pinned membership is declared rather than inferred from the flag's absence.
    Change nothing else on any of them.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- add aws_native_codebuild_runner to
    executor_substrate_billing.per_substrate_envelope_usd_per_month with envelope "~108",
    assessment "ASSESSED, ELIMINATED at current shape", in_pinned_candidate_set: false,
    provenance_class naming the REGIONAL published-pricing-page class, region eu-west-2, and a
    rate_basis carrying that class's needle and the 2026-08-21 retrieval date. The note records: best orchestration integration in the
    set (the optimized Step Functions codebuild:startBuild.sync integration returns the full Build
    object -- status, phases, resolvedSourceVersion, log group -- with a StopBuild kill switch, a
    36 h timeout ceiling, 64-128 GB disk, custom ECR images to 50 GB, private-by-default logs);
    eliminated on price plus region plus quota, NOT on integration -- eu-west-2 on-demand bills
    full wall-clock per-minute rounded up with no idle discount (general1.small 0.005 usd/min =
    0.30 usd/h, ~2.6x the EQUIVALENTLY-SIZED 2vCPU/4GB Fargate shape, which the note must name
    because against 1vCPU/2GB the ratio is 5.3x), BOTH escape hatches (Lambda compute per-second,
    reserved fleets) are absent from eu-west-2, and the concurrent-build quota is
    self-contradictory in AWS's own docs (table says 1 per compute type, prose says the default is
    20 for some platforms) exactly where OE-08's 5-wide scout swarms sit. Add an if-ever-revisited
    line: eu-west-1 restores both escape hatches (the region trade was rejected for data-lake and
    Neon co-location in London), and StartBuild's
    buildspecOverride/serviceRoleOverride/imageOverride are a lateral-movement surface AWS itself
    flags, needing condition keys. Keep the note at or under 1500 characters. WRITE NO arn:aws:
    LITERAL ANYWHERE.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- add agentcore_managed_runtime to the same table with envelope
    "~13", assessment "ASSESSED, VIABLE BUT UNJUSTIFIED at current scale", in_pinned_candidate_set:
    false, provenance_class naming the REGION-UNQUALIFIED published-pricing-page class -- a
    DIFFERENT class from codebuild's, because the region rule belongs to the class and these two
    rows need opposite rules -- region not_region_qualified plus a substantive region_caveat naming
    the service and stating that AWS publishes no eu-west-2 price list for it while runtime
    microVMs are GA in eu-west-2, and a rate_basis carrying that class's needle and the 2026-08-21
    retrieval date. The note records: the billing property is REAL and verified for CPU (the pricing
    page states I/O wait and idle time is free if no other background process is running, and AWS's
    own worked example arithmetically confirms the exclusion) at 0.0895 usd/vCPU-h + 0.00945
    usd/GB-h; a CAVEAT that memory appears billed on wall-clock INCLUDING waits (the
    peak-memory-consumed-up-to-that-second formula, and reverse-engineering AWS's example only
    reconciles on full session seconds) recorded explicitly as a HYPOTHESIS needing AWS
    confirmation before any cost model relies on it; model-agnostic confirmed (any foundation model
    in or outside Amazon Bedrock, so no dec-122/CD.28 conflict); and elimination at current scale
    by STRUCTURE not billing -- a 2 GB image cap, 1 GB session storage and 750 MB zip, none
    adjustable, cannot hold the 5.4 GB dependency env, and the only escape (EFS / S3 Files) forces
    VPC mode, hence no internet by default, hence a NAT gateway for provider egress plus
    site-packages over NFS; ARM64 containers mandatory; personas restructured as HTTP servers with
    a non-blocking ping heartbeat against a 15-min idle kill; session storage wiped on every
    runtime version update; and no .sync Step Functions integration (the optimized integration
    wraps InvokeHarness only and is Bedrock-Converse-shaped, so SDK integration plus
    waitForTaskToken is required). At OE-05 duty the advantage over Fargate is ~7 usd/month at 300
    recs, which does not buy the rebuild. Record Q2's async-mode generalization as PARTIALLY
    FALSIFIED: the no-CPU-during-wait mechanism exists in-region, but the ~1.9x Fargate vCPU rate
    premium eats most of it below the ~42 percent duty break-even. Keep the note at or under 1500
    characters.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- widen long_running_container's envelope from "~5" to the band
    "5-20", extending its existing note to name both endpoints (~1 task-hour/rec at 100 recs/month
    on the 2026-08-01 Price List basis; 1.2 task-hours/rec at 300 recs/month from OE-07/OE-08).
    Leave its region and rate_basis untouched, but ADD a utilisation_basis field recording that the
    RATE remains Price-List-provenanced at 2026-08-01 while the UTILISATION producing the band high
    is an operator estimate (OE-07/OE-08, 2026-08-21, explicitly not measurement) -- without it the
    row's provenance_class would read the whole row as Price-List-provenanced, which is the
    existence-only provenance claim this wave exists to stop. Then narrow
    non_discrimination_conclusion in place: economics now discriminate AGAINST the codebuild-class
    candidate only; CD.27's pinned five are unchanged and remain economically indistinguishable AT
    ANY FIXED SCALE POINT; and RESTATE the delta clause per-scale-point rather than as a bare
    range, because comparing one row's band low to another's band high is a cross-scale-point
    artifact. The restatement must CITE executor_substrate_billing.provenance's block-level
    "recorded scale 100-300 recs/month" as what licenses reading a band low as the 100-rec point
    and a band high as the 300-rec point -- the per-row notes do not all index on recs
    (durable_functions brackets on ops/rec, sfn_over_stateless_workers on iterations), so without
