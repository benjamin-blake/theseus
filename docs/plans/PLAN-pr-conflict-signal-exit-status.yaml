execution_steps:
  - >-
    Create scripts/ci/pr_conflict_signal.sh -- move the existing body verbatim, then apply the fix:
    a shared bounded-retry helper used by the mergeable poll, the comments read and the comment
    post; explicit exit-status capture and branching on every gh call; a per-PR failure path that
    marks, counts and continues; a $GITHUB_STEP_SUMMARY marker helper; a final non-zero exit when
    the failure count is greater than zero; and set +e near the top as documented defence-in-depth
    against re-inlining (not as the load-bearing fix -- see constraint 3). Preserve the
    UNKNOWN-never-false-wakes and head-SHA idempotency invariants exactly.
  - >-
    Modify .github/workflows/pr-conflict-signal.yml -- add actions/checkout@v7 as the first step,
    reduce the poll step body to the single delegation line, keep the step name and
    continue-on-error true unchanged, and update the header comment to point at the script.
  - >-
    Create tests/test_pr_conflict_signal_wiring.py -- a gh shim on PATH driven by env vars; an
    argv-fidelity case proving each harness delivers the errexit state it claims; then sweep
    continuation past a gh failure, retry-on-failed-call, UNKNOWN-no-false-wake, head-SHA
    idempotency, comments-read-failure still posting, marker emission, and the non-zero exit on a
    counted failure -- each parameterised over BOTH argvs. Add TestRealWorkflowBodyWiring, which
    parses the YAML and EXECUTES its actual run body (not a substring assertion), using the exact
    node ids named in VP steps 2 and 3.
  - >-
    Modify scripts/checks/ci_guards/validate_pr_conflict_signal.py -- resolve the delegate script
    from the step body and run the five semantic assertions against its contents; add assertions for
    delegate existence, checkout-precedes-delegation, errexit clearing, and every gh call site
    handling its exit status. Keep the check name and both registry registrations untouched
    (Decision 104).
  - >-
    Modify tests/checks/ci_guards/test_validate_pr_conflict_signal.py -- update the mocked pass-path
    fixture to the delegation shape and add a fail-path case per new assertion, named so the VP4
    -k filter selects them.
  - >-
    Create scripts/checks/ci_guards/validate_masked_errexit_steps.py -- filesystem-only walk of
    .github/workflows/*.yml and *.yaml; flag any step with continue-on-error true whose INLINE body
    inherits errexit and holds an unguarded command substitution. Expose scanned_workflow_files()
    as the SINGLE SOURCE of the guard's file set -- validate_masked_errexit_steps() must iterate
    exactly what that function returns and never its own private glob, or VP7's equality assertion
    is circular. Prefer delegating that walk to the existing _workflow_shell_bodies._iter_workflows()
    rather than minting a second walker. Reuse that module's shell-governance helpers
    (_is_governed_shell, _default_shell) for shell resolution ONLY -- it is workflows-only by its own
    docstring, which matches this guard's deliberate scope; do not attempt to reuse it as a
    composite-action walker. Join backslash continuations before testing an assignment for a guard,
    and treat an absent set line as errexit-inheriting. Record the delegated-script and
    composite-action boundary in the module docstring, citing follow-on rec (a) as the mechanism
    that covers delegates.
  - >-
    Create tests/checks/ci_guards/test_validate_masked_errexit_steps.py -- FIRST write the
    discrimination pair that pins the positional rule: a byte-literal copy of the PRE-fix ci-rca
    CATEGORIES block (ci-rca.yml lines 300-305) asserted to FIRE, and a byte-literal copy of the
    POST-fix block asserted NOT to fire. Then the simple single-line violator, then negatives drawn
    from the REAL near-misses in the tree and a loud step with no continue-on-error. Copy every
    fixture BYTE-FOR-BYTE from the live workflow, including ci-rca.yml's ARTIFACT_ID guard on its
    backslash-continuation line; do NOT paraphrase any of them into single-line equivalents, because
    a per-line detector passes the paraphrase and then fires on the real tree. Also add the
    cheap wiring test: monkeypatch scanned_workflow_files() to a single-file list and assert the
    validate leg honours it, closing the gap between the reported and iterated file sets.
  - >-
    Modify .github/workflows/ci-rca.yml -- append `|| CATEGORIES=""` to the closing line of the
    CATEGORIES assignment (line 304), matching the fail-closed CATEGORIES="" pre-write on line 300.
    Keep the edit LINE-NEUTRAL so the r3_workflows ceiling of 44 for this body is untouched. Change
    nothing else in this workflow.
  - >-
    Modify scripts/checks/registry.py -- add the new check to both pre_sequence() and full_sequence(),
    adjacent to validate_pr_conflict_signal at lines 162 and 204.
  - >-
    Modify scripts/validate.py -- add the single-line re-export next to the existing line-77 import.
  - >-
    Modify config/ci_rca_taxonomy.yaml -- add `validate_masked_errexit_steps: environment` to
    function_to_category. `environment` is the established value for every workflow/composite
    ci_guard sibling (validate_ci_workflow_guards, validate_composite_action_shell_bodies,
    validate_pr_conflict_signal). Do this in the SAME commit as the registry.py registration: the
    two are atomically coupled, because a registered-but-unmapped check reds the fast tier.
  - >-
    Modify config/composite_action_body_baseline.yaml -- lower the r3_workflows ceiling for this body
    from 36 to the measured post-extraction count, with no raise-approved marker.
  - >-
    Modify config/agent/verification_registry/registry.yaml -- add one row per graduate-disposition
    VP step (steps 1, 2, 3, 4, 6, 7, 8), using each step's graduation_check_id verbatim as the row
    identity. Every row MUST also carry `plan_slug: pr-conflict-signal-exit-status` --
    validate_graduation_completeness's implement-PR leg matches on the (check_id, plan_slug) PAIR,
