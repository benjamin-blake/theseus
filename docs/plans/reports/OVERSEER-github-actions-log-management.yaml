    expiry and recovery semantics.
  plan_critique:
    round_1: 'REVISE - derive the complete governed and agent-consumed inventory from deploy-path and CI-RCA authorities; enforce selector
      equality and composite delegation; map decisive surfaces to reachable failure emitters; explicitly link S1 producer/consumer;
      add confidentiality mutations; reconcile pre/post-commit validation sequencing; and verify live retention through the Actions
