    round_2: 'REVISE - enumerate exact governed workflow/job/composite selection, add every possibly aligned surface to plan scope,
      define executable display-name/path/job/local-uses derivation and bounded exclusions, and make stale/missing selector equality
      testable against structured owners rather than narrative deploy-path prose.'
    round_3: PROCEED - independent critique found no Critical, High, Medium, or Low findings; inventory authority, scope, diagnostic
      reachability, S1 linkage, retention semantics, verification sequencing, live evidence, rollback, and degraded behavior are implementation-ready.
  implementation: bfc8d17
