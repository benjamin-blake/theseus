  - Authoritative validator is registered in pre and full tiers and checks selected diagnostic surfaces, S1 linkage, confidentiality-safe identifiers, exact upload classification, and retention bounds.
  - Hermetic counterfactual and focused tests cover fail-closed contract mutations, current one-day and fourteen-day uploads, and available-versus-expired evidence states.
