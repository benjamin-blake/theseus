  - GAL-02
  - GAL-04
  status: merged
  plan_path: docs/plans/PLAN-actions-diagnostic-governance.yaml
  depends_on:
  - bounded-ci-rca-evidence
  current_evidence:
  - Wave 1 merged at 63868b5 and provides the bounded ci-rca-log-evidence/v1 envelope consumed by this slice.
  - 'Four actions/upload-artifact call sites exist: ci.yml selection-manifest and pytest-junit at fourteen days, main-canary.yml pytest-junit
    at fourteen days, and reconcile.yml reconcile-fresh-plan at one day.'
