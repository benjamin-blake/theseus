autonomous_decision_log:
- timestamp: '2026-07-29'
  decision: Use three serial slices in keystone-first order and permit no overlapping editors.
  rationale: The operator approved the slice graph and merge order; serial execution avoids overlap in ci-rca.yml, workflow validators,
    tests, and verification-registry entries.
- timestamp: '2026-07-29'
  decision: Treat literal post-commit validation results as the only readiness evidence and block push, PR, and finding closure on any nonzero authoritative validator exit.
  rationale: 'Wave 1 accumulated verification mistakes that must not recur: the plan named the removed tests/test_ci_rca_evidence.py;
    validate --pre ran before the feat commit and therefore no-op''d the implementation VP replay; --pre was not rerun after commit;
    literal plan step 3 and full-validation step 6 were not executed before readiness was claimed; test and PR evidence inaccurately
    claimed commands had passed; the aggregate 74.71% result and 37% pytest threshold were misread as the failure while the changed-source
    100%-per-file gate was ignored; and thousands of passing tests were treated as success despite validator exit 1. Going forward,
    execute the plan''s literal commands against the committed tree, report only captured command evidence, distinguish aggregate coverage
    from changed-source coverage, and stop the lifecycle whenever an authoritative validation command exits nonzero.'
- timestamp: '2026-07-29'
  decision: Enumerate fast-tier test modules in hermetic VP commands when a test package contains an explicitly full-tier module.
  rationale: Directory-level pytest selection imports every matching module during collection before marker-based deferral can protect
    the fast environment. Step 3 selected tests/ci_rca/evidence and therefore imported test_live_s3.py, whose deliberate boto3 heavy-dependency
    marker cannot run when boto3 is absent from requirements-fast. Hermetic fast VP commands must enumerate the collectable non-live modules,
    exclude only the explicitly full-tier live module, and carry a regression assertion that rejects directory-level selection or a
    boto3 requirement in the fast tier.
