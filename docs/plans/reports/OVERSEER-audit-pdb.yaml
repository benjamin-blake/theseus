    false PASS -- the closing session''s reported ''--pre exit 0'' on a tree where --pre in fact failed. Every false
    FAIL was caught by re-checking before recording; the false PASS was caught only by CI.'
  question: is a closeout probe worth writing at all, given that rate? The alternative is to assert nothing beyond
    what a standing check already asserts, and record the rest as unobserved. That is more honest but leaves the
    audit's own acceptance clauses unrun.
  why_not_decided: this is a judgement about how much evidence a completion claim owes, which is the human's to
    make. The run's own answer was to keep the probe but re-check every FAIL before recording it, and to record
    NOT-OBSERVABLE rather than infer a PASS -- four of the twenty acceptance clauses came out that way.
