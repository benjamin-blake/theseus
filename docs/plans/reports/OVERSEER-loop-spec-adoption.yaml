    half: design soundness
    gate_run_id: sensor-liveness-plan-critique-r1a-a9158f6e
    id_echo: MATCHED
    verdict: REVISE
    survives: 'The load-bearing asymmetric open/resolved key SURVIVES the attack: it stops permanent muting; it excludes Decision
      142 rec-2644 STRUCTURALLY (the resolved sweep runs only when there is no open match, and drop performs no portal write,
      so a resolved rec cannot be flipped open); and its log2 termination arithmetic is exact (~11 recs/yr hourly, 4/yr monthly).
      Cron matcher sound: 9 live peers reduce to exactly 4 shapes, all covered. Peer derivation genuinely run-time.'
    blocking:
      DEFECT_3: 'MAX_RESOLVED_LOOKUPS = len(peers)+1 is sized against the wrong quantity AND THE DESIGN MANUFACTURES THE OVERFLOW.
        The precedent budget_ingest is safe because its key (branch) is EPHEMERAL; loop is a PERMANENT workflow identity,
        so resolved recs accumulate forever at the ~11/yr rate the log2 design deliberately produces. Cap 10 is exceeded by
        one loop second year, or one loop flapping a dozen times. Plan specifies RAISE above cap -> from that tick the leg
        raises every stale tick and files NOTHING, FOREVER. convergence-health is not_a_gate/ci_rca:excluded so the red is
        SILENT. A sensor that silently stops sensing after ~a year -- LSA-02 recreated TWO levels up, the exact stale-green
        shape the plan cites Decision 172 for. Compounding: recs_by_title_prefix returns only id/title/status/source, so narrowing
        can never reach (anchor,bucket) pre-fetch, and the plan never pins what the title contains.'
      DEFECT_5: require_non_empty=False is the DEFAULT -- fail-loud is opt-in. Acceptance criterion 2 demands an empty peer
        set RAISE, but VP step 1 only proves the guard works when the test passes the flag, and step 2 runs over a known-good
        tree. Nothing asserts the production chain main_sensor_liveness -> detect_stale_loops -> derive_scheduled_peers passes
        require_non_empty=True. An implementer taking the default ships the sensor-reports-healthy-while-watching-nothing
        failure with every VP step green.
      DEFECT_4: 'The 3x-over-2x rationale is NULL exactly where argued: 2x and 3x both clamp to 21600 on hourly peers and
        both clamp to 45d on monthly. It is behaviourally identical on 3 of 9 peers and changes only main-canary and the FIVE
        WEEKLY peers, which lose a week of detection latency for a reason that by the plan own arithmetic cannot apply to
        them. Blocking because acceptance criterion 11 REQUIRES this rationale be written VERBATIM into source_registry.yaml
        signal_interpretation -- an incorrect rationale becomes a governance artifact.'
    sub_blocking:
      DEFECT_1: anchor is run:{id}, so a FLAPPING loop mints a new anchor per recovery run -> new episode -> fresh bucket-1
        rec, up to 4/day sustained on an hourly peer. The log2 bound covers recs per EPISODE; nothing bounds episodes. The
        plan analyses only the permanently-dead case.
      DEFECT_2: 'mute expires by bucket-at-last-update, not bucket-at-closure: a human closes at 03:20 and the 03:37 tick
        files a fresh rec 17 minutes later, at every bucket edge.'
      DEFECT_6: 'majority fleet-collapse (5 of 9) is near-unreachable: stale count is 3 by T+9h and does not reach 5 until
        T+21d when the weekly peers cross. The cited Decision 172 outage (resolved in days) would never have reached it.'
      retention_flip: 'past ~90 days dead all event=schedule runs age out, workflow_runs goes empty, and the anchor flips
        run:{id} -> intro:{sha} on an unchanged loop: new episode, bucket JUMPS rather than continues.'
      residual_framing: 'the fleet-collapse rule cited incident (Decision 172 OIDC outage) is EXACTLY the case this leg cannot
        observe, because it rides that cron. Self-inclusion is correct but inert as who-watches-the-watcher coverage (a dispatched
        tick needs a human). rec-3640 has dependencies: [] so nothing records that LSA-02 is only fully closed when it lands.
        convergence-health now carries FIVE legs -- concentration increased, not diversified.'
    verified_precedent: budget_ingest.py:537-538 and _decide_action:423-436 read directly; the no-op guard equality and the
      resolved-sweep ordering both confirmed in source.
