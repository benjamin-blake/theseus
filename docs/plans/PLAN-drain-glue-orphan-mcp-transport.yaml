execution_steps:
  - >-
    Create the facade package, moving assert_workflow_invariants / tfstate_has_orphan / derive and gate
    functions behaviour-preserving into _world.py. Correct the tfstate docstring's reversed Decision 119
    premise and state the Decision 120 re-derivation.
  - >-
    Write _github.py: normalize mcp__github__ run, jobs and job-logs payloads to the internal shape;
    extract select_dispatch_candidate and is_terminal as pure functions; add the truncation guard.
    Delete wait_for_terminal's polling loop -- it becomes the re-invokable verify step.
  - >-
    Write _phases.py (gate/correlate/verify per phase, phase_close unchanged) and __main__.py (the
    --phase/--step CLI, the two profile flags with defaults agent_platform and agent_platform_admin, the
    on-disk step-record chain, and next_action emission).
