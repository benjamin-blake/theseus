execution_steps:
  - >-
    Create the facade package, moving assert_workflow_invariants / tfstate_has_orphan / derive and gate
    functions behaviour-preserving into _world.py. Correct the tfstate docstring's reversed Decision 119
    premise and state the Decision 120 re-derivation.
  - >-
    Write _github.py: normalize mcp__github__ run, jobs and job-logs payloads to the internal shape;
    extract select_dispatch_candidate and is_terminal as pure functions; add the truncation guard.
    Delete wait_for_terminal's polling loop -- it becomes the re-invokable verify step.
  - >-
    Write _phases.py (gate/correlate/verify per phase, phase_close unchanged) and __main__.py (the
    --phase/--step CLI, the two profile flags with defaults agent_platform and agent_platform_admin, the
    on-disk step-record chain, and next_action emission).
  - >-
    Capture the four real mcp__github__ payloads from the run ids named in context; redact and bound the
    job-log excerpt via scripts.ci.redaction_check; commit them under tests/fixtures/drain_glue_orphan_payloads/.
  - >-
    Split the test file three ways, delete TestLiveWiring, repoint the source scan at the package, and
    add the payload, CLI, facade, profile-leg and fail-closed-chain suites.
  - Repoint the verification-registry shard (guard_target and node_id) preserving check_id.
  - >-
    Apply the rec-3384 and rec-3385 corrections to PLAN-terraform-state-triggers-restore, replacing
    frozen literals with run-time derivations rather than freshly-computed numbers.
  - Update rec-3381's acceptance via ops_data_portal --update-rec to the non-vacuous VP1 form.
  - >-
    Execute Verification Plan steps 1-12 (pre-deploy) -- run each step, loop until pass; open the PR and
    merge only on green CI.
  - >-
    Execute Verification Plan steps 13-20 in the ADMIN container. Post live evidence to the PR before
    marking any post-deploy row PASS. On an unrecoverable V3 failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, and the VP compliance table with the VF-08 residual and the two superseded rows.'
rollback: >-
  The pre-deploy half (VP 1-12) is an ordinary revert of the branch. The post-deploy half is NOT
  reversible: VP 16 destroys aws_glue_catalog_database.ops in live AWS and spends a single human
  tf-gated-apply approval. If VP 17-18 fail after VP 16 has landed, the orphan is already gone and the
  correct recovery is the human-gated break-glass admin apply of terraform/personal at main tip
  (terraform/CLAUDE.md), never a re-dispatch and never terraform state rm.
