constraints:
  - >-
    Do NOT edit docs/plans/PLAN-glue-delete-database-grant.yaml. Its VP 10-12 are superseded by VP 13-19
    here; record old VP 10 and 11 as FAIL with an RCA pointer in THIS plan's PR-body compliance table.
  - >-
    VF-08's two-consecutive-passes confirmation is STRUCTURALLY UNAVAILABLE for VP 15-18: a destroy that
    spends a single human approval cannot be repeated. Disclose that as a residual in the compliance
    table. Do NOT relabel it as declared Hermeticity.NON_HERMETIC_BY_CONSTRUCTION -- the implement skill
    names that relabel as the anti-pattern, and detected nondeterminism is orthogonal to a verifier's
    declared property.
  - >-
    The remove phase spends exactly ONE human tf-gated-apply approval (Decision 158 route ii -- a destroy
    always guard-BLOCKs). The converge phase should spend NONE (route i, fresh guard-PASS). A second
    approval request means the world moved: stop and re-assess.
  - >-
    No agent-side polling loop, no sleep, no /loop (Decision 76: the container hibernates between turns).
    Every wait in this runbook is a human handoff plus a re-invokable idempotent verify step.
  - >-
    Agents never self-direct a terraform apply (Decision 126). terminal_without_destruction emits
    next_action=escalate_to_operator and never an executable terraform state rm.
  - No rescue agents or workaround loops (Decision 55). Never weaken a check to obtain green (Decision 181).
  - >-
    Do not widen PlatformDev's tfstate grant to simplify the profile split -- the deny is deliberate
    (DEP-13 / Decision 113: both ExternalIds live in tfstate's assume_role_policy trust documents).
