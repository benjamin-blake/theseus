      flags everything nor a floor that flags nothing can pass.
    verification_step: 1
    command: |-
      assert f.red_case_hits(a, 'validate_synth') == [], 'passing-path-only mirror must NOT clear the floor'
    red_green_expectation: >-
      Red before (the module does not exist, so the import fails), green after. The known-bad fixture
      reds specifically and asymmetrically: admitting `assert not failed` or `== []` as a positive
      outcome reds THIS assertion, while dropping the one-hop helper derivation reds the paired
      `len(hits) == 1` assertion on the next line -- each half fails for the opposite reason.
      Additionally covered by
      tests/checks/verification/test_validate_red_case_floor.py::TestFloorOnSyntheticMirror at step 8.
  - source: scripts/checks/verification/validate_red_case_floor.py
