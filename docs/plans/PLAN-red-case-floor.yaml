  - "REC RELEVANCE: no open recommendation is bundled. rec-3677 (selection_budget under-reporting) and rec-3678 (spurious local SLOC failure) are CITED as planning hazards, not bundled -- both are about the measurement harness, not this floor, and bundling either would drag scripts/checks/deps/ and config/sloc_budgets.yaml into a scope that otherwise never touches them."
