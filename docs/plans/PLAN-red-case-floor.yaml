  - "CROSS-SLICE BOUNDARY WITH LSA-01 (severity high, same audit run, sibling slice S3), DECLARED rather than left implicit because the AUDIT'S LITERAL TEXT diverges from this floor even though the two PLANS do not. LSA-01's acceptance reads: 'A synthetic PR flipping one unpinned Entry to pre=False, and one deleting a mirror test, each fail validate --pre without a marker; WITH A DECISION-CITED MARKER BOTH PASS.' This floor makes an Entry whose mirror cannot be resolved FAIL UNCONDITIONALLY, with no marker path, by design (acceptance criterion 5, Decision 55: a missing oracle and a satisfied oracle must not look the same). Read literally, LSA-01's marker arm is unsatisfiable for the mirror-deletion half while the Entry stays registered. THE RESOLUTION RUNS TOWARD THIS FLOOR, NOT AWAY FROM IT, and the matching correction has been sent to the S3 planner: the human-ratified S3 design already gives mirror-test DELETION no marker escape, and retirement is MARK-THEN-DROP across two PRs -- the shape the roadmap already ratifies for this registry at T3.7 exit criterion 4 ('Retirement path is mark-then-drop: flagged checks are marked deprecated in the registry, never auto-deleted; a follow-on plan performs deletion (CD.12 discipline)'). Under mark-then-drop a registered Entry never sits in _ALL_ENTRIES without a mirror, so the two mechanisms never bind the same PR. THE BOUNDARY IN ONE LINE: this floor DETECTS an unresolvable mirror; an LSA-01 marker guard AUTHORIZES a deletion. Authorization is not exemption -- an authorized deletion still reds this floor unless the Entry goes with it, which is exactly what mark-then-drop makes the deleting PR do. DO NOT weaken this floor and DO NOT add a marker path into it to accommodate the audit sentence: the sentence is what is imprecise, not either design. (Recorded for the T3.7 forward-pointer as well: the roadmap's exit_criteria are bare strings with no ids, so 'T3.7:c2' is a POSITIONAL label -- rec-3719 therefore quotes criterion 2's text verbatim so its implementer resolves it without counting list items.)"
