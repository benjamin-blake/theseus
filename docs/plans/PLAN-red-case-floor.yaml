  - "THE MAP FIX CLEARS DECISION 181 POINT 1, WHICH IS THE AUTHORITY THAT GOVERNS ITS SHAPE. Point 1 makes the CONTENT invariant -- no acceptance criterion, VP step, assertion or budget is ever weakened to obtain green, whatever file it lives in -- a standing prohibition on every implementing agent, with its canonical clause at docs/contracts/implement-scope-boundary.yaml's invariants.content. Scope row 4 flips validate_test_coverage from red to green on scripts/checks/hygiene/validate_placement.py inside a plan whose subject is a DIFFERENT check, which is exactly the shape point 1 exists to catch, so the plan owes the argument rather than assuming it. It clears on the invariant's own terms: nothing is weakened. _CONCERN_SPLIT_TEST_PACKAGES is a DECLARATION of where a mirror lives, not a threshold, tolerance or exemption -- the same registration 33 existing entries carry, two of them (validate_graduation_completeness.py, validate_scope_boundary.py) on check modules. After the edit validate_test_coverage asserts strictly MORE about that source than before, because it resolves a real mirror package and can measure it, where today it resolves a path that does not exist. The weakening-shaped alternative is the one this plan REJECTS: teaching the floor a private directory fallback would leave the canonical map still wrong and buy this slice green by narrowing its own oracle. Decision 181 point 3 also names the residual arm -- an assertion or tolerance weakened inside an in-scope file -- as the dominant unenforced form, which is why this is argued in the plan rather than left to validate_scope_boundary's LOCATION leg to notice."
  - "DECISIONS CITED -- the decision-scout's CITE list, applied. 55 (fail loud, no false negatives -- the unresolvable-mirror FAIL branch and the >= 123 lower bound on the examined count), 104 + 169 (the per-domain manifest Entry grammar and the seven registration surfaces; 169 is also why validate_handoff_full_tier dispatches through registry.resolve() rather than a validate.py facade), 128 (decompose, never raise a SLOC budget), 131 (the mirror rule and map_source_to_test as its single owner), 132 + 176 (the graduation shard model and its one-record-per-file grain -- the authority under which all SEVEN shards are sanctioned by derivation), 135 (strictly-additive selection -- why adding pre_globs can only grow the selected set), 148 clause 3 (hermetic-true restored as the default for pre-deploy feature verification -- steps 1-7), 150 clause 1 + 167 clause 2 (the significance bar and its machine-checked routing claim -- the no-mint grounds above), 159 clauses 2 + 3 (an UNBASELINED file keeps 100%, which is the actual authority for the new module's line-coverage obligation, and the tamper guard that makes buying headroom with a baseline entry a governed act -- VP step 8), 168 clauses 2 + 4 (Class D is the class added FOR mechanism content, so 'no contract fits' is not the argument; the evaluator-must-demonstrably-read-the-contract bar and the ratcheted population are what actually settle the no-contract-home case), 170 (the five-outcome accounting channel and the examined()/skipped() obligation on every reachable exit path), 181 points 1 + 3 (the standing CONTENT never-weaken prohibition -- the authority that clears scope row 4's red-to-green flip of a DIFFERENT check inside this plan, and names the residual arm as the dominant unenforced form), 182 clauses 1 + 2 + 4 (the fast tier's two-term budget; this pre=True static check's 0.86s lands in the UNWAIVABLE NON_TEST_BUDGET_SECONDS = 240 half, which governs where VP step 7's ad-hoc 10s bound merely tripwires). CARRIE