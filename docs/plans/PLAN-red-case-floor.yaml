schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: red-case-floor
intent: >-
  Give the registered check fleet the fleet-level detection evidence audit finding LSA-03 says it
  lacks: one cheap, static, --pre-compatible registered check asserting that EVERY Entry in the live
  check registry has a mirror test exercising at least one FAILING path. Decision 170 accounting
  proves a check examined inputs, selection proves it was reachable, and the differential gate proves
  discrimination for the graduated shard population only -- none of the three notices a check whose
  assertion has decayed to tautology while still examining inputs. This closes that hole for the
  fleet as it stands at any moment, derived from the registry, never from a roster.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-red-case-floor.yaml
phase: >-
  Platform hardening -- verifier detection quality. A slice of the loop-spec-adoption overseer run,
  driving audit finding LSA-03 from audits/loop-spec-adoption-4d8bac4a.yaml (P4-amended LEG 1 ONLY).
  Names NO tier_item and adds NO roadmap row (soft-warn exception category ad_hoc_rec), so the Tier
  Item Freshness Gate is skipped; the audit finding is the forward-intent carrier and deferred halves
  ride recs. T3.7 is named by the finding's roadmap_crossref as planned-insufficient, NOT as a
  dependency: the finding's own sequencing note says leg 1 does not wait for T3.7, and its
  execution-grade legs (mutation, fixture replay) stay in T3.7's scheduled alarm lane per CD.12.
scope:
  - file: scripts/checks/verification/validate_red_case_floor.py
    action: Create
    purpose: >-
      The whole floor. Derives the protected population from registry._ALL_ENTRIES at call time
      (never a roster); resolves each Entry's module to its mirror test through the CANONICAL map
      scripts.test_coverage_checker.map_source_to_test (file target or concern-split package
      directory, rglob'd for test_*.py), reached through the MODULE OBJECT at call time and never
      through a `from ... import map_source_to_test` binding -- the documented
      scripts/checks/misc/coverage_baseline.py pattern, and what gives the canonical map exactly one
      interception point so acceptance criterion 6's negative claim is executable at VP step 3.
      AST-scans each mirror for a RED-CASE assertion -- an assert
      whose subject is derived from an invocation of the check under test (a name bound as an
      argument to, or from the return of, a call to Entry.attr, or one hop through a same-file
      non-test helper that itself invokes it) AND whose asserted outcome is POSITIVE (non-empty
      container/tuple/dict literal, non-zero int, True, non-empty string, `X in <derived>`, a
      subscript or attribute access on a derived value, `any(...)` over one), plus a
      `with pytest.raises(...)` whose body invokes the check. Negated and empty-side forms
      (`assert not X`, `== []`, `== {}`, `== ""`, `is None`, `is False`, `len(X) == 0`, `not in`,
      `all(...)`) NEVER count. Appends one `failed` label plus failure_detail() naming each
      non-conforming Entry and its resolved mirror path; an Entry whose mirror cannot be resolved or
      does not exist FAILS (never skips -- Decision 55, a missing oracle and a passing oracle must
      not look the same). Declares examined(len(entries), unit="registered_checks"). Its own module
      because the verification domain's existing modules are unrelated concerns and Decision 128
      decomposes by default.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      One Entry literal appended to ENTRIES -- name/module/attr "validate_red_case_floor",
      pre=True with pre_globs ("scripts/checks/**", "tests/checks/**",
      "scripts/test_coverage_checker.py"), full_segment="full_after_lint" (the segment EIGHT of
      the ten existing verification-domain entries already use -- re-measured at 45d4afb8 over
      scripts/checks/verification/_manifest.py; of the other two, one uses
      full_after_ensure_fresh_dq and one declares no full_segment). Bare string literals only,
      two-field
      module/attr, per docs/contracts/check-manifest.yaml -- no contract edit is owed, the grammar
      is unchanged and validate_check_manifests enforces it as-is.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One `function_to_category` row, `validate_red_case_floor: code_regression`, matching the
      category every sibling verification-domain check already carries (validate_verification_
      registry, validate_verifier_same_pr_guard, validate_verifier_hermeticity,
      validate_hermeticity_flags, validate_graduation_completeness, validate_verification_harness).
      MANDATORY, not optional: validate_ci_rca_taxonomy check 1b fails the PR on any registered
      check absent from this map. No new category, no `failure_categories` edit.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      One string added to the existing _CONCERN_SPLIT_TEST_PACKAGES frozenset:
      "scripts/checks/hygiene/validate_placement.py". Its tests were concern-split into
      tests/checks/hygiene/validate_placement/ (three test modules) at #1037 without registering the
      split, so map_source_to_test still computes the non-existent FILE
      tests/checks/hygiene/test_validate_placement.py and check_test_file_exists returns
      (False, "missing test file") for it TODAY -- a live latent trap that reds validate_test_coverage
      the moment anyone touches that source. This is the floor's precondition, not a drive-by: it is
      the ONE Entry of 123 whose mirror the canonical map cannot resolve, and fixing the map is what
      makes the floor clean on day one with NO grandfather hook. Exactly the registration
      scripts/checks/verification/validate_graduation_completeness.py and validate_scope_boundary.py
      already carry. 471 SLOC today (re-measured at 45d4afb8 with the repo's own counter); +1 line,
      ample headroom under the 500 default (unregistered in config/sloc_budgets.yaml). NOT a second
      resolution rule -- the alternative, teaching the floor its own directory fallback, would be the
      second-surface drift AGENTS.md and the audit's NS6 both forbid. WHAT THIS ROW DOES NOT DISPOSE
      OF, stated because it was MEASURED rather than assumed: the fix does not leave
      validate_placement.py clean, it moves the file from one trap to another. Measured on this branch
      with the one-line registration applied and then reverted -- check_test_file_exists goes
      (False, "missing test file") -> (True, "test package found") exactly as this row claims, but
      check_per_file_coverage goes [] (silently skipped, because the mapped flat file did not exist)
      -> ["scripts/checks/hygiene/validate_placement.py: 98.8% line coverage (expected 100%)"],
      because the file carries no config/coverage_baseline.yaml entry and Decision 159 clause 2 puts
      an unbaselined file at 100%. It does NOT fire on this PR -- the fast tier's coverage leg is
      diff-scoped and validate_placement.py is not in this plan's touched set -- and no verification
      step surfaces it. That residual is PRE-EXISTING and out of scope, so Decision 59 routes it to
      rec-3725 rather than an inline fix here. This row's disposition is "the mirror now resolves",
      not "the file is clean".
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Docstring only. The module docstring's canonical "registering a new check touches SEVEN
      surfaces" enumeration gains, on surface (6), the clause that the mirror test must exercise at
      least one failing path and names validate_red_case_floor as its enforcer. THE CLAUSE MUST ALSO
      DECLARE WHAT THE ENFORCER DOES NOT PROVE. Decision 181 point 2 makes that mandatory for a new
      universal obligation of this shape: publish, per surface, either the check that mechanically
      enforces it or the fact that the surface is an unenforced residual with a named owner. This
      floor proves red-case SHAPE -- that at least one assertion expects a failing outcome -- and
      never EFFICACY, that the fixture is genuinely bad and would red on a broken check; efficacy is
      P4 leg 3 and stays in T3.7's scheduled alarm lane per CD.12. Ship the clause as: the mirror
      test must exercise at least one FAILING path, enforced by `validate_red_case_floor`, which
      proves red-case shape, not efficacy; execution-grade proof is an unenforced residual owned by
      T3.7 (CD.12). Without that second half, surface (6) reads to every future check author as a
      stronger guarantee than the floor actually gives. This is the documentation home that already
      exists -- extending it is what keeps the obligation off a new contract file, a new roster, and
      a new numbered Decision. No behaviour change; 319 SLOC today (re-measured at 45d4afb8).
  - file: tests/checks/verification/test_validate_red_case_floor.py
    action: Create
    purpose: >-
      The floor's own mirror test, and its own known-bad fixture. Carries the meta-fixture the audit
      demands (Q5 seed 6): a synthetic mirror test containing only passing-path assertions that the
      floor MUST flag, and the same file plus one red-case test that MUST clear it; the negated-form
      corpus that must never count as red; the derived-population proof (patch.object(registry,
      "_ALL_ENTRIES", {...}) per the live TestAuditorOnSyntheticRepo idiom at
      tests/checks/deps/test_validate_pre_glob_closure.py:336); the unresolvable-mirror FAIL path;
      the Decision 170 accounting assertions; and the self-application property -- the floor is in
      its own derived population and this very file must satisfy it. Must reach 100% line coverage
      of the new module. That obligation's authority is DECISION 159 CLAUSE 2, not a checker
      default: clause 2 makes config/coverage_baseline.yaml a one-time grandfather roster in which
      an entry-bearing file fails iff measured < entry while UNBASELINED FILES KEEP 100%. A file
      created by this plan is unbaselined by construction, so 100% is its floor with no discretion,
      and clause 3's tamper guard is what makes adding an entry to buy headroom a governed act
      rather than an edit (see VP step 8's fix_if).
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Two assertions for the concern-split registration: map_source_to_test on
      scripts/checks/hygiene/validate_placement.py resolves to the DIRECTORY
      tests/checks/hygiene/validate_placement, and check_test_file_exists returns True with
      "test package found". Both red before the one-line frozenset edit, green after -- the map's
      own concern-split test home, not a new file.
  - file: docs/plans/PLAN-red-case-floor.yaml
    action: Create
    purpose: This plan.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The protected population is DERIVED from registry._ALL_ENTRIES at call time and is enumerated
    NOWHERE -- no roster file, no allowlist constant, no check-name literal in the floor's module.
    A check registered tomorrow is in the population the moment its Entry lands, with no second edit.
    Proven behaviourally, not by grep: patching _ALL_ENTRIES to a single synthetic Entry makes the
    floor examine exactly ONE check (an enumerated population would still report the live count).
    This is the settled ruling for live-fleet protection -- derive from the registry, never enumerate
    in a roster, because a roster says nothing about a check added tomorrow, is same-PR editable,
    and decays.
  - >-
    The floor discriminates in BOTH directions on a synthetic mirror test, which is the audit's
    acceptance criterion verbatim: a registered check whose mirror test contains ONLY passing-path
    tests FAILS the floor; adding ONE red-case test to that same file CLEARS it. Both halves are
    asserted against the same fixture pair so a floor that flagged everything and a floor that
    flagged nothing each red exactly one half.
  - >-
    The red-case signal is defined by the ASSERTED OUTCOME's polarity, not by test names. An assert
    counts only when its subject is derived from an invocation of the check under test AND its
    asserted outcome is positive. Every negated and empty-side form -- `assert not failed`,
    `failed == []`, `== {}`, `== ""`, `is None`, `is False`, `len(failed) == 0`, `X not in failed`,
    `all(...)` -- is asserted NEVER to count, over a corpus containing each form. A test named
    `test_detects_the_bad_thing` whose body only asserts `not failed` does not clear the floor.
  - >-
    Derivation is one hop deep through same-file helpers, because that is what the live corpus
    actually looks like: `assert self._run(tmp_path) == ["DQ manifest gate"]`
    (tests/checks/ops_governance/test_validate_dq_manifest_gate.py:62) and
    `assert _hit_count(tmp_path, body) == 1`
    (tests/checks/hygiene/test_validate_raises_discrimination.py:135) are red cases, and a
    direct-binding-only signal reports FIVE false positives on the live fleet. Measured this
    session: direct-binding-only flags 7 entries; adding the helper hop flags 0.
  - >-
    An Entry whose mirror test cannot be resolved, or resolves to a path/package that does not
    exist, is a FAILURE and never a skip -- a missing oracle and a satisfied oracle must not look
    the same (Decision 55). This is the branch that makes the scripts/test_coverage_checker.py fix
    load-bearing rather than cosmetic.
  - >-
    Mirror resolution goes through scripts.test_coverage_checker.map_source_to_test and NOTHING
    else. The floor carries no second derivation rule, no directory-fallback heuristic, and no
    special case: a mirror-home question has exactly one answer in this repo, and a private copy
    would be the drift-by-design second surface AGENTS.md and the audit's NS6 both forbid. The
    consequence is accepted deliberately -- when the canonical map is wrong the floor is wrong, so
    the map is fixed (scope row 4) rather than worked around.
  - >-
    The live fleet is CLEAN ON DAY ONE with NO grandfather hook of any kind -- not a frozen one,
    not an empty one. Measured this session at 90db9f65 over all 123 registered Entries: 122 carry
    a red case under the shipped signal, and the 123rd (validate_placement) fails only because the
    canonical map cannot resolve its concern-split mirror, which scope row 4 fixes -- 123/123 after.
    Because there is no hook, there is no hook-growth reversal signal to monitor and none is
    claimed: the floor's own red is the signal. THE AUTHORITY FOR SHIPPING HOOKLESS IS DECISION 163
    POINT 1, cited affirmatively rather than left as this plan's taste. Point 1's enforcement-shape
    principle is that autonomy is lost to judgment-required checkpoints, not to hard walls: a
    deterministic exceptionless rule costs a human's attention zero times, while a discretionary
    gate -- a waiver, an escalation, a reviewable exception path -- costs one EVERY time it is
    invoked, granted or not. For an obligation whose owner would never actually grant an exception,
    the correct instrument is REMOVING THE EXCEPTION PATH ENTIRELY, not building a gate around it a
    future session could argue past; and point 1 names the worst outcome precisely -- a policy
    universal in name but discretionary in enforcement is strictly worse than either a genuinely
    optional check or a genuinely mandatory one, carrying the appearance of the latter with the
    failure mode of the former. A grandfather roster on this floor would be exactly that shape: an
    allowlist entry is a per-check exception that a same-PR edit can grant, on a fleet-wide claim
    that would still read as universal. The measured 123/123 conformance is what makes the
    exceptionless form AVAILABLE here at zero migration cost -- which is why the fix goes into the
    canonical map (scope row 4) rather than into a hook that would concede the shape.
  - >-
    Decision 170 accounting is declared on every reachable exit path: examined(n,
    unit="registered_checks") with n == len(registry._ALL_ENTRIES), never a skipped() and never an
    undeclared path. n is asserted to be BOTH equal to the live registry length AND >= 123, so an
    empty or broken population reds instead of reporting a reassuring all-clear over zero checks.
    The check is NOT added to config/check_accounting_baseline.yaml -- that roster is shrink-only
    and a new check declares natively.
  - >-
    The floor is genuinely CHEAP AND STATIC, which is the entire ground for the audit's
    adopt-amended verdict over its own counter-reading. Pure AST over ~130 test modules: no
    subprocess, no git, no network, no pytest execution, no worktree. Measured this session end to
    end at 0.86s wall including interpreter start and full registry import. If an implementation
    makes this step execute, replay, or mutate anything, the verdict it rests on no longer holds
    and the work stops for re-scoping rather than proceeding.
  - >-
    The floor is self-hosting: validate_red_case_floor is itself a registered Entry, so it is in its
    own derived population and judges its own mirror test. A floor asserting that other tests have
    red cases that had none itself would be the exact tautology it exists to detect.
  - >-
    scripts/checks/hygiene/validate_placement.py's mirror resolves to the DIRECTORY
    tests/checks/hygiene/validate_placement and check_test_file_exists returns True for it -- red
    before the change (it returns (False, "missing test file: tests/checks/hygiene/
    test_validate_placement.py") on origin/main today), green after.
  - >-
    NOTHING in the T3.7 scheduled alarm lane is built: no mutation, no execution-grade fixture
    replay, no scheduled workflow, no cron leg, no new lane of any kind. The finding's sequencing
    note -- "leg 1 does not wait for T3.7; avoid double-building the scheduled lane" -- is an
    explicit non-goal of this plan, not an omission.
  - >-
    NO new declaration surface is created: no contract file, no registry, no roster, no
    enumeration check, no numbered Decision. Every surface touched is one that already exists and
    already has an enforcer. The governing audit REJECTED P1/P2/P3 for precisely this reason
    (C5 CONFIRMED, three times) and adopted P4 because it extends the check registry instead.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      THE AUDIT'S ACCEPTANCE CRITERION, both directions, on one fixture pair -- and the floor's own
      known-bad fixture. A synthetic mirror test whose every assertion is a passing-path form yields
      NO red case; the same file plus ONE red-case test yields one. Asserting both halves against
      the same pair is what makes this non-vacuous: a floor that flags everything reds the second
      half, a floor that flags nothing reds the first.
    command: |-
      bin/venv-python -c "
      import pathlib, tempfile
      from scripts.checks.verification import validate_red_case_floor as f
      passing = '''
      from pathlib import Path


      def _run(tmp_path: Path) -> list[str]:
          failed: list[str] = []
          validate_synth(failed, root=tmp_path)
          return failed


      class TestSynth:
          def test_clean_tree_passes(self, tmp_path: Path) -> None:
              assert _run(tmp_path) == []

          def test_empty_tree_passes(self, tmp_path: Path) -> None:
              failed: list[str] = []
              validate_synth(failed, root=tmp_path)
              assert not failed
              assert len(failed) == 0

          def test_marker_constant(self) -> None:
              assert MARKER == '# synth:'
      '''
      red = passing + '''
          def test_bad_tree_is_flagged(self, tmp_path: Path) -> None:
              assert _run(tmp_path) == ['synth check']
      '''
      with tempfile.TemporaryDirectory() as d:
          a = pathlib.Path(d) / 'test_passing_only.py'
          b = pathlib.Path(d) / 'test_with_red.py'
          a.write_text(passing)
          b.write_text(red)
          assert f.red_case_hits(a, 'validate_synth') == [], 'passing-path-only mirror must NOT clear the floor'
          hits = f.red_case_hits(b, 'validate_synth')
          assert len(hits) == 1, ('one red-case test must clear the floor; got', hits)
      print('RED_CASE_DISCRIMINATION_OK')
      "
    expected: Exit 0 and RED_CASE_DISCRIMINATION_OK.
    fix_if: >-
      A non-empty result for test_passing_only.py means the signal admits an empty-side or
      negated form -- find which of `== []`, `not failed`, `len(failed) == 0` or the bare constant
      pin leaked through and exclude it; do NOT relax the fixture. An empty result for
      test_with_red.py means the derivation missed the one-hop helper `_run`, or the positive-literal
      classifier does not recognise a non-empty list literal on the right of `==`.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-discriminates-synthetic-mirror
  - step: 2
    phase: pre-deploy
    action: >-
      LIVE-FLEET CLEANLINESS, and the derived count. Over the real registry the floor appends
      NOTHING to failed and declares examined(n, unit="registered_checks") where n equals
      len(registry._ALL_ENTRIES) exactly AND is at least 123. The lower bound is the non-vacuity
      half: without it a floor that silently examined zero checks would pass this step while
      reporting a reassuring all-clear, which is the Decision 55 false negative this whole slice
      exists to prevent.
    command: |-
      bin/venv-python -c "
      from scripts.checks import registry
      from scripts.checks.verification import validate_red_case_floor as f
      failed: list[str] = []
      with registry.outcome_scope('validate_red_case_floor'):
          f.validate_red_case_floor(failed)
          d = registry.pop_declaration()
      assert failed == [], ('live fleet must be clean on day one, no grandfather hook; got', failed)
      assert d is not None and d.kind == 'examined', ('Decision 170: must declare examined, got', d)
      assert d.unit == 'registered_checks', ('wrong unit', d.unit)
      assert d.count == len(registry._ALL_ENTRIES), ('count must equal the LIVE registry', d.count)
      assert d.count >= 123, ('an empty or truncated population must red, never all-clear', d.count)
      assert registry.derive_status(d, bool(failed)) == 'enforced'
      print('LIVE_FLEET_CLEAN', d.count)
      "
    expected: Exit 0 and LIVE_FLEET_CLEAN followed by the live registry count (123 at 90db9f65).
    fix_if: >-
      Any entry in `failed` names a check whose mirror the shipped signal does not clear. Read the
      named mirror before touching the signal: if it genuinely has no red case, that is a true
      positive and the mirror gets one; if it has one the signal cannot see, widen the signal --
      but never add a grandfather hook or an allowlist, which would reinstate the enumerated-roster
      shape this plan rejects. `validate_placement` appearing here means scope row 4's
      _CONCERN_SPLIT_TEST_PACKAGES edit is missing. A count below 123 means the population was
      snapshotted at import time instead of read at call time.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-live-fleet-clean
  - step: 3
    phase: pre-deploy
    action: >-
      THE THREE WIRING PROPERTIES, in one hermetic command, because each is a negative structural
      claim that no other step can reach. (a) DERIVED, NOT ENUMERATED -- proven behaviourally rather
      than by grepping the module for a roster (a grep would match its own docstring, and would not
      prove the population is read at call time). Patching registry._ALL_ENTRIES to a single
      synthetic Entry makes the floor examine exactly ONE check and flag it; an enumerated or
      import-time-snapshotted population would still report the live count. (b) THE REGISTERED CHECK
      CONSULTS THE HELPER'S VERDICT. Steps 1 and 4 exercise red_case_hits in isolation and step 2
      asserts an empty `failed` over the live fleet, which a floor that never flags anything also
      satisfies -- so without this leg an implementation whose validate_red_case_floor computes the
      hits and then ignores them passes steps 1-7 in full, and the known-bad fixture would ship wired
      only to the HELPER. With the population patched to the floor's OWN real Entry (whose mirror
      exists and carries a red case) the Entry must NOT be flagged; with red_case_hits patched to
      return [] the SAME Entry must be flagged. Both directions, one command, against the real
      registered callable. (c) MIRROR RESOLUTION GOES THROUGH THE CANONICAL MAP AND NOTHING ELSE --
      acceptance criterion 6's negative claim, made executable. Step 7's AST scan checks banned
      IMPORTS only and cannot see a private directory-fallback heuristic. Patching
      test_coverage_checker.map_source_to_test to resolve every source to a path that does not exist
      must make EVERY Entry fail: a private fallback, a second derivation rule or a special case
      would keep some of them green.
    command: |-
      bin/venv-python -c "
      from pathlib import Path
      from unittest.mock import patch
      from scripts.checks import registry
      from scripts.checks._schema import Entry
      from scripts import test_coverage_checker as tcc
      from scripts.checks.verification import validate_red_case_floor as f
      def run():
          failed: list[str] = []
          with registry.outcome_scope('validate_red_case_floor'):
              f.validate_red_case_floor(failed)
              return failed, registry.pop_declaration(), registry.pop_failure_detail() or []
      synth = Entry(name='validate_synth', module='scripts.checks.fake.validate_synth', attr='validate_synth')
      with patch.object(registry, '_ALL_ENTRIES', {'validate_synth': synth}):
          failed, d, _ = run()
      assert d is not None and d.count == 1, ('population must be READ at call time, not enumerated', d)
      assert failed, 'an Entry with no resolvable mirror must FAIL, never skip'
      one = {'validate_red_case_floor': registry._ALL_ENTRIES['validate_red_case_floor']}
      with patch.object(registry, '_ALL_ENTRIES', one):
          clean, d1, _ = run()
      assert d1 is not None and clean == [] and d1.count == 1, ('the floor judges its own mirror and must clear it', clean, d1)
      with patch.object(registry, '_ALL_ENTRIES', one), patch.object(f, 'red_case_hits', lambda *a, **k: []):
          starved, d2, sdetail = run()
      assert starved and len(sdetail) == 1, ('the registered check must CONSULT red_case_hits, not merely ship it', starved, sdetail)
      with patch.object(tcc, 'map_source_to_test', lambda p: Path('tests/checks/no_such_dir/test_no_such_mirror.py')):
          allfail, d3, adetail = run()
      assert d3 is not None and allfail, ('a canonical map resolving nowhere must fail the floor', allfail, d3)
      assert len(adetail) == d3.count, ('EVERY Entry must fail when the canonical map resolves nowhere -- a private fallback would keep some green', len(adetail), d3)
      print('POPULATION_DERIVED_VERDICT_WIRED_MAP_SOLE', d3.count)
      "
    expected: >-
      Exit 0 and POPULATION_DERIVED_VERDICT_WIRED_MAP_SOLE followed by the live registry count
      (123 at 45d4afb8).
    fix_if: >-
      A count of 123 under the single-Entry patch means the floor snapshotted the registry at import
      time (bind `registry._ALL_ENTRIES` inside the function body, never at module scope) or reads a
      private copy. An empty `failed` on that same leg means the unresolvable-mirror branch skips
      instead of failing -- that is the Decision 55 false negative; make it append. An empty
      `starved` means validate_red_case_floor does NOT consult red_case_hits' verdict: it computes
      the hits and discards them, or re-derives the signal inline; route the failure decision through
      the helper's return value, which is the only wiring this floor's known-bad fixture can reach. A
      non-empty `clean` means the floor's own mirror test does not satisfy the floor -- fix the
      mirror, never the floor (acceptance criterion 9). A `len(adetail)` below `d3.count` on the
      neutered-map leg means some Entry resolved its mirror WITHOUT the canonical map: find the
      private fallback and delete it. If that leg changes nothing at all, the floor bound
      `map_source_to_test` with a `from ... import` at module scope -- reach it through the
      test_coverage_checker MODULE OBJECT at call time (the documented
      scripts/checks/misc/coverage_baseline.py pattern) so the canonical map has exactly one
      interception point.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-population-derived-not-enumerated
  - step: 4
    phase: pre-deploy
    action: >-
      NEGATED AND EMPTY-SIDE FORMS NEVER COUNT, over a corpus carrying each one. `assert not failed`,
      `failed == []`, `== {}`, `== ''`, `is None`, `is False`, `len(failed) == 0`, `X not in failed`
      and `all(...)` are each asserted individually to yield no red case, and a name-suggestive test
      (`test_detects_the_bad_thing`) whose body only asserts a negated form is asserted NOT to clear
      the floor. This is the guard against the floor decaying into a test-name grep.
    command: |-
      bin/venv-python -c "
      import pathlib, tempfile
      from scripts.checks.verification import validate_red_case_floor as f
      forms = [
          'assert not failed',
          'assert failed == []',
          'assert failed == {}',
          \"assert failed == ''\",
          'assert failed is None',
          'assert failed is False',
          'assert len(failed) == 0',
          \"assert 'x' not in failed\",
          'assert all(x for x in failed)',
      ]
      with tempfile.TemporaryDirectory() as d:
          for i, form in enumerate(forms):
              p = pathlib.Path(d) / f'test_negated_{i}.py'
              p.write_text(
                  'def test_detects_the_bad_thing(tmp_path):\n'
                  '    failed = []\n'
                  '    validate_synth(failed, root=tmp_path)\n'
                  f'    {form}\n'
              )
              assert f.red_case_hits(p, 'validate_synth') == [], ('negated form counted as a red case', form)
      print('NEGATED_FORMS_REJECTED', len(forms))
      "
    expected: Exit 0 and NEGATED_FORMS_REJECTED 9.
    fix_if: >-
      Any form yielding a hit means the polarity classifier treats an empty literal, None, False or
      a zero-length comparison as positive. `all(...)` counting is the subtle one -- `all()` over an
      empty list is True, so it is satisfied by a check that found nothing and must never count;
      only `any(...)` may.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-rejects-negated-forms
  - step: 5
    phase: pre-deploy
    action: >-
      THE MIRROR-MAP FIX, red before and green after. scripts/checks/hygiene/validate_placement.py
      resolves to the concern-split DIRECTORY tests/checks/hygiene/validate_placement (which holds
      three real test modules) and check_test_file_exists reports the package found. On origin/main
      today this same command fails, returning the non-existent file path -- that is the red half,
      and it is why this is a precondition of the floor rather than a drive-by cleanup.
    command: |-
      bin/venv-python -c "
      import pathlib
      from scripts.test_coverage_checker import ROOT, check_test_file_exists, map_source_to_test
      src = pathlib.Path('scripts/checks/hygiene/validate_placement.py')
      target = map_source_to_test(src)
      assert target == ROOT / 'tests' / 'checks' / 'hygiene' / 'validate_placement', ('expected the concern-split package dir, got', target)
      assert target.is_dir(), 'the concern-split target must be a real directory'
      assert sorted(p.name for p in target.glob('test_*.py')), 'the package must hold test modules'
      ok, why = check_test_file_exists(src)
      assert ok, ('mirror must resolve after the registration; got', ok, why)
      assert why == 'test package found', why
      print('PLACEMENT_MIRROR_RESOLVES')
      "
    expected: Exit 0 and PLACEMENT_MIRROR_RESOLVES.
    fix_if: >-
      A returned path ending in test_validate_placement.py means the string was not added to
      _CONCERN_SPLIT_TEST_PACKAGES, or was added with a backslash or a leading ./ -- the set is keyed
      on the POSIX relative path exactly as the 33 existing entries are. Do NOT instead move the
      three test modules to a flat file: the concern split was a deliberate #1037 decomposition and
      the registration is the sanctioned way to declare it.
    hermetic: true
    graduation: graduate
    graduation_check_id: placement-mirror-resolves-to-concern-split-package
  - step: 6
    phase: pre-deploy
    action: >-
      REGISTRATION SURFACES RESOLVE, checked by the REAL enforcers rather than by hand-rolled
      greps -- the check resolves through the live registry dispatch path, appears in both tier
      sequences as declared, and the ci_rca taxonomy's own registered check (validate_ci_rca_taxonomy,
      whose 1b leg fails on any registered check absent from function_to_category) passes. Invoking
      the registered enforcer is what keeps this step from being stricter than the gate it stands
      for.
    command: |-
      bin/venv-python -c "
      from scripts.checks import registry
      from scripts.checks.ci_guards import validate_ci_rca_taxonomy as t
      assert 'validate_red_case_floor' in registry.all_checks(), 'not registered'
      fn = registry.resolve('validate_red_case_floor')
      assert callable(fn), 'manifest Entry does not resolve to a callable'
      pre = [s.name for s in registry.pre_sequence()]
      full = [s.name for s in registry.full_sequence()]
      assert 'validate_red_case_floor' in pre, 'declared pre=True but absent from pre_sequence'
      assert 'validate_red_case_floor' in full, 'declared full_after_lint but absent from full_sequence'
      failed: list[str] = []
      t.validate_ci_rca_taxonomy(failed)
      assert failed == [], ('taxonomy gate must pass -- missing function_to_category row?', failed)
      print('REGISTRATION_SURFACES_OK')
      "
    expected: Exit 0 and REGISTRATION_SURFACES_OK.
    fix_if: >-
      A resolve() KeyError means the Entry is missing from scripts/checks/verification/_manifest.py
      or its name/attr disagree. Absence from a sequence means pre=True or full_segment was not set.
      A non-empty taxonomy `failed` naming the new check means the config/ci_rca_taxonomy.yaml row is
      missing -- add `validate_red_case_floor: code_regression`, do not invent a category.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-registration-surfaces-resolve
  - step: 7
    phase: pre-deploy
    action: >-
      COST, measured against the premise the audit's verdict rests on. The floor runs end to end
      over the live fleet in well under ten seconds of wall time, and its module imports no
      subprocess, no requests/urllib, and no pytest -- static AST only. If this step cannot pass, the
      "cheap and static" ground for adopt-amended is gone and the work stops for re-scoping rather
      than proceeding. THE GOVERNING BUDGET IS DECISION 182, NOT THIS STEP'S BOUND. The 10s here is
      an ad-hoc tripwire chosen to red loudly on a design regression; the real contract is Decision
      182 clauses 1-2. Clause 1 splits the fast tier into NON_TEST_BUDGET_SECONDS = 240 plus a
      breadth-derived pytest_diff half, and clause 2 defines the non-test half BY SUBTRACTION --
      elapsed minus the one subtracted pytest_diff phase, so static + replay + unattributed time is
      all governed. A pre=True static AST check is squarely in that non-test half, so this floor's
      0.86s is spent against 240s -- and the floor is NOT the only draw this PR makes on that half:
      its seven graduation shards each pay the fail-on-revert differential in the same --pre run,
      measured and booked once in the SELECTION BUDGET context entry rather than restated here.
      Clause 4 makes that half UNWAIVABLE: it outranks every waiver
      branch, so the breadth waiver this plan expects on its test half buys the floor nothing here.
      Decision 153's single 300s aggregate is NOT the authority to reason against -- Decision 182
      clause 1 negates its point 3 verbatim -- so this plan cites 182 and does not cite 153.
    command: |-
      bin/venv-python -c "
      import ast, pathlib, time
      from scripts.checks.verification import validate_red_case_floor as f
      src = pathlib.Path('scripts/checks/verification/validate_red_case_floor.py').read_text()
      banned = {'subprocess', 'requests', 'urllib', 'pytest', 'boto3', 'socket'}
      mods = set()
      for n in ast.walk(ast.parse(src)):
          if isinstance(n, ast.Import):
              mods.update(a.name.split('.')[0] for a in n.names)
          elif isinstance(n, ast.ImportFrom) and n.module:
              mods.add(n.module.split('.')[0])
      assert not (mods & banned), ('the floor must stay static -- banned imports', sorted(mods & banned))
      failed: list[str] = []
      t0 = time.perf_counter()
      f.validate_red_case_floor(failed)
      elapsed = time.perf_counter() - t0
      assert elapsed < 10.0, ('the floor must be cheap; took', elapsed)
      print('FLOOR_IS_CHEAP_AND_STATIC', round(elapsed, 3))
      "
    expected: Exit 0 and FLOOR_IS_CHEAP_AND_STATIC with an elapsed under 10s (0.86s measured at plan time).
    fix_if: >-
      A banned import means an execution-grade leg leaked in from T3.7's lane -- remove it; replay
      and mutation are explicitly out of scope. An elapsed over 10s means the scan re-parses or
      re-resolves per Entry instead of caching per mirror FILE; several Entries share a mirror
      package, so parse once per file.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-static-and-under-10s
  - step: 8
    phase: pre-deploy
    action: >-
      The full mirror suite for the new module and both touched map packages, plus the 100%
      line-coverage obligation on the new source file. That obligation's authority is DECISION 159
      CLAUSE 2 -- config/coverage_baseline.yaml is a one-time grandfather roster and UNBASELINED
      FILES KEEP 100% -- with check_per_file_coverage as its evaluator, not its source.
    command: |-
      bin/venv-python -m pytest tests/checks/verification/test_validate_red_case_floor.py tests/test_coverage_checker/ tests/checks/registry/ -q \
      && bin/venv-python scripts/test_coverage_checker.py --check-tests --check-coverage --files scripts/checks/verification/validate_red_case_floor.py scripts/test_coverage_checker.py scripts/checks/registry.py
    expected: >-
      pytest exits 0 with no failures; the coverage checker prints 0 missing test files and 0 files
      below 100% and exits 0.
    fix_if: >-
      A coverage shortfall on the new module means an unexercised branch -- most likely the
      unresolvable-mirror FAIL path or the SyntaxError guard on an unparseable mirror; add the
      missing case to the mirror test rather than adding a baseline entry. That is not a style
      preference: Decision 159 clause 2 puts an unbaselined file at 100% with no discretion, and
      clause 3's tamper guard (validate_coverage_baseline_edits) fails any new sub-100 entry
      lacking an inline `# baseline-lowered: dec-NNN <reason>` marker naming a real
      `## Decision NNN:` header WHOSE BODY ACTUALLY AUTHORIZES the entry. Header EXISTENCE is not
      the bar and has not been since Decision 165's marker-guard consolidation upgraded this from
      existence to authorization -- scripts/checks/misc/coverage_baseline.py says so in its own
      module docstring, and an existence-only reading is the weaker restatement this slice exists to
      catch. So a baseline entry here would need an AUTHORIZING Decision this plan deliberately does
      not mint. The
      roster is a one-time grandfather set under a net-growth re-audit trigger, not a pressure
      valve for new code.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Multi-command (pytest plus a second CLI) and it invokes pytest, so it is neither
      kernel-expressible as one canonical primitive slot nor hermetic-cheap enough for a standing
      guard; the behaviours it covers are already graduated individually at steps 1-7.
  - step: 9
    phase: pre-deploy
    action: >-
      The plan schema, then BOTH presubmit tiers over the whole branch. Run last so the floor is
      judged by the same tiers it will gate in. The trailing un-flagged `-m scripts.validate` is the
      FULL tier and it is not optional decoration: this plan declares
      handoff_policy.full_validation_required_before_commit, and Decision 163 point 2 makes that
      declaration executable -- validate_handoff_full_tier fails any diff-added/modified plan
      declaring it unless at least one verification_plan step invokes `-m scripts.validate` WITHOUT
      `--pre`. Its matcher splits a command on `&&`, `||`, `;` and newline and judges each segment
      independently, so one step discharges both tiers. THE MATCHER IS BLIND TO SHELL VALIDITY,
      which is why this step and step 8 both shipped unexecutable in the pre-critique draft: a bare
      newline followed by `&&` is a bash syntax error (`bash -n` exit 2), but it splits into exactly
      the same clean segments, so validate_handoff_full_tier passed a command no shell could run.
      The TRAILING BACKSLASH on each continued line is what makes it executable -- the repo idiom in
      every other multi-segment VP command -- and `bash -n` on the step is the only thing that
      proves it. Do not drop it to tidy the YAML. Verified against the real enforcer while
      revising this plan: with only the two `--pre` segments present, validate_handoff_full_tier
      appended "declares handoff_policy.full_validation_required_before_commit but no
      verification_plan step invokes the full tier" against THIS file -- the plan reddened its own
      step 9, which is precisely the declared-vs-executed decay class this slice exists to catch,
      appearing in the slice's own artefact. The full tier is also where the 100%-line obligation on
      the new module is actually enforced: --pre's coverage leg is diff-scoped, and Decision 159
      clause 2 puts an unbaselined file at 100%, which is a whole-file gate.
    command: |-
      bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-red-case-floor.yaml \
      && bin/venv-python -m scripts.validate --pre \
      && bin/venv-python -m scripts.validate
    expected: All three exit 0.
    fix_if: >-
      A SLOC failure naming a path under .claude/worktrees/ is the known local-only artefact of
      gitignored worktree clones (rec-3678) -- not this branch's; confirm the named path is outside
      the scope table and continue. Any failure naming a scope file is real. A shell syntax error on this step or step 8 means a
      continued line lost its trailing `\` -- restore it and re-check with `bash -n`, never by
      moving the `&&` to the end of the previous line, which the repo idiom does not use. A
      validate_handoff_full_tier failure naming this plan means the trailing un-flagged
      `-m scripts.validate` segment was dropped or acquired a `--pre` -- restore the segment; NEVER
      resolve it by removing handoff_policy, which Decision 163 point 1 forecloses (the obligation
      has no exception path to take, by design).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same shape as step 8 and disposed the same way, deliberately -- the earlier
      `not-applicable` stated no ground and the schema forbids a reason field on that disposition,
      so `waive` is the only form that can carry one. Multi-command (three chained CLIs), so it is
      not kernel-expressible as one canonical primitive slot, and it invokes both presubmit tiers,
      so it is not hermetic-cheap enough for a standing guard. The stronger ground is CIRCULARITY:
      graduating this step would mint a registry shard whose command IS the presubmit tier that
      dispatches validate_verification_registry, so the differential admission gate would run the
      whole tier twice inside itself, on origin/main and on HEAD, for every shard-touching PR
      thereafter. The behaviours this step stands for are graduated individually at steps 1-7.
test_obligations:
  - source: scripts/checks/verification/validate_red_case_floor.py
    behavior: >-
      The floor discriminates in both directions on a synthetic mirror pair -- a passing-path-only
      mirror is flagged, the same file plus one red-case test clears it -- so neither a floor that
      flags everything nor a floor that flags nothing can pass.
    verification_step: 1
    command: |-
      assert f.red_case_hits(a, 'validate_synth') == [], 'passing-path-only mirror must NOT clear the floor'
    red_green_expectation: >-
      Red before (the module does not exist, so the import fails), green after. The known-bad fixture
      reds specifically and asymmetrically: admitting `assert not failed` or `== []` as a positive
      outcome reds THIS assertion, while dropping the one-hop helper derivation reds the paired
      `len(hits) == 1` assertion on the next line -- each half fails for the opposite reason.
      Additionally covered by
      tests/checks/verification/test_validate_red_case_floor.py::TestFloorOnSyntheticMirror at step 8.
  - source: scripts/checks/verification/validate_red_case_floor.py
    behavior: >-
      The population is read from registry._ALL_ENTRIES at call time (patchable, never snapshotted at
      import), and an Entry whose mirror cannot be resolved FAILS rather than skipping, with
      Decision 170 accounting declared on every reachable exit path.
    verification_step: 3
    command: |-
      assert d is not None and d.count == 1, ('population must be READ at call time, not enumerated', d)
    red_green_expectation: >-
      Red before (no module), green after. A module-scope binding of _ALL_ENTRIES reds this
      assertion at 123 instead of 1 -- which is precisely the enumerated-roster failure mode, caught
      behaviourally rather than by grepping the module for a roster. A skip-on-unresolvable-mirror
      branch reds the paired `assert failed` on the following line. Additionally covered by
      tests/checks/verification/test_validate_red_case_floor.py::TestPopulationIsDerived at step 8.
  - source: scripts/test_coverage_checker.py
    behavior: >-
      scripts/checks/hygiene/validate_placement.py is a declared concern-split monolith, so
      map_source_to_test resolves it to the tests/checks/hygiene/validate_placement PACKAGE
      DIRECTORY and check_test_file_exists reports the package found.
    verification_step: 5
    command: |-
      assert ok, ('mirror must resolve after the registration; got', ok, why)
    red_green_expectation: >-
      Red before -- on origin/main at 90db9f65 this exact assertion fails, check_test_file_exists
      returning (False, "missing test file: tests/checks/hygiene/test_validate_placement.py").
      Green after the one-line frozenset addition. Verified red this session against the unmodified
      tree, so this is a genuine pre-existing false negative in a shared map, not a fixture written
      to match a change. Additionally covered by
      tests/test_coverage_checker/test_coverage_checker_map.py::TestConcernSplitPackages at step 8.
  - source: scripts/checks/verification/_manifest.py
    behavior: >-
      The new Entry is declared with bare string-literal module/attr, pre=True with its three
      pre_globs, and full_segment="full_after_lint", so it resolves through registry.resolve() and
      is dispatched in both tier sequences.
    verification_step: 6
    command: |-
      assert 'validate_red_case_floor' in pre, 'declared pre=True but absent from pre_sequence'
    red_green_expectation: >-
      Red before (no Entry, so resolve() raises before this line is reached), green after. Omitting
      pre=True reds this assertion specifically while leaving the full-tier one green. The
      manifest/@register bijection is separately guarded by the existing
      tests/checks/registry/test_manifest_contracts.py::TestBijection, which reds if either half
      lands without the other and is run at step 8.
  - source: config/ci_rca_taxonomy.yaml
    behavior: >-
      The new check carries a function_to_category row (validate_red_case_floor: code_regression),
      without which validate_ci_rca_taxonomy's check-1b leg fails the PR on a registered check absent
      from the map.
    verification_step: 6
    command: |-
      assert failed == [], ('taxonomy gate must pass -- missing function_to_category row?', failed)
    red_green_expectation: >-
      Red before -- the moment the Entry lands without the row, validate_ci_rca_taxonomy appends
      "CI-RCA taxonomy: registered check 'validate_red_case_floor' absent from function_to_category"
      and this assertion fails. Green once the row lands. The evidence is the REAL registered
      enforcer invoked directly, not a hand-rolled grep of the YAML, so the step cannot be stricter
      than the gate it stands for.
  - source: config/agent/verification_registry/entries/red-case-floor-discriminates-synthetic-mirror.yaml
    behavior: >-
      The graduation shard for VP step 1 is a well-formed one-record-per-file registry entry that the
      differential admission gate admits -- it must prove RED on the broken-guard counterfactual, not
      merely parse.
    verification_step: 9
    command: |-
      bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      Red before -- validate_verification_registry runs the fail-on-revert differential for ADDED
      shards in --pre, so a shard whose command still exits 0 with its guard reverted fails the gate
      rather than being admitted. Green when the shard genuinely discriminates. This is the same
      NS3 discrimination bar (the audit's NS3, see the no-mint context entry for its verbatim repo source)
      this plan imposes on the fleet, applied to the plan's own new artefacts.
  - source: config/agent/verification_registry/entries/red-case-floor-live-fleet-clean.yaml
    behavior: >-
      The graduation shard for VP step 2 is admitted by the same differential gate, proving the
      live-fleet cleanliness assertion reds when its guard is reverted.
    verification_step: 9
    command: |-
      bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      Red before, green after, by the same fail-on-revert differential as the shard above. If this
      shard cannot be made to red on the counterfactual it must not be graduated -- re-dispose VP
      step 2 as waive with a stated reason rather than admitting a shard that proves nothing.
  - source: scripts/checks/registry.py
    behavior: >-
      No behaviour change -- the edit is confined to the module docstring's canonical seven-surfaces
      enumeration, adding the red-case clause to surface (6) and naming its enforcer.
    verification_step: 8
    command: |-
      tests/checks/registry/
    waiver_reason: >-
      Docstring-only edit with no reachable behaviour: the seven-surfaces enumeration is prose no
      code path reads, so no test can go red before it and green after without asserting on the
      docstring TEXT, which would pin wording rather than behaviour and would red on any later
      rewording -- a worse guard than none. The correct obligation for a documentation change is
      proving it changed nothing, which is what running the whole existing tests/checks/registry/
      suite at step 8 does.
constraints:
  - >-
    HARD ANTI-DRIFT CONSTRAINT, the one this whole slice turns on: do NOT create a new contract file,
    registry, roster, allowlist, enumeration check, or numbered Decision. The governing audit
    REJECTED P1, P2 and P3 -- three times C5 CONFIRMED -- precisely because each amounted to a new
    declaration surface duplicating a live register, and adopted P4 because it EXTENDS the check
    registry. Every surface this plan touches already exists and already has an enforcer.
  - >-
    DERIVE the protected population from the live registry; never ENUMERATE it in a roster. An
    enumerated roster says nothing about a check registered tomorrow, is editable in the same PR that
    weakens the check it protects, and decays. This is the settled ruling for live-fleet protection
    and it is not re-litigable inside this slice.
  - >-
    LEG 1 ONLY. No mutation, no execution-grade fixture replay, no scheduled workflow, no cron leg,
    no alarm lane. Those are T3.7's (deferred_post_mvp, alarm-not-gate per CD.12) and the finding's
    own sequencing note forbids double-building them here.
  - >-
    If the design stops being CHEAP AND STATIC, the audit's adopt-amended verdict no longer holds.
    The counter-reading it was weighed against is real and recorded in context below; the ONLY thing
    that beat it was cost. Stop and re-scope rather than shipping an expensive floor.
  - >-
    Prefer invoking the registered check over re-implementing its logic in a VP command -- doubly so
    here, since the subject IS the check fleet. A VP step stricter than the real enforcer fails
    correct work; steps 6 and 9 call the real gates.
  - No rescue agents or workaround loops (Decision 55); a missing oracle fails loud, never skips.
  - >-
    Decision 59: out-of-scope defects become recommendations via scripts/ops_data_portal
    (get_rec_write_guidance() before file_rec()), never inline fixes. Never Edit or Write
    logs/*.jsonl.
  - >-
    Decision 128: decompose past a SLOC budget, never raise it. No config/sloc_budgets.yaml edit is
    anticipated -- the new module lands well under 500 and both modified sources have headroom
    (test_coverage_checker.py 471 + 1; registry.py 319 + docstring lines).
  - >-
    Never commit on main; work on the harness-assigned claude/ branch. bin/venv-python, never bare
    python/python3. ruff, line length 127. No emojis, no em dashes.
  - >-
    Every behaviour change ships a test that fails without it and every new guard ships a known-bad
    fixture -- load-bearing twice over here, because a floor asserting that other tests have red
    cases must itself have one.
context:
  - "Audit source of truth: audits/loop-spec-adoption-4d8bac4a.yaml finding LSA-03 (surface S6, question Q4, dimension VD3, candidate C2, severity medium, confidence CONFIRMED, effort M, change_type enforce, depends_on []). Its proposed_change, acceptance, and sequencing note are authoritative and are transcribed into the acceptance criteria above rather than paraphrased."
  - "SCOPE IS P4-AMENDED LEG 1 ONLY. The audit's P4 mechanism has three legs; leg 2 (escape-ratchet closure obligation) already LANDED as Decision 186 at 90db9f65 (PR #1133, PLAN-escape-closure-obligation), and leg 3 (execution-grade replay) is T3.7's scheduled alarm lane and is explicitly not built here. THIS IS THE 186 PROVENANCE NOTE, and 186 is recorded here and nowhere else: it is named so the leg boundary is auditable, not because it governs anything in this slice. Decision 186 governs closure-time artifact obligations on escape-classified RECS; this plan files no rec into that lane and closes none, so it carries no 186 obligation. The decision-scout's CITE list omits it for exactly that reason and the plan does not cite it as governance."
  - "MEASURED FLEET CONFORMANCE, this session at 90db9f65, over the LIVE registry -- the evidence for the no-grandfather decision. 123 registered Entries (the audit's '114' is stale; the fleet grew). Under the shipped signal: 122 carry a red case, 0 have a mirror test with no red case, and 1 (validate_placement) has no RESOLVABLE mirror -- a canonical-map defect, not a missing test. After scope row 4 the fleet is 123/123 and the floor ships with NO grandfather hook at all."
  - "SIGNAL CALIBRATION IS EMPIRICAL, not guessed. A first-cut signal keyed only on direct bindings of the accumulator flagged SEVEN entries (validate_claude_md_pointer_invariant, validate_complexity, validate_declaring_coverage, validate_diff_coverage, validate_dq_manifest_gate, validate_pre_glob_closure, validate_raises_discrimination). All seven were read individually and ALL SEVEN were false positives of two kinds: (a) helper-mediated red cases -- `assert self._run(tmp_path) == ['DQ manifest gate']`, `assert _hit_count(tmp_path, body) == 1`; (b) ADVISORY-BY-CONSTRUCTION checks whose failure channel is not `failed` at all -- validate_complexity carries a test literally named test_never_appends_to_failed_list and asserts `len(warnings) > 0` instead, validate_declaring_coverage is a Decision 170 reporter that fails nothing. Adding the one-hop helper derivation and keying on ASSERTED-OUTCOME POLARITY rather than on the accumulator's NAME clears all seven with no carve-out, no advisory exemption and no allowlist. Publishing a floor calibrated on the first cut would have failed seven pieces of correct work on day one."
  - "NON-VACUITY IS PROVEN IN BOTH DIRECTIONS, not assumed. The same shipped signal returns ZERO hits on a synthetic mirror whose assertions are all passing-path forms and exactly ONE hit on that same file plus one red-case test. That pair is VP step 1 and is the floor's own known-bad fixture (Q5 seed 6: 'P4 judging fixture-parity must itself demonstrate parity')."
  - "THE COUNTER-READING, engaged rather than ignored. The finding records it: T3.7's assertion-free lint is planned BLOCKING and catches the worst tautologies, and the 208 test_selector + 222 command_exit_zero graduated shards already pin real behaviour, so the marginal decayed-check risk may not justify a new floor before T3.7 lands. Three findings decide it FOR building now. (1) The two checks are NOT duplicative and it is worth being precise about why: an assertion-free lint asks whether a test asserts ANYTHING (test SHAPE); this floor asks whether at least one assertion expects a FAILING outcome from the check under test (test DISCRIMINATION). A mirror test consisting entirely of `assert not failed` passes an assertion-free lint and fails this floor -- that is exactly the decayed-tautology class LSA-03 names, and it is invisible to the planned lint. (2) The graduated shards prove discrimination for the 475-shard GRADUATED population, which is a different population from the 123-check fleet; the audit says so itself and rates VD3 partial-not-met on precisely that population mismatch. (3) T3.7 is deferred_post_mvp and explicitly NOT on the CD.17 reversal path, so 'before T3.7 lands' is an unbounded wait. The verdict's stated ground is that the floor is cheap and static -- MEASURED at 0.86s wall, pure AST, no subprocess/git/network/pytest -- so the ground holds and the verdict stands. VP step 7 pins that ground as an executable assertion, and constraint 4 says what to do if it ever stops holding."
  - "DECLARED ADJACENCY -- T3.7:c2 (ROADMAP CONFLICT, WARN not BLOCK). The decision-scout's roadmap overlay returned exactly one CONFLICT row and it is declared here rather than left implicit: T3.7 exit criterion c2 ('AST assertion-free lint runs in validate.py and blocks a test function that contains no assertion') and this floor are BOTH validate.py-registered BLOCKING AST walkers over test bodies. That shared mechanism is real and this plan does not minimise it. The predicates differ and the distinction holds: c2 is a SHAPE predicate -- does this test assert ANYTHING -- and is satisfied by `assert not failed`; the floor is a DISCRIMINATION predicate -- does at least one assertion expect a FAILING outcome from the check under test -- and that same line fails it. So a mirror consisting entirely of `assert not failed` passes c2's lint and reds this floor, which is the decayed-tautology class LSA-03 names and is invisible to c2 by construction. NOT FORECLOSED, and the reasons are the finding's own: T3.7 is deferred_post_mvp and explicitly NOT on the CD.17 reversal path, so 'wait for c2' is an unbounded wait; and the finding's sequencing note says leg 1 does not wait for T3.7. WHAT THE ADJACENCY COSTS, stated plainly: when T3.7 reactivates, the cheap-and-correct move for c2's implementer is ONE MORE PREDICATE inside validate_red_case_floor's existing AST walk over the same mirror population, not a second scanner -- same parse, same population, same dispatch, and the floor already caches one parse per mirror FILE. The expensive move is a second registered AST test-scanner, which is what a c2 implementer who has never heard of this floor will build by default. This plan cannot itself close that: see the routing note below."
  - "ROUTING THE T3.7 FORWARD-POINTER -- FILED AS rec-3719, NOT EDITED INTO THE ROADMAP, and the judgment is recorded because it was a real fork. docs/ROADMAP-PLATFORM.yaml is a DECLARED EXCLUSION of this plan (the phase block states it names no tier_item and adds no roadmap row), so annotating T3.7:c2 is an out-of-scope criterion-text edit. Precedent for such an edit exists -- a sibling slice in this run amended T1.13:c9 in place -- so the bar is not 'impossible' but 'is it load-bearing enough to buy a human-directed scope amendment'. IT IS NOT, and the test applied was correctness versus discoverability. The floor is correct, complete and shippable with no roadmap edit; a duplicated c2 scanner would also be correct. The cost of omission is DUPLICATED MECHANISM, paid only if and when a deferred_post_mvp item reactivates -- a discoverability cost, not a correctness one. Against that: Decision 59 routes exactly this shape (an out-of-scope concern surfaced mid-slice) to a recommendation rather than an inline fix, a rec is durable and is surfaced by /orient where a buried roadmap sentence is not, and scope amendments have cost this overseer run two separate PRs and several days. rec-3719 therefore carries the adjacency, the SHAPE-vs-DISCRIMINATION split, and the one-sentence edit it asks for, against file docs/ROADMAP-PLATFORM.yaml. This also satisfies the Decision 86 SPIRIT NOTE the scout raised -- the relationship no longer lives only in transient context and acceptance criterion 12 -- without minting a standing prose-architecture doc, which Decision 86 forbids outright. It is NOT bundled into followon_recs: that field names DEFERRED HALVES of this plan's own work (exit-criteria-ledger.yaml plan_followon_recs), and this is an adjacent item's annotation, not a half of the floor."
  - "GRADUATION SHARDS ARE SANCTIONED BY DERIVATION, NOT DECLARED -- and two of them were wrongly declared as scope rows in the pre-scout draft. Seven verification_plan steps carry graduation: graduate, so seven config/agent/verification_registry/entries/<graduation_check_id>.yaml shards will be written by the Verification Graduation walk. NONE is a scope row. implement-scope-boundary.yaml's sanction_rows.graduated_registry_shard says a shard is 'necessarily untracked/new at the point the plan itself declared the step, SO IT CAN NEVER BE A PRE-DECLARED SCOPE ROW', and its trigger (graduation_check_id_per_step) fires once per graduate-disposition step, sanctioning all seven by derivation. The draft declared two -- red-case-floor-discriminates-synthetic-mirror and red-case-floor-live-fleet-clean -- with a Decision 59 LOCATION-boundary rationale attached. Both rows are DELETED. The declaration was mechanically harmless (allowed = declared | sanctioned) but it stated a false precondition and, worse, read as though the other five had been forgotten. The two test_obligations naming those shard paths are retained deliberately: an obligation source is not a scope declaration (validate_plan_documents' rule runs one way only -- every behaviour-capable SCOPE ROW owes an obligation, never the converse), and those two carry the real fail-on-revert differential expectation."
  - "WHY A REGISTERED CHECK AND NOT A META-TEST, since P4's mechanism text offers both. The finding's change_type is `enforce`, and Q5.9 answers that P4's static red-case floor is the leg that CAN run in --pre while its execution grade cannot. A plain meta-test is same-PR editable with no marker -- the exact 'who guards the guard-tests' complaint the audit raises as its own Q5 question 1 and files under LSA-01. A registered check is dispatched by the tier sequences, carries Decision 170 accounting, and is covered by the registry's own bijection and taxonomy census guards. Cost accepted and declared: registration touches seven surfaces, which is a real collision surface with any concurrent slice."
  - "NO NUMBERED DECISION IS MINTED, and the Significance Gate's three property tests are why. (1) There is no durable architectural commitment with reversal-relevant consequences here -- this enforces an ALREADY-RATIFIED bar (THE AUDIT'S NS3. Its ratified source is docs/PROJECT_CONTEXT.md's verification paragraph, quoted verbatim here: 'A proposed verifier must itself demonstrate useful discrimination before becoming authoritative, including differential or mutation evidence where appropriate.' The finding's ideal_behavior renders that as 'before and while authoritative'; 'and while' is the AUDIT'S strengthening, not the repo's text, and nothing in this plan rests on it. Note also that 'NS3' and 'NS6' are the AUDIT PROMPT'S OWN local numbering -- the roadmap's north_star.principles are NS.1 through NS.5 and its NS.3 is 'Compute lives where it economically belongs', an unrelated claim -- so every use of them in this plan is prefixed accordingly) rather than committing to anything new. (2) Contract-first alternative considered and REJECTED WITH A REASON, per rec-3015. The two nearest EXISTING contracts are the wrong homes -- docs/contracts/verification-registry.yaml is a Class A DATA contract for the graduated-shard registry's row schema, not a home for a fleet-wide test obligation, and docs/contracts/check-manifest.yaml governs manifest GRAMMAR, which this does not change -- but naming only those two is the weaker half of the argument, because it answers 'which existing contract' and not 'why not a NEW one'. DECISION 168 IS WHAT ACTUALLY SETTLES THAT. Class D is the class the taxonomy added FOR mechanism content, so a new Class D contract is the live, sanctioned option here and cannot be waved off as 'no contract fits'. It is rejected on 168's OWN bar: clause 2 makes the evaluator obligation resolution BY EVIDENCE OF READING, not by mention -- a Class D contract requires both subject and evaluator, and a {check: name} evaluator resolves only if that sequenced, regis