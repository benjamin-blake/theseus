pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    audits/loop-spec-adoption-4d8bac4a.yaml finding LSA-03 read in full, plus the P4 technique_verdict
    block and Q5 own-questions 6 and 9 -- the leg boundary, the meta-fixture obligation and the
    --pre-compatibility ruling all live there
  - >-
    scripts/checks/registry.py's seven-surfaces docstring and docs/contracts/check-manifest.yaml's
    entry_grammar read before touching any manifest
  - >-
    tests/checks/deps/test_validate_pre_glob_closure.py::TestAuditorOnSyntheticRepo read -- it is the
    live precedent for patching registry._ALL_ENTRIES against a synthetic tree
execution_steps:
  - >-
    Create scripts/checks/verification/validate_red_case_floor.py -- the derived-population walk, the
    map_source_to_test mirror resolution (file target and concern-split directory), the AST red-case
    signal with its one-hop helper derivation and asserted-outcome polarity classifier, the
    unresolvable-mirror FAIL branch, failure_detail() with the per-entry identities, and
    examined(n, unit="registered_checks") on every reachable exit path. Parse each mirror FILE once
    and cache -- several Entries share a mirror package.
  - >-
    Register it: the @register("validate_red_case_floor") decoration in the module, the Entry literal
    in scripts/checks/verification/_manifest.py (pre=True, three pre_globs, full_after_lint), and the
    `validate_red_case_floor: code_regression` row in config/ci_rca_taxonomy.yaml. All three land
    together -- TestBijection reds on any one alone.
  - >-
    Add "scripts/checks/hygiene/validate_placement.py" to _CONCERN_SPLIT_TEST_PACKAGES in
    scripts/test_coverage_checker.py, and add the two assertions to
    tests/test_coverage_checker/test_coverage_checker_map.py. Confirm the RED half first by running
    VP step 5 BEFORE the edit -- it must fail, or the fix is not fixing anything.
  - >-
    Amend scripts/checks/registry.py's module docstring, surface (6) only, to state the red-case
    obligation and name its enforcer. Docstring text only; touch no code.
  - >-
    Write tests/checks/verification/test_validate_red_case_floor.py with the classes the
    test_obligations name (TestFloorOnSyntheticMirror, TestPopulationIsDerived) plus the
    unresolvable-mirror, accounting, and self-application cases, to 100% line coverage of the new
    module.
  - >-
    Run the selection-budget prediction against the real touched set, record the number in the
    handoff, and frame it as WEAK EVIDENCE citing rec-3677 -- never as a pass.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55). If any step forces the floor to execute, replay or mutate anything, STOP:
    constraint 4 makes that a re-scope, not a fix.
  - >-
    Author the two graduation shards for the graduate-disposition steps through
    scripts.verification_graduation (never by hand-writing YAML), and confirm
    validate_graduation_completeness and validate_verification_registry both pass.
  - 'Report: what was implemented, verification results, the measured fleet conformance, and the recorded selection-budget number.'
work_areas: []
rollback: >-
  Single-commit revert. The floor is additive and self-contained: reverting removes the check module,
  its Entry, its taxonomy row, its mirror test and its two graduation shards, and the fleet returns to
  the pre-change state with no data migration and no residue. The one edit with independent value is
  the scripts/test_coverage_checker.py concern-split registration, which fixes a live false negative
  that predates this plan -- if the floor is reverted, keep that line and its two map assertions.
