minated by pytest-running test_selector rows). THE MARGIN: selection_budget's own non-test half is a measured constant (_PREDICT_NON_TEST_LOW 51.014 / _PREDICT_NON_TEST_HIGH 71.766) fitted on PRs that add zero or one shard, so this plan's seven-shard differential is spent ON TOP of it -- 51.0-71.8s baseline + 0.9s floor + 12.5-49.7s differential = ~64-122s of the 240s unwaivable half, 27-51% of it, leaving ~118-176s of margin. Not a predicted breach on either figure, but it is this plan's largest non-test draw and it outweighs the floor the declaration was originally written to govern, so it is declared rather than discovered."
