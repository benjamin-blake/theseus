y.py's canonical 'registering a new check touches SEVEN surfaces' docstring, surface (6). Extending it is the amendment_forms-shaped move at zero header cost. THE HOME IS NOT DRIFT-FREE AND THIS PLAN DOES NOT CLAIM IT IS: docs/contracts/plan-obligations.yaml already restates that same enumeration as 'six' where registry.py now enumerates SEVEN -- surface (7), the Decision 170 accounting declaration, was added after the contract prose -- so the prose home has drifted once already, and this plan's surface-(6) edit widens the divergence by one more amendment the contract does not track. That drift is PRE-EXISTING, so Decision 59 routes it to rec-3726 and this plan does NOT edit docs/contracts/plan-obligations.yaml. It does not change the choice -- a new Class D contract would add a SECOND restatement to drift rather than removing the first -- but it is the honest form of 'the home already exists'. This also sidesteps the live numbering race: two concurrent slices took 184 and 185 from this run's keystone and forced a 55-occurrence renumber across five files -- minting nothing cannot be raced."
  - "SELECTION BUDGET, MEASURED THIS SESSION AGAINST THIS PLAN'S OWN SCOPE TABLE, and DECLARED here because the tool itself directs it. `bin/venv-python -m scripts.checks.deps.selection_budget --plan docs/plans/PLAN-red-case-floor.yaml` at 45d4afb8 (RE-RUN after the two shard scope-row deletions; the earlier 11 was the pre-deletion count and every other quantity below reproduces exactly): scope 9 paths | n_selected 205 (census 561) | test-execution allowance 410s | non-test budget 240s | predicted CI test half 164.7-210.2s | predicted CI elapsed 215.7-281.9s | PREDICTED OUTCOME breadth_waived. Those two quantities ARE Decision 182's two-term contract (clause 1: NON_TEST_BUDGET_SECONDS = 240 on the non-test half, max(180, 2.0 x min(n_selected, census)) on the pytest_diff half), and the branch order in clause 4 is why the expected breadth_waived verdict is not a free pass: the non-test half outranks every waiver, so the waiver covers only the test half. The floor itself lands in the UNWAIVABLE half (VP step 7). Decision 182 clause 1 NEGATES Decision 153 point 3's single 300s aggregate, so 153 is not the budget authority anywhere in this plan. The tool's own declare-or-split verdict is KEEP THE SCOPE AND DECLARE THE MEASURED BREADTH, so the waiver is expected and reviewed here rather than discovered in CI -- this paragraph is that declaration. THE PREDICTION IS WEAK EVIDENCE AND MUST NOT BE READ AS A PASS (rec-3677): selection_budget's allowance is max(180, 2.0 * n_selected), a LINEAR PER-MODULE rate that is structurally blind to WHICH modules are selected, and a sibling plan in this same run predicted a 47-54s test half against which CI measured 467.8s -- a 9x miss. The breadth is structural, not sloppy scoping: 205 of 561 test modules select because scripts/checks/registry.py and scripts/test_coverage_checker.py are both high-fan-in and the new check's pre_globs (scripts/checks/**, tests/checks/**) are broad BY NECESSITY -- the check fleet IS this slice's subject, so