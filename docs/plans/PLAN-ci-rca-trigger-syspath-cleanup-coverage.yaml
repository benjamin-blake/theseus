    purpose: >-
      Add test_sys_path_cleanup_branch_exercised to TestValidateCiRcaTrigger, parametrized over
      the guard's success and raising exits, which runs the check with ROOT absent from sys.path
      and asserts ROOT is injected during the guard call and removed afterwards -- covering line 34,
      the only uncovered statement.
