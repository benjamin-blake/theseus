infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts/checks/ci_guards/validate_ci_rca_trigger.py measures 100% per-file line coverage under
    scripts.test_coverage_checker --check-coverage (94.7%, missing [34], at planning time).
  - >-
    With ROOT removed from sys.path before the call, ROOT is present on sys.path while
    _check_ci_rca_filter runs and absent after validate_ci_rca_trigger returns, on both the success
    exit and the exception exit.
  - >-
    rec-4159's own acceptance command passes verbatim (it runs the single node id with
