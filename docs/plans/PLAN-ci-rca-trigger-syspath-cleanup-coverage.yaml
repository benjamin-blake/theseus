    behavior: >-
      validate_ci_rca_trigger's finally-block removes a ROOT it injected, on both the success and
      the exception exit, so the sys.path cleanup stays exercised and the file stays at 100%.
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_trigger.py::TestValidateCiRcaTrigger::test_sys_path_cleanup_branch_exercised
    red_green_expectation: >-
