    body -- hence the two-exit parametrization).
  - >-
    The full tier (bin/venv-python -m scripts.validate) exits 0 locally before the PR is opened.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run rec-4159's acceptance command verbatim -- the rec's closure oracle, replayed by ci.yml's
      trailer-acceptance-evaluate job. The node id does not exist today, so this is a genuine
      red-before probe (verified at planning time: pytest "not found").
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_trigger.py::TestValidateCiRcaTrigger::test_sys_path_cleanup_branch_exercised --cov=scripts.checks.ci_guards.validate_ci_rca_trigger --cov-fail-under=100 -q
    expected: >-
      exit 0; 2 passed; total coverage 100%. Before the change pytest reports the node id not found.
    fix_if: >-
      Node id does not resolve -- rename to match rec-4159 verbatim, never edit the rec. Coverage
      under 100% -- one parametrization is not reaching its exit; read the Missing column.
    hermetic: true
    expected_literals: ["2 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-trigger-syspath-cleanup-exercised
  - step: 2
    phase: pre-deploy
    action: >-
      Assert 100% per-file coverage through the same baseline-aware code path the full-tier gate
      uses (validate_test_coverage -> check_per_file_coverage). Standalone the tool prints
      DIAGNOSTIC VERDICT; step 3 runs the authoritative gate.
    command: bin/venv-python -m scripts.test_coverage_checker --check-coverage --files scripts/checks/ci_guards/validate_ci_rca_trigger.py
    expected: >-
      exit 0. Today it exits 1 reporting 94.7% line coverage, missing lines [34].
    fix_if: >-
      Still short of 100%: add the covering assertion. Never add a config/coverage_baseline.yaml
      entry (Decision 181 gate-weakening; Decision 159 clause 3 tamper guard).
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an already-permanent gate. validate_test_coverage enforces this identical per-file
      oracle in the full tier for any diff touching the file; step 1's graduated test_selector shard
      covers the residual case (the test deleted without the source being touched).
  - step: 3
    phase: pre-deploy
    action: >-
      Discharge the handoff obligation with a real full-tier run to completion, reading the
      Validation Summary. Non-execution of this tier before #1358 merged is how the escape landed.
    command: bin/venv-python -m scripts.validate
    expected: exit 0; no "Coverage below 100%" entry in the Validation Summary.
    fix_if: >-
      A full-tier failure in this plan's scope is fixed on the branch. Never skip a test, relax an
      assertion, or add a baseline or budget entry. A failure outside scope becomes a rec via
      scripts.ops_data_portal (Decision 59, Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-
      After squash-merge with a "Resolves: rec-4159" trailer, confirm the trailer-closure job
      closed the rec in the warehouse (closure obligation for a rec-resolving plan).
    command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=f('rec-4159'); print(r['status']); assert r['status']=='closed'"
    expected: >-
      prints closed; exit 0.
    fix_if: >-
      Still open: read the trailer-closure job log. On a transport or merge-leg refusal use the
      sanctioned --update-rec fallback with --closure-artifact shard:ci-rca-trigger-syspath-cleanup-exercised;
      on an acceptance-verdict refusal use only the printed close_proposed command (git-ops.yaml
      resolves_trailer). Never edit the local cache.
    hermetic: false
    graduation: not-applicable
test_obligations:
