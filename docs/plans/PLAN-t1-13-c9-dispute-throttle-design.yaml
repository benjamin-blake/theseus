schema_version: 5
slug: "t1-13-c9-dispute-throttle-design"
intent: >-
  Stage, for the operator, everything needed to close T1.13 exit criterion c9 (CI-RCA failure-category
  integrity) without building or closing anything this week: re-derive as executable evidence that c9's
  sole remaining blocker is part (a)'s unbuilt dispute-frequency throttle (owner rec-2415) and that its
  calibration data cannot accrue in warn mode, then stage the throttle design, both c9 closeout branches
  and the T1.13 re-grounding. Nothing is implemented, filed, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-t1-13-c9-dispute-throttle-design.yaml
phase: >-
  Platform tier T1, tier_item T1.13 (CI-RCA methodology contract, in_progress), criterion c9 only. c2, c3
  and c5 stay open and are out of scope; check_absent (c9 part (c)) is owned by rec-3666, not this plan.
scope:
  - file: docs/plans/PLAN-t1-13-c9-dispute-throttle-design.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record and staged
      closeout pointers (context), and the gating constraints.
  - file: docs/plans/reports/REPORT-t1-13-c9-dispute-throttle-design.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): throttle
      design, Decision 210 home analysis, rec-2415 spec drift, implementation outline, staged c9 closeout
      branches and the staged T1.13 re-grounding. Separate file because the design would push this plan's
      context past its 40-line budget.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The throttle is shown unbuilt: no throttle marker or throttle/cap/rate-limit/frequency/window wording near
    "dispute" exists under scripts/ or src/, and rec-2415's acceptance test
    test_dispute_rate_limit_blocks_excess_disputes does not exist in tests/ops_data_portal/test_ci_rca_dispute.py
    (VP step 1).
  - >-
    The calibration gap is shown structural: CI_RCA_STRICT_MODE is warn, and the ci-rca agent prompt never
    mentions disputes while loading only the ci_rca guidance (VP step 2).
  - >-
    c9's state is shown as staged: c9 is open, its text names rec-3666 and "stays open on part (a)", it cites
    no retired path (VP step 3); and every fact the staged c9 text asserts holds, statically (part (a)'s first
    conjunct, part (b)'s three shards and two taxonomy categories, part (c)'s exact escape_mode value set
    without check_absent; VP step 4) and behaviourally (the shards pass, the derivation returns all three
    modes, check-3 cross-checks escape_mode; VP step 5).
  - >-
    The staged re-grounding's premises hold: docs/INTENT-ci-rca-methodology.md and
    docs/intent-migration/MANIFEST.yaml are absent while c2's text and the T1.13 note still cite the INTENT
    doc, the staged note line is not yet present, and all 11 T1.13 files_in_scope paths exist (VP step 6).
  - >-
    The placement premise for the future implementation holds: scripts/ops_data_portal.py is at or under
    500 SLOC by the validate_sloc_limits rule with no budget entry (VP step 7).
  - The plan validates against the PlanDocument schema (VP step 8).
  - >-
    The branch diff against origin/main is exactly the plan and report files, with no closes_criteria,
    roadmap, code, contract or DECISIONS edit (VP step 9).
  - >-
    The staged texts are apply-time safe: report sections 3-4 open with a precondition to re-run VP 1-7 at
    apply time, and VP 3 and VP 6 each detect their own row's already-applied state.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the dispute-frequency throttle is unbuilt (portal and writer trees) and rec-2415's acceptance test does not exist
    command: >-
      bin/venv-python -c "import pathlib,re; M=re.compile(r'CI_RCA_DISPUTE_[A-Z]');
      R=re.compile(r'dispute.{0,30}(rate.?limit|throttl|frequency|\bcap\b|window)|(rate.?limit|throttl|frequency|\bcap\b).{0,30}dispute',re.I);
      F=[p for r in ('scripts','src') for p in pathlib.Path(r).rglob('*.py')];
      n=sum(1 for p in F if (lambda x: M.search(x) or R.search(x))(p.read_text(encoding='utf-8',errors='ignore')));
      t='test_dispute_rate_limit_blocks_excess_disputes' in pathlib.Path('tests/ops_data_portal/test_ci_rca_dispute.py').read_text(encoding='utf-8');
      print('throttle_files=' + str(n) + ' acceptance_test_present=' + str(t))"
    expected: >-
      One line reporting zero throttle files across scripts/ and src/ (portal pre-check and writer homes) and
      the acceptance test absent.
    fix_if: >-
      A non-zero count or a present test means the throttle (or a marker under another name) landed after this
      plan was drafted -- stop and re-run the freshness gate's silent-completion check; the staged closeout
      branch (i) may then apply.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for a future implementation, true only until the throttle lands; graduating it would
      install a standing guard that the sanctioned fix itself must break.
    expected_literals: ["throttle_files=0 acceptance_test_present=False"]
  - step: 2
    phase: pre-deploy
    action: Prove dispute traffic is not prompted today (warn mode, no automated producer)
    command: >-
      bin/venv-python -c "import pathlib,yaml; m=yaml.safe_load(open('config/feature_flags.yaml'))['CI_RCA_STRICT_MODE'];
      a=pathlib.Path('.claude/agents/scheduled/ci-rca.md').read_text(encoding='utf-8');
      print('strict_mode=' + m + ' agent_dispute_mentions=' + str(a.lower().count('dispute')) + ' agent_loads_ci_rca_guidance=' + str('--guidance --source ci_rca' in a))"
    expected: >-
      One line: strict mode is warn, the agent prompt mentions disputes zero times, and it loads the ci_rca
      guidance (the zero mention count also rules out a ci_rca_evidence_dispute guidance load).
    fix_if: >-
      strict_mode=strict or a non-zero mention count means the calibration premise moved: dispute traffic may
      now exist, so re-read rec-2415 and the dispute_count gauge before keeping N unset in the report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Describes a transient rollout state (warn mode until the c2 strict flip); the c2 flip and any prompt
      change are sanctioned future edits a standing guard would wrongly block.
    expected_literals: ["strict_mode=warn agent_dispute_mentions=0 agent_loads_ci_rca_guidance=True"]
  - step: 3
    phase: pre-deploy
    action: Prove c9 is open, names rec-3666, holds open on part (a), and cites no retired path
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8'));
      it=[i for i in d['tier_items'] if i['id']=='T1.13'][0]; c=[x for x in it['exit_criteria'] if x['id']=='c9'][0];
      t=' '.join(c['text'].split());
      print('item=' + it['status'] + ' c9=' + c['status'] + ' names_rec_3666=' + str('rec-3666' in t) + ' holds_on_part_a=' + str('stays open on part (a)' in t) + ' cites_retired=' + str('INTENT-' in t or 'MANIFEST' in t))"
    expected: >-
      One line: item in_progress, c9 open, rec-3666 named, the part (a) holding line present, no retired
      path cited.
    fix_if: >-
      c9 met, or holds_on_part_a=False with c9's text naming "dispute write path", means a staged closeout
      branch (report section 3) was already applied -- withdraw the staged closeout. A missing rec-3666 or
      part (a) line otherwise means the 2026-09-06 re-grounding moved; re-derive which part holds c9 open
      before keeping section 3 of the report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts an open criterion's current text, which the staged closeout itself is meant to change; the
      durable roadmap invariants (valid statuses, resolvable ids) are already standing roadmap checks.
    expected_literals: ["item=in_progress c9=open names_rec_3666=True holds_on_part_a=True cites_retired=False"]
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the static facts the staged c9 text asserts: part (a)'s first conjunct, part (b)'s three registry
      shards and two taxonomy categories, and part (c)'s exact escape_mode value set (check_absent absent)
    command: >-
      bin/venv-python -c "import pathlib,re,typing; from scripts.ops_portal.ci_rca_schema import CiRcaEvidenceDispute as D, _DetectionGap as G;
      s=lambda m: ' '.join(str(getattr(x,'pattern','')) for x in m);
      p=s(D.model_fields['disputed_field'].metadata); f=G.model_fields['escape_mode'];
      L={x for a in typing.get_args(f.annotation) for x in (typing.get_args(a) or (a,)) if isinstance(x,str)};
      E=set(re.findall('[a-z_]+',s(f.metadata))) | L;
      S=('ci-rca-priority-zero-outranks-step-name','ci-rca-generator-consumes-validation-result','ci-rca-validation-result-uploads-always');
      n=sum(pathlib.Path('config/agent/verification_registry/entries/'+x+'.yaml').exists() for x in S);
      T=pathlib.Path('config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8');
      k=sum(bool(re.search(r'^\s*- '+c+r'\s*\n',T,re.M)) for c in ('test_collection_empty','gate_escape'));
      print('failure_category_disputable=' + str('failure_category' in p) + ' part_b_shards=' + str(n) + '/3 part_b_categories=' + str(k) + '/2 escape_values=' + ','.join(sorted(E)) + ' check_absent_in_enum=' + str('check_absent' in E))"
    expected: >-
      One line: failure_category is a disputed_field value, all three part (b) shards exist, both taxonomy
      categories are listed, the escape_mode value set is exactly check_ran_vacuously,
      no_premerge_gate_by_design, tier_misplaced and undetermined (read from the pattern or, if the field
      becomes a Literal, from its type arguments), and check_absent is not among them.
    fix_if: >-
      An ImportError naming _DetectionGap means the model was renamed -- locate the escape_mode field in
      scripts/ops_portal/ci_rca_schema.py and re-point the import. Fewer than 3 shards or 2 categories means
      part (b) moved -- re-ground report section 3's part (b) clause. A different value set means part (c)
      moved (check_absent present means rec-3666 landed) -- update section 3's part (c) wording.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The check_absent half is red-before evidence for rec-3666's own future fix; the failure_category half
      is already guarded by tests/ops_data_portal/test_ci_rca_dispute.py, and the shards are themselves the
      standing registry guards for part (b).
    expected_literals: ["failure_category_disputable=True part_b_shards=3/3 part_b_categories=2/2 escape_values=check_ran_vacuously,no_premerge_gate_by_design,tier_misplaced,undetermined check_absent_in_enum=False"]
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the behavioural facts the staged c9 text asserts: part (b)'s three shards pass their own
      check_spec commands, part (c)'s derivation returns all three escape modes, and check-3 cross-checks
      escape_mode
    command: >-
      bin/venv-python -c "import pathlib,subprocess,yaml;
      S=('ci-rca-priority-zero-outranks-step-name','ci-rca-generator-consumes-validation-result','ci-rca-validation-result-uploads-always');
      ok=sum(subprocess.run(yaml.safe_load(open('config/agent/verification_registry/entries/'+x+'.yaml'))['check_spec']['command'],capture_output=True).returncode==0 for x in S);
      V=pathlib.Path('scripts/ci_rca/vacuous_pass.py').read_text(encoding='utf-8');
      r=sum(('return '+chr(34)+v+chr(34)) in V for v in ('check_ran_vacuously','tier_misplaced','no_premerge_gate_by_design'));
      x='[CI_RCA_CROSS_CHECK check-3]' in pathlib.Path('scripts/ops_portal/ci_rca_runtime.py').read_text(encoding='utf-8');
      print('part_b_shards_pass=' + str(ok) + '/3 part_c_derivation=' + str(r) + '/3 part_c_cross_check=' + str(x))"
    expected: >-
      One line: all three shard commands exit 0, compute_escape_mode returns each of the three escape modes,
      and the check-3 cross-check marker is present.
    fix_if: >-
      A failing shard means part (b)'s regression guard is red -- the staged part (b) clause no longer
      adjudicates true; stop and report it. Fewer than 3 derivation returns or a missing check-3 marker means
      part (c) moved -- re-ground report section 3's part (c) clause.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Re-runs registry shards that already run as standing guards, plus a static scan of two functions those
      same shards and the escape-mode tests cover; a further registry row would duplicate them.
    expected_literals: ["part_b_shards_pass=3/3 part_c_derivation=3/3 part_c_cross_check=True"]
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the staged re-grounding's premises (retired docs absent, still cited, note line not yet applied;
      files_in_scope exist)
    command: >-
      bin/venv-python -c "import pathlib,yaml; P=('docs/INTENT-ci-rca-methodology.md','docs/intent-migration/MANIFEST.yaml');
      d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); it=[i for i in d['tier_items'] if i['id']=='T1.13'][0];
      c2=[x for x in it['exit_criteria'] if x['id']=='c2'][0]['text'];
      print('retired_absent=' + str(sum(not pathlib.Path(p).exists() for p in P)) + '/2 c2_cites_intent=' + str('INTENT-ci-rca-methodology' in c2) + ' note_cites_intent=' + str('INTENT-ci-rca-methodology' in it['note']) + ' note_has_d178_line=' + str('retired by Decision 178' in it['note']) + ' files_in_scope_exist=' + str(sum(pathlib.Path(f).exists() for f in it['files_in_scope'])) + '/' + str(len(it['files_in_scope'])))"
    expected: >-
      One line: both retired files absent, c2 and the note still cite the INTENT doc, the staged dated note
      line is not yet present, and all 11 files_in_scope paths exist.
    fix_if: >-
      A retired file present means it was restored -- drop that row from section 4. c2_cites_intent=False
      means the c2 row was already applied -- drop it. note_has_d178_line=True means the note row was already
      applied -- drop it (never append it twice). Fewer than 11 existing paths means a surface moved -- add a
      files_in_scope row to section 4.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The citation flags are true only until the staged re-grounding is applied; a standing guard would block
      the sanctioned edit. Restoring the retired INTENT doc is already caught by validate_placement (docs-root
      allowlist) and validate_prose_allowlist (Decision 127).
    expected_literals: ["retired_absent=2/2 c2_cites_intent=True note_cites_intent=True note_has_d178_line=False files_in_scope_exist=11/11"]
  - step: 7
    phase: pre-deploy
    action: Measure scripts/ops_data_portal.py SLOC by the validate_sloc_limits rule and confirm no budget entry
    command: >-
      bin/venv-python -c "import pathlib; L=pathlib.Path('scripts/ops_data_portal.py').read_text(encoding='utf-8').splitlines();
      s=len([x for x in L if x.strip() and not x.strip().startswith('#')]);
      b='scripts/ops_data_portal.py' in pathlib.Path('config/sloc_budgets.yaml').read_text(encoding='utf-8');
      print('sloc=' + str(s) + ' under_limit=' + str(s<=500) + ' budget_entry=' + str(b))"
    expected: >-
      One line: sloc 489 at 2349d467, under the 500 limit, no budget entry. The report's placement line
      defines the future call site's headroom as 500 minus this step's printed sloc, so the value is read
      fresh at apply time rather than pinned.
    fix_if: >-
      under_limit=False or a budget entry means the placement premise changed; re-derive the headroom in the
      report before the implementing plan is authored.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_sloc_limits already enforces the 500 limit in both tiers; this step only records the headroom
      the future plan must respect.
    expected_literals: ["under_limit=True budget_entry=False"]
  - step: 8
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-t1-13-c9-dispute-throttle-design.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan
      row duplicates it.
  - step: 9
    phase: pre-deploy
    action: Confirm the change is exactly the plan and report files
    command: git fetch --quiet origin main && git log --name-only --format= origin/main..HEAD
    expected: >-
      The only non-blank paths listed (possibly repeated, once per branch commit) are the plan file and
      docs/plans/reports/REPORT-t1-13-c9-dispute-throttle-design.md; merge-from-main commits list no paths.
    fix_if: >-
      Any other path means scope leaked; revert it (the closeout and re-grounding are staged in the report,
      applied only by the operator).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan or report file.
    hermetic: false
    graduation: not-applicable
