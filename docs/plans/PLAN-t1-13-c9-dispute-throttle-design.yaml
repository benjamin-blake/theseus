  - >-
    docs/ROADMAP-PLATFORM.yaml stays out of scope: it is a data-pipeline Lambda asset (Decision 79/125), and
    the charter stages roadmap evidence in the plan. Report sections 3-4 carry the exact staged text.
  - >-
