schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ambient-prose-contract-relocation"
intent: >-
  Close T2.56 c1 by relocating the two largest blocks of procedural / field-semantics prose out of
  the genuinely-ambient instruction surfaces (S1 root load-set, S2 terraform/CLAUDE.md) into
  declared Class D contracts, leaving machine-enforced norms plus resolvable pointers, and
  ratcheting config/prose_budgets.yaml down so the shrink is durable.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ambient-prose-contract-relocation.yaml
phase: >-
  T2.56 Normative / contract / ADR layering -- follow-on closing the last open criterion (c1);
  c2 was met 2026-08-31 by PLAN-decision-corpus-stock-ceiling-retirement / Decision 179.
closes_criteria:
  - "T2.56:c1"
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Relocate '## Git-ops procedure', '## Merge protocol', '## Operational runbooks' and the
      duplicated body of '## Data-modeling default' to pointers; add the MCP-over-CLI rule to
      '## Shell invocations' (rec-3301); fix the bare python -m invocation (rec-2345).
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: Relocate '## Running terraform/personal/ on CC-web' (20,921b) to a pointer.
  - file: docs/contracts/git-ops.yaml
    action: Create
    purpose: >-
      Declared Class D contract carrying the relocated git-ops procedure and merge protocol. Its
      subject is declared as the GitHub-surface operations plane INCLUDING CI credential
      provisioning, so the relocated OAuth-token procedure block sits inside the subject it
      declares rather than stretching past it (Decision 127 points 2-3; CFG-05 overbroad-subject risk).
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Create
    purpose: Declared Class D contract carrying the relocated CC-web terraform operating procedure.
  - file: scripts/checks/contracts/validate_git_ops_contract.py
    action: Create
    purpose: Evaluator -- AGENTS.md carries a resolvable pointer to the contract and every repo path the contract names exists.
  - file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
    action: Create
    purpose: Evaluator -- terraform/CLAUDE.md carries a resolvable pointer and every repo path the contract names exists.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Entry rows registering both new checks in the contracts domain.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category rows for both new checks.
  - file: tests/checks/contracts/test_validate_git_ops_contract.py
    action: Create
    purpose: Mirror test -- pointer removal and a dangling contract path each fail the check.
  - file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    action: Create
    purpose: Mirror test -- same two failure modes for the terraform contract.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Ratchet S1 root_ambient_load_set and S2 terraform/CLAUDE.md down to the post-relocation sizes (decreases, unrestricted).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: Register both new contracts as discovery topics.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: Repoint two 'AGENTS.md ## Git-ops procedure' references to the contract.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: Repoint two 'AGENTS.md ## Git-ops procedure' references to the contract.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Repoint the git-ops reference to the contract.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: Repoint the git-ops reference to the contract.
  - file: .claude/commands/audit.md
    action: Modify
    purpose: Repoint two git-ops references to the contract.
  - file: .claude/hooks/never_on_main.py
    action: Modify
    purpose: Repoint the block-message git-ops reference to the contract.
  - file: .claude/hooks/fresh_branch_base.py
    action: Modify
    purpose: Repoint the block-message git-ops reference to the contract.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Re-ground T2.56 files_in_scope (drop c2 residue) and record the c1 progress note.
bundled_recommendations:
  - rec-2984
  - rec-3301
  - rec-2345
infrastructure_dependencies: []
acceptance_criteria:
  - S1 (root ambient load-set) measures <= 18,000 bytes, down from 25,925, and config/prose_budgets.yaml root_ambient_load_set is re-seeded at the new measured size.
  - AGENTS.md retains a one-line trigger for each git-ops flow step (branch rule, presubmit tier, squash-merge, never-poll wake, Resolves trailer) so a non-Claude harness reading AGENTS.md alone still inherits the universal rules rather than only a file path (Decision 139).
  - AGENTS.md still carries the docs/contracts/ci-rca-lifecycle.yaml and docs/contracts/decision-entry.yaml pointers, which today exist ONLY inside the relocated ranges (Decision 181 declare-your-coverage).
  - terraform/CLAUDE.md measures <= 12,500 bytes, down from 29,485, and its prose_budgets entry is re-seeded at the new measured size.
  - The surviving terraform/CLAUDE.md stub is sufficient for the ROUTINE terraform loop on its own (hard rules, AWS context, the deployment-model channel table, and the never-self-directed-apply norm) and states explicitly WHEN the contract must be read, so the relocation removes ambient load rather than forcing two-file reassembly (Decision 114 anti-fragmentation; T2.41 quarantine precedent).
  - Both new contracts measure under 500 effective lines and 2,000 characters longest-line (Decision 166 contracts class); neither is added to the one-time grandfather roster.
  - Both new contracts declare contract.class D with status ratified and a resolving evaluator, so contract-population.yaml grandfathered_max and status_active_max stay 16 with no raise-approved marker.
  - Every repo file path named in the relocated AGENTS.md and terraform/CLAUDE.md prose at origin/main is still named in the new contracts (no content lost in transit).
  - Every live inbound pointer to 'AGENTS.md ## Git-ops procedure' outside append-only surfaces resolves to docs/contracts/git-ops.yaml.
  - AGENTS.md still carries the machine-enforced norms it must keep ambient - the never-on-main rule, the harness-branch rule, and the ci-rca do-not-manually-patch norm.
  - rec-2984, rec-3301 and rec-2345 acceptance commands all pass, and each rec reaches status closed after merge.
  - bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure the S1 ambient shrink.
    command: 'bin/venv-python -c "from scripts.preflight.prose_context import measure_prose_context as m; b=m()[''S1''][''prose_bytes'']; print(b); raise SystemExit(0 if b <= 18000 else 1)"'
    expected: Prints a byte count <= 18000 (was 25925) and exits 0.
    fix_if: Exit 1 - relocation left more prose ambient than planned; move the remaining procedural body into the contract.
    graduation: graduate
    graduation_check_id: prose-s1-ambient-bytes-under-18000
    hermetic: true
  - step: 2
    phase: pre-deploy
    action: Measure the terraform/CLAUDE.md shrink.
    command: 'bin/venv-python -c "from scripts.preflight.prose_context import measure_prose_context as m; f={x[''path'']:x[''prose_bytes''] for x in m()[''S2''][''files'']}; b=f[''terraform/CLAUDE.md'']; print(b); raise SystemExit(0 if b <= 12500 else 1)"'
    expected: Prints a byte count <= 12500 (was 29485) and exits 0.
    fix_if: Exit 1 - the CC-web runbook was not fully relocated.
    graduation: graduate
    graduation_check_id: prose-s2-terraform-claude-md-bytes-under-12500
    hermetic: true
  - step: 3
    phase: pre-deploy
    action: Prove no named repo path was lost relocating the AGENTS.md git-ops body.
    command: 'bin/venv-python -c "import re,subprocess,pathlib; o=subprocess.run([''git'',''show'',''origin/main:AGENTS.md''],capture_output=True,text=True).stdout; s=o.split(chr(10)+''## Git-ops procedure''+chr(10))[1].split(chr(10)+''## Instruction architecture''+chr(10))[0]; want=set(re.findall(r''[A-Za-z0-9_./-]+\.(?:tfvars|tfstate|yaml|yml|hcl|json|tfrc|py|md|sh|tf)(?![A-Za-z0-9])'',s)); got=pathlib.Path(''docs/contracts/git-ops.yaml'').read_text()+pathlib.Path(''AGENTS.md'').read_text(); lost=sorted(x for x in want if x not in got); print(''LOST:'',lost); raise SystemExit(1 if lost else 0)"'
    expected: 'Prints LOST: [] and exits 0.'
    fix_if: A non-empty list names paths dropped in transit - add them to the contract.
    graduation: graduate
    graduation_check_id: git-ops-relocation-no-path-loss
    hermetic: true
  - step: 4
    phase: pre-deploy
    action: Prove no named repo path was lost relocating the terraform CC-web runbook.
    command: 'bin/venv-python -c "import re,subprocess,pathlib; o=subprocess.run([''git'',''show'',''origin/main:terraform/CLAUDE.md''],capture_output=True,text=True).stdout; s=o.split(chr(10)+''## Running terraform/personal/ on CC-web'')[1].split(chr(10)+''## Out-of-band IAM grants'')[0]; want=set(re.findall(r''[A-Za-z0-9_./-]+\.(?:tfvars|tfstate|yaml|yml|hcl|json|tfrc|py|md|sh|tf)(?![A-Za-z0-9])'',s)); got=pathlib.Path(''docs/contracts/terraform-cc-web-operations.yaml'').read_text()+pathlib.Path(''terraform/CLAUDE.md'').read_text(); lost=sorted(x for x in want if x not in got); print(''LOST:'',lost); raise SystemExit(1 if lost else 0)"'
    expected: 'Prints LOST: [] and exits 0.'
    fix_if: A non-empty list names paths dropped in transit - add them to the contract.
    graduation: graduate
    graduation_check_id: terraform-cc-web-relocation-no-path-loss
    hermetic: true
  - step: 5
    phase: pre-deploy
    action: Prove no live surface still points at the retired AGENTS.md section (append-only and historical surfaces excluded).
    command: "! grep -rn 'AGENTS.md .## Git-ops procedure\\|AGENTS.md ..Git-ops procedure' --include='*.md' --include='*.py' --include='*.yaml' .claude docs/contracts scripts terraform config"
    expected: No matches; exits 0. docs/DECISIONS.md, DECISIONS_ARCHIVE.md, audits/ and docs/plans/ are deliberately out of scope - live decision bodies are append-only immutable and historical artefacts are frozen.
    fix_if: A match names a live surface still pointing at the retired section - repoint it to docs/contracts/git-ops.yaml.
    graduation: graduate
    graduation_check_id: no-live-pointer-to-retired-git-ops-section
    hermetic: true
  - step: 6
    phase: pre-deploy
    action: Confirm both harness hooks name the new git-ops authority instead of the retired AGENTS.md section.
    command: "! grep -n 'AGENTS.md' .claude/hooks/never_on_main.py && ! grep -n 'AGENTS.md' .claude/hooks/fresh_branch_base.py && grep -q 'git-ops.yaml' .claude/hooks/never_on_main.py && grep -q 'git-ops.yaml' .claude/hooks/fresh_branch_base.py"
    expected: No AGENTS.md reference remains in either hook and both name docs/contracts/git-ops.yaml; exits 0.
    fix_if: A hook still points at the retired section, so an agent blocked on main is sent to a pointer that no longer resolves.
    graduation: graduate
    graduation_check_id: hooks-name-git-ops-contract
    hermetic: true
  - step: 7
    phase: pre-deploy
    action: Exercise both new evaluators red-then-green via their mirror tests.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_git_ops_contract.py tests/checks/contracts/test_validate_terraform_cc_web_operations.py tests/checks/contracts/test__manifest.py -q
    expected: All tests pass, including the pointer-removed and dangling-path cases that must FAIL the check.
    fix_if: A failure case passes the check - the evaluator is not actually guarding the pointer or the named paths.
    graduation: graduate
    graduation_check_id: contract-pointer-evaluators-mirror-tests
    hermetic: false
  - step: 8
    phase: pre-deploy
    action: Confirm both new contracts land in the declared census bucket, leaving the population pins untouched.
    command: 'bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)" && git diff origin/main -- docs/contracts/contract-population.yaml | grep -E ''^\+.*(grandfathered_max|status_active_max)'' && exit 1 || exit 0'
    expected: validate_contract_drift passes and no pin line was changed; exits 0.
    fix_if: A pin moved - the new contracts are being bucketed as grandfathered; give them status ratified and a genuinely-resolving evaluator instead of raising the pin.
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift is already a registered check running in both tiers; graduating a
      second copy of it would duplicate standing enforcement. The pin-diff half is a
      this-PR-only assertion about a diff against origin/main, not a durable repo invariant.
    hermetic: false
  - step: 9
    phase: pre-deploy
    action: Confirm the prose ratchet is green at the re-seeded budgets and that AGENTS.md keeps its machine-enforced norms.
    command: 'bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)" && grep -q ''never edit or commit on `main`'' AGENTS.md && grep -q ''claude/'' AGENTS.md && grep -q ''ci-rca'' AGENTS.md && grep -q ''docs/contracts/git-ops.yaml'' AGENTS.md && grep -q ''docs/contracts/ci-rca-lifecycle.yaml'' AGENTS.md && grep -q ''docs/contracts/decision-entry.yaml'' AGENTS.md'
    expected: Ratchet passes at the new budgets and all six norm/pointer greps hit; exits 0.
    fix_if: The ratchet fails (budgets not re-seeded) or a grep misses - a machine-enforced norm, or a contract pointer that exists ONLY in the relocated range, was removed instead of retained.
    graduation: graduate
    graduation_check_id: agents-md-retains-enforced-norms-and-pointer
    hermetic: true
  - step: 10
    phase: pre-deploy
    action: Run each bundled recommendation's own acceptance command.
    command: '(grep -q "^## Operational runbooks" AGENTS.md && exit 1 || exit 0) && sed -n "/## Shell invocations/,/## Safety/p" AGENTS.md | grep -q "gh CLI" && sed -n "/## Shell invocations/,/## Safety/p" AGENTS.md | grep -q "mcp__github" && ! grep -qE "(^|[^-])python -m scripts\.sync\.ops" AGENTS.md'
    expected: All three acceptance conditions hold; exits 0.
    fix_if: A clause fails - the corresponding rec (rec-2984 / rec-3301 / rec-2345) is not actually satisfied.
    graduation: graduate
    graduation_check_id: bundled-recs-acceptance-agents-md
    hermetic: true
  - step: 11
    phase: pre-deploy
    action: Measure both new contracts against the Decision 166 contracts-class structural limits.
    command: 'bin/venv-python -c "import pathlib; bad=[]; [bad.append((str(f),n,m)) for f in (pathlib.Path(''docs/contracts/git-ops.yaml''),pathlib.Path(''docs/contracts/terraform-cc-web-operations.yaml'')) for n,m in [(sum(1 for l in f.read_text().splitlines() if l.strip() and not l.lstrip().startswith(''#'')), max((len(l) for l in f.read_text().splitlines()), default=0))] if n > 500 or m > 2000]; print(bad); raise SystemExit(1 if bad else 0)"'
    expected: Prints [] and exits 0 - each contract is under 500 effective lines and 2,000 characters longest-line.
    fix_if: A contract breaches a limit - decompose it (Decision 128 pattern). Never add a new entry to config/structural_size_budgets.yaml's one-time grandfather roster.
    graduation: graduate
    graduation_check_id: new-contracts-within-structural-size-class
    hermetic: true
  - step: 12
    phase: pre-deploy
    action: Run the authoritative pre-merge gate.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0.
    fix_if: Any check fails - fix on the branch before pushing.
    graduation: not-applicable
    hermetic: false
  - step: 13
    phase: post-deploy
    action: Confirm the three bundled recs closed via the Resolves trailer.
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib; r={json.loads(l)['id']:json.loads(l)['status'] for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()}; bad=[k for k in ('rec-2984','rec-3301','rec-2345') if r.get(k)!='closed']; print(bad); raise SystemExit(1 if bad else 0)"
    expected: Prints [] and exits 0.
    fix_if: A rec is still open - close it via ops_data_portal --update-rec per the AGENTS.md fallback.
    graduation: not-applicable
    hermetic: false
test_obligations:
  - source: scripts/checks/contracts/validate_git_ops_contract.py
    behavior: The check fails when AGENTS.md loses its pointer to docs/contracts/git-ops.yaml, and when the contract names a repo path that does not exist.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_git_ops_contract.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/validate_terraform_cc_web_operations.py
    behavior: The check fails when terraform/CLAUDE.md loses its pointer to the contract, and when the contract names a nonexistent repo path.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/_manifest.py
    behavior: Both new checks are reachable through the contracts-domain Entry aggregation.
    verification_step: 7
    test_selector: tests/checks/contracts/test__manifest.py
    red_green_expectation: red before the Entry rows land, green after
  - source: .claude/hooks/never_on_main.py
    behavior: The block message names the git-ops authority.
    verification_step: 6
    command: "! grep -n 'AGENTS.md' .claude/hooks/never_on_main.py"
    waiver_reason: >-
      The edit is a single user-facing message string repointed from AGENTS.md to the contract;
      the hook has no behavioural change and no existing test module. VP step 5 is the guard that
      would catch a missed or wrong repoint.
  - source: .claude/hooks/fresh_branch_base.py
    behavior: The block message names the git-ops authority.
    verification_step: 6
    command: "! grep -n 'AGENTS.md' .claude/hooks/fresh_branch_base.py"
    waiver_reason: >-
      Same message-string-only repoint; tests/hooks/test_fresh_branch_base.py covers the hook's
      behaviour and asserts nothing about this string. VP step 5 guards the repoint.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Machine-enforced norms stay ambient; only rationale, procedure and field semantics relocate. Never relocate a rule whose only enforcement is an agent reading it.
  - Never split or fragment an ambient surface into @-imported files to dodge the prose gate (Decision 114/110 anti-fragmentation) - relocation to a contract is the sanctioned relief valve, not decomposition.
  - Do not edit docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md - live entry bodies are append-only immutable (validate_live_entry_immutability); the stale git-ops pointer at DECISIONS.md:5977 stays by design.
  - Do not edit audits/ or docs/plans/ artefacts - historical outputs are frozen.
  - Both new contracts must declare contract.class D, status ratified, and a resolving evaluator, or contract-population.yaml's equality-bound pins break.
  - Each new contract must stay under 500 effective lines (config/structural_size_budgets.yaml docs/contracts class).
  - .claude/skills/planning/SKILL.md and implement/SKILL.md have 70 and 74 bytes of prose-budget headroom - the repoints must be net-neutral or shorter.
  - Both new check modules must declare examined()/skipped() (docs/contracts/check-accounting.yaml); the baseline roster is shrink-only and admits no new names.
  - Each new contract declares status ratified with ratified_via naming this plan slug (Decision 168 requires ratified_via on a ratified Class D contract); a file-router route's topic must EQUAL the contract's declared subject, and each subject must be unique against all declared subjects and ritual ids.
  - git-ops.yaml's declared subject must explicitly cover CI credential provisioning, or the relocated OAuth-token procedure sits outside the subject the contract names (Decision 127 points 2-3).
  - Retain the docs/contracts/ci-rca-lifecycle.yaml and docs/contracts/decision-entry.yaml pointers in AGENTS.md - each is one line and today exists ONLY inside a relocated range (Decision 181).
  - deploy-paths.yaml declares evaluator agent_surface AGENTS.md and resolves off the '## Safety' section, which this plan keeps untouched - do not relocate that section.
  - Keep a one-line ambient trigger per git-ops flow step so a non-Claude harness reading AGENTS.md alone still inherits the universal rules (Decision 139 portability hedge).
  - The surviving terraform/CLAUDE.md stub must serve the routine terraform loop unaided and say when the contract must be read - relocation must reduce ambient load, never force two-file reassembly (Decision 114).
  - This plan does not build the repo-wide clause-to-check traceability index - that is T2.54.
context:
  - "Decision-scout verdict + CITE list (verbatim decision ids)"
  - "gates: decision-scout=<verdict>; plan-critique=<verdict> after <N> round(s)"
  - "T2.56 c2 met 2026-08-31 (Decision 179); c1 is the last open criterion."
  - "c1's 'skills layer' clause is satisfied-by-architecture: docs/contracts/instruction-architecture.yaml places Layer 3 at load_time on_user_invocation and Layer 4 at on_skill_invocation, so .claude/commands/ and .claude/skills/ are already pointer-retrieved, not ambiently loaded."
  - "Measured baseline: S1 25,925b; terraform/CLAUDE.md 29,485b; relocatable blocks 7,575b + 750b + 2,006b + 541b (AGENTS.md) and 20,921b (terraform)."
  - "Destination convention already exists: docs/CLAUDE.md:28 and instruction-architecture.yaml's 'Human runbook / operator-prose doc' anti-pattern both route operator procedure to procedure: blocks in docs/contracts/*.yaml."
  - "Sibling boundary: T2.54 (not_started) owns the repo-wide clause-to-check traceability index; this plan builds only the two per-contract pointer-resolution guards."
  - "ci-rca deferral (operator-directed 2026-09-01): rec-3328 (terraform apply IAM/S3), rec-3293 (pytz), rec-3292 (requirements.lock extras) are unresolved. None shares a scope file, Decision Record, or failure category with this plan (prose relocation / contract registration), so no Related-Work condition is satisfied. The operator directed deferral on the basis that a separate agent is verifying all three are already resolved; if that verification lands a re-open instead, this plan does not block it."
  - "Main divergence at planning time: branch was 5 commits behind origin/main; docs/ROADMAP-PLATFORM.yaml overlaps Scope, but T2.56 is byte-identical on both refs (the five commits are unrelated T2.18/T1.13/T2.42 bookkeeping). Rebase deferred to commit-flow time per the rebase phase distinction."
  - "Decision-significance routing: this plan mints NO numbered Decision - it executes the already-ratified Decision 86/127 routing rule and adds mechanism, which routes to the contract governance-note row, not numbered_decision (decision-entry.yaml significance.routing_rule). PR body carries the DD-B routing line."
  - "Decision 139 deferral: relocating the flow to a contract weakens the non-Claude-harness portability hedge; mitigated by retaining a one-line ambient trigger per flow step rather than a bare pointer."
  - "rec-3216 already satisfied on current main (its acceptance passes); rec-2852 is substantively satisfied but its acceptance probe over-specifies. Both surfaced for closure, neither bundled."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Author docs/contracts/git-ops.yaml as a declared Class D contract carrying the relocated git-ops procedure, merge protocol, and the OAuth-token procedure block.
  - Author docs/contracts/terraform-cc-web-operations.yaml as a declared Class D contract carrying the relocated CC-web terraform operating procedure.
  - Rewrite the four AGENTS.md sections down to machine-enforced norms plus pointers; add the MCP-over-CLI rule and the bin/venv-python fix.
  - Rewrite terraform/CLAUDE.md's CC-web section down to a pointer, keeping Hard rules / AWS context / Lambda interaction.
  - Repoint every live inbound git-ops pointer in .claude/ to the new contract.
  - Add both check modules with examined()/skipped() declarations, their _manifest.py Entry rows, ci_rca_taxonomy rows, and mirror tests.
  - Register both contracts in file-router.yaml; re-seed config/prose_budgets.yaml at the new measured sizes.
  - Re-ground T2.56's files_in_scope in docs/ROADMAP-PLATFORM.yaml and record the c1 progress note.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Single-PR revert. The relocation is content-moving plus additive checks; reverting restores the
  prior ambient prose and removes the two contracts, their evaluators, and the ratcheted budgets
  together.
