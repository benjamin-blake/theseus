constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Machine-enforced norms stay ambient; only rationale, procedure and field semantics relocate. Never relocate a rule whose only enforcement is an agent reading it.
  - Never split or fragment an ambient surface into @-imported files to dodge the prose gate (Decision 114/110 anti-fragmentation) - relocation to a contract is the sanctioned relief valve, not decomposition.
  - Do not edit docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md - live entry bodies are append-only immutable (validate_live_entry_immutability); the stale git-ops pointer at DECISIONS.md:5977 stays by design.
  - Do not edit audits/ or docs/plans/ artefacts - historical outputs are frozen.
  - Both new contracts must declare contract.class D, status ratified, and a resolving evaluator, or contract-population.yaml's equality-bound pins break.
  - Each new contract must stay under 500 effective lines (config/structural_size_budgets.yaml docs/contracts class).
  - .claude/skills/planning/SKILL.md and implement/SKILL.md have 70 and 74 bytes of prose-budget headroom - the repoints must be net-neutral or shorter.
  - Both new check modules must declare examined()/skipped() (docs/contracts/check-accounting.yaml); the baseline roster is shrink-only and admits no new names.
  - Each new contract declares status ratified with ratified_via naming this plan slug (Decision 168 requires ratified_via on a ratified Class D contract); a file-router route's topic must EQUAL the contract's declared subject, and each subject must be unique against all declared subjects and ritual ids.
  - git-ops.yaml's declared subject must explicitly cover CI credential provisioning, or the relocated OAuth-token procedure sits outside the subject the contract names (Decision 127 points 2-3).
  - terraform-cc-web-operations.yaml declares a unique subject and must NOT restate environment-taxonomy.yaml's apply-model / guard classification (sole SoT) nor duplicate deploy-paths.yaml's admin_out_of_band.procedure (the ratified T2.41 quarantine destination, which declares itself never a second source of truth).
  - docs/audit-prompts/ is out of scope alongside audits/ and docs/plans/ - AUDIT-*.md are frozen composed handoff artefacts whose line-number anchors are already historical; do not repoint them.
  - Retain the docs/contracts/ci-rca-lifecycle.yaml and docs/contracts/decision-entry.yaml pointers in AGENTS.md - each is one line and today exists ONLY inside a relocated range (Decision 181).
  - deploy-paths.yaml declares evaluator agent_surface AGENTS.md and resolves off the '## Safety' section, which this plan keeps untouched - do not relocate that section.
  - Keep a one-line ambient trigger per git-ops flow step so a non-Claude harness reading AGENTS.md alone still inherits the universal rules (Decision 139 portability hedge).
  - The surviving terraform/CLAUDE.md stub must serve the routine terraform loop unaided and say when the contract must be read - relocation must reduce ambient load, never force two-file reassembly (Decision 114).
  - >-
    PIN AMBIENT - the AGENTS.md '### Commit signing' subsection stays. The graduated check
    cc-web-signing-premise-corrected requires its heading to be mirrored verbatim in
    terraform/github/repo.tf, so relocating it would mean editing a .tf file and re-targeting a
    cross-file consistency guard for roughly 700 bytes. Keep the heading text byte-identical.
  - >-
    PIN AMBIENT - the '| Full |' two-tier presubmit table row stays verbatim, heading included.
    tests/test_pr_ci_red_protocol_contract.py:47 asserts its When cell ("Pre-handoff (local) +
    post-merge on `main`") against AGENTS.md text, and the graduated entries
    agents-md-full-tier-pre-handoff-stated and agents-md-contradiction-resolved both assert the
    row. Keeping it ambient costs ~130 bytes, doubles as AC #2's required presubmit-tier trigger,
    and leaves all four guard_target: AGENTS.md registry entries and both standing tests
    untouched - no registry edit, and no VF-06 differential-admission exposure.
  - >-
    PIN AMBIENT - the two '## Merge protocol' ci-rca bullets stay verbatim, and the '## Merge
    protocol' HEADING itself stays: ci-rca-lifecycle.yaml:36 and :80 and
    tests/test_pr_ci_red_protocol_contract.py:4 all name it by section. They are pinned by the
    graduated entries agents-md-contradiction-resolved and agents-md-pr-branch-disposition-stated,
    by tests/test_pr_ci_red_protocol_contract.py's byte-exact pr_bullet assertion (including its
    trailing "(Git-ops step 6)"), and they keep ci-rca-lifecycle.yaml:79-82 and
    instruction-architecture.yaml:48 ("merge protocol" in the Layer 1 contains list) accurate.
    Only the section's "Canonical authority" pointer line relocates.
  - >-
    Re-targeting a graduated registry entry or a standing test to follow relocated content is
    legitimate and must happen in THIS PR; weakening, deleting or skipping an assertion to obtain
    green is the CONTENT never-weaken violation docs/contracts/implement-scope-boundary.yaml forbids.
  - >-
    docs/contracts/git-ops.yaml must not contain the literal strings "AGENTS.md runbook" or
    "AGENTS.md re-enable runbook" - tests/test_agents_md_citations.py is a standing repo-wide guard
    against exactly those.
  - >-
    Keep docs/decisions-index.json REGISTERED in T2.56 files_in_scope. T2.56's own c2 progress note
    assigns it to c1 ("owned by T2.56 c1 ... still open"), so de-registering it while c1 is open
