schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ambient-prose-contract-relocation"
intent: >-
  Advance T2.56 c1 by relocating the two largest blocks of procedural / field-semantics prose out of
  the genuinely-ambient instruction surfaces (S1 root load-set, S2 terraform/CLAUDE.md) into
  declared Class D contracts, leaving machine-enforced norms plus resolvable pointers, and
  ratcheting config/prose_budgets.yaml down so the shrink is durable. Discharges c1's AGENTS.md
  and CLAUDE.md conjuncts only; the skills-layer conjunct stays open under rec-3378, so this plan
  deliberately declares no closes_criteria.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ambient-prose-contract-relocation.yaml
phase: >-
  T2.56 Normative / contract / ADR layering -- follow-on advancing the last open criterion (c1);
  c2 was met 2026-08-31 by PLAN-decision-corpus-stock-ceiling-retirement / Decision 179. c1 is
  conjunctive over three surfaces and this plan discharges two, so it records evidence WITHOUT
  flipping status (Status-Trusted-Never-Inferred; T1.13 c9 precedent) and leaves T2.56 in_progress.
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Relocate '## Git-ops procedure', '## Merge protocol', '## Operational runbooks' and the
      duplicated body of '## Data-modeling default' to pointers; add the MCP-over-CLI rule to
      '## Shell invocations' (rec-3301); fix the bare python -m invocation (rec-2345).
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: Relocate '## Running terraform/personal/ on CC-web' (20,921b) to a pointer.
  - file: docs/contracts/git-ops.yaml
    action: Create
    purpose: >-
      Declared Class D contract carrying the relocated git-ops procedure and merge protocol. Its
      subject is declared as the GitHub-surface operations plane INCLUDING CI credential
      provisioning, so the relocated OAuth-token procedure block sits inside the subject it
      declares rather than stretching past it (Decision 127 points 2-3; CFG-05 overbroad-subject risk).
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Create
    purpose: Declared Class D contract carrying the relocated CC-web terraform operating procedure.
  - file: scripts/checks/contracts/validate_git_ops_contract.py
    action: Create
    purpose: Evaluator -- AGENTS.md carries a resolvable pointer to the contract and every repo path the contract names exists.
  - file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
    action: Create
    purpose: Evaluator -- terraform/CLAUDE.md carries a resolvable pointer and every repo path the contract names exists.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Entry rows registering both new checks in the contracts domain.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category rows for both new checks.
  - file: tests/checks/contracts/test_validate_git_ops_contract.py
    action: Create
    purpose: Mirror test -- pointer removal and a dangling contract path each fail the check.
  - file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    action: Create
    purpose: Mirror test -- same two failure modes for the terraform contract.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Ratchet S1 root_ambient_load_set and S2 terraform/CLAUDE.md down to the post-relocation sizes (decreases, unrestricted).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: Register both new contracts as discovery topics.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: Repoint two 'AGENTS.md ## Git-ops procedure' references to the contract.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Repoint FOUR references - '## Git-ops procedure' at :486 and :499, plus the retired H3s
      '### Rebase phase distinction' at :531 and '### Resolves: trailer' at :545.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Repoint TWO references - '## Git-ops procedure' at :10 and the retired H3
      '### Commit-message conventions' at :88.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: Repoint the git-ops reference to the contract.
  - file: .claude/commands/audit.md
    action: Modify
    purpose: Repoint two git-ops references to the contract.
  - file: .claude/hooks/never_on_main.py
    action: Modify
    purpose: Repoint the block-message git-ops reference to the contract.
  - file: .claude/hooks/fresh_branch_base.py
    action: Modify
    purpose: Repoint the block-message git-ops reference to the contract.
  - file: .github/pull_request_template.md
    action: Modify
    purpose: >-
      Repoint two references - the Resolves-trailer pointer at :35 and the commit-message-conventions
      pointer at :45, both of which name AGENTS.md sections this plan relocates.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Re-target the :92 assertion pinning the literal '### Commit-message conventions' in
      .claude/commands/plan.md, which this plan repoints. Retargeting a standing guard to follow
      relocated content is legitimate; weakening or deleting the assertion is not.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Re-ground T2.56 files_in_scope (drop the c2 residue docs/DECISIONS.md; ADD terraform/CLAUDE.md, which this plan makes c1 work; KEEP docs/decisions-index.json, which c2's own note assigns to c1)
      and record a c1 progress note naming the measured S1/S2 shrink and rec-3378 as the owner of the
      undischarged skills-layer conjunct. Do NOT flip c1 status and do NOT touch T2.56 item status.
bundled_recommendations:
  - rec-2984
  - rec-3301
  - rec-2345
infrastructure_dependencies: []
acceptance_criteria:
  - S1 (root ambient load-set) measures <= 19,000 bytes, down from 25,925, and config/prose_budgets.yaml root_ambient_load_set is re-seeded at the new measured size.
  - AGENTS.md retains a one-line trigger for each git-ops flow step (branch rule, presubmit tier, squash-merge, never-poll wake, Resolves trailer) so a non-Claude harness reading AGENTS.md alone still inherits the universal rules rather than only a file path (Decision 139).
  - AGENTS.md still carries the docs/contracts/ci-rca-lifecycle.yaml and docs/contracts/decision-entry.yaml pointers, which today exist ONLY inside the relocated ranges (Decision 181 declare-your-coverage).
  - terraform/CLAUDE.md measures <= 12,500 bytes, down from 29,485, and its prose_budgets entry is re-seeded at the new measured size.
  - The surviving terraform/CLAUDE.md stub is sufficient for the ROUTINE terraform loop on its own (hard rules, AWS context, the deployment-model channel table, and the never-self-directed-apply norm) and states explicitly WHEN the contract must be read, so the relocation removes ambient load rather than forcing two-file reassembly (Decision 114 anti-fragmentation; T2.41 quarantine precedent).
  - Both new contracts measure under 500 effective lines and 2,000 characters longest-line (Decision 166 contracts class); neither is added to the one-time grandfather roster.
  - Both new contracts declare contract.class D with status ratified and a resolving evaluator, so contract-population.yaml grandfathered_max and status_active_max stay 16 with no raise-approved marker.
  - Every repo file path named in the relocated AGENTS.md and terraform/CLAUDE.md prose at origin/main is still named in the new contracts (no content lost in transit).
  - >-
    Every live inbound pointer to EVERY retired AGENTS.md heading resolves to
    docs/contracts/git-ops.yaml - the four relocated H2 sections plus the H3s
    "### Rebase phase distinction", "### Resolves: trailer" and
    "### Commit-message conventions" - swept across .claude, .github, tests,
    docs/contracts, scripts, terraform and config, with append-only and frozen
    composed artefacts excluded by root selection.
  - AGENTS.md still carries the machine-enforced norms it must keep ambient - the never-on-main rule, the harness-branch rule, and the ci-rca do-not-manually-patch norm.
  - rec-2984, rec-3301 and rec-2345 acceptance commands all pass, and each rec reaches status closed after merge.
  - T2.56 c1 remains status open and T2.56 remains status in_progress after this plan lands; the item's progress_note names the measured S1/S2 shrink and cites rec-3378 as the owner of the undischarged skills-layer conjunct.
  - >-
    The AGENTS.md strings that graduated registry entries and standing tests pin all survive verbatim - including the '| Full |' presubmit row's When cell and the '## Merge protocol' heading - and survive verbatim - the '###
    Commit signing (CC-web: SSH-signed via harness signer)' heading (mirrored in terraform/github/repo.tf), 'SSH-
    signed', 'reset-author', and the two '## Merge protocol' ci-rca bullets including the byte-exact PR-branch
    bullet - and the two entries whose table-row clause moves are re-targeted to the contract in this PR.
  - >-
    AGENTS.md retains an ambient grain-first data-modeling trigger plus a pointer to docs/contracts/data-modeling-
    standard.yaml, so the design-time norm survives the de-duplication and data-modeling-standard.yaml's own
    "AGENTS.md ambient rule" self-description stays true.
  - >-
    AGENTS.md states explicitly WHEN docs/contracts/git-ops.yaml must be read, mirroring the terraform stub's
    read-trigger requirement, so an agent reading only the ambient triggers does not silently lose the commit-flow
    auto-rebase rule, --force-with-lease, and the never-poll wake mechanics.
  - >-
    config/prose_budgets.yaml's S1 root_ambient_load_set and S2 terraform/CLAUDE.md entries EQUAL the post-
    relocation measured byte counts, so the ratchet actually locks the shrink in; validate_prose_limits treats
    under-budget as a non-blocking advisory and cannot establish this on its own.
  - >-
    bin/venv-python -m scripts.validate --pre exits 0, AND the full tier bin/venv-python -m scripts.validate exits
    0 before commit (handoff_policy.full_validation_required_before_commit).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Measure the S1 ambient shrink.
    command: 'bin/venv-python -c "from scripts.preflight.prose_context import measure_prose_context as m; b=m()[''S1''][''prose_bytes'']; print(b); raise SystemExit(0 if b <= 19000 else 1)"'
    expected: Prints a byte count <= 19000 (was 25925) and exits 0. The target allows for the '### Commit signing' subsection and the '## Merge protocol' ci-rca bullets, which stay ambient because graduated registry entries and a standing test pin them.
    fix_if: Exit 1 - relocation left more prose ambient than planned; move the remaining procedural body into the contract.
    graduation: graduate
    graduation_check_id: prose-s1-ambient-bytes-under-19000
    hermetic: true
  - step: 2
    phase: pre-deploy
    action: Measure the terraform/CLAUDE.md shrink.
    command: 'bin/venv-python -c "from scripts.preflight.prose_context import measure_prose_context as m; f={x[''path'']:x[''prose_bytes''] for x in m()[''S2''][''files'']}; b=f[''terraform/CLAUDE.md'']; print(b); raise SystemExit(0 if b <= 12500 else 1)"'
    expected: Prints a byte count <= 12500 (was 29485) and exits 0.
    fix_if: Exit 1 - the CC-web runbook was not fully relocated.
    graduation: graduate
    graduation_check_id: prose-s2-terraform-claude-md-bytes-under-12500
    hermetic: true
  - step: 3
    phase: pre-deploy
    action: Prove no named repo path was lost relocating the AGENTS.md git-ops body, merge protocol and operational-runbooks ranges.
    command: 'bin/venv-python -c "import re,subprocess,pathlib; o=subprocess.run([''git'',''show'',''origin/main:AGENTS.md''],capture_output=True,text=True).stdout; s=o.split(chr(10)+''## Git-ops procedure''+chr(10))[1]; want=set(re.findall(r''[A-Za-z0-9_./-]+\.(?:tfvars|tfstate|yaml|yml|hcl|json|tfrc|py|md|sh|tf)(?![A-Za-z0-9])'',s)); got=pathlib.Path(''docs/contracts/git-ops.yaml'').read_text()+pathlib.Path(''AGENTS.md'').read_text(); lost=sorted(x for x in want if x not in got); print(''LOST:'',lost); raise SystemExit(1 if lost else 0)"'
    expected: 'Prints LOST: [] and exits 0.'
    fix_if: A non-empty list names paths dropped in transit - add them to the contract.
    graduation: graduate
    graduation_check_id: git-ops-relocation-no-path-loss
    hermetic: true
  - step: 4
    phase: pre-deploy
    action: Prove no named repo path was lost relocating the terraform CC-web runbook.
    command: 'bin/venv-python -c "import re,subprocess,pathlib; o=subprocess.run([''git'',''show'',''origin/main:terraform/CLAUDE.md''],capture_output=True,text=True).stdout; s=o.split(chr(10)+''## Running terraform/personal/ on CC-web'')[1].split(chr(10)+''## Out-of-band IAM grants'')[0]; want=set(re.findall(r''[A-Za-z0-9_./-]+\.(?:tfvars|tfstate|yaml|yml|hcl|json|tfrc|py|md|sh|tf)(?![A-Za-z0-9])'',s)); got=pathlib.Path(''docs/contracts/terraform-cc-web-operations.yaml'').read_text()+pathlib.Path(''terraform/CLAUDE.md'').read_text(); lost=sorted(x for x in want if x not in got); print(''LOST:'',lost); raise SystemExit(1 if lost else 0)"'
    expected: 'Prints LOST: [] and exits 0.'
    fix_if: A non-empty list names paths dropped in transit - add them to the contract.
    graduation: graduate
    graduation_check_id: terraform-cc-web-relocation-no-path-loss
    hermetic: true
  - step: 5
    phase: pre-deploy
    action: Prove no live surface still points at the retired AGENTS.md section (append-only and historical surfaces excluded).
    command: 'bin/venv-python -c "import pathlib,re; roots=[''.claude'',''.github'',''docs/contracts'',''scripts'',''terraform'',''config'',''tests'']; strip={ord(c):None for c in chr(96)+chr(39)+chr(34)}; pat=re.compile(r''AGENTS\.md\s*(?:#+\s*)?(?:Git-ops procedure|Rebase phase distinction|Resolves:?\s*trailer|Commit-message conventions|Operational runbooks)''); hits=[str(f) for r in roots for f in pathlib.Path(r).rglob(''*'') if f.is_file() and f.suffix in (''.md'',''.py'',''.yaml'',''.yml'') and pat.search(f.read_text(errors=''replace'').translate(strip))]; print(hits); raise SystemExit(1 if hits else 0)" && ! grep -q "### Commit-message conventions" tests/test_workflow_skill_antidrift.py'
    expected: Prints [] and exits 0. Backticks and quotes are stripped and the pattern spans newlines, so it catches both the wrapped form (.claude/commands/audit.md:15-16) and the no-hash quoted form the two hooks use. docs/DECISIONS.md, DECISIONS_ARCHIVE.md, audits/, docs/audit-prompts/ and docs/plans/ are out of scope by root selection - live decision bodies are append-only immutable and the rest are frozen composed artefacts.
    fix_if: A match names a live surface still pointing at the retired section - repoint it to docs/contracts/git-ops.yaml.
    graduation: graduate
    graduation_check_id: no-live-pointer-to-retired-git-ops-section
    hermetic: true
  - step: 6
    phase: pre-deploy
    action: Confirm both harness hooks name the new git-ops authority instead of the retired AGENTS.md section.
    command: "! grep -n 'AGENTS.md' .claude/hooks/never_on_main.py && ! grep -n 'AGENTS.md' .claude/hooks/fresh_branch_base.py && grep -q 'git-ops.yaml' .claude/hooks/never_on_main.py && grep -q 'git-ops.yaml' .claude/hooks/fresh_branch_base.py"
    expected: No AGENTS.md reference remains in either hook and both name docs/contracts/git-ops.yaml; exits 0.
    fix_if: A hook still points at the retired section, so an agent blocked on main is sent to a pointer that no longer resolves.
    graduation: graduate
    graduation_check_id: hooks-name-git-ops-contract
    hermetic: true
  - step: 7
    phase: pre-deploy
    action: Exercise both new evaluators red-then-green via their mirror tests.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_git_ops_contract.py tests/checks/contracts/test_validate_terraform_cc_web_operations.py tests/checks/contracts/test__manifest.py -q
    expected: All tests pass, including the pointer-removed and dangling-path cases that must FAIL the check.
    fix_if: A failure case passes the check - the evaluator is not actually guarding the pointer or the named paths.
    graduation: graduate
    graduation_check_id: contract-pointer-evaluators-mirror-tests
    hermetic: false
  - step: 8
    phase: pre-deploy
    action: Confirm both new contracts land in the declared census bucket, leaving the population pins untouched.
    command: 'bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)" || exit 1; if git diff origin/main -- docs/contracts/contract-population.yaml | grep -qE "^[+].*(grandfathered_max|status_active_max)"; then echo PIN_MOVED; exit 1; fi; exit 0'
    expected: validate_contract_drift passes and no pin line was changed; exits 0.
    fix_if: A pin moved - the new contracts are being bucketed as grandfathered; give them status ratified and a genuinely-resolving evaluator instead of raising the pin.
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift is already a registered check running in both tiers; graduating a
      second copy of it would duplicate standing enforcement. The pin-diff half is a
      this-PR-only assertion about a diff against origin/main, not a durable repo invariant.
    hermetic: false
  - step: 9
    phase: pre-deploy
    action: Confirm the prose ratchet is green at the re-seeded budgets and that AGENTS.md keeps its machine-enforced norms.
    command: 'bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)" && grep -q ''never edit or commit on `main`'' AGENTS.md && grep -q ''claude/'' AGENTS.md && grep -q ''ci-rca'' AGENTS.md && grep -q ''docs/contracts/git-ops.yaml'' AGENTS.md && grep -q ''docs/contracts/ci-rca-lifecycle.yaml'' AGENTS.md && grep -q ''docs/contracts/decision-entry.yaml'' AGENTS.md && grep -q -- ''--pre'' AGENTS.md && grep -qi ''squash'' AGENTS.md && grep -q ''subscribe_pr_activity'' AGENTS.md && grep -q ''Resolves:'' AGENTS.md && grep -q ''docs/contracts/data-modeling-standard.yaml'' AGENTS.md && grep -qi ''grain'' AGENTS.md && grep -qiE ''read .{0,60}git-ops'' AGENTS.md'
    expected: Ratchet passes and all thirteen greps hit; exits 0 - AC #2's five Decision 139 ambient triggers, the two retained contract pointers, AC #14's grain-first data-modeling trigger plus its contract pointer, and AC #15's explicit read-the-git-ops-contract-when trigger.
    fix_if: The ratchet fails (budgets not re-seeded) or a grep misses - a machine-enforced norm, or a contract pointer that exists ONLY in the relocated range, was removed instead of retained.
    graduation: graduate
    graduation_check_id: agents-md-retains-enforced-norms-and-pointer
    hermetic: true
  - step: 10
    phase: pre-deploy
    action: Run each bundled recommendation's own acceptance command.
    command: '(grep -q "^## Operational runbooks" AGENTS.md && exit 1 || exit 0) && sed -n "/## Shell invocations/,/## Safety/p" AGENTS.md | grep -q "gh CLI" && sed -n "/## Shell invocations/,/## Safety/p" AGENTS.md | grep -q "mcp__github" && ! grep -qE "(^|[^-])python -m scripts\.sync\.ops" AGENTS.md && grep -q "bin/venv-python -m scripts.sync.ops" AGENTS.md'
    expected: All three acceptance conditions hold; exits 0.
    fix_if: A clause fails - the corresponding rec (rec-2984 / rec-3301 / rec-2345) is not actually satisfied. rec-2345's SECOND conjunct is load-bearing because without it the step passes when AGENTS.md:130 is deleted rather than fixed, and rec-autoclose would close the rec on false evidence.
    graduation: graduate
    graduation_check_id: bundled-recs-acceptance-agents-md
    hermetic: true
  - step: 11
    phase: pre-deploy
    action: Measure both new contracts against the Decision 166 contracts-class structural limits.
    command: 'bin/venv-python -c "import pathlib; bad=[]; [bad.append((str(f),n,m)) for f in (pathlib.Path(''docs/contracts/git-ops.yaml''),pathlib.Path(''docs/contracts/terraform-cc-web-operations.yaml'')) for n,m in [(sum(1 for l in f.read_text().splitlines() if l.strip() and not l.lstrip().startswith(''#'')), max((len(l) for l in f.read_text().splitlines()), default=0))] if n > 500 or m > 2000]; print(bad); raise SystemExit(1 if bad else 0)"'
    expected: Prints [] and exits 0 - each contract is under 500 effective lines and 2,000 characters longest-line.
    fix_if: A contract breaches a limit - decompose it (Decision 128 pattern). Never add a new entry to config/structural_size_budgets.yaml's one-time grandfather roster.
    graduation: graduate
    graduation_check_id: new-contracts-within-structural-size-class
    hermetic: true
  - step: 12
    phase: pre-deploy
    action: Prove the surviving terraform/CLAUDE.md stub serves the routine terraform loop unaided and says when to read the contract.
    command: 'grep -q "^## Hard rules" terraform/CLAUDE.md && grep -q "^## AWS context" terraform/CLAUDE.md && grep -q "^## Lambda interaction" terraform/CLAUDE.md && grep -q "Agents never run terraform apply" terraform/CLAUDE.md && grep -q "tf-gated-apply" terraform/CLAUDE.md && grep -q "terraform-apply-sandbox" terraform/CLAUDE.md && grep -q "docs/contracts/terraform-cc-web-operations.yaml" terraform/CLAUDE.md && grep -qiE "read .{0,60}terraform-cc-web-operations" terraform/CLAUDE.md'
    expected: All eight greps hit; exits 0. The stub keeps the routine-path content (hard rules, AWS context, Lambda interaction, the never-self-directed-apply norm, both apply channels) AND carries an explicit read-the-contract-when trigger.
    fix_if: A grep misses - either routine-path content was relocated (forcing two-file reassembly, Decision 114) or the stub points at the contract without saying when it must be read.
    graduation: graduate
    graduation_check_id: terraform-stub-serves-routine-loop
    hermetic: true
  - step: 13
    phase: pre-deploy
    action: Prove the roadmap bookkeeping records evidence WITHOUT flipping the conjunctive criterion.
    command: 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); i=[x for x in d[''tier_items''] if x[''id'']==''T2.56''][0]; c1=[c for c in i[''exit_criteria''] if c[''id'']==''c1''][0]; n=i.get(''progress_note'') or ''''; print(c1[''status''], i[''status''], ''rec-3378'' in n); raise SystemExit(0 if c1[''status'']==''open'' and i[''status'']==''in_progress'' and ''rec-3378'' in n else 1)"'
    expected: Prints "open in_progress True" and exits 0 - c1 stays open, T2.56 stays in_progress, and the progress note cites the residual owner.
    fix_if: c1 flipped to met or the note omits rec-3378 - the plan discharges only two of c1's three conjuncts, so flipping would assert the skills-layer conjunct on no evidence (T1.13 c9 precedent), and dropping rec-3378 leaves the residual undeclared (Decision 181).
    graduation: graduate
    graduation_check_id: t256-c1-evidence-without-flip
    hermetic: true
  - step: 14
    phase: pre-deploy
    action: Run the authoritative pre-merge gate.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0.
    fix_if: Any check fails - fix on the branch before pushing.
    graduation: not-applicable
    hermetic: false
  - step: 15
    phase: pre-deploy
    action: Prove every AGENTS.md string pinned by a graduated registry entry or a standing test survives verbatim.
    command: 'H=$(grep -o "### Commit signing[^\"]*" AGENTS.md | head -1) && test -n "$H" && grep -qF "$H" terraform/github/repo.tf && grep -qi "SSH-signed" AGENTS.md && grep -qi "reset-author" AGENTS.md && grep -q "forward-fix, never auto-revert" AGENTS.md && grep -q "source=ci_rca" AGENTS.md && grep -q "priority=critical" AGENTS.md && grep -q "trigger_scope" AGENTS.md && grep -q "no rec is filed" AGENTS.md && grep -q "Pre-handoff (local) + post-merge on" AGENTS.md && grep -q "^## Merge protocol" AGENTS.md'
    expected: All ten assertions hold; exits 0. These are the exact strings the four guard_target AGENTS.md registry entries, tests/test_pr_ci_red_protocol_contract.py (both its pr_bullet and its when_cell) and the '## Merge protocol' section-name references assert against AGENTS.md.
    fix_if: An assertion misses - a graduated registry row or the standing PR-CI-red contract test would be left asserting something false and unexecuted, which is the declared-vs-executed defect class this tier item exists to remove. Restore the string ambient rather than weakening the guard.
    graduation: graduate
    graduation_check_id: agents-md-pinned-guard-strings-survive
    hermetic: true
  - step: 16
    phase: pre-deploy
    action: Prove the prose-budget entries were actually re-seeded to the measured post-relocation sizes.
    command: 'bin/venv-python -c "import yaml; from scripts.preflight.prose_context import measure_prose_context as m; r=m(); b=yaml.safe_load(open(''config/prose_budgets.yaml'')); s1=r[''S1''][''prose_bytes'']; tf=[x for x in r[''S2''][''files''] if x[''path'']==''terraform/CLAUDE.md''][0][''prose_bytes'']; got=(b[''S1''][''root_ambient_load_set''], b[''S2''][''terraform/CLAUDE.md'']); want=(s1, tf); print(''budget'', got, ''measured'', want); raise SystemExit(0 if got==want else 1)"'
    expected: The two budget entries EQUAL the measured byte counts; exits 0.
    fix_if: A budget still carries its pre-relocation value - validate_prose_limits routes under-budget to a non-blocking advisory, so without this equality probe the shrink is never locked in and a later PR can re-inflate the surface with no gate.
    graduation: graduate
    graduation_check_id: prose-budgets-reseeded-to-measured
    hermetic: true
  - step: 17
    phase: pre-deploy
    action: Run the full validation tier before commit, as handoff_policy declares.
    command: bin/venv-python -m scripts.validate
    expected: Exits 0. Required by handoff_policy.full_validation_required_before_commit and enforced in the --pre tier by validate_handoff_full_tier (rec-2965 / Decision 163); without this step the plan's own PR fails that check.
    fix_if: Any check fails - fix on the branch before committing. On timeout the disposition is blocked, per handoff_policy.
    graduation: not-applicable
    hermetic: false
  - step: 18
