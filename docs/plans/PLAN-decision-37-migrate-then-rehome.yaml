    verification_step: 2
    test_selector: tests/checks/structural/test_budget_raises.py
    red_green_expectation: >-
      Green if the entry is absent (trim sufficed) or correctly marked; red on an unmarked raise.
  - source: docs/decisions-index.json
    behavior: Decision 37 projects currency superseded_compacted and the index stays within its pin.
