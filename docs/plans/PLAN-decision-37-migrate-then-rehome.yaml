work_areas: []
rollback: >-
  Every change is a documentation, contract or check edit; git revert of the squash commit restores
  the prior state. The one non-git-reversible effect is the ops_decisions SCD2 terminal version
  written by --backfill-decisions-md; that table is append-only by design, so a revert of
  DECISIONS.md followed by a re-run of the backfill writes a further version restoring the
  full-bodied content_hash rather than deleting history. No infrastructure or Lambda state changes.
