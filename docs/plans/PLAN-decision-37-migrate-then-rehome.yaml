schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-37-migrate-then-rehome"
intent: >-
  Build the migrate-then-rehome lifecycle branch the citation-stranded superseded class has no
  mechanism for, and exercise it end-to-end on Decision 37, so a superseded entry whose superseder
  restates none of its live content becomes lawfully processable instead of permanently full-bodied.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-37-migrate-then-rehome.yaml
phase: >-
  audits/contract-first-governance-33c8667.yaml migration step 7 (finding CFG-10); platform
  tier_item T2.56 territory. Resolves rec-2822 (enumeration ledger) and rec-2823 (mechanism).
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Mint Decision 174 (migrate-then-rehome branch, amending Decision 149's eligibility
      criterion); compact Decision 37 to a conforming stub_grammar stub pointing at both
      Decision 116 and the new contract.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Add the migrate_then_rehome branch to compaction.procedure; widen
      compaction.eligibility_criterion to admit a check-backed rehoming destination as the
      restater; add the amendment_log entry; compact prior amendment_log entries to reclaim
      effective lines before any budget raise.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Register decision-entry.yaml's residual effective-line overflow with a
      '# raise-approved: dec-174' marker plus a budget_notes frozen disposition, only if the
      trim in the row above leaves a residual.
  - file: docs/contracts/secret-material-handling.yaml
    action: Create
    purpose: >-
      Class D mechanism contract owning Decision 37's still-live credential patterns
      (SECRET-VALUE-OUT-OF-BAND, RUNTIME-FETCH) and naming their live exceptions. The named
      rehoming destination the stub points at.
  - file: scripts/checks/iam_tf/validate_secret_material_handling.py
    action: Create
    purpose: >-
      The resolving evaluator Decision 168 clause 2 requires; asserts every terraform
      aws_secretsmanager_secret envelope either has no companion _version resource or is a
      declared exception READ FROM the contract.
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: Register the new check's Entry so it is dispatched and sequenced.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check.
  - file: tests/checks/iam_tf/test_validate_secret_material_handling.py
    action: Create
    purpose: Mirror test for the new check.
  - file: docs/decision-migration/MANIFEST.yaml
    action: Create
    purpose: >-
      Self-retiring machine-readable registry enumerating the citation-stranded class with
      per-entry class, citation inventory and disposition (rec-2822's deliverable).
  - file: docs/contracts/credential-routing.yaml
    action: Modify
    purpose: >-
      Delegate its SECRET-VALUE-OUT-OF-BAND audit invariant to the new contract rather than
      restate it, so the invariant text lives in exactly one place.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Routes for the new contract (route topic must equal the Class D subject) and for the
      decision-migration manifest.
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Enforce stub_grammar on any entry whose body declares '**Status:** Superseded',
      regardless of origin/main baseline presence, closing the hole where a malformed
      compaction of a baseline-present entry passes CI silently.
  - file: tests/checks/decisions/test_validate_decision_entry_conformance.py
    action: Modify
    purpose: Red/green coverage for the widened stub_grammar enforcement.
  - file: terraform/personal/inference_credentials.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: terraform/personal/secrets_manager_brokers.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: terraform/personal/prod_lambdas.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: terraform/personal/neon_ducklake_catalog.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: Comment-only citation repoint to the new contract.
  - file: scripts/ducklake_neon_smoke_test.py
    action: Modify
    purpose: Docstring citation repoint to the new contract (not Lambda-packaged).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated after compaction; Decision 37 flips to currency superseded_compacted.
bundled_recommendations:
  - rec-2822
  - rec-2823
infrastructure_dependencies:
  - >-
    terraform/personal/*.tf and terraform/bootstrap/github_ci_apply_reads.tf changes are
    COMMENT-ONLY. No resource attribute changes (description = "..." citations are deliberately
    NOT touched, since altering them produces a real resource diff). Verified zero source-hash
    coupling: terraform/personal Lambda source hashes come from filemd5 on built .zip artifacts,
    never from .tf files; the self-hashing md5(file("<self>.tf")) pattern exists only in the
    legacy non-applied terraform/ root. Expected terraform plan: no-op. No apply path engaged.
  - >-
    terraform/bootstrap is admin-only out-of-band (AGENTS.md); the comment edit there is inert
    and must not be accompanied by any apply.
acceptance_criteria:
  - >-
    docs/contracts/decision-entry.yaml's compaction.procedure carries a third migrate_then_rehome
    branch, and compaction.eligibility_criterion admits a check-backed rehoming destination as the
    restater while still excluding partial supersession with no destination.
  - >-
    Decision 174 exists in docs/DECISIONS.md with a well-formed metadata envelope declaring
    significance.value numbered_decision, and amends Decision 149.
  - >-
    docs/contracts/secret-material-handling.yaml is a valid Class D contract whose evaluator
    resolves per docs/contracts/contract-population.yaml (registered AND sequenced check whose
    module contains the contract basename in executable context).
  - >-
    Decision 37 is a conforming compacted stub per compaction.stub_grammar, its header line and
    '(Decided)' parenthetical unchanged, retaining '**Superseded by: Decision 116**' as its sole
    supersession marker.
  - >-
    docs/decisions-index.json derives currency superseded_compacted for Decision 37, and the
    committed index stays within the 112,000-byte pin.
  - >-
    docs/decision-migration/MANIFEST.yaml enumerates the citation-stranded class with a
    citation-stranded class entry, per-entry disposition, and a self-retirement condition.
  - >-
    Every live Decision 37 citation either resolves through the stub's pointer or is repointed;
    the un-repointed set is recorded in the manifest with an explicit reason.
  - >-
    validate_decision_entry_conformance fails a malformed compacted stub on a baseline-present
    entry (the hole that let a bad stub pass CI silently is closed).
  - bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the widened conformance check discriminates: it must FAIL a malformed stub and PASS a
      conforming one, on a baseline-present entry number.
    command: bin/venv-python -m pytest tests/checks/decisions/test_validate_decision_entry_conformance.py -q
    expected: All tests pass, including the new malformed-stub-fails and conforming-stub-passes cases.
    fix_if: >-
      A malformed stub passes -- the rule is keying on baseline presence rather than on the body
      declaring '**Status:** Superseded'. Re-key it on scripts.decisions_md.status_is_superseded.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decision-stub-grammar-enforced-off-baseline"
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the new Class D evaluator genuinely resolves (registered, sequenced, and its module
      contains the contract basename in executable context) rather than merely being declared,
      and that its companion registration surfaces (manifest Entry, file-router route,
      structural-budget marker) are well-formed.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/ tests/checks/iam_tf/test__manifest.py
      tests/checks/hygiene/test_validate_placement.py tests/checks/structural/test_budget_raises.py -q
    expected: >-
      Population/drift tests pass with secret-material-handling.yaml present and resolving; the
      manifest Entry, router route and any budget marker validate.
    fix_if: >-
      Evaluator does not resolve -- the check is unsequenced, or the basename appears only in a
      docstring/comment. Move it to an executable-context string literal.
    hermetic: true
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Exercise the new check against the real terraform tree: it must pass on the current tree
      (both live _version resources are declared exceptions) and fail when an undeclared
      _version resource is introduced in a fixture.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_secret_material_handling.py -q
    expected: Both the pass-on-current-tree and fail-on-undeclared-fixture cases pass.
    fix_if: >-
      Check passes on the undeclared fixture -- it is not reading the contract's exception list,
      or is matching resource names too loosely.
    hermetic: true
    graduation: graduate
    graduation_check_id: "secret-material-out-of-band-enforced"
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm Decision 37's stub is conforming and that the currency projection flips to
      superseded_compacted (not merely superseded_pointer).
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.decisions_md import
      parse_decisions_md, is_compacted_stub, extract_superseded_by; rows =
      parse_decisions_md([Path('docs/DECISIONS.md')]); r = next(x for x in rows if
      x['decision_id'] == '37'); b = r['raw_block']; assert is_compacted_stub(b), 'not a stub';
      assert extract_superseded_by(b) == 'dec-116', extract_superseded_by(b); print('OK stub,
      sole superseder dec-116')"
    expected: "OK stub, sole superseder dec-116"
    fix_if: >-
      is_compacted_stub is False -- a pre-compaction marker line survived the edit, or
      '**Status:** Superseded' is missing. Compaction is a FULL body replacement, not a partial edit.
    hermetic: true
    graduation: graduate
    graduation_check_id: "decision-37-compacted-stub-sole-superseder"
  - step: 5
    phase: pre-deploy
    action: Confirm the regenerated index is fresh and within its byte pin.
    command: bin/venv-python -m scripts.decisions_index --check && bin/venv-python -m pytest tests/test_decisions_index.py -q
    expected: Index freshness passes and the committed-size pin (112,000 bytes) holds.
    fix_if: >-
      Freshness fails -- run 'bin/venv-python -m scripts.decisions_index --write' and commit.
      Pin fails -- do NOT raise it; the operator's standing position is that this pin is never raised.
    hermetic: true
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the terraform citation repoints are comment-only -- no resource attribute line
      changed, so the expected plan is a no-op.
    command: >-
      bash -c "git diff origin/main -- terraform/ | grep '^[+-]' | grep -v '^[+-][+-]' |
      grep -vE '^[+-][[:space:]]*#' | grep -vE '^[+-][[:space:]]*$' | tee /dev/stderr | wc -l |
      grep -qx 0 && echo 'OK comment-only'"
    expected: "OK comment-only"
    fix_if: >-
      Non-comment lines appear -- a description = \"...\" attribute was edited. Revert it; those
      citations stay and are recorded in the manifest as deferred.
    hermetic: true
    graduation: graduate
    graduation_check_id: "d37-repoint-terraform-comment-only"
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm no Lambda-packaged file entered scope, so the V2 tier holds and no governed
      code-deploy channel is required.
    command: >-
      bin/venv-python -c "import subprocess; from scripts.lambda_manifest import
      compute_affected_artifacts; changed = subprocess.run(['git','diff','--name-only',
      'origin/main'], capture_output=True, text=True).stdout.split(); a =
      compute_affected_artifacts(changed); assert not a, a; print('OK no Lambda artifacts affected')"
    expected: "OK no Lambda artifacts affected"
    fix_if: >-
      An artifact is named -- src/common/ducklake_runtime.py or src/lambdas/ducklake_catalog_dr/*
      was edited. Revert; those citers are deliberately deferred and recorded in the manifest.
    hermetic: true
    graduation: graduate
    graduation_check_id: "d37-plan-touches-no-lambda-artifact"
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the SECRET-VALUE-OUT-OF-BAND invariant text now lives in exactly one contract
      (credential-routing delegates, does not restate).
    command: >-
      bash -c "grep -q 'secret-material-handling' docs/contracts/credential-routing.yaml &&
      test $(grep -c 'never enters Terraform state' docs/contracts/credential-routing.yaml) -eq 0
      && echo 'OK delegated'"
    expected: "OK delegated"
    fix_if: >-
      The invariant text is still restated in credential-routing.yaml -- replace the body with a
      delegation pointer to the new contract.
    hermetic: true
    graduation: graduate
    graduation_check_id: "credential-routing-delegates-secret-material"
  - step: 9
    phase: pre-deploy
    action: >-
      Assert every structural governance change landed: the procedure branch, the widened
      eligibility criterion, the manifest's class entry and retirement condition, the check's
      taxonomy row, and the smoke-test docstring repoint.
    command: >-
      bash -c "grep -q 'migrate_then_rehome' docs/contracts/decision-entry.yaml && grep -q
      'rehoming destination' docs/contracts/decision-entry.yaml && grep -q 'citation-stranded'
      docs/decision-migration/MANIFEST.yaml && grep -q 'retires'
      docs/decision-migration/MANIFEST.yaml && grep -q 'validate_secret_material_handling'
      config/ci_rca_taxonomy.yaml && grep -q 'secret-material-handling'
      scripts/ducklake_neon_smoke_test.py && echo 'OK structural'"
    expected: "OK structural"
    fix_if: >-
      Any grep fails -- the named surface was not edited. The failing literal names the missing
      change directly.
    hermetic: true
    graduation: graduate
    graduation_check_id: "d37-governance-surfaces-landed"
  - step: 10
    phase: pre-deploy
    action: Full fast-tier presubmit.
    command: bin/venv-python -m scripts.validate --pre
    expected: All checks passed.
    fix_if: >-
      Structural-size limits fail on decision-entry.yaml -- the trim did not reclaim enough;
      record the arithmetic and add the dec-174 raise marker plus a budget_notes frozen entry.
      check-accounting fails -- the new check is missing its examined()/skipped() declaration.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Write the terminal Superseded SCD2 version for Decision 37 to ops_decisions and confirm
      the content_hash change was detected.
    command: bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md
    expected: >-
      Backfill reports dec-037 updated; no orphaned-current-row divergence raised by
      _assert_no_orphaned_current_rows.
    fix_if: >-
      Orphan-guard fires -- do NOT weaken the guard (Decision 55). Diagnose the divergence and
      dispose it explicitly. Reader outage is tolerated per Decision 155; retry.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/iam_tf/validate_secret_material_handling.py
    behavior: >-
      An aws_secretsmanager_secret envelope carrying an undeclared companion _version resource is
      flagged; a declared exception is not.
    verification_step: 3
    test_selector: tests/checks/iam_tf/test_validate_secret_material_handling.py
    red_green_expectation: >-
      Red before (module absent), green after; the undeclared-fixture case fails if the check
      stops reading the contract's exception list.
  - source: scripts/checks/decisions/validate_decision_entry_conformance.py
    behavior: >-
      A malformed compacted stub on a baseline-present entry FAILS, while a full-bodied entry
      carrying only a forward '**Superseded by:**' pointer is left alone.
    verification_step: 1
    test_selector: tests/checks/decisions/test_validate_decision_entry_conformance.py
    red_green_expectation: >-
      Red before (baseline-present entries are unenforced today), green after. The
      leaves-full-bodied-entries-alone case is what prevents the rule forcing compaction on a
      partial supersession.
  - source: docs/DECISIONS.md
    behavior: Decision 37 is a conforming stub whose sole supersession marker is Decision 116.
    verification_step: 4
    command: "from scripts.decisions_md import"# noqa
    red_green_expectation: Red before (Decision 37 is full-bodied), green after.
  - source: docs/contracts/secret-material-handling.yaml
    behavior: The contract loads as a valid Class D envelope and its evaluator resolves.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_contract_drift.py
    red_green_expectation: >-
      Red before (file absent), green after. Fails if the evaluator is declared but unsequenced.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      compaction.procedure carries the migrate_then_rehome branch and eligibility_criterion
      admits a check-backed destination.
    verification_step: 9
    command: "grep -q 'migrate_then_rehome' docs/contracts/decision-entry.yaml"
    red_green_expectation: Red before, green after.
  - source: docs/decision-migration/MANIFEST.yaml
    behavior: The registry enumerates the citation-stranded class and carries a retirement condition.
    verification_step: 9
    command: "grep -q 'citation-stranded' docs/decision-migration/MANIFEST.yaml"
    red_green_expectation: Red before (file absent), green after.
  - source: docs/contracts/credential-routing.yaml
    behavior: The SECRET-VALUE-OUT-OF-BAND invariant is delegated, not restated.
    verification_step: 8
    command: "grep -q 'secret-material-handling' docs/contracts/credential-routing.yaml"
    red_green_expectation: Red before, green after.
  - source: docs/contracts/file-router.yaml
    behavior: Both new routes resolve to existing targets and the contract route topic equals its subject.
    verification_step: 2
    test_selector: tests/checks/hygiene/test_validate_placement.py
    red_green_expectation: >-
      Green throughout if authored correctly; red if a route target does not exist or topic and
