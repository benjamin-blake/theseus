constraints:
  - >-
    Decision 174 is the ONLY numbered Decision this plan mints. It is scoped to the
    migrate-then-rehome branch for SUPERSEDED entries and must NOT claim the larger capability of
    extracting content from LIVE (non-superseded) entries -- that is rec-3246 and belongs to a
    separate operator-gated plan. Over-claiming would mint a rule with no mechanism behind it,
    which is the exact CFG-03 anti-pattern this audit sequence exists to close.
  - >-
    never_remove_headers is inviolate: the '## Decision 37:' heading, including its original
    '(Decided)' parenthetical, is UNCHANGED. Do not adopt the archive-move '(Superseded by
    Decision NN)' header suffix on a live-file stub.
  - >-
    Compaction is a FULL body replacement between the header line and the closing '---', never a
    partial edit. Verify no pre-compaction marker line survives for a first-match regex to latch onto.
  - >-
    Decision 37 keeps EXACTLY ONE supersession marker, '**Superseded by: Decision 116**'.
    Decision 174 is the mechanism used, never a second superseder -- the Decision 44 stub
    (superseder 117, artefact capabilities.yaml, lifecycle cited separately) is the shape to follow.
  - >-
    Terraform edits are comment-only. Do NOT touch description = "..." attributes; those produce a
    real resource diff. No terraform apply, and no local init/validate/plan (Decision 119/120 --
    third-party provider egress is blocked; CI is the authoritative verifier).
  - >-
    Do NOT edit src/common/ducklake_runtime.py or src/lambdas/ducklake_catalog_dr/* -- they are
    Lambda-packaged and would convert this into a V3 five-Lambda governed-CD deploy for a comment.
  - >-
    The decisions-index byte pin (112,000) is NEVER raised -- the operator's standing position.
    If it binds, the response is archival or collapsing entries into contracts.
  - >-
    Exhaust the contracts class's first-listed relief valve (compact amendment_log / defer detail)
    and RECORD THE ARITHMETIC before adding any structural-size raise marker. Decision 166
    reversal condition (d) treats roster growth as a signal to re-audit, not to raise. MEASURED
    RECORD (re-derived at plan-critique after an earlier draft of this plan carried a WRONG
    figure): the roster was 16 at install (13 budgets + 3 long_line_budgets), and is 14 TODAY
    (11 + 3) after PR #906 decomposed oidc.tf and github_ci_apply.tf out of it. Net movement over
    the 90-day window is -2, so reversal condition (d) DOES NOT FIRE, and a dec-174 entry would
    be the 15th. docs/contracts/iam-simulate-fixture.yaml was present at install; dec-168 only
    RAISED ITS VALUE (584 -> 608, commit eaff8043 / PR #895) and re-attributed its marker, which is
    not roster growth. It reads 605 today after PR #919's later, unrelated decrease -- do not
    attribute that decrease to dec-168. The roster COUNT decrease (16 -> 14) came from a different
    PR again, #906.
    Decision 174 must NOT record a (d) acknowledgement or any growth claim -- a false measurement
    in a numbered Decision body is permanent. Re-derive the count at implement time and use what
    you measure.
  - >-
    docs/contracts/secret-material-handling.yaml governs the VALUE-MATERIAL plane only. It must
    name Decision 157 as the adjacent IAM-VERB plane (Secrets Manager metadata-vs-value verb
    split) so a reader cannot conflate the two, and must contain NO account IDs, ARNs or
    ExternalIds (Decision 101 public-repo boundary; this repository is PUBLIC).
  - >-
    The stub-grammar narrowing (Decision 149's stub_grammar, as amended by Decision 165 -- NOT
    Decision 163, which governs the full-tier verification-plan obligation and carries no
    stub-grammar content) stays in the decisions-domain check
    (validate_decision_entry_conformance). Do NOT fuse it into the new contract's evaluator --
    that evaluator's sole job is resolving secret-material-handling.yaml, and mixing domains
    would make the Class D evaluator claim coverage it does not have.
  - >-
    TWO REGISTRATION OBLIGATIONS THAT ARE MECHANICALLY ENFORCED AND EASY TO MISS:
    (a) docs/contracts/file-router.yaml is itself a Class D contract, so
    check_amendment_log_for_class_d FAILS any parsed-content change with no new amendment_log[]
    entry -- adding the two routes requires one. (b) Decision 174's envelope declares
    amends: [149], and validate_supersession_annotations requires that edge be annotated on
    Decision 149's OWN block, in the '> **Amended by Decision 174 (DATE):**' form Decisions 155
    and 165 already use. That check is FULL-TIER ONLY, so only the full-tier step sees it.
  - >-
    docs/contracts/credential-routing.yaml's SECRET-VALUE-OUT-OF-BAND audit_invariant BUNDLES a
    second, unrelated invariant: 'Secret tag values use the ASCII tag charset only -- no
    parentheses (a prior Purpose-tag parenthesis broke TagResource; see inference_credentials.tf)'.
    Delegating the row wholesale would DELETE it. Either retain that sentence in place alongside
    the delegation pointer, or carry it into the new contract explicitly -- and say which. Add an
    amendment_log entry for the semantic edit even though check_amendment_for_diff does not
    require one for audit_invariants.
  - >-
    If a residual structural-budget raise lands, Decision 174's BODY must contain the literal
    'docs/contracts/decision-entry.yaml' (or 'docs/contracts') -- _marker_guard's
    _expand_ancestor_candidates yields exactly those two candidates for that key, and Decision 165
    authorizes by the cited entry NAMING the key, never by the entry merely existing.
  - >-
    Do NOT add a docs/CLAUDE.md Class-to-home map row for the decision-migration manifest, even
    though the docs/intent-migration sibling has one. config/prose_budgets.yaml pins
    S2 docs/CLAUDE.md at 3813 bytes and the file measures exactly 3813 -- ZERO headroom -- so the
    ~61-byte row reds validate_prose_limits in BOTH tiers. A prose raise is not in scope and would
    need its own '# raise-approved: dec-174' marker plus the literal 'docs/CLAUDE.md' in
    Decision 174's body (_expand_ancestor_candidates yields that single candidate). The row is
    redundant anyway: docs/contracts/file-router.yaml already carries the route, and
    docs/PROJECT_CONTEXT.md names file-router.yaml the discovery-and-ownership index. This is the
    SAME zero-headroom property that ruled out an agent_surface evaluator -- scoping an S2 edit
    here would have contradicted the plan's own reasoning.
  - >-
    config/agent/verification_registry/registry.yaml measures 5,972 effective lines against its
    6,000 ceiling -- 28 lines of headroom. Every 'graduate' disposition in this plan costs a
    registry row at implement time. Author the new rows in the COMPACT one-line style the tail of
    that file already uses, not the block style. Decision 166 point 6 pre-commits that the
    response to breaching 6,000 is the CD.29 mark-then-drop archival lifecycle, NEVER a second
    raise.
  - No rescue agents or workaround loops (Decision 55). A failure is diagnosed, not retried blindly.
  - >-
    Single Portal Invariant: the ops_decisions write happens ONLY via
    'ops_data_portal --backfill-decisions-md'. Never edit logs/.decisions-index.jsonl directly.
