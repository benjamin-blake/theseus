    command: "grep -q 'secret-material-handling' scripts/ducklake_neon_smoke_test.py"
    red_green_expectation: Red before, green after.
  - source: tests/checks/decisions/test_validate_decision_entry_conformance.py
    behavior: Test file; carries the red/green evidence for the widened conformance rule.
    verification_step: 1
    test_selector: tests/checks/decisions/test_validate_decision_entry_conformance.py
    red_green_expectation: >-
      Waived -- this IS the test surface for scripts/checks/decisions/validate_decision_entry_conformance.py
      declared above; a test of a test would be circular.
  - source: tests/checks/iam_tf/test_validate_secret_material_handling.py
    behavior: Test file; carries the red/green evidence for the new check.
    verification_step: 3
    test_selector: tests/checks/iam_tf/test_validate_secret_material_handling.py
    red_green_expectation: >-
      Waived -- this IS the test surface for the check declared above; a test of a test would be
      circular.
constraints:
  - >-
    Decision 174 is the ONLY numbered Decision this plan mints. It is scoped to the
    migrate-then-rehome branch for SUPERSEDED entries and must NOT claim the larger capability of
    extracting content from LIVE (non-superseded) entries -- that is rec-3246 and belongs to a
    separate operator-gated plan. Over-claiming would mint a rule with no mechanism behind it,
    which is the exact CFG-03 anti-pattern this audit sequence exists to close.
  - >-
    never_remove_headers is inviolate: the '## Decision 37:' heading, including its original
    '(Decided)' parenthetical, is UNCHANGED. Do not adopt the archive-move '(Superseded by
    Decision NN)' header suffix on a live-file stub.
  - >-
    Compaction is a FULL body replacement between the header line and the closing '---', never a
    partial edit. Verify no pre-compaction marker line survives for a first-match regex to latch onto.
  - >-
    Decision 37 keeps EXACTLY ONE supersession marker, '**Superseded by: Decision 116**'.
    Decision 174 is the mechanism used, never a second superseder -- the Decision 44 stub
    (superseder 117, artefact capabilities.yaml, lifecycle cited separately) is the shape to follow.
  - >-
    Terraform edits are comment-only. Do NOT touch description = "..." attributes; those produce a
    real resource diff. No terraform apply, and no local init/validate/plan (Decision 119/120 --
    third-party provider egress is blocked; CI is the authoritative verifier).
  - >-
    Do NOT edit src/common/ducklake_runtime.py or src/lambdas/ducklake_catalog_dr/* -- they are
    Lambda-packaged and would convert this into a V3 five-Lambda governed-CD deploy for a comment.
  - >-
    The decisions-index byte pin (112,000) is NEVER raised -- the operator's standing position.
    If it binds, the response is archival or collapsing entries into contracts.
  - >-
    Exhaust the contracts class's first-listed relief valve (compact amendment_log / defer detail)
    and RECORD THE ARITHMETIC before adding any structural-size raise marker. Decision 166
    reversal condition (d) treats roster growth as a signal to re-audit, not to raise.
  - No rescue agents or workaround loops (Decision 55). A failure is diagnosed, not retried blindly.
  - >-
    Single Portal Invariant: the ops_decisions write happens ONLY via
    'ops_data_portal --backfill-decisions-md'. Never edit logs/.decisions-index.jsonl directly.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": round 3 verdict recorded at
    implement time; CITE list across rounds 1-3 = Decision 149, Decision 168, Decision 167,
    Decision 150, Decision 146, Decision 165, Decision 166, Decision 157, Decision 86,
    Decision 170, Decision 160, Decision 84, Decision 155, Decision 48.
  - "gates: decision-scout=FLAGS_FOUND (round 3, after BLOCK in round 1 and FLAGS_FOUND in round 2); plan-critique=<verdict> after <N> round(s)"
  - >-
    WHY DECISION 37 IS STUCK: it is superseded by Decision 116, but D116 covers scheduled-agent
    provider routing only and contains none of D37's Secrets Manager content ('Secrets Manager'
    occurs 2 times in D37, 0 in D116). Archival is blocked because live code still cites the
    number; compaction is blocked because eligibility requires the superseder to restate every
    live clause. The entry sits full-bodied, superseded and permanent -- CFG-10's finding.
  - >-
    WHAT IS ACTUALLY LIVE IN DECISION 37: its ORIGINAL subject (the scheduled-agent dispatcher
    and findings-processor Lambdas, the agents/{name}/{timestamp}.jsonl S3 layout, the agent-NNN
    recommendation namespace) is DEAD -- its only citer, terraform/scheduled_agents.tf, is a
    legacy no-longer-applied root per CD.21. What survives is two DERIVED patterns that 12 other
    files cite D37 as the precedent for: SECRET-VALUE-OUT-OF-BAND (Terraform manages only the
    envelope; material set via put-secret-value, never entering state) and RUNTIME-FETCH
    (consumers fetch from Secrets Manager at runtime). They span five credential domains: broker
    keys, inference API keys, the DuckLake Neon catalog DSN, the GitHub PAT, and CI/OIDC grants.
  - >-
    WHY NOT credential-routing.yaml AS THE DESTINATION (operator-confirmed at Step 6b): it is the
    closest existing file and already restates half the content, but it is Class C under
    extra="forbid" and declares 'CONTRACT BOUNDARY: this file governs SECRET RESOLUTION only'
    three separate times, scoped to brokers. A five-domain pattern living there would make the
    broker contract own a repo-wide rule -- close to the audit's own abort criterion, 'misrouting
    is worse than retention'.
  - >-
    WHY A check EVALUATOR AND NOT agent_surface: config/prose_budgets.yaml seeds every prose
    surface at ZERO headroom and both candidate targets are exactly at budget (S1
    root_ambient_load_set 26768/26768; S2 terraform/CLAUDE.md 30457/30457), so any agent_surface
    route needs a prose-budget raise. 'root_ambient_load_set' appears in ZERO Decision bodies, so
    an S1 raise is mechanically impossible. The check evaluator is also the stronger form under
    Decision 168 clause 2 and reaches all five domains, not just terraform sessions.
  - >-
    THE BUDGET WALL: docs/contracts/decision-entry.yaml measures 499 effective lines against the
    contracts class's 500 limit (config/structural_size_budgets.yaml, Decision 166). That class's
    relief_valve forbids decomposition ('splitting a single subject is forbidden by collocation
    doctrine'), so Decision 128's decompose-by-default does not apply. Its amendment_log is only
    2 substantive entries, so compacting history nets near zero once this change's own entry is
    added. Trim first and show the arithmetic; raise only the residual.
  - >-
    THE CONFORMANCE HOLE THIS PLAN CLOSES: validate_decision_entry_conformance enforces only
    decision numbers ABSENT from the origin/main baseline. Decision 37 is baseline-present, so a
    malformed stub would pass CI silently. Round 2's decision-scout proposed enforcing
    stub_grammar on any entry carrying '**Superseded by: Decision N**' -- that was checked and is
    WRONG, because it would force compaction on partially-superseded entries and contradict the
    eligibility criterion this plan preserves. The rule keys on the body declaring
    '**Status:** Superseded' instead, which catches a malformed compaction attempt while leaving
    a full-bodied entry with a forward pointer alone. Measured today it flags exactly {44, 58},
    both already conforming, plus Decision 37 until compacted.
  - >-
    CLASS CENSUS for the manifest (measured 2026-08-24 from docs/decisions-index.json): of 126
    live entries, 93 current, 29 amended, 2 superseded_pointer (37, 80), 2 superseded_compacted
    (44, 58). Live citing-file counts under the strict exclusion set: D37=14 (13 substantive),
    D80=36, D44=11, D58=5, D24=1, D25=0. Only Decision 37 is PROCESSED by this plan; the rest are
    enumerated with disposition. Decision 80's superseder is an inbound Decision 104 title edge,
    not a victim-side marker.
  - >-
    THE LARGER CAPABILITY IS DELIBERATELY OUT OF SCOPE: extracting HOW content from LIVE
    (non-superseded) entries is filed as rec-3246. The audit records why it does not exist --
    routing is ONE-WAY-AT-ENTRY, so no lifecycle mechanism can undo a misroute later, and
    Decision 162's disposition states that no lawful path moves duplicated clause text out before
    supersession. That capability reaches 122 of 126 live entries; this plan's branch reaches 4.
    An in-flight DECISIONS.md sweep session is blocked on rec-3246 and should sequence behind it,
    consuming this plan's manifest as its enumeration substrate rather than re-deriving it.
  - >-
    KNOWN DRIFT, NOT FIXED HERE: Decision 166 point 9 states the docs/decisions-index.json pin
    was re-derived to 131,000 bytes, but the live validator constant is
    _COMMITTED_INDEX_MAX_BYTES = 112_000 (tests/test_decisions_index.py:496), matching
    decision-entry.yaml's size_governance.index_max_bytes, which that contract names as the SoT.
    rec-3012's skeletonization re-derived it downward after Decision 166 landed. File a
    recommendation; do not fix inline (AGENTS.md out-of-scope rule).
  - >-
    rec-2822 RELEVANCE VERDICT: scripts.rec_relevance returns 'stale_target' because
    docs/decision-migration/MANIFEST.yaml is absent -- which is inverted for a Create-type rec,
    since the file is absent precisely because the rec exists to create it. The operator
    confirmed bundling. Separately, the planning skill prescribes a propose_or_close_rec helper
    that does not exist in scripts/rec_relevance.py; worth its own recommendation.
  - >-
    rec-2823 ACCEPTANCE MISMATCH: its acceptance probe is
    'grep -q "Multi-Environment Deployment Strategy" docs/DECISIONS_ARCHIVE.md', which targets
    Decision 24 being ARCHIVED. This plan exercises the branch on Decision 37 and archives
    nothing (D37's citations do not retire here). Restate the acceptance to the exemplar actually
    exercised when closing it via --update-rec, and say so in the resolution.
  - >-
    Branch was 0 commits behind origin/main at planning time; no scope overlap with main. A
    parallel session is scoping a DECISIONS.md sweep over decision-entry.yaml's compaction
    section -- coordinate before implementing to avoid a collision in a file with one effective
    line of headroom.
