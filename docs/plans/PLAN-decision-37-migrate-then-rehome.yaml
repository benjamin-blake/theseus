  - source: terraform/personal/secrets_manager_brokers.tf
    behavior: The citation repoint is comment-only and produces no terraform diff.
    verification_step: 6
    command: "git diff origin/main -- terraform/"
    red_green_expectation: Waived as a per-file unit -- covered tree-wide by step 6.
  - source: terraform/personal/prod_lambdas.tf
    behavior: The citation repoint is comment-only and produces no terraform diff.
    verification_step: 6
    command: "git diff origin/main -- terraform/"
    red_green_expectation: Waived as a per-file unit -- covered tree-wide by step 6.
  - source: terraform/personal/neon_ducklake_catalog.tf
    behavior: The citation repoint is comment-only and produces no terraform diff.
    verification_step: 6
    command: "git diff origin/main -- terraform/"
    red_green_expectation: Waived as a per-file unit -- covered tree-wide by step 6.
  - source: terraform/personal/oidc.tf
    behavior: The citation repoint is comment-only and produces no terraform diff.
    verification_step: 6
    command: "git diff origin/main -- terraform/"
    red_green_expectation: Waived as a per-file unit -- covered tree-wide by step 6.
  - source: terraform/bootstrap/github_ci_apply_reads.tf
    behavior: The citation repoint is comment-only and produces no terraform diff.
    verification_step: 6
    command: "git diff origin/main -- terraform/"
    red_green_expectation: Waived as a per-file unit -- covered tree-wide by step 6.
  - source: scripts/ducklake_neon_smoke_test.py
    behavior: The docstring citation points at the new contract and the module still imports.
