  - source: scripts/checks/iam_tf/_manifest.py
    behavior: The new check is dispatched and sequenced, not merely registered.
    verification_step: 2
    test_selector: tests/checks/iam_tf/test__manifest.py
    red_green_expectation: Red before, green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check has a function_to_category row so CI-RCA can classify its failures.
    verification_step: 9
    command: "grep -q 'validate_secret_material_handling' config/ci_rca_taxonomy.yaml"
    red_green_expectation: Red before, green after.
  - source: config/structural_size_budgets.yaml
    behavior: >-
      Any decision-entry.yaml budget entry carries an authorized raise marker and a frozen
