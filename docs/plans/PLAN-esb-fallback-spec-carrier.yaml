rollback: >-
  Every change is additive-or-textual in git-tracked files with no deploy, migration or warehouse
  write. `git revert` of the squash commit restores CD.27's prior text, removes the carrier and R4,
  and restores the retired guard together with the clause it protects -- the two move together, so the
  revert leaves no half-state. The one asymmetry to know: reverting after wave 5 has ratified CD.27
  would restore an R4-less guard while a discharge block remains in the roadmap, which is inert (an
  unread mapping entry) rather than failing.
