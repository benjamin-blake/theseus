    still admitted by the real differential gate before writing it to the registry. Any future wave
    graduating a regex-bearing multi-line script into `config/agent/verification_registry/
    registry.yaml` will hit this; the general rule is: a graduated `check_spec.command` script that
    must survive a literal-substring check against its OWN re-dumped text should avoid indented
