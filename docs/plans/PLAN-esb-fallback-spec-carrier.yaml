    block body) -- independent of total length. Verified by bisection down to a minimal 4-line
    repro (`"a = 1\nfor i in range(3):\n    b = 2\ntok = r'x'\n"` dumps double-quoted;
    the same content with the `for` line removed dumps single-quoted). This silently breaks any
    single-backslash literal search (e.g. VP step 3's regex-identity ratchet,
    `LB in yaml.safe_dump(row['check_spec'])`) against a graduated registry row's check_spec, even
    though the SOURCE text is byte-identical in meaning. Cost of discovery: the differential
