schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "esb-fallback-spec-carrier"
intent: >-
  Close audit finding ESB-02 by making CD.27's named fallback real where CD.27 currently only claims
  it is: specify the self-checkpointed-Lambda/DynamoDB fallback to state-schema and granularity
  level, replace its phantom "recorded as an INTENT Open Question" re-evaluation control with an
  instantiated validate.py carrier, and annotate the prior audit's C7 dismissal that trusted the
  phantom control once already.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-esb-fallback-spec-carrier.yaml
phase: >-
  Platform T4 (executor substrate) -- contract remediation against candidate_decision CD.27 and the
  candidate-decision ratification lane. Remediates finding ESB-02 of
  audits/executor-substrate-and-billing-shape-ad02653.yaml (finding entry at :846-865). Wave 3 of a
  5-wave remediation run; wave 1 (PLAN-esb-text-fix-bundle, 155404d) landed CD.27's resume_properties
  P1/P2/P3 and wave 2 (PLAN-esb-workspace-store-criteria, 41e19fc) landed CD.43's workspace-store
  criteria. Wave 5 is the CD.27 layer-2 ratification spike and is the first consumer of rule R4.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Four sites, all inside CD.27. (a) The maturity-monitoring discipline_point is rewritten IN
      PLACE: the false clause "recorded as an INTENT Open Question for re-eval at each T4.2
      atomic-plan filing" and the stale "checkpoint-replay verified" tracking pointer are removed;
      the point names the new fallback_spec block, the instantiated carrier
      validate_fallback_reevaluation, and the live health-tracking references (T4.2 c1's
      resume_properties P1/P2/P3 and this CD's stability_definition_14d unplanned_resume_rate).
      (b) NEW dict discipline_point `fallback_spec` carrying NINE keys -- trigger, substrate,
      state_schema (grain/identity/partition_key/sort_key/attributes/write_mode),
      checkpoint_granularity, driver, cutover, effort, reevaluation_carrier AND lapse_condition. (c) Wave 2's cross-reference-correction point is updated
      to past tense, recording that the deferred correction has now been applied in place. (d) NEW
      short string discipline_point stating the precondition-discharge rule. The three existing
      "Layer-2 ratification precondition (ESB-NN)" strings are NOT touched -- see constraints.
  - file: docs/contracts/candidate-decision-ratification.yaml
    action: Modify
    purpose: >-
      Add rule R4 to referential_guard.rules -- a state==ratified CD must record a non-empty
      discharge entry for every ratification precondition id its own text declares -- plus an
      amendment note following the file's existing precedent. The note is NOT a gate obligation:
      this file is deliberately non-ritual (no top-level contract:/class: block) and says so at
      :20-21, so validate_contract_drift pass 1 skips it at :68-72 and pass 2 never sees it.
      Recorded precisely because this plan's own thesis forbids asserting a control that does not
      exist. R4 sits beside R1/R2/R3 as a rule of the same lane on the same object, which is why it
      needs no numbered Decision (none of R1-R3 has one).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add the `FallbackReevaluation` model (reevaluated_on, substrate_status, verdict enum, basis;
      extra="forbid") and an OPTIONAL `fallback_reevaluation: FallbackReevaluation | None = None`
      field on PlanDocument. Shape only -- the obligation to carry it lives in the check, mirroring
      the closes_criteria precedent (loose token shape here, membership in validate_platform_roadmap).
  - file: scripts/checks/roadmap/validate_fallback_reevaluation.py
    action: Create
    purpose: >-
      The instantiated re-evaluation carrier. Resolves CD.27's own `gates` list from the roadmap as
      the trigger set, then requires any NET-NEW docs/plans/PLAN-*.yaml that names a gated tier item
      -- in `closes_criteria` OR in the required `phase` field -- to carry a fallback_reevaluation
      block. Net-new scoping is Decision 132's settled answer to retro-fitting (verified necessary: a
      whole-directory version of this predicate reddens 8 historical plans); the phase leg is what
      makes the carrier instantiable at all (see the TRIGGER INSTANTIABILITY entry in context).
      BOUNDARY-AWARE TOKEN MATCH IS MANDATORY on the phase leg -- (?<![\w.])T4\.1(?![\w]), never a
      bare substring: gate T4.1 is a string prefix of T4.10, T4.10a, T4.11, T4.12, T4.13 and T4.14,
      and the trailing lookahead must exclude word characters ONLY, so a legitimate sentence-final
      "T4.4." still matches. Both failure directions are demonstrated on the live corpus -- see
      TRIGGER INSTANTIABILITY. Net-new paths come from _common.get_status_aware_diff()'s "A" entries
      -- the _common-owned primitive -- rather than a third private _added_plan_paths copy.
      Advisory-SKIP on unreachable origin/main per Decision 132 limitation A; fail-loud if CD.27 is
      absent (Decision 55). NO added_paths injection seam -- see NET-NEW SEAM REFUSAL in context.
  - file: scripts/checks/roadmap/validate_candidate_decision_ratification.py
    action: Modify
    purpose: >-
      Add the R4 leg to the guard that already owns R1/R2/R3 on this exact object and already loads
      the roadmap. No new registered check, no new registry sequence entry, no new validate.py
      re-export.
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Register validate_fallback_reevaluation in pre_sequence() with
      pre_globs=("docs/plans/**", "docs/ROADMAP-*") and in full_sequence() ungated, positioned
      immediately after validate_plan_documents (same inputs, same parse class).
  - file: scripts/validate.py
    action: Modify
    purpose: >-
      Add the `from scripts.checks.roadmap.validate_fallback_reevaluation import
      validate_fallback_reevaluation  # noqa: F401,E402` re-export line. Dispatch is
      globals()[name](failed), so without this line validate --pre KeyErrors on the check name.
      IT MUST BE A SINGLE LINE, not the parenthesised multi-line form #834 used two commits ago.
      Measured on 9f81d2f: the file is 497/500 SLOC (unregistered-file limit; 3 lines of headroom),
      the single-line form is 115 characters and so fits the 127 ruff line-length, landing the file at
      498/500 with 2 lines of headroom. The wrapped 3-line form lands at exactly 500/500 -- legal, but
      zero headroom, which hands the next unrelated PR a Decision 128 decomposition event this plan
      did not budget for. Do NOT raise a budget or inline anything clever if it does not fit;
      decomposition is the sanctioned answer and it is not this wave's job (that would be a BLOCKED).
  - file: tests/checks/roadmap/test_validate_fallback_reevaluation.py
    action: Create
    purpose: >-
      Mirror-home unit guards for the carrier, using the plans_dir/roadmap seams with fixture plans:
      a triggering plan without the block FAILS naming the plan and the gated item; the same plan
      with a valid block PASSES; a plan closing a non-gated criterion is untouched; a plan with empty
      closes_criteria is untouched; CD.27 absent from the fixture roadmap FAILS loudly.
  - file: tests/checks/roadmap/test_validate_candidate_decision_ratification.py
    action: Modify
    purpose: >-
      Append the R4 cases: ratified-with-preconditions-and-no-discharge FAILS; partial coverage FAILS
      naming the specific missing id; full discharge PASSES; a lapse entry counts as a discharge; and
      the three no-op paths (ratified CD declaring no preconditions, a CD with no discipline_points,
      a pending CD carrying preconditions) are proven clean rather than merely not-failing.
  - file: tests/test_plan_document.py
    action: Modify
    purpose: >-
      Schema cases for the new optional field: a well-formed block validates; an unknown verdict, an
      empty basis, a missing basis and an extra key each raise; and a plan omitting the field
      entirely still validates (the property that keeps all 305 historical plans legal).
  - file: tests/esb_text_fix/test_fallback_spec.py
    action: Create
    purpose: >-
      The successors to the retired wave-2 guard, plus this wave's own roadmap guards: fallback_spec
      well-formedness, the maturity point's phantom-free/carrier-bound invariants, the
      discharge-rule point, and a growth-safe anchor-phrase membership floor over the four CD.27
      string discipline_points that the retired guard covered only incidentally.
  - file: tests/esb_text_fix/test_decision_scope_notes.py
    action: Modify
    purpose: >-
      Retire the `_WAVE3_PROTECTED_STALE_QUOTES` exemption (and its now-dead exemption branch in
      test_cd27_exit_criterion_cross_references_resolve). Its entry -- ("T4.2", "checkpoint-replay
      verified") -- exists solely because wave 2 could not edit the point this wave rewrites, and its
      comment asserts wave-3 ownership of that point. The moment this plan lands, the stale quote is
      gone, the entry is dead, and the comment is factually false -- and it would NOT redden CI,
      which is exactly why it would rot. Removing the exemption makes the guard strictly stronger:
      every quoted T4.x criterion reference must resolve, with no exempt set.
  - file: tests/esb_text_fix/test_workspace_store_criteria.py
    action: Modify
    purpose: >-
      Retire test_cd27_string_discipline_points_are_append_only_vs_origin_main and update the module
      docstring's guard count and its description of which guards pass before and after. Nothing else
      in the module changes.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Add `fallback_reevaluation` to the PLAN-{slug}.yaml template block as the Precision Context
      Injection complement, funded by content-preserving compaction of comment-alignment padding
      inside the same fenced block so the file stays under its prose budget with no budget raise.
      RENDERING IS PRESCRIBED, not left to the author: it must be a COMMENTED-OUT / explicitly
      optional line naming the four required sub-fields and the verdict enum -- never a filled
      placeholder block. PlanDocument is extra="forbid" and the nested model requires all four
      fields, so a filled block copied verbatim onto an ordinary plan would either fail the schema or,
      worse, ship a FABRICATED substrate verdict on a plan whose author never formed one -- the same
      false-assertion class this whole wave exists to remove. Sole template site in the repo (swept).
  - file: audits/executor-roadmap-review-7d57a0d.yaml
    action: Modify
    purpose: >-
      Add an `annotation` key to the C7 entry in audit.rejected_candidates recording that its
      compensating control was shown phantom by ESB-02 and naming the successor carrier. The entry's
      existing keys are not edited -- the dismissal record stays as written, annotated.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    CD.27 carries exactly one `fallback_spec` block whose keys cover trigger, substrate, state_schema,
    checkpoint_granularity, driver, cutover, effort, reevaluation_carrier AND lapse_condition, each a
    substantive string rather than a placeholder; state_schema states its grain in "one item per ___"
    form, declares write_mode append_only, and mints identity as a ULID at the write boundary
    (docs/contracts/data-modeling-standard.yaml). `lapse_condition` states what becomes of this spec
    if wave 5's Q5 spike pins a layer-2 substrate for which a DynamoDB self-checkpoint fallback is
    inapplicable -- mirroring ESB-06's existing LAPSE precedent in shape, so hardening one
    non-managed candidate ahead of the comparative record cannot silently pre-commit the choice.
    MECHANICALLY ENFORCED by VP step 1.
  - >-
    CD.27's maturity-monitoring discipline_point no longer contains the contiguous false clause
    "recorded as an INTENT Open Question" nor the stale pointer "checkpoint-replay verified", and
    DOES name both `fallback_spec` and `validate_fallback_reevaluation`. The negative and positive
    halves are asserted together so neither is satisfiable by the other's absence. MECHANICALLY
    ENFORCED by VP step 1.
  - >-
    The precondition-discharge rule is recorded at BOTH its sites -- a CD.27 discipline_point and
    rule R4 of docs/contracts/candidate-decision-ratification.yaml -- and CD.27's declared
    precondition id set is still exactly {ESB-01, ESB-04, ESB-06} with no duplicate introduced.
    MECHANICALLY ENFORCED by VP step 2.
  - >-
    validate_fallback_reevaluation is registered under that name, present in BOTH pre_sequence() and
    full_sequence(), carries pre_globs covering docs/plans/** and docs/ROADMAP-*, and is resolvable
    as a module-level global of scripts/validate.py. MECHANICALLY ENFORCED by VP step 3.
  - >-
    The carrier FIRES ON BOTH LEGS and retro-fits nothing: a NET-NEW fixture plan naming a gated
    tier item without a fallback_reevaluation block fails the check with a message naming the plan
    and the gated item -- proven separately for the closes_criteria leg and the phase leg; the same
    plan with a valid block passes; a plan naming a non-gated item is untouched; a net-new plan whose
    phase names only T4.12/T4.13 does NOT trigger (the boundary-aware match, proven as a NEGATIVE);
    a plan that is present but NOT net-new is untouched, proven against REAL git state rather than an
    injected seam (the property that keeps the 8 historical plans matching this predicate green); an
    unreachable origin/main advisory-SKIPs rather than failing; and a roadmap without CD.27 fails
    loudly rather than passing vacuously. MECHANICALLY ENFORCED by VP step 4.
  - >-
    Rule R4 fires on partial coverage, not merely on total absence: a ratified CD with preconditions
    and no discharge block fails; one whose discharge omits a single id fails naming THAT id; full
    discharge passes; and the three no-op paths are positively proven clean. MECHANICALLY ENFORCED
    by VP step 5.
  - >-
    PlanDocument accepts a well-formed fallback_reevaluation block, rejects an unknown verdict, an
    empty basis, a missing basis and an extra key, and every one of the 305 historical
    docs/plans/PLAN-*.yaml still validates unchanged (Decision 85: validate_plan_documents
    re-validates the whole directory and the model is extra="forbid"). MECHANICALLY ENFORCED by VP
    step 6.
  - >-
    .claude/skills/planning/SKILL.md surfaces `fallback_reevaluation` in its PLAN template, its byte
    size is at or under the budget READ FROM config/prose_budgets.yaml (not a literal), and every
    template field key present before this change is still present. MECHANICALLY ENFORCED by VP
    step 7.
  - >-
    The C7 entry of audits/executor-roadmap-review-7d57a0d.yaml carries an annotation naming ESB-02,
    the phantom nature of its compensating control, and the successor carrier -- located by
    candidate-id prefix, not by list position. MECHANICALLY ENFORCED by VP step 8.
  - >-
    test_cd27_string_discipline_points_are_append_only_vs_origin_main is absent from the repository
    and from the verification registry, and each invariant it held is either carried by a named
    successor assertion or explicitly disclaimed (see the GUARD RETIREMENT entry in context).
    MECHANICALLY ENFORCED by VP step 9.
  - >-
    All FIVE live graduated registry rows that read the roadmap this wave edits --
    cd27-layer2-preconditions-cover-esb01, t4x-persona-contracts-mechanism-word-free,
    cd27-stability-gate-evaluable, cd43-selection-criteria-well-formed and
    t41-names-workspace-store-criteria -- still pass against the edited roadmap, re-executed from
    their stored check_spec. MECHANICALLY ENFORCED by VP step 10.
  - >-
    The full esb_text_fix package passes, and `scripts.validate --pre` exits 0 -- which is also the
    proof that neither new obligation reddens the existing tree of 305 plans and 24 ratified CDs.
    MECHANICALLY ENFORCED by VP steps 11 and 12.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      KEYSTONE. The fallback is specified, and the phantom control is gone from the exact clause that
      asserted it. Negative and positive halves are asserted TOGETHER: removing the false clause
      while failing to name the real carrier would pass a negative-only check, and naming the carrier
      while leaving the false clause would pass a positive-only one. The maturity point is located by
      startswith('Lambda Durable Functions maturity monitoring'), never by a bare 'maturity
      monitoring' substring -- the past-tense audit-trail note added at site (c) contains the
      hyphenated form and would collide with the loose selector. The gate-name check uses the SAME
      boundary-aware token match this plan mandates for the carrier's phase leg,
      (?<![\w.])T4\.N(?![\w]): a bare `g in m` substring test is satisfied by T4.10/T4.10a/T4.11/
      T4.12/T4.13/T4.14, so this graduated row could pass vacuously on a future CD.27 text that names
      T4.12 while having dropped T4.1. The two matchers are deliberately identical, and that identity
      is ENFORCED rather than asserted: VP step 3 checks the boundary-aware lookbehind literal is
      present both in the carrier module source and in this row's stored check_spec, so a future edit
      to one cannot silently diverge from the other.
    command: |-
      bin/venv-python -c "
      import re, yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cd = [c for c in d['candidate_decisions'] if c['id'] == 'CD.27'][0]
      specs = [q for q in cd['discipline_points'] if isinstance(q, dict) and 'fallback_spec' in q]
      assert len(specs) == 1, f'fallback_spec must appear exactly once in CD.27, found {len(specs)}'
      s = specs[0]['fallback_spec']
      required = {'trigger','substrate','state_schema','checkpoint_granularity','driver','cutover','effort','reevaluation_carrier','lapse_condition'}
      assert required <= set(s), f'fallback_spec missing {sorted(required - set(s))}'
      thin = {k: v for k, v in s.items() if isinstance(v, str) and len(v.strip()) < 40}
      assert not thin, f'fallback_spec key(s) present but contentless: {sorted(thin)}'
      sch = s['state_schema']
      sreq = {'grain','identity','partition_key','sort_key','attributes','write_mode'}
      assert sreq <= set(sch), f'state_schema missing {sorted(sreq - set(sch))}'
      grain = sch['grain']
      assert 'one item per' in grain.lower(), f'grain must be stated as one-item-per: {grain!r}'
      wmode = sch['write_mode']
      assert wmode.startswith('append_only'), f'write_mode must be append_only: {wmode!r}'
      assert 'ULID' in sch['identity'], 'identity must mint a ULID at the write boundary'
      assert 'validate_fallback_reevaluation' in s['reevaluation_carrier'], 'the carrier key must name the registered check'
      lapse = s['lapse_condition']
      assert 'LAPSE' in lapse.upper(), f'lapse_condition must state a lapse in ESB-06 shape: {lapse!r}'
      assert any(t in lapse for t in ('ESB-04', 'ESB-06', 'spike')), 'lapse_condition must bind to the layer-2 selection that could make this spec inapplicable'
      mat = [q for q in cd['discipline_points'] if isinstance(q, str) and q.startswith('Lambda Durable Functions maturity monitoring')]
      assert len(mat) == 1, f'expected exactly 1 maturity-monitoring point, found {len(mat)}'
      m = mat[0]
      for phantom in ('recorded as an INTENT Open Question', 'checkpoint-replay verified'):
          assert phantom not in m, f'the maturity-monitoring point still carries the phantom/stale clause: {phantom}'
      for live in ('fallback_spec', 'validate_fallback_reevaluation'):
          assert live in m, f'the maturity-monitoring point does not name {live}'
      gates = cd['gates']
      tok = re.compile(r'(?<![\w.])(' + '|'.join(re.escape(g) for g in gates) + r')(?![\w])')
      named = sorted(set(tok.findall(m)))
      assert set(named) == set(gates), f'DOC-SAYS-X / CONTROL-DOES-Y: the control triggers on all of {gates} but the text names only {named} -- state the widened obligation or narrow the trigger'
      blob = yaml.safe_dump(specs[0], sort_keys=False)
      assert 'arn:' not in blob.lower(), 'fallback_spec contains an ARN (PUBLIC repository)'
      assert not re.search(r'(?<!\d)\d{12}(?!\d)', blob), 'fallback_spec contains a 12-digit account-id-shaped token'
      print('OK fallback_spec specified;', len(s), 'keys;', len(sch), 'state_schema keys; maturity point phantom-free, carrier-bound, trigger-agreed over', gates)
      "
    expected: >-
      Exit 0, printing `maturity point phantom-free, carrier-bound, trigger-agreed over` followed by
      the gated-item list, preceded by the key counts. Proven failing-first this session on the
      pre-edit tree with the executed diagnostic "fallback_spec must appear exactly once in CD.27,
      found 0" (quoted, not backticked -- a failing-first diagnostic is absent by construction from
      the passing run validate_vp_replay scans), and proven passing against a simulated correct tree.
    fix_if: >-
      "DOC-SAYS-X / CONTROL-DOES-Y" means the rewritten maturity point still describes the obligation
      as firing at each T4.2 filing while the control fires across every item CD.27 gates -- either
      state the widened obligation in the text (the chosen resolution) or narrow the trigger; a
      document and its control disagreeing is the ESB-02 defect in miniature. "lapse_condition must
      state a lapse" means the fallback was hardened to schema level with no stated fate if wave 5
      pins a substrate it does not apply to, which pre-commits the non-managed candidate ahead of the
      comparative record ESB-04 requires. "found 0" means the block was added under a different key
      name, or as a top-level CD key rather
      than a discipline_points mapping entry -- CD.27's discipline_points is the only legal home (the
      resume_properties and stability_definition_14d blocks are the shape precedent). "key(s) present
      but contentless" means a key was stubbed to satisfy the shape; write the content. "grain must be
      stated as one-item-per" means the grain was written as a description rather than a grain
      sentence. "still carries the phantom/stale clause" means the maturity point was appended to
      rather than rewritten in place -- this wave OWNS that clause and must edit it; a new sibling
      point leaving the false clause standing is exactly the defect ESB-02 names. "does not name
      fallback_spec" means the clause was cleaned but left pointing at nothing.
    graduation: graduate
    graduation_check_id: cd27-fallback-spec-and-carrier-binding
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      The discharge rule is recorded at BOTH sites, and recording it did not perturb the precondition
      class. Asserted as a membership floor over the declared ids plus a uniqueness invariant, so
      wave 5 may add a fourth precondition without reddening a standing row it never touched -- and
      the id list is re-derived from the roadmap rather than hardcoded in the CD.27 assertion.
    command: |-
      bin/venv-python -c "
      import re, yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cd = [c for c in d['candidate_decisions'] if c['id'] == 'CD.27'][0]
      pts = [q for q in cd['discipline_points'] if isinstance(q, str)]
      pat = re.compile(r'ratification precondition \((\w+-\d+)\)')
      ids = [m for q in pts for m in pat.findall(q)]
      assert len(ids) == len(set(ids)), f'a precondition id is now claimed twice: {ids}'
      assert {'ESB-01','ESB-04','ESB-06'} <= set(ids), f'precondition floor broken: {sorted(set(ids))}'
      rule = [q for q in pts if 'precondition_discharge' in q]
      assert len(rule) == 1, f'expected exactly 1 discharge-rule point, found {len(rule)}'
      assert 'validate_candidate_decision_ratification' in rule[0], 'the discharge rule must name its enforcing guard'
      assert not pat.findall(rule[0]), 'the discharge-rule point must not itself declare a precondition id'
      c = yaml.safe_load(open('docs/contracts/candidate-decision-ratification.yaml'))
      rules = c['referential_guard']['rules']
      assert 'R4' in rules, f'contract carries no R4: {sorted(rules)}'
      r4 = yaml.safe_dump(rules['R4'])
      assert 'precondition_discharge' in r4, 'R4 does not name the block it requires'
      assert 'ratified' in r4, 'R4 does not state the state it applies to'
      print('OK discharge rule recorded at both sites; precondition ids', sorted(set(ids)))
      "
    expected: >-
      Exit 0, printing `discharge rule recorded at both sites;` then the sorted id list. Proves the
      rule exists in CD.27's text AND as a contract rule, that the new point introduced no duplicate
      id, and that the precondition class is intact.
    fix_if: >-
      "a precondition id is now claimed twice" means the discharge-rule point was worded using the
      `ratification precondition (ESB-NN)` pattern -- reword it; that pattern is the id declaration
      itself and is also read by a live graduated registry row. "contract carries no R4" means the
      rule was added to the guard but never to the contract, leaving the code as the only source of
      truth for a governance rule. "precondition floor broken" means an existing precondition string
      was edited or dropped -- restore it byte-for-byte; this wave does not touch them.
    graduation: graduate
    graduation_check_id: cd27-precondition-discharge-rule-recorded
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      The carrier is wired, not merely written. Decision 104's dispatch is globals()[name](failed) with
      no auto-discovery, so a check can be registered and sequenced yet still KeyError at run time if
      the validate.py re-export line is missing -- all three facts are asserted separately. The
      pre_globs assertion is the Decision 73 cost bound expressed as a test rather than as prose. It also carries the REGEX-IDENTITY RATCHET: step 1's action claims
      the carrier's phase-leg matcher and this plan's graduated row use the identical boundary-aware
      form, and that claim was PROSE until now -- the row's regex freezes into check_spec at
      graduation while the module's lives in source, so nothing stopped a future edit to one from
      silently diverging. This step now asserts the lookbehind literal is present in the carrier
      module, and -- conditionally, because the row is written by the graduation walk AFTER the VP
      runs, so an unconditional check would be an ordering trap -- in the stored check_spec too.
    command: |-
      bin/venv-python -c "
      from scripts.checks import registry
      import scripts.validate as v
      name = 'validate_fallback_reevaluation'
      pre = {s.name: s for s in registry.pre_sequence() if s.kind == 'check'}
      full = [s.name for s in registry.full_sequence() if s.kind == 'check']
      missing = [t for t, seq in (('pre', pre), ('full', full)) if name not in seq]
      assert not missing, f'{name} is not in the {missing} tier sequence(s)'
      assert name in registry.all_checks(), f'{name} was never registered via the register decorator'
      globs = pre[name].pre_globs
      assert globs, f'{name} runs ungated in --pre; it parses the whole plans directory and must carry pre_globs'
