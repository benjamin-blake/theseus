execution_steps:
- Run verification step 1 FIRST, before any edit, and record its output -- it is the BEFORE state and it inverts the moment the config changes.
- Modify pyproject.toml -- replace the single [tool.ruff.lint] select line with the fourteen-element sorted list ["A", "ASYNC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"], and add directly above it one comment line recording that FA is target-version-gated and enforces nothing at py312 (Decision 170). Two added lines, one removed line; change nothing else in the file. Keep select on ONE line -- step 5's mutation arms substitute on `^select = \[.*\]$`.
- Create tests/checks/hygiene/test_pyproject_ruff_select.py -- a ratchet membership assertion over the fourteen families, a duplicate-family assertion, a growth-safe assertion that every selected family owns at least one stable non-preview rule, a parametrized synthetic-violation-fires assertion over the nine families that can fire at py312, and a separate target-version-gated assertion for FA. Fixtures go to tmp_path and ruff runs via subprocess with sys.executable and encoding utf-8 with errors replace; nothing is checked in. The stable-rule assertion matches family to rule by prefix-plus-digits over `ruff rule --all --output-format=json` (code starts with the family, remainder all digits), never code.startswith(family) and never an anchored ^([A-Z]+)[0-9]+$ family capture -- see the constraint line for the measured counterfactuals on both.
- Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
- 'Open the PR with a body that states: this closes no open recommendation and carries no Resolves trailer; the ten wave-A families and their zero measurement; that wave B is a separate later unit; that the deploy-trigger set was enumerated from the two deploy workflows and subtracted from the scope; and that FA is selected but target-version-inert at py312.'
- 'Report: what was implemented, verification results.'
