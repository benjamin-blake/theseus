  expected: 'An SLOC count at or below 500, then a line reporting the file is unregistered with no raise marker, exit zero. The COUNT ITSELF IS NOT ASSERTED and no step or acceptance criterion pins it: the planning session''s draft measured 82, a lean faithful reconstruction of the same specification measures 66, and a more explicit one measures 91 (all three re-measured 2026-09-04 under this step''s own counting rule). Only the <= 500 bound is load-bearing, and all three are far inside it.'
  fix_if: An SLOC count above 500 means the test must be decomposed into a facade package per Decision 128, never registered with a raise marker. A hit on the raise-approved grep means a budget was raised somewhere in this diff, which Decision 181 forbids for this unit -- remove it.
  hermetic: true
  graduation: waive
