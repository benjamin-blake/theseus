  phase: pre-deploy
  action: Prove no file under src/ and no deploy-trigger file appears in the diff, deriving the deploy-trigger set by parsing the push path filters out of the two deploy workflows rather than trusting any list written in this plan.
  command: bin/venv-python -c "import fnmatch,re,subprocess;from pathlib import Path;W=['deploy-prod-lambdas.yml','deploy-ducklake-lambdas.yml'];B=[re.search(r'^on:\n(?:.*\n)*?^\s{4}paths:\n((?:\s{6}- .*\n)+)', Path('.github/workflows',w).read_text(encoding='utf-8'), re.M).group(1) for w in W];pats=[ln.strip().lstrip('- ').strip(chr(39)+chr(34)) for b in B for ln in b.splitlines()];files=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True,encoding='utf-8',errors='replace').stdout.split();hits=[f for f in files if f.startswith('src/') or any(fnmatch.fnmatch(f,p) or f.startswith(p.rstrip(chr(42)).rstrip('/')+'/') for p in pats)];print('deploy-trigger patterns:',len(pats));print('diff files:',files);print('hits:',hits);raise SystemExit(1 if hits or len(pats)<12 else 0)"
  expected: Twelve deploy-trigger patterns parsed from the two workflows, a diff file list of pyproject.toml and the new hygiene test, an empty hits list, and exit zero. The planning session reproduced the same twelve patterns on 2026-09-04.
  fix_if: A non-empty hits list means the diff reaches a deploy-trigger or src/ path -- remove that edit; it is out of this unit's declared scope and would fire a production code-deploy workflow on merge. Fewer than twelve patterns means the parse missed a filter block, which would make the check silently permissive; fix the parse before trusting the empty result.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The prohibition is unit-scoped, not a repository invariant. Deploy-trigger files are legitimately editable by other units -- that is what the governed code-deploy channel exists for -- so a standing registry row forbidding any diff from touching them would forbid what the repository permits and would redden correct future work. It also goes vacuous post-merge, when the diff is empty.
