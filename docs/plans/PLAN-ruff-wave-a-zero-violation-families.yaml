  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0 with every fast-tier check passing, including validate_scope_boundary over the two declared scope rows, validate_vp_replay over this plan's hermetic pre-deploy steps, validate_sloc_limits, validate_sloc_budget_raises and validate_test_count_coupling.
