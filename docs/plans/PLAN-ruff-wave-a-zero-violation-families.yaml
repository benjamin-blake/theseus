- step: 9
  phase: pre-deploy
  action: Touched-set assertion over the status-aware diff primitive -- the only paths this unit touches are the two declared scope rows plus the resolved plan's own path, which implement-scope-boundary.yaml sanctions as the implementing_plan_bookkeeping row.
  command: bin/venv-python -c "from scripts.checks import _common; D={'pyproject.toml','tests/checks/hygiene/test_pyproject_ruff_select.py'}; rows=[p for _s,p in _common.get_status_aware_diff()]; extra=sorted(p for p in rows if not p.startswith('docs/plans/PLAN-') and p not in D); missing=sorted(D-set(rows)); print('touched:',sorted(rows)); print('undeclared:',extra); print('missing:',missing); raise SystemExit(1 if extra or missing else 0)"
  expected: The touched list contains pyproject.toml, the new hygiene test and the plan path; undeclared and missing are both empty lists and the step exits zero.
