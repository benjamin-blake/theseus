- step: 13
  phase: pre-deploy
  action: 'Decision 182 budget measurement for this plan''s two-path scope, recorded so the fast-tier outcome is expected rather than discovered in CI. BOTH halves are named, because the half this change actually moves is the NON-TEST one: `ruff check` is a static step, so ten added rule families spend NON_TEST_BUDGET_SECONDS, not the breadth-derived test allowance.'
  command: bin/venv-python -m scripts.checks.deps.selection_budget --paths pyproject.toml tests/checks/hygiene/test_pyproject_ruff_select.py
  expected: 'A report showing 2 paths, an n_selected of 11 against a census of roughly 531 test modules, a test-execution allowance of 180 seconds, a predicted CI test half near 28.3 seconds, a predicted CI elapsed range of roughly 79.3 to 100.1 seconds, and a predicted outcome of within_budget with the advice to plan the scope as one unit. The line that matters most for THIS change is the reporter''s `non-test budget: 240s`: that half is where the ten added families land, it is branch (1) of classify''s pinned order (unwaivable, evaluated before bypass and before the forced waiver), and the measured delta is sub-20ms -- ruff check . (deliberately unbackticked, see below) cold-cache ran 0.128/0.130/0.134s with four families and 0.137/0.139/0.145s with fourteen in a scratch clone of 5ff55c9 on 2026-09-04, against a non-test half whose measured occupancy is 51-72s (Decision 182 point 6 residual (i), 3.34x headroom). The breadth report itself was reproduced by the planning session on 2026-09-04 in a scratch clone carrying the new test file. REPLAY CONTRACT for this step, verified rather than assumed: it is hermetic and pre-deploy, so validate_vp_replay re-executes it and requires EVERY backtick-delimited literal in this text to appear in the replayed stdout+stderr. Exactly one literal appears here, `non-test budget: 240s`, and the reporter prints it verbatim on its second output line -- confirmed on 2026-09-04 by calling scripts.checks.verification.validate_vp_replay._replay_step over this plan''s seven hermetic pre-deploy steps (3, 4, 8, 10, 11, 12, 13) against an implementation-bearing clone: all seven replay clean. The ruff check . invocation named above is prose about what this step MEASURES, not output the reporter emits -- the reporter''s five lines never contain that string -- so it carries no backticks; re-backticking it reddens validate_vp_replay, which is registered pre=True with no full_segment, i.e. it reddens the FAST TIER on this unit''s own implement PR.'
  fix_if: A predicted outcome of breach means the measured breadth grew and the scope must be split into atomic units; a predicted outcome of breadth_waived means the breadth must be declared in this plan before it is discovered in CI. A non_test_breach in real CI is the outcome this step's sub-20ms measurement says cannot be caused by this change -- if one occurs, the cause is elsewhere in the non-test half and routes to ci-rca, not to dropping families to buy back milliseconds. Never widen the scope rows to chase a nicer number.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The reporter exits zero on every path by design -- it is a plan-time report, not a gate -- so a command_exit_zero registry row over it would be a vacuous guard that passes regardless of the verdict, which is exactly the false-green shape Decision 55 rejects and the indistinguishable-green shape Decision 170 exists to end. The real gate on the number this step reports is the fast tier's own budget classification, which already runs on every CI invocation.
- step: 14
  phase: pre-deploy
