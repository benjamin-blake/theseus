test_obligations:
- source: pyproject.toml
  behavior: '[tool.ruff.lint] select must continue to CONTAIN all fourteen families -- the four pre-existing E, F, W, I and the ten adopted A, ASYNC, FA, INT, ISC, LOG, Q, SLOT, TID, YTT -- and must never name a family whose rules are all preview-only, which would be inert. Membership, not equality: a later unit may add a family without editing the test.'
  verification_step: 5
  test_selector: tests/checks/hygiene/test_pyproject_ruff_select.py::TestRuffSelectRatchet::test_adopted_and_preexisting_families_are_all_present
  red_green_expectation: 'RED before, GREEN after. Rehearsed 2026-09-04 in a scratch clone: with the base four-family select restored the module gives 11 failed / 2 passed; with SLOT alone removed from the fourteen it gives 2 failed / 11 passed; with an unrelated family (C4) added it stays 13 passed, proving the ratchet direction; with DOC added it gives 1 failed / 12 passed on the stable-rule assertion. On the target list all 13 pass.'
- source: tests/checks/hygiene/test_pyproject_ruff_select.py
  behavior: Every family named in select must actually FIRE -- ruff, running under this repository's own pyproject config, must emit that family's rule code against a synthetic violation of it (A001, ASYNC251, INT001, ISC001, LOG009, Q000, SLOT000, TID252, YTT201). FA is guarded separately because both its rules respect target-version and neither can fire at py312, so its guard asserts FA100 fires at py38 against the same fixture and is silent at py312. Fixtures are written to tmp_path and linted via subprocess; none is checked in.
  verification_step: 6
  test_selector: tests/checks/hygiene/test_pyproject_ruff_select.py::TestSelectedFamiliesAreLive::test_adopted_family_fires_on_a_synthetic_violation
  red_green_expectation: 'RED before, GREEN after. Rehearsed 2026-09-04: against the base four-family select nine of the ten firing parameters fail (the family is listed nowhere, so ruff reports no code for the fixture) and the FA target-version parameter fails on its py38 arm; against the fourteen-family select all ten pass. Removing any single family from select reddens exactly that family''s parameter.'
constraints:
- Wave A only. This plan may not adopt, mention as in-scope, or pre-stage any wave B family (ICN, INP, C4, ERA, RET, PIE). Wave B extends the same select line and must be planned against the post-wave-A tree; a per-file-ignores table is wave B's to add, not this unit's.
- 'Decision 181 -- nothing here relaxes an assertion, lowers a budget or weakens a check. This unit only ADDS enforcement, which is the easy direction, so the burden is that the addition is real: step 2 proves the new test fails against the unmodified pyproject (it cannot pass vacuously), step 4 proves every family fires rather than merely appearing in a list, and step 12 proves no budget entry or raise-approved marker enters the diff. Clause 2''s declare-your-coverage obligation is discharged by this plan''s Decision 181 coverage-declaration context line, which names the enforcing surface for the no-shrink property and the two residuals it does not reach.'
- 'Scope-boundary LOCATION invariant (Decision 59, docs/contracts/implement-scope-boundary.yaml): only pyproject.toml and tests/checks/hygiene/test_pyproject_ruff_select.py may be touched, plus this plan''s own path under the implementing_plan_bookkeeping sanction row. An undeclared touched path is never resolved by appending it to this plan''s scope list -- STOP and seek a human-directed amendment (step 10).'
- No file under src/ and no deploy-trigger file may appear in the diff. The deploy-trigger set is the union of the push path filters in .github/workflows/deploy-prod-lambdas.yml and .github/workflows/deploy-ducklake-lambdas.yml, derived by parsing those files at verification time rather than from a list (step 10). The src/ test alone is not sufficient - eight of the twelve patterns are outside src/.
- The ruff version pin is untouched. Both requirements-dev.txt and requirements-fast.txt stay at 0.15.20 and neither, nor requirements.txt, nor requirements.lock, may appear in the diff (step 8).
- Red fixtures are synthetic violations written to a temporary directory and linted via subprocess; not one is committed. This binds both the VP step (step 4 uses mktemp with a cleanup trap) and the test module (tmp_path).
- A clause may appear in permanent source -- a comment, a docstring, a committed plan field -- only if a named verification step would FAIL were that clause false. The test docstring's four load-bearing clauses map to steps 5 (ratchet direction, both arms), 4 (every adopted family fires), 5 again (a preview-only family reddens the stable-rule assertion) and 4 (FA is target-version-gated and silent at py312).
- Cite symbols and family codes, never line numbers. This plan names scripts.checks._scaffolding.run_lint_checks, scripts.checks._common.get_status_aware_diff, tests/checks/typing/test_pyproject_mypy_flags.py and rule codes; it fixes no line number, since the select line's position moves with any edit above it.
- 'Every backtick literal in a HERMETIC step''s expected text must be a substring that step''s own command actually PRINTS -- the rule is a per-literal obligation, not the blanket ''no hermetic step''s expected contains a backtick literal'' the earlier draft asserted, which was FALSE of the document carrying it. validate_vp_replay extracts every backtick-delimited substring of a hermetic pre-deploy step''s expected via _BACKTICK_LITERAL_RE and requires each in the replayed stdout+stderr, so a backticked phrase that is prose ABOUT the step rather than output FROM it reddens validate_vp_replay -- registered pre=True with no full_segment, hence the FAST TIER, the authoritative pre-merge gate -- on this unit''s own implement PR, the moment implementation_declared flips true and resolve_declared_plans edge-triggers. RE-VERIFIED MECHANICALLY on 2026-09-04 rather than restated: _replay_step was called over all seven hermetic pre-deploy steps (3, 4, 8, 10, 11, 12, 13) against an implementation-bearing clone and all seven replayed clean. Six of the seven carry no backtick literal at all and are self-asserting -- they exit non-zero when their property fails, so the exit code carries the assertion. The seventh, step 13, carries exactly one literal, `non-test budget: 240s`, which the selection_budget reporter prints verbatim on its second line; it STAYS backticked because it is a real replayed assertion and removing it would delete one. Any later edit that adds a backtick literal to a hermetic step''s expected must re-run that replay before the plan is committed -- this constraint is discharged by re-execution, never by re-assertion.'
- 'This unit closes no open recommendation: bundled_recommendations is empty and the feat PR carries NO Resolves trailer. The PR body must say so explicitly, must name the wave-A families and the wave-B split, and must state that the deploy-trigger set was enumerated from the two workflows and subtracted.'
- 'No rescue agents or workaround loops (Decision 55), and the drop-rule is PRE-ADOPTION ONLY. Before this unit merges, a candidate family that no longer measures zero is dropped from the branch''s select list and the measurement recorded (steps 1 and 3) -- nothing is being weakened, because no family has been adopted yet. AFTER merge the rule inverts: a family that starts firing routes to a source=ci_rca forward-fix rec filed through scripts.ops_data_portal, and removing its select entry to obtain green is a CONTENT weakening of a live assertion, forbidden by Decision 181 clause 1 and mechanically reddened by the new test''s membership ratchet. Findings are never fixed inline in files this plan does not declare, in either direction.'
- The FA target-version marker comment is part of the deliverable, not decoration (Decision 170). pyproject.toml must carry, directly above select, one comment line stating that FA is target-version-gated and enforces nothing at py312. Step 7 asserts it enters the diff; step 4 is its falsifier (the INERT-AT-PY312 and FIRES-BELOW-TARGET arms), so it satisfies this plan's own rule that a clause may live in permanent source only if a named step would fail were it false. It is never removed to shrink the diff.
- 'Verification step 15 (`bin/venv-python -m scripts.validate`, the full tier) is the checked structural discharge of this plan''s handoff_policy.full_validation_required_before_commit (Decision 163 point 2): validate_handoff_full_tier fails any diff-added/modified plan declaring that Literal[True] field unless a step invokes `-m scripts.validate` in module-entry-point form WITHOUT `--pre`. Step 15''s command is that step and must survive into the committed YAML verbatim -- it is not merged into step 14, not given a --pre flag, and not dropped for time.'
- 'The stable-rule assertion matches family to rule by PREFIX-PLUS-DIGITS, never by a naive code.startswith(family). A ruff selector is a code prefix, so the predicate is: some stable (non-preview) rule from `ruff rule --all --output-format=json` has a code that starts with the family AND whose remainder after that prefix is all digits. This is boundary-aware in both directions, which a bare startswith is not (measured 2026-09-04: under startswith the family ''A'' absorbs 43 stable codes including AIR*, ARG* and ASYNC*, against 6 under prefix-plus-digits, and ''F'' absorbs FA100/FA102/FAST*), and unlike an anchored ^([A-Z]+)[0-9]+$ family match it still resolves the NUMERIC-prefix selector C4 to the nineteen flake8-comprehensions codes -- which the anchored form does not, and which step 5''s ADD-C4 arm requires. All four mutation arms were re-run against a faithful reconstruction on 2026-09-04 under this rule: DROP-SLOT RED (2 failed / 11 passed), ADD-C4 GREEN (13 passed), ADD-DOC RED (1 failed / 12 passed on the stable-rule assertion), RESTORE GREEN (13 passed), plus an extra ADD-ARG arm GREEN that the naive form would have failed to distinguish.'
