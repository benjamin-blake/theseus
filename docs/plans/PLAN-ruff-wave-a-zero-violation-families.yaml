schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ruff-wave-a-zero-violation-families
intent: Convert ten ruff rule families the repository already satisfies from unmeasured latent compliance into enforced compliance, by extending the [tool.ruff.lint] select list from four families to fourteen and landing one test that ratchets the membership (a family may be added freely, never silently dropped) and proves every selected family is actually live rather than merely spelled correctly in a list.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ruff-wave-a-zero-violation-families.yaml
phase: Lint-surface adoption, wave A (config-only families measured at zero violations). No tier_item slice and no exit criterion closes here; soft-warn exception category ad_hoc_rec (autonomous-day operator brief, Task 7 wave A). No rec is named by the brief, so bundled_recommendations is empty by the brief's own rule and the feat PR carries no Resolves trailer. Wave B (ICN, INP, C4, ERA, RET, PIE -- 75 findings across 61 files) is a SEPARATE later unit that extends the same select line and must be planned against the post-wave-A tree; nothing here touches it.
scope:
- file: pyproject.toml
  action: Modify
  purpose: 'Replace the single [tool.ruff.lint] select line, add one comment line directly above it, and change nothing else in the file. Verified against the live tree at 5ff55c9: [tool.ruff] carries line-length 127, target-version py312 and a four-entry exclude list, and [tool.ruff.lint] contains select = ["E", "F", "W", "I"] as its ONLY key -- there is no ignore key, no per-file-ignores table and no [tool.ruff.lint.*] subtable of any kind, so the edit is confined to that one key: one removed line and TWO added lines -- the new select line plus one comment line directly above it recording that FA is target-version-gated and enforces nothing at py312 (Decision 170: the config, not the PR body, is where an inert entry''s inertness is declared, so a future reader loading pyproject.toml can tell FA''s green apart from the nine families that genuinely fire). Verified in a scratch clone of 5ff55c9: with the comment present ruff still resolves all fourteen families and `ruff check .` exits 0, and the mutation seam step 5 depends on (a `^select = \[.*\]$` substitution) is untouched because the comment line does not match it. New select value, sorted, fourteen entries: ["A", "ASYNC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"]. The comment line is written VERBATIM as: # FA: target-version-gated, enforces nothing at py312 (FA100/FA102 both respect target-version); kept for the ratchet, proved inert by tests/checks/hygiene/test_pyproject_ruff_select.py -- its `# FA:` opening is load-bearing, because step 7 counts diff lines matching ''^+# FA:'' and a marker phrased differently, or placed anywhere but directly above select inside [tool.ruff.lint], fails that step. line-length, target-version, exclude, [tool.pytest.ini_options], [tool.coverage.*] and [tool.mypy] are untouched. No per-file-ignores table is added: at zero violations there is nothing to carve out, and the one carve-out the brief foresees (scripts/llm/utils.py''s single RET505, a deploy-trigger file) belongs to wave B''s RET family, not to any family here.'
- file: tests/checks/hygiene/test_pyproject_ruff_select.py
  action: Create
  purpose: 'The pinning test. Placed in tests/checks/hygiene/ after looking for an existing config-pinning test: the repository has exactly one, tests/checks/typing/test_pyproject_mypy_flags.py, which pins [tool.mypy] inside the tests package mirroring scripts/checks/typing/ (mypy''s check domain). Ruff has no check module of its own -- its gate is scripts.checks._scaffolding.run_lint_checks -- so the nearest domain package is hygiene, which owns the repository''s hand-written lint guards (validate_subprocess_encoding, validate_sys_executable, validate_test_count_coupling); the filename follows the mypy pin''s own test_pyproject_<tool>_<subject>.py convention. Three concerns, ~82 SLOC: (1) a RATCHET membership assertion over the fourteen families, (2) a growth-safe assertion that every family named in select owns at least one stable, non-preview rule -- matched PREFIX-PLUS-DIGITS (a stable code from `ruff rule --all --output-format=json` starts with the family and its remainder is all digits), never by a naive code.startswith, which lets ''A'' absorb AIR/ARG/ASYNC codes, and never by an anchored ^([A-Z]+)[0-9]+$ family match, which would break the numeric-prefix selector C4 that step 5''s ADD-C4 arm depends on, and (3) a parametrized synthetic violation per adopted family, written to tmp_path and linted through this repository''s own pyproject config via subprocess, with FA carried in a separate target-version-gated parameter set. No fixture is checked in.'
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- '[tool.ruff.lint] select is exactly the fourteen-element sorted list ["A", "ASYNC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"], and bin/venv-python -m ruff check . exits 0 with that list in force (proved in a scratch clone of 5ff55c9 at planning time: All checks passed, exit 0, and ruff format --check reported 1035 files already formatted -- a PRE-test-file figure; re-measured 2026-09-04 on a clone that also carries the new module, the same two commands give All checks passed and 1036 files already formatted. Neither number is asserted by any verification step, so neither can produce a false red). The exact-list assertion is deliberately unit-scoped -- it lives in verification step 3, which runs once for this PR. The STANDING guard is the ratchet in the new test, which asserts membership so wave B can extend the same line without editing it; the two are not in tension, they are different scopes.'
- 'Each of the ten adopted families is demonstrably LIVE and not merely listed. Nine of them (A, ASYNC, INT, ISC, LOG, Q, SLOT, TID, YTT) emit their own rule code against a synthetic violation linted through the repository''s own pyproject config. FA is the tenth and is the exception that makes the test worth having - both flake8-future-annotations rules respect target-version, so neither can fire at py312; FA''s proof is that FA100 fires against the same fixture when target-version alone is lowered to py38 and is silent at py312. Because that distinction is otherwise invisible in the artifact a future reader loads, pyproject.toml itself carries, directly above select inside [tool.ruff.lint], the verbatim comment line `# FA: target-version-gated, enforces nothing at py312 (FA100/FA102 both respect target-version); kept for the ratchet, proved inert by tests/checks/hygiene/test_pyproject_ruff_select.py` recording it (Decision 170) -- FA''s green must never be byte-identical to the nine that fire.'
- The new test FAILS against the unmodified pyproject.toml (rehearsed at planning time - 11 failed, 2 passed with the four-family select restored), so it cannot pass vacuously, and it REDDENS when any single adopted family is removed from select (rehearsed - removing SLOT gives 2 failed, 11 passed).
- The pin is a ratchet, not a change detector - adding an unrelated family to select leaves the test green (rehearsed with C4 added - 13 passed), while adding a preview-only family reddens it (rehearsed with DOC added - 1 failed, 12 passed on the stable-rule assertion).
- pyproject.toml's diff against the base is exactly one removed line and two added lines -- the select line and, directly above it, one comment line naming FA's target-version dependence -- and nothing else in the file moves; no dependency pin moves (ruff stays 0.15.20 in requirements-dev.txt and requirements-fast.txt, neither of which appears in the diff).
- No file under src/ and no deploy-trigger file appears in the diff, where the deploy-trigger set is derived at verification time by parsing the twelve push path filters out of .github/workflows/deploy-prod-lambdas.yml and .github/workflows/deploy-ducklake-lambdas.yml rather than from any list written here.
- The new test file is ruff-clean, ruff-format-clean, under the 500-SLOC limit and unregistered in config/sloc_budgets.yaml; no raise-approved marker, budget increase, baseline lowering or waiver is added anywhere.
- 'The adoption is measured in the FAST TIER''S NON-TEST HALF, not its test half (Decision 182): `ruff check` is a static step, so ten added rule families spend the unwaivable NON_TEST_BUDGET_SECONDS = 240 budget that branch (1) of scripts.checks.deps.selection_budget''s pinned classify order evaluates before bypass and before the forced waiver. Measured cold-cache in a scratch clone of 5ff55c9: `ruff check .` runs 0.128-0.134s with the four-family select and 0.137-0.145s with the fourteen-family select -- a sub-20ms delta against a 240s budget whose measured occupancy is 51-72s (Decision 182 point 6 residual (i), 3.34x headroom). The +1 test module is the trivial breadth half and is what step 13 reports.'
- 'The whole-tree zero-violation claim is never proved by `--pre` (Decision 73 point 1: the fast tier runs ruff on CHANGED FILES ONLY). It is re-taken at whole-tree scope exactly twice -- by verification step 3 pre-handoff, and by the full tier post-merge on main -- and the plan claims it nowhere else.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'BEFORE state -- record that the base carries the four-family select and that each of the ten candidate families measures zero on the unmodified tree, so the adoption is provably free and the re-measure-and-drop instruction discharges with the full list intact. DELIBERATELY NOT HERMETIC (Decision 148, clause 3''s restored hermetic-true default consciously declined here): validate_vp_replay replays only steps that are pre-deploy AND hermetic:true, against the complete, implementation-bearing tree -- and this step''s first grep asserts that the BASE still carries the four-family select, a claim that inverts by construction the moment this unit''s edit exists. hermetic: false is therefore an authoring decision recorded here in the step body, not the schema default falling through unnoticed.'
  command: git show origin/main:pyproject.toml | grep -E '^select = \["E", "F", "W", "I"\]$' && for F in A ASYNC FA INT ISC LOG Q SLOT TID YTT; do N=$(bin/venv-python -m ruff check --select "$F" --output-format=concise . 2>&1 | grep -c ':[0-9][0-9]*:[0-9][0-9]*:' || true); printf '%s=%s\n' "$F" "$N"; [ "$N" = "0" ] || exit 1; done
  expected: 'The base select line prints as the four-element list, then ten lines A=0 ASYNC=0 FA=0 INT=0 ISC=0 LOG=0 Q=0 SLOT=0 TID=0 YTT=0, exit 0. Re-measured by the planning session on 2026-09-04 against 5ff55c9 with ruff 0.15.20: all ten were still zero, so none of the brief''s ten candidates was dropped.'
  fix_if: Any family printing a non-zero count means the tree regressed since the measurement -- do NOT fix the findings inline and do NOT weaken the family; drop that family from this unit's select list, record the measurement, and let it be re-proposed once the findings are addressed. This runs BEFORE any edit, so the drop is pre-adoption selection, not the removal of a live assertion -- the post-merge rule is step 3's fix_if (forward-fix rec, never a select removal). A grep failure on the base select line means the base is not what this plan was written against -- STOP and re-derive the scope row.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Deliberately asserts the PRE-change state of the base -- once this unit merges, origin/main carries the fourteen-family select and the first grep inverts by construction. validate_vp_replay re-executes hermetic pre-deploy steps against the implementation-bearing tree and again post-merge, so marking it hermetic would guarantee a false red. Graduating it would land a standing guard that must go red the moment the change it verifies exists.
- step: 2
  phase: pre-deploy
  action: 'RED proof -- the new test must FAIL against the unmodified pyproject.toml, so it cannot pass vacuously against a tree where the adoption never happened. Scratch clone only; the working tree is never mutated. DELIBERATELY NOT HERMETIC for the same reason as step 1 (Decision 148): it asserts a FAILURE against a reverted config, so it holds only while pyproject.toml still carries the four-family select and inverts on the implementation-bearing tree validate_vp_replay replays against. Note that hermetic and graduation are different fields on VerificationStep: this step''s `waive` disposition grants it no replay exemption, only the hermetic:false marker does.'
  command: R="$PWD"; S=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task7; C="$S/clone-red"; rm -rf "$C"; git clone --shared --quiet "$R" "$C" && ln -s "$R/.venv" "$C/.venv" && git -C "$C" checkout origin/main -- pyproject.toml && (cd "$C" && OUT=$(PYTHONPATH="$C" ./.venv/bin/python -m pytest tests/checks/hygiene/test_pyproject_ruff_select.py -q -p no:cacheprovider --randomly-seed=12345 2>&1); RC=$?; printf '%s\n' "$OUT"; printf 'rc=%s\n' "$RC"; { [ "$RC" -ne 0 ] && printf '%s\n' "$OUT" | grep -Eq '[0-9]+ failed' && printf '%s\n' "$OUT" | grep -q 'FAILED .*TestRuffSelectRatchet::test_adopted_and_preexisting_families_are_all_present' && printf '%s\n' "$OUT" | grep -q 'FAILED .*TestSelectedFamiliesAreLive::test_adopted_family_fires_on_a_synthetic_violation'; } && echo "RED-AS-EXPECTED" || { echo "NOT-A-RED"; exit 1; })
  expected: 'The full pytest output, an rc= line, then RED-AS-EXPECTED, exit zero. The step no longer accepts ANY non-zero exit as proof of red -- the earlier test $? -ne 0 predicate did, and pytest exits 4 with ''ERROR: file or directory not found'' when the module is absent, so that form printed RED-AS-EXPECTED on a tree where the test file was never created. It now requires FOUR conjuncts: a non-zero return code, a ''N failed'' summary line, a FAILED line naming TestRuffSelectRatchet::test_adopted_and_preexisting_families_are_all_present, and a FAILED line naming TestSelectedFamiliesAreLive::test_adopted_family_fires_on_a_synthetic_violation -- the two nodes this plan''s test_obligations rows name -- so the red is proved to be ON THE PROPERTY UNDER TEST. Rehearsed at planning time (2026-09-04, scratch clone of 5ff55c9): 11 failed, 2 passed -- the membership assertion and nine of the ten firing assertions fail, while the duplicate-family check and the stable-rule check legitimately still pass because both hold for the four-family list too. The tightened predicate itself was exercised on 2026-09-04 against all three shapes it must separate: the real red (rc=1, 11 failed / 2 passed, both named nodes present as FAILED lines -> RED-AS-EXPECTED, exit 0); a source tree where the module was never committed so the --shared clone does not carry it (rc=4, no failed summary -> NOT-A-RED, exit 1, where the old form printed a FALSE RED-AS-EXPECTED); and an import fault (rc=2, ''1 error in ...'' -> NOT-A-RED, exit 1).'
  fix_if: 'NOT-A-RED has three distinguishable causes and none may be accepted by relaxing the predicate. (a) rc=0 means the test asserts nothing that depends on the ten new families -- it is a vacuous pin and must be STRENGTHENED before proceeding. (b) rc non-zero with no ''N failed'' summary and an ''ERROR: file or directory not found'' line means the module does not exist in the clone: it was created in the working tree but never committed, so git clone --shared did not carry it; commit it and re-run. (c) rc non-zero with ''1 error in ...'' means a collection error -- an import or syntax fault in the test module; fix that first, since a collection error is not evidence of a working red. A rc non-zero run that fails but names NEITHER obligation node means the red is landing somewhere other than the property under test; find out where before continuing. Never widen the grep or drop a conjunct to obtain RED-AS-EXPECTED.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts a FAILURE against a reverted config in a scratch clone -- it holds only while pyproject.toml still carries the four-family select, so it inverts on the implementation-bearing tree that validate_vp_replay replays against. It is also multi-command, clone-scoped and pytest-driven, outside every canonical primitive slot.
- step: 3
  phase: pre-deploy
  action: 'AFTER state -- run the real ruff gate across the whole repository with the expanded select list in force and require a clean exit, then confirm the resolved select list is the fourteen-element sorted list. The second command is an EXACT-equality assertion over the fourteen-element list and this step is hermetic, so validate_vp_replay re-executes it -- and it still does not grow-couple against wave B: resolve_declared_plans is EDGE-TRIGGERED on an implementation_declared False->True flip between the diff base and the working tree, so once wave A merges this plan stops being resolved, step 3 goes dormant, and wave B extending select to twenty families cannot retro-redden it. The standing growth-safe guard is the new test''s membership ratchet, never this step.'
  command: bin/venv-python -m ruff check . && bin/venv-python -c "import tomllib,sys; s=tomllib.load(open('pyproject.toml','rb'))['tool']['ruff']['lint']['select']; print('resolved select:', s); sys.exit(0 if s == sorted(['A','ASYNC','E','F','FA','I','INT','ISC','LOG','Q','SLOT','TID','W','YTT']) else 1)"
  expected: Ruff reports that all checks passed across the repository, then the resolved select list prints with fourteen entries in sorted order, and the step exits zero. Proved in a scratch clone at planning time with ruff 0.15.20.
  fix_if: 'A non-zero ruff exit BEFORE this unit merges means a family that measured clean at planning time now has findings: re-measure that family alone and drop it from THIS BRANCH''S select list. That is pre-adoption selection -- no family has been adopted yet, so nothing is being weakened. It is NOT a licence to remove a family after merge: once the fourteen-family select is on main, a family that starts firing routes to a source=ci_rca forward-fix rec filed through scripts.ops_data_portal, never to a select removal, which would weaken a live assertion to obtain green (Decision 181 clause 1) and which the new test''s membership ratchet reddens mechanically anyway. Never fix findings inline in files this plan does not declare. A non-zero exit from the second command means the select list is not the fourteen-element sorted list; correct pyproject.toml, never the assertion.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The repository-wide ruff invocation is already a standing gate -- scripts.checks._scaffolding.run_lint_checks runs ruff check and ruff format --check in the presubmit -- so graduating a command_exit_zero slot for it would register a second registry row asserting exactly what that gate already asserts on every run. The select-shape half is the new test's own job and is covered by the test_obligations rows.
- step: 4
  phase: pre-deploy
  action: 'Prove each adopted family is genuinely SELECTED and not merely listed. Method chosen: a synthetic violation per family, written to a temporary directory and linted through this repository''s own pyproject config, never checked in. Rejected alternative: introspecting ruff''s resolved configuration -- ruff already refuses an unknown selector loudly (measured at planning time: an invented selector aborts with an unknown-rule-selector error), so config resolution only proves the string parses, and it cannot distinguish a family that fires from one that is inert. FA is the family that settles the choice: it parses, it resolves, it is stable rather than preview, and it still cannot emit anything at py312 -- only a firing test surfaces that.'
  command: 'set -e; D=$(mktemp -d); trap ''rm -rf "$D"'' EXIT; printf ''id = 1\n'' > "$D/a.py"; printf ''import time\n\n\nasync def f() -> None:\n    time.sleep(1)\n'' > "$D/async.py"; printf ''def _(s: str) -> str:\n    return s\n\n\ny = _(f"{1}")\n'' > "$D/int.py"; printf ''x = "a" "b"\n'' > "$D/isc.py"; printf ''import logging\n\nx = logging.WARN\n'' > "$D/log.py"; printf "x = ''a''\n" > "$D/q.py"; printf ''class C(str):\n    pass\n'' > "$D/slot.py"; printf ''from ..pkg import thing\n'' > "$D/tid.py"; printf ''import sys\n\nx = sys.version_info[0] == 3\n'' > "$D/ytt.py"; printf ''from typing import List\n\nx: List[int] = []\n'' > "$D/fa.py"; for spec in A:A001:a ASYNC:ASYNC251:async INT:INT001:int ISC:ISC001:isc LOG:LOG009:log Q:Q000:q SLOT:SLOT000:slot TID:TID252:tid YTT:YTT201:ytt; do fam=${spec%%:*}; rest=${spec#*:}; code=${rest%%:*}; stem=${rest##*:}; bin/venv-python -m ruff check --config pyproject.toml --output-format=concise "$D/$stem.py" 2>&1 | grep -q " $code " && echo "FIRES $fam $code" || { echo "SILENT $fam $code"; exit 1; }; done; bin/venv-python -m ruff check --config pyproject.toml --target-version py38 --output-format=concise "$D/fa.py" 2>&1 | grep -q " FA100 " && echo "FIRES-BELOW-TARGET FA FA100" || { echo "SILENT-BELOW-TARGET FA FA100"; exit 1; }; bin/venv-python -m ruff check --config pyproject.toml --output-format=concise "$D/fa.py" 2>&1 | grep -q " FA100 " && { echo "UNEXPECTED FA fires at py312"; exit 1; } || echo "INERT-AT-PY312 FA FA100"'
  expected: Eleven lines, exit zero. Nine read FIRES followed by the family and its rule code, for A with A001, ASYNC with ASYNC251, INT with INT001, ISC with ISC001, LOG with LOG009, Q with Q000, SLOT with SLOT000, TID with TID252 and YTT with YTT201. The tenth reads FIRES-BELOW-TARGET for FA with FA100 and the eleventh reads INERT-AT-PY312 for FA with FA100. Reproduced exactly by the planning session on 2026-09-04. A SILENT line on any family means that family is listed but dead, and the step exits non-zero.
  fix_if: A SILENT line means the family name in select is not driving the rule the fixture violates -- check the spelling against the family codes ruff itself reports, and check that the rule was not renamed between ruff releases; never delete the fixture to make the step pass. An UNEXPECTED line for FA at py312 means target-version changed, which is out of this unit's declared scope -- STOP rather than editing target-version.
  hermetic: true
  graduation: not-applicable
  graduation_waiver_reason: ''
- step: 5
  phase: pre-deploy
  action: Ratchet mutation matrix -- prove the pin is a one-way ratchet rather than a change detector. Four arms in a scratch clone, each mutating only the select line. Removing an adopted family must redden; adding an unrelated family must stay green; adding a preview-only family must redden; restoring the target list must go green again.
  command: R="$PWD"; S=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task7; C="$S/clone-mut"; rm -rf "$C"; git clone --shared --quiet "$R" "$C" && ln -s "$R/.venv" "$C/.venv" && for arm in 'DROP-SLOT:["A", "ASYNC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "TID", "W", "YTT"]:RED' 'ADD-C4:["A", "ASYNC", "C4", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"]:GREEN' 'ADD-DOC:["A", "ASYNC", "DOC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"]:RED' 'RESTORE:["A", "ASYNC", "E", "F", "FA", "I", "INT", "ISC", "LOG", "Q", "SLOT", "TID", "W", "YTT"]:GREEN'; do name=${arm%%:*}; rest=${arm#*:}; want=${rest##*:}; sel=${rest%:*}; (cd "$C" && PYTHONPATH="$C" ./.venv/bin/python -c "import pathlib,re,sys; p=pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'^select = \[.*\]$', 'select = '+sys.argv[1], p.read_text(), count=1, flags=re.M))" "$sel" && (PYTHONPATH="$C" ./.venv/bin/python -m pytest tests/checks/hygiene/test_pyproject_ruff_select.py -q -p no:cacheprovider --randomly-seed=12345 >/dev/null 2>&1 && got=GREEN || got=RED; [ "$got" = "$want" ] && echo "OK $name want=$want got=$got" || { echo "MISMATCH $name want=$want got=$got"; exit 1; })); done
  expected: 'Four lines, exit zero: OK DROP-SLOT want=RED got=RED, OK ADD-C4 want=GREEN got=GREEN, OK ADD-DOC want=RED got=RED, OK RESTORE want=GREEN got=GREEN. Rehearsed at planning time (2026-09-04): dropping SLOT gave 2 failed and 11 passed, adding C4 gave 13 passed, adding DOC gave 1 failed and 12 passed on the stable-rule assertion, and the restored list gave 13 passed.'
  fix_if: A MISMATCH on DROP-SLOT means the membership assertion is not actually reading select. A MISMATCH on ADD-C4 means the pin is an exact-equality change detector after all and must be rewritten as a superset assertion -- do not relax the DROP-SLOT arm to compensate. A MISMATCH on ADD-DOC means the stable-rule assertion is not discriminating preview-only families and the DOC-exclusion claim in the plan and the test docstring is unfalsifiable, so either strengthen it or delete the claim.
  hermetic: false
  graduation: not-applicable
  graduation_waiver_reason: ''
- step: 6
  phase: pre-deploy
  action: GREEN proof -- run the new pinning module on HEAD and require every one of its thirteen tests to pass, so the standing guard the test_obligations rows name is executed as written rather than only reasoned about.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_pyproject_ruff_select.py -q -p no:cacheprovider --randomly-seed=12345
  expected: Thirteen tests pass and pytest exits zero -- the membership assertion, the duplicate-family assertion, the stable-rule assertion, nine synthetic-violation parameters and the target-version-gated FA parameter. Rehearsed at planning time on 2026-09-04 in a scratch clone carrying the fourteen-family select.
  fix_if: A failing synthetic-violation parameter means that family is listed but not firing -- see step 4's fix_if; the fixture is never deleted to obtain green. A failing membership assertion means pyproject.toml was not edited as the scope row describes. A collection error means the module has an import fault, which is not a red on the property under test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A single test_selector-shaped command, so `not-applicable` would be the classification-gaming shape plan-critique criterion 12o catches. It is waived, not graduated, because the durable guard this step exercises IS the module itself: tests/checks/hygiene/test_pyproject_ruff_select.py is collected by the full tier''s pytest run on every invocation, unconditionally and forever. A test_selector registry row naming that same module would register a second name for a guard the suite already runs, and would make one domain declare itself examined twice (Decision 170).'
- step: 7
  phase: pre-deploy
  action: Prove pyproject.toml changed on the select line and its FA marker comment and nowhere else -- exactly one removed line and two added lines, one of which is the select assignment and the other the FA target-version marker -- so line-length, target-version, exclude and every other tool table are demonstrably untouched, and so the Decision 170 marker is proved to ENTER the config rather than living only in the PR body.
  command: D=$(git diff --unified=0 origin/main...HEAD -- pyproject.toml | grep -E '^[-+][^-+]'); printf '%s\n' "$D"; T=$(printf '%s\n' "$D" | grep -c .); S=$(printf '%s\n' "$D" | grep -cE '^[-+]select = '); M=$(printf '%s\n' "$D" | grep -cE '^\+# FA:'); echo "changed-lines=$T select-lines=$S fa-marker-lines=$M"; [ "$T" = "3" ] && [ "$S" = "2" ] && [ "$M" = "1" ]
  expected: The removed line shows the four-element select list; the two added lines are the FA target-version marker comment and the fourteen-element sorted select list. The summary reports changed-lines=3 select-lines=2 fa-marker-lines=1 and the step exits zero. The shell logic was exercised against exactly this diff shape in a scratch clone of 5ff55c9 on 2026-09-04.
  fix_if: changed-lines greater than 3 means something other than the select line and its marker changed in pyproject.toml -- revert the extra hunk rather than widening this assertion. fa-marker-lines=0 means the Decision 170 marker was not written; add it, do not relax the count. Zero changed lines means the edit was never made or the diff base is wrong; confirm the branch is not the base itself before touching the step.
  hermetic: false
  graduation: waive
