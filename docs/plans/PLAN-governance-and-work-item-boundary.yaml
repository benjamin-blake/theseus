schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: governance-and-work-item-boundary
intent: >-
  Ratify Decisions 196 (three-tier decision model, amending Decision 134 clause 5) and 197
  (work-item mechanism boundary) into the live corpus, make the roadmap bookkeeping the two
  entries require, and file two recommendations. Decision-corpus and roadmap bookkeeping only --
  no runtime, schema or data change.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-governance-and-work-item-boundary.yaml
phase: T4.3
fallback_reevaluation:
  reevaluated_on: "2026-09-20"
  substrate_status: >-
    CD.27 pending; its pinned five candidates unchanged and economically indistinguishable at
    concurrency=1 (roadmap executor_substrate_billing.non_discrimination_conclusion). Decision 185
    already splits the loop DEFINITION from its host, so no substrate arm is exercised here.
  verdict: continue_on_current_substrate
  basis: >-
    This plan changes exit-criteria TEXT and the decision corpus only; it writes no code, no schema
    and no infrastructure, so it forms no new evidence about the CD.27 substrate. The kind-generic
    criterion added to T4.3 is a row-shape commitment (Decision 197 clause 6) that binds
    identically under any of CD.27's pinned candidates.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert Decisions 196 and 197 above the current first heading, position-anchored per Decision
      177. Append a dated forward-pointer annotation inside Decision 134's block (mechanically
      required -- 196's amends edge makes validate_supersession_annotations sub-check (a) fail
      without it). Dated-annotate the three reversal stanzas armed on the T1.5 portal cutover that
      Decision 196 clause 1 forecloses, in Decisions 167, 177 and 179 (Decision 177 clause 4 makes
      a stanza interior the one mutable surface).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Reword T4.3 c2 to a produced work item of kind rec and add a criterion binding the producer
      and pick surface to Decision 197 clause 6's grain. Repoint T1.5 c1 off the retirement
      end-state Decision 196 reverses, converting all 8 of its bare-string criteria to
      ExitCriterion objects (validate_platform_roadmap check (ii) fires on any diff-touched item).
      Add carrier criteria to T4.24 (per-file decision split including header-source relocation,
      Tier B extraction, id prefixing, the failure_signal field) and T4.23 (work-item storage port
      and the three-table target model).
  - file: docs/plans/PLAN-governance-and-work-item-boundary.yaml
    action: Create
    purpose: This plan document.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - "AC1: docs/DECISIONS.md carries entries 196 and 197, each with an envelope whose number matches its heading, significance.value numbered_decision, and a justification naming the specific docs/contracts/*.yaml home considered and rejected."
  - "AC2: Each new entry carries the Status, Date and Decision markers, a fenced yaml reversal-conditions stanza, and a Warehouse ID line equal to dec-196 and dec-197 respectively."
  - "AC3: Each new entry measures under the Decision 167 per-entry cap of 6,144 bytes, heading to next heading. Measured drafts came in at 5,522 and 5,733 bytes."
  - "AC4: Decision 196 declares amends: [134] and states the reversal explicitly -- the corpus was withheld as private IP, and a user cannot run the governed loop locally without it, so the moat was the product."
  - "AC5: Decision 134's block carries a dated forward-pointer annotation naming Decision 196, added by line insertion only."
  - "AC6: The three reversal stanzas armed on the T1.5 portal cutover (Decisions 167, 177, 179) are dated-annotated or re-armed, so none is left watching a trigger Decision 196 clause 1 forecloses."
  - "AC7: The docs/DECISIONS.md diff against the merge-base deletes zero lines and both new entries sit above the previous first heading (Decision 177 append-only, position-anchored)."
  - "AC8: docs/decisions-index.json regenerates and matches the live corpus."
  - "AC9: T4.3 criterion c2 names a produced work item of kind rec, and a further criterion binds the producer and pick surface to the kind-generic grain of Decision 197 clause 6."
  - "AC10: T1.5 c1 no longer asserts retirement of docs/DECISIONS.md, and all 8 of T1.5's exit criteria are structured ExitCriterion objects."
  - "AC11: T4.23 and T4.24 carry exit criteria for the forward work Decisions 196 clause 8 and 197 clauses 2, 3 and 7 name, and no live item gains a depends_on edge onto a deferred_post_mvp item."
  - "AC12: docs/ROADMAP-PLATFORM.yaml stays under the 10,000-line ceiling and validate_platform_roadmap reports no failure."
  - "AC13: An open recommendation exists for the north-star amendment guard, authorization-shaped per Decision 165 and binding scripts/checks/_marker_guard.py, and its id appears in Decision 196's Related line."
  - "AC14: After the rest of the Verification Plan is green, a second open recommendation exists for the roadmap-headroom escalation Decision 147's reversal condition now obliges, and its id is named in the handoff report."
  - "AC15: The branch modifies nothing outside docs/ except the auto-sanctioned verification-registry shards owed by the graduated steps."
  - "AC16: bin/venv-python -m scripts.validate exits 0."
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A generator invocation, not an assertion -- it has no discriminating power of its own and
      step 2 is the check that proves its output correct. Graduating a --write command would
      install a registry row that mutates a tracked file on every run.
    action: Regenerate the committed decisions index after the DECISIONS.md edits.
    command: bin/venv-python -m scripts.decisions_index --write
    expected: Exit 0; the index is rewritten to include the two new entries.
    expected_literals: []
    fix_if: A non-zero exit means the new entries do not parse under the shared decisions_md grammar; re-read the heading and marker spellings against docs/contracts/decision-entry.yaml.
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already a standing gate -- scripts.validate runs index freshness in both tiers, so a registry
      row here would duplicate an existing enforcer.
    action: Prove the regenerated index matches the live corpus.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0, meaning the committed index is byte-identical to a fresh generation.
    expected_literals: []
    fix_if: A mismatch means step 1 was not rerun after the last DECISIONS.md edit; rerun step 1 and commit the index.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decision_entry_conformance is already a registered --pre check; a second row
      invoking the same function would be a duplicate enforcer.
    action: Run the decision-entry authoring-grammar conformance gate over the two new entries.
    command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: Exit 0 and an empty failure list, meaning both new entries carry the required markers and a well-formed significance envelope.
    expected_literals: []
    fix_if: A named failure identifies the missing marker or malformed envelope field; correct that entry and rerun.
  - step: 4
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decisions_size is already registered ungated in the --pre tier and owns the
      per-entry cap; a registry row here would re-run the same enforcer under a second name.
    action: Run the per-entry size gate, which hard-fails a new entry over the Decision 167 cap and warns on the amendment delta the Decision 134 annotation creates.
    command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: Exit 0 and an empty failure list. A WARN line for Decision 134's changed span is expected and is telemetry, never a failure.
    expected_literals: []
    fix_if: An over-cap failure names the entry; trim its Related line first per Decision 167 clause 3, then its Problem section, never its Decision clauses, and never by raising the cap.
  - step: 5
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_supersession_annotations is a registered full-tier check; running it early catches a
      missing forward pointer before handoff rather than installing a new guard.
    action: Run the supersession-annotation and Warehouse-ID gate, which fails unless Decision 134's block names Decision 196.
    command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_supersession_annotations import validate_supersession_annotations as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: Exit 0 and an empty failure list, meaning the amends edge is annotated on its victim and both Warehouse IDs match their heading numbers.
    expected_literals: []
    fix_if: A forward-pointer failure means Decision 134 lacks the annotation; add it by line insertion. Do not reach for config/decision_supersession_waivers.yaml -- the edge is real and intended.
  - step: 6
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_reversal_stanzas already owns this assertion for the whole corpus; a per-entry row
      would narrow an existing broader guard.
    action: Prove every fenced reversal-conditions stanza still parses, including the three annotated ones.
    command: bin/venv-python -c "import sys; from scripts.checks.ops_governance.validate_reversal_stanzas import validate_reversal_stanzas as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: Exit 0 and an empty failure list, meaning both new stanzas and the three annotated ones parse and their decision numbers match their entries.
    expected_literals: []
    fix_if: A parse failure means a fence info string or the decision/review_by/conditions keys are malformed; correct against the Decision 133 stanza shape.
  - step: 7
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is diff-relative to this branch's merge-base. As a standing registry row it
      would fail every pull request that does not touch the corpus, since added would be zero. The
      durable append-only guard is the re-landing of Decision 177's own mechanism, retired by
      Decision 178, not a row minted here.
    action: Prove the DECISIONS.md change is purely additive, deleting zero baseline lines (Decision 177 clause 1).
    command: |-
      git fetch origin main --quiet && bin/venv-python -c "import subprocess,sys; mb=subprocess.run(['git','merge-base','origin/main','HEAD'],capture_output=True,text=True).stdout.strip(); out=subprocess.run(['git','diff','--numstat',mb,'--','docs/DECISIONS.md'],capture_output=True,text=True).stdout.split(); added,deleted=(int(out[0]),int(out[1])) if len(out)>=2 else (0,0); print('added:',added,'deleted:',deleted); sys.exit(0 if added>0 and deleted==0 else 1)"
    expected: Exit 0 with a positive added count and a deleted count of zero, meaning every insertion landed without rewriting a baseline line.
    expected_literals:
      - "deleted: 0"
    fix_if: A non-zero deleted count means a baseline body was edited in place; revert that hunk and express the correction as a dated annotation instead.
  - step: 8
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Envelope conformance for new entries is already owned by validate_decision_entry_conformance
      (step 3), and Decision 177 makes both bodies append-only once merged, so a registry row
      pinning these two numbers would assert something the corpus already cannot break.
    action: Prove both entries are present with a conformant envelope and the correct Warehouse ID.
    command: |-
      bin/venv-python -c "import sys; from scripts.decisions_md import iter_decision_sections; c=open('docs/DECISIONS.md',encoding='utf-8').read(); found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; ok=[n for n in (196,197) if n in found and ('**Warehouse ID:** dec-%d' % n) in found[n] and 'value: numbered_decision' in found[n]]; print('ratified:', ok); sys.exit(0 if ok==[196,197] else 1)"
    expected: Exit 0 and a ratified list naming both numbers. On the un-implemented tree the list is empty and the step exits 1, so it discriminates.
    expected_literals:
      - "ratified: [196, 197]"
    fix_if: A missing number means the entry was not inserted; a present number absent from the list means its Warehouse ID or significance value is wrong for that heading.
  - step: 9
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: t43-criteria-kind-generic
    action: Prove T4.3 criterion c2 names a work item of kind rec and that a criterion binds the producer and pick surface to the Decision 197 clause 6 grain.
    command: bin/venv-python -c "import sys,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t=[i for i in d['tier_items'] if i['id']=='T4.3'][0]; cs={c['id']:c['text'] for c in t['exit_criteria']}; c2='work item of kind rec' in cs.get('c2',''); kg=sorted(k for k,v in cs.items() if 'kind-generic' in v and 'Decision 197' in v); print('c2_workitem:', c2, 'kind_generic_criteria:', kg); sys.exit(0 if c2 and kg else 1)"
    expected: Exit 0 with the c2 flag true and a non-empty list of criterion ids. On the un-implemented tree the flag is false and the list empty, so it discriminates.
    expected_literals:
      - "c2_workitem: True"
    fix_if: A false flag means c2 was not reworded; an empty list means the new criterion does not spell both the kind-generic phrase and its Decision 197 citation.
  - step: 10
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-corpus-git-resident
    action: Prove Decision 196's reversal landed on both surfaces -- Decision 134 carries the forward pointer, and T1.5's first criterion no longer asserts retirement of the git corpus.
    command: bin/venv-python -c "import sys,yaml; from scripts.decisions_md import iter_decision_sections; c=open('docs/DECISIONS.md',encoding='utf-8').read(); found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; ptr='Decision 196' in found.get(134,''); d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); t15=[i for i in d['tier_items'] if i['id']=='T1.5'][0]; c1=t15['exit_criteria'][0]; c1t=c1['text'] if isinstance(c1,dict) else str(c1); print('dec134_names_196:', ptr, 'T15_c1_still_retires:', 'retired' in c1t.lower()); sys.exit(0 if ptr and 'retired' not in c1t.lower() else 1)"
    expected: Exit 0 with the forward-pointer flag true and the retirement flag false. On the un-implemented tree both are inverted, so it discriminates on each half independently.
    expected_literals:
      - "dec134_names_196: True"
    fix_if: A false pointer flag means Decision 134's annotation is missing. A true retirement flag means T1.5 c1 still asserts the end-state Decision 196 clause 1 reverses.
  - step: 11
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The criteria texts a standing row would pin are the carriers' own wording, which later plans
      are expected to refine as the work decomposes; pinning them would convert ordinary roadmap
      maintenance into a guard failure.
    action: Prove T1.5's criteria are fully structured and that T4.23 and T4.24 carry the forward work, with no live item depending on a deferred_post_mvp item.
    command: bin/venv-python -c "import sys; from scripts.roadmap.platform_roadmap import load; d=load('docs/ROADMAP-PLATFORM.yaml'); items={i.id:i for i in d.tier_items}; t15=items['T1.5']; structured=all(not isinstance(c,str) for c in t15.exit_criteria); n23=len(items['T4.23'].exit_criteria); n24=len(items['T4.24'].exit_criteria); print('t15_structured:', structured, 't15_criteria:', len(t15.exit_criteria), 't423_criteria:', n23, 't424_criteria:', n24); sys.exit(0 if structured and n23>4 and n24>6 else 1)"
    expected: Exit 0 with the structured flag true, 8 T1.5 criteria, more than 4 on T4.23 and more than 6 on T4.24. A successful load also proves the Decision 93 no-live-depends-on-deferred rule holds, since the model validator fails loud otherwise.
    expected_literals:
      - "t15_structured: True"
    fix_if: A false structured flag means a bare string survives on T1.5. A count at or below the threshold means a carrier criterion was not added. A load failure names the offending depends_on edge -- express the T1.5 to T4.24 coupling in criterion prose only, never as an edge.
  - step: 12
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A stanza interior is explicitly mutable under Decision 177 clause 4 ("update or re-arm"), so
      pinning today's annotated text would forbid the next legitimate re-arm.
    action: Prove none of the three reversal stanzas armed on the T1.5 portal cutover is left unannotated.
    command: bin/venv-python -c "import sys,re; from scripts.decisions_md import iter_decision_sections; c=open('docs/DECISIONS.md',encoding='utf-8').read(); found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; missing=[n for n in (167,177,179) if 'Decision 196' not in found.get(n,'')]; print('stanzas_missing_196_annotation:', missing); sys.exit(0 if not missing else 1)"
    expected: Exit 0 and an empty list, meaning each of the three entries whose stanza watches the T1.5 cutover now references Decision 196.
    expected_literals:
      - "stanzas_missing_196_annotation: []"
    fix_if: A named number means that entry's stanza still watches a trigger Decision 196 clause 1 forecloses; annotate or re-arm it inside the fence, which Decision 177 clause 4 permits.
  - step: 13
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap is already a registered check owning the line ceiling and the
      structured-criteria rule; a registry row here would duplicate it.
    action: Run the roadmap schema gate, which enforces the 10,000-line ceiling and the structured-criteria rule on every diff-touched item.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: Exit 0 and an empty failure list, meaning the roadmap is under the ceiling and every touched item's criteria are structured.
    expected_literals: []
    fix_if: A ceiling failure means the edit crossed 10,000 lines; reclaim lines inside the touched items rather than raising the ceiling, and file the step 17 escalation rec immediately rather than at the end.
  - step: 14
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      check_roadmap_regrowth is report-only by construction -- it never appends to a failure list,
      so there is no pass or fail for a registry row to carry.
    action: Record the roadmap regrowth observable so the headroom this plan consumes is on the record and the step 17 rec can cite a measured figure.
    command: bin/venv-python -c "import sys; from scripts.checks.roadmap.check_roadmap_regrowth import check_roadmap_regrowth as f; failed=[]; f(failed); sys.exit(0)"
    expected: Exit 0 and a printed GROWTH line naming the new line count and remaining headroom. Read it and carry the figure into step 17's rec; do not treat it as a gate.
    expected_literals: []
    fix_if: Nothing fails here. If the printed headroom is negative, step 13 has already failed and is the authority.
  - step: 15
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: Confirm the north-star guard recommendation is filed and readable back from the warehouse, and that Decision 196's Related line names its id.
    command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,sys; rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl',encoding='utf-8') if l.strip()]; hits=[r for r in rows if r.get('status')=='open' and 'north_star' in (str(r.get('title',''))+str(r.get('context',''))+str(r.get('acceptance','')))]; c=open('docs/DECISIONS.md',encoding='utf-8').read(); cited=[r['id'] for r in hits if r['id'] in c]; print('filed:', [r['id'] for r in hits], 'cited_in_corpus:', cited); sys.exit(0 if cited else 1)"
    expected: A non-empty filed list and a non-empty cited list, meaning the rec exists in the warehouse projection and its id is named in Decision 196's Related line.
    fix_if: An empty filed list means the portal write did not land -- re-run file_rec and never hand-edit logs/. A filed but uncited id means the rec was filed after Decision 196 was written; correct the Related line in the same commit.
  - step: 16
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is diff-relative to this branch. As a standing registry row it would fail any
      future pull request that legitimately changes code, which is nearly all of them.
    action: Prove the branch touches only docs/ and the sanctioned verification-registry shards, so the no-runtime-change claim is mechanical rather than asserted.
    command: |-
      git fetch origin main --quiet && bin/venv-python -c "import subprocess,sys; mb=subprocess.run(['git','merge-base','origin/main','HEAD'],capture_output=True,text=True).stdout.strip(); allowed=('docs/','config/agent/verification_registry/entries/'); files=[f for f in subprocess.run(['git','diff','--name-only',mb],capture_output=True,text=True).stdout.split() if not f.startswith(allowed)]; print('out_of_boundary_files:', files); sys.exit(0 if not files else 1)"
    expected: Exit 0 and an empty list. The verification-registry prefix is allowed because implement-scope-boundary.yaml's graduated_registry_shard row auto-sanctions the shards steps 9 and 10 owe, which can never be pre-declared scope rows.
    expected_literals:
      - "out_of_boundary_files: []"
    fix_if: A named file outside those two prefixes means the scope boundary was crossed; revert it and route the change to a recommendation instead.
  - step: 17
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Run this LAST, only after steps 1 to 16 and both validate tiers are green. File the
      roadmap-headroom escalation recommendation Decision 147's reversal condition now obliges,
      citing the measured GROWTH figure from step 14, then read it back and print its id for the
      handoff report.
    command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,sys; rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl',encoding='utf-8') if l.strip()]; hits=[r['id'] for r in rows if r.get('status')=='open' and 'headroom' in (str(r.get('title',''))+str(r.get('context',''))).lower() and 'roadmap' in (str(r.get('title',''))+str(r.get('context',''))).lower()]; print('headroom_escalation_recs:', hits); sys.exit(0 if hits else 1)"
    expected: A non-empty list naming the escalation rec. Its id goes in the handoff report so the next planning session can pick it up with fresh context.
    fix_if: An empty list means the rec was not filed or its title and context name neither roadmap nor headroom; re-file through the portal with both terms present.
  - step: 18
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Invoking scripts.validate from a graduate step is refused statically by
      vp-red-before.yaml's recursion_refusal rule; a waived step may name it freely.
    action: Run the authoritative fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0, meaning every fast-tier gate passes on the branch.
    expected_literals: []
    fix_if: A named check failure identifies the gate; fix the cause, never the check.
  - step: 19
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion_refusal rule as step 18; the full tier is the handoff gate, not a registry row.
    action: Run the full validation tier before handoff, which includes the post-merge decision-corpus checks.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, meaning the full tier passes.
    expected_literals: []
    fix_if: A named check failure identifies the gate; fix the cause, never the check.
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      T4.3's producer and pick surface stay kind-generic -- c2 names a produced work item of kind
      rec, and a sibling criterion cites Decision 197 clause 6. This is the commitment the whole
      plan exists to make binding rather than aspirational: if it regresses, T4.3 gets built
      rec-only and the pick surface is rebuilt when tier items join.
    verification_step: 9
    command: "'kind-generic' in v and 'Decision 197' in v"
    red_green_expectation: >-
      Red before -- measured on the un-implemented tree, step 9 exits 1 printing c2_workitem: False
      and an empty kind_generic_criteria list. Green after both edits land. The step is graduated
      as t43-criteria-kind-generic, so the assertion survives this plan as a standing registry row.
constraints:
  - "Decision 67: IMPLEMENTATION plan type only; STRATEGIC is refused during the freeze."
  - "Decision 177: live entries are append-only. Insert new entries above the current first heading, anchored on position, never on a number; correct a baseline body only by inserting a dated annotation, never by modifying a line. Clause 4 makes a fenced reversal-conditions stanza interior the one mutable surface."
  - "Decision 167 clause 3: each new entry stays under 6,144 bytes heading-to-next-heading. Trim Related first, then Problem, never the Decision clauses, and never by raising the cap (its reversal condition (a) forbids that)."
  - "Decisions 110, 114 and 147: a per-tier roadmap split is forbidden, stated verbatim in config/structural_size_budgets.yaml's roadmaps relief_valve row. Decision 197 clause 8 must name Decision 147's sanctioned valves instead."
  - "Decision 93: no live item (not_started or in_progress) may carry a depends_on edge onto a deferred_post_mvp item. T1.5 is not_started and T4.24 is deferred_post_mvp, so that coupling stays in criterion prose only; the platform_roadmap model validator fails loud on an edge."
  - "Decision 136: a diff-touched tier_item may not retain bare-string criteria, which is why repointing T1.5 c1 converts all 8."
  - "Decision 165 and Decision 187: the north-star guard rec must be authorization-shaped, not existence-shaped, and must bind scripts/checks/_marker_guard.py at check-name level rather than copying it."
  - "Decision 86: no new standing prose docs. Rationale goes to the two entries, forward intent to the T4.3/T4.23/T4.24 criteria, field semantics to a later contract."
  - "Decision 128: decompose, never raise, if a touched file crosses its SLOC budget."
  - "Decision 66: call get_rec_write_guidance() before each file_rec()."
