schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: governance-and-work-item-boundary
intent: Ratify Decisions 196 (three-tier decision model, amending Decision 134 clause 5) and 197 (work-item
  mechanism boundary) into the live corpus, make the roadmap bookkeeping the two entries require, and
  file two recommendations. Decision-corpus and roadmap bookkeeping only -- no runtime, schema or data
  change.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-governance-and-work-item-boundary.yaml
phase: T4.3
fallback_reevaluation:
  reevaluated_on: '2026-09-20'
  substrate_status: CD.27 pending; its pinned five candidates unchanged and economically indistinguishable
    at concurrency=1 (roadmap executor_substrate_billing.non_discrimination_conclusion). Decision 185
    already splits the loop DEFINITION from its host, so no substrate arm is exercised here.
  verdict: continue_on_current_substrate
  basis: This plan changes exit-criteria TEXT and the decision corpus only; it writes no code, no schema
    and no infrastructure, so it forms no new evidence about the CD.27 substrate. The kind-generic criterion
    added to T4.3 is a row-shape commitment (Decision 197 clause 6) that binds identically under any of
    CD.27's pinned candidates.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Insert Decisions 196 and 197 above the current first heading, position-anchored per Decision
    177. Append a dated forward-pointer annotation inside Decision 134''s block (mechanically required
    -- 196''s amends edge makes validate_supersession_annotations sub-check (a) fail without it). Then
    neutralise the three live reversal conditions armed on the T1.5 portal cutover that Decision 196 clause
    1 forecloses, by their OWN surface: Decision 177''s t15-portal-cutover-retires-the-surface and Decision
    179''s t15-portal-read are fenced-stanza conditions, which Decision 177 clause 4 makes the one mutable
    interior, so they are re-armed in place; Decision 167''s arming is condition (c) of its PROSE reversal-conditions
    paragraph, which clause 4 does NOT carve out, so it takes a dated appended annotation naming condition
    (c) and is never edited in place.'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'Reword T4.3 c2 to a produced work item of kind rec and add a criterion binding the producer
    and pick surface to Decision 197 clause 6''s grain. Repoint ALL THREE T1.5 surfaces that assert the
    retirement end-state -- c1, the intent, and the files_in_scope comment on docs/DECISIONS.md -- off
    the retirement end-state Decision 196 reverses, reworded IN PLACE; c1 keeps its bare-string shape.
    validate_platform_roadmap criterion (ii) keys on _roadmap_spans.legacy_regex_item_ids, which matches
    only added or removed ''- id: X'' lines, so a criteria-text edit never triggers the structured-criteria
    rule -- measured: a c2 reword and a bare-string reword both attribute to the empty set, and adding
    a criterion attributes to the criterion id, never the item id. Converting all 8 criteria would spend
    about 16 of roughly 99 remaining roadmap lines discharging an obligation that does not fire; rec-3660
    already owns that debt. Add AT MOST TWO carrier criteria per item -- to T4.24 (per-file decision split
    including header-source relocation, Tier B extraction, id prefixing, the failure_signal field) and
    T4.23 (work-item storage port and the three-table target model).'
- file: docs/plans/PLAN-governance-and-work-item-boundary.yaml
  action: Create
  purpose: This plan document.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79). docs/ROADMAP-PLATFORM.yaml is a packaged asset of the
  active data-pipeline artifact (src/lambdas/data-pipeline/manifest.yaml), so compute_affected_artifacts
  returns a data-pipeline entry for this scope. No build, deploy or smoke-test is owed: the edit is asset-only
  governance bookkeeping with no packaged code change, and the consuming scheduled agents are disabled.
  V1 stays correct -- this row records the coupling rather than escalating the tier, following PLAN-terraform-cicd-convergence-closeout.yaml''s
  precedent.'
acceptance_criteria:
- 'AC1: docs/DECISIONS.md carries entries 196 and 197, each with an envelope whose number matches its
  heading, significance.value numbered_decision, and a justification naming the specific docs/contracts/*.yaml
  home considered and rejected. Both envelopes are quoted verbatim in execution_steps so the plan-critique
  category-consistency gate can adjudicate the routing claim against a body sentence rather than a promise.'
- 'AC2: Each new entry carries the Status, Date and Decision markers, a fenced yaml reversal-conditions
  stanza, and a Warehouse ID line equal to dec-196 and dec-197 respectively.'
- 'AC3: Each new entry measures under the Decision 167 per-entry cap of 6,144 bytes, heading to next heading.
  Measured drafts came in at 5,522 and 5,733 bytes.'
- 'AC4: Decision 196 declares amends: [134] and states the reversal explicitly -- the corpus was withheld
  as private IP, and a user cannot run the governed loop locally without it, so the moat was the product.'
- 'AC5: Decision 134''s block carries a dated forward-pointer annotation naming Decision 196, added by
  line insertion only.'
- 'AC6: None of the three live reversal conditions armed on the T1.5 portal cutover is left watching a
  trigger Decision 196 clause 1 forecloses. Decision 177''s t15-portal-cutover-retires-the-surface and
  Decision 179''s t15-portal-read are re-armed INSIDE their fenced stanzas, ADDITIVELY ONLY -- a new key
  in the existing condition mapping or a new condition entry, never a modified or deleted line, so AC7''s
  zero-deletion rule and Decision 177 clause 4''s mutable carve-out are satisfied together. Decision 167''s
  prose condition (c) is neutralised by a dated appended annotation naming it, because clause 4 carves
  out fenced-stanza interiors only.'
- 'AC7: The docs/DECISIONS.md diff against the merge-base deletes zero lines and both new entries sit
  above the previous first heading (Decision 177 append-only, position-anchored).'
- 'AC8: docs/decisions-index.json regenerates and matches the live corpus.'
- 'AC9: T4.3 criterion c2 names a produced work item of kind rec, and a further criterion binds the producer
  and pick surface to the kind-generic grain of Decision 197 clause 6.'
- 'AC10: No T1.5 surface asserts retirement of docs/DECISIONS.md -- not c1, not the intent, and not the
  files_in_scope comment that reads ''retired only after portal cutover''. All are reworded in place;
  the criteria keep their existing bare-string shape, whose conversion is rec-3660''s debt, not this plan''s.'
- 'AC11: T4.23 and T4.24 carry exit criteria for the forward work Decisions 196 clause 8 and 197 clauses
  2, 3 and 7 name, and no live item gains a depends_on edge onto a deferred_post_mvp item.'
- 'AC12: docs/ROADMAP-PLATFORM.yaml stays under the 10,000-line ceiling and validate_platform_roadmap
  reports no failure.'
- 'AC13: An open recommendation exists for the north-star amendment guard carrying the literal token north-star-amendment-guard,
  authorization-shaped per Decision 165 and binding scripts/checks/_marker_guard.py at check-name level
  per Decision 187, and its id appears in Decision 196''s Related line.'
- 'AC14: After the rest of the Verification Plan is green, a second open recommendation exists for the
  roadmap-headroom escalation, carrying the literal token roadmap-headroom-dec147-escalation and the measured
  GROWTH figure from step 14, and its id is named in the handoff report. The trigger is check_roadmap_regrowth''s
  own escalate=true signal (headroom under its 500-line threshold), NOT Decision 147''s reversal condition,
  which fires only on a second breach of the 10,000-line ceiling -- the file is at 9,901 and has not breached.'
- 'AC15: The branch modifies nothing outside docs/ except the auto-sanctioned verification-registry shards
  owed by the graduated steps.'
- 'AC16: bin/venv-python -m scripts.validate exits 0.'
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A generator invocation, not an assertion -- it has no discriminating power
    of its own and step 2 is the check that proves its output correct. Graduating a --write command would
    install a registry row that mutates a tracked file on every run.
  action: Regenerate the committed decisions index after the DECISIONS.md edits.
  command: bin/venv-python -m scripts.decisions_index --write
  expected: Exit 0; the index is rewritten to include the two new entries.
  expected_literals: []
  fix_if: A non-zero exit means the new entries do not parse under the shared decisions_md grammar; re-read
    the heading and marker spellings against docs/contracts/decision-entry.yaml.
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Already a standing gate -- scripts.validate runs index freshness in both tiers,
    so a registry row here would duplicate an existing enforcer.
  action: Prove the regenerated index matches the live corpus.
  command: bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0, meaning the committed index is byte-identical to a fresh generation.
  expected_literals: []
  fix_if: A mismatch means step 1 was not rerun after the last DECISIONS.md edit; rerun step 1 and commit
    the index.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_decision_entry_conformance is already a registered --pre check; a
    second row invoking the same function would be a duplicate enforcer.
  action: Run the decision-entry authoring-grammar conformance gate over the two new entries.
  command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance
    import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if
    failed else 0)"
  expected: Exit 0 and an empty failure list, meaning both new entries carry the required markers and
    a well-formed significance envelope.
  expected_literals: []
  fix_if: A named failure identifies the missing marker or malformed envelope field; correct that entry
    and rerun.
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_decisions_size is already registered ungated in the --pre tier and
    owns the per-entry cap; a registry row here would re-run the same enforcer under a second name.
  action: Run the per-entry size gate, which hard-fails a new entry over the Decision 167 cap and warns
    on the amendment delta the Decision 134 annotation creates.
  command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decisions_size import
    validate_decisions_size as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
  expected: Exit 0 and an empty failure list. A WARN line for Decision 134's changed span is expected
    and is telemetry, never a failure.
  expected_literals: []
  fix_if: An over-cap failure names the entry; trim its Related line first per Decision 167 clause 3,
    then its Problem section, never its Decision clauses, and never by raising the cap.
- step: 5
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_supersession_annotations is a registered full-tier check; running
    it early catches a missing forward pointer before handoff rather than installing a new guard.
  action: Run the supersession-annotation and Warehouse-ID gate, which fails unless Decision 134's block
    names Decision 196.
  command: bin/venv-python -c "import sys; from scripts.checks.decisions.validate_supersession_annotations
    import validate_supersession_annotations as f; failed=[]; f(failed); print(failed); sys.exit(1 if
    failed else 0)"
  expected: Exit 0 and an empty failure list, meaning the amends edge is annotated on its victim and both
    Warehouse IDs match their heading numbers.
  expected_literals: []
  fix_if: 'A forward-pointer failure means Decision 134 lacks the annotation; add it by line insertion.
    Do not reach for config/decision_supersession_waivers.yaml -- the edge is real and intended. PHANTOM-EDGE
    HAZARD: _EDGE_RE matches ''amends Decision N'' / ''supersedes Decision N'' anywhere in a block and
    attributes the edge to the CONTAINING block, so the annotations added to Decisions 167, 177 and 179
    must never spell those literal forms -- say ''Decision 196 clause 1 forecloses this trigger'' instead.
    A failure naming 167, 177 or 179 as a superseder is this hazard, not a missing pointer.'
- step: 6
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_reversal_stanzas already owns this assertion for the whole corpus;
    a per-entry row would narrow an existing broader guard.
  action: Prove every fenced reversal-conditions stanza still parses, including the three annotated ones.
  command: bin/venv-python -c "import sys; from scripts.checks.ops_governance.validate_reversal_stanzas
    import validate_reversal_stanzas as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else
    0)"
  expected: Exit 0 and an empty failure list, meaning both new stanzas and the three annotated ones parse
    and their decision numbers match their entries.
  expected_literals: []
  fix_if: A parse failure means a fence info string or the decision/review_by/conditions keys are malformed;
    correct against the Decision 133 stanza shape.
- step: 7
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The assertion is diff-relative to this branch's merge-base. As a standing
    registry row it would fail every pull request that does not touch the corpus, since added would be
    zero. The durable append-only guard is the re-landing of Decision 177's own mechanism, retired by
    Decision 178, not a row minted here.
  action: Prove the DECISIONS.md change is purely additive, deleting zero baseline lines (Decision 177
    clause 1).
  command: 'git fetch origin main --quiet && git diff --numstat "$(git merge-base origin/main HEAD)" --
    docs/DECISIONS.md | awk ''BEGIN{a=0;d=0} {a+=$1; d+=$2} END{print "added:", a, "deleted:", d; exit
    (a>0 && d==0) ? 0 : 1}'''
  expected: 'Exit 0 with a positive added count and a deleted count of zero. The merge-base is spelled
    INLINE inside the git diff invocation so origin/main follows the word diff: that is what validate_vp_replay._is_pr_relative
    matches, which puts the step in the implement leg''s base-collapsed exclusion. Computing the merge-base
    in a separate subprocess call leaves _is_pr_relative False, and the step then reddens main post-merge
    when the base collapses onto HEAD and the diff is empty.'
  expected_literals:
  - 'deleted: 0'
  fix_if: A non-zero deleted count means a baseline body was edited in place; revert that hunk and express
    the correction as an ADDITIVE annotation instead -- a new line, or a new key inside an existing reversal-condition
    mapping. Never re-spell this command so origin/main stops following git diff.
- step: 8
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Envelope conformance for new entries is already owned by validate_decision_entry_conformance
    (step 3), and Decision 177 makes both bodies append-only once merged, so a registry row pinning these
    two numbers would assert something the corpus already cannot break.
  action: Prove both entries are present with a conformant envelope and the correct Warehouse ID.
  command: 'bin/venv-python -c "import sys; from scripts.decisions_md import iter_decision_sections; c=open(''docs/DECISIONS.md'',encoding=''utf-8'').read();
    found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; ok=[n for n in (196,197) if n in found
    and (''**Warehouse ID:** dec-%d'' % n) in found[n] and ''value: numbered_decision'' in found[n]];
    print(''ratified:'', ok); sys.exit(0 if ok==[196,197] else 1)"'
  expected: Exit 0 and a ratified list naming both numbers. On the un-implemented tree the list is empty
    and the step exits 1, so it discriminates.
  expected_literals:
  - 'ratified: [196, 197]'
  fix_if: A missing number means the entry was not inserted; a present number absent from the list means
    its Warehouse ID or significance value is wrong for that heading.
- step: 20
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'The right standing shape is a general guard -- every new entry''s significance
    justification must name a rejected contract home -- not a registry row pinning these two entries''
    specific contract names forever. That general guard is currently UNOWNED: rec-3015 and rec-3016 are
    both closed, and rec-3015''s acceptance was a planning-skill prose addition, never a mechanical check.
    Recording the gap here rather than mis-citing a closed rec as its owner; filing it is out of this
    plan''s agreed scope.'
  action: Prove each new envelope's significance justification names the specific contract home it rejected,
    discharging decision-entry.yaml's routing question (3) mechanically rather than by assertion (rec-3015).
  command: 'bin/venv-python -c "import sys,yaml; from scripts.decisions_md import iter_decision_sections;
    F=chr(96)*3; c=open(''docs/DECISIONS.md'',encoding=''utf-8'').read(); found={int(m.group(1)):b for
    m,b in iter_decision_sections(c)}; want={196:''decision-entry.yaml'',197:''data-modeling-standard.yaml''};
    cut=lambda b:(b.split(F+''yaml''+chr(10),1)[1].split(F,1)[0] if F+''yaml''+chr(10) in b else '''');
    just=lambda n: str(((yaml.safe_load(cut(found.get(n,''''))) or {}).get(''significance'') or {}).get(''justification'',''''));
    bad=[n for n,name in want.items() if name not in just(n)]; print(''envelopes_missing_rejected_contract:'',
    bad); sys.exit(0 if not bad else 1)"'
  expected: Exit 0 and an empty list, meaning 196's justification names decision-entry.yaml and 197's
    names data-modeling-standard.yaml as the homes considered and rejected. On the un-implemented tree
    both are missing, so it discriminates.
  expected_literals:
  - 'envelopes_missing_rejected_contract: []'
  fix_if: 'A named number means that entry''s justification claims numbered_decision without saying which
    contract could not carry it. Add the clause; do not weaken this step. The command deliberately builds
    the fence with chr(96)*3 and the newline with chr(10): a literal backtick inside a double-quoted shell
    string is command substitution, which exits 2 with a shell syntax error, and the red-before leg classifies
    that unmeasurable -- a hard failure rather than an honest red.'
- step: 21
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_decisions_size (step 4) already hard-fails a new entry over the cap;
    this step exists to PRINT the measured spans for the record, so a registry row would duplicate the
    enforcer while adding only an output.
  action: Measure both new entries heading-to-next-heading and print the spans, so AC3's figures are checked
    rather than asserted.
  command: 'bin/venv-python -c "import sys; from scripts.decisions_md import iter_decision_sections; c=open(''docs/DECISIONS.md'',encoding=''utf-8'').read();
    found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; spans={n: len(found[n].encode(''utf-8''))
    for n in (196,197) if n in found}; over=[n for n,s in spans.items() if s>6144]; print(''spans:'',
    spans, ''over_cap:'', over); sys.exit(0 if len(spans)==2 and not over else 1)"'
  expected: Exit 0, both numbers present, and an empty over_cap list. Drafts measured 5,522 and 5,733
    bytes on a simulated insertion; a materially different figure means the authored text diverged from
    the measured draft.
  expected_literals:
  - 'over_cap: []'
  fix_if: An over-cap number means trim that entry -- Related first per Decision 167 clause 3, then Problem,
    never the Decision clauses, and never by raising the cap.
- step: 23
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Decision 177 makes both bodies append-only once merged, so after this plan
    the clause numbering cannot regress; a standing registry row would assert something the corpus already
    cannot break. Its value is entirely at authoring time.
  action: Prove both ratified entries actually carry the eight numbered clauses this plan's acceptance
    criteria and roadmap criteria cite. AC9, step 9 and test_obligations bind on 197 clause 6; AC11 binds
    on 196 clause 8 and 197 clauses 2, 3 and 7. Without this, a T4.3 criterion could cite a clause the
    corpus does not contain.
  command: bin/venv-python -c "import sys,re; from scripts.decisions_md import iter_decision_sections;
    c=open('docs/DECISIONS.md',encoding='utf-8').read(); found={int(m.group(1)):b for m,b in iter_decision_sections(c)};
    want={196:8,197:8}; gaps={}; [gaps.setdefault(n,[k for k in range(1,hi+1) if not re.search(r'^'+str(k)+chr(46)+chr(32),
    found.get(n,''), re.M)]) for n,hi in want.items()]; bad={n:g for n,g in gaps.items() if g}; print('missing_clause_numbers:',
    bad); sys.exit(0 if not bad else 1)"
  expected: Exit 0 and an empty mapping. On the un-implemented tree every clause of both entries is reported
    missing, so it discriminates; on a simulated corpus carrying the drafted entries it reports an empty
    mapping.
  expected_literals:
  - 'missing_clause_numbers: {}'
  fix_if: A listed number means that entry does not carry that clause as a line starting with the digit
    and a period. Either the clause was dropped in authoring, or a citation elsewhere in the plan points
    at a clause that does not exist -- fix the entry, never the citation, unless the clause was deliberately
    renumbered.
- step: 9
  phase: pre-deploy
  hermetic: true
  graduation: graduate
  graduation_check_id: t43-criteria-kind-generic
  action: Prove T4.3 criterion c2 names a work item of kind rec and that a criterion binds the producer
    and pick surface to the Decision 197 clause 6 grain.
  command: bin/venv-python -c "import sys,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
    t=[i for i in d['tier_items'] if i['id']=='T4.3'][0]; cs={c['id']:c['text'] for c in t['exit_criteria']};
    c2='work item of kind rec' in cs.get('c2',''); kg=sorted(k for k,v in cs.items() if 'kind-generic'
    in v and 'Decision 197' in v); print('c2_workitem:', c2, 'kind_generic_criteria:', kg); sys.exit(0
    if c2 and kg else 1)"
  expected: Exit 0 with the c2 flag true and a non-empty list of criterion ids. On the un-implemented
    tree the flag is false and the list empty, so it discriminates.
  expected_literals:
  - 'c2_workitem: True'
  fix_if: A false flag means c2 was not reworded; an empty list means the new criterion does not spell
    both the kind-generic phrase and its Decision 197 citation.
- step: 10
  phase: pre-deploy
  hermetic: true
  graduation: graduate
  graduation_check_id: dec134-forward-pointer-to-196
  action: Prove Decision 134 carries the forward pointer naming Decision 196. Append-only under Decision
    177, so this is the durable half of the reversal and the one worth a standing registry row.
  command: bin/venv-python -c "import sys; from scripts.decisions_md import iter_decision_sections; c=open('docs/DECISIONS.md',encoding='utf-8').read();
    found={int(m.group(1)):b for m,b in iter_decision_sections(c)}; ptr='Decision 196' in found.get(134,'');
    print('dec134_names_196:', ptr); sys.exit(0 if ptr else 1)"
  expected: Exit 0 with the flag true. Red on the un-implemented tree. Decision 177 clause 1 makes a merged
    body append-only, so once true this can only be falsified by an illegal edit -- which is what makes
    it a sound standing row.
  expected_literals:
  - 'dec134_names_196: True'
  fix_if: A false flag means Decision 134's annotation is missing; add it by line insertion beneath its
    Warehouse ID line.
- step: 22
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Step 11''s reasoning applies unchanged: T1.5''s criterion wording is a carrier
    text later plans are expected to refine (rec-3660 converts these very strings), so a standing row
    pinning it would turn ordinary roadmap maintenance into a guard failure. The assertion is also content-keyed
    rather than position-keyed precisely because the shape is expected to change.'
  action: Prove no T1.5 surface -- criteria, intent, or the files_in_scope comment -- still asserts retirement
    of the git corpus, matched by content rather than by position so the check survives rec-3660's conversion.
  command: bin/venv-python -c "import sys,yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
    t=[i for i in d['tier_items'] if i['id']=='T1.5'][0]; texts=[(c['text'] if isinstance(c,dict) else
    str(c)) for c in t['exit_criteria']]+[str(t.get('intent',''))]+[str(x) for x in (t.get('files_in_scope')
    or [])]; bad=[x[:50] for x in texts if 'DECISIONS.md' in x and 'retire' in x.lower()]; print('surfaces_still_retiring:',
    len(bad)); sys.exit(0 if not bad else 1)"
  expected: Exit 0 with a count of zero. Red on the un-implemented tree, where both c1 and the intent
    match. The predicate requires BOTH the literal DECISIONS.md and the word retire in the same text,
    so a future criterion about retiring some other surface does not trip it.
  expected_literals:
  - 'surfaces_still_retiring: 0'
  fix_if: A non-zero count means a T1.5 criterion or its intent still asserts the end-state Decision 196
    clause 1 reverses. Reword it in place; do not convert the criteria to structured form (see constraints,
    Decision 136).
- step: 11
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The criteria texts a standing row would pin are the carriers' own wording,
    which later plans are expected to refine as the work decomposes; pinning them would convert ordinary
    roadmap maintenance into a guard failure.
  action: Prove T4.23 and T4.24 carry the forward work, with no live item depending on a deferred_post_mvp
    item.
  command: bin/venv-python -c "import sys; from scripts.roadmap.platform_roadmap import load; d=load('docs/ROADMAP-PLATFORM.yaml');
    items={i.id:i for i in d.tier_items}; n23=len(items['T4.23'].exit_criteria); n24=len(items['T4.24'].exit_criteria);
    print('t423_criteria:', n23, 't424_criteria:', n24); sys.exit(0 if n23>=6 and n24>=8 else 1)"
  expected: Exit 0 with at least 6 criteria on T4.23 and at least 8 on T4.24 -- today's 4 and 6 plus the
    two-per-item the plan commits to, so a single token criterion cannot green it. A successful load also
    proves the Decision 93 no-live-depends-on-deferred rule holds, since the model validator fails loud
    otherwise.
  expected_literals: []
  fix_if: A count at or below the threshold means a carrier criterion was not added. A load failure names
    the offending depends_on edge -- express the T1.5 to T4.24 coupling in criterion prose only, never
    as an edge.
- step: 12
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A stanza interior is explicitly mutable under Decision 177 clause 4 ("update
