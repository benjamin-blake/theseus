  behavior: 'T4.3''s producer and pick surface stay kind-generic -- c2 names a produced work item of kind
    rec, and a sibling criterion cites Decision 197 clause 6. This is the commitment the whole plan exists
    to make binding rather than aspirational: if it regresses, T4.3 gets built rec-only and the pick surface
    is rebuilt when tier items join.'
  verification_step: 9
  command: '''kind-generic'' in v and ''Decision 197'' in v'
  red_green_expectation: 'Red before -- measured on the un-implemented tree, step 9 exits 1 printing c2_workitem:
    False and an empty kind_generic_criteria list. Green after both edits land. The step is graduated
    as t43-criteria-kind-generic, so the assertion survives this plan as a standing registry row.'
constraints:
- 'Decision 67: IMPLEMENTATION plan type only; STRATEGIC is refused during the freeze.'
- 'Decision 177: live entries are append-only. Insert new entries above the current first heading, anchored
  on position, never on a number; correct a baseline body only by inserting a dated annotation, never
  by modifying a line. Clause 4 makes a fenced reversal-conditions stanza interior the one mutable surface
  -- but this plan still edits it ADDITIVELY ONLY (a new key or condition entry), because AC7 and step
  7 fail on any deleted line in docs/DECISIONS.md.'
- 'Decision 167 clause 3: each new entry stays under 6,144 bytes heading-to-next-heading. Trim Related
  first, then Problem, never the Decision clauses, and never by raising the cap (its reversal condition
  (a) forbids that).'
- 'Decisions 110, 114 and 147: a per-tier roadmap split is forbidden, stated verbatim in config/structural_size_budgets.yaml''s
  roadmaps relief_valve row. Decision 197 clause 8 must name Decision 147''s sanctioned valves instead.'
- 'Decision 93: no live item (not_started or in_progress) may carry a depends_on edge onto a deferred_post_mvp
  item. T1.5 is not_started and T4.24 is deferred_post_mvp, so that coupling stays in criterion prose
  only; the platform_roadmap model validator fails loud on an edge.'
- 'Decision 136: a diff-touched tier_item may not retain bare-string criteria -- measured, this plan''s
  edit shape does not trip it. legacy_regex_item_ids attributes only criterion ids (c4), never T4.3 or
  T1.5, so validate_platform_roadmap criterion (ii) never fires. Converting T1.5''s 8 bare strings is
  rec-3660''s debt (open), not this plan''s; do NOT convert them here.'
- 'Decision 165 and Decision 187: the north-star guard rec must be authorization-shaped, not existence-shaped,
  and must bind scripts/checks/_marker_guard.py at check-name level rather than copying it.'
- 'Decision 86: no new standing prose docs. Rationale goes to the two entries, forward intent to the T4.3/T4.23/T4.24
  criteria, field semantics to a later contract.'
- 'Decision 128: decompose, never raise, if a touched file crosses its SLOC budget.'
- 'Decision 66: call get_rec_write_guidance() before each file_rec().'
- 'Single Portal Invariant: never edit logs/.recommendations-log.jsonl or logs/.decisions-index.jsonl
  directly.'
- No rescue agents or workaround loops (Decision 55).
- docs/decisions-index.json and the verification-registry shards are auto-sanctioned by implement-scope-boundary.yaml
  and are not scope rows.
