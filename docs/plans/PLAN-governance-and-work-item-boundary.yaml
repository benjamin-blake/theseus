  command: 'bin/venv-python -c "import sys,re; from scripts.decisions_md import iter_decision_sections;
    F=chr(96)*3; c=open(''docs/DECISIONS.md'',encoding=''utf-8'').read(); found={int(m.group(1)):b for
    m,b in iter_decision_sections(c)}; fence=lambda n: (found.get(n,'''').split(F+''yaml reversal-conditions'',1)[1].split(F,1)[0]
    if F+''yaml reversal-conditions'' in found.get(n,'''') else ''''); miss=[n for n in (177,179) if ''Decision
