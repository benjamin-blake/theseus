  Write it authorization-shaped per Decision 165 (an existence-only marker check is the category error
  that Decision names), binding scripts/checks/_marker_guard.py at check-name level per Decision 187 rather
  than adding a sixth copy, and state why a north-star amendment is a genuine judgment checkpoint rather
  than the discretionary gate Decision 163 clause 1 argues against. Do not build the guard.
