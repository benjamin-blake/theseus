  \ operational data,\n    plus a target model three live surfaces must converge on. Not a contract governance\
  \ note:\n    data-modeling-standard.yaml owns HOW a table is designed, not WHICH mechanism ships versus\n\
  \    stays private, and exit-criteria-ledger.yaml owns one of the three completion shapes this\n   \
  \ unifies rather than the unification. No prior entry can be amended to carry it."
- 'Decision 196 clause 1 states the reversal in its own terms: the corpus was withheld as private IP and
  a moat; Decision 184 made the repository the free tier; a user cannot run the governed loop locally
  without a copy of the corpus, so the moat was the product. It names Decision 134 clause 5 as the end-state
  it withdraws and T1.5 c1 as the criterion repointed in the same change.'
- 'Decision 197''s two contestable clauses are authored EXACTLY as follows, quoted here so the plan-critique
  category-consistency gate adjudicates 197''s numbered_decision routing against body text rather than
  against the envelope''s own self-certification.


  3. Target model (grain first, per the data-modeling default). work_items: one row per work item, SCD2,
  kind discriminates epic-shaped (today''s tier item) from task-shaped (today''s rec); both id schemes
  survive, type-prefixed and never renumbered. work_item_criteria: one row per (work item, criterion)
  -- criterion text, verification method, status; it carries the graduation concept and subsumes rec acceptance,
  tier-item exit_criteria and plan verification_plan steps AS CRITERION ROWS ONLY. A plan is never a work_items
  kind: Decision 87 clause 6''s rec-versus-plan grain distinction survives unchanged. work_item_edges:
  one row per directed edge with a closed, validated edge vocabulary. All three are partitioned (Decision
  137); merge keys, identity and join keys land with the clause-8 contract, not here.


  8. Sequencing. Design now, migrate once post-MVP (Decision 93), recording the destination while deliberately
  not building it -- Decision 87 clauses 1-2''s own precedent, not frame-lock. No lift-and-shift of the
  roadmap''s current shape into the warehouse occurs meanwhile, and T4.23/T4.24 carry the forward work.
  Roadmap line-ceiling pressure is relieved only by Decision 147''s sanctioned valves (compaction in place,
  lifecycle archival, or a consciously-cited raise); a per-tier split stays forbidden (Decisions 110,
  114, 147).


  Clause 3 is a numbered_decision rather than data-modeling-standard.yaml content because that contract
  governs HOW any table is designed, while this fixes WHICH mechanism ships and which data stays private,
  and binds three live surfaces to one grain. Clause 8 is not mere restatement of Decisions 110/114/147:
  it records the sequencing commitment (design now, migrate once post-MVP) and names the forbidden option
  only to close it off for the migration this entry opens -- the prohibition remains those Decisions'',
  not this one''s.'
- docs/DECISIONS.md -- append the dated forward-pointer annotation inside Decision 134's block, placed
  beneath its Warehouse ID line, matching the placement used on Decisions 106 and 149. Then annotate the
  three reversal stanzas in Decisions 167, 177 and 179. None of these annotations may spell the literal
