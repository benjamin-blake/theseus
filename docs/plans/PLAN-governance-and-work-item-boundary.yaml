  the typed yaml envelope (bare ```yaml fence, never ```yaml reversal-conditions), the Status/Date/Decision
  markers, Problem and Intent, the fenced reversal-conditions stanza, a Warehouse ID line, Related, and
  the trailing --- block separator.
- "Decision 196's envelope carries amends: [134] and EXACTLY this significance block, which step 20 checks\
  \ and the plan-critique category-consistency gate adjudicates:\nsignificance:\n  value: numbered_decision\n\
  \  justification: >-\n    Durable, reversal-relevant product-boundary commitment on what governance\
  \ a free-tier user\n    receives and how it is layered, carrying a recorded reversal of the corpus's\
  \ storage\n    direction. Not a contract governance note: decision-entry.yaml owns the corpus's AUTHORING\n\
  \    GRAMMAR, not what ships to a user, and cannot bind Tier A's context or amendment policy. Not\n\
  \    an amendment of 184, which draws the code boundary, not the decision-corpus boundary."
