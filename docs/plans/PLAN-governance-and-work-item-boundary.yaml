execution_steps:
- 'E1: file the north-star guard recommendation FIRST via scripts.ops_data_portal (C11), so its id can
  be cited in Decision 196''s Related line. It MUST carry the literal token north-star-amendment-guard
  -- step 15 binds on that token and nothing else. Shape it per C8. Do not build the guard.'
- 'E2: docs/DECISIONS.md -- insert BOTH entries above the current first heading (C2), 196 FIRST and then
  197 above it, so the file head ends up reading 197, 196, then the previous first heading. Trace it:
  inserting 196 gives [196, 195, ...], then inserting 197 above it gives [197, 196, 195, ...]. The corpus
  runs newest-first (138 descending heading pairs against 9 ascending) and step 8 pins first_two_headings:
  [197, 196]. E3 and E4 carry the two bodies verbatim and are the ONLY source for them -- author exactly
  that text, changing nothing except substituting E1''s allocated rec id into Decision 196''s Related
  line, in place of the word ''companion rec'' while keeping the rest of that parenthetical.'
- "E3: Decision 197 is authored EXACTLY as follows.\n\n## Decision 197: Work-item mechanism boundary --\
  \ the mechanism ships, the data does not; roadmap tier items and recommendations converge on one work-item\
  \ model behind a storage port, and the executor's pick surface is kind-generic from its first implementation\
  \ (Decided)\n\n```yaml\nnumber: 197\nstatus: Decided\ndecided_date: \"2026-09-20\"\nsignificance:\n\
  \  value: numbered_decision\n  justification: >-\n    Durable, reversal-relevant boundary between shipped\
  \ mechanism and private operational data,\n    plus a target model three live surfaces must converge\
  \ on. Not a contract governance note:\n    data-modeling-standard.yaml owns HOW a table is designed,\
  \ not WHICH mechanism ships versus\n    stays private, and exit-criteria-ledger.yaml owns one of the\
  \ three completion shapes this\n    unifies rather than the unification. No prior entry can be amended\
  \ to carry it.\n```\n\n**Status:** Decided\n**Date:** 2026-09-20\n**Warehouse ID:** dec-197 (per Decision\
  \ 84 backfill)\n\n**Problem:** Work to do lives in two places with no join: `ROADMAP-PLATFORM.yaml`\
  \ (172 tier items, 796 exit criteria, `depends_on` validated for dangling refs and cycles, at 9,901\
  \ of a 10,000-line ceiling) and `ops_recommendations` (writer-allocated ids, a `dependencies` field\
  \ nothing traverses). Three shapes describe \"done\": a rec's shell-command `acceptance`, a tier item's\
  \ prose `exit_criteria`, a plan's `verification_plan` with graduation. Plans mint dependency edges (`bundled_recommendations`,\
  \ `followon_recs`) that die when the plan file archives. The autonomous executor (T4.3, T4.19, T4.1)\
  \ is about to lock its pick-up interface to recs alone.\n\n**Intent:** One work-item mechanism ships\
  \ with the platform and drives the executor in every tier; this operator's work-item rows are private\
  \ and never ship.\n\n**Decision:**\n1. Boundary. The work-item MECHANISM (schema, portal verbs, edge\
  \ model, acceptance-criteria model, executor pick surface) is a core shipped component in every tier.\
  \ The work-item DATA in this repository (roadmap content, recommendations, queue rows) is this operator's\
  \ IP and never ships.\n2. Storage port. Work items are reached through a named port (Decision 184 clause\
  \ 2); the local adapter is a file catalog, the cloud adapter is DuckLake-on-Neon; the user selects by\
  \ configuration. T4.23 is that port's tracked local-adapter item. Tenancy (`project_id`) is a cloud-adapter\
  \ property, not a mechanism requirement; the local adapter is single-tenant by construction.\n3. Target\
  \ model (grain first, per the data-modeling default). `work_items`: one row per work item, SCD2, `kind`\
  \ discriminates epic-shaped (today's tier item) from task-shaped (today's rec); both id schemes survive,\
  \ type-prefixed and never renumbered. `work_item_criteria`: one row per (work item, criterion) -- criterion\
  \ text, verification method, status; it carries the graduation concept and subsumes rec `acceptance`,\
  \ tier-item `exit_criteria` and plan `verification_plan` steps AS CRITERION ROWS ONLY. A plan is never\
  \ a `work_items` kind: Decision 87 clause 6's rec-versus-plan grain distinction survives unchanged.\
  \ `work_item_edges`: one row per directed edge, append-only, with a closed validated edge vocabulary.\
  \ `work_item_criteria` is SCD2 with its parent. All three are partitioned (Decision 137); merge keys,\
  \ identity and join keys are settled by the clause-8 migration, not here.\n4. Taxonomy stays out of\
  \ the schema. Tier membership (`T4.x`), verification tiers (`V1..V3`) and `source: ci_rca` are grouping\
  \ items, edges or extension values, never columns, so a user's work items carry none of this operator's\
  \ vocabulary.\n5. Edges are authored at merge. A plan DECLARES intended edges; the squash-merge writes\
  \ them, as `rec-autoclose.yml` already writes closure edges from the `Resolves:` trailer. Plan-declared\
  \ edges are never the durable record.\n6. Executor pick surface. T4.3's producer and every later consumer\
  \ are written against the clause-3 grain (`pick_work_item`, one row per pickable item, `kind`-discriminated)\
  \ even while `kind: rec` is the only populated kind; tier items join by adding a kind, never by rebuilding\
  \ the surface. T4.3's rec-shaped exit criteria are amended accordingly.\n7. Vocabulary. \"Recommendation\"\
  \ and the `file_rec` / `update_rec` verbs are renamed with the model, never as a separate later pass\
  \ (323 files reference the verbs today; the free tier makes them public API). The rename moves the closed\
  \ named-verb boundary (Decision 84 I-3), it does not open it.\n8. Sequencing. Design now, migrate once\
  \ post-MVP (Decision 93), recording the destination while deliberately not building it -- Decision 87\
  \ clauses 1-2's own precedent, not frame-lock. No lift-and-shift of the roadmap's current shape into\
  \ the warehouse occurs meanwhile, and T4.23/T4.24 carry the forward work. Roadmap line-ceiling pressure\
  \ is relieved only by Decision 147's sanctioned valves (compaction in place, lifecycle archival, or\
