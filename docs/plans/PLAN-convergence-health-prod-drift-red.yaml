  - step: 10
    phase: pre-deploy
    action: The retired test module is gone with no dangling references (closure obligation, surface retirement)
    command: test ! -e tests/convergence_health/test_code_drift.py && ! grep -rn "test_code_drift\.py\|tests\.convergence_health\.test_code_drift" --include="*.py" --include="*.yaml" --include="*.yml" --include="*.md" --exclude="registry.yaml" . --exclude-dir=.venv --exclude-dir=.git --exclude-dir=docs && echo SWEEP_CLEAN
    expected: prints SWEEP_CLEAN
    fix_if: >-
