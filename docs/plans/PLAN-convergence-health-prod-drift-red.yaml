    phase: pre-deploy
    action: >-
      The compute_followon_state plan-scan skips documents that do not mention closes_criteria,
      without over-skipping ones that do. Added after this PR's own pr-validate run reddened on
      the fast-tier budget (5.7 min); that N+1 was the dominant cost and its fix is what brings
