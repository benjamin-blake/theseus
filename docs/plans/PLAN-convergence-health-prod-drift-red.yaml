constraints:
  - >-
    Decision 55 anti-masking. Do NOT fix the red by swallowing validate_source's raise, by adding
    continue-on-error to the prod-drift step, or by removing the step. The alarm must keep failing
    loud on a genuine inability to file.
  - >-
    Do NOT write anything to s3://agent-platform-data-lake/convergence/personal/*. The
    convergence-health job assumes agent-platform-github-ci-branch, which carries an explicit Deny
    on s3:PutObject and s3:DeleteObject for that prefix (terraform/personal/oidc_ci_roles.tf:88,
    sid DenyConvergenceRecordWrite), asserted by validate_convergence_writer_isolation.py clause
    (c) and mirrored for PlatformDev in platform_roles.tf (DEP-13 / Decision 144). The single-writer
    set is {github_ci_apply, github_ci_planner main-sub}. An earlier draft proposed an S3 heartbeat
    in that prefix; it would have failed AccessDenied on every run and kept the workflow red.
    Sensor liveness is therefore read from the GitHub Actions run API, requiring no IAM change.
  - >-
    Fail closed on uncertainty: a null source_git_sha (break-glass local deploy, which sets no
    GITHUB_SHA), a sha unresolvable in history, or an empty latest_sha is STALE, never fresh.
  - >-
    Do NOT change write_deploy_record's GITHUB_SHA semantics. The record is an honest statement of
    which commit was deployed; the sensor's comparison was the defect. Changing the writer would
    invalidate both deploy workflows' smoke preconditions, which assert source_git_sha == github.sha.
  - >-
    SCANNED_PATHS is the COMPLETE scan set and must include the existing portal surface
    (scripts/ops_data_portal.py, scripts/ops_portal/*.py -- its original Decision 104/124 subject)
    alongside these producer modules: scripts/convergence_health/code_drift.py,
    scripts/convergence_health/escalate.py, scripts/checks/_budget_recs.py,
    scripts/ci_rca/probe_health.py, scripts/preflight/ci_rca_gauges.py,
    scripts/executor/jsonl_store.py, scripts/executor/branch_lifecycle.py,
    scripts/ducklake_smoke/lambda_ops_gates.py. Do NOT sweep scripts/** wholesale -- src/ and
    tests/ carry unrelated "source": "..." keys (yfinance, layer, mock, custom-source) that would
    red collaterally.
  - >-
    Do NOT resolve the coverage regression with a config/coverage_baseline.yaml entry.
    validate_coverage_baseline_edits is a registered check and Decision 159 governs that surface;
    the correct mechanism is the _CONCERN_SPLIT_TEST_PACKAGES registration in scope.
  - >-
    Decision 131 point 2: validate_no_cross_test_imports forbids a tests/** module importing from
    another test_* module. Shared fixtures go in the new conftest.py, never imported across the split.
  - >-
    docs/contracts/build-lambda.yaml is a Class D contract. check_amendment_log_for_class_d
    (scripts/checks/contracts/_population.py:374, dispatched from validate_contract_drift.py, a
    pre=True check) FAILS a parsed-content change with no new amendment_log[] entry.
  - >-
    Do NOT add convergence-health to ci-rca.yml's workflow_run filter. config/ci_rca_taxonomy.yaml
    marks it ci_rca:excluded because a standing environmental red would mint a critical rec per
    push -- a rec storm plus a planning-queue wedge. Decision 62's alarm-not-gate monitor lane is
    the sanctioned treatment.
  - >-
    Do NOT add a live-state or network probe to scripts/validate.py. It validates the working tree
    deterministically; sensor run-health is runtime state. A probe there would be non-deterministic
    in the fast tier (Decision 153 budget) and would red CI itself -- a required check -- turning a
    deliberately non-wedging alarm into a merge blocker (Decision 83 non-wedging).
  - >-
    Decision 128: every SLOC crossing here is resolved by decomposition, never by a
    config/sloc_budgets.yaml raise and never by a --update-sloc-budgets re-seed.
  - >-
    The reachability oracle requires full git history. convergence-health.yml line 72 already
    checks out with fetch-depth 0; do not reduce it. Guard the shallow case explicitly so a future
    regression fails loud rather than silently reporting false drift.
  - >-
    PROD_SOURCE_PATHSPECS must stay in sync with deploy-prod-lambdas.yml's on.push.paths
    (rec-2686, single conceptual source). This plan changes the comparison, not the pathspecs.
  - Only files listed in Scope may be modified. Out-of-scope findings become recs, not inline fixes.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: Decision 66,
    Decision 61, Decision 55, Decision 169. Flagged and resolved in scope: Decision 170 (examined()
    + baseline shrink), Decision 103 (acceptance oracle re-expressed), Decision 73 (fast tier),
    Decision 86 (deploy_record contract stanza). RELATED: Decision 84, Decision 131, Decision 79,
    Decision 48, Decision 155, Decision 166, Decision 125, Decision 126. Surfaced by plan-critique
    and honoured here: Decision 92 point 2 and Decision 144 points 3 and 7 (convergence
    single-writer Deny), Decision 75 (frame challenge), Decision 153 (fast-tier budget), Decision
    128 (preflight.py SLOC), Decision 159 (coverage-baseline surface), Decision 131 point 2
    (cross-test-import ban)."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Incident record. convergence-health failed on ~20 consecutive scheduled runs from 2026-08-17
    10:59Z, one notification email each. The convergence RECORD was green throughout -- only the
    sensor workflow was red -- which is why preflight reported convergence_health green.
  - >-
    Three compounding defects. (A) prod_code_drift was never registered, so file_rec raised and the
    step exited 1; latent since T2.43 because a no-drift tick never reaches the portal. (B) The
    freshness test compared GITHUB_SHA (HEAD at deploy time) for equality against the last
    source-touching commit; these coincide only for push-triggered deploys. (C) The registry guard
    scans only schedule.yaml and the portal files, so a producer module could ship an unregistered
    source undetected.
  - >-
    Defect A is not unique. Enumerating the producer modules for this plan found a SECOND
    unregistered source, executor-hotfix at scripts/executor/branch_lifecycle.py:400, which would
    raise the identical error whenever a hotfix rec is filed -- dormant only because the executor is
    frozen (Decision 67). It is registered here because the widened guard would otherwise red this
    PR, and because it is the same defect. This is direct evidence that defect C, not defect A, is
    the load-bearing gap.
  - >-
    Why it fired when it did. The repository was renamed agent-platform -> theseus, which broke
    OIDC trust subjects and made the normal push-triggered apply/deploy path unavailable
    (corroborated by the 2026-08-15 OIDC outage cited in scripts/ci/convergence_advisory.py, the
    oidc-trust-contraction-closure and oidc-immutable-subject-recovery branches, and
    terraform-apply-sandbox push failures on 2026-08-15 followed by workflow_dispatch successes).
    Recovery therefore ran through workflow_dispatch, which stamped a HEAD sha unrelated to prod
    source (7fa00f2 at 10:37Z, then 149c36b at 15:09Z) and exposed defect B. Both recovery deploys
    ran IN GitHub Actions, not on the admin container -- a true break-glass local deploy sets no
    GITHUB_SHA and would have written source_git_sha null.
  - >-
    There is no real drift today. The deployed sha 149c36b postdates d024e63f, the latest
    prod-source commit, so the corrected oracle reports fresh and files nothing. Verification step
    13 is the live confirmation.
  - >-
    Liveness design, revised after critique round 1. The first draft proposed an S3 heartbeat under
    convergence/personal/, which is IAM-Denied to the sensor's own role and would have re-created
    the red it was meant to fix. The accepted design mirrors _check_ci_rca_liveness
    (scripts/preflight/ci_rca_signals.py:194-258), which already shells out to `gh run list` with a
    creds guard and degrade-to-None handling -- the platform-native "did workflow X last succeed"
    primitive, in the very file being edited. No IAM change, no workflow edit.
  - >-
    Scope additions from critique rounds 2 and 3, each verified by executing the gate rather than
    reading it. (i) scripts/session/preflight.py measures 498 effective lines against the hard 500
    gate and is unregistered, and validate_sloc_limits is pre=True with no pre_globs (always runs)
    -- so the liveness wiring cannot be added without first relocating code, hence the NEW
    scripts/preflight/summary.py. Round 3 corrected an error here: an earlier draft named
    scripts/preflight/alerts.py as a Create target, but that module already exists (118 effective
    lines, seven derivation-only functions, four re-exported through preflight.py L64-69 and three
    called at L277-279); declaring Create on it risked an overwrite, and folding presentation into
    a derivation-only module mixed concerns. (ii) Splitting the test module breaks the coverage
    measurement for code_drift.py because map_source_to_test resolves it to a single file; hence
    the _CONCERN_SPLIT_TEST_PACKAGES registration. Measured precisely: with the prod cases removed
    the mapped file yields 58% (50 of 119 statements, lines 222-225/229-230/242/273-342) -- that is
    an INTERMEDIATE-state figure; in the merged end-state, with the mapped file deleted and no
    registration, coverage_baseline skips the module entirely (test_path missing) and produces NO
    measurement at all, which is a quieter and arguably worse failure. Either way the registration
    is the fix. (iii) Adding a report key trips two frozen assertions in
    tests/test_session_preflight_decomposition.py (99 tests green today), so that file is in scope.
    Note that decomposing the SOURCE module into a package instead would make it map to None and
    fall OUT of the coverage roster entirely -- gate-dodging, deliberately not chosen.
  - >-
    Verification tier note. No scope file appears in any src/lambdas/*/manifest.yaml
    (compute_affected_artifacts returns empty for all scope paths), so Decision 79's
    manifest-derived V3 trigger does not fire and the deterministic tier is V2. V3 is a voluntary
