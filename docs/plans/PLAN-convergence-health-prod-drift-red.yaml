      the terraform_pending tuple-unpack branch, outbox non-empty/exception paths, the warm_sync
      exception path, the PYTEST_CURRENT_TEST-absent S3_LOG_BUCKET default, and
      open_telemetry_session's exception fallback) and were only ever exercised by the separate
      tests/test_session_preflight_decomposition.py equivalence suite, which
      scripts.test_coverage_checker's map_source_to_test does not include in preflight.py's
      mapped coverage run (tests/session/preflight/ is the sole mapped target). Since
      scripts/session/preflight.py is already Modify-in-scope, closing its coverage to 100% is
      part of modifying it, not new scope -- but this NEW FILE achieving that (rather than
      growing test_main_report.py, itself at 495/500 effective lines) was not anticipated at
      planning time and should have been added to Scope then; recorded here instead, after the
      fact, per code review. New in Decision 128 spirit (decompose by default): a fresh file
      rather than pushing test_main_report.py over its SLOC budget.
  - file: scripts/platform_roadmap_state.py
    action: Modify
    purpose: >-
      Added post-plan, after the PR's own CI reddened (code-review Critical, addressed at source).
      pr-validate failed with "Fast tier exceeded budget (5 min). Elapsed: 5.7 min. Dominant
      phase: pytest_diff" -- that check's own fix_if mandates fixing at source, never narrowing
      the check or waiving the budget. Root cause is an N+1 in compute_followon_state: it
      yaml.safe_load()s EVERY document in docs/plans/ (~350 files) on every call, purely to read
      one optional top-level key, closes_criteria. Profiling put 17 of compute_state_dict's 18.4s
      in that loop. Since scripts/session/preflight.py's main() calls compute_state_dict twice and
      is itself Modify-in-scope here, this plan's diff pulls the whole tests/session/preflight
      constellation into the affected-set, so the pre-existing N+1 became this PR's merge blocker.
      Fix is a substring pre-filter -- skip parsing a document whose text never mentions the key,
      which is provably equivalent (a YAML mapping key must appear literally in its own document;
      quoting preserves the substring, and a merge key can only pull in an anchor defined in that
      same file). Verified equivalent against the original logic over the live roadmap, and
      measured on the exact affected-set: 219.46s -> 87.24s for the same 1134 passing tests, with
      tests taking >=5s dropping from 62 (529 CPU-seconds) to zero. Deliberately NOT also swapping
      the loader to CSafeLoader (measured a further 14x on the residue) -- the pre-filter alone
      clears the budget with margin, and a loader swap is a broader behavioural change that
      deserves its own review. The residual, genuinely out-of-scope instances of unmocked
      compute_state_dict cost in sibling test files remain filed as rec-3208.
  - file: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    action: Modify
    purpose: >-
      Regression cover for the compute_followon_state pre-filter above (TestKeylessPlanSkipsYamlParse).
      Pins the mechanism -- a plan whose text lacks closes_criteria is never yaml.safe_load()ed, via
      a spy, which fails against the pre-fix code (verified by reverting) -- so the N+1 cannot
      silently return. Pins the complement too: a plan that does carry the key, in bare or quoted
      form, is still parsed and still suppresses the follow-on, so the skip can never over-swallow.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Two edits, both required. (1) Remove or amend the ("code_drift", "test_code_drift.py") row in
      test_maps_convergence_health_submodules_to_their_own_mirror's parametrize list (line 310) --
      it asserts the PRE-registration mapping and fails the moment the concern-split entry lands.
      (2) Add the directory-mapping assertion so the registration is guarded against silent
      removal.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_source returns without raising for both 'prod_code_drift' and 'executor-hotfix', and
    no source literal in any SCANNED_PATHS module is unregistered.
  - >-
    Deployed-code freshness is evaluated by the reachability oracle: the latest watched-source
    commit REACHABLE FROM the recorded source_git_sha equals the latest watched-source commit on
    HEAD. A deploy made from a commit that postdates the newest source change is therefore fresh.
  - A null, unresolvable, or empty source_git_sha or latest_sha is treated as stale (fail closed), never as fresh.
  - The filed drift rec's acceptance command is satisfiable by a correct redeploy under the reachability oracle.
  - check_source_registry fails when any module in SCANNED_PATHS hardcodes an unregistered source literal.
  - >-
    check_source_registry runs on every fast-tier invocation (pre=True, pre_globs None = ungated),
    so an unregistered source is blocked pre-merge regardless of which scanned file the PR touches.
  - check_source_registry declares an examined() outcome and is absent from config/check_accounting_baseline.yaml.
  - >-
    scripts/convergence_health/code_drift.py still measures 100% coverage after the test
    decomposition, via its registered concern-split test package.
  - >-
    Every gated Python file this plan touches is under 500 effective lines, with no new
    config/sloc_budgets.yaml entry -- specifically scripts/session/preflight.py (498 today) and
    both new test modules.
  - The retired tests/convergence_health/test_code_drift.py is deleted with no dangling references to it.
  - >-
    Preflight surfaces a convergence-health sensor-liveness alert when the latest run of that
    workflow did not succeed, even when the convergence record status is green, and degrades to
    None (never raising) on missing creds or any gh failure.
  - A scheduled convergence-health run completes successfully after merge and files no prod_code_drift rec.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Both previously-unregistered sources are registered and accepted by the write-time validator
    command: bin/venv-python -c "from scripts.executor.rec_write_guidance import validate_source; validate_source('prod_code_drift'); validate_source('executor-hotfix'); print('REGISTERED')"
    expected: prints REGISTERED and exits 0
    fix_if: Raises ValueError "Unknown source" -- the canonical_id entry is missing or misspelled.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Differential rejected as unsound, not tautological: verified by hand in a real
      `git worktree add --detach <tmp> origin/main`, the check_spec's `bin/venv-python -c "..."`
      command never reaches validate_source() on that leg -- bin/venv-python resolves
      $REPO_ROOT from its own script path, finds no .venv in the bare worktree (never
      checked out, gitignored), and falls back to the container's system python3, which
      lacks pydantic (scripts.executor's own import chain requires it). The origin/main leg
      therefore fails with "ERROR: venv Python not found" before the real assertion ever
      runs -- an artifact of the differential gate's worktree lacking a venv, not proof the
      fix is caught. A test_selector rewrite (sys.executable-based, immune to this) would
      need a new dedicated pytest test with no natural existing home for
      scripts.executor.rec_write_guidance.validate_source; deferred rather than force-fit
      one in for this single assertion.
  - step: 2
    phase: pre-deploy
    action: >-
      The reachability oracle holds for both sensors, including the dispatch-deploy case that
      caused this incident and every fail-closed case
    command: bin/venv-python -m pytest tests/convergence_health/code_drift -q
    expected: >-
      all tests pass, including a case where the recorded sha postdates the latest source-touching
      commit and is reported FRESH, cases where null / unresolvable / empty report STALE, and an
      assertion that the generated acceptance string encodes the reachability oracle rather than a
      bare latest_sha grep
    fix_if: >-
      A recorded sha that postdates the latest source commit still reports stale -- the comparison
      is still equality, not reachability. A null or unresolvable sha reports fresh -- the
      fail-closed default is inverted. NOTE on this step's graduated row: it is a command_exit_zero
      exercising _is_fresh directly, NOT a test_selector naming a node from the pytest command
      above. Found when pr-validate reddened on the first attempt -- these tests drive
      detect_prod_code_drift, so their module imports boto3 at module scope (deliberately, so the
      fast tier's --collect-only pass sees the heavy-dep requirement and defers the file
      proactively). requirements-fast.txt, which pr-validate installs, excludes boto3, and the
      differential admission gate shells a raw pytest with none of pytest_diff's deferral logic, so
      a node_id row is unrunnable there by construction. The replacement was checked to be a real
      differential rather than a shape that merely satisfies the gate: _is_fresh does not exist on
      origin/main at all (AST-verified), so the revert leg's ImportError is genuine in any
      environment with a working interpreter. The local reproduction of that leg is muddied by the
      same bin/venv-python-in-a-bare-worktree artifact behind steps 1/4/5/6/7's waivers; CI
      installs pydantic on PATH, so it does not apply there.
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-drift-reachability-tests
  - step: 3
    phase: pre-deploy
    action: The registry guard rejects an unregistered source literal in a producer module
    command: bin/venv-python -m pytest tests/checks/ops_governance/test_check_source_registry.py -q
    expected: passes, including a producer-module case and an assertion that SCANNED_PATHS includes the portal files
    fix_if: The producer-module fixture passes the guard -- the scan set was not widened, only the regex was reviewed.
    hermetic: false
    graduation: graduate
    graduation_check_id: source-registry-guard-producer-scan
  - step: 4
    phase: pre-deploy
    action: The guard is ungated in the fast tier, so no scanned path can escape pre-merge review
    command: bin/venv-python -c "from scripts.checks.ops_governance._manifest import ENTRIES; e=[x for x in ENTRIES if x.name=='check_source_registry'][0]; assert e.pre is True, e; assert e.pre_globs is None, e.pre_globs; print('PRE_UNGATED_OK')"
    expected: prints PRE_UNGATED_OK and exits 0
    fix_if: >-
      AssertionError on pre_globs -- a glob list was added, which re-introduces the parity burden
      between pre_globs and SCANNED_PATHS and lets an edit to an uncovered scanned file skip the
      fast tier. Leave pre_globs None (see scripts/validate.py's _should_run_in_pre).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Same bin/venv-python-in-a-bare-worktree defect as drift-and-hotfix-sources-registered
      (verified by hand: `git worktree add --detach <tmp> origin/main` then running this
      exact command reports "ERROR: venv Python not found" before ever importing
      scripts.checks.ops_governance._manifest, since the worktree has no .venv and the
      container's fallback system python3 lacks pydantic). The origin/main "fail" the
      mechanical differential recorded is that environment artifact, not proof that
      pre_globs/pre are actually unset on origin/main -- un-graduatable via command_exit_zero
      as specified. A test_selector rewrite would need a new dedicated pytest test; tests/
      checks/ops_governance/test__manifest.py exists but this plan does not touch it, and
      adding one exclusively to satisfy graduation was judged not worth the added surface
      for a single two-field assertion.
  - step: 5
    phase: pre-deploy
    action: check_accounting is satisfied by the examined() declaration and the baseline shrink
    command: bin/venv-python -c "from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting; f=[]; validate_check_accounting(f); assert not f, f; print('ACCOUNTING_OK')"
    expected: prints ACCOUNTING_OK and exits 0
    fix_if: >-
      Failure naming check_source_registry -- either examined() was not added, or the name was not
      removed from config/check_accounting_baseline.yaml, or both.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same bin/venv-python-in-a-bare-worktree defect (verified by hand): the origin/main leg
      never reaches validate_check_accounting() -- it dies at venv resolution first, for the
      same reason as drift-and-hotfix-sources-registered. Un-graduatable via command_exit_zero
      as specified; a test_selector rewrite is possible against the existing
      tests/checks/hygiene/test_validate_check_accounting.py, but a new case there would
      re-litigate the general shrink-only/touch-it-fix-it ratchet that file already covers
      rather than adding coverage specific to this plan's fix, so it was deferred rather than
      added purely to satisfy graduation.
  - step: 6
    phase: pre-deploy
    action: Every gated file this plan touches is under the SLOC limit with no budget raise
    command: bin/venv-python -c "import yaml; from pathlib import Path; b=(yaml.safe_load(Path('config/sloc_budgets.yaml').read_text()) or {}).get('budgets') or {}; ps=['scripts/session/preflight.py','tests/convergence_health/code_drift/test_prod.py','tests/convergence_health/code_drift/test_ducklake.py','tests/convergence_health/code_drift/conftest.py','scripts/preflight/summary.py','scripts/preflight/ci_rca_signals.py','scripts/convergence_health/code_drift.py']; bad=[]; [bad.append((p,s)) for p in ps for s in [len([l for l in Path(p).read_text().splitlines() if l.strip() and not l.strip().startswith('#')])] if s>500 or p in b]; assert not bad, bad; print('SLOC_OK')"
    expected: prints SLOC_OK and exits 0
    fix_if: >-
      A path listed with its size means that file crossed 500 -- decompose it further. A path
      listed because it is in budgets means a raise was taken instead (Decision 128 forbids it here).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Same bin/venv-python-in-a-bare-worktree defect (verified by hand) blocks a
      command_exit_zero differential -- the origin/main leg dies at venv resolution before
      reading any file. Independent of that defect, this check is a poor graduation
      candidate on its own merits: it hardcodes THIS plan's specific touched-file list, which
      is a point-in-time fact rather than a durable property, and is entirely subsumed by the
      standing, repo-wide validate_sloc_limits gate (registered, runs on every file every
      tier) -- a dedicated registry row here would duplicate that gate's coverage without
      adding any incremental regression-catching capability once these files evolve further.
  - step: 7
    phase: pre-deploy
    action: >-
      The concern-split registration holds and code_drift.py still measures 100% coverage from its
      test package -- the regression the decomposition would otherwise cause
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_map.py -q && bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import map_source_to_test; t=map_source_to_test(Path('scripts/convergence_health/code_drift.py')); assert t is not None and t.is_dir(), t; print('MAPS_TO_PACKAGE', t)" && bin/venv-python -m pytest tests/convergence_health/code_drift --cov=scripts.convergence_health.code_drift --cov-report=term --cov-fail-under=100 -q
    expected: map tests pass, prints MAPS_TO_PACKAGE with a directory path, then coverage reports 100% and exits 0
    fix_if: >-
      Mapping returns a .py file -- the _CONCERN_SPLIT_TEST_PACKAGES registration is missing.
      Coverage below 100% -- cases were lost in the split; restore them rather than adding a
      coverage-baseline entry (validate_coverage_baseline_edits is a registered check, Decision 159).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same bin/venv-python-in-a-bare-worktree defect (verified by hand) blocks a
      command_exit_zero differential for the chained `pytest ... && bin/venv-python -c "..."
      && pytest ...` command -- the middle python -c segment dies at venv resolution in the
      origin/main leg before the chain can even reach the map_source_to_test assertion.
      Independent of that defect, the intended regression (code_drift.py's coverage dropping
      out of the roster) is already covered by the standing, non-hardcoded
      test_maps_code_drift_to_concern_split_package_directory test (test_selector-graduatable
      in principle, but this step's own declared command is the chained multi-part form, not
      that single assertion) -- graduating a second, narrower row for the same fact was
      judged redundant rather than incremental.
  - step: 8
    phase: pre-deploy
    action: >-
      The sensor-liveness check alerts on a green record with a dead sensor, and degrades to None
      on every failure path so preflight cannot crash
    command: bin/venv-python -m pytest tests/session/preflight/test_ci_rca_signals.py -q
    expected: >-
      passes, including a green-record-plus-failing-latest-run case that alerts, a
      green-record-plus-successful-run case that does not, and creds-missing / gh-failure /
      malformed-payload cases that each return None
    fix_if: >-
      The green-record-plus-dead-sensor case returns None -- the liveness check is still gated
      behind a record-is-red early return, which is the exact blind spot this closes. An
      AttributeError on the facade means the re-export in scripts/session/preflight.py is missing.
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-sensor-liveness-signal
  - step: 9
    phase: pre-deploy
    action: >-
      Preflight runs end to end with the relocated printing and the new alert wired in, AND the
      report-key freeze plus facade-export freeze are both updated to match
    command: bin/venv-python -m scripts.session.preflight && bin/venv-python -m pytest tests/test_session_preflight_decomposition.py tests/session/preflight/test_main_report.py -q
    expected: >-
      preflight exits 0 and writes logs/.preflight-report.json containing the new sensor-liveness
      key, then the freeze tests pass with FROZEN_REPORT_KEYS at 50
    fix_if: >-
      A frozen-count assertion failure means FROZEN_REPORT_KEYS (line 128) and/or
      test_report_key_set_matches_frozen_49 (line 381) were not bumped 49 -> 50 alongside the new
      key. An AttributeError on _format_preflight_summary means a relocated symbol in
