  - file: tests/session/preflight/test_main_branches.py
    action: Create
    purpose: >-
      Added post-plan, during VP step 15 execution (code-review finding, addressed): running
      scripts.validate to actual completion in this session (working around the separate
      rec-2489 coverage-subprocess-timeout-kills-its-own-parent defect via COVERAGE_CORE=sysmon,
