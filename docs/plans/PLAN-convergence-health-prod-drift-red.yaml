    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestKeylessPlanSkipsYamlParse -q
    expected: 3 passed
    fix_if: >-
      The keyless-plan spy still records a parse -- the pre-filter is not in the scan loop. If
      instead a plan that DOES carry the key stopped being honoured, the pre-filter is over-
      skipping: widen the match, never delete the complement assertions.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The differential gate reverts only the working tree to origin/main, so the revert leg would
      run this NEW test file against pre-fix source and fail for the intended reason -- but the
      registry row would then permanently pin a performance-mechanism assertion (a yaml.safe_load
      spy) as a graduated correctness gate. That is the wrong instrument: the mechanism is
      legitimately free to change if the N+1 is fixed a different way later (e.g. a CSafeLoader
