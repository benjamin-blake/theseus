schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: cli-persona-backend
intent: >-
  Record the operator's position that a free-tier end user may drive personas with the one individual Claude subscription
  they already pay for, through the unmodified Claude Code CLI as a subprocess behind the run_persona port on user-owned
  substrate, at outcome parity under one persona contract; fix the vocabulary that separates Claude (the model), Claude
  Code (the CLI product) and the Claude API (metered, API-key billed, always through LiteLLM, BYOK included); extend the
  post-MVP T4.27 item with the adapter's exit criteria; and land the small design-now constraints on the MVP persona
  contract (T4.10a), the Decision 199 telemetry contract and the T4.15 spike so the litellm harness never needs a retrofit.
  Governance, roadmap and contract encoding only -- no kernel, adapter, MCP-server or conformance-suite code lands.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-cli-persona-backend.yaml
phase: >-
  Platform T4 (executor). Design-now constraints on live T4.10a (persona contracts, MVP slice) and a desk-scored row on
  live T4.15 (the CD.27 substrate spike); extends deferred_post_mvp T4.27, the placeholder the merged
  PLAN-persona-event-origin-plans-in-git created for this plan. Start-gated on that plan's implementation landing.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    One new numbered Decision (206 at drafting; re-derived at STEP 0) titled 'User-owned CLI persona backend -- ... (amends
    Decision 164)', full drafted text in STEP 1, at or under 6,144 bytes (5,982 drafted), bare yaml envelope (amends [164],
    significance numbered_decision) and a monitored reversal stanza. A dated '> **Amended by Decision N (DATE):**' line on
    Decision 164 and dated '> **Update (DATE):**' lines on Decisions 116, 122, 173, 184 and 199 (STEP 2); no existing body
    line is edited (Decision 177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by scripts.decisions_index --write after the DECISIONS.md edit (never hand-edited, Decision 160/179).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    CD.28 discipline_points gains an appended clarification item (STEP 4); T4.10a c1/c2 re-grounded to persona capabilities
    and a turn plus wall-clock budget, c5-c7 added, intent annotation, related_decisions, effort S -> M and a progress_note
    line (STEP 5); T4.15 gains the desk-scored c11 and the Decision N citation (STEP 6); T4.27 (the sibling's placeholder)
    gains an authored intent, files, c5-c14, related_decisions and effort M -> L, its c1-c4 texts untouched (STEP 7); T4.17
    c5 gains the one-BYOK-key primary-only bracket (STEP 7b).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    Class A field_add of persona_backend (litellm | claude_cli) and billing_shape (metered_marginal | fixed_non_rollover_allowance)
    on model_call point rows, and a governance_note_add (semantic_break true) on cost_usd so a fixed-allowance row derives
    no dollar figure (STEP 8).
- file: docs/contracts/inference-provider.yaml
  action: Modify
  purpose: >-
    tier_model.note clarified (every AI API call On The Loop code makes goes through LiteLLM; claude_cli fills no role), a
    new axis-scoped vocabulary block (persona_backend, billing_shape, credential_holder, auth_method, and reserved meanings
    for claude, claude_code, claude_api, subscription, byok and ai_api_call) in the environment-taxonomy.yaml pattern, and
    the Class D amendment_log row (STEP 9).
- file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
  action: Modify
  purpose: >-
    New TestObservationsPersonaBackend class asserting the two model_call dimensions, their binding to the inference-provider
    vocabulary (cross-contract equality), and the fixed-allowance-means-no-dollars derivation (STEP 10); red before, green
    after. Runs under the already-graduated telemetry-event-journal-contract-shape shard, whose node_id is this whole module.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  Exactly one Decision titled 'User-owned CLI persona backend' exists, at or under 6,144 bytes, with a bare yaml envelope
  (amends [164], value numbered_decision), a monitored reversal stanza carrying terms-tightened, openai-terms-fail, parity-unheld,
  litellm-default-lost and sanctioned-lane, the verbatim legal-and-compliance evidence, all eight clauses, a citation of
  the event-origin Decision's number, no amends/supersedes edge outside its title, and no use of the retired Theseus name.
- >-
  Decision 164 carries a dated Amended-by line naming the new number and Decisions 116, 122, 173, 184 and 199 carry dated
  Update lines citing it (122 and 173 record the LiteLLM rule as clarified, not amended), every original body intact; Decision
  184 stays at or under 6,144 bytes; docs/decisions-index.json is fresh.
- >-
  T4.10a c1 names persona capabilities (never harness tool names), output_schema and a max_turns plus max_wall_clock_seconds
  budget with no dollars; c2 rejects harness tool names and dollar budgets; c5 (rendered prompt hash under a Decision 117
  boundary path), c6 (run_persona port, backend in {litellm, claude_cli}, codex_cli reserved) and c7 (one On The Loop MCP
  server) are open; c3, c4 and depends_on are unchanged.
- >-
  T4.15 carries the desk-scored c11 CLI-viability row, which prices Decision 164's collapse for claude_cli alone and selects
  nothing, and cites the new Decision; every token the t415 shard pins survives.
- >-
  T4.27 keeps its placeholder c1-c4 texts and every token its t425-t427-followon-items shard pins, stays deferred_post_mvp
  on T4.2 alone with no live dependent, carries c5-c14 (c11 and c13 blocked_by T4.24), and c1, c2 and c4 flip to met through
  closes_criteria at implement bookkeeping (the refs are added at STEP 0, once T4.27 exists on main -- a permitted
  implementing_plan_bookkeeping field edit).
- >-
  CD.28's discipline point 1 is verbatim and a new annotation item records the clarified reading; inference-provider.yaml
  carries the clarified tier_model.note, the vocabulary block and a new first amendment_log row.
- >-
  telemetry_observations.yaml carries persona_backend (NULL outside run_persona) and billing_shape (required on every model_call
  point row) as inline Class A fields whose values equal the inference-provider vocabulary, cost_usd derives NULL for a
  fixed_non_rollover_allowance row while any reported figure stays stored, and the new test is red before and green after.
- >-
  Both edited contracts stay within the 500 effective-line contracts-class limit, the named registry shards replay green,
  every added citation resolves to the minted numbers, and the full presubmit tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Full presubmit tier (Decision 163 pre-handoff run). Roadmap schema and graph (Decision 93 edges), decision-entry conformance,
    the per-entry size cap, supersession annotations, index freshness, the Class A category-2 and category-6 contract rules,
    the contracts-class 500 effective-line limit, the inference-provider evaluator and every graduated shard all gate here.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with the all-checks-passed summary.
  fix_if: >-
    validate_decisions_size FAIL on the new entry means tighten its prose, never raise the cap. validate_supersession_annotations
    FAIL means 164 lacks its Amended-by pointer or an extra amends phrase leaked into the body. A contract category-6 FAIL
    means a changed description/semantics lacks its paired amendment_log entry. A structural-size FAIL on a contract means
    compress the new field or vocabulary text, never raise the limit. A roadmap schema FAIL means a colon-space in an unquoted
    scalar -- quote it.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    THE CLI-BACKEND DECISION EXISTS, IS ENVELOPED, FITS THE CAP, CARRIES EVERY CLAUSE AND THE VERBATIM EVIDENCE, CITES THE
    EVENT-ORIGIN DECISION AND NEVER USES THE RETIRED NAME. Both entries are located by title so the assertion survives the
    numbering race; the event-origin leg is the start gate made executable. Red on origin/main (the entry is absent).
  command: &vp2cmd >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); ent=lambda k:
    [m for m in re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if k in m.group(2)]; eo=ent('keys
    on GitHub event origin'); assert len(eo)==1, ('start gate -- the event-origin Decision is not on this tree', len(eo));
    m=eo[0].group(1); es=ent('User-owned CLI persona backend'); assert len(es)==1, ('expected exactly one CLI-backend Decision',
    [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); fence='^'+chr(96)*3+'yaml'; assert re.search(fence+r'\s*\nnumber:
    '+n+r'\b', b, re.M), 'no bare yaml envelope carrying number '+n; assert 'value: numbered_decision' in b; assert chr(10)+'amends:
    [164]'+chr(10) in b, 'envelope amends list is not [164]'; sz=len(b.encode('utf-8')); assert sz<=6144, ('over the 6144-byte
    cap', sz); assert 'Theseus' not in b, 'retired name used (Decision 198)'; need=['Decision '+m+' clause 4','each end user
    must authenticate with their own ... Claude subscription plan credentials','Nor does it prevent an end user from signing
    in to the unmodified Claude Code binary with their own Claude subscription, including where a platform hosts Claude Code','developers
    may not collect, store, or intermediate Claude.ai credentials or session tokens','Advertised usage limits for Pro and
    Max plans assume ordinary, individual usage','never the Agent SDK with OAuth','capability set is the ceiling','web search,
    plugins, skills, memory','never shared or pooled','names never values','never reads, logs, stores or forwards','claude
    setup-token','never Lambda','hosted paid plane never','verdict personas','Clarified, not amended','every AI API call On
    The Loop code makes goes through LiteLLM','subscription-only','BYOK','litellm backend','realized at T4.2','role pair binds deployments On The Loop operates','primary only','inference-provider.yaml','Outcome
    parity','never trajectory parity','cost-per-verified-merge per (persona, backend)','OS sandbox','Decision 185','bypass-permissions
    mode','Concurrency 1','pauses the queue','retry storm','account risk','post-MVP (T4.27)','run_persona(contract, workspace,
    backend) -> (result, events)','{litellm, claude_cli}','codex_cli reserved','OpenAI-terms start gate','persona_backend and
    billing_shape','one On The Loop MCP server','only run_persona backend','Decision 184 clause 4','until T4.26','no arm leaves the set','Options considered','yaml reversal-conditions','terms-tightened','openai-terms-fail','parity-unheld','litellm-default-lost','sanctioned-lane'];
    miss=[p for p in need if p not in b]; assert not miss, ('CLI-backend Decision text missing', miss); edges=re.findall(r'(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)', b); assert edges==['164'], ('unexpected amends/supersedes edges', edges); print('DEC_CLI_BACKEND_OK',
    n, m, sz)"
  expected: Prints the marker, the minted number, the event-origin number and the entry's byte size (about 5,985).
  fix_if: >-
    A start-gate failure means the sibling's implementation has not landed -- STOP (blocked), never draft around it. A missing
    phrase means a clause was paraphrased -- restore STEP 1's text; over the cap means tighten prose; an extra edge means reword
    a body phrase so it no longer reads 'amends/supersedes Decision N'.
  hermetic: true
  graduation: graduate
  graduation_check_id: cli-persona-backend-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    DECISION 164 IS AMENDED, AND 116, 122, 173, 184 AND 199 UPDATED, BY APPENDED DATED LINES CITING THE NEW NUMBER; 122 and
    173 record a clarification, not an amendment; every original body survives (Decision 177), no appended line uses the
    retired name, and Decision 184 stays under the 6,144 cap. Red on origin/main (no line cites the new Decision).
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in
    re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'User-owned CLI persona backend'
    in m.group(2)]; assert len(es)==1, 'CLI-backend Decision absent'; n=es[0].group(1); blk=lambda k: re.search(r'^## Decision
    '+k+r':.*?(?=^## Decision |\Z)', t, re.M|re.S).group(0); amd={'164':['user-owned claude_cli','prices the collapse','every
