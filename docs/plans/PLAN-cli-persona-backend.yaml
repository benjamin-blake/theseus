    routing MUST','116':'Routine/non-agentic agents','173':'The tiers are ROLES','184':'Consumer-subscription OAuth is not
    a Theseus product credential','199':'Event journal'}; probs=[]; lines=lambda k,pat: [l for l in blk(k).splitlines() if
    re.match(pat, l) and 'Decision '+n in l]; A=r'> \*\*Amended by Decision '+n+r' \(\d{4}-\d{2}-\d{2}\):\*\*'; U=r'> \*\*Update
    \(\d{4}-\d{2}-\d{2}\):\*\*'; [probs.append((k,'no Amended-by line')) for k in amd if not lines(k, A)]; [probs.append((k,'no
