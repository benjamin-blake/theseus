schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-resolution-content-keyed"
intent: >-
  Re-key the two plan-verification gates off commit-message convention and onto an explicit,
  schema-validated declaration carried in the plan file itself, make every diff base in those checks
  push-aware, and adopt Decision 170's declaration channel. Contributes to the North Star by
  hardening the verification safety envelope that admits every other change.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-resolution-content-keyed.yaml
phase: >-
  Platform engineering -- verification-system correctness. Ad-hoc, user-initiated (soft-warn
  category user_explicit_out_of_scope), naming no carrier tier_item; mirrors the
  PLAN-vp-replay-hermetic-traps precedent. Closes the trigger-seam false negative Decision 132
  disclosed as a residual limitation, via the remedy that Decision's own reversal condition
  prescribes ("revisit the resolution mechanism ... rather than reverting the gate"). Prerequisite
  for a deferred turn-boundary checkpoint-commit hook, which is unsafe until this lands.
scope:
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add the optional `implementation_declared` boolean to PlanDocument. Optional and defaulted, so
      the entire existing corpus keeps validating unchanged (Decision 85 / the Decision 132 clause-1
      precedent) and no schema_version bump is owed; absence means "not yet implemented".
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      Add the content-based plan resolver and retire feat_commit_slugs (defined at :208) once no
      caller remains. Decision 148 makes this module the SOLE home for resolution helpers. The
      resolver EXTRACTS the flip-detection idiom that already ships in
      scripts/checks/roadmap/check_graduation_guard.py:62-116 rather than re-deriving it, and takes
      the diff base as an injectable parameter (push_context_base() is ROOT-pinned; see constraints).
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-key BOTH legs off commit subjects -- the implement leg at :174 and the plan-only leg's
      co-presence test at :150, inside _plan_only_pr_leg (136-165) -- adopt Decision 170's
      declaration with a SINGLE terminal call, and retire the 9 feat({slug}) prose references in its
      docstrings.
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: >-
      Same re-key at :186, the same single terminal declaration, and retire its 4 feat({slug}) prose
      references. ALSO make its two origin/main-anchored baselines push-aware --
      _default_baseline_registry_entries (:133-153) and _added_plan_paths (:58-69) -- or the re-key
      makes this check fail on the post-merge main run.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Remove validate_graduation_completeness and validate_vp_replay from the frozen baseline. What
      validate_check_accounting clause (d) COMPELS is the declaration itself once a baselined check's
      module is edited; the shrink is correct paydown rather than forced, but a baseline edit without
      adoption is separately refused by clause (a).
  - file: .claude/hooks/edit_scope_guard.py
    action: Modify
    purpose: >-
      Exempt the active plan's own path from the scope denial. The implement flow must now edit the
      plan file to set the declaration; without this, an activated guard would deny that edit
      fail-closed and every future plan would need a boilerplate self-reference in its own Scope.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Instruct the flow to set `implementation_declared: true` in the plan file AFTER the graduation
      bookkeeping walk writes its registry rows and BEFORE the mandatory full-validation run.
      Byte-neutral -- 6 bytes of headroom; compress the "Run the full gate locally first" preamble,
      with the Wait-for-CI paragraph as the named fallback target.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Correct BOTH commit-subject clauses at :334-337 -- the implement-PR resolution sentence AND the
      "a plan-only PR defers with a printed reason (no feat({slug}) commit)" clause, since this plan
      re-keys the plan-only leg too. ZERO bytes of headroom, so the replacement must be no longer
      than the text it replaces.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add an `[Amendment YYYY-MM-DD: ...]` line to Decision 132 and Decision 148, both of which name
      the retired commit-subject mechanism in their Decision text. Provenance for the clarification
      (Decision 151 clause 3(iii)) is EXPLICIT OPERATOR DIRECTION given during this plan's authoring;
      no new Decision is minted.
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Modify
    purpose: Add TestImplementationDeclared beside the existing sibling classes. 211 SLOC of a 500 limit.
  - file: tests/checks/_common/test_primitives.py
    action: Modify
    purpose: >-
      Add TestImplementationDeclaredResolver; remove the feat_commit_slugs assertions at :173 and
      :188, keeping the origin_main_reachable half of the :187 test.
  - file: tests/checks/verification/test_validate_vp_replay.py
    action: Modify
    purpose: >-
      Re-point both legs' tests at the resolver and add TestContentKeyedResolution, covering the
      mutation-style meta-test, the injected-base behaviour under GITHUB_EVENT_NAME=push, and the
      single harvested declaration. 340 SLOC of a 500 limit.
  - file: tests/checks/verification/test_validate_graduation_completeness.py
    action: Modify
    purpose: >-
      Same, plus a test pinning the push-aware registry baseline so the check does not fail on the
      post-merge main run. 372 SLOC of a 500 limit -- the thinnest margin in scope; measure
      mid-implementation and decompose rather than raise if it approaches the limit.
  - file: tests/test_edit_scope_guard.py
    action: Modify
    purpose: Add TestActivePlanSelfEditExempt. 313 SLOC of a 500 limit.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One row per graduated step (six). The file is at 5683 of its 6000 EFFECTIVE-line cap (Decision
      166 measures effective_lines, not raw lines) -- 317 lines, roughly 24 rows of headroom, so
      capacity does not constrain this plan. Every row must keep each line at or under 2315
      characters; longest_line is currently AT its ceiling.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    PlanDocument accepts an optional `implementation_declared` boolean; every plan in docs/plans/
    still validates with no edits and no schema_version bump.
  - >-
    scripts/checks/_common.py exposes a resolver returning the plans whose `implementation_declared`
    is true in the working tree and was not true at the diff base, and feat_commit_slugs has no
    caller anywhere under scripts/checks/.
  - >-
    The resolver accepts its diff base as an injectable parameter and does not call a ROOT-pinned
    helper internally, so a check running against an injected `root` reads its baseline from THAT
    repository. A test pins the behaviour under GITHUB_EVENT_NAME=push.
  - >-
    The resolver reads the plan with a raw YAML load, failing loudly only on an OSError or a YAML
    parse error in the WORKING TREE. A plan that parses but fails PlanDocument schema validation is
    NOT a resolver failure. A baseline that does not resolve is a legitimate "not declared at
    baseline", never an error.
  - >-
    validate_vp_replay resolves BOTH legs from the declaration, so a branch that declares an
    implementation has its hermetic pre-deploy steps replayed regardless of commit topology,
    including when every content commit is an automated checkpoint. The plan-only DEFER outcome and
    its printed reason survive, and an unreachable base DEFERs every plan.
  - >-
    validate_graduation_completeness resolves its implement-PR obligation the same way, AND both of
    its own diff baselines -- the registry baseline reader and the added-plan-paths reader -- derive
    from a push-aware base, so the check does not report an empty added-row set on the post-merge
    main run and fail every graduated step.
  - >-
    Each check makes exactly ONE terminal Decision 170 declaration per dispatch, composed from both
    legs' outcomes -- never one declaration per leg, since the declaration slot is last-write-wins
    and harvested once. A test asserts the harvested CheckOutcome is ENFORCED for an implement PR
    (examined(N, unit="declared_plans")), VACUOUS for a plan-only PR (examined(0)), and SKIPPED for
    an unreachable diff base.
  - >-
    Both diff-base consumers inside validate_graduation_completeness take their base as a parameter,
    and that check's own existing fixtures stay green under push context -- verified by running its
    suite with GITHUB_EVENT_NAME=push, not only on a feature branch where the helper returns None.
  - >-
    Both check names are removed from config/check_accounting_baseline.yaml and both modules carry
    the declaration, so validate_check_accounting clause (d) is satisfied.
  - >-
    Each check has a mutation-style meta-test proving it can still fail - a resolved plan with a
    failing verification step reddens the check rather than passing - and each of those tests is
    registered as a graduated verification-registry row.
  - >-
    Neither check reads commit subjects to decide applicability; no check anywhere fails a branch
    because of what its commit subjects do or do not say; and no feat({slug}) prose describing the
    retired mechanism survives in either module's docstrings.
  - >-
    BOTH commit-subject clauses at .claude/skills/planning/SKILL.md:334-337 are corrected, and that
    file is no larger than its 55788-byte budget.
  - >-
    Decision 132 and Decision 148 each carry an amendment line recording that the commit-subject
    resolution mechanism their text describes has been replaced.
  - >-
    edit_scope_guard allows an Edit/Write to the active plan's own path and still denies a file
    outside the active plan's Scope.
  - >-
    The implement flow sets the declaration after the graduation bookkeeping walk and before the
    mandatory full-validation run.
  - Every graduated step has a registry row admitted by the differential gate.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the content resolver -- a plan whose declaration flipped resolves; a plan already
      declared at the base does not re-resolve; a diff with no declaration resolves nothing; a plan
      ABSENT at the base resolves as newly-declared rather than erroring; an unreadable or
      YAML-malformed working-tree plan raises; a schema-invalid plan does NOT raise; the base is
      injected, not derived from a ROOT-pinned helper.
    command: bin/venv-python -m pytest tests/checks/_common/test_primitives.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      A resolver that returns empty on an unreadable working-tree plan reintroduces the
      absence-as-claim defect. One that ERRORS on a base-absent plan breaks this plan's own implement
      PR. One that calls push_context_base() internally reads the real repo's base inside a fixture
      repo under GITHUB_EVENT_NAME=push.
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-resolution-content-resolver
  - step: 2
    phase: pre-deploy
    action: >-
      Exercise validate_vp_replay's two re-keyed legs, the unreachable-base DEFER, the single
      terminal declaration, and the mutation-style meta-test proving the check still reddens on a
      genuinely failing VP step.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_vp_replay.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the meta-test passes while the injected failing step is present, the check has become
      incapable of failing and is now decorative -- the exact condition this plan is closing.
    hermetic: false
    graduation: graduate
    graduation_check_id: vp-replay-content-keyed-can-still-fail
  - step: 3
    phase: pre-deploy
    action: >-
      Same for validate_graduation_completeness, plus the push-aware registry baseline that keeps the
      check correct on the post-merge main run.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_graduation_completeness.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      As step 2. Additionally, if the registry baseline still anchors on origin/main, the check
      computes an empty added-row set on main and fails every graduated step in this plan.
    hermetic: false
    graduation: graduate
    graduation_check_id: graduation-completeness-content-keyed-can-still-fail
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the schema change is backwards compatible -- the new field validates, absence stays
      valid, and the ENTIRE existing plan corpus still passes unmodified.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/ -q && bin/venv-python -m scripts.roadmap.plan_document
    expected: "Tests pass, and every plan reports `validates against PlanDocument schema` with exit 0."
    fix_if: >-
      Any existing plan failing means the field was added as required rather than optional; make it
      optional rather than editing the corpus.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents is a registered check that already re-validates the whole corpus in both
      tiers, so corpus back-compatibility has a standing executable guard; a registry row would shadow it.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the core invariant AND the code-surface retirement structurally -- no module anywhere
      under scripts/checks/ references the commit-subject resolver, and no feat({slug}) prose
      describing the retired mechanism survives in either check module.
    command: test -d scripts/checks && test "$(grep -rl 'feat_commit_slugs' scripts/checks/ --include=*.py | wc -l)" = "0" && test "$(grep -c 'feat({slug})' scripts/checks/verification/validate_vp_replay.py)" = "0" && test "$(grep -c 'feat({slug})' scripts/checks/verification/validate_graduation_completeness.py)" = "0"
    expected: Exit 0. Today - 3 files reference the symbol, and the two modules carry 9 and 4 prose occurrences.
    fix_if: >-
      A non-zero symbol count means a consumer still keys on commit subjects, or a rewritten docstring
      names the retired symbol. A non-zero prose count means the module still documents the retired
      mechanism to its next reader.
    hermetic: true
    graduation: graduate
    graduation_check_id: no-commit-subject-plan-resolution
  - step: 6
    phase: pre-deploy
    action: >-
      Prove Decision 170 adoption landed on both modules and the frozen baseline was shrunk to match.
    command: test "$(grep -c 'examined(' scripts/checks/verification/validate_vp_replay.py)" -ge "1" && test "$(grep -c 'examined(' scripts/checks/verification/validate_graduation_completeness.py)" -ge "1" && test "$(grep -c 'validate_vp_replay\|validate_graduation_completeness' config/check_accounting_baseline.yaml)" = "0"
    expected: Exit 0 (both modules declare; neither name remains baselined -- 0/0 and 2 today).
    fix_if: >-
      Editing a baselined check's module without adopting the declaration fails validate_check_accounting
      clause (d) in both tiers. Follow check_graduation_guard.py (multi-exit) rather than
      validate_licence_consistency.py (single-exit) as the precedent -- these checks have several exits.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_accounting AST-scans every registered check's defining module for exactly this
      declaration and enforces the baseline rules itself, in both tiers, and it FAILS -- unlike the
      vacuity status, which Decision 170 explicitly does not gate. This step is a plan-time pre-check
      of a one-time adoption that a live check already polices.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove both CHECK modules derive their diff bases from a push-aware helper rather than a
      hardcoded origin/main, so neither silently no-ops on the post-merge main run. Both conjuncts
      must name a check module -- scripts/checks/_common.py DEFINES push_context_base (4 occurrences
      today, at :40, :92, :101, :139), so asserting its presence there discriminates nothing and
      would freeze a vacuous conjunct into a graduated registry row.
    command: test "$(grep -c 'push_context_base' scripts/checks/verification/validate_graduation_completeness.py)" -ge "1" && test "$(grep -c 'push_context_base' scripts/checks/verification/validate_vp_replay.py)" -ge "1"
    expected: Exit 0 (0 and 0 occurrences in the two check modules today).
    fix_if: >-
      A zero count means a baseline still anchors on origin/main. On the post-merge main run
      origin/main IS HEAD, so every such baseline equals the current tree - the resolver resolves
      nothing and the registry reader returns no added rows (Decision 159's diff-base class fix).
    hermetic: true
    graduation: graduate
    graduation_check_id: push-aware-diff-base-in-verification-checks
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the implement flow actually sets the declaration -- if this instruction is ever lost,
      implement sessions silently stop declaring and both gates go quietly vacuous.
    command: test "$(grep -c 'implementation_declared' .claude/skills/implement/SKILL.md)" -ge "1" && test "$(wc -c < .claude/skills/implement/SKILL.md)" -le "48202"
    expected: >-
      Exit 0 (the flow names the field -- 0 occurrences today -- and the file is within its
      48202-byte budget, which has only 6 bytes of headroom).
    fix_if: >-
      A zero count means nothing in the documented flow sets the declaration, so every future
      implement PR resolves nothing and verifies nothing.
    hermetic: true
    graduation: graduate
    graduation_check_id: implement-flow-sets-declaration
  - step: 9
    phase: pre-deploy
    action: >-
      Sweep the instruction surface for BOTH retired commit-subject clauses, and confirm the byte
      budget still holds on a zero-headroom surface.
    command: test "$(grep -c 'feat({slug})' .claude/skills/planning/SKILL.md)" = "0" && test "$(wc -c < .claude/skills/planning/SKILL.md)" -le "55788"
    expected: Exit 0 (both stale clauses gone -- 2 occurrences today -- and the file within budget).
    fix_if: >-
      A non-zero count means one of the two clauses survives; the plan-only clause describes the leg
      this plan also re-keys, so sweeping only the implement-PR sentence leaves the surface half
      stale. An over-budget size means the replacement was longer than the text removed.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time correction of two specific sentences. Once removed they cannot regress without
      someone re-authoring them, and a registry row pinned to this phrase would go red on any future
      legitimate rewording of that paragraph.
  - step: 10
    phase: pre-deploy
    action: >-
      Exercise the scope-guard exemption -- the active plan's own path is allowed, a file outside the
      active plan's Scope is still denied, and the no-active-plan case still allows everything.
    command: bin/venv-python -m pytest tests/test_edit_scope_guard.py -q
    expected: "All tests pass; output reports `passed` and no failures."
    fix_if: >-
      If the exemption widens beyond the single active plan path, the guard stops being fail-closed
      for the case it exists to cover.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The hook is inert until a plan context is declared (nothing sets CLAUDE_ACTIVE_PLAN and no
      .claude/active_plan marker exists), so a standing registry row would guard a dormant code path;
      its mirror test file is the appropriate guard until activation lands.
  - step: 11
    phase: pre-deploy
    action: >-
      Prove the two Decision entries describing the retired mechanism carry their amendment lines.
    command: test "$(grep -c 'implementation_declared' docs/DECISIONS.md)" -ge "2"
    expected: Exit 0 (both Decision 132 and Decision 148 reference the replacement; 0 today).
    fix_if: >-
      A count below 2 means one entry still describes commit-subject resolution with no amendment.
      Provenance is explicit operator direction recorded in context; mint no new Decision.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time documentation amendment on two specific entries. The amendment convention is
      explicitly enforcement-free (Decision 151 / Decision 146 operator-disposed stance), so a
      registry row here would unilaterally impose enforcement the convention deliberately declines.
  - step: 12
    phase: pre-deploy
    action: Run the full local gate before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with a final `Validation Summary (scope: all)` PASS and no failures."
    fix_if: >-
      Any failure blocks handoff; fix and re-run the full tier from the start. Watch for
      validate_check_accounting (clause (d) on both modified checks), validate_prose_limits on the
      two zero-or-near-zero-headroom skill surfaces, validate_structural_size_limits on the registry's
      effective-line and longest-line ceilings, and validate_graduation_completeness, which this plan
      modifies and must satisfy against its own change.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A command_exit_zero row for the full validator is tautological under scripts/validate.py's own
      _VALIDATE_DEPTH and PYTEST_CURRENT_TEST short-circuit guards -- it exits 0 on both differential
      legs, so the admission gate rejects it as non-discriminating. Established repo disposition.
test_obligations:
  - source: scripts/roadmap/plan_document.py
    behavior: >-
      The optional implementation_declared field validates when present, absence stays valid, and no
      existing plan breaks.
    verification_step: 4
    test_selector: tests/roadmap/plan_document/test_optional_fields.py::TestImplementationDeclared
    red_green_expectation: red before (the field is rejected by extra=forbid), green after.
  - source: scripts/checks/_common.py
    behavior: >-
      The resolver detects a declaration flip against an INJECTED base, treats a base-absent plan as
      newly-declared, fails loudly on an unreadable or YAML-malformed working-tree plan, and does not
      fail on a schema-invalid one.
    verification_step: 1
    test_selector: tests/checks/_common/test_primitives.py::TestImplementationDeclaredResolver
    red_green_expectation: red before (the resolver does not exist), green after.
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: >-
      Both legs resolve from the declaration, an unreachable base DEFERs, exactly one declaration is
      harvested per dispatch, and the check still reddens on a genuinely failing VP step.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_vp_replay.py::TestContentKeyedResolution
    red_green_expectation: >-
      red before (a checkpoint-only branch with a declaration resolves nothing and no-ops), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: >-
      Same content-keyed resolution and single declaration, plus a push-aware registry baseline that
      does not return an empty added-row set on the post-merge main run.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_graduation_completeness.py::TestContentKeyedResolution
    red_green_expectation: >-
      red before (a checkpoint-only branch with a declaration resolves nothing and no-ops), green after.
  - source: config/check_accounting_baseline.yaml
    behavior: Neither modified check remains frozen in the baseline once both declare.
    verification_step: 6
    command: test "$(grep -c 'validate_vp_replay\|validate_graduation_completeness' config/check_accounting_baseline.yaml)" = "0"
    red_green_expectation: red before (2 occurrences), green after.
  - source: .claude/hooks/edit_scope_guard.py
    behavior: The active plan's own path is allowed; out-of-scope files are still denied fail-closed.
    verification_step: 10
    test_selector: tests/test_edit_scope_guard.py::TestActivePlanSelfEditExempt
    red_green_expectation: red before (the active plan path is denied like any other), green after.
  - source: .claude/skills/implement/SKILL.md
    behavior: >-
      The documented flow sets implementation_declared after the graduation bookkeeping walk and
      before the mandatory full-validation run.
    verification_step: 8
    command: test "$(grep -c 'implementation_declared' .claude/skills/implement/SKILL.md)" -ge "1"
    red_green_expectation: red before (0 occurrences), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: >-
      Neither commit-subject clause survives, and the file stays within its zero-headroom byte budget.
    verification_step: 9
    command: test "$(grep -c 'feat({slug})' .claude/skills/planning/SKILL.md)" = "0"
    red_green_expectation: red before (2 occurrences at :334-337), green after.
  - source: docs/DECISIONS.md
    behavior: Decisions 132 and 148 each carry an amendment line naming the replacement mechanism.
    verification_step: 11
    command: test "$(grep -c 'implementation_declared' docs/DECISIONS.md)" -ge "2"
    red_green_expectation: red before (0 occurrences), green after.
  - source: config/agent/verification_registry/registry.yaml
    behavior: Every graduated step has a row that survives the differential admission gate.
    verification_step: 12
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      red before (validate_graduation_completeness fails a graduate step with no new-in-diff row),
      green after.
constraints:
  - No rescue agents or workaround loops (Decision 55). On an unrecoverable failure, stop and RCA.
  - >-
    Commit-message shape must remain UNVERIFIED by this repo. This plan removes a commit-subject
    dependency; it must not introduce a replacement obligation on commit grammar anywhere.
  - >-
    REUSE, do not re-derive. scripts/checks/roadmap/check_graduation_guard.py:62-116 already ships the
    complete primitive this plan needs - a push-aware base (`push_context_base() or "origin/main"` at
    :62), `git show {base}:{path}` with returncode != 0 treated as an EMPTY baseline (:105), and an
    edge-triggered boolean False->True flip detector (:111-116), alongside Decision 170 declarations.
    Extract or mirror it in _common.py; do not write a second implementation. An earlier draft of this
    plan called the combining primitive "genuinely NEW" -- that was wrong.
  - >-
    The diff base must be an INJECTABLE parameter of EVERY root-parameterised consumer -- the new
    resolver AND validate_graduation_completeness._default_baseline_registry_entries (:133-153) AND
    _added_plan_paths (:58-69) -- defaulted at the check's call site, never derived inside a function
    that receives a `root`. push_context_base() takes no root and runs every git subprocess with
    cwd=ROOT (_common.py:40-89), while both checks accept an injected `root` and every test fixture
    uses a throwaway repo. A function that calls it internally derives a base from the REAL repository
    and then reads it inside the FIXTURE repository. This passes locally and in PR CI (the helper
    returns None, falling back to origin/main) and passes this plan's own VP step 12 (which runs on a
    claude/ branch), but on the post-merge MAIN run the branch==main and merge-base conjuncts hold, a
    real-repo SHA is returned, and `git show <sha>:...` / `git diff <sha>` exit 128 inside the
    fixture -- so _added_plan_paths returns set() and _default_baseline_registry_entries returns [].
