constraints:
- The INSTALL_TERRAFORM gate belongs in bin/setup-cloud-env.sh, NEVER in the shared delegate. INSTALL_TERRAFORM
  appears ZERO times in .github/workflows/, so a guard in the shared unit no-ops the action at all four
  apply call sites (terraform-apply-sandbox apply-sandbox + speculative-plan, reconcile apply-reconcile
  + gated-apply-reconcile) and takes the Decision 126 heal verb offline.
- '::add-mask:: is a GitHub-runner sentinel, not redaction. Gate its emission on $GITHUB_ACTIONS or the
  local ADMIN shell prints account_id and both ExternalIds into the session transcript, breaching the
  contract''s never_paste clause and Decision 101.'
- 'Test NAMING CONTRACT, load-bearing: every -k token the VP selects (install_terraform_unset, silent_on_both_streams,
  mode_600, first_equals_split, fail_closed_on_empty, masks_under_github_actions, preexisting_file_preserved,
  distinct_failure_messages, temp_file_beside_destination, admin_branch_calls_shared_delegate, failed_fetch_does_not_abort,
  action_wiring, drift_wiring, baseline_retired, contract_repoint) MUST appear VERBATIM in a test METHOD
  name, inside the CamelCase class its test_obligations row names. Measured 2026-09-21 on pytest 9.1.1:
  -k WorkflowRatchetLiveSurface collects 4 of 27 while -k workflow_ratchet_live_surface collects 0 --
  -k substring matching is case- AND separator-sensitive, so declaring the classes without the snake_case
  method tokens makes VP steps 6, 7 and 8 exit 5 under an otherwise-conforming implementation.'
- The adapter's ONLY effective line is the delegate call. Measured -- adding set -euo pipefail makes _delegated_script
  return None, re-ratcheting the body under R3. Comments are stripped and free.
- The delegate takes NO argv -- _DELEGATE_LINE_RE is fully anchored and admits no arguments. It also stays
  profile-free -- all four CI call sites use OIDC ambient credentials, so hardcoding --profile agent_platform_admin
  would break them. PlatformDev AccessDenied is the intended fail-closed DEP-13 outcome; document it in
  the delegate header and pin it in the test.
- Preserve action.yml's working-directory input and wiring -- the delegate resolves the tfvars path relative
  to cwd, so dropping it silently misplaces the file on the apply path. No call site currently overrides
  the '.' default; bin/setup-cloud-env.sh cds to REPO_ROOT at line 107.
- Write via temp file + mv, with mktemp creating the temp file INSIDE terraform/personal/ (e.g. mktemp
  "${DEST}.XXXXXX"), never in $TMPDIR -- a cross-filesystem mv is copy+unlink, not an atomic rename, which
  would reopen the very truncation window this constraint closes. aws ... > file truncates BEFORE aws
  runs -- measured, a failed fetch destroys a pre-existing tfvars (0 bytes) while the atomic form preserves
  it byte-identical. Harmless in CI (fresh clone) but the ADMIN bootstrap is explicitly re-runnable, and
  warn-and-continue would mask the loss behind a non-fatal log line (Decision 55). The mirror-sync precedent
  at bin/setup-cloud-env.sh:211 is warn-and-continue but NON-destructive; it is not precedent for a destructive
  one. The WARNING must state the pre-existing file was preserved.
- Test fixtures use non-numeric placeholders -- a 12-digit account_id fixture trips this plan's own Decision
  101 leak guard (measured). Masking needs a non-empty value, not a realistic one.
- The delegate must emit a DISTINCT, greppable stderr message per failure mode (fetch failed / would-be-empty
  secret / write failed). Consolidation collapses three separately-named Actions steps into one, so without
  distinct messages a fetch failure, an empty secret and a write failure all present as one indistinguishable
  red step -- the same categorical-distinction invariant terraform-drift.yml:102-111 states for a failed
  assume.
- Amend the else-branch log at bin/setup-cloud-env.sh:214, which currently names only the mirror sync
  as skipped -- it now also skips the tfvars fetch.
- No rescue agents or workaround loops (Decision 55).
