    waiver_reason: A budget decrease; validate_structural_size_limits enforces it and decreases are unrestricted.
  - source: docs/contracts/terraform-cc-web-operations.yaml
    behavior: Approved step sentence present; referenced path exists.
    verification_step: 4
    command: bin/venv-python -m scripts.validate
    waiver_reason: Prose plus a referenced path; validate_terraform_cc_web_operations checks the path exists.
constraints:
  - No guard, reviewer, digest, IAM, Terraform, authority-budget, environment-taxonomy or Decision change (Decision 77, 92 pt 1).
  - The speculative-plan job stays out of required_status_checks (Decision 83 / CD.20); terraform/github is untouched.
  - PR-visible output is names only - addresses, counts, fixed tokens; no value, instance key or diagnostic text (Decision 238 cl.4, 101).
  - The script stays stdlib-only with no repository import (Decision 238 cl.3 trusted-job fit).
  - Never raise a size budget or run-body ceiling (Decision 128, 166); never skip or relax a test (Decision 55).
  - The canary PR is never merged and never applied; it touches no IAM role trust and adds no new role.
  - Contract wording is exactly the approved text (always-ask item); any change needs Benjamin's word.
  - No rescue agents or workaround loops (Decision 55).
