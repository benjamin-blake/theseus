    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_plan_time_policy_check_wiring.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: The wiring check is registered in --pre and full.
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_plan_time_policy_check_wiring.py
    red_green_expectation: red before (the mirror test's registration case finds no Entry), green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check has a taxonomy row.
    verification_step: 4
    command: bin/venv-python -m scripts.validate
    red_green_expectation: red before (validate_ci_rca_taxonomy fails on an unclassified registered check), green after.
  - source: .github/workflows/terraform-apply-sandbox.yml
    behavior: Check step placement and if:; predicted-guard body maps exit codes exactly as before.
    verification_step: 1
    test_selector: tests/test_plan_time_policy_check_workflow.py
    red_green_expectation: red before (no check step; the body test is new), green after.
  - source: config/composite_action_body_baseline.yaml
    behavior: New body registered; pred_guard ceiling lowered.
    verification_step: 3
    test_selector: tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py
