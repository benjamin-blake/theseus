rollback: 'Flip state back to DISABLED through the same governed terraform PR path and merge -- never a console
  toggle, never a local apply (Decision 126). THE CONTAINMENT PR IS TWO EDITS, BY DESIGN: the state literal in the
  .tf (with the description attribute and comment block reworded to match), and the single _INTENDED_GC_OPS_STATE
  constant in tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py. Nothing else moves -- the test selector
  and the registry shard are named for the INVARIANT, not the current value, so they survive the flip with no test
  surgery, no git mv and no re-keyed check_id. THIS IS WHY THE PARAMETERISATION EXISTS. A guard that hardcoded ENABLED
  would block its own containment path: measured, derive_affected_tests([(''M'',''terraform/personal/ducklake_maintenance.tf'')])
  selects this test file via the data_edge channel, and --pre is the authoritative pre-merge gate when run by PR
  CI (Decision 73), so a .tf-only rollback could not go green -- and merging it regardless reddens full-tier on
  main, files a source=ci_rca priority=critical rec, and then FORBIDS manual patching until /plan reviews it, compounding
  the incident instead of containing it. The rule is stateless: disabling stops future firings and leaves the catalog
  exactly as the last completed pass left it. Nothing in steps 1-12 is destructive (a dry_run writes nothing and
  issues no delete), so a rollback before the first Sunday firing is a pure no-op on production data. IF A PASS
  HAS ALREADY RUN AND BREACHED: disabling is containment, not the fix -- RCA before re-enabling, and never by widening
  a guard bound. DATA RECOVERY IS POSSIBLE BUT UNREHEARSED. Because the bucket is versioned with no lifecycle rule
  (measured 2026-09-17), an over-reclaim is reversible: each deleted object retains its bytes as a noncurrent version
  behind a zero-byte delete marker, and removing the marker by versionId restores it. The mechanism is `aws s3api
  list-object-versions` filtered to DeleteMarkers under the affected prefix, then `aws s3api delete-object --version-id
  <marker-version-id>` per marker, run under agent_platform_admin (PlatformDev cannot). This path has NEVER been
  exercised -- rec-3907 carries the rehearsal -- so treat it as a documented starting point, not a proven procedure,
  and rehearse on a scratch prefix before running it against production.'
