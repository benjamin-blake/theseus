  backlog; raising a bound so a gate passes is the Decision 55 prohibition and would require a Decision superseding
  CD.33 / Decision 188. Step 5 pins both executably.
- No rescue agents or workaround loops (Decision 55).
- 'Do NOT modify shipped guard code: src/common/ducklake_maintenance_ops.py and src/common/ducklake_gc_ops.py are
  OUT OF SCOPE. This plan takes a reading and flips a schedule; it changes no GC behaviour. The runtime backup precondition
  that would change gc_ops is rec-3909''s, deliberately deferred.'
- Do NOT widen PlatformDev's invoke grant to remove the operator step. Maintenance stays break-glass on PlatformAdmin
  (Decision 143 blast radius); the fixture mechanism is the sanctioned answer. rec-3908 carries the structured-log
  emission that would retire the relay properly.
- No local terraform invocation of any kind (Decision 119, terraform/CLAUDE.md) -- fmt included. This container
  has no terraform binary. CI's terraform-validate check owns fmt/validate; the speculative-plan job owns the plan.
- The gate precedes the merge. Steps 11 and 12 must be green BEFORE the PR merges, because the flip auto-applies
  at merge.
- T2.18 c2 stays `open`; closes_criteria is empty. /plan and /implement never infer a criterion flip (tier-item-lifecycle.yaml
