slug: gc-ops-baseline-gate-and-schedule-enable
intent: Take the gc_ops pre-enablement baseline gate against the post-#1203 partial-drain design and flip the production
  gc_ops EventBridge rule from DISABLED to ENABLED, starting the weekly destructive-GC cadence whose N=9-cycle record
  rec-3870 will later adjudicate T2.18 c2 against. This plan starts that clock; it does not close c2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml
phase: T2.18
scope:
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: TWO edit sites, not one. (a) The state literal at :328, DISABLED -> ENABLED. (b) The `description` ATTRIBUTE
    at :326, which carries 'Created DISABLED -- enabled only after the baseline gate + CD deploy both clear'. That
    is an applied resource attribute, not a comment, so it ships to AWS and would describe the rule as disabled
    while it runs. The comment block above :324 is a third site and is stale the same way -- it instructs a future
    session to enable after VP14/VP15. Rewrite all three to record the gate that cleared. Leave the cron, the target
    input, and the lambda permission untouched.
- file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
  action: Modify
  purpose: 'Three test changes. (a) Replace test_gc_ops_rule_is_created_disabled with test_gc_ops_rule_state_matches_declared_intent,
    PARAMETERISED on a single module constant _INTENDED_GC_OPS_STATE = ''ENABLED''. It asserts state == _INTENDED_GC_OPS_STATE
    AND that the OPPOSING literal appears nowhere in the brace-balanced resource block. This is exactly as strong
    as a hardcoded pair of assertions and just as red-before (neither the constant nor the selector exists on the
    un-implemented tree), but the CLAIM SURVIVES A FLIP: a rollback becomes one .tf edit plus one constant, with
    no test surgery, no git mv and no re-keyed shard. Naming the test and the shard for the INVARIANT rather than
    the current value is what makes verification-registry.yaml''s check_id immutability hold across a state flip
    -- minting a third check_id on every flip would turn a reversible operational state into permanent registry
    sediment, inverting the purpose of that rule, which exists to keep identity stable across IMPLEMENTATION changes
    -- the second half is what brings the `description` ATTRIBUTE under a STANDING guard, since step 2''s block
    negative is waived and would stop guarding anything after merge. The description ships to AWS, so an unguarded
    regression there would describe the rule as disabled while it runs. This is a claim-flip, not a relaxation --
    the assertion is equally strong in the new direction, and the differential-admission run on the new shard is
    the proof. Deleting rather than re-authoring would leave a silent regression to DISABLED unguarded. (b) Add
    test_dr_dump_precedes_the_gc_ops_window, reading ducklake_catalog_dr.tf (read-only, not modified) to pin that
    the catalog backup cron precedes the gc_ops cron on the same day. (c) Add TestGcOpsEnablementBaseline asserting
    the committed dry-run fixture licenses the enablement. File is 259 of 500 SLOC; ~60 added lines keep it unregistered
    and well under budget, so Decision 128 decomposition is not engaged. Also refresh the MODULE DOCSTRING at :13-16,
    which states the gc_ops rule ''ships DISABLED'' and goes stale on merge.'
- file: tests/fixtures/gc_ops_dryrun_baseline.json
  action: Create
  purpose: 'The operator''s gc_ops dry_run response envelope, committed as evidence. This is the mechanism that
    removes human memory from the critical path: instead of an operator pasting JSON into a terminal that an agent
    then trusts, the reading is version-controlled with provenance and a test adjudicates it, so FORGETTING TO TAKE
    THE READING FAILS CI rather than stalling silently. Body is scalars plus table names only -- no paths, no bucket
    name, no account id -- and this repo already publishes the same class of figures in PLAN-production-gc-and-storage-stability
    and rec-3767, so Decision 101''s boundary is satisfied and asserted by step 8 rather than assumed.'
- file: config/agent/verification_registry/entries/gc-ops-rule-state-and-no-lakehouse-lifecycle.yaml
  action: Create
  purpose: 'Successor shard carrying the declared-intent state claim, the new DR-ordering assertion, and ALL FOUR
    unchanged sibling selectors (no-lakehouse-lifecycle, maintenance-IAM-not-widened, liveness-breaching-on-missing,
    cadence-minutes-disjoint). Carrying all four forward is load-bearing: a retired shard whose surviving properties
    are not re-homed is a silently lapsed pin. A NEW check_id is required rather than a selector swap in place --
    verification-registry.yaml''s check_id semantics make identity immutable across implementation changes, and
    the retained-id precedent in its amendment_log is explicitly scoped to claim-PRESERVING re-authoring, which
    an inversion is not.'
- file: config/agent/verification_registry/entries/gc-ops-enablement-baseline-fixture-gate.yaml
  action: Create
  purpose: 'Shard graduating the fixture gate. Its standing value is tamper-evidence on the evidence that licensed
    a destructive production schedule: once merged, the fixture is immutable, so any later edit that weakens what
    the baseline claimed reddens CI.'
- file: config/agent/verification_registry/entries/deprecated/gc-ops-rule-disabled-and-no-lakehouse-lifecycle.yaml
  action: Create
  purpose: 'git mv of the superseded shard into the loader-excluded retirement subtree (Decision 176: retirement
    is a git mv to entries/deprecated/, no status column, no version key). Its check_spec names a pytest selector
    this plan deletes, so leaving it live converts a standing green check into a collection error.'
- file: config/agent/verification_registry/entries/gc-ops-rule-disabled-and-no-lakehouse-lifecycle.yaml
  action: Delete
  purpose: The git mv's source half -- the shard no longer resolves at the live entries/ path.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: 'Repoint the THREE present-tense ''created DISABLED'' sites -- :25 (contract.description), :180 (verbs.gc_ops.payload_schema_ref,
    whose future-tense ''enabled only after the baseline gate clears'' is the stalest) and :286 (an audit_invariants
    entry still asserting the rule is created DISABLED while it runs destructively) -- to record the cleared gate
    and the live cadence. DO NOT TOUCH :321. It sits inside the amendment_log entry dated 2026-09-15 and truthfully
    records what the #1193 amendment did; rewriting it to describe today''s state would falsify an append-only audit
    record, and no validator guards that (check_amendment_log_for_class_d only asserts a new entry exists). Leave
    that entry byte-identical -- step 6 asserts it survives. The transition is recorded by APPENDING a new entry
    at the TAIL (this file''s log is ascending, unlike most contracts here) carrying semantic_break and change_class,
    as all four existing entries do. CRITICALLY, DO NOT SIMPLY DELETE THE NORMATIVE CLAUSE AT :180: it is the ONLY
    present-tense standing requirement anywhere that a baseline must precede an enable, so a purely past-tense replacement
    would mean that after a rollback to DISABLED -- this plan''s own rollback path -- nothing durable re-gates a
    re-enable. Retain a present-tense re-gate clause alongside the past-tense record. File is 336 of 500 effective
    lines, so size governance is not engaged.'
- file: docs/runbooks/ducklake-catalog-operations.md
  action: Modify
  purpose: 'Four additions plus one correction sweep. (a) The gc_ops dry_run operator recipe, which does not exist
    today -- the manual-invoke section carries only the smoke-scoped action=gc -- resolving data_path via `terraform
    output -raw`, never a literal bucket name. (b) The DELETE-MARKER RECOVERY recipe, so the rollback path for an
    over-reclaim is written down before it is needed rather than invented under pressure. (c) The live cadence,
    and the fact that the liveness alarm sits in ALARM until the first pass emits. (d) CORRECT ALL FIVE DEAD RECIPES
    IN THE `### Manual invoke runbook` SECTION (:290-328), every one of which names --profile agent_platform and
    cannot work: three `lambda invoke --function-name agent-platform-ducklake-maintenance` (:294, :302, :310) and
    one `lambda get-function-concurrency` (:318) -- PlatformDev''s only lambda grant is DuckLakeInvokeRuntime, scoped
    to the writer and reader ARNs, and it holds no lambda:Get* at all -- plus one `events list-rules` (:324), where
    PlatformDev holds zero events:* grants AND events:ListRules is granted to no identity anywhere in terraform/.
    Repoint the four lambda recipes to agent_platform_admin and replace list-rules with `events describe-rule --name
    <exact-rule-name> --profile agent_platform_admin`, which the 2026-09-17 probe exercised successfully. THIS IS
    NOT OPTIONAL TIDYING: this plan ADDS a gc_ops recipe under agent_platform_admin into that same fence, so leaving
    the neighbours naming a profile that cannot invoke maintenance would make the section self-contradictory about
    which identity invokes it, at the exact moment the section is edited -- and AC8 states maintenance stays break-glass
    on PlatformAdmin. WHY :393 AND :442 ARE NOT CORRECTED HERE: they carry the same defect but sit in Section 4
    (catalog-DR), which this plan does not otherwise touch, so leaving them is SINGLE-CONCERN DIFF HYGIENE, not
    a scope-boundary requirement. implement-scope-boundary.yaml''s LOCATION invariant is FILE-level -- every touched
    path must be in the plan''s scope[].file union -- and this runbook is already a scope row, so Decision 59 never
    constrained the choice either way. rec-3910 owns them, and owns the coverage verifier that would stop the whole
    class.'
