schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: gc-ops-baseline-gate-and-schedule-enable
intent: Take the gc_ops pre-enablement baseline gate against the post-#1203 partial-drain design and flip the production
  gc_ops EventBridge rule from DISABLED to ENABLED, starting the weekly destructive-GC cadence whose N=9-cycle record
  rec-3870 will later adjudicate T2.18 c2 against. This plan starts that clock; it does not close c2.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml
phase: T2.18
scope:
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: TWO edit sites, not one. (a) The state literal at :328, DISABLED -> ENABLED. (b) The `description` ATTRIBUTE
    at :326, which carries 'Created DISABLED -- enabled only after the baseline gate + CD deploy both clear'. That
    is an applied resource attribute, not a comment, so it ships to AWS and would describe the rule as disabled
    while it runs. The comment block above :324 is a third site and is stale the same way -- it instructs a future
    session to enable after VP14/VP15. Rewrite all three to record the gate that cleared. Leave the cron, the target
    input, and the lambda permission untouched.
- file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
  action: Modify
  purpose: 'Three test changes. (a) Replace test_gc_ops_rule_is_created_disabled with test_gc_ops_rule_is_enabled:
    the claim INVERTS, so the flip reddens the existing test by construction. This is a claim-flip, not a relaxation
    -- the assertion is equally strong in the new direction, and the differential-admission run on the new shard
    is the proof. Deleting rather than re-authoring would leave a silent regression to DISABLED unguarded. (b) Add
    test_dr_dump_precedes_the_gc_ops_window, reading ducklake_catalog_dr.tf (read-only, not modified) to pin that
    the catalog backup cron precedes the gc_ops cron on the same day. (c) Add TestGcOpsEnablementBaseline asserting
    the committed dry-run fixture licenses the enablement. File is 259 of 500 SLOC; ~60 added lines keep it unregistered
    and well under budget, so Decision 128 decomposition is not engaged.'
- file: tests/fixtures/gc_ops_dryrun_baseline.json
  action: Create
  purpose: 'The operator''s gc_ops dry_run response envelope, committed as evidence. This is the mechanism that
    removes human memory from the critical path: instead of an operator pasting JSON into a terminal that an agent
    then trusts, the reading is version-controlled with provenance and a test adjudicates it, so FORGETTING TO TAKE
    THE READING FAILS CI rather than stalling silently. Body is scalars plus table names only -- no paths, no bucket
    name, no account id -- and this repo already publishes the same class of figures in PLAN-production-gc-and-storage-stability
    and rec-3767, so Decision 101''s boundary is satisfied and asserted by step 8 rather than assumed.'
- file: config/agent/verification_registry/entries/gc-ops-rule-enabled-and-no-lakehouse-lifecycle.yaml
  action: Create
  purpose: 'Successor shard carrying the inverted claim, the new DR-ordering assertion, and ALL FOUR unchanged sibling
    selectors (no-lakehouse-lifecycle, maintenance-IAM-not-widened, liveness-breaching-on-missing, cadence-minutes-disjoint).
    Carrying all four forward is load-bearing: a retired shard whose surviving properties are not re-homed is a
    silently lapsed pin. A NEW check_id is required rather than a selector swap in place -- verification-registry.yaml''s
    check_id semantics make identity immutable across implementation changes, and the retained-id precedent in its
    amendment_log is explicitly scoped to claim-PRESERVING re-authoring, which an inversion is not.'
- file: config/agent/verification_registry/entries/gc-ops-enablement-baseline-fixture-gate.yaml
  action: Create
  purpose: 'Shard graduating the fixture gate. Its standing value is tamper-evidence on the evidence that licensed
    a destructive production schedule: once merged, the fixture is immutable, so any later edit that weakens what
    the baseline claimed reddens CI.'
- file: config/agent/verification_registry/entries/deprecated/gc-ops-rule-disabled-and-no-lakehouse-lifecycle.yaml
  action: Create
  purpose: 'git mv of the superseded shard into the loader-excluded retirement subtree (Decision 176: retirement
    is a git mv to entries/deprecated/, no status column, no version key). Its check_spec names a pytest selector
    this plan deletes, so leaving it live converts a standing green check into a collection error.'
- file: config/agent/verification_registry/entries/gc-ops-rule-disabled-and-no-lakehouse-lifecycle.yaml
  action: Delete
  purpose: The git mv's source half -- the shard no longer resolves at the live entries/ path.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: 'Retire the future-tense ''enabled only after the baseline gate clears'' clause at :180 and repoint the
    three sibling ''created DISABLED'' sites (:25, :286, :321) to record the cleared gate and the live cadence;
    append the amendment_log entry AT THE TAIL (this file''s log is ascending -- :[0] is 2026-09-13 -- unlike most
    contracts here) with semantic_break and change_class, which all four existing entries carry. CRITICALLY, DO
    NOT SIMPLY DELETE THE NORMATIVE CLAUSE: :180 is the ONLY present-tense standing requirement anywhere that a
    baseline must precede an enable. Replacing it with a purely past-tense record would mean that after a rollback
    to DISABLED -- this plan''s own rollback path -- nothing durable requires a fresh dry_run baseline before re-enabling,
    leaving only this plan''s prose, which is not a standing artefact. Retain a present-tense re-gate clause (''re-enabling
    after a DISABLED rollback requires a fresh dry_run baseline meeting the same three conditions'') alongside the
    past-tense record. Step 6 asserts it survives. File is 336 of 500 effective lines, so size governance is not
    engaged.'
- file: docs/runbooks/ducklake-catalog-operations.md
  action: Modify
  purpose: 'Three additions. (a) The gc_ops dry_run operator recipe, which does not exist today -- the manual-invoke
    section carries only the smoke-scoped action=gc -- resolving data_path via `terraform output -raw`, never a
    literal bucket name. (b) The DELETE-MARKER RECOVERY recipe, so the rollback path for an over-reclaim is written
    down before it is needed rather than invented under pressure. (c) The live cadence, and the fact that the liveness
    alarm sits in ALARM until the first pass emits. (d) Correct the DEAD `aws events list-rules --profile agent_platform`
    recipe at :324, which sits in the very section this plan is editing and cannot work for ANY identity: PlatformDev
    holds zero events:* grants, and events:ListRules is granted to NO identity anywhere in terraform/. Replace it
    with `aws events describe-rule --name <exact-rule-name> --profile agent_platform_admin`, which the 2026-09-17
    probe exercised successfully. The two sibling occurrences at :393 and :442 sit in catalog-DR sections this plan
    does not touch and are rec-3910''s, split that way to honour the Decision 59 location boundary rather than widening
    this diff into unrelated sections.'
bundled_recommendations:
- rec-3767
followon_recs:
- rec-3907
- rec-3908
- rec-3909
- rec-3910
closes_criteria: []
infrastructure_dependencies:
- 'terraform/personal/ducklake_maintenance.tf: aws_cloudwatch_event_rule.ducklake_maintenance_gc_ops state UPDATE.
  Non-IAM, non-delete, non-trust-diff, and not one of the six RESOURCE_POLICY_TYPES, so terraform_apply_guard exits
  0 and terraform-apply-sandbox.yml auto-applies the saved plan at merge (Decision 77 no-TOCTOU; guard classification
  per environment-taxonomy.yaml, Decision 92 point 5). No IAM diff, so no tf-gated-apply routing and no admin out-of-band
  step.'
- 'Apply-role grant confirmed present, not assumed: github_ci_apply already holds events:PutRule and events:EnableRule
  scoped to arn:aws:events:*:*:rule/agent-platform-* (terraform/bootstrap/github_ci_apply_policy.tf:553-563), so
  no IAM gap red-latches this apply.'
- 'Apply precondition: the durable convergence record must be green -- terraform-apply-sandbox.yml''s read-PRECONDITION
  refuses on CONVERGENCE_RED and a plain push never clears red. Measured green at plan time via bin/venv-python
  -m scripts.convergence_health.'
- 'Decision 119: NO local terraform command is authored anywhere in this plan, fmt included. This container has
  no terraform binary at all (verified: command not found), so CI''s terraform-validate required check and the speculative-plan
  job are the only verifiers. The state literal change does not shift attribute alignment (fmt aligns on the longest
  KEY, schedule_expression, not on values), but fmt remains CI''s to adjudicate.'
- 'No Lambda artifact is affected: compute_affected_artifacts over this plan''s scope returns {} -- terraform, tests/,
  config/agent/ and docs/ all sit outside the manifest patterns -- so Decision 79 / CD.16''s build+deploy+smoke
  obligation does not fire.'
acceptance_criteria:
- 'THE GATE PRECEDES THE ENABLE. Steps 11 and 12 complete and pass BEFORE the PR carrying the terraform flip is
  merged, because the flip auto-applies at merge. Merging first and gating afterwards inverts the only control this
  plan has. BE PRECISE ABOUT WHAT ENFORCES THIS: steps 1-10 are CI-enforced and mechanical. Steps 11 and 12 are
  OPERATOR-ENFORCED -- step 11''s command is an echo dispatching an MCP call (the precedented idiom forced by AGENTS.md''s
  no-gh-CLI rule) and therefore always exits 0, and step 12 depends on live credentials. Their pre-deploy PHASE
  is structural and correct, since for a terraform-only change the deploy IS the merge-time apply; their EXECUTION
  is a discipline the implementing agent must hold, not something CI can fail. What CI does enforce is step 8, which
  fails loudly if the reading was never taken at all.'
- THE GATE READS THE INVOKE RESPONSE PAYLOAD, NOT CLOUDWATCH, for the two signals that decide it. drain_probe_counts
  and unsized_candidates are dry_run-only RESPONSE fields; GcDrainCutoffDays emits only on a real non-dry_run pass.
  A gate authored against CloudWatch alone would silently adjudicate on metrics that do not exist in dry_run. docs/contracts/ducklake_maintenance.yaml
  already sanctions the payload as the pre-enablement canary, and the runbook already prescribes unsized_candidates
  == 0 as a pre-enablement reading.
- THE GATE CONDITION IS THE POST-#1203 QUESTION. Not 'is the backlog under G4_MAX_DELETE_FILES' -- it is not, 23,476
  measured 2026-09-15 against a 20,000 cap -- but 'does a ladder rung admit a POSITIVE count under BOTH caps', which
  is what _drain_walk brackets and bisects on. A rung admitting zero is not a drain (the rec-3871 anti-pattern _drain_walk
  explicitly rejects), so the assertion is 0 < files <= cap, never files <= cap.
- THE GATE IS NECESSARY, NOT SUFFICIENT, AND SAYS SO. The dry_run probe is PRE-EXPIRY (dry_run runs no expire_snapshots)
  while the real walk brackets the POST-EXPIRY set, which is strictly larger on a catalog where expiry has never
  run. The probe also samples ladder rungs only, with strict_sizes=False, while the real walk bisects with strict_sizes=True
  -- a coarser and more permissive reading than the pass it predicts. The sufficient reading is GcDrainCutoffDays
  on the first real pass, which is why step 14 is in this plan rather than deferred.
- unsized_candidates == 0 IS BLOCKING, NOT AN OBSERVATION. The real pass sizes with strict_sizes=True and RAISES
  on the first unsized path (Decision 163/193), so a non-zero dry_run reading predicts a 500 and a breaker trip
  on the first scheduled firing.
- 'G4_MAX_DELETE_FILES (20,000) and G4_MAX_DELETE_BYTES (10 GiB) ARE UNCHANGED, asserted by an executable cap-pin
  step rather than left to reviewer vigilance. The drain is the sanctioned answer to an over-cap backlog; raising
  a bound so a gate passes is the Decision 55 prohibition, and the constants'' own docstring requires a Decision
  superseding CD.33 / Decision 188 to move them. The byte cap is nowhere near binding regardless: the whole prefix
  measured 0.246 GiB against a 10 GiB cap, so only the file count decides.'
- 'EVERY VP COMMAND IS ONE THIS SESSION PROVED THE AGENT IDENTITY CAN RUN. Three candidates were probed and REJECTED
  as unauthorized rather than authored blind: events:DescribeRule (AccessDenied -- so NO step verifies the rule
  state via the EventBridge API), lambda:GetFunctionConfiguration (AccessDenied -- so no step reads the function''s
  LastModified), and any local terraform invocation (no binary). PlatformDev''s ObservabilityMetricRead grant (GetMetricData,
  DescribeAlarms, platform_dev_policies.tf:103-113) is what the CloudWatch and alarm steps rest on, and it was exercised
  live at plan time.'
- THE OPERATOR INVOKE IS ACKNOWLEDGED, THEN ENGINEERED AROUND. PlatformDev's DuckLakeInvokeRuntime grant is scoped
  to the writer and reader ARNs only; maintenance stays break-glass on PlatformAdmin (platform_dev_policies.tf:56-68,
  Decision 143 blast radius). That boundary is not widened. Instead the response is COMMITTED AS A FIXTURE and a
  test adjudicates it, so a forgotten reading fails CI instead of stalling the plan silently -- the human stays
  at the judgement point and leaves the transcription point.
- THE FIRST SCHEDULED PASS IS VERIFIED BY A STATE TRANSITION, NOT BY ABSENCE. ducklake-maintenance-gc-ops-liveness
  is ALREADY in ALARM (measured live 2026-09-15T16:08 -- seven missing daily datapoints treated as breaching, because
  production GC has never run). Its clearing to OK is the behavioural proof the enable took effect, and given events:DescribeRule
  is denied it is the one such signal available.
- BACKUP PRECEDES DESTRUCTION, AND IT IS NOW ASSERTED. The catalog-DR dump runs cron(0 3 ? * SUN *) and gc_ops cron(45
  3 ? * SUN *) -- both confirmed live 2026-09-17 (catalog-dr ENABLED, gc_ops DISABLED). Until this plan that 45-minute
  ordering was a property of two independently-authored literals in two files that nothing checked, and it only
  became load-bearing when the destructive cadence was enabled. The static test pins the ordering; it does NOT prove
  the backup COMPLETED, which is rec-3909's deferred half and is named as such rather than implied.
- T2.18 c2 STAYS `open` AND closes_criteria IS EMPTY. This plan starts rec-3870's N=9 clock; it does not adjudicate
  the window. Criterion flips happen only in /implement's bookkeeping walk for explicitly declared closes_criteria
  (tier-item-lifecycle.yaml Status-Trusted-Never-Inferred).
- rec-3767 IS CLOSED ON ITS OWN LITERAL ACCEPTANCE PROBE, run verbatim from the rec row rather than paraphrased,
  and its closure is verified against the read cache after a portal sync.
- THE SUPERSEDED SHARD IS RETIRED, NOT ORPHANED, AND ITS SURVIVING PROPERTIES ARE RE-HOMED. All four still-valid
  sibling selectors move to the successor shard. A retired pin whose properties lapse unreplaced is a silent loss
  of coverage.
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: false
  graduation: graduate
  graduation_check_id: gc-ops-rule-enabled-and-no-lakehouse-lifecycle
  action: 'Run the successor shard''s exact check_spec: the inverted ENABLED assertion, the new DR-precedes-GC ordering
    assertion, and the four unchanged sibling invariants. The VP step and the registry row run the identical command
    by construction.'
  command: bin/venv-python -m pytest "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_is_enabled"
    "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_no_lifecycle_configuration_targets_the_data_lake_bucket"
    "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_maintenance_role_iam_is_not_widened"
    "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_liveness_alarm_treats_missing_data_as_breaching"
    "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_gc_ops_rule_cron_does_not_collide_with_the_singleton_cadences"
    "tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestProductionGcRuleInvariants::test_dr_dump_precedes_the_gc_ops_window"
    -q
  expected: 6 passed. On the un-implemented tree test_gc_ops_rule_is_enabled and test_dr_dump_precedes_the_gc_ops_window
    do not exist, so pytest exits non-zero with a collection error -- genuinely red before the fix.
  fix_if: A selector is absent (the old test was deleted without a replacement, leaving the rule state unguarded)
    or still asserts DISABLED. Never delete an assertion to make the step pass.
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the claim step 1 graduates as gc-ops-rule-enabled-and-no-lakehouse-lifecycle.
    A second standing shard over one invariant adds a maintenance surface without adding discrimination.
  action: Assert the terraform literal in BOTH polarities, scoped to the gc_ops rule block alone so a sibling rule's
    state cannot satisfy it and a half-applied edit cannot pass. The negative half also forces the stale `description`
    attribute at :326 to be rewritten, since it contains the word DISABLED inside the same block.
  command: bin/venv-python -c "import re,pathlib; t=pathlib.Path('terraform/personal/ducklake_maintenance.tf').read_text();
    m=re.search(r'resource \"aws_cloudwatch_event_rule\" \"ducklake_maintenance_gc_ops\" \{.*?\n\}', t, re.S); assert
    m, 'gc_ops rule block not found'; b=m.group(0); assert re.search(r'state\s*=\s*\"ENABLED\"', b), b; assert 'DISABLED'
    not in b, b; print('gc_ops rule state = ENABLED')"
  expected: 'Prints: gc_ops rule state = ENABLED. Exit 0.'
  fix_if: The block still carries DISABLED anywhere (check the description attribute, not just the state), or the
    regex finds no block -- the resource was renamed, which also breaks the target and permission references at
    :337 and :348.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A bundled recommendation's own acceptance literal, not a standing repo invariant --
    it becomes dead weight the moment rec-3767 closes, and step 1 guards the underlying claim permanently.
  action: Run rec-3767's acceptance probe VERBATIM from the rec row, so the bundled rec closes on its own stated
    terms.
  command: rg -q 'gc_ops' terraform/personal/ducklake_maintenance.tf && ! rg -n 'gc_ops' -A 10 terraform/personal/ducklake_maintenance.tf
    | rg -q 'state *= *"DISABLED"'
  expected: Exit 0.
  fix_if: 'Non-zero. This probe''s -A 10 window is looser than step 2''s block-scoped regex: if step 2 passes and
    this fails, a DISABLED literal sits within ten lines of some other gc_ops mention. Reword the prose, never weaken
    the probe.'
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts a one-time migration specific to this diff (one id retired, two added). It is
    green-by-construction forever after and would guard nothing as a standing check.
  action: 'Assert the registry re-key: both successor shards load through the canonical loader, the superseded shard
    no longer does, and the retired file is physically present under the loader-excluded deprecated subtree -- so
    ''retired'' stays distinguishable from ''deleted and forgotten''.'
  command: bin/venv-python -c "import pathlib; from scripts.verification_graduation import load_entries; ids={e['check_id']
    for e in load_entries()}; assert 'gc-ops-rule-enabled-and-no-lakehouse-lifecycle' in ids, 'new shard does not
    load'; assert 'gc-ops-enablement-baseline-fixture-gate' in ids, 'fixture-gate shard does not load'; assert 'gc-ops-rule-disabled-and-no-lakehouse-lifecycle'
    not in ids, 'superseded shard still live'; p=pathlib.Path('config/agent/verification_registry/entries/deprecated/gc-ops-rule-disabled-and-no-lakehouse-lifecycle.yaml');
    assert p.is_file(), 'retired shard missing from entries/deprecated/'; print('registry re-keyed; retired shard
    parked')"
  expected: 'Prints: registry re-keyed; retired shard parked. Exit 0.'
  fix_if: A shard does not load (filename must equal check_id -- validate_verification_registry enforces placement
    structurally), or the old one still resolves at the live path, or the retirement was a plain delete rather than
    a git mv into entries/deprecated/.
- step: 5
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Green-by-construction on the un-implemented tree, because it asserts an invariant this
    plan must NOT change. Declaring it `graduate` would fail Decision 189's plan-PR RED-BEFORE replay leg, which
    requires a graduate pre-deploy step to redden before the fix exists.
  action: CAP PIN. Assert G4's two absolute bounds are the shipped values, enforcing this plan's no-weakening constraint
    executably rather than by reviewer vigilance. Step 11 reads these same constants at runtime, so an unpinned
    raise would make the gate pass for the wrong reason.
  command: bin/venv-python -c "from src.common.ducklake_maintenance_ops import G4_MAX_DELETE_FILES as f, G4_MAX_DELETE_BYTES
    as b; assert f==20000, f; assert b==10*1024**3, b; print('G4 caps unchanged:', f, 'files /', b, 'bytes')"
  expected: 'Prints: G4 caps unchanged: 20000 files / 10737418240 bytes. Exit 0.'
  fix_if: Either constant moved. Revert it. Moving them requires a Decision superseding CD.33 / Decision 188 per
    the constants' own docstring, and doing it inside this plan would be the Decision 55 prohibition exactly.
- step: 6
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Keyed on prose strings this diff introduces, so it discriminates nothing once merged.
    Standing contract-drift coverage is validate_contract_drift's job, not a per-plan shard.
  action: 'Assert the contract carries no future-tense enablement clause, RETAINS a present-tense re-gate clause,
    names this plan, and grew a well-formed amendment_log entry. Contract drift on a Class A contract is the failure
    mode that made :180 stale to begin with. NOTE THE ORDERING: this file''s amendment_log is ASCENDING (oldest
    first -- :[0] is 2026-09-13, :[3] is 2026-09-15), unlike most contracts in the repo. The assertion is therefore
    search-based plus a monotonicity check rather than a hardcoded index, so it is correct under either convention
    and additionally catches a non-monotonic insert.'
  command: bin/venv-python -c "import yaml,pathlib; raw=pathlib.Path('docs/contracts/ducklake_maintenance.yaml').read_text();
    assert 'enabled only after the baseline gate clears' not in raw, 'stale future-tense enablement clause survives';
    assert 'gc-ops-baseline-gate-and-schedule-enable' in raw, 'contract does not name the enabling plan'; assert
    're-enabling' in raw.lower(), 'no present-tense re-gate clause survives the repoint'; d=yaml.safe_load(raw);
    log=d['amendment_log']; new=[e for e in log if 'gc_ops' in e['summary'] and 'ENABLED' in e['summary']]; assert
    new, 'no amendment_log entry records the gc_ops enable'; e=new[-1]; assert 'semantic_break' in e and 'change_class'
    in e, e; ds=[x['date'] for x in log]; assert ds==sorted(ds), ('amendment_log dates are not monotonic ascending',
    ds); assert e['date']==ds[-1], 'the gc_ops entry is not the newest'; print('contract repointed; newest amendment:',
    e['date'])"
  expected: Prints the newest amendment_log date. Exit 0.
  fix_if: The stale clause survives at any of the four sites; or the new entry was inserted at the head, breaking
    this file's ascending order (append it at the TAIL); or it omits semantic_break / change_class, which all four
    existing entries carry; or the S1 re-gate clause was dropped along with the stale one.
- step: 7
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Half is keyed on prose this diff introduces. The account-id half duplicates the pre-commit
    never-commit hook, which already guards the whole repo rather than one file.
  action: Assert the runbook gained the dry_run recipe AND the delete-marker recovery recipe, and that neither leaks
    account-scoped data -- data_path resolves through a terraform output, never a literal bucket name (AGENTS.md
    public-repo boundary, Decision 101). Also assert the dead `events list-rules` recipe is gone from the manual-invoke
    section specifically -- scoped to that section, not the whole file, because the two occurrences in the catalog-DR
    sections are rec-3910's and must NOT be swept up here.
  command: bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/runbooks/ducklake-catalog-operations.md').read_text();
    c=t.replace(' ',''); assert '\"action\":\"gc_ops\"' in c, 'no gc_ops invoke recipe'; assert '\"dry_run\":true'
    in c, 'recipe is not the read-only dry_run form'; assert 'output -raw' in t, 'data_path is not resolved via
    a terraform output'; assert 'delete-marker' in t.lower(), 'no delete-marker recovery recipe'; mi=t.find('Manual
    invoke runbook'); nx=t.find('###', mi+10); assert 'list-rules' not in t[mi:nx], 'dead events list-rules recipe
    survives in the manual-invoke section'; assert not re.search(r'(?<!\d)\d{12}(?!\d)', t), 'a 12-digit account
    id reached the runbook'; print('runbook recipe + recovery present and boundary-clean')"
  expected: 'Prints: runbook recipe + recovery present and boundary-clean. Exit 0.'
  fix_if: The recipe hardcodes the data-lake bucket or an account id -- resolve it the way the existing SNS recipe
    does. The never-commit hook blocks the account-id shape, but a bucket name is not shape-detectable, so this
    step is the only cover for it.
- step: 8
  phase: pre-deploy
  hermetic: false
  graduation: graduate
  graduation_check_id: gc-ops-enablement-baseline-fixture-gate
  action: 'THE BASELINE GATE, adjudicated on the COMMITTED fixture. The operator''s dry_run response (taken per
    the pre-implementation checklist) is committed at tests/fixtures/gc_ops_dryrun_baseline.json and this test asserts
    the three gate conditions against it: referenced_missing == 0, unsized_candidates == 0, and at least one ladder
    rung with 0 < files <= G4_MAX_DELETE_FILES and bytes <= G4_MAX_DELETE_BYTES. The test imports both caps from
    src.common.ducklake_maintenance_ops so the assertion can never drift from the shipped guard. THE PROOF THAT
    THE READING EXERCISED THE DRAIN CODE IS THE PAYLOAD SHAPE, NOT A TIMESTAMP: unsized_candidates and drain_probe_counts
    are both #1203 additions (Decision 193 cl.4), so a pre-drain fixture fails this test on a missing key or an
    empty ladder regardless of what any metadata claims. captured_at and deploy_run_id are CORROBORATING PROVENANCE
    ONLY -- neither is returned by the handler (the envelope has no such keys, verified against ducklake_gc_ops.py:223-243),
    so both are operator ATTESTATIONS, not measurements, and the test must not rest a gate condition on them. captured_at
