schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "projection-aware-reader-client"
intent: >-
  Make the DuckLake reader client projection-aware so reading a field a verb never projected
  raises a named error instead of silently returning None -- closing the defect class that has
  produced the same wrong-answer bug at four call sites, and making the test suite capable of
  reproducing production row shapes.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-projection-aware-reader-client.yaml
phase: >-
  Ad-hoc platform hardening on the ops read boundary (soft-warn exception category ad_hoc_rec),
  so the Tier Item Freshness Gate is skipped. Names no tier_item: this is a defect-class closure
  on the Decision 84 I-3 named-verb surface, not roadmap-sequenced work.
scope:
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      Row/UnprojectedField strict-access types, the VERB_FIELDS projection table with its
      literal NAMED_READS_VERSION pin, the frozen shrink-only legacy roster, the optional
      fields= fetch-time check on named(), and query() raising instead of swallowing.
  - file: tests/fixtures/reader_rows.py
    action: Create
    purpose: >-
      verb_rows(verb, [...]) fixture helper that strips hand-authored dicts to the verb's real
      projection and wraps them strictly, so fixtures cannot express a shape production never
      emits. Lives in tests/fixtures/ because Decision 131 exempts it from the
      no-cross-test-import guard.
  - file: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    action: Create
    purpose: >-
      Executes each NAMED_READS verb's SQL in in-memory DuckDB and asserts the resulting column
      set equals its VERB_FIELDS declaration; asserts the client's literal version pin equals
      NAMED_READS_VERSION at this commit.
  - file: tests/common/ducklake_reader_client/test_row_strictness.py
    action: Create
    purpose: >-
      Row semantics (absent key raises, projected NULL returns None, dict interop preserved),
      the frozen-roster shrink-only assertion, and the red/green reproduction of the live
      convergence dedup defect.
  - file: tests/fixtures/__init__.py
    action: Modify
    purpose: export verb_rows alongside the existing fixture helpers
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Reading a field absent from a row's projection raises UnprojectedField (a KeyError subclass)
    naming the verb, the field, and the actual projection -- via both .get() and [].
  - >-
    A field that IS in the projection but holds SQL NULL returns None (or the supplied default)
    without raising -- absent and null stay distinguishable.
  - >-
    VERB_FIELDS declares a column tuple for every NAMED_READS verb, and a test proves each
    declaration equals the column set that verb's SQL actually produces.
  - >-
    verb_rows() strips a fixture dict to the named verb's projection, so a fixture asserting on
    a field that verb never projects fails.
  - >-
    Feeding verb-shaped open_recs rows to find_open_convergence_stale_rec raises
    UnprojectedField instead of silently returning None (the live defect, reproduced).
  - >-
    Strictness is on by default. Tolerated legacy access is enumerated in a frozen module-level
    roster that a test forbids from growing; there is no runtime switch that disables raising.
  - DuckLakeReader.query() raises on reader failure instead of returning None.
  - >-
    _READER_TRANSIENT_STATUS survives the edit and still equals
    scripts.ops_portal.reader_transient's set (Decision 155 clause 2).
  - >-
    The data-pipeline artifact ships through .github/workflows/deploy-prod-lambdas.yml and its
    per-function smoke invocation passes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Each verb's VERB_FIELDS declaration matches the column set its registered SQL actually
      produces, executed in in-memory DuckDB (not asserted against a hand-copied list).
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_verb_fields_parity.py -q
    expected: exit 0; every NAMED_READS verb covered, including the SELECT * verbs resolved via resolve_table_spec
    fix_if: >-
      A mismatch means VERB_FIELDS drifted from the registry -- correct the declaration, never
      relax the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: verb-fields-parity
  - step: 2
    phase: pre-deploy
    action: >-
      Row raises UnprojectedField on an absent key via BOTH .get() and [], and the message names
      verb, field and actual projection.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_absent_key_raises_naming_verb_field_and_projection -q
    expected: exit 0
    fix_if: >-
      A bare KeyError with no diagnostic reproduces the prose-comment workaround this plan
      replaces; the error must carry all three facts.
    hermetic: true
    graduation: graduate
    graduation_check_id: row-absent-key-raises
  - step: 3
    phase: pre-deploy
    action: >-
      A projected column holding SQL NULL returns None without raising -- proving absent and
      null did not collapse into one another in the other direction.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_projected_null_returns_none -q
    expected: exit 0
    fix_if: If this raises, Row is keying on truthiness rather than key presence.
    hermetic: true
    graduation: graduate
    graduation_check_id: row-projected-null-returns-none
  - step: 4
    phase: pre-deploy
    action: >-
      Red/green on the live defect: find_open_convergence_stale_rec fed open_recs-shaped rows
      raises UnprojectedField instead of returning None.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_convergence_dedup_lookup_raises_on_verb_shaped_rows -q
    expected: exit 0 after the change; this test fails (returns None, no raise) against the pre-change client
    fix_if: >-
      If it still returns None, strictness is not reaching rows that transit a plain function
      parameter -- the exact dataflow grep cannot follow.
    hermetic: true
    graduation: graduate
    graduation_check_id: convergence-dedup-raises-on-verb-rows
  - step: 5
    phase: pre-deploy
    action: >-
      verb_rows() strips a hand-authored fixture to the verb projection, so a fixture carrying
      source/status for open_recs cannot assert on them.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_verb_rows_strips_fixture_to_projection -q
    expected: exit 0
    fix_if: >-
      If the helper passes extra keys through, the suite can still express shapes production
      never emits -- the mechanism by which this bug shipped four times.
    hermetic: true
    graduation: graduate
    graduation_check_id: verb-rows-strips-to-projection
  - step: 6
    phase: pre-deploy
    action: >-
      The legacy roster is frozen and shrink-only: its length never exceeds the seeded count and
      no runtime flag disables raising.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_legacy_roster_is_frozen_and_shrink_only -q
    expected: exit 0
    fix_if: >-
      A growable roster is the discretionary-enforcement shape Decision 163 forbids; shrink the
      roster by fixing a call site, never extend it.
    hermetic: true
    graduation: graduate
    graduation_check_id: reader-projection-roster-shrink-only
  - step: 7
    phase: pre-deploy
    action: >-
      query() raises on reader failure rather than returning None (Decision 84 I-4 loud-fail),
      and _READER_TRANSIENT_STATUS still equals the ops_portal.reader_transient set.
    command: bin/venv-python -m pytest tests/common/ducklake_reader_client/test_row_strictness.py::test_query_raises_and_transient_status_export_intact -q
    expected: exit 0
    fix_if: >-
      A surviving `except Exception: return None` in query() reintroduces the silent-degradation
      path; a changed _READER_TRANSIENT_STATUS breaks Decision 155 clause 2's equality assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: query-raises-transient-export-intact
  - step: 8
    phase: pre-deploy
    action: >-
      Coverage on the modified client holds its ratcheted floor (config/coverage_baseline.yaml
      records 88.3) -- the new types must be genuinely exercised, not smoke-covered.
    command: bin/venv-python -m scripts.test_coverage_checker --check-coverage --file src/common/ducklake_reader_client.py
    expected: reported coverage >= 88.3
    fix_if: Below the floor, add assertions to the strictness tests rather than lowering the baseline.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Coverage is already ratcheted by its own standing baseline gate in validate.py; graduating
      a second per-file coverage check would duplicate that mechanism rather than guard new
      behaviour.
  - step: 9
    phase: pre-deploy
    action: Fast presubmit tier passes on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: Diagnose and fix on the branch; a --pre failure files no rec and gates nothing.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      The data-pipeline artifact ships through the governed channel and its per-function smoke
      invocation passes. Decision 48's in-session `build_lambda --deploy` example is SUPERSEDED
      as the routine path by Decision 125 clause 3 / Decision 126 -- do not run it locally.
    command: bin/venv-python -m scripts.ci.actions_status --workflow deploy-prod-lambdas.yml --branch main --limit 1
    expected: latest run conclusion success, including its per-function smoke-invocation step
    fix_if: >-
      On failure read the run log and forward-fix; never fall back to a local
      `build_lambda --deploy` (break-glass only, human-directed).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Live behavioural proof against the deployed reader: a real open_recs call returns strict
      rows, an unprojected field raises, and a projected field still reads.
    command: |
      bin/venv-python -c "
      from src.common.ducklake_reader_client import make_reader, UnprojectedField
      row = make_reader(profile='agent_platform').named('open_recs')[0]
      assert row.get('title') is not None, 'projected field must still read'
      try:
          row.get('source')
      except UnprojectedField as exc:
          print('OK', exc)
      else:
          raise SystemExit('FAIL: unprojected access did not raise')
      "
    expected: prints OK plus the diagnostic naming open_recs, source, and the five-column projection
    fix_if: >-
      If source returns None, the deployed artifact predates this change -- confirm step 10
      actually shipped before re-running.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: src/common/ducklake_reader_client.py
    behavior: >-
      Access to a column outside a row's projection raises UnprojectedField naming verb, field
      and projection; a projected NULL still returns None; query() raises rather than returning
      None; the legacy roster cannot grow.
    verification_step: 2
    test_selector: tests/common/ducklake_reader_client/test_row_strictness.py::test_absent_key_raises_naming_verb_field_and_projection
    red_green_expectation: >-
      red before (plain dicts return None for any missing key, so the assertion that access
      raises fails), green after.
  - source: tests/fixtures/reader_rows.py
    behavior: >-
      verb_rows() strips a fixture dict to exactly the named verb's projected columns and wraps
      it strictly, so a fixture cannot express a row shape the verb never emits.
    verification_step: 5
    test_selector: tests/common/ducklake_reader_client/test_row_strictness.py::test_verb_rows_strips_fixture_to_projection
    red_green_expectation: red before (the helper does not exist; collection error), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NO change to src/common/ducklake_scd2_schema.py or any server-side verb SQL -- that module
    is packaged into FIVE Lambda artifacts and editing it forces a fleet redeploy.
  - >-
    named() keeps its `-> list[dict]` annotation (Row subclasses dict). list is invariant, so
    `-> list[Row]` would force mypy churn across ~29 call sites for no runtime gain.
  - >-
    No auto-refetch on an absent field (the Django deferred-attribute pattern) -- that is an
    N+1 across an RPC boundary and breaches Decision 88 invariant (ii).
  - >-
    No runtime flag, env var, or config toggle that disables raising. Tolerated legacy access is
    a frozen, shrink-only, code-reviewed roster (Decision 163 / Decision 170 clause 3 shape).
  - >-
    Do NOT derive projections by parsing verb SQL at runtime -- fragile, and unresolvable for
    SELECT * verbs whose expansion needs field-semantics YAML this artifact does not package.
  - >-
    Call-site repairs and roster paydown are OUT OF SCOPE (follow-on plans); this plan changes
    the read surface and the test substrate only.
  - Do not raise config/sloc_budgets.yaml -- projected ~380 SLOC stays under the 500 threshold.
context:
  - "decision-scout verdict: FLAGS_FOUND (134 of 134 triaged). CITE: Decision 84 (I-1/I-3/I-4),
    Decision 55, Decision 61, Decision 79, Decision 125+126, Decision 88, Decision 155,
    Decision 170, Decision 128+130, Decision 131, Decision 48; RELATED: Decision 140 (CD.8),
    Decision 124, Decision 103, Decision 161, Decision 153+135."
  - "gates: decision-scout=FLAGS_FOUND after 1 round; plan-critique=<verdict> after <N> round(s)"
  - >-
    CI-RCA DEFERRAL (Related-Work Check): rec-3293, rec-3292 open and unresolved; this plan meets
    none of the three related-work conditions. Deferred on explicit human direction at planning
    time -- both are being resolved concurrently by another agent.
  - >-
    Enabling fact: ducklake_reads.named_read builds rows via dict(zip(cursor.description, ...)),
    so unprojected == ABSENT KEY and projected-NULL == present key holding None. The wire already
    distinguishes them; only the client discards it. No server change needed.
  - >-
    VERB_FIELDS exists because src/lambdas/data-pipeline/manifest.yaml `excludes:` keeps
    ducklake_scd2_schema.py out of the zip -- NAMED_READS and NAMED_READS_VERSION are both
    unimportable at Lambda runtime, so the version pin is a literal the parity test asserts.
  - >-
    Skew window (Decision 91): the two artifacts deploy on independent channels, so parity is
    same-commit only; describe_named_reads() emits no field list. Single-SoT follow-on (add
    `fields` to it) deferred on the five-artifact redeploy cost.
  - >-
    Decision 163 resolution: strictness ships ON with a frozen shrink-only roster, NOT the
    observe-mode-then-flip a Fable consult recommended (declared-but-unenforced, nothing obliges
    the flip). Residual risk accepted: a site missed by census raises rather than warns.
  - >-
    Roster seed (file+verb pairs reading unprojected fields; seed generously -- grep cannot
    follow rows through function parameters): escalate.py & _budget_recs.py & recs_cache.py
    +open_recs; budget_ingest.py+recs_by_title_prefix; alerts.py+budget_bypass_recent,
    +forward_fix_recursion; ci_rca_signals.py+ci_rca_open,+ci_rca_since;
    recs_cache.py+decisions_max_updated.
  - >-
    Why verb_rows() ships first: tests/convergence_health/test_escalate.py:20-22 hand-authors
    fixtures carrying source/status, a shape open_recs never emits -- the fixtures, not the
    assertions, are why this bug survived four repairs.
  - >-
    preflight/alerts.py calls named("budget_breach_recent"), registered NOWHERE server-side
    (live probe: 500 unknown-verb); survives only via a broad except. Fix in the call-site
    follow-on via current_state(row_filter="source = 'budget_breach'"), not here.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    FIRST, tests/fixtures/reader_rows.py -- verb_rows(verb, rows) strips each dict to the verb's
    projection and wraps it strictly. Ship this and the parity test before Row itself: they are
    what make the existing suite tell the truth, and they cost nothing.
  - >-
    tests/common/ducklake_reader_client/test_verb_fields_parity.py -- execute each NAMED_READS
    verb's SQL in in-memory DuckDB (reuse the harness in tests/fixtures/ducklake_fakes.py and
    tests/test_session_preflight_cache_serving.py); resolve SELECT * verbs via
    resolve_table_spec(table).ordered_columns; assert the literal version pin equals
    NAMED_READS_VERSION.
  - >-
    src/common/ducklake_reader_client.py -- add UnprojectedField(KeyError) carrying verb/field/
    projection; add Row(dict) with __slots__ = ("_verb",) overriding get/__getitem__ to raise on
    key absence while preserving dict interop (dict(row), **row, json.dumps, copy).
  - >-
    Add VERB_FIELDS: dict[str, tuple[str, ...]] plus the literal registry-version pin, and the
    frozen LEGACY_PROJECTION_ROSTER (module-level, documented shrink-only, no config file and no
    escape grammar) seeded from the census in context.
  - >-
    Wrap named() and current_state() results in Row; add the optional fields= kwarg that
    verifies requested fields against the first row before returning; assert the response key
    set equals VERB_FIELDS[verb] on non-empty responses and raise ProjectionDrift on mismatch.
    Keep the `-> list[dict]` annotations.
  - >-
    Make query() raise instead of returning None on failure; leave _READER_TRANSIENT_STATUS and
    the retry loop intact.
  - >-
    tests/common/ducklake_reader_client/test_row_strictness.py -- the six behaviours in VP steps
    2-7, including the convergence red/green and the roster shrink-only assertion.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop
    and RCA (Decision 55).
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Revert the client commit and redeploy data-pipeline through deploy-prod-lambdas.yml. Row
  subclasses dict and named() keeps its list[dict] annotation, so no call site depends on the
  new types structurally; reverting restores permissive .get() semantics without touching any
  caller.
