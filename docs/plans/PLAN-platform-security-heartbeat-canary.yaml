constraints:
  - terraform/bootstrap is admin-only and never auto-applied (Decision 126; terraform/bootstrap/CLAUDE.md). The PR merges code only, and every apply phase is presented and human-directed.
  - Decision 202 clause 4 -- no region literal, provider alias or us-east-1 resource; clause 3 -- platform-security-* names for detector resources only; clause 2 -- the six trail verbs are unchanged, and the canary grant goes in platform-security-detector-admin (never AdminOps inline; Decision 156).
  - Exactly five platform-security-* alarms and filters remain (the probe and TestPlatformRoleIamChangeDetector pin the set); no sixth alarm.
  - The liveness probe, security-detector-liveness.yml and CI identity grants are out of scope and unchanged.
  - Never loosen an assertion to get green (Decision 181). The heartbeat re-pin is a stated tightening; existing red cases are kept or re-anchored, never dropped.
  - No Delete* verb, service wildcard or out-of-family resource in PlatformAdmin's canary grant. Removing the canary is break-glass only.
  - Decompose, never raise, an SLOC budget (Decision 128).
  - Public repo (Decision 101) -- no account id, ARN, email or internal hostname in any committed file, commit, PR, rec or public log. Post-deploy commands print counts and names only, with stderr suppressed where botocore embeds ARNs.
  - The implementation PR body and squash-merge body must NOT carry a Resolves rec-4044 trailer (ci.yml's trailer-closure job would close rec-4044 before its live proof); rec-4044 closes only in PLAN-platform-role-iam-change-alarms step 20.
  - Do not set SECURITY_DETECTOR_PROVISIONED (Benjamin arms it inside rec-4044's step 16).
  - No rescue agents or workaround loops; an unrecoverable live failure stops for RCA (Decision 55). IMPLEMENTATION plan only (Decision 67).
