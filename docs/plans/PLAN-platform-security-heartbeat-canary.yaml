      minutes_last_iam_event_to_alarm inside the stated 60-105 window. Record that number as the
      measured latency in the hand-back and the PR. Re-run from about 60 minutes after STARVE_AT until
      it passes.
    fix_if: >-
      iam_events_after_disable > 0 with no heartbeat ALARM -- inconclusive, not a failure (organic IAM
      traffic fed it); run step 19 and retry steps 17-18 in a quieter window. At 120 minutes with no
      IAM event in the last 60 and no heartbeat ALARM -- the alarm does not fire on starvation:
      run step 19, STOP, RCA (Decision 55). tamper_to_alarm 0 -- the scheduler clause missed a real
      UpdateSchedule: run step 19, then fix the pattern through a new PR. A measured latency outside 60-105
      makes Decision 202's Update line wrong: record it, and land a SECOND dated Update line on
      Decision 202 (append-only, Decision 177) with the measured window through a follow-up PR,
      plus the alarm_description if it quotes a figure.
  - step: 19
    phase: post-deploy
    action: ADMIN STARVATION PROOF 3/3 -- restore the schedule exactly
    command: |-
      R=$(echo 'var.aws_region' | terraform -chdir=terraform/bootstrap console -var-file=terraform.bootstrap.tfvars | tr -d '"') && R="$R" bin/venv-python - <<'EOF'
      import datetime as d, os, sys
      import boto3
      try:
          s = boto3.Session(profile_name="agent_platform_admin", region_name=os.environ["R"]).client("scheduler")
          g = s.get_schedule(GroupName="platform-security-heartbeat", Name="platform-security-heartbeat-canary")
          keep = {k: g[k] for k in ("Name", "GroupName", "ScheduleExpression", "ScheduleExpressionTimezone", "FlexibleTimeWindow", "Target", "Description", "StartDate", "EndDate", "KmsKeyArn", "ActionAfterCompletion") if k in g}
          s.update_schedule(**keep, State="ENABLED")
          assert s.get_schedule(GroupName="platform-security-heartbeat", Name="platform-security-heartbeat-canary")["State"] == "ENABLED"
      except Exception as exc:
          sys.exit(f"enable failed: {type(exc).__name__}")
      print("RESTORED_AT=" + d.datetime.now(d.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
      EOF
    expected: prints RESTORED_AT=... (a second tamper email is expected for this UpdateSchedule). Run it immediately after step 18 passes, or whenever steps 17-18 are abandoned
    fix_if: a failure class -- retry; if it persists, re-apply the schedule with terraform (plan shows the state drift) under human direction
  - step: 20
    phase: post-deploy
    action: ADMIN -- recovered, converged and green, at least 30 minutes after RESTORED_AT
    command: |-
      terraform -chdir=terraform/bootstrap plan -input=false -lock=false -var-file=terraform.bootstrap.tfvars -detailed-exitcode > /dev/null && R=$(echo 'var.aws_region' | terraform -chdir=terraform/bootstrap console -var-file=terraform.bootstrap.tfvars | tr -d '"') && test "$(aws cloudwatch describe-alarms --alarm-names platform-security-iam-event-heartbeat --query 'MetricAlarms[0].StateValue' --output text --region "$R" --profile agent_platform_admin)" = "OK" && bin/venv-python -m scripts.ci.security_detector_probe --profile agent_platform_admin && echo "RECOVERED -- converged, heartbeat OK, probe green"
    expected: the plan exits 0 (the schedule was restored exactly), then SECURITY DETECTOR OK -- 5 alarms healthy, then RECOVERED
    fix_if: plan exit 2 on the schedule -- step 19 changed a field; present the diff and re-apply under human direction; heartbeat still ALARM -- wait one more 15-minute bucket, then RCA
  - step: 21
    phase: post-deploy
    action: HAND-BACK to the rec-4044 ADMIN session (this plan never sets SECURITY_DETECTOR_PROVISIONED)
    command: |-
      test -n "$CANARY_MERGE_SHA" && echo "HAND-BACK: resume docs/plans/PLAN-platform-role-iam-change-alarms.yaml at step 16 (re-run the local probe; Benjamin arms SECURITY_DETECTOR_PROVISIONED; dispatch security-detector-liveness; then steps 17-21). For its step 20 set MERGE_SHA=$CANARY_MERGE_SHA. Measured starvation latency: see step 18's JSON."
    expected: the hand-back line, relayed to the human with step 16's and step 18's JSON evidence lines (counts only). The repository variable is untouched by this plan
    fix_if: CANARY_MERGE_SHA unset -- export this plan's implementation squash-merge sha
  - step: 22
    phase: post-deploy
    action: CLEANUP (ADMIN) -- remove scratch plans; also run after any STOP
    command: rm -rf "${TMPDIR:-/tmp}/platform-security-canary" && test ! -e "${TMPDIR:-/tmp}/platform-security-canary" && echo "SCRATCH CLEARED"
    expected: SCRATCH CLEARED
    fix_if: a path survives -- remove it by hand before ending the ADMIN session
