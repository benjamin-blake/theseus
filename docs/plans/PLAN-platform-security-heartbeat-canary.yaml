schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-security-heartbeat-canary"
intent: >-
  Unblock rec-4044 (PLAN-platform-role-iam-change-alarms step 16) by giving the
  platform-security-iam-event-heartbeat alarm a guaranteed input: a Terraform-owned canary in
  terraform/bootstrap that makes one IAM read every 5 minutes, so the heartbeat stops
  false-alarming on GitHub's throttled terraform-drift cadence while still proving the trail's
  global-event IAM path into the log group is alive. The fix keeps the detector's blinding
  signal (it fires 60-105 minutes after the last delivered IAM event) rather than silencing it,
  and proves that live by starving the heartbeat on purpose.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-security-heartbeat-canary.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- unblocks rec-4044 (open; its step 16 is blocked by
  this defect) and therefore PLAN-platform-iam-bootstrap-adopt, which is gated on rec-4044. No
  tier_item criterion claimed.
closes_criteria: []
scope:
  - file: terraform/bootstrap/platform_security_heartbeat_canary.tf
    action: Create
    purpose: >-
      The heartbeat's guaranteed IAM-event source (Decision 202 clause 5 control input). Seven
      resources, addresses and names exactly:
      (a) aws_iam_role.platform_security_heartbeat_canary (name platform-security-heartbeat-canary),
      trusted ONLY by states.amazonaws.com with Condition aws:SourceAccount = var.account_id AND
      ArnLike aws:SourceArn = the state machine ARN template
      (arn:aws:states:${var.aws_region}:${var.account_id}:stateMachine:platform-security-heartbeat-canary);
      (b) aws_iam_role_policy.platform_security_heartbeat_canary (name
      platform-security-heartbeat-canary) granting exactly iam:GetRole on that role's own ARN
      template, nothing else;
      (c) aws_iam_role.platform_security_heartbeat_scheduler (name
      platform-security-heartbeat-scheduler), trusted ONLY by scheduler.amazonaws.com with
      aws:SourceAccount = var.account_id and ArnLike aws:SourceArn = the dedicated schedule
      GROUP's ARN template
      (arn:aws:scheduler:${var.aws_region}:${var.account_id}:schedule-group/platform-security-heartbeat)
      -- EventBridge Scheduler presents the schedule-group ARN as aws:SourceArn when it assumes an
      execution role (Scheduler user guide, execution-role confused-deputy example), so a
      schedule-ARN condition would deny every beat; a dedicated group narrows it to this canary;
      (d) aws_iam_role_policy.platform_security_heartbeat_scheduler (name
      platform-security-heartbeat-scheduler) granting exactly states:StartExecution on the state
      machine ARN template;
      (e) aws_sfn_state_machine.platform_security_heartbeat_canary (name
      platform-security-heartbeat-canary, role_arn = aws_iam_role.platform_security_heartbeat_canary.arn,
      type STANDARD -- 90-day execution history is the canary's
      own failure evidence), definition taken from a local holding a heredoc JSON document (so the
      test can json.loads it) with top-level TimeoutSeconds 30, StartAt GetRole and exactly ONE
      state: Type Task, Resource "arn:aws:states:::aws-sdk:iam:getRole", Parameters
      {"RoleName": "platform-security-heartbeat-canary"}, ResultPath null (discard the response),
      End true, no Retry and no Catch (a failed beat is a missing beat; the heartbeat is the
      alarm). No logging_configuration (no extra log group);
      (f) aws_scheduler_schedule_group.platform_security_heartbeat (name
      platform-security-heartbeat);
      (g) aws_scheduler_schedule.platform_security_heartbeat_canary (name
      platform-security-heartbeat-canary, group_name =
      aws_scheduler_schedule_group.platform_security_heartbeat.name, schedule_expression "rate(5 minutes)",
      state "ENABLED" written explicitly, flexible_time_window mode "OFF", target arn =
      aws_sfn_state_machine.platform_security_heartbeat_canary.arn, target role_arn =
      aws_iam_role.platform_security_heartbeat_scheduler.arn, retry_policy
      maximum_retry_attempts 2 and maximum_event_age_in_seconds 240 so a retry never spills into
      the next beat, and depends_on both aws_iam_role_policy resources so no beat fires before the
      roles' grants exist).
      Each inline policy document is hoisted into a local with a lifecycle precondition
      length(jsonencode(jsondecode(local...))) <= 10240, copying platform_security_trail.tf:169-181
      (validate_iam_policy_size fails any bootstrap aws_iam_role_policy without it). No region
      literal, no provider or alias, no file() call, no account id (ARNs interpolate
      var.aws_region/var.account_id). Header comment: why Scheduler cannot call iam:getRole directly
      (universal targets reject get*/list* verbs) and why tampering fails closed (the heartbeat counts
      delivered IAM events, not canary self-reports), and why Scheduler rather than an EventBridge
      scheduled rule (events:* sits in CI's boundary DataPlaneAllow, scheduler does not, so a rule
      would sit inside CI's reach). EventBridge Scheduler and Step Functions are
      regional in var.aws_region; the IAM call goes to the global endpoint, so the event travels the
      exact multi-region/global-events path the heartbeat proves (Decision 202 clause 4 holds).
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Modify
    purpose: >-
      (1) The heartbeat alarm becomes period 900, evaluation_periods 4, datapoints_to_alarm 4
      (written explicitly), statistic Sum, threshold 1, LessThanThreshold, treat_missing_data
      "breaching", alarm_actions and ok_actions unchanged. Its alarm_description says: no IAM event
      reached the log group in four consecutive 15-minute periods, so the detector may be blind;
      first check the platform-security-heartbeat-canary schedule state and its Step Functions
      executions (a dead canary), then AWS/Logs IncomingLogEvents on platform-security-cloudtrail
      (zero means Logs delivery is broken, non-zero means the global IAM-event path is broken); then
      the shared triage text. Keep it within the 1024-character alarm_description limit.
      (2) The heartbeat filter comment (line 35) replaces the false "hourly terraform-drift
      refresh" premise with the canary. The missing-data comment above the alarm keeps the
      blinding list and adds the stated latency.
      (3) The platform-security-detector-tamper pattern gains ONE clause, appended:
      || (($.eventSource = "scheduler.amazonaws.com") && ($.readOnly IS FALSE)). It matches any
      EventBridge Scheduler write. In practice that is the canary only: CI's permissions boundary
      excludes scheduler, PlatformDev holds no scheduler verb, and PlatformAdmin's only scheduler
      verbs are on platform-security-* schedules. A disable, update or delete of the schedule
      therefore emails within 5 minutes instead of surfacing as an unattributed heartbeat ALARM
      about an hour later. Step Functions writes are deliberately NOT added: they fail closed via the
      heartbeat, the pattern would pass 1024 characters, and the future executor state machine
      (T4.1) would make an account-wide states clause noisy. The pattern must stay <= 1024
      characters (about 845 expected).
  - file: terraform/bootstrap/platform_security_admin_policy.tf
    action: Modify
    purpose: >-
      PlatformAdmin's management authority for the canary, inside the existing managed policy
      platform-security-detector-admin (Decision 202 clauses 2-3 home; Decision 156). New Sids:
      PlatformSecurityHeartbeatStatesManage -- states:CreateStateMachine, states:UpdateStateMachine,
      states:DescribeStateMachine, states:ListStateMachineVersions, states:TagResource,
      states:UntagResource, states:ListTagsForResource, states:ListExecutions on
      arn:aws:states:${var.aws_region}:${var.account_id}:stateMachine:platform-security-*;
      PlatformSecurityHeartbeatExecutionRead -- states:DescribeExecution on
      arn:aws:states:${var.aws_region}:${var.account_id}:execution:platform-security-*:*;
      PlatformSecurityHeartbeatScheduleManage -- scheduler:CreateSchedule, scheduler:UpdateSchedule,
      scheduler:GetSchedule on
      arn:aws:scheduler:${var.aws_region}:${var.account_id}:schedule/platform-security-*/platform-security-*;
      PlatformSecurityHeartbeatScheduleGroupManage -- scheduler:CreateScheduleGroup,
      scheduler:GetScheduleGroup, scheduler:TagResource, scheduler:UntagResource,
      scheduler:ListTagsForResource on
      arn:aws:scheduler:${var.aws_region}:${var.account_id}:schedule-group/platform-security-*.
      Before writing, confirm against the terraform-provider-aws source at the version `terraform
      init` resolves for "~> 5.0" which states/scheduler calls aws_sfn_state_machine and
      aws_scheduler_schedule make on create, read and update. Add any missing read (Describe/List/Get)
      or Tag verb, stating which provider call needs it in a comment. Never add a Delete* verb (removing the
      detector is break-glass only, matching the trail/bucket/log-group convention), never a
      service wildcard, never a resource outside the platform-security-* family. The six-verb
      PlatformSecurityTrailManage Sid is untouched. Header comment updated. The rendered document stays
      within the existing 6,144 B precondition (about 2.6 KB expected, from about 2.0 KB).
      iam:PassRole for the two canary roles is already held via AdminOps IAMFull (iam:* on *).
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Modify
    purpose: >-
      Two new sanitised events (account id is the literal ACCOUNT):
      heartbeat-canary-get-role -- GetRole with requestParameters.roleName
      platform-security-heartbeat-canary, readOnly true, userIdentity an assumed-role session of
      platform-security-heartbeat-canary, invokedBy states.amazonaws.com, awsRegion us-east-1;
      must_match exactly [platform-security-iam-event-heartbeat]. It proves the canary's own beat
      never fires tamper's readOnly-false iam clause.
      heartbeat-canary-schedule-disable -- scheduler.amazonaws.com UpdateSchedule on
      platform-security-heartbeat-canary with State DISABLED, readOnly false, awsRegion the
      placeholder REGION; must_match exactly
      [platform-security-detector-tamper].
      Both are read by the ADMIN TestMetricFilter evaluation (verification step 12) and by the
      canary test (shape).
  - file: tests/checks/iam_tf/_platform_security_hcl.py
    action: Create
    purpose: >-
      Pure move (Decision 128 decompose-by-default; the alarm test is 483 of 500 SLOC) of the
      string- and comment-aware HCL helpers out of test_platform_role_iam_change_alarms.py:
      _scan, _mask, _strip_comments, _block_body, _resource_body, _resources, _local_map,
      _local_string, _attr. Unchanged bodies. Both importers use the absolute form
      from tests.checks.iam_tf._platform_security_hcl import ... so --pre test selection follows a
      helper edit. The name does not start with test_, so there is no cross-test import
      (Decision 131). Imported by both detector test modules.
  - file: tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
    action: Modify
    purpose: >-
      (1) Import the moved helpers from _platform_security_hcl (delete the local copies).
      (2) alarm_problems' heartbeat expectation becomes comparison_operator LessThanThreshold,
      treat_missing_data breaching, evaluation_periods 4, datapoints_to_alarm 4, period 900,
      statistic Sum, threshold 1, ok_actions the alerts topic. This is a TIGHTENING re-pin, not a
      loosening (Decision 181 clause 1): blinding latency drops from three empty hours to four
      empty 15-minute periods, and datapoints_to_alarm/statistic/threshold become pinned where
      they were unchecked.
      (3) Red cases: "heartbeat two periods" re-anchored to "evaluation_periods  = 4" ->
      "evaluation_periods  = 2"; NEW "heartbeat hourly period" ("period              = 900" ->
      "period              = 3600"); NEW "heartbeat M-of-N" (datapoints_to_alarm 4 -> 2). Every
      existing red case stays.
      (4) _REQUIRED_CLAUSES for the tamper filter gains '$.eventSource = "scheduler.amazonaws.com"',
      and a NEW pattern red case "scheduler clause dropped" removes it.
      (5) _DETECTOR_FILES gains platform_security_heartbeat_canary.tf, so the naming and region checks
      cover it. _NAME_ATTRS gains aws_sfn_state_machine: name, aws_scheduler_schedule: name and
      aws_scheduler_schedule_group: name, and naming_problems additionally FAILS a resource of a
      _NAME_ATTRS type whose name attribute is absent (an auto-generated name would escape the
      family), with a red case "unnamed inline policy".
      _mutating's service set gains states and scheduler. _DETECTOR_TARGETS gains the canary's
      state machine, execution, schedule, schedule-group and both role ARNs. NEW _OTHER_REDS "CI writes the canary"
      (states:UpdateStateMachine on stateMachine:platform-security-*) and "CI disables the
      schedule" (scheduler:UpdateSchedule on schedule/platform-security-*/platform-security-*).
      The module docstring notes the canary. It stays under 500 SLOC.
  - file: tests/checks/iam_tf/test_platform_security_heartbeat_canary.py
    action: Create
    purpose: >-
      Class TestPlatformSecurityHeartbeatCanary. Every predicate returns a problem list and every
      red case drives the real predicate (the alarm-test idiom; Decision 187 red-case floor).
      Predicates:
      canary_problems(canary_text) -- the seven addresses exist with the names above; the schedule is
      in the platform-security-heartbeat group, ENABLED, flexible window OFF, rate(5 minutes),
      targets the state machine through the scheduler role, retry at most 2 and max event age <=
      300, and depends_on both inline policies; the state machine is STANDARD and its role_arn is the canary role; its parsed
      definition has exactly one state, a Task whose Resource is exactly
      arn:aws:states:::aws-sdk:iam:getRole (an IAM read, so a global-service event), with RoleName
      equal to the canary role's name, no Retry/Catch, and TimeoutSeconds <= 60.
      role_problems(canary_text) -- each trust policy names exactly one service principal (states /
      scheduler) and carries aws:SourceAccount plus aws:SourceArn, whose VALUE is pinned: the
      state-machine ARN template for the canary role, the schedule-group ARN template (never a
      schedule/ ARN) for the scheduler role; the canary policy is exactly
      iam:GetRole on its own role ARN template; the scheduler policy is exactly states:StartExecution
      on the state-machine ARN template; each inline policy has the 10240 precondition.
      cadence_problems(canary_text, alarms_text) -- at least 3 beats per heartbeat period (period
      seconds / beat seconds >= 3). This invariant replaces any measured drift-gap fixture: the
      design no longer depends on GitHub's scheduler.
      admin_grant_problems(admin_text) -- every states:/scheduler: action sits in a
      PlatformSecurityHeartbeat* Sid, none is a Delete* verb or a wildcard, every Resource is a
      platform-security-* state machine, execution, schedule or schedule-group ARN template, and
      PlatformSecurityTrailManage is unchanged.
      description_problems(alarms_text) -- the heartbeat alarm_description names
      platform-security-heartbeat-canary and IncomingLogEvents, and its rendered length (literal
      text plus the triage local, with ${var.aws_region} substituted by a 14-character placeholder)
      is <= 1024.
      fixture_canary_problems(fixture_text) -- the two canary events exist with the exact
      must_match sets above.
      Red cases (at least): schedule depends_on dropped; schedule disabled; schedule in the default group; state machine role_arn
      pointing at the scheduler role; scheduler trust SourceArn on a schedule/ ARN; flexible window; slow beat rate(60 minutes) (cadence);
      sts instead of iam (aws-sdk:sts:getCallerIdentity is regional and would not prove the global
      path); iam write task (aws-sdk:iam:tagRole); a second state; Retry added; EXPRESS type; canary
      policy iam:*; canary policy Resource "*"; scheduler policy extra verb; trust without
      aws:SourceArn; trust principal "*"; admin grant Delete verb (states:DeleteStateMachine);
      admin grant outside the family (stateMachine:*); description without the canary; fixture
      canary GetRole also matching tamper.
      Imports only the moved helpers, in the absolute form from tests.checks.iam_tf._platform_security_hcl
      import ... (the fast tier's tests-helper selection channel matches absolute imports only), and defines its own constants (canary
      names, ARN templates, alarm names); it never imports from a test_ module.
  - file: config/agent/verification_registry/entries/platform-security-heartbeat-canary-declared.yaml
    action: Create
    purpose: >-
      Graduation record for verification step 1 (filename == check_id == graduation_check_id,
      Decision 176): check_id platform-security-heartbeat-canary-declared, primitive_slot
      test_selector, guard_target terraform/bootstrap/platform_security_heartbeat_canary.tf,
      guard_symbol null, plan_slug platform-security-heartbeat-canary, graduated_at the
      implementation date, graduated_by implement-agent, check_spec.node_id
      tests/checks/iam_tf/test_platform_security_heartbeat_canary.py::TestPlatformSecurityHeartbeatCanary.
      Admitted by run_differential (the test is absent at origin/main). The existing
      platform-role-iam-change-detector-declared row is NOT modified.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Human-chosen form (Step 6b, over the decision-scout's Decision 167 NOTE): ONE dated
      amendment_forms line appended inside Decision 202's section after its Related/Roadmap refs
      lines and before its closing "---", pinned blockquote_update spelling, never a mid-line splice
      of any clause (Decision 177). No new Decision number. It is a gloss, not new authority: the
      canary is the input of clause 5's already-decided heartbeat control, a detector resource
      under clause 3's platform-security-* family; its PlatformAdmin verbs land in clause 2's
      existing managed policy with no CloudTrail verb added; and the heartbeat's window was never in
      the Decision text. Draft (<= 150 words, keep the entry under the 6,144 B warning line -- 202
      is about 4,900 B):
      "> **Update (YYYY-MM-DD):** clause 5's IAM-event heartbeat no longer relies on
      terraform-drift traffic (GitHub starts that cron every 3-6 hours, so the 3 x 1 h window
      false-alarmed). platform-security-heartbeat-canary feeds it: an EventBridge Scheduler schedule
      (every 5 minutes, own schedule group) starts a Step Functions state machine whose one task is iam:GetRole on its
      own role, all in terraform/bootstrap in aws_region (clause 4 holds; the read travels the
      global-event path). The heartbeat is now Sum < 1 over four consecutive 900 s periods: blinding
      alarms 60-105 minutes after the last delivered IAM event. Canary tampering fails closed (it can
      only starve the heartbeat), and any Scheduler write also fires the tamper alarm.
      platform-security-detector-admin gains states/scheduler verbs on platform-security-* only (no
      Delete); clause 2's six trail verbs are unchanged. Residual unchanged: a ReadOnly-only selector
      change keeps reads flowing; the tamper alarm covers it. PLAN-platform-security-heartbeat-canary."
      If validate flags docs/decisions-index.json as stale, regenerate it with the repo's tooling
      (sanctioned by this row, implement-scope-boundary.yaml).
  - file: docs/plans/PLAN-platform-role-iam-change-alarms.yaml
    action: Modify
    purpose: >-
      fix_if text ONLY (command/expected untouched; fix_if is outside validate_scope_boundary's
      prohibited_field_edits; the plan is implementation_declared, so validate_vp_replay defers).
      Step 16 fix_if becomes: "The heartbeat is fed by platform-security-heartbeat-canary
      (PLAN-platform-security-heartbeat-canary), whose post-deploy steps leave it OK. Any non-OK
      heartbeat here is real: check the canary schedule state and executions, then IncomingLogEvents
      on platform-security-cloudtrail; RCA it and do not arm the variable". Step 20 fix_if gains:
      "MERGE_SHA is the squash-merge sha of PLAN-platform-security-heartbeat-canary's implementation
      PR (it carries the live detector code and the re-pinned heartbeat test), not #1283's."
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    terraform/bootstrap admin-only apply (Decision 126; terraform/bootstrap/CLAUDE.md): the PR merges
    code only; an ADMIN session applies post-merge under agent_platform_admin, human-directed at each
    phase.
  - >-
    Phase 1 (grant) must precede phase 2 (canary): PlatformAdmin holds no states:/scheduler: verb
    until aws_iam_policy.platform_security_admin's new version is live, and IAM is eventually
    consistent. Step 10's simulate gates phase 2.
  - >-
    Phase 2 (canary) must precede phase 3 (alarm plus tamper filter) by at least one hour of fed
    15-minute buckets (step 13). That way the re-shaped alarm evaluates OK the moment it lands.
    PutMetricAlarm on an existing alarm keeps its state.
  - >-
    Expected emails, each proof that the detector sees its own change: phase 1 fires
    platform-security-platform-role-iam-change (CreatePolicyVersion on
    platform-security-detector-admin); phase 2 fires platform-security-detector-tamper (CreateRole
    and PutRolePolicy on platform-security-heartbeat-* roles); phase 3 fires
    platform-security-detector-tamper (PutMetricFilter and PutMetricAlarm on platform-security-*);
    the starvation proof fires tamper (the UpdateSchedule disable, via the new scheduler clause),
    then the heartbeat's ALARM and OK pair.
  - >-
    Scheduler service, Step Functions STANDARD and the IAM global endpoint must be available in
    var.aws_region (eu-west-2: all three are). Estimated cost below 1 USD a month (roughly 26k
    state transitions, about 35k extra CloudTrail management events, about 85 MB of Logs ingestion).
acceptance_criteria:
  - >-
    terraform/bootstrap declares the canary exactly as scoped: a 5-minute ENABLED schedule with no
    flexible window, a STANDARD state machine whose single Task is aws-sdk:iam:getRole on its own
    role, a dedicated schedule group, and two least-privilege roles with SourceAccount/SourceArn-conditioned trust (the scheduler role conditioned on the schedule-group ARN) and
    size-preconditioned inline policies. All platform-security-* named, in var.aws_region only,
    and outside CI's reach.
  - >-
    The heartbeat alarm is Sum < 1 over 4 of 4 consecutive 900 s periods, breaching on missing data,
    with ok_actions, and a description that names the canary and IncomingLogEvents triage. Stated
    blinding latency: 60-105 minutes after the last delivered IAM event.
  - >-
    The tamper pattern carries the scheduler-write clause and stays <= 1024 characters. The fixture
    proves the canary's GetRole matches only the heartbeat and a schedule disable matches only
    tamper.
  - >-
    PlatformAdmin's canary verbs live only in platform-security-detector-admin: enumerated, no
    Delete*, no wildcard, platform-security-* resources only. The six trail verbs are unchanged.
  - >-
    TestPlatformSecurityHeartbeatCanary passes, and every red case is detected. It is graduated as
    platform-security-heartbeat-canary-declared.
    TestPlatformRoleIamChangeDetector, TestCloudTrailWriteGrantScoped, TestSecurityDetectorProbe
    and TestSecurityDetectorLivenessWorkflow pass. The heartbeat re-pin is a tightening, with the
    old red cases kept or re-anchored.
  - >-
    Decision 202 carries one dated Update line recording the canary, the new window and latency, the
    scheduler tamper clause and the grant. PLAN-platform-role-iam-change-alarms step 16's fix_if no
    longer says "first three hours", and step 20's fix_if names the MERGE_SHA to use.
  - >-
    After the three-phase ADMIN apply, the bootstrap converges (plan exit 0) and the canary is live
    (executions succeed, its GetRole events reach the log group and match only the heartbeat
    live). The heartbeat reads OK with its new shape, has zero to-ALARM transitions over a two-hour
    soak, and every 15-minute bucket is fed. The local probe exits 0.
  - >-
    Starvation proof: with the canary schedule disabled, tamper fires on the disable and the
    heartbeat reaches ALARM. The measured minutes from the last delivered IAM event to ALARM are
    recorded, and the probe exits 1 on "heartbeat state ALARM". After re-enable, the heartbeat
    returns to OK, the probe exits 0 and terraform shows no drift.
  - SECURITY_DETECTOR_PROVISIONED is not set by this work; hand-back is to rec-4044's step 16.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the canary declaration, its roles, cadence, grant, description and fixture events are pinned with discriminating red cases
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_platform_security_heartbeat_canary.py::TestPlatformSecurityHeartbeatCanary" -q
    expected: all tests pass (predicates clean on the tree, every red case detected)
    fix_if: a red case not detected means its predicate is too weak -- strengthen the predicate, never drop the red case
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-security-heartbeat-canary-declared
  - step: 2
    phase: pre-deploy
    action: the re-pinned heartbeat, the tamper clause, the CI-reach extension and the untouched sibling checks stay green
    command: >-
      bin/venv-python -m pytest
      "tests/checks/iam_tf/test_platform_role_iam_change_alarms.py::TestPlatformRoleIamChangeDetector"
      "tests/checks/iam_tf/test_cloudtrail_write_grant_scoped.py::TestCloudTrailWriteGrantScoped"
      "tests/test_security_detector_probe.py::TestSecurityDetectorProbe"
      "tests/test_security_detector_liveness_workflow.py::TestSecurityDetectorLivenessWorkflow" -q
    expected: all pass, including the new heartbeat hourly period / M-of-N / scheduler clause dropped / CI writes the canary red cases
    fix_if: a heartbeat expectation failing against the new HCL means the HCL and the pin disagree -- fix the HCL to the scoped shape, never widen the pin
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      All four classes are already graduated (platform-role-iam-change-detector-declared,
      cloudtrail-write-grant-scoped-to-platform-trail, security-detector-probe-fails-closed,
      security-detector-liveness-workflow-read-only); their registry rows keep running them, so a
      second row would duplicate them.
  - step: 3
    phase: pre-deploy
    action: the false hourly-drift premise and the three-hour wording are gone, and Decision 202 carries the canary note
    command: >-
      ! grep -n "hourly terraform-drift refresh" terraform/bootstrap/platform_security_alarms.tf &&
      ! grep -n "for three hours" terraform/bootstrap/platform_security_alarms.tf &&
      ! grep -n "first three hours after step 14" docs/plans/PLAN-platform-role-iam-change-alarms.yaml &&
      awk '/^## Decision 202:/{f=1;next} f&&/^## Decision /{exit} f' docs/DECISIONS.md | grep -q "platform-security-heartbeat-canary" &&
      echo "HEARTBEAT PREMISE CURRENT"
    expected: prints the marker (no stale premise text, and Decision 202's section names the canary)
    fix_if: a grep hit names the stale site -- rewrite it to the canary premise
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time sweep over this diff's own wording (comments, description, a plan fix_if and a
      Decision line); prose wording is not a standing regression target.
  - step: 4
    phase: pre-deploy
    action: provider-free formatting of the bootstrap root (validate/plan are CI-delegated, Decision 119)
    command: terraform fmt -check -recursive terraform/bootstrap && echo "BOOTSTRAP FMT OK"
    expected: exit 0 with the marker; CI's required terraform-validate check runs init -backend=false + validate on terraform/bootstrap as the authoritative verifier of the new resource schemas
    fix_if: run terraform fmt on the named file; a CI terraform-validate failure on an aws_sfn_state_machine/aws_scheduler_schedule argument is fixed against the provider schema, never by dropping the argument's intent
