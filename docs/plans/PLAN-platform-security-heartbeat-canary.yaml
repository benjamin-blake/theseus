rollback: >-
  Code: revert the PR. Live: before phase 3, the old alarm still stands and the canary is harmless
  extra feed. After phase 3, a misbehaving canary is disabled with scheduler:UpdateSchedule (the
  heartbeat then starves and alarms, so re-apply the old alarm shape from a revert PR through the
  same human-directed ADMIN apply). Deleting the canary's state machine or schedule needs a
  deliberate break-glass grant: no Delete verb is standing, by design.
