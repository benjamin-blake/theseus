constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    TWO-FIELD ENTRIES, NEVER A COMBINED STRING. dependency_graph.py:30's _PATCH_STRING_RE is
    anchored `^(src|scripts)(\.\w+)+$`. A bare module path matches; "module:attr" does NOT. A
    combined form silently severs every driver->check graph edge with no error anywhere.
  - >-
    MANIFESTS MUST BE PYTHON with BARE STRING LITERALS. The graph's scanner is an AST pass over
    ast.Constant nodes, so YAML/JSON manifests are invisible to it and an f-string or computed
    constant matches nothing. Equally: do NOT derive the path at the check's own site --
    @register(module=__name__) yields only a self-edge and drops the driver edge entirely.
  - >-
    resolve() MAY cache the imported module; it must NEVER cache the resolved callable. Verified
    empirically this session: late-bound getattr intercepts a patch on the defining module, a
    warm callable cache does not. A warm cache turns every mock-based check test into a vacuous
    pass inside a merge gate.
  - >-
    all_checks()'s eager population happens AT CALL TIME INSIDE THE FUNCTION, never at registry.py
    module import. Every check module does `from scripts.checks import registry`, so a module-level
    import of check modules in registry.py is a genuine circular import -- and it would also break
    step 1's leak-set equality by pulling every check into scripts.validate's import closure.
  - >-
    @registry.register (97 sites) is RETAINED as the identity/ownership oracle and is the only
    sound oracle for orphan detection. Laziness is required ONLY on the dispatch path; roster
    queries (all_checks) get an explicit eager-population contract, because
    validate_ci_rca_taxonomy.py:38 and contracts/_population.py:244 both need a complete roster.
    all_checks() must keep returning a MUTABLE dict[str, Check], not a set or frozenset: the
    graduated row ci-rca-taxonomy-covers-registry (registry.yaml:4246, NOT the adjacent
    ci-rca-every-registered-check-categorised, which is set-safe) does
    `checks_copy = registry.all_checks(); checks_copy['<fake>'] = Check(...)`, so a set-returning
    implementation satisfies the acceptance criterion and silently breaks that row.
  - >-
    BYTE-PARITY ON TIER ORDER IS UNACHIEVABLE and must not be claimed. full_sequence today is 93
    checks over 18 domains in 45 non-contiguous runs (ops_governance alone in 7); domain-block
    derivation yields 18 contiguous blocks. MEMBERSHIP parity IS required and is asserted; order
    is re-derived once, with OD-0..OD-6 pinned as explicit assertions.
  - >-
    Do NOT create a golden/generated sequence file. Without a "GENERATED -- DO NOT EDIT" banner it
    classifies as residual at 500 and grows ~2.6 lines/check -- a worse slope than the facade it
    replaces. Order is derived from manifests plus the retained scaffold-anchor skeleton.
  - >-
    The full tier is NOT one check block. Six scaffold anchors partition it into six check
    segments, with checks pinned BETWEEN scaffolds (validate_iam_runner_policy after
    terraform_checks; validate_requirements after dependency_health; the four prompts-block
    checks; validate_verification_harness after ensure_fresh_dq). Entry carries an explicit
    segment; registry.py retains the skeleton. Derivation may only reorder WITHIN a segment.
  - >-
    scripts/validate.py's _common/_scaffolding re-exports (lines 42-62) STAY. They back ~60 live
    patch targets (shutil, subprocess, time, _file_budget_*, run_*, validation_result). Only the
    CHECK facade block (lines 63-261) is deleted -- NOT lines 263/269, which are the live
    _FAST_TIER_BUDGET_SECONDS and _FORCED_FULL_SUITE_CEILING_SECONDS constants. Step 9's positive scaffold-count assertion is
    what catches deleting the wrong block.
  - >-
    REPLACE, don't port, the reachability tests. TestFacadeCompleteness asserts a contract this PR
    abolishes; porting it forward would re-pin the mechanism being removed.
  - >-
    Decisions 162 and 163 are amended with an `Amended by Decision N` blockquote; their existing
    reversal sentences are NOT edited in place. The corpus is amend-only (Decision 134/145
    convention, as Decision 165's own amendments demonstrate). The corrected reversal path lives
    in the new entry's body.
  - >-
    Decision 150/167 routing: the Entry field grammar is FIELD SEMANTICS and belongs in
    docs/contracts/check-manifest.yaml, not in the Decision body. The Decision carries rationale
    and precedent only, plus the Decision 167 yaml envelope with a significance routing claim.
  - >-
    ONE SSOT for the grammar. _schema.py's docstring carries a pointer to the contract, never a
    second copy; validate_check_manifests derive-and-asserts that the two segment-token sets are
    EQUAL rather than restating either.
  - >-
    Every future edit to docs/contracts/check-manifest.yaml requires a new amendment_log[] entry
    (contract-population.yaml change_detection.amendment_log) -- a comment/format-only edit does
    not, but any canonical-dump change does. Stated here so the first grammar tweak does not fail
    mysteriously.
  - >-
    Graduated node_ids must be preserved verbatim or deliberately repointed in the SAME commit --
    a rename silently orphans a row, and validate_verification_registry differentials only
    newly-added rows.
  - >-
    OD-0 PINS THE DOMAIN ORDER, without which the derivation is UNDETERMINED and two implementers
    produce different rosters: within a segment, domain blocks are ordered by FIRST APPEARANCE of
    that domain WITHIN THAT SEGMENT of the pre-change sequence -- NOT first appearance globally in
    the tier. The two readings diverge concretely in the prompts segment (whose checks span deps,
    prompts, ci_guards and contracts): the global reading reorders it, the within-segment reading
    leaves it as-is. Unique by construction under either reading, so only naming which one is
    intended makes the derivation deterministic. OD-1..OD-6 constrain within-domain and cross-segment order only.
  - >-
    NON-CIRCULAR ORACLES ARE MANDATORY, and are the subtlest way this plan can ship a vacuous gate.
    (a) The bijection oracle enumerates registered checks by FILESYSTEM + AST walk over
    scripts/checks/**/*.py, never by importing manifest-declared modules -- the latter makes a
    registered-but-unmanifested check invisible to its own guard. (b) The graph-edge test reads
    Entry.module at RUNTIME by importing the manifest, never by AST -- the edge is produced by an
    AST pass over those same constants, so an AST-vs-AST comparison cannot fail.
  - >-
    AT MOST THREE hermetic VP steps. validate_vp_replay.py:63 sets MAX_AGGREGATE_SECONDS = 120 and
    :207-212 appends to `failed` on breach -- a HARD failure, not a benign stop, shared across every
    plan in the diff. Steps 1, 9 and 12 are hermetic (each a pytest-free one-liner, measured at roughly 1-2s: step 9 eagerly imports the check roster, rglobs tests/ and regexes a ~5000-line registry.yaml, so it is not sub-second);
    every pytest invocation, graph build and contract-drift run is hermetic: false with a printed
    reason. Adding a fourth hermetic step risks a deterministic PR wedge no implementation fix
    addresses.
  - >-
    THE FACADE-CONSUMER CENSUS IS BY NAME, NOT BY patch() SYNTAX. The authoritative set is the 120
    names the deleted block exports, matched as `_validate.<name>`, `_validate_module.<name>`,
    `patch("validate.<name>")`, `from scripts.validate import <name>`, across tests/ AND
    config/agent/verification_registry/. Measured: 36 sites in 10 files outside the deleted
    monolith, of which only 12 are patch() calls -- the dominant form is a module-level attribute
    BINDING that raises AttributeError at import. A patch()-only sweep certifies a cutover it never
    performed.
  - >-
    config/coverage_baseline.yaml:20 pins scripts/validate.py at 80.7 and the 187 deleted lines are
    all covered imports, so the pin becomes unmeetable. Lower it with an inline
    `# baseline-lowered: dec-NNN <reason>` marker naming this PR's new Decision -- the guard is
    scripts/checks/misc/coverage_baseline.py:169-176 (token `baseline-lowered`, gated_direction
    down). The marker's authorizing Decision is resolved KEY-SIDE by _marker_guard, so the new
    Decision's body must contain the literal string `scripts/validate.py` or the lowered entry is
    rejected as unauthorized. Every other new source file has NO baseline entry and therefore defaults to 100% per-file
    coverage, so each mirror test must actually cover its module, not merely exist.
  - >-
    validate_check_manifests must be tier-SEQUENCED in both tiers, not merely registered:
    contract-population.yaml's evaluator_kinds.check requires membership in all_checks() AND in a
    tier sequence, so a registered-but-unsequenced evaluator fails Class D resolution. Its Entry and
    its @register must land in the same commit, and sequencing must precede any
    validate_contract_drift run.
  - Do NOT author a diff-allowlist VP step. This PR legitimately changes runtime code; PR1's allowlist step has no analogue here and a hermetic allowlist step would wedge the PR under validate_vp_replay.
