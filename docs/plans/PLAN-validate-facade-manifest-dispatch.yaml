acceptance_criteria:
  - scripts/validate.py contains zero `from scripts.checks.<domain>.<module> import` statements and is at or below 320 SLOC, with no entry added to config/sloc_budgets.yaml.
  - Importing scripts.validate imports exactly ONE check module -- scripts.checks.iam_tf.validate_terraform_try, reached eagerly via the retained _scaffolding -> _terraform.py:23 import -- and no other. The leak set is asserted by EQUALITY against that declared exception, so both a new leak and the exception's disappearance are caught. This is what makes the venv-less terraform-validate required check robust.
  - Dispatch resolves the defining module at call time, so patching that module intercepts; the resolved callable is never cached, proven by a negative control that fails if a warm cache is introduced.
  - Every @register'd check name has exactly one manifest Entry and vice versa, with exactly one declared unsequenced exception (validate_terraform_try); no duplicate names; no manifest names a module outside its own domain package.
  - registry.all_checks() returns the complete roster without importing scripts.validate, and its contents equal the union of manifest-declared names -- asserted by set identity, never by a hardcoded count.
  - Every Entry.module is a plain string constant that resolves to a real dependency-graph node, enforced by a registered check (not prose), which fails on an f-string, a colon form, and an unresolvable module.
  - The driver->check graph edges the manifests produce equal the set of declared Entry.module values -- compared by edge IDENTITY, not cardinality.
  - Under a ~20-file synthetic check-module diff, the affected-set selector still selects the manifest/registry tests despite CAP=35 truncation; a one-file sentinel is explicitly NOT accepted as evidence.
  - Tier check-name MEMBERSHIP is preserved exactly for both tiers against a baseline captured before editing; scaffold anchors keep their exact frozen order; and ordering dependencies OD-0..OD-6 hold. Byte-parity of check ORDER is explicitly NOT claimed.
  - >-
    ZERO of the 120 facade-exported names is still consumed anywhere outside the deleted
    monolith, in ANY form -- `_validate.<name>`, `_validate_module.<name>`,
    `patch("validate.<name>")`, `from scripts.validate import <name>`, or an embedded command
    in the verification registry. The census is resolved against the deleted import set,
    never against a `validate_`/`_check` name prefix. The ~90 scaffolding/stdlib patch sites
    still resolve, asserted non-empty so the sweep cannot pass vacuously.
  - tests/test_checks_registry.py is deleted, its dec-159 budget entry is removed, and the _CHECKS_REGISTRY_MECHANISM_FILES special case is gone -- discharging Decision 159's stated retirement condition.
  - Every graduated registry row referencing an in-scope path either still resolves or is deliberately retired in this PR, with the choice recorded -- including the four literal-path rows enumerated in context.
  - docs/contracts/check-manifest.yaml passes validate_contract_drift as a declared Class D contract whose evaluator demonstrably reads it.
  - The new Decision carries the Decision 167 yaml envelope with a significance routing claim; Decisions 162 and 163 gain `Amended by` blockquotes with their existing reversal sentences byte-unchanged; docs/decisions-index.json is regenerated.
  - The full presubmit tier passes and emits the same check roster as a baseline captured before editing.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Importing scripts.validate leaks exactly the ONE declared check module, and no other.
    command: >-
      bin/venv-python -c "import importlib,sys; importlib.import_module('scripts.validate'); leaked={m for m in sys.modules if m.startswith('scripts.checks.') and m.count('.')>=3 and not m.rsplit('.',1)[1].startswith('_')}; allowed={'scripts.checks.iam_tf.validate_terraform_try'}; print('leaked:',sorted(leaked)); assert leaked==allowed, ('leak set != declared exception set; symmetric difference:', sorted(leaked^allowed))"
    expected: >-
      The leak set EQUALS {scripts.checks.iam_tf.validate_terraform_try}. That one module is reached
      eagerly through the RETAINED scripts/checks/_scaffolding.py -> _terraform.py:23 import, which
      is out of scope to change. Equality (not subset) is deliberate: a new leak fails, and so does
      the exception silently disappearing, which would mean _terraform stopped importing it.
      A bare python -c invocation is already a fresh interpreter, so no subprocess is needed.
    fix_if: >-
      Any additional module means some path still eagerly binds check modules, so the venv-less
      terraform-validate job (which installs only pyyaml and pydantic, ci.yml:288) still depends on
      every check's transitive imports and the facade was only syntactically removed.
    hermetic: true
    graduation: graduate
    graduation_check_id: "validate-import-closure-excludes-check-modules"
  - step: 2
    phase: pre-deploy
    action: Dispatch itself is late-bound -- patching the defining module intercepts THROUGH _dispatch_check.
    command: 'bin/venv-python -m pytest tests/checks/registry/test_resolution.py -q'
    expected: >-
      The decisive assertion drives a ONE-CHECK TIER end to end -- select_steps from PR1's
      tests/fixtures/pre_sequence_stub.py, patched over registry.pre_sequence, run through
      scripts.validate.main() -- while the check's DEFINING module is patched, and observes the
      patch. Calling _dispatch_check directly is NOT sufficient: a `_DISPATCH` table built at
      main() entry is still EMPTY at that point, so a direct call resolves live and passes while
      the real dispatch path no-ops. A second
      assertion rebinds the module attribute between two dispatches and requires the second to see
      the new object. An unknown name raises a named error.
    fix_if: >-
      Testing registry.resolve alone is insufficient and would pass over a real defect: an
      implementation that builds `_DISPATCH = {n: registry.resolve(n) for n in seq}` once at main()
      entry keeps resolve() late-bound and non-caching while every repointed patch silently no-ops.
      The test must therefore exercise the dispatch path, not the resolver.
    hermetic: false
    graduation: graduate
    graduation_check_id: "registry-resolve-is-late-bound"
  - step: 3
    phase: pre-deploy
    action: Manifest/@register bijection, proven against an INDEPENDENT oracle -- not against the manifests themselves.
    command: 'bin/venv-python -m pytest tests/checks/registry/test_manifest_contracts.py -q'
    expected: >-
      The registered-name oracle is a FILESYSTEM + AST walk over scripts/checks/**/*.py collecting
      @register(...) call sites -- the idiom in contracts/_population.py::_find_check_module and its
