    contain exactly one entry with the expected value. ALSO ASSERTS THE AMENDMENT_LOG REFLOW IS
    PARSE-IDENTICAL against origin/main -- see the F1 interaction note in constraints: a LOSSY
    reflow makes a reworded old entry count as "new" under check_amendment_log_for_class_d's dict
    equality, which would vacuously discharge the Class D obligation. AND the NON-TRIVIALITY FLOOR
    on the prose fields (>= 40 stripped chars, not equal to the kind name, on_exhaustion !=
    rationale), which is the cheap stronger-than-existence test both critique halves independently
    identified -- it costs no new declaration surface.
  command: >-
    bin/venv-python -c "import yaml,pathlib,subprocess;
    tax=yaml.safe_load(pathlib.Path('config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8'));
    caps=tax['workflows']['CI RCA']['agent_loop_caps'];
    mt=[x for x in caps if x.get('kind')=='max_turns']; assert len(mt)==1, caps; c=mt[0];
    assert c['value']==30, c;
    floor=lambda s,k: isinstance(s,str) and len(s.strip())>=40 and s.strip().lower()!=k;
    assert floor(c['on_exhaustion'],'max_turns') and floor(c['rationale'],'max_turns'), c;
    assert c['on_exhaustion'].strip()!=c['rationale'].strip(), c;
    assert 'site' not in c and 'pattern' not in c, 'taxonomy row must not name a site or pattern';
    ct=yaml.safe_load(pathlib.Path('docs/contracts/composite-action-shape.yaml').read_text(encoding='utf-8'));
    a=[x for x in ct['agent_loop_caps'] if x.get('site')=='.github/actions/subagent-plan-review/review.sh'
    and x.get('kind')=='max_turns']; assert len(a)==1, ct['agent_loop_caps'];
    assert a[0]['value']==5, a;
    assert floor(a[0]['on_exhaustion'],'max_turns') and floor(a[0]['rationale'],'max_turns'), a;
    assert a[0]['on_exhaustion'].strip()!=a[0]['rationale'].strip(), a;
    assert 'consumers' not in a[0], 'consumers would be a non-derived second surface';
    m=[e for e in ct['amendment_log'] if 'agent_loop_caps' in str(e.get('summary',''))];
    assert len(m)==1, [e.get('date') for e in ct['amendment_log']];
    assert m[0]['change_class']=='field_add' and m[0]['semantic_break'] is False, m[0];
    lc=yaml.safe_load(pathlib.Path('docs/contracts/ci-rca-lifecycle.yaml').read_text(encoding='utf-8'));
    w=lc['watched_workflow_set'];
    assert 'agent_loop_caps' in w['source_of_truth_field'], w['source_of_truth_field'];
    assert w['source_of_truth_field'].split(':',1)[0].strip()=='workflows', w['source_of_truth_field'];
    assert 'agent_loop_caps' in w['note'] and 'on_exhaustion' in w['note'], w['note'];
    lm=[e for e in lc['amendment_log'] if 'agent_loop_caps' in str(e.get('summary',''))];
    assert len(lm)==1, [e.get('date') for e in lc['amendment_log']];
    assert lm[0]['change_class']=='field_add' and lm[0]['semantic_break'] is False, lm[0];
    base=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/ci-rca-lifecycle.yaml'],
