    '.claude/skills/implement/SKILL.md','.claude/skills/overseer/SKILL.md'};
    companion=lambda p: p.startswith('config/agent/verification_registry/entries/') or p=='docs/decisions-index.json';
    bad=sorted(t&forbidden); extra=sorted(p for p in t if p not in declared and not companion(p));
    assert not bad, ('forbidden_touched', bad); assert not extra, ('outside_declared_scope', extra);
    print('SCOPE_OK', len(t))"
  expected: >-
