schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: declared-caps
intent: >-
  Give every agentic-loop iteration cap under .github/ a declared row carrying its value, its
  exhaustion behaviour and its rationale, DERIVED-AND-ASSERTED against the live literal so the
  declaration can never be satisfied by editing itself: the literal is truth, the row is a pinned
  mirror, and CI proves them equal in both directions plus proves the census complete. Closes audit
  finding LSA-05 by extending two registers that already exist -- config/ci_rca_taxonomy.yaml's
  workflows rows and docs/contracts/composite-action-shape.yaml -- and two checks that are already
  registered. No new contract file, no new registry, no new roster, no new registered check.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-declared-caps.yaml
phase: >-
  Loop-governance hardening -- the undeclared-cap residual of audit finding LSA-05
  (audits/loop-spec-adoption-4d8bac4a.yaml), classified novel with item_ids: [] ("No owner for cap
  declaration"). Ad hoc, soft-warn category ad_hoc_rec: NO tier_item is claimed, no roadmap row is
  added and no exit criterion is closed, so this plan declares no closes_criteria and does not touch
  docs/ROADMAP-PLATFORM.yaml. Non-keystone slice of the loop-spec-adoption wave, running CONCURRENTLY
  with the LSA-03 red-case-floor slice; the concurrency exclusions are declared in constraints and
  asserted by VP step 8.
scope:
- file: scripts/ci_rca/taxonomy.py
  action: Modify
  purpose: >-
    Adds enumerate_workflow_name_paths(workflows_dir=None) -> list[tuple[str, Path]] and RE-EXPRESSES
    the existing enumerate_workflow_names as a projection over it ([name for name, _ in ...]). The
    point is single-source enumeration: the cap census keys on FILE PATH while the taxonomy rows key
    on workflow display NAME, so something must map one to the other, and a second independent glob
    would be precisely the drift-by-second-surface the governing audit rejects P1 for. Behaviour of
    enumerate_workflow_names must be BIT-IDENTICAL after the change -- same sorted(glob("*.yml"))
    order, same "append only when the parsed mapping has a name key" rule, same broad
    except/logger.warning on an unparseable file -- because the two-way census in
    validate_ci_rca_adjudication group (a) is built on it. No new import, no I/O beyond the glob it
    already performs.
- file: scripts/checks/ci_guards/_agent_loop_caps.py
  action: Create
  purpose: >-
    The shared, check-side cap grammar and comparator -- a leading-underscore helper module, NOT a
    registered check, so it adds no _manifest.py Entry, no registry name, no check-accounting roster
    row and no function_to_category row. Owns THREE things. (1) The extraction grammar, which is
    CHECK-SIDE ON PURPOSE: the declaration rows never name a regex or a line number, only a value, so
    an author cannot retarget the derivation to dodge a mismatch. It resolves --max-turns <token> in
    two forms -- an inline integer, and a shell-variable reference ($VAR / "$VAR" / "${VAR}") looked
    up against VAR=<int> assignments in the SAME file (this is the review.sh:68 shape, where one
    MAX_TURNS=5 feeds two invocations at lines 72 and 78). (2) FAIL-CLOSED unresolvability: a token
    that is neither an integer nor a same-file-resolvable variable, and a file yielding two DIFFERENT
    values for one kind, both produce a failure string rather than silently dropping out of the
    census -- otherwise "move the literal somewhere the grammar cannot read" is a free escape from
    declaration. (3) The two-way comparator over {repo-relative file: {kind: value}}: discovered but
    undeclared FAILS, declared but not discovered FAILS (stale row), both present with unequal values
    FAILS. Scans .github/workflows/**.{yml,yaml} and .github/actions/**.{yml,yaml,sh}; the two
    regions partition that population totally, so every discovered cap is owned by exactly one of the
    two callers and none can fall between them. Exactly one governed kind today, max_turns -- the
    agentic-loop turn budget the finding names. Job-level timeout-minutes is DELIBERATELY NOT a
    governed kind (see constraints). Filesystem reads only; no subprocess, no network (Decision 153
    fast-tier budget). PUBLIC SURFACE, named here because the
    verification plan calls it verbatim: scan_cap_literals(root) -> (dict[str, dict[str, int]],
    list[str]) returns the discovered census keyed by repo-relative POSIX path plus the
    unresolvable-literal error strings, and compare_caps(declared, discovered, region_label) ->
    list[str] returns the two-way failure strings. Both take an explicit root so every red path is
    exercisable against a synthetic tree.
- file: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
  action: Modify
  purpose: >-
    Gains assertion group (d), the workflow-region half. Builds the declared map by walking the
    taxonomy workflows rows for an optional agent_loop_caps list and resolving each row KEY to its
    file through enumerate_workflow_name_paths -- so the taxonomy row declares no site of its own,
    because the row key already is the site; value and kind are the only pinned data, on_exhaustion
    and rationale the only prose. Then compares against the discovered workflow-region census.
    Group-shape assertions mirror the existing group (c) posture: kind must be a governed kind, value
    must be an int, on_exhaustion and rationale must be non-empty strings. Placement is AFTER the
    existing early-return chain so a broken census cannot mask a coverage or filter failure, and its
    failures append to the same failed list. Its docstring's "Three assertion groups" line becomes
    four. Nothing about ci_rca/watched/owner/rationale changes, and the two-way workflow census is
    untouched -- this check's actual subject has always been "the taxonomy's rows are true of the
    repo", and a cap row is one more row that must be true.
- file: scripts/checks/contracts/validate_composite_action_shape_rosters.py
  action: Modify
  purpose: >-
    Gains assertion group 5, the action-region half, in the check whose entire existing job is
    "composite-action-shape.yaml's declared registries genuinely equal the live surfaces they claim
    to describe" -- the same derive-and-assert posture as its four current groups. Reads the
    contract's new top-level agent_loop_caps list, where each entry names an explicit repo-relative
    site (the contract has no per-action key to imply one, unlike the taxonomy row) plus kind, value,
    on_exhaustion and rationale, and compares against the discovered action-region census. Imports
    the helper cross-domain as `from scripts.checks.ci_guards._agent_loop_caps import ...` inside the
    check body -- the SAME cross-domain shape this file already uses at :178 for
    _workflow_shell_bodies._KNOWN_BASELINE_SECTIONS, so it introduces no new layering precedent.
    Follows the file's own decomposition convention (one helper per assertion group returning
    (failures, examined_count), aggregated by the registered check) so per-file complexity stays
    inside Decision 43.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    The `CI RCA` workflow row gains an agent_loop_caps list with one entry -- kind max_turns, value
    30, plus on_exhaustion (the || true mask followed by the deterministic ALL FILED marker gate,
    which is what actually happens when the budget runs out) and rationale (why 30 and not 5: a
    multi-bundle RCA agent reads logs, greps and files through the portal, against a five-turn
    read-only single-verdict reviewer). A comment block above `workflows:` carries the field
    semantics collocated with the enforcement that reads them (AGENTS.md agent-first rule; Decision
    86/127 routing), explicitly including the invariant that the row NEVER names a site or a pattern
    -- the key implies the file and the check owns the grammar. This is the ONLY edit to this file:
    function_to_category, step_name_to_category, log_pattern_to_category, failure_categories and
    every other workflow row are untouched (see constraints -- this file is the live collision
    surface with the concurrent LSA-03 slice).
- file: docs/contracts/composite-action-shape.yaml
  action: Modify
  purpose: >-
    Gains a top-level agent_loop_caps section, sibling to `rules:`, with one entry for
    .github/actions/subagent-plan-review/review.sh -- kind max_turns, value 5, on_exhaustion naming
    the actual STARVED path (one retry at the SAME budget, never larger, T2.39 c2; a second
    starvation blocks apply WITHOUT latching the convergence record red, Decision 55 anti-masking)
    and rationale. This is the finding's own named home for shared-action caps, and the file already
    carries a live precedent for pinning facts about a real file (known_r1_violators' keys and
    pinned_lines, three-way asserted), so the section extends an established shape rather than
    inventing one. Deliberately NO consumers: list of the two consuming workflows: it would be
    derivable from the live `uses:` edges and therefore either a second unasserted surface or extra
    assertion cost for no acceptance-criteria value -- the audit's own NS6 argument against
    non-derived declaration fields. Because this is a Class D contract, the parsed-content change
    REQUIRES a new amendment_log[] entry (change_class field_add, semantic_break false) whose summary
    names agent_loop_caps -- otherwise
    scripts/checks/contracts/_population.check_amendment_log_for_class_d fails the PR.
- file: tests/ci_rca/taxonomy/test_load_and_classify.py
  action: Modify
  purpose: >-
    Adds the single-source parity tests: enumerate_workflow_name_paths returns pairs whose name
    projection is EXACTLY equal (order included) to enumerate_workflow_names over the same directory;
    a .yml with no `name:` key is omitted from BOTH; an unparseable .yml is skipped by BOTH without
    raising; each returned path exists and is the file the name was read from.
- file: tests/checks/ci_guards/test__agent_loop_caps.py
  action: Create
  purpose: >-
    The grammar and comparator red/green matrix against synthetic trees -- the known-bad fixtures
    this guard owes NS3. Green: an inline `--max-turns 30`; a var-indirect `--max-turns "$MAX_TURNS"`
    with MAX_TURNS=5 in the same file; the review.sh shape where TWO invocations share ONE
    assignment, yielding one value and not a conflict. Red (each asserting a NON-EMPTY failure list,
    since a guard that cannot fail is the defect this plan exists to prevent): an unresolvable token
    (a variable with no same-file assignment, and a computed/interpolated token); one file yielding
    two DIFFERENT values for one kind; a discovered cap with no declared entry; a declared entry
    whose site carries no live literal; a value mismatch in each direction; a declared entry with a
    blank on_exhaustion, a blank rationale, an unknown kind, or a non-int value.
- file: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
  action: Modify
  purpose: >-
    Adds a TestAgentLoopCapsGroup class extending the file's existing monkeypatch-a-synthetic-tmp-tree
    pattern (_patch_taxonomy already sets scripts.ci_rca.taxonomy.ROOT to tmp_path), plus a patch of
    enumerate_workflow_name_paths. Cases: a row declaring value 30 against a synthetic workflow
    carrying `--max-turns 30` PASSES; bumping the literal alone FAILS; bumping the row alone FAILS; a
    synthetic workflow carrying a cap with no agent_loop_caps on its row FAILS (undeclared); a row
    declaring a cap whose workflow file carries none FAILS (stale); a workflow file with NO `name:`
    key that carries a cap FAILS rather than escaping the census; and the pre-existing coverage,
    filter and entry-shape assertions still pass unchanged with the new group present.
- file: tests/checks/contracts/test_validate_composite_action_shape_rosters.py
  action: Modify
  purpose: >-
    Adds the action-region mirror of the same red/green matrix against a synthetic
    .github/actions/<name>/<file>.sh tree plus a synthetic contract document: match passes, literal-only
    bump fails, declaration-only bump fails, undeclared literal fails, stale declaration fails, blank
    on_exhaustion or rationale fails. The four pre-existing roster-parity groups must still pass.
- file: docs/plans/PLAN-declared-caps.yaml
  action: Create
  purpose: This plan document.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  THE AUDIT'S LITERAL ACCEPTANCE: changing --max-turns in .github/workflows/ci-rca.yml without
  updating its declared taxonomy row fails the build. Proven against the REAL file contents copied
  into a temporary tree and mutated (VP step 6), not only against synthetic fixtures.
- >-
  NON-VACUOUS IN BOTH DIRECTIONS, which is what "the declared row and the literal cannot restate
  each other" means operationally: editing ONLY the taxonomy row's value (literal untouched) also
  fails. The declaration is therefore unsatisfiable by editing itself; the live literal is truth and
  the row is a pinned mirror the check derives and compares, exactly as check-manifest.yaml pins
  scripts.checks._schema.SEGMENT_TOKENS. Both directions are asserted in one command in VP step 6.
- >-
  THE CENSUS IS COMPLETE, NOT JUST CONSISTENT: a cap literal added anywhere under .github/workflows/
  or .github/actions/ with no declared row FAILS, and a declared row whose site carries no live
  literal FAILS. A workflow .yml with no `name:` key that carries a cap FAILS rather than escaping
  the census by being unnameable.
- >-
  FAIL-CLOSED ON UNREADABLE CAPS: a --max-turns token that is neither an integer nor a
  same-file-resolvable shell variable FAILS, and so does a single file yielding two different values
  for one kind. Obfuscating a cap out of the grammar's reach reddens the build instead of removing
  the cap from governance.
- >-
  The declared value on each side EQUALS the live literal at landing: 30 for
  .github/workflows/ci-rca.yml (the `CI RCA` row) and 5 for
  .github/actions/subagent-plan-review/review.sh, with the action-side value resolved THROUGH the
  MAX_TURNS=5 assignment feeding both invocations, not read off either invocation line.
- >-
  NON-VACUITY ON THE LIVE TREE: running both checks against the real repository reports a census that
  actually contains those two sites (VP step 5 asserts their presence, not merely "no failures") --
  so a green result cannot mean "the scanner found nothing".
- >-
  Every declared cap entry carries a non-empty on_exhaustion and a non-empty rationale, and blanks in
  either FAIL. These are declared as REVIEW SURFACE, not as derived facts: this plan claims no
  machine check on whether the prose is true, only that a cap cannot exist undeclared and
  unexplained. The honest residual is recorded in context.
- >-
  ZERO NEW REGISTRATION SURFACES: no scripts/checks/*/_manifest.py Entry is added, no registry name,
  no validate_check_accounting roster row, no config/ci_rca_taxonomy.yaml function_to_category row,
  and no docs/contracts/*.yaml file is created. Both assertion groups land inside checks that are
  already registered with pre=True and pre_globs=None, so they already run unconditionally in --pre
  and no pre_globs edit is required.
- >-
  Interactive-skill budgets stay in their skills: .claude/skills/implement/SKILL.md's 3-fix-attempt
  budget and .claude/skills/overseer/SKILL.md's G0/G3 watchdog are OUT OF SCOPE by the governing
  audit's own ruling ("prompt semantics, not workflow config"), and both skill files are untouched.
  This is a declared boundary, not an omission.
- >-
  docs/contracts/composite-action-shape.yaml carries a NEW amendment_log entry whose summary names
  agent_loop_caps, with change_class field_add and semantic_break false. Asserted on the entry's
  CONTENT, never on its date -- a date assertion can be satisfied for free by a concurrent commit.
- >-
  scripts/ci_rca/taxonomy.py's enumerate_workflow_names is behaviour-identical after the refactor:
  its name projection over enumerate_workflow_name_paths equals its previous output exactly, order
  included, and both skip a nameless or unparseable .yml identically.
- >-
  No file crosses 500 SLOC and config/sloc_budgets.yaml is untouched (Decision 128 decompose-by-default;
  measured headroom at planning time: taxonomy.py 312, validate_ci_rca_adjudication.py 90,
  validate_composite_action_shape_rosters.py 200).
- >-
  Per-file coverage stays at 100% for all four changed Python sources; config/coverage_baseline.yaml
  is untouched and no new baseline entry is registered to get under the bar.
- >-
  CONCURRENCY: .github/workflows/**, .github/actions/**, scripts/checks/*/_manifest.py,
  scripts/checks/hygiene/validate_check_accounting.py, config/ci_rca_taxonomy.yaml's
  function_to_category block, docs/DECISIONS.md, docs/ROADMAP-PLATFORM.yaml, config/sloc_budgets.yaml
  and config/coverage_baseline.yaml are ALL untouched. The literals this plan governs are read, never
  edited -- a plan that declares caps must not also move them.
- >-
  bin/venv-python -m scripts.checks.deps.selection_budget --plan docs/plans/PLAN-declared-caps.yaml is
  RUN and its prediction RECORDED (Decision 182). A within_budget verdict is recorded as WEAK
  EVIDENCE, not as a pass: the predictor is known to under-report (rec-3677). The criterion is that
  the prediction was measured and written down, not that it read within_budget.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Exercise the extraction grammar and the two-way comparator directly against synthetic trees --
    inline and var-indirect resolution, the one-assignment-two-invocations shape, and every red path
    including the two fail-closed unresolvability cases.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test__agent_loop_caps.py -q
  expected: >-
    Exit 0. The green cases resolve 30 and 5; the shared-assignment case yields ONE value rather than
    a conflict; and every red case asserts a NON-EMPTY failure list -- unresolvable token, ambiguous
    two-value file, undeclared literal, stale declaration, mismatch in each direction, blank
    on_exhaustion, blank rationale, unknown kind, non-int value.
  fix_if: >-
    An unresolvable token resolving to a value means the variable lookup is falling back to a default
    instead of failing -- remove the fallback; fail-closed is the anti-evasion property. An ambiguous
    two-value file passing means the census is last-write-wins; make it an explicit failure. If a red
    case returns an empty failure list the comparator is short-circuiting before that branch. NEVER
    fix a red case by loosening the grammar to accept the bad input.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-literal-extraction
- step: 2
  phase: pre-deploy
  action: >-
    Exercise assertion group (d) end to end on a synthetic tmp tree, including the audit's acceptance
    shape in BOTH directions and the nameless-workflow escape attempt, and confirm the three
    pre-existing assertion groups still pass with the new group present.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_adjudication.py -q
  expected: >-
    Exit 0. Matching row and literal pass; literal-only bump fails; row-only bump fails; a cap on a
    workflow whose row declares none fails as undeclared; a row declaring a cap whose file carries
    none fails as stale; a nameless .yml carrying a cap fails rather than escaping. The pre-existing
    coverage, filter-equals-watched and entry-shape tests are unchanged and green.
  fix_if: >-
    A pre-existing test breaking means group (d) was inserted before the early-return chain and is
    masking a coverage or filter failure -- move it after. A row-only bump passing means the check is
    reading the declared value on both sides of the comparison instead of deriving one side from the
    file. A nameless .yml escaping means the census is keyed on workflow name rather than file path.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-drift-fails-adjudication
- step: 3
  phase: pre-deploy
  action: >-
    Exercise assertion group 5 on a synthetic action tree plus synthetic contract document, and
    confirm the four pre-existing roster-parity groups still pass.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_composite_action_shape_rosters.py -q
  expected: >-
    Exit 0. Match passes; literal-only bump fails; declaration-only bump fails; undeclared literal
    fails; stale declaration fails; blank on_exhaustion or rationale fails. The known_r1_violators
    three-way parity, baseline_file.path, section_allowlist and delegate-resolution groups are
    unchanged and green.
  fix_if: >-
    A pre-existing group breaking means the new helper was aggregated into an existing group's
    (failures, examined_count) tuple instead of its own -- give group 5 its own helper per the file's
    convention. An ImportError on the cross-domain helper import means it was placed at module scope;
    put it inside the check body as this file already does at :178.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-drift-fails-composite-roster
- step: 4
  phase: pre-deploy
  action: >-
    Prove the workflow-name enumeration stayed single-source: the new pair-returning function's name
    projection equals the existing function's output exactly, and both skip nameless and unparseable
    files identically.
  command: bin/venv-python -m pytest tests/ci_rca/taxonomy/test_load_and_classify.py -q
  expected: >-
    Exit 0. The projection equality test passes ORDER-SENSITIVELY, the nameless-file and
    unparseable-file cases are omitted by both, and every pre-existing load/classify test is green.
  fix_if: >-
    An order difference means the new function sorts differently from sorted(glob("*.yml")) -- match
    the original exactly rather than re-sorting by name. A raised exception on the unparseable file
    means the broad except/logger.warning guard was dropped in the refactor; restore it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Already covered by an artifact this plan graduates. If the two enumerations ever diverged, the
    cap census would key on a file the taxonomy row set does not cover and step 2's shard
    (agent-loop-cap-drift-fails-adjudication, whose undeclared-cap and stale-declaration cases both
    turn on that mapping) would go red. Graduating this separately would pin one refactor's internal
    shape rather than a behaviour an external change can break without the existing shard noticing.
- step: 5
  phase: pre-deploy
  action: >-
    NON-VACUITY ON THE LIVE TREE. INVOKE THE REGISTERED ENFORCERS -- validate_ci_rca_taxonomy,
    validate_ci_rca_adjudication and validate_composite_action_shape_rosters, resolved from the
    registry rather than re-implemented here -- against the real repository, and additionally assert
    that the discovered census actually CONTAINS the two known cap sites with their expected values.
    The extra assertion is not a second copy of the enforcers' logic: it is the non-vacuity proof
    that a green scanner did not simply find nothing. validate_ci_rca_taxonomy is included because it
    owns the taxonomy loader's required-keys contract and the workflow-name coverage rule that the
    new row sits inside, so a malformed agent_loop_caps addition reds there too.
  command: >-
    bin/venv-python -c "from scripts.checks import registry; from scripts.checks._common import ROOT;
    from scripts.checks.ci_guards._agent_loop_caps import scan_cap_literals; f=[];
    [registry.resolve(n)(f) for n in ('validate_ci_rca_taxonomy','validate_ci_rca_adjudication','validate_composite_action_shape_rosters')];
    d,e=scan_cap_literals(ROOT); assert not f, f; assert not e, e;
    assert d.get('.github/workflows/ci-rca.yml',{}).get('max_turns')==30, d;
    assert d.get('.github/actions/subagent-plan-review/review.sh',{}).get('max_turns')==5, d;
    print('CENSUS_OK', len(d), sorted(d))"
  expected: >-
    Exit 0 and CENSUS_OK listing at least the two governed sites with values 30 and 5, and all three
    registered enforcers appending nothing to failed. A third site appearing here is not a failure -- it means a cap was
    added since planning and now needs a declared row, which is the mechanism working.
  fix_if: >-
    A missing site means the grammar does not match its live form -- widen the grammar to READ it,
    never narrow the scanned population to exclude it. A non-empty unresolvable list on the live tree
    means a real cap is unreadable; that is a genuine finding, so declare it or make it readable, and
    do not silence the error channel. A check failure here means the declared values do not match the
    live literals at landing; correct the DECLARATION, never the workflow literal (this plan governs
    caps, it does not move them).
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-census-covers-live-sites
- step: 6
  phase: pre-deploy
  action: >-
    THE AUDIT'S ACCEPTANCE CLAUSE, both directions, against REAL file content. Copy the real
    ci-rca.yml and the real taxonomy into a temporary tree; mutate ONLY the literal (30 -> 31) and
    assert a failure; then restore and mutate ONLY the declared row (30 -> 31) and assert a failure.
  command: >-
    bin/venv-python -c "import pathlib,shutil,tempfile,yaml;
    from scripts.checks._common import ROOT; from scripts.checks.ci_guards._agent_loop_caps import
    scan_cap_literals, compare_caps;
    src=ROOT/'.github/workflows/ci-rca.yml'; tax=yaml.safe_load((ROOT/'config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8'));
    decl={'.github/workflows/ci-rca.yml':{c['kind']:c['value'] for c in tax['workflows']['CI RCA']['agent_loop_caps']}};
    t=pathlib.Path(tempfile.mkdtemp()); w=t/'.github/workflows'; w.mkdir(parents=True);
    txt=src.read_text(encoding='utf-8'); (w/'ci-rca.yml').write_text(txt.replace('--max-turns 30','--max-turns 31'),encoding='utf-8');
    d1,_=scan_cap_literals(t); f1=compare_caps(decl,d1,'workflow');
    (w/'ci-rca.yml').write_text(txt,encoding='utf-8'); d2,_=scan_cap_literals(t);
    f2=compare_caps({'.github/workflows/ci-rca.yml':{'max_turns':31}},d2,'workflow');
    shutil.rmtree(t); assert f1, 'literal-only bump did NOT fail'; assert f2, 'declaration-only bump did NOT fail';
    print('BOTH_DIRECTIONS_BITE', f1[0][:80], '||', f2[0][:80])"
  expected: >-
    Exit 0 and BOTH_DIRECTIONS_BITE followed by two distinct non-empty failure strings -- one naming
    the drifted literal, one naming the drifted declaration.
  fix_if: >-
    An empty f1 means the check compares the declaration against itself rather than against the file.
    An empty f2 means the comparator only walks the discovered side and never reports a declared entry
    whose value differs. If the taxonomy lookup raises KeyError the row was added under a different
    workflow display name -- the key must be exactly the `name:` field of ci-rca.yml, which the
    two-way census in group (a) already pins.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Step 2's graduated shard pins the same both-directions drift property durably, with synthetic
    fixtures that stay valid as the real files evolve. This step exists to replay it once against the
    REAL ci-rca.yml text so the audit's acceptance is demonstrated on the actual literal it names;
    graduating it would re-encode the same rule with a brittle dependency on the exact string
    "--max-turns 30" surviving in that file forever.
- step: 7
  phase: pre-deploy
  action: >-
    Prove both declaration surfaces are well-formed and that the Class D contract carries a NEW
    amendment_log entry keyed on its CONTENT (naming agent_loop_caps), never on its date.
  command: >-
    bin/venv-python -c "import yaml,pathlib;
    tax=yaml.safe_load(pathlib.Path('config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8'));
    caps=tax['workflows']['CI RCA']['agent_loop_caps']; assert len(caps)==1, caps;
    c=caps[0]; assert c['kind']=='max_turns' and c['value']==30, c;
    assert isinstance(c['on_exhaustion'],str) and c['on_exhaustion'].strip(), c;
    assert isinstance(c['rationale'],str) and c['rationale'].strip(), c;
    assert 'site' not in c and 'pattern' not in c, 'taxonomy row must not name a site or pattern';
    ct=yaml.safe_load(pathlib.Path('docs/contracts/composite-action-shape.yaml').read_text(encoding='utf-8'));
    a=ct['agent_loop_caps']; assert len(a)==1 and a[0]['site']=='.github/actions/subagent-plan-review/review.sh', a;
    assert a[0]['kind']=='max_turns' and a[0]['value']==5, a;
    assert a[0]['on_exhaustion'].strip() and a[0]['rationale'].strip(), a;
    assert 'consumers' not in a[0], 'consumers would be a non-derived second surface';
    m=[e for e in ct['amendment_log'] if 'agent_loop_caps' in str(e.get('summary',''))];
    assert len(m)==1, [e.get('date') for e in ct['amendment_log']];
    assert m[0]['change_class']=='field_add' and m[0]['semantic_break'] is False, m[0];
    print('SURFACES_OK')"
  expected: Exit 0 and SURFACES_OK.
  fix_if: >-
    A KeyError on agent_loop_caps means the section landed at the wrong nesting level -- on the
    taxonomy side it is a key of the `CI RCA` row, on the contract side a top-level key. A zero-length
    amendment match means the new entry's summary does not name the key it adds; name it, because
    scripts/checks/contracts/_population.check_amendment_log_for_class_d only requires SOME new entry
    and this assertion is what makes the entry describe the actual change. Two matches means a
    historical entry already mentions the key -- disambiguate by asserting on the newest one only if
    that is genuinely the case, never by deleting history.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The two halves are already durably guarded elsewhere: the row and entry SHAPE (kind, value,
    on_exhaustion, rationale, no site or pattern on the taxonomy side) is enforced on every run by the
    two registered checks this plan extends, both pre=True with pre_globs=None, and the amendment_log
    obligation by the registered validate_contract_drift via check_amendment_log_for_class_d. This
    step is a same-PR early warning over content those two already own.
- step: 8
  phase: pre-deploy
  action: >-
    Scope boundary, BOTH DIRECTIONS, tolerant of sanctioned companions. Assert no forbidden
    concurrency-excluded path was touched, and that everything touched is either a declared scope row
    or a sanctioned companion (graduation registry shards, docs/decisions-index.json).
  command: >-
    bin/venv-python -c "from scripts.checks import _common;
    t={p for _s,p in _common.get_status_aware_diff()};
    declared={'scripts/ci_rca/taxonomy.py','scripts/checks/ci_guards/_agent_loop_caps.py',
    'scripts/checks/ci_guards/validate_ci_rca_adjudication.py',
    'scripts/checks/contracts/validate_composite_action_shape_rosters.py','config/ci_rca_taxonomy.yaml',
    'docs/contracts/composite-action-shape.yaml','tests/ci_rca/taxonomy/test_load_and_classify.py',
    'tests/checks/ci_guards/test__agent_loop_caps.py',
    'tests/checks/ci_guards/test_validate_ci_rca_adjudication.py',
    'tests/checks/contracts/test_validate_composite_action_shape_rosters.py',
