    historical entry already mentions the key -- disambiguate by asserting on the newest one only if
    that is genuinely the case, never by deleting history. A failure on source_of_truth_field's
    ':'-split means the new field was appended OUTSIDE the parenthetical or ahead of the leading
    'workflows:' token -- keep that token first, because _check_watched_workflow_set splits on the
    FIRST colon and the resulting key must still resolve as a top-level taxonomy key. A failure on
    the pointer-comment assertions means the field semantics were left in (or put back into) the
    taxonomy comment: move them into watched_workflow_set.note and leave a pointer, which is the
    whole point of this step. NEVER satisfy the on_exhaustion assertion by deleting the pointer
