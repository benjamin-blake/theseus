schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: declared-caps
intent: >-
  Give every agentic-loop iteration cap under .github/ a declared row carrying its value, its
  exhaustion behaviour and its rationale, DERIVED-AND-ASSERTED against the live literal so the
  declaration can never be satisfied by editing itself: the literal is truth, the row is a pinned
  mirror, and CI proves them equal in both directions plus proves the census complete. Closes audit
  finding LSA-05 by extending registers that already exist -- config/ci_rca_taxonomy.yaml's
  workflows rows, docs/contracts/composite-action-shape.yaml, and docs/contracts/ci-rca-lifecycle.yaml
  (the Class D contract that DECLARES the taxonomy row's field shape, so growing the row without
  growing its declaring contract would reproduce the very drift this plan exists to eliminate) --
  plus two checks that are already registered. No new contract file, no new registry, no new roster,
  no new registered check.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-declared-caps.yaml
phase: >-
  Loop-governance hardening -- the undeclared-cap residual of audit finding LSA-05
  (audits/loop-spec-adoption-4d8bac4a.yaml), classified novel with item_ids: [] ("No owner for cap
  declaration"). Ad hoc, soft-warn category ad_hoc_rec: NO tier_item is claimed, no roadmap row is
  added and no exit criterion is closed, so this plan declares no closes_criteria and does not touch
  docs/ROADMAP-PLATFORM.yaml. Non-keystone slice of the loop-spec-adoption wave, running CONCURRENTLY
  with the LSA-03 red-case-floor slice; the concurrency exclusions are declared in constraints and
  asserted by VP step 8.
scope:
- file: scripts/ci_rca/taxonomy.py
  action: Modify
  purpose: >-
    Adds enumerate_workflow_name_paths(workflows_dir=None) -> list[tuple[str, Path]] and RE-EXPRESSES
    the existing enumerate_workflow_names as a projection over it ([name for name, _ in ...]). The
    point is single-source enumeration: the cap census keys on FILE PATH while the taxonomy rows key
    on workflow display NAME, so something must map one to the other, and a second independent glob
    would be precisely the drift-by-second-surface the governing audit rejects P1 for. Behaviour of
    enumerate_workflow_names must be BIT-IDENTICAL after the change -- same sorted(glob("*.yml"))
    order, same "append only when the parsed mapping has a name key" rule, same broad
    except/logger.warning on an unparseable file -- because the two-way census in
    validate_ci_rca_adjudication group (a) is built on it. No new import, no I/O beyond the glob it
    already performs.
- file: scripts/checks/ci_guards/_agent_loop_caps.py
  action: Create
  purpose: >-
    The shared, check-side cap grammar and comparator -- a leading-underscore helper module, NOT a
    registered check, so it adds no _manifest.py Entry, no registry name, no check-accounting roster
    row and no function_to_category row. Owns THREE things. (1) The extraction grammar, which is
    CHECK-SIDE ON PURPOSE: the declaration rows never name a regex or a line number, only a value, so
    an author cannot retarget the derivation to dodge a mismatch. It resolves --max-turns <token> in
    two forms -- an inline integer, and a shell-variable reference ($VAR / "$VAR" / "${VAR}") looked
    up against VAR=<int> assignments in the SAME file (this is the review.sh:68 shape, where one
    MAX_TURNS=5 feeds two invocations at lines 72 and 78). (2) FAIL-CLOSED unresolvability: a token
    that is neither an integer nor a same-file-resolvable variable, and a file yielding two DIFFERENT
    values for one kind, both produce a failure string rather than silently dropping out of the
    census -- otherwise "move the literal somewhere the grammar cannot read" is a free escape from
    declaration. (3) The two-way comparator over {repo-relative file: {kind: value}}: discovered but
    undeclared FAILS, declared but not discovered FAILS (stale row), both present with unequal values
    FAILS. It also owns the shared PROSE NON-TRIVIALITY FLOOR both callers apply to a declared
    entry's on_exhaustion and rationale -- at least 40 stripped characters, not equal
    case-insensitively to the kind name, and the two not equal to each other -- so the floor is
    defined ONCE and cannot drift between the workflow and action regions. Scans .github/workflows/**.{yml,yaml} and .github/actions/**.{yml,yaml,sh}. THE
    PARTITION CLAIM IS NARROWED AT CRITIQUE TIME AND IS NOW EXACT: those two regions partition THE
    UNION OF THEMSELVES -- every cap discovered in either is owned by exactly one of the two callers
    and none falls between them -- but they do NOT partition .github/, which also holds
    agents/schedule.yaml (per-agent model/provider/prompt_path, the natural home for a future turn
    cap), prompts/scheduled/*, dependabot.yml, CODEOWNERS and pull_request_template.md: nine tracked
    files matched by neither glob (measured at 68c6140a). THIRD, FAIL-CLOSED OBLIGATION so the
    acceptance criterion that obfuscation reddens the build is TRUE rather than escapable by
    relocation: the scanner walks ALL of .github/**, routes by prefix, and emits an UNRESOLVABLE-style
    error string for any governed-kind literal found outside the two governed regions. It reuses the
    existing error channel rather than adding a public function, so there is no new surface, and VP
    step 5's `assert not e` already proves the live tree carries no such literal today. The remedy
    for that error is a PLANNING decision -- declare a home for the new region -- never a silent glob
    widening, which would turn a discovered-but-unhomeable cap into an unsatisfiable failure
    (rec-3724 owns that choice). Exactly one governed kind today, max_turns -- the
    agentic-loop turn budget the finding names. Job-level timeout-minutes is DELIBERATELY NOT a
    governed kind (see constraints). Filesystem reads only; no subprocess, no network (Decision 153
    fast-tier budget). PUBLIC SURFACE, named here because the
    verification plan calls it verbatim: scan_cap_literals(root) -> (dict[str, dict[str, int]],
    list[str]) returns the discovered census keyed by repo-relative POSIX path plus the
    unresolvable-literal error strings, and compare_caps(declared, discovered, region_label) ->
    list[str] returns the two-way failure strings. Both take an explicit root so every red path is
    exercisable against a synthetic tree.
- file: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
  action: Modify
  purpose: >-
    Gains assertion group (d), the workflow-region half. Builds the declared map by walking the
    taxonomy workflows rows for an optional agent_loop_caps list and resolving each row KEY to its
    file through enumerate_workflow_name_paths -- so the taxonomy row declares no site of its own,
    because the row key already is the site; value and kind are the only pinned data, on_exhaustion
    and rationale the only prose. Then compares against the discovered workflow-region census.
    Group-shape assertions mirror the existing group (c) posture: kind must be a governed kind, value
    must be an int, and on_exhaustion and rationale must clear the shared non-triviality floor the
    helper owns (>= 40 stripped chars, not the kind name, not equal to each other) rather than
    merely being non-empty. Placement is AFTER the
    existing early-return chain so a broken census cannot mask a coverage or filter failure, and its
    failures append to the same failed list. Its docstring's "Three assertion groups" line becomes
    four. Nothing about ci_rca/watched/owner/rationale changes, and the two-way workflow census is
    untouched -- this check's actual subject has always been "the taxonomy's rows are true of the
    repo", and a cap row is one more row that must be true.
    ALSO ADOPTS THE DECISION 170 ACCOUNTING CHANNEL, which editing this module makes MANDATORY, not
    optional: validate_ci_rca_adjudication is a baselined entry in config/check_accounting_baseline.yaml
    (line 43) and validate_check_accounting clause (d) is touch-it-fix-it -- "an edited baselined check
    that has not adopted the declaration FAILS". So this file gains registry.examined(count,
    unit=...) covering all four groups, and its baseline row is removed (clause (c) is shrink-only,
    so a removal is always permitted and is the ratchet's designed direction). PLACEMENT IS
    DELIBERATE AND CHECKED, not assumed: all four of this check's existing early returns append to
    `failed` FIRST, and Decision 170 point 1's derivation makes an append to `failed` always win as
    "failed", so no early-return path can be observed as undeclared or vacuous. One
    registry.examined() on the single non-failing exit therefore covers every reachable outcome --
    this is exactly rec-2915's known module-vs-exit-path ratchet limitation, discharged here by
    inspection rather than left to the AST scan's weaker guarantee.
- file: scripts/checks/contracts/validate_composite_action_shape_rosters.py
  action: Modify
  purpose: >-
    Gains assertion group 5, the action-region half, in the check whose entire existing job is
    "composite-action-shape.yaml's declared registries genuinely equal the live surfaces they claim
    to describe" -- the same derive-and-assert posture as its four current groups. Reads the
    contract's new top-level agent_loop_caps list, where each entry names an explicit repo-relative
    site (the contract has no per-action key to imply one, unlike the taxonomy row) plus kind, value,
    on_exhaustion and rationale, and compares against the discovered action-region census, applying
    the same shared non-triviality floor to the two prose fields. Imports
    the helper cross-domain as `from scripts.checks.ci_guards._agent_loop_caps import ...` inside the
    check body -- the SAME cross-domain shape this file already uses at :178 for
    _workflow_shell_bodies._KNOWN_BASELINE_SECTIONS, so it introduces no new layering precedent.
    Follows the file's own decomposition convention (one helper per assertion group returning
    (failures, examined_count), aggregated by the registered check) so per-file complexity stays
    inside Decision 43.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    The `CI RCA` workflow row gains an agent_loop_caps list with one entry -- kind max_turns, value
    30, plus on_exhaustion (the || true mask followed by the deterministic ALL FILED marker gate,
    which is what actually happens when the budget runs out) and rationale (why 30 and not 5: a
    multi-bundle RCA agent reads logs, greps and files through the portal, against a five-turn
    read-only single-verdict reviewer). A SHORT POINTER COMMENT above `workflows:` names
    docs/contracts/ci-rca-lifecycle.yaml's watched_workflow_set as the field-semantics home and
    carries NO field semantics of its own. The earlier draft of this plan homed the semantics in
    that comment; that was wrong in the plan's own terms -- a YAML comment beside a Class D
    contract's own declared field enumeration is a second surface agents must sync, which is the
    drift-by-second-surface the governing audit rejected P1/P2/P3 for, and it moves AGAINST T2.56:c1
    (field semantics embedded ambiently are relocated TO contracts, never away from them). Note the
    comment costs ZERO effective lines either way under Decision 166's counting rule (a line whose
    first non-whitespace character is '#' is not counted), so this correction is about DRIFT, not
    about size. This is the ONLY edit to this file:
    function_to_category, step_name_to_category, log_pattern_to_category, failure_categories and
    every other workflow row are untouched (see constraints -- this file is the live collision
    surface with the concurrent LSA-03 slice).
- file: docs/contracts/composite-action-shape.yaml
  action: Modify
  purpose: >-
    Gains a top-level agent_loop_caps section, sibling to `rules:`, with one entry for
    .github/actions/subagent-plan-review/review.sh -- kind max_turns, value 5, on_exhaustion naming
    the actual STARVED path (one retry at the SAME budget, never larger, T2.39 c2; a second
    starvation blocks apply WITHOUT latching the convergence record red, Decision 55 anti-masking)
    and rationale. This is the finding's own named home for shared-action caps, and the file already
    carries a live precedent for pinning facts about a real file (known_r1_violators' keys and
    pinned_lines, three-way asserted), so the section extends an established shape rather than
    inventing one. Deliberately NO consumers: list of the two consuming workflows: it would be
    derivable from the live `uses:` edges and therefore either a second unasserted surface or extra
    assertion cost for no acceptance-criteria value -- the audit's own NS6 argument against
    non-derived declaration fields. Because this is a Class D contract, the parsed-content change
    REQUIRES a new amendment_log[] entry (change_class field_add, semantic_break false) whose summary
    names agent_loop_caps -- otherwise
    scripts/checks/contracts/_population.check_amendment_log_for_class_d fails the PR.
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    THE ROOT-FINDING RESOLUTION, and the reason this row exists at all. This is a Class D contract
    (evaluator: {check: validate_ci_rca_lifecycle_projection}) whose watched_workflow_set block
    already declares source_of_truth: config/ci_rca_taxonomy.yaml and enumerates that row's shape
    VERBATIM -- source_of_truth_field: "workflows: (each entry: tier, ci_rca [watched|excluded],
    owner, rationale)" -- plus a note: describing what validate_ci_rca_adjudication asserts. Adding a
    FIFTH row field and a FOURTH assertion group without extending this block would leave the Class D
    contract's own field enumeration and evaluator note stale, and it would drift SILENTLY:
    _check_watched_workflow_set splits source_of_truth_field at the first ':' and asserts only that
    the resulting top-level key ('workflows') resolves -- the parenthetical field list is never
    asserted by anything. THE SIZE INSTRUMENT FIRST: this file measured 485 of 500 effective lines, so before the
    substantive edits apply rung 1 of the contracts class's own relief ladder -- reflow the five
    older amendment_log entries to the file's OWN newest-entry 5-line shape, a PURE parse-identical
    reflow that frees 36 lines (485 -> 449) and deletes nothing. See constraints for the full ladder
    and for the check_amendment_log_for_class_d interaction it creates. THEN THREE EDITS, ALL
    COMPACT:
    (1) source_of_truth_field gains ", agent_loop_caps [optional]" -- a one-line change with no net
    line cost, and the ':' split still yields exactly 'workflows' so the evaluator is undisturbed;
    (2) note: gains a (d) clause that is the FIELD-SEMANTICS HOME for agent_loop_caps (kind's
    governed vocabulary, int value, non-empty on_exhaustion/rationale prose, the NEVER-a-site-or-
    pattern invariant, and what group (d) asserts) -- semantics land HERE, not in a taxonomy comment;
    (3) a new amendment_log entry, change_class field_add, semantic_break false, whose summary names
    agent_loop_caps -- required because a parsed-content change to a Class D contract without one
    fails scripts/checks/contracts/_population.check_amendment_log_for_class_d. No new key is added
    inside watched_workflow_set: an extra key would be an unasserted field, which is precisely the
    shape this plan's own constraints forbid.
- file: config/check_accounting_baseline.yaml
  action: Modify
  purpose: >-
    Removes the single `validate_ci_rca_adjudication` roster line, as the direct and unavoidable
    consequence of editing that check's module (Decision 170 touch-it-fix-it; see that file's scope
    row). This is a ONE-LINE DELETION and nothing else. It is safe by the guard's own rules:
    clause (c) is shrink-only measured against origin/main, so a removal is always permitted and an
    addition is what is blocked; clause (b) compares the live roster against the frozen _BASELINE_SEED
    constant in scripts/checks/hygiene/validate_check_accounting.py, and a removal keeps the roster a
    strict subset of that seed, so the guard MODULE is not edited (it stays on this plan's forbidden
    list). Leaving the row in place while adopting the declaration would technically pass, which is
    why it is called out: clause (a) skips baselined names outright, so a stale row silently exempts
    a now-declaring check from ever being re-checked -- an unasserted declaration is the same defect
    class this plan exists to close.
- file: tests/ci_rca/taxonomy/test_load_and_classify.py
  action: Modify
  purpose: >-
    Adds the single-source parity tests: enumerate_workflow_name_paths returns pairs whose name
    projection is EXACTLY equal (order included) to enumerate_workflow_names over the same directory;
    a .yml with no `name:` key is omitted from BOTH; an unparseable .yml is skipped by BOTH without
    raising; each returned path exists and is the file the name was read from.
- file: tests/checks/ci_guards/test__agent_loop_caps.py
  action: Create
  purpose: >-
    The grammar and comparator red/green matrix against synthetic trees -- the known-bad fixtures
    this guard owes NS3. Green: an inline `--max-turns 30`; a var-indirect `--max-turns "$MAX_TURNS"`
    with MAX_TURNS=5 in the same file; the review.sh shape where TWO invocations share ONE
    assignment, yielding one value and not a conflict. Red (each asserting a NON-EMPTY failure list,
    since a guard that cannot fail is the defect this plan exists to prevent): an unresolvable token
    (a variable with no same-file assignment, and a computed/interpolated token); one file yielding
    two DIFFERENT values for one kind; a discovered cap with no declared entry; a declared entry
    whose site carries no live literal; a value mismatch in each direction; a declared entry with a
    blank on_exhaustion, a blank rationale, an unknown kind, or a non-int value; and ONE RED CASE PER
    FLOOR CLAUSE -- an on_exhaustion under 40 stripped chars, a rationale equal to the kind name, and
    an on_exhaustion equal to its own rationale.
- file: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
  action: Modify
  purpose: >-
    Adds a TestAgentLoopCapsGroup class extending the file's existing monkeypatch-a-synthetic-tmp-tree
    pattern (_patch_taxonomy already sets scripts.ci_rca.taxonomy.ROOT to tmp_path), plus a patch of
    enumerate_workflow_name_paths. Cases: a row declaring value 30 against a synthetic workflow
    carrying `--max-turns 30` PASSES; bumping the literal alone FAILS; bumping the row alone FAILS; a
    synthetic workflow carrying a cap with no agent_loop_caps on its row FAILS (undeclared); a row
    declaring a cap whose workflow file carries none FAILS (stale); a workflow file with NO `name:`
    key that carries a cap FAILS rather than escaping the census; and the pre-existing coverage,
    filter and entry-shape assertions still pass unchanged with the new group present. ALSO adds the
    Decision 170 accounting-adoption case: the check declares an examined()/skipped() outcome, and
    the declared examined count is NON-ZERO on the green path (examined(0) derives to "vacuous", not
    "enforced", so a zero count would register the new group as a vacuous pass -- the exact failure
    mode Decision 170 exists to make visible).
- file: tests/checks/contracts/test_validate_composite_action_shape_rosters.py
  action: Modify
  purpose: >-
    Adds the action-region mirror of the same red/green matrix against a synthetic
    .github/actions/<name>/<file>.sh tree plus a synthetic contract document: match passes, literal-only
    bump fails, declaration-only bump fails, undeclared literal fails, stale declaration fails, blank
    on_exhaustion or rationale fails, and each non-triviality floor clause fails (too short, equal to
    the kind name, on_exhaustion equal to rationale). The four pre-existing roster-parity groups must still pass.
- file: docs/plans/PLAN-declared-caps.yaml
  action: Create
  purpose: This plan document.
bundled_recommendations: []
followon_recs: [rec-3723, rec-3724]
infrastructure_dependencies: []
acceptance_criteria:
- >-
  THE AUDIT'S LITERAL ACCEPTANCE: changing --max-turns in .github/workflows/ci-rca.yml without
  updating its declared taxonomy row fails the build. Proven against the REAL file contents copied
  into a temporary tree and mutated (VP step 6), not only against synthetic fixtures.
- >-
  NON-VACUOUS IN BOTH DIRECTIONS, which is what "the declared row and the literal cannot restate
  each other" means operationally: editing ONLY the taxonomy row's value (literal untouched) also
  fails. The declaration is therefore unsatisfiable by editing itself; the live literal is truth and
  the row is a pinned mirror the check derives and compares, exactly as check-manifest.yaml pins
  scripts.checks._schema.SEGMENT_TOKENS. Both directions are asserted in one command in VP step 6.
- >-
  THE CENSUS IS COMPLETE, NOT JUST CONSISTENT: a cap literal added anywhere under .github/workflows/
  or .github/actions/ with no declared row FAILS, and a declared row whose site carries no live
  literal FAILS. A workflow .yml with no `name:` key that carries a cap FAILS rather than escaping
  the census by being unnameable.
- >-
  FAIL-CLOSED ON UNREADABLE OR UNHOMED CAPS: a --max-turns token that is neither an integer nor a
  same-file-resolvable shell variable FAILS, and so does a single file yielding two different values
  for one kind. Obfuscating a cap out of the grammar's reach reddens the build instead of removing
  the cap from governance. AND -- added at critique time, because the two declared regions do not
  partition .github/ -- a governed-kind literal placed ANYWHERE under .github/ but outside those two
  regions (.github/agents/schedule.yaml being the live candidate) also FAILS, so RELOCATION out of
  the census is not an escape either. The two regions still partition the population they OWN; the
  third assertion is what makes this criterion true of .github/ as a whole. Caps outside .github/
  entirely -- notably scripts/ci/**.sh -- are a DECLARED out-of-census residual, not a claim (see
  constraints and rec-3724).
- >-
  The declared value on each side EQUALS the live literal at landing: 30 for
  .github/workflows/ci-rca.yml (the `CI RCA` row) and 5 for
  .github/actions/subagent-plan-review/review.sh, with the action-side value resolved THROUGH the
  MAX_TURNS=5 assignment feeding both invocations, not read off either invocation line.
- >-
  NON-VACUITY ON THE LIVE TREE: running both checks against the real repository reports a census that
  actually contains those two sites (VP step 5 asserts their presence, not merely "no failures") --
  so a green result cannot mean "the scanner found nothing".
- >-
  Every declared cap entry carries an on_exhaustion and a rationale that clear a NON-TRIVIALITY
  FLOOR, not merely a non-emptiness test, and a violation of either FAILS. The floor is: at least 40
  stripped characters, not equal (case-insensitively) to the kind name, and on_exhaustion !=
  rationale. It is asserted in the same group-shape pass that already checks these fields, so it
  costs NO new declaration surface, NO new check and NO new field -- and each clause carries a red
  case in both mirror test files. These fields remain REVIEW SURFACE rather than derived facts: the
  plan still claims no machine check on whether the prose is TRUE, only that a cap cannot exist
  undeclared, unexplained, or explained with a placeholder.
  PREMISE CORRECTED AT CRITIQUE TIME, because the pre-revision version of this criterion rested on a
  false one. It claimed "the only stronger test would be a second declaration surface asserting the
  prose, which this plan's HARD ANTI-DRIFT CONSTRAINT forbids outright." That is FALSE, and both
  critique halves found it independently. TWO stronger-than-existence instruments cost zero new
  surface: (i) this non-triviality floor, now ADOPTED; and (ii) Decision 186 POINT 5's ratified
  category-plus-reason split -- `closure_waiver_category` carries an enum-enforced category and
  `closure_waiver_reason` the free-text proof -- which applied here would make on_exhaustion a
  governed vocabulary (exactly how this plan already governs `kind`) plus prose.
  (ii) IS DECLINED, and on its real ground rather than the anti-drift constraint, which does not
  reach it: what forecloses it is this plan's OWN two-category discipline (every load-bearing field
  is either DERIVED-AND-ASSERTED or PROSE, no third category), a plan-authored rule, not an
  inherited one -- plus the fact that a governed vocabulary minted from a population of ONE cap site
  would be invented, not derived, and this plan has no second site to validate it against. It is the
  right shape once a second kind or site exists; rec-3724 owns that region growth.
  THE DIVERGENCE FROM Decision 186 point 4 IS THEREFORE NARROWER THAN CLAIMED, and closer to a
  PARALLEL than an opposition: 186 point 4 is scoped to `closure_artifact`, so this plan is not in
  violation of it, and its own closing words are "existence is not discrimination, A DECLARED
  RESIDUAL" -- 186 declares the same residual about its own mechanism. The one real asymmetry
  stands: 186's closure_artifact resolves to a LOCAL REPOSITORY FACT (its defining file must have
  been added or modified in the closing write's fixed_by_sha), so a fully derived test was available
  there; "why 30 and not 5" has no analogous referent, so the floor is the strongest available test
  and the remaining judgement is declared as residual. Everything that IS derivable here (kind,
  value, site) is derived and asserted.
- >-
  ZERO NEW REGISTRATION SURFACES: no scripts/checks/*/_manifest.py Entry is added, no registry name,
  no config/ci_rca_taxonomy.yaml function_to_category row, and no docs/contracts/*.yaml file is
  created. Both assertion groups land inside checks that are already registered with pre=True and
  pre_globs=None, so they already run unconditionally in --pre and no pre_globs edit is required.
  ON config/check_accounting_baseline.yaml SPECIFICALLY, which this plan now touches: the movement
  is a REMOVAL, never an addition, and the two directions are not symmetric under
  validate_check_accounting -- clause (c) blocks growth against origin/main and clause (b) blocks
  any member not already in the frozen _BASELINE_SEED, while a shrink is always permitted. So this
  criterion is unweakened: zero registration surfaces are ADDED, and one grandfather exemption is
  RETIRED, which is the ratchet moving in its designed direction.
- >-
  Interactive-skill budgets stay in their skills: .claude/skills/implement/SKILL.md's 3-fix-attempt
  budget and .claude/skills/overseer/SKILL.md's G0/G3 watchdog are OUT OF SCOPE by the governing
  audit's own ruling ("prompt semantics, not workflow config"), and both skill files are untouched.
  This is a declared boundary, not an omission.
- >-
  BOTH Class D contracts this plan makes a parsed-content change to carry a NEW amendment_log entry
  whose summary names agent_loop_caps, each with change_class field_add and semantic_break false:
  docs/contracts/composite-action-shape.yaml AND docs/contracts/ci-rca-lifecycle.yaml. Asserted on
  each entry's CONTENT, never on its date -- a date assertion can be satisfied for free by a
  concurrent commit. Without both, scripts/checks/contracts/_population.check_amendment_log_for_class_d
  fails the PR.
- >-
  scripts/ci_rca/taxonomy.py's enumerate_workflow_names is behaviour-identical after the refactor:
  its name projection over enumerate_workflow_name_paths equals its previous output exactly, order
  included, and both skip a nameless or unparseable .yml identically.
- >-
  SIZE, BOTH GOVERNING REGISTERS -- Decision 128 for Python and DECISION 166 FOR THE YAML THIS PLAN
  ACTUALLY GROWS. (a) Decision 128 / config/sloc_budgets.yaml: no Python file crosses 500 SLOC and
  that file is untouched (measured headroom at planning time: taxonomy.py 312,
  validate_ci_rca_adjudication.py 90, validate_composite_action_shape_rosters.py 200). (b) Decision
  166 / config/structural_size_budgets.yaml: every YAML file this plan grows stays at or under its
  class limit of 500 EFFECTIVE LINES (non-blank lines whose first non-whitespace character is not
  '#') and 2,000 longest-line characters, and that registry is untouched. MEASURED LIVE at 68c6140a:
  docs/contracts/ci-rca-lifecycle.yaml 485 (contracts class, the binding file),
  config/ci_rca_taxonomy.yaml 400 (config class, headroom 100),
  docs/contracts/composite-action-shape.yaml 208 (contracts class, headroom 292). NONE of the three
  is registered in config/structural_size_budgets.yaml's budgets: roster, so a raise would require
  adding an entry carrying a `# raise-approved: dec-NNN` marker naming a Decision that AUTHORIZES it
  (Decision 165 narrowed marker validation from existence to authorization) -- and this plan mints
  no Decision, so NO RAISE IS AVAILABLE TO IT, and a split is forbidden by the contracts class's own
  relief_valve. THE INSTRUMENT IS THAT SAME relief_valve's ORDERED LADDER, rung 1 first: reflowing
  ci-rca-lifecycle.yaml's five older amendment_log entries to the file's own newest-entry 5-line
  shape frees 36 effective lines (485 -> 449) as PURE, parse-identical reflow. RE-MEASURED UNDER THE
  LADDER, the full drafted contract edit -- widened source_of_truth_field (net 0 lines), a 6-line
  note: (d) clause and a 5-line amendment entry -- lands at 460 effective, HEADROOM 40, longest line
  970 of 2,000. See constraints for the full ladder and the check_amendment_log_for_class_d
  interaction the reflow creates.
- >-
  THE ROOT-FINDING CRITERION -- this plan does not reproduce the drift it exists to eliminate.
  docs/contracts/ci-rca-lifecycle.yaml is a Class D contract whose watched_workflow_set block
  enumerates the taxonomy workflow row's field shape verbatim and describes what
  validate_ci_rca_adjudication asserts. Adding a fifth row field and a fourth assertion group
  WITHOUT extending that block would leave both stale, and would drift SILENTLY, because
  _check_watched_workflow_set asserts only that source_of_truth_field's leading ':'-delimited key
  resolves as a top-level key -- never the parenthetical field list. So: source_of_truth_field names
  agent_loop_caps, note: carries the (d) clause and IS the field-semantics home, the taxonomy's
  comment is a POINTER carrying no semantics of its own, and the contract carries its own new
  amendment_log entry. Asserted by VP step 7.
- >-
  DECISION 170 IS DISCHARGED, NOT TRIPPED. validate_ci_rca_adjudication is a baselined entry in
  config/check_accounting_baseline.yaml and validate_check_accounting clause (d) is touch-it-fix-it,
  so editing that module WITHOUT adopting registry.examined()/skipped() is a build failure, not a
  style preference. The check therefore declares a NON-ZERO examined count on its green path
  (examined(0) derives to "vacuous"), its baseline row is removed (clause (c) shrink-only permits a
  removal and blocks an addition), and scripts/checks/hygiene/validate_check_accounting.py is NOT
  edited -- clause (b)'s frozen _BASELINE_SEED still strictly contains the shrunk roster.
- >-
  Per-file coverage stays at 100% for all four changed Python sources; config/coverage_baseline.yaml
  is untouched and no new baseline entry is registered to get under the bar.
- >-
  CONCURRENCY: .github/workflows/**, .github/actions/**, scripts/checks/*/_manifest.py,
  scripts/checks/hygiene/validate_check_accounting.py, config/ci_rca_taxonomy.yaml's
  function_to_category block, docs/DECISIONS.md, docs/ROADMAP-PLATFORM.yaml, config/sloc_budgets.yaml,
  config/structural_size_budgets.yaml and config/coverage_baseline.yaml are ALL untouched. The
  literals this plan governs are read, never edited -- a plan that declares caps must not also move
  them. NOTE the deliberate distinction added at revision time: config/check_accounting_baseline.yaml
  (the DATA roster) is now a declared scope row carrying a one-line deletion, while
  scripts/checks/hygiene/validate_check_accounting.py (the GUARD module, and the home of the frozen
  _BASELINE_SEED) stays forbidden. Shrinking the roster needs only the former.
- >-
  bin/venv-python -m scripts.checks.deps.selection_budget --plan docs/plans/PLAN-declared-caps.yaml is
  RUN and its prediction RECORDED (Decision 182), re-run against the FINAL scope rather than an
  earlier one -- recorded figures, measured at 68c6140a: scope 14 paths, n_selected 111 of census
  561, allowance 222s, test half 44.9-50.4s, elapsed 95.9-122.2s, within_budget. A within_budget
  verdict is recorded as WEAK EVIDENCE, not as a pass: the predictor is known to under-report
  (rec-3677). The criterion is that the prediction was measured against the scope actually being
  shipped and written down, not that it read within_budget.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Exercise the extraction grammar and the two-way comparator directly against synthetic trees --
    inline and var-indirect resolution, the one-assignment-two-invocations shape, and every red path
    including the two fail-closed unresolvability cases.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test__agent_loop_caps.py -q
  expected: >-
    Exit 0. The green cases resolve 30 and 5; the shared-assignment case yields ONE value rather than
    a conflict; and every red case asserts a NON-EMPTY failure list -- unresolvable token, ambiguous
    two-value file, undeclared literal, stale declaration, mismatch in each direction, blank
    on_exhaustion, blank rationale, unknown kind, non-int value, and each non-triviality floor
    clause (under 40 stripped chars, equal to the kind name, on_exhaustion equal to rationale).
  fix_if: >-
    An unresolvable token resolving to a value means the variable lookup is falling back to a default
    instead of failing -- remove the fallback; fail-closed is the anti-evasion property. An ambiguous
    two-value file passing means the census is last-write-wins; make it an explicit failure. If a red
    case returns an empty failure list the comparator is short-circuiting before that branch. NEVER
    fix a red case by loosening the grammar to accept the bad input.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-literal-extraction
- step: 2
  phase: pre-deploy
  action: >-
    Exercise assertion group (d) end to end on a synthetic tmp tree, including the audit's acceptance
    shape in BOTH directions and the nameless-workflow escape attempt, confirm the three pre-existing
    assertion groups still pass with the new group present, and confirm the Decision 170 accounting
    declaration is adopted with a NON-ZERO examined count on the green path.
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_adjudication.py -q
  expected: >-
    Exit 0. Matching row and literal pass; literal-only bump fails; row-only bump fails; a cap on a
    workflow whose row declares none fails as undeclared; a row declaring a cap whose file carries
    none fails as stale; a nameless .yml carrying a cap fails rather than escaping. The pre-existing
    coverage, filter-equals-watched and entry-shape tests are unchanged and green. The green path
    declares examined(n) with n > 0.
  fix_if: >-
    A pre-existing test breaking means group (d) was inserted before the early-return chain and is
    masking a coverage or filter failure -- move it after. A row-only bump passing means the check is
    reading the declared value on both sides of the comparison instead of deriving one side from the
    file. A nameless .yml escaping means the census is keyed on workflow name rather than file path.
    ON THE examined() PLACEMENT, which was checked deliberately rather than assumed (Decision 170):
    all four of this check's existing early returns append to `failed` FIRST, and Decision 170 point
    1's single derivation makes an append to `failed` always win as "failed" over skipped / vacuous /
    undeclared. So one registry.examined() on the single non-failing exit covers every reachable
    outcome, and putting group (d) after the early-return chain cannot flip a real failure into a
    vacuous or undeclared green. If a count of 0 is ever observed on a green path, the group is
    counting only agent_loop_caps ROWS and the taxonomy currently declares one -- aggregate all four
    groups' counts, do not special-case an empty cap census, and never delete the assertion to make
    the count non-zero.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-drift-fails-adjudication
- step: 3
  phase: pre-deploy
  action: >-
    Exercise assertion group 5 on a synthetic action tree plus synthetic contract document, and
    confirm the four pre-existing roster-parity groups still pass.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_composite_action_shape_rosters.py -q
  expected: >-
    Exit 0. Match passes; literal-only bump fails; declaration-only bump fails; undeclared literal
    fails; stale declaration fails; blank on_exhaustion or rationale fails; each non-triviality floor
    clause fails. The known_r1_violators
    three-way parity, baseline_file.path, section_allowlist and delegate-resolution groups are
    unchanged and green.
  fix_if: >-
    A pre-existing group breaking means the new helper was aggregated into an existing group's
    (failures, examined_count) tuple instead of its own -- give group 5 its own helper per the file's
    convention. An ImportError on the cross-domain helper import means it was placed at module scope;
    put it inside the check body as this file already does at :178.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-drift-fails-composite-roster
- step: 4
  phase: pre-deploy
  action: >-
    Prove the workflow-name enumeration stayed single-source: the new pair-returning function's name
    projection equals the existing function's output exactly, and both skip nameless and unparseable
    files identically.
  command: bin/venv-python -m pytest tests/ci_rca/taxonomy/test_load_and_classify.py -q
  expected: >-
    Exit 0. The projection equality test passes ORDER-SENSITIVELY, the nameless-file and
    unparseable-file cases are omitted by both, and every pre-existing load/classify test is green.
  fix_if: >-
    An order difference means the new function sorts differently from sorted(glob("*.yml")) -- match
    the original exactly rather than re-sorting by name. A raised exception on the unparseable file
    means the broad except/logger.warning guard was dropped in the refactor; restore it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Already covered by an artifact this plan graduates. If the two enumerations ever diverged, the
    cap census would key on a file the taxonomy row set does not cover and step 2's shard
    (agent-loop-cap-drift-fails-adjudication, whose undeclared-cap and stale-declaration cases both
    turn on that mapping) would go red. Graduating this separately would pin one refactor's internal
    shape rather than a behaviour an external change can break without the existing shard noticing.
- step: 5
  phase: pre-deploy
  action: >-
    NON-VACUITY ON THE LIVE TREE. INVOKE THE REGISTERED ENFORCERS -- validate_ci_rca_taxonomy,
    validate_ci_rca_adjudication and validate_composite_action_shape_rosters, resolved from the
    registry rather than re-implemented here -- against the real repository, and additionally assert
    that the discovered census actually CONTAINS the two known cap sites with their expected values.
    The extra assertion is not a second copy of the enforcers' logic: it is the non-vacuity proof
    that a green scanner did not simply find nothing. validate_ci_rca_taxonomy is included because it
    owns the taxonomy loader's required-keys contract and the workflow-name coverage rule that the
    new row sits inside, so a malformed agent_loop_caps addition reds there too. ADDED AT REVISION
    TIME, and both are root-finding evidence rather than padding: validate_ci_rca_lifecycle_projection
    is the Class D evaluator of the contract this plan now extends, so it proves the extended
    watched_workflow_set still resolves (its ':'-split on the widened source_of_truth_field must still
    yield exactly 'workflows'); validate_check_accounting proves the Decision 170 touch-it-fix-it
    obligation is DISCHARGED rather than merely asserted in prose, since it is the check that fails
    an edited-but-undeclared baselined module.
  command: >-
    bin/venv-python -c "from scripts.checks import registry; from scripts.checks._common import ROOT;
    from scripts.checks.ci_guards._agent_loop_caps import scan_cap_literals; f=[];
    [registry.resolve(n)(f) for n in ('validate_ci_rca_taxonomy','validate_ci_rca_adjudication','validate_composite_action_shape_rosters','validate_ci_rca_lifecycle_projection','validate_check_accounting')];
    d,e=scan_cap_literals(ROOT); assert not f, f; assert not e, e;
    assert d.get('.github/workflows/ci-rca.yml',{}).get('max_turns')==30, d;
    assert d.get('.github/actions/subagent-plan-review/review.sh',{}).get('max_turns')==5, d;
    print('CENSUS_OK', len(d), sorted(d))"
  expected: >-
    Exit 0 and CENSUS_OK listing at least the two governed sites with values 30 and 5, and all FIVE
    registered enforcers appending nothing to failed. A third site appearing here is not a failure --
    it means a cap was added since planning and now needs a declared row, which is the mechanism
    working.
  fix_if: >-
    A missing site means the grammar does not match its live form -- widen the grammar to READ it,
    never narrow the scanned population to exclude it. A non-empty unresolvable list on the live tree
    means a real cap is unreadable; that is a genuine finding, so declare it or make it readable, and
    do not silence the error channel. A check failure here means the declared values do not match the
    live literals at landing; correct the DECLARATION, never the workflow literal (this plan governs
    caps, it does not move them). A validate_ci_rca_lifecycle_projection failure naming
    watched_workflow_set means the widened source_of_truth_field no longer ':'-splits to the bare key
    'workflows' -- keep 'workflows:' as the leading token and append the new field INSIDE the
    parenthetical, never before it. A validate_check_accounting failure naming
    validate_ci_rca_adjudication is the touch-it-fix-it clause firing: adopt registry.examined() in
    that module, never revert the module edit to dodge it, and never edit the guard.
  hermetic: true
  graduation: graduate
  graduation_check_id: agent-loop-cap-census-covers-live-sites
- step: 6
  phase: pre-deploy
  action: >-
    THE AUDIT'S ACCEPTANCE CLAUSE, both directions, against REAL file content. Copy the real
    ci-rca.yml and the real taxonomy into a temporary tree; mutate ONLY the literal (30 -> 31) and
    assert a failure; then restore and mutate ONLY the declared row (30 -> 31) and assert a failure.
    THEN CLOSE THE COMPOSITION GAP this step would otherwise leave: the two mutations above exercise
    the HELPER (scan_cap_literals + compare_caps against a hand-built declared map), not the
    registered check, so the audit's "fails the BUILD" clause is discharged BY COMPOSITION -- sound
    only if the registered validate_ci_rca_adjudication actually routes group (d) through
    compare_caps rather than reimplementing the comparison. Nothing asserted that, so one clause now
    does: resolve the check module and assert compare_caps appears in its source. Verified RED at
    revision time (the module's source does not contain that token today), so it is not vacuous.
  command: >-
    bin/venv-python -c "import pathlib,shutil,tempfile,yaml;
    from scripts.checks._common import ROOT; from scripts.checks.ci_guards._agent_loop_caps import
    scan_cap_literals, compare_caps;
    src=ROOT/'.github/workflows/ci-rca.yml'; tax=yaml.safe_load((ROOT/'config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8'));
    decl={'.github/workflows/ci-rca.yml':{c['kind']:c['value'] for c in tax['workflows']['CI RCA']['agent_loop_caps']}};
    t=pathlib.Path(tempfile.mkdtemp()); w=t/'.github/workflows'; w.mkdir(parents=True);
    txt=src.read_text(encoding='utf-8'); (w/'ci-rca.yml').write_text(txt.replace('--max-turns 30','--max-turns 31'),encoding='utf-8');
    d1,_=scan_cap_literals(t); f1=compare_caps(decl,d1,'workflow');
    (w/'ci-rca.yml').write_text(txt,encoding='utf-8'); d2,_=scan_cap_literals(t);
    f2=compare_caps({'.github/workflows/ci-rca.yml':{'max_turns':31}},d2,'workflow');
    shutil.rmtree(t); assert f1, 'literal-only bump did NOT fail'; assert f2, 'declaration-only bump did NOT fail';
    import inspect; from scripts.checks.ci_guards import validate_ci_rca_adjudication as M;
    assert 'compare_caps' in inspect.getsource(M), 'group (d) must route through compare_caps, not reimplement it';
    print('BOTH_DIRECTIONS_BITE', f1[0][:80], '||', f2[0][:80])"
  expected: >-
    Exit 0 and BOTH_DIRECTIONS_BITE followed by two distinct non-empty failure strings -- one naming
    the drifted literal, one naming the drifted declaration -- with the composition assertion having
    already confirmed the registered check's own source calls compare_caps.
  fix_if: >-
    An empty f1 means the check compares the declaration against itself rather than against the file.
    An empty f2 means the comparator only walks the discovered side and never reports a declared entry
    whose value differs. If the taxonomy lookup raises KeyError the row was added under a different
    workflow display name -- the key must be exactly the `name:` field of ci-rca.yml, which the
    two-way census in group (a) already pins. A failure on the compare_caps composition assertion
    means group (d) reimplemented the comparison inline instead of calling the shared comparator --
    route it through compare_caps, because every red path this plan proves is proved against that
    function and an inline copy inherits none of it. Do NOT satisfy that assertion by importing
    compare_caps without using it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Step 2's graduated shard pins the same both-directions drift property durably, with synthetic
    fixtures that stay valid as the real files evolve. This step exists to replay it once against the
    REAL ci-rca.yml text so the audit's acceptance is demonstrated on the actual literal it names;
    graduating it would re-encode the same rule with a brittle dependency on the exact string
    "--max-turns 30" surviving in that file forever.
- step: 7
  phase: pre-deploy
  action: >-
    Prove both declaration surfaces are well-formed, that BOTH Class D contracts carry a NEW
    amendment_log entry keyed on its CONTENT (naming agent_loop_caps) and never on its date, and --
    the root-finding half -- that docs/contracts/ci-rca-lifecycle.yaml's watched_workflow_set was
    actually extended rather than left stale, while the taxonomy comment carries a POINTER and no
    field semantics of its own. EVERY CARDINALITY ASSERTION HERE IS MEMBERSHIP-SHAPED, deliberately:
