    ids=[s['graduation_check_id'] for s in d['verification_plan'] if s.get('graduation')=='graduate'];
    missing=[i for i in ids if not pathlib.Path(f'config/agent/verification_registry/entries/{i}.yaml').exists()];
    assert not missing, missing; print('SHARDS_DERIVED_OK', len(ids), ids)"
  expected: Exit 0 and SHARDS_DERIVED_OK 4 with the four declared check ids.
