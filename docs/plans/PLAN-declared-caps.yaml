    assert [e for e in hl if e not in bl]==[lm[0]], 'the amendment_log reflow must be PARSE-IDENTICAL: only the new agent_loop_caps entry may count as new';
    raw=pathlib.Path('config/ci_rca_taxonomy.yaml').read_text(encoding='utf-8');
    cmt=[l for l in raw.splitlines() if l.lstrip().startswith('#') and 'agent_loop_caps' in l];
    assert cmt, 'the taxonomy needs a pointer comment naming agent_loop_caps';
    assert any('ci-rca-lifecycle' in l for l in cmt), cmt;
    assert not any('on_exhaustion' in l for l in cmt), ('pointer only -- semantics live in the contract', cmt);
