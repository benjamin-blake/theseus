constraints:
- >-
  HARD ANTI-DRIFT CONSTRAINT, inherited from the governing audit: NO new contract file, NO new
  registry, NO new roster, NO new enumeration register, and NO new registered check. The audit
  rejected P1/P2/P3 precisely because a fourth declaration surface over a population that already has
  three live registers is the NS6 drift-by-design anti-pattern AGENTS.md prohibits. If implementation
  appears to require one, STOP and escalate rather than building it. EXTENDING AN EXISTING CLASS D
  CONTRACT IS THE SANCTIONED DIRECTION, not an exception to this constraint: docs/contracts/ci-rca-lifecycle.yaml
  already declares the taxonomy workflow row's field shape, so widening that declaration adds no
  surface -- it keeps an existing one true. T2.56:c1's direction is that ambiently-embedded field
  semantics are relocated TO contracts; homing agent_loop_caps' semantics in a YAML comment beside
  that contract would have moved the opposite way and created the second surface this constraint
  exists to prevent.
- >-
  The declaration must never be satisfiable by editing itself. Every load-bearing field is either
  DERIVED-AND-ASSERTED against the live literal (kind, value, and the site -- implied by the row key
  on the taxonomy side, explicit and existence-checked on the contract side) or PROSE JUDGEMENT
  asserted against a NON-TRIVIALITY FLOOR but never for truth (on_exhaustion, rationale: >= 40
  stripped chars, not the kind name, and not equal to each other). No third category. NOTE what this
  two-category rule -- a discipline this plan authors, not one it inherits -- forecloses: Decision
  186 point 5's category-plus-reason split, which would make on_exhaustion a governed vocabulary
  plus prose. That is declined on the record in the on_exhaustion/rationale acceptance criterion,
  not silently excluded, and it is NOT the anti-drift constraint that rules it out. Do not add a field that
  restates a derivable fact without asserting it -- that is why `consumers:` is deliberately absent
  from the contract entry.
- >-
  The grammar lives in the CHECK, never in the declaration. A row must not carry a regex, a line
  number, or a pattern selector: if the declaration could retarget the derivation, weakening a cap
  would again be a single-file edit.
- >-
  Governed kind is max_turns ONLY. Job-level timeout-minutes is explicitly NOT governed: the audit
  names it a compensating control that bounds runaway, not an agentic-loop iteration cap, and
  governing it would put a row on nearly every job in the fleet -- a large declaration surface for a
  population the finding does not cite. The kind field exists so a second kind is a row-and-grammar
  addition later, not a redesign.
- >-
  Interactive-skill budgets are OUT OF SCOPE by the audit's explicit ruling: .claude/skills/implement/SKILL.md's
  3-fix-attempt budget and .claude/skills/overseer/SKILL.md's G0/G3 watchdog "stay in their skills:
  they are prompt semantics, not workflow config." Neither file is touched.
- >-
  CONCURRENCY EXCLUSIONS (a sibling LSA-03 slice is being planned in parallel and its subject is a
  registry-level red-case floor, which normally means registering a check): do not touch
  scripts/checks/*/_manifest.py, scripts/checks/hygiene/validate_check_accounting.py, or
  config/ci_rca_taxonomy.yaml's function_to_category / step_name_to_category / log_pattern_to_category
  / failure_categories blocks. This plan's ONLY edit to config/ci_rca_taxonomy.yaml is the `CI RCA`
  row plus a SHORT POINTER COMMENT above `workflows:` naming docs/contracts/ci-rca-lifecycle.yaml's
  watched_workflow_set -- not a field-semantics comment, which an earlier draft of this plan wrongly
  specified. Also note the sibling appends `validate_red_case_floor: code_regression` to
  function_to_category in this same file, roughly 40 lines from this plan's block: the two edits are
  append-adjacent and disjoint, never overlapping.
- >-
  DECLARED OUT-OF-CENSUS REGION, stated rather than left implicit (Decision 59 / Decision 181 point
  2): scripts/ci/**.sh is NOT scanned by this plan's cap census, and that is a choice, not an
  oversight. .github/workflows/ci-rca.yml:461-463 pipes its prompt into
  scripts/ci/claude_p_retry.sh and passes `--max-turns 30` as PASSTHROUGH ARGV -- the cap literal
  lives in the workflow (a governed region, so today's cap IS covered), but the wrapper is a shared
  front door that already owns retry semantics and is therefore the most plausible future host for a
  DEFAULT cap. Verified at revision time: claude_p_retry.sh injects no cap of its own. The asymmetry
  worth naming is that RELOCATING an already-declared cap into that wrapper is caught (the
  declaration goes stale and group (d) fails), while a NEW cap introduced inside it is discovered by
  nothing and declared by nothing. This plan does not widen the glob to cover it, deliberately:
  choosing a declaration home for a cap hosted in scripts/ci/ is a planning decision, and widening
  the census alone would turn a discovered-but-unhomeable cap into an unsatisfiable failure. Owned
  by rec-3724, which covers this region together with the non-workflow .github sub-surfaces.
- >-
  Do not edit any cap literal. .github/workflows/** and .github/actions/** are READ-ONLY to this plan.
  A plan that declares caps and also moves them makes its own acceptance evidence circular.
- Decision 128 decompose-by-default -- never raise a SLOC budget; config/sloc_budgets.yaml is untouched.
- >-
  DECISION 166 STRUCTURAL SIZE -- the binding size axis, and no longer the knife-edge an earlier
  draft of this plan made of it. Every YAML file this plan grows is governed at 500 effective lines
  by validate_structural_size_limits: docs/contracts/ci-rca-lifecycle.yaml and
