    durably guarded is named honestly rather than graduated: watched_workflow_set's parenthetical
    field list and its note: prose are asserted by NOTHING on the live tree --
    _check_watched_workflow_set asserts only that the leading ':'-delimited key resolves. That is
    a DECLARED UNENFORCED RESIDUAL under Decision 181 point 2's declare-your-coverage discipline,
    not a coverage claim; it carries owning recommendation rec-3723 (see context and followon_recs).
    Graduating this step would not close it either, since a graduated shard would pin THIS plan's
    field name rather than the general rule that a Class D contract's enumerated field list must
    equal the live row shape.
- step: 8
  phase: pre-deploy
  action: >-
    Scope boundary, BOTH DIRECTIONS, tolerant of sanctioned companions. Assert no forbidden
    concurrency-excluded path was touched, and that everything touched is either a declared scope row
    or a sanctioned companion (graduation registry shards, docs/decisions-index.json). THIS STEP IS
    THE LOCATION HALF ONLY. Decision 181's sibling CONTENT invariant -- no acceptance criterion, VP
    step, assertion or budget is ever weakened to obtain green -- is NOT asserted here and is not
    assertable by a touched-files diff; it is carried as a standing constraint (see constraints) by
    pointer to docs/contracts/implement-scope-boundary.yaml's invariants.content, and instanced in
    every fix_if clause in this plan. Decision 181 point 3 names that residual arm the DOMINANT form
    of weakening in practice, so the split is declared rather than glossed over.
  command: >-
    bin/venv-python -c "from scripts.checks import _common;
    t={p for _s,p in _common.get_status_aware_diff()};
    declared={'scripts/ci_rca/taxonomy.py','scripts/checks/ci_guards/_agent_loop_caps.py',
    'scripts/checks/ci_guards/validate_ci_rca_adjudication.py',
    'scripts/checks/contracts/validate_composite_action_shape_rosters.py','config/ci_rca_taxonomy.yaml',
    'docs/contracts/composite-action-shape.yaml','docs/contracts/ci-rca-lifecycle.yaml',
    'config/check_accounting_baseline.yaml','tests/ci_rca/taxonomy/test_load_and_classify.py',
    'tests/checks/ci_guards/test__agent_loop_caps.py',
    'tests/checks/ci_guards/test_validate_ci_rca_adjudication.py',
    'tests/checks/contracts/test_validate_composite_action_shape_rosters.py',
    'docs/plans/PLAN-declared-caps.yaml'};
    forbidden={'docs/DECISIONS.md','docs/ROADMAP-PLATFORM.yaml','config/sloc_budgets.yaml',
    'config/structural_size_budgets.yaml',
    'config/coverage_baseline.yaml','scripts/checks/hygiene/validate_check_accounting.py',
    '.claude/skills/implement/SKILL.md','.claude/skills/overseer/SKILL.md'};
    companion=lambda p: p.startswith('config/agent/verification_registry/entries/') or p=='docs/decisions-index.json';
    bad=sorted(t&forbidden); extra=sorted(p for p in t if p not in declared and not companion(p));
    assert not bad, ('forbidden_touched', bad); assert not extra, ('outside_declared_scope', extra);
    print('SCOPE_OK', len(t))"
  expected: >-
