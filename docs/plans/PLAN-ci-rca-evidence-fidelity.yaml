execution_steps:
  - >-
    tests/fixtures/ci_rca/oversized_validate_log.py -- build_log() synthesises a full-tier
    validate failure log above both caps, terminating in the real "Failed checks:" block. Land
    FIRST; every window assertion depends on it.
  - >-
    scripts/checks/validation_result.py -- add the accumulator (reset by clear()),
    dispatch_recording(name, failed, namespace), schema_version 2, and failed_check_attributions
    in write_completed. Then swap scripts/validate.py's _dispatch_check body to the one-line
    delegate; re-measure SLOC immediately (must stay <= 499).
  - >-
    Workflows + contract -- add the validation-result upload with `if: always()` to ci.yml's
    main-validate and main-canary.yml's canary job, declare both in
    docs/contracts/github-actions-evidence.yaml's artifact_uploads, and add the best-effort
    continue-on-error download plus generator flag to ci-rca.yml.
  - >-
    config/ci_rca_taxonomy.yaml -- extend function_to_category to all 93 registered checks against
    already-declared categories, and declare evidence_insufficient. Do NOT add it to
    agent_only_categories.
  - >-
    scripts/ci_rca/taxonomy.py -- add the Priority-0 attribution path above Priority 1 in BOTH
    classify_failure and classify_failures, mapping N attributions to N enumerated failures; add
    the refusal gate above Priority 4 and Priority 5, standing down when a junit cause-group is
    available.
  - scripts/ci_rca/fingerprint.py -- add the degenerate signature helper for the refusal verdict.
  - >-
    scripts/ci_rca/evidence.py -- accept the artifact and thread it, limits.complete, AND junit
    availability into classify_failures (all three; junit is the easy one to drop and its absence
    silently reintroduces the Decision 142 masking bug), then route the refusal to the degenerate
    signature. Re-check SLOC after; if the delta crosses 500, decompose rather than raise.
  - >-
    scripts/ci_rca/log_evidence.py then fetch_logs.py -- add bound_text_windowed and admit
    head_tail_window plus drain_ceiling in BOTH reason sets (_validate_limits line 88 AND
    _validate_selection line 153); then rewrite _run_log for 8192-byte chunked reads with a
    bounded head buffer plus rolling tail deque under drain_max_bytes/drain_timeout_s keyword
    bounds, honouring the returncode contract. Specify the _fallback_logs composition. Keep the
    five pinned fragments byte-identical.
  - >-
    scripts/checks/ci_guards/validate_ci_rca_taxonomy.py -- add the registry-totality assertion
    and the evidence_insufficient sentinel beside "unknown" (line 44).
  - >-
    docs/ROADMAP-PLATFORM.yaml -- flip T1.13 c9 met -> open with a [RE-GROUNDED 2026-08-04] note
    naming part (b) as the falsified clause and (a)/(c) as side-effect re-opens. Roadmap
    bookkeeping only; surface the staged diff to the human before committing it.
  - >-
    Tests -- new tests/validate/test_failed_check_attribution.py; update validation_result,
    taxonomy (Priority-0 in both functions, step-name collision, real-label, refusal x2, junit
    carve-out), evidence generator (end-to-end + N->N), fetch_logs (FOUR rewrites including
    test_timeout_kills_child), log_evidence, fingerprint, taxonomy guard (with mutation case), and
    actions-evidence contract.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop
    and RCA (Decision 55).
  - >-
    Commit with the trailer "Resolves: rec-2957, rec-2958, rec-2973". Before merging, obtain
    explicit human confirmation for ALL THREE closures -- each closes on a semantic verdict rather
    than a satisfied acceptance oracle, which Decision 103 reserves for human confirmation. Record
    in the closure resolutions: rec-2958's cited file was never defective; rec-2973's MiB-cap grep
    and rec-2957's FAIL_ANCHOR grep are both deliberately not satisfied.
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Revert the squash-merge commit. The artifact path is additive (uploads are new steps; the
  download is continue-on-error; failed_checks keeps its shape and schema_version 2 is a superset),
  and the ci-rca-log-evidence/v2 envelope stays backward-compatible (head_tail_window and
  drain_ceiling are additive truncation reasons), so a revert restores prior behaviour without
  stranding envelopes or artifacts. Three caveats: fingerprints computed while the change was live
  do not revert -- those chains stay re-keyed either way; any rec closed by the Resolves: trailer
  must be reopened via the portal, never by editing the local cache; and the T1.13 c9 status flip
  is a deliberate data correction that should NOT be reverted with the code.
