schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "gc-guardrail-fail-closed"
intent: >-
  Replace the DuckLake GC circuit breaker, which fails OPEN when its catalog introspection errors and
  whose file-fraction metric cannot pass in steady state, with fail-closed structural guards -- and
  make the two smoke gates that certified it capable of failing.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-gc-guardrail-fail-closed.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Create
    purpose: >-
      Fail-closed guard set. G1 reachability (would-delete and live sets disjoint), G2 retention-floor
      re-assertion after expiry, G3 catalog-sanity precondition, G4 absolute per-pass deletion bound
      with byte sizes read from the dry-run's own size column. Lands HERE, not in the 443-SLOC
      sibling (57 lines of headroom), per Decision 128.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      Remove the five bare `except Exception` blocks in _count_files / _sum_file_bytes /
      _collect_file_paths / _dry_run_cleanup_paths / _dry_run_orphan_paths so introspection failure
      RAISES; delete check_gc_breaker, file_fraction, GC_BREAKER_FILE_FRACTION and GC_BREAKER_BYTES;
      re-point run_gc (the destructive cadence) at the guard set. GC_TABLE_SCOPE, HOT_TABLE_SCOPE and
      MAINTENANCE_SCOPE_NOTE are NOT touched here -- they are table SCOPE, not guard, and Decision 88
      clause 4 names GC_TABLE_SCOPE as the smoke-only latch; Plan B retires them when it replaces them
      with the live-catalog resolver. run_merge and run_hot_merge are merge-only paths with no
      deletion, so the deletion guards have no subject there and their signatures are unchanged.
      MaintenanceBreakerTrip and every maintenance primitive are retained.
      Also retire THIS FILE's module-docstring prose, which the sweep pattern cannot see: line 11
      ("run_gc: weekly guarded destructive (all five steps, circuit-breaker protected)") and lines
      18-19 ("Circuit breaker aborts the entire GC pass (raises, deletes nothing) when a single pass
      would exceed the file-count or byte budget. The abort is the safety-critical invariant."), both
      of which assert the deleted mechanism as live -- repoint them at the guard set. Leave lines
      16-17 (guardrails are module-level constants, never relaxed to pass a gate) and the line-24
      T2.19 expansion forward pointer untouched: both still read correctly after the retirement, and
      the T2.19 pointer is Plan B's surface.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops calls maint._count_files at two sites for every discovered production ops_*
      table. Making that helper raise would turn a transient introspection error into a hard abort of
      the every-6h NON-DESTRUCTIVE production compaction cadence that Decision 88 clause 1(iii)
      mandates. Split the contract: guards raise, observability degrades LOUDLY -- merge_ops catches
      at the call site and reports files_before/files_after as null with count_unavailable true,
      never a silent 0. This file's own module docstring needs NO edit: verified, it carries no
      breaker prose (only line 5's action=breaker_probe verb name, which survives), and its line-24
      pointer already reads "See src/common/ducklake_maintenance.py::MAINTENANCE_SCOPE_NOTE".
  - file: src/lambdas/ducklake_maintenance_smoke/handler.py
    action: Modify
    purpose: >-
      Rebind off the five retired names and the two retired run_gc/check_gc_breaker parameters, and
      re-home action_breaker_probe onto a named G1 forcing input -- an INTERNAL module-level constant
      replacing _BREAKER_PROBE_FILE_FRACTION / _BREAKER_PROBE_BYTE_BUDGET (lines 44-46), never an event
      field. The probe exists ONLY to force file_fraction=0.0/byte_budget=0, so retiring those would
      leave the fourth c9 CD gate with no subject. The successor constant must force a G1 trip
      independently of catalog contents, so the gate cannot pass vacuously on an empty smoke catalog.
  - file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
    action: Modify
    purpose: >-
      Bundle ducklake_maintenance_ops.py. The smoke zip includes ducklake_maintenance.py but not the
      new module; without this the deployed smoke Lambda ImportErrors and all four c9 CD gates go down.
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Bundle ducklake_maintenance_ops.py into the admin zip for the same import reason.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      Exclude src/common/ducklake_maintenance_ops.py AND src/lambdas/ducklake_maintenance_smoke. The
      wildcard src/ include drags both into data-pipeline.zip; the smoke-sibling leak is pre-existing
      (the excludes roster names ducklake_maintenance but not the _smoke sibling).
  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Make both gates capable of failing WITHOUT requiring deletion, since the deployed gate runs on
      every push against a fresh catalog. lambda_maintenance_gc asserts the guard-stats response shape
      and the absence of file_fraction / breaker_stats; lambda_maintenance_breaker loses its
      early-return OK on 200 + breaker_tripped False and must see the probe trip.
      force_recreate_tables=True is RETAINED in the gc payload: it exists so the gate does not 502 on
      a fresh smoke catalog (rec-2115 gap-1), and once _count_files RAISES, run_gc's first statement
      (files_before over GC_TABLE_SCOPE) would 500 on an absent table without it. The old vacuity came
      from asserting on the breaker numerator right after recreating the tables, not from the recreate
      itself -- and the shape assertion does not depend on the numerator at all.
  - file: terraform/personal/ducklake_maintenance.tf
    action: Modify
    purpose: Rewrite the alarm description pinning the retired ">20% files or >10 GiB" thresholds.
  - file: terraform/personal/ducklake_maintenance_smoke.tf
    action: Modify
    purpose: >-
      Remove the GC_BREAKER_FILE_FRACTION / GC_BREAKER_BYTES env vars and rewrite the alarm
      description pinning the retired thresholds.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Retire the gc verb's force_file_fraction / force_byte_budget payload fields and its
      file-fraction typed_error, AND the four hyphenated claims the name sweep cannot see: line 94
      "circuit-breaker guarded", line 99 typed_error "file-fraction or byte-budget breaker trip",
      line 174 audit_invariants "GC is circuit-breaker guarded (file-fraction + byte-budget)" -- a
      governance invariant that becomes FALSE -- and line 175 "guarded by the circuit-breaker, not a
      confirm token", plus the circuit-breaker prose at lines 31, 87 and 111. Also update merge_ops'
      response_codes (line 121) for the count_unavailable / null-count degradation, AND the gc verb's
      own response_codes (lines 95-97), whose 200 entry enumerates the body the shape assertion now
      checks and whose 500 entry still reads "breaker trip". Neither carries a retired name, so the
      sweep cannot see them.
  - file: docs/runbooks/ducklake-catalog-operations.md
    action: Modify
    purpose: >-
      Retire the 9 sweep-visible reference lines (measured: 215, 216, 229, 386, 388, 390, 391, 392,
      396) AND the prose the sweep cannot see, which is the larger half. Sweep-invisible named edits,
      each verified against the file: (a) the "### Circuit breaker (CD.33 H1)" section is REPLACED,
      not deleted -- header 223 becomes a fail-closed-guard-set header; body 225-228 and 230 are
      deleted with 229; line 231 ("On abort, emit MaintenanceBreakerTrip=1") is REWRITTEN to attribute
      the emit to the guard set, never removed, because it is the only documentation of the RETAINED
      metric that the retained alarms fire on; the "Reading the alarm (FP-B)" narrative at 233-243
      documents those retained alarms and their SNS wiring and is re-homed under the replacement
      header UNCHANGED; and line 244 ("When the breaker fires, do NOT raise the threshold to pass")
      is sweep-invisible, asserts the deleted mechanism as live, and is re-worded to the guard set --
      its Decision-55 point survives verbatim, only its subject changes. Deleting header 223 outright
      would orphan 233-247 under no header at all;
      (b) the "### Co-tuning knobs (T2.18 FP-B / CD.34)" section -- header 380, lead-in 382, the
      tunability sentence tail 397, and the T2.19 carry-item paragraph 399-401, all of which dangle
      over nothing once the GC_BREAKER_* fenced yaml block at 384-394 is deleted WHOLE, fences
      included. Delete the fence, not the matched lines: the sweep pattern sees only 386/388/390/391
      /392 inside that block, so a match-only deletion leaves "co_tuning_knobs:" with two orphan
      purpose: keys and a malformed fence. The sweep is a post-condition ASSERTION, never an edit
      instruction -- this holds for every surface, not just here;
      (c) lines 16 and 194, bare "circuit breaker" in a title and a step description, asserting the
      mechanism as live -- retitled here, not deferred. NOT edited: the "### Guardrail constants"
      yaml block survives the removal of 215-216 intact (snapshot_retain_days, file_cleanup_grace_days,
      snapshot_floor, cleanup_all_in_scheduled_runs are all retained), so its lead-out at 220-221 still
      reads correctly and G4's absolute byte bound is ADDED there rather than replacing the section.
      Grandfathered runbook (Decision 127) -- edit in place, do not add.
  - file: tests/test_ducklake_maintenance.py
    action: Modify
    purpose: >-
      Delete test_breaker_no_trip_empty_catalog and the retired-constant assertions in
      test_guardrail_constants -- both CODIFY the defects being fixed -- and re-point the remaining
      breaker tests at the guard set.
  - file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
    action: Modify
    purpose: >-
      Home of the merge_ops degradation test named by VP step 2. Referenced by a VP command and a
      test_selector, so it must be a declared scope row or validate_scope_boundary's LOCATION
      invariant fails the implement diff (Decision 59).
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Create
    purpose: G1-G4 unit coverage including the fail-closed regression and the real-engine anchor.
  - file: tests/test_ducklake_maintenance_smoke_handler.py
    action: Modify
    purpose: >-
      25 assertions bind the retired names; test_action_gc_force_file_fraction,
      test_action_gc_force_byte_budget, the two env-passthrough tests and the three breaker_probe
      tests all break. Re-point them at the guard set and the probe's new forcing input.
  - file: tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Re-point both gc tests at the response-shape assertion. test_lambda_maintenance_gc_ok pins the
      payload, which keeps force_recreate_tables=True (see the gates scope row);
      test_lambda_maintenance_gc_fresh_smoke_catalog_ok is RETAINED unchanged in intent -- a
      files_cleaned 0 body must still pass, because that is the fresh-catalog case the deployed gate
      hits on every push.
  - file: tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py
    action: Create
    purpose: >-
      Block-scoped assertion that neither alarm description pins a THRESHOLD SHAPE -- a percentage
      bound (>\s*\d+\s*%) or a byte bound (\d+\s*(GiB|GB|MB|bytes)) -- using the resource-header slice
      pattern from tests/checks/iam_tf/test_oidc_trust_slug_invariants.py, with a red-case fixture.
      Shape, not any-digit: the REWRITTEN description still carries the provenance tag "T2.18 / CD.33
      H1", so a bare \d assertion is unsatisfiable by the very text this plan lands. A line grep over
      the retired NAMES cannot see these prose descriptions.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: New Decision amending Decision 81 clause 6 / CD.33 H1 (drafted inline in context).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Rewrite the c6 and c8 criterion TEXTS only -- both pin the retired metric -- and repoint c6's
      met_by to this plan's slug (gc-guardrail-fail-closed), since the split that shipped the deleted
      breaker can no longer attest the rewritten text; met_by values are slugs, SHAs or tier ids,
      never Decision numbers. c9 is NOT edited: its text carries no GC_BREAKER_* assertion (verified);
      the only roadmap occurrence is progress_note line 4464, which is HISTORY and stays verbatim.
      No status flips. Residual roadmap references at lines 1296, 1308, 5440 and 9617 assert the
      breaker as live but sit outside T2.18 -- dispositioned as a follow-on rec, not edited here.
bundled_recommendations:
  - rec-3764
  - rec-3761
  - rec-3759
followon_recs:
  - rec-3768
infrastructure_dependencies:
  - >-
    Both .tf edits are description/env-var text only -- no resource, IAM, trust or policy change --
    so the apply stays on the Decision-77 auto-apply path. Verification is CI-delegated (Decision 119);
    no local terraform init/validate/plan.
  - >-
    Affected active Lambda artifacts (compute_affected_artifacts, measured): ducklake_maintenance,
    ducklake_maintenance_smoke, data-pipeline. The first two deploy through the governed CD channel
    .github/workflows/deploy-ducklake-lambdas.yml and are verified by VP12. data-pipeline is affected
    ONLY because docs/ROADMAP-PLATFORM.yaml is a declared asset of it; its channel
    (deploy-prod-lambdas.yml) has a push paths filter that does not include the roadmap, so a
    roadmap-only edit never redeploys it. That divergence is pre-existing and systemic -- filed as
    rec-3768, NOT fixed here. The excludes edit in scope removes the two genuine code leaks.
acceptance_criteria:
  - >-
    The guard set RAISES DuckLakeMaintenanceError when any catalog-introspection query fails. Today
    every helper swallows the exception and returns empty, collapsing total_files to 0, computing
    file_fraction 0.0 and returning breaker_tripped False while seeing nothing (rec-3764).
  - >-
    G1: the would-delete set and the live set are asserted disjoint before any destructive call and
    re-asserted after; a non-empty intersection raises and issues zero destructive SQL.
  - >-
    G2 re-asserts the snapshot floor AFTER expiry (today expire_snapshots computes the floor and
    nothing verifies the engine honoured it); G3 aborts on an empty live set or a live-byte drop past
    an absolute bound; G4 bounds deletions per pass with byte sizes taken from the dry-run's own size
    column, closing rec-3761's dead byte budget rather than leaving the pin unreplaced (Decision 187 pt 2).
  - >-
    check_gc_breaker, file_fraction, GC_BREAKER_FILE_FRACTION, GC_BREAKER_BYTES,
    force_file_fraction, force_byte_budget and the ">20% files" / "10 GiB" threshold prose are absent
    from all SIX surfaces that carry them today: src/common/ducklake_maintenance.py,
    src/lambdas/ducklake_maintenance_smoke/handler.py, both terraform files,
    docs/contracts/ducklake_maintenance.yaml and the runbook. MaintenanceBreakerTrip survives unchanged.
  - >-
    action_breaker_probe forces a guaranteed G1 trip via a NAMED forcing input that is an INTERNAL
    module-level constant in src/lambdas/ducklake_maintenance_smoke/handler.py -- the successor to
    _BREAKER_PROBE_FILE_FRACTION / _BREAKER_PROBE_BYTE_BUDGET (lines 44-46) -- NOT an event field and
    NOT a contract-documented parameter. docs/contracts/ducklake_maintenance.yaml lines 31-32 and
    audit_invariant 174 declare breaker_probe VP instrumentation and OUT of contract scope; that
    declaration STANDS and this plan does not widen it. The forcing constant must trip G1
    INDEPENDENTLY of catalog contents -- the retired file_fraction=0.0 probe trips only when at least
    one deletable file exists, so an empty smoke catalog silently no-ops it and the unattended c9 gate
    passes vacuously on every push. A test asserts it raises and a red case asserts a non-forcing
    input does NOT raise.
  - >-
    Both smoke gates discriminate a pre-fix build on RESPONSE SHAPE, not on deletion volume:
    lambda_maintenance_gc asserts the body carries the guard-stats shape and NO file_fraction /
    breaker_stats key, and lambda_maintenance_breaker no longer early-returns OK on
    200 + breaker_tripped False. Shape is the right discriminator because the deployed gate runs on
    EVERY push (deploy-ducklake-lambdas.yml line 247) against a CI-fresh smoke catalog where
    files_cleaned is structurally 0 -- action_gc forwards only the two retired knobs and run_gc's
    retain_days / grace_days / _now are unreachable over the Function URL. A live files_cleaned > 0
    assertion would therefore turn every subsequent DuckLake deploy red and regress c9. The
    zero-rejection logic is NOT introduced by this plan at all: with no aging reachable, a fresh
    catalog and a nothing-due catalog are indistinguishable, so there is no predicate that could
    safely gate it. Plan C adds it together with the forcing input that makes the two distinguishable.
  - >-
    Neither CloudWatch alarm description pins a THRESHOLD SHAPE -- a percentage bound (>\s*\d+\s*%)
    or a byte bound (\d+\s*(GiB|GB|MB|bytes)) -- asserted by a block-scoped test over each
    aws_cloudwatch_metric_alarm resource, with a red-case fixture that must fail. The assertion is
    shape-scoped, never any-digit: the rewritten descriptions retain their provenance tags -- measured,
    "T2.18 / CD.33 H1" on ducklake_maintenance.tf:262 and "T2.18 c9 / CD.33 H1" on
    ducklake_maintenance_smoke.tf:313 -- which an any-digit assertion would reject.
  - >-
    ducklake_maintenance_ops.py is bundled into BOTH maintenance manifests and excluded from
    data-pipeline, alongside the pre-existing ducklake_maintenance_smoke leak.
  - All three bundled recommendations reach a terminal status, verified after a portal sync.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the guard set fails CLOSED. Red case demonstrated 2026-09-12 against the SHIPPED function:
      a connection raising on introspection returns breaker_tripped False with total_files 0.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails -q
    expected: Raises DuckLakeMaintenanceError; no permissive dict is returned on any helper failure.
    fix_if: Any helper still returns an empty default on exception -- remove the bare except and re-raise.
    graduation: graduate
    graduation_check_id: gc-guards-fail-closed-on-introspection-error
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the FIVE swallowing helpers in src/common/ducklake_maintenance.py each RAISE. This is the
      actual defect site -- step 1 exercises the new module, and an implementer who writes that module
      correctly while leaving all five bare excepts intact would otherwise pass every other step.
    command: bin/venv-python -m pytest tests/test_ducklake_maintenance.py::TestHelpersFailClosed tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py::test_merge_ops_reports_count_unavailable_when_introspection_raises -q
    expected: >-
      Each of _count_files, _sum_file_bytes, _collect_file_paths, _dry_run_cleanup_paths and
      _dry_run_orphan_paths raises when its connection raises; none returns 0, {} or []. And
      action_merge_ops, the one caller that must NOT abort, reports count_unavailable instead.
    fix_if: >-
      A helper still returns an empty default -- delete its bare `except Exception` and let the error
      propagate. Do not re-add a permissive default anywhere on the guard path.
    graduation: graduate
    graduation_check_id: maintenance-helpers-raise-on-introspection-error
  - step: 3
    phase: pre-deploy
    action: >-
      Deterministically prove ALL FIVE bare excepts are gone, not just the one the node id covers.
      A class selector is green with one passing test, so this is the assertion that forces the set.
    command: test "$(grep -c 'except Exception' src/common/ducklake_maintenance.py)" -eq 1
    expected: >-
      Exactly ONE remains -- the deliberate observability catch in catalog_stats (line 519 today).
      Measured red-before: the file currently holds 6.
    fix_if: >-
      Count above 1 -- a swallowing except survives on the guard path. Count 0 -- the deliberate
      catalog_stats catch was removed too; restore it, it is not part of the defect.
    graduation: graduate
    graduation_check_id: maintenance-helpers-single-deliberate-except
  - step: 4
    phase: pre-deploy
    action: Prove G1 aborts when a would-delete path is still referenced by a live snapshot.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k g1_ -q
    expected: >-
      A non-empty intersection raises naming the path and records zero destructive SQL; the disjoint
      red case does NOT raise.
    fix_if: Destructive calls appear in the recorded SQL after an intersection -- move G1 before them.
    graduation: graduate
    graduation_check_id: gc-reachability-invariant-empty-intersection
  - step: 5
    phase: pre-deploy
    action: Prove G2, G3 and G4 each abort on their own trigger and pass otherwise.
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_ops.py -k "g2_ or g3_ or g4_ or real_dry_run_size" -q
    expected: >-
      G2 raises when the post-expiry snapshot count is below the floor; G3 raises on an empty live set
      and on an out-of-bound live-byte drop; G4 bounds a 24,435-candidate pass and reports a non-zero
      deferred remainder with NON-ZERO would-delete bytes (rec-3761's dead path). Each has a green case.
    fix_if: >-
      G4 reports zero bytes -- it is still summing over the current-snapshot dict instead of the
      dry-run's size column.
    graduation: graduate
    graduation_check_id: gc-guards-g2-g3-g4-discriminate
  - step: 6
    phase: pre-deploy
    action: >-
      Sweep all SIX surfaces carrying the retired names or threshold prose. Verified 2026-09-13 that
      this pattern currently matches on every one -- measured lines 16/10/1/3/1/9 and does NOT match
      MaintenanceBreakerTrip, which must survive.
    command: "for f in src/common/ducklake_maintenance.py src/lambdas/ducklake_maintenance_smoke/handler.py terraform/personal/ducklake_maintenance.tf terraform/personal/ducklake_maintenance_smoke.tf docs/contracts/ducklake_maintenance.yaml docs/runbooks/ducklake-catalog-operations.md; do test -f \"$f\" || { echo \"MISSING SWEEP SURFACE: $f\"; exit 1; }; done; ! rg -n 'file_fraction|GC_BREAKER_FILE_FRACTION|GC_BREAKER_BYTES|force_file_fraction|force_byte_budget|check_gc_breaker|20% files|10 GiB' src/common/ducklake_maintenance.py src/lambdas/ducklake_maintenance_smoke/handler.py terraform/personal/ducklake_maintenance.tf terraform/personal/ducklake_maintenance_smoke.tf docs/contracts/ducklake_maintenance.yaml docs/runbooks/ducklake-catalog-operations.md"
    expected: No matches on any of the six surfaces (exit 0 via the negation).
    fix_if: >-
      Any surface still carries a retired name or threshold pin -- retire it there too. Do NOT widen
      the pattern to bare 'breaker': MaintenanceBreakerTrip is retained and would false-positive.
    graduation: waive
    graduation_waiver_reason: >-
      The command is a path-existence loop followed by a negated rg -- two commands, which no single
      CANONICAL_SLOTS primitive expresses. The precondition is load-bearing (a bare negated rg exits 0
      when a path is missing, because rg exits 2 and the negation maps it to success), so collapsing
      it to a graduable grep_count slot would reintroduce the false-pass it exists to prevent.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove breaker_probe still forces a trip and that a non-forcing input does not -- the probe's
      whole purpose is a guaranteed trip, and retiring its two forcing parameters would leave c9's
      fourth gate with no subject.
    command: bin/venv-python -m pytest tests/test_ducklake_maintenance_smoke_handler.py::test_breaker_probe_forces_g1_trip tests/test_ducklake_maintenance_smoke_handler.py::test_breaker_probe_non_forcing_input_does_not_trip -q
    expected: The forcing input raises DuckLakeMaintenanceError; the non-forcing red case does not.
    fix_if: >-
      The probe never raises, or the non-forcing red case ALSO raises so the two directions cannot be
      told apart -- name a real forcing input against G1 and assert both directions. A raise that
      occurs on every invocation carrying the forcing constant, whatever the catalog holds, is the
      INTENDED production behaviour of this probe, not a failure condition.
    graduation: graduate
    graduation_check_id: breaker-probe-retains-forcing-subject
  - step: 8
    phase: pre-deploy
    action: Prove both smoke gates discriminate against a pre-fix build.
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_gc_gate_fails_on_pre_fix_breaker_stats_shape tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_breaker_gate_fails_when_probe_does_not_trip -q
    expected: >-
      The gc gate fails on a pre-fix body (one carrying breaker_stats / file_fraction) and PASSES on a
      post-fix body carrying guard stats, including when files_cleaned is 0 -- the fresh-catalog case
      the deployed gate hits on every push. The breaker gate fails when the probe returns 200 with
      breaker_tripped False.
    fix_if: >-
      A gate passes on the pre-fix response shape -- it is still unfailable. Do NOT reach for a
      files_cleaned > 0 assertion: the deployed gate runs on a fresh catalog where that is
      structurally 0, and asserting it reds every DuckLake deploy.
    graduation: graduate
    graduation_check_id: maintenance-smoke-gates-discriminate
  - step: 9
    phase: pre-deploy
    action: >-
      Prove neither alarm description pins a THRESHOLD SHAPE (percentage bound or byte bound),
      block-scoped per resource. A line grep over the retired NAMES cannot see this prose -- verified:
      the names pattern returns zero matches on ducklake_maintenance.tf while its alarm description
      carries ">20% files or >10 GiB". Shape and not any-digit, because the rewritten description
      keeps its "T2.18 / CD.33 H1" provenance tag.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py -q
    expected: >-
      Each aws_cloudwatch_metric_alarm block is sliced by resource header and asserted free of a
      threshold SHAPE. Block-scoping is required NOT because a file holds two alarms -- measured, each
      file holds exactly one -- but because sibling non-alarm description fields carry LEGITIMATE
      numerics (e.g. "every 6h" on the EventBridge rules), which a whole-file assertion would
      false-positive on. THREE red-case fixtures, all required: (a) a non-alarm description carrying a
      number, which must NOT trip; (b) an alarm description carrying ">20% files or >10 GiB", which
      MUST trip; (c) an alarm description carrying only the "T2.18 / CD.33 H1" provenance tag, which
      must NOT trip -- (c) is what distinguishes a shape assertion from an any-digit one, and without
      it the assertion this plan lands would reject its own output.
    fix_if: >-
      The non-alarm fixture trips (the assertion is whole-file, not block-scoped) or the
      provenance-tag fixture trips (the assertion is any-digit, not shape-scoped). Do not graduate
      until all three fixtures land as specified.
