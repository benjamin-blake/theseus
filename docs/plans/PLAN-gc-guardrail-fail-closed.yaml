constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    NEVER relax a guardrail, threshold or assertion to obtain green (Decision 55 / Decision 181). This
    plan RETIRES a metric that cannot pass in steady state; it does not raise one.
  - >-
    Do not graduate any VP step whose red case has not been shown to fail. A prior draft of this work
    marked a DISABLED-rule grep for graduation; it was measured PASSING on the very fixture it was
    meant to catch. Every terraform assertion here carries a MIXED red case, not a trivially-absent one.
  - >-
    MaintenanceBreakerTrip is RETAINED -- it is the metric both alarms fire on. Do not widen the
    sweep pattern to bare 'breaker'.
  - >-
    OUT OF SCOPE -- owned by the sibling session on claude/ops-entity-counters-partition-y55yzj
    (PLAN-control-table-class-and-counter-conformance): config/lambda/ducklake/field_semantics*.yaml,
    src/common/ducklake_scd2_schema.py, scripts/schema_to_field_semantics.py, src/lambdas/ducklake_writer/*,
    docs/contracts/storage-substrate.yaml, data-modeling-standard.yaml, ops_entity_counters.yaml.
    Registering a table in ops_tables widens ops_table_names(), the closed-boundary allow-list read by
    BOTH ducklake_reader and ducklake_writer -- that boundary question is theirs, not this plan's.
  - >-
    terraform/personal is CI-delegated -- no local terraform init/validate/plan (Decision 119). Code
    deploys ride the governed CD channel, never build_lambda --deploy (Decision 125/126).
  - >-
    Decision 177: Decision 81's body is append-only -- the amendment lands as a dated appended line,
    never an in-place body rewrite.
  - >-
    SLOC governance -- the guard set lands in the new module (Decision 128). ducklake_maintenance.py
    has 57 lines of headroom and its test file 72; this plan NET REMOVES from both.
