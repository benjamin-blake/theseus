constraints:
  - >-
    Additive-only for the pre-existing watched set. Moving any of CI, Main Canary,
    terraform-apply-sandbox, rec-autoclose or deploy-ducklake-lambdas to excluded is OUT OF SCOPE
    and would fire Decision 154 point 6's reversal condition (b). rec-2919 (make reconcile.yml
    ci-rca-watchable) likewise cannot land here -- it requires amending Decision 154 point 6 first.
  - >-
    Do NOT grow scripts/verify_ci_workflow.py. It measures exactly 500 SLOC and is unregistered in
    config/sloc_budgets.yaml, so any addition breaches the unregistered-file cap; Decision 128 makes
    decomposition the default and forbids defaulting to a budget raise. Its existing floor-only
    _check_ci_rca_filter is retained deliberately: it asserts a five-entry FLOOR that must never
    shrink, which is a different and weaker claim than the new check's set-equality. Keeping it
    means a regression that neutered the new check would still not silently drop a watched workflow.
    This is not a second registry -- both read the same single source of truth.
  - >-
    Do NOT import _VALID_OWNERS from scripts/checks/registry.py. A check's `owner` is Decision 104's
    platform/product federation axis; a workflow's `owner` means "who triages this workflow's
    failures". Same token, different vocabulary -- coupling them would let a change to either
    silently constrain the other. Declare the workflow owner vocabulary in the taxonomy file.
  - >-
    resolve_workflow_tier's signature and return contract must not change. Containing the migration
    behind that seam is what keeps scripts/ci_rca/evidence/_bundle_core.py, the published bundle key
    `workflow_to_tier_resolution`, and the other downstream consumers out of scope.
  - >-
    Do NOT edit scripts/ci_rca/designed_refusal.py. No designed-refusal declaration is added for
    deploy-prod-lambdas -- see the context bullet; declaring a job name that does not exist would be
    inert against a fail-closed predicate and actively misleading.
  - >-
    The new check must stay --pre eligible: pure file-glob + YAML parse, no subprocess, no network,
    sub-100ms (Decision 60), matching its sibling validate_ci_rca_taxonomy.
  - No rescue agents or workaround loops; forward-fix only (Decision 55).
context:
  - >-
    Origin: a session audit of three workflow failures the operator received by email
    (ghas-probe run 31369698093, dedup-probe run 31378438821, CI run 31414547731). Zero CI-RCA recs
    were filed for any of them, and in each case that was structural: ghas-probe was un-adjudicated,
    dedup-probe is deliberately excluded, and ci-rca gates to the default branch so a PR-branch red
    never files. The CI failure was independently fixed and merged as PR #877.
  - >-
    Verified this session: 11 of 19 workflows appear in NEITHER watched: nor excluded: in
    docs/contracts/ci-rca-lifecycle.yaml, and NOTHING enforces the contract's stated per-entry
    adjudication requirement. scripts/verify_ci_workflow.py:212-241 asserts only a floor (five names
    are present in the runtime filter) plus uniqueness and never opens the contract; its own comment
    at :206 concedes this. The only code that reads the contract is a diff-gated verification-registry
    row that has not executed since it graduated on 2026-07-26.
  - >-
    Highest-consequence gap closed here: deploy-prod-lambdas is un-adjudicated while its twin
    deploy-ducklake-lambdas is watched, so a prod Lambda deploy failure currently files nothing.
  - >-
    deploy-prod-lambdas / Decision 62 / Decision 73 tension, RE-ARGUED after plan critique. The
    first draft claimed a designed-refusal predicate as the mitigation. That claim was wrong twice
    over: DESIGNED_REFUSAL_JOBS lives in scripts/ci_rca/designed_refusal.py:38, not in the workflow
    file the scope row named; and deploy-prod-lambdas has exactly two jobs (deploy, smoke) with no
    reconcile-gate analogue, so there is no refusal to declare and is_designed_refusal is fail-closed
    (a bogus job name buys nothing). The correct argument is that NO mitigation is owed: unlike
    terraform-drift and convergence-health, which sit red ENVIRONMENTALLY and would mint a fresh
    L5/L6 critical on every push, deploy-prod-lambdas has no standing-red class -- its bootstrap-window
    path is continue-on-error and yields a GREEN no-op (deployed=false). It reds only on a genuine
    deploy or smoke failure, which is a real defect that merits the critical lane (Decision 126 point 1
    makes it the sanctioned prod deploy verb). If it nonetheless proves flappy in practice, rec-2854's
    alarm-not-gate monitor lane remains the documented fallback, and reverting the single filter line
    stops the filing immediately.
  - >-
    Design pivot from the decision-scout gate: the first draft proposed asserting workflow coverage
    against ci-rca-lifecycle.yaml's watched:/excluded: maps. config/ci_rca_taxonomy.yaml's map ALREADY
    enumerates all 19 workflows exhaustively and validate_ci_rca_taxonomy ALREADY fails on any
    absentee, so that draft would have created a second exhaustive enumeration with a second gate --
    the drift-by-design anti-pattern Decision 86 and AGENTS.md forbid. Hence the fold.
  - >-
    Blast radius was re-derived from an anchored `git grep` census after plan critique, not from the
    scope table. The census names ten live consumers; the first draft scoped six of them and missed
    config/agent/verification_registry/registry.yaml, tests/ci_rca/taxonomy/test_classify_failures_plural.py,
    tests/ci_rca/evidence/test_fingerprint.py and tests/ci_rca/evidence/test_priority_zero.py -- all four
    hard-break on the migrated required-keys set. All ten are now in scope.
  - >-
    Decision 132 framing correction: the diff-gated verification-registry row is NOT a defect. VF-06
    admission is diff-scoped by design, so a graduated row not re-executing post-merge is intended.
    The real gap is the absence of a registered TIER check, which is what this plan adds.
  - >-
    config/ci_rca_taxonomy.yaml carries no contract:/class: envelope (schema_version 1), so it is not
    a Class D ritual contract and validate_contract_drift does not gate it. Decision 168's Class D
    concern attaches to ci-rca-lifecycle.yaml, which is one of the 21 grandfathered non-ritual files;
    this plan gives that file a real evaluator (validate_ci_rca_adjudication) without adding a
    contract: envelope, so the grandfathered_max ratchet is unaffected.
  - >-
    rec-2736 (planning skill should flag CI-RCA taxonomy registration for new workflow files) is open
    and adjacent: this plan makes that registration machine-enforced rather than skill-prompted, which
    likely supersedes it. Deliberately NOT bundled -- run the Recommendation Relevance Gate on it at
    implement time and close it as satisfied/superseded on the evidence, rather than pre-committing a
    closure this plan cannot yet verify.
  - >-
    A stale key was found during design: `Refresh Copilot Model Multipliers` sits in the map with no
    corresponding workflow file, surviving because today's coverage gate is one-directional. The
    bidirectional assertion in VP step 1 both removes it and prevents recurrence.
  - >-
    Pre-existing registry rot found during critique, NOT caused by this plan and deliberately out of
    scope: the graduated rows `ci-rca-workflow-count-drift-real-dir-selector` and
    `convergence-taxonomy-fingerprint-distinctness` point at tests/test_ci_rca_taxonomy.py, which no
    longer exists. File a rec rather than widening this plan.
  - >-
    Branch was rebased onto origin/main edab65c (PR #883, Decision 169 -- per-domain manifest
    dispatch) before this plan was written. Confirmed zero file overlap between #883 and this plan's
    scope. #883 is why the new check registers via a manifest Entry rather than a validate.py facade
    line, and why Entry.owner is now a validated field.
  - >-
    Decision-scout verdict FLAGS_FOUND (122 of 122 triaged). CITE list: Decision 163, Decision 168,
    Decision 169, Decision 104, Decision 73, Decision 72, Decision 142, Decision 154, Decision 126,
    Decision 165, Decision 132. Flags resolved in-plan: Decision 128 (SLOC -- new module, not growth
    in verify_ci_workflow.py), Decision 154 (additive-only constraint), Decision 86 (the fold),
    Decision 62 (deploy-prod-lambdas re-argued on merits, no false mitigation), Decision 104 (owner
    vocabulary decoupled).
  - >-
    gates: decision-scout=FLAGS_FOUND (122 of 122 triaged); plan-critique=PROCEED after 4 round(s).
    Rounds 1-3 returned REVISE. The 3-round convergence cap was explicitly lifted by the operator
    given the scope. Findings converged rather than thrashed -- round 1 architecture and scope
    (4 census consumers missing, a false designed-refusal mitigation), round 2 logic (VP11's sweep
    matched its own graduation rows), round 3 mechanics (the plan redded its own PR under
    validate_handoff_full_tier / Decision 163; a pytest flag collision with the pinned
    --randomly-seed addopt). Round 4 closed all five round-3 findings with independent execution and
    found no blocking defects. The approach -- the fold onto config/ci_rca_taxonomy.yaml, the
    new-module-over-budget-raise call, and the bidirectional-plus-filter-equality shape -- survived
    all four rounds unchanged.
