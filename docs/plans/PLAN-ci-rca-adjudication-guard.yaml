    behavior: >-
      Fails on an unregistered workflow, a stale map entry, a filter/watched mismatch in either
      direction, a missing or invalid owner, an empty rationale, and an invalid ci_rca value;
      passes on the real repo state.
    verification_step: 7
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
    red_green_expectation: >-
