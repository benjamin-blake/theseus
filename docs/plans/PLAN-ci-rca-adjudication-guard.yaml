      with every negative case asserting a non-empty failed list.
  - source: config/ci_rca_taxonomy.yaml
    behavior: >-
      The migrated `workflows:` map keeps bidirectional parity with .github/workflows/*.yml, and
      every entry carries a valid ci_rca / owner / rationale -- the properties the new check reads.
      A regression here (a dropped entry, a reintroduced stale key, a bare-string value) must red.
    verification_step: 7
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
    red_green_expectation: >-
