rollback: >-
  Pure-additive plus one mechanical rename. To revert: restore `workflow_to_tier:` with flat string
  values (including the stale key if exact fidelity is wanted), revert scripts/ci_rca/taxonomy.py and
  validate_ci_rca_taxonomy.py, delete
  scripts/checks/ci_guards/validate_ci_rca_adjudication.py and its Entry from _manifest.py, delete
  its test file, revert the six census-identified test/fixture files and the registry.yaml rows,
  remove deploy-prod-lambdas from ci-rca.yml's filter, and restore ci-rca-lifecycle.yaml's
  watched:/excluded: maps. No infrastructure or IAM state to unwind; no data migration. Reverting the
  single ci-rca.yml filter line alone is sufficient to stop prod-deploy failures filing recs if that
  proves too noisy, without unwinding anything else.
