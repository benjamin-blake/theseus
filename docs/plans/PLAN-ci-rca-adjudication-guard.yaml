schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ci-rca-adjudication-guard"
intent: >-
  Make every GitHub Actions workflow's CI-RCA disposition a machine-enforced fact rather than
  honor-system prose, so a workflow can never again enter the repo un-adjudicated -- closing the
  prod-deploy blind spot (deploy-prod-lambdas files nothing on failure today) and giving the
  autonomous loop a single, gated registry of what CI-RCA watches.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-adjudication-guard.yaml
phase: >-
  Platform T2 (durable operational state hardening) -- CI-RCA observability plane. Not a tier_item
  slice: this is an ad_hoc finding surfaced by a session audit of three workflow failures, so the
  Tier Item Freshness Gate is skipped per the soft-warn exception categories (ad_hoc_rec /
  user_explicit_out_of_scope).
scope:
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Rename `workflow_to_tier:` to `workflows:` and nest each entry's value as a mapping
      {tier, ci_rca, owner, rationale}. This is the fold: the file already carries the ONLY
      exhaustive per-workflow registry in the repo (all 19 workflows, gated by
      validate_ci_rca_taxonomy), so the CI-RCA disposition belongs in those entries rather than in
      a second map. `ci_rca:` is `watched` or `excluded`; `owner:` is the triage owner (`platform`
      for every current entry); `rationale:` carries the per-entry adjudication text, migrated
      verbatim from ci-rca-lifecycle.yaml's watched_workflow_set where one exists and newly
      authored for the 11 currently unadjudicated workflows. Also DELETES the stale
      `Refresh Copilot Model Multipliers` key, which names no workflow file and survives only
      because today's coverage gate is one-directional. ALSO adds a `function_to_category` entry for
      the new check: validate_ci_rca_taxonomy fails with "registered check absent from
      function_to_category" for ANY registered check lacking one (all 98 current checks have one),
      so registering validate_ci_rca_adjudication forces this entry in the same PR. Classify it
      `schema_drift`, matching the sibling validate_check_manifests entry added by #883.
  - file: scripts/ci_rca/taxonomy.py
    action: Modify
    purpose: >-
      Point the required-keys set (line 39) at `workflows` and make resolve_workflow_tier read
      `entry["tier"]` from the nested mapping. Its SIGNATURE AND RETURN CONTRACT ARE UNCHANGED
      (still `str`, still 'unknown' for a miss and for not_a_gate) -- this deliberately contains
      the blast radius so scripts/ci_rca/evidence/_bundle_core.py:104 and every other downstream
      consumer of the returned string need no edit. THREE occurrences change, not two: line 39's
      required-keys set, line 319's tier_map read, and line 322's
      `logger.warning("workflow_to_tier miss: ...")` message string, which VP step 11's sweep also
      catches.
  - file: scripts/checks/ci_guards/validate_ci_rca_taxonomy.py
    action: Modify
    purpose: >-
      Read the renamed/nested `workflows:` map. Existing coverage semantics (every actual workflow
      present) and the function_to_category / failure_categories legs are preserved unchanged --
      the bidirectional and adjudication assertions land in the NEW sibling check, not here, so
      this check keeps its single, already-registered responsibility.
  - file: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
    action: Create
    purpose: >-
      The new enforcement. Asserts (a) the `workflows:` key set EQUALS the set of
      .github/workflows/*.yml display names in BOTH directions (catching both an unregistered
      workflow and a stale map entry); (b) .github/workflows/ci-rca.yml's on.workflow_run.workflows
      list EQUALS exactly the entries marked `ci_rca: watched` (both directions, replacing today's
      floor-only membership test); (c) every entry declares a valid `ci_rca`, `owner`, and a
      non-empty `rationale`. A NEW module rather than growth inside scripts/verify_ci_workflow.py,
      which measures exactly 500 SLOC and is unregistered in config/sloc_budgets.yaml -- any growth
      there breaches the cap, and Decision 128 makes decomposition the default response, never a
      raise. Pure file-glob + YAML parse, no subprocess, no network: --pre eligible per Decision 60,
      matching its sibling validate_ci_rca_taxonomy.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Register the new check with one Entry literal -- bare string literals for module=/attr= per
      docs/contracts/check-manifest.yaml, pre=True and full_segment="full_after_lint" to match its
      sibling validate_ci_rca_taxonomy's tier placement (Decision 169).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Add "deploy-prod-lambdas" to the on.workflow_run.workflows filter, closing the prod-deploy
      blind spot: its twin deploy-ducklake-lambdas is watched on the argument that "a build/deploy/
      smoke failure in the governed code-deploy CD channel is genuinely invisible today and
      warrants a critical", and deploy-prod-lambdas.yml:12 states it mirrors that workflow for the
      prod class (Decision 126 point 1 makes it the sanctioned prod deploy verb). SECOND permitted
      edit: the header comment at line 18 currently directs readers to ci-rca-lifecycle.yaml's
      watched_workflow_set "for the per-entry adjudication" -- a pointer at the registry this plan
      deletes -- so it is repointed at config/ci_rca_taxonomy.yaml (asserted by VP step 14). No
      designed-refusal change is made here or anywhere (see the deploy-prod-lambdas context bullet
      for why none is owed).
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Retire watched_workflow_set as a second registry: replace the watched:/excluded: maps with a
      pointer naming config/ci_rca_taxonomy.yaml's `workflows:` as the sole source of truth, and
      name validate_ci_rca_adjudication as its evaluator. The per-entry adjudication PROSE is not
      lost -- it migrates verbatim into the taxonomy entries' `rationale:` fields. The
      designed_refusal and closure_dependency sections are left untouched. ONE narrow edit is
      permitted inside starved_review_observability: its line 375 back-reference reads "reconcile.yml
      is absent from ci-rca's watched_workflow_set above", which dangles once the maps above are
      gone -- repoint that clause at the taxonomy without altering the section's substance.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Three obligations land here, all in the implement PR. (i) Add one NEW row per `graduate` VP
      step (10 rows: steps 1, 2, 3, 4, 6, 7, 9, 10, 11, 14) with check_id equal to that step's
      graduation_check_id -- validate_graduation_completeness's implement-PR leg requires a
      new-in-diff row per graduated step, and the 10 slugs are verified collision-free against the
      383 existing check_ids. (ii) Repoint the graduated row `ci-rca-lifecycle-records-watched-set`, whose
      command does `raw.index('terraform-drift')` / `raw.index('dedup-probe')` against strings that
      exist ONLY inside the watched:/excluded: maps this plan deletes -- update its check_spec to
      probe the new pointer text, or retire the row. (iii) Repoint the graduated row
      `ci-rca-refusal-gate-and-junit-precedence` (guard_target scripts/ci_rca/taxonomy.py), whose
      command builds `{'workflow_to_tier': {}}` and would raise ValueError against the migrated
      required-keys set.
  - file: tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
    action: Create
    purpose: >-
      Unit tests for the new check: both directions of workflow-set equality, both directions of
      filter/watched equality, missing/invalid owner, missing rationale, invalid ci_rca value, and
      the happy path against the real repo state. Every negative case must assert a NON-EMPTY
      failed list -- a guard that cannot fail is the defect this plan exists to prevent.
  - file: tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
    action: Modify
    purpose: Update the inline taxonomy fixtures to the nested `workflows:` shape.
  - file: tests/ci_rca/taxonomy/test_load_and_classify.py
    action: Modify
    purpose: >-
      The dedicated suite for scripts/ci_rca/taxonomy.py -- update any taxonomy literals to the
      nested `workflows:` shape and add the resolve_workflow_tier return-contract assertion that
      guards the migration seam.
  - file: tests/ci_rca/taxonomy/test_classify_failures_plural.py
    action: Modify
    purpose: >-
      Census-identified consumer. Carries four inline flat taxonomy literals written to temp files
      and passed as `path=` into classify_failure/classify_failures, each routing through
      load_taxonomy -- all four hard-break on the migrated required-keys set. It ALSO imports the
      shared fixture, so migrating the fixture alone is insufficient.
  - file: tests/ci_rca/evidence/test_fingerprint.py
    action: Modify
    purpose: >-
      Census-identified consumer: inline flat taxonomy literal written to disk and passed as
      `taxonomy_path=`; hard-breaks on the migrated required-keys set.
  - file: tests/ci_rca/evidence/test_priority_zero.py
    action: Modify
    purpose: >-
      Census-identified consumer: module-level flat taxonomy literal fed through `_taxonomy_file()`
      into generate_bundles; hard-breaks on the migrated required-keys set.
  - file: tests/fixtures/ci_rca/taxonomy_data.py
    action: Modify
    purpose: Update the shared taxonomy fixture to the nested `workflows:` shape.
  - file: tests/fixtures/ci_rca/evidence_taxonomies.py
    action: Modify
    purpose: Update the evidence-bundle taxonomy fixtures to the nested `workflows:` shape.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    config/ci_rca_taxonomy.yaml declares a `workflows:` map whose key set is exactly the 19
    .github/workflows/*.yml display names, with no `workflow_to_tier:` key remaining and no
    `Refresh Copilot Model Multipliers` entry.
  - >-
    Every `workflows:` entry declares tier, ci_rca (watched|excluded), owner (platform), and a
    non-empty rationale.
  - >-
    .github/workflows/ci-rca.yml's on.workflow_run.workflows list equals exactly the set of entries
    marked `ci_rca: watched`, and that set includes deploy-prod-lambdas.
  - >-
    Every workflow watched before this plan (CI, Main Canary, terraform-apply-sandbox,
    rec-autoclose, deploy-ducklake-lambdas) is still marked watched -- the adjudication is
    additive-only, so Decision 154's reversal condition (b) -- which guards point 6's
    anti-masking mechanism -- does not fire.
  - >-
    validate_ci_rca_adjudication is registered in scripts/checks/ci_guards/_manifest.py, carries a
    function_to_category entry in config/ci_rca_taxonomy.yaml (forced by validate_ci_rca_taxonomy's
    registered-check leg), dispatches under both --pre and the full tier, and fails on each of: an
    unregistered workflow, a stale map entry, a filter/watched mismatch in either direction, a
    missing owner, a missing rationale.
  - >-
    resolve_workflow_tier returns the same string for all 19 workflow names after the migration as
    before it -- no downstream evidence-bundle behaviour changes.
  - >-
    docs/contracts/ci-rca-lifecycle.yaml no longer carries a watched:/excluded: workflow registry
    and names config/ci_rca_taxonomy.yaml as the source of truth plus its evaluator check.
  - >-
    No LIVE consumer references the retired `workflow_to_tier` key -- scoped to scripts/, tests/,
    config/, docs/contracts/ and .github/. Historical plan documents, the grandfathered
    docs/INTENT-ci-rca-methodology.md, the audit prompt, and the evidence-bundle SCHEMA FIELD
    `workflow_to_tier_resolution` are deliberately out of jurisdiction: the field name is a
    published bundle key that constraint 4 holds out of scope, and rewriting history is not a goal.
  - >-
    Both graduated verification-registry rows that the migration would break
    (`ci-rca-lifecycle-records-watched-set`, `ci-rca-refusal-gate-and-junit-precedence`) are
    repointed or retired in the same PR, and one new row exists per `graduate` VP step.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm the taxonomy declares `workflows:` (not the retired key) and that its key set equals
      the actual workflow display names in BOTH directions -- the assertion that catches both an
      unregistered workflow and today's stale entry.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.taxonomy import enumerate_workflow_names,
      load_taxonomy; t=load_taxonomy(); assert 'workflow_to_tier' not in t, 'retired key survives';
      w=t['workflows']; a=set(enumerate_workflow_names()); assert set(w)==a, (sorted(set(w)-a),
      sorted(a-set(w))); print('bidirectional coverage OK', len(a))"
    expected: "Prints bidirectional coverage OK 19; exits 0."
    fix_if: >-
      A key remains in the map with no workflow file (the stale Refresh Copilot Model Multipliers
      entry was not deleted), or a workflow file has no entry, or the rename did not land.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-workflows-map-bidirectional"
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm every entry carries the four required fields with valid values, and that owner is
      platform throughout.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.taxonomy import load_taxonomy;
      w=load_taxonomy()['workflows']; bad=[k for k,v in w.items() if not isinstance(v,dict) or
      v.get('ci_rca') not in ('watched','excluded') or v.get('owner')!='platform' or not
      str(v.get('rationale','')).strip() or not str(v.get('tier','')).strip()]; assert not bad,
      bad; print('entry shape OK', len(w))"
    expected: "Prints entry shape OK 19; exits 0."
    fix_if: >-
      Any entry is a bare string (not migrated to the nested mapping), or is missing tier / ci_rca /
      owner / rationale, or carries an owner other than platform.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-workflows-entry-shape"
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm ci-rca.yml's runtime workflow_run filter equals the watched set exactly in both
      directions -- the assertion that replaces today's floor-only membership test -- and that
      deploy-prod-lambdas is in it.
    command: >-
      bin/venv-python -c "import yaml; from scripts.ci_rca.taxonomy import load_taxonomy;
      d=yaml.safe_load(open('.github/workflows/ci-rca.yml')); f=set(d.get(True,
      d.get('on',{}))['workflow_run']['workflows']); w={k for k,v in
      load_taxonomy()['workflows'].items() if v['ci_rca']=='watched'}; assert f==w, (sorted(f-w),
      sorted(w-f)); assert 'deploy-prod-lambdas' in f; print('filter==watched OK', sorted(f))"
    expected: >-
      Prints filter==watched OK with a sorted list containing deploy-prod-lambdas alongside the
      five pre-existing watched workflows; exits 0.
    fix_if: >-
      The filter and the watched set diverge in either direction, or deploy-prod-lambdas was added
      to only one of the two surfaces.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-filter-equals-watched"
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm the adjudication is additive-only for the pre-existing watched set, so Decision 154's
      reversal condition (b), which guards point 6's anti-masking mechanism, -- "Decision 142's chain-lifecycle watch lapses or is
      narrowed" -- does not fire.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.taxonomy import load_taxonomy; w=load_taxonomy()
      ['workflows']; prior=['CI','Main Canary','terraform-apply-sandbox','rec-autoclose',
      'deploy-ducklake-lambdas']; bad=[p for p in prior if w[p]['ci_rca']!='watched']; assert not
      bad, bad; print('additive-only OK')"
    expected: "Prints additive-only OK; exits 0."
    fix_if: >-
      Any previously-watched workflow was moved to excluded. That is a narrowing and requires
      amending Decision 154 point 6 first -- it is out of scope for this plan.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-watched-additive-only"
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm resolve_workflow_tier's return contract is unchanged post-migration for all 19
      workflows -- proving the nesting did not alter downstream evidence-bundle behaviour.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.taxonomy import enumerate_workflow_names,
      resolve_workflow_tier as r; got={n:r(n) for n in enumerate_workflow_names()};
      assert got['CI']=='CI' and got['Main Canary']=='CI', got; assert
      all(v=='unknown' for k,v in got.items() if k not in ('CI','Main Canary')), got;
      print('tier resolution unchanged', len(got))"
    expected: "Prints tier resolution unchanged 19; exits 0."
    fix_if: >-
      A tier value changed, or resolve_workflow_tier raised (it reads the nested mapping
      incorrectly, e.g. returns the dict instead of entry['tier']).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Structurally non-admissible, not merely inconvenient. This is a NO-CHANGE proof: it passes on
      the origin/main leg as well as HEAD (verified by direct execution during plan critique --
      exits 0 today). VF-06 admission requires a graduated check to FAIL on origin/main and PASS on
      HEAD, so graduating this step would make the implement PR red on its own graduation row. Its
      regression value is real but belongs to the migration window only.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the new check is registered in the ci_guards manifest and resolves and dispatches
      through the Decision 169 registry in both tiers.
    command: >-
      bin/venv-python -c "from scripts.checks import registry;
      n='validate_ci_rca_adjudication'; assert n in registry.all_checks(), 'not registered';
      assert callable(registry.resolve(n)); assert n in [s.name for s in
      registry.pre_sequence() if s.kind=='check'], 'absent from --pre'; assert n in [s.name for s
      in registry.full_sequence() if s.kind=='check'], 'absent from full'; print('registered OK')"
    expected: "Prints registered OK; exits 0."
    fix_if: >-
      The Entry literal is missing from scripts/checks/ci_guards/_manifest.py, uses a computed or
      "module:attr" value instead of two bare string literals, or omits pre=True / full_segment.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-adjudication-check-registered"
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the new check actually FAILS on each violation class rather than passing vacuously --
      the red-before-green evidence for the guard itself.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_adjudication.py
    expected: >-
      All tests pass, including the negative cases: unregistered workflow, stale map entry,
      filter/watched mismatch in each direction, missing owner, missing rationale, invalid ci_rca
      value.
    fix_if: >-
      Any negative-case test passes when the check should have appended to failed -- the guard is
      vacuous. Do not weaken the test; fix the check.
    hermetic: false
    graduation: graduate
    graduation_check_id: "ci-rca-adjudication-guard-not-vacuous"
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm the migrated taxonomy fixtures did not break the census-identified consumer suites.
      Selector list is a SUPERSET of the anchored `workflow_to_tier` census: the four census-matching
      suites plus test_load_and_classify.py, which carries no token but owns the
      resolve_workflow_tier return-contract assertion guarding the migration seam.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
      tests/ci_rca/taxonomy/test_load_and_classify.py
      tests/ci_rca/taxonomy/test_classify_failures_plural.py
      tests/ci_rca/evidence/test_fingerprint.py tests/ci_rca/evidence/test_priority_zero.py
    expected: All five suites pass against the nested `workflows:` shape.
    fix_if: >-
      A fixture or inline literal still declares the flat `workflow_to_tier` shape, so load_taxonomy
      raises ValueError on its required-keys set.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This is a one-shot migration-window regression sweep over five suites that carried flat
      taxonomy literals. Post-migration those literals no longer exist, so a graduated row would
      assert a shape no longer under threat -- the standing guard against reintroducing the flat
      shape is step 1's `assert 'workflow_to_tier' not in t`, which IS graduated. Kept as a VP step
      because the migration must not be declared done on an unrun suite.
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm docs/contracts/ci-rca-lifecycle.yaml no longer carries a second workflow registry and
      names both the source of truth and its evaluator.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/contracts/ci-rca-lifecycle.yaml'));
      s=d.get('watched_workflow_set',{}); assert 'watched' not in s and 'excluded' not in s,
      'second registry survives'; raw=open('docs/contracts/ci-rca-lifecycle.yaml').read();
      assert 'config/ci_rca_taxonomy.yaml' in raw and 'validate_ci_rca_adjudication' in raw;
      assert 'watched_workflow_set above' not in raw, 'starved_review_observability still
      back-references the deleted maps'; print('contract points at SoT + evaluator')"
    expected: "Prints contract points at SoT + evaluator; exits 0."
    fix_if: >-
      The watched:/excluded: maps survive (two registries again), or the contract does not name the
      taxonomy file and the evaluating check.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-lifecycle-points-at-taxonomy"
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm each probed entry carries its load-bearing rationale citation -- whether MIGRATED from
      the retired watched_workflow_set (terraform-drift, convergence-health, dedup-probe,
      rec-autoclose) or NEWLY AUTHORED by this plan (reconcile, which is one of the 11 previously
      unadjudicated workflows and whose exclusion basis is Decision 154 point 6).
    command: >-
      bin/venv-python -c "from scripts.ci_rca.taxonomy import load_taxonomy; w=load_taxonomy()
      ['workflows']; probes={'terraform-drift':'Decision 92','convergence-health':
      'Decision 62','dedup-probe':'probes','rec-autoclose':'2026-07-24','reconcile':'Decision 154'};
      bad=[k for k,p in probes.items() if p.lower() not in str(w[k]['rationale']).lower()];
      assert not bad, bad; print('rationale migration OK')"
    expected: "Prints rationale migration OK; exits 0."
    fix_if: >-
      A migrated rationale lost its load-bearing citation -- e.g. terraform-drift's Decision 92
      point 6 basis, or reconcile's Decision 154 point 6 basis. Restore the text verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-rationale-migration-preserved"
  - step: 11
    phase: pre-deploy
    action: >-
      Stale-reference sweep for the retired surface (closure obligation: this plan performs a
      `workflow_to_tier` -> `workflows` migration). The token is ANCHORED so it cannot match the
      distinct published bundle key `workflow_to_tier_resolution`, and the pathspec is scoped to
      LIVE CONSUMERS so historical plan documents and the grandfathered INTENT doc are out of
      jurisdiction by construction rather than by exception. config/ is narrowed to the taxonomy
      file specifically, EXCLUDING config/agent/verification_registry/registry.yaml: that file
      stores probe commands as DATA, and this plan adds rows whose command text necessarily
      contains the retired token (step 1's `assert 'workflow_to_tier' not in t`, and this step's own
      grep literal, in which the token sits between `)` and `(` and therefore satisfies the anchor).
      Sweeping the registry would make this step match its own graduation row and fail by
      construction -- verified empirically. The registry's own repointing is asserted by step 13
      instead, scoped to the two legacy rows that genuinely break.
    command: >-
      ! git grep -nE '(^|[^_[:alnum:]])workflow_to_tier([^_[:alnum:]]|$)' -- 'scripts/**'
      'tests/**' 'config/ci_rca_taxonomy.yaml' 'docs/contracts/**' '.github/**'
    expected: >-
      No matches (git grep exits 1, negated to 0). Nine live consumers match today under this
      pathspec; all nine are in this plan's scope table, and the tenth (registry.yaml) is covered
      by step 13.
    fix_if: >-
      A live consumer still names the retired key. Update it -- and if it is NOT in the scope table,
      stop and re-scope rather than editing an unscoped file. Do NOT re-widen the pathspec to
      `config/**`: that reintroduces the self-match this narrowing exists to avoid.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-workflow-to-tier-retired"
  - step: 12
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier across the changed surface.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Fast tier passes with the new check dispatching, validate_plan_documents green on this plan,
      and no regression.
    fix_if: >-
      Any check regresses. Fix forward (Decision 55); never weaken a check to pass. If
      validate_sloc_limits flags the new module, decompose it (Decision 128) -- do not raise its
      budget.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: >-
      Confirm the two graduated verification-registry rows that the migration breaks were repointed.
      Scoped BY CHECK_ID to exactly those two legacy rows -- deliberately not a whole-file sweep, so
      this step cannot match the rows this plan itself adds (which legitimately carry the retired
      token in their probe text).
    command: >-
      bin/venv-python -c "import yaml;
      rows={r['check_id']: str(r.get('check_spec')) for r in
      yaml.safe_load(open('config/agent/verification_registry/registry.yaml'))['entries']};
      refusal=rows.get('ci-rca-refusal-gate-and-junit-precedence','');
      lifecycle=rows.get('ci-rca-lifecycle-records-watched-set','');
      assert 'workflow_to_tier' not in refusal, 'refusal-gate row still probes the retired key';
      assert not [s for s in ('terraform-drift','convergence-health','dedup-probe') if s in
      lifecycle], 'lifecycle row still probes strings that lived only in the deleted excluded: map';
      print('legacy registry rows repointed or retired')"
    expected: >-
      Prints legacy registry rows repointed with whichever of the two ids remain (a row may be
      retired outright rather than repointed, which also satisfies this step); exits 0.
    fix_if: >-
      A legacy row still probes the retired key -- ci-rca-refusal-gate-and-junit-precedence builds
      `{'workflow_to_tier': {}}` and would raise ValueError against the migrated required-keys set;
      ci-rca-lifecycle-records-watched-set does `raw.index('terraform-drift')` against strings that
      exist only inside the deleted watched:/excluded: maps. Repoint or retire it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot migration repoint assertion, scoped by name to two legacy check_ids. Once both are
      repointed it asserts a condition that can never regress -- the ids are fixed and their probes
      no longer reference the retired key -- so a standing registry row would guard nothing. The
      durable guard against reintroducing the flat shape is step 1, which IS graduated.
  - step: 14
    phase: pre-deploy
    action: >-
      Confirm the second retired surface left no dangling back-reference: ci-rca.yml's header
      comment must no longer point readers at watched_workflow_set for the per-entry adjudication,
      since that registry is gone.
    command: >-
      ! grep -q "watched_workflow_set" .github/workflows/ci-rca.yml && grep -q
      "config/ci_rca_taxonomy.yaml" .github/workflows/ci-rca.yml
    expected: >-
      Exits 0: the workflow no longer names the retired registry and does name the taxonomy file as
      the adjudication source.
    fix_if: >-
      The header comment at ci-rca.yml:18 still directs readers to watched_workflow_set for the
      adjudication, leaving a pointer to a registry this plan deleted.
    hermetic: true
    graduation: graduate
    graduation_check_id: "ci-rca-yml-names-taxonomy-not-retired-set"
  - step: 15
    phase: pre-deploy
    action: >-
      Pre-handoff full-tier run. This plan declares
      handoff_policy.full_validation_required_before_commit, and Decision 163 makes that a
      structurally-enforced obligation rather than a declaration: validate_handoff_full_tier
      (registered pre=True with pre_globs docs/plans/**) fails any plan whose verification_plan
      declares the policy without a step invoking `-m scripts.validate` WITHOUT --pre. Reproduced
      live during plan critique -- without this step the plan PR reds on itself.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Full tier completes with exit 0 before any commit or PR, per the declared handoff policy. A
      timeout is `blocked` per handoff_policy.timeout_disposition -- resume later and rerun the full
      tier from the start; never commit on a partial run.
    fix_if: >-
      Any full-tier-only check regresses (validate_test_coverage, validate_verification_registry's
      added-entry differentials, validate_ci_rca_trigger). Fix forward (Decision 55); never weaken a
      check to pass.
    hermetic: false
    graduation: not-applicable
test_obligations:
