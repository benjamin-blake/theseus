schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: roadmap-state-test-cache
intent: >-
  Stop the test suite recomputing an identical compute_state_dict(live ROADMAP-PLATFORM.yaml) result once per
  test (rec-4006), and stop roadmap-fixture tests with zero in_progress items scanning the real docs/plans/ for
  nothing (rec-4007). Together these remove roughly 1,870s of the full tier's 4,260s serial pytest time, buying
  CI test-budget runway for the platform's own growing verification surface.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-state-test-cache.yaml
phase: >-
  Soft-warn exception category ad_hoc_rec: rec-4006 and rec-4007 name no tier_item, so the Tier Item Freshness
  Gate is skipped and no exit criterion advances. T4.5 (plans in warehouse, deferred_post_mvp behind T4.2) and
  T4.23 are deliberately untouched: the memo sits at the compute_state_dict(path) OUTPUT boundary, the interim
  shape audits/criterion-shape-forks-9d25d918.yaml CSF-08 proposes, so it degrades to belt-and-braces once T4.5
  turns the plan scan into a named read.
scope:
  - file: tests/fixtures/platform_roadmap_state.py
    action: Modify
    purpose: >-
      Add the process-scoped memo live_state_dict(yaml_path=_LIVE_ROADMAP, *, latest_decision_ts=None), its
      module-level store _LIVE_STATE_MEMO (dict keyed by latest_decision_ts), and the import-time binding
      _real_compute_state_dict imported from scripts.platform_roadmap_state (the DEFINING module, never the
      patchable scripts.roadmap.platform_roadmap facade attribute). Exact semantics in execution_steps[1].
  - file: tests/platform_roadmap_state/test_live_state_cache.py
    action: Create
    purpose: >-
      Class TestLiveStateMemo, exactly six tests, driven by a spy on _real_compute_state_dict inside
      patch.dict(_LIVE_STATE_MEMO, clear=True). Never touches the live corpus; sub-second.
  - file: tests/test_session_preflight_platform_roadmap.py
    action: Modify
    purpose: >-
      Seam A: replace all 25 compute_state_dict(_LIVE_YAML) call sites with live_state_dict(); remove the now-unused
      compute_state_dict imports (module-level and the two in-method imports); keep _LIVE_YAML, the load import,
      every skipif guard and its ROADMAP-PLATFORM.yaml reason string, and every assertion body byte-identical.
  - file: tests/platform_roadmap_state/test_state_dict_and_feeds.py
    action: Modify
    purpose: >-
      Seam A: TestLiveGateEvaluations._result returns live_state_dict() (9 tests, assertion bodies unchanged).
      rec-4007: add class TestFollowonNoInProgressGuard (two tests, execution_steps[4]).
  - file: tests/session/preflight/conftest.py
    action: Modify
    purpose: >-
      Seam B: add one stack.enter_context(patch("session_preflight.platform_roadmap.compute_state_dict",
      new=live_state_dict)) inside the EXISTING autouse fixture _disable_reader_and_git_fetch, reaching all 22
      main() calls in the package with real (memoized) roadmap data. Tests that re-patch the same target inside
      their body (test_main_branches' return_value={}) still win, as today.
  - file: tests/session/preflight/test_main_report.py
    action: Modify
    purpose: >-
      Add class TestLiveRoadmapStateWiring with one test asserting _preflight.platform_roadmap.compute_state_dict
      is live_state_dict under the package autouse fixture.
  - file: tests/test_session_preflight_decomposition.py
    action: Modify
    purpose: >-
      Root caller: add (platform_roadmap, "compute_state_dict", live_state_dict) to _base_stub_specs and
      (platform_roadmap, "compute_state_dict") to _DIRECT_VALUE_ATTRS so it is patched with new= (a swap), not
      return_value=; import platform_roadmap from scripts.roadmap and live_state_dict from tests.fixtures.
  - file: tests/test_session_preflight_cache_serving.py
    action: Modify
    purpose: >-
      Root caller: add patch("session_preflight.platform_roadmap.compute_state_dict", new=live_state_dict) to
      TestPhaseBAbsenceOfReaderCalls' existing with-block.
  - file: scripts/platform_roadmap_state.py
    action: Modify
    purpose: >-
      rec-4007: in compute_followon_state, `if not in_progress:` / `return {}` immediately after in_progress is
      built and before the plans_dir glob. Correctness-preserving (the function already returns {} for zero
      in_progress items); removes the real docs/plans/ scan from the 10 fixture-doc tests that call
      to_preflight_dict() with the default plans_dir.
  - file: config/agent/verification_registry/entries/roadmap-live-state-memo.yaml
    action: Create
    purpose: >-
      Graduation shard for VP step 1 (Decision 132; Decision 176 one-record-per-file, filename equals check_id).
      primitive_slot test_selector; guard_target tests/fixtures/platform_roadmap_state.py; guard_symbol
      live_state_dict; check_spec.node_id tests/platform_roadmap_state/test_live_state_cache.py::TestLiveStateMemo.
  - file: config/agent/verification_registry/entries/followon-zero-in-progress-guard.yaml
    action: Create
    purpose: >-
      Graduation shard for VP step 4. primitive_slot test_selector; guard_target scripts/platform_roadmap_state.py;
      guard_symbol compute_followon_state; check_spec.node_id
      tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestFollowonNoInProgressGuard.
bundled_recommendations:
  - rec-4006
  - rec-4007
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - rec-4006's own acceptance passes verbatim (zero compute_state_dict(_LIVE_YAML) call sites in the roadmap test file; TestLiveRoadmapState green).
  - rec-4007's own acceptance passes verbatim (the guard text and the plans_dir glob both present in scripts/platform_roadmap_state.py).
  - live_state_dict computes the live roadmap at most once per (process, latest_decision_ts), returns an independent deep copy on every call, delegates every non-live path uncached, never memoizes an error result, and is bound to the defining module's function.
  - Every main() call under tests/session/preflight/, and in the two root-level preflight test files, reaches live_state_dict instead of recomputing.
  - A zero-in_progress roadmap never globs plans_dir; a roadmap with an in_progress item still does.
  - The before/after selection (VP step 7) runs in at most 40% of its base-SHA wall time on the same machine and flags.
  - Root tests/conftest.py is untouched, so --pre never sets full_suite_forced.
  - The full presubmit tier passes before handoff; both recs read closed after merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the memo-semantics tests (the graduated standing guard for the helper).
    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_live_state_cache.py::TestLiveStateMemo -q
    expected: >-
      Exit 0 with a six-passed summary. Measured on the un-implemented tree at authoring time: exit 4 ("ERROR: file
      or directory not found"), which scripts.checks.verification._vp_replay_classify classifies target_absent --
      a valid Decision 189 red-before outcome.
    expected_literals:
      - "6 passed"
    fix_if: >-
      A spy call_count above 1 on the live path means the memo key or the resolved-path comparison is wrong. A
      pass of the independence test while another test's canned result appears in a later real call means
      patch.dict(clear=True) was dropped (Decision 181 leak). Exit 4 after implementation means the class or file
      was named differently from the shard's node_id.
    hermetic: true
    graduation: graduate
    graduation_check_id: roadmap-live-state-memo
  - step: 2
    phase: pre-deploy
    action: Seam A -- rec-4006's acceptance command plus the migrated live-gate class.
    command: test "$(grep -c 'compute_state_dict(_LIVE_YAML)' tests/test_session_preflight_platform_roadmap.py)" -eq 0 && bin/venv-python -m pytest tests/test_session_preflight_platform_roadmap.py tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestLiveGateEvaluations -q
    expected: Exit 0 with a 34-passed summary (25 roadmap tests plus 9 live-gate tests), in seconds rather than minutes.
    expected_literals:
      - "34 passed"
    fix_if: >-
      A non-zero grep count means a call site was missed (the class helper methods _full_state count too). An
      F401 at step 8 means an unused compute_state_dict import was left behind.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The 34 tests are pre-existing suite members whose assertions are unchanged; the new behaviour they now reach
      (the memo) is already graduated by step 1's shard, and the grep half is a one-time migration precondition,
      not a standing invariant worth a registry row.
  - step: 3
    phase: pre-deploy
    action: Seam B -- the wiring identity test under the package autouse fixture.
    command: bin/venv-python -m pytest tests/session/preflight/test_main_report.py::TestLiveRoadmapStateWiring -q
    expected: Exit 0 with a one-passed summary, in well under the 30s per-step replay bound.
    expected_literals:
      - "1 passed"
    fix_if: >-
      Red means the conftest line is missing or patches a different attribute than the one main() reads
      (session_preflight.platform_roadmap is the scripts.roadmap.platform_roadmap facade module).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-line identity assertion; the autouse-bearing conftest's own affected-set channel
      (conftest_subtree_forced) reselects the whole package, wiring test included, on every edit to its subject, so
      a registry row would duplicate that standing selection.
  - step: 4
    phase: pre-deploy
    action: rec-4007 -- the graduated guard tests.
    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestFollowonNoInProgressGuard -q
    expected: >-
      Exit 0 with a two-passed summary. Measured on the un-implemented tree at authoring time: exit 4 ("ERROR: not
      found ... no match in any of [<Module test_state_dict_and_feeds.py>]"), classified target_absent.
    expected_literals:
      - "2 passed"
    fix_if: >-
      If the zero-in_progress test passes with the guard temporarily removed, the refusal was attached to
      Path.read_text (swallowed by the per-file except Exception) instead of Path.glob -- see execution_steps[4].
      If the positive-control test fails, the Path.glob patch is not live and the first test is vacuous.
    hermetic: true
    graduation: graduate
    graduation_check_id: followon-zero-in-progress-guard
  - step: 5
    phase: pre-deploy
    action: >-
      rec-4007's acceptance command, plus every suite a scope edit can reach: the whole preflight package (seam B's
      22 main() calls), the roadmap mirror packages (holding the 10 fixture-doc tests), the facade tests, and both
      root-level preflight files.
    command: grep -q 'if not in_progress' scripts/platform_roadmap_state.py && grep -q 'plans_dir.glob("PLAN-\*.yaml")' scripts/platform_roadmap_state.py && bin/venv-python -m pytest tests/session/preflight tests/platform_roadmap_state tests/platform_roadmap_models tests/test_platform_roadmap.py tests/test_session_preflight_decomposition.py tests/test_session_preflight_cache_serving.py -q -n 4
    expected: >-
      Exit 0, every test passing. test_main_branches' inner return_value={} patch still wins over the autouse memo
      where present.
    fix_if: >-
      A grep miss means the guard was written in a different form than rec-4007's acceptance pins. A RecursionError
      means live_state_dict calls the facade attribute instead of _real_compute_state_dict. A TestReportSchemaFreeze or
      TestMockInterceptionThroughFacade failure means the decomposition stub went in as return_value= (missing from
      _DIRECT_VALUE_ATTRS) or collides with an override key. A TestResidualPatchSiteClosure failure means a patch
      idiom other than the "session_preflight.platform_roadmap.compute_state_dict" string target was used.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Aggregates pre-existing suites whose assertions are unchanged plus rec-4007's structural grep; the only new
      behaviour it reaches is graduated by the step 1 and step 4 shards. Deliberately non-hermetic: the 26 main()
      calls alone exceed validate_vp_replay's 30s per-step bound (PER_STEP_TIMEOUT_SECONDS).
  - step: 6
    phase: pre-deploy
    action: Prove the new guard line is covered (Decision 48 V2 row; scripts/platform_roadmap_state.py has no coverage baseline entry).
    command: bin/venv-python -m pytest tests/platform_roadmap_state -q -p no:randomly --cov=scripts.platform_roadmap_state --cov-report=term-missing
    expected: >-
      Exit 0, and the coverage row for scripts/platform_roadmap_state.py does not list the guard's two line numbers
      in its Missing column.
    fix_if: A Missing entry naming the guard lines means TestFollowonNoInProgressGuard does not reach it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The pass condition is a judgement over the Missing column for two specific line numbers, which are only
      known after implementation; the standing guard is step 4's shard plus the full tier's validate_test_coverage.
  - step: 7
    phase: pre-deploy
    action: >-
      Before/after timing on the SAME selection, same machine, same flags: base SHA in a detached git worktree
      versus the implemented branch. Serial and coverage-free so the ratio reflects the per-call cost only.
    command: >-
      R=$(pwd) && PY="$R/bin/venv-python" && BASE=$(git merge-base HEAD origin/main) && WT=$(mktemp -d) &&
      git worktree add -q --detach "$WT/base" "$BASE" &&
      SEL="tests/test_session_preflight_platform_roadmap.py tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestLiveGateEvaluations tests/session/preflight/test_main_report.py tests/test_session_preflight_decomposition.py tests/test_session_preflight_cache_serving.py tests/platform_roadmap_state/test_graph.py::TestStrategicPending tests/platform_roadmap_state/test_realization_candidates.py::TestRealizationCandidatesPreflightDict tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestRatifiableCds tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestRealizedButPendingCds tests/platform_roadmap_models/test_graph_validation.py::TestDeferredPostMvp tests/platform_roadmap_models/test_schema.py::TestUserActionRequired" &&
      FLAGS="-q -p no:xdist -p no:cacheprovider --randomly-seed=20260710" &&
      T0=$(date +%s) && (cd "$WT/base" && "$PY" -m pytest $SEL $FLAGS > /dev/null) && T1=$(date +%s) &&
      "$PY" -m pytest $SEL $FLAGS > /dev/null && T2=$(date +%s) &&
      git worktree remove --force "$WT/base" && B=$((T1-T0)) && A=$((T2-T1)) &&
      echo "before=${B}s after=${A}s" && test $((A*10)) -le $((B*4))
    expected: >-
      Both runs exit 0; prints before=/after= seconds and exits 0 only when after <= 40% of before. Measured at
      c53f2e46 in the authoring container: the base run of this exact selection took 329.86s (172 passed, 1 skipped); the
      predicted after is ~75s -- one real compute (~5s) plus ~5.5s for each of the 12 main() calls in the selection (ratio ~0.23).
    fix_if: >-
      A ratio above 40% means a seam is not reached: re-run steps 2, 3 and 5 and read --durations for any test
      still near 5s (seam A/root callers) or 10s (seam B). A failing base run is environmental (the worktree lacks
      gitignored files); report it rather than weakening the selection. Always remove the worktree.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Lint and format every changed Python file.
    command: >-
      bin/venv-python -m ruff check tests/fixtures/platform_roadmap_state.py tests/platform_roadmap_state/test_live_state_cache.py
      tests/test_session_preflight_platform_roadmap.py tests/platform_roadmap_state/test_state_dict_and_feeds.py
      tests/session/preflight/conftest.py tests/session/preflight/test_main_report.py
      tests/test_session_preflight_decomposition.py tests/test_session_preflight_cache_serving.py
      scripts/platform_roadmap_state.py && bin/venv-python -m ruff format --check tests/fixtures/platform_roadmap_state.py
      tests/platform_roadmap_state/test_live_state_cache.py tests/test_session_preflight_platform_roadmap.py
      tests/platform_roadmap_state/test_state_dict_and_feeds.py tests/session/preflight/conftest.py
      tests/session/preflight/test_main_report.py tests/test_session_preflight_decomposition.py
      tests/test_session_preflight_cache_serving.py scripts/platform_roadmap_state.py
    expected: Exit 0 from both commands.
    fix_if: An F401 on compute_state_dict means a seam-A import was left behind; an E402 means the new import in test_main_report.py lacks the file's existing noqa pattern.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the ruff check and ruff format checks scripts.validate already runs in both tiers.
  - step: 9
    phase: pre-deploy
    action: Fast presubmit tier (advisory outside CI per Decision 73; read the summary, not the exit code).
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Zero failed checks in the printed summary, including validate_plan_documents, validate_graduation_completeness
      (both shards present and matched), validate_verification_registry (both shards admitted by the differential),
      validate_sloc_limits, validate_scope_boundary and validate_no_cross_test_imports. The affected-set manifest
      reports full_suite_forced false.
    fix_if: >-
      A shard "not admitted" means its node id passes at origin/main (it must be absent there). A full_suite_forced
      true means the root tests/conftest.py was touched -- revert it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate, which vp-red-before.yaml's recursion_refusal refuses for graduate, and Decision 73
      makes its exit code meaningless outside CI.
  - step: 10
    phase: pre-deploy
    action: Full presubmit tier before handoff (handoff_policy; Decision 163).
    command: bin/venv-python -m scripts.validate
    expected: >-
      Zero failed checks in the printed summary; the Test coverage check reports 100% for
      scripts/platform_roadmap_state.py.
    fix_if: Per handoff_policy.timeout_disposition a timeout is BLOCKED -- resume later and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Same recursion refusal and Decision 73 caveat as step 9, at the full tier.
  - step: 11
    phase: post-deploy
    action: >-
      After the squash-merge (body carries "Resolves: rec-4006, rec-4007") and the rec-autoclose run, rebuild the
      read cache and confirm both recs closed. Neither rec carries context_v2_json, so rec-autoclose closes them
      without a closure artifact.
    command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;r={x['id']:x for x in (json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()) if x.get('id') in ('rec-4006','rec-4007')};print({k:v['status'] for k,v in r.items()});assert all(v['status']=='closed' for v in r.values()) and len(r)==2"
    expected: Prints both ids with status closed; exit 0.
    fix_if: >-
      Still open means rec-autoclose did not fire or refused (read its run summary for a [REC-AUTOCLOSE] marker);
      close via bin/venv-python -m scripts.ops_data_portal --update-rec with a resolution naming the merge SHA.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      CI recovery measurement (the brief's measurement obligation). Download the pytest-junit artifact of the
      first ci.yml full-tier run on main that includes the squash-merge (uploaded with if: always()) via
      mcp__github__actions_list method=list_workflow_run_artifacts plus mcp__github__actions_get
      method=download_workflow_run_artifact, unzip it to /tmp/rsc-junit/pytest-junit.xml, then compare the
      family's serial seconds against baseline run 35666014041 (seam A 996.2s over 34 tests; the 10 rec-4007
      fixture-doc tests ~241s; the 26 main()-calling tests reached by seam B and the root callers 1,494.3s).
    command: >-
      bin/venv-python -c "import xml.etree.ElementTree as E;c=list(E.parse('/tmp/rsc-junit/pytest-junit.xml').getroot().iter('testcase'));s=lambda f:round(sum(float(t.get('time') or 0) for t in c if f(t.get('classname',''),t.get('name',''))),1);A=s(lambda k,n:k.startswith('tests.test_session_preflight_platform_roadmap.') or k.endswith('TestLiveGateEvaluations'));F=s(lambda k,n:k.endswith(('TestUserActionRequired','TestDeferredPostMvp','TestStrategicPending','TestRealizationCandidatesPreflightDict','TestRatifiableCds','TestRealizedButPendingCds')));T=s(lambda k,n:True);print(f'seamA={A}s (base 996.2) rec4007={F}s (base ~241) total_serial={T}s (base 4260.2)');assert A<=300 and F<=60"
    expected: >-
      Prints the three sums; seam A at or below 300s and the rec-4007 classes at or below 60s (generous bounds for
      up to four per-worker computes at CI's ~29s each). Record the printed figures and the run's wall time in the
      PR thread; a wall-clock figure is reported, never asserted.
    fix_if: >-
      Seam A above bound means CI workers are not sharing the memo per process (check for a subprocess-per-test
      runner) or a call site regressed. Do not tighten or loosen the bounds to pass.
    hermetic: false
test_obligations:
  - source: tests/fixtures/platform_roadmap_state.py
    behavior: >-
      live_state_dict computes the live roadmap once per (process, latest_decision_ts), returns independent deep
      copies, delegates non-live paths uncached, never memoizes an error, and is bound to the defining module.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_live_state_cache.py::TestLiveStateMemo
    red_green_expectation: red before (target_absent -- file missing), green after
  - source: tests/session/preflight/conftest.py
    behavior: Every main() call in tests/session/preflight/ reaches live_state_dict through the package autouse fixture.
    verification_step: 3
    test_selector: tests/session/preflight/test_main_report.py::TestLiveRoadmapStateWiring
    red_green_expectation: >-
      red before (target_absent at base; assertion_failed if the test is added before the conftest line), green
      after
  - source: scripts/platform_roadmap_state.py
    behavior: compute_followon_state never globs plans_dir when the roadmap has zero in_progress items, and still does when it has one.
    verification_step: 4
    test_selector: tests/platform_roadmap_state/test_state_dict_and_feeds.py::TestFollowonNoInProgressGuard
    red_green_expectation: >-
      red before (target_absent at base; the zero-in_progress test raises the glob refusal if written before the
      guard), green after
  - source: tests/test_session_preflight_decomposition.py
    behavior: The stubbed main() harness swaps compute_state_dict for live_state_dict instead of recomputing.
    verification_step: 5
    test_selector: tests/test_session_preflight_decomposition.py
    waiver_reason: >-
      A test-harness wiring edit inside an existing test module, with no production behaviour of its own and no
      new assertion to turn red: its correctness is the file's unchanged assertions staying green at step 5, and
      its effect (no per-test recompute) is evidenced by step 7's before/after ratio over a selection that
      includes this file.
  - source: tests/test_session_preflight_cache_serving.py
    behavior: TestPhaseBAbsenceOfReaderCalls' main() run swaps compute_state_dict for live_state_dict instead of recomputing.
    verification_step: 5
    test_selector: tests/test_session_preflight_cache_serving.py
    waiver_reason: >-
      Same shape as the decomposition row: a one-line harness patch in an existing test module, proven correct by
      its unchanged assertion staying green at step 5 and effective by step 7's ratio over a selection that
      includes this file.
  - source: config/agent/verification_registry/entries/roadmap-live-state-memo.yaml
    behavior: Its check_id equals VP step 1's graduation_check_id and its node_id is admitted by the differential gate.
    verification_step: 9
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Owned by registered checks: validate_graduation_completeness fails an orphaned shard or unmatched graduate step,
      and validate_verification_registry runs the VF-06 differential for every added entry. A dedicated test would
      duplicate those verifiers (Decision 86). Mirrors PLAN-rec-autoclose-trailer-gate-oserror-coverage.
  - source: config/agent/verification_registry/entries/followon-zero-in-progress-guard.yaml
    behavior: Its check_id equals VP step 4's graduation_check_id and its node_id is admitted by the differential gate.
    verification_step: 9
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Same registered-check ownership as the roadmap-live-state-memo row.
constraints:
  - Cache ONLY at the compute_state_dict(path) output boundary; never build an index over docs/plans/; never key a cache on plans_dir mtime (rec-4006).
  - Test-scoped fix. The sole production edit is rec-4007's two-line guard; no other change to scripts/.
  - Never edit the root tests/conftest.py -- it sets full_suite_forced (scripts/checks/deps/affected_tests.py:369).
  - Decision 181 CONTENT invariant -- in every migrated test only the call site changes; no assertion body is edited, weakened or deleted.
  - Decision 128 -- no SLOC budget raise; measured headroom holds (test_main_report.py 463, test_session_preflight_decomposition.py 455, test_state_dict_and_feeds.py 450 of 500).
  - Decision 59 -- touch only Scope files; an out-of-scope finding becomes a rec via scripts/ops_data_portal.py.
  - Decision 55 -- no rescue agents or workaround loops; a failed step is root-caused, not retried into green.
