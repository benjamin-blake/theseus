  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed deploy or smoke step is this plan's to root-cause and fix forward, never a re-run to green (Decision 55).
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    Forced-cold reads on the deployed reader (reset_warm_connection, then one read, retried up to three times until
    its invocation line shows connect_reused false): the busiest day and a 3-day window, with each read's server line,
    elapsed time and Max Memory Used from CloudWatch.
  command: |-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python - <<'EOF'
    import json, re, time, boto3
    from scripts.ducklake_smoke import core
    U = core._function_url("reader"); G = "/aws/lambda/agent-platform-ducklake-reader"
    L = boto3.Session(profile_name="agent_platform").client("logs", region_name="eu-west-2")
    def server(rid):
        for _ in range(18):
            ev = L.filter_log_events(logGroupName=G, filterPattern=f'"{rid}"', startTime=int((time.time() - 1800) * 1000))["events"]
            rep = [e for e in ev if e["message"].startswith("REPORT")]
            if rep:
                break
            time.sleep(10)
        lo, hi = min(e["timestamp"] for e in ev), max(e["timestamp"] for e in ev)
        body = L.get_log_events(logGroupName=G, logStreamName=ev[0]["logStreamName"], startTime=lo, endTime=hi + 1, startFromHead=True)["events"]
        inv = [json.loads(e["message"]) for e in body if '"ducklake_invocation"' in e["message"]][-1]
        mem = int(re.search(r"Max Memory Used: (\d+) MB", rep[0]["message"]).group(1))
        return ev[0]["logStreamName"], inv, mem, "Status: timeout" in rep[0]["message"]
    def cold(day_from, day_to):
        for _ in range(3):
            core._sigv4_invoke(U, {"action": "reset_warm_connection"})
            t = time.perf_counter()
            r = core._sigv4_invoke(U, {"action": "named_read", "verb": "sessions_window", "params": {"day_from": day_from, "day_to": day_to, "as_of": "2026-10-19T00:30:00+00:00"}})
            dt = time.perf_counter() - t
            stream, inv, mem, timed_out = server(r.headers["x-amzn-RequestId"])
            if not inv["connect_reused"]:
                return r, dt, inv, mem, timed_out
        raise SystemExit("never landed cold after three resets")
    r, dt, inv, mem, to = cold("2026-10-17", "2026-10-17")
    print("COLD_DAY", r.status_code, round(dt, 1), inv["elapsed_ms"], mem); assert r.status_code == 200 and dt < 110 and mem < 900 and not to
    r, dt, inv, mem, to = cold("2026-10-16", "2026-10-18")
    typed = r.status_code == 504 and r.json().get("error_type") == "read_deadline_exceeded"
    print("COLD_3DAY", r.status_code, round(dt, 1), inv["elapsed_ms"], mem); assert (r.status_code == 200 or typed) and dt < 120 and mem < 900 and not to
    print("COLD_READS_OK")
    EOF
  expected: >-
    A COLD_DAY line (200, under 110 s), a COLD_3DAY line (200 or 504, under 120 s), then COLD_READS_OK. Report both lines
    verbatim; they go on rec-4474 for the compaction plan.
  fix_if: >-
    A COLD_DAY over 110 s or a runtime timeout means the threads lever is weaker in Lambda than measured locally: stop,
    report the numbers to the coordinator, and leave the deploy in place (the deadline still bounds the cost). Memory at
    or above 900 MB: stop and RCA before more traffic (rec-4296 exits share this function). If the response carries no
    x-amzn-RequestId header, read the request id from the log line by time window and say so.
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    A forced short deadline answers the typed 504 on the deployed reader, the client raises it at once, and the next read
    on the same container answers 200 on the kept (or probe-reopened) slot.
  command: |-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python - <<'EOF'
    import json, time, boto3
    from scripts.ducklake_smoke import core
    from src.common.ducklake_reader_client import DuckLakeReader, ReadDeadlineExceededError
    U = core._function_url("reader"); G = "/aws/lambda/agent-platform-ducklake-reader"
    L = boto3.Session(profile_name="agent_platform").client("logs", region_name="eu-west-2")
    P = {"day_from": "2026-10-16", "day_to": "2026-10-18", "as_of": "2026-10-19T00:30:00+00:00"}
    def stream_and_line(rid):
        for _ in range(18):
            ev = L.filter_log_events(logGroupName=G, filterPattern=f'"{rid}"', startTime=int((time.time() - 1800) * 1000))["events"]
            if any(e["message"].startswith("REPORT") for e in ev):
                break
            time.sleep(10)
        lo, hi = min(e["timestamp"] for e in ev), max(e["timestamp"] for e in ev)
        body = L.get_log_events(logGroupName=G, logStreamName=ev[0]["logStreamName"], startTime=lo, endTime=hi + 1, startFromHead=True)["events"]
        return ev[0]["logStreamName"], [json.loads(e["message"]) for e in body if '"ducklake_invocation"' in e["message"]][-1]
    t = time.perf_counter()
    try:
        DuckLakeReader(profile="agent_platform")._invoke({"action": "named_read", "verb": "sessions_window", "params": P, "deadline_ms": 5000})
        raise SystemExit("expected ReadDeadlineExceededError")
    except ReadDeadlineExceededError as exc:
        print("CLIENT_DEADLINE", exc.status, exc.body.get("error_type"), round(time.perf_counter() - t, 1)); assert time.perf_counter() - t < 60
    for _ in range(3):
        core._sigv4_invoke(U, {"action": "reset_warm_connection"})
        a = core._sigv4_invoke(U, {"action": "named_read", "verb": "sessions_window", "params": P, "deadline_ms": 5000})
        b = core._sigv4_invoke(U, {"action": "named_read", "verb": "sessions_window", "params": {**P, "day_from": "2026-10-14", "day_to": "2026-10-14"}})
        (sa, _), (sb, ib) = stream_and_line(a.headers["x-amzn-RequestId"]), stream_and_line(b.headers["x-amzn-RequestId"])
        if sa == sb:
            break
    print("DEADLINE", a.status_code, a.json().get("error_type"), "NEXT", b.status_code, ib["connect_reused"], ib["reopened"], sa == sb)
    assert a.status_code == 504 and a.json()["error_type"] == "read_deadline_exceeded" and b.status_code == 200 and sa == sb
    print("DEADLINE_OK")
    EOF
  expected: >-
    A CLIENT_DEADLINE line (504, read_deadline_exceeded, under 60 s), a DEADLINE line whose NEXT read is 200 on the same
    stream, then DEADLINE_OK. Report whether the next read reused the slot or reopened it after the probe (it tells the
    compaction plan whether interrupts break the catalog connection).
  fix_if: >-
    A 500 on the next read means a broken interrupted slot escaped the probe: stop and RCA. Three different streams in a
    row: report it and accept the CLIENT_DEADLINE line with the per-step unit evidence. A 502 instead of the 504 means
    the interrupt overran the margin: stop and RCA.
  hermetic: false
