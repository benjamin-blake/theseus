schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-cold-read-deadline
intent: >-
  Cold telemetry window reads stop timing out on the DuckLake reader (rec-4474): the reader's telemetry slot reads its
  many small Parquet files at 8 DuckDB threads instead of 1, and an event-journal read that still cannot finish is
  interrupted before the Lambda timeout and answers a typed 504 read_deadline_exceeded that the client never retries,
  so the execution environment (both warm slots and the file cache) survives instead of being reset. Session reads are
  the inputs slice 4 verification and the feedback loop depend on (PROJECT_CONTEXT telemetry as evidence). Compaction of
  the telemetry tables, the durable fix, stays with rec-4474 for a later plan.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-cold-read-deadline.yaml
phase: >-
  ad_hoc_rec (rec-4474, stopgap half; rec-2879 bundled); related tier item T2.36 (telemetry re-lands on DuckLake).
  Closes no exit criterion. V3: the merge redeploys the DuckLake Lambdas (ducklake_event_reads.py and the new module
  are in the active ducklake_reader manifest, Decision 79) through deploy-ducklake-lambdas.yml (Decision 126).
scope:
- file: src/common/ducklake_read_deadline.py
  action: Create
  purpose: >-
    Leaf module (stdlib plus src.common.ducklake_handler_errors only; no Lambda context, Decision 212): DEADLINE_MARGIN_S
    = 10.0; READ_DEADLINE_ERROR_TYPE = "read_deadline_exceeded"; fire_after_s(remaining_ms, caller_ms) returns the
    earlier of remaining_ms / 1000 - DEADLINE_MARGIN_S and caller_ms / 1000, floored at 0, or None when both are None;
    run(con, call, fire_after, on_fire) runs call() directly when fire_after is None, else arms a daemon
    threading.Timer(fire_after) whose callback sets a fired flag, calls on_fire() and then con.interrupt(); an
    exception from call() whose class is InterruptException (module _duckdb or duckdb, matched by name like the
    handler's caller-input classes) is raised as TypedFault(504, READ_DEADLINE_ERROR_TYPE, "reader_deadline") from it
    only when the flag is set; any other exception, and an InterruptException without the flag, propagates unchanged;
    the timer is cancelled in a finally on every path (Lambda freezes threads between invocations).
- file: src/common/ducklake_event_reads.py
  action: Modify
  purpose: >-
    (1) TELEMETRY_THREADS = 8 beside TELEMETRY_MEMORY_LIMIT; _telemetry_opener runs SET threads to it after the
    memory_limit statement (open_connection and the ops slot keep threads=1). (2) An optional named_read envelope field
    deadline_ms (beside limit, never inside params): for an event verb it must be a positive integer (not a bool), else
    EventReadInputError(verb, "deadline_ms", ...) before any ATTACH; acquirer_for refuses deadline_ms on a named_read
    of a non-event verb with DuckLakeRuntimeError before any connect. (3) deadline_guard(action, payload, remaining_ms)
    returns a runner the handler calls as runner(con, call): for an event verb it applies
    ducklake_read_deadline.run with fire_after_s(remaining_ms() if remaining_ms else None, deadline_ms) and an on_fire
    that marks the telemetry slot interrupted; for every other action it returns call() unchanged. (4) The telemetry
    acquire passes probe_sql = a catalog-touching probe over the small DuckLake metadata table
    (__ducklake_metadata_<telemetry alias>.ducklake_metadata) to rt.get_warm_connection on the first acquire after the
    slot was marked, then clears the mark; otherwise the default SELECT 1. A failed probe reopens through
    get_warm_connection's existing probe-failure path; no new reopen trigger and no per-acquire catalog round trip.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    Straight-line wiring only (so tests/test_ducklake_reader_handler.py's existing paths cover it, 495 SLOC there): handler()
    passes getattr(context, "get_remaining_time_in_millis", None) into _handle; _handle obtains
    ev.deadline_guard(action, payload, remaining_ms) and runs both the first fn(payload, con) call and the reopen-once
    call through it. A TypedFault from the guard reaches handler_errors.terminal unchanged (504 body {ok, error_type,
    reason, request_id, action} and one ducklake_typed_fault log line). ducklake_handler_errors.py is not edited, so the
    writer bundles' code is unchanged.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: includes gains src/common/ducklake_read_deadline.py.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: excludes gains src/common/ducklake_read_deadline.py with the comment "reader-bundle only (rec-4474)".
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: >-
    ReadDeadlineExceededError(ReaderInvokeError), raised after one POST when the reader answers 504 with body error_type
    read_deadline_exceeded (the ResponseTooLargeError shape); _READ_DEADLINE_ERROR_TYPE literal (the client cannot
    import the reader-only module: data-pipeline bundles this file). Every other 502/503/504 keeps today's two retries
    and _READER_TRANSIENT_STATUS stays {502, 503, 504} (Decision 155 parity). rec-2879: the retry log line and the
    comment above the constants stop calling every 5xx a cold-resume (a 502 now means a process exit or a deadline
    overrun, a 503 catalog_unavailable).
- file: scripts/agent_sdk/errors.py
  action: Modify
  purpose: >-
    ReaderDeadlineError(AgentToolError) for error_type read_deadline_exceeded, its message telling the agent to narrow
    the window; the module docstring's status list gains the 504 line.
- file: scripts/ops_portal/reader_transient.py
  action: Modify
  purpose: >-
    Docstring only: the sentence naming the reader client's cold-resume log line as an uncorrected mislabel is removed
    (rec-2879 corrects it), and the consumer-impact note records that 504 read_deadline_exceeded carries an error_type
    and so gates, answered only by event-journal verbs, which none of the listed consumers call.
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    Class B. named_read: payload_schema_ref names the optional deadline_ms (event verbs only); response_codes gain 504
    read_deadline_exceeded and the 400 row names deadline_ms; typed_errors gain read_deadline_exceeded ("an
    event-journal verb still running at the reader's deadline, the Lambda's remaining time at query start minus 10 s or
    the caller's deadline_ms if earlier, is interrupted: 504 {error_type, reason: reader_deadline, request_id, action};
    never retried; narrow the window"). The no-502 invariant is amended: a deadline answers 504; process-level failures
    (an interrupt that overruns the margin, out of memory, Runtime.ExitError, an init failure) remain the runtime's 502,
    rec-4296 owning the exits. A telemetry-slot invariant states threads 8 for I/O overlap on many small files (the
    ops slot keeps 1) and the one catalog probe after an interrupt. amendment_log entry (field_add, semantic_break
    false, migration_story: additive; a read that used to time out as a retried 502 is now a non-retried typed 504).
- file: tests/common/test_ducklake_read_deadline.py
  action: Create
  purpose: >-
    Mirror test of the new module. Fake connections whose execute blocks until interrupt() is called:
    test_deadline_interrupts_and_answers_typed_504 (TypedFault 504, error_type and reason, on_fire called, timer
    cancelled), test_unflagged_interrupt_is_not_a_deadline, test_other_errors_pass_through_and_cancel_the_timer,
    test_no_deadline_runs_the_call_directly, test_fire_after_is_the_earlier_deadline (margin, caller, floor, None);
    test_contract_declares_the_deadline_answer (named_read 504 row, typed_errors entry, deadline_ms named, the amended
    no-502 invariant, the amendment_log entry). With a function-level pytest.importorskip("duckdb"):
    test_real_duckdb_interrupt_answers_504_and_the_connection_survives (in-memory DuckDB, a long range query, a short
    fire_after: TypedFault 504, then SELECT 1 answers on the same connection).
- file: tests/common/test_ducklake_event_reads.py
  action: Modify
  purpose: >-
    The existing opener test keeps calls[0] as the memory_limit statement; new nodes
    test_telemetry_opener_sets_threads (SET threads=8 after memory_limit), test_deadline_ms_is_refused_before_any_attach
    (0, -1, True, "5" each 400-shaped EventReadInputError naming deadline_ms, nothing opened),
    test_deadline_ms_on_an_ops_verb_is_refused, test_deadline_guard_is_identity_off_event_verbs and
    test_interrupted_slot_probes_the_catalog_once (the next acquire passes the catalog probe, a failing probe reopens,
    the acquire after uses SELECT 1). Stays under 500 SLOC (392 today).
- file: tests/lambdas/ducklake_reader/test_event_routing.py
  action: Modify
  purpose: >-
    Through the real handler with the existing wiring fixture and a fake context: test_event_verb_past_its_deadline_answers_504
    (body shape, status 504, the ops slot untouched), test_ops_verbs_run_without_a_deadline and
    test_reopen_once_runs_under_the_deadline.
- file: tests/common/ducklake_reader_client/test_reader_deadline.py
  action: Create
  purpose: >-
    test_deadline_504_is_raised_after_one_post (one requests.post, ReadDeadlineExceededError carrying status and body),
    test_other_5xx_still_retry_twice (untyped 502, 503 catalog_unavailable, 504 without the type),
    test_error_type_literal_matches_the_reader (client literal equals ducklake_read_deadline.READ_DEADLINE_ERROR_TYPE)
    and test_retry_log_does_not_claim_a_cold_resume.
- file: tests/test_agent_sdk_errors.py
  action: Modify
  purpose: New node test_read_deadline_maps_to_reader_deadline_error.
