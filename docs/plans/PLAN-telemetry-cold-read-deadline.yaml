closes_criteria: []
infrastructure_dependencies:
- >-
  No Terraform, IAM, Lambda size or timeout change. The merge redeploys the DuckLake Lambdas through
  deploy-ducklake-lambdas.yml (governed CI, Decision 125/126); the coordinator sequences it against any other DuckLake
  deploy, apply or replay (one at a time).
- >-
  data-pipeline (Decision 79 deferral): its zip carries ducklake_reader_client.py, but deploy-prod-lambdas.yml does not
  trigger on src/common/** and its only reader calls are ops verbs, which never answer read_deadline_exceeded, so it
  takes the client change at its next governed deploy with no behaviour difference meanwhile; no deploy leg here.
acceptance_criteria:
- The telemetry slot runs DuckDB at 8 threads; open_connection and the ops slot keep 1 (VP 2).
- >-
  An event-journal read still running at the deadline is interrupted and answers 504 read_deadline_exceeded through
  the handler; an interrupt the deadline did not fire stays 500 unmapped; ops actions run with no deadline; the
  interrupted slot is kept and its next acquire runs one catalog probe, reopening if it fails (VP 1-4).
- >-
  The client raises ReadDeadlineExceededError after one POST for that answer and keeps today's retries for every other
  502/503/504; the agent SDK maps it to ReaderDeadlineError; no log line calls a 5xx a cold-resume (VP 5-7).
- The reader contract declares deadline_ms, the 504 and the amended no-502 invariant (VP 1).
- >-
  Deployed: a forced-cold read of the busiest day (2026-10-17) answers 200 within 110 s; a forced-cold 3-day window
  (2026-10-16..18) answers 200 or a typed 504 within 120 s, never the runtime's 502; Max Memory Used stays below 900 MB
  (VP 11).
- >-
  Deployed: a read with deadline_ms 5000 answers 504 read_deadline_exceeded, the client raises at once, and the next
  read on the same container answers 200 on the kept or probe-reopened slot (VP 12).
- rec-2879 reads closed; rec-4474 stays open carrying the measured numbers for the compaction plan (VP 13).
