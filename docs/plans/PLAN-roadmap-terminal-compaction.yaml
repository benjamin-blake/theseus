constraints:
- >-
  Single file, ceiling unchanged (Decisions 110, 114, 147; Decision 197 cl.8): no archive file, no per-tier split, no
  edit to _ROADMAP_MAX_LINES or check_roadmap_regrowth.py.
- >-
  Never add, remove or reorder a `- id:` line in the roadmap (keeps validate_platform_roadmap criterion (ii) quiet on
  the 88 legacy bare-string items); never touch an exit_criteria block.
- >-
  Terminal-only: non-terminal tier_items, pending CDs, open open_questions/known_gaps and every other top-level section
  stay byte-identical. Keep every CD field the ratification/supersession guards read, including ratified-CD
  discipline_points (Decision 105) -- only CD.3's detail changes.
- >-
  Do not reduce raw line count by deleting blank separator lines, joining lines or stripping section/separator comments
  -- relief must come from removed content (rec-3028 raw-line gameability). `#` comment lines INSIDE a compacted
  terminal record (e.g. OQ.8/OQ.9/OQ.11's "Retained open-in-form until then") are record content and are removable.
- >-
  If any other live-roadmap test OR graduated registry record that PASSES on origin/main pins a field slated for
  removal, keep the field and declare it in completion_compaction_exceptions with pinned_by (as T-1.12 / T2.26) --
  never edit the pinning test or record. Records already FAILING on origin/main are outside this rule:
  t256-c1-evidence-without-flip and t-1-19-ledger-upgraded (T2.56's progress_note is NOT kept for them). The planned
  t2-56 shard retirement is the one sanctioned exception to the rule (Decision 176 path).
- 'DECISIONS.md is append-only (Decision 177): one appended annotation line on Decision 147, nothing else.'
- No Lambda deploy (Decision 79 deferral; see context); never a local build_lambda --deploy.
- No rescue agents or workaround loops (Decision 55).
