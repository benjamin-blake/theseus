  command: >-
    bin/venv-python -c "import sys;from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap
    as a;from scripts.checks.roadmap.validate_candidate_decision_ratification import
    validate_candidate_decision_ratification as r;from scripts.checks.roadmap.validate_candidate_decision_supersession
    import validate_candidate_decision_supersession as s;f=[];a(f);r(f);s(f);print(f or 'ROADMAP_GUARDS_OK');sys.exit(1
    if f else 0)"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    Criterion (ii) firing means an `- id:` line entered the diff (never add/remove/reorder ids); a ratification or
    supersession failure means a CD field those guards read was touched -- restore it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: All three are already registered presubmit checks; validate_platform_roadmap also diffs origin/main.
