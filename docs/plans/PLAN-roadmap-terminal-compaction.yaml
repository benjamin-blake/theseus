- >-
  Commit-flow sync (docs/contracts/git-ops.yaml rebase_phase_distinction.commit_flow_time): `git fetch origin main &&
  git rebase origin/main`, then `git push --force-with-lease`. After the rebase re-run VP 2, 3, 4, 5 and 7; compact any
