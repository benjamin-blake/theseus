schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: roadmap-terminal-compaction
intent: >-
  Restore >=500 lines of headroom under docs/ROADMAP-PLATFORM.yaml's 10,000-line ceiling (rec-4034) by re-applying
  Decision 147's compact form to terminal records that re-grew, extending it to resolved open_questions and
  closed known_gaps, and fixing the tier-item-lifecycle walk that re-grows them -- so required forward additions
  (the platform's sole sequencing source) have room without a ceiling raise or a per-tier split.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-terminal-compaction.yaml
phase: >-
  Platform roadmap governance -- ad_hoc_rec (rec-4034, bundling rec-2782); names no tier_item, so the Tier Item
  Freshness Gate is skipped (soft-warn exception). Closes NO exit criterion.
scope:
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    (a) Re-apply Decision 147 points 1-2 to every terminal record check_roadmap_regrowth reports as regrown AT
    IMPLEMENT TIME (at planning: CD.3 + T-1.12, T-1.19, T-1.21, T-1.22, T0.8, T0.13, T2.6, T2.14, T2.26, T2.41,
    T2.42, T2.49, T2.50, T3.5, T3.8, T2.56): drop progress_note/note/decomposition_hints, collapse intent to one
    double-quoted line under 280 bytes, set files_in_scope to [], shrink CD.3's detail to one line -- EXCEPT the
    fields declared in tier-item-lifecycle.yaml's completion_compaction_exceptions (T-1.12 decomposition_hints,
    T2.26 files_in_scope). BEFORE dropping any progress_note/note, run the Decision 86 cl.2 / Decision 115
    live-carrier check per record: a still-live deferred obligation must already be carried by a rec, criterion,
    tier_item or Decision -- if not, file one (file_rec after get_rec_write_guidance()) BEFORE dropping the prose, and
    the one-line intent carries only its id; a pure history/successor pointer may ride the intent. Known case: T2.42's
    deferred c1 post-apply ten-run zero layer-replace observation had NO carrier -- rec-4051 (filed at planning) now
    carries it, and T2.42's one-line intent cites it with the marker "layer-replace observation pending (rec-4051)". (b) Drop `notes` on every status:resolved open_question and
    every status in {resolved, closed, promoted} known_gap, keeping id, question|gap, resolution_tier, status,
    resolution_ref -- after the same check: a still-live conditional/watch-signal (e.g. OQ.7 "scale reader compute if
    memory binds", OQ.8 "T2.16b churn gate", OQ.9 "revisit at T2.x") that its resolution_ref does NOT carry is kept as
    a one-line `notes` watch-signal. (c) rec-2782: shorten the >=280-char one-line intents (at planning: T-1.1,
    T-1.23, T0.7a, T1.16, T2.2, T2.25) to under 280 bytes. Everything else byte-identical.
- file: docs/contracts/tier-item-lifecycle.yaml
  action: Modify
  purpose: >-
    Add a `completion_compaction` key -- the single home of the Decision 147 compact form, staged in the SAME edit
    that flips an item to status complete or reserved; narrative, closeout evidence and superseded criterion wording
    go to the commit/PR body; a still-live deferred obligation with no carrier first gets one (a rec via file_rec after
    get_rec_write_guidance(), or a criterion on an open item -- replacement_closure_check step 3) and the one-line
    intent cites only its id; a reserved
    item records its successor pointer in its one-line intent (e.g. "RESERVED: absorbed by T2.X"), never a note (the key
    carries the literals "successor pointer" and "one-line intent"); a Bootstrap scope-(c) binding-CD pointer rides the
    bootstrap_completion_exempt flag plus related_candidate_decisions, never a note -- overriding the roadmap
    agent_instructions' "scope-(c) note" wording, whose repoint joins rec-3960's residual. One
    sibling clause states the same form for resolved open_questions / resolved|closed|promoted known_gaps (keep id,
    question|gap, resolution_tier, status, resolution_ref and at most a one-line watch-signal note); CDs are NOT
    restated here (candidate-decision-ratification.yaml's lane; header says this file is never its second home).
    Widen the header scope-note comment to cover the OQ/KG clause. Add a structured
    `completion_compaction_exceptions` mapping (item id -> {fields: [...], pinned_by: <test node or registry shard
    path>}) seeded with T-1.12 {decomposition_hints; tests/test_implement_skill_decomposition_hints.py::TestLiveRoadmapInheritance}
    and T2.26 {files_in_scope; config/agent/verification_registry/entries/ops-session-log-roadmap-regrounded.yaml} --
    the ONE declared exception list VP 3, VP 5 and the test read. Repoint ALL THREE walk clauses that today re-grow
    notes at completion_compaction: bookkeeping_walk's "all criteria pass" outcome, tier_item_freshness_gate's closeouts
    ("a note citing the evidence"; "status: reserved with a supersession note"), and replacement_closure_check step (4)
    ("status: reserved with a supersession note"). Append an amendment_log entry (field_add, semantic_break false), and
    a Decision 181 coverage declaration in governance_notes containing the literal phrase "completion_compaction has no
    enforcing check" ON ONE RAW LINE (governance_notes is a folded scalar -- the phrase must not wrap, or rec-3960's
    negated-grep acceptance passes vacuously) -- check_roadmap_regrowth is a report-only observable (its TERMINAL-ITEM line minus the declared
    exceptions is the Decision 163 detector) -- an unenforced residual owned by rec-3960 (operator's choice), reversal
    trigger "terminal regrowth recurs after completion_compaction lands -> build the blocking check".
- file: docs/contracts/exit-criteria-ledger.yaml
  action: Modify
  purpose: >-
    fields.status.semantics truth-maintenance rule (line ~63) today says "preserving the original wording in the item's
    own note when the history matters" and applies to items completed in EARLIER sessions -- the vector that regrew
    T-1.21, T-1.22 and T3.8. Repoint: on a terminal (complete/reserved) item the original wording goes to the
    commit/PR body per tier-item-lifecycle.yaml#completion_compaction, never into a note; on a non-terminal item it may
    go to the item's progress_note (stripped at completion). Append a fields.status amendment_log entry
    (prose_improvement, semantic_break false -- field shape and enum unchanged; precedent: the same field's
    2026-09-12 entry that added this rule). ALSO correct the audit_invariants KNOWN LIMITATION (lines ~286-292), which
    compaction falsifies: once T2.56's files_in_scope is emptied, exactly one .claude/skills/ entry remains (T3.19,
    deferred_post_mvp); log it in the top-level amendment_log (prose_improvement, semantic_break false).
- file: tests/checks/roadmap/test_check_roadmap_regrowth.py
  action: Modify
  purpose: >-
    Add class TestCompletionCompactionContract: completion_compaction names every
    check_roadmap_regrowth._ITEM_PROSE_FIELDS entry plus intent, files_in_scope, open_questions and known_gaps and
    cites Decision 147; completion_compaction_exceptions is a mapping whose fields are all compactable fields and whose
    pinned_by file part exists; bookkeeping_walk, tier_item_freshness_gate and replacement_closure_check EACH reference
    completion_compaction and none contains "a note citing the evidence" or "supersession note"; exit-criteria-ledger
    fields.status.semantics references completion_compaction and no longer contains "item's own note", and its
    audit_invariants no longer claims "at least two .claude/skills/ entries"; completion_compaction contains "successor
    pointer", "one-line intent" and "bootstrap_completion_exempt"; and the RAW TEXT of tier-item-lifecycle.yaml (read
    as text, not yaml.safe_load) contains "completion_compaction has no enforcing check" on one line. Update the
    module docstring's "every case drives synthetic roadmaps" line to name this contract-reading class.
- file: config/agent/verification_registry/entries/t2-56-regrounded-and-layer5-declared.yaml
  action: Delete
  purpose: >-
    Retire via `git mv` into entries/deprecated/ (Decision 176's loader-excluded retirement path; 11 precedents). Its
    whole claim is a one-shot re-grounding fact about T2.56's files_in_scope and progress_note content that
    completion_compaction deliberately removes; the live pointer it guarded ("rec-3718 owns Layer 5 prose
    governance") is carried by rec-3718 itself (open). Keeping the fields instead would cost ~68 lines of the ~90-line
    margin. Only its own historical plan references the check_id.
- file: config/agent/verification_registry/entries/deprecated/t2-56-regrounded-and-layer5-declared.yaml
  action: Create
  purpose: Destination of the git mv above -- byte-identical content, loader-excluded.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Append ONE dated amendment_forms pointer line to Decision 147 (after its Related line; Decision 177 append-only --
    no existing line changes): point 4's compact form is now staged at completion by
    tier-item-lifecycle.yaml#completion_compaction and was re-applied (with resolved open_questions / closed known_gaps)
    by this plan; this pass is norm re-application, the structural fix is overdue and owned by rec-3960. No runway
    figure (an operational fact -- decision-entry.yaml operational_fact routes it to rec-3960's context). Pointer only,
    never a restatement of the rule (Decisions 150/167 routing). It must NOT contain a "9,996 -> N lines" figure
    (TestBaselineMatchesDecision147 regex-matches that phrase over the entry). Dry-run at planning:
    decisions-index.json stays fresh.
bundled_recommendations:
- rec-4034
- rec-2782
followon_recs:
- rec-4051
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset,
  so compute_affected_artifacts() reports it. NO deploy is performed or needed (schedule disabled; precedent
  PLAN-telemetry-event-journal-contracts VP step 8; rec-3990 tracks the deploy-trigger gap); asserted by VP step 9.
  No other scope file is Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
- docs/ROADMAP-PLATFORM.yaml is under 9,500 raw lines (rec-4034's acceptance) and check_roadmap_regrowth reports escalate=false.
- >-
  With the fields declared in completion_compaction_exceptions set aside, check_roadmap_regrowth reports zero regrown
  terminal candidate_decisions and tier_items; every declared exception is still genuinely needed (its item is
  flagged without the set-aside).
- No one-line intent in docs/ROADMAP-PLATFORM.yaml is 280 characters or longer (rec-2782's acceptance).
- >-
  Compaction changed ONLY the allowed fields on terminal records: every non-terminal tier_item, pending CD, open
  open_question/known_gap and every other top-level section is unchanged vs origin/main; no id was added, removed or
  reordered; every exit_criteria block and every declared exception field is unchanged; compute_state_dict
  projections are identical to origin/main's.
- >-
  No live obligation was lost: T2.42's one-line intent cites rec-4051 with the marker "layer-replace observation
  pending", rec-4051 is open, and the PR body records a carried-by / new-carrier / kept-as-watch-signal disposition for
  every compacted record.
- >-
  docs/contracts/tier-item-lifecycle.yaml carries completion_compaction (reserved-item successor pointer in the one-line
  intent, scope-(c) carrier, OQ/KG clause) and completion_compaction_exceptions, referenced from bookkeeping_walk,
  tier_item_freshness_gate and replacement_closure_check, none of which still instructs a closeout or supersession
  note, plus the single-raw-line residual declaration; exit-criteria-ledger's truth-maintenance rule points terminal
  items at it and its KNOWN LIMITATION names exactly one .claude/skills/ entry; TestCompletionCompactionContract
  asserts each of these and fails without them.
- >-
  t2-56-regrounded-and-layer5-declared lives only under entries/deprecated/ and no live surface references it.
- validate_platform_roadmap, validate_candidate_decision_ratification and validate_candidate_decision_supersession pass.
- Full bin/venv-python -m scripts.validate exits 0 before the implementation commit (handoff_policy).
- >-
  rec-3960 (open) names the completion_compaction unenforced residual and its detector in its context, and its
  acceptance gains `! grep -q "completion_compaction has no enforcing check" docs/contracts/tier-item-lifecycle.yaml`, so
  the owner cannot close until the residual declaration is consciously resolved.
- >-
  rec-4034 and rec-2782 read status closed after the squash-merge (Resolves trailer) AND both acceptance commands still
  pass against post-merge origin/main (rec-autoclose does not evaluate acceptance).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Roadmap still loads through the typed RoadmapDocument schema after compaction.
  command: bin/venv-python -m scripts.roadmap.platform_roadmap docs/ROADMAP-PLATFORM.yaml
  expected: Exit 0 (schema load succeeds).
  fix_if: A Pydantic error names the field -- a dropped required field or a malformed collapsed scalar; restore it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Duplicates validate_platform_roadmap, already registered in both presubmit tiers; a second standing row would
    add no discrimination.
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: rec-4034's own acceptance -- the file is under 9,500 raw lines.
  command: test $(wc -l < docs/ROADMAP-PLATFORM.yaml) -lt 9500
  expected: Exit 0.
  fix_if: >-
    Re-run check_roadmap_regrowth; a regrown record was missed or a collapsed field kept multiple lines. Do NOT delete
    blank separator lines or join lines to hit the number (rec-3028 raw-line gameability). STOP RULE: if the full
    terminal target set is compacted and concurrent non-terminal growth on main still keeps the file >= 9,500, stop
    and escalate to the operator / rec-3960 (Decision 55) -- never widen the target set into non-terminal content.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Graduating would install a second, lower 9,500-line ceiling as a standing gate beside Decision 114's single
    10,000-line ceiling; check_roadmap_regrowth's escalate field is the sanctioned observable.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Regrowth observable reads clean -- escalate=false, no regrown terminal CD, and no regrown terminal tier_item once
    the fields declared in completion_compaction_exceptions are set aside; every declared exception is still genuinely needed.
  command: bin/venv-python -c "import yaml;from scripts.checks.roadmap.check_roadmap_regrowth import growth_line,terminal_cd_ids,terminal_item_ids;ex=yaml.safe_load(open('docs/contracts/tier-item-lifecycle.yaml',encoding='utf-8'))['completion_compaction_exceptions'];t=open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8').read();d=yaml.safe_load(t);g=growth_line(len(t.splitlines()));cds=terminal_cd_ids(d['candidate_decisions']);its=terminal_item_ids([{k:v
    for k,v in i.items() if k not in ex.get(i.get('id'),{}).get('fields',[])} for i in d['tier_items']]);raw=sorted(terminal_item_ids(d['tier_items']));print(g,'CDS',cds,'ITEMS',its,'RAW',raw,'EX',sorted(ex));assert
    'escalate=false' in g,g;assert cds==[] and its==[],(cds,its);assert raw==sorted(ex),(raw,sorted(ex));print('REGROWTH_COMPACT_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: CDS/ITEMS name records still carrying Decision-147-removed content -- compact them; a RAW/EX mismatch means a
    declared exception is stale (remove it) or an undeclared pin was kept (declare it with pinned_by).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Graduating turns the report-only regrowth observable into a blocking gate, which the operator
    declined in favour of the fix-at-source contract rule; the exception set is also transient.
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: rec-2782's own acceptance -- no one-line intent of 280+ characters remains.
  command: >-
    grep -cP '^    intent: .{280,}' docs/ROADMAP-PLATFORM.yaml | grep -qx 0
  expected: Exit 0.
  fix_if: Shorten the matching intent line(s); target under 280 BYTES so the result holds in any locale.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Graduating would impose a repo-wide 280-character intent cap on forward (not_started) items -- a new authoring
    rule beyond rec-2782's completed-item scope.
  expected_literals: []
- step: 5
  phase: pre-deploy
  action: Field-preservation differential vs origin/main -- only allowed fields changed, only on terminal records; ids,
    order, exit_criteria, every completion_compaction_exceptions field and all non-terminal content unchanged. Mutation-tested
    at planning (allowed drop passes; non-terminal, exit_criteria, pinned-field and open-OQ edits each flagged).
  command: bin/venv-python -c "import subprocess,yaml;b=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True,check=True).stdout);h=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8'));ex=yaml.safe_load(open('docs/contracts/tier-item-lifecycle.yaml',encoding='utf-8'))['completion_compaction_exceptions'];rules={'tier_items':('status',{'complete','reserved'},{'progress_note','note','decomposition_hints','intent','files_in_scope'}),'candidate_decisions':('state',{'ratified','superseded'},{'detail','realization_evidence'}),'open_questions':('status',{'resolved'},{'notes'}),'known_gaps':('status',{'resolved','closed','promoted'},{'notes'})};assert
    set(b)==set(h);bad=[k for k in b if k not in rules and b[k]!=h[k]];bad+=[(k,'order') for k in rules if [e['id'] for
    e in b[k]]!=[e['id'] for e in h[k]]];bad+=[(k,x['id'],sorted(d)) for k,(f,term,ok) in rules.items() for x,y in zip(b[k],h[k])
    for d in [{n for n in set(x)|set(y) if x.get(n)!=y.get(n)}] if d and not (x.get(f) in term and d<=ok)];bi={i['id']:i
    for i in b['tier_items']};hi={i['id']:i for i in h['tier_items']};bad+=[(i,f,'exception changed') for i,v in ex.items()
    for f in v['fields'] if bi[i].get(f)!=hi[i].get(f)];print(bad or 'PRESERVATION_OK');raise SystemExit(1 if bad else 0)"
  expected: Exit 0 and the success marker printed.
  fix_if: Each printed tuple names a record and the field changed outside the allowed set; restore it from origin/main.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Reads the origin/main image of the roadmap -- transient session state that becomes self-identical
    after merge, so a standing row would pass vacuously.
- step: 6
