    Eligibility invariance -- compute_state_dict on origin/main's roadmap vs the compacted tree yields identical
    projections (next_eligible, in_progress, blocked, blocked_on_cd, ratifiable_cds, gate_evaluations, ...).
  command: >-
    bin/venv-python -c "import subprocess,tempfile,pathlib;from scripts.platform_roadmap_state import compute_state_dict
    as c;d=pathlib.Path(tempfile.mkdtemp());(d/'plans').symlink_to(pathlib.Path('docs/plans').resolve());p=d/'ROADMAP-PLATFORM.yaml';p.write_text(subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True,check=True).stdout,encoding='utf-8');b=c(p);h=c(pathlib.Path('docs/ROADMAP-PLATFORM.yaml'));assert
    'error' not in b and 'error' not in h,(b.get('error'),h.get('error'));bad=[k for k in set(b)|set(h) if
    k!='stale_cache_note' and b.get(k)!=h.get(k)];print(bad or 'ELIGIBILITY_INVARIANT_OK');raise SystemExit(1 if bad
    else 0)"
  expected: Exit 0 and the success marker printed.
  fix_if: A named projection key diverged -- a status, depends_on, gate or CD field was altered; restore it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Differential against the origin/main image -- transient session state that is vacuous once merged.
- step: 7
  phase: pre-deploy
  action: >-
    Roadmap integrity guards pass in isolation -- validate_platform_roadmap (size, met_by, criterion (ii) on
