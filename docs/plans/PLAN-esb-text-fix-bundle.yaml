constraints:
  - >-
    PUBLIC repository (Decision 73 / AGENTS.md). ESB-09 publishes infrastructure cost arithmetic,
    which is safe-to-publish platform engineering and NOT trading alpha. Even so: no AWS account
    ids, no ARNs, no IAM ExternalIds, and no internal hostnames may appear in any cost text. The
    never-commit pre-commit hook is the BACKSTOP; VP step 6 is the control.
  - >-
    Decision-annotation reconciliation, stated explicitly rather than paraphrased. Decision 145
    clause 2 forbids restating an AMENDMENT on its victim -- an amendment belongs only in the
    amending Decision. Neither trailer here is an amendment: each is a non-amending dated
    ANNOTATION recording that a premise in the entry has gone stale, which
    docs/contracts/decision-entry.yaml sanctions via `amendment_forms`, and for which CD.27's own
    discipline_points[8] is in-repo precedent. The three conditions that keep it non-amending are
    therefore binding: the original body is untouched, no supersession verb appears, and the
    substantive change lives in its new locus (CD.27's discipline_points / the reworded criteria).
    PIN THE FORM: use `> **Update (YYYY-MM-DD):**` for BOTH trailers and do NOT use
    `[Amendment ...]` -- labelling a non-amending annotation "Amendment" would put two entries in
    the corpus that amend nothing. Read the contract; do not copy the form from memory.
  - >-
    Avoid the tokens "Supersedes Decision N", "amends Decision N" and "partially supersedes
    Decision N" inside either trailer. validate_supersession_annotations regexes exactly those
    forms and would mint a phantom supersession edge requiring a waiver-file entry.
