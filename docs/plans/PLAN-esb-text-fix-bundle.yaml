schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: esb-text-fix-bundle
intent: >-
  Establish a substrate-neutral resume-property vocabulary for the executor persona layer and
  repair the record defects around it, so the CD.27 layer-2 substrate decision is evaluated on
  testable properties rather than on the incumbent's mechanism, and so the CD.17 reversal gate
  the whole platform unfreeze depends on becomes coherently evaluable.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-esb-text-fix-bundle.yaml
phase: >-
  Platform T4 (executor substrate) -- text/contract remediation against tier_items T4.1, T4.2 and
  candidate_decision CD.27. Remediates findings ESB-05, ESB-01 (c1 half only), ESB-07, ESB-08,
  ESB-09, ESB-10, ESB-11 from audits/executor-substrate-and-billing-shape-ad02653.yaml, and adds
  the ESB-04/ESB-06 ratification-time obligations. Wave 1 of a 5-wave remediation run.

scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      ESB-05 (T4.1 persona-node typing at :6828/:6829/:6831/:6832; T4.2 criterion c1 at :6935;
      CD.27 gains a structured resume_properties block); ESB-01 c1-half (workspace continuity
      folded into c1, no backing store named); ESB-07 (T4.1 files_in_scope :6841-6843 re-pointed
      to terraform/personal/); ESB-08 (CD.27 :822 prose stability definition replaced by a
      structured stability_definition_14d mapping); ESB-09 (cost_projection :268-321 arithmetic
      repair plus a structured executor_substrate_billing block); ESB-10 (all four CD.27 substrate-naming surfaces de-mechanised at layer 2 -- :748 title,
      :817 personas point plus its deterministic-only scoping, `discipline_points[3]` Fargate
      escape-hatch point, and `narrowly_supersedes.clause`);
      ESB-11 (:791 runtime list, :803-804 cross-references); ESB-04/ESB-06 ratification-obligation
      discipline_points. Line :821 is NOT touched -- it is wave 3's (ESB-02).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      ESB-10 co-cite: a sanctioned dated trailer appended AFTER Decision 39's entry body recording
      that CD.27's deterministic-only rule does not narrow Decision 39's `agent` state type.
      ESB-11: a sanctioned dated trailer appended AFTER Decision 75's entry body recording that its
      terraform/data_pipeline.tf precedent sits at the retained-not-applied legacy root. Neither
      original body is edited in place (Decision 145 clause 2).
  - file: docs/INTENT-provider-agnostic-executor.md
    action: Modify
    purpose: >-
      ESB-08 reconciliation annotation on the resume-rate alarm row at :352 -- the counter measures
      UNPLANNED resumes only; scheduled duration-ceiling continuations are routine under CD.27 and
      excluded. Cited by CD.27 as provenance only, never as gate authority (Decision 86).
  - file: tests/esb_text_fix/__init__.py
    action: Create
    purpose: >-
      Package marker for the guard suite. __init__.py is excluded from the Decision 130 whole-repo
      SLOC scan, so it carries no budget.
  - file: tests/esb_text_fix/_anchors.py
    action: Create
    purpose: >-
      Shared document loaders and locator helpers. Names all three target document paths as literal
      quoted tokens so scripts/checks/deps/affected_tests.py channel 2 (data-edge PRECISE match)
      selects this package in the --pre tier whenever those documents change.
  - file: tests/esb_text_fix/test_resume_property_vocabulary.py
    action: Create
    purpose: >-
      ESB-05 + ESB-01 guards: exactly P1/P2/P3 defined once in CD.27; T4.2 c1, all four T4.1
      persona-node typings AND CD.27's personas discipline point each reference the property ids
      POSITIVELY (the personas point is not exempt -- it is the site ESB-10 targets, and a
      negative-only check there is the mechanism-free-but-property-free failure this guard exists
      to catch); mechanism vocabulary absent from all NINE de-mechanised sites -- the seven
      property-bound contract sites (c1, four node typings, personas point, Fargate escape-hatch
      point) plus the two descriptive sites (CD.27's title and narrowly_supersedes clause); c1 asserts
      workspace continuity and names no backing store; T4.2's criteria remain bare strings and no
      `- id:` header line appears in the roadmap diff.
  - file: tests/esb_text_fix/test_executor_tf_paths.py
    action: Create
    purpose: >-
      ESB-07 guard, scoped by the `executor_` BASENAME PREFIX: every executor-prefixed .tf path
      across every T4.x files_in_scope sits under terraform/personal/, with zero remaining under
      the retired terraform/ root, AND T4.12's non-executor terraform/scheduled_agents.tf is
      asserted to REMAIN at the legacy root. The prefix scoping is load-bearing, not incidental --
      an unscoped assertion fails on a correctly-implemented tree.
  - file: tests/esb_text_fix/test_stability_gate.py
    action: Create
    purpose: >-
      ESB-08 guards: the structured stability definition carries denominator, exempt,
      baseline_window and worked_example{inputs,computed,verdict}; the worked example's rate is
      re-derived FROM `inputs` and compared to `computed`; `verdict.fires` is an explicit boolean
      (never prose, which a substring test would satisfy even when negated); a nonzero
      scheduled-continuation count proves the exemption is exercised; the OLD prose stability entry
      is absent; the days-1-7 thresholds carry the literal TBD_at_T4.2_atomic_plan deferral marker
      rather than invented numbers; the WHOLE stability block is scanned for mechanism vocabulary
      (ESB-05's third site -- renaming the signal key alone leaves denominator/exempt/
      baseline_window and the worked example's free text unconstrained); INTENT :352 is annotated.
  - file: tests/esb_text_fix/test_cost_projection.py
    action: Create
    purpose: >-
      ESB-09 guards: the SFN transition line recomputes from its own stated assumptions at the
      cited eu-west-2 rate at exact equality (no cents rounding); the current_scale headline
      recomputes from an explicit `headline_basis` (boolean include-flag, enumerated subtotal,
      add-on) rather than being asserted against a magic ceiling; a named Neon catalog egress line
      exists; the NAT figure is a bracket carrying confidence medium; the gross/free-tier stance is
      explicit; exactly four `substrate_reevaluation_triggers` are present under that name; every
      enumerated breakdown line is either summed into the subtotal or explicitly excluded; and
      the PUBLIC-repository guard -- no 12-digit AWS account id, no arn:aws: string, no ExternalId
      pattern, no internal hostname anywhere in the cost text.
  - file: tests/esb_text_fix/test_decision_scope_notes.py
    action: Create
    purpose: >-
      ESB-10 / ESB-11 / ESB-04 / ESB-06 guards: both DECISIONS.md trailers use the PINNED
      `> **Update (YYYY-MM-DD):**` form read from docs/contracts/decision-entry.yaml
      amendment_forms (with `[Amendment ...]` explicitly rejected, since neither trailer amends
      anything) and sit after the entry body; neither uses a supersession verb; Decision 39's and
      Decision 75's original bodies are unchanged versus origin/main; CD.27's title no longer names
      the layer-2 substrate; CD.27's cross-references name T4.12 and no longer offer the retired runner-cron
      option; the runtime list includes .NET/C#; both ratification-obligation discipline_points are
      present with the Decision 39 managed-primitive clause and the ESB-06 lapse clause; CD.27
      remains state pending with filed_via pending_log_decision_lambda.

bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    ESB-05a: CD.27 carries a structured `resume_properties` mapping defining exactly three
    properties -- P1 resume-without-redo, P2 workspace continuity, P3 bounded loss -- in
    mechanism-free vocabulary, and it is the single definition site.
  - >-
    ESB-05b: T4.2 criterion c1 and all four T4.1 persona-node typings (plan_agent, the Parallel
    critic fan-out, implement_agent, code_review) each REFERENCE the property ids P1, P2 and P3
    explicitly -- a mechanism-free but property-free rewording does NOT satisfy this -- AND CD.27's
    personas discipline point does the same (it is checked positively, not merely for banned
    tokens); and the tokens "checkpoint-replay", "Durable Function", "forced timeout" and "replay"
    no longer appear at ANY of the nine de-mechanised sites -- c1, the four node typings, the
    personas discipline point, the Fargate escape-hatch discipline point, CD.27's title, and
    CD.27's `narrowly_supersedes.clause`.
  - >-
    ESB-01 (c1 half only): T4.2 c1 asserts workspace continuity via P2 ("without losing workspace
    state") and names NO backing store -- the store choice remains open for a later wave.
  - >-
    ESB-07: every executor `.tf` path in every T4.x `files_in_scope` sits under
    `terraform/personal/`; zero executor `.tf` paths remain under the retired `terraform/` root.
  - >-
    ESB-08: CD.27's 14-day stability definition is a structured mapping carrying `denominator`,
    `exempt`, `baseline_window` and `worked_example` with `inputs`/`computed`/`verdict`; the worked
    example's rate recomputes exactly from its own `inputs` (not from `computed`), exercises a
    nonzero scheduled-continuation count, and carries an explicit boolean `verdict.fires`; the OLD
    prose stability entry is GONE rather than joined by a structured sibling; the days-1-7 absolute
    thresholds carry the literal marker `TBD_at_T4.2_atomic_plan` rather than invented values; the
    ENTIRE structured stability block is free of mechanism vocabulary (it is ESB-05's third named
    site alongside c1 and the node typing, so the rename of the signal key is necessary but not
    sufficient -- `denominator`, `exempt`, `baseline_window` and the worked example's free text are
    all covered); and the INTENT :352 alarm row is annotated as counting unplanned resumes only.
  - >-
    ESB-09a: `step_functions_transitions` reads "$0.075-0.225" and recomputes exactly from its own
    stated assumptions (30 transitions/rec x 100-300 recs/month x $0.000025/transition); the
    self-inconsistent "$1-10" figure is gone and is not preserved anywhere.
  - >-
    ESB-09b: `current_scale` carries a `headline_basis` mapping with an explicit boolean
    `includes_line_items_not_enumerated`, an `enumerated_subtotal_usd` and an `add_on_usd`, and
    `total_per_month_usd` RECOMPUTES exactly from them, and `headline_basis.derivation` accounts
    for EVERY enumerated breakdown line as either summed or explicitly excluded (the Neon egress
    line being the expected exclusion, since Decision 88 clause 2 gives it a measurement obligation
    and no figure yet), so a future added cost line cannot silently fall outside the headline. The defect being corrected is that the
    45-65 headline was never recomputed after the EC2 and RDS retirements -- NOT that stale lines
    need removing: `ec2_runner_24_7` already reads "$0 (retired 2026-05-28 per CD.21 ...)" and
    there is no RDS line at all (RDS survives only as prose inside `ducklake_catalog_neon`). Also:
    a NAMED Neon catalog egress line exists carrying the Decision 88 clause 2 measurement
    obligation rather than a guessed figure.
  - >-
    ESB-09c: a structured `executor_substrate_billing` block exists carrying, for every cost line,
    an explicit `region: eu-west-2` and a `rate_basis` naming the AWS Price List bulk offer files
    fetched 2026-08-01; an explicit gross / free-tier-ignored stance; the NAT line as a BRACKET
    with `confidence: medium`; and exactly four `re_evaluation_triggers` (A2+ concurrency raise,
    100x scale, repo-visibility change, egress shape per Decision 88), named
    `substrate_reevaluation_triggers` -- NOT `re_evaluation_triggers`, which sits one underscore
    away from the block's existing `cost_projection.reevaluation_triggers` and is a drift surface.
  - >-
    ESB-10: none of CD.27's FOUR substrate-naming surfaces -- its title (:748), its personas
    discipline point (:817), its Fargate escape-hatch discipline point (`discipline_points[3]`),
    or its `narrowly_supersedes.clause` -- mandates the LAYER-2 substrate by name. The two
    requirement-bearing surfaces (:817 and the Fargate point) state the requirement as P1/P2/P3;
    the two descriptive surfaces (title, supersession clause) are simply mechanism-free. Layer 1
    (Step Functions, ratified by Decision 39) and layer 3 (Lambda deterministic glue) remain named
    throughout because neither is in dispute. AND :817's deterministic-only half is scoped to
    ITERATIVE persona loops, co-citing Decision 39.
    Decision 39 carries a sanctioned dated trailer recording the same scope, and its original body
    is byte-identical to origin/main.
  - >-
    ESB-11: CD.27 names T4.12 (not the rewritten T4.3) for the scheduled-agent loop, no longer
    offers the CD.21-retired self-hosted-runner-cron option, and its runtime list includes .NET/C#;
    Decision 75 carries a sanctioned dated trailer recording that its `terraform/data_pipeline.tf`
    precedent sits at the retained-not-applied legacy root, with its original body unchanged.
  - >-
    ESB-04/ESB-06: two CD.27 discipline_points state the layer-2 ratification preconditions -- a
    comparative record over the pinned substrate set plus the Q5 spike outcome (including the
    Decision 39 managed-primitive clause), and the conditional determinism-rules-plus-static-check
    obligation with an explicit lapse clause -- while CD.27 stays `state: pending` with
    `filed_via: pending_log_decision_lambda` so validate_candidate_decision_ratification R2 passes.
  - >-
    PUBLIC-repository boundary: no AWS account id, ARN, IAM ExternalId, or internal hostname
    appears anywhere in the added cost text, asserted mechanically rather than by inspection.
  - >-
    Guards: the `tests/esb_text_fix/` package lands with every module under 500 SLOC and none
    registered in `config/sloc_budgets.yaml`; each of the FIVE guard modules was demonstrated to
    FAIL against the pre-edit tree before the corresponding edit was applied. (The count is five,
    not six: `_anchors.py` is a loader from which pytest collects no tests, so it has no failing
    state to demonstrate. VP step 10's "six-module package" and VP step 11's six-file glob use a
    different and correct denominator -- every non-`__init__` file in the package, loader included,
    is SLOC-governed and ships in the package.)
  - >-
    Scope discipline: `docs/ROADMAP-PLATFORM.yaml` line :821 (the CD.27 fallback clause, owned by
    wave 3 / ESB-02) is unchanged versus origin/main; the roadmap diff contains no `- id:` header
    line; and `.github/actions/subagent-plan-review/**` and `scripts/ci/review_verdict.py` are
    untouched. This names specific paths and is deliberately NOT an exhaustive untouched-file
    assertion -- `config/agent/verification_registry/registry.yaml` is legitimately written by the
    implement skill's VF-05 producer walk (see context).

verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      Roadmap still parses under the Pydantic schema after the structured discipline_points edits.
      CandidateDecision is extra="forbid", so any stray new top-level CD key fails here; this is
      the specific structural risk the Decision 110 pivot introduces.
    command: >-
      bin/venv-python -c "from scripts.roadmap.platform_roadmap import load;
      d=load('docs/ROADMAP-PLATFORM.yaml');
      cd=[c for c in d.candidate_decisions if c.id=='CD.27'][0];
      assert cd.state=='pending', cd.state;
      assert cd.ratified_as is None;
      assert cd.filed_via=='pending_log_decision_lambda', cd.filed_via;
      dp=cd.discipline_points;
      assert len(dp)==13, f'expected EXACTLY 13 discipline_points (9 pre-existing + resume_properties + 2 ratification obligations + 1 H1 cross-reference correction; stability_definition_14d REPLACES entry 6 in place, adding none), found {len(dp)}';
      blob=str(dp);
      assert 'managed orchestration primitive' in blob.lower(), 'ESB-04 obligation missing its Decision 39 managed-primitive clause';
      assert 'lapse' in blob.lower(), 'ESB-06 obligation missing its explicit lapse clause';
      print('OK', len(dp), 'discipline_points; both ratification obligations present')"
    expected: >-
      Loads without raising and prints OK with a discipline_points count of EXACTLY 13 -- the 9
      pre-existing entries, plus the resume_properties entry, the two ratification-obligation
      entries, and one H1 cross-reference-correction entry (code-review round 1; see AMENDMENT
      note below), with stability_definition_14d replacing pre-existing entry 6 in place rather
      than adding one. Exactness matters: a greater-than-or-equal bound would pass on a tree where
      the structured stability block was appended and the stale prose entry left standing. Both
      obligations are additionally asserted BY CONTENT, so dropping either one fails here even if
      the count is satisfied. On a passing tree the step prints exactly
      `discipline_points; both ratification obligations present`.
    fix_if: >-
      A ValidationError naming an unexpected CD.27 key means a structured block was added as a new
      top-level key instead of a discipline_points entry -- move it into discipline_points. A count
      of 14 means `stability_definition_14d` was APPENDED rather than replacing entry 6 -- delete
      the stale prose entry (VP step 4 asserts this independently). A count of 12 means one of the
      four intended ADDITIONS was dropped -- check which of `resume_properties`, the ESB-04
      obligation, the ESB-06 obligation, or the H1 correction entry is missing. A content-assertion
      failure means an ESB-04/ESB-06 obligation was silently dropped, the exact defect this slice
      exists to prevent (see WAVE BOUNDARIES in context).
      AMENDMENT (2026-08-02, code-review round 1, H1): the count moved from 12 to 13. H1 found
      that renaming T4.2 c1 (ESB-05) left CD.27's wave-3-owned (:821) maturity-monitoring point
      quoting a now-nonexistent T4.2 criterion phrase verbatim. That point is VP step 9's own
      protected text (byte-identical to origin/main, wave-3/ESB-02 ownership) and cannot be edited
      in place, so the fix is a new, separate discipline_point entry that acknowledges the stale
      quote and supplies a resolving replacement reference -- additive, not a replacement of an
      existing entry, hence +1 to the count rather than 0.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the already-registered validate_platform_roadmap check, which performs the same
      schema load in both the --pre and full tiers. A registry row would add a second caller of the
      identical assertion with no additional coverage.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      ESB-05 keystone, verified INDEPENDENTLY of the plan's own test package. Asserts BOTH
      directions: negatively, that T4.2 c1, the four T4.1 persona-node typings and CD.27's
      personas discipline point carry none of the incumbent's mechanism vocabulary; and
      POSITIVELY, that each of P1/P2/P3 is actually referenced by c1 and by every one of the four
      node typings. The positive half is what makes ESB-05b real -- without it, a literal
      execution that retypes nodes to a mechanism-free but property-free label would satisfy every
      other check while leaving the contracts unbound to the vocabulary waves 2, 3 and 5 inherit.
    command: >-
      bin/venv-python -c "import yaml;
      d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.27'][0];
      rp=[p for p in cd['discipline_points'] if isinstance(p,dict) and 'resume_properties' in p];
      assert len(rp)==1, f'resume_properties must be defined exactly once, found {len(rp)}';
      props=rp[0]['resume_properties'];
      assert set(props)=={'P1','P2','P3'}, f'expected exactly P1/P2/P3, got {sorted(props)}';
      t41=[i for i in d['tier_items'] if i['id']=='T4.1'][0];
      t42=[i for i in d['tier_items'] if i['id']=='T4.2'][0];
      c1=t42['exit_criteria'][0];
      nodes=[l for l in t41['intent'].splitlines() if '[' in l and 'T4.2]' in l];
      assert len(nodes)==4, f'expected 4 persona-node typings, found {len(nodes)}';
      personas=[p for p in cd['discipline_points'] if isinstance(p,str) and 'Agent personas' in p];
      assert len(personas)==1, f'expected 1 personas discipline point, found {len(personas)}';
      fargate=[p for p in cd['discipline_points'] if isinstance(p,str) and 'ECS Run Task escape hatch' in p];
      assert len(fargate)==1, f'expected 1 Fargate escape-hatch discipline point, found {len(fargate)}';
      banned=['checkpoint-replay','durable function','forced timeout','replay'];
      property_bound={'c1':c1,'personas_discipline_point':personas[0],'fargate_discipline_point':fargate[0]};
      property_bound.update({f'node[{n}]':t for n,t in enumerate(nodes)});
      descriptive={'cd_title':cd['title'],'narrowly_supersedes_clause':cd['narrowly_supersedes']['clause']};
      allsites={**property_bound, **descriptive};
      hits={k:[b for b in banned if b in v.lower()] for k,v in allsites.items()};
      hits={k:v for k,v in hits.items() if v};
      assert not hits, f'mechanism vocabulary survives at a de-mechanised site: {hits}';
      missing={k:[p for p in ('P1','P2','P3') if p not in v] for k,v in property_bound.items()};
      missing={k:v for k,v in missing.items() if v};
      assert not missing, f'contract text does not reference the resume properties: {missing}';
      assert 'workspace' in c1.lower(), 'c1 must assert workspace continuity (ESB-01 half)';
      print('OK', sorted(props), len(nodes), 'nodes;', len(property_bound), 'property-bound sites;', len(descriptive), 'descriptive sites; all 9 mechanism-free')"
    expected: >-
      Prints OK with exactly P1/P2/P3, 4 nodes, 7 property-bound sites and 2 descriptive sites.
      Proves the vocabulary is single-sourced; every persona node was retyped (including the
      Parallel critic fan-out line the audit's own anchor hint omitted); all seven CONTRACT sites
      reference the property ids rather than merely gesturing at them; all NINE de-mechanised sites
      (the seven contract sites plus CD.27's title and narrowly_supersedes clause) are free of
      mechanism vocabulary; and c1 carries the workspace clause.
    fix_if: >-
      "expected 1 personas discipline point, found 0" means the rewrite dropped the literal
      `Agent personas` anchor token, or turned the entry into a YAML mapping via a colon-space --
      restore the token and keep the entry a plain string. A count of 3 nodes means the Parallel
      critic fan-out line was missed. A mechanism-vocabulary hit means a criterion, node typing or
      the personas discipline point still names the incumbent. "expected 1 Fargate escape-hatch
      discipline point, found 0" means the S2 site-A rewrite dropped its
      `ECS Run Task escape hatch` anchor token -- restore it. A `missing` failure means a contract
      site was reworded mechanism-free but never bound to P1/P2/P3 -- add the explicit property
      reference; this is the keystone's failure mode and it propagates to waves 2, 3 and 5. A
      missing workspace token means the ESB-01 half was dropped.
    graduation: graduate
    graduation_check_id: t4x-persona-contracts-mechanism-word-free
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      ESB-07: assert every EXECUTOR `.tf` path across every T4.x tier_item files_in_scope sits under
      terraform/personal/, so the executor infrastructure rides the governed Decision 126 infra
      channel rather than the retired terraform/ root. Scoped by the `executor_` basename prefix --
      this is deliberate and load-bearing: T4.12's `terraform/scheduled_agents.tf` is legacy-root by
      design (its Lambdas are the inert scheduled agents, see the DEPLOY DEFERRAL context) and is
      NOT this plan's to move. An unscoped assertion would fail on a correctly-implemented tree.
    command: >-
      bin/venv-python -c "import yaml;
      d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      tf=[(i['id'],f.split('#')[0].strip()) for i in d['tier_items'] if i['id'].startswith('T4.')
      for f in (i.get('files_in_scope') or []) if f.split('#')[0].strip().endswith('.tf')];
      ex=[(t,p) for t,p in tf if p.rsplit('/',1)[-1].startswith('executor_')];
      bad=[(t,p) for t,p in ex if not p.startswith('terraform/personal/')];
      assert not bad, f'executor .tf still under the retired root: {bad}';
      assert len(ex)>=5, ex;
      nonex=[(t,p) for t,p in tf if not p.rsplit('/',1)[-1].startswith('executor_')];
      assert ('T4.12','terraform/scheduled_agents.tf') in nonex, 'T4.12 scheduled_agents.tf must remain untouched at the legacy root';
      print('OK', len(ex), 'executor .tf paths under terraform/personal/;', len(nonex), 'non-executor path(s) correctly excluded')"
    expected: >-
      Prints OK with at least 5 executor paths (T4.1's three re-pointed files plus T4.9a's and
      T4.11's already-correct entries), an empty bad list, and T4.12's scheduled_agents.tf still
      present at the legacy root as a non-executor path.
    fix_if: >-
      A non-empty bad list names an EXECUTOR-prefixed tier_item path still under the retired root;
      re-point that path to terraform/personal/ keeping the filename. If the failure instead names
      `T4.12` / `terraform/scheduled_agents.tf`, do NOT move it -- that path is correctly at the
      legacy root and moving it would corrupt T4.12's scope and contradict this plan's DEPLOY
      DEFERRAL; the fix is to restore it and re-check the executor-prefix filter.
    graduation: graduate
    graduation_check_id: executor-tf-paths-under-terraform-personal
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      ESB-08: assert the stability gate is now structurally evaluable, re-derive the worked
      example's rate FROM ITS OWN `inputs` rather than reading back `computed`, and prove the OLD
      prose stability entry is gone rather than merely joined by a structured sibling. This is the
      step that proves the CD.17 reversal precondition -- the platform's headline unfreeze trigger
      -- can actually fire.
    command: >-
      bin/venv-python -c "import yaml;
      d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      cd=[c for c in d['candidate_decisions'] if c['id']=='CD.27'][0];
      sd=[p for p in cd['discipline_points'] if isinstance(p,dict) and 'stability_definition_14d' in p];
      assert len(sd)==1, f'expected exactly 1 stability_definition_14d, found {len(sd)}';
      s=sd[0]['stability_definition_14d'];
