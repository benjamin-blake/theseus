      (see context). "mechanism vocabulary survives in the stability definition" means the signal
      key was renamed but the incumbent's mechanism still appears in a value -- most likely
      `denominator`, `exempt` or the worked example's note; reword it in interruption/resume terms.
      AMENDMENT (2026-08-02, code-review round 1, M2): `verdict.fires` was renamed to
