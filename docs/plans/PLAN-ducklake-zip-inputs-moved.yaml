schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ducklake-zip-inputs-moved
intent: >-
  Stop the sandbox auto-apply failing closed when main gains a change to a DuckLake-packaged file between a
  terraform/personal PR's last speculative plan and its merge: the push-path zip check compares like with like, applies
  the reviewed saved plan with zips rebuilt from the merge commit when every difference traces to an input that moved
  on main, and keeps failing closed on any difference it cannot attribute.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-zip-inputs-moved.yaml
phase: >-
  ci_rca (soft-warn category): forward fix for the Critical ci_rca rec-4372 (terraform-apply-sandbox run 38905586484).
  No tier_item is claimed and no exit criterion is closed.
scope:
- file: scripts/ci/ducklake_inputs.py
  action: Create
  purpose: >-
    Pure input-identity record and attribution, no network. record_inputs(packages_dir, names, root) returns a
    JSON-ready dict: schema 1; tooling, the git blob id of each of scripts/build_lambda.py, scripts/build_lambda_config.py,
    scripts/build_lambda_packaging.py, scripts/build_lambda_deploy.py and scripts/lambda_manifest.py; and per named
    artifact its md5, its kind (layer when the name ends -layer.zip, else function), its entries as name -> uncompressed
    sha256 read from the built zip, and its inputs as path -> git blob id. A function zip's inputs are its entries that
    are git-tracked files at that repo path (entries are verbatim copies, scripts/lambda_manifest.py stage_bundle); an
    untracked entry has no input. A layer's input is config/lambda/ducklake/version.yaml (its pins live in the tooling).
    Blob ids come from git ls-files -s at root, which works on a depth-1 checkout. attribute(reference, current) returns
    a verdict for every artifact whose md5 differs: moved, with the moved paths, when any tooling blob differs; for a
    function zip, when every entry that differs or exists on one side only has an input on at least one side and the
    two sides' blob ids for it differ (absent counts as different); for a layer, when its input moved; otherwise
    unattributed, naming the first entry that blocked attribution or saying only the container bytes differ.
- file: scripts/ci/ducklake_artifacts.py
  action: Modify
  purpose: >-
    (1) main() gains --mode upload-only: runs build_lambda --ducklake-only (with its own internal dual-write upload,
    unchanged) and then uploads record_inputs(...) as lambda-packages/<artifact_sha>/inputs.json. (2) The push-path
    assert in assert_and_upload computes every md5 before uploading anything. All equal: unchanged (re-upload fixed and
    per-sha keys, DUCKLAKE_ZIP_IDEMPOTENT_OK). Any mismatch: read lambda-packages/<artifact_sha>/inputs.json, check
    that its md5 for every artifact equals the md5 of the reference zip just read (else it does not describe the
    reference: fail closed), compute the current record from the local build and checkout, and attribute every
    mismatched artifact. All moved: print DUCKLAKE_ZIP_INPUTS_MOVED naming each artifact and its moved inputs, upload all seven zips to the fixed key and to
    lambda-packages/<merge sha>/ (merge sha = GITHUB_SHA, injectable), upload the current record as
    lambda-packages/<merge sha>/inputs.json, then write lambda-packages/<artifact_sha>/superseded-by.json naming the
    merge sha, the reason and the moved inputs; never write any zip under lambda-packages/<artifact_sha>/. Otherwise,
    or when inputs.json is missing or unreadable, or the merge sha is unset: raise DUCKLAKE_ZIP_MISMATCH exactly as
    today (first line unchanged, entry diff after it, plus one line saying why it was not attributed), with no upload.
    (3) fetch_reviewed first reads lambda-packages/<artifact_sha>/superseded-by.json: absent (NoSuchKey) -> unchanged;
    present and naming a 40-hex sha other than artifact_sha -> fetch and copy from that sha's prefix instead, one hop
    only, printing both shas in DUCKLAKE_FETCH_OK; malformed, unreadable for any other reason, or self-referencing ->
    DucklakeArtifactError before any copy. The missing-object all-or-nothing check is unchanged. (4) rec-4198:
    _zip_entry_diff catches any Exception for the diagnostic only, so it can never replace DUCKLAKE_ZIP_MISMATCH.
    Module docstring updated. Stays under 500 SLOC (238 at planning).
- file: .github/actions/build-ducklake-artifacts/action.yml
  action: Modify
  purpose: >-
    The upload-only branch's one build line becomes python3 -m scripts.ci.ducklake_artifacts "pull_request"
    "$ARTIFACT_SHA" "$BUCKET" --region "$REGION" --mode upload-only, so the inline body keeps its 22 effective lines
    (config/composite_action_body_baseline.yaml build-ducklake-artifacts::#0; no baseline edit, no raise marker). The
    mode input's description says upload-only also writes inputs.json and that assert attributes moved inputs; fetch
    follows a superseded-by.json pointer.
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: >-
    Comments only, no step, expression or body change: the apply-sandbox build_ducklake step comment describes the
    moved-inputs verdict and the merge-sha key, and the gated-apply fetch step comment says fetch follows the pointer.
- file: tests/test_ducklake_artifacts.py
  action: Modify
  purpose: >-
    test_prmerge_concurrent_same_file_zip_identity (rec-4372's filed acceptance node): a real PR-time writer zip built
    from one version of a packaged file plus its inputs.json, and a merge build from the edited file; assert_and_upload
    on push does not raise, uploads the seven zips only to the fixed key and lambda-packages/<merge sha>/, writes the
    pointer and the merge record, writes no zip under the PR head prefix, and prints DUCKLAKE_ZIP_INPUTS_MOVED naming
    the file. Fail-closed nodes: same inputs with different container bytes, a missing inputs.json, a layer mismatch
    with no moved layer input, one moved entry plus one unattributed entry, an unset merge sha, and an inputs.json
    whose md5s do not match the reference zips all raise DUCKLAKE_ZIP_MISMATCH with no upload. Fetch nodes: the pointer
    is followed one hop; a malformed or self-referencing pointer and a pointer whose target objects are missing fail
    closed before any copy. upload-only: main writes
    inputs.json after the build. rec-4198: test_push_byte_mismatch_diff_error_cannot_mask_mismatch (its filed node). The
    existing nodes keep passing unchanged. If the file would pass 500 SLOC (370 at planning), the fetch and upload-only
    nodes move to tests/test_ducklake_inputs.py; the two filed acceptance nodes stay here.
- file: tests/test_ducklake_inputs.py
  action: Create
  purpose: >-
    Unit tests for scripts/ci/ducklake_inputs.py over a temporary git repo: blob ids match git, untracked entries get no
    input, tooling blobs are recorded, and the attribution matrix (tooling moved; function entry moved, unchanged,
    untracked, present on one side only; layer input moved and unchanged; container-only difference), keeping the new
    module at 100% line coverage.
- file: config/agent/verification_registry/entries/ducklake-zip-inputs-moved.yaml
  action: Create
  purpose: >-
    Graduated shard for VP step 1: check_id ducklake-zip-inputs-moved, primitive_slot command_exit_zero running the
    step-1 nodes, guard_target scripts/ci/ducklake_artifacts.py. rec-4372's closure artifact.
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: |-
    conformance.ducklake_detail: replace the sentence beginning "Decision 154 / rec-2862's fetch_reviewed() route"
    (lines 392-396 at planning) with exactly the APPROVED SENTENCE below (rewrapped to the file's width), and add a new
    first amendment_log entry: date (the merge date), semantic_break false, change_class governance_note_add, summary
    "PLAN-ducklake-zip-inputs-moved (rec-4372): conformance ducklake_detail says the human-gated fetch route follows a
    superseded-by.json pointer to the merge commit's push-time artifacts when the PR-time zips predate inputs that moved
    on main. No apply-model or guard-classification field changed." Allowed variance: the date only. No other field
    changes.
    APPROVED SENTENCE:
    Decision 154 / rec-2862's fetch_reviewed() route (scripts/ci/ducklake_artifacts.py): the human-gated apply paths (gated-apply, both Reconcile jobs) fetch the already-reviewed per-sha artifacts, or the merge commit's push-time artifacts when the push run left a superseded-by.json pointer because the PR-time zips predate inputs that moved on main (rec-4372), and server-side copy them onto the fixed key instead of rebuilding; Terraform reads none of them (see the never-read rule in conformance.description).
- file: docs/DECISIONS.md
  action: Modify
  purpose: |-
    Append, after Decision 154's **Related:** line (a blank line, then exactly this one line; allowed variance: the
    date only; approved by Benjamin 2026-10-17, see context). No other Decision is edited (Decision 177 append-only).
    APPROVED LINE:
    > **Update (2026-10-17):** rec-4372 showed point 1's push-path canary premise was wrong: its window has no upper bound, running from the PR's last speculative plan to the merge (about 50 minutes there), so the PR-time reference goes stale when main changes a packaged file in between (#1519's zips predated #1520's edit to `src/common/ducklake_handler_errors.py`). The speculative-plan job now records each artifact's inputs at `lambda-packages/<PR head sha>/inputs.json`. When every difference at merge traces to an input that moved on main (`DUCKLAKE_ZIP_INPUTS_MOVED`), the push run applies the saved plan.bin unchanged, writes the rebuilt zips to the fixed key and `lambda-packages/<merge sha>/`, and leaves a `superseded-by.json` pointer beside the untouched PR-time zips. Point 1's fetch follows that pointer one hop: gated-apply and Reconcile copy bytes fixed at push time, before any approval wait, whose identity rests on the input attribution rather than a PR-time byte match. Any other difference, or a missing reference or record, still fails closed as `DUCKLAKE_ZIP_MISMATCH`; the check is now a same-inputs canary, and a pre-merge double-build canary stays with rec-4194.
bundled_recommendations:
- rec-4372
- rec-4198
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  When a packaged file changes on main after a terraform/personal PR's speculative plan, the merge's push run attributes
  the zip difference to that file, applies the reviewed saved plan.bin unchanged, writes the rebuilt zips to the fixed
  key and the merge commit's prefix, and leaves the PR head prefix's zips untouched (hermetically, and replayed on the
  real incident commits).
- >-
  Any zip difference that does not trace to a moved input (same inputs with different bytes, a layer whose tracked
  inputs did not move, a missing inputs record) still fails closed as DUCKLAKE_ZIP_MISMATCH before any upload.
- The human-gated fetch routes (gated-apply, both Reconcile jobs) copy the merge-prefix zips when a pointer exists and fail closed on a bad pointer.
- The PR speculative-plan job writes inputs.json with no change to the composite action's inline body size.
- Decision 154 carries the approved dated Update line and environment-taxonomy.yaml the approved sentence.
- >-
  On the first terraform/personal PR after the merge, its speculative plan writes an inputs.json that describes its
  zips, and its merge's push run gets past the zip check (live, read-only).
- >-
  rec-4198 closes through the squash commit's Resolves trailer; rec-4372 closes through the manual closure route with
  closure_artifact shard:ducklake-zip-inputs-moved and the merge sha as fixed_by_sha.
verification_plan:
- step: 1
  phase: pre-deploy
  action: A moved packaged file is attributed and the apply proceeds on merge-tree zips; unattributed differences still fail closed.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_artifacts.py::test_prmerge_concurrent_same_file_zip_identity
    tests/test_ducklake_artifacts.py::test_push_same_inputs_different_bytes_fails_closed
    tests/test_ducklake_artifacts.py::test_push_mismatch_without_inputs_record_fails_closed
    tests/test_ducklake_artifacts.py::test_push_layer_mismatch_without_moved_input_fails_closed
    tests/test_ducklake_artifacts.py::test_push_partly_attributed_mismatch_fails_closed -q
  expected: Exit 0, 5 passed. Red before, because the nodes do not exist; written first, the acceptance node fails on DUCKLAKE_ZIP_MISMATCH.
  expected_literals: []
  fix_if: A raise on the moved case, an upload on any fail-closed case, or a zip written under the PR head prefix -> fix ducklake_artifacts.py or ducklake_inputs.py, never loosen a test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ducklake-zip-inputs-moved
- step: 2
  phase: pre-deploy
  action: Fetch follows a pointer one hop and fails closed on a bad one; upload-only writes the record; the diagnostic cannot mask the mismatch.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_artifacts.py tests/test_ducklake_inputs.py -q
  expected: Exit 0; every node passes, including test_push_byte_mismatch_diff_error_cannot_mask_mismatch and the existing fetch and assert nodes.
  expected_literals: []
  fix_if: Any failure -> fix the source; an existing node failing means an unscoped behaviour change, STOP and report.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The whole-file run is the regression floor for every branch and runs in each --pre and full-tier pass; the
    standing invariant worth a registry row is step 1's shard.
- step: 3
  phase: pre-deploy
  action: >-
    Replay the incident on the real commits, no AWS: build the four function zips at bae45827 (PR #1519's head, before
    #1520) and at 2e68dd7c (#1519's squash merge) with each commit's own build code, record both with the new module,
    and attribute; a second build at 2e68dd7c is the same-inputs control. Planning ran the builds (not the new module):
    both writer md5s equal run 38905586484's remote and local md5s byte for byte. Layers are out of reach here (S3, the
    CDN and pip).
  command: |-
    S=$(mktemp -d) && git fetch --quiet origin bae45827f49ee68d7df46295bc518c4fd16a821f 2e68dd7c86077c311739d218d46d113314c7d3bd && git worktree add --quiet --detach "$S/pr" bae45827f49ee68d7df46295bc518c4fd16a821f && git worktree add --quiet --detach "$S/merge" 2e68dd7c86077c311739d218d46d113314c7d3bd && PYTHONPATH=. bin/venv-python - "$S" <<'EOF'
    import hashlib, subprocess, sys
    from pathlib import Path
    from scripts.ci.ducklake_inputs import attribute, record_inputs
    root = Path(sys.argv[1])
    zips = ["ducklake-writer.zip", "ducklake-reader.zip", "ducklake-maintenance.zip", "ducklake-catalog-dr.zip"]
    code = ("import sys; from pathlib import Path; import scripts.build_lambda_packaging as bm; bm.OUTPUT_DIR = Path(sys.argv[1]); "
            "[bm.build_ducklake_function_package(Path(sys.argv[2]), z[:-4].replace('-', '_'), z) for z in sys.argv[3:]]")
    def build(tree, tag):
        out, tmp = root / ("out-" + tag), root / ("tmp-" + tag)
        out.mkdir(); tmp.mkdir()
        subprocess.run([sys.executable, "-c", code, str(out), str(tmp), *zips], cwd=root / tree, check=True)
        return out, record_inputs(out, zips, root / tree)
    (pr_out, pr), (merge_out, merge), (_, again) = build("pr", "pr"), build("merge", "merge"), build("merge", "again")
    md5 = [hashlib.md5((d / "ducklake-writer.zip").read_bytes()).hexdigest() for d in (pr_out, merge_out)]
    verdicts, control = attribute(pr, merge), attribute(merge, again)
    print("writer md5", md5); print("verdicts", verdicts); print("control", control)
    reader = {"src/common/ducklake_event_content.py", "src/common/ducklake_event_read_sql.py", "src/common/ducklake_event_read_verbs.py",
              "src/common/ducklake_event_reads.py", "src/common/ducklake_handler_errors.py", "src/common/ducklake_telemetry_blobstore.py",
              "src/telemetry/blobs.py", "src/telemetry/request.py"}
    ok = (md5 == ["418df564a0cc19eb7360893c0aac00bd", "8bfbde276eec1432920d862084abbf40"]
          and set(verdicts) == {"ducklake-writer.zip", "ducklake-reader.zip"}
          and all(v["verdict"] == "moved" for v in verdicts.values())
          and set(verdicts["ducklake-writer.zip"]["inputs"]) == {"src/common/ducklake_handler_errors.py"}
          and set(verdicts["ducklake-reader.zip"]["inputs"]) == reader
          and not control)
    sys.exit(0 if ok else 1)
    EOF
    RC=$?; git worktree remove --force "$S/pr"; git worktree remove --force "$S/merge"; exit $RC
  expected: >-
    Exit 0. The writer md5s print as the incident's remote then local values; writer and reader are attributed moved
    (writer: src/common/ducklake_handler_errors.py only; reader: the six #1520 edits plus src/telemetry/blobs.py and
    src/telemetry/request.py, which #1520's reader manifest newly packages); maintenance and catalog-dr are identical; the
    same-inputs control attributes nothing.
  fix_if: >-
    Different md5s -> the replay is not the incident; STOP and report. Any other moved input, an unattributed verdict or
    a non-empty control -> STOP and RCA; the record or the attribution is wrong for real trees. If the implemented
    helper names or verdict shape differ, adapt the command to the implemented API without weakening any assertion.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: Full validation before handoff (includes the composite-action body ratchet, SLOC and coverage gates).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Any failure -> fix on the branch and rerun from the start.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
- step: 5
  phase: post-deploy
  action: rec-4198 closed by the squash commit's Resolves trailer.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;r=f('rec-4198') or
    {};print(r.get('status'));assert r.get('status')=='closed'"
  expected: Exit 0 and closed printed.
  fix_if: Still open -> read ci.yml's trailer-closure job output on the squash commit; a transport failure allows the manual route, an acceptance-verdict refusal does not (git-ops.yaml resolves_trailer).
  hermetic: false
- step: 6
  phase: post-deploy
  action: rec-4372 closed through the manual closure route with its closure artifact and fix sha.
  command: >-
    bin/venv-python -c "import json;from scripts.ops_data_portal import _fetch_rec_from_reader as f;r=f('rec-4372') or
    {};c=json.loads(r.get('context_v2_json') or '{}');print(r.get('status'),c.get('closure_artifact'),c.get('fixed_by_sha'));assert
    r.get('status')=='closed' and c.get('closure_artifact') and c.get('fixed_by_sha')"
  expected: Exit 0; closed, shard:ducklake-zip-inputs-moved and the merge sha printed.
  fix_if: >-
    ClosureArtifactRequired -> the merge commit must add the shard file and closure_fix_sha must be that merge sha, in
    the same update_rec call; if the shard kind is refused, use step 1's acceptance pytest node instead.
  hermetic: false
- step: 7
  phase: post-deploy
  action: >-
    Live, read-only: the first terraform/personal PR whose speculative plan runs after this merge wrote an inputs.json
    that describes its uploaded zips. Run with PR_HEAD_SHA set to that PR's head sha (AWS_PROFILE defaults to
    agent_platform; in the ADMIN environment use its read profile).
  command: |-
    test -n "$PR_HEAD_SHA" && S=$(mktemp -d) && aws s3 cp "s3://agent-platform-data-lake/lambda-packages/$PR_HEAD_SHA/" "$S/" --recursive --exclude '*' --include 'inputs.json' --include 'ducklake-*.zip' --profile "${AWS_PROFILE:-agent_platform}" --region eu-west-2 --only-show-errors && PYTHONPATH=. bin/venv-python - "$S" <<'EOF'
    import hashlib, json, sys
    from pathlib import Path
    from scripts.ci.ducklake_artifacts import DUCKLAKE_ARTIFACT_NAMES
    d = Path(sys.argv[1])
    rec = json.loads((d / "inputs.json").read_text())
    want = {n: hashlib.md5((d / n).read_bytes()).hexdigest() for n in DUCKLAKE_ARTIFACT_NAMES}
    got = {n: rec["artifacts"][n]["md5"] for n in DUCKLAKE_ARTIFACT_NAMES}
    print("schema", rec.get("schema"), "md5s match", got == want)
    sys.exit(0 if rec.get("schema") == 1 and got == want else 1)
    EOF
  expected: Exit 0; schema 1 and md5s match printed.
  fix_if: >-
    No inputs.json -> the upload-only repoint did not run in CI; read that PR's speculative-plan build step log and fix
    forward. Mismatched md5s -> the record was computed from different zips than were uploaded; STOP and RCA. If the
    implemented record keys differ from rec["artifacts"][name]["md5"], adapt the read without weakening the comparison.
  hermetic: false
- step: 8
  phase: post-deploy
  action: >-
    Live, read-only: that PR's merge got past the zip check. The convergence record shows green at the merge commit (or
    a pending_gated marker for it when the guard routed) and no infra_error naming build_ducklake for it; when a
    superseded-by.json exists under the PR head prefix, all seven zips exist under the prefix it names. Run with
    PR_HEAD_SHA and MERGE_SHA set.
  command: |-
    test -n "$PR_HEAD_SHA" && test -n "$MERGE_SHA" && PYTHONPATH=. bin/venv-python - <<'EOF'
    import json, os, sys
    import boto3
    from scripts.ci.ducklake_artifacts import DUCKLAKE_ARTIFACT_NAMES
    s3 = boto3.Session(profile_name=os.environ.get("AWS_PROFILE", "agent_platform")).client("s3", region_name="eu-west-2")
    b, head, merge = "agent-platform-data-lake", os.environ["PR_HEAD_SHA"], os.environ["MERGE_SHA"]
    rec = json.loads(s3.get_object(Bucket=b, Key="convergence/personal/sandbox.json")["Body"].read())
    infra = rec.get("infra_error") or {}
    reached = (rec.get("status") == "green" and rec.get("commit_sha") == merge) or (rec.get("pending_gated") or {}).get("commit_sha") == merge
    blocked = infra.get("commit_sha") == merge and infra.get("failed_step") == "build_ducklake"
    try:
        target = json.loads(s3.get_object(Bucket=b, Key=f"lambda-packages/{head}/superseded-by.json")["Body"].read())["artifact_sha"]
    except s3.exceptions.NoSuchKey:
        target = None
    if target:
        for n in DUCKLAKE_ARTIFACT_NAMES:
            s3.head_object(Bucket=b, Key=f"lambda-packages/{target}/{n}")
    print("path", "inputs-moved" if target else "identical", "reached", reached, "blocked", blocked)
    sys.exit(0 if reached and not blocked else 1)
    EOF
  expected: >-
    Exit 0; "path identical" (the common case) or "path inputs-moved" (the rec-4372 case, live), reached True, blocked
    False.
  fix_if: >-
    blocked True -> read the push run's build step log; DUCKLAKE_ZIP_MISMATCH with a moved-input explanation is a defect
    in this fix (fix forward on a new plan), an unexplained one is a genuine canary hit (ci-rca owns it). reached False
    for another reason (a later commit already moved the record) -> confirm from that push run's log instead. If the
    record's marker field names differ, adapt the read without weakening the two predicates.
  hermetic: false
