rollback: >-
  Every source change is additive and default-preserving (a new optional parameter plus
  pass-through call sites, plus declaration adoption that only adds accounting output), so
  reverting this commit restores the pre-fix behaviour exactly -- including the red main run.
  Rollback is therefore only appropriate if the fix itself breaks a different check; the correct
  response to a residual rec-3166-class failure is a forward-fix (Decision 55/72), never a revert
  of this commit or of PR #924. Note that re-adding a shrink-removed name to
  config/check_accounting_baseline.yaml is permanently blocked by the frozen _BASELINE_SEED
  cross-check, so a partial revert must restore the declarations, not the baseline entries.
