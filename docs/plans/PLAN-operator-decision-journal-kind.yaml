  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: Validate the plan document, then run the fast tier.
  command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-operator-decision-journal-kind.yaml && bin/venv-python
    -m scripts.validate --pre
  expected: Both exit 0.
  fix_if: Fix the named finding; never skip or disable a check.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: Run the full tier to completion before the commit (handoff_policy).
