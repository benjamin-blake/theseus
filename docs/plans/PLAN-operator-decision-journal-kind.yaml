  action: Read rec-3530 through the DuckLake reader after the portal update.
  command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows,miss=fetch_recs_by_ids(make_reader(),['rec-3530']);
    r=rows[0]; c=r['context']; first=c.split(chr(10),1)[0]; print('rec-3530 status=%s leads=%s declined=%s original_kept=%s' % (r['status'],c.startswith('[')
    and 'PLAN-operator-decision-journal-kind' in first,'is declined' in first,'This rec owns building (or deliberately declining'
    in c))"
  expected: 'Prints rec-3530 status=open leads=True declined=True original_kept=True: the dated note is the context''s first line
