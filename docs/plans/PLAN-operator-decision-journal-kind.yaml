- |
  VERBATIM section 9 (v2: v1 approved by Benjamin 2026-10-30; v2 redline approved 2026-10-30 18:15Z, cmsg_01PCtd8o8287wUrLv1SCjZEuTuzV2TTT3P97PaHSrALZzX; DATE is the only variance)
  ## 9. Reservation (DATE): operator_decision kind for CD.47 (direction only)

  Carried by docs/plans/PLAN-operator-decision-journal-kind.yaml on the operator's direction of 2026-10-24.
  Appended after section 8 so every line that Decision 221 and merged plans cite keeps its number; sections 0-8
  are unchanged and section 7's boundary binds them only. This section records direction as text, in the same
  standing as the RULINGS sentences: it ratifies nothing, files no candidate decision, and builds no table,
  writer, verb or check. Each entry names the staged row it amends by id; the operator files that row together
  with its entries (section 3's re-draft rule), and an entry binds only at its row's ratification (Decision 221
  clause 7). Schemas, verbs and writers stay the build's.

  ```yaml
  staged_row_amendments:
    - id: CD.47-r1
      amends: CD.47
      title: operator_decision record kind
      text: >-
        The journal gains a record kind, operator_decision, for forks: questions an agent puts to the operator
        with options. GRAIN: one row per answer to a fork, append-only on the Decision 199 model. A changed
        answer, a re-ask after a plan revision or a withdrawal is a new row naming the row it supersedes, never
        an update, and the current answer is derived at read as the latest row per fork. The grain key is the
        fork plus the row it supersedes (none on a first answer), so a changed answer is never a Decision 207
        grain conflict and a retried write is a no-op. IDENTITY: derived at the write boundary from the caller's
        reference (Decision 199
        clause 3), never minted by the caller; fork_id is stable across re-asks of one fork. FIELDS: fork_id;
        answer_event (answered, changed, re_asked or withdrawn) with the row it supersedes; source
        (alignment_sign_off, filer_mark, consult_point, critique_or_scout_flag, gate or north_star_promotion);
        kind (required and never defaulted: a value of direction or mechanism with its justification, in the
        shape and by the rubric of docs/contracts/decision-kind.yaml, the one definition of kind); class (asked
        or consistency-only, the literals of overseer-dispatch.yaml's
        record_grammar, decided-with-notice being the notice tier of a consistency-only line); the options
        offered; the option recommended; the option chosen; the consult's position where a consult existed,
        with its consult point by pointer; the rationale in the operator's own words; decided_by; decided_at;
        tenant_id and project_id. POINTERS: a plan is referenced by repository path plus commit SHA, and a
        consult point, rec, Decision or work item by id, never embedded. WRITER: the surface that asks writes
        the row when the operator answers, through one named write verb: the /plan alignment sign-off, the
        overseer's gate trampoline, and later the Decision 232 clause 4 gate card; never a classifier over
        transcripts. The asking surfaces count as one component under the own-kind-only rule above. A
        gate-sourced row is written after the forge holds the approval and carries the forge identity and
        approval reference; it records the approval and is never the approval authority (Decision 233 clause
        4). The plan context[] fork line (overseer-dispatch.yaml record_grammar, residual owner rec-3530) stays
        the interim record and retires into this kind when its writer is built. PARTITION: the answer's event
        day.
    - id: CD.47-r2
      amends: CD.47
      title: tenant keys on every kind
      text: >-
        Every record kind in the journal, operator_decision included, carries tenant_id and project_id NOT
        NULL: Decision 200's writer-minted ids, resolved at the write boundary as its clause 1 says (tenant_id
        from the configured constant or the caller's authenticated identity, project_id from a caller-sent
        project reference) and never supplied by a caller, declared per kind rather than inherited by analogy
        with Decision 199.
    - id: CD.47-r3
      amends: CD.47
      title: derived at read, never stored
      text: >-
        Nothing about operator decisions is stored as a metric. Consult deference rate (the chosen option
        equals the consult's position, by decision class), standing bias (a class whose answers take the same
        option in every fork above a minimum count, which proposes codifying a Tier C decision), consult value
        (forks that followed the consult against those that did not, joined to back-validation overturns on
        the resulting work, once back-validation runs) and rubber-stamp detection (approval rate per gate beside
        its register counter) are named read-time verbs (Decision 84 I-3) over this kind joined to what the
        journal already holds, on Decision 199's derive-at-read model. Convergence of decisions toward an
        unrecorded intent stays a scheduled persona's judgement over the same verbs, never a register row and
        never a stored metric.
    - id: CD.46-r1
      amends: CD.46
      title: decision classes as ladder subjects
      text: >-
        The ladder's subject widens from a loop component to a loop component or a decision class, a decision
        class being a (source, kind) pair as operator_decision rows record it, on the same one controller and
        transition log (Decision 221 clause 7). A direction class is pinned at read_all forever and never earns
        a rung, whatever its record; the pin binds the class's lane, not the operator_decision kind as a data
        upstream, so a derivation reading the kind is not capped by it. A mechanism class earns rungs under the
        same rule family with a per-class minimum fork count before any promotion; the operator approves every
        promotion and every demotion is automatic. A fork that weakens verification is decided on Decision 235's
        own lane, which keeps its change-class subject unchanged; a fork that touches that Decision's clause 5
        floor or falls on overseer-dispatch.yaml's always_ask list stays at read_all in every class. Decision
        235's cd46-reshaped reversal condition is named here so the operator re-reads clause 2 when filing
        CD.46.
    - id: CD.46-r2
      amends: CD.46
      title: two register rows
      text: >-
        Two rows join the register, staged below under register_rows_staged for #1400 to fold at build. Both
        gate no rung. The first is the detector of the north star whose failure signal is a gate approved so
        near-always that it no longer discriminates (Decision 221 clause 1). Neither drill seeds a known-wrong
        recommendation on a live gate: both run in Decision 231's offline evaluation lane, so the engine never
        tests the operator through the approval surface itself.
    - id: CD.51-r1
      amends: CD.51
      title: operator_decision egress classes
      text: >-
        Egress classes for the operator_decision kind, under #1399 k5 (a): the fork sentence, the options
        offered, the rationale and every other free-text column are never-crosses under every answer to k1
        (Decision 209 clause 2(b)). decided_by and every derived id are classed by the operator's answer to k2
        and cross under no answer until it is given. Counts and rates derived at read over the closed columns
        (class, kind, source, answer_event, and whether the chosen option was the recommended one) are eligible
        to cross only as the operator's answers to k1, k3 and k4 admit. This entry chooses no membership,
        identifier rule, transport or grain.

  register_rows_staged:
    - detector: operator-decision-gate-approval
      metric: 'gate_approval_rate: answers whose chosen option is the recommended one / answers, per gate, rolling 30 days, undefined (never 0) below a minimum answer count'
      decides: no rung; the gate's discrimination check (the north star failure signal above) and the Decision 232 gate card's evidence
      cheap_path: 'Rubber-stamp or starve the gate: the operator approves without reading, or the agent folds forks into consistency-only lines or offers one credible option, so what reaches the gate is approved trivially'
      declared_guard: overseer-dispatch.yaml's always_ask list and credible-alternative rule; the notice tier is visible at sign-off and catchable by plan-critique and /implement's deviation trigger; none of them reads the rate
      counter: 'approval_holding_share: 1 - approved answers changed, withdrawn, or whose plan was reverted or needed a red-main repair within 90 days / approved answers; read from the supersede chain, revert PRs and ci_rca recs, never from the gate count'
      counter_floor: 0.99 (register seed, provisional; the operator sets it)
      drill: known-wrong recommendations mixed into the Decision 231 offline blind-adjudication stream, unmarked to the adjudicator; recall is read there, never on a live gate
      upstream: []
    - detector: operator-decision-standing-bias
      metric: 'standing_bias: per decision class, the share of the last N answers (N at least the class minimum) that took the recommended option'
      decides: no rung; the proposal to codify a Tier C decision for the class, and the precondition that a mechanism class's record is sound before its lane reads it
      cheap_path: 'Recommendation fitting: the agent recommends whatever the operator chose last, so the chosen option equals the recommended one by construction and the class reads as settled without the choice being right'
      declared_guard: record_grammar's precedent rule (a decided-with-notice line is never precedent; precedent none is legal only on an asked line); nothing mechanical reads the rate
      counter: 'class_holding_share: 1 - answers in the class changed, withdrawn, or whose plan was reverted or needed a red-main repair within 90 days / answers in the class; read from the supersede chain, revert PRs and ci_rca recs'
      counter_floor: 0.99 (register seed, provisional; the operator sets it)
      drill: a seeded class whose recommended option is planted known-wrong, run through the Decision 231 offline blind-adjudication stream; recall = seeded answers marked wrong / seeded answers
      upstream: []
  ```
