rollback: >-
  RESTORING THE NAME-ONLY ENTRIES IS NOT THE ROLLBACK, and earlier drafts of this field were wrong to
  say it was. Those subjects are unmintable post-rename -- that is the whole premise of the
  contraction -- so re-adding them re-trusts subjects nothing can ever present and CANNOT fix a broken
  assume. It would also red both standing guards this plan installs
  (test_every_entry_is_immutable_format directly; test_slug_lists_are_identical_across_roots if only
  one root is touched), making the emergency PR unmergeable at the exact moment the trigger is "CI
  unable to deploy". Do not do it.
  The real failure mode is a WRONG IMMUTABLE ENTRY (a typo, or the wrong owner/repo id), and the real
  remedy is to correct that literal -- restoring it to
  benjamin-blake@217728084/theseus@1252427466 in BOTH roots in one commit -- and re-apply the personal
  root through tf-gated-apply. A wrong literal is caught pre-merge by VP4 and by the existing
  test_both_roots_declare_the_immutable_entry, which assert the exact expected ids -- NOT by VP9,
  whose regex is a form check that a typo'd id still satisfies. VP12 is the only live-IAM
  exact-literal proof, and it covers github_ci_apply alone. Before step 10 (bootstrap apply) the widening is still
  live, so the apply role retains the trust-rewrite grant that re-apply needs.
  After step 10 the widening is gone, so any personal-root trust re-apply on planner or deploy would
  AccessDeny; recovery is a second operator bootstrap apply restoring those two ARNs FIRST, then the
  personal re-apply -- the exact inverse of this plan's ordering, and operator-tier both times. NOTE
  that restoring those two ARNs is exactly what the new test_resource_set_is_exactly_branch_and_pr pin
  forbids, BY DESIGN (a re-widening must be a reviewed edit, not a quiet one). The out-of-band apply
  runs from a working tree and is not machine-blocked, but the commit persisting it is unmergeable
  unless it carries a same-commit edit to that pin test. Budget for that edit; do not discover it
  under time pressure. Two further costs of that emergency PR, both under time pressure: it touches
  /terraform/bootstrap/, so it hits the SAME CODEOWNERS require_code_owner_review gate this plan
  flags for the main PR -- a reviewer must be reachable; and until it merges, the out-of-band applied
  state is drift NO monitor detects, because terraform-drift.yml and reconcile.yml both run with
  WORKDIR terraform/personal and neither covers terraform/bootstrap. Note the immutable entry is never
  removed at any stage, so no rollback path can reproduce the 2026-08-15 total outage; the worst case
  is a return to the current over-wide steady state, not an outage. The test and registry
  changes are independently revertible and carry no infrastructure effect.
