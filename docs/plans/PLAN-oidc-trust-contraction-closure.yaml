test_obligations:
  - source: terraform/personal/oidc.tf
    behavior: >-
      local.github_repos carries only immutable-format OWNER@ID/REPO@ID entries -- no legacy name-only
      slug can be silently reintroduced, and the immutable entry can never be removed.
    verification_step: 6
    test_selector: tests/checks/iam_tf/test_oidc_trust_slug_invariants.py::TestImmutableSubjectEntry::test_every_entry_is_immutable_format
    red_green_expectation: >-
      Red before (this root declares 2 name-only entries alongside the immutable one), green after.
  - source: terraform/bootstrap/github_ci_apply.tf
    behavior: >-
      This root's mirrored local.github_repos carries only immutable-format entries. The guard reads
      _BOOTSTRAP_APPLY directly, so it discharges this file's obligation on its own evidence rather
      than borrowing the personal root's.
    verification_step: 6
    test_selector: tests/checks/iam_tf/test_oidc_trust_slug_invariants.py::TestImmutableSubjectEntry::test_every_entry_is_immutable_format
    red_green_expectation: >-
      Red before (this root declares 2 name-only entries alongside the immutable one), green after.
      Deliberately NOT linked to test_slug_lists_are_identical_across_roots, which is green before AND
      after by design and so cannot discharge the AGENTS.md red-green rule for this file; that test is
      carried as its own obligation row below.
  - source: terraform/bootstrap/github_ci_apply.tf
    behavior: >-
      The two roots' slug lists stay byte-identical, so a contraction cannot narrow one root and miss
      the other -- a divergence the two roots' inability to reference each other makes otherwise
      invisible until post-deploy.
    verification_step: 6
    test_selector: tests/checks/iam_tf/test_oidc_trust_slug_invariants.py::TestCrossRootSlugAgreement::test_slug_lists_are_identical_across_roots
    waiver_reason: >-
      No red-before state exists for this invariant and none should: both roots agree at 3 entries
      today and must agree at 1 entry after, so the test is green on both sides of a CORRECT change.
      It goes red only on the specific defect it guards -- a half-applied contraction -- which is a
      state this plan must never produce. A red-before requirement here would mean deliberately
      breaking cross-root agreement first, which is worse than the waiver.
  - source: terraform/bootstrap/github_ci_apply_policy.tf
    behavior: >-
      The IAMRoleReconcile Sid's Resource set stays exactly {branch, pr}. iam:UpdateAssumeRolePolicy
      is a trust verb and stays fleet-narrow under Decision 143 clause 1 -- worst-verb scoping is a
      standing rule, NOT contingent on DEP-05 being open (T2.50 completed 2026-07-24). Re-widening now
      requires a reviewed test edit rather than an HCL comment nobody enforces.
    verification_step: 7
    test_selector: tests/checks/iam_tf/test_iam_role_reconcile_trust_scope.py::TestIAMRoleReconcileScope::test_resource_set_is_exactly_branch_and_pr
    red_green_expectation: Red before (4 ARNs -- planner and deploy still present), green after.
  - source: config/agent/verification_registry/registry.yaml
