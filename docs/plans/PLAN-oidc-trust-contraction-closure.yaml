      i='repo:benjamin-blake@217728084/theseus@1252427466';
      assert sorted(subs)==[f'{i}:environment:tf-gated-apply', f'{i}:ref:refs/heads/main'], sorted(subs);
      print('both-sub-forms-ok')"
    expected: "both-sub-forms-ok"
    fix_if: >-
      A missing environment:tf-gated-apply form silently UNGATES every gated apply -- the regression
      Decision 94 exists to prevent (its own VP9, a different plan's numbering, not this plan's step 9). Restore it via A SECOND operator bootstrap apply, immediately -- step 10's apply has already completed by the time this step runs, so "the same apply" is not available.
  - step: 13
