      raw=sys.stdin.read().strip(); assert raw and raw!='None', f'RoleLastUsed ABSENT ({raw!r}) --
      the apply role was never assumed or was REPLACED (step 10 fix_if catastrophic case), not a lag
      artifact'; t=dt.datetime.fromisoformat(raw);
      b=dt.datetime.fromisoformat(os.environ['BOOTSTRAP_APPLY_TS']); assert t>b,
      f'no advance: {t} <= {b}'; print('apply-liveness-ok', raw)" &&
      aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - --region eu-west-2
      --profile agent_platform_admin | bin/venv-python -c "import json,sys,os,datetime as dt; d=json.load(sys.stdin);
      assert d['status']=='green', d['status'];
      assert d['run_id'] == os.environ['DISPATCH_RUN_ID'],
      f\"convergence record was NOT written by THIS dispatch (record run_id={d['run_id']},
      dispatched={os.environ['DISPATCH_RUN_ID']}) -- a concurrent push to main touching
      terraform/personal/** writes a green, fresh record too, which would satisfy a
      timestamp-only check while THIS dispatch guard-BLOCKED and applied nothing\";
      assert dt.datetime.fromisoformat(d['timestamp'].replace('Z','+00:00')) >
      dt.datetime.fromisoformat(os.environ['BOOTSTRAP_APPLY_TS']),
      f\"convergence record NOT REWRITTEN by this dispatch (ts={d['timestamp']}) -- a guard-BLOCK
      routes, skips the apply AND the record write, and the run still exits SUCCESS, so 'green' here
      is the stale record from the merge apply\";
      print('convergence-green-and-fresh-ok', d['timestamp'])"
    expected: >-
      "apply-liveness-ok <timestamp>" later than BOOTSTRAP_APPLY_TS, then
      "convergence-green-and-fresh-ok <timestamp>" -- the record must be green, rewritten after the
      bootstrap apply, AND carry THIS dispatch's run_id (export DISPATCH_RUN_ID from the recorded run).
      The run_id binding is what stops a concurrent terraform/personal merge from satisfying the check
      on this dispatch's behalf. Green alone is insufficient: a guard-BLOCK dispatch routes, applies nothing,
