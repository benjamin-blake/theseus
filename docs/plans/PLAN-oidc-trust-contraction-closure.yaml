      bin/venv-python -m scripts.ops_data_portal --sync &&
      bin/venv-python -c "import json,pathlib;
      rows={r['id']: r for r in (json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip())};
      bad=[i for i in ('rec-3161','rec-3143') if rows.get(i,{}).get('status')!='closed'];
      assert not bad, bad;
      opens=[r for r in rows.values() if r.get('status')=='open'];
      disch=[r for r in opens if r.get('title','').startswith('Discharge Decision 172')];
      expiry=[r for r in opens if r.get('title','').startswith('Machine-checkable expiry')];
      assert disch, 'AC6: no open rec titled \'Discharge Decision 172...\' -- the reversal-condition
