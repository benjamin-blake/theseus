    iam:UpdateAssumeRolePolicy on four roles; two of them (planner, deploy) are marked TEMPORARY
    (rec-3132) with the end condition "remove both in PR-3's bootstrap apply". That removal never
    happened because PR-3 no longer exists as planned: Decision 172 point 4 rehomed the trust
    contraction out of PLAN-repo-rename-relicense onto rec-3142 (now carried by its successor
    rec-3161), and the widening must SURVIVE until that contraction runs. The head of the chain (rec-3143) was unscheduled -- the rename plan's own amended
    acceptance criterion says of it "which no plan drives -- it advances on the next ducklake/prod
    Lambda deploy." A trust verb, the highest risk class in this repo's taxonomy, was left widened
    indefinitely waiting on an event nobody had scheduled. This plan schedules it.
  - >-
    VEHICLE ASSESSMENT (checked, not assumed). deploy-prod-lambdas.yml is the lower-blast-radius
    vehicle. deploy-ducklake-lambdas.yml's reconcile-gate currently PASSES
    (validate_reconcile_pending_gate --deploy-gate exits 0), so it would not block -- but it redeploys
    the live DuckLake writer/reader that every ops-portal call transits, including this plan's own rec
    closures. Rejected on blast radius, not on the gate. A zero-blast-radius PR-context identity anchor
    (the shape #915 added to pr-validate) is structurally impossible: github_ci_deploy's live trust
    carries only :ref:refs/heads/main subjects, so no pull_request-context job can assume it, and
    widening trust to enable an anchor would be worse than the problem it verifies.
  - >-
    EVIDENCE DISCIPLINE. Workflow run conclusions are NOT accepted as proof of an assume. Seven of the
    repo's 26 assume steps carry continue-on-error; #916 closed the three worst masking sites, but the
    two deploy workflows retain a SCOPED tolerance -- while vars.DEPLOY_ROLE_PROVISIONED is not 'true',
    a failed assume warns and the run reports GREEN having deployed nothing. The S3 deploy record is
    the gate (immediate, deterministic) and RoleLastUsed corroborates (IAM last-used data is reported
    with delay, so it cannot be a same-minute gate). CloudTrail lookup-events is AccessDenied to both
    available profiles -- do not reach for it.
  - >-
    WHY RoleLastUsed PROVES THE FORM FOR THE DEPLOY ROLE. RoleLastUsed is per-ROLE, not per-sub-form,
    so it normally corroborates liveness without proving the form. For github_ci_deploy it DOES prove
    the form, resting on two facts that must be re-checked if its trust is ever edited: (1) it has
    exactly ONE trust Statement, and (2) that statement has exactly ONE federated principal (the
    GitHub OIDC provider) and one suffix template, :ref:refs/heads/main, flattened over
    local.github_repos. With the two name-only entries unmintable post-rename, any successful assume
    after 2026-08-15T12:55:57Z necessarily matched the immutable entry. The argument collapses if
    either fact changes. It does NOT transfer to github_ci_apply, where two sub FORMS share one entry
    -- hence the separate document proof at the both-sub-forms step (12).
  - >-
    WHY THE CONTRACTION CANNOT CHANGE AN ASSUME OUTCOME. It removes only entries that are provably
    unmintable, so the surviving entry -- and therefore every assume decision -- is textually unchanged.
    The residual risk is a typo in the surviving entry. Step 9 does NOT catch that -- its regex is a
    FORM check (OWNER@digits/REPO@digits), so a wrong owner or repo id still matches and reports OK.
    The exact-literal catches are VP4 and the existing test_both_roots_declare_the_immutable_entry
    (both pre-merge, both asserting the exact expected ids), plus VP12 post-apply, which is the only
    live-IAM exact-literal proof and covers github_ci_apply alone. Steps 13-15 add live post-contraction re-assume for all five roles anyway, per the
    "prove it, do not argue it" standard.
  - >-
    LEDGER CORRECTION (2026-08-16, this planning session's own error). rec-3142 was closed by
    accident when this session smoke-tested the verification-plan commands against the LIVE portal
    without excluding the --update-rec write. No work had been done. Decision 103's schema gate
    refused the closed -> open reactivation and directed that a reopen be recorded as a new rec, so
    rec-3161 was filed carrying the identical outstanding work, and rec-3142's resolution was
    corrected in place to flag the erroneous closure and name its successor. THIS PLAN THEREFORE
    CLOSES rec-3161, NOT rec-3142. Two standing lessons: never execute a plan's prospective portal
    writes as part of a command smoke-test, and the warehouse guard worked exactly as designed.
  - >-
    rec-3132 IS ALREADY CLOSED (2026-08-15), closed when the widening LANDED rather than when it
    reverts. No open rec tracks the revert obligation -- it survives only as an HCL comment and a note
    in PLAN-repo-rename-relicense. This plan is its sole tracking vehicle, which is itself the drift
    being closed. Do not attempt to close rec-3132 again.
  - >-
    STALE PREMISE CORRECTED (plan-critique finding). The HCL comment this plan edits asserts that
    "DEP-05 (a dedicated trust-boundary control) is still open -- this narrow identity grant is the
    ONLY control against that". That is false: T2.50 / DEP-05 is status complete, completed_at
    2026-07-24, both exit criteria met, and .github/CODEOWNERS + main-protection's
    require_code_owner_review now protect /terraform/bootstrap/ as a second independent control. The
    earlier draft of this plan inherited the stale claim verbatim into its own phase field and
    instructed the implementer to KEEP the paragraph. Both are corrected: the conclusion (revert a
    grant that was explicitly time-boxed) stands on rec-3132's own time-box and Decision 143 clause 1,
    neither of which is contingent on DEP-05.
  - >-
    DECISION 171 ALREADY ASSERTS THIS HAPPENED. Its Reversal-conditions prose reads "that window closed
    with Decision 172's contraction" -- currently untrue, since the contraction has not landed. This
    plan makes the repository's own Decision text true. No edit to Decision 171 is needed or made
    (forward-direction amendment convention, Decision 126/143).
  - >-
    DISCHARGE REHOMING (plan-critique rounds 1-2). The Decision 172 amendment note asserts three
    facts -- all five roles proven live, both roots contracted, the widening reverted -- of which the
    last two are true only AFTER the operator bootstrap apply at step 10, which happens post-merge.
    Merging the discharge with the code would disarm the reversal condition tracking those facts
    while they were still outstanding: exactly the defect this plan criticises in Decision 171. But
    deferring it to a second PR under THIS plan's slug is also blocked, and for a reason worth
    recording: validate_graduation_completeness's implement-PR leg computes new-in-diff registry rows
    as current-minus-origin/main, so once PR-1 merges the graduated rows are in the
    baseline and a later feat({slug}) PR would fail the check with "no matching new-in-diff registry
    row" -- and it is pre=True, so that is an authoritative gate, not advisory. The escapes (a
    non-feat commit subject, or flipping the affected steps to hermetic:false) are the workarounds rec-3139 records as
    rejected. So the discharge is REHOMED to its own recommendation, precisely as Decision 172 point
    4 rehomed this very contraction onto rec-3142. That is this repository's established pattern for
    an evidence-gated governance edit, not a novel dodge.
  - >-
    rec-3139 IS NARROWER THAN ITS TITLE SUGGESTS -- worth folding into the follow-on. rec-3139 records
    that validate_vp_replay has no in-model expression for a plan spanning two PRs. There are TWO
    feat-commit-resolving gates, not one: validate_graduation_completeness shares the same
    _FEAT_COMMIT_RE resolution and the same blind spot, and an earlier draft of this plan cleared
    itself against vp_replay alone and was wrong. Whatever fixes rec-3139 must cover both.
  - >-
    ONE PLAN, ONE PR FOR THE CODE. All code and test edits land in a single commit, so
    validate_vp_replay replays this plan's hermetic pre-deploy steps (4, 5, 6, 7) against a complete
    tree. The three applies are separated by APPLY CHANNEL, not by PR: the personal contraction
    applies at merge via tf-gated-apply, and the bootstrap edits sit inert until the operator applies
    them. Nothing in this plan requires a second PR under its own slug -- the one edit that would
    have (the Decision 172 discharge) is rehomed to a rec above.
  - >-
    MERGE GATE. .github/CODEOWNERS maps /terraform/bootstrap/ to @benjamin-blake and main-protection
    sets require_code_owner_review = true, so this PR reports REVIEW_REQUIRED / BLOCKED even with CI
    fully green. The standard CI-green -> squash-merge loop will NOT clear it. Route: a code-owner
    review, or a deliberate admin bypass (main-protection bypass_mode=always, audit-logged). Do not
    treat the block as a CI failure and do not RCA it.
  - >-
    ci-rca DEFERRAL (Related-Work check) -- RESOLVED SINCE, retained as the planning-time record.
    rec-3147 CLOSED on 2026-08-17 when the owning agent's PR #922 (76c3af7,
    feat(oidc-failopen-guard-coverage)) drove the nine defensive branches to 100%. No ci-rca rec is
    open against this plan. The original deferral, unchanged: rec-3147 (Critical, coverage regression in
    scripts/checks/ci_guards/validate_oidc_failopen_guards.py) is deferred by explicit human direction:
    it is owned by another agent under docs/plans/PLAN-oidc-failopen-guard-coverage.yaml. This plan
    satisfies none of the three Related-Work conditions against it -- different source file, different
    Decision, different failure category (code_regression vs an IAM trust-scope contraction) -- so the
    deferral is logged here rather than claimed as related work.
  - >-
    DECISION 172 DISCHARGE, exact edit -- CARRY THIS VERBATIM INTO THE SUCCESSOR REC (a), do not
    apply it in this plan. In the
    ```yaml reversal-conditions``` stanza, DELETE the legacy-entries-provably-dead-with-proof
    condition entirely, leaving future-rename-not-prestaged. The conditions list must stay NON-EMPTY
    or the stanza parses MALFORMED and validate_reversal_stanzas fails. Immediately AFTER the stanza's
    closing fence and BEFORE the **Related:** line, insert a dated amendment note in the
    amendment_forms.dated_amendment shape: "> **2026-08-16 amendment (contraction discharged):**
    condition (a) `legacy-entries-provably-dead-with-proof` is satisfied and removed from the stanza
    above. All five CI roles now record a live assume under the immutable subject, both roots'
    `local.github_repos` carry the immutable entry alone, and the rec-3132 `IAMRoleReconcile` widening
    reverted in the same operator bootstrap apply. See
    `docs/plans/PLAN-oidc-trust-contraction-closure.yaml`."
  - >-
    FOLLOW-ON REC to file during implementation (decision-scout Decision 163 spirit flag): a temporary
    IAM grant currently expresses its end condition only as an HCL comment, which is exactly why this
    one outlived its event. The per-grant fix is in scope here (the IAMRoleReconcile pin test); the
    general class -- a machine-checkable expiry marker for any grant marked TEMPORARY -- is a separate
    design problem. Plan-critique's suggestion is worth carrying into that rec: the existing
    "# raise-approved: dec-NNN" marker grammar (Decision 165, validate_sloc_budget_raises) is a
    working precedent for a marker whose authorising reference is machine-verified, and may absorb
    this rather than needing a fresh mechanism.
  - >-
    MAIN DIVERGENCE -- config/agent/verification_registry/registry.yaml IS A HIGH-CHURN SHARED FILE,
    treat it as a standing rebase hazard rather than a one-off. Two consecutive main advances during
    this plan's authoring both touched it: 796bf7a (#918, decompose-test-plan-document; added 2 rows,
    repointed 11 dangling ones) and 2b9e320 (#919, class-d-enforcers-wave-2). Both are absorbed --
    this branch is rebased onto 2b9e320 -- but the implementing session MUST rebase onto origin/main
    at commit-flow time (AGENTS.md Git-ops: auto-rebase at commit-flow time, never at assessment
    time) and add BOTH graduated rows (oidc-trust-slug-immutable-only, iam-role-reconcile-scope-branch-pr-only) against the REBASED file, or the row lands
    against a stale registry and conflicts. Do NOT trust any SHA quoted here as current; re-check.
    Headroom re-measured post-#919: 5683 effective lines against the Decision 166 ceiling of 6000
    (317 spare), so the two added rows (~16 lines) need no budget raise. #918 also decomposed
    tests/test_plan_document.py into tests/roadmap/plan_document/ -- no scope overlap, but do not
    resurrect the old path.

