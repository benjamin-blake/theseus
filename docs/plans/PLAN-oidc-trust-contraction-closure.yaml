    expected: >-
      "redeploy-record-fresh-ok <sha8>" then "deploy-liveness-ok <timestamp>". The deploy record is
      the gate; the timestamp corroborates, allowing for IAM last-used reporting lag (step 3's retry
      window applies).
    fix_if: >-
      A stale deploy record means the second dispatch no-opped -- re-dispatch, do not proceed. A
