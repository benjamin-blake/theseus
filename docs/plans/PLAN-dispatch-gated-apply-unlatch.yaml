- step: 8
  phase: pre-deploy
  action: terraform/CLAUDE.md's recovery row routes by the deploy-paths rule and the file did not grow past its
    11450-byte prose budget; AGENTS.md's deployment-model clause points at the deploy-paths reconcile row and the
