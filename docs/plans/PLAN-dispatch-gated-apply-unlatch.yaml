    -q ''deploy-paths.yaml'' AGENTS.md && ! grep -q ''red/drift = run the one-input Reconcile action'' AGENTS.md
    && echo CLAUDEMD_OK'
  expected: Output carries `CLAUDEMD_OK`.
  fix_if: Size test fails -> shrink the row (the prose-budget check would fail --pre anyway); the old guard-verdict
