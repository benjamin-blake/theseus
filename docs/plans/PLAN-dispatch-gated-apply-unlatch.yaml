  command: 'test "$(wc -c < terraform/CLAUDE.md)" -le 11450 && grep -q ''deploy-paths.yaml'' terraform/CLAUDE.md
    && grep -q ''acknowledge-and-retry'' terraform/CLAUDE.md && ! grep -q ''guard-PASS: `terraform-apply-sandbox`
