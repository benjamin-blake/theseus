schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: dispatch-gated-apply-unlatch
intent: Make the acknowledge-and-retry dispatch TOTAL -- a guard-routed fresh plan at main HEAD now reaches the
  tf-gated-apply Environment through a sha256-verified run-scoped artifact instead of skipping the only job that
  could apply it -- so the red sandbox convergence record latched at e8332e9f clears via one dispatch and one approval;
  record the two-heal-verb routing rule (Reconcile heals AT the red commit; acknowledge-and-retry heals at HEAD)
  with the sequenced forward intent that the platform converges on ONE input-free head heal verb (rec-3568), the
  fix-forward model every mainstream declarative-delivery tool uses.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-dispatch-gated-apply-unlatch.yaml
phase: T2.47 (Recovery-path unification + routed-pending observability, DEP-10/11) -- this plan lands the DEP-10
  residual rec-2523/rec-2647/rec-2918 left open (the dispatch-vs-push deadlock). T2.47's status/criteria tension
  is rec-2920's to adjudicate; no status or criterion flip here.
scope:
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: '(1) gated-apply''s job-level `if` drops the `github.event_name == ''push''` conjunct (keeps always()
    && needs.apply-sandbox.result == ''success'' && needs.apply-sandbox.outputs.routed == ''true''); (2) apply-sandbox
    gains, mirroring reconcile.yml''s RECONCILE_FRESH_PLAN_ARTIFACT hand-off verbatim, an `upload_fresh_plan_sha256`
    EMIT step (1-line body) and an actions/upload-artifact@v4 step (name sandbox-fresh-plan-${{ github.run_id }},
    retention-days 1), both `if: success() && github.event_name == ''workflow_dispatch'' && steps.guard.outputs.routed
    == ''true''`, placed after the apply step and before the record write; job outputs fresh_plan_pending (steps.upload_fresh_plan_sha256.outcome
    == ''success''), fresh_plan_sha256, and artifact_sha (steps.artifact_sha.outputs.value); (3) gated-apply gains
    an actions/download-artifact@v4 step and a `verify_fresh_plan_sha256` VERIFY step (error text names SANDBOX_FRESH_PLAN_ARTIFACT),
    both `if: needs.apply-sandbox.outputs.fresh_plan_pending == ''true''`, placed BEFORE fetch_plan, whose `if`
    becomes `needs.apply-sandbox.outputs.fresh_plan_pending != ''true'' && github.event_name == ''push''` (mutually
    exclusive plan sources, and a saved plan.bin is NEVER fetched on a dispatch -- Decision 158''s reversal note:
    without a dispatch-side uploader the gated job would silently fall back to a saved plan the guard in this run
    never inspected); (4) gated-apply''s artifact_sha body shrinks to echo needs.apply-sandbox.outputs.artifact_sha
    -- the same content-addressed sha the plan was built against (PR head sha on push, github.sha on dispatch, which
    apply-sandbox''s skip-assert build dual-wrote to lambda-packages/<sha>/* in the same run, so mode: fetch resolves);
    (5) both best-effort wake steps take SHA from `${{ github.event_name == ''push'' && github.sha || github.event.inputs.acknowledge_red_commit
    }}` and apply-sandbox''s wake `if` admits a routed workflow_dispatch, pointing the approver at THIS run''s apply-sandbox
    plan + guard step logs; (6) the header comment''s T2.22 bullet and the acknowledge_red_commit input description
    name both heal verbs. NO change to the precondition, the guard, the review, the apply command, the record write''s
    inputs, the closed pre-apply-failure allow-list, or any existing inline body''s line count.'
- file: scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py
  action: Create
  purpose: 'Standing, registry-backed guard (rec-2918 part (c): recovery-workflow-topology generalised to the dispatch-reachable
    acknowledge-and-retry flow), asserted over the PARSED workflow via scripts.verify_ci_workflow._load, never a
    whole-file grep: (i) gated-apply `if` contains needs.apply-sandbox.outputs.routed == ''true'' and does NOT contain
    github.event_name == ''push''; (ii) gated-apply declares environment: tf-gated-apply, its `apply` step runs
    `terraform apply ... plan.bin`, and no step in the job runs `terraform plan`; (iii) apply-sandbox declares fresh_plan_pending
    (from steps.upload_fresh_plan_sha256.outcome), fresh_plan_sha256 and artifact_sha outputs; (iv) the upload-artifact
    step and upload_fresh_plan_sha256 are gated on workflow_dispatch AND guard routed; (v) gated-apply''s download-artifact
    and sha256 VERIFY steps are gated on fresh_plan_pending == ''true'' and fetch_plan on != ''true'' AND github.event_name
    == ''push''; (vi) gated-apply''s build-ducklake-artifacts step keeps mode fetch and reads needs.apply-sandbox.outputs.artifact_sha;
    (vii) both wake steps derive SHA from the acknowledge input. Declares registry.examined(<invariant count>, unit="topology_invariants")
    (Decision 170). Own module because scripts/verify_ci_workflow.py sits at exactly 500 SLOC (Decision 128: never
    raise; a new module beats a facade decomposition for one guard).'
- file: scripts/checks/ci_guards/_manifest.py
  action: Modify
  purpose: Entry(name="validate_dispatch_gated_apply_topology", module/attr split, pre=True, pre_globs on .github/workflows/terraform-apply-sandbox.yml,
    .github/workflows/reconcile.yml, scripts/checks/ci_guards/**, scripts/checks/_common.py, scripts/checks/registry.py,
    scripts/verify_ci_workflow.py; full_segment="full_after_lint") -- the validate_ci_rca_trigger entry's shape.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'Row `validate_dispatch_gated_apply_topology: environment` (totality precondition of the Priority-0 attribution
    path).'
- file: tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
  action: Create
  purpose: 'Mirror test (Decision 131): pass-path against the real on-disk workflow; LOAD-BEARING negative rebuilding
    the exact pre-fix shape (gated-apply `if` carrying `github.event_name == ''push''`); one negative per invariant
    (missing outputs, ungated upload, ungated download/verify, fetch_plan not mutually exclusive, environment dropped,
    a `terraform plan` smuggled into gated-apply, artifact_sha not consumed, wake SHA not derived from the ack input);
    registration assertion via registry.pre_sequence(); examined() count assertion.'
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: r3_workflows entries for the TWO new inline run bodies (".github/workflows/terraform-apply-sandbox.yml::apply-sandbox::upload_fresh_plan_sha256"
    and "...::gated-apply::verify_fresh_plan_sha256") at their exactly-measured counts, no raise markers; every
    existing terraform-apply-sandbox.yml entry keeps its ceiling (the gated-apply artifact_sha body shrinks below
    its 7).
- file: scripts/ops/drain_glue_orphan/_world.py
  action: Modify
  purpose: 'assert_workflow_invariants invariant (a) INVERTS to the post-fix topology: violation when gated-apply''s
    `if` STILL carries github.event_name == ''push'' (message: "(a) terraform-apply-sandbox.yml gated-apply is still
    push-gated; the dispatch-routed gated apply is unreachable"). Invariants (b)-(d) unchanged. Without the flip,
    the moment the workflow fix merges tests/ops/test_drain_glue_orphan.py::TestWorkflowInvariants::test_passes_against_real_committed_source
    fails the full tier and the remove/converge gates raise WorldMovedError; the close phase does not call the invariants,
    so it is unaffected. Decision 181 coverage story: this is a deliberate re-grounding of a world-model precondition
    authorized by the new Decision, and validate_dispatch_gated_apply_topology is the surface that enforces the
    successor assertion.'
- file: tests/ops/test_drain_glue_orphan.py
  action: Modify
  purpose: 'TestWorkflowInvariants: test_invariant_a_fails_when_gated_apply_loses_push_condition becomes test_invariant_a_fails_when_gated_apply_regains_push_condition
    (append " && github.event_name == ''push''" to the real `if`); test_passes_against_real_committed_source keeps
    passing against the post-fix file.'
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: 'axis_a.sandbox_gated_apply: state that the gated-apply job is reachable from BOTH the push path (saved
    plan.bin from S3, digest-verified) and the workflow_dispatch acknowledge-and-retry path (the fresh plan.bin
    the guard inspected, handed over as SANDBOX_FRESH_PLAN_ARTIFACT with symmetric sha256 EMIT/VERIFY -- Decision
    158 route (ii)''s pattern, so Decision 77 artifact identity holds on every route); plus an amendment_log entry
    (semantic_break false, change_class governance_note_add, summary naming PLAN-dispatch-gated-apply-unlatch and
    the Decision).'
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: 'speculative_plan_and_apply_the_saved_plan.workflow_dispatch_path: add the step ''A guard-ROUTED dispatch
    now reaches gated-apply (SANDBOX_FRESH_PLAN_ARTIFACT hand-off); plan_sha stays null on the dispatch path'';
    convergence_anchor.dispatch_ack_unlatch: the routed case is no longer a dead end; amendment_log entry.'
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: 'reconcile row gains the heal-verb SELECTION rule only (navigation, Decision 126/86 -- never apply-model
    content): red commit''s HCL still the desired state -> Reconcile (re-applies the reviewed plan or re-plans AT
    the red commit); the fix for the red failure merged AFTER the red commit -> acknowledge-and-retry dispatch (plans
    fresh at HEAD), with a pointer at environment-taxonomy.yaml axis_a.sandbox_gated_apply for what happens when
    the fresh plan is guard-routed (reachability lives ONLY there). admin_out_of_band.procedure gains the SPLIT-APPLY
    step (a fresh plan carrying actions the CI apply role cannot execute BY DESIGN -- Decision 180: inline-policy
    writes on PlatformDev or PlatformAdmin -- is applied by -target under agent_platform_admin FIRST, after the
    plan is presented and the human accepts; the governed path then carries the remainder; Decision 98 point 1 is
    the precedented shape); amendment_log entry.'
- file: terraform/CLAUDE.md
  action: Modify
  purpose: The 'Recover from a red convergence record' row is rewritten to the routing rule with a pointer at docs/contracts/deploy-paths.yaml
    (reconcile row) -- the file is AT its 11450-byte prose budget, so the edit must be net-non-growing (measure
    with wc -c before and after).
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Two append-only edits (Decision 177 dialect): (1) author the numbered Decision (next free number, re-checked
    at write time; 183 at planning time) recording the two-heal-verb model and the widened Environment reach on
    the dispatch path, amends [126, 178], body budgeted UNDER Decision 167''s 6,144-byte per-entry cap -- execution
    step 9 carries the mandated contents and the marker SANDBOX_FRESH_PLAN_ARTIFACT; (2) a dated `> **Update (date):**`
    annotation appended to Decision 178''s existing 2026-09-01 update, recording that clause 4''s drain vehicle
    moves from Reconcile''s guard-routed delete to the acknowledge-and-retry dispatch''s guard-routed delete (substance
    unchanged: github_ci_apply executes the destroy through the tf-gated-apply Environment, never state rm), pointing
    at the new Decision.'
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerate the derived index in the same commit as the Decision (never hand-edited).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'Three one-line dated progress_notes, no status or criterion flip anywhere (rec-2920 owns T2.47''s coherence
    adjudication; Status-Trusted-Never-Inferred): T2.47 -- this plan, the Decision number, rec-2918''s disposition,
    and that c1''s ''single Reconcile dispatch'' claim does not cover a red whose fix merged after the red commit;
    T2.48 -- the three admin split-applied IAM addresses recorded as an instance for c6''s widen-or-re-narrow review
    (Decision 144 residue paid by hand); T2.56 -- the terraform/CLAUDE.md recovery-row shrink to a pointer as an
    instance of c1''s relocation work.'
- file: config/agent/verification_registry/entries/dispatch-gated-apply-topology-guard-runs-in-pre-tier.yaml
  action: Create
  purpose: Graduation of VP step 1 (command_output_matches, expected PRE_TIER_OK) -- the shape of ci-rca-fetch-classification-guard-runs-in-pre-tier.yaml
    with guard_target scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py.
bundled_recommendations:
- rec-3522
- rec-3135
- rec-2918
followon_recs:
- rec-3400
- rec-3415
- rec-3568
infrastructure_dependencies:
- github_ci_apply GlueCatalog Sid live at BOTH IAM layers incl. the userDefinedFunction child ARN (terraform/bootstrap
  applied out-of-band 2026-09-01, PLAN-glue-delete-database-grant VP8) -- VP step 13 re-proves it live before the
  one approval is spent.
- PlatformAdmin AdminOps IAMFull (iam:*) authorizes the operator split-apply of aws_iam_role_policy.platform_dev_runtime
  and aws_iam_role_policy.platform_admin_datalake (VP step 12); the CI apply role can never write them (Decision
  180 clauses 2-3) and this plan never widens that.
- tf-gated-apply GitHub Environment with benjamin-blake as required reviewer; the OIDC trust already lists the environment
  sub (Decision 94), proven from a workflow_dispatch by reconcile.yml's gated-apply-reconcile job.
- actions/upload-artifact@v4 + actions/download-artifact@v4 within ONE run (workflow token only; no new IAM, no
  S3 write) -- the transport Decision 158 sanctioned for RECONCILE_FRESH_PLAN_ARTIFACT.
acceptance_criteria:
- validate_dispatch_gated_apply_topology is registered in the --pre tier, passes against the on-disk terraform-apply-sandbox.yml,
  and its mirror test's pre-fix negative (gated-apply `if` carrying github.event_name == 'push') fails the guard.
- A workflow_dispatch acknowledge-and-retry run whose fresh plan guard-BLOCKs produces a gated-apply job in status
  waiting (not skipped), and after approval that job applies the sha256-verified fresh plan.bin verbatim and writes
  the record.
- The sandbox convergence record reads status green with commit_sha equal to origin/main HEAD and run_id equal to
  the dispatch run that drained aws_glue_catalog_database.ops; the infra_error and pending_gated markers are gone;
  session preflight reports convergence_health green.
- docs/DECISIONS.md carries the numbered Decision (envelope significance numbered_decision) naming SANDBOX_FRESH_PLAN_ARTIFACT
  exactly once, and docs/decisions-index.json is regenerated in the same commit.
- rec-3522 and rec-3135 close via the Resolves trailer; rec-2918 reads status superseded with a resolution naming
  the Decision; rec-3415 and rec-3400 carry the updated contexts this plan writes (rec-3400 prefixed 'Deferred half
  of PLAN-dispatch-gated-apply-unlatch').
- scripts/verify_ci_workflow.py is unchanged; terraform/CLAUDE.md is not larger than 11450 bytes; no terraform/personal/**
  file is touched by this plan's PR.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new topology guard against the real on-disk workflow (every invariant in the scope row), and prove
    it is wired into the presubmit tier, not merely importable.
  command: bin/venv-python -c "from scripts.checks import registry; assert 'validate_dispatch_gated_apply_topology'
    in {s.name for s in registry.pre_sequence()}, 'not in pre_sequence'" && bin/venv-python -c "import scripts.checks.ci_guards.validate_dispatch_gated_apply_topology
    as m; failed=[]; m.validate_dispatch_gated_apply_topology(failed); assert not failed, failed; print('PRE_TIER_OK')"
  expected: Exit 0 and the output carries `PRE_TIER_OK`.
  fix_if: '''not in pre_sequence'' -> the _manifest.py Entry is missing or pre=False; a non-empty failed list names
    the violated invariant -> fix the WORKFLOW to the scope-row shape, never relax the guard.'
  hermetic: true
  graduation: graduate
  graduation_check_id: dispatch-gated-apply-topology-guard-runs-in-pre-tier
- step: 2
  phase: pre-deploy
  action: 'Run the mirror tests: pass-path against the real file, the LOAD-BEARING negative that rebuilds the exact
    pre-fix shape (gated-apply `if` carrying github.event_name == ''push''), and one negative per invariant.'
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py -q
  expected: All tests pass; the pre-fix-shape test asserts the guard appends its failure label.
  fix_if: A negative passes the guard -> that invariant is not really asserted; a positive fails -> the workflow
    edit diverged from the scope row.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The mirror test file already runs under the full tier's pytest; VP step 1 graduates
    the guard itself as a standing pre-tier check, and graduating its unit tests a second time would double-run
    identical evidence.
- step: 3
  phase: pre-deploy
  action: The drain tool's invariant (a) is INVERTED to the post-fix topology and the full invariant set passes
    against the committed tree -- the real-file test would otherwise fail the full tier, and the remove/converge
    gates (which call assert_workflow_invariants first) would raise WorldMovedError on the new shape.
  command: bin/venv-python -m pytest tests/ops/test_drain_glue_orphan.py -k TestWorkflowInvariants -q && bin/venv-python
    -c "from scripts.ops.drain_glue_orphan._world import _ROOT, assert_workflow_invariants; assert_workflow_invariants(_ROOT);
    print('INVARIANTS_OK')"
  expected: Tests pass and the output carries `INVARIANTS_OK`.
  fix_if: WorldMovedError naming (a) -> _world.py still asserts the push conjunct; naming (b)-(d) -> an unrelated
    invariant was disturbed, restore it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: assert_workflow_invariants already runs inside every drain phase and its tests run under
    the full tier; a registry copy would duplicate an existing operator-path gate.
- step: 4
  phase: pre-deploy
  action: 'Registration companions of the new check module: ci_rca_taxonomy totality, Decision 170 examined() accounting,
    and the graduated registry entry''s shape.'
  command: bin/venv-python -c "import scripts.checks.ci_guards.validate_ci_rca_taxonomy as t; f=[]; t.validate_ci_rca_taxonomy(f);
    assert not f, f" && bin/venv-python -c "import scripts.checks.hygiene.validate_check_accounting as a; f=[];
    a.validate_check_accounting(f); assert not f, f" && bin/venv-python -c "import yaml; e=yaml.safe_load(open('config/agent/verification_registry/entries/dispatch-gated-apply-topology-guard-runs-in-pre-tier.yaml'));
    assert e['check_id']=='dispatch-gated-apply-topology-guard-runs-in-pre-tier' and e['check_spec']['expected']=='PRE_TIER_OK'
    and e['guard_target']=='scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py', e" && echo COMPANIONS_OK
  expected: Output carries `COMPANIONS_OK`.
  fix_if: 'validate_ci_rca_taxonomy fails -> add the `validate_dispatch_gated_apply_topology: environment` row;
    validate_check_accounting fails -> the module lacks registry.examined(); the registry assertion fails -> the
    entry''s check_id, expected or guard_target is wrong.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Both validators are already standing checks in both tiers; the registry-entry shape
    assertion is a one-time authoring check with no regression meaning once the entry replays in CI.
- step: 5
  phase: pre-deploy
  action: 'Parsed-YAML proof of the hand-off wiring the guard''s own code could get wrong: apply-sandbox exports
    artifact_sha and fresh_plan_pending, gated-apply''s fetch-mode DuckLake step consumes artifact_sha (so a dispatch
    commit''s per-sha packages resolve), both wake steps derive SHA from the acknowledge input, and no `terraform
    plan` exists in gated-apply. Also: fetch_plan is gated on push AND not-pending, so a saved plan.bin is never
    fetched on a dispatch.'
  command: bin/venv-python -c "import yaml; d=yaml.safe_load(open('.github/workflows/terraform-apply-sandbox.yml'));
    j=d['jobs']; o=j['apply-sandbox']['outputs']; assert 'steps.artifact_sha.outputs.value' in str(o.get('artifact_sha','')),
    o; assert 'steps.upload_fresh_plan_sha256.outcome' in str(o.get('fresh_plan_pending','')), o; g=j['gated-apply']['steps'];
    b=next(s for s in g if str(s.get('uses','')).endswith('build-ducklake-artifacts')); assert b['with']['mode']=='fetch'
    and 'needs.apply-sandbox.outputs.artifact_sha' in str(b['with']['artifact-sha']), b['with']; w=[s for s in j['apply-sandbox']['steps']+g
    if 'wake' in str(s.get('name','')).lower()]; assert len(w)==2 and all('acknowledge_red_commit' in str(s.get('env',{}).get('SHA',''))
    for s in w), [s.get('env') for s in w]; assert 'terraform plan' not in ' '.join(str(s.get('run','')) for s in
    g); fp=next(s for s in g if s.get('id')=='fetch_plan'); assert "github.event_name == 'push'" in str(fp.get('if',''))
    and "fresh_plan_pending != 'true'" in str(fp.get('if','')), fp.get('if'); print('HANDOFF_OK')"
  expected: Output carries `HANDOFF_OK`.
  fix_if: AssertionError on o -> a job output is missing; on b['with'] -> gated-apply still re-resolves the PR head
    sha, which fails on a dispatch commit; on the wake envs -> the approver would be pointed at the wrong PR; the
    last assert -> a re-plan was smuggled into the gated job (Decision 77).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Every assertion here is also an invariant of validate_dispatch_gated_apply_topology
    (execution step 2), which VP step 1 graduates; a second registry row would pin the same YAML paths twice.
- step: 6
  phase: pre-deploy
  action: Both new inline run bodies carry r3_workflows baseline entries at their measured counts, no existing terraform-apply-sandbox.yml
    body grew past its ceiling, and the masked-errexit guard stays clean.
  command: bin/venv-python -c "import scripts.checks.ci_guards.validate_composite_action_shell_bodies as b; f=[];
    b.validate_composite_action_shell_bodies(f); assert not f, f" && bin/venv-python -c "import scripts.checks.ci_guards.validate_masked_errexit_steps
    as e; f=[]; e.validate_masked_errexit_steps(f); assert not f, f" && [ "$(grep -c 'terraform-apply-sandbox.yml::apply-sandbox::upload_fresh_plan_sha256\|terraform-apply-sandbox.yml::gated-apply::verify_fresh_plan_sha256'
    config/composite_action_body_baseline.yaml)" -eq 2 ] && echo BODIES_OK
  expected: Output carries `BODIES_OK`.
  fix_if: R3-workflow failure naming a new key -> register it at its measured count; naming an existing key -> an
    existing body grew, restore its size (never add a raise marker for this); errexit failure -> a new body declared
    continue-on-error, remove it.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_composite_action_shell_bodies and validate_masked_errexit_steps are already
    standing --pre checks; the key count only names the two entries they must now cover.
- step: 7
  phase: pre-deploy
  action: The three Class D contracts validate, each carries a dated amendment_log entry naming this plan, the taxonomy
    names the artifact hand-off, and the deploy-paths reconcile row carries the routing rule plus the admin split-apply
    step.
  command: 'bin/venv-python -c "import scripts.checks.iam_tf.validate_environment_taxonomy as m; f=[]; m.validate_environment_taxonomy(f);
    assert not f, f" && bin/venv-python -c "import scripts.checks.contracts.validate_terraform_cc_web_operations
    as m; f=[]; m.validate_terraform_cc_web_operations(f); assert not f, f" && for f in docs/contracts/environment-taxonomy.yaml
    docs/contracts/terraform-cc-web-operations.yaml; do grep -q ''PLAN-dispatch-gated-apply-unlatch'' "$f" || {
    echo "NO AMENDMENT ENTRY: $f"; exit 1; }; done && grep -q ''SANDBOX_FRESH_PLAN_ARTIFACT'' docs/contracts/environment-taxonomy.yaml
    && grep -q ''acknowledge-and-retry'' docs/contracts/deploy-paths.yaml && grep -qi ''split-apply'' docs/contracts/deploy-paths.yaml
    && grep -q ''PLAN-dispatch-gated-apply-unlatch'' docs/contracts/deploy-paths.yaml && echo CONTRACTS_OK'
  expected: Output carries `CONTRACTS_OK`.
  fix_if: A validator failure -> a referenced path or shape in the contract regressed; a missing amendment entry
    or literal -> the contract edit landed without its log row or routing text.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_environment_taxonomy and validate_terraform_cc_web_operations are standing
    checks; the greps pin plan-specific literals with no standing meaning after merge.
- step: 8
  phase: pre-deploy
  action: terraform/CLAUDE.md's recovery row routes by the deploy-paths rule and the file did not grow past its
    11450-byte prose budget.
  command: 'test "$(wc -c < terraform/CLAUDE.md)" -le 11450 && grep -q ''deploy-paths.yaml'' terraform/CLAUDE.md
    && grep -q ''acknowledge-and-retry'' terraform/CLAUDE.md && ! grep -q ''guard-PASS: `terraform-apply-sandbox`
    `workflow_dispatch` acknowledge-and-retry'' terraform/CLAUDE.md && echo CLAUDEMD_OK'
  expected: Output carries `CLAUDEMD_OK`.
  fix_if: Size test fails -> shrink the row (the prose-budget check would fail --pre anyway); the old guard-verdict
    split text survives -> the row was not rewritten.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The prose-budget check already guards the size; the text assertions pin this plan's
    wording and stop being a regression guard once the row is superseded.
- step: 9
  phase: pre-deploy
  action: The numbered Decision is on disk with the Decision 167 envelope (significance numbered_decision), names
    the artifact marker exactly once, stays under the 6,144-byte per-entry cap, Decision 178 carries the dated vehicle-change
    annotation, the derived index carries the new entry, and T2.47 gained its progress_note without a status flip.
  command: '[ "$(grep -cF ''SANDBOX_FRESH_PLAN_ARTIFACT'' docs/DECISIONS.md)" -eq 1 ] && hdr=$(awk ''/^## Decision
