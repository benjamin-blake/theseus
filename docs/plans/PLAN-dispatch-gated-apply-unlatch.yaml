    c in ci[k].get(''exit_criteria'',[]) if isinstance(c,dict)]==[c.get(''status'') for c in bi[k].get(''exit_criteria'',[])
    if isinstance(c,dict)] for k in (''T2.47'',''T2.48'',''T2.56'')); assert ok, ''note missing or a status/criterion
    flipped relative to origin/main''; print(''ROADMAP_OK'')" && echo DECISION_OK'
  expected: Output carries `DECISION_OK_` followed by the number, `INDEX_OK_` followed by the same number, `ROADMAP_OK`,
