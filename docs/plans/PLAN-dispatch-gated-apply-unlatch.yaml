  command: '[ "$(grep -cF ''SANDBOX_FRESH_PLAN_ARTIFACT'' docs/DECISIONS.md)" -eq 1 ] && hdr=$(awk ''/^## Decision
    [0-9]+:/{h=$0} index($0,"SANDBOX_FRESH_PLAN_ARTIFACT"){print h; exit}'' docs/DECISIONS.md); num=$(echo "$hdr"
    | grep -oE ''[0-9]+'' | head -1); awk -v n="$num" ''$0 ~ "^## Decision "n":"{f=1} f&&/^## Decision /&&$0 !~
    "^## Decision "n":"{exit} f'' docs/DECISIONS.md | grep -q ''value: numbered_decision'' && echo "DECISION_OK_$num"
    && [ "$(awk -v n="$num" ''$0 ~ "^## Decision "n":"{f=1} f&&/^## Decision /&&$0 !~ "^## Decision "n":"{exit}
    f'' docs/DECISIONS.md | wc -c)" -le 6144 ] && awk ''/^## Decision 178:/{f=1} f&&/^## Decision 177:/{exit} f''
    docs/DECISIONS.md | grep -q ''acknowledge-and-retry'' && awk ''/^## Decision 126:/{f=1} f&&/^## Decision 125:/{exit}
    f'' docs/DECISIONS.md | grep -q ''Amended by Decision'' && bin/venv-python -c "import json,re; idx=json.load(open(''docs/decisions-index.json''));
