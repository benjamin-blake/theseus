infrastructure_dependencies:
- github_ci_apply GlueCatalog Sid live at BOTH IAM layers incl. the userDefinedFunction child ARN (terraform/bootstrap
  applied out-of-band 2026-09-01, PLAN-glue-delete-database-grant VP8) -- VP step 13 re-proves it live before the
  one approval is spent.
- PlatformAdmin AdminOps IAMFull (iam:*) authorizes the operator split-apply of the two by-design CI-unexecutable
  writes, aws_iam_role_policy.platform_dev_runtime and aws_iam_role_policy.platform_admin_datalake, plus the aws_iam_role.platform_dev
  description reconcile that Terraform's -target pulls in as their dependency (VP step 12). The CI apply role can
  never write the two policies (Decision 180 clauses 2-3) and this plan never widens that; the role's metadata verbs
  ARE CI-executable (Decision 180 clause 2) and VP step 13's simulate proves that grant live even though the split-apply
  lands the reconcile first.
- tf-gated-apply GitHub Environment with benjamin-blake as required reviewer; the OIDC trust already lists the environment
  sub (Decision 94), proven from a workflow_dispatch by reconcile.yml's gated-apply-reconcile job.
- actions/upload-artifact@v4 + actions/download-artifact@v4 within ONE run (workflow token only; no new IAM, no
  S3 write) -- the transport Decision 158 sanctioned for RECONCILE_FRESH_PLAN_ARTIFACT.
- 'Lambda gating disposition (Decision 79 / CD.16): compute_affected_artifacts over this scope returns {''data-pipeline'':
  [''docs/ROADMAP-PLATFORM.yaml'']} solely because src/lambdas/data-pipeline/manifest.yaml packages the roadmap
  (rec-2910''s known over-inclusion); the edit is three progress_note strings, so NO build, deploy or smoke-test
  step is owed -- same disposition as PLAN-ambient-prose-contract-relocation.'
acceptance_criteria:
- validate_dispatch_gated_apply_topology is registered in the --pre tier, passes against the on-disk terraform-apply-sandbox.yml,
  and its mirror test's pre-fix negative (gated-apply `if` carrying github.event_name == 'push') fails the guard.
- A workflow_dispatch acknowledge-and-retry run whose fresh plan guard-BLOCKs produces a gated-apply job in status
  waiting (not skipped), and after approval that job applies the sha256-verified fresh plan.bin verbatim and writes
  the record.
- The sandbox convergence record reads status green with commit_sha equal to origin/main HEAD and run_id equal to
  the dispatch run that drained aws_glue_catalog_database.ops; the infra_error and pending_gated markers are gone;
  session preflight reports convergence_health green.
- docs/DECISIONS.md carries the numbered Decision (envelope significance numbered_decision) naming SANDBOX_FRESH_PLAN_ARTIFACT
  exactly once, and docs/decisions-index.json is regenerated in the same commit.
- rec-3522 and rec-3135 close via the Resolves trailer; rec-2918 reads status superseded with a resolution naming
  the Decision; rec-3415 and rec-3400 still carry the deferred-half contexts written at plan time (rec-3400 prefixed
  'Deferred half of PLAN-dispatch-gated-apply-unlatch').
- scripts/verify_ci_workflow.py is unchanged; terraform/CLAUDE.md is not larger than 11450 bytes; no terraform/personal/**
  file is touched by this plan's PR.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new topology guard against the real on-disk workflow (every invariant in the scope row), and prove
    it is wired into the presubmit tier, not merely importable.
  command: bin/venv-python -c "from scripts.checks import registry; assert 'validate_dispatch_gated_apply_topology'
    in {s.name for s in registry.pre_sequence()}, 'not in pre_sequence'" && bin/venv-python -c "import scripts.checks.ci_guards.validate_dispatch_gated_apply_topology
    as m; failed=[]; m.validate_dispatch_gated_apply_topology(failed); assert not failed, failed; print('PRE_TIER_OK')"
  expected: Exit 0 and the output carries `PRE_TIER_OK`.
  fix_if: '''not in pre_sequence'' -> the _manifest.py Entry is missing or pre=False; a non-empty failed list names
    the violated invariant -> fix the WORKFLOW to the scope-row shape, never relax the guard.'
  hermetic: true
  graduation: graduate
  graduation_check_id: dispatch-gated-apply-topology-guard-runs-in-pre-tier
- step: 2
  phase: pre-deploy
  action: 'Run the mirror tests: pass-path against the real file, the LOAD-BEARING negative that rebuilds the exact
    pre-fix shape (gated-apply `if` carrying github.event_name == ''push''), and one negative per invariant.'
  command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py -q
  expected: All tests pass; the pre-fix-shape test asserts the guard appends its failure label.
  fix_if: A negative passes the guard -> that invariant is not really asserted; a positive fails -> the workflow
    edit diverged from the scope row.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The mirror test file already runs under the full tier's pytest; VP step 1 graduates
    the guard itself as a standing pre-tier check, and graduating its unit tests a second time would double-run
    identical evidence.
- step: 3
  phase: pre-deploy
  action: The drain tool's invariant (a) is INVERTED to the post-fix topology and the full invariant set passes
    against the committed tree -- the real-file test would otherwise fail the full tier, and the remove/converge
    gates (which call assert_workflow_invariants first) would raise WorldMovedError on the new shape.
  command: bin/venv-python -m pytest tests/ops/test_drain_glue_orphan.py -k TestWorkflowInvariants -q && bin/venv-python
    -c "from scripts.ops.drain_glue_orphan._world import _ROOT, assert_workflow_invariants; assert_workflow_invariants(_ROOT);
    print('INVARIANTS_OK')"
  expected: Tests pass and the output carries `INVARIANTS_OK`.
  fix_if: WorldMovedError naming (a) -> _world.py still asserts the push conjunct; naming (b)-(d) -> an unrelated
    invariant was disturbed, restore it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: assert_workflow_invariants already runs inside every drain phase and its tests run under
    the full tier; a registry copy would duplicate an existing operator-path gate.
- step: 4
  phase: pre-deploy
  action: 'Registration companions of the new check module: ci_rca_taxonomy totality, Decision 170 examined() accounting,
    and the graduated registry entry''s shape.'
  command: bin/venv-python -c "import scripts.checks.ci_guards.validate_ci_rca_taxonomy as t; f=[]; t.validate_ci_rca_taxonomy(f);
    assert not f, f" && bin/venv-python -c "import scripts.checks.hygiene.validate_check_accounting as a; f=[];
    a.validate_check_accounting(f); assert not f, f" && bin/venv-python -c "import yaml; e=yaml.safe_load(open('config/agent/verification_registry/entries/dispatch-gated-apply-topology-guard-runs-in-pre-tier.yaml'));
    assert e['check_id']=='dispatch-gated-apply-topology-guard-runs-in-pre-tier' and e['check_spec']['expected']=='PRE_TIER_OK'
    and e['guard_target']=='scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py', e" && echo COMPANIONS_OK
  expected: Output carries `COMPANIONS_OK`.
  fix_if: 'validate_ci_rca_taxonomy fails -> add the `validate_dispatch_gated_apply_topology: environment` row;
    validate_check_accounting fails -> the module lacks registry.examined(); the registry assertion fails -> the
    entry''s check_id, expected or guard_target is wrong.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Both validators are already standing checks in both tiers; the registry-entry shape
    assertion is a one-time authoring check with no regression meaning once the entry replays in CI.
- step: 5
  phase: pre-deploy
  action: 'Parsed-YAML proof of the hand-off wiring the guard''s own code could get wrong: apply-sandbox exports
    artifact_sha and fresh_plan_pending, gated-apply''s artifact_sha step echoes the apply-sandbox artifact_sha
    output and its fetch-mode DuckLake step reads steps.artifact_sha.outputs.value (so a dispatch commit''s per-sha
    packages resolve through the allow-listed step), both wake steps derive SHA from the acknowledge input, and
    no `terraform plan` exists in gated-apply. Also: fetch_plan is gated on push AND not-pending, so a saved plan.bin
    is never fetched on a dispatch. Also: the write-convergence-record plan-sha-mode description no longer claims
    gated-apply is push-only.'
  command: bin/venv-python -c "import yaml; d=yaml.safe_load(open('.github/workflows/terraform-apply-sandbox.yml'));
    j=d['jobs']; o=j['apply-sandbox']['outputs']; assert 'steps.artifact_sha.outputs.value' in str(o.get('artifact_sha','')),
    o; assert 'steps.upload_fresh_plan_sha256.outcome' in str(o.get('fresh_plan_pending','')), o; g=j['gated-apply']['steps'];
    b=next(s for s in g if str(s.get('uses','')).endswith('build-ducklake-artifacts')); assert b['with']['mode']=='fetch'
    and 'steps.artifact_sha.outputs.value' in str(b['with']['artifact-sha']), b['with']; a=next(s for s in g if
    s.get('id')=='artifact_sha'); assert 'needs.apply-sandbox.outputs.artifact_sha' in str(a.get('run','')), a.get('run');
    w=[s for s in j['apply-sandbox']['steps']+g if 'wake' in str(s.get('name','')).lower()]; assert len(w)==2 and
    all('acknowledge_red_commit' in str(s.get('env',{}).get('SHA','')) for s in w), [s.get('env') for s in w]; assert
    'terraform plan' not in ' '.join(str(s.get('run','')) for s in g); fp=next(s for s in g if s.get('id')=='fetch_plan');
    c=str(fp.get('if','')); assert 'github.event_name == \x27push\x27' in c and 'fresh_plan_pending != \x27true\x27'
    in c, c; print('HANDOFF_OK')" && ! grep -q 'always true whenever gated-apply itself runs' .github/actions/write-convergence-record/action.yml
    && echo WCR_DESC_OK
  expected: Output carries `HANDOFF_OK` and `WCR_DESC_OK`.
  fix_if: AssertionError on o -> a job output is missing; on b['with'] -> the build step no longer reads the artifact_sha
    step; on a.get('run') -> the artifact_sha body still re-resolves the PR head sha, which fails on a dispatch
    commit; on the wake envs -> the approver would be pointed at the wrong PR; the last assert -> a re-plan was
    smuggled into the gated job (Decision 77).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Every workflow assertion here is also an invariant of validate_dispatch_gated_apply_topology
    (execution step 2), which VP step 1 graduates; the write-convergence-record description grep is a one-time authoring
    check. A second registry row would pin the same YAML paths twice.
- step: 6
  phase: pre-deploy
  action: 'Both new inline run bodies carry r3_workflows baseline entries at their measured counts, no existing
    terraform-apply-sandbox.yml body grew past its ceiling, and the masked-errexit guard stays clean. Also: validate_actions_evidence
    accepts the artifact inventory with the new upload''s row.'
  command: bin/venv-python -c "import scripts.checks.ci_guards.validate_composite_action_shell_bodies as b; f=[];
    b.validate_composite_action_shell_bodies(f); assert not f, f" && bin/venv-python -c "import scripts.checks.ci_guards.validate_masked_errexit_steps
    as e; f=[]; e.validate_masked_errexit_steps(f); assert not f, f" && [ "$(grep -c 'terraform-apply-sandbox.yml::apply-sandbox::upload_fresh_plan_sha256\|terraform-apply-sandbox.yml::gated-apply::verify_fresh_plan_sha256'
    config/composite_action_body_baseline.yaml)" -eq 2 ] && bin/venv-python -c "import scripts.checks.ci_guards.validate_actions_evidence
    as v; f=[]; v.validate_actions_evidence(f); assert not f, f" && echo BODIES_OK
  expected: Output carries `BODIES_OK`.
  fix_if: R3-workflow failure naming a new key -> register it at its measured count; naming an existing key -> an
    existing body grew, restore its size (never add a raise marker for this); errexit failure -> a new body declared
    continue-on-error, remove it. validate_actions_evidence 'inventory differs' -> add the github-actions-evidence.yaml
    row with the step's exact name.
  hermetic: true
