schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: dispatch-gated-apply-unlatch
intent: Make the acknowledge-and-retry dispatch TOTAL -- a guard-routed fresh plan at main HEAD now reaches the
  tf-gated-apply Environment through a sha256-verified run-scoped artifact instead of skipping the only job that
  could apply it -- so the red sandbox convergence record latched at e8332e9f clears via one dispatch and one approval;
  record the two-heal-verb routing rule (Reconcile heals AT the red commit; acknowledge-and-retry heals at HEAD)
  with the sequenced forward intent that the platform converges on ONE input-free head heal verb (rec-3568), the
  fix-forward model every mainstream declarative-delivery tool uses.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-dispatch-gated-apply-unlatch.yaml
phase: T2.47 (Recovery-path unification + routed-pending observability, DEP-10/11) -- this plan lands the DEP-10
  residual rec-2523/rec-2647/rec-2918 left open (the dispatch-vs-push deadlock). T2.47's status/criteria tension
  is rec-2920's to adjudicate; no status or criterion flip here.
scope:
- file: .github/workflows/terraform-apply-sandbox.yml
  action: Modify
  purpose: '(1) gated-apply''s job-level `if` drops the `github.event_name == ''push''` conjunct (keeps always()
    && needs.apply-sandbox.result == ''success'' && needs.apply-sandbox.outputs.routed == ''true''); (2) apply-sandbox
    gains, mirroring reconcile.yml''s RECONCILE_FRESH_PLAN_ARTIFACT hand-off verbatim, an `upload_fresh_plan_sha256`
    EMIT step (1-line body) and an actions/upload-artifact@v4 step named ''Upload fresh plan.bin as a run-scoped
    artifact (SANDBOX_FRESH_PLAN_ARTIFACT)'' (artifact sandbox-fresh-plan-${{ github.run_id }}, retention-days 2
    -- the ephemeral_handoff class maximum, giving the human approval two days before the hand-off expires), both
    `if: success() && github.event_name == ''workflow_dispatch'' && steps.guard.outputs.routed == ''true''`, placed
    after the apply step and before the record write; job outputs fresh_plan_pending (steps.upload_fresh_plan_sha256.outcome
    == ''success''), fresh_plan_sha256, and artifact_sha (steps.artifact_sha.outputs.value); (3) gated-apply gains
    an actions/download-artifact@v4 step and a `verify_fresh_plan_sha256` VERIFY step (error text names SANDBOX_FRESH_PLAN_ARTIFACT),
    both `if: needs.apply-sandbox.outputs.fresh_plan_pending == ''true''`, placed BEFORE fetch_plan, whose `if`
    becomes `needs.apply-sandbox.outputs.fresh_plan_pending != ''true'' && github.event_name == ''push''` (mutually
    exclusive plan sources, and a saved plan.bin is NEVER fetched on a dispatch -- Decision 158''s reversal note:
    without a dispatch-side uploader the gated job would silently fall back to a saved plan the guard in this run
    never inspected); (4) gated-apply''s artifact_sha body shrinks to echo needs.apply-sandbox.outputs.artifact_sha
    -- the same content-addressed sha the plan was built against (PR head sha on push, github.sha on dispatch, which
    apply-sandbox''s skip-assert build dual-wrote to lambda-packages/<sha>/* in the same run, so mode: fetch resolves);
    (5) both best-effort wake steps take SHA from `${{ github.event_name == ''push'' && github.sha || github.event.inputs.acknowledge_red_commit
    }}` and apply-sandbox''s wake `if` admits a routed workflow_dispatch, pointing the approver at THIS run''s apply-sandbox
    plan + guard step logs; (6) the header comment''s T2.22 bullet, the acknowledge_red_commit input description,
    AND the three job-level comments that would otherwise assert the gated job is push-only -- the gated-apply job
    header (''post-merge push ONLY'' / ''Triggered when ... push''), the gated artifact_sha comment (''This job
    is push-only ... so a PR always resolves''), and the gated apply comment (''the speculative-plan showed on the
    PR'') -- are rewritten to name both heal verbs (a live surface must not lie about the system, Decision 178 rationale;
    comments do not count toward R3 body ceilings). NO change to the precondition, the guard, the review, the apply
    command, the record write''s inputs, the closed pre-apply-failure allow-list, or any existing inline body''s
    line count.'
- file: scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py
  action: Create
  purpose: 'Standing, registry-backed guard (rec-2918 part (c): recovery-workflow-topology generalised to the dispatch-reachable
    acknowledge-and-retry flow), asserted over the PARSED workflow via scripts.verify_ci_workflow._load, never a
    whole-file grep: (i) gated-apply `if` contains needs.apply-sandbox.outputs.routed == ''true'' and does NOT contain
    github.event_name == ''push''; (ii) gated-apply declares environment: tf-gated-apply, its `apply` step runs
    `terraform apply ... plan.bin`, and no step in the job runs `terraform plan`; (iii) apply-sandbox declares fresh_plan_pending
    (from steps.upload_fresh_plan_sha256.outcome), fresh_plan_sha256 and artifact_sha outputs; (iv) the upload-artifact
    step and upload_fresh_plan_sha256 are gated on workflow_dispatch AND guard routed; (v) gated-apply''s download-artifact
    and sha256 VERIFY steps are gated on fresh_plan_pending == ''true'' and fetch_plan on != ''true'' AND github.event_name
    == ''push''; (vi) the artifact-sha chain: gated-apply''s artifact_sha step body echoes needs.apply-sandbox.outputs.artifact_sha
    and its build-ducklake-artifacts step keeps mode fetch reading steps.artifact_sha.outputs.value (so Decision
    154''s allow-listed artifact_sha step stays live, never vestigial); (vii) both wake steps derive SHA from the
    acknowledge input. Declares registry.examined(<invariant count>, unit="topology_invariants") (Decision 170).
    Own module because scripts/verify_ci_workflow.py sits at exactly 500 SLOC (Decision 128: never raise; a new
    module beats a facade decomposition for one guard).'
- file: scripts/checks/ci_guards/_manifest.py
  action: Modify
  purpose: Entry(name="validate_dispatch_gated_apply_topology", module/attr split, pre=True, pre_globs on .github/workflows/terraform-apply-sandbox.yml,
    .github/workflows/reconcile.yml, scripts/checks/ci_guards/**, scripts/checks/_common.py, scripts/checks/registry.py,
    scripts/verify_ci_workflow.py; full_segment="full_after_lint") -- the validate_ci_rca_trigger entry's shape.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'Row `validate_dispatch_gated_apply_topology: environment` (totality precondition of the Priority-0 attribution
    path).'
- file: tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
  action: Create
  purpose: 'Mirror test (Decision 131): pass-path against the real on-disk workflow; LOAD-BEARING negative rebuilding
    the exact pre-fix shape (gated-apply `if` carrying `github.event_name == ''push''`); one negative per invariant
    (missing outputs, ungated upload, ungated download/verify, fetch_plan not mutually exclusive, environment dropped,
    a `terraform plan` smuggled into gated-apply, artifact_sha not consumed, wake SHA not derived from the ack input);
    registration assertion via registry.pre_sequence(); examined() count assertion.'
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: r3_workflows entries for the TWO new inline run bodies (".github/workflows/terraform-apply-sandbox.yml::apply-sandbox::upload_fresh_plan_sha256"
    and "...::gated-apply::verify_fresh_plan_sha256") at their exactly-measured counts, no raise markers; every
    existing terraform-apply-sandbox.yml entry keeps its ceiling (the gated-apply artifact_sha body shrinks below
    its 7).
- file: scripts/ops/drain_glue_orphan/_world.py
  action: Modify
  purpose: 'assert_workflow_invariants invariant (a) INVERTS to the post-fix topology: violation when gated-apply''s
    `if` STILL carries github.event_name == ''push'' (message: "(a) terraform-apply-sandbox.yml gated-apply is still
    push-gated; the dispatch-routed gated apply is unreachable"). Invariants (b)-(d) unchanged. Without the flip,
    the moment the workflow fix merges tests/ops/test_drain_glue_orphan.py::TestWorkflowInvariants::test_passes_against_real_committed_source
    fails the full tier and the remove/converge gates raise WorldMovedError; the close phase does not call the invariants,
    so it is unaffected. Decision 181 coverage story: this is a deliberate re-grounding of a world-model precondition
    authorized by the new Decision, and validate_dispatch_gated_apply_topology is the surface that enforces the
    successor assertion.'
- file: tests/ops/test_drain_glue_orphan.py
  action: Modify
  purpose: 'TestWorkflowInvariants: test_invariant_a_fails_when_gated_apply_loses_push_condition becomes test_invariant_a_fails_when_gated_apply_regains_push_condition
    (append " && github.event_name == ''push''" to the real `if`); test_passes_against_real_committed_source keeps
    passing against the post-fix file.'
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: 'axis_a.sandbox_gated_apply: state that the gated-apply job is reachable from BOTH the push path (saved
    plan.bin from S3, digest-verified) and the workflow_dispatch acknowledge-and-retry path (the fresh plan.bin
    the guard inspected, handed over as SANDBOX_FRESH_PLAN_ARTIFACT with symmetric sha256 EMIT/VERIFY -- Decision
    158 route (ii)''s pattern, so Decision 77 artifact identity holds on every route); plus an amendment_log entry
    (semantic_break false, change_class governance_note_add, summary naming PLAN-dispatch-gated-apply-unlatch and
    the Decision).'
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: 'speculative_plan_and_apply_the_saved_plan.workflow_dispatch_path: add the step ''A guard-ROUTED dispatch
    now reaches gated-apply (SANDBOX_FRESH_PLAN_ARTIFACT hand-off); plan_sha stays null on the dispatch path'';
    convergence_anchor.dispatch_ack_unlatch: the routed case is no longer a dead end; amendment_log entry. The amendment_log
    entry also records that plan_sha stays null on the dispatch-routed gated apply (event-gated mode kept, fail-closed).'
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: 'reconcile row gains the heal-verb SELECTION rule only (navigation, Decision 126/86 -- never apply-model
    content): red commit''s HCL still the desired state -> Reconcile (re-applies the reviewed plan or re-plans AT
    the red commit); the fix for the red failure merged AFTER the red commit -> acknowledge-and-retry dispatch (plans
    fresh at HEAD), with a pointer at environment-taxonomy.yaml axis_a.sandbox_gated_apply for what happens when
    the fresh plan is guard-routed (reachability lives ONLY there). admin_out_of_band.procedure gains the SPLIT-APPLY
    step (a fresh plan carrying actions the CI apply role cannot execute BY DESIGN -- Decision 180: inline-policy
    writes on PlatformDev or PlatformAdmin -- is applied by -target under agent_platform_admin FIRST, after the
    plan is presented and the human accepts; the governed path then carries the remainder; Decision 98 point 1 is
