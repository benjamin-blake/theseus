    src, re.M); assert m, ''marker not under a Decision header''; n=int(m.group(1)); s=json.dumps(idx); assert (''dec-%d''
    % n) in s or (''\"number\": %d'' % n) in s or (''Decision %d'' % n) in s, n; print(''INDEX_OK_%d'' % n)" &&
    bin/venv-python -c "import yaml,subprocess; cur=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); base=yaml.safe_load(subprocess.check_output([''git'',''show'',''origin/main:docs/ROADMAP-PLATFORM.yaml'']));
    ci={i[''id'']:i for i in cur[''tier_items'']}; bi={i[''id'']:i for i in base[''tier_items'']}; ok=all(''dispatch-gated-apply-unlatch''
