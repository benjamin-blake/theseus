constraints:
- 'Decision 77 no-TOCTOU on every route: the gated job applies the SAME plan.bin the guard inspected -- on push
  the digest-verified saved plan.bin, on dispatch the run-scoped artifact whose sha256 was EMITTED by apply-sandbox
  and VERIFIED before apply. NEVER add a terraform plan to gated-apply, never apply an unverified artifact.'
- 'Decision 92: `environment: tf-gated-apply` stays the SOLE authorization boundary for a routed plan; no second
  approval mechanism, no bypass on dispatch, and the apply-sandbox precondition''s push refusal is untouched.'
- 'Decision 154: the closed pre-apply-failure allow-list {artifact_sha, tfvars, tf_init, build_ducklake, fetch_plan}
  is NOT widened -- the artifact download/verify steps stay outside it (a same-run artifact failure latches red,
  fail-closed), exactly as gated-apply-reconcile already does.'
- Decision 158's Reconcile route set and the recovery-workflow-topology guard are untouched; this plan widens the
  acknowledge-and-retry path and never edits reconcile.yml.
- 'Decision 180 clauses 2-3 are permanent: never widen any CI-writable IAM Resource pattern to PlatformAdmin, or
  PutRolePolicy to PlatformDev, to avoid the operator split-apply. The split is the design; VP step 12 is the operator-only
  admin tier (Decision 126), executed only after the plan is presented and the human explicitly accepts.'
- 'Decision 128: scripts/verify_ci_workflow.py is at exactly 500 SLOC -- do not touch it; the new guard is its own
  module under scripts/checks/ci_guards/ (no raise, no facade needed).'
- 'Decision 162 r3 ceilings: no existing inline body in terraform-apply-sandbox.yml may grow past its config/composite_action_body_baseline.yaml
  entry; new bodies get r3_workflows entries at exactly-measured counts and NO raise-approved marker. New steps
  never declare continue-on-error.'
- No terraform/personal/** file is edited by this plan (a merge touching that path triggers a push apply the red
  latch refuses); the lock-file null block and the wrong main.tf drain comment are rec-3400's deferred half, landed
  AFTER the record is green.
- 'terraform/CLAUDE.md is at its 11450-byte prose budget: the recovery-row rewrite must be net-non-growing (measure
  with wc -c before and after).'
- 'Decision 119: no local terraform init/validate/plan for terraform/personal from CC-web; CI is the verifier. VP
  step 12 is the documented exception -- an ADMIN container with the Decision 120 mirror, operator-directed.'
- 'Decision 126 / AGENTS.md: agents never self-direct a terraform apply. The dispatch in VP step 14 is a governed-channel
  trigger, not an apply; the approval in VP step 15 is human-only.'
- No rescue agents or workaround loops (Decision 55); never weaken, skip or quarantine a check to get green (Decision
  181); never terraform state rm the orphan (the Decision 178 update of 2026-09-01 chose the gated-apply branch).
- 'Single Portal Invariant: every rec write (rec-2918 supersession, rec-3135 acceptance update, rec-3415/rec-3400
  context updates, the two new follow-on recs) goes through scripts.ops_data_portal; call get_rec_write_guidance()
  before file_rec().'
- 'Decision 165: no budget raise anywhere; Decision 167: the Decision entry carries the yaml envelope with significance.value
  numbered_decision and a justification naming the rejected contract-first alternative.'
- 'Concurrency: the shared push/dispatch group is kept; an abandoned Environment approval must be rejected in the
  GitHub Actions UI to release the queue (never cancelled by a second dispatch).'
- 'Hermetic VP steps run under /bin/sh with a 30s budget (validate_vp_replay): keep them POSIX-sh and fast; pytest
  and the validate tiers stay hermetic: false.'
- 'Decision 167 clause 3: the new Decision entry must measure under 6,144 bytes -- derivation detail, run ids and
  the operator sequence go to the three contracts'' amendment_log entries and the PR body, never to the Decision
  body; never raise the cap.'
- 'Decision 177: Decisions 126, 158 and 178 are amended ONLY by dated annotations or by the new entry''s amends/Related
  -- no in-place body edit of any prior entry.'
- 'Decision 103: rec-2918''s move to superseded is a governed lifecycle verdict -- the human confirmed it at plan
  time (Step 6b, 2026-09-04) and the update_rec resolution carries the new Decision''s id as the recorded proof.'
- 'Decision 126 / Decision 86: deploy-paths.yaml carries heal-verb SELECTION only; every statement about what a
  guard-routed dispatch reaches lives solely in environment-taxonomy.yaml.'
- 'The consolidation toward one input-free head verb is rec-3568''s job: this plan never edits reconcile.yml or
  Decision 158''s route set.'
