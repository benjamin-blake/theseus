  (existing), artifact_sha: ${{ steps.artifact_sha.outputs.value }}, fresh_plan_pending: ${{ steps.upload_fresh_plan_sha256.outcome
  == ''success'' }}, fresh_plan_sha256: ${{ steps.upload_fresh_plan_sha256.outputs.sha256 }}. New apply-sandbox
  steps go immediately after the `apply` step and before the record write, both `if: success() && github.event_name
  == ''workflow_dispatch'' && steps.guard.outputs.routed == ''true''`; EMIT body: echo "sha256=$(sha256sum ${{ env.WORKDIR
  }}/plan.bin | cut -d'' '' -f1)" >> "$GITHUB_OUTPUT"; upload: a step named exactly ''Upload fresh plan.bin as a
  run-scoped artifact (SANDBOX_FRESH_PLAN_ARTIFACT)'' using actions/upload-artifact@v4 with name sandbox-fresh-plan-${{
  github.run_id }}, path ${{ env.WORKDIR }}/plan.bin, retention-days 2 (github-actions-evidence.yaml keys the inventory
  on the step NAME). gated-apply: `if` becomes always() && needs.apply-sandbox.result == ''success'' && needs.apply-sandbox.outputs.routed
  == ''true''; replace the artifact_sha body with echo "value=${{ needs.apply-sandbox.outputs.artifact_sha }}" >>
  "$GITHUB_OUTPUT" (keep id artifact_sha); insert, before fetch_plan, an actions/download-artifact@v4 step (name
  sandbox-fresh-plan-${{ github.run_id }}, path ${{ env.WORKDIR }}, if fresh_plan_pending == ''true'') and a `verify_fresh_plan_sha256`
  step (same if; set -euo pipefail; ACTUAL=$(sha256sum plan.bin | cut -d'' '' -f1); on mismatch ::error::SANDBOX_FRESH_PLAN_ARTIFACT
  sha256 mismatch: expected X, got Y. Refusing to apply a possibly-corrupted plan. then exit 1; else echo verified);
  fetch_plan gets `if: needs.apply-sandbox.outputs.fresh_plan_pending != ''true'' && github.event_name == ''push''`.
  Wake steps: SHA env `${{ github.event_name == ''push'' && github.sha || github.event.inputs.acknowledge_red_commit
  }}` in both jobs; apply-sandbox''s wake `if` becomes always() && steps.precond.outputs.refused != ''true'' &&
