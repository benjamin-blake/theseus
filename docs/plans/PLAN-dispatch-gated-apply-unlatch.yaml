- file: terraform/CLAUDE.md
  action: Modify
  purpose: The 'Recover from a red convergence record' row is rewritten to the routing rule with a pointer at docs/contracts/deploy-paths.yaml
    (reconcile row) -- the file is AT its 11450-byte prose budget, so the edit must be net-non-growing (measure
