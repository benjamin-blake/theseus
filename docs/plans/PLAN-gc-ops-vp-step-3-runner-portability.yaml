pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Amend docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml verification_plan step 3 --
  `command` to the canonical-order POSIX grep form, `action` and `fix_if` to record the
  substitution, the parity evidence, the POSIXLY_CORRECT argument-order hazard and the Decision 189
  disposition. Touch no other field and no other step.
- >-
  Create config/agent/verification_registry/entries/no-hermetic-vp-step-shells-out-to-ripgrep.yaml
  with check_spec.command byte-identical to VP step 1's command.
- >-
  Call the ops portal update_rec on rec-3767, setting `acceptance` to the amended step 3 command
