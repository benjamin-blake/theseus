- >-
  Stranded PR: benjamin-blake/theseus#1206 (head f9768fdb), failing check pr-validate, run
  35271994638; the only failure is `vp-replay ...:3 actual=exit 127` from `rg: not found`.
- >-
  Act-one precedent for this exact plan: #1205 (f9bab137) amended the same plan's step 8 as its own
  reviewed PR. Procedure:
  docs/contracts/implement-scope-boundary.yaml#sanction_rows.implementing_plan_bookkeeping.amendment_procedure.
- >-
  Mechanically confirmed DEFER: validate_scope_boundary and validate_vp_replay's implement leg both
