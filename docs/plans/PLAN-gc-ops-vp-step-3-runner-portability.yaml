  Decision-scout verdict FLAGS_FOUND; CITE list: Decision 148 (amended by 189), Decision 55,
  Decision 73, Decision 84, Decision 103. Decisions triaged: 146 of 146. Roadmap items
  intersected: 0; CONFLICT: 0; RELATED: 0.
- 'gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)'
- >-
  Scout flags dispositioned: Decision 181 [WARN] -> discharged mechanically by VP step 3, with the
