- 'Report: what was implemented, verification results.'
work_areas: []
rollback: >-
  Revert the single squash commit. The parent plan returns to its rg command, #1206 returns to its
  stranded state, and the shard is removed from the registry; no production, infrastructure or
  warehouse state is touched by this plan. The two portal updates are field edits on open recs and
