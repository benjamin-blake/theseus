constraints:
  - >-
    SCOPE BOUNDARY. Registration closure only - obligations derivable structurally from a plan's
    scope rows. Rules needing semantic judgement or session runtime state are OUT (see Context). The
    two executing legs are a separate follow-on plan.
  - >-
    THE SIX REGISTRATION SURFACES, homed ONCE in scripts/checks/registry.py's docstring:
    (1) the check module under scripts/checks/<domain>/; (2) its @register(...) decoration;
    (3) an Entry literal in that domain's _manifest.py; (4) a config/ci_rca_taxonomy.yaml
    function_to_category row; (5) a config/agent/verification_registry/registry.yaml row per
    GRADUATED VP step (not per check); (6) the mirror test at tests/<mirrored>/test_<module>.py.
    A check in a NEW domain additionally requires four registry.py aggregation edits - which is why
    this plan uses the roadmap domain. scripts/CLAUDE.md POINTS at this list; it does not restate it.
  - >-
    GRANDFATHERING (blocking). Evaluate only plans that are NET-NEW in the diff (git status A) AND
    schema_version >= 4 AND plan_type IMPLEMENTATION. Measured: 65 of 329 existing plans create a
    check while omitting an obligated row, 7 of them at v4. validate_plan_documents:78 sets the
    precedent with exactly this shape of floor.
  - >-
    NO DELEGATION TO validate_plan_documents (blocking). Its only seam is a directory and it globs
    the whole corpus (measured 6.24 s per call), which would make the never-globs criterion false by
    construction and duplicate a sequenced run. If a delegate is needed, use
    validate_graduation_completeness, which has a changed_files seam and costs 0.06 s.
  - >-
    EXCEPTION CONTAINMENT (blocking). scripts/checks/validation_result.py calls fn(failed) with no
    try/except: an unhandled raise aborts the whole tier and skips write_completed_visible,
    destroying CI-RCA's attribution substrate. A missing or malformed contract must produce a
    reported failure, never an exception. Note the rollback order removes the contract last, so a
    partial rollback exercises exactly this path.
  - >-
    EVALUATOR RESOLUTION IS ONE HOP, and the import must be MODULE-LEVEL. The contract basename must
    appear in executable code in scripts/roadmap/plan_obligations.py - docstrings, comments and
    deferred (function-local) imports are all excluded by _population.one_hop_scripts_imports.
  - >-
    FIXTURES ARE INLINE. Step 1 and step 2 build plan dicts in memory, not by reading a file from
    docs/plans/. Reading this plan off disk would make the graduated row FAIL in the origin/main
    admission worktree for the wrong reason (the file does not exist there) and would break again
    when the RS-07 lagged archive sweep moves .yaml plans. Fixture filenames must match their own
    slug - plan_document rejects a mismatch. The plan_paths seam accepts absolute paths unfiltered.
  - >-
    PROSE DIRECTION, WITH BYTE CEILINGS. scripts/CLAUDE.md must end SMALLER than origin/main (2938 B)
    and within its 2984 B budget. Remove lines 40-41 (measured exactly 196 B - the dispatch paragraph,
    duplicated in registry.py's docstring and check-manifest.yaml) and add a replacement of AT MOST
    120 B, giving a net reduction of at least 76 B. Suggested verbatim pointer (73 B):
    "Dispatch and the full registration-surface list: see `scripts/checks/registry.py`." Lines 42-43
    hold the file's only mirror-test sentence and must survive untouched. Do NOT attempt to name the
    three surfaces here - a sentence naming them with paths measures ~259 B and cannot fit; the
    enumeration lives in registry.py's docstring, which is SLOC-governed rather than
    prose-byte-governed. A budget raise is forbidden (Decision 166) and gated by
    scripts/checks/prose/prose_budget_raises.py.
  - >-
    REGISTRY RESTRAINT. config/agent/verification_registry/registry.yaml is 5,040 lines against a
    CALIBRATED 6,000 ceiling whose pre-commitment is CD.29 archival, never a raise. Graduate only
    steps whose claim no live gate already covers; waive the rest with the reason stated.
  - >-
    VERIFICATION REGISTRY ROW SHAPE. check_id, primitive_slot, guard_target, guard_symbol, plan_slug,
    graduated_at, graduated_by, check_spec. A pytest row uses check_spec.node_id; a command row uses
    an argv LIST with UNESCAPED Python source - the \" in this YAML are shell escapes and raise
    SyntaxError under shell=False. Test each argv row standalone.
  - >-
    The obligation report is ADVISORY to the plan-critique gate. Decision 132 limitation A rules
    graduation-classification correctness a human/plan-critique call, never mechanized.
  - Test files colocate per the Decision 131 mirror rule with strict per-module naming.
  - No rescue agents or workaround loops (Decision 55)
  - No emojis; ASCII hyphens only; ruff formatting at line length 127
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND, 121 of 121 triaged.
    CITE: dec-168, dec-152, dec-165, dec-150, dec-167, dec-132, dec-87, dec-104, dec-85, dec-55,
    dec-86, dec-127. CONTRADICT: dec-128 [WARN], dec-148 [WARN], dec-163 [WARN], dec-87 [NOTE],
    dec-165 [NOTE]. SPIRIT: dec-166 [WARN], dec-43 [NOTE]. RELATED: dec-135, dec-131, dec-118,
    dec-142, dec-105 (inert), dec-90, dec-169 (#883, per-domain manifests, amends dec-104)."
  - >-
    "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE round 1, then four 4-lens zero-context
    panels (governance / adversarial-risk / implementation-feasibility / verification-quality):
    BLOCK+3xREVISE, BLOCK+3xREVISE, 4xREVISE, then 4xREVISE with one one-line blocker."
  - >-
    NO NUMBERED DECISION. Earlier drafts minted one, on the reasoning that a gate-contract change
    clears decision-entry.yaml's three-question rule. After the split removed
    .claude/skills/planning/SKILL.md from scope, that reasoning was never re-derived - and does not
    survive re-derivation. What remains is mechanism (a check plus its contract) and Layer-3 workflow
    wiring, which routes to the owning contract per the field_semantics row, not to a numbered entry.
    The contract therefore lands at provisional_v0 with a re_ratification_trigger, which requires no
    ratified_via. This also ends the numbering race that already cost this plan Decision 169.
  - >-
    SPLIT RATIONALE. Across one single-critic round and four four-lens panels, finding origin never
    shifted: registration closure drew zero blockers; the executing legs drew five (inverse pass
    condition to validate_vp_replay over the same command set; a self-wedge on declared-tautology
    steps; unbounded execution; a push-context inversion - `git log origin/main..HEAD` is empty ON
    main - that would redden main on every implement merge; and widening plan-authored shell
    execution into the OIDC-credentialed full-tier job). Operator confirmed the split.
  - >-
    TWO SEMANTIC RULES CUT, recorded so they are not re-attempted. `## Closure Obligation` triggers
    on a plan "fixing one or more OPEN recommendations" - semantic on both halves, and rec openness
    is unavailable in the gate (the cache is gitignored; pr-validate is creds-free). A textual
    approximation matches 135 of 329 plans. `## Related-Work Check` triggers on
    ci_rca_unresolved_recs, a preflight field absent from the plan document. Both stay in
    planning/SKILL.md, which consequently leaves scope along with all prose-relocation arithmetic.
  - >-
    Corrected claims from earlier rounds, recorded so they are not reintroduced: function_to_category
    is a TOTAL function over registered checks (97 entries onto 6 categories), not a bijection.
    validate_vp_replay is pre-tier only. A verification-registry row is owed per graduated VP step,
    not per created check. validate_plan_documents globs the whole plans directory. scripts/CLAUDE.md's
    dispatch paragraph is 196 B (lines 40-41), not 312 - the larger span swallows the mirror-test
    sentence. scripts/roadmap/ - not the scripts root - is the declared home for plan tooling, so the
    earlier scripts_root_allowlist obligation was self-manufactured and is now gone.
  - >-
    Measured at authoring time, post-rebase onto bdd6387: docs/plans/ holds 329 plans;
    scripts/CLAUDE.md 2938/2984 with 2938 on origin/main; plan-critique/SKILL.md 16645/17156;
    verification registry 5,040 lines / 383 entries against a 6,000 ceiling; 65 existing plans would
    red without the grandfathering floor.
  - >-
    CROSS-PLAN COLLISION (implement-phase ordering, not a blocker). Two approved-but-unimplemented
    plans share scope files: PLAN-ci-rca-adjudication-guard (config/ci_rca_taxonomy.yaml,
    config/agent/verification_registry/registry.yaml) and PLAN-decision-corpus-currency
    (docs/contracts/decision-entry.yaml, config/prose_budgets.yaml). Both touch append-only surfaces;
    whichever implements second rebases onto the other's edits.
  - >-
    Rejected alternative: a typed implement-time escape hatch for validator-demanded companion edits.
    Rejected on the operator's ruling that a sanctioned bypass becomes the path of least resistance.
  - >-
    Follow-on work to file at implement time: (a) THE EXECUTING LEGS - step discrimination and
    selector vacuity - which must design a leg model against push context, the credentialed full-tier
    job and 300-plan sweep commits; (b) the general clause-to-check index against T2.54; (c) the
    gate-verdict recording surface; (d) empirical-claim provenance; (e) a statically-checkable
    successor to the Closure Obligation rule, if one exists.
