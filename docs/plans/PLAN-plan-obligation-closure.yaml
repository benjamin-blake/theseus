  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Re-read docs/contracts/check-manifest.yaml and contract-population.yaml's evaluator_kinds
  - Re-measure scripts/CLAUDE.md lines 40-41 before cutting
  - Confirm the contract's obligation map does not trip the Class D smuggling detector (a mapping
    whose leaves carry two or more of type/nullable/description/semantics/populated_by/dq_intent)
execution_steps:
  - >-
    Create scripts/roadmap/plan_obligations.py - the read-only engine plus advisory CLI. It reads the
    registration map from docs/contracts/plan-obligations.yaml with a MODULE-LEVEL import and the
    basename in executable position, derives the six surfaces from scope rows, applies the
    grandfathering floor, contains all exceptions, and exposes a plan_paths seam accepting absolute
    paths unfiltered. It does NOT delegate to validate_plan_documents.
  - >-
    Create scripts/checks/roadmap/validate_plan_scope_closure.py as a thin @register(...) delegate and
    add its Entry to scripts/checks/roadmap/_manifest.py (pre=True, pre_globs=("docs/plans/**",),
    full_segment="full_after_lint"). No registry.py aggregation edit.
  - >-
    Move the registration-surface enumeration into scripts/checks/registry.py's docstring; replace
    scripts/CLAUDE.md lines 40-41 with a one-line pointer to it, preserving lines 42-43.
  - >-
    Add the ci_rca_taxonomy row and the verification-registry rows for the graduate steps only
    (argv lists with UNESCAPED Python source).
  - >-
    Create docs/contracts/plan-obligations.yaml - Class D, provisional_v0 with a
    re_ratification_trigger, unique subject, evaluator {check: validate_plan_scope_closure},
    TOP-LEVEL amendment_log - and the file-router route whose topic equals the subject.
  - >-
    Wire .claude/commands/plan.md (Steps 4 and 6b invoke the query; the convergence escalation offers
    "split the plan") and .claude/skills/plan-critique/SKILL.md (consume the report; emit
    finding-origin attribution).
  - Create both mirror test modules with the strict per-module names.
  - >-
    File the five follow-on items named in Context via bin/venv-python -m scripts.ops_data_portal
    (call get_rec_write_guidance() first).
  - Execute Verification Plan - run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
