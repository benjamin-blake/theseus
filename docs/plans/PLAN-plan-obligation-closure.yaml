rollback: >-
  Additive except the scripts/CLAUDE.md paragraph swap. Roll back by deleting the Entry from
  scripts/checks/roadmap/_manifest.py first (the check stops being dispatched and sequenced), then
  the taxonomy row, the registry rows and the route, then the modules and the contract LAST - the
  check must tolerate its absence without raising, which step 4 asserts.
