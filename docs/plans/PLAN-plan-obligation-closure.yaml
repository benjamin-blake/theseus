schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-obligation-closure"
intent: >-
  Compute a plan's mechanically-derivable REGISTRATION obligations at authoring time instead of
  discovering them one plan-critique round at a time, so the fresh-context critic spends its
  judgement on adequacy and frame rather than on arithmetic the repo can already do.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-obligation-closure.yaml
phase: >-
  Platform governance / plan-loop control surface. Adjacent to T2.54 (clause-to-check index,
  not_started) but deliberately narrower: registration closure for NEW plan documents only.
scope:
  - file: scripts/roadmap/plan_obligations.py
    action: Create
    purpose: >-
      Read-only registration-closure engine plus its advisory CLI. Lives in scripts/roadmap/ - the
      declared home for plan tooling (file-router.yaml topic roadmap-code), which RS-01 populated by
      moving six modules OUT of the scripts/ root. Root placement would reverse that migration and
      grow an allowlist RS-01 is shrinking. MUST import "plan-obligations.yaml" as a module-level
      executable string literal: evaluator resolution is one hop and excludes docstrings, comments
      and deferred imports.
  - file: scripts/checks/roadmap/validate_plan_scope_closure.py
    action: Create
    purpose: >-
      The single registered check, a thin delegate. Existing roadmap domain, so zero registry.py
      aggregation edits.
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      One Entry mirroring validate_plan_documents' shape - pre=True, pre_globs=("docs/plans/**",),
      full_segment="full_after_lint".
  - file: scripts/checks/registry.py
    action: Modify
    purpose: >-
      Module docstring becomes the SINGLE home for the registration-surface enumeration. Python, so
      governed by SLOC not prose bytes - which is what makes the enumeration affordable at all. The
      existing sentence "Adding a check touches ONLY this package ... scripts/validate.py is never
      touched" must be RETRACTED, not merely supplemented: three of the six surfaces sit outside the
      package, so appending the enumeration beneath that sentence ships a self-contradicting
      docstring that would still satisfy step 13.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Rows for the graduate-disposition steps only. Deliberately few: the registry is 5,040 lines
      against a calibrated 6,000 ceiling whose pre-commitment is CD.29 archival, never a raise.
  - file: docs/contracts/plan-obligations.yaml
    action: Create
    purpose: >-
      Class D contract holding ONLY the registration-surface map the check reads at check time.
      status provisional_v0 with a re_ratification_trigger - no numbered Decision is minted, so no
      ratified_via is required (contracts_schema.py:193). amendment_log is a TOP-LEVEL sibling.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: discovery route whose topic equals the contract's subject
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: consume the obligation report; emit finding-origin attribution (511 B headroom)
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Invoke the obligation query at Steps 4 and 6b; carry split-as-first-class in the convergence
      escalation. Layer 3 sequences the workflow; S3 is measured-only with no prose budget.
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: >-
      SHRINK, not grow: replace lines 40-41 (the 196 B dispatch paragraph) with a one-line pointer at
      registry.py's docstring, which now carries the full enumeration. Lines 42-43 MUST survive -
      they hold the file's only mirror-test sentence.
  - file: tests/test_plan_obligations.py
    action: Create
    purpose: mirror test for the engine (strict per-module naming, verified path)
  - file: tests/checks/roadmap/test_validate_plan_scope_closure.py
    action: Create
    purpose: mirror test for the check
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.roadmap.plan_obligations --plan <path>` prints a structured report
    and ALWAYS exits 0, including on a plan with unmet obligations. The check is the gate.
  - >-
    The check evaluates only NET-NEW plans (git status A) that are schema_version >= 4 and
    plan_type IMPLEMENTATION. 65 of 329 existing plans create a check while omitting an obligated
    row (7 at v4); without both filters, touching any of them reds --pre with no forward path.
    validate_plan_documents:78 sets the precedent.
  - >-
    The check never globs docs/plans/ - directly or transitively. It does NOT delegate to
    validate_plan_documents, whose only seam is a directory and which globs the whole corpus
    (measured 6.24 s per call).
  - >-
    Given a plan omitting the domain _manifest.py Entry, the ci_rca_taxonomy row, or the mirror test,
    the check names each omission by path; and given a closure-complete plan it returns ZERO findings.
  - >-
    The check reads its map from docs/contracts/plan-obligations.yaml at check time, holds no second
    copy, and NEVER raises - a missing or malformed contract yields a reported failure, not an
    exception. An unhandled raise aborts the whole tier and destroys CI-RCA's attribution substrate.
  - >-
    validate_plan_scope_closure resolves through manifest dispatch, is in both tier sequences, and
    has its own function_to_category row.
  - >-
    scripts/checks/registry.py's docstring enumerates all six registration surfaces;
    scripts/CLAUDE.md points at it and is SMALLER than on origin/main.
  - >-
    docs/contracts/plan-obligations.yaml is a valid Class D contract at provisional_v0 with a
    re_ratification_trigger, evaluator {check: validate_plan_scope_closure}, a TOP-LEVEL
    amendment_log, and a file-router route whose topic equals its subject.
  - >-
    The plan-document check family - validate_plan_documents, validate_graduation_completeness,
    validate_verification_registry, validate_handoff_full_tier, validate_test_coverage - returns zero
    failures.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      INDEPENDENT EVIDENCE - the check names every omitted surface on a synthetic plan, and returns
      zero findings on a complete one
    command: |-
      bin/venv-python -c "import yaml,tempfile,pathlib;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure as C;d=pathlib.Path(tempfile.mkdtemp());base={'schema_version':4,'plan_type':'IMPLEMENTATION','slug':'fixture-probe','plan_path':'docs/plans/PLAN-fixture-probe.yaml','scope':[{'file':'scripts/checks/roadmap/validate_x.py','action':'Create','purpose':'p'},{'file':'scripts/checks/roadmap/_manifest.py','action':'Modify','purpose':'p'},{'file':'config/ci_rca_taxonomy.yaml','action':'Modify','purpose':'p'},{'file':'tests/checks/roadmap/test_validate_x.py','action':'Create','purpose':'p'}]};good=d/'PLAN-fixture-probe.yaml';good.write_text(yaml.safe_dump(base));f=[];C(f,plan_paths=[good]);assert not f, f'positive control failed: {f}';miss=0
      for drop in ('scripts/checks/roadmap/_manifest.py','config/ci_rca_taxonomy.yaml','tests/checks/roadmap/test_validate_x.py'):
          bad=dict(base); bad['scope']=[r for r in base['scope'] if r['file']!=drop]; p=d/'PLAN-fixture-probe.yaml'; p.write_text(yaml.safe_dump(bad)); g=[]; C(g,plan_paths=[p]); assert g and any(drop in str(x) for x in g), f'not flagged: {drop} -> {g}'; miss+=1
      print(f'independent evidence ok: positive control clean, {miss}/3 omissions named')"
    expected: exit 0, prints independent evidence ok
    fix_if: >-
      positive control failure means the check flags a complete plan; a missing omission means the
      map is incomplete. The fixture is built from an INLINE dict, not read off disk, so it survives
      the origin/main admission differential (where this plan file does not exist) and the RS-07
      archive sweep. The filename matches its own slug because plan_document rejects a mismatch. The
      plan_paths seam MUST accept absolute paths unfiltered - do not re-filter through PLAN_PATH_RE.
    graduation: graduate
    graduation_check_id: plan-obligations-independent-evidence
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: INDEPENDENT - historical and sub-v4 plans are skipped, not flagged
    command: >-
      bin/venv-python -c "import yaml,tempfile,pathlib;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure as C;d=pathlib.Path(tempfile.mkdtemp());old={'schema_version':3,'plan_type':'IMPLEMENTATION','slug':'legacy-probe','plan_path':'docs/plans/PLAN-legacy-probe.yaml','scope':[{'file':'scripts/checks/roadmap/validate_y.py','action':'Create','purpose':'p'}]};p=d/'PLAN-legacy-probe.yaml';p.write_text(yaml.safe_dump(old));f=[];C(f,plan_paths=[p]);assert not f, f'sub-v4 plan flagged: {f}';print('grandfathering ok')"
    expected: exit 0, prints grandfathering ok
    fix_if: >-
      a sub-v4 plan is flagged - 65 of 329 existing plans would red. Gate on schema_version >= 4 AND
      plan_type IMPLEMENTATION (validate_plan_documents:78's precedent) AND net-new-in-diff.
    graduation: graduate
    graduation_check_id: plan-obligations-grandfathering
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: INDEPENDENT - the CLI is advisory and exits 0 on a plan with unmet obligations
    command: >-
      bash -c 'bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-plan-obligation-closure.yaml >/dev/null 2>&1; a=$?; H=$(git status --porcelain | md5sum); bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-plan-obligation-closure.yaml >/dev/null 2>&1; b=$?; A=$(git status --porcelain | md5sum); [ "$a" = "0" ] && [ "$b" = "0" ] || { echo "CLI exited non-zero ($a,$b) - it is a gate, not advisory"; exit 1; }; [ "$H" = "$A" ] || { echo "tree mutated"; exit 1; }; echo advisory ok'
    expected: exit 0, prints advisory ok
    fix_if: >-
      non-zero means the CLI became a gate, contradicting criterion 1; a mutated tree means it writes
      a cache or report file
    graduation: graduate
    graduation_check_id: plan-obligations-cli-advisory
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: INDEPENDENT - the check never falls back to a corpus glob, and never raises
    command: >-
      bin/venv-python -c "import time,tempfile,pathlib;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure as C;t=time.monotonic();f=[];C(f,plan_paths=[]);assert not f, f'empty plan_paths produced findings - it globbed: {f}';e=time.monotonic()-t;assert e<1.0, f'took {e:.2f}s on an empty path list - it globbed the corpus';g=[];C(g,plan_paths=[pathlib.Path(tempfile.mkdtemp())/'PLAN-absent.yaml']);print(f'no-glob ok ({e:.3f}s), missing file handled without raising')"
    expected: exit 0, prints no-glob ok
    fix_if: >-
      findings or a slow run on an empty list means it globs docs/plans/ (329 plans, 6.24 s via
      validate_plan_documents). An exception on an absent file means it is not exception-contained -
      validation_result.py calls fn(failed) with no try/except, so a raise aborts the tier and skips
      write_completed_visible, destroying CI-RCA attribution.
    graduation: graduate
    graduation_check_id: plan-obligations-no-glob-no-raise
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: INDEPENDENT - the contract is the source of truth, not a hardcoded copy
    command: >-
      bin/venv-python -c "import pathlib,re;src=pathlib.Path('scripts/roadmap/plan_obligations.py').read_text();body=re.sub(r'(?s)\"\"\".*?\"\"\"','',src);body=re.sub(r'(?m)^\s*#.*$','',body);assert 'plan-obligations.yaml' in body, 'contract basename absent from executable code - one-hop evaluator resolution will fail';assert not re.search(r'(?m)^\s+(import|from)\s+.*plan_obligations', src), 'deferred import breaks one-hop resolution';print('contract-as-sot ok')"
    expected: exit 0, prints contract-as-sot ok
    fix_if: >-
      the basename appears only in a docstring or comment - _population.one_hop_scripts_imports
      excludes both, so validate_contract_drift will fail evaluator resolution
    graduation: graduate
    graduation_check_id: plan-obligations-contract-as-sot
  - step: 6
    phase: pre-deploy
    hermetic: false
    action: Engine unit tests - closure derivation and CLI contract
    command: bin/venv-python -m pytest tests/test_plan_obligations.py -q
    expected: passes
    fix_if: see the module's own assertions
    graduation: waive
    graduation_waiver_reason: >-
      The behaviours this suite covers are already graduated as implementer-independent command steps
      1-5, which exercise shipped behaviour against fixtures no test body authors. A registry row
      here would pin a self-authored selector alongside stronger evidence for the same claims.
  - step: 7
    phase: pre-deploy
    hermetic: false
    action: Check unit tests - diff scoping and grandfathering
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_scope_closure.py -q
    expected: passes
    fix_if: see the module's own assertions
    graduation: waive
    graduation_waiver_reason: >-
      Same as step 6: steps 1, 2 and 4 graduate the same claims with fixture-based evidence
      independent of these test bodies. The mirror-test file is still obligatory (validate_test_
      coverage); only its registry row would be redundant.
  - step: 8
    phase: pre-deploy
    hermetic: true
    action: The check resolves through manifest dispatch and sits in both tier sequences
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    expected: exit 0, prints dispatch and both sequences ok
    fix_if: UnknownCheckError or assertion - add the Entry with pre=True and full_segment set
    graduation: waive
    graduation_waiver_reason: >-
      validate_check_manifests (both tiers) enforces Entry grammar and the parametrized
      tests/checks/roadmap/test__manifest.py covers this domain's entries, so a graduated row adds no
      coverage a live gate lacks. Retained as a VP step because it is the fastest signal to the
      implementer that the Entry is wrong.
  - step: 9
    phase: pre-deploy
    hermetic: true
    action: The check has a taxonomy row
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    expected: exit 0
    fix_if: assertion - add the function_to_category row
    graduation: waive
    graduation_waiver_reason: >-
      validate_ci_rca_taxonomy already enforces totality over every registered check in both tiers -
      a graduated row would duplicate a gate that fires on every run, and the registry is at 5,040 of
      a 6,000-line ceiling whose relief valve is archival, not growth.
  - step: 10
    phase: pre-deploy
    hermetic: true
    action: Both new modules satisfy the strict mirror-test naming rule
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import check_test_file_exists; bad=[(m,r) for m in ('scripts/roadmap/plan_obligations.py','scripts/checks/roadmap/validate_plan_scope_closure.py') for ok,r in [check_test_file_exists(Path(m))] if not ok]; assert not bad, bad; print('mirror tests ok')"
    expected: exit 0, prints mirror tests ok
    fix_if: a mirror is missing - validate_test_coverage is full-tier only, so an omission reds main
    graduation: waive
    graduation_waiver_reason: >-
      validate_test_coverage owns this rule in the full tier, and the assertion is pure file
      existence - satisfiable by two empty files, so it proves nothing a live gate does not.
  - step: 11
    phase: pre-deploy
    hermetic: true
    action: The contract has the Class D shape the schema requires
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'));c=d['contract'];assert c['class']=='D';assert c['status']=='provisional_v0';assert not c.get('ratified_via');assert c['evaluator'].get('check')=='validate_plan_scope_closure';assert 'amendment_log' in d and 'amendment_log' not in c;print('class D shape ok')"
    expected: exit 0, prints class D shape ok
    fix_if: >-
      shape failure - amendment_log is a TOP-LEVEL sibling and ContractMeta is extra=forbid.
      provisional_v0 requires no ratified_via but does require a re_ratification_trigger.
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift (both tiers) enforces Class D shape, evaluator resolution and the
      re_ratification_trigger. Step 12 covers the one thing it no-ops on.
  - step: 12
    phase: pre-deploy
    hermetic: true
    action: The file-router route exists and its topic equals the contract subject
    command: >-
      bin/venv-python -c "import yaml;r=yaml.safe_load(open('docs/contracts/file-router.yaml'));c=yaml.safe_load(open('docs/contracts/plan-obligations.yaml'))['contract'];hit=[x for x in r['routes'] if x.get('topic')==c['subject'] and 'docs/contracts/plan-obligations.yaml' in x.get('targets',[])];assert hit, 'no route binding topic to subject';print('route ok')"
    expected: exit 0, prints route ok
    fix_if: missing - check_topic_equals_subject NO-OPS on a missing route, so nothing else catches this
    graduation: graduate
    graduation_check_id: plan-obligations-router-route
  - step: 13
    phase: pre-deploy
    hermetic: true
    action: registry.py's docstring enumerates all six surfaces and scripts/CLAUDE.md shrank
    command: >-
      bash -c 'bin/venv-python -c "import re,pathlib,sys;d=re.search(r\"\\\"\\\"\\\"(.*?)\\\"\\\"\\\"\",pathlib.Path(\"scripts/checks/registry.py\").read_text(),re.S).group(1);miss=[s for s in (\"ci_rca_taxonomy\",\"verification_registry\",\"test_\") if s not in d];sys.exit(f\"registry.py docstring omits {miss}\" if miss else 0)" || exit 1; b=$(git show origin/main:scripts/CLAUDE.md | wc -c); a=$(wc -c < scripts/CLAUDE.md); [ "$a" -lt "$b" ] || { echo "scripts/CLAUDE.md did not shrink ($b -> $a)"; exit 1; }; grep -q "test__manifest.py" scripts/CLAUDE.md || { echo "mirror-test sentence was cut"; exit 1; }; echo "enumeration homed, CLAUDE.md shrank"'
    expected: exit 0, prints enumeration homed, CLAUDE.md shrank
    fix_if: >-
      the enumeration goes in registry.py's docstring (Python, SLOC-governed) - scripts/CLAUDE.md
      cannot afford it (46 B headroom against ~250-300 B of text) and must instead lose lines 40-41
      and gain only a pointer. Lines 42-43 carry the sole mirror-test sentence and must survive.
    graduation: graduate
    graduation_check_id: plan-obligations-enumeration-homed
  - step: 14
    phase: pre-deploy
    hermetic: true
    action: The critique skill invokes the obligation query and emits finding-origin attribution
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text();assert 'scripts.roadmap.plan_obligations' in t, 'critic does not invoke the obligation query';assert 'finding-origin attribution' in t.lower(), 'no finding-origin attribution in the output shape'"
    expected: exit 0
    fix_if: assertion - the critic still re-derives mechanical facts, or the output lacks the field
    graduation: graduate
    graduation_check_id: plan-obligations-critic-consumes-report
  - step: 15
    phase: pre-deploy
    hermetic: true
    action: The plan command invokes the query and offers split at the convergence cap
    command: >-
      bin/venv-python -c "import pathlib;t=pathlib.Path('.claude/commands/plan.md').read_text();assert 'scripts.roadmap.plan_obligations' in t, 'Steps 4/6b do not invoke the obligation query';assert 'split the plan' in t.lower(), 'convergence escalation lacks the split option'"
    expected: exit 0
    fix_if: >-
      assertion - the command file was not wired. The split assertion uses the phrase "split the
      plan" rather than the bare word, so it is not satisfiable by an incidental occurrence.
    graduation: graduate
    graduation_check_id: plan-obligations-command-wired
  - step: 16
    phase: pre-deploy
    hermetic: true
    action: The plan-document check family returns zero failures
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents; from scripts.checks.verification.validate_handoff_full_tier import validate_handoff_full_tier; from scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness; from scripts.checks.verification.validate_verification_registry import validate_verification_registry; f=[]; [fn(f) for fn in (validate_plan_documents, validate_handoff_full_tier, validate_graduation_completeness, validate_verification_registry)]; print(len(f)); assert not f, f"
    expected: exit 0, prints 0
    fix_if: a scope file lacks a test obligation, or a registry row is malformed
    graduation: waive
    graduation_waiver_reason: >-
      Measured tautological: exits 0 on the unchanged tree because the plan is already well-formed,
      so the added-entry differential would refuse the row. All four validators are themselves
      sequenced in both tiers.
  - step: 17
    phase: pre-deploy
    hermetic: false
    action: Fast tier is green
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails - fix forward; never disable a check to pass the tier
    graduation: not-applicable
  - step: 18
    phase: pre-deploy
    hermetic: false
    action: Full tier is green (handoff_policy obligation, Decision 163 / rec-2965)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: >-
      any check fails - fix forward. Required by handoff_policy, and the only tier running
      validate_test_coverage.
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/plan_obligations.py
    behavior: Derives the registration surfaces from scope rows and never raises on bad input.
    verification_step: 4
    command: >-
      bin/venv-python -c "import time,tempfile,pathlib;from scripts.checks.roadmap.validate_plan_scope_closure import validate_plan_scope_closure as C;t=time.monotonic();f=[];C(f,plan_paths=[]);assert not f, f'empty plan_paths produced findings - it globbed: {f}';e=time.monotonic()-t;assert e<1.0, f'took {e:.2f}s on an empty path list - it globbed the corpus';g=[];C(g,plan_paths=[pathlib.Path(tempfile.mkdtemp())/'PLAN-absent.yaml']);print(f'no-glob ok ({e:.3f}s), missing file handled without raising')"
    red_green_expectation: red before (module absent, ImportError), green after
  - source: scripts/checks/roadmap/validate_plan_scope_closure.py
    behavior: >-
      Names each omitted surface, returns zero findings on a complete plan, and applies the
      grandfathering floor. The stronger, implementer-independent evidence for the same claims is
      graduated at steps 1 and 2; this row links the mirror-test suite that validate_test_coverage
      separately obliges.
    verification_step: 7
    test_selector: tests/checks/roadmap/test_validate_plan_scope_closure.py::TestClosure
    red_green_expectation: red before (check absent), green after
  - source: scripts/checks/roadmap/_manifest.py
    behavior: Declares the check's Entry in both tiers.
    verification_step: 8
    command: >-
      bin/venv-python -c "from scripts.checks import registry; registry.resolve('validate_plan_scope_closure'); pre={s.name for s in registry.pre_sequence()}; full={s.name for s in registry.full_sequence()}; assert 'validate_plan_scope_closure' in pre, 'absent from --pre'; assert 'validate_plan_scope_closure' in full, 'absent from full'; print('dispatch and both sequences ok')"
    red_green_expectation: red before (UnknownCheckError), green after
  - source: scripts/checks/registry.py
    behavior: The docstring enumerates all six registration surfaces.
    verification_step: 13
    command: >-
      bash -c 'bin/venv-python -c "import re,pathlib,sys;d=re.search(r\"\\\"\\\"\\\"(.*?)\\\"\\\"\\\"\",pathlib.Path(\"scripts/checks/registry.py\").read_text(),re.S).group(1);miss=[s for s in (\"ci_rca_taxonomy\",\"verification_registry\",\"test_\") if s not in d];sys.exit(f\"registry.py docstring omits {miss}\" if miss else 0)" || exit 1; b=$(git show origin/main:scripts/CLAUDE.md | wc -c); a=$(wc -c < scripts/CLAUDE.md); [ "$a" -lt "$b" ] || { echo "scripts/CLAUDE.md did not shrink ($b -> $a)"; exit 1; }; grep -q "test__manifest.py" scripts/CLAUDE.md || { echo "mirror-test sentence was cut"; exit 1; }; echo "enumeration homed, CLAUDE.md shrank"'
    red_green_expectation: red before (docstring omits the surfaces), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check resolves to a category row.
    verification_step: 9
    command: >-
      bin/venv-python -c "import yaml;m=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert 'validate_plan_scope_closure' in m, 'unmapped check reds the fast tier'"
    red_green_expectation: red before (registered-but-unmapped once the check lands), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: Rows exist for the graduate-disposition steps.
    verification_step: 18
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
