    expected: "Exit 0; prints `red-case floor green over the decomposed mirrors`."
    fix_if: >-
      A non-empty `failed` naming either decomposed module means map_source_to_test still resolves a
      now-deleted file -- add the _CONCERN_SPLIT_TEST_PACKAGES entry. A manifest mirror failure means
      the new Entry or a paydown glob is malformed.
