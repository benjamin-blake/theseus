acceptance_criteria:
  - >-
    validate_pre_glob_closure reports ZERO findings on the live tree and its ADVISORY banner string
    is gone from the module. A synthetic repo whose check module imports an uncovered hub makes the
    check APPEND to `failed` (LSA-06 acceptance). Measured start state to beat: 292 findings across
    43 of 52 glob-gated --pre checks at 6b6df4dd.
  - >-
    The derived structural floor excludes a module whose AST body is empty or docstring-only and
    NOTHING else. Proven by a red case, not by construction: a module carrying a docstring plus ONE
    executable statement is still reported. The floor never removes a node from the import graph --
    it narrows only the glob-coverage obligation (Decision 135 point 2(i) keeps __init__.py facades
    as graph nodes), and it is keyed on the AST body, never on the filename being __init__.py.
  - >-
    The auditor's own Entry declares the union ("**/*.py", "scripts/checks/**") and CANNOT be
    narrowed below it: registry.pre_sequence() raises when that Entry's globs do not cover every
    tracked .py file. The raise names the MECHANISM, not a protected set, and introduces no
    per-check roster constant (Decision 187 points 1/2/6; Decision 169's OD invariants stay
    count-independent). Verified at head that the union is a measured coverage SUPERSET of the
    current globs over `git ls-files` -- 191 -> 1096 files, zero lost -- so it is a tightening and
    needs no tier-demotion-approved marker.
  - >-
    _PRUNED_EDGES keeps its two rows and each row's prose rationale becomes an EXECUTED structural
    test: no gated check whose closure passes through registry, and whose globs do not cover the
    manifests, may reference registry._ALL_ENTRIES or the sequence functions; any gated check
    calling _common.load_plan must declare a glob matching scripts/roadmap/plan_document.py. Both
    land green on the live tree (3 of 3 and 3 of 3 conforming at head). Adding a row or target is a
    marker-gated weakening through _marker_guard's base-vs-head mechanism; removal stays free. The
    suppressed-path count is PRINTED, never asserted.
  - >-
    Deleting a non-last mirror test file from a concern-split package fires validate_red_case_floor
    for that Entry, closing the 20-of-25-files escape rec-3727 measured. No marker, waiver or
    grandfather escape is added to the floor -- it stays exceptionless (Decision 163 point 1). The
    concern-split population grows from 5 to 7 entries via the two decompositions this plan makes,
    and the new guard covers all 7.
  - >-
    Removing or commenting out an on:.schedule block on any of the 10 schedule-bearing workflows
    fails --pre without a marker and passes with a `# schedule-removal-approved: dec-NNN <reason>`
    marker whose cited Decision body names that workflow. ADDING a schedule passes unmarked. The
    marker key is the BARE workflow filename, never the path, so a Decision naming
    `.github/workflows` generically can never authorize a specific workflow's removal (verified:
    the path form yields `.github/workflows` as an authorization candidate, the bare filename
    yields only itself).
  - >-
    The guard derives its population by globbing .github/workflows at base and head -- no committed
    list of schedule-bearing workflows exists anywhere in the diff. It does NOT import
    scripts.convergence_health.sensor_liveness (measured: that import drags a 56-module closure);
    it replicates the on:.schedule parse, including the PyYAML bare-`on:`-parses-as-True
    normalization, and a test pins the two derivations equal on the live tree -- the same
    replicate-and-pin shape validate_pre_glob_closure._glob_match already uses against
    validate.py::_pre_glob_match, for the same closure reason.
  - >-
    validate_verifier_same_pr_guard scans only CONCRETE Verifier subclasses. A PR editing
    scripts/verifiers/harness.py alongside any other file no longer produces a violation (today it
    produces six, because the framework base classes declare no `covers` and default to ["**"]).
    The check declares examined(0) over the resulting empty domain -- declared vacuity, never a
    silent pass. Its Entry is NOT deleted: it is sequenced, so gates_deletion has no marker escape
    and retirement would need mark-then-drop across two PRs.
  - >-
    The four dangling-shard, stale-row and red-case-gap findings this plan does not fix are FILED as
    recommendations, not left as prose: the 3 remaining dangling verification-registry shards, the 4
    concern-split mirror files carrying no red case, the stale `validate_imports` ci_rca_taxonomy
    row, and the residual that a future marker-authorized _PRUNED_EDGES row inherits no structural
    rationale test.
  - >-
    rec-3558, rec-3727 and rec-3721 close against their CURRENT acceptance text. rec-3558 was
    re-scoped through the ops portal on 2026-09-13 by explicit human confirmation BEFORE any
    implementation (Decision 103: a semantic verdict is never a unilateral agent act); its original
    empty-roster criterion was falsified by measurement (292 -> 997 findings; the registry row alone
    suppresses 670) and must not be re-introduced. rec-3722 is DECLINED IN PLACE with rationale and
    stays OPEN.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Baseline the start state before any edit, so the paydown delta is measured rather than
      asserted. Records 292 findings across 43 of 52 gated checks.
    command: "bin/venv-python -c \"import scripts.checks.deps.validate_pre_glob_closure as m; f=[]; m.validate_pre_glob_closure(f); print('FAILED:', f)\" | tail -3"
    expected: "An ADVISORY line naming 43 of 52 gated checks and 292 findings; FAILED: [] (still advisory)."
    fix_if: >-
      A materially different count means main moved under the plan -- re-triage before paydown
      rather than forcing the old numbers. Do not proceed on an unexplained delta.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      Leg (c) discrimination -- the known-bad fixtures. A removed schedule block, a commented-out
      one, and a deleted whole workflow file each gate without a marker; each passes with a valid
      authorized marker except the whole-file deletion, which has no head line to carry one.
    command: "bin/venv-python -m pytest tests/checks/ci_guards/test_validate_schedule_removal_markers.py::TestKnownBad -q"
    expected: "Exit 0. Every known-bad fixture yields a non-empty violation list naming the workflow by its bare filename."
    fix_if: >-
      A known-bad fixture passes clean -- the gate does not discriminate on that axis and a silent
      sensor-population shrink still merges. Fix the rule, never the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: schedule-removal-guard-known-bad
  - step: 3
    phase: pre-deploy
    action: >-
      Leg (c) tightening-freedom and the anti-second-surface pin. Adding a schedule passes unmarked;
      the replicated on:.schedule parse agrees with sensor_liveness.derive_scheduled_peers on the
      live tree; and the guard's own module imports nothing from scripts.convergence_health.
    command: "bin/venv-python -m pytest tests/checks/ci_guards/test_validate_schedule_removal_markers.py::TestTighteningFree -q && ! grep -q 'convergence_health' scripts/checks/ci_guards/validate_schedule_removal_markers.py"
    expected: "Exit 0; the grep finds no convergence_health import, so the 56-module closure is not inherited."
    fix_if: >-
      If tightening needs a marker the mechanism is dead -- fix the direction rule. If the parses
      disagree, fix the replica, never the pin. If the grep matches, the import edge is back and
      this guard now owes ~8 directory globs.
    hermetic: true
    graduation: graduate
    graduation_check_id: schedule-removal-tightening-free
  - step: 4
    phase: pre-deploy
    action: >-
      rec-3727 -- deleting a non-last mirror file from a concern-split package fires. Exercises a
      real Entry whose mirror resolves to a directory, deletes one of its files with a red case
      still standing in a sibling, and requires a violation.
    command: "bin/venv-python -m pytest tests/checks/verification/validate_red_case_floor/test_within_package_file_deletion.py -q"
    expected: "Exit 0; the deletion is reported even though a sibling file still carries a red case."
    fix_if: >-
      A deletion passing clean means the any() over package files still hides it -- the guard must
      judge the file SET, not the disjunction. Never add a marker escape to make a case pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: red-case-floor-within-package-deletion
  - step: 5
    phase: pre-deploy
    action: >-
      rec-3721 -- the framework-only population no longer traps. Drives the real
      scripts/verifiers/harness.py alongside an unrelated changed file and requires NO violation,
      then confirms a concrete Verifier subclass fixture still gates.
    command: "bin/venv-python -m pytest tests/checks/verification/test_validate_verifier_same_pr_guard.py -q"
    expected: "Exit 0. harness.py + another file yields zero violations (today it yields six); a concrete subclass fixture still yields one."
    fix_if: >-
      Still six violations means the scan still matches ClassDefs with no covers. If the concrete
      fixture stops gating, the narrowing went too far and the check is now unconditionally inert.
    hermetic: true
    graduation: graduate
    graduation_check_id: verifier-same-pr-guard-concrete-only
  - step: 6
    phase: pre-deploy
    action: >-
      The inert-floor discrimination red case -- the Decision 181 honesty check on the 53-finding
      removal. A module with a docstring plus exactly ONE executable statement must still be
      reported; only an empty-or-docstring-only body is excluded.
    command: "bin/venv-python -m pytest tests/checks/deps/validate_pre_glob_closure/test_closure_and_floor.py -q"
    expected: "Exit 0; the one-statement fixture is reported and the docstring-only fixture is not."
    fix_if: >-
      If the one-statement module is excluded the floor is over-broad and is silently shrinking real
      recall, which is the exact fail-open shape this auditor exists to catch. Narrow the predicate.
    hermetic: true
    graduation: graduate
    graduation_check_id: pre-glob-closure-inert-floor-discriminates
  - step: 7
    phase: pre-deploy
    action: >-
      rec-3558 re-scoped -- each _PRUNED_EDGES row's rationale as an executed structural test, plus
      the marker-gated row-addition leg and the retained liveness/inertness pins.
    command: "bin/venv-python -m pytest tests/checks/deps/validate_pre_glob_closure/test_pruned_edges_roster.py -q"
    expected: "Exit 0. TestRowRationaleIsStructural passes on the live tree; an unmarked synthetic row addition is reported; a removal is free."
    fix_if: >-
      A structural test failing on the live tree means a real dependency now contradicts a row's
      stated reason -- remove the row or add the glob; do NOT relax the test to match the code.
    hermetic: true
    graduation: graduate
    graduation_check_id: pre-glob-prune-row-rationale-is-structural
  - step: 8
    phase: pre-deploy
    action: >-
      The blocking contract and Decision 170 accounting -- the LSA-06 acceptance proper. A synthetic
      repo whose check module imports an uncovered hub must make the check APPEND to `failed`, and
      the advisory banner string must be gone from the module.
    command: "bin/venv-python -m pytest tests/checks/deps/validate_pre_glob_closure/test_blocking_contract.py -q && ! grep -q 'Never fails the build at this stage' scripts/checks/deps/validate_pre_glob_closure.py"
    expected: "Exit 0; the synthetic uncovered import reds, accounting is declared on every reachable exit, and the advisory string is absent."
    fix_if: >-
      If `failed` stays empty the flip did not land. If the loud-skip path now appends, the Decision
      55 contract broke -- a probe failure must still SKIP loudly, not red.
    hermetic: true
    graduation: graduate
    graduation_check_id: pre-glob-closure-blocking-on-uncovered-import
  - step: 9
    phase: pre-deploy
    action: >-
      The self-gate fixed point -- the auditor cannot be narrowed out of its own way. Asserts
      registry.pre_sequence() raises when the auditor's Entry globs fail to cover every tracked .py
      file, and that no per-check roster constant was introduced to express it.
    command: "bin/venv-python -m pytest tests/checks/registry/test_sequences.py -q"
    expected: "Exit 0; the raise fires on a narrowed-Entry fixture and the live fleet assembles normally."
    fix_if: >-
      If the raise does not fire, a future PR can narrow the auditor's globs and silently stop the
      gate running on the diff that breaks it -- the Decision 187 point 6 defect, reintroduced.
    hermetic: true
    graduation: graduate
    graduation_check_id: pre-glob-closure-self-gate-fixed-point
  - step: 10
    phase: pre-deploy
    action: >-
      The paydown terminal condition on the LIVE tree -- zero findings, and the check does not fail.
      This is the step the flip depends on and it runs AFTER the flip has landed in the module.
    command: "bin/venv-python -c \"import scripts.checks.deps.validate_pre_glob_closure as m; f=[]; m.validate_pre_glob_closure(f); assert not f, f; print('BACKLOG ZERO, gate green')\""
    expected: "Prints 'BACKLOG ZERO, gate green'; a PASS line naming all 52 gated checks; no ADVISORY line."
    fix_if: >-
      Any residual finding means the flip would red main on merge. Add the missing glob to the named
      Entry. Never add a _PRUNED_EDGES row to reach zero -- that is the blind-spot growth rec-3558
      exists to stop, and it is now marker-gated.
    hermetic: false
    graduation: graduate
    graduation_check_id: pre-glob-closure-backlog-is-zero
  - step: 11
    phase: pre-deploy
    action: >-
      Registration closure for the new check across the seven surfaces, and the concern-split
      registrations the two test decompositions require. Without the latter,
      validate_red_case_floor reports "mirror not found" for both decomposed modules and reds.
    command: "bin/venv-python -m pytest tests/checks/deps/test__manifest.py tests/checks/ci_guards/test__manifest.py tests/test_checks_registry.py tests/test_coverage_checker/test_coverage_checker_map.py -q && bin/venv-python -c \"from scripts.test_coverage_checker import _CONCERN_SPLIT_TEST_PACKAGES as C; need={'scripts/checks/deps/validate_pre_glob_closure.py','scripts/checks/verification/validate_red_case_floor.py'}; assert need <= C, need - C; print('concern-split registered')\""
    expected: "Exit 0; prints 'concern-split registered'."
    fix_if: >-
      A missing concern-split entry makes both decomposed mirrors invisible to the red-case floor. A
      missing taxonomy row fails the two-way census in validate_ci_rca_adjudication.
    hermetic: true
    graduation: graduate
    graduation_check_id: pre-glob-closure-registration-closure
  - step: 12
    phase: pre-deploy
    action: >-
      Whole-fleet regression -- the flip is live, so every check's declared coverage is now load
      bearing. Confirms no SLOC limit was crossed by the new tests and no file was registered over
      500 instead of decomposed.
    command: "bin/venv-python -m pytest tests/checks/ -q && bin/venv-python -c \"import subprocess,sys; out=subprocess.run(['git','diff','--name-only','origin/main'],capture_output=True,text=True).stdout.split(); bad=[f for f in out if f.endswith('.py') and len([l for l in open(f, encoding='utf-8').read().splitlines() if l.strip() and not l.strip().startswith('#')])>500]; assert not bad, bad; print('no file over 500 SLOC')\""
    expected: "Exit 0; prints 'no file over 500 SLOC'."
    fix_if: >-
      A file over 500 SLOC must be decomposed (Decision 128), never registered with a raise marker --
      --update-sloc-budgets will not seed it and a raise here has no authorizing Decision.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on a live `git diff origin/main` against this PR's own branch state, so the assertion
      is transient to this session's tree rather than a standing property; the standing SLOC
      guarantee is already owned by validate_sloc_limits and validate_sloc_budget_raises in --pre.
  - step: 13
    phase: pre-deploy
    action: >-
      Bundled-rec closure -- confirm the three bundled recs close against their CURRENT acceptance
      text, and that rec-3722 is still open rather than silently swept.
    command: "bin/venv-python -m scripts.sync.ops pull && bin/venv-python -c \"import json; rows={json.loads(l)['id']: json.loads(l) for l in open('logs/.recommendations-log.jsonl')}; assert 'empty_pruned_edges' not in rows['rec-3558']['acceptance'], 'rec-3558 still carries the falsified criterion'; assert rows['rec-3722']['status']=='open', rows['rec-3722']['status']; print('rec-3558 re-scoped; rec-3722 open')\""
    expected: "Prints 'rec-3558 re-scoped; rec-3722 open'."
    fix_if: >-
      If rec-3558 still names the empty-roster test, the portal re-scope did not land -- re-run it
      before closing, never close against the falsified text. If rec-3722 is closed, the decline was
      wrongly written as a resolution.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/deps/validate_pre_glob_closure.py
    behavior: >-
      Excludes only modules with an empty or docstring-only AST body; appends to `failed` on any
      uncovered closure path; still SKIPs loudly rather than reddening when its own probe fails;
      prints the suppressed-path count without asserting it.
    verification_step: 8
    test_selector: tests/checks/deps/validate_pre_glob_closure/test_blocking_contract.py
    red_green_expectation: >-
      red before (the module never appends to `failed`, so a synthetic uncovered import passes),
      green after
  - source: scripts/checks/verification/validate_red_case_floor.py
    behavior: >-
      A concern-split Entry's mirror file SET may not shrink; a deletion is reported even when a
      sibling file still carries a red case. No marker escape exists.
    verification_step: 4
    test_selector: tests/checks/verification/validate_red_case_floor/test_within_package_file_deletion.py
    red_green_expectation: red before (any() over package files hides the deletion), green after
  - source: scripts/checks/ci_guards/validate_schedule_removal_markers.py
    behavior: >-
      Removing, emptying or commenting out an on:.schedule block gates without an authorized
      bare-filename-keyed marker; adding one is free; the population is globbed at base and head.
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_schedule_removal_markers.py::TestKnownBad
    red_green_expectation: red before (the module does not exist -- ImportError), green after
  - source: scripts/checks/verification/validate_verifier_same_pr_guard.py
    behavior: >-
      Only concrete Verifier subclasses are scanned; framework base classes with no `covers` no
      longer default to ["**"]; the empty domain is declared via examined(0).
    verification_step: 5
    test_selector: tests/checks/verification/test_validate_verifier_same_pr_guard.py
    red_green_expectation: red before (harness.py plus any file yields six violations), green after
