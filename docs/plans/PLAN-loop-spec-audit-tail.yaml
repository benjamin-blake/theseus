constraints:
  - >-
    AUDIT SCOPE GUARD, binding: build no rejected technique -- no loop-spec contract, no loop-spec
    grammar evaluator, no new enumeration surface, no `sensors:` register. Leg (c) globs the
    workflow directory at base and head; a committed list of schedule-bearing workflows anywhere in
    the diff violates this.
  - >-
    Derive, never enumerate (Decision 187 point 1). No committed roster, base snapshot, or
    per-check name constant is introduced by any leg. The seven-surface registration for the new
    check is in scripts/checks/registry.py's docstring, which this plan already touches.
  - >-
    Tightening stays free everywhere: adding globs, adding a schedule, promoting a check, and
    removing a _PRUNED_EDGES row all pass unmarked. If any tightening needs a marker the mechanism
    is dead.
  - >-
    No marker, waiver or grandfather escape may be added to validate_red_case_floor or to
    validate_pre_glob_closure. Both are exceptionless floors by design (Decision 163 point 1).
  - >-
    Never resolve a residual by weakening an assertion, acceptance criterion or budget to reach
    green (Decision 181). Out-of-scope defects become recommendations via scripts.ops_data_portal
    (Decision 59), never inline fixes.
  - No rescue agents or workaround loops (Decision 55). A probe failure SKIPs loudly; it never passes silently.
  - >-
    Decompose past 500 SLOC, never raise (Decision 128). Two test files are already decomposed by
    this plan; scripts/test_coverage_checker.py (472) and scripts/checks/registry.py (349) have
    headroom but must be watched.
