    graduation: waive
    graduation_waiver_reason: >-
      NOT graduatable as written, same mechanical reason as step 9: every one of this step's nine
      pytest targets and its live red-case-floor call already passes at origin/main, so a shard
      derived verbatim from the command is tautological and validate_verification_registry refuses
