rollback: >-
  The flip is the only irreversible-feeling element and it is one boolean plus one banner string:
  reverting the `failed.append` restores wave-4a advisory behaviour without touching the paydown,
  which is pure recall gain and should be kept. The registry.py fixed-point raise and the two new
  marker bindings are independently revertible. If the flip must be backed out, file a rec owning
  the re-flip rather than leaving the staged path unowned a third time -- that unowned-tail state
  is precisely what LSA-06 was filed about.
