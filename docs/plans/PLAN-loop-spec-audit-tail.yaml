      selectivity, and selection_budget cannot see it (widened pre_globs change which CHECKS run on
      FUTURE diffs, not this diff's module selection). So assert no Entry except the auditor NEWLY
      GAINS a repo-wide glob. Base-vs-head is necessary, not merely tidy: SEVENTEEN gated Entries
      already declare a repo-wide glob at base, measured against THIS step's forbidden set (it was
      twelve before scripts/checks/** joined that set), so an absolute ban would flag all of them.
      The forbidden set MUST include `scripts/checks/**` -- for the tail Entries it is the cheapest
      over-broad shortcut, since it subsumes the _common.py + registry.py pair they actually need.
