    expected: "Exit 0; no gated Entry but the auditor newly gained any of **, **/*.py, scripts/**, scripts/checks/**, src/**, tests/**."
    fix_if: >-
      A newly-gained repo-wide glob means the paydown bought its zero by over-selection rather than
