work_areas: []
rollback: >-
  Fully additive and reversible: a new generator, a new registered check, a committed index, two
  allowlist entries, and one index-only parser key -- no warehouse writes, no migrations, no infra.
  Reverting the branch removes docs/decisions-index.json, the check, and the parser additions with
  no residual state; the warehouse (ops_decisions) is never written by this change.
