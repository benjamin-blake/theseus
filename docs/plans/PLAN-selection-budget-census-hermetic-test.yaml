schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: selection-budget-census-hermetic-test
intent: >-
  Keep the fast-tier budget gate (Decision 182) trustworthy as the test suite grows: decouple the
  census-clamp guards in tests/checks/deps/test_selection_budget.py and
  tests/validate/test_budget_split.py from the live on-disk test-module count, so organic growth past the designed 630-module cap-binding point no longer reddens --pre for
  unrelated PRs, and the clamp guarantee stays genuinely guarded (today it goes vacuous at >= 630)
  -- with no budget constant or formula changed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-selection-budget-census-hermetic-test.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Forward fix for rec-4076, which blocks PLAN-telemetry-kernel-identity-append's implementation PR
  (its 7 new test modules take the census from 626 to 633).
scope:
  - file: tests/checks/deps/test_selection_budget.py
    action: Modify
    purpose: >-
      THREE edits, test-only; scripts/checks/deps/selection_budget.py stays byte-identical.
      (a) TestAllowance::test_census_floor_stops_an_over_selecting_selector_inflating_its_allowance --
      NAME KEPT VERBATIM (it is rec-4076's acceptance node id, which Decision 201's closure-time
      acceptance verdict re-runs). Replace its body: for synthetic censuses strictly below
      binds_at = int((CEILING_SECONDS - NON_TEST_BUDGET_SECONDS) / PER_MODULE_SECONDS) -- use 100,
      263 and binds_at - 1 -- assert test_execution_allowance(10**6, census=c) ==
      test_execution_allowance(c, census=c) == max(TEST_BASE_SECONDS, PER_MODULE_SECONDS * c), and
      that this is strictly below test_execution_allowance(10**6) (the unclamped value) -- the witness
      that the clamp BITES, independent of repo size. Then a size-independent live check that keeps
      count_test_modules()'s default-root branch exercised: live = count_test_modules(); live > 0;
      test_execution_allowance(10**6, census=live) == test_execution_allowance(live, census=live) ==
      min(max(TEST_BASE_SECONDS, PER_MODULE_SECONDS * live), CEILING_SECONDS - NON_TEST_BUDGET_SECONDS).
      The removed assertion (strict < cap on the LIVE census) encoded "the repo has fewer than 630 test
      modules", not a selection_budget property.
      (b) NEW TestAllowance::test_census_clamp_saturates_at_the_derived_cap_on_a_real_tree: build ONE
      tmp_path tree, growing it through binds_at - 1, binds_at and binds_at + 3 empty tests/test_*.py
      files; at each size assert count_test_modules(root=tmp_path) equals the size, and
      test_execution_allowance(10**6, census=size) equals PER_MODULE_SECONDS * size below binds_at and
      EXACTLY CEILING_SECONDS - NON_TEST_BUDGET_SECONDS at and above it (Decision 182 point 1's
      designed cap binding). Real files through the real census function, derived values only -- no
      literal 630/633 restated beyond the binds_at + 3 offset.
      (c) TestClassifyBranchOrder::test_an_inflated_selection_cannot_raise_its_own_allowance (name kept):
      pass an explicit synthetic census below binds_at (263) instead of the live census, and assert
      inflated.allowance_s == PER_MODULE_SECONDS * 263 and < test_execution_allowance(10**6) -- at a
      live census >= 630 the current form is satisfied even with the clamp deleted (measured: the
      clamp-removal mutant survives it at a simulated 633).
      Stay stdlib + pytest; import nothing from another test_* module (Decision 131). File is 320
      lines; the additions keep it far under 500 (Decision 128).
  - file: tests/validate/test_budget_split.py
    action: Modify
    purpose: >-
      ONE edit (d), same flaw as (c): TestBreadthDerivedTestBudget::test_inflated_selection_cannot_raise_its_own_allowance
      (name kept) is the ONLY test that scripts/validate.py:420 actually wires
      census=selection_budget.count_test_modules(_common.ROOT) into classify, and it reads the LIVE
      census, so at >= 630 a clamp-removal mutant passes it (measured rc 0 at a simulated 633).
      Replace the live read with monkeypatch.setattr(sb, "count_test_modules", lambda root=None: 263)
      -- validate.py reads that attribute at call time off the same module object as sb -- and
      assert _budget_block()["limit_s"] == sb.PER_MODULE_SECONDS * 263 and <
      sb.CEILING_SECONDS - sb.NON_TEST_BUDGET_SECONDS. The sibling at :328
      (test_breadth_run_over_the_ceiling_still_hard_fails) and test_budget_manifest.py:130 compare
      against the live census by equality/<= only, stay green at any census, and guard the cap rather
      than the clamp -- untouched. File is 385 lines; stays under 500.
bundled_recommendations:
  - rec-4076
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - rec-4076's acceptance command (the kept node id) passes, and TestAllowance, TestClassifyBranchOrder and test_budget_split.py::TestBreadthDerivedTestBudget pass at the live census AND with the repo-root census patched to 633 and to 10000 (VP steps 2, 4).
  - A clamp-removal mutant of test_execution_allowance (census ignored) fails every one of the four census guards, including the validate.py:420 wiring guard, at a simulated 633 census (VP step 3).
  - The new real-tree test proves the allowance saturates at exactly CEILING_SECONDS - NON_TEST_BUDGET_SECONDS at and above binds_at and is PER_MODULE_SECONDS * n below it (VP step 1).
  - scripts/checks/deps/selection_budget.py is byte-identical (out of scope, enforced by validate_scope_boundary in VP step 7); every budget constant keeps its Decision 182 value (VP step 6).
  - bin/venv-python -m scripts.validate --pre and the full tier exit 0; rec-4076 closes via the Resolves trailer (VP steps 7, 8, 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new real-tree test shows the census clamp saturating at exactly the derived cap at and above binds_at.
    command: bin/venv-python -m pytest "tests/checks/deps/test_selection_budget.py::TestAllowance::test_census_clamp_saturates_at_the_derived_cap_on_a_real_tree" -q
    expected: One test passes; count_test_modules reads each tmp tree size exactly and the allowance is 2.0 x size below binds_at and 1260.0 at and above it.
    fix_if: Collection error (node absent or misnamed), or the allowance at binds_at differs from the cap -- the test restates a literal instead of deriving it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Genuinely subsumed by STEP 2, which graduates: this node id is a member of step 2's
      tests/checks/deps/test_selection_budget.py::TestAllowance class selector, so step 2's standing
      guard runs this exact test at every simulated census.
    expected_literals:
      - passed
  - step: 2
    phase: pre-deploy
    action: >-
      The census guards are repo-size independent -- TestAllowance, TestClassifyBranchOrder and
      test_budget_split.py::TestBreadthDerivedTestBudget pass with count_test_modules patched, for the
      default root AND the repo root validate.py:420 passes, to 633 (the telemetry slice 1 census) and
      to 10000, while any other root (the tmp_path tree) still reads the real filesystem.
    command: >-
      bin/venv-python -c "import sys, pathlib, pytest; from scripts.checks.deps import selection_budget as sb; real = sb.count_test_modules; repo = pathlib.Path.cwd().resolve(); sel = ['tests/checks/deps/test_selection_budget.py::TestAllowance', 'tests/checks/deps/test_selection_budget.py::TestClassifyBranchOrder', 'tests/validate/test_budget_split.py::TestBreadthDerivedTestBudget']; run = lambda c: (setattr(sb, 'count_test_modules', lambda root=None: c if root is None or pathlib.Path(root).resolve() == repo else real(root)), int(pytest.main(['-q', *sel])))[1]; rcs = [run(c) for c in (633, 10000)]; ok = rcs == [0, 0]; print('CENSUS_INDEPENDENT' if ok else 'CENSUS_COUPLED', rcs); sys.exit(0 if ok else 1)"
    expected: Exit 0 printing CENSUS_INDEPENDENT with both return codes 0. Red before the change (the kept acceptance node asserts a strict < cap on the live census and fails at 633).
    fix_if: CENSUS_COUPLED -- some census guard still reads the live repo size in a size-dependent way; find it and make it synthetic or size-independent, never loosen the clamp assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: selection-budget-census-guards-repo-size-independent
  - step: 3
    phase: pre-deploy
    action: >-
      Mutation witness -- with the census clamp deleted from test_execution_allowance and the default
      repo-root census patched to 633, each of the four census guards fails.
    command: >-
      bin/venv-python -c "import sys, pathlib, pytest; from scripts.checks.deps import selection_budget as sb; real_count = sb.count_test_modules; repo = pathlib.Path.cwd().resolve(); sb.count_test_modules = lambda root=None: 633 if root is None or pathlib.Path(root).resolve() == repo else real_count(root); real = sb.test_execution_allowance; sb.test_execution_allowance = lambda n, census=None: real(n); f = 'tests/checks/deps/test_selection_budget.py'; sel = [f + '::TestAllowance::test_census_floor_stops_an_over_selecting_selector_inflating_its_allowance', f + '::TestAllowance::test_census_clamp_saturates_at_the_derived_cap_on_a_real_tree', f + '::TestClassifyBranchOrder::test_an_inflated_selection_cannot_raise_its_own_allowance', 'tests/validate/test_budget_split.py::TestBreadthDerivedTestBudget::test_inflated_selection_cannot_raise_its_own_allowance']; rcs = [int(pytest.main(['-q', s])) for s in sel]; ok = rcs == [1, 1, 1, 1]; print('MUTANT_CAUGHT' if ok else 'MUTANT_SURVIVED', rcs); sys.exit(0 if ok else 1)"
    expected: Exit 0 printing MUTANT_CAUGHT with return codes [1, 1, 1, 1]. Red before the change (measured MUTANT_SURVIVED [1, 4, 0, 0] -- the new node is absent and both inflated-selection guards pass under the mutant at 633).
    fix_if: MUTANT_SURVIVED -- a census guard is satisfied without the clamp, so it guards nothing; re-anchor it on a synthetic census below binds_at.
    hermetic: true
    graduation: graduate
    graduation_check_id: selection-budget-census-clamp-mutant-caught
  - step: 4
    phase: pre-deploy
    action: rec-4076's own acceptance command passes at the live census.
    command: bin/venv-python -m pytest "tests/checks/deps/test_selection_budget.py::TestAllowance::test_census_floor_stops_an_over_selecting_selector_inflating_its_allowance" -q
    expected: One test passes.
    fix_if: The node id is not found -- the test was renamed, which breaks the Resolves-trailer acceptance verdict (Decision 201) and leaves rec-4076 open.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green on the un-implemented tree at today's live census of 628 (the failure needs >= 630), so a
      red-before replay would be tautological; the census-633 behaviour of this exact node is what
      step 2 graduates, and the closure gate re-runs this command independently.
    expected_literals:
      - passed
  - step: 5
    phase: pre-deploy
    action: Both edited test files pass whole and are lint- and format-clean.
    command: bin/venv-python -m pytest tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py -q && bin/venv-python -m ruff check tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py && bin/venv-python -m ruff format --check tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py
    expected: All tests pass (both files keep every pre-existing test), ruff reports no findings, and format --check reports both files already formatted.
    fix_if: A pre-existing test fails -- the edit touched more than the four named tests. Or ruff flags an edited line (line length 127).
    hermetic: true
    graduation: not-applicable
    expected_literals:
      - passed
  - step: 6
    phase: pre-deploy
    action: >-
      No budget constant or formula moved, and the evidence that none needs to -- at census 633 the
      predicted CI test half stays under the cap while the allowance saturates at it -- still holds.
    command: >-
      bin/venv-python -c "from scripts.checks.deps import selection_budget as sb; cap = sb.CEILING_SECONDS - sb.NON_TEST_BUDGET_SECONDS; print((sb.NON_TEST_BUDGET_SECONDS, sb.TEST_BASE_SECONDS, sb.PER_MODULE_SECONDS, sb.CEILING_SECONDS) == (240.0, 180.0, 2.0, 1500.0), sb.predict_test_half(633)[1] < cap, sb.test_execution_allowance(10**6, census=633) == cap)"
    expected: Prints three True values on one line.
    fix_if: The first False -- a constant was edited, out of scope for this plan (re-derivation is Decision 182 reversal-condition territory and needs its own planning session).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Evidence of what this plan deliberately leaves unchanged, so it is green on the un-implemented
      tree by construction; the constants are already pinned by
      TestAllowance::test_coefficient_and_partition_constants_are_pinned in the graduated
      selection-budget-cli-reports-breadth whole-file registry row.
    expected_literals:
      - True True True
  - step: 7
    phase: pre-deploy
    action: Run the fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Zero failed checks, including validate_plan_documents, validate_scope_boundary and validate_graduation_completeness.
    fix_if: Any failure -- diagnose and fix on the branch; never weaken a check to obtain green (Decision 181).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate, which the vp-red-before recursion refusal forbids graduating; its constituent checks are each registered in their own right.
  - step: 8
    phase: pre-deploy
    action: Run the full presubmit tier locally before handoff, as handoff_policy declares.
    command: bin/venv-python -m scripts.validate
    expected: The printed summary reports zero failed checks, including the full-tier-only legs.
    fix_if: Per handoff_policy.timeout_disposition, a timeout is BLOCKED -- resume later and rerun the full tier from the start; never commit on a partial run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Same recursion refusal as step 7 at the full tier; its constituent checks are each already registered in their own right.
  - step: 9
    phase: post-deploy
    action: Confirm rec-4076 closed through the squash-merge Resolves trailer.
    command: bin/venv-python -m scripts.ops_data_portal --sync && grep -F rec-4076 logs/.recommendations-log.jsonl | grep -c closed
    expected: A non-zero count -- rec-4076 closed, reachable only through its acceptance node reading holds at the closing commit.
    fix_if: >-
      Zero -- check the squash commit body carries the Resolves trailer for rec-4076 and the closure
      job acceptance verdict for the kept node id.
    hermetic: false
