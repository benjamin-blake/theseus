rollback: >-
  Code-only and revertible by a single revert commit; no terraform, no schema, no data migration. The
  production gc_ops rule stays state=DISABLED throughout, so no production destructive pass runs as
  part of this plan, and VP10's canary is a dry_run that deletes nothing. The strict-sizing residual
  is closed on both ends: path shapes verified byte-identical against the live smoke prefix and
  corroborated at production scale by GcReferencedMissing 0 over 38,025 objects, and a human-invoked
  production dry_run reporting zero unsized candidates is now a precondition of enabling the schedule
  (rec-3767). The drain is the higher-risk half: it deletes in increments where the previous
  behaviour deleted nothing, so a defect there over-reclaims rather than under-reclaims. Its
  containment is that the grace floor is refused rather than clamped, G1 runs against the admitted
  set and G3 after it, and the first real pass is human-gated. Reverting restores byte-blind,
  wholesale-deferring behaviour -- safe but inert, never unsafe.
