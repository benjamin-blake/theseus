rollback: >-
  Code-only and revertible by a single revert commit; no terraform, no schema, no data migration. The
  production gc_ops rule stays state=DISABLED throughout, so no production destructive pass runs as
  part of this plan. KNOWN, HUMAN-GATED RESIDUAL RISK: strict_sizes=True gets no live-engine exercise
  anywhere in this plan -- the CI smoke path is the enumerated NON-strict site and production gc_ops
  is disabled, so its first live execution is the first pass after the rec-3767 enablement, which a
  human gates. The failure mode is a size-source key-shape mismatch raising DuckLakeMaintenanceError
  and surfacing as MaintenanceBreakerTrip, indistinguishable from a real safety breach. The hermetic
  s3:// path-shape pin in VP2 is the mitigation; whoever enables the rule should read the first pass's
  guard_stats before treating a breaker trip as a breach. Reverting this commit restores the current
  byte-blind behaviour, which is safe-but-weaker, never unsafe.
