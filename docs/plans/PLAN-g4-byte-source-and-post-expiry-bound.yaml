      TestG4PartialDrain (rec-3888): a backlog over the cap drains at the YOUNGEST rung that fits,
      never the oldest (the anti-pattern rec-3871 named, which deletes nothing); the walk re-probes
      per rung rather than sorting locally; the selected cutoff is never younger than
      FILE_CLEANUP_GRACE_DAYS; the admitted set is what the destructive wrappers receive as
      older_than; the deferred remainder is reported; and successive passes strictly shrink a
