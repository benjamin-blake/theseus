rollback: >-
  Code-only and revertible by a single revert commit; no terraform, no schema, no data migration. The
  production gc_ops rule stays state=DISABLED throughout, so no production destructive pass runs as
  part of this plan. The residual risk the previous draft carried -- that strict sizing would first
  execute live against production data, where a path-shape mismatch raises as MaintenanceBreakerTrip
  and is indistinguishable from a real breach -- is now closed on both ends: the path shapes were
  verified byte-identical against the live smoke prefix during planning (see context), and VP9 makes a
  human-invoked production dry_run reporting zero unsized candidates a precondition of enabling the
  schedule (rec-3767). A dry_run deletes nothing, so the canary cannot over-reclaim. If the strict
  path does trip on the smoke catalog after merge, the correct response is RCA of the
  catalog/storage inconsistency (rec-3892 is the standing suspect), never loosening the guard;
  reverting this commit restores the current byte-blind behaviour, which is safe-but-weaker, never
  unsafe.
