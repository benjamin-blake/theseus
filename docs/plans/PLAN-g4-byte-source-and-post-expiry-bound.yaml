      The unexplained cause is rec-3892; making it non-vacuous is not in this plan's scope.
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      TestG4ByteSource (rec-3871's named acceptance class): a candidate absent from the catalog live
