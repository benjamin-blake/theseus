constraints:
  - >-
    No rescue agents or workaround loops (Decision 55). A guard constant (G3_MAX_LIVE_BYTES_DROP,
    G4_MAX_DELETE_FILES, G4_MAX_DELETE_BYTES) is NEVER relaxed to make a gate pass, and strict sizing
    is never loosened to get a green smoke gate or a green canary.
  - >-
    CONTENT never-weaken (Decision 181, docs/contracts/implement-scope-boundary.yaml): G4 must be
    shown strictly STRONGER, not merely different. No shipped ASSERTION may be edited to pass;
    threading the two new required kwargs through existing call sites is an argument-list edit and is
    explicitly not covered by that clause.
  - >-
    NO exception path (Decision 163, verbatim: "removing the exception path entirely ... not building
    a gate around it that a future session could argue its way past"). Both callers pass
    strict_sizes=True; there is no sanctioned False call site. The flag exists only to keep the guard
    falsifiable in test, the discipline test_g1_non_forcing_call_does_not_trip already establishes
    for G1. Do NOT reintroduce a default.
  - >-
    G1's live-set reads stay INDEPENDENT OF THE CALLER. Do not thread gc_ops's live_before into
    run_guarded_gc's internal pre-check to save a scan -- that is rec-3878's optimisation and it would
    make G1 check the caller's own read instead of a fresh one. Reusing run_guarded_gc's OWN
    pre-expiry live_now for the post-expiry G1 pre-check is a different thing and is required here;
    the :249 re-check keeps its own fresh live_after read. rec-3878 stays open and unbundled.
  - >-
    live_before keeps its identity as the universal CATALOG set feeding G1/G3. The storage listing
    is a SEPARATE argument; it never replaces live_before.
  - >-
    Read ordering is load-bearing: catalog live set FIRST, storage SECOND, at both the pre-pass and
    post-pass read pairs (Decision 192 pt 3 / ducklake_gc_ops property 4).
  - >-
    The smoke Lambda must not import src/common/ducklake_gc_ops.py -- its manifest deliberately does
    not bundle the production verb module. That is why the listers move to ducklake_maintenance.py
    rather than being imported across.
  - >-
    Defect (b), the partial drain, is OUT OF SCOPE and stays wholesale-deferring. It is rec-3888 and
    is gated on measurements that do not exist yet. The smoke-prefix anomaly is rec-3892 and is not
    fixed here either (Decision 59: out-of-scope findings become recommendations).
  - >-
    Lambda code deploys through .github/workflows/deploy-ducklake-lambdas.yml (Decision 125/126).
    `build_lambda --ducklake-only --deploy` is break-glass only and must not appear as a VP step.
  - >-
    No local terraform init/validate/plan (Decision 119). No terraform change is in scope: the
    gc_ops rule stays state=DISABLED, and enabling it stays rec-3767's human-gated step, now
    additionally gated on VP9's canary reading zero unsized candidates.
  - >-
    SLOC decompose-by-default (Decision 128). Two files are near the line: ducklake_maintenance.py at
    383 of 500 gaining the relocated listers, and test_ducklake_maintenance_ops.py at 330 gaining two
    classes. If either crosses, decompose -- never register a raise.
