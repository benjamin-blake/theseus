bundled_recommendations:
  - rec-3894
  - rec-3895
  - rec-3896
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    size_candidates(paths, size_source, *, strict_sizes) raises DuckLakeMaintenanceError naming the
    unsized path under True and returns a count under False; run_guarded_gc always calls it strict
    and exposes no strictness parameter, so no destructive path can be non-strict.
  - >-
    run_guarded_gc takes candidate_size_source as a REQUIRED keyword-only parameter with no default,
    and both destructive callers -- run_gc and gc_ops -- pass a storage-derived map.
  - >-
    A would-delete candidate absent from the catalog live set but present in the declared size
    source sizes NON-ZERO through bound_deletions, so both GC paths have a binding byte cap and not
    only a file-count cap.
  - >-
    run_guarded_gc re-probes the dry-run candidate paths after expire_snapshots, and each guard
    evaluates the set the scope row's per-check table assigns it: the :216 G1 pre-check and G4's
    over-budget DECISION on the POST-EXPIRY set (the pre-check against the REUSED pre-expiry
    live_now map, no additional catalog rescan), and the :249 post-destructive re-check on the
    ADMITTED set intersected with its own fresh live_after read -- what was actually deleted. Under
    a drain those sets DIFFER; they coincide only when no walk was needed. The new probes raise on
    introspection failure like every other guard-path read.
  - >-
    An over-budget pass DRAINS: the walk brackets on the grace ladder from the youngest permitted
    cutoff outward, bisects inside the bracket (at most 8 probes -- enough to resolve the widest
    (180, 365] bracket to a single day) for the youngest cutoff that fits both caps, never goes below FILE_CLEANUP_GRACE_DAYS, and passes that cutoff to the
    destructive wrappers as an explicit older_than so exactly the admitted set is deleted.
  - >-
    A cutoff that "fits" by admitting ZERO is never selected as a drain. If no cutoff at or above
    the grace floor admits a positive count under both caps, the pass defers wholesale, reports
    g4_drain_cutoff_days null with g4_bounded true, and that state is loud -- it means the backlog
    is structurally undrainable at this grace floor.
  - >-
    Successive passes strictly shrink a simulated over-budget backlog -- the property the
    whole-pass defer could not satisfy, and the reason a measured 23,476-file backlog against a
    20,000 cap would otherwise never reclaim anything.
  - >-
    A backlog that exceeds the caps even at the oldest rung still defers wholesale, and reports the
    deferred counts rather than stalling silently.
  - >-
    guard_stats renames g1_would_delete_candidates to pre_expiry_would_delete_candidates and adds
    post_expiry_would_delete_candidates and g4_drain_cutoff_days; the g4_* count/byte keys describe
    the ADMITTED post-drain set and the deferred keys the remainder. The contract's 200 body and the
    runbook document all of it.
  - >-
    gc_ops takes its pre-pass storage listing after the universal catalog live-set collection and
    before any destructive call, in dry_run as well, leaves live_before as the universal CATALOG
    set, and re-sources would_delete_bytes from it.
  - >-
    In dry_run, gc_ops reports top-level `unsized_candidates` (computed with strict_sizes=False) and
    `drain_probe_counts` (the walk's per-probe {days: {files, bytes}} map, read-only, so BOTH caps
    are adjudicable and not only the file-count half) and leaves guard_stats None -- fields the pre-enablement canary can actually read, unlike a guard_stats key, which
    dry_run never populates. drain_probe_counts counts the PRE-EXPIRY set (dry_run runs no expiry),
    so it is a NECESSARY-not-sufficient signal: all-zero proves the first pass cannot drain, a
    positive fitting cutoff means it may. That is what the field measures, and the plan claims no
    more for it.
  - >-
    _parse_s3_uri and _default_list_storage live in src/common/ducklake_maintenance.py AND remain
    importable as ducklake_gc_ops module attributes, so all SEVEN shipped patch sites keep working and
    the smoke Lambda never imports the production verb module.
  - >-
    run_gc accepts a list_storage injection seam, so its strict sizing path is exercisable on a
    mocked connection.
  - >-
    gc_ops emits GcWouldDeleteFilesPostExpiry, GcDeferredFiles and GcDrainCutoffDays;
    GcWouldDeleteFiles keeps its existing pre-expiry meaning and value.
  - >-
    A real-engine test pins that the `path` column from the dry-run ORPHAN table function is
    byte-identical to _default_list_storage's s3://bucket/key keys against an s3:// DATA_PATH, using
    CREATE SECRET-form credentials.
  - >-
    gc_ops raises rather than reporting GcDebtRatio=0.0 when live_bytes <= 0 (rec-3876).
  - >-
    The CI smoke gc gate fails a guard_stats payload missing any new key, and fails a drain cutoff
    below the grace floor.
  - >-
    Every shipped guard ASSERTION still passes unmodified: live_before stays the universal catalog
    set, catalog-before-storage holds at both read pairs, and the guard set still fails closed on
    introspection error.
  - >-
    rec-3894, rec-3895 and rec-3896 -- the live successor ids -- are closed in the warehouse;
    rec-3892 stays open.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The acceptance grep half of BOTH bundled guard recs -- rec-3871's byte-source, strictness and
      post-expiry surfaces, and rec-3888's drain half. Positive greps only (Decision 189: a negated
      rg exits 2 on no-match and reads as a false green). The fourth grep prints its match rather
      than suppressing it; see `expected` for why that is load-bearing.
    command: grep -q "candidate_sizes" src/common/ducklake_maintenance_ops.py && grep -q "strict_sizes" src/common/ducklake_maintenance_ops.py && grep -q "post_expiry" src/common/ducklake_maintenance_ops.py && grep -o -m1 "drain" src/common/ducklake_maintenance_ops.py
    expected: >-
      exit 0, with `drain` printed on stdout -- all four tokens present in the guard module,
      rec-3871's three acceptance tokens plus rec-3888's own half, which its filed acceptance greps
      for. CAUTION FOR ANY FUTURE EDIT OF THIS FIELD: validate_vp_replay's green-after leg
      (validate_vp_replay.py:416) requires EVERY backtick-quoted literal in this text to appear
      verbatim in the replayed command's captured stdout+stderr, so drain is the only token that may
      carry backticks here -- it is the one the command actually prints. Quoting a flag or any other
      token in this field silently adds an unsatisfiable assertion. The fourth grep prints its match
      from the file instead of suppressing it, which is why the evidence is file-derived rather than
      an echo asserting its own premise; see the amendment note at the end of this plan.
    fix_if: >-
      Non-zero exit means the sizing helper, its strictness argument or the post-expiry probe is
      missing or was reverted. Do not satisfy the grep with a comment mentioning the tokens.
    hermetic: true
    graduation: graduate
    graduation_check_id: g4-byte-source-and-post-expiry-bound
  - step: 2
    phase: pre-deploy
    action: >-
      Behavioural guard for the sizing, post-expiry-bound and dry-run-measurement surfaces.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4ByteSource" "tests/common/test_ducklake_maintenance_ops.py::TestG4PostExpiryBound" "tests/common/test_ducklake_gc_ops.py::TestG4SizeSourceIsStorage" "tests/common/test_ducklake_gc_ops.py::TestDryRunUnsizedCandidates" "tests/common/test_ducklake_gc_ops.py::TestMetricEmission::test_zero_live_bytes_raises_rather_than_reporting_debt_ratio_zero" "tests/common/test_ducklake_maintenance_storage.py::TestRelocatedStorageHelpers" "tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_lambda_maintenance_gc_fails_without_post_expiry_guard_stats" -q
    expected: >-
      All pass. Each is red on the unfixed tree: sizing is against the catalog map, the bound is
      pre-expiry, gc_ops passes no size source, dry_run has no unsized_candidates field, rec-3876's
      case gets 0.0 instead of a raise, the storage test file does not exist, and the smoke-gate
      test finds the new keys unrequired.
    fix_if: >-
      A zero-sized candidate means the size source is still the catalog live set. A bounded
      pre-expiry set means the re-probe landed before expire_snapshots. A missing unsized_candidates
      field means the dry-run measurement path was not split out and VP11's canary will be inert.
    hermetic: false
    graduation: graduate
    graduation_check_id: g4-guards-bound-the-post-expiry-set-with-real-sizes
  - step: 3
    phase: pre-deploy
    action: >-
      rec-3888's own property, in its own graduation slot so it fails independently: the drain walk
      selects the YOUNGEST fitting cutoff (not the oldest, which would delete nothing), REFUSES a
      cutoff that fits only by admitting zero, never crosses the grace floor, re-probes rather than
      sorting locally, bisects inside the bracket, and strictly shrinks a simulated backlog across
      passes -- including the clustered-backlog fixture where a bare ladder would select a
      zero-admitting rung and report a false drain.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4PartialDrain" -q
    expected: >-
      All pass. Red on the unfixed tree, where bound_deletions has only a wholesale-defer branch and
      no walk exists at all.
    fix_if: >-
      If the walk selects the oldest fitting rung the backlog never shrinks -- the anti-pattern
      rec-3871 named, since an older cutoff admits fewer candidates and "oldest that fits" is
      satisfied by deleting nothing. If the clustered fixture reports a drain with zero files
      deleted, the positive-admitted-count requirement is missing and the same stall has been
      reintroduced one rung out. If a cutoff below FILE_CLEANUP_GRACE_DAYS is reachable, the safety
      floor was clamped rather than refused.
    hermetic: false
    graduation: graduate
    graduation_check_id: g4-partial-drain-shrinks-the-backlog
  - step: 4
    phase: pre-deploy
    action: >-
      Never-weaken sweep at ASSERTION-MEANING level. THREE ripple kinds are expected and permitted:
      argument lists (the nine run_guarded_gc sites, the five run_gc sites), the
      g1_would_delete_candidates -> pre_expiry_would_delete_candidates KEY RENAME at :286, and the
      NON-EMPTY LIVE FIXTURES two TestNoPreludeAndReadOrdering tests need once rec-3876's `else 0.0`
      is dropped. What may not change is an assertion's MEANING: no relaxed comparison, no widened
      pytest.raises match, no dropped assert, no changed expected VALUE. The two tests rec-3871
      measured as at risk (:283, :371) are here by name.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal" "tests/common/test_ducklake_gc_ops.py::TestNoPreludeAndReadOrdering" "tests/common/test_ducklake_maintenance_ops.py::test_g1_disjoint_sets_via_run_guarded_gc_do_not_raise" "tests/common/test_ducklake_maintenance_ops.py::test_g4_defers_via_run_guarded_gc_skips_destructive_calls" "tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails" "tests/test_ducklake_maintenance.py" -q
    expected: >-
      All pass with no edit to their assertions. live_before is still the universal catalog set, the
      guard set still fails closed on introspection error, and an oldest-rung-still-over-cap pass
      still defers wholesale.
    fix_if: >-
      If an assertion's MEANING had to change to pass -- a relaxed comparison, a widened raises
      match, a dropped assert, a changed expected value -- the change weakened a shipped invariant
      (Decision 181 CONTENT never-weaken): revert and re-derive. The three ripple kinds named in
      `action` are NOT triggers for this clause; do not revert the key rename or the fixture edits,
      which are required by the design and are why those tests go red. Note that
      TestNoPreludeAndReadOrdering's first-occurrence comparison
      passes vacuously for the post-pass pair once the lister is called twice; TestG4SizeSourceIsStorage
      in VP2 is the designated replacement for that lost coverage, not this step.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates two already-graduated registry checks (guard-live-set-is-universal,
      gc-guards-fail-closed-on-introspection-error); a third slot over the same node ids would be
      registry churn rather than added discrimination.
  - step: 5
    phase: pre-deploy
    action: >-
      Real-engine anchors: the extended TestG4RealDryRunSizeColumn (post-expiry probe returns a
      superset of the pre-expiry probe on a never-expired catalog) and the s3:// path-shape anchor.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4RealDryRunSizeColumn" "tests/common/test_ducklake_maintenance_storage.py" -q
    expected: >-
      Passes, or SKIPS cleanly where the ducklake extension or S3 credentials are unavailable. The
      path-shape anchor reports zero symmetric difference between the engine `path` rows and the
      listing keys.
    fix_if: >-
      A non-empty symmetric difference means strict sizing would raise in production on a shape
      mismatch -- fix the path normalisation, never the assertion, and do not proceed to VP11's canary. A
      403 inside ducklake's listing path means the anchor used the legacy SET s3_* credential form
      instead of CREATE SECRET; that is an unmeasurable_arm hard failure, not a skip.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Both anchors are network-gated and skip in the default suite, so a registry slot would record
      a SKIP as a pass and manufacture a false green. The planning session reproduced the path-shape
      result by hand against the live smoke prefix -- see the context entry -- which is what licenses
      strict-by-default.
  - step: 6
    phase: pre-deploy
    action: >-
      Governance surfaces: the gc_ops verb documents the new response body, the amendment_log
      carries this change, the new Decision entry parses, and the runbook documents the fourth
      breaker cause.
    command: bin/venv-python -m pytest tests/decisions_md -q && grep -q "unsized_candidates" docs/runbooks/ducklake-catalog-operations.md && grep -q "unsized_candidates" docs/contracts/ducklake_maintenance.yaml && bin/venv-python -c "import yaml,io;d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8'));g=d['verbs']['gc_ops'];b=g['response_codes'][200];assert 'unsized_candidates' in b,'200 body missing the dry-run unsized_candidates field';assert 'post_expiry_would_delete_candidates' in b,'200 body missing the post-expiry key';assert len(d['amendment_log'])>=4,'no amendment entry appended';print('contract ok')"
    expected: exit 0; the decisions parser suite is green and both docs carry their edits.
    fix_if: >-
      A parser failure means the new entry breaks the Decision 167 envelope or the Decision 177
      append shape. A missing runbook token means the new breaker cause has no operator surface --
      the contract's typed_errors entry is not a substitute for the alarm-triage list.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The contract half duplicates the already-graduated gc-ops-verb-contract-and-amendment check,
      and the amendment-count assertion pins this plan's own count, which the next amendment
      invalidates.
  - step: 7
    phase: pre-deploy
    action: >-
      SURFACE-RETIREMENT SWEEP for the renamed guard_stats key. The smoke gate's check at
      lambda_maintenance_gates.py:92 is a SUBSET test, so a payload carrying BOTH the old and new
      keys passes it, and tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py:119
      spreads an explicit "g1_would_delete_candidates" that would survive untouched and green. Only
      a sweep proves the old surface is dead.
    command: bin/venv-python -c "import subprocess,sys;r=subprocess.run(['git','grep','-l','g1_would_delete_candidates'],capture_output=True,text=True);sys.exit('git grep errored rc='+str(r.returncode)+' '+r.stderr.strip()) if r.returncode not in (0,1) else None;ok=('docs/plans/','docs/DECISIONS','docs/contracts/ducklake_maintenance.yaml','docs/runbooks/ducklake-catalog-operations.md');bad=[f for f in r.stdout.split() if not f.startswith(ok)];sys.exit('retired key still referenced by '+repr(bad)) if bad else print('sweep ok')"
    expected: >-
      exit 0. The only surviving references are the four governance surfaces that must name the old
      key IN ORDER TO EXPLAIN THE RENAME: this plan, the Decision entry, the contract's
      amendment_log, and the runbook's triage rewrite. A git-grep returncode above 1 is an error,
      not a clean sweep, and fails loudly -- an empty stdout from a failed grep would otherwise read
      as "no hits" (the Decision 189 unmeasurable-arm false-green shape).
    fix_if: >-
      Any hit outside the four allowlisted governance surfaces is a live reference to a key the
      response no longer carries -- update it, and do not re-add the key to the payload to make the
      sweep pass. A returncode failure means git grep itself broke; fix the invocation rather than
      widening the allowlist, because an errored sweep proves nothing either way.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is true only during the retirement window -- once no tree references the old key
      it is green forever and discriminates nothing, so a standing registry slot would be a
      permanent no-op rather than a guard.
  - step: 8
    phase: pre-deploy
    action: Fast-tier gate (Decision 73 -- authoritative when PR CI runs it).
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: >-
      Read the named failing check. Do NOT relax a guard constant or a SLOC budget to pass
      (Decision 55 / Decision 128); if a scope file crosses its budget, decompose it.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: >-
      Pre-handoff FULL tier. handoff_policy.full_validation_required_before_commit is true, so the
      commit and PR wait for a completed exit 0; a timeout is `blocked`, not a pass.
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a completed run.
    fix_if: >-
      A full-tier-only failure is real, not tier noise -- diagnose it on the branch (ci-rca watches
      main only). If the run times out, treat the handoff as blocked and rerun from the start.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Governed code-deploy channel (Decision 125/126): both affected active artifacts ship through
      .github/workflows/deploy-ducklake-lambdas.yml on push-to-main, never a local build_lambda
      --deploy. Its maintenance-smoke job runs --lambda-maintenance-gc, a REAL destructive GC against
      the smoke catalog, now on the same strict posture as production. Read the printed guard_stats,
      not just the exit code: per rec-3892 the smoke candidate set is empty in steady state, so a
      green here proves shape and that the strict path executes, not the sizing arithmetic or the
      drain walk.
    command: >-
      echo 'DISPATCH VIA MCP -- mcp__github__actions_get for deploy-ducklake-lambdas.yml on the
      squash-merge commit; assert conclusion=success for the deploy-maintenance AND
      maintenance-smoke jobs, and read the MAINTENANCE_GC line guard_stats.'
    expected: >-
      Both jobs green; guard_stats carries the renamed and added keys, with g4_drain_cutoff_days
      either null (no candidates, the steady state) or >= 7 -- never a non-null value below the floor. The deploy-record freshness guard confirms source_git_sha == the merge sha.
    fix_if: >-
      A MAINTENANCE_GC failure naming a missing guard_stats key means the handler shipped without
      them -- check the deploy record before touching the gate. A strict-sizes raise on the smoke
      catalog is a real catalog/storage inconsistency (rec-3892 the standing suspect): RCA, do not
      re-run and do not loosen the guard (Decision 55).
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      PRE-ENABLEMENT CANARY on real production data, zero deletion. Precondition (OPERATOR, not this
      command): invoke action=gc_ops with dry_run=true against ducklake_ops -- explicit data_path +
      meta_schema -- which writes nothing; the admin Function URL is AWS_IAM and CI holds no invoke
