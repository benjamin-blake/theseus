  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      _REQUIRED_GUARD_STATS_KEYS (:53-63) tracks the rename and the additions:
      `g1_would_delete_candidates` -> `pre_expiry_would_delete_candidates`, plus
      `post_expiry_would_delete_candidates` and `g4_drain_cutoff_days`. Applied as a subset check at
      :92, so this both stays additive in mechanism and becomes a real pre-fix discriminator on
