schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: g4-byte-source-and-post-expiry-bound
intent: >-
  Restore G4's byte half from a size source that cannot silently vanish, and make G4 bound the
  candidate set the pass actually deletes, so the fail-closed guard set keeps real authority on the
  production gc_ops pass instead of degrading to a file-count-only cap over a pre-expiry set.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-g4-byte-source-and-post-expiry-bound.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      run_guarded_gc gains two REQUIRED keyword-only parameters -- candidate_size_source
      (path -> bytes, the map G4 joins its candidates against) and strict_sizes (bool). No default
      on either. BOTH callers pass strict_sizes=True: there is NO non-strict site, which is the
      instrument Decision 163 actually prescribes ("removing the exception path entirely") over an
      enumerated carve-out. The flag is retained rather than hardcoded for one precedented reason --
      the guard must stay FALSIFIABLE: test_g1_non_forcing_call_does_not_trip (:270-274) exists
      precisely to prove G1's forcing ARGUMENT, not an unconditional raise, is what trips it, and the
      same discipline applies here. A required parameter with no default and zero sanctioned False
      call sites is not a permissive default.
      The derived local is RENAMED from `candidate_bytes` (:227) to `candidate_sizes` -- the token
      rec-3871's acceptance grep depends on. bound_deletions' own parameter (:130) may be renamed to
      match; all five call sites pass the map positionally, so the rename is safe.
      SECOND CHANGE: RE-PROBE the dry-run cleanup/orphan candidate paths AFTER expire_snapshots and
      BEFORE cleanup_old_files/delete_orphaned_files, and bound THAT set with G4. Today
      would_delete_paths is probed at :205-208, bounded at :227-228, and the destructive calls at
      :231-232 delete whatever the engine computes post-expiry -- on a never-expired catalog neither
      G1's pre-check nor G4's bound covers the set actually deleted. The new probe reuses the same
      fail-closed try/except re-raise shape as the existing introspection sites (Decision 188 pt 3 --
      no permissive default).
      BOTH G1 CHECKS MOVE TO THE POST-EXPIRY SET. Decision 188 pt 2 defines G1 as "checked before and
      after any destructive call", so the pre-check at :216 runs against the post-expiry set (the set
      about to be deleted) and the post-destructive re-check at :249 -- currently
      `would_delete_paths & set(live_after)`, the PRE-expiry set -- is re-pointed at the post-expiry
      set too. Leaving :249 pre-expiry would make the post-pass reachability verdict cover a strict
      SUBSET of what was deleted, and the uncovered remainder is exactly the (post - pre) population
      this plan exists to cover.
      LIVE SIDE OF THE POST-EXPIRY G1 PRE-CHECK: reuse the `live_now` map already collected at
      :202-204; do NOT re-read the catalog. _collect_file_paths queries ducklake_list_files, which is
      current-snapshot scoped, and expire_snapshots retains at least SNAPSHOT_FLOOR snapshots
      including the current one, so the live set is provably unchanged across the expiry. A fresh
      re-read would add a fifth full catalog rescan per pass, compounding open rec-3878, for a value
      that cannot differ. The :249 re-check keeps using its own fresh `live_after` read, unchanged.
      GUARD_STATS KEY SEMANTICS (authoritative -- four surfaces must agree character-for-character):
      the seven shipped keys are retained; `g4_would_delete_files`, `g4_would_delete_bytes`,
      `g4_deferred_files`, `g4_deferred_bytes` and `g4_bounded` now describe the POST-EXPIRY set,
      because that is the set G4 bounds -- a deliberate, documented semantic change that the new
      Decision and the contract both record. `g1_would_delete_candidates` keeps its PRE-expiry
      meaning (what the pre-expiry probe saw). Exactly TWO keys are added:
      `g1_post_expiry_would_delete_candidates` and `g4_unsized_candidates` (the count of candidates
      the size source could not size -- always 0 in a passing strict run, and the loud signal the
      pre-enablement canary at VP10 reads). No other key is added or renamed.
      G1/G2/G3 predicates are otherwise untouched, and an over-budget pass still defers WHOLESALE
      (the partial drain is rec-3888, deferred).
  - file: src/common/ducklake_gc_ops.py
    action: Modify
    purpose: >-
      Take a PRE-pass storage listing (list_storage(data_path)) AFTER the universal catalog live-set
      collection and BEFORE anything destructive, and pass it as run_guarded_gc's
      candidate_size_source with strict_sizes=True. Storage is the correct and COMPLETE size source
      for both candidate classes: expired-snapshot cleanup files and true orphans are by
      construction present in storage and absent from the catalog live set, which is exactly why
      the current live_before join sizes every gc_ops candidate to zero (Decision 192 pt 5).
      The pre-pass listing IS taken in dry_run mode (a LIST is a read, so dry_run's no-write
      guarantee holds), and `would_delete_bytes_map` at :146-148 is RE-SOURCED from it -- the
      response field `would_delete_bytes` at :213 carries the same dead live_before join this plan
      fixes one level down, and dry_run never calls run_guarded_gc, so this is the only way the
      parent plan's VP14 baseline reading carries a real byte figure at all.
      Ordering stays catalog-first / storage-second at BOTH read pairs, so property 4's
      spurious-orphan-not-spurious-referenced-missing invariant is preserved and
      TestNoPreludeAndReadOrdering stays green. live_before keeps its current identity -- the
      universal CATALOG set feeding G1/G3 -- and is NOT replaced by storage; the size source is a
      separate argument precisely so
      test_live_before_passed_to_run_guarded_gc_is_the_universal_catalog_set_not_storage stays a
      never-weaken assertion. Emits exactly two ADDITIVE metrics, named authoritatively here:
      `GcWouldDeleteFilesPostExpiry` and `GcDeferredFiles`. `GcWouldDeleteFiles` keeps its existing
      pre-expiry meaning and value, since the merged parent plan's VP14/VP16 read it. Also closes
      rec-3876: drop the `else 0.0` silent substitution at :190 and let gc_debt_ratio raise on
      live_bytes <= 0, per its own documented contract.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      TWO changes. (1) NEW SHARED HOME for the storage lister: `_parse_s3_uri` and
      `_default_list_storage` move here from src/common/ducklake_gc_ops.py, and ducklake_gc_ops
      imports them. Both cadences now need a storage listing, and the smoke Lambda must not import
      the PRODUCTION verb module to get one -- its manifest deliberately bundles
      ducklake_maintenance.py and ducklake_maintenance_ops.py but NOT ducklake_gc_ops.py, and that
      exclusion is import governance worth keeping. Relocation only: no behaviour change, and the
      two relocated helper tests move with them.
      (2) run_gc gains a `data_path` parameter, builds the storage-derived size map from it, and
      passes candidate_size_source=<that map> with strict_sizes=True -- the SAME posture as
      production. There is no non-strict site anywhere. The earlier draft justified a carve-out here
      with "the smoke cadence has no storage lister"; that was FALSE and is retracted: the smoke
      handler already reads DUCKLAKE_DATA_PATH (handler.py:32, defaulting to
      ducklake_runtime.SMOKE_DATA_PATH = an s3:// URI) and the smoke Lambda's role already grants
      s3:ListBucket scoped to the smoke prefix (terraform/personal/ducklake_maintenance_smoke.tf:
      101-110). No terraform, no new IAM. rec-3871's measured hard-fail hazard does not carry over:
      it was measured against the CATALOG set, where orphans are structurally absent, not against a
      STORAGE set where they are present by construction.
      SLOC WATCH: this file is at 383 of 500 with no budget entry; the relocated helpers add ~30.
      If the total crosses, decompose per Decision 128 -- never register a raise.
  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Add BOTH new keys -- `g1_post_expiry_would_delete_candidates` and `g4_unsized_candidates` --
      to _REQUIRED_GUARD_STATS_KEYS (:53-63) so the CI smoke gc gate discriminates a pre-fix build on
      RESPONSE SHAPE, the same discriminator Decision 188 pt 5 installed for the retired breaker
      keys. The set is applied as a subset check at :92, so the addition is additive. Also assert
      `g4_unsized_candidates == 0`: under strict sizing a non-zero count is unreachable (the pass
      would have raised), so this is a cheap structural cross-check that the key means what the
      contract says.
      MEASURED VACUITY NOTE, recorded so a future session does not over-read this gate: the smoke
      candidate set is EMPTY in steady state -- CloudWatch FilesCleaned and OrphansDeleted are 0.0 on
      every sample across 21 days, and the latest green run reports g1_would_delete_candidates 0 /
      g4_would_delete_files 0. So this gate exercises G4's SHAPE, not its sizing arithmetic. The
      unexplained reason the smoke prefix never accumulates candidates is rec-3892; making this gate
      non-vacuous (smoke-shaped retention on a disposable catalog) is deliberately NOT in this plan's
      scope.
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      Add TestG4ByteSource (rec-3871's named acceptance class): a candidate absent from live_before
      but present in the declared size source sizes NON-ZERO; an unsized candidate raises under
      strict_sizes=True and is counted in g4_unsized_candidates under False -- the falsifiability
      pair proving the FLAG, not an unconditional raise, is what trips it (the discipline
      test_g1_non_forcing_call_does_not_trip already establishes for G1).
      Add TestG4PostExpiryBound: run_guarded_gc re-probes after expire_snapshots, G1-checks the
      post-expiry set against the reused live_now map, bounds THAT set, and -- the :249 half -- the
      post-destructive re-check also intersects the POST-expiry set, not the pre-expiry one.
      Extend test_guards_raise_when_catalog_introspection_fails to cover the new probe site.
      MECHANICAL RIPPLE, in scope and expected: all NINE existing run_guarded_gc call sites (lines
      96, 119, 156, 219, 233, 279, 285, 308, 378) must be threaded with the two new kwargs, because
      neither carries a default. That is an argument-list edit, never an assertion edit -- see VP3.
      The two shipped tests rec-3871 measured as at risk are
      test_g1_disjoint_sets_via_run_guarded_gc_do_not_raise (:283) and
      test_g4_defers_via_run_guarded_gc_skips_destructive_calls (:371); their ASSERTIONS must survive
      unmodified.
  - file: tests/common/test_ducklake_maintenance_storage.py
    action: Create
    purpose: >-
      New home for the relocated _parse_s3_uri / _default_list_storage tests (currently
      tests/common/test_ducklake_gc_ops.py::TestInternalHelpers:89-117), plus the REAL-ENGINE path-shape
      anchor: on the pinned engine with an s3:// DATA_PATH, the `path` column returned by
      _dry_run_orphan_paths must be byte-identical to _default_list_storage's `s3://bucket/key`
      keys. A separate file rather than appending to test_ducklake_maintenance_ops.py, which is at
      330 of 500 SLOC and already gaining two classes (Decision 128 decompose-by-default).
  - file: tests/common/test_ducklake_gc_ops.py
    action: Modify
    purpose: >-
      Add TestG4SizeSourceIsStorage: gc_ops passes the storage-derived map as candidate_size_source
      with strict_sizes=True while live_before stays the universal catalog set; the pre-pass storage
      listing precedes any destructive call and is taken in dry_run too; catalog-first ordering holds
      at both read pairs; `would_delete_bytes` is non-zero for a candidate present only in storage;
      and the two new metrics emit. Add rec-3876's own acceptance node id,
      TestMetricEmission::test_zero_live_bytes_raises_rather_than_reporting_debt_ratio_zero, driving
      live_bytes == 0 through gc_ops() and expecting a raise. REMOVE the two relocated helper tests
      (they move to the new file above, unchanged). _NO_GUARD_STATS (:58-63) currently carries only
      {"g2_snapshots_remaining": 2}; it gains g4_deferred_files (the source for GcDeferredFiles),
      g1_post_expiry_would_delete_candidates and g4_unsized_candidates, or the two shipped tests that
      patch run_guarded_gc with it (:244, :265) KeyError on the new metric emission.
  - file: tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      _GUARD_STATS_OK (:68-76) gains both new keys, plus
      test_lambda_maintenance_gc_fails_without_post_expiry_guard_stats -- a red-before case proving
      the gate FAILS on a guard_stats payload missing them, so a pre-fix build cannot report
      smoke-green.
  - file: src/lambdas/ducklake_maintenance_smoke/handler.py
    action: Modify
    purpose: >-
      action_gc passes the module-level DATA_PATH (:32) into maint.run_gc (:89) so the smoke cadence
      builds its storage-derived size source. One argument; no new import of the production verb
      module, because the lister now lives in ducklake_maintenance.py. The smoke manifest needs no
      change -- it already bundles that module.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Update the gc_ops verb's payload_schema_ref (pre-pass storage listing as the G4 size source,
      taken in dry_run too; G4 bounds the post-expiry set; strict sizing with no non-strict site),
      its 200 response body (both new guard_stats keys, the re-sourced `would_delete_bytes`, and the
      post-expiry semantics of the five g4_* keys), and its 500 typed_errors (a strict-sizes trip is
      breaker-class, as is the live_bytes<=0 raise -- this is the OPERATOR-FACING description of the
      new breaker cause, paired with the runbook row below), and append the Decision 118 Class B
      amendment_log entry. Also update the `gc` verb, whose sizing posture changes with run_gc. The
      existing graduated check gc-ops-verb-contract-and-amendment must still pass.
  - file: docs/runbooks/ducklake-catalog-operations.md
    action: Modify
    purpose: >-
      The alarm-triage section (:240-244) enumerates a MaintenanceBreakerTrip as a G1/G2/G3
      violation. This plan adds a FOURTH breaker cause with materially different triage -- a
      strict-sizes raise means the catalog scheduled a deletion for a path the storage listing could
      not size, i.e. a catalog/storage inconsistency, not a reachability breach. Add the row and the
      triage step (read g4_unsized_candidates and the named path; do NOT treat it as over-reclaim).
      Editing this grandfathered file is permitted; docs/CLAUDE.md forbids only NEW files under
      docs/runbooks/ (Decision 127).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Mint the next number (193 at authoring time -- re-derive from the file, DECISIONS.md is the
      numbering authority) amending Decision 188 pt 2 on three points: G4's byte source is the
      caller's DECLARED size source rather than a prelude-relative live inventory; G4 bounds the
      POST-expiry candidate set and BOTH G1 checks move to it, so the five g4_* guard_stats keys
      carry post-expiry values; and sizing is fail-closed at EVERY call site with no enumerated
      carve-out -- the Decision 163 instrument, not the Decision 188 pt 3 / Decision 191 pt 3
      named-exception grammar, which those precedents earn by degrading LOUDLY and which a silent
      zero-substitution would not. A fresh number, not an amendment_forms annotation: Decision 188's
      own significance envelope records that amendment_forms annotates rather than negates a prior
      entry's substance (rec-3016, Decision 180), and this replaces clause 2's stated byte source.
      Plus two Decision 177 dated blockquote appends -- on Decision 188 pointing at the new entry,
      and on Decision 192 pt 5, whose recorded limitation this discharges. Entry carries the Decision
      167 typed envelope with significance.value=numbered_decision and a justification naming the
      rejected contract-note alternative.
  - file: config/agent/verification_registry/entries/g4-byte-source-and-post-expiry-bound.yaml
