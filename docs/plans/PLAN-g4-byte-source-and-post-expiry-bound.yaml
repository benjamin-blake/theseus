      Also assert g4_drain_cutoff_days >= FILE_CLEANUP_GRACE_DAYS: the drain walk must never select
      a cutoff younger than the safety floor, and that is cheap to check on every push.
      MEASURED VACUITY NOTE, so a future session does not over-read this gate: the smoke candidate
      set is EMPTY in steady state -- CloudWatch FilesCleaned and OrphansDeleted are 0.0 on every
      sample across 21 days and the latest green run reports zero would-delete candidates. This gate
