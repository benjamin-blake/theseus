bundled_recommendations:
  - rec-3871
  - rec-3876
followon_recs:
  - rec-3888
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    run_guarded_gc takes candidate_size_source and strict_sizes as REQUIRED keyword-only parameters
    (no default on either), and BOTH call sites -- run_gc and gc_ops -- pass a storage-derived size
    source with strict_sizes=True. There is no non-strict call site anywhere in the tree.
  - >-
    A would-delete candidate absent from the catalog live set but present in the declared size
    source sizes NON-ZERO through bound_deletions; both GC paths therefore have a binding byte cap,
    not only a file-count cap.
  - >-
    strict_sizes=True raises DuckLakeMaintenanceError on a candidate the size source cannot size,
    and strict_sizes=False instead counts it in g4_unsized_candidates -- proving the flag, not an
    unconditional raise, is what trips it.
  - >-
    run_guarded_gc re-probes the dry-run cleanup/orphan candidate paths after expire_snapshots and
    applies G4's bound to that post-expiry set; BOTH G1 checks use it -- the pre-check against the
    REUSED pre-expiry live_now map (no additional catalog rescan), and the post-destructive re-check
    at :249 against its own fresh live_after read. The new probe raises on introspection failure
    like every other guard-path read.
  - >-
    guard_stats carries exactly two new keys, g1_post_expiry_would_delete_candidates and
    g4_unsized_candidates, and the five g4_* keys carry post-expiry values; the contract's 200
    response body documents both and the runbook documents the new breaker cause.
  - >-
    gc_ops takes its pre-pass storage listing after the universal catalog live-set collection and
    before any destructive call, in dry_run mode as well, leaves live_before as the universal CATALOG
    set, and re-sources the would_delete_bytes response field from it so the dry-run baseline carries
    a real byte figure.
  - >-
    _parse_s3_uri and _default_list_storage live in src/common/ducklake_maintenance.py, and the smoke
    Lambda reaches them without importing src/common/ducklake_gc_ops.py (which its manifest does not
    bundle).
  - >-
    gc_ops emits GcWouldDeleteFilesPostExpiry and GcDeferredFiles; GcWouldDeleteFiles keeps its
    existing pre-expiry meaning and value.
  - >-
    A real-engine test pins that the `path` column returned by the dry-run cleanup/orphan table
    functions is byte-identical to _default_list_storage's s3://bucket/key keys against an s3://
    DATA_PATH -- the pair strict sizing actually joins, not the data_file pair that governs
    referenced_missing.
  - >-
    gc_ops raises rather than reporting GcDebtRatio=0.0 when live_bytes <= 0 (rec-3876).
  - >-
    The CI smoke gc gate fails a guard_stats payload missing either new key, so a pre-fix build
    cannot report smoke-green.
  - >-
    Every shipped guard ASSERTION still passes unmodified: live_before stays the universal catalog
    set, catalog-first/storage-second ordering holds, the guard set still fails closed on
    introspection error, and an over-budget pass still defers wholesale.
  - >-
    rec-3871 and rec-3876 are closed in the warehouse; rec-3888 and rec-3892 stay open with their
    gates intact.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      rec-3871's acceptance grep half -- the guard module carries the byte-source, strictness and
      post-expiry surfaces. Positive greps only (Decision 189: a negated rg exits 2 on no-match and
      reads as a false green).
    command: grep -q "candidate_sizes" src/common/ducklake_maintenance_ops.py && grep -q "strict_sizes" src/common/ducklake_maintenance_ops.py && grep -q "post_expiry" src/common/ducklake_maintenance_ops.py
    expected: exit 0; all three tokens present in the guard module.
    fix_if: >-
      Non-zero exit means the parameterization or the post-expiry probe is missing or was reverted.
      Re-read the scope row for src/common/ducklake_maintenance_ops.py; do not satisfy the grep with
      a comment mentioning the tokens.
    hermetic: true
    graduation: graduate
    graduation_check_id: g4-byte-source-and-post-expiry-bound
  - step: 2
    phase: pre-deploy
    action: >-
      Behavioural guard across every new surface -- byte sourcing and strict/non-strict
      falsifiability, the post-expiry bound including the :249 re-check, the storage size source,
      rec-3876's raise, the relocated listers, and the smoke-gate shape discriminator.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4ByteSource" "tests/common/test_ducklake_maintenance_ops.py::TestG4PostExpiryBound" "tests/common/test_ducklake_gc_ops.py::TestG4SizeSourceIsStorage" "tests/common/test_ducklake_gc_ops.py::TestMetricEmission::test_zero_live_bytes_raises_rather_than_reporting_debt_ratio_zero" "tests/common/test_ducklake_maintenance_storage.py" "tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_lambda_maintenance_gc_fails_without_post_expiry_guard_stats" -q
    expected: >-
      All pass. Each is red on the unfixed tree: TestG4ByteSource sizes to zero, TestG4PostExpiryBound
      finds the pre-expiry set bounded, TestG4SizeSourceIsStorage finds no size source passed,
      rec-3876's case gets 0.0 instead of a raise, test_ducklake_maintenance_storage.py does not
      exist, and the smoke-gate test finds the new keys unrequired.
    fix_if: >-
      A zero-sized candidate means the size source is still joined against the catalog live set. A
      bounded pre-expiry set means the re-probe landed before expire_snapshots rather than after. A
      failure in the relocated lister tests means the move changed behaviour -- it must not. A
      passing smoke-gate payload means _REQUIRED_GUARD_STATS_KEYS was not extended.
    hermetic: false
    graduation: graduate
    graduation_check_id: g4-guards-bound-the-post-expiry-set-with-real-sizes
  - step: 3
    phase: pre-deploy
    action: >-
      Never-weaken sweep at ASSERTION level. Threading the two new required kwargs through the nine
      existing run_guarded_gc call sites is an expected mechanical ripple and is NOT a weakening; what
      may not change is any assert, any expected value, or any pytest.raises match. The two tests
      rec-3871 measured as at risk (:283 and :371) are both here by name.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal" "tests/common/test_ducklake_gc_ops.py::TestNoPreludeAndReadOrdering" "tests/common/test_ducklake_maintenance_ops.py::test_g1_disjoint_sets_via_run_guarded_gc_do_not_raise" "tests/common/test_ducklake_maintenance_ops.py::test_g4_defers_via_run_guarded_gc_skips_destructive_calls" "tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails" -q
    expected: >-
      All pass with no edit to their assertions. In particular live_before is still the universal
      catalog set (not storage), the first catalog read still precedes the first storage listing, and
      an over-budget pass still defers wholesale.
    fix_if: >-
      If an ASSERTION had to change to pass, the change weakened a shipped invariant (Decision 181
      CONTENT never-weaken) -- revert and re-derive: the size source is a SEPARATE argument precisely
      so live_before keeps its identity. An argument-list edit adding the two kwargs is expected and
      is not a trigger for this clause.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates two already-graduated registry checks (guard-live-set-is-universal,
      gc-guards-fail-closed-on-introspection-error); a third slot over the same node ids would be
      registry churn, not added discrimination.
  - step: 4
    phase: pre-deploy
    action: >-
      Real-engine anchors. (a) The extended TestG4RealDryRunSizeColumn: a post-expiry probe returns a
      superset of the pre-expiry probe on a never-expired catalog. (b) The PATH-SHAPE anchor, which is
      the evidence strict sizing rests on: against an s3:// DATA_PATH on the pinned engine, the `path`
      column from the dry-run cleanup/orphan table functions must be byte-identical to
      _default_list_storage's s3://bucket/key keys. A mocked-connection test cannot establish this --
      it can only assert its own fixtures agree with each other.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4RealDryRunSizeColumn" "tests/common/test_ducklake_maintenance_storage.py" -q -m "integration or not integration"
    expected: >-
      Passes, or SKIPS cleanly where the ducklake extension or S3 credentials are unavailable. The
      path-shape anchor reports zero symmetric difference between the engine paths and the listing
      keys.
    fix_if: >-
      A non-empty symmetric difference means strict sizing would raise in production on a shape
      mismatch -- fix the path normalisation, never the assertion, and do not proceed to VP9's
      canary until it is empty. A smaller post-expiry count means the re-probe ran against the wrong
      cutoff.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Both anchors are network-gated (ducklake extension download; live S3 for the path-shape half)
      and skip in the default suite, so a registry slot would record a SKIP as a pass and manufacture
      a false green. The planning session already reproduced the path-shape result by hand -- see the
      context entry -- which is what licenses strict-by-default here.
  - step: 5
    phase: pre-deploy
    action: >-
      Governance surfaces: the gc_ops verb documents the new response body, the amendment_log carries
      this change, the new Decision entry parses with its typed envelope, and the runbook documents
      the new breaker cause.
    command: bin/venv-python -m pytest tests/decisions_md -q && grep -q "g4_unsized_candidates" docs/runbooks/ducklake-catalog-operations.md && bin/venv-python -c "import yaml,io;d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8'));g=d['verbs']['gc_ops'];assert 'g1_post_expiry_would_delete_candidates' in g['response_codes'][200],'response body missing the post-expiry guard_stats key';assert len(d['amendment_log'])>=4,'no amendment entry appended';print('contract ok')"
    expected: exit 0; the decisions parser suite is green and both docs carry their edits.
    fix_if: >-
      A parser failure means the new entry breaks the Decision 167 envelope or the Decision 177
      append shape. A missing runbook token means the new breaker cause has no operator surface --
      the contract's typed_errors entry is not a substitute for the alarm-triage list.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The contract half duplicates the already-graduated gc-ops-verb-contract-and-amendment check,
      and the assertion pins this plan's own amendment count, which the next amendment invalidates.
  - step: 6
    phase: pre-deploy
    action: Fast-tier gate (Decision 73 -- authoritative when PR CI runs it).
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: >-
      Read the named failing check. Do NOT relax a guard constant or a SLOC budget to pass
      (Decision 55 / Decision 128); if a scope file crosses its budget, decompose it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-handoff FULL tier. handoff_policy.full_validation_required_before_commit is true, so the
      commit and PR wait for a completed exit 0 here; a timeout is `blocked`, not a pass.
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a completed run.
    fix_if: >-
      A full-tier-only failure is real, not tier noise -- diagnose it on the branch (ci-rca watches
      main only). If the run times out, treat the handoff as blocked and rerun the full tier from the
      start; do not fall back to the --pre result.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Governed code-deploy channel (Decision 125/126): the maintenance Lambdas ship through
      .github/workflows/deploy-ducklake-lambdas.yml on push-to-main, never a local build_lambda
      --deploy. Its deploy-maintenance job deploys BOTH affected active artifacts
      (ducklake_maintenance and ducklake_maintenance_smoke); its maintenance-smoke job runs
      --lambda-maintenance-gc, a REAL destructive GC against the smoke catalog, now running the SAME
      strict posture as production. Read the gate's printed guard_stats, not just its exit code:
      per rec-3892 the smoke candidate set is empty in steady state, so a green here proves the
      SHAPE and the strict code path executing, not the sizing arithmetic.
    command: >-
      echo 'DISPATCH VIA MCP -- mcp__github__actions_get for deploy-ducklake-lambdas.yml on the
      squash-merge commit; assert conclusion=success for the deploy-maintenance AND
      maintenance-smoke jobs, and read the MAINTENANCE_GC line guard_stats.'
    expected: >-
      Both jobs green, guard_stats carrying both new keys with g4_unsized_candidates=0. The
      deploy-record freshness guard confirms source_git_sha == the merge sha, so the smoke green is
      against this code and not a stale build.
    fix_if: >-
      A MAINTENANCE_GC failure naming a missing guard_stats key means the handler shipped without the
      new keys -- check the deploy record before touching the gate. A strict-sizes raise on the smoke
      catalog means a real catalog/storage inconsistency (rec-3892 is the standing suspect): RCA, do
      not re-run and do not loosen the guard (Decision 55).
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      PRE-ENABLEMENT CANARY on real production data, with zero deletion. Precondition (OPERATOR, not
      this command): invoke action=gc_ops with dry_run=true against ducklake_ops -- explicit
      data_path + meta_schema -- which writes nothing; the admin Function URL is AWS_IAM and CI holds
      no invoke grant, so the invoke stays human-run. This is the evidence the smoke cadence
      structurally cannot give: the production prefix is the only place the strict size join meets
      real candidate volume. Attach this reading to the parent plan's VP14 baseline gate -- the
      gc_ops rule must NOT be enabled (rec-3767) until it reports zero unsized candidates. The
      READ-BACK below is agent-executable on the ObservabilityMetricRead grant.
    command: aws cloudwatch get-metric-data --profile agent_platform --start-time "$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --metric-data-queries '[{"Id":"rm","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcReferencedMissing"},"Period":3600,"Stat":"Maximum"}},{"Id":"wd","MetricStat":{"Metric":{"Namespace":"DuckLakeMaintenance","MetricName":"GcWouldDeleteFiles"},"Period":3600,"Stat":"Maximum"}}]'
    expected: >-
      The dry_run invoke returns 200 rather than a 500 breaker trip, with unsized_candidates 0 and a
      NON-ZERO would_delete_bytes in the response body (the figure that was structurally 0 before
      this plan). GcReferencedMissing max == 0.
    fix_if: >-
      A 500 naming a strict-sizes raise is the canary doing its job -- the production catalog
      schedules a deletion for a path the listing cannot size. RCA the inconsistency (rec-3892 is the
      standing suspect) before enabling the schedule; do NOT relax strict sizing to get a green
      canary. A still-zero would_delete_bytes means the dry_run path never took the pre-pass listing.
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Close the bundled recommendations through the portal and confirm the read cache reflects it.
      rec-3888 and rec-3892 must remain open -- neither is resolved by this plan.
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()];st=lambda i:next(r['status'] for r in rows if r['id']==i);assert st('rec-3871')=='closed','rec-3871 still open';assert st('rec-3876')=='closed','rec-3876 still open';assert st('rec-3888')=='open','rec-3888 must stay open, its measurement gate is unmet';assert st('rec-3892')=='open','rec-3892 must stay open, it is a separate finding';print('closure ok')"
    expected: exit 0; both bundled recs closed, rec-3888 and rec-3892 still open.
    fix_if: >-
      A still-open bundled rec means the update_rec call did not land -- re-file through the portal,
      never by editing the read cache (Single Portal Invariant). A closed rec-3888 or rec-3892 means
      a finding was closed without its evidence; reopen it.
    graduation: not-applicable
