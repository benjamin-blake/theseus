constraints:
  - >-
    No rescue agents or workaround loops (Decision 55). A guard constant (G3_MAX_LIVE_BYTES_DROP,
    G4_MAX_DELETE_FILES, G4_MAX_DELETE_BYTES, FILE_CLEANUP_GRACE_DAYS) is NEVER relaxed to make a
    gate pass, and the drain walk is never allowed to cross the grace floor to admit more files.
  - >-
    CONTENT never-weaken (Decision 181): G4 must be shown strictly STRONGER, not merely different.
    No shipped ASSERTION may be edited to pass; threading new required arguments through existing
    call sites is an argument-list edit and is explicitly not covered by that clause.
  - >-
    NO exception path on a destructive flow (Decision 163). run_guarded_gc always sizes strictly and
    exposes no strictness parameter. The single non-strict arm is gc_ops's dry_run MEASUREMENT path,
    which deletes nothing; do not extend it to any path that can delete.
  - >-
    G1's live-set reads stay INDEPENDENT OF THE CALLER. Do not thread gc_ops's live_before into
    run_guarded_gc's internal pre-check to save a scan -- that is rec-3878's optimisation and would
    make G1 check the caller's own read. Reusing run_guarded_gc's OWN pre-expiry live_now for the
    post-expiry pre-check is a different thing and is required here. rec-3878 stays open.
  - >-
    live_before keeps its identity as the universal CATALOG set feeding G1/G3. The storage listing is
    a SEPARATE argument and never replaces it.
  - >-
    Read ordering is load-bearing: catalog live set FIRST, storage SECOND, at both read pairs
    (Decision 192 pt 3 / property 4).
  - >-
    The smoke Lambda must not import src/common/ducklake_gc_ops.py; that is why the listers move to
    ducklake_maintenance.py. ducklake_gc_ops must nonetheless re-export both names as its own module
    attributes -- seven shipped patch sites depend on it.
  - >-
    The drain walk searches from the YOUNGEST permitted cutoff outward. "Oldest cutoff that fits" is
    the anti-pattern rec-3871 named: an older cutoff admits fewer candidates, so it is satisfied by
    deleting nothing.
  - >-
    Lambda code deploys through .github/workflows/deploy-ducklake-lambdas.yml (Decision 125/126).
    `build_lambda --ducklake-only --deploy` is break-glass only and must not appear as a VP step.
  - >-
    No local terraform init/validate/plan (Decision 119). No terraform change is in scope: the
    gc_ops rule stays state=DISABLED, and enabling it remains rec-3767's human-gated step, now
    additionally gated on VP11's canary.
  - >-
    SLOC decompose-by-default (Decision 128). ducklake_maintenance.py (383) and
    test_ducklake_maintenance_ops.py (330) are the two near the line. If either crosses 500,
    decompose -- never register a raise.
  - >-
    rec-3892 (unexplained smoke-prefix object disappearance) is NOT fixed here -- out-of-scope
    findings become recommendations (Decision 59).
