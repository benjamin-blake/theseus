      the handler does not catch and no MaintenanceBreakerTrip is emitted, so the claim would be
      false). The `gc` verb changes too, since run_gc's sizing posture changes.
      AMENDMENT CLASS, named here rather than left to the implementer: the appended Decision 118
      Class B amendment_log entry carries change_class `field_add` with semantic_break TRUE, and
      narrates the key rename and the four g4_* redefinitions in `summary`.
      CORRECTION ON THE RECORD: an earlier draft of this row directed
      `schema_reshape_field_add_and_key_move` and claimed it was "already in the shipped
      vocabulary, one prior use". That was WRONG in the way that matters. ChangeClass is a CLOSED
      8-value enum (scripts/contracts_schema.py:50-60 -- field_add, not_null_tighten, type_widen,
      join_add, prose_improvement, governance_note_add, accepted_values_narrow,
      accepted_values_extend) and that token is not a member. This contract is Class B (line 19), so
      validate_contract_drift loads it through ContractDocument and the enum IS enforced: the
      directed value would have been a guaranteed PR-CI red. The single prior use is
      docs/contracts/inference-provider.yaml:24, a Class D contract whose amendment_log is never
      schema-validated -- no precedent for a Class B file.
      WHY field_add IS HONEST HERE, and not a misclassification made to keep a guard green: the
      class token is a coarse taxonomy with no "rename" member, so the precision lives in the two
      fields that do carry it -- `semantic_break: true` states the break, and `summary` states
      exactly which key moved and which four changed meaning. A non-member token would not have been
      more honest, only invalid. Extending the vocabulary is a governance change to a closed enum
      with its own test and Decision obligations and is deliberately NOT in this plan's scope.
      CONSEQUENCE: the shipped graduated shard gc-ops-verb-contract-and-amendment then passes
      UNMODIFIED (it asserts len(a)>=3 and that the last entry is field_add with semantic_break
      true -- both hold on a 4th field_add entry), so that shard is deliberately NOT a scope row.
      Touching it would be worse than pointless: validate_verification_registry runs a differential
      on any added-or-MODIFIED shard requiring its check_spec to FAIL on origin/main and pass on
      HEAD, and a merely-widened assertion still passes on origin/main, so the edit would be
      rejected as "not admitted -- revert did not produce FAIL (tautological)".
  - file: docs/runbooks/ducklake-catalog-operations.md
    action: Modify
    purpose: >-
      The alarm-triage section (:240-244) enumerates a MaintenanceBreakerTrip as a G1/G2/G3
      violation and states that a G4 violation keeps the trip at 0. Both become wrong: a
      strict-sizes raise is a FOURTH breaker cause with different triage (the catalog scheduled a
      deletion for a path the storage listing could not size -- a catalog/storage inconsistency,
      rec-3892 the standing suspect, NOT an over-reclaim breach), and a G4 over-budget pass now
      drains partially rather than always deferring. Add the cause, its triage step, and the drain
      semantics -- including how to read g4_drain_cutoff_days null, and its metric counterpart
      GcDrainCutoffDays = -1.0 (no cutoff admitted a positive count; the backlog is structurally
      undrainable at the current grace floor, which is an RCA trigger and NOT a benign deferral; -1.0
      is a sentinel, never a real cutoff, since a real one is always >= 7). Editing this grandfathered file is permitted; docs/CLAUDE.md forbids only NEW files
      under docs/runbooks/ (Decision 127).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Mint the next number (193 at authoring time -- re-derive from the file, DECISIONS.md is the
      numbering authority) amending Decision 188 pt 2 on four points: G4's byte source is the
