handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: g4-byte-source-and-post-expiry-bound
intent: >-
  Make G4 a guard that actually binds on the production GC pass: size its candidates from a source
  that cannot silently vanish, bound the set the pass really deletes, and drain an over-budget
  backlog in safe increments instead of deferring it forever -- so destructive GC can be licensed
  against a measured 23,476-file backlog rather than stalling on the first pass.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-g4-byte-source-and-post-expiry-bound.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      FOUR changes, all in the guard set.
      (1) SIZING. A new pure helper `size_candidates(paths, size_source, *, strict_sizes) ->
      (candidate_sizes, unsized_count)` performs the join G4 needs. The derived local is RENAMED
      from `candidate_bytes` (:227) to `candidate_sizes` -- the token rec-3871's acceptance grep
      depends on; bound_deletions' own parameter (:130) may be renamed to match, since all six call
      sites (5 test, 1 src) pass the map positionally.
      `strict_sizes=True` raises DuckLakeMaintenanceError naming the unsized path; `False` returns
      the count instead. run_guarded_gc calls it ALWAYS STRICT and takes no strictness parameter of
      its own -- no destructive path can be non-strict, which is the Decision 163 instrument
      ("removing the exception path entirely") rather than an enumerated carve-out. The `False` arm
      has exactly one production consumer, gc_ops's dry_run MEASUREMENT path (see that scope row):
      a dry-run deletes nothing, so counting is the correct behaviour there and a raise would make
      the pre-enablement canary unable to report what it exists to measure. That mirrors
      `force_conflict`, which likewise exists for a real production consumer (`probe_g1_trip`) and
      whose test `test_g1_non_forcing_call_does_not_trip` (:269-274) proves the ARGUMENT, not an
      unconditional raise, is what trips the guard.
      (2) run_guarded_gc gains a REQUIRED keyword-only `candidate_size_source` (path -> bytes). No
      default.
      (3) POST-EXPIRY SET. Re-probe the dry-run cleanup/orphan candidate paths AFTER
      expire_snapshots and BEFORE cleanup_old_files/delete_orphaned_files, and point BOTH G1 checks
      and G4's bound at that set. Today the probe is at :205-208, the bound at :227-228, and the
      destructive calls at :231-232 delete whatever the engine computes post-expiry -- on a
      never-expired catalog neither G1's pre-check nor G4's bound covers what is actually deleted.
      Decision 188 pt 2 defines G1 as "checked before and after any destructive call", so the
      post-destructive re-check at :249 (currently `would_delete_paths & set(live_after)`, the
      PRE-expiry set) moves too; leaving it pre-expiry would make the post-pass verdict cover a
      strict subset of the deletion. The pre-check's LIVE side reuses the `live_now` map already at
      :202-204 -- _collect_file_paths reads ducklake_list_files (current-snapshot scoped) and expiry
      retains the current snapshot, so the live set provably cannot change across it, and a re-read
      would add a fifth catalog rescan per pass (compounding open rec-3878) for an identical value.
      The :249 re-check keeps its own fresh `live_after` read.
      (4) PARTIAL DRAIN (rec-3888, pulled in). Over budget, the pass no longer defers wholesale. It
      walks the cleanup grace ladder from the YOUNGEST permitted cutoff outward -- 7 (=
      FILE_CLEANUP_GRACE_DAYS, the safety floor, never crossed), 14, 30, 60, 90, 180, 365 days --
      RE-PROBING the dry-run candidate set at each rung, and selects the FIRST (youngest) rung whose
      set fits both caps. Direction is load-bearing and is the hazard rec-3871 named: an OLDER
      cutoff admits FEWER candidates, so a search for "the oldest cutoff that fits" is satisfied by
      deleting nothing. Each rung needs a real re-probe, not a local sort -- both dry-run table
      functions return a single `path` column with no timestamp (verified on the pinned engine
      2026-09-15). The selected rung is passed to the destructive wrappers as an explicit
      `older_than`, so exactly the admitted set is deleted; G1 runs against that admitted set and G3
      after it. If even the oldest rung exceeds the caps the pass defers wholesale as today -- an
      honest residual, reported in guard_stats and metered, never a silent stall.
      GUARD_STATS KEYS (authoritative; four surfaces must agree character-for-character).
      `g1_would_delete_candidates` is RENAMED to `pre_expiry_would_delete_candidates`: once both G1
      checks evaluate the post-expiry set, no guard named G1 consumes the pre-expiry count and the
      `g1_` prefix would invite an operator to read 23,476 as "G1 checked 23,476 paths". Added:
      `post_expiry_would_delete_candidates`, `g4_drain_cutoff_days` (the rung selected; equals the
      configured grace when no walk was needed). Retained with POST-EXPIRY, POST-DRAIN meaning:
      `g4_would_delete_files`/`g4_would_delete_bytes` describe the ADMITTED set, and
      `g4_deferred_files`/`g4_deferred_bytes` the remainder left for the next pass. `g4_bounded`
      is true when a drain OR a wholesale defer occurred. `g2_snapshots_remaining` is untouched.
      G1/G2/G3 predicates themselves are unchanged.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      THREE changes.
      (1) SHARED HOME for the storage lister: `_parse_s3_uri` and `_default_list_storage` move here
      from ducklake_gc_ops. Both cadences need a listing and the smoke Lambda must not import the
      PRODUCTION verb module -- its manifest bundles ducklake_maintenance.py and
      ducklake_maintenance_ops.py but deliberately NOT ducklake_gc_ops.py. IMPORT FORM IS PINNED,
      not left to the implementer: ducklake_gc_ops must re-bind both names as its OWN module
      attributes (`from src.common.ducklake_maintenance import _default_list_storage,
      _parse_s3_uri`), NEVER reach them through its existing `maint.` alias. Six shipped sites
      patch `_default_list_storage` as a ducklake_gc_ops module attribute
      (tests/common/test_ducklake_gc_ops.py:222/237/266/303 and
      tests/lambdas/ducklake_maintenance/handler/test_gc_action.py:99/121); the `maint.` form breaks
      all six. This relocation is deliberately NOT a stale-reference sweep target -- the re-exported
      name must remain importable from ducklake_gc_ops.
      (2) run_gc gains `data_path` AND a `list_storage: StorageLister | None = None` injection seam
      mirroring gc_ops:116, builds the storage-derived size map, and passes it as
      candidate_size_source. Without the seam run_gc's strict path is unexercisable on a mocked
      connection. The earlier draft justified a non-strict carve-out here with "the smoke cadence
      has no storage lister"; that was FALSE and is retracted -- the smoke handler already reads
      DUCKLAKE_DATA_PATH (handler.py:32 -> ducklake_runtime.SMOKE_DATA_PATH, an s3:// URI) and its
      role already grants prefix-scoped s3:ListBucket
      (terraform/personal/ducklake_maintenance_smoke.tf:101-110). No terraform, no new IAM.
      rec-3871's measured hard-fail hazard was against the CATALOG map, where orphans are
      structurally absent; it does not carry to a STORAGE map where they are present by construction.
      (3) cleanup_old_files and delete_orphaned_files gain an optional explicit `older_than` that
      overrides the grace_days derivation, so the drain walk can delete exactly the rung it
      selected. grace_days remains the default and the floor; an older_than younger than
      now - FILE_CLEANUP_GRACE_DAYS is refused, not clamped.
      SLOC WATCH: 383 of 500 today; relocated helpers (~22) plus the two signature changes (~15)
      land near 420. If it crosses, decompose (Decision 128) -- never register a raise.
  - file: src/common/ducklake_gc_ops.py
    action: Modify
    purpose: >-
      Take a PRE-pass storage listing (list_storage(data_path)) AFTER the universal catalog live-set
      collection and BEFORE anything destructive, and pass it as run_guarded_gc's
      candidate_size_source. Storage is the correct and COMPLETE size source for both candidate
      classes -- expired-snapshot cleanup files and true orphans are present in storage and absent
      from the catalog live set, which is exactly why the current live_before join sizes every
      gc_ops candidate to zero (Decision 192 pt 5).
      DRY_RUN IS THE MEASUREMENT PATH and is where this plan's pre-enablement canary reads. The
      listing IS taken in dry_run (a LIST is a read, so the no-write guarantee holds), and
      `would_delete_bytes_map` at :146-148 is re-sourced from it via
      size_candidates(..., strict_sizes=False) -- counting, not raising, because a dry-run deletes
      nothing and a raise would destroy the measurement. The count is surfaced as a NEW TOP-LEVEL
      response field `unsized_candidates`, NOT inside guard_stats: dry_run never calls
      run_guarded_gc, so guard_stats is None in that mode (the shipped contract says so and two
      shipped tests assert it), and a canary reading a guard_stats key in dry_run would be inert.
      This also removes the silent `{p: storage.get(p, 0)}` substitution at :146 -- the same
      silent-zero shape being removed one line away at :190.
      Ordering stays catalog-first / storage-second at BOTH read pairs (Decision 192 pt 3 /
      property 4). live_before keeps its identity as the universal CATALOG set feeding G1/G3 and is
      NOT replaced by storage; the size source is a separate argument precisely so
      test_live_before_passed_to_run_guarded_gc_is_the_universal_catalog_set_not_storage stays a
      never-weaken assertion. Emits three ADDITIVE metrics, named authoritatively here:
      `GcWouldDeleteFilesPostExpiry`, `GcDeferredFiles` and `GcDrainCutoffDays`.
      `GcWouldDeleteFiles` keeps its existing pre-expiry meaning and value -- the parent plan's
      VP14/VP16 read it, and its 2026-09-14 reading of 23,476 is this plan's sizing evidence.
      Also closes rec-3876: drop the `else 0.0` substitution at :190 and let gc_debt_ratio raise on
      live_bytes <= 0, per its own documented contract.
  - file: src/lambdas/ducklake_maintenance_smoke/handler.py
    action: Modify
    purpose: >-
      action_gc passes the module-level DATA_PATH (:32) into maint.run_gc (:89) so the smoke cadence
      builds its storage-derived size source. One argument; no import of the production verb module,
