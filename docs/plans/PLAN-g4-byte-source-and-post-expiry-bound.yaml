schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: g4-byte-source-and-post-expiry-bound
intent: >-
  Restore G4's byte half from a size source that cannot silently vanish, and make G4 bound the
  candidate set the pass actually deletes, so the fail-closed guard set keeps real authority on the
  production gc_ops pass instead of degrading to a file-count-only cap over a pre-expiry set.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-g4-byte-source-and-post-expiry-bound.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      run_guarded_gc gains two REQUIRED keyword-only parameters -- candidate_size_source
      (path -> bytes, the map G4 joins its candidates against) and strict_sizes (bool). No default
      on either: Decision 163's structural-obligation rule and Decision 191 pt 3's precedent both
      refuse a permissive DEFAULT on a guard path, so every caller declares its posture at the call
      site and the non-strict site stays enumerable rather than inherited silently by any future
      caller that omits the argument. strict_sizes=True raises DuckLakeMaintenanceError on a
      candidate the size source cannot size; the derived local stays named candidate_sizes.
      SECOND CHANGE: RE-PROBE the dry-run cleanup/orphan candidate paths AFTER expire_snapshots and
      BEFORE cleanup_old_files/delete_orphaned_files, run the G1 reachability check against that
      post-expiry set, and bound THAT set with G4 instead of the pre-expiry one. Today
      would_delete_paths is probed at :205-208, bounded at :227-228, and the destructive calls at
      :231-232 delete whatever the engine computes post-expiry -- on a never-expired catalog neither
      G1's pre-check nor G4's bound covers the set actually deleted. The new probe reuses the same
      fail-closed try/except re-raise shape as the existing introspection sites (Decision 188 pt 3 --
      no permissive default).
      LIVE SIDE OF THE POST-EXPIRY G1 CHECK (fixed here, not left to the implementer): reuse the
      `live_now` map already collected at :202-204, do NOT re-read the catalog. _collect_file_paths
      queries ducklake_list_files, which is current-snapshot scoped, and expire_snapshots retains at
      least SNAPSHOT_FLOOR snapshots including the current one, so the live set is provably unchanged
      across the expiry. A fresh re-read would add a fifth full catalog rescan per pass, compounding
      open rec-3878, for a value that cannot differ.
      GUARD_STATS KEY SEMANTICS (authoritative -- four surfaces must agree character-for-character):
      the seven shipped keys are retained; `g4_would_delete_files`, `g4_would_delete_bytes`,
      `g4_deferred_files`, `g4_deferred_bytes` and `g4_bounded` now describe the POST-EXPIRY set,
      because that is the set G4 bounds -- a deliberate, documented semantic change that the new
      Decision and the contract both record. `g1_would_delete_candidates` keeps its PRE-expiry
      meaning (what G1's pre-check saw). Exactly ONE key is added:
      `g1_post_expiry_would_delete_candidates`. No other key is added or renamed.
      G1/G2/G3 predicates are untouched, and an over-budget pass still defers WHOLESALE (the partial
      drain is rec-3888, deferred).
  - file: src/common/ducklake_gc_ops.py
    action: Modify
    purpose: >-
      Take a PRE-pass storage listing (list_storage(data_path)) AFTER the universal catalog live-set
      collection and BEFORE anything destructive, and pass it as run_guarded_gc's
      candidate_size_source with strict_sizes=True. Storage is the correct and COMPLETE size source
      for both candidate classes: expired-snapshot cleanup files and true orphans are by
      construction present in storage and absent from the catalog live set, which is exactly why
      the current live_before join sizes every gc_ops candidate to zero (Decision 192 pt 5).
      The pre-pass listing IS taken in dry_run mode (a LIST is a read, so dry_run's no-write
      guarantee holds), and `would_delete_bytes_map` at :146-148 is RE-SOURCED from it -- the
      response field `would_delete_bytes` at :213 carries the same dead live_before join this plan
      fixes one level down, and dry_run never calls run_guarded_gc, so this is the only way the
      parent plan's VP14 baseline reading carries a real byte figure at all.
      Ordering stays catalog-first / storage-second at BOTH read pairs, so property 4's
      spurious-orphan-not-spurious-referenced-missing invariant is preserved and
      TestNoPreludeAndReadOrdering stays green. live_before keeps its current identity -- the
      universal CATALOG set feeding G1/G3 -- and is NOT replaced by storage; the size source is a
      separate argument precisely so
      test_live_before_passed_to_run_guarded_gc_is_the_universal_catalog_set_not_storage stays a
      never-weaken assertion. Emits exactly two ADDITIVE metrics, named authoritatively here:
      `GcWouldDeleteFilesPostExpiry` and `GcDeferredFiles`. `GcWouldDeleteFiles` keeps its existing
      pre-expiry meaning and value, since the merged parent plan's VP14/VP16 read it. Also closes
      rec-3876: drop the `else 0.0` silent substitution at :190 and let gc_debt_ratio raise on
      live_bytes <= 0, per its own documented contract.
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      run_gc passes the two new required arguments explicitly -- candidate_size_source=live_before
      (today's behaviour, unchanged) and strict_sizes=False. This is the SINGLE enumerated
      non-strict site, named in the same grammar Decision 188 pt 3 and Decision 191 pt 3 use for
      the merge_ops carve-outs. Non-strict is correct here and only here: the smoke cadence has no
      storage lister, and rec-3871 measured that a fail-closed default hard-fails the live smoke GC
      on its first orphan candidate and surfaces as MaintenanceBreakerTrip, indistinguishable from
      a real safety breach.
  - file: scripts/ducklake_smoke/lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      Add `g1_post_expiry_would_delete_candidates` to _REQUIRED_GUARD_STATS_KEYS (:53-63) so the CI
      smoke gc gate discriminates a pre-fix build on RESPONSE SHAPE -- the same discriminator
      Decision 188 pt 5 installed for the retired breaker keys. The set is applied as a subset check
      at :92, so the addition is additive to the gate's existing assertions.
  - file: tests/common/test_ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      Add TestG4ByteSource (rec-3871's named acceptance class): a candidate absent from live_before
      but present in the declared size source sizes NON-ZERO; strict_sizes=True raises on an unsized
      candidate while strict_sizes=False sizes it zero; and run_gc is the only non-strict call site.
      Add TestG4PostExpiryBound: run_guarded_gc re-probes after expire_snapshots, G1-checks the
      post-expiry set against the reused live_now map, and bounds THAT set -- red today, where a
      candidate appearing only post-expiry is deleted unbounded and unchecked. Extend
      test_guards_raise_when_catalog_introspection_fails to cover the new probe site, and extend the
      real-engine anchor TestG4RealDryRunSizeColumn with the post-expiry superset property.
      MECHANICAL RIPPLE, in scope and expected: all NINE existing run_guarded_gc call sites (lines
      96, 119, 156, 219, 233, 279, 285, 308, 378) must be threaded with the two new kwargs, because
      neither carries a default. That is an argument-list edit, never an assertion edit -- see VP3.
      The two shipped tests rec-3871 measured as at risk are
      test_g1_disjoint_sets_via_run_guarded_gc_do_not_raise (:283) and
      test_g4_defers_via_run_guarded_gc_skips_destructive_calls (:371); their ASSERTIONS must survive
      unmodified.
  - file: tests/common/test_ducklake_gc_ops.py
    action: Modify
    purpose: >-
      Add TestG4SizeSourceIsStorage: gc_ops passes the storage-derived map as candidate_size_source
      with strict_sizes=True while live_before stays the universal catalog set; the pre-pass storage
      listing precedes any destructive call and is taken in dry_run too; catalog-first ordering holds
      at both read pairs; `would_delete_bytes` is non-zero for a candidate present only in storage;
      and the two new metrics emit. It also pins the PATH-SHAPE equivalence -- the `s3://bucket/key`
      keys _default_list_storage emits must match the `data_file` shape _collect_file_paths reads --
      hermetically, with no network, closing the one failure mode that would turn strict_sizes into a
      first-pass MaintenanceBreakerTrip. Add rec-3876's own acceptance node id,
      TestMetricEmission::test_zero_live_bytes_raises_rather_than_reporting_debt_ratio_zero, driving
      live_bytes == 0 through gc_ops() and expecting a raise. _NO_GUARD_STATS (:58-63) gains
      `g1_post_expiry_would_delete_candidates`.
  - file: tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py
    action: Modify
    purpose: >-
      _GUARD_STATS_OK (:68-76) gains the new key, plus
      test_lambda_maintenance_gc_fails_without_post_expiry_guard_stats -- a red-before case proving
      the gate FAILS on a guard_stats payload missing it, so a pre-fix build cannot report
      smoke-green.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Update the gc_ops verb's payload_schema_ref (pre-pass storage listing as the G4 size source,
      taken in dry_run too; G4 bounds the post-expiry set), its 200 response body (the new
      `g1_post_expiry_would_delete_candidates` key, the re-sourced `would_delete_bytes`, and the
      post-expiry semantics of the five g4_* keys), and its 500 typed_errors (a strict-sizes trip and
      the live_bytes<=0 raise are both breaker-class), and append the Decision 118 Class B
      amendment_log entry. The existing graduated check gc-ops-verb-contract-and-amendment must still
      pass.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Mint the next number (193 at authoring time -- re-derive from the file, DECISIONS.md is the
      numbering authority) amending Decision 188 pt 2 on three points: G4's byte source is the
      caller's DECLARED size source rather than a prelude-relative live inventory; G4 bounds the
      POST-expiry candidate set, and the five g4_* guard_stats keys carry post-expiry values
      accordingly; and run_gc/ducklake_maintenance_smoke is the single enumerated non-strict site, in
      the same named-carve-out grammar Decision 188 pt 3 and Decision 191 pt 3 use. A fresh number,
      not an amendment_forms annotation: Decision 188's own significance envelope records that
      amendment_forms annotates rather than negates a prior entry's substance (rec-3016,
      Decision 180), and this replaces clause 2's stated byte source. Plus two Decision 177 dated
      blockquote appends -- on Decision 188 pointing at the new entry, and on Decision 192 pt 5,
      whose recorded limitation this discharges. Entry carries the Decision 167 typed envelope with
      significance.value=numbered_decision and a justification naming the rejected contract-note
      alternative.
  - file: config/agent/verification_registry/entries/g4-byte-source-and-post-expiry-bound.yaml
    action: Create
    purpose: >-
      Graduation slot for VP1 (primitive_slot command_exit_zero): the three rec-3871 acceptance
      tokens are present in the guard module. Filename equals check_id per Decision 176.
  - file: config/agent/verification_registry/entries/g4-guards-bound-the-post-expiry-set-with-real-sizes.yaml
    action: Create
    purpose: >-
      Graduation slot for VP2 (primitive_slot command_exit_zero, one pytest invocation over several
      node ids -- the shape guard-live-set-is-universal already uses): the behavioural guard across
      TestG4ByteSource, TestG4PostExpiryBound, TestG4SizeSourceIsStorage, rec-3876's node id and the
      smoke-gate shape test.
bundled_recommendations:
  - rec-3871
  - rec-3876
followon_recs:
  - rec-3888
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    run_guarded_gc takes candidate_size_source and strict_sizes as REQUIRED keyword-only parameters
    (no default on either), and both call sites -- run_gc and gc_ops -- pass them explicitly.
  - >-
    A would-delete candidate absent from the catalog live set but present in the declared size
    source sizes NON-ZERO through bound_deletions; the gc_ops path therefore has a binding byte cap,
    not only a file-count cap.
  - >-
    strict_sizes=True raises DuckLakeMaintenanceError on a candidate the size source cannot size;
    strict_sizes=False sizes it zero, and run_gc/ducklake_maintenance_smoke is the only caller
    passing False.
  - >-
    run_guarded_gc re-probes the dry-run cleanup/orphan candidate paths after expire_snapshots, runs
    the G1 reachability check on that post-expiry set against the REUSED pre-expiry live_now map
    (no additional catalog rescan), and applies G4's bound to the post-expiry set; the new probe
    raises on introspection failure like every other guard-path read.
  - >-
    guard_stats carries exactly one new key, g1_post_expiry_would_delete_candidates, and the five
    g4_* keys carry post-expiry values; the contract's 200 response body documents both.
  - >-
    gc_ops takes its pre-pass storage listing after the universal catalog live-set collection and
    before any destructive call, in dry_run mode as well, passes it as candidate_size_source with
    strict_sizes=True, leaves live_before as the universal CATALOG set, and re-sources the
    would_delete_bytes response field from it so the dry-run baseline carries a real byte figure.
  - >-
    gc_ops emits GcWouldDeleteFilesPostExpiry and GcDeferredFiles; GcWouldDeleteFiles keeps its
    existing pre-expiry meaning and value.
  - >-
    A hermetic test pins that the s3://bucket/key shape _default_list_storage emits matches the
    data_file path shape _collect_file_paths reads, so a key-shape mismatch cannot reach production
    as a first-pass strict-sizes raise.
  - >-
    gc_ops raises rather than reporting GcDebtRatio=0.0 when live_bytes <= 0 (rec-3876).
  - >-
    The CI smoke gc gate fails a guard_stats payload missing g1_post_expiry_would_delete_candidates,
    so a pre-fix build cannot report smoke-green.
  - >-
    Every shipped guard ASSERTION still passes unmodified: live_before stays the universal catalog
    set, catalog-first/storage-second ordering holds, the guard set still fails closed on
    introspection error, and an over-budget pass still defers wholesale.
  - >-
    rec-3871 and rec-3876 are closed in the warehouse; rec-3888 carries defect (b) forward with its
    measurement gate intact.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      rec-3871's acceptance grep half -- the guard module carries the byte-source, strictness and
      post-expiry surfaces. Positive greps only (Decision 189: a negated rg exits 2 on no-match and
      reads as a false green).
    command: grep -q "candidate_sizes" src/common/ducklake_maintenance_ops.py && grep -q "strict_sizes" src/common/ducklake_maintenance_ops.py && grep -q "post_expiry" src/common/ducklake_maintenance_ops.py
    expected: exit 0; all three tokens present in the guard module.
    fix_if: >-
      Non-zero exit means the parameterization or the post-expiry probe is missing or was reverted.
      Re-read the scope row for src/common/ducklake_maintenance_ops.py; do not satisfy the grep with
      a comment mentioning the tokens.
    hermetic: true
    graduation: graduate
    graduation_check_id: g4-byte-source-and-post-expiry-bound
  - step: 2
    phase: pre-deploy
    action: >-
      Behavioural guard across every new surface -- byte sourcing and strictness, the post-expiry
      bound, the storage size source and its path shape, rec-3876's raise, and the smoke-gate shape
      discriminator.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4ByteSource" "tests/common/test_ducklake_maintenance_ops.py::TestG4PostExpiryBound" "tests/common/test_ducklake_gc_ops.py::TestG4SizeSourceIsStorage" "tests/common/test_ducklake_gc_ops.py::TestMetricEmission::test_zero_live_bytes_raises_rather_than_reporting_debt_ratio_zero" "tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_lambda_maintenance_gc_fails_without_post_expiry_guard_stats" -q
    expected: >-
      All pass. Each is red on the unfixed tree: TestG4ByteSource sizes to zero, TestG4PostExpiryBound
      finds the pre-expiry set bounded, TestG4SizeSourceIsStorage finds no size source passed,
      rec-3876's case gets 0.0 instead of a raise, and the smoke-gate test finds the new key
      unrequired.
    fix_if: >-
      A zero-sized candidate means the size source is still joined against the catalog live set. A
      bounded pre-expiry set means the re-probe landed before expire_snapshots rather than after. A
      path-shape failure means _default_list_storage's keys do not match the data_file shape -- fix
      the shape, never the assertion. A passing smoke-gate payload means
      _REQUIRED_GUARD_STATS_KEYS was not extended.
    hermetic: false
    graduation: graduate
    graduation_check_id: g4-guards-bound-the-post-expiry-set-with-real-sizes
  - step: 3
    phase: pre-deploy
    action: >-
      Never-weaken sweep at ASSERTION level. Threading the two new required kwargs through the nine
      existing run_guarded_gc call sites is an expected mechanical ripple and is NOT a weakening; what
      may not change is any assert, any expected value, or any pytest.raises match. The two tests
      rec-3871 measured as at risk (:283 and :371) are both here by name.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_gc_ops.py::TestGuardLiveSetIsUniversal" "tests/common/test_ducklake_gc_ops.py::TestNoPreludeAndReadOrdering" "tests/common/test_ducklake_maintenance_ops.py::test_g1_disjoint_sets_via_run_guarded_gc_do_not_raise" "tests/common/test_ducklake_maintenance_ops.py::test_g4_defers_via_run_guarded_gc_skips_destructive_calls" "tests/common/test_ducklake_maintenance_ops.py::test_guards_raise_when_catalog_introspection_fails" -q
    expected: >-
      All pass with no edit to their assertions. In particular live_before is still the universal
      catalog set (not storage), the first catalog read still precedes the first storage listing, and
      an over-budget pass still defers wholesale.
    fix_if: >-
      If an ASSERTION had to change to pass, the change weakened a shipped invariant (Decision 181
      CONTENT never-weaken) -- revert and re-derive: the size source is a SEPARATE argument precisely
      so live_before keeps its identity. An argument-list edit adding the two kwargs is expected and
      is not a trigger for this clause.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates two already-graduated registry checks (guard-live-set-is-universal,
      gc-guards-fail-closed-on-introspection-error); a third slot over the same node ids would be
      registry churn, not added discrimination.
  - step: 4
    phase: pre-deploy
    action: >-
      Real-engine anchor, the TestG4RealDryRunSizeColumn pattern extended: on the pinned DuckLake
      engine, build a catalog with real cleanup/orphan candidates, size them from a real listing of
      the data directory, and confirm the post-expiry probe returns a superset of the pre-expiry
      probe on a never-expired catalog. Every other cleanup/orphan test here mocks the connection, so
      without this anchor both fixes can be green on a FakeCon and wrong in production.
    command: bin/venv-python -m pytest "tests/common/test_ducklake_maintenance_ops.py::TestG4RealDryRunSizeColumn" -q
    expected: >-
      Passes, or SKIPS cleanly when the ducklake extension cannot be fetched. A non-zero byte total
      from the out-of-band size map and a post-expiry candidate count >= the pre-expiry count.
    fix_if: >-
      A zero byte total on the real engine means the size map keys do not match DuckLake's data_file
      path shape -- note that this fixture uses a local tmp_path, so the s3:// shape itself is pinned
      by the hermetic test in VP2, not here. A smaller post-expiry count means the re-probe ran
      against the wrong cutoff.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      pytest.mark.integration and network-gated on the ducklake extension download -- it skips in the
      default suite, so a registry slot would record a SKIP as a pass and manufacture a false green.
  - step: 5
    phase: pre-deploy
    action: >-
      Contract and Decision surfaces: the gc_ops verb documents the new response body and the
      amendment_log carries this change; the new Decision entry parses with its typed envelope.
    command: bin/venv-python -m pytest tests/decisions_md -q && bin/venv-python -c "import yaml,io;d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8'));g=d['verbs']['gc_ops'];assert 'g1_post_expiry_would_delete_candidates' in g['response_codes'][200],'response body missing the post-expiry guard_stats key';assert len(d['amendment_log'])>=4,'no amendment entry appended';print('contract ok')"
    expected: exit 0; the decisions parser suite is green and the contract carries both edits.
    fix_if: >-
      A parser failure means the new entry breaks the Decision 167 envelope or the Decision 177
      append shape. A contract assertion failure means the verb doc was not updated alongside the
      code.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The contract half duplicates the already-graduated gc-ops-verb-contract-and-amendment check,
      and the assertion pins this plan's own amendment count, which the next amendment invalidates.
  - step: 6
    phase: pre-deploy
    action: Fast-tier gate (Decision 73 -- authoritative when PR CI runs it).
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: >-
      Read the named failing check. Do NOT relax a guard constant or a SLOC budget to pass
      (Decision 55 / Decision 128); if a scope file crosses its budget, decompose it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-handoff FULL tier. handoff_policy.full_validation_required_before_commit is true, so the
      commit and PR wait for a completed exit 0 here; a timeout is `blocked`, not a pass.
    command: bin/venv-python -m scripts.validate
    expected: exit 0 on a completed run.
    fix_if: >-
      A full-tier-only failure is real, not tier noise -- diagnose it on the branch (ci-rca watches
      main only). If the run times out, treat the handoff as blocked and rerun the full tier from the
      start; do not fall back to the --pre result.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Governed code-deploy channel (Decision 125/126): the maintenance Lambdas ship through
      .github/workflows/deploy-ducklake-lambdas.yml on push-to-main, never a local build_lambda
      --deploy. Its deploy-maintenance job deploys BOTH affected active artifacts
      (ducklake_maintenance and ducklake_maintenance_smoke); its maintenance-smoke job runs
      --lambda-maintenance-gc, a REAL destructive GC against the smoke catalog, which is the only
      place the post-expiry re-probe executes end-to-end on a live engine. The strict storage-derived
      size source is NOT exercised here -- smoke is the enumerated non-strict site and the production
      gc_ops rule is still state=DISABLED; see the rollback note.
    command: >-
      echo 'DISPATCH VIA MCP -- mcp__github__actions_get for deploy-ducklake-lambdas.yml on the
      squash-merge commit; assert conclusion=success for the deploy-maintenance AND
      maintenance-smoke jobs.'
    expected: >-
      Both jobs green. The deploy-record freshness guard confirms source_git_sha == the merge sha, so
      the smoke green is against this code and not a stale build.
    fix_if: >-
      A MAINTENANCE_GC failure naming a missing guard_stats key means the handler shipped without the
      new key -- check the deploy record before touching the gate. A G1/G2/G3 trip on the smoke
      catalog is a real regression in the re-probe: RCA, do not re-run (Decision 55).
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Close the bundled recommendations through the portal and confirm the read cache reflects it.
      rec-3888 must remain open -- its measurement gate (VP14/VP16 of
      PLAN-production-gc-and-storage-stability) is not satisfied by this plan.
    command: bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl') if l.strip()];st=lambda i:next(r['status'] for r in rows if r['id']==i);assert st('rec-3871')=='closed','rec-3871 still open';assert st('rec-3876')=='closed','rec-3876 still open';assert st('rec-3888')=='open','rec-3888 must stay open, its measurement gate is unmet';print('closure ok')"
    expected: exit 0; both bundled recs closed, rec-3888 still open.
    fix_if: >-
      A still-open bundled rec means the update_rec call did not land -- re-file through the portal,
      never by editing the read cache (Single Portal Invariant). A closed rec-3888 means defect (b)
      was closed without its measurement; reopen it.
    graduation: not-applicable
