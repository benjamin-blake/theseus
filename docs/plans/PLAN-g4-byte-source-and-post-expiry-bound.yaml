schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: g4-byte-source-and-post-expiry-bound
intent: >-
  Make G4 a guard that actually binds on the production GC pass: size its candidates from a source
  that cannot silently vanish, bound the set the pass really deletes, and drain an over-budget
  backlog in safe increments instead of deferring it forever -- so destructive GC can be licensed
  against a measured 23,476-file backlog rather than stalling on the first pass.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-g4-byte-source-and-post-expiry-bound.yaml
phase: T2.18
closes_criteria: []
scope:
  - file: src/common/ducklake_maintenance_ops.py
    action: Modify
    purpose: >-
      FOUR changes, all in the guard set.
      (1) SIZING. A new pure helper `size_candidates(paths, size_source, *, strict_sizes) ->
      (candidate_sizes, unsized_count)` performs the join G4 needs. The derived local is RENAMED
      from `candidate_bytes` (:227) to `candidate_sizes` -- the token rec-3871's acceptance grep
      depends on; bound_deletions' own parameter (:130) may be renamed to match, since all six call
      sites (5 test, 1 src) pass the map positionally.
      `strict_sizes=True` raises DuckLakeMaintenanceError naming the unsized path; `False` returns
      the count instead. run_guarded_gc calls it ALWAYS STRICT and takes no strictness parameter of
      its own -- no destructive path can be non-strict, which is the Decision 163 instrument
      ("removing the exception path entirely") rather than an enumerated carve-out. The `False` arm
      has exactly one production consumer, gc_ops's dry_run MEASUREMENT path (see that scope row):
      a dry-run deletes nothing, so counting is the correct behaviour there and a raise would make
      the pre-enablement canary unable to report what it exists to measure. That mirrors
      `force_conflict`, which likewise exists for a real production consumer (`probe_g1_trip`) and
      whose test `test_g1_non_forcing_call_does_not_trip` (:269-274) proves the ARGUMENT, not an
      unconditional raise, is what trips the guard.
      (2) run_guarded_gc gains a REQUIRED keyword-only `candidate_size_source` (path -> bytes). No
      default.
      (3) POST-EXPIRY SET. Re-probe the dry-run cleanup/orphan candidate paths AFTER
      expire_snapshots and BEFORE cleanup_old_files/delete_orphaned_files. Today the probe is at
      :205-208, the bound at :227-228, and the destructive calls at :231-232 delete whatever the
      engine computes post-expiry -- on a never-expired catalog neither G1's pre-check nor G4's
      bound covers what is actually deleted.
      WHICH SET EACH CHECK EVALUATES, stated per check because a drain makes the post-expiry set
      and the deleted set DIVERGE (in the no-drain case they coincide and the distinction is
      invisible, which is how an earlier draft of this row contradicted itself):
        - G1 pre-check (:216): the POST-EXPIRY set, against the reused pre-expiry `live_now` map.
          It runs before any deletion and the admitted set is always a subset, so checking the
          superset is strictly stronger and needs no second pre-check.
        - G4's over-budget DECISION: the POST-EXPIRY set -- that is what would be deleted if
          nothing bounded it, so it is what the caps must be tested against.
        - The drain walk's output, the ADMITTED set: the candidates at the selected cutoff.
        - G1 post-destructive re-check (:249): the ADMITTED set intersected with a fresh
          `live_after` read -- i.e. what was actually deleted. Currently it uses
          `would_delete_paths` (PRE-expiry); leaving it there would make the post-pass verdict
          cover a set that is neither what was checked nor what was deleted.
        - G3: unchanged, after the pass.
        - `g4_would_delete_files`/`g4_would_delete_bytes` report the ADMITTED set;
          `g4_deferred_files`/`g4_deferred_bytes` the post-expiry remainder;
          `post_expiry_would_delete_candidates` the full post-expiry count.
      The pre-check's LIVE side reuses the `live_now` map already at :202-204 --
      _collect_file_paths reads ducklake_list_files (current-snapshot scoped) and expiry retains
      the current snapshot, so the live set provably cannot change across it, and a re-read would
      add a fifth catalog rescan per pass (compounding open rec-3878) for an identical value.
      (4) PARTIAL DRAIN (rec-3888, pulled in). Over budget, the pass no longer defers wholesale.
      DIRECTION: candidate count is monotone NON-INCREASING as the cutoff moves older, so the
      YOUNGEST cutoff that fits is also the fitting cutoff admitting the MOST files. Searching for
      "the oldest cutoff that fits" is the anti-pattern rec-3871 named -- it is satisfied by a
      cutoff admitting nothing.
      THE ZERO-ADMITTING HOLE, and why a bare ladder does not close it: that same monotonicity
      means a cutoff admitting ZERO also "fits". With a fixed ladder of 7/14/30/60/90/180/365 days,
      a backlog clustered between two rungs reproduces exactly the stall this rec exists to remove
      -- e.g. 23,476 candidates all aged ~20 days give count(7) = count(14) = 23,476 (over cap) and
      count(30) = 0 (fits), so a naive walk selects rung 30, deletes nothing, and reports a
      successful "drain" while the wholesale-defer branch never fires. The walk therefore has THREE
      parts, not one:
        (i) LADDER, youngest first from FILE_CLEANUP_GRACE_DAYS (7, the safety floor, never
            crossed), to BRACKET the boundary: find the youngest rung that fits and the oldest rung
            that does not.
        (ii) BISECT on days inside that bracket, at most 8 further probes, to find the youngest
            cutoff that fits -- which is the one admitting closest to the caps. EIGHT, not five:
            the widest ladder bracket is (180, 365], 185 candidate days, and ceil(log2(185)) = 8.
            A five-probe budget leaves a ~6-day residual window, so the walk could only settle on
            the youngest KNOWN fitting day rather than the youngest fitting day -- which falsifies
            the property this plan asserts AND lets (iii)'s positivity test run at a settled day
            admitting zero while a day ~6 younger admits positive, manufacturing a false
            "structurally undrainable" verdict on a drainable backlog. At 8 the bisection resolves
            to a single day in every bracket, so the selected cutoff IS the youngest fitting cutoff
            and (iii) is evaluated there. Probe budget per over-budget pass: 7 rungs + 8 = 15.
        (iii) REQUIRE A POSITIVE ADMITTED COUNT. A cutoff that fits by admitting zero is NOT a
            drain. If no cutoff at or above the grace floor admits a positive count under both
            caps, the pass defers wholesale, sets `g4_drain_cutoff_days` to null and `g4_bounded`
            to true, and is reported loudly -- that state means the backlog is structurally
            undrainable at this grace floor and is an RCA trigger, never a silent stall.
      Every probe is a REAL re-probe of the dry-run primitives, never a local sort: both table
      functions return a single `path` column with no timestamp (verified on the pinned engine
      2026-09-15). The selected cutoff is passed to the destructive wrappers as an explicit
      `older_than`, so exactly the admitted set is deleted.
      MEASURABILITY (this plan's own standard, applied to its own premise): the dry_run measurement
      path runs the same bracketing walk read-only and reports, as a top-level `drain_probe_counts`
      field, a {days: {files, bytes}} map -- counts AND bytes per probe, sized from the same pre-pass
      storage listing -- so VP11's canary shows the production age distribution BEFORE rec-3767
      enables the schedule. BYTES ARE NOT OPTIONAL HERE: counts alone adjudicate
      G4_MAX_DELETE_FILES but cannot adjudicate G4_MAX_DELETE_BYTES, and per-rung bytes are not
      derivable from per-rung counts unless sizes are uniform. A canary blind to the byte half would
      be a canary blind to exactly the cap this plan exists to restore (Decision 192 pt 5). The
      sizing is free -- dict lookups against the listing already in hand, no extra query per rung.
      SCOPE OF THAT FIELD, stated because the plan may not overclaim its own evidence: dry_run does
      NOT run expire_snapshots, so every probe count is a PRE-EXPIRY count, and the post-expiry set
      is a strict superset on a never-expired catalog (which production is -- VP5 pins exactly that
      property). Positivity therefore CARRIES across expiry (n_post(c) >= n_pre(c), so a positive
      pre-expiry count stays positive), but "fits under both caps" does NOT (a cutoff fitting
      pre-expiry can be over cap post-expiry). drain_probe_counts is a NECESSARY, not sufficient,
      condition for the first real pass to drain: all-zero means it definitely will not, and a
      positive fitting cutoff means it may. The residual failure is loud, not unsafe -- a wholesale
      defer with a null cutoff. The plan measured a count
      (23,476), never an age distribution; without this field "the drain makes the first pass
      reclaim something" would be an assertion, which is precisely the kind of claim this plan
      exists to stop making about GC volume.
      GUARD_STATS KEYS (authoritative; four surfaces must agree character-for-character).
      `g1_would_delete_candidates` is RENAMED to `pre_expiry_would_delete_candidates`: once both G1
      checks evaluate post-expiry or admitted sets, no guard named G1 consumes the pre-expiry count
      and the `g1_` prefix would invite an operator to read 23,476 as "G1 checked 23,476 paths".
      Added: `post_expiry_would_delete_candidates`, `g4_drain_cutoff_days` (the selected cutoff in
      days; null when the pass deferred wholesale, equal to the configured grace when no walk was
      needed). `g4_bounded` answers "did G4 constrain this pass?" and is therefore TRUE in BOTH new
      states -- a partial drain and a wholesale defer -- and false only when no walk was needed.
      Today it is `not bound.proceed` (:263), which is undefined for a drain, since a drain both
      proceeds and is bounded; this pins it. The drain/defer distinction is carried by
      `g4_drain_cutoff_days` instead: non-null means drained at that cutoff, null means deferred.
      `g2_snapshots_remaining` is untouched. G1/G2/G3 predicates themselves are unchanged.
