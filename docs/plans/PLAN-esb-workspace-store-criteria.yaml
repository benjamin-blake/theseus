  - >-
    VERIFICATION EVIDENCE GATHERED AT PLAN TIME, not asserted. Every VP step was executed against a
    simulated post-change tree and against the current pre-edit tree: steps 1-4 exit 0 on the former
    and exit 1 with a specific diagnostic on the latter; step 7 is a regression invariant that passes
