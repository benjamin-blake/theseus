schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "esb-workspace-store-criteria"
intent: >-
  Close the criteria half of audit finding ESB-01 by recording, as a new pending candidate decision
  CD.43, the criteria against which the executor's workspace backing store will be selected -- and
  by naming those criteria from T4.1, the tier item that owns prepare_workspace. The store itself is
  NOT chosen here; that choice belongs to the CD.27 layer-2 spike, and this plan's guards exist
  largely to prove it was not made early.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-esb-workspace-store-criteria.yaml
phase: >-
  Platform T4 (executor substrate) -- contract remediation against tier_items T4.1, T4.2 and
  candidate_decision CD.27. Remediates the criteria half of finding ESB-01 from
  audits/executor-substrate-and-billing-shape-ad02653.yaml (finding entry at :824-844). Wave 2 of a
  5-wave remediation run; wave 1 (PLAN-esb-text-fix-bundle, merged as 155404d) already landed
  ESB-01's other half -- T4.2 criterion c1's workspace-continuity clause via CD.27 resume property P2.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Four sites. (a) NEW candidate_decision CD.43 appended after CD.42, carrying the
      workspace_store_selection block (status criteria_only, deferral marker, option_set,
      coverage_cases, selection_criteria W1-W8) plus a criteria-only discipline point. (b) NEW CD.27
      discipline_point "Layer-2 ratification precondition (ESB-01)", the sibling of the existing
      ESB-04 and ESB-06 preconditions, pointing at CD.43. (c) T4.1 gains one exit criterion naming
      CD.43 and W1-W8, and CD.43 appended to its related_candidate_decisions. (d) T4.2 gains CD.43 in
      related_candidate_decisions only -- its workspace criterion already landed in wave 1.
  - file: tests/esb_text_fix/test_workspace_store_criteria.py
    action: Create
    purpose: >-
      Eleven guards for the four edit sites, added to wave 1's existing package rather than a new one
      (see the PACKAGE LOCATION entry in context for the recorded reasoning). Nine fail on the
      pre-edit tree; two are regression guards that pass before and after by design.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    CD.43 exists as a candidate_decision in state `pending` with `ratified_as` absent and `filed_via`
    equal to the literal `pending_log_decision_lambda`, so the R2 rule of
    docs/contracts/candidate-decision-ratification.yaml holds, and it gates exactly [T4.1, T4.2] --
    both of which are real tier_items.
  - >-
    CD.43 carries exactly one `workspace_store_selection` block whose `selection_criteria` are
    EXACTLY W1-W8, each a non-empty string (not a YAML mapping -- a bare scalar carrying a
    colon-space silently becomes one, the hazard that bit wave 1). MECHANICALLY ENFORCED: the id set,
    the string typing, W3's region-pin and recompute clauses, and W8's Decision 100 binding. PROSE
    OBLIGATIONS, reviewed by the plan-critique gate and NOT asserted by any check -- W1 substrate
    portability across CD.27's pinned candidate set; W2 foreclosure disclosure; W4 egress-profile
    validity; W5 re-materialization cost carrying both a byte term and an object-count term; W6 scale
    basis; W7 coverage of every listed handoff case. The split is deliberate: content assertions are
    worth their brittleness only where a criterion could be silently gutted while still reading
    plausibly, which is true of W3 (a number instead of a basis) and W8 (a preference instead of an
    argument) but not of the descriptive criteria.
  - >-
    NO store is selected, asserted by a POSITIVE equality rather than a token absence:
    `status` == `criteria_only` and `selected_store` == the literal `TBD_at_CD.43_ratification`, so a
    blanked or removed field fails exactly as loudly as a real store name. `option_set` and
    `coverage_cases` are duplicate-free and meet their membership floors (seven options, three
    coverage cases), and `options_considered_and_rejected` is non-empty so a rejected candidate is
    recorded with its reason rather than silently omitted. These equality assertions live in VP steps
    3 and 5 and in the pytest module, and are deliberately NOT graduated -- they become false when
    wave 5 ratifies CD.43, and the registry has no retirement field.
  - >-
    No selection criterion publishes a CURRENCY-ANCHORED cost figure -- mechanically enforced as no
    `$` followed by a digit anywhere in the criteria; W3 instead names
    `terraform/personal/variables.tf` as the region pin and demands the figure be RECOMPUTED at
    decision time from the then-published rate. A criteria paper that ships a number ships a magic
    ceiling that is stale the day it lands. SCOPE OF ENFORCEMENT, stated rather than implied: the
    regex catches the `$0.045` form and NOT a bare unit-denominated one such as "0.045 per GB-month"
    or "32 USD". It is deliberately not widened, because a general numeric ban would false-positive
    on the criterion ids themselves and on "Decision 100"; keeping figures out in the unanchored form
    is a prose obligation reviewed at the plan-critique gate, not a mechanically-caught one.
  - >-
    W8 binds to Decision 100 by name, so a store that substitutes custom scripting for a managed
    primitive must be ARGUED against that Decision at ratification rather than winning on
    portability alone. Asserted inside the same graduated check as the rest of the criteria set, not
    only in the pytest module -- an unbound W8 is the exact bias the decision-scout gate flagged.
  - >-
    T4.1 carries EXACTLY ONE exit criterion naming CD.43; it binds to `workspace_uri`, names all
    eight criterion ids W1-W8, and names none of `option_set`'s stores as chosen. This is ESB-01's
    literal acceptance ("a tier item names the mechanism and its criteria"), and the store-absence
    half is only meaningful because the W-id half is asserted positively alongside it.
  - >-
    Every tier item CD.43 gates names CD.43 back in its `related_candidate_decisions`, so the CD is
    reachable from the tier-item reader and cannot become an orphan.
  - >-
    CD.27's string discipline_points name layer-2 ratification preconditions for ESB-01, ESB-04 and
    ESB-06, each finding id claimed exactly once, and the ESB-01 entry points at CD.43. Asserted as a
    membership floor plus a uniqueness invariant, never an exact count -- wave 5 may legitimately add
    a fourth.
  - >-
    SCOPE DISCIPLINE, stated semantically: every CD.27 string discipline_point present on origin/main
    is still present byte-identical after this change (the edit is append-only), which proves the
    wave-3/ESB-02-owned maturity-monitoring clause is unedited. This deliberately does NOT assert
    "the line is absent from the diff" -- that phrasing false-positives on adjacent-edit context
    bleed, which is why the companion diff assertion uses `git diff -U0`.
  - >-
    No tier_item id appears in a `- id:` line of the roadmap diff, so validate_platform_roadmap check
    (ii) -- which force-flags bare-string criteria on any tier_item whose header enters the diff --
    does not fire against T4.1's or T4.2's bare-string criteria. T4.1's exit_criteria all remain
    strings.
  - >-
    PUBLIC-repository boundary asserted mechanically over CD.43's serialized text: no `arn:` and no
    12-digit account-id-shaped token. Bound to VP step 2's command (the GRADUATED one) as well as to
    the pytest module, so it survives as a standing guard rather than living only in this plan's
    test run. Scoping note: the no-cost-figure rule is deliberately narrower, applying to
    `selection_criteria` only rather than to all of CD.43 -- a criterion should never be a number
    even after ratification, whereas CD.43's `detail` may legitimately carry costs once the store is
    selected, so a whole-block figure ban would redden wave 5 for doing the right thing.
  - >-
    The four verification-registry rows graduated by wave 1 (t4x-persona-contracts-mechanism-word-free,
    executor-tf-paths-under-terraform-personal, cd27-stability-gate-evaluable,
    sfn-transition-line-arithmetic-consistent) still exit 0 against the post-change tree, and wave 1's
    34 guards in tests/esb_text_fix/ still pass.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      CD.43 parses under the CandidateDecision Pydantic model and is R2-shaped. CandidateDecision is
      extra="forbid", so the criteria MUST live inside discipline_points (a list[Any] that accepts a
      mapping entry, as CD.27's resume_properties block already does) and never as a new top-level
      key; this step is the specific structural risk that design carries.
    command: |-
      bin/venv-python -c "
      from scripts.roadmap.platform_roadmap import load
      d = load('docs/ROADMAP-PLATFORM.yaml')
      cds = [c for c in d.candidate_decisions if c.id == 'CD.43']
      assert cds, 'CD.43 absent from candidate_decisions -- the criteria CD was never added'
      cd = cds[0]
      assert cd.state == 'pending', cd.state
      assert cd.ratified_as is None, cd.ratified_as
      assert cd.filed_via == 'pending_log_decision_lambda', cd.filed_via
      assert cd.gates == ['T4.1', 'T4.2'], cd.gates
      ids = {i.id for i in d.tier_items}
      dangling = [g for g in cd.gates if g not in ids]
      assert not dangling, f'CD.43 gates nonexistent tier_item(s): {dangling}'
      blocks = [p for p in cd.discipline_points if isinstance(p, dict) and 'workspace_store_selection' in p]
      assert len(blocks) == 1, f'workspace_store_selection must appear exactly once, found {len(blocks)}'
      print('OK CD.43 pending, R2-shaped, gates T4.1/T4.2')
      "
    expected: >-
      Exit 0, printing `CD.43 pending, R2-shaped, gates T4.1/T4.2`. Proves the whole roadmap still
      loads under the schema, that CD.43 satisfies the R2 rule of
      docs/contracts/candidate-decision-ratification.yaml (pending CDs carry no ratified_as and only
      the historical pending literal in filed_via), that both gated ids resolve to real tier_items,
      and that the criteria block exists exactly once.
    fix_if: >-
      A pydantic ValidationError naming an unexpected CD.43 key means the criteria were added as a
      new TOP-LEVEL key on the CD; move the whole block inside `discipline_points` as a mapping entry
      -- CandidateDecision forbids extra keys and this is the one shape that is legal. A filed_via
      mismatch means the ratified-lane vocabulary was invented rather than copied; the literal is
      `pending_log_decision_lambda` and R2 accepts nothing else on a pending CD. A dangling gate means
      a tier_item id was mistyped. "found 0" for the block means the mapping entry was written with
      the wrong key name.
    graduation: waive
    graduation_waiver_reason: >-
      The schema-load and R1/R2/R3 halves are already covered by two checks registered in BOTH tiers
      -- validate_platform_roadmap and validate_candidate_decision_ratification -- which run on every
      PR regardless of this plan. A registry row would re-execute the same schema load under a second
      name. Note this step's own state/ratified_as/filed_via assertions are TRANSIENT -- they become
      false when CD.43 ratifies -- which is a second, independent reason not to graduate them. The
      CD.43-specific content assertions that are durable and not covered by those checks graduate
      under step 2 instead, so nothing is lost by waiving here.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: >-
      KEYSTONE, DURABLE HALF -- the assertions that stay true after CD.43 ratifies, verified
      INDEPENDENTLY of the plan's own test package. Exactly W1-W8 exist as non-empty strings; the
      coverage set is duplicate-free and meets its membership floor; no criterion publishes a
      `$`-anchored cost figure; W3 names the region pin and demands recomputation; W8 binds to
      Decision 100; the block carries no confidential identifier. The isinstance(str) sweep is the
      colon-space YAML hazard guard -- eight folded scalars is eight chances to author a mapping by
      accident. Every assertion here survives the store being chosen, which is precisely why this
      is the step that graduates. GROWTH-SAFE BY CONSTRUCTION: every collection assertion here is a
      membership FLOOR, never an exact set -- including the criterion ids, so wave 5 may add a W9
      without reddening a standing row it never touched. The ratchet that keeps a new criterion from
      being ignored lives in step 4, which requires T4.1 to name every id actually present in
      selection_criteria rather than a hardcoded eight. CODE-REVIEW ROUND 1 FIX (M3): the
      option_set breadth floor (`required_opts <= set(opts)`) moved OUT of this step into step 3.
      It has the mirror problem of the transient status/selected_store equality this keystone
      already splits on -- growth is durable, but at ratification NARROWING option_set to the
      selected store is equally legitimate, so a floor over the candidate set is transient, not
      durable, and does not belong in a standing row. option_set's duplicate-freedom is transient
      alongside it for the same reason; only coverage_cases (which describes what must be covered,
      not which stores are still candidates) stays here.
    command: |-
      bin/venv-python -c "
      import re, yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cds = [c for c in d['candidate_decisions'] if c['id'] == 'CD.43']
      assert cds, 'CD.43 absent -- the criteria CD was never added'
      blocks = [p for p in cds[0]['discipline_points'] if isinstance(p, dict) and 'workspace_store_selection' in p]
      assert len(blocks) == 1, f'workspace_store_selection must appear exactly once, found {len(blocks)}'
      b = blocks[0]['workspace_store_selection']
      sc = b['selection_criteria']
      required_ids = {'W1','W2','W3','W4','W5','W6','W7','W8'}
      assert required_ids <= set(sc), f'selection_criteria missing {sorted(required_ids - set(sc))}'
      bad = {k: type(v).__name__ for k, v in sc.items() if not isinstance(v, str) or not v.strip()}
      assert not bad, f'criteria must be non-empty strings (a colon-space turns a scalar into a mapping): {bad}'
      cases = b['coverage_cases']
      assert len(cases) == len(set(cases)), f'coverage_cases has duplicates: {cases}'
      assert {'cross_invocation_persistence','inter_persona_handoff','persona_to_ecs_task_handoff'} <= set(cases), cases
      assert b['options_considered_and_rejected'], 'a rejected option must be recorded with its reason, not silently omitted'
      money = {k: re.search(r'[\$]\s*\d', v).group(0) for k, v in sc.items() if re.search(r'[\$]\s*\d', v)}
      assert not money, f'a criterion publishes a cost figure instead of a basis: {money}'
      assert 'terraform/personal/variables.tf' in sc['W3'], 'W3 must name the region-pin source'
      assert 'RECOMPUTED' in sc['W3'], 'W3 must demand recomputation at decision time'
      assert 'Decision 100' in sc['W8'], 'W8 must name Decision 100 as the standard a self-built store argues against'
      blob = yaml.safe_dump(cds[0], sort_keys=False)
      assert 'arn:' not in blob.lower(), 'CD.43 text contains an ARN (PUBLIC repository)'
      assert not re.search(r'(?<!\d)\d{12}(?!\d)', blob), 'CD.43 text contains a 12-digit account-id-shaped token'
      print('OK', len(sc), 'criteria well-formed;', len(cases), 'coverage cases covered')
      "
    expected: >-
      Exit 0, printing `criteria well-formed;` with the criterion and coverage-case counts. Proves
      the criteria set is complete, well-typed and figure-free, that W3 states a recomputable basis
      instead of a number, that W8 binds to Decision 100, and that a rejected option was recorded
      rather than silently dropped. Verified by mutation this session: removing W8 fails with
      "expected exactly W1-W8"; stripping both Decision 100 references from W8 fails with "W8 must
      name Decision 100"; inserting a NAT figure into W3 fails with "publishes a cost figure";
      planting an ARN or a 12-digit token fails the PUBLIC-boundary assertions. Illustrative values
      in this field are deliberately NOT backticked -- validate_vp_replay treats every backtick
      literal in an expected field as a required substring of stdout, so only the printed token
      above carries backticks.
    fix_if: >-
      "expected exactly W1-W8" means a criterion was dropped or renamed -- restore the missing id
      rather than renumbering the survivors, because T4.1's criterion (step 4) names all eight by id
      and would then dangle. A non-string type for some Wn means that criterion was authored as a
      bare scalar containing a colon-space and YAML parsed it as a mapping; re-author it as a `>-`
      folded block scalar. "publishes a cost figure" means a criterion carried a number instead of a
      basis; state the rate source and the arithmetic to perform, not the result. "W8 must name
      Decision 100" means the managed-primitive criterion was written as a generic preference rather
      than binding to the Decision that makes it enforceable -- an unbound W8 restores exactly the
      bias the decision-scout gate flagged, since a self-built store could then satisfy it with a
      sentence rather than an argument. A missing coverage case means a handoff scenario was dropped
      from evaluation; restore it -- unlike option_set, coverage_cases describes the obligation, not
      the candidate set, so it never legitimately narrows.
    graduation: graduate
    graduation_check_id: cd43-selection-criteria-well-formed
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: >-
      KEYSTONE, TRANSIENT HALF -- the "no store has been chosen" assertions, deliberately kept OUT of
      the graduated set. Both are equality assertions against literals, so neither can be satisfied by
      deleting the field: status must equal criteria_only and selected_store must equal the deferral
      marker. These become FALSE the moment wave 5 does the right thing and ratifies CD.43, which is
      exactly why they must not become a standing registry row. CODE-REVIEW ROUND 1 FIX (M3): also
      carries the option_set breadth floor (all seven pinned candidates present, duplicate-free) that
      moved out of step 2's graduated command. option_set breadth is transient for the same reason
      status/selected_store are -- a ratifying wave legitimately NARROWS option_set to the selected
      store, so a floor requiring the full pre-ratification candidate list would redden main for
      doing the right thing; it belongs beside its sibling transient assertions, not in a standing row.
    command: |-
      bin/venv-python -c "
      import yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cds = [c for c in d['candidate_decisions'] if c['id'] == 'CD.43']
      assert cds, 'CD.43 absent -- the criteria CD was never added'
      b = [p for p in cds[0]['discipline_points'] if isinstance(p, dict) and 'workspace_store_selection' in p][0]['workspace_store_selection']
      assert b['status'] == 'criteria_only', f\"status is not criteria_only: {b['status']!r}\"
      assert b['selected_store'] == 'TBD_at_CD.43_ratification', f\"a store was selected: {b['selected_store']!r}\"
      opts = b['option_set']
      assert len(opts) == len(set(opts)), f'option_set has duplicates: {opts}'
      required_opts = {'efs_mount','s3_sync','container_local_disk','git_as_store_commit_at_step_boundaries','s3_express_one_zone','fsx_managed_filesystem','lambda_ephemeral_tmp_10gb'}
      assert required_opts <= set(opts), f'option_set missing {sorted(required_opts - set(opts))}'
      print('OK store choice deferred; option set at full pre-ratification breadth')
      "
    expected: >-
      Exit 0, printing `store choice deferred`. Proves this wave recorded criteria and chose nothing,
      and that option_set still carries the full seven-candidate evaluation set. Verified by mutation
      this session: replacing the marker with a real store name fails with "a store was selected";
      dropping a candidate from option_set fails with "option_set missing".
    fix_if: >-
      "a store was selected" or "status is not criteria_only" means the implementation chose a
      backing store, which this wave must NOT do -- restore the deferral marker and leave the choice
      to the CD.43 ratification alongside the layer-2 spike. "option_set missing" means a candidate
      store was dropped from the evaluation set during THIS wave; restore it -- narrowing the set is a
      substantive decision that belongs to the ratifying plan, not to this one. If this step fails
      during a LATER wave that is legitimately ratifying CD.43 (a real store choice, or a deliberate
      narrowing of option_set to it), the correct response is to delete this plan's guard module along
      with this step, not to weaken either -- they are wave-2 artefacts by design.
    graduation: waive
    graduation_waiver_reason: >-
      Deliberately un-graduated because it is TRUE ONLY DURING THIS WAVE. The registry has no expiry
      or retirement field, so a row asserting selected_store == the deferral marker (or the full
      option_set breadth) would redden main the moment wave 5 ratifies CD.43, with no owner and no
      obvious remedy except weakening the check -- which is how a guard becomes worse than no guard.
      The durable half of this keystone graduates under step 2 instead. This is the same reasoning
      that waives the scope-discipline step: a guard that stops being true by design does not belong
      in a store of standing guards.
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: >-
      ESB-01's literal acceptance ("a tier item names the mechanism and its criteria"), plus the
      bidirectional link that keeps CD.43 reachable from the tier-item reader, plus the T4.1
      bare-string invariant -- the deliberate sibling of wave 1's identical guard on T4.2. Appending a
      criterion never puts T4.1's header into the diff, so validate_platform_roadmap check (ii) will
      not fire and cannot serve as the backstop here; this step is that backstop. THE RATCHET: the
      required id list is read from CD.43's own selection_criteria at run time rather than hardcoded,
      so if a later wave adds a W9 to the CD without naming it on T4.1, this step fails and names the
      gap. That is what lets step 2 use a growth-safe floor without letting a new criterion slip in
      unnamed -- the pair is strictly stronger than an exact-set assertion in either step alone, and
      it fails only on the genuinely incomplete edit rather than on any edit at all. CODE-REVIEW
      ROUND 1 FIX (M2): "exactly 1 criterion naming CD.43" relaxed to a FLOOR (at least 1), and the
      W-id/workspace_uri checks now run against the UNION of every CD.43-naming criterion rather than
      criterion[0] alone. A ratifying wave may legitimately record the selected store as a second
      criterion rather than editing the first; the previous exact-1 assertion would have reddened
      main for that correct edit. The "exactly 1" fact stays true only for this wave and lives in
      step 5's waived command instead.
    command: |-
      bin/venv-python -c "
      import yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cds = [c for c in d['candidate_decisions'] if c['id'] == 'CD.43']
      assert cds, 'CD.43 absent -- the criteria CD was never added'
      cd = cds[0]
      b = [p for p in cd['discipline_points'] if isinstance(p, dict) and 'workspace_store_selection' in p][0]['workspace_store_selection']
      items = {i['id']: i for i in d['tier_items']}
      t41 = items['T4.1']
      nonstr = [c for c in t41['exit_criteria'] if not isinstance(c, str)]
      assert not nonstr, f'a T4.1 exit criterion became a mapping (colon hazard): {nonstr}'
      named = [c for c in t41['exit_criteria'] if 'CD.43' in c]
      assert named, 'expected at least 1 T4.1 criterion naming CD.43, found 0'
      combined = ' '.join(named)
      assert 'workspace_uri' in combined, 'the CD.43-naming criterion (or criteria) must bind to prepare_workspace workspace_uri'
      declared = sorted(b['selection_criteria'])
      missing = [w for w in declared if w not in combined]
      assert not missing, f'T4.1 names CD.43 but not its criteria {missing} (declared: {declared})'
      unlinked = [g for g in cd['gates'] if 'CD.43' not in (items[g].get('related_candidate_decisions') or [])]
      assert not unlinked, f'tier item(s) gated by CD.43 never name it back: {unlinked}'
      print('OK T4.1 names CD.43 + W1-W8;', len(cd['gates']), 'gated item(s) linked back')
      "
    expected: >-
      Exit 0, printing `T4.1 names CD.43 + W1-W8` followed by the gated-item count. Proves the tier
      item names the mechanism-selection obligation and every criterion id, and that both gated tier
      items point back at CD.43. Verified by mutation this session: dropping W5/W6/W7 from the
      criterion fails with "names CD.43 but not its criteria ['W5', 'W6', 'W7']"; removing CD.43 from
      T4.2's related_candidate_decisions fails with "never name it back: ['T4.2']"; removing all
      CD.43-naming criteria fails with "found 0".
    fix_if: >-
      "found 0" means no T4.1 criterion names CD.43 (the literal token `CD.43` is absent from every
      exit_criteria entry) -- add one. "names CD.43 but not its criteria" means the combined text of
      every CD.43-naming criterion gestures at the CD without naming a criterion id, which is the
      exact failure ESB-01's acceptance is written to prevent -- add the missing W ids to one of them.
      "never name it back" means related_candidate_decisions was updated on one gated item but not the
      other; update the named item. A non-string criterion means the appended criterion carried an
      unquoted colon-space. T4.2 needs only the related_candidate_decisions link, never its own
      CD.43-naming criterion -- its workspace criterion (c1) already landed in wave 1 and a second
      would create two sources for one obligation.
    graduation: graduate
    graduation_check_id: t41-names-workspace-store-criteria
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: >-
      T4.1's TRANSIENT half -- the criterion commits to no store yet. Kept out of the graduated set
      for the same reason as step 3: once CD.43 ratifies, T4.1's criterion may legitimately name the
      selected store, and a standing row forbidding that would redden main for a correct edit. The
      positive binding that makes this meaningful (the criterion names CD.43 and all eight W ids)
      lives in step 4, which does graduate. CODE-REVIEW ROUND 1 FIX (M2): this step is now also the
      sole owner of the "exactly 1 criterion naming CD.43" fact -- true only for this wave, since a
      ratifying wave may legitimately add a second criterion recording the selected store. Step 4's
      graduated command only requires at least 1.
    command: |-
      bin/venv-python -c "
      import yaml
      d = yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))
      cds = [c for c in d['candidate_decisions'] if c['id'] == 'CD.43']
      assert cds, 'CD.43 absent -- the criteria CD was never added'
      b = [p for p in cds[0]['discipline_points'] if isinstance(p, dict) and 'workspace_store_selection' in p][0]['workspace_store_selection']
      t41 = {i['id']: i for i in d['tier_items']}['T4.1']
      named = [c for c in t41['exit_criteria'] if 'CD.43' in c]
      assert len(named) == 1, f'expected exactly 1 T4.1 criterion naming CD.43, found {len(named)}'
