    PUBLIC-boundary sweep; step 3 waives `status`/`selected_store` equality PLUS the option_set
    breadth floor (moved here at M3 -- narrowing option_set to the selected store is a legitimate
    ratification-time edit, so a floor over the full candidate set is transient like status/
    selected_store, not durable). Step 4 (t41-names-workspace-store-criteria) graduates T4.1 naming
    CD.43 with all eight criterion ids (checked against the UNION of every CD.43-naming criterion,
