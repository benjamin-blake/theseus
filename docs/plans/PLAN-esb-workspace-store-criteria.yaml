  - >-
    VERIFICATION-REGISTRY OWNERSHIP: config/agent/verification_registry/registry.yaml is
    deliberately absent from the Scope table and has no execution step. The implement skill's VF-05
    producer walk OWNS it -- it enumerates this plan's `graduate`-disposition steps, builds each row
    from the declared `graduation_check_id`, runs the real differential admission gate, appends
