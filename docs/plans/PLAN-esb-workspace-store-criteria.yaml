  - >-
    GRADUATION SHAPE (Decision 132 / VF-05), restructured at plan-critique round 1 along a
    DURABLE-versus-TRANSIENT split, and TIGHTENED at code-review round 1 (M2/M3) after the split's
    own logic was found under-applied at the registry level. The VP is deliberately paired: each
    keystone is one graduating step carrying only assertions that stay true after CD.43 ratifies,
    plus a waived sibling carrying the assertions that become false when wave 5 does the right thing.
    Step 2 (cd43-selection-criteria-well-formed) graduates the criteria set, typing, the
