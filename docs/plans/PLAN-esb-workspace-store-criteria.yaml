    on the same objects -- T4.1-vs-T4.2 bare-string criteria, the CD.43-vs-CD.27 gates resolution, the
    CD.43-vs-CD.27 pending/filed_via shape, the layer-2 precondition floor extending wave 1's
    ESB-04/ESB-06 obligations test, and the append-only-vs-origin/main invariant. Splitting the package
    would separate all five sibling pairs, which is the class-versus-site failure mode inverted. KNOWN
    DEBT, recorded not deferred silently: the package name describes wave 1's slice, not the audit, and
    waves 3 and 5 will accrete into it too. A wave-neutral rename is cheapest as ONE move after wave 5
    lands, not three moves across three waves; it is not this wave's to make.
  - >-
    WAVE BOUNDARIES. Wave 1 (merged, 155404d) owns CD.27's resume_properties P1/P2/P3, T4.2 c1, the
    structured stability block, the cost projection, and the ESB-04/ESB-06 preconditions. Wave 3 owns
    ESB-02 -- CD.27's maturity-monitoring/fallback clause, the audit's stale :821 anchor. Wave 5 owns
    the layer-2 spike and, with it, the CD.43 ratification that selects the store. This wave touches
    none of those; VP step 7 proves the CD.27 half mechanically.
  - >-
    DEPLOY DEFERRAL (deliberate, not overlooked; mirrors PLAN-esb-text-fix-bundle's ruling on the
    same file and the same artifact). docs/ROADMAP-PLATFORM.yaml is an `assets:` entry in
    src/lambdas/data-pipeline/manifest.yaml, which is `status: active`; compute_affected_artifacts
    returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}, verified again this session, and its
    governed channel is .github/workflows/deploy-prod-lambdas.yml. Read literally, CD.16 and Decision
    79 would require per-Lambda build + deploy + smoke-test steps. Deferred on four grounds: (i) 48
    of 48 prior doc-only plans touching this file carry no build_lambda step; (ii) both packaged
    consumers are inert -- SCHEDULED_AGENTS_ENABLED="false" and both EventBridge rules are
    state="DISABLED" in terraform/scheduled_agents.tf; (iii) the asset is roadmap text on no live
    code path, and the tier floor's own Lambda arm agrees -- validate_tier_floor.py:19-24's
    `_lambda_code_files()` docstring says it is "deliberately NOT compute_affected_artifacts, which
