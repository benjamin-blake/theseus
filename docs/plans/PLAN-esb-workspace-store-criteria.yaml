    bare-string invariant; step 5 waives "names no candidate store" AND now owns the "exactly 1
    criterion naming CD.43" fact outright (M2), since a ratifying wave may legitimately record the
    selected store as a second criterion. Step 6 (cd27-layer2-preconditions-cover-esb01) graduates
    the precondition floor. All three graduating specs are single command_exit_zero commands over
    docs/ROADMAP-PLATFORM.yaml and each fails on the origin/main revert (re-proven after the M2/M3
    edit via the real differential admission gate, worktree-backed, not simulated), which is what the
    differential admission gate requires. WHY the split rather than a retirement obligation on wave 5:
    the registry carries no expiry or retirement field, so a transient row reddens main at
    ratification with no owner, and the cheapest response for whoever hits it is to weaken the check
    rather than retire it. Durable by construction beats durable by memory -- this run has already
    produced two recs about promised-but-uncarried re-evaluations. M2/M3 are the same lesson applied
    a level down: a FLOOR is durable against growth but not against the legitimate NARROWING that
    ratification performs, so "floor" and "exact set" are both potentially transient shapes depending
    on which direction the state change moves -- only a floor over an OBLIGATION (coverage_cases, the
    W-id set) is durable in both directions; a floor over a CANDIDATE SET (option_set) or an exact
    count of a field a ratifying edit may legitimately add to (the CD.43-naming criterion count) is
