    7's `git add -A`. An execution step instructing the implementer to write those rows would
    duplicate a walk that fires automatically, and a Scope row would imply this plan authors them.
    Checked against the skill rather than assumed (`.claude/skills/implement/SKILL.md`, Verification
    Graduation section), which is how wave 1 resolved the same question.
  - >-
    CI-RCA DEFERRAL (planning-skill hard block, discharged explicitly). rec-2923 ("Sandbox subagent
    review starved; inherited errexit voided the retry and latched a false red", critical,
    source_file .github/actions/subagent-plan-review/action.yml) is open and unresolved. This plan
