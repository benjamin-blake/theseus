constraints:
- A clause may appear in permanent source ONLY if a named verification_plan step would FAIL were it false -- no aspirational prose in the check module, the shard or the mirror test.
- Cite symbols, never line numbers. The census line numbers this plan measured are evidence of a scan, not addresses to edit; every scope row and every assertion names a symbol or a path.
- 'The check NEVER appends to failed in this slice. Pinned by TestReportOnly::test_failed_is_never_appended_to_on_a_tree_with_hits, which drives a tree that HAS hits through the check and asserts the caller''s list is unchanged. The report-only precedent is scripts/checks/hygiene/validate_declaring_coverage.py. Report-only is the DELIBERATE resting state, not a deferred gate (Decision 163 point 1): the check states no threshold, adds no status_vocabulary member and registers no discretionary escape, exactly as docs/contracts/check-accounting.yaml''s path_aware_declaring_coverage does; the advisory-to-blocking flip is slice 3''s own reviewed change, never an exception path inside this one.'
- 'The broad-type roster is FROZEN in the check module as BROAD_EXCEPTION_TYPES (a frozenset, collocated as the SSOT per AGENTS.md and the _CURATED_TOKENS precedent) and pinned by equality in the mirror test. Tuple membership is ANY: a tuple of types is an OR of what the site catches, so any member in the roster makes the site broad, and requiring ALL members would drop every mixed tuple off the census the narrowing sweep works from. The excinfo arm fires on a LOAD of the bound name inside the same enclosing scope strictly after the with-statement''s end_lineno -- a read, not an assert, so a helper ending in a return of exc_info.value.code for its caller clears the site, while a read before the with-statement, a read inside its body and a read in a different function that merely reuses the binding name each leave it reported. The waiver marker suppresses only within the call''s own lineno..end_lineno span (the _assert_has_waiver placement rule); a marker on the line above the with waives nothing. The discrimination rule is TOTAL over every pytest.raises call shape -- the eighteen in-function shapes and the two module-level shapes of the matrix -- and NEITHER I/O seam raises: read_text is guarded by name against OSError, TypeError and UnicodeDecodeError and ast.parse against SyntaxError, ValueError, RecursionError and MemoryError, each lost file routed to a printed skipped count, never to a raise and never behind a bare except. Proved by the shape matrix.'
- No hermetic step's expected text may contain a backtick literal -- validate_vp_replay extracts backtick-delimited literals from expected and requires each one in the replayed output.
- Every diff-inspecting step uses scripts.checks._common.get_status_aware_diff, because /implement runs against an UNCOMMITTED tree that a git diff against a committed ref cannot see.
- The touched set equals the declared scope in BOTH directions (no extra, no missing), asserted by step 10 with the plan file and .secrets.baseline as the only sanctioned companions (docs/contracts/implement-scope-boundary.yaml).
- Every file this plan writes stays under 500 SLOC INCLUDING tests. Decompose, never raise -- no config/sloc_budgets.yaml entry and no raise-approved marker (Decision 128 as amended by Decision 165). Asserted by step 12.
- Decision 170 -- the check declares examined() on every reachable success exit (measure_check undeclared 0) and is ABSENT from config/check_accounting_baseline.yaml; a NEW check never joins the shrink-only grandfather roster. Asserted by step 5.
- Decision 169 -- all seven registration surfaces are present together, asserted by step 6. Exactly ONE verification_plan step is graduated (step 2), so exactly one shard is created; it is declared in the Scope table up front because validate_scope_boundary fails a shard added later.
- No file under tests/ other than the new mirror test is created or modified. The roster's first measured hit list IS this slice's deliverable; narrowing any site here would blur what slice 2 owns. Asserted by step 10's OTHER_TESTS_TOUCHED arm.
- Decision 181 standing prohibition -- no check, assertion, tolerance, budget, test or plan field is weakened anywhere in this diff to obtain green.
- Decision 67 -- IMPLEMENTATION plan only. scripts/execute_recommendation.py and scripts/executor/** are never touched.
- Decision 86 -- no new standing prose-architecture document. Field semantics live in the check module's own docstring next to the enforcement, not in a companion doc.
