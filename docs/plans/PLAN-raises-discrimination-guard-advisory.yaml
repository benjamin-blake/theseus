execution_steps:
- Create scripts/checks/hygiene/validate_raises_discrimination.py -- a module docstring stating the roster criterion, the four-arm discrimination rule (ANY tuple membership, the positioned excinfo READ, the lineno..end_lineno waiver placement), the by-name guard on both I/O seams and the report-only guarantee; the frozen BROAD_EXCEPTION_TYPES frozenset (AssertionError, AttributeError, BaseException, EnvironmentError, Exception, IOError, IndexError, KeyError, LookupError, NameError, OSError, RuntimeError, SystemExit, TypeError, ValueError); WAIVER_MARKER, SUMMARY_GRAMMAR and the _READ_FAILURES / _PARSE_FAILURES tuples; frozen RaisesNames and RaisesSite dataclasses (the arm-3 field named loads_excinfo for what it measures); resolve_raises_names, is_raises_call, type_names, is_broad, declared_type, the keyword-facts helper, with_bindings carrying each binding's with-statement end_lineno, the scope-local positioned binding_is_loaded, the waiver helper, scan_file and scan_tests taking a skipped accumulator, hits, hits_by_directory, summary_line and skipped_line.
- Give the check body ONE reachable exit -- print the header, the grouped per-directory counts, one line per hit, the summary line, the always-printed skipped-file count with one line per skipped path, and the ADVISORY notice, then call registry.examined(len(scanned), unit='pytest_raises_sites') as the final statement. Never append to failed on any path. Keep a sites injection seam so tests can substitute a scanned population for the live walk.
- Register it -- add the Entry literal to scripts/checks/hygiene/_manifest.py (pre=True, pre_globs ('tests/**', 'scripts/checks/hygiene/**'), full_segment 'full_after_lint'), and add the validate_raises_discrimination code_regression row to config/ci_rca_taxonomy.yaml next to validate_declaring_coverage.
- Create config/agent/verification_registry/entries/raises-discrimination-advisory-declares-examined.yaml -- primitive_slot command_output_matches, guard_target the check module, guard_symbol validate_raises_discrimination, plan_slug raises-discrimination-guard-advisory, check_spec command the step 2 one-liner and expected the DIGIT-CLASSED summary-line regex (scanned, hits and directories each a digit class, never a literal count, the declaring-coverage-fleet-report-line shape), byte-identical to VP step 2's expected, with use_regex true. Verify it materializes and that it FAILS against an origin/main tree and PASSES on HEAD before running the full tier.
- Create tests/checks/hygiene/test_validate_raises_discrimination.py with the classes the test obligations name -- TestFrozenRoster (roster equality plus the deliberate-absence list), TestTupleMembershipIsAny (the is_broad seam and a mixed-tuple site), TestDiscriminationRule (one case per arm, including the waiver placement rule), TestCallShapeMatrix (the eighteen in-function shapes, the two module-level shapes and the unparseable module), TestUnreadableFilesAreCountedNotRaised (the frozen failure tuples and the printed skipped count at both I/O seams), TestImportAliases, TestScannerPrimitives, TestReportOnly (failed unchanged on a tree with hits, the declaration payload, the grouped ordering), TestRegistrationSurfaces (registry resolution, manifest Entry, taxonomy row, baseline absence, measure_check undeclared 0, the shard digit-class pin and the shard regex-agreement pin) and TestLiveTreeInvariants (the growth-safe properties only).
- Execute the Verification Plan in step order -- run each step, loop until pass; on an unrecoverable failure stop and RCA (Decision 55), never patch around it.
- Report -- the implemented surfaces, the live census figures VP step 4 printed, and the verification results for every step.
rollback: Delete scripts/checks/hygiene/validate_raises_discrimination.py, its mirror test and the graduation shard; revert the single Entry literal in scripts/checks/hygiene/_manifest.py and the single row in config/ci_rca_taxonomy.yaml. Nothing else in the tree depends on the check, and no existing test site is edited by this slice, so the revert is complete and side-effect-free.
