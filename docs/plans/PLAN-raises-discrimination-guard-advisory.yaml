schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: raises-discrimination-guard-advisory
intent: Install a standing ADVISORY guard that censuses non-discriminating pytest.raises sites in tests/ -- a broad exception type (ANY member of a tuple counts), no match=, no read-back of a bound excinfo after the with-statement, and no waiver -- so the later narrowing sweep works from a measured, machine-derived hit list instead of a hand roster.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-raises-discrimination-guard-advisory.yaml
phase: 'Test-suite discrimination hardening -- the census half of the pytest.raises narrowing work that Task 3''s mutation-survivor sweep (PRs 1026, 1029, 1031, 1033, 1035 and 1037, all merged) left unmeasured. Ad hoc, soft-warn category ad_hoc_rec; no tier_item is claimed and no roadmap exit criterion closes, so this plan declares no closes_criteria. SLICE 1 of three: slice 2 narrows the reported sites one test directory per plan, slice 3 flips the check from advisory to blocking once the hit count reaches zero. This slice deliberately edits NO existing test site.'
scope:
- file: scripts/checks/hygiene/validate_raises_discrimination.py
  action: Create
  purpose: 'The advisory check: AST-scans tests/**/*.py for pytest.raises sites, applies the frozen broad-type roster and the four-arm discrimination rule, prints the hit list grouped by directory with counts, one summary line and an always-printed count of the files it could not read or parse, declares examined() over the scanned sites, and never appends to failed.'
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: Registration surface 3 -- the Entry literal (pre=True, pre_globs tests/** and scripts/checks/hygiene/**, full_segment full_after_lint), matching the validate_test_count_coupling entry that scans the same tree.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Registration surface 4 -- the function_to_category row (code_regression, the category validate_declaring_coverage and validate_test_count_coupling both carry), required for validate_ci_rca_taxonomy's registry-totality assertion.
- file: config/agent/verification_registry/entries/raises-discrimination-advisory-declares-examined.yaml
  action: Create
  purpose: Registration surface 5 -- the graduation shard for the ONE graduated VP step (the check resolves, runs clean and declares examined over the scanned sites). Declared here up front because validate_scope_boundary fails a shard added after the fact.
- file: tests/checks/hygiene/test_validate_raises_discrimination.py
  action: Create
  purpose: 'Registration surface 6 -- the mirror test: the frozen-roster equality pin, the ANY tuple-membership pin, the call-shape matrix, each discrimination arm, the skipped-file accounting for both guarded I/O seams, the report-only proof, the declaration proof, the four registration-surface assertions, the shard digit-class and regex-agreement pins, and the growth-safe live-tree property invariants.'
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
implementation_declared: true
acceptance_criteria:
- validate_raises_discrimination resolves through scripts.checks.registry, runs over tests/, and prints the hit list grouped by directory with per-directory counts, one summary line and an always-printed count of files it could not read or parse.
- The check NEVER appends to its failed list on any input, including a tree that has hits -- pinned by a test that drives such a tree through it and asserts failed is unchanged.
- 'The broad-type roster is a frozen collocated constant in the check module, pinned by equality in the mirror test, and the discrimination rule is total over at least the twenty call shapes TestCallShapeMatrix asserts -- the eighteen in-function shapes (positional broad type, positional narrow type, tuple with a broad member, mixed tuple of a custom and a broad type, tuple of only narrow types, attribute-qualified type, no argument, keyword-only expected_exception, starred argument, kwargs splat, subscript, match keyword, excinfo bound and read after the with, excinfo read only inside the with body, excinfo name read only before the with, binding name reused with the read between the two with-statements, waiver marker on the call''s own line, waiver marker on the line above the call) and the two module-level shapes (a helper returning the excinfo value for its caller, a binding name reused in a different function) -- with no shape raising. Tuple membership is ANY: any member in the roster makes the site broad, never all. Arm 3 fires when the bound name is LOADED inside the same enclosing scope strictly after the with-statement''s end_lineno, never on the narrower asserted shape. The waiver marker suppresses only within the call''s own lineno..end_lineno span, never from the line above. Neither I/O seam raises: read_text is guarded by name against OSError, TypeError and UnicodeDecodeError, ast.parse against SyntaxError, ValueError, RecursionError and MemoryError, and each lost file is counted into a printed skipped total rather than dropped or raised.'
- All seven registration surfaces are present and asserted -- module, register decoration, manifest Entry, taxonomy row, graduation shard, mirror test, and an examined() declaration on every reachable success exit (measure_check reports undeclared 0).
- validate_raises_discrimination is ABSENT from config/check_accounting_baseline.yaml -- a new check declares from day one and never joins the shrink-only grandfather roster.
- The census measured at the pinned SHA (813 scanned sites, 79 hits, 14 directories) is reproduced by the live scan at implement time, or its per-directory floor is met with the drift printed if origin/main has moved.
- Every file the diff touches is a declared scope row (or the plan file itself), and no file under tests/ other than the new mirror test is modified.
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE state -- prove the check name does not resolve in the registry at origin/main, so every AFTER step below is discriminating rather than tautological.
  command: 'if git show origin/main:scripts/checks/hygiene/_manifest.py 2>/dev/null | grep -q validate_raises_discrimination; then echo ''BEFORE FAILED: the manifest already names the check at origin/main''; exit 1; fi; if git cat-file -e origin/main:scripts/checks/hygiene/validate_raises_discrimination.py 2>/dev/null; then echo ''BEFORE FAILED: the module already exists at origin/main''; exit 1; fi; if ! git cat-file -e origin/main:scripts/checks/hygiene/_manifest.py 2>/dev/null; then echo ''INFRA SENTINEL: origin/main is unreachable, this is not a BEFORE verdict''; exit 1; fi; echo ''BEFORE CONFIRMED: no manifest Entry and no module for validate_raises_discrimination at origin/main'''
  expected: Prints BEFORE CONFIRMED and exits 0. Neither the manifest Entry nor the check module exists at origin/main, so registry.resolve raises UnknownCheckError there.
  fix_if: An INFRA SENTINEL line means origin/main is unreachable -- fetch and rerun; it is never a BEFORE verdict. A BEFORE FAILED line means the surface already existed upstream, so the plan's premise is wrong and the scope must be re-derived.
  hermetic: true
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: AFTER state -- the check resolves, runs over tests/, prints the per-directory hit counts and the summary line, leaves failed unchanged, and declares examined over the scanned sites.
  command: bin/venv-python -c "from scripts.checks import registry; failed = []; scope = registry.outcome_scope('validate_raises_discrimination'); scope.__enter__(); registry.resolve('validate_raises_discrimination')(failed); declaration = registry.pop_declaration(); scope.__exit__(None, None, None); assert failed == [], failed; assert declaration is not None and declaration.kind == 'examined', declaration; assert declaration.unit == 'pytest_raises_sites' and declaration.count > 0, declaration; print('DECLARATION', declaration.kind, declaration.unit, declaration.count)"
  expected: The grouped per-directory counts, one line per reported hit, the summary line matching the graduation shard's byte-identical digit-classed pattern raises-discrimination scanned=\d+ hits=\d+ directories=\d+ \(advisory\), an always-printed unreadable or unparseable files skipped count, the ADVISORY notice, and a DECLARATION line naming examined pytest_raises_sites with a positive count. The pattern pins the GRAMMAR and never a literal count -- slice 2 shrinks the hit list by design, so a pinned count would red this standing shard on the very change it accompanies. failed stays empty. Exits 0.
  fix_if: UnknownCheckError means the manifest Entry is missing or misspelled. A non-empty failed list means the check appended to it, which this slice forbids. A None or skipped declaration means the terminal examined() call is not on the reached exit path.
  hermetic: true
  graduation: graduate
  graduation_check_id: raises-discrimination-advisory-declares-examined
- step: 3
  phase: pre-deploy
  action: Prove the discrimination rule is TOTAL over every pytest.raises call shape -- no shape raises and each classifies as designed.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_raises_discrimination.py::TestCallShapeMatrix -q -p no:cacheprovider --randomly-seed=12345
  expected: 'All three shape-matrix cases pass: the eighteen in-function call shapes and the two module-level shapes each scan without raising and yield their designed hit count, and an unparseable module yields no sites. The guarded failure set is named by the module and pinned by the matrix -- OSError, TypeError and UnicodeDecodeError at the read seam, SyntaxError, ValueError, RecursionError and MemoryError at ast.parse -- each routing the lost file to a printed skipped count, never to a raise.'
  fix_if: 'A raise on any shape means the scanner is not total -- an unresolvable type expression, an absent argument or a kwargs splat must classify, never blow up. A wrong count means a rule arm is inverted. A raise escaping the read or parse seam means a failure shape slipped the by-name guard: widen the named tuple and count the file into skipped, never add a bare except and never let it reach the tier dispatcher.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The shape matrix is already a standing regression guard as an ordinary mirror test running in both presubmit tiers; a registry row re-running the same selector inside the verification harness would duplicate the tier without adding signal.
- step: 4
  phase: pre-deploy
  action: Census oracle -- the live scan at HEAD reproduces the census pinned at a702e438bae04311927ef1553c9ac88076911a5a, exactly when origin/main is unmoved and at its per-directory floor otherwise, printing the full hit list either way.
  command: 'bin/venv-python -c "import subprocess; from scripts.checks.hygiene.validate_raises_discrimination import hits, hits_by_directory, scan_tests, summary_line; PINNED_SHA = ''a702e438bae04311927ef1553c9ac88076911a5a''; PINNED_SCANNED = 813; PINNED = {''tests'': 46, ''tests/validate'': 10, ''tests/lambda_manifest'': 5, ''tests/ops'': 3, ''tests/platform_roadmap_models'': 3, ''tests/build_lambda_deploy'': 2, ''tests/checks/typing'': 2, ''tests/session/preflight'': 2, ''tests/checks/_common'': 1, ''tests/ci_rca/evidence'': 1, ''tests/ducklake_neon_smoke_test'': 1, ''tests/ops_data_portal'': 1, ''tests/platform_roadmap_state'': 1, ''tests/verify_ci_workflow'': 1}; scanned = scan_tests(); reported = hits(scanned); live = hits_by_directory(reported); [print(site.path + '':'' + str(site.lineno), site.type_text) for site in reported]; print(summary_line(scanned)); base = subprocess.run([''git'', ''rev-parse'', ''origin/main''], capture_output=True, text=True, encoding=''utf-8'').stdout.strip(); exact = base == PINNED_SHA; print(''BASE'', base, ''EXACT'', exact); assert (not exact) or len(scanned) == PINNED_SCANNED, len(scanned); assert (not exact) or live == PINNED, sorted(set(live.items()) ^ set(PINNED.items())); assert exact or len(scanned) >= PINNED_SCANNED, len(scanned); short = {d: (PINNED[d], live.get(d, 0)) for d in PINNED if live.get(d, 0) < PINNED[d]}; assert exact or not short, short; print(''CENSUS ORACLE HELD'')"'  # pragma: allowlist secret
  expected: The full hit list one line per site, the summary line, a BASE line naming the diff base and whether the exact arm applies, and CENSUS ORACLE HELD. At the pinned SHA the totals are scanned 813, hits 79, directories 14 and the per-directory map matches exactly.
  fix_if: 'An exact-arm mismatch at the pinned SHA means the implemented rule differs from the measured one -- reconcile the roster or a rule arm TOWARD the pinned census, never the pinned numbers toward the code. The three arms that move this number: tuple membership is ANY member in the roster and never all; the excinfo arm fires only on a LOAD of the bound name inside the same enclosing scope strictly after the with-statement''s end_lineno; the waiver applies only within the call''s own lineno..end_lineno span. A floor breach after main moved means a pinned site stopped being reported, which slice 1 must not cause: find the site and explain it before proceeding.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The pinned census is this session's transient repo state -- slice 2 shrinks the hit list by design, so a standing registry row asserting these counts would red every subsequent slice. The durable property is graduated by step 2 instead.
- step: 5
  phase: pre-deploy
  action: Decision 170 accounting -- every reachable success exit of the check declares (measure_check reports undeclared 0), and the check is absent from the grandfather roster.
  command: bin/venv-python -c "import yaml; from scripts.checks import registry; from scripts.checks.hygiene._declaring_coverage import is_fully_declared, measure_check; NAME = 'validate_raises_discrimination'; row = measure_check(NAME, registry.resolve(NAME)); print('COVERAGE', row.success_exits, row.declared, row.undeclared, row.undecidable_reason); assert row.undecidable_reason is None, row; assert row.undeclared == 0, row; assert is_fully_declared(row), row; baseline = yaml.safe_load(open('config/check_accounting_baseline.yaml', encoding='utf-8')); assert NAME not in baseline['entries'], NAME; print('ROSTER ABSENCE CONFIRMED and undeclared=0')"
  expected: A COVERAGE line reporting at least one success exit, declared equal to success_exits, undeclared 0 and no undecidable reason, then ROSTER ABSENCE CONFIRMED and undeclared=0.
  fix_if: undeclared above 0 means a success exit path bypasses the terminal examined() call -- move the declaration to a statement position that every path evaluates, never into a compound header or a return value. Presence in the baseline means the check was wrongly grandfathered.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Both halves already have standing owners -- validate_check_accounting enforces the module declaration and the roster grammar every tier, and step 2's graduated shard proves the runtime declaration; a third registry row would duplicate them rather than guard anything new.
- step: 6
  phase: pre-deploy
  action: Decision 169 seven-surface assertion -- module, register decoration, manifest Entry, taxonomy row, graduation shard, mirror test and declaration are all present together.
  command: bin/venv-python -c "import pathlib, yaml; from scripts.checks import registry; from scripts.checks.hygiene._manifest import ENTRIES; from scripts.checks.hygiene._declaring_coverage import measure_check; NAME = 'validate_raises_discrimination'; SHARD = 'raises-discrimination-advisory-declares-examined'; assert pathlib.Path('scripts/checks/hygiene/validate_raises_discrimination.py').exists(); assert registry.all_checks()[NAME].owner == 'platform'; entry = next(e for e in ENTRIES if e.name == NAME); assert entry.module == 'scripts.checks.hygiene.validate_raises_discrimination' and entry.attr == NAME, entry; assert entry.pre is True and entry.pre_globs == ('tests/**', 'scripts/checks/hygiene/**'), entry; assert entry.full_segment == 'full_after_lint', entry; assert yaml.safe_load(open('config/ci_rca_taxonomy.yaml', encoding='utf-8'))['function_to_category'][NAME] == 'code_regression'; assert pathlib.Path('config/agent/verification_registry/entries/' + SHARD + '.yaml').exists(); assert pathlib.Path('tests/checks/hygiene/test_validate_raises_discrimination.py').exists(); assert measure_check(NAME, registry.resolve(NAME)).undeclared == 0; print('SEVEN SURFACES PRESENT')"
  expected: Prints SEVEN SURFACES PRESENT and exits 0.
  fix_if: Any assertion naming a surface identifies exactly which registration was skipped -- add that surface rather than relaxing the assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Five of the seven surfaces already have dedicated standing gates (validate_check_manifests, validate_ci_rca_taxonomy, validate_verification_registry, validate_test_coverage, validate_check_accounting) and step 2's shard covers resolution; a registry row here would re-assert what those checks already fail on.
- step: 7
  phase: pre-deploy
  action: Plan-obligation closure -- the new check module's three mechanically-derivable companion registrations are all declared scope rows.
  command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-raises-discrimination-guard-advisory.yaml
  expected: Reports the new_check_module rule fired for scripts/checks/hygiene/validate_raises_discrimination.py with every required companion satisfied -- domain manifest Entry, ci_rca_taxonomy row and mirror test -- and no unmet obligation.
  fix_if: An unmet obligation names the missing companion scope row verbatim; add the row to scope rather than narrowing the trigger.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A single canonical-slot command over this session''s TRANSIENT repo state: plan_obligations exits zero against an unmerged plan file that is gone from docs/plans/ once the branch merges, so a standing registry row replaying it would assert nothing durable. Not graduatable rather than not applicable.'
- step: 8
  phase: pre-deploy
  action: RED leg -- the new mirror test is red on an origin/main worktree, guarded so an infrastructure failure prints its own sentinel instead of counting as red.
  command: 'T=$(mktemp -d); W="$T/base"; if ! git worktree add -q --detach "$W" origin/main; then echo ''INFRA SENTINEL: could not create the origin/main worktree''; exit 1; fi; ln -s "$(pwd)/.venv" "$W/.venv"; cp tests/checks/hygiene/test_validate_raises_discrimination.py "$W/tests/checks/hygiene/"; ( cd "$W" && bin/venv-python -m pytest tests/checks/hygiene/test_validate_raises_discrimination.py -q -p no:cacheprovider --randomly-seed=12345 ) > "$T/red.log" 2>&1; RC=$?; git worktree remove --force "$W" >/dev/null 2>&1; tail -5 "$T/red.log"; if [ "$RC" -eq 0 ]; then echo ''RED-LEG SENTINEL: the new tests were GREEN on origin/main, so they do not discriminate the change''; exit 1; fi; if [ "$RC" -ne 1 ] && [ "$RC" -ne 2 ]; then echo "INFRA SENTINEL: pytest exited $RC, not a test verdict"; exit 1; fi; if grep -q "No module named ''scripts.checks.hygiene.validate_raises_discrimination''" "$T/red.log" || grep -q ''^FAILED tests/checks/hygiene/test_validate_raises_discrimination.py::'' "$T/red.log"; then echo "RED CONFIRMED on origin/main (pytest rc=$RC)"; exit 0; fi; echo "INFRA SENTINEL: pytest rc=$RC with no attributable red for the new module"; exit 1'
  expected: The tail of the origin/main run showing the ModuleNotFoundError for scripts.checks.hygiene.validate_raises_discrimination, then RED CONFIRMED on origin/main with pytest rc=2. Exits 0.
  fix_if: 'A RED-LEG SENTINEL line means the tests pass without the change and prove nothing -- they must exercise the new module. An INFRA SENTINEL line is a worktree or interpreter problem, never a red verdict: fix the environment and rerun.'
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: GREEN leg -- the whole mirror test module passes on HEAD, covering the roster pin, every discrimination arm, the import-alias resolution, the report-only proof, the registration surfaces and the live-tree property invariants.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_raises_discrimination.py -q -p no:cacheprovider --randomly-seed=12345
  expected: Every test in the module passes; no failures, no errors, no skips.
  fix_if: A roster-equality failure means the frozen constant was edited without updating its pin -- reconcile deliberately. A live-tree property failure means a reported hit does not satisfy all four rule arms, which is a scanner defect.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The module already runs as an ordinary mirror test in both presubmit tiers, so a test_selector registry row would execute the identical selector a second time inside the verification harness and add no independent signal.
- step: 10
  phase: pre-deploy
  action: Scope boundary -- the touched set equals the declared scope in BOTH directions, and no file under tests/ other than the new mirror test is modified.
  command: bin/venv-python -c "from scripts.checks import _common; PLAN = 'docs/plans/PLAN-raises-discrimination-guard-advisory.yaml'; SANCTIONED = {PLAN, '.secrets.baseline'}; MIRROR = 'tests/checks/hygiene/test_validate_raises_discrimination.py'; declared = {'scripts/checks/hygiene/validate_raises_discrimination.py', 'scripts/checks/hygiene/_manifest.py', 'config/ci_rca_taxonomy.yaml', 'config/agent/verification_registry/entries/raises-discrimination-advisory-declares-examined.yaml', MIRROR}; touched = {path for _status, path in _common.get_status_aware_diff()}; extra = sorted(touched - declared - SANCTIONED); missing = sorted(declared - touched); tests_touched = sorted(path for path in touched if path.startswith('tests/') and path != MIRROR); print('TOUCHED', sorted(touched)); print('EXTRA', extra); print('MISSING', missing); print('OTHER_TESTS_TOUCHED', tests_touched); assert not extra, extra; assert not missing, missing; assert not tests_touched, tests_touched; print('SCOPE MATCHES IN BOTH DIRECTIONS')"
  expected: TOUCHED lists exactly the five scope rows plus the plan file, EXTRA and MISSING and OTHER_TESTS_TOUCHED are all empty, and SCOPE MATCHES IN BOTH DIRECTIONS is printed.
  fix_if: A non-empty EXTRA is an out-of-scope edit -- revert it or route it to a recommendation, never resolve it by adding the path to scope after the fact. A non-empty MISSING means a declared row was never written. A non-empty OTHER_TESTS_TOUCHED means slice 2 work leaked into slice 1.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A single canonical-slot command over this session''s TRANSIENT uncommitted diff: the touched set it asserts on is empty post-merge, so a standing registry row replaying it would be meaningless rather than protective. validate_scope_boundary is the standing owner of the same invariant.'
- step: 11
  phase: pre-deploy
  action: Lint -- ruff check and ruff format agree on every file this plan writes.
  command: bin/venv-python -m ruff check scripts/checks/hygiene/validate_raises_discrimination.py scripts/checks/hygiene/_manifest.py tests/checks/hygiene/test_validate_raises_discrimination.py && bin/venv-python -m ruff format --check scripts/checks/hygiene/validate_raises_discrimination.py scripts/checks/hygiene/_manifest.py tests/checks/hygiene/test_validate_raises_discrimination.py
  expected: All checks passed, and all three files already formatted. Exits 0.
  fix_if: E501 at 127 columns is the common one on the fixture-source string literals -- split the literal across concatenated lines rather than widening the limit.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The lint scaffold already runs ruff over the whole tree in both presubmit tiers, so a registry row scoped to three files would be a strictly weaker copy of an existing standing gate.
- step: 12
  phase: pre-deploy
  action: SLOC -- every file this plan writes stays under 500 with no budget entry and no raise marker.
  command: 'bin/venv-python -c "import pathlib; paths = [''scripts/checks/hygiene/validate_raises_discrimination.py'', ''scripts/checks/hygiene/_manifest.py'', ''tests/checks/hygiene/test_validate_raises_discrimination.py'']; sloc = lambda rel: len([line for line in pathlib.Path(rel).read_text(encoding=''utf-8'').splitlines() if line.strip() and not line.strip().startswith(''#'')]); [print(rel, ''sloc'', sloc(rel)) for rel in paths]; assert all(sloc(rel) < 500 for rel in paths); budgets = pathlib.Path(''config/sloc_budgets.yaml'').read_text(encoding=''utf-8''); assert ''validate_raises_discrimination'' not in budgets; print(''SLOC UNDER 500 WITH NO BUDGET ENTRY'')"'
  expected: 'One sloc line per file, each well under 500 (measured at implement time after the critique fold: 340 for the check module, 489 for the mirror test, 109 for the manifest), then SLOC UNDER 500 WITH NO BUDGET ENTRY.'
  fix_if: A file at or over 500 is decomposed into a facade package, never registered with a raise-approved marker (Decision 128 as amended by Decision 165).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_sloc_limits and validate_sloc_budget_raises already enforce both halves standingly across every file; a registry row naming three paths would shadow them with a narrower copy.
- step: 13
  phase: pre-deploy
  action: Whole-file coverage of the new scripts/ module through the real coverage checker, not a hand-rolled coverage run.
  command: bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files scripts/checks/hygiene/validate_raises_discrimination.py
  expected: The mapping line resolving the module to tests/checks/hygiene/test_validate_raises_discrimination.py, then all 1 source files at 100% and DIAGNOSTIC VERDICT PASS. Exits 0.
  fix_if: An uncovered line names an unexercised branch of the scanner -- add the fixture case that reaches it. Never add an entry to config/coverage_baseline.yaml for a file this plan creates.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: validate_test_coverage runs the same checker over the whole changed-file set in both tiers, so a registry row pinned to this one path would duplicate an existing standing gate.
- step: 14
  phase: pre-deploy
  action: Runtime bound -- the check costs a small, bounded fraction of the fast tier, since its pre_globs make it run on every --pre that touches tests/. The measured minimum IS this check's own static_s contribution to Decision 182's unwaivable non-test half -- record it, do not assume it, because reversal condition (a) makes that recorded series load-bearing.
  command: "bin/venv-python -c \"import contextlib, io, time; from scripts.checks import registry; fn = registry.resolve('validate_raises_discrimination'); samples = []\nfor _ in range(3):\n    failed = []\n    start = time.perf_counter()\n    with contextlib.redirect_stdout(io.StringIO()):\n        fn(failed)\n    samples.append(time.perf_counter() - start)\n    registry.pop_declaration()\n    assert failed == [], failed\nprint('RUNTIME_SECONDS', [round(s, 3) for s in samples], 'min', round(min(samples), 3))\nassert min(samples) < 10.0, samples\nprint('RUNTIME BOUND HELD')\""
  expected: 'Three samples printed with a minimum under 10 seconds, then RUNTIME BOUND HELD. Measured at plan time on the same tree: 2.15 to 2.27 seconds, against validate_test_count_coupling''s 2.29 seconds for the same tests/ walk. Record that printed minimum as the static_s increment this check adds to the fast tier''s non-test half; Decision 182''s own calibration measures the largest single --pre check at 7.448s of a 49.422s all-check total against a 240s unwaivable half, so the addition sits inside the design headroom and the number is recorded for the series, not as a budget claim.'
  fix_if: A minimum at or above 10 seconds means the scanner re-parses or re-walks -- parse each file once and reuse the tree, rather than loosening the bound.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A wall-clock sample is machine- and load-dependent, so pinning it as a standing registry row would produce a flaky guard; Decision 182's fast-tier budget assertion is the standing owner of tier cost.
- step: 15
  phase: pre-deploy
  action: Decision 182 breadth -- the declared scope's measured selection breadth predicts a within_budget fast tier.
  command: bin/venv-python -c "import json, subprocess, sys; result = subprocess.run([sys.executable, '-m', 'scripts.checks.deps.selection_budget', '--plan', 'docs/plans/PLAN-raises-discrimination-guard-advisory.yaml', '--json'], capture_output=True, text=True, encoding='utf-8'); lines = result.stdout.splitlines(); start = max(index for index, line in enumerate(lines) if line.strip() == '{'); report = json.loads(chr(10).join(lines[start:])); print(chr(10).join(lines[start:])); print('BREADTH n_selected', report['n_selected'], 'census', report['census'], 'outcome', report['predicted_outcome']); assert report['predicted_outcome'] == 'within_budget', report"
