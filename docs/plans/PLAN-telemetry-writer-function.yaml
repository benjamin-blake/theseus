execution_steps:
- >-
  Write the guard and handler tests first (tests/checks/iam_tf/test_telemetry_infra_pins.py, tests/lambdas/ducklake_telemetry_writer/test_handler.py,
  the invoke-implies-resolve red case) and run steps 1-2 to see them red on the unchanged tree.
- >-
  Write terraform/personal/ducklake_telemetry_writer.tf, then edit ducklake_lambdas.tf, oidc_ci_roles.tf and oidc.tf. Write
  the handler, __init__.py and manifest; edit the data-pipeline manifest, build_lambda.py and the build-path tests; edit
  validate_invoke_implies_resolve.py, the two contracts and the registry shards.
- Execute Verification Plan steps 1-5. Loop until they pass, never weakening an assertion. On an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure evidence (implement skill Commit Flows): step 5's completed full tier; push, PR, CI green, and the speculative-plan
  comment showing the guard routing to tf-gated-apply with exactly 7 to add, 4 to change, 0 to destroy (the creates named
  in step 6 and the four in-place updates, the writer function's change limited to environment). Any other pending change
  is unrelated drift: stop and report it. Confirm option A is applied, then ask Benjamin for the merge. On his word, squash-merge
  with the PR body, export MERGE_SHA, ask him to approve the tf-gated-apply run, then run steps 6-9.
- 'Report: what was provisioned, the verification results, and what the companion plan and plan 3 part 1 can now rely on'
rollback: >-
  Revert the squash commit in a new PR. Its plan destroys the new function, URL, role, policy, log group, SSM parameter
  and alarm (a destroy routes to tf-gated-apply) and restores the writer's pins and blob grant (in-budget). No data is written
  by this plan.
