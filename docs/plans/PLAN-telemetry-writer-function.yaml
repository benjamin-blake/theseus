    and meta_schema to the opener even when the event carries data_path / meta_schema keys; TELEMETRY_* unset -> 500 telemetry_env_unset
    and importing the module with them unset does not raise; attach_check fetches the DSN with exactly TELEMETRY_DSN_SECRET_ID
    and returns catalog_login without the host or password; an unexpected exception propagates. If check_test_file_exists
