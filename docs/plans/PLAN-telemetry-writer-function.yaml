schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-writer-function
intent: >-
  Telemetry slice 2a-2 (T2.36, rec-4024 carrier), option D, part 1 of 2. Telemetry write verbs get their own DuckLake Lambda,
  agent-platform-ducklake-telemetry-writer, with its own boundary-carrying execution role and AWS_IAM Function URL (Decision
  143 cl.3, Decision 213). That role reaches S3 only on the isolated ducklake_smoke catalog's data prefix and its fenced blob
  root, connects to the catalog as its own scoped login, and never reaches the production ducklake/ prefix, the shared
  catalog login or any ops_* verb. With PLAN-url-only-invoke-guard's boundary Denies, its requestContext.authorizer.iam
  caller identity is trustworthy, which plan 3 part 1's tenant derivation needs. This plan provisions the function with
  a stub handler (describe, attach_check) and moves the telemetry pins and blob grant off the shared writer. The companion plan PLAN-telemetry-writer-deploy-wiring
  adds the function to the governed deploy channel and its smoke gate once this one is applied. Telemetry is the learning
  signal for recursive self-improvement (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-writer-function.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Infrastructure groundwork carried by rec-4024; closes no exit criterion.
scope:
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Create
  purpose: >-
    The new function, mirroring ducklake_maintenance_smoke.tf (the Decision 143 split precedent) and the writer in
    ducklake_lambdas.tf. A header comment states the apply posture as it is today: role CREATE and any aws_lambda_function_url
    change route to tf-gated-apply (environment-taxonomy.yaml guard_classification), in-budget inline-policy writes and
    Lambda config changes auto-apply, code ships through deploy-ducklake-lambdas.yml (break-glass build_lambda --deploy
    only). Resources: (1) aws_cloudwatch_log_group "/aws/lambda/${local.ducklake_telemetry_writer_function}", 14-day retention.
    (2) aws_iam_role.ducklake_telemetry_writer named agent-platform-ducklake-telemetry-writer, permissions_boundary the
    agent-platform-github-ci-apply-boundary ARN built from var.account_id, assume_role_policy data.aws_iam_policy_document.lambda_assume.json.
    (3) aws_iam_role_policy.ducklake_telemetry_writer "DuckLakeTelemetryWriterRuntime" with exactly these Sids: Logs (CreateLogStream,
    PutLogEvents on the log group ARN :*); TelemetryDsnRead (GetSecretValue on aws_secretsmanager_secret.ducklake_telemetry_writer_dsn
    only, the scoped login's secret that PLAN-url-only-invoke-guard creates; never the shared ducklake-neon-catalog-dsn); TelemetryCatalogDataReadWrite (s3:GetObject, s3:PutObject
    on "${aws_s3_bucket.data_lake.arn}/${local.ducklake_smoke_data_prefix}/*" ONLY, no DeleteObject, never the production
    ducklake/ prefix); TelemetryCatalogDataList (s3:ListBucket, s3:GetBucketLocation on the bucket, StringLike s3:prefix
    ["${local.ducklake_smoke_data_prefix}/*"]); TelemetryBlobReadWrite and TelemetryBlobList moved from the writer and fenced
    to the pinned catalog's blob root (Benjamin 2026-10-08, reversing "no fence until 2c"): Get/Put on "${aws_s3_bucket.data_lake.arn}/${local.telemetry_blob_data_prefix}/${local.ducklake_telemetry_meta_schema}/*"
    and ListBucket conditioned on s3:prefix "${local.telemetry_blob_data_prefix}/${local.ducklake_telemetry_meta_schema}/*"; CloudWatchMetrics (PutMetricData conditioned on cloudwatch:namespace
    "DuckLakeTelemetryWriter"). (4) aws_lambda_function.ducklake_telemetry_writer: function_name local.ducklake_telemetry_writer_function,
    role the new role, python3.12, handler src.lambdas.ducklake_telemetry_writer.handler.handler, x86_64, timeout 120, memory_size
    3008 (the writer's baseline, Decision 82), reserved_concurrent_executions = 5 (bounds catalog sessions to 5 containers,
    per the connection review and the RDS swap thread's connection budget; 2c re-sizes it), s3_key lambda-packages/ducklake-telemetry-writer.zip,
    source_code_hash = try(filemd5("${path.module}/../../lambda-packages/ducklake-telemetry-writer.zip"), null), layers ducklake_deps
    and ducklake_extensions (no pgclient). Environment: TELEMETRY_META_SCHEMA = local.ducklake_telemetry_meta_schema, TELEMETRY_DATA_PATH
    = local.ducklake_smoke_data_path, TELEMETRY_BLOB_ROOT = local.ducklake_telemetry_blob_root, DUCKLAKE_EXTENSION_DIRECTORY
    = local.ducklake_extension_dir, DUCKLAKE_FIELD_SEMANTICS_PATH = "/var/task/config/lambda/ducklake/field_semantics.yaml",
    TELEMETRY_DSN_SECRET_ID = aws_secretsmanager_secret.ducklake_telemetry_writer_dsn.name.
    DUCKLAKE_DATA_PATH and DUCKLAKE_META_SCHEMA are NOT set. No comment line inside the variables block (terraform fmt, #1163).
    depends_on the role policy and the log group; lifecycle { ignore_changes = [source_code_hash] } (validate_deploy_channel_conformance
    globs ducklake*.tf). (5) aws_lambda_function_url, authorization_type AWS_IAM. (6) aws_ssm_parameter.ducklake_telemetry_writer_url, name "/agent-platform/ducklake/telemetry_writer_url"
    (String, the URL; PlatformDev's DuckLakeEndpointDiscovery already covers /agent-platform/ducklake/*). (7) aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors,
    alarm_name "ducklake-telemetry-writer-errors": AWS/Lambda Errors > 0 over 900 s on this function, alarm and ok actions to aws_sns_topic.alerts,
    notBreaching. (8) outputs ducklake_telemetry_writer_function_url and ducklake_telemetry_writer_function_name (the smoke
    URL fallback in scripts/ducklake_smoke/core.py reads the first). All ARNs are HCL interpolation; no literal account id
    (Decision 101).
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: >-
    (1) The shared locals block gains ducklake_telemetry_writer_function = "agent-platform-ducklake-telemetry-writer" beside
    the writer and reader names (kept here so the pin guard's locals parse sees it). (2) The writer's environment loses TELEMETRY_META_SCHEMA,
    TELEMETRY_DATA_PATH and TELEMETRY_BLOB_ROOT (no code reads them: recon 4.3). (3) DuckLakeWriterRuntime loses TelemetryBlobReadWrite
    and TelemetryBlobList; every ops statement is unchanged. (4) Comment-only: the role section header (:127) and the blob
    comment are corrected so the writer is described as ops-only. The reader's TELEMETRY_META_SCHEMA / TELEMETRY_DATA_PATH
    stay (C4, slice 2b), as do the three telemetry locals. No aws_iam_role resource is edited (a role update is out of budget).
- file: terraform/personal/oidc_ci_roles.tf
  action: Modify
  purpose: >-
    github_ci_branch gains two statements after MaintenanceSmokeInvokeCI, in the shape PLAN-url-only-invoke-guard gives the
    writer grants (its standing guard requires it): TelemetryWriterInvokeCI (lambda:InvokeFunctionUrl, lambda:GetFunctionUrlConfig
    on aws_lambda_function.ducklake_telemetry_writer.arn and its ":*" form) and TelemetryWriterInvokeCIViaUrlOnly (lambda:InvokeFunction
    on the same, condition Bool lambda:InvokedViaFunctionUrl = true). Both invoke actions are required for the AWS_IAM URL
    today (live-verified 2026-10-06). The comment says the deploy smoke job (companion plan) runs as this role and that the
    boundary denies direct invoke, which the companion plan's gate asserts. github_ci_pr and github_ci_planner get no grant.
- file: terraform/personal/oidc.tf
  action: Modify
  purpose: >-
    The planner's IAMPlatformRolesRead gains "arn:aws:iam::${var.account_id}:role/agent-platform-ducklake-telemetry-writer"
    with the same refresh-readable comment as the maintenance-smoke entry (validate_ci_refresh_read_coverage enumerates
    roles).
- file: src/lambdas/ducklake_telemetry_writer/__init__.py
  action: Create
  purpose: Empty package marker (the maintenance-smoke layout).
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Create
  purpose: >-
    Stub entrypoint `handler(event, context)`, under 150 SLOC. Module docstring: the function exists so telemetry identities
    never reach ops verbs (Decision 143 cl.3 and the new Decision); it is env-pinned to the telemetry catalog and never
    reads data_path or meta_schema from the event; plan 3 part 1 adds the verbs. Behaviour, in order: (a) caller identity:
    event["requestContext"]["authorizer"]["iam"] must be a dict with non-empty accountId and userArn, else 403 with error_type
    missing_caller_identity. Neither value, nor any hash of it, is logged or returned (Decision 101). (b) body parsing INSIDE
    the error handling: Function URL body as a JSON string (base64-decoded when isBase64Encoded is true) or a dict; a malformed
    body or a non-object JSON value is 400 error_type bad_request. There is no direct-invoke fallback (the writer's _parse_event
    returns the raw event; this one does not). (c) dispatch table {"describe", "attach_check"}; a missing or unknown action
    is 400 error_type unknown_action listing the actions. (d) describe is connectionless and returns ok, function "ducklake_telemetry_writer",
    actions (sorted), catalog {meta_schema: the pinned value, data_path_is_smoke: bool}. It never returns the data path or
    bucket. (e) attach_check acquires the per-container warm connection through rt.get_warm_connection with an opener that
    calls rt.open_connection(dsn=rt.fetch_dsn(), data_path=TELEMETRY_DATA_PATH, meta_schema=TELEMETRY_META_SCHEMA, extension_directory=DUCKLAKE_EXTENSION_DIRECTORY
    or rt.LAMBDA_EXTENSION_DIRECTORY), passing the same data_path / meta_schema as the cache key, runs SELECT 1, and returns
    ok, meta_schema, data_path_is_smoke, catalog_login (the username from the fetched secret; never the host or password),
    connect_ms, reused. The DSN comes from rt.fetch_dsn(secret_id=TELEMETRY_DSN_SECRET_ID), never the default shared secret.
    (f) env is read at call time, never at import (AGENTS.md): TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH or TELEMETRY_DSN_SECRET_ID
    unset is 500 error_type telemetry_env_unset, never a default to the ops catalog or the shared login. (g) a table-driven error map from exception class to (status, error_type) covers the cases above plus rt.DuckLakeRuntimeError
    -> 500 runtime; any other exception propagates (Lambda Errors -> the errors alarm), matching the writer's loud-fail
    posture (Decision 55). Responses use the writer's {statusCode, headers, body} envelope. Until plan 3 part 1 ships the
    function's Class B contract (which will contract describe as the agent-facing verb, as ducklake_writer.yaml does), describe
    and attach_check are gate instrumentation with no contract (Decision 118 note). attach_check uses the shared warm-ATTACH path (Decision
    88 cl.1(i)).
- file: src/lambdas/ducklake_telemetry_writer/manifest.yaml
  action: Create
  purpose: >-
    artifact ducklake-telemetry-writer.zip; functions [agent-platform-ducklake-telemetry-writer]; handlers [the handler];
    includes the import closure of handler.py: start from ducklake_maintenance_smoke's include list minus src/common/ducklake_maintenance.py
    and src/common/ducklake_maintenance_ops.py, plus this package's __init__.py, and let the manifest bundle checks decide
    (tests/lambda_manifest/test_bundle_checks.py, validate_lambda_manifest_coverage). src/telemetry/** is NOT included
    (plan 3 part 1 adds it). assets config/lambda/ducklake/version.yaml and config/lambda/ducklake/field_semantics.yaml (the
    env path points at it, so part 1 needs no Terraform change). status active. notes say why the function is separate,
    the env pins, the AWS_IAM URL-only invocation and that CI (github_ci_branch) is its only invoker until 2c.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: Exclude src/lambdas/ducklake_telemetry_writer/ beside the five DuckLake excludes (:44-48), so data-pipeline.zip never bundles it.
- file: scripts/build_lambda.py
  action: Modify
  purpose: >-
    The DuckLake build step also builds build_ducklake_function_package(temp_dir, "ducklake_telemetry_writer", "ducklake-telemetry-writer.zip"),
    prints its size and adds it to the artifacts tuple, so the PR speculative-plan job's upload-only mode uploads it to the
    fixed key before the gated apply creates the function (the ducklake-maintenance-smoke.zip precedent). Docstring/help/print
    text that counts or lists the function zips is updated. scripts/ci/ducklake_artifacts.py is NOT touched: like the smoke
    zip, the new zip stays out of the apply-path assert/fetch set (code ships through the deploy channel, Terraform ignores
    source_code_hash), and that file is rec-4189's open fix.
- file: docs/contracts/build-lambda.yaml
  action: Modify
