    The standing guard follows the move. _real() reads ducklake_lambdas.tf followed by ducklake_telemetry_writer.tf (locals
    come first). Pins (TELEMETRY_META_SCHEMA, TELEMETRY_DATA_PATH on smoke) are asserted on ducklake_telemetry_writer and
