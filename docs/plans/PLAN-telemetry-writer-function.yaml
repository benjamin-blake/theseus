    and NotAction included, and its env sets neither DUCKLAKE_DATA_PATH nor DUCKLAKE_META_SCHEMA). The ops-env invariant
    stays on the writer and reader only. Renamed nodes keep one behaviour each; the file stays under 500 SLOC.
- file: config/agent/verification_registry/entries/telemetry-infra-pins.yaml
  action: Modify
