constraints:
- >-
  No local terraform init, validate, plan or apply (Decision 119). CI's terraform-validate and the speculative plan are authoritative;
  never apply locally, even on a red record.
- >-
  Do not edit PlatformDev or PlatformAdmin policies (Decision 180), the bootstrap root, neon_ducklake_catalog.tf or the
  migration (all PLAN-url-only-invoke-guard's), any existing aws_iam_role or aws_lambda_function_url, or scripts/ci/ducklake_artifacts.py.
- >-
  Do not add the function to deploy-ducklake-lambdas.yml, build-lambda.yaml deploy_targets or build_lambda_config.py's deploy
  map in this plan: a listed function that does not exist yet fails the push-triggered deploy before the gated apply creates
  it. The companion plan does that after this apply.
- >-
  The handler never logs or returns the caller account id, userArn or any hash of them, and never reads data_path or meta_schema
  from the event (Decision 101; Decision 143 env-pinning).
- >-
  No Class A or Class B contract edit: the write_path amendments in ops_tenants, ops_projects and ops_entity_counters, storage-substrate's
  write_boundary and the function's Class B verb contract ship with plan 3 part 1's verbs.
- 'Public repository (Decision 101): no account id, ARN or hostname literal anywhere, including PR text and pasted logs.'
- No comment line inside a `variables = {}` block (terraform fmt).
- The merge waits for Benjamin's explicit word (production IAM change) and for PLAN-url-only-invoke-guard fully applied.
- No rescue agents or workaround loops (Decision 55).
