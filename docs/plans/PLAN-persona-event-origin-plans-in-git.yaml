  T4.2 splits persona hosting (Lambda-shaped verdict-persona paths removed; persona-verdict workflows named) and carries the
  verdict-chain, verdict-identity, trigger-policy-enforcement and interactive criteria (c8-c11) with Decision 164 still cited.
