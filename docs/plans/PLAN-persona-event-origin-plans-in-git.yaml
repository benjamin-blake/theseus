acceptance_criteria:
- >-
  Exactly one Decision whose title carries 'keys on GitHub event origin' exists, at or under 6,144 bytes (validate_decisions_size),
  with a bare yaml envelope (amends [184, 87, 116], significance numbered_decision) and a monitored reversal stanza; it carries
  every phrase VP 2 names -- including the Actions terms-of-service purpose sentence ('comfortably inside'), the operator's
  verbatim THIN SHELL paragraph and host-general verdict identity in clause 2, the plan-only fast-tier rule, and the verbatim
  clause-4 credential wording and CLI forward reference -- and no amends/supersedes edge other than the title's.
- >-
  Decisions 184, 87 and 116 carry dated Amended-by annotations naming the new number with their original bodies intact (Decision
  184 stays at or under 6,144 bytes); Decisions 73, 122, 164, 173 and 197 carry dated Update notes; docs/decisions-index.json
  is fresh.
- >-
  T4.1's intent types exactly two persona nodes (plan_agent, implement_agent), names the plan-PR await_verdict nodes and by-SHA
  merges, drops the Parallel critic block and the warehouse-row artifact line, and OPS-6 records a REAL remote ref; both re-pinned
  shards replay green.
- >-
  T4.2 splits persona hosting (Lambda-shaped verdict-persona paths removed; persona-verdict workflows named) and carries the
  verdict-chain with the verbatim thin-shell invariant (c8), the host-general verdict identity (c9), trigger-policy enforcement
  (c10), interactive use (c11), mixed-PR routing (c12) and the persona GitHub-agnosticism check with one image digest across
  hosts (c13), with Decision 164 still cited and no candidate substrate named in its lifecycle fields (CD.44 discipline point
  2).
- >-
  T4.5 is the permanent projection at grain (plan_path, head_sha) with persona write verbs NOT built and c8 intact; T4.6 is
  reserved with no dependents; T4.7 owns merged-but-unimplemented plans; T4.9a carries c7-c10 (c10 the decided plan-only fast
  tier, built by rec-4114); T4.16 c1 is rehomed to T4.5 and c2/c3/c4/c8/c9/c11 are re-grounded; T4.21 carries c7-c10 with
  c7 scoped to boundary-path changes.
- >-
  T4.12 carries the clause-3 placement split (cA, cD, cE, cG), its files_in_scope untouched; cD closes through closes_criteria
  at implement bookkeeping while T4.12 stays deferred_post_mvp (VP 21).
- >-
  T4.15 is a single-live-arm confirmation spike with a DESK-SCORED record over the three Lambda-variant arms (no arm result
  pre-written), states the persona launch path within Decision 185's subset, and c10 records the whole Actions-safe set's
  burden including plan-only main merges, with every token the t415 shard pins preserved.
- >-
  T4.25, T4.26 and T4.27 exist deferred_post_mvp depending only on T4.2, with no live item depending on them (T4.27 is the
  placeholder tier item PLAN-cli-persona-backend owns, which the clause-4 forward reference resolves to); CD.27 (detail bracket
  and ESB-04 point), CD.38 and CD.44 carry the clause annotations with every pinned phrase preserved.
- >-
  inference-provider.yaml's scheduled_agents note cites clause 4 and the API-key lane with a new amendment_log row; PROJECT_CONTEXT.md
  shows the plan-PR/verdict end-state within 14,032 bytes.
- >-
  The 22 named registry shards replay green, every added citation resolves to the minted Decision number, and the full presubmit
  tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Full tier on the committed, rebased, clean tree, then attest HEAD (git-ops handoff_sequence; Decision 163 pre-handoff
    run). Roadmap schema and graph, Decision 93 edges, decision-entry conformance, the per-entry size cap, supersession annotations,
    index freshness, prose budgets, tests/docs/test_project_context.py and the differential replay of the two diff-modified
    shards and every new graduated shard all gate here.
  command: >-
    bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree.
  fix_if: >-
    validate_decisions_size FAIL on the new entry means tighten its prose, never raise the cap. validate_supersession_annotations
    FAIL means a victim (184, 87 or 116) lacks the pointer annotation, or an extra amends/supersedes phrase leaked into the
    new block. validate_decisions_index_freshness FAIL means run --write. A roadmap schema FAIL on a bare-string criterion
    means a new criterion text contains a colon-space -- quote it.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    THE EVENT-ORIGIN DECISION EXISTS, IS ENVELOPED AND CARRIES EVERY CLAUSE. Located by title so the assertion survives the
    numbering race; the fence is built from chr(96); the edges leg proves only the title carries an amends phrase. The 6,144-byte
    cap is owned by validate_decisions_size (VP 1), so this standing form prints the size without pinning it and later dated
    annotations stay WARN-only per decision-entry.yaml's accretion_signal. Red on origin/main (asserted during planning: exits
    1 on its own AssertionError).
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in
    re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'keys on GitHub event origin' in
    m.group(2)]; assert len(es)==1, ('expected exactly one event-origin Decision entry', [m.group(1) for m in es]); n=es[0].group(1);
    b=es[0].group(0); fence='^'+chr(96)*3+'yaml'; assert re.search(fence+r'\s*\nnumber: '+n+r'\b', b, re.M), 'no bare yaml
    envelope carrying number '+n; assert 'value: numbered_decision' in b, 'envelope lacks value: numbered_decision'; assert
    chr(10)+'amends: [184, 87, 116]'+chr(10) in b, 'envelope amends list is not [184, 87, 116]'; sz=len(b.encode('utf-8'));
    need=['comfortably inside','GitHub-originated repository event','pull_request, push, workflow_run','outside GitHub','repository_dispatch','workflow_dispatch','maintainer','deterministic
    run','decision-scout','plan-critique','code-review','ci-rca','subagent-plan-review','claude.yml','persona compute','general-computing','workspace-mutating','verdict
    plane','pull_request_target','default branch','THIN SHELL','digest-pinned container image','run_persona entrypoint','local
    container twin','No persona logic lives in workflow YAML','never reads GITHUB_TOKEN','only GitHub-aware layer','shell
    change, never a persona change','check run on the head SHA','dedicated verdict App','Checks API','merges by SHA','push-to-main','rec-curator','transcript-review','scheduler
    port','T4.24','T4.15 c10','never a credential Theseus holds or intermediates','user-owned CLI backend','sole Theseus-held
    inference lane','unattended','T4.26','PLAN-cli-persona-backend','Decision 199','ops_execution_plans','(plan_path, head_sha)','Decision
    85','Decision 197','check-run output','docs/plans/**','fast tier','Main Canary','long_running_container','three Lambda-variant
    arms','P1-P3','Options considered','yaml reversal-conditions','vendor-terms','rec-3386']; miss=[p for p in need if p not
    in b]; assert not miss, ('event-origin Decision text missing', miss); edges=re.findall(r'(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)', b); assert edges==['184'], ('unexpected amends/supersedes edges in the entry body', edges); print('DEC_EVENT_ORIGIN_OK',
    n, sz)"
  expected: Prints the marker, the minted number and the entry's byte size (about 6,070).
  fix_if: >-
    A missing phrase means a clause was dropped or paraphrased -- restore STEP 1's text; over the cap means tighten prose;
    an extra edge means reword the phrase so it no longer reads 'amends/supersedes Decision N'.
  hermetic: true
  graduation: graduate
  graduation_check_id: persona-event-origin-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    DECISIONS 184, 87 AND 116 ARE AMENDED BY APPENDED ANNOTATION, NOT EDITED. Each carries a dated Amended-by line naming
    the minted number and its key words; a preservation leg per entry proves the original body line survives; Decision 184's
    6,144 cap stays pinned by the existing open-core-loop-definition-decision-clauses shard (VP 18). Red on origin/main (asserted
    during planning: exits 1 on its own AssertionError).
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in
    re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'keys on GitHub event origin' in
    m.group(2)]; assert len(es)==1, ('expected exactly one event-origin Decision entry', [m.group(1) for m in es]); n=es[0].group(1);
    b=es[0].group(0); want={'184':['event-origin','rec-3386','never a credential Theseus holds or intermediates','user-owned
    CLI backend','sole Theseus-held inference lane','actions-policy'],'87':['git','clause 1','clause 2','forward note','warehouse-native','(plan_path,
    head_sha)','GitHub identit','check-run output','clause 6'],'116':['unattended','LiteLLM API-key lane','user-owned CLI
    backend','T4.12','T4.26','copilot-sdk']}; keep={'184':'scheduled-agent lane is unchanged','87':'never had a git life','116':'Routine/non-agentic
