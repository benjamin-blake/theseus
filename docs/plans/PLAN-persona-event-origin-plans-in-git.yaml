  ## Decision 205: GitHub-hosted persona compute keys on GitHub event origin; plans live in git; unattended agents use the API-key lane (amends Decision 184, Decision 87 and Decision 116) (Decided)

  ```yaml
  number: 205
  status: Decided
  decided_date: "2026-09-27"
  amends: [184, 87, 116]
  significance:
    value: numbered_decision
    justification: "Durable placement, authority and credential rule; no contract owns where personas run or which surface holds plan authority; amendment_forms cannot amend three bodies"
  ```

  **Status:** Decided
  **Date:** 2026-09-27
  **Warehouse ID:** dec-205 (per Decision 84 backfill)

  **Problem:** rec-3386 put event-triggered personas in the Actions-safe set, but Decision 184 clause 3 encoded "never persona compute" and left scheduled agents unplaced (T4.12 cD); Decision 87's 2026-08-19 amendment made executor plans warehouse-native.

  **Intent:** A persona runs where its trigger originates; every plan lives in git; Theseus holds one inference lane.

  **Decision:**
  1. Event origin. The goal is to remain comfortably inside GitHub's terms for Actions usage, whose burden clause targets general-computing workloads, not repository-lifecycle work. An LLM persona runs on GitHub-hosted runners only when a GitHub-originated repository event (pull_request, push, workflow_run) triggers it, and only verdict-shaped: it reads a pinned SHA and emits a check run or rec, never a commit. Queue pickup is event-driven, but an event from outside GitHub never qualifies: opening a PR is a repository event; schedule, repository_dispatch and a workflow_dispatch from an off-GitHub App or bot are not. A workflow_run qualifies when its upstream does or on a deterministic run's failure; a workflow_dispatch qualifies when a maintainer's own identity, or a qualifying run on its own failure, issues it. Eligible: decision-scout (plan PR touching docs/plans/PLAN-*.yaml opened as draft), plan-critique (plan PR ready for review; revision commits re-trigger), code-review (PR with no plan file opened as draft), ci-rca, subagent-plan-review. Planning and implementation persona compute never runs on Actions: not GitHub-event-triggered, general-computing shaped, workspace-mutating. Actions stays the verdict plane (CD.38); the reselling note stands.
  2. Verdict integrity. Never pull_request_target (T4.21's base-ref guard runs no LLM): a secretless pull_request trigger chains by workflow_run to a verdict job running the default branch's definition and code on a slim image, reading the PR as API data and failing, never skipping, off the author allowlist. The verdict is a check run on the head SHA under the GitHub Actions identity, which the executor App cannot author or dismiss; the T4.9a callback is a pointer, and the orchestrator reads the Checks API and merges by SHA.
  3. Scheduled agents. Repo-scoped agents (doc-freshness, orphan-code, code-smell, prompt-quality) move from cron to path-filtered push-to-main triggers. Agents over non-repo data (rec-curator, transcript-review) never run on Actions -- a cron-driven agentic job over product data is the clause-4 serverless shape -- and reach a scheduler port (cloud: EventBridge to Step Functions or Lambda; local: T4.24). Deterministic scheduled workflows (terraform-drift, health probes, main-canary, CodeQL) stay on Actions; their job-minutes count in T4.15 c10.
  4. Credential. A consumer subscription is never a credential Theseus holds or intermediates in any tier; it is permitted as a user-owned CLI backend (the unmodified vendor CLI, signed in by the user, on user-owned substrate) and never on the Theseus-hosted paid plane. API keys via LiteLLM remain the sole Theseus-held inference lane; every unattended agent in a Theseus-operated deployment uses it. Decision 116's claude -p lane survives as the user-owned CLI backend class; ci-rca and subagent-plan-review keep it until T4.26. The CLI persona backend is a post-MVP tier item owned by a separate plan (PLAN-cli-persona-backend); its design-now constraints on T4.10a / Decision 199 / the run_persona port land with that plan.
  5. Plans in git. The executor App opens a draft plan PR; the approved plan merges before a separate implementation PR, whose merge writes the plan's edges (Decision 197). Content is the git file at a SHA (Decision 85 stands unconditionally); status derives from PR state and verdict check runs; ops_execution_plans is a permanent projection, one row per (plan_path, head_sha). Decision 87's clause 1 destination, clause 2 flip and forward note retire; critique directives live in check-run output.
  6. Compute plane. CD.44's plane and T4.15 cover planning and implementation only. long_running_container (Fargate; locally a container) is presumptive: T4.15 confirms it live and desk-scores durable_functions, sfn_over_stateless_workers and self_checkpointed_lambda_dynamodb against P1-P3; CD.27 ratifies on that record.

  **Options considered:** Verdict personas on the compute plane -- rejected: mis-reads rec-3386. A pull_request job holding secrets -- rejected: a same-repo PR runs its own workflow copy. Orchestrator workflow_dispatch -- rejected: off-GitHub origin. Warehouse-authoritative plans -- rejected: two systems of record split by author; 100-300 plan PRs a month is low volume for git. Plan inside the implementation PR -- rejected: routing keys on the plan file.

  ```yaml reversal-conditions
  decision: 205
  review_by: 2027-03-31
  on_trigger: "re-decide via /plan"
  conditions:
    - id: actions-policy
      kind: manual
      description: "GitHub restricts LLM verdict jobs, or T4.15 c10's burden draws a notice: move verdict personas off Actions."
    - id: plan-authority
      kind: manual
      description: "Revision cycles fall under a minute or plans go cross-repo: reopen clause 5."
    - id: container-infeasible
      kind: manual
      description: "T4.15 finds long_running_container fails P1-P3: reopen clause 6."
  ```

  **Related:** Decisions 72, 77, 85, 122, 164, 173, 185, 196, 197; CD.27, CD.38, CD.44; T4.2, T4.9a, T4.21, T4.25, T4.26; rec-3386.

