schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-event-origin-plans-in-git
intent: >-
  Correct rec-3386's mis-encoding in Decision 184 clause 3 so that where an LLM persona runs follows where its trigger originates
  -- verdict-shaped personas triggered by GitHub-originated repository events run on GitHub-hosted runners, planning and implementation
  never do, with the stated goal of remaining comfortably inside GitHub's terms for Actions usage -- and, in the same numbered
  Decision, place the scheduled agents, recast the credential policy (API keys for every unattended agent; a user's own subscription
  only as a user-owned CLI backend), give every plan a git life (retiring Decision 87's authority flip) and re-scope the T4.15
  spike to planning and implementation with long_running_container presumptive. Governance and roadmap encoding only -- no
  workflow, Lambda, terraform, config or Python code lands.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-persona-event-origin-plans-in-git.yaml
phase: >-
  Platform T4 (executor). Governance amendment across T4.1, T4.2, T4.5, T4.6, T4.9a, T4.12, T4.15, T4.16 and T4.21 plus three
  new deferred_post_mvp items (T4.25, T4.26, T4.27); closes T4.12 cD. T4.1 and T4.2 are CD.27-gated, so the fallback_reevaluation
  block is carried.
fallback_reevaluation:
  reevaluated_on: '2026-09-27'
  substrate_status: >-
    CD.27's layer-2 substrate is unratified. This plan records long_running_container as the PRESUMPTIVE substrate (the new
    Decision's clause 6) and re-scopes T4.15 to confirm it on one live arm while desk-scoring durable_functions, sfn_over_stateless_workers
    and self_checkpointed_lambda_dynamodb against P1/P2/P3; the durable_functions incumbent formally stands until T4.15 rules,
    and CD.43's store stays TBD.
  verdict: continue_on_current_substrate
  basis: >-
    No persona has executed, so unplanned_resume_rate has no data and no Lambda Durable Functions regression is recorded.
    The fallback_spec's lapse_condition fires only when T4.15 pins a non-replay substrate; T4.15 is re-scoped here, not run,
    so neither the trigger nor the lapse has fired and the obligation carries forward unchanged.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    One new numbered Decision (205 at drafting; re-checked against origin/main's max header at implement time) titled 'GitHub-hosted
    persona compute keys on GitHub event origin; plans live in git; unattended agents use the API-key lane (amends Decision
    184, Decision 87 and Decision 116)', its full drafted text in STEP 1, at or under 6,144 bytes (6,096 drafted) with a bare
    yaml envelope (amends [184, 87, 116]) and a monitored reversal stanza. Dated '> **Amended by Decision N (DATE):**' annotations
    appended to Decisions 184, 87 and 116 and one-line '> **Update (DATE):**' notes appended to Decisions 73, 122, 164, 173
    and 197 (STEP 2); no existing body line is edited.
- file: docs/decisions-index.json
  action: Modify
  purpose: >-
    Regenerated by scripts.decisions_index --write after the DECISIONS.md edit (never hand-edited, Decision 160/179).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    CD.27 (detail and ESB-04), CD.38 and CD.44 annotations; T4.1 node list (plan-PR await_verdict nodes, two persona typings);
    T4.2 persona host split with verdict-chain, identity, trigger-policy and interactive criteria; T4.5 re-grounded to the
    permanent projection; T4.6 to status reserved; T4.9a verdict-acceptance criteria; T4.12 placement split (closes cD); T4.7
    merged-but-unimplemented criterion; T4.15 confirmation-spike re-scope; T4.16 pin and authorship re-grounding; T4.21 boundary
    criteria; new T4.25, T4.26 and T4.27 (deferred_post_mvp). Exact texts in STEPS 4-13.
- file: docs/contracts/inference-provider.yaml
  action: Modify
  purpose: >-
    operative_state.scheduled_agents.note re-pointed from Decision 116's judgment-to-claude -p split to the new Decision's
    clause 4 (every unattended scheduled agent on the LiteLLM API-key lane), plus the Decision 168 Class D amendment_log row
    (STEP 14).
- file: docs/PROJECT_CONTEXT.md
  action: Modify
  purpose: >-
    Executor end-state diagram redrawn for plan PRs and Actions verdicts, plus one T4.2 persona phrase, within the 14,032-byte
    S8 budget (14,001 projected) (STEP 15); the critical-path line pinned by tests/docs/test_project_context.py stays verbatim.
    The Source stamp is NOT refreshed (advisory drift, the #1098 stamp_ref convention).
- file: config/agent/verification_registry/entries/t41-rescoped-to-step-functions-host.yaml
  action: Modify
  purpose: >-
    Graduated shard pinning T4.1's persona-node typings by equality (len(nodes)==4); re-pinned in the same commit to len(nodes)==2
    plus a tightening leg asserting the await_verdict nodes (STEP 16). Re-pinning a graduated equality to the edited structure
    is not a CONTENT weakening: the check still pins by equality and gains a leg.
- file: config/agent/verification_registry/entries/t4x-persona-contracts-mechanism-word-free.yaml
  action: Modify
  purpose: >-
