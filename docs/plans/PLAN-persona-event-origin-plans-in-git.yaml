    re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'keys on GitHub event origin' in
    m.group(2)]; assert len(es)==1, ('expected exactly one event-origin Decision entry', [m.group(1) for m in es]); n=es[0].group(1);
    b=es[0].group(0); want={'73':['docs/plans/**','fast tier','Main Canary','rec-4114'],'122':['T4.2','executor_path','unattended'],'164':['PLAN-cli-persona-backend','T4.27','reversal
    (b)','long_running_container'],'197':['implementation merge','plan merge writes no edges'],'173':['T4.26','fixed-allowance-saturation','metered']};
    probs=[]; blocks={k:re.search(r'^## Decision '+k+r':.*?(?=^## Decision |\Z)', t, re.M|re.S).group(0) for k in want}; ups={k:[l
