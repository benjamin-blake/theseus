    host split with verdict-chain, identity, trigger-policy and interactive criteria; T4.5 re-grounded to the permanent projection;
    T4.6 to status reserved; T4.9a verdict-acceptance criteria; T4.12 placement split (closes cD); T4.15 confirmation-spike
    re-scope; T4.16 pin and authorship re-grounding; T4.21 boundary criteria; new T4.25 and T4.26 (deferred_post_mvp). Exact
    texts in STEPS 4-13.
- file: docs/contracts/inference-provider.yaml
