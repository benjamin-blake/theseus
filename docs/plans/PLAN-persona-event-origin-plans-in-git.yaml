  T4.5 is the permanent projection at grain (plan_path, head_sha) with persona write verbs NOT built and c8 intact; T4.6 is
  reserved with no dependents; T4.9a carries c7-c10; T4.16 c1 is rehomed to T4.5 and c2/c3/c4/c8/c11 are re-grounded; T4.21
  carries c7-c10.
- >-
  T4.12 carries the clause-3 placement split (cA, cD, cE, cG) with files repointed to terraform/personal/prod_lambdas.tf,
  and cD closes through closes_criteria at implement bookkeeping.
- >-
  T4.15 is a single-live-arm confirmation spike with a DESK-SCORED record over the three Lambda-variant arms, states the persona
  launch path within Decision 185's subset, and c10 records the whole Actions-safe set's burden including plan-only main merges,
  with every token the t415 shard pins preserved.
- >-
  T4.25 and T4.26 exist deferred_post_mvp depending only on T4.2, with no live item depending on either; CD.27 (ESB-04), CD.38
  and CD.44 carry the clause annotations with every pinned phrase preserved.
- >-
  inference-provider.yaml's scheduled_agents note cites clause 4 and the API-key lane with a new amendment_log row; PROJECT_CONTEXT.md
  shows the plan-PR/verdict end-state within 14,032 bytes.
- >-
  The 22 named registry shards replay green, every added citation resolves to the minted Decision number, and the full presubmit
  tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Full presubmit tier (Decision 163 pre-handoff run). Roadmap schema and graph, Decision 93 edges, decision-entry conformance,
    the per-entry size cap, supersession annotations, index freshness, prose budgets and the differential replay of the two
    diff-modified shards and every new graduated shard all gate here.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with the all-checks-passed summary.
  fix_if: >-
    validate_decisions_size FAIL on the new entry means tighten its prose, never raise the cap. validate_supersession_annotations
    FAIL means a victim (184, 87 or 116) lacks the pointer annotation, or an extra amends/supersedes phrase leaked into the
    new block. validate_decisions_index_freshness FAIL means run --write. A roadmap schema FAIL on a bare-string criterion
    means a new criterion text contains a colon-space -- quote it.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    THE EVENT-ORIGIN DECISION EXISTS, IS ENVELOPED, FITS THE CAP AND CARRIES EVERY CLAUSE. Located by title so the assertion
    survives the numbering race; the fence is built from chr(96); the edges leg proves only the title carries an amends phrase.
    Red on origin/main (asserted during planning: exits 1 on its own AssertionError).
  command: >-
    bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); es=[m for m in
    re.finditer(r'^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)', t, re.M|re.S) if 'keys on GitHub event origin' in
    m.group(2)]; assert len(es)==1, ('expected exactly one event-origin Decision entry', [m.group(1) for m in es]); n=es[0].group(1);
    b=es[0].group(0); fence='^'+chr(96)*3+'yaml'; assert re.search(fence+r'\s*\nnumber: '+n+r'\b', b, re.M), 'no bare yaml
    envelope carrying number '+n; assert 'value: numbered_decision' in b, 'envelope lacks value: numbered_decision'; assert
    chr(10)+'amends: [184, 87, 116]'+chr(10) in b, 'envelope amends list is not [184, 87, 116]'; sz=len(b.encode('utf-8'));
    assert sz<=6144, ('over the 6144-byte cap', sz); need=['comfortably inside','GitHub-originated repository event','pull_request,
    push, workflow_run','outside GitHub','repository_dispatch','workflow_dispatch','maintainer','deterministic run','decision-scout','plan-critique','code-review','ci-rca','subagent-plan-review','persona
    compute','general-computing','workspace-mutating','verdict plane','reselling','pull_request_target','default branch','check
    run on the head SHA','GitHub Actions identity','Checks API','merges by SHA','slim image','push-to-main','rec-curator','transcript-review','scheduler
    port','T4.24','terraform-drift','T4.15 c10','never a credential Theseus holds or intermediates','user-owned CLI backend','sole
    Theseus-held inference lane','unattended','T4.26','PLAN-cli-persona-backend','run_persona','Decision 199','ops_execution_plans','(plan_path,
    head_sha)','Decision 85','Decision 197','check-run output','long_running_container','durable_functions','sfn_over_stateless_workers','self_checkpointed_lambda_dynamodb','P1-P3','Options
    considered','yaml reversal-conditions','rec-3386']; miss=[p for p in need if p not in b]; assert not miss, ('event-origin
    Decision text missing', miss); edges=re.findall(r'(?:amends|Amends|supersedes|Supersedes) Decision (\d+)', b); assert
    edges==['184'], ('unexpected amends/supersedes edges in the entry body', edges); print('DEC_EVENT_ORIGIN_OK', n, sz)"
  expected: Prints the marker, the minted number and the entry's byte size (about 6,030).
  fix_if: >-
    A missing phrase means a clause was dropped or paraphrased -- restore STEP 1's text; over the cap means tighten prose;
    an extra edge means reword the phrase so it no longer reads 'amends/supersedes Decision N'.
  hermetic: true
  graduation: graduate
  graduation_check_id: persona-event-origin-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    DECISIONS 184, 87 AND 116 ARE AMENDED BY APPENDED ANNOTATION, NOT EDITED. Each carries a dated Amended-by line naming
    the minted number and its key words; a preservation leg per entry proves the original body line survives; Decision 184
