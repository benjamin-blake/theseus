pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 198 and the plan-cited decision sections read
  - docs/contracts/package-registry-reservation.yaml and rec-3995 read in full
  - docs/contracts/vp-red-before.yaml read before touching any graduation disposition
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable

execution_steps:
  - Create the four placeholder package roots, each with its manifest, one trivial real function, and a LICENSE copied byte-for-byte from the root LICENSE. No .md files.
  - Author .github/workflows/publish-ontheloop.yml -- dispatch-only, environment pypi, id-token write on the publish job only, no secret reference.
  - Register the workflow -- r3_workflows body entry, ci_rca_taxonomy row, CODEOWNERS row, and the deploy-paths publish_artifacts row with its amendment_log entry.
  - Register the subtree in file-router -- route plus the amendment_log entry, paid for by compacting the four multi-line entries named in constraint 3.
  - Amend docs/contracts/package-registry-reservation.yaml with the ten corrections and the pypi_trusted_publisher trust triple under one dated amendment_log entry; bump contract_version to 2.
  - Author tests/test_ontheloop_placeholder_packages.py covering every invariant the test_obligations table names, plus the no-polyglot-toolchain-in-CI assertion.
  - Execute the Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, and the operator handoff for VP steps 20-26.'

rollback: >-
  Pre-publish this is a pure revert -- no name is claimed by the merge itself. Post-publish it is
  NOT reversible on crates.io (yank only, never delete) and only partially on npm (72h unpublish).
  On PyPI, delete the release files but NEVER the project: deleting the project frees the name,
  which is the exact outcome this plan exists to prevent.
