constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Public repo (Decision 101 clause (d), unaffected by Decision 198): no tokens, credentials, AWS
    account IDs or personal identity in any committed file. The published contact is the role alias
    security@otl-labs.com, never a personal mailbox.
  - >-
    docs/contracts/file-router.yaml measures 493 of its 500 effective-line Decision 166
    contracts-class limit. Pay for the route and the amendment_log entry by compacting the four
    remaining multi-line amendment_log entries (2026-09-15, 2026-09-13, 2026-09-12, 2026-09-07) to
    one-line summaries, preserving every date, plan name and Decision citation -- measured to free
    24 effective lines, landing the file at 476. Decision 128: compact, never a budget raise;
    splitting this file is forbidden for its class, and compaction is the first-named relief valve
    in its own class row.
  - >-
    NO .gitignore change and NO `npm install` anywhere in the repository tree. Tier_item T2.53
    criterion c7 reserves that remedy to itself -- it requires .gitignore coverage PLUS a
    deterministic registered check, explicitly "NOT a .gitignore convention" -- and states an
    absolute standing rule against in-tree npm installs until it lands. The placeholders are
    zero-dependency, so no install is ever required; operator dry-runs happen in a scratch copy.
  - >-
    NO README.md or any other .md file under packages/. Both existing non-agent prose classes
    entered prose_allowlist.allowed_globs via a numbered Decision that said so inline (marketing/**
    = Decision 101(c); the licence artefacts = Decision 171 clause 7, "amending Decision 127 point
    1's permanent-class enumeration"). A third class needs the same authority, which this plan does
    not mint -- the neutral pointer lives in each manifest's own description field, which all three
    registries render. rec-4013 carries the class and its authorising Decision.
  - >-
    The placeholder publish is NOT a free-tier release. Decision 184 clause 5 and Decision 194
    clause 4 hold that the Additional Use Grant's production carve-out is undecided and precedes any
    free-tier release; an inert namespace hold ships no free tier and does not engage either clause.
  - >-
    packages/ holds the PLATFORM's distribution namespace (Decision 184 clause 1), not a product's
    -- Decision 178 keeps this repository platform-only.
  - >-
    No Node or Rust toolchain enters CI (VP step 12 enforces this). Only the PyPI publish runs in
    Actions; npm and crates.io publish locally. Decision 80's single-language/no-compiled-build
    premise and its clause 4 revisit trigger are therefore unchanged.
  - >-
    The four per-package LICENSE copies extend the Decision 195 clause 2 surface from one file to
    five, and validate_licence_consistency pins only the root. VP step 4's byte-equality check is
    the mechanism that keeps clause 2 true: when the founder-to-company IP assignment executes, all
    five Licensor lines move in the SAME commit as the regex.
  - >-
    scripts/package_registry_probe.py and tests/test_package_registry_probe.py are NOT modified.
    rec-3981 and rec-3982 stay open and unbundled by operator decision.
  - >-
    Decision 198 clause 3's identifier map settles the GitHub org handle as `otl-labs`. The npm org
    is `onthelooplabs`, a separate registry-account identifier the map does not name; record it as
    the operational fact it is and do not re-litigate the handle. Decision 195 clause 4 is only
    PARTIALLY discharged and rec-3905 stays open.
  - >-
    The contract CITES Decision 198's identifier map; it never hosts it (Decision 198's own
    significance block forbids that routing).

