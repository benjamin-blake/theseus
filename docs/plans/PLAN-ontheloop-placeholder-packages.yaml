schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ontheloop-placeholder-packages
intent: >-
  Scaffold the inert placeholder package sources and the PyPI Trusted-Publishing workflow that let
  the operator actually claim the `ontheloop` distribution namespace on PyPI, npm and crates.io,
  and correct docs/contracts/package-registry-reservation.yaml where Decision 198 and execution
  experience have falsified it. Execution half of rec-3941; closes rec-3995.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ontheloop-placeholder-packages.yaml
phase: >-
  No platform roadmap tier_item. Operator-identity work in the same class as rec-3905, filed under
  the soft-warn exception category user_explicit_out_of_scope -- the Tier Item Freshness Gate does
  not fire because no tier_item is claimed. RELATED, none foreclosed: T1.13, T2.50, T2.54, T2.56,
  T4.23. T2.53 c7 is respected by construction (constraint 4).

scope:
  - file: packages/ontheloop-py/pyproject.toml
    action: Create
    purpose: >-
      Python placeholder manifest for the bare distribution `ontheloop`: version 0.0.0, license
      BUSL-1.1, neutral description naming the canonical scoped package, repository URL.
  - file: packages/ontheloop-py/src/ontheloop/__init__.py
    action: Create
    purpose: One trivial real function plus a pointer constant. No platform imports.
  - file: packages/ontheloop-py/LICENSE
    action: Create
    purpose: Byte-identical copy of the root LICENSE -- BUSL-1.1 is meaningless without its parameters.
  - file: packages/ontheloop-js/package.json
    action: Create
    purpose: npm manifest for the BARE name `ontheloop` (the defensive hold rec-3941 probes).
  - file: packages/ontheloop-js/index.js
    action: Create
    purpose: One trivial real function plus a pointer to the canonical scoped package.
  - file: packages/ontheloop-js/LICENSE
    action: Create
    purpose: Byte-identical copy of the root LICENSE.
  - file: packages/ontheloop-js-scoped/package.json
    action: Create
    purpose: npm manifest for the CANONICAL scoped name `@onthelooplabs/ontheloop`.
  - file: packages/ontheloop-js-scoped/index.js
    action: Create
    purpose: One trivial real function. No platform imports.
  - file: packages/ontheloop-js-scoped/LICENSE
    action: Create
    purpose: Byte-identical copy of the root LICENSE.
  - file: packages/ontheloop-rs/Cargo.toml
    action: Create
    purpose: >-
      Crate manifest carrying name, version, license, description and repository. crates.io
      publication is IMMUTABLE, so every field must be right at 0.0.0.
  - file: packages/ontheloop-rs/src/lib.rs
    action: Create
    purpose: One trivial real function. No platform imports, no dependencies.
  - file: packages/ontheloop-rs/LICENSE
    action: Create
    purpose: Byte-identical copy of the root LICENSE.
  - file: .github/workflows/publish-ontheloop.yml
    action: Create
    purpose: >-
      workflow_dispatch-only PyPI publish via OIDC Trusted Publishing. Declares `environment: pypi`
      verbatim (part of PyPI's trust binding) and `id-token: write` on the publish job only. PyPI
      ONLY -- one workflow per registry, never co-mingled.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Path row for the publish workflow, so modifying the publish path needs code-owner review on
      top of the Environment gating its execution (the T2.50 mechanism).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      workflows-map row for the new workflow (tier not_a_gate, ci_rca excluded), mirroring the
      tf-gated-apply-prototype precedent for a dispatch-only, human-gated workflow.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: r3_workflows entry for the workflow's single inline `run:` body (Decision 162 R3).
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      A publish_artifacts row indexing the registry-publication channel (trigger, actor_role
      operator, recovery), plus the Class D amendment_log entry Decision 168 requires. Decision 126 clause 1 governs the three
      AGENT intents plus an operator-only admin tier; a registry publish is neither, so this row
      is a deliberate EXTENSION of the operator tier rather than something clause 1 compels --
      taken because the index is the documented place an agent looks for a shipping path, and a
      fourth trigger it does not name is the improvisation risk clause 1's Problem describes.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Route for the new packages/ subtree, the amendment_log entry validate_contract_drift
      requires, and the amendment-log compaction that pays for both (see constraint 3).
  - file: docs/contracts/package-registry-reservation.yaml
    action: Modify
    purpose: >-
      TEN corrections under one dated amendment_log entry, contract_version 1 -> 2. Four are
      rec-3995's; two more are the stale rec-3922 framing in posture.disposition and
      posture.neutral_placeholder that rec-3995's own oracle does not reach; four are
      execution-discovered. Also adds the machine-readable pypi_trusted_publisher block VP step 13
      checks the live workflow against.
  - file: tests/test_ontheloop_placeholder_packages.py
    action: Create
    purpose: >-
      Standing regression guards for the placeholder invariants: published names, pinned version,
      BUSL-1.1 declared, per-package LICENSE parity with root, source inertness, the publish
      workflow's dispatch-only / credential-free shape, the PyPI trust triple, and the absence of
      any Node or Rust toolchain in CI.
  - file: docs/plans/PLAN-ontheloop-placeholder-packages.yaml
    action: Create
    purpose: This plan artefact.

bundled_recommendations:
  - rec-3995
followon_recs:
  - rec-3941
  - rec-4013
  - rec-4014
  - rec-4015
  - rec-4016
  - rec-4017
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    Four placeholder package roots exist under packages/, each declaring version 0.0.0 and license
    BUSL-1.1, each shipping a LICENSE byte-identical to the root LICENSE, and each source file free
    of any import/require/use statement. Proven by VP steps 1-5.
  - >-
    The published names are exactly `ontheloop` on PyPI, `ontheloop` and `@onthelooplabs/ontheloop`
    on npm, and `ontheloop` on crates.io. No hyphenated or other variant is claimed (the contract's
    anti-squatting posture). Proven by VP steps 1-3.
  - >-
    .github/workflows/publish-ontheloop.yml triggers on workflow_dispatch only, declares
    `environment: pypi`, carries `id-token: write` on the publish job and no id-token permission at
    the top level, and references no secret, password or upload-artifact. Proven by VP steps 6-7.
  - >-
    Every registration this repository mechanically requires of a new workflow is present -- the
    r3_workflows body entry and the ci_rca_taxonomy row -- alongside three VOLUNTARY ones the
    plan adds for discoverability and change-control: the CODEOWNERS row, the deploy-paths
    publish_artifacts row, and the file-router route (validate_placement checks route shape and
    dead targets only; it does not require a subtree to be routed). Proven by VP steps 8-11, 14.
  - >-
    The PyPI trust binding is structurally guarded, not merely described: the contract records the
    repository/workflow-filename/environment triple and a check fails if the live workflow drifts
    from it. Proven by VP step 13.
  - >-
    No Node or Rust toolchain enters any CI workflow, so Decision 80's single-language premise is
    preserved by construction. Proven by VP step 12.
  - >-
    docs/contracts/file-router.yaml stays at or under 490 effective lines (Decision 166 contracts
    class, limit 500), and the amendment-log compaction lost no date and no PLAN-/Decision/rec
    citation token. Proven by VP steps 14-15, the latter by set-difference over both.
  - >-
    rec-3995's acceptance oracle passes, and each of the ten corrections is asserted against the
    specific key it belongs to: C1 header comment, C2 posture.installability_rationale,
    C3 identity.security_contact, C4 identity.crates_io_ownership (rec-3995's four);
    C5 posture.disposition, C6 posture.neutral_placeholder (the two its own oracle misses);
    C7 posture.scope_anti_squatting, C8 procedure.npm, C9 procedure.pypi, C10 procedure.crates_io
    (execution-discovered). Zero live rec-3922 citations outside the append-only amendment_log,
    a complete pypi_trusted_publisher block, contract_version 2. Proven by VP steps 16-17.
  - >-
    The four artefacts are published and OURS -- the probe exits 0 (step 24) and the owner read
    names the company identity on each (step 25). rec-3941 is deliberately NOT closed by this
    plan's merge and carries no closure step; it is the operator's post-publish disposition,
    which is why it sits in followon_recs rather than bundled_recommendations.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Python placeholder manifest declares the bare name, the pinned version and BUSL-1.1.
    command: bin/venv-python -c "import tomllib,pathlib;p=tomllib.loads(pathlib.Path('packages/ontheloop-py/pyproject.toml').read_text())['project'];print('PY_NAME='+p['name']);print('PY_VERSION='+p['version']);print('PY_LICENSE='+p['license'])"
    expected: The manifest parses and reports the bare name, version 0.0.0 and the BUSL-1.1 expression.
    fix_if: Manifest missing, misnamed, unpinned, or declaring a different licence.
    hermetic: true
    expected_literals: ["PY_NAME=ontheloop", "PY_VERSION=0.0.0", "PY_LICENSE=BUSL-1.1"]
    graduation: graduate
    graduation_check_id: ontheloop-py-manifest-identity
  - step: 2
    phase: pre-deploy
    action: Both npm manifests declare their intended names -- bare defensive hold and canonical scope.
    command: bin/venv-python -c "import json,pathlib;b=json.loads(pathlib.Path('packages/ontheloop-js/package.json').read_text());s=json.loads(pathlib.Path('packages/ontheloop-js-scoped/package.json').read_text());print('JS_BARE='+b['name']);print('JS_SCOPED='+s['name']);print('JS_VERSIONS='+b['version']+','+s['version']);print('JS_LICENSES='+b['license']+','+s['license']);print('JS_SCOPED_ACCESS='+str((s.get('publishConfig') or {}).get('access')))"
    expected: Bare and scoped names both correct, both at 0.0.0, both BUSL-1.1.
    fix_if: >-
      Either manifest missing, the scope spelled @ontheloop rather than @onthelooplabs, or
      publishConfig.access absent -- a scoped package's FIRST publish defaults to `restricted`
      and fails with HTTP 402 on a free org, which no dry-run detects.
    hermetic: true
    expected_literals: ["JS_BARE=ontheloop", "JS_SCOPED=@onthelooplabs/ontheloop", "JS_VERSIONS=0.0.0,0.0.0", "JS_LICENSES=BUSL-1.1,BUSL-1.1", "JS_SCOPED_ACCESS=public"]
    graduation: graduate
    graduation_check_id: ontheloop-js-manifest-identity
  - step: 3
    phase: pre-deploy
    action: >-
      Crate manifest carries every field crates.io immutability makes unfixable -- name, pinned
      version, licence, description and repository.
    command: bin/venv-python -c "import tomllib,pathlib;p=tomllib.loads(pathlib.Path('packages/ontheloop-rs/Cargo.toml').read_text())['package'];print('RS_NAME='+p['name']);print('RS_VERSION='+p['version']);print('RS_LICENSE='+p['license']);print('RS_HAS_DESC='+str(bool(p.get('description'))));print('RS_HAS_REPO='+str(bool(p.get('repository'))))"
    expected: All five fields present and correct.
    fix_if: Any field absent -- a crates.io publish cannot be corrected, only yanked.
    hermetic: true
    expected_literals: ["RS_NAME=ontheloop", "RS_VERSION=0.0.0", "RS_LICENSE=BUSL-1.1", "RS_HAS_DESC=True", "RS_HAS_REPO=True"]
    graduation: graduate
    graduation_check_id: ontheloop-rs-manifest-identity
  - step: 4
    phase: pre-deploy
    action: >-
      Every placeholder ships a LICENSE byte-identical to the root LICENSE -- a BUSL-1.1
      declaration without its parameters is not a licence grant.
    command: bin/venv-python -c "import pathlib;root=pathlib.Path('LICENSE').read_bytes();ds=['ontheloop-py','ontheloop-js','ontheloop-js-scoped','ontheloop-rs'];bad=[d for d in ds if pathlib.Path('packages',d,'LICENSE').read_bytes()!=root];print('LICENSE_CHECKED='+str(len(ds)));print('LICENSE_DIVERGENT='+str(len(bad)))"
    expected: Four packages checked, zero divergent.
    fix_if: A package LICENSE drifted from root, or is missing.
    hermetic: true
    expected_literals: ["LICENSE_CHECKED=4", "LICENSE_DIVERGENT=0"]
    graduation: graduate
    graduation_check_id: ontheloop-placeholder-license-parity
  - step: 5
    phase: pre-deploy
    action: Placeholder sources are genuinely inert -- no import, require, use or extern statement.
    command: bin/venv-python -c "import pathlib,re;ps=['packages/ontheloop-py/src/ontheloop/__init__.py','packages/ontheloop-js/index.js','packages/ontheloop-js-scoped/index.js','packages/ontheloop-rs/src/lib.rs'];pat=re.compile(r'^\\s*(import|from|require|use|extern)\\b',re.M);bad=[p for p in ps if pat.search(pathlib.Path(p).read_text())];print('INERT_CHECKED='+str(len(ps)));print('INERT_VIOLATIONS='+str(len(bad)))"
    expected: Four sources checked, zero violations.
    fix_if: A placeholder grew a dependency or imported platform code.
    hermetic: true
    expected_literals: ["INERT_CHECKED=4", "INERT_VIOLATIONS=0"]
    graduation: graduate
    graduation_check_id: ontheloop-placeholder-sources-inert
  - step: 6
    phase: pre-deploy
    action: >-
      Publish workflow is dispatch-only, names the pypi Environment verbatim, and confines id-token
      write to the publish job.
    command: bin/venv-python -c "import yaml;d=yaml.safe_load(open('.github/workflows/publish-ontheloop.yml'));on=d.get('on') or d.get(True);j=d['jobs']['publish'];print('WF_TRIGGERS='+','.join(sorted(on)));print('WF_ENV='+str(j['environment']));print('WF_JOB_IDTOKEN='+str(j['permissions'].get('id-token')));print('WF_TOP_IDTOKEN='+str((d.get('permissions') or {}).get('id-token')))"
    expected: workflow_dispatch is the only trigger; environment pypi; job id-token write; no top-level id-token.
    fix_if: >-
      A push/pull_request trigger crept in, the environment name drifted (PyPI's trust binding
      rejects the publish), or id-token widened to the workflow level.
    hermetic: true
    expected_literals: ["WF_TRIGGERS=workflow_dispatch", "WF_ENV=pypi", "WF_JOB_IDTOKEN=write", "WF_TOP_IDTOKEN=None"]
    graduation: graduate
    graduation_check_id: ontheloop-publish-workflow-shape
  - step: 7
    phase: pre-deploy
    action: Publish workflow carries no credential surface and uploads no artifact.
    command: bin/venv-python -c "import pathlib;t=pathlib.Path('.github/workflows/publish-ontheloop.yml').read_text();print('WF_SECRET_REFS='+str(t.count('secrets.')));print('WF_PASSWORD_REFS='+str(t.count('password')));print('WF_UPLOAD_ARTIFACT='+str(t.count('upload-artifact')))"
    expected: >-
      Zero of each -- Trusted Publishing needs no token, and an artifact upload would pull the
      workflow into the github-actions-evidence retention inventory.
    fix_if: A token was added, defeating the OIDC posture, or an artifact upload was added without its evidence-contract classification.
    hermetic: true
    expected_literals: ["WF_SECRET_REFS=0", "WF_PASSWORD_REFS=0", "WF_UPLOAD_ARTIFACT=0"]
    graduation: graduate
    graduation_check_id: ontheloop-publish-workflow-credential-free
  - step: 8
    phase: pre-deploy
    action: The workflow's inline run body is registered in the r3_workflows baseline (Decision 162 R3).
    command: bin/venv-python -c "import sys,yaml;from scripts.checks.ci_guards import _workflow_shell_bodies as w;b=yaml.safe_load(open('config/composite_action_body_baseline.yaml'))['r3_workflows'];k=[x for x in w.scan_workflow_bodies() if 'publish-ontheloop' in x];u=[x for x in k if x not in b];print('WF_BODIES='+str(len(k)));print('WF_BODIES_UNREGISTERED='+str(len(u)));sys.exit(0 if len(k)==1 and not u else 1)"
    expected: Exactly one inline body, registered.
    fix_if: >-
      An unregistered body fails validate_composite_action_shell_bodies; a second body means the
      build step was split and needs its own entry.
    hermetic: true
    expected_literals: ["WF_BODIES=1", "WF_BODIES_UNREGISTERED=0"]
    graduation: graduate
    graduation_check_id: ontheloop-publish-workflow-body-registered
  - step: 9
    phase: pre-deploy
    action: The ci_rca taxonomy carries a row keyed on the workflow's own display name.
    command: bin/venv-python -c "import yaml;t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['workflows'];d=yaml.safe_load(open('.github/workflows/publish-ontheloop.yml'));n=d['name'];r=t.get(n) or {};print('TAX_WF_NAME='+n);print('TAX_TIER='+str(r.get('tier')));print('TAX_CI_RCA='+str(r.get('ci_rca')))"
    expected: Display name publish-ontheloop, classified not_a_gate / excluded.
    fix_if: Row missing or keyed on the filename rather than the display name -- the taxonomy keys on `name:`.
    hermetic: true
    expected_literals: ["TAX_WF_NAME=publish-ontheloop", "TAX_TIER=not_a_gate", "TAX_CI_RCA=excluded"]
    graduation: graduate
    graduation_check_id: ontheloop-publish-workflow-taxonomy-row
  - step: 10
    phase: pre-deploy
    action: CODEOWNERS carries a path row for the publish workflow.
    command: bin/venv-python -c "import sys,pathlib;t=pathlib.Path('.github/CODEOWNERS').read_text();ok=any(l.startswith('/.github/workflows/publish-ontheloop.yml') for l in t.splitlines());print('CODEOWNERS_ROW='+str(ok));sys.exit(0 if ok else 1)"
    expected: A row exists, so changing the publish path needs code-owner review.
    fix_if: Row absent -- the Environment gates execution but nothing gates modification.
    hermetic: true
    expected_literals: ["CODEOWNERS_ROW=True"]
    graduation: graduate
    graduation_check_id: ontheloop-publish-workflow-codeowners
  - step: 11
    phase: pre-deploy
    action: >-
      deploy-paths.yaml indexes the registry-publication channel, so the navigation index names
      every shipping trigger (Decision 126 clause 1).
    command: bin/venv-python -c "import sys,yaml;d=yaml.safe_load(open('docs/contracts/deploy-paths.yaml'));r=d.get('publish_artifacts') or {};miss=[k for k in ('trigger','recovery','blocks_ref','description') if not r.get(k)];print('DP_ROW_PRESENT='+str(bool(r)));print('DP_ACTOR='+str(r.get('actor_role')));print('DP_MISSING_KEYS='+str(miss));sys.exit(0 if r and r.get('actor_role')=='operator' and not miss else 1)"
    expected: >-
      The row exists with an operator actor_role and carries all four keys its four sibling
      channels carry -- trigger, recovery, blocks_ref and description.
    fix_if: >-
      Row missing, or shaped unlike its siblings -- a row without blocks_ref/description reads as
      a second source of truth rather than the pointer Decision 126 clause 2 requires.
    hermetic: true
    expected_literals: ["DP_ROW_PRESENT=True", "DP_ACTOR=operator", "DP_MISSING_KEYS=[]"]
    graduation: graduate
    graduation_check_id: ontheloop-deploy-paths-publish-row
  - step: 12
    phase: pre-deploy
    action: >-
      No CI workflow installs a Node or Rust toolchain, so Decision 80's single-language,
      no-compiled-build premise holds by construction rather than by omission.
    command: bin/venv-python -c "import pathlib;ms=('setup-node','actions-rs/','dtolnay/rust-toolchain','setup-rust');hits=sorted({w.name for w in pathlib.Path('.github/workflows').glob('*.yml') for m in ms if m in w.read_text()});print('TOOLCHAIN_WORKFLOWS='+str(hits));print('TOOLCHAIN_HITS='+str(len(hits)))"
    expected: Zero workflows reference a Node or Rust toolchain action.
    fix_if: >-
      A toolchain step was added. NOTE the citation precisely: Decision 80 clause 4's revisit
      trigger is `executor concurrency > 1 AND (KG.13 filed OR a measured fast-tier budget
      breach)`, which a Node or Rust toolchain does NOT fire. This assertion is therefore a NEW
      VOLUNTARY guard introduced by this plan, not a Decision 80 consequence -- it keeps 80's
      stated PREMISE (single-language, no compiled build) true rather than its trigger unfired.
      Widening it is a judgement call for a future plan, not a gate failure to route around.
    hermetic: true
    expected_literals: ["TOOLCHAIN_HITS=0"]
    graduation: waive
    graduation_waiver_reason: >-
      Green by construction on the un-implemented tree -- no workflow references a Node or Rust
      toolchain today -- so it can produce no red-before outcome and a `graduate` disposition would
      be a false one. Its standing-guard value is carried by the mirrored assertion in
      tests/test_ontheloop_placeholder_packages.py, which VP step 18 graduates.
  - step: 13
    phase: pre-deploy
    action: >-
      The PyPI trust triple is structurally guarded: the contract records repository, workflow
      filename and environment, and the live workflow matches it. Decision 163 -- an obligation
      nothing executable checks is silently skippable by construction.
    command: bin/venv-python -c "import yaml;c=yaml.safe_load(open('docs/contracts/package-registry-reservation.yaml'))['pypi_trusted_publisher'];w=yaml.safe_load(open('.github/workflows/'+c['workflow_filename']));print('TRUST_WF_NAME='+w['name']);print('TRUST_ENV_MATCH='+str(w['jobs']['publish']['environment']==c['environment']));print('TRUST_REPO='+c['repository'])"
    expected: The recorded filename resolves to the real workflow and its environment matches the recorded value.
    fix_if: >-
      A rename or environment edit drifted from the contract -- that silently breaks publishing,
      which is exactly the Decision 172 failure class this guard exists to make loud.
    hermetic: true
    expected_literals: ["TRUST_WF_NAME=publish-ontheloop", "TRUST_ENV_MATCH=True", "TRUST_REPO=benjamin-blake/theseus"]
    graduation: graduate
    graduation_check_id: ontheloop-pypi-trust-triple-guard
  - step: 14
    phase: pre-deploy
    action: >-
      file-router carries the new route and still sits under its Decision 166 contracts-class limit
      with real headroom.
    command: bin/venv-python -c "import sys,yaml;from pathlib import Path;from scripts.checks.structural._classify import effective_lines;p=Path('docs/contracts/file-router.yaml');txt=p.read_text();d=yaml.safe_load(txt);e=effective_lines(txt);hr=any(r['topic']=='distribution-packages' for r in d['routes']);print('ROUTER_EFF='+str(e));print('ROUTER_HEADROOM_OK='+str(e<=490));print('ROUTER_HAS_ROUTE='+str(hr));sys.exit(0 if e<=490 and hr else 1)"
    expected: Route present; effective lines at or under 490 (measured projection 476).
    fix_if: Compaction was insufficient, or the route is missing.
    hermetic: true
    expected_literals: ["ROUTER_HEADROOM_OK=True", "ROUTER_HAS_ROUTE=True"]
    graduation: graduate
    graduation_check_id: ontheloop-file-router-registration
  - step: 15
    phase: pre-deploy
    action: The file-router amendment-log compaction preserved every historical date and added exactly one entry.
    command: bin/venv-python -c "import re,yaml,subprocess;tok=lambda es:set(re.findall(r'PLAN-[a-z0-9-]+|Decision [0-9]+|rec-[0-9]+',' '.join(e['summary'] for e in es)));b=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/file-router.yaml'],capture_output=True,text=True).stdout)['amendment_log'];h=yaml.safe_load(open('docs/contracts/file-router.yaml'))['amendment_log'];print('ROUTER_DATES_LOST='+str(sorted(set(e['date'] for e in b)-set(e['date'] for e in h))));print('ROUTER_CITATIONS_LOST='+str(sorted(tok(b)-tok(h))));print('ROUTER_ENTRY_DELTA='+str(len(h)-len(b)))"
    expected: >-
      No date lost, no PLAN-/Decision/rec citation token lost, exactly one entry added. The
      citation set-difference is what makes this step prove acceptance criterion 7 rather than
      just its date half.
    fix_if: Compaction dropped an entry outright rather than shortening its summary.
    hermetic: true
    expected_literals: ["ROUTER_DATES_LOST=[]", "ROUTER_CITATIONS_LOST=[]", "ROUTER_ENTRY_DELTA=1"]
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative -- compares HEAD against origin/main. Post-merge that ancestry collapses and the
      assertion becomes vacuous, which is exactly the implement_leg_partition case
      docs/contracts/vp-red-before.yaml excludes from replay. Graduating it would register a check
      that is green by construction on main.
  - step: 16
    phase: pre-deploy
    action: rec-3995's acceptance oracle -- the contract drops the retired hierarchy and cites Decision 198.
    command: bin/venv-python -c "import sys,pathlib;t=pathlib.Path('docs/contracts/package-registry-reservation.yaml').read_text();old='remains Theseus / Guerdon / Semanto' in t;new='Decision 198' in t;print('REC3995_OLD_HIERARCHY='+str(old));print('REC3995_CITES_198='+str(new));sys.exit(0 if (not old) and new else 1)"
    expected: Old hierarchy gone, Decision 198 cited.
    fix_if: The header still describes On The Loop as a candidate or the retired hierarchy as ratified.
    hermetic: true
    expected_literals: ["REC3995_OLD_HIERARCHY=False", "REC3995_CITES_198=True"]
    graduation: graduate
    graduation_check_id: ontheloop-contract-cites-decision-198
  - step: 17
    phase: pre-deploy
    action: >-
      Each of the ten corrections is asserted against the SPECIFIC key it belongs to, and no live
      (non-amendment_log) surface still cites rec-3922. Assertions read raw text for the header
      comment and key-scoped values for everything else -- never a yaml.safe_dump flattening, which
      strips comments AND re-wraps long strings, so a substring probe over it can silently pass or
      fail on where the reflow lands.
    command: bin/venv-python -c "import re,yaml,pathlib;raw=pathlib.Path('docs/contracts/package-registry-reservation.yaml').read_text();d=yaml.safe_load(raw);po=d['posture'];idn=d['identity'];pr=d['procedure'];hdr=raw.split('contract:',1)[0];tp=d.get('pypi_trusted_publisher') or {};c1='rec-3922' not in hdr and 'Theseus / Guerdon / Semanto' not in hdr and 'Decision 198' in hdr;print('C1_HEADER_CLEAN='+str(c1));c2='rec-3922' not in po['installability_rationale'] and 'RATIFIED brand' not in po['installability_rationale'];print('C2_INSTALLABILITY_CLEAN='+str(c2));c3='CANDIDATE' not in idn['security_contact'];print('C3_SECURITY_CONTACT_SETTLED='+str(c3));c4='undecided' not in idn['crates_io_ownership'];print('C4_CRATES_OWNERSHIP_SETTLED='+str(c4));c5='rec-3922' not in po['disposition'];print('C5_DISPOSITION_CLEAN='+str(c5));c6='rec-3922' not in po['neutral_placeholder'];print('C6_NEUTRAL_CLEAN='+str(c6));c7='@onthelooplabs' in po['scope_anti_squatting'] and not re.search(r'@ontheloop(?!labs)',po['scope_anti_squatting']);print('C7_NPM_SCOPE='+str(c7));c8=any('org creation' in s['action'].lower() for s in pr['npm']);print('C8_ORG_CREATION='+str(c8));c9=any('Trusted Publishing' in s['action'] for s in pr['pypi']) and any('does not reserve' in s['action'].lower() for s in pr['pypi']);print('C9_PYPI_OIDC='+str(c9));c10=any('scoped API token' in s['action'] for s in pr['crates_io']);print('C10_CRATES_TOKEN='+str(c10));live=int('rec-3922' in hdr)+sum('rec-3922' in v for v in (po['disposition'],po['neutral_placeholder'],po['installability_rationale'],d['tracking']['note']));print('LIVE_REC3922='+str(live));miss=[k for k in ('repository','workflow_filename','environment','restage_obligation') if not tp.get(k)];print('TRUST_KEYS_MISSING='+str(miss));print('CONTRACT_VERSION='+str(d['contract']['contract_version']));import sys;sys.exit(0 if all([c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,live==0,not miss,d['contract']['contract_version']==2]) else 1)"
    expected: >-
      All ten correction markers True, zero live rec-3922 citations, the pypi_trusted_publisher
      block complete, contract_version 2. C1-C4 are rec-3995's four; C5-C6 are the two its own
      oracle does not reach; C7-C10 are the execution-discovered four.
    fix_if: >-
      Any marker False names exactly which correction was missed. LIVE_REC3922 > 0 means a live
      surface still cites a closed rec -- historical amendment_log entries are deliberately excluded
      from that count, since the log is append-only provenance.
    hermetic: true
    expected_literals: ["C1_HEADER_CLEAN=True", "C2_INSTALLABILITY_CLEAN=True", "C3_SECURITY_CONTACT_SETTLED=True", "C4_CRATES_OWNERSHIP_SETTLED=True", "C5_DISPOSITION_CLEAN=True", "C6_NEUTRAL_CLEAN=True", "C7_NPM_SCOPE=True", "C8_ORG_CREATION=True", "C9_PYPI_OIDC=True", "C10_CRATES_TOKEN=True", "LIVE_REC3922=0", "TRUST_KEYS_MISSING=[]", "CONTRACT_VERSION=2"]
    graduation: graduate
    graduation_check_id: ontheloop-contract-ten-corrections
  - step: 18
    phase: pre-deploy
    action: >-
      The standing placeholder-invariant suite passes, together with the existing mirror tests that
      guard the registration surfaces this plan edits.
    command: bin/venv-python -m pytest tests/test_ontheloop_placeholder_packages.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py tests/checks/ci_guards/test__workflow_shell_bodies.py -q
    expected: All tests pass.
    fix_if: An invariant regressed; fix the placeholder, never the test.
    hermetic: false
    graduation: graduate
    graduation_check_id: ontheloop-placeholder-invariants
  - step: 19
    phase: pre-deploy
    action: Full presubmit is green before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Any registered check fails -- diagnose on the branch; never weaken a gate.
    hermetic: false
    graduation: not-applicable
  - step: 20
    phase: post-deploy
    action: >-
      [OPERATOR, NON-DESTRUCTIVE PRECONDITION CHECK -- performs no publish] Confirm all four
      publish prerequisites hold. Three are already satisfied out-of-band and are recorded here so
      a later reader need not rediscover them; the fourth is not yet done. (i) The PyPI PENDING
      Trusted Publisher is registered for project ontheloop against repo benjamin-blake/theseus,
      workflow publish-ontheloop.yml, environment pypi -- without it the OIDC exchange fails
      outright, because a project-scoped token cannot exist before the project does. (ii) The npm
      organization onthelooplabs exists, so the @onthelooplabs scope is held and a scoped publish
      has somewhere to land. (iii) crates.io sign-in via GitHub OAuth is live. (iv) NOT YET DONE --
      the `pypi` GitHub Environment must exist WITH a required reviewer. Read its protection_rules
      via the API; never probe it by dispatching, because a missing environment is auto-created
      UNPROTECTED on first use and the probe's negative outcome would itself be an irreversible
      unvalidated publish under the very name this plan exists to claim correctly.
    command: 'echo "Non-destructively: GET /repos/benjamin-blake/theseus/environments/pypi and require a non-empty protection_rules array containing a required_reviewers rule. Re-confirm the PyPI pending publisher on pypi.org (Your projects -> Publishing), the npm org at npmjs.com/org/onthelooplabs, and crates.io sign-in. NO workflow dispatch occurs in this step."'
    expected: >-
      All four confirmed. The pypi Environment returns a required_reviewers protection rule; the
      pending publisher, npm org and crates.io sign-in are present.
    fix_if: >-
      The Environment is absent or has an empty protection_rules array -- create it with a required
      reviewer BEFORE any dispatch. If the pending publisher is missing, register it; if the npm org
      is missing, create it. Do not proceed to step 21 with any of the four unconfirmed.
  - step: 21
    phase: post-deploy
    action: >-
      [OPERATOR] Dry-run all four artefacts before any publish. crates.io is immutable, so this is
      the last correctable moment.
    command: 'echo "From a scratch copy outside the repository tree (T2.53 c7 -- no in-tree installs): python -m build && twine check dist/* in packages/ontheloop-py; npm publish --dry-run in packages/ontheloop-js and packages/ontheloop-js-scoped; cargo publish --dry-run in packages/ontheloop-rs."'
    expected: All four dry-runs clean, with metadata identical to VP steps 1-3.
    fix_if: Any dry-run warns or errors -- fix before publishing, not after.
  - step: 22
    phase: post-deploy
    action: >-
      [OPERATOR] Publish in ascending-immutability order in one sitting -- PyPI, then npm bare, then
      npm scoped, then crates.io.
    command: 'echo "1) Approve the publish-ontheloop.yml dispatch (PyPI, OIDC, no token). 2) npm publish from packages/ontheloop-js then packages/ontheloop-js-scoped (2FA OTP; zero dependencies, so no npm install is required at any point). 3) cargo publish from packages/ontheloop-rs using a single-use token scoped publish-new to crate pattern ontheloop, 1-day expiry."'
    expected: Four artefacts published under the four intended names.
    fix_if: A publish fails -- do NOT retry with a broader-scoped credential; diagnose first.
  - step: 23
    phase: post-deploy
    action: >-
      [OPERATOR] Point the bare npm name at the canonical scoped package and revoke the single-use
      crates.io token. Deliberately NOT done here: configuring Trusted Publishing on npm or
      crates.io. Both bind to a GitHub Actions workflow, which would require a Node or Rust
      toolchain in CI -- contradicting constraint 7 and reddening this plan's own graduated step-12
      guard. That question is real but needs a plan that can weigh the toolchain trade honestly;
      it is routed to rec-4015 rather than smuggled in as an operator instruction here.
    command: 'echo "npm deprecate ontheloop with a message naming @onthelooplabs/ontheloop as canonical; then revoke the single-use crates.io token. Do NOT configure npm or crates.io Trusted Publishing -- see rec-4015."'
    expected: The bare name points at the scoped package; no long-lived publish credential survives anywhere.
    fix_if: The single-use token still exists -- revoke it before closing out.
  - step: 24
    phase: post-deploy
    action: rec-3941's acceptance oracle passes -- all three registries report claimed.
    command: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop
    expected: Exit 0, all three registries claimed.
    fix_if: Any registry still unclaimed -- that publish did not land.
  - step: 25
    phase: post-deploy
    action: >-
      Confirm the claims are OURS. `--require-claimed` asserts HTTP 200, which proves only that the
      name is taken -- a name someone else won would satisfy it identically (rec-4014).
    command: 'echo "Read the owner on each: pypi.org/project/ontheloop (Maintainers); npm owner ls ontheloop; npm owner ls @onthelooplabs/ontheloop; cargo owner --list ontheloop. Each must name the On The Loop Labs identity."'
    expected: All four artefacts owned by the company identity.
    fix_if: >-
      A name is owned by someone else -- the race was lost on that registry. Do NOT claim a variant;
      re-scope and record the outcome against rec-3941.
  - step: 26
    phase: post-deploy
    action: rec-3995 is closed by the squash-merge Resolves trailer.
    command: 'bin/venv-python -m scripts.sync.ops sync && grep -oE ''"id": "rec-3995"[^}]*"status": "[a-z]*"'' logs/.recommendations-log.jsonl'
    expected: rec-3995 shows status closed.
    fix_if: Still open -- the Resolves trailer was omitted from the squash-merge commit body.

