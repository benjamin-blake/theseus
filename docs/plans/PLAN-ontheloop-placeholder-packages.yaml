execution_steps:
  - Verify the four publish preconditions in VP step 20 are recorded accurately before anything else (three are already satisfied out-of-band).
  - Create the four placeholder package roots, each with its manifest, one trivial real function, and a LICENSE copied byte-for-byte from the root LICENSE. No .md files.
  - Author .github/workflows/publish-ontheloop.yml -- dispatch-only, environment pypi, id-token write on the publish job only, no secret reference.
  - Register the workflow -- r3_workflows body entry, ci_rca_taxonomy row, CODEOWNERS row, and the deploy-paths publish_artifacts row with its amendment_log entry.
  - Register the subtree in file-router -- route plus the amendment_log entry, paid for by compacting the four multi-line entries named in constraint 3.
  - Amend docs/contracts/package-registry-reservation.yaml with the ten corrections and the pypi_trusted_publisher trust triple under one dated amendment_log entry; bump contract_version to 2.
