    opened #1384). Gates requested by the brief, in order: zero-context verification, then plan-critique; the
    PR waits for the operator. Decision-scout was not in the requested sequence (W0 and component 1
    precedent); offered on hand-back.
  - >-
    Inputs read: component 1's report (#1384 head 38056c78), including its boundary note that the session
    state verb should derive from the LATEST lifecycle row; the telemetry contracts' populated_by and
    derived_by rows; the reader Lambda, NAMED_READS and named_read; Decision 199 cl.1 and its reversal
    conditions; Decision 88; Decision 209 cl.2; T2.36 and T2.52. rec-4024's own text was not readable: no
    AWS credentials and no local rec cache in this session (open question q2).
  - >-
    Measurement (report section 1): local DuckDB 1.5.4 and the pinned ducklake extension only; no production
    catalog read. A larger scratch run (1.12M rows, 14 days) is reported as informational, not a VP step.
  - "fork: one item vs split mechanism/verbs | chosen: one task item | class: consistency-only | precedent: CD.45 item-count cap 12 across about ten components; Decision 197 cl.3 grain (one row per work item); component 1 precedent | precedent_kind: contract | reversible: yes | persisted: fixture"
  - "fork: edge to pwi-capture-producer-wiring | chosen: none here, noted for W2 | class: consistency-only | precedent: validate_work_item_pilot L4 fails an edge to an item absent from main | precedent_kind: contract | reversible: yes | persisted: report section 5"
  - "fork: session state and duration rule (k1) | chosen: none; option (a) recommended | class: asked | precedent: none (ratified Class A semantic change) | precedent_kind: none | reversible: yes | persisted: report k1, /mnt/project-files/gates/w1-c2-parked-forks.md, PARKED for the operator"
  - "fork: window verbs here vs T2.52 (k2) | chosen: none; option (a) recommended | class: asked | precedent: none (T2.52 c3 owns the analytical class) | precedent_kind: none | reversible: yes | persisted: report k2, /mnt/project-files/gates/w1-c2-parked-forks.md, PARKED for the operator"
  - >-
