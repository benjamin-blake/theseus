schema_version: 5
slug: "w1-reader-verbs"
intent: >-
  Stage, for the operator, the design of telemetry-feedback-loop W1 component 2 (telemetry reader verbs, the
  read side of rec-4024) without building anything: prove with executable evidence that today's named-read
  registry cannot serve the append-only telemetry tables, that the Decision 207 read-side dedupe is expressible
  as one SQL statement passing every committed conformance vector, and that a session_id alone yields its
  calendar-day partition; record two ratified contract rules that would derive wrong values if built
  literally; split the design into settled, contested and open rows; and author the component's one CD.45
  pilot item in the Decision 197 clause-3 grain. Nothing is implemented, filed, closed or flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-w1-reader-verbs.yaml
phase: >-
  CD.45 pilot (telemetry-feedback-loop design stream, W1), component 2 of the seed list. Touches T2.36 (part_of
  edge) by id only and names T2.52 as the analytical-verb owner; closes no criterion of either.
scope:
  - file: docs/plans/PLAN-w1-reader-verbs.yaml
    action: Create
    purpose: >-
      The planning artefact: executable evidence for the staging (VP), the fork record (context) and the gating
      constraints.
  - file: docs/plans/reports/REPORT-w1-reader-verbs.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; file-router.yaml report-deliverables route): verdict and
      boundary, evidence table, local measurements, verb design with the verified dedupe sketch,
      settled/contested/risk/open split, the register as authored, and boundary notes for W2 synthesis.
  - file: docs/work-item-pilot/telemetry-feedback-loop.yaml
    action: Modify
    purpose: >-
      Add the one pilot item pwi-telemetry-reader-verbs (kind task), its three open criteria and one id-only edge
      (part_of T2.36), in the canonical layout validate_work_item_pilot enforces.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The registry gap is shown: no NAMED_READS verb targets a telemetry table, and named_read renders an
    append_only table's placeholder as a None current projection (VP step 1).
  - >-
    The dedupe sketch in report section 2, read from the report itself, passes every committed
    dedupe_vectors.yaml vector on DuckDB, surviving event_ids and conflicted grain keys both exact (VP step 2).
  - >-
    The partition-binding claim is reproduced on a local DuckLake catalog: a session_id decodes to its root
    start and a per-session read touches one data file with or without the decoded day triple (VP step 3).
  - >-
    The two contract-rule risks are re-derived from the ratified text: duration is measured from
    session_started_at, which every sub-agent row carries as the root's start, and state reads any close row
    as terminal although resume is a lifecycle kind (VP step 4).
  - >-
    The pilot fixture carries exactly one item for this component and validate_work_item_pilot passes all six
    legs (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly the plan, the report and the fixture, with no code,
    roadmap, contract, rec or DECISIONS edit (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the named-read registry has no telemetry verb and cannot bind an append-only table
    command: >-
      bin/venv-python -c "import src.common.ducklake_reads as R, src.common.ducklake_scd2_schema as S; from dataclasses import replace;
      T=[n for n,v in S.NAMED_READS.items() if v.table.startswith('telemetry_')]; sp=replace(R.resolve_table_spec('ops_recommendations'),table='telemetry_sessions',current_table=None,partition_current=None,write_mode='append_only'); q=[];
      C=type('C',(),{'execute':lambda s,sql,*a:(q.append(sql),s)[1],'description':[('x',)],'fetchall':lambda s:[]})();
      R.NAMED_READS['probe']=S.NamedRead(verb='probe',table='telemetry_sessions',sql='SELECT * FROM {tbl}'); R.resolve_table_spec=lambda t:sp; R.named_read(C,verb='probe');
      print('telemetry_verbs=%d append_only_tbl_renders_None=%s' % (len(T), q[0].endswith('.None')))"
    expected: One line reporting zero telemetry verbs and an append-only placeholder rendered as None.
    fix_if: >-
      A non-zero verb count means telemetry verbs landed (rec-4024): re-read them before keeping settled row
      s2. False means named_read learned an append-only binding: s2 is satisfied, update report section 2.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for a future implementation, true only until the event-journal registry form lands;
      a standing guard would block the sanctioned change.
    expected_literals: ["telemetry_verbs=0 append_only_tbl_renders_None=True"]
  - step: 2
    phase: pre-deploy
    action: Run the report's dedupe SQL sketch against every committed dedupe conformance vector on DuckDB
    command: >-
      bin/venv-python -c "import re,duckdb,yaml; F=chr(96)*3; S=re.search(F+'sql\n(.*?)'+F,open('docs/plans/reports/REPORT-w1-reader-verbs.md',encoding='utf-8').read(),re.S).group(1).replace('{sessions}','sess').replace('{table}','tbl').replace('{partition}','TRUE');
      V=yaml.safe_load(open('tests/telemetry/fixtures/dedupe_vectors.yaml',encoding='utf-8'))['vectors']; c=duckdb.connect(); c.execute(\"SET TimeZone='UTC'\"); K=['producer','event_id','parser_version','session_id','event_kind','created_timestamp','content','observation_id','event_timestamp'];
      L=lambda n,R: [c.execute('CREATE OR REPLACE TABLE '+n+' (producer VARCHAR, event_id VARCHAR, parser_version BIGINT, session_id VARCHAR, event_kind VARCHAR, created_timestamp TIMESTAMPTZ, content VARCHAR, observation_id VARCHAR, event_timestamp TIMESTAMPTZ)')]+[c.execute('INSERT INTO '+n+' VALUES (?,?,?,?,?,?,?,?,?)',[str(r[k]) if k=='content' else r.get(k) for k in K]) for r in R];
      Q=lambda e: sorted(r[0] for r in c.execute(S).fetchall())==sorted(e['surviving_event_ids']) and {tuple(r) for r in c.execute('SELECT producer,event_id,parser_version FROM tbl GROUP BY ALL HAVING count(DISTINCT content)>1').fetchall()}=={tuple(x) for x in e['conflicted_grain_keys']};
      R=[ok for v in V for ok in [L('sess',v['rows'].get('telemetry_sessions') or []) and None] + [(L('tbl',v['rows'].get(t) or []), Q(e))[1] for t,e in v['expected'].items()] if ok is not None];
      print('vectors=%d sql_pass=%d/%d' % (len(V),sum(R),len(R)))"
    expected: One line reporting 17 vectors and 17 of 17 table checks passing.
    fix_if: >-
      A lower pass count means the sketch in report section 2 diverges from the R4/R5 rule or the vectors
      changed; fix the sketch, never the vectors (they are the contract's normative conformance file). A
      different vector count means vectors were added; re-run and update report section 1.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Design evidence for one settled row; the production verbs carry their own DuckLake conformance test
      (criterion c1), which is the standing guard.
    expected_literals: ["vectors=17 sql_pass=17/17"]
  - step: 3
    phase: pre-deploy
    action: Reproduce the partition-binding measurement on a local DuckLake catalog with real derived session ids
    command: >-
      bin/venv-python -c "import duckdb,pathlib,re,tempfile; from datetime import datetime,timedelta,timezone; from src.telemetry.identity import derive_entity_key as K, decode_time_prefix as D;
      TN='01ARZ3NDEKTSV4RRFFQ69G5FAV'; PJ='01BRZ3NDEKTSV4RRFFQ69G5FBW'; d=tempfile.mkdtemp(); c=duckdb.connect(); c.execute('INSTALL ducklake;LOAD ducklake'); c.execute(\"SET TimeZone='UTC'\"); c.execute('SET ducklake_default_data_inlining_row_limit=0'); c.execute(f\"ATTACH 'ducklake:{d}/c.ducklake' AS lake (DATA_PATH '{d}/data/')\");
      c.execute('CREATE TABLE lake.obs (session_id VARCHAR, session_started_at TIMESTAMPTZ, observation_type VARCHAR)'); c.execute('ALTER TABLE lake.obs SET PARTITIONED BY (year(session_started_at), month(session_started_at), day(session_started_at))');
      B=datetime(2026,9,1,tzinfo=timezone.utc); S=[(K('telemetry_sessions:session_id',TN,PJ,'s%d-%d'%(n,j),B+timedelta(days=n,minutes=37*j)),B+timedelta(days=n,minutes=37*j)) for n in range(7) for j in range(10)];
      [c.execute('INSERT INTO lake.obs SELECT ?, ?, CASE WHEN r%7=0 THEN chr(112) ELSE chr(116) END FROM range(500) t(r)',[s,t]) for s,t in S];
      sid,st=S[33]; t=D(sid); F=lambda sql,a: ','.join(re.findall(r'Total Files Read:\s*(\d+)',c.execute('EXPLAIN ANALYZE '+sql,a).fetchall()[0][1]));
      q='SELECT count(*) FROM lake.obs WHERE session_id=?'; a=F(q,[sid]); b=F(q+' AND year(session_started_at)=? AND month(session_started_at)=? AND day(session_started_at)=?',[sid,t.year,t.month,t.day]);
      w=F('SELECT session_id,count(*) FROM lake.obs WHERE session_started_at>=?::TIMESTAMPTZ AND session_started_at<?::TIMESTAMPTZ GROUP BY 1',[str(B+timedelta(days=2)),str(B+timedelta(days=5))]);
      print('decoded_prefix_is_root_start=%s files=%d per_session_id_only=%s per_session_triple=%s window_3_days=%s' % (t==st, len(list(pathlib.Path(d).rglob('*.parquet'))), a, b, w))"
    expected: >-
      One line reading exactly decoded_prefix_is_root_start=True files=70 per_session_id_only=1
      per_session_triple=1 window_3_days=30 (the root start decodes from the id, one file read per session with
      or without the decoded day triple, 30 files for a 3-day window).
    fix_if: >-
      More than one file per session means pruning changed with the pinned duckdb or ducklake version; re-measure
      and revise settled row s3 and contested row k2. An extension-load error is an environment defect (network
      or pin), not a pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A local-catalog measurement backing one settled row; production pruning and egress are criterion c3's
      review, so a standing guard here would assert the wrong environment.
  - step: 4
    phase: pre-deploy
    action: Re-derive the two contract-rule risks (k1, R1, R2) from the ratified contract text
    command: >-
      bin/venv-python -c "N=lambda p: ' '.join(open(p,encoding='utf-8').read().split()); s=N('docs/contracts/telemetry_sessions.yaml'); e=N('docs/contracts/telemetry-event-envelope.yaml'); a=N('docs/contracts/telemetry_agents.yaml');
      print('duration_from_session_started_at=%s child_rows_carry_root_start=%s no_close_means_running=%s resume_kind=%s agent_duration_paired=%s' % ('(close.event_timestamp - session_started_at).total_seconds()' in s, 'Every row of a root session AND all its sub-agent sessions carries this SAME value' in e, 'absent a close row, the session is running' in s, 'open | resume | compact | close | annotate' in e, 'paired on agent_run_id' in a))"
    expected: One line with all five facts True.
    fix_if: >-
      A False means the contract was amended: re-read telemetry_sessions.yaml and the envelope, and update
      contested row k1 and risks R1-R2 (an amendment along option (a) settles k1).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      True only until k1 is decided; a standing guard would block the amendment the report recommends.
    expected_literals: ["duration_from_session_started_at=True child_rows_carry_root_start=True no_close_means_running=True resume_kind=True agent_duration_paired=True"]
  - step: 5
    phase: pre-deploy
    action: Prove the fixture carries this component's one item and the pilot evaluator passes
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as v;
      d=yaml.safe_load(open('docs/work-item-pilot/telemetry-feedback-loop.yaml',encoding='utf-8'));
      n=sum(i['id']=='pwi-telemetry-reader-verbs' for i in d['work_items']); f=[]; v(f); print('component_items=' + str(n) + ' evaluator_failed=' + str(f))"
    expected: Six PASS leg lines, then one line reporting one component item and an empty failure list.
    fix_if: >-
      A failing leg names the row; fix it in the fixture using the canonical layout (render(parsed)). A count
      other than 1 means a concurrent W1 thread touched this item; reconcile before merging.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_work_item_pilot is already a registered check run by both tiers; a per-plan row duplicates it.
    expected_literals: ["component_items=1 evaluator_failed=[]"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-w1-reader-verbs.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan, report and fixture files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly three paths: docs/plans/PLAN-w1-reader-verbs.yaml, docs/plans/reports/REPORT-w1-reader-verbs.md
      and docs/work-item-pilot/telemetry-feedback-loop.yaml.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan, report or fixture.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (charter never-list). The
    fixture's three criteria are pilot rows with status open, never roadmap criteria.
  - >-
    No recommendation filed, updated or closed (Decision 67). rec-4024, rec-4025, rec-4031 and rec-4032 are
    named as owners only.
  - >-
    No contract edit: the telemetry_sessions state and duration rules (contested k1) are a ratified Class A
    semantic change parked for the operator; docs/DECISIONS.md and its archive untouched.
  - >-
    CD.45 binds while pending: one fixture only, sized by item count (this component spends 1 of 12), edges
    id-only into ROADMAP-PLATFORM, never read by /orient, preflight or a pick surface (Decision 108).
  - >-
    The verbs (report section 2) are not to be built by a delegate before T2.36 provisions the tables, k1 and
    k2 are decided, and criterion c3's production measurement has a named consumer bound.
  - No new INTENT or standing prose doc (Decision 86).
