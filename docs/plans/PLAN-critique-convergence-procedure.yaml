schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: critique-convergence-procedure
intent: >-
  Replace the plan-critique gate's round-count cap with a finding-shaped convergence procedure -- critic-authored
  mechanical/judgement tags, a mechanical-first fix loop, one autonomous confirming round, an oscillation
  interrupt and a single pinned escalation shape carried in both dispatch modes -- so the gate stops asking the
  human a question whose answer is already known in the majority of cases, and asks a sharper one when it is not.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-convergence-procedure.yaml
phase: >-
  No tier_item slice; soft-warn exception category ad_hoc_rec -- audit remediation for
  audits/planning-decision-burden-735e69fc.yaml (findings PDB-05, PDB-02; adopted remedies B3-R5, B3-R2, B3-R3,
  B3-R1), bundling rec-2944. Closes no criterion.
scope:
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      B3-R5 as adopted, both halves -- :157 is rewritten so the critic tags EVERY finding mechanical
      (a deterministic check could catch it -- name it) or judgement, with a stable anchor
      (plan field path or VP step id): 137 -> 185, +48. Both halves land HERE and not on planning/SKILL.md
      because the critic loads only this file yet composes both fields (Decision 66). The widened parenthetical
      REPLACES the incumbent "mechanical (scripts.roadmap.plan_obligations)", which scoped the mechanical lane
      to plan_obligations output alone and left every `validate --pre`-catchable defect in the judgement lane,
      emptying the lane B3-R2b tells the planner to fix first; the anchor grammar is what makes B3-R3's
      recurrence key comparable across two independent fresh-context critics, and without it the interrupt that
      REPLACES the round cap can silently never fire. PDB-02 -- :40 gains " Too large (suggest split)?" (+27)
      and :136 gains "; deferred half filed as a follow-on rec" (+40). Funded on the same surface by rewriting
      :20 to drop the caller-provides restatement and the example filename while keeping the
      never-default-to-PLAN.md rule, the newest-yaml fallback and the .md deprecation note (:20 is 407 content
      bytes; the measured candidate is 257, freeing 150, and this plan floors the required saving at 140) and
      by the em dash on :28 (-1): 18,686 + 115 - 151 = 18,650 measured, 18,660 at the floor, against an 18,693
      budget -- 33 bytes of headroom at the floor.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      B3-R2/B3-R3/B3-R1 -- rewrite the Step 9 Convergence rule at :597 (204 -> 1,534) and mirror it at :635
      (227 -> 200). Funded on the same surface by relocating the ":52-64 What Data-Quality Health Represents"
      section (-1,042, replaced by a preflight bullet budgeted at 254 bytes -- a measured candidate carrying the
      signal, the obligation and the pointer is 250)
      and by collapsing the two gate dispatch-shape `prompt:` bullets that restate their own Example prompt body
      verbatim (:452 -212, :581-587 -534). Net -231: 55,716 -> 55,485 against a 55,792 budget.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      PDB-05 acceptance -- rewrite the Step 9 clause at :101 so the command's escalation menu is the skill's menu
      (accept-with-deferral / re-scope / split / abandon / one more round) and names the round-4 autonomous
      confirming round. S3 is measured-only (Decision 127); no budget entry to fund.
  - file: scripts/data_quality_runner.py
    action: Modify
    purpose: >-
      Relocation destination for planning/SKILL.md:52-64 -- the module docstring receives the two-layer
      data-quality health picture (coverage half from config/agent/data_quality/*.yaml, state half from
      logs/debug/dq-latest.json), collocating the semantics with the tool that produces both halves. Docstring
      only; 234 SLOC by the repo's own counter (scripts/checks/sloc/sloc_limits.py:91 -- non-blank,
      non-comment lines; the file is 292 total lines) -> about 246, unregistered so the 500 ceiling applies
      (Decision 128, no raise).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Anti-drift assertions for every behaviour change above -- each fails against origin/main's text and passes
      after. This file already pins the /plan and /implement surfaces that have no other enforcement counterpart.
bundled_recommendations:
  - rec-2944
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .claude/skills/planning/SKILL.md no longer contains "after 3 REVISE rounds" and rec-2944's acceptance
    command, run verbatim, exits 0 (VP step 4).
  - >-
    The oscillation interrupt is present in its own right -- "Oscillation interrupts, not the count" and the
    recurrence key "recurring at a tag+anchor you recorded fixed" both appear (VP step 6, not VP step 4:
    rec-2944's command is a three-way OR that `trajector` or `converging` satisfies without the word
    "oscillation" ever appearing, so it cannot prove this clause).
  - >-
    The Step 9 Convergence rule reads the critic's tag, requires `bin/venv-python -m scripts.validate --pre`
    before every re-dispatch, records one disposition per finding (fixed or disputed, with a finding marked
    neither counting as disputed for the escalation test and accept-with-deferral human-authored only),
    escalates a recurrence at once on a stated key (a tag+anchor the PLANNER recorded fixed -- the memory is
    the planner's own disposition record, so fresh-context critics need no cross-round memory),
    escalates disputed residue at round 3 in the pinned shape -- its four content elements (the finding
    verbatim with tag and anchor, why it did not converge, the planner's recommendation, and the new-series
    clause naming the predecessor rounds) proven by VP step 6, its fifth element the five choices proven by
    VP step 5 -- and otherwise
    runs one autonomous confirming round at round 4 when every finding is addressed (a REVISE at round 4
    escalates with "one more round" among the choices; there is no separate round-5 rule), pins the gates-line
    clause `plan-critique=<verdict> after <N> round(s); round <N> autonomous`,
    names both carriers (chat turn; GATE_REQUEST `open_questions`), fires the Fable consult on contested residue
    only where it recommends a disposition and decides nothing, and carries both revisit conditions.
  - >-
    .claude/commands/plan.md:101 and the planning skill offer the SAME choices --
    "accept-with-deferral / re-scope / split / abandon / one more round" appears verbatim in both files.
  - >-
    plan-critique/SKILL.md:40 contains the split question and :136 names the deferred half's disposition
    (PDB-02's acceptance).
  - >-
    plan-critique/SKILL.md:157 carries B3-R5 as adopted in both halves -- it reads
    "tag each finding, with a stable anchor (plan field path or VP step id)" AND
    "mechanical (a deterministic check could catch it -- name it)", and no longer reads
    "tag each registration-closure finding" or "mechanical (scripts.roadmap.plan_obligations)" (VP step 3).
  - >-
    The Step 10 report-critique convergence rule at :635 applies the Step 9 rule in kind rather than its own
    round count.
  - >-
    Both capped skills measure at or under their config/prose_budgets.yaml entries with no budget raise
    (planning 55,485 <= 55,792; plan-critique 18,660 or lower <= 18,693).
  - >-
    The relocated data-quality health semantics are present in scripts/data_quality_runner.py's module docstring
    and absent from planning/SKILL.md, which points at the destination while still naming the zero-coverage
    signal and its planning obligation inline.
  - >-
    tests/test_workflow_skill_antidrift.py passes, and every assertion it adds fails against origin/main's copy
    of the same file.
  - The full presubmit tier (`bin/venv-python -m scripts.validate`, no --pre) exits 0 before the commit/handoff.
  - rec-2944 reads status=closed after the merge sync.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Both capped prose surfaces are at or under budget after the edit, with no raise marker added.
    command: >-
      bin/venv-python -c "import pathlib, yaml; b = yaml.safe_load(pathlib.Path('config/prose_budgets.yaml').read_text(encoding='utf-8'))['S4']; rows = [(p, len(pathlib.Path(p).read_bytes()), b[p]) for p in ('.claude/skills/planning/SKILL.md', '.claude/skills/plan-critique/SKILL.md')]; print(rows); over = [r for r in rows if r[1] > r[2]]; assert not over, over"
    expected: >-
      Prints both triples with current <= budget (planning about 55,485 <= 55,792; plan-critique about
      18,660 or lower <= 18,693) and exits 0.
    fix_if: >-
      A non-empty `over` list means an addition was made without its named trade-out. Re-measure with
      `wc -c` and take the funding named in this plan's scope purposes; never edit config/prose_budgets.yaml
      (a raise is Decision-cited only, and this plan cites none). Overrun on planning/SKILL.md specifically:
      the plan lands at 55,485 leaving 307 bytes, and slices B (+72) and E (+120) draw from the same unreserved
      pool, so only 115 bytes of the headroom are genuinely slack. If the :597 rewrite exceeds its measured
      1,534 bytes by more than 115, take further same-surface trade-out rather than spending a sibling slice's
      budget -- this step would still pass, so the tax is silent.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits already asserts current <= budget for both S4 entries in the --pre and full tiers, so
      a registry entry would re-run the identical comparison against the identical registry of budgets.
  - step: 2
    phase: pre-deploy
    action: PDB-02 acceptance -- the IMPLEMENTATION branch asks the split question and the template names the deferred half's disposition.
    command: >-
      grep -qF 'For IMPLEMENTATION: Are all scope entries necessary? Too large (suggest split)?' .claude/skills/plan-critique/SKILL.md && grep -qF 'deferred half filed as a follow-on rec' .claude/skills/plan-critique/SKILL.md && echo OK
    expected: Prints OK and exits 0.
    fix_if: >-
      A non-zero exit names which half is missing. The :40 clause must sit inside the IMPLEMENTATION bullet (not
      the STRATEGIC one at :39, which already carries it), between "necessary?" and "Does the Scope extend"; the
      :136 clause must sit inside the "too large (suggest split into: X, Y" parenthetical so the disposition
      travels with the suggestion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_workflow_skill_antidrift.py::test_implementation_branch_asks_the_split_question asserts both
      strings and runs in the full pytest tier on every PR; a registry twin would grep the same two literals.
  - step: 3
    phase: pre-deploy
    action: >-
      B3-R5 acceptance -- the Finding-Origin Attribution row carries BOTH adopted halves (the widened mechanical
      definition and the every-finding tag with its anchor grammar) and neither incumbent clause survives.
    command: >-
      f=.claude/skills/plan-critique/SKILL.md; grep -qF 'tag each finding, with a stable anchor (plan field path or VP step id)' "$f" && grep -qF 'mechanical (a deterministic check could catch it -- name it)' "$f" && ! grep -qF 'tag each registration-closure finding' "$f" && ! grep -qF 'mechanical (scripts.roadmap.plan_obligations)' "$f" && echo OK
    expected: Prints OK and exits 0; run verbatim against origin/main it exits 1 on the first clause.
    fix_if: >-
      A failing positive names the adopted half that was dropped. Without the anchor grammar B3-R3's recurrence
      key is not comparable across two independent fresh-context critics and the interrupt that replaces the
      round cap silently never fires; without the widened definition the incumbent parenthetical keeps the
      mechanical lane scoped to plan_obligations output and B3-R2b's mechanical-first fix has nothing to order.
      A failing negative means the edit ADDED text instead of replacing it -- :157 is one rewritten line
      (137 -> 185), not an additional row, and the output template must keep exactly one Finding-Origin
      Attribution line. Never pay for the 48 bytes by shedding the :40 or :136 PDB-02 clauses or by weakening
      the :20 rules; take further same-surface trade-out (Decision 55).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_workflow_skill_antidrift.py::test_critic_tags_every_finding_with_a_stable_anchor asserts the
      presence and the absence in the same test; a registry entry would duplicate that pair of greps.
  - step: 4
    phase: pre-deploy
    action: rec-2944's own acceptance command, run verbatim -- the count cap is gone and a convergence-shaped word is present.
    command: >-
      ! grep -q 'after 3 REVISE rounds' .claude/skills/planning/SKILL.md && { grep -qi 'trajector' .claude/skills/planning/SKILL.md || grep -qi 'oscillat' .claude/skills/planning/SKILL.md || grep -qi 'converging' .claude/skills/planning/SKILL.md; } && echo OK
    expected: Prints OK and exits 0; run verbatim against origin/main it exits 1 on the first clause.
    fix_if: >-
      A non-zero exit means the :597 rewrite left the literal "after 3 REVISE rounds" behind (check :635 and the
      Step 6a scout rule at :462-463, which must stay a count of BLOCKs but must not reintroduce the phrase), or
      that none of `trajector` / `oscillat` / `converging` survived anywhere in the file. This step does NOT
      prove the oscillation clause landed -- its second half is a three-way OR any one of the three words
      satisfies; VP step 6 is that proof.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_workflow_skill_antidrift.py::test_critique_gate_convergence_is_finding_shaped asserts the
      identical pair of greps in the full pytest tier on every PR; a registry twin would re-run the same two
      greps against the same file -- the same duplication basis as steps 2, 3 and 5.
  - step: 5
    phase: pre-deploy
    action: PDB-05 acceptance -- the command and the skill offer the same escalation choices.
    command: >-
      for f in .claude/skills/planning/SKILL.md .claude/commands/plan.md; do grep -qF 'accept-with-deferral / re-scope / split / abandon / one more round' "$f" || { echo "MISSING $f"; exit 1; }; done; echo OK
    expected: Prints OK and exits 0.
    fix_if: >-
      "MISSING <path>" names the surface still carrying its own menu. plan.md must not paraphrase (the old text
      offered narrowing scope / re-deriving / split); the literal five-choice string is the parity token this
      step and the anti-drift test both read.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_workflow_skill_antidrift.py::test_escalation_menu_is_identical_on_command_and_skill asserts the
      same literal in both files and runs in the full tier; the registry entry would be the same two greps.
  - step: 6
    phase: pre-deploy
    action: >-
      Every adopted clause of B3-R2, B3-R3 and B3-R1 is present in the rewritten rule -- including the four
      elements that have no incumbent text to fall back on (the oscillation interrupt with its recurrence key,
      the mechanical-first fix ordering, new-series-on-re-scope naming the predecessor rounds, and the four
      content elements of the pinned escalation shape) -- and :635 defers to it.
    command: >-
      bin/venv-python -c "import pathlib; t = pathlib.Path('.claude/skills/planning/SKILL.md').read_text(encoding='utf-8'); need = ['Convergence rule -- findings, not rounds', 'tagged findings first', 'scripts.validate --pre', 'before EVERY re-dispatch', 'fixed or disputed', 'counts as disputed for the escalation test', 'accept-with-deferral is human-authored only', 'Oscillation interrupts, not the count', 'recurring at a tag+anchor you recorded fixed', 'ONE fresh confirming round', 'round <N> autonomous', 'starts a new series naming the predecessor', 'the finding verbatim with tag and anchor', 'why it did not converge', 'your recommendation', 'open_questions', 'On contested residue only', 'decides nothing', 'third fresh reading of THIS plan', '40 cap-hitting plans', '10 contested escalations', 'Apply the Step 9 Convergence rule in kind']; missing = [n for n in need if n not in t]; assert not missing, missing; print('OK')"
    expected: Prints OK and exits 0.
    fix_if: >-
      The assertion prints the missing clauses. Each maps to one adopted remedy element -- the tag-driven
      mechanical-first fix and the pre-dispatch `--pre` (B3-R2b); the disposition vocabulary with its
      neither-counts-as-disputed and human-authored-deferral sentences (B3-R2a); the pinned escalation shape's
      four content elements -- the finding verbatim with tag and anchor, why it did not converge, the planner's
      recommendation, and the new-series clause naming the predecessor rounds (B3-R2c and B3-R3), its fifth
      element being the five-choice literal VP step 5 already proves in both files and deliberately not
      duplicated here; the confirming round, the gates-line clause and both revisit conditions (B3-R3); and the
      contested-residue consult that recommends a disposition and decides nothing (B3-R1). None may be dropped
      to save bytes; take more trade-out instead. This step is the ONLY mechanical proof of the oscillation
      interrupt, the mechanical-first ordering, the escalation shape's content and new-series-on-re-scope:
      VP step 4's rec-2944 command is a three-way OR that `trajector` or `converging` satisfies without
      `oscillation` appearing, so a byte-pressed implementer who sheds these clauses fails here and nowhere
      else. Needles carry no backticks and no apostrophes on purpose: inside this double-quoted
      `bin/venv-python -c "..."` command a backtick is shell command substitution and an apostrophe closes the
      Python string literal -- which is why the new-series needle stops at "naming the predecessor", before the
      possessive in the skill text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The twenty-two-needle list is this plan's landing checklist rather than a durable invariant -- the wording of
      individual clauses is expected to move as T4.11 replaces the prose ceiling with a state-machine counter,
      and a registry entry pinned to today's phrasing would drift into a false alarm.
  - step: 7
    phase: pre-deploy
    action: The data-quality health semantics moved to their producer and the planning skill points at the destination while keeping the operative signal inline.
    command: >-
      bin/venv-python -c "import pathlib; p = pathlib.Path('.claude/skills/planning/SKILL.md').read_text(encoding='utf-8'); r = pathlib.Path('scripts/data_quality_runner.py').read_text(encoding='utf-8'); assert '### What Data-Quality Health Represents' not in p, 'source section still present'; assert 'scripts/data_quality_runner.py' in p, 'pointer missing'; assert 'checks_defined == 0' in p, 'operative signal missing'; assert 'config/agent/data_quality/' in p, 'obligation destination missing'; assert 'Two-layer health picture' in r and 'checks_defined > 0' in r and 'last_run.verdict == PASS' in r, 'destination did not receive the content'; print('OK')"
    expected: Prints OK and exits 0.
    fix_if: >-
      "destination did not receive the content" means the relocation deleted rather than moved -- a relocation
      that frees bytes without a receiving file is a deletion and is not the funding this plan claims. "pointer
      missing", "operative signal missing" or "obligation destination missing" means the preflight bullet was
      dropped or thinned below the Decision 66 line: the planner must still read the signal and the obligation
      at composition time, with only the two-layer derivation relocated.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This asserts a one-time relocation completed, not a standing property; once merged the check can only fail
      if someone re-adds a section this plan removed, which the anti-drift test already guards.
  - step: 8
    phase: pre-deploy
    action: The anti-drift suite passes with the new assertions.
    command: bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py -q
    expected: All tests pass (the file's existing 6 tests plus the 5 added here), exit 0.
    fix_if: >-
      A failure names the surface that drifted. Do not weaken an assertion to make it pass -- the assertions are
      the acceptance strings of PDB-05, PDB-02 and B3-R5 and are the red/green evidence this plan's
      test_obligations rows point at.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The identical node ids already run in the full pytest tier on every PR and post-merge, so a registry entry
      would re-run the same selectors under a second harness with no added discrimination.
  - step: 9
    phase: pre-deploy
    action: >-
      Pre-handoff full-tier validation, satisfying handoff_policy.full_validation_required_before_commit -- the
      full tier adds the prose/SLOC currency and plan-registration sweeps the fast tier scopes down.
    command: bin/venv-python -m scripts.validate
    expected: Full tier exits 0 on the branch head, after every tracked write and the implementation declaration.
    fix_if: >-
      A full-tier-only check fails (e.g. a prose-budget currency sweep or a plan-registration check on this
      plan's own file): fix the cause its message names. Never demote, skip or --ignore-budget past it, and
      never re-run into green (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The command is the full presubmit gate itself; a registry row invoking scripts.validate would recurse the
      gate (the same exclusion class the hermetic-authoring rule states for scripts/validate.py --pre).
  - step: 10
    phase: post-deploy
    action: Closure obligation -- the bundled rec is closed after the merge sync.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json, pathlib; rows = [json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; bad = [r['id'] for r in rows if r['id'] == 'rec-2944' and r.get('status') != 'closed']; assert not bad, bad; print('OK')"
    expected: Prints OK -- rec-2944 reads status=closed in the refreshed cache.
    fix_if: >-
      Still open means the `Resolves: rec-2944` trailer did not reach the squash commit and rec-autoclose did not
      fire; close it directly with proof via `bin/venv-python -m scripts.ops_data_portal --update-rec rec-2944
      --status closed --resolution "<VP step 4 command and its exit 0 on main at <sha>>"`. Sync only through
      `ops_data_portal --sync`; AGENTS.md forbids calling the pull CLI directly.
    hermetic: false
test_obligations:
  - source: .claude/skills/planning/SKILL.md
    behavior: >-
      The Step 9 convergence rule stays finding-shaped -- no round-count cap, an oscillation interrupt, the
      autonomous confirming round, the pinned gates-line clause, both carriers, and both revisit conditions --
      and the Step 10 mirror at :635 applies it in kind ("Apply the Step 9 Convergence rule in kind") instead of
      carrying its own round count.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py::test_critique_gate_convergence_is_finding_shaped
    red_green_expectation: >-
      Red before -- origin/main's :597 contains "after 3 REVISE rounds" and none of the new clauses, and its
      :635 reads "After 3 rounds without convergence". The test asserts, in one node: the cap literal is absent;
      the oscillation-interrupt literal "Oscillation interrupts, not the count" and its recurrence key
      "recurring at a tag+anchor you recorded fixed" are present; the mechanical-first ordering
      ("tagged findings first") is present; "starts a new series" is present; and :635 carries
      "Apply the Step 9 Convergence rule in kind". Every one of those six fails against origin/main. Green after
      the rewrite and the mirror.
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: >-
      Every finding carries a mechanical/judgement tag -- mechanical meaning any deterministic check could
      catch it, named -- with a stable anchor whose grammar is fixed (plan field path or VP step id), so the
      convergence procedure's recurrence key has a critic-authored source that is comparable across two
      independent fresh-context critics.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py::test_critic_tags_every_finding_with_a_stable_anchor
    red_green_expectation: >-
      Red before -- origin/main's :157 reads "tag each registration-closure finding" and
      "mechanical (scripts.roadmap.plan_obligations)", both of which the test asserts are ABSENT, and carries
      neither "tag each finding, with a stable anchor (plan field path or VP step id)" nor
      "mechanical (a deterministic check could catch it -- name it)", both of which the test asserts are
      PRESENT. All four assertions fail against origin/main. Green after the :157 rewrite.
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: >-
      The IMPLEMENTATION branch asks the split question and a suggested split names the deferred half's
      disposition, so the critic's scope-breadth question and PDB-02's follow-on route stay on the surface.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py::test_implementation_branch_asks_the_split_question
    red_green_expectation: >-
      Red before -- origin/main's :40 carries no split question (only the STRATEGIC bullet at :39 does) and :136
      has no deferred-half clause, so both assertions fail. Green after the two insertions.
  - source: .claude/commands/plan.md
    behavior: The command's Step 9 escalation menu is the skill's menu, verbatim, so the two surfaces cannot drift apart again.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py::test_escalation_menu_is_identical_on_command_and_skill
    red_green_expectation: >-
      Red before -- origin/main's :101 offers "narrowing scope, re-deriving the approach, or split the plan" and
      the skill offers "accept-with-deferral / re-scope / abandon", so no shared literal exists. Green after both
      rewrites.
  - source: scripts/data_quality_runner.py
    behavior: >-
      The module docstring carries the two-layer data-quality health picture that the planning skill used to
      restate, so the semantics travel with the tool that produces both halves.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py::test_data_quality_semantics_live_with_their_producer
    red_green_expectation: >-
      Red before -- "Two-layer health picture" is absent from the runner and the "### What Data-Quality Health
      Represents" heading is still in the planning skill. Green after the relocation.
  - source: tests/test_workflow_skill_antidrift.py
    behavior: The anti-drift contract file itself gains the five assertions the other rows are proven by.
    verification_step: 8
    test_selector: tests/test_workflow_skill_antidrift.py
    waiver_reason: >-
      This file IS the evidence surface for every other obligation row in this plan; a test asserting that the
      test file contains its own tests would be circular, and pytest's own collection failure is the real guard
      against it going missing.
constraints:
  - >-
    Scope boundary (docs/contracts/implement-scope-boundary.yaml -- AGENTS.md attributes it to Decision 59,
    Decision 181 carries the CONTENT never-weaken invariant) -- only the five scope files may be modified;
