work_areas: []
rollback: >-
  Every change is additive, so nothing here can lock CI out: the current segment is never touched. Mid-sequence
  failure: stop where it failed; the roles already updated carry both segments, the rest carry the current one,
  and CI keeps working on the current path; RCA, then resume from the failed step. Full rollback (only if the
  target entry itself is wrong and must go): a PR reverting both lists in one commit, then the same channels in
  the same order -- bootstrap apply, split-apply of planner and deploy, cancel the push run's waiting gate,
  dispatch and approve branch and pr. The same revert PR removes identity.staged_phase, so
  validate_github_org_transfer then expects [current] alone and stays green. A wrong org id is corrected the same way with the right id, not reverted.
