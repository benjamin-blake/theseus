constraints:
  - >-
    Every live mutation is its own step on the operator's typed word, in the build thread, on the exact command
    shown: the bootstrap apply, the split-apply, the cancel, the dispatch and its approval, the deploy dispatch
    (project instructions; Decision 126). Present the command and expected result first; verify from the live
    system after. Never batch two mutations under one word. Read-only admin calls are standing.
  - >-
    The org numeric id is written ONLY into the two local.github_repos lists (operator ruling, contract
    identity.target.owner_numeric_id). Never in a test, the plan, a PR body, a commit message, the evidence
    file, memory or a reply. Evidence is counts-only: role names, timestamps, run ids, shas; no ARN, account id
    or raw get-role output (Decision 101).
  - >-
    The current segment benjamin-blake@217728084/theseus@1252427466 stays in both roots (Decision 172 clause 4;
    the contract's predecessor_removal phase removes it, not this plan). No wildcard (clause 3).
  - >-
    Never widen IAMRoleReconcile or any CI-role grant to avoid the split (deploy-paths SPLIT-APPLY; Decision
    143 clause 1). terraform/bootstrap/github_ci_apply_policy.tf is out of scope.
  - >-
    Contract and Decision 172 texts land verbatim as approved (drafts named in context); allowed variance: the
    dates and PR numbers. Any other wording change, including one code review asks for, goes back to the
    operator through the coordinator before merge. No new numbered Decision.
  - >-
    This PR's merge needs the operator's typed "merge" (it carries IAM, contract and Decision text: always-ask),
    not the standing code-review rule. Do not merge before step 14 passes.
  - >-
    terraform/personal local init only in the ADMIN container with the S3 mirror (Decision 119/120); never
    fetch providers from github.com. Plan files and worktrees are deleted in the step that makes them; tfvars
    stay gitignored.
  - >-
    This build never flips identity.phase. The flip to pre_staged (and clearing staged_phase) belongs to a later
    PR once every phases.pre_stage gate is evidenced, including this plan's live proof, the terraform/github state
    reconcile evidence (rec-3136) and the PR-time plan (rec-4335); flipping here would deadlock with those plans.
  - No budget raises (Decision 128/165); do not run --update-sloc-budgets.
  - No rescue agents or workaround loops (Decision 55). A failed live step halts this workstream until root-caused.
