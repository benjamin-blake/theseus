  graduation_waiver_reason: A single test_selector-shaped command, so an unreasoned not-applicable would be plan-critique criterion 12o's classification-gaming shape. It is waived rather than graduated because the durable guard this step exercises IS the module itself, which the full tier's pytest run collects unconditionally on every invocation; a registry row naming the same module would make one guard declare itself examined twice.
- step: 8
  phase: pre-deploy
  action: 'The information-preservation audit over every declared Python file, and the only step in this unit that guards against a fix that destroys information. Seventeen ERA001 findings sit in sixteen files and NONE of them is auto-fixable, so every one is a hand edit -- and no test can notice a comment that was deleted rather than reworded. The audit therefore asserts the two properties a comment change can be mechanically held to: per file, the number of comment tokens must not DECREASE, and every identifier-shaped word (one carrying an underscore, a dot, a digit or an internal capital) that appeared in any comment of the base version must still appear in some comment of the edited version. A rewrap or a prose rewrite passes both; a deletion fails the first; a rewrite that drops a symbol name fails the second. SCOPE OF THE FILE LIST: all 59 declared Python Modify rows, not only the sixteen ERA files. The ERA hand edits are why the step exists, but the same information-loss question applies to every file an unsafe ruff rewrite touched, and widening it was measured free -- 59 files examined, loss list empty, on a clone carrying the target config plus every safe fix, every unsafe fix and the three format passes (2026-09-04). The one Create row, tests/docs/__init__.py, is deliberately excluded: it does not exist at the merge-base, so git show would fail on it, and it is created empty with no comment to lose. COVERAGE LIMIT of the symbol half, disclosed rather than hidden: the identifier filter keeps only words carrying an underscore, a dot, a digit or an internal capital, so plain lowercase symbols at these seventeen sites -- emit, verify, handler, command, shape, orchestration, and the hyphen-split scheduled-agent-dispatcher and findings-processor, which the regex splits on the hyphen into pieces none of which qualifies -- are invisible to it. Under those the per-file non-decreasing comment count is the only net, and that net is offsettable: deleting one comment while adding another in the same file nets zero. This is why the plan''s expected outcome is seventeen rewordings and ZERO deletions established by reading each site, with the audit as the mechanical net underneath rather than the whole argument, and it is part of the residual this step''s graduation waiver names. THE REWORD ARM, added in this revision, and the reason it exists. The audit above is satisfied by an implementer who resolves all seventeen ERA001 findings with a trailing noqa marker instead of rewording: the comment token survives, so the count holds, and the audit strips noqa directives before extracting identifiers, so the symbols survive too. That was MEASURED, not reasoned -- on a clone of 58afe0a with all seventeen sites silenced by appending a noqa marker naming ERA001, ruff reports all checks passed AND the audit above reports 59 files examined with an empty loss list. So the plan''s strongest claim, seventeen rewordings and zero silencings, had no step that would fail were it false. The reword arm closes that: it resolves the seventeen base ERA001 sites by running ruff --isolated --select ERA001 over a temporary mirror of the sixteen files AT THE MERGE-BASE, reads the comment token at each reported line, normalises it by stripping any noqa directive and collapsing whitespace, and requires that NO base body survives in the edited file. A reword changes the body and passes; a noqa leaves the body identical once the directive is stripped and FAILS; a deletion passes this arm and fails the count half above, so the two together say the comment was REWRITTEN. It covers all SEVENTEEN sites, not the twelve the identifier half reaches, because it does not rest on the identifier filter. ITS OWN LIMIT, disclosed: it cannot tell a good reword from a bad one, and an implementer who deletes a comment at one of the seventeen sites while adding an unrelated comment elsewhere in the SAME file nets zero on the count half and changes the body, so that one shape passes both. WHAT THE REWORD ARM CHANGES ABOUT THIS STEP''S DISCRIMINATING POWER: the drafting version of this step was a CONDITIONAL PRESERVATION guard that caught a LOSSY edit and never an ABSENT one, and passed on an unmodified tree. With the reword arm it now FAILS on an unmodified tree -- every base body survives verbatim there, so all seventeen sites report SURVIVED. Measured three ways on 2026-09-04 against clones of 58afe0a: unmodified tree RED, all-seventeen-silenced-with-noqa tree RED, all-seventeen-reworded tree GREEN. The step then FALSIFIES its count half as well: it re-runs the same audit in a scratch clone with one comment line deleted and requires that run to fail.'
  command: "cat > /tmp/ruff-wave-b-comment-audit.py <<'AUDIT'\nimport io\nimport re\nimport subprocess\nimport sys\nimport tokenize\n\nIDENTIFIER = re.compile(r\"[A-Za-z_][A-Za-z0-9_.]*[A-Za-z0-9_]\")\n\n\ndef profile(source: str) -> tuple[int, set[str]]:\n    count, symbols = 0, set()\n    for token in tokenize.generate_tokens(io.StringIO(source).readline):\n        if token.type == tokenize.COMMENT:\n            count += 1\n            body = re.sub(r\"#\\s*noqa:[^#]*\", \"\", token.string)\n            symbols |= {\n                word\n                for word in IDENTIFIER.findall(body)\n                if \"_\" in word or \".\" in word or any(c.isdigit() for c in word) or any(c.isupper() for c in word[1:])\n            }\n    return count, symbols\n\n\nbase_ref, files = sys.argv[1], sys.argv[2:]\nlosses = []\nfor path in files:\n    base = subprocess.run(\n        [\"git\", \"show\", base_ref + \":\" + path],\n        capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", check=True,\n    ).stdout\n    before_count, before_symbols = profile(base)\n    after_count, after_symbols = profile(open(path, encoding=\"utf-8\").read())\n    if after_count < before_count:\n        losses.append((path, \"comment lines dropped\", before_count, after_count))\n    if before_symbols - after_symbols:\n        losses.append((path, \"comment symbols lost\", sorted(before_symbols - after_symbols)))\nprint(\"declared Python files examined:\", len(files))\nprint(\"information losses:\", losses)\nraise SystemExit(1 if losses or len(files) != 59 else 0)\nAUDIT\nbin/venv-python /tmp/ruff-wave-b-comment-audit.py \"$(git merge-base origin/main HEAD)\" scripts/build_lambda_deploy.py scripts/checks/contracts/validate_contract_drift.py scripts/checks/deps/affected_graph.py scripts/checks/iam_tf/validate_environment_taxonomy.py scripts/checks/misc/validate_diff_coverage.py scripts/checks/validation_result.py scripts/ci/plan_digest.py scripts/ci_rca/taxonomy.py scripts/ci_rca/tier_map.py scripts/convergence_health/code_drift.py scripts/data_quality_compile.py scripts/decisions_md.py scripts/execute_recommendation.py scripts/executor/__init__.py scripts/executor/acceptance_lint.py scripts/executor/batch_compound.py scripts/executor/branch_lifecycle.py scripts/executor/ci_triage.py scripts/executor/jsonl_store.py scripts/executor/plan.py scripts/executor/plan_generation.py scripts/executor/postflight_gates.py scripts/executor/run_summary.py scripts/executor/step_acceptance.py scripts/lambda_manifest.py scripts/north_star_tracker.py scripts/ops_portal/maintenance_ops.py scripts/ops_portal/write_validators.py scripts/preflight/context_docs.py scripts/terraform_apply_guard.py scripts/test_coverage_checker.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py tests/checks/contracts/test_validate_composite_action_shape_rosters.py tests/checks/contracts/test_validate_data_model_standard.py tests/checks/hygiene/test_pyproject_ruff_select.py tests/checks/iam_tf/validate_ci_refresh_read_coverage/conftest.py tests/checks/typing/test_mypy_baseline.py tests/checks/verification/test_validate_verification_registry.py tests/common/ducklake_reader_client/test_ducklake_reader.py tests/common/test_ducklake_writes.py tests/executor/step_runner/test_commit_format.py tests/fixtures/ducklake_writer_handler.py tests/lambda_manifest/test_bundle_checks.py tests/ops_data_portal/test_pipeline_reader.py tests/test_cost_reconciliation.py tests/test_decision_scout_retrieval.py tests/test_ducklake_catalog_dr_handler.py tests/test_ducklake_connect_probe.py tests/test_ducklake_maintenance.py tests/test_ducklake_maintenance_smoke_handler.py tests/test_ducklake_reader_handler.py tests/test_ducklake_scd2_schema.py tests/test_iam_simulate.py tests/test_import_governance.py tests/test_ops_portal_facade.py tests/test_plan_digest.py tests/test_sync_deps.py tests/test_terraform_drift_acceptance.py tests/verify_ci_workflow/test_apply_and_terraform.py\nRC=$?\ncat > /tmp/ruff-wave-b-era-reword-audit.py <<'REWORD'\nimport io\nimport json\nimport pathlib\nimport re\nimport subprocess\nimport sys\nimport tempfile\nimport tokenize\n\nNOQA = re.compile(r\"#\\s*noqa\\b[^#]*\", re.IGNORECASE)\n\n\ndef normalise(comment: str) -> str:\n    return re.sub(r\"\\s+\", \" \", NOQA.sub(\"\", comment).lstrip(\"#\").strip())\n\n\ndef bodies_by_line(source: str) -> dict[int, str]:\n    return {\n        tok.start[0]: normalise(tok.string)\n        for tok in tokenize.generate_tokens(io.StringIO(source).readline)\n        if tok.type == tokenize.COMMENT\n    }\n\n\ndef all_bodies(source: str) -> set[str]:\n    return set(bodies_by_line(source).values())\n\n\nbase_ref, files = sys.argv[1], sys.argv[2:]\nwith tempfile.TemporaryDirectory() as tmp:\n    root = pathlib.Path(tmp)\n    base_source = {}\n    for path in files:\n        text = subprocess.run(\n            [\"git\", \"show\", base_ref + \":\" + path],\n            capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", check=True,\n        ).stdout\n        base_source[path] = text\n        dest = root / path\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(text, encoding=\"utf-8\")\n    done = subprocess.run(\n        [sys.executable, \"-m\", \"ruff\", \"check\", \"--isolated\", \"--select\", \"ERA001\",\n         \"--no-cache\", \"--output-format=json\", str(root)],\n        capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", check=False,\n    )\n    findings = json.loads(done.stdout or \"[]\")\n\nsites = []\nfor finding in findings:\n    rel = str(pathlib.Path(finding[\"filename\"]).relative_to(root))\n    row = finding[\"location\"][\"row\"]\n    body = bodies_by_line(base_source[rel]).get(row)\n    if body is None:\n        print(\"UNRESOLVED base ERA001 site\", rel, row)\n        raise SystemExit(1)\n    sites.append((rel, row, body))\nsites.sort()\n\nsurvivors = []\nfor rel, row, body in sites:\n    if body in all_bodies(pathlib.Path(rel).read_text(encoding=\"utf-8\")):\n        survivors.append((rel, row, body))\n\nprint(\"base ERA001 sites resolved:\", len(sites), \"across\", len({s[0] for s in sites}), \"files\")\nprint(\"sites whose base comment survives verbatim (noqa-stripped):\", len(survivors))\nfor rel, row, body in survivors:\n    print(\"  SURVIVED\", rel + \":\" + str(row), repr(body))\nraise SystemExit(1 if survivors or len(sites) != 17 else 0)\nREWORD\nbin/venv-python /tmp/ruff-wave-b-era-reword-audit.py \"$(git merge-base origin/main HEAD)\" scripts/checks/contracts/validate_contract_drift.py scripts/ci/plan_digest.py scripts/convergence_health/code_drift.py scripts/executor/__init__.py scripts/ops_portal/maintenance_ops.py scripts/preflight/context_docs.py tests/checks/contracts/test_validate_data_model_standard.py tests/lambda_manifest/test_bundle_checks.py tests/test_decision_scout_retrieval.py tests/test_ducklake_catalog_dr_handler.py tests/test_ducklake_maintenance.py tests/test_ducklake_maintenance_smoke_handler.py tests/test_ducklake_scd2_schema.py tests/test_import_governance.py tests/test_plan_digest.py tests/verify_ci_workflow/test_apply_and_terraform.py\nERA_RC=$?\nC=/tmp/ruff-wave-b/clone-era; rm -rf \"$C\"; mkdir -p /tmp/ruff-wave-b; git clone --shared --quiet \"$PWD\" \"$C\" && ln -s \"$PWD/.venv\" \"$C/.venv\"\nfor f in scripts/build_lambda_deploy.py scripts/checks/contracts/validate_contract_drift.py scripts/checks/deps/affected_graph.py scripts/checks/iam_tf/validate_environment_taxonomy.py scripts/checks/misc/validate_diff_coverage.py scripts/checks/validation_result.py scripts/ci/plan_digest.py scripts/ci_rca/taxonomy.py scripts/ci_rca/tier_map.py scripts/convergence_health/code_drift.py scripts/data_quality_compile.py scripts/decisions_md.py scripts/execute_recommendation.py scripts/executor/__init__.py scripts/executor/acceptance_lint.py scripts/executor/batch_compound.py scripts/executor/branch_lifecycle.py scripts/executor/ci_triage.py scripts/exe