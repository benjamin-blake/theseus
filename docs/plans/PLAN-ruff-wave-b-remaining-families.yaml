- 'Rehearsal caveat, and WHICH REF EACH STEP ACTUALLY READS (plan-critique round 2 measured this). The planning session exercised individual commands and check functions in scratch clones and did NOT run scripts.validate as a tier. Clone artefacts to expect and ignore: a symlinked .venv shows as untracked in get_status_aware_diff. Ref mechanics, measured 2026-09-04: git clone --shared of a repository gives the CLONE a remote-tracking origin/main pointing at the SOURCE repository''s LOCAL main branch, and an outer git fetch origin main does not move that copy -- in this sandbox the local main was 5ff55c9, six commits behind the fetched origin/main 5fc033b, and it still carries the pre-wave-A four-family select. Steps 1, 6 and 8 all create clones, so read the ref question per step rather than in general. Step 1''s git show runs in the OUTER repository (it precedes the cd into the clone), so it reads the fetched origin/main that the pre-implementation checklist refreshes, and it now PRINTS that ref as substituted-base-ref so the reader never has to infer it; rehearsing step 1 from inside a clone instead reads that clone''s pre-wave-A main, which is exactly what the critique sandbox saw, and the step still passes -- measured TOTAL=74 and base-per-file-ignores-lines=0 with EITHER pyproject version, because the loop passes --select per family, which overrides whatever select the substituted config carries, and the two versions differ only on the select line. Step 8''s first half AND its reword arm both read the outer merge-base seam (the fetch applies); its falsifier half reads the clone''s own HEAD, never origin/main. The reword arm fails LOUDLY on a bad ref rather than quietly: git show raises on a file absent from the ref, and a resolved-site count other than seventeen is itself a failure. All three rehearsals of the reword arm recorded in the honesty matrix substituted HEAD for the merge-base expression for exactly this reason -- in a clone of this sandbox, origin/main is the source repository''s LOCAL main, which predates wave A and does not contain the pinning module at all. Step 10 reads the outer merge-base seam through get_status_aware_diff (the fetch applies). Step 6''s clone reads no ref at all. One consequence of widening step 8 to the fifty-nine declared Python rows: the merge-base it resolves must contain every one of them, so a merge-base predating wave A would make git show fail loudly rather than silently skip -- step 8''s fix_if names that tell.'
- 'TestPerFileIgnoresAreExactlySanctioned is an EXACT-equality assertion over a collection that can grow, which is the shape tests/CLAUDE.md''s Test-count coupling section warns against. It is taken DELIBERATELY: growth of per-file-ignores IS the neutering vector wave A named as its unenforced residual, so growth SHOULD require review, and the same section''s growth-safe-invariant rule makes exact equality the correct shape for a table that must not grow at all. The accepted cost, stated rather than discovered: a future legitimate per-file-ignore entry reddens this module from a PR that never touched it. That red is discoverable rather than mysterious -- Decision 135''s data-edge channel selects this module for such a PR, since the module carries the quoted token pyproject.toml -- and the correct response is to update _SANCTIONED_PER_FILE_IGNORES in the same PR that adds the entry, which is exactly the review the exact equality exists to force. The select ratchet stays a MEMBERSHIP assertion for the opposite reason and step 6''s SELECT-ONLY arm is what holds it there.'
- 'PREMISE SOURCING, stated rather than assumed. Steps 1, 4 and 8 describe the implementing agent as denied git commit, which is what makes their clone-of-HEAD form order-independent. That is an OPERATING-MODE fact, not a settings.json fact: Bash(git commit:*) is in the allow list and the implement skill commits at its own step. Its source is rec-3573''s stored context (the implementing agent is denied git commit by design -- the coordinator owns commits) plus this plan''s own execution order, which runs the whole verification plan before any commit flow. The ordering that actually matters is verification-before-commit, and that holds either way; if a commit does land mid-run, the tell is named in the fix_if of both step 1 and step 4 -- the clone carries the fixes and the counts collapse.'
- 'AMENDED 2026-09-05, after the merged plan''s implementation was verified but blocked by the pre-push full tier on three files and the operator chose to pay the debt. Three units landed on main between this plan''s merge (PR #1078, base ab6ef59) and this amendment (main at c73496e): the same-PR guard''s resolved-plan companion exemption (same-pr-guard-plan-companion-exemption, PR #1086); the whole-file coverage debt on scripts/north_star_tracker.py and scripts/lambda_manifest.py, paid by ADDING TESTS with no source change (coverage-debt-lint-blocked-files, PR #1088) -- so both files STAY in this scope carrying their lint fixes, and check_per_file_coverage over the pair returns no error on the assembled end state (re-verified 2026-09-05); and scripts/verifiers/harness.py''s single PIE790, landed ALONE as the same-PR guard requires (harness-pie790-sole-verifier-change, PR #1090) -- so that finding is gone from main and the file LEAVES this scope. EVERY RE-PINNED NUMBER, old -> new, all re-measured against main at c73496e with ruff 0.15.20: scope rows 62 -> 61; six-family census TOTAL 75 -> 74 with PIE 21 -> 20 (PIE790 x2 -> x1; ICN 1, INP 1, C4 15, ERA 17, RET 20 unmoved); findings in reach 74 -> 73, carve-out still exactly one (step 4 now reads 73 with the entry and 74 without); census union 61 -> 60 distinct files, 33 -> 32 under scripts/, 28 under tests/ unmoved; edited finding-carrying files 59 -> 58; declared Python Modify rows 60 -> 59 (step 8''s hard-typed audit list and its len(files) guard both drop harness.py); non-ERA files covered by step 8 44 -> 43; scope python files 61 -> 60 (steps 11 and 13); safe-fixable findings 35 -> 34, unsafe 22 and no-fix-at-any-level 18 unmoved; test_obligations 34 -> 33 rows over 32 -> 31 in-scope scripts/ files; Decision 182 breadth n_selected 258 -> 254 of a 534 -> 537 module census, allowance 516s -> 508s, predicted test half 232.2-300.3s -> 227.1-293.5s, predicted elapsed 283.2-372.0s -> 278.1-365.2s, verdict still breadth_waived, per-family reference PIE 177 -> 172, RET 106 -> 101, INP 1 -> 0, C4 141 / ERA 91 / ICN 1 unmoved. NOTHING ELSE MOVED: no other scope row added or removed, the select list untouched, the carve-out untouched, no step id changed and no step command changed except where an old number or the harness path was embedded in the command text. The verified implementation is parked at branch parked/ruff-wave-b-remaining-families (tip 1088e8b), whose diff over its base is exactly this scope plus scripts/verifiers/harness.py; the implementation this amended plan describes is that diff MINUS the harness.py hunk, which re-applies onto c73496e with no conflict.'
