  behavior: '[tool.ruff.lint.per-file-ignores] must hold EXACTLY the one sanctioned entry mapping the carved deploy-trigger file to the single code RET505. Exact equality, not membership: this table is the one surface that can neuter a selected family in effect while leaving it in select, so it must not grow silently.'
