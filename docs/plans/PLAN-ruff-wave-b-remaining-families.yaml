solved to a commit predating that file (the pre-implementation checklist''s fetch, or a clone-local origin/main -- see the Rehearsal caveat); fix the ref, never the list. A SURVIVED line from the reword arm names a site whose base comment is still present once its noqa directive is stripped -- which means that finding was SILENCED rather than rewritten, or was never touched. Reword it: the plan''s judgment rule allows no noqa at these seventeen sites and a proven-clean reword exists for every one. If the arm reports a site count other than seventeen, the merge-base is wrong or the ERA file list drifted -- fix the ref, never the expected count. Never narrow the file list, the symbol rule or the reword arm''s site list to obtain a pass.'
