schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ruff-wave-b-remaining-families
intent: Extend the enforced ruff select list from wave A's fourteen families to twenty by adopting the remaining six the repository can be brought to zero on (C4, ERA, ICN, INP, PIE, RET), fixing all 73 findings that are in reach across 58 files plus one new package marker, carving out by rule code the single finding that sits in a file a lint wave may not edit, and closing rec-3572 by coupling the pinning module's adopted-family list to its firing-fixture map so no family can be declared adopted while carrying zero firing evidence.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ruff-wave-b-remaining-families.yaml
phase: 'Lint-surface adoption, wave B (the six remaining families, which the tree does not yet satisfy). No tier_item slice and no exit criterion closes here, so there is no closes_criteria key; soft-warn exception category ad_hoc_rec (autonomous-day operator brief, Task 7 wave B), plus one bundled code-review recommendation, rec-3572, whose file and acceptance probe name exactly the module this unit edits. Wave A landed the fourteen-family select in PR #1075 at 58afe0a and is not revisited.'
scope:
- file: pyproject.toml
  action: Modify
  purpose: 'Two edits, nothing else in the file. (1) Replace the single [tool.ruff.lint] select line with the twenty-element sorted list ["A", "ASYNC", "C4", "E", "ERA", "F", "FA", "I", "ICN", "INP", "INT", "ISC", "LOG", "PIE", "Q", "RET", "SLOT", "TID", "W", "YTT"], keeping it on ONE line because verification step 6''s mutation arms substitute on that line. The wave-A FA marker comment directly above it is untouched. (2) Add a NEW [tool.ruff.lint.per-file-ignores] table -- the file has none today, verified at 58afe0a -- holding exactly one entry, "scripts/llm/utils.py" = ["RET505"], preceded by one comment line reading: # scripts/llm/utils.py matches deploy-prod-lambdas.yml''s push path filter, so a lint wave may not edit it; carve-out pinned by tests/checks/hygiene/test_pyproject_ruff_select.py -- both of that comment''s clauses are falsifiable (step 4 asserts the path is matched by a pattern parsed out of that workflow; step 6 arms IGNORES-GROW and IGNORES-GONE assert the pin). line-length, target-version, exclude and every other tool table are untouched, and no dependency pin moves.'
- file: tests/checks/hygiene/test_pyproject_ruff_select.py
  action: Modify
  purpose: 'Wave A''s pinning module gains four things and loses nothing. (1) Six entries added to _ADOPTED_FAMILIES, taking it to sixteen. (2) Six firing fixtures added to _FIRING_FIXTURES (C4/C408, ERA/ERA001, ICN/ICN001, INP/INP001, PIE/PIE810, RET/RET505), taking it to fifteen. (3) rec-3572''s coupling: a new module constant _SEPARATELY_GUARDED_FAMILIES holding the single documented exception FA, plus TWO assertions inside TestRuffSelectRatchet. The first, test_every_adopted_family_has_firing_evidence, carries BOTH halves of the coupling: set(_ADOPTED_FAMILIES) minus set(_SEPARATELY_GUARDED_FAMILIES) must EQUAL set(_FIRING_FIXTURES), AND every family named in [tool.ruff.lint] select must be declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES. The second half is what makes the coupling REACH select: without it a family added to select ALONE carries zero firing evidence and nothing fails, which is rec-3572''s defect one level up. It belongs in the COUPLING assertion and never in test_adopted_and_preexisting_families_are_all_present, which stays a pure SUPERSET membership assertion -- step 6''s SELECT-ONLY-RATCHET arm collects that node alone under a grown select and requires it GREEN. The second assertion, test_separately_guarded_families_each_own_a_dedicated_test, requires every separately-guarded family to own a dedicated test method on TestSelectedFamiliesAreLive. The second closes the escape hatch the first would otherwise open (silencing the coupling by declaring a family exempt). Both live in TestRuffSelectRatchet on purpose: rec-3572''s own acceptance probe runs that class by name. SPELLING IS LOAD-BEARING for that probe: the stored acceptance greps the module SOURCE for the literal set(_FIRING_FIXTURES) and requires at least one hit, so the coupling assertion must be written with that exact call form. An equivalent formulation -- a precomputed local, or frozenset(_FIRING_FIXTURES) -- would satisfy every step of this plan and still fail the rec''s own acceptance probe, and step 19 would then be reading back a rec that never closed. THREE spellings are load-bearing here, not one, because step 6''s mutation arms substitute on module literals and a bare replace no-ops silently -- and step 6''s command may NOT be edited to chase a different spelling (implement-scope-boundary.yaml lists verification_plan command edits under prohibited_field_edits), so the module is written to the anchors rather than the anchors to the module. (i) set(_FIRING_FIXTURES) in that exact call form, for rec-3572''s stored acceptance probe, as above. (ii) _SEPARATELY_GUARDED_FAMILIES must be a module-level PARENTHESISED TUPLE assignment whose opening parenthesis sits on the same line as the name: step 6''s EXEMPT-NO-TEST arm anchors on that shape, so a set literal, a frozenset call or a list makes the arm raise NO-OP and leaves the escape-hatch half of rec-3572 untested. (iii) _ADOPTED_FAMILIES must be EXPLODED to one entry per line with a four-space indent and a trailing comma, because step 6''s ADOPTED-NO-FIXTURE arm substitutes on the literal four-space-indented SLOT entry line. The explosion is not a stylistic preference: at sixteen entries the one-line tuple measures 146 characters against line-length 127, so ruff format produces the exploded form on its own (measured 2026-09-04, both facts) -- but the plan states it because an arm depends on it. (4) A new class TestPerFileIgnoresAreExactlySanctioned pinning [tool.ruff.lint.per-file-ignores] by EXACT equality against a module constant _SANCTIONED_PER_FILE_IGNORES -- exact, not membership, because unlike select this table must not grow by design; growing it is how a family is neutered in effect while staying in select, which is wave A''s named unenforced residual. The membership ratchet over select stays a SUPERSET assertion. Rehearsed at 147 SLOC (up from 84 on the base), unregistered, ruff-clean and ruff-format-clean. The select half of the coupling adds no test method and does not move the module''s test count: rehearsed 2026-09-05 in a scratch clone of origin/main c73496e35ca84bc941edfa0d2974b8a06f7e365c carrying the whole end-state module, pytest reports 22 passed against 13 on the base, and step 6''s eight arms all report OK.'
- file: tests/docs/__init__.py
  action: Create
  purpose: 'New empty file, the whole INP001 fix. tests/docs is the only Python-bearing tests subdirectory without an __init__.py -- measured 2026-09-04: five other tests/ subdirectories lack one, and all five (tests/fixtures/cost_reconciliation, decision_conditions, drain_glue_orphan_payloads, plan_documents, terraform_apply_guard) hold zero .py files, which is why INP001 does not fire on them. Adding it matches every sibling test package and tests/CLAUDE.md''s stated mirror convention; the file is empty, exactly like tests/checks/hygiene/__init__.py and tests/ops_data_portal/__init__.py, both measured at 0 bytes. Verified in a scratch clone: it perturbs neither collection (tests/docs collects and passes) nor validate_no_cross_test_imports, which walks tests/**/*.py for imports whose target starts with test_ and finds none in an empty file.'
