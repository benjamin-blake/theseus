  expected: 'Two audit runs with a strip report between them. The first audit reports 59 declared Python files examined and an empty list of information losses. The strip then reports the base comment-token count for tests/test_plan_digest.py, the comment token or tokens it removed, and a post-strip count exactly one below the base count -- the victim is located by TOKENIZING the file rather than by grepping for a literal, so the falsifier does not depend on which reword the implementer chose at that site, and it strips as many tokens as it takes to land one below the base count if the reword added a comment line. The second audit, run against that clone, reports the same 59 files and a SINGLE loss naming tests/test_plan_digest.py with its comment count one below the base -- single because the first run already proved every other declared file loss-free. The reword arm then reports seventeen base ERA001 sites resolved across sixteen files and ZERO sites whose base comment survives verbatim once any noqa directive is stripped, at rc 0. The final line reports the working-tree audit at rc 0, the reword arm at rc 0, the strip at ok, and the falsifier at red, and the step exits zero. THE REWORD ARM WAS REHEARSED THREE WAYS on 2026-09-04 against clones of 58afe0a and it separates exactly the cases it claims to: on the UNMODIFIED tree it reports 17 of 17 SURVIVED at rc 1; on a tree where all seventeen findings were silenced by appending a noqa marker naming ERA001 -- where ruff reports all checks passed and the count-and-symbol audit above reports 59 files examined and an empty loss list -- it still reports 17 of 17 SURVIVED at rc 1; and on a tree where all seventeen were reworded in place it reports 0 SURVIVED at rc 0 while ruff reports all checks passed and the audit above stays clean. A resolution count other than seventeen is itself a failure, so a wrong merge-base cannot make this arm pass quietly. The falsifier half was rehearsed end to end on 2026-09-04 against a clone of 58afe0a: the unstripped clone audits clean at rc 0, the strip takes the file from 14 comment tokens to 13 and reports the banner rule it removed, and the re-run audit reports exactly one loss (comment lines dropped, 14 to 13) at rc 1. The fifty-nine-file widening was measured on 2026-09-04 (at sixty files, before scripts/verifiers/harness.py left this scope) in a clone carrying the target config plus every safe fix, every unsafe fix and the three format passes: 59 examined, losses empty -- so ruff''s own rewrites destroy no comment on this tree and the widening costs nothing while closing the gap over the 43 non-ERA files. The working-tree half''s numbers stand from the planning session''s end-state clone. This step passing is evidence about HOW the edits were made, never that they were made.'
