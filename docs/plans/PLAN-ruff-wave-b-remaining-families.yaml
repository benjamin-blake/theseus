- step: 19
  phase: post-deploy
  action: 'After squash-merge with a "Resolves: rec-3572" trailer, confirm rec-autoclose closed the rec in the warehouse (closure obligation for a rec-resolving plan). bundled_recommendations names rec-3572 and no other step in this plan verifies its CLOSURE -- step 6 and step 7 prove the assertion that discharges it and the PR-opening execution step writes the trailer, but none of them reads the rec row back. This step is that read, and it is the only one that can fail if the trailer was malformed or the autoclose workflow did not fire. WHICH READING OF AGENTS.md GOVERNS THIS COMMAND, stated once because both clauses exist and this plan resolves that tension everywhere else: the Single Portal Invariant''s three-function agent surface (file_rec, update_rec, sync) governs WRITES, which is why this step''s fix_if routes a still-open rec back through scripts.ops_data_portal and never through the cache file; the warehouse-as-source-of-truth section''s operator cache-rebuild sanction governs THIS invocation, which is a read-cache rebuild before a read-back and puts nothing upstream. Step 20 runs immediately after and reads the same refreshed cache.'
