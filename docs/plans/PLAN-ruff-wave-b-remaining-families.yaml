constraints:
- 'A clause may appear in permanent source -- a comment, a docstring, a committed plan field -- only if a named verification step would FAIL were that clause false. The two clauses this unit writes into pyproject.toml above the per-file-ignores table are covered: step 4 asserts the carved path is matched by a pattern parsed out of deploy-prod-lambdas.yml, and step 6''s IGNORES-GROW and IGNORES-GONE arms assert the pin the second clause names. The module docstring''s claims about the coupling and the exception list are covered by step 6''s ADOPTED-NO-FIXTURE, EXEMPT-NO-TEST, SELECT-ONLY and SELECT-ONLY-RATCHET arms. This plan''s claim that the seventeen ERA001 findings are REWORDED rather than silenced is covered by step 8''s reword arm, which fails if any of the seventeen base comment bodies survives in the edited file once its noqa directive is stripped.'
- Cite SYMBOLS and rule codes, never line numbers. This plan names _ADOPTED_FAMILIES, _FIRING_FIXTURES, _SEPARATELY_GUARDED_FAMILIES, _SANCTIONED_PER_FILE_IGNORES, TestRuffSelectRatchet, TestSelectedFamiliesAreLive, TestPerFileIgnoresAreExactlySanctioned, scripts.checks._common.get_status_aware_diff, scripts.checks._scaffolding.run_lint_checks and rule codes; it fixes no line number, because every fix in this unit moves the lines below it.
- 'Decision 181 -- no assertion, tolerance, budget or test is weakened to obtain green. The per-file-ignores entry is the one apparent exception and it is NOT one: RET is unselected on the base tree, so this unit is net-new enforcement carrying a single scoped, documented exception rather than the relaxation of an existing assertion. Step 1 measures the base state that makes that true, step 4 proves the exception is exactly one finding wide, and step 6 proves the exception cannot grow or vanish silently. The follow-up obligation is discharged by filing the carved finding as a follow-on rec at closure (execution step, written back into followon_recs), not by leaving the ignore permanent. That follow-on rec''s ACCEPTANCE is written as the removal of the per-file-ignores entry from pyproject.toml (and the matching update to _SANCTIONED_PER_FILE_IGNORES), so the exception cannot outlive its owner: closing the rec and retiring the carve-out are the same event. This is the Decision 150 routing row for the exception (operational_fact -> recommendation) made mechanical rather than promissory, and step 20 closes the last promissory gap by reading the filed rec back after the merge.'
- No hermetic step's expected text may contain a backtick literal. validate_vp_replay extracts every backtick-delimited substring of a hermetic pre-deploy step's expected via _BACKTICK_LITERAL_RE and requires each in the replayed stdout and stderr, so a backticked rule code or path the command never prints reddens the fast tier -- which is registered pre=True and is the authoritative pre-merge gate. Every expected field in this plan is written as plain prose with no backticks at all, hermetic or not, so a later change to a hermetic flag cannot reintroduce the hazard. Re-check this after EVERY revision.
- 'Every verification step that inspects the diff uses a working-tree-aware seam (rec-3573). Steps 10 uses scripts.checks._common.get_status_aware_diff, which unions the merge-base diff with git ls-files --others so an uncommitted tree and a new untracked file are both visible; steps 9, 11, 12 and 14 read the declared scope out of this plan file instead of a diff, and each refuses an empty list. No step in this plan uses the triple-dot diff form, and no step can pass on an empty file list: step 10 asserts both directions of set equality, steps 11 and 14 test -s their derived list, and steps 9 and 12 assert exact row counts. get_status_aware_diff is Decision 135 point 3''s primitive: the merge-base --name-status diff unioned with git ls-files --others, which is what makes an uncommitted edit and the untracked tests/docs/__init__.py both visible to step 10.'
- scripts/llm/utils.py is NOT edited, no file under src/ is edited, and the ruff pin does not move. The deploy-trigger set is derived by parsing the push path filters out of both .github/workflows/deploy-prod-lambdas.yml and .github/workflows/deploy-ducklake-lambdas.yml at verification time, never read from a list written here; twelve patterns across the two, eight of them outside src/, which is why the src/ test alone is insufficient.
- 'ERA001 judgment rule, applied per finding, in this order. (a) DELETE only if the commented text is code that once ran and no longer does, and nothing in the surrounding file or in git history depends on reading it -- genuinely dead code. (b) Otherwise REWORD or REWRAP so the line no longer parses as a Python expression while every identifier, rule code, Decision number and file name in it survives verbatim: move a wrap point, replace a bare call form with prose naming the same symbol, quote a literal pattern. Every (b) fix must be COMMENT-COUNT-PRESERVING, because step 8''s per-file non-decreasing count is the only net under a lowercase symbol: MOVE a wrap point, never FOLD a wrapped fragment into the line above it. Folding is the natural-looking fix at the THREE mid-sentence-fragment sites -- scripts/convergence_health/code_drift.py (the clearest), scripts/ops_portal/maintenance_ops.py and tests/checks/contracts/test_validate_data_model_standard.py -- and it drops the file''s comment count by one, which step 8 reports as comment lines dropped: an honest red for a fix that lost no information. The answer is to re-wrap in place or fall back to (c), never to relax the audit. At the three STANDALONE one-line documentation sites (scripts/executor/__init__.py, tests/test_decision_scout_retrieval.py, scripts/preflight/context_docs.py) there is nothing to fold into, so a fix there either rewords in place or takes (c). (c) A trailing noqa marker naming ERA001 is NOT available at these seventeen sites. It is an established mechanism in this repository generally (878 markers across scripts/, tests/ and src/, and tests/CLAUDE.md blesses the form) and it does silence ruff -- measured 2026-09-04, a noqa at all seventeen makes ruff report all checks passed -- which is exactly why it is closed off here: a silencing and a reword were indistinguishable to every step of the drafting plan, so the plan''s strongest claim had no falsifier. Step 8''s reword arm now reddens on any of the seventeen whose base comment body survives once the noqa directive is stripped. If a site truly cannot be reworded, STOP and seek a human-directed amendment -- do not silence it, because the plan''s premise (a proven-clean reword exists for all seventeen, re-measured 2026-09-04) would then be false and the plan, not the site, is what needs changing. NEVER widen per-file-ignores to cover an ERA finding -- that neuters the family for the whole file. MEASURED ANSWER, which the implementer should expect to reproduce rather than rediscover: on 2026-09-04 all seventeen findings were read, and NOT ONE is dead code. Nine are section-banner labels naming the symbol under test (a convention with 463 instances repo-wide, of which only these fire), two are branch-state annotations that read as comparisons, three are mid-sentence fragments of wrapped narrative comments, and three are standalone one-line comments -- the per-site split is named in context and in step 8''s fix_if. A proven-clean reword exists for every one of the seventeen -- seventeen concrete rewordings were written and verified in a scratch clone on 2026-09-04: ruff reports all checks passed, the comment-count and identifier audit reports 59 files examined with an empty loss list, and step 8''s reword arm reports zero survivors. So the expected outcome is seventeen (b) fixes, zero deletions and zero silencings. Step 8 is the mechanical net under this rule and its reword arm is what makes the no-silencing half falsifiable.'
- 'Wave B only. This unit adopts exactly the six remaining families and does not re-open wave A''s fourteen, does not move target-version, line-length or exclude, and does not touch requirements files. A family that cannot be brought to zero inside the declared scope is DROPPED from this branch''s select list before merge and recorded -- that is pre-adoption selection, not weakening. After merge the rule inverts: a family that starts firing routes to a source=ci_rca forward-fix rec, never to a select removal.'
