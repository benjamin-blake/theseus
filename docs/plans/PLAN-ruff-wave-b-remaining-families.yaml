  expected: 'Four report lines -- the two followon_recs ids as they stand in the merged plan, the same two ids found as rows in the refreshed read cache, their statuses, and the ownership split showing one id against the carve-out marker and a different id against the verification-registry marker -- then exit 0. Not runnable before the squash-merge: the plan file it reads is the merged copy at docs/plans/PLAN-ruff-wave-b-remaining-families.yaml and the rows it looks for are filed at closure, which is why this is the second of the two post-deploy steps. The command logic was rehearsed on 2026-09-04 against fixtures in a scratch directory rather than against a real merge: the green arm (two ids, two rows, one marker each) exits 0; the arm with followon_recs left empty -- which is exactly the state this plan is committed in -- exits 1; and the arm where a single omnibus rec carries both markers exits 1.'
