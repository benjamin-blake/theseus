- source: pyproject.toml
  behavior: '[tool.ruff.lint] select must continue to CONTAIN all twenty families -- the four pre-existing E, F, W, I, wave A''s ten, and this unit''s six C4, ERA, ICN, INP, PIE, RET -- and every family named there must own at least one stable, non-preview rule. Membership, never equality, so a later wave extends the same line without that assertion becoming a change detector. The CONVERSE containment is asserted separately, by the coupling test rather than by the ratchet test: every family named in select must be declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES, so a family cannot reach select carrying no firing evidence at all.'
