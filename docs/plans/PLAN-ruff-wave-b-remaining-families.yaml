bundled_recommendations:
- rec-3572
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- '[tool.ruff.lint] select is exactly the twenty-element sorted list ["A", "ASYNC", "C4", "E", "ERA", "F", "FA", "I", "ICN", "INP", "INT", "ISC", "LOG", "PIE", "Q", "RET", "SLOT", "TID", "W", "YTT"], and bin/venv-python -m ruff check . exits 0 with that list in force. Proved in a scratch clone of 58afe0a on 2026-09-04. The exact-list assertion is deliberately unit-scoped (step 3, which goes dormant once this plan resolves); the STANDING guard is the module''s membership ratchet, so a wave C can extend the same line without editing it.'
- 'Each of the six newly adopted families measures zero across the whole tree (step 2) and is demonstrably LIVE rather than merely listed: C4 emits C408, ERA emits ERA001, ICN emits ICN001, INP emits INP001, PIE emits PIE810 and RET emits RET505, each against a synthetic violation written to a temporary directory and linted through this repository''s own config. Not one fixture is checked in.'
- 'The single finding this unit may not fix -- the RET505 in scripts/llm/utils.py, which deploy-prod-lambdas.yml''s push path filter matches -- is silenced by a per-file-ignores entry naming that one code and nothing else, and the entry is proved to silence EXACTLY one finding: 73 with it, 74 without it, the delta being that file''s RET505 (step 4). The file itself never appears in the diff.'
- 'The carve-out is net-new enforcement with one scoped exception, not the relaxation of anything existing: RET is not in select at all on the base tree (step 1 measures it at 20 findings under an unselected family), so nothing that was asserted before this unit is asserted less afterwards. Decision 181''s declare-your-coverage half is discharged by pinning the table to exact equality, so it cannot grow or vanish silently, and by filing the carved finding as a follow-on rec at closure rather than leaving the ignore permanent and unexplained. The rec that owns the carve-out has the REMOVAL of that per-file-ignores entry as its acceptance, so the entry cannot outlive its owner (Decision 150 routing: operational_fact -> recommendation). The filing is verified, not promised: step 20 reads the id back out of the refreshed read cache after the merge and requires the row to carry the carve-out marker.'
- 'rec-3572 is discharged, not merely referenced: set(_ADOPTED_FAMILIES) minus set(_SEPARATELY_GUARDED_FAMILIES) EQUALS set(_FIRING_FIXTURES), and every separately-guarded family owns a dedicated test method. The coupling REACHES select, which is the gap one level up: every family named in select must be declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES, so a family added to select ALONE -- carrying no firing evidence at all -- reddens (step 6, arm SELECT-ONLY), while the membership ratchet itself stays a SUPERSET assertion that a later wave can extend without tripping (step 6, arm SELECT-ONLY-RATCHET, which collects that one node under the same mutation and requires it GREEN). The mutation that left wave A''s module green -- declaring a family adopted with no firing fixture -- now reddens, and the obvious way to silence that red (declaring the family separately guarded) reddens too (step 6, arms ADOPTED-NO-FIXTURE and EXEMPT-NO-TEST). Every arm asserts its own mutation landed and reports MUTATION-DID-NOT-APPLY as an outcome distinct from a rejected mutant, so a masked arm cannot look like a proof. Closure is verified mechanically rather than assumed: step 19 re-syncs the read cache after the squash-merge and requires the rec-3572 row to carry closed status, so the bundled-recommendation obligation is discharged by a named step and not only by a Resolves trailer.'
- 'The seventeen ERA001 findings are REWORDED, not silenced and not deleted, and a step fails if they are not: step 8''s reword arm resolves the seventeen base sites from the merge-base and requires that NO base comment body survives in the edited file once any noqa directive is stripped -- so a noqa fix, which leaves the body intact and satisfies every other assertion in this plan, reddens. It covers all seventeen sites, not the twelve the identifier filter reaches. It does NOT judge the quality of a reword, and the one shape that passes both halves while losing information is deleting a comment at one of the seventeen sites and adding an unrelated one elsewhere in the same file. No ERA001 fix destroys information. Per declared Python file -- all 59 Modify rows, the sixteen ERA files among them -- the comment-token count does not decrease and every identifier-shaped word that appeared in a comment on the base still appears in a comment afterwards (step 8), and the audit is proved able to detect a deletion by being re-run against a clone with one comment removed. The residual this leaves -- ERA001 permanently selected with only a unit-scoped audit behind it -- is named in step 8''s graduation waiver and owned by a second follow-on rec filed at closure whose id is written back into followon_recs and read back by step 20 (Decision 132).'
- No file under src/ and no deploy-trigger file is touched, where the deploy-trigger set is the twelve push path patterns parsed out of the two deploy workflows at verification time rather than read from a list (steps 9 and 10). The touched set equals the declared scope exactly -- no undeclared path, and no declared row left untouched.
- Every declared python file is ruff-clean and ruff-format-clean, every one is inside its SLOC budget, no budget entry is added, no raise-approved marker enters the diff, and the ruff pin stays at 0.15.20 in both requirements files with no dependency file touched.
- 'The affected test suites pass unchanged (step 16: 53 modules plus the one retained regression witness its action names, 2267 passed and 1 xfailed, against 2258 passed and 1 xfailed for the same command on the unmodified base -- the nine-test difference is this unit''s additions to the pinning module, and the count, not the exit status, is what tells a reader the change landed). The fifty-three-target list is two targets wider than the drafting version because two test_obligations rows that used to carry waivers now name real selectors; BOTH numbers were MEASURED on 2026-09-05 at origin/main c73496e35ca84bc941edfa0d2974b8a06f7e365c -- the base in a pristine clone of that commit and the end state in a clone of the same commit carrying the complete change -- so step 16''s expected now states a measured pair rather than a derived one, and the whole tests/ tree passes at 10666 passed / 11 skipped / 1 xfailed with only the three pre-existing credential-dependent live-reader failures, which fail identically on the base tree (10657 passed / 11 skipped / 1 xfailed there).'
- 'The Decision 182 breadth for this scope is DECLARED, not split: n_selected 254 of a 537-module census, allowance 508s, predicted test half 227.1-293.5s, predicted elapsed 278.1-365.2s, verdict breadth_waived. The classifier''s own guidance for that verdict is to keep the scope and declare it, so this lands as ONE PR.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'BEFORE census, taken in a scratch clone of the committed base so it is order-independent rather than only-valid-before-the-first-edit. Clones HEAD (which during /implement is the branch tip, since the implementing agent is denied git commit and every edit is uncommitted), overwrites the clone''s pyproject.toml with the origin/main copy, and counts each of the six candidate families there. Proves the census this plan''s scope was derived from, and proves the base carries no per-file-ignores table for the carve-out to be confused with. DELIBERATELY NOT HERMETIC: it asserts the PRE-change state, which inverts by construction once this unit merges.'
  command: 'C=/tmp/ruff-wave-b/clone-before; rm -rf "$C"; mkdir -p /tmp/ruff-wave-b; git clone --shared --quiet "$PWD" "$C" && ln -s "$PWD/.venv" "$C/.venv" && printf "substituted-base-ref=%s\n" "$(git rev-parse origin/main)" && git show origin/main:pyproject.toml > "$C/pyproject.toml" && cd "$C" && T=0; for F in ICN INP C4 ERA RET PIE; do N=$(./.venv/bin/python -m ruff check --select "$F" --no-cache --output-format=concise . 2>&1 | grep -cE ":[0-9]+:[0-9]+: " || true); printf "%s=%s\n" "$F" "$N"; T=$((T+N)); done; printf "TOTAL=%s\n" "$T"; printf "base-per-file-ignores-lines=%s\n" "$(grep -c per-file-ignores pyproject.toml || true)"; [ "$T" = "74" ] && [ "$(grep -c per-file-ignores pyproject.toml || true)" = "0" ]'
  expected: 'A line reading substituted-base-ref followed by the full commit sha of the origin/main the base pyproject.toml was taken from, then six lines reading ICN=1 INP=1 C4=15 ERA=17 RET=20 PIE=20, then TOTAL=74, then a line reporting zero per-file-ignores lines in the base config, exit 0. Re-measured 2026-09-05 against main at c73496e with ruff 0.15.20 (the 2026-09-04 planning-session census at 58afe0a read PIE=21 and TOTAL=75, before scripts/verifiers/harness.py''s single PIE790 landed on its own in PR #1090); the per-family, per-file breakdown behind those totals is 60 distinct files, of which exactly one (the carved deploy-trigger file) is out of this unit''s reach. The git show runs in the OUTER repository, before the cd into the clone, so the ref it prints is the one the pre-implementation checklist''s fetch refreshes. Re-measured 2026-09-05 with the PRE-wave-A pyproject substituted instead (four-family select): the same six counts and the same TOTAL=74, because the loop passes --select per family, which overrides the config select.'
  fix_if: A TOTAL other than 74 means the tree moved since the census and the scope rows no longer enumerate the findings -- STOP and re-derive the scope from a fresh measurement rather than editing files the plan does not declare. A TOTAL of 0 means the clone carried the fixes, which can only happen if the implementer committed mid-run; re-run before committing. A non-zero per-file-ignores count in the base means the carve-out already exists and this plan's pyproject row describes the wrong edit. A substituted-base-ref that is not the commit this census was taken against means the base moved or the ref is stale -- read the printed sha before trusting a surprising count, and note that the assertion itself is invariant to the select line of the substituted config (measured both ways), so a stale ref is a reason to re-derive, never a reason to loosen the TOTAL.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the state of the tree BEFORE this unit's change. Once the six families are adopted and their findings fixed, a standing registry row over this command would either measure the base forever (a tautology) or measure the current tree and report zero against an expectation of 74 -- red by construction. Graduating a step whose truth condition the unit itself destroys is the Decision 55 false-green shape inverted.
- step: 2
  phase: pre-deploy
  action: AFTER per-family counts. Runs each of the six families alone against the whole working tree and requires every one to reach zero, so no family is carried by another's fix and none is left partially addressed.
  command: 'T=0; for F in ICN INP C4 ERA RET PIE; do N=$(bin/venv-python -m ruff check --select "$F" --no-cache --output-format=concise . 2>&1 | grep -cE ":[0-9]+:[0-9]+: " || true); printf "%s=%s\n" "$F" "$N"; T=$((T+N)); done; printf "TOTAL=%s\n" "$T"; [ "$T" = "0" ]'
  expected: Six lines reading ICN=0 INP=0 C4=0 ERA=0 RET=0 PIE=0, then TOTAL=0, exit 0. Reproduced in a scratch clone carrying the complete end state on 2026-09-04.
  fix_if: 'A non-zero family count names findings that were not fixed. Fix them in a file this plan already declares; if the finding is in a file the plan does not declare, that is a scope-boundary event -- STOP and seek a human-directed plan amendment rather than appending the path. Never drop the family from select to obtain zero: after merge that is the weakening of a live assertion (Decision 181 clause 1) and the pinning module''s membership ratchet reddens on it mechanically.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The per-family decomposition is unit-scoped bookkeeping for a property step 3 already asserts more strongly at whole-tree scope, and scripts.checks._scaffolding.run_lint_checks already runs ruff as a standing presubmit gate. A registry row here would name, under a second check_id, a strictly weaker slice of a check that already runs on every invocation.
- step: 3
  phase: pre-deploy
  action: 'AFTER state at whole-tree scope -- the real ruff gate across the repository with the twenty-family select in force, plus an exact-equality assertion on the resolved select list. The exact assertion does not grow-couple against a later wave: resolve_declared_plans is EDGE-TRIGGERED on an implementation_declared False-to-True flip, so once this unit merges the plan stops resolving and this step goes dormant. The standing growth-safe guard is the pinning module''s membership ratchet, never this step.'
  command: bin/venv-python -m ruff check . && bin/venv-python -c "import tomllib,sys; s=tomllib.load(open('pyproject.toml','rb'))['tool']['ruff']['lint']['select']; print('resolved select count:', len(s)); print('resolved select:', s); sys.exit(0 if s == sorted(['A','ASYNC','C4','E','ERA','F','FA','I','ICN','INP','INT','ISC','LOG','PIE','Q','RET','SLOT','TID','W','YTT']) else 1)"
  expected: Ruff reports that all checks passed across the repository, then the resolved select count prints as 20 and the resolved select list prints in sorted order, and the step exits zero. Proved in a scratch clone carrying the complete end state on 2026-09-04.
  fix_if: 'A non-zero ruff exit before merge means findings remain; fix them inside the declared scope. It is NOT a licence to remove a family: once the twenty-family select is on main, a family that starts firing routes to a source=ci_rca forward-fix rec filed through scripts.ops_data_portal. A non-zero exit from the second command means the select list is not the twenty-element sorted list; correct pyproject.toml, never the assertion.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The repository-wide ruff invocation is already a standing gate in scripts.checks._scaffolding.run_lint_checks, so a command_exit_zero row would assert what that gate asserts on every run. The select-shape half is the pinning module's own job and is covered by this plan's pyproject.toml test_obligations rows.
- step: 4
  phase: pre-deploy
  action: Carve-out exactness. In a scratch clone carrying this unit's pyproject.toml, count the whole-tree findings with the per-file-ignores entry present, mutate that entry to an empty list, count again, and require the delta to be EXACTLY ONE and the newly reported finding to be the RET505 in the carved file. Then re-derive, by parsing the push path filter out of deploy-prod-lambdas.yml, that the carved path really is on that filter -- which is the falsifier for the first clause of the comment line this unit writes into pyproject.toml above the table.
  command: "C=/tmp/ruff-wave-b/clone-carve; rm -rf \"$C\"; mkdir -p /tmp/ruff-wave-b; git clone --shared --quiet \"$PWD\" \"$C\" && ln -s \"$PWD/.venv\" \"$C/.venv\" && cp pyproject.toml \"$C/pyproject.toml\" && cat > \"$C/carve_probe.py\" <<'PROBE'\nimport fnmatch\nimport pathlib\nimport re\nimport subprocess\nimport sys\n\n\ndef findings(root: pathlib.Path) -> int:\n    done = subprocess.run(\n        [sys.executable, \"-m\", \"ruff\", \"check\", \"--no-cache\", \"--output-format=concise\", \".\"],\n        cwd=root, capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", check=False,\n    )\n    return len(re.findall(r\"^.+:\\d+:\\d+: \", done.stdout, re.M))\n\n\nroot = pathlib.Path(__file__).resolve().parent\nconfig = root / \"pyproject.toml\"\nentry = '\"scripts/llm/utils.py\" = [\"RET505\"]'\ntext = config.read_text(encoding=\"utf-8\")\nassert entry in text, \"the carve-out entry is not present in pyproject.toml\"\nwith_carve = findings(root)\nconfig.write_text(text.replace(entry, '\"scripts/llm/utils.py\" = []'), encoding=\"utf-8\")\nwithout_carve = findings(root)\nconfig.write_text(text, encoding=\"utf-8\")\n\nworkflow = (root / \".github/workflows/deploy-prod-lambdas.yml\").read_text(encoding=\"utf-8\")\nblock = re.search(r\"^on:\\n(?:.*\\n)*?^\\s{4}paths:\\n((?:\\s{6}- .*\\n)+)\", workflow, re.M).group(1)\npatterns = [line.strip().lstrip(\"- \").strip(\"'\\\"\") for line in block.splitlines()]\nmatched = [p for p in patterns if fnmatch.fnmatch(\"scripts/llm/utils.py\", p)]\n\nprint(\"findings with the carve-out:\", with_carve)\nprint(\"findings without the carve-out:\", without_carve)\nprint(\"delta:\", without_carve - with_carve)\nprint(\"carved path matched by deploy push patterns:\", matched)\nraise SystemExit(0 if with_carve == 73 and without_carve == 74 and matched else 1)\nPROBE\ncd \"$C\" && ./.venv/bin/python carve_probe.py"
  expected: 'Four lines: findings with the carve-out 73, findings without it 74, delta 1, and a non-empty list of deploy push patterns matching the carved path, then exit zero. Re-measured 2026-09-05: with the entry present the tree reports 73 findings and the carved file reports that all checks passed; with the entry emptied the tree reports 74 and the carved file reports one RET505 on an unnecessary else after return.'
  fix_if: 'A delta greater than one means the carve-out is silencing more than the single sanctioned finding -- narrow the entry to the exact code, never widen it to a whole-file ignore. A delta of zero means the entry silences nothing and is dead configuration; remove it and re-derive why the finding did not appear. Counts of 0 with the carve-out and 1 without are NOT a carve-out defect and are not covered by the three branches above: they mean the clone carried the fixes, which can only happen if the implementer committed mid-run -- the same tell step 1''s fix_if names -- so re-run before committing rather than diagnosing the entry. An empty pattern list means the carved path is NOT on a deploy trigger, which removes the entire justification for the carve-out -- delete the entry and fix the finding in the file instead.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Mutates a scratch clone's config and compares two whole-tree counts, so it is multi-command and clone-scoped rather than a canonical primitive slot. The durable half of the property -- that the per-file-ignores table holds exactly the one sanctioned entry -- is graduated nowhere because it is already a standing pytest assertion in TestPerFileIgnoresAreExactlySanctioned, which the full tier collects on every run.
- step: 5
  phase: pre-deploy
  action: Firing proof for the six newly adopted families. One synthetic violation per family, written to a temporary directory and linted through this repository's own pyproject config, then deleted by the trap. Not one fixture is checked in. Introspecting the resolved config would prove only that the six strings parse -- wave A's FA is the standing counter-example of a family that parses, resolves, is non-preview, and still emits nothing.
  command: 'set -e; D=$(mktemp -d); trap ''rm -rf "$D"'' EXIT; printf ''x = dict()\n'' > "$D/c4.py"; printf ''x = 1\n# y = 2\n'' > "$D/era.py"; printf ''import numpy\n\nx = numpy\n'' > "$D/icn.py"; printf ''x = 1\n'' > "$D/inp.py"; printf ''def f(s: str) -> bool:\n    return s.startswith("a") or s.startswith("b")\n'' > "$D/pie.py"; printf ''def f(x: int) -> int:\n    if x:\n        return 1\n    else:\n        return 2\n'' > "$D/ret.py"; for spec in C4:C408:c4 ERA:ERA001:era ICN:ICN001:icn INP:INP001:inp PIE:PIE810:pie RET:RET505:ret; do fam=${spec%%:*}; rest=${spec#*:}; code=${rest%%:*}; stem=${rest##*:}; bin/venv-python -m ruff check --config pyproject.toml --no-cache --output-format=concise "$D/$stem.py" 2>&1 | grep -q " $code " && echo "FIRES $fam $code" || { echo "SILENT $fam $code"; exit 1; }; done'
  expected: 'Six lines, exit zero: FIRES C4 C408, FIRES ERA ERA001, FIRES ICN ICN001, FIRES INP INP001, FIRES PIE PIE810, FIRES RET RET505. Reproduced on 2026-09-04. Note that the INP fixture fires on any file in a directory without a package marker, so its body is not load-bearing -- the property it proves is that INP is selected, which is exactly what this step claims for it.'
  fix_if: A SILENT line means that family is named in select but is not driving the rule its fixture violates -- check the family spelling against the codes ruff itself reports and check the rule was not renamed between ruff releases. Never delete or weaken a fixture to obtain a FIRES line, and never add the fixture's path to per-file-ignores.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'NOT not-applicable. The property -- that each newly adopted family actually EMITS a rule rather than merely parsing -- is durable and a standing check plainly could hold it, so an inapplicable classification would be the classification-gaming shape plan-critique criterion 12o tests for. It is WAIVED because the standing guard already exists and is not this step: TestSelectedFamiliesAreLive in the pinning module holds exactly this property with a per-family firing fixture, and the full tier collects it on every run. This step is that guard''s shell-level rehearsal (mktemp plus a cleanup trap plus a six-arm loop), which is not a canonical single registry slot in any case; a row over it would make one guard declare itself examined twice.'
- step: 6
  phase: pre-deploy
  action: 'The rec-3572 mutation matrix, in a scratch clone: EIGHT arms, each of which asserts its own mutation actually landed before pytest is invoked and reports a mutation that did not apply as a DIFFERENT outcome from a mutant the assertions rejected (wave A''s matrix did neither, and rec-3573 records the result -- four arms returned RED regardless of the mutation, which coincidentally masked on the two RED-wanting arms; a bare str.replace no-ops silently, so an anchor that misses the implementation''s actual spelling would leave an arm RED for a reason it never tested). ADOPTED-NO-FIXTURE adds a family to select and to _ADOPTED_FAMILIES with no firing fixture and must go RED -- this is the exact mutation that left wave A''s module green at 13 passed, which is what rec-3572 records. EXEMPT-NO-TEST then tries to silence that red by declaring the family separately guarded and must ALSO go RED, closing the escape hatch. SELECT-ONLY adds a family to select ALONE -- no _ADOPTED_FAMILIES entry, no fixture -- and must go RED: that is the rec-3572 gap ONE LEVEL UP, closed in this revision by the second half of the coupling assertion, which requires every family named in select to be declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES, so a family that reaches select alone carries no firing evidence and cannot pass. SELECT-ONLY-RATCHET applies the SAME mutation but collects ONLY TestRuffSelectRatchet::test_adopted_and_preexisting_families_are_all_present and must stay GREEN -- that is what holds the membership ratchet at a SUPERSET assertion rather than converting it into an exact-equality change detector, which a later wave depends on. The two arms together say the whole thing: growing select obliges the PR that grows it to bring firing evidence, and it does so without the ratchet assertion itself becoming a change detector. IGNORES-GROW and IGNORES-GONE must both go RED. DROP-ERA must go RED. BASELINE must be GREEN.'
  command: "C=/tmp/ruff-wave-b/clone-mut; rm -rf \"$C\"; mkdir -p /tmp/ruff-wave-b; git clone --shared --quiet \"$PWD\" \"$C\" && ln -s \"$PWD/.venv\" \"$C/.venv\" && cp pyproject.toml \"$C/pyproject.toml\" && cp tests/checks/hygiene/test_pyproject_ruff_select.py \"$C/tests/checks/hygiene/test_pyproject_ruff_select.py\" && cat > \"$C/mutation_matrix.py\" <<'MATRIX'\nimport os\nimport pathlib\nimport re\nimport subprocess\nimport sys\n\nROOT = pathlib.Path(__file__).resolve().parent\nCONFIG = ROOT / \"pyproject.toml\"\nMODULE = ROOT / \"tests/checks/hygiene/test_pyproject_ruff_select.py\"\nCONFIG_BASE = CONFIG.read_text(encoding=\"utf-8\")\nMODULE_BASE = MODULE.read_text(encoding=\"utf-8\")\nCARVE = '\"scripts/llm/utils.py\" = [\"RET505\"]'\nMODULE_ID = \"tests/checks/hygiene/test_pyproject_ruff_select.py\"\nRATCHET_ID = MODULE_ID + \"::TestRuffSelectRatchet::test_adopted_and_preexisting_families_are_all_present\"\n\n\ndef edit(text: str, old: str, new: str, arm: str, what: str) -> str:\n    if old not in text:\n        raise ValueError(arm + \": the \" + what + \" mutation is a no-op -- its anchor is not in the file, so the arm \"\n                         \"would exercise nothing it claims to exercise\")\n    return text.replace(old, new, 1)\n\n\ndef build(arm: str) -> tuple[str, str]:\n    config, module = CONFIG_BASE, MODULE_BASE\n    if arm in (\"ADOPTED-NO-FIXTURE\", \"EXEMPT-NO-TEST\", \"SELECT-ONLY\", \"SELECT-ONLY-RATCHET\"):\n        config = edit(config, '\"SLOT\"', '\"SIM\", \"SLOT\"', arm, \"select-list\")\n    if arm in (\"ADOPTED-NO-FIXTURE\", \"EXEMPT-NO-TEST\"):\n        module = edit(module, '    \"SLOT\",', '    \"SIM\",\\n    \"SLOT\",', arm, \"_ADOPTED_FAMILIES\")\n    if arm == \"EXEMPT-NO-TEST\":\n        module, hits = re.subn(r\"(_SEPARATELY_GUARDED_FAMILIES[^=\\n]*=\\s*\\()\", '\\\\1\"SIM\", ', module, count=1)\n        if hits != 1:\n            raise ValueError(arm + \": the _SEPARATELY_GUARDED_FAMILIES mutation is a no-op -- the arm would not \"\n                             \"test the escape hatch it exists to close\")\n    if arm == \"IGNORES-GROW\":\n        config = edit(config, CARVE, CARVE + '\\n\"scripts/decisions_md.py\" = [\"PIE810\"]', arm, \"per-file-ignores-grow\")\n    if arm == \"IGNORES-GONE\":\n        config = edit(config, CARVE, \"\", arm, \"per-file-ignores-gone\")\n    if arm == \"DROP-ERA\":\n        config = edit(config, '\"ERA\", ', \"\", arm, \"select-drop-ERA\")\n    if arm != \"BASELINE\" and (config, module) == (CONFIG_BASE, MODULE_BASE):\n        raise ValueError(arm + \": no mutation took effect -- the arm degenerates into a second BASELINE\")\n    return config, module\n\n\nARMS = [\n    (\"BASELINE\", \"GREEN\", MODULE_ID),\n    (\"ADOPTED-NO-FIXTURE\", \"RED\", MODULE_ID),\n    (\"EXEMPT-NO-TEST\", \"RED\", MODULE_ID),\n    (\"SELECT-ONLY\", \"RED\", MODULE_ID),\n    (\"SELECT-ONLY-RATCHET\", \"GREEN\", RATCHET_ID),\n    (\"IGNORES-GROW\", \"RED\", MODULE_ID),\n    (\"IGNORES-GONE\", \"RED\", MODULE_ID),\n    (\"DROP-ERA\", \"RED\", MODULE_ID),\n]\nfailures = []\nfor arm, want, node in ARMS:\n    CONFIG.write_text(CONFIG_BASE, encoding=\"utf-8\")\n    MODULE.write_text(MODULE_BASE, encoding=\"utf-8\")\n    try:\n        config, module = build(arm)\n    except ValueError as exc:\n        print(\"NO-OP \" + arm, \"want=\" + want, \"got=MUTATION-DID-NOT-APPLY\", str(exc))\n        failures.append(arm)\n        continue\n    if arm != \"BASELINE\" and (config, module) == (CONFIG_BASE, MODULE_BASE):\n        print(\"NO-OP \" + arm, \"want=\" + want, \"got=MUTATION-DID-NOT-APPLY\", \"the arm wrote the base text back\")\n        failures.append(arm)\n        continue\n    CONFIG.write_text(config, encoding=\"utf-8\")\n    MODULE.write_text(module, encoding=\"utf-8\")\n    done = subprocess.run(\n        [sys.executable, \"-m\", \"pytest\", node, \"-q\", \"-p\", \"no:cacheprovider\", \"--randomly-seed=12345\"],\n        cwd=ROOT, capture_output=True, text=True, encoding=\"utf-8\", errors=\"replace\", check=False,\n    )\n    got = \"GREEN\" if done.returncode == 0 else \"RED\"\n    tail = [ln for ln in done.stdout.splitlines() if ln.startswith(\"FAILED\") or \" passed\" in ln or \" failed\" in ln]\n    print((\"OK \" if got == want else \"MISMATCH \") + arm, \"want=\" + want, \"got=\" + got, \"node=\" + node.split(\"::\")[-1],\n          \"|\", \"; \".join(tail[-3:]))\n    if got != want:\n        failures.append(arm)\nCONFIG.write_text(CONFIG_BASE, encoding=\"utf-8\")\nMODULE.write_text(MODULE_BASE, encoding=\"utf-8\")\nraise SystemExit(1 if failures else 0)\nMATRIX\ncd \"$C\" && ./.venv/bin/python mutation_matrix.py"
  expected: 'Eight lines, all beginning OK, in the order BASELINE GREEN, ADOPTED-NO-FIXTURE RED, EXEMPT-NO-TEST RED, SELECT-ONLY RED, SELECT-ONLY-RATCHET GREEN, IGNORES-GROW RED, IGNORES-GONE RED, DROP-ERA RED, then exit zero. Each line also prints the node id it collected and the pytest tail, so the reader sees WHICH assertion decided the colour. No line may begin NO-OP: that prefix is the matrix reporting got=MUTATION-DID-NOT-APPLY, a categorically different outcome from a RED the assertions produced, and it is a failure even when the arm would have gone the colour the matrix wanted. REHEARSED END TO END on 2026-09-04 in a scratch clone of 58afe0a carrying the target pyproject.toml and the extended pinning module: all eight arms report OK and the matrix exits zero. Per-arm failure text, read rather than assumed: ADOPTED-NO-FIXTURE and SELECT-ONLY both fail on TestRuffSelectRatchet::test_every_adopted_family_has_firing_evidence (1 failed, 21 passed) -- correctly, since that assertion carries both halves of the coupling; EXEMPT-NO-TEST fails on test_separately_guarded_families_each_own_a_dedicated_test (1 failed, 21 passed); IGNORES-GROW and IGNORES-GONE both fail on TestPerFileIgnoresAreExactlySanctioned (1 failed, 21 passed); SELECT-ONLY-RATCHET collects the one membership node and reports 1 passed; DROP-ERA is the one arm that reddens TWO assertions and correctly so, the membership ratchet and the ERA firing parameter (2 failed, 20 passed). THE NO-OP CHANNEL WAS REHEARSED TOO, on the same day and the same clone: respelling _SEPARATELY_GUARDED_FAMILIES as a frozenset call makes EXEMPT-NO-TEST report NO-OP EXEMPT-NO-TEST want=RED got=MUTATION-DID-NOT-APPLY while every other arm still reports OK, and the matrix exits 1 -- so a masked arm is visibly a different failure from a rejected mutant. ON AN UNMODIFIED CLONE the matrix exits 1 with five NO-OP lines (the anchors this unit creates are absent) and one MISMATCH on SELECT-ONLY, which comes back GREEN because the coupling assertion does not exist there yet.'
  fix_if: 'A NO-OP line names an arm whose mutation anchor is not in the file -- this is wave A''s masked-arm defect, the one rec-3573 records, and it is why every mutation here is checked before pytest runs and reported as got=MUTATION-DID-NOT-APPLY rather than as a colour. THE IMPLEMENTATION MOVES TO THE ANCHOR, NEVER THE ANCHOR TO THE IMPLEMENTATION. Editing this step''s command is not available as a recovery and this fix_if never directs one: docs/contracts/implement-scope-boundary.yaml lists verification_plan command edits verbatim under sanction_rows.implementing_plan_bookkeeping.prohibited_field_edits, its invariants.content enforcement_coverage marks that mechanical and enforced_by validate_scope_boundary on BOTH tiers (Decision 181 clause 1), so rewriting an anchor reddens the authoritative pre-merge gate instead of fixing anything. Rewrite the MODULE (or pyproject.toml) into the pinned form instead -- the scope rows spell all four out: _ADOPTED_FAMILIES exploded one entry per line at a four-space indent with a trailing comma (what ruff format produces at sixteen entries anyway, the one-line form measuring 146 characters against line-length 127), _SEPARATELY_GUARDED_FAMILIES as a parenthesised tuple assignment whose opening parenthesis sits on the same line as the name (a set literal, a frozenset call or a list makes the arm raise NO-OP), the per-file-ignores entry written exactly as the pyproject.toml scope row spells it, and the select list on ONE line. Never delete an arm or relax the check to get a clean matrix. A MISMATCH on ADOPTED-NO-FIXTURE means the coupling assertion is not reading the two module literals and rec-3572 is not discharged -- strengthen it, do not relax the arm. A MISMATCH on EXEMPT-NO-TEST means the exception list is an unguarded escape hatch. A MISMATCH on SELECT-ONLY (it came back GREEN) means the coupling''s select half is missing: the assertion must read the select list out of pyproject.toml and require every family there to be declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES, otherwise a family can reach select carrying no firing evidence at all and nothing fails -- which is the gap this unit exists to close. A MISMATCH on SELECT-ONLY-RATCHET (it came back RED) means the OPPOSITE mistake was made: the membership ratchet was converted into an exact-equality change detector and will break a later wave on a PR that never touched the test file -- put the select half in the coupling assertion, never in the membership assertion. A MISMATCH on either IGNORES arm means the carve-out can grow or vanish silently, which is the surface wave A named as its unenforced residual and this unit exists to close.'
