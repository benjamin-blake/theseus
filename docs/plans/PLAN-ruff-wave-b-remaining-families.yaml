  command: "bin/venv-python -c \"\nimport fnmatch, re, sys, yaml\nfrom pathlib import Path\nplan = yaml.safe_load(Path('docs/plans/PLAN-ruff-wave-b-remaining-families.yaml').read_text(encoding='utf-8'))\nscope = sorted({row['file'] for row in plan['scope']})\npatterns = []\nfor name in ('deploy-prod-lambdas.yml', 'deploy-ducklake-lambdas.yml'):\n    text = Path('.github/workflows', name).read_text(encoding='utf-8')\n    block = re.search(r'^on:\\n(?:.*\\n)*?^\\s{4}paths:\\n((?:\\s{6}- .*\\n)+)', text, re.M).group(1)\n    patterns += [line.strip().lstrip('- ').strip(chr(39) + chr(34)) for line in block.splitlines()]\ndef forbidden(f):\n    return f.startswith('src/') or any(fnmatch.fnmatch(f, p) or f.startswith(p.rstrip(chr(42)).rstrip('/') + '/') for p in patterns)\nhits = [f for f in scope if forbidden(f)]\ncarved = [p for p in patterns if fnmatch.fnmatch('scripts/llm/utils.py', p)]\nprint('deploy-trigger patterns parsed:', len(patterns))\nprint('declared scope rows:', len(scope))\nprint('scope rows under src or matching a deploy trigger:', hits)\nprint('patterns matching the carved path:', carved)\nsys.exit(0 if len(patterns) == 12 and len(scope) == 61 and not hits and carved else 1)\n\""
