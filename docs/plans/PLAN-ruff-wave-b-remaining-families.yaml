  command: bin/venv-python -m pytest "tests/checks/hygiene/test_pyproject_ruff_select.py::TestRuffSelectRatchet::test_every_adopted_family_has_firing_evidence" "tests/checks/hygiene/test_pyproject_ruff_select.py::TestRuffSelectRatchet::test_separately_guarded_families_each_own_a_dedicated_test" "tests/checks/hygiene/test_pyproject_ruff_select.py::TestPerFileIgnoresAreExactlySanctioned" -q -p no:cacheprovider --randomly-seed=12345 && bin/venv-python -m pytest tests/checks/hygiene/test_pyproject_ruff_select.py -q -p no:cacheprovider --randomly-seed=12345
  expected: 'Three named node ids collect and pass, then the whole module reports twenty-two passed, and the step exits zero. The first invocation names the three assertions this unit ADDS, so on a tree where the module was never updated pytest exits 4 with a not-found error instead of reporting a green thirteen -- measured both ways on 2026-09-04 (base: rc 4, not found; end state: 3 passed then 22 passed). The corresponding RED measurement, taken in a scratch clone whose pyproject.toml was reverted to the fourteen-family wave-A config while the new module was kept, is 8 failed and 14 passed: the membership ratchet, the six new firing parameters and the per-file-ignores pin all fail, while the firing-evidence coupling legitimately still passes because it compares two literals inside the module and does not read the config -- which is why step 6, not this step, is that assertion''s falsifier. The coupling''s SELECT half behaves the same way under that config and for the same reason: wave A''s fourteen families are all declared in _ADOPTED_FAMILIES or _PREEXISTING_FAMILIES, so nothing is undeclared and the assertion passes -- step 6''s SELECT-ONLY arm, which adds an undeclared family to select alone, is its falsifier. Re-measured 2026-09-04 with the select half present: 8 failed and 14 passed, the same eight assertions as before.'
  fix_if: A not-found error on any of the three named node ids means the module was not extended as the scope row describes -- add the assertion, never drop the node id from this step to obtain a green. A failing firing parameter means that family is named in select but not firing; see step 5. A failing membership assertion means pyproject.toml was not edited as the scope row describes. A collection error is an import fault in the module and is not evidence about the property under test.
