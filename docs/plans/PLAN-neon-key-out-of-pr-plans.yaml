schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "neon-key-out-of-pr-plans"
intent: >-  # pragma: allowlist secret -- describes key handling, no credential
  Stop PR-triggered Terraform plans from reading secret values. The Neon provider API key reaches Terraform only as an
  ephemeral input variable, so it is never in state or a saved plan. Trusted jobs fetch it at run time. PR speculative
  plans use a stub key and -refresh=false. The PR-sub planner session loses every unconditioned secret-value read except
  the tfvars secret: the Neon key and catalog DSN value reads stay only for the reserved drift session, and the GitHub PAT
  and inference-key value reads go. Executes rec-4618 (Critical) and rec-4616, and the direct-grant half of rec-4619.
  This is plan N1 of the credential-proxy workstream; the owner password in state stays for N3.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-neon-key-out-of-pr-plans.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4618 and
  rec-4616.
scope:
  - file: terraform/personal/neon_ducklake_catalog.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      Delete data "aws_secretsmanager_secret_version" "neon_api_key"; provider "neon" { api_key = var.neon_api_key }.
      Rewrite the PHASE 0 header and the data-source comment to say the key is an ephemeral input variable supplied per
      run (pointer to deploy-paths admin_out_of_band and secret-material-handling provider_credential_ephemeral_input).
      Keep the neon provider pin at 0.13.0 (main.tf untouched): the configure-time spike is valid for that version only.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: >-
      Add variable "neon_api_key" {type = string, ephemeral = true, sensitive = true, nullable = false, no default} with
      the description in context (approved texts, T1). Replace the comment at lines 52-55 ("The Neon provider API key is
      NOT a variable ...") with one line pointing at the variable.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      In ci_full_refresh_read: delete SecretsManagerNeonAPIKeyRead (nothing refreshes that secret once the data source is
      gone); rewrite SecretsManagerDuckLakeNeonDSNRead to metadata only, actions exactly
      ["secretsmanager:DescribeSecret", "secretsmanager:GetResourcePolicy"] (the DSN name does not match the
      agent-platform-* metadata prefix, so this statement is what keeps validate_ci_refresh_read_coverage green, Decision
      129 pt4 / 157); delete SecretsManagerGithubPatRead and SecretsManagerInferenceCredentialsRead outright (their
      secrets are agent-platform-* envelopes whose refresh needs metadata only, already covered by
      SecretsManagerMetadataRead; rec-4616). The tfvars value read stays (plan C).
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      In data "aws_iam_policy_document" "github_ci_planner", next to ConvergenceRecordWrite, add statement
      DriftSessionSecretValueRead: actions ["secretsmanager:GetSecretValue"], resources the neon-api-key-* and
      ducklake-neon-catalog-dsn-* ARNs (same var-built shape as today), condition StringLike aws:userid
      "*:${local.convergence_writer_session_name}" (reference the local, never the literal). Update the reserved-name
      coupled-site comment in oidc.tf locals (4 sites -> 5) and the header's capability-union comment. The policy
      resource name is unchanged (a rename is a replace and routes to gated apply).
  - file: scripts/ci/neon_api_key.sh
    action: Create
    purpose: >-
      Two subcommands. `fetch`: if GITHUB_EVENT_NAME is pull_request or pull_request_target, print
      "neon-api-key: skipped (PR plan uses a stub)" and exit 0; otherwise, with umask 077, write
      `aws secretsmanager get-secret-value --secret-id neon-api-key --query SecretString --output text` to
      "$RUNNER_TEMP/neon-api-key", fail closed on an empty result or a fetch error (one stderr line, no value), and emit
      ::add-mask:: for the value. The secret is a plain string; never JSON-parse. `run -- CMD...`: read that file (fail
      loud naming the fetch step if it is missing), delete it, export TF_VAR_neon_api_key in the script's own process only,
      and exec CMD. Never set -x, never echo the value, never write GITHUB_ENV or GITHUB_OUTPUT.
  - file: tests/ci/test_neon_api_key_sh.py
    action: Create
    purpose: >-
      Runs the real script with a stub `aws` on PATH and a temp RUNNER_TEMP: fetch skips on pull_request and
      pull_request_target without calling aws; fetch on push writes a 0600 file and prints exactly one ::add-mask:: line;
      an empty or failing fetch exits non-zero with no value in output; run exports TF_VAR_neon_api_key to the child,
      deletes the file before exec, and fails loud when the file is missing; no output line ever carries the stub value
      except the add-mask line.
  - file: .github/actions/terraform-init-retry/action.yml
    action: Modify
    purpose: >-
      Add a second thin-adapter step after init: `bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" fetch`. Every user
      of this action is a terraform/personal job, and tf_init runs on both gated-apply routes and is in every Decision 154
      pt4 pre-apply allow-list, so a failed fetch writes an infra_error marker rather than a red latch. In reconcile the
      action resolves from the red-commit checkout, so the fetch script and the Terraform config always come from the same
      tree (a pre-N1 red commit has neither the variable nor the script). Description updated.
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      Same effective-line count (550, at its budget; no raise): speculative-plan plan line becomes
      `TF_VAR_neon_api_key=pr-speculative-plan-stub-not-a-key terraform plan -refresh=false -lock=false -input=false
      -var-file=terraform.personal.tfvars -out=plan.bin`; the dispatch fresh plan line and both apply lines (apply-sandbox
      and gated-apply) gain the `bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run --` prefix in front of the
      command they already run (the stale_plan_signature.py wrapper stays). Comments only where the -refresh=false
      rationale is non-obvious (comment lines are not effective lines).
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      Same effective-line count (536, at its budget): the apply-reconcile saved apply, fresh re-plan and fresh apply
      lines, and the gated-apply-reconcile apply line gain the same `run --` prefix. The replan keeps refreshing.
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      The drift plan's terraform line gains the `run --` prefix; drift keeps refreshing (it is the drift control that
      -refresh=false PR plans now rely on).
  - file: scripts/checks/iam_tf/validate_planner_secret_value_reads.py
    action: Create
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      New check (pre=True, full_after_lint). Reuses validate_convergence_writer_isolation's HCL block and condition
      parsing and validate_invoke_implies_resolve._resolve_statements for source_policy_documents. Asserts: (1) every
      Allow statement in the planner's resolved policy whose actions can return a Secrets Manager value
      (secretsmanager:GetSecretValue, secretsmanager:Get*, secretsmanager:BatchGetSecretValue, secretsmanager:*, *)
      either carries the StringLike aws:userid "*:${local.convergence_writer_session_name}" condition or has every
      resource inside ALLOWED_UNCONDITIONED (the tfvars secret ARN only, with a comment naming plan C); (2) exactly one
      aws_iam_role_policy and zero aws_iam_role_policy_attachment resources target the planner role; (3) across
      .github/workflows/*.yml the reserved session name appears as a role-session-name value in terraform-drift.yml only;
      (4) in the personal-root workflows (terraform-apply-sandbox.yml, reconcile.yml, terraform-drift.yml) -refresh=false
      appears on the speculative-plan job's plan command and on no other terraform plan, and every other terraform plan
      or apply of the personal root runs through `neon_api_key.sh run --`; (5) no data "aws_secretsmanager_secret_version"
      block exists under terraform/personal. Declares examined() per Decision 170. Read-only, credential-free.
  - file: tests/checks/iam_tf/test_validate_planner_secret_value_reads.py
    action: Create
    purpose: >-
      Live-tree green case plus failing-first fixtures: an unconditioned GetSecretValue on a non-allow-listed ARN; Get* on
      the inference keys; a conditioned statement whose condition names a different session; a second planner role policy;
      a policy attachment; the reserved name in a second workflow; -refresh=false on the drift plan; a dispatch plan
      without the run prefix; the data source restored.
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: Register validate_planner_secret_value_reads (pre=True, full_segment full_after_lint), beside validate_convergence_writer_isolation.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row for validate_planner_secret_value_reads, in the same category as
      validate_convergence_writer_isolation (plan_obligations companion registration).
  - file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
    action: Modify
    purpose: >-
      A no-default variable that declares `ephemeral = true` at depth 0 must appear in the contract's new
      ephemeral_runtime_vars mapping and must NOT appear in where_values_live; the reverse (an ephemeral_runtime_vars entry
      the module no longer declares, or declares non-ephemeral) also fails. The five tfvars variables keep today's check.
  - file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    action: Modify
    purpose: >-
      Cases: an ephemeral no-default variable listed under ephemeral_runtime_vars passes; the same variable listed under
      where_values_live fails; an ephemeral variable missing from both fails; a stale ephemeral_runtime_vars entry fails.
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: >-
      Approved texts T2-T4 (context): new tfvars_and_remote_state_recovery.ephemeral_runtime_vars mapping (neon_api_key);
      the apply_posture sentence "New no-default variables only require updating that secret" amended; one
      speculative_plan_job step for the stub key and -refresh=false. One amendment_log entry.
  - file: docs/contracts/secret-material-handling.yaml
    action: Modify
    purpose: >-
      Approved texts T5-T6: new patterns.provider_credential_ephemeral_input and one domains line for the Neon key. One
      amendment_log entry.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Approved text T7: one new admin_out_of_band.procedure.steps entry (Decision 126/127 home of the local-apply loop);
      one amendment_log entry.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: Approved text T8 (NEON-05 target and rec); one amendment_log correction entry.
  - file: scripts/ducklake_smoke/canary.py
    action: Modify
    purpose: >-
      canary_rehearsal takes project_id (default from env NEON_PROJECT_ID); when set, skip neon_api.resolve_project_id
      (the only org-level calls, which a project-scoped key cannot make). Fail loud with a one-line hint when neither a
      project id nor a listable key is available. src/common/neon_api.py is NOT edited (it is packaged by the data-pipeline
      Lambda; branch create/delete are already project-scoped).
  - file: scripts/ducklake_neon_smoke_test.py
    action: Modify
    purpose: Add --project-id to the --canary-rehearsal CLI and pass it through.
  - file: tests/ducklake_neon_smoke_test/test_canary.py
    action: Modify
    purpose: >-
      Re-point the two resolve_project_id stubs; add a case where an explicit project id means resolve_project_id is
      never called, and a CLI case that --project-id reaches canary_rehearsal.
bundled_recommendations:
  - rec-4618
  - rec-4616
followon_recs: []
infrastructure_dependencies:
  - >-
    terraform/personal apply via the governed CI path only (Decision 126): the merge applies the PR's saved plan (one
    in-place update of aws_iam_role_policy.github_ci_planner; the orphaned neon_api_key data-source entry leaves state).
    The planner inline-policy UPDATE is in budget on a managed boundary-carrying role (Decision 144 pt5), so the guard
    verdict is expected PASS (auto-apply). Any trust change, replace, or ROUTE verdict means something crept in: stop.
  - >-
    The apply role (terraform/bootstrap, admin-only) already holds GetSecretValue on neon-api-key-* and the DSN; no
    bootstrap change. Its comment at github_ci_apply_reads.tf:161-167 goes stale (consumer becomes the CLI fetch) and is
    left for Plan B's bootstrap apply, so this plan carries no admin-root edit.
  - >-
    Ordering: the PR's own speculative plan runs the OLD planner policy with the NEW HCL and workflow (stub,
    -refresh=false, no fetch on pull_request), so no grant is needed pre-merge; after the apply the hourly drift run reads
    both values through the conditioned statement.
acceptance_criteria:
  - >-
    terraform/personal declares neon_api_key as ephemeral, sensitive, non-nullable with no default; the neon provider
    reads it; no data "aws_secretsmanager_secret_version" exists under terraform/personal.
  - >-
    The planner's resolved policy has no unconditioned secret-value read except the tfvars secret; the Neon key and DSN
    value reads carry the reserved-session aws:userid condition; the DSN keeps an unconditioned metadata-only statement;
    the GitHub PAT and inference-key Sids are gone.
  - >-
    PR speculative plans pass a stub key and -refresh=false; every other personal-root plan refreshes; every trusted
    personal-root plan and apply receives the real key through neon_api_key.sh run, fetched inside tf_init.
  - >-
    validate_planner_secret_value_reads is registered (pre) and fails each fixture listed in its test module.
  - >-
    validate_terraform_cc_web_operations accepts neon_api_key only under ephemeral_runtime_vars.
  - The approved contract texts T2-T8 are in place verbatim.
  - The canary rehearsal runs with an explicit project id and never calls the org-level project listing.
  - >-
    Post-deploy: the N1 PR's speculative plan and the merge apply are green; the next drift run is green; state holds no
    data.aws_secretsmanager_secret_version.neon_api_key address; IAM simulation gives implicitDeny on both value reads for
    a PR-style session and allowed for the reserved session.
  - >-
    Post-deploy: Benjamin's second Neon re-mint is proven by a green drift run and a canary rehearsal before the interim
    key is revoked (or recorded unproven).
  - The full tier exits 0 on the committed, rebased, clean tree before the PR is opened.
  - After the squash-merge with the Resolves trailer, rec-4618 and rec-4616 are closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new check's tests (live tree green, every fixture red).
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_planner_secret_value_reads.py tests/checks/iam_tf/test__manifest.py -q
    expected: exit 0; every test passes. Before the change the new module does not exist, so collection fails.
    fix_if: >-
      The live-tree case fails -- a planner statement still grants an unconditioned value read; fix the HCL, never widen
      ALLOWED_UNCONDITIONED (only Benjamin can add to it).
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: planner-secret-value-reads
  - step: 2
    phase: pre-deploy
    action: Run the key helper tests (skip on PR events, fail-closed fetch, mask, run-and-delete).
    command: bin/venv-python -m pytest tests/ci/test_neon_api_key_sh.py -q
    expected: exit 0; every test passes. Before the change the script does not exist.
    fix_if: >-
      The stub value appears in any output line other than the add-mask line -- the script leaks; fix the script, never
      the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: neon-api-key-helper
  - step: 3
    phase: pre-deploy
    action: Run the CC-web operations contract validator tests including the new ephemeral cases.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py -q
    expected: exit 0; the new ephemeral cases pass (before the change they fail or do not exist).
    fix_if: >-
      The live-tree case fails on neon_api_key -- the contract mapping is missing or neon_api_key was put in
      where_values_live; never add it to the tfvars secret.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: cc-web-ops-ephemeral-vars
  - step: 4
    phase: pre-deploy
    action: Run the canary tests (explicit project id skips the org-level lookup; CLI pass-through).
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_canary.py -q
    expected: exit 0; every test passes.
    fix_if: resolve_project_id is still called with a project id set -- the skip is wrong.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: canary-explicit-project-id
  - step: 5
    phase: pre-deploy
    action: >-
      Grep proofs: the data source is gone, the variable is ephemeral, the stub and -refresh=false appear exactly once (the
      speculative plan), and the oidc.tf value Sids are gone.
    command: >-
      ! grep -rEq '^data "aws_secretsmanager_secret_version"' terraform/personal/
      && grep -A6 'variable "neon_api_key"' terraform/personal/variables.tf | grep -q 'ephemeral *= *true'
      && test "$(grep -c -- '-refresh=false' .github/workflows/terraform-apply-sandbox.yml .github/workflows/reconcile.yml .github/workflows/terraform-drift.yml | awk -F: '{s+=$2} END {print s}')" -eq 1
      && ! grep -Eq 'SecretsManagerNeonAPIKeyRead|SecretsManagerGithubPatRead|SecretsManagerInferenceCredentialsRead' terraform/personal/oidc.tf
      && echo GREP_OK
    expected: Prints GREP_OK.
    fix_if: A count other than 1 -- a comment line carries the literal; reword the comment.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Every condition here is asserted permanently by validate_planner_secret_value_reads (step 1); this step is the
      readable pre-commit replay.
  - step: 6
    phase: pre-deploy
    action: Size budgets hold with no raise (the two workflows sit exactly at budget) and the planner policy fits.
    command: >-
      bin/venv-python -c "from scripts.checks.structural.size_limits import validate_structural_size_limits as a; from scripts.checks.iam_tf.validate_iam_policy_size import validate_iam_policy_size as b; from scripts.checks.sloc.sloc_limits import validate_sloc_limits as c; f=[]; [g(f) for g in (a, b, c)]; print('SIZE_FAILS', len(f)); assert not f, f"
    expected: exit 0.
    fix_if: >-
      A workflow is over budget -- move a prefix onto the existing line or extract an inline body to a delegate script
      (the ci_workflows relief valve); never raise the budget (needs a Decision).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Confirm no Lambda artifact packages any scope file (src/common/neon_api.py is deliberately untouched).
    command: bin/venv-python -c "import yaml; from scripts.lambda_manifest import compute_affected_artifacts as c; files=[r['file'] for r in yaml.safe_load(open('docs/plans/PLAN-neon-key-out-of-pr-plans.yaml'))['scope']]; hit=c(files); print('AFFECTED', len(hit)); assert not hit"
    expected: Prints AFFECTED 0; exit 0.
    fix_if: An artifact is affected -- revert the edit to the packaged file; a governed Lambda deploy is out of scope.
    hermetic: true
    expected_literals: ["AFFECTED 0"]
    graduation: waive
    graduation_waiver_reason: >-
      Scope-membership assertion for this plan only; validate_lambda_deploy_gating already gates Lambda-packaged changes
      permanently in CI.
  - step: 8
    phase: pre-deploy
    action: rec-4618's amended acceptance (set via update_rec in execution step 1) and rec-4616's acceptance, verbatim.
    command: >-
      ! grep -Eq '^data "aws_secretsmanager_secret_version" "neon_api_key"' terraform/personal/neon_ducklake_catalog.tf
      && bin/venv-python -m pytest tests/checks/iam_tf/test_validate_planner_secret_value_reads.py -q
      && ! grep -q 'agent-platform-anthropic-api-key' terraform/personal/oidc.tf && ! grep -q 'agent-platform-deepseek-api-key' terraform/personal/oidc.tf && ! grep -q 'agent-platform-github-pat' terraform/personal/oidc.tf
    expected: exit 0.
    fix_if: A grep hit in oidc.tf -- a comment still names the secret; reword it.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Replays the two recs' closure oracles; steps 1 and 5 assert the same conditions permanently.
  - step: 9
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in this plan's scope is fixed on the branch; never skip a test, relax an assertion, or add a baseline,
      allowlist or budget entry. A failure outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      On the open PR: the speculative-plan job (PR head, old planner policy) is green and its PR comment shows exactly one
      in-place update to aws_iam_role_policy.github_ci_planner and a predicted guard verdict PASS. Read from the PR
      comment and the run, via the GitHub MCP tools.
    command: >-
      CI-delegated (Decision 119): read the terraform-apply-sandbox speculative-plan job conclusion and its PR comment with
      mcp__github__ tools; record the run URL, the "N to change" count and the predicted verdict on the PR.
    expected: Job success; 0 to add, 1 to change, 0 to destroy; predicted verdict PASS; no trust-policy or replace line.
    fix_if: >-
      The plan fails on a Neon refresh -- -refresh=false did not reach the command. A ROUTE verdict or a trust change --
      stop and report; do not merge.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: The merge-time apply-sandbox run applied the saved plan with the real key; the convergence record is green.
    command: >-
      CI-delegated: read the push run of terraform-apply-sandbox for the merge commit with mcp__github__ tools; record its
      URL and the apply step conclusion.
    expected: apply step success; record_write green; no infra_error marker.
    fix_if: >-
      An infra_error from tf_init naming neon-api-key -- the apply role fetch failed; read the one stderr line. A provider
      401 -- the run prefix is missing on the apply line. Fix forward on a new PR (Decision 226), never by hand.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      The next scheduled drift run (hourly at :17) after the apply is green, proving the conditioned value reads, the DSN
      metadata read and the DSN version refresh under the reserved session.
    command: >-
      CI-delegated: read the first terraform-drift run created after the step 11 apply with mcp__github__ tools; record its
      URL and conclusion.
    expected: success with plan exit 0.
    fix_if: >-
      AccessDenied on GetSecretValue or DescribeSecret -- the statement shape is wrong; fix forward on a new PR. Never
      widen the condition.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Live, read-only, ADMIN container: IAM simulation of the planner role. A PR-style session gets implicitDeny on both
      value reads; the reserved session gets allowed. Output is reduced to decision strings; no ARN or account id is
      printed.
    command: >-  # pragma: allowlist secret -- describes key handling, no credential
      A=$(aws sts get-caller-identity --profile agent_platform_admin --query Account --output text);
      R=$(tr -d '[:space:]' < config/aws-region);
      ROLE="arn:aws:iam::$A:role/agent-platform-github-ci-planner";
      ID=$(aws iam get-role --role-name agent-platform-github-ci-planner --profile agent_platform_admin --query Role.RoleId --output text);
      for s in neon-api-key-x ducklake-neon-catalog-dsn-x; do for sess in terraform-plan-pr tf-drift-convergence-writer; do
      echo "$s $sess $(aws iam simulate-principal-policy --profile agent_platform_admin --policy-source-arn "$ROLE" --action-names secretsmanager:GetSecretValue --resource-arns "arn:aws:secretsmanager:$R:$A:secret:$s" --context-entries "ContextKeyName=aws:userid,ContextKeyValues=$ID:$sess,ContextKeyType=string" --query 'EvaluationResults[0].EvalDecision' --output text)"; done; done
    expected: >-
      Four lines: both secrets with terraform-plan-pr read implicitDeny; both with tf-drift-convergence-writer read
      allowed. The account id is read into a shell variable only (an exit-code-and-account read, allowed by the
      scripts/aws_identity.py docstring rule).
    fix_if: >-
      allowed for terraform-plan-pr -- an unconditioned statement survives in the live policy (the apply did not land, or
      a second policy exists); stop and report to Benjamin.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      Live, read-only, ADMIN container: the state holds no Neon key data-source address (addresses only, never values).
    command: >-
      N=$(aws s3 cp s3://agent-platform-data-lake/tfstate/personal/sandbox/terraform.tfstate - --profile agent_platform_admin --region "$(tr -d '[:space:]' < config/aws-region)"
      | jq -r '.resources[] | select(.mode=="data" and .type=="aws_secretsmanager_secret_version") | .name' | wc -l); test "$N" -eq 0 && echo STATE_CLEAN || echo "STATE_HAS_DATA_SOURCE $N"
    expected: Prints STATE_CLEAN. The state body stays in the pipe; only a count is printed (no local terraform init, Decision 119).
    fix_if: >-
      The address is present -- the apply did not run or failed; read step 11. Never edit state by hand.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      Benjamin's second Neon re-mint (handoff runbook): new project-scoped key written to neon-api-key, then proof before
      the interim key is revoked -- a dispatched drift run and a canary rehearsal with the project id.
    command: >-
      CI-delegated drift: dispatch terraform-drift with mcp__github__actions_run_trigger and read its conclusion. Canary
      (ADMIN, Benjamin's word first): bin/venv-python -m scripts.ducklake_neon_smoke_test --canary-rehearsal --project-id "$NEON_PROJECT_ID" --profile agent_platform_admin
    expected: Drift success with the new key; canary PASS. Only then Benjamin revokes the interim key, and the next drift run is green.
    fix_if: >-
      Drift 401/403 on a neon_* refresh -- the project-scoped key does not cover a managed resource; keep the interim key,
      tell Benjamin, record the failing resource. The canary failing on branch create -- record it; it does not block the
      revoke of the org-admin key that is already gone.
    hermetic: false
    graduation: not-applicable
