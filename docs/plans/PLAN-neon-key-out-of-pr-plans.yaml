constraints:
  - >-
    Never bypass CI from the ADMIN container: the personal-root apply is the merge's governed apply only. Admin
    credentials are used only for the read-only steps 13 and 14; any admin write (the re-mint's put-secret-value) needs
    Benjamin's word on the exact command.
  - >-
    Never print, log, comment, or store a secret value, account id or ARN (Decision 101); never set -x or TF_LOG in a
    step that holds the key; never write the key to GITHUB_ENV, GITHUB_OUTPUT, a tfvars file, or the tfvars secret.
  - >-
    No budget raise: the two at-budget workflows keep their effective-line counts; config/structural_size_budgets.yaml is
    not in scope.
  - >-
    Plan A rule: identity-dependent STS calls avoid the eu-west-2 host and ENVIRONMENT CHECKs use scripts/aws_identity
    caller-arn; step 13 reads only the account id (exempt class).
  - Approved contract texts are copied verbatim; any wording change goes back to Benjamin.
  - Out-of-scope findings become recs (Decision 59); no rescue agents or workaround loops (Decision 55).
