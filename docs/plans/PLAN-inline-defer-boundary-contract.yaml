schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "inline-defer-boundary-contract"
intent: >-
  Discharge the standing Decision 59 (2026-05-01) commitment that "scope guard becomes a
  deterministic diff-vs-plan check": give the already-stated scope rule a machine-parseable home, an
  implement-time deviation trigger, and an executable diff-vs-declared-scope check, with the
  content invariant's enforcement coverage declared rather than implied.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-inline-defer-boundary-contract.yaml
phase: >-
  Platform governance hardening -- scope-boundary enforcement (deferred half of
  PLAN-pr-ci-red-ownership, PR #986). Soft-warn exception category ad_hoc_rec (rec-3332 items
  2-4), so the Tier Item Freshness Gate is skipped; no tier_item slice, closes no criterion.
scope:
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Create
    purpose: >-
      Class D contract (subject implement-scope-boundary, status provisional_v0, evaluator
      {check: validate_scope_boundary}) holding the two invariants, the CONTENT invariant's
      enforcement-coverage map with its named residual, the conditional sanction rows, and the
      three-branch deviation trigger.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      register the new contract's route (topic must equal the contract's subject) AND add the
      dated amendment_log entry contract-population.yaml's change_detection.amendment_log
      requires for any Class D canonical-dump change
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 181 -- the CONTENT invariant as a standing prohibition plus the declare-your-coverage discipline
  - file: AGENTS.md
    action: Modify
    purpose: point the Safety scope bullet at the contract; recover bytes from the dead T-1.13 sentence
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: add the deviation trigger; collapse the Pre-Push Rebase restatement into a pointer
  - file: scripts/checks/verification/validate_scope_boundary.py
    action: Create
    purpose: the diff-vs-declared-scope enforcement check (Decision 59's deterministic scope guard)
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: bare-string-literal Entry registering the new check in the pre and full tiers
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check
  - file: tests/checks/verification/test_validate_scope_boundary.py
    action: Create
    purpose: mirror test for the check module
  - file: tests/test_scope_boundary_contract.py
    action: Create
    purpose: contract test over the prose, contract, and Decision surfaces
  - file: tests/test_pr_ci_red_protocol_contract.py
    action: Modify
    purpose: >-
      re-point ALL FOUR assertions derived from the never-weaken sentence -- the substring assert,
      the two coverage asserts on "VP step" and "budget" (which become permanently-true claims
      about a rule the file no longer contains, since both substrings occur elsewhere in the
      skill), and the full-literal negative case -- at the contract pointer that replaces it.
      Without this the relocation reds the tier, the self-hosting step fails on an undeclared
      path, and the plan installing the honesty discipline ships two vacuous assertions
bundled_recommendations: ["rec-3332"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/implement-scope-boundary.yaml is a Class D contract whose evaluator
    {check: validate_scope_boundary} resolves under contract-population.yaml's evaluator_kinds
    grammar (Decision 168): the check is a member of BOTH registry.pre_sequence() and
    registry.full_sequence(), and the contract's basename appears as an executable-context
    string literal in the check module because the check genuinely reads the contract at check
    time and holds no second copy of the row map. The check exposes `plan_paths`, `changed_files`
    and `root` overrides (the validate_plan_scope_closure precedent, accepted UNFILTERED) so
    fixtures and the self-hosting step can dispatch the enforcing leg directly rather than
    depending on ambient `implementation_declared` state.
  - >-
    The contract is the CANONICAL statement of both invariants -- LOCATION (touched files subset
    of the resolved plan's declared scope union contract-derived companions, citing Decision 59 as
    its authority) and CONTENT (no weakening of an acceptance criterion, VP step, assertion, or
    budget to obtain green; weakening routes to a rec whatever file it lives in) -- and its
    sanction rows are conditional trigger -> derived-path + prohibited-content rows, never a flat
    path allowlist. Decision 181 CITES the contract's clause rather than restating it (the
    Decision 162 / composite-action-shape.yaml pattern), and
    tests/test_scope_boundary_contract.py pins the two surfaces against divergence.
  - >-
    The CONTENT invariant carries an explicit enforcement-coverage map naming, per surface, the
    check that ACTUALLY enforces it or the fact that it is an unenforced residual agent
    obligation. Attribution is exact: the plan-field arm AND the VP-step-substitution arm are both
    enforced by this plan's own prohibited-plan-field-edit row (validate_vp_replay replays the
    plan's CURRENT steps and holds no base-version comparison, so it cannot catch a weakened step
    -- its real contribution, catching a self-reported-but-false pass, is described as such); the
    budget arm names all three raise guards (validate_prose_budget_raises,
    validate_sloc_budget_raises, validate_structural_size_budget_raises). The one residual arm
    (an assertion or numeric tolerance weakened inside an in-scope source or test file) names the
    open rec that owns it and is stated to be the DOMINANT form of weakening, not one row among
    peers -- and it is the SOLE residual row, so VP step 4's owner assertion has exactly one
    subject. The R6 split's own residual (only the PRESENCE of Decision 181's pointer is pinnable;
    a paraphrase re-inlined into the Decision's body stays an agent obligation) is recorded in a
    separate `known_residuals:` note, NOT as a CONTENT coverage row -- Decision-181 paraphrase
    drift is not one of the CONTENT invariant's surfaces. The contract never presents CONTENT as an unqualified binary invariant behind a
    location-only evaluator.
  - >-
    validate_scope_boundary FAILS an implement-leg diff touching a path outside (declared scope
    union derived sanctions) naming that path, FAILS a prohibited plan-field edit, DEFERS a
    plan-only PR, and declares skipped when origin/main is unreachable. Deleted paths are named
    as a known gap in the contract: get_changed_files existence-filters them out and only
    get_status_aware_diff carries "D" rows, so the seam choice decides whether a deletion is even
    visible. Its green counterpart is
    exercised in the FIXTURE only -- a fixture whose base already declares the path passes --
    because in the live flow an undeclared path is a STOP, never a scope edit (see AC 11).
  - >-
    All seven registration surfaces from scripts/checks/registry.py's enumeration are satisfied,
    including surface (7): the check declares examined()/skipped() on every reachable exit path
    per docs/contracts/check-accounting.yaml (Decision 170), so it needs no
    config/check_accounting_baseline.yaml entry.
  - >-
    .claude/skills/implement/SKILL.md carries a three-branch deviation trigger that cites (never
    restates) the existing 3-fix-attempt STOP and VF-08 rules, points at the overseer skill's
    Fable Advice-Consult Protocol, and adds no auto-file-a-rec path.
  - >-
    AGENTS.md's "## Safety" scope bullet points at the contract; neither it nor the planning
    skill's plan-template scope line is restated anywhere new.
  - >-
    docs/DECISIONS.md carries `## Decision 181:` with a fenced yaml metadata envelope
    (required_fields [number, significance]; significance {value: numbered_decision,
    justification}) whose justification names BOTH rejected alternatives -- the
    implement-scope-boundary.yaml contract home, and a dated amendment_forms annotation on
    Decision 163 (property test 3, rec-3016) -- and stated reversal conditions; the entry is
    under decision-entry.yaml's 6144-byte per-entry cap and is backfilled to ops_decisions.
  - >-
    No entry in config/prose_budgets.yaml, config/sloc_budgets.yaml, or
    config/structural_size_budgets.yaml is raised or added, and the new contract stays inside the
    contracts class's 500-effective-line and 2000-character-line limits (Decision 166).
  - >-
    An undeclared touched path has exactly ONE disposition, stated identically in all three places
    that speak to it (the contract's implementing_plan_bookkeeping row, the check's failure
    guidance, and the deviation trigger's branch (b)): the implementing agent STOPs. Adding a
    scope row to the merged plan is a prohibited plan-field edit, so the check can never be
    silenced by a one-line edit to the artefact it audits. The recorded escape is a
    human-directed plan amendment landed as its own reviewed act -- never a unilateral append.
  - >-
    rec-3332 closes via the Resolves trailer, and two successor recs exist in the warehouse: one
    for its still-deferred item 1 (pre_globs widening, blocked on the Decision 128 decomposition
    of scripts/verify_ci_workflow.py) and one owning the CONTENT invariant's residual arm.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-contract-evaluator-resolves
    action: >-
      Assert the new contract is a Class D envelope whose {check: validate_scope_boundary}
      evaluator genuinely resolves -- registered in BOTH tiers, with the contract basename present
      as an executable-context literal in the check module (Decision 168 clause 2).
    command: >-
      bin/venv-python -c "import yaml,pathlib;from scripts.checks import
      registry;c=yaml.safe_load(pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text())['contract'];assert
      c['class']=='D' and c['subject']=='implement-scope-boundary' and
      c['status']=='provisional_v0',c;assert
      c['evaluator']=={'check':'validate_scope_boundary'},c['evaluator'];n=lambda
      s:{getattr(x,'name',x) for x in s};assert 'validate_scope_boundary' in
      n(registry.pre_sequence()) and 'validate_scope_boundary' in
      n(registry.full_sequence());from scripts.checks.contracts._population import
      module_contains_literal;assert
      module_contains_literal(pathlib.Path('scripts/checks/verification/validate_scope_boundary.py'),'implement-scope-boundary.yaml'),'basename
      absent from EXECUTABLE context';print('contract-evaluator-resolves OK')"
    expected: 'prints `contract-evaluator-resolves OK` and exits 0'
    fix_if: >-
      The AssertionError names the failing clause -- a wrong class/subject/status, a non-resolving
      evaluator, a missing manifest Entry (so the check is absent from one tier), or a basename
      literal that lives only in a docstring -- module_contains_literal is the same
      docstring-excluding AST scan validate_contract_drift itself applies, so a substring a raw
      grep accepts can still fail here.
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-rejects-unsanctioned-path
    action: >-
      Run the mirror test: the check must FAIL a fixture implement-leg diff touching an undeclared
      path, FAIL a prohibited plan-field edit, PASS once the path is declared, DEFER a plan-only
      diff, PASS vacuously with no plan in the diff, and declare skipped on an unreachable base.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_scope_boundary.py -q
    expected: all tests pass, exit 0, no tests skipped
    fix_if: >-
      A failing red-case test means the check does not discriminate; a failing green-case test
      means a sanction row is missing or its derivation is wrong. Fix the check or the row, never
      the assertion.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-prose-surfaces-carry-the-rule
    action: >-
      Run the prose/contract test: AGENTS.md points at the contract, the implement skill's
      deviation trigger carries all three branches plus the Fable pointer, the contract declares
      both invariants and the CONTENT enforcement-coverage map with its named residual, and the
      file-router route topic equals the subject. Runs the pre-existing implement-skill contract
      test in the same invocation, since it is the other half of the relocation assertion.
    command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py tests/test_pr_ci_red_protocol_contract.py -q
    expected: all tests pass, exit 0
    fix_if: >-
      A red assertion names the surface that lost its pointer, branch, or coverage row. Restore
      the surface; never relax the assertion. A red in the pr-ci-red contract test means the
      relocation left that file still pinning the retired inline sentence -- re-point it at the
      contract pointer rather than restoring the sentence.
  - step: 4
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-content-coverage-residual-named
    action: >-
      Assert the CONTENT invariant is declared with an enforcement-coverage map in which every
      row either names an enforcing check or is explicitly marked a residual agent obligation
      carrying an owning rec id -- the Decision 163 point 2 honesty requirement.
    command: >-
      bin/venv-python -c "import
      yaml,pathlib,re;d=yaml.safe_load(pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text());rows=d['invariants']['content']['enforcement_coverage'];assert
      rows,'no coverage rows';res=[r for r in rows if r.get('status')!='mechanical'];assert
      all(r.get('enforced_by') for r in rows if r.get('status')=='mechanical'),'mechanical row
      without an enforcer';assert all(re.match(r'^rec-\d+$',str(r.get('residual_owner','')))
      for r in res),'residual row without an owning rec id:
      '+str(res);print('coverage rows:',len(rows),'residual:',len(res))"
    expected: 'prints a non-zero coverage-row count and a residual count, and exits 0'
    fix_if: >-
      A mechanical row with no enforcer, or a residual row with no owning rec id -- file the rec
      first, then name it. Never delete a residual row to make this pass; that re-hides the gap.
  - step: 5
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-decision-181-envelope-present
    action: >-
      Assert Decision 181 landed with the Significance envelope decision-entry.yaml requires
      (routing key plus justification) and stated reversal conditions.
    command: >-
      bin/venv-python -c "import
      re,yaml,pathlib;F=chr(96)*3;t=pathlib.Path('docs/DECISIONS.md').read_text();m=re.search(r'(?ms)^## Decision
      181:.*?(?=^## Decision |\Z)',t);assert m,'Decision 181 header
      absent';b=m.group(0);i=b.find(F+'yaml');assert i>=0,'no fenced yaml metadata
      envelope';env=yaml.safe_load(b[i+7:b.find(F,i+4)]);assert env.get('number')==181,'envelope
      number mismatch';sig=env.get('significance') or {};assert
      sig.get('value')=='numbered_decision',sig;jz=str(sig.get('justification') or '');assert
      'implement-scope-boundary.yaml' in jz and 'amendment' in jz.lower(),'justification must
      name BOTH rejected alternatives';assert 'eversal' in b,'no reversal conditions';assert
      len(b.encode())<=6144,'over cap: '+str(len(b.encode()));print('decision-181 entry
      bytes:',len(b.encode()))"
    expected: 'prints the entry byte count at or under 6144 and exits 0'
    fix_if: >-
      A missing envelope field, routing claim, rejected-alternative clause, or reversal clause --
      author it per docs/contracts/decision-entry.yaml's metadata_envelope.required_fields
      ([number, significance]) and field_shapes.significance ({value, justification}). Over the
      cap -- move detail into the contract, never raise the cap.
  - step: 6
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This asserts a property of THIS PR's own working-tree diff, which does not exist in the
      differential-admission revert worktree -- the check module is absent there, so the command
      would fail for the wrong reason and be admitted on a false signal (exactly the defect #994
      repaired). The standing regression guard for the same behavior is step 2's fixture-driven
      mirror test, which is graduated.
    action: >-
      Self-hosting run: dispatch validate_scope_boundary against this PR's real diff and confirm
      it is green -- this plan's own scope table must satisfy the boundary it installs. The
      dispatch MUST pass an explicit plan_paths override (the validate_plan_scope_closure
      precedent) plus an explicit changed_files list: the Live Verification Protocol is Workflow
      Step 4 and `implementation_declared` is not set until Commit Flows Step 7, so an ambient
      dispatch here resolves no plan, takes the DEFER leg, and prints a green it cannot fail. Row
      (c) is genuinely exercised here (docs/decisions-index.json already exists); row (a)'s seven
      graduated shards are written by the graduation walk AFTER this gate, so they are exercised
      at the commit-flow `validate --pre`, not here.
    command: >-
      bin/venv-python -c "import subprocess;from pathlib import Path;from scripts.checks import
      registry;cf=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True).stdout.split();f=[];registry.resolve('validate_scope_boundary')(f,plan_paths=[Path('docs/plans/PLAN-inline-defer-boundary-contract.yaml')],changed_files=cf);print('FAILURES:',f);raise
      SystemExit(1 if f else 0)"
    expected: 'prints `FAILURES: []` and exits 0'
    fix_if: >-
      A named path means the plan under-declared. Do NOT add a scope row -- that is a prohibited
      plan-field edit, and a check an agent can silence by editing the artefact it audits is not a
      check. STOP per deviation-trigger branch (b) and surface it; the human either directs a plan
      amendment as its own reviewed act, or (if the path is an implement-time derived companion
      the contract does not yet model) directs a conditional sanction row carrying its trigger and
      prohibited content. Never widen a row into a bare path allowlist.
  - step: 7
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts an invariant this PR does not change (no budget value is edited), so the command
      returns identical output in the revert worktree and cannot discriminate -- it would
      correctly fail differential admission. Retained as the plan-time budget guard.
    action: >-
      Confirm the prose budgets still hold with NO budget-registry edit anywhere: bytes were
      recovered, not bought.
    command: >-
      bin/venv-python -c "import
      subprocess,sys;d=subprocess.run(['git','diff','origin/main','--','config/prose_budgets.yaml','config/sloc_budgets.yaml','config/structural_size_budgets.yaml'],capture_output=True,text=True).stdout;assert
      not d.strip(),'budget registry edited';from scripts.checks import
      registry;f=[];registry.resolve('validate_prose_limits')(f);print('FAILURES:',f);sys.exit(1
      if f else 0)"
    expected: 'prints `FAILURES: []` and exits 0; no diff against origin/main in any budget registry'
    fix_if: >-
      Over budget -- recover more bytes by collapsing another restatement of a declared canonical
      authority (AGENTS.md `## Git-ops procedure` is the git-ops authority; the implement skill's
      `### Wait-for-CI` section is the in-file precedent for the pointer form). Never raise a
      budget entry.
  - step: 8
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an already-enforced gate: config/structural_size_budgets.yaml's `contracts` class
      governs every docs/contracts/*.yaml at exactly these two limits via
      validate_structural_size_limits, which runs in the tier anyway, and step 1 already guards
      the file's shape. Graduating it would install a second standing check over one property.
    action: >-
      Confirm the new contract stays inside the contracts class's 500-effective-line limit AND its
      2000-character long-line companion (Decision 166), so it needs no roster registration.
    command: >-
      bin/venv-python -c "import
      pathlib;ls=pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text().splitlines();n=sum(1
      for l in ls if l.strip() and not l.lstrip().startswith('#'));w=max((len(l) for l in
      ls),default=0);print('effective lines',n,'longest line',w);raise SystemExit(0 if n<500 and
      w<2000 else 1)"
    expected: 'prints an effective-line count under 500 and a longest line under 2000; exits 0'
    fix_if: >-
      Over either limit -- trim rationale prose or defer detail to the check module's docstring;
      do NOT register a structural budget entry.
  - step: 9
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-deviation-trigger-adds-no-auto-file-path
    action: >-
      Confirm the deviation trigger adds no auto-file-a-rec path -- T3.19 stays deferred, per the
      VF-08 forward-note the trigger cites rather than restates.
    command: >-
      bin/venv-python -c "import
      re,pathlib;t=pathlib.Path('.claude/skills/implement/SKILL.md').read_text();i=t.find('###
      Deviation trigger');assert i>=0,'deviation-trigger section
      absent';sec=re.split(r'\n#{2,3} ',t[i:],maxsplit=1)[0];bad=[w for w in
      ('file_rec','ops_data_portal','--file-rec') if w in sec];print('auto-file tokens in
      section:',bad);raise SystemExit(1 if bad else 0)"
    expected: 'prints `auto-file tokens in section: []` and exits 0'
    fix_if: >-
      A token appears -- branch (c) has grown an auto-file path. Delete it; cite the existing
      VF-08 forward-note instead. The window is bounded at the next heading of ANY depth, so a
      neighbouring H3 (e.g. the VF-08 forward-note, which legitimately names
      scripts.ops_data_portal) is never swallowed.
  - step: 10
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-relocations-not-reinlined
    action: >-
      Stale-reference sweep for the two relocations: the never-weaken sentence now lives in the
      contract (the implement skill points at it), and the commit-flow rebase rule is stated only
      in AGENTS.md.
    command: >-
      bin/venv-python -c "import
      pathlib;s=pathlib.Path('.claude/skills/implement/SKILL.md').read_text();q=pathlib.Path('tests/test_pr_ci_red_protocol_contract.py').read_text();L='Never
      weaken a criterion';bad=[];bad+=['inline never-weaken sentence still in SKILL.md'] if L in
      s else [];bad+=['retired sentence still pinned by tests/'] if L in q else [];bad+=['rebase
      rule restated in SKILL.md'] if 'STOP on conflict; do not auto-resolve' in s else
      [];bad+=['SKILL.md lost the contract pointer'] if 'implement-scope-boundary.yaml' not in s
      else [];bad+=['Pre-Push Rebase stub deleted (planning SKILL.md cross-references it)'] if
      '### Pre-Push Rebase' not in s else [];print('stale refs:',bad);raise SystemExit(1 if bad
      else 0)"
    expected: 'prints `stale refs: []` and exits 0'
    fix_if: >-
      A listed surface still carries the relocated text, or a pointer replacing it is missing.
      Complete the relocation; do not keep both copies. The `### Pre-Push Rebase` HEADING must
      survive as a pointer stub -- .claude/skills/planning/SKILL.md cross-references it by name.
      The bare `git rebase origin/main   # STOP on conflict` comment inside the IMPLEMENTATION
      Commit Flow bash block STAYS: it is a runnable command's inline comment, not a restatement
      of the rule.
  - step: 11
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Timing measurement against the Decision 153 fast-tier budget; wall-clock is not a stable
      regression assertion on a shared runner. Marked hermetic: false for the same reason, so
      validate_vp_replay does not independently re-execute a timing assertion. Recorded here as
      the measured cost note the new pre=True check owes.
    action: >-
      Measure the new pre-tier check's own dispatch cost so the fast-tier budget note (Decision
      153) is evidence-backed rather than asserted. Uses the same explicit override as step 6 --
      an ambient dispatch would time the no-op DEFER leg, not the enforcing path.
    command: >-
      bin/venv-python -c "import time,subprocess;from pathlib import Path;from scripts.checks
      import
      registry;cf=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True).stdout.split();s=time.perf_counter();f=[];registry.resolve('validate_scope_boundary')(f,plan_paths=[Path('docs/plans/PLAN-inline-defer-boundary-contract.yaml')],changed_files=cf);e=time.perf_counter()-s;print('elapsed_s=%.2f'
      % e);raise SystemExit(0 if e < 5 else 1)"
    expected: 'prints an elapsed_s under 5 seconds and exits 0'
    fix_if: >-
      Over 5s -- the check is globbing or re-reading the plan corpus. It must stay one hop off the
      status-aware diff, never a docs/plans/ directory walk.
  - step: 12
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: Fast tier green on the complete tree.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, Validation Summary PASS
    fix_if: Any red -- diagnose and fix on the branch; never weaken a check to obtain green.
  - step: 13
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Full tier green before handoff (the handoff_policy obligation, Decision 163; this step is
      what validate_handoff_full_tier requires the plan to declare executably).
    command: bin/venv-python -m scripts.validate
    expected: 'exit 0, final Validation Summary (scope all) PASS, logs/debug/validation-result.json scope all with no failures'
    fix_if: >-
      Any red or an incomplete result -- fix and rerun the full tier from the start; a child-run
      or --pre result cannot substitute.
  - step: 14
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Confirm BOTH successor recs are in the warehouse before rec-3332 is closed, so neither the
      deferred item 1 nor the CONTENT residual arm is lost with the parent rec, and that Decision
      181 backfilled to ops_decisions.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import
      json,pathlib;r=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()];tx=lambda x:(x.get('title') or '')+(x.get('context') or '');op=[x for x in r if
      x.get('status')=='open'];a=[x['id'] for x in op if 'rec-3332 item 1' in tx(x)];b=[x['id'] for x in
      op if 'CONTENT invariant residual arm' in tx(x)];d='dec-181' in
      pathlib.Path('logs/.decisions-index.jsonl').read_text();print('item1',a,'residual',b,'dec-181',d);raise
      SystemExit(0 if a and b and d else 1)"
