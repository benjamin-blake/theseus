schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "inline-defer-boundary-contract"
intent: >-
  Discharge Decision 59's nine-year-standing "scope guard becomes a deterministic diff-vs-plan
  check" commitment: give the already-stated scope rule a machine-parseable home, an
  implement-time deviation trigger, and an executable diff-vs-declared-scope check, with the
  content invariant's enforcement coverage declared rather than implied.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-inline-defer-boundary-contract.yaml
phase: >-
  Platform governance hardening -- scope-boundary enforcement (deferred half of
  PLAN-pr-ci-red-ownership, PR #986). Soft-warn exception category ad_hoc_rec (rec-3332 items
  2-4), so the Tier Item Freshness Gate is skipped; no tier_item slice, closes no criterion.
scope:
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Create
    purpose: >-
      Class D contract (subject implement-scope-boundary, status provisional_v0, evaluator
      {check: validate_scope_boundary}) holding the two invariants, the CONTENT invariant's
      enforcement-coverage map with its named residual, the conditional sanction rows, and the
      three-branch deviation trigger.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: register the new contract's route; its topic must equal the contract's subject
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 181 -- the CONTENT invariant as a standing prohibition plus the declare-your-coverage discipline
  - file: AGENTS.md
    action: Modify
    purpose: point the Safety scope bullet at the contract; recover bytes from the dead T-1.13 sentence
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: add the deviation trigger; collapse the Pre-Push Rebase restatement into a pointer
  - file: scripts/checks/verification/validate_scope_boundary.py
    action: Create
    purpose: the diff-vs-declared-scope enforcement check (Decision 59's deterministic scope guard)
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: bare-string-literal Entry registering the new check in the pre and full tiers
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check
  - file: tests/checks/verification/test_validate_scope_boundary.py
    action: Create
    purpose: mirror test for the check module
  - file: tests/test_scope_boundary_contract.py
    action: Create
    purpose: contract test over the prose, contract, and Decision surfaces
bundled_recommendations: ["rec-3332"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/implement-scope-boundary.yaml is a Class D contract whose evaluator
    {check: validate_scope_boundary} resolves under contract-population.yaml's evaluator_kinds
    grammar (Decision 168): the check is a member of BOTH registry.pre_sequence() and
    registry.full_sequence(), and the contract's basename appears as an executable-context
    string literal in the check module because the check genuinely reads the contract at check
    time and holds no second copy of the row map.
  - >-
    The contract states the LOCATION invariant (touched files subset of the resolved plan's
    declared scope union contract-derived companions, citing Decision 59 as its authority) and
    the CONTENT invariant (no weakening of an acceptance criterion, VP step, assertion, or
    budget to obtain green; weakening routes to a rec whatever file it lives in), and its
    sanction rows are conditional trigger -> derived-path + prohibited-content rows, never a
    flat path allowlist.
  - >-
    The CONTENT invariant carries an explicit enforcement-coverage map naming, per surface, the
    check that enforces it or the fact that it is an unenforced residual agent obligation -- and
    the one residual arm (an assertion or numeric tolerance weakened inside an in-scope source or
    test file) names the open rec that owns it. The contract never presents CONTENT as an
    unqualified binary invariant behind a location-only evaluator.
  - >-
    validate_scope_boundary FAILS an implement-leg diff touching a path outside (declared scope
    union derived sanctions) naming that path, FAILS a prohibited plan-field edit, PASSES the
    same diff once the path is declared, DEFERS a plan-only PR, and declares skipped when
    origin/main is unreachable.
  - >-
    All seven registration surfaces from scripts/checks/registry.py's enumeration are satisfied,
    including surface (7): the check declares examined()/skipped() on every reachable exit path
    per docs/contracts/check-accounting.yaml (Decision 170), so it needs no
    config/check_accounting_baseline.yaml entry.
  - >-
    .claude/skills/implement/SKILL.md carries a three-branch deviation trigger that cites (never
    restates) the existing 3-fix-attempt STOP and VF-08 rules, points at the overseer skill's
    Fable Advice-Consult Protocol, and adds no auto-file-a-rec path.
  - >-
    AGENTS.md's "## Safety" scope bullet points at the contract; neither it nor the planning
    skill's plan-template scope line is restated anywhere new.
  - >-
    docs/DECISIONS.md carries `## Decision 181:` with a Significance envelope claiming
    numbered_decision plus a justification naming the contract home considered and why it was
    rejected for the axis half, and stated reversal conditions; the entry is under
    decision-entry.yaml's 6144-byte per-entry cap and is backfilled to ops_decisions.
  - >-
    No entry in config/prose_budgets.yaml, config/sloc_budgets.yaml, or
    config/structural_size_budgets.yaml is raised or added, and the new contract stays inside the
    contracts class's 500-effective-line and 2000-character-line limits (Decision 166).
  - >-
    rec-3332 closes via the Resolves trailer, and two successor recs exist in the warehouse: one
    for its still-deferred item 1 (pre_globs widening, blocked on the Decision 128 decomposition
    of scripts/verify_ci_workflow.py) and one owning the CONTENT invariant's residual arm.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-contract-evaluator-resolves
    action: >-
      Assert the new contract is a Class D envelope whose {check: validate_scope_boundary}
      evaluator genuinely resolves -- registered in BOTH tiers, with the contract basename present
      as an executable-context literal in the check module (Decision 168 clause 2).
    command: >-
      bin/venv-python -c "import yaml,pathlib;from scripts.checks import
      registry;c=yaml.safe_load(pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text())['contract'];assert
      c['class']=='D' and c['subject']=='implement-scope-boundary' and
      c['status']=='provisional_v0',c;assert
      c['evaluator']=={'check':'validate_scope_boundary'},c['evaluator'];n=lambda
      s:{getattr(x,'name',x) for x in s};assert 'validate_scope_boundary' in
      n(registry.pre_sequence()) and 'validate_scope_boundary' in
      n(registry.full_sequence());src=pathlib.Path('scripts/checks/verification/validate_scope_boundary.py').read_text();assert
      'implement-scope-boundary.yaml' in src;print('contract-evaluator-resolves OK')"
    expected: 'prints `contract-evaluator-resolves OK` and exits 0'
    fix_if: >-
      The AssertionError names the failing clause -- a wrong class/subject/status, a non-resolving
      evaluator, a missing manifest Entry (so the check is absent from one tier), or a basename
      literal that lives only in a docstring (docstrings and # comments are excluded by the
      evaluator grammar).
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-rejects-unsanctioned-path
    action: >-
      Run the mirror test: the check must FAIL a fixture implement-leg diff touching an undeclared
      path, FAIL a prohibited plan-field edit, PASS once the path is declared, DEFER a plan-only
      diff, PASS vacuously with no plan in the diff, and declare skipped on an unreachable base.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_scope_boundary.py -q
    expected: all tests pass, exit 0, no tests skipped
    fix_if: >-
      A failing red-case test means the check does not discriminate; a failing green-case test
      means a sanction row is missing or its derivation is wrong. Fix the check or the row, never
      the assertion.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-prose-surfaces-carry-the-rule
    action: >-
      Run the prose/contract test: AGENTS.md points at the contract, the implement skill's
      deviation trigger carries all three branches plus the Fable pointer, the contract declares
      both invariants and the CONTENT enforcement-coverage map with its named residual, and the
      file-router route topic equals the subject.
    command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py -q
    expected: all tests pass, exit 0
    fix_if: >-
      A red assertion names the surface that lost its pointer, branch, or coverage row. Restore
      the surface; never relax the assertion.
  - step: 4
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-content-coverage-residual-named
    action: >-
      Assert the CONTENT invariant is declared with an enforcement-coverage map in which every
      row either names an enforcing check or is explicitly marked a residual agent obligation
      carrying an owning rec id -- the Decision 163 point 2 honesty requirement.
    command: >-
      bin/venv-python -c "import
      yaml,pathlib,re;d=yaml.safe_load(pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text());rows=d['invariants']['content']['enforcement_coverage'];assert
      rows,'no coverage rows';res=[r for r in rows if r.get('status')!='mechanical'];assert
      all(r.get('enforced_by') for r in rows if r.get('status')=='mechanical'),'mechanical row
      without an enforcer';assert all(re.match(r'^rec-\d+$',str(r.get('residual_owner','')))
      for r in res),'residual row without an owning rec id:
      '+str(res);print('coverage rows:',len(rows),'residual:',len(res))"
    expected: 'prints a non-zero coverage-row count and a residual count, and exits 0'
    fix_if: >-
      A mechanical row with no enforcer, or a residual row with no owning rec id -- file the rec
      first, then name it. Never delete a residual row to make this pass; that re-hides the gap.
  - step: 5
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-decision-181-envelope-present
    action: >-
      Assert Decision 181 landed with the Significance envelope decision-entry.yaml requires
      (routing key plus justification) and stated reversal conditions.
    command: >-
      bin/venv-python -c "import
      re,pathlib;t=pathlib.Path('docs/DECISIONS.md').read_text();m=re.search(r'(?ms)^## Decision
      181:.*?(?=^## Decision |\Z)',t);assert m,'Decision 181 header
      absent';b=m.group(0);assert 'significance' in b.lower(),'no significance
      envelope';assert 'numbered_decision' in b,'envelope does not claim
      numbered_decision';assert 'Reversal' in b or 'reversal' in b,'no reversal
      conditions';assert len(b.encode())<=6144,'over the per-entry cap:
      '+str(len(b.encode()));print('decision-181 entry bytes:',len(b.encode()))"
    expected: 'prints the entry byte count at or under 6144 and exits 0'
    fix_if: >-
      A missing envelope field, routing claim, or reversal clause -- author it per
      docs/contracts/decision-entry.yaml's metadata_envelope.required_fields. Over the cap --
      move detail into the contract, never raise the cap.
  - step: 6
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      This asserts a property of THIS PR's own working-tree diff, which does not exist in the
      differential-admission revert worktree -- the check module is absent there, so the command
      would fail for the wrong reason and be admitted on a false signal (exactly the defect #994
      repaired). The standing regression guard for the same behavior is step 2's fixture-driven
      mirror test, which is graduated.
    action: >-
      Self-hosting run: dispatch validate_scope_boundary against this PR's real diff and confirm
      it is green -- this plan's own scope table must satisfy the boundary it installs, and its
      graduated registry shards plus docs/decisions-index.json must be sanctioned by rows (a) and
      (c) rather than by a scope row.
    command: >-
      bin/venv-python -c "from scripts.checks import
      registry;f=[];registry.resolve('validate_scope_boundary')(f);print('FAILURES:',f);raise
      SystemExit(1 if f else 0)"
    expected: 'prints `FAILURES: []` and exits 0'
    fix_if: >-
      A named path is either a genuine scope omission (add the scope row) or an implement-time
      derived companion the contract does not yet model (add a conditional sanction row with its
      trigger and prohibited content). Never widen a row into a bare path allowlist.
  - step: 7
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts an invariant this PR does not change (no budget value is edited), so the command
      returns identical output in the revert worktree and cannot discriminate -- it would
      correctly fail differential admission. Retained as the plan-time budget guard.
    action: >-
      Confirm the prose budgets still hold with NO budget-registry edit anywhere: bytes were
      recovered, not bought.
    command: >-
      bin/venv-python -c "import
      subprocess,sys;d=subprocess.run(['git','diff','origin/main','--','config/prose_budgets.yaml','config/sloc_budgets.yaml','config/structural_size_budgets.yaml'],capture_output=True,text=True).stdout;assert
      not d.strip(),'budget registry edited';from scripts.checks import
      registry;f=[];registry.resolve('validate_prose_limits')(f);print('FAILURES:',f);sys.exit(1
      if f else 0)"
    expected: 'prints `FAILURES: []` and exits 0; no diff against origin/main in any budget registry'
    fix_if: >-
      Over budget -- recover more bytes by collapsing another restatement of a declared canonical
      authority (AGENTS.md `## Git-ops procedure` is the git-ops authority; the implement skill's
      `### Wait-for-CI` section is the in-file precedent for the pointer form). Never raise a
      budget entry.
  - step: 8
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Measures the new file's own size; in the revert worktree the file is absent, so the command
      errors rather than discriminating on the guarded behavior. The contract's shape is guarded
      instead by validate_contract_drift in the tier runs and by step 1.
    action: >-
      Confirm the new contract stays inside the contracts class's 500-effective-line limit AND its
      2000-character long-line companion (Decision 166), so it needs no roster registration.
    command: >-
      bin/venv-python -c "import
      pathlib;ls=pathlib.Path('docs/contracts/implement-scope-boundary.yaml').read_text().splitlines();n=sum(1
      for l in ls if l.strip() and not l.lstrip().startswith('#'));w=max((len(l) for l in
      ls),default=0);print('effective lines',n,'longest line',w);raise SystemExit(0 if n<500 and
      w<2000 else 1)"
    expected: 'prints an effective-line count under 500 and a longest line under 2000; exits 0'
    fix_if: >-
      Over either limit -- trim rationale prose or defer detail to the check module's docstring;
      do NOT register a structural budget entry.
  - step: 9
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      An absence assertion over content this PR adds: in the revert worktree the section does not
      exist, so the scan finds nothing and the step passes anyway -- it cannot discriminate.
      Retained as the plan-time honesty check on the T3.19 constraint.
    action: >-
      Confirm the deviation trigger adds no auto-file-a-rec path -- T3.19 stays deferred, per the
      VF-08 forward-note the trigger cites rather than restates.
    command: >-
      bin/venv-python -c "import
      pathlib;t=pathlib.Path('.claude/skills/implement/SKILL.md').read_text();i=t.index('###
      Deviation trigger');rest=t[i+5:];j=i+5+(rest.index('\n## ') if '\n## ' in rest else
      len(rest));bad=[w for w in ('file_rec','ops_data_portal','--file-rec') if w in
      t[i:j]];print('auto-file tokens in section:',bad);raise SystemExit(1 if bad else 0)"
    expected: 'prints `auto-file tokens in section: []` and exits 0'
    fix_if: >-
      A token appears -- branch (c) has grown an auto-file path. Delete it; cite the existing
      VF-08 forward-note instead.
  - step: 10
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A stale-reference sweep asserting an absence after a relocation; in the revert worktree the
      relocated sentence is still at its old site, so the sweep would FAIL there for the opposite
      reason to the one it guards -- a misleading standing check. Retained as the Closure
      Obligation's plan-time sweep.
    action: >-
      Stale-reference sweep for the two relocations: the never-weaken sentence now lives in the
      contract (the implement skill points at it), and the commit-flow rebase rule is stated only
      in AGENTS.md.
    command: >-
      bin/venv-python -c "import
      pathlib;s=pathlib.Path('.claude/skills/implement/SKILL.md').read_text();bad=[];bad+=['inline
      never-weaken sentence still in SKILL.md'] if 'Never weaken a criterion, VP step' in s else
      [];bad+=['rebase rule restated in SKILL.md'] if 'STOP on conflict; do not auto-resolve' in
      s else [];bad+=['SKILL.md lost the contract pointer'] if 'implement-scope-boundary.yaml'
      not in s else [];print('stale refs:',bad);raise SystemExit(1 if bad else 0)"
    expected: 'prints `stale refs: []` and exits 0'
    fix_if: >-
      A listed surface still carries the relocated text, or the pointer replacing it is missing.
      Complete the relocation; do not keep both copies.
  - step: 11
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Timing measurement against the Decision 153 fast-tier budget; wall-clock is not a stable
      regression assertion and the module is absent on revert, so it cannot be a standing kernel
      check. Recorded here as the measured cost note the new pre=True check owes.
    action: >-
      Measure the new pre-tier check's own dispatch cost so the fast-tier budget note (Decision
      153) is evidence-backed rather than asserted.
    command: >-
      bin/venv-python -c "import time;from scripts.checks import
      registry;t=time.perf_counter();f=[];registry.resolve('validate_scope_boundary')(f);print('elapsed_s=%.2f'
      % (time.perf_counter()-t));raise SystemExit(0 if time.perf_counter()-t < 5 else 1)"
    expected: 'prints an elapsed_s under 5 seconds and exits 0'
    fix_if: >-
      Over 5s -- the check is globbing or re-reading the plan corpus. It must stay one hop off the
      status-aware diff, never a docs/plans/ directory walk.
  - step: 12
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: Fast tier green on the complete tree.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, Validation Summary PASS
    fix_if: Any red -- diagnose and fix on the branch; never weaken a check to obtain green.
  - step: 13
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Full tier green before handoff (the handoff_policy obligation, Decision 163; this step is
      what validate_handoff_full_tier requires the plan to declare executably).
    command: bin/venv-python -m scripts.validate
    expected: 'exit 0, final Validation Summary (scope all) PASS, logs/debug/validation-result.json scope all with no failures'
    fix_if: >-
      Any red or an incomplete result -- fix and rerun the full tier from the start; a child-run
      or --pre result cannot substitute.
  - step: 14
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Confirm BOTH successor recs are in the warehouse before rec-3332 is closed, so neither the
      deferred item 1 nor the CONTENT residual arm is lost with the parent rec, and that Decision
      181 backfilled to ops_decisions.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && grep -c "verify_ci_workflow"
      logs/.recommendations-log.jsonl && grep -c "dec-181" logs/.decisions-index.jsonl
    expected: both greps return a non-zero count
    fix_if: >-
      Zero -- file the missing rec via `bin/venv-python -m scripts.ops_data_portal --file-rec`
      (call get_rec_write_guidance() first, Decision 66) or run
      `--backfill-decisions-md`, then re-run.
  - step: 15
    phase: post-deploy
    hermetic: false
    action: >-
      After the squash-merge, confirm rec-3332 actually closed via the Resolves trailer
      (rec-autoclose), per the plan's Closure Obligation.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import
      json,pathlib;r=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()];m=next(x for x in r if x['id']=='rec-3332');print(m['status']);raise
      SystemExit(0 if m['status']=='closed' else 1)"
    expected: 'prints closed and exits 0'
    fix_if: >-
      Still open after ~5 min -- close directly per AGENTS.md's fallback:
      `bin/venv-python -m scripts.ops_data_portal --update-rec rec-3332 --status closed
      --resolution "..."`.
test_obligations:
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: declares both invariants, the CONTENT enforcement-coverage map with a rec-owned residual, and conditional trigger/derived-path/prohibited rows -- never a flat allowlist
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before, green after
  - source: AGENTS.md
    behavior: the Safety scope bullet points at the contract and the scope rule is cited, not duplicated
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before, green after
  - source: .claude/skills/implement/SKILL.md
    behavior: the deviation trigger carries all three branches, points at the overseer Fable protocol, cites the 3-fix-attempt/VF-08 rules, and adds no auto-file path
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before, green after
  - source: docs/contracts/file-router.yaml
    behavior: the new contract has a route whose topic equals its subject
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before, green after
  - source: docs/DECISIONS.md
    behavior: Decision 181 carries the Significance envelope claiming numbered_decision, a contract-first justification, and reversal conditions
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before, green after
  - source: scripts/checks/verification/validate_scope_boundary.py
    behavior: fails an undeclared path and a prohibited plan-field edit, passes once declared, defers a plan-only diff, declares skipped on an unreachable base, and declares examined()/skipped() on every exit path
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_scope_boundary.py
    red_green_expectation: red before, green after
  - source: scripts/checks/verification/_manifest.py
    behavior: the check is registered in both the pre and full tiers via bare string-literal module/attr, which the contract's evaluator resolution depends on
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_scope_boundary.py
    red_green_expectation: red before, green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: the check carries a discriminating function_to_category row so a CI-RCA attribution has a category
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_scope_boundary.py
    red_green_expectation: red before, green after
constraints:
  - >-
    Cite, never restate, the two existing statements of the scope rule -- AGENTS.md "## Safety"
    and the planning skill's plan-template `scope:` line -- and the existing 3-fix-attempt STOP
    and VF-08 rules in the implement skill (Decision 86).
  - >-
    Point at .claude/skills/overseer/SKILL.md "## Fable Advice-Consult Protocol"; do not restate
    it. Precedent: the planning skill's Data-Model Assessment step 8.
  - >-
    Recover bytes rather than raising any prose budget. Measured at plan time: S1 headroom 32
    bytes, implement SKILL.md headroom 266 bytes; recovery available is 113 bytes (AGENTS.md's
    dead T-1.13 sentence) and 520 bytes (collapsing the implement skill's `### Pre-Push Rebase`
    restatement into a pointer at AGENTS.md's `### Rebase phase distinction`).
  - >-
    Add no auto-file-a-rec path on repeated failure -- T3.19 is explicitly deferred by the VF-08
    forward-note.
  - >-
    Never declare the CONTENT invariant as an unqualified binary rule behind a location-only
    evaluator (Decision 163 point 2). Every coverage row is either mechanically enforced by a
    named check or explicitly a residual owned by an open rec.
  - >-
    A new Class D contract may not declare `status: active` (grandfather-only, closed at birth);
    use provisional_v0 with a re_ratification_trigger, per plan-obligations.yaml's precedent.
  - >-
    The contract must not smuggle Class A/B shape: no top-level `fields:`/`verbs:` key and no
    mapping-of-mappings whose leaf mappings carry two or more Class A/B descriptor keys
    (description, semantics, type, nullable, populated_by, dq_intent). Use plan-obligations.yaml's
    purpose/trigger/requires row vocabulary shape.
  - >-
    The check reads its row map from the contract at check time and holds no second copy
    (plan_obligations.py precedent); it derives plans one hop off the status-aware diff and never
    globs docs/plans/. A row whose sanction_kind the check does not implement must FAIL loudly.
  - Do not weaken a check to pass differential admission (#994 repaired the false-admission defect).
  - No rescue agents or workaround loops (Decision 55).
  - No new standing prose-architecture doc under docs/ (Decision 86).
context:
  - "Decision-scout verdict: FLAGS_FOUND (133 of 133 triaged). CITE: 59, 163, 168, 169, 170, 132, 148, 176, 166, 86, 127, 72, 55, 128, 179. RELATED: 131, 142, 153, 174, 118, 48."
