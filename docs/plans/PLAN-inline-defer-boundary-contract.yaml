execution_steps:
  - >-
    Create docs/contracts/implement-scope-boundary.yaml -- Class D envelope (subject
    implement-scope-boundary, status provisional_v0 with authored_at, rationale and a
    re_ratification_trigger); an `invariants:` block with `location` (statement + enforcement +
    authority citing Decision 59) and `content` (statement + authority + `enforcement_coverage`
    rows, each either status mechanical with a named enforcing check, or status
    residual_agent_obligation with a `residual_owner` rec id); a `sanction_rows:` map seeded with
    three evidence-derived conditional rows -- graduated_registry_shard (path derived from the
    resolved plan's own graduation_check_id), implementing_plan_bookkeeping (the resolved plan
    path; permitted implementation_declared / graduation disposition / closes_criteria edits,
    prohibited acceptance_criteria / scope / verification_plan command+expected edits -- state in
    the row that `scope` is prohibited SPECIFICALLY so an undeclared path cannot be resolved by
    editing the plan, and that the recorded escape is a human-directed amendment, not a unilateral
    append) and
    decisions_index_regeneration (docs/decisions-index.json when docs/DECISIONS.md is in scope);
    an `unmodelled_companions:` note naming .secrets.baseline and
    config/composite_action_body_baseline.yaml as regenerated companions deliberately left without
    a row (each appeared in 1 of the measured implement commits) -- they are a deliberate STOP, not
    an oversight; and a `deviation_trigger:` table with the three branches. Each row carries purpose / trigger /
    sanctions / prohibited -- never a Class A/B descriptor key.
  - >-
    Register the route in docs/contracts/file-router.yaml with topic == the contract's subject,
    AND append a dated amendment_log entry -- file-router.yaml is itself Class D, `routes:` is
    part of its canonical dump, and contract-population.yaml's change_detection.amendment_log
    fails a dump change carrying no new entry.
  - >-
    Author Decision 181 in docs/DECISIONS.md -- the CONTENT invariant as a standing prohibition on
    every implementing agent (never weaken an acceptance criterion, VP step, assertion, or budget
    to obtain green; weakening routes to a rec whatever file it lives in), plus the
    declare-your-coverage discipline (a governance invariant must publish, per surface, the check
    that enforces it or the fact that it is an unenforced residual with an owning rec). State
    plainly that the residual arm is the DOMINANT form of weakening, so the map's row count does
    not imply parity, and make its continued existence a stated reversal condition. Point at
    docs/contracts/implement-scope-boundary.yaml for the invariant's exact clause rather than
    restating it (the Decision 162 / composite-action-shape.yaml pattern). Cite Decision 59 as
    the LOCATION half's existing authority and Decision 163 point 2 as the failure mode. Include
    the fenced yaml Significance envelope ({value: numbered_decision, justification}) naming BOTH
    rejected alternatives -- the contract home, and a dated amendment_forms annotation on Decision
    163 -- plus stated reversal conditions. Keep the entry under 6144 bytes.
  - >-
    Create scripts/checks/verification/validate_scope_boundary.py -- read the contract at check
    time (basename as an executable-context literal; no second copy of the row map), resolve
    implement-leg plans via _common.resolve_declared_plans, union their scope[].file, derive
    sanctioned paths from the rows, and report each unsanctioned touched path plus each prohibited
    plan-field edit. Declare examined()/skipped() on every reachable exit path (Decision 170).
    Exception-contained throughout: a malformed contract or plan is a reported finding, never a
    raise; an unimplemented sanction_kind is a loud failure, never a silent pass. Carry the
    `@register("validate_scope_boundary", owner="platform")` decoration (registration surface 2),
    and expose `changed_files` and `root` as injected parameters with real-dispatch defaults --
    those seams are what make step 2's fixture red/green cases writable without touching the real
    repository, mirroring resolve_declared_plans' own never-derive-the-base discipline.
  - >-
    Add the Entry to scripts/checks/verification/_manifest.py (bare string-literal module/attr,
    pre=True, full_after_lint) and the function_to_category row to config/ci_rca_taxonomy.yaml.
  - Create tests/checks/verification/test_validate_scope_boundary.py -- fixture-driven red and green cases for each leg and each row.
  - >-
