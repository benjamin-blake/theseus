    test_lint_targets.py::TestRunLintChecksWholeTreeTargets::test_pin_only_changed_set_still_lints_whole_tree
    and the DRIVER-altitude case
    test_tiers.py::TestPreModeDiffAware::test_pin_only_diff_drives_whole_tree_lint, the latter
    driving _validate.main() under --pre with commit 1c50e26b's five-file changed set. Both node ids
