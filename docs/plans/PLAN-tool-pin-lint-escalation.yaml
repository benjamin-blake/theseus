    deliberately unused, so a later cleanup cannot silently re-open the escape.
  - >-
    PR2: retarget all FIVE tests that pin the deleted diff-scoped branch (the closed set enumerated
    in the GOTCHA -- two in test_lint_targets.py, one in test_scaffold_gates.py, two in
    test_tiers.py::TestPreModeDiffAware). Retarget, never delete or relax: this is Decision 181's
