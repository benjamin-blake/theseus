schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "tool-pin-lint-escalation"
intent: >-
  Close the two open Critical CI-RCA recs by fixing the 38 ruff ISC004 violations that ruff 0.16.7
  exposed, and close the presubmit gate gap that let a linter-version bump reach main unlinted --
  so a RUFF-version or pre-commit-config change can no longer escape the fast tier by touching no .py
  file. Deliberately NOT general: mypy stays diff-scoped in --pre (dec-161 clause 3 preserves that
  scaffold), and mypy is informational there in any case.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tool-pin-lint-escalation.yaml
phase: >-
  No tier_item slice; closes no criterion. Cites T1.13:c9 (Failure-category integrity + correct
  gate-escape modeling, status open) as context only -- c9 models tier_misplaced as a gate-escape
  whose corrective_action targets the GATE, which is what this plan's preventive half is. c9's own
  build (the escape_mode derivation) is owned elsewhere and is untouched here.
scope:
