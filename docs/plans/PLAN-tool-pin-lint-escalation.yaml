  - >-
    PR2: add the Decision 170 accounting -- registry.outcome_scope plus examined() on
    run_lint_checks (it has no reachable non-execution path once unconditional, so it must NOT
    declare a skip path) and skipped() on run_precommit_checks. Any print stays a human affordance
