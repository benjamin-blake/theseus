    action: Modify
    purpose: >-
      PR1 decomposition (499 SLOC, limit 500; the ISC004 sweep would take it to ~505). Extract
      TestReportOnly, TestRegistrationSurfaces and TestLiveTreeInvariants to a sibling module.
      DELIBERATELY KEEPS TestCallShapeMatrix in place -- its three ISC004 sites stay at this path,
      so the corrective scope row below never has to chase a moved file.
  - file: tests/checks/hygiene/test_validate_raises_reporting.py
    action: Create
    purpose: PR1 -- receives TestReportOnly, TestRegistrationSurfaces, TestLiveTreeInvariants
  - file: tests/validate/test_tiers.py
    action: Modify
    purpose: >-
      PR1 decomposition (492 SLOC; the driver-altitude test would take it to ~516). Extract
      TestPreGlobMatch, TestShouldRunInPre and TestPreGlobsGateEndToEnd. MUST KEEP
      TestPreModeRegistryIsolation at this exact path -- verification-registry shard
      pre-tier-registry-isolation-guard.yaml binds node_id
      tests/validate/test_tiers.py::TestPreModeRegistryIsolation and would dangle (rec-3812's
      failure mode). PR2 then adds the driver-altitude test and retargets two pinning tests here.
