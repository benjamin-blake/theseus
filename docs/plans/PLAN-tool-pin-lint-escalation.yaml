    action: Create
    purpose: >-
      PR1 -- receives TestRunCoverageCheck, TestVerifierCoverageArgv, TestRunDependencyChecks,
      TestRunCoverageCheckSysPathInjection
  - file: scripts/checks/_scaffolding.py
    action: Modify
    purpose: >-
      run_lint_checks becomes unconditional whole-tree; run_precommit_checks gains the derived
      global-input escalation; both replace silent early returns with outcome_scope accounting
  - file: scripts/checks/deps/validate_presubmit_tool_pin_escalation.py
    action: Create
    purpose: Class D evaluator -- reads the new contract by basename and asserts the escalation mechanism
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: register the new check Entry (sequenced, so the Decision 168 evaluator resolves)
  - file: docs/contracts/presubmit-tool-pin-escalation.yaml
    action: Create
    purpose: Class D mechanism contract -- whole-tree lint rule and tool-pin escalation semantics
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      PR2 -- COMPACT FIRST, then add the route whose topic equals the new contract subject
      (Decision 168 clause 4). Measured 499 effective lines against the contracts-class limit of
      500; a route row is 3 effective lines, so the add alone breaches. The contracts class
      relief_valve forbids splitting ("splitting a single subject is forbidden by collocation
      doctrine") and lists compaction FIRST; docs/contracts/decision-entry.yaml is the live
      precedent for trim-then-add. COST IS 12 LINES, NOT 3: the route row is 3 effective lines AND a
      new amendment_log entry is COMPULSORY -- file-router.yaml is itself
      class: D, and _population.check_amendment_log_for_class_d hard-fails when the canonical dump
      (every top-level key except amendment_log) changes with no new amendment_log[] entry. Adding a
      routes[] row changes that dump. Both live 2026-09 precedents in this file say so verbatim
      ("Paid for the route PLUS this entry by compacting..."). MEASURED entry sizes across all 13
      entries: 5,5,6,6,7,8,8,8,9,9,9,10,10 -- never 4, and both 2026-09 precedents (the ones that
      document a route add AND the compaction paying for it, i.e. this exact shape) are 10. Rule:
      compaction >= entry_lines + 2 clears the 500 ceiling (size_limits fails on eff > limit), +3 to
      reach 499. So tighten >=12 effective lines, sized to the precedent shape, not the floor. No budget raise: this plan mints no Decision, and a raise marker must name
      an AUTHORIZING Decision (Decision 165).
