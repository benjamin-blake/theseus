    Add the new test class TestRunPrecommitChecksEscalation in test_scaffold_gates.py -- the node id
    VP step 4 and two test_obligations rows name.
  - >-
    PR2: add docs/contracts/presubmit-tool-pin-escalation.yaml. REQUIRED envelope fields
    (ContractMeta is extra=forbid): id, class: D, contract_version (int), status: ratified,
    ratified_via: PLAN-tool-pin-lint-escalation, description, unique subject, evaluator
    {check: validate_presubmit_tool_pin_escalation}. status: active is birth-closed and must NOT be
    used. No ratchet pin edit and no raise-approved marker is owed -- a ratified contract with a
    resolving evaluator lands in the `declared` census bucket, which neither grandfathered_max nor
    status_active_max binds.
  - >-
    PR2: add the evaluator module, its deps/_manifest.py Entry, and the ci_rca_taxonomy
    function_to_category row. The Entry SHOULD be pre=True -- a guard against a presubmit escape
    that does not itself run in presubmit is weaker than the escape it prevents -- which obliges
    pre_globs covering its own transitive import closure (validate_pre_glob_closure) and membership
    of a domain in _PRE_DOMAIN_ORDER (deps is present). Decision 168 clause 2 resolves on membership
    of EITHER sequence, so a full_segment-only Entry would also pass; make the choice deliberately.
  - >-
    PR2: COMPACT docs/contracts/file-router.yaml by at least 12 effective lines BEFORE adding the
    route row, so the net stays <=499 against the contracts-class limit of 500 (499 measured today).
    Twelve, not three and not seven: the route row is 3 effective lines and the compulsory Class D
    amendment_log entry is another 5-10 (check_amendment_log_for_class_d hard-fails a routes[]
    change with no new entry; measured sizes 5,5,6,6,7,8,8,8,9,9,9,10,10, and the two 2026-09
    entries of this exact shape -- route add plus the compaction that paid for it -- are 10 each).
    Size the compaction to the measured entry you actually write: compaction >= entry_lines + 2 for
    the 500 ceiling, +3 for 499. The amendment_log is also the file's largest compressible region,
    so it is both the cost and the source of the relief. FALLBACK: if compaction cannot find 12
    lines, drop the route row instead with a stated reason -- Decision 168 clause 4 constrains a
    route's topic if one exists, it does not mandate that one exist (contract-population.yaml:
    "A Class D file with no matching route is outside this rule's scope") -- and record the
    discoverability cost.
  - >-
    PR2: satisfy the two enforced-elsewhere obligations for the new check -- the Decision 170
    accounting declaration (validate_check_accounting) and the graduated verification-registry
    shards (validate_graduation_completeness). ALL FOUR shards (whole-tree-ruff-clean,
    pin-only-set-lints-whole-tree, pre-driver-pin-only-diff-lints-whole-tree,
    precommit-escalates-on-derived-global-input) land in PR2, and implementation_declared flips in
    PR2. They must be in the same PR: _new_registry_rows tests NEW-IN-DIFF against origin/main, and
    _fix_commit_touches diff-trees this same PR's squash sha for the shard file at VP steps 7-8.
  - >-
    VP SEQUENCING: steps 1-6 run on PR2's branch before merge (step 1 also runs on PR1, where the
    remaining 35 ISC004 keep it red). Steps 7-9 run IMMEDIATELY AFTER PR2 MERGES, standing on a
    working tree that contains the shard file -- _shard_kind_fact does a filesystem exists() before
    _fix_commit_touches, so fetch and check out the merged main first.
  - Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results, and the measured SLOC of every decomposed file'

