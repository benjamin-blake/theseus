    of a domain in _PRE_DOMAIN_ORDER. Decision 168 clause 2 resolves on membership of EITHER
    sequence, so a full_segment-only Entry would also pass; make the choice deliberately.
  - >-
    PR3: COMPACT docs/contracts/file-router.yaml by at least 7 effective lines BEFORE adding the
    route row, so the net stays <=499 against the contracts-class limit of 500. Seven, not three:
    the route row is 3 lines and the compulsory Class D amendment_log entry is another 4-6
    (check_amendment_log_for_class_d hard-fails a routes[] change with no new entry). The
    amendment_log is also the file's largest compressible region, so it is both the cost and the
    source of the relief. Splitting is
    forbidden by collocation doctrine; compaction is the class's first listed relief valve and
    decision-entry.yaml is the live trim-then-add precedent. If compaction cannot find 3 lines, drop
    the route row instead with a stated reason -- Decision 168 clause 4 constrains a route's topic
    if one exists, it does not mandate that one exist -- and record the discoverability cost.
  - >-
    PR3: satisfy the two enforced-elsewhere obligations for the new check -- the Decision 170
    accounting declaration (validate_check_accounting) and the graduated verification-registry shard
    (validate_graduation_completeness).
  - >-
    PLAN-FLIP PR: implementation_declared flips in PR3, never PR1 or PR2. Both
    validate_graduation_completeness's implement-PR leg and validate_vp_replay's implement leg key
    on a docs/plans/PLAN-*.yaml appearing in the diff, and VP step 4's check id
    precommit-escalates-on-derived-global-input guards behaviour that only exists after PR3.
    Flipping it earlier reddens both gates.
  - >-
    VP SEQUENCING: steps 1-6 run per-PR as their subjects land. Steps 7-9 (rec closure) run
    IMMEDIATELY AFTER PR2 MERGES AND BEFORE PR3 OPENS -- not at the end. The shard
    config/agent/verification_registry/entries/pin-only-set-lints-whole-tree.yaml lands with PR2,
    and closure_gate._fix_commit_touches diff-trees the fix sha for an intersection with that exact
    file. Run them after PR3 and `git rev-parse origin/main` resolves to PR3's squash sha, whose
    diff-tree does not contain the shard -- resolve_closure_artifact returns False,
    assert_closure_obligation raises, and both Critical recs stay OPEN silently. PR2 is also the
    point at which both recs' acceptance commands first hold.
  - Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results, and the measured SLOC of every decomposed file'

rollback: >-
  Every change is additive or a deletion of a scoped branch; revert the squash commit to restore the
  diff-scoped lint gate. The 38 parenthesizations are semantically inert and safe to carry independently.
