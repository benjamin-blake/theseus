  - >-
    PR2: add the derived global-input escalation to run_precommit_checks -- parse
    .pre-commit-config.yaml at the BASE REF for its declared global inputs (its own path plus any
    baseline a hook names; today that resolves to .pre-commit-config.yaml and .secrets.baseline) and
