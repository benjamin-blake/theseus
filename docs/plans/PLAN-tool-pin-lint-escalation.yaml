      PR1 decomposition (492 SLOC; the driver-altitude test would take it to ~516). Extract
      TestPreGlobMatch, TestShouldRunInPre and TestPreGlobsGateEndToEnd. MUST KEEP
      TestPreModeRegistryIsolation at this exact path -- verification-registry shard
      pre-tier-registry-isolation-guard.yaml binds node_id
      tests/validate/test_tiers.py::TestPreModeRegistryIsolation and would dangle (rec-3812's
      failure mode). PR2 then adds the driver-altitude test and retargets two pinning tests here.
  - file: tests/validate/test_pre_glob_gating.py
    action: Modify
    purpose: >-
      PR1 -- receives TestPreGlobMatch, TestShouldRunInPre, TestPreGlobsGateEndToEnd. This EXISTING
      module (39 effective lines) already owns the same two symbols, _pre_glob_match and
      _should_run_in_pre, and its own docstring says it was split out of test_tiers.py precisely
      because that file sits at 492 SLOC. Extending it lands at ~140 effective lines, well inside
