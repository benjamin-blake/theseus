bundled_recommendations: ["rec-3861", "rec-3863"]
followon_recs: ["rec-3868", "rec-3869"]
infrastructure_dependencies: []
acceptance_criteria:
  - "bin/venv-python -m ruff check src/ tests/ scripts/ exits 0 with zero ISC004"
  - "run_lint_checks lints src/ tests/ scripts/ regardless of the changed-file set, including a pin-only set"
  - "a diff touching a pre-commit global input escalates run_precommit_checks to --all-files"
  - "the global-input set is derived from .pre-commit-config.yaml, not a hard-coded path roster"
  - "run_precommit_checks non-execution (pre-commit absent, or an empty changed-file target) is recorded via outcome_scope/skipped(), never as silent success; run_lint_checks has no reachable non-execution path once unconditional, and is accounted via examined()"
  - "validate_presubmit_tool_pin_escalation is sequenced and resolves its Class D contract by basename"
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: whole-tree-ruff-clean
    action: whole-tree ruff and format are clean
    command: bin/venv-python -m ruff check src/ tests/ scripts/ && bin/venv-python -m ruff format --check src/ tests/ scripts/
    expected: both exit 0; zero ISC004 diagnostics
    fix_if: any ISC004 remains, or the parenthesization left formatting ruff would rewrite
  - step: 2
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: pin-only-set-lints-whole-tree
    action: >-
      unit altitude -- a pin-only changed set still lints the whole tree, and the deleted
      diff-scoped branch is unreachable
    command: bin/venv-python -m pytest "tests/validate/test_lint_targets.py::TestRunLintChecksWholeTreeTargets::test_pin_only_changed_set_still_lints_whole_tree" -v
    expected: >-
      the new case passes: run_lint_checks emits src/ tests/ scripts/ in its ruff argv when handed a
      changed set of only the five requirements pin files from commit 1c50e26b. Red-before is
      target_absent (the node id does not exist yet). The three RETARGETED tests that pinned the
      .py filter and the two early returns are exercised whole at steps 3 and 4, not here -- this
      step is deliberately node-id-scoped so it is genuinely red on the un-implemented tree rather
      than passing tautologically on the existing suite.
    fix_if: run_lint_checks still filters targets to .py or early-returns on an all-non-.py set
  - step: 3
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: pre-driver-pin-only-diff-lints-whole-tree
    action: >-
      driver altitude -- replay commit 1c50e26b's actual five-file pin-only diff through the --pre
      driver and assert the emitted ruff argv is whole-tree
    command: >-
      bin/venv-python -m pytest
      "tests/validate/test_tiers.py::TestPreModeDiffAware::test_pin_only_diff_drives_whole_tree_lint" -v &&
      bin/venv-python -m pytest tests/validate/test_lint_targets.py -v
    expected: >-
      a --pre run whose changed set is exactly requirements.in, requirements.txt, requirements-dev.in,
      requirements-dev.txt, requirements-fast.txt emits a ruff argv containing src/ tests/ scripts/
    fix_if: >-
      the assertion lives only at the run_lint_checks unit level -- a call-site re-scoping at
      scripts/validate.py:325 would then pass the whole VP, which is the exact shape rec-3863's
      gap_explanation names
  - step: 4
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: precommit-escalates-on-derived-global-input
    action: pre-commit escalation fires on a derived global input and not otherwise
    command: >-
      bin/venv-python -m pytest
      "tests/validate/test_scaffold_gates.py::TestRunPrecommitChecksEscalation" -v &&
      bin/venv-python -m pytest tests/validate/test_scaffold_gates.py -v &&
      bin/venv-python -m pytest tests/checks/deps/test_validate_presubmit_tool_pin_escalation.py -v
    expected: >-
      run_precommit_checks is called with all_files=True for a .pre-commit-config.yaml change and
      all_files=False for an ordinary .py change; the trigger set is DERIVED by parsing
      .pre-commit-config.yaml rather than read from a hard-coded path roster; it is derived at the
      BASE REF, so a PR cannot weaken its own trigger; and an unreadable or unparseable base-ref
      config escalates rather than skips
    fix_if: >-
      the trigger set is a hard-coded path roster, is read from head instead of base ref, or fails
      open on a parse error
  - step: 5
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      argv head is -m scripts.validate -- vp-red-before.yaml#recursion_refusal refuses a graduate
      disposition on a step that re-enters the validator.
    action: Class D contract and evaluator satisfy the population gate, and the plan itself passes --pre
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0; validate_contract_drift accepts subject uniqueness and evaluator resolution,
      validate_graduation_completeness and validate_plan_documents both pass on this plan
    fix_if: the evaluator module lacks the contract basename as an executable-context string literal
  - step: 6
    phase: pre-deploy
    graduation: waive
    graduation_waiver_reason: >-
      argv head is -m scripts.validate -- recursion refusal applies identically to the full tier;
      Decision 163 requires the step to exist, not to graduate.
    action: full tier green before handoff (Decision 163)
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: any check fails
  - step: 7
    phase: post-deploy
    graduation: not-applicable
    action: >-
      RUN IMMEDIATELY AFTER PR2 MERGES, BEFORE PR3 OPENS -- the shard this token names lands with
      PR2, and the fix sha must be PR2's squash commit. Close rec-3861 with a fix-bound closure
      artifact (closure obligation 12k). The Resolves:
      trailer alone CANNOT close these: close_recs_from_trailer threads only closure_fix_sha into
      update_rec, never closure_artifact, and both recs are escape-classified (escape_class
      no-edge), so assert_closure_obligation raises ClosureArtifactRequired and rec-autoclose.yml
      catches it, prints the refusal marker and leaves the rec OPEN at exit 0.
    command: >-
      git fetch origin main --quiet && bin/venv-python -m scripts.ops_data_portal --update-rec rec-3861 --status closed
      --closure-artifact "shard:pin-only-set-lints-whole-tree"
      --closure-fix-sha "$(git rev-parse origin/main)" --profile agent_platform
    expected: the portal accepts the write; rec-3861 reads status closed
    fix_if: >-
      ClosureArtifactRequired is raised, and the refusal is SILENT -- rec-autoclose prints a marker
      and exits 0, so the rec simply stays open. In THIS three-PR plan the leading cause is an
      origin/main that has advanced PAST the shard-bearing commit: closure_gate._fix_commit_touches
      diff-trees the fix sha for an intersection with
      config/agent/verification_registry/entries/pin-only-set-lints-whole-tree.yaml, which lands in
      PR2 only -- run these steps after PR3 and origin/main resolves to PR3's squash sha, whose
      diff-tree does not contain that file. Hence the run-after-PR2 sequencing above. Secondary
      cause: a STALE origin/main (the local ref lags a remote squash-merge until fetched), which the
      explicit fetch above addresses. Tertiary: the shard never landed, or the token does not match
      the entries/<id>.yaml filename.
  - step: 8
    phase: post-deploy
    graduation: not-applicable
    action: >-
      RUN IMMEDIATELY AFTER PR2 MERGES, BEFORE PR3 OPENS (same reason as step 7). Close rec-3863
      with the same fix-bound closure artifact.
    command: >-
      git fetch origin main --quiet && bin/venv-python -m scripts.ops_data_portal --update-rec rec-3863 --status closed
      --closure-artifact "shard:pin-only-set-lints-whole-tree"
      --closure-fix-sha "$(git rev-parse origin/main)" --profile agent_platform
    expected: the portal accepts the write; rec-3863 reads status closed
    fix_if: as step 7 -- leading cause is an origin/main advanced past PR2, secondary is a stale ref
  - step: 9
    phase: post-deploy
    graduation: not-applicable
    action: >-
      read back both recs through the portal to confirm closure landed (run with steps 7-8, after
      PR2, before PR3)
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl')];
      m={r['id']: r['status'] for r in rows if r['id'] in ('rec-3861','rec-3863')};
      print(m); assert m.get('rec-3861')=='closed' and m.get('rec-3863')=='closed', m"
    expected: "both ids print status closed; the assert does not raise"
    fix_if: >-
      either rec is still open -- re-run steps 7/8 and read the refusal marker. Note the portal's
      own --sync flag is used here: AGENTS.md's Single Portal Invariant forbids calling
      scripts.sync.ops or any pull CLI directly.

