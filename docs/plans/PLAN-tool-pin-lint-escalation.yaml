schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "tool-pin-lint-escalation"
intent: >-
  Close the two open Critical CI-RCA recs by fixing the 38 ruff ISC004 violations that ruff 0.16.7
  exposed, and close the presubmit gate gap that let a linter-version bump reach main unlinted --
  so a tool whose behaviour changes globally can no longer escape the fast tier by touching no .py file.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-tool-pin-lint-escalation.yaml
phase: T1.13
scope:
  - file: scripts/checks/_scaffolding.py
    action: Modify
    purpose: >-
      run_lint_checks becomes unconditional whole-tree; run_precommit_checks gains the derived
      global-input escalation; both replace silent early returns with outcome_scope accounting
  - file: scripts/checks/deps/validate_presubmit_tool_pin_escalation.py
    action: Create
    purpose: Class D evaluator -- reads the new contract by basename and asserts the escalation mechanism
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: register the new check Entry (sequenced, so the Decision 168 evaluator resolves)
  - file: docs/contracts/presubmit-tool-pin-escalation.yaml
    action: Create
    purpose: Class D mechanism contract -- whole-tree lint rule and tool-pin escalation semantics
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: route whose topic equals the new contract subject (Decision 168 clause 4)
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
