execution_steps:
  - >-
    THREE PRs, in this order. Each must be independently green on --pre; the sequencing exists
    because three files are at or near their size budget TODAY and this plan's own edits push them
    over. Decomposing first is the Decision 128 decompose-by-default remedy; a budget raise is NOT
    available, because a raise marker must name an AUTHORIZING Decision (Decision 165) and this
    plan deliberately mints none.
  - >-
    PR1 (decomposition; no gate edits and no behaviour change). ONE EXCEPTION to "no ISC004": PR1
    MUST also parenthesize the three ISC004 sites at test_validate_raises_discrimination.py:239,
    258 and 266. They sit inside TestCallShapeMatrix, the class PR1 deliberately RETAINS, so PR1
    touches that file and --pre's diff-scoped lint (still diff-scoped until PR2) lints it in full
    and fails on them. Verified: ruff check over PR1's three touched files reports exactly those 3
    errors; ruff format --check is clean. Final SLOC is unaffected (~353 + 6 = ~359). Extract
    TestReportOnly/TestRegistrationSurfaces/TestLiveTreeInvariants from
    test_validate_raises_discrimination.py (499) into test_validate_raises_reporting.py; extract
    TestPreGlobMatch/TestShouldRunInPre/TestPreGlobsGateEndToEnd from test_tiers.py (492) into
    test_pre_globs.py; extract TestRunCoverageCheck/TestVerifierCoverageArgv/
    TestRunDependencyChecks/TestRunCoverageCheckSysPathInjection from test_scaffold_gates.py (456)
    into test_scaffold_coverage.py. No assertion may change in PR1, so any red is a move error, not
    a behaviour question. TWO EXTRACTION HAZARDS, both on the hygiene file only (the other two
    files' helpers come from tests/fixtures/, which is guard-exempt): (i) the three extracted
    classes use module-level privates (_write, _module_source, _live_sites/_LIVE_SITES) and seven
    constants (_ROOT, _CHECK, _SHARD, _SHARD_PATH, _TAXONOMY_PATH, _BASELINE_PATH, _MODULE_PATH)
    plus guard/registry/measure_check/ENTRIES/yaml. validate_no_cross_test_imports (BOTH tiers)
    forbids importing them from the source module, so they must be DUPLICATED into the new module,
    including a second guard.scan_tests(_ROOT) whole-tests-tree walk. (ii) _live_sites/_LIVE_SITES
    and several imports go dead in the source module -- an F401 sweep is owed there
    (tests/CLAUDE.md:73 names this exact hazard).
  - >-
    PR1 SHARD HAZARD (rec-3812's failure mode): two live verification-registry shards bind node ids
    in these files and would dangle if the bound classes move. tests/validate/test_tiers.py::
    TestPreModeRegistryIsolation (pre-tier-registry-isolation-guard.yaml) and
    tests/validate/test_scaffold_gates.py::TestEnsureFreshDqResults::
    test_ensure_fresh_dq_fails_closed_on_a_non_matching_exception (dq-unavailable-records-skip.yaml)
    MUST STAY at their current paths. The extraction lists above are chosen to leave both in place,
    so no shard edit is owed. Re-grep config/agent/verification_registry/entries/ before moving
    anything not on those lists.
  - >-
    PR2 (the hotfix -- closes rec-3861 and rec-3863, un-reddens main). Fix the 38 ISC004 sites by
    parenthesization. A `ruff check --select ISC004 --fix --unsafe-fixes` sweep is permitted ONLY
    because every site was reviewed at plan time and confirmed intentional. Diff-review against the
    invariant that matters -- 38 SITES changed, all parenthesization, ZERO comma insertions and zero
    string joining. Do NOT assert a hunk count: the sweep leaves continuation-line indentation that
    `ruff format` then rewrites, so the post-format diff legitimately exceeds 38 hunks.
  - >-
    PR2: rewrite run_lint_checks -- drop the .py filter and both early returns; lint src/ tests/
    scripts/ unconditionally from a single shared target constant so the two tiers cannot drift.
