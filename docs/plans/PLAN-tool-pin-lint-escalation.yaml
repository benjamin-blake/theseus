      shard dq-unavailable-records-skip.yaml binds
      ::TestEnsureFreshDqResults::test_ensure_fresh_dq_fails_closed_on_a_non_matching_exception.
      PR2 retargets one pinning test here; PR3 adds the escalation and accounting cases.
  - file: tests/validate/test_scaffold_coverage.py
    action: Create
    purpose: >-
      PR1 -- receives TestRunCoverageCheck, TestVerifierCoverageArgv, TestRunDependencyChecks,
      TestRunCoverageCheckSysPathInjection
