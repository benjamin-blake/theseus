  - file: tests/validate/test_scaffold_gates.py
    action: Modify
    purpose: >-
      PR1 decomposition (456 SLOC; the escalation + Decision 170 accounting cases would take it to
      ~520). Extract TestRunCoverageCheck, TestVerifierCoverageArgv, TestRunDependencyChecks and
      TestRunCoverageCheckSysPathInjection. MUST KEEP TestEnsureFreshDqResults at this exact path --
