pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - Re-confirm the open tf_convergence_stale count before VP step 7; it was 23 at planning time
execution_steps:
  - "Create scripts/rec_episode.py: find_rec(rows_or_source, *, source, statuses=('open',), sub_key=None) with the missing-key assertion, decide() re-homed from assess.escalation_action, and run_episode() with build_fields/build_update/build_close hooks plus suppress_file."
  - "Write tests/test_rec_episode.py first (red): the missing-key assertion, the four decide states, the sub_key arm, build_update returning None as a no-op, and the named('open_recs')+source/status class guard."
  - "Migrate scripts/convergence_health/escalate.py onto run_episode; delete _fetch_open_recs; keep all per-condition text and _condition_from_existing_rec."
  - "Migrate both code_drift sensors onto run_episode; delete their hand-rolled finders."
  - "Migrate budget_ingest + _budget_recs: delete the duplicate _fetch_open_recs, move the (branch, phase) match onto find_rec's sub_key arm, and simplify _is_open_budget_breach_row to a direct status/source check."
  - "Re-home escalation_action into rec_episode.decide with a re-export from assess.py; drop _fetch_open_recs from the facade imports and __all__."
  - "Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)."
  - "Run VP step 7's cleanup only after steps 1-6 pass, and enumerate the 22 closed rec ids in the PR body."
  - "Report: what was implemented, verification results."
work_areas: []
rollback: >-
  The migration is additive-then-subtractive: reverting the commit restores _fetch_open_recs and the
  hand-rolled finders. The VP step 7 rec closures are NOT reverted by a code revert -- they are
  warehouse writes; reopening them, if ever needed, is a deliberate update_rec per id from the
  enumerated list in the PR body.
