constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Do NOT widen the `open_recs` verb's SQL. Its registered purpose is the preflight tally and
    tests/test_session_preflight_cache_serving.py::TestVerbEquivalence::test_open_recs_equivalence
    pins a client-side mirror to its exact projection. The defect is reusing a tally verb as a
    dedup-lookup verb, not the verb.
  - >-
    Do NOT register a new NAMED_READS verb for this. src/common/ducklake_scd2_schema.py is bundled
    into all five DuckLake Lambdas, so adding one escalates this to V3 behind the governed
    deploy-ducklake-lambdas channel plus a NAMED_READS_VERSION / _NAMED_READS_VERSION_PIN bump --
    disproportionate when an already-sanctioned structural read returns every needed column.
  - >-
    Do NOT use recs_by_title_prefix as the lookup key even though it projects id/title/status/source.
    Its SQL is `WHERE title LIKE ?` with no client-side wildcard: a bare prefix returns zero rows
    (verified live), which is the same silent-zero failure this plan exists to remove. It also keys
    dedup on presentation text, and escalate.py carries THREE titles for the single source
    tf_convergence_stale.
  - >-
    The scoped read must use the structural single-key form `source = '<value>'`; the client parses
    it into a {column, value} pair (Decision 84 I-3, rec-2170) and never interpolates SQL.
  - Reads transit the DuckLake reader; writes transit file_rec/update_rec. The local JSONL is never a write source.
  - One read per `source` per invocation, sub-keyed locally for multiple episodes under one source. Do not build a cross-source cache.
  - >-
    scripts/ci_rca/probe_health.py:134 carries a third escalation_action copy, documented there as an
    identical truth table. It is deliberately OUT of scope -- it is a ci_rca-lane consumer with its
    own lifecycle contract. Note it, do not migrate it here.
