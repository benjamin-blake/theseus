schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "episode-lookup-primitive"
intent: >-
  Close a documented, partially-repaired defect class: three scheduled-monitor dedup lookups filter
  on `source`/`status` against a verb that projects neither, so each always returns None and re-files
  instead of updating. Replace the bulk-fetch-then-client-filter shape with one scoped episode
  primitive every rec-governance monitor calls, and make the wrong read unreachable rather than safer.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-episode-lookup-primitive.yaml
phase: >-
  Bundle 2a of 3 (keystone for 2b, PLAN-backlog-health-detection, which builds its four-class
  escalator on this primitive). Resolves rec-3563, which filed this defect on 2026-09-04 and
  explicitly sequenced the call-site fix as a follow-on. Names no tier_item, so the Tier Item
  Freshness Gate is skipped (soft-warn exception category: ad_hoc_rec).
scope:
  - file: scripts/rec_episode.py
    action: Create
    purpose: >-
      The shared episode primitive: find_rec (scoped read + status/sub-key filter + a runtime
      assertion that the rows carry every key the predicate filters on), decide (re-homed
      escalation_action), run_episode (file/update/close orchestration with build_fields /
      build_update / build_close hooks and a suppress_file flag), plus a main() carrying ONLY the
      read-only --probe/--count diagnostics. No destructive verb lives here (see the sibling
      module). Flat, not a package and not under scripts/ops_portal/: map_source_to_test resolves
      this to tests/test_rec_episode.py, while scripts/ops_portal/** returns None by Decision 124
      and would leave the primitive outside the per-file coverage floor.
  - file: scripts/rec_episode_dedupe.py
    action: Create
    purpose: >-
      The one-time duplicate cleanup, deliberately SEPARATE from the shared primitive: --propose
      prints the keeper and the ids it would supersede and writes nothing; --confirm performs the
      closes. A migration is not a durable verb, and lodging a bulk destructive close inside a
      primitive three monitors import would leave it permanently reachable. Flat module, so it maps
      to tests/test_rec_episode_dedupe.py and is deletable once the migration is done.
  - file: scripts/convergence_health/escalate.py
    action: Modify
    purpose: >-
      Migrate escalate() onto run_episode; DELETE both _fetch_open_recs and
      find_open_convergence_stale_rec (not patch them -- a callerless patched helper preserves the
      bulk-fetch-then-client-filter shape). Titles, contexts, acceptance probes, resolutions and
      _condition_from_existing_rec stay here.
  - file: scripts/convergence_health/code_drift.py
    action: Modify
    purpose: >-
      Migrate both sensors (detect_ducklake_code_drift, detect_prod_code_drift) onto run_episode and
      DELETE find_open_ducklake_drift_rec / find_open_prod_drift_rec. Two single-condition sensors
      are the honest test that the primitive is not escalate-shaped.
  - file: scripts/convergence_health/assess.py
    action: Modify
    purpose: Re-home escalation_action into rec_episode.decide; keep a re-export so existing importers are unaffected.
  - file: scripts/convergence_health/budget_ingest.py
    action: Modify
    purpose: >-
      Drop the `from scripts.convergence_health.escalate import _fetch_open_recs` import and call the
      primitive. Currently 462 SLOC against the hard 500 limit (38 headroom) -- the migration should
      shrink it; if any edit would cross 500, decompose (Decision 128), never raise.
  - file: scripts/convergence_health/__init__.py
    action: Modify
    purpose: >-
      Remove FOUR names, not one: _fetch_open_recs plus find_open_convergence_stale_rec (imports at
      :64,:65 via code_drift and :76 via escalate) and find_open_ducklake_drift_rec /
      find_open_prod_drift_rec, and their __all__ entries at :123-125. Deleting the finders without
      the matching facade edits makes `import scripts.convergence_health` raise ImportError.
  - file: scripts/checks/_budget_recs.py
    action: Modify
    purpose: >-
      Delete this module's own duplicate _fetch_open_recs copy, migrate _find_open_budget_breach_rec
      onto find_rec's sub_key arm, and simplify _is_open_budget_breach_row back to a straight
      status/source check now that the rows actually carry both. Its docstring's diagnosis of the
      defect becomes the rationale comment, not a workaround.
  - file: scripts/checks/hygiene/validate_episode_lookup_projection.py
    action: Create
    purpose: >-
      The class guard as a REGISTERED check, not a pytest: a module under scripts/ may not filter a
      `named("<verb>")` RESULT on a key VERB_FIELDS says that verb does not project. Must be
      DATA-FLOW linked, not module-level co-occurrence -- scripts/preflight/recs_cache.py holds
      named("open_recs") at :216 and a `status == "open"` filter at :28 on DIFFERENT data paths and
      is correct code the guard must not flag, without resorting to an allowlist. A pytest would be
      diff-selection-dependent (a PR editing convergence_health/escalate.py does not select
      tests/test_rec_episode.py under Decision 135's affected-set selector), so the guard would
      silently not run at the exact moment it matters. Precedent:
      scripts/checks/hygiene/validate_no_cross_test_imports.py. MUST declare
      registry.examined(n)/registry.skipped(reason) on every reachable exit path (Decision 170) --
      config/check_accounting_baseline.yaml is frozen and shrink-only, so it can never join it.
  - file: scripts/checks/hygiene/_manifest.py
    action: Modify
    purpose: >-
      Register the check with pre=True, pre_globs=("scripts/**",) and full_segment="full_after_lint".
      module=/attr= must be BARE STRING LITERALS (Decision 169) or scripts.dependency_graph's AST
      edge scan severs the driver->check edge.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: A function_to_category row for the new check (code_regression), which its registration requires.
  - file: tests/checks/hygiene/test_validate_episode_lookup_projection.py
    action: Create
    purpose: >-
      Mirror test for the guard -- fires on the pre-migration shape, passes on the migrated tree,
      does NOT fire on the recs_cache.py two-path shape, and declares on every exit path.
  - file: tests/test_rec_episode.py
    action: Create
    purpose: >-
      Mirror test for the primitive -- the four decide states, the runtime missing-key assertion,
      the sub_key arm, run_episode's three hooks (including build_update returning None as a no-op),
      and main()'s --probe/--count paths. The repo-wide projection guard lives in the registered
      check, not here.
  - file: tests/test_rec_episode_dedupe.py
    action: Create
    purpose: >-
      Mirror test for the cleanup module -- keeper selection is newest-per-(source, title), --propose
      writes nothing, and --confirm closes exactly the proposed set.
  - file: tests/convergence_health/test_escalate.py
    action: Modify
    purpose: >-
      Remove the pytest.mark.xfail(strict=True) at :21 -- a strict xfail that starts passing FAILS
      the suite. RETAIN the class name TestFindOpenConvergenceStaleRec, re-pointed at the primitive's
      behaviour, because rec-3563's acceptance probe names that node id verbatim. Add the red/green
      case: a scoped lookup finds the already-open tf_convergence_stale rec where the old path
      returned None, and _fetch_open_recs is absent from scripts.convergence_health.__all__.
  - file: tests/convergence_health/code_drift/test_ducklake.py
    action: Modify
    purpose: Red/green that the ducklake sensor's dedup lookup now matches an open ducklake_code_drift rec.
  - file: tests/convergence_health/code_drift/test_prod.py
    action: Modify
    purpose: Red/green that the prod sensor's dedup lookup now matches an open prod_code_drift rec.
  - file: tests/convergence_health/test_assess.py
    action: Modify
    purpose: Assert escalation_action still resolves through the assess re-export after the re-home.
  - file: tests/checks/test__budget_recs.py
    action: Modify
    purpose: >-
      Cover the simplified _is_open_budget_breach_row and the removal of the duplicate
      _fetch_open_recs. Currently 490 SLOC against the hard 500 limit -- only 10 lines of headroom
      while this row ADDS coverage. If the additions cross 500, decompose via a
      _CONCERN_SPLIT_TEST_PACKAGES registration (Decision 128), never a budget raise.
  - file: tests/convergence_health/budget_ingest/test_ingest.py
    action: Modify
    purpose: >-
      Three patch sites target the module attribute this plan deletes --
      patch("scripts.convergence_health.budget_ingest._fetch_open_recs", ...) at :92, :151 and :167,
      plus a fetch.assert_called_once_with(profile="agent_platform") pin. Left unedited, patch raises
      AttributeError.
  - file: tests/convergence_health/budget_ingest/conftest.py
    action: Modify
    purpose: >-
      Owns LIVE_OPEN_REC_KEYS, _rec() ("in the shape the open_recs verb really returns: the five
      projected columns"), _live_open() and _ToyWarehouse.open_recs -- the fixture layer encoding the
      exact projection find_rec replaces. All six files in the package import from it, and
      map_source_to_test resolves budget_ingest.py to this DIRECTORY, so the coverage floor is
      package-wide.
bundled_recommendations: ["rec-3563"]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A scoped episode lookup returns the already-open rec for a source that has one, where the
    pre-change path returned None -- proven live against the warehouse for tf_convergence_stale.
  - >-
    The registered guard flags a module that filters a named-verb RESULT on a key that verb does not
    project, and does NOT flag scripts/preflight/recs_cache.py, whose two uses sit on different data
    paths.
  - >-
    find_rec raises loudly when handed rows lacking a key its predicate filters on, instead of
    returning None.
  - >-
    None of _fetch_open_recs, find_open_convergence_stale_rec, find_open_ducklake_drift_rec or
    find_open_prod_drift_rec remains defined under scripts/ or exported from the convergence_health
    facade, and `import scripts.convergence_health` succeeds.
  - >-
    Every open tf_convergence_stale rec except one keeper per (source, title) is closed as
    superseded naming its keeper, and the surviving open count equals the number of distinct titles
    in that population. Expressed relationally on purpose: at planning time the 23 open recs span
    TWO titles (14 persistently_red, 9 stale_green_backlog), so the deterministic rule closes 21 and
    leaves 2 -- not the 22/1 an earlier draft assumed.
  - rec-3563 is closed, and its acceptance probe still names a node id that exists.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the primitive's missing-key assertion fires rather than silently returning None.
    command: "bin/venv-python -m pytest tests/test_rec_episode.py::test_find_rec_raises_when_filtered_key_absent -q"
    expected: "1 passed -- find_rec raises on rows lacking `source`/`status`"
    fix_if: "Exit 4 means the test is unwritten; a pass before the primitive exists means the assertion is not discriminating."
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-episode-missing-key-raises
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the registered guard is data-flow precise -- it fires on the defect shape and does not
      fire on the correct two-path shape.
    command: "bin/venv-python -m pytest tests/checks/hygiene/test_validate_episode_lookup_projection.py -q"
    expected: "All pass, including the case asserting scripts/preflight/recs_cache.py is NOT flagged."
    fix_if: "A recs_cache.py false positive means the guard is doing module-level co-occurrence rather than linking the named() result to the filter expression."
    hermetic: true
    graduation: graduate
    graduation_check_id: episode-lookup-projection-guard
  - step: 3
    phase: pre-deploy
    action: Dispatch the guard through the real check registry, not just its mirror test.
    command: "bin/venv-python -c \"from scripts.checks import registry; f=[]; registry.resolve('validate_episode_lookup_projection')(f); raise SystemExit(1 if f else 0)\""
    expected: "Exit 0 -- resolvable through its _manifest.py Entry and clean against the migrated tree."
    fix_if: "A resolution error means the Entry is missing or its module=/attr= are not bare string literals (Decision 169)."
    hermetic: true
    graduation: graduate
    graduation_check_id: episode-lookup-guard-registry-dispatch
  - step: 4
    phase: pre-deploy
    action: >-
      Red/green the convergence-stale dedup lookup, on the node id rec-3563's own acceptance probe
      names, with the strict xfail removed.
    command: "! grep -q 'xfail(strict=True' tests/convergence_health/test_escalate.py && bin/venv-python -m pytest tests/convergence_health/test_escalate.py::TestFindOpenConvergenceStaleRec -q"
    expected: "The xfail is gone and the class passes. This is rec-3563's acceptance command verbatim."
    fix_if: "Exit 4 means the class name was renamed or deleted -- rec-3563's oracle then names a symbol that no longer exists."
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-3563-dedup-blindness-closed
  - step: 5
    phase: pre-deploy
    action: Prove all four deleted symbols are unreachable and the facade still imports.
    command: "bin/venv-python -c \"import scripts.convergence_health as c; bad=[n for n in ('_fetch_open_recs','find_open_convergence_stale_rec','find_open_ducklake_drift_rec','find_open_prod_drift_rec') if n in c.__all__ or hasattr(c,n)]; raise SystemExit(1 if bad else 0)\" && ! grep -rnE 'def (_fetch_open_recs|find_open_convergence_stale_rec|find_open_ducklake_drift_rec|find_open_prod_drift_rec)' scripts/"
    expected: "Exit 0 -- the facade imports cleanly, exports none of the four, and no definition survives under scripts/."
    fix_if: "An ImportError means a facade import line was missed; a surviving definition means a caller was not migrated."
    hermetic: true
    graduation: graduate
    graduation_check_id: episode-finders-fully-removed
  - step: 6
    phase: pre-deploy
    action: Run every migrated consumer's mirror home, including the whole budget_ingest package.
    command: "bin/venv-python -m pytest tests/convergence_health tests/checks/test__budget_recs.py tests/test_rec_episode.py tests/test_rec_episode_dedupe.py -q"
    expected: "All pass -- both drift sensors, the budget_ingest package (its conftest fixtures updated), and the assess re-export survive the migration."
    fix_if: "An AttributeError from a patch() site means test_ingest.py's three _fetch_open_recs patches were not repointed."
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A breadth regression selector over four already-mirrored homes; the per-behaviour assertions
      it runs are owned by those homes' own coverage floor, and steps 1-5 graduate the five
      primitives this plan actually introduces. A sixth kernel entry would re-run them without
      adding discrimination.
  - step: 7
    phase: pre-deploy
    action: Confirm the two files nearest the SLOC cap did not cross it.
    command: "bin/venv-python -m scripts.checks.sloc.sloc_limits 2>/dev/null || bin/venv-python -c \"from scripts.checks import registry; f=[]; registry.resolve('validate_sloc_limits')(f); raise SystemExit(1 if f else 0)\""
    expected: "Exit 0 -- notably tests/checks/test__budget_recs.py (490 at planning time) and scripts/convergence_health/budget_ingest.py (462) stay under 500."
    fix_if: "A breach means decompose that file (Decision 128), never add a budget raise."
    hermetic: true
    graduation: graduate
    graduation_check_id: episode-migration-sloc-clean
  - step: 8
    phase: pre-deploy
    action: >-
      Pre-handoff full-tier validation. Required because this plan declares
      handoff_policy.full_validation_required_before_commit (Decision 163 clause 2, enforced by
      validate_handoff_full_tier in both presubmit tiers -- verified failing against this plan
      before this step was added).
    command: "bin/venv-python -m scripts.validate"
    expected: "Exit 0 -- the complete tier, including validate_handoff_full_tier itself and the new guard in full_after_lint."
    fix_if: "Do not commit on a timeout or partial run (timeout_disposition: blocked); resume later and rerun the full tier from the start."
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Live proof against the warehouse: the scoped lookup finds the open tf_convergence_stale rec
      the pre-change path could not see.
    command: "bin/venv-python -m scripts.rec_episode --probe tf_convergence_stale"
    expected: "Prints the matched rec id and exits 0. Before the change the equivalent lookup returned None."
    fix_if: "Exit non-zero or 'no open rec' means the scoped read is not binding `source` structurally; check _parse_single_key_filter."
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Verify rec-3563 closed after the merge.
    command: "bin/venv-python -m scripts.sync.ops pull && grep -q '\"id\": \"rec-3563\"' logs/.recommendations-log.jsonl && ! grep -E '\"id\": \"rec-3563\".*\"status\": \"open\"' logs/.recommendations-log.jsonl"
    expected: "rec-3563 present in the refreshed cache and no longer open (closed by the Resolves: trailer via rec-autoclose.yml)."
    fix_if: "Still open means the squash-merge body omitted the Resolves: rec-3563 trailer; close it through the portal."
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      RUN AFTER MERGE, not before. PROPOSE the duplicate closures -- prints the keeper per (source,
      title) and the ids it would supersede, and writes nothing. Decision 103 requires a semantic
      verdict (duplicate/superseded) to produce a close_proposal for human confirmation before any
      close; the operator's standing direction licensed the RULE, this step puts the LIST in front
      of them. Sequenced post-merge because convergence-health's hourly cron on main keeps re-filing
      until the fix lands, so a pre-merge close would race it.
    command: "bin/venv-python -m scripts.rec_episode_dedupe tf_convergence_stale --propose"
    expected: "Prints one keeper per distinct title and the ids it proposes to supersede; exits 0; no warehouse write occurs."
    fix_if: "Any write in propose mode is a hard stop. A keeper that is not the newest in its title group means selection is not deterministic."
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      STOP for operator confirmation of step 11's enumerated list and its keeper rule, paste both
      into the PR body as the confirmation artifact, then close and verify.
    command: "bin/venv-python -m scripts.rec_episode_dedupe tf_convergence_stale --confirm && bin/venv-python -m scripts.rec_episode --probe tf_convergence_stale --count"
    expected: "The proposed recs close as superseded naming their keeper; the count equals the number of distinct titles (2 at planning time)."
    fix_if: "A count above the distinct-title number means the population moved between propose and confirm; re-run step 11 and re-confirm -- never re-run this blind."
    hermetic: false
    graduation: not-applicable
