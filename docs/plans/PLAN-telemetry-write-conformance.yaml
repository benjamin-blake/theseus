    tests/telemetry/test_parser_version_registry.py::test_cases_match_index
    tests/telemetry/test_parser_version_registry.py::test_full_output_cap_agrees_with_contract -q
  expected: 'Exit 0, 5 passed. Red before: the cap node is absent.'
  fix_if: Digest drift -> the corpus changed without its history entry; cap mismatch -> align the registry to the producer and keep both <= the contract.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The registry module is already graduated by slice 3a (turn-capture-golden-corpus family); the append-only leg is diff-relative to origin/main.
- step: 7
