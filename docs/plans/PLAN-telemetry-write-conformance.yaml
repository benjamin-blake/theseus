constraints:
- Deploy-inert -- no Lambda manifest, field_semantics.yaml, terraform or workflow change; src/telemetry and src/turn_capture stay excluded from every package (Decision 79).
- src/telemetry stays stdlib-only and plane-neutral (.importlinter); src/turn_capture keeps its forbidden-import contract.
- No rule is a literal in the kernel -- every rule is projected from its contract (Decision 210 cl.3).
- Nothing from real transcripts is committed (public repo, Decision 101); every new golden case is synthetic.
- Contracts stay <= 500 effective lines by amendment_log compaction only (Decision 166 relief valve); a compacted entry is never reworded so it reads as a new entry.
- A rule real data breaks is fixed at the source -- producer or rule definition -- never demoted to DQ (Decision 210 cl.4); a definition change is a STOP back to /plan.
- No rescue agents or workaround loops (Decision 55).
