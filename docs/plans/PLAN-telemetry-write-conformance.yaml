execution_steps:
- >-
  Write the red tests first (VP steps 1, 2, 3, 5, 6, 7 nodes) and confirm each FAILS on the unchanged tree.
- >-
  Contracts: apply the envelope, transcripts, observations, sessions and lexicon amendments per their scope purposes, with
  field- and contract-level amendment_log entries; compact older amendment_log entries in telemetry_observations and
  telemetry_sessions first (summarise several entries of one plan into one shorter entry; never reword an entry into a new
  one). New dq_intent keys: not_before (a column name), max_after_write_seconds (int), full_output_cap_bytes (int),
  integrity (true) -- declared on the fields they bind; exactly_one_of on content lists the three fields. Append the two
  dated annotations to Decisions 207 and 199 and regenerate docs/decisions-index.json.
- >-
  Projection and kernel: extend the projection per its scope purpose (one rule map per column plus table_rules), then
  rules.py, gate.py typed errors, append.py prepare/execute and compare_excluded, timestamps.py parse_wire_timestamp. The
  kernel checks run in this order per row: unknown/derived columns, type gate, not-null, required_when, accepted values,
  exactly-one-of, integrity/threshold/cap, orderings, write-time skew (created_timestamp is minted once per call, so an
  identical retry is judged against a LATER created_timestamp and a row that passed once passes again -- monotone).
- >-
  Producer v2: session_pin earliest; PinOrderError when a cursor exists and any root record's timestamp is earlier than
  the cursor's pinned session_started_at; transcripts V/F per the scope purpose (scrub BEFORE hashing and sizing, exactly
  as today; the omission row's hash/size stream the scrubbed full text chunk by chunk without holding more than the cap in
  memory); observations output_*; refs full_output_ref; FULL_OUTPUT_CAP_BYTES = 8388608 in record_turn.py, equal to the
  registry value by test. PARSER_VERSION 2.
- >-
  Regenerate every golden case's expected_rows from the implementation, review each changed row against the pinned rules
  (never accept generated output unread), add the three new cases, then write the registry's v2 history entry with the
  new digest.
- Execute Verification Plan steps 1-10 -- loop until pass (Decision 55).
- Write the registry rows for graduated steps 1, 2, 3 and 5 (check ids as declared on each step).
- >-
  Portal bookkeeping (get_rec_write_guidance first, Decision 66; fetch-before-update via rec_by_id; prepend a dated note,
  never overwrite): rec-4024 gains '[SLICE 2A-1 DELIVERED <date> via PLAN-telemetry-write-conformance]' naming what
  landed and that the writer verb, registration, dimensions, blob route and smoke proof remain (2a-2); rec-4026 gains a
  note that its producer items for the tool-result policy, MCP overflow and the pin landed here, leaving hooks, cursor
  persistence and the capability handshake.
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence),
  each reported on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness. (b) Set
  implementation_declared true, commit, git fetch origin main and git rebase origin/main (STOP on conflict). (c) VP step 11
  on the committed, rebased, clean tree, then bin/venv-python -m scripts.checks.validation_result --verify-head; on
  timeout the disposition is blocked. (d) bin/venv-python -m scripts.session.postflight --evidence. (e) Push, open the PR,
  subscribe; on green CI squash-merge with the PR body as commit_message carrying 'Resolves: rec-4137' in its own trailer
  block; then run step 12.
rollback: >-
  Revert the squash commit. Nothing is deployed and no telemetry row exists yet, so a revert restores v1 behaviour with no
  data to repair.
