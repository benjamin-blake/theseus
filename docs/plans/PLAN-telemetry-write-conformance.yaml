bundled_recommendations:
- rec-4137
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  Every declared row-local rule of the four telemetry contracts (not-null, accepted values incl. the registry-sourced
  agent_type set, required_when, exactly-one-of, event_timestamp not_before session_started_at, the 300 s write-time skew,
  content integrity/threshold/cap) is projected by the generator and rejected by the kernel before any SQL with a
  GateError naming table, rule and column; no rule is a literal in src/telemetry.
- append.py exposes prepare_batch and a transaction-agnostic execute_prepared; append_events keeps its behaviour; a grain conflict raises GrainConflictError; transcripts compare by (content_sha256, content_bytes).
- parse_wire_timestamp accepts exactly three fraction digits and rejects every other width and naive input.
- >-
  The producer emits parser_version 2: earliest-timestamp pin (PinOrderError on a later earlier record); model-visible
  tool_result content; tool_output rows or omission rows for persisted outputs incl. MCP overflow; output_* on every
  tool_call close; every golden and real row passes the kernel rules; the registry carries v2 with the regenerated digest.
- The contracts, lexicon and the two Decision annotations carry the amendments with category-6 amendment_log entries; every telemetry contract stays <= 500 effective lines.
- rec-4137 closes (stale dedupe_key docstring fixed).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Kernel row rules (fast tier, stdlib).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_rules.py::test_each_rule_kind_rejects_with_table_rule_and_column
    tests/telemetry/test_rules.py::test_required_when_and_exactly_one_of_with_omission
    tests/telemetry/test_rules.py::test_ordering_and_write_time_skew_are_monotone_on_retry
    tests/telemetry/test_rules.py::test_content_integrity_threshold_and_cap
    tests/telemetry/test_rules.py::test_rules_are_built_only_from_projection -q
  expected: 'Exit 0, 5 passed. Red before: the module does not exist.'
  fix_if: A rule passes a violating row -> fix rules.py against the pinned rule; never widen the rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-kernel-row-rules
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Rule projection from the real contracts, and fail-closed on unknown rule keys.
  command: >-
    bin/venv-python -m pytest tests/test_field_semantics_event_projection.py::test_row_rules_projected_from_contracts
    tests/test_field_semantics_event_projection.py::test_agent_type_accepted_values_come_from_source_registry
    tests/test_field_semantics_event_projection.py::test_unknown_rule_key_fails_closed -q
  expected: 'Exit 0, 3 passed. Red before: nodes absent.'
  fix_if: A contract rule missing from the projection -> add its mapping; an unknown key -> reject, never ignore.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-rule-projection
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: prepare/execute split, typed errors, hash-based transcript compare, wire timestamps (fast tier).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_append.py::test_prepare_then_execute_equals_append_events
    tests/telemetry/test_append.py::test_grain_conflict_is_typed
    tests/telemetry/test_append.py::test_transcript_representation_change_is_not_a_conflict
    tests/telemetry/test_gate.py::test_gate_errors_are_typed
    tests/telemetry/test_timestamps.py::test_wire_timestamp_requires_exactly_three_fraction_digits -q
  expected: 'Exit 0, 5 passed. Red before: nodes absent.'
  fix_if: A facade behaviour change -> restore append_events' contract; a substring-mapped error -> raise the typed class.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-kernel-prepare-execute
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Multi-table caller-owned transaction on a real local DuckLake (duckdb; integration).
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_append_ducklake_integration.py::test_four_tables_one_transaction_all_or_nothing
    tests/turn_capture/test_capture_ducklake_integration.py -m integration -q
  expected: Exit 0; the failing-third-batch case leaves no rows in any table; the golden corpus loads with every FK resolving.
  fix_if: Rows from an aborted transaction visible -> execute_prepared opened or committed a transaction; fix it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs duckdb (absent from requirements-fast.txt); the integration suite runs in the full tier.
- step: 5
  phase: pre-deploy
  action: Producer v2 behaviour and golden corpus (fast tier).
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_transcript.py::test_pin_is_earliest_parseable_timestamp
    tests/turn_capture/test_transcripts.py::test_tool_result_stores_model_visible_text
    tests/turn_capture/test_transcripts.py::test_tool_output_row_or_omission_for_persisted_output
    tests/turn_capture/test_transcripts.py::test_mcp_overflow_output_is_captured
    tests/turn_capture/test_observations.py::test_output_capture_on_every_tool_call_close
    tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
    tests/turn_capture/test_record_turn.py::test_earlier_record_after_pin_halts
    tests/turn_capture/test_record_turn.py::test_every_emitted_row_passes_kernel_rules
    tests/turn_capture/test_refs.py::test_every_ref_passes_canonical_ref -q
