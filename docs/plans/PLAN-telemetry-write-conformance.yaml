schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-write-conformance
intent: >-
  Telemetry slice 2a-1 (rec-4024 carrier, T2.36): make the telemetry contracts, the Claude Code producer and the
  plane-neutral write-boundary kernel agree, and enforce every declared row-local contract rule in the kernel before any
  SQL (the write-time enforcement Decision, PLAN-write-time-enforcement-decision) -- including the operator-approved
  tool-result capture policy (store what the model saw, the full output as its own bounded row, a typed omission above the
  cap) and the earliest-timestamp session pin a real-transcript probe showed is needed. Clean, complete, contract-bound
  turn telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); an invalid row in an append-only
  store can never be corrected in place. Deploy-inert: the writer verb, registration, dimensions, blob route and smoke
  proof are slice 2a-2.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-write-conformance.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- slice 2a-1 of rec-4024; closes NO exit criterion (c1/c2 need the tables
  provisioned and the writer verb, slice 2a-2). Moves T3.20 c4 forward (tool_call output fields, tool_output purpose) without
  meeting it. Builds on the merged slice-1 kernel (#1286), R8 (#1314) and slice 3a (#1327).
scope:
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    (1) session_started_at: pinned to the EARLIEST parseable record timestamp in the root transcript at pin time (the
    first capture pass), never the first record in file order -- SessionStart hook records are written after an earlier
    queue-operation record yet carry earlier timestamps (probe: 8 rows up to 9.87 s earlier); the value stays source-derived,
    UTC, ms-truncated and pinned once per tree; a record appended later with a timestamp earlier than the persisted pin is a
    producer HALT (never re-pinned, never emitted). (2) event_timestamp: dq_intent `not_before: session_started_at` (in-row
    ordering, write-enforced, Decision 210 cl.1) with the cross-clock-domain rule -- a producer whose event_timestamp and
    session_started_at come from different clocks (transcript-less producers, rec-4028) declares a skew allowance when it
    lands, never an exact comparison; and `max_after_write_seconds: 300` (event_timestamp later than created_timestamp by
    more than 300 s is rejected -- the skew bound the field already declared without a value). (3) governance_notes: every
    timestamp column carries its full millisecond value at the writer edge (exactly three fraction digits in the wire form),
    extending the session_started_at every-hop obligation to all timestamp columns because event_id's 48-bit prefix depends
    on event_timestamp the same way. Field- and contract-level amendment_log entries (semantic_break true, CD.25 category
    6). Stays <= 500 effective lines (389 today).
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    Tool-result capture policy (Fable consult, operator-approved 2026-09-29): (1) `content`'s semantics become the payload
    AS THE MODEL SAW IT -- for a tool_result, the in-context text including a harness preview and note when the harness
    persisted the output, never the sidecar; (2) purpose gains `tool_output`: the FULL persisted tool output as its own row
    (external_ref '<source_record_id>#<block_index>/full', same observation_ref as the tool_result row, origin tool),
    emitted only when the harness persisted the output and the sidecar is readable; (3) new field content_omitted_reason
    (VARCHAR, nullable, accepted [oversize]): set, with content and content_uri both NULL, when the payload exceeds the
    full-output cap; content_sha256/content_bytes then describe the omitted payload (streamed, never decoded); (4)
    exactly_one_of widens to {fields: [content, content_uri, content_omitted_reason]}; (5) content_truncated redefined:
    true iff the stored model-visible payload is a harness preview of a larger persisted output (the full output, when
    captured, is the sibling tool_output row); (6) sizes named on content's dq_intent: content_inline_threshold_bytes 65536
    (unchanged; also the route threshold slice 2a-2's blob grants use) and full_output_cap_bytes 8388608 (any payload
    above it becomes an omission row), plus an integrity rule (content_sha256/content_bytes equal the sha256 and UTF-8
    length of an inline content); (7) governance: the Decision 207 compared content for this table excludes content and
    content_uri (representation) -- payload identity is content_sha256 + content_bytes. Field- and contract-level
    amendment_log entries (semantic_break true on content, content_truncated, purpose, content_sha256). Stays <= 500
    effective lines (317 today).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    tool_call close rows gain four typed columns (typed, not metadata, so the rules are write-enforceable): output_capture
    (VARCHAR, accepted [not_persisted, captured, omitted_oversize, unavailable, no_result], required_when {event_kind:
    [close], observation_type: [tool_call]}); output_bytes (bigint), output_sha256 (VARCHAR, lowercase hex),
    output_lines (bigint) -- each required_when {output_capture: [not_persisted, captured, omitted_oversize]} and
    describing the tool's FULL output (the sidecar when persisted, else the model-visible text). no_result = the synthetic
    interrupted close with no tool_result; unavailable = persisted but the sidecar is unreadable. Compact older
    amendment_log entries (relief valve 1, Decision 166; never rewrite an entry so it reads as new) to stay <= 500
    effective lines (489 today); field_add amendment_log entries on the four new fields.
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    rec-4064 R1: workflow and execution_attempt become nullable true, matching their dq_intent.required_when (open rows
    only) -- the projection already treats them as nullable. Compact older amendment_log entries (relief valve 1) to stay
    <= 500 effective lines (498 today); field-level amendment_log entries.
- file: docs/contracts/telemetry-lexicon.yaml
  action: Modify
  purpose: Term-level only (Decision 95) -- add tool_output, output_capture and payload omission terms; the transcript term's content line points at the model-visible rule. amendment_log entry.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Two dated trailing-bracket annotations (Decision 177 dialect, appended, never mid-body): on Decision 207 -- for
    telemetry_transcripts the compared content is the payload identity (content_sha256, content_bytes), not the
    content/content_uri representation, so a threshold change can never turn an identical re-send into a conflict; still an
    equality compare that rejects loudly, not the content-hash tiebreak 207 rejected; and on Decision 199 clause 5 --
    content is the model-visible payload, the full persisted output is its own bounded row, and a payload above the
    8 MiB cap is a typed omission row (content_omitted_reason); detail in telemetry_transcripts.yaml.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write; never hand-edited.
- file: src/telemetry/rules.py
  action: Create
  purpose: >-
    Stdlib-only contract-derived row rules (Decision 210 cl.1/cl.3). RowRules (frozen): not_null columns,
    accepted_values per column, required_when per column (column -> {other_column: allowed values}), exactly_one_of
    groups, orderings (column not_before other column), max_after_write_seconds per column, content rules (inline
    threshold, full-output cap, integrity). check_row(table, row, rules, created_timestamp) raises gate.GateError naming
    the table, rule and column (never the value of a content column). RowRules.from_projection(columns, table_rules)
    builds them from the generator projection only -- no literal rule anywhere in the kernel.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    Add GateError(AppendError) (a row-rule or type rejection) and GrainConflictError(AppendError) (a differing row under an
    existing grain key, in-batch or stored) so callers map by type, not substring; existing raises reclassified; within-
    batch compare honours the spec's compare exclusions.
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    EventTableSpec gains rules (RowRules) and compare_excluded (created_timestamp, producer_version, plus the projection's
    table-declared exclusions -- content and content_uri for telemetry_transcripts), both from from_projection. Split into
    prepare_batch (pure: gate, rules, derivation, intra-batch collapse; raises GateError/GrainConflictError) and
    execute_prepared (one MERGE, no BEGIN/COMMIT; caller owns the transaction; converts the MERGE ERROR token to
    GrainConflictError); append_events stays the one-table facade (same signature and behaviour otherwise). Fix the stale
    dedupe_key docstring (rec-4137: it must read 'dedupe_key != [producer, event_id, parser_version]') and the module docstring's R3 line (parent existence is not a write-time check under
    the amended contract).
- file: src/telemetry/timestamps.py
  action: Modify
  purpose: >-
    parse_wire_timestamp(value): the pinned RFC 3339 profile with EXACTLY three fraction digits (rejects none, 1, 2 or
    4-9 digits and naive input, Decision 96 cl.4) -- the writer-edge decoder slice 2a-2 applies to every timestamp column.
    parse_iso8601_utc is unchanged.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Project the rules RowRules consumes: per column accepted_values (from dq_intent.accepted_values.values, whatever its
    DQ `enforced` flag, which keeps its DQ-runner meaning), required_when (existing), not_before, max_after_write_seconds;
    for a column $ref'ing source-lineage.yaml registry_key (telemetry_agents.agent_type), accepted_values = the canonical_id
    set of config/agent/data_quality/source_registry.yaml read at generation time; table_rules: exactly_one_of groups,
    content threshold/cap/integrity, compare_excluded. Fail closed on an unknown rule key or a malformed rule.
- file: src/turn_capture/transcript.py
  action: Modify
  purpose: session_pin returns the EARLIEST parseable record timestamp among the root file's lines, not the first in file order (the envelope amendment).
- file: src/turn_capture/transcripts.py
  action: Modify
  purpose: >-
    tool_result rows store the model-visible text (the block content as in the transcript), content_truncated true iff
    the output was persisted; a persisted output with a readable sidecar also emits a tool_output row (full sidecar text,
    scrubbed, then hashed and sized) or, above the cap, a tool_output omission row (hash and size of the scrubbed full
    text, streamed; content NULL; content_omitted_reason oversize); MCP overflow detection: a tool_result whose
    toolUseResult is a string and whose text names a saved output file ('Output has been saved to <path>') resolves the
    sidecar by that basename exactly as a persistedOutputPath does (today that payload is silently lost).
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    tool_call close rows carry output_capture/output_bytes/output_sha256/output_lines per the observations amendment
    (the raw full output's bytes and sha256 before scrubbing are NOT stored -- values describe the scrubbed output, the
    same bytes the tool_output row hashes); the synthetic interrupted close carries output_capture no_result.
- file: src/turn_capture/refs.py
  action: Modify
  purpose: full_output_ref(source_record_id, block_index) -> '<source_record_id>#<block_index>/full'; ROLE vocabulary gains 'full'.
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PARSER_VERSION 2 and a new PRODUCER_VERSION; a record in the root file whose timestamp is earlier than the persisted
    cursor pin raises a named PinOrderError (the producer halt; never re-pinned, never emitted); FULL_OUTPUT_CAP_BYTES =
    8388608 is a module constant equal to the registry value and <= the contract's cap (asserted by test).
- file: config/telemetry/parser_versions.yaml
  action: Modify
  purpose: >-
    claude_code current 2 with a history entry (date, golden_digest of the regenerated corpus, reason naming this plan)
    and full_output_cap_bytes 8388608 (the producer constant; must be <= the contract's full_output_cap_bytes).
