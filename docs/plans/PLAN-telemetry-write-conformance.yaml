schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-write-conformance
intent: >-
  Telemetry slice 2a-1 (rec-4024 carrier, T2.36): make the telemetry contracts, the Claude Code producer and the
  plane-neutral write-boundary kernel agree, and enforce every declared row-local contract rule in the kernel before any
  SQL (the write-time enforcement Decision, PLAN-write-time-enforcement-decision) -- including the operator-approved
  tool-result capture policy (store what the model saw, the full output as its own bounded row, a typed omission above the
  cap) and the earliest-timestamp session pin a real-transcript probe showed is needed. Clean, complete, contract-bound
  turn telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); an invalid row in an append-only
  store can never be corrected in place. Deploy-inert: the writer verb, registration, dimensions, blob route and smoke
  proof are slice 2a-2.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-write-conformance.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) -- slice 2a-1 of rec-4024; closes NO exit criterion (c1/c2 need the tables
  provisioned and the writer verb, slice 2a-2). Moves T3.20 c4 forward (tool_call output fields, tool_output purpose) without
  meeting it. Builds on the merged slice-1 kernel (#1286), R8 (#1314) and slice 3a (#1327).
scope:
- file: docs/contracts/telemetry-event-envelope.yaml
  action: Modify
  purpose: >-
    (1) session_started_at: pinned to the EARLIEST parseable record timestamp in the root transcript at pin time (the
    first capture pass), never the first record in file order -- SessionStart hook records are written after an earlier
    queue-operation record yet carry earlier timestamps (probe: 8 rows up to 9.87 s earlier); the value stays source-derived,
    UTC, ms-truncated and pinned once per tree; a record appended later with a timestamp earlier than the persisted pin is a
    producer HALT (never re-pinned, never emitted). (2) event_timestamp: dq_intent `not_before: session_started_at` (in-row
    ordering, write-enforced, Decision 210 cl.1) with the cross-clock-domain rule -- a producer whose event_timestamp and
    session_started_at come from different clocks (transcript-less producers, rec-4028) declares a skew allowance when it
    lands, never an exact comparison; and `max_after_write_seconds: 300` (event_timestamp later than created_timestamp by
    more than 300 s is rejected -- the skew bound the field already declared without a value). (3) governance_notes: every
    timestamp column carries its full millisecond value at the writer edge (exactly three fraction digits in the wire form),
    extending the session_started_at every-hop obligation to all timestamp columns because event_id's 48-bit prefix depends
    on event_timestamp the same way. Field- and contract-level amendment_log entries (semantic_break true, CD.25 category
    6). Stays <= 500 effective lines (389 today).
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    Tool-result capture policy (Fable consult, operator-approved 2026-09-29): (1) `content`'s semantics become the
    payload AS THE MODEL SAW IT -- for a tool_result, the in-context text (including a harness preview and note when the
    harness persisted the output), never the sidecar; (2) purpose gains `tool_output`: the FULL persisted tool output as
    its own row (external_ref '<source_record_id>#<block_index>/full' -- the external_ref and entity_ref governance
    notes gain this grammar; same observation_ref as the tool_result row; origin tool), emitted only when the harness
    persisted the output and the sidecar is readable; (3) new field content_omitted_reason (VARCHAR, nullable, accepted
    [oversize]): set, with content and content_uri both NULL, when the full output exceeds the cap;
    content_sha256/content_bytes of an omission row are the RAW sidecar bytes' identity (streamed, never decoded, never
    materialised whole -- nothing is stored, so there is no scrubbed payload to hash); (4) exactly_one_of widens to
    {fields: [content, content_uri, content_omitted_reason]}; (5) content_truncated redefined: true iff the stored
    model-visible payload is a harness preview of a larger persisted output (the full output, when captured, is the
    sibling tool_output row); (6) sizes on content's dq_intent: content_inline_threshold_bytes 65536 (unchanged; also
    slice 2a-2's route threshold) and full_output_cap_bytes 8388608, plus integrity (content_sha256/content_bytes equal
    the sha256 and UTF-8 length of an inline content); the threshold rule's two legs are split -- 'content_uri set
    implies content_bytes > threshold' is enforced now, while 'content set implies content_bytes <= threshold' carries a
    Decision 210 cl.3 exemption beside the rule (write_time: pending_route, reason: the blob route that makes a >64 KiB
    payload storable lands in slice 2a-2, owner rec-4024) and activates when 2a-2 removes the exemption; (7) content and
    content_uri each declare dq_intent representation_of: [content_sha256, content_bytes] -- representation-only
    columns, excluded from the grain's compared content per the data-modeling-standard amendment below. Field- and
    contract-level amendment_log entries (semantic_break true on content, content_truncated, purpose, content_sha256).
    Stays <= 500 effective lines (317 today).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    tool_call close rows gain four typed columns (typed, not metadata, so the rules are write-enforceable), all
    describing the tool's RAW full output (the sidecar bytes when persisted, else the model-visible text's UTF-8 bytes),
    computed by streaming, never decoded: output_capture (VARCHAR, accepted [not_persisted, captured, omitted_oversize,
    unavailable, no_result], required_when {event_kind: [close], observation_type: [tool_call]}); output_bytes (bigint),
    output_sha256 (VARCHAR, lowercase hex), output_lines (bigint, count of LF bytes plus one when the last byte is not
    LF and the output is non-empty) -- each required_when {output_capture: [not_persisted, captured, omitted_oversize]}.
    no_result = the synthetic interrupted close with no tool_result; unavailable = persisted but the sidecar is
    unreadable. Compact older amendment_log entries (relief valve 1, Decision 166) to stay <= 500 effective lines (489
    today): a compaction entry lives only on fields this plan does NOT otherwise change, so VP step 8 can tell
    compaction from a genuine new entry; field_add amendment_log entries on the four new fields.
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    rec-4064 R1: workflow and execution_attempt become nullable true, matching their dq_intent.required_when (open rows
    only) -- the projection already treats them as nullable. Compact older amendment_log entries (relief valve 1) to stay
    <= 500 effective lines (498 today); field-level amendment_log entries.
- file: docs/contracts/telemetry-lexicon.yaml
  action: Modify
  purpose: Term-level only (Decision 95) -- add tool_output, output_capture and payload omission terms; the transcript term's content line points at the model-visible rule. amendment_log entry.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    Rule grain-enforced-at-write (Decision 207's canonical home) gains a write_mode-scoped, class-level exclusion, never
    a table name: declared REPRESENTATION-ONLY columns -- columns whose value is a pure function of compared
    payload-identity columns, declared by dq_intent representation_of -- are excluded from the compared content, because
    the identity they represent is compared instead; still an equality compare that rejects loudly, never a tiebreak.
    amendment_log entry; version and updated_* per the file's convention. Merges after the write-time enforcement
    Decision's implementation (which adds rule write-time-enforcement to this file) -- see the pre-implementation gate.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Two dated trailing-bracket annotations (Decision 177 dialect, appended, never mid-body), each citing its detail
    home: on Decision 207 -- representation-only columns (dq_intent representation_of) are excluded from an insert-grain
    table's compared content because the payload identity they represent is compared instead (class terms, never a table
    name; still an equality compare that rejects loudly, not the content-hash tiebreak 207 rejected; detail:
    data-modeling-standard.yaml grain-enforced-at-write); and on Decision 199 clause 5 -- content is the model-visible
    payload, the full persisted output is its own bounded row, and a full output above the 8 MiB cap is a typed omission
    row (detail: telemetry_transcripts.yaml). Decision 199's entry is already over the per-entry byte norm with two
    updates, so this is its last clause-5 annotation: a further change to its content tier goes to a numbered Decision
    (decision-entry.yaml intent_accretion_note).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write; never hand-edited.
- file: src/telemetry/rules.py
  action: Create
  purpose: >-
    Stdlib-only, table-agnostic contract-derived row rules (Decision 210 cl.1/cl.3), shaped as the generic engine
    rec-4158 can reuse for other writers -- no telemetry column name or value appears in this module (asserted by an AST
    scan in test_rules.py). RowRules (frozen): not_null columns, accepted_values per column, required_when per column
    (column -> {other_column: allowed values}), exactly_one_of groups, orderings (column not_before other column),
    max_after_write_seconds per column, content rules (inline threshold with its per-leg exemption, full-output cap,
    integrity), and a rule exemption map (rule -> reason, owner) honoured exactly as the projection declares it.
    check_row(table, row, rules, created_timestamp) raises gate.GateError naming table, rule and column (never a content
    value). RowRules.from_projection(columns, table_rules) builds them from the generator projection only.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    Add GateError(AppendError) (a row-rule or type rejection) and GrainConflictError(AppendError) (a differing row under an
    existing grain key, in-batch or stored) so callers map by type, not substring; existing raises reclassified; within-
    batch compare honours the spec's compare exclusions.
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    EventTableSpec gains rules (RowRules) and compare_excluded, both from from_projection: compare_excluded = the
    envelope's write-time stamp and provenance-only columns (created_timestamp, producer_version -- structural, asserted
    by from_projection) plus every column the projection marks representation_of (content, content_uri for
    telemetry_transcripts). Literal retirement (AC1): _COMPARE_EXCLUDED here and gate.py's _COLLAPSE_IGNORED_COLUMNS
    retire in favour of spec.compare_excluded; _STRUCTURAL_NOT_NULL, _GRAIN_KEY and _ALWAYS_DERIVED STAY as
    from_projection's structural assertions of the envelope's identity invariants (they reject a malformed projection,
    they are not data rules). Split into prepare_batch (pure: gate, rules, derivation, intra-batch collapse; raises
    GateError/GrainConflictError) and execute_prepared (one MERGE, no BEGIN/COMMIT; caller owns the transaction;
    converts the MERGE ERROR token to GrainConflictError); append_events stays the one-table facade (same signature and
    behaviour otherwise). Docstrings: rec-4137 (it must read 'dedupe_key != [producer, event_id, parser_version]'); the
    module docstring's out-of-scope list drops the skew check (now in scope) and states parent existence is not a
    write-time check under the amended R3 contract.
- file: src/telemetry/timestamps.py
  action: Modify
  purpose: >-
    parse_wire_timestamp(value): the pinned RFC 3339 profile with EXACTLY three fraction digits (rejects none, 1, 2 or
    4-9 digits and naive input, Decision 96 cl.4) -- the writer-edge decoder slice 2a-2 applies to every timestamp column.
    parse_iso8601_utc is unchanged.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Project the rules RowRules consumes: per column accepted_values (from dq_intent.accepted_values.values, whatever its
    DQ `enforced` flag, which keeps its DQ-runner meaning), required_when (existing), not_before,
    max_after_write_seconds, representation_of, and any write_time exemption (reason, owner); table_rules:
    exactly_one_of groups and content threshold/cap/integrity. Registry-sourced values: resolve_refs nulls $ref
    (scripts/contracts.py), so the projection re-loads the RAW contract YAML to read each field's $ref; a field whose
    $ref is 'source-lineage.yaml#/contract/fields/registry_key' (telemetry_agents.agent_type) gets accepted_values = the
    canonical_id set of the registry named by source-lineage.yaml's top-level allowed_values.registry
    (config/agent/data_quality/source_registry.yaml), read at generation time -- no new file. Fail closed on an unknown
    rule key, a malformed rule, or an exemption without reason and owner.
- file: src/turn_capture/transcript.py
  action: Modify
  purpose: >-
    session_pin returns the EARLIEST parseable record timestamp among the root file's lines (the envelope amendment).
    The TranscriptTree protocol gains sidecar_size(basename) -> int | None and sidecar_chunks(basename) ->
    Iterator[bytes] (64 KiB chunks; FsTree streams the file, MemTree slices its bytes) so no sidecar above the cap is
    ever materialised whole.
- file: src/turn_capture/transcripts.py
  action: Modify
  purpose: >-
    tool_result rows store the model-visible text (the block content as in the transcript); content_truncated true iff
    the output was persisted. A persisted output with a readable sidecar: raw size (sidecar_size) above the cap -> a
    tool_output OMISSION row whose content_sha256/content_bytes are the raw bytes' identity (streamed via
    sidecar_chunks, never decoded, never scrubbed -- nothing is stored); otherwise read, scrub, then hash and size the
    scrubbed text; if the scrubbed text exceeds the cap (scrub markers can grow a payload by a few bytes) -> an omission
    row with the raw identity; else a tool_output row. Sidecars' cursor pin hashes by streaming (the pin value is
    unchanged: sha256 of the raw bytes). MCP overflow: a tool_result whose toolUseResult is a string naming a saved
    output file ('Output has been saved to <path>') resolves the sidecar by that basename exactly as persistedOutputPath
    does (today that payload is silently lost); a string toolUseResult that names no file is counted in diagnostics
    (unmatched_string_tool_use_result), so a harness wording change surfaces as a count, never silently.
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    tool_call close rows carry output_capture/output_bytes/output_sha256/output_lines per the observations amendment,
