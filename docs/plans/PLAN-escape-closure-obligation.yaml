  a status, or retry with a substituted artifact. VP step 17 pins this mechanically.'
- HUMAN RULING, BINDING -- duplicate_of is NOT a hatch category. It is excluded from HATCH_CATEGORIES
  and from the contract's hatch_categories entirely; a duplicate cites the class artifact directly in
  closure_artifact, existence-verified like any other closure artifact. This SUPERSEDES the plan's earlier
  'a duplicate declares the hatch category duplicate_of'. Promise transfer (a duplicate inheriting its
  master's obligation) is ALSO forbidden -- the master can still exit via the stale hatch, which rebuilds
  the laundering path. An implementer who finds this inconvenient must hand back, not re-decide it.
