acceptance_criteria:
- Closing an escape-classified rec (escape_class set OR detection_gap.escape_mode set, evaluated over
  existing UNION merged context) with neither a closure_artifact nor a well-formed closure_none_feasible_category
  + closure_none_feasible_reason pair raises ClosureArtifactRequired at the portal and performs no write.
- 'Closing one whose named closure_artifact does not resolve to an existing artifact on the tree is refused
  the same way -- the known-bad fixture. A fixture: token that resolves but sits OUTSIDE tests/fixtures/
  (fixture:README.md) is also refused: the four kinds are not equal in strength and a path that merely
  exists must not be able to discharge the obligation.'
- The historical rec-3131 case, replayed (status closed, resolution 'Duplicate of rec-3132...', no artifact,
  no hatch), is refused -- and stays refused, because duplicate_of is not a hatch category and rec-3132
  carries no citable artifact. That single refusal IS audit finding LSA-04, not a defect in the mechanism.
- A closure supplying a resolvable artifact, and a closure supplying a well-formed categorised hatch whose
  category is a MEMBER of HATCH_CATEGORIES, both succeed. A hatch whose category is well-formed but off-vocabulary
  is REFUSED -- membership, not shape, is the acceptance bar, because a shape-only check would leave Decision
  184 point 8's ratchet defeatable by typing a new category into a string.
- duplicate_of appears in NO hatch vocabulary -- neither closure_gate.py's HATCH_CATEGORIES nor docs/contracts/ci-rca-lifecycle.yaml::closure_obligation.hatch_categories
  -- and a duplicate closure passes only by citing an existence-verified closure_artifact token (never
  a rec id, so the gate resolves no rec-to-rec pointer and adds no reader egress).
- 'No promise transfer: nothing in the gate lets a duplicate inherit its master''s obligation. A test
  asserts the gate reads only the rec''s own merged context.'
- 'A closing write that blanks or rewrites context_v2_json in the SAME update_rec call cannot erase its
  own classification: context_v2_json is not in _UPDATE_CONTENT_VALIDATED_FIELDS and carries no monotonicity
  guard, so update_rec(id, {''status'': ''closed'', ''context_v2_json'': ''{}''}) must still be refused.
  The predicate is evaluated over existing UNION merged.'
- 'The bound set is {closed, declined, superseded} and ''terminal'' is defined on the FROM side: the gate
  fires on a transition INTO a bound status FROM a status not already in that set. open -> declined is
  therefore gated (closing the two-step open -> declined -> superseded route that a TO-side-only definition
  leaves open), while declined -> superseded and every status-preserving write are not, because the obligation
  was already discharged. failed is explicitly NOT bound: it is a live, non-resolved status under docs/contracts/ducklake_writer.yaml,
  from which failed -> open and failed -> declined are both legal live transitions.'
- propose_or_close_rec's deterministic-satisfied branch, which auto-closes via update_rec, RAISES ClosureArtifactRequired
  on an escape-classified rec and performs no write -- the fourth path's behaviour is specified and tested,
  not merely asserted in prose.
- docs/contracts/ci-rca-lifecycle.yaml's closure_dependency.manual_route and auto_close.timestamp_inactivity.action
  both name the new flags/kwargs, so neither documents a closure command the gate now refuses or a sweep
  call shape that no longer matches the code.
- 'print_ci_rca_back_validation lists any OPEN escape-classified rec. This is the declared mitigation
  for the refusal residual: a refused escape rec is left open with no artifact and no marker, and the
  30-day inactivity sweep will hatch it closed on stale_no_recurrence, so a surfacing point before the
  sweep is what keeps that path from being silent (see context).'
- 'The kind-strength ordering shard: > pytest: > check: > fixture: is DECLARED in the contract, and the
  residual is recorded honestly: only shard: carries the audit''s still-red-on-reintroduction property
  via the fail-on-revert differential; check: and pytest: prove existence; fixture: proves existence within
  a fixtures root. Closing the existence-vs-discrimination gap is a filed follow-on rec, not a silent
  omission.'
- propose_or_close_rec's close_proposed command string names --closure-artifact, so the printed duplicate/superseded
  proposal does not read as a bug when the gate refuses it on an escape rec.
- A status-preserving write on an already-terminal escape rec (stamp_fixed_by_sha, occurrence bump, context
  correction) is NOT gated.
- rec-autoclose.yml handles a refusal by printing a marker, skipping the rec and exiting 0 -- it never
  propagates the exception and never reddens this ci_rca:watched workflow.
- The scheduled inactivity sweep still closes an escape-classified inactive rec, satisfying the hatch
  programmatically with its stale_no_recurrence proof.
- back_validation grades each pairing by the prior rec's named artifact actually existing (VERIFIED-PRESENT
  / CONFIRMED-ABSENT / HATCHED), falling back to CANDIDATE for historical rows carrying neither field,
  and files nothing at any grade.
- docs/contracts/ci-rca-lifecycle.yaml declares both new projection_fields and the closure_obligation
  vocabularies, carries a new amendment_log entry, and a test fails if the contract and the gate disagree.
- Decision 184 exists in docs/DECISIONS.md with a conformant metadata envelope and a span at or below
  the 6144-byte per-entry cap, and its empirical claims reproduce against the read cache -- specifically
  the corrected artifact-token baseline and the corrected duplicate-citability count (see context; the
  pre-critique draft's '6 of 92' and '18 of 19' did not reproduce).
- config/composite_action_body_baseline.yaml, config/ci_rca_taxonomy.yaml, AGENTS.md, scripts/rec_trailer.py
  and docs/ROADMAP-PLATFORM.yaml are untouched, and no SLOC or coverage baseline is raised or lowered.
- 'bin/venv-python -m scripts.checks.deps.selection_budget --plan <this plan> is RUN and its prediction
  RECORDED (Decision 182). A within_budget verdict is recorded as weak evidence, not as a pass: the predictor
  is known to under-report (rec-3677). The criterion is that the prediction was measured and written down,
  not that it read within_budget.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Exercise the gate body directly: the predicate over existing UNION merged context, the four
    artifact kinds resolving present and absent, the fixture: tests/fixtures/ root constraint, the hatch
    grammar as CATEGORY MEMBERSHIP (an unknown category is refused, not merely ill-formed), the assertion
    that duplicate_of is ABSENT from HATCH_CATEGORIES, and the contract-parity assertion that the kind,
    kind-strength and category vocabularies in closure_gate.py equal those declared in ci-rca-lifecycle.yaml.'
  command: bin/venv-python -m pytest tests/ops_data_portal/test_closure_gate.py -q
  expected: Exit 0, all tests pass, including test_named_artifact_absent_on_main_is_refused (the known-bad
    fixture), test_unknown_hatch_category_is_refused (membership, not well-formedness -- the acceptance
    bar D-B6 raises), test_fixture_kind_requires_tests_fixtures_root, test_duplicate_of_is_not_a_hatch_category,
    and test_closure_vocabularies_match_contract.
  fix_if: 'A kind resolves an absent artifact as present -- the resolver is matching too loosely (e.g.
    a pytest node id whose file exists but whose def does not, or a fixture: token pointing outside tests/fixtures/).
    If test_unknown_hatch_category_is_refused fails, the gate is checking the category''s SHAPE and not
    its MEMBERSHIP in HATCH_CATEGORIES; shape-only makes Decision 184 point 8''s ratchet defeatable by
    typing a new category into a string. A parity failure means the contract section and the module disagree;
    the contract is the field-semantics authority, so correct whichever is wrong and never delete the
    assertion. If test_duplicate_of_is_not_a_hatch_category fails, the implementer re-added the category
    the human ruled out -- delete it; do NOT instead teach the gate to follow a duplicate to its master,
    which is the promise-transfer route the ruling also forbids.'
  hermetic: false
  graduation: graduate
  graduation_check_id: closure-gate-artifact-resolver-and-vocabulary
- step: 2
  phase: pre-deploy
  action: Exercise the obligation at the write boundary through update_rec, including the audit's literal
    acceptance (rec-3131 replayed is refused), the D-B3 self-erasure case, the D-B2 two-step open -> declined
    -> superseded route, and the non-gating of status-preserving writes.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_update_rec_content_validation.py -q
  expected: Exit 0. test_rec_3131_replay_is_refused, test_named_artifact_absent_is_refused and test_closing_write_that_blanks_context_is_still_refused
    all raise ClosureArtifactRequired with mock_write.assert_not_called(); test_open_to_declined_is_gated
    shows the first hop of the two-step route refused; test_resolvable_artifact_closes, test_hatched_closure_closes
    and test_duplicate_citing_master_artifact_closes all write; test_status_preserving_write_on_closed_escape_rec_is_not_gated
    writes.
  fix_if: 'If mock_write WAS called on a refusal, the gate is placed after _ducklake_write -- move it
    before. If test_closing_write_that_blanks_context_is_still_refused fails, the predicate is reading
    only the merged context: context_v2_json is not in _UPDATE_CONTENT_VALIDATED_FIELDS and carries no
    monotonicity guard, so the closing write controls its own classification -- evaluate the predicate
    over existing UNION merged (escape-classified if EITHER side is). If test_open_to_declined_is_gated
    fails, ''terminal'' is defined on the TO side only; define it on the FROM side (fires on a transition
    INTO a bound status FROM a status not already in the bound set), which is also what leaves declined
    -> superseded correctly ungated because the obligation was discharged at the first hop. If the status-preserving
    case is refused, the transition predicate is keying on the merged status instead of on (status in
    updates AND existing status not already bound), which would wedge stamp_fixed_by_sha on every already-closed
    escape rec.'
  hermetic: false
  graduation: graduate
  graduation_check_id: update-rec-closure-obligation-boundary
- step: 3
  phase: pre-deploy
  action: Exercise the CLI write-fidelity partition with the new kwarg table and the flag threading.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_cli.py -q
  expected: Exit 0. test_cli_update_rec_flag_dest_classification_is_exhaustive passes as a three-way partition
    and the new threading tests show --closure-artifact reaching update_rec's keyword parameter.
  fix_if: '''unclassified'' names the new dests -- they were added to the argument group without a table
    entry. Never resolve this by deleting the equality assertion or by dropping to a subset check; the
    graduated shard portal-cli-update-rec-field-fidelity pins its strength.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The durable guard already exists as a graduated shard (config/agent/verification_registry/entries/portal-cli-update-rec-field-fidelity.yaml,
    node id tests/ops_data_portal/test_cli.py::TestCLI::test_cli_update_rec_flag_dest_classification_is_exhaustive).
    This step strengthens that same node id from a two-way to a three-way partition; a second shard would
    pin the identical assertion twice.
- step: 4
  phase: pre-deploy
  action: Exercise the CiRcaContext additions, including that a context omitting all three new fields
    still validates and that a closure_none_feasible_category outside HATCH_CATEGORIES is rejected by
    the field pattern itself.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_ci_rca_schema.py -q
  expected: Exit 0; the three new fields accept well-formed values, reject malformed ones (an off-vocabulary
    category included), and their absence still validates.
  fix_if: A historical-shaped context failing validation means a field was declared required rather than
    Optional -- that would retro-reject every existing row and violates the prospective-only ruling in
    Decision 184 point 6.
  hermetic: false
