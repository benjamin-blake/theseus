    and test_duplicate_citing_master_artifact_closes all write; test_status_preserving_write_on_closed_escape_rec_is_not_gated
    writes.
  fix_if: If mock_write WAS called on a refusal, the gate is placed after _ducklake_write -- move it before.
    If the status-preserving case is refused, the transition predicate is keying on the merged status
    instead of on (status in updates AND existing status non-terminal), which would wedge stamp_fixed_by_sha
