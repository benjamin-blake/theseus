acceptance_criteria:
- Closing an escape-classified rec (escape_class set OR detection_gap.escape_mode set, evaluated over
  existing UNION merged context) with neither a closure_artifact nor a well-formed closure_waiver_category
  + closure_waiver_reason pair raises ClosureArtifactRequired at the portal and performs no write.
- 'Closing one whose named closure_artifact does not resolve is refused the same way -- the known-bad
  fixture. Resolution is FIX-BOUND, not existence-only: a token resolves only when its kind-specific fact
  holds AND its defining file was added or modified in the closing write''s fixed_by_sha. A fixture: token
  that resolves but sits OUTSIDE tests/fixtures/ (fixture:README.md) is refused, and so is a correctly-shaped
  token whose defining file is untouched by the fix commit: the four kinds are not equal in strength and
  a path that merely exists must not be able to discharge the obligation.'
- 'check:<name> resolves against the named registry entry''s TIER fact (Entry.pre is True), NEVER bare
  membership in registry._ALL_ENTRIES. A test closes an escape rec citing check:<name> for an entry that
  is registered but pre=False and is REFUSED. This is the criterion that makes the obligation non-vacuous
  for the MAJORITY escape mode: 50 of the 92 escape rows are tier_misplaced, which by vacuous_pass.compute_escape_mode
  rule 2 means the catching check already exists and is already registered, so a membership rule would
  pass all 50 without the fix changing anything.'
- An escape rec closed with a resolvable artifact whose defining file was NOT touched in fixed_by_sha
  is REFUSED, and one closed with no fixed_by_sha at all on the artifact route is REFUSED. The automated
  route supplies it (close_recs_from_trailer passes closure_fix_sha=commit_sha into the same write) and
  the manual route supplies it (--closure-fix-sha), so neither is wedged. An unresolvable sha refuses
  rather than passing -- fail closed, Decision 55. The waiver route needs no fix commit.
- The historical rec-3131 case, replayed (status closed, resolution 'Duplicate of rec-3132...', no artifact,
  no waiver), is refused -- and stays refused, because duplicate_of is not a waiver category and rec-3132
  carries no citable artifact. That single refusal IS audit finding LSA-04, not a defect in the mechanism.
- A closure supplying a resolvable artifact, and a closure supplying a well-formed categorised waiver
  whose category is a MEMBER of WAIVER_CATEGORIES, both succeed. A waiver whose category is well-formed
  but off-vocabulary is REFUSED -- membership, not shape, is the acceptance bar, because a shape-only
  check would leave Decision 184 point 8's ratchet defeatable by typing a new category into a string.
- WAIVER_CATEGORIES is exactly the four-member seed vocabulary {stale_no_recurrence, environment_only,
  no_premerge_gate_by_design, risk_accepted} in both closure_gate.py and docs/contracts/ci-rca-lifecycle.yaml::closure_obligation.waiver_categories,
  and the two agree. duplicate_of appears in NEITHER -- a duplicate closure passes only by citing a fix-bound
  closure_artifact token (never a rec id, so the gate resolves no rec-to-rec pointer and adds no reader
  egress). The vocabulary is enumerated HERE, at the gate that ratifies it, because Decision 184 point
  8 makes adding a category a numbered-Decision event -- an implementer-chosen vocabulary would be ratchet-frozen
  on landing without review.
- 'No promise transfer: nothing in the gate lets a duplicate inherit its master''s obligation. A test
  asserts the gate reads only the rec''s own merged context.'
- 'A closing write that blanks or rewrites context_v2_json in the SAME update_rec call cannot erase its
  own classification: context_v2_json is not in _UPDATE_CONTENT_VALIDATED_FIELDS and carries no monotonicity
  guard, so update_rec(id, {''status'': ''closed'', ''context_v2_json'': ''{}''}) must still be refused.
  The predicate is evaluated over existing UNION merged.'
- 'The bound set is {closed, declined, superseded} and ''terminal'' is defined on the FROM side: the gate
  fires on a transition INTO a bound status FROM a status not already in that set. open -> declined is
  therefore gated (closing the two-step open -> declined -> superseded route that a TO-side-only definition
  leaves open), while declined -> superseded and every status-preserving write are not, because the obligation
  was already discharged. failed is explicitly NOT bound: it is a live, non-resolved status under docs/contracts/ducklake_writer.yaml,
  from which failed -> open and failed -> declined are both legal live transitions.'
- propose_or_close_rec's deterministic-satisfied branch, which auto-closes via update_rec, RAISES ClosureArtifactRequired
  on an escape-classified rec and performs no write -- the fourth path's behaviour is specified and tested,
  not merely asserted in prose.
- docs/contracts/ci-rca-lifecycle.yaml's closure_dependency.manual_route and auto_close.timestamp_inactivity.action
  both name the new flags/kwargs, so neither documents a closure command the gate now refuses or a sweep
  call shape that no longer matches the code.
- 'print_ci_rca_back_validation lists any OPEN escape-classified rec. This is the declared mitigation
  for the refusal residual: a refused escape rec is left open with no artifact and no marker, and the
  30-day inactivity sweep will waiver it closed on stale_no_recurrence, so a surfacing point before the
  sweep is what keeps that path from being silent (see context).'
- 'The kind-strength ordering shard: > pytest: > check: > fixture: is DECLARED in the contract, and the
  residual is recorded honestly: only shard: carries the audit''s still-red-on-reintroduction property
  via the fail-on-revert differential; check: and pytest: prove existence; fixture: proves existence within
  a fixtures root. Closing the existence-vs-discrimination gap is a filed follow-on rec, not a silent
  omission.'
- propose_or_close_rec's close_proposed command string names --closure-artifact, so the printed duplicate/superseded
  proposal does not read as a bug when the gate refuses it on an escape rec.
- A status-preserving write on an already-terminal escape rec (stamp_fixed_by_sha, occurrence bump, context
  correction) is NOT gated.
- rec-autoclose.yml handles a refusal by printing a marker, skipping the rec and exiting 0 -- it never
  propagates the exception and never reddens this ci_rca:watched workflow.
- The scheduled inactivity sweep still closes an escape-classified inactive rec, satisfying the waiver
  programmatically with its stale_no_recurrence proof.
- back_validation grades each pairing by the prior rec's named artifact actually existing (VERIFIED-PRESENT
  / CONFIRMED-ABSENT / WAIVED), falling back to CANDIDATE for historical rows carrying neither field,
  and files nothing at any grade.
- docs/contracts/ci-rca-lifecycle.yaml declares both new projection_fields and the closure_obligation
  vocabularies, carries a new amendment_log entry, and a test fails if the contract and the gate disagree.
- 'Decision 184 exists in docs/DECISIONS.md with a conformant metadata envelope declaring amends: [103],
  a **Warehouse ID:** dec-184 line, and a MEASURED span of 6066 bytes -- 78 under the 6144-byte per-entry
  cap (Decision 167 clause 3), measured by validate_decisions_size.py''s own method (iter_decision_sections
  block, len(block.encode(''utf-8''))). Its reversal conditions are in a fenced `yaml reversal-conditions`
  stanza that evaluate() parses without MALFORMED, not in prose. The (184, 103) edge carries a waiver
  row in config/decision_supersession_waivers.yaml. Its empirical claims reproduce against the read cache
  -- the 0-under-the-new-grammar artifact-token figure and the corrected duplicate-citability count (see
  context; the pre-critique draft''s ''6 of 92'' and ''18 of 19'' did not reproduce).'
- config/composite_action_body_baseline.yaml, config/ci_rca_taxonomy.yaml, AGENTS.md, scripts/rec_trailer.py
  and docs/ROADMAP-PLATFORM.yaml are untouched, and no SLOC or coverage baseline is raised or lowered.
- 'bin/venv-python -m scripts.checks.deps.selection_budget --plan <this plan> is RUN and its prediction
  RECORDED (Decision 182). A within_budget verdict is recorded as weak evidence, not as a pass: the predictor
  is known to under-report (rec-3677). The criterion is that the prediction was measured and written down,
  not that it read within_budget.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Exercise the gate body directly: the predicate over existing UNION merged context; the four
