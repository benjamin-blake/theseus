    merged context (escape_class OR detection_gap.escape_mode), the <kind>:<ref> artifact grammar and
    its static resolver for the four kinds, the categorised hatch grammar (HATCH_CATEGORIES EXCLUDES duplicate_of
    -- human ruling, see context), and the single ClosureArtifactRequired(ValueError). Pure and side-effect
    free -- it refuses, never remediates (Decision 55/72).'
