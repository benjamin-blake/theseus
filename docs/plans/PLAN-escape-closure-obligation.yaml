  \ and `**Date:**` to the actual approval date if it differs from the drafted 2026-09-07. BYTE CAP: this\
  \ draft MEASURES 7159 bytes against the 6144-byte per-entry hard cap (1015 OVER). The plan-critique\
  \ corrections it carries (the corrected artifact-token baseline and duplicate-citability count, the\
  \ eight-site closure enumeration, the FROM-side binding of {closed, declined, superseded}, the two-field\
  \ hatch and its enum, the kind-strength ordering, and the reversal-condition denominators) are all load-bearing\
  \ substance a human ruled on or a critic measured, so it was NOT trimmed to fit. Prose was already compressed\
  \ once and the optional `**Significance:**` body paragraph dropped (the typed envelope's `significance.justification`\
  \ carries that claim, and validate_decision_entry_conformance reads the envelope, not the paragraph).\
  \ Resolving the overage is the human/overseer's call, not the implementer's: either accept a cap amendment,\
  \ or split the Reversal-conditions block into its own numbered Decision.\n\n## Decision 184: Closure-time\
  \ artifact obligation for escape-classified recs (Decided)\n\n```yaml\nnumber: 184\nstatus: Decided\n\
  decided_date: \"2026-09-07\"\nsignificance:\n  value: numbered_decision\n  justification: >-\n    A\
  \ standing precondition on rec closure binding every in-repo closure path, plus a ratchet\n    over\
  \ its own weakening. ci-rca-lifecycle.yaml was rejected as the home: a field-semantics\n    row cannot\
  \ carry an enforcement commitment, a refusal contract, or a relaxation asymmetry.\n```\n\n**Status:**\
  \ Decided\n**Date:** 2026-09-07\n\n**Problem:**\nAudit LSA-04 (loop-spec-adoption-4d8bac4a, observed):\
  \ whether closing an escape-classified rec\nleaves a permanent machine artifact is author convention.\
  \ rec-3131 closed claiming a `--pre` iam_tf\ninvariant still absent at HEAD; the class recurred as rec-3328.\
  \ Of 92 escape-classified recs, 27\nname any artifact-shaped token in `resolution` (widest definition:\
  \ a first-party path, a\n`validate_*` name or a pytest node id) and 26 resolve on the tree -- but **0**\
  \ name one in a\nmachine-resolvable `<kind>:<ref>` form. Graduation registry, dedup and back_validation\
  \ are\ndetection-grade: guarantee (d) has no closure-time obligation.\n\n**Decision:**\n1. PREDICATE.\
  \ `context_v2_json.escape_class` OR `detection_gap.escape_mode` is SET --\n   `undetermined` counts\
  \ (92 recs; escape_class alone selects 37, a strict subset). Evaluated over\n   the pre-write context\
  \ UNION the post-write one, so a close that blanks `context_v2_json` in the\n   same call cannot erase\
  \ its own obligation. `failure_category == \"gate_escape\"` cannot be the\n   predicate: an `agent_only_categories`\
  \ value `taxonomy.py` never emits, matching zero rows.\n2. ONE ENFORCEMENT SITE. Asserted once in `ops_data_portal.py::update_rec`\
  \ before\n   `_ducklake_write`, body in `ops_portal/closure_gate.py`. EVERY path closing a writer-allocated\n\
  \   `rec-NNN` funnels through `update_rec` -- eight in-repo sites, not the four the audit names; the\n\
  \   one direct `update_ops` writer (`maintenance_ops.py:90`) touches only the caller-keyed `test-`\n\
  \   keyspace. A second gate would be a drift surface, not a guarantee.\n3. BINDING. Bound set = Decision\
  \ 103's resolved set `{closed, declined, superseded}`, TERMINAL\n   DEFINED ON THE FROM SIDE: fires\
  \ on a transition INTO a bound status FROM one not already bound.\n   `declined` binds for the reason\
  \ `superseded` does (gating `closed` alone is a trivial bypass),\n   and the FROM-side rule is what\
  \ closes `open -> declined -> superseded`. `failed` is NOT bound --\n   a live status, `failed -> open`\
  \ and `failed -> declined` both legal. Status-preserving writes\n   (`stamp_fixed_by_sha`, occurrence\
  \ bumps, corrections) are never gated.\n4. ARTIFACT, EXISTENCE-VERIFIED AND STATIC ONLY. Closure names\
  \ a landed artifact in\n   `context_v2_json.closure_artifact`, resolved to a filesystem or registry\
  \ fact at write time;\n   execution grade stays in the full tier (rec-2875 is the cost precedent). Kinds\
  \ are NOT\n   interchangeable: `shard:` > `pytest:` > `check:` > `fixture:`, only `shard:` being\n \
  \  still-red-on-reintroduction; `fixture:` must sit under `tests/fixtures/`. Existence is not\n   discrimination\
  \ -- a declared residual. Vocabulary and resolution rules are field semantics in\n   the contract's\
  \ `closure_obligation` (86/127).\n5. HATCH, IN TWO FIELDS -- AND `duplicate_of` IS NOT ONE. `closure_none_feasible_category`\
  \ carries\n   the category, `closure_none_feasible_reason` the proof. The split is deliberate: an\n\
  \   alternation-patterned category forces a matching `enum:` in the contract, enforced in both tiers\n\
  \   by the live-model evaluator, so MEMBERSHIP is schema-enforced and point 8's ratchet cannot be\n\
  \   defeated by typing a new category into a string. A duplicate instead cites the CLASS artifact in\n\
  \   `closure_artifact`, existence-verified like any other: the hatch asserts no artifact is FEASIBLE,\n\
  \   a duplicate asserts one is OWED -- opposite claims, and hatching duplicates would inflate (a)'s\n\
  \   abuse metric. Nor may a duplicate INHERIT its master's obligation: the master could still take\n\
  \   the hatch. MEASURED: 11 of 19 escape duplicates cite a master naming a citable artifact; for the\n\
  \   rest a guard may exist in the master's fix PR though the rec text does not name it, so the\n   closer's\
  \ cost is *go find it*, not *cite it*. rec-3131 and rec-2533 are genuine refusals, and\n   those refusals\
  \ are the finding. The sweep MAY satisfy the hatch with its `stale_no_recurrence`\n   proof; else a\
  \ scheduled workflow wedges.\n6. STRICT FROM DAY ONE, PROSPECTIVE ONLY. No flag, no warn window: all\
  \ 92 escape recs are closed\n   and zero source=ci_rca recs are open, so it costs nothing on landing\
  \ and a warn window would\n   exempt precisely the first real escape. Per-write like CIRCA-02; historical\
  \ rows are never\n   retro-checked.\n7. REFUSAL IS LOUD, NOT RED. The gate raises `ClosureArtifactRequired`\
  \ (a ValueError), writing\n   nothing. `rec-autoclose.yml` CATCHES it, prints a Decision-155-shaped\
  \ marker mirrored to\n   `$GITHUB_STEP_SUMMARY`, skips that rec leaving it OPEN, and EXITS 0. An exit-1\
  \ would file a new\n   critical source=ci_rca rec for a gate doing its job and enter that contract's\
  \ closure trap. Its\n   DECISIONS.md backfill step's non-zero exit (155) is unchanged. A refused rec\
  \ is listed by\n   `print_ci_rca_back_validation`; its unattended tail is (c).\n8. RATCHET ASYMMETRY.\
  \ Correcting or removing an artifact token is free with a stated reason.\n   WEAKENING it -- narrowing\
  \ the predicate, unbinding a status, adding a hatch category, softening\n   the category field's pattern\
  \ -- requires a numbered Decision amending this one.\n9. NEVER REMEDIATES. The gate refuses and surfaces;\
  \ it never files a rec, synthesizes a fixture,\n   downgrades a status, or retries (55, 72).\n\n**Rationale:**\n\
  A hard gate adds friction to every ci_rca closure, including environment escapes whose honest\nartifact\
  \ is \"none feasible\" -- hence a categorised hatch: a declaration is auditable, silence is\nnot. Asserting\
  \ at `update_rec` is what makes it cheap: no writer verb, no column, no check\nregister. Point 7 is\
  \ load-bearing -- rec-autoclose is `ci_rca: watched`, so propagating would turn\nevery correct refusal\
  \ into a critical rec and a red workflow.\n\n**Reversal conditions:** MONITORED -- nothing computes\
  \ (a) or (b) today; the gauge is a filed\nfollow-on, and the denominator in both is NON-SWEEP gated\
  \ closures, the sweep's hatching being\ncorrect by design. (a) over a rolling quarter, more than half\
  \ of non-sweep gated closures taking\nthe hatch rather than naming an artifact = ritual not ratchet;\
  \ re-found or retire it. (b)\nprogrammatic `stale_no_recurrence` hatches outnumbering agent-authored\
  \ ones by more than 4:1 = the\nsweep is laundering the obligation; its exemption is re-decided. (c)\
  \ a rec refused at rec-autoclose\nlater swept closed on `stale_no_recurrence` with no artifact and no\
  \ human = LSA-04 rebuilt on a\n30-day timer; the sweep exemption narrows. (d) a caller closing around\
  \ the client-side gate = the\nobligation moves to the writer boundary.\n\n**Related:** 55/72, 84, 88,\
  \ 103, 124, 128, 142, 150, 155, 162, 165, 167, 182, 86/127.\nAudit: LSA-04 of loop-spec-adoption-4d8bac4a.\n"
