- "DECISION 184 DRAFT -- NOT APPROVED. It is a HUMAN GATE: the orchestrator relays it to the human before\
  \ anything merges, and only then does it paste verbatim into docs/DECISIONS.md. Stamp both `decided_date:`\
  \ and `**Date:**` to the actual approval date if it differs from the drafted 2026-09-07.\n\n## Decision\
  \ 184: Closure-time artifact obligation for escape-classified recs -- a named landed artifact or a categorised\
  \ stated reason, gated once at the portal (Decided)\n\n```yaml\nnumber: 184\nstatus: Decided\ndecided_date:\
  \ \"2026-09-07\"\nsignificance:\n  value: numbered_decision\n  justification: >-\n    A standing precondition\
  \ on rec closure binding four call paths, plus a ratchet over its own\n    weakening. docs/contracts/ci-rca-lifecycle.yaml\
  \ was considered and rejected as the home: it\n    owns the fields' MEANING via projection_fields, but\
  \ a field-semantics row cannot carry an\n    enforcement commitment, a refusal contract, or its own\
  \ relaxation asymmetry.\n```\n\n**Status:** Decided\n**Date:** 2026-09-07\n\n**Problem:**\nAudit LSA-04\
  \ (loop-spec-adoption-4d8bac4a, observed): whether closing an escape-classified rec\nleaves a permanent\
  \ machine artifact is author convention. rec-3131 closed claiming a `--pre` iam_tf\ninvariant still\
  \ absent at HEAD; the class recurred as rec-3328. Of 92\nescape-classified recs, 6 name any artifact-shaped\
  \ token in `resolution`. Graduation registry,\ndedup and back_validation are detection-grade: guarantee\
  \ (d) has no closure-time obligation.\n\n**Decision:**\n1. PREDICATE. Escape-classified means `context_v2_json.escape_class`\
  \ OR\n   `detection_gap.escape_mode` is SET -- `undetermined` counts as set (92 recs; escape_class alone\
  \ selects 37, a strict subset).\n   `failure_category == \"gate_escape\"` is NOT the predicate and cannot\
  \ be: an\n   `agent_only_categories` value never emitted by `scripts/ci_rca/taxonomy.py`, matching zero\
  \ rows,\n   deliberately re-modelled onto `escape_mode`.\n2. ONE ENFORCEMENT SITE. Asserted once, in\
  \ `scripts/ops_data_portal.py::update_rec` before\n   `_ducklake_write`, body in `scripts/ops_portal/closure_gate.py`.\
  \ All four closure paths --\n   `rec-autoclose.yml`, the CLI, `inactivity_sweep.py`, `propose_or_close_rec`\
  \ -- already funnel\n   through `update_rec`; a second gate would be a drift surface, not a guarantee.\n\
  3. BINDING. Fires only on a TRANSITION into `closed` or `superseded` from a non-terminal status.\n \
  \  `superseded` is bound because gating `closed` alone is a trivial bypass; `declined` is NOT\n   bound\
  \ (zero are declined; declining asserts the RCA was not actionable) -- a monitored\n   residual under\
  \ (c). A status-preserving write -- `stamp_fixed_by_sha`,\n   occurrence bumps, corrections -- is never\
  \ gated.\n4. ARTIFACT, EXISTENCE-VERIFIED AND STATIC ONLY. Closure names a landed artifact in\n   `context_v2_json.closure_artifact`,\
  \ resolved to a filesystem or registry fact at write time;\n   execution grade stays in the full tier\
  \ (rec-2875 is the cost precedent). Kind vocabulary and\n   resolution rules are field semantics in\
  \ the contract's `closure_obligation` (86/127).\n5. HATCH -- AND `duplicate_of` IS NOT ONE. `context_v2_json.closure_none_feasible_reason`\
  \ carries a\n   CATEGORISED stated reason (grammar in that contract section). A duplicate instead cites\
  \ the\n   CLASS artifact in `closure_artifact`, existence-verified like any other: the hatch asserts\
  \ no\n   artifact is FEASIBLE, a duplicate asserts one is OWED -- opposite claims, and hatching duplicates\n\
  \   would inflate (a)'s own abuse metric. Nor may a duplicate INHERIT its master's obligation: the\n\
  \   master could still take the hatch. 18 of 19 escape duplicates cite a master whose fix PR landed\n\
  \   a real guard; rec-3131 is the lone refusal, and that refusal is the finding. The sweep MAY\n   satisfy\
  \ the hatch with its `stale_no_recurrence` proof; else a scheduled workflow wedges.\n6. STRICT FROM\
  \ DAY ONE, PROSPECTIVE ONLY. No feature flag, no warn window: all 92 escape recs are\n   closed and\
  \ zero source=ci_rca recs are open, so it costs nothing on landing, and a warn window\n   would exempt\
  \ precisely the first real escape after it. As with CIRCA-02 the gate is per-write;\n   historical rows\
  \ are never retro-checked.\n7. REFUSAL IS LOUD, NOT RED. The gate raises `ClosureArtifactRequired` (a\
  \ ValueError), writing\n   nothing. `rec-autoclose.yml` CATCHES it, prints a Decision-155-shaped marker\
  \ mirrored to\n   `$GITHUB_STEP_SUMMARY`, skips that rec leaving it open, and EXITS 0. An exit-1 would\
  \ file a new\n   critical source=ci_rca rec for a gate doing its job and enter that contract's closure\
  \ trap. The\n   workflow's non-zero exit on its DECISIONS.md backfill step (155) is unchanged.\n8. RATCHET\
  \ ASYMMETRY. Correcting or removing an artifact token is free with a stated reason.\n   WEAKENING it\
  \ -- narrowing the predicate, unbinding a status, adding a hatch category -- requires\n   a numbered\
  \ Decision amending this one.\n9. NEVER REMEDIATES. The gate refuses and surfaces; it never files a\
  \ rec, synthesizes a fixture,\n   downgrades a status, or retries (55, 72).\n\n**Rationale:**\nA hard\
  \ gate adds friction to every ci_rca closure, including environment escapes whose honest\nartifact is\
  \ \"none feasible\" -- hence a categorised hatch: a declaration is auditable, silence is\nnot. Asserting\
  \ at `update_rec` is what makes it cheap -- no writer verb, no column, no check\nregisters. Point 7\
  \ is load-bearing: rec-autoclose is `ci_rca: watched`, so propagating would turn\nevery correct refusal\
  \ into a critical rec and a red workflow.\n\n**Reversal conditions:** (a) if over a rolling quarter\
  \ more than half of gated closures take the\nhatch rather than naming an artifact, this is ritual not\
  \ ratchet -- re-found or retire it; (b) if\nthe programmatic `stale_no_recurrence` hatch becomes the\
  \ majority of hatched closures, the sweep is\nlaundering the obligation and its exemption is re-decided;\
  \ (c) if any source=ci_rca rec reaches\n`declined` while escape-classified, point 3's residual is live\
  \ and the binding extends by\namendment; (d) if a caller is seen closing around the client-side gate,\
  \ the obligation\nmoves to the writer boundary.\n\n**Significance:** clears the Decision 150 bar --\
  \ a standing precondition on a lifecycle transition\nacross four call paths, with a weakening ratchet\
  \ and a refusal contract binding a watched\nworkflow.\n\n**Related:** 55/72, 84, 88, 103, 124, 128,\
  \ 142, 150, 155, 162, 165, 167, 182, 86/127.\nAudit: LSA-04 of loop-spec-adoption-4d8bac4a.\n"
