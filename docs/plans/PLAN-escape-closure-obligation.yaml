- "DECISION 184 DRAFT (human-approved at a pre-merge gate; paste verbatim into docs/DECISIONS.md):\n\n\
  ## Decision 184: Closure-time artifact obligation for escape-classified recs -- a named landed artifact\
  \ or a categorised stated reason, gated once at the portal (Decided)\n\n```yaml\nnumber: 184\nstatus:\
  \ Decided\ndecided_date: \"2026-09-05\"\nsignificance:\n  value: numbered_decision\n  justification:\
  \ >-\n    A standing precondition on rec closure binding four call paths, plus a ratchet over its own\n\
  \    weakening. docs/contracts/ci-rca-lifecycle.yaml was considered and rejected as the home: it\n \
  \   owns the fields' MEANING via projection_fields, but a field-semantics row cannot carry an\n    enforcement\
  \ commitment, a refusal contract, or its own relaxation asymmetry.\n```\n\n**Status:** Decided\n**Date:**\
  \ 2026-09-05\n\n**Problem:**\nAudit LSA-04 (loop-spec-adoption-4d8bac4a, observed): whether closing\
  \ an escape-classified rec\nleaves a permanent machine artifact is author convention. rec-3131 closed\
  \ claiming a `--pre` iam_tf\ninvariant still absent at HEAD; the class recurred as rec-3328 on fingerprint\
  \ 10ac13c3. Of 92\nescape-classified recs, 6 name any artifact-shaped token in `resolution`. The graduation\
  \ registry,\ndedup and back_validation are all detection-grade: guarantee (d) has no closure-time obligation.\n\
  \n**Decision:**\n1. PREDICATE. Escape-classified means `context_v2_json.escape_class` OR\n   `detection_gap.escape_mode`\
  \ is set (92 recs; escape_class alone selects 37, a strict subset).\n   `failure_category == \"gate_escape\"\
  ` is NOT the predicate and cannot be: an\n   `agent_only_categories` value never emitted by `scripts/ci_rca/taxonomy.py`,\
  \ matching zero rows,\n   deliberately re-modelled onto `escape_mode`.\n2. ONE ENFORCEMENT SITE. Asserted\
  \ once, in `scripts/ops_data_portal.py::update_rec` before\n   `_ducklake_write`, body in `scripts/ops_portal/closure_gate.py`.\
  \ All four closure paths --\n   `rec-autoclose.yml`, the CLI, `inactivity_sweep.py`, `propose_or_close_rec`\
  \ -- already funnel\n   through `update_rec`; a second gate would be a drift surface, not a second guarantee.\n\
  3. BINDING. Fires only on a TRANSITION into `closed` or `superseded` from a non-terminal status.\n \
  \  `superseded` is bound because gating `closed` alone leaves a trivial bypass; `declined` is\n   deliberately\
  \ NOT bound (zero source=ci_rca recs are declined; declining asserts the RCA was not\n   actionable),\
  \ a monitored residual under (c). A status-preserving write -- `stamp_fixed_by_sha`,\n   occurrence\
  \ bumps, corrections -- is never gated.\n4. ARTIFACT, EXISTENCE-VERIFIED AND STATIC ONLY. Closure names\
  \ a landed artifact in\n   `context_v2_json.closure_artifact`, resolved to a filesystem or registry\
  \ fact at write time;\n   execution grade stays in the full tier (rec-2875 is the cost precedent). Kind\
  \ vocabulary and\n   resolution rules are field semantics in\n   `docs/contracts/ci-rca-lifecycle.yaml::closure_obligation`\
  \ (86/127).\n5. HATCH. `context_v2_json.closure_none_feasible_reason` carries a CATEGORISED stated reason\n\
  \   (grammar in that same contract section). A duplicate-of closure does NOT delegate the obligation\n\
  \   to its target -- rec-3131's target rec-3132 landed no artifact either, so delegation would\n   launder\
  \ the gap; a duplicate declares the hatch. The inactivity sweep MAY satisfy it\n   programmatically\
  \ with its `stale_no_recurrence` last_seen/created proof; the alternative wedges\n   a scheduled workflow\
  \ and grows a backlog that hard-blocks planning.\n6. STRICT FROM DAY ONE, PROSPECTIVE ONLY. No feature\
  \ flag, no warn window: all 92 escape recs are\n   closed and zero source=ci_rca recs are open, so it\
  \ costs nothing on landing, and a warn window\n   would exempt precisely the first real escape after\
  \ it. As with CIRCA-02 the gate is per-write;\n   historical rows are never retro-checked and nothing\
  \ enumerates them.\n7. REFUSAL IS LOUD, NOT RED. The gate raises `ClosureArtifactRequired` (a ValueError),\
  \ writing\n   nothing. `rec-autoclose.yml` CATCHES it, prints a Decision-155-shaped marker mirrored\
  \ to\n   `$GITHUB_STEP_SUMMARY`, skips that rec leaving it open, and EXITS 0. An exit-1 would file a\
  \ new\n   critical source=ci_rca rec for a gate doing its job and enter that contract's closure trap.\
  \ The\n   workflow's non-zero exit on its DECISIONS.md backfill step (155) is unchanged.\n8. RATCHET\
  \ ASYMMETRY. Correcting or removing an artifact token is free with a stated reason.\n   WEAKENING it\
  \ -- narrowing the predicate, unbinding a status, adding a hatch category -- requires\n   a numbered\
  \ Decision amending this one.\n9. NEVER REMEDIATES. The gate refuses and surfaces; it never files a\
  \ rec, synthesizes a fixture,\n   downgrades a status, or retries (55, 72).\n\n**Rationale:**\nA hard\
