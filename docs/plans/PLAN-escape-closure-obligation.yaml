constraints:
- 'Decision 67: IMPLEMENTATION only; the >5-file / >8-step STRATEGIC heuristic is suspended, so this lands
  as one larger IMPLEMENTATION plan.'
- 'Decision 55 / 72: the gate REFUSES and surfaces. It must never file a rec, synthesize a fixture, downgrade
  a status, or retry with a substituted artifact. VP step 17 pins this mechanically.'
- HUMAN RULING, BINDING -- duplicate_of is NOT a hatch category. It is excluded from HATCH_CATEGORIES
  and from the contract's hatch_categories entirely; a duplicate cites the class artifact directly in
  closure_artifact, existence-verified like any other closure artifact. This SUPERSEDES the plan's earlier
  'a duplicate declares the hatch category duplicate_of'. Promise transfer (a duplicate inheriting its
  master's obligation) is ALSO forbidden -- the master can still exit via the stale hatch, which rebuilds
  the laundering path. An implementer who finds this inconvenient must hand back, not re-decide it.
- 'BOUND STATUS SET, settled here and not at implement time: {closed, declined, superseded}, with ''terminal''
  defined on the FROM side. The pre-critique draft bound {closed, superseded} and excluded declined on
  a ''zero declined today'' argument that is ci_rca-scoped -- PLATFORM-WIDE there are 70 declined recs,
  and docs/contracts/ducklake_writer.yaml already ratifies Decision 103''s resolved set as {closed, declined,
  superseded} with open/failed -> declined a LIVE transition, so excluding declined narrowed a ratified
  boundary. The draft''s own ''gating closed alone is a trivial bypass'' argument applies to declined
  with identical force, and with * -> superseded legal from any status, a TO-side-only definition of terminal
  leaves open -> declined -> superseded as a writer-blessed ungated route. failed is NOT bound and that
  is deliberate: it is a live, non-resolved status.'
- 'HATCH FIELD SHAPE, settled here: the hatch is TWO fields, not one. closure_none_feasible_category carries
  a BARE ALTERNATION pattern over HATCH_CATEGORIES; closure_none_feasible_reason carries the free-text
  proof. This is deliberate and inverts the pre-critique reasoning. _ALTERNATION_RE matches only ^(a|b|c)$,
  so the single-field ''^(<cat>):\s*\S.*$'' shape carries NO enum obligation, which would leave the contract
  with no enum:, the schema with no vocabulary, and category membership enforced only by HATCH_CATEGORIES
  if the gate happens to check it -- Decision 184 point 8''s ratchet minted defeatable by typing a new
  category into a string. Splitting the field buys the enum obligation the live-model evaluator then enforces
  free in BOTH tiers, adds one Optional field to a model that already takes them, and adds no new surface.
  The gate ALSO checks membership (VP step 1), so the vocabulary is guarded at schema, contract and code.'
- 'ARTIFACT KINDS ARE NOT INTERCHANGEABLE. Declared strength ordering, in the contract: shard: > pytest:
  > check: > fixture:. Only shard: carries the audit''s ideal_behavior property (still-red-on-reintroduction,
  via the fail-on-revert differential); the rest prove existence. fixture: is CONSTRAINED to a path under
  tests/fixtures/ -- unconstrained, fixture:README.md resolves, and because fixture: counts on the ARTIFACT
  side of Decision 184 reversal condition (a) it would DEPRESS the hatch rate, making the abuse detector
  read healthier the more the gate is gamed. The residual (existence is not discrimination) is DECLARED,
  with a follow-on rec, not silently accepted.'
- 'WAVE 0 (#1110, main 8741871b) HAS LANDED: docs/contracts/ci-rca-lifecycle.yaml is a SHARED file. Its
  detection_gap.escape_mode projection_fields row (with enum), its abstention_surface.escape_mode_gauge
  paragraph and its 2026-09-06 amendment_log entry are wave 0''s work -- add alongside them, never edit
  or remove them. The predicate stays the UNION (escape_class OR detection_gap.escape_mode) and is unchanged
  by the repair.'
- 'Hard refusal semantics: in rec-autoclose.yml the refusal is catch-skip-mark and exit 0, never a propagated
  exception with exit_code=1. rec-autoclose is ci_rca:watched; an exit-1 files a new critical source=ci_rca
  rec for a gate doing its job and enters the closure trap documented in docs/contracts/ci-rca-lifecycle.yaml.'
- 'Decision 128 / 124: the gate BODY lives in a new scripts/ops_portal/ module, never inline (ops_data_portal.py
  is at 422/500). Never raise a SLOC budget; decompose.'
- 'SCOPE EXCLUSIONS, load-bearing for parallel safety -- this slice runs concurrently with a sibling slice
  in a separate worktree. These five files must not be touched: config/composite_action_body_baseline.yaml
  (owned by the concurrent slice), config/ci_rca_taxonomy.yaml (owned by a later wave), AGENTS.md (34
  bytes of prose-budget headroom, and an always-ask public surface), scripts/rec_trailer.py (the trailer-grammar
  route is ruled out), docs/ROADMAP-PLATFORM.yaml (zero roadmap rows this run). If one becomes genuinely
  unavoidable, STOP and hand back BLOCKED rather than editing it.'
- 'Artifact-supply route: the artifact is stamped into context_v2_json BEFORE merge via update_rec''s
  new keyword parameter and its CLI flag. The `Resolves:` trailer grammar is NOT extended -- that route
  touches .github/pull_request_template.md, AGENTS.md and the implement skill, all public-surface or byte-capped.'
- 'Decision 84: portal writes only (file_rec / update_rec). Never edit logs/*.jsonl. The gate is client-side;
  no ducklake_reader verb and no ducklake_writer action is added, so no Lambda redeploy and no governed
  CD channel is involved.'
- 'Decision 88: no new reader egress. rec_by_id already returns ALL_TABLE_COLUMNS including context_v2_json,
  so escape classification is readable at gate time for free; back_validation keeps reading only the caller-injected
  warm cache.'
- 'Decision 86 / 127: field semantics route to docs/contracts/ci-rca-lifecycle.yaml. Do NOT mint a new
  contract file, a new top-level registry (config/closure_artifacts.yaml or similar), or any standing
  prose doc under docs/.'
- This slice registers NO check under scripts/checks/. The obligation is a runtime write-time validator
  in the same family as _validate_context_length and the CIRCA-02 strict-mode raise; making it a validate.py
  check is the rejected P2/P3 shape and would pay all seven check surfaces for a tautological guard.
- 'AGENTS.md: every behavior change lands with a test that fails without it; every new guard ships a known-bad
  fixture. ruff, line length 127, type hints, no emojis, plain ASCII hyphens.'
- 'Decision 182: the fast tier asserts NON_TEST_BUDGET_SECONDS = 240 (unwaivable) plus a breadth-derived
  pytest half. VP step 15 RUNS the prediction and records it before commit; a within_budget verdict is
  weak evidence, not a pass (the predictor under-reports -- rec-3677).'
