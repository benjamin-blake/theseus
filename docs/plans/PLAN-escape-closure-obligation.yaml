    78 SLOC headroom so the gate BODY must not live inline). Owns: the escape-classified predicate, evaluated
    over existing UNION merged context so a closing write that blanks context_v2_json cannot erase its
    own obligation (D-B3); the <kind>:<ref> artifact grammar and its static resolver for the four kinds,
    with fixture: CONSTRAINED to a path under tests/fixtures/ (bare fixture:README.md would otherwise
    satisfy the obligation while proving nothing) and a declared kind-strength ordering shard: > pytest:
    > check: > fixture:; the TWO-FIELD hatch (closure_none_feasible_category, alternation-patterned over
    HATCH_CATEGORIES so the contract carries an enum: the live-model evaluator enforces free in both tiers,
    plus free-text closure_none_feasible_reason carrying the proof) -- HATCH_CATEGORIES EXCLUDES duplicate_of
    (human ruling, see context) and an unknown category is REFUSED, not merely ill-formed; and the single
    ClosureArtifactRequired(ValueError). Pure and side-effect free -- it refuses, never remediates (Decision
    55/72). Resolver reads use Path.exists()/Path.read_text() and NEVER open(); check: membership resolves
    against the static per-domain scripts/checks/<domain>/_manifest.py ENTRIES (registry._ALL_ENTRIES
