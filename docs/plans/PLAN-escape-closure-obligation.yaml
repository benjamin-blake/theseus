schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: escape-closure-obligation
intent: 'Close the permanence leg of the escape loop: an escape-classified recommendation cannot reach
  a terminal status without naming a landed, existence-verified permanent artifact or declaring a categorised
  reason none is feasible, asserted once at the ops-portal write boundary, with back_validation upgraded
  from file-only candidate pairing to artifact-existence verification.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-escape-closure-obligation.yaml
phase: 'Control-plane loop closure -- the closure-time artifact obligation of audit finding LSA-04 (audits/loop-spec-adoption-4d8bac4a.yaml),
  classified planned-insufficient against T3.4. Ad hoc, soft-warn category ad_hoc_rec: NO tier_item is
  claimed, no roadmap row is added and no exit criterion is closed, so this plan declares no closes_criteria
  and does not touch docs/ROADMAP-PLATFORM.yaml. Keystone slice of the loop-spec-adoption wave; runs concurrently
  with a sibling slice, hence the five declared scope exclusions.'
scope:
- file: scripts/ops_portal/closure_gate.py
  action: Create
  purpose: 'The closure-obligation rule body (Decision 128 decompose-by-default; ops_data_portal.py has
    78 SLOC headroom so the gate BODY must not live inline). Owns: the escape-classified predicate over
    merged context (escape_class OR detection_gap.escape_mode), the <kind>:<ref> artifact grammar and
    its static resolver for the four kinds, the categorised hatch grammar, and the single ClosureArtifactRequired(ValueError).
    Pure and side-effect free -- it refuses, never remediates (Decision 55/72).'
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: update_rec gains keyword-only closure_artifact / closure_none_feasible_reason parameters that
    stamp into the merged context_v2_json, and calls the gate immediately before _ducklake_write. The
    single enforcement site all four closure paths already funnel through. Module-scope import of the
    gate symbol so scripts.ops_data_portal.<sym> stays the correct patch target (validate_ops_portal_patch_targets).
- file: scripts/ops_portal/cli.py
  action: Modify
  purpose: Adds --closure-artifact and --closure-none-feasible-reason to the --update-rec fields group,
    and a THIRD classification table _UPDATE_REC_KWARG_MAP (dest -> update_rec keyword parameter) alongside
    _UPDATE_REC_FIELD_MAP / _UPDATE_REC_REJECTIONS, so the write-fidelity contract (Decision 66/163) still
    classifies every dest by exactly one table. Relaxes the at-least-one-update-field guard to accept
    a kwarg-only invocation (the pre-merge stamp).
- file: scripts/ops_portal/ci_rca_schema.py
  action: Modify
  purpose: CiRcaContext gains Optional closure_artifact and closure_none_feasible_reason with their patterns.
    Backward-compatible Optional additions per the file's own :129-133 precedent -- NO schema_version
    ceiling raise and NO new ops_recommendations column.
- file: scripts/ops_portal/ci_rca_lifecycle.py
  action: Modify
  purpose: 'Adds close_recs_from_trailer(ids, commit_sha, run_url, ...) -> int, the importable helper
    rec-autoclose.yml delegates its closure loop to (the stamp_fixed_by_sha / Decision 142 precedent).
    Owns the catch-skip-mark refusal: ClosureArtifactRequired is caught, a Decision-155-shaped marker
    is printed and mirrored to $GITHUB_STEP_SUMMARY, the rec is skipped and left open, and the returned
    exit code stays 0. 285 SLOC, 215 headroom.'
- file: .github/workflows/rec-autoclose.yml
  action: Modify
  purpose: The close-resolved-recs-from-resolves-trailer step delegates to close_recs_from_trailer, SHRINKING
    its body well under the config/composite_action_body_baseline.yaml r3_workflows ceiling of 63 so that
    file is never edited (decreases need no marker; the guard fails only on line_count > entry). The Backfill
    decisions to warehouse step and its Decision 155 non-zero exit are untouched.
- file: scripts/ci_rca/inactivity_sweep.py
  action: Modify
  purpose: 'close_inactive_recs passes closure_none_feasible_reason=''stale_no_recurrence: <proof>'' through
    update_rec. Without this the gate wedges a scheduled workflow permanently and grows an open source=ci_rca
    backlog that hard-blocks the /plan queue.'
- file: scripts/ci_rca/back_validation.py
  action: Modify
  purpose: 'find_preventive_regressions upgrades from file-only candidate pairing to artifact-existence
    VERIFICATION: each flag gains closure_artifact / artifact_status / grade keys resolved via closure_gate''s
    static resolver (additive keys, no reader egress, Decision 88). Existing coverage is 79.7% against
    an unbaselined 100% standard, so this file''s uncovered branches are brought to 100% in the same change
    rather than registering a baseline entry.'
- file: scripts/preflight/ci_rca_gauges.py
  action: Modify
  purpose: 'print_ci_rca_back_validation emits a per-flag GRADE (VERIFIED-PRESENT / CONFIRMED-ABSENT /
