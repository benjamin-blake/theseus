    verification_plan rather than hard-coded. The hard-coded list this replaces had already drifted by
    one (it named four shards while the plan declares five graduate steps: 1, 2, 5, 7 and 17).'
  command: bin/venv-python -c "import pathlib,yaml;d=yaml.safe_load(pathlib.Path('docs/plans/PLAN-escape-closure-obligation.yaml').read_text(encoding='utf-8'));ids=[s.get('graduation_check_id')
    for s in d['verification_plan'] if s.get('graduation')=='graduate'];assert ids and all(ids),{'graduate_steps_without_check_id':ids};miss=[i
    for i in ids if not pathlib.Path('config/agent/verification_registry/entries/'+i+'.yaml').exists()];assert
    not miss,{'missing_shards':miss};print('SHARDS_DERIVED_OK '+str(len(ids)))"
  expected: Exit 0 and SHARDS_DERIVED_OK 5 -- one shard per graduate disposition, none missing.
  fix_if: 'missing_shards means graduation did not complete for those steps -- re-run the graduation pass;
    do NOT hand-write a shard to satisfy this. graduate_steps_without_check_id means a graduate disposition
    carries a null graduation_check_id, which validate_graduation_completeness would also fail. If this
    step is run BEFORE graduation it fails by construction -- that is why it is phase: post-deploy and
    why VP step 14 no longer asserts shard paths.'
  hermetic: true
  graduation: waive
  graduation_check_id: null
  graduation_waiver_reason: Asserts this plan's own transient shard set; the durable rule is already the
    registered validate_graduation_completeness, whose implement-PR leg enforces exactly this. A shard
    here would pin one plan's graduate list forever.
