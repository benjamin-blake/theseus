schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: escape-closure-obligation
intent: 'Close the permanence leg of the escape loop: an escape-classified recommendation cannot reach
  a terminal status without naming a landed, FIX-BOUND permanent artifact -- one whose defining file the
  fix commit actually changed, not merely one that exists -- or declaring a categorised waiver from a
  ratified four-member vocabulary, asserted once at the ops-portal write boundary, with back_validation
  upgraded from file-only candidate pairing to artifact-existence verification.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-escape-closure-obligation.yaml
phase: 'Control-plane loop closure -- the closure-time artifact obligation of audit finding LSA-04 (audits/loop-spec-adoption-4d8bac4a.yaml),
  classified planned-insufficient against T3.4. Ad hoc, soft-warn category ad_hoc_rec: NO tier_item is
  claimed, no roadmap row is added and no exit criterion is closed, so this plan declares no closes_criteria
  and does not touch docs/ROADMAP-PLATFORM.yaml. Keystone slice of the loop-spec-adoption wave; runs concurrently
  with a sibling slice, hence the five declared scope exclusions.'
scope:
- file: scripts/ops_portal/closure_gate.py
  action: Create
  purpose: 'The closure-obligation rule body (Decision 128 decompose-by-default; ops_data_portal.py has
    78 SLOC headroom so the gate BODY must not live inline). Owns: the escape-classified predicate, evaluated
    over existing UNION merged context so a closing write that blanks context_v2_json cannot erase its
    own obligation (D-B3); the <kind>:<ref> artifact grammar and its resolver for the four kinds; the
    TWO-FIELD waiver (closure_waiver_category, alternation-patterned over WAIVER_CATEGORIES so the contract
    carries an enum: the live-model evaluator enforces free in both tiers, plus free-text closure_waiver_reason
    carrying the proof); and the single ClosureArtifactRequired(ValueError). WAIVER_CATEGORIES is the
    FOUR-MEMBER seed vocabulary settled in constraints -- stale_no_recurrence, environment_only, no_premerge_gate_by_design,
    risk_accepted -- EXCLUDING duplicate_of (human ruling, see context); an unknown category is REFUSED,
    not merely ill-formed. RESOLUTION IS FIX-BOUND, NOT EXISTENCE-ONLY (consult A1/A2): a token resolves
    only when (i) its kind-specific fact holds AND (ii) its defining file was added or modified in the
    closing write''s fixed_by_sha. Per kind: check:<name> resolves against the named registry entry''s
    TIER fact (scripts/checks/_schema.py::Entry.pre is True), NEVER bare membership in registry._ALL_ENTRIES
    -- 50 of the 92 escapes are tier_misplaced, whose catching check is already registered and already
    in _ALL_ENTRIES, so a membership rule would pass every one of them without the fix changing anything;
    shard:<id> against config/agent/verification_registry/entries/<id>.yaml; pytest:<nodeid> against the
    test file and def; fixture:<path> against a path CONSTRAINED under tests/fixtures/ (bare fixture:README.md
    would otherwise satisfy the obligation while proving nothing). Declared kind-strength ordering shard:
    > pytest: > check: > fixture:. Side-effect free -- it refuses, never remediates (Decision 55/72).
    Filesystem reads use Path.exists()/Path.read_text() and NEVER open(); the fix-commit leg is ONE read-only
    local git call (git diff-tree --no-commit-id --name-only -r <sha>) -- no network, no reader egress
    (Decision 88). An unresolvable sha REFUSES (fail closed, Decision 55), mirroring classify_closed_head''s
    posture; the catch-skip-mark handler then leaves the rec open rather than wedging.'
