  and from the contract's waiver_categories entirely; a duplicate cites the class artifact directly in
  closure_artifact, resolved fix-bound like any other closure artifact (existence alone never sufficed
  after consult A1/A2; the ruling is unchanged by the closure_none_feasible_* -> closure_waiver_* rename).
