  phase: pre-deploy
  action: 'Anti-remediation pin (Decision 55/72, Decision 184 point 9): the gate body must contain no
    write, filing, retry or status-mutation CALL. It refuses and surfaces; it never fixes. Inspected over
    ast.Call nodes only, so a docstring or comment that merely NAMES update_rec or _ducklake_write --
