    the assertion that keeps a future ''helpfully fetch the missing commit'' edit from turning a refusal
    into a network side effect.'
  command: bin/venv-python -c "import ast,pathlib;t=ast.parse(pathlib.Path('scripts/ops_portal/closure_gate.py').read_text(encoding='utf-8'));B={'file_rec','update_rec','_ducklake_write','write_ops','file_ops','update_ops','remove','unlink','rmtree','move','write_text','write_bytes','mkdir','touch','open'};nm=lambda
    g:g.attr if isinstance(g,ast.Attribute) else (g.id if isinstance(g,ast.Name) else '');calls=[c for
