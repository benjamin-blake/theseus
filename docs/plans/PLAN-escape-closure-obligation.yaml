slug: escape-closure-obligation
intent: 'Close the permanence leg of the escape loop: an escape-classified recommendation cannot reach
  a terminal status without naming a landed, existence-verified permanent artifact or declaring a categorised
  reason none is feasible, asserted once at the ops-portal write boundary, with back_validation upgraded
  from file-only candidate pairing to artifact-existence verification.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-escape-closure-obligation.yaml
phase: 'Control-plane loop closure -- the closure-time artifact obligation of audit finding LSA-04 (audits/loop-spec-adoption-4d8bac4a.yaml),
  classified planned-insufficient against T3.4. Ad hoc, soft-warn category ad_hoc_rec: NO tier_item is
  claimed, no roadmap row is added and no exit criterion is closed, so this plan declares no closes_criteria
  and does not touch docs/ROADMAP-PLATFORM.yaml. Keystone slice of the loop-spec-adoption wave; runs concurrently
  with a sibling slice, hence the five declared scope exclusions.'
