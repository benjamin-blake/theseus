schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: check-accounting-roster-free-shrink
intent: Strike from the Decision 170 grandfather roster every check the merged path-aware declaring-coverage metric proves already declares on EVERY reachable success-exit path, and install a standing property test that keeps the roster honest, so the accounting ratchet exempts only checks that still owe a declaration.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-accounting-roster-free-shrink.yaml
phase: Platform verification-system hardening -- paydown of the Decision 170 check-accounting grandfather roster using slice 0's merged path-aware metric as the deletion oracle. Ad hoc, soft-warn category ad_hoc_rec; no tier_item claimed and no roadmap exit criterion closed, so this plan declares no closes_criteria. Slice 1 of the two-slice sequence PLAN-check-accounting-path-aware-declaring-coverage opened; it is the LAST slice of that sequence.
scope:
- file: config/check_accounting_baseline.yaml
  action: Modify
  purpose: 'Delete exactly the eleven entry lines the metric proves fully declared at the pinned base (validate_authority_budget, validate_ci_refresh_read_coverage, validate_contract_drift, validate_convergence_writer_isolation, validate_deploy_channel_conformance, validate_differential_gate_baseline, validate_fallback_reevaluation, validate_ghas_probe, validate_invoke_implies_resolve, validate_plan_documents, validate_prose_allowlist) -- 80 entries to 69. Nothing else in the file changes: the header comment block and the other 69 entries stay byte-identical, and the removal is permanent (shrink-only, no re-adding).'
- file: tests/checks/hygiene/test_validate_check_accounting.py
  action: Modify
  purpose: 'Add the roster-truth property: a module-level helper _fully_declared_roster_names(roster, checks) resolving each name through scripts.checks.registry and measuring it with _declaring_coverage.measure_check behind is_fully_declared, plus class TestRosterCarriesNoFullyDeclaringModule with two cases -- the live-roster property (no remaining roster name is proven fully declared) and a discrimination case requiring the same helper to return a NON-empty result over the whole registered fleet. Measured 253 to 289 SLOC, so no sibling test module and no budget entry is needed.'
bundled_recommendations: []
followon_recs:
- rec-3429
infrastructure_dependencies: []
implementation_declared: true
acceptance_criteria:
- config/check_accounting_baseline.yaml carries none of the eleven named checks and 69 entries remain; the set removed relative to origin/main is exactly those eleven names and nothing was added (step 5).
- Every one of the eleven was proven fully declared by the merged metric on the pinned base before removal -- undecidable_reason None, success_exits >= 1, undeclared == 0 -- with its success_exits/declared/undeclared triple printed as the falsifiable evidence (step 1).
- No name remaining on the roster resolves to a module the metric proves fully declared, asserted as a property over the live roster and the live metric; the property test is RED against the origin/main roster and GREEN on the working tree (steps 2, 3, 4).
- validate_check_accounting passes on the working tree, sees the deletions as a shrink (zero growth against the origin/main base), keeps its frozen _BASELINE_SEED cross-check intact with that constant unedited, and does not trip touch-it-fix-it because no roster-listed check module is in the diff (steps 5, 7).
- The touched set equals the declared scope plus the plan's own sanctioned path in both directions, the only changed Python file is under 500 SLOC with no budget entry or raise marker, ruff check and ruff format are clean, and the Decision 182 selection budget predicts within_budget (steps 6, 8, 9, 10).
- 'rec-3429 is left honest rather than bundled: it stays open, its stored acceptance keeps both original clauses and gains one clause per part-2 module, and running that stored probe on this tree exits non-zero, so no deterministic relevance sweep can report it satisfied while part 2 is unstarted (step 13).'
verification_plan:
- step: 1
  phase: pre-deploy
  action: BEFORE, roster and oracle. Assert all eleven deletion candidates are present on the roster as it stands at origin/main, that none of their defining modules is in this diff (so the walk reads the same module bytes origin/main has), and that the merged metric proves each fully declared through is_fully_declared. Prints the per-module success_exits/declared/undeclared triple for each -- the falsifiable evidence this deletion set rests on.
  command: bin/venv-python -c "import subprocess,yaml;from scripts.checks import _common,registry;from scripts.checks.hygiene._declaring_coverage import measure_check,is_fully_declared;from scripts.checks.hygiene.validate_check_accounting import _check_module_rel_path;D=['validate_authority_budget','validate_ci_refresh_read_coverage','validate_contract_drift','validate_convergence_writer_isolation','validate_deploy_channel_conformance','validate_differential_gate_baseline','validate_fallback_reevaluation','validate_ghas_probe','validate_invoke_implies_resolve','validate_plan_documents','validate_prose_allowlist'];b=set(yaml.safe_load(subprocess.run(['git','show','origin/main:config/check_accounting_baseline.yaml'],capture_output=True,text=True,check=True).stdout)['entries']);assert set(D)<=b,sorted(set(D)-b);t={p for _s,p in _common.get_status_aware_diff()};mods={n:_check_module_rel_path(n) for n in D};edited=sorted(n for n,p in mods.items() if p in t);assert not edited,edited;rows=[(n,measure_check(n,registry.resolve(n))) for n in D];bad=[(n,r.undecidable_reason,r.success_exits,r.declared,r.undeclared) for n,r in rows if not is_fully_declared(r)];assert not bad,bad;print('BEFORE_OK on-origin-main-roster modules-unedited all-fully-declared');print(' '.join(n+'='+str(r.success_exits)+'/'+str(r.declared)+'/'+str(r.undeclared) for n,r in rows))"
  expected: 'Exit 0. Stdout line one reads BEFORE_OK on-origin-main-roster modules-unedited all-fully-declared. Line two carries eleven name=triple pairs: validate_authority_budget=1/1/0, validate_ci_refresh_read_coverage=1/1/0, validate_contract_drift=1/1/0, validate_convergence_writer_isolation=1/1/0, validate_deploy_channel_conformance=1/1/0, validate_differential_gate_baseline=1/1/0, validate_fallback_reevaluation=3/3/0, validate_ghas_probe=3/3/0, validate_invoke_implies_resolve=1/1/0, validate_plan_documents=2/2/0, validate_prose_allowlist=2/2/0.'
  fix_if: 'An AssertionError naming a missing name means origin/main''s roster no longer carries it (someone else struck it) -- drop that name from the deletion list and re-measure, never re-add it. An AssertionError naming an edited module means this diff touched a roster-listed check module: revert that edit, it is out of scope. A bad triple, or an undecidable_reason, means the metric no longer proves that name fully declared on this base: STOP, remove only that name from the deletion list, and record the new measurement. Never delete a name the metric does not prove.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'The premise inverts by construction on merge: the step reads the roster at origin/main, which after this PR merges carries the shrunk roster, so a graduated shard would assert the presence of names that are gone and sit permanently red. Slice 0''s own BEFORE step took the same waive for the same inversion. The durable half of this assertion -- that no roster name is fully declared -- is carried forward by the property test steps 3 and 4 exercise.'
- step: 2
  phase: pre-deploy
  action: RED leg, against the pre-deletion tree. Materialize a detached git worktree at origin/main, copy this branch's test module into it (so the tree differs from origin/main only in the test file, never in the roster), run the roster-truth class there and require it to FAIL. Removes the worktree afterwards whether or not the run failed.
  command: W=$(mktemp -d); if ! git worktree add --detach --quiet "$W" origin/main; then echo WORKTREE_ADD_FAILED; exit 1; fi; if ! cp tests/checks/hygiene/test_validate_check_accounting.py "$W/tests/checks/hygiene/test_validate_check_accounting.py"; then git worktree remove --force "$W"; echo CP_FAILED; exit 1; fi; ln -s "$PWD/.venv" "$W/.venv" 2>/dev/null || true; if [ ! -x "$W/bin/venv-python" ]; then git worktree remove --force "$W"; echo VENV_PYTHON_MISSING; exit 1; fi; ( cd "$W" && bin/venv-python -m pytest tests/checks/hygiene/test_validate_check_accounting.py::TestRosterCarriesNoFullyDeclaringModule -q -p no:cacheprovider --randomly-seed=12345 ); rc=$?; git worktree remove --force "$W"; if [ $rc -eq 0 ]; then echo RED_LEG_DID_NOT_GO_RED; exit 1; fi; if [ $rc -ne 1 ]; then echo RED_LEG_INFRA_FAILURE_rc_$rc; exit 1; fi; echo RED_LEG_OK_test_fails_on_the_origin_main_roster
  expected: 'Exit 0 with stdout RED_LEG_OK_test_fails_on_the_origin_main_roster. The captured pytest output above it shows one failure whose AssertionError names all eleven candidates with their triples, and the discrimination case passing. The red leg is accepted ONLY on pytest exit code 1 (tests collected and at least one failed): a failed worktree add, a failed copy, a missing venv python, or any other pytest exit code (2 interrupted, 4 usage error, 5 nothing collected) prints its own sentinel and exits 1, so an infrastructure failure can never be mistaken for the assertion going red.'
  fix_if: 'RED_LEG_DID_NOT_GO_RED (exit 1) means the property already holds on the pre-deletion roster, so the test proves nothing and this slice has no red leg: STOP and re-derive the deletion set from step 1''s measurement before changing anything. A worktree or pytest collection error is an environment failure, not a red leg -- fix the environment and re-run; do not accept a non-zero exit from collection as evidence. WORKTREE_ADD_FAILED, CP_FAILED or VENV_PYTHON_MISSING name a scratch-environment fault, not a plan fault -- clear stale worktrees with git worktree prune and re-run. RED_LEG_INFRA_FAILURE_rc_N means pytest did not reach the assertion (rc 2, 4 or 5): read the captured output; it is never evidence about the roster.'
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: 'GREEN leg, on the working tree. Run the roster-truth class after the deletion: the live-roster property and the fleet-level discrimination case both pass.'
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_check_accounting.py::TestRosterCarriesNoFullyDeclaringModule -q -p no:cacheprovider --randomly-seed=12345
  expected: Exit 0. Pytest reports 2 passed and no failures for the selected class.
  fix_if: 'A failure listing names means the roster still carries a check the metric proves fully declared -- strike exactly those names, never loosen the assertion or narrow the roster read. A failure of the discrimination case means the oracle returns nothing over the whole fleet, so the property is vacuous: fix the oracle, do not delete the case.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Step-specific, and deliberately NOT the merge-inversion argument the base-relative steps take: this class asserts a property of the LIVE roster and the LIVE metric, which does not invert on merge, and a shard invoking it WOULD clear the differential admission gate -- on the reverted tree the run fails because the class is absent there. That admission is exactly why the shard is not worth installing: its fail leg would discriminate the test module''s PRESENCE, not the roster property, while the property itself already runs unconditionally in the full tier''s whole-suite pytest phase on every run. Graduating it would add a second invocation surface for one assertion and buy no discrimination the standing tier lacks. This is the plan''s only load-bearing standing artefact, so its disposition is stated per step rather than inherited from the other steps'' blanket inversion clause (Decision 132).'
- step: 4
  phase: pre-deploy
  action: AFTER property, hermetic and independent of pytest. Assert none of the eleven remains on the roster, then measure every remaining roster name through the live metric and assert not one is is_fully_declared. Prints the remaining count plus the undecidable and zero-success-exit names so the residue is visible rather than inferred.
  command: bin/venv-python -c "import yaml,pathlib;from scripts.checks import registry;from scripts.checks.hygiene._declaring_coverage import measure_check,is_fully_declared;D={'validate_authority_budget','validate_ci_refresh_read_coverage','validate_contract_drift','validate_convergence_writer_isolation','validate_deploy_channel_conformance','validate_differential_gate_baseline','validate_fallback_reevaluation','validate_ghas_probe','validate_invoke_implies_resolve','validate_plan_documents','validate_prose_allowlist'};r=set(yaml.safe_load(pathlib.Path('config/check_accounting_baseline.yaml').read_text(encoding='utf-8'))['entries']);still=sorted(r&D);assert not still,still;c=registry.all_checks();rows=[(n,measure_check(n,registry.resolve(n))) for n in sorted(r&set(c))];proven=[n for n,x in rows if is_fully_declared(x)];assert not proven,proven;u=sorted(n for n,x in rows if x.undecidable_reason is not None);z=sorted(n for n,x in rows if x.undecidable_reason is None and x.success_exits==0);print('AFTER_OK remaining='+str(len(rows))+' fully_declared=0 undecidable='+str(len(u))+' zero_success_exit='+str(len(z)));print('undecidable='+str(u));print('zero_success_exit='+str(z))"
  expected: Exit 0, and fully_declared=0 in every case -- that clause is what the command asserts. At the pinned base the line reads AFTER_OK remaining=69 fully_declared=0 undecidable=0 zero_success_exit=1, followed by undecidable=[] and zero_success_exit=['validate_ci_rca_adjudication']; the remaining and zero_success_exit figures are evidence about the residue, not a pinned constant.
  fix_if: 'A non-empty still list means a deletion was not applied -- apply it. A non-empty proven list names a roster entry the metric proves fully declared: strike it too if step 1''s oracle also proves it, otherwise STOP and record the disagreement. A changed remaining/undecidable count is not a failure by itself, but re-record the grouping in the PR body before proceeding.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the standing pytest property step 3 already carries, in a second surface, so graduating it would install a second copy of one assertion; and its deletion-set clause is transient to this diff. It earns its place here as the hermetic, replayable evidence validate_vp_replay can re-execute on the implement PR, not as a permanent registry row.
- step: 5
  phase: pre-deploy
  action: 'Run the registered ratchet itself on the working tree and pin the direction of the change: zero growth against the origin/main base, the removed set equal to the eleven BY NAME, every remaining entry still inside the frozen _BASELINE_SEED, that constant''s own module absent from the diff, and an empty failed list from validate_check_accounting.'
  command: bin/venv-python -c "import yaml,pathlib;from scripts.checks import _common,_marker_guard;from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting,_BASELINE_SEED;D={'validate_authority_budget','validate_ci_refresh_read_coverage','validate_contract_drift','validate_convergence_writer_isolation','validate_deploy_channel_conformance','validate_differential_gate_baseline','validate_fallback_reevaluation','validate_ghas_probe','validate_invoke_implies_resolve','validate_plan_documents','validate_prose_allowlist'};base=set(yaml.safe_load(_marker_guard.default_base_reader('config/check_accounting_baseline.yaml'))['entries']);cur=set(yaml.safe_load(pathlib.Path('config/check_accounting_baseline.yaml').read_text(encoding='utf-8'))['entries']);grown=sorted(cur-base);assert not grown,grown;assert (base-cur)==D,sorted((base-cur)^D);outside=sorted(cur-_BASELINE_SEED);assert not outside,outside;t={p for _s,p in _common.get_status_aware_diff()};assert 'scripts/checks/hygiene/validate_check_accounting.py' not in t,'the guard module including _BASELINE_SEED was edited';f=[];validate_check_accounting(f);assert not f,f;print('GUARD_OK growth=0 seed_cross_check_intact seed_unedited remaining='+str(len(cur)));print('shrunk='+str(sorted(base-cur)))"
  expected: Exit 0. The check prints its PASS line with the registered-check and baselined counts (120 and 69 at the pinned base; the registered figure rises as checks are added, so read it as evidence rather than a constant). Then GUARD_OK growth=0 seed_cross_check_intact seed_unedited remaining=69, followed by shrunk= listing the eleven struck names in sorted order -- that list, not the counts, is what the command asserts.
  fix_if: 'A non-empty grown list means the roster gained an entry -- remove it; the roster is shrink-only with no marker escape and re-adding a removed name is never permitted. A symmetric-difference assertion means the applied deletion set differs from the plan''s -- reconcile to the plan, not the other way. An outside list means an entry is not in _BASELINE_SEED, which a deletion can never cause: investigate before proceeding. A non-empty failed list is the ratchet itself failing -- read its printed violations; never edit _BASELINE_SEED or a check module to clear it.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Base-relative and therefore transient: the shrink clause compares against origin/main, which after merge already carries the shrunk roster, so the equality assertion inverts. The permanent half -- that the ratchet passes and its shrink-only and frozen-seed arms hold -- is already a registered check running in both tiers (validate_check_accounting), so a shard would duplicate a live gate.'
- step: 6
  phase: pre-deploy
  action: 'Scope boundary, both directions: the working-tree-aware status diff equals exactly the two declared scope files plus this plan''s own sanctioned path -- nothing outside, nothing declared but untouched.'
  command: bin/venv-python -c "from scripts.checks import _common;t={p for _s,p in _common.get_status_aware_diff()};e={'config/check_accounting_baseline.yaml','tests/checks/hygiene/test_validate_check_accounting.py','docs/plans/PLAN-check-accounting-roster-free-shrink.yaml'};assert t==e,{'outside_declared_scope':sorted(t-e),'declared_but_untouched':sorted(e-t)};print('TOUCHED_SET_EXACT '+str(sorted(t)))"
  expected: Exit 0 and TOUCHED_SET_EXACT listing exactly config/check_accounting_baseline.yaml, docs/plans/PLAN-check-accounting-roster-free-shrink.yaml and tests/checks/hygiene/test_validate_check_accounting.py in sorted order.
  fix_if: 'outside_declared_scope names a path this plan never declared: revert that edit. Never resolve it by appending the path to this plan''s scope -- an undeclared touched path is a STOP under the scope-boundary contract''s deviation branch b, and the escape is a human-directed plan amendment. declared_but_untouched means a scope row was not implemented -- implement it.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts this diff's own transient file set, which is meaningless once merged, and the durable rule it instantiates is already a registered check in both tiers (validate_scope_boundary reading docs/contracts/implement-scope-boundary.yaml). A shard would pin one PR's file list forever.
- step: 7
  phase: pre-deploy
  action: 'Touch-it-fix-it, asserted independently of the guard: resolve every name on the origin/main roster to its defining module and require none of those modules to appear in the working-tree-aware status diff. This is what makes step 1''s module-identity premise true and keeps the slice off every roster-listed check module, including the eleven being struck.'
  command: bin/venv-python -c "import subprocess,yaml;from scripts.checks import _common;from scripts.checks.hygiene.validate_check_accounting import _check_module_rel_path;r=yaml.safe_load(subprocess.run(['git','show','origin/main:config/check_accounting_baseline.yaml'],capture_output=True,text=True,check=True).stdout)['entries'];mods={p for p in (_check_module_rel_path(n) for n in r) if p};t={p for _s,p in _common.get_status_aware_diff()};hit=sorted(mods&t);assert not hit,hit;print('NO_ROSTER_MODULE_IN_DIFF scanned_modules='+str(len(mods)))"
  expected: Exit 0 and NO_ROSTER_MODULE_IN_DIFF scanned_modules=79 -- 79 distinct defining modules behind the 80 origin/main roster names, none of them touched.
  fix_if: 'A non-empty hit list names a roster-listed check module this diff edits. Revert the edit: editing a baselined module obligates adopting its declaration in the same PR (touch-it-fix-it), which is check-module work this slice forbids. A scanned_modules figure below 79 means a roster name stopped resolving -- investigate before proceeding, do not lower the assertion.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Transient: it constrains this PR''s diff, not a durable repository property, and the standing rule is arm (d) of validate_check_accounting itself, which already runs in both tiers over whatever the current diff is. A shard would freeze one branch''s diff shape.'
- step: 8
  phase: pre-deploy
  action: 'Lint and format the only changed Python file: ruff check clean, ruff format --check clean at line length 127.'
  command: bin/venv-python -m ruff check tests/checks/hygiene/test_validate_check_accounting.py && bin/venv-python -m ruff format --check tests/checks/hygiene/test_validate_check_accounting.py
  expected: Exit 0. ruff check prints All checks passed! and ruff format prints 1 file already formatted.
  fix_if: 'E501 or an unused-import F401 after adding the new imports: fix the code (split the long line, drop the unused name). Never add a noqa to silence it and never widen the line-length setting.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: scripts.validate already runs ruff check and ruff format repo-wide in both the fast and full tiers, so a shard scoped to one file would duplicate an existing standing gate with strictly less coverage.
- step: 9
  phase: pre-deploy
  action: 'SLOC ceiling including tests: the only changed Python file stays under 500 non-blank, non-comment lines, so nothing is registered in config/sloc_budgets.yaml and no raise-approved marker is owed.'
  command: bin/venv-python -c "import pathlib;P=['tests/checks/hygiene/test_validate_check_accounting.py'];m={p:len([l for l in pathlib.Path(p).read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')]) for p in P};over=sorted(k for k,v in m.items() if v>500);assert not over,over;print('SLOC_OK '+str(sorted(m.items())))"
  expected: Exit 0 and SLOC_OK [('tests/checks/hygiene/test_validate_check_accounting.py', 289)] -- a figure at or near 289 and in every case below 500.
  fix_if: 'An over list means the file crossed 500: decompose into a sibling test module under tests/checks/hygiene/ (Decision 128 decompose-by-default). Never raise a budget, never add a config/sloc_budgets.yaml entry, and never add a raise-approved marker for this slice.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_sloc_limits already enforces the same 500-line ceiling repo-wide in both tiers and validate_sloc_budget_raises already gates unmarked increases, so a shard pinning one file's count would duplicate two live gates and additionally count-couple to a file that legitimately grows.
- step: 10
  phase: pre-deploy
  action: 'Decision 182 breadth: run the selection-budget derivation over this plan''s declared scope plus its own path and require the predicted outcome to be within_budget, so the slice is planned as one unit rather than split.'
  command: bin/venv-python -c "import json,subprocess,sys;o=subprocess.run([sys.executable,'-m','scripts.checks.deps.selection_budget','--paths','config/check_accounting_baseline.yaml','tests/checks/hygiene/test_validate_check_accounting.py','docs/plans/PLAN-check-accounting-roster-free-shrink.yaml','--json'],capture_output=True,text=True).stdout;r=json.loads(o[o.index('{'):]);assert r['predicted_outcome']=='within_budget',r;print('BREADTH_OK n_selected='+str(r['n_selected'])+' census='+str(r['census'])+' allowance_s='+str(r['allowance_s'])+' outcome='+r['predicted_outcome'])"
  expected: Exit 0 and BREADTH_OK n_selected=4 census=539 allowance_s=180.0 outcome=within_budget -- a small selection against a census in the five hundreds, sitting on the 180s floor of the test half.
  fix_if: 'predicted_outcome other than within_budget means this scope now selects enough test modules to breach the derived allowance: split the slice into smaller units rather than waiving the budget, and never pass --ignore-budget.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Measures this plan's own transient scope list, so a shard would assert a figure that stops meaning anything once the branch merges; the standing enforcement is validate.py's budget-assertion scaffold over scripts.checks.deps.selection_budget on every --pre run.
- step: 11
  phase: pre-deploy
  action: Fast presubmit tier over the complete working tree -- the authoritative pre-merge gate when PR CI runs it.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0 with no failed checks reported in the summary.
  fix_if: 'Any red check: read its printed violations and fix the cause in the declared scope. Never weaken a check, a test, a tolerance or a budget to obtain green (Decision 181); an out-of-scope defect becomes a recommendation, not an inline fix (Decision 59).'
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: Full presubmit tier before handoff, exercising the whole pytest suite including the new roster-truth property.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with no failed checks; the full-tier pytest phase collects and passes the new class.
  fix_if: 'A red full tier blocks commit and PR under this plan''s handoff policy: resume later and rerun the full tier from the start rather than committing on a partial pass. Never weaken a check or a test to obtain green.'
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: pre-deploy
  action: 'rec-3429 relevance-probe honesty (Decision 103). Execution step 3 has already strengthened the rec''s stored acceptance through update_rec; this step reads the refreshed local read cache and proves three things about it: the stored probe names the roster file, validate_deploy_channel_conformance and all four part-2 modules, the rec is still open, and RUNNING the stored probe on this working tree exits non-zero. The last clause is the one that matters -- it is the executed proof that a deterministic relevance sweep cannot report rec-3429 satisfied while its part 2 is unstarted. The probe runs under the 10-second timeout docs/contracts/recommendation-relevance.yaml specifies for acceptance probes, so the step matches the contract execution semantics and cannot hang.'
  command: bin/venv-python -c "import json,pathlib,subprocess;rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()];r=[x for x in rows if x.get('id')=='rec-3429'];assert len(r)==1,len(r);a=str(r[0]['acceptance']);need=['validate_deploy_channel_conformance','config/check_accounting_baseline.yaml','validate_recommendations_schema','validate_pydantic_yaml_drift','validate_rec_relevance_contract','validate_field_semantics_drift'];missing=[n for n in need if n not in a];assert not missing,missing;assert r[0]['status']=='open',r[0]['status'];rc=subprocess.run(['sh','-c',a],timeout=10).returncode;assert rc!=0,'the strengthened probe still reports satisfied while part 2 is unstarted';print('REC_PROBE_STRENGTHENED rec-3429 status=open clauses='+str(len(need))+' probe_exit='+str(rc))"
  expected: 'Exit 0 and REC_PROBE_STRENGTHENED rec-3429 status=open clauses=6 probe_exit=1. The stored acceptance reads: grep -q ''registry.examined'' scripts/checks/ops_governance/validate_deploy_channel_conformance.py && ! grep -q ''validate_deploy_channel_conformance'' config/check_accounting_baseline.yaml && grep -q ''registry.examined'' scripts/checks/ops_governance/validate_recommendations_schema.py && grep -q ''registry.examined'' scripts/checks/ops_governance/validate_pydantic_yaml_drift.py && grep -q ''registry.examined'' scripts/checks/ops_governance/validate_rec_relevance_contract.py && grep -q ''registry.examined'' scripts/checks/ops_governance/validate_field_semantics_drift.py -- the first two clauses are rec-3429''s original probe, kept verbatim, and the four appended clauses are its part 2. The probe exits non-zero because those four modules carry no registry.examined call at this base.'
