pre_implementation_checklist:
  - Branch confirmed not on main.
  - docs/PROJECT_CONTEXT.md read.
  - Decision 118 and Decision 113 sections read (only the plan-cited ones needed).
  - The writer contract, scripts/contracts.py, scripts/contracts_enforcement.py and the two capture modules read.
  - >-
    Before the contract edit: /mnt/project-files/writer-contract-ratification/STEP10.md records a converged Step 10
    multi-perspective critique (PROCEED from both perspectives, or Benjamin's accepted deferral) of the execution-step text,
    and Benjamin's approval of that text is located in the planning thread. If either is missing, stop and ask.
execution_steps:
  - >-
    1. Capture profile: in scripts/telemetry_capture/transport.py make_client and scripts/telemetry_capture/verify.py
    credentials_available, call resolve_aws_profile(DEFAULT_SSO_PROFILE) (import DEFAULT_SSO_PROFILE from
    scripts.aws_profile on the existing import line), and update both docstrings to say the agent_platform profile is pinned
    and the ambient AWS_PROFILE is not honoured. Create tests/telemetry_capture/test_capture_profile.py with class
    TestCaptureSignsAsPlatformDev (three tests: make_client and credentials_available under AWS_PROFILE=agent_platform_admin
    open agent_platform; both pass None with AWS_ACCESS_KEY_ID set). Fake boto3 the way
    tests/telemetry_capture/test_transport.py and test_verify.py already do; monkeypatch env, never the real chain.
  - >-
    2. Create tests/checks/contracts/test_telemetry_writer_ratification.py, class TestWriterContractRatification, five tests:
    test_contract_is_ratified_with_census (status, contract_version 1, ratified_via names the plan and Decision 118,
    trigger_fired_at, census text present, both new audit invariant lines present, newest amendment_log entry is
    governance_note_add with semantic_break false); test_typed_error_registry_matches_contract (TYPED_ERROR_TESTS key set ==
    {(verb, key) for every verbs.<verb>.typed_errors key}); test_registry_nodes_resolve_and_name_their_error (each node
    'path::test_name' resolves via ast to a top-level def in an existing file, and that def's source, decorators included,
    contains the quoted error literal or the error's mapped exception class name per the handler's maps);
    test_registry_bases_are_allowed (basis in {verb, layer, shared}; shared only for unmapped, catalog_unavailable, runtime,
    occ_exhausted, blob_integrity, blob_grant_self_check, blob_store_access, blob_store_unavailable);
    test_registry_checks_fail_on_drift (the pure helpers report problems for a synthetic contract with an extra typed error, a
    registry with an extra pair, a node naming a missing def, a node that resolves but names another error, and a shared
    basis on a request-grammar error). EVIDENCE RULE for a pair: basis verb -- the node drives that verb to that error;
    layer -- the node tests a module only that verb's path reaches (e.g. src/telemetry/request.py, the append or blobs
    module); shared -- the node tests the handler-wide mapping (_ERROR_MAP, _BLOB_FAULTS, the unmapped and
    catalog_unavailable paths) that every verb dispatches through. Seed TYPED_ERROR_TESTS from
    /mnt/project-files/writer-contract-ratification/typed-error-seed.md, reading each node and correcting any row whose node
    does not assert its pair under this rule.
  - >-
    3. Contract header (docs/contracts/ducklake_telemetry_writer.yaml, contract block): replace `status: provisional_v0`
    with these three lines, filling <BUILD_DATE> with the build commit's UTC date (YYYY-MM-DD):
      status: ratified
      ratified_at: "<BUILD_DATE>"
      ratified_via: >-
        Step 10 multi-perspective critique + PLAN-ratify-telemetry-writer-contract merge to main (re_ratification_trigger
        production_invocations >= 500 fired 2026-10-29; Decision 118)
  - >-
    4. provisional_v0 block: after `re_ratification_owner: "human + Step 10 multi-perspective critique"` add, at the same
    indent:
      trigger_fired_at: "2026-10-29"
      ratification_census: >-
        Production traffic from the flip (2026-10-27T11:39:15Z) to 2026-10-29: 1,836 AWS/Lambda Invocations, Errors 0,
        Url5xxCount 0; 1,835 C6 lines, one per answered invocation. Every contract verb answered 200 (append_telemetry 865,
        describe 750, register_project 156, register_tenant 22, begin_blobs 8, provision_telemetry 8). Typed errors seen:
        bad_request and the unknown-action 400 (gate probes) and one tenant_unresolved (the first append after the flip,
        before registration). Limits: one table batch at the 2,000-row cap, and one request at 5,205,449 of the 5,242,880
        invoke-byte cap (99.3%). 69% of requests were PlatformAdmin-signed through the ADMIN environment's AWS_PROFILE until
        turn capture was pinned to PlatformDev. Every other declared typed error is held by the test
        tests/checks/contracts/test_telemetry_writer_ratification.py names for it.
  - >-
    5. audit_invariants: (a) append to the end of the line that starts "No request that reaches the handler answers the
    Function URL's 502" the sentence " The C6 line's own emission is the one handler-level exception, declared below
    (rec-4317)." (b) insert directly after that line:
      - "Declared residual (rec-4317): handler() emits the C6 line after the answer is computed and outside any try, so an exception while building or printing that line would surface as the runtime 502. Production showed none: 1,835 C6 lines for 1,835 answered invocations from the flip to 2026-10-29."
    (c) append as the last audit_invariants item:
      - "Principal classes: routine traffic is signed by github_ci_branch (CI's ambient credentials) or PlatformDev; turn capture resolves the agent_platform (PlatformDev) profile, never the ambient AWS_PROFILE (scripts/telemetry_capture). PlatformAdmin can still invoke the URL as the unbounded operator (Decision 144 cl.3, Decision 230 cl.5, Decision 213's residual owned by rec-4204); the handler does not refuse it, and the C6 line's caller_role shows it. Admitting another producer identity follows rec-4420 (T3.22 c4)."
  - >-
    6. amendment_log: insert as the FIRST entry (the log is newest first):
      - date: "<BUILD_DATE>"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-ratify-telemetry-writer-contract: status provisional_v0 -> ratified after the re-ratification trigger
          (production_invocations >= 500) fired on 2026-10-29. provisional_v0 keeps its trigger and gains trigger_fired_at
          and the production census. audit_invariants add the principal-classes line (turn capture now signs as
          PlatformDev) and the rec-4317 residual, and the no-502 line points at it. Every declared typed error is pinned to
          a test that names it.
        migration_story: >-
          No verb, request, response or error changes. Turn capture signs as PlatformDev instead of the ambient AWS_PROFILE
          role; the tenant is the signed account (Decision 200), so rows land in the same tenant and only caller_role
          changes.
  - Execute the Verification Plan steps 1-5; loop until they pass; stop and RCA on an unrecoverable failure (Decision 55).
  - Push the branch and run VP step 6 from this session on the pushed branch; it must pass before the merge is requested.
  - >-
    Ask Benjamin for his word on the merge, pasting the contract diff inline in the thread; squash-merge once CI is green and
    he approves.
  - "Report: contract ratified (status, census), typed-error registry size and basis counts, capture profile fix, VP results incl. PROBE_CALLERS."
rollback: >-
  The capture-profile fix reverts on its own (git revert of its files). The contract cannot simply revert: the CD.25 drift
  gate forbids ratified -> provisional_v0 (scripts/contracts.py _ALLOWED_TRANSITIONS), so a ratification found wrong is
  corrected by an amendment_log-recorded amendment, or by deprecating or superseding the contract with a fresh
  contract_version. No data, IAM or deploy state changes.
