  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<pending>; Step 10 critique on the pinned contract text=<pending>"
  - >-
    Evidence: /mnt/project-files/writer-contract-ratification/EVIDENCE.md (census 2026-10-27T11:39Z to 2026-10-29; log
    retention is 14 days, so the census is snapshotted into the contract). Fable consult on the forks:
    /mnt/project-files/writer-contract-ratification/fable-brief/BRIEF.md (writer alone; coverage test; keep provisional_v0;
