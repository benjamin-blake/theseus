schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ratify-telemetry-writer-contract"
intent: >-
  Re-ratify the telemetry writer's Class B verb contract (docs/contracts/ducklake_telemetry_writer.yaml) from provisional_v0
  to ratified now that its re-ratification trigger (production_invocations >= 500) has fired, on a production traffic census
  plus a test that pins every declared typed error to a test naming it, and make the census's one principal divergence true
  before ratifying: turn capture signs the writer path as PlatformDev instead of the ADMIN environment's ambient AWS_PROFILE
  role, proven live before the merge.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ratify-telemetry-writer-contract.yaml
phase: >-
  Decision 118 per-contract graduation of a provisional_v0 Class B contract (re_ratification_owner "human + Step 10
  multi-perspective critique"); T2.36 (the writer's tier item) is complete, so no tier_item criterion is claimed. First
  Class B provisional_v0 -> ratified transition in the repo.
scope:
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: >-
      status provisional_v0 -> ratified with ratified_at and ratified_via; provisional_v0 keeps its trigger and gains
      trigger_fired_at and ratification_census; audit_invariants gain the principal-classes line and the rec-4317 residual,
      and the no-502 line points at that residual; one governance_note_add amendment_log entry. Exact text in
      execution_steps 3-6.
  - file: tests/checks/contracts/test_telemetry_writer_ratification.py
    action: Create
    purpose: >-
      Class TestWriterContractRatification: the contract is ratified with its census and both new invariants; a
      TYPED_ERROR_TESTS registry maps every (verb, typed_error) pair the contract declares to one pytest node and an
      evidence basis (verb | layer | shared), key set equal to the contract's; every node resolves to a def whose source,
      decorators included, names the error literal or its mapped exception class; shared only for handler-wide errors;
      red cases on synthetic input.
  - file: scripts/telemetry_capture/transport.py
    action: Modify
    purpose: >-
      make_client resolves resolve_aws_profile(DEFAULT_SSO_PROFILE), so turn capture signs the writer as PlatformDev
      (agent_platform) whatever AWS_PROFILE names; CI and Lambda keep the ambient chain (resolve_aws_profile returns None
      there). Its docstring is updated in place.
  - file: scripts/telemetry_capture/verify.py
    action: Modify
    purpose: >-
      credentials_available mirrors make_client's resolution (its docstring says it does), so it pins the same profile;
      docstring updated; the edit is line-neutral (the file is 496 of 500 SLOC, unregistered).
  - file: tests/telemetry_capture/test_capture_profile.py
    action: Create
    purpose: >-
      Class TestCaptureSignsAsPlatformDev: with AWS_PROFILE=agent_platform_admin and no ambient keys, make_client and
      credentials_available open their boto3 Session under agent_platform; with AWS_ACCESS_KEY_ID set both pass None (CI).
      A new file keeps test_verify.py (545 lines) and test_transport.py unchanged.
  - file: docs/plans/PLAN-ratify-telemetry-writer-contract.yaml
    action: Create
    purpose: This planning artefact.
bundled_recommendations: []
followon_recs:
  - rec-4706
  - rec-4707
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/ducklake_telemetry_writer.yaml loads through scripts.contracts.load_contract at status ratified,
    contract_version 1, with ratified_at and a ratified_via naming PLAN-ratify-telemetry-writer-contract and Decision 118;
    evaluate_provisional_trigger returns (False, None) for it; its provisional_v0 block carries trigger_fired_at
    "2026-10-29" and the ratification_census text of execution step 4.
  - >-
    audit_invariants carry the principal-classes line and the rec-4317 declared residual verbatim from execution step 5, and
    the no-502 line ends with the pointer sentence of execution step 5; the amendment_log's newest entry is execution step
    6's governance_note_add entry with semantic_break false.
  - >-
    tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification passes, and its helpers
    report a problem when a declared typed error has no registry row, when a row names an undeclared pair, when a node does
    not resolve, when a resolved node names neither the error literal nor its mapped class, and when a non-handler-wide
    error claims the shared basis.
  - >-
    Turn capture's two writer-path credential sites (transport.make_client, verify.credentials_available) resolve
    agent_platform under AWS_PROFILE=agent_platform_admin and pass None when AWS_ACCESS_KEY_ID is set
    (tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev).
  - The CD.25 contract-drift gate passes (no forbidden transition, no unrecorded description change) in the full tier.
  - >-
    Before the merge, a telemetry_probe sent through the build branch's capture transport from this ADMIN-environment
    session reaches the production writer signed as PlatformDev (its C6 line's caller_role), not PlatformAdmin.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the capture-profile class. It does not exist today, so red-before replay sees pytest exit 4; after the change its
      three tests pass.
    command: bin/venv-python -m pytest tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev -q
    expected: exit 0, three tests passed. Before the change pytest reports the class not found.
    fix_if: >-
      A site still opens its Session under agent_platform_admin -- pass DEFAULT_SSO_PROFILE at that site. CI case not None
      -- the call must go through resolve_aws_profile, never a hard-coded profile_name. Never change resolve_aws_profile's
      precedence (rec-4707 owns the shared resolver).
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: graduate
    graduation_check_id: capture-signs-as-platform-dev
  - step: 2
    phase: pre-deploy
    action: >-
      Run the ratification class: contract ratified with census and invariants, typed-error registry equal to the
      contract's declared set, every node resolvable and naming its error, bases allowed, red cases. Absent today (exit 4).
    command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification -q
    expected: exit 0, five tests passed. Before the change pytest reports the class not found.
    fix_if: >-
      A pair with no node that meets the evidence rule (execution step 2) -- STOP and report the pair: never ratify an
      unasserted error, never drop the error from the contract, never widen the shared set to pass. A node that does not
      resolve or does not name its error -- pick the correct node from the seed or the tests.
    hermetic: true
    expected_literals: ["5 passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-contract-ratified
  - step: 3
    phase: pre-deploy
    action: >-
      Re-run the existing guards that read the edited contract or the edited capture modules, to prove the edit kept them
      green.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_telemetry_production_cutover.py
      tests/checks/contracts/test_telemetry_blob_contracts.py tests/checks/contracts/test_tenant_id_producer_identity_model.py
      tests/telemetry_capture/test_transport.py tests/telemetry_capture/test_verify.py -q
    expected: exit 0, no failures, before and after the change.
    fix_if: >-
      A guard fails -- the contract edit changed text a guard pins (e.g. provisional_v0.surfacing_note); restore that text.
      Never edit a guard to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A no-regression re-run of existing standing test files (green before and after by design), and partly modified-file
      whole-file selectors, which hermetic_authoring rule (v) keeps non-hermetic.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the status transition and trigger state through the real contract machinery, outside the new tests: the loader,
      the Invariant-6 transition table and the provisional-trigger evaluator.
    command: >-
      bin/venv-python -c "from scripts.contracts import load_contract, validate_status_transition; from
      scripts.contracts_enforcement import evaluate_provisional_trigger, check_re_ratification_trigger; d =
      load_contract('docs/contracts/ducklake_telemetry_writer.yaml'); c = d.contract; assert c.status.value == 'ratified'
      and c.contract_version == 1, c.status; assert 'PLAN-ratify-telemetry-writer-contract' in c.ratified_via and
      'Decision 118' in c.ratified_via; assert c.ratified_at; assert validate_status_transition('provisional_v0',
      'ratified'); assert evaluate_provisional_trigger(d, {'production_invocations': 10**9}) == (False, None); assert
      check_re_ratification_trigger(d) == []; assert c.provisional_v0['trigger_fired_at'] == '2026-10-29';
      print('WRITER_CONTRACT_RATIFIED', c.ratified_at)"
    expected: Prints WRITER_CONTRACT_RATIFIED and the ratified_at date; exit 0. Today it fails on the status assertion.
    fix_if: An AssertionError names the field to fix in the contract block (execution step 3/4 text).
    hermetic: true
    expected_literals: ["WRITER_CONTRACT_RATIFIED"]
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates step 2's graduated test_contract_is_ratified_with_census, which pins the same status, ratified_via and
      provisional_v0 fields as a standing regression guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Full-tier handoff on the committed, rebased, clean tree (git-ops.yaml handoff_sequence): the CD.25 contract-drift gate
      checks the provisional_v0 -> ratified transition and the amendment record, plus every other gate; then attest HEAD.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; the Validation Summary lists no failure (Contract drift (CD.25) PASS) and --verify-head attests the checked
      HEAD's tree.
    fix_if: >-
      A failure in scope is fixed on the branch, committed, and this step re-run from the start; one outside scope becomes a
      rec via scripts.ops_data_portal (Decision 59, Decision 55). Never skip or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Live principal proof BEFORE the merge (the ratification cannot be reverted; the capture fix runs from this checkout):
      on the pushed build branch, in this ADMIN-environment session (AWS_PROFILE is agent_platform_admin here), send one
      telemetry_probe through the branch's capture transport for the session's own tree, then read the production writer's
      C6 lines for telemetry_probe from the last 15 minutes with the PlatformDev profile and count them by caller_role.
      Read-only verbs; no admin credential is used for the read.
    command: >-
      bin/venv-python -m scripts.telemetry_capture probe --tree "$(ls -t ~/.claude/projects/*/*.jsonl | head -1)"; bin/venv-python -c "import boto3,
      json, time, collections; logs = boto3.Session(profile_name='agent_platform').client('logs', region_name='eu-west-2');
      r = logs.filter_log_events(logGroupName='/aws/lambda/agent-platform-ducklake-telemetry-writer',
      startTime=int((time.time() - 900) * 1000), filterPattern='telemetry_probe'); rows = [json.loads(e['message']) for e in
      r['events'] if e['message'].startswith('{')]; c = collections.Counter(x.get('caller_role') for x in rows if
      x.get('verb') == 'telemetry_probe'); print('PROBE_CALLERS', dict(c))"
    expected: >-
      The probe prints per-table grain counts (rows may be zero for a fresh session; the probe's own exit status is not the
      assertion). PROBE_CALLERS shows at least one PlatformDev and zero PlatformAdmin.
    fix_if: >-
      PlatformAdmin present -- the probe ran on a checkout without the fix or a site still honours AWS_PROFILE; confirm
      git log and re-run. No telemetry_probe line -- the probe never reached the writer (read its printed reason); re-run
      once, then report. Never use admin credentials for the read.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/ducklake_telemetry_writer.yaml
    behavior: >-
      The writer contract stays ratified with its census and invariants, and every typed error it declares stays pinned to
      a test that names it (a new error without a registered node fails).
    verification_step: 2
    test_selector: tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification
    red_green_expectation: >-
      red before, green after -- the class does not resolve today (pytest exit 4) and its five tests pass once the contract
      edit and test land.
  - source: scripts/telemetry_capture/transport.py
    behavior: make_client opens its boto3 Session under agent_platform whatever AWS_PROFILE names; None on CI.
    verification_step: 1
    test_selector: tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev
    red_green_expectation: red before (class absent, exit 4), green after.
  - source: scripts/telemetry_capture/verify.py
    behavior: credentials_available resolves the same profile as make_client.
    verification_step: 1
    test_selector: tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev
    red_green_expectation: red before (class absent, exit 4), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Apply the contract text of execution steps 3-6 VERBATIM, filling only <BUILD_DATE>. It is the text Benjamin approves in
    the planning thread after the planning-time Step 10 multi-perspective critique (context records both); any wording
    change is a new approval: stop and ask.
  - >-
    Never add PlatformAdmin to contract.governance.principal_classes (Decision 113 two-principal semantic; Decision 144
    cl.3; tenant-id.yaml producer identity note; rec-4420 owns admitting new producer identities). principal_classes,
    every verb, response code and typed error stay byte-identical.
  - >-
    Never change scripts/aws_profile.py's precedence and do not touch scripts/telemetry_capture/read_route.py or
    src/common/ducklake_reader_client.py: the read paths and the shared resolver are rec-4707 (with the ADMIN environment's
    AWS_PROFILE default, an environment setting outside this plan).
  - >-
    Keep the provisional_v0 block (tests/checks/contracts/test_telemetry_production_cutover.py reads its surfacing_note;
    every provisional scan keys on status, so a ratified contract's block is inert). contract_version stays 1. No numbered
    Decision (Decision 150 routing: a status flip routes to the owning contract).
  - >-
    No Lambda code change: rec-4317 and rec-4492 stay open (the first is recorded as a declared residual). No IAM, terraform,
    Neon or secret change; no admin credential use (PlatformDev-default rule, Benjamin 2026-10-29).
  - >-
    PUBLIC repository (Decision 101): no account id, ARN, principal ref or hash of either in the contract, tests, commit or
    PR body. Census figures are counts and role names only.
  - >-
    New test modules stay under 500 SLOC, import no other test module, and live in tests/checks/contracts/ and
    tests/telemetry_capture/ beside the guards they extend. verify.py stays line-neutral (single-line import).
  - >-
    Build merge needs Benjamin's own word (Class B contract ratification is on the always-ask list), asked only after VP 6
    passes; no Lambda deploy is triggered (compute_affected_artifacts over the scope is empty).
context:
