schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: roadmap-size-ceiling
intent: >-
  Dispose audit finding SGE-05 -- record the operator's supersession of its PRODUCT ceiling
  recommendation, make docs/ROADMAP-PRODUCT.yaml's deliberate freeze legible and enforceable,
  record the roadmap raw-line unit residual, and close the structural-size engine's unaccountable
  escape routes so a future agent cannot silently widen a gate it is meant to be stopped by.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-size-ceiling.yaml
phase: >-
  Platform governance-integrity. Slice C (SGE-05) of the structural-size-governance-expansion
  overseer run driving audits/size-governance-expansion-3dee4a5.yaml (merged in #840) to
  completion. Audit-sourced; no tier_item id and no product-roadmap phase dependency. Consumes
  Slice A (Decision 165 / PLAN-size-gov-marker-guard, d1cc5bb) and Slice B (Decision 166 /
  PLAN-size-gov-engine, #851). Sibling slice SGE-03 runs in parallel and does NOT touch
  config/structural_size_budgets.yaml -- this plan owns that file exclusively for the run.
scope:
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Record the docs/ROADMAP-PRODUCT.yaml freeze as machine-readable data (new top-level
      budget_notes:), reshape the roadmaps row's defer_to_incumbent into an accountable per-path
      mapping, and add limit_note + unit_gameability_residual to the roadmaps row. The roadmaps
      limit stays 500 and the docs/ROADMAP-PRODUCT.yaml 4707 budgets entry is NOT touched.
  - file: scripts/checks/structural/size_limits.py
    action: Modify
    purpose: >-
      Add the static escape-accountability legs (E1 floor pin, E2-strict class-ceiling pin, E3
      deferral accountability, E4 budget-note integrity) as a new escape_violations() helper
      returning leg-labelled messages, consumed by the existing validate_structural_size_limits
      check. No new registered check and no new scripts/validate.py re-export line.
  - file: scripts/checks/structural/budget_raises.py
    action: Modify
    purpose: >-
      Add the base-aware half of E4 -- frozen_base_violations(base_text, current_text), whose three
      legs reject an INCREASE to a frozen entry, an UN-FREEZE while its entry survives, and a frozen
      path becoming NEWLY DEFERRED -- wired into validate_structural_size_budget_raises via its
      existing base_reader seam, preserving the base-unreachable advisory SKIP. This module already
      owns the base-versus-current diff, which is why these rules belong here rather than being
      approximated in a git-less helper that cannot see a deletion.
  - file: tests/checks/structural/test_size_limits.py
    action: Modify
    purpose: >-
      Cover every E1-E4 static failure mode by leg label, pin the budgets-entry-caps-over-class-
      ceiling mechanism, assert the live-tree freeze state, and add the declared regression guards
      for PLATFORM and the long-line companion.
  - file: tests/checks/structural/test_budget_raises.py
    action: Modify
    purpose: >-
      Mirror-test the frozen-increase rule -- an increase reds, a shrink passes, a no-op passes, a
      committed valid marker does not rescue an increase, and a non-frozen entry is unaffected.
  - file: tests/checks/structural/test__classify.py
    action: Modify
    purpose: >-
      Update the injected-root registry fixture to the reshaped defer_to_incumbent mapping so the
      existing exclusion tests exercise the shape that actually ships.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Append the graduated rows for this plan's graduate-disposition VP steps, under the hard
      constraint that this file has ZERO long-line headroom (measured 2315 against a 2315 pin).
acceptance_criteria:
  - >-
    docs/ROADMAP-PRODUCT.yaml keeps its budgets entry at exactly 4707 with its existing dec-166
    marker, and config/structural_size_budgets.yaml records it under a new budget_notes section as
    frozen true, with a rationale and a retires_when condition.
  - >-
    Frozen-ness is determined from the BASE text, not the current file. Any INCREASE to an entry
    frozen in base is rejected regardless of marker and regardless of what the current file says
    about frozen-ness, closing the measured Proof B defect and the one-commit unfreeze-and-raise
    variant. A DECREASE and a no-op both pass, because compaction is the roadmaps row's own
    first-listed relief valve and a durable norm under Decision 147.
  - >-
    UN-FREEZING is itself a violation: a path frozen in base and not frozen in current reds WHILE
    its budgets entry survives. This closes the two-PR escape (unfreeze at an unchanged value in one
    PR, raise in the next). Removing the note AND the budgets entry together stays clean, because
    that is the prescribed retirement shape and entry removal is unrestricted.
  - >-
    Freeze and deferral are mutually exclusive dispositions, enforced by a SPLIT pair because
    neither half covers the other's case (demonstrated at plan time). Static half, current-side: a
    path frozen in the CURRENT config may not appear in any defer_to_incumbent mapping -- this
    catches a note and a deferral added together in one commit, which a base-side rule cannot see
    because base has neither. Base-side half: a path frozen in BASE may not be NEWLY present in
    defer_to_incumbent in current -- this catches the measured bypass, which deletes the note in the
    same commit and so is invisible to the current-side rule.
  - >-
    An unreachable base produces the advisory SKIP line and NEVER a clean result derived from an
    empty base map. The pure-text signature moves check_diff's base_text-is-None contract onto the
    caller, so the caller must propagate None as a SKIP rather than coercing it to an empty string.
  - >-
    A budget_notes key naming a path absent from the budgets roster is rejected, and so is a frozen
    note whose budgets entry has been removed.
  - >-
    E4 carries an EXISTENCE leg, as E3 does: a frozen note whose path no longer exists on disk
    produces a clean, actionable violation naming the retirement -- never a FileNotFoundError inside
    a presubmit check. This is the planned end state, since retires_when names the migration that
    deletes the guarded file.
  - >-
    E1 and E2 are TYPE-SAFE: a governed class row whose limit or max_line_chars is not an integer
    (the three exempt rows carry the string "n/a" today) produces a labelled violation, never a
    TypeError from comparing a string to an integer.
  - >-
    A budgets entry caps its path even when its class row ceiling is higher -- the mechanism the
    freeze actually depends on, pinned by test.
  - >-
    The roadmaps class row still declares limit 500 and max_line_chars 2000, and the residual row is
    still last at 500 and 2000 -- now enforced live by the gate rather than only by a graduated
    registry row that CI never executes. A missing residual row is rejected, not silently tolerated.
  - >-
    No governed class row can declare a limit or max_line_chars above the permitted maximum for its
    slug, where a slug absent from the guard module's frozen per-slug mapping defaults to the
    residual default. A new governed class at 500 needs no guard edit; only a class wanting more
    than 500 does.
  - >-
    Every defer_to_incumbent entry names an incumbent present in the validate check sequence and an
    authorized_by Decision whose body contains the exact deferred path. A missing field, a dec-114
    citation, an unsequenced incumbent, a glob path, and a nonexistent file each red the gate, and a
    glob is rejected on the glob rule specifically rather than incidentally on non-existence.
  - >-
    Every violation message escape_violations returns is prefixed with its leg label E1, E2, E3 or
    E4, and every verification assertion keys on that label, so a step can never be satisfied by a
    different leg than the one it claims to pin.
  - >-
    validate_structural_size_limits reds on a line longer than 2000 characters in a governed
    roadmaps-class file.
  - >-
    docs/ROADMAP-PLATFORM.yaml behaviour is unchanged -- absent from iter_measured_files(),
    _ROADMAP_MAX_LINES still 10000, file byte-identical.
  - >-
    The roadmaps row carries a limit_note that resolves the actual_purpose versus limit-500 tension
    and names the guard source as the sanctioned path for a different class ceiling, plus a
    unit_gameability_residual recording SGE-05's VD3 finding.
  - >-
    This branch touches none of docs/DECISIONS.md, scripts/validate.py, docs/ROADMAP-PRODUCT.yaml,
    docs/ROADMAP-PLATFORM.yaml, asserted against the merge-base so main advancing under an open PR
    cannot produce a false failure.
  - >-
    Every graduated registry row whose check_id starts with structural- still replays green after
    these edits.
  - >-
    Exactly FIVE recommendations are filed via the ops portal, matching one-for-one the five
    enumerated in Context. This count is asserted rather than left implicit because it drifted once
    already: fold-ins across critique rounds grew it from three to five while the execution step
    still said three, which would have silently dropped the stale-roster sweep and the
    incumbent-gate-governs-nothing residual. If a later revision adds a sixth, this criterion and
    the execution step move together.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-class-ceiling-pinned-to-guard-source
    action: >-
      E1 and E2-strict, each asserted BY LEG LABEL so neither can be satisfied by the other. Covers
      a raised class limit, a raised class max_line_chars, a raised residual floor, and a missing
      residual row.
    command: |
      bin/venv-python -c 'import copy
      from scripts.checks.structural.size_limits import escape_violations
      from scripts.checks.structural._classify import load_registry
      L = load_registry()
      assert escape_violations(L) == [], "live class table is not clean: " + str(escape_violations(L))
      def legs(m):
          return {x.split(":")[0] for x in escape_violations(m)}
      m = copy.deepcopy(L)
      [r for r in m["classes"] if r["slug"] == "roadmaps"][0]["limit"] = 6000
      assert "E2" in legs(m), "E2 must reject a raised class-row limit"
      m2 = copy.deepcopy(L)
      [r for r in m2["classes"] if r["slug"] == "roadmaps"][0]["max_line_chars"] = 8000
      assert "E2" in legs(m2), "E2 must reject a raised class-row max_line_chars"
      m3 = copy.deepcopy(L)
      m3["classes"][-1]["limit"] = 2000
      assert "E1" in legs(m3), "E1 must reject a raised residual floor"
      m4 = copy.deepcopy(L)
      m4["classes"] = [r for r in m4["classes"] if r["slug"] != "residual"]
      assert "E1" in legs(m4), "E1 must reject a missing residual row"
      m5 = copy.deepcopy(L)
      [r for r in m5["classes"] if r["slug"] == "workflow_outputs"][0]["governed"] = True
      assert "E2" in legs(m5), "E2 must REPORT a non-integer limit on a governed row, never raise"
      import scripts.checks.structural.size_limits as sl
      sl._PERMITTED_MAXIMA["roadmaps"] = (6000, 2000)
      m6 = copy.deepcopy(L)
      [r for r in m6["classes"] if r["slug"] == "roadmaps"][0]["limit"] = 6000
      assert escape_violations(m6) == [], "a slug PRESENT in the mapping must permit its granted ceiling"
      m7 = copy.deepcopy(L)
      [r for r in m7["classes"] if r["slug"] == "roadmaps"][0]["limit"] = 6001
      assert "E2" in legs(m7), "one over the granted ceiling must still red"
      del sl._PERMITTED_MAXIMA["roadmaps"]
      print("CLASS_CEILING_PINNED_OK")'
    expected: >-
      Exit 0 and `CLASS_CEILING_PINNED_OK` on stdout.
    fix_if: >-
      An E1 assertion fails while E2 messages appear -- E1 is not implemented and E2 was masking it,
      which is exactly what this step exists to prevent. A missing residual row raises instead of
      returning a violation -- the helper fails open, the same shape as rec-3020, and must return a
      labelled violation instead. The governed-flip probe raises TypeError -- E2 compared the string
      "n/a" against an integer; type-check before comparing and report a violation instead.
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-deferral-accountability
    action: >-
      E3 -- every deferral is attributable, asserted by leg label, with the glob probe additionally
      required to fail on the GLOB rule rather than incidentally on non-existence.
    command: |
      bin/venv-python -c 'import copy
      from scripts.checks.structural.size_limits import escape_violations
      from scripts.checks.structural._classify import load_registry
      P = "docs/ROADMAP-PLATFORM.yaml"
      L = load_registry()
      assert escape_violations(L) == [], "live deferral table is not clean"
      def mutated(fn):
          m = copy.deepcopy(L)
          fn([r for r in m["classes"] if r["slug"] == "roadmaps"][0]["defer_to_incumbent"])
          return [x for x in escape_violations(m) if x.startswith("E3:")]
      assert mutated(lambda d: d[P].__setitem__("authorized_by", "dec-114")), "dec-114 must FAIL"
      assert mutated(lambda d: d[P].__setitem__("authorized_by", "dec-147")) == [], "dec-147 must PASS"
      assert mutated(lambda d: d[P].__setitem__("incumbent", "validate_no_such_gate")), "dead gate must FAIL"
      assert mutated(lambda d: d[P].pop("authorized_by")), "a missing authorized_by must FAIL"
      g = mutated(lambda d: d.__setitem__("docs/ROADMAP-*.yaml", dict(d[P])))
      assert any("glob" in x for x in g), "a glob must FAIL on the glob rule, not on non-existence: " + str(g)
      print("DEFERRAL_ACCOUNTABILITY_OK")'
    expected: >-
      Exit 0 and `DEFERRAL_ACCOUNTABILITY_OK` on stdout.
    fix_if: >-
      dec-114 passes -- the guard matches something looser than the exact path key. dec-147 fails --
      the guard is over-strict and would reject a legitimate citation. The glob probe fails only on
      non-existence -- add an explicit glob rule whose message names it, otherwise a glob that
      happens to match a real file would slip through.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-frozen-budget-note-integrity
    action: >-
      E4 static half -- the freeze record exists, is well-formed, cannot be orphaned in either
      direction, and REPORTS rather than crashes when its path is gone. Asserted by leg label. The
      missing-path case is the planned end state, not a hypothetical: retires_when names the
      warehouse-graph migration, which is the event that deletes the guarded file.
    command: |
      bin/venv-python -c 'import copy
      from scripts.checks.structural.size_limits import escape_violations
      from scripts.checks.structural._classify import load_registry
      K = "docs/ROADMAP-PRODUCT.yaml"
      L = load_registry()
      assert L["budget_notes"][K]["frozen"] is True, "the freeze record is absent or not frozen"
      assert L["budgets"][K] == 4707, "the frozen pin moved off 4707"
      assert escape_violations(L) == [], "live frozen state is not clean"
      def e4(m):
          return [x for x in escape_violations(m) if x.startswith("E4:")]
      m = copy.deepcopy(L)
      m["budget_notes"]["docs/NOT-A-REAL-FILE.yaml"] = dict(m["budget_notes"][K])
      assert e4(m), "E4 must reject a budget_notes key with no budgets entry"
      m2 = copy.deepcopy(L)
      m2["budgets"].pop(K)
      assert e4(m2), "E4 must reject a frozen note whose budgets entry was removed"
      m3 = copy.deepcopy(L)
      GONE = "docs/GONE-AFTER-MIGRATION.yaml"
      m3["budgets"][GONE] = 100
      m3["budget_notes"][GONE] = dict(m3["budget_notes"][K])
      v3 = e4(m3)
      assert any("exist" in x for x in v3), "E4 must REPORT a missing frozen path, never raise: " + str(v3)
      m4 = copy.deepcopy(L)
      [r for r in m4["classes"] if r["slug"] == "roadmaps"][0]["defer_to_incumbent"][K] = {
          "incumbent": "validate_product_roadmap", "authorized_by": "dec-166"}
      assert e4(m4), "E4 must reject deferring a FROZEN path -- measured: that un-governs it entirely"
      print("FROZEN_NOTE_INTEGRITY_OK")'
    expected: >-
      Exit 0 and `FROZEN_NOTE_INTEGRITY_OK` on stdout.
    fix_if: >-
      An orphan note passes -- the freeze record can drift away from the roster it annotates, and a
      future reader would trust a note describing an entry that no longer exists. The missing-path
      probe raises FileNotFoundError -- E4 touched the filesystem without guarding existence, and
      would crash --pre at exactly the moment the retires_when migration deletes the file.
  - step: 4
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: structural-frozen-base-side-legs
    action: >-
      E4 diff half -- three legs, all reading frozen-ness from BASE. Reproduces Proof B (the pin
      raised while keeping its committed dec-166 marker), the one-commit unfreeze-and-raise variant,
      the two-PR unfreeze-then-raise escape, and the MEASURED deferral bypass, while proving a
      SHRINK and a genuine retirement both stay clean so compaction and the retires_when migration
      remain available.
    command: |
      bin/venv-python -c 'import pathlib
      from scripts.checks.structural.budget_raises import frozen_base_violations
      LINE = "docs/ROADMAP-PRODUCT.yaml: 4707"
      base = pathlib.Path("config/structural_size_budgets.yaml").read_text(encoding="utf-8")
      assert LINE in base, "the frozen pin line moved -- re-anchor this probe before trusting it"
      def e4(cur):
          return [x for x in frozen_base_violations(base, cur) if x.startswith("E4:")]
      assert frozen_base_violations(base, base) == [], "a no-op diff must be clean"
      assert e4(base.replace(LINE, "docs/ROADMAP-PRODUCT.yaml: 9999")), "leg 1: an INCREASE must red even with the committed marker"
      assert frozen_base_violations(base, base.replace(LINE, "docs/ROADMAP-PRODUCT.yaml: 4000")) == [], "a SHRINK must pass"
      unfrozen = base.replace("frozen: true", "frozen: false")
      assert "frozen: false" in unfrozen, "probe anchor failed -- the frozen flag is not written as expected"
      assert e4(unfrozen.replace(LINE, "docs/ROADMAP-PRODUCT.yaml: 9999")), "legs 1+2: a one-commit unfreeze-and-raise must red"
      assert e4(unfrozen), "leg 2: un-freezing while the entry survives must red"
      retired = "\n".join([x for x in unfrozen.splitlines() if not x.startswith("  " + LINE)])
      assert frozen_base_violations(base, retired) == [], "retirement (unfreeze plus entry removal) must stay clean"
      ANCHOR = "      docs/ROADMAP-PLATFORM.yaml:\n        incumbent: validate_platform_roadmap\n        authorized_by: dec-166\n"
      assert ANCHOR in base, "the deferral block shape changed -- re-anchor this probe"
      ADDED = ANCHOR + "      docs/ROADMAP-PRODUCT.yaml:\n        incumbent: validate_product_roadmap\n        authorized_by: dec-166\n"
      bypass = "\n".join([x for x in unfrozen.replace(ANCHOR, ADDED).splitlines() if not x.startswith("  " + LINE)])
      assert e4(bypass), "leg 3: a path frozen in BASE that is newly deferred must red even with its note deleted"
      print("FROZEN_BASE_LEGS_OK")'
    expected: >-
      Exit 0 and `FROZEN_BASE_LEGS_OK` on stdout.
    fix_if: >-
      The increase passes -- Proof B is still open and the freeze remains aspirational. The shrink
      reds -- the rule was implemented as equality rather than direction, which taxes the roadmaps
      row's own first-listed relief valve; the structural engine has no --update-sloc-budgets
      equivalent to absorb that cost, so direction-only is the required shape.
  - step: 5
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible, but it asserts a PRE-EXISTING engine property (the budgets-entry-overrides-
      class-limit resolution order) that already holds on origin/main. The VF-06 differential
      admission gate requires a new row to FAIL on origin/main and PASS on HEAD, so it would refuse
      this one. It ships as a regression test in the unit suite instead.
    action: >-
      Regression guard (passes on the unmodified tree, declared as such): a budgets entry caps its
      path unconditionally, even when its class row ceiling is higher. This -- not E2-strict -- is
      what actually protects the freeze.
    command: |
      bin/venv-python -c 'import copy, pathlib
      from scripts.checks.structural import _classify
      L = _classify.load_registry()
      K = "docs/ROADMAP-PRODUCT.yaml"
      rows = {r["slug"]: r for r in L["classes"]}
      eff = _classify.effective_lines(pathlib.Path(K).read_text(encoding="utf-8"))
      assert L["budgets"].get(K, rows["roadmaps"]["limit"]) == 4707, "the entry is not the effective cap"
      raised = copy.deepcopy(L)
      [r for r in raised["classes"] if r["slug"] == "roadmaps"][0]["limit"] = 6000
      rows2 = {r["slug"]: r for r in raised["classes"]}
      assert raised["budgets"].get(K, rows2["roadmaps"]["limit"]) == 4707, "a higher class ceiling overrode the entry"
      assert eff == 4707, "PRODUCT measured " + str(eff) + " -- the freeze has zero headroom by design"
      print("BUDGET_ENTRY_CAPS_OK")'
    expected: >-
      Exit 0 and `BUDGET_ENTRY_CAPS_OK` on stdout.
    fix_if: >-
      The resolved cap becomes 6000 when the class ceiling rises -- the freeze would evaporate the
      moment any future slice raised the roadmaps row, and the resolution order must be corrected
      before anything else in this plan matters.
  - step: 6
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The already-graduated row structural-engine-green-and-scoped (plan_slug size-gov-engine)
      asserts both halves of this step, and the step passes on origin/main anyway, which the VF-06
      differential would refuse. The _ROADMAP_MAX_LINES clause is the only novel assertion and is
      covered by the unit suite.
    action: >-
      Regression guard (passes on the unmodified tree, declared as such): PLATFORM stays unmeasured,
      its incumbent ceiling constant is untouched, and the whole engine is green.
    command: |
      bin/venv-python -c 'import scripts.validate as v
      from scripts.checks.structural._classify import iter_measured_files
      from scripts.checks.roadmap.validate_platform_roadmap import _ROADMAP_MAX_LINES
      measured = {rel for rel, _slug in iter_measured_files()}
      assert "docs/ROADMAP-PLATFORM.yaml" not in measured, "PLATFORM must stay deferred (Decisions 114/147)"
      assert "docs/ROADMAP-PRODUCT.yaml" in measured, "PRODUCT must stay measured"
      assert _ROADMAP_MAX_LINES == 10000, "the incumbent ceiling constant moved"
      failed = []
      v.validate_structural_size_limits(failed)
      assert not failed, "engine red: " + str(failed)
      print("PLATFORM_UNTOUCHED_ENGINE_GREEN")'
    expected: >-
      Exit 0 and `PLATFORM_UNTOUCHED_ENGINE_GREEN` on stdout.
    fix_if: >-
      PLATFORM appears in the measured set -- the defer_to_incumbent reshape broke key membership
      and the class max_line_chars will now fire on its known long line. Revert the reshape rather
      than adding a long_line_budgets entry for a file the engine must not measure.
  - step: 7
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      An identical test_selector row over this exact node_id is already graduated as
      structural-unit-suite-failure-paths (plan_slug size-gov-engine); a second row would duplicate
      it rather than add coverage.
    action: >-
      Run the structural unit suite, which carries the full failure-mode matrix for E1-E4 across
      both modules plus the long-line companion and freeze regression guards.
    command: bin/venv-python -m pytest tests/checks/structural/ -q
    expected: >-
      Exit 0, with a strictly higher test count than the 29 collected at plan time and no failures.
    fix_if: >-
      A failure-mode test passes without the guard change -- the test is vacuous and must be
      re-anchored against a mutation that genuinely reds. A regression guard fails -- the reshape or
      a new leg changed behaviour this plan promised to leave alone.
  - step: 8
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Full-tier presubmit, satisfying the handoff_policy obligation this plan declares (Decision
      163). Not hermetic -- recursion into scripts.validate is forbidden for replayed steps.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 with no failed checks reported in the summary.
    fix_if: >-
      Any check reds. Diagnose the named check; do not narrow this plan's scope to route around it.
      A structural-size failure on config/agent/verification_registry/registry.yaml most likely
      means a graduated row appended a line longer than its 2315-character pin.
  - step: 9
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts a property of THIS branch -- that four named files are untouched -- not a standing
      repo invariant. Graduating it would install a permanent freeze on files this plan merely
      declines to modify, which is a much stronger claim than the one being made.
    action: >-
      Prove the branch spends no Decision header, adds no scripts/validate.py line, and edits
      neither roadmap file. Uses the THREE-DOT merge-base form, because two-dot reds whenever main
      advances under an open PR on paths the branch never touched.
    command: |
      bin/venv-python -c 'import subprocess, pathlib
      paths = ["docs/DECISIONS.md", "scripts/validate.py",
               "docs/ROADMAP-PRODUCT.yaml", "docs/ROADMAP-PLATFORM.yaml"]
      r = subprocess.run(["git", "diff", "--name-only", "origin/main...HEAD", "--"] + paths,
                         capture_output=True, text=True)
      assert r.returncode == 0, "no merge-base with origin/main -- run: git fetch origin main"
      assert r.stdout.strip() == "", "this branch must touch none of these, but changed: " + r.stdout
      src = pathlib.Path("scripts/validate.py").read_text(encoding="utf-8")
      eff = len([x for x in src.splitlines() if x.strip() and not x.strip().startswith("#")])
      assert eff <= 500, "scripts/validate.py is over the SLOC limit at " + str(eff)
      print("NO_DECISION_NO_VALIDATE_LINE_NO_ROADMAP_EDIT")'
    expected: >-
      Exit 0 and `NO_DECISION_NO_VALIDATE_LINE_NO_ROADMAP_EDIT` on stdout.
    fix_if: >-
      A file is listed -- either this branch genuinely edited it (remove the edit), or the branch is
      behind main and the base is stale (run git fetch origin main and rebase, then re-run).
      docs/DECISIONS.md appearing means a Decision was minted, which this plan forbids.
constraints:
  - >-
    Mint NO numbered Decision. The class table, the counting rule and these guard thresholds are
    field semantics whose home is config/structural_size_budgets.yaml and the guard modules
    (docs/contracts/decision-entry.yaml significance.routing.field_semantics -- "Never a numbered
    Decision"). The live header count is 119 of 120; the last slot is not spent here.
  - >-
    Decisions carry broad architectural direction; mechanism belongs in code and contracts. The
    budget_notes rationale and the roadmaps limit_note state INTENT and the retirement condition
    only -- they must not narrate what the guard does. A reader can read the guard.
  - >-
    Do NOT modify docs/ROADMAP-PRODUCT.yaml, its 4707 budgets entry, or its dec-166 marker. The
    zero-headroom pin is a deliberate operator freeze pending migration to a warehouse-backed
    dependency graph, not a wedge. A red gate on that file is the freeze working.
  - >-
    Do NOT modify docs/ROADMAP-PLATFORM.yaml, scripts/checks/roadmap/validate_platform_roadmap.py,
    or _ROADMAP_MAX_LINES. That ceiling is fixed by Decisions 114/147 and this engine defers to it
    by exact filename; do not split the file (Decisions 110/114 forbid a per-tier split).
  - Do NOT raise the roadmaps class limit. It stays at the residual default of 500.
  - >-
    HAZARD, measured: config/agent/verification_registry/registry.yaml has a longest line of exactly
    2315 against a 2315-character pin -- ZERO headroom. Any graduated row appended with a line longer
    than 2315 characters reds validate_structural_size_limits, this plan's own gate. Keep every
    appended line at or under that width and re-run the engine after appending.
  - >-
    HAZARD, measured: scripts/validate.py sits at 497 effective lines against the implicit 500 limit
    and is NOT registered in config/sloc_budgets.yaml. Add NO line to it. Both structural checks are
    already re-exported there; the new legs are helpers consumed by existing checks, never new
    registered checks.
  - >-
    scripts/checks/structural/budget_raises.py (64 raw, 54 effective) and size_limits.py (55 raw, 46
    effective) are .py files, so the structural engine EXCLUDES them by suffix -- they are governed
    by validate_sloc_limits at the implicit 500 instead. Neither may be registered in
    config/sloc_budgets.yaml; re-measure both after editing rather than assuming they stayed small.
  - >-
    Do NOT modify scripts/checks/_marker_guard.py. Six consumers share it; the frozen-increase rule
    is local to this registry and belongs in budget_raises.py.
  - >-
    Every leg FAILS LOUDLY AND LEGIBLY, never by exception. Malformed or missing input -- a
    non-integer limit on a governed row, a missing residual row, a frozen path deleted from disk, an
    unreadable file -- must produce a labelled violation, not a TypeError, KeyError or
    FileNotFoundError inside a presubmit check. Under Decision 55's anti-masking principle a crash
    is worse than a miss here, because it obscures which check failed and why. Guard the type and
    the existence before comparing or reading.
  - >-
    The graduated row structural-guard-binds-shared-marker-module asserts the literals `subprocess`,
    `## Decision` and `make_flat_extractor` are ABSENT from scripts/checks/structural/budget_raises.py
    -- verified absent at plan time. That applies to CODE AND DOCSTRINGS alike, since the assertion
    is a substring scan of the whole file: do not mention make_flat_extractor in a docstring
    explaining why the section extractor is used, and do not reach for subprocess for git access
    (use the base_reader seam). Nothing in CI catches a break here, because
    validate_verification_registry runs differentials only for new-in-diff check_ids.
  - >-
    Prose written into config/structural_size_budgets.yaml stays under 2000 characters per line.
    structural-longline-roster-exactly-measured asserts the >2000-character breach set equals the
    seeded roster EXACTLY, so a single long rationale line reds it even though the file's own budget
    entry would still pass.
  - >-
    Every glob keeps both the .yaml and .yml spellings (rec-2928). Do not narrow the roadmaps
    include list.
  - >-
    Never write `! cmd` under `set -e` -- POSIX exempts inverted commands from set -e, so the
    negation cannot fail. Use `if cmd; then echo FAIL; exit 1; fi`.
  - >-
    Assert branch-touched-this-file with the three-dot merge-base form, never two-dot. Two-dot reds
    whenever main advances under an open PR, on paths the branch never touched.
  - >-
    No assertion that already passes on the unmodified tree may be presented as proof of this
    change. Every VP step that passes on the unmodified tree says so in its own action text.
  - >-
    Run long commands in the FOREGROUND. Never use run_in_background and then wait -- a background
    completion does not re-invoke a subagent. If a command exceeds the tool cap, launch it with
    nohup and poll its log in bounded foreground calls.
  - No rescue agents or workaround loops; fail loud (Decision 55).
  - Only files listed in scope may be modified.
