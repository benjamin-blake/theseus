schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "opswriter-never-drain-guard"
intent: >-
  Close rec-2929 by giving OpsWriter.drain() the never-drain guard Decision 84 I-4 requires, so the
  last unguarded path that could re-stage a DuckLake-migrated ops row from a local file into Iceberg
  is shut -- protecting the warehouse-as-source-of-truth invariant the autonomous loop depends on.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-opswriter-never-drain-guard.yaml
phase: >-
  Platform T2 (durable operational state hardening). Guards the Decision 84 I-4 retired-outbox
  invariant ahead of the T2.26 legacy-staging retirement. Not a tier_item slice: this is an
  ad_hoc_rec (rec-2929), so the Tier Item Freshness Gate is skipped per the soft-warn exception
  categories.
scope:
  - file: src/common/outbox_retirement.py
    action: Create
    purpose: >-
      Sole home for the retired-outbox classification -- DUCKLAKE_MIGRATED_TABLES and
      is_retired_dir(). Must live under src/ because both Lambda manifests bundle `src/` wholesale
      but neither includes scripts/sync/, so scripts/ops_writer.py cannot import the constant from
      scripts.sync.ops without an in-Lambda ImportError. Pure stdlib leaf (no boto3, no awswrangler).
  - file: tests/test_outbox_retirement.py
    action: Create
    purpose: >-
      Unit tests for the sole home. Path is mapper-verified: map_source_to_test() resolves
      src/common/outbox_retirement.py to tests/test_outbox_retirement.py, NOT tests/common/ (the
      src/-generic branch fires because the module is in neither _ALL_MIRROR_TARGET_HOMES nor
      _RETIRING_GRANDFATHER_HOMES).
  - file: scripts/ops_writer.py
    action: Modify
    purpose: >-
      Add the never-drain guard to drain(): import is_retired_dir from the sole home and filter the
      table loop through it. Budgeted at +1 SLOC (569 -> 570 against a 571 budget) by making the
      filter a generator expression on the existing `for table in TABLE_NAMES:` line rather than an
      if/continue block.
  - file: tests/ops_writer/test_drain.py
    action: Modify
    purpose: >-
      Add the retired-skip tests: drain() must not put_object() and must not unlink() a
      migrated-table outbox file, and must still drain ops_session_log and telemetry_* normally.
  - file: scripts/sync/ops.py
    action: Modify
    purpose: >-
      Import DUCKLAKE_MIGRATED_TABLES and is_retired_dir from the sole home; re-export
      DUCKLAKE_MIGRATED_TABLES to preserve every existing `from scripts.sync.ops import ...` site;
      replace the inline predicate at line 298 with is_retired_dir(table).
  - file: tests/sync/ops/test_sync_cli.py
    action: Modify
    purpose: >-
      Update the DUCKLAKE_MIGRATED_TABLES set-equality assertion if the re-export changes how it
      resolves; the assertion must keep proving the re-export is live, not merely that a name exists.
  - file: tests/sync/ops/test_drain.py
    action: Modify
    purpose: >-
      PRE-AUTHORIZED, likely a no-op. Holds the existing sync_ops.drain() retired-skip test that the
      predicate swap must keep green. Listed so constraint 1 does not strand the implementer if
      consuming the sole home perturbs it.
  - file: tests/test_outbox_hermeticity_guard.py
    action: Modify
    purpose: >-
      PRE-AUTHORIZED, likely a no-op. Unit-tests tests/fixtures/outbox_guard.py directly, so
      re-pointing that fixture at the sole home could perturb it. Listed for the same reason.
  - file: scripts/checks/ops_governance/validate_outbox_staleness.py
    action: Modify
    purpose: >-
      Delete the private _is_retired_dir copy and consume is_retired_dir from the sole home.
  - file: tests/checks/ops_governance/test_validate_outbox_staleness.py
    action: Modify
    purpose: >-
      Keep the check at or above its 95.8 coverage baseline entry after the private copy is removed.
  - file: tests/fixtures/outbox_guard.py
    action: Modify
    purpose: >-
      Re-point at the sole home (import is_retired_dir rather than redefining it) and update the
      module docstring, which currently names scripts.sync.ops as the verbatim source.
  - file: scripts/convergence_health/code_drift.py
    action: Modify
    purpose: >-
      Add src/common/outbox_retirement.py to PROD_SOURCE_PATHSPECS so a future edit to the sole home
      triggers the governed prod deploy and is visible to the drift sensor.
  - file: tests/convergence_health/test_code_drift.py
    action: Modify
    purpose: >-
      Add a membership assertion that PROD_SOURCE_PATHSPECS contains the sole-home path. NOT a
      coverage requirement: PROD_SOURCE_PATHSPECS is a module-level tuple, so adding an element adds
      no statement and cannot move line coverage. The file currently has no PROD_SOURCE_PATHSPECS
      reference at all, and the existing test_git_runner_receives_prod_source_pathspecs uses
      membership rather than an exact count, so adding an entry breaks nothing (no count-coupling
      hazard per tests/CLAUDE.md).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Add one row per graduating VP step (steps 1, 2, 4, 6, 9 carry graduation: graduate with a
      graduation_check_id -- step 5 is deliberately waived, see its graduation_waiver_reason).
      validate_graduation_completeness's implement-PR leg requires a new-in-diff registry row for
      each, so this file must be in Scope or constraint 1 would forbid the very bookkeeping the
      dispositions oblige. Every added row must pass VF-06 differential admission (fail on
      origin/main, pass on HEAD) -- all five were checked against origin/main and are genuinely
      differential.
  - file: .github/workflows/deploy-prod-lambdas.yml
    action: Modify
    purpose: >-
      Add the matching 'src/common/outbox_retirement.py' entry to on.push.paths. rec-2686 requires
      this filter and PROD_SOURCE_PATHSPECS stay in sync; there is NO automated check enforcing it
      (verified), so the two edits must land together in this PR.
bundled_recommendations:
  - rec-2929
  - rec-2895
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    OpsWriter.drain() never calls put_object() for, and never unlinks, a file under the
    logs/.ops-outbox/ops_decisions/ or logs/.ops-outbox/ops_priority_queue/ dirs, while still
    draining ops_session_log and every telemetry_* table exactly as before. Those two names are the
    ONLY ones for which this guard is a behaviour change: drain() iterates the fixed TABLE_NAMES
    list, which contains no *_pending member and neither ops_recommendations nor
    ops_execution_plans -- so a test staged under any of those would pass identically before and
    after and proves nothing.
  - >-
    The guard is expressed as the general retired-dir predicate (is_retired_dir), not as a hardcoded
    two-name check, so it forward-guards any future TABLE_NAMES addition of a migrated table or a
    *_pending dir. This is a code-shape criterion, not a behaviour change demonstrable today.
  - >-
    src/common/outbox_retirement.py is the SOLE definition of the retired-dir classification: no
    other file in scripts/, src/ or tests/ redefines the `in DUCKLAKE_MIGRATED_TABLES or
    endswith("_pending")` predicate, and scripts.sync.ops.DUCKLAKE_MIGRATED_TABLES still resolves
    for every existing importer.
  - >-
    scripts/ops_writer.py stays at or under its 571 SLOC budget with no new
    `# raise-approved:` marker added to config/sloc_budgets.yaml.
  - >-
    rec-2929's stored acceptance command passes verbatim against the working tree.
  - >-
    src/common/outbox_retirement.py appears in BOTH PROD_SOURCE_PATHSPECS and the
    deploy-prod-lambdas.yml on.push.paths filter.
  - >-
    Both affected active Lambda artifacts (data-pipeline, ops-compaction) are rebuilt and deployed
    through the governed .github/workflows/deploy-prod-lambdas.yml channel with their per-function
    smoke gate green, and the deployed code carries the guard.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Sole home exists, exports both public names, and carries the migrated-table set unchanged from
      its previous home in scripts/sync/ops.py.
    command: >-
      bin/venv-python -c "from src.common.outbox_retirement import DUCKLAKE_MIGRATED_TABLES,
      is_retired_dir; assert DUCKLAKE_MIGRATED_TABLES == frozenset({'ops_recommendations',
      'ops_decisions', 'ops_priority_queue', 'ops_execution_plans'}), DUCKLAKE_MIGRATED_TABLES;
      assert is_retired_dir('ops_decisions') and is_retired_dir('ops_priority_queue') and
      is_retired_dir('anything_pending'); assert not is_retired_dir('ops_session_log') and not
      is_retired_dir('telemetry_sessions'); print('OK')"
    expected: "Prints OK and exits 0."
    fix_if: >-
      A KeyError/ImportError means the module or a name is missing. An AssertionError on the frozenset
      means the set was transcribed rather than moved -- copy it verbatim from scripts/sync/ops.py:56.
      An AssertionError on ops_session_log means the predicate over-matches and would stop a
      legitimate legacy-staging drain.
    hermetic: true
    graduation: graduate
    graduation_check_id: outbox-retirement-sole-home-exports
  - step: 2
    phase: pre-deploy
    action: >-
      The retired-dir predicate has exactly ONE definition repo-wide (Decision 104 sole-home) -- the
      three pre-existing private copies are gone.
    command: >-
      test "$(grep -rn 'in DUCKLAKE_MIGRATED_TABLES or' --include='*.py' scripts/ src/ tests/ | wc -l)"
      -eq 1
    expected: >-
      Exit 0. Exactly one match, in src/common/outbox_retirement.py. Before this plan the count is 3
      (tests/fixtures/outbox_guard.py:20, scripts/checks/ops_governance/validate_outbox_staleness.py:10,
      scripts/sync/ops.py:298).
    fix_if: >-
      Count 2 or 3 means a private copy survived -- re-point that consumer at the sole home. Count 0
      means the sole home phrased the predicate differently; either restate it in this form or update
      this step's pattern to match the real single definition. FALSE POSITIVE to avoid: the pattern is
      a plain recursive grep over tests/ too, so quoting the predicate verbatim in the new
      tests/test_outbox_retirement.py docstring inflates the count to 2 and this fix_if would
      misdiagnose it as a surviving copy. Describe the predicate in prose there, do not quote it.
    hermetic: true
    graduation: graduate
    graduation_check_id: outbox-retirement-single-definition
  - step: 3
    phase: pre-deploy
    action: >-
      Behavioural proof of the guard: drain() refuses retired dirs and still drains legitimate ones.
      This is the step that would catch a guard that silently no-ops or that over-matches.
    command: >-
      bin/venv-python -m pytest tests/ops_writer/test_drain.py tests/test_outbox_retirement.py
      tests/sync/ops/test_drain.py tests/test_outbox_hermeticity_guard.py -q
    expected: >-
      All pass. The new drain tests MUST stage their retired-dir fixture under ops_decisions and/or
      ops_priority_queue -- the only two TABLE_NAMES members the guard changes behaviour for -- and
      must assert BOTH negatives (put_object never called for that table, and the outbox file still
      exists afterwards) and the positives (ops_session_log and a telemetry_* table still drain and
      still unlink), and that drain()'s returned results dict is still seeded from the FULL
      TABLE_NAMES so retired tables report 0 rather than vanishing from the return shape. At least one
      new test node id must contain the substring retired -- see step 4. NOTE (deliberate): the word
      retired is written WITHOUT backticks here. validate_vp_replay extracts backtick-delimited
      literals from expected and requires each to appear in the replayed command's stdout+stderr;
      pytest -q prints paths and progress dots, never node ids for passing tests, so a backticked
      literal here would hard-fail replay on a correct implementation. Do not add backticks to this
      field.
    fix_if: >-
      A test staged under ops_recommendations, ops_execution_plans or any *_pending dir is
      NON-DISCRIMINATING: drain() iterates the fixed TABLE_NAMES list, which contains none of them, so
      such a test passes identically with and without the guard. Re-stage it under ops_decisions or
      ops_priority_queue. Separately, a test asserting the file survives but not that put_object was
      never called is too weak -- a guard that stages then fails to unlink would pass it. Assert on
      the mock's call args, not just on filesystem state.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The evidence is a multi-file pytest invocation over four suites, not one of the six canonical
      primitive slots; a test_selector slot would pin only a single node id and would stop guarding
      the other three suites this step deliberately runs together.
  - step: 4
    phase: pre-deploy
    action: >-
      BOTH bundled recs' acceptance commands pass. rec-2929's stored command runs VERBATIM (both
      halves); rec-2895's REPLACEMENT command (see execution step 9) runs alongside it. The guard name
      is load-bearing code in scripts/ops_writer.py, not a comment.
    command: >-
      grep -q 'is_retired_dir\|DUCKLAKE_MIGRATED_TABLES\|_RETIRED' scripts/ops_writer.py &&
      bin/venv-python -m pytest tests/ops_writer/test_drain.py -q -k retired &&
      test "$(grep -c 'is_retired_dir' scripts/ops_writer.py)" -ge 2 &&
      grep -q 'is_retired_dir' scripts/ops_writer.py &&
      grep -q 'DUCKLAKE_MIGRATED_TABLES' src/common/outbox_retirement.py
    expected: >-
      Exit 0. Measured baseline before this plan: rec-2929's grep half exits 1 and its pytest half
      exits 5 (101 collected, 101 deselected, 0 selected) -- so BOTH halves are genuinely red today.
      After: the grep matches at least twice (the import and the drain() call site -- a single
      occurrence would mean the name is imported but unused, or present only in a comment), the
      -k retired selector selects at least one passing test, and rec-2895's replacement acceptance
      (the last two conjuncts, which are its exact new string) passes. NOTE (deliberate): no
      backticks in this field -- see step 3's note; validate_vp_replay would require any backticked
      literal to appear in pytest -q output, which never prints node ids or argv. AMENDED post-PR
      (pr-validate red on ba3570a): the pytest target is scoped to
      tests/ops_writer/test_drain.py, not the whole tests/ops_writer/ directory. Measured on the
      real GitHub-hosted pr-validate fast-tier runner: collecting the whole directory pulls in
      tests/ops_writer/test_compact.py, test_compact_paths.py (unconditional import pandas) and
      test_outbox_emit.py, test_write.py (unconditional import boto3) -- both deliberately absent
      from requirements-fast.txt -- so collection hard-fails with ModuleNotFoundError before -k
      can deselect anything. This session's sandbox has the full dependency set installed, so the
      failure was invisible there; only the actual fast-tier CI runner surfaced it.
      tests/ops_writer/test_drain.py and its tests/fixtures/ops_writer_helpers.py dependency import
      neither package, so scoping to it collects cleanly in the fast tier.
    fix_if: >-
      Zero grep matches means the guard was written with a differently-named helper -- do NOT add a
      comment naming is_retired_dir to satisfy the grep (that is acceptance-theatre); call
      is_retired_dir directly. Pytest exit 5 means no new test node id contains `retired` -- rename
      one (e.g. test_drain_skips_retired_migrated_table_outbox) rather than weakening this step. A
      ModuleNotFoundError during collection (boto3/pandas) means the pytest target widened back to
      a directory that includes heavy-dep test files -- re-narrow to test_drain.py rather than
      widening requirements-fast.txt (that would slow every fast-tier run to fix one VP step).
      NOTE: tests/CLAUDE.md bans `pytest -k` selectors in recommendation acceptance commands
      ("LLM-generated test names are unpredictable and rename between runs"), so rec-2929's stored
      command violates repo convention. Satisfying it by naming is cheap and is the chosen route; if
      it proves genuinely unsatisfiable, update the acceptance string via `bin/venv-python -m
      scripts.ops_data_portal --update-rec rec-2929` and record the change in the resolution -- never
      silently drop the pytest half from this step. rec-2929's stored acceptance was updated to the
      same test_drain.py-scoped form for the same fast-tier-collectability reason.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-writer-drain-guard-load-bearing
  - step: 5
    phase: pre-deploy
    action: >-
      scripts/ops_writer.py stays within its SLOC budget without a new raise marker, and no budget
      entry was raised anywhere.
    command: >-
      bin/venv-python -c "import pathlib; n=len([l for l in
      pathlib.Path('scripts/ops_writer.py').read_text().splitlines() if l.strip() and not
      l.strip().startswith('#')]); print(n); assert n <= 571, f'{n} SLOC exceeds budget 571'" &&
      ! git diff origin/main -- config/sloc_budgets.yaml | grep -q '^+.*raise-approved'
    expected: >-
      Prints a number <= 571 and exits 0, with no ADDED 'raise-approved' marker in the budget diff.
      Expected landing value is 570.
    fix_if: >-
      Over 571 means the guard was written as an if/continue block. Use a generator filter on the
      existing loop line instead. Do NOT raise the budget: Decision 128's decompose-by-default applies
      and no existing Decision authorizes a raise here (Decision 165), so a marker would be
      unauthorized and validate_sloc_budget_raises would fail the PR. The `^+` anchor is deliberate:
      an unanchored grep also matches REMOVED marker lines, and config/sloc_budgets.yaml already
      carries a legitimate dec-159 marker on tests/test_checks_registry.py that a downward ratchet may
      drop -- that is permitted and must not false-fail this step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Not graduatable: the assertion is that ops_writer.py sits at or under an UNCHANGED 571 budget,
      which is already true on origin/main (measured: 569 SLOC there, and the sloc_budgets.yaml diff
      is empty in an origin/main worktree, so the raise-marker conjunct holds too). VF-06's
      differential admission gate requires a candidate check to FAIL on origin/main and pass on HEAD;
      an at-or-under-budget invariant on an unchanged ceiling passes identically on both trees, so
      validate_verification_registry would reject any row for it as tautological. No honest check_spec
      exists. The ceiling is already enforced independently by validate_sloc_limits, and the
      no-unauthorized-raise half by validate_sloc_budget_raises (Decision 128/165), so graduating
      would add zero coverage.
  - step: 6
    phase: pre-deploy
    action: >-
      The sole home is registered in BOTH halves of the rec-2686 convention-synced pair, so a future
      edit to it triggers the governed deploy and is visible to the drift sensor.
    command: >-
      bin/venv-python -c "from scripts.convergence_health import PROD_SOURCE_PATHSPECS; import
      pathlib; wf = pathlib.Path('.github/workflows/deploy-prod-lambdas.yml').read_text(); p =
      'src/common/outbox_retirement.py'; assert p in PROD_SOURCE_PATHSPECS, PROD_SOURCE_PATHSPECS;
      assert p in wf, 'workflow on.push.paths missing the entry'; print('OK')"
    expected: "Prints OK and exits 0."
    fix_if: >-
      Failing on PROD_SOURCE_PATHSPECS means only the workflow was edited; failing on the workflow
      means only the tuple was. There is no automated check keeping these in sync, so a one-sided edit
      is silently wrong -- both must land in this PR.
    hermetic: true
    graduation: graduate
    graduation_check_id: outbox-retirement-prod-pathspec-synced
  - step: 7
    phase: pre-deploy
    action: >-
      Every touched source file still meets its coverage obligation, and the test-path mapper agrees
      with where the new test was written.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import
      map_source_to_test; r = map_source_to_test(Path('src/common/outbox_retirement.py')); assert
      r is not None and r.name == 'test_outbox_retirement.py' and r.parent.name == 'tests', r;
      print('OK')" && bin/venv-python -m pytest tests/ops_writer tests/sync/ops
      tests/test_outbox_retirement.py tests/checks/ops_governance/test_validate_outbox_staleness.py
      tests/convergence_health/test_code_drift.py -q --cov=scripts.ops_writer --cov=scripts.sync.ops
      --cov=src.common.outbox_retirement --cov=scripts.convergence_health.code_drift
      --cov=scripts.checks.ops_governance.validate_outbox_staleness --cov-report=term-missing
    expected: >-
      Mapper prints OK. ops_writer.py, sync/ops.py, outbox_retirement.py and code_drift.py all report
      100% (none has a coverage_baseline.yaml entry); validate_outbox_staleness.py reports >= 95.8
      (its baseline entry). Deliberately hermetic:false unlike steps 3 and 4: this is a five-target
      coverage run, too slow for the fast-tier budget that validate_vp_replay executes under.
    fix_if: >-
      A mapper mismatch means the test file is in the wrong place and check_test_file_exists will fail
      -- move it rather than registering a new roster entry. A coverage drop on ops_writer.py or
      sync/ops.py is a regression: both measure 100% before this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Composite of a mapper assertion and a five-target coverage run with per-file thresholds that
      differ (100% vs the 95.8 baseline); it is not expressible as a single canonical primitive slot,
      and the coverage gate itself is already enforced independently by validate.py.
  - step: 8
    phase: pre-deploy
    action: >-
      Full-tier presubmit passes end to end before any commit or PR (Decision 163 -- the fast tier
      alone does not satisfy this plan's handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0."
    fix_if: >-
      Forward-fix on the branch; never auto-revert. If the run times out, treat the handoff as blocked
      per handoff_policy.timeout_disposition and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The command IS expressible as the command_exit_zero slot, so not-applicable would be
      misclassification. Graduating it is nonetheless circular: it would register the full validator
      as a check inside the very registry that validator consumes and executes. The obligation is
      already structurally enforced by validate_handoff_full_tier (Decision 163), which fails any plan
      declaring handoff_policy.full_validation_required_before_commit whose VP runs only the fast
      tier -- so a registry row would add a recursion hazard and no coverage.
  - step: 9
    phase: pre-deploy
    action: >-
      PRE-MERGE proof that both Lambda zips actually stage the new sole home. (Staging only -- the
      command asserts presence in the staged tree, NOT that an import resolves there; src/__init__.py
      and src/common/__init__.py both stage, so the import follows, but this step does not prove it.)
      This is the plan's highest-consequence check: the
      guard adds a module-scope import to a file bundled into two active artifacts, so an unstaged or
      unimportable leaf would ImportError at Lambda cold start -- worse than the bug being fixed.
      Deliberately pre-deploy (not post-deploy) so the failure is caught before merge.
    command: >-
      bin/venv-python -c "import tempfile,pathlib;from scripts.lambda_manifest import
      load,stage_bundle;f=lambda s:(lambda
      d:(stage_bundle(load(pathlib.Path('src/lambdas')/s/'manifest.yaml'),d,skip_pip=True),(d/'src'/'common'/'outbox_retirement.py').exists())[1])(pathlib.Path(tempfile.mkdtemp()));r={s:f(s)
      for s in ('data-pipeline','ops-compaction')};print(r);assert all(r.values()),r"
    expected: >-
      Prints {'data-pipeline': True, 'ops-compaction': True} and exits 0. Both manifests pick the
      module up via their src/ wildcard include; neither ducklake-only excludes list may catch it.
      MEASURED both directions before writing this step: it exits 1 today with both False (the module
      does not exist yet -- genuine red), and exits 0 with both True when pointed at an existing
      src/common file, proving the staging mechanism resolves src/common/* correctly. The trailing
      assert is load-bearing: an earlier draft only printed the booleans and would have exited 0 even
      when the module was absent.
    fix_if: >-
      A False means an excludes entry over-matches or the module was placed outside src/ -- fix the
      placement, do not weaken the check. If this exact invocation does not run, the real API surface
      is scripts.lambda_manifest.load(manifest_path) / stage_bundle(manifest, stage_dir,
      skip_pip=True) / cmd_check_bundles (verified -- there is NO load_manifest, NO staged_paths, and
      NO build_lambda --list-contents); rewrite against those names rather than skipping the step.
      Keep skip_pip=True so no network fetch is needed and the step stays hermetic.
    hermetic: true
    graduation: graduate
    graduation_check_id: outbox-retirement-staged-into-both-prod-zips
  - step: 10
    phase: post-deploy
    action: >-
      The governed code-deploy channel actually ran for the merge commit and deployed BOTH affected
      active artifacts (Decision 125/126: this channel is the default; build_lambda --deploy is
      break-glass and must NOT be run here).
    command: >-
      gh run list --workflow deploy-prod-lambdas.yml --limit 3 --json conclusion,headSha,displayTitle
    expected: >-
      The most recent deploy-prod-lambdas run whose headSha is this PR's merge commit has
      conclusion=success, with its per-function smoke gate green for
      agent-platform-scheduled-agent-dispatcher, agent-platform-findings-processor and
      agent-platform-ops-compaction.
    fix_if: >-
      OPERATOR-READ STEP, and it is designed to FAIL rather than report a false green. gh is NOT on
      PATH in CC-web, so this command exits non-zero there; that is deliberate -- the earlier draft
      appended a `|| echo ...` fallback which made the step always exit 0 and therefore incapable of
      failing. When gh is absent, satisfy this step by reading the run via
      mcp__github__actions_list(workflow='deploy-prod-lambdas.yml') and recording the conclusion and
      headSha in the implement report; the authoritative machine verdict is the workflow's own
      per-function smoke gate, not this command. No run triggered at all means the push touched no
      path in the on.push.paths filter -- re-check step 6. A red smoke gate is a real deploy failure:
      diagnose and forward-fix; do NOT fall back to local build_lambda --deploy, which is
      break-glass-only and needs explicit human direction.
