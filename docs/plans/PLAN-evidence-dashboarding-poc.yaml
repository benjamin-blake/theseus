  - >-
    Verified evidence gathered this session (npm registry, POINT-IN-TIME 2026-07-26 -- the report
    and T2.53 c8 both require re-verification at reactivation): @evidence-dev/evidence publish
    counts 406 (2023) / 179 (2024) / 13 (2025) / 1 (2026), last publish 2026-02-06 shared with
