    unratified, T2.51-gated CD.41) -- re-scoped to a separate credentialed CD.41-gated sub-task whose
    failure is a class-level reject; P0's artifact guard was circular (declared a precondition in
    prose, registered as an exit criterion of the deferred item whose branch it gates) -- resolved by
    recording it as independently landable plus an absolute interim rule of no `npm install` in the
