constraints:
- No rescue agents or workaround loops (Decision 55) -- a mutant that cannot be killed within this scope becomes a recommendation via file_rec, never an inline check-module edit.
- Never weaken a check, an assertion, or an existing test to obtain green (Decision 181 point 1 -- the standing prohibition; canonical clause at docs/contracts/implement-scope-boundary.yaml invariants.content). All 46 existing tests in the five modified files are KEPT, not replaced or rewritten.
- 'TESTS ONLY: the five scope files are the entire diff. No check module, no Entry/Check dataclass, no docs/contracts/check-manifest.yaml, no repo-wide meta-gate, no config change, no SLOC budget change (Decision 59 LOCATION invariant).'
- '`git diff --stat -- scripts/checks/` must be empty before every commit (step 27 is the assertion form).'
- Mutants are NEVER applied to the working tree -- only to a scratch clone under the session scratchpad (never /tmp proper, never the repo), built with git clone --shared plus a symlinked .venv, and located by AST site id, never by a bare line number (deterministic, reviewable edits in the spirit of Decision 128).
- 'Every mutant run sets PYTHONDONTWRITEBYTECODE=1 and every clone is single-use: an operator-flip mutant is byte-identical in SIZE to the original, so a __pycache__ .pyc written during the mutated run survives a same-second revert and silently keeps serving the mutant (observed and root-caused 2026-09-03). Without this the three flip-compare verdicts are not trustworthy.'
- No SLOC budget raise and no raise-approved / baseline-lowered / waiver marker anywhere (Decision 128, Decision 165); if a mirror would exceed 500 SLOC, decompose it into a mirror package, never append to one of the 16 tests/checks files already over 400 SLOC.
- Do NOT add examined()/skipped() declarations to any of the five checks (Decision 170) -- all five sit on config/check_accounting_baseline.yaml today and adding one is a check-module edit, i.e. out of scope; that file must also stay byte-unchanged, since the touch-it-fix-it arm only fires on a check-module edit this plan never makes. Because the mirrors must therefore discriminate an enforced pass from a vacuous one through the pre-170 stdout channel, every PASS-line assertion pins the SHORTEST stable marker prefix and never a variable parenthetical, so the ratchet's forward direction stays cheap for these five checks.
- No test may import another test_* module (Decision 131) -- the new deploy-channel class carries its own static _write/_run helpers rather than reaching into the existing class, and no shared helper is promoted to tests/fixtures/ for this diff.
- Always invoke Python as bin/venv-python (AGENTS.md `## Shell invocations`); commands must be Linux/bash-compatible.
- 'Decision 148 point 3 (hermetic-default restored): VP steps 6-20 are pre-deploy feature-verification steps that pass exactly on the implementation-bearing tree, so all 15 carry hermetic: true and are independently re-executed by validate_vp_replay''s implement-PR leg; together with the three assertion steps 27-29 that is 18 replayed steps, inside validate_vp_replay.MAX_REPLAYED_STEPS (20) and far inside MAX_AGGREGATE_SECONDS (120) at a measured ~0.95s per bin/venv-python pytest node invocation (~16s total, measured 2026-09-03 in a scratch clone). Steps 1-5 (RED baselines) and 21-25 (mutant kills) stay hermetic: false because their assertion INVERTS on the implementation-bearing tree and they need a mutated clone; steps 30-31 stay false because replaying a step that runs scripts.validate re-enters the tier that runs the registry. None of steps 6-20 carries a backticked literal in expected, so replay asserts exit 0 only -- verified against _extract_literals.'
- 'Decision 132 (graduation is an enforced pre-merge obligation): every one of the 31 pre-deploy VP steps carries a graduation disposition -- 13 graduate, 8 waive, 10 not-applicable -- which is what validate_graduation_completeness''s plan-PR leg checks (field presence only, no kernel-expressibility inference). The 10 not-applicable rows are all multi-command bash pipelines that clone, mutate, run and revert; no bare one-liner is marked not-applicable, so plan-critique 12o''s suspect-not-applicable sub-check has nothing to catch.'
- 'Decision 181 point 1 (no assertion is ever weakened to obtain green) is the authority for the positive-assertion rule here: every new assertion is exact list equality on failed, a startswith/in claim on a discriminating message, or the presence of a stdout marker -- never a truthiness or absence-only claim. Point 3 is cited only for its residual-arm framing (an assertion weakened inside an in-scope source or test file is the DOMINANT form of weakening, and its continued existence is a reversal condition), which is why the two green-side PASS-line assertions (steps 8 and 20) are each paired with a red-side counter-example at the same site (steps 9 and 17). Point 3 does not itself prescribe paired counter-examples; the pairing is this plan''s own discipline against a vacuous green.'
