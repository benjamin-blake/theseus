  expected: mutate2.py prints CHANGED then MUTATED (it compares compiled bytecode and refuses to write an inert mutant), pytest reports 3 passed, and the step prints SURVIVED for the one site. Reproduced at planning time on 67ca10f.
  fix_if: A pytest red here means the hole is already closed -- STOP and re-derive rather than writing a test for a survivor that no longer exists. Note the sibling site neuter-append:1 (line 80) is deliberately NOT in this list -- the sweep ledger records it as a survivor but a clean re-run on 2026-09-03 shows the existing test_fails_when_acceptance_contains_python_c already KILLS it; do not add a test for it.
  hermetic: false
  graduation: not-applicable
- step: '2'
  phase: pre-deploy
  action: RED baseline (validate_pydantic_yaml_drift) -- all five wrapper sites survive because every existing test calls the private helper instead of the registered wrapper.
  command: MUT=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/mutate2.py; C=/tmp/claude-0/-home-user-theseus/33ab98e3-d806-55b3-a8cc-2d06b953b1db/scratchpad/task3/red-pydantic; MOD=scripts/checks/ops_governance/validate_pydantic_yaml_drift.py; MIR=tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py; rm -rf "$C"; git clone --shared --quiet "$PWD" "$C" && ln -s "$PWD/.venv" "$C/.venv" && git -C "$C" checkout --quiet origin/main -- tests/checks/ops_governance/ && for S in validate_pydantic_yaml_drift:neuter-append:0 validate_pydantic_yaml_drift:flip-compare:0 validate_pydantic_yaml_drift:neuter-append:1 validate_pydantic_yaml_drift:neuter-append:2 validate_pydantic_yaml_drift:neuter-append:3; do bin/venv-python "$MUT" --clone "$C" --file "$MOD" --apply "$S" && (cd "$C" && PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$C" ./.venv/bin/python -m pytest "$MIR" -q -p no:cacheprovider --randomly-seed=12345) && echo "SURVIVED $S"; bin/venv-python "$MUT" --clone "$C" --file "$MOD" --revert; done
  expected: Five CHANGED/MUTATED cycles, pytest reports 12 passed each time, and the step prints SURVIVED five times. Reproduced at planning time.
  fix_if: 'PYTHONDONTWRITEBYTECODE=1 is load-bearing for the flip-compare site and must not be dropped: an operator-flip mutant has the SAME byte size as the original, so a __pycache__ .pyc written during the mutated run and reverted within the same clock second stays valid and silently keeps serving the mutant afterwards (observed 2026-09-03). If a later site reports an impossible verdict, clear __pycache__ under the clone and re-run.'
  hermetic: false
  graduation: not-applicable
