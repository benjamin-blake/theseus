  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py::TestPydanticYamlDriftWrapper::test_clean_ops_yaml_prints_the_pass_line -q
  expected: '1 passed -- for an ops.yaml declaring both tables with empty columns, failed == [] and "PASS: pydantic-yaml drift check" appears on stdout.'
  fix_if: If the PASS marker is missing on a clean run, suspect a stale __pycache__ mutant rather than the test (see step 2's fix_if); if failed is non-empty the fixture columns are not empty and a real field-level drift fired.
  hermetic: true
  graduation: graduate
  graduation_check_id: pydantic-yaml-drift-pass-line-only-when-clean
- step: '9'
  phase: pre-deploy
  action: Anti-vacuity companion -- a genuinely drifting ops.yaml reaches the field-level append through the wrapper, so step 8's clean-side assertion is not satisfied by a check that never detects anything.
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py::TestPydanticYamlDriftWrapper::test_drifting_ops_yaml_appends_the_field_level_failure -q
  expected: '1 passed -- failed == ["Pydantic-YAML drift: RecPayload.title"] exactly, since RecPayload.title carries DqNotNull while the fixture column declares only accepted_values.'
  fix_if: If the failure names a different field, RecPayload's annotations moved -- pick any field whose Dq marker set is non-empty and mismatch it deliberately; never relax the assertion to a substring match on "drift".
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Anti-vacuity companion to the graduated PASS-line row at the SAME site (step 8, validate_pydantic_yaml_drift.py:115). Decision 176 re-grained the registry to one record per file at config/agent/verification_registry/entries/<check_id>.yaml with filename-equals-check_id enforced structurally, so two rows for one gate must either collide on that one shard filename or invent a second identity for a single site. The differential admits a row for the discrimination the gate makes, not for the counter-example that keeps it non-vacuous.
- step: '10'
  phase: pre-deploy
  action: Pydantic-YAML drift wrapper appends from its ImportError arm (mutant-killing red path).
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py::TestPydanticYamlDriftWrapper::test_unimportable_schemas_appends_a_failure -q
  expected: 1 passed -- failed == ["Pydantic-YAML drift"] and "Could not import src.schemas" on stdout, which is what tells this site apart from the three other sites appending the identical string.
  fix_if: Assert the stdout marker, not just failed -- without it this test is indistinguishable from steps 7, 11 and 12 and a neutered ImportError append would be masked by whichever sibling site the fixture happens to reach.
  hermetic: true
  graduation: graduate
  graduation_check_id: pydantic-yaml-drift-appends-on-schemas-import-failure
- step: '11'
  phase: pre-deploy
  action: Pydantic-YAML drift wrapper appends from its YAMLError arm (mutant-killing red path).
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py::TestPydanticYamlDriftWrapper::test_unparseable_ops_yaml_appends_a_failure -q
  expected: 1 passed -- failed == ["Pydantic-YAML drift"] and "YAML parse error" on stdout for an ops.yaml whose value opens an unterminated flow sequence.
  fix_if: If the catch-all arm fires instead (stdout says "Unexpected error"), the fixture raised something other than yaml.YAMLError -- an unterminated flow sequence is the shape that raises it from safe_load.
  hermetic: true
  graduation: graduate
  graduation_check_id: pydantic-yaml-drift-appends-on-yaml-parse-error
- step: '12'
  phase: pre-deploy
  action: Pydantic-YAML drift wrapper appends from its catch-all Exception arm (mutant-killing red path).
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py::TestPydanticYamlDriftWrapper::test_unexpected_error_appends_a_failure -q
  expected: 1 passed -- an ops.yaml that parses to a LIST makes ops.get() raise AttributeError, which is neither ImportError nor YAMLError; failed == ["Pydantic-YAML drift"] and "Unexpected error" on stdout.
