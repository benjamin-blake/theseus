- step: '17'
  phase: pre-deploy
  action: A resource block must not bleed into the next resource -- a COUPLED resource preceding a decoupled one is still a partial rollout (mutant-killing red path for the opening-brace comparison).
  command: bin/venv-python -m pytest "tests/checks/ops_governance/test_validate_deploy_channel_conformance.py::TestDeployChannelBlockExtraction::test_coupled_first_partial_rollout_is_still_reported" -q
  expected: 1 passed -- exactly one failure carrying "1/2 ducklake" and "partial rollout". Under the flipped comparison every non-brace character increments the depth, so no block ever closes and the leading coupled resource absorbs the trailing resource's ignore_changes, reporting 2/2 decoupled and no failure at all.
