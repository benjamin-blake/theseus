slug: check-mirror-2a-ops-governance
intent: 'Close the thirteen measured behavioural holes the Task 3 mutation sweep found in the five ops_governance check mirrors: every one of them is a registered-wrapper emission site or a parser/print branch that no existing test reaches, so a neutered failed.append() or a flipped comparison at that site passes the whole mirror today as a silent green. Tests only -- no check module is touched.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-check-mirror-2a-ops-governance.yaml
phase: Check-mirror behavioural coverage, ops_governance domain (defect surface of the Decision 169 mirror roster; measured by the Task 3 mutation sweep). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 3 slice 2; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: tests/checks/ops_governance/test_validate_recommendations_schema.py
  action: Modify
  purpose: '66 SLOC after the change (50 today). The three existing tests reach only the errors-branch append at validate_recommendations_schema.py:80 (which they already kill); the lazy-import guard at :38 is reached by no test, so neutering it SURVIVES (re-verified in a scratch clone 2026-09-03). Add class TestRecommendationsSchemaImportFailure with one method that writes an empty logs/.recommendations-log.jsonl under a patched scripts.checks._common.ROOT, forces the ImportError with patch.dict(sys.modules, {"scripts.executor.jsonl_store": None}), and asserts EXACT list equality failed == ["Recommendations schema validation"] plus the "Could not import Recommendation model" stdout marker that tells this site apart from the :80 site (both append the identical string). The three existing tests are kept unchanged.'
- file: tests/checks/ops_governance/test_validate_pydantic_yaml_drift.py
  action: Modify
  purpose: 151 SLOC after the change (98 today). All twelve existing tests call the private helper _check_drift_for_table directly, so the REGISTERED wrapper validate_pydantic_yaml_drift is executed by no test at all and all five of its sites survive (:97 missing-ops.yaml append, :115 PASS-line gate, :119 ImportError append, :122 YAMLError append, :125 catch-all append). Add module-level _CLEAN_OPS_YAML / _DRIFTING_OPS_YAML fixtures, a _write_ops_yaml(root, body) helper and a _run_wrapper(root) helper patching scripts.checks._common.ROOT, then class TestPydanticYamlDriftWrapper with the six methods VP steps 7-12 select. Twelve existing tests kept unchanged.
- file: tests/checks/ops_governance/test_validate_rec_relevance_contract.py
  action: Modify
  purpose: '79 SLOC after the change (54 today). Six existing tests cover the not-found / parse-error / columns / drift / empty-verdicts arms but never a contract that parses to a NON-MAPPING (:39) and never an unimportable evaluator (:60), so both survive. Add class TestRecRelevanceContractResidualBranches with static _write_contract/_run helpers and the two methods VP steps 13-14 select: a list-valued contract asserting failed == ["rec-relevance contract: not a YAML mapping"], and a valid single-verdict contract under patch.dict(sys.modules, {"scripts.rec_relevance": None}) asserting the single failure startswith "rec-relevance contract: cannot import scripts.rec_relevance: ". Six existing tests kept unchanged.'
- file: tests/checks/ops_governance/test_validate_field_semantics_drift.py
  action: Modify
  purpose: '79 SLOC after the change (55 today). The three existing tests all drive the happy/drift path with a readable _OUTPUT_PATH and a working generator, so the two error-path appends (:32 cannot-read, :38 generator-raised) are unreached and survive. Add class TestFieldSemanticsDriftErrorBranches with the two methods VP steps 15-16 select: _OUTPUT_PATH patched to a path under a non-existent directory (OSError arm, asserting the "cannot read" prefix plus "No such file or directory"), and scripts.schema_to_field_semantics.generate patched with side_effect=RuntimeError("synthetic boom") over a readable output file, asserting failed == ["Field semantics drift gate: generator raised: synthetic boom"]. Three existing tests kept unchanged.'
- file: tests/checks/ops_governance/test_validate_deploy_channel_conformance.py
  action: Modify
  purpose: 395 SLOC after the change (327 today -- under the 400 line this plan will not append past, and far under 500; no budget entry exists or is added). Twenty-two existing tests never distinguish the brace-depth extractor from two behaviour-equivalent-on-their-fixtures flips (:47 text[i] == "{" and :51 depth == 0, both of which only change which characters end a block), and never assert the wrapper PASS line (:254). Add module-level _TF_MIXED_COUPLED_FIRST and _TF_NESTED_BLOCK_DECOUPLED fixtures plus class TestDeployChannelBlockExtraction (its own static _write/_run helpers -- no reuse of the other class's instance methods) with the four methods VP steps 17-20 select. Import _extract_function_blocks alongside the existing private-helper imports, in ruff import order. Twenty-two existing tests kept unchanged.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
- All thirteen measured survivor sites flip from SURVIVED to KILLED, verified by re-applying each mutant with the Task 3 mutator in a scratch clone that carries the new tests -- validate_recommendations_schema neuter-append:0; validate_pydantic_yaml_drift neuter-append:0/1/2/3 and flip-compare:0; validate_rec_relevance_contract neuter-append:2 and neuter-append:5; validate_field_semantics_drift neuter-append:0 and neuter-append:1; _extract_function_blocks flip-compare:1 and flip-compare:3; validate_deploy_channel_conformance flip-compare:2.
- Every new red-path test drives the REGISTERED wrapper fn(failed) (or, for the two extractor flips, the extractor whose output the wrapper consumes) and asserts either exact list equality on failed or a positive presence claim on a discriminating message/stdout marker -- never a truthiness check and never an absence-only claim.
- '`git diff --stat origin/main...HEAD -- scripts/checks/` is empty (no check module, manifest Entry or helper is touched), and config/sloc_budgets.yaml, config/coverage_baseline.yaml and config/check_accounting_baseline.yaml are unchanged; the landed diff is the five test files, the plan file''s own bookkeeping, and the sanctioned config/agent/verification_registry/entries/<graduation_check_id>.yaml shards (implement-scope-boundary.yaml graduated_registry_shard).'
- All five test files stay <= 500 SLOC (largest projected 395), are ruff-check and ruff-format clean, and no raise-approved / baseline-lowered / waiver marker is added anywhere.
- No examined()/skipped() declaration is added to any of the five check modules (Decision 170) -- all five sit on config/check_accounting_baseline.yaml today and the touch-it-fix-it arm of validate_check_accounting is not triggered, because this diff edits no check module.
