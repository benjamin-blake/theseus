schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: test-weakening-surfacing
intent: >-
  Narrow the scope-boundary CONTENT invariant's sole residual (rec-3357: an assertion or numeric tolerance weakened in
  an in-scope file) honestly instead of claiming it closed: an added skip/xfail must cite a rec or declare itself an
  environment guard (mechanical, exceptionless), every other syntactic weakening candidate is surfaced to the
  independent code-review gate, an implement PR must record that review's disposition for every candidate
  (mechanical, exceptionless), and the part no check can decide (whether a disposition is right: the test-oracle
  problem) stays a residual, narrowed and re-owned by rec-4413.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-test-weakening-surfacing.yaml
phase: >-
  ad_hoc_rec (soft-warn category): rec-3357, the Decision 181 point 2 residual owner. No tier_item is claimed and no
  exit criterion is closed.
scope:
- file: scripts/checks/hygiene/validate_test_skip_citations.py
  action: Create
  purpose: >-
    Registered check validate_test_skip_citations, diff-based against _common.push_context_base(root) or origin/main
    (Decision 159: no second base resolver). A SKIP SITE in a tests/**/*.py file is a skip, skipif or xfail mark in
    any position (decorator, module- or class-level pytestmark, pytest.param(..., marks=...)); a unittest skip,
    skipIf, skipUnless or expectedFailure decorator; or a pytest.skip, pytest.xfail or pytest.importorskip call
    anywhere in the file. Its REASON is the reason= keyword, else the first positional string (the second positional
    for skipif/xfail/skipIf/skipUnless conditions), plus msg= for calls; an f-string contributes its constant parts.
    For every added or modified tests/**/*.py file in the diff, the head file's sites minus the base file's sites
    (multiset keyed by enclosing test key, site kind and reason) are the ADDED sites; each must carry a token matching
    \brec-\d+\b anywhere in its reason, or a reason starting with "env: " (an environment guard). No waiver, marker or
    grandfather (Decision 163 point 1); sites already on the base ref are never re-judged. One failure per violation
    naming path:line, the site kind and the fix (cite a rec filed through the ops portal, or label a real environment
    guard "env: <condition>"). An unparseable head file is a reported failure, never a raise; an unreachable base is
    registry.skipped("diff base unreachable"); otherwise registry.examined(<test files read>, unit="test_files").
    main(argv) accepts --base REF and --head REF (head omitted = working tree) and exits 1 on any failure, else 0.
- file: scripts/checks/hygiene/_manifest.py
  action: Modify
  purpose: >-
    One Entry for validate_test_skip_citations: pre=True, pre_globs=("tests/**",
    "scripts/checks/hygiene/validate_test_skip_citations.py", "scripts/checks/_common.py",
    "scripts/checks/registry.py") widened only where validate_pre_glob_closure names a missing import,
    full_segment="full_after_lint" (the validate_test_count_coupling shape).
- file: tests/checks/hygiene/test_validate_test_skip_citations.py
  action: Create
  purpose: >-
    Mirror test driving the check through injected base/head sources (fixtures are string literals, never real skip
    decorators or calls, so this file adds no skip site of its own). Class TestAddedSkipsMustCiteOrDeclare: each site
    kind added without a rec token or env: label fails naming path:line; with either it passes. Class
    TestOnlyAddedSitesAreJudged: a site already on the base passes unchanged; a changed reason is judged as added; a
    removed site passes. Plus: an unparseable head file fails, an unreachable base skips, examined() counts files read,
    and main() exits 1 on a violation and 0 when clean.
- file: scripts/checks/verification/_weakening_ast.py
  action: Create
  purpose: >-
    Pure AST helpers, no I/O, never raising on bad input (unparseable source -> empty result). test_functions(source)
    -> {key: node} for module-level test* functions and test* methods of top-level Test* classes (key "func" or
    "Class::func"). assertions(node) -> Counter of normalized ast.dump for every assert statement's test and every call
    whose callee name starts with "assert" or is raises, warns, approx or isclose, with a display string (first source
    line) per element. skip_count(node, class_node) -> skip/skipif/xfail marks on the function and its class plus
    pytest.skip/pytest.xfail calls in its body. tolerances(node) -> numeric-literal values of the rel, abs, rel_tol,
    abs_tol, rtol, atol and delta keywords on approx, isclose, assertAlmostEqual, allclose and assert_allclose calls,
    keyed by (callee, keyword, occurrence). numeric_constants(source) -> module-level UPPER_CASE names bound to an int
    or float literal (unary minus allowed, bool excluded).
- file: scripts/checks/verification/validate_weakening_candidates.py
  action: Create
  purpose: >-
    REPORT-ONLY registered check validate_weakening_candidates (the validate_diff_coverage shape): it never appends to
    failed. find_candidates(changed, read_base, read_head) -> sorted list of Candidate(category, path, node, detail),
    pure over injected (status, path) pairs and readers. Categories: assertion-removed (a pre-existing test, same key
    in a modified test file, whose assertion count fell; detail names a lost assertion); assertion-changed (an
    assertion lost while the count held or rose; detail names the lost assertion); test-removed (a key present at base
    in a modified test file and absent at head whose bare name is added in no changed test file); test-moved-weaker
    (that bare name added elsewhere in the diff with fewer assertions); test-file-deleted (a deleted tests/**/*.py file;
    detail its test-function count); skip-added (skip_count rose on a pre-existing test); tolerance-widened (a
    tolerance keyword's absolute value rose); constant-changed (a module-level UPPER_CASE numeric constant whose value
    changed in a modified scripts/**/*.py or src/**/*.py file; detail old -> new). node is the test key, the constant
    name, or "*" for a deleted file; key(candidate) -> "[category] path::node", the disposition key. Details are cut
    to 160 characters.
    The registered function reads the diff through _common.get_status_aware_diff against
    _common.push_context_base(root) or origin/main, head from the working tree, over every changed file (not only
    implement-leg diffs: code review runs before implementation_declared flips); prints per item one
    "CANDIDATE [category] path::node -- detail" line followed by one stub line
    '  - {candidate: "[category] path::node", disposition: <label>, cite: "<reference>"}', then each of the contract's
    invariants.content.review_dispositions keys with its rule, read from the contract (no second copy); SKIPs via registry.skipped when origin/main is unreachable; declares
    registry.examined(<changed .py files read>, unit="changed_files"). main(argv) accepts --base REF and --head REF
    (head omitted = working tree), prints the same lines and always exits 0.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: >-
    Two Entries, validate_weakening_candidates and validate_weakening_dispositions: pre=True, pre_globs=None (ungated;
    each reads only the diff and its plans), full_segment="full_after_lint".
- file: tests/checks/verification/test__weakening_ast.py
  action: Create
  purpose: Mirror test, class TestWeakeningAst -- each helper's contract, including unparseable source, unary minus and bool exclusion.
- file: tests/checks/verification/test_validate_weakening_candidates.py
  action: Create
  purpose: >-
    Mirror test. Class TestCandidates drives find_candidates with in-memory base/head sources: one positive case per
    category, and negatives (an added test, a strengthened assertion, a reformatted but equal assertion, an unchanged
    constant, a test moved with equal assertions, a non-numeric constant) yield nothing. Class TestReportOnly: the
    registered function prints every candidate and the disposition keys and leaves failed empty. Plus the
    origin/main-unreachable skip, examined(), and main()'s exit 0.
- file: scripts/checks/verification/validate_weakening_dispositions.py
  action: Create
  purpose: >-
    BLOCKING registered check validate_weakening_dispositions (the validate_graduation_completeness implement-leg
    shape). base = _common.push_context_base(root) or origin/main; unreachable -> registry.skipped("diff base
    unreachable"). resolved = _common.resolve_declared_plans(changed, root, base); none -> one PASS no-op line and
    registry.examined(0, unit="declared_plans"). Otherwise the candidates are validate_weakening_candidates.find_candidates
    over the same diff, and the recorded dispositions are the union of the resolved plans' weakening_dispositions,
    read with raw yaml. One failure per item: a candidate key with no recorded entry (naming the key and the plan, and
    the fix: copy code review's filled-in stub into the plan's weakening_dispositions); a key recorded twice; a
    recorded key matching no current candidate (stale: re-run code review on the current diff); a disposition that is
    not a key of the contract's invariants.content.review_dispositions (read from the contract, no second copy); a
    disposition of weakening (restore the check, or route it to a recommendation via the ops portal; never inline); a
    cite that does not resolve (its referent must resolve; whether it justifies the label stays review's judgement,
    Decision 165's existence-versus-authorization distinction). Cite rules:
    refactor and growth-safe-pin need a "<file>.py::<name>[::<name>]" token whose file exists in the working tree and
    whose last name is a def or class in it; planned-change needs "acceptance_criteria[N]" or "test_obligations[N]"
    with N a valid 0-based index in a resolved plan; retirement needs a path deleted in the diff, or a
    "<file>.py::<name>" whose name is defined at the base and not in the working tree. No marker, waiver or
    grandfather. Then
    registry.examined(len(resolved), unit="declared_plans"). main() runs it against the working tree and exits 1 on
    any failure, else 0.
- file: tests/checks/verification/test_validate_weakening_dispositions.py
  action: Create
  purpose: >-
    Mirror test over an injected fixture repository built by fixtures inside this file (no new conftest.py; the
    validate_graduation_completeness fixtures are the model). Class TestDispositionsRequired: on a diff that flips
    implementation_declared, a candidate with no entry fails naming its key and plan; a duplicate, a stale, an unknown
    disposition and a weakening entry each fail; for each of the four non-weakening dispositions an unresolvable cite
    fails and a resolving cite passes; a complete, resolving record passes. Class TestImplementLegOnly: a diff with no flip is a no-op with examined(0) even when candidates exist; an
    unreachable base skips.
- file: scripts/roadmap/plan_document.py
  action: Modify
  purpose: >-
    New model WeakeningDisposition (extra="forbid"): candidate, a str matching ^\[[a-z-]+\] \S+::\S+$ (the key
    validate_weakening_candidates prints before " -- "); disposition, Literal["refactor", "planned-change",
    "retirement", "growth-safe-pin", "weakening"]; cite, a str with min_length 1. PlanDocument gains
    weakening_dispositions: list[WeakeningDisposition] defaulting to empty, valid on every schema_version with no
    version bump (the fallback_reevaluation and implementation_declared precedent).
- file: tests/roadmap/plan_document/test_optional_fields.py
  action: Modify
  purpose: >-
    New class TestWeakeningDispositions: a valid entry parses; an omitted field defaults to []; an unknown
    disposition, a malformed candidate key, an empty cite and an extra key are each rejected.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    Rows validate_test_skip_citations, validate_weakening_candidates and validate_weakening_dispositions, each
    code_regression (the validate_diff_coverage and validate_graduation_completeness class).
- file: docs/contracts/implement-scope-boundary.yaml
  action: Modify
  purpose: >-
    APPROVED_CONTRACT (execution_steps), verbatim: invariants.content gains
    review_dispositions before enforcement_coverage; the added-skip and recorded-disposition mechanical rows are
    inserted before the residual row; the residual row is replaced; sanction_rows.implementing_plan_bookkeeping's
    permitted_field_edits gains weakening_dispositions last; sanction_row_eligibility.ineligible's owner clause
    changes; one amendment_log entry is appended last. No other line changes.
- file: tests/test_scope_boundary_contract.py
  action: Modify
  purpose: >-
    Every existing assertion stays. New pins: the added-skip row is mechanical with enforced_by
    validate_test_skip_citations; the recorded-disposition row is mechanical with enforced_by
    validate_weakening_dispositions; the single residual row is owned by rec-4413 and its note keeps "DOMINANT" and
    names validate_weakening_candidates, validate_weakening_dispositions, the test-oracle problem and
    review_dispositions; review_dispositions has exactly the
    five keys refactor, planned-change, retirement, growth-safe-pin, weakening, and the four non-weakening values name
    their cite form; implementing_plan_bookkeeping's permitted_field_edits includes weakening_dispositions (the
    followon_recs pin's shape); the Literal on scripts.roadmap.plan_document.WeakeningDisposition.disposition equals
    the contract's review_dispositions keys (typing.get_args; Decision 169's derive-and-assert); ineligible cites
    rec-4413 and still rec-3357; exactly one amendment_log entry names test-weakening-surfacing. New
    TestProseSurfacesPointAtContract::test_code_review_skill_requires_weakening_dispositions: inside the skill's
    "### 3. Testing" section, the bullet beginning "- **Weakening candidates**" (through its continuation line) names
    scripts.checks.verification.validate_weakening_candidates, review_dispositions and "High" -- asserted on that
    bullet alone, since "High" already appears elsewhere in the section -- and the Output Format carries a
    "### Weakening Dispositions" section naming weakening_dispositions.
- file: .claude/skills/code-review/SKILL.md
  action: Modify
  purpose: >-
    APPROVED_SKILL (execution_steps), verbatim: the Weakening candidates
    bullet after the Test obligations bullet and the Weakening Dispositions output section after Test Completeness,
    funded inside the 12,609-byte prose budget by deleting the two stale recs-log mentions (Decision 215: no recs
    log), repointing the stale Mock Exhaustion bullet to tests/CLAUDE.md, deleting the Docker bullet (no Docker file
    exists in the repo) and merging a duplicated no-edit sentence. Ends at 12,601 bytes.
bundled_recommendations:
- rec-3357
followon_recs:
- rec-4413
infrastructure_dependencies: []
acceptance_criteria:
- >-
  A skip/xfail/importorskip site added in tests/** fails validate_test_skip_citations unless its reason cites a rec id
  or starts with "env: "; sites already on the base ref are not judged; the branch's own diff passes.
- >-
  validate_weakening_candidates lists every category on a constructed diff and on real history (8107c227
  assertion-changed, 2bb9846d constant-changed, f44647cb test-removed), lists nothing for a control commit (72fb926e),
  never fails a run, and reports a 25-file commit in under 5 seconds.
- The code-review skill requires a disposition per listed item, raises High for a weakening or a missing one, and returns the dispositions in a fixed line format, within its prose budget.
- >-
  On a diff that flips implementation_declared, validate_weakening_dispositions fails any candidate without exactly
  one recorded disposition in the resolved plans' weakening_dispositions, any stale, unknown or weakening entry, and
  any cite that does not resolve under its disposition's rule; other diffs are not gated; plan documents accept the
  field and reject malformed entries.
- >-
  The contract's CONTENT map carries the two new mechanical rows and exactly one residual row, owned by rec-4413, with the
  approved text; Decision 181's text is unchanged.
- rec-3357 is superseded with the approved resolution and rec-4413 is open.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Every added skip-site kind without a rec citation or env label fails; with either it passes.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_test_skip_citations.py::TestAddedSkipsMustCiteOrDeclare -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A kind passes uncited -> fix the site finder or reason reader, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: test-skip-citation-required
- step: 2
  phase: pre-deploy
  action: Only added sites are judged.
  command: bin/venv-python -m pytest tests/checks/hygiene/test_validate_test_skip_citations.py::TestOnlyAddedSitesAreJudged -q
  expected: Exit 0, every node passes.
  expected_literals: []
  fix_if: A base-ref site is flagged -> fix the head-minus-base multiset.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The negative half of step 1's class; the standing invariant worth a registry row is step 1, and this class runs in
    every --pre that touches tests/** or the module.
- step: 3
  phase: pre-deploy
  action: The branch's own diff carries no uncited added skip.
  command: bin/venv-python -m scripts.checks.hygiene.validate_test_skip_citations
  expected: Exit 0 with no failure line.
  expected_literals: []
  fix_if: A site in a new test file is flagged -> it is a real decorator or call, not a string fixture; rewrite the fixture.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Depends on this branch's diff; the registered check runs the same on every PR.
- step: 4
  phase: pre-deploy
  action: Each candidate category is found and the negatives yield nothing.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_candidates.py::TestCandidates -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A category is missed or a negative listed -> fix find_candidates or _weakening_ast.
  hermetic: true
  graduation: graduate
  graduation_check_id: weakening-candidates-discriminate
- step: 5
  phase: pre-deploy
  action: The AST helpers return the scoped facts and empty results on unparseable source.
  command: bin/venv-python -m pytest tests/checks/verification/test__weakening_ast.py::TestWeakeningAst -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A helper misreads a node -> fix _weakening_ast.py.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Helper-level contract under step 4's graduated discrimination row, which fails if any helper regresses in a way
    that changes a candidate.
- step: 6
  phase: pre-deploy
  action: The report never fails a run.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_candidates.py::TestReportOnly -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: failed is non-empty -> the check must only print.
  hermetic: true
  graduation: graduate
  graduation_check_id: weakening-candidates-report-only
- step: 7
  phase: pre-deploy
  action: Replay real history -- three known candidates and one clean control.
  command: >-
    bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base 8107c227^ --head 8107c227 &&
    bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base 2bb9846d^ --head 2bb9846d &&
    bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base f44647cb^ --head f44647cb &&
    bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base 72fb926e^ --head 72fb926e
  expected: >-
    Exit 0. Run 1 lists an assertion-changed item for TestDataLakeLifecycleGoverned::test_rule_status_is_enabled; run 2
    a constant-changed item for NON_TEST_BUDGET_SECONDS 240.0 -> 270.0; run 3 a test-removed item for
    test_blob_root_only_on_the_writer; run 4 lists no CANDIDATE line.
  fix_if: A known item is missing or the control lists one -> fix find_candidates; never change the commits.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: >-
    The report stays cheap on a large diff (Decision 208's non-test budget). find_candidates runs twice on an implement
    PR (the report and validate_weakening_dispositions), so one run gets half of a 5-second allowance.
  command: >-
    bash -c 's=$(date +%s%N); bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base
    2bb9846d^ --head 2bb9846d >/dev/null; e=$(date +%s%N); echo $(( (e-s)/1000000 ))ms; test $(( (e-s)/1000000 )) -lt 2500'
  expected: Exit 0; the printed time is under 2500ms for the 25-file commit.
  fix_if: Over 2500ms -> batch base reads through one git cat-file --batch (the validate_tier_demotion_markers pattern).
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: An implement-leg diff needs exactly one recorded, non-weakening disposition with a resolving cite per candidate.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_dispositions.py::TestDispositionsRequired -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A missing, duplicate, stale, unknown or weakening entry, or an unresolvable cite, passes -> fix the check, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: weakening-dispositions-recorded
- step: 10
  phase: pre-deploy
  action: Only diffs that flip implementation_declared are gated.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_weakening_dispositions.py::TestImplementLegOnly -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A non-implement diff fails -> fix the resolve_declared_plans gate.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The leg filter is _common.resolve_declared_plans, already graduated through validate_graduation_completeness and
    validate_scope_boundary; step 9's row is the new invariant.
- step: 11
  phase: pre-deploy
  action: Plan documents accept weakening_dispositions and reject malformed entries.
  command: bin/venv-python -m pytest tests/roadmap/plan_document/test_optional_fields.py::TestWeakeningDispositions -q
  expected: Exit 0, every node passes. Red before because the class does not exist.
  expected_literals: []
  fix_if: A malformed entry parses -> tighten WeakeningDisposition.
  hermetic: true
  graduation: graduate
  graduation_check_id: plan-document-weakening-dispositions-schema
- step: 12
  phase: pre-deploy
  action: Contract and skill pins.
  command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py -q
  expected: Exit 0, every node passes.
  expected_literals: []
  fix_if: A pin fails -> the contract or skill text differs from the approved text; restore the text, never the pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file re-run of a scope-modified test file (hermetic rule v); step 13 graduates the new pin.
- step: 13
  phase: pre-deploy
  action: The code-review skill carries the disposition bullet and output section.
  command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract::test_code_review_skill_requires_weakening_dispositions -q
  expected: Exit 0. Red before because the node does not exist.
  expected_literals: []
  fix_if: The bullet is missing or reworded -> land the approved text.
  hermetic: true
  graduation: graduate
  graduation_check_id: code-review-weakening-dispositions
- step: 14
  phase: pre-deploy
  action: Full validation before handoff (prose budget, manifests, pre_glob closure, accounting, coverage).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  expected_literals: []
  fix_if: Any failure -> fix on the branch and rerun from the start.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
- step: 15
  phase: post-deploy
  action: rec-3357 superseded and rec-4413 open.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;a=f('rec-3357') or {};b=f('rec-4413')
    or {};print(a.get('status'),b.get('status'));assert a.get('status')=='superseded' and b.get('status')=='open'"
  expected: Exit 0 and "superseded open" printed.
  fix_if: rec-3357 still open -> run APPROVED_REC_UPDATE; only the PR number and merge sha may vary.
  hermetic: false
