infrastructure_dependencies:
- >-
  terraform/personal (auto-apply at merge behind the guard): three Secrets Manager containers, one lifecycle rule, and
  in-budget inline-policy updates on the admin maintenance role and the planner role. No role, trust, function or destroy
  change; nothing routes to tf-gated-apply. The switch PR adds an in-budget env and inline-policy update on
  ducklake_maintenance_smoke.
- >-
  terraform/bootstrap (admin-only, Decision 126): pre-merge read-only plan at the PR head (VP 15-17, the
  pre_merge_live_plan rule), then a human-directed apply after merge, then the post-apply simulate. Expected plan: four
  in-place updates (aws_iam_policy.github_ci_apply_boundary, aws_iam_policy.github_ci_apply_reads,
  aws_iam_role_policy.platform_dev_runtime, aws_cloudtrail.platform_security), nothing created or destroyed.
- >-
  LAMBDA-DEPLOY (Decision 79/125/126): ducklake_runtime.py is in every DuckLake bundle, so PR 1's merge redeploys all six
  DuckLake functions through deploy-ducklake-lambdas and runs their smoke gates (VP 18). The new verbs are inert until
  the admin session invokes them. The switch PR changes no source, so it triggers no DuckLake deploy.
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), data-pipeline: compute_affected_artifacts flags it through
  docs/ROADMAP-PLATFORM.yaml, a manifest asset, in the switch PR. No build, deploy or smoke test is owed: its handlers
  never read the c1 flip, deploy-prod-lambdas.yml's path triggers do not include the file, and the artifact refreshes
  with its next governed deploy (the PLAN-telemetry-reader-verbs precedent).
- >-
  Admin sitting 1, after PR 1's deploy and apply legs are green, in deploy-paths.yaml production_catalog_provisioning's
  order: bootstrap apply and simulate; measurement BEFORE any create (Decision 88 cl.2); production catalog; the
  production writer and reader logins; ensure_catalog_indexes. Each step appends counts-only results to
  ADMIN-SESSION-RECORD.md.
- >-
  Admin sitting 2 with DuckLake deploys held by the coordinator from adoption until the switch has applied and the smoke
  writer is narrowed and proven: adopt smoke; maintainer login; merge the switch PR (Benjamin's word) and wait for its
  apply; clean owner re-run; narrow the smoke writer and run the telemetry gate at once; release; one dispatched deploy
  run. Scheduled smoke cadences in the window are safe: EventBridge passes only {action} to merge, gc and hot_merge,
  which run no DDL; only the deploy gates pass force_recreate_tables, and they are held.
acceptance_criteria:
- >-
  T2.36:c1 -- the production telemetry catalog ducklake_telemetry exists with the four event tables and the two
  dimension pairs created per the Class A contracts (calendar-day partition on session_started_at, declared NOT NULL
  set) and ops_entity_counters seeded; every relation is owned by ducklake_telemetry_owner and the report says so by name
  (schema_owner ducklake_telemetry_owner, schema_owner_is_current_user false for the shared owner login, foreign_owned
  0); the catalog stats index is valid on it (StatsIndexValid 1 for MetaSchema ducklake_telemetry).
- >-
  rec-4297 -- the four logins are provisioned from the closed table and each probe equals its expected scope; neither
  writer login can drop a DuckLake table or delete catalog history; the reader attaches read-only and cannot write
  (real Postgres 16 proof before merge, live probes after); the narrowed smoke writer serves every writer verb live.
- >-
  ducklake_smoke is owned by ducklake_smoke_owner; ducklake_maintenance_smoke connects as ducklake_smoke_maintainer and
  holds no grant on the shared owner secret; the owner re-run after the switch reports nothing to re-own; and the
  dispatched deploy run after the switch passes all five maintenance-smoke gates and the telemetry gate.
- >-
  The boundary carries the four fence statements and the telemetry-family pattern, its minified size is recorded and at
  most 6,144 bytes, the post-apply simulate rows all match, and PlatformDev holds URL-only invoke on the telemetry reader.
- >-
  Decision N is on main in the pinned shape with its annotations; rec-4218's ingestion_shape, the production column set
  and rec-4207's producer identity model are recorded; rec-4218, rec-4207 and rec-4297 are closed.
- >-
  MEASUREMENT.md records the smoke baseline counts-only before provision_telemetry_catalog runs, including the per-day
  rates D and R the maintenance plan's thresholds use, and ADMIN-SESSION-RECORD.md carries every key the sibling plans
  read; no non-ops datapoint enters the undimensioned ops maintenance series during this plan.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The closed login table and the four rendered templates scope each login to its own catalog only.
  command: >-
    bin/venv-python -m pytest
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_closed_table_names_exactly_four_logins_and_two_owner_roles
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_every_login_renders_grants_on_its_own_schema_only
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_writer_template_grants_no_update_or_delete_on_catalog_structure
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_writer_template_grants_inlined_data_tables_by_class
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_reader_template_is_select_only_and_read_only
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_maintainer_template_joins_only_its_catalog_owner_role
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_render_refuses_any_name_outside_the_closed_table
    tests/lambdas/ducklake_maintenance/test_catalog_logins.py::test_owner_sql_creates_or_adopts_and_normalises_every_relation -q
  expected: Exit 0, every node passes. Red before because the module and the nodes are absent.
  fix_if: >-
    A node fails -- fix the table or the template; never widen a login to make a node pass (Decision 213 cl.3 as amended).
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-catalog-logins-closed-table
- step: 2
  phase: pre-deploy
  action: >-
    Both catalog verbs refuse outside their closed preconditions before any connection, run in the pinned order, never
    build the stats index, never emit a metric and never leak a host; the contract documents both.
  command: >-
    bin/venv-python -m pytest
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_telemetry_catalog_refuses_any_other_catalog_or_data_path_before_any_connection
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_telemetry_catalog_runs_owner_sql_create_seed_then_report_in_order
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_telemetry_catalog_never_creates_the_stats_index
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_telemetry_catalog_refuses_unless_the_owner_role_owns_the_schema
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_catalog_owner_without_adopt_leaves_the_schema_untouched
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_provision_catalog_owner_refuses_an_unknown_catalog_and_wrong_confirm
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_catalog_verbs_emit_no_metric_and_report_counts_only
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_database_errors_surface_only_class_and_sqlstate
    tests/lambdas/ducklake_maintenance/test_catalog_actions.py::test_contract_documents_both_catalog_verbs
    tests/lambdas/ducklake_maintenance/handler/test_dispatch.py::test_dispatch_routes_the_catalog_actions_to_catalog_actions -q
  expected: Exit 0, every node passes. Red before because the module and the nodes are absent.
  fix_if: >-
    An ordering node fails -- the seed must follow create and precede the report, and the stats-index SQL must never be
    referenced by catalog_actions (Decision 214 cl.2).
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-catalog-admin-verbs
- step: 3
