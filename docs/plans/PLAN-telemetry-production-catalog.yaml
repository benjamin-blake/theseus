  ## Decision N: Production telemetry gets its own catalog -- an owner role per catalog, one login per catalog binding, operator admin verbs to create it, and only the telemetry functions on its prefixes (amends Decision 216 clauses 1 and 3, Decision 213 clauses 1, 3 and 5, and Decision 81 clause 6) (Decided)

  ```yaml
  number: N
  status: Decided
  decided_date: "YYYY-MM-DD"
  amends: [81, 213, 216]
  significance:
    value: numbered_decision
    justification: "Durable catalog-identity and data-plane commitments with reversal conditions that amend Decision 216's owner rule and admin step and Decision 213's boundary naming, login model and carve-out; ducklake_maintenance.yaml and deploy-paths.yaml can index the procedures but cannot widen a ratified rule or carve-out, and an amendment_forms annotation cannot add one (Decision 204 cl.4 precedent)."
  ```

  **Status:** Decided
  **Date:** YYYY-MM-DD
  **Warehouse ID:** dec-N (per Decision 84 backfill)

  **Problem:** Real sessions have landed in the disposable smoke catalog since 2026-10-15. Production needs its own catalog, but Decision 216 left creating it an operator step with no carve-out, names one owner login that reaches every catalog, and leaves that login with the CI-reachable smoke maintenance function.

  **Decision:**
  1. Catalog. Production telemetry is its own DuckLake catalog: schema ducklake_telemetry in the existing catalog database, data under ducklake-telemetry/ (a sibling of ducklake/, never inside it) and blobs under telemetry-blobs/ducklake_telemetry/. It starts empty; smoke keeps its rows.
  2. Owner per catalog (amends Decision 216 cl.1). A schema's single owner is a NOLOGIN role per catalog (ducklake_telemetry_owner, ducklake_smoke_owner) owning the schema and every relation in it. The shared owner login is a member of each, and DDL it runs is normalised to the catalog's role in the same verb; a per-catalog DDL login takes that role as its session role. ducklake_maintenance_smoke moves to ducklake_smoke_maintainer, a member of the smoke role only, closing Decision 216's CI-path residual at the database layer.
  3. One login per catalog binding (amends Decision 213 cl.3): ducklake_telemetry_writer for the smoke binding (the writer until the flip, then its smoke twin) and ducklake_telemetry_writer_prod for production each hold, on their own schema only, the DML measured from the writer verbs (rec-4297; no UPDATE or DELETE on catalog structure, so a DuckLake DROP TABLE fails); ducklake_telemetry_reader holds SELECT on ducklake_telemetry only, read-only. Each has its own secret and connection limit, rendered from one closed table of versioned SQL templates.
  4. Admin verbs (amends Decision 216 cl.3, Decision 213 cl.5 and, for these verbs, Decision 81 cl.6): ducklake_maintenance gains provision_catalog_owner (create or adopt a catalog's owner role; the two catalogs only) and provision_telemetry_catalog (ducklake_telemetry only: owner role, DuckLake initialisation, create_telemetry_tables, counter seed, ownership report; never the stats index, Decision 214 cl.2); provision_telemetry_login serves the closed table. Re-running provision_telemetry_catalog is Decision 222 cl.3's production column add. All are operator-invoked; an ADMIN-container agent may write a login's secret and invoke them only under explicit human direction, presenting each mutation (Decision 204 cl.2 shape).
  5. Data-plane fence (amends Decision 213 cl.1's naming). The permissions boundary denies object reads, writes and deletes under the production telemetry prefixes to every bounded principal except the telemetry writer, telemetry reader and admin maintenance roles; PutObject under telemetry-blobs/ to all but the telemetry writer roles; DeleteObject there to all but admin maintenance; and DeleteObjectVersion under both to all. Decision 213 cl.1's denies name every telemetry function by one agent-platform-ducklake-telemetry-* pattern. PlatformAdmin stays the unbounded operator (Decision 144 cl.3). Decision 213's "before 2c" residuals rec-4205 and rec-4206 concern the shared ops writer, not the telemetry path, so nothing here waits on them; the CI write narrowing plan owns them.

  **Rationale:** An owner role per catalog makes "which catalog can this credential change" a Postgres fact, not an env pin (Decision 143 cl.1), and membership keeps owner-login paths working without pg_read_all_data. The boundary is the layer every bounded principal, PlatformDev included, carries and agents cannot edit; a bucket-policy Deny is editable in the merge loop and risks lockout.

  **Coverage (Decision 181 cl.2):** owner rule -- the ownership report on every smoke deploy and in provision_telemetry_catalog's response; production ownership after an extension migration -- the rerun of the owner verb, unenforced between runs; logins -- the per-login scope probe and tests/common/test_ducklake_telemetry_writer_least_privilege.py (real Postgres, run before merge; unenforced in CI until rec-4071); fence -- tests/checks/iam_tf/test_telemetry_prefix_fence.py and the post-apply simulate rows; a production column add -- unenforced until the flip's light gate checks drift.

  ```yaml reversal-conditions
  decision: N
  review_by: 2027-04-30
  on_trigger: "re-decide via /plan"
  conditions:
    - id: owner-role-refused
      kind: manual
      description: "The catalog provider refuses the owner-role membership, ownership transfer or session-role default for a non-superuser owner: the shared owner login owns ducklake_telemetry with default privileges to its logins, dated on Decision 216."
    - id: measured-grants-drift
      kind: manual
      description: "A DuckLake extension bump changes the statements a writer verb issues: re-measure clause 3's grants before the bump merges."
    - id: boundary-headroom
      kind: manual
      description: "The boundary's minified size passes 5,632 bytes: re-decide where clause 5's fence lives."
  ```

  **Related:** Decision 216, 213, 81, 214, 222, 204, 143, 144, 202, 126, 88, 181.

