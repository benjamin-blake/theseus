    boundary = next(r["change"]["after"]["policy"] for r in rc if r["address"] == "aws_iam_policy.github_ci_apply_boundary")
    size = len(json.dumps(json.loads(boundary), separators=(",", ":")))
    open(f"{m}/candidate-boundary.json", "w").write(boundary)
