schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-catalog
intent: >-
  Telemetry slice 2c (rec-4292, T2.36), the first of five plans: production catalog and owners. Real sessions have
  landed in the disposable smoke catalog since capture went live on 2026-10-15. This plan gives production telemetry its
  own DuckLake catalog (schema ducklake_telemetry, data under ducklake-telemetry/, blobs under
  telemetry-blobs/ducklake_telemetry/), owned by a NOLOGIN owner role per catalog, reached by one scoped login per
  catalog binding (writers with measured minimal grants, rec-4297; a SELECT-only reader), created by two closed,
  operator-invoked admin verbs, and fenced in the permissions boundary so only the telemetry functions and maintenance
  touch its prefixes. It moves the CI-reachable smoke maintenance function onto a smoke-only owner login, records the
  ingestion shape (rec-4218), the producer identity model (rec-4207) and the production column set, and ratifies one new
  Decision. Then come PLAN-telemetry-reader-and-smoke-twin, PLAN-telemetry-production-maintenance,
  PLAN-telemetry-catalog-aware-capture and PLAN-telemetry-production-flip. Telemetry is the learning signal for recursive
  self-improvement (PROJECT_CONTEXT); production residency is what slice 4's proofs and the feedback loop read.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-catalog.yaml
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake), follow-on mode; slice 2c production catalog and owners (rec-4292).
  Closes T2.36:c1 (the four tables created on DuckLake in production per the Class A contracts). c5 is owned by
  PLAN-telemetry-production-maintenance and c2 by PLAN-telemetry-production-flip.
closes_criteria:
- T2.36:c1
