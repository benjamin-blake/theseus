  action: Modify
  purpose: >-
    _ACTIONS gains provision_catalog_owner and provision_telemetry_catalog (catalog_actions); the module docstring's
    carve-out sentence names them with Decision N. No other change (452 SLOC today; the verbs live in their own module,
    Decision 128).
- file: src/lambdas/ducklake_maintenance/ducklake_telemetry_writer_role.sql
  action: Modify
  purpose: >-
    Becomes the writer TEMPLATE ({login}, {schema}, {owner_role}, {connection_limit}) used by both writer logins. Create
    the role NOLOGIN if absent; ALTER ROLE ... LOGIN NOINHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; statement_timeout 60s; CONNECT on ducklake_ops; USAGE on {schema}; REVOKE ALL on all tables and
    sequences in {schema} and REVOKE the earlier broad default privileges, then GRANT the MEASURED per-table set (one
    GRANT line per metadata table the writer verbs touch, from execution step 4's statement-log measurement; no UPDATE or
    DELETE on ducklake_table, ducklake_schema, ducklake_column or ducklake_snapshot unless the measurement proves a verb
    needs it, which the build must then justify in the PR), and default privileges FOR ROLE ducklake_ops and FOR ROLE
    {owner_role} carrying the measured default for objects created later. One transaction, so the revoke and the
    re-grant are atomic. Comments only describe the measurement and the re-measure rule; never a password.
- file: src/lambdas/ducklake_maintenance/ducklake_telemetry_reader_role.sql
  action: Create
  purpose: >-
    Reader TEMPLATE: role NOLOGIN if absent; LOGIN NOINHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; statement_timeout 100s (below the reader function's 120 s); default_transaction_read_only on;
    CONNECT; USAGE on {schema}; REVOKE ALL then GRANT SELECT ON ALL TABLES IN SCHEMA {schema}; default privileges
    SELECT ON TABLES FOR ROLE ducklake_ops and FOR ROLE {owner_role}. Nothing on any other schema or public.
- file: src/lambdas/ducklake_maintenance/ducklake_catalog_maintainer_role.sql
  action: Create
  purpose: >-
    Maintainer TEMPLATE: role NOLOGIN if absent; LOGIN INHERIT NOCREATEDB NOCREATEROLE CONNECTION LIMIT
    {connection_limit}; GRANT {owner_role} TO {login} WITH INHERIT TRUE, SET TRUE; ALTER ROLE {login} SET role =
    '{owner_role}', so DDL it runs is owned by the catalog's owner role and that role's default privileges apply.
    Membership of exactly one owner role; nothing else.
