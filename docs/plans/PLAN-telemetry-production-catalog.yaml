    print("FENCE SIMULATE OK") if good else sys.exit("FENCE SIMULATE STOP")
    EOF
    rc=$?; rm -rf "${TMPDIR:-/tmp}/tpc-evidence"; git worktree prune; test $rc -eq 0 && echo "SCRATCH CLEARED"
