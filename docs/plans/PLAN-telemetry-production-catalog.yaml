    rc = json.load(open(f"{m}/b.json")).get("resource_changes", [])
    moving = sorted((r["address"], tuple(r["change"]["actions"])) for r in rc if r["change"]["actions"] not in (["no-op"], ["read"]))
    want = {"aws_iam_policy.github_ci_apply_boundary", "aws_iam_policy.github_ci_apply_reads", "aws_cloudtrail.platform_security", "aws_iam_role_policy.platform_dev_runtime"}
