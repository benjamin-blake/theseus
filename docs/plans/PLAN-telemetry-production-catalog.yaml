rollback: >-
  The production catalog is additive and empty: nothing reads or writes it until the flip, so a code revert leaves it in
  place harmlessly. Smoke adoption is reversible by re-owning ducklake_smoke to ducklake_ops by hand (or by
  catalog_reinit, smoke being disposable). The switch PR reverts in one change (env and secret grant together) after
  which provision_catalog_owner(ducklake_smoke) normalises anything created meanwhile. A narrowed writer template that
  breaks a verb is rolled forward (a template grant line, the governed deploy, a provision_telemetry_login re-run);
  capture backs off and replays without loss. The bootstrap rolls back by applying the prior sha's HCL by hand.
