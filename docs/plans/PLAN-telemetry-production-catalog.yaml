    role = lambda n: "arn" + ":aws:iam::" + acct + ":role/" + n
    obj = lambda k: "arn:aws:s3:::agent-platform-data-lake/" + k + "/simulate-probe"
    def sim(principal, action, key):
        r = run("iam", "simulate-principal-policy", "--policy-source-arn", role(principal), "--permissions-boundary-policy-input-list", cand, "--action-names", action, "--resource-arns", obj(key))
        return r["EvaluationResults"][0]["EvalDecision"]
