infrastructure_dependencies:
- >-
  terraform/personal (auto-apply at merge behind the guard): three Secrets Manager containers, one lifecycle rule, and
  in-budget inline-policy updates on the admin maintenance role and the planner role. No role, trust, function or
  destroy change; nothing routes to tf-gated-apply.
- >-
  terraform/bootstrap (admin-only, Decision 126): pre-merge read-only plan at the PR head (execution step 8, the
  pre_merge_live_plan rule), then a human-directed apply after merge, then the post-apply simulate. Expected plan: four
  in-place updates (aws_iam_policy.github_ci_apply_boundary, aws_iam_policy.github_ci_apply_reads,
  aws_iam_role_policy.platform_dev_runtime, aws_cloudtrail.platform_security), nothing created or destroyed.
- >-
  Deploy: the merge redeploys every DuckLake function through the governed channel (src/common/ducklake_*.py and the
  maintenance and maintenance-smoke sources change). The new verbs are inert until the admin session invokes them.
- >-
  Admin session after both merge legs are green (execution steps 9-11), in the order deploy-paths.yaml's
  production_catalog_provisioning fixes: bootstrap apply and simulate; measurement BEFORE any create (Decision 88 cl.2);
  smoke owner adoption; production catalog; three secret values; four logins; ensure_catalog_indexes; merge_ops and
  gc_ops dry runs on ducklake_telemetry; a dispatched deploy run as the smoke proof.
- >-
  Post-admin PR (execution step 12): ducklake_maintenance_smoke's env and secret grant move to the smoke maintainer
  (auto-apply), only after its login exists, so the function never points at a login that is not there.
acceptance_criteria:
- >-
  T2.36:c1 -- the production telemetry catalog ducklake_telemetry exists with the four event tables and the two
  dimension pairs created per the Class A contracts (calendar-day partition on session_started_at, declared NOT NULL
  set) and ops_entity_counters seeded; every relation is owned by ducklake_telemetry_owner; the catalog stats index is
  valid on it (StatsIndexValid 1 for MetaSchema ducklake_telemetry); merge_ops and gc_ops dry runs on it answer 200 with
  no breaker.
- >-
  rec-4297 -- the four logins are provisioned from the closed table and each probe equals its expected scope; neither
  writer login can drop a DuckLake table or delete catalog history; the reader attaches read-only and cannot write
  (real Postgres 16 proof before merge, live probes after).
- >-
  ducklake_smoke is owned by ducklake_smoke_owner, ducklake_maintenance_smoke connects as ducklake_smoke_maintainer and
  holds no grant on the shared owner secret, and all five maintenance-smoke gates and the telemetry gate pass on a
  deploy run after the switch.
- >-
  The boundary carries the four fence statements and the telemetry-family pattern, its minified size is recorded and at
  most 6,144 bytes, the post-apply simulate rows all match, and PlatformDev holds URL-only invoke on the telemetry reader.
- >-
  Decision N is on main in the pinned shape with its annotations; rec-4218's ingestion_shape and rec-4207's producer
  identity model are recorded; rec-4218, rec-4207 and rec-4297 are closed.
- The smoke measurement (catalog_stats over telemetry_%, the writer's 7-day CloudWatch series, Neon consumption) is recorded counts-only before provision_telemetry_catalog runs.
