rollback: >-
  The production catalog is additive and empty: nothing reads or writes it until the cutover, so a code revert leaves it
  in place harmlessly. The smoke adoption is reversible by re-owning ducklake_smoke to ducklake_ops by hand (or by
  catalog_reinit, smoke being disposable); the post-admin PR reverts by restoring the shared secret grant and env in the
  same revert. A narrowed writer template that breaks live capture is rolled back by re-running provision_telemetry_login
  with the prior merged template. The bootstrap rolls back by applying the prior sha's HCL by hand.
