    tests/lambdas/ducklake_maintenance/test_login_actions.py::test_scope_probe_matches_the_closed_table_expectation
    tests/lambdas/ducklake_maintenance/test_login_actions.py::test_provisioning_refuses_until_the_owner_role_and_schema_exist -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  fix_if: A scope mismatch -- the probe or the expectation is wrong; never relax an expected scope to match a probe.
