    "ducklake_telemetry" and TELEMETRY_PROD_DATA_PATH = "s3://agent-platform-data-lake/ducklake-telemetry/" (the
    production telemetry catalog; the later slice 2c plans import
    them). A comment states the data prefix is a sibling of ducklake/, never inside it, so the ops catalog's catalog-wide
    orphan cleanup never sees telemetry Parquet.
- file: src/common/ducklake_telemetry_provision.py
  action: Modify
  purpose: >-
    (1) OwnershipReport gains schema_owner_held: the session's current_user IS the schema owner or can SET ROLE to it
    (pg_has_role(current_user, owner, 'SET')), the owner-role-aware form the checks use; schema_owner_is_current_user
    stays as an informational field. (2) ownership_report takes scoped_logins: tuple[str, ...] (default (SCOPED_LOGIN,))
    and reports scoped_create_on_schema / scoped_create_on_public as true when ANY listed login holds CREATE, every name
    passing the existing identifier guard. (3) provision_telemetry_catalog's absent-tables refusal names both owner
    steps (maintenance-smoke create_telemetry_tables on smoke, provision_telemetry_catalog on production). Nothing else
    changes; stays under 500 SLOC.
- file: src/lambdas/ducklake_maintenance/catalog_logins.py
  action: Create
  purpose: >-
    The one closed table (Decision N cl.3, cl.4). OWNER_ROLES = {"ducklake_smoke": "ducklake_smoke_owner",
    "ducklake_telemetry": "ducklake_telemetry_owner"}. LOGINS, a mapping of frozen Login records {name, secret_id,
    template, schema, owner_role, connection_limit, kind, expected_scope}: ducklake_telemetry_writer (secret
    agent-platform-ducklake-telemetry-writer-dsn, writer template, ducklake_smoke, limit 20 = 2 x (writer 5 + canary 5)
    reserved concurrency during the canary-to-cutover window), ducklake_telemetry_writer_prod
    (agent-platform-ducklake-telemetry-writer-prod-dsn, writer template, ducklake_telemetry, limit 10),
    ducklake_telemetry_reader (agent-platform-ducklake-telemetry-reader-dsn, reader template, ducklake_telemetry, limit
    10), ducklake_smoke_maintainer (agent-platform-ducklake-smoke-maintainer-dsn, maintainer template, ducklake_smoke,
    limit 2). render_login_sql(name) and render_owner_sql(meta_schema) format ONLY values from these tables into the
    bundled templates (str.format, the catalog_stats_index.sql precedent) after the identifier guard; any other name
    raises DuckLakeRuntimeError before any SQL is built. template_sha256(name) hashes the template FILE bytes (what the
    procedure's check compares against the merged file). No I/O beyond reading the bundled SQL files.
- file: src/lambdas/ducklake_maintenance/catalog_actions.py
  action: Create
  purpose: >-
    Two OPERATIONAL verbs (Decision N cl.4), each refusing before any connection unless its closed preconditions hold.
    action_provision_catalog_owner {meta_schema in OWNER_ROLES, confirm == meta_schema}: as the owner login
    (psycopg2, rt.fetch_dsn()), one transaction runs render_owner_sql(meta_schema): create the NOLOGIN role if absent
    under SET LOCAL createrole_self_grant = 'set, inherit' plus an idempotent GRANT role TO CURRENT_USER WITH INHERIT
    TRUE, SET TRUE; CREATE SCHEMA IF NOT EXISTS ... AUTHORIZATION role; for an existing schema owned by another role,
    GRANT CREATE ON DATABASE to the role, ALTER SCHEMA ... OWNER TO it, REVOKE that CREATE again; then normalise: every
    relation (relkind r, p, S, v, m) in the schema not owned by the role is re-owned with the relkind's ALTER ... OWNER
    TO. Response {ok, meta_schema, owner_role, schema_created, schema_adopted, relations_reowned, owner_sql_sha256,
    member_inherit, member_set}, counts and booleans only. action_provision_telemetry_catalog {meta_schema ==
    rt.TELEMETRY_PROD_META_SCHEMA, data_path == rt.TELEMETRY_PROD_DATA_PATH, confirm == meta_schema}: the owner step
    above; a DuckDB connection as the owner login on (data_path, meta_schema), which initialises the DuckLake metadata on
    first attach; the owner step's normalisation again; run_telemetry_txn(create_telemetry_tables) (create-if-absent plus
    the Decision 222 additive leg, which makes a re-run the production column add); normalisation again;
    run_telemetry_txn(provision_telemetry_catalog) (verify and seed the counters, so the counter seed is the catalog's
    first write and the GC live set is non-empty); then ownership_report(scoped_logins=(ducklake_telemetry_writer_prod,
    ducklake_telemetry_reader)) refusing unless foreign_owned is 0, schema_owner_held is true and no scoped CREATE.
    It never builds the stats index (Decision 214 cl.2; ensure_catalog_indexes is its own operator step). Response {ok,
    meta_schema, tables, created, added, counters, ownership, owner_sql_sha256, elapsed_ms}. Every psycopg2 or duckdb
    error after the precondition checks is re-raised as DuckLakeRuntimeError naming only its class (and SQLSTATE for
    psycopg2), the login_actions precedent, so no host or path reaches a response. Module docstring cites "(Decision N,
    amending Decision 216 clauses 1 and 3)", the citation the Decision test resolves N from.
- file: src/lambdas/ducklake_maintenance/login_actions.py
  action: Modify
  purpose: >-
    provision_telemetry_login serves the closed LOGINS table: confirm must name one of its four logins (else refuse
    before any connection); before the migration it refuses with a typed error naming the missing object unless both
    owner roles and both catalog schemas exist (the procedure's order); it renders that login's template, applies it as
    the owner, reads THAT login's secret (refused unless username equals the login, host and dbname equal the owner's
    and sslmode is require), sets the password as a bound parameter, then probes as the login. The scope probe reads, for
    ducklake_ops, ducklake_smoke and ducklake_telemetry, USAGE and CREATE (current_user), public and database CREATE,
    the session login's connection limit (session_user, so a login whose session role is an owner role still reports its
    own), membership of each owner role, whether default_transaction_read_only is on, and INSERT on <schema>.ducklake_snapshot;
    metadata_readable reads <schema>.ducklake_metadata. Response adds login and migration_sha256 = template_sha256.
    TELEMETRY_LOGIN and TELEMETRY_DSN_SECRET_ID stay as aliases of the smoke writer's entry for existing importers.
