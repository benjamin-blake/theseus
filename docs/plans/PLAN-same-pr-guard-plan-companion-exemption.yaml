  command: bin/venv-python -c "import pathlib;from unittest.mock import patch;from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting as a;src=pathlib.Path('scripts/checks/verification/validate_verifier_same_pr_guard.py').read_text(encoding='utf-8');assert 'registry.examined(' in src and 'registry.skipped(' in src,'no declaration';roster=pathlib.Path('config/check_accounting_baseline.yaml').read_text(encoding='utf-8');assert 'validate_verifier_same_pr_guard' not in roster,'still baselined';c=['scripts/checks/verification/validate_verifier_same_pr_guard.py','tests/checks/verification/test_validate_verifier_same_pr_guard.py','config/check_accounting_baseline.yaml'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();a(f);assert not f,f;print('OK')"
