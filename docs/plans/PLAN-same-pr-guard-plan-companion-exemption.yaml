- step: 7
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: It would discriminate on a docstring token rather than on the property the docstring describes -- the classification-gaming shape VF-06 c2 exists to reject. The clauses it pins are each independently asserted behaviourally by steps 4, 5 and 6; this step exists to make the prose falsifiable at all, not to stand in for them.
  action: Pin the documented clause, both halves. The module docstring must name the seam, the sanctioning contract row, the fact that the set used is the CANDIDATE one and the implementation_declared reason it is, and must still enumerate exactly (b) and (c) with no fourth exception marker; AND the row it cites must actually exist in the contract with trigger.kind resolved_plan_path. Without that second half the docstring could cite a row that had been renamed or deleted, and the citation this unit relies on to keep the two checks from drifting apart would be unfalsifiable prose.
  command: bin/venv-python -c "import yaml;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;d=g.__doc__ or '';assert 'plan_paths_from_changed' in d,d;assert 'implementing_plan_bookkeeping' in d,d;assert 'candidate' in d.lower(),d;assert 'implementation_declared' in d,d;assert '(b)' in d and '(c)' in d,d;assert '(d)' not in d,d;r=yaml.safe_load(open('docs/contracts/implement-scope-boundary.yaml',encoding='utf-8'))['sanction_rows']['implementing_plan_bookkeeping'];assert r['trigger']['kind']=='resolved_plan_path',r;print('OK')"
  expected: prints OK
  fix_if: 'A failure on the (d) assertion means the refinement was written as a new lettered exception. It is not one: exceptions (b) and (c) decide what to DO once covered_in_diff is known, while this change decides what enters covered_in_diff in the first place. A failure on the plan_paths_from_changed or implementing_plan_bookkeeping assertion means the docstring cites neither the seam nor the contract row, which is what stops the two checks drifting apart. A failure on the candidate or implementation_declared assertion means the docstring still describes the exemption as the contract''s RESOLVED set -- that description is false of the code (the module never calls resolve_declared_plans) and is precisely the drift this assertion exists to catch. A KeyError on the contract half means the sanction row was renamed or removed -- that is a contract change, not a docstring defect; stop and raise it rather than deleting the citation.'
