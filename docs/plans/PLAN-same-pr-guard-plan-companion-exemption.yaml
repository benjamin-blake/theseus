  graduation_waiver_reason: 'Tautological under VF-06 c2: the asserted property is invariant across this change, so the command exits 0 against an origin/main worktree too, and run_differential requires FAIL on main plus PASS on HEAD. Graduating it would register a probe the differential rejects. Its standing guard is the unit case test_violation_still_detected_when_plan_and_covered_file_both_present, which step 3''s module selector runs in every full tier and in --pre whenever the affected set selects it.'
  action: Decision 181 pin 1 -- the protective property survives. A verifier changed alongside a real covered source file still fails even with a resolved plan path present in the same diff.
  command: bin/venv-python -c "from unittest.mock import MagicMock, patch;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;c=['scripts/verifiers/harness.py','docs/plans/PLAN-same-pr-guard-plan-companion-exemption.yaml','scripts/validate.py'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();patch('scripts.checks._common.run',return_value=MagicMock(returncode=0,stdout='')).start();g(f);assert f==['Verifier same-PR guard'],f;print('OK')"
