  graduation: waive
  graduation_waiver_reason: Tautological under VF-06 c2 for the same reason as step 5 -- the property holds at origin/main and on HEAD, so no fail-on-revert exists to admit. Standing guard is the unit case test_non_plan_path_under_docs_plans_is_still_covered on step 3's selector.
  action: Decision 181 pin 2 -- the exemption is the contract's set, not the directory. A docs/plans path that PLAN_PATH_RE does not match (a nested one, the shape tests/checks/_common/test_primitives.py already pins for the primitive) is still counted as covered.
  command: bin/venv-python -c "from unittest.mock import MagicMock, patch;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;c=['scripts/verifiers/harness.py','docs/plans/reports/PLAN-not-a-resolved-plan.yaml'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();patch('scripts.checks._common.run',return_value=MagicMock(returncode=0,stdout='')).start();g(f);assert f==['Verifier same-PR guard'],f;print('OK')"
