- 'Decision 55 fail-loud -- the change adds no raise and no new terminal declaration path; findings keep riding the failed list. Decision 170 REVERSES this plan''s earlier no-declaration constraint: because the module is edited here and is a baselined check, the accounting declaration is mandatory (touch-it-fix-it, arm (d)) and is adopted on EVERY reachable exit path, not merely somewhere in the module.'
