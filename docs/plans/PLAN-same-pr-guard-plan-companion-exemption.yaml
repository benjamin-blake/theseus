  graduation_waiver_reason: Asserts against this session's transient working-tree diff and has no stable standing form once the change is merged and its diff is history.
  action: 'Run the registered check itself against this unit''s REAL diff. Honest expectation, stated up front: this unit changes no file under scripts/verifiers/, so the guard skips every verifier at its changed-set membership test and reaches the OK branch without evaluating a single covers glob. That vacuity is now DECLARED rather than silent -- with the Decision 170 adoption in place the run records examined_count 0, unit verifier_modules, status vacuous (measured in a scratch clone at 739706b), which is exactly the collapse between a vacuous pass and an enforced pass that Decision 170 exists to break. It remains a no-regression smoke signal -- the edited module still imports, dispatches and reports cleanly under the live seams -- and NOT evidence that the exemption works. Steps 4 to 6 carry that burden.'
