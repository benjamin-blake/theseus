  command: bin/venv-python -c "from unittest.mock import MagicMock, patch;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;c=['scripts/verifiers/harness.py','docs/plans/PLAN-same-pr-guard-plan-companion-exemption.yaml'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();patch('scripts.checks._common.run',return_value=MagicMock(returncode=0,stdout='')).start();g(f);assert not f,f;print('OK')"
  expected: prints OK. Measured at main 739706b, the same command against the unmodified guard emits six FAIL lines, one per class in harness.py, each naming the plan path as the covered file -- so this is a genuine fail-on-revert differential on BEHAVIOUR, not on the existence of a symbol or a test.
