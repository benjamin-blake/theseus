  fix_if: A failure here on a diff containing no verifier file means the module raised or the changed set is being read from something other than _common.get_changed_files -- diagnose the seam, never suppress the finding.
- step: 9
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Names this plan's own allowed touched set, which is transient by construction; there is no standing form of "no path outside these four".
  action: Touched-set assertion, ONE-SIDED by design -- assert that nothing OUTSIDE this plan's three scope files plus its own plan path was touched, never that every member of that set was. Read through the working-tree-aware seam _common.get_status_aware_diff (its untracked leg is the only primitive that sees a file created but not yet committed, and /implement runs on an uncommitted tree).
  command: bin/venv-python -c "from scripts.checks import _common;t={p for _s,p in _common.get_status_aware_diff()};e={'scripts/checks/verification/validate_verifier_same_pr_guard.py','tests/checks/verification/test_validate_verifier_same_pr_guard.py','config/check_accounting_baseline.yaml','docs/plans/PLAN-same-pr-guard-plan-companion-exemption.yaml'};outside=t-e;assert not outside,sorted(outside);print('OK')"
  expected: 'prints OK -- no touched path outside this plan''s three scope files plus its own plan path. A MISSING member is deliberately tolerated rather than asserted, and the plan path in particular will normally NOT appear: under the two-PR plan/implement flow (Decision 76; docs/contracts/overseer-dispatch.yaml states one merged artefact per slice, a merged plan OR a merged implementation PR) the plan document is already tracked at origin/main and stays unmodified until implementation_declared is set, which the implement skill places in the commit flow -- AFTER this Verification Plan runs. A two-sided equality would therefore red deterministically for a reason unrelated to this change, and its only in-plan remedy would be editing a verification_plan command or expected, which sanction_rows.implementing_plan_bookkeeping lists under prohibited_field_edits. Every merged precedent uses this one-sided form (PLAN-fast-tier-budget-breadth-split step 13, PLAN-pre-glob-closure-hub-prune step 6, PLAN-pre-glob-closure-portal-prune step 7).'
