  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'The standing guard IS a registered check that runs in both tiers on every PR: with the roster entry removed, validate_check_accounting arm (a) fails permanently and repo-wide the moment this module stops declaring, which strictly dominates a plan-scoped registry row asserting the same property. Graduating it would register a weaker duplicate of an always-on check -- the same reasoning steps 10 and 11 apply to ruff and the SLOC gates. Noted divergence: PLAN-verification-registry-sharding did graduate this shape (config/agent/verification_registry/entries/registry-check-accounting-declared.yaml); that row predates the roster removal being what makes arm (a) bind, and is not authority against waiving here.'
