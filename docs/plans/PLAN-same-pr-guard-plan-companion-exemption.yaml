schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: same-pr-guard-plan-companion-exemption
intent: 'Stop validate_verifier_same_pr_guard counting a diff''s own plan path as a "covered" file. Every plan-governed feat PR carries its own plan document, so a verifier whose covers is the default ** is reported against that plan file and no existing verifier can be modified by any plan-governed PR at all. The exemption is THIS DIFF''S plan paths -- the CANDIDATE set the scope-boundary contract''s own resolution starts from, computed the contract''s own way via _common.plan_paths_from_changed, so both checks share one regex home and cannot drift apart on what a plan path IS. It is deliberately the candidate set and NOT the narrower derived set the contract sanctions (resolve_declared_plans'' output): implementation_declared flips only in the commit flow, so that derived set is empty while this check runs and a guard routed through it would still deadlock. Prerequisite unit: it makes scripts/verifiers/harness.py modifiable by a governed PR, which a later unit needs to land its one-line PIE790 fix.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-same-pr-guard-plan-companion-exemption.yaml
phase: 'ad_hoc_rec soft-warn exception category; no tier_item claimed, no closes_criteria. RELATED (not targeted): T3.1 (complete -- owns the same-PR guard), T2.54 (not_started -- this adds one more clause-to-check edge between implement-scope-boundary.yaml and a second consumer).'
scope:
- file: scripts/checks/verification/validate_verifier_same_pr_guard.py
  action: Modify
  purpose: Exclude this diff's resolved plan paths from covered_in_diff, derived by _common.plan_paths_from_changed, and document the refinement under the existing exception enumeration without adding a fourth exception.
- file: tests/checks/verification/test_validate_verifier_same_pr_guard.py
  action: Modify
  purpose: Add five cases to TestSamePrGuard -- the downstream diff shape (covers-** verifier plus one candidate plan path, no violation), the two Decision 181 pins that keep the protective property and the exemption's exact set falsifiable, and the two Decision 170 pins on the module's accounting declaration, one per reachable exit path (examined and skipped).
- file: config/check_accounting_baseline.yaml
  action: Modify
  purpose: Remove the validate_verifier_same_pr_guard entry. The declaration adopted in scope file 1 satisfies validate_check_accounting arm (d) on its own, but leaving the name on the shrink-only roster keeps arm (a) permanently muted for this check; removing it is what makes the adoption load-bearing. Shrink is unrestricted (Decision 165 -- no marker grammar); re-adding is not.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- validate_verifier_same_pr_guard excludes from covered_in_diff exactly the paths _common.plan_paths_from_changed returns for this diff's changed set -- this diff's CANDIDATE plan paths, deliberately wider than the subset resolve_declared_plans derives -- and the module contains no docs/plans directory glob, no PLAN_PATH_RE copy, and no hardcoded plan path.
- A diff whose only non-verifier member is a resolved plan path reports no violation for a verifier class whose covers is the default ** -- the exact diff shape the downstream harness.py lint unit will present.
- 'The protective property is intact and pinned: a verifier changed alongside any real covered source file still fails even with a resolved plan path also in the diff, and a docs/plans path that PLAN_PATH_RE does not match is still counted as covered.'
- The module's exception enumeration is unchanged at (b) and (c); the plan-companion rule is documented as a refinement of what counts as covered, never as a fourth exception.
- Every pre-existing case in tests/checks/verification/test_validate_verifier_same_pr_guard.py passes unmodified -- no assertion is weakened, deleted or re-grounded -- and the check module stays at 100% per-file coverage (it carries no config/coverage_baseline.yaml entry).
- Nothing under scripts/verifiers/ is touched by this unit, and no config/sloc_budgets.yaml entry is added or raised.
- validate_verifier_same_pr_guard declares a registry accounting outcome on every reachable exit path -- registry.skipped on the scripts/verifiers-absent return and registry.examined(n, unit=verifier_modules) on the terminal path, n being the verifier modules actually scanned -- with BOTH paths pinned behaviourally by their own unit case rather than by a source-text scan, and its name is gone from config/check_accounting_baseline.yaml, so validate_check_accounting reports no violation for this diff.
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A RED proof asserts against a state that ceases to exist the moment the change lands -- the unmodified guard at origin/main. It is a session-time mutation probe with no standing form, and the differential it would be graduated into IS this same origin/main comparison, so a registry row would only restate the mechanism it is built on.
  action: RED. Copy the NEW test file into a pristine origin/main worktree and run only the five new cases against the UNMODIFIED guard. Runs at any point after the tests are written; the worktree isolates origin/main's guard, so the working tree's guard state does not matter. The setup half runs under set -e and the RED-CONFIRMED line is gated on the pytest summary, so a broken worktree cannot masquerade as a red test run.
  command: set -e; W="$(mktemp -d)/redproof"; git worktree add -q --detach "$W" origin/main; ln -s "$PWD/.venv" "$W/.venv"; cp tests/checks/verification/test_validate_verifier_same_pr_guard.py "$W/tests/checks/verification/test_validate_verifier_same_pr_guard.py"; set +e; OUT="$( cd "$W" && bin/venv-python -m pytest tests/checks/verification/test_validate_verifier_same_pr_guard.py -q -k 'resolved_plan_companion or plan_and_covered_file_both_present or non_plan_path_under_docs_plans or declares_examined_outcome or declares_skipped_outcome' 2>&1 )"; RC=$?; printf '%s\n' "$OUT"; git worktree remove --force "$W" || git worktree prune; test "$RC" -ne 0 && printf '%s' "$OUT" | grep -q "3 failed, 2 passed" && echo RED-CONFIRMED
  expected: 3 failed, 2 passed, and the step prints RED-CONFIRMED. The three reds are test_resolved_plan_companion_is_not_a_covered_file, test_declares_examined_outcome_for_scanned_verifier_modules and test_declares_skipped_outcome_when_verifiers_dir_absent -- at origin/main the guard's covered_in_diff still counts the plan path AND the module makes no examined() or skipped() call on EITHER exit path, so registry.pop_declaration() returns None and derive_status reads undeclared (measured in a scratch clone at 739706b, on the dir-absent path directly). The two Decision 181 pins are GREEN here by design -- they assert a property the change preserves, so a pin that went red against origin/main would mean the change breaks the guard rather than that the pin works. RED-CONFIRMED requires BOTH a non-zero pytest exit AND that summary substring, so a worktree that never ran the tests cannot print it.
  fix_if: '5 failed means a pin is asserting new behaviour rather than a preserved property -- re-read it, because it is then not a pin. Fewer than 3 failed means a new-behaviour case is not exercising what it claims: for the companion case the likely cause is a fixture verifier declaring a narrow covers instead of the default, or a plan path in changed that does not match PLAN_PATH_RE; for either accounting case, that the assertion reads something other than the declaration slot. A pytest collection error means the new test file references a symbol that does not exist at origin/main -- keep the new cases on stdlib, already-present imports and scripts.checks.registry (whose pop_declaration/derive_status predate this change). A non-zero exit with NO pytest summary printed and no RED-CONFIRMED means the setup half aborted under set -e (worktree add, symlink or copy) -- that is an infrastructure failure to read from stderr and fix, never a red to report.'
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Subsumed by step 3, which runs this selector's whole module including these four node ids, and by step 4's graduated behavioural assertion. A registry row here would execute a subset of a selector another row already owns.
  action: GREEN. The five new cases pass against the modified guard.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verifier_same_pr_guard.py -q -k "resolved_plan_companion or plan_and_covered_file_both_present or non_plan_path_under_docs_plans or declares_examined_outcome or declares_skipped_outcome"
  expected: 5 passed, 14 deselected
  fix_if: A failure on the companion case means plan_companions was computed from something other than the same changed list the comprehension iterates. A failure on either pin means the exclusion is too wide -- check it is a set-membership test against _common.plan_paths_from_changed and not a prefix or glob test on docs/plans. A failure on either accounting case means the declaration is not reached on the path that case drives -- the registry surface requires one on EVERY reachable exit, and the two cases drive the two exits separately for exactly that reason.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Not kernel-admissible as a discriminating differential: 16 of the 19 cases pass identically at origin/main and on HEAD, so the module-level selector''s only source of fail-on-revert is the one new case step 4 already graduates at a stronger altitude (a direct behavioural assertion rather than a node-id run). Graduating both would register two rows for one property, and this one would discriminate on test-existence rather than on behaviour.'
  action: Whole-module regression -- every pre-existing case still passes with no assertion weakened, alongside the five new ones.
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_verifier_same_pr_guard.py -q
  expected: 19 passed (14 pre-existing plus 5 new)
  fix_if: 'Any pre-existing failure is a real regression in the guard, not a test to re-ground: test_no_violation_when_verifier_newly_added and the four TestSamePrGuardDifferential cases all drive the exception-(b) branch through the same covered_in_diff value this change narrows. Decision 181 CONTENT -- never obtain green by editing a pre-existing assertion.'
- step: 4
