schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retired-repo-identity-sweep
intent: >-
  After the GitHub transfer-and-rename is proven, move every forward-standing reference to the retired repository
  identity (benjamin-blake/theseus) to otl-labs/ontheloop and forbid the old identity from then on (rec-3903;
  Decision 218; docs/contracts/github-org-transfer.yaml breakage_map rows dependabot_repository_guard,
  owner_literal_defaults, codeowners, descriptive_literals), so no script, workflow, contract or document relies on
  GitHub's redirect from the old path.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-retired-repo-identity-sweep.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3903 (Medium). Post-transfer: the last removal step of
  docs/contracts/github-org-transfer.yaml phases.predecessor_removal (the contract's order, kept by the operator on
  2026-10-15). No tier_item criterion claimed.
closes_criteria: []
scope:
- file: .github/workflows/dependabot-auto-merge.yml
  action: Modify
  purpose: The auto-merge job gate names only otl-labs/ontheloop (breakage_map.dependabot_repository_guard, old name dropped).
- file: tests/checks/ci_guards/test_validate_dependabot_automation.py
  action: Modify
  purpose: >-
    _JOB_IF and the line-245 fixture move to the target-only gate; the real-workflow test that
    PLAN-repo-identity-transfer-readiness added becomes test_real_auto_merge_gate_names_only_the_target.
- file: scripts/repo_identity.py
  action: Modify
  purpose: FALLBACK_FULL_NAME becomes otl-labs/ontheloop (breakage_map.owner_literal_defaults).
- file: tests/test_repo_identity.py
  action: Modify
  purpose: The unset/malformed-environment fallback assertions name otl-labs/ontheloop.
- file: tests/checks/misc/test_validate_ghas_probe.py
  action: Modify
  purpose: TestDefaultRepoSlug's env-unset default assertion names otl-labs/ontheloop.
- file: scripts/convergence_health/escalate.py
  action: Modify
  purpose: _ACCEPTANCE_STUCK_APPROVAL's gh api path names otl-labs/ontheloop.
- file: tests/convergence_health/test_escalate.py
  action: Modify
  purpose: Add test_stuck_approval_acceptance_names_the_new_repository (red before, green after).
- file: .github/workflows/ghas-probe.yml
  action: Modify
  purpose: The GHAS_PROBE_TOKEN scope comment names otl-labs/ontheloop.
- file: COMMERCIAL-LICENSE.md
  action: Modify
  purpose: The issues URL names otl-labs/ontheloop (operator-approved wording).
- file: config/agent/verification_registry/entries/licensed-work-mark-and-historical-split.yaml
  action: Modify
  purpose: Its COMMERCIAL-LICENSE.md issues-URL assertion names otl-labs/ontheloop (same PR as the text, Decision 132/176).
- file: config/agent/verification_registry/entries/roadmap-retired-brand-tokens-absent.yaml
  action: Modify
  purpose: Asserts zero benjamin-blake/theseus and exactly one otl-labs/ontheloop in docs/ROADMAP-PLATFORM.yaml.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: The OIDC tier item's exit criterion names otl-labs/ontheloop (precedent PLAN-repo-rename-relicense).
- file: docs/contracts/package-registry-reservation.yaml
  action: Modify
  purpose: pypi_trusted_publisher.repository names otl-labs/ontheloop, plus the approved amendment_log entry.
- file: tests/test_ontheloop_placeholder_packages.py
  action: Modify
  purpose: test_publish_workflow_shape_and_trust_triple asserts the trust triple's repository is otl-labs/ontheloop.
- file: packages/ontheloop-js-scoped/package.json
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only; nothing is republished).
- file: packages/ontheloop-js/package.json
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only).
- file: packages/ontheloop-py/pyproject.toml
  action: Modify
  purpose: Description and Repository URL name otl-labs/ontheloop (source only).
- file: packages/ontheloop-py/src/ontheloop/__init__.py
  action: Modify
  purpose: Module docstring URL names otl-labs/ontheloop.
- file: packages/ontheloop-rs/Cargo.toml
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only).
