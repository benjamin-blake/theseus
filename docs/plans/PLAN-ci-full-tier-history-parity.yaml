  - "Root cause: rec-3936/rec-3937 context_v2_json; corpus SHAs sit 87-142 commits back and grow one per merge, so no bounded depth is stable"
  - "closure artifacts (Decision 186, name at plan time): rec-3936 -> pytest:tests/checks/deps/test_fast_tier_harness.py::TestCorpus::test_historical_diff_rejects_digest_path_and_status_drift; rec-3937 -> pytest:tests/checks/deps/test_fast_tier_harness.py::TestCorpus::test_historical_diff_matches_every_pinned_case; rec-3668 -> pytest:tests/session/preflight/test_context_docs.py::TestEndstateStampRefResolves::test_stamp_assertion_fails_rather_than_skips_when_commit_absent (aligned with rec-3668's stored acceptance, which names this same new test; resolves once created, not today); rec-2040 -> pytest:tests/verify_ci_workflow/test_ci_data_guards.py::TestCheckFetchDepthFailPath::test_fails_when_main_validate_has_no_checkout_step -- the NEW no-checkout-step test, which is what rec-2040 is actually about (its own acceptance greps for 'no checkout step'); resolves once created, not today. NOT test_fails_when_main_validate_has_wrong_fetch_depth, whose polarity this plan flips. A bare class segment never resolves: closure_gate._pytest_kind_fact matches 'def <last-segment>' only"
  - "Decision 159 precedent for a value-changing annotation that mints no number: its own 2026-08-18 clause-1 widening"
  - "tests/verify_ci_workflow/test_ci_data_guards.py TestCheckFetchDepthFailPath asserts depth 0 MUST FAIL today - that flip is the red-before-green evidence"
  - "advice-consult: Fable, twice (repo-context, then industry-best-practice); end state is a hermetic corpus, this plan is the bridge"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Raise both full-tier checkouts to fetch-depth 0
  - Rewrite the depth guard as a rule over full-tier jobs and extend it to the canary
  - Add the harness object-availability probe and its tests
  - Convert the stamp-assertion skip to a hard failure
  - Route the governance content per significance.routing_rule
  - Execute the Verification Plan
