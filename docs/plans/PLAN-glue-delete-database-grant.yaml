constraints:
  - No rescue agents or workaround loops (Decision 55) -- forward-fix only.
  - >-
    Decision 143 worst-verb scoping: restore ONLY the destroy-path verbs. Do not re-add
    CreateDatabase/UpdateDatabase/CreateTable/UpdateTable -- no remaining HCL can reach them.
  - >-
    Decision 177 clause 1: Decision 178's body is immutable. Use the blockquote_update form pinned by
    decision-entry.yaml's amendment_forms. Per AGENTS.md's Change-record content rule the annotation
    carries ONLY the clause-completion fact -- never the run id, byte measurements, or red-record state.
  - >-
    Decision 119 as amended by its 2026-08-25 Update: no local terraform init/plan for
    terraform/personal on the ROUTINE flow -- validate/plan/apply there stay CI-mediated.
    terraform/bootstrap is planned locally by the operator at VP step 8, and the human-gated
    break-glass ADMIN tier (terraform/CLAUDE.md; the sole exception Decision 126 carves out of
    "agents never run terraform apply as a routine action") retains local init/plan/apply on
    terraform/personal at main tip. That carve-out is load-bearing here: it is the recovery path
    both the routed-dispatch branch (VP step 11) and the state rm branch depend on.
  - >-
    Decision 128 decompose-by-default. NEITHER scope Python file is registered in
    config/sloc_budgets.yaml, so both sit under the hard 500 default with no budget to raise:
    scripts/checks/iam_tf/_write_companions.py is at 454/500 (46 headroom) and
    tests/checks/iam_tf/test__write_companions.py at 475/500 (25 headroom). If either crosses,
    decompose -- the existing sibling tests/checks/iam_tf/test__write_companions_split_root.py is the
    precedent for the test file. The two NEW files (scripts/ops/drain_glue_orphan.py,
    tests/ops/test_drain_glue_orphan.py) are likewise unregistered and bind at the same hard 500
    default -- decompose rather than register, and never seed a budget row for them.
  - >-
    Coverage floor -- JOINTLY BINDING with the Decision 128 SLOC constraint above on the SAME file,
    and the pair is what forecloses the obvious split. Neither
    scripts/checks/iam_tf/_write_companions.py nor tests/checks/iam_tf/test__write_companions.py has
    an entry in config/coverage_baseline.yaml, and scripts/test_coverage_checker.py line 440 reads
    threshold = baseline.get(rel_str, 100.0), so the implicit standard is 100%. MEASURED this
    session: _write_companions.py is 98 statements, 0 missed -- exactly 100% -- from
    tests/checks/iam_tf/test__write_companions.py ALONE (33 passed). ZERO SLACK.
    map_source_to_test resolves that source to exactly that ONE test file and the measurement
    command is built from that single path, so tests/checks/iam_tf/test__write_companions_split_root.py
    is NEVER collected for this measurement. Moving any case that uniquely covers a line onto the
    sibling therefore drops the source below 100% and hard-fails validate_test_coverage, which is
    registered full_segment=full_after_lint with no pre leg -- VP step 6, which
    handoff_policy.full_validation_required_before_commit makes a blocking pre-commit gate. The
    documented escape hatch is CLOSED by this plan's own routing: registering a sub-100 baseline
    entry requires an inline `# baseline-lowered: dec-NNN <reason>` marker naming a real
    `## Decision NNN:` header, and this plan deliberately mints no Decision. The two new
    both-direction cases are the sole exercisers of the new sibling-collector lines, so they are
    precisely the cases that must NOT move.
  - >-
    In-array comment rule (the boundary file's own rec-2882 note, which "cost a real debugging
    round"). It binds EVERY bracketed array parsed by a non-greedy Field-equals-bracket regex --
    the boundary's DataPlaneAllow Action array AND the GlueCatalog Sid's own Action/Resource arrays,
    which the new pin test parses the same way: a comment inside any of them must contain NO square
    bracket of either kind and must not quote a bare star -- the checks parse the array with a non-greedy
    Field-equals-bracket regex, so one stray bracket truncates the parsed ceiling, and a truncated
    list ending in a wildcard makes EVERY boundary assertion pass vacuously. Put the
    intersection-hazard prose ABOVE the Sid line instead.
  - Restore glue only. athena stays deleted at both layers (Decision 178 clause 2).
