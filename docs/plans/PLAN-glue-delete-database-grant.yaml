  - "Root cause: 7b67e21d (PR #969) deleted the glue HCL AND both IAM layers in one sweep, before the live resource was destroyed -- revoking the authority needed to make Decision 178 clause 2 true in AWS."
  - "Live state at planning: identity policy grants DeleteDatabase on catalog+database+table/* but NOT userDefinedFunction/*; boundary is still v6 WITH glue:* (bootstrap unapplied since the cleanse). Applying bootstrap as-is would revoke BOTH layers."
  - "Scope-creep check on row 4: the generalized check would NOT have caught 7b67e21d (that sweep removed both layers together, leaving no uncovered identity action, and the live grant was never in HCL). It guards the next-step risk this plan creates -- restoring one layer without the other -- and per-action beats service-prefix: a ceiling carrying only glue:GetDatabase would still flag glue:DeleteDatabase."
  - "aws_glue_catalog_database.ops is in tfstate at serial 195 holding three retired ops_* catalog entries. SoT for those tables is DuckLake-on-Neon, so the cascade delete is the intended outcome, not data loss."
  - "FALLBACK (operator-directed) if CI terraform provisioning is blocked: Decision 178 clause 4's other branch, terraform state rm aws_glue_catalog_database.ops. Three consequences established at planning: (a) PlatformAdmin simulates implicitDeny on glue:DeleteDatabase at both ARNs, so deleting the live database needs a separate operator-authorized PlatformAdmin grant; (b) without that, the live database and its three table entries persist unmanaged; (c) state rm does NOT itself write the record, and a Reconcile run afterwards would still fail --
    it re-plans at RED_SHA, which carries the pre-29dd24bd S3 tag. On this branch too the record is
    turned green by VP step 11's apply-sandbox dispatch, which replans at main tip. Neither rec's acceptance oracle is satisfied on this branch -- close both as superseded."
  - "rec-3351 (filed this session, not bundled): terraform-apply-sandbox's acknowledge_red_commit input still claims to be the ONLY path to clear red -- false for any guard-routed replan since Reconcile subsumed that case. rec-3350 was filed earlier against deploy-paths.yaml on a mistaken premise and is declined: that contract named the right primitive all along."
  - "Oracle correction (the change that made the runbook safe): `aws glue get-database` is NOT a drain oracle. PlatformAdmin's glue:GetDatabase comes from a GlueCatalog Sid in its LIVE PlatformDataLakeProvisioning inline policy that is absent from HCL -- terraform/personal/platform_roles.tf:458 manages aws_iam_role_policy.platform_admin_datalake and `grep -c -i glue` on that file returns 0 -- so the terraform/personal apply this runbook performs strips it as drift. The resulting AccessDeniedException is indistinguishable from `not drained`, a false alarm that would push the operator into the state rm fallback on a false premise. Oracles are control-plane instead, and the apply cannot revoke them: immediate = `aws_glue_catalog_database.ops: Destruction complete` in the Reconcile run log; authoritative = the fresh main-tip plan showing no glue delete remaining + guard PASS + record green."
  - "Runbook form (advice consult, human-blessed): the post-deploy half is a SPECIFICATION for scripts/ops/drain_glue_orphan.py, not prose. Prose steps hardcode fluents -- facts about a live, drifting world -- and are only ever executed by a fallible reader at critique time; five critique rounds produced ~8 blocking findings and three rewrites, every one of them in this half, while the code half survived untouched because tests execute it. The script derives fluents at runtime, asserts workflow invariants by PARSING committed source (so a workflow edit reds a test instead of silently voiding the runbook), and precondition-gates each phase, failing closed with `world has moved -- re-assess`. In-repo precedent for the gate shape: .github/workflows/reconcile.yml lines 267-282."
  - "ci-rca deferral: rec-3292 (requirements.lock extras) and rec-3293 (pytz missing) are open ci_rca recs sharing no file, Decision, or failure category with this plan. Deferred deliberately -- both are dependency-manifest failures on main, unrelated to the IAM surface here."
