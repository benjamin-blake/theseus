schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "glue-delete-database-grant"
intent: >-
  Restore the github_ci_apply GlueCatalog grant at BOTH IAM layers, narrowed to the destroy path
  and widened with the userDefinedFunction ARN, so the orphaned aws_glue_catalog_database.ops can
  be destroyed -- completing Decision 178 clause 4's named reconcile in live AWS and unlatching the
  stalled terraform/personal convergence chain. Installs a standing ceiling check that closes the
  one-layer-without-the-other risk this restoration itself creates.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-glue-delete-database-grant.yaml
phase: >-
  Platform CI/CD convergence repair. ad_hoc_rec / ci_rca soft-warn exception category (rec-3348,
  rec-3328), so the Tier Item Freshness Gate is skipped and no tier_item is claimed. Unblocks
  PLAN-ci-convergence-fixes VP step 13 and rec-3327's deferred live proof.
scope:
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: >-
      Restore the GlueCatalog Sid narrowed to the destroy path (drop CreateDatabase, UpdateDatabase,
      CreateTable, UpdateTable -- unreachable post-cleanse, Decision 143 worst-verb scoping) and add
      the fourth Resource ARN userDefinedFunction/agent_platform/*, the axis run 33323201848 denied on.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      Restore "glue:*" to the DataPlaneAllow ceiling (service-wildcard form, matching every sibling
      data-plane entry). NOT athena:* -- no athena resource remains in state. Without this the
      identity grant is silently denied by the intersection (Decision 144 clause 1 / rec-2831 class).
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Modify
    purpose: >-
      Arm the rec-3325-seeded multi_resource_type_verbs map with two live allowed triples (database
      and userDefinedFunction axes) plus the Class D amendment_log entry Decision 168 requires.
  - file: scripts/checks/iam_tf/_write_companions.py
    action: Modify
    purpose: >-
      Forward-fix (Decision 129): drop the iam:-only filter from
      check_identity_iam_actions_subset_of_boundary so EVERY identity Allow action is ceiling-checked
      per-action. Guards the one-layer-without-the-other regression this plan's own restoration risks.
  - file: tests/checks/iam_tf/test__write_companions.py
    action: Modify
    purpose: >-
      Add both-direction coverage for the generalized leg AND rewrite the one incumbent the
      generalization invalidates (see execution_steps) -- this row is NOT purely additive.
  - file: tests/checks/iam_tf/test_glue_catalog_grant_scope.py
    action: Create
    purpose: >-
      Standing pin on the resource axis: per-Sid parse asserting GlueCatalog's Resource set is exactly
      the four ARNs, that no create/update verb returned, that athena stays absent at both layers, and
      that the fixture is not silently disarmed. Per-Sid, so "right token in the wrong Sid" fails.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append a blockquote_update annotation to Decision 178 recording that clause 4's reconcile was
      taken via the gated-apply branch rather than state rm, and why (append-only per Decision 177
      clause 1; no numbered Decision -- see context for the routing adjudication).
bundled_recommendations:
  - rec-3348
  - rec-3328
infrastructure_dependencies:
  - >-
    terraform/bootstrap is admin-applied MANUALLY out-of-band with the agent_platform_admin profile
    and is excluded from every auto-apply path. No CI job applies it, and this diff cannot fire
    terraform-apply-sandbox: that workflow's push/PR path filter is terraform/personal/** and
    terraform/bootstrap/** is deliberately excluded (terraform/bootstrap/CLAUDE.md).
  - >-
    Decision 156 byte ceilings -- this diff touches BOTH. Inline identity policy: under 10,240 B; the
    narrow restore projects ~8,211-8,683 B depending on rendering (two independent measurements, both
    safe) and is SMALLER than today's live Sid, since dropping four verbs outweighs adding one ARN.
    Managed boundary policy: under 6,144 B, measured 1,548 B, so the ~11 B glue addition is trivially
    safe. Both authoritative assertions are HCL lifecycle preconditions evaluating at admin plan time
    (VP step 7).
  - >-
    The bootstrap root has unapplied drift accumulated since the 7b67e21d cleanse, so VP step 7's
    apply lands MORE than this plan's diff. The operator reviews the full plan output, not only the
    two expected changes.
  - >-
    The convergence record is red at e8332e9f (run 33323201848). A red record is the sole hard block
    and no push clears it; the only clear path is workflow_dispatch acknowledge_red_commit naming the
    red SHA or an open rec id. BUT that dispatch cannot drain THIS episode: the destroy is a
    guard-routed delete and apply-sandbox's gated-apply job requires event_name == 'push', so a
    dispatch produces a green no-op. Reconcile is the correct trigger -- its gated-apply-reconcile job
    has no push condition and explicitly subsumes this case (T2.37 c3). That run failed on THREE legs;
    the other two (S3 InvalidTag, iam:UpdateRoleDescription) were resolved on main by
    validate_terraform_tag_charset and Decision 180, which is what makes criterion 5 reachable.
acceptance_criteria:
  - >-
    GlueCatalog grants glue:DeleteDatabase on all four ARNs including
    userDefinedFunction/agent_platform/*, and grants none of the four create/update verbs.
  - The boundary DataPlaneAllow ceiling grants glue, and athena remains absent at both layers.
  - >-
    The fixture carries an allowed triple on both the database and userDefinedFunction axes, and
    validate_iam_simulate_fixture_shape fails if either is removed.
  - >-
    check_identity_iam_actions_subset_of_boundary flags ANY identity Allow action absent from the
    ceiling (not just iam: actions), and reports zero gaps on the post-change tree.
  - >-
    Live simulate returns zero mismatches, and Reconcile's gated-apply-reconcile job -- after the
    tf-gated-apply human approval -- drains the destroy and writes the convergence record green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Exercise the resource-axis pin -- GlueCatalog's Resource set is exactly the four ARNs (parsed
      per-Sid), the create/update verbs are absent, athena is absent at both layers, and the fixture
      carries both axes.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_glue_catalog_grant_scope.py -q
    expected: exit 0, all assertions pass
    fix_if: >-
      Fails red before the HCL edit (expected); after the edit a failure means the UDF ARN landed in
      the wrong Sid, a create/update verb survived, athena crept back, or a fixture row is missing.
    hermetic: false
    graduation: graduate
    graduation_check_id: glue-catalog-grant-udf-resource-axis
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the generalized ceiling leg bites in BOTH directions, and that the two incumbents the
      generalization invalidates were rewritten rather than deleted.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test__write_companions.py -q
    expected: >-
      exit 0, including the new both-direction cases and the rewritten
      test_no_iam_actions_short_circuits_no_file_read. test_collects_allow_iam_actions_only stays
      UNCHANGED and green -- the sibling-collector design keeps the iam-only helper's contract intact.
    fix_if: >-
      If only the positive case passes the check is vacuous -- assert the negative case fails loud
      naming the uncovered action. If an incumbent was deleted rather than rewritten, restore it.
    hermetic: false
    graduation: graduate
    graduation_check_id: identity-action-ceiling-coverage
  - step: 3
    phase: pre-deploy
    action: >-
      Run the generalized check against the REAL tree (not synthetic fixtures) and confirm it reports
      zero action-coverage gaps once both layers carry glue.
    command: bin/venv-python -c "from scripts.checks.iam_tf.validate_ci_refresh_read_coverage import validate_ci_refresh_read_coverage as v; f=[]; v(f); assert not f, f; print('zero gaps on the real tree')"
    expected: prints zero gaps on the real tree
    fix_if: >-
      A gap naming glue means the ceiling edit was missed; a gap naming another service means the
      generalization surfaced a real pre-existing hole -- fix it here, do not narrow the check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The command re-invokes validate_ci_refresh_read_coverage, an already-registered check that runs
      in both presubmit tiers via the iam_tf manifest. Graduating a second registry row for the same
      evaluator would duplicate a standing guard rather than add one; step 2 graduates the new leg's
      own unit coverage instead.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the multi-resource-type leg is genuinely armed on the REAL fixture -- delete the
      userDefinedFunction triple from a scratch copy and confirm the shipped validator refuses it.
    command: >-
      bin/venv-python -c "import pathlib,tempfile,yaml; from scripts.checks.contracts.validate_iam_simulate_fixture_shape import validate_iam_simulate_fixture_shape as v; d=pathlib.Path(tempfile.mkdtemp()); src=pathlib.Path('docs/contracts/iam-simulate-fixture.yaml'); y=yaml.safe_load(src.read_text()); y['triples']=[t for t in y['triples'] if 'userDefinedFunction' not in str(t.get('target_arn_template',''))]; (d/'iam-simulate-fixture.yaml').write_text(yaml.safe_dump(y)); f=[]; v(f, contracts_dir=d); assert any('userDefinedFunction' in x for x in f), f'mutation not caught -> {f}'; g=[]; v(g); assert not g, g; print('armed - real fixture passes, UDF-stripped copy refused')"
    expected: prints the armed confirmation line
    fix_if: >-
      If the stripped copy passes, both triples are absent (armed-but-inert) or the verb key does not
      match the map -- the fixture is not actually guarding the axis.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The leg's negative case is already a committed standing guard at
      tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py TestMultiResourceTypeVerbs,
      itself graduated as iam-simulate-fixture-multi-resource-companions.yaml. This step's added value
      is the one-time mutation probe against the REAL fixture rather than a synthetic tmp_path one, so
      a registry row would duplicate an existing guard instead of adding one.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast presubmit tier. Also covers terraform fmt -check on the edited roots via the existing
      credential-free _terraform gate (Decision 119 -- no local init/plan for terraform/personal).
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: A .tf fmt or check-accounting failure -- fix on the branch before pushing.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-handoff full tier. handoff_policy.full_validation_required_before_commit is declared, so the
      commit waits on a completed full run exiting 0; step 5 does not discharge it.
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: Triage the named check; do not bypass the budget assertion to get green.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      OPERATOR, after merge: plan and apply terraform/bootstrap by hand per terraform/bootstrap/CLAUDE.md
      sections 4-5. STOP if the plan shows replace/destroy for the four protected resources. Review the
      FULL diff -- the root carries unapplied drift since the cleanse, so this lands more than this
      plan's changes. The Decision 156 lifecycle precondition evaluates here and is the byte gate.
    command: >-
      set -o pipefail && AWS_PROFILE=agent_platform_admin terraform -chdir=terraform/bootstrap init && AWS_PROFILE=agent_platform_admin terraform -chdir=terraform/bootstrap plan -var-file=terraform.bootstrap.tfvars -out=/tmp/bootstrap.tfplan && AWS_PROFILE=agent_platform_admin terraform -chdir=terraform/bootstrap show -no-color /tmp/bootstrap.tfplan | tee /tmp/bootstrap.plan.txt && if grep -qE 'will be destroyed|must be replaced' /tmp/bootstrap.plan.txt; then echo "STOP - destroy or replace present, review before applying"; exit 1; fi && AWS_PROFILE=agent_platform_admin terraform -chdir=terraform/bootstrap apply /tmp/bootstrap.tfplan
    expected: >-
      set -o pipefail makes a failed terraform show fail the chain rather than feeding the guard an
      empty file; tee prints the FULL plan for operator review; the guard finds nothing and so
      does not exit 1 (a hit halts before apply); the plan adds the GlueCatalog Sid and glue to the
      boundary DataPlaneAllow; both byte preconditions pass; apply succeeds. terraform apply on a
      SAVED plan does not prompt, so the guard -- not an interactive yes -- is what stops a bad apply.
    fix_if: >-
      STOP on any destroy/replace of the four protected resources (Decision 156 point 2 -- destroying
      the role breaks in-flight CI; dropping the reads policy strips the refresh-read surface). If the
      precondition trips the 10,240 B ceiling, relocate a read-only Sid to the github_ci_apply_reads
      managed policy (Decision 156 clause 1) -- never drop the UDF ARN.
  - step: 8
    phase: post-deploy
    action: >-
      OPERATOR: prove the two-layer intersection LIVE. This is the only step that shows the widening
      took effect through the identity/boundary intersection rather than just in HCL text.
    command: bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml
    expected: exit 0, zero mismatches -- including both new glue triples returning allowed
    fix_if: >-
      The userDefinedFunction triple returning implicitDeny while the database triple is allowed means
      the ceiling half did not apply; re-check the boundary policy's default version.
  - step: 9
    phase: post-deploy
    action: >-
      OPERATOR: drain via the Reconcile action -- NOT terraform-apply-sandbox's
      acknowledge_red_commit dispatch. The destroy is a guard-routed delete, and apply-sandbox's
      gated-apply job requires github.event_name == 'push', so a dispatch there yields a GREEN run
      that applies nothing and leaves the record red. Reconcile's gated-apply-reconcile job carries
      no push condition and subsumes exactly this case (reconcile.yml, rec-2647/rec-2523 deadlock,
      T2.37 c3). APPROVE the gated-apply-reconcile job when it requests the tf-gated-apply
      Environment approval, then assert on the RECORD, never on the run's exit code.
    command: >-
      gh workflow run reconcile.yml -f rec_id=rec-3348 && sleep 15 && RID=$(gh run list --workflow=reconcile.yml --limit 1 --json databaseId --jq '.[0].databaseId') && echo "approve gated-apply-reconcile in the Actions UI when it requests tf-gated-apply" && gh run watch "$RID" ; aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json /tmp/conv.json --profile agent_platform_admin && bin/venv-python -c "import json; d=json.load(open('/tmp/conv.json')); assert d.get('status')=='green', d; print('convergence record GREEN')" && ! aws glue get-database --name agent_platform --profile agent_platform_admin
    expected: >-
      Reconcile resolves the red commit itself, the guard routes the delete, gated-apply-reconcile
      requests approval, and after approval the destroy runs and the record is written status=green.
      The command asserts the record is green AND that get-database now fails
      (EntityNotFoundException), so a passing step means both. A green run with a still-red record
      means nothing was applied -- see fix_if.
    fix_if: >-
      GREEN RUN + STILL-RED RECORD = nothing was applied. Check apply-reconcile's routed output: if
      routed=true and no gated-apply-reconcile job appeared, approval was never requested; if it
      appeared unapproved, approve it. Do NOT fall back to terraform-apply-sandbox with
      acknowledge_red_commit -- that path cannot execute a routed delete at all. A denial on a NEW
      glue ARN for the same verb is a Resource-axis gap -- widen the Resource list. A denial naming a
      DIFFERENT action (rec-3328's corrective_action anticipates glue:DeleteUserDefinedFunction) is a
      new verb, so it is a Decision 143 worst-verb re-scoping judgement -- add it deliberately, do not
      reflexively widen. A NON-glue failure (run 33323201848 also carried an S3 InvalidTag on
      PutBucketTagging and an iam:UpdateRoleDescription denial) means a sibling leg regressed -- both
      were resolved on main, so re-check those before touching glue.
  - step: 10
    phase: post-deploy
    action: >-
      Closure obligation -- confirm both bundled recs actually closed via the Resolves trailer and
      rec-autoclose.yml rather than assuming the trailer fired.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json; rows={json.loads(l)['id']: json.loads(l).get('status') for l in open('logs/.recommendations-log.jsonl') if l.strip()}; bad={r: rows.get(r) for r in ('rec-3348','rec-3328') if rows.get(r)!='closed'}; assert not bad, f'still open -> {bad}'; print('both closed')"
    expected: prints both closed
    fix_if: >-
      Close manually via ops_data_portal --update-rec with a resolution naming the merge SHA
      (Decision 70 fallback).
  - step: 11
    phase: post-deploy
    action: >-
      Time-box the grant: file the removal-obligation rec so the drain grant does not become standing
      unused authority once the resource leaves state.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --guidance && bin/venv-python -m scripts.ops_data_portal --file-rec --title "Remove the time-boxed glue drain grant now that aws_glue_catalog_database.ops has left state" --file terraform/bootstrap/github_ci_apply_policy.tf --priority High --effort XS --risk low --source manual --context "The GlueCatalog Sid and the boundary glue ceiling entry were restored by PLAN-glue-delete-database-grant solely to drain the orphaned aws_glue_catalog_database.ops left in tfstate by the 7b67e21d cleanse (Decision 178 clause 4 reconcile). Once that destroy has drained and the resource is out of state, no remaining HCL can reach any glue verb, so both entries become standing unused authority on a public-repo CI identity -- remove them at both layers." --acceptance "! grep -q GlueCatalog terraform/bootstrap/github_ci_apply_policy.tf && ! grep -q glue: terraform/bootstrap/github_ci_apply_boundary.tf"
    expected: a rec id is printed and the rec is queryable
    fix_if: >-
      A portal write that cannot reach the warehouse FAILS LOUD (Decision 84 I-4) -- re-file after
      restoring connectivity; never stage it in a local file.
test_obligations:
  - source: terraform/bootstrap/github_ci_apply_policy.tf
    behavior: >-
      GlueCatalog grants glue:DeleteDatabase across all four ARNs including
      userDefinedFunction/agent_platform/*, and grants none of the four create/update verbs.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_glue_catalog_grant_scope.py::TestGlueCatalogGrantScope::test_resource_set_is_exactly_the_four_arns
    red_green_expectation: >-
      Red before the edit (the Sid does not exist post-cleanse, so the lookup fails), green after.
  - source: terraform/bootstrap/github_ci_apply_boundary.tf
    behavior: >-
      The DataPlaneAllow ceiling grants glue so the identity grant is not silently denied, and athena
      stays absent (Decision 178 clause 2).
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_glue_catalog_grant_scope.py::TestGlueCatalogGrantScope::test_boundary_ceiling_permits_glue_and_excludes_athena
    red_green_expectation: Red before the ceiling edit (glue absent since 7b67e21d), green after.
  - source: docs/contracts/iam-simulate-fixture.yaml
    behavior: >-
      Both the database and userDefinedFunction triples are present, so the multi-resource-type leg is
      armed rather than inert and cannot be silently disarmed by deleting both rows.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_glue_catalog_grant_scope.py::TestGlueCatalogGrantScope::test_fixture_arms_both_resource_axes
    red_green_expectation: Red before the fixture edit (zero triples for the verb), green after.
  - source: scripts/checks/iam_tf/_write_companions.py
    behavior: >-
      Every identity Allow action -- not just iam: actions -- must be covered by the boundary ceiling;
      an action absent from the ceiling fails loud naming that action.
    verification_step: 2
    test_selector: tests/checks/iam_tf/test__write_companions.py::TestCheckIdentityIamActionsSubsetOfBoundary::test_non_iam_action_absent_from_ceiling_fails
    red_green_expectation: >-
      Red before the generalization (the iam-scoped check ignores a missing non-iam action), green after.
constraints:
  - No rescue agents or workaround loops (Decision 55) -- forward-fix only.
  - >-
    Decision 143 worst-verb scoping: restore ONLY the destroy-path verbs. Do not re-add
    CreateDatabase/UpdateDatabase/CreateTable/UpdateTable -- no remaining HCL can reach them.
  - >-
    Decision 177 clause 1: Decision 178's body is immutable. Use the blockquote_update form pinned by
    decision-entry.yaml's amendment_forms. Per AGENTS.md's Change-record content rule the annotation
    carries ONLY the clause-completion fact -- never the run id, byte measurements, or red-record state.
  - >-
    Decision 119: no local terraform init/plan for terraform/personal. Only terraform/bootstrap is
    planned locally, and only by the operator at VP step 7.
  - >-
    Decision 128 decompose-by-default. NEITHER scope Python file is registered in
    config/sloc_budgets.yaml, so both sit under the hard 500 default with no budget to raise:
    scripts/checks/iam_tf/_write_companions.py is at 454/500 (46 headroom) and
    tests/checks/iam_tf/test__write_companions.py at 475/500 (25 headroom). If either crosses,
    decompose -- the existing sibling tests/checks/iam_tf/test__write_companions_split_root.py is the
    precedent for the test file.
  - >-
    In-array comment rule (the boundary file's own rec-2882 note, which "cost a real debugging
    round"): a comment INSIDE the DataPlaneAllow Action array must contain NO square bracket of
    either kind and must not quote a bare star -- the checks parse the array with a non-greedy
    Field-equals-bracket regex, so one stray bracket truncates the parsed ceiling, and a truncated
    list ending in a wildcard makes EVERY boundary assertion pass vacuously. Put the
    intersection-hazard prose ABOVE the Sid line instead.
  - Restore glue only. athena stays deleted at both layers (Decision 178 clause 2).
context:
  - "Decision-scout verdict: FLAGS_FOUND (133 of 133 triaged). CITE: dec-156, dec-144, dec-177, dec-167, dec-180, dec-157, dec-132."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - "Scout flags resolved: dec-178 WARN -> clause-4 reconcile framing, time-boxed + annotation; dec-143 WARN -> narrow verb set; dec-129 WARN -> generalized ceiling check (scope row 4); dec-131 NOTE -> fixture negative probe stays a VP step, not a committed test."
  - "Routing adjudication (decision-entry.yaml significance rule): NOT a numbered Decision. Time-boxed to one drain with a removal rec whose oracle is the grant's own deletion; claimed by the operational_fact row. Decision 180 minted a number because it INVERTED a Decision 129 trigger -- a re-decision; this plan EXECUTES Decision 178 clause 4's already-sanctioned gated-apply branch and inverts nothing."
  - "Root cause: 7b67e21d (PR #969) deleted the glue HCL AND both IAM layers in one sweep, before the live resource was destroyed -- revoking the authority needed to make Decision 178 clause 2 true in AWS."
  - "Live state at planning: identity policy grants DeleteDatabase on catalog+database+table/* but NOT userDefinedFunction/*; boundary is still v6 WITH glue:* (bootstrap unapplied since the cleanse). Applying bootstrap as-is would revoke BOTH layers."
  - "Scope-creep check on row 4: the generalized check would NOT have caught 7b67e21d (that sweep removed both layers together, leaving no uncovered identity action, and the live grant was never in HCL). It guards the next-step risk this plan creates -- restoring one layer without the other -- and per-action beats service-prefix: a ceiling carrying only glue:GetDatabase would still flag glue:DeleteDatabase."
  - "aws_glue_catalog_database.ops is in tfstate at serial 195 holding three retired ops_* catalog entries. SoT for those tables is DuckLake-on-Neon, so the cascade delete is the intended outcome, not data loss."
  - "FALLBACK (operator-directed) if CI terraform provisioning is blocked: Decision 178 clause 4's other branch, terraform state rm aws_glue_catalog_database.ops. Three consequences established at planning: (a) PlatformAdmin simulates implicitDeny on glue:DeleteDatabase at both ARNs, so deleting the live database needs a separate operator-authorized PlatformAdmin grant; (b) without that, the live database and its three table entries persist unmanaged; (c) state rm does NOT itself write the record, so a Reconcile run is still needed afterwards -- but
    with the resource gone its replan carries no delete, so the guard PASSES and Reconcile auto-applies
    to green without a gated approval. Neither rec's acceptance oracle is satisfied on this branch -- close both as superseded."
  - "rec-3351 (filed this session, not bundled): terraform-apply-sandbox's acknowledge_red_commit input still claims to be the ONLY path to clear red -- false for any guard-routed replan since Reconcile subsumed that case. rec-3350 was filed earlier against deploy-paths.yaml on a mistaken premise and is declined: that contract named the right primitive all along."
  - "ci-rca deferral: rec-3292 (requirements.lock extras) and rec-3293 (pytz missing) are open ci_rca recs sharing no file, Decision, or failure category with this plan. Deferred deliberately -- both are dependency-manifest failures on main, unrelated to the IAM surface here."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (178, 180, 177, 167, 168, 157, 156, 144, 143, 132, 131, 129, 128, 119, 103, 92, 84, 77, 76, 70, 55, 48)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    terraform/bootstrap/github_ci_apply_policy.tf -- restore the GlueCatalog Sid with the eight
    destroy-path verbs (GetDatabase, GetDatabases, GetTable, GetTables, GetPartitions, GetTags,
    DeleteTable, DeleteDatabase) and four Resource ARNs (catalog, database/agent_platform,
    table/agent_platform/*, userDefinedFunction/agent_platform/*). Comment must say why the UDF ARN
    is present (AWS authorizes DeleteDatabase against the database's child ARNs) and that the grant
    is time-boxed to the drain.
  - >-
    terraform/bootstrap/github_ci_apply_boundary.tf -- add "glue:*" back to DataPlaneAllow. Put the
    intersection-hazard prose ABOVE the Sid line, never inside the Action array (see the in-array
    comment rule in constraints -- a bracket or bare star there silently voids every boundary assertion).
  - >-
    docs/contracts/iam-simulate-fixture.yaml -- add two allowed triples (database/agent_platform and
    a wildcard-free userDefinedFunction/agent_platform/<probe> ARN; build_triples rejects a literal
    wildcard in a target) and an amendment_log entry.
  - >-
