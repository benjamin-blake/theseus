execution_steps:
  - >-
    terraform/bootstrap/github_ci_apply_policy.tf -- restore the GlueCatalog Sid with the eight
    destroy-path verbs (GetDatabase, GetDatabases, GetTable, GetTables, GetPartitions, GetTags,
    DeleteTable, DeleteDatabase) and four Resource ARNs (catalog, database/agent_platform,
    table/agent_platform/*, userDefinedFunction/agent_platform/*). Comment must say why the UDF ARN
    is present (AWS authorizes DeleteDatabase against the database's child ARNs) and that the grant
    is time-boxed to the drain.
  - >-
    terraform/bootstrap/github_ci_apply_boundary.tf -- add "glue:*" back to DataPlaneAllow. Put the
    intersection-hazard prose ABOVE the Sid line, never inside the Action array (see the in-array
    comment rule in constraints -- a bracket or bare star there silently voids every boundary assertion).
  - >-
    docs/contracts/iam-simulate-fixture.yaml -- add two allowed triples (database/agent_platform and
    a wildcard-free userDefinedFunction/agent_platform/<probe> ARN; build_triples rejects a literal
    wildcard in a target) and an amendment_log entry.
  - >-
    scripts/checks/iam_tf/_write_companions.py -- drop the iam:-only filter from
    check_identity_iam_actions_subset_of_boundary so every identity Allow action is ceiling-checked
    per-action. Do NOT repurpose the _identity_allow_iam_actions helper -- its iam-only contract is
    pinned by test_collects_allow_iam_actions_only; add a sibling collector that DELEGATES to it for
    the iam: subset, so the helper keeps a production caller rather than becoming an orphan. Update the
    docstring honestly: the iam-only premise holds today and still holds after this plan (glue enters
    as a wildcard); the generalization is per-action defence against a FUTURE one-layer restore, NOT a
    repair of a premise the cleanse broke.
  - >-
    tests/checks/iam_tf/test__write_companions.py -- add both-direction cases for the generalized leg,
    and REWRITE the one incumbent the generalization invalidates:
    test_no_iam_actions_short_circuits_no_file_read (its s3:GetObject statement now reaches
    _load_boundary_actions against a monkeypatched empty ROOT and inverts to a failure). Leave
    test_collects_allow_iam_actions_only untouched -- it pins the iam-only helper, which the
    sibling-collector design does not modify. Measured blast radius: exactly one failing incumbent.
  - >-
    tests/checks/iam_tf/test__write_companions.py SLOC: at 475/500 with two new cases plus a rewrite,
    crossing 500 is the LIKELY outcome, not a contingency. Plan the split up front onto the existing
    sibling tests/checks/iam_tf/test__write_companions_split_root.py (Decision 128 -- decompose;
    neither file is registered, so no budget can be raised).
  - >-
    tests/checks/iam_tf/test_glue_catalog_grant_scope.py -- create the per-Sid resource-axis pin
    (mirror the _statement_blocks structure of test_platform_role_metadata_admin_scope.py), including
    the athena-absent-at-both-layers assertion.
  - >-
    scripts/ops/drain_glue_orphan.py -- the executable drain runbook. THREE phases, one operator
    invocation each: --phase remove (Reconcile dispatch), --phase converge (apply-sandbox
    acknowledge-and-retry), --phase close (bundled-rec closure plus the removal rec). Every phase
    does the same three things IN ORDER -- derive, assert, gate.
    DERIVE at runtime, never hardcode: the red commit SHA and record status, read from the
    convergence record at s3://agent-platform-data-lake/convergence/personal/sandbox.json; whether
    aws_glue_catalog_database.ops is still in tfstate; whether rec-3348 and rec-3328 are open or
    closed (that fluent decides BOTH that no rec_id may be passed to Reconcile --
    reconcile_target.validate_rec_id_open fails the dispatch on a CLOSED rec, and this plan's own
    Resolves trailer closes rec-3348 at merge -- and the close phase's verdict); and the id of the
    workflow run it just dispatched, captured from that dispatch rather than guessed from gh run
    list. Nothing the script acts on is a literal in its source.
    ASSERT by PARSING committed source, never by restating it, so each becomes a unit test instead
    of a critique finding: (a) .github/workflows/terraform-apply-sandbox.yml's gated-apply job
    carries github.event_name == 'push' and therefore cannot serve a routed destroy from a
    dispatch; (b) .github/workflows/reconcile.yml's gated-apply-reconcile carries no such
    condition (Decision 158, T2.37 c3); (c) terraform/bootstrap/authority_budget.json's
    in_budget_resource_types omits aws_iam_role, so a pending role diff ROUTES rather than
    auto-applying.
    GATE: refuse the phase and fail closed with a loud "world has moved -- re-assess" NAMING the
    fluent that moved, rather than proceeding on a stale assumption. In-repo precedent for the
    shape: .github/workflows/reconcile.yml lines 267-282 (its "no longer red -- clean no-op"
    recheck, which converts a moved world into a hard gate on every later step).
    Profiles differ by operation and must not be conflated: the S3 record read takes --profile
    (default agent_platform_admin); the close phase's portal calls use the agent_platform
    (PlatformDev) assume-role profile the portal itself requires. Under 500 SLOC or decompose
    (Decision 128) -- unregistered, so no budget exists to raise.
  - >-
    The removal-obligation rec that --phase close files carries the text the prose runbook used to
    hold inline: title "Remove the time-boxed glue drain grant now that
    aws_glue_catalog_database.ops has left state", file
    terraform/bootstrap/github_ci_apply_policy.tf, priority High, effort XS, risk low, source
    manual; context = both entries were restored SOLELY to drain the orphan the 7b67e21d cleanse
    left in tfstate (Decision 178 clause 4 reconcile), and once the resource is out of state no
    remaining HCL can reach any glue verb, so both become standing unused authority on a
    public-repo CI identity; acceptance = the grant's own deletion at BOTH layers,
    "! grep -q GlueCatalog terraform/bootstrap/github_ci_apply_policy.tf && ! grep -q glue:
    terraform/bootstrap/github_ci_apply_boundary.tf".
  - >-
    tests/ops/test_drain_glue_orphan.py (plus tests/ops/__init__.py -- every other tests/
    subpackage carries one) -- two classes. TestPhasePreconditions: each phase proceeds on a fresh
    world and fails closed on a moved one (record already green, orphan already out of state, a
    different red SHA, a bundled rec in the unexpected state), asserting on the NAMED fluent in the
    refusal rather than on exit status alone. TestWorkflowInvariants: each of the three assertions
    passes against the real committed file AND fails against a mutated copy -- a one-direction case
    is vacuous and is the failure mode step 7's fix_if calls out. No network and no warehouse write:
    stub the S3 read, the gh dispatch, and the portal call.
  - >-
    docs/DECISIONS.md -- append a blockquote_update annotation to Decision 178 recording that clause
    4's reconcile was taken via the gated-apply branch rather than state rm, and why.
  - >-
    Graduation bookkeeping (VP steps 1, 2 and 7 are graduate): write
    config/agent/verification_registry/entries/glue-catalog-grant-udf-resource-axis.yaml,
    identity-action-ceiling-coverage.yaml and drain-glue-orphan-preconditions.yaml at implement time. Not a scope row -- plan-obligations
    cannot express it -- but validate_graduation_completeness's implement-PR leg enforces it.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and
    RCA (Decision 55).
  - >-
    Commit with the Resolves trailer naming rec-3348 and rec-3328, then follow AGENTS.md Git-ops
    push -> PR -> CI -> merge. The PR body carries the DD-B routing line (AGENTS.md): "Routing:
    operational_fact -> time-boxed grant + removal rec; annotation on Decision 178, no new number."
    Hold the subscription through the operator apply (Decision 76 / CD.35).
  - 'Report: what was implemented, verification results, and the operator runbook for VP steps 8-12.'
rollback: >-
  The HCL change is additive and reversible by reverting the PR; nothing is applied at merge (this
  diff touches only terraform/bootstrap/**, which is outside terraform-apply-sandbox's
  terraform/personal/** path filter, and bootstrap is never auto-applied). If the live apply has
  already landed, re-applying the reverted bootstrap HCL removes the Sid and the ceiling entry --
  the same edit the VP step 12 removal-obligation rec schedules anyway. The destroy itself is not
  rolled back: once aws_glue_catalog_database.ops is destroyed, recreating it is out of scope (its
  SoT moved to DuckLake-on-Neon).
