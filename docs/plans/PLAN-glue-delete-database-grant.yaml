  - >-
    tests/checks/iam_tf/test__write_companions.py -- add both-direction cases for the generalized leg,
    and REWRITE the one incumbent the generalization invalidates:
    test_no_iam_actions_short_circuits_no_file_read (its s3:GetObject statement now reaches
    _load_boundary_actions against a monkeypatched empty ROOT and inverts to a failure). Leave
    test_collects_allow_iam_actions_only untouched -- it pins the iam-only helper, which the
    sibling-collector design does not modify. Measured blast radius: exactly one failing incumbent.
  - >-
    tests/checks/iam_tf/test__write_companions.py SLOC vs coverage -- two constraints, JOINTLY
    BINDING on this ONE file (see both the Decision 128 and the coverage-floor constraints). At
    475/500 with two new cases plus a rewrite, crossing 500 is the LIKELY outcome, not a
    contingency; but the naive remedy -- moving cases onto the existing sibling
    tests/checks/iam_tf/test__write_companions_split_root.py -- breaks the other constraint,
    because that sibling is never collected for _write_companions.py's coverage measurement and the
    source measures exactly 100% with ZERO slack.
    PRIMARY resolution, and the one to attempt first: KEEP every uniquely-covering case in
    tests/checks/iam_tf/test__write_companions.py -- above all the two NEW both-direction cases,
    which are the sole exercisers of the new sibling-collector lines -- and find the needed SLOC by
    TIGHTENING that same file: collapse duplicated fixture setup into a helper, fold near-identical
    cases into one parametrize, delete dead scaffolding. Never buy SLOC by moving a case that
    solely covers a line. Only a case whose every line is also covered by a surviving case may move
    to the sibling at all, and VP step 2's re-measure is what decides that, not inspection.
    FALLBACK, sanctioned but ONLY if tightening genuinely cannot fit the file: declare the SOURCE,
    scripts/checks/iam_tf/_write_companions.py, a concern-split monolith by adding it to
    _CONCERN_SPLIT_TEST_PACKAGES in scripts/test_coverage_checker.py, which re-resolves the
    measurement target to the test PACKAGE DIRECTORY tests/checks/iam_tf/_write_companions/ so
    every module in it is collected together. State the cost plainly: scripts/test_coverage_checker.py
    is NOT in this plan's scope, so the fallback ADDS A NEW SCOPE ROW (and relocates the test
    modules into that package directory) -- it is a SCOPE CHANGE to raise with the human before
    taking it, never something to do silently.
  - >-
    tests/checks/iam_tf/test_glue_catalog_grant_scope.py -- create the per-Sid resource-axis pin
    (mirror the _statement_blocks structure of test_platform_role_metadata_admin_scope.py), including
    the athena-absent-at-both-layers assertion.
  - >-
    scripts/ops/drain_glue_orphan.py -- the executable drain runbook, part 1 of 2 (structure and
    DERIVE). THREE phases, one operator invocation each: --phase remove (Reconcile dispatch),
    --phase converge (apply-sandbox acknowledge-and-retry), --phase close (bundled-rec closure plus
    the removal rec). Every phase does the same three things IN ORDER -- derive, assert, gate.
    DERIVE at runtime, never hardcode. (1) The red commit SHA and record status, from the
    convergence record at s3://agent-platform-data-lake/convergence/personal/sandbox.json -- REUSE
    scripts/ci/reconcile_target.py rather than reimplementing it: read_convergence_record(s3_client,
    bucket, key) and resolve_reconcile_target(record) already take their dependencies injected, so
    tests stub them without touching live AWS, and tests/test_reconcile_target.py already covers
    them. (2) Whether aws_glue_catalog_database.ops is still in tfstate. Decision 119 bars a local
    terraform init for terraform/personal and terraform/personal/backend-sandbox.hcl is a PARTIAL
    backend config, so do NOT shell out to terraform: read the state object DIRECTLY from S3 --
    read-only, no provider egress, no init -- with a boto3 s3 client get_object on bucket
    agent-platform-data-lake, key tfstate/personal/sandbox/terraform.tfstate, then json.load the
    response Body and look for a resources[] entry whose type ==
    "aws_glue_catalog_database" and name == "ops". Use the boto3 get_object form, NOT an
    aws s3 cp subprocess: it matches read_convergence_record's existing injected-s3_client seam and
    keeps the two S3 reads symmetric to stub. The object lives at the sandbox/ SUB-PREFIX (the
    key in backend-sandbox.hcl); tfstate/personal/terraform.tfstate does NOT exist. Route verified
    working this session against serial 195. Put that fetch behind its OWN injected seam (the same
    injected boto3 s3 client the record read already takes) so the unit tests
    stub it the same way they stub the record read. (3) Whether rec-3348 and rec-3328 are open or closed --
    reuse reconcile_target.validate_rec_id_open(rec_id, reader), whose reader is likewise injected.
    That fluent decides BOTH that no rec_id may be passed to Reconcile (validate_rec_id_open fails
    the dispatch on a CLOSED rec, and this plan's own Resolves trailer closes rec-3348 at merge) and
    the close phase's verdict. (4) The id of the workflow run it just dispatched. Neither
    gh workflow run nor the REST dispatch endpoint returns one (204, empty body, no Location
    header), and rec_id -- Reconcile's only correlation input -- must not be passed, so a BOUNDED
    gh run list query is the ONLY mechanism available and the script must use it deliberately rather
    than reject it as guesswork: record the dispatch timestamp itself, then query filtered on the
    Reconcile workflow AND --event workflow_dispatch AND created-after that timestamp, and FAIL
    CLOSED on more than one candidate. Never --limit 1 -- taking the newest row
    unconditionally is what would make it a guess. Zero candidates is NOT terminal on the first
    query: a workflow_dispatch run takes SECONDS to appear, so re-query the SAME bounded filter
    every 10 seconds up to a 3-minute window before zero becomes a verdict, and when it does,
    report DISPATCHED BUT NOT CORRELATED rather than a plain failure -- the run exists, only the
    correlation is missing. (5) Whether an EARLIER dispatch of this same phase is still in flight.
    The dispatch is an irreversible side effect that fires BEFORE correlation can fail, and
    re-entering --phase remove re-passes its preconditions (record still red, orphan still in
    state) and would dispatch a SECOND Reconcile run, leaving two parked on the ONE human
    tf-gated-apply approval this drain spends -- the only step that spends one. So before
    dispatching, query the same bounded filter for a dispatch-triggered Reconcile run in a
    NON-TERMINAL status and REFUSE to dispatch when one exists, printing its run id and resuming
    the WAIT against it. Nothing the script acts on is a literal in its
    source.
  - >-
    scripts/ops/drain_glue_orphan.py -- part 2 of 2 (ASSERT, GATE, WAIT). ASSERT by PARSING
    committed source, never by restating it, so each becomes a unit test instead of a critique
    finding. FOUR invariants: (a) .github/workflows/terraform-apply-sandbox.yml's gated-apply job
    carries github.event_name == 'push' and therefore cannot serve a routed destroy from a
    dispatch; (b) .github/workflows/reconcile.yml's gated-apply-reconcile carries no such condition
    (Decision 158, T2.37 c3); (c) terraform/bootstrap/authority_budget.json's
    in_budget_resource_types omits aws_iam_role, so a pending role diff ROUTES rather than
    auto-applying; (d) apply-sandbox re-plans FRESH at the dispatch ref -- the apply-sandbox job's
    checkout pins NO ref: (terraform-apply-sandbox.yml:113) and its fresh-plan step is gated
    if: success() && github.event_name == 'workflow_dispatch' (line 280). Invariant (d) is the whole
    premise of the converge phase: adding a ref: to that checkout, or regating that step, silently
    voids VP step 11 with nothing going red, which is precisely why it stops being prose.
    ALL FOUR PARSE STRUCTURED YAML/JSON -- never grep, never a substring test. Both naive strategies
    were measured INVERTING the verdict: a substring test for aws_iam_role against
    in_budget_resource_types (["aws_iam_role_policy", "aws_iam_role_policy_attachment"]) returns
    True, the OPPOSITE of the truth, because it matches the prefix of a longer type -- only exact
    list membership returns the correct False (a role diff routes BECAUSE the type is absent); and
    reconcile.yml line 31 is a COMMENT about apply-sandbox that itself contains
    github.event_name == 'push', so a file-level grep for event_name false-positives on the very job
    that genuinely lacks the condition. Decide (a), (b) and (d) from
    yaml.safe_load(...)["jobs"][<job name>]["if"] and that job's parsed step list; decide (c) from
    json.load plus exact list membership.
    GATE: refuse the phase and fail closed with a loud "world has moved -- re-assess" NAMING the
    fluent that moved, rather than proceeding on a stale assumption. In-repo precedent for the
    shape: .github/workflows/reconcile.yml lines 267-282 (its "no longer red -- clean no-op"
    recheck, which converts a moved world into a hard gate on every later step).
    WAIT: the remove phase's dispatched run parks on a HUMAN tf-gated-apply approval, and
    gh run view --log ERRORS on a run still in progress, so log-line absence is not a verdict until
    the run is terminal. Poll gh run view "$RID" --json status,conclusion every 30 seconds up to a
    60-minute overall timeout, and report FOUR distinct outcomes rather than two: still running /
    timed out awaiting approval (NOT decisive, never grounds for the state rm fallback); DISPATCHED
    BUT NOT CORRELATED, when the bounded correlation window expired with zero candidates or returned
    more than one (also NOT decisive and NEVER grounds for the fallback -- it prints the recorded
    dispatch timestamp and the exact gh run list filter so the operator finds the run by hand, and
    says explicitly not to re-invoke the phase); terminal
    WITH the Destruction-complete line (drained); terminal WITHOUT it (the only case that grounds
