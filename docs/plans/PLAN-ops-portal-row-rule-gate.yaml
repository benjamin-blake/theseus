- step: 8
  phase: pre-deploy
  action: The census-to-engine agreement test still agrees after the portal pattern helper is gone.
  command: bin/venv-python -m pytest tests/test_contract_rule_census_duckdb.py -q
  expected: Exit 0.
  fix_if: Fix the re-pin.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: Live census through the DQ harness -- no stored row violates a rule the update gate evaluates (undated rules bind every row).
  command: bin/venv-python -m scripts.contract_rule_census
  expected: Exit 0; every compiled rule prints 0 violators with PASS.
  fix_if: A violator -> STOP, do not merge, return to /plan. Exit 2 -> the reader is unavailable; never treat it as clean.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: Assert the ground for NO data-pipeline redeploy despite touching its packaged roadmap asset.
  command: >-
    grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q 'ROADMAP-PLATFORM'
    .github/workflows/deploy-prod-lambdas.yml && git diff --quiet "$(git merge-base HEAD origin/main)" -- config/lambda
    src/common src/lambdas src/row_rules src/telemetry terraform && echo INERT_OK
  expected: Exit 0 and INERT_OK printed.
  fix_if: A packaged diff -> it does not belong in this plan; revert it. Schedules re-enabled -> the governed deploy-prod-lambdas workflow, never a local deploy.
