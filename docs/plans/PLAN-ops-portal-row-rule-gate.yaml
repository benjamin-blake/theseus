    backstops only. amendment_log entry; updated_by. Every anchored phrase kept.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    PC-05 (status accepted, owning_item dec-210): the ducklake work_item_storage adapter's pre-check imports the
