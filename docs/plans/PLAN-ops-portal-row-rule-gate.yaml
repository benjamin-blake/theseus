constraints:
- No Lambda-packaged file and no generated projection changes (step 10); the writer stays the authority.
- The pre-check calls the writer's functions; it never re-implements a rule, and on update never evaluates a dated rule.
- No assertion is weakened; every removed validator, test entry, check leg and registry row maps to a surviving node (steps 4-6; Decision 181 cl.1); retired rows move to entries/deprecated/ (Decision 176).
- No pre_glob is dropped (Decision 187); no budget raised (Decisions 128, 166).
- The build amends a Class A contract and annotates Decision 65, so its merge waits for the operator's word.
- >-
  Every node a graduated registry row names inside a test file this plan scopes keeps its file and name and is
  re-pinned in place, never moved or weakened (Decision 181 cl.1), except the seven rows moved to entries/deprecated/
  (their guard symbols are deleted) and the two re-pointed rows above.
- No rescue agents or workaround loops (Decision 55).
