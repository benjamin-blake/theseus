execution_steps:
- >-
  Confirm the precondition: git fetch -q origin main && git cat-file -e origin/main:scripts/checks/contracts/_ops_rule_bindings.py
  && git grep -q validate_write_time_enforcement_conformance origin/main -- scripts/checks/contracts/_manifest.py && echo
  BUILD_ON_MAIN. Not on main: stop and wait; both builds rework the rule-source bindings.
- Write the red tests first (steps 1-6) and confirm each fails on the unchanged tree.
- The shared reader-shaped rec fixture; then gate_write and the producer-side handlers in write_validators.py; then the call sites (file_rec, update_rec, file_decision, update_decision); then delete the loader, builders and explicit validators and the facade re-exports.
- ops.yaml, the decisions manifest prose, the compiler, the bindings leg; the registry moves (git mv) and re-points.
- Records -- the contract prose, data-modeling-standard, ports.yaml, the Decision 65 update, decisions-index, T2.29 c5.
- Execute Verification Plan steps 1-11 -- loop until pass (Decision 55).
- Write the registry rows for the graduated steps (1-6).
- >-
  CLOSURE: readiness, implementation_declared true, rebase, step 11, postflight evidence, push, PR, subscribe. On green
  CI and code review PROCEED, STOP and ask the operator for the merge (Class A contract prose and a Decision update).
  On his word squash-merge with `Resolves: rec-4158, rec-3217, rec-2801` in the body; then file close proposals
  (propose_or_close_rec, deterministic False) for rec-746, rec-2807, rec-759 (superseded) and rec-2805 (contradicted)
  for the operator to confirm; run step 12.
- 'Report: what was implemented, verification results'
rollback: >-
  Revert the squash commit: the portal returns to the ops.yaml loader, which the reverted ops.yaml feeds again. No
  Lambda, projection or warehouse row changes in either direction; the writer enforced every rule throughout.
