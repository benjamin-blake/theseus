schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-portal-row-rule-gate
intent: >-
  rec-4158 (Decision 210), its closing plan: the agent-side ops portal stops carrying its own copy of the rules.
  file_rec, update_rec, file_decision and update_decision run the DuckLake writer's own pure gate (schema_gate and
  check_write) over the field_semantics.yaml the writer ships, as a fail-fast pre-check that can never drift from the
  writer and is never authoritative. Inserts evaluate every rule; updates evaluate only undated rules, so the pre-check
  can never be stricter than the writer. The two rules no writer can run (acceptance lint, dependency existence) stay
  portal-side, driven by the contract's own exemptions. config/agent/data_quality/ops.yaml loses its write-time role:
  its write_time flags and the five portal-only test entries go, and what remains is a DQ backstop never stricter than
  the contract. Closes T2.29 c6 and rec-4158.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V2
plan_path: docs/plans/PLAN-ops-portal-row-rule-gate.yaml
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 cl.3 single source, applied to the portal); closes T2.29 c6 (the write-time
  validator registry repointed to the Class A contract's declared rules) and re-grounds T2.29 c5's wording.
scope:
# --- the portal -----------------------------------------------------------------------------------------------------
- file: scripts/ops_portal/write_validators.py
  action: Modify
  purpose: >-
    Rewritten in place (the ops_recommendations contract names this path as the acceptance_lint exemption owner, and
    the projection ships that owner, so the path must not move). Deleted: _load_write_time_validators, its cache, the
    _WRITE_TIME_VALIDATOR_BUILDERS map and every builder, _check_not_null, _validate_file_path,
    _validate_context_length and _OPS_YAML_PATH. Kept: _rec_exists and its positive memo (one reader per write,
    Decision 88). New gate_write(table, record, *, existing=None): projects the record exactly as the transport does
    (writer_transport._project_ops_record), then calls the writer's own schema_gate and
    src.common.ducklake_write_rules.check_write against resolve_table_spec(table) over the repo's
    config/lambda/ducklake/field_semantics.yaml. An insert (existing None) evaluates every rule with prior None and the
    minted columns set as file_scd2 sets them (a placeholder merge key "<entity_id_prefix>0" when the writer
    allocates it). An update evaluates only the undated rules -- the projection's columns with every leg named in
    their exclude_before removed -- with prior None and created_timestamp parsed from the existing row (tz-aware), so
    every rule it evaluates binds identically in the writer (src/row_rules/rules.py _binder: an undated rule always
    binds) and dated rules stay the writer's alone: never stricter than the writer, by construction. A rejection
    raises RowRuleRejected(ValueError) naming table, column, rule, the declared limit in words (min_length "at least
    N stripped characters", accepted_values "one of [...]", pattern and array_element_format the pattern, not_null
    "is required") and exclude_before -- never the value; a schema-gate failure raises ValueError with the gate's own
    message. Then the producer-side rules, driven by RowRules.producer_exemptions (column, kind): a handler map
    {acceptance_lint: lint_acceptance_command with require_discrimination, array_element_reference: _rec_exists}; on
    update a handler runs only when the column's value differs from the existing row; an exempt kind with no handler
    fails closed. Module docstring: a derived pre-check, never authoritative; the writer re-evaluates every rule
    (Decision 81 cl.5 as widened by Decision 210 cl.5).
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: >-
    file_rec: the ops.yaml loop and the explicit _validate_file_path/_validate_context_length calls become one
    gate_write("ops_recommendations", fields) after _derive_computed_fields and the ci_rca branch;
    validate_source stays (it reads the source registry itself, the same source the contract references, and names
    the registered values). The private _migration_mode parameter is retired (no non-test caller; with the writer
    enforcing every rule on insert it promised a bypass that no longer exists). update_rec: the restated
    _VALID_STATUSES fast-fail, the loop and _UPDATE_CONTENT_VALIDATED_FIELDS go; gate_write("ops_recommendations",
    merged, existing=existing) runs before Recommendation.model_validate, so a rejection names the contract rule;
    assert_closure_obligation and assert_acceptance_verdict stay the last checks before the write (Decisions 186,
    201). The facade stops re-exporting the deleted names. Net SLOC falls (488 of 500 today).
- file: scripts/ops_portal/decisions.py
  action: Modify
  purpose: >-
    file_decision's loop becomes gate_write("ops_decisions", record); update_decision gains gate_write("ops_decisions",
    merged, existing=existing) before Decision.model_validate. Behaviour today is unchanged (ops_decisions declares
    only not_null on nullable false columns, which the writer already enforces).
- file: scripts/checks/ci_guards/validate_ops_portal_patch_targets.py
  action: Modify
  purpose: The roster of names file_decision resolves in scripts.ops_portal.decisions drops _load_write_time_validators and gains gate_write.
# --- ops.yaml loses its write-time role ------------------------------------------------------------------------------
- file: config/agent/data_quality/ops.yaml
  action: Modify
  purpose: >-
    Every `write_time:` key is deleted, and so are the five test entries only the portal ever read (the DQ compiler
    never compiled them): title min_length, file path_syntax, context min_length (its compiled LENGTH(TRIM(context))
    >= 80 expression stays), acceptance acceptance_lint, dependencies array_element_format and
    array_element_reference, tags array_element_format. The header names every remaining ops_recommendations test that
    restates a contract rule as a DQ backstop of the writer's enforcement (Decision 210; the Class A contract is the
    rule source; T1.6 c7 retires this file). Prose that names write_validators.py, _validate_file_path,
    _validate_context_length or validate_source as the enforcer now names the contract and the writer, keeping the
    meaning get_rec_write_guidance serves (Decision 66; T2.29 c7 still owns repointing guidance).
- file: config/agent/data_quality/decisions/ops_recommendations.yaml
  action: Modify
  purpose: >-
    The dependencies and tags current_test lines name the contract rule enforced by the writer (no DQ test). Net
    line count unchanged or lower (522 of 522, Decision 166).
- file: scripts/data_quality_compile.py
  action: Modify
  purpose: >-
    _WRITE_TIME_ONLY_TEST_TYPES and its skip are removed, so any of those five test types now raises as an unknown
    test type: no write-time test can return to a DQ file.
- file: scripts/checks/contracts/_ops_rule_bindings.py
  action: Modify
  purpose: >-
    Created by the rule declarations build. The two-way ops.yaml write_time parity leg (vacuous once the flags are gone) is replaced by: (i) no `write_time` key
    anywhere in ops.yaml; (ii) DQ is never stricter than the contract -- an ops_recommendations accepted_values test's
    values are a subset of the contract's, a not_null test sits only on a column the contract declares not_null, and a
    DQ exclude_before is never earlier than the contract leg's date. No pre_glob is dropped (Decision 187).
