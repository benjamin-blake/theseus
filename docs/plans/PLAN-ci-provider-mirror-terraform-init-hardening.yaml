rollback: >-
  Fully revertible by reverting the squash-merge commit. The ci.yml steps are additive and fail open,
  so reverting restores today's direct-fetch behaviour with no cleanup. The IAM statement is
  read-only and additive: reverting it removes the grant via the same in-budget auto-apply path, and
  the PR leg simply resumes degrading fail-open. No data migration, no state surgery, and nothing in
  the canonical S3 mirror is written or deleted by this change -- it is a read-only consumer.
