  command: awk '/^## Decision 197:/,/^## Decision 196:/' docs/DECISIONS.md | grep -qF 'T4.23:c14'
  expected: Exit 0.
  fix_if: The annotation is absent, landed outside Decision 197's span (e.g. after the --- separator), or was wrapped -- it must be ONE physical line. Never widen the awk slice.
