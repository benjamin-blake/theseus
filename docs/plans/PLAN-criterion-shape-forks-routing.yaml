- step: 7
  phase: pre-deploy
  action: 'Annotation shape: exactly one single-line D197 annotation <= 1,100 bytes placed after the Decision 200 blockquote; exactly one single-line D48 annotation between Limitation and Decision status, citing a real rec id and the schema_version-2-only caveat; no amends/supersedes wording in either.'
  command: 'bin/venv-python -c "import pathlib, re; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); s=t[t.find(''## Decision 197:''):t.find(''## Decision 196:'')]; a=re.findall(r''^\[Amendment 2026-09-26, audit criterion-shape-forks-9d25d918: .*\]$'', s, re.M); assert len(a) == 1, len(a); nb=len(a[0].encode()); assert nb <= 1100, nb; assert s.find(a[0]) > s.find(''> **Amended by Decision 200''), ''D197 placement''; m=t[t.find(''## Decision 48:''):t.find(''## Decision 44:'')]; b=re.findall(r''^\[Amendment 2026-09-26, audit criterion-shape-forks-9d25d918 Q2: .*\]$'', m, re.M); assert len(b) == 1, len(b); assert ''rec-3285'' in b[0] and ''schema_version-2 plans only'' in b[0], ''D48 content''; assert m.find(''**Limitation:**'') < m.find(b[0]) < m.find(''**Decision status:**''), ''D48 placement''; assert not re.search(r''(?i)(amends|supersedes)\s+decision'', a[0] + b[0]), ''edge wording''; print(''annotations OK; D197 annotation bytes'', nb)"'
