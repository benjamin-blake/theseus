acceptance_criteria:
- 'Three recs are filed sequentially through the portal with the verbatim fields in execution_steps: 1a (new-names marker list), 1b (evidence/quarantine columns, dependencies = [the real id of 1a]), 1c (audit-prompt grounding-map section); portal-derived automatable is false on all three; 1a/1b carry tag clause-8-prerequisite and the context prefix ''Clause-8 prerequisite of T4.23 (Decision 197 clause 8)''; priorities Low/Low/Medium. No rec is filed for the tier-floor gap: existing open Medium rec-3285 owns it.'
- 'rec-3660, rec-3265 and rec-3285 are updated fetch-before-update: each stored context is preserved verbatim with exactly the specified addendum appended; no status, priority or acceptance change.'
- T4.23 carries c8-c14 verbatim with the real rec ids substituted for <1a>/<1b>, c1-c7 unchanged, and related_decisions includes 197.
- T3.7 criteria are structured c1-c6 with byte-identical text except c2's single appended rec-3719 sentence, plus c7 (CSF-07); T4.5 criteria are structured c1-c7 byte-identical plus c8 (CSF-08) and related_decisions [87, 197]; no criterion id anywhere is renumbered; the roadmap is <= 9,500 lines.
- 'Decision 197 carries exactly one single-line ''[Amendment 2026-09-26, audit criterion-shape-forks-9d25d918: ...]'' annotation of <= 1,100 bytes after the Decision 200 blockquote; Decision 48 carries exactly one single-line ''[Amendment 2026-09-26, audit criterion-shape-forks-9d25d918 Q2: ...]'' annotation between its Limitation paragraph and its Decision status line, citing rec-3285; no supersession edge is minted from 48 or 197 and the decisions index is current.'
- Both registry shards are admitted by validate_verification_registry's differential gate in the full tier.
- 'rec-3719 closes via the squash-merge Resolves: rec-3719 trailer (acceptance-gated, Decision 201).'
- Every audit finding CSF-01..CSF-08 has exactly one destination, per the Dispositions line in context.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Read back the three filed recs through the reader (title-prefix sweep, then rec_by_id): exactly one open row each, automatable false (F5d), 1b depends on 1a, 1a/1b carry the discovery marker, priorities as ruled, T4.23 cites the real ids, and Decision 48''s span (not the whole file) cites rec-3285.'
  command: 'bin/venv-python -c "import pathlib, yaml; from src.common.ducklake_reader_client import make_reader; from scripts.ops_data_portal import _fetch_rec_from_reader as f; r=make_reader(); q=lambda p: [f(x[''id'']) for x in r.named(''recs_by_title_prefix'', title_prefix=p + ''%'') if x.get(''status'') == ''open'']; a, b, c=(q(p) for p in (''Clause-8 prerequisite (T4.23): mark'', ''Clause-8 prerequisite (T4.23): consolidated'', ''Audit-prompt skill: add a storage incumbents'')); assert [len(a), len(b), len(c)] == [1, 1, 1], [len(a), len(b), len(c)]; a, b, c=a[0], b[0], c[0]; assert all(x[''automatable''] is False for x in (a, b, c)), ''automatable''; assert b[''dependencies''] == [a[''id'']], b[''dependencies'']; assert all(x[''context''].startswith(''Clause-8 prerequisite of T4.23 (Decision 197 clause 8)'') and ''clause-8-prerequisite'' in x[''tags''] for x in (a, b)), ''discovery marker''; assert [x[''priority''] for x in (a, b, c)] == [''Low'', ''Low'', ''Medium''], ''priority''; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'', encoding=''utf-8'')); t={k[''id'']: k[''text''] for k in [i for i in d[''tier_items''] if i[''id''] == ''T4.23''][0][''exit_criteria'']}; assert all(a[''id''] in t[k] for k in (''c10'', ''c13'', ''c14'')) and all(b[''id''] in t[k] for k in (''c8'', ''c9'', ''c11'', ''c14'')), ''T4.23 rec citations''; s=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); m=s[s.find(''## Decision 48:''):s.find(''## Decision 44:'')]; assert ''rec-3285'' in m, ''D48 span does not cite rec-3285''; print(''recs OK'', a[''id''], b[''id''], c[''id''], ''+ D48 cites rec-3285'')"'
  expected: Prints 'recs OK' followed by the three rec ids and '+ D48 cites rec-3285'.
  fix_if: A count other than 1 means a filing failed or duplicated -- sweep recs_by_title_prefix before any re-file and supersede a duplicate via update_rec (never delete). A citation failure means the <1a>/<1b> placeholders were not substituted with the ids the writer returned, or the Decision 48 annotation landed outside its span.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'Read back rec-3660, rec-3265 and rec-3285: original context preserved (prefix), addenda present, status still open (rec-3285 still Medium).'
  command: 'bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; c=f(''rec-3660''); t=c[''context'']; assert c[''status''] == ''open'' and t.startswith(''Deferred by PLAN-roadmap-touched-item-spans-and-regrowth-guard''), ''rec-3660 base context lost''; miss=[s for s in (''407 bare'', ''394 structured'', ''259 bare on 57 complete'', ''1.140'', ''6.525'', ''9,925 -> 10,739'', ''cA-cF'', ''ten off-position'', ''pin-at-migration-time'', ''option (c)'') if s not in t]; assert not miss, miss; d=f(''rec-3265''); u=d[''context'']; assert d[''status''] == ''open'' and u.startswith(''Stock-side companion'') and u.rstrip().endswith(''D48: annotated 2026-09-26 (PLAN-criterion-shape-forks-routing) -- caveated, floor covers schema_version-2 plans only''), ''rec-3265''; g=f(''rec-3285''); v=g[''context'']; miss=[s for s in (''_MIN_NEW_PLAN_SCHEMA_VERSION = 5'', ''7 of 474'', ''199 schema_version 3-5'', ''PLAN-commit-signing-false-positive'', ''PLAN-decision-37-migrate-then-rehome'', ''PLAN-telemetry-kernel-identity-append'') if s not in v]; assert g[''status''] == ''open'' and g[''priority''] == ''Medium'' and v.startswith(''validate_tier_floor.py:83 skips every plan'') and not miss, (''rec-3285'', miss); print(''rec updates OK'')"'
  expected: Prints 'rec updates OK'.
  fix_if: A lost prefix means update_rec was called with a replacement rather than stored-context + addendum -- restore it from the fetch output captured before the write, then re-append.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: 'Roadmap carriers: T4.23 c8-c13 carry CSF-01..06 in the Forward-work grammar, c14 carries the calendar-prefix correction and rec-4068, T3.7 c7/c2 and T4.5 c8 carry CSF-07/rec-3719/CSF-08, no bare string remains on the three items, and 197 is in both related_decisions lists.'
  command: 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'', encoding=''utf-8'')); it={i[''id'']: i for i in d[''tier_items'']}; t=lambda i, c: [x[''text''] for x in it[i][''exit_criteria''] if isinstance(x, dict) and x.get(''id'') == c][0]; assert all((''Forward work (audit 9d25d918 CSF-0%d'' % n) in t(''T4.23'', ''c%d'' % (n + 7)) for n in range(1, 7)), ''T4.23 c8-c13''; assert ''rec-4068'' in t(''T4.23'', ''c14'') and ''year/month/day(created_timestamp)'' in t(''T4.23'', ''c14''), ''T4.23 c14''; assert ''CSF-07'' in t(''T3.7'', ''c7'') and ''validate_red_case_floor'' in t(''T3.7'', ''c2''), ''T3.7''; assert ''CSF-08'' in t(''T4.5'', ''c8''), ''T4.5''; assert not [c for i in (''T3.7'', ''T4.5'', ''T4.23'') for c in it[i][''exit_criteria''] if isinstance(c, str)], ''bare strings remain''; assert 197 in it[''T4.23''][''related_decisions''] and 197 in it[''T4.5''][''related_decisions''], ''related_decisions''; print(''carriers OK'')"'
  expected: Prints 'carriers OK'.
  fix_if: An IndexError means a criterion id is missing; an assertion names the failing carrier. Fix the roadmap text, never the assertion.
