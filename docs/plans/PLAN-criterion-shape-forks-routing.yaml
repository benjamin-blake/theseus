- step: 4
  phase: pre-deploy
  action: 'Id-pin proof against origin/main: every pre-existing criterion of T3.7, T4.5 and T4.23 keeps its (positional or authored) id, status and byte-identical text -- the one sanctioned difference is T3.7 c2''s appended ''. Adjacency (rec-3719): ...'' sentence -- and the counts grow by exactly 1/1/7.'
  command: 'bin/venv-python -c "import subprocess, yaml; B=yaml.safe_load(subprocess.run([''git'', ''show'', ''origin/main:docs/ROADMAP-PLATFORM.yaml''], capture_output=True, text=True, check=True).stdout); H=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'', encoding=''utf-8'')); g=lambda d, i: [x for x in d[''tier_items''] if x[''id''] == i][0][''exit_criteria'']; n=lambda cs: [c if isinstance(c, dict) else {''id'': ''c%d'' % (k + 1), ''text'': c, ''status'': ''open''} for k, c in enumerate(cs)]; ok=lambda i, b, h: isinstance(h, dict) and h[''id''] == b[''id''] and h.get(''status'', ''open'') == b.get(''status'', ''open'') and (h[''text''] == b[''text''] or ((i, b[''id'']) == (''T3.7'', ''c2'') and h[''text''].startswith(b[''text''] + ''. Adjacency (rec-3719): ''))); bad=[(i, b[''id'']) for i in (''T3.7'', ''T4.5'', ''T4.23'') for b, h in zip(n(g(B, i)), g(H, i)) if not ok(i, b, h)]; assert not bad, bad; got=[len(g(H, i)) for i in (''T3.7'', ''T4.5'', ''T4.23'')]; want=[len(g(B, ''T3.7'')) + 1, len(g(B, ''T4.5'')) + 1, len(g(B, ''T4.23'')) + 7]; assert got == want, (got, want); print(''id pins OK'', got)"'
  expected: Prints 'id pins OK [7, 8, 14]'.
  fix_if: 'A listed (item, id) pair means a text drifted (retype hazard) or an id was renumbered -- copy the text from origin/main verbatim. PR-relative: excluded from replay once the base collapses post-merge (vp-red-before implement_leg_partition).'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time identity-preservation proof against the moving origin/main baseline; once merged the baseline equals HEAD and the comparison is vacuous, and step 3's graduated guard carries the durable half (the carriers stay structured and present).
  expected_literals:
  - id pins OK [7, 8, 14]
- step: 5
  phase: pre-deploy
  action: Run the four named guards -- validate_platform_roadmap, validate_decision_entry_conformance, validate_decisions_index_freshness, validate_supersession_annotations -- and assert no supersession edge originates in Decision 48 or 197.
  command: bin/venv-python -c "import importlib; from pathlib import Path; from scripts.checks.decisions.validate_supersession_annotations import extract_supersession_edges; f=[]; [getattr(importlib.import_module(m), m.rsplit('.', 1)[1])(f) for m in ('scripts.checks.roadmap.validate_platform_roadmap', 'scripts.checks.decisions.validate_decision_entry_conformance', 'scripts.checks.decisions.validate_decisions_index_freshness', 'scripts.checks.decisions.validate_supersession_annotations')]; assert not f, f; x=[e for e in extract_supersession_edges(Path('.')) if e[0] in (48, 197)]; assert not x, x; print('four guards OK; no edge minted from 48 or 197')"
  expected: Four PASS blocks (stale-waiver WARNs are pre-existing) then 'four guards OK; no edge minted from 48 or 197'.
  fix_if: 'Index drift: run bin/venv-python -m scripts.decisions_index --write and commit the result (it is in scope). An edge from 48/197 means annotation wording matched _EDGE_RE -- reword; never add a waiver.'
