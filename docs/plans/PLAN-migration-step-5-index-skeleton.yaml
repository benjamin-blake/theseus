    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND, 125 of 125
    triaged. CITE: Decision 166, Decision 160, Decision 146, Decision 134 clause 2, Decision
    152, Decision 128, Decision 150, Decision 167, Decision 48, Decision 132. RELATED: Decision
    149, Decision 131, Decision 165, Decision 127, Decision 105, Decision 168. Decision 168
    (Class D contracts) is load-bearing rather than merely related: it makes
    docs/contracts/decision-entry.yaml a Class D mechanism contract with declared evaluator
    validate_decision_entry_conformance, whose clause-2 obligation is file-level evidence of
    reading rather than per-key, so adding index_max_bytes does not breach it -- and VP step
    3's contract-to-constant pin exceeds the incumbent "the validator constants are the SoT,
    the contract documents" precedent the two sibling ceilings settle for.
  - "gates: decision-scout=FLAGS_FOUND (4 flags, all resolved); plan-critique=PROCEED after 4 round(s)"
  - >-
    MEASURED ARITHMETIC (this tree, indent=2 pretty-printed bytes, 152 rows = 125 live + 27
    archive). Committed index today 119,189 B. Live rows cost 99,485 B = 795.88 B/row; archive
    rows cost 19,617 B = 726.56 B/row; the same 27 rows as skeletons cost 7,795 B = 288.70
    B/row. Reclaim 11,822 B; regenerated index 107,367 B. The audit's G22 finding (27 dead rows
    carrying 17.8% of excerpt characters, averaging 292 chars each) re-measures at 17.1% --
    7,879 of 46,194 excerpt characters, average 291.8 -- the drift is live-corpus growth since
    the audit's base commit, not an error in the finding.
  - >-
    PIN DERIVATION AND THE 120-VS-132 RULING (operator decision). The pin is re-derived at the
    120-header TARGET, not the 132-header enforced constant: 120 x 796 + 54 x 289 = 111,126,
    rounded up to 112,000 for measurement variance (the same round-up-to-a-clean-thousand step
    Decision 166 point 9 applied to 130,884 -> 131,000). Deriving at 132 would have yielded
    120,678 -> 121,000. Note what 120 actually is: it is the only RATIFIED header ceiling
    (Decision 134 clause 2, restated unchanged at Decision 160 point 4). 132 is unratified
    bridge state carried by PLAN-decision-ceiling-bridge's recorded human override of a
    decision-scout BLOCK, with no numbered Decision behind it. So deriving at 120 is consistent
    with ratified governance and inconsistent only with a transitional constant -- not the
    reverse. The operator chose it knowing the consequence, which is a TWO-entry window, not
    one: from the regenerated 107,367 B at 795.88 B per live row, the pin fails at +6 entries
    (112,142 B) while the header ceiling still passes at +7 (132 headers) and fails only at +8,
    so across +6 and +7 the byte pin is the first and only guard to fire. That is intended. The
    132 raise was instrumental (it bought room to author the governance entries that stop
    unbounded growth), the operator is steering back to 120, and a pin derived at 120 encodes
    the target state rather than the transitional allowance: once the corpus is back at 120
    live it has about 9 entries of slack and stops binding. Deriving at 132 would bank the
    bridge's temporary raise permanently into the pin, which the operator declined. THE
    ARCHIVE-SIDE PATH, recorded because only the live-side one is obvious: in the operator's own
    steady state (hold live at 120, archive the overflow) each archival still nets +288.70 B of
    permanent skeleton weight, so from a 120-live / 32-archive position the roughly 7,200 B of
    slack is about 25 archivals before the pin binds from the ARCHIVE side instead. At that
    point constraint 4 forbids a raise and the edge-graph argument below forbids deleting
    archive rows, so the only remaining lever is the one OPERATOR FORWARD INTENT already names:
    entries leave the corpus entirely rather than moving into the archive.
  - >-
    OPERATOR FORWARD INTENT (the reason the tight pin is safe). The plan of record for
    reclaiming headroom is to collapse existing Decisions and their h2 headers into
    docs/contracts/*.yaml -- or simply remove entries that no longer govern -- rather than to
    raise any ceiling. This is the same direction platform tier_item T2.56 describes at the
    structural level and the same lever Decision 146 archival provides at the entry level. The
    pin will NOT be raised; if it binds, entries come out.
  - >-
    WHY THIS UNBLOCKS THE ARCHIVAL WAVE (the plan's actual payoff). Before this change, moving
    one entry from live to archive changed the index by -796 + 727 = -69 bytes, effectively
    inert -- which is why audits/contract-first-governance-33c8667.yaml:722 records archival as
    leaving "index rows full-weight". After it, the same move is -796 + 289 = -507 bytes, a
    7.3x improvement. Archival becomes the single lever that relieves the header ceiling AND
    the index pin together, which is exactly what migration step 6 needs and what its stated
    blocker ("Steps 1 and 5") was waiting on.
  - >-
    THE BRIDGE HANDOFF THIS PLAN DISCHARGES. PLAN-decision-ceiling-bridge recorded, knowingly:
    "At 132 live rows that derivation yields 140,052, over the pin... Any header ceiling above
    120 breaks that derivation... A future archival wave taking the archive past roughly 40 rows
    will need the pin re-derived alongside rec-3012." Its HANDOFF section names
    tests/test_decisions_index.py's derivation as "left deliberately stale by this plan, for
    that audit to reconcile". Two passages must therefore be reconciled there, not one: the
    live term of 120 x 764 and its 130,884 total (now arithmetically false), AND the separate
    note that the header ceiling is "binding within ONE more live entry" at 119/120 (now 125 of
    132). The same handoff list names docs/contracts/decision-entry.yaml's Decision 134
    attribution, which execution step 8 corrects.
  - >-
    CONSUMER SWEEP (the audit's own step-5 abort criterion, "Abort if skeletonization breaks a
    scout consumer that reads archived excerpts... verify at build"). The change was SIMULATED
    against the pre-change tree by monkeypatching build_index() and rewriting the committed
    artifact in a throwaway run: exactly 10 tests fail. Six in
    TestTriageExcerptIntegration (test_every_entry_carries_the_three_fields,
    test_no_excerpt_exceeds_320_chars, test_non_empty_excerpt_always_names_a_source,
    test_empty_excerpt_set_matches_independent_rederivation, test_excerpt_coverage_is_high,
    test_truncated_flag_matches_source_text_length); two in TestCategoryTagsIntegration
    (test_category_tags_is_sorted_and_deduped_for_every_entry,
    test_every_entry_carries_a_list_of_strings); TestDeterminism::
    test_entry_shape_is_the_stable_projection_only; and TestCuratedRetrievalProbes::
    test_each_probe_discriminates_to_its_expected_entry. Across the three modules VP step 5
    runs, the pre-change baseline is 72 passed and the simulated post-change split is 10 failed
    / 62 passed. No PRODUCTION consumer breaks:
    .claude/skills/decision-scout/SKILL.md triages live entries only (Phase 1 derives M from
    live:true; Phase 2 shortlists live entries) and already treats archived rows as out of
    scope by currency-key absence, and tests/esb_text_fix/test_persona_routing_rationale.py
    reads the dropped fields only for Decision 164, which is live.
  - >-
    SLOC BUDGET for tests/test_decisions_index.py (487/500 today; the file is the plan's
    tightest constraint and the budget is the plan, not a fallback). Add a module-level
    _live_rows(idx) helper (+2) and route the nine live-assuming assertions through it (+0 each,
    since they are single-line `for entry in idx["decisions"]:` heads). Two need more than the
    helper: test_empty_excerpt_set_matches_independent_rederivation must also intersect
    rederived_empty with the live number set, since narrowing only indexed_empty breaks the
    equality (+1); test_excerpt_coverage_is_high must narrow its `total` denominator, or the
    `total - 4` floor silently loosens by 27 (+0). The three-way key-set branch in
    test_entry_shape_is_the_stable_projection_only costs +2. TestSkeletonArchiveRows costs
    at most +19, which is a HARD sub-budget and the plan's tightest single number: written in
    this file's local one-key-per-line convention (the shape base_keys uses today) the class
    costs 35 and lands the file at 511, over the limit. Write both key sets as SINGLE-LINE set
    literals instead -- measured at 118 characters each, inside the 127-char ruff limit -- which
    lands the class at 19 and the file at about 495. The TestCommittedIndexSizePin docstring is
    38 non-blank lines today and is budgeted to 22 or fewer (-16). Net about +7, landing near
    494. The contract-to-constant pin test is deliberately homed in tests/checks/decisions/ and
    costs this file nothing.
  - >-
    CONTRACT STRUCTURAL-SIZE BUDGET. docs/contracts/decision-entry.yaml is governed by the
    Decision 166 engine's `contracts` class at a 500-effective-line limit and measures 458
    today -- 42 lines of headroom. effective_lines excludes comments, so execution step 8(a)
    and 8(b) are free; the additions that cost are index_max_bytes (+1), the
    lever_by_ceiling_matrix folded scalar (+4 to +6) and the amendment_log entry (+4 to +5) --
    see also the note below on why the constant itself stays in the test module.
  - >-
    WHY index_max_bytes DOES NOT CONVERGE ONTO validate_decisions_size.py. Its two sibling
    ceilings are enforced by module constants in that registered check, while this one's source
    of truth stays a pytest class attribute -- which is why VP steps 2 and 3 must regex a TEST
    module's text to read a governance constant. That asymmetry is inherited, not introduced:
    Decision 166 point 9 deliberately put the pin in the test module, and moving it would mean
    building a registered index-size check, which is a different plan against a surface T1.5 c1
    is scheduled to retire. Recorded so a later reader reads the divergence as scoped-out rather
    than overlooked; the contract key added here is what makes the ceiling discoverable in the
    meantime.
    about +10 to +12, landing near 470. It fits, but it is budgeted here rather than assumed,
    because this plan forecloses its own escape: constraints 4 and 5 bar budget raises, and
    Decision 166's raise guard would demand a `# raise-approved: dec-NNN` marker naming an
    authorizing Decision this plan deliberately mints none of.
  - >-
    COVERAGE-FLOOR NOTE for test_excerpt_coverage_is_high. All four no-marker entries (63, 64,
    65, 67) are LIVE, so narrowing the denominator to live rows preserves the `total - 4` floor
    exactly (121 >= 121) rather than weakening it -- the 27 archive rows were silently padding
    the floor before. It now sits exactly at the boundary, which is the intended behaviour of a
    coverage floor: a fifth no-marker live entry should trip it and be looked at.
  - >-
    REGISTRY OBLIGATION AND HEADROOM. Three graduate-disposition steps mean three new
    config/agent/verification_registry/registry.yaml rows are MANDATORY:
    scripts/checks/verification/validate_graduation_completeness.py's implement-PR leg matches
    each graduate step's (check_id, plan_slug) against rows new in the diff and appends a
    failure when none is found. Separately, the two EXISTING registry rows that read this index
    -- dec-164-index-triage-discoverable (Decision 164 is live, so its assertions hold) and
    decision-index-blast-radius-bounded (which asserts the old-vs-new index diff is exactly
    {160} and would fail against 27 changed rows) -- are NOT re-executed:
    validate_verification_registry's _added_entries matches by check_id against origin/main and
    runs the differential admission gate only over newly-added rows. Neither existing row needs
    editing. HEADROOM: registry.yaml measures 5,836 effective lines against its 6,000 ceiling
    (164 left); three rows carrying commands longer than the ~18-line dec-164 exemplar will
    consume roughly 35-45% of that. Decision 166 point 6 pre-commits that when the 6,000
    ceiling fires the response is the CD.29 archival lifecycle, NEVER a second raise, and its
    reversal condition (f) re-audits the registry's design on a second raise. This plan spends
    that runway knowingly. SECOND, ZERO-HEADROOM BUDGET on the same file:
    config/structural_size_budgets.yaml's long_line_budgets pins registry.yaml at 2315
    characters -- exactly its current longest line, so there is no room at all. The three new
    rows' commands flatten to 741, 460 and 640 characters, comfortably clear, but they must be
    written as folded/quoted scalars in that shape and never collapsed into one longer line: a
    breach would need a raise this plan's constraint 4 and Decision 165 both bar. By contrast
    docs/decisions-index.json is ungoverned for size (config/structural_size_budgets.yaml's
    generated_pinned roster) and shrinks here regardless, so it needs no budget.
  - >-
    WHY ARCHIVE ROWS STAY IN THE INDEX AT ALL (the prior question, answered before the
    alternative below). Deleting live:false rows outright would reclaim the entire archive term
    rather than 61% of it, and is nonetheless wrong: build_index() derives supersedes /
    superseded_by as a CORPUS-WIDE union across both files (scripts/decisions_index.py:168-184
    -- superseded_by_map and supersedes_map are built over every parsed row, and
    title_supersedes targets resolve against the same dict), so an archived number must stay
    resolvable or live entries acquire dangling edges pointing at numbers the index no longer
    contains. A skeleton is the minimum row that keeps the edge graph closed -- which is why
    `number`, the three edge keys and `live` are non-negotiable members of the retained set.
  - >-
    ALTERNATIVE CONSIDERED AND DECLINED (frame check). Splitting docs/decisions-index.json into
    separate live and archive artifacts would reclaim the whole archive term (a further 7,239 B)
    rather than the 61% skeletonization reclaims, but it costs the single-artifact freshness
    check, the `live` flag's provenance role, and every consumer's one-file read -- and it does
    not escape the edge-graph constraint above, since resolving one edge would then need both
    files. Not worth it against a surface with a dated successor in T1.5 c1; recorded so a
    later reader does not mistake the partial reclaim for an oversight.
  - >-
    WHAT THE PROMPT THAT COMMISSIONED THIS PLAN GOT WRONG, so the implementing agent does not
    reintroduce it. (a) It asked to "RETAIN the currency field" on archived rows. Archive rows
    never carry currency today, docs/contracts/decision-entry.yaml says so explicitly, and
    validate_decision_currency invariant I2 hard-fails if one appears -- adding it would break
    CI. The key that must be retained on archive rows is `live`, which decision-scout uses to
    derive its live-row count. (b) It stated the index at 116,760 bytes; the measured value is
    119,189. (c) It implied the current pin derivation still uses a 120-header live term; the
    enforced ceiling is 132, which is what made the recorded derivation false.
  - >-
    Branch was 0 commits behind and 0 ahead of origin/main at planning time (preflight
    main_freshness ok, no scope-file overlap), so no Main Divergence Assessment deferral
    applies. Preflight: venv ok, creds ok, no uncommitted changes, zero open ci-rca recs.
    rec-3012 relevance re-check returned `unknown` (no staleness signals), so bundling proceeds.

