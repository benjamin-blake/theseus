schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: migration-step-5-index-skeleton
intent: >-
  Make archival relieve the docs/decisions-index.json byte pin as well as the live-header
  ceiling, so the operator-disposed Decision 146 archival wave has one lever that moves both
  stocks -- by emitting skeleton rows for live:false index entries and re-deriving the pin
  downward at the 120-header target the operator is steering back toward.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-migration-step-5-index-skeleton.yaml
phase: >-
  Platform governance -- migration step 5 of audits/contract-first-governance-33c8667.yaml
  ("Land rec-3012 (skeleton index rows for live:false entries) so archival relieves the index
  term too; then re-derive the pin DOWN per its own never-a-floor note"). Blocks migration
  step 6 (the Decision 146 archival wave), whose stated blocker is "Steps 1 and 5"; step 1 is
  confirmed landed (scripts/checks/decisions/validate_decisions_size.py:35-36 carry the
  bridge's 132 / 780,000), so this plan is the last blocker. Adjacent to platform tier_item
  T2.56, which eventually retires both the header ceiling and this pin; this plan lowers the
  pin in the meantime and does not touch T2.56's scope.

scope:
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      Branch the per-row projection in build_index() on the already-computed is_live flag so
      live:false rows emit a skeleton (number/title/status/decided_date/supersedes/
      superseded_by/amends/live) and never derive or carry triage_excerpt,
      triage_excerpt_source, triage_excerpt_truncated or category_tags. Update the module
      docstring's triage_excerpt/category_tags/currency derivation paragraphs to state the
      live-only scope, and its line-32 "131,000-byte index pin" reference to the new figure.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate the committed artifact from the changed generator (measured 119,189 ->
      107,367 bytes at this tree). Generated file -- never hand-edited.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Add TestSkeletonArchiveRows; narrow the nine live-assuming assertions across
      TestTriageExcerptIntegration, TestCategoryTagsIntegration and TestDeterminism; re-derive
      _COMMITTED_INDEX_MAX_BYTES 131,000 -> 112,000 and rewrite TestCommittedIndexSizePin's
      derivation docstring, reconciling both passages PLAN-decision-ceiling-bridge left
      deliberately stale for this work. Must land at or under 500 SLOC -- see the SLOC BUDGET
      context entry for the line-by-line arithmetic.
  - file: tests/test_decision_scout_retrieval.py
    action: Modify
    purpose: >-
      Narrow _score()/the probe scans to live rows. Today they read entry["triage_excerpt"]
      for EVERY index row and KeyError on skeleton archive rows; live-only is also the
      semantically correct scope, since decision-scout triages live entries exclusively.
  - file: tests/checks/decisions/test_validate_decisions_index_freshness.py
    action: Modify
    purpose: >-
      Home the contract-to-constant pin test (VP step 3's guard) here rather than in
      tests/test_decisions_index.py. It covers docs/contracts/decision-entry.yaml, not
      scripts/decisions_index.py, so it has no tie to the module's coverage mapping, and at 62
      SLOC it has 438 lines of headroom against the other file's 13.
      tests/test_decision_field_grammar.py::TestTerminatorConstantToContractPin is the
      incumbent contract-to-constant pin against this same contract and was considered; it is
      passed over only because its constants live in a source module while this plan's live in
      a test module, which forces the text-read mechanism named in execution step 10.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Retire the now-satisfied rec-3012 forward reference in the currency: block; home the
      third corpus ceiling next to its two siblings (size_governance.index_max_bytes plus a
      lever_by_ceiling_matrix row) with the operator's standing never-raise position; correct
      the line-538 comment header that misattributes the bridge's 132 / 780,000 to Decision
      134; and append the MANDATORY Class D amendment_log[] entry the parsed-content change
      obliges (see the CLASS D AMENDMENT LOG context entry -- without it the PR fails
      validate_contract_drift in the --pre tier).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Register the three graduate-disposition VP steps as new rows keyed on
      (check_id, plan_slug). Decision 132 / validate_graduation_completeness's implement-PR leg
      hard-fails any graduate step without a matching new-in-diff row, so this write is
      mandatory, not optional.

bundled_recommendations:
  - rec-3012

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    Every live:false row in the committed docs/decisions-index.json carries exactly the eight
    skeleton keys (number, title, status, decided_date, supersedes, superseded_by, amends,
    live) and NONE of triage_excerpt, triage_excerpt_source, triage_excerpt_truncated,
    category_tags, currency.
  - >-
    Every live:true row keeps today's full thirteen-key set including currency, so
    scripts/checks/decisions/validate_decision_currency.py invariant I2 ("currency present iff
    live") still passes unchanged.
  - >-
    The committed docs/decisions-index.json is byte-identical to a fresh build_index() dump and
    is at or under the re-derived pin (measured target 107,367 bytes against a 112,000 pin).
  - >-
    tests/test_decisions_index.py's _COMMITTED_INDEX_MAX_BYTES is 112_000, and
    TestCommittedIndexSizePin's docstring records the new arithmetic, the deliberate
    derive-at-120-while-132-is-enforced divergence, and the never-raise position.
  - >-
    docs/contracts/decision-entry.yaml's size_governance block carries index_max_bytes equal to
    that test constant, plus a lever_by_ceiling_matrix row for it, and
    tests/checks/decisions/test_validate_decisions_index_freshness.py pins the two together so
    they cannot drift.
  - >-
    tests/test_decisions_index.py measures at or under 500 SLOC (non-blank, non-comment lines)
    with the edits landed as budgeted in the SLOC BUDGET context entry. Neither a
    config/sloc_budgets.yaml raise nor a Decision 131 mirror split is an acceptable outcome --
    both are structurally unavailable for this file (see constraint 5).
  - >-
    docs/contracts/decision-entry.yaml carries a new amendment_log[] entry
    ({date, semantic_break: false, change_class: field_add, summary}) covering the
    index_max_bytes and lever_by_ceiling_matrix additions, so validate_contract_drift's Class D
    leg passes.
  - >-
    config/agent/verification_registry/registry.yaml carries three new rows whose check_ids are
    decisions-index-archive-rows-are-skeletons, decisions-index-pin-112000-fresh-and-under and
    decision-entry-index-ceiling-homed, each with plan_slug migration-step-5-index-skeleton,
    and each clears the differential admission gate (fails on origin/main, passes on HEAD).
  - >-
    Full bin/venv-python -m scripts.validate exits 0, and rec-3012 is closed by the
    "Resolves: rec-3012" squash-commit trailer.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the committed index's row shapes: archive rows are exactly the eight skeleton
      keys, live rows are exactly those eight plus the four retrieval-aid keys plus currency.
      Also assert archive rows cost materially less than live rows per row (the structural
      property rec-3012 exists to create), so a future re-thickening of archive rows fails
      here rather than silently returning the bytes.
    command: >-
      bin/venv-python -c "import json; d=json.load(open('docs/decisions-index.json'))['decisions'];
      SKEL={'number','title','status','decided_date','supersedes','superseded_by','amends','live'};
      FULL=SKEL|{'triage_excerpt','triage_excerpt_source','triage_excerpt_truncated','category_tags','currency'};
      a=[r for r in d if not r['live']]; l=[r for r in d if r['live']]; assert a and l, (len(a),len(l));
      bad=[r['number'] for r in a if set(r)!=SKEL]; assert not bad, ('archive row not a skeleton',bad);
      lbad=[r['number'] for r in l if set(r)!=FULL]; assert not lbad, ('live row lost a key',lbad);
      ar=len(json.dumps(a))/len(a); lr=len(json.dumps(l))/len(l);
      assert ar < 0.5*lr, ('archive rows not materially thinner',ar,lr); print('SKELETON_SHAPE ok')"
    expected: "Exit 0, prints `SKELETON_SHAPE ok`"
    fix_if: >-
      A KeyError or a non-empty bad/lbad list means build_index() is projecting the wrong key
      set for that row class. A thinness failure means the four retrieval-aid fields are still
      being derived for archive rows.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-archive-rows-are-skeletons
  - step: 2
    phase: pre-deploy
    action: >-
      Assert the pin is the re-derived 112,000, the committed artifact is at or under it, and
      the artifact is byte-identical to a fresh build (so the reclaim was actually committed,
      not just computed).
    command: >-
      bin/venv-python -c "import json,pathlib,re; from scripts.decisions_index import build_index;
      pin=int(re.search(r'_COMMITTED_INDEX_MAX_BYTES = (\S+)',
      pathlib.Path('tests/test_decisions_index.py').read_text()).group(1).replace('_',''));
      assert pin==112000, pin; p=pathlib.Path('docs/decisions-index.json'); n=len(p.read_bytes());
      assert n<=pin, (n,pin); assert json.loads(p.read_text())==build_index(), 'committed index is stale';
      print('PIN ok', n, 'of', pin)"
    expected: "Exit 0, prints `PIN ok` with a byte count at or under 112000"
    fix_if: >-
      A stale-index failure means --write was not re-run after the generator change. A size
      failure means the index exceeds the pin -- per the constraints below the response is
      archival or collapsing entries into contracts, NEVER raising the pin.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-pin-112000-fresh-and-under
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the third corpus ceiling is homed in the contract beside its two siblings and
      cannot drift from the enforcing test constant.
    command: >-
      bin/venv-python -c "import yaml,pathlib,re;
      y=yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text());
      c=y['size_governance'];
      pin=int(re.search(r'_COMMITTED_INDEX_MAX_BYTES = (\S+)',
      pathlib.Path('tests/test_decisions_index.py').read_text()).group(1).replace('_',''));
      assert c['index_max_bytes']==pin, (c['index_max_bytes'],pin);
      assert 'index_max_bytes' in c['lever_by_ceiling_matrix'], sorted(c['lever_by_ceiling_matrix']);
      log=y.get('amendment_log') or []; assert log, 'Class D amendment_log[] not appended';
      assert log[-1]['change_class']=='field_add', log[-1];
      print('CONTRACT_HOMED ok', c['index_max_bytes'])"
    expected: "Exit 0, prints `CONTRACT_HOMED ok 112000`"
    fix_if: >-
      A KeyError means the size_governance or lever_by_ceiling_matrix addition is missing; a
      value mismatch means the contract and the test constant have drifted; an empty
      amendment_log means the Class D obligation was skipped, which validate_contract_drift
      will also fail in the --pre tier.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-entry-index-ceiling-homed
  - step: 4
    phase: pre-deploy
    action: >-
      Run the registered currency-invariant guard against the regenerated index -- I2
      ("currency present on every live row, absent from every archive row") is the invariant
      that would break if skeletonization were implemented by adding currency to archive rows
      instead of by dropping the four retrieval-aid fields.
    command: >-
      bin/venv-python -c "from scripts.checks.decisions.validate_decision_currency import
      validate_decision_currency as v; f=[]; v(f); assert not f, f; print('CURRENCY ok')"
    expected: "Exit 0, prints all five invariants PASS then `CURRENCY ok`"
    fix_if: >-
      An I2 failure means an archive row gained a currency key or a live row lost one. An I5
      failure means the decision-scout skill's consumer-contract clauses were edited -- they
      are deliberately out of this plan's scope.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This command is the already-registered validate_decision_currency check invoked directly;
      it passes on origin/main, so a new registry row would fail the differential admission
      gate as non-admitted, and it would duplicate an existing standing guard. It is kept as a
      VP step because I2 is the specific invariant this change could break.
  - step: 5
    phase: pre-deploy
    action: >-
      Run all three affected test modules to prove every live-assuming consumer was narrowed.
      A simulated run of this change against the pre-change tree failed exactly 10 tests
      (enumerated in the CONSUMER SWEEP context entry) out of the 72 these three modules pass
      today; this step must return zero failures.
    command: >-
      bin/venv-python -m pytest tests/test_decisions_index.py tests/test_decision_scout_retrieval.py
      tests/checks/decisions/test_validate_decisions_index_freshness.py -q
    expected: "Exit 0, all tests pass, zero errors"
    fix_if: >-
      A KeyError on triage_excerpt, triage_excerpt_source or category_tags names a consumer
      still assuming those keys exist on every row; narrow it to live rows rather than
      restoring the fields. An equality/coverage AssertionError means only one side of a
      cross-check was narrowed -- see execution step 5.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A pytest selector over these whole modules passes on origin/main, so it cannot clear the
      differential admission gate. The genuinely new behaviour these modules assert is already
      graduated as steps 1-3 via the artifact-level commands, which do fail on origin/main.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the docstring rewrite and new assertions kept tests/test_decisions_index.py under
      the 500-SLOC limit (Decision 128 decompose-don't-raise; the file measured 487/500 before
      this change and is not registered in config/sloc_budgets.yaml).
    command: >-
      bin/venv-python -c "from pathlib import Path; n=len([l for l in
      Path('tests/test_decisions_index.py').read_text().splitlines() if l.strip() and not
      l.strip().startswith('#')]); assert n<=500, n; print('SLOC ok', n, 'of 500')"
    expected: "Exit 0, prints `SLOC ok` with a count at or under 500"
    fix_if: >-
      Over 500: the lever is TestSkeletonArchiveRows, NOT the docstring -- the docstring budget
      is already at its 22-line floor and trimming it further is not a recovery path. Check the
      class is written with single-line set literals (19 SLOC) rather than one key per line (35
      SLOC); that difference alone is the 16 lines between 495 and 511. Also confirm the
      contract-to-constant pin test went into tests/checks/decisions/ rather than this file.
      Neither a budget raise nor a mirror split is available -- see constraint 5.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_sloc_limits already enforces the 500 limit repo-wide on origin/main, so this
      command passes there and cannot clear the differential admission gate. It is kept as a
      VP step because this file has only 13 SLOC of headroom against a budgeted +9, making the
      crossing plausible enough to check explicitly rather than discover at validate time.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the full validation tier before handoff, per handoff_policy above. It re-runs
      validate_graduation_completeness's implement-PR leg (which fails if any of the three
      registry rows is missing or mis-keyed) and validate_contract_drift's Class D leg -- both
      are registered pre=True, so --pre catches them too; this step is the belt-and-braces
      full-tier pass, not their only exercise.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0 with no failed checks"
    fix_if: >-
      A graduation-completeness failure names the missing (check_id, plan_slug) row.
      validate_decisions_index_freshness failing means the committed index was not regenerated.
      Any structural-size or SLOC failure routes to the budgeted trims above, never a raise.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The full validator passes on origin/main, so a registry row for it could not clear the
      differential admission gate; it is also the parent check-runner rather than a single
      canonical-slot shape, so registering it would be circular. Classified waive rather than
      not-applicable to stay uniform with steps 5 and 6, which are waived for the same
      origin/main-passes reason.
  - step: 8
    phase: post-deploy
    action: >-
      After the squash merge carrying the "Resolves: rec-3012" trailer, confirm the ops portal
      actually closed the bundled recommendation (closure obligation).
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import
      json,pathlib; rows=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()];
      r=next(x for x in rows if x['id']=='rec-3012'); assert r['status']=='closed', r['status'];
      print('REC_CLOSED ok')"
    expected: "Exit 0, prints `REC_CLOSED ok`"
    fix_if: >-
      Still open means rec-autoclose.yml did not fire; fall back to
      `bin/venv-python -m scripts.ops_data_portal --update-rec rec-3012 --status closed
      --resolution "..."` per Decision 70.

test_obligations:
  - source: scripts/decisions_index.py
    behavior: >-
      build_index() projects a skeleton row for every live:false entry -- the four
      retrieval-aid fields (triage_excerpt, triage_excerpt_source, triage_excerpt_truncated,
      category_tags) are derived and emitted for live:true rows only, and currency stays
      live-only.
    verification_step: 5
    test_selector: tests/test_decisions_index.py::TestSkeletonArchiveRows
    red_green_expectation: >-
      Red before (archive rows carry all four fields today, so the skeleton key-set assertion
      fails), green after. Linked to step 5 because the schema requires the linked step's
      command to host the pytest node id; VP step 1 is the stronger artifact-level
      discriminator for the same behaviour and is the graduated guard.
  - source: docs/decisions-index.json
    behavior: >-
      The committed artifact carries skeleton rows for every live:false entry and full
      thirteen-key rows for every live:true entry -- the regenerated file, not just the
      generator, is what decision-scout and every other consumer actually reads.
    verification_step: 1
    command: archive row not a skeleton
    red_green_expectation: >-
      Red before (all 27 archive rows carry 12 keys, so the skeleton key-set assertion fails
      naming every one of them), green after with 8 keys per archive row.
  - source: docs/contracts/decision-entry.yaml
    behavior: >-
      size_governance.index_max_bytes exists, equals the enforcing test constant, and carries a
      lever_by_ceiling_matrix row -- so the third corpus ceiling is discoverable beside its two
      siblings and cannot silently drift from the value actually enforced.
    verification_step: 3
    command: c['index_max_bytes']==pin
    red_green_expectation: >-
      Red before (size_governance has no index_max_bytes key, so the command raises KeyError),
      green after with the contract and test constant both at 112000.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      Three new rows keyed (check_id, plan_slug) back the three graduate-disposition VP steps,
      each clearing the differential admission gate.
    verification_step: 7
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      The registry's own content is not guarded by a dedicated test but by two registered
      checks that VP step 7 already runs: validate_graduation_completeness's implement-PR leg
      fails if any of the three (check_id, plan_slug) rows is missing or mis-keyed, and
      validate_verification_registry's differential admission gate re-executes each new row
      against a real origin/main worktree and refuses any that does not fail there and pass on
      HEAD. A bespoke test asserting the rows exist would be strictly weaker than the admission
      gate that already proves they discriminate.

constraints:
  - >-
    NO new numbered Decision. The downward re-derivation needs none: Decision 166 point 9
    defers the archive-term structural fix to rec-3012 by name, and its reversal condition (g)
    names "landing rec-3012 (archive-row skeletonization) first, never a third bump on faith"
    as the correct response to pin pressure. Content that would otherwise want a number routes
    to docs/contracts/decision-entry.yaml per Decision 150's field_semantics significance row
    and Decision 167 clause 2. Per the AGENTS.md DD-B convention the PR body names the routing
    row applied: "Routing: field_semantics -> docs/contracts/decision-entry.yaml".
  - >-
    CITATION ACCURACY. Do NOT attribute the phrase "never to be treated as a floor" to
    Decision 166's body -- it appears only at tests/test_decisions_index.py:492, in the
    docstring this plan rewrites. The authorizing loci to cite are Decision 166 point 9's
    rec-3012 deferral, its reversal condition (g), that test-module note, and
    audits/contract-first-governance-33c8667.yaml migration step 5. Decision 165 made citation
    accuracy load-bearing; a misattributed quote in a governance artifact is the same defect
    class.
  - >-
    Do NOT attribute the 132-header ceiling to Decision 134 clause 2. Clause 2 ratified 120;
    132 landed via docs/plans/PLAN-decision-ceiling-bridge.yaml under a recorded human override
    of a decision-scout BLOCK verdict, and no numbered Decision ratifies it. Attribute 132 to
    scripts/checks/decisions/validate_decisions_size.py's _DECISIONS_LIVE_MAX_H2,
    docs/contracts/decision-entry.yaml's size_governance.live_max_h2_headers, and that bridge
    plan's recorded override. This applies to the contract's own line-538 comment header, which
    commits exactly this misattribution today and is corrected by execution step 8 -- inserting
    index_max_bytes under an uncorrected header would reproduce the defect this constraint
    exists to prevent.
  - >-
    THE PIN IS NEVER RAISED. This is the operator's standing position, recorded here and in the
    contract. When the pin binds, the response is archival under Decision 146, collapsing
    entries into contracts, or removing them -- never a raise, and never widening the archive
    budget to absorb the overshoot. Decision 102's downward-only ratchet already makes
    decreases unrestricted and raises reviewable; this constraint goes further and forecloses
    the raise entirely for this surface.
  - >-
    SLOC: land the budget, do not defer it. tests/test_decisions_index.py measures 487/500 and
    is unregistered in config/sloc_budgets.yaml. BOTH conventional escapes are structurally
    unavailable for this file, so neither may be reached for: (a) a config/sloc_budgets.yaml
    raise is foreclosed by the constraint above and independently by Decision 165, which
    requires a `# raise-approved: dec-NNN` marker naming a Decision whose body authorizes that
    specific entry -- no live Decision names this file and this plan mints none; (b) a Decision
    131 mirror split cannot fire, because scripts.test_coverage_checker's
    _ALL_MIRROR_TARGET_HOMES is a fixed 24-basename roster that does not contain
    test_decisions_index.py ("a source path with no grandfathered home never joins the
    roster"), so a split would strand the extracted tests outside the
    scripts/decisions_index.py -> tests/test_decisions_index.py coverage mapping that
    TestCheckIndexFreshnessDirect's own docstring depends on. The sanctioned path is the
    budgeted +9 in the SLOC BUDGET context entry.
  - >-
    Only the seven files in the Scope table may be modified. In particular
    .claude/skills/decision-scout/SKILL.md stays untouched: its Phase 1/2 triage is already
    live-only and its clause text is asserted by validate_decision_currency invariant I5, so an
    edit risks breaking a passing guard for no gain.
  - >-
    Do NOT retro-edit the historical artefacts PLAN-decision-ceiling-bridge's handoff list
    names alongside this one (docs/audit-prompts/AUDIT-*.md, docs/plans/PLAN-esb-routing-
    rationale.yaml, docs/ROADMAP-PLATFORM.yaml's T2.56 runway figures). Those are point-in-time
    records; the bridge plan itself considered and declined the equivalent edits. The passages
    this plan DOES reconcile are the two inside tests/test_decisions_index.py, the line-32
    docstring reference in scripts/decisions_index.py, and the line-538 comment header in
    docs/contracts/decision-entry.yaml -- all four in files already in scope.
  - >-
    Do NOT edit docs/DECISIONS.md to amend Decision 166 point 9's now-stale "131,000 bytes"
    figure. Touching the corpus perturbs the very index and byte arithmetic this plan measures
    and verifies, and D166's reversal condition (g) already anticipates rec-3012 landing and
    the pin falling. The figure is superseded by the test constant and the contract key, both
    of which this plan makes authoritative and cross-pinned.
  - No rescue agents or workaround loops (Decision 55).

context:
