  Fully reversible in one commit: revert the generator branch, re-run
  `bin/venv-python -m scripts.decisions_index --write` to restore the full-weight rows, restore
  _COMMITTED_INDEX_MAX_BYTES to 131_000, drop the three registry rows, revert
  docs/contracts/decision-entry.yaml (both size_governance keys plus the amendment_log entry),
  un-narrow tests/test_decision_scout_retrieval.py's _load_index()/_score(), and drop the
  contract-to-constant pin test from
  tests/checks/decisions/test_validate_decisions_index_freshness.py. Nothing outside the
  repo changes -- no warehouse write, no infrastructure, no deploy. The only irreversible side
  effect is closing rec-3012, which is reopened by filing a follow-up rec if the change is
  reverted.
