      start/end fields derived with timing read.
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_sessions_event_journal_shape
    red_green_expectation: red before (module absent / fields absent), green after
  - source: docs/contracts/telemetry_observations.yaml
    behavior: >-
      observation_type includes turn and tool_call; external_ref, cost_usd, friction_class and
      classifier_version declared; shared event fields and derived timing fields present.
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_observations_event_journal_shape
    red_green_expectation: red before, green after
  - source: docs/contracts/telemetry_transcripts.yaml
    behavior: >-
