constraints:
- >-
  Contracts, Decisions, roadmap and one test file ONLY. No code under src/, scripts/ or .claude/, no generator change,
  no field_semantics change, no table provisioning, no blob-port code (rec-4024, rec-4026, rec-4033).
- >-
  No change to scripts/contracts_schema.py: new properties go inside existing free-dict blocks (derivation, dq_intent,
  governance). If something cannot be expressed, STOP and report -- never widen the schema. Every NEW inline field
  carries description, semantics, populated_by and dq_intent (drift-gate category 2). Per-field notes: governance_notes
  on inline fields, governance_notes_local on $ref fields.
- >-
  Decision 177: bodies of 95, 96, 97, 197 are never edited; amendments are appended dated blockquotes. Each new
  Decision <= 6144 bytes (Decision 167); normative detail lives in the contracts, the Decisions state the commitments.
- >-
  Decision 114/147: roadmap <= 10,000 lines. The newly completed T2.26 takes the Decision 147 clause 2 compact form;
  keep id, tier, name, status, completed_at, depends_on, related_candidate_decisions, effort, strategic and exit_criteria
  byte-for-byte; compact BEFORE adding text elsewhere. No live item is trimmed.
- >-
  Decision 95 stands where not amended: each sub-agent has its OWN session linked by parent_session_id; the collapse
  of draft child tables into observation_type stands.
- >-
  Stored-vs-derived rule: STORED iff a fact observed at a single event and recorded on that event's row; DERIVED
  iff a function of other rows (start/end/duration, counts, roll-ups, unions, session state, friction classification,
  cost). Derived fields stay declared (one schema for readers) with derivation.timing read and get NO physical column.
- >-
  event_timestamp and session_started_at are SOURCE-derived (from the originating record), never emit time; source_ordinal
  orders rows within a session; the writer rejects implausible event_timestamp (> created_timestamp + skew) -- the
  rule is declared here, enforced by rec-4024.
- >-
  Credential scrubbing (CD.40) unchanged; PII scrubbing and erasure deferred together (rec-4029). The blob port
  makes erasure of large payloads an object delete.
- No rescue agents or workaround loops (Decision 55).
