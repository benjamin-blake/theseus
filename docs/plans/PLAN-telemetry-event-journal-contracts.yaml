schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-event-journal-contracts"
intent: >-
  Re-model the four canonical telemetry contracts as append-only event journals whose state is
  derived at read, add the identity and capture fields per-turn agent-friction telemetry needs, and
  record the model in two numbered Decisions -- so the telemetry writer (rec-4024), verification
  harness (rec-4025) and turn capture (rec-4026) build against one settled schema. Friction
  telemetry is the foundation of automated RCA and recursive self-improvement (PROJECT_CONTEXT
  "Recursive self-improvement model").
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-event-journal-contracts.yaml
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake) and T3.20 (agent-turn telemetry capture) --
  contract/decision groundwork for both. Closes NO exit criterion: T2.36 c1 needs the tables
  physically created (rec-4024) and T3.20 c4 is only partially delivered (turn-grain contract
  additions land here; c4 stays open). Also lands operator-confirmed Tier Item Freshness Gate
  bookkeeping on T2.26, T2.36, T2.18 and T3.20.
scope:
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      Event-journal grain (one row per session lifecycle event), stored-vs-derived field split,
      event identity/time/tenancy/producer fields, partition day(event_timestamp),
      contract_version 2 per the Decision 118 ritual.
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Event-journal grain (open/close events for phase/step, one closed row for point types),
      observation_type + turn/tool_call, external_ref, cost_usd, friction_class/classifier_version,
      shared event/tenancy/producer fields, contract_version 2.
  - file: docs/contracts/telemetry_transcripts.yaml
    action: Modify
    purpose: >-
      Pointer model replaced by in-row content (content, content_sha256, truncated; s3_key kept
      nullable for overflow only; local_path retired), purpose + origin vocabularies, thinking
      captured provider-neutrally, shared fields, contract_version 2.
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      Event-journal grain with an event_id row identity (the table has no PK today), stored-vs-
      derived split, shared fields, contract_version 2.
  - file: docs/contracts/tenant-id.yaml
    action: Create
    purpose: >-
      New Class C cross-system invariant, sibling of project-id.yaml: tenant = owner of the
      deployment; NOT NULL; stamped by the write boundary, never caller-supplied.
  - file: docs/contracts/project-id.yaml
    action: Modify
    purpose: >-
      Populated_by/semantics re-grounded: project = repository identity, from a committed project
      config value (the Decision 196 otl-init surface) with the normalized git remote as fallback;
      boundary-stamped. Retire the stale "theseus" default (Decision 198). Base field stays
      nullable; telemetry inheritors tighten to NOT NULL (Invariant 5, tighten-only).
  - file: docs/contracts/telemetry-lexicon.yaml
    action: Modify
    purpose: >-
      Vocabulary for event journal, event_kind values, turn, tool_call, origin, event_timestamp,
      producer, derived-at-read (decision-scout CITE on Decision 95).
  - file: docs/contracts/_joins.yaml
    action: Modify
    purpose: >-
      Re-state join cardinalities for event-journal grain (fan-out warning), add tenant/project
      and observation self-parent joins.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Identity note (deterministic producer-boundary derivation for event tables, pointing at
      Decision 199) and a derived-state rule scoped NARROWLY to append_only telemetry, deferring
      materialization-mode policy to T2.52 c1.
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: >-
      telemetry_tables entry re-grounded to the event-journal model; new amendment_log entry
      (Class D, Decision 168).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add Decision 199 (telemetry event-journal model; amends 95, 96, 97) and Decision 200 (tenant
      and project identity; amends 197 clause 2); append dated "Amended by" blockquotes to 95, 96,
      97 and 197 without rewriting any existing line (Decision 177).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerate so validate_decisions_index_freshness stays green.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Operator-confirmed freshness-gate bookkeeping on T2.26, T2.36, T2.18 c8 and T3.20; net line
      count must stay at or under the Decision 114 ceiling (10,000).
  - file: .secrets.baseline
    action: Modify
    purpose: >-
      detect-secrets line-number drift for docs/ROADMAP-PLATFORM.yaml hex-entropy entries only
      (no new secret, no hash change).
  - file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
    action: Create
    purpose: >-
      Red-before/green-after invariants over the four telemetry contracts plus tenant-id.yaml and
      project-id.yaml (see test_obligations).
bundled_recommendations: []
followon_recs: ["rec-4024", "rec-4025", "rec-4026", "rec-4027", "rec-4028", "rec-4029"]
infrastructure_dependencies:
  - >-
    data-pipeline (src/lambdas/data-pipeline/manifest.yaml, status active) packages
    docs/ROADMAP-PLATFORM.yaml as an asset, so compute_affected_artifacts() reports it. NO DEPLOY
    is performed or needed: the roadmap asset carries no runtime behaviour this plan changes
    (Decision 198 precedent; rec-3990 tracks the asset deploy-trigger gap). No other scope file is
    Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
  - >-
    Each of the four telemetry contracts declares governance.partition_by "day(event_timestamp)",
    carries NOT NULL fields event_id, event_kind, event_timestamp, tenant_id, project_id,
    producer and created_timestamp, and no longer declares ingested_at.
  - >-
    Every field the contracts mark derived carries a derivation block with timing "read" and a
    derived_by naming a reader verb; started_at, ended_at and duration_seconds are derived on
    sessions, observations and agents; process_event_count, rework_count, exception_count,
    steps_total, steps_completed and rec_ids are derived on sessions; tokens_input and
    tokens_output are derived on agents.
  - >-
    telemetry_transcripts declares content, content_sha256, truncated and origin, keeps s3_key
    nullable, no longer declares local_path or created_at, and its purpose vocabulary includes
    thinking, tool_result and raw_turn.
  - >-
    telemetry_observations' observation_type vocabulary includes turn and tool_call, and it
    declares external_ref, cost_usd, friction_class and classifier_version.
  - >-
    docs/contracts/tenant-id.yaml exists as a ratified Class C contract whose tenant_id field is
    NOT NULL and whose populated_by names the write boundary; project-id.yaml no longer names
    "theseus" as its default.
  - >-
    Every changed contract.description and every field whose description or semantics changed
    carries a new amendment_log entry satisfying check_amendment_for_diff (prose_improvement with
    semantic_break false, or another change_class with semantic_break true).
  - >-
    docs/DECISIONS.md carries exactly one `## Decision 199:` and one `## Decision 200:` heading,
    each with a bare yaml envelope (number, amends [95, 96, 97] and [197] respectively,
    significance numbered_decision with a contract-first justification) and each at most 6144
    bytes heading-to-next-heading.
  - >-
    Decisions 95, 96 and 97 each carry a dated blockquote naming Decision 199, Decision 197 carries
    one naming Decision 200, and no line of the 95, 96, 97 or 197 spans appears as a removed line in
    `git diff origin/main -- docs/DECISIONS.md`.
  - >-
    docs/ROADMAP-PLATFORM.yaml: T2.26 status complete with completed_at; T2.36 depends_on is
    exactly [T2.26] and c1 names day(event_timestamp); T3.20 depends_on is exactly [T2.36, T1.10],
    carries an open c8 smoke-first promotion gate, c4 remains open, and its intent no longer
    mentions the Decision 51 outbox; the file is at most 10,000 lines.
  - >-
    tests/checks/contracts/test_telemetry_event_journal_contracts.py fails on the pre-change tree
    and passes on the implemented tree.
  - >-
    `bin/venv-python -m scripts.decisions_index --check` reports current, and the full tier
    `bin/venv-python -m scripts.validate` exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the new contract-invariant test module, which loads the four telemetry contracts,
      tenant-id.yaml and project-id.yaml through scripts.contracts and asserts the event-journal,
      derived-field, transcript-content, vocabulary and tenancy invariants.
    command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_event_journal_contracts.py -q
    expected: >-
      Exit 0, all tests passed. On the pre-change tree the module does not exist, so the step is
      red before the change.
    fix_if: >-
      A failing assertion names the contract and field; fix the contract, not the test, unless the
      test encodes something this plan's acceptance criteria do not require.
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-event-journal-contract-shape
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm every re-modelled contract still parses through the ritual document model and that
      the telemetry lexicon still resolves its canonical tables.
    command: >-
      bin/venv-python -m pytest tests/test_contracts.py tests/test_contracts_schema.py
      tests/checks/contracts/test_validate_telemetry_lexicon_tables.py -q
    expected: Exit 0; no contract fails to load under extra="forbid".
    fix_if: >-
      An unknown key means a field was added outside FieldSpec/ContractGovernance's schema --
      express it inside an existing block (e.g. derivation is a free dict) rather than widening the
      schema, which is out of scope.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      These are existing, already-registered test modules; graduating them again would duplicate
      standing coverage rather than add a guard.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm the amendment ritual is satisfied for every contract whose description or field
      semantics changed, by running the contract drift enforcement against origin/main.
    command: >-
      bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from scripts.contracts_enforcement import check_amendment_for_diff;fs=['telemetry_sessions','telemetry_observations','telemetry_transcripts','telemetry_agents','project-id','storage-substrate','telemetry-lexicon','_joins','data-modeling-standard'];errs=[];
      [errs.extend(check_amendment_for_diff(ContractDocument.model_validate(yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout)),ContractDocument.model_validate(yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'))))) for f in fs];print('\n'.join(errs) or 'AMENDMENTS_OK');assert not errs"
    expected: Exit 0 and the success marker printed.
    fix_if: >-
      A category-6 error names the field; add a field-level amendment_log entry with a consistent
      change_class/semantic_break pairing. If a non-Class-A/C contract (e.g. data-modeling-standard)
      does not validate as ContractDocument, drop it from the list and rely on step 7's full tier
      for it -- do not weaken the check for the four telemetry contracts.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Diff-relative to origin/main by construction; the standing equivalent already runs inside
      scripts.validate's contract enforcement on every PR.
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm Decisions 199 and 200 exist once each, carry parseable envelopes with the required
      amends edges and significance, and fit the 6144-byte per-entry cap.
    command: >-
      bin/venv-python -c "import re,yaml;raw=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1))) for m in re.finditer(r'^## Decision (\d+):',raw,re.M)];want={199:{95,96,97},200:{197}};
      [None for n in want if sum(1 for _,k in h if k==n)!=1 and (_ for _ in ()).throw(AssertionError('heading count %d'%n))];
      out=[];
      [out.append((n,raw[s:(h[i+1][0] if i+1<len(h) else len(raw))])) for i,(s,n) in enumerate(h) if n in want];
      [(lambda n,span:(lambda e:(e['number']==n and set(e['amends'])>=want[n] and e['significance']['value']=='numbered_decision' and len(span.encode('utf-8'))<=6144) or (_ for _ in ()).throw(AssertionError('decision %d envelope/size'%n)))(yaml.safe_load(re.search(r'\x60\x60\x60yaml\n(.*?)\n\x60\x60\x60',span,re.S).group(1))))(n,span) for n,span in out];print('DECISIONS_OK')"
    expected: Exit 0 and the success marker printed.
    fix_if: >-
      A heading count other than 1 means a numbering race -- renumber to the next free numbers and
      update every pointer (this plan, the contracts' notes, the roadmap text). An over-cap entry
      moves detail into the contracts' governance_notes, not a larger entry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pinned to two specific entry numbers; as a standing row it would assert a frozen fact rather
      than a reusable property. validate_decisions_size already guards the cap generally.
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the append-only corpus rule held: Decisions 95, 96, 97 and 197 lost no line, and each
      carries its dated amendment blockquote.
    command: >-
      bin/venv-python -c "import re,subprocess;raw=open('docs/DECISIONS.md',encoding='utf-8').read();base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True,check=True).stdout;
      spans=lambda t:{int(m.group(1)):m.group(0) for m in re.finditer(r'^## Decision (\d+):.*?(?=^## Decision \d+:|\Z)',t,re.M|re.S)};b=spans(base);c=spans(raw);
      bad=[n for n in (95,96,97,197) if any(l not in c[n].splitlines() for l in b[n].splitlines())];
      miss=[n for n,t in ((95,'Decision 199'),(96,'Decision 199'),(97,'Decision 199'),(197,'Decision 200')) if not re.search(r'^> \*\*Amended by '+t,c[n],re.M)];
      print('lost-lines',bad,'missing-annotation',miss);assert not bad and not miss;print('APPEND_ONLY_OK')"
    expected: Exit 0 and the success marker printed.
    fix_if: >-
      Restore any removed body line verbatim; amendments are appended blockquotes only (Decision
      177).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Diff-relative to origin/main and pinned to four entries; validate_supersession_annotations
      is the standing guard for the annotation half.
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the roadmap bookkeeping: schema loads, T2.26 complete, T2.36 and T3.20 edges and
      criteria as specified, outbox text struck, and the file within the Decision 114 ceiling.
    command: >-
      bin/venv-python -m scripts.roadmap.platform_roadmap > /dev/null && bin/venv-python -c "import yaml;raw=open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8').read();n=raw.count(chr(10));d={i['id']:i for i in yaml.safe_load(raw)['tier_items']};
      t26,t36,t320=d['T2.26'],d['T2.36'],d['T3.20'];c=lambda i,k:[x for x in i['exit_criteria'] if x['id']==k][0];
      checks={'lines':n<=10000,'t226':t26['status']=='complete' and bool(t26.get('completed_at')),'t236dep':t36['depends_on']==['T2.26'],'t236c1':'day(event_timestamp)' in c(t36,'c1')['text'],
      't320dep':t320['depends_on']==['T2.36','T1.10'],'t320c8':c(t320,'c8')['status']=='open','t320c4':c(t320,'c4')['status']=='open','outbox':'Decision 51 outbox' not in t320['intent']};
      print(n,checks);assert all(checks.values());print('ROADMAP_OK')"
    expected: Exit 0 and the success marker printed, with the line count at or under 10000.
    fix_if: >-
      Over the ceiling: compress T2.26's progress_note further (Decision 147 clause 4 covers the
      newly-completed item only); never trim a live item or raise the ceiling in this plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts one-off bookkeeping state of specific items; validate_platform_roadmap is the standing
      schema and ceiling guard.
    expected_literals: []
  - step: 7
    phase: pre-deploy
    action: Confirm the decisions index is current, then run the full validation tier per the handoff policy.
    command: bin/venv-python -m scripts.decisions_index --check && bin/venv-python -m scripts.validate
    expected: Both exit 0.
    fix_if: >-
      Regenerate the index with bin/venv-python -m scripts.decisions_index and rerun; for any other
      failure fix the root cause (Decision 55), never skip a check.
    hermetic: false
    graduation: not-applicable
