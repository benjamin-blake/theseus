    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_tenant_and_project_identity
    red_green_expectation: red before, green after
constraints:
  - >-
    Contracts, Decisions, roadmap and one test file ONLY. No code under src/, scripts/ or .claude/,
    no generator change, no field_semantics change, no table provisioning (those are rec-4024).
  - >-
    No change to scripts/contracts_schema.py: every new property is expressed inside existing
    blocks (fields, derivation dict, governance, governance_notes, amendment_log). If a needed
    property cannot be expressed, STOP and report -- do not widen the schema.
  - >-
    Decision 177: Decisions 95, 96, 97 and 197 bodies are not edited; amendments are appended dated
    blockquotes. Each new Decision <= 6144 bytes (Decision 167) with envelope + significance.
  - >-
    Decision 114 / 147: the roadmap stays <= 10,000 lines; the only compression licensed is T2.26's
    progress_note (newly completed, Decision 147 clause 4). No live item is trimmed.
  - >-
    Decision 95 stays in force where not amended: a spawned sub-agent keeps its OWN session linked
    via parent_session_id; the collapse of the four draft child tables into observation_type stands.
  - >-
    Stored-vs-derived rule: a field is STORED iff it is a fact observed at a single event and
    recorded on that event's row (e.g. outcome, failure_reason, pr_url on a close row; tokens on a
    model_call row); it is DERIVED iff it is a function of other rows (start/end/duration, counts,
    roll-ups, unions, session state). Derived fields stay declared in the contract (so readers have
    one schema) with derivation {timing: read, derived_by: <reader verb>}.
  - "Credential scrubbing (CD.40) is unchanged; PII scrubbing and erasure are deferred together (rec-4029)."
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict: FLAGS_FOUND (run 2); resolved: D197 NOTE -> Decision 200 amends [197] cl.2 scoped; T3.20 c4 stays open (no partial status, Decision 136). Decisions triaged: 151 of 151. Roadmap items intersected: 10; CONFLICT: 0; RELATED: 7"
  - "CITE: 95, 96, 97, 81, 84, 88, 137, 118, 168, 167, 177, 86, 147, 114, 188, 136, 197; related 78, 67, 184, 196, 93, 191, 150, 105, 192, 59, 55"
  - "gates: decision-scout=FLAGS_FOUND (resolved); plan-critique=<pending>"
  - "Design provenance: two Fable advice consults this session (writer boundary + sequencing; derived state + verification + capture scope). Operator rulings recorded in rec-4024..4029 contexts."
  - "Decision 199 content: event-journal grain (amends 95 cl.1 'one row per session'); partition day(event_timestamp), write time = envelope created_timestamp, CD.9's day(last_updated_timestamp) does not apply to telemetry (amends 96 cl.1); row identity event_id = ULID-shaped, k-sortable, deterministic from event time + hash(tenant_id, project_id, external_ref), satisfying mint-once's idempotency purpose (amends 97 cl.2); derived-at-read state is partition-bounded (session_id + day window), answering Decision 81 cl.8's full-scan rationale; materialization only on a Decision 88 cl.2 measurement, mode owned by T2.52 c1."
  - "Decision 200 content: tenant_id + project_id NOT NULL on telemetry, stamped by the write boundary, never caller-supplied, part of the id hash; local tier = single deployment-configured tenant constant; cloud tier resolves tenant from the caller's authenticated identity; amends 197 cl.2 -- columns always present, tenancy ENFORCEMENT (auth mapping, isolation) remains the cloud-adapter property."
  - "Not in Decisions (routing, Decision 86): append_events verb rationale -> rec-4024 / docs/contracts/ducklake_writer.yaml; smoke-first -> T3.20 c8; PII/erasure -> rec-4029; T4.19 record-outcome criterion -> rec-4027."
  - "Existing text to reuse: telemetry_sessions governance_notes already records the running->terminal second session row (Decision 97 mint-once reuse)."
  - "Gotcha: check_amendment_for_diff is per FIELD -- every field whose description/semantics changes needs its own field-level amendment_log entry, not just the contract-level one (scripts/contracts_enforcement.py:55)."
  - "Gotcha: ChangeClass is a closed 8-value set with no field_remove; removals (ingested_at, local_path, transcripts.created_at) are not diff-checked but must be recorded in the contract-level amendment_log summary."
  - "Gotcha: _joins.yaml one_to_many joins from telemetry_sessions now fan out (several rows per session_id); state that the parent side is the derived session entity, not the raw event table."
  - "Roadmap text to write (freshness gate, operator-confirmed): T2.36 depends_on [T2.26] with inline comment citing rec-3792 (superseded); T2.36 intent note + c5 re-grounded onto Decision 188 G1-G4 and the append_only maintenance_policy class; files_in_scope adds scripts/schema_to_field_semantics.py and field_semantics.static.yaml; T2.18 c8 note records the dropped edge; T3.20 intent strikes the Decision 51 outbox and the CD.17 executor gate (cursor-over-transcript durability instead), depends_on [T2.36, T1.10], new open c8 smoke-first promotion gate, progress_note records c4 partial."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - "Only the plan-cited decision sections read: 95, 96, 97, 197, 147, 167, 177, 198 (as the envelope/annotation exemplar)"
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Create tests/checks/contracts/test_telemetry_event_journal_contracts.py with the five test
    functions named in test_obligations, loading contracts via scripts.contracts (load_contract +
    resolve_refs) so $ref-inherited nullability is exercised. Run it and confirm it FAILS on the
    unchanged contracts (red).
  - >-
    Create docs/contracts/tenant-id.yaml (Class C, ratified, modelled on project-id.yaml) and
    re-ground docs/contracts/project-id.yaml (repository identity, boundary-stamped, no "theseus"
    default) with amendment_log entries.
  - >-
    Re-model the four telemetry contracts per the stored-vs-derived rule and acceptance criteria:
    add event_id, event_kind (sessions: open|resume|compact|close; observations and agents:
    open|close|point), event_timestamp, created_timestamp (writer envelope, write time),
    tenant_id and project_id ($ref, tightened NOT NULL), producer, producer_version,
    parser_version; sessions also external_session_id. Remove ingested_at (all), local_path and
    created_at (transcripts). Re-mark derived fields. Set governance.partition_by to
