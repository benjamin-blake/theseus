infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset,
  so compute_affected_artifacts() reports it. NO deploy is performed or needed (Decision 198 precedent; asserted
  by VP step 8; rec-3990 tracks the asset deploy-trigger gap). No other scope file is Lambda-packaged; no .tf file
  is in scope.
acceptance_criteria:
- >-
  docs/contracts/telemetry-event-envelope.yaml (Class C, ratified) defines event_id, event_kind, event_timestamp,
  session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version and created_timestamp
  once; each of the four telemetry contracts $refs all of them plus tenant_id and project_id (tightened NOT NULL),
  declares governance.partition_by "day(session_started_at)", no longer declares ingested_at, and is at most 500
  effective lines (config/structural_size_budgets.yaml contracts class). NOT NULL means, after scripts.contracts.resolve_refs:
  nullable is False OR dq_intent.not_null.enforced is True (a $ref'd field tightens via dq_intent_local).
- >-
  Stored-vs-derived: every derived field carries derivation {timing: read, derived_by: <forward-declared reader-verb
  id>, formula, inputs, realized: false}; start/end/duration derived on sessions, observations and agents; roll-ups
  use distinct *_total names; steps_total STORED (known at open); post-close facts (pr_url, ci_outcome, coverage_after)
  are owned by the annotate event_kind; cost_usd derived at read (static price mapping for MVP; rec-4031), cost_usd_reported
  stored when a provider reports it.
- >-
  Per-event-kind nullability is structured: a stored field observed at only some event_kinds is nullable and declares
  dq_intent.required_when {event_kind: [...]}; no such field is NOT NULL table-wide.
- >-
  telemetry_transcripts declares content (nullable; the payload as the model received it, after credential scrub),
  content_uri (nullable; content-addressed port-relative key tenant/project/session_id/<content_sha256> resolved
  by the blob-port adapter), content_sha256, content_bytes and content_truncated (NOT NULL; computed over the ONE
  stored payload: when the harness persisted a sidecar (e.g. tool-results) the stored payload is the full sidecar
  and the in-transcript preview is not stored; when the sidecar is unavailable the preview is stored and content_truncated
  is true), purpose in {prompt, response, thinking, tool_input, tool_result, system}, origin in {human, harness,
  agent, tool} (hook/harness-generated tool_result text is origin harness), event_kind point only; exactly-one-of
  content/content_uri as a dq expression; dq_intent.content_inline_threshold_bytes: 65536 on content; no local_path,
  s3_key, size_bytes, created_at or raw_turn.
- >-
  telemetry_observations: event_kind in {open, close} for turn/tool_call/phase/step and {point} for model_call/process_event
  (agents: {open, close}; transcripts: {point}; sessions: {open, resume, compact, close, annotate}); observation_type
  includes turn and tool_call; model_call grain = one row per provider response id (entity_ref), tokens_input, tokens_output,
  tokens_cache_read, tokens_cache_creation stored on it once; outcome in {success, error, blocked, interrupted}
  required_when close for tool_call; process_event name grammar '<source>:<signature>' (e.g. hook:never_on_main,
  gate:validate_scope_boundary); NO stored friction_class, classifier_version or tier (friction derived at read;
  rec-4032 reserves the labels table).
- >-
  Identity is normative, stated once in telemetry-event-envelope.yaml and referenced identically by session-id.yaml,
  observation-id.yaml, parent-observation-id.yaml, telemetry_transcripts (transcript_id), telemetry_agents (agent_run_id)
  and the lexicon: H = sha256 over 4-byte big-endian length-prefixed UTF-8 (NFC) fields [domain tag '<table>:<id_role>',
  tenant_id, project_id, ref] with tenant_id/project_id in canonical uppercase ULID form; entity and FK keys = ULID(48-bit
  ROOT session_started_at ms + the first 80 bits (bytes 0-9, big-endian) of H); event_id = ULID(48-bit event_timestamp
  ms + first 80 bits of H over external_ref with tag '<table>:event'); FKs use the PARENT's domain tag so they equal
  the parent key; external_ref grammar '<source_record_id>#<block_index>/<row_role>'; refs unique within (tenant,
  project, table); DuckLake enforces no uniqueness, so dedupe is a READ-SIDE invariant: readers keep one row per
  event_id (max parser_version, then earliest created_timestamp; rows sharing an event_id from different producers
  are duplicates of one event), and the writer's anti-join on (event_id, parser_version) is best-effort; a parser
  change that stops emitting a row kind must re-emit the whole root tree and is otherwise a documented limitation;
  model_call external_ref is '<provider_response_id>/model_call' for EVERY producer (Claude Code transcript parser
  and LiteLLM alike) and is owned by the last source record carrying that response id (final usage), so one API
  response yields one model_call row whichever producer or record saw it; a failed call with no response id uses
  the producer call id (e.g. litellm_call_id); session_started_at is pinned as the first record carrying a timestamp
  in the ROOT transcript, parsed as UTC and truncated (not rounded) to ms -- a producer that cannot read the root
  defers, never guesses; producers without a transcript (LiteLLM, CI annotate) receive session_ref/project_ref and
  the root session_started_at via producer metadata, or decode session_started_at from a held session_id's ULID
  prefix; ids never caller-supplied.
- >-
  Session trees: every row of a root session and all its sub-agent sessions carries the ROOT session's session_started_at
  (source-derived from the first record of the root transcript, never a warehouse lookup), so a trace tree is one
  partition; sub-agent session entity_ref '<sessionId>:<agentId>' (agentId deterministic across re-parse), parent_session_ref
  = parent sessionId; telemetry_agents entity_ref = spawning toolUseId, session_ref = child session ref, observation_ref
  (nullable) = spawning tool_call ref; turn entity_ref = '<session entity_ref>/<promptId>' (sub-agent records may
  reuse the parent's promptId); per-row entity_ref/observation_ref: process_event entity_ref = its external_ref
  and observation_ref = the tool_call/turn it concerns; transcript entity_ref = '<source_record_id>#<block_index>',
  with observation_ref = the turn (prompt), the model_call (thinking, response, tool_input) or the tool_call (tool_result);
  annotate rows: external_ref '<source_id>#0/annotate:<attribute>', event_timestamp = the source event time, latest
  event_timestamp wins per (session, attribute); rec_ids stored on open/annotate session events, joined tenant-locally.
- >-
  docs/contracts/tenant-id.yaml exists as a ratified Class C contract; project-id.yaml names no git-remote identity
  and no 'theseus' default; session-id, observation-id, parent-observation-id and project-id are at contract_version
  2 with previous_versions entries; NO ops_tenants/ops_projects contract is created here (rec-4024 authors them
  with their registration).
- >-
  Every changed contract.description and field description/semantics carries a new amendment_log entry satisfying
  check_amendment_for_diff; each changed Class D contract carries a new top-level amendment_log entry.
- >-
  docs/DECISIONS.md carries exactly one '## Decision 199:' (amends [95, 96, 97], body naming 95 clauses 1, 2 and
  4, 96 clauses 1 and 3, and EACH of 97 clauses 1, 2, 3 and 4 individually, e.g. 'clause 2') and one '## Decision
  200:' (amends [197]), each with a bare yaml envelope, numbered_decision significance with a contract-first justification
  (200's justification rests on the 197 cl.2 re-map and the cross-tier tenancy model), a trailing '---' separator,
  and <= 6144 bytes.
- >-
  Decisions 95, 96 and 97 carry dated blockquotes naming Decision 199 and 197 one naming Decision 200; no line of
  those spans is removed versus origin/main.
- >-
  docs/ROADMAP-PLATFORM.yaml: T2.26 complete, completed_at set, Decision 147 clause 2 compact form (no progress_note,
  no decomposition_hints, one-line intent; files_in_scope reduced to the single guard-read entry scripts/s3_log_store.py
  that registry check ops-session-log-roadmap-regrounded asserts -- the Decision 147 cl.1 retained-literal carve-out);
  every pointer to 'T2.26's progress_note' (T2.18 c4, T2.18 c8, T2.19, T3.20 c5) re-pointed to PLAN-t2-26-retire-ops-session-log;
  T2.36 depends_on [T2.26], c1 names day(session_started_at), c5 re-grounded; T3.20 depends_on [T2.36, T1.10], open
  c8 smoke-first gate, c4 open, no Decision 51 outbox text; T2.36 and T3.20 stay not_started; T4.23 gains an open
  forward-work criterion for the content blob-port local adapter; <= 10,000 lines.
- >-
  tests/checks/contracts/test_telemetry_event_journal_contracts.py fails on the pre-change tree and passes on the
  implemented tree; phrase assertions are case-insensitive over whitespace-normalised text.
- >-
  bin/venv-python -m scripts.decisions_index --check reports current, and both bin/venv-python -m scripts.validate
  --pre and the full tier bin/venv-python -m scripts.validate exit 0.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run the new contract-invariant test module (loads every scope contract through scripts.contracts load_contract
    + resolve_refs and asserts the event-journal, identity, content, dimension, lexicon and substrate invariants).
  command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_event_journal_contracts.py -q
  expected: 'Exit 0, all tests passed. Red before: the module does not exist on the pre-change tree.'
  fix_if: >-
    A failing assertion names the contract and field; fix the contract, not the test, unless the test encodes something
    the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-event-journal-contract-shape
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    Confirm every contract still parses through the ritual document model and the lexicon still resolves its canonical
    tables.
  command: >-
    bin/venv-python -m pytest tests/test_contracts.py tests/test_contracts_schema.py tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    -q
  expected: Exit 0; no contract fails to load under extra=forbid.
  fix_if: >-
    An unknown key means a property was added outside FieldSpec/ContractGovernance -- express it inside an existing
    free-dict block (derivation, dq_intent) instead; never widen the schema.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing registered test modules; graduating them again duplicates standing coverage.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    Confirm the amendment ritual: the eight ritual contracts through check_amendment_for_diff and the four Class
    D contracts through check_amendment_log_for_class_d, against origin/main. (The new Class C contracts telemetry-event-envelope.yaml
    and tenant-id.yaml have no base and are covered by step 1 and the full-tier drift gate.)
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from scripts.contracts_enforcement
    import check_amendment_for_diff;from scripts.checks.contracts._population import check_amendment_log_for_class_d;base=lambda
    f:yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in ('telemetry_sessions', 'telemetry_observations', 'telemetry_transcripts', 'telemetry_agents', 'project-id',
    'observation-id', 'parent-observation-id', 'session-id')];[errs.append(f+': '+e) for f in ('storage-substrate',
    'telemetry-lexicon', '_joins', 'data-modeling-standard') for e in [check_amendment_log_for_class_d(base(f),head(f))]
    if e];print(chr(10).join(errs) or 'AMENDMENTS_OK');assert not errs"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A category-6 error names a field -- add a field-level amendment_log entry with a consistent change_class/semantic_break
    pairing; a Class D error means a body change with no new top-level amendment_log entry. Never drop a file from
    the lists.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main by construction; the standing equivalent is scripts.validate's contract drift gate.
- step: 4
  phase: pre-deploy
  action: >-
    Confirm Decisions 199 and 200 exist once each with parseable envelopes, the required amends edges, numbered_decision
    significance, <= 6144 bytes, and that Decision 199 names Decision 97 clauses 1 to 4.
  command: >-
    bin/venv-python -c "import re,yaml;raw=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1)))
    for m in re.finditer(r'^## Decision (\d+):',raw,re.M)];want={199:{95,96,97},200:{197}};cnt={n:sum(1 for _,k
    in h if k==n) for n in want};assert all(v==1 for v in cnt.values()),cnt;spans={n:raw[s:(h[i+1][0] if i+1<len(h)
    else len(raw))] for i,(s,n) in enumerate(h) if n in want};env={n:yaml.safe_load(re.search(r'\x60\x60\x60yaml\n(.*?)\n\x60\x60\x60',sp,re.S).group(1))
    for n,sp in spans.items()};bad=[n for n in want if not (env[n]['number']==n and set(env[n]['amends'])>=want[n]
    and env[n]['significance']['value']=='numbered_decision' and len(spans[n].encode('utf-8'))<=6144)];cl=[c for
    c in ('clause 1','clause 2','clause 3','clause 4') if c not in spans[199].lower().replace('cl.','clause ')];print('bad',bad,'missing-97-clauses',cl);assert
    not bad and not cl;print('DECISIONS_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A heading count other than 1 is a numbering race -- renumber and update every pointer. Over the cap: move normative
    detail into the contracts (governance_notes), never a larger entry.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Pinned to two entry numbers -- a standing row would assert a frozen fact; validate_decisions_size guards the
    cap generally.
  expected_literals: []
- step: 5
  phase: pre-deploy
  action: Confirm Decisions 95, 96, 97 and 197 lost no line and each carries its dated amendment blockquote.
  command: >-
    bin/venv-python -c "import re,subprocess;raw=open('docs/DECISIONS.md',encoding='utf-8').read();base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True,check=True).stdout;spans=lambda
    t:{int(m.group(1)):m.group(0) for m in re.finditer(r'^## Decision (\d+):.*?(?=^## Decision \d+:|\Z)',t,re.M|re.S)};b=spans(base);c=spans(raw);bad=[n
    for n in (95,96,97,197) if any(l not in c[n].splitlines() for l in b[n].splitlines())];miss=[n for n,t in ((95,'Decision
    199'),(96,'Decision 199'),(97,'Decision 199'),(197,'Decision 200')) if not re.search(r'^> \*\*Amended by '+t,c[n],re.M)];print('lost-lines',bad,'missing-annotation',miss);assert
    not bad and not miss;print('APPEND_ONLY_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: Restore any removed body line verbatim; amendments are appended blockquotes only (Decision 177).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main and pinned to four entries; validate_supersession_annotations is the standing guard
    for the annotation half.
- step: 6
  phase: pre-deploy
  action: >-
    Confirm the roadmap bookkeeping: schema loads; T2.26 complete and compact (no progress_note); T2.36/T3.20 edges,
    criteria and statuses; outbox text struck; no dangling pointer to T2.26's removed progress_note; <= 10,000 lines.
  command: >-
    bin/venv-python -m scripts.roadmap.platform_roadmap > /dev/null && bin/venv-python -c "import yaml;raw=open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8').read();n=raw.count(chr(10));d={i['id']:i
    for i in yaml.safe_load(raw)['tier_items']};t26,t36,t320=d['T2.26'],d['T2.36'],d['T3.20'];c=lambda i,k:[x for
    x in i['exit_criteria'] if x['id']==k][0];checks={'lines':n<=10000,'t226':t26['status']=='complete' and bool(t26.get('completed_at'))
    and 'progress_note' not in t26 and t26.get('files_in_scope')==['scripts/s3_log_store.py'],'t423':any('blob'
    in x['text'].lower() and x['status']=='open' for x in d['T4.23']['exit_criteria']),'t236dep':t36['depends_on']==['T2.26'],'t236c1':'day(session_started_at)'
    in c(t36,'c1')['text'],'t320dep':t320['depends_on']==['T2.36','T1.10'],'statuses':t36['status']=='not_started'
    and t320['status']=='not_started','t320c8':c(t320,'c8')['status']=='open','t320c4':c(t320,'c4')['status']=='open','outbox':'Decision
    51 outbox' not in t320['intent'],'dangling':(chr(84)+'2.26'+chr(39)+'s progress_note') not in raw};print(n,checks);assert
    all(checks.values());print('ROADMAP_OK')"
  expected: Exit 0 and the success marker printed, line count at or under 10000.
  fix_if: >-
    Over the ceiling: confirm T2.26 is fully in the Decision 147 clause 2 compact form; never trim a live item or
