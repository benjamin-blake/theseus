      created_at absent; s3_key nullable; purpose includes thinking, tool_result, raw_turn.
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_transcripts_content_model
    red_green_expectation: red before, green after
  - source: docs/contracts/telemetry_agents.yaml
    behavior: >-
      event_id row identity and shared event fields present; started_at/ended_at/duration_seconds
      and token totals derived with timing read.
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_agents_event_journal_shape
    red_green_expectation: red before, green after
  - source: docs/contracts/tenant-id.yaml
    behavior: >-
      Ratified Class C tenant_id, NOT NULL, boundary-stamped; each telemetry contract references
      it and tightens project_id to NOT NULL; project-id.yaml names no "theseus" default.
    verification_step: 1
    test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_tenant_and_project_identity
