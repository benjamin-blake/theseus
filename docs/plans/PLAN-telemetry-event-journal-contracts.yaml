schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-event-journal-contracts
intent: >-
  Re-model the canonical telemetry contracts as append-only event journals whose state, friction classification
  and cost are derived at read; settle one normative, restart-proof identity model (boundary-derived ids over tenant/project/source
  refs, backed by SCD2 tenant and project dimensions); and fix the content tier (inline plus blob port) -- recorded
  in Decisions 199 and 200 -- so the writer (rec-4024), verification harness (rec-4025) and turn capture (rec-4026)
  build against one settled schema. Friction telemetry is the foundation of automated RCA and recursive self-improvement
  (PROJECT_CONTEXT).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-event-journal-contracts.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake) and T3.20 (agent-turn capture) -- contract/decision groundwork for both.
  Closes NO exit criterion (T2.36 c1 needs tables provisioned by rec-4024; T3.20 c4 stays open, Decision 136). Also
  lands operator-confirmed Tier Item Freshness Gate bookkeeping on T2.26, T2.36, T2.18, T2.19 and T3.20.
scope:
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    Event-journal grain (one row per session lifecycle event: open|resume|compact|close|annotate), stored-vs-derived
    split, shared event/identity/anchor fields, partition day(session_started_at), contract_version 2 (Decision
    118 ritual).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    Event-journal grain (open/close for phase/step/turn/tool_call, one closed row for model_call/process_event);
    observation_type + turn/tool_call; token classes + cost_usd_reported on model_call; friction NOT stored (derived
    at read from observed process_event facts with stable name signatures); shared fields; contract_version 2.
- file: docs/contracts/telemetry_transcripts.yaml
  action: Modify
  purpose: >-
    Pointer model replaced by the hybrid content model behind a blob port (inline content <= threshold XOR content_uri),
    per-block rows with purpose + origin vocabularies, thinking captured provider-neutrally, shared fields, contract_version
    2.
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: >-
    Agent-run event grain with a derived entity key (entity_ref = spawning tool call ref), child-session and spawning-observation
    refs, derived token totals via the child session, shared fields, contract_version 2.
- file: docs/contracts/ops_tenants.yaml
  action: Create
  purpose: >-
    New Class A SCD2 dimension (merge_key tenant_id): one row per tenant version; attributes (display name, tier,
    created_at).
- file: docs/contracts/ops_projects.yaml
  action: Create
  purpose: >-
    New Class A SCD2 dimension (merge_key project_id): one row per project version; tenant_id, name, normalized
    git remote, registration_status (registered|unregistered) and canonical_project_id for remapping unregistered
    projects without rewriting facts.
- file: docs/contracts/tenant-id.yaml
  action: Create
  purpose: >-
    New Class C invariant: opaque immutable tenant id (ULID minted at registration), NOT NULL, resolved at the write
    boundary (local tier: configured constant; cloud tier: caller's authenticated identity), never caller-supplied.
- file: docs/contracts/project-id.yaml
  action: Modify
  purpose: >-
    project_id = opaque immutable id minted at registration, committed in-repo and sent by the caller as project_ref,
    validated at the boundary against the tenant's registered projects; name/remote are dimension attributes; the
    stale 'theseus' default retired (Decision 198). Base stays nullable; telemetry inheritors tighten to NOT NULL.
- file: docs/contracts/observation-id.yaml
  action: Modify
  purpose: >-
    Mint-once-at-open and the time-ordered-key claim replaced by the normative write-boundary derivation (Decision
    199, amending 97 cl.1/cl.2).
- file: docs/contracts/parent-observation-id.yaml
  action: Modify
  purpose: >-
    Producer-side propagation ('never re-mints', 97 cl.3) replaced by boundary derivation from parent_observation_ref
    using the parent's domain tag.
- file: docs/contracts/session-id.yaml
  action: Modify
  purpose: >-
    session_id/parent_session_id derived at the boundary from entity_ref / parent_session_ref (sub-agent session
    entity_ref '<sessionId>:<agentId>'); the UUID4 grandfather note retired (97 cl.4); the planning_session_id soft-FK
    note points at rec-4030.
- file: docs/contracts/telemetry-lexicon.yaml
  action: Modify
  purpose: >-
    REWRITE temporal (event_time_column event_timestamp; partition map day(session_started_at) for all four tables)
    and identity (normative hash spec; entity keys = 'ULID-shaped hash ids', not time-ordered; event_id = ULID);
    add vocabulary: event journal, event_kind values, turn, tool_call, origin, purpose, session_started_at, source_ordinal,
    producer, blob port, derived-at-read.
- file: docs/contracts/_joins.yaml
  action: Modify
  purpose: >-
    Re-state cardinalities for event-journal grain (fan-out warning: parent side = derived entity), re-state the
    EXISTING parent_observation_id_join_observations_self_tree (no new id), add joins to ops_tenants/ops_projects
    and agents->child session / spawning observation.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    Reconcile rule identity-ulid-at-boundary's STATEMENT (and design_time_walk step 3) with boundary derivation
    for event tables via a carve-out pointing at Decision 199; add a derived-state rule scoped to append_only telemetry
    (derived at read in named reader verbs; derivation.timing read = no physical column; materialization mode owned
    by T2.52 c1).
- file: docs/contracts/storage-substrate.yaml
  action: Modify
  purpose: >-
    telemetry_tables entry (incl. disposition) re-grounded: event journal, day(session_started_at), content blob
    port, the two dimension tables; new amendment_log entry (Class D, Decision 168).
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Add Decision 199 (telemetry event-journal model; amends 95, 96 cl.1+cl.3, 97 cl.1-4) and Decision 200 (tenant
    and project identity + SCD2 dimensions; amends 197 cl.2); append dated 'Amended by' blockquotes to 95, 96, 97,
    197 without rewriting any line (Decision 177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerate so validate_decisions_index_freshness stays green.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Operator-confirmed freshness-gate bookkeeping on T2.26, T2.36, T2.18, T2.19 and T3.20 (see context); stays <=
    10,000 lines (Decision 114).
- file: .secrets.baseline
  action: Modify
  purpose: detect-secrets line-number drift for existing ROADMAP hex-entropy entries only.
- file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
  action: Create
  purpose: >-
    Red-before/green-after invariants over every contract in scope (see test_obligations); phrase checks case-insensitive
    on whitespace-normalised text.
bundled_recommendations: []
followon_recs:
- rec-4024
- rec-4025
- rec-4026
- rec-4027
- rec-4028
- rec-4029
- rec-4030
- rec-4031
- rec-4032
- rec-4033
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset,
  so compute_affected_artifacts() reports it. NO deploy is performed or needed (Decision 198 precedent; asserted
  by VP step 8; rec-3990 tracks the asset deploy-trigger gap). No other scope file is Lambda-packaged; no .tf file
  is in scope.
acceptance_criteria:
- >-
  Each of the four telemetry contracts declares governance.partition_by "day(session_started_at)" and carries NOT
  NULL event_id, event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, tenant_id,
  project_id, producer, producer_version, parser_version and created_timestamp, and no longer declares ingested_at.
  NOT NULL means, after scripts.contracts.resolve_refs: nullable is False OR dq_intent.not_null.enforced is True
  (a $ref'd field tightens via dq_intent_local).
- >-
  Stored-vs-derived: every derived field carries derivation {timing: read, derived_by: <forward-declared reader-verb
  id>, formula, inputs, realized: false}; start/end/duration derived on sessions, observations and agents; roll-ups
  use distinct *_total names; steps_total STORED (known at open); post-close facts (pr_url, ci_outcome, coverage_after)
  are owned by the annotate event_kind; cost_usd derived at read (static price mapping for MVP; rec-4031), cost_usd_reported
  stored when a provider reports it.
- >-
  Per-event-kind nullability is structured: a stored field observed at only some event_kinds is nullable and declares
  dq_intent.required_when {event_kind: [...]}; no such field is NOT NULL table-wide.
- >-
  telemetry_transcripts declares content (nullable), content_uri (nullable), content_sha256 and content_bytes (NOT
  NULL, over the FULL payload), purpose in {prompt, response, thinking, tool_input, tool_result, system}, origin
  in {human, harness, agent, tool}, event_kind point only; exactly-one-of content/content_uri is a declared dq expression;
  the inline threshold (64 KiB default) is a named governed config value; no local_path, created_at or raw_turn.
- >-
  telemetry_observations: observation_type includes turn and tool_call; tokens_input, tokens_output, tokens_cache_read,
  tokens_cache_creation stored on model_call rows only; NO stored friction_class or classifier_version (friction
  derived at read; rec-4032 reserves the labels table).
- >-
  Identity is normative and identical across session-id.yaml, observation-id.yaml, parent-observation-id.yaml, telemetry_transcripts
  (transcript_id), telemetry_agents and the lexicon: H = sha256 over 4-byte-big-endian-length-prefixed UTF-8 (NFC)
  fields [domain tag '<table>:<id_role>', tenant_id, project_id, ref]; entity/FK keys = 128 bits of H with the top
  2 bits cleared, Crockford base32 (26 chars), described as 'ULID-shaped hash ids', NOT time-ordered; event_id =
  ULID(48-bit event_timestamp ms + 80 bits of H); FKs use the PARENT's domain tag so they equal the parent key;
  refs unique within (tenant, project, table); row uniqueness (event_id, parser_version), readers keep max parser_version;
  ids never caller-supplied.
- >-
  Sub-agents: session entity_ref '<sessionId>:<agentId>' (agentId deterministic across re-parse), parent_session_ref
  = parent sessionId; telemetry_agents entity_ref = the spawning tool call ref, session_ref = child session ref,
  observation_ref (nullable) = spawning tool_call ref; turn entity_ref = the source prompt id.
- >-
  docs/contracts/tenant-id.yaml exists as a ratified Class C contract; docs/contracts/ops_tenants.yaml and ops_projects.yaml
  exist as ratified Class A SCD2 contracts (table_class scd2, merge_key tenant_id / project_id); project-id.yaml
  names no git-remote identity and no 'theseus' default.
- >-
  Every changed contract.description and field description/semantics carries a new amendment_log entry satisfying
  check_amendment_for_diff; each changed Class D contract carries a new top-level amendment_log entry.
- >-
  docs/DECISIONS.md carries exactly one '## Decision 199:' (amends [95, 96, 97], body naming 96 clauses 1 and 3
  and EACH of 97 clauses 1, 2, 3 and 4 individually, e.g. 'clause 2') and one '## Decision 200:' (amends [197]),
  each with a bare yaml envelope, numbered_decision significance with a contract-first justification (200's justification
  rests on the 197 cl.2 re-map and the cross-tier tenancy model), a trailing '---' separator, and <= 6144 bytes.
- >-
  Decisions 95, 96 and 97 carry dated blockquotes naming Decision 199 and 197 one naming Decision 200; no line of
  those spans is removed versus origin/main.
- >-
  docs/ROADMAP-PLATFORM.yaml: T2.26 complete, completed_at set, Decision 147 clause 2 compact form (no progress_note,
  no decomposition_hints, one-line intent, empty files_in_scope); every pointer to 'T2.26's progress_note' (T2.18
  c4, T2.18 c8, T2.19, T3.20 c5) re-pointed to PLAN-t2-26-retire-ops-session-log; T2.36 depends_on [T2.26], c1 names
  day(session_started_at), c5 re-grounded; T3.20 depends_on [T2.36, T1.10], open c8 smoke-first gate, c4 open, no
  Decision 51 outbox text; T2.36 and T3.20 stay not_started; <= 10,000 lines.
- >-
  tests/checks/contracts/test_telemetry_event_journal_contracts.py fails on the pre-change tree and passes on the
  implemented tree; phrase assertions are case-insensitive over whitespace-normalised text.
- >-
  bin/venv-python -m scripts.decisions_index --check reports current and the full tier bin/venv-python -m scripts.validate
  exits 0.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run the new contract-invariant test module (loads every scope contract through scripts.contracts load_contract
    + resolve_refs and asserts the event-journal, identity, content, dimension, lexicon and substrate invariants).
  command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_event_journal_contracts.py -q
  expected: 'Exit 0, all tests passed. Red before: the module does not exist on the pre-change tree.'
  fix_if: >-
    A failing assertion names the contract and field; fix the contract, not the test, unless the test encodes something
    the acceptance criteria do not require.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-event-journal-contract-shape
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    Confirm every contract still parses through the ritual document model and the lexicon still resolves its canonical
    tables.
  command: >-
    bin/venv-python -m pytest tests/test_contracts.py tests/test_contracts_schema.py tests/checks/contracts/test_validate_telemetry_lexicon_tables.py
    -q
  expected: Exit 0; no contract fails to load under extra=forbid.
  fix_if: >-
    An unknown key means a property was added outside FieldSpec/ContractGovernance -- express it inside an existing
    free-dict block (derivation, dq_intent) instead; never widen the schema.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing registered test modules; graduating them again duplicates standing coverage.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    Confirm the amendment ritual: the eight ritual contracts through check_amendment_for_diff and the four Class
    D contracts through check_amendment_log_for_class_d, against origin/main. (The two NEW dimension contracts and
    tenant-id.yaml have no base and are covered by step 1 and the full-tier drift gate.)
  command: >-
    bin/venv-python -c "import subprocess,yaml;from scripts.contracts_schema import ContractDocument;from scripts.contracts_enforcement
    import check_amendment_for_diff;from scripts.checks.contracts._population import check_amendment_log_for_class_d;base=lambda
    f:yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/%s.yaml'%f],capture_output=True,text=True,check=True).stdout);head=lambda
    f:yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8'));errs=[];[errs.extend(check_amendment_for_diff(ContractDocument.model_validate(base(f)),ContractDocument.model_validate(head(f))))
    for f in ('telemetry_sessions', 'telemetry_observations', 'telemetry_transcripts', 'telemetry_agents', 'project-id',
    'observation-id', 'parent-observation-id', 'session-id')];[errs.append(f+': '+e) for f in ('storage-substrate',
    'telemetry-lexicon', '_joins', 'data-modeling-standard') for e in [check_amendment_log_for_class_d(base(f),head(f))]
    if e];print(chr(10).join(errs) or 'AMENDMENTS_OK');assert not errs"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A category-6 error names a field -- add a field-level amendment_log entry with a consistent change_class/semantic_break
    pairing; a Class D error means a body change with no new top-level amendment_log entry. Never drop a file from
    the lists.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main by construction; the standing equivalent is scripts.validate's contract drift gate.
- step: 4
  phase: pre-deploy
  action: >-
    Confirm Decisions 199 and 200 exist once each with parseable envelopes, the required amends edges, numbered_decision
    significance, <= 6144 bytes, and that Decision 199 names Decision 97 clauses 1 to 4.
  command: >-
    bin/venv-python -c "import re,yaml;raw=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1)))
    for m in re.finditer(r'^## Decision (\d+):',raw,re.M)];want={199:{95,96,97},200:{197}};cnt={n:sum(1 for _,k
    in h if k==n) for n in want};assert all(v==1 for v in cnt.values()),cnt;spans={n:raw[s:(h[i+1][0] if i+1<len(h)
    else len(raw))] for i,(s,n) in enumerate(h) if n in want};env={n:yaml.safe_load(re.search(r'\x60\x60\x60yaml\n(.*?)\n\x60\x60\x60',sp,re.S).group(1))
    for n,sp in spans.items()};bad=[n for n in want if not (env[n]['number']==n and set(env[n]['amends'])>=want[n]
    and env[n]['significance']['value']=='numbered_decision' and len(spans[n].encode('utf-8'))<=6144)];cl=[c for
    c in ('clause 1','clause 2','clause 3','clause 4') if c not in spans[199].lower().replace('cl.','clause ')];print('bad',bad,'missing-97-clauses',cl);assert
    not bad and not cl;print('DECISIONS_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A heading count other than 1 is a numbering race -- renumber and update every pointer. Over the cap: move normative
    detail into the contracts (governance_notes), never a larger entry.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Pinned to two entry numbers -- a standing row would assert a frozen fact; validate_decisions_size guards the
    cap generally.
  expected_literals: []
- step: 5
  phase: pre-deploy
  action: Confirm Decisions 95, 96, 97 and 197 lost no line and each carries its dated amendment blockquote.
  command: >-
    bin/venv-python -c "import re,subprocess;raw=open('docs/DECISIONS.md',encoding='utf-8').read();base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True,check=True).stdout;spans=lambda
    t:{int(m.group(1)):m.group(0) for m in re.finditer(r'^## Decision (\d+):.*?(?=^## Decision \d+:|\Z)',t,re.M|re.S)};b=spans(base);c=spans(raw);bad=[n
    for n in (95,96,97,197) if any(l not in c[n].splitlines() for l in b[n].splitlines())];miss=[n for n,t in ((95,'Decision
    199'),(96,'Decision 199'),(97,'Decision 199'),(197,'Decision 200')) if not re.search(r'^> \*\*Amended by '+t,c[n],re.M)];print('lost-lines',bad,'missing-annotation',miss);assert
    not bad and not miss;print('APPEND_ONLY_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: Restore any removed body line verbatim; amendments are appended blockquotes only (Decision 177).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative to origin/main and pinned to four entries; validate_supersession_annotations is the standing guard
    for the annotation half.
- step: 6
  phase: pre-deploy
  action: >-
    Confirm the roadmap bookkeeping: schema loads; T2.26 complete and compact (no progress_note); T2.36/T3.20 edges,
    criteria and statuses; outbox text struck; no dangling pointer to T2.26's removed progress_note; <= 10,000 lines.
  command: >-
    bin/venv-python -m scripts.roadmap.platform_roadmap > /dev/null && bin/venv-python -c "import yaml;raw=open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8').read();n=raw.count(chr(10));d={i['id']:i
    for i in yaml.safe_load(raw)['tier_items']};t26,t36,t320=d['T2.26'],d['T2.36'],d['T3.20'];c=lambda i,k:[x for
    x in i['exit_criteria'] if x['id']==k][0];checks={'lines':n<=10000,'t226':t26['status']=='complete' and bool(t26.get('completed_at'))
    and 'progress_note' not in t26,'t236dep':t36['depends_on']==['T2.26'],'t236c1':'day(session_started_at)' in
    c(t36,'c1')['text'],'t320dep':t320['depends_on']==['T2.36','T1.10'],'statuses':t36['status']=='not_started'
    and t320['status']=='not_started','t320c8':c(t320,'c8')['status']=='open','t320c4':c(t320,'c4')['status']=='open','outbox':'Decision
    51 outbox' not in t320['intent'],'dangling':(chr(84)+'2.26'+chr(39)+'s progress_note') not in raw};print(n,checks);assert
    all(checks.values());print('ROADMAP_OK')"
  expected: Exit 0 and the success marker printed, line count at or under 10000.
  fix_if: >-
    Over the ceiling: confirm T2.26 is fully in the Decision 147 clause 2 compact form; never trim a live item or
    raise the ceiling. A dangling pointer: re-point it to PLAN-t2-26-retire-ops-session-log.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    One-off bookkeeping state of specific items; validate_platform_roadmap is the standing schema and ceiling guard.
  expected_literals: []
- step: 7
  phase: pre-deploy
  action: >-
    Stale-reference sweep over the live bodies (amendment_log/previous_versions excluded, case-insensitive, whitespace-normalised)
    of the four telemetry contracts, the lexicon, storage-substrate and the three identity contracts: no retired
    partition basis, pointer/ingest field, raw_turn, stored friction class, or mint-once/never-re-mints wording
    survives.
  command: >-
    bin/venv-python -c "import yaml,re;fs=['telemetry_sessions','telemetry_observations','telemetry_transcripts','telemetry_agents','telemetry-lexicon','storage-substrate','observation-id','parent-observation-id','session-id'];pat=re.compile(r'day\(started_at\)|day\(created_at\)|day\(event_timestamp\)|ingested_at|local_path|raw_turn|friction_class|event_time_column:
    started_at|minted exactly once|never re-mints',re.I);strip=lambda d:{k:(strip(v) if isinstance(v,dict) else
    v) for k,v in d.items() if k not in ('amendment_log','previous_versions')};hits={f:pat.findall(' '.join(yaml.safe_dump(strip(yaml.safe_load(open('docs/contracts/%s.yaml'%f,encoding='utf-8')))).split()))
    for f in fs};hits={k:v for k,v in hits.items() if v};print('stale',hits);assert not hits;print('SWEEP_OK')"
  expected: Exit 0 and the success marker printed; the stale map is empty.
  fix_if: Rewrite the named file's live text to the new model; never delete history entries to pass.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: One-time retirement sweep; after merge every swept file is guarded by the graduated
    step-1 module.
  expected_literals: []
- step: 8
  phase: pre-deploy
  action: >-
    Assert the ground for NO Lambda redeploy despite touching the data-pipeline packaged roadmap asset (Decision
    198 precedent).
  command: >-
    grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q 'ROADMAP-PLATFORM'
    .github/workflows/deploy-prod-lambdas.yml
  expected: 'Exit 0: schedules still disabled and the deploy channel does not path-trigger on the roadmap.'
  fix_if: >-
    If schedules are re-enabled the V2 tier no longer holds -- escalate to V3 via the governed deploy-prod-lambdas
    workflow, never a local build_lambda --deploy. If the workflow path-triggers on the roadmap, rec-3990 landed;
    retire this step.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Green on the un-implemented tree (both facts hold today), so graduating would redden this plan's own PR under
    RED-BEFORE replay; its durable form is rec-3990.
  expected_literals: []
- step: 9
  phase: pre-deploy
  action: Confirm the decisions index is current, then run the full validation tier per the handoff policy.
  command: bin/venv-python -m scripts.decisions_index --check && bin/venv-python -m scripts.validate
  expected: Both exit 0.
  fix_if: >-
    Regenerate the index (bin/venv-python -m scripts.decisions_index) and rerun; fix any other failure at its root
    (Decision 55), never skip a check.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: docs/contracts/telemetry_sessions.yaml
  behavior: >-
    Event-journal shape: event_kind in open|resume|compact|close|annotate; partition day(session_started_at); shared
    NOT NULL fields present; no ingested_at; derived fields carry derivation.timing read; per-event-kind nullability
    expressed as dq_intent.required_when.
  verification_step: 1
  test_selector: tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_sessions_event_journal_shape
  red_green_expectation: red before (module absent / fields absent), green after
- source: docs/contracts/telemetry_observations.yaml
  behavior: >-
    observation_type includes turn and tool_call; model_call rows store the four token classes and cost_usd_reported;
    no stored friction_class/classifier_version; roll-ups use distinct *_total derived names; session_ref NOT NULL,
    parent_observation_ref nullable.
  verification_step: 1
  test_selector: >-
