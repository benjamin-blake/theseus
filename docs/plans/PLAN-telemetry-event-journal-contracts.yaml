  Re-model the four telemetry contracts per the constraints and acceptance criteria (shared fields; per-table event_kind
  vocabularies; paired *_ref columns whose nullability follows their id; derived fields with derivation.timing read;
  dq_intent.required_when for per-event-kind fields; transcripts hybrid content model); set governance.partition_by
  day(session_started_at); contract_version 2 with refreshed ratified_at/ratified_via, a previous_versions entry
  (shape in context), contract- and field-level amendment_log entries, governance_notes citing Decisions 199 and
  200.
- >-
  Update telemetry-lexicon.yaml, _joins.yaml, data-modeling-standard.yaml and storage-substrate.yaml per their scope
  purposes, each with a new amendment_log entry. Rerun VP steps 1, 2 and 3 until green.
- >-
  Decision 199 commitments: event-journal grain (amends 95 cl.1 sessions, cl.2 observations as open/close event
  rows, cl.4 agents as an agent-run event grain); partition day(session_started_at) with source-derived event_timestamp
  as event-time column and created_timestamp as write time, CD.9 day(last_updated_timestamp) not applicable (amends
  96 cl.1; 96 cl.3's mint-once pointer follows 97); identity per the normative hash spec in telemetry-event-envelope.yaml
  -- entity and FK keys derived at the write boundary from caller-supplied refs as ULIDs time-prefixed by the ROOT
  session start (reader verbs decode the prefix into a session_started_at partition predicate, and a trace tree
  clusters), event_id a k-sortable ULID over event time, row uniqueness (event_id, parser_version) with per-(session,
  producer) parser supersession (amends 97 cl.1-4, retiring the UUID4 grandfather); external_ref realizes T1.10's
  idempotency key for telemetry; state, friction classification and cost derived at read in named reader verbs,
  bounded to a session's single day(session_started_at) partition (answers Decision 81 cl.8), materialization only
  on a Decision 88 cl.2 measurement (mode: T2.52 c1); content tier = inline <= threshold else blob port (S3 / local
  dir), blob put before row write, orphans swept (rec-4033); the content column's catalog-stats egress is a measure-before-volume
  obligation on rec-4024.Decision 200 commitments: tenant_id and project_id are opaque immutable ULIDs minted by
  the writer's registration verb, NOT NULL on telemetry, resolved at the write boundary (tenant: configured constant
  locally / authenticated identity in cloud; project: caller-sent project_ref, an unknown ref auto-registering an
  'unregistered' row whose id is permanent), included in every id hash; SCD2 dimensions ops_tenants/ops_projects
  (contracts authored with registration in rec-4024) carry mutable attributes, and unregistered projects are remapped
  via canonical_project_id, never by rewriting facts; amends 197 cl.2 (tenancy is tenant_id; project_id is repository
  identity; columns always present, tenancy ENFORCEMENT stays the cloud-adapter property).  Add Decisions 199 and
