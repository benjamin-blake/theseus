schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: repo-identity-transfer-readiness
intent: >-
  Make the repository's identity transfer-ready before the GitHub transfer-and-rename to otl-labs/ontheloop
  (Decision 218; rec-3903's pre-transfer half): Dependabot auto-merge accepts both full names, every script resolves
  the repository from GITHUB_REPOSITORY with one fallback constant, and the transfer contract's check pins every file
  still naming the retired identity, so CI follows the transfer the moment it lands and the post-transfer sweep's
  scope is complete by construction. Changes nothing live.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-repo-identity-transfer-readiness.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3903's pre-transfer half (docs/contracts/github-org-transfer.yaml
  procedure.pre_stage step 6; breakage_map rows dependabot_repository_guard, owner_literal_defaults, codeowners,
  descriptive_literals). rec-3903 stays open for PLAN-retired-repo-identity-sweep. No tier_item criterion claimed.
closes_criteria: []
scope:
- file: .github/workflows/dependabot-auto-merge.yml
  action: Modify
  purpose: The auto-merge job gate accepts both full names (contract procedure.pre_stage step 6).
- file: tests/checks/ci_guards/test_validate_dependabot_automation.py
  action: Modify
  purpose: >-
    _JOB_IF moves to the dual-name gate; add test_real_auto_merge_gate_accepts_both_full_names, which reads the real
    workflow (validate_dependabot_automation only asserts the substring github.repository).
- file: scripts/repo_identity.py
  action: Create
  purpose: >-
    The single source of the repository's GitHub identity: GITHUB_REPOSITORY when it is a well-formed owner/name,
    else FALLBACK_FULL_NAME; never raises. Root single (cross-cutting: convergence_health, ops, session, checks).
- file: tests/test_repo_identity.py
  action: Create
  purpose: Mirror test (Decision 131); 100% line coverage.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    Add scripts/repo_identity.py to scripts_root_allowlist.allowed_files and the approved one-line amendment_log
    entry (496 -> 498 of 500 effective lines, Decision 166).
- file: scripts/convergence_health/approvals.py
  action: Modify
  purpose: The three owner/repo literal defaults become None, resolved at call time through repo_identity.resolve.
- file: tests/convergence_health/test_approvals.py
  action: Modify
  purpose: Add test_stuck_approval_query_follows_github_repository.
- file: scripts/convergence_health/budget_ingest.py
  action: Modify
  purpose: DEFAULT_OWNER/DEFAULT_REPO removed; collect_budget_episodes and ingest_budget_breaches default to None and resolve at call time.
- file: tests/convergence_health/budget_ingest/test_collect.py
  action: Modify
  purpose: Add test_collect_queries_the_ci_repository.
- file: scripts/convergence_health/sensor_liveness.py
  action: Modify
  purpose: >-
    DEFAULT_OWNER/DEFAULT_REPO removed; detect_stale_loops and stale_peers_for_probe default to None and resolve at
    call time (net +1 SLOC: 494 -> 495 of 500).
- file: tests/convergence_health/test_sensor_liveness.py
  action: Modify
  purpose: Add test_stale_peers_probe_queries_the_ci_repository.
- file: scripts/ops/drain_glue_orphan/_github.py
  action: Modify
  purpose: _REPO_OWNER, _REPO_NAME come from repo_identity.owner_and_name() (names kept; __init__ and _phases unchanged).
- file: tests/ops/test_drain_glue_orphan_github.py
  action: Modify
  purpose: Add test_repo_identity_follows_github_repository (reloads _github under a patched environment, restores after).
- file: scripts/session/github_readiness.py
  action: Modify
  purpose: The authenticated read targets repos/{repo_identity.full_name()}.
- file: tests/test_session_github_readiness.py
  action: Modify
  purpose: Add test_authenticated_read_targets_the_ci_repository.
- file: scripts/checks/misc/validate_ghas_probe.py
  action: Modify
  purpose: _repo() returns repo_identity.full_name(); _DEFAULT_REPO removed.
- file: tests/checks/misc/test_validate_ghas_probe.py
  action: Modify
  purpose: Add test_malformed_repository_falls_back_to_the_default (red before, green after).
- file: scripts/checks/contracts/_retired_identity.py
  action: Create
  purpose: >-
    Invariant (2) for rec-3903's four rows, called by validate_github_org_transfer: the retired-identity scan with
    SWEEP_PINS (path -> rec-3903 row id) and SURVIVOR_PINS (path -> reason), the contract-derived exemptions, and the
    two phase rules (dependabot gate names the target from pre_staged on; no sweep pin at predecessor_removed).
- file: tests/checks/contracts/test__retired_identity.py
  action: Create
  purpose: Mirror test (Decision 131); 100% line coverage; discrimination cases listed in VP step 7.
- file: scripts/checks/contracts/validate_github_org_transfer.py
  action: Modify
  purpose: >-
    Moves dependabot_repository_guard, owner_literal_defaults, codeowners and descriptive_literals from
    PENDING_STATIC_ROWS into ROW_EVALUATORS, supplied by _retired_identity.ROW_EVALUATORS (terraform_github_root
    stays pending for rec-3136). The check's own invariant (1) is untouched.
- file: tests/checks/contracts/test_validate_github_org_transfer.py
  action: Modify
  purpose: Add test_rec_3903_rows_are_evaluated_not_pending; adjust any pending-set expectation that named the four rows.
- file: docs/contracts/github-org-transfer.yaml
  action: Modify
  purpose: >-
    The operator-approved amendment, verbatim from the APPROVED CONTRACT TEXT execution step: planned_evaluator's
    invariant (2) sentence for rec-3903's rows, owner_literal_defaults locations and fix, one amendment_log entry.
    phases.predecessor_removal is untouched (the operator kept the contract's order).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The dependabot auto-merge job gate accepts benjamin-blake/theseus and otl-labs/ontheloop, and a test reads the
  real workflow to prove it.
- >-
  scripts/repo_identity.py returns GITHUB_REPOSITORY when it is a well-formed owner/name, else the fallback, and never
  raises; the six scripts carry no hard-coded owner or repository and query the resolved repository.
- >-
  validate_github_org_transfer evaluates rec-3903's four rows: every tracked file naming the retired identity outside
  historical records and other recs' static-row files is pinned, a new file or a stale pin fails, and the two phase
  rules hold; the four rows are no longer pending.
- Every SWEEP_PINS path is in PLAN-retired-repo-identity-sweep's scope (else that plan is amended before this merges).
- >-
  The contract carries the operator-approved amendment verbatim (allowed variance: the amendment_log date).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Precondition -- the OIDC pre-stage plan's build has merged (the check exists and is the contract's evaluator).
  command: >-
    test -f scripts/checks/contracts/validate_github_org_transfer.py && grep -q 'check: validate_github_org_transfer' docs/contracts/github-org-transfer.yaml
  expected: Exit 0.
  fix_if: Non-zero means the OIDC pre-stage build has not merged; STOP and wait (this plan extends that check).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A sequencing precondition, not a property of this change.
- step: 2
  phase: pre-deploy
  action: The real dependabot workflow gate accepts both full names.
  command: >-
    bin/venv-python -m pytest -q tests/checks/ci_guards/test_validate_dependabot_automation.py::test_real_auto_merge_gate_accepts_both_full_names
  expected: Exit 0, 1 passed.
  expected_literals:
  - 1 passed
  fix_if: A failure names the missing full name in the job if.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The dual-name state is transient (PLAN-retired-repo-identity-sweep replaces it with the target-only gate), and the
    pytest node is itself the guard until then.
- step: 3
  phase: pre-deploy
  action: The resolver and each of the six scripts follow GITHUB_REPOSITORY and fall back safely.
  command: >-
    bin/venv-python -m pytest -q
    tests/test_repo_identity.py::test_ci_repository_wins
    tests/test_repo_identity.py::test_unset_environment_falls_back_to_the_constant
    tests/test_repo_identity.py::test_malformed_environment_falls_back_to_the_constant
    tests/test_repo_identity.py::test_resolve_fills_only_missing_parts
    tests/convergence_health/test_approvals.py::test_stuck_approval_query_follows_github_repository
    tests/convergence_health/budget_ingest/test_collect.py::test_collect_queries_the_ci_repository
    tests/convergence_health/test_sensor_liveness.py::test_stale_peers_probe_queries_the_ci_repository
    tests/ops/test_drain_glue_orphan_github.py::test_repo_identity_follows_github_repository
    tests/test_session_github_readiness.py::test_authenticated_read_targets_the_ci_repository
    tests/checks/misc/test_validate_ghas_probe.py::test_malformed_repository_falls_back_to_the_default
  expected: Exit 0, 10 passed.
  expected_literals:
  - 10 passed
  fix_if: A failing node names the script still bound to a literal default or the resolver case that misbehaves.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The named pytest nodes are themselves the standing guards and run in every --pre pytest_diff.
- step: 4
  phase: pre-deploy
  action: The six scripts no longer hard-code the owner or repository.
  command: >-
    test -f scripts/convergence_health/approvals.py && test -f scripts/convergence_health/budget_ingest.py &&
    test -f scripts/convergence_health/sensor_liveness.py && test -f scripts/ops/drain_glue_orphan/_github.py &&
    test -f scripts/session/github_readiness.py && test -f scripts/checks/misc/validate_ghas_probe.py &&
    ! grep -n -E "benjamin-blake|[\"']theseus[\"']" scripts/convergence_health/approvals.py scripts/convergence_health/budget_ingest.py
    scripts/convergence_health/sensor_liveness.py scripts/ops/drain_glue_orphan/_github.py scripts/session/github_readiness.py
    scripts/checks/misc/validate_ghas_probe.py
  expected: Exit 0 (all six exist; no match).
  fix_if: A match names a default left in place; route it through repo_identity.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    validate_github_org_transfer's retired-identity scan already fails any unpinned match in these files on every
    PR; a registry row would duplicate it.
- step: 5
  phase: pre-deploy
  action: The transfer contract's check passes on the live tree with the four rows evaluated.
  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_github_org_transfer import validate_github_org_transfer as v; from scripts.checks.contracts import _retired_identity as r;
    f=[]; v(f); assert not f, f; print('PINS', len(r.SWEEP_PINS), len(r.SURVIVOR_PINS))"
  expected: Exit 0 and PINS with two counts printed.
  fix_if: >-
    A failure names an unpinned file, a stale pin, a row the contract does not assign to rec-3903, or a phase rule.
    Pin a forward-standing literal to its rec-3903 row (then step 8 decides whether the sweep plan needs amending);
    pin test data or the identity record as a survivor with a reason.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_github_org_transfer is itself a registered check in both tiers.
- step: 6
  phase: pre-deploy
  action: The four rows are evaluated, not pending.
  command: >-
    bin/venv-python -m pytest -q tests/checks/contracts/test_validate_github_org_transfer.py::test_rec_3903_rows_are_evaluated_not_pending
  expected: Exit 0, 1 passed.
  expected_literals:
  - 1 passed
  fix_if: A failure names a rec-3903 row still in the pending set.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The pytest node is itself the standing guard.
- step: 7
  phase: pre-deploy
  action: The retired-identity scan discriminates (new literal, stale pin, exemptions, row ownership, phase rules, fail-closed).
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/contracts/test__retired_identity.py::test_new_unpinned_literal_fails
    tests/checks/contracts/test__retired_identity.py::test_stale_pin_fails
    tests/checks/contracts/test__retired_identity.py::test_person_reference_brand_and_frozen_identifier_do_not_match
    tests/checks/contracts/test__retired_identity.py::test_historical_records_and_other_recs_files_are_exempt
    tests/checks/contracts/test__retired_identity.py::test_sweep_pin_must_cite_a_rec_3903_row
    tests/checks/contracts/test__retired_identity.py::test_dependabot_gate_must_name_the_target_from_pre_staged
    tests/checks/contracts/test__retired_identity.py::test_no_sweep_pin_may_remain_at_predecessor_removed
    tests/checks/contracts/test__retired_identity.py::test_unreadable_contract_or_git_failure_fails_closed
  expected: Exit 0, 8 passed.
  expected_literals:
  - 8 passed
  fix_if: A failing node names the discrimination case the scan gets wrong.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The named pytest nodes are themselves the standing guards and run in every --pre pytest_diff.
- step: 8
  phase: pre-deploy
  action: Every sweep pin is in the sweep plan's scope, so that plan is complete before this merges.
  command: >-
    bin/venv-python -c "import yaml; from scripts.checks.contracts import _retired_identity as r;
    s={e['file'] for e in yaml.safe_load(open('docs/plans/PLAN-retired-repo-identity-sweep.yaml',encoding='utf-8'))['scope']};
    m=sorted(set(r.SWEEP_PINS)-s); print('MISSING_FROM_SWEEP_SCOPE', m); assert r.SWEEP_PINS and not m"
  expected: Exit 0 and MISSING_FROM_SWEEP_SCOPE [] printed.
  fix_if: >-
    A listed path gained the retired identity after the sweep plan merged: STOP and route a sweep-plan scope
    amendment to the planning thread through the coordinator; merge this only after the amendment lands.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time bridge to the sweep plan; vacuous once the sweep empties SWEEP_PINS.
- step: 9
  phase: pre-deploy
  action: The contract carries the approved amendment verbatim, bound to execution_steps' APPROVED CONTRACT TEXT block.
  command: >-
    bin/venv-python -c "import yaml,re; n=lambda t:' '.join(t.split()); p=yaml.safe_load(open('docs/plans/PLAN-repo-identity-transfer-readiness.yaml',encoding='utf-8'));
    t=[x for x in p['execution_steps'] if x.startswith('APPROVED CONTRACT TEXT')][0]; a=dict(re.findall(r'(?ms)^([A-Z_]+):\n(.*?)(?=^[A-Z_]+:\n|\Z)',t));
    c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml',encoding='utf-8')); o={x['id']:x for x in c['breakage_map']}['owner_literal_defaults'];
    assert o['locations'][0]=='scripts/repo_identity.py'; assert n(o['fix'])==n(a['FIX']); assert n(c['planned_evaluator']).endswith(n(a['PLANNED_EVALUATOR_TAIL']));
    assert 'Until then the pinned constants' not in c['planned_evaluator']; assert any(n(e.get('summary') or '')==n(a['AMENDMENT_SUMMARY']) for e in c['amendment_log']);
    print('AMENDMENT_VERBATIM')"
  expected: Exit 0 and AMENDMENT_VERBATIM printed.
  fix_if: >-
    A failed assertion means the amendment is missing or reworded; restore the approved text from the
    APPROVED CONTRACT TEXT execution step. Any wording change goes back to the operator through the coordinator.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time check binding the contract to the approved text; validate_contract_drift guards the contract's shape in both tiers.
- step: 10
  phase: pre-deploy
  action: The new root single is allowlisted and sensor_liveness stays within 500 SLOC.
  command: >-
    bin/venv-python -c "import pathlib; from scripts.checks.hygiene.validate_placement import validate_placement as v; f=[]; v(f); assert not f, f;
    n=sum(1 for l in pathlib.Path('scripts/convergence_health/sensor_liveness.py').read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'));
    print('SENSOR_LIVENESS_SLOC', n); assert n<=500"
  expected: Exit 0 and SENSOR_LIVENESS_SLOC at most 500 printed.
  fix_if: >-
    A placement failure means the file-router entry is missing; an SLOC above 500 means the edit was not net +1 --
    tighten it (decompose-by-default, Decision 128; never a budget raise).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_placement and validate_sloc_limits are registered checks in both tiers.
- step: 11
  phase: pre-deploy
  action: >-
    Public-boundary sweep of every changed file (absorbs the contract build's partial-coverage follow-up): no
    12-digit id, e-mail address, token or ExternalId shape in any added line.
  command: >-
    ! git diff origin/main | grep '^+' | grep -v '^+++' | grep -Eq '[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId'
  expected: Exit 0 (no match).
  fix_if: A match is a Decision 101 breach; remove the value.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
- step: 12
  phase: pre-deploy
  action: Fast tier.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0.
  fix_if: Fix the named failure at its root; never skip, disable or quarantine a test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness into itself.
- step: 13
  phase: pre-deploy
  action: Full tier before handoff (about 10 minutes; run in the background with a 30-minute timeout).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: A timeout blocks; it never passes. Fix the named failure at its root.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness into itself.
- step: 14
  phase: post-deploy
  action: >-
    Live: the first convergence-health run on main after the merge succeeds, so the sensors still reach the
    repository through the resolver (GITHUB_REPOSITORY in CI).
  command: >-
    bin/venv-python -c "import json,urllib.request,subprocess; t=subprocess.check_output(['git','log','-1','--format=%cI','origin/main'],text=True).strip();
    runs=json.load(urllib.request.urlopen('https://api.github.com/repos/benjamin-blake/theseus/actions/workflows/convergence-health.yml/runs?branch=main&per_page=10',timeout=30))['workflow_runs'];
    after=[r for r in runs if r['created_at']>t and r['status']=='completed']; print('CONVERGENCE_HEALTH_AFTER_MERGE', [(r['id'],r['conclusion']) for r in after]);
    assert after and after[-1]['conclusion']=='success'"
  expected: Exit 0 with the earliest completed run after the merge concluding success.
  fix_if: >-
    No completed run yet: wait for the next scheduled tick and re-run (the workflow is scheduled). A failure: read the
    budget-ingest and sensor-liveness steps; a URL error naming the repository means the resolver regressed -- revert
    and RCA (Decision 55). (Before transfer the old path is still canonical; after transfer this URL redirects.)
  hermetic: false
test_obligations:
- source: .github/workflows/dependabot-auto-merge.yml
  behavior: The auto-merge job gate accepts both full names.
  verification_step: 2
  test_selector: tests/checks/ci_guards/test_validate_dependabot_automation.py::test_real_auto_merge_gate_accepts_both_full_names
  red_green_expectation: Red before (the gate names only the retired name), green after.
- source: scripts/repo_identity.py
  behavior: GITHUB_REPOSITORY wins when well-formed; otherwise the fallback; never raises.
  verification_step: 3
  test_selector: tests/test_repo_identity.py::test_ci_repository_wins
  red_green_expectation: Red before (the module does not exist), green after.
- source: docs/contracts/file-router.yaml
  behavior: scripts/repo_identity.py is an allowlisted root single.
  verification_step: 10
  command: >-
    bin/venv-python -c "import pathlib; from scripts.checks.hygiene.validate_placement import validate_placement as v; f=[]; v(f); assert not f, f;
    n=sum(1 for l in pathlib.Path('scripts/convergence_health/sensor_liveness.py').read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'));
    print('SENSOR_LIVENESS_SLOC', n); assert n<=500"
  waiver_reason: >-
    Registration data: validate_placement already fails the build if scripts/repo_identity.py lands without the
    entry, which is the red-before this obligation needs.
- source: scripts/convergence_health/approvals.py
  behavior: The stuck-approval, reconcile and apply-run queries target the resolved repository.
  verification_step: 3
  test_selector: tests/convergence_health/test_approvals.py::test_stuck_approval_query_follows_github_repository
  red_green_expectation: Red before (the literal default ignores GITHUB_REPOSITORY), green after.
- source: scripts/convergence_health/budget_ingest.py
  behavior: The artifacts listing targets the resolved repository.
  verification_step: 3
  test_selector: tests/convergence_health/budget_ingest/test_collect.py::test_collect_queries_the_ci_repository
  red_green_expectation: Red before (DEFAULT_OWNER/DEFAULT_REPO literals), green after.
- source: scripts/convergence_health/sensor_liveness.py
  behavior: The liveness probe's API base targets the resolved repository.
  verification_step: 3
  test_selector: tests/convergence_health/test_sensor_liveness.py::test_stale_peers_probe_queries_the_ci_repository
  red_green_expectation: Red before (DEFAULT_OWNER/DEFAULT_REPO literals), green after.
- source: scripts/ops/drain_glue_orphan/_github.py
  behavior: _REPO_OWNER and _REPO_NAME come from the resolver.
  verification_step: 3
  test_selector: tests/ops/test_drain_glue_orphan_github.py::test_repo_identity_follows_github_repository
  red_green_expectation: Red before (literal constants), green after.
- source: scripts/session/github_readiness.py
  behavior: The authenticated read targets the resolved repository.
  verification_step: 3
  test_selector: tests/test_session_github_readiness.py::test_authenticated_read_targets_the_ci_repository
  red_green_expectation: Red before (the URL is a literal), green after.
- source: scripts/checks/misc/validate_ghas_probe.py
  behavior: A malformed GITHUB_REPOSITORY falls back to the default instead of being used verbatim.
  verification_step: 3
  test_selector: tests/checks/misc/test_validate_ghas_probe.py::test_malformed_repository_falls_back_to_the_default
  red_green_expectation: Red before (the raw value is returned), green after.
- source: scripts/checks/contracts/_retired_identity.py
  behavior: An unpinned file naming the retired identity fails the check.
  verification_step: 7
  test_selector: tests/checks/contracts/test__retired_identity.py::test_new_unpinned_literal_fails
  red_green_expectation: Red before (the module does not exist), green after.
- source: scripts/checks/contracts/validate_github_org_transfer.py
  behavior: rec-3903's four rows are evaluated, not pending.
  verification_step: 6
  test_selector: tests/checks/contracts/test_validate_github_org_transfer.py::test_rec_3903_rows_are_evaluated_not_pending
  red_green_expectation: Red before (the rows are in the pending set), green after.
- source: docs/contracts/github-org-transfer.yaml
  behavior: The contract records the approved amendment.
  verification_step: 9
  command: >-
    bin/venv-python -c "import yaml,re; n=lambda t:' '.join(t.split()); p=yaml.safe_load(open('docs/plans/PLAN-repo-identity-transfer-readiness.yaml',encoding='utf-8'));
    t=[x for x in p['execution_steps'] if x.startswith('APPROVED CONTRACT TEXT')][0]; a=dict(re.findall(r'(?ms)^([A-Z_]+):\n(.*?)(?=^[A-Z_]+:\n|\Z)',t));
    c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml',encoding='utf-8')); o={x['id']:x for x in c['breakage_map']}['owner_literal_defaults'];
    assert o['locations'][0]=='scripts/repo_identity.py'; assert n(o['fix'])==n(a['FIX']); assert n(c['planned_evaluator']).endswith(n(a['PLANNED_EVALUATOR_TAIL']));
    assert 'Until then the pinned constants' not in c['planned_evaluator']; assert any(n(e.get('summary') or '')==n(a['AMENDMENT_SUMMARY']) for e in c['amendment_log']);
    print('AMENDMENT_VERBATIM')"
  red_green_expectation: Red before (no such entry), green after.
constraints:
- >-
  Public repository (Decision 101): no account id, ARN, numeric GitHub id, token, e-mail or Neon id in any changed line.
- >-
  Approved wording is verbatim (contract amendment, file-router entry); the only allowed variance is the
  amendment_log date. Any other wording change, including one code review asks for, goes to the coordinator, then
  the operator.
