schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: step-6b-fork-classification
intent: >-
  Give /plan Step 6b a fork classification and a presentation shape so consistency-only design forks
  that a repo precedent already settles are decided-with-notice instead of costing the human a
  ruling, while every authority-bearing, precedent-less or scout-flagged fork still asks in a pinned
  2-4-option shape -- porting the overseer's own four-criteria autonomy-boundary policy down to plan
  grain (audit remedy B2-R4 / finding PDB-03) with the carriers corrected for a dispatched author
  that holds no AskUserQuestion tool (rec-3042), and with the new rule's own enforcement coverage
  declared per surface (Decision 181).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-step-6b-fork-classification.yaml
phase: >-
  Agent-workflow governance -- /plan Step 6b presentation and autonomy boundary. Ad-hoc, no
  tier_item slice and closes no criterion; soft-warn exception category user_explicit_out_of_scope
  (user directive 2026-09-03 to action every finding of audits/planning-decision-burden-735e69fc.yaml,
  slice E of the overseer run brief). Freshness Gate skipped by that category; adjacent items checked
  by hand and NOT claimed: T4.10a (not_started, the end-state owner that re-homes this classification
  as the plan_agent persona's autonomy clause) and T2.56 c1 (in_progress, skills-to-pointers direction
  this edit follows -- rules land in the contract, the skill keeps a pointer).
scope:
- file: docs/contracts/overseer-dispatch.yaml
  action: Modify
  purpose: >-
    Five edits. (1) Add `autonomy_tiers.plan_fork_classification` -- the nine-field section that
    ports the Autonomy-Boundary Policy to plan-grain design forks (applies_to,
    consistency_only_test, settled_consensus_reread, always_ask, ask_shape_interactive,
    ask_shape_dispatched, record_grammar, notice_tier, enforcement_coverage); `applies_to` names its
    reader surfaces explicitly (Decision 168 mitigation), settled_consensus_reread records the
    measured precedent corpus AS MEASURED -- the audit's pinned pattern, its counts, its named
    members and the one surviving exemplar -- and `enforcement_coverage` declares per-surface coverage in
    docs/contracts/implement-scope-boundary.yaml's row grammar (Decision 181). (2) Declare the Step
    6b confirmation relay as a fourth `gate` value (`step-6b-confirmation`) on the existing
    GATE_REQUEST status in `gate_request_trampoline.request_schema`, with the
    `gate_run_id.not_applicable_to` carve-out and the `pending_gates.write_ahead` clause the
    durability property needs. (3) Give the relay its OWN `trampoline_sequence.stages[]` entry (one
    stage per gate value) carrying the post-verdict flow -- the author/overseer split rec-3042 names
    as its fix surface. (4) Correct the two sentences in this same file that the fourth gate value
    falsifies: `subagent_detection.signals[injected_header].exact_header` (the verbatim header
    injected into every author dispatch -- the operative surface a dispatched author reads) and
    `gate_run_id.provenance`'s unqualified "ONE non-optional piece" claim. (5) Append the Class D
    `amendment_log[]` entry the drift gate requires for any parsed-content change.
- file: .claude/commands/plan.md
  action: Modify
  purpose: >-
    Step 6b shape: amend the `Present:` line to name Fork notices, and add two lines carrying the
    classification rule (consistency-only vs asks, precedent definition, always-ask pointer), the
    ask shape (2-4 options, recommended first, consequences, reversibility, persistence), both
    carriers (AskUserQuestion interactively; the `open_questions` of a post-verdict GATE_REQUEST
    `gate: step-6b-confirmation` when dispatched) and the decided-with-notice record rule, each
    pointing at the contract rather than restating it.
- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    Confirmation Gate (Workflow Step 6b) section: add the fork-classification pointer and correct the
    subagent-carrier clause (an overseer-dispatched author holds no AskUserQuestion tool, so its
    forks AND this confirmation ride the post-verdict `GATE_REQUEST` (`gate: step-6b-confirmation`)
    the overseer relays). Funded in-plan on the same surface -- see the prose arithmetic context line.
- file: .claude/skills/overseer/SKILL.md
  action: Modify
  purpose: >-
    Two byte-negative substring replacements on a zero-headroom skill. (a) Division of Labor: replace
    the "satisfied directly via the author's own `AskUserQuestion` tool call -- no overseer mediation
    needed" clause with the relay statement (rec-3042's second acceptance half; removes the repo's
    contradiction with the new contract section). (b) Bounded Hand-Back Schema: the `GATE_REQUEST is
    never terminal` paragraph's inline gate enumeration becomes a pointer phrase naming the Step 6b
    relay, so the skill does not carry a now-stale three-value list of a four-value contract enum.
- file: tests/test_plan_fork_classification_contract.py
  action: Create
  purpose: >-
    Content contract across the four surfaces, following tests/test_pr_ci_red_protocol_contract.py:
    assertion helpers run against the real artefacts (positive cases) and against mutated copies with
    the clause removed (negative cases), so no positive assertion is vacuous. Pins the nine contract
    fields, the precedent definition (a decided-with-notice line is never precedent), precedent_kind
    and the `precedent: none` rule in the record grammar, the always-ask roster, the
    enforcement_coverage rows, the Step 6b relay hop (fourth gate value, its own trampoline stage,
    post-verdict ordering, gate_run_id carve-out, write-ahead clause), the corrected dispatch header
    and provenance scoping, both carriers, the plan.md Step 6b shape, the planning-skill
    pointer-not-payload rule, and rec-3042's own acceptance pair.
bundled_recommendations:
- rec-3042
infrastructure_dependencies: []
acceptance_criteria:
- >-
  docs/contracts/overseer-dispatch.yaml carries `autonomy_tiers.plan_fork_classification` with all
  nine fields non-empty; consistency_only_test names all four autonomy-boundary criteria and defers
  to always_ask; settled_consensus_reread defines precedent as a Decision, a contract, or a fork the
  human ANSWERED in a prior plan and states that a decided-with-notice line is NEVER precedent and
  that a fork without precedent always asks; always_ask names IAM/security, spend, public-surface
  artefacts, governed deploy, and any Decision or roadmap CONFLICT the decision-scout flagged;
  applies_to names its reader surfaces by path AND names this contract's own
  subagent_detection.signals[injected_header].exact_header as the text a dispatched author actually
  reads at dispatch time; settled_consensus_reread also records the MEASURED precedent corpus as TWO
  figures, never a rounded restatement of either. (i) The audit's figure: the pinned fork/option
  pattern (audits/planning-decision-burden-735e69fc.yaml contract_notes 7c) matched 2 of 366 plans
  when B2-R4 was written -- docs/plans/PLAN-dcg-decisions-index.yaml and
  docs/plans/PLAN-provisional-contract-alarm.yaml, the two corpus members, both named. (ii) The
  implementer's OWN re-measurement, stated with the base sha it was taken at, run with `git ls-tree`
  plus `git grep -l -I -E -i` against the ORIGIN/MAIN tree and not the branch working tree, and with
  the plans this remediation run itself produced NAMED AND EXCLUDED from the evidentiary base --
  PLAN-critique-convergence-procedure, PLAN-plan-followon-recs-field,
  PLAN-decision-scout-roadmap-projection, PLAN-ci-rca-deferral-instrumentation,
  PLAN-orient-followon-adhoc-lane and this plan -- because a tier may not count its own run's output
  as the precedent that authorises it. (Re-measured for this revision at origin/main 757f55dc: 5 of
  379 raw, of which the three matches PLAN-critique-convergence-procedure,
  PLAN-plan-followon-recs-field and PLAN-decision-scout-roadmap-projection are slices A, B and D of
  this run, leaving the SAME 2 of 375 the audit measured. The implementer re-measures rather than
  copying that figure -- more of this run's plans land between now and implement time.) Exactly ONE
  fork in the excluded-clean corpus -- PLAN-dcg-decisions-index fork 1, committed JSON [recommended]
  vs Markdown -- survives this section's own consistency-only test as the exemplar, and that is the
  whole evidentiary base for this tier and the reason it is bounded to consistency-only forks.
- >-
  record_grammar pins the one-line `fork: ... | chosen: ... | class: ... | precedent: ... |
  precedent_kind: decision|contract|answered-fork | reversible: ... | persisted: ...` shape, states
  that `precedent: none | precedent_kind: none` is legal ONLY on a `class: asked` line, and states
  that a proxy-answered fork carries its provenance in the precedent slot so a later planner can
  judge whether it counts as an ANSWERED fork. ask_shape_interactive gives the AskUserQuestion field
  mapping. ask_shape_dispatched names the EXACT hand-back shape, not merely the field: a SECOND,
  post-verdict hand-back whose `status` stays `GATE_REQUEST` and whose `gate` is the fourth value
  `step-6b-confirmation`, carrying the Step 6b presentation plus the forks in `open_questions`,
  relayed verbatim by the overseer.
- >-
  The relay hop is declared in the trampoline schema, not left to an implementer to invent:
  `gate_request_trampoline.request_schema` enumerates `step-6b-confirmation` as the fourth `gate`
  value and states that it dispatches no gate skill (the overseer relays to the human instead);
  `gate_request_trampoline.gate_run_id.not_applicable_to` names it and gives the reason (no gate
  subagent to echo the id; a human turn cannot be inlined by the author, which is the only property
  the id proves) plus the exception when a sibling stands in for the human under recorded delegated
  authority; `gate_request_trampoline.pending_gates.write_ahead` REQUIRES an entry for it and says
  why (the presentation and the questions exist only in the author's context until Step 8 writes the
  plan -- the same durability gap that made decision-scout's `inputs` required); and the
  decision-scout stage's own flow is UNCHANGED, the hop living instead in its own stage, in sequence
  position after decision-scout. Because `status` stays GATE_REQUEST, `interleave_with_pr_lifecycle`'s status-changing enumeration is unchanged and
  the slice's ledger status stays `planning` through the pause. The relay gets its OWN
  `trampoline_sequence.stages[]` entry (`- gate: step-6b-confirmation`) with its own `fires_at`,
  inserted in SEQUENCE POSITION -- second, between the decision-scout and plan-critique stages,
  because `trampoline_sequence.description` declares the section the COMPOSED end-to-end sequence
  and stages[] is chronological, so a Step 6b hop appended last would sit after code-review -- so
  stages[] keeps one stage per gate value, in firing order, and a filter by gate finds it; its `fires_at` places it
  after the decision-scout verdict is applied and carries the literal lowercase phrase `never before
  the decision-scout verdict`, and its two flow entries carry the author's `open_questions` hand-back
  and the overseer's verbatim relay. The two sentences the fourth value
  would otherwise falsify are corrected in the same diff: `gate_run_id.provenance`'s "ONE
  non-optional piece" claim is scoped to the three SKILL-DISPATCHED gates (literal token
  `skill-dispatched`) and cross-references not_applicable_to; and
  `subagent_detection.signals[injected_header].exact_header` -- the verbatim header injected into
  every author-subagent dispatch and, per `precedence`, the primary declarative signal -- names the
  Step 6b confirmation relay and its `step-6b-confirmation` gate value alongside the three Skill-tool
  gates and states that a dispatched author holds no `AskUserQuestion` tool.
- >-
  `enforcement_coverage` is present and mirrors docs/contracts/implement-scope-boundary.yaml's row
  grammar: every row carries `surface`, a `status` of mechanical or residual_agent_obligation, and
  either a registered check id (`enforced_by`) or an existing rec id (`residual_owner`) -- no
  placeholder. The mechanical row names plan-fork-classification-contract-shape AND states its true
  reach in `note`: the pytest module runs unconditionally in the full tier (pre-handoff local +
  post-merge on main) and in `--pre` only when the diff-aware affected-set selection picks it
  (Decision 135), so a documentation-only edit to one of the three instruction surfaces may be caught
  post-merge rather than pre-merge; the registry shard adds a one-time differential admission
  (fails on origin/main, passes on HEAD) at graduation, not a per-PR re-run. The residual row names
  the rec filed for record-grammar conformance and correct classification, and its note names the
  three catches (the Step 6b confirmation, the plan-critique gate, /implement's deviation trigger)
  plus the validate_plan_documents grammar check as the mechanical closer that rec owns.
- >-
  .claude/commands/plan.md Step 6b names the classification, the ask shape with a recommended option,
  both carriers (including the literal `step-6b-confirmation`) and the decided-with-notice record
  rule, and points at the contract section by path; its `Present:` line lists Fork notices.
  .claude/skills/planning/SKILL.md carries the pointer and the corrected subagent-carrier clause
  naming `step-6b-confirmation`, and does NOT restate the four criteria or the always-ask roster.
- >-
  The retired claim is gone from the live instruction surfaces:
  `grep -rn "no overseer mediation" .claude docs/contracts scripts` returns no match. The phrase has
  TWO live carriers on origin/main and this diff retires BOTH: .claude/skills/overseer/SKILL.md:120
  (the Division of Labor clause, replaced in execution step 7) AND
  .claude/skills/planning/SKILL.md:470 ("this checkpoint needs no overseer mediation (not a
  bias-fresh-context gate)"), which is retired because execution step 6 replaces the
  `## Confirmation Gate (Workflow Step 6b)` section WHOLE -- a surgical edit that leaves line 470
  standing fails VP step 3 with a `sweep_hits` naming it. docs/plans/,
  audits/ and tests/test_plan_fork_classification_contract.py are deliberately OUTSIDE the sweep
  roots -- this plan file and the audit record quote the retired phrase as history, and the test
  module reinstates it inside a mutated copy as its negative fixture; those are legitimate quotations,
  not surviving instructions. rec-3042's own acceptance command
  (`grep -q 'AskUserQuestion' docs/contracts/overseer-dispatch.yaml && ! grep -q 'no overseer mediation needed' .claude/skills/overseer/SKILL.md`)
  is unaffected by the root change and exits 0.
- >-
  tests/test_plan_fork_classification_contract.py passes, and each of its negative cases fails when
  run against a mutated copy with the corresponding clause removed (proving the positive assertions
  are not vacuous) -- including the enforcement_coverage case, whose mutated copy drops
  `residual_owner` from the residual row, the relay-hop case, whose mutated copy deletes the
  post-verdict flow entry, and the dispatch-header case, whose mutated copy strips the appended
  header sentences. The module stays at or under 500 SLOC and needs no new sloc_budgets entry.
- >-
  Budgets stay green with no raise of any kind, measured on the REBASED tree: the planning skill's
  Confirmation Gate section goes 607 -> 668 bytes (+61, inside the 76-byte headroom measured at
  planning time) and the overseer skill loses 33 bytes across its two replaced substrings (150 -> 127
  and 45 -> 35), byte-negative on a zero-headroom surface; after the edits each file's current size is
  <= its config/prose_budgets.yaml budget (VP step 7 asserts `over == []`), config/prose_budgets.yaml
  is itself byte-unchanged, and docs/contracts/overseer-dispatch.yaml stays at or under 500 effective
  lines (VP step 7 prints the measured count) with no entry added to config/structural_size_budgets.yaml.
- >-
  The Class D drift gate passes: overseer-dispatch.yaml's parsed content changed and a new
  `amendment_log[]` entry (date, semantic_break false, change_class field_add, summary naming
  plan_fork_classification, the fourth gate value and its relay hop, and the two undeclared reader
  surfaces .claude/commands/plan.md and .claude/skills/planning/SKILL.md) was added in the same diff.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    RED baseline on the unmodified tree -- the contract has no plan_fork_classification section, the
    overseer skill still carries the retired no-mediation claim, and plan.md's Step 6 block says
    nothing about consistency-only forks. Run FIRST, before any edit. Deliberately inverts once the
    change lands, so it is marked hermetic false rather than replayed.
  command: >-
    bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/contracts/overseer-dispatch.yaml').read_text(encoding='utf-8')); ov=pathlib.Path('.claude/skills/overseer/SKILL.md').read_text(encoding='utf-8'); pm=pathlib.Path('.claude/commands/plan.md').read_text(encoding='utf-8'); s6=pm[pm.index('## Step 6'):pm.index('## Step 7')]; absent='plan_fork_classification' not in (d.get('autonomy_tiers') or {}); print('section_absent=',absent,'| claim_present=','no overseer mediation needed' in ov,'| step6_silent=','consistency-only' not in s6); raise SystemExit(0 if absent and 'no overseer mediation needed' in ov and 'consistency-only' not in s6 else 1)"
  expected: >-
    Exit 0 printing `section_absent= True | claim_present= True | step6_silent= True` (reproduced on
    origin/main at planning time). After the edits this same command exits 1 -- the intended inversion.
  fix_if: >-
    Exit 1 on the unmodified tree means part of this change already landed (a sibling slice or an
    earlier attempt) -- STOP and re-derive the delta against the tree rather than re-adding it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Asserts the ABSENCE of exactly what this plan adds; graduating it would land a registry check
    that fails permanently the moment this change merges.
- step: 2
  phase: pre-deploy
  action: >-
    The contract section is complete and says the load-bearing things -- nine non-empty fields, the
    four criteria, the precedent definition with its decided-with-notice exclusion, precedent_kind and
    the `precedent: none` / `class: asked` rule in the record grammar, the always-ask roster, the
    dispatched carrier naming its hand-back shape, the measured precedent corpus, and a
    well-formed enforcement_coverage map -- plus the fully-declared Step 6b relay (fourth gate value
    in request_schema, its OWN trampoline_sequence stage whose flow carries `open_questions` and the
    lowercase ordering phrase, the gate_run_id carve-out, the write-ahead clause), the two corrected
    sentences the fourth value falsifies (the injected dispatch header and provenance's
    skill-dispatched scoping), and the Class D amendment_log entry the drift gate requires.
  command: >-
    bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/contracts/overseer-dispatch.yaml').read_text(encoding='utf-8')); s=d['autonomy_tiers']['plan_fork_classification']; t=d['gate_request_trampoline']; req=['applies_to','consistency_only_test','settled_consensus_reread','always_ask','ask_shape_interactive','ask_shape_dispatched','record_grammar','notice_tier','enforcement_coverage']; missing=[k for k in req if not str(s.get(k) or '').strip()]; g=s['record_grammar']; p=s['settled_consensus_reread']; a=s['always_ask']; c=s['consistency_only_test']; ad=s['ask_shape_dispatched']; ap=str(s['applies_to']); cov=s.get('enforcement_coverage') or []; cov_bad=[r.get('surface') for r in cov if not r.get('status') or not (r.get('enforced_by') or r.get('residual_owner'))]; cov_kinds=sorted({r.get('status') for r in cov}); hdr=''.join(str(sig.get('exact_header') or '') for sig in d['subagent_detection']['signals']); stg=[st for st in d['trampoline_sequence']['stages'] if st['gate']=='step-6b-confirmation']; hop=([str(stg[0].get('fires_at') or '')]+[str(x) for x in (stg[0].get('flow') or [])]) if stg else []; checks={'missing':missing,'kinds':[k for k in ('decision','contract','answered-fork') if k not in g],'kind_field':'precedent_kind' in g,'never':'NEVER precedent' in p,'no_precedent_asks':'always asks' in p,'exemplar':'PLAN-dcg-decisions-index' in p,'none_asked_only':'precedent: none' in g and 'class: asked' in g,'ask_rows':[r for r in ('IAM','spend','public-surface','governed','scout') if r.lower() not in a.lower()],'four':[k for k in ('settled','convention-fit','reversible','no-credible-alternative') if k not in c],'dispatched':'open_questions' in ad and 'step-6b-confirmation' in ad,'header_surface':'subagent_detection' in ap,'enum':'step-6b-confirmation' in t['request_schema'],'runid_na':'step-6b-confirmation' in str(t['gate_run_id'].get('not_applicable_to') or ''),'runid_scoped':'skill-dispatched' in str(t['gate_run_id']['provenance']),'header':'step-6b-confirmation' in hdr and 'AskUserQuestion' in hdr,'write_ahead':'step-6b-confirmation' in t['pending_gates']['write_ahead'],'stage':bool(stg),'hop':any('open_questions' in x for x in hop),'order':any('never before the decision-scout verdict' in x for x in hop),'coverage':{'bad':cov_bad,'kinds':cov_kinds},'amend':bool(d.get('amendment_log'))}; print(checks); raise SystemExit(0 if not missing and not checks['kinds'] and checks['kind_field'] and checks['never'] and checks['no_precedent_asks'] and checks['exemplar'] and checks['none_asked_only'] and not checks['ask_rows'] and not checks['four'] and checks['dispatched'] and checks['header_surface'] and checks['enum'] and checks['runid_na'] and checks['runid_scoped'] and checks['header'] and checks['write_ahead'] and checks['stage'] and checks['hop'] and checks['order'] and not cov_bad and cov_kinds==['mechanical','residual_agent_obligation'] and checks['amend'] else 1)"
  expected: >-
    Exit 0 printing a dict whose `missing`, `kinds`, `ask_rows`, `four` and `coverage.bad` lists are
    empty, whose `coverage.kinds` is `['mechanical', 'residual_agent_obligation']`, and whose
    `kind_field`, `never`, `no_precedent_asks`, `exemplar`, `none_asked_only`, `dispatched`,
    `header_surface`, `enum`, `runid_na`, `runid_scoped`, `header`, `write_ahead`, `stage`, `hop`,
    `order` and `amend` are all True.
  fix_if: >-
    A non-empty `missing` means a field was skipped; a False `never` means the decided-with-notice
    exclusion was softened (that clause is what stops an autonomous chain starting from an autonomous
    choice -- restore it verbatim, never reword it away); a False `exemplar` means the measured
    precedent corpus sentence was dropped or reworded off its exemplar -- restore it; the thinness
    of that corpus is the reason this tier is bounded, and it is stated as TWO figures, never
    rounded down to "exactly one": the audit's 2 of 366 (PLAN-dcg-decisions-index,
    PLAN-provisional-contract-alarm) PLUS your OWN re-measurement carrying the base sha you took it
    at, from which this remediation run's own slice plans are named and excluded -- at origin/main
    757f55dc the raw figure was 5 of 379 and three of those matches are this run's slices A, B and
    D, leaving the same 2 of 375; re-measure against current origin/main rather than copying either
    number; a False `enum`, `runid_na` or `write_ahead` means the fourth gate value was
    used in the flow without being declared in the trampoline schema (the incoherence plan-critique
    round 1 finding 2 named -- declare it, never delete the hop); a False `stage` means the flow was
    buried inside the decision-scout stage instead of getting its own `- gate: step-6b-confirmation`
    entry (plan-critique round-2 finding S-5 -- one stage per gate value, so stages[] stays
    filterable); a False `order` means the hop's ordering phrase is missing or was written in a
    different case (the assertion is a case-sensitive `in`, so the drafted lowercase form is the only
    conforming one), and that phrase is what keeps the hop from contradicting
    `.claude/commands/plan.md` Step 6a's "DO NOT present findings to the human until this gate
    completes"; a False `header` means the injected dispatch header still enumerates only the three
    Skill-tool gates -- the operative surface a dispatched author reads, so fix the header, never the
    assertion; a False `runid_scoped` means provenance still claims the gate_run_id echo is the ONE
    non-optional piece while not_applicable_to exempts a gate value from it; a False `header_surface`
    means applies_to omits the injected header from its reader-surface list; a non-empty
    `coverage.bad` names a coverage row missing its status or its owner (a placeholder `rec-NNNN`
    counts as present here but fails step 5, which is the leg that proves the id is real); a False
    `amend` means the Class D amendment_log entry is missing and validate_contract_drift will fail
    the PR. An AttributeError from this command, or an all-missing `four`/`ask_rows` against a
    section that visibly carries the text, means a field was authored as a YAML list or mapping
    instead of a folded string -- reshape the field per constraint 3; never edit this command
    (`verification_plan[].command` is a prohibited_field_edit).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The same assertions are the graduated pytest guard from step 6 (check_id
    plan-fork-classification-contract-shape); a second registry row over one contract section would
    double-maintain a single invariant, and this VP step exists to prove the edit at implement time.
- step: 3
  phase: pre-deploy
  action: >-
    Instruction-surface coherence: plan.md Step 6b carries the shape and the pointer, the planning
    skill carries the pointer and the dispatched carrier WITHOUT restating the rules
    (pointer-not-payload, T2.56 direction), and the retired no-mediation claim is unreachable on any
    live instruction surface (stale-reference sweep over `.claude docs/contracts scripts` --
    docs/plans, audits/ and the test module's negative fixture legitimately quote the phrase and are
    outside the roots).
  command: >-
    bin/venv-python -c "import pathlib,subprocess; pm=pathlib.Path('.claude/commands/plan.md').read_text(encoding='utf-8'); s6=pm[pm.index('## Step 6'):pm.index('## Step 7')]; ps=pathlib.Path('.claude/skills/planning/SKILL.md').read_text(encoding='utf-8'); cg=ps[ps.index('## Confirmation Gate (Workflow Step 6b)'):ps.index('## Create Branch (Workflow Step 7)')]; ptr='docs/contracts/overseer-dispatch.yaml#autonomy_tiers.plan_fork_classification'; sweep=subprocess.run(['grep','-rn','no overseer mediation','.claude','docs/contracts','scripts'],capture_output=True,text=True,encoding='utf-8',errors='replace'); res={'step6':[t for t in ('consistency-only','decided-with-notice','open_questions','step-6b-confirmation',ptr,'Fork notices') if t not in s6],'skill_ptr':ptr in cg,'skill_carrier':'step-6b-confirmation' in cg,'skill_no_restate':[t for t in ('no-credible-alternative','always-ask list of IAM') if t in ps],'sweep_hits':sweep.stdout.strip()}; print(res); raise SystemExit(0 if not res['step6'] and res['skill_ptr'] and res['skill_carrier'] and not res['skill_no_restate'] and not res['sweep_hits'] else 1)"
  expected: >-
