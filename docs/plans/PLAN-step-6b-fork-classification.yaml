constraints:
- >-
  Rules live in the contract; the command and the two skills carry pointers and the one-sentence norm
  only. Do not restate the four criteria, the always-ask roster or the record grammar on any
  .claude/** surface (Decision 86/127 relief valve, T2.56 c1 direction, and the reason this remedy is
  a contract amendment rather than skill prose).
- >-
  The section carries exactly nine fields -- applies_to, consistency_only_test,
  settled_consensus_reread, always_ask, ask_shape_interactive, ask_shape_dispatched, record_grammar,
  notice_tier, enforcement_coverage. Do not drop enforcement_coverage to save bytes: a new standing
  obligation without declared per-surface coverage is exactly what Decision 181 prohibits.
- >-
  Field shapes are load-bearing because VP step 2's assertions are SUBSTRING tests: the eight prose
  fields -- applies_to, consistency_only_test, settled_consensus_reread, always_ask,
  ask_shape_interactive, ask_shape_dispatched, record_grammar, notice_tier -- are STRING scalars
  (folded `>-` YAML), never a list and never a mapping. `enforcement_coverage` is the sole
  exception and IS a list of row mappings (surface / status / enforced_by | residual_owner / note),
  which is the shape VP step 2 iterates. `always_ask` is the trap: it reads naturally as a roster,
  and authored as a YAML list it raises AttributeError on `.lower()` (a traceback, not a clean
  assertion failure), while consistency_only_test, settled_consensus_reread, record_grammar and
  ask_shape_dispatched authored as lists silently turn `in` from a substring test into
  element-equality. The repair is always to reshape the field to a folded string: `verification_plan[].command`
  is a prohibited_field_edit under docs/contracts/implement-scope-boundary.yaml
  (sanction_rows.implementing_plan_bookkeeping), so the implementer may not legally fix the command
  instead.
- >-
  The Step 6b relay is a fourth `gate` value on the EXISTING GATE_REQUEST status -- never a new
  hand-back `status`, and never an undeclared pause. It dispatches no gate skill and runs no gate
  methodology, so it is not a bias gate and does not touch `division_of_labor.overseer.owns` ("ALL
  gate dispatch: every decision-scout, plan-critique, and code-review invocation"), which stays true
  as written. It DOES get its own `trampoline_sequence.stages[]` entry (one stage per gate value),
  and it DOES falsify two sentences elsewhere in the same file -- the injected dispatch header and
  gate_run_id.provenance's non-optional claim -- both corrected in this diff. Never leave a
  four-value enum described by three-value prose on a surface a dispatched author reads.
- >-
  Ordering is load-bearing: the hop fires at Step 6b, strictly after the decision-scout verdict has
  been applied. On BLOCK there is no hop at all (the author pivots and re-requests the scout); on
  FLAGS_FOUND the flags are carried INSIDE the presentation this hop relays. Do not move the hop
  ahead of the verdict -- that would contradict `.claude/commands/plan.md` Step 6a's "DO NOT present
  findings to the human until this gate completes."
- >-
  No coverage row may carry a placeholder owner. The record-grammar residual rec is filed through the
  portal (`get_rec_write_guidance` first, then `file_rec`, source implement-agent) BEFORE the field is
  written, and the ALLOCATED id -- never a client-side guess -- goes into `residual_owner` (Decision
  84 I-2, Single Portal Invariant). VP step 5 is the proof.
- >-
  No prose-budget raise and no new prose_budgets registration; no structural-size raise and no new
  config/structural_size_budgets.yaml entry. Every byte added to .claude/skills/planning/SKILL.md is
  funded by the same-surface trade-out this plan measures; the overseer-skill edit must stay
  byte-negative (that surface has zero headroom); the contract stays at or under 500 effective lines
  by compressing field prose. The whole contract diff is budgeted at 125 effective lines against the
  136 available (364 measured on origin/main, landing at <= 489): at most 7 folded lines per contract
  field -- settled_consensus_reread, which carries the measured corpus, may take 10 -- ~32 for the
  trampoline, header and provenance edits, ~7 for the amendment_log entry. Measure
  with VP step 7's one-liner after each part and compress the section prose -- never raise, never
  register.
- >-
  Do not weaken the Step 6b confirmation itself. The human still confirms the plan; decided-with-notice
  forks are part of what is confirmed, never a replacement for it (audit B2-R4 modification (c)).
- >-
  Precedent is a Decision, a contract, or a fork the human ANSWERED in a prior plan. A
  decided-with-notice line is never precedent, and a fork with no precedent always asks -- do not
  soften either clause into "prior practice" or "a previous plan's choice", which would let an
  autonomous chain start from an autonomous choice.
- >-
  A Fable advice-consult may inform the recommended option a question carries; it never substitutes
  for asking (audit B2-R2 ground 2 -- a repo-internal fork has no industry answer to consult).
- No new numbered Decision. This is convention text and routes to the contract per docs/contracts/decision-entry.yaml's significance.routing_rule and Decision 150 clause 1.
- >-
  Do not raise a SLOC budget (Decision 128 decompose-by-default) and do not add a coverage_baseline
  entry; the new test module stays under 500 SLOC.
- No rescue agents or workaround loops (Decision 55). A failing VP step is diagnosed and fixed on the branch, never retried into green.
- >-
  Warehouse/portal discipline: rec-3042 is closed through the portal or by rec-autoclose on the
  `Resolves:` trailer -- never by editing logs/.recommendations-log.jsonl (Single Portal Invariant).
  Portal reads and writes go through `scripts.ops_data_portal` (`--sync`, `file_rec`, `update_rec`),
  never `scripts.sync.ops` directly -- that form is the operator cache-rebuild path, not an agent VP step.
context:
