schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-turn-capture-core
intent: >-
  Telemetry slice 3a (rec-4026, T3.20): build the plane-neutral Claude Code transcript producer core -- transcript reader,
  CD.40 credential scrubber, and a cursor-driven capture API emitting ref-bearing rows for all four telemetry tables under
  the Decision 207 R7 producer obligations -- plus rec-4122's parser_version registry and golden-corpus checks, proven on
  a real local DuckLake built from the ratified contracts and reconciled against real Claude Code transcripts. Turn,
  friction and cost telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this is its first
  producer.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-turn-capture-core.yaml
phase: >-
  T3.20 (agent-turn telemetry capture) -- producer-core groundwork only; closes NO exit criterion (c1 needs the hooks
  landed and c2 the writer boundary, both slice 3b on rec-4026 after slice 2 / rec-4024 merges). Builds on T2.36's
  slice-1 kernel (#1286) and the closed contract-risk recs rec-4058..4061 (#1295, #1314).
scope:
- file: src/turn_capture/__init__.py
  action: Create
  purpose: Package marker; docstring only, imports and defines nothing (mirrors src/telemetry/__init__.py, no re-export facade).
- file: src/turn_capture/scrub.py
  action: Create
  purpose: >-
    CD.40 pre-write credential scrubber, stdlib re only, per the pinned scrubber rules in execution_steps. scrub_text(str)
    -> ScrubResult(text, counts per class). Deterministic, idempotent, never raises on any str, never reports matched text.
- file: src/turn_capture/transcript.py
  action: Create
  purpose: >-
    Claude Code transcript source access (stdlib json/pathlib): TranscriptTree protocol with a filesystem implementation
    and an in-memory twin for tests, the line rules, sidecar resolution by basename, sub-agent file lookup by agentId and
    the session_started_at pin, per the pinned reader rules.
- file: src/turn_capture/streams.py
  action: Create
  purpose: >-
    Record classification (prompt, companion, tool_result, assistant, hook attachment), stream membership by record
    fields, turn spans and closure, response grouping by message.id, sub-agent completeness -- an immutable parsed tree
    the row builders consume (split from transcript.py up front: the independent review sizes the two concerns at about
    580 SLOC together).
- file: src/turn_capture/refs.py
  action: Create
  purpose: Every ref and external_ref grammar builder in one place (the pinned row-role vocabulary); no other module composes a ref string.
- file: src/turn_capture/observations.py
  action: Create
  purpose: Pure builders for telemetry_observations rows (refs only, never ids), per the pinned observation rules.
- file: src/turn_capture/transcripts.py
  action: Create
  purpose: >-
    Pure builders for telemetry_transcripts rows per the pinned transcript rules: payload serialisation, scrub before
    content_sha256/content_bytes, empty and binary block handling, sidecar-or-truncated.
- file: src/turn_capture/sessions.py
  action: Create
  purpose: Pure builders for telemetry_sessions and telemetry_agents rows for the root and every sub-agent session, per the pinned session and agent rules.
- file: src/turn_capture/cursor.py
  action: Create
  purpose: >-
    CaptureCursor (frozen dataclass) with to_json/from_json, validation, pin-mismatch checks and the version-mismatch
    reset, per the pinned cursor rules (split from record_turn.py up front; the independent review sizes the cursor and
    the pass algorithm at about 200 + 260 SLOC).
- file: src/turn_capture/record_turn.py
  action: Create
  purpose: >-
    PRODUCER = 'claude_code', PARSER_VERSION = 1 (hand-maintained, Decision 207 R1), and
    record_turn(tree, cursor, *, project_ref, billing_shape='fixed_non_rollover_allowance', session_final=False) ->
    CaptureResult per the pinned cursor and emission
    rules: re-parses the whole tree each pass, selects only rows not yet emitted, returns telemetry_observations,
    telemetry_transcripts, telemetry_agents then ONE telemetry_sessions batch LAST, plus the next cursor (persisted by the
    caller only after every batch was written) and count-only diagnostics. No file writes, no network, no writer call.
- file: src/turn_capture/render.py
  action: Create
  purpose: >-
    render_rows_json(rows): datetimes as RFC 3339 with exactly three fraction digits and Z (the envelope's every-hop
    millisecond obligation), sorted keys -- the wire form a 3b hook sends; pulled forward from 3b because the golden
    expected output uses it.
- file: config/telemetry/parser_versions.yaml
  action: Create
  purpose: >-
    rec-4122 registry: per producer, current version and an append-only history of {version, date, golden_digest,
    reason}; claude_code current 1 with the digest of the golden corpus's committed expected output.
- file: config/agent/data_quality/source_registry.yaml
  action: Modify
  purpose: >-
    Add canonical_id claude-code-subagent (a sub-agent spawned by the Claude Code Agent tool; its raw agentType is
    carried in telemetry_agents.agent_name) -- the telemetry_agents.agent_type registry key the producer emits. One entry,
    not one per agent type: the Claude Code set is open and user-extensible. Side effect, accepted by the shared-registry
    contract: it also becomes a valid ops_recommendations.source value that get_rec_write_guidance offers when filing
    recs (Decision 66).
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: >-
    Add src/turn_capture to excludes beside src/telemetry (Decision 79 V2 ground; the wildcard src/ include would otherwise
    package it). The edit marks data-pipeline affected through its own manifest only; no deploy is owed -- neither
    deploy-prod-lambdas nor deploy-ducklake-lambdas push paths match the manifest or src/turn_capture (step 11).
- file: .importlinter
  action: Modify
  purpose: >-
    New forbidden contract src-turn-capture-is-plane-neutral: source src.turn_capture; forbidden scripts, src.common,
    src.data, src.lambdas, src.telemetry.append, src.telemetry.gate, src.telemetry.identity (the producer sends refs,
    never ids, and never calls the write boundary; src.telemetry.timestamps is its only first-party import).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: Add a turn-capture route targeting src/turn_capture/ plus a dated field_add amendment_log entry (slice-1 telemetry-kernel precedent).
- file: tests/turn_capture/__init__.py
  action: Create
  purpose: Test package marker (Decision 130/131 mirror layout).
- file: tests/fixtures/turn_capture_corpus.py
  action: Create
  purpose: >-
    Shared test helpers (tests/CLAUDE.md shared-helper home; importable by tests/turn_capture/ and
    tests/telemetry/test_parser_version_registry.py alike; stdlib only, fast tier): load a golden case file into the
    in-memory tree; a runtime builder for secret-shaped strings assembled by concatenation (no credential-shaped literal
    is ever committed -- the never-commit hook and detect-secrets would block it); normalise(), deriving every KEY_PLANS
    key and event_id with fixed test tenant/project ULIDs via src.telemetry.identity; golden_digest(), the single digest
    definition from index.json's purpose, applied to committed expected_rows or to recomputed output alike.
- file: tests/fixtures/turn_capture_ducklake.py
  action: Create
  purpose: >-
    Shared local-DuckLake helper for the two integration modules: duckdb imported lazily inside the functions, never at
    module scope; builds the four tables from the ratified contracts (load_contract + resolve_refs +
    _project_contract_table + EventTableSpec.from_projection, partitioned by the calendar-day triple, UTC before ATTACH,
    inlining off) and FAILS, never skips, when the extension is unavailable (rec-4071 precedent).
- file: tests/fixtures/turn_capture/golden/index.json
  action: Create
  purpose: >-
    Corpus index (JSON, test_fixtures class under Decision 166): the ordered case list the registry digest walks and the
    pinned case-file shape {"files": {relpath: body}, "expected_rows": [...]} -- file bodies are JSON-encoded strings, so
    the trailing-partial-line and malformed-line inputs survive the end-of-file-fixer and trailing-whitespace hooks.
    expected_rows are canonical normalised rows incl. derived ids, sorted by table then event_id, created_timestamp and
    producer_version excluded. The golden digest (one definition, used for both the committed and the recomputed side)
    = sha256 over, for each case in index.json order, the case basename, a newline, and json.dumps(expected_rows,
    sort_keys=True, separators=(",", ":"), ensure_ascii=False), newline-joined. The corpus is synthetic; every DuckLake-loaded case stays below 65,536 bytes per payload
    (Decision 199 cl.5). The listed case files become .secrets.baseline keys (64-hex content_sha256 values read as Hex
    High Entropy); the resulting baseline rewrite is sanctioned by implement-scope-boundary.yaml's
    secrets_baseline_regeneration row (trigger scope_file_in_secrets_baseline), never hand-edited.
