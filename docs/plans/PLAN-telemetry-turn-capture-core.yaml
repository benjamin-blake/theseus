execution_steps:
- >-
  Tests first: create tests/turn_capture/ (conftest, golden corpus, the nine test modules),
  tests/telemetry/test_parser_version_registry.py and the new bundle-check node. Confirm the VP nodes FAIL on the
  unchanged tree.
- >-
  Run the step-8 conformance walk (independent raw reader only) over the implementing session's own transcripts FIRST,
  after spawning at least one sub-agent, to pin the literal values the facts left open before PARSER_VERSION 1 is frozen:
  the background-agent completion record predicate, the harness denial and interrupt sentinels, the compact/resume hook
  names, whether any record lacks a parseable timestamp. Add a synthetic golden case for each pinned literal.
- >-
  Create src/turn_capture/{__init__,scrub,transcript,observations,sessions,record_turn,render}.py per scope and the
  pinned-rules steps below (normative for this plan; the independent review's section 2 tables are the detailed
  reference where these steps are silent -- where they conflict, these steps win).
- >-
  Pinned reader rules: a line is a record iff newline-terminated and json.loads yields a dict; a trailing partial line is
  NOT consumed; a terminated non-object line is malformed (counted, consumed, never a row source). Stream = (sessionId,
  agentId-or-None) from record fields, sub-agent files being the normal carrier. session_started_at = the first record in
  ROOT file order whose timestamp parses under parse_iso8601_utc (any record type), else DEFER (no rows, no cursor).
  Prompt-record = type user, promptId non-empty, no sourceToolUseID, turnCompanion falsy, content a str or a list without
  tool_result blocks; companion records never open a turn. A turn spans from its first prompt-record to the next
  prompt-record with a different promptId; it is CLOSED iff such a record exists or session_final (finalize is exactly a
  virtual prompt-record at EOF). Response = assistant records of one stream sharing message.id; owner = the last one.
  Sidecars resolve only as <session dir>/tool-results/<basename(persistedOutputPath)>, never the absolute path.
- >-
  Pinned observation rules (session_ref = the stream's session entity_ref): turn open at the first prompt-record
  ('<uuid>#0/turn_open'), turn close at the LAST assistant record of the span ('<uuid>#<block>/turn_close'; none -> no
  close row), entity_ref '<session entity_ref>/<promptId>', sequence 1-based. model_call point per response: contract
  refs, event_timestamp and the four token classes (input, output, cache_read_input, cache_creation_input; absent -> 0)
  from the owner, model, billing_shape = the pinned billing_shape input (default fixed_non_rollover_allowance, Decision 206
  cl.3/cl.7: the credential's shape; rec-4147 owns its 3b source), persona_backend NULL, provider
  NULL, parent = the turn. tool_call open at each tool_use block ('<uuid>#<block>/tool_call_open', entity_ref toolUseId,
  name, parent turn, sequence 1-based in the turn) and close at its tool_result block ('.../tool_call_close'); outcome
  precedence blocked (is_error and a pinned denial prefix, or a hook_* attachment for that toolUseID with exitCode 2),
  then interrupted (toolUseResult.interrupted or a pinned interrupt sentinel, or the turn closed with no result), then
  error (is_error), else success. process_event point per hook_* attachment ('<uuid>#0/process_event', entity_ref =
  external_ref, name 'hook:<stem of the .py/.sh script in command>' else 'hook:<hookName with : as .>', severity info
  for exit 0, error for 2, warning otherwise, parent = the tool_call for its toolUseID else the turn). Tool errors are
  NOT process_events.
- >-
  Pinned transcript rules (external_ref = entity_ref = '<uuid>#<block>'; content scrubbed BEFORE content_sha256 and
  content_bytes; content_truncated false unless noted; empty payload -> no row; image/binary blocks replaced by a
  {type, media_type, sha256, bytes} stub): prompt/human from prompt-record text; system/harness from isMeta and companion
  records; thinking, response and tool_input (sorted-key JSON of input) are agent rows owned by the model_call with model
  set; tool_result owned by the tool_call, origin tool (harness when the text is a pinned sentinel), full sidecar content
  when it resolves else the preview with content_truncated true. Attachments emit no transcript rows in 3a.
- >-
  Pinned session and agent rules: root open marker '<sessionId>#0/open' (synthetic source id -- the pin record can lack a
  uuid; stable across versions for R3), event_timestamp = session_started_at, entity_ref sessionId, workflow = the first
  prompt's leading slash command when one of orient|plan|implement|develop-executor|audit|overseer else claude_code,
  execution_attempt 1, branch = first non-empty gitBranch, model_primary = first assistant model; emitted once its turn
  is closed. resume/compact rows from SessionStart:resume, SessionStart:compact, PreCompact and PostCompact hook
  attachments (execution_attempt 2+ on resume). Sub-agent session '<sessionId>:<agentId>#0/open', entity_ref
  '<sessionId>:<agentId>', parent_session_ref = the spawning stream's session, workflow subagent, event_timestamp and
  session_started_at = the ROOT's (contract letter; risk filed). A child's rows are emitted only once the parent holds its
  completion (sync: the spawning tool_result; background: the pinned completion record) or session_final.
  telemetry_agents open/close keyed on the spawning toolUseId (meta.json; fallback toolUseResult.agentId), session_ref =
  child, observation_ref = the spawning tool_call, agent_type claude-code-subagent, agent_name = agentType, trigger
  subagent_sync|subagent_background, version = the CLI version field, outcome failed on is_error/interrupted else
  success, error scrubbed. No close/annotate session rows in 3a.
- >-
  Pinned cursor and emission rules: one cursor per root tree -- {cursor_format, producer, parser_version,
  root_session_ref, project_ref, billing_shape, session_started_at_ms (integer epoch ms), per-file lines_consumed,
  sidecar dispositions (present+sha256 | absent)} -- positions and pins only, never pending rows (Decision 84 I-4). Each pass re-parses the whole tree and emits exactly the rows of closed turns (and complete
  sub-agents) not emitted before. A different project_ref, billing_shape or root session raises; a sidecar contradicting a present pin
  raises; an absent pin is honoured. parser_version mismatch -> reset everything except the four pins and re-emit the
  whole tree (data first, sessions last).
- >-
  Pinned scrubber rules (replacement '[REDACTED:<CLASS>]', applied in order, each once): AWS_ACCESS_KEY_ID (AKIA, ASIA,
  AIDA, AROA, AGPA, ANPA, ANVA, ASCA, APKA + 16 [A-Z0-9], word-bounded); AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN
  (context-anchored on their key names with = or :); ANTHROPIC_API_KEY (sk-ant- + 20+ [A-Za-z0-9_-], boundary-guarded);
  GITHUB_TOKEN (ghp_/gho_/ghu_/ghs_/ghr_ + 36-255 alphanumerics; github_pat_ + 80+ [A-Za-z0-9_]); BEARER_TOKEN (Bearer +
  20+ token chars containing a digit or 32+ long). Applied to transcript content, metadata JSON and agents.error; never to
  refs, ids, tool/model/hook names. A pattern change is a parser_version bump by construction.
- >-
  Pinned conformance invariants (independent raw walk, never src.turn_capture.transcript): root transcripts under
  TURN_CAPTURE_REAL_TRANSCRIPTS else ~/.claude/projects/*/*.jsonl, FAIL when none; per stream, model_call rows ==
  distinct message.id; tool_call opens == tool_use blocks and closes == tool_result blocks plus interrupted closes;
  turn opens == distinct prompt promptIds; one agents open and one child session per meta.json whose toolUseId is in the
  tree; the four token sums equal the raw final-usage sums; no duplicate (table, external_ref); every ref passes
  canonical_ref; one session_started_at per tree; incremental == full at every prompt and every 50 lines; no scrub
  pattern (plus a broader second set) matches any stored value; resolvable sidecars stored untruncated; zero malformed
  lines; then append_events into local DuckLake with every FK resolving. Print the drift dashboard (unknown record and
  attachment types, outcome and stop_reason distributions) as counts only.
- >-
  Generate expected_rows.jsonl per case from the implementation, review each row against the pinned rules (never accept
  generated output unread), then write config/telemetry/parser_versions.yaml with the digest.
- Modify src/lambdas/data-pipeline/manifest.yaml, .importlinter, docs/contracts/file-router.yaml and config/agent/data_quality/source_registry.yaml per scope.
- Write the registry rows for graduated steps 1, 3, 4 and 5, plus module-level rows turn-capture-plane-neutral and turn-capture-excluded-from-data-pipeline.
- Execute Verification Plan steps 1-10 -- loop until pass (Decision 55).
- >-
  Portal bookkeeping (get_rec_write_guidance first, Decision 66; fetch-before-update via rec_by_id, prepend a dated note,
  never overwrite): rec-4026 context gains the slice-3a delivery, the handed-on list and the tool-error deviation from
  context; rec-4063 gains the note that the pending-generation DQ intent must key off marker presence, not elapsed time
  (resumed sessions append days later); acceptance unchanged on both.
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence),
  each reported on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness, record each state as
  reported. (b) Set implementation_declared true on this plan, then re-run bin/venv-python -m scripts.validate --pre.
  (c) Commit, git fetch origin main and git rebase origin/main (STOP on conflict), then VP step 10 on the committed,
  rebased, clean tree and bin/venv-python -m scripts.checks.validation_result --verify-head; on timeout the disposition is
  blocked. (d) Structured postflight evidence via scripts.session.postflight --evidence. (e) Push, open the PR, subscribe,
  on green CI squash-merge with commit_message carrying 'Resolves: rec-4122' in its own trailer block; then run step 11.
rollback: >-
  Revert the squash commit. Nothing is deployed, provisioned or registered; the excludes line and importlinter contract
  revert with it. rec-4122 re-opens via update_rec if the revert lands after closure.
