- step: 9
  phase: pre-deploy
  action: End to end on a real local DuckLake catalog built from the ratified contracts (Decision 99 pinned engine).
  command: bin/venv-python -m pytest tests/turn_capture/test_capture_ducklake_integration.py -m integration -q
  expected: Exit 0; no skips (the fixture fails, never skips, when the extension is unavailable).
  fix_if: >-
    An AppendError names a column or type -> fix the producer row (never loosen the kernel gate); a dangling FK -> the ref
    grammar differs between parent and child rows.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Integration tier by construction (network-installed extension, importorskip duckdb). Steps 3 and 4 guard the emitted
    shape and R7 standing in the fast tier.
- step: 10
  phase: pre-deploy
  action: >-
    Real-transcript conformance (operator choice 2026-09-28): the producer over REAL Claude Code transcripts on the
    implementer's machine, reconciled against an independent raw walk, then loaded into local DuckLake.
  command: bin/venv-python -m pytest tests/turn_capture/test_real_transcript_conformance.py -m integration -q -s
  expected: >-
    Exit 0; no skips; at least one root transcript containing a tool call and a sub-agent is exercised (the implementing
    session's own transcript qualifies once it has spawned an agent); the printed report lists the counts reconciled and
    the format-drift dashboard.
  fix_if: >-
    A mismatch names the session hash, record type and count -- a real shape the synthetic corpus missed: add a synthetic
    golden case reproducing that shape, fix the mapping, regenerate expected rows and bump if step 5 says so. Never
    commit real content; never weaken an invariant. A (table, external_ref) recurring ACROSS root trees (forked or
    copied history) cannot be fixed by the mapping without changing a ratified ref grammar (constraints[1]): STOP, file
    a contract-risk rec against the external_ref uniqueness scope, and return to /plan.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs machine-local real Claude Code transcripts that CI runners do not have and the public repository must never
    hold; a registry row could never run. Steps 3 and 4 are the standing fast-tier guards of the same rules on the
    synthetic corpus, and every shape it discovers is fed back as a synthetic golden case.
- step: 11
  phase: pre-deploy
  action: >-
    Assert no changed file matches either deploy workflow's push path globs and data-pipeline is flagged only via its own
    manifest (the V2 ground, Decision 79 note; slice-1 VP13 form).
  command: >-
    bin/venv-python -c "import fnmatch,subprocess,yaml;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hits={wf:[f
    for f in ch if any(fnmatch.fnmatch(f,g) for g in ((w.get('on') or w.get(True))['push']['paths']))] for wf in ('deploy-ducklake-lambdas','deploy-prod-lambdas')
    for w in [yaml.safe_load(open('.github/workflows/%s.yml'%wf,encoding='utf-8'))]};hits={k:v for k,v in hits.items() if v};from scripts.lambda_manifest import compute_affected_artifacts as ca;aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert
    ch and not hits and aff in ({},{'data-pipeline':['src/lambdas/data-pipeline/manifest.yaml']});print('NO_DEPLOY_TRIGGER_OK')"
  expected: >-
    Exit 0, the changed-file count (tracked diff against the merge-base with origin/main plus untracked files) is
    non-zero, the hits map is empty and affected is empty or data-pipeline via its manifest only.
  fix_if: >-
    A hit means a DuckLake-channel or prod-channel file changed -- move the code out of that path; data-pipeline
    affected by a src/turn_capture file means the exclude is missing. Never deploy.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Reads the transient diff against the merge-base with origin/main, empty on main after merge, so a registry row could
    never discriminate; the standing guards are step 7's bundle test, the deploy workflows' own path filters and
    validate_deploy_channel_conformance.
- step: 12
  phase: pre-deploy
  action: Full validation tier before handoff (SLOC, size, per-file coverage, graduation completeness, import contracts).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; decompose rather than raise a budget; never skip a check.
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    Closure -- after the squash merge carrying 'Resolves: rec-4122', confirm it reads closed and rec-4026 stays open.
  command: >-
    bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;
    r={d['id']:d for d in (json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip())};
    a,b=r.get('rec-4122',{}),r.get('rec-4026',{}); print(a.get('status'),b.get('status'),'SLICE 3A DELIVERED' in (b.get('context') or ''));
    raise SystemExit(0 if (a.get('status'),b.get('status'))==('closed','open') and 'SLICE 3A DELIVERED' in (b.get('context') or '') else 1)"
  expected: Exit 0; rec-4122 closed, rec-4026 open with its dated slice-3a note.
  fix_if: >-
    Cache sync pulls 0 recs (reader unreachable) -> confirm with the ducklake-reads rec_by_id named read; trailer closure
    no-op'd -> Decision 201 manual update_rec fallback citing the transport failure; never force-close.
