schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-turn-capture-core
intent: >-
  Telemetry slice 3a (rec-4026, T3.20): build the plane-neutral Claude Code transcript producer core -- transcript reader,
  CD.40 credential scrubber, and a cursor-driven capture API emitting ref-bearing rows for all four telemetry tables under
  the Decision 207 R7 producer obligations -- plus rec-4122's parser_version registry and golden-corpus checks, proven on
  a real local DuckLake built from the ratified contracts and reconciled against real Claude Code transcripts. Turn,
  friction and cost telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this is its first
  producer.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-turn-capture-core.yaml
phase: >-
  T3.20 (agent-turn telemetry capture) -- producer-core groundwork only; closes NO exit criterion (c1 needs the hooks
  landed and c2 the writer boundary, both slice 3b on rec-4026 after slice 2 / rec-4024 merges). Builds on T2.36's
  slice-1 kernel (#1286) and the closed contract-risk recs rec-4058..4061 (#1295, #1314).
scope:
- file: src/turn_capture/__init__.py
  action: Create
  purpose: Package marker; docstring only, imports and defines nothing (mirrors src/telemetry/__init__.py, no re-export facade).
- file: src/turn_capture/scrub.py
  action: Create
  purpose: >-
    CD.40 pre-write credential scrubber, stdlib re only, per the pinned scrubber rules in execution_steps. scrub_text(str)
    -> ScrubResult(text, counts per class). Deterministic, idempotent, never raises on any str, never reports matched text.
- file: src/turn_capture/transcript.py
  action: Create
  purpose: >-
    Claude Code transcript reader and stream assembly (stdlib json/pathlib): TranscriptTree protocol with a filesystem
    implementation and an in-memory twin for tests; line rules, record classification, stream membership, turn spans,
    response grouping, sub-agent meta discovery and the session_started_at pin, per the pinned reader rules.
- file: src/turn_capture/observations.py
  action: Create
  purpose: Pure builders for telemetry_observations and telemetry_transcripts rows (refs only, never ids), per the pinned observation and transcript rules.
- file: src/turn_capture/sessions.py
  action: Create
  purpose: Pure builders for telemetry_sessions and telemetry_agents rows for the root and every sub-agent session, per the pinned session and agent rules.
- file: src/turn_capture/record_turn.py
  action: Create
  purpose: >-
    PRODUCER = 'claude_code', PARSER_VERSION = 1 (hand-maintained, Decision 207 R1), the CaptureCursor, and
    record_turn(tree, cursor, *, project_ref, billing_shape='fixed_non_rollover_allowance', session_final=False) ->
    CaptureResult per the pinned cursor and emission
    rules: re-parses the whole tree each pass, selects only rows not yet emitted, returns telemetry_observations,
    telemetry_transcripts, telemetry_agents then ONE telemetry_sessions batch LAST, plus the next cursor (persisted by the
    caller only after every batch was written) and count-only diagnostics. No file writes, no network, no writer call.
- file: src/turn_capture/render.py
  action: Create
  purpose: >-
    render_rows_json(rows): datetimes as RFC 3339 with exactly three fraction digits and Z (the envelope's every-hop
    millisecond obligation), sorted keys -- the wire form a 3b hook sends; pulled forward from 3b because the golden
    expected output uses it.
- file: config/telemetry/parser_versions.yaml
  action: Create
  purpose: >-
    rec-4122 registry: per producer, current version and an append-only history of {version, date, golden_digest,
    reason}; claude_code current 1 with the digest of the golden corpus's committed expected output.
- file: config/agent/data_quality/source_registry.yaml
  action: Modify
  purpose: >-
    Add canonical_id claude-code-subagent (a sub-agent spawned by the Claude Code Agent tool; its raw agentType is
    carried in telemetry_agents.agent_name) -- the telemetry_agents.agent_type registry key the producer emits. One entry,
    not one per agent type: the Claude Code set is open and user-extensible.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: Add src/turn_capture to excludes beside src/telemetry (Decision 79 V2 ground; the wildcard src/ include would otherwise package it).
- file: .importlinter
  action: Modify
  purpose: >-
    New forbidden contract src-turn-capture-is-plane-neutral: source src.turn_capture; forbidden scripts, src.common,
    src.data, src.lambdas, src.telemetry.append, src.telemetry.gate, src.telemetry.identity (the producer sends refs,
    never ids, and never calls the write boundary; src.telemetry.timestamps is its only first-party import).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: Add a turn-capture route targeting src/turn_capture/ plus a dated field_add amendment_log entry (slice-1 telemetry-kernel precedent).
- file: tests/turn_capture/__init__.py
  action: Create
  purpose: Test package marker (Decision 130/131 mirror layout).
- file: tests/turn_capture/conftest.py
  action: Create
  purpose: >-
    Shared fixtures: golden-corpus loading into the in-memory tree; a runtime builder for secret-shaped strings assembled
    by concatenation (no credential-shaped literal is ever committed -- the never-commit pre-commit hook and
    detect-secrets would block it); normalise(), which derives every KEY_PLANS key and event_id from emitted rows with
    fixed test tenant/project ULIDs via src.telemetry.identity (the normalised output the registry digest covers);
    a local-DuckLake fixture building the four tables from the ratified contracts (fails, never skips, when the extension
    is unavailable -- rec-4071 precedent).
- file: tests/fixtures/turn_capture/golden/
  action: Create
  purpose: >-
    Synthetic golden corpus under the Decision 166 test_fixtures class (captured data asserted against; exempt from the
    500-line and 2,000-char structural caps a corpus under tests/turn_capture/ would hit), one directory per case named for the rule it pins, each with
    expected_rows.jsonl (canonical normalised rows incl. derived ids, sorted by table then event_id; created_timestamp and
    producer_version excluded). Cases: pin_first_record_without_uuid, multiblock_response_interleaved_tool_results,
    meta_and_companion_records, tool_result_error, tool_result_interrupted, hook_blocked_tool_call, sidecar_present,
    sidecar_absent, subagent_sync, subagent_background_with_completion, subagent_background_without_completion,
    nested_subagent_depth2, hooks_resume_and_compact, empty_thinking_and_image_blocks, orphan_tool_result,
    unknown_record_and_attachment_types, trailing_partial_line, malformed_line, large_tool_result_over_64k, and the
    runtime-built secrets case (committed expected output carries markers only). Every DuckLake-loaded case stays below
    65,536 bytes per payload (Decision 199 cl.5: spill is the writer's).
- file: tests/turn_capture/test_scrub.py
  action: Create
  purpose: Scrubber rules -- every class redacted (plain, JSON-escaped, multi-line), idempotence, determinism, the negative corpus, counts never content.
- file: tests/turn_capture/test_transcript.py
  action: Create
  purpose: Reader rules -- line rules, classification, stream membership, turn spans, response grouping, the pin and deferral, sidecar resolution by basename.
- file: tests/turn_capture/test_observations.py
  action: Create
  purpose: One assertion per observation/transcript column rule, outcome precedence, hook signature and severity, scrub-before-hash, empty/binary block handling.
- file: tests/turn_capture/test_sessions.py
  action: Create
  purpose: Session and agent rules -- open marker ref, workflow, sub-agent completeness, deferral, agent_type registered in source_registry.yaml.
- file: tests/turn_capture/test_record_turn.py
  action: Create
  purpose: >-
    Golden corpus equality (every case); R7 -- sessions batch last, incremental equals full at every line cut, finalize
    equals a virtual prompt at EOF, cursor reset on a version mismatch reusing pins, pin mismatch and sidecar mutation are
    loud, cursor JSON round-trip; every emitted row key is caller-known for its EventTableSpec built from the real contract.
- file: tests/turn_capture/test_render.py
  action: Create
  purpose: Exactly three fraction digits and Z; sub-millisecond input never rounds up; sorted keys.
- file: tests/turn_capture/test_package_boundary.py
  action: Create
  purpose: AST scan -- src/turn_capture runtime imports are stdlib or src.telemetry.timestamps only; __init__ defines nothing; the importlinter contract is declared.
- file: tests/turn_capture/test_capture_ducklake_integration.py
  action: Create
  purpose: >-
    pytest.mark.integration, real local DuckLake (pinned engine, UTC before ATTACH, inlining off): append every batch of
    the DuckLake-loaded golden cases in order through src.telemetry.append.append_events with the fixed tenant/project
    ULIDs (writer-side resolved inputs, Decision 200); assert inserted counts, every FK join resolves (observations and
    transcripts session_id, transcripts observation_id, agents child session_id and spawning observation_id, both self
    trees), one session_started_at per tree, no stored content over 65,536 bytes, replay inserts 0, a mutated re-send
    raises TELEMETRY_GRAIN_CONFLICT, and a parser_version v+1 re-emission is selected over v by
    tests/fixtures/telemetry_dedupe_reference.py.
- file: tests/turn_capture/test_real_transcript_conformance.py
  action: Create
  purpose: >-
    pytest.mark.integration conformance against REAL Claude Code transcripts on the implementer's machine (operator
    choice 2026-09-28; nothing from them is committed, the repository is public), per the pinned conformance invariants.
    Failure messages and the printed report carry counts, types, booleans and hashed session ids only, never content.
- file: tests/telemetry/test_parser_version_registry.py
  action: Create
  purpose: >-
    rec-4122 checks (stdlib, fast tier): test_output_drift_without_bump_fails, test_bump_without_drift_fails,
    test_expected_edit_without_bump_fails, test_registry_history_is_append_only_against_main (via
    scripts.checks._marker_guard.default_base_reader; an unreachable base is an advisory pass locally and authoritative
    in PR CI), and the live guard test_registry_matches_producer (PARSER_VERSION == current == last history version;
    recomputed golden digest == history digest == committed expected-file digest).
- file: tests/lambda_manifest/test_bundle_checks.py
  action: Modify
  purpose: Add test_turn_capture_excluded_from_data_pipeline (excludes entry present, compute_affected_artifacts inert, staged bundle carries no turn_capture path).
bundled_recommendations:
- rec-4122
followon_recs:
- rec-4026
- rec-4146
- rec-4147
infrastructure_dependencies: []
acceptance_criteria:
- src/turn_capture/ holds the six modules, each under 500 SLOC and at 100% per-file coverage from its mirror test, importing only stdlib and src.telemetry.timestamps at runtime; the importlinter contract passes.
- Every golden case parses to exactly its expected_rows.jsonl, and no emitted value contains a secret-shaped string.
- record_turn writes telemetry_sessions last, incremental capture at every line cut equals one full parse, finalize equals a virtual prompt at EOF, and a version mismatch resets while reusing the pinned inputs.
- All four tables built from the ratified contracts accept the output through append_events on a real local DuckLake with every FK resolving, replay inserting 0 and a mutated re-send rejected.
- On real Claude Code transcripts from the implementer's machine the output reconciles with an independent raw walk (response ids, tool_use/tool_result blocks, prompts, sub-agent files, token sums, sidecars) and loads into local DuckLake with every FK resolving.
- config/telemetry/parser_versions.yaml holds claude_code current 1; the registry tests fail on drift without a bump, a bump without drift, an expected-file edit without a bump, and a rewritten history entry.
- compute_affected_artifacts is empty for every scope file; no Lambda, Terraform, field_semantics.yaml, table registration or hook change.
- rec-4122 is closed by the squash-merge trailer; rec-4026 stays open with its context updated to the slice-3b obligations.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Credential scrubber keystone (fast tier, stdlib).
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_scrub.py::test_every_credential_class_is_redacted
    tests/turn_capture/test_scrub.py::test_scrub_is_idempotent tests/turn_capture/test_scrub.py::test_negative_corpus_untouched -q
  expected: 'Exit 0, 3 passed. Red before: the module and nodes do not exist on the pre-change tree.'
  fix_if: A class survives -> widen that pattern; a false positive -> tighten its anchor or boundary. Never delete a case.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-credential-scrub
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Reader rules -- pin, deferral, partial line, stream membership and turn spans.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_transcript.py::test_pin_is_first_parseable_timestamp_in_root_file_order
    tests/turn_capture/test_transcript.py::test_no_timestamp_defers
    tests/turn_capture/test_transcript.py::test_trailing_partial_line_not_consumed
    tests/turn_capture/test_transcript.py::test_companion_records_never_open_a_turn
    tests/turn_capture/test_transcript.py::test_sidecar_resolved_by_basename_under_session_dir -q
  expected: 'Exit 0, 5 passed. Red before: nodes absent.'
  fix_if: A failing node names the reader rule -- fix transcript.py against the pinned reader rules, never the fixture.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Step 3's graduated golden-corpus row runs the same reader over every case on every run; a second row duplicates it.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Golden corpus equality plus the per-rule emission nodes.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
    tests/turn_capture/test_observations.py::test_model_call_owned_by_last_record_one_per_response
    tests/turn_capture/test_observations.py::test_tool_call_outcome_precedence
    tests/turn_capture/test_observations.py::test_every_hook_attachment_is_one_process_event
    tests/turn_capture/test_sessions.py::test_agent_type_is_registered_source
    tests/turn_capture/test_record_turn.py::test_no_secret_shaped_value_emitted
    tests/turn_capture/test_record_turn.py::test_rows_use_only_caller_known_columns -q
  expected: 'Exit 0, 7 passed. Red before: nodes absent.'
  fix_if: >-
    Golden mismatch -> fix the mapping if it departs from the pinned rules, else regenerate expected_rows.jsonl AND bump
    (step 5 fails otherwise); unknown column -> rename the ref key to the EventTableSpec caller-known name.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-golden-corpus
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: R7 producer obligations in record_turn.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_sessions_batch_written_last
    tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
    tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
    tests/turn_capture/test_record_turn.py::test_cursor_reset_on_version_mismatch_reuses_pins
    tests/turn_capture/test_record_turn.py::test_pin_mismatch_and_sidecar_mutation_are_loud -q
  expected: 'Exit 0, 5 passed. Red before: nodes absent.'
  fix_if: >-
    Incremental differs from full -> a row depends on records after its emission point; hold it until its turn closes. A
    reset re-reads project_ref or re-derives session_started_at -> read them from the cursor.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-r7-incremental-equals-full
  expected_literals: []
- step: 5
  phase: pre-deploy
  action: rec-4122 acceptance as filed plus the registry checks.
  command: >-
    bin/venv-python -m pytest tests/telemetry/test_parser_version_registry.py::test_output_drift_without_bump_fails
    tests/telemetry/test_parser_version_registry.py::test_bump_without_drift_fails
    tests/telemetry/test_parser_version_registry.py::test_expected_edit_without_bump_fails
    tests/telemetry/test_parser_version_registry.py::test_registry_history_is_append_only_against_main
    tests/telemetry/test_parser_version_registry.py::test_registry_matches_producer -q && echo ACCEPTANCE_OK
  expected: Exit 0, 5 passed and the success marker printed. Red before, the module does not exist.
  fix_if: >-
    Live guard fails -> the output changed: bump PARSER_VERSION, append a history entry with the new digest, regenerate
    expected_rows.jsonl; never edit a past history entry.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-parser-version-registry
  expected_literals:
  - ACCEPTANCE_OK
- step: 6
  phase: pre-deploy
  action: Plane-neutral boundary, import contracts and data-pipeline exclusion.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_package_boundary.py::test_runtime_imports_are_stdlib_or_timestamps
    tests/turn_capture/test_package_boundary.py::test_importlinter_contract_declared
    tests/lambda_manifest/test_bundle_checks.py::test_turn_capture_excluded_from_data_pipeline -q &&
    bin/venv-python -c "from scripts.import_governance import run_import_contracts as r; ok,out=r(); print(out[-400:]); assert ok; print('IMPORTS_OK')"
  expected: Exit 0, 3 passed and the import success marker printed.
  fix_if: A forbidden import -> take the value as an argument or move the logic; never widen the contract or drop the exclude.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Multiple commands; the two pytest modules are graduated at module level by the implementing session's registry rows
    turn-capture-plane-neutral and turn-capture-excluded-from-data-pipeline (slice-1 precedent), and lint-imports already
    runs in every scripts.validate tier.
  expected_literals:
  - IMPORTS_OK
- step: 7
  phase: pre-deploy
  action: End to end on a real local DuckLake catalog built from the ratified contracts (Decision 99 pinned engine).
  command: bin/venv-python -m pytest tests/turn_capture/test_capture_ducklake_integration.py -m integration -q
  expected: Exit 0; no skips (the fixture fails, never skips, when the extension is unavailable).
  fix_if: >-
    An AppendError names a column or type -> fix the producer row (never loosen the kernel gate); a dangling FK -> the ref
    grammar differs between parent and child rows.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Integration tier by construction (network-installed extension, importorskip duckdb). Steps 3 and 4 guard the emitted
    shape and R7 standing in the fast tier.
- step: 8
  phase: pre-deploy
  action: >-
    Real-transcript conformance (operator choice 2026-09-28): the producer over REAL Claude Code transcripts on the
    implementer's machine, reconciled against an independent raw walk, then loaded into local DuckLake.
  command: bin/venv-python -m pytest tests/turn_capture/test_real_transcript_conformance.py -m integration -q -s
  expected: >-
    Exit 0; no skips; at least one root transcript containing a tool call and a sub-agent is exercised (the implementing
    session's own transcript qualifies once it has spawned an agent); the printed report lists the counts reconciled and
    the format-drift dashboard.
  fix_if: >-
    A mismatch names the session hash, record type and count -- a real shape the synthetic corpus missed: add a synthetic
    golden case reproducing that shape, fix the mapping, regenerate expected rows and bump if step 5 says so. Never
    commit real content; never weaken an invariant.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: Deploy-inertness across the whole diff.
  command: >-
    bin/venv-python -c "from scripts.lambda_manifest import compute_affected_artifacts as c; import subprocess;
    f=subprocess.run(['git','diff','--name-only','origin/main...HEAD'],capture_output=True,text=True,check=True).stdout.split();
    a=c(f); print(a); assert a=={}; print('INERT_OK')"
  expected: Exit 0 and the success marker printed.
  fix_if: A non-empty map names the artifact -- add the missing exclude or move the file; never deploy.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Diff-relative to origin/main by construction; step 6's bundle test is the standing guard.
- step: 10
  phase: pre-deploy
  action: Full validation tier before handoff (SLOC, size, per-file coverage, graduation completeness, import contracts).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; decompose rather than raise a budget; never skip a check.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: >-
    Closure -- after the squash merge carrying 'Resolves: rec-4122', confirm it reads closed and rec-4026 stays open.
  command: >-
    bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json,pathlib; r={json.loads(l)['id']:json.loads(l)['status']
    for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()}; print(r.get('rec-4122'),
    r.get('rec-4026')); raise SystemExit(0 if (r.get('rec-4122'),r.get('rec-4026'))==('closed','open') else 1)"
  expected: Exit 0; rec-4122 closed, rec-4026 open.
  fix_if: >-
    Cache sync pulls 0 recs (reader unreachable) -> confirm with the ducklake-reads rec_by_id named read; trailer closure
    no-op'd -> Decision 201 manual update_rec fallback citing the transport failure; never force-close.
