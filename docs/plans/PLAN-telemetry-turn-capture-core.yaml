constraints:
- >-
  Deploy-inert (Decision 79/125/126): compute_affected_artifacts is empty or data-pipeline via its own manifest only
  (the excludes line; no deploy owed, neither deploy workflow's push paths match), and the src/turn_capture files are
  inert behind the exclude. No change under
  src/common/ducklake_*.py, src/telemetry/**, src/lambdas/** (only the data-pipeline manifest excludes line),
  config/lambda/ducklake/** or terraform/**; no field_semantics.yaml regeneration, no _CONTRACT_TABLE_IDS registration,
  no hook registration in .claude/settings.json, no writer or network call.
- >-
  Within the ratified Decision 199/200/206/207 model: no contract, identity-spec or partition change; producers send refs
  never ids; the ratified grammars are used verbatim. Where the contracts are silent or strained, follow the letter and
  file the risk (followon recs), never design around it. A session entity_ref grammar change needs a Decision (R10).
- >-
  Public repository (Decision 101): the golden corpus is synthetic; no real transcript content, credential, account id
  or hostname is committed; secret-shaped test strings are assembled at runtime, never written as literals.
- >-
  Every new module stays under 500 SLOC and is 100% covered by its own mirror test (decompose, never raise -- Decision
  128). No duckdb import in a fast-tier module.
- No rescue agents or workaround loops (Decision 55).
