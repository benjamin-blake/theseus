bundled_recommendations:
- rec-4122
followon_recs:
- rec-4026
- rec-4146
- rec-4147
infrastructure_dependencies:
- >-
  None owed. data-pipeline is marked affected only through its own manifest's excludes line (Decision 79 V2 ground,
  slice-1 precedent); neither deploy-prod-lambdas nor deploy-ducklake-lambdas push paths match any changed file (step 11).
acceptance_criteria:
- Every src/turn_capture/ module is under 500 SLOC and at 100% per-file coverage from its own mirror test, importing only stdlib and src.telemetry.timestamps at runtime; the importlinter contract passes.
- Every golden case parses to exactly the expected_rows array embedded in its case file, and no emitted value contains a secret-shaped string.
- record_turn writes telemetry_sessions last, incremental capture at every line cut equals one full parse, finalize equals a virtual prompt at EOF, and a version mismatch resets while reusing the pinned inputs.
- All four tables built from the ratified contracts accept the output through append_events on a real local DuckLake with every FK resolving, replay inserting 0 and a mutated re-send rejected.
- On real Claude Code transcripts from the implementer's machine the output reconciles with an independent raw walk (response ids, tool_use/tool_result blocks, prompts, sub-agent files, token sums, sidecars) and loads into local DuckLake with every FK resolving.
- config/telemetry/parser_versions.yaml holds claude_code current 1; the registry tests fail on drift without a bump, a bump without drift, an expected-file edit without a bump, and a rewritten history entry.
- compute_affected_artifacts is empty, or data-pipeline via its own manifest only; no changed file matches either deploy workflow's push paths; no Lambda, Terraform, field_semantics.yaml, table registration or hook change.
- rec-4122 is closed by the squash-merge trailer; rec-4026 stays open with its context updated to the slice-3b obligations.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Credential scrubber keystone (fast tier, stdlib).
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_scrub.py::test_every_credential_class_is_redacted
    tests/turn_capture/test_scrub.py::test_scrub_is_idempotent tests/turn_capture/test_scrub.py::test_negative_corpus_untouched -q
  expected: 'Exit 0, 3 passed. Red before: the module and nodes do not exist on the pre-change tree.'
  fix_if: A class survives -> widen that pattern; a false positive -> tighten its anchor or boundary. Never delete a case.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-credential-scrub
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Reader rules -- pin, deferral, partial line, stream membership and turn spans.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_transcript.py::test_pin_is_first_parseable_timestamp_in_root_file_order
    tests/turn_capture/test_transcript.py::test_no_timestamp_defers
    tests/turn_capture/test_transcript.py::test_trailing_partial_line_not_consumed
    tests/turn_capture/test_streams.py::test_companion_records_never_open_a_turn
    tests/turn_capture/test_transcript.py::test_sidecar_resolved_by_basename_under_session_dir -q
  expected: 'Exit 0, 5 passed. Red before: nodes absent.'
  fix_if: A failing node names the reader rule -- fix transcript.py or streams.py against the pinned reader rules, never the fixture.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Step 3's graduated golden-corpus row runs the same reader over every case on every run; a second row duplicates it.
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Golden corpus equality plus the per-rule emission nodes.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
    tests/turn_capture/test_observations.py::test_model_call_owned_by_last_record_one_per_response
    tests/turn_capture/test_observations.py::test_tool_call_outcome_precedence
    tests/turn_capture/test_observations.py::test_every_hook_attachment_is_one_process_event
    tests/turn_capture/test_transcripts.py::test_scrubbed_before_hash_empty_and_binary_blocks
    tests/turn_capture/test_refs.py::test_every_ref_passes_canonical_ref
    tests/turn_capture/test_render.py::test_three_fraction_digits_and_z_never_rounds_up
    tests/turn_capture/test_sessions.py::test_agent_type_is_registered_source
    tests/turn_capture/test_sessions.py::test_agent_rows_do_not_depend_on_meta_json
    tests/turn_capture/test_record_turn.py::test_no_secret_shaped_value_emitted
    tests/turn_capture/test_record_turn.py::test_rows_use_only_caller_known_columns -q
  expected: 'Exit 0, 11 passed. Red before: nodes absent.'
  fix_if: >-
    Golden mismatch -> fix the mapping if it departs from the pinned rules, else regenerate that case's expected_rows AND bump
    (step 5 fails otherwise); unknown column -> rename the ref key to the EventTableSpec caller-known name.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-golden-corpus
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: R7 producer obligations in record_turn.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_sessions_batch_written_last
    tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
    tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
    tests/turn_capture/test_record_turn.py::test_cursor_reset_on_version_mismatch_reuses_pins
    tests/turn_capture/test_record_turn.py::test_pin_mismatch_and_sidecar_mutation_are_loud
    tests/turn_capture/test_cursor.py::test_reset_keeps_exactly_the_four_pins -q
  expected: 'Exit 0, 6 passed. Red before: nodes absent.'
  fix_if: >-
    Incremental differs from full -> a row depends on records after its emission point; hold it until its turn closes. A
    reset re-reads project_ref or re-derives session_started_at -> read them from the cursor.
  hermetic: true
  graduation: graduate
  graduation_check_id: turn-capture-r7-incremental-equals-full
  expected_literals: []
- step: 5
