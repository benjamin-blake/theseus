schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coverage-debt-lint-blocked-files
intent: 'Pay the whole-file coverage debt on scripts/north_star_tracker.py (measured 0.0 percent) and scripts/lambda_manifest.py (measured 90.6 percent) by writing the missing tests, so validate_test_coverage stops refusing even a one-character lint fix to either file and the parked ruff wave B can land. Test files only: this plan changes no source.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coverage-debt-lint-blocked-files.yaml
phase: Coverage-debt paydown on the two files that block ruff wave B. No tier_item claimed and no exit criterion closed, so there is no closes_criteria field; soft-warn exception category ad_hoc_rec (operator brief 2026-09-04, option 1 for unblocking branch parked/ruff-wave-b-remaining-families). Bundles rec-3593, whose substance this plan is.
scope:
- file: tests/test_north_star_tracker.py
  action: Modify
  purpose: The mapped test target for scripts/north_star_tracker.py (map_source_to_test resolves the module to exactly this file, so the new tests go here and never into a second file). Today its docstring claims to test north_star_tracker while its two tests exercise scripts.s3_log_store.append_jsonl and the module is never imported, which is why the measurement is 0.0 percent rather than a partial number. Add coverage for parse_session_log (cutoff filter plus the bad-date ValueError swallow), categorise_session (a CATEGORIES table hit plus both other fallbacks) and main (missing-SESSION_LOG early exit, the infra-ratio WARN branch, the OK branch). The two pre-existing tests are KEPT verbatim -- see the constraints.
- file: tests/lambda_manifest/test_bundle_checks.py
  action: Modify
  purpose: 'Owns compute_affected_artifacts in the mapped test package tests/lambda_manifest/. Add the one arm the existing test_manifest_yaml_change_matches cannot reach: its fixture declares includes of src/, so the changed manifest.yaml already matches by prefix and the inner not-already-in-matches append never runs. A manifest whose declared paths do not cover its own manifest.yaml reaches it.'
- file: tests/lambda_manifest/test_cli_commands.py
  action: Modify
  purpose: 'Owns the CLI entry points in the same mapped package. Add, each into the class that already owns the function: the non-directory / dunder-pycache loop-continue in cmd_validate and in cmd_check_coverage; the two except branches of cmd_check_bundles (load_all raising, and stage_bundle raising for one slug); and the argparse mutually-exclusive dispatch in main, one case per flag with sys.argv patched and the cmd_ function replaced by a sentinel, asserting the SystemExit code.'
bundled_recommendations:
- rec-3593
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- scripts/north_star_tracker.py measures 100.0 percent whole-file line coverage through its mapped test target.
- scripts/lambda_manifest.py measures 100.0 percent whole-file line coverage through its mapped test package.
- test_coverage_checker.check_per_file_coverage returns an EMPTY error list when called on exactly those two paths -- the checker, not only a bare pytest run, agrees.
- No file under scripts/ or src/ appears in the diff, and the touched set measured through the working-tree-aware seam is EXACTLY the three declared test files plus this plan -- set equality, not a subset, so a diff touching only two of the three test files fails. Step 12 is the check, and it prints the missing and the outside-scope halves separately.
- 'Every non-blank line present in each touched test file at origin/main is still present in the working-tree file: no existing test is deleted, renamed, weakened or skipped.'
- No test run reads the repository's own docs/SESSION_LOG.md or leaves logs/.north-star-log.jsonl behind, proven by a clone in which both are removed before BOTH mapped targets run (step 7); and every main arm asserts in-test that the module's JSONL_LOG attribute resolves under tmp_path, which is the falsifiable form of the JSONL half because append_jsonl already no-ops under PYTEST_CURRENT_TEST while the JSONL_LOG.parent.mkdir it guards does not.
- All three touched test files pass ruff check and ruff format --check, each stays under 500 SLOC, and none is registered in config/sloc_budgets.yaml.
- validate_no_cross_test_imports and validate_test_count_coupling both report zero findings over the post-change tests tree.
- The Decision 182 selection breadth measured for the committed scope is declared in this plan and predicts within_budget.
- Steps 3, 4 and 5 carry hermetic true, so validate_vp_replay independently re-executes both coverage floors and the checker assertion in the fast tier on the implement PR; step 16 pins that replay partition and the no-backtick property.
- rec-3593 reads closed in the refreshed read cache after the squash-merge, verified by re-syncing the cache and reading the row back (step 17) rather than by trusting that the Resolves trailer fired.
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: false
  graduation: not-applicable
  action: 'BEFORE. On a pristine origin/main clone (the untouched tree), run the CHECKER over exactly the two paths and require it to report BOTH of them below their 100 percent floor. This is the measurement the next unit is judged by, taken before the fix exists. THE BASE IS RESOLVED IN THE PARENT SHELL, NOT INSIDE THE CLONE: git clone --shared maps the SOURCE repo''s LOCAL branches into the clone''s remote-tracking refs, so a bare git checkout origin/main inside the clone resolves to the source''s local main rather than to the real origin/main (measured on 2026-09-05: local main 739706b, origin/main 0fe2aa9, two commits ahead). Capturing M with git rev-parse --verify origin/main in the working tree and checking that SHA out anchors this step to the same base step 11 reads, and --shared makes the object reachable through the alternates chain (rehearsed). This step stays hermetic false deliberately and PERMANENTLY: it asserts a property of origin/main that this very plan falsifies on merge (post-merge origin/main carries the fix, so the two-error requirement inverts), so replaying it under Decision 148 would diverge forever. Its own exit code is already 0 while the debt is present, so the marker is a correctness choice, not a divergence workaround.'
  command: B=/tmp/coverage-debt-before; M=$(git rev-parse --verify origin/main); rm -rf "$B"; git clone --shared --quiet . "$B" && ln -s "$PWD/.venv" "$B/.venv" && cd "$B" && git checkout -q "$M" && bin/venv-python -c "from pathlib import Path; from scripts import test_coverage_checker as t; p=[Path('scripts/north_star_tracker.py').resolve(), Path('scripts/lambda_manifest.py').resolve()]; e=t.check_per_file_coverage(p); print('BEFORE errors:', e); raise SystemExit(0 if len(e)==2 and any('north_star_tracker' in m for m in e) and any('lambda_manifest' in m for m in e) else 1)"
  expected: 'Exit 0. The printed error list carries one entry per file: north_star_tracker at 0.0 percent and lambda_manifest at 90.6 percent, both against an expected 100 percent. Measured at 739706b on 2026-09-04 AND re-measured at the true origin/main 0fe2aa9 on 2026-09-05, byte-identical error list at both bases, which is why the base correction changes the provenance claim without changing the number.'
  fix_if: Fewer than two errors means the debt is already gone on origin/main -- someone else paid it, so re-scope this plan rather than writing duplicate tests. An empty M, or a checkout that fails, means origin/main is not reachable in this working tree (detached clone, no fetch); resolve the ref rather than falling back to a bare origin/main checkout inside the clone, which silently reads the source's local main. A crash importing scripts means the clone lacks the .venv symlink.
- step: 2
  phase: pre-deploy
  hermetic: false
  graduation: not-applicable
  action: 'RED. There is no code red-green here and the plan says so plainly: this unit changes no source, so there is no behavior that is broken before and fixed after, and a test written against unchanged code passes the moment it is written. The honest RED is the COVERAGE NUMBER. Run the two bare pytest coverage gates against the same untouched origin/main tree and require BOTH to exit non-zero. The identical commands must exit 0 in steps 3 and 4 against the working tree. The base is resolved in the parent shell exactly as in step 1, for the same reason. Hermetic false for the same permanent reason as step 1 -- the assertion is about the PRE-FIX tree -- and additionally because it clones origin/main and runs two coverage gates inside it, which does not fit the 30-second per-step replay timeout. The step''s own exit code is 0 when both inner gates fail, so the honest RED is expressed without ever requiring a non-zero step exit.'
  command: R=/tmp/coverage-debt-red; M=$(git rev-parse --verify origin/main); rm -rf "$R"; git clone --shared --quiet . "$R" && ln -s "$PWD/.venv" "$R/.venv" && cd "$R" && git checkout -q "$M" && { bin/venv-python -m pytest tests/test_north_star_tracker.py --cov=scripts.north_star_tracker --cov-fail-under=100 -q --no-header >/dev/null 2>&1; A=$?; bin/venv-python -m pytest tests/lambda_manifest --cov=scripts.lambda_manifest --cov-fail-under=100 -q --no-header >/dev/null 2>&1; C=$?; echo "baseline coverage-gate exits nst=$A lambda=$C"; [ "$A" != "0" ] && [ "$C" != "0" ]; }
  expected: 'Exit 0 because BOTH inner gates failed. Measured on the untouched tree: nst=1 (coverage reports no data at all, since no test imports the module) and lambda=1 (91 percent is under the 100 threshold). The same two inner exits hold at 739706b and at the true origin/main 0fe2aa9, the four scope-relevant files being byte-identical between them on 2026-09-05.'
  fix_if: An inner exit of 0 means the tree under test is not actually the untouched one -- most likely the parent-resolved SHA checkout did not happen, or the clone was taken from a directory that already carries the new tests. An empty M, or a checkout that fails, means origin/main is not reachable in this working tree; resolve the ref rather than falling back to a bare origin/main checkout inside the clone, which silently reads the source's local main and would anchor this step to a different base from step 11.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Kernel-admissible as command_exit_zero and differential-discriminating (measured exit 1 on origin/main at 739706b, exit 0 on the fixed tree), so this is a real graduate candidate. What the waiver defers is the STANDING registry row, not the enforcement. Decision 176 re-grained the registry to one record per file at config/agent/verification_registry/entries/<check_id>.yaml with filename-equals-check_id, so graduating steps 3, 4 and 5 means three NEW files, and step 12''s four-path touched-set allowlist plus the operator''s test-files-only scope both forbid them in this diff. Enforcement does not wait for that: this step is hermetic true, so validate_vp_replay independently re-executes it in the fast tier on the implement PR (Decision 148 clause 3, which restores hermetic true as the correct default for a pre-deploy feature-verification step). Execution step 7 files the follow-on rec that carries the standing row and writes its id back into followon_recs.'
  action: 'GREEN A. The same bare pytest coverage gate from step 2, now against the working tree: scripts/north_star_tracker.py at 100 percent through its mapped target.'
  command: bin/venv-python -m pytest tests/test_north_star_tracker.py --cov=scripts.north_star_tracker --cov-fail-under=100 -q --no-header
  expected: Exit 0, with the coverage table reporting scripts/north_star_tracker.py at 100 percent and zero missing statements. Prototyped at 11 tests passing, 67 statements, 0 missed.
  fix_if: A coverage failure names the uncovered statements; map each back to its owning function (parse_session_log, categorise_session, main) rather than chasing line numbers. A total of 0 with a no-data warning means the module was still never imported -- the test file is testing something else, which is the original defect. If replay ever reports TIMEOUT instead of a coverage number, the escape hatch is hermetic false -- validate_vp_replay then prints this step EXCLUDED with reason not-hermetic, an explicitly supported outcome and never a silent skip -- and is NEVER a lowered coverage threshold.
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Same disposition, same blocker and same replacement enforcement as step 3: kernel-admissible and differential-discriminating (measured exit 1 on origin/main at 739706b, exit 0 on the fixed tree), but a standing row costs one Decision 176 per-file registry shard that step 12''s four-path allowlist excludes from this diff. Carried by the same follow-on rec as step 3, and independently re-executed in the fast tier in the meantime because this step is hermetic true.'
  action: GREEN B. scripts/lambda_manifest.py at 100 percent through its mapped test package tests/lambda_manifest/.
  command: bin/venv-python -m pytest tests/lambda_manifest --cov=scripts.lambda_manifest --cov-fail-under=100 -q --no-header
  expected: Exit 0, with scripts/lambda_manifest.py at 100 percent and zero missing statements. Prototyped at 68 tests passing, 266 statements, 0 missed (58 tests and 25 missed before).
  fix_if: 'Remaining misses cluster in five owners: the manifest-yaml-not-already-matched append in compute_affected_artifacts, the loop-continue in cmd_validate, the loop-continue in cmd_check_coverage, the two except branches of cmd_check_bundles, and the argparse dispatch in main. Add the arm to the class that already owns that function. If replay ever reports TIMEOUT instead of a coverage number, the escape hatch is hermetic false -- validate_vp_replay then prints this step EXCLUDED with reason not-hermetic, an explicitly supported outcome and never a silent skip -- and is NEVER a lowered coverage threshold.'
- step: 5
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'The strongest of the three coverage assertions and the one the next unit is literally judged by, so it is the best graduate candidate of the plan -- blocked by the same Decision 176 per-file shard cost as steps 3 and 4 and carried by the same follow-on rec. Kept AND made hermetic rather than left session-only, because the checker''s own measurement mechanics (coverage_baseline.measure_and_check runs pytest per mapped target with --cov set to the source file''s PARENT DIRECTORY, per rec-943) can differ from the bare pytest runs above, and it is the checker that gates the full tier. Measured at 11.4 seconds at 739706b and re-measured at 11.5 seconds against the true origin/main 0fe2aa9 on 2026-09-05, inside the 30-second per-step replay timeout with roughly a two-and-a-half-times margin. THAT MARGIN IS A PRE-FIX NUMBER AND CAN ONLY SHRINK: the whole-directory --cov instrumentation stays constant while the test count under it grows, and validate_vp_replay measures wall clock on a CI runner that may be slower than the dev container. Execution step 6 re-measures on the post-fix tree and records the result HERE, in this field, which docs/contracts/implement-scope-boundary.yaml lists as a permitted field edit on a resolved plan -- never in this step''s expected or command, which the same contract lists as prohibited.'
  action: 'GREEN C. Call the checker directly on exactly the two paths and require an EMPTY error list. This is the proof that this unit did its job: after it lands, wave B re-touches both source files and the full tier''s validate_test_coverage must not fail on either.'
  command: bin/venv-python -c "from pathlib import Path; from scripts import test_coverage_checker as t; p=[Path('scripts/north_star_tracker.py').resolve(), Path('scripts/lambda_manifest.py').resolve()]; e=t.check_per_file_coverage(p); print('checker errors:', e); raise SystemExit(0 if e==[] else 1)"
  expected: Exit 0 and an empty printed list. The two mapping lines print first, confirming the checker resolved north_star_tracker to tests/test_north_star_tracker.py and lambda_manifest to tests/lambda_manifest.
  fix_if: A no-tests-exercise-this-file error means the mapped target does not import the module at all. A percentage error that disagrees with steps 3 and 4 means the two measurement paths diverge -- trust this one, because it is what the full tier runs. If replay ever reports TIMEOUT instead of a coverage number, the escape hatch is hermetic false -- validate_vp_replay then prints this step EXCLUDED with reason not-hermetic, an explicitly supported outcome and never a silent skip -- and is NEVER a lowered coverage threshold.
- step: 6
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Duplicates what the tier already does: both touched test modules are in this diff, so the --pre pytest_diff phase selects and runs them (measured Decision 182 selection: 3 modules). A standing registry row would re-run in the same tier what that phase already runs.'
  action: 'Both mapped test targets green with NO coverage plugin involved, so a pass cannot be an artefact of the coverage machinery. Hermetic false on purpose: the --pre pytest_diff phase already selects and runs both touched modules, so replaying this step would be a third execution of the same suite inside one tier run for no new information.'
  command: bin/venv-python -m pytest tests/test_north_star_tracker.py tests/lambda_manifest -q --no-header
  expected: Exit 0. Prototyped at 79 tests passing across the two targets (11 plus 68).
  fix_if: A failure here that steps 3 and 4 did not show points at plugin interaction or test ordering; re-run the failing node id alone before editing anything.
- step: 7
  phase: pre-deploy
  hermetic: false
  graduation: not-applicable
  action: 'THE HERMETICITY PIN, and the answer to the design question. north_star_tracker.main() reads ROOT/docs/SESSION_LOG.md and writes ROOT/logs/.north-star-log.jsonl through append_jsonl. The tests redirect ALL THREE seams -- monkeypatch the module''s ROOT, monkeypatch its JSONL_LOG, and monkeypatch its append_jsonl reference. WHICH SEAM CARRIES WHICH HALF, stated accurately rather than symmetrically: the ROOT redirect is the load-bearing one, because without it main takes the SESSION_LOG-not-found early exit and every WARN or OK assertion fails; the JSONL_LOG redirect is what keeps the JSONL_LOG.parent.mkdir off the live tree, and that mkdir is the ONLY real filesystem write left, because scripts/s3_log_store.py''s append_jsonl returns early for the local backend whenever PYTEST_CURRENT_TEST is set, so no pytest run creates the log file whatever the test patches; the append_jsonl redirect therefore buys assertability of the record, not hermeticity. The falsifiable form of the JSONL half is consequently an IN-TEST assertion that the module''s JSONL_LOG attribute resolves under tmp_path (execution step 2), not this step''s file-absence conjunct, which is kept because a surviving file would still be a real defect but which cannot fail on its own. This step falsifies the ROOT claim: it clones at the same parent-resolved origin/main SHA as steps 1 and 2, copies the three working-tree test files in (git clone cannot carry uncommitted edits), DELETES docs/SESSION_LOG.md and logs/.north-star-log.jsonl in the clone, runs BOTH mapped targets rather than only one (the two lambda_manifest files are copied in, so running only the north_star_tracker target would make the step read as if it verified more than it did), and requires green plus both files still absent. Hermetic false: it clones, copies the working-tree test files in and runs two suites, which does not fit the 30-second per-step replay timeout; validate_vp_replay prints it EXCLUDED with reason not-hermetic, an explicitly supported outcome. Graduation is not-applicable rather than waived because the step is a compound clone/checkout/copy/rm/pytest pipeline rather than a canonical kernel slot, and it depends on UNCOMMITTED working-tree files, so it structurally cannot exist as a standing registry row that CI re-runs on any other diff.'
  command: P=/tmp/coverage-debt-pin; M=$(git rev-parse --verify origin/main); rm -rf "$P"; git clone --shared --quiet . "$P" && ln -s "$PWD/.venv" "$P/.venv" && git -C "$P" checkout -q "$M" && cp tests/test_north_star_tracker.py "$P/tests/test_north_star_tracker.py" && cp tests/lambda_manifest/test_bundle_checks.py tests/lambda_manifest/test_cli_commands.py "$P/tests/lambda_manifest/" && cd "$P" && rm -f docs/SESSION_LOG.md logs/.north-star-log.jsonl && bin/venv-python -m pytest tests/test_north_star_tracker.py tests/lambda_manifest -q --no-header && [ ! -e docs/SESSION_LOG.md ] && [ ! -e logs/.north-star-log.jsonl ] && echo PIN_CLEAN
  expected: 'Exit 0 and the word PIN_CLEAN, with both mapped targets green in the clone. Rehearsed on 2026-09-05 against the pre-change test files: 60 tests pass with docs/SESSION_LOG.md and logs/.north-star-log.jsonl deleted, and neither file is recreated. Falsifier measured on 2026-09-04: with the ROOT redirect removed from one main test, this same command exits 1 with an assertion showing the run took the SESSION_LOG-not-found early exit instead of producing a report -- so the pin is load-bearing, not decorative.'
  fix_if: A test failure means something still reads the real SESSION_LOG.md. A surviving logs/.north-star-log.jsonl means append_jsonl reached its local backend with PYTEST_CURRENT_TEST unset -- note that the two kept append_jsonl tests delete that variable deliberately and redirect s3_log_store's own _LOGS_DIR to tmp_path, so a survivor points at a NEW test that copied the delenv without the _LOGS_DIR redirect. scripts/s3_log_store.py is a deploy-trigger file (deploy-prod-lambdas.yml) and is PATCHED, never edited -- fix the test, not that module. A lambda_manifest failure that step 4 did not show means one of those tests depends on repository state this clone deletes; diagnose it rather than narrowing this step back to a single target.
- step: 8
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: ruff check and ruff format already run over the whole repository in both presubmit tiers; a graduated row pinned to three file paths would duplicate an existing gate and would go stale the moment either file is renamed or decomposed.
  action: Lint and format both clean on every touched test file.
  command: bin/venv-python -m ruff check tests/test_north_star_tracker.py tests/lambda_manifest/test_bundle_checks.py tests/lambda_manifest/test_cli_commands.py && bin/venv-python -m ruff format --check tests/test_north_star_tracker.py tests/lambda_manifest/test_bundle_checks.py tests/lambda_manifest/test_cli_commands.py
  expected: 'Exit 0 from both invocations: no findings, and all three files already formatted.'
  fix_if: F401 after adding a class usually means an import was added twice; per tests/CLAUDE.md never split one module's imports into a second top-of-file block, because ruff format silently drops symbols from the second one.
- step: 9
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_sloc_limits already enforces the 500-SLOC limit repo-wide in both tiers and validate_sloc_budget_raises already gates registration; a per-file registry row would be a third copy of a rule two registered checks already own.
  action: Each touched test file stays under the 500-SLOC limit and none of them needs a config/sloc_budgets.yaml entry, so Decision 128 never fires and no raise marker is required.
  command: 'bin/venv-python -c "import yaml; from pathlib import Path; b=(yaml.safe_load(Path(''config/sloc_budgets.yaml'').read_text(encoding=''utf-8'')) or {}).get(''budgets'') or {}; f=[''tests/test_north_star_tracker.py'',''tests/lambda_manifest/test_bundle_checks.py'',''tests/lambda_manifest/test_cli_commands.py'']; s={p: len([l for l in Path(p).read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(''#'')]) for p in f}; print(''sloc:'', s); raise SystemExit(0 if all(v<=500 for v in s.values()) and not any(p in b for p in f) else 1)"'
  expected: 'Exit 0. Prototyped counts: 108, 191 and 257 SLOC respectively, all far under 500, and none of the three appears under the budgets key.'
  fix_if: 'A file over 500 is a decomposition signal, never a budget raise (Decision 128): split the new classes into a sibling module inside the mirror package rather than registering the file.'
- step: 10
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Both functions are already registered checks running in both presubmit tiers (Decision 131 and Decision 104); graduating a row that calls them directly would register a fourth invocation of checks the tier already dispatches.
  action: Exercise the two tests-directory hygiene guards named by tests/CLAUDE.md directly, so a violation surfaces at this step rather than at the tier steps.
  command: bin/venv-python -c "from scripts.checks.hygiene import validate_no_cross_test_imports as a, validate_test_count_coupling as b; f=[]; a.validate_no_cross_test_imports(f); b.validate_test_count_coupling(f); print('hygiene failures:', f); raise SystemExit(0 if f==[] else 1)"
  expected: Exit 0 and an empty failure list from both guards.
  fix_if: 'A cross-test-import finding means a helper was imported from another test module: move it to a conftest fixture or tests/fixtures/. A count-coupling finding means an exact len equals N assertion landed on a growing collection: assert membership or a growth-safe invariant instead.'
- step: 11
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The property is anchored to origin/main AT IMPLEMENT TIME. Once this merges, origin/main contains the post-change files and the assertion becomes trivially true forever, so a graduated row would be a tautology that can never red -- exactly the classification-gaming shape the graduation differential exists to reject.
  action: 'Decision 181 no-loosening pin: every non-blank line each touched test file has at origin/main is still present in the working-tree file. This is what makes the decision to KEEP the two misplaced append_jsonl tests checkable rather than merely asserted.'
  command: 'bin/venv-python -c "import subprocess; from pathlib import Path; f=[''tests/test_north_star_tracker.py'',''tests/lambda_manifest/test_bundle_checks.py'',''tests/lambda_manifest/test_cli_commands.py'']; base={p: [l for l in subprocess.run([''git'',''show'',''origin/main:''+p],capture_output=True,text=True,encoding=''utf-8'',check=True).stdout.splitlines() if l.strip()] for p in f}; gone={p: [l for l in v if l not in Path(p).read_text(encoding=''utf-8'').splitlines()] for p,v in base.items()}; print(''base lines missing from working tree:'', {k: len(v) for k,v in gone.items()}); print(gone); raise SystemExit(0 if not any(gone.values()) else 1)"'
  expected: Exit 0 with a zero count for all three files. Prototyped at 0, 0, 0 after a full ruff format pass, so the assertion survives formatting of a purely additive edit.
  fix_if: A non-zero count names the exact lines that disappeared. If they are assertions, an existing test was weakened and must be restored (Decision 181). If they are the two append_jsonl tests, the keep-in-place decision was reversed without a step behind it.
- step: 12
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Asserts this session's own diff shape against a hardcoded allowlist of four paths; it is transient by construction and would red on every unrelated PR if it stood as a registry row.
  action: 'Touched-set assertion, asserted as EQUALITY. No file under scripts/ or src/ changed, and the touched set is EXACTLY the three declared test files plus this plan -- not merely a subset of them, so a diff that touched only two of the three test files fails here rather than passing quietly. Uses the working-tree-aware seam get_status_aware_diff, because /implement runs on an UNCOMMITTED tree and a committed-only diff would report an empty set and pass vacuously. Untracked entries that are not regular files are dropped (a scratch clone carries a .venv SYMLINK, which the directory-only .venv/ gitignore rule does not exclude); every tracked add, modify and delete row is kept. Decision 135 clause 3 is the authority for that seam: get_status_aware_diff returns tracked A, M and D rows against the push-context or merge-base base PLUS untracked files from git ls-files --others, so it reads correctly both in an uncommitted local session and in a committed CI checkout. The two halves are printed separately -- what is MISSING from the touched set and what is OUTSIDE the allowlist -- so a failure names which direction the equality broke.'
  command: bin/venv-python -c "from pathlib import Path; from scripts.checks import _common; allowed={'tests/test_north_star_tracker.py','tests/lambda_manifest/test_bundle_checks.py','tests/lambda_manifest/test_cli_commands.py','docs/plans/PLAN-coverage-debt-lint-blocked-files.yaml'}; t=sorted({p for s,p in _common.get_status_aware_diff() if s!='??' or Path(p).is_file()}); src=[p for p in t if p.startswith(('scripts/','src/'))]; missing=sorted(allowed-set(t)); out=sorted(set(t)-allowed); print('touched:', t); print('source_files:', src, '| missing:', missing, '| outside_scope:', out); raise SystemExit(0 if t==sorted(allowed) and not src else 1)"
