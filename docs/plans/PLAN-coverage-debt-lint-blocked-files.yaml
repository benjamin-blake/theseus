execution_steps:
- Extend tests/test_north_star_tracker.py, keeping its existing two tests verbatim. Add parse_session_log arms (a recent entry kept, an old entry dropped, a syntactically valid but impossible date such as 2026-13-45 swallowed by the ValueError arm, no headers at all), categorise_session arms (a table hit, a Done line matching nothing, no Done line at all), and main arms (SESSION_LOG absent, the infra-ratio WARN branch, the OK branch). EVERY DATE IS DERIVED FROM datetime.now(), or the boundary is injected through the cutoff_days parameter -- never a literal date, because the cutoff is computed against wall clock and a frozen recent entry becomes a stale one a month later and flips its own assertion. Every main arm asserts through pytest.raises(SystemExit) and checks the code, because main exits on every path.
- 'Redirect all three seams in the main arms via a single shared helper: monkeypatch the module''s ROOT to tmp_path, monkeypatch its JSONL_LOG to a path under tmp_path, and monkeypatch its append_jsonl to a recorder that appends to a list. Assert against the recorded record and against captured stdout, never against a file on the real tree, and assert in-test that the module''s JSONL_LOG attribute resolves under tmp_path -- that assertion can actually fail, because the JSONL_LOG.parent.mkdir in main runs against whatever JSONL_LOG points at while append_jsonl itself already no-ops under PYTEST_CURRENT_TEST. THE RECORD ALONE CANNOT DISCRIMINATE THE WARN AND OK ARMS: main calls sys.exit(0) on both, so the exit code says nothing, and the record dict is built AFTER the infra-ratio branch has run, carrying the identical field set either way -- asserting on infra_ratio_pct pins the INPUT, not the branch''s output, and would pass unchanged if the condition were inverted or the whole if/else replaced by an unconditional print. Each arm therefore captures stdout with capsys and asserts ITS OWN marker string PRESENT and the SIBLING''S ABSENT (the WARN arm requires the WARN Infra/Meta sessions line and requires the OK Infra/Meta ratio line to be absent; the OK arm the reverse). The boundary is pinned with two arms so the comparison operator is nailed: a ratio computing to exactly 40 must take OK and 41 must take WARN, which is what separates greater-than from greater-than-or-equal. Verified reachable on 2026-09-05 in a throwaway probe with only a ROOT monkeypatch plus capsys, so this costs no extra seam.'
- 'Extend tests/lambda_manifest/test_bundle_checks.py with one arm in the class that already owns compute_affected_artifacts: a manifest whose declared paths do NOT cover its own manifest.yaml, so the changed manifest path is appended by the not-already-matched branch rather than by the prefix match. Read test_manifest_yaml_change_matches first to see why its includes of src/ makes that branch unreachable. The arm asserts the returned mapping EQUALS a single-key mapping from the slug to a list holding exactly src/lambdas/<slug>/manifest.yaml -- asserting only that the slug is a key would pass just as well under a prefix match, which is the branch this arm exists to distinguish itself from.'
