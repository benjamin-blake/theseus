slug: "telemetry-session-log-retirement"
intent: >-
  Telemetry slice 5, plan 1 of 2: close T3.20 c6. docs/SESSION_LOG.md has not been written since 2026-07-01, yet
  session preflight still reports its July entries as last_session and recent_sessions, so every /plan and /orient
  reads a stale "recent momentum". Rewire both fields to the production telemetry store through the existing telemetry
  reader verb sessions_window (a query-Lambda verb), with a status that tells an unreachable reader from an empty
  window, retire the log by deletion (Decisions 127 and 174), and remove every reader and writer that only served it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-session-log-retirement.yaml
phase: >-
  T3.20 (in_progress; follow-on mode): closes c6 only. c9 (rec-4415) stays open and is planned after slice 5.
closes_criteria:
  - T3.20:c6
scope:
  - file: scripts/preflight/session_history.py
    action: Create
    purpose: >-
      read_session_history(reader=None, *, now=None, window_days=2, limit=5, timeout_s=30) -> dict. One named read of
      sessions_window(day_from, day_to, as_of) through scripts.preflight._common._make_event_reader() (the routed
      telemetry reader preflight's telemetry_health gauge already uses; Decision 236 cl.2, Decision 84 I-3). day_to is
      today (UTC), day_from today minus window_days-1, as_of now (UTC ISO). The read runs on a daemon thread joined for
      timeout_s so a cold reader (rec-4474 class) never holds preflight open; a timeout, any exception, or a 504/503
      answer returns status unavailable. Returns {"status": "ok"|"empty"|"unavailable", "window_days": int,
      "recent_sessions": list[str] | None, "last_session": str | None, "reason"?: str}: on ok the newest `limit` rows by
      session_started_at DESCENDING (the verb orders ascending, so selection is client-side, never via `limit`), each
      rendered as one line "<session_started_at UTC, minute precision> state=<state> outcome=<outcome or -> duration=<s or
      ->s session=<first 8 chars of session_id>", last_session = the first of them; on empty (the reader answered with no
      row) [] and "" ; on unavailable both None (Decision 215 cl.2: never [] or "" for an unknown). State and outcome
      are printed as the reader derived them, never re-derived (Decision 199); a session reads running for up to 24 h
      after its last turn (Decision 228), which is not an error. format_history(result) -> one stderr line in the
      telemetry gauge's shape: "Session history: <status> (<n> root session(s) in <window_days> UTC day(s))" or
      "Session history: unavailable (<reason>)". Never raises. No row value other than the four rendered fields and
      the short id is printed.
  - file: tests/session/preflight/test_session_history.py
    action: Create
    purpose: >-
      Fake-reader cases: ok (rows out of order -> newest 5 descending, last_session = newest, rendered line shape, null
      outcome and duration render as -), empty (reader returns [] -> [] and "" with status empty), unavailable on
      exception, on a reader that sleeps past timeout_s (returns within timeout_s + 1 s) and on a typed deadline error
      (both fields None, never [] or ""), exact verb and params passed (sessions_window; day_from/day_to span
      window_days UTC days ending today; as_of set), no `limit` argument passed, running rendered as-is, format_history
      lines for each status.
  - file: scripts/session/preflight.py
    action: Modify
    purpose: >-
      Replace context_docs.parse_last_session() with session_history.read_session_history(), creds-gated exactly like the
      telemetry gauge (creds_status != "ok" -> unavailable "credentials unavailable" with no reader call) and submitted to
      the existing Phase B pool so it overlaps the other reader calls. Report: last_session = result["last_session"],
      context.recent_sessions = result["recent_sessions"], and a new top-level key session_history = {status,
      window_days, reason?} (additive). Print format_history to stderr beside the telemetry gauge line. If this file would
      cross its SLOC limit, move the wiring into scripts/preflight/session_history.py rather than raise a budget
      (Decision 128).
  - file: scripts/preflight/context_docs.py
    action: Modify
