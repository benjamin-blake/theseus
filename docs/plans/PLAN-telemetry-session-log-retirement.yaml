acceptance_criteria:
  - >-
    T3.20:c6 -- docs/SESSION_LOG.md is gone (SESSION_LOG_ARCHIVE.md unchanged) and preflight's last_session and
    recent_sessions are read from the production telemetry store through the telemetry reader's sessions_window verb, with
    session_history.status ok | empty | unavailable and null (never "" or []) values when unavailable; a creds-degraded
    preflight makes no reader call for it and a cold reader cannot hold preflight past the timeout.
  - >-
    No live code, config, contract or instruction outside the named residuals reads or writes docs/SESSION_LOG.md,
    parse_last_session, SESSION_LOG_FILE, north_star_tracker or check_plan_compliance.
  - >-
    postflight --close and --auto report only what they perform (rec-4598): no session_log_entry, no intent_achieved,
    help text and docstrings aligned.
  - >-
    After merge, a live preflight under the agent_platform profile reports session_history.status ok with a non-empty
    recent_sessions list whose newest entry is from the last 2 UTC days.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: session_history unit tests (ok, empty, unavailable by exception, timeout and deadline, ordering, verb params, no limit).
    command: bin/venv-python -m pytest tests/session/preflight/test_session_history.py -q
    expected: exit 0; every case passes; the module does not exist before the change.
    fix_if: A case fails - fix session_history.py, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: The unit suite runs in every tier and is the permanent guard.
  - step: 2
    phase: pre-deploy
    action: Preflight suites with the rewired fields, the additive session_history key and the null-not-empty case.
    command: >-
      bin/venv-python -m pytest tests/session/preflight/ tests/test_session_preflight_decomposition.py
      tests/test_session_preflight_cache_serving.py -q
    expected: exit 0.
    fix_if: A patch target is stale - move it to session_history.read_session_history; never delete a non-SESSION_LOG case.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Existing suites run in every tier.
  - step: 3
    phase: pre-deploy
    action: postflight suites including rec-4598's acceptance node.
    command: >-
      bin/venv-python -m pytest tests/session/postflight/ -q &&
      bin/venv-python -m pytest tests/session/postflight/test_close_reports_only_performed_effects.py::test_close_output_claims_no_session_log_write -q
    expected: exit 0 for both; the acceptance node fails before the change.
    fix_if: A claim survives in output, help or docstring - remove it from postflight.py.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: rec-4598's acceptance node and the postflight suite run in every tier.
  - step: 4
    phase: pre-deploy
    action: Moved append_jsonl tests, prompt_compliance, retired-identity and file-router suites.
    command: >-
      bin/venv-python -m pytest tests/s3_log_store/ tests/test_prompt_compliance.py tests/checks/contracts/test__retired_identity.py -q
    expected: exit 0; tests/s3_log_store/test_append_jsonl_local.py holds both moved tests unchanged.
    fix_if: A moved test changed or is missing - restore it verbatim.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Existing suites run in every tier.
  - step: 5
    phase: pre-deploy
    action: >-
      Stale-reference sweep (closure obligation, surface retirement): no live reference to the retired surfaces outside the
      named residuals.
    command: >-
      test ! -e docs/SESSION_LOG.md && git diff --quiet origin/main -- docs/SESSION_LOG_ARCHIVE.md &&
      ! git grep -n -E "SESSION_LOG\.md|SESSION_LOG_FILE|parse_last_session|north_star_tracker|check_plan_compliance|_read_session_blocks" --
      . ':!docs/plans/' ':!audits/' ':!docs/audit-prompts/' ':!docs/SESSION_LOG_ARCHIVE.md' ':!docs/DECISIONS.md'
      ':!docs/DECISIONS_ARCHIVE.md' ':!docs/ROADMAP-PLATFORM-ARCHIVE.yaml' ':!docs/ROADMAP-PLATFORM.yaml'
      ':!config/agent/executor/instructions/' ':!.claude/hooks/session_start_deepen_history.sh'
      ':!config/agent/verification_registry/entries/deprecated/' ':!tests/fixtures/fast_tier_calibration_series.json'
    expected: >-
      exit 0: the log is deleted, the archive is unchanged and the grep finds nothing. Excluded paths are the named
      residuals: historical records (plans, audits, Decisions, archives, the roadmap's re-grounded text), the frozen
      executor-supervisor instructions (Decision 117 boundary, executor frozen by Decision 67), the deepen-history hook's
      dated worked example, the deprecated registry entry and the historical calibration series.
    fix_if: A live hit remains - rewire or remove it in scope; a hit outside scope escalates to the coordinator (scope rule).
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: A one-time retirement sweep; the deleted symbols cannot be imported back without failing the unit suites.
  - step: 6
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Live read after merge (no deploy is involved; the verb and reader are already deployed): preflight on main under
      the agent_platform profile reports the history from production.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -m scripts.session.preflight && bin/venv-python -c "import json;
      r=json.load(open('logs/.preflight-report.json')); h=r['session_history']; s=r['context']['recent_sessions'];
      print('SESSION_HISTORY', h['status'], len(s or []), r['last_session'][:16] if r['last_session'] else None);
      raise SystemExit(0 if h['status']=='ok' and s and r['last_session'] else 1)"
    expected: >-
      Prints SESSION_HISTORY ok <n> <timestamp> with n between 1 and 5 and a timestamp within the last 2 UTC days; exit 0.
    fix_if: >-
      unavailable on a cold reader - re-run once (the first call warms it); unavailable twice - read the reason and RCA
      (Decision 55); empty - check that capture is enabled and that real sessions ran in the window before suspecting
      the code.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-4598 closed by the squash-merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4598']); print(r[0]['id'], r[0]['status']);
      raise SystemExit(0 if r[0]['status']=='closed' else 1)"
    expected: Prints rec-4598 closed; exit 0.
    fix_if: Still open - follow only the route ci.yml's trailer-closure job prints (git-ops.yaml resolves_trailer), never a bare manual close.
    hermetic: false
    graduation: not-applicable
