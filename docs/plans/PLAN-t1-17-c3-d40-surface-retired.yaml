    7b67e21d70f733f7137875195a16e71f59822a9c; text -> "D40 reconciliation: no live surface carries the stale
    pending-supersession claim about Decision 40 (re-run: PLAN-t1-17-c3-d40-surface-retired VP 3). Both host
    docs (INTENT-provider-agnostic-executor.md, ROADMAP-PRODUCT.md) were deleted by the Decision 178 cleanse
    (7b67e21d); Decision 40's supersession by Decision 122 is recorded in its archive header, Decision 122's
