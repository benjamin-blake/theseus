  - "gates: decision-scout=FLAGS_FOUND; step-6b=write the plan (stand-in r1, forks 4-5 parked); plan-critique=PROCEED after 2 rounds; report-critique=REVISE r1 (F1-F7 applied), r2 PENDING"
