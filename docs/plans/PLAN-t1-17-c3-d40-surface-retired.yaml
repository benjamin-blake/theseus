schema_version: 5
slug: "t1-17-c3-d40-surface-retired"
intent: >-
  Settle T1.17 exit criterion c3 (D40 reconciliation) without editing the decision corpus: re-derive, as
  executable evidence, that the doc hosting the stale "Decision 40 supersession pending" citation was deleted
  by the Decision 178 platform-only cleanse, that no live surface still carries that claim, and that Decision
  40's supersession by Decision 122 is already recorded mechanically; then stage a re-grounded criterion text
  plus a met_by-valid closeout for the operator. Nothing is implemented and no criterion is flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-t1-17-c3-d40-surface-retired.yaml
phase: >-
  Platform tier T1, tier_item T1.17 (Decision-log premise-integrity audit follow-ups), criterion c3 only --
  the third of four per-criterion plans (decomposition_hints.splits: 4). c1 (DPI-06), c2 (citation sweep) and
  c4 (guard hardening) are separate plans and out of scope.
scope:
  - file: docs/plans/PLAN-t1-17-c3-d40-surface-retired.yaml
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; precedent the c1 and c2 sibling plans). Carries the
      retirement and live-surface evidence as executable VP steps, the staged c3 re-grounding and closeout
      (context: staged_c3_closeout), and alternative B's exact shape (constraints: alternative_b_shape) so the
      operator can choose B without re-deriving. No code, contract, roadmap or DECISIONS file changes.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Both host surfaces of the stale D40 citation (docs/INTENT-provider-agnostic-executor.md, and
    docs/ROADMAP-PRODUCT.md that the originating overseer ledger also named) are absent, and commit 7b67e21d
    (the Decision 178 cleanse, #969) is the commit that deleted them (VP steps 1-2).
  - >-
    A census of every tracked file finds zero live lines pairing Decision 40 with a pending supersession;
    the only line-level hits are in historical plan/report artefacts, and T1.17's own c3 text is exempt (VP step 3).
  - >-
    Decision 40's supersession by Decision 122 is recorded mechanically: its archive header reads
    (Superseded by Decision 122), Decision 122's Supersedes line names Decision 40, and the decisions-index
    row 40 is live false with superseded_by 122 (VP step 4).
  - >-
    The one residual is stated honestly: Decision 40's own 2026-07-21 archive update note still reads
    "Formal supersession of this entry is pending", contradicting its header (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly this plan file -- no roadmap, code, contract or DECISIONS
    edit, and no closes_criteria entry (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Confirm both retired host files of the stale D40 citation are absent
    command: >-
      bin/venv-python -c "import pathlib; P=('docs/INTENT-provider-agnostic-executor.md','docs/ROADMAP-PRODUCT.md');
      print('retired_hosts_absent=' + str(sum(not pathlib.Path(p).exists() for p in P)) + '/2')"
    expected: One line reporting both host files absent.
    fix_if: >-
      Either file present means a host was restored; the stale citation may be live again -- stop and re-open
      the A/B fork (reconcile the citation in that file) instead of staging the closeout.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Decision 178's cleanse deleted these files deliberately; re-adding a retired INTENT doc is already
      forbidden by Decision 86 cl.2, so a registry row would only re-assert a ratified retirement.
    expected_literals: ["retired_hosts_absent=2/2"]
  - step: 2
    phase: pre-deploy
    action: Confirm the staged met_by commit exists and is the one that deleted both host files
    command: >-
      git cat-file -t 7b67e21d70f733f7137875195a16e71f59822a9c && git show --format= --name-status
      7b67e21d70f733f7137875195a16e71f59822a9c -- docs/INTENT-provider-agnostic-executor.md docs/ROADMAP-PRODUCT.md
      && git merge-base --is-ancestor 7b67e21d70f733f7137875195a16e71f59822a9c origin/main && echo met_by_on_main
    expected: >-
      The object type commit, then two delete rows (status D), one for each host file, then the ancestry
      marker line (the commit is on main, not merely present in the object store); exit 0.
    fix_if: >-
      Any failure while git rev-parse --is-shallow-repository prints true means history may sit beyond the
      shallow graft (the object can exist while the ancestry test still fails) -- run a bounded fetch
      (git fetch --depth=1500 origin main) and re-run; a missing ancestry marker after that fetch means the
      commit is not on main. A different status means met_by is wrong; re-point it to the commit that deleted
      the file.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Census every tracked file for a live line pairing Decision 40 with a pending supersession
    command: >-
      bin/venv-python -c "import re,subprocess; R=re.compile(r'(?i)(decision 40\b|\bd40\b|dec-040).{0,200}supersession.{0,40}pending|supersession.{0,40}pending.{0,200}(decision 40\b|\bd40\b|dec-040)');
      X=('docs/plans/','audits/','docs/SESSION_LOG.md');
      F=subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split();
      H=[f for f in F for l in open(f,encoding='utf-8',errors='ignore') if R.search(l) and not (f=='docs/ROADMAP-PLATFORM.yaml' and 'D40 reconciliation' in l)];
      print('live_hits=' + str(sum(not f.startswith(X) for f in H)) + ' historical_hits=' + str(sum(f.startswith(X) for f in H)))"
    expected: >-
      One line of two counts with live_hits 0. Once this plan is committed historical_hits is 6 at 51253cdd: two
      lines each in PLAN-decisions-archival-hygiene.yaml and OVERSEER-decision-log-premise-integrity.yaml (which
      recorded the finding; historical artefacts per Decision 178 cl.3) and two in this plan (intent, VP 3 regex).
      T1.17's own c3 text is exempt by its "D40 reconciliation" marker, in docs/ROADMAP-PLATFORM.yaml only.
    fix_if: >-
      A non-zero live_hits count means a live surface still carries the stale claim -- that file is the
      reconciliation target; stop and re-open the A/B fork.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-off census of a single stale phrase on a retired surface; the corpus-side supersession facts are
      already guarded by validate_supersession_annotations and validate_decision_currency, and a standing
      phrase grep would add a check with no ongoing failure mode.
    expected_literals: ["live_hits=0"]
  - step: 4
    phase: pre-deploy
    action: Prove Decision 40's supersession by Decision 122 is recorded in header, superseder and index
    command: >-
      bin/venv-python -c "import json,pathlib,re; from scripts.decisions_md import _iter_decision_sections as it;
      I={e['number']:e for e in json.load(open('docs/decisions-index.json'))['decisions']};
      H={int(h.group(1)):h.group(0) for h,b in it(pathlib.Path('docs/DECISIONS_ARCHIVE.md').read_text(encoding='utf-8'))};
      t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); b=t[t.index('## Decision 122:'):]; b=b[:b.index(chr(10)+'---'+chr(10))];
      ok=['(Superseded by Decision 122)' in H.get(40,''), bool(re.search(r'Supersedes:.{0,80}Decision 40\b',b,re.S)),
      I[40]['live'] is False and I[40]['superseded_by']==122];
      print('d40_supersession_recorded=' + str(sum(ok)) + '/3')"
    expected: One line reporting all three records present.
    fix_if: >-
      Fewer than three means one record drifted -- the "supersession is already formal" claim fails; stop and
      report which record is missing.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates standing guards: validate_supersession_annotations checks the victim-side annotation and
      validate_decision_currency holds the committed index in lockstep with both corpus files.
    expected_literals: ["d40_supersession_recorded=3/3"]
  - step: 5
    phase: pre-deploy
    action: Locate the residual pending-supersession note inside Decision 40's own archived entry
    command: >-
      bin/venv-python -c "import pathlib,re; from scripts.decisions_md import _iter_decision_sections as it;
      S={int(h.group(1)):b for h,b in it(pathlib.Path('docs/DECISIONS_ARCHIVE.md').read_text(encoding='utf-8'))};
      print('d40_residual_pending_note=' + str(len(re.findall(r'(?i)supersession of this entry is pending',S[40]))))"
    expected: >-
      One line reporting a count of 1 at 51253cdd (the 2026-07-21 update blockquote, DECISIONS_ARCHIVE.md:1730).
      This is the residual the staged closeout names; it is evidence, not a gate. B appends a trailer and never
      edits that sentence (Decision 177), so the count stays 1 after B; only the trailer's presence changes.
    fix_if: >-
      A count of 0 or above 1 means the corpus moved -- update the residual wording in staged_c3_closeout and
      alternative_b_shape, then re-run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Point-in-time evidence of a sanctioned, permanent historical sentence (Decision 177: corrected only by
      an appended trailer, never edited), reported as evidence, not a gate; a standing guard on it would
      assert history rather than guard behaviour.
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-t1-17-c3-d40-surface-retired.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly this plan file (no roadmap, code, contract or DECISIONS edit)
    command: git fetch --quiet origin main && git log --name-only --format= origin/main..HEAD
    expected: >-
      The only non-blank path listed (possibly repeated, once per branch commit) is
      docs/plans/PLAN-t1-17-c3-d40-surface-retired.yaml; merge-from-main commits list no paths.
    fix_if: >-
      Any other path means scope leaked; revert it (the c3 closeout is staged in context, applied only by the
      operator). Empty output in a shallow clone means branch commits are missing: git fetch --deepen=50 origin HEAD.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan file.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (project charter never-list;
    Decision 136: only /implement flips criteria, and only those a plan names in closes_criteria).
  - >-
    No docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md edit under this plan (Decision 177 append-only policy,
    policy-only since Decision 178 cl.3; Decision 146 makes archive disposition operator-disposed; the
    unattended-week charter forbids editing docs/DECISIONS.md). Alternative B is operator-only.
  - >-
    docs/ROADMAP-PLATFORM.yaml stays out of scope: it is packaged into the active data-pipeline Lambda
    (Decision 79/125 deploy obligation); the c3 re-grounding and closeout are staged here for the operator.
  - >-
    No new standing prose doc, no companion report file, and no restored INTENT doc (Decision 86 cl.2; Decision
    178 retired the INTENT prose corpus): this plan file is the sole deliverable.
  - >-
    No recommendation bundled, filed or closed: the recs reader is unreachable in this sandbox (preflight
    recs_read_status=reader_unreachable), so the recommendation-relevance gate cannot run; T1.17 carries a
    no-new-recs provenance constraint.
  - >-
    Order-of-operations (gates/t1-17-c1-plan-critique-r1-8e36b4d1.md): critique 12l binds IMPLEMENTATION plans
    only, so this REPORT-ONLY plan is valid with T1.17 not_started or in_progress and declares no
    closes_criteria. Alternative B is IMPLEMENTATION: once T1.17 is in_progress it MUST declare
    closes_criteria [T1.17:c3], whose flip stays operator-only.
  - >-
    alternative_b_shape (operator-only; not chosen): one dated trailing-bracket amendment line
    (decision-entry.yaml amendment_forms.trailing_bracket) appended to Decision 40's archived entry, after its
    2026-07-21 update note, stating the supersession was formalized by Decision 122 at archival
    (PLAN-decisions-archival-hygiene, operator ruling 2026-07-21). It must not add a supersedes/amends phrase
    (keeps validate_supersession_annotations edges unchanged) and does not change the index row (status is
    header-derived). The scout scored B NO_FLAGS only as a new dated blockquote_update trailer (or the
    trailing_bracket form) after that note; editing the 1730 sentence (D177 mid-line splice) or minting a
    new Decision (D150) would contradict. B owes a post-merge --backfill-decisions-md run (D84). met_by then
    names the B plan's slug.
  - >-
    Out of c3: the live Decision 75 entry still cites the deleted INTENT doc (DECISIONS.md:8309, 8350-8353) as
    substrate frame-lock narrative, not as a Decision 40 claim; the staged text therefore claims no live D40
    pending-supersession citation, never that the deleted doc has no inbound references.
  - >-
    staged_c3_closeout_basis: the same edit drops docs/INTENT-provider-agnostic-executor.md from T1.17
    files_in_scope, rewords decomposition_hints.basis (3) as "host doc retired by Decision 178; c3 met", and
    regenerates .secrets.baseline. It takes tier_item_freshness_gate's "its own micro-commit on human
    confirmation" branch; the Scope-row branch is closed because it would hand /implement a roadmap edit and a
    criterion flip (never-list). met_by is a bare commit because retirement is by deletion with provenance in git
    history (Decision 174), no PLAN file exists for #969, and decisions-archival-hygiene deferred this citation
    to T1.17 (its constraints) so did not close c3; the form satisfies exit-criteria-ledger.yaml#fields.met_by.
    An operator scope decision, not a narrowing to obtain green (Decision 181).
  - No rescue agents or workaround loops (Decision 55).
