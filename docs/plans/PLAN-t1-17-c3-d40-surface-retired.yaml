    body, not progress_note (keeps the stale phrase off live surfaces). Rest: staged_c3_closeout_basis.
  - "decided-with-notice (stand-in confirmed): REPORT-ONLY (D86 cl.2); no rec bundled; roadmap edit staged (D79/125)."
  - >-
