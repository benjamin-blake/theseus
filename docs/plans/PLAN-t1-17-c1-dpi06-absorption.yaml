    the active data-pipeline Lambda, so Decision 79 per-Lambda gating names it; whether a data-only roadmap edit
    needs its build/deploy/smoke is the operator's call (governed deploy, agent never-list). Operator check before
    applying: one real rec-autoclose run since Decision 149 landed in which the "Backfill decisions to warehouse"
    step ran (not skipped), its log carries no DCG-03 SKIPPED marker, and the job succeeded. Branch taken:
    "its own micro-commit on human confirmation", not a Scope row (that would hand /implement a never-list flip).
  - "decided-with-notice (stand-in confirmed): REPORT-ONLY, plan file sole deliverable (D86 cl.2); VP waive 1-6, n/a 7-8."
  - >-
    fork: build the advisory --reconcile edge listing (B) or stage absorption evidence and build nothing (A) | chosen: A | class: asked | precedent: tier-item-lifecycle.yaml#tier_item_freshness_gate check 1 and scoping rule 4 (already-satisfied criterion -> proposed bookkeeping flip; re-cited from check 3 per report-critique r1); D86 cl.2; decision-scout r1 NO_FLAGS for A, D75 frame-lock NOTE on B; R1 stand-in 2026-10-01 | precedent_kind: contract | reversible: yes (a later plan can still build B) | persisted: plan_type, scope, context (VP steps 1-3 absorption evidence)
  - >-
    fork: apply the c1 closeout (open->met, re-grounded text, met_by dcg-compaction-lifecycle; plus T1.17 not_started->in_progress per plan-critique r1 F1) | chosen: PARKED (operator; project MEMORY operator ledger, parked row R1) | class: asked | precedent: none (always-ask: criterion status flip; exit-criteria-ledger.yaml#fields.status populated_by; D136) | precedent_kind: none | reversible: yes | persisted: plan context staged_c1_closeout, project MEMORY parked row R1
  - >-
    fork: residual r1 (no on-demand orphan report) recorded as deliberately-not-built in the staged text (A) or filed as a follow-on rec/criterion (B) | chosen: A | class: asked | precedent: exit-criteria-ledger.yaml#fields.status realized-differently rule (original wording -> progress_note on a non-terminal item); T1.17 no-new-recs provenance (ROADMAP-PLATFORM T1.17 intent); D86 cl.2 (a forward deliverable is a roadmap tier_item/criterion = operator roadmap edit, folded into the parked row); D181 not engaged (no green sought); R1 stand-in 2026-10-01 | precedent_kind: contract | reversible: yes | persisted: context staged_c1_closeout text, followon_recs [], constraints
