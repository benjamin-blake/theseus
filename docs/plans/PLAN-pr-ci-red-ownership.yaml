schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "pr-ci-red-ownership"
intent: >-
  Resolve the AGENTS.md self-contradiction that leaves implementing agents waiting for a ci-rca
  diagnosis that never arrives on a PR-branch --pre failure, so a red pre-merge gate has one
  unambiguous owner and one unambiguous procedure.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-pr-ci-red-ownership.yaml
phase: >-
  Agent-instruction doc-truth work. Premise (not target): T1.13 c6, already met -- ci-rca.yml
  gates on head_branch==default_branch. Not a tier_item slice; closes no criterion.
scope:
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: add trigger_scope carrying the branch gate, its Decision 73 point 3 authority, and the full per-branch disposition -- the single home AGENTS.md and the implement skill both point at
  - file: AGENTS.md
    action: Modify
    purpose: resolve the step-6 on-red instruction versus the Merge protocol contradiction; route the PR-branch disposition to trigger_scope by pointer, funded by trimming the duplicated Full row Gate cell
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: red-CI branch points at trigger_scope, states the no-weakening rule, and names executor-rca out of scope; funded by replacing the deploy-paths restatement with a pointer
  - file: docs/DECISIONS.md
    action: Modify
    purpose: dated annotation scoping Decision 72 to the post-merge main gate (Decision 177 dialect)
  - file: tests/test_pr_ci_red_protocol_contract.py
    action: Create
    purpose: content contract asserting each surface carries its half of the corrected guidance
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - AGENTS.md no longer contradicts itself -- the Merge protocol RCA-first rule is scoped to post-merge default-branch failure and agrees with the step 6 on-red instruction
  - AGENTS.md positively states that a PR-branch --pre red files no rec and gates nothing, and points at ci-rca-lifecycle.yaml trigger_scope rather than restating the disposition
  - The Gate-cell trim drops no Decision 73 point 3 content -- the forward-fix phrase, source=ci_rca and priority=critical all still appear in AGENTS.md
  - ci-rca-lifecycle.yaml trigger_scope declares the default-branch gate, names Decision 73 point 3 as the narrowing authority, and records that PR-branch failures are uncovered by construction
  - implement SKILL.md red-CI branch points at trigger_scope, forbids weakening a criterion, VP step, assertion or budget to obtain green, and names executor-rca as out of scope for PR CI red
  - The red-CI branch adds no rec-filing call -- the existing 3-fix-attempt STOP and VF-08 rules are cited, not restated, and T3.19 stays deferred
  - Decision 72 carries a dated annotation scoping it to main and naming the two-tier Google TAP flow, with no new Decision header minted relative to origin/main
  - No budget registry file is modified -- prose, SLOC and structural-size budgets are all unchanged
  - validate_prose_limits, the contracts structural-size budget and the DECISIONS ceilings all pass
  - The follow-on rec for the deferred enforcement half exists in the warehouse, so the deferral is traceable rather than dropped
verification_plan:
  - step: 1
    phase: pre-deploy
    action: content contract holds on every edited surface
    command: bin/venv-python -m pytest tests/test_pr_ci_red_protocol_contract.py -q
    expected: all pass, including cases asserting each surface FAILS the contract when its clause is absent
    fix_if: a red case passes, meaning the assertion is vacuous
    hermetic: false
    graduation: graduate
    graduation_check_id: pr-ci-red-protocol-contract-tests
  - step: 2
    phase: pre-deploy
    action: the contradiction is gone and both load-bearing phrases survive the trim
    command: bash -c '! grep -q "On CI failure" AGENTS.md && grep -q "forward-fix, never auto-revert" AGENTS.md && grep -q "source=ci_rca" AGENTS.md && grep -q "priority=critical" AGENTS.md && grep -q "Pre-handoff (local) + post-merge on .main." AGENTS.md'
    expected: exits 0
    fix_if: the unscoped bullet survives, or the trim dropped Decision 73 point 3 content (forward-fix, source=ci_rca, priority=critical), or the Decision 163 When cell was trimmed by mistake
    hermetic: true
    graduation: graduate
    graduation_check_id: agents-md-contradiction-resolved
  - step: 3
    phase: pre-deploy
    action: AGENTS.md positively states the PR-branch disposition and routes rather than restates
    command: bash -c 'grep -q "PR-branch" AGENTS.md && grep -q "no rec is filed" AGENTS.md && grep -q "trigger_scope" AGENTS.md'
    expected: exits 0
    fix_if: the PR-branch case was deleted rather than stated, or the disposition was restated inline instead of pointed at
    hermetic: true
    graduation: graduate
    graduation_check_id: agents-md-pr-branch-disposition-stated
  - step: 4
    phase: pre-deploy
    action: the red-CI branch adds no auto-file path (T3.19 stays deferred)
    command: bin/venv-python -c "import pathlib,re; t=pathlib.Path('.claude/skills/implement/SKILL.md').read_text(); i=t.index('**Any red**'); seg=t[i:t.index('- **Still running**', i)]; raise SystemExit(1 if ('file_rec' in seg or 'ops_data_portal' in seg) else 0)"
    expected: exits 0
    fix_if: a rec-filing call was added to the red branch, contradicting VF-08's do-not-implement-now note. The segment ends at the next bullet, never a byte window -- a fixed window reaches into the Hold-subscription block this plan also edits
    hermetic: true
    graduation: graduate
    graduation_check_id: red-ci-branch-no-autofile-path
  - step: 5
    phase: pre-deploy
    action: zero-headroom prose budgets still hold
    command: bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); raise SystemExit(1 if f else 0)"
    expected: exits 0
    fix_if: S1 or the implement S4 entry is over budget -- recover the named bytes, never add a raise marker
    hermetic: true
    graduation: graduate
    graduation_check_id: prose-budgets-within-limit
  - step: 6
    phase: pre-deploy
    action: contract structural-size and DECISIONS ceilings hold
    command: bin/venv-python -c "from scripts.checks.structural.size_limits import validate_structural_size_limits as s; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as d; f=[]; s(f); d(f); raise SystemExit(1 if f else 0)"
    expected: exits 0
    fix_if: ci-rca-lifecycle.yaml past 500 effective lines -- apply the contracts relief valve (compact amendment history, defer detail), never a raise
    hermetic: true
    graduation: graduate
    graduation_check_id: contract-and-decisions-size-ceilings
  - step: 7
    phase: pre-deploy
    action: no budget registry was edited to make room
    command: git diff --quiet origin/main -- config/prose_budgets.yaml config/sloc_budgets.yaml config/structural_size_budgets.yaml
    expected: exits 0
    fix_if: a budget file changed -- a raise is forbidden here and no Decision exists that could authorize a marker (Decision 165)
    hermetic: true
    graduation: graduate
    graduation_check_id: budget-registries-unmodified
  - step: 8
    phase: pre-deploy
    action: the Decision 72 annotation minted no new Decision header
    command: bash -c '[ "$(grep -c "^## Decision [0-9]*:" docs/DECISIONS.md)" -eq "$(git show origin/main:docs/DECISIONS.md | grep -c "^## Decision [0-9]*:")" ]'
    expected: exits 0
    fix_if: the header count moved relative to origin/main, meaning a numbered Decision was written instead of a dated annotation
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-header-count-delta-zero
  - step: 9
    phase: pre-deploy
    action: fast tier green
    command: bin/venv-python -m scripts.validate --pre
    expected: exits 0
    fix_if: the named check fails
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: full tier green before handoff (declared handoff_policy, Decision 163)
    command: bin/venv-python -m scripts.validate
    expected: "exit 0 with a final Validation Summary (scope: all) PASS"
    fix_if: any full-tier-only check fails -- fix and rerun the full tier from the start
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: the follow-on rec for the deferred enforcement half is in the warehouse
    command: bash -c 'bin/venv-python -m scripts.ops_data_portal --sync >/dev/null && grep -q "pr-ci-red-ownership follow-on" logs/.recommendations-log.jsonl'
    expected: exits 0
    fix_if: the rec was never filed -- the enforcement deferral then has no durable trace and reads as dropped
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: AGENTS.md
    behavior: the Merge protocol scopes RCA-first to post-merge main, states the PR-branch disposition, and keeps the forward-fix invariant
    verification_step: 1
    test_selector: tests/test_pr_ci_red_protocol_contract.py
    red_green_expectation: red before, green after
  - source: .claude/skills/implement/SKILL.md
    behavior: the red-CI branch points at trigger_scope, carries the no-weakening rule, and excludes executor-rca
    verification_step: 1
    test_selector: tests/test_pr_ci_red_protocol_contract.py
    red_green_expectation: red before, green after
  - source: docs/contracts/ci-rca-lifecycle.yaml
    behavior: trigger_scope declares the default-branch gate and its Decision 73 point 3 authority
    verification_step: 1
    test_selector: tests/test_pr_ci_red_protocol_contract.py
    red_green_expectation: red before, green after
  - source: docs/DECISIONS.md
    behavior: Decision 72 carries the dated scope annotation naming the post-merge main gate
    verification_step: 1
    test_selector: tests/test_pr_ci_red_protocol_contract.py
    red_green_expectation: red before, green after
constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Cite, never restate -- AGENTS.md "Only modify files explicitly in scope" and the plan-schema "only files listed here may be modified" already carry the scope rule; the implement skill already carries the 3-fix-attempt STOP and VF-08 rules (Decision 86). Anchor on these quoted phrases, never on line numbers
  - Add no rec-filing call to the red-CI branch -- VF-08 defers the auto-file path to T3.19 with an explicit do-not-implement-now instruction
  - The no-weakening clause is NEW prose -- a grep of .claude/skills/** and AGENTS.md for weaken/loosen/relax returns nothing, so it cannot be discharged by citation and must be funded by recovery
  - S1 is 25933/25933 and the implement S4 entry 47830/47830 -- both zero-headroom. Recover bytes, never add a raise marker; no Decision exists that could authorize one (Decision 165 is retroactive)
  - "AGENTS.md arithmetic (measured) -- pool 522 bytes (the 425-byte bullet plus 97 recoverable from the Full row Gate cell) against a 499-byte two-bullet replacement, 23 surplus. The true ceiling for a two-line replacement is 520 text bytes, two newlines consumed not one. The pointer routing to trigger_scope is what makes it close (Decision 86)"
  - "What the AGENTS.md replacement sheds, decided here rather than left to the implementer under budget pressure: the 'next /plan session will surface it under CI RCA Recs (open)' clause -- navigational detail trigger_scope can carry. Every Decision 73 point 3 fact stays"
  - "implement SKILL.md arithmetic (measured) -- fund from the skill's own '## SLOC decompose-by-default' block, 715 bytes of near-verbatim restatement of AGENTS.md's Layer 1 '## SLOC governance' section; a 115-byte pointer recovers 600 against roughly 270 of additions at full fidelity"
  - "Do NOT fund the implement-skill edit from the 'Hold subscription through apply' block -- deploy-paths.yaml contains no occurrence of 'acknowledge' (that path is documented in terraform/CLAUDE.md), so repointing that restatement would delete live guidance the target does not carry"
  - "Cite '### VP Failure Is Not Negotiable' for the VP-step half of the no-weakening rule; only the criterion, assertion and budget half is genuinely new prose"
  - ci-rca-lifecycle.yaml has 136 effective-line headroom (364/500, Decision 166) -- relief valve, never a raise
  - Author trigger_scope with scalar and string leaves, mirroring the sibling evidence_scope block -- a field-descriptor table would be rejected by _population.detect_smuggled_shape as a smuggled Class A shape
  - DECISIONS.md live headers are at the ceiling minus one -- append a dated annotation only, mint no new Decision, and assert the count as a delta against origin/main, never an absolute
  - Do not trim the AGENTS.md Full row When cell -- Decision 163 point 3 made it load-bearing
  - No scripts/ or src/ production Python is in scope; the new tests/ file is Python and is expected. scripts/verify_ci_workflow.py is at 500/500 SLOC with zero headroom and is unregistered, so extending it would trip validate_sloc_limits with no sanctioned exit (Decision 128 forbids the raise) -- the enforcement half is deferred, not forgotten
context:
  - "Root cause: AGENTS.md contradicts itself -- the Git-ops step 6 on-red instruction says diagnose and fix on branch, while the Merge protocol says do NOT manually patch. ci-rca.yml gates on head_branch==default_branch (T1.13 c6), so only the latter's post-merge reading is true."
  - "Decision 73 point 3 is the narrowing authority -- it already scopes ci_rca filing to full-tier failure on main, so this is a clarification, not a new narrowing."
  - "Decision 72 is unscoped rather than wrong: its Problem line describes the pre-existing gap and one Consequences sentence about workflow_run checkout is now unreachable. Annotate, do not retire."
  - "The inline-fix boundary already exists twice in prose (AGENTS.md Safety; the plan-schema scope comment) and is enforced nowhere -- this plan cites it and defers enforcement."
  - "Deferred to the follow-on rec (execution step 6), on plan-critique round 1 evidence: the _check_ci_rca_filter doc-coupling guard and the validate_ci_rca_trigger pre_globs widen. scripts/verify_ci_workflow.py measures exactly 500/500 SLOC, so that work needs a Decision 128 decomposition it should carry itself. Also deferred: the inline-vs-defer derivation rows, the Fable advice-consult deviation trigger, and a diff-vs-plan-scope check (validate_plan_scope_closure is registration-closure only, so none exists)."
  - "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND; CITE dec-73, dec-142, dec-127, dec-86, dec-128, dec-165, dec-60, dec-163, dec-48; flags resolved against dec-166, dec-135, dec-55, dec-177; related dec-170, dec-131, dec-168, dec-90"
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Add trigger_scope plus an amendment_log entry to docs/contracts/ci-rca-lifecycle.yaml -- the branch gate, Decision 73 point 3 as narrowing authority, that PR-branch failures are uncovered by construction, and the per-branch disposition both other surfaces will point at
  - Rewrite the AGENTS.md Merge protocol into two branch-scoped bullets that agree with the Git-ops step 6 on-red instruction, carrying the forward-fix invariant forward and pointing at trigger_scope for the PR-branch disposition; fund it by trimming only the Full row Gate cell
  - "Rewrite the implement skill red-CI branch to point at trigger_scope, state the no-weakening rule (citing '### VP Failure Is Not Negotiable' for the VP-step half), and exclude executor-rca; fund it by replacing the '## SLOC decompose-by-default' block with a pointer to AGENTS.md '## SLOC governance'"
  - Append the dated scope annotation to Decision 72 naming the post-merge main gate and the two-tier Google TAP flow
  - Write tests/test_pr_ci_red_protocol_contract.py with a positive and a negative case per surface, proving each assertion fails when its clause is removed from a fixture copy
  - "File the follow-on rec via bin/venv-python -m scripts.ops_data_portal --file-rec, titled with the literal prefix pr-ci-red-ownership follow-on so VP step 11 can find it: the _check_ci_rca_filter doc-coupling guard plus pre_globs widen (needs a Decision 128 decomposition of the 500/500-SLOC scripts/verify_ci_workflow.py), the inline-vs-defer derivation rows, the Fable deviation trigger, and a diff-vs-plan-scope enforcement check"
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
work_areas: []
