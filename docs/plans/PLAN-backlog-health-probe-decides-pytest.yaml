constraints:
  - >-
    The probe job stays credential-free: no id-token, permissions contents:read only,
    persist-credentials false, and no network reachable inside the sandbox. Only the install
    surface changes (Decision 143's boundary is untouched; see the scout's SPIRIT NOTE).
  - >-
    Do NOT install requirements-dev.txt. Do NOT invent a new narrow requirements file --
    requirements-fast.txt already is one, and a second would be a surface agents must keep in sync.
  - >-
    scripts/backlog_health/probe.py remains the SOLE executor of rec-authored commands; no other
    module in the package may reach subprocess with rec-derived argv, and every rec_relevance call
    outside it keeps run_acceptance_probe=False (Decision 103, the package's AST invariant).
  - >-
    Do NOT edit docs/plans/PLAN-trailer-acceptance-static-gate.yaml or
    docs/plans/PLAN-trailer-acceptance-junit-verdict.yaml. Slice A is a merged plan document and
    slice B is being revised by another agent; the inheritance obligation is carried mechanically
    by the new check, not by editing either file.
  - >-
    Do not fix rec-3691 (TimeoutExpired kills only the direct unshare child) inline -- it is a
    different defect on the same file and is out of this plan's scope boundary (Decision 59).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "rec-4005 (bundled): the defect this plan repairs, filed 2026-09-22 with all three measurements."
  - "Prerequisite for PLAN-trailer-acceptance-static-gate (slice A, merged 5ce6e4b5, NOT yet implemented): its evaluator reuses scripts.backlog_health census+probe as its static verdict source, and its own VP idiom is pytest node-ids throughout."
  - "MEASURED 2026-09-22 on 1333 open recs: buckets probeable 958, expected_fail_missing_node 372, unprobeable_unsafe 1, unprobeable_shape 2. pytest-shaped acceptance is 470 of 1333 (35%)."
  - "MEASURED: 98 of 958 probeable commands carry a word-boundary pytest token; only 16 reach pytest under today's exec truncation."
  - "MEASURED, pytest attributable alone: replaying those 98 under the real unshare sandbox with a requirements.txt-only venv vs one that also has requirements-fast.txt changes 10 verdicts (9 pass->fail, 1 timeout->fail) -- 10 of 958 (1.04%). SMALL, and stated as such."
  - "MEASURED, both fixes together: today {fail 827, pass 111, timeout 20} vs repaired {fail 873, pass 64, timeout 21}; 104 of 958 verdicts change. The local baseline reproduces the live 2026-09-21 run ({fail 824, pass 110, timeout 18} over 952) within 3/1/2, which is the fidelity warrant for these numbers."
  - "NOT CLAIMED: no share of the live run's 824 fails is attributed to the missing pytest beyond the 10 measured above. An independent measurement puts roughly 30% of this repo's acceptance commands genuinely not holding; this plan does not dispute that."
  - "exec truncation verified directly, not inferred: bash -c 'exec /bin/echo A && /bin/echo B' prints only A. 805 of 958 probeable commands (84.0%) are compound; 13 more were unparseable by the authoring-time lexer and are excluded from that count rather than assumed compound."
  - "Coupling, the reason all three fixes land together: exec truncation is what MASKS the pytest gap (82 of 98 never reach pytest), so installing pytest alone moves 10 verdicts; removing exec alone would raise the wrong-FAIL population toward 98 AND convert 46 honest expected_fail_missing_node recs into probed fails. Each fix makes the others' absence worse."
  - "Option review, recorded rather than assumed. (a) requirements-dev.txt: ~290 pins into the one job that executes untrusted input -- rejected on surface. (b) requirements-fast.txt: 13 pins, ALREADY installed by ci.yml pr-validate on every PR, so zero new distributions enter CI -- CHOSEN. (c) a new narrow file: duplicates (b) and creates a second surface to sync -- rejected. (d) a pytest-only pin: measured to exit 4 'unrecognized arguments: --randomly-seed=last --disable-socket' under pyproject addopts -- rejected as non-functional. (e) decline to probe pytest and return an honest unmeasurable: NOT unreasonable and costs no install surface, but it forecloses the stated purpose -- slice A's gate could then never decide the 35% of the backlog, and its own acceptance idiom, that is pytest-shaped. Rejected on purpose-fit, not on principle."
  - "Slice A inheritance mechanism, chosen deliberately: a registered CI guard keyed on the unprivileged-userns sysctl marker, NOT an amendment to the merged slice A plan, NOT a superseding note, NOT a scope row editing it, NOT a follow-on rec. Rationale: Decision 163 -- a universal obligation is enforced structurally, not documented; a prose obligation in a merged plan rots silently, and slice A's evaluator job trips the guard by construction the moment it is authored."
  - "Positive-evidence containment, stated at the strength the evidence supports and no further. On ubuntu-latest TODAY (the 23.10/24.04 AppArmor default), a sandbox job omitting the sysctl cannot engage isolation, so probe.run_all returns ISOLATION_UNAVAILABLE for every entry -- honest, never a false fail. That is an OS-version-scoped fact, NOT a timeless one: ubuntu-22.04, a self-hosted runner, or a relaxed future default all engage unshare -rmn with no sysctl present, returning real verdicts with pytest absent. This is why the guard arms on the executor marker too; neither marker's absence is ever read as 'nothing needed'."
  - "Governance tension, named rather than patched around: Decision 162 R3 pushes workflow bodies out of .github/workflows/ into scripts/ci/ or composite actions -- the same ratchet that forces this plan's combined one-line install form. A sandbox job whose sysctl step relocates under that standing instruction walks out of a sysctl-only guard's view while still needing a test runner. The executor marker keeps the guard armed across that relocation. If a future relocation moves the EXECUTOR invocation off the workflow surface too, the guard needs re-siting, which is a rec -- never a third marker bolted on inline."
  - "Budget: the repaired probe ran all 958 entries in 336.8s locally against _DEFAULT_GLOBAL_BUDGET_S of 25 minutes and a 30-minute job timeout; 958 of 958 decided."
  - "Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND. CITE: Decision 62, Decision 55, Decision 169, Decision 170, Decision 132, Decision 176, Decision 189, Decision 131, Decision 163. CONTRADICT NOTE: Decision 182 (fast-tier non-test budget -- resolved by narrowed pre_globs), Decision 103 (no second relevance evaluator -- resolved by an explicit constraint). SPIRIT NOTE: Decision 143 (install surface of the untrusted-execution job -- resolved by choosing the 13-pin file already in CI and leaving the permissions block untouched). ROADMAP: T1.13, T2.54, T4.23 all RELATED; CONFLICT 0. Decisions triaged: 150 of 150."
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - docs/contracts/vp-red-before.yaml and docs/contracts/verification-registry.yaml read before authoring the four shards
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    .github/workflows/backlog-health.yml -- in the PROBE job's Activate venv step only, replace the
    existing install line with the combined one-line form
    `.venv/bin/pip install -r requirements.txt -r requirements-fast.txt`, holding that body at 3
    effective lines (config/composite_action_body_baseline.yaml line 91). Leave census and escalate
    untouched, and do not touch the baseline file.
  - >-
    scripts/backlog_health/probe.py -- drop the `exec ` prefix in _isolated_argv; update the
    module docstring's sandbox description so it no longer implies exec semantics.
  - >-
    scripts/backlog_health/census.py -- anchor parse_pytest_target on a delimited pytest
    invocation token; update its docstring and the module docstring's bucket description.
  - >-
    tests/test_backlog_health_workflow.py, tests/test_backlog_health_probe.py,
    tests/test_backlog_health_census.py -- add the three pinned node ids, each asserting behaviour
    rather than token presence.
  - >-
    scripts/checks/ci_guards/validate_sandbox_runner_test_deps.py -- new registered check armed by
    EITHER the sysctl marker or the scripts.backlog_health executor marker, stripping full-line AND
    trailing comments, with examined()/skipped() on both branches; register it in _manifest.py with
    narrowed pre_globs and map it `dependency_gap` in config/ci_rca_taxonomy.yaml.
  - >-
    tests/checks/ci_guards/test_validate_sandbox_runner_test_deps.py -- mirror-rule test file with
    the pinned node id plus the positive, executor-marker, full-line-comment, trailing-comment,
    scoping, accounting and live-workflow arms.
  - >-
    config/agent/verification_registry/entries/ -- create the four shards, filename equals
    check_id equals the VP step's graduation_check_id.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and
    RCA (Decision 55).
  - >-
    Flip this plan's implementation_declared to true after code review and a completed full-tier
    pass, then squash-merge with a `Resolves: rec-4005` trailer.
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Each of the three repairs reverts independently. Reverting the workflow install alone returns
  every pytest-carrying acceptance command to a guaranteed FAIL. Reverting the exec removal alone
  returns every compound command to first-segment-only execution. Reverting the census anchor alone
  returns 46 recs from expected_fail_missing_node to probeable. The new check and its manifest Entry
  revert together (deleting the Entry alone breaks the bijection). Nothing here gates a PR or a
  merge: backlog-health is schedule-plus-dispatch only and is deliberately absent from
  terraform/github/repo.tf's required_status_checks (Decision 62 amendment / CD.12, alarm-not-gate).
