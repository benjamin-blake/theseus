schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: vocabulary-block-check
intent: 'Make vocabulary reservation contract-driven: one generic check validates every contract''s top-level vocabulary:
  block against a shared grammar and runs the anti-pattern detectors those blocks declare, replacing the regex hardcoded in
  validate_environment_taxonomy, and a new provisional_v0 contract seeds the first cross-cutting reservation row, "work item"
  (meaning from Decision 197 clause 3; clause 7 bounds it: no rename). Reservation only: no term is renamed anywhere.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vocabulary-block-check.yaml
phase: 'user_explicit_out_of_scope (soft-warn category: operator charter stream D, slice D1; no tier_item claimed, no exit
  criterion closed, no status flipped).'
scope:
- file: docs/contracts/vocabulary-reservation.yaml
  action: Create
  purpose: 'New Class D contract (status provisional_v0 with a provisional_v0 block whose re_ratification_trigger first_of names
    "cross_cutting_rows >= 10", "detector_false_positive_reports >= 3" and "days_since_authored_at >= 90", never ratified;
    subject vocabulary-reservation; evaluator check validate_vocabulary_blocks). Scope is ONLY the shared block grammar and cross-cutting
    rows: its description says each domain contract stays the sole home of its own reservation table (Decision 77 cl.1 for
    environment-taxonomy.yaml) and this file never restates a domain row. Declares block_grammar (row = mapping with non-empty
    str reserved_meaning and do_not_use_for, other row keys free; container = mapping whose values are all rows; reserved block
    keys note / allowlisted_compound_tokens / anti_patterns; an anti_patterns entry is a prose str, never executed, or a mapping
    {pattern, detector: {regex, ignore_case, applies_to_suffixes, skip_prefixes, allowlist_files, message}}, the ONLY form
    any check executes - detection is opt-in per entry, Decision 181 cl.2), cross_cutting_row_grammar (origin {path under docs/audit-prompts/,
    needle inside that prompt''s DISAMBIGUATION TRAPS section, relation direct | adjacent}: direct requires the line holding
    the needle to contain the row term, adjacent requires a non-empty adjacent_reason and is graded by the Fable sampler; anchors
    >= 2 of {path, needle, sense} with pairwise-distinct senses, and the line holding each anchor needle must contain the row
    term in normalised form (case-insensitive; underscore or space; singular or plural, so work_item, work item, work items);
    a cross-cutting row key never equals a domain block''s term key; this block''s anti_patterns admit the detector form only,
    so no new unenforced residual can be authored here), governed_blocks (the four rostered contracts, detector_owner validate_environment_taxonomy
    on environment-taxonomy), and its own vocabulary block with the work_item row (no detector). Grammar values are authored
    as plain strings, never mappings carrying type plus description, so the Class A smuggling detector cannot fire.'
- file: scripts/checks/contracts/_vocabulary_blocks.py
  action: Create
  purpose: 'Engine, no I/O at import: load_block(path) -> parsed block or error; walk_rows; validate_block (grammar legs);
    validate_cross_cutting (origin section, origin relation, anchor needles and anchor term lines); compile_detectors; scan_changed_docs(detectors)
    -> (errors, candidate_count). Every function takes its contract path explicitly. A missing or unparseable contract is
    an error, never an empty pass.'
- file: scripts/checks/contracts/validate_vocabulary_blocks.py
  action: Create
  purpose: 'Registered check validate_vocabulary_blocks, reading every contract and changed doc under _common.ROOT: L1 roster
    parity (code roster == contract governed_blocks == every docs/contracts/*.yaml with a line matching ^vocabulary: ; discovery
    is that line probe, and only rostered files are YAML-parsed, so the always-on cost stays near 0.03 s rather than parsing all
    54 contracts); L2 block grammar on all four; L3 detector compile; L4 cross-cutting
    origin and anchors plus the no-restatement rule; L5 runs detector-form anti_patterns only (prose entries are never executed)
    over changed docs for blocks without a detector_owner. Code roster holds the four basenames
    as literals (Decision 168 evaluator grammar). Declares registry.examined(<rows validated>, unit="vocabulary_rows").'
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: 'Append Entry(name="validate_vocabulary_blocks", module="scripts.checks.contracts.validate_vocabulary_blocks", attr="validate_vocabulary_blocks",
    pre=True, full_segment="full_after_lint"), pre_globs None: L5 self-scopes to the changed-doc diff exactly as validate_environment_taxonomy
    does, so a static glob could only re-derive that diff.'
- file: scripts/checks/iam_tf/validate_environment_taxonomy.py
  action: Modify
  purpose: 'Body delegates to the engine scoped to the contract at a module-level seam CONTRACT_PATH = <repo root from Path(__file__).resolve().parents[3]>
    / "docs" / "contracts" / "environment-taxonomy.yaml": detectors come from that contract''s vocabulary.anti_patterns; the
    hardcoded regex, tier tuple, allowlist and skip prefixes are removed. Changed docs are still read under _common.ROOT. The
    contract is configuration of the check and the changed docs are its input, so the existing tests, which patch _common.ROOT
    to an empty or fixture tmp_path, keep reading the real contract and pass byte-unchanged. Registered name, failure label "Environment/phase
    taxonomy", examined unit candidate_docs, and the contract literal are unchanged. Manifest Entry untouched. 100% per-file
    coverage from its mirror test, including the missing-contract branch.'
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: 'vocabulary.anti_patterns[0] becomes the mapping form carrying today''s exact detector (regex \b(sandbox|sit|prod|production|staging)[
    \t]+phase\b, ignore_case, suffixes .md/.yaml/.yml, skip .github/ and tests/, allowlist this contract, docs/DECISIONS.md,
    docs/ROADMAP-PLATFORM.yaml); header comment names the engine; one amendment_log row (field_add, semantic_break false).
    Every other top-level key (contract, axis_a, guard_classification, conformance, single_account_rule and the rest) stays
    byte-identical in parsed form, and the vocabulary rows themselves are untouched (VP 8). T2.48 lists this file in scope;
    nothing here touches its open c6.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Add function_to_category row validate_vocabulary_blocks -> schema_drift beside validate_environment_taxonomy.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: 'Add route topic vocabulary-reservation, targets [docs/contracts/vocabulary-reservation.yaml] (topic equals subject),
    plus one amendment_log field_add row. The file measures 474 effective lines against the 500 contracts-class limit, so
    no compaction is planned; compact older amendment_log rows only if a later main merge makes the limit bind (precedent:
    the ducklake-partition-remediation route).'
- file: tests/checks/contracts/test_validate_vocabulary_blocks.py
  action: Create
  purpose: 'Mirror test for the check, every case on its own tmp_path fixture tree (no shared state, so order-independent
    under pytest-randomly): one red-before case per leg (unrostered vocabulary block, roster/contract drift, row missing do_not_use_for,
    unknown non-row key, uncompilable regex, origin path outside docs/audit-prompts/, origin needle outside the DISAMBIGUATION
    section, direct origin whose needle line lacks the term, adjacent origin with no adjacent_reason, one anchor only, duplicate
    senses, missing anchor needle, anchor needle line lacking the row term, a cross-cutting row key equal to a domain term key
    (D77 no-restatement), a prose anti_pattern in the reservation contract''s own block, a changed doc matching a non-owned
    detector), the owner-skip case (a changed doc matching the detector_owner block''s detector is NOT reported by this check,
    proving nothing runs twice), the green real-tree case, and the registration case. Reaches 100% per-file coverage of validate_vocabulary_blocks.py.'
- file: tests/checks/contracts/test__vocabulary_blocks.py
  action: Create
  purpose: 'Mirror test for the engine, calling every engine function and every error branch directly (coverage_baseline.py
    measures each source from its mirror test alone, and a new file is held to 100%): load_block (ok, missing, unparseable,
    no vocabulary key), walk_rows (flat rows, axes/terms containers, mixed invalid), validate_block (each grammar failure),
    validate_cross_cutting (each origin and anchor failure, direct and adjacent relations, term normalisation forms), compile_detectors
    (prose skipped, bad regex, missing message), scan_changed_docs (suffix filter, skip prefix, allowlist, unreadable file,
    hit and miss), and section bounding for the DISAMBIGUATION heading.'
- file: tests/checks/iam_tf/test_validate_environment_taxonomy.py
  action: Modify
  purpose: 'Additive only: every existing test, setup line and assertion stays byte-unchanged (the CONTRACT_PATH seam keeps
    them reading the real contract, including test_taxonomy_yaml_allowlisted, the node behind the graduated entry env-taxonomy-yaml-allowlisted-by-lint).
    Adds test_detector_is_contract_driven (patches CONTRACT_PATH to a tmp copy whose detector regex is changed and shows the
    verdict follows the copy) and test_missing_contract_fails_loud (patches CONTRACT_PATH to an absent path and asserts the
    failure label is appended, never an empty pass).'
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
- validate_vocabulary_blocks passes on the real tree, validating all four governed blocks; data-modeling-standard.yaml and
  inference-provider.yaml are read only and their prose anti_patterns are never executed (VP 1, VP 2).
- 'Each leg reddens on its own broken input: an unrostered vocabulary block, roster drift between code and contract, a row
  missing reserved_meaning or do_not_use_for, an unknown non-row key, an uncompilable detector regex, a cross-cutting row whose
  origin path outside docs/audit-prompts/, origin needle outside the DISAMBIGUATION TRAPS section or absent, a direct origin
  whose needle line lacks the term, an adjacent origin with no reason, fewer than two anchors, two anchors sharing a sense,
  an anchor needle absent from its file or on a line lacking the row term, a cross-cutting row key equal to a domain term
  key (D77), a prose anti_pattern in the reservation contract''s own block, and a changed doc matching a non-owned detector;
  a doc matching an owned detector is not reported twice (VP 2).'
- 'validate_environment_taxonomy''s existing tests pass byte-unchanged, its hardcoded regex is gone from the module, editing
  the contract''s detector regex changes its verdict, and a missing contract fails loud (VP 2, VP 3).'
- docs/contracts/vocabulary-reservation.yaml carries the work_item row (meaning from Decision 197 cl.3; no detector, so rec,
  recommendation and file_rec are never flagged) with an adjacent origin in AUDIT-criterion-shape-forks.md section 3 and two
  anchors whose needle lines name the term with distinct senses, restates no domain row, and contract population and placement checks pass with the new file and route
  (VP 4).
- environment-taxonomy.yaml differs from origin/main only in vocabulary.anti_patterns and amendment_log (VP 8).
- validate_vocabulary_blocks is registered in the contracts manifest, ungated in --pre, dispatched in both tiers, mapped in
  config/ci_rca_taxonomy.yaml, and declares examined on its pass path (VP 5).
- No net-new suppression (noqa, type ignore, pragma no cover, skip, xfail) in the diff, and the full presubmit tier exits 0
  (VP 6, VP 7).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new check against the real tree.
  command: bin/venv-python -c "from scripts.checks import registry;from scripts.checks.contracts.validate_vocabulary_blocks
    import validate_vocabulary_blocks as v;f=[];v(f);assert not f,f;d=registry.pop_declaration();assert d and d.kind=='examined'
    and d.count>=24,d;print('vocabulary rows',d.count)"
  expected: Exit 0 printing the pass line; red before because the module does not exist.
  fix_if: A FAIL line names the leg and contract; fix the contract or the engine, never the assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The registered check runs this exact call standing in both tiers once VP 5's registration lands;
    a registry row would execute the same function twice for no added independence.
  expected_literals:
  - vocabulary rows 24
- step: 2
  phase: pre-deploy
  action: Run the two new mirror tests, the contracts manifest test and the whole legacy test file (parity).
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_vocabulary_blocks.py tests/checks/contracts/test__vocabulary_blocks.py
    tests/checks/contracts/test__manifest.py tests/checks/iam_tf/test_validate_environment_taxonomy.py -q
  expected: Exit 0, all tests pass.
  fix_if: A failing leg case means the leg does not detect its broken input; fix the leg. A failing pre-existing legacy test
    means parity broke; fix the detector mapping in the contract or the CONTRACT_PATH seam, never the test. A case that passes
    alone but fails in the suite means shared state; isolate it on its own tmp_path.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file pytest re-run of test files this plan creates or extends; pytest already runs them
    standing in both tiers.
- step: 3
  phase: pre-deploy
  action: Prove the legacy check is contract-driven with parity.
  command: bin/venv-python -m pytest "tests/checks/iam_tf/test_validate_environment_taxonomy.py::TestValidateEnvironmentTaxonomy::test_detector_is_contract_driven"
    "tests/checks/iam_tf/test_validate_environment_taxonomy.py::TestValidateEnvironmentTaxonomy::test_missing_contract_fails_loud"
    "tests/checks/iam_tf/test_validate_environment_taxonomy.py::TestValidateEnvironmentTaxonomy::test_taxonomy_yaml_allowlisted"
    -q && ! grep -q "platform_tiers\|tier_as_phase" scripts/checks/iam_tf/validate_environment_taxonomy.py && echo "legacy delegates OK"
  expected: Exit 0, the three nodes pass and the hardcoded names are gone; red before because the two new nodes do not exist
    and the module still holds the hardcoded names.
  fix_if: test_detector_is_contract_driven failing means the module still ignores the contract; test_missing_contract_fails_loud
    failing means a missing contract passes silently; test_taxonomy_yaml_allowlisted failing means the detector mapping dropped
    the contract from its allowlist. Fix the module or the contract, never a test.
  hermetic: true
  graduation: graduate
  graduation_check_id: env-taxonomy-detector-contract-driven
- step: 4
  phase: pre-deploy
  action: Confirm the work_item row, its origin and anchors, and the contract and route checks.
  command: bin/venv-python -c "import yaml;from scripts.checks.contracts.validate_contract_drift import validate_contract_drift
    as c;from scripts.checks.hygiene.validate_placement import validate_placement as p;d=yaml.safe_load(open('docs/contracts/vocabulary-reservation.yaml'));r=d['vocabulary']['work_item'];assert
    r['origin']['path']=='docs/audit-prompts/AUDIT-criterion-shape-forks.md' and r['origin']['relation']=='adjacent',r;assert len({a['sense'] for a in r['anchors']})>=2,r;assert
    d['contract']['status']=='provisional_v0';rt=[x for x in yaml.safe_load(open('docs/contracts/file-router.yaml'))['routes']
    if x['topic']=='vocabulary-reservation'][0];assert rt['targets']==['docs/contracts/vocabulary-reservation.yaml'],rt;f=[];c(f);p(f);assert not f,f;print('reservation row OK')"
  expected: Exit 0 printing the pass line.
  fix_if: A contract-drift FAIL names the shape rule; a placement FAIL means the route target is untracked or malformed.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_contract_drift, validate_placement and the new check's L4 already run standing in both
    tiers over this file.
- step: 5
  phase: pre-deploy
  action: Confirm registration across the manifest, both sequences and the ci_rca taxonomy.
  command: bin/venv-python -c "import yaml;from scripts.checks import registry;from scripts.checks.contracts import _manifest;e=[x
    for x in _manifest.ENTRIES if x.name=='validate_vocabulary_blocks'][0];assert e.pre and e.full_segment=='full_after_lint'
    and e.pre_globs is None,e;assert 'validate_vocabulary_blocks' in [s.name for s in registry.pre_sequence()] and 'validate_vocabulary_blocks'
    in [s.name for s in registry.full_sequence()];t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert
    t['validate_vocabulary_blocks']=='schema_drift';print('registration OK')"
  expected: Exit 0 printing the registration line.
  fix_if: IndexError means the Entry is missing; KeyError means the taxonomy row is missing. If Step exposes the name under
    another attribute, read scripts/checks/registry.py and use it; do not weaken the membership assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates standing guards (test__manifest.py, validate_ci_rca_taxonomy, validate_check_accounting).
- step: 6
  phase: pre-deploy
  action: Assert zero net-new suppressions in the diff.
  command: '! git diff origin/main -- scripts tests | grep "^+" | grep -E "noqa|type: ignore|pragma: no cover|pragma: no branch|pytest.mark.skip|pytest.mark.xfail|pytest.skip\(|pytest.xfail\(|importorskip"
    && echo "no new suppressions"'
  expected: Exit 0 printing the line.
  fix_if: Remove the suppression and fix the underlying finding.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: Run the full presubmit tier.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named failure on the branch.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: Prove environment-taxonomy.yaml changed only in vocabulary.anti_patterns and amendment_log.
  command: bin/venv-python -c "import yaml,subprocess;b=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/environment-taxonomy.yaml'],capture_output=True,text=True,check=True).stdout);h=yaml.safe_load(open('docs/contracts/environment-taxonomy.yaml'));d=[k
    for k in set(b)|set(h) if k not in ('vocabulary','amendment_log') and b.get(k)!=h.get(k)];assert not d,d;bv={k:v for k,v
    in b['vocabulary'].items() if k!='anti_patterns'};hv={k:v for k,v in h['vocabulary'].items() if k!='anti_patterns'};assert
    bv==hv;ap=h['vocabulary']['anti_patterns'];assert len(ap)==1 and isinstance(ap[0],dict),ap;assert h['amendment_log'][1:]==b['amendment_log'];print('env
    taxonomy delta bounded')"
  expected: Exit 0 printing the line; red before because anti_patterns[0] is still a prose string.
  fix_if: A listed key means an out-of-bounds edit to the Terraform guard-classification SoT; revert it. An amendment_log
    mismatch means an existing row was edited or the new row was not prepended (the log is newest-first).
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: scripts/checks/contracts/validate_vocabulary_blocks.py
  behavior: each leg fails on its own broken input and passes the real tree
  verification_step: 2
  test_selector: tests/checks/contracts/test_validate_vocabulary_blocks.py
  red_green_expectation: red before (module absent), green after
- source: scripts/checks/contracts/_vocabulary_blocks.py
  behavior: row walk, detector compile and the missing-contract error path
  verification_step: 2
  test_selector: tests/checks/contracts/test__vocabulary_blocks.py
  red_green_expectation: red before (module absent), green after
- source: scripts/checks/iam_tf/validate_environment_taxonomy.py
  behavior: verdicts come from the contract detector with unchanged parity
  verification_step: 3
  test_selector: tests/checks/iam_tf/test_validate_environment_taxonomy.py::TestValidateEnvironmentTaxonomy::test_detector_is_contract_driven
  red_green_expectation: red before (hardcoded regex ignores the contract edit), green after
- source: scripts/checks/contracts/_manifest.py
  behavior: every Entry, the new one included, resolves to an importable callable
  verification_step: 2
  test_selector: tests/checks/contracts/test__manifest.py
  waiver_reason: An additive Entry has no broken prior state for the mirror test to redden on; VP 5's membership assertion
    is the red-before proof (it fails before the Entry exists).
- source: docs/contracts/vocabulary-reservation.yaml
  behavior: the grammar, roster and work_item row the check validates against the real tree
  verification_step: 2
  test_selector: tests/checks/contracts/test_validate_vocabulary_blocks.py
  red_green_expectation: red before (contract and check absent), green after
- source: docs/contracts/environment-taxonomy.yaml
  behavior: the detector mapping drives validate_environment_taxonomy's verdict
  verification_step: 3
  test_selector: tests/checks/iam_tf/test_validate_environment_taxonomy.py::TestValidateEnvironmentTaxonomy::test_detector_is_contract_driven
  red_green_expectation: red before (anti_patterns[0] is prose, so no detector is read), green after
- source: config/ci_rca_taxonomy.yaml
  behavior: the new check maps to schema_drift for ci-rca attribution
  verification_step: 5
  command: t['validate_vocabulary_blocks']=='schema_drift'
  red_green_expectation: red before (KeyError, row absent), green after
- source: docs/contracts/file-router.yaml
  behavior: the vocabulary-reservation route resolves to the new contract (topic equals subject)
  verification_step: 4
  command: if x['topic']=='vocabulary-reservation'][0]
  red_green_expectation: red before (IndexError, route absent), green after
constraints:
- Reservation only - no term renamed in any file (charter never-list; Decision 197 clause 7 rename is a later, model-wide pass).
- validate_environment_taxonomy's manifest Entry, tier membership and registered name are untouched; retiring it needs a Decision
  that names it (Decision 187 mark-then-drop) and is parked.
- No edit to docs/DECISIONS.md, AGENTS.md or ROADMAP-PLATFORM.yaml; no status or criterion flip; no new Decision.
- data-modeling-standard.yaml and inference-provider.yaml are read, never edited; their prose anti_patterns stay unenforced
  (rec-4116 owns data-modeling's residual and is neither updated nor closed, Decision 67).
- 'F1 bounds: no path under terraform/** and no aws_iam_* resource is touched; environment-taxonomy.yaml''s header-comment edit
  is limited to the engine pointer (its single-source-of-truth sentence stays); validate_environment_taxonomy.py keeps its
  environment-taxonomy.yaml literal; graduated entries env-taxonomy-evaluator-resolves and env-taxonomy-yaml-allowlisted-by-lint
  stay green (VP 3, and validate_contract_drift inside VP 7); a VP 8 key diff is reverted, never widened.'
- environment-taxonomy.yaml stays the sole home of the environment reservation table (Decision 77 cl.1); the new contract
  never restates a domain row.
- Every new file under 500 SLOC (Decision 128); no assertion weakened (Decision 181).
- No rescue agents or workaround loops (Decision 55).
