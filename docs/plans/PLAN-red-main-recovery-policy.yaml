  (d) Work paths: --plan PATH reads scope[].file with action Create -> "A", Modify -> "M", Delete -> "D", and the
  plan's bundled_recommendations; --files PATH... uses "M" for each and bundles nothing.
  evaluate(reds, work_entries, now, slo_hours, selector=derive_affected_tests) is pure and returns the verdict dict.
  Per red, the first matching rule wins: (0) the red's id is in the plan's bundled_recommendations -> clear
  "repairs_this_red" (the plan is that red's repair, so overlap is expected); (1) created_timestamp unparseable -> blocked "undeterminable"; age in hours
  >= slo_hours -> blocked "slo_breached", whatever the track or overlap. (2) is_track_a(context_v2_json)
