- file: .claude/commands/overseer.md
  action: Modify
  purpose: >-
    Step 6's "Apply the halt-on-open-ci_rca gate before dispatching any new slice." becomes "Apply the
    halt-on-open-ci_rca gate (scripts.ci_rca.red_overlap, Decision 224) before dispatching any /implement slice; a
