- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    The Preflight Constraints "ci_rca_unresolved_recs non-empty" bullet becomes APPROVED_PLANNING_BULLET, and the
    Related-Work Check's opening paragraph becomes APPROVED_RELATED_WORK (the three conditions stay). 484 bytes of
    prose-budget headroom at planning.
- file: .claude/commands/orient.md
  action: Modify
  purpose: >-
    The CI-RCA Triage rendering row for a non-empty ci_rca_unresolved_recs keeps its **HARD BLOCK** label (pinned by
    tests/session/preflight/test_ci_rca_signals_deferrals.py) and its third column becomes "List each rec (id,
