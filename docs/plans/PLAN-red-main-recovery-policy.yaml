- |-
  APPROVED_RED_OVERLAP (scripts/ci_rca/red_overlap.py):
  Inputs. (a) One reader call, named("preflight_signal_rows", followon_ids=""), the complete read model preflight
  already uses (scripts/preflight/recs_signals_source.py); the reds are every row with source ci_rca and status open
