  action: Modify
  purpose: >-
    Deliverable Shape item 1 "HARD BLOCK recs appear as item 0 -- they block other work." becomes "... -- they block
    overlapping work." (12 bytes of prose-budget headroom; no other change, and the skill still restates no rendering
    row).
bundled_recommendations: []
followon_recs:
- rec-4441
- rec-4442
infrastructure_dependencies: []
acceptance_criteria:
- >-
  DECISIONS.md carries Decision 224 exactly as APPROVED_DECISION (number re-checked), under the 6144-byte per-entry
  cap, and Decisions 72, 73 and 217 each end with their APPROVED_ANNOTATIONS line; decisions-index.json is fresh.
  TestDecisionEntry pins the header, the five clause labels and the annotations; the verbatim text is checked at code
  review against APPROVED_DECISION.
- >-
  A source=ci_rca file_rec carrying context_v2_json is written with priority High exactly when repair_track is
  test_defect, regression_of is unset and the verified bundle stamped workflow_tier CI, else Critical, whatever
  priority was passed.
- >-
  CiRcaContext accepts repair_track and repair_track_confirmed (two values each) and requires preventive_action unless
  repair_track is test_defect.
- >-
  Stamping fixed_by_sha (update_rec closure_fix_sha or stamp_fixed_by_sha) also stamps repair_track_confirmed from the
  fix commit's diff: test_defect for a tests-only commit, product_regression otherwise, unset when unresolvable.
- >-
  scripts.ci_rca.red_overlap exits 1 for a red past the SLO, an undeterminable red file set, a selector fallback or an
  overlapping affected set; exits 0 for disjoint work, an in-SLO Track A red and a red the plan bundles; exits 2 when a
  read is unavailable; prints one JSON line; reads slo_hours from the contract and the open reds uncapped.
- >-
  Every prose surface that stated the old halt (AGENTS.md, the planning, overseer and orient skills, orient.md,
  overseer.md, overseer-dispatch never_overrides, the preflight print, ci-rca-lifecycle trigger_scope) states the
  Decision 224 rule within its prose budget, and AGENTS.md keeps the three literals the pr-ci-red contract pins.
- >-
  ops_recommendations.yaml declares the ci_rca priority rule in its priority derivation with realized false, and the
  generated field_semantics.yaml is byte-identical (no Lambda artifact changes).
- The two follow-on recs (rec-4441, rec-4442) exist and are open.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The schema takes the track fields and makes preventive_action conditional; is_track_a and priority follow the predicate.
  command: bin/venv-python -m pytest tests/ops_data_portal/test_ci_rca_repair_track.py::TestRepairTrack -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A product_regression context validates without preventive_action -> fix the model validator, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-repair-track-schema
- step: 2
  phase: pre-deploy
  action: >-
    The cross-check stamps workflow_tier from the verified bundle; file_rec strips caller-supplied portal keys and
    writes the derived priority; update_rec stamps the confirmed track.
  command: >-
    bin/venv-python -m pytest tests/ops_data_portal/test_ci_rca_repair_track.py::TestWorkflowTierStamp
    tests/ops_data_portal/test_rec_write.py::TestCiRcaPortalDerivations -q
  expected: Exit 0, every node passes. Red before because the file and the class do not exist.
  expected_literals: []
  fix_if: >-
    A caller-supplied workflow_tier yields High -> pop the portal-owned keys before the cross-check; a passed
    --priority survives -> derive after the cross-check.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-priority-derived-from-track
- step: 3
  phase: pre-deploy
  action: The confirmed track is computed from the fix commit; stamp_fixed_by_sha stamps it; a re-track re-derives priority.
  command: >-
    bin/venv-python -m pytest tests/ops_data_portal/test_closure_gate.py::TestConfirmedRepairTrack
    tests/test_ci_rca_lifecycle_correct_rec_context.py::TestCorrectRecContext::test_retrack_rederives_priority -q
  expected: Exit 0, every node passes. Red before because the class and the node do not exist.
  expected_literals: []
  fix_if: >-
    A mixed commit reads test_defect -> the prefix test must hold for every changed path; a re-tracked row stays High
    -> correct_rec_context must set the derived priority in row_updates.
  hermetic: true
  graduation: graduate
  graduation_check_id: ci-rca-confirmed-repair-track
- step: 4
  phase: pre-deploy
  action: The overlap evaluator applies the ordered rules.
  command: bin/venv-python -m pytest tests/ci_rca/test_red_overlap.py::TestEvaluate -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: A test_defect red past its SLO clears -> the SLO rule must run before the track exemption.
  hermetic: true
  graduation: graduate
  graduation_check_id: red-overlap-ordered-rules
- step: 5
