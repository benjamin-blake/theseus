schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: red-main-recovery-policy
intent: >-
  Re-price red-main recovery under Decision 73's optimistic merge, so a red costs what its repair needs and no more: one
  Decision (224) amending Decisions 72, 73 and 217 splits reds into a tests-only fast lane and product regressions,
  narrows the halt to work that overlaps the red, bounds recovery with an agent-owned repair SLO (revert permitted for
  product regressions), and owes a preventive only for a recurring failure class; the build lands the code that
  computes the track, the priority, the confirmed track, and the overlap and SLO verdicts, plus every prose surface
  that states the old halt.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-red-main-recovery-policy.yaml
phase: >-
  ci_rca (soft-warn category): the red-main recovery policy Benjamin approved on 2026-10-18 in the rec-4427 thread
  (step 2 of that thread's proposal). Related tier item T1.13 (CI-RCA methodology contract); closes no exit criterion
  (its open criteria c2, c3, c5 and c9 are strict-mode, observability, S3 roundtrip and category integrity).
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Insert APPROVED_DECISION (execution_steps) as a new entry directly after Decision 223's entry, numbered with the
    next free Decision number (224 at planning; re-check the highest live header at implement time and renumber every
    "224" in this plan's texts on a race). Append the three APPROVED_ANNOTATIONS as the last line of Decision 72's,
    Decision 73's and Decision 217's bodies (after each entry's existing final annotation or block, before its "---").
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write after the DECISIONS.md edit; never hand-edited.
- file: AGENTS.md
  action: Modify
  purpose: >-
    Replace the Merge protocol's "Post-merge full-tier failure on main" bullet with APPROVED_AGENTS_BULLET (271 bytes
    against the old 291; the root ambient load set had 10 bytes of headroom at planning, config/prose_budgets.yaml
    S1). It keeps the literals "forward-fix, never auto-revert", "source=ci_rca" and "priority=critical" that
    tests/test_pr_ci_red_protocol_contract.py and the agents-md-contradiction-resolved registry shard pin. No other
    AGENTS.md line changes.
- file: .claude/agents/scheduled/ci-rca.md
  action: Modify
  purpose: >-
    Step 4: add "repair_track" to the JSON object and the APPROVED_CI_RCA_STEP4 paragraph after the unobserved_steps
    paragraph. Step 5: the --priority line becomes "--priority Critical \" with the APPROVED_CI_RCA_STEP5 sentence under
    the Requirements list. Hard Rules: the "--priority Critical (capital C)" rule gains the clause that the portal
    re-derives priority from repair_track. The literal "--priority Critical" stays (tests/test_ci_rca_prompt_contract.py
    pins it). The Hard Rules sentence "The human reviews and acts on it via `/plan`." becomes "A session acts on it via
    `/plan`, or the fast lane for a test_defect red (Decision 224)."; "autonomous fix" stays.
- file: scripts/executor/rec_write_guidance.py
  action: Modify
  purpose: >-
    The ci_rca schema_fields guidance gains a "repair_track" entry ("str enum: test_defect | product_regression.
    test_defect only when merged product behaviour is right and the corrective changes only tests/**; absent or unsure
    reads as product_regression; the portal derives priority from it (Decision 224).") and the "preventive_action"
    entry becomes "str, 100-800 chars; omit when repair_track is test_defect (none owed, Decision 224); required
    otherwise."
- file: scripts/ops_portal/ci_rca_schema.py
  action: Modify
  purpose: >-
    CiRcaContext gains repair_track and repair_track_confirmed, both Optional[str]=None with
    pattern ^(test_defect|product_regression)$ (repair_track agent-authored; repair_track_confirmed stamped at fix
    time, never agent-authored, mirroring the fixed_by_sha comment block), and workflow_tier, Optional[str]=None with
    no pattern (portal-derived from the verified bundle's workflow_to_tier_resolution, never agent-authored).
    preventive_action becomes Optional[str]=None keeping min_length=100/max_length=800, and a model validator raises
    "preventive_action is required unless repair_track is test_defect" when it is None and repair_track !=
    "test_defect". Two new pure functions: is_track_a(context) -> bool, true only when repair_track == "test_defect",
    regression_of is unset and workflow_tier == "CI" (the taxonomy tier of the CI and Main Canary workflows); and
    derive_ci_rca_priority(context) -> str, "High" when is_track_a(context) else "Critical". No schema_version
    ceiling raise.
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: >-
    file_rec: for every source=ci_rca write carrying context_v2_json, first pop the portal-owned keys workflow_tier
    and repair_track_confirmed from the caller's context (a caller can never supply them); then, immediately after
    the existing _run_ci_rca_cross_check(context_v2_json) call (so the verified bundle's workflow_tier is stamped),
    set fields["priority"] = derive_ci_rca_priority(context_v2_json) before the write (legacy no-context ci_rca
    writes are unchanged). The
    function lives in the ops_portal submodule; the facade gains only the call (Decision 124). update_rec: when the closure_stamps carry fixed_by_sha and the merged record's source is ci_rca, also
    stamp repair_track_confirmed = confirmed_repair_track(closure_fix_sha, ROOT) into the same context blob when it is
    not None. Net growth stays inside the 500-SLOC limit (466 SLOC at planning).
- file: scripts/ops_portal/closure_gate.py
  action: Modify
  purpose: >-
    New confirmed_repair_track(fix_sha, root) -> Optional[str]: None when changed_files(fix_sha, root) is None or
    empty; "test_defect" when every changed path starts with a module constant _TEST_PATH_PREFIX = "tests/" (pinned
    equal to recovery_policy.test_path_prefix by TestContractPolicy, so the module reads no YAML); else
    "product_regression". Reuses changed_files, so the module still makes its single read-only git diff-tree call.
- file: scripts/ops_portal/ci_rca_lifecycle.py
  action: Modify
  purpose: >-
    stamp_fixed_by_sha also stamps ctx["repair_track_confirmed"] = confirmed_repair_track(fixed_by_sha, ROOT) when it
    is not None, in the same update_rec write (the ci.yml trailer-closure path and the manual route both reach it).
    correct_rec_context re-derives priority: after merging context_updates it sets row_updates["priority"] =
    derive_ci_rca_priority(merged), overriding a caller's priority, so a re-tracked red changes priority in the same
    write.
- file: tests/test_ci_rca_lifecycle_correct_rec_context.py
  action: Modify
  purpose: >-
    New test TestCorrectRecContext::test_retrack_rederives_priority: correcting repair_track from test_defect to
    product_regression with a preventive_action writes priority Critical in the same write, and a caller-passed
    priority in row_updates does not survive.
- file: scripts/ops_portal/ci_rca_runtime.py
  action: Modify
  purpose: >-
    _run_ci_rca_cross_check: next to the existing fingerprint/failure_category stamps from the verified bundle, stamp
    context_v2_json["workflow_tier"] = bundle["workflow_to_tier_resolution"] when present. A rec filed with no
    verified bundle carries no workflow_tier, so is_track_a is false for it (fail closed). No other change (403 SLOC).
- file: scripts/ci_rca/red_overlap.py
  action: Create
  purpose: >-
    The Decision 224 cl.3-4 evaluator, per APPROVED_RED_OVERLAP (execution_steps): a pure evaluate() over (reds, work
    paths, now, slo_hours, selector) plus a CLI (--plan PATH | --files PATH...) printing one JSON verdict and exiting
    0 clear, 1 blocked, 2 unavailable. Reads slo_hours from docs/contracts/ci-rca-lifecycle.yaml's recovery_policy
    (the single source), never a literal, and the open reds from one complete preflight_signal_rows read (never the
    LIMIT 5 ci_rca_open verb, Decision 215).
- file: tests/ci_rca/test_red_overlap.py
  action: Create
  purpose: >-
    Classes TestEvaluate (each ordered rule, with an injected selector: past-SLO blocks regardless of track or overlap;
    in-SLO test_defect clears; empty red file set blocks; selector fallback or full_suite_forced blocks; shared affected
    path blocks and names it; disjoint sets clear; a test_defect red on a non-CI workflow_tier is not exempt),
    TestInputs (a reader exception -> exit 2; six open reds are all evaluated; an id the report lists as
    likely_resolved does not block; a missing or not-ok report excludes nothing; a closed red is ignored), TestCli (--plan reads scope with Create->A, Modify->M, Delete->D; --files; JSON shape; exit codes) and
    TestPolicySource (slo_hours comes from the contract: a monkeypatched contract value changes the verdict; a
    missing or non-positive value exits 2). No network: the reader and the selector are injected.
- file: tests/ci_rca/test_recovery_policy_surfaces.py
  action: Create
  purpose: >-
    Pins, read from the files: TestDecisionEntry (the Decision 224 header and its five bold clause labels exist, and
    Decisions 72, 73 and 217 each carry an "Amended by Decision 224" line); TestContractPolicy (recovery_policy carries
    decision 224, a positive int slo_hours, test_path_prefix equal to closure_gate._TEST_PATH_PREFIX, the evaluator
    path, which exists, the
    preventive window_days and threshold, and procedure.fast_lane_repair; ops_recommendations.yaml's priority
    derivation names derive_ci_rca_priority and Decision 224 with realized still false; implement-scope-boundary.yaml's
    validate_weakening_dispositions row note names the fast lane and rec-4442); TestProseSurfacesPointAtTheCheck (AGENTS.md's Merge protocol, the planning
    skill, the overseer skill, .claude/commands/overseer.md, overseer-dispatch never_overrides and
    .claude/commands/orient.md each name red_overlap or Decision 224, and none still says "/plan cannot scope
    unrelated work", "an open critical rec, or a null list", "halt-on-open-ci_rca is a hard dispatch block" or
    "before dispatching any new slice"; AGENTS.md still carries the three literals the pr-ci-red contract pins).
- file: tests/ops_data_portal/test_ci_rca_repair_track.py
  action: Create
  purpose: >-
    A new file (test_ci_rca_schema.py is at 425 SLOC and test_ci_rca_runtime.py at 436). Class TestRepairTrack: both
    track fields accept the two values and reject others; preventive_action may be omitted only when repair_track is
    test_defect (absent track and product_regression both raise without it); is_track_a and derive_ci_rca_priority
    are true/High only for test_defect with no regression_of and workflow_tier "CI". Class TestWorkflowTierStamp
    (drives _run_ci_rca_cross_check with bundle fixtures built in this file, never imported from a test module): a
    verified bundle with workflow_to_tier_resolution "CI" stamps workflow_tier "CI"; one with "unknown" (what
    resolve_workflow_tier returns for not_a_gate workflows) stamps "unknown"; an absent bundle stamps nothing.
- file: tests/ops_data_portal/test_rec_write.py
  action: Modify
  purpose: >-
    New class TestCiRcaPortalDerivations, using the file's existing writer/reader fakes. file_rec on a source=ci_rca
    write with context_v2_json writes High for test_defect with a bundle-stamped workflow_tier CI, and Critical for
    product_regression, an absent track, a regression_of filing, test_defect with workflow_tier "unknown" or absent,
    and test_defect whose caller supplied "workflow_tier": "CI" with no bundle (the key is stripped), whatever
    --priority was passed; a legacy ci_rca write without context_v2_json keeps its passed priority. update_rec with
    closure_fix_sha on a ci_rca rec stamps repair_track_confirmed (confirmed_repair_track monkeypatched).
- file: tests/ops_data_portal/test_closure_gate.py
  action: Modify
  purpose: >-
    New class TestConfirmedRepairTrack over an injected git fixture repository: a tests-only commit -> test_defect; a
    commit touching scripts/ and tests/ -> product_regression; an unresolvable sha -> None; and stamp_fixed_by_sha
    writes repair_track_confirmed into the context blob in the same update_rec call (fakes as the file already uses).
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: >-
    print_ci_rca_recs: both "[HARD BLOCK] /plan cannot scope unrelated work while these recs ..." lines become
    "[HARD BLOCK] overlapping work blocks, and all new work once a red is past its SLO: run
    bin/venv-python -m scripts.ci_rca.red_overlap --plan <plan> (Decision 224)." (each may wrap to two lines under
    the 127-character limit), and the abstention-review advisory's "triaged under Decision 73 L5 into a hard block"
    becomes "triaged under Decisions 73 and 224 into an overlap block". No other change (481 SLOC at planning; at
    most +3).
- file: tests/session/preflight/test_correlation.py
  action: Modify
  purpose: >-
    New class TestRedOverlapPointer: the HARD BLOCK render, on both the correlation and the backward-compatible
    paths, carries "scripts.ci_rca.red_overlap" and no longer says "cannot scope unrelated work"; the abstention
    advisory names Decision 224.
- file: tests/test_ci_rca_prompt_contract.py
  action: Modify
  purpose: >-
    New class TestRepairTrackInstructions: the agent text names "repair_track" with both values, says "--priority
    High" applies to test_defect, says preventive_action is omitted for test_defect, and names the fast lane in the
    Hard Rules; the existing "--priority Critical" and "autonomous fix" pins stay.
- file: tests/test_rec_write_guidance.py
  action: Modify
  purpose: >-
    New module-level test test_ci_rca_guidance_names_repair_track: the ci_rca guidance names repair_track with both
    values and the test_defect exemption for preventive_action.
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: >-
    Add APPROVED_RECOVERY_POLICY as a top-level recovery_policy block and APPROVED_FAST_LANE as
    procedure.fast_lane_repair; add projection_fields repair_track and repair_track_confirmed, each with enum
    [test_defect, product_regression] (validate_ci_rca_lifecycle_projection derives the enum obligation from the live
    model); rewrite trigger_scope.default_branch_disposition to APPROVED_DISPOSITION; append one amendment_log entry
    (change_class field_add, semantic_break false) naming this plan and Decision 224.
- file: docs/contracts/ops_recommendations.yaml
  action: Modify
  purpose: >-
    Class A, always-ask (approved with the Decision text). fields.priority.derivation gains the key
    source_rules with one entry, APPROVED_PRIORITY_NOTE; realized stays false, source_priority_map is unchanged, and
    no dq_intent leg changes. Append one amendment_log entry (semantic_break false, change_class governance_note_add,
    summary and migration_story naming this plan and Decision 224, and stating that the generated field_semantics.yaml
    is unchanged). This keeps the contract the single rule source (Decision 210 cl.3) and gives T2.29 c1's future
    default the ci_rca rule to keep.
- file: docs/contracts/implement-scope-boundary.yaml
  action: Modify
  purpose: >-
    Class D. The validate_weakening_dispositions row's note keeps "Diffs that flip no plan are not gated; the report
