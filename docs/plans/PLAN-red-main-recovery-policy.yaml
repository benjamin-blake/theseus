  action: The CLI fails closed on unreadable inputs, prints one JSON line, and reads the SLO from the contract.
  command: >-
    bin/venv-python -m pytest tests/ci_rca/test_red_overlap.py::TestInputs tests/ci_rca/test_red_overlap.py::TestCli
    tests/ci_rca/test_red_overlap.py::TestPolicySource -q
  expected: Exit 0, every node passes. Red before because the file does not exist.
  expected_literals: []
  fix_if: An unavailable read exits 0, or a selector banner reaches stdout -> exit 2, and redirect the selector's stdout.
  hermetic: true
  graduation: graduate
  graduation_check_id: red-overlap-fails-closed
- step: 6
