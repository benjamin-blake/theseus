  73: > **Amended by Decision 224 (DATE):** Clause 3's fixed priority="critical" becomes track-derived (High for a tests-only repair on a CI-tier workflow), and a manual revert PR is a permitted Track B corrective outside terraform/** and governed deploy paths (automated revert stays excluded). Clause 3's L6 pause and clause 4's plan-time block become the red_overlap overlap block; clause 4 as written now applies only to a red past its repair SLO. Clause 5's rec -> plan -> implement recovery stands for Track B, with Track A on the fast lane (Decision 224 cl.1-4). This supersedes the Decision 217 line above for clause 4.
  217: > **Amended by Decision 224 (DATE):** Clause 1's overlap block is pulled forward to executor concurrency 1 by the red-window-growth condition (Decision 224 cl.3: rec-4427's 11.7-hour red window at about 11 merges a day), so the concurrency-raised trigger no longer gates clause 1; clauses 2-8 are unchanged.
