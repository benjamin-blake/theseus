    map keeps exactly one residual row), and no other text changes. Append an amendment_log entry in the file's shape.
- file: docs/contracts/overseer-dispatch.yaml
  action: Modify
  purpose: >-
    autonomy_tiers.proceed_with_notice.never_overrides becomes APPROVED_NEVER_OVERRIDES, plus an amendment_log entry
    in the file's existing shape naming this plan and Decision 224.
- file: .claude/skills/overseer/SKILL.md
  action: Modify
  purpose: >-
    The Behavioural Invariants comment on halt_on_open_ci_rca becomes "# halts dispatch the red_overlap check blocks
    (Decision 224)" (key and value unchanged), the "Halt-on-open-ci_rca (Decision 73)" paragraph becomes
