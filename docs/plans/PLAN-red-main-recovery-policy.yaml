  reader client is constructed lazily and injectable for tests (src.common.ducklake_reader_client.make_reader); no
  other network.
- |-
  APPROVED_RECOVERY_POLICY (a new top-level block in docs/contracts/ci-rca-lifecycle.yaml, after closure_obligation):
  # Decision 224: red-main recovery. The values code reads and their meaning live here; the
  # rationale lives in the Decision (Decision 86).
  recovery_policy:
    decision: 224
    slo_hours: 4
    test_path_prefix: "tests/"
    tracks:
      test_defect: >-
        Track A. The corrective changes only paths under test_path_prefix and leaves merged product
        behaviour as it is (a stale expected value, a missing test under a coverage floor). The
        diagnosis counts (is_track_a) only on a test-bearing workflow, workflow_tier "CI" from the
        verified bundle (CI and Main Canary), with regression_of unset: then priority is High and the
        red is exempt from the halt inside its SLO. No preventive_action owed; repaired through
        procedure.fast_lane_repair.
      product_regression: >-
        Track B. Every other corrective, and the reading of an absent or unsure repair_track. Priority
        Critical. Repaired through /plan, or through a manual revert PR of the culprit merge when the
        fix is not obvious and the culprit touched neither terraform/** nor a governed deploy path
        (docs/contracts/deploy-paths.yaml); the revert PR also lands the Decision 186 closure artifact
        (for example a test pinning the culprit's failure), since the revert alone changes no artifact
        file. preventive_action stays mandatory until the class tally (rec-4441) lands.
    priority: >-
      scripts.ops_portal.ci_rca_schema.derive_ci_rca_priority (High iff is_track_a, else Critical),
      applied in file_rec after the bundle cross-check to every source=ci_rca write carrying
      context_v2_json; a passed --priority never survives it. Declared in ops_recommendations.yaml's
      priority derivation (Decision 210 cl.3).
    preventive:
      window_days: 90
      threshold: 2
      class_key: >-
        The failing check plus its escape attribution (escape_mode, escape_class) from the verified
        bundle, defined against the fingerprint chain and the flaky quarantine (Decision 142).
        Unrealized until rec-4441; the values are the Decision 224 cl.5 parameters it will read.
    confirmed_track: >-
      scripts.ops_portal.closure_gate.confirmed_repair_track over the fix commit's diff-tree, stamped
      as repair_track_confirmed wherever fixed_by_sha is stamped; an unresolvable sha leaves it unset.
      Only the confirmed value may feed a tally.
    halt:
      evaluator: scripts/ci_rca/red_overlap.py
      rule: >-
        An unresolved red (preflight's ci_rca_unresolved_recs, plus any open red filed after the
        report) blocks new work by the first matching rule: past slo_hours from filing, or an
        unparseable filing time, blocks all work; an in-SLO test_defect red blocks nothing; an
        undeterminable red file set, a selector fallback or full_suite_forced blocks; otherwise the
        work's and the red's affected sets (Decision 135 channels: paths, selected and deferred) must
        not intersect.
      exit_codes: "0 clear, 1 blocked, 2 unavailable (callers treat 2 as blocked)"
      callers: "/plan Step 8 Related-Work Check; the overseer before an /implement dispatch"
      merge_pause: "Decision 73 cl.3's L6 pause is unbuilt; when built it applies this same rule."
    slo_clock: >-
      From the rec's created_timestamp. A build that reaches handoff during a red still needs a green
      full tier (Decision 163), so it waits for the repair; the SLO bounds that wait.
