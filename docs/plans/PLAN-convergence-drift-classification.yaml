schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "convergence-drift-classification"
intent: >-
  Stop the sandbox convergence record red-latching on a delta that is not drift, and make every
  surface that reports a red record name the cause it actually measured -- so an operator-sanctioned
  split-apply no longer blocks the deployment pipeline and no longer sends agents hunting a rogue
  writer that does not exist.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-convergence-drift-classification.yaml
phase: T2.47
scope:
  - file: scripts/convergence_health/classify.py
    action: Create
    purpose: >-
      Classifier delegate. Parses `terraform show -json` output and returns a verdict from the
      exhaustive three-member set. PRECEDENCE IS FAIL-CLOSED AND EXPLICIT: resource_drift non-empty
      -> out_of_band_drift, WHATEVER resource_changes holds (both-non-empty is a drift, never a
      codification lag); resource_drift empty AND resource_changes non-empty ->
      pending_codification; both empty -> converged; unparseable JSON -> out_of_band_drift (the
      safe default, never converged). Hosts the marker read/write helpers and the refusal-cause
      renderer both workflows call, keeping logic out of shell bodies already at their R3 ceilings
      (Decision 162) and out of the zero-headroom apply workflow (Decision 128/166).
  - file: tests/convergence_health/test_classify.py
    action: Create
    purpose: >-
      Parametrised case matrix over real plan-JSON shapes -- drift-only, changes-only, BOTH
      (precedence: drift wins), neither, and malformed -- plus a route-exhaustiveness assertion that
      no fourth verdict can be produced (Decision 158 terminal-route accounting), a
      never-writes-red assertion for the pending_codification path, a dedup-narrowing assertion, and
      a write-shape assertion that commit_sha is written top-level and never inside a marker dict.
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      Add `-out=tfplan.bin` to the existing `plan` step and pipe `terraform show -json tfplan.bin`
      into the delegate, replacing bare exit-code inference. On pending_codification write a
      non-status marker (status stays at its PRIOR value, mirroring the pending_gated / infra_error
      read-modify-write shape) and file an honestly-worded rec; on out_of_band_drift keep today's
      red-flip. Narrow the dedup invariant so it dedups TICKETING but no longer suppresses
      MEASUREMENT. Add a NEW step gated on `steps.plan.outputs.plan_ec == '0'` that self-clears a
      stale pending_codification marker and writes its durable closure stamp -- the existing
      handle-drift step is gated on plan_ec == '2' and can never run the clear.
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      Make the CONVERGENCE_RED refusal name the measured cause (red_cause, drift_reason,
      drift_run_url, drift_detected_at) and the correct acknowledge token, instead of printing only
      commit_sha -- which on a drift-flip is stale provenance merge-preserved from the last
      successful apply. The `precond` body is baselined at 36 lines and this file is at 550/550
      effective lines: the emission MUST be a delegate call, so both the file budget and the R3
      body ceiling hold without a raise marker.
  - file: scripts/ci/convergence_advisory.py
    action: Modify
    purpose: >-
      Second misattribution site. The advisory commit status asserts "last sandbox apply RED at
      {commit}" for every red record; on a drift-caused red that commit is the last SUCCESSFUL
      apply. Report the measured cause, and surface a pending_codification marker the way the
      existing pending_gated branch already does.
  - file: tests/test_convergence_advisory.py
    action: Modify
    purpose: >-
      Cover the drift-caused-red wording (must not claim the stale commit was the failing apply) and
      the pending_codification marker branch.
  - file: scripts/convergence_health/record.py
    action: Modify
    purpose: >-
      Add read_pending_codification_marker mirroring read_infra_error_marker's degrade-to-None
      contract (Decision 154), plus a red_cause derivation that reads the SAME drift markers
      scripts/ci_rca/convergence_dedup.py already discriminates on -- one authority, never a second
      divergent classifier (Decision 142).
  - file: tests/convergence_health/test_record.py
    action: Modify
    purpose: Cover the new marker reader, its malformed-input degrade path, and red_cause derivation.
  - file: scripts/convergence_health/assess.py
    action: Modify
    purpose: >-
      Let blocked-apply impact raise severity on a RED record. unapplied_backlog is already computed
      but only reaches severity on the green branch (stale_green_backlog), so a red record blocking
      three applies for 2.6h scored "low" while a green record with one unapplied commit at 2h
      scores "high". Preserve Decision 154 point 7's floor property: the infra_error floor only ever
      raises none->low and never lowers a higher value.
  - file: tests/convergence_health/test_assess.py
    action: Modify
    purpose: >-
      Pin the new red+backlog severity raise, and pin the preserved floor property (a red+backlog
      high is not lowered by a present infra_error marker).
  - file: scripts/convergence_health/escalate.py
    action: Modify
    purpose: >-
      Ticket the pending_codification episode and write the durable closure stamp on self-clear, so
      the benign case leaves a trace rather than silently reverting (Decision 55 anti-hiding).
  - file: tests/convergence_health/test_escalate.py
    action: Modify
    purpose: Cover the pending_codification file/update/close episode and the closure stamp.
  - file: scripts/convergence_health/__init__.py
    action: Modify
    purpose: Re-export the new classify surface and marker reader through the package facade.
  - file: scripts/preflight/ci_rca_signals.py
    action: Modify
    purpose: >-
      Fix the convergence-RCA-gap check, which already exists (_check_convergence_rca_gap, 30-minute
      grace) but was silenced throughout the incident. Two defects: its matcher
      (_derive_ci_rca_since) counts ANY source=ci_rca rec created after red_since, so four unrelated
      recs (rec-3802 GC guard, rec-3809, rec-3810, rec-3811 secrets baseline) satisfied it while the
      convergence red went unreported; and a source=tf_drift rec -- the one that actually tracked
      this red -- does not count as matching at all. Widen the matcher to accept the infra-signal
      sources and require the match to concern the convergence surface. Derive from the warm cache
      rows only, with NO new DuckLake named verb -- the shape _fetch_ci_rca_dispute_recs in this same
      file already adopted (Decision 88 egress invariant).
  - file: tests/session/preflight/test_ci_rca_signals.py
    action: Modify
    purpose: >-
      Pin that a tf_drift rec satisfies the convergence gap check, that an unrelated ci_rca rec no
      longer silences it, and that ci_rca_open's own membership is unchanged.
  - file: tests/test_ci_rca_convergence_dedup.py
    action: Modify
    purpose: >-
      Regression coverage for the coupling this plan constrains but does not own: assert
      convergence_dedup still resolves the drift-red cause correctly on a record that now also
      carries red_cause and a pending_codification marker (Decision 142 one-authority).
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Convergence-record marker vocabulary is this contract's owning home (Decision 77 clause 1;
      Decision 92 point 5 sole SoT). Declare pending_codification alongside pending_gated and
      infra_error, the red_cause discriminator, and the route-exhaustiveness table for the new
      state. Add the amendment_log entry its Class D drift gate requires.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      The reconcile row's heal_verb_selection tells an operator to dispatch after reviewing the rec;
      point it at the measured red_cause so the right verb is chosen from evidence. Amendment_log
      entry required.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Re-baseline every body this plan moves: drift-detect::plan (24, grows by the -out/show -json
      lines unless delegated), drift-detect::prior_status (23), drift-detect::handle-drift (89,
      shrinks on delegation), apply-sandbox::precond (36), plus the new plan_ec == '0' self-clear
      body. Decision 162 R3 ratchet; no raise marker (Decision 165).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decision 189 (drafted in this plan's context block, not deferred): drift is measured, never
      inferred from an exit code. Amends Decision 92 (the red predicate gains a measured cause and
      the drift writer gains a non-status branch) and Decision 154 (extends the marker family).
bundled_recommendations:
  - rec-3797
  - rec-3800
followon_recs:
  - rec-3838
  - rec-3839
infrastructure_dependencies:
  - >-
    ZERO Lambda artifacts affected. Verified by compute_affected_artifacts() over the full scope
    list: returns empty. An earlier draft carried src/common/ducklake_scd2_schema.py and
    src/common/ducklake_reader_client.py for a new named verb; those rows pulled in six active
    artifacts (data-pipeline, ducklake_catalog_dr, ducklake_maintenance, ducklake_maintenance_smoke,
    ducklake_reader, ducklake_writer) and their Decision 79 build/deploy/smoke obligation. The
    named-verb approach was dropped for the cache-rows derivation this file already uses, which
    needs neither src/common nor a deploy.
  - >-
    terraform/personal sandbox root: no HCL change. This plan changes only how the drift and apply
    workflows CLASSIFY and REPORT a plan result; no resource, IAM grant, or provider version moves.
  - >-
    S3 convergence record (convergence/personal/sandbox.json): gains one additive non-status marker
    (pending_codification) and one additive discriminator (red_cause). Top-level commit_sha, run_id,
    run_url, timestamp and plan_sha MUST keep their current names and nesting.
  - >-
    No terraform apply is required to land this plan; the first scheduled drift cycle after merge is
    the live exercise.
acceptance_criteria:
  - >-
    A drift cycle whose plan shows resource_changes but empty resource_drift leaves status at its
    PRIOR value, writes a pending_codification marker, and never writes red.
  - >-
    A plan carrying BOTH non-empty resource_drift and non-empty resource_changes classifies as
    out_of_band_drift, and unparseable plan JSON classifies as out_of_band_drift rather than converged.
  - >-
    A drift cycle whose plan shows non-empty resource_drift still writes status red exactly as today.
  - >-
    A pending_codification marker self-clears on a plan_ec == 0 cycle, and that self-clear writes a
    durable closure stamp rather than silently removing the marker.
  - >-
    The convergence record's top-level commit_sha, run_id, run_url, timestamp and plan_sha are
    unmoved and unnested, so reconcile_target.py still resolves a red record as actionable.
  - >-
    The apply-sandbox CONVERGENCE_RED refusal names the measured red_cause and, on a drift-caused
    red, does not present the last-successful-apply commit as the cause.
  - >-
    scripts/ci/convergence_advisory.py no longer asserts "last sandbox apply RED at {commit}" for a
    red whose cause was drift.
  - >-
    A red convergence record with a non-zero unapplied backlog escalates on impact rather than only
    on age, and a present infra_error marker never lowers that severity.
  - >-
    _check_convergence_rca_gap fires on a red convergence record tracked only by a tf_drift rec, and
    is no longer silenced by an unrelated ci_rca rec filed after red_since.
  - >-
    .github/workflows/terraform-apply-sandbox.yml is still at or below 550 effective lines, and every
    touched shell body is at or below its composite-action baseline, with no new raise marker.
  - >-
    scripts/ci_rca/convergence_dedup.py still resolves a drift-red to its tf_drift cause rec on a
    record carrying the new red_cause and pending_codification fields.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Classifier verdict matrix over real plan-JSON shapes, and the advisory surface reports the
      cause it measured rather than the last successful apply
    command: bin/venv-python -m pytest tests/convergence_health/test_classify.py tests/test_convergence_advisory.py -q
    expected: >-
      All parametrised cases pass -- drift-only, changes-only, both, neither, malformed -- plus the
      advisory wording case for a drift-caused red
    fix_if: >-
      A plan with empty resource_drift and non-empty resource_changes classifies as drift (core
      defect unfixed), or the advisory still blames the last-successful-apply commit
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-advisory-names-measured-cause
  - step: 2
    phase: pre-deploy
    action: >-
      Verdict precedence is fail-closed on the ambiguous inputs -- drift wins when both are present,
      and malformed JSON never yields converged
    command: bin/venv-python -m pytest "tests/convergence_health/test_classify.py::test_verdict_precedence_matrix" -q
    expected: Passes; both-present maps to out_of_band_drift and malformed maps to out_of_band_drift
    fix_if: >-
      Both-present maps to pending_codification (inverting the defect and masking a real drift), or
      malformed degrades to converged
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-verdict-precedence-fail-closed
  - step: 3
    phase: pre-deploy
    action: Code-behind-state must never write status red, and must preserve the PRIOR status value
    command: bin/venv-python -m pytest "tests/convergence_health/test_classify.py::test_pending_codification_preserves_prior_status" -q
    expected: Passes; the marker write leaves status at whatever it was, red or green, and never sets red
    fix_if: The marker path writes a literal green (silently clearing a real red) or writes red (reproducing the incident)
    hermetic: false
    graduation: graduate
    graduation_check_id: pending-codification-preserves-prior-status
  - step: 4
    phase: pre-deploy
    action: >-
      commit_sha stays a top-level key on every write path, and no reader of it was broken by the
      schema addition
    command: bin/venv-python -m pytest "tests/convergence_health/test_classify.py::test_commit_sha_written_top_level_never_nested" tests/convergence_health/test_record.py tests/test_reconcile_target.py -q
    expected: >-
      Passes; the written record carries commit_sha at top level, no marker dict contains it, and
      reconcile_target still resolves a red record as actionable
    fix_if: A write path nests commit_sha under a marker, silently disabling the Reconcile heal verb (Decision 183 point 1)
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-commit-sha-stays-top-level
  - step: 5
    phase: pre-deploy
    action: Severity rises on blocked-apply impact and the infra_error floor still never lowers it
    command: bin/venv-python -m pytest "tests/convergence_health/test_assess.py::test_red_backlog_raises_severity_before_age_threshold" -q
    expected: Passes; a red record with non-zero backlog scores high below the 6h age threshold, and a present infra_error marker does not lower it
    fix_if: A red record with a blocked-apply backlog still scores low, leaving the D3 severity gap open
    hermetic: false
    graduation: graduate
    graduation_check_id: red-backlog-raises-severity
  - step: 6
    phase: pre-deploy
    action: A self-cleared pending_codification episode leaves a durable closure stamp
    command: bin/venv-python -m pytest "tests/convergence_health/test_escalate.py::test_pending_codification_selfclear_writes_closure_stamp" -q
    expected: Passes; the self-clear path writes a closure stamp rather than removing the marker silently
    fix_if: The marker disappears with no trace, hiding the benign case from any later audit (Decision 55 anti-hiding)
    hermetic: false
    graduation: graduate
    graduation_check_id: pending-codification-selfclear-stamped
  - step: 7
    phase: pre-deploy
    action: The convergence gap check fires on a tf_drift-tracked red and is not silenced by an unrelated ci_rca rec
    command: bin/venv-python -m pytest "tests/session/preflight/test_ci_rca_signals.py::test_convergence_gap_fires_on_tf_drift_and_ignores_unrelated_ci_rca" -q
    expected: Passes; a tf_drift rec satisfies the match, and an unrelated ci_rca rec filed after red_since no longer suppresses the alert
    fix_if: >-
      The alert stays silent on a tf_drift-tracked red, reproducing the incident's observability gap,
      or ci_rca_open's membership changed as a side effect
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-gap-fires-on-tf-drift
  - step: 8
    phase: pre-deploy
    action: convergence_dedup still resolves a drift-red cause on a record carrying the new fields
    command: bin/venv-python -m pytest "tests/test_ci_rca_convergence_dedup.py::test_drift_red_resolves_with_red_cause_and_marker_present" -q
    expected: Passes; cause_kind=tf_drift resolution is unaffected by red_cause / pending_codification being present
    fix_if: The added fields perturb dedup, producing a second divergent classifier (Decision 142)
    hermetic: false
    graduation: graduate
    graduation_check_id: convergence-dedup-stable-under-new-fields
  - step: 9
    phase: pre-deploy
    action: The zero-headroom workflow and every touched shell body stayed within budget
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0; validate_structural_size_budget_raises, validate_sloc_limits, validate_sloc_budget_raises
      and validate_composite_action_shell_bodies all pass with no new raise marker
    fix_if: >-
      terraform-apply-sandbox.yml exceeded 550 effective lines, or plan/prior_status/precond grew past
      their R3 baselines -- move the added logic into the classifier delegate rather than raising any budget
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full presubmit before handoff
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 across the full tier
    fix_if: Any check fails -- fix on the branch before commit (handoff_policy requires a completed full run)
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: First scheduled drift cycle after merge classifies and reports correctly
    command: bin/venv-python -m scripts.convergence_health
    expected: >-
      HealthVerdict prints a status and, if a marker is present, names pending_codification with a
      measured cause rather than an unexplained red
    fix_if: The live cycle still red-latches a code-behind-state delta, or reports a cause it did not measure
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: Confirm the live convergence record still parses for every existing reader
    command: bin/venv-python -m scripts.ci.reconcile_target
    expected: Resolves a clean no-op against the live green record, with no malformed-record error
    fix_if: The additive fields broke a reader -- revert the record-shape change and re-approach additively
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: Both bundled recs reached their declared terminal statuses
    command: bin/venv-python -m scripts.sync.ops sync && grep rec-3797 logs/.recommendations-log.jsonl | grep -c closed && grep rec-3800 logs/.recommendations-log.jsonl | grep -c superseded
    expected: Both counts non-zero -- rec-3797 closed by the Resolves trailer, rec-3800 superseded by the explicit update_rec call
    fix_if: >-
      The Resolves trailer was omitted from the squash-merge body, or the rec-3800 supersede step was
      skipped -- run the portal update directly
    hermetic: false
    graduation: not-applicable
