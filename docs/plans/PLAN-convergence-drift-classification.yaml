constraints:
  - >-
    THE DELEGATE MUST STAY STDLIB-ONLY AND IN scripts/ci/. terraform-apply-sandbox.yml installs no
    Python dependencies anywhere in its 1030 lines; scripts/convergence_health/ is an eager facade
    whose import pulls yaml and boto3 (verified: importing it with those blocked raises ImportError,
    while scripts.ci.convergence_advisory imports clean). Placing the delegate in
    convergence_health/ would fail closed on the sole hard block, and the only escapes -- adding a
    dependency install to a file at 550/550, or raising a budget -- are both forbidden below.
  - >-
    UNVERIFIED PREMISE, stated so no implementer mistakes it for settled: the classifier assumes
    terraform's `resource_drift` is a COMPLETE record of out-of-band change. Terraform 1.10.5 filters
    drift reporting by plan relevance, so an incomplete resource_drift alongside a non-empty
    resource_changes would classify as pending_codification and NOT latch red -- a fail-OPEN
    narrowing of the sole hard block. Decision 119 forbids verifying this locally. The bound below is
    the mitigation; Decision 154 is the governing precedent for narrowing this block with itemised
    reversal conditions.
  - >-
    BOUND THE BENIGN BRANCH: a pending_codification marker carries first_seen and MUST escalate to
    red once it has not self-cleared within the bounded age (2h, matching
    STALE_GREEN_BACKLOG_THRESHOLD_HOURS). A misclassified real drift must never sit indefinitely
    under a benign marker.
  - >-
    first_seen IS WRITE-ONCE -- set with setdefault and PRESERVED across every subsequent marker
    write; only auxiliary fields (last_seen, run_url) refresh. This is the ONE field where the
    "mirror the precedent verbatim" instruction does NOT apply: pending_gated and infra_error both
    overwrite their routed_at unconditionally (write-convergence-record/action.yml:143 and :177),
    and the drift workflow runs hourly (cron '17 * * * *'), so a refreshed first_seen would cap the
    marker's measured age at ~1h and the 2h bound above could NEVER fire -- the mitigation would be
    inert while reading as enforced. Mirror instead the write-once idempotence of
    pending_gated.drift_flagged_at at terraform-drift.yml:313-318.
  - >-
    STRICTLY ADDITIVE record schema. Top-level commit_sha, run_id, run_url, timestamp and plan_sha
    must not move or nest. reconcile_target.py:87-96 treats a red record with no top-level
    commit_sha as malformed and non-actionable, silently disabling the Reconcile heal verb;
    aws_infra.py:140 and convergence_health/record.py:102 read the same field.
  - >-
    NO third status value. Every consumer is red-vs-not-red binary and the safety-critical one --
    terraform-apply-sandbox.yml's `if [ "$STATUS" != "red" ]` -- FAILS OPEN, admitting the apply.
    Ten measured readers depend on this. Use a non-status marker, as pending_gated and infra_error
    already do.
  - >-
    The marker write preserves the PRIOR status value (read-modify-write with read-back verified
    against PRIOR_STATUS, never against a literal). Writing a literal green would let a drift cycle
    silently clear a real red.
  - >-
    DO NOT WIDEN _derive_ci_rca_since. It mirrors the ci_rca_since named verb and is pinned by
    tests/test_session_preflight_cache_serving.py::test_ci_rca_since_equivalence (Decision 84 I-3),
    and is shared with _check_ci_rca_liveness. Add a new private predicate for the convergence
    surface instead. No new DuckLake named verb and NO src/common/ file in scope -- either would
    reinstate the six-artifact Decision 79 obligation.
  - >-
    scripts/preflight/ci_rca_signals.py is at 472/500 SLOC and unregistered. If the new predicate
    crosses 500, DECOMPOSE into a facade package (Decision 80/104/124 pattern, Decision 128); never
    seed a budget raise and never run --update-sloc-budgets to absorb it.
  - >-
    .github/workflows/terraform-apply-sandbox.yml is at 550/550 effective lines, and the shell bodies
    this plan touches are baselined at plan=24, prior_status=23, handle-drift=89, precond=36.
    Decompose into the delegate; do NOT add a raise marker to either budget file (Decision 128/166,
    and Decision 165 requires an authorizing Decision for any raise).
  - >-
    red_cause must derive from the SAME drift markers scripts/ci_rca/convergence_dedup.py already
    discriminates on, or that module must read the new field. One authority, never two classifiers
    that can diverge (Decision 142).
  - >-
    Preserve Decision 154 point 7's floor property exactly: the infra_error floor raises none->low
    and never overrides a higher value.
  - >-
    Decision 154 point 6's anti-masking accounting rests on stale_green_backlog firing at ~2h on a
    green record. The marker design keeps status unchanged, so that trigger stays live -- do not gate
    it behind the new marker.
  - >-
    The self-clear must write a durable closure stamp, never silently revert the record (Decision 55
    anti-hiding).
  - >-
    Per Decision 119, terraform/personal cannot be locally init'd on CC-web. No VP step may run
    terraform init/plan/apply locally; CI is the authoritative verifier.
  - No rescue agents or workaround loops (Decision 55).
