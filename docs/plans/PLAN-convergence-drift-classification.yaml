rollback: >-
  The record-shape change is purely additive, so a rollback is a code revert with no data migration:
  existing readers ignore unknown keys, and a stale pending_codification marker left behind is inert
  once the code that reads it is gone. The drift workflow's classification can be reverted to the
  bare exit-code branch independently of the reporting changes in apply-sandbox and
  convergence_advisory, since they share only the read-side delegate.
