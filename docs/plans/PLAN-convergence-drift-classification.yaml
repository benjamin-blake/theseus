constraints:
  - >-
    STRICTLY ADDITIVE record schema. Top-level commit_sha, run_id, run_url, timestamp and plan_sha
    must not move or nest. reconcile_target.py:87-96 treats a red record with no top-level
    commit_sha as malformed and non-actionable, silently disabling the Reconcile heal verb;
    aws_infra.py:140 and convergence_health/record.py:102 read the same field.
  - >-
    NO third status value. Every consumer is red-vs-not-red binary and the safety-critical one --
    terraform-apply-sandbox.yml's `if [ "$STATUS" != "red" ]` -- FAILS OPEN, admitting the apply.
    Ten measured readers depend on this. Use a non-status marker, as pending_gated and infra_error
    already do.
  - >-
    The marker write preserves the PRIOR status value (read-modify-write with read-back verified
    against PRIOR_STATUS, never against a literal). Writing a literal green would let a drift cycle
    silently clear a real red.
  - >-
    NO new DuckLake named verb, and NO src/common/ file in scope. Both would pull six active Lambda
    artifacts into Decision 79's build/deploy/smoke class for a one-predicate observability fix.
    Derive from the warm cache rows, as _fetch_ci_rca_dispute_recs already does (Decision 88).
  - >-
    .github/workflows/terraform-apply-sandbox.yml is at 550/550 effective lines, and the shell bodies
    this plan touches are baselined at plan=24, prior_status=23, handle-drift=89, precond=36.
    Decompose into the delegate; do NOT add a raise marker to either budget file (Decision 128/166,
