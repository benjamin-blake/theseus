work_areas: []
rollback: >-
  Fully reversible with no infrastructure state to unwind, because nothing is provisioned. Revert
  the PR: the two apply workflows lose their record-apply-event step (the apply chain is otherwise
  byte-identical, since the step is additive, always-run and sits after the anchor), and
  convergence-health.yml loses its third step (the two existing sensors are untouched). Already
  written event objects are inert -- nothing reads them once ratchet_review.py is gone; delete the
  apply-events/personal/ prefix at leisure or leave it. Any open authority_ratchet_review rec is
  closed via the portal with a resolution naming the revert. The convergence record, the
  authority budget, the guard and every IAM policy are untouched by both the change and the
  revert, so there is no ordering hazard of the Decision 156 kind.
