    11 and 12 are built to reject.
  - >-
    REJECTED ALTERNATIVE (recorded because Decision 100 requires showing the managed-service-native
    primitive was considered): the data-lake bucket IS versioned, so the convergence record's S3
    object-version history is technically a per-apply journal already. Rejected on evidence: (i)
    PlatformDev has no s3:ListBucketVersions -- confirmed live this session with an explicit
    AccessDenied -- and neither identity's policy grants it, so reading it would need the IAM
    change this plan otherwise avoids entirely; (ii) the record carries no change-class field, so
    the versions answer "when did we apply" but never "which class"; (iii) noncurrent-version
    retention is a bucket lifecycle concern outside this plan's control, so the history is not a
    durable substrate. A purpose-built append-only journal at its own prefix is the correct shape.
  - >-
    FRAME CHALLENGE (Decision 75, plan-critique Phase 2b) -- the second rejected alternative, and
    the one a native-primitive reviewer will reach for first. Q1/Q3 asked whether a
    platform-native primitive could absorb the journal instead of an S3 object: the obvious
    candidate is CloudWatch custom metrics with a change-class DIMENSION, which is purpose-built
    for counting incident-free events per dimension and retains 15 months natively. REJECTED on
    three grounds, the first decisive: (i) `cloudwatch:PutMetricData` is NOT granted to
    github_ci_apply -- its identity policy carries only PutMetricAlarm/DeleteAlarms/TagResource/
    UntagResource scoped to agent-platform-*/ducklake-* alarm ARNs plus Describe*/List* reads
    (terraform/bootstrap/github_ci_apply.tf), so this design costs a bootstrap IAM change and a
    human-gated apply, which is exactly the cost the S3 route avoids; (ii) reading it back needs
