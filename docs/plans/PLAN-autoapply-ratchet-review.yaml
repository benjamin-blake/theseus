    Create scripts/convergence_health/ratchet_review.py -- declared_classes(budget_path),
    read_apply_events(s3_client, prefix, since_days), build_ledger(events, declared, now),
    ratchet_findings(ledger, threshold, unmeasured_days), find_open_ratchet_review_rec(open_recs),
    _build_ratchet_rec_fields(findings, ledger), detect_ratchet_review(...) with the
    file/update/close branches mirroring detect_prod_code_drift. All external dependencies
    injected.
  - >-
    Export the new surface from scripts/convergence_health/__init__.py and add
    main_ratchet_review + the --ratchet-review dispatch branch to
    scripts/convergence_health/__main__.py, mirroring the --prod-drift shape exactly.
