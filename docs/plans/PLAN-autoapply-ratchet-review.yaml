    cannot carry run_id / commit_sha / plan context, so the rec the review files would name a
    count with no evidence trail -- the opposite of actionable. Q2 (decomposition boundary): emit
    and review are deliberately separate units with separate triggers, matching the two existing
    code-drift sensors. Q4/Q5 (inherited assumptions / newer tooling): the ratchet criteria come
    from Decision 92 pt5 as WIDENED by Decision 144 (2026-07-22, nine days old), so nothing here
    rests on a stale premise; the newest relevant capability is the composite-action consolidation
    landed by T2.46, and this plan uses it rather than duplicating steps across call sites.
  - >-
    WAREHOUSE-BOUNDARY SCOPING (decision-scout NOTE on Decision 84, resolved here rather than
    deferred). Decision 84 I-1 makes DuckLake the sole OPS-STORE backend -- it scopes to the ops_*
    entity tables, not to CD control-plane evidence. Decision 92 pt2 already ratifies a durable S3
    object as the apply chain's integrity anchor, and the deploy-records/ JSON channel is the same
    class. This journal is deliberately that class: pipeline evidence written by the pipeline
    identity, append-only and immutable, never an ops_* entity and never read by any ops read
    path. The review's OUTPUT -- the recommendation -- does go through the warehouse, via the ops
    portal, exactly as the two existing sensors' output does. Building it as a real ops_ table
    instead would require a ducklake_writer verb, a Class A contract, a field_semantics
    regeneration and a Fable escalation for a NEW table -- an L-effort programme, not this
    criterion. FORWARD PATH, filed as a follow-on rec rather than a Decision: revisit migrating
    the journal into the warehouse when telemetry re-lands on DuckLake (Decision 84 Phase 4 /
    T2.36), at which point the append-only event grain here maps directly onto Decision 96/97's
    telemetry standard (event-time partitioned, insert-once, no SCD2 envelope, ULID identity).
  - >-
    DATA-MODEL ASSESSMENT (no table is created, but the grain is stated because the journal is a
    warehouse-write-path candidate). Grain: ONE OBJECT PER APPLY ATTEMPT at a guard-bearing job
    (key run_id + job). Write mode: append_only -- insert-once, never mutated, no current
    projection, no SCD2 envelope (Decision 96 cl.3). Identity: run_id + job, both minted by
    GitHub Actions at the boundary, never client-side. Partitioning: the UTC date sub-prefix is
    the event-time partition (Decision 96 cl.1 shape; CD.9's partition-every-table rule is
    honoured in spirit at the object grain). No merge key, because nothing merges. Reject-CRUD:
    satisfied -- there is no update path, no delete path and no one-row-per-entity mutation. Fable
    escalation NOT triggered: no new table, no new identity scheme, no merge_key.
  - >-
    ANTI-VACUITY DESIGN, and why it is load-bearing here. The orchestrating session found NINE
    instances in this repo of one defect class: a control textually present, passing its own
    tests, and structurally unable to fire in the case it was written for (see rec-2926, which
    generalises the fail-on-revert differential admission oracle in
    scripts/verification_graduation.py, and rec-2925, which bans reaching a branch by patching the
    module's own constants). A periodic review is an unusually easy place to reproduce it. Three
    structural defences are built in rather than tested for after the fact: (1) the declared-class
    roster is READ from authority_budget.json, so it can never be empty while the budget exists;
    (2) `unmeasured` is a first-class finding, so an empty journal produces a rec instead of
    silence -- silence is not a reachable output of this review; (3) a classification failure
    emits the explicit `classification_error` class rather than an empty list, so a swallowed
    error surfaces in the ledger. VP steps 3, 4 and 5 are the derivation oracles: each is
    constructed to FAIL if the surfacing were empty or hardcoded, and each is graduate-eligible so
    the fail-on-revert differential actually runs against it.
  - >-
    DISCLOSED SCOPE LIMITATION (stated rather than hidden): the gated-apply and
    gated-apply-reconcile jobs are NOT instrumented. They apply a previously reviewed plan.bin and
    produce no plan.json for the classifier, so instrumenting them would mean either re-running
    the guard there (a change to the human-gated path, out of scope and higher blast radius) or
    threading classes across a job boundary. The ratchet's own arithmetic does not need them: it
    widens on incident-free AUTO-applies, which only the guard-bearing jobs perform, and the
    routed events those jobs already emit carry the class of every gated change. A gated apply's
    outcome remains recoverable from the convergence record plus Actions history. Record this in
    the T2.48 progress_note so the gap is legible to the next session.
  - >-
    THRESHOLD PARAMETERS are a judgement call, not a ratified constant. Decision 92 pt5 says the
    budget widens "after N incident-free auto-applies" without fixing N. Seed
    RATCHET_INCIDENT_FREE_THRESHOLD = 10 and RATCHET_UNMEASURED_DAYS = 30, each with an inline
    comment naming this plan and the rationale, and surface both in the rec's context so a human
    re-tunes them from evidence rather than from the code. Per Decision 150 an operational
    parameter routes to a rec/tier_item note, never to a numbered Decision.
  - >-
    T2.48 STATE at planning time: c1, c2 (live-proven, run-ids 30118451922 and 30263325448), c3,
