    Create scripts/ci/apply_event.py -- classify_change_classes(plan, budget) delegating the gated
    half entirely to terraform_apply_guard.evaluate_plan's finding reasons and the in-budget half
    to _classify_iam_change/_load_budget; build_event(run_id, job, commit_sha, routed,
    apply_outcome, change_classes, now) returning the event dict; a `classes` and an `emit` CLI
    mode printing JSON to stdout. Return ["classification_error"] on an internal exception, never
    [].
  - >-
    Create tests/test_apply_event.py with the class-vocabulary fixtures, the co-derivation
    biconditional property test, the non_iam-only case, and the classification_error path.
  - >-
    Create .github/actions/record-apply-event/action.yml -- inputs working-directory, job-name,
    routed, apply-outcome, convergence-bucket (default agent-platform-data-lake),
    events-prefix (default apply-events/personal); resolves the guard path via
    ${{ github.workspace }} per composite-action path discipline; runs the emit CLI, PUTs the
    JSON to <prefix>/<UTC-date>/<run_id>-<job>.json under set -euo pipefail, and prints the key.
