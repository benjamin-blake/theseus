    touched source files, re-measured 2026-09-06: validate_ci_rca_lifecycle_projection 400,
    _bundle_core 391, vacuous_pass 378, probe_health 265, taxonomy 200, ci_rca_runtime 103,
    ci_rca_gauges 96, session/preflight 70. None is in config/sloc_budgets.yaml, so the bare 500 limit
