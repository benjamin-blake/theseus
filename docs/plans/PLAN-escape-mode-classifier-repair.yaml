constraints:
  - >-
    Decision 182: the 240s non-test fast-tier half is UNWAIVABLE. Step 10 carries the budget prediction
    and must report within_budget; measured within_budget at authoring time (n_selected 117, predicted
    103.5-132.4s).
  - >-
    Decision 128: decompose, never raise a SLOC budget. Measured headroom to the 500 limit on every
    touched source file at authoring time: vacuous_pass 378, _bundle_core 391, taxonomy 200, probe_health
    265, ci_rca_schema 251, ci_rca_runtime 103, ci_rca_gauges 96, preflight 70. None is in
    config/sloc_budgets.yaml, so the bare 500 limit applies. scripts/preflight/ci_rca_signals.py has only
    28 lines of headroom and is deliberately NOT in scope.
  - >-
    Every behaviour change lands with a test that fails without it (Constraint C). The precedence hoist
    in particular breaks zero existing tests -- all eight pre-existing TestComputeEscapeMode rows were
    hand-verified to pass under the new ordering -- so its evidence MUST come from newly added
    failing-first rows, never from the existing suite going green.
  - >-
    Decision 84: portal writes only via file_rec/update_rec. logs/.recommendations-log.jsonl is read ONLY
    (steps 5 and the gauge fixtures read it; nothing writes it, and no read is ever replayed upstream).
  - >-
    Decision 55 and Decision 72 -- fail loud, forward-fix, never patch around. A taxonomy miss must keep
    abstaining rather than guessing a value.
  - >-
    Decision 59 scope boundary: out-of-scope defects found during implementation become recommendations
    via scripts/ops_data_portal, never inline fixes. Step 9 asserts the touched set both directions.
  - >-
    resolve_workflow_tier's signature and return contract must NOT change -- the migration-seam guard at
    tests/ci_rca/taxonomy/test_load_and_classify.py:115 pins it for every real workflow name. Fix 2 is an
    additive sibling resolver, never an edit to the existing one.
  - >-
    Do NOT widen the existing rca_confidence abstention gauge. The contract's abstention_surface note
    pins that gauge to its preflight twin and warns that moving one without the other relocates the
    defect. The escape_mode gauge is a SECOND, independent gauge.
  - >-
    Sequencing (Constraint G): this slice runs BEFORE the escape-closure-obligation slice. Do not touch
    scripts/convergence_health/**, config/agent/data_quality/source_registry.yaml, or
    .github/workflows/convergence-health.yml -- the in-flight sensor-liveness slice (PR #1099) owns those.
  - >-
    No new standing prose-architecture doc (Decision 86). The field's semantics go into
    docs/contracts/ci-rca-lifecycle.yaml beside its enforcement, per the AGENTS.md collocation rule.
  - >-
    A content change to docs/contracts/ci-rca-lifecycle.yaml REQUIRES a new amendment_log[] entry
    (enforced by scripts/checks/contracts/_population.py:374-388).
  - No rescue agents or workaround loops (Decision 55).
