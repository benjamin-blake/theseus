schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: escape-mode-classifier-repair
intent: >-
  Repair detection_gap.escape_mode from a dead field (100% 'undetermined' since 2026-08-02) into a
  field that actually classifies, by fixing the two deterministic-classifier defects that account for
  every abstention, and point a gauge at the field itself so the next regression cannot hide behind a
  monitor that never reads it. HONEST MARGIN: this moves the field from 0 bits to roughly ONE bit --
  post-fix the distribution is near-deterministic in the workflow name (75 tier_misplaced /
  17 no_premerge_gate_by_design over the 92-row cache, H = 0.69 bits EXACT for that split), because only
  2 of the 22 taxonomy workflows carry a real tier. That 0.69 rests on ASSUMING a third class of zero,
  which is an assumption and not a measurement: the 50 rows already reading tier_misplaced would
  reclassify to check_ran_vacuously under the new vacuous-first ordering if their inputs were
  (vacuous_pass=True, coverage='selected'), and _DetectionGap stores no classifier INPUTS, so that count
  is unknowable from the cache. The direction is conservative -- any nonzero check_ran_vacuously RAISES
  H -- so read 0.69 as a FLOOR on the post-fix margin, not a point estimate.
  That is more than a restatement of actual_gate_that_caught_it
  (which is what a canary-first ordering would have produced, and which is why vacuous-first is the
  right ordering), but it is not a return to a richly discriminating signal. The residual value is
  that check_ran_vacuously becomes REACHABLE for the first time, and that a regression back to 100%
  abstention now trips a gauge instead of passing silently.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-escape-mode-classifier-repair.yaml
phase: T1.13
scope:
  - file: scripts/ci_rca/vacuous_pass.py
    action: Modify
    purpose: >-
      compute_escape_mode: hoist the two determinate-input rules above the abstention guard; narrow that
      guard to vacuous_pass and merge_gate_test_coverage ONLY, and simultaneously add
      `gate_is_postmerge_canary is False` as an explicit precondition on the retained not_selected proxy
      (rule 5). Narrowing the guard alone would be WRONG: rule 5 does not REFERENCE the canary, but its
      correctness CONSUMES it as a precondition, because rule 2 outranks it -- with an undetermined
      canary a not_selected coverage could still have been a canary run, so answering
      no_premerge_gate_by_design there is a guess. Also accept the raw workflow tier as a new keyword
      input so not_a_gate yields no_premerge_gate_by_design directly.
  - file: scripts/ci_rca/taxonomy.py
    action: Modify
    purpose: >-
      Add resolve_workflow_tier_raw, which preserves the not_a_gate sentinel instead of collapsing it to
      'unknown', and reduce resolve_workflow_tier to a delegation wrapper over it
      (`return "unknown" if raw in ("not_a_gate", _MISS) else raw`) so the taxonomy lookup is not
      duplicated. resolve_workflow_tier's OBSERVABLE RETURN CONTRACT is unchanged -- that is the
      invariant, not the function body.
  - file: scripts/ci_rca/evidence/_bundle_core.py
    action: Modify
    purpose: Resolve the raw tier alongside wf_tier and thread it into the compute_escape_mode call.
  - file: scripts/ci_rca/probe_health.py
    action: Modify
    purpose: >-
      Add compute_escape_mode_abstention_rate beside compute_abstention_rate -- a separate gauge over
      detection_gap.escape_mode, never a widening of the rca_confidence gauge the contract's
      abstention_surface pins to its preflight twin.
  - file: scripts/preflight/ci_rca_gauges.py
    action: Modify
    purpose: >-
      Compute and print the escape_mode abstention gauge on the warm-cache path (no new reader egress),
      AND re-word the existing print_ci_rca_abstention_gauge label (ci_rca_gauges.py:69-76) so BOTH
      preflight gauge lines name the field each reads. Today that line prints "CI-RCA probe abstention
      (last 14d): 0/5" -- the label says PROBE but the number measures the AGENT's self-rated
      rca_confidence, and after this PR a second line appears at a materially different rate with
      nothing disambiguating them. New shapes: "CI-RCA agent rca_confidence abstention (last Nd): x/y
      low-confidence/undetermined (z%)" and "CI-RCA probe escape_mode abstention (last Nd): x/y
      detection_gap.escape_mode=undetermined (z%)". The substring
      tests/session/preflight/test_ci_rca_gauges_abstention_label.py:33 asserts is
      'low-confidence/undetermined', which the new label retains, so that OUT-OF-SCOPE file stays green
      and untouched; the full-string pin at tests/session/preflight/test_ci_rca_gauges.py:109 is
      in-scope and is updated with it.
  - file: scripts/session/preflight.py
    action: Modify
    purpose: Carry the new gauge into logs/.preflight-report.json and print it in the CI-RCA block.
  - file: scripts/ops_portal/ci_rca_runtime.py
    action: Modify
    purpose: >-
      Add the check-3 abstention-mirror branch so a bundle abstention on escape_mode that the agent
      CONTRADICTS is caught. This is NOT a copy of check-1's shape: escape_mode is
      `Optional[str] = None` (ci_rca_schema.py:80-83) while earliest_viable_gate is REQUIRED, so the two
      fields are not schema-symmetric. Copying check-1's `agent_evg != "undetermined"` predicate would
      fire on `agent_escape is None` -- every rec where the agent legally omitted an optional field
      while the bundle abstained. The predicate is
      `bundle_escape == "undetermined" and agent_escape is not None and agent_escape != "undetermined"`.
  - file: scripts/checks/contracts/validate_ci_rca_lifecycle_projection.py
    action: Modify
    purpose: >-
      Resolve dotted projection_fields keys through nested BaseModel annotations, and re-base the
      enum-parity obligation on the LIVE PYDANTIC MODEL rather than on the contract's own declaration:
      for every DECLARED projection_fields entry, resolve it against the live model, and if the resolved
      field carries an alternation-shaped pattern (^(a|b|c)$) the entry MUST declare an `enum` equal to
      that alternation. Deriving the obligation from the contract's own `enum:` key would turn today's
      MANDATORY check into an OPT-IN one -- deleting escape_class.enum would make it vacuous where it
      currently hard-fails -- letting the contract disarm its own evaluator.
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: >-
      Declare detection_gap.escape_mode in projection_fields (type, enum, home, authored_by), record the
      new gauge in abstention_surface, and add the required amendment_log entry.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Append ONE compact re-grounding line to T1.13:c9's text -- naming gate_is_postmerge_canary as the
      derivation input c9 omits and rec-3666 as the owner of the deferred check_absent value -- not a
      third dated narrative block (Decision 147: compact storage, narrative to git history; c9 already
      carries two such blocks and the file sits at 9,368 of its 10,000-line ceiling). Re-ground
      T1.13's files_in_scope, three entries of which no longer exist. No new roadmap row.
  - file: tests/test_ci_rca_vacuous_pass.py
    action: Modify
    purpose: Failing-first truth-table rows for the precedence hoist and the raw-tier rule.
  - file: tests/ci_rca/taxonomy/test_load_and_classify.py
    action: Modify
    purpose: Cover resolve_workflow_tier_raw, including that the existing resolve_workflow_tier contract is unchanged.
  - file: tests/ci_rca/evidence/test_generate.py
    action: Modify
    purpose: Assert the bundle threads the raw tier so a not_a_gate workflow emits no_premerge_gate_by_design.
  - file: tests/ops_data_portal/test_ci_rca_runtime.py
    action: Modify
    purpose: Failing-first row for the check-3 abstention-mirror branch.
  - file: tests/test_ci_rca_probe_health.py
    action: Modify
    purpose: Failing-first rows for compute_escape_mode_abstention_rate, including the zero-total guard.
  - file: tests/session/preflight/test_ci_rca_gauges.py
    action: Modify
    purpose: Failing-first rows for the gauge's compute and print helpers.
  - file: tests/checks/contracts/test_validate_ci_rca_lifecycle_projection.py
    action: Modify
    purpose: Failing-first rows for dotted-path resolution and generalised enum parity.
  - file: docs/plans/PLAN-escape-mode-classifier-repair.yaml
    action: Create
    purpose: This plan.
