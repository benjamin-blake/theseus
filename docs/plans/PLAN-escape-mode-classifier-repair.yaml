    reference, cited for its patterns and never modified. scripts/preflight/ci_rca_signals.py has only
    28 lines of headroom and is likewise deliberately NOT in scope.
  - >-
    Every behaviour change lands with a test that fails without it (Constraint C). The precedence hoist
    in particular breaks zero existing tests -- TestComputeEscapeMode's SIX test functions / EIGHT
    assert statements (measured 2026-09-06 by AST over the class body, corroborated by `pytest
    tests/test_ci_rca_vacuous_pass.py -k TestComputeEscapeMode --collect-only -q`, whose summary names
    six collected of thirty-seven; this tree prints "6/37 tests collected (31 deselected)", so do not
    pin a literal "6 selected" -- the earlier "eight rows" phrasing conflated the two counts) were
    hand-verified to pass under the new ordering -- so its evidence MUST come from newly added
    failing-first rows, never from the existing suite going green.
  - >-
    Decision 84: portal writes only via file_rec/update_rec. logs/.recommendations-log.jsonl is read ONLY
