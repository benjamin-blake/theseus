acceptance_criteria:
  - >-
    compute_escape_mode returns 'tier_misplaced' when gate_is_postmerge_canary is True regardless of
    whether vacuous_pass or merge_gate_test_coverage is the undetermined sentinel -- the 25 of 42 live
    abstentions whose actual_gate_that_caught_it is already 'CI'.
  - >-
    compute_escape_mode returns 'check_ran_vacuously' when vacuous_pass is True and
    merge_gate_test_coverage is 'selected', in preference to 'tier_misplaced', so the most specific
    diagnosis is not shadowed by the canary rule.
  - >-
    compute_escape_mode returns 'no_premerge_gate_by_design' when the raw workflow tier is 'not_a_gate',
    without consulting merge_gate_test_coverage -- the 17 of 42 live abstentions whose
    actual_gate_that_caught_it is 'unknown'.
  - >-
    resolve_workflow_tier's signature and return contract are byte-identical in behaviour for every real
    workflow name; the new raw resolver is a separate function.
  - >-
    The evidence bundle threads the raw tier, so generate_bundles on a not_a_gate workflow emits
    escape_mode='no_premerge_gate_by_design' rather than 'undetermined'.
  - >-
    A source=ci_rca rec whose bundle abstained on escape_mode while the agent set a concrete
    NON-'undetermined' value is flagged by the portal cross-check spine; a rec that OMITS escape_mode
    entirely (agent_escape is None -- legal, the field is Optional) raises NO issue.
  - >-
    logs/.preflight-report.json carries an escape_mode abstention gauge computed over
    detection_gap.escape_mode, distinct from the existing rca_confidence gauge, and it reports the true
    trailing rate rather than 0.0.
  - >-
    Both preflight gauge lines name the field each reads: the pre-existing line names rca_confidence
    (it measures the AGENT's self-rating, not the probe) and the new line names
    detection_gap.escape_mode, so the two cannot be read as the same quantity at different rates.
  - >-
    docs/contracts/ci-rca-lifecycle.yaml declares detection_gap.escape_mode in projection_fields with an
    enum equal to the live pydantic pattern alternation; validate_ci_rca_lifecycle_projection fails if
    the two diverge AND still fails if a declared entry whose live field is alternation-shaped drops its
    enum entirely -- the obligation derives from the live model, so the contract cannot disarm it.
  - >-
    T1.13:c9's text carries a one-line re-grounding naming gate_is_postmerge_canary and rec-3666 as the
    owner of the deferred check_absent value; c9's status stays open; and the roadmap's tier_item id set
    is byte-identical to origin/main's, asserted by a real id-set diff rather than declared in prose.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      BEFORE, oracle. Pin the defect on the tree as it stands: the canary rule is shadowed by the
      abstention guard, the raw tier is unreachable, the gauge does not exist, and the contract is silent
      on escape_mode. Every clause must hold BEFORE the fix, so the AFTER steps are falsifiable.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.vacuous_pass import compute_escape_mode as f, _UNDETERMINED
      as U; import scripts.ci_rca.taxonomy as tx, scripts.ci_rca.probe_health as ph; import yaml;
      assert f(U,'selected',True,False)==U, 'canary already hoisted';
      assert f(True,'selected',True,False)=='tier_misplaced', 'vacuous already preferred';
      assert not hasattr(tx,'resolve_workflow_tier_raw'), 'raw resolver already present';
      assert not hasattr(ph,'compute_escape_mode_abstention_rate'), 'gauge already present';
      c=yaml.safe_load(open('docs/contracts/ci-rca-lifecycle.yaml'));
      assert 'escape_mode' not in str(c.get('projection_fields')), 'contract already declares it';
      print('BEFORE_OK all-four-defects-present')"
    expected: Exit 0 and BEFORE_OK all-four-defects-present.
    fix_if: >-
      Any AssertionError means part of this repair already landed (a concurrent PR). STOP and re-scope
      against the tree rather than re-applying a change that is already present.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The premise inverts by construction on merge: every clause asserts the defect is still present, so
      a graduated shard would sit permanently red the moment this PR lands. The durable half -- that the
      repaired behaviour holds -- is what step 2 graduates.
  - step: 2
    phase: pre-deploy
    action: >-
      AFTER, the classifier truth table end to end. Exercises the precedence hoist, the vacuous-first
      preference, the narrowed guard, rule 5's explicit `canary is False` precondition, the raw-tier
      rule, and that a taxonomy miss still abstains -- the one case where 'undetermined' remains the
      honest answer. The last two rows are the NO-REGRESSION half: they are the two cells a
      guard-narrowing alone would have flipped from abstain to a confident (and unfounded)
      no_premerge_gate_by_design.
    command: >-
      bin/venv-python -c "from scripts.ci_rca.vacuous_pass import compute_escape_mode as f, _UNDETERMINED
      as U;
      assert f(U,'selected',True,False)=='tier_misplaced';
      assert f(False,U,True,False)=='tier_misplaced';
      assert f(True,'selected',True,False)=='check_ran_vacuously';
      assert f(True,'selected',False,False)=='check_ran_vacuously';
      assert f(U,U,False,False,workflow_tier_raw='not_a_gate')=='no_premerge_gate_by_design';
      assert f(False,'not_selected',False,False)=='no_premerge_gate_by_design';
      assert f(U,'selected',False,False)==U;
      assert f(False,'selected',False,False)==U;
      assert f(False,'selected',False,False,workflow_tier_raw='unknown')==U;
      assert f(True,'not_selected',U,False)==U;
      assert f(False,'not_selected',U,False)==U;
      print('TRUTH_TABLE_OK 11/11')"
    expected: Exit 0 and TRUTH_TABLE_OK 11/11.
    fix_if: >-
      A row asserting tier_misplaced still returning 'undetermined' means the guard was narrowed but the
      canary rule was not hoisted above it. A row asserting check_ran_vacuously returning tier_misplaced
      means the canary rule sits above the vacuous rule -- invert them. Rows 7-9 returning a concrete
      value means the narrowed guard or the miss branch is too permissive: a taxonomy miss and a
      non-vacuous determinate run must both still abstain, never guess. Rows 10-11 returning
      'no_premerge_gate_by_design' means the guard was narrowed to
      vacuous_pass/merge_gate_test_coverage WITHOUT adding `gate_is_postmerge_canary is False` to rule
      5's own precondition, so an unknown canary is being answered as if it were known false. Rule 2
      outranks rule 5, so rule 5's correctness consumes the canary even though its body never references
      it -- restore the precondition, do not widen the guard back. Calibrate the stakes honestly: these
      two cells are a CONTRACT-level protection on a public function, not a live-bundle regression. The
      sole production caller sets `gate_is_postmerge_canary = wf_tier == "CI"`
      (scripts/ci_rca/evidence/_bundle_core.py:68), a plain bool that is never the undetermined
      sentinel, so rows 10-11 are as unreachable in production as rule 5 itself.
    hermetic: true
    graduation: graduate
    graduation_check_id: escape-mode-truth-table-11-rows
  - step: 3
    phase: pre-deploy
    action: >-
      Red-then-green on the repository's own tests, run against the real suites rather than a synthetic
      driver: all seven touched behaviour suites must pass, and the migration-seam guard on
      resolve_workflow_tier must still hold unchanged. This is the step every unit test_obligation links to.
      Deliberately NOT hermetic, against Decision 148 clause 3's restored default, for a mechanism
      reason rather than convenience: validate_vp_replay's replay time is accounted as replay_s, a term
      of the quantity Decision 182 asserts its UNWAIVABLE 240s non-test budget over
      (static_s + replay_s + unattributed_s), so graduating a seven-suite pytest run into replay would
      move governed TEST time into the one budget no re-scope can fix (verdict non_test_breach:
      "neither declare nor split"). Measured on this tree: 205 tests in 15.8s, versus 4.7s for this
      plan's seven other hermetic steps combined and a PER_STEP_TIMEOUT_SECONDS of 30. The planning
      skill's own Hermetic-authoring paragraph carves pytest steps out for this reason.
    command: >-
      bin/venv-python -m pytest tests/test_ci_rca_vacuous_pass.py
      tests/ci_rca/taxonomy/test_load_and_classify.py tests/ci_rca/evidence/test_generate.py
      tests/ops_data_portal/test_ci_rca_runtime.py tests/test_ci_rca_probe_health.py
      tests/session/preflight/test_ci_rca_gauges.py
      tests/checks/contracts/test_validate_ci_rca_lifecycle_projection.py -q --randomly-seed=20260710
    expected: >-
      Exit 0, zero failures. tests/ci_rca/taxonomy/test_load_and_classify.py::TestResolveWorkflowTier
      passes UNMODIFIED. It holds FOUR test functions carrying SIX assert statements
      (test_return_contract_unchanged_against_real_taxonomy holds three; the other three hold one each)
      -- counted by AST over the class body on 2026-09-06, and by `bin/venv-python -m pytest
      tests/ci_rca/taxonomy/test_load_and_classify.py -k TestResolveWorkflowTier --collect-only -q`,
      which reports four collected of nineteen. Neither number is a count of rows to ADD: four
      functions and six asserts are the same set counted two ways, so do not read either as evidence
      that rows are missing. The only new rows this plan adds to that file cover
      resolve_workflow_tier_raw.
    fix_if: >-
      A failure in TestResolveWorkflowTier means resolve_workflow_tier itself was changed rather than a
      raw sibling added -- revert and add the sibling. A failure elsewhere is the repair being wrong, not
      the test being wrong: never relax an assertion to make this pass. An argparse
      "unrecognized arguments: --randomly-seed=last" error is not a test failure -- it is exit 4 with
      ZERO tests run: it means the seed selector was replaced by a bare -p no:randomly, which disables
      the plugin that owns the flag pyproject.toml's addopts still passes. (Pairing it with -o
      addopts="" also works and exits 0; it is the UNPAIRED form that breaks. Measured both ways on this
      tree; the two merged plans carrying the unpaired form are routed to rec-3669.) Keep the explicit
      fixed seed, defined at scripts/checks/_pytest_diff.py:41 and re-exported through
      scripts/checks/_scaffolding.py:29.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      The bundle actually threads the raw tier. Generates a bundle for a workflow the live taxonomy
      declares not_a_gate and asserts the emitted escape_mode is the by-design value, not the abstention
      sentinel -- the wiring step 2 cannot see because it calls the pure function directly.
    command: >-
      bin/venv-python -c "import scripts.ci_rca.evidence as ev, inspect, yaml;
      src=inspect.getsource(ev._bundle_core._assemble_core) if hasattr(ev,'_bundle_core') else
      open('scripts/ci_rca/evidence/_bundle_core.py').read();
      assert 'resolve_workflow_tier_raw' in src, 'raw tier not resolved in _assemble_core';
      assert 'workflow_tier_raw' in src, 'raw tier not passed to compute_escape_mode';
      t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['workflows'];
      ng=sorted(k for k,v in t.items() if v.get('tier')=='not_a_gate');
      assert len(ng)>=20, ng;
      from scripts.ci_rca.taxonomy import resolve_workflow_tier_raw as r, resolve_workflow_tier as s;
      assert all(r(n)=='not_a_gate' for n in ng), [n for n in ng if r(n)!='not_a_gate'];
      assert all(s(n)=='unknown' for n in ng), 'legacy resolver contract changed';
      print('BUNDLE_WIRING_OK not_a_gate_workflows='+str(len(ng)))"
    expected: Exit 0 and BUNDLE_WIRING_OK not_a_gate_workflows=20 (the count rises as workflows are added; read it as evidence, not a constant).
    fix_if: >-
      A missing-symbol assertion means _assemble_core still calls the collapsing resolver -- thread the
      raw one. 'legacy resolver contract changed' means the delegation wrapper altered
      resolve_workflow_tier's OBSERVABLE return contract: the wrapper must collapse both 'not_a_gate'
      and a taxonomy miss to 'unknown' and pass every real tier through unchanged.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This shard mixes two assertion classes and is the weakest of the three: the behavioural half (the
      resolver contract over the live taxonomy) is durable, but the wiring half asserts SOURCE TEXT
      ('resolve_workflow_tier_raw' in src), which a refactor renaming the symbol or moving the call
      breaks with no behaviour change -- exactly the brittleness a standing registry check must not
      carry. Both halves keep their implement-time value here; the durable behavioural carriers are the
      test_obligation rows tests/ci_rca/evidence/test_generate.py::TestEscapeMode (bundle threading)
      and tests/ci_rca/taxonomy/test_load_and_classify.py::TestResolveWorkflowTier (resolver contract),
      both run by step 3.
  - step: 5
    phase: pre-deploy
    action: >-
      The gauge reads the field it claims to monitor. Computes the escape_mode abstention rate over the
      real local read cache and asserts it is derived from detection_gap.escape_mode -- not from
      rca_confidence -- by cross-checking it against an independently computed rate.
    command: >-
      bin/venv-python -c "import json,pathlib;
      from scripts.ci_rca.probe_health import compute_escape_mode_abstention_rate as g;
      rows=[json.loads(l) for l in
      pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if
      l.strip()];
      u,t,r=g(rows,window_days=100000);
      print('GAUGE', u, t, round(r,4));
      assert t>=90, t;
      assert u>=40, u;
      u2,t2,r2=g([],window_days=14); assert (u2,t2,r2)==(0,0,0.0), (u2,t2,r2);
      print('GAUGE_OK reads_escape_mode zero_total_guarded')"
    expected: >-
      Exit 0, a GAUGE line carrying the counts, then GAUGE_OK reads_escape_mode zero_total_guarded. At
      the pinned cache the all-time figures are 42/92 (46%). Only NON-RATIO floors are asserted, and
      deliberately: u and t are monotone in the cache, a RATIO is not. An `r > 0.4` floor would have
      been self-falsifying -- r = 42/total drops below 0.4 the moment total exceeds 105, about 13 new
      escape-classified recs away -- so the rate is PRINTED as evidence and never asserted. `u >= 40`
      is the load-bearing discriminator: a gauge still reading rca_confidence scores u=14 over this same
      cache (measured 2026-09-06), so the undetermined COUNT separates the two sources with margin and
      without any denominator dependence. Note u=14, NOT u=0 -- a mis-pointed gauge is not silent, it is
      merely far below the floor.
    fix_if: >-
      u well below 40 over the whole cache means the gauge is still reading rca_confidence, which is
      exactly the false-green defect this step exists to catch -- point it at
      context_v2_json.detection_gap.escape_mode. Measured 2026-09-06 for calibration: a gauge reading
      rca_confidence over this same cache scores u=14 (10 low + 4 undetermined across 181 source=ci_rca
      rows), against u=42 for the escape_mode gauge -- so the `u >= 40` floor discriminates with margin,
      but do NOT expect u=0 from a mis-pointed gauge. A ZeroDivisionError on the empty-rows call means the
      zero-total guard was omitted. If u or t falls BELOW its floor while the printed rate looks sane,
      the cause is a shrunken local cache (a fresh clone before `sync.ops sync`, or a narrower window),
      not the gauge -- re-sync and re-run rather than lowering the floor.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Reads logs/.recommendations-log.jsonl, a gitignored read cache whose contents differ per clone and
      per sync, so a graduated shard would assert over data CI does not have. The durable half -- that
      the gauge derives from escape_mode and guards the zero-total case -- is carried by the unit rows
      this plan adds to tests/test_ci_rca_probe_health.py, which run on fixtures.
  - step: 6
    phase: pre-deploy
    action: >-
      The gauge is actually surfaced. Runs preflight and asserts the report carries the new key beside
      the existing one, with the two reporting DIFFERENT rates -- the single strongest disproof that the
      new gauge is a rename of the old.
    command: >-
      bin/venv-python -m scripts.session.preflight >/dev/null 2>&1; bin/venv-python -c "import
      json,pathlib; d=json.loads(pathlib.Path('logs/.preflight-report.json').read_text());
      a=d.get('ci_rca_abstention_gauge'); e=d.get('ci_rca_escape_mode_gauge'); assert
      isinstance(e,dict), 'escape_mode gauge absent from the report'; assert 'rate' in e and
      'total_count' in e, e; assert isinstance(a,dict), 'the rca_confidence gauge was removed rather
      than kept beside it'; print('PREFLIGHT_OK '+str(a['rate'])+' '+str(e['rate']))"
    expected: >-
      Exit 0 and PREFLIGHT_OK naming both rates. At the pinned cache the confidence rate is 0.0 over a
      14-day window while the escape rate is materially higher -- the two are independent quantities.
    fix_if: >-
      An absent key means the gauge was computed but never carried into the report dict. A removed
      rca_confidence gauge means the change widened the existing gauge instead of adding a second one,
      which the contract's abstention_surface note forbids -- add, do not widen.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same disposition and same reason as step 5, which reads the same class of artefact: this step
      regenerates and reads logs/.preflight-report.json, a gitignored per-clone cache (.gitignore:84,
      alongside logs/.recommendations-log.jsonl at :131) derived from that same recommendations cache,
      so a graduated shard would assert over data CI does not have and whose rates differ per clone and
      per sync. The durable half -- that both gauge keys are present, distinct, and correctly shaped --
      is carried on fixtures by the unit rows this plan adds to
      tests/session/preflight/test_ci_rca_gauges.py.
  - step: 7
    phase: pre-deploy
    action: >-
      Contract and schema are locked together, the check cannot be disarmed BY the contract, and the
      per-entry loop accumulates rather than returning early. Runs the re-based enforcer against the
      real contract, then against FOUR deliberately corrupted copies: a WRONG enum on the new dotted
      entry, a DELETED enum on the new dotted entry, a DELETED enum on the pre-existing escape_class
      entry, and -- the accumulation arm -- a copy with BOTH enums deleted at once. All four must bite.
      The deleted-enum arms prove the obligation derives from the live pydantic model and not from the
      contract's own `enum:` key: without them, "enforce parity for any entry declaring an enum" would
      let `del entry['enum']` silently switch the check off where it hard-fails today. The fourth arm is
      the only one that DETECTS a surviving early `return` inside the loop, because each of the first
      three corrupts exactly ONE entry and therefore bites whether the loop accumulates or returns on
      first failure; two corrupted entries separate the two behaviours.
    command: >-
      bin/venv-python -c "import copy,yaml,pathlib,tempfile;
      from scripts.checks.contracts.validate_ci_rca_lifecycle_projection import
      validate_ci_rca_lifecycle_projection as v;
      f=[]; v(f); assert not f, f;
      p=pathlib.Path('docs/contracts/ci-rca-lifecycle.yaml');
      d=yaml.safe_load(p.read_text()); pf=d['projection_fields'];
      k='detection_gap.escape_mode'; assert k in pf, sorted(pf);
      assert sorted(pf[k]['enum'])==sorted(['check_ran_vacuously','tier_misplaced','no_premerge_gate_by_design','undetermined']), pf[k];
      assert 'escape_class' in pf and pf['escape_class'].get('enum'), pf.get('escape_class');
      t1=tempfile.mkdtemp(); a=copy.deepcopy(d); a['projection_fields'][k]['enum']=['bogus'];
      pathlib.Path(t1,'ci-rca-lifecycle.yaml').write_text(yaml.safe_dump(a));
      f1=[]; v(f1, contracts_dir=pathlib.Path(t1)); assert f1, 'wrong-enum did not bite';
      t2=tempfile.mkdtemp(); b=copy.deepcopy(d); b['projection_fields'][k].pop('enum');
      pathlib.Path(t2,'ci-rca-lifecycle.yaml').write_text(yaml.safe_dump(b));
      f2=[]; v(f2, contracts_dir=pathlib.Path(t2)); assert f2, 'deleted enum on the dotted entry did not bite';
      t3=tempfile.mkdtemp(); c=copy.deepcopy(d); c['projection_fields']['escape_class'].pop('enum');
      pathlib.Path(t3,'ci-rca-lifecycle.yaml').write_text(yaml.safe_dump(c));
      f3=[]; v(f3, contracts_dir=pathlib.Path(t3)); assert f3, 'deleted enum on escape_class did not bite';
      t4=tempfile.mkdtemp(); e=copy.deepcopy(d); e['projection_fields'][k].pop('enum');
      e['projection_fields']['escape_class'].pop('enum');
      pathlib.Path(t4,'ci-rca-lifecycle.yaml').write_text(yaml.safe_dump(e));
      f4=[]; v(f4, contracts_dir=pathlib.Path(t4)); j=' '.join(f4);
      assert 'escape_class' in j and 'escape_mode' in j, {'accumulation_arm_saw_only':f4};
      print('CONTRACT_PARITY_OK bites_on_drift bites_on_deletion accumulates 4/4')"
    expected: Exit 0 and CONTRACT_PARITY_OK bites_on_drift bites_on_deletion accumulates 4/4.
    fix_if: >-
      A non-empty failed list on the real contract with a 'not on CiRcaContext' message means dotted-path
      resolution through the nested _DetectionGap model was not implemented -- escape_mode is not a
      top-level CiRcaContext field. 'wrong-enum did not bite' means the parity assertion is still
      hardcoded to escape_class and never reaches the new entry. EITHER deleted-enum arm failing to bite
      means the obligation was keyed off the contract's own `enum:` key instead of the live model: re-base
      it -- for every DECLARED entry, resolve the (possibly dotted) key against the live model and, if the
      resolved field carries an alternation-shaped pattern, REQUIRE a matching enum. The accumulation arm
      failing with {'accumulation_arm_saw_only': [...]} carrying only ONE message means the existing early
      `return` at validate_ci_rca_lifecycle_projection.py:44 survived into the per-entry loop: one
      enum-less entry silently skipped every later entry. Note the first three arms do NOT detect this --
      each corrupts a single entry, so the first failure IS the one under test and all three bite with the
      early `return` intact; only the both-enums-deleted arm separates accumulate from return-on-first.
      Accumulate into failed[] and continue.
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-rca-contract-escape-mode-enum-parity
  - step: 8
    phase: pre-deploy
    action: >-
      Roadmap bookkeeping is an amendment, not a row addition, and c9 stays open. Reads
      docs/ROADMAP-PLATFORM.yaml at origin/main and diffs its tier_item id SET against the working
      tree's -- the "no roadmap ROW ADDITIONS" constraint made assertable rather than merely asserted
      (Decision 163: a universal obligation is enforced structurally, not declared in metadata). Also
      asserts c9 is still open, that its text gained the one-line re-grounding naming both the missing
      derivation input and the deferred value's owner, and that the three dead files_in_scope entries
      are gone.
    command: >-
      bin/venv-python -c "import subprocess,yaml,pathlib;
      base=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True,check=True).stdout);
      d=yaml.safe_load(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8'));
      b={i['id'] for i in base['tier_items']}; n={i['id'] for i in d['tier_items']};
      assert n==b, {'added':sorted(n-b),'removed':sorted(b-n)};
      it=[i for i in d['tier_items'] if i['id']=='T1.13'][0];
      c=[x for x in it['exit_criteria'] if x['id']=='c9'][0];
      assert c['status']=='open', c['status'];
      assert 'gate_is_postmerge_canary' in c['text'], 'c9 re-grounding absent';
      assert 'rec-3666' in c['text'], 'c9 does not name the deferred check_absent owner';
      dead={'docs/INTENT-ci-rca-methodology.md','scripts/ci_rca/evidence.py','scripts/ci_rca_gate_evidence.py'};
      assert not (dead & set(it['files_in_scope'])), sorted(dead & set(it['files_in_scope']));
      print('ROADMAP_OK tier_items='+str(len(n))+' added=0 removed=0 c9=open check_absent_owner=rec-3666')"
    expected: >-
      Exit 0 and a `ROADMAP_OK` line carrying the tier_item count, `added=0 removed=0` against
      origin/main, `c9=open`, and `check_absent_owner=rec-3666`.
    fix_if: >-
      A non-empty 'added' list means a roadmap ROW was added -- the human forbade row additions in this
      run; revert it and express the change as criterion text. A non-empty 'removed' list means an item
      was deleted, which this plan never sanctions. A c9 status other than open means the criterion was
      flipped: /plan and /implement never infer 'met', and c9's part (a) throttle is unbuilt by design.
      A missing rec-3666 means the c9 line named the check_absent deferral without naming its owner --
      the declared-but-unowned mode this plan exists to stop. A surviving dead path means the
      files_in_scope re-grounding was skipped. A CalledProcessError on git show means origin/main was
      never fetched: run git fetch origin main, do not weaken the assertion to a working-tree-only check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Two of the four clauses are base-relative and invert on merge: once this PR lands, origin/main
      itself carries the amended c9 text, so the text-delta and owner clauses stop discriminating. The
      id-set clause does not invert, but as a standing check it would assert "the roadmap never gains a
      row", which is false of the roadmap in general and true only inside this plan's window. The
      durable half -- every tier_item id resolves, criteria carry valid statuses, and the file stays
      under its line ceiling -- is already a registered check running in both tiers
      (validate_platform_roadmap).
  - step: 9
    phase: pre-deploy
    action: >-
      Scope boundary, both directions: the working-tree-aware status diff equals exactly this plan's
      declared scope -- nothing outside it, nothing declared but untouched.
    command: >-
      bin/venv-python -c "from scripts.checks import _common; import yaml,pathlib;
      p=yaml.safe_load(pathlib.Path('docs/plans/PLAN-escape-mode-classifier-repair.yaml').read_text(encoding='utf-8'));
      e={r['file'] for r in p['scope']}; t={q for _s,q in _common.get_status_aware_diff()};
      assert t==e, {'outside_declared_scope':sorted(t-e),'declared_but_untouched':sorted(e-t)};
      print('TOUCHED_SET_EXACT '+str(len(t))+' '+str(sorted(t)))"
    expected: Exit 0 and TOUCHED_SET_EXACT listing exactly the 18 declared scope paths in sorted order.
    fix_if: >-
      outside_declared_scope names a path this plan never declared: revert that edit. Never resolve it by
      appending the path to scope -- an undeclared touched path is a STOP under the scope-boundary
      contract's deviation branch b. declared_but_untouched means a scope row was not implemented.
      Known clone artefact: in a --shared scratch clone a .venv SYMLINK is listed by
      get_status_aware_diff because .gitignore's .venv/ directory pattern does not match it; this plan's
      expected set deliberately carries no .venv exemption -- fix the clone, not the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this PR's own transient file set, meaningless once merged, and the durable rule it
      instantiates is already a registered check in both tiers (validate_scope_boundary reading
      docs/contracts/implement-scope-boundary.yaml).
  - step: 10
    phase: pre-deploy
    action: >-
      Fast-tier budget prediction against the final scope, and the unwaivable non-test half. Decision 182
      makes the 240s non-test budget unwaivable, so the plan must clear it as authored, not discover a
      breach in CI.
    command: >-
      bin/venv-python -m scripts.checks.deps.selection_budget --plan
      docs/plans/PLAN-escape-mode-classifier-repair.yaml --json
    expected: >-
      Exit 0 and a JSON record whose predicted_outcome is "within_budget". Re-measured 2026-09-06 after
      the round-1 scout edits, on this exact scope: n_selected 113 of a 544 census, predicted elapsed
      98.4-125.6s of which the test half is 47.4-53.8s, leaving a non-test half of 51.0-71.8s against
      the UNWAIVABLE 240s NON_TEST_BUDGET_SECONDS, with allowance_s 226.0 for the test half. Read every
      integer as drift-prone: the scout's independent run on a slightly different tree returned
      n_selected 111 of a 539 census with the same within_budget verdict, and the non-test half is a
      pair of module constants (_PREDICT_NON_TEST_LOW/HIGH), not a scope-derived quantity.
    fix_if: >-
      "breach" means SPLIT the scope into atomic units until the prediction clears -- selection breadth,
      not the scope-row count, is the quantity to plan against. "breadth_waived" means keep the scope but
      declare the measured breadth in this plan's context before proceeding. "non_test_breach" is not
      fixable by re-scoping: stop and open a planning session against the recorded static_s series.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A plan-time reporter that exits 0 on every path by design ("it is a report, never a gate"), so a
      graduated command_exit_zero shard would assert nothing. The quantity it reports is already
      asserted in CI by the fast tier's own two budget checks.
  - step: 11
    phase: pre-deploy
    action: >-
      Full-tier presubmit before handoff, per the two-tier presubmit model. Runs the complete validator
      so the registered checks touched by this change -- validate_ci_rca_lifecycle_projection,
      validate_platform_roadmap, validate_sloc_limits, validate_plan_documents -- all pass on the
      finished tree.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0 with no failed checks.
    fix_if: >-
      Read the printed violations. A validate_sloc_limits failure means a touched file crossed 500 SLOC:
      decompose it into a facade package (Decision 128), never raise the budget. Never edit a check
      module to clear its own failure.
    hermetic: false
    graduation: not-applicable
