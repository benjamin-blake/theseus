pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 182 and Decision 201 sections read (only the plan-cited sections)
  - All files in scope located and readable, plus requirements.in, requirements-dev.in and scripts/checks/_pytest_diff.py (_parse_requirement_dist_names, _excluded_heavy_import_names)
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Rewrite rec-4077's acceptance BEFORE any closing commit: call get_rec_write_guidance() first, then update_rec('rec-4077', {'acceptance': 'bin/venv-python -m pytest tests/validate/test_pytest_diff_runtime_dep_artifact.py::TestUlidInFastTier tests/validate/test_pytest_diff_runtime_dep_artifact.py::TestFastTierDependencyParity -q'}) through scripts.ops_data_portal (Decision 201: the closing verdict is keyed to the acceptance current at the closing commit)."
  - "Record red-before evidence on the untouched tree: VP steps 1, 2 and 4 (target_absent / not selected) and step 5 (ModuleNotFoundError)."
  - Create tests/validate/test_pytest_diff_runtime_dep_artifact.py per its scope row; run it against the untouched requirements file and record the named failures (test_obligations red halves).
  - Edit requirements-fast.txt per its scope row (floor, header, six heavy-exclusion lines with grep-verified reasons), then invert the ulid member in tests/validate/test_pytest_diff.py.
  - Run VP steps 1-6 in order; loop until pass; never weaken an assertion; on an unrecoverable failure stop and RCA (Decision 55).
  - Create the three graduated registry shards for VP steps 1, 2 and 4 under config/agent/verification_registry/entries/ (graduation_check_id verbatim as check_id; test_selector slot for steps 1-2, command_exit_zero for step 4; field shape per an existing row of each slot) (Decision 132).
  - Set implementation_declared true in this plan, then run VP step 7, then VP step 8, so the full-tier evidence covers the final tree at the pre-commit HEAD.
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness; parent validator evidence (VP step 8 full-tier exit 0 and the matching logs/debug/validation-result.json); structured postflight evidence; the real outcome -- commit, push, PR, CI green on the head (event-driven wake, never polled), squash-merge with 'Resolves: rec-4077', then post-deploy VP step 9."
  - "Report, naming separately: what was implemented; red-before and green-after outputs of VP steps 1, 2, 4 and 5; the six heavy-exclusion reasons as written; and each closure fact."
work_areas: []
rollback: Revert the single implementation commit; the fast tier returns to excluding python-ulid (and to the reactive double run on ulid-selecting PRs). No runtime, data or infrastructure state is touched.
