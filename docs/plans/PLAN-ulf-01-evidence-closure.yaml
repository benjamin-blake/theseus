    ghas-probe.yml (only GHAS_PROBE_TOKEN is wired, at its env: block), so the colocation rationale
    covers one of the two credentials, not both -- the second is there for operator convenience
    pending rec (c). This is INTERIM: rec (c) owns the durable, Decision 168-conformant home.
  - >-
    Decision 136 DEFERRAL (explicit): validate_platform_roadmap forbids a touched tier_item from
    retaining bare-string criteria, but keys `touched_ids` off `^[+-]\s+- id:` diff lines, so an
    in-place criterion-TEXT edit does not fire it. Converting T2.13's four criteria is NOT done
