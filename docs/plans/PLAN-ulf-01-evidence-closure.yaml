  - >-
    Decision 62 RESIDUAL (must be stated, not hidden): the recorded evidence is a POINT-IN-TIME
    probe, not continuous coverage. The monitor still has no persistent-unavailability alarm, and
    the stanza's review_by is 2027-04-30, so a recurrence before then still surfaces to nobody.
    The new Decision 83 block must say this in its own words; rec (b) owns the liveness advisory.
  - >-
    Decision 55 (alarm-not-gate, no unilateral remediation): this plan RECORDS and SURFACES. It
    must not auto-flip any GitHub setting, must not re-adjudicate ghas-probe's ci_rca disposition
    inline, and must not add a ci_rca watch -- a watch would mint a weekly critical rec and HARD
    BLOCK /plan on a fix only a human can perform (the convergence-health wedge pattern). The
    liveness advisory is proposed via rec (b), not implemented here.
  - >-
    Decision 133 stanza framing: `on_trigger` phrases the duty as re-verifying the CLAIM -- re-probe
    the three controls and record dated evidence, or mark them UNVERIFIED on Decision 83, then
    re-arm -- not as a rotation runbook. The mechanical rotation steps stay in the workflow comment
    (and later the contract), keeping the stanza an evidence instrument rather than a task
