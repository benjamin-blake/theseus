    Decision 127 DEFERRAL (explicit, not an oversight): point 2 routes new operator procedures to a
    `procedure:` block in the owning docs/contracts/*.yaml. The load-bearing reason that route is
    not taken here is that NO existing contract owns repo/GitHub-Actions credentials --
    docs/contracts/credential-routing.yaml is a Class C broker-to-Secrets-Manager routing contract,
    not a repo-credential inventory -- so point 3's "existing contract" host does not exist, and
    minting a new one engages Decision 168's declared-evaluator gate (a Class D contract needs an
    evaluator that demonstrably reads it), which is real work outside a V2 doc plan. Do NOT argue
