schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: staged-apache-relicense-decision
intent: Record the staged BUSL-1.1 -> Apache-2.0 conversion as a numbered Decision whose trigger conditions an agent can evaluate,
  and register the first repo_state predicate so the free-tier half fires by itself instead of waiting on a human reading
  prose.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-staged-apache-relicense-decision.yaml
phase: user_explicit_out_of_scope (soft-warn category; no tier_item claimed, no exit criterion closed, docs/ROADMAP-PLATFORM.yaml
  not edited). Cites T4.22/T4.23/T4.24 as the tier items condition (a) reads, and T4.24 c6 as the existing gate the grant-widening
  decision point defers to.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: Add Decision 194 (staged Apache flip, two named triggers, deferred grant-widening decision point, two solicitor-flagged
    assumptions) with its monitored reversal-conditions stanza.
- file: scripts/preflight/decision_conditions.py
  action: Modify
  purpose: Register roadmap_items_complete, the first repo_state predicate in the registry the module has documented as its
    extension point since Decision 133, and correct the two now-false 'registry is EMPTY today' claims (module docstring,
    _PREDICATE_REGISTRY comment).
- file: tests/test_decision_condition_predicates.py
  action: Create
  purpose: Unit-test the predicate. A NEW file because tests/test_decision_conditions.py measures 488 SLOC against the 500
    limit (Decision 128 decompose-by-default; no budget raise).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Append 194 to related_decisions on T4.22, T4.23 and T4.24 so the licence coupling is visible from the roadmap side
    and a rename sees that these ids are load-bearing. No status, exit_criteria or any other field is touched; no criterion
    is closed.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- Decision 194 exists in docs/DECISIONS.md, is monitored by scripts.preflight.decision_conditions, and evaluates to state
  not-due today.
- Condition free-core-complete resolves the registered predicate roadmap_items_complete and returns False against the live
  roadmap.
- roadmap_items_complete raises on an unknown tier item id even when an earlier item is already incomplete, and returns True
  only when every named item is complete with every exit criterion met.
- A rehomed exit criterion does not satisfy the predicate.
- Decision 194's heading-to-next-heading span is at or under the 6144-byte per-entry cap.
- No licence artefact (LICENSE, LICENSE-APACHE, LICENSING.md, COMMERCIAL-LICENSE.md) and no contribution artefact (CONTRIBUTING.md)
  is modified, and Decision 171's byte span is unchanged.
- rec-3153 is re-contexted to first_of(grant widening lands, first commercial sale, Apache flip) and remains open; rec-3148
  remains open and unmodified.
- The module docstring and the _PREDICATE_REGISTRY comment in scripts/preflight/decision_conditions.py no longer claim the
  registry is empty.
- T4.22, T4.23 and T4.24 each carry 194 in related_decisions, with no other roadmap field changed.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Decision 194 is monitored end-to-end - stanza well-formed, predicate registered and wired, state not-due.
  command: bin/venv-python -c "import scripts.preflight.decision_conditions as dc; r=[x for x in dc.evaluate() if x.decision_id==194];
    assert len(r)==1, r; s=r[0]; assert s.state=='not-due', s; c={x.id:x for x in s.conditions}; assert c['free-core-complete'].predicate=='roadmap_items_complete';
    assert c['free-core-complete'].fired is False; assert c['commercial-plane-operational'].kind=='manual'; print('OK', s.state,
    s.review_by)"
  expected: Prints OK not-due 2027-03-31; exit 0.
  fix_if: 'No result for 194 means the stanza fence or decision: key is wrong. MALFORMED naming an unregistered predicate
    means registration did not take effect at evaluate() time.'
  hermetic: true
  graduation: graduate
  graduation_check_id: dec-194-stanza-monitored-predicate-wired
- step: 2
  phase: pre-deploy
  action: Exercise the predicate's own semantics - fail-loud ordering, rehomed handling, positive control.
  command: bin/venv-python -m pytest tests/test_decision_condition_predicates.py -q
  expected: All tests pass; exit 0.
  fix_if: A missing-id case that returns False instead of raising means the existence check runs after the completeness loop
    and short-circuits - validate every id before evaluating any.
  hermetic: false
  graduation: graduate
  graduation_check_id: dec-194-roadmap-predicate-semantics
- step: 3
  phase: pre-deploy
  action: Decision 194's entry span is within the per-entry authoring cap.
  command: bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); h=[(int(m.group(1)),m.start())
    for m in re.finditer(r'^## Decision (\d+):',t,re.M)]; i=[k for k,(n,_) in enumerate(h) if n==194][0]; e=h[i+1][1] if i+1<len(h)
    else len(t); n=len(t[h[i][1]:e].encode('utf-8')); assert n<=6144, n; print('span',n)"
  expected: Prints a span at or under 6144; exit 0.
  fix_if: Over cap - trim prose, never raise the cap; the cap is a hard-fail in the --pre tier.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates validate_decisions_size's per-entry cap leg, which already hard-fails any new-in-diff
    entry over 6144 bytes in both tiers; a second standing check adds no coverage.
- step: 4
  phase: pre-deploy
  action: No licence or contribution artefact is touched, and Decision 171's span is unchanged (seam guard).
  command: git fetch origin main --quiet && ! git diff --name-only origin/main...HEAD | grep -qE '^(LICENSE|LICENSE-APACHE|LICENSING\.md|COMMERCIAL-LICENSE\.md|CONTRIBUTING\.md)$'
    && bin/venv-python -c "import re,subprocess; f=lambda t:(lambda h:(lambda i:len(t[h[i][1]:(h[i+1][1] if i+1<len(h) else
    len(t))].encode()))([k for k,(n,_) in enumerate(h) if n==171][0]))([(int(m.group(1)),m.start()) for m in re.finditer(r'^##
    Decision (\d+):',t,re.M)]); a=f(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True).stdout);
    b=f(open('docs/DECISIONS.md',encoding='utf-8').read()); assert a==b, (a,b); print('171 span unchanged',b)"
  expected: Prints '171 span unchanged 6056'; exit 0.
  fix_if: A changed 171 span means clause 5 or another 171 clause was edited - revert it; this plan amends 171 by reference
    from a new entry, never in place.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Green-before by construction - a negative-scope guard cannot be red before the change it guards,
    so graduating it would redden this plan's own PR under the red-before replay.
- step: 5
  phase: pre-deploy
  action: The reversal-stanza CLI reports no malformed stanza across the whole corpus.
  command: bin/venv-python -m scripts.preflight.decision_conditions
  expected: 'One line per monitored decision including "Decision 194: not-due (review_by 2027-03-31)"; exit 0.'
  fix_if: Nonzero exit names the malformed decision and the parse error verbatim.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates validate_reversal_stanzas, the registered check that already gates corpus-wide stanza
    well-formedness in both tiers.
- step: 6
  phase: pre-deploy
  action: rec-3153 is re-contexted and still open; rec-3148 is untouched and still open.
  command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as g; a=g('rec-3153'); b=g('rec-3148');
    assert a['status']=='open' and b['status']=='open', (a['status'],b['status']); assert 'Apache flip' in a['context'], a['context'][-300:];
    print('recs OK')"
  expected: Prints recs OK; exit 0.
  fix_if: Missing phrase means the update_rec call did not land. A non-open status means a rec was closed - neither rec is
    closed by this plan.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: The module no longer claims an empty predicate registry.
  command: '! grep -nE ''EMPTY today|empty today'' scripts/preflight/decision_conditions.py'
  expected: No match; exit 0.
  fix_if: A surviving 'EMPTY today' line means the docstring or the registry comment now lies about its own state.
  hermetic: true
  graduation: graduate
  graduation_check_id: dec-194-predicate-registry-claims-current
- step: 8
  phase: pre-deploy
  action: The roadmap back-reference landed on all three items and nothing else in the roadmap changed.
  command: bin/venv-python -c "from pathlib import Path; from scripts.platform_roadmap_state import load; d=load(Path('docs/ROADMAP-PLATFORM.yaml'));
    m={t.id:t for t in d.tier_items}; assert all(194 in (m[i].related_decisions or []) for i in ('T4.22','T4.23','T4.24'));
    assert all(m[i].status=='deferred_post_mvp' for i in ('T4.22','T4.23','T4.24')); print('roadmap backref OK')" && git diff
    --stat origin/main...HEAD -- docs/ROADMAP-PLATFORM.yaml
  expected: Prints 'roadmap backref OK'; the diffstat shows a small ROADMAP-PLATFORM.yaml change (3 lines changed).
  fix_if: A missing 194 means the append was applied to the wrong item. A changed status means the edit strayed beyond the
    back-reference -- revert it; this plan closes no criterion and advances no item.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Half the evidence is a git diffstat against origin/main, which is transient repo state for this
    branch and not expressible as a standing regression guard.
test_obligations:
- source: scripts/preflight/decision_conditions.py
  behavior: roadmap_items_complete returns True only when every named tier item is status complete with every exit criterion
    met, treats rehomed as not-met, and raises on an unknown id regardless of where that id sits relative to an already-incomplete
    item.
  verification_step: 2
  test_selector: tests/test_decision_condition_predicates.py
  red_green_expectation: Red before - the module has no roadmap_items_complete and the test file does not exist, so collection
    fails. Green after.
- source: docs/DECISIONS.md
  behavior: Decision 194's reversal-conditions stanza stays parseable and its free-core-complete condition keeps resolving
    the registered predicate rather than going MALFORMED.
  verification_step: 1
  command: bin/venv-python -c "import scripts.preflight.decision_conditions as dc; r=[x for x in dc.evaluate() if x.decision_id==194];
    assert len(r)==1, r; s=r[0]; assert s.state=='not-due', s; c={x.id:x for x in s.conditions}; assert c['free-core-complete'].predicate=='roadmap_items_complete';
    assert c['free-core-complete'].fired is False; assert c['commercial-plane-operational'].kind=='manual'; print('OK', s.state,
    s.review_by)"
  red_green_expectation: Red before - evaluate() returns no row for 194, so the index raises. Green after.
constraints:
- Do not edit LICENSE, LICENSE-APACHE, LICENSING.md or COMMERCIAL-LICENSE.md. The Licensor line is gated on a legal event,
  not a merge order.
- Do not edit CONTRIBUTING.md or Decision 171 clause 5 - another agent owns the contribution-model seam (rec-3154).
- Do not close, rewrite or reprioritise rec-3153 or rec-3148 - rec-3153 gets a context re-point only, via scripts.ops_data_portal
  update_rec.
- Decision 194 must stay at or under the 6144-byte per-entry cap (docs/contracts/decision-entry.yaml size_governance); trim
  prose, never raise the cap.
- Do not add a SLOC budget entry - Decision 128 decompose-by-default; new tests go in a new file.
- No rescue agents or workaround loops (Decision 55).
