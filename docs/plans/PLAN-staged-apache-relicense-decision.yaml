execution_steps:
- "docs/DECISIONS.md -- insert the following entry VERBATIM immediately above '## Decision 193:', followed by a blank line,\
  \ '---', and a blank line. Human-approved 2026-09-18; do not paraphrase, reorder clauses, or re-derive the wording. Measured\
  \ span 6062 of the 6144-byte cap, so any addition needs a compensating cut.\n\n## Decision 194: The Apache-2.0 conversion\
  \ is staged on two named conditions rather than left to the fixed 2030-08-15 Change Date; the Additional Use Grant stays\
  \ unwidened until the first free-tier release (amends Decision 171) (Decided)\n\n```yaml\nnumber: 194\nstatus: Decided\n\
  decided_date: \"2026-09-18\"\namends: [171]\nsignificance:\n  value: numbered_decision\n  justification: >-\n    Durable,\
  \ reversal-relevant commitment staging the outbound licence's conversion on named\n    conditions. Not a contract note:\
  \ no docs/contracts file owns licence terms. Not an\n    amendment_forms annotation: Decision 171 measures 6056 of 6144\
  \ bytes, leaving no room for a\n    monitored stanza plus two conditions.\n```\n\n**Status:** Decided\n**Date:** 2026-09-18\n\
  **Warehouse ID:** dec-194 (per Decision 84 backfill)\n\n**Problem:**\nDecision 171 set one fixed Change Date, 2030-08-15.\
  \ The intent to convert earlier once a moat\nexists lived only in operator memory as \"when the free version works and the\
  \ commercial repo is\nup\" -- unfalsifiable, and unevaluable by an agent. Decision 184 clause 5 left the grant's\ncarve-out\
  \ open with no recorded shape.\n\n**Intent:**\nConversion to Apache-2.0 is staged on conditions this repository can evaluate;\
  \ grant widening is a\nnamed deferred decision point, not a forgotten one.\n\n**Decision:** Amends Decision 171 (licence\
  \ terms only -- clause 5 is untouched).\n\n1. **Staged flip.** When both stanza conditions hold, the Licensor brings the\
  \ Change Date forward\n   by an explicit act amending `LICENSE` and `LICENSING.md`. BSL-1.1 permits a published version's\n\
  \   Change Date to move EARLIER, never later. One-way: nothing published is ever narrowed.\n2. **Condition (a) is machine-evaluated.**\
  \ T4.22, T4.23 and T4.24 all `status: complete` with every\n   exit criterion `met`, read from `docs/ROADMAP-PLATFORM.yaml`\
  \ by `roadmap_items_complete` -- the\n   first registered `repo_state` predicate in `scripts/preflight/decision_conditions.py`,\
  \ whose\n   registry Decision 133 left empty. A `rehomed` criterion does NOT satisfy it; an\n   absent tier item RAISES\
  \ rather than returning False. All three are `deferred_post_mvp`\n   (Decision 93), so (a) cannot fire before post-MVP work\
  \ starts; if Decision 184's `no-free-tier`\n   condition drops them, the predicate fails loud and reddens CI rather than\
  \ letting this Decision\n   die silently -- that redness is the re-decide trigger, not an outage.\n3. **Condition (b) is\
  \ a manual attestation, and says so.** A private repository is unobservable\n   from a public one; a predicate reading a\
  \ self-maintained marker would test only whether the\n   operator remembered to edit it. An operator precondition, never\
  \ a platform-repo observable\n   (Decision 178). Three claims: the private plane imports the core; holds at least one\n\
  \   capability deliberately NOT in the core; is deployed and serving, not scaffolded. The third is\n   load-bearing -- \"\
  exists\" is not \"operational\". Discharging it records the DATE and the FACT\n   only: never the repository, its contents\
  \ or its internals (Decision 111).\n4. **The Additional Use Grant stays unwidened today.** Widening defers to its existing\
  \ gate --\n   T4.24 c6 and Decision 184 clause 5, before the first free-tier release -- which remains the SOLE\n   deciding\
  \ authority. No installable free tier exists, so widening now spends an irreversible move\n   on adoption that cannot be\
  \ bought. Intended shape, recorded as NON-BINDING guidance so it is not\n   redesigned: production use permitted, carve-out\
  \ limited to offering the Licensed Work to third\n   parties as a hosted or managed service -- NOT a broad \"competing product\"\
  \ restriction, which is\n   vaguer, less tested, and leaves an internal-tool builder unable to tell if they are offside.\n\
  5. **Dual licensing (Decision 171 clause 6) is unchanged today and is spent by the flip.** Under a\n   widened grant its\
  \ subject shifts from permission-to-run-in-production to permission-to-compete\n   -- far narrower than Decision 171 anticipated.\
  \ rec-3148 survives unmodified on that changed\n   premise. rec-3153 is re-contexted to first_of(grant widening lands, first\
  \ commercial sale,\n   Apache flip): Apache-2.0 outbound carries its own inbound dependency-compatibility requirement,\n\
  \   so that audit gates the flip regardless.\n\n**Stated assumptions -- flagged for solicitor confirmation, NOT settled\
  \ law:**\n- **A1.** Bringing the Change Date forward exercises a right the licence already contains and every\n  recipient\
  \ already holds, so it does not depend on Decision 171 clause 5's contributor-assignment\n  work; selling a commercial licence\
  \ does, because GitHub's inbound=outbound terms confer no right\n  to sublicense. If A1 holds, the flip decouples from rec-3154.\
  \ A1 concerns CONTRIBUTOR copyright,\n  distinct from the DEPENDENCY-licence question in clause 5.\n- **A2.** `LICENSE`\
  \ names the Licensor as \"Benjamin Blake\", an individual, while On The Loop Labs\n  Limited now owns the platform; a relicense\
  \ is an act of the copyright owner. The\n  founder-to-company IP assignment is therefore a precondition on EXECUTING the\
  \ flip, gated on a\n  legal event, not on merge order. `validate_licence_consistency` hard-pins that exact string, so\n\
  \  the line and the regex move in the same commit whenever it changes. Neither is edited here.\n\n```yaml reversal-conditions\n\
  decision: 194\nreview_by: 2027-03-31\non_trigger: \"re-decide via /plan\"\nconditions:\n  - id: free-core-complete\n   \
  \ kind: repo_state\n    predicate: roadmap_items_complete\n    params:\n      items: [T4.22, T4.23, T4.24]\n    description:\
  \ \"Free tier shippable: T4.22/T4.23/T4.24 complete with every exit criterion met.\"\n  - id: commercial-plane-operational\n\
  \    kind: manual\n    description: \"Operator attests the private plane imports the core, holds a capability absent from\
  \ it, and is deployed and serving.\"\n```\n\n**Related:** Decision 171 (amended -- licence terms only), Decision 184 (clause\
  \ 5 grant gate),\nDecisions 93, 111, 133, 178; T4.22-T4.24, T4.24 c6; rec-3148, rec-3153, rec-3906. Contributor\nassignment\
  \ (Decision 171 clause 5, rec-3154) is out of scope."
- 'scripts/preflight/decision_conditions.py -- add roadmap_items_complete under @register_predicate(''roadmap_items_complete''),
  taking items: list[str]; function-local import of scripts.platform_roadmap_state; validate every id exists FIRST (raise
  KeyError naming the missing ids), then require status == ''complete'' and every exit criterion status == ''met''.'
- 'scripts/preflight/decision_conditions.py -- correct the two ''EMPTY today'' claims (module docstring ~line 28 and the _PREDICATE_REGISTRY
  comment ~line 56); registering the first predicate falsifies both. Decision 133''s own stanza comments are NOT edited: its
  predicate: null conditions remain manual and its claim stays true.'
- 'tests/test_decision_condition_predicates.py -- create; cover: unknown id raises even when an earlier item is incomplete;
  rehomed criterion does not satisfy; positive control on a genuinely complete item; live T4.22/T4.23/T4.24 returns False;
  registration is visible through evaluate().'
- 'docs/ROADMAP-PLATFORM.yaml -- append 194 to related_decisions on T4.22 (currently [39, 185]), T4.23 ([78, 81, 84, 184])
  and T4.24 ([171, 178, 184, 185]). Touch nothing else: no status change, no exit-criterion status change, no progress_note.'
- rec-3153 -- scripts.ops_data_portal update_rec, context re-pointed to first_of(grant widening lands, first commercial sale,
  Apache flip). Status stays open.
- Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
- 'Report: what was implemented, verification results'
