    Decision-scout FLAGS_FOUND (t1-17-c2-decision-scout-r1-b25d8e04; D146 SPIRIT NOTE resolved in staged_c2_closeout).
    CITE: 177, 178, 86, 136. Decisions triaged: 163 of 163. Roadmap items intersected: 0; CONFLICT: 0; RELATED: 0
  - "gates: decision-scout=FLAGS_FOUND; step-6b=stand-in A; plan-critique=PROCEED after 2 rounds (t1-17-c2-plan-critique-r2-7c41e9b3); report-critique=PENDING"
  - >-
    Freshness gate: (1) not complete (VP 1); (2) inline method retired by D177 -> re-grounding staged; c3's
    INTENT file gone (flagged to c3); (3) partial absorption by dcg-decisions-index; (4) no gating CD or gate.
  - >-
    staged_c2_closeout (operator-applied, never by this plan): c2 open -> met; met_by: dcg-decisions-index; text ->
    "Archived-decision citations resolve mechanically: every number archived by the Wave-2 move (23, 40, 42, 49,
    68, 71) carries live false and superseded_by in docs/decisions-index.json, and decision-scout reads a
    currency-less row as archived. In-body prose annotation is deliberately not done: Decision 177 retired the
    mid-line splice, and dated trailers would restate index-derived data in the corpus. For Decision 146's
    per-entry test, index resolution counts as the superseded mention. Residual: 28 bare prose citations (14 live
    in 9 entries, 14 archive in 11), all historical, Acknowledges or Related-list entries except Decision 72's
    Problem and Rationale, which cite Decision 71 as the infrastructure 72 reuses. rec-2057/2058/2059/2496 are
    not satisfied by this and stay open." Original wording -> dated bullet appended to T1.17 progress_note,
    with the parked status transition below (complete branch: commit body instead); regenerate .secrets.baseline
    in the same commit. Operator scope decision, not narrowing to green (D181); freshness-gate micro-commit branch.
  - >-
    fork: settle c2 by index-resolution evidence (A), live-entry trailers (B1), or live+archive trailers (B2) |
    chosen: A for this plan's shape; B1/B2 recorded in constraints.alternative_b_trailer_set | class: asked |
    precedent: exit-criteria-ledger.yaml realized-differently rule; R2 stand-in 2026-10-01, delegated authority
    (gates/t1-17-c2-step-6b-stand-in-r1.md) | precedent_kind: contract | reversible: yes | persisted: plan_type
  - >-
