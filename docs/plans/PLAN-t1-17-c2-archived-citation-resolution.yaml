    CITE: 177, 178, 86, 136. Decisions triaged: 163 of 163. Roadmap items intersected: 0; CONFLICT: 0; RELATED: 0
  - "gates: decision-scout=FLAGS_FOUND; step-6b=stand-in A; plan-critique=PROCEED after 2 rounds; report-critique=PROCEED after 3 rounds (t1-17-c2-report-critique-r3-e15d7a28)"
  - "Freshness gate: (1) open (VP 1); (2) method retired by D177, re-ground staged; c3 INTENT file gone; (3) partial; (4) none"
  - >-
    staged_c2_closeout (operator-applied, never by this plan): c2 open -> met; met_by: dcg-decisions-index; text ->
    "Archived-decision citations resolve by index lookup: each number archived by the Wave-2 move (23, 40, 42,
    49, 68, 71) carries live false and superseded_by in docs/decisions-index.json (dcg-decisions-index,
    decision-scout-bounded-retrieval), and decision-scout triage reads a currency-less row as archived
    (decision-corpus-currency). In-body annotation is deliberately not done: Decision 177 retired the mid-line
    splice, and trailers would restate index data. Residual at 51253cdd, per this plan's VP 1: 28 'Decision
    N'-form bare citations (14 live in 9 entries, 14 archive in 11). The 14 live cites are all Related,
    Acknowledges, Context or [DONE]-step lines except Decision 72's Problem and Rationale, which cite Decision
    71 as infrastructure 72 reuses; the 14 archive cites sit in historical archived entries; Decision 149 also
    carries a '37/40' shorthand. For those in-corpus mentions only, index lookup is read as the Decision 146
    superseded mention; docs/contracts/inference-provider.yaml:87-88 (live constraint) and :375 (bare
    reference) still cite Decision 49 and are out of scope. rec-2057/2058/2059/2496 are not satisfied and stay
    open." Old wording -> dated progress_note bullet + parked status transition (complete: commit body); note
    files_in_scope still names DECISIONS*.md; regenerate .secrets.baseline. Operator scope call, not D181 narrowing.
  - >-
    fork: settle c2 by index-resolution evidence (A), live-entry trailers (B1), or live+archive trailers (B2) |
