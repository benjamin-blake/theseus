schema_version: 5
slug: "t1-17-c2-archived-citation-resolution"
intent: >-
  Settle T1.17 exit criterion c2 (Wave-2 citation sweep) without growing the decision corpus with derived
  data: re-derive, as executable evidence, that every citation of the 6 archived decisions already resolves
  mechanically to its superseder through docs/decisions-index.json, that Decision 177 retired the mid-line
  splice the criterion's literal method needs, and stage a re-grounded criterion text plus closeout for the
  operator. Nothing is implemented and no criterion is flipped.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-t1-17-c2-archived-citation-resolution.yaml
phase: >-
  Platform tier T1, tier_item T1.17 (Decision-log premise-integrity audit follow-ups), criterion c2 only --
  the second of four per-criterion plans (decomposition_hints.splits: 4). c1 (DPI-06), c3 (D40 -> Decision
  122 in the INTENT doc) and c4 (guard hardening) are separate plans and out of scope.
scope:
  - file: docs/plans/PLAN-t1-17-c2-archived-citation-resolution.yaml
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; precedent the c1 sibling plan). Carries the citation
      census and the mechanical-resolution evidence as executable VP steps, the staged c2 re-grounding and
      closeout (context: staged_c2_closeout), and the fully enumerated alternative-B trailer set
      (constraints: alternative_b_trailer_set) so the operator can choose B without re-deriving. No code,
      contract, roadmap or DECISIONS file changes.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The bare-citation census is re-derived from the shared decisions_md grammar and states the residual
    honestly: 14 bare citations in 9 live entries and 14 in 11 archive entries remain un-annotated in prose
    (VP step 1).
  - >-
    Every one of the 6 archived decisions (23, 40, 42, 49, 68, 71) resolves mechanically: its
    docs/decisions-index.json row is live false with superseded_by equal to the archive header of record and
    no currency key (VP step 2).
  - >-
    The decision-scout consumer contract treats an index row with no currency key as archived, so no gate
    consumer reads an archived number as live (VP step 3).
  - >-
    Decision 177's post-lock correction dialect retires the mid-line splice, so the criterion's literal
    inline '(superseded by NN)' method is no longer a sanctioned edit shape (VP step 4).
  - >-
    The staged closeout's met_by resolves (docs/plans/PLAN-dcg-decisions-index.yaml exists, the predicate
    validate_platform_roadmap (i) applies to met_by) (VP step 5).
  - The plan validates against the PlanDocument schema (VP step 6).
  - >-
    The branch diff against origin/main is exactly this plan file -- no roadmap, code, contract or DECISIONS
    edit, and no closes_criteria entry (VP step 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Re-derive the bare-citation census of the 6 archived decisions across both corpus files
    command: >-
      bin/venv-python -c "import re,pathlib,collections; from scripts.decisions_md import _iter_decision_sections as it;
      A={23:76,40:122,42:90,49:116,68:112,71:73}; R=re.compile(r'\bDecisions?\s+(23|40|42|49|68|71)\b(?!\.\d)');
      H=[(f.split('/')[-1],int(h.group(1)),int(m.group(1)),l) for f in ('docs/DECISIONS.md','docs/DECISIONS_ARCHIVE.md')
      for h,b in it(pathlib.Path(f).read_text(encoding='utf-8')) for l in b.splitlines() for m in R.finditer(l)
      if int(m.group(1))!=int(h.group(1))];
      k=lambda f,o,n,l: 'annotated' if re.search(r'superseded by (Decision )?%d\b'%A[n],l,re.I) else 'superseder_block'
      if o==A[n] else 'heading' if l.lstrip().startswith('#') else 'bare_'+('live' if f=='DECISIONS.md' else 'archive');
      C=collections.Counter(k(*x) for x in H); print(' '.join(f'{a}={C[a]}' for a in
      ('bare_live','bare_archive','superseder_block','annotated','heading')))"
    expected: >-
      One line of five counts. At cacdb84f: bare_live=14 bare_archive=14 superseder_block=13 annotated=4
      heading=1 (citations inside the superseder's own block, and heading lines per Decision 177 cl.3, are
      exempt). The bare counts are the residual the staged closeout names; they are evidence, not a gate.
    fix_if: >-
      A different bare count means the corpus moved since drafting -- update the census figures in
      staged_c2_closeout and alternative_b_trailer_set, then re-run. The regex is not list-aware (a
      "Decisions 37, 40, 49" form is skipped); the one such cite today is the heading-exempt Decision 52
      archive header, so a reuse of this step on a body list-form cite would under-count.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Census of a corpus that every DECISIONS*.md edit moves; the counts are point-in-time evidence for the
      staged closeout, not a standing invariant to register.
  - step: 2
    phase: pre-deploy
    action: Prove each archived decision resolves mechanically to its header-of-record superseder via the index
    command: >-
      bin/venv-python -c "import json,re,pathlib; from scripts.decisions_md import _iter_decision_sections as it;
      A={23:76,40:122,42:90,49:116,68:112,71:73};
      I={e['number']:e for e in json.load(open('docs/decisions-index.json'))['decisions']};
      hdr={int(h.group(1)):int(re.search(r'\(Superseded by Decision (\d+)\)',h.group(0)).group(1))
      for h,b in it(pathlib.Path('docs/DECISIONS_ARCHIVE.md').read_text(encoding='utf-8')) if int(h.group(1)) in A};
      ok=[n for n in A if I[n]['live'] is False and I[n]['superseded_by']==A[n]==hdr.get(n) and 'currency' not in I[n]];
      print(f'resolved={len(ok)}/{len(A)}')"
    expected: One line reporting all six archived decisions resolved.
    fix_if: >-
      Fewer than six resolved means the index or an archive header drifted -- the mechanical-resolution claim
      fails for that number; stop and re-open the A/B fork (alternative B) instead of staging the closeout.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates standing guards: validate_decision_currency and the decisions-index freshness check already
      hold the committed index in lockstep with both corpus files on every DECISIONS*.md change.
    expected_literals: ["resolved=6/6"]
  - step: 3
    phase: pre-deploy
    action: Confirm the decision-scout consumer contract reads a currency-less index row as archived
    command: >-
      bin/venv-python -c "import pathlib; s=pathlib.Path('.claude/skills/decision-scout/SKILL.md').read_text(encoding='utf-8');
      print('scout_archived_clause=' + ('present' if 'No \`currency\` key = archived, out of scope' in s else 'absent'))"
    expected: One line reporting the archived clause present.
    fix_if: >-
      Absent means the gate consumer no longer distinguishes archived rows -- the absorption argument fails;
      stop and report.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_decision_currency I5 pins the adjacent currency clauses and I2 pins the index side (no currency key
      on live false rows); this sentence itself is unguarded, recorded here for the operator rather than
      graduated, since a graduate row is green-by-construction on a plan-only tree (Decision 189).
    expected_literals: ["scout_archived_clause=present"]
  - step: 4
    phase: pre-deploy
    action: Confirm Decision 177 retires the mid-line splice (the criterion's literal edit shape)
    command: >-
      bin/venv-python -c "import pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      b=t[t.index('## Decision 177:'):]; b=b[:b.index(chr(10)+'---'+chr(10))];
      print('d177_midline_splice_retired=' + str('Two micro-shapes are retired:** the' in b and 'mid-line splice' in b))"
    expected: One line reporting the retirement clause found inside the Decision 177 block.
    fix_if: >-
      False means Decision 177's dialect changed -- re-read it before choosing between A and B.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A textual pin on a ratified Decision body; Decision 177 itself is append-only policy, so a registry row
      would re-assert ratified text and add no independent signal.
    expected_literals: ["d177_midline_splice_retired=True"]
  - step: 5
    phase: pre-deploy
    action: Confirm the staged closeout's met_by plan exists
    command: test -f docs/plans/PLAN-dcg-decisions-index.yaml
    expected: Exits 0 (the met_by plan file exists).
    fix_if: Missing means the met_by target moved; re-point met_by to the plan that built the index rows.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_platform_roadmap (i) already applies this exact existence predicate to every met_by once the
      operator lands the staged edit; a registry row would duplicate it.
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-t1-17-c2-archived-citation-resolution.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly this plan file (no roadmap, code, contract or DECISIONS edit)
    command: git fetch origin main:refs/remotes/origin/main --quiet && git diff --name-only origin/main...HEAD
    expected: Exactly one path is listed, docs/plans/PLAN-t1-17-c2-archived-citation-resolution.yaml, and nothing else.
    fix_if: >-
      Any other path means scope leaked; revert it (the c2 closeout is staged in context, applied only by the
      operator).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan file.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    No tier-item or criterion status flip, no closes_criteria entry, no ratification (project charter never-list;
    Decision 136: only /implement flips criteria, and only those a plan names in closes_criteria).
  - >-
    No docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md edit under this plan (Decision 177 append-only policy,
    policy-only since Decision 178 cl.3 retired its guard; the unattended-week charter forbids editing
    docs/DECISIONS.md). Alternative B, if the operator chooses it, is a revised IMPLEMENTATION plan executed only with the operator present.
  - >-
    docs/ROADMAP-PLATFORM.yaml stays out of scope: it is packaged into the active data-pipeline Lambda
    (Decision 79/125 deploy obligation); the c2 re-grounding and closeout are staged here for the operator.
  - >-
    No new standing prose doc and no companion report file (Decision 86 cl.2; AGENTS.md Agent-First): this plan
    file is the sole deliverable.
  - >-
    rec-2057/2058/2059/2496 are neither bundled nor closed: the recs cache is absent in this sandbox
    (preflight recs_read_status=reader_unreachable), so the recommendation-relevance gate cannot run. The
    audit puts rec-2057/2058/2059 on other decisions (audits/decision-log-premise-integrity-8fb581e.yaml:376);
    rec-2496's scope could not be verified in this sandbox (no repo reference outside c2's text); it stays open.
  - "No new recommendations (T1.17 provenance -- the originating /overseer run no-new-recs constraint)."
  - >-
    Order-of-operations (gates/t1-17-c1-plan-critique-r1-8e36b4d1.md): critique 12l binds IMPLEMENTATION plans
    only, so this REPORT-ONLY plan is valid with T1.17 not_started or in_progress and declares no
    closes_criteria either way. Alternative B is IMPLEMENTATION: once T1.17 is in_progress it MUST declare
    closes_criteria [T1.17:c2], whose flip stays operator-only (charter never-list).
  - >-
    alternative_b_trailer_set (operator-only; the shape B must take if chosen): one dated trailing-bracket
    amendment line (decision-entry.yaml amendment_forms.trailing_bracket) per entry, bare-number form
    '(superseded by NN)' so no new 'Decision NNN' substring reaches a block (keeps
    validate_supersession_annotations._is_annotated unchanged) and no 'supersedes/amends Decision N' phrase
    (keeps _EDGE_RE edges unchanged). Live (9): 25<-23, 41<-40, 43<-42, 60<-68, 72<-68+71, 73<-68, 74<-68,
    89<-68, 133<-40. Archive (11, optional): 26<-42, 28<-23, 42<-40, 45<-42, 46<-42, 47<-40, 49<-40, 50<-49,
    52<-49, 54<-49, 71<-68. Requires a post-merge ops_data_portal --backfill-decisions-md run (agent_platform).
  - No rescue agents or workaround loops (Decision 55).
context:
