    precedent_kind: decision | reversible: yes | persisted: staged_c2_closeout
  - >-
    fork: apply the c2 closeout and the T1.17 status transition (not_started -> in_progress + progress_note,
    or complete if c1/c3/c4 met, per bookkeeping_walk; note D72 Rationale cites D71 bare), or run B1/B2 |
    chosen: PARKED (operator; MEMORY.md#parked R2) | class: asked | precedent: none | precedent_kind: none |
    reversible: yes | persisted: staged_c2_closeout, MEMORY.md#parked
pre_implementation_checklist:
