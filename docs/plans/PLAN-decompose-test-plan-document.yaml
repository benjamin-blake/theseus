rollback: >-
  Single-commit revert restores tests/test_plan_document.py and the pre-repoint registry.
  Reverting is safe at any point: the _CONCERN_SPLIT_TEST_PACKAGES entry and the test package
  are only coherent together, so a partial revert must undo both (leaving the entry without the
  package fails validate_test_coverage with "missing test package: tests/roadmap/plan_document";
  leaving the package without the entry is harmless but leaves the monolith authoritative). The
  11 registry repoints are independently revertible -- they touch no code path, only graduated
  check targets. The 2 graduated rows must be reverted together with the tests they name,
  otherwise validate_verification_registry fails on a node_id that no longer resolves.
