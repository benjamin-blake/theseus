      exits 0.
    fix_if: >-
      At or above 6000. Do NOT raise the budget in config/structural_size_budgets.yaml --
      Decision 166 point 6 pre-commits the response to the CD.29 mark-then-drop archival
      lifecycle, NEVER a second raise. This plan adds only 2 rows against 345 lines of headroom,
      so exceeding the cap means far more was appended than planned; remove the excess.
