    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an existing standing guard: the 6000-line ceiling is already declared in
      config/structural_size_budgets.yaml:184 and enforced on every PR by the structural-size
      check, so a registry row asserting the same bound would guard nothing new -- and would
      itself consume the headroom it measures.
