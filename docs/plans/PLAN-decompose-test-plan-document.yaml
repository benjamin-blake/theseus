schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decompose-test-plan-document"
intent: >-
  Decompose tests/test_plan_document.py (495/500 SLOC, unregistered) into its mirror-convention
  concern-split test package tests/roadmap/plan_document/, so PLAN-plan-resolution-content-keyed
  has headroom to add coverage for a new PlanDocument field without a budget raise, and repoint
  every graduated verification-registry row left dangling by this and five prior test moves.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decompose-test-plan-document.yaml
phase: >-
  Platform maintenance -- Decision 128 decompose-by-default test-SLOC debt, off-roster voluntary
  wave (the rec-2709 24-home roster is retired; this file was never on it).
scope:
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Add "scripts/roadmap/plan_document.py" to _CONCERN_SPLIT_TEST_PACKAGES (the frozenset at
      line 209) so map_source_to_test resolves the source to the test PACKAGE DIRECTORY
      tests/roadmap/plan_document via rule 3 (DIRECT CONCERN-SPLIT, line 352) rather than the
      flat file tests/test_plan_document.py. One line added to the set literal; no logic change.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Add a mirror-test case asserting map_source_to_test(scripts/roadmap/plan_document.py)
      resolves to tests/roadmap/plan_document, following the existing
      test_maps_scripts_sync_ops_to_concern_split_package pattern. This is the red/green
      evidence for the scope row above and the guarded node of graduated check
      plan-document-concern-split-mapping.
  - file: tests/roadmap/__init__.py
    action: Create
    purpose: >-
      Mirror test package init (Decision 131: every mirror test directory carries an
      __init__.py for prepend import mode). tests/roadmap/ does not exist yet.
  - file: tests/roadmap/plan_document/__init__.py
    action: Create
    purpose: Mirror test package init for the concern-split package itself (Decision 131).
  - file: tests/roadmap/plan_document/test_schema.py
    action: Create
    purpose: >-
      Relocated verbatim: TestPlanDocumentSchema, TestSchemaVersion2, TestSchemaVersion3
      (29 tests, ~182 lines).
  - file: tests/roadmap/plan_document/test_loader_cli.py
    action: Create
    purpose: >-
      Relocated verbatim: TestLoader, TestCli, TestValidateIntegration (11 tests, ~99 lines).
  - file: tests/roadmap/plan_document/test_optional_fields.py
    action: Create
    purpose: >-
      Relocated: TestClosesCriteria, TestGraduationDisposition, TestFallbackReevaluation
      (36 tests, ~259 lines). This is the module PLAN-plan-resolution-content-keyed will extend,
      so it is deliberately kept the smallest of the three multi-class modules.
  - file: tests/roadmap/plan_document/test_obligations.py
    action: Create
    purpose: >-
      Relocated verbatim: TestTestObligations (23 tests, ~116 lines). Peeled into its own module
      rather than left in test_optional_fields.py so the module the downstream plan extends keeps
      the most headroom -- the split's entire purpose.
  - file: tests/fixtures/plan_document_helpers.py
    action: Create
    purpose: >-
      Home the four shared helpers (_base, _base_v2, _mutate, _mutate_v2) plus the re-rooted
      FIXTURES and REPO_ROOT constants. tests/CLAUDE.md forbids cross-test imports;
      tests/fixtures/ is exempt by construction (names never start with test_). Direct
      precedent: tests/fixtures/ops_writer_helpers.py (rec-2709 Wave 9).
  - file: tests/test_plan_document.py
    action: Delete
    purpose: >-
      Superseded by the package above. Deleted LAST, only after all 99 relocated tests pass in
      their new homes.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Repoint 11 graduated rows whose check_spec names a test path that no longer exists (4
      created by this plan's Delete row, 7 pre-existing across five earlier test moves), and add
      the 2 rows this plan graduates. Repoints are edited IN PLACE -- check_id stays stable.
      Bundles rec-3076.
  - file: tests/validate/test_driver_seam.py
    action: Modify
    purpose: >-
      Two edits to IN_SCOPE_PATHS. (1) Line 43 carries the literal "tests/test_plan_document.py"
      from a prior plan's scope manifest -- replace it with the four new module paths so a
      repo-wide live-code sweep can assert zero references. Verified behaviourally inert: no
      registry row carries tests/test_plan_document.py as its guard_target, so _in_scope_rows
      selects nothing different either way. (2) ADD "scripts/roadmap/plan_document.py", which is
      NOT currently present -- this is load-bearing, not cosmetic: it brings the four repointed
      plan_document rows under TestRegistryRows' standing re-collection guard (five once this
      plan's second graduated row lands), partially closing the Decision 132 modified-row gap
      otherwise deferred to rec-3119. Note the fifth row sharing that guard_target,
      plan-document-fallback-reevaluation-schema, enters _in_scope_rows but carries no harvestable
      node_id (command_exit_zero over bin/venv-python -c), so it is NOT re-collected. VP step 3
      asserts this string landed, because nothing else in the plan fails if it does not.
bundled_recommendations:
  - rec-3076
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    map_source_to_test(Path("scripts/roadmap/plan_document.py")) resolves to
    tests/roadmap/plan_document, and check_test_file_exists returns (True, "test package found").
  - >-
    tests/roadmap/plan_document/ collects exactly 99 tests -- the same count
    tests/test_plan_document.py collects on origin/main -- split 29 (test_schema.py) /
    11 (test_loader_cli.py) / 36 (test_optional_fields.py) / 23 (test_obligations.py), and all
    99 pass.
  - >-
    Every one of the ten relocated classes appears exactly once across the four new modules;
    no class is dropped, duplicated, or renamed.
  - >-
    TestFallbackReevaluation::test_all_historical_plans_still_valid_with_field_absent carries an
    in-test floor assertion proving it globbed the real docs/plans corpus (300+ PLAN-*.yaml), so
    the vacuous-empty-glob failure mode is guarded durably rather than only at implement time.
  - >-
    config/agent/verification_registry/registry.yaml references none of the five deleted test
    paths this plan repoints, and every repointed node_id both collects AND passes under pytest.
    The sixth dangling path (tests/test_ops_data_portal.py, held by the superseded
    ci-rca-close-then-recur-reopen-backstop row) is deliberately excluded and tracked by a newly
    filed recommendation instead.
  - >-
    Each new module is under 500 SLOC; config/sloc_budgets.yaml gains no entry, no raised entry,
    and no raise-approved marker (Decision 128 / Decision 165).
  - >-
    config/agent/verification_registry/registry.yaml stays under its 6000 effective-line
    structural budget (config/structural_size_budgets.yaml:184) after the 2 graduated rows land.
  - >-
    Two recommendations are filed and their ids recorded in the PR body: one for
    ci-rca-close-then-recur-reopen-backstop (guarded method exists nowhere; NOT mechanically
    repointed) and one for the ci-rca-workflow-count-drift-no-hardcoded-len fidelity narrowing.
  - >-
    tests/validate/test_driver_seam.py's IN_SCOPE_PATHS contains
    "scripts/roadmap/plan_document.py" and no longer contains "tests/test_plan_document.py".
  - The full validate tier passes end to end.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Assert the concern-split registration resolves the source to the test PACKAGE DIRECTORY
      and that the package satisfies check_test_file_exists. Guards the affected_tests.py:275
      consumer too -- a wrong mapping silently drops these tests from the --pre affected set.
    command: 'bin/venv-python -c "from pathlib import Path; from scripts.test_coverage_checker import map_source_to_test, check_test_file_exists; import sys; m=map_source_to_test(Path(''scripts/roadmap/plan_document.py'')); ok,why=check_test_file_exists(Path(''scripts/roadmap/plan_document.py'')); print(m, ok, why); sys.exit(0 if str(m).replace(chr(92),''/'').endswith(''tests/roadmap/plan_document'') and ok else 1)"'
    expected: >-
      Prints a path ending tests/roadmap/plan_document, then True and "test package found";
      exits 0.
    fix_if: >-
      Exits 1 with "missing test package: tests/roadmap/plan_document" -- the entry was added to
      _CONCERN_SPLIT_TEST_PACKAGES before the package directory existed with >=1 test_*.py.
      Create the package first, then re-run. If it still ends tests/test_plan_document.py, the
      set entry is missing or misspelled (it must be the exact repo-relative POSIX string
      "scripts/roadmap/plan_document.py").
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Not declined on merit -- this behaviour IS graduated, by step 2, whose registry row
      (plan-document-concern-split-mapping) guards the same mapping through the pytest case that
      asserts it. Graduating this shell one-liner as well would bank two rows proving one fact.
      Step 2 is the better carrier because it fails through the test suite the repo already runs,
      rather than through a quoting-fragile inline python -c.
  - step: 2
    phase: pre-deploy
    action: >-
      Run the coverage-checker map suite. This is the focused red/green evidence for the
      scripts/test_coverage_checker.py test obligation: the new case fails without the
      _CONCERN_SPLIT_TEST_PACKAGES entry and passes with it.
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_map.py -q
    expected: All cases pass, including the new plan_document concern-split mapping case.
    fix_if: >-
      The new case failing with a path ending tests/test_plan_document.py means the
      _CONCERN_SPLIT_TEST_PACKAGES entry is missing or misspelled. A failure in a PRE-EXISTING
      case means the entry disturbed an unrelated mapping -- verify plan_audit.py and
      find_plan.py still resolve to their flat homes.
    hermetic: false
    graduation: graduate
    graduation_check_id: plan-document-concern-split-mapping
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the mirror package carries its __init__.py files at BOTH levels (Decision 131), that
      the four concern modules exist, AND that the load-bearing IN_SCOPE_PATHS addition landed in
      tests/validate/test_driver_seam.py -- asserted by importing the frozenset and testing
      MEMBERSHIP, not by grepping the file, so adding the path in a comment cannot false-pass. That last assertion exists because nothing else in this
      plan fails without it: IN_SCOPE_PATHS has exactly one consumer (_in_scope_rows, which
      filters on guard_target), so TestRegistryRows passes either way -- it just silently covers
      fewer rows, which is precisely the declared-but-unexecuted shape Decision 163 names.
    command: 'bin/venv-python -c "import pathlib,sys; need=[''tests/roadmap/__init__.py'',''tests/roadmap/plan_document/__init__.py'',''tests/roadmap/plan_document/test_schema.py'',''tests/roadmap/plan_document/test_loader_cli.py'',''tests/roadmap/plan_document/test_optional_fields.py'',''tests/roadmap/plan_document/test_obligations.py'']; missing=[p for p in need if not pathlib.Path(p).is_file()]; from tests.validate.test_driver_seam import IN_SCOPE_PATHS as _isp; missing += [] if ''scripts/roadmap/plan_document.py'' in _isp else [''IN_SCOPE_PATHS missing scripts/roadmap/plan_document.py'']; print(''missing:'',missing); sys.exit(1 if missing else 0)"'
    expected: 'Prints "missing: []" and exits 0.'
    fix_if: >-
      Any path listed. tests/roadmap/ is a NEW directory -- both its own __init__.py and the
      nested plan_document/__init__.py are required; creating only the inner one leaves
      tests.roadmap a namespace package and breaks prepend-import-mode collision-freedom.
      "IN_SCOPE_PATHS missing scripts/roadmap/plan_document.py" means execution step 13 was only
      half-applied (the replace landed, the add was dropped) -- add the string; it is what puts
      the repointed rows under the standing re-collection guard.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Close to a file_presence shape, but that slot takes a single path and this asserts six
      paths plus a string membership; more importantly the durable form is already enforced --
      Decision 131's __init__.py requirement and the package's existence are checked repo-wide by
      validate_test_coverage (which fails with "missing test package" if the package is absent) on
      every PR. A registry row naming these paths would restate one-shot migration state.
  - step: 4
    phase: pre-deploy
    action: >-
      Assert the exact PER-MODULE 29 / 11 / 36 / 23 split and then run the whole relocated
      suite. The per-module counts are the point: a class misfiled into the wrong module still
      totals 99 and still passes, but silently erodes the headroom in test_optional_fields.py
      that this plan exists to create.
    command: 'bash -c ''fail=0; for pair in test_schema.py:29 test_loader_cli.py:11 test_optional_fields.py:36 test_obligations.py:23; do m=${pair%%:*}; e=${pair##*:}; n=$(bin/venv-python -m pytest tests/roadmap/plan_document/$m --collect-only -q 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+"); if [ "$n" != "$e" ]; then echo "MISMATCH $m expected $e got $n"; fail=1; else echo "OK $m=$n"; fi; done; bin/venv-python -m pytest tests/roadmap/plan_document/ -q || fail=1; exit $fail'''
    expected: >-
      Four OK lines (test_schema.py=29, test_loader_cli.py=11, test_optional_fields.py=36,
      test_obligations.py=23), then 99 passed; exits 0.
    fix_if: >-
      A MISMATCH line names the module and the delta -- a class landed in the wrong module. Move
      it to the grouping in the Scope table rather than adjusting the expected count; the counts
      are derived from the monolith and are correct (per-class: TestPlanDocumentSchema 14,
      TestSchemaVersion2 8, TestSchemaVersion3 7, TestLoader 4, TestCli 4,
      TestValidateIntegration 3, TestClosesCriteria 11, TestGraduationDisposition 12,
      TestFallbackReevaluation 13, TestTestObligations 23). A count of -1 or empty means the
      module failed to collect at all. Import errors on _base/_mutate mean the helper import from
      tests.fixtures.plan_document_helpers is missing or misaliased.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The 99 relocated tests are themselves the standing guard and run in the ordinary suite;
      what this step adds beyond that is the exact-99 migration-completeness assertion, which is
      deliberately transient -- the count legitimately changes the moment
      PLAN-plan-resolution-content-keyed adds its field coverage, so graduating it would hand
      that plan a spurious failure on its first commit.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the relocated historical-plans test is NON-VACUOUS at the source level: assert the
      module carries no surviving Path(__file__).parent.parent, does reference REPO_ROOT, and
      carries the in-test floor assertion. This checks the RELOCATED TEST itself rather than
      only the helper -- a correctly-rooted helper the test never uses would still glob empty.
    command: 'bin/venv-python -c "import pathlib,sys; t=pathlib.Path(''tests/roadmap/plan_document/test_optional_fields.py'').read_text(encoding=''utf-8''); bad=[]; (''parent.parent'' in t) and bad.append(''stale parent.parent survives''); (''REPO_ROOT'' not in t) and bad.append(''REPO_ROOT not referenced''); (''>= 300'' not in t) and bad.append(''in-test floor assertion missing''); print(''problems:'',bad); sys.exit(1 if bad else 0)"'
    expected: 'Prints "problems: []" and exits 0.'
    fix_if: >-
      "stale parent.parent survives" means the class was moved verbatim without the one permitted
      path rewrite -- from two directories deeper that expression resolves to tests/roadmap,
      whose docs/plans glob returns [], so validate_paths([]) reports no failures and the
      assertion passes VACUOUSLY against 0 plans instead of 337 (and climbing). Do NOT satisfy this step by
      deleting the assertion; re-root it on REPO_ROOT and add the floor.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-document-historical-plans-glob-non-vacuous
  - step: 6
    phase: pre-deploy
    action: >-
      Stale-reference sweep (Closure Obligation: this plan carries a Delete row). Assert the
      verification registry references NONE of the five deleted test paths this plan repoints --
      the one it deletes plus four already dangling.
    command: 'bin/venv-python -c "import pathlib,sys; t=pathlib.Path(''config/agent/verification_registry/registry.yaml'').read_text(encoding=''utf-8''); dead=[''tests/test_plan_document.py'',''tests/test_ci_rca_taxonomy.py'',''tests/checks/test_validate_deploy_channel_conformance.py'',''tests/checks/test_validate_prose_allowlist.py'',''tests/test_ci_rca_evidence.py'']; hits={d:t.count(d) for d in dead}; print(hits); sys.exit(0 if not any(hits.values()) else 1)"'
    expected: >-
      All five counts 0; exits 0. (Baseline before the fix: tests/test_plan_document.py 4,
      tests/test_ci_rca_taxonomy.py 5, the others 1 each.)
    fix_if: >-
      Any non-zero count names a row still pointing at a deleted file. Note
      tests/test_ci_rca_evidence.py must not be confused with the live
      tests/test_ci_rca_evidence_ast.py / _input.py -- use exact-string counting, and beware that
      substring counting makes tests/test_ops_data_portal.py unusable here (it is a prefix of the
      live tests/test_ops_data_portal_decisions.py), which is why that path is verified by
      step 7 instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as a grep_count slot (count 0), but this asserts the absence of five
      specific historical strings -- a one-shot migration-completeness check on this session's
      transient repo state, not a durable behavioural invariant. The general, durable form of
      this guard (re-prove rows whose target moved) is exactly the systemic gap already tracked
      by rec-3119; graduating this narrow five-string variant would bank a check that goes stale
      the next time a test file legitimately moves.
  - step: 7
    phase: pre-deploy
    action: >-
      Assert every registry check_spec test path resolves on disk, EXCLUDING the one row whose
      guarded behaviour is superseded and which this plan deliberately does not repoint. This is
      the general form of step 6 and covers tests/test_ops_data_portal.py, which substring
      counting cannot check safely.
    command: 'bin/venv-python -c "import yaml,pathlib,sys; SUPERSEDED={''ci-rca-close-then-recur-reopen-backstop''}; d=yaml.safe_load(pathlib.Path(''config/agent/verification_registry/registry.yaml'').read_text(encoding=''utf-8'')); bad=[]; [bad.append((r[''check_id''],t)) for r in d[''entries''] if r[''check_id''] not in SUPERSEDED for t in ([ (r.get(''check_spec'') or {}).get(''node_id'','''').split(''::'')[0] ] + [ (r.get(''check_spec'') or {}).get(''path'','''') ] + [ x.split(''::'')[0] for x in ((r.get(''check_spec'') or {}).get(''command'') or []) if isinstance(x,str) and x.startswith(''tests/'') ]) if t and t.startswith(''tests/'') and not pathlib.Path(t).exists()]; print(''dangling:'',bad); sys.exit(1 if bad else 0)"'
    expected: >-
      Prints "dangling: []" and exits 0. Baseline before the fix: 8 rows across 5 paths
      (7 excluding the superseded row); after the 11 repoints, zero.
    fix_if: >-
      Any (check_id, path) pair printed. The single SUPERSEDED exclusion is deliberate and its
      replacement is the recommendation filed in execution -- record that rec id in the PR body.
      Do NOT widen the SUPERSEDED set to make this step pass; every other dangling row in this
      repo has a verified live target. If ci-rca-close-then-recur-reopen-backstop appears
      despite the exclusion, the check_id was altered -- restore it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This IS a durable invariant and the strongest non-graduated candidate here, but it is not
      expressible in a single canonical primitive slot -- it requires parsing YAML, walking three
      heterogeneous check_spec shapes (node_id, path, command list), stat-ing each token, and
      carrying a superseded-row exclusion set. That is a check module, not a command_exit_zero
      one-liner, and standing it up properly is precisely the deliverable rec-3119 already
      tracks; graduating a shell-quoted one-liner here would pre-empt that design with a fragile
      duplicate that also hard-codes this plan's exclusion set.
  - step: 8
    phase: pre-deploy
    action: >-
      Assert the 9 pytest-node repoints both COLLECT and PASS. (The other 2 repoints -- the
      grep_count row's path and the syspath row's directory token -- carry no pytest node and are
      covered by step 7's existence check only.) Decision 132's differential admission gate keys
      on check_id, so in-place repoints are structurally outside it; this step is the
      compensating evidence, and it runs the nodes rather than merely collecting them.
    command: 'bin/venv-python -m pytest "tests/roadmap/plan_document/test_obligations.py::TestTestObligations" "tests/roadmap/plan_document/test_schema.py::TestSchemaVersion3" "tests/roadmap/plan_document/test_schema.py::TestSchemaVersion2::test_v2_phase_pre_merge_rejected" "tests/roadmap/plan_document/test_optional_fields.py::TestGraduationDisposition" "tests/ci_rca/taxonomy/test_load_and_classify.py::TestEnumerateWorkflowNames::test_real_workflows_dir" "tests/ci_rca/taxonomy/test_convergence.py::TestConvergenceFingerprintDistinctness::test_distinct_fingerprints_across_convergence_starved_environment" "tests/ci_rca/evidence/test_fingerprint.py::TestBundleEmissionFanOut::test_single_failing_check_emits_exactly_one_bundle" "tests/checks/ops_governance/test_validate_deploy_channel_conformance.py" "tests/checks/hygiene/test_validate_prose_allowlist.py" -q'
    expected: All collected and passing; exit 0.
    fix_if: >-
      An "ERROR: not found" names a repoint target that does not exist -- re-locate the class or
      method with grep before editing the row, never guess from the old path. A collected-but-
      failing node means the repoint aimed at a real node that does not actually guard the row's
      stated guard_target behaviour; re-read that row's guard_target and pick the node that does.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      No red/green is obtainable, and this step's own node list is this migration's exact repoint
      set -- a registry row restating it would go stale the next time any of those tests moves.
      But a durable form IS partly available and this plan takes it rather than deferring wholly
      to rec-3119: adding "scripts/roadmap/plan_document.py" to IN_SCOPE_PATHS in
      tests/validate/test_driver_seam.py brings the FOUR repointed plan_document rows under
      TestRegistryRows::test_in_scope_node_ids_still_collect_under_pytest, which re-collects every
      in-scope row carrying a harvestable node_id on every run (rising to five once graduated row
      plan-document-historical-plans-glob-non-vacuous lands, since it carries a node_id).
      scripts/test_coverage_checker.py is ALREADY in that frozenset, so graduated row
      plan-document-concern-split-mapping inherits the same guard for free. Precisely NOT covered:
      the pre-existing plan-document-fallback-reevaluation-schema shares that guard_target and so
      enters _in_scope_rows, but it is a command_exit_zero row whose command is
      ["bin/venv-python", "-c", ...] -- _collectible_node_ids harvests only a node_id or the first
      non-flag token after one ending in "pytest", so it yields nothing and is never re-collected
      (verified). Also uncovered: the seven repoints whose guard_targets sit outside the frozenset
      (the ci_rca and checks rows). Both remainders stay with rec-3119.
  - step: 9
    phase: pre-deploy
    action: >-
      Assert the SLOC outcome: each new module under 500, the monolith gone, and no budget
      entry or raise taken (Decision 128 decompose-by-default; Decision 165 raise markers).
    command: 'bin/venv-python -c "import pathlib,sys; s=lambda f: len([l for l in pathlib.Path(f).read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(chr(35))]); mods=[''tests/roadmap/plan_document/test_schema.py'',''tests/roadmap/plan_document/test_loader_cli.py'',''tests/roadmap/plan_document/test_optional_fields.py'',''tests/roadmap/plan_document/test_obligations.py'',''tests/fixtures/plan_document_helpers.py'']; sizes={m:s(m) for m in mods}; print(sizes); gone=not pathlib.Path(''tests/test_plan_document.py'').exists(); budg=pathlib.Path(''config/sloc_budgets.yaml'').read_text(encoding=''utf-8''); clean=''plan_document'' not in budg; print(''monolith_deleted'',gone,''no_budget_entry'',clean); sys.exit(0 if all(v<500 for v in sizes.values()) and gone and clean else 1)"'
    expected: >-
      All five sizes under 500 (projected ~182 / ~99 / ~259 / ~116 / small), monolith_deleted
      True, no_budget_entry True; exits 0.
    fix_if: >-
      A module at or above 500 means the split was uneven -- rebalance classes across the four
      modules; do NOT register a budget entry or add a raise-approved marker, which is the
      exact anti-pattern Decision 128 forbids. no_budget_entry False means someone ran
      --update-sloc-budgets; revert that hunk.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The durable half of this assertion is already enforced repo-wide by validate_sloc_limits
      and validate_sloc_budget_raises on every PR (Decision 128/165), which is strictly stronger
      than a registry row naming five paths. What remains here -- "the monolith is gone", "these
      five specific modules exist under budget" -- is one-shot migration state that stops being
      meaningful the moment this PR merges.
  - step: 10
    phase: pre-deploy
    action: >-
      Assert the registry stays within its structural budget after this plan's 2 graduated rows
      land, and that the superseded row was handled by filing a recommendation rather than a
      fabricated repoint.
    command: 'bin/venv-python -c "import pathlib,sys; p=pathlib.Path(''config/agent/verification_registry/registry.yaml''); eff=len([l for l in p.read_text(encoding=''utf-8'').splitlines() if l.strip() and not l.strip().startswith(chr(35))]); print(''effective'',eff,''budget 6000''); sys.exit(0 if eff<6000 else 1)"'
    expected: >-
