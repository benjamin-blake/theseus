schema_version: 4
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: verification-graduation-gate-fix
intent: Repair the verification-graduation differential admission gate so a check is admitted because it discriminates, never because the scratch worktree's interpreter could not start, and replace the gate's simulated-revert self-test with one that exercises the real worktree path.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-verification-graduation-gate-fix.yaml
phase: Platform hardening -- verification-gate fidelity (defect surface of T3.18/T3.21, both complete). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (rec-3333 + rec-3317).
scope:
- file: scripts/verification_graduation.py
  action: Modify
  purpose: git_worktree provisions the repo .venv into the scratch worktree when one exists; run_differential gains an ENVIRONMENT PROBE that, before attributing any revert-leg FAIL to content, proves the revert worktree could execute the check's interpreter(s) at all -- raising GraduationError if it could not.
- file: scripts/checks/verification/validate_differential_gate_baseline.py
  action: Modify
  purpose: Replace the hardcoded FAIL revert_runner with a real end-to-end run_differential probe (known-tautological -> REJECTED) plus a worktree/live interpreter-parity assertion.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: add scripts/verification_graduation.py to validate_differential_gate_baseline's pre_globs
- file: tests/verification_graduation/test_provisioning.py
  action: Create
  purpose: New module for provisioning / environment-probe / teardown-safety tests -- test_differential.py is 413/500 SLOC, so this is a decomposition, never a budget raise (Decision 128).
- file: docs/contracts/verification-registry.yaml
  action: Modify
  purpose: 'Four edits: (i) a governance_notes paragraph recording the admission-rule change (a revert-leg FAIL must now be proven runnable before it counts as discrimination); (ii) a governance_notes paragraph recording the ci-rca-lifecycle-records-watched-set repair and its check_id-retention argument -- the edit is claim-PRESERVING for the row''s named claim (all six keyword floor terms retained verbatim) and claim-ADDITIVE in that it introduces one new discriminating assertion, which is why the check_id is retained under this file''s line-33 rule; (iii) contract_version 5 -> 6; (iv) the paired amendment_log[] entry all four prior bumps carried.'
- file: config/agent/verification_registry/entries/ci-rca-lifecycle-records-watched-set.yaml
  action: Modify
  purpose: 'Repair the stale check_spec whose "''contract'' not in d" assertion has been false since commit eaff8043 (PR #895) seeded the Class D envelope; re-key it on the corrected trigger_scope text.'
- file: docs/contracts/ci-rca-lifecycle.yaml
  action: Modify
  purpose: Correct trigger_scope.pr_branch_disposition's false "no workflow_run event exists" claim, plus the amendment_log[] entry the Class D gate requires (Decision 168).
bundled_recommendations:
- rec-3333
- rec-3317
infrastructure_dependencies: []
acceptance_criteria:
- A tautological check_spec whose command invokes bin/venv-python is REJECTED by run_differential (it is admitted=True today).
- When the revert leg FAILs, the gate proves the scratch worktree could execute EVERY allowlisted interpreter token appearing anywhere in the check's command -- not merely argv[0] -- and raises GraduationError if any could not, instead of returning admitted=True.
- git_worktree symlinks .venv into the worktree only when repo_root has one; worktree teardown never deletes the real .venv.
- validate_differential_gate_baseline exercises a real git worktree via run_differential and contains no hardcoded-FAIL revert_runner.
- validate_differential_gate_baseline's pre_globs include scripts/verification_graduation.py.
- The repaired ci-rca-lifecycle-records-watched-set shard passes on HEAD and is admitted by the fixed gate with the corrected contract text as its sole discriminator.
- docs/contracts/ci-rca-lifecycle.yaml's trigger_scope no longer claims no workflow_run event exists, and carries a new amendment_log[] entry.
- docs/contracts/verification-registry.yaml carries contract_version 6, an amendment_log[] entry naming this plan, and a governance_notes record of the shard re-authoring.
- rec-3333 and rec-3317 are closed via the Resolves trailer.
- scripts/verification_graduation.py and tests/verification_graduation/*.py each stay <= 500 SLOC with no config/sloc_budgets.yaml raise.
verification_plan:
- step: 1
  phase: pre-deploy
  action: RED baseline -- reproduce the defect on the pre-fix code before changing anything.
  command: git stash list >/dev/null; bin/venv-python -c "from pathlib import Path; from scripts import verification_graduation as vg; row={'check_id':'red-probe','primitive_slot':'command_exit_zero','check_spec':{'command':['bin/venv-python','-c','print(1)']}}; o=vg.run_differential(row, repo_root=Path('.').resolve()); print('admitted=',o.admitted); raise SystemExit(0 if o.admitted else 1)"
  expected: Exit 0 printing admitted= True -- a pure tautology is admitted, confirming the defect is live before the fix.
  fix_if: If this exits 1 the defect is already absent; STOP and re-derive rather than writing a fix for a bug that is not there.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Asserts the presence of the very defect this plan removes. It is true only on pre-fix code, so graduating it would land a permanently-failing standing guard the moment the fix merges.
- step: 2
  phase: pre-deploy
  action: GREEN -- the same tautological bin/venv-python check_spec is now rejected.
  command: bin/venv-python -m pytest tests/verification_graduation/test_provisioning.py::TestProvisionedDifferential::test_tautological_venv_python_check_is_rejected -q
  expected: 1 passed -- run_differential returns admitted=False with a tautological reason.
  fix_if: 'Still admitted: the worktree is not being provisioned. Confirm git_worktree symlinks .venv and that the symlink resolves before the check runs.'
  hermetic: false
  graduation: graduate
  graduation_check_id: graduation-taut-venv-python-check-rejected
- step: 3
  phase: pre-deploy
  action: The environment probe turns an unrunnable-command FAIL into a loud error, never an admission.
  command: bin/venv-python -m pytest tests/verification_graduation/test_provisioning.py::TestEnvironmentProbe -q
  expected: All pass -- when the revert worktree cannot execute an interpreter referenced anywhere in the command (including one wrapped inside a bash body, not just argv[0]), run_differential raises GraduationError; the tests assert admitted=True is never returned on that path.
  fix_if: If admitted=True comes back, the probe is not gating the admission path. It must run whenever the revert leg FAILs, before the FAIL is attributed to content.
  hermetic: false
  graduation: graduate
  graduation_check_id: graduation-unrunnable-command-raises-not-admits
- step: 4
  phase: pre-deploy
  action: Provisioning is conditional, and teardown never destroys the real .venv.
  command: bin/venv-python -m pytest tests/verification_graduation/test_provisioning.py::TestWorktreeProvisioning -q
  expected: All pass -- no .venv in repo_root means no symlink and no crash; with one, teardown leaves a canary file under the real .venv intact.
  fix_if: If the canary disappears, teardown is following the symlink. Remove the symlink before git worktree remove, or assert shutil.rmtree does not follow it.
  hermetic: false
  graduation: graduate
  graduation_check_id: graduation-worktree-venv-provisioned-and-safe
- step: 5
  phase: pre-deploy
  action: The gate's own canary no longer simulates the revert leg.
  command: bin/venv-python -c "import pathlib; s=pathlib.Path('scripts/checks/verification/validate_differential_gate_baseline.py').read_text(encoding='utf-8'); assert 'simulated pre-change' not in s, 'hardcoded FAIL revert_runner still present'; assert 'run_differential' in s, 'canary does not call run_differential'; print('OK')"
  expected: Prints OK -- the hardcoded-FAIL revert_runner is gone and the canary calls run_differential.
  fix_if: If the string is still present the canary was not rewritten; replace the simulated runner with a real run_differential probe pair.
  hermetic: true
  graduation: graduate
  graduation_check_id: differential-canary-uses-real-worktree
- step: 6
  phase: pre-deploy
  action: The canary fires when the differential engine itself changes.
  command: bin/venv-python -c "from scripts.checks.verification._manifest import ENTRIES; e=[x for x in ENTRIES if x.name=='validate_differential_gate_baseline'][0]; assert any('verification_graduation' in g for g in e.pre_globs), e.pre_globs; print('OK')"
  expected: Prints OK -- scripts/verification_graduation.py is in the canary's pre_globs.
  fix_if: Add 'scripts/verification_graduation.py' to that Entry's pre_globs tuple.
  hermetic: true
  graduation: graduate
  graduation_check_id: differential-canary-globs-graduation-module
- step: 7
  phase: pre-deploy
  action: The repaired shard's assertion holds against the live tree.
  command: bin/venv-python -c "import yaml,subprocess,pathlib; r=yaml.safe_load(pathlib.Path('config/agent/verification_registry/entries/ci-rca-lifecycle-records-watched-set.yaml').read_text(encoding='utf-8')); p=subprocess.run(r['check_spec']['command'],capture_output=True,text=True); print(p.returncode, p.stderr[-200:]); raise SystemExit(p.returncode)"
  expected: Exit 0 -- the repaired check_spec passes on HEAD (it fails today with AssertionError on "'contract' not in d").
  fix_if: 'Non-zero: the repaired assertion does not match live contract state. Re-read docs/contracts/ci-rca-lifecycle.yaml and re-key the assertion; never weaken it to a no-op.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: This step runs the graduated shard itself. A second registry row asserting the same thing would be a duplicate of ci-rca-lifecycle-records-watched-set, which is the standing guard.
- step: 8
  phase: pre-deploy
  action: KEYSTONE -- the repaired shard is admitted honestly, with the corrected contract text as its only discriminator.
  command: bin/venv-python -c "import yaml,pathlib; from scripts import verification_graduation as vg; r=yaml.safe_load(pathlib.Path('config/agent/verification_registry/entries/ci-rca-lifecycle-records-watched-set.yaml').read_text(encoding='utf-8')); o=vg.run_differential(r, repo_root=pathlib.Path('.').resolve()); print(o.admitted, o.reason); raise SystemExit(0 if o.admitted else 1)"
  expected: Exit 0, admitted=True -- passes on HEAD, fails on origin/main because the corrected trigger_scope text is absent there.
  fix_if: Not admitted (tautological) means the repaired assertion does not key on text this PR introduces. Confirm the asserted string has zero occurrences in `git show origin/main:docs/contracts/ci-rca-lifecycle.yaml`. Do NOT weaken the gate to force admission.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A one-shot admission event scoped to this PR's diff. Once merged, the discriminating text is on main and the same assertion is tautological, so it cannot hold as a standing guard.
- step: 9
  phase: pre-deploy
  action: The contract correction and its Class D amendment_log entry are both present.
  command: bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/contracts/ci-rca-lifecycle.yaml').read_text(encoding='utf-8')); v=d['trigger_scope']['pr_branch_disposition']; assert 'no workflow_run event exists' not in v, 'false claim still present in the parsed value'; assert any('verification-graduation-gate-fix' in (e.get('summary') or '') for e in (d.get('amendment_log') or [])), 'no amendment_log entry naming this plan'; print('OK')"
  expected: Prints OK. Asserts the PARSED trigger_scope value, not raw text -- the phrase spans a YAML fold at ci-rca-lifecycle.yaml:93-94, so a raw-text assertion is already vacuously true today and would go green with the false claim left fully in place.
  fix_if: 'First assertion: the claim survives in the parsed value -- rewrite pr_branch_disposition. Second: add the amendment_log[] entry (Class D gate). If you are tempted to assert against raw text, re-read `expected`.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The trigger_scope half duplicates the repaired ci-rca-lifecycle-records-watched-set shard, which is the standing guard for that text. The amendment_log half is a one-shot provenance assertion about this PR's own entry and is vacuous on every later commit, so neither half is graduatable here.
- step: 10
  phase: pre-deploy
  action: No SLOC budget regression -- decomposition held, no raise was taken.
  command: bin/venv-python -c "import pathlib; bad=[]; [bad.append((str(p),n)) for p in [pathlib.Path('scripts/verification_graduation.py')]+sorted(pathlib.Path('tests/verification_graduation').glob('*.py')) for n in [len([l for l in p.read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')])] if n>500]; assert not bad, bad; import subprocess; assert subprocess.run(['git','diff','--quiet','origin/main...HEAD','--','config/sloc_budgets.yaml']).returncode==0, 'sloc_budgets.yaml changed -- decompose, never raise'; print('OK')"
  expected: Prints OK -- every touched module is <= 500 SLOC and config/sloc_budgets.yaml is unchanged versus origin/main.
  fix_if: 'Over budget: split the new code into a further module (facade pattern, Decision 80/104/124). Do NOT add a budget entry or a raise-approved marker. If the budgets file differs but THIS branch did not touch it, someone else''s marker-authorized raise landed on main -- the three-dot diff base already excludes that; rebase rather than reverting their entry.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Un-graduatable on two independent grounds. (1) The assertion is diff-relative -- verified rc=0 when run in a provisioned origin/main worktree -- so a registry row carrying it would be rejected as tautological by the very gate this plan repairs. (2) As a standing guard, 'sloc_budgets.yaml never differs from origin/main' would red every future marker-authorized budget raise, which Decisions 128 and 165 explicitly sanction.
- step: 11
  phase: pre-deploy
  action: Cohort regression sweep -- drives the REAL vg.git_worktree so it observes the provisioning code (139 fail before the fix, exactly 8 after).
  command: 'bin/venv-python -c "import contextlib, json, pathlib, yaml, concurrent.futures as cf; from scripts import verification_graduation as vg; from scripts.verification_checks import CheckStatus; R=pathlib.Path(''.'').resolve(); E=R/''config/agent/verification_registry/entries''; rows=[yaml.safe_load(q.read_text(encoding=''utf-8'')) for q in sorted(E.glob(''*.yaml''))]; cohort=[r for r in rows if ''bin/venv-python'' in json.dumps(r.get(''check_spec'') or {})]; known=set(''coverage-checker-at-100,decision-index-blast-radius-bounded,oidc-bootstrap-absent-from-size-roster,structural-decision-166-authorizes-every-roster-key,t-1-19-ledger-upgraded,t08-regrounded-off-library-framing,validate-attributes-label-to-check-net-zero,validation-result-schema-v2-attributions''.split('','')); st=contextlib.ExitStack(); w=st.enter_context(vg.git_worktree(''origin/main'', repo_root=R)); ex=st.enter_context(cf.ThreadPoolExecutor(max_workers=8)); res=list(ex.map(lambda r: (r[''check_id''], vg.materialize_check_in_tree(r,
    w).run().status), cohort)); st.close(); f={c for c,s in res if s!=CheckStatus.PASS}; new=sorted(f-known); print(len(cohort),''cohort,'',len(f),''failing, NEW:'',new); raise SystemExit(1 if new else 0)"'
  expected: Exit 0 -- every failing cohort entry is one of the 8 already-stale ids in this step's own `known` set; NEW is empty. Run verbatim against today's pre-fix code the same command reports 139 failing and exits 1, so this is a genuine red/green on the provisioning code, not a tautology.
  fix_if: 'Still ~139 failing: git_worktree is not provisioning -- the symlink is missing or keyed off the module-level ROOT instead of the repo_root argument. A non-empty NEW list means provisioning changed some check''s outcome; those ids are the regression (the 8 pre-existing stale ids are the `known` set inside this step''s own command). Asserting a SUBSET of those 8 rather than a count is deliberate: coverage-checker-at-100 is concurrency-sensitive and flips between runs, which a count-based threshold would misread as a regression.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The 8-id known-stale set is a snapshot of transient corpus state (2026-08-31) that moves as entries land or retire, so a standing guard pinned to it would drift into a false alarm. The durable follow-on is the staleness sweep carried by rec-3286, not this literal set.
- step: 12
  phase: pre-deploy
  action: Closure obligation -- both bundled recs are closed after the merge sync.
  command: bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; bad=[r['id'] for r in rows if r['id'] in ('rec-3333','rec-3317') and r.get('status')!='closed']; assert not bad, bad; print('OK')"
  expected: Prints OK -- rec-3333 and rec-3317 both read status=closed in the refreshed cache.
  fix_if: 'Still open: the Resolves trailer did not fire rec-autoclose. Close each via `bin/venv-python -m scripts.ops_data_portal --update-rec <id> --status closed --resolution "..."` (Decision 70 fallback). Note the sync MUST go through ops_data_portal --sync: AGENTS.md forbids calling scripts.sync.ops or any pull CLI directly, and `scripts.sync.ops pull` is not even a valid subcommand (exits 2).'
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: pre-deploy
  action: Authoritative gate -- the fast tier is green with the full change in the tree.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0, 'All checks passed.' -- including validate_contract_drift (Class D amendment gate) and validate_verification_registry's differential leg on the one modified shard.
  fix_if: 'Contract-drift failure: the amendment_log entry is missing or malformed. Differential failure on the shard: see step 8''s fix_if. Never weaken a gate to get green.'
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: pre-deploy
  action: Full-tier validation before handoff, as handoff_policy.full_validation_required_before_commit declares.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 -- the complete suite (pytest, DQ runner, verifier harness) is green with the whole change in tree.
  fix_if: A full-tier-only failure is in scope for this plan to fix on the branch (no ci-rca rec is filed for a PR-branch failure -- see the trigger_scope text this plan corrects). Never skip a test to get green.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: pre-deploy
  action: The verification-registry contract records the admission-rule change and the re-authoring.
  command: bin/venv-python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('docs/contracts/verification-registry.yaml').read_text(encoding='utf-8')); assert d['contract']['contract_version']==6, d['contract']['contract_version']; assert any('verification-graduation-gate-fix' in (e.get('summary') or '') for e in (d.get('amendment_log') or [])), 'no amendment_log entry naming this plan'; g=d.get('governance_notes') or ''; assert 'ci-rca-lifecycle-records-watched-set' in g, 're-authoring not recorded in governance_notes'; print('OK')"
  expected: Prints OK -- contract_version is 6, an amendment_log entry names this plan, and governance_notes records the re-authoring.
  fix_if: Nothing enforces these for a Class A contract (the Class D amendment gate does not apply), which is exactly why this step exists. Add whichever of the four edits is missing.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'A one-shot provenance assertion about this PR''s own contract edits: contract_version 6 and an amendment_log entry naming this plan are true of every later commit too, so as a standing guard it is vacuous.'
