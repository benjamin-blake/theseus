- 'ci-rca HARD BLOCK deferral (human-accepted): rec-3328/3293/3292 unresolved, no Related-Work condition met. Deferred because this plan is a PREREQUISITE for resolving them correctly -- a forward-fix graduating a guard would get a false-admission verdict from the broken gate. rec-3293/3292 appear already fixed in-tree.'
- rec-3317 (High) + rec-3333 (Medium) are one defect, both close here. rec-3332 and rec-3286 stay OPEN.
- 'Follow-on recs to file at implement time: (1) sweep + disposition the 19 stale shards; (2) standing execution of the graduated corpus. Both name this plan as prerequisite.'
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- VP step 1 (RED baseline) run FIRST and confirmed admitted=True before any edit
execution_steps:
- Run VP step 1 to reproduce the defect on unmodified code; record the output. If it does not reproduce, STOP.
- 'scripts/verification_graduation.py -- git_worktree: after a successful `git worktree add`, if `repo_root/.venv` exists, create a symlink at `<worktree>/.venv` pointing at it. Key off the resolved repo_root argument, never the module-level ROOT, so synthetic fixture repos stay unprovisioned. On teardown, remove the symlink before `git worktree remove --force` (verified safe either way, but explicit is better) and never let rmtree traverse it.'
- 'scripts/verification_graduation.py -- run_differential: keep the existing live-PASS precondition and the rec-2655 skip predicate unchanged. When the revert leg returns FAIL, run a CONTROL leg first: materialize the same row in a worktree at HEAD and run it. If the control leg does not PASS, raise GraduationError naming the check_id and both leg outcomes (fail loud, Decision 55) -- never return admitted. Only when the control leg PASSes may the FAIL be attributed to content and admitted. Do NOT run the control leg when the revert leg PASSes: a passing revert leg already proves the environment can run the command, and skipping it keeps the tautological-rejection path at its current cost.'
- Do not add a CheckStatus value. If a structured outcome is needed, extend DifferentialOutcome (the DifferentialOutcome.skipped precedent), leaving the kernel's two-valued vocabulary and is_admitted untouched.
- 'tests/verification_graduation/test_provisioning.py (new) -- reuse the conftest.py fixtures (_init_repo, _commit_all, _seed_graduation_deps). Classes: TestProvisionedDifferential (tautological bin/venv-python row rejected), TestControlLeg (live-PASS + worktree-HEAD-FAIL raises GraduationError, asserting admitted=True is never returned), TestWorktreeProvisioning (no .venv in repo_root -> no symlink and no crash; with one -> a canary file under the real .venv survives teardown). Real git worktrees and real subprocesses -- no mocking of the revert leg, which is the defect this plan removes.'
- 'scripts/checks/verification/validate_differential_gate_baseline.py -- delete the hardcoded-FAIL revert_runner. Replace with: (i) an interpreter-parity assertion that the command form check_specs use resolves in a scratch worktree exactly as it does live, and (ii) an end-to-end run_differential call on a known-tautological bin/venv-python probe row asserting it is REJECTED. Both must be stable with and without a .venv present, since CI has neither. Keep the existing CANONICAL_SLOTS==6 assertion and the registry.examined()/skipped() accounting coherent (Decision 170).'
- scripts/checks/verification/_manifest.py -- add 'scripts/verification_graduation.py' to validate_differential_gate_baseline's pre_globs tuple.
- 'docs/contracts/ci-rca-lifecycle.yaml -- rewrite trigger_scope.pr_branch_disposition: ci-rca.yml subscribes to workflow_run on the "CI" workflow (ci-rca.yml:21-30) and ci.yml is `name: CI` running on pull_request (ci.yml:1-9), so a PR CI run DOES emit workflow_run:completed; the job-level if: (ci-rca.yml:59) then REJECTS it because head_branch is the PR branch, not the default branch. Note the sibling head_repository.full_name fork condition on that same if: exists precisely because PR runs reach it. Disposition is unchanged (no rec filed); only the mechanism description changes. Tighten the one loose sentence in the sibling `gate` field that says the trigger fires only for default-branch runs. Add an amendment_log[] entry dated 2026-08-31 with semantic_break: false, change_class: mechanism_narrow, and a summary naming this plan.'
- 'config/agent/verification_registry/entries/ci-rca-lifecycle-records-watched-set.yaml -- repair the check_spec: drop the obsolete `''contract'' not in d and ''class'' not in d` assertion (T2.56 added the Class D envelope; verified contract.class == ''D'' on BOTH HEAD and origin/main), assert the envelope''s presence instead, keep all six existing keyword floor terms (each verified present on origin/main, so none of them can be the discriminator), and add one raw.index() on a distinctive substring introduced by the trigger_scope correction above. Verify that substring has ZERO occurrences in `git show origin/main:docs/contracts/ci-rca-lifecycle.yaml` before relying on it. Switch the command head from bare `python` to `bin/venv-python` per AGENTS.md. Filename must keep equalling check_id (Decision 176).'
- docs/contracts/verification-registry.yaml -- add a governance_notes entry and bump contract_version 5 -> 6, recording that admission now requires the revert-leg FAIL be proven content-derived via the control leg, and that the scratch worktree is venv-provisioned.
- Execute the Verification Plan -- run each step in order; loop until pass. Step 8 is the keystone; if it reports tautological, fix the discriminator, never the gate.
- File the two follow-on recs named in context via `bin/venv-python -m scripts.ops_data_portal` (never a direct JSONL edit), each naming this plan as its prerequisite.
