- 'Why the 19 rot undetected: run_differential''s only caller is diff-gated on _added_entries + _modified_entries (validate_verification_registry.py:194-198); graduated checks never re-run as a standing suite.'
- 'Costs: worktree add 0.467s, symlink 0.3ms, control leg ~+0.5s per candidate on the admission path only. Fast-tier budget 300s (validate.py:69), already breached pre-existing (rec-3288).'
