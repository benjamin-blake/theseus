- 'scripts/verification_graduation.py -- git_worktree: after a successful `git worktree add`, if `<repo_root>/.venv` exists, create a symlink at `<worktree>/.venv` pointing at it. Key off the resolved repo_root ARGUMENT, never the module-level ROOT, so synthetic fixture repos stay unprovisioned. Remove the symlink before `git worktree remove --force` and never let rmtree traverse it (both were verified not to follow it, but be explicit). NOTE: git_worktree has TWO production callers -- run_differential''s revert runner (:312) and run_verifier_differential''s HEAD worktree (:473) -- so provisioning affects both. The verifier path uses sys.executable and is unaffected in practice; do not special-case it.'
- 'scripts/verification_graduation.py -- run_differential ENVIRONMENT PROBE (this REPLACES the HEAD-worktree control leg considered and rejected in critique round 1, which conflated a broken environment with a check depending on uncommitted working-tree state). Keep the existing live-PASS precondition and the rec-2655 skip predicate unchanged. When the revert leg returns FAIL, do NOT admit yet. First prove the revert worktree could run the check at all: scan the materialized command for interpreter tokens from the validated allowlist (''bin/venv-python'', ''python3'', ''python'', ''bash'', ''sh'' -- longest-first, so ''bin/venv-python'' is not double-counted as ''python''), and run each distinct token found as `<token> -c ''''` with cwd set to the revert worktree. Match tokens on shell-word boundaries, not bare substrings: a naive substring scan finds ''sh'' inside ''shard'', ''push'', ''shell'', ''shutil'' and ''sha256'' (42 spurious hits across the live corpus -- harmless today because
  `sh -c ''''` exits 0, but not a property to rely on). Treat FileNotFoundError/OSError from the probe subprocess as a probe FAILURE, not an exception to propagate: a synthetic repo may have no bin/venv-python at all. Scan the WHOLE command, not just argv[0]: 29 of the 139 cohort rows have a non-bin/venv-python head (28 bash, 1 timeout) with bin/venv-python in the body, and a head-only probe is blind to all 29 (measured: token-scan detects 139/139, head-only 110/139). If any probed token exits non-zero, raise GraduationError naming the check_id, the token, and its exit code (fail loud, Decision 55) -- never return admitted. Only when every probed token exits 0 may the FAIL be attributed to content and admitted.'
- 'Probe scope and failure direction, both deliberate. (i) Do NOT probe when the revert leg PASSes: a passing command already proves the environment ran it, and the outcome is rejection, the fail-safe direction. (ii) Do NOT probe test_selector (TestSelectorCheck runs sys.executable, verification_checks.py:226, so it inherits the parent interpreter and has no tree-relative resolution to break), nor grep_count / file_presence (in-process, no subprocess). (iii) A command whose interpreter is OUTSIDE the allowlist is simply not probed -- record that in the outcome reason and proceed. The probe is a positive detector only: it may convert an admission into a loud error when it has evidence the environment is broken, and must never manufacture a failure for an unrecognised head This is not hypothetical: main already carries two `timeout`-headed rows (e.g. sync-deps-tests-immune-to-ambient-install-terraform), and `timeout -c ''''` is not a no-op. They are handled correctly because the BODY scan
  still finds bin/venv-python and bash inside them -- measured 139/139 detected, 0 unprobed -- but a future row with no allowlisted token anywhere must skip, never fail.'
- 'Do not add a CheckStatus value. If a structured outcome is needed, extend DifferentialOutcome (the DifferentialOutcome.skipped precedent), leaving the kernel''s two-valued vocabulary and is_admitted untouched. GraduationError is chosen over DifferentialOutcome.skipped here deliberately: skipped is the ''cannot determine, do not block'' channel for an expected, benign condition (rec-2655''s absent heavy dep), whereas an interpreter that cannot run in the scratch worktree is an infrastructure defect that must be fixed, not tolerated.'
