rollback: >-
  Every change is additive text or a data row across nine files with no runtime coupling; git revert
  of the squash commit restores the prior state exactly. The one ordering caveat: reverting after
  PLAN-root-scoped-diff-base has merged would restore the below-budget S1 advisory, so re-run
  validate --pre after any revert and reseed config/prose_budgets.yaml if the advisory reappears.
