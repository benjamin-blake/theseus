schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: migration-step-4-cfg-audit
intent: >-
  Close migration step 4 of audits/contract-first-governance-33c8667.yaml (finding CFG-08 plus the
  f2-reclassification amendment) by pointing the decision-authoring path at the homes steps 2-3
  already built: a change-record content rule, the missing PR-template prefix row, the DD-B
  routing-ruling convention, a reviewer-side category-consistency check, and the retrieval-quality
  gate on T1.5. Contributes to the North Star by bounding decision-log growth in SHAPE at the
  authoring boundary, so the corpus agents must load stays small and navigable.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-migration-step-4-cfg-audit.yaml
phase: >-
  Platform: audits/contract-first-governance-33c8667.yaml migration step 4 (finding CFG-08 +
  f2-reclassification amendment). Roadmap bookkeeping on tier_item T1.5 (appends exit criterion c8;
  closes none of its criteria). No product-roadmap phase.
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Add the change-record content rule to the "### Commit-message conventions" section (what
      changed / why now / acute state / measurements belong in the squash-commit or PR body, never
      in a Decision entry body), plus the DD-B convention line. Both POINT AT
      docs/contracts/decision-entry.yaml significance.routing_rule (Decision 167 clause 4) and never
      restate the three-question rule.
  - file: .github/pull_request_template.md
    action: Modify
    purpose: >-
      Add the missing audit({slug}) row to the trailing COMMIT-MESSAGE CONVENTIONS comment (which
      currently names only feat/plan/roadmap/scope), and add the DD-B prompt to the "## Decisions"
      section comment.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Decision Significance Gate cites the required significance envelope marker (Decision 167
      clause 2 -- migration step 4's own first clause, not yet landed), adds the contract-first
      justification obligation (rec-3015) and the amendment_forms routing alternative (rec-3016).
      Authored as property tests, never open-ended "consider whether" prompts (Decision 160 point 14
      lesson).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Author a NEW review section plus a matching row in the Phase-3 structured-output template --
      this file contains no "ratification" text today, so there is no existing review to amend. The
      verdict fires whenever a plan drafts numbered "## Decision NNN:" text, covering BOTH branches of
      the planning skill's Decision Significance Gate (a fresh governance Decision and a CD
      ratification), and requires a verbatim body quote that satisfies or fails the three-question
      routing rule. Scoping it to ratification blocks alone would not have fired on DD-B -- the
      audit's own demonstrated enforcement event, which was a fresh Decision draft. Three details are
      fixed here, not left to the implementer: (a) TRIGGER DETECTION -- the control fires when the
      plan carries a ratification block OR its scope includes docs/DECISIONS.md and the plan text
      drafts a "## Decision NNN:" heading; a DECISIONS.md scope row that only adds an amendment
      trailer (this plan's own shape) does NOT fire it, since an amendment carries no significance
      envelope. (b) VERDICT IMPACT -- a claimed-row/body mismatch forces REVISE, not an informational
      note; a surfaced-only verdict would reproduce the discretionary-enforcement failure mode this
      plan rejects elsewhere. (c) N/A BRANCH -- when the trigger does not fire, the Phase-3 row emits
      "Category consistency: N/A -- plan drafts no numbered Decision text", so a silent omission is
      distinguishable from a pass. The 106-byte headroom is certainly exceeded, so the dec-75 raise is
      required, not conditional.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Reseed S1 root_ambient_load_set to its true measured size after this plan's AGENTS.md addition
      (closing the standing below-budget advisory left deliberately by PLAN-agents-md-ambient-trim),
      and raise the .claude/skills/plan-critique/SKILL.md entry with a
      "# raise-approved: dec-75 <reason>" marker. Raise the planning entry the same way only if its
      48-byte headroom proves insufficient -- its existing dec-150 marker already authorizes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      A dated in-place annotation on Decision 167 (amendment_forms trailing_bracket or
      blockquote_update), minting no header: an amendment carrying ONLY the
      routing-consistency lint's REJECTION and its rationale -- legitimate clause-2 lifecycle, since
      the lint was that clause's declared forcing partner -- plus the fenced
      "```yaml reversal-conditions" stanza placed between the prose "**Reversal conditions:**" section
      and "**Related:**", matching the three live stanzas (Decisions 133, 172, 83). The
      repo-wide no-NEW-permanently-advisory-check rule is NOT recorded by this plan in any surface --
      it clears the significance bar and is deferred to a follow-on numbered Decision via a rec (see
      Context). No other entry is annotated: neither Decision 153 nor Decision 167 clause 3 grants the
      open-ended shape that rule would prohibit, so there is no misleading sanction to flag.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      APPEND a retrieval-quality exit criterion to tier_item T1.5 (position 8 -> implicit id c8).
      Never insert mid-list: exit_criteria ids are assigned positionally by
      TierItem._normalize_exit_criteria, so inserting silently renumbers c1/c2, which are cited by
      name across DECISIONS.md, the decision-scout skill, the audit, and the roadmap itself.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One new row for the single surviving graduate-disposition VP step (step 7), carrying
      plan_slug "migration-step-4-cfg-audit" and its declared graduation_check_id
      "dec-167-reversal-stanza-monitored".
      validate_graduation_completeness's implement-PR leg fails any graduate step without a matching
      new-in-diff row, and constraint 6 forbids touching files absent from Scope -- so this row is
      required, not optional.
  - file: docs/contracts/check-accounting.yaml
    action: Modify
    purpose: >-
      Field-semantics note ONLY, beside status_vocabulary -- recording that the vocabulary has no
      "warned" member, so a print-only check declaring examined(n>0) is recorded as "enforced". That
      is a true field_semantics route under decision-entry.yaml significance.routing (the meaning of a
      declared value, collocated with the field), and a correct Decision 86/127 home. Plus an
      amendment_log entry, required because the contract is Class D and ratified
      (check_amendment_log_for_class_d). The repo-wide no-NEW-permanently-advisory-check RULE is
      deliberately NOT recorded here -- see the Context note on its deferral.
bundled_recommendations:
  - rec-3015
  - rec-3016
infrastructure_dependencies: []
acceptance_criteria:
  - AGENTS.md's commit-conventions section states the change-record content rule naming all four
    content classes and points at docs/contracts/decision-entry.yaml rather than restating the
    three-question routing rule.
  - AGENTS.md records the DD-B convention -- a Decision draft blocked on routing grounds gets one
    line in the superseding PR body naming the routing row applied.
  - .github/pull_request_template.md's conventions comment names all five commit prefixes including
    audit({slug}), and its Decisions section carries the DD-B prompt.
  - .claude/skills/planning/SKILL.md satisfies rec-3015 (contract-first justification) and rec-3016
    (amendment_forms routing), and cites the required significance envelope marker.
  - .claude/skills/plan-critique/SKILL.md requires a category-consistency verdict with a verbatim
    body quote whenever a plan drafts numbered "## Decision NNN:" text -- fresh governance Decision
    or CD ratification alike, matching both branches of the Decision Significance Gate.
  - Decision 167 carries a dated amendment trailer whose reversal-conditions stanza is parsed and
    surfaced by preflight (decision 167 appears in decision_conditions.monitored).
  - docs/DECISIONS.md gains no new "## Decision NNN:" header -- the live header count and maximum
    decision number are unchanged from origin/main.
  - T1.5 carries exactly one additional exit criterion, appended at position 8, and the roadmap
    passes referential-integrity validation.
  - config/prose_budgets.yaml's S1 root_ambient_load_set entry equals its measured size (the reserved
    headroom is claimed and closed), and every raised entry carries an authorizing marker. Seven
    other surfaces sit below budget for unrelated reasons and are explicitly out of this plan's reach
    (ten are below budget today; this plan's own raises reseed plan-critique and planning).
  - bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm AGENTS.md states the change-record content rule naming all four content classes and
      routes them to the commit/PR body.
    command: >-
      bin/venv-python -c "import pathlib,sys; t=pathlib.Path('AGENTS.md').read_text();
      s=t[t.index('### Commit-message conventions'):t.index('### Commit signing')];
      m=[w for w in ('what changed','why now','acute state','measurements') if w not in s.lower()];
      sys.exit(f'missing content classes: {m}') if m else print('OK: all four content classes present')"
    expected: "Prints 'OK: all four content classes present'; exit 0."
    fix_if: >-
      Non-zero exit naming missing classes means the rule was written loosely -- name all four
      explicitly rather than gesturing at 'narrative'.
    graduation: waive
    graduation_waiver_reason: >-
      Prose-presence grep over a section whose wording may legitimately be revised; a standing
      literal-string guard would fire on any rewording while proving nothing about whether authors
      follow the rule. The semantic obligation is carried by the plan-critique verdict line this
      plan installs (step 6) and by the Decision 167 amendment's reversal condition.
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm AGENTS.md points at the contract's routing_rule rather than restating the three
      questions, and that the DD-B convention is recorded in BOTH AGENTS.md and the PR template.
      DD-B lives here rather than in graduated step 3 because a literal-token guard over re-editable
      prose is exactly what steps 1/2/5/6 are waived for.
    command: >-
      bin/venv-python -c "import pathlib,sys; a=pathlib.Path('AGENTS.md').read_text();
      p=pathlib.Path('.github/pull_request_template.md').read_text();
      s=a[a.index('### Commit-message conventions'):a.index('### Commit signing')];
      sys.exit('restates the routing rule') if ('reversal-relevant' in s and 'durable architectural
      commitment' in s) else None;
      sys.exit('no pointer to decision-entry.yaml') if 'decision-entry.yaml' not in s else None;
      sys.exit('DD-B absent from AGENTS.md') if 'routing row' not in a else None;
      sys.exit('DD-B absent from PR template') if 'routing row' not in p else
      print('OK: points not restates, DD-B in both surfaces')"
    expected: "Prints 'OK: points not restates, DD-B in both surfaces'; exit 0."
    fix_if: >-
      Exit 'restates the routing rule' means the section duplicated the contract's three questions --
      replace with a pointer. Exit 'no pointer' means the reference is missing entirely.
    graduation: waive
    graduation_waiver_reason: >-
      Encodes a negative prose condition (absence of restatement) whose literal markers are specific
      to this session's phrasing; graduating it would freeze one wording of a rule that is expected
      to be re-edited as the contract evolves.
  - step: 3
    phase: pre-deploy
    action: >-
      Confirm the PR template's conventions comment names all five commit prefixes. Scope is
      deliberately the prefix enumeration ALONE, so the graduated check_id and the assertion agree --
      DD-B presence is asserted by waived step 2 instead.
    command: >-
      bin/venv-python -c "import pathlib,sys;
      p=pathlib.Path('.github/pull_request_template.md').read_text();
      miss=[x for x in ('feat({slug})','plan({slug})','roadmap({ids})','scope({slug})','audit({slug})')
      if x not in p]; sys.exit(f'PR template missing prefixes: {miss}') if miss else
      print('OK: five prefixes present')"
    expected: "Prints 'OK: five prefixes present'; exit 0."
    fix_if: >-
      A missing-prefix list means the template comment was not updated. DD-B failures surface in
      step 2, not here.
    graduation: waive
    graduation_waiver_reason: >-
      Graduating this would install a permanent CI check over a surface whose originating finding
      rules one out in terms: CFG-08's severity_rationale reads "Wording-only; enforcement
      deliberately not proposed", its refutation records "no gate proposed", and its current_behavior
      notes "no check reads the template". The check would also hard-code five prefix literals,
      including scope({slug}), which Decision 67 currently suspends -- retiring it would redden main
      until the registry row was updated. Waiving keeps the plan faithful to the finding it closes.
  - step: 4
    phase: pre-deploy
    action: >-
      Confirm rec-3015 and rec-3016 acceptance criteria are satisfied verbatim, as filed.
    command: >-
      grep -q 'why not a contract' .claude/skills/planning/SKILL.md && grep -q 'amendment_forms'
      .claude/skills/planning/SKILL.md && echo 'OK: rec-3015 + rec-3016 acceptance met'
    expected: "Prints 'OK: rec-3015 + rec-3016 acceptance met'; exit 0."
    fix_if: >-
      Non-zero exit means one or both recs' filed acceptance commands still fail; the Resolves
      trailer would then autoclose a rec whose acceptance was never met.
    graduation: waive
    graduation_waiver_reason: >-
      Same brittleness as steps 1/2/5/6: two literal token greps over skill prose that is expected to
      be re-edited, so a standing guard would fire on any rewording while proving nothing about
      whether authors follow the instruction. (These happen to be the recs' filed acceptance commands,
      but the file property they assert is durable -- the transience is in the recs, not the guard.)
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the planning skill's Decision Significance Gate cites the required significance
      envelope marker (Decision 167 clause 2), closing migration step 4's first clause.
    command: >-
      bin/venv-python -c "import pathlib,sys; t=pathlib.Path('.claude/skills/planning/SKILL.md').read_text();
      s=t[t.index('## Decision Significance Gate'):]; s=s[:s.index(chr(10)+'## ',5)];
      sys.exit('gate section does not cite the envelope marker') if 'envelope' not in s.lower()
      else print('OK: envelope marker cited at the gate')"
    expected: "Prints 'OK: envelope marker cited at the gate'; exit 0."
    fix_if: >-
      Failure means the gate still references only the four routing rows, leaving migration step 4's
      first clause open -- the exact gap this plan exists to close. The window is bounded by the next
      '## ' heading rather than a fixed character count, so the assertion cannot be satisfied by text
      belonging to the following section.
    graduation: waive
    graduation_waiver_reason: >-
      Section-scoped prose grep on a skill file expected to be re-edited; brittle as a standing
      guard, and the obligation it encodes is enforced downstream by
      validate_decision_entry_conformance, which rejects a malformed or absent envelope claim
      mechanically rather than by inspecting instructions.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm plan-critique now requires a category-consistency verdict with a verbatim body quote --
      the reviewer-side control that does not exist today.
    command: >-
      bin/venv-python -c "import pathlib,sys; t=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text().lower();
      miss=[w for w in ('significance','routing','verbatim') if w not in t];
      sys.exit(f'plan-critique missing: {miss}') if miss else print('OK: category-consistency verdict installed')"
    expected: "Prints 'OK: category-consistency verdict installed'; exit 0."
    fix_if: >-
      A missing 'verbatim' means the verdict was added without the anti-rubber-stamp quote
      obligation, which is what stops an agent reviewer pattern-matching a pass.
    graduation: waive
    graduation_waiver_reason: >-
      Presence of three tokens in a skill file proves the instruction was written, not that reviewers
      apply it; a standing guard would assert the weaker property permanently. Efficacy is measured
      instead by the Decision 167 amendment's reversal condition (a post-167 entry demonstrated
      mis-routed past both gates).
  - step: 7
    phase: pre-deploy
    action: >-
      Confirm the Decision 167 amendment's reversal-conditions stanza is well-formed AND actually
      monitored by preflight -- not merely present as prose.
    command: |-
      bin/venv-python -c "from scripts.preflight.decision_conditions import preflight_bucket; import sys; r=preflight_bucket(); bad=[m for m in (r.get('malformed') or []) if str(m).find('167')>=0]; sys.exit(f'167 not monitored or malformed -- {r}') if (167 not in (r.get('monitored') or []) or bad) else print('OK 167 monitored')"
    expected: "Prints 'OK 167 monitored'; exit 0."
    fix_if: >-
      '167 not monitored' means the fence opener is not at column 0 or the stanza is outside the
      entry. 'malformed stanza' means a required key (decision, review_by, on_trigger, conditions) is
      missing. Red-green: this step fails before the amendment lands and passes after.
    graduation: graduate
    graduation_check_id: dec-167-reversal-stanza-monitored
    graduation_waiver_reason: null
  - step: 8
    phase: pre-deploy
    action: >-
      Confirm no new numbered Decision was minted -- the requester's hard constraint -- by comparing
      header count and maximum number against origin/main.
    command: >-
      bin/venv-python -c "import re,subprocess,pathlib,sys;
      cur=pathlib.Path('docs/DECISIONS.md').read_text();
      base=subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True,text=True).stdout;
      f=lambda t:[int(m.group(1)) for m in re.finditer(r'^## Decision (\\d+):',t,re.M)];
      a,b=f(cur),f(base); sys.exit(f'new Decision minted: {sorted(set(a)-set(b))}') if set(a)-set(b)
      else print(f'OK: no new Decision (count {len(a)}, max {max(a)})')"
    expected: "Prints 'OK: no new Decision (count 125, max 172)'; exit 0."
    fix_if: >-
      Any new number means the amendment was authored as a fresh entry -- convert it to a dated
      in-place trailer on Decision 167 per decision-entry.yaml amendment_forms.
    graduation: waive
    graduation_waiver_reason: >-
      Un-graduatable in both directions. Admission: run_differential requires the origin/main revert
      to FAIL, but on an origin/main worktree this command compares that tree's headers against
      itself, finds no new Decision, and PASSES -- so validate_verification_registry would reject the
      row as tautological. Standing-guard value: the assertion encodes a one-PR operator constraint,
      so as a permanent check it would block every future PR that legitimately mints a numbered
      Decision. Retained as a session check only.
  - step: 9
    phase: pre-deploy
    action: >-
      Confirm T1.5 gained exactly one exit criterion, appended at position 8, with c1 and c2 text
      unchanged (their ids are positional and cited by name repo-wide).
    command: >-
      bin/venv-python -c "import yaml,subprocess,pathlib,sys;
      g=lambda t:[i for i in yaml.safe_load(t)['tier_items'] if i['id']=='T1.5'][0]['exit_criteria'];
      cur=g(pathlib.Path('docs/ROADMAP-PLATFORM.yaml').read_text());
      base=g(subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True).stdout);
      sys.exit(f'expected 1 new criterion, got {len(cur)-len(base)}') if len(cur)-len(base)!=1 else None;
      sys.exit('existing criteria changed -- positional ids corrupted') if cur[:len(base)]!=base else
      print(f'OK: appended c{len(cur)}, c1-c{len(base)} intact')"
    expected: "Prints 'OK: appended c8, c1-c7 intact'; exit 0."
    fix_if: >-
      A mismatch on the existing prefix means the criterion was inserted mid-list, silently
      renumbering every positional reference. Move it to the end of the list.
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is diff-relative -- "exactly one more criterion than origin/main" -- which is
      true only while the append is unmerged. Post-merge origin/main carries the append, cur equals
      base, and a graduated row would exit non-zero on main-validate and on every subsequent PR: a
      guaranteed red-main time bomb, the same failure class as the deferred ci-rca recs. The durable
      guard is tests/test_platform_roadmap.py (VP step 12). Retained as a session check only.
  - step: 10
    phase: pre-deploy
    action: >-
      Confirm the S1 entry specifically equals its measured size -- the standing advisory deliberately
      left by PLAN-agents-md-ambient-trim must be closed by this plan's reseed. Scope is S1 ALONE:
      seven other surfaces sit below budget for unrelated reasons and are out of this plan's reach
      under constraint 6.
    command: |-
      bin/venv-python -c "from scripts.preflight.prose_context import measure_prose_context as m; import yaml,pathlib,sys; b=yaml.safe_load(pathlib.Path('config/prose_budgets.yaml').read_text()); cur=m()['S1']['prose_bytes']; bud=b['S1']['root_ambient_load_set']; sys.exit(f'S1 not reseeded -- current {cur} budget {bud}') if cur!=bud else print('OK S1 tight')"
    expected: "Prints 'OK S1 tight'; exit 0."
    fix_if: >-
      A 'S1 not reseeded' failure means config/prose_budgets.yaml still carries the reserved headroom
      left by PLAN-agents-md-ambient-trim; set root_ambient_load_set to the reported current value.
      Asserting equality rather than invoking validate_prose_limits is deliberate -- a below-budget
      surface is only an ADVISORY there and never reaches the failure list, so the registered check
      cannot detect the condition this step exists to close.
    graduation: waive
    graduation_waiver_reason: >-
      Not a duplicate -- validate_prose_limits CANNOT assert this (a below-budget surface appends to
      its advisory list, never its failure list), which is why the step asserts equality directly. The
      real reason to waive is that a permanent zero-headroom equality guard would fail every future PR
      that legitimately trims the ambient set without reseeding in the same diff -- converting a
      one-time reseed obligation into a standing tax on unrelated work.
  - step: 11
    phase: pre-deploy
    action: >-
      Confirm every raised prose-budget entry carries an authorizing marker naming a Decision whose
      body contains that budget key.
    command: |-
      bin/venv-python -c "from scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as b; import sys; f=[]; b(f); sys.exit(f'raise violations -- {f}') if f else print('OK raises authorized')"
    expected: "Prints 'OK: raises authorized'; exit 0."
    fix_if: >-
      A violation naming the plan-critique entry means its '# raise-approved: dec-75' marker is
      missing or malformed. Red-green: removing the marker makes this step fail, restoring it passes.
    graduation: waive
    graduation_waiver_reason: >-
      Direct invocation of an already-registered check running in both tiers; a graduated duplicate
      would assert the same property twice.
  - step: 12
    phase: pre-deploy
    action: >-
      Run the platform-roadmap test suite, which asserts exit-criterion referential integrity after
      the T1.5 append.
    command: bin/venv-python -m pytest tests/test_platform_roadmap.py -q
    expected: "Exit 0, all tests pass."
    fix_if: >-
      A referential-integrity failure means the appended criterion shifted existing positional ids or
      the roadmap no longer parses; re-check that the criterion was appended, not inserted.
    graduation: waive
    graduation_waiver_reason: >-
      test_selector IS a canonical slot, so this is graduatable in principle -- but the durable guard
      already exists as the committed test module, which the full tier collects on every run. A
      registry row would schedule a second invocation of tests that already run.
  - step: 13
    phase: pre-deploy
    action: >-
      Validate the plan document itself against the PlanDocument schema.
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-migration-step-4-cfg-audit.yaml
    expected: "Exit 0, no schema violations."
    fix_if: >-
      Unknown-key errors mean a field name drifted from the schema (extra=forbid); a graduation error
      means a pre-deploy step is missing its disposition.
    graduation: waive
    graduation_waiver_reason: >-
      Already enforced for every plan by validate_plan_documents in both tiers; a graduated duplicate
      would add a second registry row asserting the same property.
  - step: 14
    phase: pre-deploy
    action: >-
      Run the authoritative fast-tier gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: "Exit 0."
    fix_if: >-
      Read the named failing check and fix at its source. Do not add a check to ci.yml without adding
      it to validate.py first.
    graduation: not-applicable
  - step: 15
    phase: pre-deploy
    action: >-
      Run the FULL validate tier, as handoff_policy.full_validation_required_before_commit declares.
      validate_handoff_full_tier fails any plan that declares the policy without a step invoking the
      full tier (Decision 163) -- verified failing on this plan before this step was added.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0. Wait for completion; on timeout the disposition is blocked, not passed."
    fix_if: >-
      A failure here that --pre missed is a full-tier-only check; fix at its source and re-run the
      whole tier from the start rather than resuming mid-run.
    graduation: not-applicable
  - step: 16
    phase: post-deploy
    action: >-
      After the squash-merge Resolves trailer fires rec-autoclose, confirm both bundled
      recommendations actually closed in the warehouse.
    command: |-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib,sys; rows=[json.loads(l) for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if l.strip()]; st={r['id']:r.get('status') for r in rows if r.get('id') in ('rec-3015','rec-3016')}; sys.exit(f'not closed -- {st}') if len(st)!=2 or any(v!='closed' for v in st.values()) else print('OK both recs closed')"
    expected: "Prints 'OK both recs closed'; exit 0."
    fix_if: >-
      A non-closed status means the Resolves trailer was omitted from the squash-merge commit body or
      rec-autoclose failed. Fall back to the portal directly per Decision 70 -- never edit the local
      cache, which is a read cache and never a write source.
test_obligations:
  - source: config/prose_budgets.yaml
    behavior: >-
      A raise to the plan-critique entry stays authorized -- the marker must name a Decision whose
      body contains that budget key as a literal substring.
    verification_step: 11
    command: |-
      bin/venv-python -c "from scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as b; import sys; f=[]; b(f); sys.exit(f'raise violations -- {f}') if f else print('OK raises authorized')"
    red_green_expectation: >-
      Red before: removing the '# raise-approved: dec-75' marker from the plan-critique entry makes
      the raise guard append a violation and the command exit non-zero. Green after: with the marker
      present and Decision 75's body naming .claude/skills/plan-critique/SKILL.md, it exits 0.
  - source: docs/DECISIONS.md
    behavior: >-
      The Decision 167 amendment's reversal-conditions stanza remains machine-parseable and monitored
      by preflight, so the revisit trigger is watched rather than left as unread prose.
    verification_step: 7
    command: |-
      bin/venv-python -c "from scripts.preflight.decision_conditions import preflight_bucket; import sys; r=preflight_bucket(); bad=[m for m in (r.get('malformed') or []) if str(m).find('167')>=0]; sys.exit(f'167 not monitored or malformed -- {r}') if (167 not in (r.get('monitored') or []) or bad) else print('OK 167 monitored')"
    red_green_expectation: >-
      Red before: exits non-zero on origin/main, where Decision 167 carries no stanza and 167 is
      absent from the monitored set. Green after: exits 0 with 167 monitored and no malformed entries.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      Each graduated VP step owns exactly one registry row whose command still discriminates -- it
      must pass on HEAD and fail against an origin/main worktree, or the row is inadmissible.
    verification_step: 14
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      No test this plan could author would be stronger evidence than the mechanism already applied to
      every new row: validate_verification_registry's differential admission re-executes each
      new-in-diff row's command against a real origin/main worktree and rejects it unless the revert
      genuinely FAILS. That runs in the --pre tier this step invokes. Authoring a separate unit test
      asserting the rows exist would assert strictly less than the differential already proves.
  - source: docs/contracts/check-accounting.yaml
    behavior: >-
      The Class D contract keeps a resolving evaluator and gains an amendment_log entry whenever its
      body changes, so the field-semantics note cannot land as an undeclared edit.
    verification_step: 14
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      The required shape is asserted by two existing registered checks that both run in the tier this
      step invokes -- validate_contract_drift (schema, refs, status transitions, amendment-on-change)
      and _population.check_amendment_log_for_class_d. The change is a prose note plus a log entry
      with no executable surface of its own, so a bespoke test would restate those checks rather than
      guard any behavior they miss.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      T1.5's exit criteria stay append-only, so the positional ids c1 and c2 that DECISIONS.md, the
      decision-scout skill and the audit cite by name keep resolving to the same criteria.
    verification_step: 12
    test_selector: tests/test_platform_roadmap.py
    red_green_expectation: >-
      Red before: inserting the new criterion at position 1 instead of appending shifts every id, and
      the roadmap referential-integrity assertions fail. Green after: appended at position 8, all
      existing ids resolve unchanged.
constraints:
  - >-
    NO new numbered Decision (operator constraint). The ruling lands as a dated in-place amendment
    trailer on Decision 167 per decision-entry.yaml amendment_forms -- legitimate because this is
    lifecycle evolution of Decision 167's own clause-2 mechanism, not a new commitment housed under
    an unrelated number.
  - >-
    Do NOT build the routing-consistency lint the audit's f2 amendment proposed. Four independent
    consults concluded it is malformed: proxy P1 is dominated by the already-armed hard cap, P2 is
    anti-directional (Decision 168 rewards docs/contracts references, and the window's top P2 scorer
    is correctly classified), and P3 invites a Goodhart response in which agent authors trim
    enforcement references to clear the warning -- degrading the traceability Decision 168 protects.
    The audit's own CFG-07 proposed_change says enforcement arrives "not a content classifier".
  - >-
    No NEW PERMANENTLY-advisory check may be introduced. This is narrower than "this repo has no
    advisory tier", which is false: Decision 167 clause 3 installed a WARN-tier size norm, Decision
    153 is titled "warn, not hard-fail", and validate_prose_limits emits standing advisories. The
    sanctioned shape is a DATED, staged pre-commitment with a measurable arming event and a reversal
    condition if it never fires (Decision 167 clause 3 is the worked example); the prohibited shape is
    an open-ended advisory with no arming trigger, which Decision 163 point 1 rules out as
    universal-in-name / discretionary-in-enforcement. Decision 170's examined()/skipped() channel is
    NOT a home for the f2 residual either: its status vocabulary has no "warned" member, so a
    print-only check declaring examined(n>0) is recorded as "enforced" -- extending that vocabulary
    would be its own ratified change, not a side effect of this plan.
  - >-
    Point at docs/contracts/decision-entry.yaml significance.routing_rule; never restate the
    three-question rule in ambient prose (Decision 167 clause 4 homed it there deliberately).
  - >-
    Never split AGENTS.md into @-imported fragments to relieve the byte budget (Decision 110/114
    anti-fragmentation) -- fragments are still transitively loaded.
  - >-
    Only modify files listed in Scope. Out-of-scope issues become recommendations via
    scripts/ops_data_portal, not inline fixes.
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND (125 of 125 triaged).
    CITE -- Decision 167, Decision 150, Decision 169, Decision 170, Decision 104, Decision 131,
    Decision 168, Decision 48, Decision 142, Decision 86, Decision 127, Decision 66, Decision 136,
    Decision 160, Decision 128, Decision 165, Decision 75, Decision 163, Decision 84, Decision 110,
    Decision 114, Decision 55.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)"
  - >-
    Scout flags and their disposition. CONTRADICT/NOTE on Decision 167 -- proxy P1 duplicates the
    armed hard cap: resolved by dropping the lint entirely. SPIRIT/WARN on Decision 163 -- a
    permanently advisory tier is universal-in-name/discretionary-in-enforcement: resolved by
    introducing no check at all; the standing no-advisory-tier policy is deferred to a follow-on rec
    (see the deferral note below), NOT recorded in the amendment.
    SPIRIT/WARN on Decision 150 -- suppressing the ruling would leave the mechanism with no reversal
    record: resolved by the Decision 167 amendment carrying a preflight-monitored stanza.
    NOTE on Decision 170 -- no "warned" state exists: resolved, since no check is added.
  - >-
    Derivation. Three abstracted industry-practice consults (detector validity; rationale homing and
    enforcement tier; migration acceptance) were run without repository context, then three
    lens-scoped applicability consults re-derived them against this repo, with a fourth holistic
    assessment retained as a comparison baseline. The lens-scoped round overturned three holistic
    conclusions: the reviewer-side control was assumed to exist and does not; the prevalence bound
    was computed over 23 entries when only 6 carry declarations (rule-of-three upper bound ~39%, not
    ~13%); and the T1.5 criterion must be appended, not merged into c2.
  - >-
    The case for dropping the lint rests on the detector being INVALID, not on the problem being
    absent -- six declared entries over ten days bounds nothing. The residual risk is therefore
    unmeasured and live, which is why the plan-critique verdict line (a working detector), the DD-B
    PR-body convention (the label collector) and the monitored reversal stanza (the revisit trigger)
    are load-bearing rather than incidental.
  - >-
    Deferral rationale for the open ci-rca block. Three open Critical ci-rca recs (rec-3166,
    rec-3169, rec-3175) share one fingerprint -- validate_graduation_completeness leaking outer-repo
    push context into injected fixture roots -- and are owned by the approved, merged
    docs/plans/PLAN-root-scoped-diff-base.yaml (bundles rec-3166; the other two are later recurrences
    of the same root cause). This plan satisfies none of the three Related-Work conditions (different
    file, different Decision, different failure category) and defers to that plan, sequenced AFTER
    this one at explicit operator direction so the S1 headroom reserved by
    PLAN-agents-md-ambient-trim is claimed and reseeded here before another session can close it.
    Named interaction, accepted: the deferred defect sits in validate_graduation_completeness --
    the same check that adjudicates this plan's graduate dispositions and its bundled-rec closure
    leg. The recorded failures are fixture-isolation incidents on the full tier, so plan-PR-leg risk
    is indirect rather than certain, but this plan runs ahead of the fix with that risk open.
  - >-
    Byte-budget landscape at authoring time. PLAN-agents-md-ambient-trim deliberately left
    config/prose_budgets.yaml unreseeded, so S1 has 7,157 bytes of reserved headroom against a
    ~600-byte addition; this plan reseeds S1 to its true size, closing the standing advisory.
    .claude/skills/planning/SKILL.md has 48 bytes headroom and an existing dec-150 marker that
    already authorizes any raise (Decision 150's body names the path; marker authorization matches
    the entry KEY, not its value). .claude/skills/plan-critique/SKILL.md has 106 bytes headroom and
    no marker -- Decision 75 clause 1 mandates adding a mandatory phase to exactly that file, so
    dec-75 is a substantively honest authorization, not a technicality.
  - >-
    Migration step 4's blockers are cleared: step 2 landed as Decision 167 (2026-08-07), step 3 as
    commit eaff804 (2026-08-13), which armed the per-entry cap to hard-fail. Decision 169 (10,499
    bytes) landed 2026-08-11, before that arming, so it is grandfathered by the forward-only baseline
    rule and is not a live violation.
  - >-
    Deferred, with the record damage named. The no-NEW-permanently-advisory-check rule is a
    forward-standing repo-wide commitment: applying decision-entry.yaml significance.routing_rule's
    three questions yields yes/yes/yes, which routes to numbered_decision -- it narrows what Decisions
    153 and 167 clause 3 currently sanction, so it is reversal-relevant, and no other routing row
    claims it. The operator's no-new-Decision constraint forbids that home for this change, so the
    rule is NOT minted by this plan and is filed as a follow-on rec instead. The resulting gap is a
    plain omission, NOT authoritative-but-wrong guidance: neither of the two entries that mention
    warn-tier enforcement grants an open-ended advisory with no arming trigger, which is the shape the
    deferred rule would prohibit. (They are not the same KIND of sanctioned instrument -- 167 clause 3
    is a dated staged pre-commitment, 153 a bounded waiver -- so what carries the argument is that
    neither is the prohibited shape, not that both match one sanctioned template.) Decision 153 is a bounded
    single-case waiver with a derived hard ceiling that fails closed and says in terms it is "not a
    general weakening"; Decision 167 clause 3 is a dated pre-commitment whose arming event already
    fired (eaff804, 2026-08-13), so its WARN tier is spent, not live. Neither is an open-ended
    advisory with no arming trigger, so no entry is annotated -- an earlier draft of this plan
    proposed under-review flags on both and was withdrawn once that premise was checked. Deferring is
    also right on its own terms: minting an org-wide prohibition inside an unrelated change is the
    legislative-rider anti-pattern, and no operator has ratified the narrowing. Constraint 3 still
    binds THIS plan's own work, which installs no check at all.
  - >-
    Known gap, accepted. This plan installs no mechanical detector for mis-declared significance
    routing. Detection is human/agent judgement at the plan-critique gate. The Decision 167
    amendment's reversal condition is what converts that from a permanent gap into a monitored one.
