    changed / why now / acute state / measurements as belonging in the squash-commit or PR body and
    never an entry body, with a pointer to docs/contracts/decision-entry.yaml
    significance.routing_rule. Add the DD-B convention line. Do not restate the three questions.
  - >-
    .github/pull_request_template.md -- add audit({slug}) to the trailing COMMIT-MESSAGE CONVENTIONS
    comment so all five prefixes are named; add the DD-B prompt to the "## Decisions" section comment.
  - >-
    .claude/skills/planning/SKILL.md -- extend the Decision Significance Gate to cite the required
    significance envelope marker (Decision 167 clause 2), require the author to state why a contract
    or in-place amendment was rejected before minting a number (rec-3015), and name amendment_forms
    as the routing alternative for single-call-site guard tweaks (rec-3016). Phrase each as a
    property test on the draft, never an open-ended "consider whether" prompt.
  - >-
    .claude/skills/plan-critique/SKILL.md -- author a NEW review section (this file has no
    "ratification" text today, so there is nothing to amend) AND add a matching row to the Phase-3
    structured-output template so the verdict is emitted, not merely instructed. The verdict fires
    whenever a plan drafts numbered "## Decision NNN:" text -- fresh governance Decision or CD
    ratification -- and states whether the drafted entry's claimed significance row matches its body,
    quoting verbatim the body sentence that satisfies or fails the three-question routing rule.
    Implement all three fixed details from the scope row: trigger detection (ratification block, or a
    docs/DECISIONS.md scope row plus a drafted "## Decision NNN:" heading -- amendment-only changes do
    not fire it), REVISE on mismatch, and the explicit N/A emission when the trigger does not fire.
  - >-
    docs/DECISIONS.md -- add a dated in-place amendment to Decision 167 recording ONLY that the f2
    routing-consistency lint is REJECTED (naming the construct-validity and Goodhart grounds) and that
    the deterministic subset already deployed is the permanent control. Do NOT put the
    no-advisory-tier rule here; it routes to check-accounting.yaml below. Include a fenced
    "```yaml reversal-conditions" stanza whose condition is a post-167 entry demonstrated mis-routed
