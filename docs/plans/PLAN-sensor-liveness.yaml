  - "Decisions cited: 55 (fail loud, no false negatives -- the empty-peer-set, dead-query, dispatch-only and shallow-clone raises), 62 (alarm-not-gate monitor lane, rec-2854), 83 (non-wedging: not added to required_status_checks), 84 I-3/I-4 (named reader verbs, no outbox), 103 (a resolved rec is never silently reactivated), 128 (decompose, never raise a SLOC budget), 178 clause 4 (terraform-drift cron restoration, discharged), 181 (declare enforcement coverage per surface), 182 (the two-quantity fast-tier budget -- step 8), 183 (new since the audit; no bearing on this leg, named so the re-base is auditable)."
  - "Decision-scout verdict + CITE list (verbatim decision ids)"
  - "gates: decision-scout=<verdict>; plan-critique=<verdict> after <N> round(s)"
  - "THRESHOLD DEVIATION, stated deliberately: the audit's acceptance says 2x cadence. GitHub scheduled runs are documented best-effort and are routinely delayed or dropped under load, so 2x on an hourly cron false-positives. This plan uses clamp(3 x period, 6h floor, 45d ceiling): the floor buys ~5 tolerated misses on an hourly loop, and the ceiling keeps the monthly cost-reconciliation loop's window inside the 90-day Actions run-retention horizon (a naive 3x monthly = 93d exceeds it and could never fire)."
  - "SELF-INCLUSION, stated deliberately: convergence-health is in its own derived peer set. Excluding it would be a filter on a set whose whole point is derivation, and it is not structurally impossible for the sensor to be stale -- the workflow also runs on workflow_dispatch, so a dispatched tick after the cron died correctly reports the sensor itself, which is the who-watches-the-watcher case the audit names. `?event=schedule` is what makes that reading honest."
  - "NOISE BUDGET, designed: within a staleness bucket the title and context are byte-identical, so the no-op guard fires and nothing is written; buckets advance on a log2 schedule (1x, 2x, 4x, 8x ...), so a permanently dead loop whose every rec is closed yields ~11 recs per YEAR, not one per hourly tick. A simultaneous multi-loop outage collapses to ONE rec once the stale count reaches a majority of the derived peer set -- the 2026-08-15 OIDC-rename incident (Decision 172) is the worked case: one root cause, several loops down at once."
