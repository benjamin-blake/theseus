schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sensor-liveness
intent: >-
  Give the schedule-bearing workflow fleet the liveness backstop audit finding LSA-02 says it lacks:
  a fifth, alarm-only leg on the existing convergence-health cron that asserts last-scheduled-run
  age for every peer derived at run time from the workflows' own `on:.schedule` blocks, and files
  one deduped alarm-lane rec per stale loop. Absence-of-runs becomes a detected condition instead of
  a silent one; nothing new gates a PR.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sensor-liveness.yaml
phase: >-
  Platform hardening -- standing-loop observability. Slice S2 of the loop-spec-adoption overseer run,
  driving audit finding LSA-02 from audits/loop-spec-adoption-4d8bac4a.yaml. Names NO tier_item and
  adds NO roadmap row (soft-warn exception category ad_hoc_rec), so the Tier Item Freshness Gate is
  skipped; the audit finding is the forward-intent carrier and deferred halves ride recs.
scope:
  - file: scripts/convergence_health/sensor_liveness.py
    action: Create
    purpose: >-
      The whole leg: peer-set derivation from .github/workflows/*.yml `on:.schedule` (with the
      PyYAML `on:`-parses-as-True normalization), the cron-shape cadence oracle and its clamped
      staleness threshold, the per-peer `?event=schedule` last-run query, the log2 staleness-bucket
      episode key, the four-verb file|update|unchanged|drop decision, the fleet-collapse rule, and
      the `--liveness-probe` acceptance oracle. Its own module because budget_ingest.py is already
      462 SLOC and code_drift.py 326 against the 500 ceiling (Decision 128 decompose-by-default).
  - file: scripts/convergence_health/__init__.py
    action: Modify
    purpose: >-
      Facade re-export of the new public surface plus its __all__ entries, and one submodule line in
      the docstring roster (lines 22-28) that declares the package's contents. SLOC-exempt --
      scripts/checks/sloc/_shared.py::iter_gated_py_files skips every __init__.py.
  - file: scripts/convergence_health/__main__.py
    action: Modify
    purpose: >-
      Two new entry points mirroring main_prod_drift/main_budget_ingest -- main_sensor_liveness() for
      the cron leg and main_liveness_probe(workflow) for the acceptance oracle -- plus their branches
      in _dispatch(). 108 SLOC today; ample headroom under 500.
  - file: .github/workflows/convergence-health.yml
    action: Modify
    purpose: >-
      One named step after "Ingest CI fast-tier budget breaches (rec-3288)", carrying
      `env: GH_TOKEN: ${{ github.token }}` like the budget-ingest step, plus a header paragraph
      stating the leg's alarm-only invariants. No `permissions:` change -- the job's existing
      `actions: read` (line 80) already covers listing workflow runs.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Mandatory r3_workflows entry for the new inline `run:` body --
      `.github/workflows/convergence-health.yml::health-check::assert-scheduled-loop-liveness-lsa-02: 2`
      -- without which scripts/checks/ci_guards/_workflow_shell_bodies.py:195-203 fails the PR.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      New `canonical_id: loop_liveness_stale` entry (description + signal_interpretation +
      added_date), following the prod_code_drift shape at lines 198-200 including its explicit
      "Priority High, not source=ci_rca -- does NOT hard-block the /plan queue" clause. Required:
      ops_data_portal validate_source rejects an unregistered source at write time.
  - file: scripts/checks/ops_governance/check_source_registry.py
    action: Modify
    purpose: >-
      Add scripts/convergence_health/sensor_liveness.py to SCANNED_PATHS so the new hardcoded
      "source" literal is statically guarded, taking the governance-correct side of a split
      precedent (escalate.py and code_drift.py are listed; budget_ingest.py is not).
  - file: tests/convergence_health/test_sensor_liveness.py
    action: Create
    purpose: >-
      The mirror test (auto-mapped -- map_source_to_test resolves the new module here with no
      scripts/test_coverage_checker.py edit). Carries the known-bad fixtures: a workflow whose
      `on:` key parses as True, an empty derived peer set, an unclassifiable cron shape, a peer
      whose only recent runs are workflow_dispatch, a dead GitHub query, a shallow clone, and a
      resolved rec at an earlier bucket.
  - file: tests/convergence_health/test___main__.py
    action: Modify
    purpose: Cover the two new _dispatch branches, mirroring the existing --budget-ingest routing tests.
  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: Cover the widened SCANNED_PATHS roster.
bundled_recommendations: []
followon_recs: [rec-3640]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The peer set is DERIVED at run time from every .github/workflows/*.yml `on:.schedule` block and
    is never declared anywhere; over the live tree it resolves to exactly the NINE schedule-bearing
    workflows (ci-rca-inactivity-sweep, codeql, convergence-health, cost-reconciliation, dedup-probe,
    dependabot-stranded, ghas-probe, main-canary, terraform-drift) -- nine, not the audit's stale
    eight, terraform-drift having regained `cron: '17 * * * *'` at PR #1082.
  - >-
    Peer derivation survives PyYAML parsing the bare `on:` key as Python True, and an empty derived
    peer set RAISES rather than reporting an all-clear -- the exact Decision 55 false-negative a
    naive `data.get("on")` would install.
  - >-
    Each peer's staleness threshold is derived from that workflow's OWN cron string (no per-workflow
    literal anywhere): nominal period from a hand-rolled 5-field shape matcher, then
    clamp(3 x period, 6h, 45d). An unclassifiable cron shape raises rather than being skipped.
  - >-
    The last-run query is per-peer, bounded, and filtered `?event=schedule&per_page=1` -- all nine
    peers also carry workflow_dispatch, so an unfiltered query lets a manual dispatch masquerade as
    cron liveness. A query that returns no payload RAISES (a dead sensor and a live fleet must not
    look the same); an empty workflow_runs LIST is a real signal, resolved against the workflow
    file's own first-commit age so a legitimately-new schedule is quiet and a silently-disabled one
    alarms.
  - >-
    Exactly one deduped rec per stale loop, filed via the ops portal with source
    `loop_liveness_stale`, using budget_ingest's four verbs file|update|unchanged|drop and never a
    close: restoring cadence closes nothing automatically.
  - >-
    A resolved rec is never resurrected AND a still-dead loop is never permanently muted: the open
    matcher keys on (loop, episode anchor) so a live episode updates in place, while the resolved
    matcher keys on (loop, episode anchor, staleness bucket) so closing a rec mutes only that
    bucket and continued deadness re-alarms on a log2 schedule (1x, 2x, 4x, 8x ... the threshold).
  - >-
    Title and context carry only bucket-quantised quantities, never the live age, so within a bucket
    the fields are byte-identical tick to tick and the no-op guard fires -- no duplicate SCD2 history
    row per hourly tick.
  - >-
    Fleet-collapse noise is bounded: when the stale count reaches a MAJORITY of the live peer set
    (derived as ceil(len(peers)/2), not a literal), one fleet rec naming every stale peer is filed
    instead of N per-loop recs, because N simultaneously-dead loops is one incident with one root
    cause, not N defects.
  - >-
    Alarm-only: nothing this plan adds gates a PR. convergence-health is neither of the two
    required_status_checks contexts (terraform/github/repo.tf:85-99) and stays `tier: not_a_gate /
    ci_rca: excluded` in config/ci_rca_taxonomy.yaml -- which this plan does not touch.
  - >-
    Each filed rec's `acceptance` is a real, discriminating, repo-local shell probe
    (`bin/venv-python -m scripts.convergence_health --liveness-probe <workflow>`) that exits non-zero
    while the loop is dead and zero once cadence is restored -- never `gh`, which is deliberately not
    installed in either container.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Peer derivation is `on:`-True-key correct and fails loud on an empty set -- the load-bearing
      false-negative guard. A synthetic workflow mapping whose only schedule lives under the Python
      True key is detected; a tree with no schedule-bearing workflow RAISES instead of returning an
      empty, reassuring result.
    command: |-
      bin/venv-python -c "
      from scripts.convergence_health.sensor_liveness import peers_from_workflow_docs
      true_key = {'name': 'x', True: {'schedule': [{'cron': '0 6 * * 1'}], 'workflow_dispatch': None}}
      assert peers_from_workflow_docs({'w.yml': true_key}) == {'w.yml': ['0 6 * * 1']}, 'on-as-True key not normalised'
      plain = {'name': 'x', 'on': {'schedule': [{'cron': '0 6 * * 1'}]}}
      assert peers_from_workflow_docs({'w.yml': plain}) == {'w.yml': ['0 6 * * 1']}, 'plain on key not read'
      assert peers_from_workflow_docs({'w.yml': {'name': 'x', 'on': {'push': None}}}) == {}, 'non-scheduled workflow admitted'
      raised = False
      try:
          peers_from_workflow_docs({}, require_non_empty=True)
      except Exception:
          raised = True
      assert raised, 'an empty derived peer set must RAISE, never report an all-clear'
      print('PEER_DERIVATION_OK')
      "
    expected: Exit 0 and PEER_DERIVATION_OK.
    fix_if: >-
      A KeyError or an empty dict for the True-key document means the normalization
      (`data.get("on", data.get(True, {}))`, the idiom at scripts/verify_ci_workflow.py:15-19 and
      scripts/checks/ci_guards/validate_ci_rca_adjudication.py:57) is missing -- add it. No raise on
      the empty tree means the sensor would report all-clear forever from a broken parse; add the
      fail-loud guard.
    hermetic: true
    graduation: graduate
    graduation_check_id: sensor-liveness-peer-derivation-on-key
  - step: 2
    phase: pre-deploy
    action: >-
      Live fleet enumeration: derived over the real .github/workflows tree the peer set is exactly
      the NINE schedule-bearing workflows, terraform-drift.yml among them -- correcting the audit's
      stale count of eight and proving the derivation reads the tree, not a fixture.
    command: |-
      bin/venv-python -c "
      from scripts.convergence_health.sensor_liveness import derive_scheduled_peers
      peers = derive_scheduled_peers()
      expected = {'ci-rca-inactivity-sweep.yml', 'codeql.yml', 'convergence-health.yml', 'cost-reconciliation.yml', 'dedup-probe.yml', 'dependabot-stranded.yml', 'ghas-probe.yml', 'main-canary.yml', 'terraform-drift.yml'}
      assert set(peers) == expected, {'missing': sorted(expected - set(peers)), 'unexpected': sorted(set(peers) - expected)}
      assert peers['terraform-drift.yml'] == ['17 * * * *'], peers['terraform-drift.yml']
      assert peers['convergence-health.yml'] == ['37 * * * *'], peers['convergence-health.yml']
      print('LIVE_PEERS %d' % len(peers))
      "
    expected: Exit 0 and LIVE_PEERS 9.
    fix_if: >-
      A count other than 9 means either the derivation is wrong or the fleet legitimately changed
      since this plan was authored. Re-enumerate the tree by hand before touching the code: if a
      workflow was genuinely added or removed, update this step's expected set (a plan amendment),
      never the derivation.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins one moment's workflow fleet by name. Graduating it would red every legitimate future
      addition or removal of a scheduled workflow, which is precisely the declared-register drift the
      audit rejected P1 for. The durable half of this assertion -- that derivation reads the tree and
      fails loud on an empty result -- is graduated at step 1 instead.
  - step: 3
    phase: pre-deploy
    action: >-
      Threshold oracle over the four live cron SHAPES: hourly, every-N-hours, weekly-by-dow and
      monthly-by-dom map to their nominal periods; the clamp lifts hourly to the 6h floor and holds
      monthly at the 45d ceiling; an unclassifiable shape raises rather than defaulting.
    command: |-
      bin/venv-python -c "
      from scripts.convergence_health.sensor_liveness import cron_period_seconds, staleness_threshold_seconds
      assert cron_period_seconds('37 * * * *') == 3600
      assert cron_period_seconds('0 */3 * * *') == 10800
      assert cron_period_seconds('0 6 * * 1') == 604800
      assert cron_period_seconds('0 6 4 * *') == 2678400
      assert staleness_threshold_seconds('37 * * * *') == 21600, 'hourly must clamp UP to the 6h floor, not 3h'
      assert staleness_threshold_seconds('0 */3 * * *') == 32400
      assert staleness_threshold_seconds('0 6 * * 1') == 1814400
      assert staleness_threshold_seconds('0 6 4 * *') == 3888000, 'monthly must clamp DOWN to the 45d ceiling'
      raised = False
      try:
          cron_period_seconds('0 6 4 * 1')
      except Exception:
          raised = True
      assert raised, 'an unclassifiable cron shape must raise, never be silently skipped'
      print('THRESHOLD_ORACLE_OK')
      "
    expected: Exit 0 and THRESHOLD_ORACLE_OK.
    fix_if: >-
      A wrong period means the 5-field shape matcher misreads a field; a wrong threshold means the
      clamp order is wrong (clamp AFTER multiplying, floor before ceiling). A silent default instead
      of a raise on the unclassifiable shape is the Decision 55 anti-masking violation this step
      exists to catch -- never widen the matcher to swallow it.
    hermetic: true
    graduation: graduate
    graduation_check_id: sensor-liveness-threshold-oracle
  - step: 4
    phase: pre-deploy
    action: >-
      Episode grain: the four verbs and the deliberate open/resolved key asymmetry. Same bucket with
      an open rec -> unchanged (no SCD2 churn); bucket advance with an open rec -> update; a resolved
      rec at the SAME (loop, anchor, bucket) -> drop; a resolved rec at an EARLIER bucket only ->
      file. Plus the fleet-collapse majority rule.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py::TestEpisodeGrain tests/convergence_health/test_sensor_liveness.py::TestFleetCollapse -q
    expected: All tests pass; the drop case files nothing and reopens nothing, and the earlier-bucket case files a NEW rec.
    fix_if: >-
      A drop on the earlier-bucket case means the resolved matcher is keying on (loop, anchor) alone
      -- that permanently mutes a still-dead loop the moment a human closes its rec, which is
      LSA-02's own defect re-created one level up. A file on the same-bucket case means the resolved
      sweep is not consulted at all and a closed rec will be resurrected hourly (Decision 103).
    hermetic: false
    graduation: graduate
    graduation_check_id: sensor-liveness-episode-grain-verbs
  - step: 5
    phase: pre-deploy
    action: >-
      Anti-masking, all four fail-loud paths: a dead GitHub query raises instead of reporting an
      empty (reassuring) population; `?event=schedule` is load-bearing, so a peer whose only recent
      runs are workflow_dispatch reads STALE where an unfiltered query would read fresh; an empty
      workflow_runs list falls back to the workflow file's first-commit age; a shallow clone raises
      before that fallback can misreport.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py::TestAntiMasking -q
    expected: All tests pass, including the known-bad fixture for each of the four paths.
    fix_if: >-
      A test that reports "no stale loops" from a query that never ran is the exact false negative
      Decision 55 forbids and budget_ingest._DEAD_QUERY_MESSAGE exists to prevent -- raise instead.
      A dispatch-only peer reading fresh means the `event=schedule` parameter was dropped from the
      URL.
    hermetic: false
    graduation: graduate
    graduation_check_id: sensor-liveness-anti-masking
  - step: 6
    phase: pre-deploy
    action: >-
      Whole-suite green across the three touched test modules, and the new mirror test stays ONE file
      under the 500-SLOC ceiling so no tests/convergence_health/sensor_liveness/ package (and
      therefore no scripts/test_coverage_checker.py _CONCERN_SPLIT_TEST_PACKAGES edit) is dragged in.
    command: |-
      bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py tests/convergence_health/test___main__.py tests/checks/ops_governance/test_check_source_registry.py -q
      bin/venv-python -c "
      import pathlib
      def sloc(rel):
          lines = pathlib.Path(rel).read_text(encoding='utf-8').splitlines()
          return len([l for l in lines if l.strip() and not l.strip().startswith('#')])
      module = sloc('scripts/convergence_health/sensor_liveness.py')
      mirror = sloc('tests/convergence_health/test_sensor_liveness.py')
      assert module < 500, ('module SLOC', module)
      assert mirror < 500, ('mirror test SLOC', mirror)
      print('SLOC ok module=%d test=%d' % (module, mirror))
      "
    expected: All tests pass and SLOC ok with both counts under 500.
    fix_if: >-
      A count at or above 500 means DECOMPOSE, never raise the budget (Decision 128) -- split the
      module along its own seams (derivation / threshold oracle / dedupe) into a second submodule and
      re-export through the facade. Do NOT add an entry to config/sloc_budgets.yaml.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-module pytest run duplicates the node-level shards graduated at steps 4 and 5, and the
      SLOC half is already a registered check in both tiers (validate_sloc_limits over
      scripts/checks/sloc/_shared.py's 500 ceiling). A shard here would pin this PR's transient line
      counts forever.
  - step: 7
    phase: pre-deploy
    action: >-
      Governance wiring, asserted against the real enforcing modules rather than by grep: the
      r3_workflows baseline key exists at the exact slug the scanner derives with the matching line
      count, the new source is a registered canonical_id, the module is in the source-registry scan
      set, and the facade re-exports the new surface.
    command: |-
      bin/venv-python -c "
      import pathlib, yaml
      import scripts.convergence_health as ch
      from scripts.checks.ci_guards._workflow_shell_bodies import scan_workflow_bodies
      from scripts.checks.ops_governance.check_source_registry import SCANNED_PATHS
      key = '.github/workflows/convergence-health.yml::health-check::assert-scheduled-loop-liveness-lsa-02'
      bodies = scan_workflow_bodies()
      assert key in bodies, sorted(k for k in bodies if 'convergence-health' in k)
      baseline = yaml.safe_load(pathlib.Path('config/composite_action_body_baseline.yaml').read_text())['r3_workflows']
      assert baseline.get(key) == bodies[key], (baseline.get(key), bodies[key])
      entries = yaml.safe_load(pathlib.Path('config/agent/data_quality/source_registry.yaml').read_text())['entries']
      assert 'loop_liveness_stale' in {e['canonical_id'] for e in entries}
      assert 'scripts/convergence_health/sensor_liveness.py' in SCANNED_PATHS
      assert hasattr(ch, 'detect_stale_loops') and hasattr(ch, 'main_sensor_liveness')
      print('WIRING_OK')
      "
    expected: Exit 0 and WIRING_OK.
    fix_if: >-
      A missing baseline key means the step name was changed after the entry was written -- re-derive
      the slug with _name_slug (lowercase, every non-alphanumeric run collapsed to one hyphen) rather
      than guessing. A missing canonical_id means every portal write from this leg is rejected at
      write time by validate_source.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Every clause here is already enforced fleet-wide by a registered check in both tiers
      (_workflow_shell_bodies' R3 leg, check_source_registry, validate_acceptance_literals); a shard
      would be a fifth copy of the same oracle bound to this one PR's key names, and the R3 leg
      already fails loudly on an unregistered body.
  - step: 8
    phase: pre-deploy
    action: >-
      Decision 182 budget prediction over this plan's own declared scope -- the fast tier now asserts
      TWO quantities (NON_TEST_BUDGET_SECONDS = 240, unwaivable, plus the breadth-derived test half),
      so the scope must be shown to clear them before implementation, not discovered in CI.
    command: |-
      bin/venv-python -m scripts.checks.deps.selection_budget --plan docs/plans/PLAN-sensor-liveness.yaml > /tmp/sensor-liveness-budget.txt 2>&1 \
        && grep -E '^(scope|test-execution allowance|predicted CI|predicted outcome)' /tmp/sensor-liveness-budget.txt \
        && grep -qx 'predicted outcome: within_budget' /tmp/sensor-liveness-budget.txt
    expected: >-
      Exit 0 and the printed report ends `predicted outcome: within_budget` (measured at plan time:
      11 paths, n_selected 123 of a 539 census, allowance 246s, predicted CI elapsed 111.2-142.6s
      against the 240s non-test budget). The reporter exits 0 on every path -- the grep is what
      makes this step assert rather than merely print.
    fix_if: >-
      breadth_waived means keep the scope and DECLARE the measured breadth here; breach means SPLIT
      the scope into atomic units until the prediction clears; non_test_breach means neither -- the
      non-test half is drifting and no scope change fixes it, so stop and open a planning session
      against the recorded static_s series (Decision 182 point 6).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this one scope's transient selection breadth, which is meaningless once merged, and the
      durable budget contract is already asserted on every --pre run by validate.py's budget-assertion
      scaffold over scripts/checks/deps/selection_budget.py (Decision 182 point 6).
  - step: 9
    phase: pre-deploy
    action: >-
      Scope boundary, both directions: the working-tree status diff equals exactly the ten declared
      scope files plus this plan's own sanctioned path and the four sanctioned graduation shards --
      nothing outside, nothing declared but untouched. The five files this slice must not touch,
      because a concurrently-running sibling slice or a later wave owns them, are asserted absent by
      name from BOTH the declared set and the touched set.
    command: |-
      bin/venv-python -c "
      from scripts.checks import _common
      touched = {p for _s, p in _common.get_status_aware_diff()}
      expected = {
          'scripts/convergence_health/sensor_liveness.py',
          'scripts/convergence_health/__init__.py',
          'scripts/convergence_health/__main__.py',
          '.github/workflows/convergence-health.yml',
          'config/composite_action_body_baseline.yaml',
          'config/agent/data_quality/source_registry.yaml',
          'scripts/checks/ops_governance/check_source_registry.py',
          'tests/convergence_health/test_sensor_liveness.py',
          'tests/convergence_health/test___main__.py',
          'tests/checks/ops_governance/test_check_source_registry.py',
          'docs/plans/PLAN-sensor-liveness.yaml',
          'config/agent/verification_registry/entries/sensor-liveness-peer-derivation-on-key.yaml',
          'config/agent/verification_registry/entries/sensor-liveness-threshold-oracle.yaml',
          'config/agent/verification_registry/entries/sensor-liveness-episode-grain-verbs.yaml',
          'config/agent/verification_registry/entries/sensor-liveness-anti-masking.yaml',
      }
      forbidden = {'docs/DECISIONS.md', 'docs/ROADMAP-PLATFORM.yaml', 'config/ci_rca_taxonomy.yaml', 'config/sloc_budgets.yaml', 'scripts/verify_ci_workflow.py'}
      assert not (forbidden & expected), sorted(forbidden & expected)
      assert not (forbidden & touched), {'forbidden_touched': sorted(forbidden & touched)}
      assert touched == expected, {'outside_declared_scope': sorted(touched - expected), 'declared_but_untouched': sorted(expected - touched)}
      print('TOUCHED_SET_EXACT %d' % len(touched))
      "
    expected: Exit 0 and TOUCHED_SET_EXACT 15.
    fix_if: >-
      forbidden_touched names one of the five barred files: docs/DECISIONS.md and
      docs/ROADMAP-PLATFORM.yaml are owned by a concurrently-running sibling slice (two concurrent
      Decision mints collide at the same hunk and contend for the same number),
      config/ci_rca_taxonomy.yaml belongs to the LSA-05 cap/stop-declaration slice, and
      config/sloc_budgets.yaml plus scripts/verify_ci_workflow.py are never-touch by construction
      (the latter sits at exactly 500/500 SLOC). STOP and hand back rather than editing any of them.
      outside_declared_scope names an undeclared path: revert that edit -- never resolve it by
      appending the path to this plan's scope, which is a STOP under the scope-boundary contract's
      deviation branch b. declared_but_untouched means a scope row was not implemented.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts this diff's own transient file set, meaningless once merged, and the durable rule it
      instantiates is already a registered check in both tiers (validate_scope_boundary reading
      docs/contracts/implement-scope-boundary.yaml). A shard would pin one PR's file list forever.
  - step: 10
    phase: pre-deploy
    action: >-
      Both presubmit tiers green before the handoff: the fast tier is the authoritative pre-merge
      gate when PR CI runs it (Decision 73), and the full tier is the pre-handoff local obligation
      this plan's handoff_policy declares.
    command: |-
      bin/venv-python -m scripts.validate --pre
      bin/venv-python -m scripts.validate
    expected: Both invocations exit 0 with "All checks passed."
    fix_if: >-
      A red in the fast tier is fixed on the branch (no ci-rca rec is filed for a PR-branch --pre
      failure; ci-rca watches main only). A red in the full tier blocks the commit outright per
      handoff_policy.timeout_disposition -- resume later and rerun the full tier from the start,
      never commit past it.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      After merge, the first scheduled convergence-health tick on main runs the new step GREEN and
      its stdout reports nine peers assessed. This is the only step exercising the live Actions API:
      the agent proxy returns HTTP 403 for direct api.github.com calls from a session container and
      the gh CLI is deliberately not installed, so the live path is reachable only from the workflow
      itself and its evidence is read back through the github MCP server.
