constraints:
  - >-
    THIS SLICE MINTS NO NUMBERED DECISION and must not touch docs/DECISIONS.md. It is the fifth
    instance of an already-ratified pattern (Decision 62's alarm-not-gate monitor lane, realised four
    times on this same cron as tf_convergence_stale / ducklake_code_drift / prod_code_drift /
    budget_breach), and neither the prod-drift nor the rec-3288 budget-ingest leg minted one.
    Per docs/contracts/decision-entry.yaml's routing_rule the content routes to `field_semantics` --
    the new source_registry canonical_id's description and signal_interpretation, exactly where
    prod_code_drift's equivalent semantics live. A concurrent sibling slice is minting the next
    number; two concurrent mints collide at the same hunk. If analysis concludes a Decision is
    genuinely required, STOP and hand back BLOCKED.
  - >-
    Do NOT touch docs/ROADMAP-PLATFORM.yaml (zero roadmap rows this run; deferred forward intent is
    filed as a rec with `dependencies`, never a tier_item), config/ci_rca_taxonomy.yaml (owned by the
    LSA-05 cap/stop-declaration slice; convergence-health's row at line 267 already covers this
    workflow and no new workflow is added, so validate_ci_rca_adjudication's two-way census stays
    satisfied), or config/sloc_budgets.yaml.
  - >-
    Do NOT build the audit's bundled "P5-amended leg (c): marker-gate schedule:-block removal". That
    is a GATE and belongs to the verifier-weakening-guards slice; it would drag
    scripts/checks/_marker_guard.py, docs/contracts/marker-grammar.yaml and a new registered check
    into an alarm-only slice. This slice's whole value proposition is that a removed `schedule:`
    block stops producing runs and therefore trips the age assertion with no gate at all.
  - >-
    scripts/verify_ci_workflow.py is at EXACTLY 500/500 SLOC and is OUT OF SCOPE. Do not pin more
    crons there (the _check_canary pattern at lines 156-164): that is leg (c) by another route, turns
    an alarm into a PR blocker, and breaches the ceiling on the first added line. Never raise a SLOC
    budget -- decompose (Decision 128).
  - >-
    No new declared state. The peer set, its cadences and its thresholds are DERIVED at run time from
    the workflows themselves; do not create docs/contracts/loop-spec.yaml, a `sensors:` block, or a
    config/loop_liveness.yaml. The audit rejected P1/P2/P3 for exactly this (a fourth register over
    the same population is the drift-by-design second surface NS6 and AGENTS.md prohibit).
  - >-
    No cron library. croniter or any dependency drags in requirements.lock, dependency governance and
    the runtime-lock cache-key assertions. Hand-roll a bounded 5-field shape matcher tested against
    the nine live literals.
  - >-
    The sensor SURFACES, never remediates: no workflow_dispatch of a stale peer, no schedule edit, no
    close verb. This is pinned by convergence-health.yml's own alarm-only invariants (lines 14-19).
  - >-
    Every external dependency injected (gh_caller, portal_caller, open_recs, resolved_recs, the git
    runner, `now`) so the module is unit-testable with no network -- mirroring
    ingest_budget_breaches' signature. A dead query RAISES; there is no outbox (Decision 84 I-4).
  - >-
    Portal writes only through file_rec / update_rec. Never Edit or Write logs/*.jsonl -- a read cache
    is never a write source, and replaying one upstream is the row-resurrection failure recorded in
    Decision 84.
  - Never `gh` in any authored command, script, check or VP step -- the gh and hub CLIs are deliberately not installed in either container; the github MCP server is the sanctioned surface.
  - No rescue agents or workaround loops (Decision 55). Out-of-scope bugs become recommendations, not inline fixes.
