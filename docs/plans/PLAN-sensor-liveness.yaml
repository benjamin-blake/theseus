schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: sensor-liveness
intent: >-
  Give the schedule-bearing workflow fleet the liveness backstop audit finding LSA-02 says it lacks:
  a fifth, alarm-only leg on the existing convergence-health cron that asserts last-scheduled-run
  age for every peer derived at run time from the workflows' own `on:.schedule` blocks, and files
  one deduped alarm-lane rec per stale loop. Absence-of-runs becomes a detected condition instead of
  a silent one; nothing new gates a PR.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sensor-liveness.yaml
phase: >-
  Platform hardening -- standing-loop observability. Slice S2 of the loop-spec-adoption overseer run,
  driving audit finding LSA-02 from audits/loop-spec-adoption-4d8bac4a.yaml. Names NO tier_item and
  adds NO roadmap row (soft-warn exception category ad_hoc_rec), so the Tier Item Freshness Gate is
  skipped; the audit finding is the forward-intent carrier and deferred halves ride recs.
scope:
  - file: scripts/convergence_health/sensor_liveness.py
    action: Create
    purpose: >-
      The whole leg: peer-set derivation from .github/workflows/*.yml `on:.schedule` (with the
      PyYAML `on:`-parses-as-True normalization, fail-loud by default), the cron-shape cadence oracle
      and its clamped staleness threshold, the per-peer `?event=schedule` last-run query, the log2
      staleness-bucket episode key, the four-verb file|update|unchanged|drop decision, the
      correlated-outage collapse rule, and the `--liveness-probe` acceptance oracle. Its own module because budget_ingest.py is already
      462 SLOC and code_drift.py 326 against the 500 ceiling (Decision 128 decompose-by-default).
  - file: scripts/convergence_health/__init__.py
    action: Modify
    purpose: >-
      Facade re-export of the new public surface plus its __all__ entries, and one submodule line in
      the docstring roster (lines 22-28) that declares the package's contents. SLOC-exempt --
      scripts/checks/sloc/_shared.py::iter_gated_py_files skips every __init__.py.
  - file: scripts/convergence_health/__main__.py
    action: Modify
    purpose: >-
      Two new entry points mirroring main_prod_drift/main_budget_ingest -- main_sensor_liveness() for
      the cron leg and main_liveness_probe(workflow) for the acceptance oracle -- plus their branches
      in _dispatch(). 108 SLOC today; ample headroom under 500.
  - file: .github/workflows/convergence-health.yml
    action: Modify
    purpose: >-
      One named step after "Ingest CI fast-tier budget breaches (rec-3288)", carrying
      `env: GH_TOKEN: ${{ github.token }}` like the budget-ingest step, plus a header paragraph
      stating the leg's alarm-only invariants. No `permissions:` change -- the job's existing
      `actions: read` (line 80) already covers listing workflow runs.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Mandatory r3_workflows entry for the new inline `run:` body --
      `.github/workflows/convergence-health.yml::health-check::assert-scheduled-loop-liveness-lsa-02: 2`
      -- without which scripts/checks/ci_guards/_workflow_shell_bodies.py:195-203 fails the PR.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      New `canonical_id: loop_liveness_stale` entry (description + signal_interpretation +
      added_date), following the prod_code_drift shape at lines 198-200 including its explicit
      "Priority High, not source=ci_rca -- does NOT hard-block the /plan queue" clause. Required:
      ops_data_portal validate_source rejects an unregistered source at write time. Its
      signal_interpretation is ALSO the home of this leg's three tuning/grain calls, because the
      no-mint routing claim below says field semantics land here and nowhere else: (a)
      clamp(2 x period, 6h, 45d) with the DETECTION LATENCY each bound imposes stated numerically
      (6 hours hourly, 14 days weekly, 45 days monthly) AND the ceiling's own grounding (45d is the
      largest threshold whose first bucket, spanning [T, 2T), fits inside the 90-day run-retention
      horizon), (b) the FLEET_COLLAPSE_MIN_STALE = 3
      correlated-outage override that turns N simultaneous stale loops into one fleet rec, and why
      3 rather than a majority, and (c) the log2 bucket schedule with its TWO-LEG post-closure dwell
      -- same-anchor +1-bucket, cross-anchor one-threshold-since-closure.
      Stating them here is what makes the routing claim true rather than merely asserted.
  - file: scripts/checks/ops_governance/check_source_registry.py
    action: Modify
    purpose: >-
      Add scripts/convergence_health/sensor_liveness.py to SCANNED_PATHS so the new hardcoded
      "source" literal is statically guarded, taking the governance-correct side of a split
      precedent (escalate.py and code_drift.py are listed; budget_ingest.py is not).
  - file: tests/convergence_health/test_sensor_liveness.py
    action: Create
    purpose: >-
      The mirror test (auto-mapped -- map_source_to_test resolves the new module here with no
      scripts/test_coverage_checker.py edit). Carries the known-bad fixtures: a workflow whose `on:`
      key parses as True, an empty derived peer set at BOTH the pure seam and through
      `detect_stale_loops`, an unclassifiable cron shape, a peer whose only recent runs are
      workflow_dispatch, a dead GitHub query, a shallow clone, a peer whose native `state` is
      disabled_inactivity, a `state: active` peer past its threshold that must still alarm, a
      resolved rec two buckets back, a resolved rec exactly one bucket back (the same-anchor dwell),
      several resolved recs at different buckets in one episode (the MAX-not-first case), a resolved
      rec at a DIFFERENT anchor closed inside and outside the cross-anchor dwell, a sweep row whose
      title matches only through LIKE's `_` wildcard, a golden title literal and the constructed LIKE
      pattern, a recovery-then-redeath that must update rather than file, a fleet collapse a new peer
      joins after closure, and counts over MAX_TITLE_SWEEPS and MAX_REC_BY_ID.
  - file: tests/convergence_health/test___main__.py
    action: Modify
    purpose: Cover the two new _dispatch branches, mirroring the existing --budget-ingest routing tests.
  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: Cover the widened SCANNED_PATHS roster.
bundled_recommendations: []
followon_recs: [rec-3640, rec-3665]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The peer set is DERIVED at run time from every .github/workflows/*.yml `on:.schedule` block and
    is never declared anywhere; over the live tree it resolves to exactly the NINE schedule-bearing
    workflows (ci-rca-inactivity-sweep, codeql, convergence-health, cost-reconciliation, dedup-probe,
    dependabot-stranded, ghas-probe, main-canary, terraform-drift) -- nine, not the audit's stale
    eight, terraform-drift having regained `cron: '17 * * * *'` at PR #1082.
  - >-
    Peer derivation survives PyYAML parsing the bare `on:` key as Python True, and an empty derived
    peer set RAISES rather than reporting an all-clear -- the exact Decision 55 false-negative a
    naive `data.get("on")` would install. Fail-loud is the DEFAULT, not an opt-in flag: the
    production chain main_sensor_liveness -> detect_stale_loops -> derive_scheduled_peers passes no
    flag and inherits the guard, only a test opts out, and both halves are asserted -- the signature
    default at VP step 1 and the production chain's own raise at VP step 5.
  - >-
    Each peer's staleness threshold is derived from that workflow's OWN cron string (no per-workflow
    literal anywhere): nominal period from a hand-rolled 5-field shape matcher, then
    clamp(2 x period, 6h, 45d) -- the audit's own multiplier, with the delay tolerance carried by the
    6h FLOOR, which is where it actually bites, rather than by an inflated multiplier. An
    unclassifiable cron shape raises rather than being skipped.
  - >-
    The last-run query is per-peer, bounded, and filtered `?event=schedule&per_page=1` -- all nine
    peers also carry workflow_dispatch, so an unfiltered query lets a manual dispatch masquerade as
    cron liveness. A query that returns no payload RAISES (a dead sensor and a live fleet must not
    look the same); an empty workflow_runs LIST is a real signal, resolved against the workflow
    file's own first-commit age so a legitimately-new schedule is quiet and a silently-disabled one
    alarms.
  - >-
    The single likeliest cause -- GitHub's 60-day inactivity auto-disable -- is read from GitHub's
    OWN native primitive rather than inferred (Decision 100): ONE bounded
    `GET /repos/{owner}/{repo}/actions/workflows?per_page=100` per tick supplies each peer's `state`
    (active | disabled_inactivity | disabled_manually), and that value DISCRIMINATES the filed rec's
    remediation text -- re-enable the workflow vs. investigate a delivery drop. The age assertion
    stays the general oracle and is never replaced by `state`: it is a strict superset that also
    catches a removed `schedule:` block, a deleted workflow and a silent delivery drop, each of
    which leaves `state: active`. A missing or unparseable `state` degrades the remediation text to
    the generic form; it never suppresses the age-derived alarm.
  - >-
    Catalog egress is bounded and LAZY (Decision 88 clause 1(ii)): a tick with zero stale peers
    issues ZERO warehouse reads and constructs no reader at all. A stale tick pays one open-recs
    fetch, ONE `recs_by_title_prefix` sweep per stale episode, and AT MOST ONE `rec_by_id` per stale
    episode (the cross-anchor post-closure dwell of criterion 8, and nothing else). The LIKE pattern
    is stated here literally because `recs_by_title_prefix` is
    `... WHERE title LIKE ? ORDER BY id` (src/common/ducklake_scd2_schema.py:345-351) and binds the
    WHOLE pattern -- there is NO implicit trailing `%`, exactly as the precedent
    `f"{_BUDGET_TITLE_PREFIX}%on {branch}"` (budget_ingest.py:396) shows. The pattern is
    `f"Loop: {k}.%"` -- trailing `%` mandatory; a pattern without it matches only titles EXACTLY
    EQUAL to the prefix, which no title ever is, so the sweep would return zero rows on every tick
    forever, never find the resolved mute, fall through to `file`, and re-file hourly after every
    human closure -- Decision 142 / rec-2644 and Decision 103 verbatim. Because LIKE also treats `_`
    as a single-character wildcard (the fleet key `__fleet__` carries four), every returned row is
    re-filtered CLIENT-SIDE on the exact markers -- `title.startswith(f"Loop: {k}. ")`, source
    `loop_liveness_stale`, status in RESOLVED_REC_STATUSES -- which is the same re-filter
    `_fetch_resolved_budget_recs`'s docstring names as what makes its own over-broad match harmless.
    Both call caps -- `MAX_TITLE_SWEEPS = len(peers) + 1` and `MAX_REC_BY_ID = len(peers) + 1` -- are
    on the CALL COUNT and are STRUCTURALLY unreachable (there cannot be more stale peers than derived
    peers), so a raise means a real invariant violation, never accumulated history. Rows per sweep
    are the loop's own lifetime `loop_liveness_stale` recs -- ~11/year for a permanently-dead loop at
    the log2 rate, 0-2 realistically, four small columns each -- which is the honest cost of the
    loop-only prefix criterion 8 requires. Row growth NEVER stops the sensor; only a cap sized
    against an accumulating population would, and neither cap here is.
  - >-
    Exactly one deduped rec per stale loop, filed via the ops portal with source
    `loop_liveness_stale`, using budget_ingest's four verbs file|update|unchanged|drop and never a
    close: restoring cadence closes nothing automatically.
  - >-
    A resolved rec is never resurrected, a still-dead loop is never permanently muted, and NO
    death-recovery-death cycle mints an episode per recovery -- stated at its true width, because the
    two mechanisms below cover DIFFERENT halves of the flap and neither covers both. The open matcher
    keys on (loop) ALONE, so a loop has at most ONE open rec ever and a redeath while that rec is
    open UPDATES it in place; that is the whole of the flap protection WHILE A REC IS OPEN, and it is
    the half an earlier draft over-claimed as the whole. Once a human CLOSES the rec, a redeath
    changes the anchor by construction (a recovery means a new `run:{id}`), so a resolved matcher
    pinned to `Episode: {a}.` would find no mute and re-file -- so the resolved matcher is deliberately
    keyed on the LOOP alone at the sweep, and discriminates client-side on the returned title in two
    legs. Leg 1, same anchor: take the MAXIMUM bucket over the loop's resolved recs carrying the
    CURRENT `Episode: {a}.` marker and mute while `current_bucket <= max_resolved_bucket + 1`, so
    continued deadness re-alarms on a log2 schedule (1x, 2x, 4x, 8x ... the threshold) and a closure
    anywhere inside the recorded bucket still buys one full bucket-width (>= threshold, >= 6h) of
    dwell. Leg 2, cross anchor: the loop's newest resolved rec at a DIFFERENT anchor (highest id --
    `recs_by_title_prefix` orders by id, which is monotone in filing order) is fetched with ONE
    `rec_by_id` and its `last_updated_timestamp` -- the closure instant, as recorded by the last SCD2
    write -- gates a drop while `now - closed_at < threshold`. Leg 2 exists because the anchor is
    what a flap destroys, so an anchor-keyed dwell cannot see across one, and only a timestamp can:
    the residual it closes is exactly the case where the human closes the rec AFTER the loop has
    re-died but BEFORE the leg has noticed (inside the sub-threshold window), which is the only
    ordering that escapes the anchor mechanics -- if the recovery run lands after the closure, the
    next filing is already at recovery + threshold and the dwell holds with no read at all. This is
    the ONE `rec_by_id` in the design and it is deliberately not a fan-out: exactly one call, only on
    a stale tick, only when leg 1 did not already mute, capped at `MAX_REC_BY_ID = len(peers) + 1`.
    The alternative -- comparing buckets ACROSS episodes -- is rejected outright: a closure at
    bucket 9 would then mute every future episode below bucket 11 (256 days on an hourly loop), which
    is LSA-02 re-created inside its own fix.
  - >-
    Title and context carry only bucket-quantised quantities, never the live age, so within a bucket
    the fields are byte-identical tick to tick and the no-op guard fires -- no duplicate SCD2 history
    row per hourly tick. The three episode markers are carried in the TITLE and the title BEGINS with
    them, START-ANCHORED at offset 0, in exactly this shape:
    `Loop: {k}. Episode: {a}. Bucket: {n}. Scheduled loop has not run within its derived threshold`
    -- markers first, human-readable tail after. "In that order" is NOT sufficient and was the
    earlier wording's defect: a title reading `Scheduled loop stale -- Loop: x. Episode: y.
    Bucket: 2.` has the markers in order and matches the `Loop: {k}.%` LIKE pattern NOTHING, because
    a LIKE pattern with a trailing `%` and no leading one is start-anchored. The context restates the
    three markers for a human reader only.
  - >-
    Correlated-outage collapse is bounded AND reachable at incident timescale: when the stale count
    reaches `FLEET_COLLAPSE_MIN_STALE = 3`, one fleet rec naming every stale peer is filed instead of
    N per-loop recs, because N simultaneously-dead loops is one incident with one root cause, not N
    defects. Three, not a majority: the live threshold classes are 6h x3 (both hourly loops plus
    main-canary), 14d x5 (the weeklies) and 45d x1 (monthly), so a total delivery outage reaches 3
    stale at T+6h but would not reach a 5-of-9 majority until T+14d -- a majority rule would have
    missed the 2026-08-15 OIDC-rename incident (Decision 172) entirely, since it resolved in days. On
    a collapse tick the per-loop episodes are SUPPRESSED, not closed: any already-open per-loop rec
    is left untouched (no update, no close) and the fleet rec carries the full stale roster. The
    fleet episode's BUCKET is derived from its OWN anchor age exactly as a per-loop bucket is --
    `floor(log2((now - since_ts) / FLEET_THRESHOLD_SECONDS)) + 1`, where `since_ts` is the fleet
    anchor and `FLEET_THRESHOLD_SECONDS` is the minimum threshold over the DERIVED peer set (6h over
    the live tree). Both terms are constant within an episode by construction -- the anchor because an
    anchor change IS a new episode, the divisor because it is a pure function of the workflow tree --
    so the fleet bucket is monotone non-decreasing within an episode, which is what the +1-bucket
    dwell requires. It is explicitly NOT `min(bucket over stale peers)`: `min` over a GROWING set is
    non-monotonic, and on this plan's own timeline it silences a fleet outage a human acknowledged.
    Fleet rec filed at T+6h; human closes at T+2d (age 48h / 6h -> bucket 4); at T+14d the five weekly
    peers join at bucket 1; `min` drops to 1; `1 <= 4 + 1` -> drop; the rec stays muted until `min`
    reaches 6, i.e. the weeklies at 32 x 14d ~= 448 days. That is LSA-02 re-created for the fleet
    pseudo-loop and it contradicts this criterion's own siblings; the own-anchor derivation cannot
    produce it.
  - >-
    The new `loop_liveness_stale` signal_interpretation carries all three tuning calls verbatim --
    (a) `clamp(2 x period, 6h, 45d)` with what each bound buys (the floor tolerates ~5 missed hourly
    runs; the ceiling is the LARGEST threshold whose FIRST staleness bucket fits entirely inside the
    90-day Actions run-retention horizon, since bucket 1 spans age [T, 2T) and 2 x 45d = 90d exactly,
    so the whole of bucket 1 is observable with a live `run:{id}` anchor and the anchor flip to
    `intro:{sha}` lands ON a bucket boundary rather than inside one -- at the unclamped 2x monthly of
    62d, bucket 1 spans [62d, 124d) and the anchor flips mid-bucket, changing the episode's identity
    underneath an open rec without a bucket advance) AND the DETECTION LATENCY each bound imposes,
    stated as a number: 6 hours to detect a dead hourly loop, 14 days a dead weekly loop, 45 days a
    dead monthly loop; (b) the
    `FLEET_COLLAPSE_MIN_STALE = 3` correlated-outage override and why 3 rather than a majority; and
    (c) the log2 bucket schedule with its two-leg post-closure dwell (same-anchor +1-bucket,
    cross-anchor one-threshold-since-closure). So the field semantics live
    exactly where this plan's own no-mint routing claim says they land, and a future reader finds
    them at the registry entry rather than only in a merged plan file.
  - >-
    Alarm-only: nothing this plan adds gates a PR. convergence-health is neither of the two
    required_status_checks contexts (terraform/github/repo.tf:85-99) and stays `tier: not_a_gate /
    ci_rca: excluded` in config/ci_rca_taxonomy.yaml -- which this plan does not touch.
  - >-
    Each filed rec's `acceptance` is a real, discriminating, repo-local shell probe
    (`bin/venv-python -m scripts.convergence_health --liveness-probe <workflow>`) that exits non-zero
    while the loop is dead and zero once cadence is restored -- never `gh`, which is deliberately not
    installed in either container.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Peer derivation is `on:`-True-key correct and fails loud on an empty set BY DEFAULT -- the
      load-bearing false-negative guard, asserted on the SIGNATURE so an implementer cannot ship the
      production path with the guard off. A synthetic workflow mapping whose only schedule lives
      under the Python True key is detected; a tree with no schedule-bearing workflow RAISES on the
      DEFAULT call instead of returning an empty, reassuring result; and only a test that explicitly
      passes `require_non_empty=False` opts out.
    command: |-
      bin/venv-python -c "
      import inspect
      from scripts.convergence_health.sensor_liveness import peers_from_workflow_docs
      default = inspect.signature(peers_from_workflow_docs).parameters['require_non_empty'].default
      assert default is True, ('fail-loud must be the DEFAULT, not opt-in; got', default)
      true_key = {'name': 'x', True: {'schedule': [{'cron': '0 6 * * 1'}], 'workflow_dispatch': None}}
      assert peers_from_workflow_docs({'w.yml': true_key}) == {'w.yml': ['0 6 * * 1']}, 'on-as-True key not normalised'
      plain = {'name': 'x', 'on': {'schedule': [{'cron': '0 6 * * 1'}]}}
      assert peers_from_workflow_docs({'w.yml': plain}) == {'w.yml': ['0 6 * * 1']}, 'plain on key not read'
      assert peers_from_workflow_docs({'w.yml': {'name': 'x', 'on': {'push': None}}}, require_non_empty=False) == {}, 'non-scheduled workflow admitted'
      raised = False
      try:
          peers_from_workflow_docs({})
      except Exception:
          raised = True
      assert raised, 'an empty derived peer set must RAISE by DEFAULT, never report an all-clear'
      print('PEER_DERIVATION_OK')
      "
    expected: Exit 0 and PEER_DERIVATION_OK.
    fix_if: >-
      A KeyError or an empty dict for the True-key document means the normalization
      (`data.get("on", data.get(True, {}))`, the idiom at scripts/verify_ci_workflow.py:15-19 and
      scripts/checks/ci_guards/validate_ci_rca_adjudication.py:57) is missing -- add it. A default of
      False means fail-loud was shipped opt-in: invert it, never "remember to pass the flag at the
      call site". No raise on the empty tree means the sensor would report all-clear forever from a
      broken parse; add the fail-loud guard.
    hermetic: true
    graduation: graduate
    graduation_check_id: sensor-liveness-peer-derivation-on-key
  - step: 2
    phase: pre-deploy
    action: >-
      Live fleet enumeration: derived over the real .github/workflows tree the peer set is exactly
      the NINE schedule-bearing workflows, terraform-drift.yml among them -- correcting the audit's
      stale count of eight and proving the derivation reads the tree, not a fixture.
    command: |-
      bin/venv-python -c "
      from scripts.convergence_health.sensor_liveness import derive_scheduled_peers
      peers = derive_scheduled_peers()
      expected = {'ci-rca-inactivity-sweep.yml', 'codeql.yml', 'convergence-health.yml', 'cost-reconciliation.yml', 'dedup-probe.yml', 'dependabot-stranded.yml', 'ghas-probe.yml', 'main-canary.yml', 'terraform-drift.yml'}
      assert set(peers) == expected, {'missing': sorted(expected - set(peers)), 'unexpected': sorted(set(peers) - expected)}
      assert peers['terraform-drift.yml'] == ['17 * * * *'], peers['terraform-drift.yml']
      assert peers['convergence-health.yml'] == ['37 * * * *'], peers['convergence-health.yml']
      print('LIVE_PEERS %d' % len(peers))
      "
    expected: Exit 0 and LIVE_PEERS 9.
    fix_if: >-
      A count other than 9 means either the derivation is wrong or the fleet legitimately changed
      since this plan was authored. Re-enumerate the tree by hand before touching the code: if a
      workflow was genuinely added or removed, update this step's expected set (a plan amendment),
      never the derivation.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Pins one moment's workflow fleet by name. Graduating it would red every legitimate future
      addition or removal of a scheduled workflow, which is precisely the declared-register drift the
      audit rejected P1 for. The durable half of this assertion -- that derivation reads the tree and
      fails loud on an empty result -- is graduated at step 1 instead.
  - step: 3
    phase: pre-deploy
    action: >-
      Threshold oracle over the four live cron SHAPES: hourly, every-N-hours, weekly-by-dow and
      monthly-by-dom map to their nominal periods; at the 2x multiplier the clamp lifts both hourly
      loops UP to the 6h floor, lands main-canary's 3h period exactly ON the floor, leaves the five
      weekly peers UNCLAMPED at 14d (the one assertion that proves the multiplier itself is applied
      rather than swallowed by a bound) and holds monthly DOWN at the 45d ceiling; an unclassifiable
      shape raises rather than defaulting.
    command: |-
      bin/venv-python -c "
      from scripts.convergence_health.sensor_liveness import cron_period_seconds, staleness_threshold_seconds
      assert cron_period_seconds('37 * * * *') == 3600
      assert cron_period_seconds('0 */3 * * *') == 10800
      assert cron_period_seconds('0 6 * * 1') == 604800
      assert cron_period_seconds('0 6 4 * *') == 2678400
      assert staleness_threshold_seconds('37 * * * *') == 21600, 'hourly must clamp UP to the 6h floor, not 2h'
      assert staleness_threshold_seconds('0 */3 * * *') == 21600, 'a 3h loop lands exactly ON the 6h floor at 2x'
      assert staleness_threshold_seconds('0 6 * * 1') == 1209600, 'weekly is unclamped: 2 x 7d = 14d'
      assert staleness_threshold_seconds('0 6 4 * *') == 3888000, 'monthly must clamp DOWN to the 45d ceiling'
      raised = False
      try:
          cron_period_seconds('0 6 4 * 1')
      except Exception:
          raised = True
      assert raised, 'an unclassifiable cron shape must raise, never be silently skipped'
      print('THRESHOLD_ORACLE_OK')
      "
    expected: Exit 0 and THRESHOLD_ORACLE_OK.
    fix_if: >-
      A wrong period means the 5-field shape matcher misreads a field; a wrong threshold means the
      clamp order is wrong (clamp AFTER multiplying, floor before ceiling). A silent default instead
      of a raise on the unclassifiable shape is the Decision 55 anti-masking violation this step
      exists to catch -- never widen the matcher to swallow it.
    hermetic: true
    graduation: graduate
    graduation_check_id: sensor-liveness-threshold-oracle
  - step: 4
    phase: pre-deploy
    action: >-
      Episode grain: the four verbs, the key asymmetry, and THE TITLE/PATTERN COMPOSITION ITSELF.
      Same bucket with an open rec -> unchanged (no SCD2 churn); bucket advance with an open rec ->
      update; a recovery-then-redeath with an open rec -> update, NOT a new episode, because the open
      matcher keys on the loop alone; a resolved rec at the SAME (loop, anchor) with MAX bucket N ->
      drop while current <= N + 1 and file at N + 2; a resolved rec at a DIFFERENT anchor closed less
      than one threshold ago -> drop (the cross-anchor dwell), and file once that threshold elapses.
      `TestEpisodeGrain::test_title_prefix_composition` is the load-bearing addition: it asserts the
      CONSTRUCTED LIKE pattern string equals `Loop: convergence-health.yml.%` -- trailing `%` present
      -- and that a golden title LITERAL, written out by hand in the test and NOT composed through
      the producer's own helper, both starts with `Loop: ` at offset 0 and is matched by that pattern
      under Python's own `fnmatch` translation of LIKE. A fixture that built its titles through the
      same helper as the producer could not catch a pattern/title mismatch at all. Plus the
      FLEET_COLLAPSE_MIN_STALE = 3 correlated-outage rule, its suppress-not-close interaction with
      already-open per-loop recs, and the fleet bucket's own-anchor derivation.
      Hermetic by Decision 148 clause 3: two narrow
      node selections over a fully-injected module with no network, no creds and no writes, replayed
      at implement time against the implementation-bearing tree -- well inside validate_vp_replay's
      30s PER_STEP_TIMEOUT_SECONDS. This is the anti-regression evidence for rec-2644's defect class
      (Decision 142), so it is the step whose independent re-execution matters most.
    command: bin/venv-python -m pytest tests/convergence_health/test_sensor_liveness.py::TestEpisodeGrain tests/convergence_health/test_sensor_liveness.py::TestFleetCollapse -q
    expected: >-
      All tests pass; the constructed pattern carries its trailing `%` and matches the hand-written
      golden title; the drop cases file nothing and reopen nothing, the two-buckets-back and
      dwell-elapsed cases file a NEW rec, the redeath-while-open case updates the single open rec
      rather than filing a second, and the fleet bucket rises rather than falling when a new peer
      joins a collapse.
    fix_if: >-
      A pattern without its trailing `%` reds test_title_prefix_composition and is the single most
      dangerous defect in this leg: `recs_by_title_prefix` is `WHERE title LIKE ?` with NO implicit
      wildcard, so a bare prefix matches only titles exactly equal to it, the sweep returns zero rows
      forever, the resolved mute is never found and every human closure is followed by a fresh rec on
      the next tick -- Decision 142 / rec-2644 verbatim. A golden title that does not start at
      offset 0 with `Loop: ` fails the same node and means the human-readable summary was put in
      front of the markers. A drop on the two-buckets-back case means the resolved matcher took the
      FIRST rather than the MAX bucket, or dropped the +2 boundary -- that permanently mutes a
      still-dead loop the moment a human closes its rec, which is
      LSA-02's own defect re-created one level up. A file on the same-bucket case means the resolved
      sweep is not consulted at all and a closed rec will be resurrected hourly -- Decision 142's
      rec-2644 finding exactly (a closed rec flipped back to open on a coarse-key match, discarding
      the closed rec's fix-proof), one level up and on a different table (Decision 103). A file on
      the redeath-while-open case means the anchor was left in the OPEN key: widen it to the loop
      alone, or a
      flapping hourly loop mints up to four bucket-1 recs a day and the log2 bound -- which bounds
      recs per EPISODE, not episodes -- buys nothing. A file one bucket back means the same-anchor
      dwell is missing: a human who closes at 03:20 gets a fresh rec at the 03:37 tick. A file
      immediately after a closure at a NEW anchor means the cross-anchor leg is missing -- that is
      the half the open key cannot cover, and it needs the closure timestamp, not another bucket
      comparison. A fleet bucket that DROPS when a peer joins means it was derived as
      `min(bucket over stale peers)` instead of from the fleet episode's own anchor age.
    hermetic: true
    graduation: graduate
    graduation_check_id: sensor-liveness-episode-grain-verbs
