      which `execution_steps` already places inside TestAntiMasking and which an earlier draft's
      prose undercounted), INCLUDING the production chain: `detect_stale_loops`
      itself raises when derivation yields an empty peer set -- the flag is not passed at that call
      site, it is the DEFAULT, and this is the assertion proving the production path
      main_sensor_liveness -> detect_stale_loops -> derive_scheduled_peers inherits the guard rather
