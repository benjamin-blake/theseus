execution_steps:
  - >-
    Create scripts/convergence_health/sensor_liveness.py with a module docstring in budget_ingest.py's
    register, stating in order: what absence-of-runs defect this closes and why the existing backstops
    miss it; PEER SET IS DERIVED, NEVER DECLARED (and the `on:`-as-True normalization, with the
    empty-set raise); THRESHOLD IS DERIVED FROM EACH CRON, with the clamp constants and the named
    real-world property each defends; EPISODE GRAIN, spelling out why the open matcher keys on (loop,
    anchor) and the resolved matcher on (loop, anchor, bucket) and what each alternative breaks;
    NO-OP UPDATES ARE SKIPPED, and why bucket-quantised fields are what make that guard fire;
    FILE/UPDATE ONLY, NEVER CLOSE; FLEET COLLAPSE; FAIL LOUDLY, NO OUTBOX.
  - >-
    Implement derivation: `derive_scheduled_peers()` walks .github/workflows/*.yml|*.yaml from the
    checkout, `peers_from_workflow_docs(docs, require_non_empty=False)` is the pure seam the tests
    drive, reading `data.get("on", data.get(True, {}))`. Returns {filename: [cron, ...]}. Raise when
    require_non_empty and the result is empty.
  - >-
    Implement the threshold oracle: `cron_period_seconds(expr)` -- a bounded 5-field shape matcher
    over `*/N` in minute, `*` and `*/N` in hour, literal hour with `* *` dom/dow, literal dow, literal
    dom (use 31 days so the window is never tighter than reality); raise on anything else.
    `staleness_threshold_seconds(expr)` clamps 3 x period into [6h, 45d]. Both pure.
  - >-
    Implement the query: per peer, GET /repos/{owner}/{repo}/actions/workflows/{file}/runs?event=schedule&per_page=1
    through an injected gh_caller (default `approvals._make_github_caller`). Nine bounded calls, never
    a repo-wide listing (a monthly loop's last run is unreachable by pagination). No payload -> raise
    with a _DEAD_QUERY-shaped message. Empty workflow_runs -> fall back to the workflow file's
    first-commit age via an injected git runner, after an `_assert_full_history` guard mirroring
    code_drift.py:35-52.
  - >-
    Implement the episode key and the four verbs: anchor is `run:{id}` or `intro:{sha}`; bucket is
    0 while fresh, else floor(log2(age/threshold)) + 1. Context carries `Loop: {k}.`,
    `Episode: {a}.`, `Bucket: {n}.` verbatim -- those three substrings are the matcher's whole
    contract. Open matcher: first two markers. Resolved matcher: all three, over
    RESOLVED_REC_STATUSES fetched with `recs_by_title_prefix` + `rec_by_id` (mirroring
    _fetch_resolved_budget_recs); reuse escalate._fetch_open_recs for the open half. Decide
    update|unchanged|drop|file exactly as budget_ingest._decide_action does, and add _DRY_RUN_LABELS.
  - >-
    Implement the fleet-collapse rule: when len(stale) >= ceil(len(peers)/2), emit ONE episode keyed
    `Loop: __fleet__.` with anchor `since:{max last-run timestamp among stale peers}` and bucket
    min(bucket over stale peers), naming every stale peer in the context, instead of the per-loop
    episodes. Same source, same verbs -- a second source value would be invisible to the matcher.
  - >-
    Implement `detect_stale_loops(...)` returning {"peers", "stale", "filed", "updated", "unchanged",
    "dropped", "fleet_collapse"}, and the `--liveness-probe [workflow]` oracle that exits 0 when the
    named peer (or every peer) is within its derived threshold and 1 otherwise -- this is the command
    every filed rec's `acceptance` names, so it must be discriminating and must not use gh.
  - >-
    Wire the leg: main_sensor_liveness / main_liveness_probe in __main__.py plus their _dispatch
    branches; facade re-exports and the docstring roster line in __init__.py; the named workflow step
    with GH_TOKEN and the header paragraph; the r3_workflows baseline key; the source_registry
    canonical_id (prod_code_drift's shape, including its not-source=ci_rca clause); the SCANNED_PATHS
    entry.
  - >-
    Write tests/convergence_health/test_sensor_liveness.py as ONE file under 500 SLOC, with classes
    TestPeerDerivation, TestThresholdOracle, TestEpisodeGrain, TestFleetCollapse, TestAntiMasking,
    TestWorkflowWiring, and a test pinning RESOLVED_REC_STATUSES against
    src.common.ducklake_scd2_schema (mirroring budget_ingest's). Every class carries its known-bad
    fixture. Extend tests/convergence_health/test___main__.py and
    tests/checks/ops_governance/test_check_source_registry.py.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55), never patch around it.
  - Author the four graduated registry shards named in steps 1, 3, 4 and 5 at their exact graduation_check_ids.
  - 'Report: what was implemented, verification results, the live peer count observed on the first scheduled tick, and any rec the leg filed.'
