    Decision 100 binds the disabled-workflow reading: GitHub exposes workflow `state` natively
    (active | disabled_inactivity | disabled_manually), so read the primitive instead of vendoring
    an inference for it. Scope the reliance precisely -- `state` refines the filed rec's remediation
    text ONLY. It never becomes the alarm oracle: the age assertion is the strict superset that also
    catches a removed `schedule:` block, a deleted workflow and a delivery drop, all of which leave
    `state: active`. This does not license a cron library (see the no-croniter constraint) -- that
    is not a GitHub primitive.
  - >-
    Portal writes only through file_rec / update_rec. Never Edit or Write logs/*.jsonl -- a read cache
    is never a write source, and replaying one upstream is the row-resurrection failure recorded in
    Decision 84.
  - Never `gh` in any authored command, script, check or VP step -- the gh and hub CLIs are deliberately not installed in either container; the github MCP server is the sanctioned surface.
  - No rescue agents or workaround loops (Decision 55). Out-of-scope bugs become recommendations, not inline fixes.
