    runner, `now`) so the module is unit-testable with no network -- mirroring
    ingest_budget_breaches' signature. A dead query RAISES; there is no outbox (Decision 84 I-4).
  - >-
    Decision 88 binds this leg: it adds a RECURRING catalog read path (~720 ticks/month on an hourly
    cron), so clause 1(ii) (never re-query what is already in hand, and reach the warehouse only
    through a registered named verb) and clause 2 (the read cost must be stated, not assumed) are
    live obligations. Every fetch is LAZY -- a tick with zero stale peers constructs no reader and
    issues no query at all. The episode markers live in the TITLE, so `recs_by_title_prefix`'s own
    (id, title, status, source) columns decide the SAME-ANCHOR half of the resolved match with no
    further read; the CROSS-ANCHOR dwell needs the closure instant, which no named verb projects
    except via `rec_by_id`'s `SELECT *`, so it costs AT MOST ONE `rec_by_id` per stale episode and
    only when the same-anchor half did not already mute. That is a single call, not a fan-out, and it
    is not a reversal of the title-marker design -- the title still decides everything the title can
    decide; a timestamp is the one thing it cannot carry, because a rec's title is written before its
    closure exists. Both caps are on the CALL COUNT --
    `MAX_TITLE_SWEEPS = len(peers) + 1` and `MAX_REC_BY_ID = len(peers) + 1` --
    quantities that cannot be exceeded without an invariant violation, since a stale set is a subset
    of the derived peer set. Do NOT reintroduce a cap sized against an ACCUMULATING rec population:
    `loop` is a permanent workflow identity, so its resolved recs accumulate forever at the ~11/year
    rate the log2 bucketing deliberately produces, and a raise-on-overflow against that population
    is a sensor that silently stops sensing after about a year -- LSA-02 re-created two levels up.
    That accumulation IS what the loop-only sweep prefix now returns as rows, and that is the
    accepted cost of the criterion-8 dwell: rows grow, calls do not, and only a cap on rows would
    stop the sensor.
