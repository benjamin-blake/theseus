  - "DECISION 62 IS NOT THE RATIFYING LANE, correcting this plan's own earlier grounding: Decision 62's body decides the OPPOSITE -- no Claude Code cron agent, and no scheduling concern separate from validation itself. An alarm-not-gate monitor lane exists only in its 2026-06-16 premise-revisit amendment, and that amendment is scoped to LIVE-READER-dependent DQ checks specifically, sourced to CD.12 and owned by tier_item T1.6. It is not a general lane and this leg is not inside it. The no-mint conclusion is unaffected -- Decision 150 clause 1 + Decision 167 clause 2 carry it independently, and the four live source_registry instances are the precedent. Decision 62 is cited here for one thing only: the silent-cron gap its amendment names."
  - "LATENT DEFECT IN THE DECISION LOG, surfaced by the scout, NOT fixed here: that same amendment asserts the silent-cron failure mode is mitigated by a persistent-unavailability alarm (Decision 74). Decision 74 is the npm EACCES / workflow_dispatch escape-hatch entry and contains no such alarm -- so the log records as already-existing the exact mitigation THIS PLAN supplies. Fixing it inline is barred by Decision 59 and by this plan's own never-touch constraint on docs/DECISIONS.md; filed as rec-3665 (followon_recs) instead."
  - "DECISION 88 READ ACCOUNTING (clause 2's measurement obligation, discharged at design time), RE-MEASURED after the criterion-8 cross-anchor dwell landed: the leg adds a recurring path on an hourly cron -- ~720 ticks/month. Steady state on a healthy fleet is ZERO warehouse reads and no reader construction per tick, because every rec fetch is lazy behind a non-empty stale set; the marginal per-tick cost is instead 10 bounded GitHub Actions API calls (9 per-peer run queries + 1 workflows listing). A stale tick pays 1 open-recs fetch + at most len(peers)+1 recs_by_title_prefix sweeps + at most len(peers)+1 rec_by_id, i.e. <= 21 catalog reads. The open-recs fetch is `_fetch_open_recs`, which calls `named(\"open_recs\")` with NO `limit` and therefore returns EVERY open rec with its context (938 today) in one response -- correctness is unaffected (the verb is paginable, so an absent limit is a full read, never a silent truncation), and clause 2 counts it as exactly 1 read, which is how it is counted above. Both caps are on the CALL COUNT and are structurally unreachable (a stale set is a subset of the derived peer set) -- which is exactly what distinguishes them from a cap sized against an accumulating rec population, where normal growth reaches the cap by design and a raise there stops the sensor sensing. Rows per sweep are the loop's own lifetime loop_liveness_stale recs (~11/year for a permanently-dead loop at the log2 rate, 0-2 realistically), four small columns each -- the accepted, stated cost of pinning the sweep to the loop alone so the cross-anchor dwell can see across a flap. Worst case (every tick stale for a month) is <= 15,120 metadata reads; the realistic case is a handful per year."
  - "LEG (c) DEFERRAL, recorded rather than implicit (Decision 163): 163's enforcement-shape principle prefers a structural, exceptionless instrument over detection-after-the-fact for a universal obligation, and the audit's P5-amended marker-gate on `schedule:`-block removal is exactly that instrument. It is deliberately NOT built here: it is a GATE, it belongs with the LSA-01 verifier-weakening-guards slice that owns _marker_guard.py and marker-grammar.yaml, and dragging it into an alarm-only leg would turn this into a PR blocker. This leg is 163-compatible as the alarm complement, not a substitute: it detects a removed schedule: block with no gate at all, on any route including the ones a marker gate cannot see (a delivery drop, an inactivity auto-disable). The choice is a deferral to a named owner, not an omission."
  - "THRESHOLD: the audit's 2x is ADOPTED, not deviated from; the tolerance lives in the CLAMP, which is where it actually bites. clamp(2 x period, 6h floor, 45d ceiling) over the four live shapes -- both hourly loops clamp UP to 6h (the floor buys ~5 tolerated misses, which is the real defence against GitHub's documented best-effort scheduled delivery); main-canary's 3h period lands exactly ON the floor; the five weekly peers are UNCLAMPED at 14d; cost-reconciliation clamps DOWN to the 45d ceiling. THE CEILING'S RATIONALE, re-grounded because the 3x-era wording did not survive the move to 2x: bucket 1 spans age [T, 2T), so 45d is the LARGEST threshold whose first bucket fits entirely inside the 90-day Actions run-retention horizon (2 x 45d = 90d exactly). At 45d the whole of bucket 1 is observable with a live `run:{id}` anchor and the anchor flip to `intro:{sha}` lands ON the bucket boundary; at the unclamped 2x monthly of 62d bucket 1 spans [62d, 124d) and the anchor flips MID-bucket, changing an open episode's identity without a bucket advance. The earlier wording asserted instead that '2x monthly = 62d and 3x = 93d both overrun the useful window', which is FALSE on this plan's own numbers for 62d (62 < 90) -- and criterion 11 puts this rationale verbatim into source_registry.yaml, so a numerically false claim would have become a governance artifact. An earlier draft of this plan used 3x and was corrected: the delay-tolerance argument it rested on is NULL at the hourly end, because 2x and 3x both clamp to the same 6h there, and it is identical on the monthly peer too, so 3x differed from 2x on only main-canary (6h -> 9h) and the five weeklies (14d -> 21d) -- five of nine peers losing a week of detection latency for a reason that by the plan's own arithmetic cannot apply to them."
  - "SELF-INCLUSION, kept but NOT claimed as who-watches-the-watcher coverage: convergence-health is in its own derived peer set, because excluding it would be a hand-maintained filter on a set whose whole point is derivation, and a dispatched tick after the cron died does correctly report the sensor itself (`?event=schedule` is what makes that reading honest). But it is INERT as residual coverage: a workflow_dispatch tick needs a human to notice and press the button, and the premise of LSA-02 is precisely that nobody notices. Self-inclusion pays off only once someone is already looking, so it does not narrow the residual below."
  - "NOISE BUDGET, designed: within a staleness bucket the title and context are byte-identical, so the no-op guard fires and nothing is written; buckets advance on a log2 schedule (1x, 2x, 4x, 8x ...), so a permanently dead loop whose every rec is closed yields ~11 recs per YEAR before the +1-bucket same-anchor dwell and fewer after it, not one per hourly tick. FLAPPING needs TWO mechanisms, not one, because the log2 bound bounds recs per EPISODE and bounds nothing about episode count, and a flap changes the anchor by construction. While a rec is OPEN the loop-only open key carries it: a death-recovery-death cycle updates the one open rec (one SCD2 history row per episode transition, <= 4/day on a 6h threshold) instead of filing a fresh bucket-1 rec per cycle. Once the rec is CLOSED the open key is silent, and the anchor mechanics alone already cover the common ordering -- if the recovery run lands after the closure, the next filing is at recovery + threshold, so a full threshold of quiet is bought with no read at all. The ONE ordering that escapes both is a closure landing after the redeath but inside the sub-threshold window before the leg notices; that is what the cross-anchor closure-timestamp dwell exists for, and without it a human closing each rec on a 6h-threshold loop that flaps every 6h would see up to four fresh recs a day resume. A correlated multi-loop outage collapses to ONE rec at 3 simultaneously stale peers, which a total delivery outage reaches at T+6h -- and 3 rather than a 5-of-9 majority precisely because the worked case, the 2026-08-15 OIDC-rename incident (Decision 172), resolved in days and would never have reached a majority, the weekly peers not crossing until T+14d."
  - "RETENTION DISCONTINUITY, named rather than discovered: past ~90 days dead, every `event=schedule` run ages out of the Actions retention window, `workflow_runs` comes back EMPTY, and the anchor flips `run:{id}` -> `intro:{sha}` on an otherwise-unchanged loop. That is a new episode, so the bucket JUMPS to its `intro:{sha}`-relative value rather than continuing the run-relative series. The direction is safe -- the workflow file's first-commit age always exceeds the last-run age, so the bucket only ever jumps UP, never resetting to 1 and never muting. WHAT THE FLIP DOES DEPENDS ON WHETHER A REC IS OPEN, corrected from an earlier wording that claimed the loop-only open key covers it unconditionally: while a rec is OPEN the loop-only open matcher does update it in place rather than filing a second one; once the prior rec has been CLOSED the flip is an anchor change like any other, so the same-anchor sweep leg finds nothing and it is the CROSS-ANCHOR dwell of criterion 8 -- one threshold since the closure instant -- that decides whether the flip files now or waits. Named here so a future reader meets the discontinuity in the design rather than in a rec diff."
  - "DECLARED RESIDUAL (Decision 181 declare-your-coverage, per surface), stated at its true width. A leg riding the convergence-health cron cannot report that cron dying -- Decision 172 records exactly that (the rename outage disabled ci-rca AND convergence-health, so nothing auto-filed and a stale-green record masked it). Three consequences an earlier draft understated. (1) The leg is STRONGEST against uncorrelated single-loop death and WEAKEST against the correlated case, so the correlated-outage collapse rule's own cited incident -- the Decision 172 OIDC outage -- is exactly the case this leg cannot observe, because that outage took the cron the leg rides. The collapse rule shapes noise for correlated outages that SPARE convergence-health; it is not coverage of the one that does not. (2) This plan makes convergence-health carry a FIFTH sensing leg (escalate, ducklake code drift, prod-class code drift, budget ingest, now this), so it INCREASES concentration on a single cron rather than diversifying it. That is an argued cost, not an oversight: a second cron is a second thing to keep alive and would need its own liveness backstop, and the honest complement is a different SURFACE, not a second workflow. (3) That complement is preflight's session-time signal, whose own blindness is rec-3640, so LSA-02 is only FULLY closed once rec-3640 lands -- the forward link is recorded here and in followon_recs as the named closure condition. rec-3640 keeps `dependencies: []` deliberately: the dependency runs LSA-02 -> rec-3640, not the reverse, and putting it on the rec would record the link backwards. No VP step in this plan claims the residual."
  - "FAIL-LOUD SURFACES ONLY AS A RED RUN, and that channel is itself blind -- named because the residual above stops one step short of it. Every raise this leg adds (empty peer set, unclassifiable cron, dead query, shallow clone, either call cap) fails the convergence-health step, which fails the health-check job, which turns the scheduled run red. That run is `tier: not_a_gate / ci_rca: excluded` in config/ci_rca_taxonomy.yaml, so nothing gates and ci-rca files nothing; the only watcher of a red-but-unactioned convergence-health run is preflight `_check_convergence_sensor_liveness`, which is permanently blind on CC-web for exactly the reason rec-3640 records (it shells out to `gh run list`, absent from both containers, and swallows FileNotFoundError as OSError -> None). So this leg's own fail-loud lands in the same blind channel whose blindness the residual already names as LSA-02's closure condition. That is deliberate and not fixed here -- scripts/preflight/ is out of scope and rec-3640 owns it -- but it is stated rather than left for a reader to discover: until rec-3640 lands, a raise in this leg is visible only to someone who opens the Actions tab."
  - "HERMETIC FLIP PAYOFF (Decision 148): steps 1-5, 7 and 9 are now hermetic pre-deploy, so validate_vp_replay's implement leg independently re-executes them against the implementation-bearing tree once the implement session sets `implementation_declared: true` (implement skill step 3 of the bookkeeping walk). On this plan-only PR the same check DEFERS with a printed reason -- that is the expected, correct output here, not a miss. No `expected` field on a hermetic step carries backtick literals, so replay asserts exit-0 only and no accidental substring contract is created."
  - "Live-path unreachability, discovered this session and load-bearing for VP design: the agent proxy returns HTTP 403 for direct api.github.com calls from a session container, and gh/hub are not installed. The sensor's live path is therefore exercised only inside the workflow; steps 1-10 are fully injected/mocked and step 11 reads the real run back through mcp__github__*."
  - "DEFERRED HALVES, filed not deferred to prose (followon_recs = rec-3640, rec-3665): rec-3640 -- the same discovery shows scripts/preflight/ci_rca_signals.py's two liveness signals shell out to `gh run list` and swallow FileNotFoundError as OSError -> None, so both are permanently blind on CC-web. Same anti-masking class as LSA-02 one level up, different surface (preflight, not the cron), and scripts/preflight/ is out of this slice's scope. Filed with dependencies [] -- it does not depend on this leg."
  - "Effort: the audit says S; this plan agrees only because the two S-breaking items are settled HERE rather than at implementation time -- the cadence oracle is a bounded shape matcher (no library) and the episode grain is fixed above as the key asymmetry plus its two dwell legs (open matcher on the loop alone; resolved sweep on the loop alone, discriminated client-side into a same-anchor MAX-bucket +1 dwell and a cross-anchor one-threshold-since-closure dwell costing at most one rec_by_id). Left to implementation, both make this a low-M."
  - "Branch was cut fresh from origin/main (a702e438) this session and REBASED onto origin/main 0e9cc16f before the plan-critique round-2 push (clean, no conflict); no scope file overlaps main_files_changed_since_branch at either base. Preflight: venv ok, creds ok, ci_rca_unresolved_recs empty (no hard block), non_automatable softcap breached (938) -- a standing planning-context note, not a gate."
