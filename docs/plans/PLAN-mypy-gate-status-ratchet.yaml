execution_steps:
  - >-
    Re-measure ground truth first: `bin/venv-python -m mypy --version` (expect 2.3.0, matching
    requirements.lock), `bin/venv-python -m mypy scripts/ src/ 2>&1 | tail -2`, the current SLOC
    of scripts/validate.py by validate_sloc_limits' counting rule, and the current max
    `## Decision NNN:` header. Use the re-measured values everywhere the plan quotes a number.
  - >-
    pyproject.toml -- add the minimal [tool.mypy] block: `python_version = "3.12"` and
    `disable_error_code = ["import-untyped"]`. Do NOT add ignore_missing_imports. Re-run
    `bin/venv-python -m mypy scripts/ src/` and record the new totals; this is the seeding
    measurement.
  - >-
    scripts/checks/typing/__init__.py and scripts/checks/typing/mypy_baseline.py -- create the
    domain package and the module hosting both checks plus the baseline load/parse/seed
    semantics, following scripts/checks/misc/coverage_baseline.py's shape. Parse the registry
    from RAW TEXT (not yaml.safe_load) so inline markers survive. Include the injectable
    `base_reader` and the SKIP-on-unreachable-base contract. Include the mandatory
    proof-of-execution terminator guard in `_run_mypy()`. Include the `__main__` `--seed` and `--update`
    entry point (downward-only; never raises; never seeds a newly-dirty unregistered file).
  - >-
    config/mypy_baseline.yaml -- seed it AFTER the pyproject block, using
    `bin/venv-python -m scripts.checks.typing.mypy_baseline --seed`. Use `--seed`, NOT
    `--update`: at this moment no roster exists, so all 57 dirty files are unregistered and
    `--update`'s never-seed rule would write an EMPTY roster, after which the ratchet would fail
    all 57 on the implicit-zero rule. Write the header comment: the seeding invocation, the
    `# baseline-raised: dec-NNN
    <reason>` marker grammar, the implicit-zero rule for unregistered files, and that this is a
    one-time grandfather of pre-existing debt, not a precedent.
  - >-
    scripts/checks/registry.py -- insert `_c("validate_mypy_baseline_edits")` into
    `pre_sequence()` beside the existing tamper-guard cluster; in `full_sequence()` replace
    `_s("mypy_full")` with `_c("validate_mypy_ratchet")` and add
    `_c("validate_mypy_baseline_edits")`.
  - >-
    scripts/validate.py -- DELETE `_scaffold_mypy_full` and its `scaffold_fns` entry FIRST (the
    SLOC reclaim), then add the single facade re-export line. Verify the file measures at most
    500 SLOC before moving on. Leave `_scaffold_mypy_diff` untouched.
  - >-
    tests/checks/typing/__init__.py and tests/checks/typing/test_mypy_baseline.py -- write the
    oracle covering parser, mypy-output parser, PROOF-OF-EXECUTION (both required cases: neither
    terminator present fails loudly; "Success: no issues found" is a legitimate clean run and is
    NOT conflated with it), ratchet (equal/over/under/unregistered), tamper
    guard (unmarked raise, marked raise, bogus citation, decrease, removal, unreachable base,
    absent current file), SEED MODE (`--seed` writes the initial roster; refuses when the file
    already exists), and UPDATE MODE (downward-only; never raises; never seeds; writes nothing
    against an absent roster). Confirm each test fails without its production change
    before moving on. Drive the module to 100% line coverage.
  - >-
    tests/test_checks_registry.py -- remove `"mypy_full"` from FROZEN_FULL_SCAFFOLDS and from
    the line-63 explanatory comment; add both new check names to the per-tier membership floors.
    Membership assertions only, never a hardcoded count.
  - >-
    docs/DECISIONS.md -- author `## Decision 161:` (or the next free number, re-checked now).
    THE TITLE MUST CONTAIN THE LITERAL TOKEN "mypy" (case-insensitive) and must be the only live
    title that does -- VP step 8 finds this entry by title and is hermetic, so it replays in
    --pre; a title without the token reds the PR. Verified at planning time: no existing title in
    docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md contains it, so uniqueness holds on authoring.
    Required markers Status/Date/Decision plus Warehouse ID, Problem, Rationale, Reversal
    conditions, Related. Target 2,500-3,000 bytes; route mechanism detail to the module
    docstring and the baseline header. Reversal conditions must name the pre-merge-blocking
    upgrade path and the condition under which the grandfather roster's emptiness retires the
    baseline clauses. Related must include Decisions 60, 132 and 160 alongside
    128/159/130/150/134/145/146. The entry must ALSO carry one sentence authorising
    RE-REGISTRATION of unchanged pre-existing debt after a pure structural move (rename,
    decomposition, facade split) under a `# baseline-raised: dec-161 moved from <old-path>`
    marker. Without it, the next Decision 128 decomposition of a dirty file -- e.g.
    scripts/execute_recommendation.py at 28 errors -- would appear to need its own new Decision
    merely to re-home debt it is not adding to: `--update` drops the stale entry but never seeds
    the new paths, leaving them at implicit-zero and reddening the ratchet. The marker mechanism
    already supports this (`_decision_header_exists` only checks that the cited header exists),
    so this is an authorising sentence, not new machinery.
  - >-
    Run `bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md` (VP step 9). A
    write that cannot complete FAILS LOUDLY -- re-file after restoring connectivity; there is no
    offline outbox.
  - >-
    Execute the Verification Plan -- run each step in order; loop until pass. On an unrecoverable
    failure stop and RCA (Decision 55); do not patch around a red ratchet by widening the
    baseline.
  - >-
    Run `bin/venv-python -m scripts.validate --pre` and then the full tier
    (`bin/venv-python -m scripts.validate`) to completion, per handoff_policy
    (full_validation_required_before_commit). The full tier is where validate_mypy_ratchet
    actually runs -- a green `--pre` alone does NOT exercise it.
  - 'Report: what was implemented, verification results, and the final seeded baseline totals'
work_areas: []
rollback: >-
  Fully revertible in one commit with no external state to unwind: the only out-of-repo write is
  the ops_decisions projection from --backfill-decisions-md, which is an append-only SCD2 ETL
  from docs/DECISIONS.md and re-converges on the next backfill after a revert. Reverting restores
  the informational `_scaffold_mypy_full` scaffold and deletes config/mypy_baseline.yaml,
  scripts/checks/typing/, and tests/checks/typing/. If only the ENFORCEMENT needs backing out
  while the governance stands, drop `_c("validate_mypy_ratchet")` from
  registry.full_sequence() and leave the baseline file and tamper guard in place -- the roster
  then survives as a measured, tamper-guarded record of the debt with no gate, which is a
  strictly better resting state than the pre-plan status quo and requires no Decision reversal.
