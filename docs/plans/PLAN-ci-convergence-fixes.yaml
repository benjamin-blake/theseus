  - >-
    Fable advice-consult (this session): adopted widen + negative pins; rejected renaming roles or
    profiles -- the two unprefixed roles need OPPOSITE treatments, which no naming scheme encodes.
  - >-
    GLUE ADJUDICATION (answers rec-3325's open question). Removing p2-glue-delete-database is
    correct: post-cleanse the repo declares no glue grant, so the row pinned live drift, not repo
    intent, and passed for the wrong reason (live grants database/<db>; the denial was at
    userDefinedFunction/<db>/*). The ARN-coverage lesson lands as the multi_resource_type_verbs map
    plus the shape-check leg, armed for if the grant returns -- not as resurrected rows.
  - >-
    Fixture arithmetic: 599 -55 compaction -5 glue row +10 map +20 PlatformDev +16 PlatformAdmin
    +10 amendment_log = 595, budget lowered to 600. Overrun lever: drop a PlatformAdmin negative row
