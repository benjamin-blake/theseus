    stays open and unbundled -- see infrastructure_dependencies.
  - >-
    rec-3326's own wording keeps the commas, so it does not fix the bug and its grep acceptance
    false-passes. rec-3327's premise is imprecise: UpdateRoleDescription IS granted
    (github_ci_apply_policy.tf:161); the gap is that Sid's Resource. Both verified.
  - >-
    Why widen, not only reconcile: authority_budget.json lists no aws_iam_role in
    in_budget_resource_types, so every role modify already routes to tf-gated-apply -- this changes
    execution capability, not routing. Boundary DataPlaneAllow carries both verbs at Resource ["*"],
