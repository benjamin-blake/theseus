schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ci-convergence-fixes"
intent: >-
  Clear the code-side blockers that red the sandbox apply and the durable convergence record, and
  install the standing guards that would have caught each before merge -- so the governed
  terraform pipeline converges without an agent widening grants inline to unblock itself.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ci-convergence-fixes.yaml
phase: >-
  Platform CI/CD convergence repair. ci_rca soft-warn exception category (rec-3328), so the Tier
  Item Freshness Gate is skipped and no tier_item is claimed. Adjacent to T2.48 (realizes Decision
  144) but does not close any of its criteria.
scope:
  - file: terraform/personal/main.tf
    action: Modify
    purpose: >-
      rec-3326. Reword aws_s3_bucket.data_lake's Purpose tag into the S3 TagValue charset. The
      committed value has parentheses AND commas; both are outside the set.
  - file: scripts/checks/iam_tf/validate_terraform_tag_charset.py
    action: Create
    purpose: >-
      New registered check scanning literal terraform tag values against the S3 TagValue charset.
      The anti-recurrence half of rec-3326 and rec-3328's preventive_action.
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: register the new check (bare string literals, Decision 169 grammar)
  - file: tests/checks/iam_tf/test_validate_terraform_tag_charset.py
    action: Create
    purpose: mirror test -- red on the pre-fix value, green after, plus accounting assertions
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: function_to_category row for the new check (Decision 142; validate_ci_rca_taxonomy)
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: >-
      Replace the em-dash-only Lambda-tag invariant with the actual S3 TagValue charset rule and
      point it at the new check (collocate semantics with enforcement).
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: >-
      rec-3327. Add role/PlatformDev to IAMRoleMetadataWrite's Resource. Never role/PlatformAdmin.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated [Amendment ...] trailer on Decision 144 (NOT a new numbered entry -- see context).
      Establishes the metadata-write scope class "role/agent-platform-* plus enumerated
      boundary-carrying non-prefixed managed roles, today exactly {PlatformDev}; PlatformAdmin
      never", confronts Decision 129's reversal trigger by name, and cites Decision 157.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Create
    purpose: >-
      Standing pin on the new scope class -- PlatformDev present, PlatformAdmin absent from every
      CI-writable Resource pattern. Mirrors test_iam_role_reconcile_trust_scope.py.
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Modify
    purpose: >-
      rec-3325 + rec-3327 proof. Compact the vacuous required_context_keys lines; REMOVE the stale
      p2-glue-delete-database row (see the glue adjudication in context); add the
      multi_resource_type_verbs map, PlatformDev metadata allowed rows, PlatformAdmin by_design
      implicitDeny negative pins, and an amendment_log entry.
  - file: scripts/checks/contracts/validate_iam_simulate_fixture_shape.py
    action: Modify
    purpose: new structural leg failing a mapped multi-resource verb whose row lacks companions
  - file: tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    action: Modify
    purpose: red/green coverage for the new leg
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: lower the fixture budget after compaction (decreases are unrestricted)
bundled_recommendations:
  - rec-3325
  - rec-3326
  - rec-3327
infrastructure_dependencies:
  - >-
    terraform/personal speculative-plan pipeline (CD.35 Wave 2 / T2.21). This PR touches
    terraform/personal/main.tf, so the PR-time plan job runs and the merge triggers
    terraform-apply-sandbox. The convergence record is RED at authoring time, so the apply
    read-precondition REFUSES with CONVERGENCE_RED and applies nothing. That is expected, not a
    failure of this plan. Mechanics: environment-taxonomy.yaml is the sole SoT.
  - >-
    terraform/bootstrap apply -- admin tier, agent_platform_admin, ADMIN container; never
    auto-applied. The IAMRoleMetadataWrite widening lands in HCL with this PR and is applied later
    by an operator. HARD ORDERING: bootstrap HCL already carries PLAN-terraform-state-triggers-
    restore's merged phase-3 narrowing (glue/athena removed), so a bootstrap apply NOW would apply
    that narrowing early -- the Decision 156 point 2 lockout. deploy-paths.yaml's PRE-APPLY
    grant-surface ordering step governs this: let the in-flight destroy drain first.
  - >-
    SIBLING COLLISION -- sequencing required. PLAN-terraform-state-triggers-restore's UNMERGED
    phases 2-3 modify three files this plan also modifies: docs/contracts/iam-simulate-fixture.yaml
    (its phase 2 removes the same glue row this plan removes -- its graduated check
    iam-simulate-fixture-glue-row-absent still passes, but both edits must add an amendment_log
    entry to the same Class D contract, and check_amendment_log_for_class_d compares the canonical
    dict minus amendment_log, so both are mandatory), terraform/personal/main.tf, and
    docs/DECISIONS.md. Whichever merges second rebases and reconciles; do not assume a clean merge.
  - >-
    UNOWNED GAP -- the in-flight destroy cannot drain as things stand. The live apply role grants
    glue:DeleteDatabase at database/<db> ONLY; run 33323201848 was denied at
    userDefinedFunction/agent_platform/*. terraform/ contains no glue HCL at all (cleanse 7b67e21d),
    and PLAN-terraform-state-triggers-restore's scope does NOT include
    terraform/bootstrap/github_ci_apply_policy.tf, so nothing in the repo owns restoring and
    widening that grant. rec-3328 (Critical, ci_rca) remains open and is deliberately NOT bundled
    here -- its acceptance needs a glue grant this plan does not add. File a follow-on rec for the
    glue restore-and-widen before relying on VP step 12.
  - >-
    One-time operator reconcile (agent_platform_admin, out-of-band, NOT this plan's code):
    aws iam update-role-description --role-name PlatformDev matching the platform_roles.tf value.
    This clears the CURRENT diff without waiting on the bootstrap apply, so the in-flight destroy
    is not blocked by the description leg. The widening is the durable fix for the NEXT one; the
    reconcile and the widening are complements, not alternatives.
acceptance_criteria:
  - >-
    aws_s3_bucket.data_lake's Purpose tag value matches ^[A-Za-z0-9 +\-=._:/@]*$ (the S3 TagValue
    charset) -- no parentheses, no commas.
  - >-
    validate_terraform_tag_charset is registered, runs in --pre, fails on a tag value outside the
    charset, passes on the fixed tree, and declares examined()/skipped() on every exit path.
  - >-
    IAMRoleMetadataWrite's Resource is exactly {role/agent-platform-*, role/PlatformDev}. This makes
    FOUR verbs reachable on PlatformDev -- iam:TagRole, iam:UntagRole, iam:UpdateRole,
    iam:UpdateRoleDescription -- not only the one rec-3327 names. No CI-writable Resource pattern in
    github_ci_apply_policy.tf matches PlatformAdmin.
  - >-
    Decision 144 carries a dated [Amendment ...] trailer stating the scope class, naming
    PlatformAdmin's permanent exclusion and why (no boundary; it controls the boundary), confronting
    Decision 129's non-agent-platform-* reversal trigger by name, and citing Decision 157 as the
    metadata-vs-value-capability precedent. Decision 144's original body is byte-intact.
  - >-
    The fixture no longer carries p2-glue-delete-database; it carries a multi_resource_type_verbs
    map, four PlatformDev metadata rows (expected_decision allowed), two PlatformAdmin by_design
    rows (expected_decision implicitDeny), an amendment_log entry, and passes
    validate_iam_simulate_fixture_shape including the new multi-resource leg. Every pre-change
    triple id except p2-glue-delete-database survives the compaction.
  - >-
    docs/contracts/iam-simulate-fixture.yaml measures 595 effective lines against a budget LOWERED
    to 600, with no raise marker added.
  - rec-3325, rec-3326 and rec-3327 are status closed after the merge.
  - bin/venv-python -m scripts.validate --pre exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the new check discriminates -- red on the pre-fix tag value, green on the fixed one.
      Not a "does the function exist" probe: it feeds both values through the real check.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_validate_terraform_tag_charset.py -q
    expected: all tests pass, including the red-path case asserting a non-empty failure list
    fix_if: >-
      check passes on the parenthesised value (charset regex too permissive) or fails on the fixed
      value (too strict -- the set is letters, digits, whitespace and + - = . _ : / @)
    graduation: graduate
    graduation_check_id: terraform-tag-values-s3-charset-clean
  - step: 2
    phase: pre-deploy
    action: >-
      Assert the live tree's tag value is genuinely S3-legal, independent of the check under test
      (a bug in the check cannot mask a bad value).
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('terraform/personal/main.tf').read_text();
      m=re.search(r'Purpose\s*=\s*\"([^\"]*)\"', t); assert m, 'no Purpose tag found';
      v=m.group(1); assert re.match(r'^[A-Za-z0-9 +\-=._:/@]*$', v), f'S3-invalid TagValue: {v!r}';
      print('ok:', v)"
    expected: prints the reworded value; no parentheses or commas
    fix_if: >-
      still contains ( ) or , -- note rec-3326's own suggested wording keeps the commas and does
      NOT fix the bug
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates step 1's graduated registry check on the same invariant; graduating both would
      register two slots asserting one fact. Kept as a VP step because it is the independent
      cross-check that does not route through the code under test.
  - step: 3
    phase: pre-deploy
    action: >-
      Assert the check is registered, reachable in the --pre tier, and carries a taxonomy row.
    command: >-
      bin/venv-python -c "from scripts.checks import registry;
      e={x.name for x in registry.all_entries()}; assert 'validate_terraform_tag_charset' in e, e;
      import yaml; t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'));
      assert 'validate_terraform_tag_charset' in t['function_to_category']; print('registered')"
    expected: prints registered
    fix_if: manifest Entry missing/misspelled, or the taxonomy row absent (validate_ci_rca_taxonomy reds)
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, but the standing checks validate_check_manifests and
      validate_ci_rca_taxonomy already enforce both halves on every run; a graduated slot would
      duplicate them and could only fail when they already had.
  - step: 4
    phase: pre-deploy
    action: >-
      Pin the rec-3327 scope class from both directions -- PlatformDev reachable, PlatformAdmin
      unreachable by ANY CI-writable Resource pattern in the policy.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: all tests pass
    fix_if: >-
      PlatformDev absent from IAMRoleMetadataWrite, or PlatformAdmin matched by any write Sid --
      the latter is a grant leak, not a test bug
    graduation: graduate
    graduation_check_id: platform-admin-absent-from-ci-write-patterns
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the fixture's multi-resource leg discriminates on a synthetic fixture, and that the
      real fixture passes the full shape check.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py -q
    expected: all tests pass, including a red case where a mapped verb has no companion rows
    fix_if: >-
      the red case passes (leg not wired) or the real fixture fails (a mapped verb still has an
      uncompanioned row, or a target ARN carries a wildcard -- build_triples rejects those)
    graduation: graduate
    graduation_check_id: iam-simulate-fixture-multi-resource-companions
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the compaction dropped only the defaulted field -- every pre-change triple id must
      survive, and the count must land exactly where the plan's arithmetic says.
    command: >-
      bin/venv-python -c "import subprocess,yaml; from pathlib import Path;
      from scripts.ci.iam_simulate import load_fixture, build_triples;
      old=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/iam-simulate-fixture.yaml'],
      capture_output=True,text=True,check=True).stdout);
      o={r['id'] for r in old['triples']};
      n={t.id for t in build_triples(load_fixture(Path('docs/contracts/iam-simulate-fixture.yaml')),
      'account-id-placeholder','region-placeholder')};
      dropped=o-n; assert dropped=={'p2-glue-delete-database'}, f'unexpected drops: {sorted(dropped)}';
      print('pre',len(o),'post',len(n),'dropped',sorted(dropped))"
    expected: >-
      pre 61, post 66, dropped exactly ['p2-glue-delete-database'] -- the one deliberate removal
    fix_if: >-
      any other id in the dropped set means compaction deleted a row, not just the defaulted
      required_context_keys field; restore it
    graduation: waive
    graduation_waiver_reason: >-
      Guards this session's specific compaction edit by diffing against origin/main. Once merged
      the origin/main baseline becomes the post-change file and the assertion is self-satisfying,
      so it cannot serve as a standing regression guard.
  - step: 7
    phase: pre-deploy
    action: >-
      Assert the fixture is within its structural budget with no raise marker added.
    command: >-
      bin/venv-python -c "import yaml,pathlib; from scripts.checks.structural._classify import
      effective_lines; b=yaml.safe_load(open('config/structural_size_budgets.yaml'));
      n=effective_lines(pathlib.Path('docs/contracts/iam-simulate-fixture.yaml').read_text());
      lim=b['docs/contracts/iam-simulate-fixture.yaml'];
      assert n<=lim, f'{n} effective lines exceeds budget {lim}'; print(n,'<=',lim)"
    expected: 595 effective lines against a lowered budget of 600
    fix_if: >-
      over budget -- compact further or drop a PlatformAdmin negative row (the pin test in step 4
      already covers all four verbs statically); never add a raise marker to fit (Decision 128)
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as metric_under_threshold, but validate_structural_size_limits is the
      standing enforcer of exactly this budget on every run; a graduated slot would be a second
      copy of a check that already gates the tier.
  - step: 8
    phase: pre-deploy
    action: >-
      Assert the Decision 144 amendment trailer exists, is dated, names the PlatformAdmin
      exclusion, and confronts Decision 129's reversal trigger.
    command: >-
      bin/venv-python -c "import re,pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text();
      b=t.split('## Decision 144:')[1].split('\n## Decision ')[0];
      m=re.search(r'^\[Amendment (\d{4}-\d{2}-\d{2}):', b, re.M); assert m, 'no dated amendment trailer';
      assert 'PlatformAdmin' in b, 'trailer does not name the PlatformAdmin exclusion';
      assert '129' in b, 'trailer does not confront the Decision 129 reversal trigger';
      assert 'broad-but-bounded' in b, 'clause 1 wording was spliced'; print('trailer', m.group(1))"
    expected: prints the amendment date
    fix_if: >-
      trailer missing, undated, or Decision 144's original body was edited rather than appended to
      (the append-only correction dialect, Decision 177)
    graduation: graduate
    graduation_check_id: dec-144-platformdev-amendment-trailer-present
  - step: 9
    phase: pre-deploy
    action: Full fast-tier gate over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      address the named check; never add a budget raise or a skip to get green (Decision 55)
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Closure obligation -- confirm the three bundled recs actually closed via the Resolves trailer
      and rec-autoclose.yml, rather than assuming the trailer fired.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json;
      rows={json.loads(l)['id']: json.loads(l).get('status') for l in
      open('logs/.recommendations-log.jsonl') if l.strip()};
      bad={r: rows.get(r) for r in ('rec-3325','rec-3326','rec-3327') if rows.get(r)!='closed'};
      assert not bad, f'still open: {bad}'; print('all three closed')"
    expected: prints all three closed
    fix_if: >-
      any still open -- the Resolves trailer was malformed or rec-autoclose.yml did not fire; close
      via bin/venv-python -m scripts.ops_data_portal --update-rec rec-NNNN --status closed
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Confirm the merge did NOT apply -- the red convergence record must refuse with
      CONVERGENCE_RED. A silent apply here would mean the anti-masking anchor is not holding.
    command: >-
      bin/venv-python -c "import json,subprocess,os; sha=subprocess.run(['git','rev-parse','HEAD'],
      capture_output=True,text=True,check=True).stdout.strip();
      r=json.loads(subprocess.run(['curl','-sS','-H','Authorization: Bearer '+
      open(os.path.expanduser('~/.config/gh-mcp/token')).read().strip(),
      f'https://api.github.com/repos/benjamin-blake/theseus/actions/runs?head_sha={sha}'],
      capture_output=True,text=True,check=True).stdout);
      runs=[x for x in r.get('workflow_runs',[]) if 'apply-sandbox' in x['name']];
      assert runs, 'no terraform-apply-sandbox run for this sha'; print(runs[0]['conclusion'],
      runs[0]['html_url'])"
    expected: >-
      a run exists for the merge sha; its log carries the ::error::CONVERGENCE_RED refusal marker
      (terraform-apply-sandbox.yml:194) and no applied plan
    fix_if: >-
      an apply ran while the record was red -- stop and RCA the read-precondition (Decision 55); do
      not retry
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      OPERATOR, after the glue-grant gap is resolved, the in-flight destroy drains and the bootstrap
      apply lands: run the standing live-simulate gate. This is the only step that proves the
      widening took effect through the identity/boundary intersection, and that PlatformAdmin did
      not leak. NOT reachable at merge time -- see the glue adjudication in context.
    command: >-
      bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture
      docs/contracts/iam-simulate-fixture.yaml
    expected: exit 0, zero mismatches
    fix_if: >-
      a mismatch on a PlatformDev metadata verb means a wrong resource scope or ceiling -- fix in
      HCL and re-apply through the same human gate. A mismatch on a PlatformAdmin by_design row is
      a GRANT LEAK: treat as a security regression, not a fixture error. A glue mismatch should be
      impossible -- this plan removes the glue row; if one appears, the fixture was edited by the
      sibling plan concurrently and the two edits must be reconciled before re-running.
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/iam_tf/validate_terraform_tag_charset.py
    behavior: >-
      flags literal terraform tag values outside the S3 TagValue charset, and declares
      examined()/skipped() on every reachable exit path
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_terraform_tag_charset.py
    red_green_expectation: >-
      red before (the parenthesised value in main.tf produces a non-empty failure list), green
      after the reword
  - source: scripts/checks/contracts/validate_iam_simulate_fixture_shape.py
    behavior: >-
      fails a fixture whose declared multi-resource-type verb has a row without sibling companion
      rows covering the other resource types
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    red_green_expectation: >-
      red before on a synthetic single-ARN glue row, green once companions are present
  - source: terraform/bootstrap/github_ci_apply_policy.tf
    behavior: >-
      IAMRoleMetadataWrite reaches role/PlatformDev; no CI-writable Resource pattern reaches
      PlatformAdmin
    verification_step: 4
    test_selector: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    red_green_expectation: >-
      red before (PlatformDev absent from the Resource list), green after; the PlatformAdmin leg is
      red if any write Sid is ever widened to match it
  - source: terraform/personal/main.tf
    behavior: the data_lake Purpose tag value stays inside the S3 TagValue charset
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_terraform_tag_charset.py
    red_green_expectation: red before, green after
  - source: scripts/checks/iam_tf/_manifest.py
    behavior: the new check is discoverable through the registry and runs in the --pre tier
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_terraform_tag_charset.py
    red_green_expectation: >-
      red before the Entry is added (the mirror test's registration case fails), green after
  - source: docs/contracts/iam-simulate-fixture.yaml
    behavior: >-
      loads through iam_simulate's pure layer with no wildcard targets, and carries companion rows
      for every declared multi-resource verb
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_iam_simulate_fixture_shape.py
    red_green_expectation: >-
      red before on a SYNTHETIC fixture whose mapped verb has no companion rows; green on the real
      fixture, whose only mapped verb (glue:DeleteDatabase) has no row at all after the removal
constraints:
  - No rescue agents or workaround loops (Decision 55). A failed apply latches red and routes to reconcile.yml.
  - >-
    NEVER add role/PlatformAdmin to any write Sid, and never rename it into the agent-platform-*
    prefix. IAMRoleDeleteBounded and IAMRoleMetadataWrite carry NO boundary Condition, so a
    prefixed PlatformAdmin becomes CI-deletable and CI-mutable. Verified this session.
  - >-
    Do NOT widen IAMRoleReconcile (trust) or IAMRoleWriteBounded (inline policy) to PlatformDev.
    Decision 143 clause 1 keeps worst-verbs narrow; PlatformDev's DEP-13 Denies live in DailyOps.
    This plan widens the metadata risk class only.
  - >-
    Do not apply terraform/bootstrap until the in-flight terraform/personal destroy has drained --
    deploy-paths.yaml's PRE-APPLY grant-surface ordering step (Decision 156 point 2 lockout). Note
    that drain is currently blocked by the unowned glue gap above.
  - >-
    ROUTINE FLOW ONLY: never author a local terraform init/validate/plan for terraform/personal
    (Decision 119). terraform fmt -check is provider-free and permitted.
  - >-
    Scope discipline: the destroy of the 14 retired addresses belongs to
    PLAN-terraform-state-triggers-restore (phase 1 merged as PR #975; phases 2-3 unmerged). Do not
    re-plan or execute it here. The glue GRANT is owned by nobody -- record it as a follow-on rec,
    do not silently adopt it.
  - >-
    The IAM authority standard, role registry, AGENTS.md ambient rule and per-instance write
    coverage are Plan B (a separate follow-on plan). Do not pull them in.
  - >-
    Never commit account_id, ExternalIds or real ARNs. Fixture targets stay ${account_id}/${region}
    placeholders (Decision 101).
  - >-
    Do not raise any structural or SLOC budget to fit -- compact, or drop an optional addition
    (Decision 128 decompose-by-default; Decision 166 reversal condition (d) treats net roster growth
    as a gate re-audit trigger, not a raise licence). Do NOT cite Decision 166 point 6: it governs
    the verification registry file and was superseded by Decision 176.
context:
