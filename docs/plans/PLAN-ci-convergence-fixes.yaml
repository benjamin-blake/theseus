rollback: >-
  Every code change is revertible by reverting the PR; nothing here applies infrastructure. The
  IAMRoleMetadataWrite widening lands in HCL only and has no live effect until an operator applies
  the bootstrap root, so a revert before that apply is a no-op against AWS. If the widening is
  applied and later judged wrong, remove the role/PlatformDev ARN and re-apply through the same
  human gate, then re-run the live-simulate gate to confirm the narrower scope took effect.
