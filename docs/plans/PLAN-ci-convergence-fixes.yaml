    Decision-scout verdict: FLAGS_FOUND (131 of 131 triaged). CITE: 178, 144, 143, 156, 157, 129,
    126, 113, 169, 170, 142, 168, 119, 120, 131, 101, 55, 72, 128, 176, 86, 150, 167, 92, 77.
  - "gates: decision-scout=FLAGS_FOUND after 1 round; plan-critique=<verdict> after <N> round(s)"
