pre_implementation_checklist:
  - Branch confirmed not on main; the plan's PR merged before the build
  - docs/contracts/github-org-transfer.yaml, docs/contracts/account-credential-inventory.yaml and docs/contracts/git-ops.yaml read
  - /mnt/project-files/transfer-runbook/ read (step6b-presentation.md, scout-report.md, draft/)
  - Decisions 218, 172, 94, 101, 166, 126, 183 and 83 read (only those sections)
  - The operator's availability for the window (about 90 minutes) agreed before VP 15
execution_steps:
  - VP 1, then the pre-window console steps VP 2-5 in any order the operator prefers (VP 3 after VP 2), and VP 6.
  - >-
    PR A: apply the pinned generator to the contract, set the date, add P1, flip identity.phase to pre_staged and
    drop staged_phase, set implementation_declared true; run VP 7-13, open it (VP 14); append E1 and E2 when VP 2-6
    are done and re-run VP 7-13; code review to PROCEED.
  - "Window, in order and frozen throughout: VP 15 (go/no-go merge), 16, 17, then the fresh thread runs 18-26."
  - "Prove: VP 27-31 in any order on the operator's words, then PR C (VP 32), VP 33 and the close-out VP 34."
  - Keep RESUME.md and state.env current at every step (operator rule, 2026-10-21); a thread that stops mid-window leaves the next step named.
  - 'Report: PRs, run URLs, each operator word by message id, every VP result, and anything left for rec-4355, rec-4538, rec-4551 or rec-4549.'
rollback: >-
  Before the go/no-go everything is undoable: revert PR A's text, restore the old setup-script line, delete the
  rehearsal repository. After the transfer, rollback is forward-fix on the new identity, never a transfer back (the
  old path is retired): stay frozen and fix the failing checklist item; an OIDC failure is recovered by the admin
  break-glass apply (contract rollback.per_phase.transfer, Decision 172 recovery). Every predecessor binding stays
  live until proven, so a straddling job fails safe.
