      dependency lands mid-proof; VP 34 re-arms it.
    command: >-
      set -a && . /mnt/project-files/transfer-runbook/state.env && set +a && for r in "$RUN_CLAUDE" "$RUN_DEPENDABOT";
      do curl -sSf "https://api.github.com/repos/otl-labs/ontheloop/actions/runs/$r" | bin/venv-python -c "import
      json,sys; r=json.load(sys.stdin); assert r['conclusion']=='success', r['conclusion']" || exit 1; done && echo
      CLAUDE_AND_DEPENDABOT_PROVEN
    expected: CLAUDE_AND_DEPENDABOT_PROVEN printed; a reply from claude.yml on PR B.
    fix_if: >-
      A skipped auto-merge job means the repository gate rejected the name (dependabot_repository_guard): RCA before
      PR C. No @claude reply: check the Claude GitHub App installation on otl-labs (breakage_map.claude_github_app).
    hermetic: false
    graduation: not-applicable
  - step: 31
    phase: post-deploy
    action: >-
      PROVE, roles: every CI role was last used after TRANSFER_TS (runs drained at the freeze, so any later assume
      carries the target segment). IAM last-used data lags: re-read every 15 minutes for up to 4 hours. Prints role
      names and yes/no only. Run it in an ADMIN-environment session (the agent_platform_admin profile exists only
      there); stderr is discarded so an AccessDenied never prints the caller's ARN.
    command: >-
      set -a && . /mnt/project-files/transfer-runbook/state.env && set +a && rc=0; for r in planner pr apply deploy
      branch; do out=$(aws iam get-role --role-name "agent-platform-github-ci-$r" --profile agent_platform_admin
      --query 'Role.RoleLastUsed.LastUsedDate' --output text 2>/dev/null) || out=GET_ROLE_FAILED; printf '%s' "$out" |
      bin/venv-python -c "import sys,os,datetime as d; raw=sys.stdin.read().strip(); ok=raw not in
      ('','None','GET_ROLE_FAILED') and d.datetime.fromisoformat(raw)>d.datetime.fromisoformat(os.environ['TRANSFER_TS']);
      print(sys.argv[1], 'GET_ROLE_FAILED' if raw=='GET_ROLE_FAILED' else 'AFTER_TRANSFER', 'yes' if ok else 'no');
      sys.exit(0 if ok else 1)" "$r" || rc=1; done; exit $rc
    expected: AFTER_TRANSFER yes for all five roles.
    fix_if: >-
      A role still "no" after 4 hours while its job succeeded is recorded as a reporting lag, with the job URL as the
      proof; a failed assume step is a regression: RCA.
    hermetic: false
    graduation: not-applicable
  - step: 32
    phase: post-deploy
    action: >-
      PR C: append E4 (checklist 8 and the live proofs) and flip GH-01, GH-05, GH-06, GH-10 and REG-02 to proven
      (owner_today company) with one inventory ledger entry each; run VP 7, 9, 11, 12, 13 and this step; rec-4550's stored
      oracle (verbatim, read 2026-10-22) must hold. Open, code review, then, on PROCEED, green CI and the operator's
      word "merge PR C", squash-merge with the trailer "Resolves: rec-4550"; that trailer's closure job is the live
      ops-portal write on the new path.
      Record PR_C and PR_C_SHA.
    command: |-
      grep -qE '^  phase: (transferred|proven|predecessor_removed)$' docs/contracts/github-org-transfer.yaml && grep -qE 'phase: prove, gate:' docs/contracts/github-org-transfer.yaml && bin/venv-python - <<'PY'
      import yaml
      inv = yaml.safe_load(open('docs/contracts/account-credential-inventory.yaml', encoding='utf-8'))
      rows = {r['id']: r for r in inv['rows']}
      ids = ('GH-01', 'GH-05', 'GH-06', 'GH-10', 'REG-02')
      bad = {k: (rows[k]['status'], rows[k]['owner_today']) for k in ids if (rows[k]['status'], rows[k]['owner_today']) != ('proven', 'company')}
      assert not bad, bad
      latest = {}
      for e in inv['evidence_ledger']:
          latest[e['row']] = e['status']
      assert all(latest.get(k) == 'proven' for k in ids), {k: latest.get(k) for k in ids}
      print('INVENTORY_FLIPS_OK')
      PY
    expected: INVENTORY_FLIPS_OK printed (the rec-4550 oracle passed first).
    fix_if: Fix the row or entry named; never edit the oracle.
    hermetic: false
    graduation: not-applicable
  - step: 33
    phase: post-deploy
    action: >-
      Closure: rec-4356 and rec-4550 are closed (by the PR A and PR C trailers), read through the reader.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
      fetch_recs_by_ids(make_reader(), ['rec-4356', 'rec-4550']); assert not missing, missing; bad=[r['id'] for r in
      rows if r['status']!='closed']; assert not bad, bad; print('RECS_CLOSED')"
    expected: RECS_CLOSED printed.
    fix_if: >-
      Read the trailer-closure job's marker for the merge SHA (git-ops.yaml resolves_trailer, Decision 201); if the
      oracle failed at merge, fix forward and close through the portal citing the evidence.
    hermetic: false
    graduation: not-applicable
  - step: 34
    phase: post-deploy
    action: >-
      Close-out: write EVIDENCE.md's "## Summary" and its public version EVIDENCE-public.md (no message ids); the
      command scans both (URLs stripped, VP 11's shapes) without printing a match. Post EVIDENCE-public.md byte for
      byte, plus the attribution footer, as a comment on PR C. If VP 30 recorded AUTO_MERGE_DISARMED, re-arm
      auto-merge on that PR with the GitHub MCP tools on the operator's word and record "AUTO_MERGE_REARMED". Tell the
      coordinator, in one message: the live proofs are recorded, so the project freeze lifts and the AWS account path
      may start (operator, 2026-10-22, Fork 2 A); rec-4355 is next and flips the contract to proven; rec-4551 starts
      only after proven plus one weekly scheduled cycle; after proven the operator drops /home/user/theseus from both
      setup scripts; the disabled daily telemetry task's prompt names the old transcript path and needs editing
      before it is re-enabled; the AWS SigV4 network-secret probe for the static key waits for the Anthropic cutover.
      Then delete state.env.
    command: |-
      bin/venv-python - <<'PY'
      import pathlib, re
      F = pathlib.Path('/mnt/project-files/transfer-runbook')
      shape = re.compile(r'\b[0-9]{7,}\b|arn:aws:|github_pat_|gh[pousr]_[A-Za-z0-9]{30,}|BEGIN [A-Z ]*PRIVATE KEY|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[a-z]{2,}')
      ev = (F / 'EVIDENCE.md').read_text(encoding='utf-8')
      pub = (F / 'EVIDENCE-public.md').read_text(encoding='utf-8')
      assert '## Summary' in ev, 'no summary in EVIDENCE.md'
      assert 'cmsg_' not in pub, 'message ids in the public text'
      texts = (('EVIDENCE.md', ev), ('EVIDENCE-public.md', pub))
      hits = {n: sum(1 for ln in t.splitlines() if shape.search(re.sub(r'https://\S+', '', ln))) for n, t in texts}
      assert not any(hits.values()), hits
      assert 'AUTO_MERGE_DISARMED' not in ev or 'AUTO_MERGE_REARMED' in ev, 'auto-merge left disarmed'
      assert not (F / 'state.env').exists(), 'state.env not deleted'
      print('CLOSED_OUT')
      PY
    expected: CLOSED_OUT printed, the PR C comment posted from EVIDENCE-public.md and the coordinator told.
    fix_if: >-
      A scan hit: the counts name the file; find the line with grep -c per pattern (never print the match) and remove
      it; a credential is revoked first and the operator told.
    hermetic: false
    graduation: not-applicable
