constraints:
  - >-
    Every console step, dispatch and merge waits for the operator's own typed word in the thread that runs it,
    fetched by message id before acting; one word per admin-tier action (the transfer, setup-script edits, secret
    paste, Codespaces delete, workflow disable and enable). A dispatch word may name several CI dispatches explicitly,
    except the deploy (VP 28), which gets its own.
  - >-
    Never print or store a numeric id, ARN, account id, token, key or e-mail address: the rehearsal and snapshot tools
    print flags and names only; GitHub numeric ids live only in the two trust lists (Decision 101). Never read a
    setup script back through an environment tool (rec-4510).
  - >-
    No predecessor removal and no trust edit: both OIDC segments, the old PyPI publisher, the old GHAS and MCP
    tokens, the classic admin PAT, the personal App installations and the old clone path stay (rec-4551, rec-4538,
    rec-3903). No agent-run terraform apply (Decision 126); CI plans and applies.
  - >-
    Window rules (contract phases.transfer): from the go/no-go merge until VP 26 no other merge to main and no
    dispatch except the checklist's; a failing checklist step keeps the freeze and is forward-fixed; rollback is
    forward-fix on the new identity, never a transfer back. Touch neither claude.ai account's GitHub connection in
    the window.
  - >-
    Approved wording lands verbatim (VP 7); the P1 and P2 amendment lines are as in context; any other contract text
    change goes to the coordinator, then the operator. The contract stays at or under 500 effective lines (Decision
    166); after PR C about 9 lines of headroom remain for the later transfer plans, whose relief valve is compacting
    amendment_log entries (one line each, parsed-identical).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test to get green.
