    stronger mechanism-probing oracles (VP 7, 8) under the separate-call + monotonicity discipline
    (VP 11). rec-3726 satisfied as filed. rec-2672 is SUPERSEDE not fix (oracle names "registry.py
    imports", retired by dec-169); no code here targets it.
  - >-
    rec-3738 DEFERRAL -- Related-Work Check fails all three conditions (different file, Decision,
    failure category); 0 prior deferrals; deferred at operator direction, another agent
    investigating. Consequence handled: it reddens rec-autoclose for any trailer-named rec lacking
