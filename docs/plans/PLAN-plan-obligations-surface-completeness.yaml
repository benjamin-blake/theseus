  - >-
    scripts/checks/roadmap/_manifest.py:128 already lists the contract in pre_globs -- no manifest
    edit needed. Class D bodies escape extra="forbid" (only the `contract:` envelope is validated),
    so an unrecognised enforced_elsewhere key is silently dropped today; the grammar validator
    closes that. dec-168 -- ONE new amendment_log entry must cover every body edit. Full
    derivation from the check fleet is OUT of scope (nothing declares "I obligate X on new-check
    plans") -- that inversion is T2.54, effort L. Branch 1 commit behind origin/main at planning
    time; sole diverging file PLAN-skills-layer-prose-relocation.yaml, no Scope overlap.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    scripts/checks/registry.py module docstring read (the authoritative seven-surface enumeration
    this contract must stop restating)
execution_steps:
  - >-
    scripts/roadmap/plan_obligations.py -- add validate_obligation_grammar(contract_path) ->
    list[str], never raising, applying G1 (a requires entry MUST carry path_template; an
    enforced_elsewhere entry MUST NOT), G2 (enforced_by in registry.all_checks()), G3 (enforced_by
    in the names of registry.pre_sequence() + full_sequence()), G4 (why_not_a_scope_row present
    and non-empty). Keep the module's exception-contained contract -- a malformed contract yields
    findings, never an exception. Call registry.all_checks()/pre_sequence()/full_sequence() at
    CHECK-BODY time only, never at plan_obligations module-import time: every check module does
    `from scripts.checks import registry`, so an import-time call is a genuine circular import
    (registry.py docstring).
  - >-
