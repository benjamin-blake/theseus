schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: handoff-evidence-gate
intent: >-
  Enforce the commit-first handoff (slice 2a, PLAN-handoff-validates-committed-tree) mechanically at the agent's push/PR
  boundary: one fail-closed PreToolUse harness hook refuses any non-exempt agent push or GitHub remote write unless the
  schema-4 validation evidence proves that exact committed tree was validated from that worktree. It is an IDENTITY gate
  (was the pushed tree validated?), not a verdict gate: a validated-but-red tree passes with a warning, so there is nothing
  to wedge and no release valve.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-handoff-evidence-gate.yaml
phase: >-
  Soft-warn exception category ci_rca (hardening follow-on from the rec-4057/rec-4066 root cause); names NO tier_item, so
  the Tier Item Freshness Gate is skipped. T2.54 (clause-to-check traceability) is cited, not claimed. Slice 2b of 2;
  DEPENDS ON slice 2a being merged (it imports scripts.checks.validation_result's evidence_path_for, load_record,
  attests_head and ATTEST_RULES, and extends 2a's handoff_sequence.enforcement_coverage list in place).
scope:
  - file: scripts/session/handoff_push_parse.py
    action: Create
    purpose: >-
      Pure Bash-command classification and canonical-form parsing, moved OUT of the hook so it inherits the 100% per-file
      coverage floor (critique F7: map_source_to_test returns None for .claude/hooks/*.py, so logic left there is
      ungoverned). No git, no I/O. Target < 250 SLOC. Its module docstring carries the enumerated residual surfaces the
      git-ops row cites (subprocess and wrapper-interpreter pushes, heredocs fed to a non-shell interpreter, nested shells
      beyond one level, persistent git aliases/config, the accepted `echo git push` false positive).
      (1) PRE-PASS: strip heredoc bodies (`<<`, `<<-`, `<<~` with a bare or quoted delimiter, through the delimiter line)
      -- they are data -- EXCEPT when the command receiving the heredoc is a shell (bash, sh, zsh, dash), whose body is
      classified as commands; also recurse into a shell's here-string (`<<<`). A heredoc operator is recognised ONLY in
      command context: never inside single- or double-quoted literal text (`grep -n "<<EOF" f` starts no heredoc, so a
      following `git push` line stays visible), but inside `$(...)` and backticks at any nesting, including within
      double quotes (critique round 2 N2).
      (2) TOKENISE with shlex.shlex(text, posix=True, punctuation_chars='();<>|&\n'), whitespace ' \t\r' and
      commenters '' (EMPTY -- shlex's default '#' reads a comment with readline() and swallows the newline, so `git
      status # check\ngit push ...` would merge into one git-status command and fail open; critique round 2 N1), so
      NEWLINE, ;, &&, ||, |, &, ( ), { } all separate simple commands and quoted newlines stay inside their token. `#`
      tokens are kept as ordinary words: a trailing comment on a push makes it non-canonical (denied with the own-tool-call
      message). A tokenise failure on text containing the words git and push -> PUSH-SHAPED (fail closed).
      (3) PUSH-SHAPED (co-occurrence, critique F1): a simple command is push-shaped when it contains a token whose
      basename is `git` followed later by a token `push`, OR its git subcommand is send-pack or http-push, OR it is
      `git subtree|lfs ... push`, OR a git command carries `-c`/`--config-env` and its text contains "push" (aliases). The
      ONE exception: the first word (after NAME=value assignments) is `git` and its parsed subcommand is something else
      (git log --grep push, git commit -m "push fix"). Subcommand parsing knows the arg-taking globals (-C, -c,
      --git-dir, --work-tree, --namespace, --config-env, --exec-path, --super-prefix, `=` forms) and the no-arg globals
      (--no-pager, -P, --paginate, --bare, --literal-pathspecs, --glob-pathspecs, --noglob-pathspecs,
      --icase-pathspecs, --no-replace-objects, --no-optional-locks, --no-lazy-fetch, --no-advice); any other `-` token
      before the subcommand makes a git command with a later push token push-shaped. A shell token (basename bash, sh,
      zsh or dash) with an option cluster containing `c` AT ANY POSITION in the simple command (so `timeout 60 bash -c
      '...'` and `env sh -c '...'` recurse too) has its string argument classified recursively; `eval`'s joined arguments
      are classified as a command string (critique round 2 N3). COMMAND SUBSTITUTION: the paren-matched body of every
      `$(...)` and backtick span -- found at any nesting, including inside double quotes -- is heredoc-stripped and
      classified RECURSIVELY with these same token rules; a push-shaped body makes the whole command push-shaped, before
      the git exception applies (token-based, never raw text: `git commit -m "$(printf 'explain git push')"` is NOT
      push-shaped because the body's first word is printf). `grep "git push" f` (one quoted token) is NOT push-shaped;
      `echo git push` IS (accepted false positive, named in the deny message).
      (4) CANONICAL FORMS (an allowlist; the whole command must match, optionally prefixed by one `cd <path> &&`):
      git [-C <path>] push {OPTS} <remote> <src>[:<dst>]; bare git [-C <path>] push {OPTS}; git [-C <path>] push
      <remote> (--delete <branch> | :<branch>); where {OPTS} is an ORDER-INSENSITIVE set drawn from -u,
      --set-upstream, --force-with-lease[=<v>], --dry-run, -n (critique F4b: plan.md uses `--force-with-lease -u`). Exactly
      one refspec; src is HEAD or a bare branch name (resolved against the worktree by the checker); no `+` force prefix;
      no env assignment, -c, other global option, second segment, pipe or redirection. Returns a ParsedPush(kind in
      {push, bare_push, delete, dry_run}, worktree_hint (-C resolved relative to the cd path, M4), remote, src, dst) or
      a NonCanonical(reason). Every instruction-surface literal is a canonical test case: plan.md L100 and L126,
      audit.md L134, implement SKILL.md's Commit Flow push, audit-prompt SKILL.md L217, git-ops
      push_pr_ci_merge_flow.steps[0], plus plan.md's "plain `git push`" (L114).
  - file: scripts/session/handoff_evidence.py
    action: Create
    purpose: >-
      The checker: git/evidence decisions returning Verdict(kind in {pass, warn, deny}, rule, message) plus a CLI. Every
      git probe runs with cwd = the resolved worktree; toplevel is `git rev-parse --show-toplevel` run THERE, compared
      after os.path.realpath on both sides (critique F9). Base-ref reads come from `git show
      origin/main:docs/contracts/git-ops.yaml`: exempt_path_globs, never_exempt_paths and
      branching_topology.agent_branch_prefixes (Decision 187: a push that widens them must not exempt itself).
      decide_bash(parsed, payload_cwd): kind dry_run -> pass; kind delete -> pass only for ONE branch matching
      agent_branch_prefixes and never main/master (it pushes no tree; PLAN-stale-prs-branches-cleanup's sanctioned
      deletions; any other delete is human-only, declared in the coverage row); kind bare_push -> admitted only when
      `git config push.default` is unset, simple, current or upstream, `remote.<r>.push` and `remote.<r>.mirror` are
      both unset for the resolved remote (either makes a bare push multi-ref or mirroring whatever push.default says --
      critique round 2 N6), AND `git rev-parse --symbolic-full-name @{push}` resolves (pushed sha = HEAD, dst = that
      branch), else deny;
      kind push -> resolve src in the worktree, then decide_push. DESTINATION RULE (critique F6): dst (explicit, or the
      src branch name when omitted, `refs/heads/` stripped) must match a DESTINATION PREFIX and never be main/master --
      a validated or red tree must never land on main through the admin-bypass ruleset (rec-4080). Destination prefixes
      = branching_topology.agent_branch_prefixes PLUS the gate-local handoff_evidence_gate.extra_destination_prefixes
      ["audit/"], both read from the base ref (critique round 2 N4: audit-prompt SKILL.md mandates
      `audit/{slug}-<sha>` audit-execution branches, e.g. PR #1234; agent_branch_prefixes itself is NOT widened because
      it drives the wake signals). An unreadable prefix set denies. The deny message names `git push -u origin
      HEAD:claude/<slug>` for worktree branches that are not agent-prefixed (EnterWorktree, subagent isolation).
      decide_push(worktree, pushed_sha): (1) EXEMPT when every path in `git diff --no-renames --name-only -z
      <merge-base(origin/main, pushed_sha)> <pushed_sha>` (so a rename lists BOTH source and destination -- critique F2:
      without --no-renames, `git mv scripts/x.py docs/plans/x.py` lists only the exempt destination) matches
      exempt_path_globs and none matches never_exempt_paths (fnmatch.fnmatchcase, `*` crosses `/`). Fail closed on
      every unknown: no origin/main ref, an unreadable or malformed clause, or a failed merge-base (shallow clone,
      unrelated history) means NO exemptions; the deny message says "rebase onto origin/main" for a branch carrying
      already-squash-merged paths. (2) Otherwise BRANCH ON load_record's status first (missing / unreadable -> deny
      naming it), then attests_head(record, head_tree=`git rev-parse <pushed_sha>^{tree}`, toplevel): ok -> pass;
      failed_run -> warn; every other rule -> deny naming the rule code and the handoff sequence (commit -> fetch +
      rebase -> full tier -> --verify-head -> push).
      decide_pr(payload_cwd, head): deny a cross-repo head ("owner:branch") or a head outside the destination prefixes;
      resolve the worktree whose `git worktree list --porcelain` entry is `branch refs/heads/<head>`, else the payload
      cwd's toplevel (overseer waves); resolve refs/remotes/origin/<head> there (missing -> deny "push the branch
      first"); return decide_push(worktree, that sha).
      decide_remote_write(branch, paths) (push_files / create_or_update_file / delete_file): deny when branch is
      main/master or outside the destination prefixes; else pass only if every path is exempt and none never-exempt.
      update_pull_request_branch is NOT gated (its payload names a PR number, not a head, so it cannot be scoped to agent
      branches without a network call, and denying it outright wedges the Dependabot sweep) -- a declared residual.
      CLI: --check-push [--sha SHA] [--worktree PATH] (default HEAD and cwd; exit 0 on pass/warn, 1 on deny, printing
      the rule). Target < 250 SLOC.
  - file: .claude/hooks/handoff_evidence_gate.py
    action: Create
    purpose: >-
      PLUMBING ONLY (Decision 162; critique F7): insert its own repo root (Path(__file__).resolve().parents[2]) at
      sys.path[0]; read the JSON payload from stdin; route Bash and Monitor (both carry tool_input.command; a Monitor
      command runs in the Bash shell environment -- critique F5e) through handoff_push_parse then the checker -- a
      push-shaped Monitor command is always denied (a push inside a monitor script is never the canonical handoff); a
      Monitor `ws` payload with no command passes --
      and route mcp__github__ / mcp__github-full__ create_pull_request, push_files, create_or_update_file and delete_file
      to the checker. OUTPUT: pass -> exit 0, no stdout; deny -> exit 2 with "handoff-evidence-gate: <rule>: <message>"
      on stderr (fed to Claude; a NonCanonical reason says "run `git push -u origin HEAD` (or `git -C <worktree> push -u
      origin HEAD`) as its own tool call; to write text that contains a push command use the Write tool"); warn -> exit 0
      printing {"systemMessage": <warning>, "hookSpecificOutput": {"hookEventName": "PreToolUse", "additionalContext":
      <warning>}} with NO permissionDecision (additionalContext reaches Claude, systemMessage the user -- hooks
      reference, PreToolUse decision control; critique M1). It NEVER emits permissionDecision allow (that skips the
      user's permission flow) or ask. main() wraps everything: any exception -> exit 2 "handoff gate error: <type>".
  - file: .claude/hooks/handoff_evidence_gate.sh
    action: Create
    purpose: >-
      Fail-closed shim (critique F1/F3: a non-0/2 PreToolUse exit, and a timed-out hook, are NON-blocking). No `set -e`
      and no `set -u`. (1) Read stdin once into a variable. (2) PRE-FILTER without Python (M3): continue only when the
      raw payload contains the substring `mcp__github` (whole-payload substring, robust to key spacing and
      pretty-printing -- F3c) or contains both `git` and `push`; otherwise exit 0. (3) From here a `trap` on ERR and EXIT
      maps any non-0/2 status to exit 2 with "handoff gate unavailable (<code>)". (4) CARVE-OUT: GITHUB_ACTIONS=true in
      the shim's OWN environment (GitHub Actions-hosted Claude sessions, .github/workflows/claude.yml: venv-less,
      fetch-depth 1) -> exit 0 with a stderr notice; a tool call's env never reaches the hook process, but a settings
      `env` block can -- declared under rec-4085's settings-edit row; the carve-out itself is rec-4086. (5) ROOT =
      $CLAUDE_PROJECT_DIR, else the shim's own `$(cd "$(dirname "$0")/../.." && pwd)`; run `timeout -k 5 45
      "$ROOT/bin/venv-python" "$ROOT/.claude/hooks/handoff_evidence_gate.py"` (-k so an adapter ignoring SIGTERM is
      killed inside the settings timeout) with the payload on stdin -- ABSOLUTE
      paths, because the hook's cwd follows Claude's cwd (F3d). (6) Exit map: 0 -> 0 (stdout passed through); 2 -> 2;
      124/137 (the shim's own timeout) and ANY other status -> 2. Every payload reaching step 5 passed the push-shaped
      pre-filter, so a broken interpreter blocks push-shaped calls only and never ordinary Bash.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Register the gate as a NEW PreToolUse entry with an ANCHORED matcher (M2):
      "^(Bash|Monitor|mcp__github(-full)?__(create_pull_request|push_files|create_or_update_file|delete_file))$", command
      `bash "$CLAUDE_PROJECT_DIR/.claude/hooks/handoff_evidence_gate.sh"`, and an explicit "timeout": 60 (above the
      shim's own 45-second bound -- a harness-level timeout would let the call through, F3a). Leave the existing entry
      byte-identical (Decision 138: augment, never replace). Register LAST in execution order: settings edits go live
      through the file watcher, so the shim and adapter must exist first (critique M2).
