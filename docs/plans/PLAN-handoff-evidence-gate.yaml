  - file: tests/test_session_handoff_push_parse.py
    action: Create
    purpose: >-
      Mirror home of scripts/session/handoff_push_parse.py (100% floor). TestPushShaped, parametrized one case per shape
      (critique F1): wrappers (timeout 120 git push, env GIT_TRACE=1 git push, command git push, nohup, time, `!`),
      grouping and control flow ((git push), { git push; }, if ...; then git push; fi), command substitution (echo
      $(git push ...), a backtick form, git commit -m "$(git push ...)"), combined-flag shells (bash -lc '...'), a
      shell-fed heredoc, a here-string, a multi-line command (git status NEWLINE git push), a comment-newline form (git
      status # check NEWLINE git push -- round 2 N1), a push after a QUOTED heredoc marker (grep -n "<<EOF" f NEWLINE
      git push -- N2), `timeout 60 bash -c '...'`, `env sh -c '...'`, `eval 'git push ...'` (N3), send-pack, http-push,
      subtree push, lfs push, `git -c alias.p=push p`, an unknown global option; and the NOT-push-shaped set (git log
      --grep push, git --no-pager log --grep push, git commit -m "push fix", a git commit whose -m is a $(cat <<'EOF'
      ... git push ... EOF) heredoc, git commit -m "$(printf 'explain git push')" (N2), git status # push later, grep
      "git push" f, cat > f <<'EOF' with a git push body line). TestCanonical: every
      instruction-surface literal (the scope-row list) is canonical; option order is irrelevant; bare git push; --delete
      and :branch; --dry-run; -C resolved relative to a cd prefix (M4); each NonCanonical reason (+src, two refspecs,
      env prefix, -c, --force, -f, --no-verify, --all, --mirror, --tags, a pipe, a redirection, a second segment, a
      trailing # comment).
      test_push_shaped_classifier_catches_wrapper_and_newline_forms is the graduated node.
