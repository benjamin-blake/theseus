  - docs/contracts/git-ops.yaml, .claude/hooks/never_on_main.py and the Claude Code hooks reference (PreToolUse decision control, timeouts) read
  - All scope files located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    scripts/session/handoff_push_parse.py + tests/test_session_handoff_push_parse.py (pure; one parametrized case per
    form).
  - >-
    scripts/session/handoff_evidence.py + tests/test_session_handoff_evidence.py (real tmp repos with a bare origin;
    real-writer evidence).
  - >-
    .claude/hooks/handoff_evidence_gate.py and .claude/hooks/handoff_evidence_gate.sh + tests/hooks/test_handoff_evidence_gate.py.
  - >-
    docs/contracts/git-ops.yaml handoff_evidence_gate clause, 2a's enforcement_coverage list extended in place, governance
    fields; re-pin the trailer-carrier shard; docs/DECISIONS.md Decision 203 (or next free).
  - >-
    Register the gate in .claude/settings.json LAST (a NEW entry; live immediately via the file watcher).
  - >-
    Graduation walk: six shards (filename == check_id == graduation_check_id), then implementation_declared true.
  - >-
    Execute VP steps 1-8 (loop until pass; STOP and RCA on a third consecutive failed fix, Decision 55); commit; VP step 9;
    then, in slice 2a's order, fetch + rebase, VP step 10, and push as its own tool call (now itself gated).
  - >-
    Record the four closure facts separately: readiness states (unknown is never PASS); parent validator evidence (VP step
    10's full tier, --verify-head and --check-push); structured postflight evidence (postflight --evidence); the real push /
    PR / CI / merge outcome.
  - >-
    PR body carries "Resolves: rec-4083" (its acceptance node is created by this plan and is not escape-classified, so the
    trailer route closes it). Squash-merge only once pr-validate is green on the head sha. After merge: VP step 15; then
    VP steps 11-14, posting the evidence to the PR (Decision 103).
  - "Report: what was implemented; the VP compliance table; the four closure facts; the live gate evidence."
work_areas: []
rollback: >-
  Revert the squash commit (the settings entry, shim, adapter, parser, checker and clause all go with it). If the gate
  wedges agent work before a revert lands -- including a missing or broken main-checkout .venv, which blocks every
  push-shaped call by design, or a WIP-preservation push that cannot complete a full tier -- a human reverts through the
  GitHub UI or pushes from their own clone (no harness hook there). Record the event against Decision 203's reversal
  condition (a) or (b).
