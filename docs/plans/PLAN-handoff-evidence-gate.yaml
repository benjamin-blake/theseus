constraints:
  - >-
    Depends on slice 2a merged first: import evidence_path_for, load_record, attests_head and ATTEST_RULES from
    scripts.checks.validation_result; never re-implement the attestation predicate; extend 2a's enforcement_coverage
    list, never add a second one.
  - >-
    No agent override of any kind (no env var, flag or marker lets an agent skip the gate) -- Decision 163 point 1. No
    release valve: red passes with a warning, so none is needed. The hook never emits permissionDecision allow (that would
    skip the user's permission flow) or ask.
  - >-
    Fail closed: evidence unknowns deny; exemption unknowns mean no exemptions; tokenise failures on git+push text are
    push-shaped; any shim or adapter failure blocks push-shaped calls only (never ordinary Bash calls).
  - >-
    Classification and grammar live in scripts/session/handoff_push_parse.py and decisions in
    scripts/session/handoff_evidence.py, both under the 100% coverage floor; the hook stays plumbing (Decision 162).
  - >-
    No git pre-push hook and no .pre-commit-config.yaml change (operator direction 2026-09-26, after round-1 critique:
    agent-settable SKIP= and env, the SessionStart readiness `git push --dry-run` collision and pre-commit's stash
    semantics outweighed its subprocess coverage; that surface is rec-4085's).
  - >-
    The exempt set and agent_branch_prefixes are read from origin/main; the gate's own files and registrations are never
    exempt (Decision 187).
  - >-
    Leave never_on_main.py, fresh_branch_base.py, edit_scope_guard.py and scheduled_agent_log_only.py and their settings
    entry untouched (Decision 138). Register the new settings entry LAST (the file watcher makes it live immediately).
  - >-
    git-ops.yaml: contract_version = live value + 1; clause <= 30 effective lines, whole diff <= 50; file <= 500
    effective lines (STOP and surface, never raise); no bare `claude/` outside agent_branch_prefixes.
  - >-
    Post-deploy probes run in a throwaway worktree with fixed /tmp paths and agent-prefixed destination branches; every
    push under test is its own tool call; the session's own checkout is never switched.
  - >-
    Out-of-scope defects become recs via scripts.ops_data_portal (Decision 59); forward-fix only (Decision 55/72).
  - >-
    bin/venv-python never bare python; Linux/bash only; line length 127; type hints required; no emojis; no em dashes.
context:
  - "Origin: the combined handoff plan's critique round 1 led the operator to split 2a (order + evidence, merges first) from 2b (this gate). 2b's own round 1 (REVISE, F1-F8 + M1-M7) led the operator to choose the identity-only redesign (2026-09-26): one harness hook, canonical-form allowlist, fail-closed shim, red passes with a warning; the pre-push layer and the ask-a-human valve were dropped."
  - "Redesign round 1 (REVISE, F1-F9 + M1-M6) folded in: F1 co-occurrence classifier (wrappers, grouping, substitution, newline and shell-fed heredoc forms; known no-arg git globals); F2 --no-renames; F3 shim self-timeout, explicit hook timeout, trap, whole-payload pre-filter, absolute paths; F4 bare and option-order-insensitive push, single agent-branch delete, update_pull_request_branch ungated (Dependabot) and declared; F5 2a's list extended in place with the rec-4083 row flipped, Monitor routed, check-level timeouts under rec-4087, executor folded into rec-4085; F6 destination restricted to agent branches, never main; F7 classifier moved under scripts/session/ (100% floor); F8 rule-code assertions + positive control; F9 real-writer evidence, realpath toplevel, load-status branching; M1 additionalContext; M2 register last, live via file watcher; M3 VP split; M4 -C relative to cd; M6 WIP pushes named."
  - "Redesign round 2 (REVISE, light) folded in: N1 shlex commenters '' (a comment swallowed the newline separator); N2 heredocs only in command context, recursive token-based $(...) body rule; N3 sh -c at any position and eval recurse; N4 gate-local extra_destination_prefixes [audit/] (audit-execution branches) and a HEAD:claude/<slug> hint; N5 enforced_by names pytest nodes as 2a does; N6 bare push also needs remote.<r>.push/mirror unset; N7 git-ops budget pre-decided (clause <= 30, diff <= 50, residuals cited from rec-4085 and the parser docstring); N8 non-agent deletes human-only, seeded tmp git-ops.yaml, Monitor ws passes; timeout -k."
  - "Round-1 (original design) dispositions still standing: F1 fail-closed exit map; F2 allowlist; F3 carve-out harness-only; F4 worktree-list mapping; F5/F7/M6 moot (no pre-push, no valve); F6 explicit test env + GITHUB_ACTIONS=true rerun; F8 residual rows; M1 Decision 203; M2 anchored matcher; M3 pre-filter; M4 injected clause; M5 exact-literal re-pin; M7 merge-base fail closed."
  - "Why identity, not verdict: the defect the operator named is validation of an uncommitted tree; identity gating closes exactly that with no wedge. Blocking red needs a deterministic inherited-red release first (Decision 83 non-wedging posture) -- rec-4087."
  - "Hooks reference (code.claude.com/docs/en/hooks.md, fetched 2026-09-26): exit 2 blocks and feeds stderr to Claude; any other exit code does not block; a timed-out command hook does not block (default timeout 600s); stderr on exit 0 reaches only the debug log; allow skips the permission prompt; exit 0 with no output means no decision; PreToolUse additionalContext reaches Claude and systemMessage the user; regex matchers are unanchored unless ^...$; the hook cwd follows Claude's cwd; settings edits are picked up by the file watcher."
  - "Considered, not taken (frame challenge Q1): a PATH-first git wrapper installed at SessionStart would judge pushes at argv level (after expansion, including subprocess pushes and commit-then-push compounds) but is spoofable via /usr/bin/git and outside the operator-chosen single-hook design; recorded as a rec-4085 candidate."
  - "Not a trust boundary: the evidence file is agent-writable; server-side owners are rec-4085 (attestation), rec-3221 (full tier in PR CI) and rec-4080 / rec-2827 (merge identity)."
