acceptance_criteria:
  - >-
    An agent push or GitHub remote write of non-exempt content is refused (exit 2, stderr naming the rule code and the
    handoff sequence) unless schema-4 evidence proves the pushed tree was validated from that worktree; a validated-but-red
    tree passes with a warning visible to both Claude (additionalContext) and the user (systemMessage); the hook never
    emits permissionDecision allow or ask.
  - >-
    Push recognition is co-occurrence based: every simple command pairing a git token with a later push token -- wrapped,
    grouped, substituted, multi-line (comment-terminated lines included), shell-fed, `sh -c` at any position or eval'd --
    is push-shaped unless its first word is git with a non-push subcommand or the pair sits inside one quoted argument; only the canonical forms (every documented instruction
    literal, option-order-insensitive, bare push, single agent-branch delete, dry run) are evaluated, and every other
    push-shaped command is refused.
  - >-
    No push or remote write targets main, master or a branch outside the destination prefixes (agent_branch_prefixes plus
    the gate-local audit/ prefix for audit-execution branches).
  - >-
    Plan-only, audit-prompt-only and audit-output-only pushes pass without evidence; the exempt set is read from
    origin/main and every unknown (no origin/main, unreadable clause, failed merge-base) means no exemptions; renames are
    evaluated on both source and destination; a push touching the gate's own files or registrations is never exempt; the
    REAL contract clause parses.
  - >-
    MCP create_pull_request resolves the head branch's own worktree (overseer waves) and denies a cross-repo, non-agent
    or unpushed head.
  - >-
    The shim fails closed: an adapter crash, any non-0/2 exit, an unstartable interpreter, an unset CLAUDE_PROJECT_DIR,
    an unrelated hook cwd or an adapter overrunning the shim's bound blocks push-shaped calls, and a hook timeout cannot
    pass one (explicit settings timeout above the shim bound); ordinary Bash calls are never blocked; GitHub
    Actions-hosted sessions are carved out deterministically and declared (rec-4086).
  - >-
    git-ops.yaml carries the gate clause and extends 2a's enforcement_coverage list in place (the rec-4083 row flipped to
    mechanical; every residual owned), contract_version = live + 1 with the trailer-carrier shard re-pinned to that exact
    literal, the new referenced_repo_paths, and stays <= 500 effective lines; Decision 203 (or next free) is conformant.
  - >-
    After merge, in a session whose harness has loaded the new settings: an agent push of an unvalidated non-exempt
    commit is refused, and an exempt plan-only push passes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the graduated core invariant -- evidence for a different tree never authorizes a push.
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py::TestPushDecision::test_denies_evidence_for_a_different_tree -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: A pass without two real distinct trees in a tmp repository proves nothing -- reject a mocked tree hash.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-gate-denies-unattested-push
  - step: 2
    phase: pre-deploy
    action: Run the graduated self-protection invariant -- the exempt set comes from origin/main, not the working tree.
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py::TestExemptSet::test_exempt_set_is_read_from_base_ref_not_worktree -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: A failure means the checker read git-ops.yaml from disk rather than `git show origin/main:...`.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-exempt-set-from-base-ref
  - step: 3
    phase: pre-deploy
    action: Run the graduated registration invariant -- the gate stays registered, anchored and time-bounded.
    command: bin/venv-python -m pytest tests/hooks/test_handoff_evidence_gate.py::test_settings_registers_gate_on_push_and_remote_write_tools -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: Never loosen the matcher or drop a tool name to make it pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-gate-registered
  - step: 4
    phase: pre-deploy
    action: Run the graduated real-contract invariant -- the checker's own loader parses the real exempt clause.
    command: bin/venv-python -m pytest tests/test_session_handoff_evidence.py::TestExemptSet::test_real_contract_exempt_clause_parses -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: A key-path mismatch between the clause and the loader -- fix the loader or the clause, never widen the globs.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-real-contract-exempt-clause
  - step: 5
    phase: pre-deploy
    action: Run the graduated fail-closed invariant -- no shim or adapter failure mode lets a push-shaped call through.
    command: bin/venv-python -m pytest tests/hooks/test_handoff_evidence_gate.py::test_shim_fails_closed_when_adapter_crashes -q
    expected: Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: A push-shaped payload exiting 0 or 1 in any arm is the fail-open the shim exists to prevent -- fix the exit map.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-gate-shim-fails-closed
  - step: 6
    phase: pre-deploy
    action: Run the graduated classifier invariant -- wrapper, grouping, substitution and newline push forms are recognised.
    command: bin/venv-python -m pytest tests/test_session_handoff_push_parse.py::TestPushShaped::test_push_shaped_classifier_catches_wrapper_and_newline_forms -q
    expected: Exit 0 with a pass summary. On the un-implemented tree the node does not exist (target_absent).
    fix_if: Any form reported not push-shaped is a fail-open path -- fix the classifier, never drop the case.
    hermetic: true
    graduation: graduate
    graduation_check_id: handoff-gate-push-shape-classifier
  - step: 7
    phase: pre-deploy
    action: >-
      Run the parser, checker and hook suites twice -- once as-is and once with GITHUB_ACTIONS=true exported, proving the
      tests build their own env and the carve-out cannot make a deny test pass vacuously in CI.
    command: >-
      bin/venv-python -m pytest tests/test_session_handoff_push_parse.py tests/test_session_handoff_evidence.py
      tests/hooks/test_handoff_evidence_gate.py -q
      && GITHUB_ACTIONS=true bin/venv-python -m pytest tests/test_session_handoff_push_parse.py
      tests/test_session_handoff_evidence.py tests/hooks/test_handoff_evidence_gate.py -q
    expected: Both runs exit 0 with identical pass counts.
    fix_if: A deny test that fails only under GITHUB_ACTIONS=true inherits the runner env -- build the subprocess env explicitly.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Steps 1-6 graduate the load-bearing invariants; a shard over whole suites would duplicate them and pin incidental
      cases (Decision 86).
  - step: 8
    phase: pre-deploy
    action: Measure both new modules' per-file coverage with the checker validate_test_coverage delegates to (diagnostic).
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
      scripts/session/handoff_evidence.py scripts/session/handoff_push_parse.py
    expected: Exit 0 with the PASS diagnostic verdict.
    expected_literals:
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: A missing-test error means a mirror test is not at tests/test_session_<stem>.py.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_test_coverage, which enforces the floor whenever either file changes.
  - step: 9
    phase: pre-deploy
    action: >-
      Run the fast tier on the COMMITTED tree (prose, SLOC, git-ops contract binding and size shard, Decision-entry
      conformance, shard admission, graduation completeness).
    command: test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate --pre
    expected: >-
      The clean-tree assertion passes (commit before this step), then zero failed checks; all six new shards ADMITTED;
      the re-pinned trailer-carrier shard ADMITTED; git-ops.yaml within 500 effective lines.
    fix_if: >-
      Read the summary, never the exit code (Decision 73). "not admitted -- tautological" on the trailer-carrier shard
      means it pins a value origin/main also carries -- pin the exact value this change leaves behind.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); its exit code is not a kernel assertion outside CI.
  - step: 10
    phase: pre-deploy
    action: Follow slice 2a's handoff order for this plan's own push and prove the new checker attests it before pushing.
    command: >-
      test -z "$(git status --porcelain)" && bin/venv-python -m scripts.validate
      && bin/venv-python -m scripts.checks.validation_result --verify-head
      && bin/venv-python -m scripts.session.handoff_evidence --check-push
    expected: The clean-tree assertion, the full tier, --verify-head and --check-push all pass on the committed, rebased tree.
    fix_if: >-
      A dirty-tree refusal means an edit after the commit -- commit it and rerun from the start; a recurring dirty_end
      with no edits is a defect (STOP and RCA, Decision 55). A timeout is BLOCKED. Once settings.json is registered the
      gate is LIVE in this session (file watcher), so this plan's own push is gated too -- that is the dogfood.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on transient commit/evidence state and invokes scripts.validate (recursion refusal).
  - step: 11
    phase: post-deploy
    action: >-
      In a session whose harness has loaded the merged settings.json (the file watcher usually picks it up live; a fresh
      session is certain), create a throwaway worktree and a local bare remote at FIXED paths with one unvalidated
      non-exempt commit.
    command: >-
      rm -rf /tmp/handoff-gate-probe.git /tmp/handoff-gate-probe-wt && git init -q --bare /tmp/handoff-gate-probe.git
      && git worktree add -q --detach /tmp/handoff-gate-probe-wt origin/main
      && printf 'probe\n' > /tmp/handoff-gate-probe-wt/scripts/_handoff_gate_probe.txt
      && git -C /tmp/handoff-gate-probe-wt add scripts/_handoff_gate_probe.txt
      && git -C /tmp/handoff-gate-probe-wt -c commit.gpgsign=false commit -q -m probe && echo ready
    expected: Prints ready; the session's own checkout is untouched.
    fix_if: A failure here is setup-only -- fix the paths; do not proceed to steps 12-14 without it.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      Prove the harness gate -- as ITS OWN tool call, attempt an agent push of the unvalidated probe commit to an
      agent-prefixed branch of the local bare remote (a filesystem-path remote is canonical).
    command: git -C /tmp/handoff-gate-probe-wt push /tmp/handoff-gate-probe.git HEAD:refs/heads/claude/handoff-gate-probe
    expected: >-
      The tool call is refused before it runs; stderr names handoff-evidence-gate and the missing-evidence rule code, not
      "unavailable" or "error".
    fix_if: >-
      If the call RUNS, the harness has not loaded the new entry (start a fresh session) or the matcher/worktree
      resolution is wrong -- record it on the PR and fix before relying on the gate.
    hermetic: false
  - step: 13
    phase: post-deploy
    action: Prove exempt pushes are not wedged -- replace the probe commit with a plan-only commit and push it as ITS OWN tool call.
    command: >-
      git -C /tmp/handoff-gate-probe-wt reset -q --hard origin/main
      && printf 'probe\n' > /tmp/handoff-gate-probe-wt/docs/plans/PLAN-handoff-gate-probe.yaml
      && git -C /tmp/handoff-gate-probe-wt add docs/plans/PLAN-handoff-gate-probe.yaml
      && git -C /tmp/handoff-gate-probe-wt -c commit.gpgsign=false commit -q -m probe && echo committed
    expected: >-
      Prints committed; then, as the next tool call, `git -C /tmp/handoff-gate-probe-wt push /tmp/handoff-gate-probe.git
      HEAD:refs/heads/claude/handoff-gate-plan-probe` runs WITHOUT a gate refusal.
    fix_if: >-
      A refusal names the exemption rule that failed -- most likely the base clause key path; fix the loader, never widen
      the globs.
    hermetic: false
  - step: 14
    phase: post-deploy
    action: Confirm the exempt push landed, then remove both probe paths (critique M3).
    command: >-
      git --git-dir=/tmp/handoff-gate-probe.git rev-parse --verify -q refs/heads/claude/handoff-gate-plan-probe; rc=$?;
      git worktree remove --force /tmp/handoff-gate-probe-wt; rm -rf /tmp/handoff-gate-probe.git; exit $rc
    expected: Prints the plan-probe commit sha and exits 0; both probe paths are gone.
    fix_if: A missing ref means step 13's push did not run or was refused -- re-read its output.
    hermetic: false
  - step: 15
    phase: post-deploy
    action: >-
      Confirm rec-4083 (the interactive-path residual slice 2a declared) closed through the Resolves trailer once
      trailer-closure concludes on the merge sha.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      row = make_reader(profile='agent_platform').named('rec_by_id', id='rec-4083')[0]; print(row['status']);
      assert row['status'] == 'closed'"
    expected: rec-4083 reads back closed.
    fix_if: >-
      Still open after trailer-closure concludes: read the job log for a refusal marker and follow
      git-ops.yaml::resolves_trailer's conditional fallback -- never force-close around a refusal.
    hermetic: false
