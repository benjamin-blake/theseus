constraints:
  - >-
    Depends on slice 2a merged first: import attests_head and ATTEST_RULES from scripts.checks.validation_result; never
    re-implement the attestation predicate.
  - >-
    No agent override of any kind (no env var, flag or marker lets an agent skip the gate) -- Decision 163 point 1. The
    only valve is a HUMAN approval prompt for failed_run, and it ships disabled (mode deny) until step 12's probe proves
    a prompt surfaces; humans keep `git push --no-verify` and the GitHub-UI revert.
  - >-
    Fail closed on evidence; a broken interpreter blocks push-shaped calls only (never ordinary Bash calls).
  - >-
    The exempt set and valve mode are read from origin/main; the gate's own files and registrations are never exempt
    (Decision 187).
  - >-
    Leave never_on_main.py, fresh_branch_base.py, edit_scope_guard.py and scheduled_agent_log_only.py and their settings
    entry untouched (Decision 138).
  - >-
    git-ops.yaml: contract_version = live value + 1; clause <= 60 effective lines; file <= 500 effective lines; no bare
    `claude/` outside agent_branch_prefixes.
  - >-
    Post-deploy probes run in a throwaway worktree with fixed /tmp paths; every push under test is its own tool call; the
    session's own checkout is never switched.
  - >-
    Out-of-scope defects become recs via scripts.ops_data_portal (Decision 59); forward-fix only (Decision 55/72).
  - >-
    bin/venv-python never bare python; Linux/bash only; line length 127; type hints required; no emojis; no em dashes.
