    build_lambda invocation. Precedent for this exact waiver shape:
    PLAN-ambient-prose-contract-relocation.yaml:465. Do NOT add a deploy step on the strength of
    the manifest match alone.
  - >-
    NATIVE-FIX REJECTION for Defect B (F4, Decision 100). .github/dependabot.yml carries no
    commit-message block, so the `chore(deps):` prefix that defeats fetch-metadata's anchored
    parser is dependabot's auto-detected convention and a `commit-message.prefix` pin is the
    native lever. It is REJECTED and .github/dependabot.yml stays OUT of scope: fetch-metadata v3
    (on main since #982) already relaxes that parser, so pinning a prefix would rewrite every
