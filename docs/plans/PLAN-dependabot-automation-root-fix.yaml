schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "dependabot-automation-root-fix"
intent: >-
  Make the dependabot automation built in PR #967 actually merge a PR by fixing all three
  independent defects that block it -- the floor/lock layout that reds every pip bump, the
  empty-update-type gate that denies every classified bump, and the UNKNOWN mergeStateStatus the
  stranded sweep never re-reads -- so routine dependency maintenance leaves the human critical path.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-dependabot-automation-root-fix.yaml
phase: T3.11
closes_criteria: []
scope:
  - file: requirements.in
    action: Create
    purpose: >-
      Prod dependency FLOORS, moved verbatim from today's requirements.txt (comments included).
      Becomes the pip-compile input dependabot's python resolver recognises, so a floor bump
      regenerates the compiled pins in the same PR instead of stranding them.
  - file: requirements-dev.in
    action: Create
    purpose: >-
      Dev dependency floors, moved verbatim from today's requirements-dev.txt, headed by
      `-c requirements.txt` so dev pins can never diverge from the prod closure.
  - file: requirements.txt
    action: Modify
    purpose: >-
      Becomes a pip-compile OUTPUT -- the standard autogenerated header plus the prod pinned
      closure (today's requirements.lock content, prod half). No longer holds floors.
  - file: requirements-dev.txt
    action: Modify
    purpose: >-
      Becomes a pip-compile OUTPUT -- header plus the dev pinned closure compiled under the
      `-c requirements.txt` constraint. No longer holds floors.
  - file: requirements.lock
    action: Delete
    purpose: >-
      Retired. Its role (pinned transitive closure) moves into the two compiled .txt outputs,
      which is the only shape dependabot's pip-compile path regenerates.
  - file: requirements-fast.txt
    action: Modify
    purpose: >-
      Header-comment repoint only: the floors it must match now live in requirements.in /
      requirements-dev.in. Stays a hand-maintained plain file with no matching .in, so
      dependabot keeps editing it directly.
  - file: .python-version
    action: Modify
    purpose: >-
      3.11.9 -> 3.12. Dependabot resolves the pip-compile closure under this file; nothing in
      bin/, scripts/, .github/ or .claude/ reads it, while bin/venv-python, pyproject.toml and
      every setup-python pin are already 3.12. A closure compiled under 3.11 markers would not
      match the interpreter CI installs it on.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      main-validate: cache key hashes the compiled outputs instead of requirements.lock, and the
      two `pip install -c requirements.lock -r ...` lines become plain `-r` installs of the
      compiled files (identical resolved set).
  - file: .github/workflows/main-canary.yml
    action: Modify
    purpose: Same cache-key and install repoint as ci.yml's main-validate job.
  - file: .github/workflows/dependabot-auto-merge.yml
    action: Modify
    purpose: >-
      Header: replace the requirements.lock rationale with the compiled-output one. env: block
      gains PREVIOUS_VERSION, NEW_VERSION, UPDATED_DEPENDENCIES_JSON and PR_TITLE so the policy
      delegate can derive a semver class when fetch-metadata leaves update-type empty. Body stays
      the one-line delegate.
  - file: scripts/import_governance.py
    action: Modify
    purpose: >-
      check_lockfile_sync reads floors from requirements.in + requirements-dev.in and pins from
      requirements.txt + requirements-dev.txt. Semantics unchanged and NOT weakened: extras-free,
      every floor pinned, every pin inside its floor's specifier. Two deliberate STRENGTHENINGS
      (F5/F6): (a) a new cross-output coherence assertion fails when the two compiled outputs pin
      the same distribution at different versions -- the replacement for the single-lock coherence
      the retired requirements.lock provided, and a live risk because anyio is reached by mcp on
      the prod side and by httpx/openai on the dev side; (b) all FOUR files become REQUIRED, a
      missing one a hard failure -- today's optional-dev tolerance (`if _REQUIREMENTS_DEV.exists()`
      at :75-76) is dropped because the `-c requirements.txt` constraint form makes
      requirements-dev.txt a committed compiled output that is always present. Also gains a public
      `paths` keyword parameter so callers and VP step 2 drive it through a public signature
      rather than private module constants.
  - file: scripts/checks/deps/validate_lockfile_sync.py
    action: Modify
    purpose: >-
      Wrapper docstring and banner repointed off the retired requirements.lock name, AND adopt
      registry.examined()/skipped() -- Decision 170's touch-it-fix-it clause fails any PR that
      edits a baselined check's own module without adopting the declaration in the same PR.
  - file: scripts/checks/deps/validate_requirements.py
    action: Modify
    purpose: >-
      Read declarations from requirements.in, not the compiled output -- otherwise this check
      fires one `pip index versions` subprocess per transitive pin (108 today, unbounded later)
      instead of per declared package. Also adopt registry.examined()/skipped() per Decision 170's
      touch-it-fix-it clause (declared packages examined; network-warning packages skipped).
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Shrink-only removal of validate_lockfile_sync (:70) and validate_requirements (:89), whose
      modules adopt the examined()/skipped() declaration in this same PR. Removal only -- the
      roster can never regrow, and no marker grammar is added (Decision 170 / Decision 165).
  - file: scripts/checks/_pytest_diff.py
    action: Modify
    purpose: >-
      _excluded_heavy_import_names derives the fast-tier heavy set as (full - fast); its `full`
      term must stay the DECLARED set (requirements.in), or every transitive pin joins the
      excluded set and the fast tier silently defers far more than it should -- breaking Decision
      135's strictly-additive selection. The repoint ships with an assertion that the derived set
      is IDENTICAL before and after the migration. 493 effective lines, 7 of headroom.
  - file: scripts/verify_ci_workflow.py
    action: Modify
    purpose: >-
      _assert_runtime_lock asserts the compiled-output install shape and the compiled files in
      the dependency cache key, replacing the `-c requirements.lock` assertion.
  - file: scripts/sync/ducklake_version.py
    action: Modify
    purpose: REQUIREMENTS_PATH points at requirements.in -- the duckdb FLOOR now lives there.
  - file: scripts/checks/misc/validate_ducklake_version_lockstep.py
    action: Modify
    purpose: >-
      Check (a) reads the requirements.in floor, and additionally asserts the compiled
      requirements.txt duckdb pin satisfies that floor.
  - file: scripts/checks/ci_guards/validate_dependabot_automation.py
    action: Modify
    purpose: >-
      Three new assertion groups: auto-merge delegate references dependabot_semver_class.py and
      the helper exists on disk; compiled outputs are dependabot-visible (.txt, pip-compile
      header, matching .in present); sweep delegate polls UNKNOWN mergeStateStatus via
      _gh_bounded_retry + `gh pr view`.
  - file: scripts/ci/dependabot_semver_class.py
    action: Create
    purpose: >-
      Stdlib-only fail-closed semver-class deriver -- a FALLBACK behind the managed primitive,
      never a replacement for it (Decision 100): a non-empty fetch-metadata UPDATE_TYPE always
      wins at first precedence and short-circuits every derivation branch. Prints exactly one of
      patch|minor|major|unknown, always exits 0, never raises at import.
  - file: scripts/ci/dependabot_auto_merge.sh
    action: Modify
    purpose: >-
      Call the deriver before gate 1; allow patch/minor, deny major/unknown; the _decision line
      names raw update-type, derived class, and whether the class was derived.
  - file: scripts/ci/dependabot_stranded_sweep.sh
    action: Modify
    purpose: >-
      Re-read a listed UNKNOWN mergeStateStatus through a bounded poll before the BEHIND/DIRTY
      test, so a PR whose mergeability GitHub had not computed at list time is still swept. A
      still-UNKNOWN PR after the bound emits a DISTINCT greppable marker mirrored to
      GITHUB_STEP_SUMMARY and rows `poll-exhausted`, never the silent `none` -- Decision 155's
      skip-with-marker intent: an indeterminate state must not read byte-identically to
      "nothing needed".
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Tier Item Freshness Gate re-grounding: re-word T3.11 c2's TEXT ONLY, which names
      requirements.lock -- the file this plan retires. The rewrite is owed by
      docs/contracts/exit-criteria-ledger.yaml:63 ("a criteria-vs-reality mismatch on an
      already-met criterion stages a rewrite, never a silent pass"). NO progress_note is added:
      that clause's wording-preservation half is conditional ("when the history matters"), T3.11
      is status complete, and Decision 147 point 2 stripped progress_note from every
      complete/reserved item with point 4 making it a durable norm -- git history and this plan's
      PR body carry the original wording. Criterion status stays met, item stays complete; /plan
      never flips a status.
  - file: tests/test_dependabot_semver_class.py
    action: Create
    purpose: In-process cases for every precedence branch and version-parse shape of the deriver.
  - file: tests/test_dependabot_auto_merge_wiring.py
    action: Modify
    purpose: >-
      New TestDerivedSemverClassFromVersions over both argvs; retarget
      test_empty_update_type_never_invokes_gh; extend the env-surface assertion.
  - file: tests/test_dependabot_stranded_wiring.py
    action: Modify
    purpose: >-
      gh shim learns `pr view --json mergeStateStatus`; new TestUnknownIsPolledUntilSettled;
      UNKNOWN leaves TestCleanPrIsLeftAlone's parametrisation.
  - file: tests/checks/ci_guards/test_validate_dependabot_automation.py
    action: Modify
    purpose: Fail-path fixtures and negative cases for each new guard assertion.
  - file: tests/test_import_governance.py
    action: Modify
    purpose: >-
      Repoint the gate tests onto the .in/.txt constant names; the mcp and pytz provenance tests
      read requirements.in and the compiled requirements.txt.
  - file: tests/checks/deps/test_validate_requirements.py
    action: Modify
    purpose: >-
      Fixtures write requirements.in; new accounting-declaration test asserting examined()/skipped()
      fire on the pass path and on the network-warning path.
  - file: tests/checks/deps/test_validate_lockfile_sync.py
    action: Modify
    purpose: >-
      Mirror test of a modified check module (Decision 181): repoint onto the compiled-output
      wording and add the accounting-declaration test for the newly adopted examined() call.
  - file: tests/validate/test_pytest_diff.py
    action: Modify
    purpose: >-
      Excluded-heavy derivation tests assert the (requirements.in - requirements-fast.txt) term,
      including a regression that a transitive-only pin never enters the excluded set.
  - file: tests/verify_ci_workflow/test_ci_data_guards.py
    action: Modify
    purpose: Runtime-lock guard fixtures move to the compiled-output install shape.
  - file: tests/verify_ci_workflow/test_ci_rca_and_canary.py
    action: Modify
    purpose: Canary runtime-lock fixture moves to the compiled-output install shape.
  - file: tests/test_sync_ducklake_version.py
    action: Modify
    purpose: Fixtures and the default-path assertion move to requirements.in.
  - file: tests/checks/misc/test_validate_ducklake_version_lockstep.py
    action: Modify
    purpose: Fixtures write requirements.in plus a compiled requirements.txt pin.
  - file: tests/test_venv_python.py
    action: Modify
    purpose: >-
      New test pinning .python-version's minor to REQUIRED_PYTHON_MINOR, alongside the existing
      pyproject and workflow pins.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - requirements.in and requirements-dev.in hold the floors; requirements.txt and
    requirements-dev.txt are pip-compile outputs carrying the autogenerated header naming their
    own .in input; requirements.lock is deleted and unreferenced by any live surface.
  - check_lockfile_sync still fails a floor raised above its compiled pin, still fails an
    extras-carrying pin, and still fails an unparseable declaration -- proven by the existing
    tests repointed onto the new files.
  - "scripts/ci/dependabot_semver_class.py prints exactly one of patch|minor|major|unknown, exits
    0 on every input including unparseable ones, and derives major for #980's
    `<2,>=1.28.0 -> >=2.1.1,<3` and patch for #981's `>=0.8.0 -> >=0.8.1`."
  - dependabot_auto_merge.sh arms auto-merge for a derived patch/minor class when update-type is
    empty, and never arms for a derived major, an underivable bump, or a denylisted dependency.
  - dependabot_stranded_sweep.sh re-reads an UNKNOWN mergeStateStatus up to five times and then
    acts on the settled value; a still-UNKNOWN PR takes no action and a genuine call failure is
    recorded FAILED.
  - validate_dependabot_automation fails when the semver-class helper is missing, when a compiled
    output loses its pip-compile header or its .in input, or when the sweep loses the UNKNOWN poll.
  - The fast-tier excluded-heavy set derived by scripts/checks/_pytest_diff.py is IDENTICAL before
    and after the layout change (it derives from the .in floors, not the compiled closure), proven
    by an explicit assertion over the live files rather than by inspection.
  - validate_lockfile_sync and validate_requirements declare registry.examined()/skipped() and are
    removed from config/check_accounting_baseline.yaml, leaving the roster strictly smaller.
  - A still-UNKNOWN PR after the poll bound emits a distinct greppable marker mirrored to
    GITHUB_STEP_SUMMARY and rows `poll-exhausted`, never the silent `none` action.
  - The union of the two compiled outputs' pins equals the pin set requirements.lock holds today
    -- no distribution gained, lost or version-changed -- and no distribution is pinned at two
    different versions across them; check_lockfile_sync fails a cross-output disagreement.
  - scripts/verify_ci_workflow.py is at or below 500 effective lines after the repoint (it sits at
    exactly 500 today), with no budget raise marker added anywhere.
verification_plan:
  # GRADUATION STANDARD APPLIED UNIFORMLY (plan-critique round 1, F7/F8): a step is WAIVED when an
  # already-registered scripts/validate.py check -- including one this plan registers -- runs the
  # identical assertion, so a registry row would run the same command twice per PR. A step is
  # GRADUATED only when its assertion has no registered-check equivalent. Steps whose command is a
  # whole-tier or multi-command run are not-applicable by construction.
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the layered pip-tools layout exists and is the shape dependabot's python resolver
      regenerates (compiled .txt, pip-compile header naming its own output file, a matching .in
      on disk), and that requirements.lock is gone.
    command: |-
      bin/venv-python -c "import pathlib; pairs=[('requirements.txt','requirements.in'),('requirements-dev.txt','requirements-dev.in')]; missing=[p for pair in pairs for p in pair if not pathlib.Path(p).exists()]; assert not missing, f'missing {missing}'; bad=[out for out,inp in pairs for t in [pathlib.Path(out).read_text(encoding='utf-8')] if 'autogenerated by pip-compile' not in t or f'--output-file={out}' not in t or inp not in t]; assert not bad, f'no pip-compile header naming its .in input: {bad}'; assert not pathlib.Path('requirements.lock').exists(), 'requirements.lock still present'; print('OK')"
    expected: prints OK and exits 0.
    fix_if: >-
      A missing .in, a compiled output without the '# This file is autogenerated by pip-compile'
      header plus its '--output-file=<name>.txt <name>.in' command line, or a surviving
      requirements.lock -- regenerate with pip-compile (never --no-header) and git rm the lock.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates assert_lockfile_is_dependabot_visible, which this plan adds to
      validate_dependabot_automation -- registered pre=True with pre_globs covering
      .github/workflows/** and scripts/ci/** (scripts/checks/ci_guards/_manifest.py:127-138), so
      the identical assertion already runs as a standing gate. This step is the implement-time
      proof; the registered check is the standing guard.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the lockfile-sync gate is repointed and NOT weakened -- a floor raised in the .in
      input above its compiled pin still fails the gate -- driving it through
      check_lockfile_sync's PUBLIC paths parameter rather than any private module constant.
    command: |-
      bin/venv-python -c "import pathlib,tempfile; from scripts.import_governance import check_lockfile_sync; d=pathlib.Path(tempfile.mkdtemp()); (d/'requirements.in').write_text('duckdb>=99.0  # inline comment\n', encoding='utf-8'); (d/'requirements-dev.in').write_text('', encoding='utf-8'); (d/'requirements.txt').write_text('duckdb==1.5.4\n', encoding='utf-8'); (d/'requirements-dev.txt').write_text('', encoding='utf-8'); ok,msg=check_lockfile_sync(paths=(d/'requirements.in', d/'requirements-dev.in', d/'requirements.txt', d/'requirements-dev.txt')); print('in_sync=',ok,'|',msg); raise SystemExit(0 if (not ok and 'duckdb>=99.0 rejects 1.5.4' in msg) else 1)"
    expected: >-
      exits 0 having printed 'in_sync= False' and an incompatible-pins message naming
      'duckdb>=99.0 rejects 1.5.4'.
    fix_if: >-
      in_sync True means the gate stopped rejecting a floor its pin cannot satisfy -- that is the
      weakening this plan forbids; restore the specifier containment test. A TypeError on `paths`
      means check_lockfile_sync did not gain the public keyword parameter this plan requires.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      tests/test_import_governance.py::TestCheckLockfileSync is the standing guard for every
      not-weakened property (raised floor, extras-carrying pin, unparseable declaration) and runs
      in the pytest suite on every tier. A registry row would assert the raised-floor case a
      second time while pinning the registry to this plan's tmp-fixture shape.
  - step: 3
    phase: pre-deploy
    action: >-
      Run the live lockfile-sync gate against the real tree, proving the compiled outputs pin
      every declared floor compatibly, carry no extras, and agree with each other.
    command: |-
      bin/venv-python -m scripts.import_governance --check-lockfile
    expected: >-
      exits 0 with a message naming requirements.in / requirements-dev.in as the declaration
      sources and the compiled .txt files as the pin sources.
    fix_if: >-
      'missing pins' means a declared floor has no compiled pin (recompile); 'incompatible pins'
      means a floor moved without recompiling; 'carry extras' means pip-compile ran without
      --strip-extras; 'disagree across outputs' means only one side was regenerated -- recompile
      both from their .in inputs in the same commit.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_lockfile_sync, already registered pre=True with no pre_globs in
      scripts/checks/deps/_manifest.py and therefore run ungated on every --pre invocation. A
      registry row would run the identical command a second time on every PR.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the migration is environment-equivalent and the two compiled outputs are coherent --
      the union of their pins equals the pin set requirements.lock holds today (no package gained,
      lost or moved), and no distribution is pinned at two different versions across them. This is
      the executable form of the "identical resolved set" claim and the replacement for the
      single-lock coherence the retired requirements.lock used to provide.
    command: |-
      bash -c 'set -e; git show origin/main:requirements.lock | grep -E "^[A-Za-z0-9]" | sed "s/[[:space:]]*#.*//" | sort > /tmp/pins-before.txt; cat requirements.txt requirements-dev.txt | grep -E "^[A-Za-z0-9]" | sed "s/[[:space:]]*#.*//" | sort -u > /tmp/pins-after.txt; echo "--- pins only in the retired lock ---"; comm -23 /tmp/pins-before.txt /tmp/pins-after.txt; echo "--- pins only in the compiled outputs ---"; comm -13 /tmp/pins-before.txt /tmp/pins-after.txt; diff -q /tmp/pins-before.txt /tmp/pins-after.txt; dupes=$(cut -d= -f1 /tmp/pins-after.txt | sort | uniq -d); echo "cross-output disagreements: ${dupes:-none}"; [ -z "$dupes" ]'
    expected: >-
      both comm sections empty, `diff -q` silent, and 'cross-output disagreements: none'; exit 0.
    fix_if: >-
      A pin only in the retired lock means the migration dropped a package -- most likely a direct
      floor that did not make it into either .in file (the pytz regression class,
      tests/test_import_governance.py:242). A pin only in the compiled outputs means a new
      transitive arrived, which is legitimate only if a floor moved in the same commit. A
      non-empty dupes list means the two outputs pin one distribution at two versions -- recompile
      requirements-dev.txt under `-c requirements.txt`.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The union-equality half is a ONE-SHOT migration comparison against a blob
      (origin/main:requirements.lock) that ceases to exist after this plan merges, so it cannot be
      a standing guard. Its durable half -- cross-output pin agreement -- is graduated instead as
      part of check_lockfile_sync itself (step 3), which is where it belongs permanently.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the semver deriver's two load-bearing live cases -- #980's comma-joined range pair
      derives major (so it is never auto-merged) and #981's derives patch (so it is).
    command: |-
      bash -c 'set -e; m=$(UPDATE_TYPE= DEPENDENCY_NAMES=mcp PREVIOUS_VERSION= NEW_VERSION= UPDATED_DEPENDENCIES_JSON= PR_TITLE="chore(deps): update mcp requirement from <2,>=1.28.0 to >=2.1.1,<3" bin/venv-python scripts/ci/dependabot_semver_class.py); p=$(UPDATE_TYPE= DEPENDENCY_NAMES=pytest-socket PREVIOUS_VERSION= NEW_VERSION= UPDATED_DEPENDENCIES_JSON= PR_TITLE="chore(deps): update pytest-socket requirement from >=0.8.0 to >=0.8.1" bin/venv-python scripts/ci/dependabot_semver_class.py); echo "mcp=$m pytest-socket=$p"; [ "$m" = major ] && [ "$p" = patch ]'
    expected: prints 'mcp=major pytest-socket=patch' and exits 0.
    fix_if: >-
      'unknown' for either means the PR-title fallback regex or the comma-joined-clause selection
      is wrong -- the lower-bound clause (>=, >, ==, ~=) is the one to parse, never the upper
      bound. 'minor' for mcp means the major component is being read off the wrong clause.
    hermetic: true
    graduation: graduate
    graduation_check_id: dependabot-semver-class-live-pr-title-cases
  - step: 6
    phase: pre-deploy
    action: >-
      Run the dependabot automation guard gate against the real tree, so every new structural
      assertion (helper referenced and on disk, compiled outputs dependabot-visible, sweep polls
      UNKNOWN and marks a post-poll UNKNOWN) is exercised against the files this plan wrote.
    command: |-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_dependabot_automation import validate_dependabot_automation as v; failed=[]; v(failed); assert not failed, failed; print('OK')"
    expected: prints a PASS line per assertion, then OK, and exits 0.
    fix_if: >-
      A FAIL line names the exact missing literal -- add it to the delegate or workflow it names.
      A 'delegate script missing on disk' entry means dependabot_semver_class.py was not created
      at the path the delegate references.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      This step IS validate_dependabot_automation, already registered pre=True at
      scripts/checks/ci_guards/_manifest.py:127-138 with pre_globs covering .github/workflows/**
      and scripts/ci/**. Graduating it would register the same check under a second identity.
  - step: 7
    phase: pre-deploy
    action: >-
      Stale-reference sweep for the retired surface -- requirements.lock must be unreachable from
      every live surface. docs/plans, audits, docs/audit-prompts and docs/DECISIONS.md are
      append-only records and are deliberately outside the sweep.
    command: |-
      bash -c '! grep -rIn "requirements\.lock" bin scripts src tests config .github docs/contracts docs/ROADMAP-PLATFORM.yaml requirements.in requirements-dev.in requirements.txt requirements-dev.txt requirements-fast.txt .pre-commit-config.yaml pyproject.toml'
    expected: no output, exit 0.
    fix_if: >-
      Each printed path still names the retired lock -- repoint it to the compiled outputs. A hit
      under docs/plans or audits means the sweep path list was widened past live surfaces; narrow
      it back rather than rewriting an append-only record.
    hermetic: true
    graduation: graduate
    graduation_check_id: requirements-lock-unreferenced-in-live-surfaces
  - step: 8
    phase: pre-deploy
    action: >-
      Prove .python-version names the interpreter minor every other surface pins, so dependabot
      resolves the closure under the same Python CI installs it on.
    command: |-
      bin/venv-python -c "import pathlib,re; v=pathlib.Path('.python-version').read_text(encoding='utf-8').strip(); w=pathlib.Path('bin/venv-python').read_text(encoding='utf-8'); m=re.search(r'^REQUIRED_PYTHON_MINOR=\"([0-9]+[.][0-9]+)\"$', w, re.M); assert m, 'bin/venv-python declares no REQUIRED_PYTHON_MINOR'; assert v == m.group(1) or v.startswith(m.group(1) + '.'), f'.python-version {v!r} does not match {m.group(1)!r}'; print('OK', v)"
    expected: prints 'OK 3.12' (or 'OK 3.12.<patch>') and exits 0.
    fix_if: >-
      A mismatch means .python-version was not aligned, or bin/venv-python's
      REQUIRED_PYTHON_MINOR moved -- reconcile both, and tests/test_venv_python.py's pyproject and
      workflow pins with them.
    hermetic: true
    graduation: graduate
    graduation_check_id: python-version-file-matches-required-minor
  - step: 9
    phase: pre-deploy
    action: >-
      Run every test file this plan creates or modifies, demonstrating each red-before-green
      obligation green after the change.
    command: |-
