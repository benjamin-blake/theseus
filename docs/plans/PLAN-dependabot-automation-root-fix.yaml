constraints:
  - Do NOT weaken check_lockfile_sync. Every property it asserts today (extras-free pins, every
    declared floor pinned, each pin inside its floor's specifier, unparseable declarations fail
    the gate) must hold identically against the new files.
  - No rescue agents or workaround loops (Decision 55). A red gate is fixed at the file it names.
  - Public repo -- no AWS account ids, ARNs, ExternalIds, credentials or internal hostnames in any
    touched file or commit message.
  - No emojis anywhere; ASCII hyphens only, never em dashes.
  - Both dependabot delegates stay single self-contained files -- do NOT extract a shared sourced
    helper for the bounded-retry poll. validate_dependabot_automation and
    validate_pr_conflict_signal each assert against ONE delegate file's own text.
  - Historical records are append-only -- do not rewrite requirements.lock references inside
    docs/plans/**, audits/**, docs/audit-prompts/** or docs/DECISIONS.md.
  - >-
    SIZE GOVERNANCE IS TWO GATES, NOT ONE (H1) -- attribute each touched file to the right one.
    config/structural_size_budgets.yaml:43 EXCLUDES suffixes .py and .md, so no Python file in
    this scope is governed by validate_structural_size_limits; there is no "python residual"
    class. Python files are governed by validate_sloc_limits against config/sloc_budgets.yaml
    (Decision 43/102/128/130), which hard-fails an UNREGISTERED file above 500 SLOC
    (scripts/checks/sloc/sloc_limits.py:117-120); SLOC counts non-blank lines whose first
    non-whitespace character is not '#'. The .sh, .yml, config and roadmap files in scope are the
    ones governed by structural_size_budgets (shell 500, ci_workflows 500, config 500).
    Decompose rather than raise in either gate (Decision 128); add no raise marker anywhere.
  - >-
    ZERO- AND LOW-HEADROOM PYTHON FILES, measured this session under the SLOC counter, all four
    UNREGISTERED in config/sloc_budgets.yaml and therefore hard-gated at 500:
    scripts/verify_ci_workflow.py 500 (ZERO headroom -- the _assert_runtime_lock repoint at
    :181-188 must be net-neutral-or-shrinking, and it is a like-for-like line swap);
    tests/validate/test_pytest_diff.py 458 (42 -- receives step 5b's set-equality assertion plus a
    transitive-only-pin negative case); tests/test_import_governance.py 455 (45 -- receives
    red-before-green coverage for BOTH check_lockfile_sync strengthenings, and its existing
    TestCheckLockfileSync methods run 15-20 SLOC each at :103-175, so two or three additions
    consume the margin); scripts/checks/_pytest_diff.py 493 (7). Next-nearest is
    tests/verify_ci_workflow/test_ci_rca_and_canary.py at 444. If a file would cross 500,
    DECOMPOSE it -- for the tests/ files the instrument is a Decision 131 concern-split mirror
    package (tests/<name>/ with focused modules), never a budget raise and never a thinner test.
  - >-
    The semver classifier is a FALLBACK, never a substitute for the managed primitive
    (Decision 100) -- a non-empty fetch-metadata UPDATE_TYPE must short-circuit every derivation
    branch at first precedence, and the script header must record why the native output was empty.
  - >-
    Gate 1 keeps a raw-UPDATE_TYPE branch that still compares against _ALLOWED_PATCH_UPDATE and
    _ALLOWED_MINOR_UPDATE (dependabot_auto_merge.sh:37-38) and still never names
    version-update:semver-major. The derived class is consulted ONLY on the empty-UPDATE_TYPE
    path, so those literals stay load-bearing rather than becoming dead text that the guard at
    validate_dependabot_automation.py:210-224 still asserts against (F11).
  - Decision 177 -- docs/DECISIONS.md bodies are append-only and waiver-free. Do NOT edit
    Decision 80's text; the re-grounding belongs to T3.11 c2 and this plan's PR body.
  - >-
    Decision 170 touch-it-fix-it -- ALL THREE baselined checks this plan edits
    (validate_ducklake_version_lockstep :59, validate_lockfile_sync :70, validate_requirements
    :88) must adopt registry.examined()/skipped() in the SAME PR that removes them from
    config/check_accounting_baseline.yaml. validate_check_accounting is pre=True with pre_globs
    ("scripts/checks/**", "config/check_accounting_baseline.yaml"), so a missed one reds --pre,
    not just the full tier. Removal only; never re-add, never add a marker grammar.
  - >-
    LAMBDA GATING WAIVER (F3, reviewed, explicit -- silence is not an option).
    compute_affected_artifacts flags the active data-pipeline artifact SOLELY because
    docs/ROADMAP-PLATFORM.yaml is a packaged asset entry at src/lambdas/data-pipeline/manifest.yaml:41.
    Grounds for the waiver: the edit is inert criterion TEXT with no handler, config or runtime
    change, and scheduled agents are disabled (PROJECT_CONTEXT; T4.12 pending). Therefore NO
    build/deploy/smoke step is required, verification_tier stays V2, and
    infrastructure_dependencies stays empty. Had a deploy been owed, the governed channel is
    .github/workflows/deploy-prod-lambdas.yml (decoupled_build_pipeline class,
    docs/contracts/build-lambda.yaml:161, docs/contracts/deploy-paths.yaml:110) -- never a local
    build_lambda invocation. Precedent for this exact waiver shape:
    PLAN-ambient-prose-contract-relocation.yaml:465. Do NOT add a deploy step on the strength of
    the manifest match alone.
  - >-
    NATIVE-FIX REJECTION for Defect B (F4/G2, Decision 100). .github/dependabot.yml carries no
    commit-message block, so the `chore(deps):` prefix is dependabot's auto-detected convention
    and a `commit-message.prefix` pin is the native lever. It is REJECTED and
    .github/dependabot.yml stays OUT of scope on ONE ground, chosen because it survives either
    outcome of the v3 question: the deriver grants no authority the managed primitive lacks --
    it sits strictly behind first-precedence UPDATE_TYPE and can only ever classify a bump the
    primitive declined to classify, so it substitutes for nothing. Pinning a prefix would instead
    rewrite every dependabot title convention repo-wide. DEFECT B STATUS, now that the Q4
    pre-check has resolved: v3 populates update-type for the range-update shape, so the deriver is
    defence-in-depth rather than the live fix -- it covers the empty values dependabot-core can
    still emit (grouped PRs without per-member versions, title shapes the relaxed regex misses),
    where the failure mode is a silent never-merge with no operator-visible reason. Had v3 left it
    empty, the same code would have been the live fix; the design is invariant under both, which
    is why it is built either way.
  - >-
    config/composite_action_body_baseline.yaml is deliberately NOT in Scope -- the
    dependabot-auto-merge step's run body must stay a one-line delegate so its 1-line entry
    (:139) is unchanged (Decision 162 R3 ratchets down only).
