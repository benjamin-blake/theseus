  - "Defect A step 2 -- SEED BEFORE COMPILING (G3). Today's requirements.lock is ONE combined
    resolve; this plan replaces it with two independent resolves, and pip-compile preserves an
    existing pin only if it finds one in the output file it is writing. So FIRST populate
    requirements.txt and requirements-dev.txt with today's requirements.lock pins, split prod/dev
    (a package reached only by dev inputs goes to the dev file; everything else to prod), and only
    THEN compile: `pip-compile --strip-extras --output-file=requirements.txt requirements.in` and
    `pip-compile --strip-extras --output-file=requirements-dev.txt requirements-dev.in` (NO
    --no-header -- the header is what makes the output dependabot-visible). pip-compile's
    conservative mode then holds every seeded pin and only moves one it genuinely cannot satisfy.
    Finally `git rm requirements.lock`. VP step 4 executes the comparison against
    origin/main:requirements.lock -- it is never eyeballed."
