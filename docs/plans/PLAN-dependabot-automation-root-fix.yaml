constraints:
  - Do NOT weaken check_lockfile_sync. Every property it asserts today (extras-free pins, every
    declared floor pinned, each pin inside its floor's specifier, unparseable declarations fail
    the gate) must hold identically against the new files.
  - No rescue agents or workaround loops (Decision 55). A red gate is fixed at the file it names.
  - Public repo -- no AWS account ids, ARNs, ExternalIds, credentials or internal hostnames in any
    touched file or commit message.
  - No emojis anywhere; ASCII hyphens only, never em dashes.
  - Both dependabot delegates stay single self-contained files -- do NOT extract a shared sourced
    helper for the bounded-retry poll. validate_dependabot_automation and
    validate_pr_conflict_signal each assert against ONE delegate file's own text.
  - Historical records are append-only -- do not rewrite requirements.lock references inside
    docs/plans/**, audits/**, docs/audit-prompts/** or docs/DECISIONS.md.
  - >-
    Every touched file stays inside its config/structural_size_budgets.yaml class limit (shell
    500, python residual 500); decompose rather than raise (Decision 128). ZERO-HEADROOM FILE:
    scripts/verify_ci_workflow.py measures exactly 500 effective lines today and
    scripts/checks/_pytest_diff.py 493, so the _assert_runtime_lock repoint must be
    net-neutral-or-shrinking. If it cannot be, decompose the module -- never add a raise marker.
