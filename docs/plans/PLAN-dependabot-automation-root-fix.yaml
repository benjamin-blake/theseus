rollback: >-
  Revert is COMPLETE at the git level and needs no out-of-band action: one revert commit restores
  requirements.lock, the floor-bearing requirements.txt / requirements-dev.txt, .python-version
  3.11.9, both delegates, the two check_accounting baseline entries and the T3.11 c2 wording. The
  completeness claim is checkable rather than asserted -- this plan touches no terraform root,
  deploys no Lambda (see the F3 waiver constraint), writes no warehouse row, mints no IAM and
  creates no external state. The only residue outside git is a dependabot PR already recreated
  against the new layout, which `@dependabot recreate` regenerates against the restored one. A
  revert also re-reds every pip bump: that is the pre-existing condition this plan removes, not a
  new failure the revert introduces.
