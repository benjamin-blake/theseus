slug: harness-pie790-sole-verifier-change
intent: Delete the single redundant pass statement from the body of Verifier.verify in scripts/verifiers/harness.py -- the file's only finding under the six ruff wave-B families -- so wave B can adopt PIE without touching the Verifier base class at all. The unit exists as its own PR because harness.py declares covers of ** and can therefore only be modified in a diff that carries no other real source file; proving that diff shape passes the verifier same-PR guard is the substance of this unit, not the one-line lint fix.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-harness-pie790-sole-verifier-change.yaml
phase: 'ad_hoc_rec soft-warn exception category; no tier_item claimed, no closes_criteria. RELATED (not targeted): T3.1 (complete -- owns the verifier same-PR guard this unit''s premise step exercises). Unit B of four in the operator-authorised ruff wave-B unblock series: Unit 0 (PLAN-same-pr-guard-plan-companion-exemption) is MERGED at main 96bc3ec and is this unit''s enabling prerequisite; Unit A (PLAN-coverage-debt-lint-blocked-files, rec-3593) lands separately and is disjoint -- it touches no path this plan declares.'
scope:
- file: scripts/verifiers/harness.py
  action: Modify
  purpose: 'Delete exactly one line: the bare pass statement in the body of Verifier.verify, an abstract method whose body already contains a docstring. Measured at main 96bc3ec, ruff check --select PIE on this file reports exactly one finding and it is that PIE790; ruff classifies the PIE790 fix as safe. Nothing else in the file changes -- no covers declaration, no signature, no docstring text.'
bundled_recommendations: []
followon_recs:
- rec-3616
infrastructure_dependencies: []
acceptance_criteria:
- 'ruff check --select PIE scripts/verifiers/harness.py exits clean on the changed tree, and the same selector against the origin/main content of that file reports exactly one finding, code PIE790 -- so the wave-B PIE census reads 20 rather than 21 and its TOTAL reads 74 rather than 75 once this lands (measured at main 96bc3ec: ICN=1 INP=1 C4=15 ERA=17 RET=20 PIE=21 TOTAL=75; the same six-family sweep over a scratch clone carrying only this deletion reads PIE=20 TOTAL=74).'
- 'The change is exactly one deleted line and is behaviour-preserving: the module''s AST at origin/main and on HEAD are unequal raw and EQUAL after a normaliser that drops bare pass statements from every body.'
- Verifier.verify still has a non-empty body consisting solely of its docstring, Verifier is still abstract with verify in its abstract-method set, and a concrete subclass still instantiates and dispatches through run() to a VerifierResult carrying the default covers of **. tests/test_verifiers/ stays green with no test file edited.
- The registered check validate_verifier_same_pr_guard reports no violation for this unit's real diff shape -- the modified harness.py plus this plan's own path and nothing else -- and the same check still FAILS when one real covered source file is added to that changed set, so the pass is the Unit 0 exemption working rather than the guard being inert.
- 'The touched set is asserted in both available directions: nothing lies OUTSIDE this plan''s sole scope file plus its own plan path, and the scope file itself IS present. No test file, no pyproject.toml edit, no per-file-ignores entry, no config/sloc_budgets.yaml entry, no config/coverage_baseline.yaml entry and NO config/agent/verification_registry/ shard is added -- after the Decision 132 pivot no step graduates, and a shard would itself be a covered path that trips the same-PR guard.'
- pyproject.toml is unchanged and [tool.ruff.lint] still does NOT select PIE and still carries no per-file-ignores table -- this unit makes the file clean so wave B can select the family; it does not select it.
- 'validate_test_coverage''s per-file leg reports no error for scripts/verifiers/harness.py, and the plan records the honest mechanism: map_source_to_test returns None for this path so the checker SKIPS rather than measures it. No claim of 100 percent coverage is made -- the measured figure under tests/test_verifiers/ at main 96bc3ec is 76 percent, and the deleted pass line is itself one of the uncovered lines.'
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Reads the origin/main content of the scope file through git show, so it holds identically on an origin/main worktree and on HEAD -- tautological under VF-06 c2, which admits a row only on a fail-on-revert differential. Its whole job is to pin the BEFORE number that makes step 2's AFTER number mean something; step 2 is the half that discriminates. Step 2 is nonetheless ALSO waived after the Decision 132 pivot -- for a structural reason, not a tautology one -- so no step in this plan graduates and no registry row is owed; step 2's own graduation_waiver_reason carries the mechanism and the deferred follow-on.
  action: BEFORE census, order-independent by construction. Take the scope file's content AS IT IS AT origin/main (never the working tree, which by the time this replays already carries the fix) and run the PIE selector over it through ruff's stdin-filename seam so the repo's own ruff config still resolves. Assert the file has exactly ONE finding under the whole PIE family and that it is PIE790 -- the claim the scope row rests on.
  command: 'OUT=$(git show origin/main:scripts/verifiers/harness.py | bin/venv-python -m ruff check --select PIE --no-cache --output-format=concise --stdin-filename scripts/verifiers/harness.py - 2>&1); ALL=$(printf ''%s\n'' "$OUT" | grep -cE '':[0-9]+:[0-9]+: '' || true); P790=$(printf ''%s\n'' "$OUT" | grep -c PIE790 || true); printf ''BASE-PIE-TOTAL=%s BASE-PIE790=%s\n'' "$ALL" "$P790"; test "$ALL" = "1" && test "$P790" = "1"'
  expected: 'One line reading BASE-PIE-TOTAL=1 BASE-PIE790=1, exit 0. Measured in a scratch clone whose origin/main ref was pointed at 96bc3ec: the single finding is PIE790 at the pass statement in Verifier.verify, reported as fixable.'
  fix_if: A BASE-PIE-TOTAL other than 1 means the base file moved since the census and this unit is no longer the sole-finding change it claims to be -- STOP and re-derive the scope from a fresh measurement rather than widening it. A BASE-PIE790 of 0 with a non-zero total means the one finding is a different PIE code, which is a different fix with a different safety classification. An empty OUT with exit 1 means the git show failed (unreachable origin/main); that is infrastructure, not a red.
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'UN-GRADUATABLE IN THIS DIFF, structurally -- the disposition the check itself invites (add the registry row, or flip this step to waive with a reason if it proved un-graduatable). Decision 132 makes graduation an enforced pre-merge obligation and Decision 176 grains the registry one record per file, so a graduate disposition here owes config/agent/verification_registry/entries/harness-verifier-pie790-clean.yaml. That shard is a REAL path matching this file''s default covers of ** and it is NOT a plan path, while validate_verifier_same_pr_guard subtracts only _common.plan_paths_from_changed -- so it counts as covered. Measured over the literal three-path changed set (harness.py, this plan, that shard): six FAIL lines, one per class in harness.py (VerifierStatus, VerifierSeverity, VerifierTier, Hermeticity, VerifierResult, Verifier), each naming the shard, and failed equal to the guard''s own name. Omitting the shard instead reds the other horn, graduation-completeness''s implement-PR leg. Both checks run in BOTH tiers (pre and full_after_lint), so both horns gate. Deferring the row to a follow-up PR is red too: run_verifier_differential requires origin/main to FAIL, and once this merges the PIE command passes on main (not admitted -- tautological). The property still discriminates and is not lost: it is discharged as this plan''s sole test obligation via the evidence branch, red on origin/main and green on HEAD. Its DURABLE guard is deferred to the follow-on named in Context (widen the guard''s companion subtraction to the graduated_registry_shard-derived set), not abandoned.'
  action: 'AFTER. The whole PIE family measures zero on the changed scope file. This is the downstream obligation the unit owes wave B: with this clean, wave B can add PIE to the select list without listing scripts/verifiers/harness.py among its scope rows.'
  command: bin/venv-python -m ruff check --select PIE --no-cache scripts/verifiers/harness.py
  expected: 'All checks passed, exit 0. This is a genuine fail-on-revert differential and it is what discharges this plan''s sole test obligation: run against an origin/main worktree the same command exits 1 on the PIE790 at Verifier.verify, reported as one error and fixable (measured). The step is NOT graduated -- see this step''s graduation_waiver_reason for the structural reason the registry shard cannot travel in this diff. PIE is not in the pyproject select list either before or after this unit, so until wave B adopts the family repo-wide there is no standing guard against reintroduction; that window is stated in Context rather than papered over.'
  fix_if: A non-zero exit naming PIE790 means the deletion was not applied or was reverted by a later edit. A non-zero exit naming any OTHER PIE code means something beyond the one deleted line changed in this file -- read the diff before touching anything, because this plan declares a one-line change.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Its standing form is self-destroying: the assertion is HEAD versus origin/main, so the moment this unit merges origin/main becomes HEAD, the raw-trees-differ half is false and the row would red permanently on a green tree. A registry row must survive its own merge; this one cannot. The property it proves is carried forward by step 4''s structural pin and by step 2''s measured lint differential -- which after the Decision 132 pivot is a test obligation discharged by evidence, not a registry row; see step 2''s graduation_waiver_reason.'
  action: Decision 181 mechanical form. Parse the scope file at origin/main and on HEAD, apply a normaliser that drops bare pass statements from every body, and assert the trees are UNEQUAL raw and EQUAL normalised. ast.dump without attributes ignores line numbers, so a line shift alone cannot manufacture either verdict. Equal-raw would mean nothing was deleted; unequal-normalised would mean more than a pass changed.
  command: 'bin/venv-python -c "import ast,pathlib,subprocess;b=subprocess.run([''git'',''show'',''origin/main:scripts/verifiers/harness.py''],capture_output=True,text=True,encoding=''utf-8'');assert b.returncode==0,b.stderr;N=type(''N'',(ast.NodeTransformer,),{''visit_Pass'':lambda self,node: None});base=ast.parse(b.stdout);head=ast.parse(pathlib.Path(''scripts/verifiers/harness.py'').read_text(encoding=''utf-8''));assert ast.dump(base)!=ast.dump(head),''raw trees identical -- nothing was deleted'';assert ast.dump(N().visit(base))==ast.dump(N().visit(head)),''normalised trees differ -- more than a bare pass changed'';print(''RAW-DIFFERS NORMALISED-EQUIVALENT'')"'
  expected: One line reading RAW-DIFFERS NORMALISED-EQUIVALENT, exit 0. Rehearsed in a scratch clone at 96bc3ec carrying only this deletion.
  fix_if: 'A raw-trees-identical assertion failure means the working tree does not carry the deletion yet. A normalised-trees-differ failure is the serious one: something other than a bare pass statement changed in this file, which is outside what this plan declares -- read the diff, revert the surplus, do not amend the plan to cover it.'
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: It would assert, at a weaker altitude (an AST shape rather than the linter's own verdict), the same single-line property step 2 already discriminates on -- and step 2 itself proved un-graduatable in this diff (Decision 132 pivot), so a row here would be the first and only registry shard in the diff and would trip the very same-PR guard this unit exists to pass. The residual it would add beyond step 2 -- that a concrete subclass still dispatches -- is already exercised on every PR by tests/test_verifiers/test_harness.py, which the affected set selects whenever this file changes (step 14 measures that selection).
  action: 'Decision 181 pin: the body stays non-empty and the class still works. Assert by AST that the body of Verifier.verify is exactly one statement and that statement is its docstring; assert Verifier is still abstract with verify in its abstract-method set (which is what makes direct instantiation raise); then build a concrete subclass at runtime, run it through Verifier.run and assert the dispatched VerifierResult carries the probe name, PASS status and the default covers of **.'
  command: 'bin/venv-python -c "import asyncio,ast,inspect,pathlib;from scripts.verifiers.harness import Verifier,VerifierResult,VerifierStatus;src=pathlib.Path(''scripts/verifiers/harness.py'').read_text(encoding=''utf-8'');cls=next(n for n in ast.parse(src).body if isinstance(n,ast.ClassDef) and n.name==''Verifier'');fn=next(n for n in cls.body if isinstance(n,ast.AsyncFunctionDef) and n.name==''verify'');assert len(fn.body)==1 and isinstance(fn.body[0],ast.Expr) and isinstance(fn.body[0].value,ast.Constant) and isinstance(fn.body[0].value.value,str),ast.dump(fn);assert inspect.isabstract(Verifier) and ''verify'' in Verifier.__abstractmethods__;C=type(''Probe'',(Verifier,),{''verify'':lambda self: asyncio.sleep(0,VerifierResult(name=''probe'',status=VerifierStatus.PASS))});r=asyncio.run(C().run());assert str(r.status)==''PASS'' and r.covers==[''**''] and r.name==''probe'',r;print(''BODY-IS-DOCSTRING-ONLY ABSTRACT-PRESERVED DISPATCH-OK'')"'
  expected: One line reading BODY-IS-DOCSTRING-ONLY ABSTRACT-PRESERVED DISPATCH-OK, exit 0. Rehearsed in a scratch clone at 96bc3ec carrying the deletion. Against origin/main the first assertion fails because the body is two statements there -- docstring plus pass -- so this step does discriminate; it is waived for duplication, not for tautology.
  fix_if: A body-length assertion failure printing two statements means the deletion is absent. A failure printing zero statements is impossible (an empty body does not parse) -- if you somehow see it, the AST being read is not this file's. An abstractness failure means the abstractmethod decorator was dropped, which is a real weakening and is out of this plan's scope. A dispatch failure means Verifier.run changed, which this unit does not touch.
- step: 5
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A test_selector row over this module would be admitted only if the selector FAILED on origin/main, and it does not: all 24 cases are green on both sides by construction, since the change is behaviour-preserving. It is a no-regression selector, not a differential. It already runs unconditionally in the full tier and is selected by the affected set in --pre whenever this file changes -- reached through Decision 135''s import-closure channel, not through the mirror map, which returns None for this path.'
  action: 'Behavioural regression: the verifier harness test module stays green with no test file edited. This is the evidence the sole test obligation links to.'
  command: bin/venv-python -m pytest tests/test_verifiers/ -q
  expected: '24 passed (15 in test_harness.py, 9 in test_coverage.py). Measured at main 96bc3ec both before and after the deletion -- the count is identical on both sides, which is the point: removing a pass from a docstring-bearing method is not observable by any test.'
  fix_if: Any failure here is a real regression and cannot be caused by deleting a bare pass -- check whether the working tree carries an unrelated edit before suspecting this change. Never obtain green by editing a case in this module; that is the Decision 181 CONTENT prohibition and this plan declares no test file in scope.
- step: 6
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Asserts against this session''s transient working-tree diff, which has no standing form: once merged, the scope file is no longer in the diff against origin/main and the non-vacuity precondition would red forever. It also fails on an origin/main worktree for that precondition rather than for the guard''s behaviour, so its apparent discrimination is on session state, not on the property -- exactly the shape VF-06 c2 rejects. The standing guard for this property is Unit 0''s already-graduated shard config/agent/verification_registry/entries/same-pr-guard-exempts-resolved-plan-companion.yaml, which runs the same registered check over the real harness.py plus one resolved plan path on every PR; step 7 is this unit''s own hermetic, CI-replayed restatement of it.'
  action: 'THE PREMISE STEP, live seam. Read the real working-tree diff through _common.get_changed_files (the same primitive the check itself reads, and the one whose git-diff-against-a-ref form sees uncommitted edits to tracked files, which /implement needs). Assert the scope file is actually IN that live set, so the step cannot pass vacuously; then union it with this plan''s own path -- the shape the PR presents once the commit flow flips implementation_declared -- and drive the registered validate_verifier_same_pr_guard over it. Honest note on why the union is needed: under the two-PR flow the plan document is already tracked at origin/main and unmodified while the Verification Plan runs, so the live diff alone would reach the OK branch through exception (c) without ever exercising Unit 0''s exemption.'
  command: bin/venv-python -c "from unittest.mock import patch;from scripts.checks import _common;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;H='scripts/verifiers/harness.py';P='docs/plans/PLAN-harness-pie790-sole-verifier-change.yaml';live=_common.get_changed_files();assert H in live,live;c=sorted(set(live)|{P});print('PR-SHAPE',c);f=[];p=patch('scripts.checks._common.get_changed_files',return_value=c);p.start();g(f);p.stop();assert not f,f;print('PREMISE-OK')"
  expected: 'A PR-SHAPE line naming the scope file and this plan''s path, then the guard''s no-same-PR-violations-found line, then PREMISE-OK, exit 0. Step 9 -- not this print -- is the authoritative assertion that nothing else is in the diff. Rehearsed in a scratch clone at 96bc3ec: the guard reached OK with harness.py and a plan path in the changed set. Honest rehearsal detail: that clone''s branch also carried an unrelated plan commit, so its PR-SHAPE printed three paths -- two of them plan paths and therefore both exempt, which is why the guard still reached OK. A real third path under scripts/ would NOT be exempt, which is what the fix_if below and step 8''s control are about.'
  fix_if: 'An assertion failure on H in live means the scope file is not modified in the working tree -- the fix is not applied, or the branch base is wrong. A PR-SHAPE line listing a THIRD path means the diff has grown beyond what this plan declares: step 9 is the authoritative report on that, and the remedy is to remove the surplus file, never to widen the plan. A non-empty findings list here means a real covered source file is in the diff and the guard is doing its job -- that is the unit failing its own premise, not a check to silence.'
- step: 7
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'This is the hermetic restatement of a property Unit 0 already graduated as same-pr-guard-exempts-resolved-plan-companion, differing only in which plan path is named. Registering a near-identical second row would duplicate an always-on check at no added discrimination -- and it is tautological besides: with the changed set fully patched, the command passes identically on an origin/main worktree, since Unit 0''s exemption is already on main.'
  action: THE PREMISE STEP, hermetic mirror -- the half that gets independently replayed by validate_vp_replay in PR CI. Drive the registered check over the LITERAL two-path changed set this unit's PR presents, against the real scripts/verifiers/harness.py on disk (six classes, every one inheriting the default covers of **), with the new-files git call mocked so the step depends on nothing but file contents. Assert no violation.
  command: bin/venv-python -c "from unittest.mock import MagicMock, patch;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;c=['docs/plans/PLAN-harness-pie790-sole-verifier-change.yaml','scripts/verifiers/harness.py'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();patch('scripts.checks._common.run',return_value=MagicMock(returncode=0,stdout='')).start();g(f);assert not f,f;print('PR-SHAPE-CLEAN')"
  expected: The guard's no-same-PR-violations-found line, then PR-SHAPE-CLEAN, exit 0. Rehearsed in a scratch clone at 96bc3ec.
  fix_if: A non-empty findings list naming the plan path means Unit 0's exemption is not present in the tree being tested -- confirm the branch is based on a main that contains 96bc3ec. A findings list naming harness.py itself is impossible by construction, since the comprehension already drops the verifier's own path.
- step: 8
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Tautological under VF-06 c2: the guard''s protective behaviour is unchanged by this unit, so the command produces the same FAIL on an origin/main worktree as on HEAD and no fail-on-revert differential exists to admit. Its standing guard is Unit 0''s mirror case test_violation_still_detected_when_plan_and_covered_file_both_present in tests/checks/verification/test_validate_verifier_same_pr_guard.py.'
  action: CONTROL for step 7 -- proof that step 7's pass is the exemption working rather than the guard being inert on this diff. Same literal changed set plus ONE real covered source file, scripts/validate.py. Assert the guard FAILS, and assert on the exact failed-list value rather than on printed prose.
  command: bin/venv-python -c "from unittest.mock import MagicMock, patch;from scripts.checks.verification.validate_verifier_same_pr_guard import validate_verifier_same_pr_guard as g;c=['docs/plans/PLAN-harness-pie790-sole-verifier-change.yaml','scripts/validate.py','scripts/verifiers/harness.py'];f=[];patch('scripts.checks._common.get_changed_files',return_value=c).start();patch('scripts.checks._common.run',return_value=MagicMock(returncode=0,stdout='')).start();g(f);assert f==['Verifier same-PR guard'],f;print('CONTROL-FIRES')"
  expected: Six FAIL lines, one per class in harness.py, each naming scripts/validate.py as the covered file -- never the plan path -- then CONTROL-FIRES, exit 0. The six FAIL lines are human-read context only; the step asserts on the failed list alone. Rehearsed in a scratch clone at 96bc3ec.
  fix_if: An empty findings list means the exemption is swallowing real covered files too, which would be a regression in Unit 0's merged change and a far larger problem than this unit -- stop, file it, do not proceed. A findings list naming the plan path means the exemption is not present at all.
- step: 9
  phase: pre-deploy
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Names this plan's own allowed touched set, which is transient by construction -- there is no standing form of nothing outside these two paths once the diff becomes history.
  action: 'Touched-set assertion, BOTH available directions, read through the working-tree-aware seam _common.get_status_aware_diff (its untracked leg is the only primitive that sees a file created but not yet committed, and /implement runs on an uncommitted tree). Direction one: nothing OUTSIDE this plan''s sole scope file plus its own plan path was touched -- this is what mechanically forbids a test edit, a pyproject edit, a per-file-ignores entry, a budget entry, or an amendment to the wave-B plan. Direction two: the scope file IS present, so the diff cannot be empty and the unit cannot pass by doing nothing. Deliberate asymmetry, stated rather than hidden: the plan path''s PRESENCE is NOT asserted, because under the two-PR flow (Decision 76) the plan is tracked at origin/main and stays unmodified until the commit flow sets implementation_declared, which runs AFTER this Verification Plan -- a two-sided equality over both paths would red deterministically for a reason unrelated to this change, and its only in-plan remedy would be editing a verification_plan field that sanction_rows.implementing_plan_bookkeeping lists as prohibited.'
  command: bin/venv-python -c "from scripts.checks import _common;H='scripts/verifiers/harness.py';P='docs/plans/PLAN-harness-pie790-sole-verifier-change.yaml';t={p for _s,p in _common.get_status_aware_diff()};outside=t-{H,P};assert not outside,sorted(outside);assert H in t,sorted(t);print('NOTHING-OUTSIDE SCOPE-FILE-PRESENT')"
  expected: 'One line reading NOTHING-OUTSIDE SCOPE-FILE-PRESENT, exit 0. Rehearsed in a scratch clone at 96bc3ec, where it reported exactly the two known clone artefacts and nothing else -- a bare .venv (a symlink there, a gitignored directory in a real checkout) and the unrelated plan document the clone''s session branch carried as a commit ahead of origin/main. Neither exists in the implement session this plan is written for, where the branch is based on a main containing 96bc3ec and the working tree carries only the scope file. The assertion is deliberately left strict rather than allowlisting either artefact: allowlisting would be a weakening under Decision 181, and both are absent in the environment that matters.'
  fix_if: 'Any path under tests/ means a test was edited -- this plan declares none and none is owed; revert it. pyproject.toml means the wave-B select-list edit leaked into this unit; that is wave B''s job. docs/plans/PLAN-ruff-wave-b-remaining-families.yaml means the census amendment was applied here; it belongs to wave B''s own PR, not this one. A path under config/agent/verification_registry/entries/ means the graduation walk wrote the shard step 2 is waived precisely to avoid -- delete it; it is a real covered path and the same-PR guard fires on it. A second path under scripts/ is the failure this whole unit exists to avoid -- the same-PR guard will fire on it at step 6 and in --pre. A bare .venv entry appears only when .venv is a SYMLINK rather than a directory, which is a scratch-clone artefact and never a scope violation (measured: the real checkout, where .venv is a directory, does not produce it). .secrets.baseline appearing is the contract''s STOP path, not a scope append: scripts/verifiers/harness.py is not a results-map key of .secrets.baseline (measured -- the map has six keys and none is under scripts/verifiers/), so sanction_rows.secrets_baseline_regeneration does NOT fire for this plan and validate_scope_boundary will reject the path; per that row''s disposition_on_violation, stop and raise a human-directed amendment.'
- step: 10
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Tautological: PIE is unselected and per-file-ignores absent at origin/main and on HEAD alike, so there is no fail-on-revert differential. Its standing guard is tests/checks/hygiene/test_pyproject_ruff_select.py, which pins the select list on every PR, plus wave B''s own plan, which is where the select-list change is authored.'
  action: 'Negative scope proof, asserted rather than promised: [tool.ruff.lint] still does NOT select PIE and still carries NO per-file-ignores table. This unit makes the file clean so wave B can select the family without listing it; adopting the family here, or carving the file out with an ignore, are both the wrong shape and are now falsifiable.'
  command: bin/venv-python -c "import tomllib;lint=tomllib.load(open('pyproject.toml','rb'))['tool']['ruff']['lint'];assert 'PIE' not in lint['select'],lint['select'];assert 'per-file-ignores' not in lint,sorted(lint.keys());print('PIE-NOT-SELECTED NO-PER-FILE-IGNORES')"
  expected: 'One line reading PIE-NOT-SELECTED NO-PER-FILE-IGNORES, exit 0. Measured at main 96bc3ec: the lint table has exactly one key, select, holding the fourteen wave-A families.'
  fix_if: A PIE-in-select failure means wave B's pyproject edit landed in this unit's tree; remove it, this unit does not adopt the family. A per-file-ignores failure means the file was carved out instead of fixed, which defeats the entire purpose of the unit.
- step: 11
  phase: pre-deploy
  hermetic: true
  graduation: waive
