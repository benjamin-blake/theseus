schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-scout-roadmap-projection"
intent: >-
  Give the /plan decision-scout gate a second corpus: a mechanical files_in_scope intersection
  against docs/ROADMAP-PLATFORM.yaml, reported as a ROADMAP section with CITE / CONFLICT / RELATED
  rows, a yield counter and a 40-plan revisit condition, so a design choice that forecloses or
  duplicates a tier_item the plan never names is caught before Step 6b instead of never
  (audit finding PDB-04, remedy B2-R5).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-scout-roadmap-projection.yaml
phase: >-
  T2.56 Normative / contract / ADR layering -- follow-on advancing the open criterion c1 on its
  third conjunct (the skills layer, rec-3378's subject): this plan frees 1,345 measured bytes of
  decision-scout rationale and redundancy (six of the fifteen items RELOCATE verbatim into a
  contract) and spends 1,335 of them on machine-enforced protocol -- honestly, a net-neutral feature
  addition funded by relocation and redundancy removal (end state 11,288 against the unchanged
  11,298 entry, a 10-byte net shrink), not a size reduction. c1 is conjunctive and rec-3378's acceptance (planning/SKILL.md <
  45,000 and implement/SKILL.md < 40,000) is untouched here, so no criterion flips and no
  closes_criteria is declared (Status-Trusted-Never-Inferred / T2.20;
  PLAN-ambient-prose-contract-relocation precedent).
scope:
  - file: scripts/roadmap/scope_projection.py
    action: Create
    purpose: >-
      Pure-local Scope-to-tier_item projection (matched_paths / project_items / project / main).
      Matches a tier_item when a files_in_scope entry equals a Scope path or is its directory
      prefix; emits exactly PROJECTED_FIELDS per hit (id, status, matched, intent truncated to
      INTENT_CHARS, open_criteria, depends_on, related_candidate_decisions). No warehouse I/O, no
      credentials, no writes -- the scout gate stays hermetic (Decision 105 R1-R3 guard).
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Add step 8b (ROADMAP overlay, with the <=5 row cap, its ordering rule and the non-zero-exit
      `unavailable (projection failed)` disposition that keeps a broken instrument out of the
      40-plan tally), the
      `### Roadmap Alignment (ROADMAP)` report block, and -- INSIDE the step-9 fenced report
      template, which is what the planning agent receives verbatim -- the integrity line
      `Roadmap items intersected: K; CONFLICT: c; RELATED: r` followed by the copy instruction;
      plus the ROADMAP share of the ~1,200-word cap, the 40-plan revisit condition and an extended
      quality-gate checkbox. Fund every added byte with the fifteen measured trade-outs in
      context (zero-headroom surface, no raise).
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      Receive the relocated rationale under a new top-level `gate_subagent_retrieval` block
      (isolation_rationale, bounded_retrieval, triage_source_provenance, substrate_swap_contract,
      anti_patterns -- the last carrying the long forms of the two CITE-lane over-citation bullets
      merged at :141-142) plus its amendment_log entry: the named destination that makes the
      skill's new pointers resolve to content rather than to another pointer (round-4 finding R3-7).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Declare the roadmap_alignment_projection reader contract as ONE STRING entry in a new
      top-level `audit_invariants` list (the field is `list[str] | None`, contracts_schema.py:213 --
      a dict entry fails the Class A load): an entry beginning `roadmap_alignment_projection: `
      that carries the field roster inside the fixed marker `fields=[...]`, plus read-only (T2.20),
      WARN-never-BLOCK, widen-here-first, the <=5-row display cap, and the measured KNOWN
      LIMITATION that the files_in_scope key is blind to the skills/commands layer. One
      amendment_log entry.
  - file: tests/test_scope_projection.py
    action: Create
    purpose: >-
      V2 tests for the module (exact match, directory-prefix match, near-miss prefix rejection,
      open-criteria filter, intent truncation, main exit codes) plus the cross-surface anti-drift
      assertions (roster agreement across module and ledger contract via one regex over the
      `fields=[...]` marker; skill report shape including the in-template copy instruction and the
      cap/ordering rule; the three standing registry guards' literals; the relocation moved rather
      than duplicated).
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The decision-scout report shape carries `### Roadmap Alignment (ROADMAP)` and, after
    `Decisions triaged: N of M`, the line `Roadmap items intersected: K; CONFLICT: c; RELATED: r`
    (PDB-04 acceptance, first half).
  - >-
    Running `bin/venv-python -m scripts.roadmap.scope_projection` over a Scope list that touches a
    live tier_item's files_in_scope returns that item with its open criteria (PDB-04 acceptance,
    second half; on this plan's own scope it returns T2.54 not_started and T2.56 in_progress).
  - >-
    The yield counter reaches its actor: the copy instruction sits INSIDE the step-9 fenced report
    template (the text the scout returns verbatim and the planning agent reads), immediately under
    the two count lines, and reads `(Planning agent: copy both count lines verbatim into the plan's
    scout context line.)` -- not as a step-10 self-instruction the planning agent never sees.
  - >-
    The ROADMAP lane is bounded: CONFLICT is pinned WARN and never BLOCK; at most 5 rows are
    displayed, ordered CONFLICT > CITE > RELATED with `in_progress`/`not_started` first and
    `(showing 5 of K)` appended when K > 5, while K, c and r stay FULL counts; ROADMAP takes at
    most 150 of the ~1,200 word cap; and the 40-consecutive-plans CONFLICT:0 revisit condition's
    stated outcome is DEMOTION, never retirement -- the section demotes to a RELATED-only pointer
    list while the intersection and the integrity line still run, only the judgement pass stops.
  - >-
    The yield counter cannot report a false zero. When the projection command exits non-zero the
    scout emits `Roadmap items intersected: unavailable (projection failed)` in place of BOTH count
    lines, shows no ROADMAP rows, and that run is EXCLUDED from the 40-consecutive-plans tally --
    so a projection that never ran (import error, roadmap schema drift, no shell) is distinguishable
    from a genuine `CONFLICT: 0` and can never accumulate toward the criterion-4 demotion. The
    literal is asserted by the anti-drift test and by VP step 4's registered guard.
  - >-
    `.claude/skills/decision-scout/SKILL.md` measures <= 11298 bytes (its zero-headroom
    config/prose_budgets.yaml entry) with that entry unchanged and carrying no raise-approved marker.
  - >-
    The two compressed sections are pointers to `docs/contracts/instruction-architecture.yaml`
    `gate_subagent_retrieval`, that block carries the relocated sentences, and the sentences no
    longer appear in the skill -- moved, not duplicated, not lost.
  - >-
    The projected field roster is identical in scripts/roadmap/scope_projection.py
    (PROJECTED_FIELDS), in the `fields=[...]` marker of the single audit_invariants string in
    docs/contracts/exit-criteria-ledger.yaml, and in the keys the module actually emits; that same
    string states the measured known limitation (a skills/commands-only Scope list yields K=0).
  - >-
    Every standing guard on the compressed surface still passes: T1.5 c1's section citation and
    rec-2774's grep resolve (`Lambda / portal migration contract` heading and the literal `T1.5`
    survive); the three graduated registry checks hold (`### Spirit-Alignment Flags (SPIRIT)`
    occurs EXACTLY once, `decisions-index.json` still appears, no whole-DECISIONS.md read
    instruction is introduced); the four SPIRIT gate markers (i)-(iv) and the `SPIRIT
    over-citation` bullet survive; and both rules of the merged CITE-lane bullet survive.
  - >-
    New tests fail without the change; both `bin/venv-python -m scripts.validate --pre` and the
    full `bin/venv-python -m scripts.validate` tier exit 0; the contract drift gate passes with a
    new amendment_log entry on each edited contract.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new module's unit tests and the cross-surface anti-drift assertions.
    command: bin/venv-python -m pytest tests/test_scope_projection.py -q
    expected: All tests pass, including the near-miss prefix rejection and the roster-agreement assertions.
    fix_if: >-
      A matching test fails -- the prefix rule is wrong (a files_in_scope entry must match a Scope
      path exactly or as a directory prefix, never as a bare string prefix). A roster or wiring
      test fails -- the skill, the ledger contract and the module disagree; make the contract's
      declared roster authoritative and re-align the other two.
    hermetic: false
    graduation: graduate
    graduation_check_id: roadmap-scope-projection-tests
  - step: 2
    phase: pre-deploy
    action: Prove the projection yields live items for a real Scope list (PDB-04's fixture-plan acceptance).
    command: 'bin/venv-python -m scripts.roadmap.scope_projection .claude/skills/decision-scout/SKILL.md docs/contracts/exit-criteria-ledger.yaml docs/contracts/instruction-architecture.yaml | bin/venv-python -c "import json,sys; r=json.load(sys.stdin); assert r, ''K=0 -- intersection returned nothing''; assert any(i[''status''] in (''not_started'',''in_progress'') and i[''open_criteria''] for i in r), r; print(''K='', len(r), [i[''id''] for i in r])"'
    expected: 'Prints K= 2 [''T2.54'', ''T2.56''] (or a superset if the roadmap has grown) and exits 0.'
    fix_if: >-
      Exit 1 with K=0 -- the directory-prefix match is not firing on the `docs/contracts/` entry
      that T2.54/T2.56 carry; fix matched_paths, do not weaken the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The assertion is about the LIVE roadmap population (which tier_items happen to list
      docs/contracts/ today), not a durable repo invariant; graduating it would pin a data fact
      that a legitimate roadmap edit could flip. The durable half -- the matching rule itself -- is
      graduated at step 1 against fixtures.
  - step: 3
    phase: pre-deploy
    action: Prove the zero-headroom prose budget holds with no raise and no budget edit.
    command: 'test $(wc -c < .claude/skills/decision-scout/SKILL.md) -le 11298 && grep -q "^  .claude/skills/decision-scout/SKILL.md: 11298$" config/prose_budgets.yaml && ! grep -n "decision-scout" config/prose_budgets.yaml | grep -q "raise-approved"'
    expected: >-
      Exits 0 -- the skill fits its unchanged 11298-byte entry (ledger projection: 11,288, 10
      bytes of slack after the round-2 reservoir draw), which carries no raise marker.
    fix_if: >-
      Exit 1 -- the additions outran the funding ledger. The :59-63 reservoir is SPENT (drawn in
      round 2 as ledger item 15, 499->413). Draw from the ONE remaining named reservoir FIRST --
      line :102's quote-source bracket, `"[exact quote of the entry's
      **Intent:**/**Problem:**/**Decision:** marker, or a specific Rationale sentence]"` -> `"[the
      quote required by gate (ii)]"`, 143->68 = 75 bytes, pure redundancy because gate (ii) at :72
      already enumerates those same three markers as the requirement. Then tighten the plan's own
      additions, and re-measure -- never a budget raise, never a deletion outside the ledger or the
      reservoir, never a heading removal.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits and validate_prose_budget_raises already enforce both halves of this
      assertion on every surface in both presubmit tiers; a registry shard would be a third copy of
      standing enforcement, and the byte number would rot the moment a later PR ratchets the entry down.
  - step: 4
    phase: pre-deploy
    action: Prove the rationale MOVED (not duplicated, not lost), the pointers resolve, the copy instruction reaches the template, and every standing guard on this surface survives.
    command: 'grep -q "gate_subagent_retrieval" .claude/skills/decision-scout/SKILL.md && grep -q "^gate_subagent_retrieval:" docs/contracts/instruction-architecture.yaml && grep -q "A naive inline grep" docs/contracts/instruction-architecture.yaml && grep -q "index-plus-targeted-reads" docs/contracts/instruction-architecture.yaml && ! grep -q "A naive inline grep" .claude/skills/decision-scout/SKILL.md && ! grep -q "index-plus-targeted-reads" .claude/skills/decision-scout/SKILL.md && grep -q "Lambda / portal migration contract" .claude/skills/decision-scout/SKILL.md && grep -q "T1.5" .claude/skills/decision-scout/SKILL.md && grep -q "SPIRIT over-citation" .claude/skills/decision-scout/SKILL.md && grep -q "decisions-index.json" .claude/skills/decision-scout/SKILL.md && grep -q "copy both count lines verbatim" .claude/skills/decision-scout/SKILL.md && grep -q "unavailable (projection failed)" .claude/skills/decision-scout/SKILL.md && test $(grep -c "^### Spirit-Alignment Flags (SPIRIT)$" .claude/skills/decision-scout/SKILL.md) -eq 1 && test $(grep -cE "^   - \((i|ii|iii|iv)\) \*\*" .claude/skills/decision-scout/SKILL.md) -eq 4'
    expected: >-
      Exits 0 -- the skill names the destination block, the destination carries both relocated
      sentences, neither survives in the skill, T1.5 c1's section citation plus rec-2774's grep
      still resolve, the in-template copy instruction is present, and the three graduated registry
      guards' literals hold (SPIRIT heading exactly once, decisions-index.json present) alongside
      the four SPIRIT gate markers (i)-(iv), and the unavailability literal is present so a failed
      projection can never masquerade as `CONFLICT: 0`.
    fix_if: >-
      A negative grep fires -- the content was copied instead of moved (two homes to drift). A
      positive grep misses -- the pointer dangles, the relocated text was paraphrased away, the
      :141-142 merge ate :145, or the :26 / :72 / :132 compressions ate `decisions-index.json`,
      the SPIRIT heading or one of its four gate markers, or the non-zero-exit disposition was
      dropped as a byte saving (it is load-bearing for acceptance criterion 5 -- fund it from the
      :102 reservoir instead); move the sentences verbatim and restore whatever the compression took. The SPIRIT-heading count != 1 -- the ROADMAP block duplicated
      the heading; registry check decision-scout-spirit-section-present pins it at exactly one.
    hermetic: true
    graduation: graduate
    graduation_check_id: scout-rationale-relocated-not-duplicated
  - step: 5
    phase: pre-deploy
    action: Run the contract gates over both edited contracts.
    command: 'bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f); print(f); raise SystemExit(1 if f else 0)" && bin/venv-python -c "import pathlib; from scripts.contracts import load_contract, resolve_refs; from scripts.contracts_enforcement import check_required_inline_fields; p=pathlib.Path(''docs/contracts/exit-criteria-ledger.yaml''); d=load_contract(p); resolve_refs(d, p.parent); e=check_required_inline_fields(d); assert d.contract.class_.value==''A'', d.contract.class_; assert not e, e; assert all(isinstance(x, str) for x in d.audit_invariants), d.audit_invariants; print(''CLASS A OK'', sorted(d.fields))"'
    expected: >-
      The drift gate reports no findings and exits 0; the ledger still loads as a Class A ritual
      contract with its five-field roster unchanged and every audit_invariants entry a plain string.
    fix_if: >-
      The drift gate flags a Class D body change without a new amendment_log entry -- add one
      (change_class governance_note_add, semantic_break false). The Class A load fails -- either
      the declaration was written as a dict (audit_invariants is `list[str] | None`, make it one
      string) or it was put under a new top-level key (ContractDocument forbids extras).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_contract_drift is a registered check already running in both tiers, and the Class A
      loader assertion is already graduated as registry check_id exit-criteria-ledger-is-class-a
      (PLAN-cfg-migration-closeout); a shard here would duplicate both.
  - step: 6
    phase: pre-deploy
    action: Prove the new module is fully covered (no coverage_baseline entry means the 100% standard applies).
    command: bin/venv-python -m pytest tests/test_scope_projection.py --cov=scripts.roadmap.scope_projection --cov-report=term-missing --cov-fail-under=100 -q
    expected: Coverage reports 100% for scripts/roadmap/scope_projection.py and exits 0.
    fix_if: >-
      Below 100% -- cover the missing branch with a test rather than registering a
      coverage_baseline entry (a new file has no grandfather claim; Decision 159).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Coverage is enforced repo-wide by the standing coverage gate plus test_coverage_checker
      --check-coverage in the commit flow; a per-file registry shard would duplicate it and would
      have to be retired the day a legitimate baseline entry is ever registered for this file.
  - step: 7
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0 -- plan schema, prose budgets, SLOC, contract drift, graduation completeness, decision currency (I5) and test obligations all green.
    fix_if: Any check fails -- fix on the branch before pushing; never bypass with --ignore-budget.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the full presubmit tier once after every tracked write (handoff_policy / Decision 163 point 2).
    command: bin/venv-python -m scripts.validate
    expected: Exits 0.
    fix_if: Any full-tier check fails -- fix on the branch; never bypass.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/scope_projection.py
    behavior: >-
      A tier_item matches only when a files_in_scope entry equals a Scope path or is its directory
      prefix (never a bare string prefix), and each projected row carries exactly PROJECTED_FIELDS
      with open_criteria filtered to status == open.
    verification_step: 1
    test_selector: tests/test_scope_projection.py
    red_green_expectation: >-
      Red before (the module does not exist, so collection fails), green after.
  - source: .claude/skills/decision-scout/SKILL.md
    behavior: >-
      The report shape keeps the ROADMAP section, the exact integrity-line template, the copy
      instruction INSIDE the fenced step-9 template, the WARN-never-BLOCK rule, the non-zero-exit
      `unavailable (projection failed)` disposition with its explicit exclusion from the 40-plan
      tally, the <=5-row cap with its ordering rule and `(showing 5 of K)` note, the 150-word
      ROADMAP share and the
      40-plan revisit condition (stated as a DEMOTION to a RELATED-only pointer list, not a
      retirement); the skill still names T1.5, `decisions-index.json` and the projection module;
      and the merged CITE-lane bullet's two rules, the `SPIRIT over-citation` bullet, exactly one
      `### Spirit-Alignment Flags (SPIRIT)` heading and its four gate markers (i)-(iv) all survive
      the compression.
    verification_step: 1
    test_selector: tests/test_scope_projection.py
    red_green_expectation: Red before (the skill carries no ROADMAP section), green after.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      audit_invariants holds one string beginning `roadmap_alignment_projection: ` whose
      `fields=[...]` marker parses by one regex to exactly PROJECTED_FIELDS, and which states
      read-only (T2.20), WARN-never-BLOCK, widen-here-first, the <=5-row display cap and the
      skills/commands-layer known limitation.
    verification_step: 1
    test_selector: tests/test_scope_projection.py
    red_green_expectation: Red before (no audit_invariants block), green after.
  - source: docs/contracts/instruction-architecture.yaml
    behavior: >-
      gate_subagent_retrieval carries the relocated isolation, bounded-retrieval, triage-source
      and substrate-swap rationale plus the two over-citation long forms, and the skill's pointers
      resolve into it.
    verification_step: 1
    test_selector: tests/test_scope_projection.py
    red_green_expectation: Red before (no gate_subagent_retrieval block), green after.
constraints:
  - >-
    No prose-budget raise. config/prose_budgets.yaml is NOT in scope: the skill must land <= its
    existing 11298-byte entry, funded only by the fifteen trade-outs named in context (item 15 is
    the round-2 draw on the former :59-63 reservoir) plus, if needed, the one remaining named
    reservoir (:102's quote-source bracket) in VP step 3's fix_if.
  - >-
    Relocation, not fragmentation: the rationale moves to ONE existing contract (Decision 86 /
    Decision 127 relief valve, explicitly sanctioned in config/prose_budgets.yaml's header); the
    skill is never split into @-imported fragments (Decision 110 / Decision 114).
  - >-
    The three graduated registry checks guarding this skill are load-bearing and must keep passing
    unchanged: decision-scout-spirit-section-present (`### Spirit-Alignment Flags (SPIRIT)` EXACTLY
    once -- the ROADMAP block must not reuse that heading), decision-scout-bounded-read-protocol
    (`decisions-index.json` >= 1 -- the :26 compression keeps it), and
    no-whole-decisions-read-instructions (no "read the entire/full DECISIONS.md" instruction).
    validate_decision_currency I5's two literals on skill line 65 (`superseded_compacted`,
    `NEVER filtered and NEVER severity-reduced`) are outside every trade-out and stay verbatim.
  - >-
    exit-criteria-ledger.yaml is a Class A ritual contract with extra="forbid" and
    `audit_invariants: list[str] | None` -- the declaration is ONE STRING in that list, never a
    dict, never a new top-level key and never a fake `fields:` entry.
  - >-
    The scout gate stays credential-free and hermetic: the projection is a pure-local typed-loader
    read, never a warehouse or portal call (Decision 105 R1-R3 guard, Decision 88).
  - >-
    The ROADMAP overlay never raises BLOCK -- a CONFLICT is WARN, feeding FLAGS_FOUND, and the
    human keeps the per-flag disposition (planning/SKILL.md Step 6a menu).
  - >-
    The scout stays read-only. It never flips a criterion status (Status-Trusted-Never-Inferred /
    T2.20) and never edits a file (Decision 55: file a rec instead).
  - No rescue agents or workaround loops (Decision 55).
