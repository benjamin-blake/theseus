infrastructure_dependencies:
- >-
  Two PRs in order. PR A is Terraform only (the two alarm edits plus tests/checks/iam_tf/test_ducklake_writer_error_alarms.py):
  CI's terraform-validate and speculative plan must show exactly two in-place updates and no IAM, then it merges and
  terraform-apply-sandbox applies the reviewed plan (Decision 77/126). PR B (everything else) merges only after PR A's apply
  is green, so a typed 5xx never ships unwatched. Spend: each alarm goes from one to two metrics, about USD 0.10 a month
  each, signed off by Benjamin on the decision card (2026-10-14).
- >-
  PR B merges only after the Writer grant fix (the amendment to PLAN-telemetry-registration-verbs, thread "Writer grant fix
  plan") is deployed and its --lambda-telemetry gate printed TELEMETRY_PROVISION_OK: PR B's own governed deploy runs the same
  gate, which would otherwise be red at provision_telemetry (now as a typed 500). PR B rebases onto that fix, which edits
  the same telemetry writer contract (its 500 runtime row gains "a target table is absent"; this plan's unmapped text joins
  that same 500 key, so merge the two strings, never replace one), only _check_probe in lambda_telemetry_gates.py (this plan
  touches only the failure-text helpers), and one fixture sentence each in PLAN-telemetry-append-inline and
  PLAN-telemetry-blob-route (fixtures call create_telemetry_tables first); this plan's amendments to those plans leave those
  sentences alone.
- >-
  PR B merges before the plan 3 part 2 build (PLAN-telemetry-append-inline) starts, so that build reads the amended text;
  the coordinator holds part 2's build until then. The blob-route build follows part 2 as before.
- >-
  PR B redeploys the DuckLake functions through deploy-ducklake-lambdas.yml (src/lambdas/ducklake_*/** and
  src/common/ducklake_*.py are push paths; Decisions 79/125/126). PR B carries the Decision 155 amendment, so its merge waits
  for Benjamin's explicit word (always-ask: Decision text). LAMBDA-DEPLOY DEFERRED for data-pipeline: manifest excludes only.
acceptance_criteria:
- >-
  No request that reaches the telemetry writer, reader or ops writer handler answers 502: an exception no row maps answers
  500 {ok: false, error_type: unmapped, error_class, request_id, action, elapsed_ms} with no exception message, and one
  ducklake_unmapped_error log line carries the class, request id, frames and the redacted, truncated message.
- >-
  A dead catalog connection that fails at connect or survives the reopen-once answers a typed 503 catalog_unavailable; the
  reader and writer clients retry it, and the Decision 155 classifier treats it (and only it among error_type-bearing
  failures) as transient.
- >-
  A reader named verb whose bound value or error() guard raises a caller-input DuckDB class answers 400 named_read_input with
  the DuckDB message (live: recs_related with 201 exclude_ids answers 400 naming "narrow the query"); the client raises it
  after one POST. Every other DuckDB class answers 500 unmapped with the class name only.
- An unparseable or non-object body answers 400 bad_request on all three serving functions.
- >-
  Both writers' errors alarms sum AWS/Lambda Errors and Url5xxCount with FILL(..., 0), threshold > 0 over 900 s, and the
  applied alarms read back with that expression.
- >-
  A failing --lambda-telemetry vector prints error_class and request_id, never a message, ARN or account id.
- >-
  The plan 3 part 2 and blob-route plans no longer assume a raise-to-502 or Errors-only zero check; Decision 155 carries the
  dated catalog_unavailable amendment; the three contracts declare the typed answers.
- >-
  rec-4282 is closed by PR B's Resolves trailer; rec-4294 (escape-classified) is closed through the verdict-bound manual
  route once its acceptance holds on PR B's merge commit.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The helper answers typed 500 and 503 bodies, never the message, and logs one redacted line; the contracts declare the answers.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_handler_errors.py::test_unmapped_is_a_typed_500_with_class_and_request_id_only
    tests/test_ducklake_handler_errors.py::test_unmapped_body_never_carries_the_message
    tests/test_ducklake_handler_errors.py::test_log_line_redacts_truncates_and_keeps_the_first_line
    tests/test_ducklake_handler_errors.py::test_log_line_frames_carry_no_locals_and_name_the_chain
    tests/test_ducklake_handler_errors.py::test_dead_connection_is_a_typed_503
    tests/test_ducklake_handler_errors.py::test_action_is_registered_or_unknown
    tests/test_ducklake_handler_errors.py::test_serving_contracts_declare_the_terminal_answers -q
  expected: Exit 0, every node passes. Red before because the module and nodes are absent.
  fix_if: A message, password, s3 path or ARN in a body is a helper bug; fix redaction or the body builder, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ducklake-handler-errors-helper
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The telemetry writer never lets an exception escape and never echoes its message.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_unexpected_exception_is_a_typed_500
    tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_unmapped_answer_never_echoes_the_message
    tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_dead_connection_at_connect_is_503
    tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_request_id_comes_from_the_lambda_context
    tests/lambdas/ducklake_telemetry_writer/test_handler.py::test_runtime_error_is_500 -q
  expected: Exit 0, every node passes. Red before because the new nodes are absent and the handler re-raises.
  fix_if: A KeyError escaping means the terminal branch was not reached; a mapped row answering unmapped means precedence is wrong.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-writer-never-502
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: The reader answers typed 400/500/503 for caller-input DuckDB errors, unmapped errors, dead connections and bad bodies; the client does not retry the 400 or 500.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_reader_handler.py::test_invocation_line_on_unparseable_body
    tests/test_ducklake_reader_handler.py::test_non_object_body_is_400
    tests/test_ducklake_reader_handler.py::test_named_read_caller_input_error_is_400_with_its_message
    tests/test_ducklake_reader_handler.py::test_named_read_other_duckdb_error_is_unmapped_500
    tests/test_ducklake_reader_handler.py::test_dead_connection_after_reopen_is_503
    tests/test_ducklake_reader_handler.py::test_handler_non_dead_error_does_not_reopen
    tests/common/ducklake_reader_client/test_named_read_errors.py::test_named_read_input_raises_after_one_post
    tests/common/ducklake_reader_client/test_named_read_errors.py::test_unmapped_500_raises_after_one_post
    tests/common/ducklake_reader_client/test_named_read_errors.py::test_catalog_unavailable_is_retried -q
  expected: Exit 0, every node passes. Red before because the nodes are absent and the unparseable-body test expects a raise.
  fix_if: A caller-input class answering 500, or the reopen-once no longer firing on a dead connection, is a handler ordering bug.
  hermetic: true
  graduation: graduate
  graduation_check_id: reader-typed-terminal-errors
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: With real DuckDB classes, a CAST failure on a bound value and an error() guard classify as named_read_input.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_reader_handler.py::test_real_duckdb_caller_input_errors_are_400 -q -rs
  expected: Exit 0 with the node passing, not skipped, in the full venv (duckdb present).
  fix_if: A real class missing from the caller-input set means the class list drifted from the pinned duckdb; update it from config/lambda/ducklake/version.yaml's version.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The node needs duckdb, which requirements-fast.txt excludes (heavy-exclusion, Decision 104), so venv-less replay would
