schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ducklake-typed-unmapped-errors
intent: >-
  Resolve rec-4294 (Critical, ci-rca) and rec-4282: an exception that no error-map row recognises must never reach a DuckLake
  serving Function URL as the runtime's untyped 502. The three URL-only serving functions (telemetry writer, reader, ops
  writer) answer an unmapped exception with a typed 500 `unmapped` carrying only the exception class and the Lambda request id,
  a dead catalog connection with a typed retryable 503 `catalog_unavailable`, an unparseable body with a 400 `bad_request`,
  and (reader) a caller-input DuckDB error inside a named verb with a 400 `named_read_input` carrying the DuckDB message. Paging
  survives the change because both writers' errors alarms sum AWS/Lambda Errors and Url5xxCount. Telemetry is the platform's
  learning signal (PROJECT_CONTEXT); a post-deploy gate that reports `error_type=none` teaches nothing.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-typed-unmapped-errors.yaml
phase: >-
  ci_rca soft-warn exception category (rec-4294, the one open ci-rca rec; same file as its source_file). Touches the T2.36
  telemetry writer and the T2.19 reader and ops writer serving functions; closes no roadmap exit criterion.
scope:
- file: src/common/ducklake_handler_errors.py
  action: Create
  purpose: >-
    Leaf helper shared by the three serving handlers (imports only stdlib and src.common.ducklake_runtime's
    is_dead_connection_error; no import-time side effects). (1) unmapped(exc, *, function, action, request_id, elapsed_ms) ->
    tuple[int, dict]: status 500, body {ok: false, error_type: "unmapped", error_class: type(exc).__name__, request_id, action,
    elapsed_ms}; never str(exc). Before returning it prints ONE JSON line {event: "ducklake_unmapped_error", function, action,
    error_class, request_id, chain (class names of __cause__/__context__, at most 3), frames (the last 10 traceback frames as
    "path:function:line", no locals), message: redact(str(exc))}. (2) catalog_unavailable(exc, *, function, action,
    request_id, reopened) -> tuple[int, dict]: status 503, body {ok: false, error_type: "catalog_unavailable", error_class,
    request_id, action, reopened}; logs the same line shape with event "ducklake_catalog_unavailable". (3) terminal(exc, ...)
    dispatching between the two on rt.is_dead_connection_error(exc). (3b) TRANSIENT_ERROR_TYPES = frozenset({"catalog_unavailable"}),
    the authority the Decision 155 classifier's literal is asserted equal to. (4) redact(text) -> str: replaces password=VALUE,
    X-Amz-*=VALUE, arn:... tokens and any run of 12 or more digits with a fixed marker, keeps the first line only and
    truncates to 300 characters. (5) bad_request(function, action) -> tuple[int, dict]: 400 {ok: false, error_type:
    "bad_request", error: "request body is not a JSON object"}. `action` is always a registered action name or the token
    "unknown", never the caller's string (the log_invocation rule, src/common/ducklake_metrics.py:71-76).
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Modify
  purpose: >-
    The terminal `raise` at handler.py:211 becomes the helper's terminal answer: a dead-connection error (at _warm_connection
    or mid-verb) answers 503 catalog_unavailable (reopened false; no reopen-once is added), anything else 500 unmapped, with
    request_id from context.aws_request_id (None when context is None) and the dispatched action or "unknown". Every mapped
    row is unchanged and keeps precedence. The docstring's "unmapped errors propagate" is replaced.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    (1) handler(): a body that json.loads refuses (ValueError, RecursionError) or that is not a JSON object answers 400
    bad_request before dispatch; the invocation line logs status 400. (2) One outermost terminal except in handler() covering
    parse, _handle and _guard_response_size: rt.is_dead_connection_error -> 503 catalog_unavailable (reopened true when it
    survived the reopen-once at handler.py:336-343), anything else -> 500 unmapped; the invocation line logs the answered
    status. (3) action_named_read: an exception from rt.named_read that is not a dead-connection error, not a
    DuckLakeRuntimeError and whose class is one of InvalidInputException, ConversionException, OutOfRangeException or
    TypeMismatchException from the duckdb/_duckdb module (the classes a bound value or a registry error() guard raises) is
    raised as a NamedReadInputError and answered
    400 {ok: false, error_type: "named_read_input", verb, error_class, error: the first line of the DuckDB message truncated to
    300 characters}; every other DuckDB class falls through to 500 unmapped (class name only: BinderException and
    ParserException mean registry-versus-schema drift, since callers send no SQL (Decision 84 I-3), and IOException,
    CatalogException, HTTPException and the rest carry URLs, hosts and paths). The dead-connection check stays first so the reopen-once path is
    unchanged. The "Any non-connection error still propagates (Decision 55)" comment is reworded to the new terminal posture.
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: >-
    Same posture as the reader: 400 bad_request for an unparseable or non-object body; one outermost terminal except in
    handler(): dead connection (at connect, or surviving the reopen-once at handler.py:320-327) -> 503 catalog_unavailable,
    anything else -> 500 unmapped; the invocation line logs the answered status. Every typed row (422/409/400/503/500) is
    unchanged. This makes docs/contracts/ducklake_writer.yaml:166 ("every failure maps to a typed 4xx/5xx") true.
- file: src/lambdas/ducklake_telemetry_writer/manifest.yaml
  action: Modify
  purpose: includes += src/common/ducklake_handler_errors.py.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: includes += src/common/ducklake_handler_errors.py.
- file: src/lambdas/ducklake_writer/manifest.yaml
  action: Modify
  purpose: includes += src/common/ducklake_handler_errors.py.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: >-
    excludes += src/common/ducklake_handler_errors.py (the wildcard src/ include would otherwise bundle it). Manifest only, zip
    contents unchanged (the part 1 precedent; Decision 79).
- file: scripts/ops_portal/reader_transient.py
  action: Modify
  purpose: >-
    Decision 155 classifier: a module constant _TRANSIENT_ERROR_TYPES = frozenset({"catalog_unavailable"}), a literal kept
    in scripts/ (the module's own reason for not living in src/) and asserted equal to the helper's exported
    TRANSIENT_ERROR_TYPES by a parity test, the same shape as its status-set parity (Decision 155 cl.2 "asserted equal
    rather than restated"). is_reader_unavailable also returns True for an HTTP 503 failure whose error_type is in that set
    (read from the exception's parsed `body` when it has one, else from the message text); every other error_type-bearing
    failure still gates, and the status set stays derived from the reader's own _READER_TRANSIENT_STATUS. The docstring
    names the allow-list and its four consumers (scripts/ops_portal/decisions.py DCG-03 guard, scripts/data_quality_execute.py,
    and the two scripts/preflight/ci_rca_gauges.py sites).
- file: scripts/ducklake_smoke/lambda_telemetry_gates.py
  action: Modify
  purpose: >-
    Failure-text helpers only (_error_type, _expect_ok, _fail callers that print error_type): a failing response also prints
    error_class and request_id from the JSON body, or for a body-less response the x-amzn-RequestId header, as
    "error_class=X request_id=Y" ("none" when absent). The module docstring's allowed-fields sentence gains "an exception
    class name or a request id". No vector, _check_provision or other gate logic changes (the writer grant fix thread edits
    those).
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    aws_cloudwatch_metric_alarm.ducklake_telemetry_writer_errors keeps its name, threshold > 0, one evaluation period,
    notBreaching, SNS actions and tags, and replaces metric_name/namespace/period/statistic/dimensions with three metric_query
    blocks: m1 AWS/Lambda Errors Sum 900 s, m2 AWS/Lambda Url5xxCount Sum 900 s (both FunctionName = the function), e1
    expression "FILL(m1, 0) + FILL(m2, 0)" with return_data true. alarm_description names both metrics and this plan.
    Non-IAM, in-place update; auto-applies through terraform-apply-sandbox.
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: >-
    The same metric-math change on aws_cloudwatch_metric_alarm.ducklake_writer_errors (Decision 84 I-4 rationale comment kept,
    extended with one line on why Url5xxCount is summed). No other resource changes.
- file: docs/contracts/ducklake_telemetry_writer.yaml
  action: Modify
  purpose: >-
    Every verb's typed_errors gains unmapped (500); the connectionful verbs also gain catalog_unavailable (503); the 500 and
    503 response_codes strings name them. audit_invariants gains: "No request that reaches the handler answers the Function
    URL's 502: an exception no row maps answers 500 unmapped {error_class, request_id, action}, never its message; a dead
    catalog connection answers 503 catalog_unavailable. Enforced by tests/lambdas/ducklake_telemetry_writer/test_handler.py
    (test_unexpected_exception_is_a_typed_500, test_unmapped_answer_never_echoes_the_message) and live by the post-deploy
    no-escaped-traceback check; process-level failures (timeout, out of memory, runtime exit) remain the runtime's 502 and
    count in Errors." and the declared residual: "The ducklake_unmapped_error log line
    carries the exception message redacted and truncated to 300 characters, so a request value inside an unmapped exception's
    message can reach the log (residual against the rejected-string rule; strictly less than the runtime traceback it
    replaces)." amendment_log: one field_add entry (semantic_break false; migration: the untyped 502 becomes typed;
    clients never retried it as anything but transient).
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    named_read gains 400 named_read_input (caller-input DuckDB classes, the DuckDB message) and every verb's 500 names
    unmapped; connectionful verbs gain 503 catalog_unavailable; the dispatcher-level invariant names 400 bad_request for an
    unparseable body. The "client-input errors surface as DuckLakeRuntimeError -> 500" invariant (ducklake_reader.yaml:140) is
    amended to name named_read_input as the second 4xx verb outcome. A "no request that reaches the handler answers 502"
    invariant names its enforcing tests (tests/test_ducklake_reader_handler.py nodes of VP step 3) and the process-level
    residual (rec-4296 owns the reader's Runtime.ExitError exits). amendment_log: one field_add entry.
- file: docs/contracts/ducklake_writer.yaml
  action: Modify
  purpose: >-
    Every verb's 500 names unmapped, connectionful verbs gain 503 catalog_unavailable, the dispatcher-level unknown-action
    invariant gains the 400 bad_request body case; the loud-fail invariant at :166 cites the terminal answer and its enforcing
    tests (tests/lambdas/ducklake_writer/handler/test_envelope_dispatch.py nodes of VP step 5). The async DuckLake handlers'
    residual (maintenance, maintenance_smoke, catalog_dr) is named in each serving contract's invariant with its owner,
    rec-4303. amendment_log: one field_add entry.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    One dated, source-cited blockquote amendment on its own line under Decision 155 (amendment_forms dated_amendment shape,
    Decision 177 append-only; mints no new number; precedent: the 2026-10-12 annotation on Decision 215). Content: (a) the
    Decision 167 routing answer: this preserves clause 2's intent (a reader outage is transient, a reader defect gates) under a
    new wire shape, rather than adding a carve-out: the same catalog outage that arrived as an untyped 502 now arrives as a
    typed 503 catalog_unavailable, and deterministic defects that used to arrive as the same 502 (and were wrongly classified
    transient) now arrive as a typed 500 unmapped and gate; no new call site is licensed and clause 3 is untouched. (b) The
    four consumers the classifier reaches, by path. (c) The allow-list is scripts/ops_portal/reader_transient.py's
    _TRANSIENT_ERROR_TYPES, asserted equal to src/common/ducklake_handler_errors.py's TRANSIENT_ERROR_TYPES, with a test that
    every other error_type the three serving contracts declare still gates.
- file: docs/decisions-index.json
