constraints:
- Never return or print an exception message in a response body or smoke output (Decision 101; ATTACH errors embed the libpq password, src/common/ducklake_runtime.py libpq_conninfo).
- "No catch-and-relax (Decision 55): every terminal answer is a non-2xx typed response plus one structured log line, and both writers' alarms still page on it."
- The dead-connection check stays ahead of every other classification so the reopen-once paths are unchanged.
- Async DuckLake handlers (maintenance, maintenance_smoke, catalog_dr) are out of scope (EventBridge-invoked; an escaped exception drives Lambda's own retries); rec-4303 owns them.
- No module-import side effects; no new IAM; no workflow change; no edit to telemetry_actions.py, ducklake_telemetry_provision.py or any gate vector (the Writer grant fix owns them).
- No rescue agents or workaround loops (Decision 55); a red post-deploy step is root-caused, never re-run to green.
