schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-role-iam-change-alarms"
intent: >-
  Resolve rec-4044: land a state-free detective control that emails the operator whenever anyone
  changes -- or is denied changing -- IAM on PlatformDev or PlatformAdmin, proven by a live fire
  before the rec closes, so rec-3838's Plan A (PLAN-platform-iam-bootstrap-adopt) can move the two
  most privileged identities out of hourly terraform-drift coverage without leaving them unwatched.
  Everything lives in Terraform and in the single project region variable (var.aws_region), with no
  second-region provider and no console step, because the repository is meant to ship as a tool
  whose users set exactly one AWS region.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-role-iam-change-alarms.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4044, the human-adjudicated HARD PREREQUISITE of
  PLAN-platform-iam-bootstrap-adopt (its step 10 gate). No tier_item criterion claimed. Adjacent:
  T2.48 (allow-list inversion; unaffected, bootstrap is outside CI) and T2.47 (terraform-drift.yml;
  no open criteria).
closes_criteria: []
scope:
  - file: terraform/bootstrap/platform_security_admin_policy.tf
    action: Create
    purpose: >-
      PlatformAdmin's detector-management grants as a NEW customer-managed policy
      (aws_iam_policy.platform_security_admin, name platform-security-detector-admin) attached to
      PlatformAdmin by aws_iam_role_policy_attachment.platform_security_admin (role = "PlatformAdmin"
      literal: this root does not declare the role until Plan A). The document is hoisted into
      local.platform_security_admin_policy_json with a <= 6144 B whitespace-stripped size
      precondition (validate_iam_policy_size; Decision 156 managed-policy remedy -- PlatformAdmin's
      inline aggregate has only ~2.2 KB of its 10,240 B per-role headroom left). Five Sids, every ARN
      built from var.aws_region / var.account_id: PlatformSecurityTrailManage = exactly
      cloudtrail:CreateTrail, UpdateTrail, PutEventSelectors, StartLogging, AddTags, RemoveTags on the
      ONE trail ARN (trail/platform-security-trail); PlatformSecurityTrailRead = enumerated cloudtrail
      read verbs (GetTrail, GetTrailStatus, DescribeTrails, GetEventSelectors, GetInsightSelectors,
      ListTags) on "*"; PlatformSecurityTrailBucketManage = the S3 create/configure/refresh-read set
      the provider needs on the trail bucket only (no s3:DeleteBucket, no s3:DeleteBucketPolicy);
      PlatformSecurityLogGroupManage = logs create/retention/tag/metric-filter verbs on
      log-group:platform-security-* only (no logs:DeleteLogGroup); PlatformSecurityLogsRead =
      logs:DescribeMetricFilters and logs:TestMetricFilter on "*". CloudWatch alarm verbs are NOT
      re-granted (AdminOps' CloudWatchAlarmManagement already covers alarm:*). No cloudtrail
      StopLogging, DeleteTrail, Delete*/Stop* wildcard or cloudtrail:* anywhere.
  - file: terraform/bootstrap/platform_security_trail.tf
    action: Create
    purpose: >-
      The event source, all keyed to var.aws_region / var.account_id (no region or account literal,
      no provider alias): aws_s3_bucket.platform_security_trail
      (platform-security-trail-<account_id>-<aws_region>, force_destroy false, prevent_destroy) with
      versioning Enabled, all four public-access-block flags, SSE-S3 default encryption,
      BucketOwnerEnforced ownership, a lifecycle rule expiring current objects after 400 days and
      noncurrent versions after 30, and a bucket policy allowing only cloudtrail.amazonaws.com
      (GetBucketAcl; PutObject under AWSLogs/<account_id>/ with bucket-owner-full-control), both
      conditioned on aws:SourceArn = the trail ARN, plus a DenyInsecureTransport statement;
      aws_cloudwatch_log_group.platform_security_trail (platform-security-cloudtrail, 30-day
      retention, prevent_destroy -- S3 is the 400-day authoritative copy);
      aws_iam_role.platform_security_trail_logs (platform-security-cloudtrail-logs, trusted by
      cloudtrail.amazonaws.com with an aws:SourceArn condition) and its inline policy
      (logs:CreateLogStream + logs:PutLogEvents on that log group's streams only), hoisted into a local
      with the <= 10240 B size precondition; aws_cloudtrail.platform_security (platform-security-trail,
      is_multi_region_trail true, include_global_service_events true, enable_log_file_validation true,
      enable_logging true, one event_selector read_write_type All with management events,
      cloud_watch_logs_group_arn "<log group arn>:*", depends_on the bucket policy, prevent_destroy).
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Create
    purpose: >-
      Five aws_cloudwatch_log_metric_filter + aws_cloudwatch_metric_alarm pairs on the trail's log
      group, metric namespace PlatformSecurity, every alarm's alarm_actions = the EXISTING
      agent-platform-alerts topic ARN built as arn:aws:sns:${var.aws_region}:${var.account_id}:agent-platform-alerts
      (Decision 39; the topic stays in terraform/personal). Patterns live in one
      local.platform_security_filter_patterns map keyed by alarm name, so the ADMIN TestMetricFilter
      step can read them through terraform console:
      (1) platform-security-platform-role-iam-change -- iam.amazonaws.com, readOnly false, and either
      requestParameters.roleName matching PlatformDev or PlatformAdmin CASE-INSENSITIVELY (IAM role
      names are case-insensitive in API calls, so an exact match is evadable), or a policy-version /
      policy-delete verb whose policyArn is the agent-platform-github-ci-apply-boundary or the
      platform-security-detector-admin policy (content edits to policies attached to the roles carry
      no roleName); denied attempts included;
      (2) platform-security-denied-iam-write -- iam.amazonaws.com, readOnly false, errorCode
      AccessDenied*, any role;
      (3) platform-security-detector-tamper -- any mutating cloudtrail.amazonaws.com call, or a
      mutating iam/logs/monitoring/s3 call naming a platform-security-* role, log group, alarm or the
      trail bucket;
      (4) platform-security-alerts-topic-change -- a mutating sns.amazonaws.com call whose topicArn or
      subscriptionArn is the agent-platform-alerts topic;
      (5) platform-security-iam-event-heartbeat -- ANY iam.amazonaws.com event (reads included; the
      hourly terraform-drift refresh reads both roles), alarm LessThanThreshold 1 over three 3600 s
      periods with treat_missing_data = breaching and ok_actions to the same topic. Because IAM events
      reach this London-homed trail only through its multi-region/global-events path, this proves the
      exact input the other alarms depend on is alive, and fires on StopLogging, DeleteTrail, a
      multi-region or global-events flip, an event-selector change or a broken Logs delivery.
      Event alarms (1)-(4): Sum >= 1 over one 300 s period, treat_missing_data notBreaching. Every
      alarm_description names the log group and a CloudWatch Logs Insights query (fields eventTime,
      userIdentity.arn, eventName, requestParameters.roleName, errorCode, eventID) plus a console link
      built from var.aws_region, so the email says where to read who changed what.
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Create
    purpose: >-
      Sanitised sample CloudTrail events (account id rendered as the literal ACCOUNT -- never twelve
      digits, the never-commit hook) with, per event, the exact set of filter names it must match: a
      lowercase platformadmin UpdateRole, a PlatformDev TagRole denied with AccessDenied, a
      CreatePolicyVersion on the boundary policy, a StopLogging, a PutMetricFilter on the
      platform-security-cloudtrail log group, an Unsubscribe on an agent-platform-alerts subscription,
      an iam GetRole read (heartbeat only), and an UpdateRole on an unrelated agent-platform-* role
      (heartbeat only -- must NOT match filter 1). Read by the unit test (fixture shape, coverage of all
      five filters) and by the ADMIN TestMetricFilter step (live evaluation).
  - file: tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
    action: Create
    purpose: >-
      rec-4044's own acceptance path. TestPlatformRoleIamChangeDetector (graduated): the trail is
      multi-region, includes global service events, validates log files, logs All management
      events, delivers to the log group and carries prevent_destroy; the bucket has versioning,
      all four public-access-block flags, SSE, the 400-day expiry, prevent_destroy and a bucket policy
      whose only Allow principal is cloudtrail.amazonaws.com with aws:SourceArn; exactly the five
      named alarms exist, each alarm_actions is the alerts-topic ARN template and the heartbeat alarm
      is LessThanThreshold with treat_missing_data breaching and three evaluation periods; every
      filter pattern carries its required clauses (case-insensitive two-role roleName match, the two
      policyArn names, errorCode AccessDenied, cloudtrail mutation, platform-security names, alerts
      topic, bare iam eventSource) and the fixture names every filter at least once; every detector
      resource name starts platform-security-; the three new .tf files contain no region literal
      (e.g. eu-west-2, us-east-1), no provider block and no provider alias; and no CI identity
      statement (terraform/bootstrap github_ci_apply inline and reads documents, terraform/personal
      oidc*.tf CI roles) grants a mutating logs, cloudwatch, cloudtrail, s3 or iam verb on a resource
      pattern that matches a platform-security-* name or the trail bucket, reusing the brace-depth
      helpers in scripts/checks/iam_tf/_read_coverage.py (not edited). Red cases for each assertion.
  - file: tests/checks/iam_tf/test_cloudtrail_write_grant_scoped.py
    action: Create
    purpose: >-
      TestCloudTrailWriteGrantScoped (graduated; REPLACES the retired
      cloudtrail-read-only-no-write-verbs claim, path-independent so it survives Plan A): across
      every *.tf under terraform/, (a) quoted "cloudtrail:LookupEvents" is still granted somewhere
      (the retired check's positive half, now root-agnostic); (b) the only quoted cloudtrail verbs
      that are not Get*/Describe*/List*/LookupEvents sit in exactly one statement, Sid
      PlatformSecurityTrailManage, whose Action set EQUALS {CreateTrail, UpdateTrail,
      PutEventSelectors, StartLogging, AddTags, RemoveTags} and whose Resource is the single
      trail/platform-security-trail ARN template; (c) that statement's policy is attached only to
      PlatformAdmin; (d) cloudtrail:StopLogging, cloudtrail:DeleteTrail, cloudtrail:* and any
      cloudtrail Delete*/Stop*/Put*/Update*/Create* wildcard appear nowhere. Red cases: an extra verb
      in the Sid, a second statement granting CreateTrail, StopLogging anywhere, cloudtrail:* on
      PlatformAdmin, the Sid attached to PlatformDev, a Resource of "*", and LookupEvents removed.
  - file: config/agent/verification_registry/entries/cloudtrail-read-only-no-write-verbs.yaml
    action: Delete
    purpose: >-
      Retired by git mv (Decision 176 point 5; check_id is immutable and its claim -- no CloudTrail
      write verb anywhere under terraform/ -- is deliberately narrowed by the new Decision, so an
      in-place edit is forbidden and would pass at origin/main, i.e. tautological).
  - file: config/agent/verification_registry/entries/deprecated/cloudtrail-read-only-no-write-verbs.yaml
    action: Create
    purpose: the git mv destination of the retired shard, byte-identical content (no status key)
  - file: config/agent/verification_registry/entries/cloudtrail-write-grant-scoped-to-platform-trail.yaml
    action: Create
    purpose: graduate TestCloudTrailWriteGrantScoped (test_selector, class-level node id) under this plan's slug
  - file: config/agent/verification_registry/entries/platform-role-iam-change-detector-declared.yaml
    action: Create
    purpose: graduate TestPlatformRoleIamChangeDetector (test_selector, class-level node id) under this plan's slug
  - file: scripts/ci/security_detector_probe.py
    action: Create
    purpose: >-
      Read-only second channel (not SNS), a pure-Python module under 500 SLOC (Decision 128) with a
      thin CLI. check() reads, via boto3 in var-free fashion (region from AWS_DEFAULT_REGION): the five
      platform-security-* alarms by name (cloudwatch:DescribeAlarms) and the alerts topic's
      subscriptions (sns:ListSubscriptionsByTopic, topic ARN built from the caller's account and
      region); it returns a failure list when any expected alarm is missing, has ActionsEnabled false,
      lacks the alerts topic in AlarmActions, when the heartbeat alarm's StateValue is not OK, or when
      no email subscription is confirmed (SubscriptionArn PendingConfirmation). It never prints or
      returns a subscription Endpoint (Actions logs are public, Decision 101). --file-on-transition
      files ONE High rec through scripts.ops_data_portal file_rec (source security_detector_stale)
      only when the previous completed scheduled run's security-detector-liveness job concluded
      success or no previous run exists, read from the GitHub REST API with GITHUB_TOKEN; if that
      lookup fails it files anyway (noise over silence). Exit 1 whenever check() fails, whether or not
      a rec was filed. --profile selects a local AWS profile (ADMIN runs); --subscription-only runs
      just the subscription leg (the pre-apply check, before the alarms exist). The expected alarm names are a module constant pinned to the HCL by the test.
  - file: tests/test_security_detector_probe.py
    action: Create
    purpose: >-
      TestSecurityDetectorProbe (graduated): stubbed boto3 clients -- healthy fixture returns no
      failures; each failure class (alarm missing, actions disabled, wrong topic, heartbeat ALARM,
      heartbeat INSUFFICIENT_DATA, subscription pending, no subscription) is reported; no rendered
      output ever contains the stub subscription Endpoint; the transition rule files on
      previous-success, on no previous run and on API error, and does not file on previous-failure;
      main() exits 1 on any failure; and the module's expected alarm-name constant equals the set of
      aws_cloudwatch_metric_alarm names parsed from terraform/bootstrap/platform_security_alarms.tf.
  - file: config/agent/verification_registry/entries/security-detector-probe-fails-closed.yaml
    action: Create
    purpose: graduate TestSecurityDetectorProbe (test_selector, class-level node id) under this plan's slug
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      Add job security-detector-liveness (independent of drift-detect; permissions id-token write,
      contents read, actions read): assume agent-platform-github-ci-planner with the reserved
      session name (the planner's main-sub trust accepts no other; the name is hoisted to one
      workflow-level env value used by both jobs, so terraform/personal/oidc.tf's four coupled sites
      stay four), with continue-on-error plus the Decision 172 fail-loud outcome guard
      (validate_oidc_failopen_guards), the venv install step (validate_workflow_dependency_install),
      then one thin run: line calling bin/venv-python -m scripts.ci.security_detector_probe
      --file-on-transition (Decision 162). No terraform, no tfvars, no convergence-record read or
      write, no second grep -qE line (tests/test_terraform_drift_acceptance.py pins exactly one), and
      drift-detect is byte-unchanged apart from the env reference.
  - file: tests/test_terraform_drift_acceptance.py
    action: Modify
    purpose: >-
      Add test_security_detector_liveness_job_is_read_only_probe: the job exists, assumes the
      planner with the workflow-level reserved-session env value, has the outcome guard, runs
      scripts.ci.security_detector_probe --file-on-transition, never mentions terraform,
      CONVERGENCE_KEY or materialise-tfvars, and declares actions read; and that drift-detect still
      resolves the same session name. Existing tests stay green unchanged.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: r3_workflows ceilings for the new job's inline run bodies, equal to their measured counts (Decision 162 R3)
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Register canonical_id security_detector_stale (description, signal_interpretation: one rec per
      healthy-to-unhealthy transition of the detector liveness probe). Distinct from tf_drift so
      Decision 190 clause 5's convergence gap check can never be satisfied by it.
  - file: terraform/personal/platform_admin_policies.tf
    action: Modify
    purpose: >-
      Comment-only: the ObservabilityMetricAndTrailRead comment's "grants no cloudtrail mutating verb
      anywhere" becomes false; restate it as "no cloudtrail mutating verb outside the Decision 202
      PlatformSecurityTrailManage grant". No statement changes, so the speculative plan is empty and
      Plan A's AdminOps copy is unaffected.
  - file: terraform/bootstrap/CLAUDE.md
    action: Modify
    purpose: >-
      One pointer line only (104 B of headroom under its 5151 B prose budget): this root also owns
      the platform-security-* IAM-change detector (Decision 202). Trim elsewhere if needed; never
      raise the budget.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Add Decision 202 (header "## Decision 202: Terraform-owned CloudTrail trail and IAM-change
      detector in the admin-only bootstrap root -- a narrow PlatformAdmin trail-write grant, the
      platform-security-* name family, and a single-region rule (amends Decision 101 point (b), 144
      clause 2) (Decided)"), within the 6,144 B per-entry norm (Decision 167), with the fenced yaml
      envelope (number 202, status Decided, decided_date 2026-09-25, amends [101, 144], significance
      numbered_decision; justification names verification-registry.yaml's governance notes and
      environment-taxonomy.yaml as the rejected contract homes -- they record check lifecycle and apply
      classification, not a new authority grant to a principal with reversal conditions -- and
      rejects an amendment_forms annotation on Decision 101 because the grant and region rule clear
      the bar independently). Clauses: (1) Terraform owns one multi-region trail homed in the project
      region, in terraform/bootstrap, applied only by PlatformAdmin under the human-gated admin tier
      (Decision 126), because the detector must sit outside the reach of the principals it watches;
      (2) PlatformAdmin -- and only PlatformAdmin -- holds exactly six trail-management verbs on that
      one trail ARN; StopLogging, DeleteTrail and cloudtrail:* stay banned everywhere, and destroying
      the trail is break-glass only; (3) platform-security-* is authorised as a second resource name
      family for detector resources only (the separate explicit decision Decision 101 point (b)
      requires), and Decision 144 clause 2's re-narrow trigger does NOT fire for it: the non-prefix
      name is a deliberate exclusion from CI reach, not a coverage gap; (4) single-region rule: every
      platform resource follows the one aws_region project variable -- no hardcoded region, no
      second-region provider -- so IAM events are detected via the multi-region trail's CloudWatch
      Logs delivery in that region, never an EventBridge rule in us-east-1; (5) residual stated, not
      implied: UpdateTrail and PutEventSelectors can still blind the trail -- the tamper alarm, the
      IAM-event heartbeat alarm and the hourly security-detector-liveness probe are its compensating
      controls; (6) rejected: AWS Config (its findings return through the same SNS path the probe
      must be independent of, misses denied attempts, adds recorder cost), a console-created trail
      (Decision 24), an EventBridge rule in us-east-1 (clause 4), and AdminOps inline statements
      (Decision 156 headroom). It attaches a policy to PlatformAdmin only and does not re-decide
      Decision 180 clause 6; sanctioned CI metadata writes on PlatformDev (Decision 180 clause 2)
      will email until rec-4049 lands, by design -- alerts are never filtered by actor. Reversal
      conditions and a Related line (24, 39, 101, 113, 126, 144, 156, 162, 176, 180, 181, 190, 201).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Governance note plus amendment_log entry: cloudtrail-read-only-no-write-verbs RETIRED by git mv
      and its claim NARROWED under Decision 202 (Decision 181 -- a Decision-authorised re-decision,
      not a weakening to obtain green), replaced by cloudtrail-write-grant-scoped-to-platform-trail,
      which keys on the Sid rather than a path so Plan A's move needs no repoint.
  - file: docs/plans/PLAN-platform-iam-bootstrap-adopt.yaml
    action: Modify
    purpose: >-
      Scope amendment of the approved, unimplemented Plan A (its pre_implementation_checklist
      anticipates this: "rec-4044 must adjudicate that shard and may have edited or retired it"):
      remove the cloudtrail-read-only-no-write-verbs scope row, its step-3 command leg, its step-5
      file-list entry, its test_obligations row and that checklist item, and update the counts that
      name it ("five modified shards" becomes four, "four claim-preserving repoints" becomes three) in
      step 3, step 6, acceptance_criteria, the verification-registry.yaml scope purpose and rollback.
      Add one context line: the replacement check is path-independent and needs no repoint. Nothing
      else in Plan A changes; bin/venv-python -m scripts.roadmap.plan_document validates it.
bundled_recommendations: ["rec-4044"]
followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is NEVER auto-applied (terraform/bootstrap/CLAUDE.md, T2.23): every live step below runs in an ADMIN container under agent_platform_admin, from merged main, only after a human has reviewed the presented plan and explicitly directed the apply (Decisions 120 and 126). terraform/bootstrap is hashicorp-only, so init needs no provider mirror."
  - "No pre-merge apply and no split-apply: PlatformAdmin's new grant is a bootstrap-declared managed policy, so nothing in terraform/personal changes except one comment (empty speculative plan, no-op apply)."
  - "Two-phase post-merge bootstrap apply: phase 1 targets aws_iam_policy.platform_security_admin + aws_iam_role_policy_attachment.platform_security_admin (the grant must be live before the resources that need it; Decision 183 clause 4 targeted-apply precedent); phase 2 applies the detector. Phase 1 also grants the cloudtrail reads and logs:TestMetricFilter the pre-apply checks need."
  - "The alerts topic and its email subscription stay in terraform/personal; the detector references the topic ARN by template only (no cross-root reference). The subscription must already be confirmed (step 11)."
  - "Freeze from merge until step 17: no other terraform/bootstrap apply, or the unapplied detector would ride along unreviewed."
  - "The CI planner role needs NO new grant: it already holds cloudwatch Describe*/List* on *, sns Get*/List* on the alerts topic and sns:GetSubscriptionAttributes; the CI permissions boundary has no cloudtrail entry, which is why the probe reads alarm state, not trail status."
acceptance_criteria:
  - terraform/bootstrap declares a multi-region, global-events, log-file-validated CloudTrail trail homed in var.aws_region, its protected S3 bucket, a CloudWatch Logs group and delivery role, and five platform-security-* metric filters with alarms targeting the existing alerts topic, with no region literal and no provider alias
  - PlatformAdmin's only CloudTrail write authority is Sid PlatformSecurityTrailManage in a bootstrap managed policy -- exactly six verbs on one trail ARN -- and StopLogging, DeleteTrail and cloudtrail:* appear nowhere under terraform/
  - cloudtrail-read-only-no-write-verbs is retired to entries/deprecated/ and cloudtrail-write-grant-scoped-to-platform-trail, platform-role-iam-change-detector-declared and security-detector-probe-fails-closed are admitted by run_differential
  - Decision 202 records the grant, the platform-security-* family, the single-region rule and the blinding residual with its compensating controls
  - terraform-drift.yml runs a read-only security-detector-liveness job that fails on a missing, disabled or mis-targeted alarm, a non-OK heartbeat or an unconfirmed subscription, and files one security_detector_stale rec per transition
  - PLAN-platform-iam-bootstrap-adopt no longer repoints the retired shard and still validates
  - Every filter pattern, evaluated live by logs:TestMetricFilter, matches exactly the fixture's expected events, including the lowercase role name
  - After the two-phase admin apply, the trail is logging with fresh Logs delivery, all five alarms exist and are enabled, the heartbeat is OK and the probe exits 0 locally and in a dispatched terraform-drift run
  - A denied lowercase TagRole from PlatformDev and an unchanged-value UpdateRole on PlatformAdmin each raise their alarms and reach the email subscription, evidenced by eventIDs, alarm timestamps and the topic's delivered-notification metric
  - rec-4044 is closed through update_rec with a holds acceptance verdict keyed to the merge sha, with the live evidence in its resolution
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the detector is declared as specified -- trail, bucket, log delivery, five alarms, names, region-variable only, and out of every CI grant
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_platform_role_iam_change_alarms.py::TestPlatformRoleIamChangeDetector" -q
    expected: >-
      all tests pass, including a red case per assertion (single-region trail, global events off,
      missing prevent_destroy, a sixth or missing alarm, an alarm targeting another topic, heartbeat
      notBreaching, a filter missing its case-insensitive roleName or policyArn clause, a region
      literal, a provider alias, a CI statement writing log-group:platform-security-*); red before
      (the module does not exist), green after
    fix_if: a declaration diverges from the spec -- fix the HCL, never loosen an assertion (Decision 181)
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-role-iam-change-detector-declared
  - step: 2
    phase: pre-deploy
    action: the replacement CloudTrail-grant check holds and discriminates
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_cloudtrail_write_grant_scoped.py::TestCloudTrailWriteGrantScoped" -q
    expected: >-
      all tests pass, including red cases for an extra verb in PlatformSecurityTrailManage, a second
      statement granting CreateTrail, StopLogging anywhere, cloudtrail:* on PlatformAdmin, the policy
      attached to PlatformDev, a Resource of "*", and LookupEvents removed; red before (module absent),
      green after
    fix_if: the grant is wider than the six verbs on one ARN, or a write verb appears elsewhere
    hermetic: false
    graduation: graduate
    graduation_check_id: cloudtrail-write-grant-scoped-to-platform-trail
  - step: 3
    phase: pre-deploy
    action: the liveness probe fails closed, never leaks the subscription endpoint, and files once per transition
    command: bin/venv-python -m pytest "tests/test_security_detector_probe.py::TestSecurityDetectorProbe" -q
    expected: >-
      all tests pass -- every failure class reported, no Endpoint in any output, the transition rule
      (file on previous success, no previous run or API error; not on previous failure), exit 1 on
      failure, and the alarm-name constant equal to the HCL's alarm names; red before, green after
    fix_if: a failure class is silently healthy, the endpoint leaks, or the constant drifts from the HCL
    hermetic: false
    graduation: graduate
    graduation_check_id: security-detector-probe-fails-closed
  - step: 4
    phase: pre-deploy
    action: the workflow runs the probe as a read-only job and the existing drift pins still hold
    command: bin/venv-python -m pytest tests/test_terraform_drift_acceptance.py tests/test_materialise_tfvars_delegate.py tests/convergence_health/test_sensor_liveness.py -q
    expected: all pass, including the new test_security_detector_liveness_job_is_read_only_probe (red before -- the job does not exist)
    fix_if: the new job touches terraform or the convergence record, lacks the outcome guard, or an existing drift pin broke
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The durable probe behaviour is graduated by step 3; this step's new test pins workflow wiring
      in a module whose existing pins are not individually graduated, and the rest of the command
      re-runs existing suites as a regression net, which a registry row would only duplicate.
  - step: 5
    phase: pre-deploy
    action: the old shard is retired by move, not edited, and no live surface still names it
    command: |-
