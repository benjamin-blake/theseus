  - "Scout flags, decided with notice (2026-09-25): 144 WARN -- Decision 202 clause 3 names the re-narrow trigger and says it does not fire; 100 WARN -- clause 6 rejects AWS Config; 190 NOTE -- distinct source security_detector_stale; 181 NOTE -- retirement recorded as a Decision-authorised claim narrowing; 180 NOTE -- policy attachment only, clause 6 not re-decided, CI-caused emails accepted."
  - "gates: decision-scout=FLAGS_FOUND (re-run on the refined design, 2026-09-25); plan-critique=PENDING"
  - "Design provenance (2026-09-25, rec-4044 thread): Benjamin rejected a us-east-1 EventBridge + console-trail draft; a blind Fable consult independently chose a Terraform-owned London-homed trail in bootstrap with a narrow PlatformAdmin grant (/mnt/project-files/rec-4044/fable-consult.md); Benjamin chose the London-only CloudWatch Logs path and approved the outline (/mnt/project-files/rec-4044/plan-outline.md)."
  - "Refinements over the outline, decided with notice: PlatformAdmin's grant is a bootstrap managed policy, not AdminOps inline (PlatformAdmin's inline aggregate had ~2.2 KB headroom in the 10,240 B role limit, measured baseline 7575 B on 2026-09-13 plus T2.48; Decision 156's remedy), which also removes the pre-merge split-apply and its 2-hour window; the liveness probe reads an IAM-event heartbeat alarm instead of cloudtrail:GetTrailStatus, because the CI boundary's DataPlaneAllow has no cloudtrail entry (terraform/personal/platform_dev_policies.tf:101 notes the same) and the heartbeat observes the exact global-event path the alarms need."
  - "ci-rca deferral (Related-Work): rec-4057 (validate_test_coverage on rec_trailer_acceptance.py) is open and unrelated -- different file, decision and failure category; this plan is the human-adjudicated security prerequisite of Plan A and proceeds with this logged deferral."
  - "Cost (inferred, not measured): CloudTrail's first management-event copy is free; CloudWatch Logs ingestion of read+write management events from hourly terraform plans is on the order of a few GB a month (about 1-3 USD); 30-day retention; S3 400-day expiry."
  - "Why bootstrap: the detector must be out of reach of the principals it watches -- CI grants stop at agent-platform-*/ducklake-* names, and PlatformDev holds no logs/cloudwatch/cloudtrail/s3 write on these resources (step 1 asserts the CI half)."
  - "Probe transition rule mirrors drift's one-red-one-signal; a persistently red terraform-drift run is also caught by the loop_liveness_stale success leg (source_registry.yaml), which dedups per episode -- the backstop if the probe's own filing fails."
  - "IAM events are delivered only to trails that cover us-east-1; a multi-region trail homed in var.aws_region receives them and forwards all regions' events to its one Logs group, which is why no second-region resource exists."
  - "The PlatformDev out-of-band AgentPlatformRuntime inline policy (terraform/CLAUDE.md) is outside every root; filter 1 matches any change naming the role, so edits to it alert too."
  - "Plan A (PLAN-platform-iam-bootstrap-adopt) step 10 gates on rec-4044 closed; its bootstrap baseline plan (its step 9) needs this plan's apply to have landed first."
