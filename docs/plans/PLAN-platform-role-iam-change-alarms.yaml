constraints:
  - No rescue agents or workaround loops (Decision 55)
  - "Single region (Decision 202 clause 4, Benjamin 2026-09-25): every regional ARN and resource is keyed to var.aws_region; no region literal, no provider alias, no us-east-1 resource -- step 1 enforces it"
  - "No console or out-of-band infrastructure (Decision 24): the trail, bucket, log group, role, filters, alarms and PlatformAdmin's grant are all Terraform-managed in terraform/bootstrap"
  - Never grant cloudtrail:StopLogging, cloudtrail:DeleteTrail or cloudtrail:* to anyone, and never grant any CloudTrail write to a CI role or PlatformDev; never widen the CI permissions boundary for this plan
  - The bootstrap apply runs from merged main in an ADMIN container, in two targeted phases, each only after a human has reviewed the presented plan and explicitly directed it (Decision 126); no terraform/personal apply is performed by hand
  - "Public-repo boundary (Decision 101): plan renders, ARNs, account ids and the subscription email never reach chat, a PR, a commit or an Actions log; the probe never prints an Endpoint; the fixture uses the literal ACCOUNT"
  - "This PR's squash body carries NO `Resolves: rec-4044` trailer: the rec's own context requires a live fire proof, which exists only after the post-merge apply; closure is step 18's update_rec with a holds verdict record (Decision 201 point 2 manual route with a supplied record), never the unrecorded fallback"
  - Alerts are never filtered by actor -- CI's sanctioned PlatformDev metadata reconciles (Decision 180 clause 2) will email until rec-4049 lands, by design
  - The probe files under source security_detector_stale, never tf_drift (Decision 190 clause 5), and never reads or writes the convergence record
  - Retire the old shard by git mv only (100% rename) -- never edit it in place (Decision 176)
