pre_implementation_checklist:
  - Confirm `git branch --show-current` is the harness session branch, never main.
  - >-
    Re-read docs/contracts/contract-population.yaml's shape_grammar, evaluator_kinds and
    grandfather_only_forms before authoring the contract -- status `active` is closed at birth for
    a new file, and the evaluator must genuinely resolve.
  - >-
    Re-read docs/contracts/vp-red-before.yaml's hermetic_authoring and carrier_rule before editing
    any VP step. Do not add `rg` to a pre-deploy command and do not put a backtick literal in a
    hermetic step's `expected`.
  - >-
    Re-measure the three registries before writing any availability claim into the contract -- the
    2026-09-20 measurement in context is a point-in-time observation of third-party state.
  - All files in scope located and readable; acceptance criteria understood and verifiable.

execution_steps:
  - >-
    Author docs/contracts/package-registry-reservation.yaml. Class D `contract:` block: id and
    subject `package-registry-reservation`, class D, contract_version 1, status ratified with
    ratified_via naming this plan, and `evaluator: {agent_surface: AGENTS.md}`. Add a non-empty
    amendment_log with an initial-authoring entry.
  - >-
    Write the contract's `procedure:` body as an ordered per-registry operator walkthrough (PyPI,
    npm, crates.io). Tag every step HUMAN (browser signup, email verification, 2FA enrolment,
    token generation) or AGENT-RUNNABLE (availability check, placeholder build, post-claim probe),
    so a future session can read the file and walk the operator through it live.
  - >-
    Record in the contract: the anti-squatting posture and one-claim-per-registry rule; the npm
    `@ontheloop` scope as npm's sanctioned namespace mechanism; the neutral-placeholder content
    constraint; crates.io immutability (yank, never delete) and its GitHub-OAuth ownership coupling
    to rec-3905; the role-alias identity rule with the account-owner-should-differ recommendation;
    and that a claim is a defensive hold, never brand ratification.
  - >-
    Implement scripts/package_registry_probe.py. Model the per-registry result as three distinct
    states (claimed / unclaimed / unreachable), never a bool. Map 200 to claimed and 404 to
    unclaimed; map every other outcome -- non-2xx/404 status, timeout, connection error, malformed
    body -- to unreachable. Send a descriptive User-Agent carrying a contact string sourced from
    configuration with a neutral default (crates.io's crawler policy requires one). Support
    --require-claimed for a non-zero exit unless every target is claimed. Keep it under 500 SLOC
    and register no SLOC budget entry.
  - >-
    Write tests/test_package_registry_probe.py with mocked HTTP covering 200, 404, 403, timeout,
    connection error and malformed-body paths. Name the graduated case exactly
    test_unreachable_is_not_reported_as_unclaimed so VP step 5's selector resolves. Cover every
    branch -- a new file defaults to a 100-percent coverage threshold.
  - >-
    Add the file-router route (topic `package-registry-reservation`), add
    scripts/package_registry_probe.py to scripts_root_allowlist.allowed_files, and append the
    amendment_log entry. Do not touch contract-population.yaml's ratchet pins -- a new contract
    with a resolving evaluator and a non-`active` status lands in the `declared` bucket, which
    neither pin is bound to.
  - >-
    Add the AGENTS.md Safety-section pointer naming docs/contracts/package-registry-reservation.yaml
    verbatim. Keep it to one or two lines -- AGENTS.md is the S1 ambient load-set and every byte is
    paid on every turn (Decision 110).
  - >-
    Run VP steps 1-9 in order. Step 7 is a NEGATIVE assertion -- a non-empty result is a scope
    breach, not a test to work around. Step 10 is operator-only and is NOT run by the implementing
    agent.
  - >-
    Close by presenting the operator walkthrough in chat: the ordered HUMAN steps for all three
    registries, so the human can act on it immediately without re-reading the contract. Name
    rec-3941 as the tracking item. Do NOT add a Resolves: trailer -- rec-3941 stays open until the
    names are actually claimed, which this plan does not do.

rollback: >-
  Single-commit revert. Every change is additive: two new files, one new test, two additive
  registrations and a one-line AGENTS.md pointer. Nothing is deployed, no infrastructure or runtime
  behaviour changes, no warehouse row is written by the code changes, and no external registry
  state is touched. rec-3941 is a separate SCD2 append that survives a git revert by design -- if
  the plan is abandoned, close it through the portal rather than reverting anything in git.

implementation_declared: false
