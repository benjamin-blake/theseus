schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ontheloop-package-registries
intent: >-
  Hold the `ontheloop` distribution namespace on PyPI, npm and crates.io before it is taken, by
  authoring the operator procedure as a Class D contract and a credential-free probe that proves
  a claim landed. The platform's free tier IS this repository and must be installable (Decision
  184), so owning a distribution namespace serves the platform plane regardless of which external
  brand eventually ratifies. Claims nothing and publishes nothing itself.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ontheloop-package-registries.yaml
phase: >-
  No platform roadmap tier_item. Operator-identity work in the same class as rec-3905 (GitHub org
  + domain reservation), filed under the soft-warn exception category user_explicit_out_of_scope --
  the Tier Item Freshness Gate does not fire because no tier_item is claimed. RELATED (neither
  foreclosed nor duplicated): T2.54 clause-to-check traceability, T2.56 contract layering.

scope:
  - file: docs/contracts/package-registry-reservation.yaml
    action: Create
    purpose: >-
      Class D mechanism contract carrying the per-registry operator procedure, the anti-squatting
      posture, the neutral-placeholder constraint and the identity/ownership rules. Evaluator is
      {agent_surface: AGENTS.md}; no new check module is authored.
  - file: scripts/package_registry_probe.py
    action: Create
    purpose: >-
      Credential-free, read-only probe of the three registries' public metadata endpoints.
      Reports claimed / unclaimed / unreachable per registry and exits non-zero under
      --require-claimed unless every target is claimed. Deliberately NOT a registered presubmit
      check -- it makes live network calls.
  - file: tests/test_package_registry_probe.py
    action: Create
    purpose: >-
      Hermetic unit tests with mocked HTTP covering the 200 / 404 / 403 / timeout / malformed
      paths, including the load-bearing assertion that an unreachable registry is never reported
      as unclaimed. Decision 131 mirror path for the module above.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Register the contract route (topic equals subject), add scripts/package_registry_probe.py
      to scripts_root_allowlist.allowed_files, and append the amendment_log entry
      validate_contract_drift requires.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      One-line Safety-section pointer naming the contract file. Load-bearing, not cosmetic: the
      agent_surface evaluator resolves only if AGENTS.md's text contains the contract basename.
  - file: docs/plans/PLAN-ontheloop-package-registries.yaml
    action: Create
    purpose: This plan artefact.

bundled_recommendations: []
followon_recs:
  - rec-3941
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    docs/contracts/package-registry-reservation.yaml exists carrying a Class D `contract:` block
    with class D, subject `package-registry-reservation`, a resolving
    `evaluator: {agent_surface: AGENTS.md}`, a non-`active` status (closed at birth for a new
    file per contract-population.yaml grandfather_only_forms) and a non-empty amendment_log.
    Proven by VP step 1 and, authoritatively, by validate_contract_drift in VP steps 8 and 9.
  - >-
    AGENTS.md names the contract basename verbatim, so the agent_surface evaluator resolves.
    Proven by VP step 2. This is the single point of failure for the contract's evaluator -- a
    future AGENTS.md edit that drops the pointer silently unresolves it.
  - >-
    docs/contracts/file-router.yaml carries a route whose topic equals the contract's subject, and
    lists scripts/package_registry_probe.py in scripts_root_allowlist.allowed_files. Proven by VP
    steps 3 and 4.
  - >-
    scripts/package_registry_probe.py reports claimed / unclaimed / unreachable per registry and
    NEVER reports an unreachable registry as unclaimed -- a proxy 403, a timeout or a malformed
    body must be distinguishable from a genuine 404. This is the plan's one graduated invariant
    (VP step 5, graduation_check_id probe-unreachable-not-unclaimed) because the conflated case
    fails in the dangerous direction: it would report a name as free when nothing was checked.
  - >-
    The probe takes its crates.io User-Agent contact string from configuration, never a hardcoded
    address, and no personal identity appears in any committed file (Decision 101 public-content
    boundary). Proven by review plus VP step 6's suite.
  - >-
    The probe is absent from scripts/validate.py's check registry -- it is operator-invoked only
    and never runs in CI. Proven by VP step 7's negative assertion.
  - >-
    rec-3941 is open and carries the execution half. This plan claims no name, publishes no
    package, creates no account and stores no credential.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the contract exists and declares its Class D subject.
    command: "test -f docs/contracts/package-registry-reservation.yaml && grep -o -m1 'subject: package-registry-reservation' docs/contracts/package-registry-reservation.yaml"
    expected: >-
      Exit 0 and the subject line echoed. RED BEFORE, verified: the path does not exist on this
      branch, so the leading test -f short-circuits to exit 1 and prints nothing -- the step
      cannot pass vacuously on an absent file.
    fix_if: >-
      Exit 1 means the file is missing or the subject key is misspelled. The subject must equal
      the file-router route topic exactly (contract-population.yaml subject_namespace).
    hermetic: true
    expected_literals:
      - "subject: package-registry-reservation"
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_contract_drift, already registered in both tiers, which enforces the
      declared-shape obligation (Class D block, non-empty subject, resolving evaluator) over the
      whole contracts population. A second guard over one file's subject adds no coverage.
  - step: 2
    phase: pre-deploy
    action: Prove the agent_surface evaluator resolves -- AGENTS.md names the contract basename.
    command: grep -o -m1 'package-registry-reservation.yaml' AGENTS.md
    expected: >-
      Exit 0 and the basename echoed. RED BEFORE, verified: AGENTS.md contains no occurrence of
      this basename on this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means the AGENTS.md pointer is missing or paraphrases the filename instead of naming
      it. The evaluator matches the literal basename, so a description without the filename
      leaves the contract unresolved and reddens validate_contract_drift.
    hermetic: true
    expected_literals:
      - "package-registry-reservation.yaml"
    graduation: waive
    graduation_waiver_reason: >-
      contract-population.yaml's evaluator_kinds.agent_surface rule already IS this predicate, and
      validate_contract_drift enforces it in both tiers for every Class D contract. Graduating a
      per-file copy would assert the same thing twice from a weaker position.
  - step: 3
    phase: pre-deploy
    action: Prove the file-router route is registered under the topic-equals-subject rule.
    command: "grep -o -m1 'topic: package-registry-reservation' docs/contracts/file-router.yaml"
    expected: >-
      Exit 0 and the topic line echoed. RED BEFORE, verified: no such topic exists in the router
      on this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means the route is absent. A topic that does not equal the contract's subject fails
      contract-population.yaml's topic_equals_subject rule rather than this step.
    hermetic: true
    expected_literals:
      - "topic: package-registry-reservation"
    graduation: waive
    graduation_waiver_reason: >-
      validate_placement (both tiers) already enforces route link-validity and rejects duplicate
      or malformed topics, and topic_equals_subject binds the pairing via validate_contract_drift.
      This step exists to give the implementer a direct signal, not an independent gate.
  - step: 4
    phase: pre-deploy
    action: Prove the new scripts/ root module is registered in the placement allowlist.
    command: grep -o -m1 'package_registry_probe.py' docs/contracts/file-router.yaml
    expected: >-
      Exit 0 and the filename echoed. RED BEFORE, verified: the router carries no such entry on
      this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means scripts_root_allowlist.allowed_files is missing the module, which fails
      validate_placement's scripts-root check for any new depth-1 scripts/ file.
    hermetic: true
    expected_literals:
      - "package_registry_probe.py"
    graduation: waive
    graduation_waiver_reason: >-
      validate_placement's scripts-root allowlist check already fails any unlisted new depth-1
      scripts/ file across the whole tree. Graduating a single-filename grep would shadow a
      broader registered guard with a narrower one.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the probe never reports an unreachable registry as unclaimed. This is the plan's one
      graduated invariant -- the conflated case fails in the dangerous direction, reporting a name
      as free when nothing was actually checked.
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py::test_unreachable_is_not_reported_as_unclaimed -q
    expected: >-
      Exit 0 with one passing test. RED BEFORE, verified by execution on this branch: the test
      file does not exist, so pytest exits 4 (usage error, file or directory not found). Exit 4 is
      none of the five unmeasurable arms in vp-red-before.yaml (126, 127, grep/rg exit 2,
      credential absence, timeout), so the red-before replay classifies it target_absent and
      passes rather than hard-failing the plan PR.
    fix_if: >-
      A failure means a 403, a timeout or a malformed body is collapsing into the unclaimed
      branch. Model the three outcomes as distinct states, never as a bool -- a two-state return
      cannot express unreachable and will always pick the wrong side under network failure.
    hermetic: false
    graduation: graduate
    graduation_check_id: probe-unreachable-not-unclaimed
  - step: 6
    phase: pre-deploy
    action: Run the probe's full hermetic suite, covering the 200/404/403/timeout/malformed paths.
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py -q
    expected: >-
      Exit 0, all tests passing, with every branch of the new module exercised. Decision 48's V2
      row and test_coverage_checker default a new file to a 100 percent threshold, so an
      unexercised error branch fails the coverage gate rather than this step.
    fix_if: >-
      A coverage shortfall names the uncovered branch. Add the missing mocked-HTTP case; never
      lower the threshold to obtain green (implement-scope-boundary CONTENT invariant).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the whole-suite pytest run scripts.validate already performs in both tiers, plus
      test_coverage_checker's registered 100-percent gate on the new file. Step 5 already
      graduates the one behavioural invariant worth a standing shard.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the probe is NOT wired into the presubmit check registry -- it makes live network
      calls and must never run in CI.
    command: bin/venv-python -c "import sys; from scripts.checks import registry; names=set(registry.all_checks()); hits=sorted(n for n in names if 'package_registry' in n or 'registry_probe' in n); print('REGISTERED_PROBE_CHECKS=' + repr(hits)); sys.exit(1 if hits else 0)"
    expected: >-
      Exit 0 and an empty list printed after the marker. Asserts a negative, so it is green on the
      un-implemented tree by construction -- which is precisely why it is not graduated (a
      graduate disposition here would be tautological and hard-fail the plan PR).
    fix_if: >-
      A non-empty list means someone registered the probe as a check. Remove the registration: a
      network-dependent check makes the presubmit tiers non-hermetic and flaky.
    hermetic: true
    expected_literals:
      - "REGISTERED_PROBE_CHECKS="
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. validate_contract_drift, validate_placement, validate_sloc_limits,
      test_coverage_checker and validate_plan_documents are the likely first failures.
    fix_if: >-
      Address the named check. A Decision 128 SLOC crossing on the new module is decomposed, never
      raised -- a raise needs an authorising Decision under Decision 165, which this plan
      deliberately does not mint.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate presubmit tier itself. A graduate disposition here is refused statically by
      vp-red-before.yaml's recursion_refusal, which forbids a graduate step invoking
      scripts.validate. Marked non-hermetic so the implement leg never replays it into recursion.
  - step: 9
    phase: pre-deploy
    action: Run the full validation tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0."
    fix_if: Address the named check; do not commit on a red full tier (handoff_policy).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate full tier itself; same recursion refusal as step 8, and the same non-hermetic
      marking for the same reason. Nothing to graduate.
  - step: 10
    phase: post-deploy
    action: >-
      Operator-only, run OUTSIDE this plan's execution once the human has claimed the names. Not
      run by the implementing agent -- recorded here so the closure evidence for rec-3941 has a
      named command rather than an improvised one.
    command: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop
    expected: >-
      Exit 0 with all three registries reporting claimed. Exits non-zero today, which is correct
      and expected -- nothing has been claimed yet. This command is rec-3941's acceptance probe.
    fix_if: >-
      An unreachable result is not a failed claim -- re-run from a network path that reaches the
      registry before concluding anything about ownership.
    hermetic: false
    graduation: not-applicable

test_obligations:
  - source: scripts/package_registry_probe.py
    behavior: >-
      An unreachable registry (proxy 403, timeout, malformed body) is never reported as unclaimed.
      The three outcomes stay distinct states so a network failure can never be read as evidence
      that a name is free.
    verification_step: 5
    test_selector: tests/test_package_registry_probe.py::test_unreachable_is_not_reported_as_unclaimed
    red_green_expectation: >-
      RED before: the module and its test file do not exist, so pytest exits 4 (verified by
      execution on this branch). GREEN after: the test passes against the mocked 403/timeout
      fixtures. This is the plan's graduated shard, replayed under Decision 189 inverted polarity.
  - source: tests/test_package_registry_probe.py
    behavior: >-
      The mocked-HTTP suite exercises every branch of the probe, including the error paths that
      carry no live-network coverage.
    verification_step: 6
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py -q
    waiver_reason: >-
      This file IS the evidence carrier for the obligation above; a test module does not carry a
      separate behavioural obligation of its own. Recorded rather than omitted so the per-source
      accounting is complete.
  - source: docs/contracts/package-registry-reservation.yaml
    behavior: >-
      The contract keeps a valid Class D envelope with a resolving evaluator, and its amendment_log
      advances whenever its canonical dump changes.
    verification_step: 8
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      No new automated test is authored and none is mechanically required. The behaviour is
      already gated by validate_contract_drift (declared shape, evaluator resolution, subject
      uniqueness, amendment_log change detection) and validate_placement, both registered in both
      tiers. A test pinning one contract's prose would pin content, not behaviour.
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The new route resolves to a tracked file, its topic equals the contract subject, and the new
      scripts/ root module is allowlisted.
    verification_step: 8
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      validate_placement already enforces route link-validity, duplicate-topic rejection and the
      scripts-root allowlist across the whole tree in both tiers. A per-route mirror test would
      duplicate a registered guard and need editing on every future route addition.

constraints:
  - >-
    This plan claims NO name, publishes NO package, creates NO account and stores NO credential.
    Registry publication requires the operator's own credentials and 2FA; no agent holds them.
    Execution is tracked at rec-3941 and is operator-only by construction.
  - >-
    Decision 101 -- "On The Loop" is a CANDIDATE name tracked at rec-3922, still open. The ratified
    external-brand hierarchy remains Theseus / Guerdon / Semanto. The contract must state that a
    registry claim is a defensive namespace hold, NOT brand ratification, and must not assert a
    rename has happened. Decision 195 records company ownership and IP assignment; it does not
    rename the product.
  - >-
    Neutral-placeholder constraint (Decision 101 (b), scout NOTE). The eventual placeholder is
    functionally real but editorially neutral: a working package whose description says the
    namespace is reserved for future development. No product positioning, no marketing copy, no
    brand claim until rec-3922 ratifies. This accepts slightly higher crates.io reclaim exposure
    than a fully-fleshed package would carry, as a deliberate trade.
  - >-
    Decision 101 (d) public-content boundary -- no personal identity in any committed file. The
    published contact is the role alias security@otl-labs.com, a public business address, never a
    personal mailbox. The probe's crates.io User-Agent contact string is configuration with a
    neutral default, never a hardcoded address. The contract records the recommendation that the
    ACCOUNT-OWNER address be a distinct alias from the published security contact (recovery mail
    wants a narrow unpublished inbox; a security contact wants the opposite), with the operator's
    final choice recorded at execution time.
  - >-
    Anti-squatting posture, one claim per registry. PyPI: `ontheloop` only. crates.io: `ontheloop`
    only, with real content, and it is immutable (yank, never delete) so the first version must
    carry correct licence and description. npm: the bare name PLUS the `@ontheloop` scope, which is
    npm's own sanctioned namespace mechanism. Hyphenated and other variants are deliberately NOT
    claimed -- bulk variant-grabbing for an unratified name is the shape all three registries'
    policies actually target. Scope availability could not be verified unauthenticated from CC-web
    (npm's org endpoints returned 403/401); the operator confirms it at signup.
  - >-
    crates.io has no separate account email -- it is GitHub OAuth only, so its ownership inherits
    from the GitHub identity and couples to the undecided org handle at rec-3905. Claim under the
    personal account now and add a GitHub Team owner once that handle settles; do not block this
    work on rec-3905.
  - >-
    The probe is NEVER registered in scripts/validate.py. It makes live network calls, which would
    make the presubmit tiers non-hermetic and flaky. It belongs to the operator-invoked script
    class alongside scripts/smoke_test_inference_credentials.py and
    scripts/ducklake_neon_smoke_test.py. VP step 7 asserts this negatively.
  - >-
    Decision 128 -- decompose by default. Keep both new files under 500 SLOC and register NO
    sloc_budgets entry. A raise marker would need an authorising Decision under Decision 165, which
    this plan deliberately does not mint.
  - >-
    No numbered Decision is minted. Per Decision 150 / Decision 86 routing, an operational fact
    routes to a recommendation and a contract -- the same disposition Decision 195 clause 4 already
    used for the sibling GitHub-org-handle question.
  - >-
    VP authoring traps (vp-red-before.yaml): no pre-deploy command may invoke `rg` (absent from the
    GitHub runner, classifies unmeasurable); no graduate step may invoke scripts.validate
    (recursion_refusal); schema_version 5 hermetic steps carry assertions in expected_literals, and
    a backtick literal in a hermetic step's `expected` is refused at schema-validation time.
  - No rescue agents or workaround loops (Decision 55).

