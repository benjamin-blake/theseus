schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ontheloop-package-registries
intent: >-
  Hold the `ontheloop` distribution namespace on PyPI, npm and crates.io before it is taken, by
  authoring the operator procedure as a Class D contract and a credential-free probe that proves
  a claim landed. The platform's free tier IS this repository and must be installable (Decision
  184), so owning a distribution namespace serves the platform plane regardless of which external
  brand eventually ratifies. Claims nothing and publishes nothing itself.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ontheloop-package-registries.yaml
phase: >-
  No platform roadmap tier_item. Operator-identity work in the same class as rec-3905 (GitHub org
  + domain reservation), filed under the soft-warn exception category user_explicit_out_of_scope --
  the Tier Item Freshness Gate does not fire because no tier_item is claimed. RELATED (neither
  foreclosed nor duplicated): T2.54 clause-to-check traceability, T2.56 contract layering.

scope:
  - file: docs/contracts/package-registry-reservation.yaml
    action: Create
    purpose: >-
      Class D mechanism contract carrying the per-registry operator procedure, the anti-squatting
      posture, the neutral-placeholder constraint and the identity/ownership rules. Evaluator is
      {agent_surface: docs/CLAUDE.md}; no new check module is authored.
  - file: scripts/package_registry_probe.py
    action: Create
    purpose: >-
      Credential-free, read-only probe of the three registries' public metadata endpoints.
      Reports claimed / unclaimed / unreachable per registry and exits non-zero under
      --require-claimed unless every target is claimed. Deliberately NOT a registered presubmit
      check -- it makes live network calls.
  - file: tests/test_package_registry_probe.py
    action: Create
    purpose: >-
      Hermetic unit tests with mocked HTTP covering the 200 / 404 / 403 / timeout / malformed
      paths, the load-bearing assertion that an unreachable registry is never reported as
      unclaimed, and the config-sourced User-Agent contact. Decision 131 mirror path.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Register the contract route (topic equals subject), add scripts/package_registry_probe.py
      to scripts_root_allowlist.allowed_files, and append the amendment_log entry
      validate_contract_drift requires.
  - file: docs/CLAUDE.md
    action: Modify
    purpose: >-
      One-line pointer naming the contract file, under the existing Class-to-home map's
      operator-procedure row. Load-bearing, not cosmetic: the agent_surface evaluator resolves
      only if this file's text contains the contract basename. NOT AGENTS.md -- see constraint 8.
  - file: docs/plans/PLAN-ontheloop-package-registries.yaml
    action: Create
    purpose: This plan artefact.

bundled_recommendations: []
followon_recs:
  - rec-3941
closes_criteria: []
infrastructure_dependencies: []

acceptance_criteria:
  - >-
    docs/contracts/package-registry-reservation.yaml exists carrying a Class D `contract:` block
    with class D, subject `package-registry-reservation`, a resolving
    `evaluator: {agent_surface: docs/CLAUDE.md}`, a non-`active` status (closed at birth for a new
    file per contract-population.yaml grandfather_only_forms) and a NON-EMPTY amendment_log.
    Class, subject, evaluator and status are enforced by validate_contract_drift Pass 1 in VP
    steps 11 and 12. The amendment_log clause is NOT: validate_contract_drift skips a genuinely
    new file (`if base_text is None: continue`), so an empty log would pass every registered
    gate. VP step 1 is therefore its ONLY prover, and it asserts against the PARSED amendment_log
    list rather than a file-wide token grep, which would false-positive on this contract's own
    prose about the amendment rule.
  - >-
    docs/CLAUDE.md names the contract basename verbatim, so the agent_surface evaluator resolves.
    Proven by VP step 2. This is the single point of failure for the contract's evaluator -- a
    future prose-trim pass that drops the pointer silently unresolves it, which
    validate_contract_drift would then redden.
  - >-
    docs/contracts/file-router.yaml carries a route whose topic equals the contract's subject, and
    lists scripts/package_registry_probe.py in scripts_root_allowlist.allowed_files. Proven by VP
    steps 3 and 4.
  - >-
    scripts/package_registry_probe.py reports claimed / unclaimed / unreachable per registry and
    NEVER reports an unreachable registry as unclaimed -- a proxy 403, a timeout or a malformed
    body must be distinguishable from a genuine 404. This is the plan's primary graduated
    invariant (VP step 5, graduation_check_id probe-unreachable-not-unclaimed) because the
    conflated case fails in the dangerous direction: it would report a name as free when nothing
    was actually checked.
  - >-
    The probe takes its crates.io User-Agent contact string from configuration, never a hardcoded
    address. Proven by the named test in VP step 6 and its test_obligations row. (The broader
    "no personal identity in any committed file" rule is constraint 4, not an acceptance
    criterion: the never-commit hook is a shape guard for AWS ids and secret-like strings, not
    personal names, so nothing mechanically enforces it and claiming otherwise would overstate.)
  - >-
    The probe is absent from scripts/validate.py's check registry -- it is operator-invoked only
    and never runs in CI. Proven by VP step 7's negative assertion.
  - >-
    Both size registries stay green. Prose: every surface within its config/prose_budgets.yaml
    byte budget, with the pointer landing in docs/CLAUDE.md (836 bytes of headroom) rather than
    the S1 ambient load-set (6 bytes) -- proven by VP step 8. Structural:
    docs/contracts/file-router.yaml at or under the contracts-class 500-effective-line limit after
    the route lands, which requires compacting its oldest amendment_log entries because it
    measures 496 today -- proven by VP step 9.
  - >-
    rec-3941 is open and carries the execution half. Proven by VP step 10. This plan claims no
    name, publishes no package, creates no account and stores no credential.

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Prove the contract exists, declares its Class D subject, and carries a NON-EMPTY
      amendment_log. The amendment_log conjunct is load-bearing: validate_contract_drift skips a
      genuinely new file, so this step is the only gate that sees an empty log on this landing.
    command: bin/venv-python -c "import sys,yaml; d=yaml.safe_load(open('docs/contracts/package-registry-reservation.yaml')); log=d.get('amendment_log') or []; print('SUBJECT=%s AMENDMENT_ENTRIES=%d' % (d['contract']['subject'], len(log))); sys.exit(0 if d['contract']['subject']=='package-registry-reservation' and log and all('change_class' in e for e in log) else 1)"
    expected: >-
      Exit 0 printing the subject and a non-zero entry count. RED BEFORE, verified by execution:
      the path does not exist, so open() raises FileNotFoundError and the interpreter exits 1,
      which classifies assertion_failed. Scoped to the parsed amendment_log list, NOT a file-wide
      token grep: this contract's own body discusses validate_contract_drift's amendment rule, so
      a bare change_class token search would false-positive on that prose and green an empty log.
    fix_if: >-
      A non-zero exit with the subject printed means amendment_log is empty or an entry omits
      change_class -- add the initial-authoring entry. A mismatched subject must be corrected to
      equal the file-router route topic exactly.
    hermetic: true
    expected_literals:
      - "AMENDMENT_ENTRIES="
    graduation: waive
    graduation_waiver_reason: >-
      The subject and shape conjuncts duplicate validate_contract_drift, registered in both tiers.
      The amendment_log conjunct is genuinely unduplicated but is a one-shot authoring guard for
      this file's birth, not a durable corpus invariant -- validate_contract_drift binds every
      SUBSEQUENT edit to this file, so a standing shard would only ever re-assert a property the
      registered check already owns from the second commit onward.
  - step: 2
    phase: pre-deploy
    action: Prove the agent_surface evaluator resolves -- docs/CLAUDE.md names the contract basename.
    command: grep -o -m1 'package-registry-reservation.yaml' docs/CLAUDE.md
    expected: >-
      Exit 0 and the basename echoed. RED BEFORE, verified by execution: docs/CLAUDE.md contains
      no occurrence of this basename on this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means the pointer is missing or paraphrases the filename instead of naming it.
      _agent_surface_resolves does a literal substring match on the basename, so a description
      without the filename leaves the contract unresolved and reddens validate_contract_drift.
    hermetic: true
    expected_literals:
      - "package-registry-reservation.yaml"
    graduation: waive
    graduation_waiver_reason: >-
      contract-population.yaml's evaluator_kinds.agent_surface rule IS this predicate, and
      _population._agent_surface_resolves enforces it in both tiers for every Class D contract
      (verified in code at the call site emitting "agent_surface ... does not contain ...").
      Graduating a per-file copy would assert the same thing twice from a weaker position.
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the file-router route EXISTS under the topic-equals-subject rule. Graduated because no
      registered check enforces route PRESENCE for a new contract.
    command: "grep -o -m1 'topic: package-registry-reservation' docs/contracts/file-router.yaml"
    expected: >-
      Exit 0 and the topic line echoed. RED BEFORE, verified by execution: no such topic exists in
      the router on this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means the route is absent. A route whose topic does not equal the contract's subject
      is a different failure, caught by contract-population's topic_equals_subject rule.
    hermetic: true
    expected_literals:
      - "topic: package-registry-reservation"
    graduation: graduate
    graduation_check_id: router-route-package-registry-reservation
  - step: 4
    phase: pre-deploy
    action: Prove the new scripts/ root module is registered in the placement allowlist.
    command: grep -o -m1 'package_registry_probe.py' docs/contracts/file-router.yaml
    expected: >-
      Exit 0 and the filename echoed. RED BEFORE, verified: the router carries no such entry on
      this branch, so grep exits 1.
    fix_if: >-
      Exit 1 means scripts_root_allowlist.allowed_files is missing the module, which fails
      validate_placement's scripts-root stray-file check.
    hermetic: true
    expected_literals:
      - "package_registry_probe.py"
    graduation: waive
    graduation_waiver_reason: >-
      validate_placement._scripts_root_stray_files already flags any unlisted new depth-1
      scripts/ file across the whole tree in both tiers (verified in code). Graduating a
      single-filename grep would shadow a broader registered guard with a narrower one.
  - step: 5
    phase: pre-deploy
    action: >-
      Prove the probe never reports an unreachable registry as unclaimed. The conflated case fails
      in the dangerous direction, reporting a name as free when nothing was actually checked.
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py::test_unreachable_is_not_reported_as_unclaimed -q
    expected: >-
      Exit 0 with one passing test. RED BEFORE, verified by execution on this branch: the test
      file does not exist, so pytest exits 4. _vp_replay_classify maps pytest collection-error
      exits (4 and 5) to target_absent, a legitimate red-before PASS, so this does not hard-fail
      the plan PR. If the venv-less fallback interpreter lacks pytest the run exits 1
      (assertion_failed), also a pass; exit 127 is impossible because bin/venv-python exists.
    fix_if: >-
      A failure means a 403, a timeout or a malformed body is collapsing into the unclaimed
      branch. Model the three outcomes as distinct states, never as a bool -- a two-state return
      cannot express unreachable and will always pick the wrong side under network failure.
    hermetic: false
    graduation: graduate
    graduation_check_id: probe-unreachable-not-unclaimed
  - step: 6
    phase: pre-deploy
    action: >-
      Run the probe's full hermetic suite, covering the 200/404/403/timeout/malformed paths and
      the config-sourced User-Agent contact.
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py -q
    expected: >-
      Exit 0, all tests passing, including test_user_agent_contact_comes_from_config. Decision
      48's V2 row and test_coverage_checker default a new file to a 100 percent threshold
      (verified: threshold = baseline.get(rel_str, 100.0)), so an unexercised error branch fails
      the coverage gate rather than this step.
    fix_if: >-
      A coverage shortfall names the uncovered branch. Add the missing mocked-HTTP case; never
      lower the threshold to obtain green (implement-scope-boundary CONTENT invariant).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the whole-suite pytest run scripts.validate already performs in both tiers, plus
      test_coverage_checker's registered 100-percent gate on the new file. Step 5 already
      graduates the one behavioural invariant that warrants a standing shard.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the probe is NOT wired into the presubmit check registry -- it makes live network
      calls and must never run in CI.
    command: bin/venv-python -c "import sys; from scripts.checks import registry; names=set(registry.all_checks()); hits=sorted(n for n in names if 'package_registry' in n or 'registry_probe' in n); print('REGISTERED_PROBE_CHECKS=' + repr(hits)); sys.exit(1 if hits else 0)"
    expected: >-
      Exit 0 and an empty list printed after the marker.
    fix_if: >-
      A non-empty list means someone registered the probe as a check. Remove the registration: a
      network-dependent check makes the presubmit tiers non-hermetic and flaky.
    hermetic: true
    expected_literals:
      - "REGISTERED_PROBE_CHECKS="
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, but it asserts a NEGATIVE and is therefore
      green-by-construction on the un-implemented tree -- a graduate disposition here would
      classify tautological and hard-fail this plan's own PR under the Decision 189 inverted
      replay. Impractical to graduate now for exactly that reason, not un-expressible.
  - step: 8
    phase: pre-deploy
    action: >-
      Prove every prose surface stays within its byte budget after the docs/CLAUDE.md pointer
      lands. S1 has 6 bytes of headroom and is deliberately NOT the target (constraint 8).
    command: bin/venv-python -c "import sys; from scripts.checks.prose.prose_limits import validate_prose_limits as f; failed=[]; f(failed); print('PROSE_FAILED=' + repr(failed)); sys.exit(1 if failed else 0)"
    expected: >-
      Exit 0 and an empty list printed after the marker. docs/CLAUDE.md measured 2977 bytes
      against a 3813 budget at plan time, so a pointer of a few hundred bytes fits.
    fix_if: >-
      A failure naming docs/CLAUDE.md means the pointer overshot its budget -- tighten the pointer
      to a single line. Do NOT retarget to AGENTS.md (6 bytes of headroom), do NOT raise a budget
      (needs an authorising Decision this plan declines to mint), and NEVER split a surface into
      @-imported fragments, which prose_budgets.yaml forbids outright.
    hermetic: true
    expected_literals:
      - "PROSE_FAILED="
    graduation: waive
    graduation_waiver_reason: >-
      Directly invokes validate_prose_limits, already registered in both tiers, which owns every
      surface's budget. Also green-by-construction pre-implementation (the budgets pass today),
      so a graduate disposition would classify tautological and hard-fail this plan's PR.
  - step: 9
    phase: pre-deploy
    action: >-
      Prove docs/contracts/file-router.yaml stays within the Decision 166 contracts-class
      500-effective-line limit AFTER the route lands. It measures 496 today: FOUR lines of
      headroom against additions costing 8-15, so the amendment-log compaction in execution_steps
      is mandatory, not optional.
    command: >-
      bin/venv-python -c "import sys,pathlib; t=pathlib.Path('docs/contracts/file-router.yaml').read_text(encoding='utf-8');
      n=len([l for l in t.splitlines() if l.strip() and not l.lstrip().startswith('#')]);
      print('ROUTER_EFFECTIVE_LINES=%d' % n);
      sys.exit(0 if (n <= 500 and 'topic: package-registry-reservation' in t) else 1)"
    expected: >-
      Exit 0 with a count at or under 500. RED BEFORE, verified by execution: the route is absent
      today, so the second conjunct is false and the command exits 1 (assertion_failed) even
      though the count itself currently passes at 496.
    fix_if: >-
      A count above 500 means the compaction did not free enough lines -- compact more of the
      oldest amendment_log entries (dates, plan names and Decision citations preserved, summary
      bodies collapsed to one line), which is this file's own established valve. Do NOT register a
      budgets override (it needs an authorising Decision under Decision 165/166 this plan declines
      to mint) and do NOT split the file (the contracts class forbids splitting a single subject).
    hermetic: true
    expected_literals:
      - "ROUTER_EFFECTIVE_LINES="
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_structural_size_limits, registered in both tiers, which owns the
      contracts-class limit for every docs/contracts/*.yaml file. The only conjunct that makes
      this step red today is the route presence, and that is already graduated at step 3 --
      graduating it again here would double-report one invariant.
  - step: 10
    phase: pre-deploy
    action: Confirm rec-3941 exists and carries the execution half, by reading it back from the warehouse.
    command: bin/venv-python -m scripts.ops_data_portal --sync && grep -c 'rec-3941' logs/.recommendations-log.jsonl
    expected: >-
      A count of at least 1 after the pull. rec-3941 was filed by the planning session that
      authored this plan, so this confirms the split landed rather than being asserted only in
      followon_recs. The cache is READ here as a projection of the warehouse, never written.
    fix_if: >-
      A zero count means the rec is absent or the sync failed. Re-file through the portal; never
      edit logs/.recommendations-log.jsonl to make this pass (Decision 84 replay-from-cache
      anti-pattern).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Run the authoritative fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0. validate_structural_size_limits, validate_contract_drift, validate_placement,
      validate_prose_limits, validate_sloc_limits, test_coverage_checker and
      validate_plan_documents are the likely first failures.
    fix_if: >-
      Address the named check, and note the valves DIFFER by registry. A Decision 128 SLOC
      crossing on a new PYTHON module is decomposed, never raised. A validate_structural_size_limits
      failure on docs/contracts/file-router.yaml is the structural-size collision (496 of 500) and
      its valve is the OPPOSITE: compact the oldest amendment_log entries, because the contracts
      class forbids splitting a single subject. Neither takes a budget raise -- that needs an
      authorising Decision under Decision 165/166, which this plan deliberately does not mint.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate presubmit tier itself. A graduate disposition here is refused statically by
      vp-red-before.yaml's recursion_refusal, which forbids a graduate step invoking
      scripts.validate. Marked non-hermetic so the implement leg never replays it into recursion.
  - step: 12
    phase: pre-deploy
    action: Run the full validation tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: "Exit 0."
    fix_if: Address the named check; do not commit on a red full tier (handoff_policy).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The aggregate full tier itself; same recursion refusal as step 11, and the same non-hermetic
      marking for the same reason. Nothing to graduate.
  - step: 13
    phase: post-deploy
    action: >-
      Operator-only, run OUTSIDE this plan's execution once the human has claimed the names. Not
      run by the implementing agent -- recorded here so rec-3941's closure evidence has a named
      command rather than an improvised one.
    command: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop
    expected: >-
      Exit 0 with all three registries reporting claimed. Exits non-zero today, which is correct
      and expected -- nothing has been claimed yet. This command is rec-3941's acceptance probe.
    fix_if: >-
      An unreachable result is not a failed claim -- re-run from a network path that reaches the
      registry before concluding anything about ownership.
    hermetic: false
    graduation: not-applicable

test_obligations:
  - source: scripts/package_registry_probe.py
    behavior: >-
      An unreachable registry (proxy 403, timeout, malformed body) is never reported as unclaimed.
      The three outcomes stay distinct states so a network failure can never be read as evidence
      that a name is free.
    verification_step: 5
    test_selector: tests/test_package_registry_probe.py::test_unreachable_is_not_reported_as_unclaimed
    red_green_expectation: >-
      RED before: the module and its test file do not exist, so pytest exits 4 (verified by
      execution on this branch). GREEN after: the test passes against the mocked 403/timeout
      fixtures. This is the plan's graduated shard, replayed under Decision 189 inverted polarity.
  - source: tests/test_package_registry_probe.py
    behavior: >-
      The mocked-HTTP suite exercises every branch of the probe, including the error paths that
      carry no live-network coverage and the config-sourced User-Agent contact.
    verification_step: 6
    command: bin/venv-python -m pytest tests/test_package_registry_probe.py -q
    waiver_reason: >-
      This file IS the evidence carrier for the obligations above; a test module does not carry a
      separate behavioural obligation of its own. Under Decision 131's mirror rule its obligation
      is discharged by the source module it mirrors, and a test-of-the-test is the regress that
      rule exists to stop. Recorded rather than omitted so per-source accounting is complete.
  - source: docs/contracts/package-registry-reservation.yaml
    behavior: >-
      The contract keeps a valid Class D envelope with a resolving evaluator, and its amendment_log
      advances whenever its canonical dump changes.
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      No new automated test is authored and none is mechanically required. The behaviour is gated
      by validate_contract_drift and validate_placement, both registered in both tiers. NOTE the
      birth exception: validate_contract_drift skips a genuinely new file, so amendment_log
      NON-EMPTINESS at this landing is proven by VP step 1, not here; this row covers every
      subsequent edit. A test pinning one contract's prose would pin content, not behaviour.
  - source: docs/contracts/file-router.yaml
    behavior: >-
      The new route resolves to a tracked file, its topic equals the contract subject, and the new
      scripts/ root module is allowlisted.
    verification_step: 11
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      validate_placement enforces route link-validity and the scripts-root allowlist tree-wide in
      both tiers. Route PRESENCE for a new contract is NOT covered by any registered check, which
      is precisely why VP step 3 graduates rather than waives. A per-route mirror test would
      duplicate a registered guard and need editing on every future route addition.

constraints:
  - >-
    This plan claims NO name, publishes NO package, creates NO account and stores NO credential.
    Registry publication requires the operator's own credentials and 2FA; no agent holds them.
    Execution is tracked at rec-3941 and is operator-only by construction.
  - >-
    Decision 101 -- "On The Loop" is a CANDIDATE name tracked at rec-3922, still open. The ratified
    external-brand hierarchy remains Theseus / Guerdon / Semanto. The contract must state that a
    registry claim is a defensive namespace hold, NOT brand ratification, and must not assert a
    rename has happened. Decision 195 records company ownership and IP assignment; it does not
    rename the product. The namespace is anchorable to the RATIFIED company name (Decision 195
    clause 1), not only to the candidate rename.
  - >-
    Neutral-placeholder constraint (Decision 101 (b), scout NOTE). The eventual placeholder is
    functionally real but editorially neutral: a working package whose description says the
    namespace is reserved for future development. No product positioning, no marketing copy, no
    brand claim until rec-3922 ratifies. This accepts slightly higher crates.io reclaim exposure
    than a fully-fleshed package would carry, as a deliberate trade.
  - >-
    Decision 101 (d) public-content boundary -- no personal identity in any committed file. The
    published contact is the role alias security@otl-labs.com, a public business address, never a
    personal mailbox. The probe's crates.io User-Agent contact string is configuration with a
    neutral default, never a hardcoded address. RECORD IT AS A CANDIDATE, NOT AS SETTLED: the
    otl-labs.com domain derives from one of the two undecided org-handle candidates Decision 195
    clause 4 routes to rec-3905, so the contract states the contact is pending that choice, the
    same treatment already given the account-owner address and the crates.io ownership coupling.
  - >-
    The contract records the recommendation that the ACCOUNT-OWNER address be a distinct alias
    from the published security contact -- recovery mail wants a narrow unpublished inbox, a
    security contact wants the opposite -- with the operator's final choice recorded at execution.
  - >-
    Anti-squatting posture, one claim per registry. PyPI: `ontheloop` only. crates.io: `ontheloop`
    only, with real content, and it is immutable (yank, never delete) so the first version must
    carry correct licence and description. npm: the bare name PLUS the `@ontheloop` scope, which is
    npm's own sanctioned namespace mechanism. Hyphenated and other variants are deliberately NOT
    claimed -- bulk variant-grabbing for an unratified name is the shape all three registries'
    policies actually target. Scope availability could not be verified unauthenticated from CC-web
    (npm's org endpoints returned 403/401); the operator confirms it at signup.
  - >-
    crates.io has no separate account email -- it is GitHub OAuth only, so its ownership inherits
    from the GitHub identity and couples to the undecided org handle at rec-3905. Claim under the
    personal account now and add a GitHub Team owner once that handle settles; do not block this
    work on rec-3905.
  - >-
    PROSE BUDGET -- the pointer goes in docs/CLAUDE.md, NOT AGENTS.md. config/prose_budgets.yaml
    budgets S1 root_ambient_load_set at 18943 against a measured 18937: SIX bytes of headroom,
    and the contract basename alone is 32 bytes, so an AGENTS.md pointer hard-fails
    validate_prose_limits (registered in both tiers). docs/CLAUDE.md measures 2977 against 3813.
    Beyond the arithmetic this is the better placement: AGENTS.md is re-read on every turn of
    every session, and a rare operator-initiated task should not tax the ambient load-set;
    docs/CLAUDE.md already owns the "Operator procedures -> contract procedure: blocks" routing
    row this contract instantiates. Do NOT raise a budget (needs an authorising Decision under
    Decision 165) and NEVER split a surface into @-imported fragments (forbidden outright).
  - >-
    The probe is NEVER registered in scripts/validate.py. It makes live network calls, which would
    make the presubmit tiers non-hermetic and flaky. It belongs to the operator-invoked script
    class alongside scripts/smoke_test_inference_credentials.py and
