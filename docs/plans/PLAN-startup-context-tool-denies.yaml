schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "startup-context-tool-denies"
intent: >-
  Strip always-loaded but unused harness tools (the cloud environment-setup and computer-folder
  tools, the Artifact family and the Claude Docs connector) from every cloud web session's startup
  context with blanket permissions.deny rules in .claude/settings.json, cutting an estimated 17-24k
  tokens from a measured 94,959-token first-call baseline in every session and every subagent; then
  report the measured cost and the workaround upstream to the platform vendor.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-startup-context-tool-denies.yaml
phase: >-
  user_explicit_out_of_scope soft-warn exception category (user-directed startup-context trim); no
  tier_item criterion claimed. Adjacent: T3.14 (context-budget metric, deferred_post_mvp) -- not
  advanced. Sibling: rec-2982 (retire github-full) is planned separately, next.
scope:
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Populate permissions.deny (empty today) with eleven blanket entries: Artifact,
      ArtifactComments, ArtifactData, mcp__Claude_Docs, and mcp__claude-code-remote__ +
      create_environment, update_environment, get_environment, switch_environment,
      request_credential, list_computer_folders, request_computer_folder.
  - file: tests/hooks/test_settings_tool_denies.py
    action: Create
    purpose: >-
      TestContextTrimDenies guards the deny set: each entry present and blanket, no repo workflow
      surface names a denied tool, no allow entry is shadowed by a deny entry, and a tmp_path
      self-test proving the reference scan flags a workflow that names a denied tool.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .claude/settings.json permissions.deny contains all eleven entries named in scope, each blanket
    (no parenthesised specifier) -- a specifier rule only gates calls and leaves the definition in
    context.
  - >-
    No file under .claude/skills, .claude/commands, .claude/agents, .claude/hooks, docs/contracts,
    .github/prompts, .github/agents or config/agent, and not AGENTS.md, references a denied tool (by
    qualified or bare tool name, or Artifact in a tool-reference form); no permissions.allow entry
    equals or falls under a deny entry.
  - >-
    The plugin's rendered hooks file stays the render of the settings
    (tests/hooks/test_plugin_hooks.py render test passes unchanged).
  - >-
    In a fresh cloud session on main after merge, the context panel's MCP tools plus System tools
    lines total at most 46,200 (baseline 33.4k + 22.8k = 56.2k, minus 10,000) and the System tools
    line is at most 17,800 (the Artifact family stripped); the transcript first-call total is
    recorded as a secondary figure.
  - >-
    The measured figures and the workaround are sent as a reply in the user's existing upstream
    vendor feedback thread on cloud environment setup, only after the user replies 'send' to the
    text shown in chat; the report records the reply's sent timestamp.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the TestContextTrimDenies class. The class does not exist today, so the red-before replay
      classifies target_absent (pytest exit 4); after the change its four tests pass.
    command: bin/venv-python -m pytest tests/hooks/test_settings_tool_denies.py::TestContextTrimDenies -q
    expected: >-
      exit 0, four tests passed. Before the change pytest reports the class not found.
    fix_if: >-
      A deny entry missing or carrying a specifier -- fix the settings entry. A workflow surface
      references a denied tool -- stop and ask the user whether that workflow needs the tool; never
      narrow the scan roots, the name forms or the required set to pass.
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: settings-context-trim-denies
  - step: 2
    phase: pre-deploy
    action: >-
      Confirm the plugin wiring is untouched: the committed .claude/hooks/hooks.json is still the
      render of .claude/settings.json (render reads only the hooks key).
    command: bin/venv-python -m pytest tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings -q
    expected: exit 0, one test passed, before and after the change.
    fix_if: >-
      Fails -- the edit touched the hooks key; restore it. Never regenerate hooks.json to absorb an
      unintended hooks change.
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Green before and after by design (a no-regression probe, not a red-before probe), and it
      re-runs an existing standing test in tests/hooks/test_plugin_hooks.py.
  - step: 3
    phase: pre-deploy
    action: >-
      Full-tier handoff obligation on the COMMITTED, rebased, clean tree (git-ops.yaml
      handoff_sequence), then attest that the evidence covers HEAD -- .claude/settings.json is a
      never_exempt path, so the push gate denies a push without it (Decision 203).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; the Validation Summary lists no failure and --verify-head attests the checked HEAD's
      tree.
    fix_if: >-
      A failure in scope is fixed on the branch, committed, and this step re-run from the start; one
      outside scope becomes a rec via scripts.ops_data_portal (Decision 59, Decision 55). Never skip
      or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-
      In a FRESH cloud session started on main after the merge (its first message is the short
      pasteable prompt from the hand-back step), take two readings. PRIMARY: the user reads the
      context panel's MCP tools and System tools lines -- only tool definitions move them, so the
      drop is attributable to the denies, and the System tools line alone settles whether the
      built-in Artifact tool was stripped (it is the only loaded built-in denied). SECONDARY,
      recorded not asserted: the transcript's first-call input total, plus controls (Claude Code
      version, ambient-load files since the baseline commit, and no Claude Docs names in the
      session's deferred-tool index).
    command: >-
      bin/venv-python -c "import json,glob,os; f=max(glob.glob(os.path.expanduser('~/.claude/projects/*/*.jsonl')),key=os.path.getmtime); rows=[json.loads(l) for l in open(f)]; u=next(d['message']['usage'] for d in rows if d.get('type')=='assistant'); dn=[n for d in rows if d.get('type')=='attachment' and d['attachment'].get('type')=='deferred_tools_delta' for n in d['attachment'].get('addedNames',[])]; print('first_call_input_total', u['input_tokens']+u['cache_creation_input_tokens']+u['cache_read_input_tokens'], 'claude_code', os.environ.get('CLAUDE_CODE_VERSION'), 'deferred_claude_docs', sum(n.startswith('mcp__Claude_Docs__') for n in dn))"
      && git diff --stat af368683 origin/main -- AGENTS.md CLAUDE.md .mcp.json .claude/skills .claude/commands .claude/agents
    expected: >-
      Panel (user-read): MCP tools + System tools at most 46,200 and System tools at most 17,800.
      Command: deferred_claude_docs 0; claude_code 2.1.42; the diff --stat prints nothing;
      first_call_input_total recorded for the reply (expected well under the 94,959 baseline, but
      not asserted -- the ~10.3k Messages remainder of the baseline is not controlled).
    fix_if: >-
      MCP + System tools above 46,200 -- expand the panel's MCP tools line, name the denied tools
      still loaded, and record that the deny does not strip them on this surface (a finding for the
      reply and a rec). System tools above 17,800 -- the built-in Artifact tool is not stripped by a
      deny; record it the same way. A control tripped (version or ambient files changed) -- say so in
      the report beside the figures. Never move a threshold to make the step pass (rec-3976,
      Decision 181).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: .claude/settings.json
    behavior: >-
      The eleven context-trim tools stay blanket-denied, and no repo workflow surface comes to
      depend on a tool the settings deny.
    verification_step: 1
    test_selector: tests/hooks/test_settings_tool_denies.py::TestContextTrimDenies
    red_green_expectation: >-
      red before, green after -- the class does not resolve today (pytest exit 4, not found) and
      its four tests pass once the deny list and test land.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Deny exactly the eleven user-approved entries, all blanket. No other harness tool (the user
    excluded ShowOnboardingRolePicker, SuggestPluginInstall, SuggestSkills, SearchPlugins).
  - >-
    Out of scope: .mcp.json and github-full (rec-2982, next plan); AGENTS.md (user deferred it to the
    persona-context consolidation); the plugin manifest and marketplace files.
  - >-
    PUBLIC repository (Decision 101): no recipient name, address, thread id or email text in any
    committed file, commit message or PR body. The email exists only in the user's mailbox.
  - >-
    The upstream reply is sent only after the user's explicit 'send' to the exact text shown in
    chat; never sent unprompted, never to a new thread.
  - >-
    Test colocation follows tests/hooks/ (tests/hooks/test_plugin_hooks.py already reads
    .claude/settings.json; Decision 131 maps no home for it); no cross-test imports; no exact-count
    assertion on the deny list -- assert a membership floor; module stays under 500 SLOC (Decision 130).
  - >-
    Leave every other settings key byte-identical, including the PreToolUse registrations (Decision
    203) and the hooks key the plugin render reads.
context:
  - >-
    Decision-scout verdict NO_FLAGS. CITE list (verbatim): Decision 132, Decision 189, Decision 163,
    Decision 101. Decisions triaged: 190 of 190. Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1.
  - "gates: decision-scout=NO_FLAGS; project-alignment=write-the-plan r1; plan-critique=<pending>"
  - "red_overlap: verdict clear, reds [] (Decision 226)."
  - >-
    Baseline: 2026-10-29 session on main af368683, Claude Code 2.1.42, opened with a ~60-token
    question -- first call wrote 94,959 tokens (panel: MCP tools 33.4k, system tools 22.8k, system
    prompt 11.9k, memory 7.3k, skills 6.3k, MCP instructions 3k; the ~10.3k Messages remainder is
    hook output, deferred-tool index, agent list and reminders). Tokens only, never money (D101).
  - >-
    Mechanism evidence: adding these entries mid-session made the harness report the seven
    claude-code-remote tools and the three loaded Claude Docs tools "Denied by a permission rule"
    while keeping cached definitions (no mid-session drop); a subagent spawned meanwhile lacked
    them and kept the other 27 claude-code-remote tools. Artifact is unproven -- step 4 settles it.
  - >-
    git-ops.yaml cc_web_permission_gotcha forbids ALLOW entries for the send_later/trigger tools to
    silence prompts; these are DENY entries for a disjoint tool set. send_later, create_trigger,
    delete_trigger and the other session/trigger tools stay undenied (overseer safety_net uses them).
  - >-
    Gotchas: .claude/settings.json is a handoff-gate never_exempt path (Decision 203) -- closure
    follows git-ops handoff_sequence; the test names ".claude/settings.json" as a quoted token for
    --pre data-edge selection (Decision 135); request_credential's denial removes no documented
    recovery path (Decision 113).
  - >-
    Known gaps: project threads never load .claude/settings.json; the plugin ships the same file
    (marketplace source ./.claude) but plugin permission rules are unverified. Claude Docs' server
    instructions (~0.7k) persist unless the connector is switched off account-wide.
  - >-
    Forks decided by the user (AskUserQuestion, this session): rec-2982 separate plan next; deny set =
    environment-setup tools + Artifact family + Claude Docs (extras excluded); email = agent shows
    text in chat, sends on the user's 'send'. Not bundled: rec-2982, rec-4519, rec-3976.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - .claude/settings.json and tests/hooks/test_plugin_hooks.py read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    .claude/settings.json -- replace "deny": [] with the eleven blanket entries named in scope;
    touch no other key.
  - >-
    tests/hooks/test_settings_tool_denies.py -- class TestContextTrimDenies with exactly four
    non-parametrized tests: (a) the required set is a subset of permissions.deny and every required
    entry has no "(" specifier; (b) a reference scan over .claude/skills, .claude/commands,
    .claude/agents, .claude/hooks, docs/contracts, .github/prompts, .github/agents, config/agent and
    AGENTS.md finds no reference to a denied tool: each qualified entry and, for the
    mcp__claude-code-remote__ entries, its bare tool-name suffix as a case-sensitive whole word;
    mcp__Claude_Docs as a prefix; ArtifactComments and ArtifactData as whole words; and Artifact only
    in a tool-reference form (backticked, "Artifact tool", or "Artifact(") so prose never matches;
    exact names only, so the mcp__Claude_Code_Remote__* wildcard prose in git-ops.yaml and the
    overseer files never matches; (c) no permissions.allow entry equals a deny entry or starts with a
    deny entry followed by "__"; (d) tmp_path self-test: a fake tree whose skill names a denied tool
    is flagged by the same scan helper (proves (b) can fail). Name ".claude/settings.json" as a
    quoted path token (Decision 135).
  - >-
    Prove (a) bites: capture VP step 1's red output first; then temporarily drop "Artifact" from the
    deny list and confirm (a) fails; restore and confirm git diff shows only the intended entries.
  - Run VP steps 1-2; loop until pass (Decision 55).
  - >-
    Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence): readiness
    check (bin/venv-python -m scripts.session.github_readiness), graduation walk writes the
    settings-context-trim-denies shard and sets implementation_declared true, commit, fetch and
    rebase onto origin/main, VP step 3 on the committed clean tree, postflight evidence
    (bin/venv-python -m scripts.session.postflight --evidence), push as its own tool call, the PR
    (no Resolves trailer), subscribe_pr_activity; on green CI squash-merge and unsubscribe.
  - >-
    Hand back to the user with a pasteable prompt for a FRESH cloud session on main: "Run the
    post-merge steps of docs/plans/PLAN-startup-context-tool-denies.yaml: VP step 4, then the
    upstream reply step." (A fresh session is required: a running session keeps tool definitions it
    already sent.)
  - >-
    Fresh session: run VP step 4's command; ask the user to read the context panel's MCP tools and
    System tools lines; evaluate both thresholds.
  - >-
    Fresh session, upstream reply: find the user's existing vendor feedback thread on cloud
    environment setup in their sent mail (the user confirms the thread). Compose a reply of at most
    ten lines: (i) the environment-setup tools are always loaded, not deferred -- measured cost per
    session and per subagent for a one-time setup flow; (ii) the workaround -- blanket
    permissions.deny in the repo settings, with the merged PR link; (iii) the ask -- load these tools
    on demand (tool search) or only when the user asks to set up an environment; (iv) a one-line
    P.S. that plugin skills are not de-duplicated against identical repo skills in web sessions.
    Show the text in chat; send it as a reply in that thread only after the user replies 'send'.
  - >-
    Report (chat only): what was implemented, VP results, the panel and transcript figures, and the
    reply's sent timestamp (or that it was not sent).
work_areas: []
rollback: >-
  Revert the merge commit (settings entries, test module and the graduated shard
  config/agent/verification_registry/entries/settings-context-trim-denies.yaml). The tools return in
  the next fresh session; no data or infrastructure changes.
