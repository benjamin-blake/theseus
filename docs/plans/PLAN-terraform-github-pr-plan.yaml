schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: terraform-github-pr-plan
intent: 'Give terraform/github a live, read-only terraform plan on every PR that touches it, so the root''s first live provider
  contact happens before merge (the #1316 failure class) instead of at the operator''s hand apply. A new path-filtered workflow
  authenticates to GitHub with a short-lived token from a read-only otl-labs App and reads state through the planner role,
  and posts counts, actions and changed attribute names (never values). The root is recorded in environment-taxonomy.yaml
  as CI-planned and operator-applied, not admin-only. Satisfies github-org-transfer.yaml prerequisites.terraform-github-pr-time-plan;
  prerequisite for the rec-3136 state fix and every migration change under terraform/github. Closes rec-4335.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-terraform-github-pr-plan.yaml
phase: 'ad_hoc_rec (soft-warn exception category) -- resolves rec-4335 (Medium), a prerequisite named by docs/contracts/github-org-transfer.yaml
  (Decision 218). No tier_item criterion claimed. Adjacent: T2.48 (one more in-budget auto-apply data point), T2.54 (the new
  axis_a row is data for validate_admin_root_premerge_gate).'
scope:
- file: terraform/personal/oidc_pipeline_roles.tf
  action: Modify
  purpose: 'PR A only. Add one statement to data "aws_iam_policy_document" "github_ci_planner", directly after the TfstateNativeLockFile
    statement, verbatim as execution_steps[0]: Sid TfstateGithubRead, Allow, s3:GetObject on exactly "${aws_s3_bucket.data_lake.arn}/tfstate/github/terraform.tfstate",
    no condition. ci_full_refresh_read, every other statement and the trust policy stay byte-identical. In-budget aws_iam_role_policy
    UPDATE on a boundary-carrying agent-platform-* role, so it auto-applies at merge (Decision 144 cl.5); measured headroom
    7,031 of 10,240 B (live, 2026-10-15).'
- file: tests/test_terraform_github_pr_plan.py
  action: Create
  purpose: 'rec-4335''s acceptance file. PR A creates it with class TestPlannerStateGrant; PR B adds TestPlanReport and TestWorkflowAndTaxonomy
    (cases in execution_steps). Pure functions of repository text and fixture dicts: no network, no terraform, no AWS. Helpers
    stay local or come from tests/fixtures/ (no cross-test imports).'
- file: config/agent/verification_registry/entries/terraform-github-plan-planner-state-grant.yaml
  action: Create
  purpose: 'PR A. Graduation record for VP step 1: check_id == filename stem == graduation_check_id, primitive_slot test_selector,
    guard_target terraform/personal/oidc_pipeline_roles.tf, guard_symbol null, plan_slug terraform-github-pr-plan, graduated_at
    the implementation date, graduated_by implement-agent, check_spec.node_id "tests/test_terraform_github_pr_plan.py::TestPlannerStateGrant".'
- file: .github/workflows/terraform-github-plan.yml
  action: Create
  purpose: 'PR B. The WORKFLOW block in execution_steps[1], verbatim. Allowed variance: comment wording, step display names
    (keep the baseline keys in step with them), and a newer major of an action only if the pinned one does not resolve. Any
    change to triggers, the job if, permissions, the role, the session name, the token permissions, the plan flags, the visibility
    probe or the file-deletion step goes back to the planner.'
- file: scripts/ci/terraform_github_plan_report.py
  action: Create
  purpose: 'PR B. The stdlib-only reporter specified in execution_steps[2]: raw counts, verdict, per-resource address, action
    and changed attribute names, drift addresses, the VISIBILITY line, the machine line, and verdict/destructive outputs.
    Never prints a value. Well under 500 SLOC.'
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: 'PR B. Register every inline run body of the new workflow under r3_workflows (Decision 162 R3 workflow leg: a body
    with no entry fails), each at exactly its measured effective-line count from scripts.checks.ci_guards._workflow_shell_bodies.scan_workflow_bodies(),
    sorted with the existing keys, no marker (new entries are ceilings, not raises). No other entry changes.'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'PR B. Add the workflows-map row for the new workflow''s name, beside security-detector-liveness, verbatim: terraform-github-plan:
    {tier: not_a_gate, ci_rca: excluded, owner: platform, rationale: "PR-only advisory plan of terraform/github (rec-4335).
    ci-rca watches main only, and this workflow never runs there; a failure surfaces on the PR itself as a red check and a
    report comment."} (block style like its neighbours). No ci-rca.yml change.'
- file: docs/contracts/environment-taxonomy.yaml
  action: Modify
  purpose: PR B. Insert the APPROVED_ROW block (execution_steps[3]) as axis_a.github directly after axis_a.bootstrap, and
    prepend the APPROVED_AMENDMENT entry to amendment_log, verbatim; allowed variance the amendment date only. No other line
    changes.
- file: terraform/github/CLAUDE.md
  action: Modify
  purpose: PR B. Insert the APPROVED_SECTION block (execution_steps[4]) verbatim as a new section directly before "## tf-gated-apply
    Environment". No other line changes.
- file: config/agent/verification_registry/entries/terraform-github-plan-report-classifier.yaml
  action: Create
  purpose: 'PR B. Graduation record for VP step 4: primitive_slot test_selector, guard_target scripts/ci/terraform_github_plan_report.py,
    guard_symbol classify, plan_slug terraform-github-pr-plan, graduated_at and graduated_by as above, check_spec.node_id
    "tests/test_terraform_github_pr_plan.py::TestPlanReport".'
- file: config/agent/verification_registry/entries/terraform-github-plan-workflow-wiring.yaml
  action: Create
  purpose: 'PR B. Graduation record for VP step 5: primitive_slot test_selector, guard_target .github/workflows/terraform-github-plan.yml,
    guard_symbol null, plan_slug terraform-github-pr-plan, check_spec.node_id "tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy".'
bundled_recommendations:
- rec-4335
followon_recs:
- rec-4348
- rec-4349
- rec-4350
infrastructure_dependencies:
- 'PR A: terraform/personal planner inline-policy UPDATE, auto-applied at merge by terraform-apply-sandbox.yml (guard PASS
  predicted, in-budget per environment-taxonomy.yaml guard_classification); must be applied and verified (VP step 3) before
  PR B is pushed.'
- 'Operator console, before PR B is pushed: the otl-labs plan App created and installed, its key and the two repository variables
  stored (context: OPERATOR STEPS). Without them PR B''s job fails at CONFIG_MISSING.'
- No terraform/github apply, no state write, no change to any trust policy or OIDC subject.
acceptance_criteria:
- The planner role grants s3:GetObject on exactly tfstate/github/terraform.tfstate and nothing else on tfstate/github; the
  live policy simulates allowed for that call and implicitDeny for a PutObject on it and a GetObject on a sibling key.
- terraform-github-plan.yml runs on PR B, completes the plan (terraform exit 0 or 2), posts the report with a VISIBILITY line
  and the TF_GITHUB_PLAN_REPORT machine line, and leaves no plan file, plan text or variable value in the log, the comment
  or an artifact.
- The reporter's counts are raw, its VISIBILITY-GATED label fires only on the exact bypass_actors-only ruleset update while
  the probe says hidden, and it never prints a value (TestPlanReport).
- environment-taxonomy.yaml carries axis_a.github verbatim; validate_admin_root_premerge_gate still derives terraform/bootstrap
  and not terraform/github.
- rec-4335 is closed by PR B's squash merge (Resolves trailer) and its acceptance command passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: PR A -- the planner's new grant is exactly one GetObject on the one state object, and nothing else on tfstate/github
    anywhere in terraform/personal
  command: bin/venv-python -m pytest "tests/test_terraform_github_pr_plan.py::TestPlannerStateGrant" -q
  expected: every test passes; before the change the file does not exist (exit 4, red)
  fix_if: a red case passes silently, or the real-HCL case fails -- fix the HCL to the approved statement, never the test
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-github-plan-planner-state-grant
- step: 2
  phase: pre-deploy
  action: PR A -- the speculative plan on PR A shows the grant as the only change, and the guard predicts PASS
  command: 'echo ''VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="benjamin-blake", repo="theseus",
    pullNumber=<PR A>) -- read the "Terraform Speculative Plan" comment for the PR A head sha'''
  expected: Predicted guard verdict PASS; the plan's only change is an in-place update of aws_iam_role_policy.github_ci_planner
    adding the TfstateGithubRead statement. This comment is what the operator approves before PR A merges.
  fix_if: any other resource changes, or the verdict is BLOCKED or ERROR -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: post-deploy
  action: PR A applied -- the push-path apply-sandbox run is green and the live planner policy allows exactly the new read
  command: 'bin/venv-python -c "import boto3; s=boto3.Session(profile_name=''agent_platform_admin'', region_name=''eu-west-2'');
    a=s.client(''sts'').get_caller_identity()[''Account'']; iam=s.client(''iam''); r=''arn:aws:iam::''+a+'':role/agent-platform-github-ci-planner'';
    b=''arn:aws:s3:::agent-platform-data-lake/tfstate/github/''; d=lambda act,res: iam.simulate_principal_policy(PolicySourceArn=r,
    ActionNames=[act], ResourceArns=[res])[''EvaluationResults''][0][''EvalDecision'']; got=(d(''s3:GetObject'', b+''terraform.tfstate''),
    d(''s3:PutObject'', b+''terraform.tfstate''), d(''s3:GetObject'', b+''other.tfstate'')); print(''SIMULATE'', got); assert
    got==(''allowed'',''implicitDeny'',''implicitDeny''), got; print(''PLANNER_GITHUB_STATE_READ_OK'')"'
  expected: The terraform-apply-sandbox push run for the PR A merge commit is green (read via mcp__github__actions_list /
    actions_get), then SIMULATE ('allowed', 'implicitDeny', 'implicitDeny') and PLANNER_GITHUB_STATE_READ_OK. Read-only admin
    call (standing). Post only the SIMULATE tuple; never the role ARN or account id.
  fix_if: the apply run is red or routed -- follow deploy-paths.yaml's reconcile row, never a local apply; a decision other
    than the expected tuple -- stop and RCA (Decision 55)
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: PR B -- the reporter's counts, verdict, gating rule, drift section, fail-closed paths and never-a-value guarantee
  command: bin/venv-python -m pytest "tests/test_terraform_github_pr_plan.py::TestPlanReport" -q
  expected: every test passes; before the change the class does not exist (exit 4, red)
  fix_if: a masking case labels a real change as gated, or a sentinel value reaches the output -- fix the reporter
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-github-plan-report-classifier
- step: 5
  phase: pre-deploy
  action: PR B -- the workflow's triggers, guards, permissions, credentials, plan flags and cleanup; the taxonomy row; the
    CLAUDE.md pointer
  command: bin/venv-python -m pytest "tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy" -q
  expected: every test passes; before the change the class does not exist (exit 4, red)
  fix_if: a shape assertion fails -- restore the planned workflow or approved text; never loosen the test
  hermetic: true
  graduation: graduate
  graduation_check_id: terraform-github-plan-workflow-wiring
- step: 6
  phase: pre-deploy
  action: PR B -- approved text landed verbatim (taxonomy row and amendment, CLAUDE.md section) and the workflow matches the
    planned block apart from comments and step names
  command: 'bin/venv-python -c "import yaml,textwrap; p=yaml.safe_load(open(''docs/plans/PLAN-terraform-github-pr-plan.yaml''))[''execution_steps''];
    cut=lambda t,a,b: textwrap.dedent(t.split(a+''\n'',1)[1].split(''\n''+b,1)[0] if b else t.split(a+''\n'',1)[1]); tax=yaml.safe_load(open(''docs/contracts/environment-taxonomy.yaml''));
    assert tax[''axis_a''][''github'']==yaml.safe_load(cut(p[3],''APPROVED_ROW:'',''APPROVED_AMENDMENT:''))[''github''], ''row'';
    want=yaml.safe_load(cut(p[3],''APPROVED_AMENDMENT:'',''''))[0]; got=tax[''amendment_log''][0]; assert {k:v for k,v in
    got.items() if k!=''date''}=={k:v for k,v in want.items() if k!=''date''}, ''amendment''; sec=cut(p[4],''APPROVED_SECTION:'','''').strip();
    assert sec in open(''terraform/github/CLAUDE.md'').read(), ''section''; strip=lambda d: {**d, ''jobs'': {j: {**v, ''steps'':
    [{k:x for k,x in s.items() if k!=''name''} for s in v[''steps'']]} for j,v in d[''jobs''].items()}}; assert strip(yaml.safe_load(open(''.github/workflows/terraform-github-plan.yml'')))==strip(yaml.safe_load(cut(p[1],''WORKFLOW:'',''''))),
    ''workflow''; print(''APPROVED TEXT VERBATIM'')"'
  expected: exit 0, APPROVED TEXT VERBATIM printed
  fix_if: any assertion names a block -- restore the approved text; a needed wording change goes back to the operator
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Binds to this plan's historical approved blocks, which later amendments may legitimately change;
    step 5 graduates the structural shape.
- step: 7
  phase: pre-deploy
  action: Fast tier, on each PR before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0; on PR B validate_composite_action_shell_bodies, validate_ci_rca_adjudication, validate_graduation_completeness,
    validate_contract_drift, validate_actions_account_id_masking and validate_admin_root_premerge_gate PASS
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run over diff-relative state; graduate steps may not invoke scripts.validate
    (recursion), and steps 1, 4 and 5 carry the durable regressions.
- step: 8
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before each commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start; never push on a partial or timed-out run
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is
    the handoff gate, not a regression check.
- step: 9
  phase: pre-deploy
  action: PR B live proof -- PR B's own terraform-github-plan run, the root's first live plan
  command: 'echo ''VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="benjamin-blake", repo="theseus",
    workflow_id="terraform-github-plan.yml") for the PR B head sha, then mcp__github__get_job_logs for the plan job, and mcp__github__pull_request_read(method="get_comments")
    for the report comment'''
  expected: 'The job is green: CONFIG_OK, REVIEWERS_RESOLVED, terraform exit 2 (or 0), the report comment present. Expected
    content (rec-3136''s run-1 evidence, not acted on here): verdict CHANGES with about five in-place updates on the resources
    still keyed on the old repository name, destroy=0, replace=0, and a VISIBILITY line for both fields. The log carries no
    plan diff text (no "will be updated in-place" line) and no reviewer id. Record the machine line, the VISIBILITY line and
    the run URL in /mnt/project-files/terraform-github-pr-plan/evidence-first-run.md (counts and names only).'
  fix_if: CONFIG_MISSING -- an operator console step is not done; tell the operator which name. Plan exit 1, a 403 "Resource
    not accessible by integration", or a destroy/replace -- stop, never widen the App permissions or retry blind, and send
    the diagnostic to the planner through the coordinator (Decision 55).
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: Closure -- rec-4335 closed by PR B's squash merge
  command: AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;r=f('rec-4335');assert
    r and r['status']=='closed',(r or {}).get('status');print('REC_4335_CLOSED')"
  expected: 'Exit 0 and REC_4335_CLOSED printed, after ci.yml''s closure job runs on the squash merge carrying "Resolves:
    rec-4335"'
  fix_if: still open -- read the trailer-closure job log; the acceptance pytest must pass at main
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: terraform/personal/oidc_pipeline_roles.tf
  behavior: the planner reads exactly the one terraform/github state object and nothing else on tfstate/github
  verification_step: 1
  test_selector: tests/test_terraform_github_pr_plan.py::TestPlannerStateGrant
  red_green_expectation: red before (statement and class absent), green after
- source: scripts/ci/terraform_github_plan_report.py
  behavior: raw counts, the strict gating rule, drift kept separate, fail-closed input handling, no value ever printed
  verification_step: 4
  test_selector: tests/test_terraform_github_pr_plan.py::TestPlanReport
  red_green_expectation: red before (module and class absent), green after
- source: .github/workflows/terraform-github-plan.yml
  behavior: PR-only path-filtered trigger, same-repo non-Dependabot guard, planner PR-sub with a non-reserved session, read-only
    narrowed App token, read-only plan with text discarded, files deleted, no apply or upload
  verification_step: 5
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (workflow and class absent), green after
- source: docs/contracts/environment-taxonomy.yaml
  behavior: axis_a.github records the CI-planned operator-applied root and is not derived as admin-only
  verification_step: 5
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (row absent), green after
- source: terraform/github/CLAUDE.md
  behavior: the directory rules point at the PR-time plan workflow
  verification_step: 5
  test_selector: tests/test_terraform_github_pr_plan.py::TestWorkflowAndTaxonomy
  red_green_expectation: red before (pointer absent), green after
- source: config/composite_action_body_baseline.yaml
  behavior: every inline run body of the new workflow has an r3_workflows ceiling
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (R3-workflow reports each unregistered body), green after
- source: config/ci_rca_taxonomy.yaml
  behavior: the new workflow is classified (not_a_gate, excluded) so the ci-rca adjudication stays exhaustive
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (the new workflow name has no taxonomy row), green after
- source: config/agent/verification_registry/entries/terraform-github-plan-planner-state-grant.yaml
  behavior: step 1's graduated check is admitted under this plan's slug
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: config/agent/verification_registry/entries/terraform-github-plan-report-classifier.yaml
  behavior: step 4's graduated check is admitted under this plan's slug
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
- source: config/agent/verification_registry/entries/terraform-github-plan-workflow-wiring.yaml
  behavior: step 5's graduated check is admitted under this plan's slug
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  red_green_expectation: red before (a graduate step with no registry row fails validate_graduation_completeness), green after
constraints:
- 'Approved text is verbatim: APPROVED_ROW, APPROVED_AMENDMENT (variance: date only), APPROVED_SECTION, and the WORKFLOW block
  (variance: comments, step display names, an action major only if the pinned one does not resolve). Anything else goes back
  to the operator through the planner.'
- 'IAM is always-ask: PR A merges only on the operator''s own typed word in the build thread naming PR A, after the speculative-plan
  comment (VP step 2) is shown. Exactly one statement is added; no trust, boundary, role or other policy change.'
- No terraform/github .tf change, no apply of any root by an agent, no state write; the workflow never applies, imports or
  touches state beyond the plan's read.
- 'Public repo (Decision 101): no account id, ARN, numeric user id, token or plan value in any file, log line, comment, artifact
  or evidence; plan text goes to /dev/null; plan.bin and plan.json are deleted in-job and never uploaded (rec-4230).'
- 'Not a required check (Decision 83): never add terraform-github-plan to repo.tf''s required_status_checks or to ci.yml''s
  signal-green needs in this plan.'
- Never widen the App beyond Metadata, Administration and Actions read, and never add ignore_changes on bypass_actors, to
  silence a diff (github-org-transfer.yaml breakage_map.terraform_github_root).
- 'Files outside scope stay untouched, notably ci.yml, terraform-apply-sandbox.yml, the shared composite actions, deploy-paths.yaml
  (open IAM-refactor PR #1500 edits it) and github-org-transfer.yaml.'
- No rescue agents or workaround loops (Decision 55).
context:
- 'Decision-scout verdict: FLAGS_FOUND -- SPIRIT NOTE Decision 205 (secrets in a pull_request job) -> operator chose F1-A,
  accepted residual recorded below; Decision 162 R3 -> config/composite_action_body_baseline.yaml added to scope; Decision
  101 -> plan text to /dev/null; Decision 126 cl.1 -> the row is worded as a recorded carve-out; Decision 190 -> resource_drift
  reported separately. CITE: Decision 218, 198, 77, 92, 144, 126, 83, 101, 119, 162, 48. Decisions triaged: 171 of 171. Roadmap
  items intersected: 3; CONFLICT: 0; RELATED: 3'
- 'gates: decision-scout=FLAGS_FOUND; plan-critique=<verdict> after <N> round(s)'
- 'Step 6b (Benjamin, 2026-10-15, thread message cmsg_017f94mmYqSe3q2p9o6tPW3UXPtLoJDpYr4dee7sinLKwW, ''happy with your recommendations.
  write the plan''): F1-A repository secret with the residual recorded, F2-A reviewer-logins variable, F3-A red on plan error
  and on destroy/replace; APPROVED_ROW, APPROVED_AMENDMENT and APPROVED_SECTION approved verbatim, variance the amendment
  date only. Evidence: /mnt/project-files/terraform-github-pr-plan/ (fable-brief/BRIEF.md, ADVICE.md, step6b-presentation.md).'
- 'OPERATOR STEPS (console, always-ask, before PR B): (1) create an otl-labs GitHub App, public until the transfer, webhook
  off, repository permissions Metadata, Administration, Actions read-only only; (2) generate a key; (3) install it on the
  personal account, this repository only; (4) secret TF_GITHUB_PLAN_APP_PRIVATE_KEY, variables TF_GITHUB_PLAN_APP_CLIENT_ID
  and TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS (comma-separated). No running cost.'
- 'Sequencing: PR A (grant) merges and applies first, then PR B, whose own run is the live proof (IAM-before-consumer, ci.yml
  terraform-validate comment). One harness branch: after PR A squash-merges, restart the branch from main for PR B. PR B needs
  the operator''s code-owner approval (CODEOWNERS covers /.github/workflows/terraform-*.yml and /terraform/github/).'
- 'rec-3136 (state fix) starts after PR B merges. Its thread confirmed state keys all five resources on the old name, so PR
  B''s run should read about five in-place updates, no replace: rec-3136''s run 1, recorded, not acted on.'
- 'Visibility (GitHub docs, provider v6.12.1 source, 2026-10-15): bypass_actors reaches only ruleset-write callers (phantom
  +1 actor diff when hidden); security_and_analysis only admins (provider skips it, no diff; ghas-probe.yml is the live control).
  Environments need Actions read; Actions settings and vulnerability alerts need Administration read.'
- 'terraform show -json prints sensitive variables in plain text: plan.json holds the App token, so it never leaves the runner.'
- 'Accepted residual (Decision 205 note, F1-A): a same-repo PR author can edit the workflow and read the App key -- the principals
  who already hold the planner''s PR-sub writes; the App is read-only on one repository and the token is narrowed at mint.
  Rotate the key when the App goes private after the transfer.'
- 'After the transfer no workflow edit is needed: the token action discovers the installation from the repository path, so
  breakage_map.terraform_github_plan_app''s ''swap the installation reference'' is the console install on otl-labs.'
- 'Overlap (2026-10-15): the telemetry-capture stream touches .claude/hooks and settings only; IAM refactor PR #1500 touches
  terraform/bootstrap and deploy-paths.yaml; the OIDC pre-stage plan edits local.github_repos. No shared file; the workflow
  is new.'
- 'Land before the OIDC pre-stage build PR merges (its freeze point): github-org-transfer.yaml''s pre_stage phase lists this
  prerequisite, and the operator froze other repo work from there until the transfer is proven (2026-10-15).'
- 'Deferred at the operator''s request as follow-on recs (same message): rec-4348 typed pre_merge_live_contact field for the
  validator (Fable Q4), rec-4349 deploy-paths.yaml pointer to this CI plan (Fable Q4; off the file while PR #1500 edits it),
  rec-4350 evidence_ledger entry for the probe results (Fable Q8).'
- 'CI-RCA: no open critical rec at plan start (ci_rca_open empty, 2026-10-15).'
- 'rec-4335''s acceptance is the step 1/4/5 test file (Decision 201): only PR B''s squash body carries ''Resolves: rec-4335'';
  PR A carries none.'
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- The operator's console steps (context OPERATOR STEPS) are done before PR B is pushed
execution_steps:
- |-
  PR A (grant first). terraform/personal/oidc_pipeline_roles.tf -- in data "aws_iam_policy_document" "github_ci_planner", directly after the TfstateNativeLockFile statement, insert this statement verbatim (two-space indent as shown):
    statement {
      # rec-4335: the PR-time terraform/github plan (terraform-github-plan.yml) reads that root's
      # state. GetObject on the ONE state object only -- no PutObject (the plan runs -lock=false, so
      # no .tflock write) and no other key under tfstate/github/.
      sid       = "TfstateGithubRead"
      effect    = "Allow"
      actions   = ["s3:GetObject"]
      resources = ["${aws_s3_bucket.data_lake.arn}/tfstate/github/terraform.tfstate"]
    }
  Then create tests/test_terraform_github_pr_plan.py with class TestPlannerStateGrant, a pure predicate over HCL text, run on the real file and on synthetic red cases: (a) the github_ci_planner policy document carries exactly one statement whose resources mention tfstate/github -- sid TfstateGithubRead, effect Allow, actions exactly ["s3:GetObject"], resources exactly ["${aws_s3_bucket.data_lake.arn}/tfstate/github/terraform.tfstate"], no condition; (b) with comments stripped, the literal "tfstate/github" appears in no other statement of any terraform/personal/*.tf file; (c) ci_full_refresh_read's TfstateRead still names only tfstate/personal/*; red cases on synthetic HCL, each failing the predicate: a tfstate/github/* wildcard, an added s3:PutObject, the grant placed in ci_full_refresh_read, the grant placed in github_ci_pr's policy. Reuse tests/fixtures/terraform_hcl_blocks.py helpers where they fit. Create the step 1 registry entry. Run VP steps 1, 7 and 8, open PR A (no Resolves trailer), read the speculative-plan comment (VP step 2), and post in the build thread the plan's change line, the predicted verdict and the exact statement, asking the operator to reply "merge PR A". Merge only on that typed word, then watch the push-path apply and run VP step 3.
- |-
  PR B. .github/workflows/terraform-github-plan.yml -- create it with the WORKFLOW block below, verbatim (allowed variance: scope row). Every inline run body gets an r3_workflows ceiling (scope row for config/composite_action_body_baseline.yaml).
  WORKFLOW:
    name: terraform-github-plan

    # PR-time read-only plan of terraform/github (rec-4335; docs/contracts/github-org-transfer.yaml
    # prerequisites.terraform-github-pr-time-plan). The root is applied by hand by the operator and never
    # auto-applies (Decision 77); this job gives every PR that touches it a live provider contact BEFORE
    # merge (the #1316 failure class). Advisory: NOT a required check (Decision 83). It never applies. The
    # plan's own text never reaches the public log (stdout discarded); plan.bin and plan.json never leave
    # the runner -- both carry variable values, the App token included, in plain text (rec-4230).
    #
    # Credentials: AWS through OIDC as agent-platform-github-ci-planner under its PR-sub trust with a
    # NON-reserved role-session-name (Decision 92 pt2), whose only grant on this root's state is
    # s3:GetObject on tfstate/github/terraform.tfstate; GitHub through a short-lived installation token
    # from the read-only otl-labs plan App (Metadata, Administration and Actions read), scoped to this
    # repository, narrowed at mint time and revoked at job end. Same-repo, non-Dependabot PRs only: forks
    # and Dependabot runs receive no repository secrets. Accepted residual (Decision 205's
    # secrets-in-a-pull_request-job note): a same-repo PR author can edit this file and read the App key;
    # the App is read-only and installed on this one repository.

    on:
      pull_request:
        paths:
          - 'terraform/github/**'
          - '.github/workflows/terraform-github-plan.yml'

    permissions:
      contents: read

    concurrency:
      group: terraform-github-plan-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    jobs:
      plan:
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
          id-token: write       # OIDC for the planner role (PR-sub, non-reserved session)
          contents: read
          pull-requests: write  # post the plan report comment
        env:
          TF_IN_AUTOMATION: "1"
          TF_INPUT: "0"
          WORKDIR: terraform/github
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}

        steps:
          - uses: actions/checkout@v7

          - name: Check plan configuration
            env:
              APP_CLIENT_ID: ${{ vars.TF_GITHUB_PLAN_APP_CLIENT_ID }}
              APP_PRIVATE_KEY_SET: ${{ secrets.TF_GITHUB_PLAN_APP_PRIVATE_KEY != '' }}
              REVIEWER_LOGINS: ${{ vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS }}
            run: |
              missing=""
              [ -n "$APP_CLIENT_ID" ] || missing="$missing variable:TF_GITHUB_PLAN_APP_CLIENT_ID"
              [ "$APP_PRIVATE_KEY_SET" = "true" ] || missing="$missing secret:TF_GITHUB_PLAN_APP_PRIVATE_KEY"
              [ -n "$REVIEWER_LOGINS" ] || missing="$missing variable:TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS"
              if [ -n "$missing" ]; then
                echo "::error::CONFIG_MISSING${missing} (terraform/github/CLAUDE.md, PR-time plan)"
                exit 1
              fi
              echo "CONFIG_OK"

          - name: Configure AWS credentials (OIDC -- planner role, PR-sub, non-reserved session)
            uses: aws-actions/configure-aws-credentials@v6
            with:
              role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-planner
              role-session-name: terraform-github-plan-pr
              aws-region: eu-west-2

          - name: Mint the read-only plan App token (this repository only)
            id: app_token
            uses: actions/create-github-app-token@v3
            with:
              client-id: ${{ vars.TF_GITHUB_PLAN_APP_CLIENT_ID }}
              private-key: ${{ secrets.TF_GITHUB_PLAN_APP_PRIVATE_KEY }}
              permission-metadata: read
              permission-administration: read
              permission-actions: read

          - name: Resolve reviewer ids (kept out of the log)
            # The ids go to a runner-temp file, never to an env block or GITHUB_ENV, both of which the
            # public log echoes. Logins are public (CODEOWNERS); the variable holds logins, never ids.
            env:
              GH_TOKEN: ${{ steps.app_token.outputs.token }}
              REVIEWER_LOGINS: ${{ vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS }}
            run: |
              ids=""
              for login in ${REVIEWER_LOGINS//,/ }; do
                id=$(gh api "users/${login}" --jq .id) || { echo "::error::REVIEWER_LOOKUP_FAILED ${login}"; exit 1; }
                ids="${ids:+${ids},}${id}"
              done
              [ -n "$ids" ] || { echo "::error::REVIEWER_LOOKUP_FAILED no login resolved"; exit 1; }
              printf '[%s]' "$ids" > "$RUNNER_TEMP/reviewer_ids"
              echo "REVIEWERS_RESOLVED"

          - name: Read pinned Terraform version
            id: tfver
            run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v4
            with:
              terraform_version: ${{ steps.tfver.outputs.version }}
              terraform_wrapper: false

          - name: Setup Python 3.12
            uses: actions/setup-python@v7
            with:
              python-version: '3.12'

          - name: Terraform init (S3 backend, lock file read-only)
            working-directory: ${{ env.WORKDIR }}
            run: terraform init -input=false -lockfile=readonly

          - name: Terraform plan (read-only, -lock=false, text never logged)
            id: plan
            working-directory: ${{ env.WORKDIR }}
            env:
              TF_VAR_github_token: ${{ steps.app_token.outputs.token }}
            run: |
              TF_VAR_gated_apply_reviewer_user_ids="$(cat "$RUNNER_TEMP/reviewer_ids")"
              export TF_VAR_gated_apply_reviewer_user_ids
              set +e
              terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=plan.bin > /dev/null
              rc=$?
              set -e
              echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
                echo "::error::TF_GITHUB_PLAN_FAILED terraform plan exited ${rc} (diagnostics above)"
                exit 1
              fi
              terraform show -json plan.bin > plan.json
              rm -f plan.bin

          - name: Probe what the plan App can see
            # The two fields GitHub returns only to admin or ruleset-write callers
            # (github-org-transfer.yaml breakage_map.terraform_github_root): true / false / unknown each.
            env:
              GH_TOKEN: ${{ steps.app_token.outputs.token }}
              REPO: ${{ github.repository }}
            run: |
              set +e
              san=$(gh api "repos/${REPO}" --jq 'has("security_and_analysis")' 2>/dev/null)
              [ -n "$san" ] || san=unknown
              bypass=unknown
              rid=$(gh api "repos/${REPO}/rulesets" --jq '.[] | select(.name == "main-protection") | .id' 2>/dev/null)
              if [ -n "$rid" ]; then
                bypass=$(gh api "repos/${REPO}/rulesets/${rid}" --jq 'has("bypass_actors")' 2>/dev/null)
                [ -n "$bypass" ] || bypass=unknown
              fi
              printf '{"security_and_analysis": "%s", "ruleset_bypass_actors": "%s"}\n' "$san" "$bypass" > "$RUNNER_TEMP/visibility.json"
              cat "$RUNNER_TEMP/visibility.json"

          - name: Report (counts and attribute names only, never values)
            id: report
            working-directory: ${{ env.WORKDIR }}
            env:
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              PLAN_EXIT: ${{ steps.plan.outputs.exit_code }}
            run: |
              python3 "$GITHUB_WORKSPACE/scripts/ci/terraform_github_plan_report.py" \
                --plan-json plan.json --visibility "$RUNNER_TEMP/visibility.json" --plan-exit-code "$PLAN_EXIT" \
                --head-sha "$HEAD_SHA" --run-url "$RUN_URL" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/report.md"
              cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/report.md"

          - name: Post the report on the PR
            if: always() && steps.plan.outcome != 'skipped'
            env:
              GH_TOKEN: ${{ github.token }}
              REPO: ${{ github.repository }}
              PR_NUM: ${{ github.event.pull_request.number }}
              HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              PLAN_OUTCOME: ${{ steps.plan.outcome }}
              REPORT_OUTCOME: ${{ steps.report.outcome }}
            run: |
              if [ "$REPORT_OUTCOME" = "success" ]; then
                body=$(cat "$RUNNER_TEMP/report.md")
              else
                body="### terraform/github PR-time plan (rec-4335)"$'\n\n'"**FAILED** at head \`${HEAD_SHA}\` (plan step: ${PLAN_OUTCOME}, report step: ${REPORT_OUTCOME}). Read the run log: ${RUN_URL}"
              fi
              gh pr comment "$PR_NUM" --repo "$REPO" --body "$body" || true

          - name: Fail on destroy or replace
            if: steps.report.outputs.destructive == 'true'
            run: |
              echo "::error::TF_GITHUB_PLAN_DESTRUCTIVE the plan destroys or replaces a resource; read the PR comment before any apply"
              exit 1

          - name: Delete plan files (never persisted or uploaded)
            if: always()
            working-directory: ${{ env.WORKDIR }}
            run: rm -f plan.bin plan.json
- |-
  PR B. scripts/ci/terraform_github_plan_report.py, per this spec:
  scripts/ci/terraform_github_plan_report.py -- stdlib only (argparse, json, sys, pathlib, typing, __future__); invoked by
  path with python3 (never `-m scripts.`, no third-party import), so validate_workflow_dependency_install needs no install step.
  CLI: --plan-json PATH --visibility PATH --plan-exit-code {0,2} --head-sha SHA --run-url URL [--github-output PATH]
  Writes the markdown report to stdout and exits 0. Exits 2 (one line on stderr, nothing on stdout) when the plan JSON is
  missing, unreadable, not an object, or has no resource_changes list (fail closed). A missing or unreadable visibility file
  is not an error: every field is then "unknown". With --github-output, appends `verdict=<v>` and
  `destructive=<true|false>` lines to that file.

  Public functions (tested directly):
    load_visibility(path) -> dict[str, str]  # per field "visible" | "hidden" | "unknown"; only the JSON string "false"
                                             # maps to hidden and "true" to visible
    classify(plan: dict, visibility: dict[str, str]) -> Report  # pure
    render(report, head_sha, run_url, plan_exit_code) -> str     # pure

  Per resource_changes[] entry rc (mode == "data" ignored):
    actions = rc["change"]["actions"]; importing = bool(rc["change"].get("importing"))
    - importing -> import += 1 (["no-op"] + importing is import only)
    - ["create"] -> add += 1; ["update"] -> change += 1; ["delete"] -> destroy += 1;
      ["delete","create"] or ["create","delete"] -> replace += 1, add += 1, destroy += 1 (terraform's own summary counting)
    - ["no-op"] or ["read"] without importing -> not listed
    - changed attribute NAMES: sorted top-level keys k with change.before.get(k) != change.after.get(k), plus keys whose
      change.after_unknown[k] holds a literal true anywhere (recursive -- after_unknown nests lists and maps of false)
    - row label VISIBILITY-GATED iff ALL hold: rc["type"] == "github_repository_ruleset"; actions == ["update"]; not
      importing; visibility["ruleset_bypass_actors"] == "hidden"; changed names == ["bypass_actors"]; and
      change.before.get("bypass_actors") in (None, []).
    Counts are RAW: a gated row still counts in change (the classifier never subtracts). Nothing else is ever labelled.
  Per resource_drift[] entry (Decision 190: kept separate from resource_changes): drift += 1; address listed by name only.

  verdict: NO_CHANGES when no row is listed; VISIBILITY_GATED_ONLY when every listed row is gated; otherwise CHANGES.
  destructive: true when destroy + replace > 0.

  render (exact first lines; table rows sorted by address):
    ### terraform/github PR-time plan (rec-4335)
    PR head `<sha>` - [run](<url>) - read-only and advisory: it never applies.
    **<verdict>**: <i> to import, <a> to add, <c> to change, <d> to destroy (<r> replaced, <g> visibility-gated, <x> drifted; terraform exit <e>)
    VISIBILITY: security_and_analysis=<v> ruleset_bypass_actors=<v>
    then: when security_and_analysis is not visible, "Secret-scanning fields are UNVERIFIED by this plan (the App cannot
    read them); ghas-probe.yml is the live control."; when any row is gated, "Visibility-gated rows change only a field
    the App cannot read; the operator's own plan is authoritative for it (github-org-transfer.yaml
    breakage_map.terraform_github_root)."; when destructive, "DESTROY OR REPLACE present: this job fails; do not apply
    without reading this."; a table | Resource | Action | Changed attributes | per listed row (gated rows marked
    "(visibility-gated)") or "No changes."; a "Drift detected outside Terraform:" line naming drifted addresses when drift
    > 0; last line, machine-readable:
    TF_GITHUB_PLAN_REPORT verdict=<v> import=<i> add=<a> change=<c> destroy=<d> replace=<r> gated=<g> drift=<x> exit=<e>
  Never prints any value from change.before / change.after / after_unknown, nor variables, prior_state, configuration,
  planned_values or output_changes.
- |-
  PR B. docs/contracts/environment-taxonomy.yaml -- insert APPROVED_ROW as axis_a.github directly after the axis_a.bootstrap row (two-space indent as shown), and prepend APPROVED_AMENDMENT as the first amendment_log entry. Allowed variance: the amendment date only.
  APPROVED_ROW:
    github:
      money_real: "N/A (GitHub repository settings: ruleset, Environments, Actions permissions, secret scanning)"
      code_vs_infra: "terraform/github/ only"
      apply_gating: >-
        operator hand apply only (classic admin PAT), NEVER auto-apply (Decision 77), a recorded
        carve-out from Decision 126's CI-applies infra trigger; not admin-only: its pre-merge live
        provider contact is the read-only PR-time CI plan (terraform-github-plan.yml, rec-4335), so
        deploy-paths.yaml admin_out_of_band.pre_merge_live_plan does not apply to it
      account: "GitHub repository settings; state in the current personal account"
  APPROVED_AMENDMENT:
    - date: "2026-10-15"
      semantic_break: false
      change_class: field_add
      summary: >-
        PLAN-terraform-github-pr-plan (rec-4335): axis_a gains a github row recording terraform/github's
        existing operator hand apply and its new read-only PR-time CI plan, the root's pre-merge live
        provider contact. The row is not admin-only, so validate_admin_root_premerge_gate still derives
        only terraform/bootstrap. No apply-model or guard-classification field changed.
- |-
  PR B. terraform/github/CLAUDE.md -- insert APPROVED_SECTION verbatim, followed by one blank line, directly before the line "## tf-gated-apply Environment".
  APPROVED_SECTION:
  ## PR-time plan (rec-4335)

  Every pull request that touches `terraform/github/**` runs `.github/workflows/terraform-github-plan.yml`:
  a read-only `terraform plan -lock=false` against live GitHub and this root's state. It never applies,
  it is advisory (not a required check), and it posts counts, per-resource actions and changed attribute
  names on the PR, never values. It is this root's pre-merge live provider contact; agent sessions cannot
  plan this root themselves.

  - It authenticates with a short-lived token from the read-only otl-labs plan App (Metadata,
    Administration and Actions read) and reads state through the planner role.
  - Its VISIBILITY line says whether the App can see `security_and_analysis` and the ruleset's
    `bypass_actors`. While either is hidden, the operator's own plan is authoritative for that field.
  - It fails on a plan error and on any destroy or replace. Read its comment before merging; the operator
    still applies the merged change by hand with the runbook above.
  - Configuration: repository secret `TF_GITHUB_PLAN_APP_PRIVATE_KEY`; repository variables
    `TF_GITHUB_PLAN_APP_CLIENT_ID` and `TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS` (the reviewers' logins,
    resolved to ids at run time).
- |-
  PR B. tests/test_terraform_github_pr_plan.py -- add two classes (fixtures are inline dicts; helpers local or in tests/fixtures/):
  TestPlanReport (imports scripts.ci.terraform_github_plan_report): a no-op plan is NO_CHANGES with all counts 0 and destructive false; a ruleset update whose only changed key is bypass_actors (before [], after one actor) with the probe hidden is labelled visibility-gated, still counts change=1 (raw), verdict VISIBILITY_GATED_ONLY; the same row with the probe visible, and with it unknown, is not gated (verdict CHANGES); bypass_actors plus any other changed key is not gated; a non-empty before bypass_actors is not gated; one gated row plus another update is verdict CHANGES with gated=1; an import-only row counts import=1, change=0; ["delete","create"] counts replace=1, add=1, destroy=1 and destructive true; ["delete"] is destructive; after_unknown holding only nested false adds no changed name and a nested true does; resource_drift entries count in drift only and are listed by address; mode "data" rows are ignored; sentinel strings placed in before, after, after_unknown, variables, prior_state and configuration never appear in the rendered output; load_visibility maps "false" to hidden, "true" to visible, anything else and a missing file to unknown; main() with an unreadable or non-object plan JSON exits 2 with empty stdout; main() with --github-output appends verdict= and destructive= lines; the last stdout line starts "TF_GITHUB_PLAN_REPORT verdict="; the module imports only stdlib modules (ast walk against an allowlist).
  TestWorkflowAndTaxonomy (yaml.safe_load; the "on" key loads as True): triggers are exactly pull_request with paths ['terraform/github/**', '.github/workflows/terraform-github-plan.yml'] and nothing else (no push, schedule, workflow_dispatch, pull_request_target, workflow_run); the job if requires head.repo.full_name == github.repository and github.actor != 'dependabot[bot]'; top-level permissions are exactly contents: read and job permissions exactly id-token: write, contents: read, pull-requests: write; the configure-aws-credentials step's role-to-assume references secrets.AWS_ACCOUNT_ID and ends role/agent-platform-github-ci-planner, its role-session-name is terraform-github-plan-pr and differs from local.convergence_writer_session_name read from terraform/personal/oidc.tf, and it has no continue-on-error; the create-github-app-token step's with keys are exactly client-id, private-key, permission-metadata, permission-administration, permission-actions, every permission value is read, and no owner or repositories input is set; the plan step's run carries -lock=false, -detailed-exitcode and "> /dev/null"; no run body anywhere in the file contains "terraform apply", "terraform import", "state rm", "state mv", "state push", "force-unlock", "aws s3", or writes GITHUB_ENV, and no step uses actions/upload-artifact; an if: always() step removes plan.bin and plan.json; no step env value names reviewer ids (the ids flow only through the runner-temp file); "terraform-github-plan" does not appear in terraform/github/repo.tf; environment-taxonomy.yaml axis_a.github exists, its code_vs_infra names terraform/github, its apply_gating names terraform-github-plan.yml and "NEVER auto-apply" and does not start with "admin-only"; scripts.checks.verification.validate_admin_root_premerge_gate._derive_admin_only_roots on the real taxonomy returns no error and includes terraform/bootstrap but not terraform/github; terraform/github/CLAUDE.md contains ".github/workflows/terraform-github-plan.yml".
  Create the step 4 and step 5 registry entries. Register the workflow's inline bodies in config/composite_action_body_baseline.yaml r3_workflows at their measured counts.
- 'PR B sequence: after PR A is applied (VP step 3) and the operator confirms the console steps, restart the harness branch
  from main, implement execution_steps[1]-[5], run VP steps 4-8, push and open PR B. Its own terraform-github-plan run is
  VP step 9; write the evidence file and post the counts-only result in the build thread. A CONFIG_MISSING, plan exit 1, 403
  or destroy/replace result stops the build (fix_if). Merge on code-review PROCEED, green CI and the operator''s code-owner
  approval on GitHub, squash body carrying "Resolves: rec-4335"; then run VP step 10 and tell the coordinator so the rec-3136
  build can start.'
- Execute the Verification Plan in step order across the two PRs; loop until each step passes; on an unrecoverable V3 failure
  stop and RCA (Decision 55).
- 'Report: what was implemented in each PR, the VP results, the SIMULATE tuple, PR B''s machine line and VISIBILITY line,
  and the evidence file path.'
rollback: 'PR A: revert the PR; the next apply removes the statement (an in-budget update). PR B: revert the PR; nothing live
  changes (the workflow only reads). Console: uninstall the App from the personal account and delete the secret and variables.
  No terraform/github state or setting is ever written by this plan.'
