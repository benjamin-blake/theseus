  expected: Exit 0 and one stdout line reading BEFORE_OK lies=last_session_oldest,recent_sessions_oldest,dq_dead_dir,dq_fail_suppressed,endstate_reason_absent,provisional_silent_truncation. All six names are what the command asserts; a shorter list aborts on the length assertion.
  fix_if: 'BEFORE_WORKTREE_FAILED means origin/main is unreachable in this checkout -- fetch it and re-run; it is never evidence that the defects are absent. An AssertionError printing fewer than six names means someone else already fixed one of these rows on main: read which name is missing and re-scope that row out of this plan rather than re-applying it. Never relax the assertion to make the step pass.'
