- step: 2
  phase: pre-deploy
  action: RED leg, proven against a real origin/main worktree rather than asserted. Materialize a detached worktree at origin/main, copy ONLY the five test modules into it so the tree differs from origin/main in the tests alone and never in context_docs.py or summary.py, run them, and require pytest exit code 1 with at least forty named failures. A collection or interpreter error (rc 2, 4 or 5) prints its own sentinel and is never counted as red.
  command: W=$(mktemp -d); O=$(mktemp); if ! git worktree add --detach --quiet "$W" origin/main; then echo RED_LEG_WORKTREE_FAILED; exit 1; fi; ln -s "$(pwd)/.venv" "$W/.venv"; if ! cp tests/session/preflight/test_context_docs_session_log.py tests/session/preflight/test_context_docs_data_quality.py tests/session/preflight/test_context_docs_resilience.py tests/session/preflight/test_summary_context_docs.py tests/session/preflight/test_context_docs.py "$W/tests/session/preflight/"; then git worktree remove --force "$W" >/dev/null 2>&1; echo RED_LEG_COPY_FAILED; exit 1; fi; (cd "$W" && bin/venv-python -m pytest tests/session/preflight/test_context_docs_session_log.py tests/session/preflight/test_context_docs_data_quality.py tests/session/preflight/test_context_docs_resilience.py tests/session/preflight/test_summary_context_docs.py tests/session/preflight/test_context_docs.py -q -p no:cacheprovider --randomly-seed=12345) > "$O" 2>&1; RC=$?; git worktree remove --force "$W" >/dev/null 2>&1; tail -5 "$O"; if [ "$RC" -ne 1 ]; then echo "RED_LEG_INFRA_FAILURE_rc_$RC"; exit 1; fi; F=$(grep -cE '^FAILED ' "$O"); if [ "$F" -lt 40 ]; then echo "RED_LEG_DID_NOT_GO_RED failed=$F"; exit 1; fi; echo "RED_LEG_OK failed=$F"
