- step: 3
  phase: pre-deploy
  action: AFTER, session-log ordering AND its silence half. parse_last_session names the maximum parsed date in the live docs/SESSION_LOG.md and recent_sessions is the newest five in strictly non-increasing date order; the live newest-first log emits NO not-newest-first line and NO unavailability line across a capture spanning BOTH call sites, which is the negative half that falsifies the ordering design rationale's zero-prints-today clause and stops an implementation that WARNs unconditionally from passing every step in this plan; an out-of-order fixture emits the attributed WARN naming its first and max dates; an absent log and a directory-shaped unreadable log each return the empty sentinel AND an attributed session log UNAVAILABLE line naming the path they could not read (docs/SESSION_LOG.md in production, since the line renders SESSION_LOG_FILE itself); and a log carrying an undecodable byte is SALVAGED by errors=replace rather than blanked, yielding its newest header with no unavailability line. Both call sites read the SAME boundary, so they cannot drift apart.
  command: "bin/venv-python -c \"import io,re,sys,tempfile,pathlib;from unittest.mock import patch;from scripts.preflight import _common,context_docs\ndef drive(target):\n    _e=sys.stderr;sys.stderr=g=io.StringIO()\n    try:\n        with patch('scripts.preflight._common.SESSION_LOG_FILE',target):\n            return context_docs.parse_last_session(),g.getvalue()\n    finally:\n        sys.stderr=_e\ncontent=_common.SESSION_LOG_FILE.read_text(encoding='utf-8');dates=re.findall(r'## \\[(\\d{4}-\\d{2}-\\d{2})\\]',content);newest=max(dates);_e=sys.stderr;sys.stderr=g=io.StringIO()\ntry:\n    last=context_docs.parse_last_session();rec=context_docs.read_context_files(open_recs_count=0)['recent_sessions']\nfinally:\n    sys.stderr=_e\nlive=g.getvalue();assert 'is not newest-first' not in live,live;assert 'UNAVAILABLE' not in live,live;assert newest in last,(newest,last);got=[e[4:14] for e in rec];assert got==sorted(got,reverse=True),got;assert got[0]==newest,(got,newest);d=pathlib.Path(tempfile.mkdtemp());p=d/'S.md';p.write_text('## [2026-05-01] - a\\n## [2026-05-09] - b\\n',encoding='utf-8');out,w=drive(p);assert '2026-05-09' in out,out;assert 'is not newest-first' in w and 'first=2026-05-01' in w and 'max=2026-05-09' in w,w;gone=d/'no-such-log.md';out,w=drive(gone);assert out=='',out;assert '[WARN]' in w and 'session log UNAVAILABLE' in w and str(gone) in w,w;shadowed=d/'dir-log.md';shadowed.mkdir();out,w=drive(shadowed);assert out=='',out;assert '[WARN]' in w and 'session log UNAVAILABLE' in w and str(shadowed) in w,w;raw=d/'raw.md';raw.write_bytes(b'## [2026-05-09] - undecodable \\xff byte\\n');out,w=drive(raw);assert '2026-05-09' in out,out;assert 'UNAVAILABLE' not in w,w;print('AFTER_ORDER_OK newest='+newest+' recent='+str(len(got))+' live_order_warn_absent=True absent_named=True unreadable_named=True undecodable_salvaged=True')\""
  expected: 'Exit 0 and one stdout line beginning AFTER_ORDER_OK newest= and ending live_order_warn_absent=True absent_named=True unreadable_named=True undecodable_salvaged=True, with recent=5 between them. Nine clauses are asserted: the live capture spanning both call sites contains no not-newest-first text, the same capture contains no UNAVAILABLE text, the newest-dated header is what last_session carries, the five recent entries are in non-increasing date order, the first of them is the newest date, the out-of-order fixture emits the WARN with both its date clauses, the absent log returns the empty string with an attributed session log UNAVAILABLE line naming the path, the directory-shaped log reaches that same line through the OSError leg, and the undecodable log still returns its newest header with no UNAVAILABLE line. At the pinned base newest reads 2026-07-01, which is evidence about the live log rather than a pin. Replayed GREEN against a prototype boundary in a scratch clone at the pinned base at plan-critique revision round 2, and RED on origin/main there with an AssertionError on the newest-in-last clause.'
  fix_if: 'An AssertionError on the newest-in-last clause means selection reverted to a positional slice -- fix the boundary, never the assertion. An AssertionError on the ordering clause means the sort key or its reverse flag changed. A missing WARN on the out-of-order fixture means the disorder detection was dropped: restore it; a silent reorder is the defect this row exists to prevent. An AssertionError on the LIVE leg''s not-newest-first clause means the order WARN is firing against a log that IS newest-first -- the implementation is emitting it unconditionally, which is a false-degradation signal at every session open and the mirror image of the defect this plan removes; fix the comparison (it runs over PARSEABLE dates only), never delete the clause. An AssertionError on the live leg''s UNAVAILABLE clause means the boundary is reporting the production log as unreadable. A missing absent-branch or unreadable-branch line means an unavailability was routed to a silent empty return, the exact shape this plan exists to remove. A missing header on the undecodable leg means the read stopped using errors=replace and one stray byte now blanks the whole log.'
