  action: AFTER, data-quality coverage. The function reads the directory that actually holds the checks and reports a positive count with no coverage_error against the live tree; and against a synthetic empty root it returns None counts plus a coverage_error naming the missing path, so an unavailable coverage can never again be reported as a zero.
  command: "bin/venv-python -c \"import tempfile,pathlib;from unittest.mock import patch;from scripts.preflight import _common,context_docs;live=context_docs.check_data_quality_coverage();assert live.get('coverage_error') is None,live['coverage_error'];assert live['checks_defined'] and live['checks_defined']>0,live;assert live['tables_covered'] and live['tables_covered']>0,live;assert (_common.ROOT/'config'/'agent'/'data_quality').is_dir();d=pathlib.Path(tempfile.mkdtemp())\nwith patch('scripts.preflight._common.ROOT',d):\n    gone=context_docs.check_data_quality_coverage()\nassert gone['checks_defined'] is None and gone['tables_covered'] is None,gone;assert 'dq config dir missing' in gone['coverage_error'],gone;print('AFTER_DQ_OK checks=%d tables=%d unavailable_is_none=True'%(live['checks_defined'],live['tables_covered']))\""
