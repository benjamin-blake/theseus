he slowest is step 19 at 2.96s, then step 7 at 1.44s and step 6 at 1.09s (an earlier timing recorded about 9s aggregate with step 7 at 2.07s, and a re-timing at fold close recorded 7.60s aggregate with step 19 at 3.05s, step 7 at 1.42s and step 6 at 1.10s -- run-to-run noise, all three evidence and none pinned). The headroom is stated per axis rather than as one multiple, because it is NOT uniform: about 16x on the aggregate (7.6 of 120s), about 10x on the per-step cap (3.05 of 30s), and only about 1.7x on the 20-step ceiling, which twelve hermetic steps already consume most of -- the step-count axis is the one to watch if a later revision graduates more rows. The replay was then EXERCISED rather than only budgeted: validate_vp_replay''s own _implement_pr_leg was driven over this plan in the clone with the plan path passed as the resolved list (never by adding implementation_declared), and it excluded the nine non-hermetic steps by name and replayed ELEVEN of the twelve hermetic ones clean. The twelfth, step 13, failed on the clone-only .venv artifact alone -- proved to be clone-only rather than asserted: the real checkout carries .venv as a DIRECTORY that .gitignore line 26''s .venv/ pattern ignores, while the scratch clone carries it as a SYMLINK that the same directory-only pattern does not match, so git reports it untracked there and nowhere else. With that one path discounted the step prints TOUCHED_SET_EXACT n=12 over exactly the declared twelve. Step 13''s fix_if now names the origin/main reachability its status-aware diff needs in that job, since get_status_aware_diff falls back to HEAD when the merge-base is unresolvable and would then report every declared path as declared_but_untouched. One further reconciliation from the prebuild, not a critic note: execution step 10 and step 14''s action both said SIX changed and new Python files while step 14''s own command, its expected and the ruff format run all name SEVEN -- the two scripts/preflight modules, the r