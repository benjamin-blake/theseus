  phase: pre-deploy
  action: 'AFTER, the suppressed verdict, both shapes. Drive print_data_quality_health over a synthetic root that carries a FAILING dq-latest.json and NO data-quality directory -- the exact production configuration under which it printed nothing -- and require both the stdout section and the stderr verdict line. This is the single strongest row in the set: a failing run against the warehouse primary table was being swallowed at every session open. Then drive a second root whose dq-latest.json is unparseable JSON and require a verdict UNKNOWN line naming the read_error on stdout plus its own attributed stderr WARN, so a malformed local artifact is a named degraded state with a discriminator rather than a vanished last_run AND without inventing a verdict literal no consumer row maps. Two further roots close the round-3 N2 gap in the same step: a dq directory that EXISTS but defines no checks must print its count AND a ZERO-from-a-directory-that-exists WARN, and a dq directory whose os.scandir raises PermissionError -- denied BY NAME for that one path, so importlib''s own scandir calls are untouched -- must report coverage UNKNOWN with a coverage_error naming the path and the errno, never the silent hard zero Path.glob produced by swallowing that same OSError.'
  command: "bin/venv-python -c \"import io,json,os,pathlib,sys,tempfile;from unittest.mock import patch;from scripts.preflight import context_docs\ndef drive(root,denied=None):\n    _o,_e=sys.stdout,sys.stderr;sys.stdout=o=io.StringIO();sys.stderr=g=io.StringIO();real=os.scandir\n    def deny(path,*a,**k):\n        if denied is not None and str(path)==str(denied): raise PermissionError(13,'Permission denied')\n        return real(path,*a,**k)\n    try:\n        with patch('scripts.preflight._common.ROOT',root),patch('os.scandir',deny):\n            context_docs.print_data_quality_health()\n    finally:\n        sys.stdout,sys.stderr=_o,_e\n    return o.getvalue(),g.getvalue()\ndef root_with(payload=None,checks=None):\n    d=pathlib.Path(tempfile.mkdtemp())\n    if payload is not None:\n        (d/'logs'/'debug').mkdir(parents=True);(d/'logs'/'debug'/'dq-latest.json').write_text(payload,encoding='utf-8')\n    if checks is not None:\n        q=d/'config'/'agent'/'data_quality';q.mkdir(parents=True)\n        for n,b in checks.items(): (q/n).write_text(b,encoding='utf-8')\n    return d\nout,err=drive(root_with(payload=json.dumps({'verdict':'FAIL','passed':0,'failed':0,'warned':0,'errored':2,'unavailable':0,'timestamp':'2026-01-01T00:00:00+00:00'})));assert 'Last run: FAIL' in out,out;assert 'coverage UNKNOWN' in out,out;assert 'verdict=FAIL' in err,err;assert 'coverage is UNKNOWN, not zero' in err,err\nbad,baderr=drive(root_with(payload='{not json at all'));assert 'Last run: verdict UNKNOWN' in bad,bad;assert 'could not be read' in bad,bad;assert '[WARN] data-quality last run is UNKNOWN, not clean' in baderr,baderr\nzout,zerr=drive(root_with(checks={}));assert '0 checks across 0 tables' in zout,zout;assert 'coverage is ZERO from a directory that EXISTS' in zerr,zerr\nden=root_with(checks={'a.yaml':'database: agent_platform\\ntables:\\n  t_alpha:\\n    row_count:\\n      min: 1\\n'});uout,uerr=drive(den,denied=den/'config'/'agent'/'data_quality');assert 'coverage UNKNOWN' in uout,uout;assert 'dq config dir unreadable' in uerr,uerr;assert 'Permission denied' in uerr,uerr\nprint('AFTER_DQ_HEALTH_OK stdout_lines=%d stderr_warns=%d read_error_named=True zero_named=True unreadable_dir_named=True'%(len(out.strip().splitlines()),err.count('[WARN]')))\""
  expected: 'Exit 0 and one stdout line beginning AFTER_DQ_HEALTH_OK and ending unreadable_dir_named=True. Twelve clauses are asserted: the section names the FAIL verdict on stdout, it names coverage as UNKNOWN rather than zero, the stderr carries verdict=FAIL, the stderr says coverage is UNKNOWN, not zero, the malformed-payload root prints Last run: verdict UNKNOWN and the words could not be read on stdout, its stderr carries the data-quality last run is UNKNOWN, not clean WARN, the empty-but-present directory prints 0 checks across 0 tables with a coverage is ZERO from a directory that EXISTS WARN, and the scandir-denied root prints coverage UNKNOWN with a dq config dir unreadable coverage_error naming Permission denied. At the pinned base the counts read stdout_lines=2 stderr_warns=2 and are evidence, not pins. Replayed on the folded tree at the pinned base: GREEN at rc 0, and RED at rc 1 with an AssertionError when scripts/preflight/context_docs.py is replaced by its origin/main text.'
  fix_if: 'Empty output means the checks_defined early return was restored -- remove it again; that guard is the defect. A missing stderr clause means the verdict WARN or the coverage WARN was dropped. A missing verdict UNKNOWN clause means the malformed payload fell back to a vanished last_run, or the read_error branch was dropped so the degraded row printed with no stderr discriminator -- restore the branch, never drop the clause, and never answer it by inventing a verdict literal the orient row cannot map. A missing ZERO clause means a truthful zero went silent again. A missing dq config dir unreadable clause means the listing reverted to Path.glob, which swallows the selector''s OSError and reports an unreadable directory as a hard zero. Never satisfy this step by making the fixture pass instead of fail: the whole point is that a FAILING or unreadable run must speak.'
  hermetic: true
  graduation: waive
