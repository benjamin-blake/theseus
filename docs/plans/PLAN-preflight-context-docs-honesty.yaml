  fix_if: 'RED_LEG_DID_NOT_GO_RED means the new tests pass on the unfixed tree and therefore prove nothing: STOP and re-derive the assertions before changing any source. RED_LEG_INFRA_FAILURE_rc_N means pytest never reached the assertions -- read the captured tail; it is never evidence of red. An rc of 2 is most often a symbol-level from-import of a construct that exists only on the working tree (execution step 8 forbids exactly that, and requires module-attribute access instead): switch the import style, never relax this step''s rc gate to admit it. RED_LEG_COPY_FAILED means a module is missing from the working tree. Never lower the forty floor to obtain green (Decision 181).'
