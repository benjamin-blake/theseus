acceptance_criteria:
- parse_last_session and read_context_files' recent_sessions both select by parsed date through ONE shared boundary, so the live docs/SESSION_LOG.md yields its newest header and its newest five entries rather than its oldest; a file whose position order contradicts its documented newest-first convention emits one attributed WARN naming the first and max dates; an absent or unreadable log returns the empty sentinel WITH one attributed session log UNAVAILABLE line naming the path, while an undecodable byte is salvaged rather than blanking the log; and the live newest-first log emits NEITHER line across both call sites, so the signal discriminates in both directions rather than being satisfiable by an unconditional WARN (steps 1, 3, 10).
- check_data_quality_coverage reads config/agent/data_quality and reports the checks that are actually defined there; a missing directory AND a present-but-unreadable one each return None counts plus a coverage_error naming the path, a directory that exists and defines no checks earns its own ZERO-from-a-directory-that-exists WARN rather than a silent zero, and a single unparseable check file yields a partial count plus a one-line load_errors entry rather than a swallowed zero (steps 1, 4, 5, 10).
- 'print_data_quality_health can no longer suppress a verdict: with a FAIL dq-latest.json on disk it prints the last-run line and a stderr WARN naming verdict=FAIL, including when coverage is unavailable -- the exact production configuration under which it printed nothing -- and a malformed dq-latest.json prints a verdict UNKNOWN line naming the read_error, with its own attributed WARN, rather than vanishing or claiming a verdict literal no consumer gauge maps (steps 1, 5, 9, 10).'
- _check_endstate_drift returns a reason from a closed seven-value vocabulary on every branch, and print_endstate_drift_advisory renders the three previously byte-identical stale causes as three mutually distinct lines and both fail-open branches as a SKIPPED line saying drift is UNKNOWN, not clean; a reason outside both vocabularies -- a legacy space-separated note, or a list -- also renders a SKIPPED line rather than silence, and a genuinely in-sync result is the ONLY thing that stays silent (steps 1, 6, 10).
- _scan_provisional_contracts names a truncated scan on stderr with the failing contract and the counts, names an unavailable one separately, and returns the same list it returned before on the healthy path (steps 1, 7, 10).
- The orient skill's Data quality coverage row reads data_quality.last_run.verdict -- a field path the report actually carries -- its threshold values are the producer's own uppercase run verdicts rather than the lowercase literals the runner has never emitted, its GAP cell reads null/absent so the degraded null verdict this plan introduces has a defined gauge state without adding a token the producer does not emit -- the null/absent literal is asserted by step 11 -- and the dead name last_verdict appears nowhere in that file (step 11).
- No touched entry point raises for any input shape in the matrix -- which now includes a dq-latest.json whose verdict is a list or a mapping, an endstate_drift whose reason is one, a docs/SESSION_LOG.md of undecodable bytes, a session log mixing a parseable header with an unparseable one, and a dq config directory that exists but whose os.scandir raises, the shapes the plan's own new constructs made raisable -- and the orchestrator exits 0 with the data-quality directory present AND absent while the report still carries exactly the 50 frozen top-level keys (steps 8, 9, 12).
- 'The suite goes RED against an origin/main worktree -- pytest exit code 1 with at least forty NAMED failures, the floor step 2 gates on -- and GREEN on the working tree, with all 86 new cases plus the one re-shaped existing case collected in both directions. The failure count is evidence and is never pinned: some cells legitimately PASS on the base and are disclosed by name in the test obligations rather than left to be discovered -- measured on an origin/main worktree, exactly ONE new cell passes there, the live-log silence case (a totality-style guarantee the old code already happened to satisfy); the non-string-verdict cell and the list-valued-reason cell were re-shaped to assert the new rendering as well as no-raise, so both FAIL on the base (empty output) and both contribute to the red count (measured 78 failed / 27 passed of 105 collected). Infrastructure failures print their own sentinels so they can never be mistaken for red, and no new module symbol-imports a construct that exists only on the working tree, because that collection-errors on the base at pytest rc 2, which step 2 counts as infrastructure failure rather than as red (steps 2, 10).'
- The touched set equals the declared scope plus this plan's own sanctioned path in both directions; the three graduated steps each produced their shard and the real differential gate admits all three; ruff check and format are clean; every changed Python file is under 500 SLOC with no budget entry and no raise marker; the orient prose surface stays at or below its registered budget; the changed scripts/ statements are covered; and the Decision 182 selection budget predicts within_budget (steps 13, 14, 15, 16, 17, 18, 19).
execution_steps:
- 'scripts/preflight/context_docs.py, ordering boundary -- add sys and datetime imports (date, datetime), the module-level _SESSION_BLOCK_RE capturing (header, date, done-line) in that group order, _UNPARSEABLE_SESSION_DATE = date.min, _session_sort_key parsing with datetime.strptime and returning .date() -- a date, NEVER a bare datetime, because the sentinel is date.min and sorting a log that mixes a parseable header with an unparseable one compares the two keys, which raises TypeError for a datetime-versus-date pair; the pin removes that trap by CONSTRUCTION rather than leaving it to the matrix cell that catches it -- and returning the sentinel on ValueError/TypeError, and _read_session_blocks. Its unavailability half: return [] plus ONE attributed session log UNAVAILABLE line naming the path when the file is absent (an absent log is an unavailability and owes a line like every other one; it prints zero times against the live repo, and the one existing case that drives this branch -- test_recs_cache.py''s test_missing_session_log -- asserts the return value only, never empty stderr, so no out-of-scope test is disturbed), read the file with encoding=utf-8 AND errors=replace so a single undecodable byte cannot blank the whole log, wrap that read in a catch of (OSError, UnicodeDecodeError) -- UnicodeDecodeError subclasses ValueError and NOT OSError, so an OSError-only catch lets it escape onto main()''s thread -- and emit the SAME session log UNAVAILABLE subject before returning [] on either. Both lines render SESSION_LOG_FILE itself, so the production text names docs/SESSION_LOG.md while a patched fixture names its own path and one assertion pins both. Its ordering half: finditer the blocks, sort by key with reverse=True (stable, so equal dates keep file order), and emit the not-newest-first WARN naming first= and max= when the parsed order differs from the file order -- computed over the PARSEABLE dates ONLY, because a header whose date does not parse sorts OLDEST under the sentinel and therefore ALWAYS moves, so including it would fire the convention WARN for what is really a data defect; the unparseable headers get their own second WARN naming how many there are and the first offender. Against the live newest-first log the boundary emits NEITHER line, and that silence is asserted, not assumed: step 3''s live leg captures stderr across BOTH call sites and requires the absence, which is what falsifies the zero-prints-today clause the ordering design rationale rests on and what stops an unconditionally-emitted WARN from passing the whole tier. Then make parse_last_session return blocks[0][0] or the empty string, and replace read_context_files'' session_blocks[-5:] loop with a [:5] loop over the same boundary. In the SAME edit give read_context_files'' two remaining direct reads -- ROADMAP_FILE and DECISIONS_FILE -- the identical errors=replace treatment, which closes the UnicodeDecodeError class on them; it does NOT close the OSError class there, and the never-raise constraint''s scope paragraph says so explicitly rather than overclaiming. Do NOT change the header or Done-line text either call site produces.'
