slug: preflight-context-docs-honesty
intent: 'Make the five context_docs preflight signals that silently lie at session open say what they actually know: select the session log''s newest entries by parsed date through one shared ordering boundary instead of a positional slice that returned the OLDEST, read data-quality coverage from the directory that actually holds the checks and report an honest UNKNOWN rather than a hard zero when it cannot, stop the checks_defined guard from suppressing a live FAIL verdict, attribute End-State drift to a named reason so three indistinguishable causes and two silent fail-open branches become four distinct advisory lines, name a truncated provisional-contract scan, and repoint the orient skill''s data-quality gauge at the field the report actually carries. Every unavailability routes to a sentinel value plus a visible attributed stderr line -- an absent or unreadable session log and a malformed dq-latest.json included, while a single undecodable byte is SALVAGED by errors=replace rather than blanking the log -- and the SILENCE half of every new stderr signal is pinned in the same breath, so no line can be emitted unconditionally: the live newest-first log, an in-sync End-State result and a healthy provisional scan each stay silent under a named step. No new raise path exists for any input shape, including the list-valued verdict and reason shapes that the two new frozenset membership tests would otherwise make unhashable on main()''s thread.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-preflight-context-docs-honesty.yaml
phase: 'Platform session-open signal honesty -- the context_docs group of the operator''s Task 9 part (b). Ad hoc, soft-warn category ad_hoc_rec; no tier_item is claimed and no roadmap exit criterion is closed, so this plan declares no closes_criteria. Sub-plan 2b of three: 2a owns the gh-dependent signals (dependabot.py, the ci_rca_signals gh probes and their three report keys) and 2c owns the reader-unavailable rows (the CI-RCA none-printing sections, priority_queue_source provenance, the Preflight OK headline, github_readiness); neither is touched here. Lands on top of Task 9a (#1098, a702e43), which fixed the PROJECT_CONTEXT stamp ref and did not edit scripts/preflight/context_docs.py.'
scope:
- file: scripts/preflight/context_docs.py
  action: Modify
  purpose: Six edits in one module. (1) Add the module-private session-log ordering boundary _read_session_blocks plus its _SESSION_BLOCK_RE, _session_sort_key and _UNPARSEABLE_SESSION_DATE helpers -- _session_sort_key returns a date and NEVER a datetime, coercing the strptime result with .date(), because the sentinel is date.min and a log mixing a parseable header with an unparseable one compares the two keys, which raises TypeError for a datetime-versus-date pair (round 3, N1) -- and make BOTH parse_last_session and read_context_files' recent_sessions read through it, selecting by parsed date rather than by file position; the boundary reads with errors=replace and catches (OSError, UnicodeDecodeError) -- UnicodeDecodeError subclasses ValueError, not OSError -- emits one attributed session log UNAVAILABLE line naming the path on an absent log as well as on an unreadable one, emits the not-newest-first line ONLY when the PARSEABLE dates contradict file order, and emits NEITHER against the live newest-first log (the silence half, pinned by step 3's live leg). read_context_files' two remaining direct reads (ROADMAP_FILE, DECISIONS_FILE) get the same errors=replace in the same edit, which closes the UnicodeDecodeError class on them but deliberately NOT the OSError class -- see the never-raise constraint's scope paragraph and follow-on 7. (2) Repoint check_data_quality_coverage at config/agent/data_quality, return tables_covered/checks_defined as None with a coverage_error string when that directory is absent OR present-but-unreadable -- the check-file listing is a BY-NAME-GUARDED os.scandir rather than Path.glob, because CPython's glob swallows the OSError its selector raises, so a permission-denied directory returned a silent hard zero, the same zero-means-unknown shape this row removes, surviving in a smaller domain (round 3, N2) -- and narrow the bare except to a per-file load_checks failure recorded in a load_errors list. (3) Extract _read_last_dq_run so a malformed dq-latest.json degrades to a NULL verdict plus a NAMED read_error naming the path and the reason instead of vanishing -- deliberately NOT a new verdict literal, because no consumer row maps one while the orient gauge already scores a null-or-absent verdict as GAP (round 3, N4); that boundary KEEPS the module's broad except Exception with the surrounding noqa BLE001 rather than narrowing to ValueError and JSONDecodeError, because logs/debug/dq-latest.json can be a DIRECTORY or permission-denied and IsADirectoryError and PermissionError are OSError, not ValueError, and print_data_quality_health is the FIRST call in main() -- origin/main already catches broadly at this site, so this retains the existing width rather than widening it. COERCE the verdict to str() inside the same boundary so a JSON mapping carrying a list or dict verdict cannot reach a frozenset membership test as an unhashable value, carry the errored count the file already holds, and keep _DQ_ALARMING_VERDICTS at exactly the four RUN verdicts the runner itself emits, because the unreadable row earns its own attributed stderr line off the read_error rather than off a membership test on an invented literal. (4) Invert print_data_quality_health's early return so the section and the last_run verdict always print, with a stderr WARN on FAIL/DEGRADED/ERROR/UNAVAILABLE, on an unreadable last run (whose null verdict prints a verdict UNKNOWN line naming its read_error and earns its own WARN), on unavailable or partial coverage, and on a ZERO count from a directory that EXISTS and was readable -- so neither a degraded row nor a zero is ever silent. (5) Add stamp_ref and a closed-vocabulary reason key to every _check_endstate_drift return branch. (6) Move _scan_provisional_contracts' try inside the per-contract loop, guard the loader and its imports separately, and name an incomplete or unavailable scan on stderr. Add the _one_line exception collapser so no attributed WARN fragments across lines. The prototype measured 197 to 372 SLOC after ruff format before the round-2 revision and 404 after it; the round-3 fold adds the scandir probe, the read_error sentinel builder and two renderer branches, and the file MEASURES 446 after ruff format -- re-measure rather than trusting that figure; under 500, so no budget entry and no decomposition is owed; if a later change crosses 500 the named split is a scripts/preflight/session_log.py plus a data-quality sibling, never a raise.
- file: scripts/preflight/summary.py
  action: Modify
  purpose: 'Rewrite print_endstate_drift_advisory so it always names WHY: the attributed-drift line keeps the new-ids list and gains its reason, the three unattributable stale causes each print their own reason and the ref they could not resolve, and the two fail-open branches -- which already computed a note the renderer never printed -- print a SKIPPED line saying drift is UNKNOWN, not clean. Add the _ENDSTATE_SKIPPED_REASONS frozenset. Falls back to the legacy note key when reason is absent so an older dict still renders, coerces the resolved reason with str() BEFORE the membership test so a list-valued reason cannot raise TypeError there, and routes any reason outside both vocabularies -- the legacy space-separated notes stamp absent and parse error included -- to a SKIPPED line naming the unrecognized reason rather than to silence, because silence is what a consumer reads as clean. Measured 113 to 131 SLOC on the prototype; the revision''s else branch and coercion add about five lines, so estimate 136 and re-measure after ruff format.'
- file: .claude/skills/orient/SKILL.md
  action: Modify
  purpose: 'Repoint ONE table row -- the Best-Practices Health Check''s Data quality coverage row -- from the field name data_quality.last_verdict, which the preflight report has never emitted and which therefore pins that gauge to GAP forever, to data_quality.last_run.verdict, which it does emit, and restate the thresholds in the runner''s real uppercase verdict vocabulary. The VALUE vocabulary is fixed in the SAME edit as the field path, not left for a follow-on (Decision 170): the thresholds move off the lowercase literals pass/warn/fail -- which the runner has never emitted, so a field-path-only repoint would have left the gauge unable to render PASS on a healthy run -- onto the producer''s six real run verdicts PASS, DEGRADED, SKIP, FAIL, HARD_GATE and ERROR, read from scripts/data_quality_execute.py''s own aggregate expression and early returns. Sized against the registered prose budget and re-measured after the vocabulary widening: 23219 to 23248 bytes against a 23278 budget, 30 bytes of residual headroom, so no prose-budget raise is taken (Decision 127). Three different deltas appear across this plan''s drafts for this one row (+29 to 23248 shipped, +41 to 23260 superseded because it predates the vocabulary fix, +34 to 23253 from a later reconstruction), so every delta here is an ESTIMATE: measure the file through measure_prose_context before and after the edit and restate step 17''s expected from that measurement. The binding requirement is at-or-below 23278, never a particular delta. One reconstruction was MEASURED live at plan-critique revision on a patched clone at the pinned base -- the row worded PASS if PASS; WATCH if DEGRADED or SKIP; GAP if FAIL, HARD_GATE, ERROR or absent, every verdict token backticked -- and it reports 23253 prose bytes with 25 bytes residual, which also replays step 11 GREEN including its new exact-six-verdict clause. The SHIPPED row extends that last cell to null/absent rather than absent (round 3, N4), which gives the unreadable last_run a DEFINED gauge state without inventing a seventh verdict literal, and MEASURES 23258 prose bytes with 20 bytes residual on the folded tree. The alternative route was measured rather than argued: mapping an UNREADABLE literal in the row costs 23267 bytes and FITS the budget with 11 bytes to spare, but breaks TWO of step 11''s clauses -- UNREADABLE is not among the verdict literals scripts/data_quality_execute.py carries, so the named-subset-of-the-producer clause fails as well as the exact-six clause -- so that route was rejected as a weakening of a load-bearing assertion, not on budget. Re-measure the row you actually ship.'
- file: tests/session/preflight/test_context_docs.py
  action: Modify
  purpose: Invert exactly one assertion in TestReadContextFiles::test_recent_sessions_extracted, whose OLDEST-FIRST fixture and index-0 assertion currently ENCODE the positional-slice defect, and record the inversion as a re-shape in the case docstring per Decision 181. The count assertion is unchanged and a second assertion is ADDED pinning the older entry at index 1, so the case constrains strictly more than before. Measured 323 to 331 SLOC on the folded tree.
- file: tests/session/preflight/test_context_docs_session_log.py
  action: Create
  purpose: 'Failing-first module for the ordering half AND its silence half: parse_last_session returns the newest-dated header from both a newest-first and an oldest-first fixture, the out-of-order case asserts the exact WARN with its first= and max= clauses, recent_sessions is the newest five in descending order, the Done-line suffix still appends, and a production-shape case runs against the REAL docs/SESSION_LOG.md so a mirror-test divergence cannot hide. Five NAMED cases pin what a no-raise totality matrix cannot, and each is named here so it is written rather than assumed: (a) LIVE-LOG SILENCE -- the real newest-first log emits no not-newest-first line and no unavailability line across BOTH call sites, the negative half of the ordering signal; (b) ABSENT-LOG ATTRIBUTION -- an absent log returns the empty sentinel AND one attributed session log UNAVAILABLE line naming the path it could not read; (c) UNREADABLE-LOG ATTRIBUTION -- a directory-shaped log reaches the same line through the OSError leg; (d) UNDECODABLE-BYTE SALVAGE -- a log carrying one undecodable byte still yields its newest header and emits NO unavailability line, because errors=replace salvages it rather than blanking it; (e) MID-FILE UNPARSEABLE HEADER -- an unparseable date in the MIDDLE of an otherwise newest-first file emits the unparseable WARN ALONE, because the order comparison runs over parseable dates only and so cannot misattribute a data defect as a convention violation. Plus a NINE-shape totality matrix -- absent, empty, newest-first, oldest-first, an impossible calendar date, a file of UNDECODABLE BYTES, an unreadable file, the ordering key''s TYPE (type(key) is date, asserted with an explicit not-a-datetime clause because datetime SUBCLASSES date and isinstance would not discriminate) and a mixed parseable/unparseable log, which is the shape a bare-datetime key raises TypeError on -- proving no raise. 21 cases, 200 SLOC measured after ruff format.'
- file: tests/session/preflight/test_context_docs_data_quality.py
  action: Create
  purpose: 'Failing-first module for the data-quality half: the live repo reports non-zero coverage, the configured directory is the agent subtree, tables_covered counts distinct tables across files, a missing directory yields None plus a path-naming coverage_error, an unparseable check file is partial and single-line rather than silent, and nine capsys cases prove print_data_quality_health surfaces a FAIL verdict -- including with coverage unavailable, the exact production configuration that swallowed it. Two named cases pin the malformed-artifact row that the plan-critique found unnamed: a dq-latest.json of unparseable JSON yields a NULL verdict plus a read_error naming the path (not a vanished last_run, and not an invented verdict literal), rendered as a verdict UNKNOWN line on stdout with its own attributed WARN on stderr, and pins _DQ_ALARMING_VERDICTS to EXACTLY the four run verdicts; and a dq-latest.json path that is itself a DIRECTORY reaches that same read_error shape through IsADirectoryError, which is the cell that proves the boundary''s catch is not narrowed to ValueError. Three more cases close the round-3 N2 gap: a present-but-UNREADABLE dq directory (os.scandir denied BY NAME for that path alone, so importlib''s own scandir calls are untouched) yields None counts plus a coverage_error naming the path and the errno, the same shape appears as a no-raise totality cell, and a dq directory that EXISTS but defines no checks earns a ZERO-from-a-directory-that-exists WARN rather than a silent zero. Distinct from those, and NOT the same cell: a config data_quality path that is a FILE rather than a directory, which drives the coverage half''s is_dir guard to None plus coverage_error. Plus unimportable-loader and NON-STRING-VERDICT totality cases -- the last drives a well-formed JSON mapping whose verdict is a list and whose verdict is a dict through the renderer, the shape that would otherwise raise TypeError unhashable type on the new frozenset membership test at the first call in main(). 23 cases, 261 SLOC measured after ruff format.'
- file: tests/session/preflight/test_context_docs_resilience.py
  action: Create
  purpose: 'Failing-first module for the attribution half plus the shape matrix: seven cases pin one distinct reason for each End-State state (ok, ref-not-a-commit, unresolvable, hash-mismatch, attributed, stamp-absent, parse-error), three pin the provisional scan''s partial, clean and missing-dir behaviour, and the totality class drives _check_endstate_drift over five context shapes and four roadmap shapes, the scan over an exploding loader and an always-raising provider, and read_context_files over a bare root -- asserting a return value rather than an exception in every cell. 25 cases, 193 SLOC on the folded tree.'
- file: tests/session/preflight/test_summary_context_docs.py
  action: Create
  purpose: Failing-first module for the renderer. Named test_summary_context_docs.py, NOT test_summary.py, so it cannot collide with the sibling sub-plan that may land its own summary-renderer module for the gh-dependent signals. Asserts each unattributed cause prints its own reason and ref, that the three lines are mutually unequal (the defect stated as a property), that attributed drift still names the new ids, that both fail-open branches print a SKIPPED line, that a genuinely in-sync result stays silent ONLY for an in-sync result, that a reason no vocabulary names -- including the legacy space-separated notes an older context_docs emits -- still prints a SKIPPED line rather than nothing, and a nine-shape totality matrix (the seven partial dicts plus the unrecognized reason and a list-valued reason). 17 cases, about 100 SLOC (estimate; re-measure after ruff format).
- file: config/agent/verification_registry/entries/endstate-drift-reason-is-named.yaml
  action: Create
  purpose: 'Graduation shard for step 6: a command_exit_zero guard asserting _check_endstate_drift''s live return carries a reason drawn from the closed seven-value vocabulary. Binds the production symbol, so it cannot drift from a copied literal. Measured admitted by the real differential gate -- fails on origin/main, passes on HEAD.'
- file: config/agent/verification_registry/entries/session-log-last-session-is-newest.yaml
  action: Create
  purpose: 'Graduation shard for step 3: a command_exit_zero guard asserting parse_last_session names the maximum parsed date in the live docs/SESSION_LOG.md. Derives the expected date from the file rather than pinning a literal, so it stays green as the log grows, and derives it through the SAME strptime parse the production boundary uses -- skipping headers that do not parse -- never by string-max over the regex matches, so an impossible calendar date in the log (which the production code sorts OLDEST under the date.min sentinel) cannot turn the shard red for a data reason rather than a code reason. Measured admitted by the real differential gate.'
- file: config/agent/verification_registry/entries/dq-coverage-dir-is-live.yaml
  action: Create
  purpose: 'Graduation shard for step 4: a command_exit_zero guard asserting check_data_quality_coverage reports no coverage_error and a positive check and table count against the live tree. Asserts positivity, never a count, so it is not coupled to how many checks exist. Measured admitted by the real differential gate.'
