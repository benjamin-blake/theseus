    merged to main -- PLAN-ci-provider-mirror-terraform-init-hardening.yaml (#759), whose
    implementation landed as #761 -- so this session displaces no rec-2836 work. Second, per the human
    at planning time, rec-2857 is actively BLOCKING that work's verification: with ci-rca's log fetch
    broken, the CI-RCA signal path used to confirm the rec-2836 forward fix cannot complete. This plan
