rollback: >-
  Single-commit revert. The workflow step name, its output path and every downstream consumer are
  unchanged, so reverting scripts/ci_rca/fetch_logs.py plus the ci-rca.yml step body restores the
  prior behaviour exactly -- including, deliberately, the rec-2857 defect. The guards-list entry in
  validate_ci_workflow_guards.py must be reverted in the same commit, or the aggregator will fail on
  an unimportable guard name. No registry or validate.py state is touched, so there is no
  registered-but-unimported failure mode.
