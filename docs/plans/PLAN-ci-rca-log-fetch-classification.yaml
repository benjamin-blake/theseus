  - >-
    Complexity classification - 8 scope files exceeds the >5-file STRATEGIC heuristic, but STRATEGIC
    plan-type declarations are suspended under the executor freeze (AGENTS.md Temporary Operational
    Constraints; Decision 67 STRATEGIC clause retained). Authored as a single IMPLEMENTATION plan per
    the freeze override. Three of the eight files are tests, one is a small insertion into an existing
