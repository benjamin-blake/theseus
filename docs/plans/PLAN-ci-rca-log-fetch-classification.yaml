execution_steps:
  - >-
    Create scripts/ci_rca/fetch_logs.py. Expose a testable classifier function (e.g.
    fetch_run_log(run_id, repo, out_path, attempts=3, sleep_fn=...) returning a typed result) plus an
    argparse main(). Per attempt: run "gh run view <run-id> --repo <repo> --log-failed" via
    subprocess.run with capture_output=True, text=True, encoding="utf-8"; treat it as fetched when
    returncode == 0 AND stdout is non-empty; otherwise fall back to the same call without
    --log-failed. Write ONLY stdout to out_path. Match the anchored transient patterns against the
    captured STDERR only, and only to classify the diagnostic message on the failure path -- never to
    override a successful exit status. Sleep between attempts via an injectable sleep function so
    tests do not wall-clock. Return non-zero from main() after exhaustion, printing the loud
    rec-2117 / rec-2118 / rec-2718 error text. Do not raise at import.
  - >-
    Modify .github/workflows/ci-rca.yml -- replace the body of the "Fetch failed run logs" step
    (currently lines 161-186) with the module invocation "bin/venv-python -m scripts.ci_rca.fetch_logs
    --run-id \"$RUN_ID\" --repo \"${{ github.repository }}\" --out /tmp/ci-rca-failed.log", followed
    by the retained fail-closed assertion "test -s /tmp/ci-rca-failed.log". Keep the step name and the
    GH_TOKEN env block unchanged. Record why the body grep was removed (rec-2857) without deleting
    the rec-2117 / rec-2118 / rec-2718 provenance -- but place that comment ABOVE the step (as a YAML
    comment outside the run: block), NOT inside the run: body: the allowlist guard scans the run:
    text, and the word "grep" in an explanatory comment would otherwise self-trip it.
  - >-
    Create tests/test_ci_rca_fetch_logs.py with classes TestClassification (containing BOTH
    test_successful_fetch_with_5xx_in_log_body_is_accepted and
    test_successful_fetch_with_transient_signature_on_stderr_is_accepted), TestTransientRetry,
    TestFallbackChain and TestOutputContract. Fake subprocess.run; inject the sleep function; assert
    on attempt counts, exit codes and written file bytes.
  - >-
    Modify scripts/verify_ci_workflow.py -- add _check_ci_rca_fetch_classification as an ALLOWLIST
    over the "Fetch failed run logs" step's run: body: assert (a) it invokes
    scripts.ci_rca.fetch_logs, and (b) it contains NO pattern-matching construct
    (grep/egrep/rg/awk/sed/case/=~/inline python -c). Do NOT implement this as a blocklist of known
    evasion shapes -- the post-change body is just the module invocation plus test -s, so an
    allowlist is simpler and is the only form that makes acceptance criterion 4's "never" true by
    construction. Add it to the _COMMANDS dict.
  - >-
    Modify tests/verify_ci_workflow/test_ci_rca_and_canary.py -- add a pass-path test plus negative
    tests covering the literal historical grep, a renamed pattern variable, a renamed log-path
    variable, at least one shape a blocklist would have missed (case/awk/rg or an inline python -c),
    and a body missing the module invocation. Follow the existing patch-based _load conventions in
    that module. Collect them all under ONE class named TestCheckCiRcaFetchClassification so VP step
    5 can select by "::ClassName" rather than "-k" (the repo's documented -k brittleness gotcha, and
    this selector becomes a graduated check_spec).
  - >-
    Modify scripts/checks/ci_guards/validate_ci_workflow_guards.py -- hoist the local guards list to
    a module-level _GUARDS constant, add _check_ci_rca_fetch_classification to the import block, and
    add ("ci-rca-fetch-classification", _check_ci_rca_fetch_classification) to _GUARDS. Keep the
    function iterating _GUARDS so behaviour is unchanged. Refresh the docstring, which enumerates
    only 5 of the (soon 9) guards. No registry.py or validate.py edit: the aggregator is already
    registered in both sequences and already re-exported.
  - >-
    Modify config/agent/verification_registry/registry.yaml -- DELETE the superseded
    ci-rca-log-fetch-503-guard-present row (line 904). Do this in the same commit as the VF-05
    bookkeeping walk that adds this plan's five graduated rows, so the registry never simultaneously
    asserts both the presence and the absence of the log-body grep.
  - >-
    Modify tests/checks/ci_guards/test_validate_ci_workflow_guards.py -- add a case asserting the
    guard's failure appends "ci-workflow guard: ci-rca-fetch-classification". NOTE: that
    negative-label case is the one that actually proves aggregator membership; the all-succeed case
    patches a bare MagicMock() module which auto-creates every attribute, so adding the ninth guard
    there is a no-op. Refresh the module docstring, which still says "four ci guards".
  - >-
    Execute the Verification Plan -- run each step; loop until pass. DISCRIMINATION PROOF for step 1:
    do NOT attempt to run it against the pre-change tree (both the module and its test are new, so it
    would fail on collection, proving nothing). Instead mutate: temporarily reintroduce a log-body
    grep inside the new classifier, confirm step 1 FAILS, then revert the mutation and confirm it
