  - >-
    Open adjacency, do NOT bundle (bin/setup-cloud-env.sh out of scope): rec-2535 would gate
    setup-cloud-env.sh on `--check`, which composed naively with exit 2 aborts a snapshot build.
    Blast radius today is contained: no workflow, script or hook invokes --check.
  - >-
    Known shift: a pinned tmp HOME drops ~/.local/bin from the PATH bin/sync-deps.sh:88 exports, so
    the integration-lane test takes the pip fallback (:101-109), not uv. Deliberate --
    TestHermeticInstall's stub covers the uv branch.
  - >-
    -m "not integration" is applied at scripts/checks/_scaffolding.py:138 (full) and
    scripts/checks/_pytest_diff.py:611 (fast); no integration lane runs anywhere, so step 11 is what
    preserves install coverage. tests/conftest.py:193 re-enables sockets for the marker.
  - >-
    ci-rca HARD BLOCK deferred on explicit human authorization: rec-3328 owned by in-flight
    PLAN-ci-convergence-fixes (same file); rec-3293/rec-3292 read as already fixed on main but still
    open (pytz at requirements.txt:11; no extras in requirements.lock). Also meets Related-Work
    condition 3 (pytest regression).
  - "Squash-merge body must carry: Resolves: rec-2687, rec-3133, rec-3316 (VP step 16 is the Decision 103 closure proof)."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    bin/sync-deps.sh -- hoist TERRAFORM_VERSION resolution above the drift branch, reading
    config/terraform-version only when readable and stripping whitespace; on empty/missing under
    INSTALL_TERRAFORM=1 log an ERROR to stderr naming the file and set a tf_config_error flag.
  - >-
