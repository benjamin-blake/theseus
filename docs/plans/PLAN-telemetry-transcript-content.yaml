execution_steps:
- >-
  PR A: terraform/personal/ducklake_lambdas.tf, the HCL pins (step 1), and the git mv of telemetry-infra-pins with its
  replacement shard. Run step 9, then push, open the PR and merge on code review PROCEED and green CI. Leave
  implementation_declared unset in PR A. Then step 10.
- >-
  PR B: src/common/ducklake_telemetry_blobstore.py (step 2 red, then green); ducklake_handler_errors.py (step 5's
  handler-errors nodes); ducklake_event_content.py, ducklake_event_reads.py, ducklake_event_read_verbs.py,
  ducklake_event_read_sql.py and ducklake_reader_client.py (steps 3 and 4); then the routing nodes (step 5).
- Both manifests (step 6); the smoke vectors and gate with their tests (step 7); the two contracts (step 8).
- Code review (the code-review skill in a fresh context); fix every blocking finding.
- >-
  PR B closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the
  readiness check, the coverage diagnostic, implementation_declared true, rebase on origin/main, step 9 on the committed
  clean tree then --verify-head, the postflight evidence, push, PR, CI green. Merge on code review PROCEED and green CI
  under the standing rule, with Resolves: rec-4291 in the squash body.
- >-
  After merge: steps 11 to 14. Then append dated notes through scripts.ops_data_portal (get_rec_write_guidance first;
  fetch each rec just before update_rec and prepend to its full context; name the merge commit's short SHA and this
  slug). rec-4292: before production, add a reader paging alarm on blob_integrity and blob_misconfigured; enforce tenant
  scoping in transcript_content's resolve step (the row's tenant must match the caller's, the key derived from the row,
  never a caller value); own the widened query_ops residual (caller SQL can read a blob object whose full key it
  knows); and add the runbook line that a sweep bug shows as forbidden_or_missing, fixed by removing the delete
  marker. rec-4025: slice 4 can read stored payloads through transcript_content. Then step 15.
- 'Report: what was implemented and the verification results, including step 13 output and the step 14 counts'
