bundled_recommendations:
- rec-4291
followon_recs:
- rec-4292
- rec-4025
infrastructure_dependencies:
- >-
  Two PRs in order. PR A is Terraform plus its HCL pins and the shard retirement and replacement: the reader's
  TelemetryBlobRead statement and its TELEMETRY_BLOB_ROOT environment variable in terraform/personal/ducklake_lambdas.tf.
  It merges on green CI and code review. terraform-apply-sandbox then applies the reviewed plan: an in-budget inline
  policy update on a boundary-carrying managed role auto-applies (environment-taxonomy guard classification, T2.25 /
  Decision 92 point 5), and a routed gated apply would wait for a human. PR B (everything else) merges only after PR
  A's apply-sandbox job is green with no gated route, because IAM is applied before any code deploy.
- >-
  LAMBDA-DEPLOY (Decisions 79/125/126): PR B redeploys the DuckLake functions through deploy-ducklake-lambdas.yml
  (src/common/ducklake_*.py and src/lambdas/ducklake_*/** are push paths). The reader is the function that gains
  behavior; the telemetry writer redeploys its bundle unchanged in behavior. The smoke job's --lambda-telemetry step
  runs the read-back vector with the reader URL it already resolves.
acceptance_criteria:
- >-
  The reader role can GetObject under telemetry-blobs/<meta_schema>/ only, with no List, Put or Delete, and the reader
  function carries TELEMETRY_BLOB_ROOT; HCL pins assert both and reject every wider grant.
- >-
  transcript_content returns any transcript row's stored bytes as base64 pages of at most 3 MiB. The caller's
  reassembled bytes equal the row's content_bytes and content_sha256 for inline, single-chunk and multi-chunk object
  rows, including a multi-byte character split at a chunk edge. Every response envelope stays under the 6,000,000-byte
  cap.
- >-
  Before serving object bytes, the reader verifies the object by HEAD (checksum and length against the row) and reads
  the range from that same object (IfMatch on its ETag). Every integrity failure answers 500 blob_integrity with a reason
  only, a missing configuration or access fault 500 blob_misconfigured, and a store outage 503 blob_unavailable. None
  carries a key, URL, message, ARN or account id, in the body or the log.
- >-
  An unknown grain key answers zero rows, a bad parameter or an offset at or beyond the size answers 400
  named_read_input without the value, and a grain conflict is refused, never resolved.
- >-
  On the deployed functions, the CI smoke job and an independent session run both print TELEMETRY_BLOB_READBACK_OK, and
  the reader logged no status-500 line and no ARN, account-id, s3:// or key shape after the deploy.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The reader's blob grant is GetObject only on the blob prefix, its environment names the blob root, and every wider grant is rejected.
  command: >-
    bin/venv-python -m pytest
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_reader_blob_grant_is_get_object_on_the_blob_prefix
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_reader_blob_guard_rejects_a_wider_grant
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_blob_root_on_the_writer_and_reader
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_blob_root_guard_rejects_a_moved_root
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_writer_blob_grant_shape
    tests/checks/iam_tf/test_telemetry_infra_pins.py::test_grant_guard_rejects_delete
    -q
  expected: Exit 0, every node passes. Red before, because the renamed nodes are absent.
  expected_literals: []
  fix_if: >-
    A reader statement with any S3 action beyond GetObject on the blob prefix, a bucket-level resource, or another
    catalog's prefix is too wide; never widen the pin to pass.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Its nodes land in PR A, where the replacement shard telemetry-reader-blob-grant-pins graduates them against
    pre-grant main. PR B's implementation_declared flip cannot see a row PR A added, and a PR B differential against
    post-PR-A main would be tautological. This follows the typed-errors plan's ruled precedent (2026-10-14, its step 8).
- step: 2
  phase: pre-deploy
  action: get_blob verifies by HEAD, reads the range from that same object, and classifies every fault without its message.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_telemetry_blobstore.py::test_get_blob_verifies_then_reads_the_range
    tests/common/test_ducklake_telemetry_blobstore.py::test_get_blob_integrity_reasons
    tests/common/test_ducklake_telemetry_blobstore.py::test_get_blob_store_faults_are_classified_without_the_message
    tests/common/test_ducklake_telemetry_blobstore.py::test_writer_integrity_raise_keeps_its_reason
    tests/common/test_ducklake_telemetry_blobstore.py::test_no_ducklake_bundle_ingests_from_object_storage
    -q
  expected: >-
    Exit 0, every node passes. Red before, because the get_blob nodes are absent. The ingestion guard stays green with
    the reader bundle now carrying the blob store: the object read sits inside the one admitted seam.
  expected_literals: []
  fix_if: >-
    A ranged GET without IfMatch, a HEAD without ChecksumMode, or an exception text reaching the raised error. Never
    read the whole object to hash it per chunk, and never call get_object outside get_blob.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-blob-get-verified
- step: 3
  phase: pre-deploy
  action: transcript_content serves inline, object and omitted rows as exact base64 pages that reassemble to the row, and refuses what it must.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_content.py::test_object_row_pages_and_reassembles_to_the_stored_bytes
    tests/common/test_ducklake_event_content.py::test_inline_row_serves_through_the_same_envelope
    tests/common/test_ducklake_event_content.py::test_omitted_row_carries_its_reason_and_no_data
    tests/common/test_ducklake_event_content.py::test_unknown_key_answers_zero_rows
    tests/common/test_ducklake_event_content.py::test_offset_beyond_size_is_refused_without_the_value
    tests/common/test_ducklake_event_content.py::test_max_bytes_is_clamped
    tests/common/test_ducklake_event_content.py::test_grain_conflict_is_refused
    tests/common/test_ducklake_event_content.py::test_not_configured_refuses_objects_but_serves_inline
    tests/common/test_ducklake_event_content.py::test_store_errors_map_to_typed_faults
    tests/common/test_ducklake_event_content.py::test_max_chunk_envelope_stays_under_the_response_cap
    -q
  expected: Exit 0, every node passes. Red before, because the test file is absent.
  expected_literals: []
  fix_if: >-
    Reassembled bytes that differ from the row, a chunk envelope at or above 6,000,000 bytes, a content_uri in a
    response, or a conflicted row served.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-transcript-content-pages
- step: 4
  phase: pre-deploy
  action: The verb is registered with its full grain-key filter, its parameters are validated without echo, and the client fields match.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_read_verbs.py::test_transcript_content_is_registered_not_agent_facing
    tests/common/test_ducklake_event_reads.py::test_content_params_are_validated_without_echo
    tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns
    tests/common/ducklake_reader_client/test_verb_fields_parity.py::test_verb_fields_covers_every_registered_verb
    -q
  expected: Exit 0, every node passes. Red before, because the two named nodes are absent.
  expected_literals: []
  fix_if: >-
    A content verb that is agent-facing, filters on less than the full grain key, or names a refused value in its
    error.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-transcript-content-registry
- step: 5
  phase: pre-deploy
  action: Typed faults answer status, type and reason only, through the real reader handler, and their log line carries no message.
  command: >-
    bin/venv-python -m pytest
    tests/test_ducklake_handler_errors.py::test_typed_fault_answers_status_type_and_reason_only
    tests/test_ducklake_handler_errors.py::test_typed_fault_log_never_carries_the_message
    tests/lambdas/ducklake_reader/test_event_routing.py::test_transcript_content_through_the_handler
    tests/lambdas/ducklake_reader/test_event_routing.py::test_blob_faults_answer_typed_through_the_handler
    -q
  expected: Exit 0, every node passes. Red before, because the nodes are absent.
  expected_literals: []
  fix_if: >-
    A typed fault answered as 500 unmapped, a body or log line carrying an ARN, an account-shaped run or a message, or
    an edit to the reader handler.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-reader-typed-faults
- step: 6
  phase: pre-deploy
  action: The reader bundle carries the content and blob store modules, and data-pipeline does not.
  command: >-
    bin/venv-python -c "from scripts.lambda_manifest import compute_affected_artifacts as c;
    a=c(['src/common/ducklake_event_content.py','src/common/ducklake_telemetry_blobstore.py']);print(a);
    assert 'ducklake_reader' in a and 'data-pipeline' not in a, a;print('BUNDLES_OK')"
  expected: Exit 0 and BUNDLES_OK.
  expected_literals: []
  fix_if: A missing reader include fails at import on the deployed reader; a data-pipeline hit means an exclude line is missing.
  hermetic: true
