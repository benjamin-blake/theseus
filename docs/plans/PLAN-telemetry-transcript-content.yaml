schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-transcript-content
intent: >-
  Telemetry is the learning signal (PROJECT_CONTEXT), and a large tool output is now stored only as an S3 object. This
  plan lets a signed reader caller get back the exact stored bytes of any transcript row, inline or object, proven
  against the row's SHA-256 and length. The slice 4 verification harness and later the feedback loop can then read
  what was captured, not only its size and digest.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-transcript-content.yaml
phase: >-
  rec-4291 carrier: its last item, the content_blobs port's get_blob read. Related tier item, named in context only:
  T2.36 (slice 2b's read layer; c3 is met and no open criterion belongs to this plan).
closes_criteria: []
scope:
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: >-
    PR A. The reader role's inline policy gains one statement, Sid TelemetryBlobRead: Effect Allow, Action
    ["s3:GetObject"] only, Resource the object ARN
    "${aws_s3_bucket.data_lake.arn}/${local.telemetry_blob_data_prefix}/${local.ducklake_telemetry_meta_schema}/*". It
    has no List, Put or Delete action and no bucket-level ARN, and it is the grant Benjamin approved on 2026-10-15. The
    reader function's environment gains TELEMETRY_BLOB_ROOT = local.ducklake_telemetry_blob_root. Nothing else changes;
    source_code_hash stays in ignore_changes, so the code deploy channel stays the only code owner.
- file: tests/checks/iam_tf/test_telemetry_infra_pins.py
  action: Modify
  purpose: >-
    PR A. assert_reader_has_no_blob_grant becomes assert_reader_blob_grant_is_get_object_only. On the reader, exactly
    one statement names the blob prefix: Allow, actions exactly ["s3:GetObject"], resources exactly the object ARN of
    telemetry-blobs/<meta_schema>/*. No reader statement grants ListBucket on that prefix, or any S3 action on
    telemetry-blobs/* outside <meta_schema>/ or on the bucket ARN. test_reader_has_no_blob_grant becomes
    test_reader_blob_grant_is_get_object_on_the_blob_prefix. test_reader_guard_rejects_a_blob_grant becomes
    test_reader_blob_guard_rejects_a_wider_grant: red cases for PutObject, ListBucket, DeleteObject, a bucket-wide
    resource and another catalog's prefix. test_blob_root_only_on_the_writer becomes test_blob_root_on_the_writer_and_reader
    (both functions carry TELEMETRY_BLOB_ROOT from the same local), and test_blob_root_guard_rejects_a_reader_root
    becomes test_blob_root_guard_rejects_a_moved_root. It stays under 500 SLOC (445 today): the new predicate replaces
    the old one, so the net growth is the extra red cases (Decision 128; never a budget raise).
- file: config/agent/verification_registry/entries/telemetry-infra-pins.yaml
  action: Delete
  purpose: >-
    PR A. Retired by git mv into entries/deprecated/ (the registry's retirement path). check_id is immutable, and two of
    its nodes assert that the reader has no blob grant, which this plan reverses.
- file: config/agent/verification_registry/entries/deprecated/telemetry-infra-pins.yaml
  action: Create
  purpose: PR A. The git mv destination of the retired shard, byte-identical content.
- file: config/agent/verification_registry/entries/telemetry-reader-blob-grant-pins.yaml
  action: Create
  purpose: >-
    PR A. The replacement check (command_exit_zero over pytest, plan_slug telemetry-transcript-content), graduated by
    the differential admission gate against pre-grant main. It carries all eighteen nodes of the retired check, four of
    them under their new names.
- file: src/common/ducklake_telemetry_blobstore.py
  action: Modify
  purpose: >-
    PR B. The content_blobs port's read verb, admitted by name by the T2.36 c4 ingestion guard: get_blob(content_uri,
    sha_hex, size, *, offset, length) -> bytes. In order: content_uri must match
    ^[0-9A-HJKMNP-TV-Z]{26}/[0-9A-HJKMNP-TV-Z]{26}/[0-9A-HJKMNP-TV-Z]{26}/[0-9a-f]{64}$ and its last segment must equal
    sha_hex, else BlobIntegrityError(reason "uri_malformed") with no S3 call. Then one head_object with ChecksumMode
    ENABLED: a stored ChecksumSHA256 absent gives "checksum_absent", one not equal to sha256_hex_to_b64(sha_hex) gives
    "checksum_mismatch", and a ContentLength other than size gives "length_mismatch". Then one get_object with
    Range bytes=offset-(offset+length-1) and IfMatch set to the HEAD's ETag, so the bytes come from the object just
    verified with no s3:GetObjectVersion. A 412 gives "changed_during_read", and a returned length other than the
    asked length gives "length_mismatch". A 403 on either call gives "forbidden_or_missing" (the reader has no List,
    so S3 answers 403 for an absent key) and a 404 gives "missing". Throttling, a 5xx or a timeout after botocore's
    retries is BlobStoreUnavailableError. BlobIntegrityError gains a reason attribute from that closed set (the writer's
    existing raises pass reason "checksum_mismatch"; its typed answers are unchanged). No function here logs, returns or
    raises a key, URL, digest or exception message.
- file: src/common/ducklake_event_content.py
  action: Create
  purpose: >-
    PR B. The transcript_content verb's work after its registry SQL has resolved the row. It is imported
    function-locally by ducklake_event_reads, and nothing in ducklake_runtime's import closure imports it. It reads one
    resolved, deduped row; zero rows answers zero rows. A row whose dedupe reports more than one distinct stored version
    raises BlobContentFault(500, "blob_integrity", "grain_conflict") and never picks one. Then by storage:
    (inline) the content column's UTF-8 bytes; (object) store.get_blob(...); (omitted) no data and the
    content_omitted_reason. offset must be below content_bytes (an inline or object row) or 0, else
    EventReadInputError(param "offset"), which the handler answers 400 named_read_input. max_bytes is clamped to
    1..MAX_CHUNK_BYTES (3,145,728). The single response row is {storage, encoding "base64", offset, length,
    content_bytes, content_sha256, data, omitted_reason} plus the event-journal stamps. The data is standard base64,
    so a multi-byte character split at a chunk edge stays exact bytes. It never echoes content_uri or the bucket. The
    blob store is a module-level LazyBlobStore built on first object read from TELEMETRY_BLOB_ROOT, TELEMETRY_DATA_PATH
    and TELEMETRY_META_SCHEMA (no import-time work). With the root unset it raises BlobContentFault(500,
    "blob_misconfigured", "not_configured"); inline and omitted rows are still served. Store errors map to
    BlobContentFault: BlobIntegrityError gives (500, "blob_integrity", its reason), "forbidden_or_missing" included;
    BlobStoreUnavailableError gives (503, "blob_unavailable", "store_unavailable"); BlobStoreAccessError gives (500,
    "blob_misconfigured", "store_access"). BlobContentFault subclasses ducklake_handler_errors.TypedFault. Each page
    re-resolves the row on the warm telemetry slot, so an 8 MiB object costs at most three catalog reads (Decision 88
    cl.1). Refusing a conflicted row, rather than serving one flagged version, is this verb's application of Decision
    207's reader rule: bytes cannot carry a conflict stamp.
- file: src/common/ducklake_event_reads.py
  action: Modify
  purpose: >-
    PR B. bind_values validates the content verb's parameters without echoing a value: producer (a non-empty string of at
    most 200 characters, never NUL), event_id (a canonical ULID), parser_version (an integer of 1 or more), offset (an
    integer of 0 or more) and max_bytes (an integer of 1 or more). execute_entry hands the resolved rows to
    ducklake_event_content when entry.data marks the verb as content, imported function-locally. Every other verb's path
    and read_version is unchanged. It stays under 500 SLOC (251 today).
- file: src/common/ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    PR B. EVENT_READS gains transcript_content: binding session, params (session_id, as_of, producer, event_id,
    parser_version, offset, max_bytes), agent_facing False and a description naming the base64 paging and the
    reassemble-then-hash rule. Its SQL resolves the one row under the usual partition binding, as_of cut and read-side
    dedupe for telemetry_transcripts, filtered on the full grain key (producer, event_id, parser_version). It selects
    content, content_uri, content_sha256, content_bytes and content_omitted_reason and carries the conflict stamps.
    NAMED_READS_VERSION stays 6: one more verb in the reader-only registry is additive, and the per-verb read_version and
    the growth-safe VERB_FIELDS parity cover it.
- file: src/common/ducklake_event_read_sql.py
  action: Modify
  purpose: PR B. TRANSCRIPT_CONTENT_SQL, composed from the existing transcripts dedupe and conflict CTEs.
- file: src/common/ducklake_handler_errors.py
  action: Modify
  purpose: >-
    PR B. A TypedFault(Exception) base with status, error_type and reason. terminal() checks it before the
    dead-connection predicate and answers status with {ok false, error_type, reason, request_id, action}, never a
    message. It logs one ducklake_typed_fault line with the function, action, error_type, reason, request id, and the
    botocore Error.Code and HTTP status when the cause carries them, never str() of the cause (botocore's AccessDenied
    text carries the role ARN and account id). The reader handler is unchanged: its existing terminal() path answers
    the typed fault.
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: PR B. VERB_FIELDS gains transcript_content's columns; the version pin stays 6.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: >-
    PR B. includes gains src/common/ducklake_event_content.py, src/common/ducklake_telemetry_blobstore.py,
    src/telemetry/blobs.py and src/telemetry/request.py (blobstore's and blobs' imports). boto3 comes from the layer.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: PR B. excludes gains src/common/ducklake_event_content.py (reader-bundle only), like the other event modules.
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    PR B. The transcript_content verb: params, the single-row response, base64 paging (MAX_CHUNK_BYTES 3,145,728; the
    caller loops while offset + length < content_bytes and checks the reassembled length and SHA-256), agent_facing false,
    zero rows for an unknown key, 400 named_read_input, 500 blob_integrity {reason} with the closed reason set, 500
    blob_misconfigured {reason}, 503 blob_unavailable, and that no response or log carries content_uri, the bucket, a
    key, a digest other than the row's content_sha256, or an exception message. The query_ops declared residual widens
    honestly: caller SQL naming a table function over s3:// can now read a blob object whose full key it knows (the
    role has no List), owner rec-4292 before production reads. The same IAM-signed principals can already read that
    content through transcript_content, so no new principal gains access; only the row check and future tenant scoping
    are bypassed. That falls short of Decision 143 cl.1 (scope an identity by its worst reachable verb, outside the
    handler), so the residual names its owner and exit: rec-4292, before production reads, gives telemetry reads their own
    reader identity (the Decision 213 cl.2 pattern) or closes the query_ops path. One amendment_log entry (field_add).
- file: docs/contracts/read-engine.yaml
  action: Modify
  purpose: PR B. The declared verb grouping lists transcript_content with the event-journal verbs; one amendment_log entry.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    PR B (Decision 212 cl.3). A coupling finding PC-06 on content_blobs and ops_verbs, at
    src/common/ducklake_event_content.py: the reader builds the s3 adapter directly from TELEMETRY_BLOB_ROOT, so the
    free-tier local plane cannot serve an object row's bytes until the local_directory adapter and an adapter selection
    exist. Status open, owning item T4.23:c7. The s3 adapter's get_blob is now implemented; verbs stay provisional until
    T4.23:c16. One amendment_log entry.
- file: scripts/ducklake_smoke/telemetry_blob_vectors.py
  action: Modify
  purpose: >-
    PR B. multi_chunk_content(tag) returns ASCII content of 3,145,728 + 4,097 bytes with a 4-byte UTF-8 character
    straddling byte 3,145,728, plus heavy quote, backslash and newline runs. content_identity(row, tenant_id,
    project_id) derives session_id and event_id through src.telemetry.identity, the derivation the writer uses.
- file: scripts/ducklake_smoke/lambda_telemetry_blob_gates.py
  action: Modify
  purpose: >-
    PR B. _check_readback runs after _check_size_mismatch. Through the reader's transcript_content, it reassembles
    three rows, each byte-equal to what was written and to the row's SHA-256 and length: the delivered blob row (one
    chunk), one inline transcript row appended for the purpose, and one multi-chunk object delivered for the purpose
    (two calls). An offset at the object's size answers 400 named_read_input. It prints TELEMETRY_BLOB_READBACK_OK and
    blob_read_ms. No vector elicits a 5xx.
- file: tests/common/test_ducklake_telemetry_blobstore.py
  action: Modify
  purpose: >-
    PR B. New: test_get_blob_verifies_then_reads_the_range (HEAD with ChecksumMode, then a ranged GET with IfMatch on
    that ETag), test_get_blob_integrity_reasons (each reason, uri_malformed with no S3 call),
    test_get_blob_store_faults_are_classified_without_the_message (a ClientError whose message carries an ARN and a
    12-digit run never reaches the raised text) and test_writer_integrity_raise_keeps_its_reason. It stays under 500
    SLOC (322 today).
- file: tests/common/test_ducklake_event_content.py
  action: Create
  purpose: >-
    PR B. test_object_row_pages_and_reassembles_to_the_stored_bytes (an 8 MiB payload with a 4-byte character
    straddling each chunk edge: three calls, base64 decoded and concatenated, length and SHA-256 equal),
    test_inline_row_serves_through_the_same_envelope, test_omitted_row_carries_its_reason_and_no_data,
    test_unknown_key_answers_zero_rows, test_offset_beyond_size_is_refused_without_the_value, test_max_bytes_is_clamped,
    test_grain_conflict_is_refused, test_not_configured_refuses_objects_but_serves_inline,
    test_store_errors_map_to_typed_faults and test_max_chunk_envelope_stays_under_the_response_cap (the largest chunk in
    the full Function URL envelope, measured as the handler measures it, below 6,000,000).
- file: tests/common/test_ducklake_event_reads.py
  action: Modify
  purpose: PR B. test_content_params_are_validated_without_echo covers each new parameter's refusal, naming the parameter, never the value.
- file: tests/common/test_ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    PR B. test_transcript_content_is_registered_not_agent_facing covers the binding, params, agent_facing False, the
    full grain-key filter in its SQL and the conflict stamps.
- file: tests/test_ducklake_handler_errors.py
  action: Modify
  purpose: >-
    PR B. test_typed_fault_answers_status_type_and_reason_only and test_typed_fault_log_never_carries_the_message (a
    cause whose text carries an ARN and an account-shaped run).
- file: tests/lambdas/ducklake_reader/test_event_routing.py
  action: Modify
  purpose: >-
    PR B. Through the real reader handler with a fake store: test_transcript_content_through_the_handler (200 with the
    row) and test_blob_faults_answer_typed_through_the_handler (500 blob_integrity, 500 blob_misconfigured, 503
    blob_unavailable, each with reason only), without editing the handler or its 494-SLOC test file.
- file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_blob_gates.py
  action: Modify
  purpose: >-
    PR B. MARKERS gains TELEMETRY_BLOB_READBACK_OK. New test_readback_reassembles_on_a_consistent_reader, against the
    in-memory writer and a fake reader serving the real content module. test_each_divergence_fails_loudly gains
