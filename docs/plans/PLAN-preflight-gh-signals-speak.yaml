- 'Live payload defect on origin/main ae8c8c9 (unchanged at the refreshed pin a702e43 - no scope path differs), re-measured in a scratch clone over the 92 TYPE-shape cases, and enumerated by field VALUE rather than by container shape: 15 cases RAISE and abort session open (11 AttributeError, 2 KeyError, 2 TypeError), 23 LEAK a wrong-typed value straight into a report-key payload, 22 return a silent None and 32 answer. An independent replay reproduced the RAISE half EXACTLY (15, on precisely the enumerated cases) and did NOT reproduce the leak figure, so the predicate is stated rather than the number defended (round-4 note N7): 23 counts values reaching the two LIVENESS report-key payloads; counting only those two payloads'' own fields gives 21, and a further 13 wrong-typed values reach dependabot''s per-PR stranded entries, which this predicate does not count at all. No step asserts any of these counts - they appear in context and fix_if prose only, and the gate is the structural criterion, not the arithmetic. The nine FIELD-VALUE raises the pre-pivot draft missed are createdAt as int, float or bool through _check_ci_rca_liveness (created_at.replace, inside a try whose except tuple is (ValueError, TypeError) only), and createdAt as int, float or bool (_age_days, identical tuple) plus headRefName as int, float or bool (_ecosystem, NO try at all) through check_stranded_prs. The six remaining raises are the container shapes through the two liveness probes. This CORRECTS the pre-pivot draft''s twice-stated claim that check_stranded_prs was already safe: it raises today, and its isinstance guards cover the container shape only. Two representative leaks: conclusion 5 and createdAt 5 both flow verbatim into convergence_sensor_liveness_alert. Round 4 added a shape this type-only enumeration structurally could not reach (B1): a NAIVE ISO-8601 createdAt is a correctly-typed str, so it appears nowhere in a matrix that varies type only, yet on the base it parses to a naive datetime and the subtraction inside _check_ci_rca_liveness'' try raises TypeError - caught today by the (ValueError, TypeError) tuple the pre-critique draft proposed to narrow. Three value-shape rows (one per signal, on createdAt) are folded into the matrix so the never-raise property is backed for value shapes as well.'
- 'Undischarged residual, declared rather than silently accepted (Decision 181 point 2''s declare-your-coverage discipline): this plan repairs the session-open stderr half and the preflight-report half only - /orient''s Cold-Start Health SCORING is not repaired. Verified consumers: .claude/commands/orient.md scores ci_rca_liveness_alert non-null a HARD ALERT, .claude/skills/orient/SKILL.md scores it PASS iff null and scores dependabot PASS when stranded and quota_saturated are both empty, and convergence_sensor_liveness_alert has NO orient scoring row at all. Because attribution rides the additive key and this plan''s constraints forbid editing skill files, /orient still prints PASS for a signal that is blind. Two second-order effects are named rather than left implicit (note N8): once the AWS creds gate drops, ci_rca_liveness_alert non-null widens from main red >30 min with no rec to main red >30 min with the rec-since status possibly UNKNOWN, while orient.md''s row text - which this plan forbids itself to edit - still reads with no rec; that is the conservative direction (loud, not silent) and the stderr line carries the qualifier, but it is report-key semantics drift and it belongs in follow-on rec (b). The one state where this unit could have created a NEW blind spot - creds ok, recs cache unavailable, main red past grace - is explicitly NOT deferred: the alert is preserved (step 4 cases c and d). The N10 false-clean (a well-formed list of non-dict rows returning a CLEAN dependabot backlog) is NO LONGER a residual: the pivot folds it into scope as a boundary re-shape. One consumer was missing from that enumeration and is added for completeness (round-4 note N12): .claude/skills/planning/SKILL.md line 50 also names ci_rca_liveness_alert, but it DEFERS triage to /orient rather than scoring the key itself, so the additive-key shape needs no edit there either and the residual is unchanged by its inclusion.'
- 'Alert path PRESERVED, not reduced - the correction that closed plan-critique B2. Measured on origin/main ae8c8c9: _check_ci_rca_liveness("ok", cache_rows=None) with a 45-minute-old red main returns {run_url: u, elapsed_minutes: 45.0} TODAY, and scripts/session/preflight.py sets recs_rows_cache to None whenever warm_reader_ok[ops_recommendations] is false, which happens with creds_status ok on any reader failure - so that HARD ALERT state is live in production, not hypothetical. An earlier draft asserted a null there; combined with this plan''s own /orient residual (orient.md scores the non-null key HARD ALERT, the orient SKILL scores null PASS) that would have turned HARD ALERT into PASS for {creds ok, recs cache unavailable, main red} - a NEW silent lie created by this unit at the one call site where the key is non-null today, not the pre-existing gh residual left unrepaired. The shape taken instead needs no skill-file edit and no payload-shape change: when the gh half answers red-past-grace and the recs half cannot answer, return the SAME payload AND record aws_creds_unavailable or recs_cache_unavailable, with print_ci_rca_liveness_alert wording the line as red for N minutes with the rec-since status UNKNOWN and the reason named. The uncertainty is made explicit rather than asserted away, which is what discharges the never-fabricate-an-alert-from-a-missing-cache half; and the reason is recorded only where the recs half is actually consulted, so a green main with a dead reader stays silent (step 4 case e).'
- 'Latency, recorded because it sits beside a Decision 82 comment: dropping the blanket creds gate makes both liveness probes shell out unconditionally, taking a creds-unavailable session from 1 gh spawn to 3. In both containers gh is absent by design, so each extra spawn is a FileNotFoundError raised by exec and costs microseconds - no measurable wall-clock change - and on a gh-bearing host the two extra calls are exactly the two that already ran whenever creds were ok. The gate never reduced work in the environment this platform runs in; it only decided whether a GitHub read was attempted based on an AWS fact, which is the coupling this plan removes.'
- 'gates: decision-scout=FLAGS_FOUND (folded, and re-checked against every section the pivot changed); plan-critique=REVISE at rounds 1, 2 and 3, all three on the pre-pivot per-use-site guard approach (round 3''s B1: two more live raise paths through well-formed lists of dicts, plus the falsified check_stranded_prs-is-safe claim), followed by the coordinator''s single permitted approach pivot to boundary-typed validation at the gh transport with all ten round-3 notes folded; post-pivot round 4 = REVISE (one BLOCKING finding, B1, on the fromisoformat except-tuple narrowing, plus fifteen notes) - all sixteen folded in this revision, none answered by weakening a field; post-pivot rounds after 4 PENDING COORDINATOR RECORD 2026-09-05: post-pivot plan-critique REVISE at round 1 (naive-timestamp TypeError path opened by the declared except-tuple narrowing; folded) and REVISE at round 2 (the renderer-wiring half of the intent backed by no step; NOT folded). The unit was ABANDONED under the autonomous-day brief rule (one pivot, then abandon); this draft is PARKED, not approved, and must re-enter /plan before any implementation.'
