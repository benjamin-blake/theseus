  command: W="$(mktemp -d)/red"; if ! git worktree add --detach --quiet "$W" origin/main; then echo WORKTREE_ADD_FAILED; exit 1; fi; ln -s "$PWD/.venv" "$W/.venv" 2>/dev/null || true; if [ ! -x "$W/bin/venv-python" ]; then git worktree remove --force "$W"; echo VENV_PYTHON_MISSING; exit 1; fi; OUT="$( cd "$W" && bin/venv-python -c 'from scripts.preflight import gh_probe' 2>&1 )"; rc=$?; git worktree remove --force "$W"; printf '%s\n' "$OUT"; if [ $rc -eq 0 ]; then echo RED_LEG_DID_NOT_GO_RED; exit 1; fi; printf '%s' "$OUT" | grep -q "cannot import name 'gh_probe'" || { echo RED_LEG_INFRA_FAILURE_unexpected_output; exit 1; }; echo RED_LEG_OK_attribution_surface_absent_on_origin_main
  expected: Exit 0 with a captured ImportError naming gh_probe, then stdout RED_LEG_OK_attribution_surface_absent_on_origin_main.
  fix_if: RED_LEG_DID_NOT_GO_RED means origin/main already carries the attribution surface, so this plan has no red leg - STOP and re-scope. RED_LEG_INFRA_FAILURE_unexpected_output means the probe failed for some other reason (a broken worktree, a missing venv); read the captured output, it is never evidence about the defect.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'Same ground as step 1, stated rather than left implicit: the premise inverts by construction on merge - once this PR lands, scripts.preflight.gh_probe imports cleanly on origin/main, so a graduated shard asserting the ImportError would sit permanently red. The durable half is step 2''s property, graduated at step 7.'
- step: 9
  phase: pre-deploy
  action: RED leg, test modules. Copy this branch's five gh-signal test modules and the package conftest into a detached origin/main worktree and require pytest to refuse to collect them because the attribution surface is absent.
  command: W="$(mktemp -d)/redtests"; if ! git worktree add --detach --quiet "$W" origin/main; then echo WORKTREE_ADD_FAILED; exit 1; fi; ln -s "$PWD/.venv" "$W/.venv" 2>/dev/null || true; for f in tests/session/preflight/test_gh_probe.py tests/session/preflight/test_gh_payload_matrix.py tests/session/preflight/test_summary.py tests/session/preflight/test_dependabot.py tests/session/preflight/test_ci_rca_signals.py tests/session/preflight/conftest.py; do cp "$f" "$W/$f" || { git worktree remove --force "$W"; echo CP_FAILED; exit 1; }; done; OUT="$( cd "$W" && bin/venv-python -m pytest tests/session/preflight/test_gh_probe.py tests/session/preflight/test_gh_payload_matrix.py tests/session/preflight/test_summary.py tests/session/preflight/test_dependabot.py tests/session/preflight/test_ci_rca_signals.py -q -p no:cacheprovider --randomly-seed=12345 2>&1 )"; rc=$?; git worktree remove --force "$W"; printf '%s\n' "$OUT" | tail -8; if [ $rc -eq 0 ]; then echo RED_LEG_DID_NOT_GO_RED; exit 1; fi; printf '%s' "$OUT" | grep -q "cannot import name 'gh_probe'" || { echo RED_LEG_INFRA_FAILURE_unexpected_output; exit 1; }; echo RED_LEG_OK_tests_cannot_collect_on_origin_main_rc_$rc
  expected: 'Exit 0. The tail of the captured pytest output reports five collection errors, each an ImportError for gh_probe, and the final stdout line reads RED_LEG_OK_tests_cannot_collect_on_origin_main_rc_2. Measured in a scratch clone at ae8c8c9: the matrix module alone reports ImportError: cannot import name gh_probe from scripts.preflight and pytest exits 2.'
  fix_if: 'RED_LEG_DID_NOT_GO_RED means origin/main already exposes scripts.preflight.gh_probe, so the attribution surface this plan adds is not new - STOP and re-scope. Read this leg for exactly what it proves and no more: the attribution surface the five re-shaped modules import is ABSENT on the base, so pytest exits 2 at COLLECTION. It is not evidence that the re-shaped assertion BODIES are strong - a collection error fires however weak they are, so the first branch here can never report a weak re-shape. The behavioural red for the re-shaped bodies rests on step 1 (the base returns three bare Nones and prints nothing), step 3 leg B''s base measurement (15 of the 92 type-shape cases raise on the base and 23 leak a wrong-typed value under the predicate context states) and step 4 (the base returns None under creds_status unavailable and records nothing); if any of those is removed, this leg does not cover for it. Any other captured output (a missing venv, a worktree fault) is an environment failure and is never evidence about the defect. rc 2 here IS the red, because the module under test does not exist on the base; do not soften the grep guard that distinguishes it from an infrastructure fault.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Same inversion as step 8: after merge the five modules collect against the base, so a shard pinning the collection error would be permanently red. The durable half is the five modules themselves, run by step 7.'
- step: 10
  phase: pre-deploy
  action: 'Touched set equals declared scope in BOTH directions, read through the working-tree-aware seam so an uncommitted tree and a deletion are both visible. Sequencing precondition, stated rather than discovered (round-4 note N4): this step can pass only when Task 9a is MERGED into the base being measured against, or its tree is otherwise clean - get_status_aware_diff reports merge-base-vs-origin/main plus untracked files, so an unmerged 9a working tree surfaces its six paths as extra and fails this step. Discharged at the refreshed pin: 9a merged as a702e43 (#1098).'
  command: 'bin/venv-python -c ''import yaml,pathlib; from scripts.checks import _common

