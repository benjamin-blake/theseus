acceptance_criteria:
- With gh absent, each of check_stranded_prs, _check_ci_rca_liveness and _check_convergence_sensor_liveness records the named reason gh_not_installed instead of leaving its outcome unrecorded.
- summary.print_dependabot_stranded_alert, summary.print_ci_rca_liveness_alert and summary.print_convergence_sensor_liveness_alert each print one attributed stderr line naming that reason, and stay silent only when the signal genuinely answered.
- 'Every gh failure class routes to its own named reason - gh_not_installed, gh_call_failed, gh_timeout, gh_unauthenticated, gh_bad_payload, gh_empty_result - the reason set is CLOSED, so a residual exception records the named reason gh_unclassified and renders exactly as loudly as a known one instead of being swallowed, and a signal that ANSWERED records the named marker available, which reason_for maps to None so no renderer fires for it. gh_bad_payload''s detail names whichever of the row index and the field the shape CARRIES - a non-list payload, a JSON scalar and unparseable stdout carry neither, a non-dict row carries an index but no field, and only a wrong-typed or missing field carries both - so the assertion is kind-conditional and never demands a field name from a container shape that has none (round-4 note N1). The JSON-null normalisation is a NAMED PER-FIELD ALLOWLIST, never a blanket rule over every declared str field (round-4 note N3): a JSON null becomes the empty string for exactly TWO fields, each with its own in-repo ground. conclusion on both liveness signals, because gh renders an unconcluded run''s conclusion as an empty string where the GitHub API renders null and ci_rca_signals'' own not-conclusion branch already reads both as not-yet-concluded (pinned by test_alert_none_when_conclusion_null_still_running, whose docstring says a null conclusion is not evidence of failure yet), so classifying there would raise a false gh_bad_payload alarm on every in-progress run - a new lie. mergeStateStatus on dependabot, because the base already coerces a null there to the empty string with its own or-empty read, so admitting it PRESERVES base behaviour rather than converting a tolerated shape into a blank backlog. Every OTHER declared str field''s JSON null is gh_bad_payload, and the four consequences are STATED rather than left implicit: a null createdAt, title or headRefName on dependabot, and a null createdAt or url on either liveness signal, now blank that whole signal loudly - None plus an attributed gh_bad_payload line - instead of yielding a silently partial answer (a PR counted in open_total that can never be stranded) or an alert carrying an empty run_url. Every other type mismatch is gh_bad_payload.'
- Neither liveness probe is gated on AWS credentials. When _check_ci_rca_liveness' gh half answers "main red past the 30-minute grace" and its recs half cannot answer, it returns the SAME {run_url, elapsed_minutes} payload AND records aws_creds_unavailable or recs_cache_unavailable, so the HARD ALERT that fires on origin/main today is preserved and the missing half is NAMED rather than silently read as "no rec since the red run" - no alert path that fires on the base is removed by this plan. The reason is recorded only on the path that actually consults the recs half, so a green or within-grace main with an unavailable cache records available and prints nothing.
- 'The report keys dependabot_stranded_prs, ci_rca_liveness_alert and convergence_sensor_liveness_alert keep their exact current payload shapes, and the new gh_signal_availability key is additive - no orient consumer doc changes. Every value inside the two liveness payloads is now a str or a float by construction, closing the wrong-typed-value LEAK the base carries (measured over the 92 type-shape cases: 23 return a report-key payload holding the wrong-typed value on the base). That figure is PREDICATE-BOUND and no step gates on it (round-4 note N7): it counts the two liveness payloads'' own fields (6 ci_rca_liveness_alert plus 15 convergence_sensor_liveness_alert, plus the two the pre-pivot enumeration folded in) and does NOT count the 13 further wrong-typed values that reach dependabot''s per-PR stranded entries; an independent replay of the liveness-only predicate returned 21. The criterion the plan is held to is the structural one - every value inside the two liveness payloads is a str or a float after the change - not the count.'
- 'No callee raises through the preflight phases and scripts.session.preflight still exits 0 with gh absent, and the property is STRUCTURAL rather than per-use-site: every gh-derived value reaching a consumer has already been type-checked at the single boundary, so .replace, .split and every STRING accessor on it is total by construction. The claim stops exactly there and is not extended to the one accessor whose totality depends on a VALUE property the type declaration cannot establish (round-4 B1): now - fromisoformat(created_at) needs the parsed timestamp to carry an offset, which a str declaration does not guarantee, so that accessor is made total by KEEPING its (ValueError, TypeError) guard and by normalising a naive parse to UTC the way dependabot._age_days already does - never by the boundary alone. It is backed through ALL THREE signals by the 95-case derived payload matrix of step 3 leg B - for each signal, each requested field, each wrong-type shape, each JSON-null row, the missing key, the five container shapes AND one naive-ISO-8601 VALUE row per signal, so the property is backed for value shapes as well as type shapes - each case asserting no raise, the signal''s return value and the recorded reason, with the offending field named wherever the shape carries one. Measured on origin/main ae8c8c9 over the 92 TYPE-shape cases (re-checked at a702e43: no scope path differs, so the measurement stands): 15 RAISE (11 AttributeError, 2 KeyError, 2 TypeError) and abort session open, 23 leak a wrong-typed value into a report key under the predicate criterion 5 states, 22 return a silent None and 32 answer. The three value-shape rows postdate that measurement and are re-measured at implement time; on the base the ci_rca_liveness naive row returns a silent None (its TypeError is caught by the tuple this plan now KEEPS) and the other two answer.'
- Every touched file stays under 500 SLOC with no config/sloc_budgets.yaml entry and no raise marker; scripts/preflight/ci_rca_signals.py DECREASES from 472 to a measured 450 because both subprocess blocks leave it.
- Every attributed line naming a gh-class reason also names the mcp__github__ operator route IN THAT RENDERER'S OWN OUTPUT - asserted per renderer, never against the union of the three (note N1) - so the printed guidance is actionable (Decision 60) rather than a bare reason token, and points at the transport AGENTS.md prefers over the gh CLI (Decision 76).
- The new graduated shard is a single record whose filename equals its check_id (Decision 176), and the pre-existing convergence-sensor-liveness-signal shard needs no edit because its pinned node still intercepts the relocated gh call.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'BEFORE. On a detached origin/main worktree, prove the defect: with gh absent all three signals return a bare None, both existing renderers print nothing, and no ci_rca_liveness renderer exists at all. The renderer-absence half is asserted unconditionally; the gh-absence half is BRANCHED, not asserted, because validate_vp_replay replays this hermetic pre-deploy step inside pr-validate on ubuntu-latest, where gh exists - a hard environment-shape assertion there would redden the implementing PR on a premise that holds only in the agent container.'
  command: W="$(mktemp -d)/before"; if ! git worktree add --detach --quiet "$W" origin/main; then echo WORKTREE_ADD_FAILED; exit 1; fi; ln -s "$PWD/.venv" "$W/.venv" 2>/dev/null || true; if [ ! -x "$W/bin/venv-python" ]; then git worktree remove --force "$W"; echo VENV_PYTHON_MISSING; exit 1; fi; ( cd "$W" && bin/venv-python -c 'import io,sys,shutil; from scripts.preflight import ci_rca_signals as S, dependabot, summary; assert not hasattr(summary,"print_ci_rca_liveness_alert"), "PROBE_INVALID_renderer_already_exists"; (print("BEFORE_PROBE_SKIPPED_gh_present no_ci_rca_liveness_renderer"), sys.exit(0)) if shutil.which("gh") else None; v=[dependabot.check_stranded_prs(), S._check_ci_rca_liveness("ok",cache_rows=[]), S._check_convergence_sensor_liveness("ok")]; e=io.StringIO(); sys.stderr=e; summary.print_dependabot_stranded_alert(v[0]); summary.print_convergence_sensor_liveness_alert(v[2]); sys.stderr=sys.__stderr__; assert all(x is None for x in v), v; assert e.getvalue()=="", e.getvalue(); print("BEFORE_SILENT_LIE three_bare_None stderr_len_0 no_ci_rca_liveness_renderer")' ); rc=$?; git worktree remove --force "$W"; exit $rc
  expected: Exit 0. In the gh-less agent container stdout reads BEFORE_SILENT_LIE three_bare_None stderr_len_0 no_ci_rca_liveness_renderer. On a gh-bearing host - the ubuntu-latest PR runner where validate_vp_replay replays every hermetic pre-deploy step of this plan - the probe takes its named skip branch, prints BEFORE_PROBE_SKIPPED_gh_present no_ci_rca_liveness_renderer, and still exits 0, because the environment-shape half is REPORTED while the environment-independent half (no ci_rca_liveness renderer on the base) is still asserted.
  fix_if: PROBE_INVALID_renderer_already_exists means origin/main already carries print_ci_rca_liveness_alert, so this plan has no defect to fix - STOP and re-scope. BEFORE_PROBE_SKIPPED_gh_present printed inside the IMPLEMENTING session means this environment has gh, so the BEFORE measurement was not taken and the plan's premise is unmeasured here - record that and re-derive before implementing. The skip branch exists solely so the CI replay of this hermetic step reports the environment shape instead of asserting one; it never licenses skipping the measurement in the session that implements the plan, and the gh-less branch's assertions are not to be weakened to make the gh-bearing case pass. WORKTREE_ADD_FAILED or VENV_PYTHON_MISSING name a scratch-environment fault, not a plan fault; clear stale worktrees with git worktree prune and re-run. An AssertionError on the values or the stderr length means origin/main already attributes these signals and this plan has no defect to fix - STOP and re-scope.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The premise inverts by construction on merge - once this PR lands, origin/main carries the attributed signals, so a graduated shard asserting the bare-None silence would sit permanently red. The durable half is step 2's property, graduated at step 7.
- step: 2
  phase: pre-deploy
  action: 'AFTER. On the working tree, drive the three signals for real and require each to have RECORDED an outcome (never not_probed) and each renderer to print its attributed line exactly when its signal could not answer. Every assertion is gated on the recorded availability, never on whether this host has gh: an answered signal records the named marker available (which reason_for maps to None) and its renderer must stay free of the SKIPPED marker, an unavailable one records its named reason and its renderer must print that reason. Each renderer''s output is captured SEPARATELY and asserted on its own, so a compliant line from one renderer can never satisfy the contract for the other two (note N1) - in particular the mcp__github__ operator route is asserted PER LINE. The renderer contract is asserted over all FOUR (payload, reason) cells, not three: a signal that half-answered - a live alert PLUS a recorded reason, the shape _check_ci_rca_liveness takes when main is red and the recs cache is gone - must print the reason WITHOUT the SKIPPED marker, so the marker assertion is conditioned on the payload rather than on the reason alone. The step is therefore honest in a gh-less container, on a gh-bearing unauthenticated CI runner, and on a fully authenticated host alike. This step is classified hermetic FALSE (round-4 note N2): it drives the three signals UNMOCKED, so on the gh-bearing replay runner it would spawn three real gh processes, each bounded by the plan''s own 15s per-call timeout - a 45s worst case against validate_vp_replay''s 30s PER_STEP_TIMEOUT_SECONDS, whose TimeoutExpired is appended as a hard divergence and would redden the implementing PR. Excluding it from replay costs nothing: every assertion here is already gated on the recorded availability rather than on the environment, so the step is run in full at implement time on whatever host runs it, and step 7 graduates the same property.'
