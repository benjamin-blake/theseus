- 'APPROACH PIVOT, recorded because the document changed shape: rounds 1-3 tried to make never-raise true by enumerating raise shapes and guarding each at its use site (an isinstance(payload, list) guard in the probe plus a per-element dict guard in the first-run helper). Every round the critic found another well-formed container that still raised. The pivot makes the property STRUCTURAL: one typed entry point validates the gh payload once, and the three consumers receive rows whose every requested field is already the declared type, so no use site needs a guard and none is added. Consequences carried through this document: the two subprocess.run blocks leave ci_rca_signals (net -22 SLOC); dependabot''s silent non-dict skip becomes a bad-payload signal; the matrix step is re-derived from the field taxonomy instead of a hand list; and the never-raise criterion is now backed through check_stranded_prs as well as the two liveness probes.'
