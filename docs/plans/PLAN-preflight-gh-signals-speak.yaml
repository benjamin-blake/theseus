constraints:
- A clause may appear in permanent source ONLY if a named verification_plan step would FAIL were it false. Cite symbols, never line numbers.
- 'No callee raises through either preflight ThreadPoolExecutor phase, and the property is STRUCTURAL rather than per-use-site. main .result()s every future, so a raise aborts session open; every gh-derived value is type-checked ONCE at the gh_probe boundary before any consumer sees it, so created_at.replace, head_ref.split and every other STRING accessor downstream is total by construction and no consumer carries a guard of its own. The claim is bounded, not universal (round-4 B1): a type declaration establishes .replace and .split, but it does NOT establish now - fromisoformat(created_at), whose totality depends on a VALUE property - the parsed timestamp carrying an offset. A naive ISO-8601 string is a correctly typed str that passes the boundary untouched and makes that subtraction raise TypeError. That ONE accessor is therefore made total two ways, neither of them the boundary: its existing (ValueError, TypeError) guard is KEPT (the pre-critique narrowing to ValueError is withdrawn - it would have opened exactly this raise path through phase_b), and a naive parse is normalised to UTC before the subtraction, as dependabot._age_days already does. Backed through ALL THREE signals by step 3 leg B''s 95 derived payload cases - 92 type-shape rows plus one naive-timestamp VALUE row per signal, so no leg of the property rests on type variation alone - and by steps 4 and 6. The pre-pivot shape - enumerate raise shapes and add a guard per shape at each use site - is REFUSED on measured grounds: three critique rounds each found another well-formed shape that still raised (round 3 found two, both well-formed lists of dicts), which is what an unbounded per-site enumeration looks like from the inside.'
- gh_probe never prints; summary.py owns every print. That boundary is summary.py's own declared contract and keeps the probe testable without capsys.
- 'The gh_probe reason set is CLOSED and deterministically classified - one named reason per branch, mirroring scripts/ops_portal/reader_transient.py and the named-classifier shape Decision 170 clause 2 adopted when it replaced a blanket except Exception. The residual is the NAMED reason gh_unclassified, recorded and rendered exactly as loudly as a known reason, never a silent swallow (step 3). An ANSWERED signal is equally explicit: it records the named marker available rather than leaving the record empty, and reason_for is the single place that maps that marker to None, so every consumer - renderer, report key and verification step - reads availability from the record instead of inferring it from the environment (step 2). Decision 155 licensed skip-with-marker only at one named call site and refused to generalise it: the ground for never-raise HERE is that preflight is advisory and gates nothing, while main .result()s every phase future so a raise aborts session open outright - the opposite of a CI guard whose failure is the signal.'
- 'gh_probe imports subprocess and calls subprocess.run through the MODULE ATTRIBUTE, never from subprocess import run. The graduated shard convergence-sensor-liveness-signal pins a node that patches session_preflight.subprocess.run, which resolves to the shared stdlib subprocess module object; a direct name import would silently un-hook that patch and redden a shard this plan does not own (step 16). The same shard depends on a second call-shape property: subprocess.run is called with the argv POSITIONALLY, never as an args= keyword, because that shard''s pinned node and dependabot''s retained argv contract both read call_args[0][0] (round-4 note N9a).'
- The per-run availability record follows Decision 170's _ATTRIBUTIONS lifecycle - reset at the top of main, accumulated per signal, harvested once after phase B - and is never a process-global that survives across runs. It is that mechanism rebuilt for a NON-registered surface, because registry.examined()/skipped() is bound to the registered-check contract these three preflight signals are outside of.
- The three existing report keys keep their exact payload shapes. Attribution rides the new additive gh_signal_availability key so /orient's non-null HARD ALERT row cannot misread it (step 5).
- No hermetic step's expected text may contain a backtick literal (validate_vp_replay replays them).
- 'Every step that reads the plan''s realised FILE SET goes through scripts.checks._common.get_status_aware_diff, because /implement runs against an uncommitted tree and that seam sees staged, unstaged and deleted paths (steps 10, 13). Step 11 is not one of them by design: it inspects HUNK TEXT, and raw git diff -U0 against origin/main already includes the working tree.'
- The touched set equals the declared scope in both directions (step 10), and no edit lands in scripts/session/preflight.py's phase_b block (step 11).
- 500 SLOC per file including tests. Decompose into a sibling, never register a budget and never add a raise-approved or baseline-lowered marker (step 13, Decision 128, Decision 165).
- Never weaken a check, assertion, tolerance, budget, test or plan field (Decision 181). Every inverted assertion is RE-SHAPED in place with a docstring recording the inversion and the reason it was a defect - never deleted.
- Do not install gh, do not touch any check module, and do not touch a deploy-trigger file (scripts/run_scheduled_agent.py, scripts/aws_profile.py, scripts/s3_log_store.py, scripts/tool_runtime.py, scripts/llm/**, src/data/handlers/**, src/lambdas/**, src/common/**, config/lambda/**).
- No new prose docs (Decision 86); no Decision drafted, ratified or retired; no edit to AGENTS.md, docs/DECISIONS.md, docs/ROADMAP-PLATFORM.yaml or any skill file.
- No rescue agents or workaround loops (Decision 55).
- 'No hermetic pre-deploy step may ASSERT an environment shape. validate_vp_replay replays every hermetic pre-deploy step of a plan whose implementation_declared flips, inside pr-validate on ubuntu-latest, and treats a non-zero exit as a hard divergence; ubuntu-latest ships the gh CLI (seven workflows invoke gh with no install step). A step that needs the environment shape REPORTS it through a named branch token and still exits 0 (step 1). Step 2 keeps that recorded-state gating - so it is honest on a gh-less container, a gh-bearing unauthenticated runner and an authenticated host alike - but is classified hermetic FALSE and therefore excluded from replay, because it drives the three signals UNMOCKED and would spawn three real gh processes on the replay runner, each bounded by the plan''s own 15s per-call timeout: a 45s worst case against validate_vp_replay''s 30s PER_STEP_TIMEOUT_SECONDS, which appends a hard divergence (round-4 note N2). Nothing is lost by the exclusion - every assertion in step 2 is gated on the recorded availability rather than on the environment, and step 7 graduates the same property.'
- gh_probe's availability record is process-global, and tests/session/preflight runs under pytest-randomly in one process, so reset() is an AUTOUSE fixture in tests/session/preflight/test_gh_probe.py, in tests/session/preflight/test_gh_payload_matrix.py (whose run_case also resets per case, so the step-3 driver outside pytest is equally isolated) and in the package conftest extension - never a per-test call a new case can forget. Collection order must not be able to leak one module's record into TestProductionShape.
- 'gh_probe.run_gh_rows(signal_key, argv, fields) is the ONLY place a gh payload is validated. It returns list[dict] whose every row carries EXACTLY the requested keys with EXACTLY the declared types, or None with one named reason recorded; fields is a CLOSED mapping of gh --json field names to str or int, declared beside the argv that requests them. The JSON-null normalisation is a NAMED PER-FIELD ALLOWLIST, never a blanket rule over every declared str field (round-4 note N3): a JSON null becomes the empty string for exactly TWO fields, each with its own in-repo ground. conclusion on both liveness signals, because gh renders an unconcluded run''s conclusion as an empty string where the GitHub API renders null and ci_rca_signals'' own not-conclusion branch already reads both as not-yet-concluded (pinned by test_alert_none_when_conclusion_null_still_running, whose docstring says a null conclusion is not evidence of failure yet), so classifying there would raise a false gh_bad_payload alarm on every in-progress run - a new lie. mergeStateStatus on dependabot, because the base already coerces a null there to the empty string with its own or-empty read, so admitting it PRESERVES base behaviour rather than converting a tolerated shape into a blank backlog. Every OTHER declared str field''s JSON null is gh_bad_payload, and the four consequences are STATED rather than left implicit: a null createdAt, title or headRefName on dependabot, and a null createdAt or url on either liveness signal, now blank that whole signal loudly - None plus an attributed gh_bad_payload line - instead of yielding a silently partial answer (a PR counted in open_total that can never be stranded) or an alert carrying an empty run_url. Every other type mismatch is gh_bad_payload. Every non-dict row, every missing requested key and every non-list payload is gh_bad_payload. gh_bad_payload''s detail names whichever of the row index and the field the shape CARRIES - a non-list payload, a JSON scalar and unparseable stdout carry neither, a non-dict row carries an index but no field, and only a wrong-typed or missing field carries both - so the assertion is kind-conditional and never demands a field name from a container shape that has none (round-4 note N1). The two liveness probes'' remaining except tuples are left EXACTLY as they are - widening one restores the silent None this plan exists to remove, and narrowing one is refused for the same reason in the opposite direction. TIMESTAMP TOTALITY, the round-4 B1 fold: the fromisoformat guard KEEPS its (ValueError, TypeError) tuple exactly as it is - the pre-critique draft''s narrowing to ValueError is WITHDRAWN, because the TypeError that tuple catches is not only raised by a non-str createdAt: the subtraction now - run_ts sits inside the same try, so a NAIVE ISO-8601 string (a correctly-typed str that passes the typed boundary untouched) parses to a naive datetime and the subtraction raises TypeError: can''t subtract offset-naive and offset-aware datetimes - reproduced on the base, where the existing tuple catches it and the narrowing would have propagated it out of the phase future and aborted session open, the exact failure this plan exists to prevent. On top of KEEPING the guard, the parse NORMALISES a naive result to UTC before subtracting, exactly as scripts/preflight/dependabot.py''s _age_days already does (pinned by test_naive_timestamp_treated_as_utc), so the naive value ANSWERS rather than degrading to a silent None; the trade-off is recorded rather than assumed - a naive timestamp is read as UTC, which is the repo''s existing convention for this exact field and the only reading gh''s Z-suffixed output can produce.'
- 'No alert path that fires on origin/main today is removed. Specifically, _check_ci_rca_liveness("ok", cache_rows=None) with a red main past the 30-minute grace returns {run_url, elapsed_minutes} on the base and must keep returning it: the recs half''s inability to answer is recorded as a named reason and rendered as a rec-since-status UNKNOWN qualifier, never as a null (step 4 cases c, d and the renderer leg). The mirror rule is that the reason is recorded ONLY on the path that consults the recs half, so a green or within-grace main with a dead reader stays silent (step 4 case e).'
- 'TestProductionShape drives the three signals UNMOCKED, and that is network-touching by design: the root conftest''s autouse _block_llm_cli_subprocess blocks only the four LLM CLI names and passes gh through to the real subprocess.run, so on a gh-bearing host (ubuntu-latest in pr-validate, where the affected-set selects this module) the guard spawns a real gh process whose outbound call sidesteps pytest-socket''s in-process block. It still passes unauthenticated - gh exits non-zero, which classifies to gh_unauthenticated, a KNOWN_REASONS member that is not not_probed - because the guard asserts a RECORDED OUTCOME, never a network result.'
- 'The gh --json argument is DERIVED from the typed field mapping by a join, never written twice, so the fields a signal requests and the types it declares cannot drift apart. The mapping''s INSERTION ORDER is load-bearing and not free to re-derive: dependabot''s retained argv contract asserts the literal number,title,headRefName,mergeStateStatus,createdAt is in argv, so the join must reproduce exactly that order (round-4 note N9b). Measured: the existing argv-and-kwargs contract test (TestGhInvocationContract) passes verbatim under that derivation once its patch target is retargeted, so the timeout 15, capture_output, text, encoding utf-8 and errors replace kwargs move to gh_probe unchanged.'
- Every value gh_probe records is JSON-SERIALISABLE and every detail is a str. main() writes report gh_signal_availability through its single json.dumps at the report write, OUTSIDE both ThreadPoolExecutor phases - so a non-serialisable detail (an exception object parked on the gh_unclassified branch is the realistic one) raises there and still aborts session open, and step 6 runs with gh absent so it never reaches that branch (note N10). Coerce with str() at the record call, never at the report write.
- The transport classifier tests FileNotFoundError BEFORE OSError. FileNotFoundError is a subclass of OSError and the two classify differently - gh_not_installed against gh_call_failed - so the reverse order silently collapses the plan's own leg-A contract into one bucket (round-4 note N15). The retained test named test_gh_missing_returns_none drives OSError, not FileNotFoundError, so it is renamed or split in the same move rather than left asserting a reason its name contradicts.
