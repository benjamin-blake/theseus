slug: preflight-gh-signals-speak
intent: Make the three gh-dependent preflight signals say why they cannot answer instead of returning a bare None that every consumer reads as a clean bill of health, so session open reports UNKNOWN rather than a green main, a live sensor and an empty dependency backlog.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-preflight-gh-signals-speak.yaml
phase: ad_hoc_rec (soft-warn exception category) -- autonomous-day Task 9(b) sub-plan 2a, the gh-dependent preflight signal group. Names no tier_item and closes no exit criterion, so this plan carries no closes_criteria.
scope:
- file: scripts/preflight/gh_probe.py
  action: Create
  purpose: 'TYPED BOUNDARY for every gh-dependent preflight signal, and the single home for failure classification and the per-run availability record. run_gh_rows(signal_key, argv, fields) runs one gh command and returns list[dict] in which EVERY row carries EXACTLY the requested keys with EXACTLY the declared Python types - fields is the CLOSED mapping of the gh --json field names the caller requested to str or int - or records ONE named reason and returns None. The classifier is CLOSED and deterministic (modelled on scripts/ops_portal/reader_transient.py, the shape Decision 170 clause 2 adopted): gh_not_installed, gh_call_failed, gh_timeout, gh_unauthenticated, gh_bad_payload, gh_empty_result, and the named residual gh_unclassified. gh_bad_payload covers the WHOLE payload taxonomy - a non-list payload, a non-dict row, a missing requested key and a wrong-typed value - gh_bad_payload''s detail names whichever of the row index and the field the shape CARRIES - a non-list payload, a JSON scalar and unparseable stdout carry neither, a non-dict row carries an index but no field, and only a wrong-typed or missing field carries both - so the assertion is kind-conditional and never demands a field name from a container shape that has none (round-4 note N1). The JSON-null normalisation is a NAMED PER-FIELD ALLOWLIST, never a blanket rule over every declared str field (round-4 note N3): a JSON null becomes the empty string for exactly TWO fields, each with its own in-repo ground. conclusion on both liveness signals, because gh renders an unconcluded run''s conclusion as an empty string where the GitHub API renders null and ci_rca_signals'' own not-conclusion branch already reads both as not-yet-concluded (pinned by test_alert_none_when_conclusion_null_still_running, whose docstring says a null conclusion is not evidence of failure yet), so classifying there would raise a false gh_bad_payload alarm on every in-progress run - a new lie. mergeStateStatus on dependabot, because the base already coerces a null there to the empty string with its own or-empty read, so admitting it PRESERVES base behaviour rather than converting a tolerated shape into a blank backlog. Every OTHER declared str field''s JSON null is gh_bad_payload, and the four consequences are STATED rather than left implicit: a null createdAt, title or headRefName on dependabot, and a null createdAt or url on either liveness signal, now blank that whole signal loudly - None plus an attributed gh_bad_payload line - instead of yielding a silently partial answer (a PR counted in open_total that can never be stranded) or an alert carrying an empty run_url. Every other type mismatch is gh_bad_payload. first_row(signal_key, rows) maps the empty typed list to the named gh_empty_result for the two liveness callers. Leaf module - stdlib only, never raises, never prints (presentation stays in summary.py, per that module''s own docstring boundary) - and it calls subprocess.run through the MODULE ATTRIBUTE so the neighbouring graduated shard''s patch target still resolves. Three internals the relocated boundary must get right and that no re-derivation may drop: the classifier tests FileNotFoundError BEFORE OSError (the former is a subclass of the latter and they classify differently - gh_not_installed against gh_call_failed, round-4 note N15); subprocess.run receives the argv POSITIONALLY, never as an args= keyword, because two retained tests read call_args[0][0] and one of them is the node the graduated convergence-sensor-liveness-signal shard pins (round-4 note N9a); and every value the record stores is JSON-SERIALISABLE with every detail a str, because main() serialises report gh_signal_availability through a single json.dumps at the report write - an exception object parked on the gh_unclassified detail would raise THERE, outside both phases but still aborting session open, and step 6 runs with gh absent so it never reaches that branch (note N10).'
- file: scripts/preflight/dependabot.py
  action: Modify
  purpose: 'Declare the closed field taxonomy _GH_FIELDS (number int; title, headRefName, mergeStateStatus, createdAt str), DERIVE the gh --json argument from it with a join so the requested fields and the declared types cannot drift - the mapping''s INSERTION ORDER is load-bearing, because the retained argv contract test asserts the literal number,title,headRefName,mergeStateStatus,createdAt appears in argv, so the join must reproduce exactly that order (round-4 note N9b) - and replace the inline subprocess block in check_stranded_prs with one gh_probe.run_gh_rows call. The per-element isinstance(pr, dict) continue is re-shaped OUT: a well-formed list of non-dict rows returns a CLEAN backlog on the base today (plan-critique note N10, reproduced: payload ["x"] yields open_total 0), a false clean nothing attributes, and at the boundary it becomes gh_bad_payload - the inversion is recorded in the module docstring (Decision 181), never a silent deletion. That docstring must also record the trade-off the inversion buys, not only the defect it removes (round-4 note N13): the base''s answer for a mixed payload is silently PARTIAL - measured, a payload of one string row plus one 20-day-old PR yields a CLEAN backlog with open_total 1 and that PR stranded - and the boundary makes it all-or-nothing, so ONE malformed row now blanks an otherwise-usable backlog into gh_bad_payload, None and an attributed UNKNOWN line. That is the right direction (loud over silently-incomplete) and gh never emits such rows, but the partial answer is deliberately given up and the docstring says so. _age_days and _ecosystem then receive str BY CONSTRUCTION and need no guard of their own. Return type and payload shape unchanged. The module-level import json and import subprocess are DELETED in the same move: measured at base they are used only at the three lines this step removes, so leaving them behind is two F401s, not zero (round-4 note N8).'
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: 'Route both liveness probes through gh_probe.run_gh_rows plus gh_probe.first_row against the shared _RUN_FIELDS taxonomy (conclusion, createdAt, url - all str), so created_at.replace, head_ref.split and every other STRING accessor on a gh-derived value is total by construction rather than by a per-use-site guard - while the one accessor whose totality depends on a VALUE property rather than a type is named explicitly below instead of claimed away; drop the AWS creds_status gate from both; and attribute the recs half of _check_ci_rca_liveness separately WITHOUT nulling the alert that half guards. The except tuples that remain in this module are left EXACTLY as they are - widening one restores the silent None this plan exists to remove, and NARROWING one is now equally refused. TIMESTAMP TOTALITY, the round-4 B1 fold: the fromisoformat guard KEEPS its (ValueError, TypeError) tuple exactly as it is - the pre-critique draft''s narrowing to ValueError is WITHDRAWN, because the TypeError that tuple catches is not only raised by a non-str createdAt: the subtraction now - run_ts sits inside the same try, so a NAIVE ISO-8601 string (a correctly-typed str that passes the typed boundary untouched) parses to a naive datetime and the subtraction raises TypeError: can''t subtract offset-naive and offset-aware datetimes - reproduced on the base, where the existing tuple catches it and the narrowing would have propagated it out of the phase future and aborted session open, the exact failure this plan exists to prevent. On top of KEEPING the guard, the parse NORMALISES a naive result to UTC before subtracting, exactly as scripts/preflight/dependabot.py''s _age_days already does (pinned by test_naive_timestamp_treated_as_utc), so the naive value ANSWERS rather than degrading to a silent None; the trade-off is recorded rather than assumed - a naive timestamp is read as UTC, which is the repo''s existing convention for this exact field and the only reading gh''s Z-suffixed output can produce. Both subprocess.run blocks LEAVE this module: measured in the prototype clone at 450 SLOC against the base''s 472, a net decrease of 22 and 50 lines of headroom under the hard 500 - before the round-4 naive-timestamp normalisation, which adds about two lines, so about 452 and about 48 lines of headroom; step 13 measures the realised figure. Return types and alert payload shapes unchanged. _check_convergence_sensor_liveness'' own docstring is updated in the same move (round-4 note N14): its three clauses - same creds_status guard, same subprocess gh run list shape with a timeout, same degrade-to-None error handling - all become false in this diff, and the plan otherwise schedules a docstring update only for dependabot.py.'
