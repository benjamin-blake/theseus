  fix_if: 'A gh_probe percentage below 100 names the uncovered lines - add the case to tests/session/preflight/test_gh_probe.py or, when it is a payload shape, to the derived taxonomy in tests/session/preflight/test_gh_payload_matrix.py; a defensive branch no test can reach is a branch to delete, not to exempt. A failure naming scripts/session/preflight.py means the new wiring lines are unexercised - add the missing case to a tests/session/preflight module, never register a config/coverage_baseline.yaml entry to lower the bar. The second leg is SLOW and its DOCUMENTED measurement exceeds the gate it invokes: it runs the whole tests/session/preflight package under coverage, measured at 387 tests in about 360s in a scratch clone at 100 percent for scripts/session/preflight.py, against the checker''s own 300s per-file cap - so the timed-out outcome, not COVERAGE_OK, is the likelier one on a loaded box. A coverage check timed out (300s) error is an environment-speed outcome and is the ONLY non-zero result this step licenses: re-run on a quiet box and read the percentage. It is never evidence of a coverage gap, and it is never resolved by narrowing the file list, by registering a config/coverage_baseline.yaml entry, or by lowering the standard. If it times out repeatedly and the same 300s cap therefore threatens validate_test_coverage in CI, that is a standing-gate finding to file as a recommendation, not a reason to soften this step.'
