execution_steps:
- Run verification step 1 before editing anything - the BEFORE probe must be taken against an untouched tree.
- 'Create scripts/preflight/gh_probe.py - reason constants and KNOWN_REASONS, the SIGNAL_KEYS roster naming the three report keys, a lock-guarded per-run record with reset/record/availability/reason_for (an ANSWERED signal records the named AVAILABLE marker, a KNOWN_REASONS member, and reason_for is the single place that maps that marker to None, so no consumer infers availability from the environment), and the TYPED ENTRY POINT run_gh_rows(signal_key, argv, fields). run_gh_rows runs one gh command and maps FileNotFoundError, TimeoutExpired, other OSError, a non-zero exit (auth-classified from stderr), empty stdout and unparseable JSON each to its own reason; then it VALIDATES the payload - a non-list payload, a non-dict row, a missing requested key and a wrong-typed value are all gh_bad_payload, whose detail names the row index and the field - and returns rows carrying exactly the requested keys with exactly the declared types. The JSON-null normalisation is a NAMED PER-FIELD ALLOWLIST, never a blanket rule over every declared str field (round-4 note N3): a JSON null becomes the empty string for exactly TWO fields, each with its own in-repo ground. conclusion on both liveness signals, because gh renders an unconcluded run''s conclusion as an empty string where the GitHub API renders null and ci_rca_signals'' own not-conclusion branch already reads both as not-yet-concluded (pinned by test_alert_none_when_conclusion_null_still_running, whose docstring says a null conclusion is not evidence of failure yet), so classifying there would raise a false gh_bad_payload alarm on every in-progress run - a new lie. mergeStateStatus on dependabot, because the base already coerces a null there to the empty string with its own or-empty read, so admitting it PRESERVES base behaviour rather than converting a tolerated shape into a blank backlog. Every OTHER declared str field''s JSON null is gh_bad_payload, and the four consequences are STATED rather than left implicit: a null createdAt, title or headRefName on dependabot, and a null createdAt or url on either liveness signal, now blank that whole signal loudly - None plus an attributed gh_bad_payload line - instead of yielding a silently partial answer (a PR counted in open_total that can never be stranded) or an alert carrying an empty run_url. Every other type mismatch is gh_bad_payload. gh_bad_payload''s detail names whichever of the row index and the field the shape CARRIES - a non-list payload, a JSON scalar and unparseable stdout carry neither, a non-dict row carries an index but no field, and only a wrong-typed or missing field carries both - so the assertion is kind-conditional and never demands a field name from a container shape that has none (round-4 note N1). Classify FileNotFoundError BEFORE OSError - the former is a subclass of the latter and they map to different reasons (round-4 note N15). Record every detail as a str, because the record is serialised by main''s single json.dumps outside both phases (round-4 note N10). Pass the argv to subprocess.run POSITIONALLY (round-4 note N9a). Read stderr TOLERANTLY (note N4): existing stubs reach the auth classifier as bare MagicMocks with no stderr attribute, so coerce a missing or non-str stderr to the empty string before any lower/regex work rather than misclassifying an auto-MagicMock. Add first_row(signal_key, rows) mapping the empty typed list to the named gh_empty_result for the two liveness callers. The classifier is CLOSED: the residual branch records the NAMED gh_unclassified rather than swallowing an unmodelled exception (Decision 155 refused to license a generic catch-all; Decision 170 clause 2''s named classifier is the shape). import subprocess and call subprocess.run through the module attribute - never from subprocess import run - so the convergence-sensor-liveness-signal shard''s patch target still resolves. Never raises, never prints.'
- 'Modify scripts/preflight/dependabot.py - declare _GH_FIELDS (number int; title, headRefName, mergeStateStatus, createdAt str), build the argv once with the --json argument DERIVED from that mapping by a join, and replace the whole inline subprocess block in check_stranded_prs with one gh_probe.run_gh_rows call plus an early return on None. Delete the now-dead per-element isinstance(pr, dict) continue and the isinstance(prs, list) guard: both are subsumed by the boundary, and the non-dict-row state changes meaning from a silent skip to gh_bad_payload - record that inversion in the module docstring (Decision 181), because on the base a payload of non-dict rows returns a CLEAN backlog that nothing attributes - and record in the same docstring what the inversion COSTS (round-4 note N13): the base''s answer for a mixed payload is silently PARTIAL (measured: one string row plus one 20-day-old PR yields a clean backlog with open_total 1 and that PR stranded), and the boundary makes it all-or-nothing, so one malformed row now blanks an otherwise-usable backlog. Say that the partial answer is deliberately given up, not only that the skip was a false clean. Read fields by subscript now that presence and type are guaranteed. Return type and payload shape unchanged, and check_stranded_prs keeps its EMPTY signature. Delete the now-dead module-level import json and import subprocess too: measured at base they are used only at the three lines this step removes, so leaving them is two F401s (round-4 note N8). Build the --json argument so the join reproduces exactly number,title,headRefName,mergeStateStatus,createdAt - the retained argv contract asserts that literal (round-4 note N9b).'
- 'Modify scripts/preflight/ci_rca_signals.py - declare the shared _RUN_FIELDS taxonomy (conclusion, createdAt, url, all str) and the two argv constants with their --json argument derived from it, then route both liveness probes through gh_probe.run_gh_rows plus gh_probe.first_row. Delete both inline subprocess blocks and the module-level json and subprocess imports they were the last users of (measured: two F401s). Add NO payload guard of your own - the boundary already guarantees every field''s type, which is what makes created_at.replace total. NO except-tuple change is permitted in either direction: fromisoformat''s guard KEEPS its (ValueError, TypeError) tuple, because the pre-critique narrowing would have opened a new raise path through phase_b for a naive ISO-8601 str, which is a correctly-typed value the boundary passes untouched and whose subtraction raises TypeError (round-4 B1). Separately, and as the fix rather than the guard, NORMALISE a naive parsed timestamp to UTC before subtracting - the same two lines scripts/preflight/dependabot.py''s _age_days already carries - so that value ANSWERS instead of degrading to a silent None. Delete the blanket creds_status gate from both probes. In _check_ci_rca_liveness, an explicitly supplied cache_rows of None means the recs half cannot answer: record aws_creds_unavailable when creds_status is not ok and recs_cache_unavailable when it is - and record it ONLY on the path that actually consults the recs half (main red past the 30-minute grace), because a green or within-grace main answered without that half and must record available, or every reader outage prints a false UNKNOWN. When the recs half cannot answer on the red path, RETURN THE SAME {run_url, elapsed_minutes} payload rather than None: that alert fires on origin/main today and .claude/commands/orient.md scores it a HARD ALERT, so nulling it would convert a live alert into an /orient PASS. Update _check_convergence_sensor_liveness'' docstring in the same edit (round-4 note N14): its three clauses - same creds_status guard, same subprocess gh run list shape with a timeout, same degrade-to-None error handling - are all false after this diff.'
- 'Modify scripts/preflight/summary.py - give print_dependabot_stranded_alert and print_convergence_sensor_liveness_alert an optional reason, add print_ci_rca_liveness_alert covering all FOUR (alert, reason) cells - no alert and no reason renders nothing; no alert with a reason renders the attributed SKIPPED line; an alert with no reason renders the plain alert line; an alert WITH a reason renders the alert line carrying a rec-since-status UNKNOWN qualifier that names the reason, and never the SKIPPED marker. The three marker literals step 2 asserts are pinned HERE, not discovered by failure (note N9): Dependabot backlog UNKNOWN, CI-RCA liveness check SKIPPED, Convergence sensor liveness check SKIPPED. Emit the mcp__github__ operator route from ONE helper applied per line, so every gh-class line carries it in its own output (Decision 60, Decision 76, note N1), and add a _gh_signal_suffix token to _format_preflight_summary that stays empty when the availability map is absent or fully available.'
- Modify scripts/session/preflight.py - import gh_probe in the existing package import tuple, call gh_probe.reset() at the top of main, write report gh_signal_availability from gh_probe.availability() after phase B, and pass each signal's reason to its renderer. Nothing inside the phase_b block.
- 'Create tests/session/preflight/test_gh_probe.py and tests/session/preflight/test_summary.py, and create tests/session/preflight/test_gh_payload_matrix.py whose 95 cases - the 92 type-shape rows plus one naive-ISO-8601 createdAt VALUE row per signal (round-4 B1) - are GENERATED from the same field mappings the modules declare (never hand-listed) and whose assertions live in ONE module-level run_case(case) that step 3 leg B also calls. Re-shape the gh-degradation and None-renderer cases in test_dependabot.py and the creds-gate and degradation cases in test_ci_rca_signals.py, each carrying a docstring recording the inversion - for the cache_rows=None cases that docstring must state plainly that the live HARD ALERT is PRESERVED with the recs half attributed, and that the earlier draft''s null was refused because it would have converted a live HARD ALERT into an /orient PASS; for test_non_dict_rows_are_skipped_not_fatal it must state that the silent skip was a false clean and is now gh_bad_payload. Retarget all THREE dependabot patch sites to the boundary (the module-level _run_with helper, the two direct patches in TestGhDegradation, and TestGhInvocationContract''s argv-and-kwargs contract - measured: 25 of 49 fail until retargeted, 48 of 49 pass after); add stderr to the bare MagicMock stubs in test_ci_rca_signals.py that now reach the auth classifier; extend the conftest escape hatch to BOTH new modules and make gh_probe.reset() an AUTOUSE fixture (never a per-test call) so pytest-randomly''s collection order cannot leak one module''s process-global record into TestProductionShape; add the two alert-preserved cases and the green-main no-false-alarm case to test_ci_rca_signals.py; and register the new report key and bump both counts AND the TestReportSchemaFreeze docstring''s prose count in tests/test_session_preflight_decomposition.py. Rename or split test_dependabot.py::TestGhDegradation::test_gh_missing_returns_none, which drives OSError rather than FileNotFoundError and would otherwise assert gh_call_failed under a name promising gh_not_installed (round-4 note N15). Add the naive-ISO-8601 createdAt case for _check_ci_rca_liveness to test_ci_rca_signals.py, mirroring test_dependabot.py::TestAgeDays::test_naive_timestamp_treated_as_utc, so the B1 property has a direct case beside its matrix row.'
- 'Write the graduated shard for step 7 BEFORE running the Verification Plan (step 10 asserts the touched set equals declared scope, and the shard is a scope row): config/agent/verification_registry/entries/preflight-gh-signals-attribute-their-silence.yaml, filename equal to its own check_id (Decision 176), with primitive_slot test_selector, guard_target scripts/preflight/gh_probe.py, guard_symbol run_gh_rows (the typed boundary entry point, not the pre-pivot run_gh_json), plan_slug preflight-gh-signals-speak, graduated_at set, and check_spec.node_id tests/session/preflight/test_gh_probe.py::TestProductionShape. guard_target names the guarded SOURCE module, not the test path - the test is named by check_spec.node_id.'
- Execute the Verification Plan - run each step in id order, loop until pass; on unrecoverable failure stop and RCA (Decision 55). Step 1 must already have been run against the untouched tree. Before handoff, spot-measure the wall-clock of hermetic steps 3, 4, 5, 13 and 16 (step 2 is hermetic false after note N2 and is not replayed) and add them to the vp_replay budget arithmetic in context - the 120s aggregate cap is shared with any other plan resolved in the same PR, and a breach appends a hard CI failure rather than truncating.
