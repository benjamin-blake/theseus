  action: Create
  purpose: Transport failure-class classification (the twelve rows step 3 leg A drives), the availability record including concurrent recording, the typed-row contract of run_gh_rows including the gh argv and subprocess kwargs that moved here from dependabot (timeout 15, capture_output, text, encoding utf-8, errors replace), the CI-RCA liveness attribution split, and the standing production-shape guard that drives the three signals unmocked. The twelve transport rows include the FileNotFoundError-before-OSError ordering as two DISTINCT rows (round-4 note N15), and the argv contract asserts the positional call shape the graduated shard's neighbour depends on (round-4 note N9a).
- file: tests/session/preflight/test_gh_payload_matrix.py
  action: Create
  purpose: 'The payload matrix, DERIVED from each signal''s declared field taxonomy rather than hand-listed: for each of the three signals, for each requested field, for each wrong-type shape (int, float, bool, list, dict for a str field; str, float, bool, list, dict, null for an int field), plus the JSON-null row for every str field (three of which are the per-field-allowlist NORMALISATION and the other seven gh_bad_payload, round-4 note N3), the missing-key row for every field, the five container shapes (a non-dict row, a JSON object, a JSON scalar, an empty list, unparseable stdout), and one naive-ISO-8601 VALUE row per signal on createdAt - the shape B1 proved the type-only matrix could never reach, since it varies a value WITHIN the declared str type. 95 cases: the 92 type-shape cases measured in the prototype clone (40/26/26) plus the three value-shape rows folded in at round 4, DERIVED as 41 dependabot, 27 ci_rca_liveness, 27 convergence_sensor and re-measured at implement time rather than inherited. Each case drives the REAL public function with subprocess.run patched at the boundary, asserts no raise, asserts the signal''s return value, and asserts the recorded reason AND, for the cases that actually record gh_bad_payload, that its detail names whichever of the row index and the field that shape carries - the assertion is kind-conditional, because 21 of the 95 cases carry no field, no index, or no gh_bad_payload at all: nine container shapes (a JSON object, a JSON scalar and unparseable stdout, per signal) carry neither index nor field, three non-dict rows carry an index but no field, three empty lists record gh_empty_result, and the three allowlisted JSON-null normalisations and three naive-timestamp value rows record no failure at all. The other seven JSON-null rows DO classify and DO carry both, so they stay under the full assertion (round-4 note N1). The assertion body lives in ONE module-level run_case(case) function that both the pytest parametrisation and step 3 leg B call, so the standing test and the verification step can never drift apart.'
