  phase: pre-deploy
  action: Coverage. First measure the NEW module directly (the checker maps scripts/preflight/** to None, so it would otherwise go ungated), then run the real per-file checker over every changed or new scripts/ file.
  command: 'J="$(mktemp -d)/gh_probe_cov.json"; _COVERAGE_SUBPROCESS=1 bin/venv-python -m pytest tests/session/preflight/test_gh_probe.py tests/session/preflight/test_gh_payload_matrix.py --cov=scripts/preflight --cov-report=json:"$J" --cov-fail-under=0 -q --no-header -p no:cacheprovider --randomly-seed=12345 >/dev/null 2>&1; bin/venv-python -c "

