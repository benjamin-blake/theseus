test_obligations:
- source: scripts/preflight/gh_probe.py
  behavior: 'Every gh failure class classifies to its own named reason, and the payload boundary is TOTAL: run_gh_rows returns list[dict] whose every row carries exactly the requested keys with exactly the declared types, or one named reason and None. The twelve transport rows (gh absent, OSError, residual exception, timeout, unauthenticated, non-zero exit, empty stdout, unparseable JSON, JSON null, a JSON object, an answered call and an empty run list) are pinned here; the 92 derived payload cases are pinned in the matrix module. A successful call records the named available marker that reason_for maps to None, and an unrecorded signal reports not_probed rather than a clean answer.'
  verification_step: 7
  test_selector: tests/session/preflight/test_gh_probe.py::TestFailureClassification
  red_green_expectation: Red before (the module does not exist on origin/main, so the case cannot collect), green after.
- source: scripts/preflight/dependabot.py
  behavior: 'Every unusable gh outcome still returns None AND now records the named reason, so a consumer renders an attributed UNKNOWN instead of a clean backlog - including the case the base gets wrong in the other direction: a well-formed list of non-dict rows, which returns a CLEAN backlog today and now records gh_bad_payload (the re-shape is docstring-recorded, never a deletion). The module docstring records both halves of the inversion: the false clean it removes and the silently partial answer it deliberately gives up (round-4 note N13).'
  verification_step: 7
  test_selector: tests/session/preflight/test_dependabot.py::TestGhDegradation
  red_green_expectation: Red before (the re-shaped cases assert a reason the base never records), green after.
- source: scripts/preflight/ci_rca_signals.py
  behavior: Neither liveness probe is gated on AWS credentials; every unanswerable path records a named reason instead of a bare None; every gh-derived value is typed at the boundary, so no payload shape raises through the phase future and no per-use-site guard is added; and a red-main alert whose recs half cannot answer is RETURNED with its reason recorded rather than nulled - while a green main with the same unavailable recs cache records available and prints nothing. A naive-ISO-8601 createdAt - a correctly-typed str the boundary passes untouched - is normalised to UTC before the elapsed subtraction rather than degrading to a silent None, and the existing (ValueError, TypeError) guard around that parse is KEPT (round-4 B1).
  verification_step: 7
  test_selector: tests/session/preflight/test_ci_rca_signals.py
  red_green_expectation: Red before (the base returns None under creds_status unavailable, records nothing, and raises rather than classifying on a non-list payload), green after.
- source: scripts/preflight/summary.py
  behavior: Each renderer prints one attributed line when its signal could not answer and stays silent only when it genuinely answered; every gh-class line names the mcp__github__ operator route IN ITS OWN OUTPUT; print_ci_rca_liveness_alert additionally covers the half-answered cell, printing the alert line with a rec-since-status UNKNOWN qualifier naming the reason and no SKIPPED marker; the summary line carries the gh_signals token.
  verification_step: 7
  test_selector: tests/session/preflight/test_summary.py
  red_green_expectation: Red before (the module and the renderers it exercises do not exist on origin/main), green after.
- source: scripts/session/preflight.py
  behavior: main writes the additive gh_signal_availability report key and passes each signal's reason to its renderer, without touching the phase_b block.
  verification_step: 7
  test_selector: tests/test_session_preflight_decomposition.py::TestReportSchemaFreeze
  red_green_expectation: Red before (the frozen key set has 50 keys and no gh_signal_availability), green after.
- source: tests/session/preflight/test_gh_payload_matrix.py
  behavior: 'The payload matrix stays DERIVED from the declared field taxonomy and stays complete: 95 cases - for each of the three signals, each requested field crossed with each wrong-type shape, each JSON-null row, the missing-key row, the five container shapes, and one naive-ISO-8601 createdAt VALUE row per signal (round-4 B1, the shape a type-only matrix structurally cannot reach) - each asserting no raise, the signal''s return value, the recorded reason and, for the cases that record gh_bad_payload, that its detail names whichever of the row index and the field that shape carries (round-4 note N1). The assertion body is the module''s own run_case, which step 3 leg B also drives, so the standing test and the verification step cannot diverge.'
  verification_step: 7
  test_selector: tests/session/preflight/test_gh_payload_matrix.py
  red_green_expectation: 'Red before (measured on the base clone: the module cannot collect, ImportError cannot import name gh_probe, pytest exits 2; and behaviourally 15 of its 92 type-shape cases raise on origin/main, with the naive-timestamp row for _check_ci_rca_liveness degrading to a silent None there), green after.'
- source: config/agent/verification_registry/entries/preflight-gh-signals-attribute-their-silence.yaml
  behavior: The graduated shard is one record whose filename equals its check_id and whose guard_target, guard_symbol and check_spec.node_id resolve to real symbols, and the neighbouring convergence-sensor-liveness-signal shard it sits beside keeps a live pinned node.
  verification_step: 16
