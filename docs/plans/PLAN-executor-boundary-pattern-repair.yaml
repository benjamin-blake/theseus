schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "executor-boundary-pattern-repair"
intent: >-
  Repair the executor self-modification boundary, which names a file deleted at T-1.13 and therefore
  leaves the /develop-executor command dispatcher, the executor-rca skill it delegates to, and the
  boundary's own SSOT declared-unprotected, and record the supervision-surface work that motivated
  the discovery as a roadmap tier item rather than building it against an unratified substrate.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-boundary-pattern-repair.yaml
phase: >-
  Executor enablement -- governance boundary repair. Substrate-neutral: it names no compute
  substrate and survives whichever way the layer-2 comparative spike rules.
scope:
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Replace the boundary_patterns entry develop-executor.prompt.md, whose file was deleted at
      T-1.13, with develop-executor, and add executor-rca and executor/capabilities.yaml. The three
      cover the command dispatcher, the skill it delegates to, and this file itself -- the boundary's
      own SSOT presently sits outside its own boundary. Both additions have a MEASURED blast radius
      of zero recommendations. This is the Decision 117 single source of truth.
  - file: scripts/classify_automatable.py
    action: Modify
    purpose: >-
      The same three rows in _BOUNDARY_PATTERNS. Decision 117's reversal condition names drift
      between this list and the SSOT, so they move in the same commit.
  - file: tests/test_classify_automatable.py
    action: Modify
    purpose: >-
      Two discriminating assertions -- that a boundary pattern covers each of the three now-declared
      surfaces and that each XS-effort verdict flips, and that the dead row leaves both lists in
      lockstep. Mapped test home for scripts/classify_automatable.py.
  - file: config/agent/executor/instructions/executor-supervisor-rules.instructions.md
    action: Modify
    purpose: >-
      Remove the deleted .github/prompts path from the applyTo glob and from the module-map row at
      line 28. DELETION ONLY -- the glob is not repointed at any live surface (see constraints).
  - file: config/agent/executor/instructions/executor-supervisor-workflow.instructions.md
    action: Modify
    purpose: >-
      Remove the deleted .github/prompts path from the applyTo glob. DELETION ONLY, same rationale.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Add tier item T4.18 recording the operator supervision surface as forward intent, with its
      prerequisites as exit criteria. Per Decision 86, forward intent routes to a tier_item -- never
      to prose and never to a speculative artefact authored ahead of its substrate.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Write the TWO graduated rows VP steps 1 and 4 owe. validate_graduation_completeness requires a
      new-in-diff row per graduate step, whose check_id equals that step's graduation_check_id and
      whose plan_slug equals this plan's slug; without them the full tier hard-fails. This file is a
      single append-only list, so it conflicts deterministically with any concurrent plan -- resolve
      "keep both" rather than choosing (rec-3231). It also sits near its effective-line ceiling, so
      use the compact flow-mapping row shape rather than an expanded block.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A boundary pattern in config/agent/executor/capabilities.yaml matches each of
    .claude/commands/develop-executor.md, .claude/skills/executor-rca/SKILL.md and
    config/agent/executor/capabilities.yaml itself, under the substring rule
    scripts/ops_portal/risk_scoring.py applies, and compute_automatable for each at effort XS
    returns False. The third closes a self-referential hole -- the boundary's own single source of
    truth currently sits outside its own boundary.
  - >-
    The row develop-executor.prompt.md is absent from both boundary_patterns and
    scripts/classify_automatable.py._BOUNDARY_PATTERNS, and develop-executor, executor-rca and
    executor/capabilities.yaml are present in both -- the lockstep Decision 117's reversal condition
    actually requires, not full list parity.
  - >-
    Neither instructions file references .github/prompts/develop-executor.prompt.md in its applyTo
    glob or its body, and neither glob has been widened to any new surface.
  - >-
    docs/ROADMAP-PLATFORM.yaml carries tier item T4.18 with structured exit criteria, status
    not_started, naming the substrate dependency and the observability-IAM prerequisite.
  - >-
    No .claude/skills/ or .claude/commands/ file is created or modified by this plan.
verification_plan:
  - step: 1
    phase: pre-deploy
    graduation: graduate
    graduation_check_id: executor-boundary-covers-live-supervisor-surface
    action: >-
      Prove the boundary DECLARATION covers the live supervisor surface, and that the XS-effort
      verdict actually flips. The pattern assertion and the XS assertion are both required -- the
      surface is currently automatable at XS (risk 1.0 <= ceiling 1.0) and non-automatable at S and
      above, so an assertion at S alone would be green on both sides and prove nothing.
    command: >-
      bin/venv-python -m pytest
      "tests/test_classify_automatable.py::test_boundary_covers_live_supervisor_surface"
      "tests/test_classify_automatable.py::test_boundary_lists_move_in_lockstep" -q
    expected: "2 passed"
    fix_if: >-
      Pre-edit this exits 4 with "ERROR: not found" on both node ids, because neither exists yet.
      Node ids are named explicitly rather than selected with -k: the substring "boundary" already
      matches three unrelated tests in this module (TestIsBoundaryFile::test_non_boundary,
      ::test_executor_dir, TestClassify::test_boundary_file_rejected), so a -k selector would report
      a count that has nothing to do with this change. If the two named tests pass pre-edit, the
      assertion is on the wrong thing -- it must assert on the pattern list and on the XS verdict,
      never on the composite verdict at an effort where the maturity ceiling already denies.
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A repo-wide sweep is a transient completeness assertion about this specific change, not a
      standing invariant; step 1's registered guard is the durable protection and this would
      register a second, weaker one over the same property.
    action: >-
      Closure obligation -- the retired surface is unreachable from live, non-historical files. The
      pattern is bound ONCE to a shell variable used by both the sweep and the control, against a file
      known to retain it, so a typo collapses the control to zero and the check fails rather than
      reporting a clean sweep. Verified both ways: the correct pattern gives 5/5, a typo'd one gives
      0/0 and exits non-zero. An earlier form that typed the literal twice and controlled on a
      different literal in a different file produced a demonstrated false pass. Four exclusions, all
      deliberate: docs/CHANGELOG.md and the SESSION_LOG/DECISIONS_ARCHIVE ledgers are append-only
      history that correctly retains references to deleted files; docs/INTENT-* are the Decision 86
      clause 3 retiring set, each carrying its own per-doc drift reconciliation, and their three
      surviving references are recorded on T4.18 rather than fixed here. Discovered at execution
      time (pre-edit, both files scored zero): tests/test_classify_automatable.py's own
      test_boundary_lists_move_in_lockstep asserts the dead row's ABSENCE by literal string, and
      docs/ROADMAP-PLATFORM.yaml's new T4.18 criterion c7 names the dead path descriptively while
      recording the docs/INTENT-* cleanup this sweep already routes elsewhere -- both are this
      plan's own new content proving the fix, not stale legacy references, so both are excluded on
      the same historical/self-referential-mention rationale as the four above.
    command: >-
      p="develop-executor.prompt.md"; hits=$(grep -rn "$p" --include=*.py --include=*.yaml --include=*.md . |
      grep -vE '(^\./\.git|^\./logs/|^\./docs/plans/|^\./audits/|SESSION_LOG|DECISIONS_ARCHIVE|^\./docs/INTENT-|^\./docs/CHANGELOG\.md|^\./tests/test_classify_automatable\.py|^\./docs/ROADMAP-PLATFORM\.yaml)' |
      wc -l); ctl=$(grep -rn "$p" --include=*.md docs/CHANGELOG.md | wc -l);
      echo "live_stale_refs=$hits control=$ctl"; [ "$hits" -eq 0 ] && [ "$ctl" -gt 0 ]
    expected: "live_stale_refs=0 control=5, exit 0"
    fix_if: >-
      A non-zero hits count names a live file still referencing the deleted path. A control of 0
      means the pattern or the traversal is broken, so the zero-hits result is meaningless -- that
      is the whole point of using the identical literal for the control. tests/test_classify_automatable.py
      and docs/ROADMAP-PLATFORM.yaml are excluded because this plan's own new content in each
      legitimately mentions the dead path as text (a negative-assertion literal and a T4.18
      criterion, respectively) -- verify any future non-zero hit there is still one of those two
      known lines before assuming the exclusion is being abused to hide a real regression.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The asserted state is intentionally TRANSIENT. T4.18's status must legitimately move to
      in_progress and then complete as the work proceeds, so a standing registered guard pinning it
      to not_started would fire falsely the moment the item is picked up -- registering a check
      designed to become wrong is worse than registering none.
    action: >-
      Prove the forward intent was persisted rather than dropped. PARSES the roadmap rather than
      grepping a line window: an earlier -A 400 form was shown to bleed into neighbouring items and
      returned "T5.1 present and not_started" for an item whose own status is deferred_post_mvp.
      Structural validity (structured criteria, depends_on referential integrity) is checked by
      validate_platform_roadmap inside step 4 and deliberately not duplicated here.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      i=[t for t in d['tier_items'] if t['id']=='T4.18']; assert len(i)==1, f'expected exactly one
      T4.18, got {len(i)}'; assert i[0]['status']=='not_started', i[0]['status']; print('OK: T4.18
      present and not_started')"
    expected: "OK: T4.18 present and not_started"
    fix_if: >-
      A non-zero exit names the actual failure -- the item is absent, duplicated, or carries a
      different status. If step 4's validate_platform_roadmap fails while this passes, the item
      exists but its exit_criteria are bare strings rather than the structured id/text/status
      entries check (ii) requires of a newly added item, or its depends_on breaks rule (f) by naming
      a deferred_post_mvp item.
  - step: 4
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Differential admission rejected the candidate as tautological: scripts.verification_graduation.run_differential
      returned admitted=False, reason "not admitted -- revert did not produce FAIL (tautological)". Neither
      instructions file contained a .claude/ reference on origin/main either -- this diff only removes the
      .github/prompts/develop-executor.prompt.md reference, so the revert-to-origin/main leg also PASSES (0
      matches) instead of failing. The invariant this step proves is real and durable (see action text below),
      but the differential mechanism needs a discriminating diff to key off and this one is not it -- confirmed
      empirically, not assumed.
    action: >-
      Prove acceptance criterion 3 -- neither instructions glob names a .claude/ surface. This is a
      DURABLE repository invariant, not a property of this diff: the two instruction bodies instruct
      an agent to work on main, to commit directly to main, and to file recommendations by
      hand-editing the recommendations read cache, so no .claude/ surface should ever fall under
      their applyTo. Split from the transient half deliberately (step 5) because bundling a standing
      invariant with a diff assertion under one waiver would misclassify it.
    command: >-
      w=$(grep -c '\.claude/' config/agent/executor/instructions/executor-supervisor-rules.instructions.md
      config/agent/executor/instructions/executor-supervisor-workflow.instructions.md |
      awk -F: '{s+=$2} END{print s+0}'); echo "claude_refs_in_globs=$w"; [ "$w" -eq 0 ]
    expected: "claude_refs_in_globs=0, exit 0"
    fix_if: >-
      A non-zero count means a .claude/ surface was added to an instructions applyTo, newly
      subjecting it to bodies that contradict live AGENTS.md hard rules. Measured at 0 today, so
      this guard admits by failing on a tree where the glob was widened rather than by flipping
      red-to-green on this change.
  - step: 5
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Asserts the ABSENCE of edits in THIS diff. Once merged the diff no longer exists, so there is
      nothing durable to guard -- unlike step 4's glob invariant, which is why the two were split
      rather than sharing one disposition.
    action: >-
      Prove acceptance criterion 5 -- no .claude/ file is created or modified. Creating one would
      incur the S4 prose-registration gate this plan avoids by construction.
    command: >-
      c=$(git diff --name-only origin/main -- .claude/ | wc -l); echo "claude_files_changed=$c";
      [ "$c" -eq 0 ]
    expected: "claude_files_changed=0, exit 0"
    fix_if: >-
      A non-zero count means a .claude/ file was touched. If a skill file was genuinely required,
      the plan's scope and its prose-budget constraint both need revisiting first.
  - step: 6
    phase: pre-deploy
    graduation: not-applicable
    action: >-
      Full presubmit tier, not --pre. This change is documentation, configuration and one test, so
      the tier is chosen for the registered guards it runs -- validate_platform_roadmap,
      validate_prose_limits, the executor-boundary checks and the coverage gate -- not for its
      integration legs. Note the tier makes live credential-backed calls (DataQualityVerifier is the
      dominant cost at roughly 280 seconds) and can therefore redden for reasons unrelated to this
      change; a failure in a live-data verifier is not this plan's defect and must not be
      forward-fixed here.
    command: bin/venv-python -m scripts.validate
    expected: >-
      Two lines, verbatim -- "=== Validation Summary (scope: all) ===" followed by "All checks
      passed." -- and exit code 0.
    fix_if: >-
      Any registered check owned by this change fails. Do not commit on a partial pass; the handoff
      policy requires a completed full-tier exit 0.
test_obligations:
  - source: config/agent/executor/capabilities.yaml
    behavior: >-
      boundary_patterns declares coverage of the live supervisor surface, so protection no longer
      rests on the incidental maturity-ceiling term that lapses at XS effort.
    verification_step: 1
    test_selector: tests/test_classify_automatable.py::test_boundary_covers_live_supervisor_surface
    red_green_expectation: >-
      RED before -- no pattern matches .claude/commands/develop-executor.md, and
      compute_automatable(path, "XS") returns True. GREEN after both clauses.
  - source: scripts/classify_automatable.py
    behavior: >-
      The duplicate _BOUNDARY_PATTERNS list drops the dead row and gains the live one in the same
      commit as the SSOT.
    verification_step: 1
    test_selector: tests/test_classify_automatable.py::test_boundary_lists_move_in_lockstep
    red_green_expectation: >-
      RED before -- both lists still carry develop-executor.prompt.md and neither carries
      develop-executor. GREEN after.
  - source: tests/test_classify_automatable.py
    behavior: >-
      Both new assertions are authored and resolvable by their exact node ids. Node ids are named
      rather than -k selected because the substring "boundary" already matches three unrelated
      tests in this module, so a keyword selector would report a count unrelated to this change.
    verification_step: 1
    command: >-
      bin/venv-python -m pytest
      "tests/test_classify_automatable.py::test_boundary_covers_live_supervisor_surface"
      "tests/test_classify_automatable.py::test_boundary_lists_move_in_lockstep" -q
    red_green_expectation: >-
      RED before -- pytest exits 4 with "ERROR: not found" on both node ids. GREEN (2 passed) once
      both are authored.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Tier item T4.18 persists the supervision forward intent with structured, not_started criteria.
    verification_step: 3
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      i=[t for t in d['tier_items'] if t['id']=='T4.18']; assert len(i)==1, f'expected exactly one
      T4.18, got {len(i)}'; assert i[0]['status']=='not_started', i[0]['status']; print('OK: T4.18
      present and not_started')"
    red_green_expectation: >-
      RED before -- AssertionError "expected exactly one T4.18, got 0". GREEN after.
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      The single graduated row VP step 1 owes exists, with check_id
      executor-boundary-covers-live-supervisor-surface and plan_slug executor-boundary-pattern-repair.
    verification_step: 6
    command: bin/venv-python -m scripts.validate
    red_green_expectation: >-
      RED before -- validate_graduation_completeness fails the plan PR with "declared graduate ...
      but no matching new-in-diff registry row found". GREEN once the row is written.
constraints:
  - >-
    DO NOT REPOINT the instructions-file applyTo globs onto any live surface. Their BODIES instruct
    an agent to work on main, to activate a venv and call bare python, to commit directly to main,
    and to file recommendations by hand-editing logs/.recommendations-log.jsonl -- the last a direct
    Single Portal Invariant violation. Widening their reach would propagate rule-contradicting
    instructions onto surfaces they do not govern today. This plan DELETES the dead path and nothing
    more; the body rot is recorded on T4.18 and filed as its own work.
  - >-
    Decision 117 states a REVERSAL CONDITION, not a requirement: "revisit if classify_automatable's
    duplicate list drifts from capabilities.yaml again without a lockstep fix". Its precedent is
    per-row (both lists were cleaned in one session to drop two named rows), which is the reading
    this plan follows. Note honestly that the standing 14-entry divergence arguably already arms
    that reversal condition -- closing it would change the automatable verdict for a broad
    population of recommendations and needs its own decision, so it is recorded on T4.18. Do not
    widen the classifier beyond the three rows this plan names, each of which was chosen because its
    blast radius is measured at zero.
  - >-
    Do NOT add an AGENTS.md row to boundary_patterns in this plan, even though AGENTS.md is
    XS-automatable today by the same defect. It is the one candidate with a real blast radius:
    17 recommendations target it and 12 of those are open with automatable true, so the row would
    flip them into validate_executor_boundary violations and redden the full tier in any container
    where the read cache exists. Those 12 must be re-derived through the portal first, which is
    T4.18's work.
  - >-
    Editing AGENTS.md's own TEXT is separately out of scope: its S1 budget has ZERO headroom
    (measured 26,768 against a 26,768 ceiling) and a raise cannot be authorized without first
    authoring a Decision whose body contains the literal root_ambient_load_set -- no live Decision
    does, and the marker guard's ancestor expansion cannot help because a single-segment key expands
    to nothing. Line 99's text accurately describes the live command; it is excluded on byte-ceiling
    grounds alone, not because it is stale. This is a distinct constraint from the row question
    above, which costs zero prose bytes.
  - >-
    T4.18's depends_on must not name any deferred_post_mvp item. Rule (f) in
    scripts/platform_roadmap_models.py hard-fails a not_started item depending on one, and several
    T4 siblings (T4.5-T4.10, T4.12) carry that status. T4.15 is not_started and is a safe dependency.
  - >-
    No .claude/skills/ or .claude/commands/ file is created or modified. Creating a skill file would
    require a new S4 prose-budget registration, which the raise-marker guard gates identically to a
    raise (gates_new_entry is unconditionally true).
  - No rescue agents or workaround loops (Decision 55).
  - >-
    This plan grants no IAM, builds no infrastructure and names no compute substrate.
context:
  - >-
    "Decision-scout verdict + CITE list (verbatim decision ids)": FLAGS_FOUND, 126 of 126 decisions
    triaged against the superseded predecessor of this plan. CITE -- Decision 55, Decision 117,
    Decision 76, Decision 67, Decision 127, Decision 143, Decision 39. RELATED -- Decision 44,
    Decision 72, Decision 86, Decision 75, Decision 48. The two flags that bound on the predecessor
    (Decision 90's tier-4 role pin, and Decision 126's closed three-intent enumeration) are both
    DISSOLVED by this rescope: no role is redefined and no fourth intent is created.
  - >-
    "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE-then-addressed after 2 round(s)" --
    round 1 ran against the withdrawn predecessor (REVISE, 6 blockers); round 2 ran against this plan
    and returned REVISE with three required changes, all three applied and empirically verified: the
    two zero-blast-radius boundary holes routed (capabilities.yaml fixed here, AGENTS.md to T4.18),
    step 4 split so a durable grep invariant is graduated separately from a transient diff assertion,
    and the intent/AC-1 wording narrowed to what is actually proved. Four adversarial lenses also ran
    across the two rounds -- boundary security, verification rigour, governance accuracy, frame-lock
    -- plus a prior-findings regression check.
  - >-
    Predecessor history -- PLAN-develop-executor-supervisor.yaml was authored, run through five
    fresh-context gates (the mandatory plan-critique plus four adversarial lenses: boundary
    security, verification rigour, governance accuracy, frame-lock) and returned
    REVISE/REVISE/REVISE/REVISE/BLOCK. It was withdrawn rather than patched. This plan is the
    substrate-neutral half; the supervision half is persisted as T4.18 instead of being built.
  - >-
    Verified defect this repairs -- .github/prompts/develop-executor.prompt.md was deleted at T-1.13
    but survives as a boundary_patterns row. The live surface .claude/commands/develop-executor.md
    matches NO boundary pattern, so its protection comes only from the risk formula's maturity
    ceiling, which denies at effort S and above but ALLOWS at XS. Measured: compute_automatable at
    XS returns True for that path, and for AGENTS.md and for capabilities.yaml itself. XS is the
    modal effort for a small documentation edit, so the gap is reachable rather than theoretical.
  - >-
    Adjacent findings recorded on T4.18 rather than fixed here -- the 14-entry divergence between
    the SSOT and the classifier duplicate; the rule-contradicting bodies of both instructions files;
    the absence of .claude/skills/ and .claude/commands/ as boundary classes; and the fact that
    validate_executor_boundary is inert in CI because it returns silently when the gitignored
    recommendations cache is absent, which is always (rec-3218). This plan repairs
    CLASSIFICATION-TIME labelling only -- it does not make CI block an edit, and must not be read as
    doing so.
  - >-
    12 open recommendations target the deleted prompt file; three sampled through the relevance gate
    returned stale_target. They are NOT bundled. They need an operator close-proposal batch under
    Decision 103, which is out of this plan's scope.
  - >-
    CI-RCA hard block was clear at planning time -- ci_rca_unresolved_recs was empty, so no deferral
    rationale is owed.
  - >-
    Roadmap headroom at planning time -- 9,218 lines against the 10,000-line ceiling
    (validate_platform_roadmap._ROADMAP_MAX_LINES), so a tier item with structured criteria fits
    comfortably. T4.18 is the next free id.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Confirm each new assertion is RED against the pre-edit tree before accepting it. An assertion on
    compute_automatable at effort S is green on both sides and must be rejected.
  - >-
    Read both instructions files in full before editing, so the deletion-only constraint is applied
    knowingly rather than by pattern-matching the frontmatter.
execution_steps:
  - >-
    In config/agent/executor/capabilities.yaml boundary_patterns AND in
    scripts/classify_automatable.py _BOUNDARY_PATTERNS, in the same commit: replace the
    develop-executor.prompt.md row with develop-executor, and add executor-rca and
    executor/capabilities.yaml. Change no other row. The two additions were chosen because their
    blast radius is measured at ZERO -- no recommendation in the cache targets either path -- so
    neither reclassifies existing work.
  - >-
    Author test_boundary_covers_live_supervisor_surface in tests/test_classify_automatable.py --
    for each of .claude/commands/develop-executor.md, .claude/skills/executor-rca/SKILL.md and
    config/agent/executor/capabilities.yaml, assert a boundary pattern matches it by substring AND
    that compute_automatable at effort XS is False.
  - >-
    Author test_boundary_lists_move_in_lockstep -- assert develop-executor.prompt.md is absent from
    both lists and develop-executor present in both. Do not assert full list parity.
  - >-
    Delete .github/prompts/develop-executor.prompt.md from the applyTo glob of both instructions
    files, and from the module-map row at executor-supervisor-rules.instructions.md line 28. Do not
    add any replacement path to either glob.
  - >-
    Add tier item T4.18 to docs/ROADMAP-PLATFORM.yaml -- the operator supervision surface as forward
    intent, status not_started, with structured exit criteria covering: the layer-2 substrate
    selection it waits on; the observability IAM prerequisite (PlatformDev holds no ecs, states or
    logs verbs today, and the LambdaLogGroupRead grant belongs to a different role); the
    rule-contradicting instruction bodies, whose cleaner disposition is deletion rather than repair
    since they describe a Windows-local agent-branch workflow superseded by Decision 76 and frozen by
    Decision 67; the SSOT-versus-duplicate list divergence, together with the deeper question of
    whether scripts/classify_automatable.py should read capabilities.yaml directly and dissolve
    Decision 117's reversal condition rather than servicing it a third time; the AGENTS.md boundary
    row and the 12 open automatable recs that must be re-derived before it can land; the boundary
    class question for .claude/skills/ and .claude/commands/; and the three surviving stale
    references in the docs/INTENT-* retiring set.
  - >-
    Write the TWO graduated rows into config/agent/verification_registry/registry.yaml, both with
    plan_slug executor-boundary-pattern-repair, plus graduated_at and graduated_by. Row one --
    check_id executor-boundary-covers-live-supervisor-surface, primitive_slot test_selector,
    guard_target config/agent/executor/capabilities.yaml, check_spec.node_id
