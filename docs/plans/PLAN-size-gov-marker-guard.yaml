bundled_recommendations:
  - rec-2974

infrastructure_dependencies: []

acceptance_criteria:
  - >-
    scripts/checks/_marker_guard.py exists, imports ROOT from scripts.checks._common (never
    recomputes it), and exports the exact Slice B binding surface: RegistrySpec,
    make_flat_extractor, make_section_extractor, default_base_reader, load_decision_bodies,
    authorization_failure, check_diff, check_present_markers.
  - >-
    A marker citing a Decision whose body nowhere names the governed entry key FAILS, in both the
    diff shape (check_diff) and the retroactive shape (check_present_markers).
  - >-
    The section-anchored extractor produced by make_section_extractor does NOT parse a class-table
    scalar (e.g. `limit: 500` under a `classes:` block) as a budget entry, while the flat extractor
    would -- proving Slice B can pass a `budgets:`-scoped extractor for
    config/structural_size_budgets.yaml without the sloc-style flattened regex mis-matching.
  - >-
    The section-anchored extractor does NOT lose entries after a column-0 COMMENT line inside its
    section (the defect rec-2954 finding 3 records in the incumbent _parse_raw_r3_markers).
  - >-
    Authorization is computed KEY-SIDE: the key's own >=2-segment ancestor prefixes are generated
    and substring-matched against the Decision body. The body is NEVER tokenized -- that is what
    makes markdown `**bold**` (which yields `**`, `**Date`, `**Decision`, ... on Decision 161's
    body) a non-issue rather than a universal wildcard.
  - >-
    A bare single-segment root mention (`scripts/`, `tests/`) does NOT authorize a file beneath it.
    Negative test: Decision 161 does not authorize an arbitrary `scripts/foo.py` entry. Positive
    band test: Decision 161 DOES authorize `scripts/checks/foo.py`, because its body contains
    `scripts/checks/`.
  - >-
    Composite R3 authorization works on a real `"<action-rel-dir>::<step-id>"` key via a specified
    mention_candidates function: the candidates are the full key and the action-relative directory,
    with the >=2-segment ancestor rule then applied to that directory.
  - >-
    load_decision_bodies is built on scripts/decisions_md.py's shared parser (a public name promoted
    from _iter_decision_sections in this PR) and scripts/checks/_marker_guard.py contains NO
    hand-rolled `## Decision` header regex -- Decision 134 clause 3 / DAF-03.
  - >-
    Decisions in docs/DECISIONS_ARCHIVE.md count as authorizing, matching the shared parser's own
    _DECISIONS_MD_PATHS convention, so archiving a cited Decision cannot retroactively red an
    unrelated PR.
  - >-
    Decision 149 compact-in-place coupling is closed: when a cited Decision's body carries the
    `**Superseded by: Decision N**` marker, Decision N's body is ALSO consulted for authorization
    (ONE hop). A compaction stub keeps its header and a one-line `**Decision:**` body, so without
    this hop a future compaction would silently un-authorize every live marker citing that number
    and -- because the scan is retroactive -- red every subsequent PR. The one-hop bound is
    deliberate, not a claim that chains are always length 1: a two-generation A->B(stub)->C chain is
    structurally reachable because Decision 149 evaluates direction-consistency per compaction event
    and never re-points inbound stubs. What holds instead is FAIL-LOUD -- the guards run
    unconditionally in `--pre`, so the compacting PR itself goes red, never a later innocent one.
  - >-
    Every marker line bearing a guard's own token, across all five registries, is
    authorization-clean against the real corpus. The install-state population is asserted as an
    UPPER BOUND (<= 3), not an equality, so a future legitimate marker addition does not red CI.
  - >-
    Coverage's 9 `# grandfathered dec-159` comments are NOT treated as markers -- the retroactive
    scan is scoped to lines bearing the guard's own token.
  - >-
    config/sloc_budgets.yaml's tests/test_checks_registry.py entry carries
    `raise-approved: dec-159` (rec-2974's acceptance command) with its budget value still 643.
  - >-
    A `# baseline-raised: dec-161 moved from <old-path>` marker passes ONLY when <old-path> is
    present in the base entry map and absent from the current one; it is skipped (not failed) by
    the retroactive scan, which has no base map. Enabled on the mypy spec alone.
  - >-
    Composite R1's no-marker-escape branch is preserved: no marker of any kind can admit an R1
    violation, and R1 never calls authorization_failure.
  - >-
    The day-one-empty retroactive-scan grandfather hook exists, is a frozenset, and is EMPTY at
    install -- pinned by its own verification step, since it is the entire bound on the Decision
    151 forward-conformance departure.
  - >-
    scripts/checks/_marker_guard.py measures ZERO mypy errors ATTRIBUTED TO ITSELF and is absent
    from config/mypy_baseline.yaml. (Whole-file `Success: no issues found` is unattainable and must
    not be asserted: mypy follows imports and scripts/checks/_common.py:147 carries a pre-existing
    baselined error.)
  - >-
    Every created or modified file is under 500 SLOC, and every config/sloc_budgets.yaml budget
    VALUE is unchanged between origin/main and HEAD (marker-comment text may change -- the rec-2974
    fix does exactly that).
  - >-
    validate_prose_limits passes with the S1 root_ambient_load_set entry ratcheted DOWN to the S1
    AGGREGATE post-edit size (CLAUDE.md + AGENTS.md, not AGENTS.md alone); the net byte delta on the
    S1 aggregate is <= 0.
  - >-
    docs/contracts/marker-grammar.yaml exists, is non-ritual (no top-level `contract:`/`class:`
    block), and is routed from docs/contracts/file-router.yaml.
  - >-
    The new Decision carries the commitment plus the FIVE amendments (128 cl.3, 159, 161 cl.4,
    162 R3, 149) and POINTS AT docs/contracts/marker-grammar.yaml; it does not restate the grammar
    mechanics.
  - >-
    config/agent/verification_registry/registry.yaml gains exactly one new row per step whose
    graduation disposition survives the real differential admission gate
    (scripts.verification_graduation.run_differential) as `graduate`, each with plan_slug
    `size-gov-marker-guard`. Measured 2026-08-04: 11 of the 12 candidate check_ids admitted --
    marker-guard-public-surface-complete, marker-guard-section-extractor-excludes-class-table,
    marker-guard-section-extractor-comment-immune, marker-guard-bare-root-not-authorizing,
    marker-guard-composite-key-authorization, marker-guard-live-markers-authorized,
    sloc-budget-marker-dec159-retarget, marker-guard-uses-shared-decisions-parser,
    marker-guard-supersession-hop, mypy-moved-from-same-diff-proof,
    marker-guard-grandfather-hook-empty. `composite-r1-no-marker-escape` (VP step 10) was
    REJECTED as tautological (its whole-file command passes identically on HEAD and a real
    origin/main worktree revert, since both trees carry an internally self-consistent
    test/source pair) and was flipped to `waive` on that step per the T3.21 protocol -- see that
    step's `graduation_waiver_reason`. R1's no-marker-escape property remains covered by
    ordinary (non-graduated) tests in tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py.
  - >-
    The five registered check names, scripts/checks/registry.py, scripts/validate.py and
    tests/test_checks_registry.py are all UNCHANGED.
  - >-
    The five guards' combined elapsed time stays at or below 250 ms (plan-time band: 49.6-82.3 ms).

verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Confirm the shared module exposes the exact eight-name binding surface Slice B will import,
      and that it takes ROOT from _common rather than recomputing it.
    command: >-
      bin/venv-python -c "import scripts.checks._marker_guard as m, pathlib;
      names=['RegistrySpec','make_flat_extractor','make_section_extractor','default_base_reader','load_decision_bodies','authorization_failure','check_diff','check_present_markers'];
      missing=[n for n in names if not hasattr(m,n)]; assert not missing, missing;
      src=pathlib.Path('scripts/checks/_marker_guard.py').read_text(encoding='utf-8');
      assert 'Path(__file__).parent.parent.parent' not in src, 'recomputes ROOT'; print('surface OK')"
    expected: "Prints `surface OK`; exit 0."
    fix_if: >-
      A name is missing or renamed -- add it under the contracted name (Slice B and
      docs/contracts/marker-grammar.yaml both bind to these exact spellings). If the ROOT assertion
      trips, import ROOT from scripts.checks._common;
      tests/test_checks_registry.py::TestNoLocalRootRecomputation enforces this repo-wide.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-guard-public-surface-complete
  - step: 2
    phase: pre-deploy
    action: >-
      Prove THE CRITICAL SEAM: a section-anchored extractor scoped to `budgets:` does not parse a
      class-table scalar as a budget entry, while the flat extractor does. This is what lets Slice B
      reuse the guard against config/structural_size_budgets.yaml (class table + flat budgets).
    command: >-
      bin/venv-python -m pytest tests/checks/test__marker_guard.py -q -k "class_table or section_scope"
    expected: >-
      All selected tests pass, including one asserting a limit: 500 scalar under a classes: block
      is absent from the section extractor's output and present in the flat extractor's output.
      (Literal not backticked: pytest -q's terse dot-report never echoes fixture source text, so a
      backtick-wrapped literal here would be structurally unsatisfiable for validate_vp_replay's
      substring-in-output rule -- see docs/contracts/marker-grammar.yaml for the actual mechanics.)
    fix_if: >-
      The section extractor leaks class-table scalars. Anchor on the top-level section key and end
      the section at the next column-0 NON-COMMENT line; do not reuse the flattened
      indentation-blind _BUDGET_LINE_RE scan.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-guard-section-extractor-excludes-class-table
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the section extractor survives a column-0 comment inside its section (rec-2954 finding
      3: the incumbent _parse_raw_r3_markers silently drops every marker after one).
    command: >-
      bin/venv-python -m pytest tests/checks/test__marker_guard.py -q -k "comment_immune"
    expected: "Entries declared AFTER a column-0 comment line inside the section are still returned."
    fix_if: >-
      The in-section flag clears on comments. Clear it only on a column-0 line that is neither blank
      nor a comment.
    hermetic: true
    graduation: graduate
    graduation_check_id: marker-guard-section-extractor-comment-immune
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the authorization rule is key-side: verbatim key or >=2-segment ancestor prefix
      substring-matched against the body. Includes the bare-root negative (dec-161 does not
      authorize `scripts/foo.py`), the band positive (dec-161 DOES authorize `scripts/checks/foo.py`
      via its real `scripts/checks/` mention), and the no-body-tokenization assertion.
    command: >-
      bin/venv-python -m pytest tests/checks/test__marker_guard.py -q -k "authorization or ancestor or bare_root or no_glob"
    expected: >-
      All pass, including: bare root scripts/ does not authorize scripts/foo.py; a body containing
      only **Date authorizes nothing; dec-161 does not authorize tests/test_checks_registry.py.
    fix_if: >-
      A bare root authorizes -- require >=2 segments on generated ancestor prefixes. If you find
      yourself extracting path-like tokens FROM the body, stop: that is the rejected design, and it
      is what makes `**` dangerous.
    hermetic: true
