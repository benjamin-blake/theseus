      tests/CLAUDE.md, and the implement / plan-critique / planning SKILL.md entries among them),
      and a wholesale reseed would silently pull all those out-of-scope entries into the diff.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Correct the now-stale SLOC-governance sentence "must carry an inline `# raise-approved:
      dec-NNN <reason>` marker naming a real `## Decision NNN:` header" -- after this change,
      naming a real header is necessary but no longer sufficient. HARD CONSTRAINT: net byte delta
      on the S1 aggregate must be <= 0 (measured headroom is 5 bytes: 33210 of budget 33215).
  - file: docs/contracts/composite-action-shape.yaml
    action: Modify
    purpose: >-
      Update rules.r3.escape, which currently says the marker must name "a real `## Decision N:`
