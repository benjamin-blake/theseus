schema_version: 3
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: size-gov-marker-guard
intent: >-
  Close audit finding SGE-07: all five raise-marker guards validate that a cited Decision EXISTS,
  not that it authorizes the edit. Consolidate the five copy-pasted guards onto one shared module
  with per-registry direction tokens and an injectable entry extractor, upgrade the check to a
  path-mention authorization assertion, and fix rec-2974 (the single unbacked live marker) at
  source. Restores the loud-and-Decision-cited property the ratchet family depends on (NS.4
  agent-first governance) and gives the not-yet-built structural-size engine (Slice B) a stable
  guard to bind to instead of minting copy number six.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-size-gov-marker-guard.yaml
phase: >-
  Platform governance-integrity. Slice A of the structural-size-governance-expansion overseer run,
  driving audit finding SGE-07 from audits/size-governance-expansion-3dee4a5.yaml (merged in #840)
  to completion. Audit-sourced, no tier_item id and no product-roadmap phase dependency. Slice B
  (the new structural-size class engine, SGE-01..SGE-06) consumes this slice's shared module.

scope:
  - file: scripts/checks/_marker_guard.py
    action: Create
    purpose: >-
      The single shared marker-guard module the five incumbent guards (and Slice B's future sixth
      consumer) bind to. Carries RegistrySpec, the two extractor factories, the base reader, the
      memoized Decision-body loader built on the SHARED parser, the authorization rule (including
      the Decision 149 supersession hop), and the two entry points check_diff /
      check_present_markers. Top-level placement per Decision 104 (_common.py is reserved for its
      five named primitives; a domain _shared.py may not span domains, and this module spans
      sloc/prose/misc/typing/ci_guards). MUST import ROOT from scripts.checks._common and never
      recompute it -- tests/test_checks_registry.py::TestNoLocalRootRecomputation dynamically
      enumerates every scripts/checks/**/*.py and forbids `Path(__file__).parent.parent.parent`.
      Must stay under 500 SLOC.
  - file: scripts/decisions_md.py
    action: Modify
    purpose: >-
      Promote `_iter_decision_sections` to a public name (retaining a private alias so existing
      internal callers keep working) so _marker_guard.py consumes the shared parser instead of
      hand-rolling a sixth header regex. ALSO promote `_extract_superseded_by` to a public name,
      for symmetry and because the Decision 149 supersession hop calls it from another module --
      reaching across a module boundary for a private symbol is the coupling this promotion exists
      to avoid. Without this scope row the plan would force the implementer to choose between
      violating "only files in the Scope table may be modified" and failing verification step 8.
  - file: tests/test_decisions_md.py
    action: Modify
    purpose: >-
      Cover the two newly-public names. Required by the test_coverage_checker rule that every
      modified source file carries a corresponding test file at its coverage threshold; 30,869
      bytes today, and the byte-reconstruction invariant it already asserts must keep passing.
      TIGHT HEADROOM: 478 SLOC against the 500 ceiling and UNREGISTERED, so only 22 lines are
      available. Keep the two new tests thin (an alias-identity assertion each); push any
      behavioural case into tests/checks/test__marker_guard.py per the decompose-never-raise
      constraint. Included in verification step 14's SLOC loop.
  - file: scripts/checks/sloc/validate_sloc_budget_raises.py
    action: Modify
    purpose: >-
      Bind to the shared module via a RegistrySpec (token raise-approved, gated direction up, flat
      extractor, every new entry gated). Delete the local _BUDGET_LINE_RE / _RAISE_MARKER_RE /
      _DECISION_HEADER_RE / _default_base_reader / _parse_budget_lines / _decision_header_exists
      copies. Registered check name and registry position unchanged. Docstring corrected: markers
      may still be dropped after merge, but a marker that IS present must stay authorization-backed.
  - file: scripts/checks/prose/prose_budget_raises.py
    action: Modify
    purpose: >-
      Same binding (token raise-approved, direction up, flat extractor, every new entry gated),
      preserving its distinct _RELIEF_VALVE_TEXT via RegistrySpec.relief_text and its
      never-name-decompose docstring rule (Decision 114/110 anti-fragmentation).
  - file: scripts/checks/misc/coverage_baseline.py
    action: Modify
    purpose: >-
      Bind validate_coverage_baseline_edits (token baseline-lowered, gated direction DOWN, float
      values, new-entry predicate `value < 100.0`). load_baseline / compare / measure_and_check /
      measure_per_file_coverage are untouched -- only the tamper-guard half moves.
  - file: scripts/checks/typing/mypy_baseline.py
    action: Modify
    purpose: >-
      Bind validate_mypy_baseline_edits (token baseline-raised, direction up, int values,
      new-entry predicate `value > 0`) with moved_from_relief enabled -- the ONLY spec that
      enables it, because Decision 161 clause 4 is the only Decision naming the form.
      validate_mypy_ratchet, _run_mypy, --seed and --update are untouched. Its
      _parse_error_counts stays and is REUSED by verification step 13's per-file mypy attribution.
  - file: scripts/checks/ci_guards/validate_composite_action_shell_bodies.py
    action: Modify
    purpose: >-
      Replace _parse_raw_r3_markers with make_section_extractor("r3") and _decision_header_exists
      with authorization_failure, for the R3 marker path ONLY, supplying a mention_candidates
      function for its `"<action-rel-dir>::<step-id>"` key form. R1's frozen _R1_KNOWN_VIOLATORS
      no-marker-escape branch and R2 stay entirely off the shared authorization path. Must remain
      subprocess-free (Decision 153): the shared module's base reader is never called from here.
  - file: docs/contracts/marker-grammar.yaml
    action: Create
    purpose: >-
      The OWNING contract for all marker-grammar field semantics, per
      docs/contracts/decision-entry.yaml significance.routing.field_semantics ("the meaning or
      constraints of a data field or config key -> a governance/semantics note in the OWNING
      contract; never a numbered Decision") and Decision 86/127 routing. Carries the three tokens
      and their per-registry directions; the authorization mechanics stated EXPLICITLY as key-side
      prefix generation plus substring containment against the Decision body (never body-side
      token extraction); the >=2-segment ancestor rule with its measured band width; the Decision
      149 compact-in-place interaction and the supersession hop; the composite mention_candidates
      rule; the moved-from same-diff proof and its mypy-only opt-in; the retroactive-scan
      token-scoping rule; the DECISIONS_ARCHIVE.md-counts-as-authorizing rule; the day-one-empty
      grandfather hook's shape; and Slice B's binding surface documented as a stable contract.
      Non-ritual (no top-level `contract:`/`class:` block) so validate_contract_drift skips it --
      same class as decision-entry.yaml / file-router.yaml / deploy-paths.yaml per Decision 118.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One new minimal numbered Decision (drafted as 164; re-check the max header at implement time
      per the numbering-race rule) carrying ONLY what a contract structurally cannot: the durable
      commitment that marker validation narrows from existence to authorization and that the scan
      is retroactive over present markers; the FIVE amendments (Decision 128 clause 3 explicitly,
      Decision 159, Decision 161 clause 4, Decision 162 R3, and Decision 149's compaction
      lifecycle); the retroactive-scope justification led by SGE-07's own acceptance clause and
      bounded by the day-one-empty hook; and a pointer to docs/contracts/marker-grammar.yaml as the
      owning contract. Mechanics go in the contract, NOT here.
  - file: docs/decisions-index.json
    action: Modify
    purpose: >-
      Regenerate via `bin/venv-python -m scripts.decisions_index --write` so
      validate_decisions_index_freshness stays green (required committed artifact; absence or drift
      is itself a failure).
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      Land one new row per `graduate`-disposition VP step (12 rows, check_ids listed in the
      acceptance criteria). validate_graduation_completeness's implement-PR leg fails any graduate
      step lacking a NEW-IN-DIFF row whose `check_id` AND `plan_slug` both match, so omitting this
      file would make the plan unable to discharge its own graduation obligation. Row shape:
      check_id / primitive_slot / guard_target / guard_symbol / plan_slug (= size-gov-marker-guard)
      / graduated_at / graduated_by / check_spec.
  - file: config/sloc_budgets.yaml
    action: Modify
    purpose: >-
      rec-2974 fix: retarget the tests/test_checks_registry.py entry's marker from `dec-161` to
      `dec-159`. Comment text only -- the budget value 643 is unchanged, so the diff is neither a
      new registration nor an increase and the raise gate is not tripped. Decision 159's body
      contains `tests/test_checks_registry.py` verbatim (verified), so the retargeted marker passes
      the new authorization rule; Decision 161's body does not contain that path, nor `tests/`, at
      all (verified), which is exactly why the retroactive scan catches the current state.
  - file: config/mypy_baseline.yaml
    action: Modify
    purpose: >-
      Remove the entries for the guards whose sole mypy error is the `base_entry[0]` narrowing
      defect being moved into the shared module (measured: coverage_baseline.py 1,
      prose_budget_raises.py 1, validate_sloc_budget_raises.py 1). Removals are always
      unrestricted. If any guard still measures >=1 error after the refactor, LEAVE its entry --
      an over-eager removal fails validate_mypy_ratchet, while a stale entry is only a non-blocking
      advisory. Do NOT touch the pre-existing scripts/checks/_common.py entry.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the S1 root_ambient_load_set entry DOWN to the S1 AGGREGATE post-edit measured size --
      that is CLAUDE.md (11 bytes) PLUS AGENTS.md, not AGENTS.md alone. Setting it to the AGENTS.md
      figure would leave the budget 11 bytes under the true aggregate and hard-fail
      validate_prose_limits.
      A decrease, always unrestricted (Decision 102) -- never a raise, and never a raise-approved
      marker on this entry. Edit ONLY the S1 line by hand: validate_prose_limits emits NINE
