constraints:
  - >-
    IMPLEMENTATION plan type only. STRATEGIC is frozen (Decision 67); the >5-files / >8-steps
    complexity heuristic is suspended during the freeze, so this lands as one larger IMPLEMENTATION
    plan rather than a decomposition into recommendations.
  - >-
    No new registered check name is minted. Enforcement rides the five ALREADY-registered checks, so
    scripts/checks/registry.py and scripts/validate.py need no edit -- which is also what keeps
    tests/test_checks_registry.py (643 SLOC against a 643 budget, ZERO headroom) untouched. Verified
    safe: the per-tier membership lists at tests/test_checks_registry.py:84-85,154 are frozenset
    FLOORS, and the module-enumerating tests are dynamic.
  - >-
    Decompose, never raise (Decision 128). Every created or modified file stays under 500 SLOC; if
    one would cross, move cases into tests/checks/test__marker_guard.py or split the module into a
    facade package (Decision 80/104/124). Do NOT add a config/sloc_budgets.yaml entry and do NOT run
    `--update-sloc-budgets` (it strips existing raise-approved markers).
  - >-
    Do NOT write a sixth DECISIONS.md parser. Build load_decision_bodies on
    scripts/decisions_md._iter_decision_sections, promoted to a public name in this PR (Decision 134
    clause 3 / DAF-03: a consumer hand-rolling its own header regex is exactly the divergence that
    contract exists to close). Writing one inside a slice whose purpose is de-duplicating
    copy-pasted guards would be self-defeating.
  - >-
    Authorization is KEY-SIDE ONLY: generate the key's ancestor prefixes and substring-match them
    against the Decision body. NEVER tokenize the body to extract path-like strings -- markdown
    emits `**`, `**Date`, `**Decision` as apparent tokens, and the corpus carries 178 distinct
    >=2-segment "path-like" prefixes that are actually decision-number lists (`80/104/`,
    `134/145/`). Key-side generation makes both classes structurally irrelevant.
  - >-
    Marker-grammar MECHANICS go in docs/contracts/marker-grammar.yaml, never in the Decision --
    docs/contracts/decision-entry.yaml significance.routing.field_semantics forbids field semantics
    in a numbered Decision. The Decision carries only the commitment, the five amendments, and a
    pointer. Keep it minimal: header headroom is 116 of 120.
  - >-
    The AMENDMENTS must be in the Decision, not the contract -- a contract cannot amend a Decision
    clause. Resting the retroactive scan on a contract alone would reproduce the exact SGE-07 defect
    (citing something that does not authorize the change) one level up, and hand Slice B an unbacked
    authority chain.
  - >-
    AGENTS.md edit must be net <= 0 bytes on the S1 aggregate (5 bytes of headroom). Ratchet
    config/prose_budgets.yaml DOWN afterwards by editing ONLY the S1 line; never raise it, never
    mark it, and never reseed the whole file (nine ratchet-down advisories are live at plan time and
    all but S1 are out of scope).
  - >-
    scripts/checks/_marker_guard.py must have ZERO mypy errors ATTRIBUTED TO ITSELF and must NEVER
    be added to config/mypy_baseline.yaml. Do not chase errors attributed to other files -- notably
    the pre-existing baselined scripts/checks/_common.py:147.
  - >-
    scripts/checks/_marker_guard.py must import ROOT from scripts.checks._common and never
    recompute it (tests/test_checks_registry.py::TestNoLocalRootRecomputation), and its
    default_base_reader must shell out via `_common.run` -- existing consumer tests patch
    `scripts.checks._common.run` / `.ROOT` and break silently if the shared reader bypasses them.
  - >-
    Never write `! grep -q ...` under `set -e` in a VP command: POSIX specifies that `set -e` is
    IGNORED for a command whose return value is inverted with `!`, so the assertion silently
    passes. Use an `if ...; then echo FAIL; exit 1; fi` block. (A `!` inside an explicit
    `A && ! B && C` chain is fine -- there the chain's own exit status carries the result.)
  - >-
    The composite guard must remain subprocess-free and filesystem-only (Decision 153 fast-tier
    budget) -- never call the git-based base reader from that path.
  - >-
    Composite R1 keeps its no-marker-escape property absolutely. Only R3 binds to the shared
    authorization rule.
  - >-
    Every `graduate` VP step needs a matching NEW row in
    config/agent/verification_registry/registry.yaml with the same check_id AND plan_slug, or
    validate_graduation_completeness's implement-PR leg fails. Twelve rows, listed in the acceptance
