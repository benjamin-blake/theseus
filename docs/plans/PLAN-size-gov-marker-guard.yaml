  - file: tests/checks/typing/test_mypy_baseline.py
    action: Modify
    purpose: >-
      DELETIONS/REPOINTS REQUIRED -- the heaviest of the five. `mypy_baseline._parse_entry_lines`
      at :38,42,46,50,54; `_decision_header_exists` at :59,62; `_default_base_reader` at :140,148.
      All attribute access (runtime AttributeError). ALSO: :37 and :306 are the repo's ONLY
