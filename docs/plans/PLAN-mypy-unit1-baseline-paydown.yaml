acceptance_criteria:
- 'Every scope module measures ZERO mypy errors under the locked mypy 2.3.0 with Unit 0''s five flags in pyproject; the whole-repo run reports EXACTLY 52 errors in 18 files (down from 87 in 40). Of those 18 files, 11 are the always-excluded areas (scripts/execute_recommendation.py 28, scripts/executor/** 6 across five files, src/** 7 across five files) and the other 7 are the error-bearing paths this plan deliberately leaves alone: the four modules the plan-time Decision 159 coverage census excluded -- scripts/checks/ops_governance/validate_recommendations_schema.py (2), scripts/ci_rca/filing.py (1), scripts/verification_checks.py (1) and scripts/session/preflight.py (4) -- plus the three scripts/checks/lambda_pkg/ modules (1 each), whose only fix was the callee widening inside the likewise-excluded scripts/lambda_manifest.py (itself error-free, which is why it is not one of the 18). These are exact numbers, not a ceiling: the census is resolved, the scope is frozen, and the whole-tree 52/18 was reproduced at revision time by applying the committed-scope diff in a scratch clone.'
- config/mypy_baseline.yaml, after `--update`, is strictly smaller than the base on BOTH axes (entries < 40 AND sum < 94) and lands on exactly 18 entries summing 52, with the tool reporting `3 lowered, 22 dropped` -- all three figures reproduced at revision time by running the real `--update` over the committed-scope diff. The file is regenerated by the tool, never hand-edited.
- validate_mypy_ratchet appends nothing (the one-liner prints []) AFTER the `--update`, and validate_mypy_baseline_edits appends nothing (no unauthorized raise, no new registration, no marker added inside the entries block).
- No file under src/**, no deploy-trigger file (src/data/handlers/**, scripts/aws_profile.py, scripts/llm/github_models_client.py, scripts/llm/client.py, scripts/llm/utils.py, scripts/run_scheduled_agent.py, scripts/s3_log_store.py, scripts/tool_runtime.py, config/lambda/data-pipeline/**, src/lambdas/ducklake_*/**, src/common/ducklake_*.py, config/lambda/ducklake/**), no file under scripts/executor/**, scripts/execute_recommendation.py, and no change to pyproject.toml appears in the diff.
- 'Every change is BEHAVIOUR-free, which is the claim that matters and is narrower than ''adds no runtime statement'': the diff adds no isinstance/assert guard, no coercion, no reordered branch and no new suppression. The only executable lines it adds are module-scope `from typing import cast` / `from src.common.ducklake_reader_client import DuckLakeReader` imports and `cast(...)` call expressions, and typing.cast returns its second argument unchanged -- which is also why a cast REFLOW can add a physically uncovered line (VP step 21''s fix_if) without adding behaviour. The `# type: ignore` population strictly DECREASES: on the committed scope exactly 1 is removed (scripts/preflight/aws_infra.py''s stale `# type: ignore[union-attr]`, replaced by a cast) and 0 are added -- the rehearsal''s other three deletions and its one re-site departed this unit with their modules (two on scripts/session/preflight.py, one plus the re-site on scripts/verification_checks.py, both census-excluded), which is why VP step 18 DERIVES both expectations from the plan''s own scope instead of pinning them. No test needed to change because no behaviour changed.'
- Every touched module's mirror suite is green, ruff check and ruff format --check pass over scripts/, every touched file stays <= 500 SLOC, config/sloc_budgets.yaml and config/coverage_baseline.yaml are byte-identical to origin/main, and every scope module measures at or above its coverage floor (100% when unbaselined, its entry otherwise) BOTH before and after the change -- both readings were taken at plan time over the committed scope and are re-confirmed by VP steps 2 and 21.
- 'Every added narrowing cast outside the `cast(DuckLakeReader, ...)` Reader seam carries a one-line comment, ADDED BY THIS DIFF, stating why the narrowing is provably true -- VP step 19 prints `missing= []`. No `# type: ignore` or `# noqa` pragma is offered as that explanation. A cast whose why cannot be stated is a STOP: the cast is not landed, the residual is reported to the operator, and removing that module from scope is a separate, human-directed plan amendment -- never an in-flight `scope` edit, which validate_scope_boundary reds in both tiers.'
- 'The fast tier''s elapsed wall-clock is recorded at VP step 22 and, on a breach of the 300s budget, the response is one of Decision 153''s three (move the check to the full tier, optimise it, open a planning session) or splitting this unit -- never `--ignore-budget` and never softening the assertion. This diff changes no root conftest.py, so full_suite_forced is False and the forced-run waiver cannot apply. Measured headroom on the 28-path SUPERSET diff at critique time: 285 modules / 5540 tests in 137s on 4 cores; the committed 24-path diff selects a subset of that, so 137s is an upper bound -- which is a reason to record the number, not to skip recording it.'
verification_plan:
- step: 1
  phase: pre-deploy
  action: RED baseline -- record the locked mypy version and the pre-change whole-repo and registry measurements on the unmodified branch, before any edit.
  command: bin/venv-python -m mypy --version && bin/venv-python -c "from scripts.checks.typing.mypy_baseline import _run_mypy, load_baseline; f=[]; m=_run_mypy(f); assert not f, f; b=load_baseline(); print('measured_errors=', sum(m.values()), 'measured_files=', len(m)); print('baseline_entries=', len(b), 'baseline_sum=', sum(b.values()))"
  expected: 'Prints `mypy 2.3.0 (compiled: yes)` then `measured_errors= 87 measured_files= 40` and `baseline_entries= 40 baseline_sum= 94` -- reproduced at planning time on a scratch clone of main.'
  fix_if: 'A version other than 2.3.0 means the venv drifted -- reinstall the locked pin (`bin/venv-python -m pip install "mypy==2.3.0"`) before measuring anything, because per-file counts are version-sensitive. A count other than 87/40 means the tree moved since the brief was written: re-derive the editable-file error list from the fresh output rather than implementing against the stale one.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A point-in-time measurement of the pre-change tree; it is false by construction the moment the first batch lands, so graduating it would install a permanently-red guard.
- step: 2
  phase: pre-deploy
  action: 'Coverage census CONFIRMATION (Decision 159 gate) -- re-measure per-file line coverage for every scope module on the UNMODIFIED tree and confirm the plan-time census still holds, BEFORE any edit. This step SELECTS NOTHING. The census was resolved at plan time and the five modules it excluded are simply absent from `scope`, because `scope` is a `prohibited_field_edits` entry in docs/contracts/implement-scope-boundary.yaml''s implementing_plan_bookkeeping row and validate_scope_boundary._check_prohibited_field_edits (scripts/checks/verification/validate_scope_boundary.py:96-128) diffs the working plan against its base copy in BOTH tiers -- so an implement-time scope edit reds VP step 22 AND VP step 23. validate_test_coverage is an ABSOLUTE per-file floor over changed files, not a delta: coverage_baseline.compare() defaults an unbaselined path to 100.0 and only 2 of the 22 scope modules carry an entry. The SHORT predicate CALLS coverage_baseline.compare rather than re-spelling it -- compare rounds to one decimal (scripts/checks/misc/coverage_baseline.py:57-61), so a hand-written `pct < thr` is strictly STRICTER than the registered check and would over-report a module measuring 99.95-99.99 that validate_test_coverage passes. The status vocabulary separates the two ways a measurement returns None, which the earlier draft conflated: `skip` (map_source_to_test resolves no mirror -- the Decision 124 carve-out, which check_per_file_coverage also skips) and `UNMEASURABLE` (a mirror EXISTS but no coverage data came back -- a killed or timed-out subprocess), which is a STOP, never a pass. One subprocess per file -- a shared process leaks coverage state between measurements and silently returns None (measured).'
  command: for f in $(bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/plans/PLAN-mypy-unit1-baseline-paydown.yaml', encoding='utf-8')); print(' '.join(r['file'] for r in d['scope'] if r['file'].endswith('.py')))"); do bin/venv-python -c "import sys, pathlib; from scripts.test_coverage_checker import get_changed_source_files, measure_per_file_coverage, map_source_to_test; from scripts.checks.misc import coverage_baseline; p=sys.argv[1]; fs=get_changed_source_files(files=[p]); t=map_source_to_test(pathlib.Path(p).resolve()); mapped=(t is not None and t.exists()); pct=measure_per_file_coverage([fs[0]]).get(str(fs[0].resolve())) if fs else None; thr=coverage_baseline.load_baseline().get(p, 100.0); status=(('UNMEASURABLE' if mapped else 'skip        ') if pct is None else ('SHORT       ' if not coverage_baseline.compare(pct, p) else 'ok          ')); print(status, p, 'measured=', pct if pct is None else round(pct, 1), 'floor=', thr)" "$f"; done
  expected: 'One line per scope module: 12 `ok`, 10 `skip`, and ZERO `SHORT` or `UNMEASURABLE`. Every figure below was measured at revision time on a pristine scratch clone of main (unmodified tree) AND re-measured with the committed-scope diff in tree; both readings agree, which is why VP step 21 is a confirmation rather than a discovery. ok: scripts/checks/_budget_recs.py 100.0 (floor 96.9); scripts/checks/_common.py 100.0; scripts/checks/sloc/sloc_limits.py 100.0; scripts/checks/verification/validate_graduation_completeness.py 100.0; scripts/ci_rca/designed_refusal.py 100.0; scripts/ci_rca/log_evidence.py 100.0; scripts/convergence_health/escalate.py 100.0; scripts/data_quality_execute.py 100.0; scripts/ops_data_portal.py 100.0; scripts/session/postflight.py 84.5 (floor 84.4); scripts/session/postflight_evidence.py 100.0; scripts/sync/ops.py 100.0. skip (map_source_to_test resolves no mirror, so check_per_file_coverage skips them too): scripts/ci/reconcile_target.py, the three scripts/ops_portal/** modules and the six scripts/preflight/** modules. THIS STEP''S OWN OUTPUT GOVERNS.'
  fix_if: 'Any `SHORT` or `UNMEASURABLE` line is a STOP, not a scope decision. Do NOT drop the module from `scope`, do NOT drop its test_obligations row, do NOT add or lower a config/coverage_baseline.yaml entry (that owes a `# baseline-lowered: dec-NNN` marker naming a Decision that AUTHORISES it -- Decision 165 -- and this ad_hoc_rec unit carries none), and do NOT write tests here to reach the floor (that is a separate plan with real test_obligations and a behaviour-change budget). All four of `scope`, `acceptance_criteria`, `verification_plan[].command` and `verification_plan[].expected` are prohibited implement-time edits, and the contract''s own disposition applies verbatim: STOP, and land the amendment as its own reviewed act, never as a unilateral in-flight edit. Report the divergence (module, measured, floor, and which of SHORT/UNMEASURABLE) to the operator and wait. An `UNMEASURABLE` line specifically means the mirror exists but produced no coverage data: re-run that one file alone before escalating, because coverage_baseline.measure_and_check''s 300s timeout path calls kill_process_tree, which SIGKILLs the whole process GROUP -- the caller included -- so a genuine timeout can look like an unexplained disappearance rather than a reported failure.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A point-in-time confirmation of the pre-change tree against a census already resolved at plan time; the standing enforcement is the registered full-tier check validate_test_coverage, which this step measures early rather than duplicates.
- step: 3
  phase: pre-deploy
  action: 'Batch 1 GREEN (the four in-scope scripts/checks/** modules) -- every scope module under scripts/checks/ measures zero. The target set is DERIVED from the plan''s own scope, never a static path prefix: a bare `p.startswith(''scripts/checks/'')` filter would also demand zero from the three scripts/checks/lambda_pkg/ modules, whose only fix was the callee widening in scripts/lambda_manifest.py -- a module the plan-time census excludes -- and would therefore red on the committed scope.'
  command: 'bin/venv-python -c "import yaml; from scripts.checks.typing.mypy_baseline import _run_mypy; d=yaml.safe_load(open(''docs/plans/PLAN-mypy-unit1-baseline-paydown.yaml'', encoding=''utf-8'')); scope={r[''file''] for r in d[''scope''] if r[''file''].endswith(''.py'')}; targets={p for p in scope if p.startswith(''scripts/checks/'')} | ({''scripts/checks/lambda_pkg/validate_lambda_bundle_completeness.py'', ''scripts/checks/lambda_pkg/validate_lambda_manifest_coverage.py'', ''scripts/checks/lambda_pkg/validate_lambda_manifests.py''} if ''scripts/lambda_manifest.py'' in scope else set()); f=[]; m=_run_mypy(f); assert not f, f; bad={p: c for p, c in m.items() if p in targets}; print(''batch1_targets='', len(targets), ''batch1_residual='', bad); assert not bad, bad"'
  expected: 'Prints `batch1_residual= {}` -- 8 errors cleared (_budget_recs 1, _common 1, sloc_limits 1, validate_graduation_completeness 5). `batch1_targets=` reads 4: the lambda_pkg trio is folded in only when scripts/lambda_manifest.py is a scope row, and it is not.'
  fix_if: 'A residual on validate_graduation_completeness means the PlanDocument alias re-point surfaced a previously-masked error (the `object` type was hiding it); fix it inside that file with the same type-only vocabulary -- never revert the alias to `object` and never add a suppression. A residual naming a scripts/checks/lambda_pkg/ module means the target set was widened by hand instead of derived: those three errors are out of scope for this unit and belong to whatever plan takes scripts/lambda_manifest.py up.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A measurement step, not a test -- it invokes mypy over the whole tree and asserts a per-batch slice of the result, which the registered full-tier check validate_mypy_ratchet already enforces continuously against the ratcheted baseline.
- step: 4
  phase: pre-deploy
  action: Batch 2 GREEN (the in-scope scripts/ci_rca/** modules plus scripts/ci/reconcile_target.py) -- 5 errors cleared. Target set DERIVED from scope, so scripts/ci_rca/filing.py -- excluded by the plan-time census -- is not demanded.
  command: 'bin/venv-python -c "import yaml; from scripts.checks.typing.mypy_baseline import _run_mypy; d=yaml.safe_load(open(''docs/plans/PLAN-mypy-unit1-baseline-paydown.yaml'', encoding=''utf-8'')); scope={r[''file''] for r in d[''scope''] if r[''file''].endswith(''.py'')}; targets={p for p in scope if p.startswith(''scripts/ci_rca/'') or p == ''scripts/ci/reconcile_target.py''}; f=[]; m=_run_mypy(f); assert not f, f; bad={p: c for p, c in m.items() if p in targets}; print(''batch2_targets='', len(targets), ''batch2_residual='', bad); assert not bad, bad"'
  expected: Prints `batch2_residual= {}` -- designed_refusal 1, log_evidence 3, reconcile_target 1. `batch2_targets=` reads 3; scripts/ci_rca/filing.py keeps its one baseline entry and is absent from the derived set.
  fix_if: 'A residual on designed_refusal usually means the cast wraps the wrong expression -- it must wrap the whole set comprehension, and the ruff 127-column limit is why the comprehension variable is shortened. Do not replace the cast with an isinstance filter: that changes which rows are collected and would need a failing-first test.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A measurement step, not a test -- the standing enforcement is validate_mypy_ratchet against the ratcheted baseline.
- step: 5
  phase: pre-deploy
  action: Batch 3 GREEN (scripts/preflight/**) -- 12 errors cleared across six modules. Target set DERIVED from scope for uniformity with the other batch steps.
  command: 'bin/venv-python -c "import yaml; from scripts.checks.typing.mypy_baseline import _run_mypy; d=yaml.safe_load(open(''docs/plans/PLAN-mypy-unit1-baseline-paydown.yaml'', encoding=''utf-8'')); scope={r[''file''] for r in d[''scope''] if r[''file''].endswith(''.py'')}; targets={p for p in scope if p.startswith(''scripts/preflight/'')}; f=[]; m=_run_mypy(f); assert not f, f; bad={p: c for p, c in m.items() if p in targets}; print(''batch3_targets='', len(targets), ''batch3_residual='', bad); assert not bad, bad"'
  expected: Prints `batch3_residual= {}` -- alerts 3, aws_infra 1, ci_rca_signals 2, context_docs 1, priority_queue 1, recs_cache 4. `batch3_targets=` reads 6.
  fix_if: 'A NameError-shaped `Name "DuckLakeReader" is not defined` residual means the module-scope import was omitted in that file (measured during rehearsal on context_docs.py). A residual on aws_infra means the stale `# type: ignore[union-attr]` was left in place alongside the cast.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A measurement step, not a test -- the standing enforcement is validate_mypy_ratchet against the ratcheted baseline.
- step: 6
