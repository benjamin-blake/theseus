- '`implementation_declared` is deliberately ABSENT from this document and MUST NOT be added at plan-authoring time. scripts/checks/verification/validate_scope_boundary.py:32-33 states the field "is set only at the commit-flow step", and the repo''s most recent implement commit (dc349d8, PR #1037) adds it as a one-line diff on the IMPLEMENT PR. Declaring it in the plan document consumes the edge trigger on the PLAN PR: _common.resolve_declared_plans resolves this plan against a tree that carries no implementation, so validate_vp_replay -- a pre=True PR gate -- fails every hermetic step (measured: 5 divergences), and on the real implement PR the flag is already true AT BASE, so the False->True edge never fires and validate_scope_boundary, validate_vp_replay and validate_graduation_completeness''s implement leg ALL DEFER -- silently disabling the Decision 59/181 guard that enforces this plan''s own Section 2 boundary. /implement flips it at commit-flow; that is also why VP step 17''s changed set carries this plan document as an extra path (24, not 23). Verified at revision time by flipping the flag on a scratch clone carrying the committed-scope diff: validate_scope_boundary reported all 24 touched paths in scope and validate_vp_replay ran the implement leg over all seven hermetic steps.'
- 'Derivation invariant, folded in across two critique rounds. (1) Every VP step whose target set or expectation depends on which modules are in scope now DERIVES it from the plan''s own `scope` inside the command -- all six batch steps 3-8, the whole-tree leak set at step 9, the changed-set membership at step 17 and the suppression ledger at step 18. A static path prefix would have been wrong in three places on the committed scope: `p.startswith(''scripts/checks/'')` sweeps in the three lambda_pkg modules, `p.startswith(''scripts/session/'')` sweeps in session/preflight.py, and step 8''s hard-coded target set named verification_checks.py. (2) A number the plan cannot control must never appear inside backticks in a hermetic step''s `expected`. Both rules apply to any future edit of this document -- which, during implementation, is limited to `implementation_declared`, the `verification_plan[].graduation*` fields and `closes_criteria`.'
- 'Deviation from the operator brief''s verbatim text, named rather than left silent: the brief says "ratcheting config/mypy_baseline.yaml down with `--update` after each batch"; this plan runs `--update` exactly once, at VP step 10, after the whole-tree measurement at step 9. `_update()` recomputes every entry from a fresh whole-tree measurement and applies min(new, old), so the end state is identical and the simplification is harmless. To be precise about the mechanism, since the draft''s shorthand was loose: a mid-batch `--update` could never RAISE an entry (the tool never raises), but it would LOWER a still-dirty scope module''s entry to its residual count instead of dropping it, leaving the file registered at a nonzero floor -- which is the failure step 9''s leak assertion exists to prevent, and the reason --update runs once and last.'
- 'Accepted coupling cost, recorded rather than redesigned: the 17 `cast(DuckLakeReader, ...)` sites bind scripts/ to the CONCRETE reader class rather than the engine-agnostic `Reader` Protocol that CD.8 frames as the swappable seam, so this PR triples the number of concrete-class couplings a future reader refactor must touch. The alternative (a scripts/-local narrower Protocol) was weighed and rejected on its merits -- a Protocol-returning wrapper would still need a cast at `make_reader()`''s own return, adds a call frame and a dec-131 mirror obligation, and the cast form is precedented at budget_ingest.py:391 and mcp_server.py:83 -- but the cost is real and belongs in the report, not buried.'
