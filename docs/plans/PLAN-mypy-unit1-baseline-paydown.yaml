constraints:
- 'Type-only changes ONLY. Every fix must be a typing.cast, a bare annotation, a local rename or a TYPE_CHECKING alias re-point -- constructs that emit no new runtime behaviour. (The callee parameter-widening form is NOT exercised by the committed scope: it belonged to scripts/lambda_manifest.py, which the plan-time coverage census excludes.) Any fix that would change what the code DOES (an isinstance guard, an assert, a str() coercion, a reordered branch) is out of bounds here: it needs a failing-first test, and absent that the site is reported to the operator rather than fixed inline or dropped from scope. No behaviour changes, therefore no test_obligations.'
- 'No file under src/** and no deploy-trigger file may be touched (brief Section 2 rule): src/data/handlers/**, scripts/aws_profile.py, scripts/llm/github_models_client.py, scripts/llm/client.py, scripts/llm/utils.py, scripts/run_scheduled_agent.py, scripts/s3_log_store.py, scripts/tool_runtime.py, config/lambda/data-pipeline/**, src/lambdas/ducklake_*/**, src/common/ducklake_*.py, config/lambda/ducklake/**. scripts/executor/** and scripts/execute_recommendation.py are likewise never edited.'
- The Reader seam is resolved ONLY from scripts/. src/common/ducklake_reader_client.py is both an src/** file and a deploy-trigger file, and its Reader Protocol deliberately omits named()/query()/describe() (documented in its own docstring) -- widening it is forbidden twice over. The sanctioned resolution is the call-site `cast(DuckLakeReader, ...)`, exactly as scripts/convergence_health/budget_ingest.py:391 and scripts/agent_sdk/mcp_server.py:83 already do, with the concrete class IMPORTED (never modified).
- config/mypy_baseline.yaml is only ever rewritten by `bin/venv-python -m scripts.checks.typing.mypy_baseline --update`. Never hand-edit it, never raise an entry, never register a new file, and never add a `# baseline-raised:` marker (Decision 161 clause 4 / Decision 165).
- 'Do NOT weaken any check, test or assertion to obtain green (Decision 181, docs/contracts/implement-scope-boundary.yaml CONTENT invariant). Suppressions may be DELETED or re-sited by a line wrap, never added; a `# type: ignore` is not an acceptable substitute for a narrowing.'
- 'Do NOT edit a test to accommodate a rename. Every rename in this plan is function-local by construction; if a mirror test fails on one, the rename crossed a seam it should not have -- revert that rename and narrow the fix instead (Decision 131: mirrors are the coverage surface, not a place to absorb source churn).'
- pyproject.toml is Unit 0's surface and is NOT touched here. This unit assumes Unit 0's five zero-delta flags (warn_redundant_casts, no_implicit_optional, strict_equality, warn_no_return, check_untyped_defs) are already merged; all measurements in this plan were taken with mypy 2.3.0 and are unaffected by them (measured zero delta on 2026-09-02 and again on 2026-09-03).
- Do NOT raise a SLOC budget or add a coverage_baseline entry (Decision 128, Decision 159); every touched file must stay under 500 SLOC by wrapping less, not by registering more.
- Verification is the FULL-tier check validate_mypy_ratchet. `bin/venv-python -m scripts.validate --pre` does not run it and proves nothing about this unit -- steps 10-12 are the load-bearing proof, and step 23 is the single full-tier run.
- 'Mypy version discipline (Decision 148 spirit -- a measurement is only comparable to its own toolchain): every count in this plan was taken with the requirements.lock pin mypy==2.3.0, installed over the venv''s previous 2.3.1. Do not re-measure with any other version, and do not restore 2.3.1 until after Task 5''s LAST merge (the restore is a Task-5-wide closure action, not this unit''s).'
- 'Every narrowing cast OUTSIDE the Reader seam owes a why-comment that this diff ADDS, on one of the six non-blank lines above the statement and in practice the line immediately above it, in the precedent form (scripts/convergence_health/budget_ingest.py:391, scripts/agent_sdk/mcp_server.py:83). A pre-existing comment inside the window does NOT satisfy it -- that hole was measured on the rehearsal diff and VP step 19 now closes it. A cast whose why cannot be stated is a SUPPRESSION, not a paydown: do not land it, report the site to the operator, and leave the module''s removal from scope to a human-directed plan amendment (Decision 161 spirit; the ratchet''s floor is permanent because decreases are unrestricted). `# type: ignore` and `# noqa` never count as the explanation.'
- 'The Decision 159 coverage census is RESOLVED AT PLAN TIME and is never re-opened during implementation. A module measured below its absolute per-file floor, or that cannot be measured inside the registered check''s own 300s budget, is simply ABSENT from `scope` here; its mypy errors stay in config/mypy_baseline.yaml (a RETAINED entry is not a raise -- Decision 161 clause 4 restricts only raises and new registrations). At implement time the only sanctioned response to an unexpected SHORT or UNMEASURABLE line is to STOP and report it: never edit `scope`, never add or lower a config/coverage_baseline.yaml entry (a registration owes a `# baseline-lowered: dec-NNN` marker naming a Decision that AUTHORISES it -- Decision 165 -- and this ad_hoc_rec unit has none), and never write tests here to reach the floor (that is a separate plan carrying real test_obligations).'
- Never soften or bypass the fast-tier budget assertion (Decision 153). A non-forced breach of the 300s budget hard-exits 1 and auto-files a budget-breach rec; `--ignore-budget` is not this plan's to use. This diff touches no root conftest.py, so full_suite_forced is False and the forced-run waiver cannot apply.
- 'Never pin a drift-movable number inside backticks in a HERMETIC VP step''s `expected`. validate_vp_replay._extract_literals requires every backticked substring verbatim in the replayed output (scripts/checks/verification/validate_vp_replay.py:73,95-96,132), so a pinned landing number, changed-file count or cast count fails the replay on any ordinary movement in the three excluded areas (scripts/execute_recommendation.py, scripts/executor/**, src/**). Derive it in the command from the plan''s own scope, or state it as unpinned prose. This rule survives the census resolution: the census no longer moves these numbers, but main-branch drift still can.'
- Never set `implementation_declared` in this document at plan-authoring time. It is flipped to true only at the commit-flow step of /implement (validate_scope_boundary.py:32-33); setting it early consumes the False->True edge on the plan PR and leaves validate_scope_boundary, validate_vp_replay and validate_graduation_completeness's implement leg DEFERRING on the PR that actually carries the code.
- 'Never edit this plan document''s own `scope`, `acceptance_criteria`, `verification_plan[].command` or `verification_plan[].expected` during implementation. All four are `prohibited_field_edits` on the implementing_plan_bookkeeping sanction row of docs/contracts/implement-scope-boundary.yaml, and validate_scope_boundary._check_prohibited_field_edits (scripts/checks/verification/validate_scope_boundary.py:96-128) diffs the working document against its base copy in BOTH presubmit tiers -- so any such edit reds VP step 22 AND VP step 23. The contract''s own disposition governs verbatim: STOP, and land the amendment as its own reviewed act, never as a unilateral in-flight append. The ONLY permitted edits to this document are `implementation_declared`, the three `verification_plan[].graduation*` fields and `closes_criteria`.'
