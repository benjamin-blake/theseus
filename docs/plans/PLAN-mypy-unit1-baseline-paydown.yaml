schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: mypy-unit1-baseline-paydown
intent: 'Pay down every mypy baseline entry that lives in an editable file whose mirror coverage clears the Decision 159 floor: fix the 35 measured type errors across the 22 in-scope scripts/ modules with type-only changes that alter no runtime behaviour (call-site typing.cast, local renames that end a type-conflicting rebind, one bare annotation, one TYPE_CHECKING alias re-point), then ratchet config/mypy_baseline.yaml down with `bin/venv-python -m scripts.checks.typing.mypy_baseline --update` so the Decision 161 registry shrinks from 40 entries / 94 errors to exactly 18 entries / 52 errors, with no file under src/** and no deploy-trigger file touched. The Decision 159 coverage census that SELECTS this scope was resolved AT PLAN TIME -- five candidate modules measured short of their absolute floor or could not be measured at all, and are simply absent from `scope` here -- because `scope` is a prohibited implement-time plan-field edit (docs/contracts/implement-scope-boundary.yaml, implementing_plan_bookkeeping row). Nothing about this unit''s membership is decided at implement time.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-mypy-unit1-baseline-paydown.yaml
phase: Mypy strictness paydown (Decision 161 registry drawdown, Task 5 Unit 1). No tier_item slice, closes no criterion; soft-warn exception category ad_hoc_rec (autonomous-day brief 2026-09-02, Task 5 Unit 1; no rec named, so bundled_recommendations is empty by the brief's own rule).
scope:
- file: scripts/checks/_budget_recs.py
  action: Modify
  purpose: 'Reader seam (1 error, L127): extend the deferred import to `DuckLakeReader, make_reader` and wrap the factory in `cast(DuckLakeReader, ...)` before `.named("open_recs")`, plus `cast` on the typing import. cast is a runtime no-op, so the deferred-import property and every existing patch target are unchanged. Precedent: scripts/convergence_health/budget_ingest.py:391 and scripts/agent_sdk/mcp_server.py:83 already spell this narrowing exactly this way.'
- file: scripts/checks/_common.py
  action: Modify
  purpose: 'Optional rebind (1 error, L160): `base_ref` is first bound to a narrowed `str` and then re-bound to `str | None` in the else arm. Add the bare declaration `base_ref: str | None` immediately after `push_base = push_context_base(root)`. A bare annotation emits no bytecode, so the function is byte-identical at runtime.'
- file: scripts/checks/sloc/sloc_limits.py
  action: Modify
  purpose: 'int/Optional rebind (1 error, L44): `sloc` is bound to `int` in the measurement loop and re-bound to `int | None` from `current_sloc.get(rel)` at L43. Rename that second binding and its THREE uses (`sloc is None` and `sloc <= _SLOC_LIMIT` on L44, `min(sloc, budget)` on L47) to `measured`. Pure local rename -- counted exactly here because the scope row is the line an implementer reads first.'
- file: scripts/checks/verification/validate_graduation_completeness.py
  action: Modify
  purpose: '`object`-typed plan loader (5 errors, L110/115/199/206/212): `LoadPlanFn = Callable[[str, Path], object]` makes every `doc.verification_plan` / `doc.slug` an attribute on `object`. Re-point the alias to the real return type -- `from typing import TYPE_CHECKING, Callable`, a `if TYPE_CHECKING: from scripts.roadmap.plan_document import PlanDocument` block, and `LoadPlanFn = Callable[[str, Path], "PlanDocument"]`. TYPE_CHECKING is False at runtime, so no import is added to the check''s hot path and the deferred pydantic import inside _common.load_plan stays deferred.'
- file: scripts/ci/reconcile_target.py
  action: Modify
  purpose: 'Reader seam (1 error, L129): same deferred-import extension plus `cast(DuckLakeReader, make_reader(profile=profile))` inside `_call`, and `cast` added to the existing `from typing import Any, Callable, Optional` line.'
- file: scripts/ci_rca/designed_refusal.py
  action: Modify
  purpose: 'set comprehension element type (1 error, L53-57): `{job.get("name") ...}` is `set[Any | None]` against a declared `set[str]`. Wrap the existing comprehension in `cast("set[str]", ...)` across three lines (comprehension variable shortened to `j` purely to stay inside the 127-column ruff limit); the membership predicate is unchanged, so a falsy or non-str name is filtered exactly as before.'
- file: scripts/ci_rca/log_evidence.py
  action: Modify
  purpose: '`Any | None` passed to concrete parameters (3 errors, L333-334): `_validate_limits` / `_validate_jobs` have already raised on any non-dict/non-list by the time these calls run, but that is a runtime invariant mypy cannot see. Wrap the three arguments in `cast("dict[str, Any]", ...)` / `cast("list[dict[str, Any]]", ...)` and reflow the `_validate_scope` call to one argument per line; add `cast` to the existing `from typing import Any` line.'
- file: scripts/convergence_health/escalate.py
  action: Modify
  purpose: 'Reader seam (1 error, L66): deferred import extended to `DuckLakeReader, make_reader`, factory wrapped in `cast(...)`, `cast` added to the existing typing import.'
- file: scripts/data_quality_execute.py
  action: Modify
  purpose: 'no-redef (1 error, L155): the dry-run early-return block binds `results`, so the later `results: list[CheckResult] = []` is a re-annotation. Rename the dry-run local (two uses, both inside the block that returns) to `skipped`, keeping the explicit annotation at the real accumulation site. Pure local rename.'
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: 'Reader seam (1 error, L415): deferred import extended, `cast(DuckLakeReader, make_reader(profile=profile))` before `.named("rec_by_id", ...)`, `cast` added to the existing `from typing import Optional` line.'
- file: scripts/ops_portal/cli.py
  action: Modify
  purpose: 'assignment rebind (1 error, L283): `rec_id` is bound to the `str` returned by `file_rec` earlier in the same function, then re-bound to the `str | None` of `find_open_ci_rca_rec_by_fingerprint`. Rename the second binding and its two uses to `found_rec_id`. Pure local rename; the printed value is unchanged.'
- file: scripts/ops_portal/decisions.py
  action: Modify
  purpose: 'Reader seam (1 error, L261): extend ONLY the deferred import inside `_fetch_decision_from_reader` (the sibling deferred import in the backfill path uses `current_state`, which the Reader Protocol declares, and must stay as-is or ruff F401 fires), wrap the factory in `cast(...)`, add `cast` to the existing typing import.'
- file: scripts/ops_portal/maintenance_ops.py
  action: Modify
  purpose: 'Reader seam (1 error, L198): this module has THREE deferred `make_reader` imports; extend only the one in the purge path that calls `.named("recs_by_title_prefix", ...)`. Extending the other two lands an unused-import F401 (measured). Add `cast` to the existing typing import.'
- file: scripts/preflight/alerts.py
  action: Modify
  purpose: 'Reader seam (3 errors, L43/87/134): add `from typing import cast` and a module-scope `from src.common.ducklake_reader_client import DuckLakeReader` (scripts/preflight/_common.py already imports that module at module scope, so no new import cost), then wrap each `_common._make_reader()` in `cast(DuckLakeReader, ...)`. The `_common._make_reader` patch target used by tests/session/preflight/ is untouched.'
- file: scripts/preflight/aws_infra.py
  action: Modify
  purpose: 'Reader seam, private method (1 error, L77): `_reader_url()` is a DuckLakeReader method the Reader Protocol does not declare, and the standing `# type: ignore[union-attr]` names the wrong code. Replace the whole line with `url = cast(DuckLakeReader, _common._make_reader())._reader_url()` and DELETE the ignore -- a suppression removed, not relocated.'
- file: scripts/preflight/ci_rca_signals.py
  action: Modify
  purpose: 'Reader seam (2 errors, L137/189): same cast + DuckLakeReader module-scope import treatment on the `ci_rca_open` and `ci_rca_since` reader calls.'
- file: scripts/preflight/context_docs.py
  action: Modify
  purpose: 'Reader seam (1 error, L84): add the DuckLakeReader import, extend the existing `from typing import Any` to `Any, cast`, wrap the `open_recs` reader call.'
- file: scripts/preflight/priority_queue.py
  action: Modify
  purpose: 'Reader seam (1 error, L115): same treatment on the `priority_queue_current` call; the Decision 70 verb semantics comment above it is untouched.'
- file: scripts/preflight/recs_cache.py
  action: Modify
  purpose: 'Two Reader seams (L109/210) plus an Optional-filter rebind (L34 type-var, L39 union-attr): the `stamps` list is re-bound by its own None-filtering comprehension, so mypy keeps `list[datetime | None]` and both `max(...)` and `.isoformat()` fail. Rename the pre-filter binding to `raw_stamps` -- one rename fixes both errors. Pure local rename plus two casts.'
- file: scripts/session/postflight.py
  action: Modify
  purpose: 'no-redef (1 error, L168): the on-main early-return block binds `output` as `dict[str, str]`, so the later `output: dict = {...}` is a re-annotation. Rename the early-return local and its `json.dumps` use to `fail_output`. Pure local rename.'
- file: scripts/session/postflight_evidence.py
  action: Modify
  purpose: 'iteration over `object` (1 error, L52): `evidence: dict[str, object]` makes `evidence[category]` non-iterable to mypy even though `validate(evidence)` has already proved every category is a list of strings. Bind `entries = cast(list[str], evidence[category])` and add `from typing import cast`.'
- file: scripts/sync/ops.py
  action: Modify
  purpose: 'Reader seam (1 error, L68) plus a Path / Optional[str] operand (1 error, L324): bind `reader = cast(DuckLakeReader, make_reader(table=table))` (DuckLakeReader also carries `current_state`, so the non-verb branch is unaffected), and write `_LOGS_DIR / cast("str", local_rel)` -- the guard four lines above already returns 0 when both `path` and `local_rel` are falsy, so the cast asserts nothing the code does not already enforce. Add `from typing import cast`.'
- file: config/mypy_baseline.yaml
  action: Modify
  purpose: 'Rewritten in full by `bin/venv-python -m scripts.checks.typing.mypy_baseline --update` after the code edits land -- never hand-edited. Measured outcome of the COMMITTED 22-module scope, verified end to end at revision time in a scratch clone carrying exactly this scope''s diff: 3 lowered (scripts/executor/postflight_gates.py 5 -> 1 and src/common/config.py 3 -> 1, incidental ratchet-downs of stale entries on files this plan does not touch, plus scripts/session/preflight.py 5 -> 4, the same stale-entry correction on a module the plan-time coverage census excludes) and 22 dropped, leaving 18 entries summing 52. No entry rises, no entry is registered, and no `# baseline-raised:` marker is added.'
bundled_recommendations: []
