schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: vp-replay-rg-portability-guard
intent: >-
  Close the ripgrep-portability class in validate_vp_replay with a real every-PR lint rather than
  prose, and in the same act land the two-act amendment that unstrands PR #1206 -- so the
  production gc_ops destructive-GC cadence can start behind its committed baseline gate.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-replay-rg-portability-guard.yaml
phase: T2.18
scope:
- file: scripts/checks/verification/validate_vp_replay.py
  action: Modify
  purpose: >-
    TWO changes. (a) Add `_rg_portability_findings`, a static, non-executing lint over every
    pre-deploy step of every diff-present plan that is ADDED or RESOLVED -- precisely the two
    populations whose steps actually execute (red-before replays an added plan's graduate steps;
    the implement leg replays a resolved plan's hermetic steps), and deliberately NOT merely-
    modified plans, so a PR touching an old plan for unrelated reasons never reds on a pre-existing
    step. Detection is PROGRAM-POSITION, not substring: split the command on shell operators, then
    `shlex.split` each segment and flag only a segment whose argv HEAD is `rg` (after stripping a
    leading `!`, `env`, or a directory prefix). A text-level `rg ` match would flag any command that
    merely discusses ripgrep inside a Python string literal -- a false positive this plan's own VP
    step 3 would have triggered. Fails OPEN on an unparseable segment (`shlex` ValueError), matching
    `_negated_sweep_findings`' own over-detection-is-worse posture. (b) Relocate the classifier and
    its self-test OUT to the new sibling module so this file stays under budget -- see that row.
- file: scripts/checks/verification/_vp_replay_classify.py
  action: Create
  purpose: >-
    SLOC decomposition (Decision 128 -- decompose by default, never raise). This file measures 481
    SLOC against the unregistered-file limit of 500, and the new lint adds ~35, so the change
    crosses the budget and MUST decompose. Relocated VERBATIM: OUTCOME_CLASSES, the four
    unmeasurable-arm constants (_UNMEASURABLE_EXIT_CODES, _RG_GREP_ERROR_EXIT_CODE,
    _RG_GREP_INVOCATION_RE, _PYTEST_COLLECTION_ERROR_EXIT_CODES),
    _CREDENTIAL_UNAVAILABLE_MESSAGE_RE, _SELF_TEST_TIMEOUT_SECONDS, _SELF_TEST_FIXTURES,
    _classify_outcome, _run_self_test_fixture, _run_classifier_self_test. Measured: ~82 SLOC moves,
    leaving the parent at ~413 + ~35 = ~448, under 500 with headroom. `_classify_outcome` and its
    ONLY in-module caller `_run_classifier_self_test` relocate TOGETHER, which is what keeps the
    three existing `patch(..._classify_outcome)` sites working once retargeted at this module --
    patching a re-export never rebinds the callee's own global. validate_vp_replay.py re-imports
    the moved names so every external `from ...validate_vp_replay import _classify_outcome` keeps
    resolving unchanged.
    DECIDED WITH NOTICE -- sibling private module, NOT a facade package. Decision 128 names the
    Decision 80/104/124 facade-package pattern, and this deviates from it deliberately: 17
    graduated registry shards carry `guard_target: scripts/checks/verification/validate_vp_replay.py`
    and four more EXECUTE that literal path inside their check_spec commands, so converting the
    module to a package would retire a live path out from under 21 standing records and turn a
    focused change into a ~29-file repoint. The `scripts/checks/_*.py` sibling-helper idiom
    (_common, _manifest, _terraform, _schema, _scaffolding, _pytest_diff, _marker_guard) is the
    established local precedent and keeps the module path -- and therefore all 21 records -- valid.
    Reversible: promoting this pair to a facade package later is mechanical.
- file: tests/checks/verification/test__vp_replay_classify.py
  action: Create
  purpose: >-
    Mirror test for the new module -- `test_coverage_checker.map_source_to_test` maps
    `scripts/checks/verification/_vp_replay_classify.py` to exactly this path (verified against the
    sibling `_manifest.py` -> `test__manifest.py` precedent), so without it the mirror floor fails.
    Asserts the relocation preserved behaviour: every OUTCOME_CLASSES member is reachable, each of
    the five unmeasurable arms classifies as `unmeasurable` (exit 126, exit 127, rg/grep exit 2, a
    credential-unavailable message, and the timeout arm), a pytest collection error classifies
    `target_absent`, exit 0 classifies `tautological`, and an ordinary exit 1 classifies
    `assertion_failed`.
- file: tests/checks/verification/validate_vp_replay/test_accounting_and_self_test.py
  action: Modify
  purpose: >-
    Retarget the THREE `patch("scripts.checks.verification.validate_vp_replay._classify_outcome")`
    sites (:140, :153, :168) at `scripts.checks.verification._vp_replay_classify._classify_outcome`.
    This is the ONE genuinely subtle edit in the decomposition: `_run_classifier_self_test` moves
    with the function it calls, so a patch left pointing at the old module would rebind a re-export
    the callee never reads -- the mock would silently not take and these three tests would assert
    nothing. The other seven patch sites (subprocess.run, PER_STEP_TIMEOUT_SECONDS,
    MAX_REPLAYED_STEPS, MAX_AGGREGATE_SECONDS) are NOT retargeted: their readers (_replay_step,
    _ReplayBudget) stay in validate_vp_replay.py and read that module's own globals, so the existing
    targets remain correct. Do not touch them.
- file: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
  action: Modify
  purpose: >-
    Red-before coverage for the new lint, alongside the existing negated-sweep lint tests. Must
    assert BOTH polarities and the false-positive floor: a step whose command invokes rg in program
    position is flagged; a step whose command merely CONTAINS the text `rg` inside a quoted string
    is NOT flagged (the exact false positive that would otherwise fire on a plan discussing
    ripgrep); a merely-modified plan is not linted; and an unparseable segment fails open.
- file: docs/contracts/vp-red-before.yaml
  action: Modify
  purpose: >-
    Declare the new lint beside `negated_sweep_lint` -- its population (added-or-resolved plans),
    its program-position detection rule, its fail-open posture, and its relationship to the
    `unmeasurable` outcome class it exists to pre-empt. The contract is the single authoritative
    home for this check's semantics; the module holds no second copy of that prose. Append an
    amendment_log entry at the list tail if that file carries one.
- file: config/agent/verification_registry/entries/vp-replay-coverage-survives-absent-ripgrep.yaml
  action: Modify
  purpose: >-
    Repoint the ONLY standing record the relocation actually breaks. Its check_spec resolves the
    exit-2 arm by scanning `scripts/checks/verification/validate_vp_replay.py` for the literal
    `_RG_GREP_ERROR_EXIT_CODE and` and asserts that line is covered with ripgrep absent -- that
    line moves to _vp_replay_classify.py, so both the source path and the `--cov` target must
    follow it. Claim-PRESERVING re-authoring, so the check_id is RETAINED (the retained-id
    precedent is scoped to exactly this case); a new id would be registry sediment for a
    relocation. The other three path-executing shards
    (push-aware-diff-base-in-verification-checks, no-commit-subject-plan-resolution,
    vp-replay-mirror-and-shards-live) and all 17 `guard_target` references keep resolving, because
    the module path is unchanged -- that is the whole point of the sibling-module choice.
- file: docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml
  action: Modify
  purpose: >-
    The unblock, and act one of implement-scope-boundary.yaml's two-act amendment_procedure
    (precedent: #1205 amended this same plan's step 8). ONE step, THREE fields. Step 3's `command`
    substitutes POSIX grep for rg in CANONICAL ARGUMENT ORDER -- `grep -n -A 10 PATTERN PATH`, never
    `grep -n PATTERN -A 10 PATH`. The order is load-bearing, not style: under POSIXLY_CORRECT=1 GNU
    grep stops permuting and reads `-A` and `10` as filenames; it exits 2 but STILL PRINTS its
    matching lines -- with the -A context window silently dropped. The `state = "DISABLED"` literal
    sits on a CONTEXT line, so it vanishes from the window, the inner `grep -q` finds nothing and
    exits 1, and `!` flips that to 0. The exit 2 never propagates through the pipe; the LOST CONTEXT
    WINDOW is the mechanism, and the gate inverts on a still-disabled rule. `action` and `fix_if`
    record the substitution, the measured four-cell parity evidence, this exact mechanism, and why
    Decision 189's absent-path negation NOTE is already closed here (the leading
    `grep -q 'gc_ops' PATH &&` conjunct exits 2 and short-circuits, so the negated tail is never
    reached on a missing path -- measured). `scope`, `acceptance_criteria` and every
    `verification_plan[].expected` stay byte-identical, and step 3 stays `hermetic: true` -- it
    genuinely is creds-free and side-effect-free, and relabelling it to dodge replay is the
    weaken-to-get-green move Decision 181 bans.
bundled_recommendations: []
followon_recs:
- rec-3920
infrastructure_dependencies: []
acceptance_criteria:
- >-
  A plan added or resolved in a diff whose pre-deploy VP step invokes rg in program position is
  flagged by validate_vp_replay in both the --pre and full tiers, with the plan name and step id
  named in the finding.
- >-
  A pre-deploy VP command that merely contains the characters `rg` inside a quoted string, or in a
  path segment, is NOT flagged -- the lint discriminates program position, not text.
- >-
  scripts/checks/verification/validate_vp_replay.py measures under 500 SLOC after the change, with
  no entry added to config/sloc_budgets.yaml and no budget-raise marker anywhere in the diff.
- >-
  Every name relocated to _vp_replay_classify.py still resolves under its original
  `scripts.checks.verification.validate_vp_replay` import path, and the full classifier vocabulary
  (all four outcome classes and all five unmeasurable arms) is asserted by the new mirror test.
- >-
  The three retargeted `_classify_outcome` patch sites genuinely take effect -- each of the three
  self-test mislabel tests still fails when the classifier is broken.
- >-
  vp-replay-coverage-survives-absent-ripgrep is admitted by the real differential after repointing,
  and the other three path-executing shards plus all 17 guard_target references still resolve.
- >-
  PLAN-gc-ops-baseline-gate-and-schedule-enable step 3's command exits 0 against an ENABLED tree
  and non-zero against a DISABLED tree, under BOTH the default environment and POSIXLY_CORRECT=1,
  using only binaries present on a stock ubuntu-latest runner.
- >-
  The amended plan's `scope`, `acceptance_criteria` and every `verification_plan[].expected` are
  byte-identical to origin/main, exactly one `verification_plan[].command` differs (step 3's), and
  that command still carries both conjuncts, the -A 10 window and the `state *= *"DISABLED"`
  literal.
- >-
  The amended plan carries no `implementation_declared` key, so the amendment DEFERS on
  validate_scope_boundary and cannot trip its prohibited-field check.
- >-
  rec-3767's stored acceptance is byte-identical to the amended step 3 command, and rec-2938
  records this second live occurrence, names the new lint as its primary fix in place of installing
  ripgrep, and stays open.
verification_plan:
- step: 1
  phase: pre-deploy
  hermetic: true
  graduation: graduate
  graduation_check_id: vp-replay-lints-rg-in-program-position
  action: >-
    Exercise the new lint through its real entry point on a synthetic plan corpus: an added plan
    with a pre-deploy step invoking rg in program position is FLAGGED; a sibling step whose command
    merely quotes the characters rg inside a string literal is NOT flagged; and a merely-modified
    plan is not linted at all. Runs the unit module rather than asserting the function exists.
  command: bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py -q -k "rg_portability"
  expected: All selected tests pass -- exit 0.
  fix_if: >-
    On the un-implemented tree the selector matches nothing and pytest exits 5 (target_absent) --
    genuinely red before. After implementation, a failure means the lint's program-position
    detection is wrong. If the false-positive case fails, detection regressed to a substring match;
    if the flagged case fails, segment splitting or the `!`/`env`/path-prefix stripping is wrong.
    Never relax the false-positive assertion to make the positive case pass.
- step: 2
  phase: pre-deploy
  hermetic: true
  graduation: graduate
  graduation_check_id: vp-replay-classifier-relocation-preserves-vocabulary
  action: >-
    Run the new mirror module: every outcome class reachable, all five unmeasurable arms
    classifying as unmeasurable, collection error as target_absent, exit 0 as tautological, exit 1
    as assertion_failed. This is the relocation's behaviour-preservation proof.
  command: bin/venv-python -m pytest tests/checks/verification/test__vp_replay_classify.py -q
  expected: All tests pass -- exit 0.
  fix_if: >-
    Red before implementation because the module does not exist (exit 4/5, target_absent). After,
    a failure means a constant or arm was dropped or altered during relocation -- the move is
    VERBATIM, so restore the original text rather than adjusting the test.
- step: 3
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Asserts a size property of one named file at one moment, not a repo invariant -- the standing
    instrument for SLOC is validate_sloc_limits, which already runs in both tiers over the whole
    tree. A shard here would duplicate that gate for a single path and would need re-tuning on
    every legitimate edit.
  action: >-
    Prove Decision 128 was honoured as a DECOMPOSITION and not a raise: both modules measure under
    the 500-SLOC unregistered-file limit, and config/sloc_budgets.yaml is byte-unchanged from
    origin/main. Asserting only the first half would pass equally well against a quietly registered
    budget, so both halves are load-bearing.
  command: |-
    bin/venv-python -c "
    import pathlib, subprocess
    for rel, cap in (('scripts/checks/verification/validate_vp_replay.py', 500), ('scripts/checks/verification/_vp_replay_classify.py', 500)):
        n = sum(1 for l in pathlib.Path(rel).read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'))
        assert n < cap, rel + ' is ' + str(n) + ' SLOC, at or over ' + str(cap)
        print(rel, n)
    diff = subprocess.run(['git', 'diff', 'origin/main', '--', 'config/sloc_budgets.yaml'], capture_output=True, text=True, check=True).stdout
    assert diff.strip() == '', 'config/sloc_budgets.yaml changed -- Decision 128 requires decomposition, not a raise'
    print('DECOMPOSED_NOT_RAISED')
    "
  expected: 'Prints both SLOC counts then: `DECOMPOSED_NOT_RAISED`. Exit 0.'
  fix_if: >-
    A count at or over 500 means the split did not free enough room -- move more of the classifier
    surface, never register a budget. A non-empty sloc_budgets.yaml diff means someone reached for
    a raise; revert it (Decision 128: a raise needs a `# raise-approved: dec-NNN` marker naming an
    authorising Decision, and no such Decision authorises this).
- step: 4
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time, base-ref-relative assertion about THIS amendment's diff; validate_vp_replay's own
    _is_pr_relative/_base_ref_collapsed partition excludes it once the base ref collapses, so it can
    never stand as a guard.
  action: >-
    Non-weakening proof for the parent-plan amendment, discharging Decision 181's CONTENT invariant
    mechanically rather than by assertion -- scope, acceptance_criteria and every expected
    byte-identical to origin/main; exactly one command differs and it is step 3's; the differing
    command still carries both conjuncts, the -A 10 window and the DISABLED literal; and no
    implementation_declared key was introduced.
  command: |-
    bin/venv-python -c "
    import subprocess, yaml
    rel = 'docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml'
    base = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:' + rel], capture_output=True, text=True, check=True).stdout)
    head = yaml.safe_load(open(rel, encoding='utf-8'))
    assert head['scope'] == base['scope'], 'scope changed'
    assert head['acceptance_criteria'] == base['acceptance_criteria'], 'acceptance_criteria changed'
    b = {s['step']: s for s in base['verification_plan']}
    h = {s['step']: s for s in head['verification_plan']}
    assert set(b) == set(h), 'step ids changed'
    assert all(b[i].get('expected') == h[i].get('expected') for i in b), 'an expected field changed'
    differing = sorted(i for i in b if b[i].get('command') != h[i].get('command'))
    assert differing == [3], 'commands differing from origin/main: ' + repr(differing)
    c = h[3]['command']
    assert c.count('grep') == 3, c
    assert 'rg' not in c.replace('grep', ''), 'step 3 still invokes ripgrep'
    assert '&&' in c and '! grep' in c, 'a conjunct or the negation was dropped'
    assert '-A 10' in c, 'the -A 10 context window narrowed'
    assert 'state *= *' + chr(34) + 'DISABLED' + chr(34) in c, 'the DISABLED literal changed'
    assert 'implementation_declared' not in head, 'amended plan declares implementation_declared'
    print('AMENDMENT_IS_A_PORTABILITY_SUBSTITUTION_NOT_A_WEAKENING')
    "
  expected: 'Prints: `AMENDMENT_IS_A_PORTABILITY_SUBSTITUTION_NOT_A_WEAKENING`. Exit 0.'
  fix_if: >-
    `scope changed` / `acceptance_criteria changed` / `an expected field changed` means the
    amendment reached beyond its declared field set -- those are prohibited_field_edits and the
    two-act procedure does not license widening them; revert. `commands differing` naming anything
    but [3] means a second command was edited. A dropped conjunct, narrowed window or changed
    literal means the probe was weakened rather than ported. The implementation_declared assertion
    failing means the amendment would stop DEFERring; remove the key.
- step: 5
  phase: pre-deploy
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Coupled to one named plan's step 3 command rather than to any repo invariant -- it would guard
    nothing once rec-3767 closes and the parent plan is merged. The durable half of this claim is
    step 1's lint, which stops the next such command being authored at all.
  action: >-
    Four-cell differential on the AMENDED command, derived from the plan YAML and never restated
    inline. Materialise two temp trees from the live terraform file -- gc_ops state literal forced
    to DISABLED, then to ENABLED -- and run the command in each under the default environment AND
    POSIXLY_CORRECT=1. This is the evidence that the substitution preserves discriminating power,
    and specifically that the canonical argument order cannot be silently reordered back.
  command: |-
    bin/venv-python -c "
    import os, pathlib, re, shutil, subprocess, tempfile, yaml
    plan = yaml.safe_load(pathlib.Path('docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml').read_text(encoding='utf-8'))
    cmd = [s for s in plan['verification_plan'] if s['step'] == 3][0]['command']
    assert 'rg' not in cmd.replace('grep', ''), 'step 3 still invokes ripgrep'
    rel = 'terraform/personal/ducklake_maintenance.tf'
    src = pathlib.Path(rel).read_text(encoding='utf-8')
    blk = re.search(r'resource \"aws_cloudwatch_event_rule\" \"ducklake_maintenance_gc_ops\" \{.*?\n\}', src, re.S)
    assert blk, 'gc_ops rule block not found'
    got = {}
    for label in ('DISABLED', 'ENABLED'):
        body = re.sub(r'state(\s*)=(\s*)\"(?:EN|DIS)ABLED\"', lambda m: 'state' + m.group(1) + '=' + m.group(2) + '\"' + label + '\"', blk.group(0))
        tree = src.replace(blk.group(0), body)
        for posix in (False, True):
            d = tempfile.mkdtemp()
            try:
                t = pathlib.Path(d, rel)
                t.parent.mkdir(parents=True)
                t.write_text(tree, encoding='utf-8')
                env = dict(os.environ)
                env.pop('POSIXLY_CORRECT', None)
                if posix:
                    env['POSIXLY_CORRECT'] = '1'
                got[(label, posix)] = subprocess.run(cmd, shell=True, cwd=d, env=env, capture_output=True).returncode
            finally:
                shutil.rmtree(d)
    want = {('DISABLED', False): 1, ('DISABLED', True): 1, ('ENABLED', False): 0, ('ENABLED', True): 0}
    assert got == want, 'probe polarity wrong -- got ' + repr(got) + ' want ' + repr(want)
    print('PROBE_DISCRIMINATES_IN_BOTH_POLARITIES_AND_BOTH_ENVIRONMENTS')
    "
  expected: 'Prints: `PROBE_DISCRIMINATES_IN_BOTH_POLARITIES_AND_BOTH_ENVIRONMENTS`. Exit 0.'
  fix_if: >-
    A non-zero in an ENABLED cell means the probe no longer passes on a correctly-enabled tree. A
    ZERO in a DISABLED cell is the serious one -- the gate has inverted and would license a
    destructive production schedule against a rule that is still disabled. If only the
    POSIXLY_CORRECT DISABLED cell is 0, the argument order was reordered back to
    `grep -n PATTERN -A 10 PATH`; restore `grep -n -A 10 PATTERN PATH`. Never relax `want`.
- step: 6
  phase: pre-deploy
  hermetic: false
  graduation: not-applicable
  action: >-
    Confirm rec-3767's stored acceptance is byte-identical to the amended step 3 command, and that
    rec-2938 records this occurrence, names the new lint in place of installing ripgrep, and stays
    open. Reads the local cache only AFTER the authoritative portal writes; the cache is never a
    write source (Decision 84).
  command: |-
    bin/venv-python -m scripts.sync.ops pull && bin/venv-python -c "
    import json, pathlib, yaml
    plan = yaml.safe_load(pathlib.Path('docs/plans/PLAN-gc-ops-baseline-gate-and-schedule-enable.yaml').read_text(encoding='utf-8'))
    cmd = [s for s in plan['verification_plan'] if s['step'] == 3][0]['command']
    rows = {r['id']: r for r in (json.loads(l) for l in open('logs/.recommendations-log.jsonl', encoding='utf-8'))}
    assert rows['rec-3767']['acceptance'] == cmd, 'rec-3767 acceptance drifted from step 3'
    ctx = rows['rec-2938']['context']
    assert 'vp-replay-lints-rg-in-program-position' in ctx, 'rec-2938 does not name the lint that replaces its primary fix'
    assert '1206' in ctx, 'rec-2938 does not record the second live occurrence'
    assert rows['rec-2938']['status'] == 'open', 'rec-2938 was closed; the class owner stays open'
    print('PORTAL_STATE_CONSISTENT')
    "
  expected: 'Prints: `PORTAL_STATE_CONSISTENT`. Exit 0.'
  fix_if: >-
    A mismatch means an update_rec was not issued, or was issued with different text. Re-issue
    through the portal and re-pull. If the portal is unreachable the write FAILS LOUDLY (Decision 84
    I-4) -- restore the agent_platform chain and re-file; never hand-edit
    logs/.recommendations-log.jsonl to make this pass, which is the replay-from-cache anti-pattern
    Decision 84 records.
- step: 7
  phase: pre-deploy
  hermetic: false
  graduation: not-applicable
  action: >-
    Run the authoritative fast tier locally as a pre-check, then the full tier per handoff_policy.
    Not hermetic -- validate_vp_replay statically refuses a graduate step invoking scripts.validate
    for recursion, and Decision 73 makes --pre authoritative only when PR CI runs it.
  command: bin/venv-python -m scripts.validate --pre
  expected: 'All checks passed.'
  fix_if: >-
    validate_verification_registry failing on the repointed or new shards means a differential did
    not admit. NOTE a known local-environment trap: run_differential executes the shard inside a
    venv-less origin/main worktree, and this container's system python3 is 3.11 without pydantic, so
    bin/venv-python cannot resolve there and _probe_environment_on_fail raises rather than falsely
    admitting. Re-run with `PATH=$PWD/.venv/bin:$PATH` so the fallback resolves a 3.12 interpreter
    and the differential is content-driven. CI needs no such workaround (hosted 3.12 plus
    requirements-fast.txt). Do NOT interpret that raise as a real content failure.
test_obligations:
- source: scripts/checks/verification/validate_vp_replay.py
  behavior: >-
    A pre-deploy VP step invoking rg in program position, on a plan added or resolved in the diff,
    is flagged; a command that merely contains the text rg is not.
  verification_step: 1
  test_selector: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
  red_green_expectation: >-
    Red before (the -k rg_portability selector matches nothing, pytest exits 5), green after.
- source: scripts/checks/verification/_vp_replay_classify.py
  behavior: >-
    All four outcome classes and all five unmeasurable arms classify exactly as they did before the
    relocation.
  verification_step: 2
  test_selector: tests/checks/verification/test__vp_replay_classify.py
  red_green_expectation: >-
    Red before (module absent, pytest collection error), green after.
- source: config/agent/verification_registry/entries/vp-replay-coverage-survives-absent-ripgrep.yaml
  behavior: The exit-2 arm stays covered with no ripgrep binary resolvable, at the relocated path.
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  waiver_reason: >-
    A graduated registry row is executed by validate_verification_registry's real differential
    (origin/main must FAIL, HEAD must PASS), which VP step 7 dispatches. A unit test over the shard
    would assert its YAML shape, not that the check discriminates -- strictly weaker than the
    differential that already gates it.
- source: docs/contracts/vp-red-before.yaml
  behavior: Declares the new lint's population, detection rule and fail-open posture.
  verification_step: 7
  command: bin/venv-python -m scripts.validate --pre
  waiver_reason: >-
