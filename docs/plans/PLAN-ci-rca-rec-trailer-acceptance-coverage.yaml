schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-rec-trailer-acceptance-coverage
intent: >-
  Close rec-4057 and rec-4066 -- one defect filed twice: scripts/rec_trailer_acceptance.py landed at 44% per-file line
  coverage via PR #1273 and is hard-blocking every /plan session -- by covering its untested CLI, closure-loop, git and
  artifact paths to 100%, and by closing the local-handoff blind spot that let the last two consecutive coverage escapes
  (both brand-new modules) through: scripts/test_coverage_checker.get_changed_source_files never sees untracked files.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-rec-trailer-acceptance-coverage.yaml
phase: >-
  Soft-warn exception category ci_rca; names NO tier_item, so the Tier Item Freshness Gate is skipped. Repairs a defect the
  ci-rca agent filed against scripts/rec_trailer_acceptance.py (slice A of Decision 201's trailer-acceptance gate). T3.7
  (validation-suite meta-validation, deferred_post_mvp) is the nearest tier_item and is deliberately NOT claimed: this plan
  widens the file set the existing per-changed-file floor measures and forecloses none of T3.7's criteria.
scope:
  - file: tests/test_rec_trailer_acceptance.py
    action: Modify
    purpose: >-
      Decision 131 mirror home (map_source_to_test resolves the module to exactly this file). Add two NEW classes and leave
      TestVerdictMapping / TestCensus untouched (they carry graduated shards). TestSeamsAndArtifacts covers _make_reader
      (patch src.common.ducklake_reader_client.make_reader, assert the profile is forwarded), census()'s live-reader path
      with an injected fake reader (a found row is classified; an id whose rec_by_id read is empty is omitted),
      _current_sha and _current_commit_message on success AND on a non-zero git exit (RuntimeError naming the git
      command), _default_artifact_dir, and _write_json/_read_json round-trip plus the missing-artifact RuntimeError.
      TestCliStages covers cmd_census (no Resolves trailer -> no-op artifact with empty ids/entries; a trailer -> census
      entries written), cmd_evaluate (both the --payload path and the artifact-dir path; the verdict artifact is written),
      cmd_close (no-trailer no-op; a sync() exception is tolerated; the read cache is parsed skipping blank and malformed
      lines; close_recs_from_trailer receives the rejoined verdicts, GITHUB_* env-derived commit_sha/run_url, and
      require_acceptance_verdict=True), build_parser, and main (default artifact dir applied when --artifact-dir is
      omitted; a RuntimeError returns 1 and prints the FAIL line to stderr). The test named
      test_close_requires_acceptance_verdict asserts the require_acceptance_verdict=True kwarg and the rejoined verdict
      mapping -- the closure gate's fail-closed invariant -- and is graduated (VP step 1). HERMETICITY: cmd_close's lazy
      `from scripts.ops_data_portal import sync` would, if real, pull the warehouse and rewrite the local logs/ read
      caches; inject a types.ModuleType stub via patch.dict(sys.modules, {"scripts.ops_data_portal": stub}) and patch
      scripts.ops_portal.ci_rca_lifecycle.close_recs_from_trailer directly -- never import the real portal module
      (VP step 3 proves it by making the real module unimportable). Redirect every path through tmp_path (patch the module-level
      ROOT for cmd_close's cache read; patch _current_sha/_current_commit_message/_default_artifact_dir for the CLI
      stages). Measured 120 SLOC today; the addition keeps it well under 500, leaving headroom for slice B.
  - file: config/agent/verification_registry/entries/rec-trailer-acceptance-close-requires-verdict.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 1 (the instance guard): check_id
      rec-trailer-acceptance-close-requires-verdict, guard_target scripts/rec_trailer_acceptance.py, guard_symbol
      cmd_close, plan_slug ci-rca-rec-trailer-acceptance-coverage, check_spec.node_id
      tests/test_rec_trailer_acceptance.py::TestCliStages::test_close_requires_acceptance_verdict. Field shape copied from
      config/agent/verification_registry/entries/rec-autoclose-trailer-gate-read-oserror.yaml.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Replace get_changed_source_files' hand-rolled git logic (the push_context_base branch, the merge-base branch and the
      diff-against-HEAD fallback) with ONE delegation to scripts.checks._common.get_status_aware_diff(root), keeping every
      status except "D" (A, M and "??"), so a brand-new untracked src/scripts module is measured. get_status_aware_diff
      already implements push_context_base -> merge-base -> HEAD fallback plus the `git ls-files --others
      --exclude-standard` untracked leg (rec-2638 precedent, Decision 135 point 3), so base semantics are preserved
      (Decision 159 clause 1). Add a keyword-only `root: Path | None = None` parameter, forwarded to
      get_status_aware_diff(root) and used for path resolution and the src/scripts relative_to filter (Decision 159
      2026-08-18 amendment shape); the explicit `files` argument path is unchanged. Keep the __init__.py / conftest.py /
      src-or-scripts / exists() filters exactly as today. Measured 490 SLOC against the 500 limit, unregistered: the
      change MUST be net non-increasing (VP step 6) -- a crossing would force a Decision 128 decomposition this plan does
      not scope.
  - file: tests/test_coverage_checker/test_coverage_checker_checks.py
    action: Modify
    purpose: >-
      (a) Add test_untracked_new_source_file_is_returned to the EXISTING TestGetChangedSourceFiles class: a REAL tmp_path
      git repository (git init; one committed tracked scripts/*.py then modified; one untracked new scripts/*.py; one
      untracked src/*.py; one untracked docs/*.py outside src/scripts; one untracked scripts/*.py matched by a .gitignore
      entry; one untracked scripts/__init__.py), calling get_changed_source_files(root=tmp_path) and asserting the
      modified tracked file AND both untracked src/scripts modules are returned while the docs, gitignored and
      __init__ paths are not. Decorate it @pytest.mark.real_subprocess -- the package conftest patches the process-global
      subprocess.Popen to raise, so an unmarked real-git test fails for the wrong reason. Clear GITHUB_EVENT_NAME and
      GITHUB_EVENT_BEFORE via monkeypatch (push_context_base's env signal is job-global, Decision 159) and make the
      setup commit with `git -c commit.gpgsign=false -c user.name=t -c user.email=t@example.invalid commit` (CC-web sets
      commit.gpgsign=true globally). Graduated (VP step 4). (b) Re-seat the existing TestGetChangedSourceFiles mocks,
      which patch test_coverage_checker.subprocess.run with a two-element side_effect list, onto
      scripts.checks._common.get_status_aware_diff returning (status, path) tuples: unmodified, they would exhaust that
      two-element list on the delegation's third git probe (ls-files -> StopIteration), and their --name-only stdout
      carries no tab, so get_status_aware_diff's --name-status parser would drop every line. Add one mocked case
      asserting a "D" entry is dropped, using a path that EXISTS on disk (e.g. ("D", "scripts/validate.py")) so the
      status filter -- not the exists() filter -- is what drops it.
  - file: config/agent/verification_registry/entries/coverage-checker-untracked-new-source.yaml
    action: Create
    purpose: >-
      Graduated test_selector shard for VP step 4 (the CLASS guard) and the closure_artifact for BOTH recs (Decision 186
      point 5: a duplicate cites the class artifact, fix-bound like any other): check_id
      coverage-checker-untracked-new-source, guard_target scripts/test_coverage_checker.py, guard_symbol
      get_changed_source_files, plan_slug ci-rca-rec-trailer-acceptance-coverage, check_spec.node_id
      tests/test_coverage_checker/test_coverage_checker_checks.py::TestGetChangedSourceFiles::test_untracked_new_source_file_is_returned.
bundled_recommendations:
  - rec-4057
  - rec-4066
followon_recs:
  - rec-4077
  - rec-4078
  - rec-4079
  - rec-4080
  - rec-4082
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    scripts/rec_trailer_acceptance.py reports 100% line coverage under its Decision 131 mirror test file, measured by the
    same machinery validate_test_coverage uses (scripts.test_coverage_checker --check-coverage). Measured at authoring
    time: 44.0%, 89 statements missed.
  - >-
    scripts/rec_trailer_acceptance.py itself is NOT modified, and config/coverage_baseline.yaml gains no entry for it
    (Decision 159 clause 2 -- the floor is met, not grandfathered).
  - >-
    tests/test_rec_trailer_acceptance.py passes with the real scripts.ops_data_portal made unimportable -- the new
    cmd_close tests stub the portal rather than importing it, so no test reaches the warehouse or rewrites the local
    read caches.
  - >-
    TestCliStages::test_close_requires_acceptance_verdict asserts that cmd_close hands close_recs_from_trailer
    require_acceptance_verdict=True and the rejoined verdict mapping. NOT DISCRIMINATED BY ANY VP STEP beyond presence and
    pass: an assertion-free test passes VP step 1 and raises coverage identically, so the reviewer confirms both assertions
    at code-review.
  - >-
    get_changed_source_files returns a brand-new untracked src/ or scripts/ .py file (proved in a real tmp git
    repository), still returns tracked added/modified files, and still excludes deleted paths, __init__.py, conftest.py,
    gitignored files and paths outside src/ and scripts/.
  - >-
    scripts/test_coverage_checker.py stays at 100% line coverage and at or below its measured 490 SLOC.
  - >-
    Both new shards exist at config/agent/verification_registry/entries/<check_id>.yaml and are ADMITTED by
    validate_verification_registry's differential gate (each check_spec fails at origin/main and passes at HEAD).
  - >-
    rec-4057 and rec-4066 carry the repaired acceptance command, it resolves to a `holds` verdict through the real
    Decision 201 census + sandboxed-probe path on the merged tree, and both recs are status=closed with
    context_v2_json.closure_artifact == "shard:coverage-checker-untracked-new-source" and fixed_by_sha set by a single
    update_rec call each.
  - >-
    Neither rec-4057 nor rec-4066 appears in the DuckLake reader's ci_rca_open named read afterwards.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the graduated instance guard: the close stage threads the fail-closed verdict requirement into the closure loop.
    command: bin/venv-python -m pytest tests/test_rec_trailer_acceptance.py::TestCliStages::test_close_requires_acceptance_verdict -q
    expected: >-
      Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent, a valid
      Decision 189 red-before outcome).
    expected_literals:
      - "1 passed"
    fix_if: >-
      Exit 4 (not found) means the test was named or placed differently -- the node id is pinned by the shard and by both
      recs' repaired acceptance, so do not rename it.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-trailer-acceptance-close-requires-verdict
  - step: 2
    phase: pre-deploy
    action: >-
      Measure the module's per-file line coverage under its mirror test with the checker validate_test_coverage itself
      delegates to (parent-directory --cov form; the dotted single-module form is the rec-943 / Decision 159 clause 2
      pitfall).
    command: bin/venv-python -m scripts.test_coverage_checker --check-coverage --files scripts/rec_trailer_acceptance.py
    expected: >-
      Exit 0, the coverage line reporting all one source file at 100%, and the PASS diagnostic verdict. Measured at
      authoring time: exit 1, "scripts/rec_trailer_acceptance.py: 44.0% line coverage (expected 100%)", 89 missing lines.
    expected_literals:
      - "Coverage: all 1 source files at 100%."
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: >-
      A residual missing-line list names exactly the statements still unexercised -- add the missing test arm rather than
      a pragma or a baseline entry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_test_coverage, which re-measures this module at the same 100% floor with the same machinery on
      every future diff that touches it (local full tier and post-merge on main). A second standing guard would restate
      that floor at narrower scope (Decision 86). The class-level guard against the escape itself is VP step 4's shard.
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the mirror test file is hermetic: with the real scripts.ops_data_portal made unimportable, every test still
      passes, so no test imports the real portal (whose sync() would pull the warehouse and rewrite local read caches).
    command: >-
      bin/venv-python -c "import sys, pytest; sys.modules['scripts.ops_data_portal'] = None;
      raise SystemExit(pytest.main(['tests/test_rec_trailer_acceptance.py', '-q', '--no-header']))"
    expected: >-
      Exit 0 with every test in the file passing. The stubbed cmd_close tests override the poisoned entry through
      patch.dict(sys.modules, ...); an unstubbed real import raises ImportError. Measured at authoring time on the
      un-implemented tree: 20 passed (verified by plan-critique round 1).
    expected_literals:
      - "passed"
    fix_if: >-
      An ImportError naming scripts.ops_data_portal means a test imported the real portal instead of the stub -- replace
      it with the patch.dict(sys.modules, ...) stub.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Green-before by construction (the 20 pre-existing tests already avoid the portal), so it cannot satisfy the
      Decision 189 red-before a graduate needs; it proves a property of the NEW tests only when re-run after
      implementation, which is exactly what this step does.
  - step: 4
    phase: pre-deploy
    action: >-
      Run the graduated class guard: a brand-new untracked src/scripts module is returned by get_changed_source_files in a
      real git repository, while tracked changes are still returned and non-source paths are still excluded.
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_checks.py::TestGetChangedSourceFiles::test_untracked_new_source_file_is_returned -q
    expected: >-
      Exit 0 with a one-test pass summary. On the un-implemented tree the node does not exist (target_absent).
    expected_literals:
      - "1 passed"
    fix_if: >-
      A RuntimeError about subprocess.Popen means the real_subprocess marker is missing. An empty result means the
      delegation dropped the "??" status or resolved paths against the module ROOT instead of the injected root.
    hermetic: true
    graduation: graduate
    graduation_check_id: coverage-checker-untracked-new-source
  - step: 5
    phase: pre-deploy
    action: >-
      Confirm the rewritten coverage checker keeps its own 100% floor, measured by itself.
    command: bin/venv-python -m scripts.test_coverage_checker --check-coverage --files scripts/test_coverage_checker.py
    expected: >-
      Exit 0, the coverage line reporting all one source file at 100%, and the PASS diagnostic verdict. Measured at
      authoring time on the un-implemented tree: PASS (the module is at 100% today).
    expected_literals:
      - "Coverage: all 1 source files at 100%."
      - "DIAGNOSTIC VERDICT: PASS"
    fix_if: >-
      A missing line inside get_changed_source_files usually means the "D"-drop or the root-defaulting branch is
      unexercised -- add the mocked case, not a pragma.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_test_coverage, which enforces this module's 100% floor whenever a diff touches it; VP step 4's
      shard is the standing behavioural guard.
  - step: 6
    phase: pre-deploy
    action: >-
      Confirm the delegation is net non-increasing in SLOC, so no Decision 128 decomposition is triggered.
    command: >-
      bin/venv-python -c "lines = open('scripts/test_coverage_checker.py', encoding='utf-8').read().splitlines();
      n = len([ln for ln in lines if ln.strip() and not ln.strip().startswith('#')]); print('SLOC', n);
      raise SystemExit(0 if n <= 490 else 1)"
    expected: >-
      Exit 0 with the printed SLOC at or below 490 (the counting rule is validate_sloc_limits' own). Measured at
      authoring time: 490.
    fix_if: >-
      Above 490 means the old git branches were kept alongside the delegation -- remove them; do not register a budget.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_sloc_limits is the standing guard (500 limit, both tiers); the tighter 490 bound is this plan's own
      net-non-increase claim and has no standing meaning after merge.
  - step: 7
    phase: pre-deploy
    action: >-
      Run the fast presubmit tier, where both shards' differential admission and the graduation-completeness legs fire.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      The printed summary reports zero failed checks; validate_verification_registry reports both new shards ADMITTED;
      validate_graduation_completeness passes; validate_plan_documents, validate_sloc_limits and validate_scope_boundary
      pass.
    fix_if: >-
      Read the summary, never the exit code (Decision 73: --pre exits 0 outside CI while printing failures). A "not
      admitted" shard means its node passes at origin/main or fails at HEAD.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate, which vp-red-before.yaml's recursion_refusal refuses for a graduate disposition; its exit
      code is not a kernel assertion outside CI. Its constituent checks are each registered in their own right.
  - step: 8
    phase: pre-deploy
    action: >-
      Run the full tier before handoff (Decision 163). Stage everything first (`git add -A`) so no new file is invisible
      to the tier's diff-derived checks -- the stop-gap until the commit-first handoff plan lands.
    command: git add -A && bin/venv-python -m scripts.validate
    expected: >-
      Final Validation Summary (scope: all) PASS with zero failed checks. The Test coverage check section now measures
      scripts/test_coverage_checker.py (modified in this diff) at 100%; it does NOT re-measure
      scripts/rec_trailer_acceptance.py (unmodified here) -- VP step 2 is that module's authoritative measurement.
    fix_if: >-
      Any "line coverage (expected 100%)" line is a real regression. A timeout is BLOCKED per handoff_policy -- rerun the
      full tier from the start; never commit on a partial run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Same recursion refusal and Decision 73 exit-code caveat as step 7, at the full tier; its constituent checks are
      registered in their own right.
  - step: 9
    phase: post-deploy
    action: >-
      AFTER the squash-merge lands: repair both recs' acceptance commands (both are unsatisfiable today -- rec-4057 greps
      for a 100.0% line the checker never prints; rec-4066 names a non-existent node and chains `coverage report` with no
      data file) to a decidable, lint-clean, sandbox-safe coverage-floor oracle, then read both back.
    command: >-
      for R in rec-4057 rec-4066; do bin/venv-python -m scripts.ops_data_portal --update-rec "$R" --profile agent_platform
      --acceptance "COVERAGE_FILE=/tmp/$R.coverage bin/venv-python -m pytest tests/test_rec_trailer_acceptance.py::TestCliStages tests/test_rec_trailer_acceptance.py -q --cov=scripts.rec_trailer_acceptance --cov-report=term-missing --cov-fail-under=100"
      || exit 1; done && bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r = make_reader(profile='agent_platform'); a = [r.named('rec_by_id', id=i)[0]['acceptance'] for i in ('rec-4057', 'rec-4066')];
      print(a); assert all('COVERAGE_FILE=/tmp/rec-40' in x and '--cov-fail-under=100' in x and '|' not in x for x in a)"
    expected: >-
      Both writes succeed and the read-back prints both repaired commands. The oracle is a single pytest invocation with
      NO pipe, so its exit status is the conjunction of every test passing (rec-4066's original pytest conjunct) AND
      coverage at 100% (both recs' floor) -- both original conjuncts are kept (Decision 181). Verified at authoring time on
      an analogous module genuinely at 100%: write-time lint True, census bucket probeable, probe.run_one PASS in the
      unshare sandbox, and FAIL once a covering test is deselected. The COVERAGE_FILE prefix is the workaround rec-4079
      owns removing.
    fix_if: >-
      A lint refusal means the command text drifted from the verified shape -- restore it verbatim. Never add a pipe (it
      hides pytest's exit status, so a failing suite would still read holds) and never fall back to a bare node id (which
      drops the coverage floor).
    hermetic: false
  - step: 10
    phase: post-deploy
    action: >-
      Prove the repaired acceptance resolves to `holds` through the REAL Decision 201 path -- the census require_decidable
      ratchet plus the read-only, networkless probe sandbox -- on the merged tree.
    command: >-
      bin/venv-python -c "import subprocess; from pathlib import Path; from scripts.rec_trailer_acceptance import census, evaluate;
      root = Path('.').resolve(); sha = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip();
      doc = evaluate(census(['rec-4057', 'rec-4066'], profile='agent_platform'), root, sha);
      v = {x['rec_id']: x['verdict'] for x in doc['records']}; print(doc['isolation_available'], v);
      assert doc['isolation_available'] and v == {'rec-4057': 'holds', 'rec-4066': 'holds'}"
    expected: >-
      Prints True and both recs mapped to holds. Run from a checkout whose tests/test_rec_trailer_acceptance.py matches the
      squash-merge (the post-merge branch tip qualifies).
    fix_if: >-
      out_of_grammar means the acceptance text changed shape (re-run step 9 verbatim); fails means coverage regressed or
      the sandbox could not write the redirected coverage file; isolation_available False means unshare is unavailable in
      this container -- record it and rely on step 9's read-back, never on a hand-assertion.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      Close both recs through the manual portal route with the fix-bound CLASS shard -- close_recs_from_trailer threads no
      closure_artifact, so the trailer route would refuse these escape-classified recs (Decision 186 point 7). Derive the
      fix sha FROM THE ARTIFACT, never from main's tip.
    command: >-
      git fetch origin main --quiet && SHARD=config/agent/verification_registry/entries/coverage-checker-untracked-new-source.yaml
      && test -f "$SHARD" && MERGE_SHA=$(git rev-list -1 origin/main -- "$SHARD") && test -n "$MERGE_SHA"
      && git diff-tree --no-commit-id --name-only -r "$MERGE_SHA" | grep -x "$SHARD"
      && for R in rec-4057 rec-4066; do bin/venv-python -m scripts.ops_data_portal --update-rec "$R" --status closed
      --resolution "Resolved by PLAN-ci-rca-rec-trailer-acceptance-coverage: tests restore scripts/rec_trailer_acceptance.py to 100% line coverage; shard coverage-checker-untracked-new-source makes the pre-handoff full tier measure brand-new modules. The RCA's presubmit preventive is carried by rec-3221/rec-3232 (unblocked by rec-4077), the commit-first handoff by PLAN-handoff-validates-committed-tree, the duplicate filing by rec-4078."
      --closure-artifact "shard:coverage-checker-untracked-new-source" --closure-fix-sha "$MERGE_SHA" --profile agent_platform
      || exit 1; done && bin/venv-python -c "import json; from src.common.ducklake_reader_client import make_reader;
      r = make_reader(profile='agent_platform'); rows = [r.named('rec_by_id', id=i)[0] for i in ('rec-4057', 'rec-4066')];
      c = [json.loads(x['context_v2_json']) for x in rows]; print([(x['id'], x['status']) for x in rows], [y.get('closure_artifact') for y in c]);
      assert all(x['status'] == 'closed' for x in rows) and all(y.get('closure_artifact') == 'shard:coverage-checker-untracked-new-source' and y.get('fixed_by_sha') for y in c)"
    expected: >-
      The diff-tree guard echoes the shard path, both writes succeed, and the named-read read-back (Decision 88 invariant
      ii -- no full-table sync) shows both closed with the class shard token and a fixed_by_sha.
    fix_if: >-
      An empty MERGE_SHA means the squash-merge has not reached origin/main yet -- wait and re-run. A MERGE_SHA naming a
      later toucher of the shard still resolves (Decision 186 point 4 binds added-or-modified); if it is the wrong
      attribution, pass this plan's squash sha explicitly to both the guard and --closure-fix-sha. Both closure flags ride
      the SAME update_rec call.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      Confirm the planning hard block is lifted, read from the warehouse rather than preflight's cache (preflight ran
      DEGRADED at authoring time with the reader returning 502, so its empty ci_rca list proved nothing).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      ids = [x['id'] for x in make_reader(profile='agent_platform').named('ci_rca_open')]; print('open ci_rca:', ids);
      assert 'rec-4057' not in ids and 'rec-4066' not in ids"
    expected: >-
      Prints the open ci_rca id list with neither rec present.
    fix_if: >-
      Either id present means step 11's write did not land -- re-run step 11's read-back before anything else; never edit
      logs/.recommendations-log.jsonl (Single Portal Invariant).
    hermetic: false
test_obligations:
  - source: scripts/test_coverage_checker.py
    behavior: >-
      get_changed_source_files returns brand-new untracked src/scripts modules alongside tracked added/modified files, and
      still drops deleted, __init__/conftest, gitignored and non-src/scripts paths.
    verification_step: 4
    test_selector: tests/test_coverage_checker/test_coverage_checker_checks.py::TestGetChangedSourceFiles::test_untracked_new_source_file_is_returned
    red_green_expectation: >-
      Red before (node absent; and the current implementation has no root parameter and never reads untracked files),
      green after.
  - source: config/agent/verification_registry/entries/rec-trailer-acceptance-close-requires-verdict.yaml
    behavior: >-
      check_id equals VP step 1's graduation_check_id and the materialized check_spec is admitted by the differential gate.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
