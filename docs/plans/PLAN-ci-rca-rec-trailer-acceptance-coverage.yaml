constraints:
  - >-
    NO "Resolves: rec-4057, rec-4066" trailer on the squash-merge. Both recs are escape-classified on both limbs
    (escape_class no-edge; detection_gap.escape_mode tier_misplaced), so Decision 186's obligation fires and the trailer
    path, which threads closure_fix_sha but never closure_artifact, would refuse and leave them OPEN. SECOND reason: at
    merge time both recs still carry their unsatisfiable ORIGINAL acceptance (repaired only in post-deploy VP step 10), so
    the trailer-closure job would record an acceptance-verdict refusal -- and docs/contracts/git-ops.yaml::resolves_trailer
    sanctions the manual fallback only after a transport failure or merge-leg refusal, and FORBIDS it after a verdict
    refusal. Close them only via VP step 11 (ci-rca-lifecycle.yaml closure_dependency.manual_route; precedent
    PLAN-rec-autoclose-trailer-gate-oserror-coverage).
  - >-
    Ordering is load-bearing and executed, not declared: squash-merge, then VP step 10 (acceptance repair), then step 11
    (verdict computed at the merge sha; closure only on holds, in the same command), then step 12. Decision 201 keys any
    verdict to the sha256 of the CURRENT acceptance text and to the closing sha.
  - >-
    Do not modify scripts/rec_trailer_acceptance.py, and add no config/coverage_baseline.yaml entry and no
    `# pragma: no cover` -- the floor is met by tests (Decision 159).
  - >-
    Do not disturb TestVerdictMapping or TestCensus in tests/test_rec_trailer_acceptance.py (graduated shards); add new
    classes only. PLAN-trailer-acceptance-junit-verdict (slice B) modifies the same two files and lands AFTER this plan.
  - >-
    scripts/test_coverage_checker.py stays at or below 490 SLOC and unregistered; do not touch config/sloc_budgets.yaml
    (Decision 128/165).
  - >-
    Do not rename, move or weaken tests/test_coverage_checker/test_coverage_checker_checks.py::test_coverage_reports_owning_target_and_module
    -- it is the graduated selector of the mapped-coverage-diagnostic-contract and coverage-checker-move-no-stale-refs
    shards; only TestGetChangedSourceFiles in that file is in play.
  - >-
    Never import the real scripts.ops_data_portal from tests/test_rec_trailer_acceptance.py (its sync() would reach the
    warehouse and rewrite local read caches); stub it through sys.modules.
  - >-
    Out-of-scope defects found along the way become recs via scripts.ops_data_portal, never inline fixes (Decision 59).
    The four already found are filed: rec-4077, rec-4078, rec-4079, rec-4080.
  - >-
    Single Portal Invariant: every rec write goes through scripts.ops_data_portal; never Edit logs/*.jsonl.
  - >-
    Decision 55/72: forward-fix only; no rescue agents, no workaround loops, no --ignore-budget.
  - >-
    bin/venv-python never bare python; Linux/bash only; line length 127; type hints required; no emojis; no em dashes.
