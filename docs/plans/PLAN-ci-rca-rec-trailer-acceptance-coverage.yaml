rollback: >-
  Reverting removes tests, two shards and the checker delegation; the module returns to 44% and the next post-merge full
  tier re-files an equivalent Critical ci_rca rec -- prefer forward-fix (Decision 73). If the recs were already closed, a
  revert leaves closed recs whose class artifact no longer resolves (back_validation grades artifact-absent); remediate by
  filing a fresh rec, never by reopening (Decision 103 bans closed->open).
