schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-substrate-guard-deferral"
intent: >-
  Register, as an enforced and evidence-bound roadmap dependency rather than a remembered
  intention, that the deterministic apply guard must classify the executor's compute-substrate
  resource types before the executor can execute anything -- and close out T2.45, whose shipped
  work has sat unmarked for a month and has already propagated a false sequencing claim into a
  downstream item's permanent record.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-substrate-guard-deferral.yaml
phase: >-
  Platform tier_item T4.2 (agent-persona nodes; the item whose completion activates personas and
  to which Decision 67's reversal is tied via CD.17). Also discharges T2.48's sole dependency by
  closing T2.45. Bookkeeping and registration only; builds no guard stage and selects no substrate.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Convert T4.2's six bare-string exit criteria to ExitCriterion objects preserving each text
      VERBATIM, then append criterion c7 carrying the guard-classification prerequisite, its
      deterministic satisfaction test and its trigger; add a dated T4.2 progress_note line. Flip
      T2.45 to complete with completed_at, a progress_note and per-criterion met/met_by. Add a
      dated correction line to T2.48's progress_note retracting its false "ahead of T2.45" claim.
  - file: tests/roadmap/test_substrate_guard_deferral.py
    action: Create
    purpose: >-
      Mirror test asserting the registration exists and is well-formed: T4.2 carries the guard
      criterion with both trigger conditions and a resolving met_by if met, T4.2's criterion ids
      are unique, and T2.45 is complete with every criterion met.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One COMPACT flow-mapping row graduating the mirror test, so the registration survives someone
      deleting the test file -- the rot this plan exists to prevent.
bundled_recommendations: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    T4.2's six existing exit criteria are ExitCriterion objects (id, text, status: open) whose text
    is byte-identical to the bare strings they replace -- c5 especially, which is the CD.17
    reversal precondition verbatim and is referenced as such elsewhere.
  - >-
    T4.2 carries a NEW criterion c7, status open, stating that deterministic guard classification of
    the executor's compute substrate must be live before any persona can execute, and carrying a
    DETERMINISTIC satisfaction test: for every resource type declared by the ratified substrate's
    terraform module the guard blocks a non-inert change and passes an inert one, asserted by a
    registered check whose blocked-type count equals the module's declared-type count.
  - >-
    c7 names both trigger conditions (the substrate ratified by T4.15; rec-2816's tf-gated-apply
    approval weakness remediated) and names docs/plans/PLAN-executor-substrate-guard-deferral.yaml
    as the carrier of the measured recon.
  - >-
    T4.2's criterion ids are unique after the edit, asserted by the mirror test. Nothing in
    scripts/ validates criterion-id uniqueness -- only tier_item ids -- so a future bare-string
    insert ahead of a dict criterion would silently produce a duplicate.
  - >-
    T2.45 reads status complete with completed_at, a progress_note, and all three criteria status
    met with met_by "terraform-guard-resource-policy", which resolves to a real plan file and so
    satisfies validate_platform_roadmap check (i).
  - >-
    The T2.45 closeout is grounded in re-executed evidence, not inference (Decision 136): step 2
    drives the real guard and must print its exact expected line before the flip is permitted.
  - >-
    T2.48's progress_note carries a dated correction retracting its claim that "the write-surface
    broadening already shipped in slice E ahead of T2.45". Measured: the guard classification
    merged 2026-07-21T22:30:40+01:00 and the broadening merged 2026-07-22T16:18:30+01:00, so the
    guard landed 17.8 hours FIRST and T2.45's sequencing obligation was SATISFIED.
  - >-
    The mirror test does NOT lock the deferral shut: it accepts c7 at status open or met, and
    requires a resolving met_by only when met, so it stays green on the day the guard work lands.
  - >-
    config/agent/verification_registry/registry.yaml carries one COMPACT single-line row for the
    mirror test, and the file stays within its 6,000 effective-line budget.
  - >-
    No guard stage, resource-type frozenset, or contract classification row is created.
    scripts/terraform_apply_guard.py and docs/contracts/environment-taxonomy.yaml are untouched, so
    the CODEOWNERS protected-path review does not fire.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the mirror test: it parses the real roadmap and asserts the T4.2 criterion exists with
      both triggers and an acceptable status, that T4.2's criterion ids are unique, and that T2.45
      is complete with all criteria met and a resolving met_by.
    command: bin/venv-python -m pytest tests/roadmap/test_substrate_guard_deferral.py -q
    expected: Exit 0, no failures and no collection errors.
    fix_if: >-
      The T4.2 assertion fails -- c7 was not appended, or its text omits a trigger condition or the
      satisfaction test. The uniqueness assertion fails -- a criterion id is duplicated. The T2.45
      assertion fails -- a criterion was left open, completed_at is unset, or met_by does not
      resolve to a real plan file.
    hermetic: false
    graduation: graduate
    graduation_check_id: "t42-carries-substrate-guard-deferral-criterion"
  - step: 2
    phase: pre-deploy
    action: >-
      Re-execute the evidence the T2.45 closeout rests on rather than trusting the prior session:
      drive the real guard over synthesized plans for its three criteria and print one verdict line.
      Run this BEFORE editing the roadmap.
    command: >-
      bin/venv-python -c "from scripts.terraform_apply_guard import evaluate_plan,
      RESOURCE_POLICY_TYPES as T;
      rc=lambda t,a,af: {'address':f'{t}.x','type':t,'change':{'actions':a,'before':None,'after':af}};
      c1=len(evaluate_plan({'resource_changes':[rc('aws_lambda_permission',['create'],{'principal':'*','action':'lambda:InvokeFunction','function_name':'agent-platform-x'})]}));
      c2=len(evaluate_plan({'resource_changes':[rc('aws_lambda_permission',['create'],{'principal':'events.amazonaws.com','action':'lambda:InvokeFunction','function_name':'agent-platform-x'})]}));
      c3=len({f['type'] for f in evaluate_plan({'resource_changes':[rc(t,['update'],{'policy':'{}'}) for t in T]})});
      print('c1_blocked=%s c2_passes=%s c3_types_blocked=%d' % (c1>0, c2==0, c3))"
    expected: >-
      Exactly "c1_blocked=True c2_passes=True c3_types_blocked=6". Verified to print that on this
      tree. If it does not print it now, the closeout is unfounded.
    fix_if: >-
      Any value differs -- T2.45's criteria do NOT all hold on the current tree, so the closeout is
      unfounded. STOP, do not flip the item, and report the divergence.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      It cannot clear the VF-06 differential admission gate, which materializes a candidate row's
      check_spec in a git worktree and requires it to FAIL on origin/main. This command asserts an
      invariant of work that SHIPPED on 2026-07-21 and is unchanged by this plan, so it passes on
      origin/main by construction and the differential is empty. That is a property of the
      assertion, not a scheduling excuse: re-executing already-landed evidence is the right thing
      for a closeout gate and the wrong thing for a regression guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Fast presubmit tier -- the authoritative PR gate. Covers validate_platform_roadmap (criteria
      integrity checks (i)/(ii)/(iii)), validate_verification_registry,
      validate_graduation_completeness, validate_structural_size_limits and validate_plan_documents.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0, ending with the two lines "=== Validation Summary (scope: pre) ===" then
      "All checks passed." (verified against this tree before the change).
    fix_if: >-
      Check (i) fails -- a met_by does not resolve. Check (ii) fails -- a diff-touched tier_item
      still carries bare-string criteria, meaning the T4.2 conversion was incomplete.
      validate_graduation_completeness fails -- step 1's registry row is missing or its check_id
      does not match graduation_check_id.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Full presubmit tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, ending with "All checks passed."
    fix_if: A full-tier-only check fails; fix the flagged file. Do not narrow scope to make the tier pass.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      T4.2 carries the guard-deferral criterion with both triggers and unique criterion ids, and
      T2.45 is complete with every criterion met and a met_by that resolves to a real plan.
    verification_step: 1
    test_selector: tests/roadmap/test_substrate_guard_deferral.py
    red_green_expectation: >-
      red before (T4.2 has six bare-string criteria and no guard criterion; T2.45 is not_started
      with three open criteria), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      The graduated row for t42-carries-substrate-guard-deferral-criterion exists, matches step 1's
      graduation_check_id, and is written in the compact single-line form.
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      red before (validate_graduation_completeness fails a graduate-disposition step with no
      matching registry row), green after
constraints:
  - >-
    Bookkeeping and registration only. Do NOT create the guard stage, the resource-type frozenset,
    or the contract classification row. Deferring that work is the entire point of this plan.
  - >-
    Decision 136: the T2.45 flip is grounded in step 2's re-executed evidence, and every met_by
    names terraform-guard-resource-policy -- the merged plan that shipped the work -- never this
    plan. If step 2 does not print its expected line, do not flip the item.
  - >-
    CONVERT T4.2's six bare-string criteria to ExitCriterion objects, preserving each text
    byte-for-byte. Decision 136's ratified text forbids a touched tier_item retaining bare-string
    criteria; validate_platform_roadmap check (ii) happens not to catch this case (it matches
    `- id:` values against TIER_ITEM ids, and criterion ids never collide with those), but that is
    a DETECTION GAP, not a rule exemption, and relying on it is precisely what Decision 168's "a
    rule with no evaluator is not a rule" condemns.
  - >-
    APPEND c7; never insert ahead of the existing criteria. Criterion ids are POSITIONAL for bare
    strings (TierItem._normalize_exit_criteria assigns c1..cN by index) and nothing validates
    criterion-id uniqueness -- only tier_item ids are checked. Converting all six to explicit dicts
    removes this fragility for T4.2; the mirror test asserts uniqueness so it cannot silently return.
  - >-
    Do NOT file a recommendation. Two facts rule it out: Decision 73 clause 4 suspends the mandatory
    non-automatable rec discussion, so a filed rec is not self-surfacing; and decision-entry.yaml's
    `work_item` routing row sends a not-now that "needs gate/criterion lifecycle" to ROADMAP work,
    reserving a `declined` rec for a one-off not-now. An `open` rec would duplicate c7's gate in a
    1,107-deep queue. This plan document is the recon carrier and c7 names it.
  - >-
    Decision 86: the deferral is forward intent and belongs on a tier_item. Do not create a prose
    document for it and do not put it in a Decision body. Per the DD-B convention the PR body names
    the routing row applied: `work_item -> tier_item exit criterion`.
  - >-
    Write the registry row in the COMPACT single-line flow-mapping form, not the block form. Cost
    is 1 effective line, measured: PLAN-executor-substrate-evidence-fold landed 8 rows for +8 lines
    on 2026-08-21.
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND (two WARN, one NOTE,
    zero BLOCK) on the first dispatch against this approach. CITE = Decision 77, Decision 92,
    Decision 144, Decision 167, Decision 86, Decision 67, CD.17, Decision 73, Decision 84,
    Decision 75. RELATED = Decision 93, Decision 133, Decision 168, Decision 114, Decision 147,
    Decision 128, Decision 165, Decision 130, Decision 131. Decisions triaged: 126 of 126.
  - "gates: decision-scout=FLAGS_FOUND; plan-critique=REVISE after 1 round(s), all findings adjudicated below"
  - >-
    WHY THIS PLAN EXISTS INSTEAD OF THE GUARD CHANGE. A 14-file plan adding a sixth guard
    classification stage was drafted this session and deliberately abandoned. Measured: of the 30
    resource types declared in terraform/personal, 21 fall through the guard to auto-apply, and the
    12 types the guard change would have covered have NO DECLARATIONS IN terraform/personal -- the
    only root either guard-bearing workflow evaluates (both pin WORKDIR terraform/personal behind a
    terraform/personal/** paths filter). Two DO exist in the retired top-level root and the guard
    never sees them: aws_security_group.github_runner at terraform/ec2_runner.tf:38 and
    aws_sfn_state_machine.data_pipeline at terraform/data_pipeline.tf:457. An earlier draft of this
    plan claimed "zero declarations anywhere in the repo", which was false and would have told a
    future session the security-group surface was unbuilt.
  - >-
    THE DECIDING ARGUMENT, from a Fable consult given facts only. The guard change's entire effect
    is to redirect traffic INTO the tf-gated-apply human approval. rec-2816 (open, Critical) records
    that gate as a weak control: no pending-approval notification, no independent plan verification,
    and "the human often just trusts the agent's relay of the plan." The construction window is the
    highest-iteration period in the project -- 96 merged commits touched terraform/personal in 90
    days, and the DEP-02 probe alone went teardown/reland four times in three days. Routing that
    volume through an unnotified rubber-stamp does not add assurance; it spends the gate's
    credibility before the moment it matters. The executor is frozen (Decision 67), holds no GitHub
    credential (verified: no executor-scoped PR-write workflow, all six scheduled agents
    enabled: false, and the only executor references in terraform/personal are LLM API keys and DDL
    comments), and its substrate is unratified, so the type list itself is speculative before T4.15.
  - >-
    PRECEDENT ASYMMETRY. The guard's only prior classification extension (T2.45, merged 2026-07-21)
    was RETROSPECTIVE: at its parent commit aws_lambda_permission had 8 live declarations,
    aws_lambda_function_url 5, aws_s3_bucket_policy 1. The abandoned plan would have been the first
    prospective one.
  - >-
    T2.48 AND THE GATE THIS CLOSEOUT RELEASES -- the largest consequence of merging this plan, and
    it was unstated in the first draft. T2.48 (Phase-2 allow-list inversion, authority-budget v2) is
    status in_progress with depends_on [T2.45] as its SOLE dependency, c1-c5 met and c6 open. Closing
    T2.45 therefore discharges T2.48's dependency gate. Reverting this plan re-opens it.
  - >-
    T2.48's progress_note CARRIES A FALSE CLAIM that this closeout corrects, and it is the clearest
    live demonstration of this plan's own thesis. Its 2026-07-24 entry reads: "the write-surface
    broadening already shipped in slice E ahead of T2.45, a pre-existing Decision-144-pt7 sequencing
    gap this plan inherits, not causes." Measured commit timestamps refute it: the guard
    classification merged 2026-07-21T22:30:40+01:00 and terraform-iam-allowlist-inversion merged
    2026-07-22T16:18:30+01:00 -- the guard landed 17.8 hours FIRST, so T2.45's intent clause ("MUST
    land no later than T2.48's write-axis broadening") was SATISFIED. The note's author read T2.45's
    stale not_started status and inferred the work had not landed. An untracked intention did not
    merely rot; it propagated a phantom sequencing breach into a downstream item's permanent record.
    The plan-critique gate independently reproduced that false claim from the same note, which is
    further evidence of its reach. The closeout therefore does not erase a breach record -- it
    removes the cause of a false one, and adds a dated retraction.
  - >-
    WHY A CRITERION AND NOT A NOTE, and why it needs a satisfaction test. T2.45 is the counterexample
    that justifies this plan: its work shipped 2026-07-21 yet the item sat not_started with all
    criteria open for over a month. But an exit criterion is only as strong as its satisfiability
    test -- nothing in scripts/ couples a tier_item's status: complete to all its criteria being met,
    so without a deterministic test c7 would be flipped to met on judgement, reproducing the
    discretionary enforcement Decision 163 condemns. Hence c7 carries its own executable satisfaction
    condition rather than a prose obligation.
  - >-
    WHY T4.2 AND NOT T4.18 OR T4.15. T4.2 is the item whose completion activates personas, it already
    carries T4.15 in depends_on, and Decision 67's reversal is tied to CD.17/T4.2 (CD.17 state
    pending). T4.18 is the operator supervision surface, a consumer rather than the activation gate.
    T4.15 produces the type list but completing T4.15 does not gate execution, so a criterion there
    would not block the thing that must be blocked.
  - >-
    THE 21 LIVE FALL-THROUGH TYPES ARE A DIFFERENT SURFACE and are deliberately NOT registered here.
    They are S3, Lambda, SNS, DynamoDB, CloudWatch, Secrets Manager, SSM, Athena and Glue resources
    that have auto-applied since the guard existed -- the general guard-completeness question, not
    the executor-substrate one. Their answer is the default-deny structural fix below, which
    supersedes rather than extends any type list, and which is gated on the same rec-2816
    precondition. Registering them on c7 would conflate two problems with different remedies.
  - >-
    THE STRUCTURAL FIX THAT DISSOLVES ALL OF THIS, recorded here because this plan document is the
    carrier: a default-deny stage for unclassified resource types, converting the guard from an
    enumerated blocklist into an earned-autonomy allowlist (Decision 92 point 5's "autonomy is
    earned and revocable PER CHANGE-CLASS"). It is only safe once rec-2816 makes the gate it routes
    to real, and it would supersede the type-list approach entirely. NOT in scope here.
  - >-
    CARVE-OUT worth preserving: a CONTENT-based security-group rule (for example, route any
    0.0.0.0/0 ingress to gated-apply) is a fire-code check that legitimately applies during
    construction, independent of the type-blanket classification this plan defers.
  - >-
    RECON FOR THE FUTURE SESSION, so it is never re-derived. The defect: evaluate_plan is one loop of
    five continue-terminated stages with NO default case, and its docstring states an empty finding
    list means safe to auto-apply. Candidate types, to be re-derived from whatever T4.15 selects:
    aws_sfn_state_machine, aws_sfn_alias, aws_ecs_task_definition, aws_ecs_service, aws_ecs_cluster,
    aws_ecr_repository, the four security-group family types (aws_security_group,
    aws_security_group_rule, aws_vpc_security_group_ingress_rule, aws_vpc_security_group_egress_rule
    -- the rule types are SEPARATE resources, so guarding only aws_security_group leaves the modern
    idiom falling through), plus aws_ecr_repository_policy and aws_ecr_registry_policy for the
    existing resource-policy stage. Type literals cannot be verified against the provider schema from
    CC-web: terraform is not on PATH, there is no plugin cache, and the s3 backend blocks
    `terraform providers` (Decision 119). They target hashicorp/aws 5.100.0 per
    terraform/personal/.terraform.lock.hcl.
  - >-
    THE FOUR MECHANICAL CONSTRAINTS the future session will hit, all measured this session.
    (1) tests/test_terraform_apply_guard.py is at EXACTLY 500 of 500 effective SLOC and
    validate_sloc_limits is pre=True, so it blocks the PR; Decision 128 forces decomposition and
    Decision 165 admits no raise because no Decision authorises one. (2) Decomposing it requires
    registering scripts/terraform_apply_guard.py in scripts/test_coverage_checker.py's
    _CONCERN_SPLIT_TEST_PACKAGES, or the per-file 100% coverage floor becomes unsatisfiable.
    (3) docs/contracts/environment-taxonomy.yaml is contract class D with amendment_log: [], so
    check_amendment_log_for_class_d (pre=True) fails any parsed-content change lacking a new entry;
    row keys must stay domain terms like criteria / guard_verdict, never `description` or `type`,
    which are Class A descriptor keys that trip detect_smuggled_shape. (4) The guard_classification
    section has NO evaluator -- nothing in scripts/ reads it, and validate_environment_taxonomy lints
    only two-axis vocabulary on changed docs while explicitly allowlisting that file -- so per
    Decision 168 any row added there is unenforced unless it carries a machine-readable roster with a
    parity test against the code.
  - >-
    LAMBDA ASSESSMENT, adjudicated not skipped: docs/ROADMAP-PLATFORM.yaml is an `assets:` entry of
    src/lambdas/data-pipeline/manifest.yaml (status active), so compute_affected_artifacts() flags
    this plan. No deploy step is owed. This is the known over-inclusion owned by open rec-2910, and
    scripts/checks/roadmap/validate_tier_floor.py::_lambda_code_files deliberately does NOT use
    compute_affected_artifacts for exactly this reason, naming this file in its docstring. All six
    scheduled agents are enabled: false.
  - >-
    ADJACENT, not bundled: rec-2817 (open, High) targets the guard for a different change -- carving
    planner-role convergence-conditioned inline-policy edits out of the in-budget auto-apply set.
    rec-3231 (open, Medium) is the registry.yaml concurrent-append conflict, addressed by a separate
    commissioned refactor. rec-2910 is the Lambda asset over-inclusion above.
  - >-
    Branch cut from origin/main at 4b5808d; preflight reported main 0 behind / 0 ahead, creds ok,
    and ci_rca empty (no HARD BLOCK). open_recs 1107 with the non-automatable softcap breached at
    960 -- planning context only per Decision 73. data_quality.last_run reads verdict FAIL with
    0 passed / 0 failed / 0 warned and 0 checks defined, a degenerate empty run rather than a data
    defect; this plan touches no table or write path.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - >-
    Step 2 run BEFORE editing the roadmap -- its output is the evidence the T2.45 closeout rests on,
    and a divergent result forbids the flip
  - >-
    Re-measure registry.yaml effective lines before appending the row, and write it in the COMPACT
    single-line form
execution_steps:
  - >-
    Run verification step 2 first and record its output. If it does not print
    "c1_blocked=True c2_passes=True c3_types_blocked=6", STOP: the T2.45 closeout is unfounded.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- convert T4.2's six bare-string exit_criteria to
    {id: cN, text: <verbatim>, status: open} objects, preserving each string byte-for-byte.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- APPEND T4.2 criterion c7 (status open) stating that deterministic
    guard classification of the executor's compute substrate must be live before any persona can
    execute; carrying the satisfaction test (for every resource type declared by the ratified
    substrate's terraform module the guard blocks a non-inert change and passes an inert one,
    asserted by a registered check whose blocked-type count equals the module's declared-type
    count); naming both triggers (T4.15 substrate ratification; rec-2816 remediation); and naming
    docs/plans/PLAN-executor-substrate-guard-deferral.yaml as the recon carrier. Append a dated
    progress_note line to T4.2 recording the addition, following its existing 2026-07-03 precedent.
  - >-
    docs/ROADMAP-PLATFORM.yaml -- flip T2.45 to status complete with completed_at, a progress_note
    citing step 2's output and the merged plan, and set its three criteria to status met with
    met_by "terraform-guard-resource-policy".
  - >-
    docs/ROADMAP-PLATFORM.yaml -- append a dated correction line to T2.48's progress_note retracting
    the "already shipped in slice E ahead of T2.45" claim, citing the two commit timestamps, and
    noting that closing T2.45 discharges T2.48's sole dependency.
  - >-
    tests/roadmap/test_substrate_guard_deferral.py -- parse the real roadmap and assert: T4.2 has a
    criterion whose text names the guard prerequisite, both trigger conditions and the satisfaction
    test, with status in {open, met} and a met_by resolving to a real plan file when met; T4.2's
    criterion ids are unique; T2.45 is complete with completed_at set and all criteria met with a
    resolving met_by. tests/roadmap/__init__.py already exists -- do not add one.
  - >-
    config/agent/verification_registry/registry.yaml -- append ONE compact single-line flow-mapping
    row for check_id t42-carries-substrate-guard-deferral-criterion (primitive_slot test_selector,
    guard_target docs/ROADMAP-PLATFORM.yaml, plan_slug executor-substrate-guard-deferral), admitted
    via scripts.verification_graduation.run_differential.
  - >-
    Execute the Verification Plan -- run each step; loop until pass; on unrecoverable failure stop
    and RCA (Decision 55).
  - 'Report: what was registered, step 2''s evidence line, and the T2.48 gate release.'
fallback_reevaluation:
  reevaluated_on: "2026-08-24"
  substrate_status: >-
    CD.27's layer-2 persona compute substrate is NOT selected. The incumbent is durable_functions
    and T4.15 -- the comparative spike that is the resolving instrument (ESB-04) -- has not run.
    No live Decision names any container or Step Functions substrate for persona execution.
  verdict: continue_on_current_substrate
  basis: >-
    This plan selects no substrate, builds no persona and creates no guard classification. It
    registers a PREREQUISITE that is itself gated on T4.15 ratifying the substrate, so the incumbent
    stands unchanged and nothing here triggers the fallback or lapses its obligation. The plan names
    T4.2 only because T4.2 is the activation gate the new criterion attaches to; the deliberate
    consequence of the criterion is that persona execution cannot complete until the guard
    classification for whatever substrate T4.15 selects is live and passing its satisfaction test.
rollback: >-
  Single-commit revert restores T4.2's six bare-string criteria, T2.45's not_started status and
  T2.48's uncorrected progress_note, and removes the test and the registry row. NOTE the
  consequence: reverting re-opens T2.48's dependency gate, since T2.45 is its sole depends_on. No
  infrastructure, state, migration or ops-store write is touched.
