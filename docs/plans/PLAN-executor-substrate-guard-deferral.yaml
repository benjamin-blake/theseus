fallback_reevaluation:
  reevaluated_on: "2026-08-24"
  substrate_status: >-
    CD.27's layer-2 persona compute substrate is NOT selected. CD.27 is state pending, so its
    maturity clock has not started; the incumbent is durable_functions and T4.15 -- the comparative
    spike that is the resolving instrument (ESB-04) -- has not run. No live Decision names any
    container or Step Functions substrate for persona execution.
  verdict: continue_on_current_substrate
  basis: >-
    This plan selects no substrate, builds no persona and creates no guard classification. It
    registers a PREREQUISITE itself gated on T4.15 ratifying the substrate, so the incumbent stands
    unchanged and nothing here triggers the fallback or lapses its obligation -- fallback_triggered
    and obligation_lapsed would each assert a fact not in evidence. The plan names T4.2 because
    T4.2 is the activation gate the new criterion attaches to; the deliberate consequence is that
    persona execution cannot complete until guard classification for whatever substrate T4.15
    selects is live and its named registry check passes.
rollback: >-
  Single-commit revert restores T4.2's six bare-string criteria, the five original pin assertions,
  the validate_fallback_reevaluation docstring, T2.45's not_started status and T2.48's uncorrected
  progress_note, and removes the mirror test and the registry row. NOTE the consequence: reverting
  re-opens T2.48's dependency gate, since T2.45 is its sole depends_on. No infrastructure, state,
  migration or ops-store write is touched.
