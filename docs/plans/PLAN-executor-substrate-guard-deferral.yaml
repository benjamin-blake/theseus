schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "executor-substrate-guard-deferral"
intent: >-
  Register, as a structurally enforced roadmap dependency rather than a remembered intention, that
  the deterministic apply guard must classify the executor's compute-substrate resource types before
  any persona can execute -- converting T4.2 to ledger form so the criterion can carry status and
  attribution, and closing out T2.45, whose shipped work has sat unmarked for a month and has
  already propagated a false sequencing claim into a downstream item's permanent record.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-executor-substrate-guard-deferral.yaml
phase: >-
  Platform tier_item T4.2 (agent-persona nodes; the item whose completion activates personas and to
  which Decision 67's reversal is tied via CD.17). Also the T4.x ledger conversion that
  scripts/checks/roadmap/validate_fallback_reevaluation.py's docstring anticipates, and discharges
  T2.48's sole dependency by closing T2.45. Builds no guard stage and selects no substrate.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Convert T4.2's six bare-string exit criteria to ExitCriterion objects with text preserved
      byte-for-byte; append criterion c7 carrying the guard-classification prerequisite, the
      check_id of its future evaluator, and both triggers; add a dated T4.2 progress_note line.
      Flip T2.45 to complete (compacting its terminal fields per Decision 147 clause 4) with
      per-criterion met/met_by. Add ONE dated retraction line to T2.48's progress_note.
  - file: tests/roadmap/test_substrate_guard_deferral.py
    action: Create
    purpose: >-
      The enforcement this plan turns on. Reads RAW YAML (never the Pydantic loader, whose
      _normalize_exit_criteria would launder bare strings into objects and make the shape assertion
      vacuous) and asserts: T4.2's criteria are all mappings; c7 exists, names both triggers and its
      evaluator check_id; criterion ids are unique; T4.2 status complete implies c7 met; c7 met
      implies a registry row with that check_id exists; T2.45 is complete with all criteria met.
  - file: config/agent/verification_registry/registry.yaml
    action: Modify
    purpose: >-
      One COMPACT single-line flow-mapping row graduating the mirror test, so the registration
      survives deletion of the test file.
  - file: tests/esb_text_fix/test_resume_property_vocabulary.py
    action: Modify
    purpose: >-
      Repoint four T4.2 criteria readers onto the ledger form: the positional reads at lines 55, 75
      and 93 take crit["text"], and the isinstance-str guard at 102 becomes a mapping-with-non-empty-
      text guard, preserving its anti-corruption intent (its message names a colon-hazard, i.e. an
      ACCIDENTAL re-parse, not a deliberate conversion).
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Modify
    purpose: >-
      Repoint the second isinstance-str pin at line 211 ("T4.2 exit_criteria must stay bare
      strings") onto the ledger form, same intent-preserving rewrite.
  - file: scripts/checks/roadmap/validate_fallback_reevaluation.py
    action: Modify
    purpose: >-
      Docstring correction only. Its PHASE-LEG INSTANTIABILITY paragraph asserts T4.2's criteria are
      bare and that "two live guards pin those criteria bare" -- both false after this plan. It
      already anticipates the fix ("until a T4.x plan converts to ledger form"); this is that plan.
bundled_recommendations: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    T4.2's six existing exit criteria are ExitCriterion objects whose text is byte-identical to the
    bare strings they replace, proven by VP step 3 diffing against origin/main rather than asserted.
    c5 is the CD.17 reversal precondition verbatim and CD.17's rule keys on T4.2's status, so a
    silent reword there would corrupt a live gate.
  - >-
    T4.2 carries a NEW criterion c7, status open, stating that deterministic guard classification of
    the executor's compute substrate must be live before any persona can execute; naming its future
    evaluator by check_id (executor-substrate-guard-classification-complete); naming both triggers
    (the substrate ratified by T4.15; rec-2816's tf-gated-apply approval weakness remediated); and
    naming docs/plans/PLAN-executor-substrate-guard-deferral.yaml as the recon carrier.
  - >-
    The criterion is ENFORCED, not merely described. The mirror test asserts both couplings:
    T4.2.status == complete implies c7.status == met, and c7.status == met implies a
    verification-registry row with c7's named check_id exists. Without these a future session could
    flip c7 to met, or complete T4.2 with c7 open, and every gate would stay green -- nothing in
    scripts/ couples a tier_item's status to its criteria (verified: only four modules read
    exit_criteria and none does).
  - >-
    T4.2's criterion ids are unique after the edit. Nothing validates criterion-id uniqueness --
    only tier_item ids -- and once all seven are explicit dicts positional assignment stops, so the
    residual hazard is a future bare string inserted at index 0 taking c1.
  - >-
    The four T4.2 criteria readers in tests/esb_text_fix/test_resume_property_vocabulary.py (lines
    55, 75, 93, 102) and the one in tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    (line 211) read the ledger form and still assert their original properties. Both files are green
    before and after; measured baseline 12 passed.
  - >-
    T2.45 reads status complete with completed_at, a compacted progress_note, and all three criteria
    status met with met_by "terraform-guard-resource-policy", which resolves to a real plan file and
    so satisfies validate_platform_roadmap check (i).
  - >-
    The T2.45 closeout is grounded in re-executed evidence, not inference (Decision 136): VP step 2
    drives the real guard and must print its exact expected line before the flip is permitted.
  - >-
    T2.48's progress_note carries ONE dated retraction line (Decision 110: the roadmap is the
    structured-data exemplar, so no narrative argument goes in it) naming the two commit shas and
    the corrected verdict. Measured: 78e4d10 merged 2026-07-21T22:30:40+01:00 and 2281467 merged
    2026-07-22T16:18:30+01:00, so the guard landed 17.8 hours FIRST and T2.45's sequencing clause
    was SATISFIED.
  - >-
    scripts/checks/roadmap/validate_fallback_reevaluation.py's docstring no longer claims T4.2's
    criteria are bare or that two live guards pin them so.
  - >-
    config/agent/verification_registry/registry.yaml carries one COMPACT single-line row with all
    required fields (check_id, primitive_slot, guard_target, plan_slug, graduated_at) plus
    graduated_by and check_spec.node_id, and the file stays within its 6,000 effective-line budget.
  - >-
    No guard stage, resource-type frozenset, or contract classification row is created.
    scripts/terraform_apply_guard.py and docs/contracts/environment-taxonomy.yaml are untouched, so
    the CODEOWNERS protected-path review does not fire.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the mirror test. It reads raw YAML and asserts the ledger shape, c7's content and named
      evaluator, criterion-id uniqueness, both status couplings, and T2.45's closeout.
    command: bin/venv-python -m pytest tests/roadmap/test_substrate_guard_deferral.py -q
    expected: Exit 0, no failures and no collection errors.
    fix_if: >-
      The shape assertion fails -- the conversion is incomplete, or the test is reading through the
      Pydantic loader (which normalizes bare strings and makes the assertion vacuous); read raw
      YAML. A coupling assertion fails -- c7's status and T4.2's status are inconsistent, or the
      registry row named by c7 is absent.
    hermetic: false
    graduation: graduate
    graduation_check_id: "t42-carries-substrate-guard-deferral-criterion"
  - step: 2
    phase: pre-deploy
    action: >-
      Re-execute the evidence the T2.45 closeout rests on. Run this BEFORE editing the roadmap.
    command: >-
      bin/venv-python -c "from scripts.terraform_apply_guard import evaluate_plan,
      RESOURCE_POLICY_TYPES as T;
      rc=lambda t,a,af: {'address':f'{t}.x','type':t,'change':{'actions':a,'before':None,'after':af}};
      c1=len(evaluate_plan({'resource_changes':[rc('aws_lambda_permission',['create'],{'principal':'*','action':'lambda:InvokeFunction','function_name':'agent-platform-x'})]}));
      c2=len(evaluate_plan({'resource_changes':[rc('aws_lambda_permission',['create'],{'principal':'events.amazonaws.com','action':'lambda:InvokeFunction','function_name':'agent-platform-x'})]}));
      c3=len({f['type'] for f in evaluate_plan({'resource_changes':[rc(t,['update'],{'policy':'{}'}) for t in T]})});
      print('c1_blocked=%s c2_passes=%s c3_types_blocked=%d' % (c1>0, c2==0, c3))"
    expected: >-
      Exactly "c1_blocked=True c2_passes=True c3_types_blocked=6". Verified to print that on this
      tree. If it does not print it now, the closeout is unfounded.
    fix_if: >-
      Any value differs -- T2.45's criteria do NOT all hold, so the closeout is unfounded. STOP, do
      not flip the item, and report the divergence.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Structurally cannot clear the VF-06 differential admission gate. run_differential materializes
      the candidate check in an origin/main worktree and requires it to FAIL there; this command
      asserts an invariant of work merged 2026-07-21 and untouched by this plan, so it passes on
      both legs and is rejected as tautological. Correct for a closeout gate, impossible as a
      regression guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Prove the six converted criteria texts are byte-identical to the bare strings they replace, by
      diffing this tree's ledger against origin/main's bare list. This is the evaluator for AC1,
      which nothing else checks.
    command: >-
      bin/venv-python -c "import subprocess, yaml;
      base=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True).stdout);
      head=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      g=lambda d: next(i for i in d['tier_items'] if i['id']=='T4.2')['exit_criteria'];
      old=[c for c in g(base) if isinstance(c,str)];
      new=[c['text'] for c in g(head) if isinstance(c,dict)][:len(old)];
      print('preserved=%s old=%d new=%d' % (old==new, len(old), len(new)))"
    expected: >-
      Exactly "preserved=True old=6 new=6". Verified non-vacuous: on the pre-change tree it prints
      "preserved=False old=6 new=0".
    fix_if: >-
      preserved=False -- a criterion text was reworded, re-wrapped or lost during conversion.
      Restore it byte-for-byte from origin/main. c5 especially: CD.17's reversal rule keys on T4.2,
      and c5 is that precondition verbatim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time migration property, not a durable invariant. Once the conversion has landed the
      comparison against origin/main becomes self-comparison and the check goes permanently
      tautological, which is exactly what VF-06 rejects. It is the right gate for this diff and the
      wrong standing guard.
  - step: 4
    phase: pre-deploy
    action: >-
      Run the two repointed pin files to prove the ledger conversion did not break the properties
      they assert -- four readers in the esb_text_fix module and one in the tier-model mirror.
    command: >-
      bin/venv-python -m pytest tests/esb_text_fix/test_resume_property_vocabulary.py
      tests/provider_agnostic_tier_model/test_role_based_tier_model.py -q
    expected: >-
      Exit 0. Measured baseline before the change: 12 passed. The count must not fall; a repointed
      assertion that silently stops asserting is the failure mode here.
    fix_if: >-
      An AttributeError on .lower() -- a positional read still expects a string. A P1/P2/P3
      membership failure -- a substring test degraded into a dict-key test. An isinstance failure --
      the guard was not repointed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Both files are already executed by the standing full-suite pytest run in the full tier, and
      step 1's graduated row covers the new invariant this plan introduces. A row duplicating two
      pre-existing modules' selectors would add no coverage.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast presubmit tier -- the authoritative PR gate. Covers validate_platform_roadmap,
      validate_verification_registry, validate_graduation_completeness,
      validate_fallback_reevaluation, validate_structural_size_limits and validate_plan_documents.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0, ending with the two lines "=== Validation Summary (scope: pre) ===" then
      "All checks passed." (verified against this tree before the change).
    fix_if: >-
      Check (i) fails -- a met_by does not resolve. validate_graduation_completeness fails -- step
      1's registry row is missing or its check_id does not match graduation_check_id.
      validate_fallback_reevaluation fails -- the fallback_reevaluation block was dropped. Note
      check (ii) will NOT catch an incomplete conversion: its touched_ids regex matches only
      `- id:` lines on +/- diff rows and compares them to TIER_ITEM ids, so criterion ids never
      trigger it. Step 1 is the only thing that catches that.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Full presubmit tier before handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, ending with "All checks passed."
    fix_if: A full-tier-only check fails; fix the flagged file. Do not narrow scope to make the tier pass.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      T4.2's criteria are in ledger form with texts preserved; c7 exists naming both triggers and
      its evaluator check_id; criterion ids are unique; T4.2 status and c7 status are coupled in
      both directions; T2.45 is complete with every criterion met and a resolving met_by.
    verification_step: 1
    test_selector: tests/roadmap/test_substrate_guard_deferral.py
    red_green_expectation: >-
      red before (T4.2 has six bare-string criteria and no c7; T2.45 is not_started with three open
      criteria), green after
  - source: config/agent/verification_registry/registry.yaml
    behavior: >-
      The graduated row for t42-carries-substrate-guard-deferral-criterion exists, matches step 1's
      graduation_check_id, and carries every required field plus check_spec.node_id.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: >-
      red before (validate_graduation_completeness fails a graduate-disposition step with no
      matching registry row), green after
  - source: scripts/checks/roadmap/validate_fallback_reevaluation.py
    behavior: >-
      The module's check behaviour is unchanged; only its docstring's factual claims about T4.2's
      criteria shape are corrected.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Docstring-only edit with no behavioural surface. The module's own check is exercised by step
      5, which must report "gated (phase names ['T4.2']), fallback_reevaluation present." A test
      asserting docstring prose would pin wording rather than behaviour, and the claim it corrects
      is verified by step 1 and step 3 instead.
constraints:
  - >-
    Bookkeeping, registration and the ledger conversion only. Do NOT create the guard stage, the
    resource-type frozenset, or the contract classification row. Deferring that work is the point.
  - >-
    THE CONVERSION IS NOT A FREE EDIT -- this is the finding that broke two earlier drafts of this
    plan. Putting ANY mapping into T4.2's exit_criteria (converting all six, or merely appending c7)
    breaks two isinstance-str guards and three positional string reads. All five sites are in scope.
    Do not attempt the append-a-dict-without-converting shortcut: it breaks the same guards while
    forfeiting the ledger form c7 needs to carry status and met_by.
  - >-
    Preserve each converted text BYTE-FOR-BYTE (step 3 proves it). c5 is the CD.17 reversal
    precondition verbatim and CD.17's rule keys on T4.2's status.
  - >-
    The repointed guards must keep their original intent. tests/esb_text_fix line 102's message
    names a colon-hazard -- an ACCIDENTAL YAML re-parse -- so it becomes "each criterion is a
    mapping carrying a non-empty string text", not a deletion. Deleting an anti-corruption guard
    because it is inconvenient is the workaround anti-pattern (Decision 55).
  - >-
    Decision 136: the T2.45 flip is grounded in step 2's re-executed evidence, and every met_by
    names terraform-guard-resource-policy -- the merged plan that shipped the work -- never this
    plan. If step 2 does not print its expected line, do not flip the item.
  - >-
    APPEND c7; never insert. Once all seven are explicit dicts positional assignment stops, but a
    future bare string inserted at index 0 would take c1 and collide. The mirror test asserts
    uniqueness so this cannot silently return.
  - >-
    Do NOT file a recommendation. decision-entry.yaml's `work_item` routing row sends a not-now that
    "needs gate/criterion lifecycle" to ROADMAP work and reserves a `declined` rec for a one-off
    not-now, so an open rec would duplicate c7's gate in a 1,107-deep queue. (Decision 73 clause 4
    suspends the mandatory DISCUSSION of the non-automatable count; it does not make recs invisible
    -- an earlier draft over-claimed that. The routing row is the actual ground.)
  - >-
    Decision 110: docs/ROADMAP-PLATFORM.yaml is the agent-first structured-data exemplar. The T2.48
    retraction is ONE dated line naming two shas and the corrected verdict; c7's text names its
    evaluator check_id and states the assertion in one sentence. The derivation stays in this plan.
  - >-
    Decision 147 clause 4: a terminal tier_item is stored compact. Compact T2.45's narrative fields
    as part of the flip rather than accreting; the roadmap measured 9,293 of its 10,000-line ceiling.
  - >-
    Write the registry row in the COMPACT single-line flow-mapping form with ALL of check_id,
    primitive_slot, guard_target, plan_slug, graduated_at, graduated_by and check_spec.node_id --
    the first five are schema-required and run_differential needs node_id. Cost is 1 effective line
    (measured: PLAN-executor-substrate-evidence-fold landed 8 rows for +8 lines on 2026-08-21).
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Decision-scout verdict + CITE list (verbatim decision ids): FLAGS_FOUND on both dispatches
    (round 2: one WARN upheld, one WARN rejected on evidence, two NOTE adopted). CITE = Decision
    136, Decision 167, Decision 73, Decision 144, Decision 147, Decision 166, Decision 165,
    Decision 132, Decision 163, Decision 105, Decision 110, Decision 77, Decision 86, Decision 67,
    CD.17, Decision 84, Decision 92, Decision 75. RELATED = Decision 93, Decision 103, Decision
    100, Decision 85, Decision 87, Decision 90, Decision 131, Decision 168, Decision 114.
    Decisions triaged: 126 of 126 on both dispatches.
  - "gates: decision-scout=FLAGS_FOUND (2 rounds); plan-critique=REVISE (2 rounds), all findings adjudicated below"
  - >-
    THE ROUND-2 BLOCKING FINDING, which both gates found independently and two earlier drafts of
    this plan missed. Putting a mapping into T4.2's exit_criteria breaks five live assertion sites:
    tests/esb_text_fix/test_resume_property_vocabulary.py:55 and :75 (positional reads),
    :93 (`t42["exit_criteria"][0].lower()` -> AttributeError), :102
    (`test_t42_criteria_remain_bare_strings`, an explicit isinstance guard), and
    tests/provider_agnostic_tier_model/test_role_based_tier_model.py:211 ("T4.2 exit_criteria must
    stay bare strings"). All read raw YAML against the real roadmap, so the Pydantic normalizer
    never launders them. Measured green baseline today: 12 passed across the two files. The
    conversion is sanctioned rather than forbidden --
    scripts/checks/roadmap/validate_fallback_reevaluation.py's docstring says the phase leg is what
    makes its carrier reachable "until a T4.x plan converts to ledger form" -- but it is not free,
    and this plan is that T4.x plan.
  - >-
    A ROUND-2 SCOUT WARN REJECTED ON EVIDENCE. The scout held that the conversion also breaks a
    graduated registry row at registry.yaml:2979 doing `c1=t42['exit_criteria'][0]` and that
    repairing it would breach the 2,315-character long-line budget. Checked: no registry row
    positionally reads T4.2's exit_criteria at all; line 2979 is a CD.27 resume_properties
    assertion; and the row named (t4x-persona-contracts-mechanism-word-free) begins at line 2968.
    The long-line budget is a per-line CHARACTER cap and compact precedent rows run ~330
    characters, so the new row does not approach it.
  - >-
    WHY THIS PLAN EXISTS INSTEAD OF THE GUARD CHANGE. A 14-file plan adding a sixth guard
    classification stage was drafted this session and deliberately abandoned. Measured: of the 30
    resource types declared in terraform/personal, 21 fall through the guard to auto-apply, and the
    12 types the guard change would have covered have NO DECLARATIONS IN terraform/personal -- the
    only root either guard-bearing workflow evaluates (both pin WORKDIR terraform/personal behind a
    terraform/personal/** paths filter). Exactly two exist in the retired top-level root, which the
    guard never sees: aws_security_group.github_runner at terraform/ec2_runner.tf:38 and
    aws_sfn_state_machine.data_pipeline at terraform/data_pipeline.tf:457. An earlier draft claimed
    "zero declarations anywhere in the repo", which was false.
  - >-
    THE DECIDING ARGUMENT, from a Fable consult given facts only. The guard change's entire effect
    is to redirect traffic INTO the tf-gated-apply human approval. rec-2816 (open, Critical) records
    that gate as a weak control: no pending-approval notification, no independent plan verification,
    and "the human often just trusts the agent's relay of the plan." The construction window is the
    highest-iteration period in the project -- ~98 merged commits touched terraform/personal in 90
    days, and the DEP-02 probe alone went teardown/reland four times in three days. Routing that
    volume through an unnotified rubber-stamp does not add assurance; it spends the gate's
    credibility before the moment it matters. The executor is frozen (Decision 67), holds no GitHub
    credential (verified: no executor-scoped PR-write workflow, all six scheduled agents
    enabled: false, and the only executor references in terraform/personal are LLM API keys and DDL
    comments), and its substrate is unratified, so the type list itself is speculative before T4.15.
  - >-
    PRECEDENT ASYMMETRY. The guard's only prior classification extension (T2.45, merged 2026-07-21)
    was RETROSPECTIVE: at its parent commit aws_lambda_permission had 8 live declarations,
    aws_lambda_function_url 5, aws_s3_bucket_policy 1. The abandoned plan would have been the first
    prospective one.
  - >-
    T2.48 AND THE GATE THIS CLOSEOUT RELEASES. T2.48 (Phase-2 allow-list inversion, authority-budget
    v2) is status in_progress with depends_on [T2.45] as its SOLE dependency, c1-c5 met and c6 open.
    Closing T2.45 discharges that dependency gate; reverting this plan re-opens it. Nothing cascades
    -- T2.48 stays in_progress on its own open c6 (the recurring Decision-92 ratchet review) -- so
    this is declared, not gated. closes_criteria is deliberately EMPTY: c6 is not work this plan
    schedules, and T2.45's criteria carry met_by attributing them to the merged plan that did the
    work rather than to this one.
  - >-
    T2.48's progress_note CARRIES A FALSE CLAIM that this closeout corrects, and it is the clearest
    live demonstration of this plan's own thesis. Its 2026-07-24 entry reads: "the write-surface
    broadening already shipped in slice E ahead of T2.45, a pre-existing Decision-144-pt7 sequencing
    gap this plan inherits, not causes." Measured commit timestamps refute it: 78e4d10 (the T2.45
    guard classification) merged 2026-07-21T22:30:40+01:00 and 2281467 (slice E,
    terraform-iam-allowlist-inversion) merged 2026-07-22T16:18:30+01:00 -- the guard landed 17.8
    hours FIRST, so T2.45's intent clause ("MUST land no later than T2.48's write-axis broadening",
    the Decision 144 point 7 sequencing rule) was SATISFIED. The note's author read T2.45's stale
    not_started status and inferred the work had not landed. An untracked intention did not merely
    rot; it propagated a phantom sequencing breach into a downstream item's permanent record, and a
    fresh-context reviewer then reproduced that false claim from it. Both round-2 gates independently
    verified the timestamps and upheld the correction.
  - >-
    WHY THE CRITERION NEEDS BOTH COUPLINGS. Nothing in scripts/ ties a tier_item's status to its
    criteria: only four modules read exit_criteria (platform_roadmap_state, platform_roadmap_models,
    validate_platform_roadmap, validate_fallback_reevaluation), TierItem.status is a bare Literal,
    and the only criterion-side invariants are "met/rehomed requires met_by" and check (i)'s met_by
    resolution. Meanwhile CD.17's reversal rule keys on T4.2.status == complete alone. So a criterion
    carrying only prose would be flipped on judgement -- Decision 163 clause 1's "universal in name,
    discretionary in enforcement", one level up from the rot this plan fixes. An earlier draft
    claimed c7 "carries its own executable satisfaction condition"; that was false, because a
    described test is not a test. The two mirror-test couplings are the actual mechanism.
  - >-
    WHY T4.2 AND NOT T4.18 OR T4.15. T4.2 is the item whose completion activates personas, it
    already carries T4.15 in depends_on, and Decision 67's reversal is tied to CD.17/T4.2 (CD.17
    state pending, so its maturity clock has not started and no substrate is ratified -- which is
    why fallback_reevaluation reads continue_on_current_substrate). T4.18 is the operator
    supervision surface, a consumer. T4.15 is already ledger-form and would have been the
    low-blast-radius home, but it is a comparative SPIKE: blocking its completion on downstream
    guard work would conflate selecting a substrate with implementing against it.
  - >-
    THE LIVE FALL-THROUGH SURFACE IS DIFFERENT WORK and is deliberately not registered on c7. The 21
    types that auto-apply today are S3, Lambda, SNS, DynamoDB, CloudWatch, Secrets Manager, SSM,
    Athena, Glue -- and null_resource, which carries local-exec provisioners at
    terraform/personal/main.tf:297, :354 and :417, i.e. arbitrary command execution on the apply
    runner, auto-applying now. That is the most security-relevant member of the set and an earlier
