schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: vp-replay-deadline-from-shared-budget
intent: >-
  Stop the fast tier's VP replay from stranding implementing agents on a flat 30s per-step cost
  cap that organic test growth crosses by construction: a replayed step's deadline becomes the
  remaining shared aggregate budget (MAX_AGGREGATE_SECONDS, 120s, unchanged), the timed-out step's
  whole process group is killed, and per-step durations plus an advisory warn band make replay-cost
  drift visible in green CI logs before it bites -- while validate_vp_replay's worst-case green
  maximum TIGHTENS from 150s to 120s, so Decision 182's non-test domination widens.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-vp-replay-deadline-from-shared-budget.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is
  skipped). Removes a hardware-dependent cliff: PER_STEP_TIMEOUT_SECONDS=30 binds wherever replay
  runs, and the implementer's own local --pre / full tier are blocking under handoff_policy. Near-miss
  2026-09-26: PLAN-trailer-acceptance-junit-verdict VP step 13 measured 32.8s in the CC-web
  container (over the cap) yet replayed PASS under it on the CI runner (PR #1284, pr-validate job
  108438121195). Bundles rec-3833.
scope:
  - file: scripts/checks/verification/_vp_replay_budget.py
    action: Create
    purpose: >-
      Private sibling (Decision 104 precedent: _vp_replay_classify.py) holding (1) run_bounded(command,
      cwd, timeout) -> BoundedResult, a frozen dataclass with fields returncode (int | None), output
      (combined stdout+stderr), elapsed (float) and timed_out (bool): shell=True, text/utf-8/errors=replace, start_new_session=True, and on
      TimeoutExpired os.killpg(the child's pgid, SIGKILL) then a BOUNDED reap (communicate/wait with
      a short timeout, so a descendant that escaped via setsid while holding the pipe can never
      hang the check with no deadline) -- so an orphaned pytest grandchild cannot keep consuming CI
      CPU inside the non-test half. The same killpg runs on any BaseException raised while waiting
      (KeyboardInterrupt, a harness timeout), because start_new_session removes the child from the
      caller's foreground group and would otherwise orphan it. POSIX-only by design (os.killpg,
      start_new_session): every surface that runs this check is Linux (CC-web, CI); stated in the
      module docstring; and (2) the telemetry
      helpers AND the deadline-kill message builders: a PASS-line duration suffix "in X.Xs (N% of
      <aggregate>s)", one terminal summary line "vp-replay budget: X.Xs of <aggregate>s across N
      step(s); peak <plan>:<step> Y.Ys" -- which
      appends "(over the 25% authoring target)" when the peak step exceeds AUTHORING_MAX_FRACTION x
      aggregate, so that constant has a code consumer and the target surfaces where authors see
      replay cost -- the green-leg and red-before-leg deadline-kill failure texts
      (so validate_vp_replay.py only calls them), and the ADVISORY warn band (never appends to
      failed): WARN when one step > PER_STEP_WARN_FRACTION (0.5) x aggregate or cumulative spend >
      CUMULATIVE_WARN_FRACTION (0.8) x aggregate (the 0.8 band mirrors Decision 182 reversal
      condition (a)). The two fraction constants and AUTHORING_MAX_FRACTION (0.25) are module
      constants whose values docs/contracts/vp-red-before.yaml's replay_bound declares and the mirror
      test derive-and-asserts.
      The aggregate is passed in by the caller, never read from this module, so the existing
      validate_vp_replay.MAX_AGGREGATE_SECONDS patch seam keeps binding. Stdlib only; well under 500
      SLOC. A private sibling rather than Decision 128 clause 1's facade package, deliberately: 18+
      graduated registry rows name scripts/checks/verification/validate_vp_replay.py as guard_target,
      so converting that module to a package would retire a live path from under them -- the same
      ground _vp_replay_classify.py was split on (vp-red-before.yaml amendment_log 2026-09-18,
      Decision 104).
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      (a) _ReplayBudget STAYS defined here (registry row vp-red-before-step-cap-derived-from-cost
      names it as guard_symbol) and gains remaining() = MAX_AGGREGATE_SECONDS - elapsed.
      (b) _replay_step runs the step via _vp_replay_budget.run_bounded with timeout=budget.remaining()
      (called through the module attribute so tests can patch it); the flat PER_STEP_TIMEOUT_SECONDS
      is gone from this module and its re-export list. (c) Deadline kill, green leg: failure text
      contains both TIMEOUT and "aggregate deadline", the step's own run time, and the prior spend
      and prior step count ("step alone exceeds the <N>s aggregate budget" when no prior step ran);
      sets budget.hit. Red-before leg: a deadline kill stays classified unmeasurable (contract's
      subprocess_timeout arm; the four frozen classes unchanged), hard-fails, its text also names
      the aggregate deadline, and it ALSO sets budget.hit so no later graduate step (either leg)
      appends a second exhaustion line. (d) rec-3833: one dispatch appends EXACTLY ONE budget-exhaustion
      failure however many legs observe the exhausted budget (the top-of-loop "not started" message
      and a deadline kill never both appear for the same exhaustion event). (e) Every replayed PASS
      line carries the duration suffix; the terminal summary line and any WARN print once per
      dispatch when at least one step was replayed. The MAX_REPLAYED_STEPS comment (which cites
      "Decision 182 pt 2's 150s green maximum"), the module docstring's "Bounded cost" paragraph, and
      the implement-leg docstring clause "a TimeoutExpired always diverges" (run_bounded now absorbs
      the exception; restate as "a deadline kill always diverges") are restated for the deadline
      model. MUST end at <= 500 SLOC with no
      config/sloc_budgets.yaml registration (Decision 128). The subprocess/time imports and the
      subprocess.run block leave with the runner, and the message builders live in
      _vp_replay_budget.py from the start. If the file STILL overshoots, the ONLY sanctioned overflow
      move is the scripts.validate recursion-refusal helpers (_SHELL_SEGMENT_SPLIT_RE,
      _PYTHON_INTERPRETER_BASENAMES, _SCRIPTS_VALIDATE_* constants, _segment_invokes_scripts_validate,
      _command_invokes_scripts_validate) into _vp_replay_classify.py -- a command-classification
      concern already in scope -- re-imported here so every existing import from this module keeps
      resolving. Never a new file, never a raise.
  - file: scripts/checks/verification/_vp_replay_classify.py
    action: Modify
    purpose: >-
      Delete PER_STEP_TIMEOUT_SECONDS. The four completing self-test fixtures take a new local
      _SELF_TEST_COMPLETING_BOUND_SECONDS = 5.0; the 0.05s sleep fixture and _classify_outcome are
      unchanged. Docstring's import-cycle note about PER_STEP_TIMEOUT_SECONDS is removed (it no
      longer applies). Contingent destination ONLY if validate_vp_replay.py would otherwise exceed
      500 SLOC: receives the recursion-refusal helpers named in that row, relocated verbatim (the
      docstring's relocation note extended to name them); stays well under 500 SLOC either way.
  - file: scripts/checks/deps/selection_budget.py
    action: Modify
    purpose: >-
      Decision 182 reversal condition (b) re-derivation, same edit: REPLAY_ALLOWANCE_SECONDS = 120.0,
      mirroring validate_vp_replay.MAX_AGGREGATE_SECONDS alone (the check's green maximum under the
      deadline model); comment and module docstring updated. NON_TEST_BUDGET_SECONDS stays 240.0,
      TEST_BASE/PER_MODULE/CEILING unchanged (headroom over 120 + 71.766 rises from 18.2s to 48.2s).
  - file: tests/checks/verification/test__vp_replay_budget.py
    action: Create
    purpose: >-
      Decision 131 mirror for the new sibling: run_bounded returns completed output and elapsed for
      a fast command; on timeout returns timed_out with no returncode AND the background grandchild
      (command shape "sleep 30 & echo $! > pid; wait") is DEAD, polled for up to 5s where dead means
      /proc/<pid>/stat reports state Z OR the pid is gone -- never ProcessLookupError alone, which
      measures reaping (plan-critique measured 1.46-1.72s of zombie reap latency in this container);
      the telemetry helpers and both deadline-kill message builders format exactly; the warn band
      fires at > 0.5 x per step and > 0.8 x cumulative and not at or below either; and
      TestContractPins::test_replay_bound_matches_the_contract loads docs/contracts/vp-red-before.yaml
      and asserts replay_bound's per_step_warn_fraction, cumulative_warn_fraction and
      authoring_max_fraction equal the module constants. Every defensive branch in run_bounded (e.g.
      killpg raising ProcessLookupError on an already-exited group) has a test here -- the full-tier
      100% per-file coverage floor measures this file against this mirror alone.
  - file: tests/checks/verification/test__vp_replay_classify.py
    action: Modify
    purpose: >-
      Reference _SELF_TEST_COMPLETING_BOUND_SECONDS instead of the deleted PER_STEP_TIMEOUT_SECONDS, and
      add one test asserting the module no longer defines PER_STEP_TIMEOUT_SECONDS and that the four
      completing fixtures carry the local bound while the sleep fixture keeps
      _SELF_TEST_TIMEOUT_SECONDS.
  - file: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
    action: Modify
    purpose: >-
      TestSharedBudget gains three tests. test_step_deadline_is_the_remaining_aggregate_not_a_flat_cap:
      a resolved plan with hermetic steps "sleep 1.2", "sleep 5", then "true", MAX_AGGREGATE_SECONDS
      patched to 2.0; asserts EXACTLY ONE entry in failed, that it names the aggregate deadline for
      step 2 (so the deadline kill and the next step's top-of-loop exhaustion check never both
      report), and total dispatch wall clock < 4s (red before: step 2 completes under the 30s cap and
      passes at ~6.2s, then the top-of-loop check refuses step 3 with one "budget exceeded" line --
      the test is red on its "aggregate deadline" and < 4s assertions).
      test_budget_exhaustion_reports_exactly_one_failure (rec-3833's acceptance node, name verbatim):
      a resolved plan plus a red-before-eligible plan in one diff with MAX_AGGREGATE_SECONDS patched
      to 0; asserts exactly one failed entry containing "budget exceeded" (red before: two, one per
      leg). test_step_over_half_the_aggregate_warns_without_failing: one "sleep 1.2" step at
      aggregate 2.0; asserts stdout carries the WARN and the duration suffix, the summary line appears
      exactly once (out.count("vp-replay budget:") == 1), and failed is empty.
      The existing test_aggregate_seconds_guard_still_binds stays. File stays under 500 SLOC.
  - file: tests/checks/verification/validate_vp_replay/test_implement_leg.py
    action: Modify
    purpose: >-
      test_timeout_path_reddens patches MAX_AGGREGATE_SECONDS (0.1) instead of the deleted constant
      and additionally asserts "aggregate deadline" in the failure; no other test changes.
  - file: tests/checks/verification/validate_vp_replay/test_red_before_leg.py
    action: Modify
    purpose: >-
      TestUnmeasurable::test_subprocess_timeout patches MAX_AGGREGATE_SECONDS instead of the deleted
      constant. New TestUnmeasurable::test_red_before_deadline_kill_names_the_aggregate_deadline
      (graduate steps "sleep 5" then "exit 1", aggregate 0.3): asserts len(failed) == 1, that the one
      entry carries actual=unmeasurable AND "aggregate deadline", and that no entry contains "budget
      exceeded" (red before: two entries -- step 1 completes under the 30s cap and classifies
      tautological, then the top-of-loop check refuses step 2 with "budget exceeded"). The
      two tests that patch validate_vp_replay.subprocess.run (lines 86, 127) move their seam to
      _vp_replay_budget.run_bounded so they still intercept the step. The line-86 test
      (test_non_graduate_dispositions_not_executed) gains a POSITIVE control: its fixture adds one
      graduate step that is genuinely red on the fixture tree (e.g. "exit 1", classified
      assertion_failed, so failed stays []), and the test asserts that command IS observed at the
      moved seam -- a mis-sited seam cannot let the absence assertions pass vacuously. The line-127
      stub returns a BoundedResult (returncode 2, the rg stderr as output), not a CompletedProcess.
  - file: tests/checks/deps/test_selection_budget.py
    action: Modify
    purpose: >-
      TestSubtractionSetPins' mirror pin becomes REPLAY_ALLOWANCE_SECONDS == vp.MAX_AGGREGATE_SECONDS
      and asserts not hasattr(vp, "PER_STEP_TIMEOUT_SECONDS"); the domination inequality
      NON_TEST_BUDGET_SECONDS > REPLAY_ALLOWANCE_SECONDS + 71.766 is kept verbatim. Touch nothing
      else in the file (PLAN-selection-budget-census-hermetic-test owns TestAllowance and
      TestClassifyBranchOrder there).
  - file: tests/validate/test_budget_split.py
    action: Modify
    purpose: >-
      test_green_replay_at_its_ratified_maximum_does_not_breach: docstring states the new 120s green
      maximum (MAX_AGGREGATE_SECONDS alone); the green fixture's validate_vp_replay phase, its paired
      replay_s assertion and the assertion message's non-test figure are DERIVED from
      sb.REPLAY_ALLOWANCE_SECONDS - 1.0 (119.0 today) rather than restated as literals, so they cannot
      go stale on the next re-derivation. The red 260.0 fixture and the printed-allowance assertion
      stay. Touch nothing else
      (PLAN-selection-budget-census-hermetic-test owns TestBreadthDerivedTestBudget there).
  - file: docs/contracts/vp-red-before.yaml
    action: Modify
    purpose: >-
      Add a replay_bound MAPPING (field_add) with numeric per_step_warn_fraction: 0.5,
      cumulative_warn_fraction: 0.8 and authoring_max_fraction: 0.25 (derive-asserted against
      _vp_replay_budget.py by the mirror's TestContractPins), plus prose keys: deadline (a step's
      deadline is the remaining shared aggregate), kill (process-group kill; failure text carries
      TIMEOUT and "aggregate deadline"; unmeasurable on the red-before leg via the existing
      subprocess_timeout arm), and authoring (author a hermetic pre-deploy step to <= 25% of the
      aggregate and record its measured replay duration in the plan; a step that cannot be narrowed
      below that target records its measured duration and why, and stays hermetic -- the target is
      advisory, the deadline and the warn band are what bind). Names no command kind:
      hermetic_authoring (and its "Steps needing pytest/deploys stay hermetic: false" sentence, the
      rec-3334 / rec-2809 contradiction) is NOT edited by this plan. amendment_log entry required by
      docs/contracts/contract-population.yaml change_detection.amendment_log (validate_contract_drift);
      contract_version 4 -> 5 per this file's own convention (NOT Decision 168 clause 4, which this
      log's 2026-09-18 entry already records as a mis-citation). outcome_classes and
      unmeasurable_arms untouched.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One dated amendment_forms line in the pinned spelling "> **Update (YYYY-MM-DD):**" appended to
      Decision 182 (no new number, and never a mid-line splice of point 2 -- Decision 177): under
      reversal condition (b), validate_vp_replay's replay term is re-derived to MAX_AGGREGATE_SECONDS
      alone (green maximum 120s, was 150s = 120 + one PER_STEP_TIMEOUT_SECONDS 30, now retired);
      working shown -- 120 + 71.766 = 191.766 < 240, headroom 48.2s (was 18.2s) AGAINST THE
      CALIBRATED 71.766s static worst only; on this week's measured static_s (103-125s typical) a
      green replay at 120s would land at 223-245s against 240, so domination does not hold on
      current measurements -- reversal condition (a) is armed separately and owned by rec-4093 (a
      214.9s green non-test half against the 192s band), and NON_TEST_BUDGET_SECONDS is not
      re-checked here. Cites
      this plan's slug. docs/decisions-index.json regenerates under the decisions_index_regeneration
      sanction row.
bundled_recommendations:
  - rec-3833
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A replayed step's subprocess deadline is the remaining MAX_AGGREGATE_SECONDS budget; no flat per-step cap remains in scripts/ (VP steps 1, 7).
  - A step killed at the deadline hard-fails with a message naming the aggregate deadline on both legs (unmeasurable on red-before), and its process group is dead (VP steps 1, 4, 5).
  - One budget-exhaustion event yields exactly one failure line per dispatch, on either leg (rec-3833; VP steps 2 and 5).
  - Replayed PASS lines carry durations, one summary line prints per dispatch, and the 0.5x/0.8x warn band is advisory only (VP steps 3, 4).
  - selection_budget.REPLAY_ALLOWANCE_SECONDS == validate_vp_replay.MAX_AGGREGATE_SECONDS (120 today) and the non-test budget still dominates it (VP step 6); NON_TEST_BUDGET_SECONDS is unedited by this diff (the existing constants pin in test_selection_budget.py still asserts 240.0).
  - A step that runs longer than the retired 30s cap passes when the aggregate allows it -- proven in CI at sub-second cost by the remaining-aggregate deadline (VP step 1) and once locally by running a 31s command through run_bounded with the full aggregate remaining (VP step 9, output recorded).
  - validate_vp_replay.py stays <= 500 SLOC with no budget registration; --pre and full tiers exit 0; rec-3833 closes via the Resolves trailer (VP steps 10-13).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The deadline is the remaining aggregate, not a flat cap -- a second step is killed at the shared deadline.
    command: bin/venv-python -m pytest "tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestSharedBudget::test_step_deadline_is_the_remaining_aggregate_not_a_flat_cap" -q
    expected: One test passes.
    fix_if: Step 2 still completes (a flat cap survives), or the failure text does not name the aggregate deadline.
    hermetic: true
    graduation: graduate
    graduation_check_id: vp-replay-step-deadline-is-remaining-aggregate
    expected_literals:
      - passed
  - step: 2
    phase: pre-deploy
    action: rec-3833 -- one exhaustion event is reported once across both legs.
    command: bin/venv-python -m pytest "tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestSharedBudget::test_budget_exhaustion_reports_exactly_one_failure" -q
    expected: One test passes (rec-3833's acceptance command, verbatim).
    fix_if: Two budget-exceeded entries remain -- the red-before leg must not append a second message once budget.hit is set.
    hermetic: true
    graduation: graduate
    graduation_check_id: vp-replay-budget-exhaustion-reported-once
    expected_literals:
      - passed
  - step: 3
    phase: pre-deploy
    action: The warn band is advisory -- a step above half the aggregate prints a WARN and a duration but fails nothing.
    command: bin/venv-python -m pytest "tests/checks/verification/validate_vp_replay/test_lint_and_budget.py::TestSharedBudget::test_step_over_half_the_aggregate_warns_without_failing" -q
    expected: One test passes.
    fix_if: The WARN appends to failed (it must never gate), or no duration suffix is printed.
    hermetic: true
    graduation: graduate
    graduation_check_id: vp-replay-drift-warn-band-advisory
    expected_literals:
      - passed
  - step: 4
    phase: pre-deploy
    action: The bounded runner kills the whole process group on timeout and the telemetry helpers format exactly.
    command: bin/venv-python -m pytest tests/checks/verification/test__vp_replay_budget.py -q
    expected: All tests pass, including the orphaned-grandchild-is-dead case.
    fix_if: The grandchild pid survives -- start_new_session plus killpg of the child's group is missing.
    hermetic: true
    graduation: graduate
    graduation_check_id: vp-replay-bounded-runner-kills-process-group
    expected_literals:
      - passed
  - step: 5
    phase: pre-deploy
    action: A red-before deadline kill stays unmeasurable and names the aggregate deadline.
    command: bin/venv-python -m pytest "tests/checks/verification/validate_vp_replay/test_red_before_leg.py::TestUnmeasurable::test_red_before_deadline_kill_names_the_aggregate_deadline" -q
    expected: One test passes.
    fix_if: The step classifies tautological (a flat cap let it finish) or the text omits the aggregate deadline.
    hermetic: true
    graduation: graduate
    graduation_check_id: vp-red-before-deadline-kill-unmeasurable
    expected_literals:
      - passed
  - step: 6
    phase: pre-deploy
    action: Decision 182's mirror is re-derived to the aggregate alone and the non-test budget is unchanged.
    command: >-
      bin/venv-python -c "import sys; from scripts.checks.deps import selection_budget as sb; from scripts.checks.verification import validate_vp_replay as vp; ok = sb.REPLAY_ALLOWANCE_SECONDS == vp.MAX_AGGREGATE_SECONDS and not hasattr(vp, 'PER_STEP_TIMEOUT_SECONDS') and sb.NON_TEST_BUDGET_SECONDS > sb.REPLAY_ALLOWANCE_SECONDS + 71.766; print('ALLOWANCE_IS_AGGREGATE' if ok else 'ALLOWANCE_STALE'); sys.exit(0 if ok else 1)"
    expected: Exit 0 printing ALLOWANCE_IS_AGGREGATE. Red before (150 != 120 and the constant still exists).
    fix_if: >-
      ALLOWANCE_STALE -- the mirror still adds a per-step term, or the domination inequality no longer
      holds. The command deliberately pins no NON_TEST_BUDGET_SECONDS literal (plan-critique round 2
      R2): rec-4093 may re-derive that constant, and a literal here would hand its implementer a red
      graduated row to retire; TestAllowance::test_coefficient_and_partition_constants_are_pinned
      already pins 240.0.
    hermetic: true
    graduation: graduate
    graduation_check_id: replay-allowance-equals-aggregate-deadline
  - step: 7
    phase: pre-deploy
    action: Stale-reference sweep -- no Python under scripts/ still names the retired constant.
    command: '! grep -rn "PER_STEP_TIMEOUT_SECONDS" scripts/ --include=*.py'
    expected: Exit 0 with no output. Red before (13 matching lines across three files -- _vp_replay_classify.py 6, validate_vp_replay.py 5, selection_budget.py 2).
    fix_if: A hit -- a docstring, comment or import still names the retired constant; restate it for the deadline model.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A text-absence sweep over a whole directory is a closure proof for this retirement, not a
      behavioural regression guard; the behaviour is graduated by steps 1 and 6 (step 6 asserts the
      attribute is absent from validate_vp_replay).
  - step: 8
    phase: pre-deploy
    action: Whole-surface regression -- every touched test file passes and all touched Python is lint- and format-clean.
    command: >-
      bin/venv-python -m pytest tests/checks/verification/validate_vp_replay tests/checks/verification/test__vp_replay_classify.py tests/checks/verification/test__vp_replay_budget.py tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py -q && bin/venv-python -m ruff check scripts/checks/verification/ scripts/checks/deps/selection_budget.py tests/checks/verification/ tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py && bin/venv-python -m ruff format --check scripts/checks/verification/ scripts/checks/deps/selection_budget.py tests/checks/verification/ tests/checks/deps/test_selection_budget.py tests/validate/test_budget_split.py
    expected: All tests pass, ruff reports no findings, and format --check reports every file already formatted. The pytest half measured 20.5-20.8s at planning (125 tests) before the new sleep-bearing tests; projected ~27-31s after.
    fix_if: A pre-existing test fails -- a seam still patches the deleted constant or validate_vp_replay.subprocess.run.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: A step longer than the retired 30s cap now completes -- run a 31s command through run_bounded with the full aggregate remaining.
    command: >-
      bin/venv-python -c "import sys, pathlib; from scripts.checks.verification import _vp_replay_budget as b; from scripts.checks.verification import validate_vp_replay as vp; r = b.run_bounded('sleep 31 && echo LONG_STEP_DONE', cwd=pathlib.Path.cwd(), timeout=vp.MAX_AGGREGATE_SECONDS); ok = (not r.timed_out) and r.returncode == 0 and 'LONG_STEP_DONE' in r.output; print('LONG_STEP_PASSES' if ok else 'LONG_STEP_KILLED'); sys.exit(0 if ok else 1)"
    expected: Exit 0 printing LONG_STEP_PASSES after ~31s.
    fix_if: LONG_STEP_KILLED -- a flat cap below the aggregate survives somewhere on the path.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Costs 31s of wall clock by design (it must exceed the retired cap), so as a standing registry
      row it would spend a quarter of the aggregate on every future run; step 1 graduates the same
      property at sub-second cost. Run ONCE locally by the implementer and its output recorded in
      the report. Not replayed on the implementation PR (Benjamin, 2026-09-26, on plan-critique
      round 2 R1): the non-test half on this week's implement PRs is already 103-206s static_s, so
      31s of pure sleep would push this PR toward Decision 182's unwaivable 240s with no escape --
      the stranding mode this plan exists to remove. The attribute names r.timed_out / r.returncode
      / r.output are BoundedResult's fields.
  - step: 10
    phase: pre-deploy
    action: validate_vp_replay.py stays within the unregistered-file SLOC limit.
    command: >-
      bin/venv-python -c "import sys, pathlib; lines = pathlib.Path('scripts/checks/verification/validate_vp_replay.py').read_text(encoding='utf-8').splitlines(); sloc = len([l for l in lines if l.strip() and not l.strip().startswith('#')]); print('SLOC', sloc); sys.exit(0 if sloc <= 500 else 1)"
    expected: Exit 0; prints SLOC at or below 500 (490 at planning).
    fix_if: Over 500 -- decompose a further cohesive helper group into a private sibling (Decision 128); never register a budget.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Already governed tree-wide by the registered validate_sloc_limits check in both tiers; this step only makes the per-file margin visible for this plan.
  - step: 11
    phase: pre-deploy
