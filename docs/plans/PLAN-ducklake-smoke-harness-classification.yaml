    fix_if: the pair lands in unclassified or skipped, a stray table no longer fails the pass, or a metric is emitted only on success
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-merge-ops-smoke-harness-and-outcome-metrics
