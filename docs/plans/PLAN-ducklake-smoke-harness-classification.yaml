      bad=[f for f, ks in need.items() if not all(k in open(f, encoding='utf-8').read() for k in ks)]; assert not bad, bad;
      p=yaml.safe_load(open('docs/plans/PLAN-ducklake-partition-drift-alarm.yaml', encoding='utf-8')); ph='reconcile_partitions cell applies';
