schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ducklake-smoke-harness-classification"
intent: >-
  Unblock rec-4070's live run and restore the every-6h production merge_ops (rec-3864) by declaring the
  production-resident smoke-harness pair (ducklake_smoke_current / ducklake_smoke_history) to the
  maintenance-scope registry as its own class -- compacted by merge_ops, reported read-only by the
  partition verbs -- so every live catalog table is classified and accounted for while a genuinely
  undeclared table still fails closed (Decision 191); make the scheduled merge_ops outcome observable to
  agents; and reserve the overloaded "smoke" vocabulary so residency is never again inferred from a name.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-smoke-harness-classification.yaml
phase: ad_hoc_rec (soft-warn category; fix-forward for PLAN-ducklake-partition-layout-remediation's step-18 STOP; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
scope:
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: >-
      Add SMOKE_HARNESS_CLASS = "smoke_harness". build_registry additionally classifies the two physical
      tables DECLARED under field_semantics' top-level `tables:` block (tables.history.name -> side
      "history", tables.current.name -> side "current"; table_id = the physical name) when that block is
      present -- declared data, never a name pattern (Decision 191). A `tables:` name colliding with an
      ops_tables physical name raises DuckLakeMaintenanceScopeError (never a silent override).
      class_universe() includes smoke_harness only when `tables:` is declared; write_mode stays the
      class source for every ops_tables entry. Fixture semantics without `tables:` behave as today.
  - file: src/common/ducklake_partition_layout.py
    action: Modify
    purpose: >-
      _declared_spec_text resolves a smoke_harness table's declared spec via resolve_table_spec(None,
      semantics) (the spec create_scd2_tables(table=None) creates from), by side. The aggregated error
      text names the registry correctly (ops_tables plus the declared smoke-harness pair). Fail-closed on
      undeclared tables is unchanged: ONE PartitionLayoutError naming every unclassified table.
  - file: src/lambdas/ducklake_maintenance/partition_actions.py
    action: Modify
    purpose: >-
      action_reconcile_partitions returns a `skipped` key in both the dry-run and the apply response:
      one entry per resolution.skipped table ({table, table_class, reason}) enriched with that table's
      READ-ONLY live layout and its compare_to_declared drift (or null) -- reported, never ALTERed -- so
      the readout accounts for every discovered table (layouts + skipped = catalog).
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops emits two pass-outcome metrics beside its existing MergeOps* metrics, BEFORE the
      aggregate raise: MergeOpsUnclassifiedTables (count) and MergeOpsPassFailed (1.0 when merge_failures
      or unclassified is non-empty, else 0.0) -- a scheduled async invoke's 500 body is discarded, so
      this is the only agent-readable outcome signal. At most +2 SLOC (490 -> <=492, under 500; no budget
      raise, Decision 128). No other change.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      maintenance_policy gains a smoke_harness row. merge_ops apply=true (reason: bounds the pair's
      live-file footprint left by operator-run churn probes, Decision 88 egress; a probe overlapping a
      :30 pass may fail that one table's merge under Decision 191's per-table isolation, surfacing as
      MergeOpsPassFailed -- accepted). reconcile_partitions and rewrite_partition_layout apply=false
      (reason: the pair's partition layout is owned by its creator's create_scd2_tables force_recreate
      from the declared spec and the deploy channel's --lambda-reader gate reads ducklake_smoke_current;
      its drift is reported read-only, never ALTERed or re-laid). No gc_ops cell (Decision 192 cl.2,
      catalog-wide). The matrix header comment's class-universe line names smoke_harness and its
      `tables:` source.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated via bin/venv-python -m scripts.schema_to_field_semantics -- never hand-edited.
  - file: scripts/checks/contracts/validate_maintenance_policy_matrix.py
    action: Modify
    purpose: >-
      _declared_class_universe adds smoke_harness when the generated field_semantics.yaml declares the
      `tables:` block -- still declared independently of the matrix's own keys (Decision 191 cl.2).
  - file: tests/test_ducklake_partition_layout.py
    action: Modify
    purpose: >-
      FakeMetaCon cases: ops tables plus the declared smoke pair all classify; adding two undeclared
      tables raises exactly one PartitionLayoutError naming only those two; compare_to_declared resolves
      the smoke_harness declared spec.
  - file: tests/test_ducklake_partition_rewrite.py
    action: Modify
    purpose: rewrite_legacy_layout on an ops history table proceeds when the declared smoke pair is also resident (both whole-catalog reads).
  - file: tests/common/test_ducklake_maintenance_scope.py
    action: Modify
    purpose: build_registry classifies the declared pair; collision raises; class_universe gains smoke_harness only when `tables:` is declared; the `tables:` names equal SMOKE_HISTORY_TABLE / SMOKE_CURRENT_TABLE.
  - file: tests/common/test_ducklake_partition_conformance.py
    action: Modify
    purpose: >-
      Real engine (integration-marked): a catalog built with create_scd2_tables for ops_recommendations
      AND the smoke pair (table=None) reads and compares without error, the pair classified
      smoke_harness; adding an undeclared raw table raises one aggregated PartitionLayoutError.
  - file: tests/lambdas/ducklake_maintenance/test_partition_actions.py
    action: Modify
    purpose: reconcile_partitions returns `skipped` with read-only layout/drift in both modes (update the exact-key pin at :83); rewrite_partition_layout on ducklake_smoke_history refuses with the smoke_harness policy reason.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Modify
    purpose: >-
      Author rec-3864's acceptance node test_smoke_schema_tables_never_surface_unclassified_in_production
      (ops tables + the declared pair -> ok:true, unclassified == [], the pair merged; the two
      pass-outcome metrics emitted as 0.0); a stray-table case emits MergeOpsUnclassifiedTables 1.0 and
      MergeOpsPassFailed 1.0 and still fails the pass.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Modify
    purpose: The live-registry universe includes smoke_harness; a matrix missing the smoke_harness row or one of its cells fails.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      New `vocabulary:` block (environment-taxonomy's reserved_meaning / do_not_use_for row shape)
      disambiguating: write_mode vs maintenance class; the smoke-harness pair vs the ducklake_smoke
      catalog vs `status: smoke` (a production ops table's lifecycle tag, e.g. ops_smoke_events) vs the
      deploy channel's smoke gates vs the writer's operator-run EC probes vs the maintenance-smoke
      Lambda; anti-pattern: inferring catalog residency from a field_semantics key or a "smoke" token --
      residency is the META_SCHEMA the creating caller attached under. The anti-pattern carries no
      mechanical check yet: the block declares it an unenforced residual owned by follow-on rec-4116
      (Decision 181 cl.2). amendment_log entry (Class D).
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: >-
      Register the smoke-harness pair as a table row: substrate, grain + merge_key + write_mode (the
      validator requires grain/write_mode on merge_key-bearing rows), write boundary (writer EC probes,
      force_recreate), read boundary (reader read_current table=None; the deploy --lambda-reader gate),
      catalog residency (ducklake_ops AND ducklake_smoke), maintenance class smoke_harness, and
      move-out follow-on rec-4116. Its status value is NOT `smoke` (reserved by the new vocabulary).
      amendment_log entry (Class D).
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Class B ritual contract (Decision 118): the class list (~:148) names smoke_harness; merge_ops'
      metrics and reconcile_partitions' 200-body prose (~:306) name the new metrics and the `skipped` key;
      new amendment_log entry (validate_contract_drift).
  - file: docs/contracts/ducklake-partition-remediation.yaml
    action: Modify
    purpose: >-
      Steps 18/19/21 name the expected sets: layouts == exactly the ten ops_* tables; skipped == exactly
      ducklake_smoke_current + ducklake_smoke_history (smoke_harness reason, read-only drift). The
      unclassified-table STOP is kept verbatim. New amendment_log entry (Class D).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decision 191 gains a dated trailing-bracket [Amendment 2026-09-28: ...] (decision-entry.yaml
      amendment_forms; Decision 177 dialect) realizing its own reversal condition (a)'s per-table
      override through declared `tables:` membership: the smoke-harness pair joins the class universe as
      smoke_harness from declared registry data, never string matching, and cl.2's universe is stated
      as widened to include it; write_mode stays the class source for ops_tables (T2.36:c5). No new
      number -- plan-critique's routing check (Decision 167) confirms the annotation route; if it
      rejects it, mint a numbered Decision instead.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated via scripts.decisions_index after the Decision 191 amendment -- never hand-edited.
  - file: docs/plans/PLAN-ducklake-partition-layout-remediation.yaml
    action: Modify
    purpose: >-
      Steps 18/19/21 expected + fix_if add the same exact-set expectations (a skipped set other than
      exactly the pair, or layouts other than exactly the ten ops tables, STOPs the run, as does any
      unclassified-table error); a dated context line points at this plan. Nothing weakened (Decision 181).
bundled_recommendations:
  - rec-3864
followon_recs:
  - rec-4116
  - rec-4117
infrastructure_dependencies: []
acceptance_criteria:
  - read_partition_layout over a catalog carrying ops tables plus the declared smoke pair returns a layout for every table (pair classified smoke_harness); adding two undeclared tables raises exactly one PartitionLayoutError naming only those two -- FakeCon and real engine.
  - reconcile_partitions returns `skipped` naming exactly the smoke pair with its policy reason and read-only drift; layouts/drifts cover only reconcile-scoped tables; rewrite_partition_layout on either smoke table refuses via its policy cell; no code path ALTERs or re-lays the pair.
  - merge_ops over the ops tables plus the declared pair returns ok:true with unclassified == [] and the pair merged (rec-3864's acceptance node), emitting MergeOpsUnclassifiedTables 0.0 and MergeOpsPassFailed 0.0; an undeclared table still fails the pass and emits 1.0 for both.
  - validate_maintenance_policy_matrix passes on the real sidecar and fails when the smoke_harness row or any of its cells is missing.
  - src/lambdas/ducklake_maintenance/handler.py stays at or under 492 SLOC (Decision 128; no budget entry added).
  - data-modeling-standard.yaml carries the vocabulary block; storage-substrate.yaml registers the pair; every edited Class D contract carries a new amendment_log entry; Decision 191 carries the dated amendment and decisions-index.json is regenerated.
  - Both step-18/19/21 surfaces name the exact expected layouts and skipped sets.
  - deploy-ducklake-lambdas.yml is green on the squash-merge SHA; the first scheduled merge_ops after deploy records MergeOpsUnclassifiedTables 0 and MergeOpsPassFailed 0 and MergeOpsTablesCount two higher than the last pre-deploy run -- read by a DEV agent, no manual invoke.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: prove the READ half classifies declared residents and still fails closed on undeclared ones
    command: >-
      bin/venv-python -m pytest
      tests/test_ducklake_partition_layout.py::test_read_partition_layout_classifies_declared_smoke_harness_residents
      tests/test_ducklake_partition_layout.py::test_read_partition_layout_undeclared_tables_still_one_error_beside_declared_residents
      tests/test_ducklake_partition_layout.py::test_compare_to_declared_resolves_smoke_harness_declared_spec
      tests/test_ducklake_partition_rewrite.py::test_rewrite_proceeds_with_declared_smoke_harness_resident
      tests/test_ducklake_partition_layout.py::test_read_partition_layout_unclassified_tables_collected_into_one_error
      -q
    expected: all five pass. Red on the planning tree -- the four new nodes do not exist
    fix_if: the undeclared-table case raises once per table or names a declared smoke table
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-layout-declared-resident-classification
  - step: 2
    phase: pre-deploy
    action: prove the registry sources the pair from declared data and fails closed on a collision
    command: bin/venv-python -m pytest tests/common/test_ducklake_maintenance_scope.py -q -k smoke_harness
    expected: every smoke_harness-selected test passes (build_registry sides, collision raise, class_universe gating, constant equality); red on the planning tree (zero selected, pytest exit 5)
    fix_if: the pair is matched by a name prefix instead of the `tables:` block
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-scope-smoke-harness-registry
  - step: 3
    phase: pre-deploy
    action: prove reconcile_partitions accounts for skipped tables read-only and rewrite refuses the pair
    command: &step3_cmd >-
      bin/venv-python -m pytest
      tests/lambdas/ducklake_maintenance/test_partition_actions.py::test_reconcile_partitions_reports_skipped_tables_read_only
      tests/lambdas/ducklake_maintenance/test_partition_actions.py::test_rewrite_refuses_smoke_harness_table_via_policy_cell
      tests/lambdas/ducklake_maintenance/test_partition_actions.py::test_reconcile_partitions_dry_run_defaults_true_and_never_alters
      -q
    expected: all three pass; red on the planning tree (the two new nodes do not exist; the third's exact-key pin gains skipped)
    fix_if: skipped missing from either response mode, a skipped table ALTERed, or the smoke history reaching rewrite_legacy_layout
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-reconcile-partitions-skipped
  - step: 4
    phase: pre-deploy
    action: prove merge_ops merges the pair (rec-3864's acceptance), emits the pass-outcome metrics, and still fails on a stray
    command: >-
      bin/venv-python -m pytest
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_smoke_schema_tables_never_surface_unclassified_in_production
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_unclassified_table_also_triggers_the_aggregate_raise
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py::test_pass_outcome_metrics_flag_an_unclassified_table
      -q
    expected: all three pass; red on the planning tree (the rec-3864 and metrics nodes do not exist)
    fix_if: the pair lands in unclassified or skipped, a stray table no longer fails the pass, or a metric is emitted only on success
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-merge-ops-smoke-harness-and-outcome-metrics
  - step: 5
    phase: pre-deploy
    action: prove the exhaustiveness gate knows the new class
    command: &step5_cmd >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_missing_smoke_harness_row_fails
      tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_default_class_universe_reads_the_live_registry
      tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_real_sidecar_is_exhaustive
      -q
    expected: all three pass; red on the planning tree (the missing-row node does not exist)
    fix_if: the universe was derived from the matrix's own keys (self-referential)
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-policy-matrix-smoke-harness-universe
  - step: 6
    phase: pre-deploy
    action: prove the regenerated projection carries the smoke_harness row -- merge on, partition verbs off
    command: &step6_cells >-
      bin/venv-python -c "import yaml;
      p=yaml.safe_load(open('config/lambda/ducklake/field_semantics.yaml', encoding='utf-8'))['maintenance_policy']['smoke_harness'];
      assert set(p) == {'merge_ops','reconcile_partitions','rewrite_partition_layout'}, p;
      assert p['merge_ops']['apply'] is True and p['merge_ops'].get('reason'), p;
      assert all(p[v]['apply'] is False and p[v].get('reason') for v in ('reconcile_partitions','rewrite_partition_layout')), p;
      print('SMOKE_HARNESS_CELLS_OK')"
    expected: prints the marker; red on the planning tree (KeyError on smoke_harness)
    fix_if: the sidecar was edited but field_semantics.yaml was not regenerated
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-smoke-harness-policy-cells
    expected_literals: []
  - step: 7
    phase: pre-deploy
    action: confirm the generated projection matches its sources
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0
    fix_if: drift means field_semantics.yaml was hand-edited or not regenerated
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Already registered as validate_field_semantics_drift in both validate tiers and green on the
      un-implemented tree, so it cannot be a red-before graduate step.
    expected_literals: []
  - step: 8
    phase: pre-deploy
    action: prove the classification on the pinned real engine
    command: bin/venv-python -m pytest tests/common/test_ducklake_partition_conformance.py -m integration -q -rs
    expected: every test passes with zero skips, including the new declared-resident and undeclared-table cases
    fix_if: a skip means the ducklake extension did not load -- resolve it; never accept a skip as green
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Integration-marked: CI deselects integration tests and blocks sockets until rec-4071 provisions
      the pinned extension, so a registry row would be a permanently skipped guard.
  - step: 9
    phase: pre-deploy
    action: prove the vocabulary and substrate registrations landed with their amendment_log entries
    command: &step9_cmd >-
      bin/venv-python -c "import yaml;
      d=yaml.safe_load(open('docs/contracts/data-modeling-standard.yaml', encoding='utf-8'));
      v=d['vocabulary']; assert all(set(r) >= {'reserved_meaning','do_not_use_for'} for k, r in v.items() if isinstance(r, dict)), v;
      s=yaml.safe_load(open('docs/contracts/storage-substrate.yaml', encoding='utf-8'))['tables'];
      rows=[r for r in s.values() if isinstance(r, dict) and 'ducklake_smoke_history' in str(r)];
      assert rows and all(r.get('status') != 'smoke' and r.get('grain') and r.get('write_mode') for r in rows), rows;
      print('SMOKE_VOCAB_AND_SUBSTRATE_OK')"
    expected: prints the marker; red on the planning tree (no vocabulary key)
    fix_if: the pair's substrate row reuses status smoke, or a vocabulary row lacks either field
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Contract-content shape check; validate_contract_drift and validate_data_model_standard already
      guard these files' amendment_log and grain/write_mode rules, and pinning vocabulary wording as a
      standing registry row would freeze prose.
    expected_literals: []
  - step: 10
    phase: pre-deploy
    action: prove handler.py stays within its SLOC headroom (Decision 128)
    command: >-
      bin/venv-python -c "import pathlib;
      n=sum(1 for l in pathlib.Path('src/lambdas/ducklake_maintenance/handler.py').read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#'));
      assert n <= 492, n; print('HANDLER_SLOC', n)"
    expected: prints HANDLER_SLOC at or under 492
    fix_if: more than two lines added -- move the logic into a cohesive module instead of growing the handler
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_sloc_limits already enforces the 500 ceiling in both tiers; this tighter 492 bound is a
      one-plan scope guard, not a standing invariant.
    expected_literals: []
  - step: 11
    phase: pre-deploy
    action: prove Decision 191 carries the smoke_harness amendment and the generated decisions index is fresh
    command: &step11_cmd >-
      bash -c "awk '/^## Decision 191:/{f=1} /^## Decision 190:/{f=0} f' docs/DECISIONS.md | grep -q smoke_harness
      && bin/venv-python -m scripts.decisions_index --check && echo DEC191_AMENDED_INDEX_FRESH"
    expected: prints the marker; red on the planning tree (Decision 191 never names smoke_harness)
    fix_if: the amendment edited a clause in place instead of appending a dated trailer (Decision 177), or the index was hand-edited
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-time prose presence on an append-only Decision entry; the index freshness half is already the
      registered decisions-index drift check in both tiers, so a standing row would duplicate it.
    expected_literals: []
  - step: 12
    phase: pre-deploy
    action: run the authoritative fast presubmit tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: diagnose and fix on the branch (ci-rca watches main only)
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: run the full presubmit tier before handoff, as handoff_policy declares
    command: bin/venv-python -m scripts.validate
    expected: exit 0
    fix_if: a timeout is blocked -- resume later and rerun from the start
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: confirm the governed channel built, deployed and smoked all DuckLake Lambdas on the merge commit (Decision 125/126)
    command: >-
      mcp__github__actions_list for workflow deploy-ducklake-lambdas.yml on main, then
      mcp__github__get_job_logs for the run whose head_sha equals the squash-merge SHA
    expected: all five jobs succeed -- deploy-maintenance, maintenance-smoke, reconcile-gate, deploy-serving, smoke (the smoke job's --lambda-reader still reads ducklake_smoke_current)
    fix_if: never fall back to build_lambda --ducklake-only --deploy (Decision 125/126)
    hermetic: false
  - step: 15
    phase: post-deploy
    action: DEV agent proves the first scheduled merge_ops after deploy succeeded -- no manual invoke
    command: >-
      aws cloudwatch get-metric-statistics --namespace DuckLakeMaintenance --profile agent_platform
      --region eu-west-2 --statistics Maximum --period 21600 --start-time <deploy completion, ISO-8601>
      --end-time <now, ISO-8601> --metric-name MergeOpsPassFailed; repeat for MergeOpsUnclassifiedTables
      and MergeOpsTablesCount, and for MergeOpsTablesCount over the 24h before deploy
    expected: >-
      at least one post-deploy datapoint (first :30 pass); MergeOpsPassFailed 0 and
      MergeOpsUnclassifiedTables 0; MergeOpsTablesCount exactly two higher than the pre-deploy value
      (the pair now merged)
    fix_if: >-
      no datapoint yet -- wait for the next :30 pass (6-hourly), never invoke merge_ops; a
      MergeOpsDurationMs datapoint with no MergeOpsPassFailed one means emission failed (emit_metric is
      best-effort) -- RCA it, never infer success from absence; PassFailed 1 --
      STOP and RCA (Decision 55); an overlapping EC probe run is the only accepted transient, confirm it
      and re-read the following pass
    hermetic: false
  - step: 16
    phase: post-deploy
    action: DEV agent hands back -- ADMIN HANDOFF block in the merged PR description plus a final PR comment naming the pickup point
    command: >-
      mcp__github__update_pull_request (append the ADMIN HANDOFF block, Decision 115) then
      mcp__github__add_issue_comment on the merged PR: the squash-merge SHA, the green
