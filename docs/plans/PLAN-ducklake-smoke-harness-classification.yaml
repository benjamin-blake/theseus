      layouts == the ten ops tables and skipped == exactly the pair)
    expected: both exist; the DEV agent invokes no maintenance verb itself
    fix_if: a DEV-container invocation of any maintenance verb was attempted -- stop; they are admin-only
    hermetic: false
  - step: 17
    phase: post-deploy
    action: ADMIN agent (resuming session, under explicit human direction per Decision 204) runs the read-only reconcile dry_run and PRESENTS it
    command: >-
      AWS_MAX_ATTEMPTS=1 aws lambda invoke --function-name agent-platform-ducklake-maintenance
      --profile agent_platform_admin --region eu-west-2 --cli-read-timeout 960
      --cli-binary-format raw-in-base64-out
      --payload '{"action":"reconcile_partitions","data_path":"<data_path>","meta_schema":"<meta_schema>","dry_run":true}'
      /tmp/reconcile_dry_run_before.json
    expected: >-
      HTTP 200; layouts carries exactly the ten ops_* physical tables; skipped carries exactly
      ducklake_smoke_current and ducklake_smoke_history with the smoke_harness reason, each with its
      read-only layout and drift; drifts as the remediation plan's step 18 expects. This response IS
      that plan's step 18 -- reuse it, do not re-invoke
    fix_if: an unclassified-table error, or layouts/skipped other than exactly those sets -- STOP and report
    hermetic: false
  - step: 18
    phase: post-deploy
    action: confirm rec-3864 closed through the squash-merge Resolves trailer (Decision 201 holds verdict)
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;
      rows=[json.loads(l) for l in open('logs/.recommendations-log.jsonl', encoding='utf-8') if l.strip()];
      r=[x for x in rows if x.get('id')=='rec-3864'][-1]; assert r['status']=='closed', r['status'];
      print('REC_3864_CLOSED')"
    expected: prints the closed marker
    fix_if: still open -- check ci.yml's closure job on the merge commit; never close it by hand without its acceptance node passing
    hermetic: false
test_obligations:
  - source: src/common/ducklake_maintenance_scope.py
