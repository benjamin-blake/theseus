      /tmp/reconcile_dry_run_before.json
    expected: >-
      HTTP 200; layouts carries exactly the ten ops_* physical tables; skipped carries exactly
      ducklake_smoke_current and ducklake_smoke_history with the smoke_harness reason, each with its
      read-only layout and a null drift; drifts as the remediation plan's step 18 expects. This response
      IS that plan's step 18 -- reuse it, do not re-invoke
    fix_if: >-
      an unclassified-table error, or layouts/skipped other than exactly those sets -- STOP and report; a
      non-null skipped drift is recorded on rec-4116, never a STOP and never ALTERed
    hermetic: false
