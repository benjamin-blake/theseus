      assert 'smoke_harness' in next(v['expected'] for v in p['verification_plan'] if v['step'] == 1), 'drift plan VP1 lacks the smoke_harness case';
      assert any('PLAN-ducklake-smoke-harness-classification' in c for c in p['pre_implementation_checklist']), 'drift plan lacks the ordering prerequisite';
      subprocess.run([sys.executable, '-m', 'scripts.decisions_index', '--check'], check=True);
      print('DEC191_AND_SURFACES_OK')"
    expected: prints the marker; red on the planning tree (Decision 191 never names smoke_harness)
    fix_if: the amendment edited a clause in place instead of appending a dated, source-cited trailer (Decision 177), a surface lacks the exact sets, the drift-alarm plan still says any table drifts, or the index was hand-edited
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
