      print('REC_3864_CLOSED')"
    expected: prints the closed marker
    fix_if: still open -- check ci.yml's closure job on the merge commit; never close it by hand without its acceptance node passing
    hermetic: false
  - step: 16
    phase: post-deploy
    action: >-
      DEV agent proves the first scheduled merge_ops after deploy -- no manual invoke. merge_ops runs
      cron(30 */6), so its passes are 00/06/12/18:30Z; wake by send_later at the first HH:35Z (HH in
      00/06/12/18) after deploy completes, never a sleep or poll; the :30 window isolates merge_ops from
      control_health (:15) on this shared function
    command: >-
      aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Invocations
      --dimensions Name=FunctionName,Value=agent-platform-ducklake-maintenance --statistics Sum
      --period 60 --start-time <HH:29Z> --end-time <HH:40Z> --profile agent_platform --region eu-west-2
      (repeat for Errors); then aws cloudwatch get-metric-statistics --namespace DuckLakeMaintenance
      --statistics Maximum --period 600 over the same window for MergeOpsDurationMs, MergeOpsPassFailed,
      MergeOpsUnclassifiedTables and MergeOpsTablesCount, and MergeOpsTablesCount over the 24h before deploy
    expected: >-
      an Invocations datapoint in the :30 window with Errors 0; MergeOpsDurationMs present;
      MergeOpsPassFailed 0 and MergeOpsUnclassifiedTables 0; MergeOpsTablesCount exactly two higher
      than the pre-deploy value (the pair now merged)
    fix_if: >-
      no Invocations datapoint -- allow exactly one more window (send_later to the NEXT 6-hourly HH:35Z,
      +6h), then STOP
      and RCA the schedule; an invocation with no MergeOpsDurationMs and no MergeOpsPassFailed means the
      pass aborted before the post-loop point (DSN/connection, the empty-catalog guard, or a registry or
      scope error such as the new collision raise) -- STOP and RCA (Decision 55); MergeOpsDurationMs
      without MergeOpsPassFailed means emission failed (emit_metric is best-effort) -- RCA, never infer
      success from absence; PassFailed 1 -- STOP and RCA, the only accepted transient being a confirmed
      overlapping operator EC probe run, then re-read the following pass; MergeOpsTablesCount other than
      pre-deploy + 2 -- check for a concurrently merged table registration or the pair mid-recreate at
      :30, re-read the following pass, and STOP and RCA if it persists
    hermetic: false
  - step: 17
    phase: post-deploy
    action: DEV agent hands back -- ADMIN HANDOFF block in the merged PR description plus a final PR comment naming the pickup point
    command: >-
      mcp__github__update_pull_request (append the ADMIN HANDOFF block, Decision 115) then
