      tests/common/test_ducklake_maintenance_scope.py::test_build_registry_raises_on_smoke_harness_name_collision
      tests/common/test_ducklake_maintenance_scope.py::test_class_universe_includes_smoke_harness_only_when_tables_declared
      tests/common/test_ducklake_maintenance_scope.py::test_tables_block_agrees_with_smoke_spec
      -q
    expected: >-
      all four pass (build_registry sides, collision raise, class_universe gating; the `tables:` names
      equal SMOKE_HISTORY_TABLE / SMOKE_CURRENT_TABLE AND normalize_partition_spec of each
      tables.<side>.partition equals resolve_table_spec(None)'s spec for that side); red on the planning
