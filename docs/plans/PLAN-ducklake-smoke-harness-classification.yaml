schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ducklake-smoke-harness-classification"
intent: >-
  Unblock rec-4070's live run and restore the every-6h production merge_ops (rec-3864) by declaring the
  production-resident smoke-harness pair (ducklake_smoke_current / ducklake_smoke_history) to the
  maintenance-scope registry as its own class -- compacted by merge_ops, reported read-only by the
  partition verbs -- so every live catalog table is classified and accounted for while a genuinely
  undeclared table still fails closed (Decision 191); make the scheduled merge_ops outcome observable to
  agents; and reserve the overloaded "smoke" vocabulary so residency is never again inferred from a name.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-smoke-harness-classification.yaml
phase: ad_hoc_rec (soft-warn category; fix-forward for PLAN-ducklake-partition-layout-remediation's step-18 STOP; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
scope:
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: >-
      Add SMOKE_HARNESS_CLASS = "smoke_harness". build_registry additionally classifies the two physical
      tables DECLARED under field_semantics' top-level `tables:` block (tables.history.name -> side
      "history", tables.current.name -> side "current"; table_id = the physical name) when that block is
      present -- declared data, never a name pattern (Decision 191). A `tables:` name colliding with an
      ops_tables physical name raises DuckLakeMaintenanceScopeError (never a silent override).
      class_universe() includes smoke_harness only when `tables:` is declared; write_mode stays the
      class source for every ops_tables entry. Fixture semantics without `tables:` behave as today.
  - file: src/common/ducklake_partition_layout.py
    action: Modify
    purpose: >-
      _declared_spec_text resolves a smoke_harness table's declared spec via resolve_table_spec(None,
      semantics) (the spec create_scd2_tables(table=None) creates from), by side. The aggregated error
      text names the registry correctly (ops_tables plus the declared smoke-harness pair). Fail-closed on
      undeclared tables is unchanged: ONE PartitionLayoutError naming every unclassified table.
  - file: src/lambdas/ducklake_maintenance/partition_actions.py
    action: Modify
    purpose: >-
      action_reconcile_partitions returns a `skipped` key in both the dry-run and the apply response:
      one entry per resolution.skipped table ({table, table_class, reason}) enriched with that table's
      READ-ONLY live layout and its compare_to_declared drift (or null) -- reported, never ALTERed -- so
      the readout accounts for every discovered table (layouts + skipped = catalog).
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops emits two pass-outcome metrics beside its existing MergeOps* metrics, BEFORE the
      aggregate raise: MergeOpsUnclassifiedTables (count) and MergeOpsPassFailed (1.0 when merge_failures
      or unclassified is non-empty, else 0.0) -- a scheduled async invoke's 500 body is discarded, so
      this is the only agent-readable outcome signal. At most +2 SLOC (490 -> <=492, under 500; no budget
      raise, Decision 128). No other change.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      maintenance_policy gains a smoke_harness row. merge_ops apply=true (reason: bounds the pair's
      live-file footprint left by operator-run churn probes, Decision 88 egress; a probe overlapping a
      :30 pass may fail that one table's merge under Decision 191's per-table isolation, surfacing as
      MergeOpsPassFailed -- accepted). reconcile_partitions and rewrite_partition_layout apply=false
      (reason: the pair's partition layout is owned by its creator's create_scd2_tables force_recreate
      from the declared spec and the deploy channel's --lambda-reader gate reads ducklake_smoke_current;
      its drift is reported read-only, never ALTERed or re-laid). No gc_ops cell (Decision 192 cl.2,
      catalog-wide). The matrix header comment's class-universe line names smoke_harness and its
      `tables:` source.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated via bin/venv-python -m scripts.schema_to_field_semantics -- never hand-edited.
  - file: scripts/checks/contracts/validate_maintenance_policy_matrix.py
    action: Modify
    purpose: >-
      _declared_class_universe delegates to ducklake_maintenance_scope.class_universe(semantics loaded
      from the generated field_semantics.yaml) -- one source of truth for the smoke_harness gating rule
      (the validator already imports VERB_UNIVERSE from that module), still independent of the matrix's
      own keys (Decision 191 cl.2).
  - file: tests/test_ducklake_partition_layout.py
    action: Modify
    purpose: >-
      FakeMetaCon cases: ops tables plus the declared smoke pair all classify; adding two undeclared
      tables raises exactly one PartitionLayoutError naming only those two; compare_to_declared resolves
      the smoke_harness declared spec.
  - file: tests/test_ducklake_partition_rewrite.py
    action: Modify
    purpose: rewrite_legacy_layout on an ops history table proceeds when the declared smoke pair is also resident (both whole-catalog reads).
  - file: tests/common/test_ducklake_maintenance_scope.py
    action: Modify
    purpose: >-
      build_registry classifies the declared pair; collision raises; class_universe gains smoke_harness
      only when `tables:` is declared; test_tables_block_agrees_with_smoke_spec pins the `tables:` names
      to SMOKE_HISTORY_TABLE / SMOKE_CURRENT_TABLE and each tables.<side>.partition (normalized) to
      resolve_table_spec(None)'s spec -- `tables:` is the MEMBERSHIP source, partition_transforms (via
      resolve_table_spec(None)) the declared-SPEC source, and the test keeps the two from diverging.
  - file: tests/common/test_ducklake_partition_conformance.py
    action: Modify
    purpose: >-
      Real engine (integration-marked): a catalog built with create_scd2_tables for ops_recommendations
      AND the smoke pair (table=None) reads and compares without error, the pair classified
      smoke_harness; adding an undeclared raw table raises one aggregated PartitionLayoutError.
  - file: tests/lambdas/ducklake_maintenance/test_partition_actions.py
    action: Modify
    purpose: >-
      reconcile_partitions returns `skipped` with read-only layout/drift in both modes (update the
      exact-key pin at :83), and with dry_run=false alter_to_declared's drifts argument excludes every
      skipped table; test_rewrite_refuses_smoke_harness_table_via_policy_cell loads the REAL generated
      field_semantics.yaml (not a mocked resolve_scope), so it binds the shipped smoke_harness rewrite cell
      to the action.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Modify
    purpose: >-
      Author rec-3864's acceptance node test_smoke_schema_tables_never_surface_unclassified_in_production
      against the REAL generated config/lambda/ducklake/field_semantics.yaml (not the module's hand-rolled
      _semantics() fixture), so the Decision 201 closure verdict binds the production data path that
      failed: ops tables + the declared pair -> ok:true, unclassified == [], the pair merged, both
      pass-outcome metrics 0.0. A stray-table case emits MergeOpsUnclassifiedTables 1.0 and
      MergeOpsPassFailed 1.0 and still fails the pass; test_merge_failure_only_pass_emits_pass_failed
      asserts PassFailed 1.0 with UnclassifiedTables 0.0.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Modify
    purpose: The live-registry universe includes smoke_harness; a matrix missing the smoke_harness row or one of its cells fails.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      New `vocabulary:` block (environment-taxonomy's reserved_meaning / do_not_use_for row shape)
      disambiguating: write_mode vs maintenance class; the smoke-harness pair vs the ducklake_smoke
      catalog vs `status: smoke` (a production ops table's lifecycle tag, e.g. ops_smoke_events) vs the
      deploy channel's smoke gates vs the writer's operator-run EC probes vs the maintenance-smoke
      Lambda; anti-pattern: inferring catalog residency from a field_semantics key or a "smoke" token --
      residency is the META_SCHEMA the creating caller attached under. The anti-pattern carries no
      mechanical check yet: the block declares it an unenforced residual owned by follow-on rec-4116
      (Decision 181 cl.2). amendment_log entry (Class D).
  - file: docs/contracts/storage-substrate.yaml
    action: Modify
    purpose: >-
      Register the smoke-harness pair as a table row: substrate, grain + merge_key + write_mode (the
      validator requires grain/write_mode on merge_key-bearing rows), write boundary (writer EC probes,
      force_recreate), read boundary (reader read_current table=None; the deploy --lambda-reader gate),
      catalog residency (ducklake_ops AND ducklake_smoke), maintenance class smoke_harness, and
      move-out follow-on rec-4116. Its status is `transitional` (never `smoke`, which the new vocabulary
      reserves for a production ops table's lifecycle tag).
      amendment_log entry (Class D).
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      Class B ritual contract (Decision 118): the class list (~:148) names smoke_harness; merge_ops'
      metrics and reconcile_partitions' 200-body prose (~:306) name the new metrics and the `skipped` key;
      new amendment_log entry (validate_contract_drift).
  - file: docs/contracts/ducklake-partition-remediation.yaml
    action: Modify
    purpose: >-
      Steps 18/19/21 name the expected sets: layouts == exactly the ten ops_* tables; skipped == exactly
      ducklake_smoke_current + ducklake_smoke_history (smoke_harness reason), each with read-only drift
      expected null (2026-09-26 evidence: the smoke history is already on the calendar-day triple); a
      non-null skipped drift is recorded on rec-4116, never a STOP and never ALTERed. The
      unclassified-table STOP is kept verbatim. New amendment_log entry (Class D).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decision 191 gains a dated, source-cited (this plan's slug + rec-3864) trailing-bracket
      [Amendment 2026-09-28: ...] (decision-entry.yaml amendment_forms; Decision 177 dialect) realizing its own reversal condition (a)'s per-table
      override through declared `tables:` membership: the smoke-harness pair joins the class universe as
      smoke_harness from declared registry data, never string matching, and cl.2's universe is stated
      as widened to include it; write_mode stays the class source for ops_tables (T2.36:c5). No new
      number -- plan-critique's routing check (Decision 167) confirms the annotation route; if it
      rejects it, mint a numbered Decision instead.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated via scripts.decisions_index after the Decision 191 amendment -- never hand-edited.
  - file: docs/plans/PLAN-ducklake-partition-layout-remediation.yaml
    action: Modify
    purpose: >-
      Steps 18/19/21 expected + fix_if add the same exact-set expectations and null-drift expectation (a
      skipped set other than exactly the pair, or layouts other than exactly the ten ops tables, STOPs the
      run, as does any unclassified-table error); step 24's "every table in the recorded readout" is
      pinned to `layouts`, with `skipped` required to equal exactly the pair; a dated context line points
      at this plan. Nothing weakened (Decision 181).
  - file: docs/plans/PLAN-ducklake-partition-drift-alarm.yaml
    action: Modify
    purpose: >-
      Approved, not-yet-implemented consumer of read_partition_layout (rec-4094). Narrow its drift
      predicate CONSISTENTLY, using the pinned phrase "reconcile_partitions cell applies": (1) `intent`
      and acceptance_criteria[1] -- "while any table drifts" becomes "while any table whose maintenance
      class's reconcile_partitions cell applies drifts"; (2) the scripts/convergence_health/
      partition_drift.py scope row's THRESHOLD sentence -- "over_threshold iff any drift" becomes "any
      drift on a table whose maintenance class's reconcile_partitions cell applies"; (3) the
      tests/convergence_health/test_partition_drift.py scope row gains the case "drift on a smoke_harness
      (reconcile_partitions apply=false) table is reported in context and neither trips the alarm nor
      fails --assert-clear"; (4) verification_plan step 1 `expected` names that smoke_harness case; (5)
      the partition_drift.py test_obligation behavior reads "over reconcile-scoped drift and
      rewrite-eligible legacy files only"; (6) a dated context line pointing at this plan; (7) its
      pre_implementation_checklist gains "PLAN-ducklake-smoke-harness-classification merged and deployed
      (deploy-ducklake-lambdas.yml green on its merge SHA)" -- until then its live partition_layout verb
      fails closed on production exactly as the remediation step 18 did; (8) its live-verb step's
      expected allows the pair in the readout with table_class smoke_harness. A report-only
      class's drift never holds the alarm open, mirroring action_reconcile_partitions' to_merge scoping.
      rec-4094's context was updated 2026-09-28.
bundled_recommendations:
  - rec-3864
followon_recs:
  - rec-4116
  - rec-4117
infrastructure_dependencies: []
acceptance_criteria:
  - read_partition_layout over a catalog carrying ops tables plus the declared smoke pair returns a layout for every table (pair classified smoke_harness); adding two undeclared tables raises exactly one PartitionLayoutError naming only those two -- FakeCon and real engine.
  - reconcile_partitions returns `skipped` naming exactly the smoke pair with its policy reason and read-only drift; layouts/drifts cover only reconcile-scoped tables; rewrite_partition_layout on either smoke table refuses via its policy cell; no code path ALTERs or re-lays the pair.
  - merge_ops over the ops tables plus the declared pair returns ok:true with unclassified == [] and the pair merged (rec-3864's acceptance node), emitting MergeOpsUnclassifiedTables 0.0 and MergeOpsPassFailed 0.0; an undeclared table still fails the pass and emits 1.0 for both.
  - validate_maintenance_policy_matrix passes on the real sidecar and fails when the smoke_harness row or any of its cells is missing.
  - src/lambdas/ducklake_maintenance/handler.py stays at or under 492 SLOC (Decision 128; no budget entry added).
  - data-modeling-standard.yaml carries the vocabulary block; storage-substrate.yaml registers the pair; every edited Class D contract carries a new amendment_log entry; Decision 191 carries the dated amendment and decisions-index.json is regenerated.
  - Both step-18/19/21 surfaces name the exact expected layouts and skipped sets (skipped drift expected null, recorded never STOPped); the remediation plan's step 24 reads "every table" as layouts; PLAN-ducklake-partition-drift-alarm's drift predicate counts only reconcile-scoped tables.
  - deploy-ducklake-lambdas.yml is green on the squash-merge SHA; the first scheduled merge_ops after deploy (or, after a confirmed EC-probe overlap, the following pass) is invoked (AWS/Lambda Invocations in the :30 window) and records MergeOpsUnclassifiedTables 0, MergeOpsPassFailed 0 and MergeOpsTablesCount two higher than the last pre-deploy run -- read by a DEV agent, no manual invoke.
verification_plan:
