work_areas: []
rollback: >-
  Revert as one commit. The five schema pin sites must move together in either direction - a partial
  revert leaves the S1 guard pinning a schema the producer no longer emits. Because `body` is unchanged
  by construction, no fingerprint backfill or chain repair is needed; bundle sha256 values shift back,
  which is inert. Reverting also drops both new CiRcaContext fields, which is safe: both are Optional,
  so no historical rec is invalidated, and back_validate_ci_rca recomputes against the reverted schema.
