schema_version: 4
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "secrets-baseline-sanction-row"
intent: >-
  Model detect-secrets .secrets.baseline reference-line regeneration as a conditional sanction row
  in implement-scope-boundary.yaml, with its trigger kind implemented in validate_scope_boundary,
  so the deterministic scope guard (Decision 59) stops STOPping on a mechanically-generated
  companion no plan author can avoid touching -- removing the hand-tracked-scope-row workaround
  that two plans already paid and a third bypassed CI to escape.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-secrets-baseline-sanction-row.yaml
phase: >-
  ci_rca soft-warn exception category; no tier_item claimed. RELATED (not targeted): T2.54
  (clause-to-check traceability -- this adds one more clause/check edge), T2.56 (normative
  layering -- moves a per-plan authoring obligation into a contract row).
scope:
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Add the secrets_baseline_regeneration sanction row (trigger kind
      scope_file_in_secrets_baseline); retire the now-falsified .secrets.baseline entry from
      unmodelled_companions; add the dated amendment_log entry carrying the falsifying measurement
      and the Decision 75 conscious-choice note.
  - file: scripts/checks/verification/validate_scope_boundary.py
    action: Modify
    purpose: >-
      Implement the scope_file_in_secrets_baseline branch in _row_derived_paths plus the
      baseline-key union reader; without it the contract row is a loud unimplemented-kind failure.
  - file: scripts/test_coverage_checker.py
    action: Modify
    purpose: >-
      Register scripts/checks/verification/validate_scope_boundary.py in
      _CONCERN_SPLIT_TEST_PACKAGES so map_source_to_test resolves to the new package directory
      instead of the deleted flat file (Decision 131 point 1).
  - file: config/agent/verification_registry/entries/scope-boundary-rejects-unsanctioned-path.yaml
    action: Modify
    purpose: >-
      Repoint the already-graduated check_spec.command off the deleted flat test path onto the new
      package; not derivable from the graduated_registry_shard row, which covers only a plan's OWN
      graduate steps.
  - file: tests/checks/verification/test_validate_scope_boundary.py
    action: Delete
    purpose: Decomposed into the mirror package below (444 SLOC, 56 short of the hard 500 limit).
  - file: tests/checks/verification/validate_scope_boundary/__init__.py
    action: Create
    purpose: Empty package marker (Decision 131 point 4), mirroring the sibling precedent.
  - file: tests/checks/verification/validate_scope_boundary/conftest.py
    action: Create
    purpose: >-
      Homes every helper crossing the split boundary (_DEFAULT_SANCTION_ROWS, _DUMMY_VP_STEP,
      _plan_dict, _write_plan, _write_contract, _git, _init_repo, _commit_all, _ResolvedFixture,
      and a new _write_baseline), consumed by sibling modules via `from .conftest import ...`.
  - file: tests/checks/verification/validate_scope_boundary/test_plan_legs.py
    action: Create
    purpose: TestPlanOnlyLeg, TestSkippedBase, TestPlanPathsOverride, TestAccounting -- moved verbatim.
  - file: tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py
    action: Create
    purpose: TestEnforcingLeg -- the diff-vs-scope matrix, moved verbatim.
  - file: tests/checks/verification/validate_scope_boundary/test_secrets_baseline_row.py
    action: Create
    purpose: >-
      The new trigger kind's eight arms -- positive, negative, base-only, working-tree-only,
      baseline-absent, unparseable-at-working-tree, unparseable-at-base, and base-unreadable.
      One per branch: validate_test_coverage holds this module to the 100% per-file floor. It is
      registered full_segment="full_after_lint" with no pre=True, so the gate is VP step 11, NOT
      step 10 -- validate_diff_coverage does ride --pre but is REPORT ONLY and never appends to
      failed, so a coverage shortfall is invisible in the fast tier.
  - file: tests/test_coverage_checker/test_coverage_checker_map.py
    action: Modify
    purpose: >-
      Add the per-entry mapper test for the new _CONCERN_SPLIT_TEST_PACKAGES registration,
      following the file's existing one-test-per-entry convention
      (test_maps_scripts_session_preflight_to_concern_split_package and siblings).
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      Re-ground test_unmodelled_companions_present, which today hard-asserts .secrets.baseline IS
      unmodelled; assert instead that a sanction row now carries it and that
      config/composite_action_body_baseline.yaml remains unmodelled. Rename it to match its new
      meaning, and ratchet test_sanction_rows_are_conditional_not_flat_allowlist's
      `assert len(rows) >= 3` to `>= 4` -- a free strengthening this plan's own row makes true.
  - file: docs/plans/PLAN-secrets-baseline-sanction-row.yaml
    action: Create
    purpose: this plan
bundled_recommendations: ["rec-3570", "rec-3375", "rec-3399"]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/implement-scope-boundary.yaml carries a secrets_baseline_regeneration
    sanction row whose trigger.kind is scope_file_in_secrets_baseline and whose
    sanctions.path_template is .secrets.baseline.
  - >-
    .secrets.baseline no longer appears in the contract's unmodelled_companions, while
    config/composite_action_body_baseline.yaml still does.
  - >-
    validate_scope_boundary derives .secrets.baseline for a resolved plan whose declared scope
    contains at least one filename key of the baseline's results map, computed as the union of the
    baseline at the diff base ref and the baseline in the working tree.
  - >-
    validate_scope_boundary derives nothing for a resolved plan whose declared scope contains no
    such file, so a diff touching .secrets.baseline still STOPs -- the row is conditional, never a
    blanket allow.
  - >-
    A missing baseline derives nothing without a finding; an unparseable baseline (at either the
    working tree or the base ref) appends a finding rather than raising or silently deriving
    nothing, at most once per dispatch.
  - >-
    No tracked non-plan file references tests/checks/verification/test_validate_scope_boundary.py,
    and map_source_to_test resolves the check module to the new package directory.
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: secrets-baseline-sanction-row-declared
    action: Assert the contract row exists, is well-formed, and the unmodelled entry is retired.
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/contracts/implement-scope-boundary.yaml'));r=d['sanction_rows']['secrets_baseline_regeneration'];assert
      r['trigger']['kind']=='scope_file_in_secrets_baseline',r;assert
      r['sanctions']['path_template']=='.secrets.baseline',r;assert
      r['trigger']['baseline_path']=='.secrets.baseline',r;assert r.get('purpose');assert 'rescans
      the whole repo' in r['trigger']['description'],r;c={x['path']
      for x in d['unmodelled_companions']};assert '.secrets.baseline' not in c,c;assert
      'config/composite_action_body_baseline.yaml' in c,c;print('OK')"
    expected: prints OK
    fix_if: >-
      KeyError on the row means it was not added; an assertion on unmodelled_companions means the
      retirement half was skipped or the composite-baseline entry was removed along with it. The
      baseline_path assertion is load-bearing, not decorative: _secrets_baseline_keys consumes
      that field, so a row omitting it would make `root / None` RAISE -- violating this plan's own
      never-raises constraint at a shape none of the eight arms covers.
  - step: 2
    phase: pre-deploy
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      NOT kernel-admissible: the asserted property is invariant across the change, so the command
      exits 0 on an origin/main revert worktree too -- empirically confirmed at 58afe0a9, where
      the plan file is absent, _enforce prints SKIP, `allowed` stays empty, and .secrets.baseline
      is reported outside scope for a reason unrelated to the property. run_differential requires
      FAIL-on-main + PASS-on-HEAD, so graduating this would register a tautological probe that
      validate_verification_registry's VF-06 c2 differential rejects (and it rides --pre via
      pre_globs on scripts/checks/verification/**, so it would red the fast tier). Bolting a
      symbol-existence import on to force discrimination would make the shard discriminate on the
      symbol, not on the conditional-ness the step claims -- the exact classification-gaming shape
      12o exists to catch. The standing guard for conditional-ness is unit arm 2 in
      test_secrets_baseline_row.py plus step 1's graduated row-shape pin. The step is KEPT as a
      session-time real-data check.
    action: >-
      Real-data negative -- this plan's own scope carries no baseline key, so a diff touching
      .secrets.baseline must still STOP. Proves the row is conditional, not a blanket allow.
      Holds only while no file in this plan's declared scope is a .secrets.baseline results key;
      note this plan's OWN path is a scope row, and docs/plans/PLAN-terraform-state-triggers-restore.yaml
      is a live precedent for a plan file entering the baseline.
    command: >-
      bin/venv-python -c "from pathlib import
      Path;from scripts.checks.verification.validate_scope_boundary import
      validate_scope_boundary;f=[];validate_scope_boundary(f,plan_paths=['docs/plans/PLAN-secrets-baseline-sanction-row.yaml'],changed_files=['.secrets.baseline'],root=Path('.'));assert
      any('.secrets.baseline' in m and 'outside declared scope' in m for m in f),f;print('OK')"
    expected: prints OK -- the finding is still raised for a plan with no baseline-carrying scope file
    fix_if: >-
      An empty findings list has TWO possible causes, and the second is the likelier one once the
      new fixtures exist: (a) the trigger fired unconditionally -- a flat allowlist in trigger
      clothing, so re-read the scope-intersection predicate; or (b) a file in this plan's scope
      legitimately gained a baseline entry, most plausibly the new test module if its fixtures
      carry hashed_secret-shaped literals, in which case the row is behaving correctly and the
      fixtures should carry empty results values instead. Diagnose by checking whether any scope
      file is now a key in .secrets.baseline before touching the predicate.
  - step: 3
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: secrets-baseline-keys-read-from-real-baseline
    action: >-
      Assert the new union reader returns the real repo baseline's filename keys, so the predicate
      is exercised against real data rather than only synthetic fixtures.
    command: >-
      bin/venv-python -c "import json,subprocess;from pathlib import Path;import
      scripts.checks.verification.validate_scope_boundary as
      m;wt=set(json.load(open('.secrets.baseline'))['results']);head=set(json.loads(subprocess.run(['git','show','HEAD:.secrets.baseline'],capture_output=True,text=True).stdout)['results']);k=m._secrets_baseline_keys('.secrets.baseline',Path('.'),'HEAD',[]);assert
      k,'reader returned an empty key set';assert k==wt|head,(k,wt,head);print('OK')"
    expected: >-
      prints OK. The assertion is STRUCTURAL -- the reader's output equals the union of the
      working-tree and base-ref results-level key sets, and is non-empty. Neither the key count
      NOR any individual filename is pinned. Measured: the results file-key count moved
      0 -> 1 -> 2 -> 6 across 89c87ff2, 7b67e21d and 939eb789 (entry count 0 -> 9 -> 13 -> 20), so
      a graduated guard naming either the count or a filename would red for reasons unrelated to
      the property under test.
    fix_if: >-
      An empty set means the reader is looking at the wrong JSON level (keys live under
      results, not at the document root).
  - step: 4
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an already-graduated check: this is verbatim the command
      scope-boundary-rejects-unsanctioned-path.yaml will run once this plan's scope row repoints
      it at the package, so graduating it again would register two registry rows executing one
      selector.
    action: Run the decomposed mirror package -- every pre-existing leg plus the new row's arms.
    command: bin/venv-python -m pytest tests/checks/verification/validate_scope_boundary/ -q
    expected: all tests pass; the pre-existing legs are moved verbatim, so any failure there is a move defect
    fix_if: >-
      An ImportError on `from .conftest import ...` means a helper was left behind in a test_*
      module; a NameError means it was not re-exported from conftest.
  - step: 5
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates an already-graduated check: scope-boundary-prose-surfaces-carry-the-rule already
      runs `pytest tests/test_scope_boundary_contract.py tests/test_pr_ci_red_protocol_contract.py
      -q`, so this selector is standing-guarded today and needs no second registry row.
    action: Run the contract pin test with the re-grounded unmodelled_companions assertion.
    command: bin/venv-python -m pytest tests/test_scope_boundary_contract.py -q
    expected: all pass, including the re-grounded pin and the >=3 conditional-row assertion (now 4 rows)
    fix_if: >-
      test_unmodelled_companions_present failing means the pin was not re-grounded alongside the
      contract edit.
  - step: 6
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-mirror-maps-to-package
    action: Assert the mirror mapper resolves the check module to the package, not the deleted flat file.
    command: >-
      bin/venv-python -c "from pathlib import Path;from scripts.test_coverage_checker import
      map_source_to_test;t=map_source_to_test(Path('scripts/checks/verification/validate_scope_boundary.py'));assert
      t.is_dir(),t;assert t.name=='validate_scope_boundary',t;print('OK')"
    expected: prints OK
    fix_if: >-
      A path ending in test_validate_scope_boundary.py means the module was not added to
      _CONCERN_SPLIT_TEST_PACKAGES.
  - step: 7
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates step 6's graduated scope-boundary-mirror-maps-to-package assertion at a weaker
      altitude -- step 6 pins the mapper's resolved path directly, where this step would only
      re-run the suite that contains it.
    action: >-
      Run the mapper test package, including the new per-entry case for this registration -- the
      red/green guard behind step 6's assertion.
    command: bin/venv-python -m pytest tests/test_coverage_checker/test_coverage_checker_map.py -q
    expected: all pass, including the new concern-split case for validate_scope_boundary
    fix_if: >-
      A failure naming the flat test path means the _CONCERN_SPLIT_TEST_PACKAGES entry is missing
      or misspelled -- the set is keyed by repo-relative source path, not module name.
  - step: 8
    phase: pre-deploy
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-flat-test-path-unreferenced
    action: >-
      Stale-reference sweep for the retired surface (Closure Obligation, Delete row): no tracked
      file outside docs/plans/ still names the flat test path, and the graduated shard names the package.
    command: >-
      bash -c "! git grep -qI 'tests/checks/verification/test_validate_scope_boundary\.py' --
      ':!docs/plans/' && grep -q 'tests/checks/verification/validate_scope_boundary/'
      config/agent/verification_registry/entries/scope-boundary-rejects-unsanctioned-path.yaml &&
      echo OK"
    expected: prints OK
    fix_if: >-
      A git-grep hit names the file still carrying the dead path -- most likely the graduated
      registry shard, whose check_spec.command is materialized and executed by
      scripts/verification_graduation.py. Do NOT normalize the pattern's `\.` escape to a bare
      dot: this step's own graduated shard will contain the literal pattern text, and the escape
      is the only reason the grep does not match its own shard and red forever.
  - step: 9
    phase: pre-deploy
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Kernel-expressible as command_exit_zero, but it asserts against THIS session's transient
      working tree and names this plan's own path; there is no stable standing form once the plan
      is merged and its diff is history.
    action: >-
      Dogfood the enforcing leg against this plan's own working tree via the injection seam, the
      way the check's docstring intends -- the whole diff must sit inside declared scope.
    command: >-
      bin/venv-python -c "from pathlib import Path;from
      scripts.checks.verification.validate_scope_boundary import
      validate_scope_boundary;f=[];validate_scope_boundary(f,plan_paths=['docs/plans/PLAN-secrets-baseline-sanction-row.yaml'],root=Path('.'));print(f);assert
      not f,f"
    expected: an empty findings list -- every touched path is declared scope or a sanctioned companion
    fix_if: >-
      A finding names an undeclared touched path. Per the contract's disposition_on_violation this
      is never resolved by appending to this plan's own scope; stop and raise the amendment.
  - step: 10
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: Fast-tier presubmit over the whole change.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: >-
      validate_sloc_limits failing on a new test module means the split landed uneven -- rebalance
      across the package rather than registering a budget.
  - step: 11
    phase: pre-deploy
    hermetic: false
    graduation: not-applicable
    action: >-
      Full-tier presubmit, the handoff gate this plan's handoff_policy declares -- ruff, mypy,
      pytest, DQ runner and the verifier harness over the complete tree. This is the tier that
      went red on c1f818f, so it is the tier that must be green before handoff.
    command: bin/venv-python -m scripts.validate
    expected: exit 0, completed (not timed out)
    fix_if: >-
      A timeout is `timeout_disposition: blocked` -- resume later and rerun the full tier from the
      start rather than reporting a partial pass. A scope-boundary failure here names an
      undeclared touched path; per the contract's disposition_on_violation, stop and raise the
      amendment rather than appending to this plan's scope.
  - step: 12
    phase: post-deploy
    action: >-
      After the squash-merge lands with the Resolves trailer, confirm rec-autoclose closed all
      three bundled recommendations.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --sync && bin/venv-python -c "import json,pathlib;rows={json.loads(l)['id']:json.loads(l)['status']
      for l in pathlib.Path('logs/.recommendations-log.jsonl').read_text().splitlines() if
      l.strip()};print({k:rows.get(k) for k in ['rec-3570','rec-3375','rec-3399','rec-3110']});assert
      all(rows.get(k)=='closed' for k in ['rec-3570','rec-3375','rec-3399']),rows;assert
      rows.get('rec-3110')=='superseded',rows"
    expected: >-
      the three bundled recs report closed, and rec-3110 reports superseded (it is closed by the
      explicit update_rec call, not by rec-autoclose)
    fix_if: >-
      A bundled rec still open means the Resolves trailer was omitted or misspelled in the
      squash-merge commit body. rec-3110 still open means the explicit update_rec call was skipped.
      Close either through the portal -- never by editing the read cache (AGENTS.md
      Warehouse-as-source-of-truth: a read cache is never a write source).
test_obligations:
  - source: scripts/checks/verification/validate_scope_boundary.py
    behavior: >-
      The scope_file_in_secrets_baseline branch derives .secrets.baseline only when a declared
      scope file is a baseline results key (base-ref union working-tree), derives nothing
      otherwise, and reports rather than raises on an unparseable baseline.
    verification_step: 4
    test_selector: tests/checks/verification/validate_scope_boundary/test_secrets_baseline_row.py
    red_green_expectation: >-
      Red before -- the kind is unimplemented, so _row_derived_paths returns None and the check
      fails loud on the contract row. Green after, with the negative and unparseable arms failing
      again against a mutated predicate that ignores the scope intersection.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: >-
      The contract carries the conditional sanction row the evaluator dispatches on, and no longer
      claims .secrets.baseline is an unmodelled companion whose STOP is deliberate.
    verification_step: 5
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: >-
      Red before on the re-grounded pin (the row does not exist yet); green after. The row is
      enforcement data, not prose -- Decision 168 clause 2 makes it a rule only once the evaluator
      dispatches on it, which step 4 proves.
  - source: scripts/test_coverage_checker.py
    behavior: map_source_to_test resolves the check module to the mirror package directory.
    verification_step: 7
    test_selector: tests/test_coverage_checker/test_coverage_checker_map.py
    red_green_expectation: >-
      Red before -- the mapper returns the flat file this plan deletes; green after the
      _CONCERN_SPLIT_TEST_PACKAGES registration.
  - source: config/agent/verification_registry/entries/scope-boundary-rejects-unsanctioned-path.yaml
    behavior: >-
      The graduated check_spec.command targets a path that exists, so
      scripts/verification_graduation.py can still materialize and execute it.
    verification_step: 8
    command: grep -q 'tests/checks/verification/validate_scope_boundary/' config/agent/verification_registry/entries/scope-boundary-rejects-unsanctioned-path.yaml
    waiver_reason: >-
      A graduated registry shard is declarative check data with no branch a unit test could
      exercise; its correctness property is exactly that the command it names resolves, which step
      8 asserts directly and step 4 executes. A dedicated test would restate the grep at a weaker
      altitude.
constraints:
  - No rescue agents or workaround loops (Decision 55) -- an unparseable baseline reports via failed, never raises, never silently derives nothing.
  - >-
    Decision 170 -- the new branch adds no second terminal declaration; findings ride `failed` and
    registry.examined(len(resolved)) stays the sole declaration per dispatch.
  - >-
    Decision 159 -- the base-ref baseline read reuses the check's existing
    `_common.push_context_base(root) or "origin/main"` value, never a freshly-resolved origin/main.
  - >-
    Decision 131 clause 2 -- shared helpers live in conftest.py and are consumed via
    `from .conftest import ...`; no test_* module imports another test_* module.
  - >-
    Decision 128/130 -- the test-file crossing is resolved by decomposition, never a
    config/sloc_budgets.yaml raise; no `# raise-approved:` marker is owed by this plan.
  - >-
    Decision 181 CONTENT -- re-grounding the pin must keep assertion strength (assert the row, its
    kind, its path_template, and the negative case), never weaken it to obtain green.
  - >-
    The baseline union is read at most once per dispatch and the unparseable-baseline finding is
    appended at most once, so N resolved plans do not mean N `git show` subprocesses.
