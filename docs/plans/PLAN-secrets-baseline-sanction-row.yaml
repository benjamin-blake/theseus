  - "rec-3110 ('planning skill should declare .secrets.baseline scope up front') is falsified by this change -- it prescribes the hand-tracked scope row this contract row exists to remove. Verified open. Its canonical target status is SUPERSEDED (this plan's sanction row is the superseding surface); 'contradicted' is not a canonical status -- the vocabulary is open/closed/failed/declined/superseded. It is deliberately NOT in bundled_recommendations, so rec-autoclose will not reach it: it is closed by an explicit update_rec call, verified by VP step 12."
  - "Adjacent open recs deliberately NOT bundled (same file, different defects): rec-3545 (frozen_report_key companion), rec-3368 (inert on plan-less diffs), rec-3361, rec-3435, rec-3360, rec-3512, rec-3528."
  - "Branch was 3 commits behind main at planning time; overlapping scope files: none. No rebase owed at planning time."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Sibling precedent read before decomposing: tests/checks/verification/validate_graduation_completeness/{conftest.py,test_plan_leg.py}"
execution_steps:
  - >-
    docs/contracts/implement-scope-boundary.yaml -- add the secrets_baseline_regeneration
    sanction row: purpose naming the hook's forced write, trigger {kind:
    scope_file_in_secrets_baseline, baseline_path: .secrets.baseline, description naming the
    base-ref union working-tree read}, sanctions.path_template ".secrets.baseline",
    prohibited_field_edits []. The trigger.description must also record the residual, in
    writing, per the declare-your-coverage discipline this contract itself hosts (Decision 181
    point 2, generalizing Decision 163 point 2): the predicate is NARROWER than the condition that
    forces the write. The residual's SINGLE home is trigger.description (not known_gaps) -- VP
    step 1 asserts the substring 'rescans the whole repo' there, so the discipline is discharged
    executably rather than in prose. The text must also record the alternative framing considered
    and rejected: intersecting the DIFF's changed files with the baseline key set would match the
    condition that forces the regeneration and close this residual, but was rejected because every
    other row in this map derives from plan properties rather than diff properties, and sanctioning
    the diff from the diff is near-circular. detect-secrets rescans the whole repo, so a regeneration can add keys for
    files outside the regenerating plan's scope -- observed at 939eb789, whose baseline delta
    added a key for docs/plans/PLAN-terraform-state-triggers-restore.yaml, a file outside the
    change's own subject matter. The intersection is also taken against DECLARED scope only, never
    the derived sanctioned set, so a baseline-key file reached only through another row's derived
    path does not fire this one. Both cases still STOP, by design. All three measured occurrences
    are covered; this is a declaration gap, not a design refutation.
  - >-
    docs/contracts/implement-scope-boundary.yaml -- delete the .secrets.baseline entry from
    unmodelled_companions, keeping config/composite_action_body_baseline.yaml; append the dated
    amendment_log entry (date 2026-09-04, semantic_break false, change_class field_add) carrying
    the falsifying measurement and the Decision 75 conscious-choice note from Context.
  - >-
    scripts/checks/verification/validate_scope_boundary.py -- add `_secrets_baseline_keys(baseline_rel,
    root, base, failed)` returning the union of results-map filename keys from the working-tree
    baseline and the baseline at `base`. Working tree: missing file derives nothing silently
    (no baseline, no churn); unparseable JSON appends a finding. Base ref: a non-zero `git show`
    (unresolvable ref, or path absent at base) contributes nothing silently, mirroring
    _plan_content_at_ref; unparseable JSON at base appends a finding. Never raise.
  - >-
    scripts/checks/verification/validate_scope_boundary.py -- add the
    `scope_file_in_secrets_baseline` branch to _row_derived_paths, returning
    [sanctions.path_template] when plan_scope_files intersects the key set and [] otherwise.
    Thread root/base/failed plus a per-dispatch memo (created in _enforce before the plan loop) so
    the union is read at most once and the unparseable finding is appended at most once. KEY THE
    MEMO ON baseline_path, not a single unkeyed slot: baseline_path is a per-row field, and the
    contract is explicitly designed to grow (re_ratification_trigger fires at >= 6 rows), so an
    unkeyed memo would silently hand a future second row this row's key set.
  - >-
    Decompose tests/checks/verification/test_validate_scope_boundary.py into
    tests/checks/verification/validate_scope_boundary/ -- empty __init__.py; conftest.py homing
    every cross-boundary helper plus a new _write_baseline and the new row in
    _DEFAULT_SANCTION_ROWS; test_plan_legs.py (TestPlanOnlyLeg, TestSkippedBase,
    TestPlanPathsOverride, TestAccounting) and test_enforcing_leg.py (TestEnforcingLeg), both
    moved verbatim. Delete the flat file.
  - >-
    tests/checks/verification/validate_scope_boundary/test_secrets_baseline_row.py -- EIGHT arms,
    one per branch, because neither changed module carries a config/coverage_baseline.yaml entry
    and validate_test_coverage therefore holds both to the 100% per-file floor. That check is
    full-tier only (full_segment="full_after_lint", no pre=True), so the arms are gated by VP step
    11, not step 10; validate_diff_coverage rides --pre but is REPORT ONLY and never fails a
    build. Fixture baselines must carry EMPTY results values (e.g. {"results": {"scripts/x.py":
    []}}) so no fixture literal can trip the real detect-secrets hook and make this module itself
    a baseline key. The arms: (1)
    scope file is a working-tree baseline key -> sanctioned; (2) no scope file in the baseline ->
    NOT sanctioned, the diff still fails; (3) key only at the base ref -> entry-removal diff,
    sanctioned; (4) key only in the working tree -> additive re-baselining, sanctioned; (5)
    baseline absent from both -> derives nothing, no finding; (6) baseline unparseable in the
    WORKING TREE -> finding appended, no raise; (7) baseline unparseable AT THE BASE REF ->
    finding appended, no raise; (8) `git show <base>:.secrets.baseline` returns non-zero (absent
    at base, present in the working tree) -> the base half contributes nothing SILENTLY, no
    finding, and the working-tree half still sanctions. Arms 6 and 7 also assert the finding is
    appended at most once per dispatch.
  - >-
    scripts/test_coverage_checker.py -- add
    "scripts/checks/verification/validate_scope_boundary.py" to _CONCERN_SPLIT_TEST_PACKAGES.
  - >-
    config/agent/verification_registry/entries/scope-boundary-rejects-unsanctioned-path.yaml --
    repoint check_spec.command from the flat test path to
    tests/checks/verification/validate_scope_boundary/.
  - >-
    tests/test_scope_boundary_contract.py -- re-ground test_unmodelled_companions_present per the
    Decision 181 constraint: assert .secrets.baseline is NOT in unmodelled_companions, that
    sanction_rows.secrets_baseline_regeneration carries trigger.kind
    scope_file_in_secrets_baseline and path_template .secrets.baseline, and that
    config/composite_action_body_baseline.yaml remains unmodelled.
  - >-
    Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop
    and RCA (Decision 55).
  - >-
    File the Decision 75 follow-on rec (evaluate reconfiguring the detect-secrets pre-commit hook
    so the tracked baseline stops mutating) via scripts.ops_data_portal, and record the returned
    id in this plan's followon_recs. The rec MUST name the option this plan's conscious-choice
    note did not enumerate -- a local post-processing hook that strips line_number and pins
    generated_at after detect-secrets writes the baseline -- alongside the three already
    considered and rejected, so the follow-on does not re-derive them. Propose closing rec-3110
    as SUPERSEDED (the canonical status; not 'contradicted') via an explicit update_rec call,
    naming this plan's contract row as the superseding surface -- rec-autoclose cannot reach it,
    since it is deliberately not bundled. VP step 12 verifies the resulting status.
  - >-
    Name Resolves: rec-3570, rec-3375, rec-3399 in the squash-merge commit body so
    rec-autoclose.yml fires (step 12 verifies).
  - 'Report: what was implemented, verification results'
work_areas: []
rollback: >-
  Revert the single squash commit. The sanction row is additive enforcement data -- reverting it
  restores the pre-change STOP without leaving residue, since no other surface consumes the new
  trigger kind. The test decomposition reverts with it as one unit; leaving the decomposition
  while reverting the row would strand _CONCERN_SPLIT_TEST_PACKAGES and the graduated shard
  pointing at a package that no longer exists.
