schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-cache-token-totals
intent: >-
  Make the telemetry token classes reconcile (rec-4333): state in the telemetry_observations contract that tokens_input is
  uncached prompt tokens only, disjoint from tokens_cache_read and tokens_cache_creation, and make the agent-run token
  rollup carry all four classes. Slice 4 (rec-4025) can then reconcile derived totals against Claude Code's four-class
  modelUsage, and the executor's LiteLLM producer (rec-4028) has one definition to normalise every provider to.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-cache-token-totals.yaml
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake), a read-layer follow-on to PLAN-telemetry-reader-verbs (#1481, rec-4291),
  carried by rec-4333 from the cache-aware telemetry review (Benjamin chose "Write it" on 2026-10-15 and approved the
  contract wording verbatim, thread "Cache-aware telemetry review"). Closes no exit criterion.
closes_criteria: []
scope:
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    Class A governance note, texts verbatim from execution_steps[1]: tokens_input's description and semantics (uncached
    prompt tokens only; the four classes are disjoint; total prompt = tokens_input + tokens_cache_read +
    tokens_cache_creation, derived at read, never stored), one appended semantics sentence each on tokens_cache_read and
    tokens_cache_creation, one amendment_log entry on each of the three fields and one contract-level entry. No type,
    nullability, dq_intent, derivation or other field changes.
- file: docs/contracts/telemetry_agents.yaml
  action: Modify
  purpose: >-
    Two read-derived fields after tokens_output_total, tokens_cache_read_total and tokens_cache_creation_total (texts in
    execution_steps[2]), mirroring tokens_input_total and tokens_output_total: derivation timing read, derived_by
    reader_verb:agent_run_token_rollup, no physical column, realized false. governance_notes names the four totals; one
    contract-level amendment_log entry.
- file: src/common/ducklake_event_read_sql.py
  action: Modify
  purpose: >-
    Created by the reader verbs build. The agent_run_token_rollup query also returns tokens_cache_read_total and
    tokens_cache_creation_total, summed over the same deduped, entity-collapsed model_call rows as the two existing totals
    and following the same empty-session convention, appended after tokens_output_total.
- file: src/common/ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    CONDITIONAL. Created by the reader verbs build. Touch it only if agent_run_token_rollup's entry declares its output
    columns or description text here; then add the two columns or name the four classes. Otherwise leave it unchanged.
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: VERB_FIELDS["agent_run_token_rollup"] gains tokens_cache_read_total and tokens_cache_creation_total after tokens_output_total.
- file: tests/common/test_ducklake_event_reads.py
  action: Modify
  purpose: >-
    CONDITIONAL. Created by the reader verbs build. Touch it only if it pins agent_run_token_rollup's read_version digest
    or output columns; then re-pin to the new query. Otherwise leave it unchanged.
- file: tests/common/test_ducklake_event_read_verbs.py
  action: Modify
  purpose: >-
    Created by the reader verbs build. New node test_agent_run_token_rollup_carries_cache_classes: over model_call rows
    with non-zero tokens in all four classes, including a duplicate delivery of one call, the rollup returns each total as
    the per-class sum over the deduped rows, the duplicate counted once, and no cache tokens folded into
    tokens_input_total. Second new node test_agent_run_token_rollup_empty_session_shares_one_convention: for a session
    with no model_call rows the two new totals carry exactly the empty value tokens_input_total carries (NULL or 0, as the
    reader verbs build chose).
- file: tests/telemetry/fixtures/derivation_cases.yaml
  action: Modify
  purpose: >-
    Created by the reader verbs build. The agent-run token golden cases carry expected tokens_cache_read_total and
    tokens_cache_creation_total, and their model_call fixture rows carry non-zero cache classes, so the existing golden
    node also asserts the new columns.
- file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
  action: Modify
  purpose: >-
    New class TestTokenClassesDisjoint, node test_tokens_input_is_uncached_and_rollup_covers_four_classes: tokens_input's
    semantics state that it excludes both cache classes, that total prompt is the sum of the three, and name its coverage
    (tests/turn_capture/test_observations.py and rec-4028); both cache fields state they are disjoint from tokens_input;
    each of the three fields' newest amendment_log entry is governance_note_add with semantic_break true; telemetry_agents
    carries tokens_cache_read_total and
    tokens_cache_creation_total with read-timed derivations from reader_verb:agent_run_token_rollup over their own
    observation column on model_call rows, realized false.
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    CONDITIONAL. Touch it only if, after the reader verbs build, it enumerates agent_run_token_rollup's output columns;
    then add the two columns with an amendment_log entry. Otherwise leave it unchanged.
bundled_recommendations:
- rec-4333
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  telemetry_observations.yaml's tokens_input description and semantics, and the appended tokens_cache_read and
  tokens_cache_creation sentences, equal the approved texts in execution_steps[1] (the date in each amendment_log entry is
  the landing date); no other field of that contract changes.
- >-
  telemetry_agents.yaml carries tokens_cache_read_total and tokens_cache_creation_total as read-derived fields from
  reader_verb:agent_run_token_rollup with no physical column, and its governance_notes names all four totals.
- >-
  agent_run_token_rollup returns tokens_input_total, tokens_output_total, tokens_cache_read_total and
  tokens_cache_creation_total, each the sum of its own class over the session's deduped model_call rows; a duplicate
  delivery counts once and cache tokens never appear in tokens_input_total. A session with no model_call rows gets the
  same empty value in all four totals.
- VERB_FIELDS for agent_run_token_rollup equals the verb's output columns (the reader verbs build's parity node passes).
- >-
  config/lambda/ducklake/field_semantics.yaml is unchanged: descriptions and read-derived fields are not projected, so the
  telemetry writer's row rules do not change.
- >-
  The governed deploy of the merge commit is green, and the deployed reader returns all four totals for a smoke session
  with model_call rows.
- rec-4333 is closed by the squash merge's Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Precondition. The reader verbs build is merged and this branch contains it.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    src/common/ducklake_event_read_sql.py && grep -q agent_run_token_rollup src/common/ducklake_event_read_verbs.py &&
    echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    The reader verbs build is not on main yet: stop and wait for it (it waits on rec-4320's fix-forward). Do not create
    the event-read modules here.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A sequencing precondition satisfied by another plan's build, not a behaviour of this change; as a standing guard it
    would only re-assert that the reader verbs build exists.
- step: 2
  phase: pre-deploy
  action: The two contracts declare the four classes disjoint and the rollup's two new derived totals.
  command: >-
    bin/venv-python -m pytest
    tests/checks/contracts/test_telemetry_event_journal_contracts.py::TestTokenClassesDisjoint::test_tokens_input_is_uncached_and_rollup_covers_four_classes
    -q
  expected: Exit 0, the node passes. Red before because the node is absent and the contracts lack the text and fields.
  expected_literals: []
  fix_if: >-
    A text mismatch means the contract wording drifted from the approved texts in execution_steps[1] and [2]; restore the
    approved wording, never loosen the assertion.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-token-classes-contract
- step: 3
  phase: pre-deploy
  action: The rollup sums every class over the deduped rows and the existing token golden cases and VERB_FIELDS parity still hold.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_event_read_verbs.py::test_agent_run_token_rollup_carries_cache_classes
    tests/common/test_ducklake_event_read_verbs.py::test_agent_run_token_rollup_empty_session_shares_one_convention
    tests/common/test_ducklake_event_read_verbs.py::test_agent_run_state_and_tokens_golden_cases
    tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns
    tests/common/ducklake_reader_client/test_verb_fields_parity.py -q
  expected: Exit 0, every node passes. The first two are red before because they are absent.
  fix_if: >-
    A total off by one call's tokens means the sum runs before the entity collapse; sum over the same deduped rows as
    tokens_input_total. Cache tokens in tokens_input_total means the SQL adds classes together; keep each sum to its own
    column. An empty session whose new totals differ from tokens_input_total's empty value (0 against NULL, or the
    reverse) means a COALESCE slipped onto one sum; use one convention for all four. A parity failure means VERB_FIELDS and
    the SQL disagree on columns or order; fix VERB_FIELDS.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The module imports duckdb through a module-level importorskip and the fast tier excludes duckdb (requirements-fast.txt
    heavy-exclusion), so the venv-less PR tier collects nothing; the nodes are not integration-marked, so the full tier
    (pre-handoff and on main) runs them.
- step: 4
  phase: pre-deploy
  action: The writer's projection is unchanged, so no telemetry writer rule or config changes.
  command: bin/venv-python -m scripts.schema_to_field_semantics --check && echo PROJECTION_UNCHANGED
  expected: Exit 0, then PROJECTION_UNCHANGED.
  expected_literals: []
  fix_if: >-
    Drift means a contract edit reached a projected axis (type, nullability, dq_intent or a non-derived field); revert that
    part. This plan changes prose and read-derived fields only.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    validate_field_semantics_drift already runs the same byte comparison in every tier, so a second registry guard would
    duplicate it.
- step: 5
  phase: pre-deploy
  action: Every modified source file has its test file and full coverage of new code.
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
    src/common/ducklake_event_read_sql.py src/common/ducklake_event_read_verbs.py src/common/ducklake_reader_client.py
  expected: Exit 0.
  fix_if: >-
    A coverage gap on the new sums needs a direct assertion in test_agent_run_token_rollup_carries_cache_classes. Drop
    src/common/ducklake_event_read_verbs.py from --files if its CONDITIONAL row did not apply.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Coverage over the duckdb-backed nodes needs the full venv, which the venv-less PR tier lacks; the full tier's coverage
    gate covers it on main.
- step: 6
  phase: pre-deploy
  action: Lint and run the full tier, as the handoff policy requires before commit.
  command: >-
    bin/venv-python -m ruff check src/common tests/common tests/checks/contracts && bin/venv-python -m scripts.validate
  expected: Exit 0 from both.
  fix_if: Fix the reported finding at its root (Decision 55); never skip, disable or quarantine a test.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, every job included. Read with mcp__github__actions_list
    (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs for that run,
    writing the jobs JSON to $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
    want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke']; assert all(any(n.startswith(w)
    and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: >-
    A failed deploy or reader smoke step is this plan's to root-cause and fix forward, never a re-run to green (Decision
    55). A red lambda-telemetry writer step is not this plan's change (the writer is untouched): report it to the
    coordinator and bind this step to the next green deploy run of main that contains MERGE_SHA.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Positive live derivation. Over a 7-day sessions_window_all_purposes call on the smoke catalog, the deployed reader
    returns agent_run_token_rollup rows carrying all four totals for the first session with a non-zero token total (so an all-zero empty session cannot satisfy it).
  command: >-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python
    -c "import datetime as d,json;from scripts.ducklake_smoke import core; u=core._function_url('reader');
    n=d.datetime.now(d.timezone.utc);t=n.date(); w=core._sigv4_invoke(u,{'action':'named_read','verb':'sessions_window_all_purposes','params':{'day_from':str(t-d.timedelta(days=6)),'day_to':str(t),'as_of':n.isoformat()}}).json();
    assert w['ok'] and w['row_count']>=1, w.get('row_count'); k=('tokens_input_total','tokens_output_total','tokens_cache_read_total','tokens_cache_creation_total');
    rows=[r for s in w['rows'][:20] for r in core._sigv4_invoke(u,{'action':'named_read','verb':'agent_run_token_rollup','params':{'session_id':s['session_id']}}).json().get('rows',[])];
    hit=[r for r in rows if any((r.get(x) or 0)>0 for x in k)]; assert hit, 'no session with a non-zero token total'; r=hit[0];
    assert all(x in r for x in k), sorted(r); print(json.dumps({x:r[x] for x in k}));print('LIVE_ROLLUP_OK')"
  expected: One JSON line with the four totals for a smoke session, then LIVE_ROLLUP_OK.
  fix_if: >-
    A missing key means the deployed reader predates the merge or the SQL change did not reach the bundle; check the
    deploy run's head SHA. No session with model_call rows in the window means the smoke rows carry none; record that in the
    report and rely on step 3's golden proof, never fabricate rows.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: rec-4333 is closed by the squash merge's Resolves trailer.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
    r=make_reader().named('recs_by_ids',ids='rec-4333'); assert r and r[0]['status']=='closed', r[0]['status'] if r else r;
    print('REC_CLOSED')"
  expected: REC_CLOSED.
  fix_if: >-
    Still open means the squash body lacked the Resolves trailer or the closure job failed; close it through the portal's
    update_rec with the merge SHA and the step 3 and step 8 evidence.
  hermetic: false
  graduation: not-applicable
