- Branch confirmed not on main; the reader verbs build is merged and on this branch (VP step 1)
- docs/PROJECT_CONTEXT.md read
- Decisions 199 (cl.1), 207 (reader rule) and 210 (cl.1, cl.4) read, only the cited clauses
- All files in scope located and readable, including the conditional rows
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Confirm the precondition (VP step 1). Read the reader verbs build's agent_run_token_rollup query, its verb entry, its
  golden token cases, VERB_FIELDS and any pinned read_version, and decide which CONDITIONAL rows apply.
- >-
  docs/contracts/telemetry_observations.yaml, texts verbatim. (a) tokens_input.description: "Uncached input (prompt) tokens
  for this model_call: the prompt tokens neither read from nor written to a provider prompt cache, stored once on its
  single point row." (b) tokens_input.semantics: keep the existing text "One of the four token classes stored on model_call
  (Decision 199, replacing the phase/step roll-up path). bigint." and append "The four token classes are disjoint.
  tokens_input excludes tokens_cache_read and tokens_cache_creation, so a model_call's total prompt is tokens_input +
  tokens_cache_read + tokens_cache_creation, derived at read and never stored. An inclusive export such as OpenTelemetry's
  gen_ai.usage.input_tokens is that sum. Anthropic's input_tokens already means this; a producer for a provider that
  reports an inclusive prompt total subtracts the cached tokens it reports (rec-4028 owns the per-provider mapping)." then
  append "Coverage (Decision 181 cl.2): the claude_code producer's one-to-one mapping is enforced by
  tests/turn_capture/test_observations.py; every other producer is an unenforced residual owned by rec-4028; the writer
  cannot decide disjointness from one row (Decision 210 cl.1)." (c)
  tokens_cache_read.semantics: append "Prompt tokens served from the provider's prompt cache; disjoint from tokens_input and
  tokens_cache_creation (see tokens_input)." (d) tokens_cache_creation.semantics: append "Prompt tokens written to the
  provider's prompt cache; disjoint from tokens_input and tokens_cache_read (see tokens_input). A provider with no
  cache-write class records 0." (e) An amendment_log entry on each of the three fields: {date: <landing date>,
  semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the four
  token classes are disjoint; tokens_input is uncached prompt tokens only and total prompt is the sum of the three,
  derived at read.", migration_story: "No stored row changes: the claude_code producer already copies Anthropic usage,
  whose input_tokens excludes cache reads and writes, and no reader consumes the classes yet."} (fields without an
  amendment_log gain one). semantic_break is true because a description/semantics diff under any change_class other than
  prose_improvement must say so (scripts/contracts_enforcement.py _amendment_entry_consistent, validate_contract_drift
  category 6; the 2026-09-24 entries on these fields set the precedent). (f) A contract-level amendment_log entry, newest
  first: {date: <landing date>, semantic_break: true, change_class: governance_note_add, summary:
  "PLAN-telemetry-cache-token-totals (rec-4333): the four token classes are declared disjoint (tokens_input is uncached
  prompt tokens only). Per-field changes are on their own fields' logs.", migration_story: "No stored row changes; see the
  field entries."}
- >-
  docs/contracts/telemetry_agents.yaml. After tokens_output_total add tokens_cache_read_total: {type: int, iceberg_type:
  bigint, nullable: true, description: "Total cache-read tokens across the agent run. DERIVED at read via the child
  session's own model_call observations, same mechanism as tokens_input_total.", semantics: "A read-time aggregate over
  telemetry_observations rows sharing this run's session_id; no physical column. Disjoint from tokens_input_total and
  tokens_cache_creation_total (telemetry_observations.yaml tokens_input), so the run's total prompt is the sum of the
  three.", populated_by: "a named reader verb (agent_run_token_rollup), bounded to this run's calendar-day partition.",
  dq_intent: {not_null: {enforced: false}}, derivation: {timing: read, derived_by: "reader_verb:agent_run_token_rollup",
  formula: "sum(tokens_cache_read) over telemetry_observations WHERE session_id = this.session_id AND observation_type =
  'model_call'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type,
  telemetry_observations.tokens_cache_read], realized: false}, amendment_log: [{date: <landing date>, semantic_break: false,
  change_class: field_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): read-derived total of the session's
  model_call tokens_cache_read, returned by agent_run_token_rollup."}]}, then tokens_cache_creation_total, identical with
  cache-creation in place of cache-read (description "Total cache-creation tokens across the agent run. ...", semantics
