    invokes them; the ADMIN agent invokes them only under explicit human direction, confirming the
    ALTER and each rewrite (Decision 126 as amended by the new Decision; Decision 143 cl.2; 151 cl.2)
  - Calendar day for every table (human direction 2026-09-26) -- no grain change, no edit to the landed spec, guards or contracts' partition_by
  - Governed deploy only via deploy-ducklake-lambdas.yml (Decision 125/126); never build_lambda --ducklake-only --deploy
