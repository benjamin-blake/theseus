schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ducklake-partition-layout-remediation"
intent: >-
  Bring the five live DuckLake ops history tables (still on the day-of-month day() transform) onto
  the declared calendar-day spec and rewrite their day-of-month-laid files (rec-4070), through two
  operator-only maintenance verbs an ADMIN-container agent runs under explicit human direction,
  Decision 204 sanctioning the row-preserving rewrite, and evidence-based closure -- so the durable
  ops substrate's physical layout matches its declared contract.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-partition-layout-remediation.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
scope:
  - file: src/common/ducklake_partition_layout.py
    action: Create
    purpose: >-
      READ HALF ONLY (critique r1: the reader holds the same owner-privileged Neon credential as the
      writer, so mutating code must never ship in the reader bundle). PINNED API, consumed verbatim by
      PLAN-ducklake-partition-drift-alarm: class PartitionLayoutError(DuckLakeRuntimeError); frozen
      dataclass TableLayout(physical, table_class, live_transforms: tuple[tuple[str, str], ...],
      active_scheme_id: int | None, live_files: int, legacy_scheme_files: int);
      read_partition_layout(con, *, catalog_alias=CATALOG_ALIAS, semantics=None) -> dict[str,
      TableLayout] reading __ducklake_metadata_<alias> live rows only (ducklake_table,
      ducklake_partition_info/partition_column + ducklake_column names, ducklake_data_file with
      end_snapshot IS NULL; Decision 88 cl.1 -- live-file metadata columns only), classifying every
      enumerated table through ducklake_maintenance_scope.build_registry / classify_table (Decision
      191 -- registry, never name patterns; unclassified tables collected, ONE PartitionLayoutError
      after the loop); legacy_scheme_files counts live files whose partition_id IS DISTINCT FROM the
      active scheme id (partition_id names the SCHEME, never a value, per #1278; NULL = pre-partition
      = legacy); frozen dataclass PartitionDrift(physical, table_class, declared_spec: str,
      declared: tuple[tuple[str, str], ...], live: tuple[tuple[str, str], ...], legacy_scheme_files)
      -- declared_spec is the resolved spec text alter_to_declared issues verbatim, declared/live
      are normalize_partition_spec's (unit, column) pairs, the same shape as live_transforms;
      compare_to_declared(layouts, *, semantics=None) -> list[PartitionDrift] resolving declared
      specs via resolve_table_spec / resolve_control_spec + normalize_partition_spec. A
      DuckLakeMaintenanceScopeError from the registry, and any raw duckdb.Error from the metadata
      reads, is re-raised as PartitionLayoutError, so every failure is a DuckLakeRuntimeError. PINNED:
      the wrap PRESERVES the original message and chains it (raise PartitionLayoutError(f"...: {exc}")
      from exc) -- the reader's warm-connection reopen matches dead-session text in str(exc), so a
      text-dropping wrap would turn a Neon scale-to-zero into a typed 500. Imports scd2_schema / control_tables /
      maintenance_scope / partition_spec only. < 500 SLOC
  - file: src/common/ducklake_partition_rewrite.py
    action: Create
    purpose: >-
      MUTATE HALF, maintenance bundle only. class PartitionRewriteError(DuckLakeRuntimeError); a
      non-OCC duckdb error is wrapped in it, message preserved and chained (structured 500, never a
      raw FunctionError).
      alter_to_declared(con, drifts) issues ALTER ... SET PARTITIONED BY <PartitionDrift.declared_spec>
      only where the live spec differs (no-op-free, data-modeling-standard write invariants), one
      table per transaction under the same OCC retry policy as the rewrite (a conflict retries,
      the ceiling raises PartitionRewriteError).
      rewrite_legacy_layout(con, physical, ...): refuses when the registry side is not 'history'
      (current projections are rebuilt from history per Decision 81 cl.8, never re-laid; control is
      refused by its matrix cell), when legacy_scheme_files == 0, or when the live spec still
      differs from declared (ALTER first). Per attempt, INSIDE one transaction: capture
      pre_snapshot_id from <alias>.current_snapshot() (re-captured on every retry -- snapshot ids
      are catalog-global) and CALL <alias>.set_commit_message('rewrite_partition_layout',
      '<uuid>:pre=<pre_snapshot_id>') -- a unique per-attempt token, so one recovered snapshot row
      yields both ids -- then CREATE TEMP TABLE snap AS SELECT *, DELETE, INSERT FROM snap, then BEFORE COMMIT compare row
      count + a FULL-ROW, NULL-explicit content digest (each row cast as a whole to VARCHAR, e.g. a
      row/struct cast, so NULLs render and a column shift cannot collapse; ordered; hashed) of the
      table against snap, ROLLBACK + raise on any mismatch. A DuckLake transaction conflict retries
      with the writer's own policy -- import is_occ_collision, OCC_MAX_ATTEMPTS and _occ_backoff from
      ducklake_writes (Decision 81 cl.3; never a second retry policy) -- and raises at the ceiling.
      After commit, commit_snapshot_id is the snapshot whose commit_message equals that token --
      never 'the latest snapshot', which a concurrent writer commit could be (binding measured
      locally 2026-09-26 on duckdb 1.5.4 / DuckLake v1.0); re-prove count + digest at AT (VERSION =>
      commit) against AT (VERSION => pre) and
      zero legacy-scheme files; a post-commit proof failure RAISES with both snapshot ids and never
      auto-restores. Returns BOTH proof sides so the evidence oracle's equality is never a
      self-comparison: {physical, pre_snapshot_id, commit_snapshot_id, rows_pre, rows_commit,
      digest_pre, digest_commit, files_before, files_after, attempts}. Imports
      ducklake_partition_layout + ducklake_writes + scd2_schema + ducklake_maintenance_scope (the
      registry side for the history-only refusal -- the pinned TableLayout stays unwidened; the
      scope module is already a maintenance include). < 500 SLOC
  - file: src/common/ducklake_partition_spec.py
    action: Modify
    purpose: >-
      add normalize_partition_spec(spec) -> tuple[tuple[str, str], ...] mapping a declared spec to
      DuckLake's own ducklake_partition_column representation (year/month/day/hour -> (unit, col);
      bucket(N, col) -> ('bucket(N)', col); identity col -> ('identity', col) -- measured live
      2026-09-26: 'day', 'bucket(8)', 'identity'). Stays stdlib-only and NEVER imports either
      partition module (it ships in the smoke bundle, Decision 143)
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: VERB_UNIVERSE += ("reconcile_partitions", "rewrite_partition_layout") (Decision 191/192 -- per-table verbs are matrix-governed)
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      maintenance_policy cells for both verbs x {scd2, append_only, control}: reconcile_partitions
      apply true for all three (control compares its identity spec); rewrite_partition_layout apply
      true for scd2 and append_only, apply false for control with a reason (a writer-internal
      entity-id counter whose identity spec never changes; a delete-all rewrite would contend with
      allocation, Decision 84 I-2). The matrix header comment's 'single production consumer ...
      merge_ops' sentence names all three consumers, and its 'handler.py:396' line reference
      becomes a symbol reference (the _shared extraction shifts line numbers); the literal
      'CATALOG-WIDE VERBS TAKE NO CELL' stays verbatim (test_ducklake_gc_ops.py pins it)
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: regenerated projection only -- run scripts.schema_to_field_semantics, never hand-edit (T2.29:c8)
  - file: src/lambdas/ducklake_maintenance/_shared.py
    action: Create
    purpose: >-
      EXTENSION_DIRECTORY and _require_identifier (+ its regex) move here out of handler.py so
      partition_actions.py can use them without an import cycle, plus a NEW s3:// data_path guard
      helper used only by partition_actions (handler.py's per-action inline data_path guards are
      unchanged); handler.py re-binds the moved names so existing tests and callers are unaffected
  - file: src/lambdas/ducklake_maintenance/partition_actions.py
    action: Create
    purpose: >-
      action_reconcile_partitions {data_path (s3://), meta_schema, dry_run (default true)}: no-arg
      invokes refused (Decision 84/81 guard); scope via scope.resolve_scope(verb=
      'reconcile_partitions'); returns {layouts, drifts}; on dry_run=false it ALTERs, then RE-READS
      and returns {altered, layouts, drifts} as of AFTER the ALTER (step 19 expects zero spec drift
      and legacy counts equal to live_files within that same post-ALTER readout, less post-ALTER
      writer files -- a pre-ALTER readout would STOP the run).
      action_rewrite_partition_layout {data_path, meta_schema, table (physical), confirm}: refuses
      unless confirm == table (catalog_reinit's guard shape) and the table's class cell for
      rewrite_partition_layout applies; returns rewrite_legacy_layout's result verbatim. Both raise
      only DuckLakeRuntimeError subclasses -- scope.resolve_scope's DuckLakeMaintenanceScopeError (a
      bare RuntimeError) is wrapped in PartitionLayoutError -- so handler.py's existing mapping
      yields structured 500s
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      import from _shared and partition_actions (removing the moved definitions and `import re`);
      two _ACTIONS entries; and the module docstring's 'No LLM / agent invocation anywhere in this
      path' line restated at the same line count ('the scheduled path is agent-free; an
