      file a Critical rec with both snapshot ids -- and restoration of a HISTORY table is a
      separately planned operation using the NON-LOSSY formula rows(AT pre) UNION (rows(live) EXCEPT
      rows(AT commit)) under the same digest proof, never improvised in-session; current
      projections are never re-laid (the verb refuses them) and restore by rebuild-from-history
