  - file: docs/contracts/ducklake-partition-remediation.yaml
    action: Create
    purpose: >-
      NEW Class D mechanism contract (precedent: package-registry-reservation.yaml, #1239; Decision
      127 operator procedures live as procedure: blocks in a contract). Header copies that file's
