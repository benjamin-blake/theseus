      direction, Decision 204'); no other logic. Stays <= 500 SLOC (493 today; the removals pay for the
      imports -- decompose further rather than raise, Decision 128). ducklake_maintenance_smoke's
      dispatch is untouched (Decision 143 cl.2)
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: >-
      includes += src/lambdas/ducklake_maintenance/_shared.py, partition_actions.py,
      src/common/ducklake_partition_layout.py, src/common/ducklake_partition_rewrite.py; the notes'
      verb list gains reconcile_partitions / rewrite_partition_layout and its '(invoked via `aws
      lambda invoke`, not agent surfaces)' clause is restated for the Decision 204 carve-out (an
      ADMIN-container agent may invoke the two partition verbs under explicit human direction)
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      excludes += src/common/ducklake_partition_layout.py and src/common/ducklake_partition_rewrite.py
      beside the ducklake_* excludes. DECISION 79 NO-DEPLOY DISPOSITION: data-pipeline IS affected
      twice -- this manifest edit, and docs/ROADMAP-PLATFORM.yaml, one of its `assets:`, whose
      T2.19:c8 text this plan edits -- so its staged bundle DOES change, by that asset's text only.
      No deploy: the roadmap asset is inert data for the scheduled-agent dispatcher, whose schedule
