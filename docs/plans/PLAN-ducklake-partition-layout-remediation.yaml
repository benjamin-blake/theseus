bundled_recommendations: ["rec-4070"]
followon_recs: ["rec-4094", "rec-4095", "rec-4098"]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    reconcile_partitions reports every ops table's live-vs-declared partition drift and, with
    dry_run=false, ALTERs only the mismatched physical tables; rewrite_partition_layout re-lays the
    whole table only when it has legacy-scheme files, proving row count + full-row digest equality
    before commit and after
  - >-
    both verbs are operator-only on the admin maintenance function, matrix-governed per table
    class (control refuses the rewrite), absent from the smoke dispatch, and the mutating code ships
    only in the maintenance bundle
  - >-
    Decision 204 (amends 81, 126, 192) sanctions the rewrite and the ADMIN-agent execution path;
    deploy-paths, git-ops, terraform-cc-web-operations, data-modeling-standard, the maintenance
    contract, the new ducklake-partition-remediation procedure contract and T2.19:c8 are consistent
    with it
  - >-
    after deploy, the ADMIN-container agent -- confirming each mutation with the human -- leaves all
    five ops history tables on year/month/day with zero legacy-scheme files, and catalog_stats is
    recorded before and after
  - rec-4070 closes only via the evidence PR, whose fixture + test hold under Decision 201's offline evaluator
verification_plan:
  - step: 1
    phase: pre-deploy
    action: prove the read and mutate halves' branches
    command: bin/venv-python -m pytest tests/test_ducklake_partition_layout.py tests/test_ducklake_partition_rewrite.py -q
    expected: every branch test passes, including the in-transaction pre_snapshot capture, the pre-commit digest rollback and the retry ceiling
    fix_if: a refusal or rollback branch passes without raising -- the module commits on an unproven rewrite
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-layout-branches
  - step: 2
    phase: pre-deploy
    action: prove the two verbs' guards and the extracted helpers
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test_partition_actions.py tests/lambdas/ducklake_maintenance/test__shared.py -q
    expected: all pass -- no-arg, confirm-mismatch and control-class rewrite invocations are refused
    fix_if: a destructive invocation without confirm == table reaches rewrite_legacy_layout
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-actions-guards
  - step: 3
    phase: pre-deploy
    action: prove the normalizer and the verb universe
    command: >-
      bin/venv-python -m pytest
      tests/common/test_ducklake_partition_spec.py::test_normalize_partition_spec_matches_ducklake_representation
      tests/common/test_ducklake_maintenance_scope.py::test_partition_verbs_in_universe_with_control_rewrite_excluded
      tests/common/test_ducklake_gc_ops.py::TestMatrixCarriesNoCatalogWideVerb::test_verb_universe_holds_only_per_table_scoped_verbs
      -q
    expected: all three pass
    fix_if: normalize output does not match the live transform strings (day, bucket(8), identity)
    hermetic: false
    graduation: graduate
    graduation_check_id: ducklake-partition-normalizer-and-verbs
  - step: 4
    phase: pre-deploy
    action: prove the regenerated projection carries both verbs' policy cells
    command: >-
      bin/venv-python -c "import yaml;
      p=yaml.safe_load(open('config/lambda/ducklake/field_semantics.yaml', encoding='utf-8'))['maintenance_policy'];
      assert all(p[c]['reconcile_partitions']['apply'] is True for c in ('scd2','append_only','control')), p;
      assert p['scd2']['rewrite_partition_layout']['apply'] is True and p['append_only']['rewrite_partition_layout']['apply'] is True, p;
      c=p['control']['rewrite_partition_layout']; assert c['apply'] is False and c.get('reason'), c;
      print('PARTITION_VERB_CELLS_OK')"
    expected: prints the marker. Red on the planning tree -- the cells do not exist (KeyError)
    fix_if: the sidecar cells were added but field_semantics.yaml was not regenerated
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-verb-policy-cells
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: confirm the generated projection matches its sources
