- docs/PROJECT_CONTEXT.md read; only Decisions 88, 188, 191, 192, 193, 214 and Decision N+1 read in full.
- PLAN-telemetry-reader-and-smoke-twin's PR 1 merged; MEASUREMENT.md present with D_files_per_day, R_stats_rows_per_day, window_start, window_end and commit_latency_p95_ms_7d (PLAN-telemetry-production-catalog's key names).
