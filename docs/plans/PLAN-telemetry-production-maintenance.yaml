  waiver_reason: Bookkeeping data guarded by validate_platform_roadmap's closes_criteria and exit-criteria ledger checks in PR 2's CI.
constraints:
- >-
  IMPLEMENTATION only (Decision 67). Decompose, never raise, an SLOC budget (Decision 128). No rescue loops: an
  unrecoverable live failure stops for RCA (Decision 55).
- >-
  No IAM and no Decision text: PR 1 merges under the standing rule (governed CI deploys are not always-ask) after code
  review PROCEED and green CI, unless the guard routes its Lambda permissions to the gated Environment, which Benjamin
  approves. Notice for his spend rule: nine new alarms add about 0.90 USD a month, and the schedules add a few
  Lambda minutes a week.
- >-
  The ops maintenance series stays undimensioned and its three alarms untouched (T2.18 c2, rec-3870). No edit to the
  admin function's IAM (PLAN-telemetry-production-catalog granted the prefix).
- >-
  Thresholds are literals from MEASUREMENT.md by the formulas in execution step 4; never guessed, never derived at
  apply time.
- >-
  Public repo (Decision 101): no account id, ARN, hostname, URL or secret in any committed file, commit, PR body or
  log line; alarm descriptions carry no threshold shape.
- >-
  Never weaken a test assertion to obtain green (Decision 181): every changed pin is a planned-change or growth-safe
  disposition recorded in weakening_dispositions.
- >-
  One DuckLake deploy or apply at a time; the coordinator sequences this plan's merges against other telemetry builds.
