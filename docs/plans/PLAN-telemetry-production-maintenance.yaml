constraints:
- >-
  IMPLEMENTATION only (Decision 67). Decompose, never raise, an SLOC budget (Decision 128). No rescue loops: an
  unrecoverable live failure stops for RCA (Decision 55).
- >-
  Spend is always-ask, so PR 1 merges only on Benjamin's word, after code review PROCEED and green CI, with this plan's
  whole figure in the ask: 13 new custom-metric series (9 maintenance names for the telemetry catalog, OccRetryCount and
  CommitLatencyMs for ducklake_smoke and ducklake_telemetry) at about 0.30 USD each and 9 standard alarms at 0.10 USD,
  about 4.80 USD a month at list price, plus a few Lambda minutes a week. PR 2 adds no spend beyond that figure and
  merges under the standing rule (its body cites his word on PR 1), unless the guard routes its Lambda permissions to
  the gated Environment, which he approves. PR 3 is bookkeeping. No IAM and no Decision text in this plan.
- >-
  The ops maintenance series stays undimensioned and its three alarms untouched (T2.18 c2, rec-3870); no telemetry
  datapoint ever enters it, which is why the telemetry dry run waits for PR 1's deploy. No edit to the admin function's
  IAM (PLAN-telemetry-production-catalog granted the prefix).
- >-
  Thresholds are literals from MEASUREMENT.md by the formulas in execution step 6; never guessed, never derived at
  apply time.
- >-
  Public repo (Decision 101): no account id, ARN, hostname, URL or secret in any committed file, commit, PR body or
  log line; alarm descriptions carry no threshold shape.
- >-
  Never weaken a test assertion to obtain green (Decision 181): every changed pin is a planned-change or growth-safe
  disposition recorded in weakening_dispositions.
- >-
  One DuckLake deploy or apply at a time; the coordinator sequences this plan's merges against other telemetry builds.
