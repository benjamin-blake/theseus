schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-maintenance
intent: >-
  Telemetry slice 2c (rec-4292, T2.36), the third of five plans: PLAN-telemetry-production-catalog -> PLAN-telemetry-reader-and-smoke-twin -> this plan -> the cutover
  (PLAN-telemetry-catalog-aware-capture, then PLAN-telemetry-production-flip). It points merge (every 6 hours) and guarded GC (weekly) at the
  production telemetry catalog before its first event row, gives the telemetry catalog's maintenance and writer metrics
  their own MetaSchema series while the ops series stays undimensioned, and adds the breach, liveness, merge-failure and
  growth alarms that replace the breaker Decision 188 retired (Decision N+1 cl.5). That closes T2.36 c5. Telemetry is the
  learning signal for recursive self-improvement (PROJECT_CONTEXT); maintenance keeps its catalog cheap to read.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-maintenance.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), slice 2c; follow-on mode. Closes T2.36 c5 (maintenance covers the production
  catalog before its first telemetry write). c1 is PLAN-telemetry-production-catalog's; c2 is PLAN-telemetry-production-flip's.
closes_criteria:
- T2.36:c5
scope:
- file: src/lambdas/ducklake_telemetry_writer/telemetry_log.py
  action: Modify
  purpose: >-
    PR 1. The EMF block adds a catalog series beside the existing ones (additive, so plan A's 7-day measurement series
    stays continuous): RequestCount dimension sets [[Verb], [Verb, MetaSchema]] and the append directive [[],
    [MetaSchema]], with a MetaSchema member read from the function's own TELEMETRY_META_SCHEMA env (identifier-checked,
    else "unknown"; never a caller value). The twin emits MetaSchema=ducklake_smoke, so its gate traffic can never
    trip a production alarm.
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: >-
    PR 1. NEW catalog_dimensions(meta_schema) -> {"MetaSchema": meta_schema} for a valid identifier other than
    rt.META_SCHEMA, else None (the ops series stays undimensioned: T2.18 c2 and rec-3870 read it); NEW
    catalog_metric_sink(meta_schema) -> a (name, value) emitter bound to those dimensions.
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: >-
    PR 1. merge_ops emits its seven metrics through catalog_metric_sink(meta_schema); gc_ops passes
    catalog_metric_sink(meta_schema) as metric_sink; the handler's MaintenanceBreakerTrip emission takes
    catalog_dimensions(payload meta_schema). merge_ops' no-tables error names the event's catalog instead of the fixed
    ops text. Ops calls are byte-identical (no dimensions). Stays under 500 SLOC (452 today).
- file: src/lambdas/ducklake_maintenance/health_actions.py
  action: Modify
  purpose: >-
    PR 1. _report_stats_index also emits, per enumerated schema, CatalogFileColumnStatsRows and CatalogMetadataBytes
    with dimension MetaSchema=<schema> from index_status.schema_growth; failures stay report-only (class and SQLSTATE).
    catalog_stats' undimensioned emissions are unchanged.
- file: src/common/ducklake_catalog_index_status.py
  action: Modify
  purpose: >-
    PR 1. NEW schema_growth(cur, meta_schema) -> {file_column_stats_rows_est, metadata_bytes}: one SELECT over
    pg_catalog (reltuples of the schema's ducklake_file_column_stats and the summed pg_total_relation_size of the
    schema's relations), SELECT only.
- file: terraform/personal/ducklake_maintenance_telemetry.tf
  action: Create
  purpose: >-
    PR 1 (Decision N+1 cl.5, from PLAN-telemetry-reader-and-smoke-twin). On the admin maintenance function, with no IAM change (the production catalog plan
    granted the telemetry prefix): rule agent-platform-ducklake-maintenance-telemetry-merge cron(50 */6 * * ? *) and
    rule agent-platform-ducklake-maintenance-telemetry-gc cron(5 4 ? * SUN *) (after the Sunday 03:00 DR dump and the
    03:45 ops GC), both ENABLED, targets with input {action, data_path = local.ducklake_telemetry_data_path,
    meta_schema = local.ducklake_telemetry_prod_meta_schema}, lambda permissions AllowEventBridgeTelemetryMergeOps and
    AllowEventBridgeTelemetryGcOps. Alarms, every metric dimensioned MetaSchema = ducklake_telemetry, actions to
    aws_sns_topic.alerts, no threshold shape in any description: ducklake-telemetry-maintenance-breaker
    (MaintenanceBreakerTrip Sum >= 1, 300 s), ducklake-telemetry-gc-referenced-missing (Maximum >= 1, notBreaching),
    ducklake-telemetry-gc-liveness (GcDeletedSnapshots SampleCount < 1 over 7 daily periods, breaching),
    ducklake-telemetry-merge-failed (MergeOpsPassFailed Maximum >= 1 per hour, notBreaching),
    ducklake-telemetry-merge-liveness (MergeOpsTablesCount SampleCount < 1 over two 6-hour periods, breaching),
    ducklake-telemetry-files-after-merge (MergeOpsFilesAfterTotal Maximum above the measured literal on two
    consecutive 6-hour periods) and ducklake-telemetry-catalog-stats-rows (CatalogFileColumnStatsRows Maximum above the
    measured literal on four consecutive 6-hour periods). Thresholds per execution step 4.
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR 1. Alarms ducklake-telemetry-writer-occ (OccRetryCount Maximum >= 3 in an hour: two attempts short of the OCC
    budget of 5) and ducklake-telemetry-writer-commit-latency (CommitLatencyMs p95 above the measured literal for three
    consecutive hours), both on namespace DuckLakeTelemetryWriter with dimension MetaSchema =
    local.ducklake_telemetry_prod_meta_schema and treat_missing_data notBreaching, so they stay quiet until
    PLAN-telemetry-production-flip and never see the twin. rec-4292's acceptance greps ducklake-telemetry-writer-occ here.
- file: docs/contracts/ducklake_telemetry_writer.yaml
  action: Modify
  purpose: >-
    PR 1: the C6 line's EMF section names the added MetaSchema series and the two writer alarms; amendment_log row.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: >-
    PR 1. merge_ops and gc_ops payload rows name the telemetry schedules beside the ops ones and the MetaSchema
    dimension on a non-ops catalog's metrics; an audit invariant for the telemetry alarms and the undimensioned ops
    series; amendment_log row.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    PR 2, post-deploy bookkeeping only: T2.36 c5 text gains the prefix "[Re-grounded DATE, PLAN-telemetry-production-maintenance
    (Decision N+1 cl.5): the breaker Decision 88 named was retired by Decision 188; growth thresholds are enforced as
    alarms on files after merge and catalog stats rows for the telemetry catalog, sized from the pre-create
    measurement, beside the G1-G4 guards.]"; c5 flips open -> met with met_by telemetry-production-maintenance; a
    dated progress_note line. Nothing else.
- file: tests/fixtures/gc_ops_dryrun_baseline_telemetry.json
  action: Create
  purpose: >-
    PR 1. Counts-only copy of the gc_ops dry_run response the production catalog plan's admin session took on
    ducklake_telemetry (ok, action, dry_run, tables, referenced_missing, unsized_candidates, would_delete_files,
    would_delete_bytes, live_bytes, storage_objects, plus a provenance key naming that record). No id, host, ARN or
    path.
- file: tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py
  action: Modify
  purpose: >-
    PR 1. test_line_fields_and_emf_on_the_five_data_verbs asserts the two-set dimension list; NEW
    test_emf_adds_a_meta_schema_series_beside_the_undimensioned_one and test_meta_schema_member_is_env_bound_and_checked.
- file: tests/lambdas/ducklake_maintenance/test__shared.py
  action: Modify
  purpose: PR 1. NEW test_catalog_dimensions_keep_the_ops_series_undimensioned and test_catalog_metric_sink_binds_the_dimension.
- file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
  action: Modify
  purpose: >-
    PR 1. test_action_merge_ops_emits_metrics keeps the ops case undimensioned; NEW
    test_merge_ops_on_a_telemetry_catalog_dimensions_every_metric and test_breaker_trip_is_dimensioned_by_catalog.
- file: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
  action: Modify
  purpose: PR 1. The delegation test asserts a catalog-bound sink (undimensioned for ducklake_ops, MetaSchema for ducklake_telemetry).
- file: tests/lambdas/ducklake_maintenance/test_health_actions.py
  action: Modify
  purpose: PR 1. NEW test_control_health_emits_growth_per_catalog and test_growth_read_failure_stays_report_only.
- file: tests/common/test_ducklake_catalog_index_status.py
  action: Modify
  purpose: PR 1. NEW test_schema_growth_reads_pg_catalog_only (SELECT only, the two fields, schema bound as a parameter).
- file: tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
  action: Create
  purpose: >-
    PR 1. Over the real tree, each with a red case: test_rules_target_the_production_telemetry_catalog (both rules
    ENABLED, inputs naming the telemetry locals); test_admin_cadence_minutes_are_distinct (all five admin-function rules
    across both .tf files); test_dr_dump_precedes_the_telemetry_gc; test_every_telemetry_alarm_is_dimensioned_by_meta_schema
    (the seven maintenance alarms and the two writer alarms, MetaSchema bound to the telemetry catalog, actions to
    alerts); test_liveness_alarms_treat_missing_data_as_breaching_within_the_period_cap;
    test_alarm_descriptions_pin_no_threshold; test_committed_telemetry_dry_run_licenses_the_gc_enablement (fixture:
    ok, dry_run, referenced_missing 0, unsized_candidates 0, the nine telemetry tables present, live_bytes > 0);
    test_ops_alarms_stay_undimensioned (the three ops alarms in ducklake_maintenance.tf carry no dimensions).
- file: config/agent/verification_registry/entries/telemetry-maintenance-schedule-pins.yaml
  action: Create
  purpose: Graduated check for step 3 (test_selector).
- file: config/agent/verification_registry/entries/maintenance-metric-catalog-dimension.yaml
  action: Create
  purpose: Graduated check for step 4 (test_selector).
bundled_recommendations: []
followon_recs:
- rec-4482
infrastructure_dependencies:
- >-
  Pre-merge (PR 1): PLAN-telemetry-reader-and-smoke-twin's PR 1 is merged (Decision N+1 on main, the twin exists); PLAN-telemetry-production-catalog's admin session recorded
  MEASUREMENT.md and the gc_ops dry_run and merge_ops results on ducklake_telemetry, and granted the admin maintenance
  role the ducklake-telemetry/ prefix.
- >-
  Post-merge (PR 1): rules, targets, Lambda permissions and alarms are non-IAM on existing roles and auto-apply under
  the guard; if the guard routes the Lambda permissions to the gated Environment, Benjamin approves it. The writer and
  maintenance code deploy through the governed channel on the same merge.
acceptance_criteria:
- >-
  T2.36:c5: merge_ops (every 6 hours) and guarded gc_ops (weekly, G1-G4, licensed by the committed dry-run baseline)
  run on the production telemetry catalog ducklake_telemetry before its first event row; every telemetry-catalog
  maintenance metric carries MetaSchema=ducklake_telemetry while the ops series stays undimensioned; breach,
  liveness, merge-failure and the two growth alarms sized from the measurement exist, plus the writer's OCC and
  latency alarms on its production series; the first scheduled telemetry merge pass reports MergeOpsPassFailed 0;
  c5's text is re-grounded and flipped met by this plan on origin/main.
verification_plan:
- step: 1
  phase: pre-deploy
  action: PR 1's test files and the fast tier pass.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py tests/lambdas/ducklake_maintenance
    tests/common/test_ducklake_catalog_index_status.py tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
    tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py -q && bin/venv-python -m scripts.validate --pre
  expected: Every test passes and the fast tier exits 0.
  fix_if: Any failure; fix the cause, never a pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-runs plus scripts.validate (refused as a graduated check); steps 2-4 graduate the behaviour.
- step: 2
  phase: pre-deploy
  action: The writer's EMF adds a MetaSchema series beside the undimensioned one.
  command: bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py::test_emf_adds_a_meta_schema_series_beside_the_undimensioned_one -q
  expected: Exit 0, one test passed.
  fix_if: The undimensioned series was dropped (measurement continuity) or the member reads a caller value; fix _emf.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The alarms that consume this series are pinned by step 3's graduated TF check; this mechanism node stays in the
    writer's own test file, which the fast tier selects on any telemetry_log edit.
  expected_literals:
  - 1 passed
- step: 3
  phase: pre-deploy
  action: The telemetry maintenance rules target the production telemetry catalog.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py::test_rules_target_the_production_telemetry_catalog -q
  expected: Exit 0, one test passed.
  fix_if: A rule is disabled, points at another catalog or path, or is missing; fix the HCL.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-maintenance-schedule-pins
  expected_literals:
  - 1 passed
- step: 4
  phase: pre-deploy
  action: Non-ops catalogs get a MetaSchema dimension; the ops series stays undimensioned.
  command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test__shared.py::test_catalog_dimensions_keep_the_ops_series_undimensioned -q
  expected: Exit 0, one test passed.
  fix_if: ducklake_ops gets a dimension (it would blind the T2.18 alarm and rec-3870) or a telemetry catalog gets none; fix catalog_dimensions.
  hermetic: true
  graduation: graduate
  graduation_check_id: maintenance-metric-catalog-dimension
  expected_literals:
  - 1 passed
- step: 5
  phase: post-deploy
  action: >-
    After PR 1: the first scheduled telemetry merge pass ran green and every new alarm exists and is not in ALARM.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "import boto3,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');
    now=d.datetime.now(d.timezone.utc);dims=[{'Name':'MetaSchema','Value':'ducklake_telemetry'}];
    pf=cw.get_metric_statistics(Namespace='DuckLakeMaintenance',MetricName='MergeOpsPassFailed',Dimensions=dims,StartTime=now-d.timedelta(hours=13),EndTime=now,Period=3600,Statistics=['Maximum','SampleCount'])['Datapoints'];
    tc=cw.get_metric_statistics(Namespace='DuckLakeMaintenance',MetricName='MergeOpsTablesCount',Dimensions=dims,StartTime=now-d.timedelta(hours=13),EndTime=now,Period=3600,Statistics=['Maximum'])['Datapoints'];
    assert pf and max(p['Maximum'] for p in pf)==0 and tc and max(p['Maximum'] for p in tc)>=9,(pf,tc);
    names=['ducklake-telemetry-maintenance-breaker','ducklake-telemetry-gc-referenced-missing','ducklake-telemetry-gc-liveness','ducklake-telemetry-merge-failed','ducklake-telemetry-merge-liveness','ducklake-telemetry-files-after-merge','ducklake-telemetry-catalog-stats-rows','ducklake-telemetry-writer-occ','ducklake-telemetry-writer-commit-latency'];
    a=cw.describe_alarms(AlarmNames=names)['MetricAlarms'];st={x['AlarmName']:x['StateValue'] for x in a};
    assert set(st)==set(names) and 'ALARM' not in {v for k,v in st.items() if k!='ducklake-telemetry-gc-liveness'},st;print('TELEMETRY_MAINTENANCE_LIVE',len(pf),st)"
  expected: >-
    TELEMETRY_MAINTENANCE_LIVE with at least one merge datapoint, MergeOpsPassFailed 0, nine tables merged, nine
    alarms present and none in ALARM except possibly gc-liveness before the first Sunday pass (cold start, excluded).
  fix_if: >-
    No datapoint after 13 hours (the rule never fired: check the target and permission), a failed pass (read the
    MAINTENANCE_FAILURE log line), or a missing alarm; RCA.
- step: 6
  phase: post-deploy
  action: PR 2 bookkeeping is on main.
  command: >-
    git fetch origin main --quiet && git show origin/main:docs/ROADMAP-PLATFORM.yaml | bin/venv-python -c "import
    sys,yaml;d=yaml.safe_load(sys.stdin);it=next(i for i in d['tier_items'] if i['id']=='T2.36');c=next(c for c in
    it['exit_criteria'] if c['id']=='c5');assert c['status']=='met' and c.get('met_by')=='telemetry-production-maintenance'
    and 'Re-grounded' in c['text'],c;print('C5_MET')"
  expected: C5_MET.
  fix_if: The bookkeeping PR is unmerged or the met_by token is wrong; fix the PR.
