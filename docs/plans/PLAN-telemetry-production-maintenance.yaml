pre_implementation_checklist:
- Branch confirmed not on main; harness branch only.
- docs/PROJECT_CONTEXT.md read; only Decisions 88, 188, 191, 192, 214 and Decision N+1 read in full.
- PLAN-telemetry-reader-and-smoke-twin's PR 1 merged; PLAN-telemetry-production-catalog's admin-session record present (MEASUREMENT.md, gc_ops dry_run and merge_ops on ducklake_telemetry).
- All files in scope located and readable; acceptance criteria understood and verifiable.
execution_steps:
- >-
  1. Preconditions, read before any edit: PLAN-telemetry-reader-and-smoke-twin's PR 1 is merged (Decision N+1 is on main, and the smoke twin
  exists, so its traffic carries MetaSchema=ducklake_smoke once this plan's EMF change deploys); PLAN-telemetry-production-catalog's admin-session
  record under /mnt/project-files/telemetry-slice2c/ holds MEASUREMENT.md and the gc_ops dry_run and merge_ops
  results on ducklake_telemetry; the admin maintenance role already reads and writes the ducklake-telemetry/ prefix
  (PLAN-telemetry-production-catalog). Reuse that plan's names unchanged (rt.TELEMETRY_PROD_META_SCHEMA, local.ducklake_telemetry_data_path,
  local.ducklake_telemetry_prod_meta_schema from PLAN-telemetry-reader-and-smoke-twin). A missing name that is not one of this plan's rows goes to the
  coordinator (scope escalation rule).
- >-
  2. PR 1, code: telemetry_log's MetaSchema series; _shared catalog_dimensions and catalog_metric_sink; the handler's
  merge_ops, gc_ops and breaker emissions; schema_growth and control_health's growth metrics; their tests.
- >-
  3. PR 1, baseline: copy the counts-only gc_ops dry_run body PLAN-telemetry-production-catalog's admin session recorded for
  ducklake_telemetry into tests/fixtures/gc_ops_dryrun_baseline_telemetry.json with a provenance key. If no full body
  was recorded, ask Benjamin (or an ADMIN-container agent under his direction) to run the read-only dry run
  {"action":"gc_ops","data_path":<telemetry data path>,"meta_schema":"ducklake_telemetry","dry_run":true} and record
  the counts; a 500, referenced_missing above 0 or unsized_candidates above 0 stops the build for RCA (Decision 55),
  never a disabled rule or a relaxed test.
- >-
