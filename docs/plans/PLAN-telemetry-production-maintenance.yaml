schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-production-maintenance
intent: >-
  Telemetry slice 2c (rec-4292, T2.36), the third of five plans: PLAN-telemetry-production-catalog ->
  PLAN-telemetry-reader-and-smoke-twin -> this plan -> the cutover (PLAN-telemetry-catalog-aware-capture, then
  PLAN-telemetry-production-flip). It points merge (every 6 hours) and guarded GC (weekly) at the production telemetry
  catalog before its first event row, gives the telemetry catalog's maintenance and writer metrics their own MetaSchema
  series while the ops series stays undimensioned, and adds the breach, liveness, merge-failure and growth alarms that
  replace the breaker Decision 188 retired (Decision N+1 cl.5). That closes T2.36 c5. Telemetry is the learning signal
  for recursive self-improvement (PROJECT_CONTEXT); maintenance keeps its catalog cheap to read.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-production-maintenance.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), slice 2c; follow-on mode. Closes T2.36 c5 (maintenance covers the production
  catalog before its first telemetry write). c1 is PLAN-telemetry-production-catalog's; c2 is
  PLAN-telemetry-production-flip's.
closes_criteria:
- T2.36:c5
scope:
- file: src/lambdas/ducklake_telemetry_writer/telemetry_log.py
  action: Modify
  purpose: >-
    PR 1. The append directive adds one catalog dimension set beside the existing empty one: OccRetryCount and
    CommitLatencyMs carry Dimensions [[], [MetaSchema]] (additive, so PLAN-telemetry-production-catalog's 7-day
    measurement series stays continuous), with a MetaSchema member read from the function's own TELEMETRY_META_SCHEMA
    env (identifier-checked, else "unknown"; never a caller value). RequestCount keeps [Verb] only (no new series: no
    alarm reads it per catalog). The twin and, until PLAN-telemetry-production-flip, the writer emit
    MetaSchema=ducklake_smoke, so gate traffic can never trip a production alarm.
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: >-
    PR 1. NEW catalog_dimensions(meta_schema) -> {"MetaSchema": meta_schema} for a valid identifier other than
    rt.META_SCHEMA, else None (the ops series stays undimensioned: T2.18 c2 and rec-3870 read it). NEW CATALOG_METRICS,
    the closed set a non-ops catalog emits (cardinality bound): MaintenanceBreakerTrip, GcReferencedMissing,
    GcDeletedSnapshots, GcDeferredFiles, MergeOpsPassFailed, MergeOpsTablesCount, MergeOpsFilesAfterTotal,
    MergeOpsDurationMs and CatalogFileColumnStatsRows (the seven alarm inputs, G4 drain pressure and rec-4218's
    merge-duration trigger).
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: >-
    PR 1. NEW _catalog_sink(meta_schema) built over the handler's own re-bound _emit_maintenance_metric, so every
    existing patch point (h._emit_maintenance_metric in test_operational_actions, test_merge_ops_discovery,
    test_gc_action and test_dispatch) still holds: for ducklake_ops it returns the module-level _emit_maintenance_metric
    itself (calls byte-identical); for any other catalog a (name, value) emitter that drops names outside
    CATALOG_METRICS and passes catalog_dimensions(meta_schema). merge_ops emits through _catalog_sink(meta_schema);
    gc_ops passes it as metric_sink; the DuckLakeMaintenanceError branch emits MaintenanceBreakerTrip through
    _catalog_sink of the payload's meta_schema (an invalid or absent one is treated as ops). merge_ops' no-tables error
    names the event's catalog instead of the fixed ops text. Stays under 500 SLOC (452 today).
- file: src/lambdas/ducklake_maintenance/health_actions.py
  action: Modify
  purpose: >-
    PR 1. _report_stats_index also emits CatalogFileColumnStatsRows with MetaSchema=<schema> for the production
    telemetry catalog only (rt.TELEMETRY_PROD_META_SCHEMA, when enumerated), from index_status.stats_rows_est; a None
    estimate emits nothing; failures stay report-only (class and SQLSTATE). catalog_stats' undimensioned emissions and
    the ops and smoke schemas' metrics are unchanged.
- file: src/common/ducklake_catalog_index_status.py
  action: Modify
  purpose: >-
    PR 1. NEW stats_rows_est(cur, meta_schema) -> int | None: one SELECT of pg_class.reltuples for the schema's
    ducklake_file_column_stats (schema bound as a parameter, relkind r or p), returning None when the table is absent or
    reltuples is negative (never analysed on PostgreSQL 14 and later). SELECT only; the catalog_stats basis
    (ducklake_maintenance.catalog_stats) is not duplicated.
- file: docs/contracts/ducklake_telemetry_writer.yaml
  action: Modify
  purpose: >-
    PR 1: the C6 line's EMF section names the [MetaSchema] set on OccRetryCount and CommitLatencyMs. PR 2: the two
    writer alarms. amendment_log rows.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: >-
    PR 1: merge_ops and gc_ops payload rows name the MetaSchema dimension and CATALOG_METRICS for a non-ops catalog;
    control_health names the telemetry CatalogFileColumnStatsRows emission. PR 2: the lines that say merge_ops and
    gc_ops target only ducklake_ops -- contract.description (line 25), governance.auth_type (around 45),
    governance.principal_classes (around 53) and the audit invariant (around 392) -- name the telemetry schedules beside
    the ops ones; an audit invariant names the nine telemetry alarms, the undimensioned ops series, G4 headroom (weekly
    dead files about 7 x D against G4_MAX_DELETE_FILES 20,000: above about 2,850 files a day every pass drains
    partially, Decision 193) and how Neon storage is held (the stats-rows alarm on the dominant catalog table and egress
    driver, Decision 88 cl.1(iii), plus Decision 214 cl.3's compute cap). amendment_log rows.
- file: terraform/personal/ducklake_maintenance_telemetry.tf
  action: Create
  purpose: >-
    PR 2 (Decision N+1 cl.5, from PLAN-telemetry-reader-and-smoke-twin). On the admin maintenance function, with no IAM
    change (PLAN-telemetry-production-catalog granted the prefix). locals: telemetry_data_files_per_day,
    telemetry_stats_rows_per_day and telemetry_commit_latency_p95_ms_7d (literals from MEASUREMENT.md, execution step 6),
    telemetry_stats_retention_days = 37 (SNAPSHOT_RETAIN_DAYS 30 + 7: a superseded file's stats rows persist until the
    weekly GC expires snapshots past retention), telemetry_files_after_merge_threshold = 7 *
    local.telemetry_data_files_per_day, telemetry_stats_rows_threshold = 2 * local.telemetry_stats_retention_days *
    local.telemetry_stats_rows_per_day. Rules agent-platform-ducklake-maintenance-telemetry-merge cron(50 */6 * * ? *)
    and agent-platform-ducklake-maintenance-telemetry-gc cron(5 4 ? * SUN *), both ENABLED, inputs {action, data_path =
    local.ducklake_telemetry_data_path, meta_schema = local.ducklake_telemetry_prod_meta_schema}, lambda permissions
    AllowEventBridgeTelemetryMergeOps and AllowEventBridgeTelemetryGcOps. Seven alarms on namespace DuckLakeMaintenance,
    every metric dimensioned MetaSchema = local.ducklake_telemetry_prod_meta_schema, actions to aws_sns_topic.alerts, no
    threshold shape in any description: ducklake-telemetry-maintenance-breaker (MaintenanceBreakerTrip Sum >= 1, 300 s),
    ducklake-telemetry-gc-referenced-missing (Maximum >= 1, notBreaching), ducklake-telemetry-gc-liveness
    (GcDeletedSnapshots SampleCount < 1 over 7 daily periods, breaching), ducklake-telemetry-merge-failed
    (MergeOpsPassFailed Maximum >= 1 per hour, notBreaching), ducklake-telemetry-merge-liveness (MergeOpsTablesCount
    SampleCount < 1 over two 6-hour periods, breaching), ducklake-telemetry-files-after-merge (MergeOpsFilesAfterTotal
    Maximum above telemetry_files_after_merge_threshold on two consecutive 6-hour periods) and
    ducklake-telemetry-catalog-stats-rows (CatalogFileColumnStatsRows Maximum above telemetry_stats_rows_threshold on
    four consecutive 6-hour periods).
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: >-
    PR 2. Alarms ducklake-telemetry-writer-occ (OccRetryCount Maximum >= 3 in an hour: two attempts short of the OCC
    budget of 5) and ducklake-telemetry-writer-commit-latency (CommitLatencyMs p95 above ceil(2 *
    local.telemetry_commit_latency_p95_ms_7d / 1000) * 1000 for three consecutive hours), both on namespace
    DuckLakeTelemetryWriter with dimension MetaSchema = local.ducklake_telemetry_prod_meta_schema and treat_missing_data
    notBreaching, so they stay quiet until PLAN-telemetry-production-flip and never see the twin. Decision 214 cl.4 names
    the writer's warm wall p95; no metric carries it (the C6 line logs it), and CommitLatencyMs is the emitted series
    for the commit that dominates an append. rec-4292's acceptance greps ducklake-telemetry-writer-occ here.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    PR 3, post-deploy bookkeeping only: T2.36 c5 text gains the prefix "[Re-grounded DATE, PLAN-telemetry-production-maintenance
    (Decision N+1 cl.5): the breaker Decision 88 named was retired by Decision 188; S3 small-file growth is enforced by an
    alarm on files after merge and Neon storage growth by an alarm on catalog stats rows for the telemetry catalog (the
    dominant catalog table), both sized from the pre-create measurement, beside the G1-G4 guards and Decision 214 cl.3's
    compute cap.]"; c5 flips open -> met with met_by telemetry-production-maintenance; a dated progress_note line.
    Nothing else.
- file: tests/fixtures/gc_ops_dryrun_baseline_telemetry.json
  action: Create
  purpose: >-
    PR 2. Counts-only copy of the gc_ops dry_run response taken on ducklake_telemetry after PR 1 deployed (execution step
    5): ok, action, dry_run, tables, referenced_missing, unsized_candidates, would_delete_files, would_delete_bytes,
    live_bytes, storage_objects, plus a provenance key naming the run's date and PR 1's merge SHA. No id, host, ARN or
    path.
- file: tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py
  action: Modify
  purpose: >-
    PR 1. NEW test_emf_adds_a_meta_schema_series_beside_the_undimensioned_one (the append directive's dimension sets are
    [[], [MetaSchema]], RequestCount stays [[Verb]]) and test_meta_schema_member_is_env_bound_and_checked;
    test_occ_directive_only_when_recorded asserts the new dimension list (planned-change).
- file: tests/lambdas/ducklake_maintenance/test__shared.py
  action: Modify
  purpose: >-
    PR 1. NEW test_catalog_dimensions_keep_the_ops_series_undimensioned (ducklake_ops and an invalid name -> None,
    ducklake_telemetry -> MetaSchema) and test_catalog_metrics_is_the_closed_alarm_input_set.
- file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
  action: Modify
  purpose: >-
    PR 1. NEW test_merge_ops_on_a_telemetry_catalog_dimensions_every_metric (only CATALOG_METRICS names, each with
    MetaSchema), test_merge_ops_on_ops_calls_the_rebound_emitter_unchanged and test_breaker_trip_is_dimensioned_by_catalog;
    test_action_merge_ops_emits_metrics is unchanged.
- file: tests/lambdas/ducklake_maintenance/handler/test_gc_action.py
  action: Modify
  purpose: >-
    PR 1. NEW test_gc_ops_on_a_telemetry_catalog_passes_a_catalog_bound_sink; the delegation and dry-run nodes keep
    their h._emit_maintenance_metric patch point unchanged (the ops sink is that object).
- file: tests/lambdas/ducklake_maintenance/test_health_actions.py
  action: Modify
  purpose: >-
    PR 1. NEW test_control_health_emits_growth_for_the_telemetry_catalog and test_growth_estimate_none_emits_nothing;
    test_report_emits_three_metrics_per_schema_with_the_metaschema_dimension keeps len(emitted) == 6 (its fixture
    enumerates ops and smoke only, which emit no growth metric).
- file: tests/common/test_ducklake_catalog_index_status.py
  action: Modify
  purpose: >-
    PR 1. NEW test_stats_rows_est_reads_pg_catalog_only (one SELECT, schema bound as a parameter, negative reltuples and
    an absent table -> None).
- file: tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
  action: Create
  purpose: >-
    PR 2. Over the real tree, each with a red case on synthetic HCL: test_rules_target_the_production_telemetry_catalog
    (both rules ENABLED, inputs naming the telemetry locals); test_admin_cadence_minutes_are_distinct (all five
    admin-function rules across both .tf files); test_dr_dump_precedes_the_telemetry_gc;
    test_every_telemetry_alarm_is_dimensioned_by_meta_schema (the seven maintenance alarms and the two writer alarms,
    MetaSchema bound to local.ducklake_telemetry_prod_meta_schema, actions to alerts, only CATALOG_METRICS names);
    test_thresholds_follow_the_measurement_formulas (telemetry_stats_retention_days == SNAPSHOT_RETAIN_DAYS + 7 from
    src/common/ducklake_maintenance.py, the 7 x, 2 x 37 x and ceil(2 x p95) expressions, measured inputs positive
    integers); test_liveness_alarms_treat_missing_data_as_breaching_within_the_period_cap;
    test_alarm_descriptions_pin_no_threshold; test_committed_telemetry_dry_run_licenses_the_gc_enablement (fixture: ok,
    dry_run, referenced_missing 0, unsized_candidates 0, the nine telemetry tables present, live_bytes > 0);
    test_ops_alarms_stay_undimensioned (the three ops alarms in ducklake_maintenance.tf carry no dimensions).
- file: config/agent/verification_registry/entries/telemetry-writer-emf-meta-schema.yaml
  action: Create
  purpose: Graduated check for step 2 (test_selector).
- file: config/agent/verification_registry/entries/maintenance-metric-catalog-dimension.yaml
  action: Create
  purpose: Graduated check for step 3 (test_selector).
- file: config/agent/verification_registry/entries/telemetry-maintenance-schedule-pins.yaml
  action: Create
  purpose: Graduated check for step 6 (test_selector, three nodes).
- file: config/agent/verification_registry/entries/telemetry-gc-enablement-baseline.yaml
  action: Create
  purpose: Graduated check for step 7 (test_selector; mirrors gc-ops-enablement-baseline-fixture-gate).
bundled_recommendations: []
followon_recs:
- rec-4482
infrastructure_dependencies:
- >-
  Pre-merge (PR 1): PLAN-telemetry-reader-and-smoke-twin's PR 1 is merged (Decision N+1 on main, the twin exists);
  PLAN-telemetry-production-catalog's admin session created and seeded ducklake_telemetry, granted the admin
  maintenance role the ducklake-telemetry/ prefix, and recorded MEASUREMENT.md with D_files_per_day (D),
  R_stats_rows_per_day (R), window_start/window_end (the 7-day window) and commit_latency_p95_ms_7d. That plan no longer runs merge_ops
  or gc_ops on ducklake_telemetry.
- >-
  Post-merge (PR 1): code only; the governed channel redeploys ducklake_maintenance, ducklake_maintenance_smoke, the
  telemetry writer and the twin. No Terraform change.
- >-
  Between PR 1 and PR 2: one read-only gc_ops dry_run on ducklake_telemetry by Benjamin (or an ADMIN-container agent at
  his direction), on PR 1's deployed code, so its metrics land only in the MetaSchema series.
- >-
  Post-merge (PR 2): rules, targets, Lambda permissions and alarms are non-IAM on existing roles and auto-apply under
  the guard; if the guard routes the Lambda permissions to the gated Environment, Benjamin approves it.
acceptance_criteria:
- >-
  T2.36:c5: merge_ops (every 6 hours) and guarded gc_ops (weekly, G1-G4, licensed by the committed dry-run baseline)
  run on the production telemetry catalog ducklake_telemetry before its first event row; a non-ops catalog's
  maintenance metrics carry MetaSchema and only CATALOG_METRICS names, while the ops series stays undimensioned and
  receives no telemetry datapoint; breach, liveness, merge-failure and the two growth alarms (thresholds from
  MEASUREMENT.md by the stated formulas) exist, plus the writer's OCC and latency alarms on its production series; the
  first scheduled telemetry merge pass reports MergeOpsPassFailed 0; c5's text is re-grounded by this plan and flipped
  met on origin/main.
verification_plan:
- step: 1
  phase: pre-deploy
  action: PR 1's test files and the fast tier pass.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py tests/lambdas/ducklake_maintenance
    tests/common/test_ducklake_catalog_index_status.py -q && bin/venv-python -m scripts.validate --pre
  expected: Every test passes and the fast tier exits 0.
  fix_if: Any failure; fix the cause, never a pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-runs of this plan's own test files plus scripts.validate (refused as a graduated check); steps 2 and 3
    graduate the series rules.
- step: 2
  phase: pre-deploy
  action: The writer's EMF adds a MetaSchema series beside the undimensioned one, with no new RequestCount series.
  command: bin/venv-python -m pytest tests/lambdas/ducklake_telemetry_writer/test_telemetry_log.py::test_emf_adds_a_meta_schema_series_beside_the_undimensioned_one -q
  expected: Exit 0, one test passed.
  fix_if: The undimensioned series was dropped (measurement continuity), Verb gained a catalog set, or the member reads a caller value; fix _emf.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-writer-emf-meta-schema
  expected_literals:
  - 1 passed
- step: 3
  phase: pre-deploy
  action: Non-ops catalogs get a MetaSchema dimension; the ops series stays undimensioned.
  command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test__shared.py::test_catalog_dimensions_keep_the_ops_series_undimensioned -q
  expected: Exit 0, one test passed.
  fix_if: ducklake_ops gets a dimension (it would blind the T2.18 alarm and rec-3870) or a telemetry catalog gets none; fix catalog_dimensions.
  hermetic: true
  graduation: graduate
  graduation_check_id: maintenance-metric-catalog-dimension
  expected_literals:
  - 1 passed
- step: 4
  phase: pre-deploy
  action: PR 1's full tier passes before its commit (handoff_policy).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 on the full tier, run to completion from the start.
  fix_if: Any failure or a timeout (resume and rerun from the start).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    scripts.validate is refused as a graduated check (recursion); this is the handoff policy's full-tier run.
- step: 5
  phase: pre-deploy
  action: PR 2's test files and the fast tier pass.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py
    tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py tests/checks/iam_tf/test_ducklake_writer_error_alarms.py
    -q && bin/venv-python -m scripts.validate --pre
  expected: Every test passes and the fast tier exits 0.
  fix_if: Any failure; fix the cause, never a pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-runs plus scripts.validate (refused as a graduated check); steps 6 and 7 graduate the rules, alarms,
    thresholds and the GC licence.
- step: 6
  phase: pre-deploy
  action: The telemetry rules target the production telemetry catalog, every alarm reads the MetaSchema series, and the thresholds follow the measurement formulas.
  command: >-
    bin/venv-python -m pytest
    tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py::test_rules_target_the_production_telemetry_catalog
    tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py::test_every_telemetry_alarm_is_dimensioned_by_meta_schema
    tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py::test_thresholds_follow_the_measurement_formulas -q
  expected: Exit 0, three tests passed.
  fix_if: A rule is disabled or mis-pointed, an alarm reads an undimensioned or non-CATALOG_METRICS series, or a threshold drops the retention term; fix the HCL.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-maintenance-schedule-pins
  expected_literals:
  - 3 passed
- step: 7
  phase: pre-deploy
  action: The committed dry-run baseline licenses the destructive GC schedule on the telemetry catalog.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_production_maintenance_tf.py::test_committed_telemetry_dry_run_licenses_the_gc_enablement -q
  expected: Exit 0, one test passed.
  fix_if: The fixture is missing, names another catalog, or shows referenced_missing, unsized candidates or no live bytes; STOP and RCA, never relax the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-gc-enablement-baseline
  expected_literals:
  - 1 passed
- step: 8
  phase: pre-deploy
  action: PR 2's full tier passes before its commit (handoff_policy).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 on the full tier, run to completion from the start.
  fix_if: Any failure or a timeout (resume and rerun from the start).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    scripts.validate is refused as a graduated check (recursion); this is the handoff policy's full-tier run.
- step: 9
  phase: post-deploy
  action: >-
    PR 1's governed deploy ran green for its merge SHA (Decision 79: ducklake_maintenance, ducklake_maintenance_smoke,
    the telemetry writer and the twin redeploy; data-pipeline is affected only through the ROADMAP asset in PR 3 and owes
    no deploy), and the twin's gate traffic produced a CommitLatencyMs datapoint in the MetaSchema=ducklake_smoke series.
    The implementer saves the run's jobs JSON to DEPLOY_JOBS_JSON.
  command: >-
    bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};
    want={'deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry','telemetry-smoke'};
    assert set(jobs)==want and all(jobs[w]=='success' for w in want),jobs;print('DEPLOY_OK')" && AWS_PROFILE=agent_platform
    bin/venv-python -c "import boto3,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');now=d.datetime.now(d.timezone.utc);
    p=cw.get_metric_statistics(Namespace='DuckLakeTelemetryWriter',MetricName='CommitLatencyMs',Dimensions=[{'Name':'MetaSchema','Value':'ducklake_smoke'}],StartTime=now-d.timedelta(hours=6),EndTime=now,Period=3600,Statistics=['SampleCount'])['Datapoints'];
    assert p,p;print('SMOKE_SERIES_OK',len(p))"
  expected: DEPLOY_OK then SMOKE_SERIES_OK with at least one datapoint.
  fix_if: A job is red or skipped (RCA), or no MetaSchema datapoint (the EMF change did not deploy, or the twin gate wrote no append).
- step: 10
  phase: post-deploy
  action: >-
    After the read-only dry run (execution step 5): it emitted into the MetaSchema=ducklake_telemetry series and not into
    the ops series. The implementer exports DRY_RUN_START and DRY_RUN_END (ISO-8601 UTC, a window of at most 30 minutes
    off the Sunday 03:30-04:00 ops GC window).
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "import boto3,os,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');
    a=d.datetime.fromisoformat(os.environ['DRY_RUN_START']);b=d.datetime.fromisoformat(os.environ['DRY_RUN_END']);
    q=lambda dims:cw.get_metric_statistics(Namespace='DuckLakeMaintenance',MetricName='GcReferencedMissing',Dimensions=dims,StartTime=a,EndTime=b,Period=60,Statistics=['Maximum'])['Datapoints'];
    t=q([{'Name':'MetaSchema','Value':'ducklake_telemetry'}]);o=q([]);assert t and max(x['Maximum'] for x in t)==0 and not o,(t,o);print('DRY_RUN_ISOLATED')"
  expected: DRY_RUN_ISOLATED.
  fix_if: An undimensioned datapoint in the window (the dimension code did not deploy, or the run overlapped the ops GC); record it for rec-3870 and RCA before PR 2.
- step: 11
  phase: post-deploy
  action: >-
    After PR 2: the first scheduled telemetry merge pass ran green, the ops merge still writes its undimensioned series,
    and the nine alarms exist and are not in ALARM.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "import boto3,datetime as d;cw=boto3.client('cloudwatch',region_name='eu-west-2');
    now=d.datetime.now(d.timezone.utc);dims=[{'Name':'MetaSchema','Value':'ducklake_telemetry'}];
    g=lambda m,dm,st:cw.get_metric_statistics(Namespace='DuckLakeMaintenance',MetricName=m,Dimensions=dm,StartTime=now-d.timedelta(hours=13),EndTime=now,Period=3600,Statistics=[st])['Datapoints'];
    pf=g('MergeOpsPassFailed',dims,'Maximum');tc=g('MergeOpsTablesCount',dims,'Maximum');ops=g('MergeOpsTablesCount',[],'Maximum');
    assert pf and max(p['Maximum'] for p in pf)==0 and tc and max(p['Maximum'] for p in tc)>=9 and ops,(pf,tc,ops);
    names=['ducklake-telemetry-maintenance-breaker','ducklake-telemetry-gc-referenced-missing','ducklake-telemetry-gc-liveness','ducklake-telemetry-merge-failed','ducklake-telemetry-merge-liveness','ducklake-telemetry-files-after-merge','ducklake-telemetry-catalog-stats-rows','ducklake-telemetry-writer-occ','ducklake-telemetry-writer-commit-latency'];
    a=cw.describe_alarms(AlarmNames=names)['MetricAlarms'];st={x['AlarmName']:x['StateValue'] for x in a};
    assert set(st)==set(names) and 'ALARM' not in {v for k,v in st.items() if k!='ducklake-telemetry-gc-liveness'},st;print('TELEMETRY_MAINTENANCE_LIVE',len(pf),st)"
  expected: >-
    TELEMETRY_MAINTENANCE_LIVE with at least one telemetry merge datapoint, MergeOpsPassFailed 0, nine tables merged, an
    undimensioned ops MergeOpsTablesCount datapoint, nine alarms present and none in ALARM except possibly gc-liveness
    before the first Sunday pass (cold start, excluded).
  fix_if: >-
    No telemetry datapoint after 13 hours (the rule never fired: check the target and permission), a failed pass (read
    the MAINTENANCE_FAILURE log line), no ops datapoint (the ops merge regressed), or a missing alarm; RCA.
