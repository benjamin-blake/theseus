execution_steps:
- >-
  1. Preconditions, read before any edit: PLAN-telemetry-reader-and-smoke-twin's PR 1 is merged (Decision N+1 on main;
  the twin exists, so its traffic carries MetaSchema=ducklake_smoke once this plan's EMF change deploys);
  PLAN-telemetry-production-catalog's admin session created and seeded ducklake_telemetry, granted the admin
  maintenance role the ducklake-telemetry/ prefix and recorded the four MEASUREMENT.md keys. Reuse names unchanged
  (rt.TELEMETRY_PROD_META_SCHEMA, local.ducklake_telemetry_data_path, local.ducklake_telemetry_prod_meta_schema). A
  missing name that is not one of this plan's rows goes to the coordinator (scope escalation rule).
- >-
  2. PR 1, code: telemetry_log's [MetaSchema] set; _shared catalog_dimensions and CATALOG_METRICS; the handler's
  _catalog_sink over its own _emit_maintenance_metric and the merge_ops, gc_ops and breaker emissions; stats_rows_est and
  control_health's telemetry growth metric; both contracts' PR 1 rows; their tests and the two registry entries.
- >-
  3. Run VP steps 1-3, weakening dispositions, code review via a fresh code-review subagent (fix every blocking finding
  and re-run), then VP step 4 (full tier). Open PR 1 and ask Benjamin for his word on the spend figure in the
  constraints (the whole plan's). Merge on his word; run VP step 9.
- >-
  4. Confirm before the dry run that no telemetry datapoint exists in the undimensioned ops series (PR 1 is the first
  code that can touch the telemetry catalog's maintenance; PLAN-telemetry-production-catalog runs none).
- >-
  5. Dry run: ask Benjamin (or an ADMIN-container agent at his direction) to invoke the read-only
  {"action":"gc_ops","data_path":<the telemetry data path>,"meta_schema":"ducklake_telemetry","dry_run":true} on the
  admin function outside the Sunday ops window and record the counts-only body under
  /mnt/project-files/telemetry-slice2c/; run VP step 10. A 500, referenced_missing above 0, unsized_candidates above 0
  or live_bytes of 0 stops the plan for RCA (Decision 55), never a disabled rule or a relaxed test.
- >-
  6. Thresholds (literals in PR 2's locals, each commented with MEASUREMENT.md, its window and the formula; never
  derived at apply time): telemetry_data_files_per_day = D_files_per_day, telemetry_stats_rows_per_day = R_stats_rows_per_day,
  telemetry_commit_latency_p95_ms_7d = commit_latency_p95_ms_7d, from the keys named in step 1; the derived thresholds
  are the HCL expressions in the scope row. If a key is missing, stop and ask the coordinator; never guess a literal.
- >-
  7. PR 2: the fixture from step 5's record; ducklake_maintenance_telemetry.tf (locals, rules, targets, permissions,
  seven alarms) and the two writer alarms; both contracts' PR 2 rows; test_telemetry_production_maintenance_tf.py and
  the two registry entries. Cadence check before the crons: cron(50 */6 * * ? *) and cron(5 4 ? * SUN *) keep every
  minute on the singleton distinct (15, 30, 45, 50, 5) and start telemetry GC after the 03:00 DR dump and the 03:45 ops
  GC window.
- >-
  8. Run VP steps 5-7, weakening dispositions, code review, then VP step 8 (full tier); open PR 2 citing Benjamin's
  word on PR 1 and merge under the standing rule (or after his gated approval if the guard routes the permissions).
- >-
  9. After PR 2's merge and the first scheduled telemetry merge (within 6 hours), run VP step 11. The gc-liveness alarm
  can fire once before the first Sunday pass on a cold start; the PR 2 body says so, and VP step 11 does not count it.
  Then PR 3: the c5 re-grounding and flip and the progress_note line (roadmap bookkeeping only); merge on green CI; run
  VP step 12.
- 'Report: what was implemented, every VP result, the measurement literals chosen, the dry-run counts and the first merge reading.'
rollback: >-
  PR 3 reverts by restoring c5 to open. PR 2: revert the PR (rules and alarms are removed by the apply; the dimensioned
  series simply stop). PR 1: revert the PR; the writer and maintenance code return to undimensioned emission, which is
  safe only while no telemetry maintenance runs, so PR 2 must be reverted first.
