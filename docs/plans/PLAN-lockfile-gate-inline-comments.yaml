execution_steps:
  - Run VP step 1 on the unmodified tree; record its output (in_sync True, 0 top-level packages). If it does not reproduce, STOP.
  - "tests/test_import_governance.py FIRST (red before green) -- inside class TestCheckLockfileSync, delete test_invalid_top_level_requirement_is_ignored (whole method, lines 292-305 on origin/main) and add, in its place, a helper `_gate(self, tmp_path, req_text, lock_text)` that writes tmp_path/'requirements.txt' and tmp_path/'requirements.lock', patches scripts.import_governance._REQUIREMENTS_TXT and _REQUIREMENTS_LOCK, and returns check_lockfile_sync() (the class's autouse fixture already isolates _REQUIREMENTS_DEV), plus six tests named exactly as the VP selects them: test_absurd_bump_with_trailing_comment_fails (`duckdb>=99.0  # inline comment` vs `duckdb==1.5.4` -> not in_sync, 'incompatible pins' and 'duckdb>=99.0 rejects 1.5.4' in msg); test_absurd_bump_without_comment_fails_identically (same without the comment -> same assertions); test_unparseable_declaration_fails_not_skipped (`not a requirement` + `requests>=2.0` vs `requests==2.31.0` -> not in_sync, 'not a requirement' in msg); test_hash_without_preceding_whitespace_is_not_a_comment (`foo>=1.0#x` vs `foo==1.0.0` -> not in_sync, 'foo>=1.0#x' in msg); test_commented_declarations_are_counted (the four real commented shapes with matching lock pins -> in_sync and '4 top-level packages' in msg); test_live_declarations_all_parsed (no patching of TXT/LOCK; the autouse fixture is bypassed by patching _REQUIREMENTS_DEV back to ROOT/'requirements-dev.txt' inside the test: count lines of ROOT/requirements.txt + ROOT/requirements-dev.txt after re.sub(r'(^|\\s+)#.*$','',line).strip() that are non-empty and do not start with '-', assert check_lockfile_sync() is in_sync and f'{n} top-level packages' in msg). Run steps 2, 4, 5, 6 now and record the RED output in the PR body."
  - "scripts/import_governance.py -- add a module-level `_REQUIREMENT_COMMENT_RE = re.compile(r\"(^|\\s+)#.*$\")` with a one-line comment citing pip's req_file.COMMENT_RE as the provenance (copied, not imported). In check_lockfile_sync's top-level loop: `line = _REQUIREMENT_COMMENT_RE.sub(\"\", raw_line).strip()`; skip when `not line or line.startswith(\"-\")` (the `startswith(\"#\")` test becomes redundant and goes); wrap Requirement(line) so InvalidRequirement appends `raw_line.strip()` to a local `unparseable: list[str]` instead of `continue`; after the loop MOVE (not duplicate) the existing req_identity assignment (line 100 on origin/main) up to just after the loop, then `if unparseable: return False, f\"requirements declarations cannot be parsed (the gate cannot check what it cannot parse): {', '.join(repr(l) for l in unparseable)} ({req_identity})\"`. Leave _parse_lock_pins untouched. Run steps 2-6 again and record GREEN."
  - Execute the rest of the Verification Plan in order (steps 7-12 on the branch; step 13 once at Step 7 closure item 4 per the brief).
  - "Portal write at implement time (not a closure): `bin/venv-python -m scripts.ops_data_portal --update-rec rec-2490 --context \"<existing context> | 2026-09-02 PLAN-lockfile-gate-inline-comments: import_governance now uses pip's (^|\\s+)#.*$ comment rule; _pytest_diff.py:330 still uses split('#',1)[0] -- the two parsers now disagree on a no-whitespace hash\"` (fetch the existing context first; rec stays open)."
  - "Report: what was implemented, the red-then-green evidence for steps 2/4/5/6, the live message (20 -> 24), the coverage-floor result from step 9, and the Verification Graduation section for the four graduate steps (admission is by collection error on origin/main -- say so)."
rollback: Single squash commit; reverting restores the silent skip. A post-merge validate_lockfile_sync FAIL naming one of psycopg2-binary, duckdb, python-ulid or pytz is the gate finally checking a real declaration, not a regression -- fix the lock or the declaration forward, never revert the parse.
