# Tier-item lifecycle procedural contract (PLAN-skills-layer-prose-relocation, T2.56 c1's skills-
# layer conjunct). Class D mechanism contract receiving the PROCEDURAL residue relocated out of
# the planning and implement skills' tier-item freshness/bookkeeping sections.
#
# NOT a second home for docs/contracts/exit-criteria-ledger.yaml's subject: that contract owns the
# per-criterion FIELD semantics (status/met_by lifecycle, write-time validation, the closes_criteria
# flip and exit-criteria truth-maintenance rules). This file owns the WALK -- how an agent
# discovers which tier_items a plan touches, re-verifies a tier_item before planning it, and
# sequences its own completion decision around code review. Also distinct from
# docs/contracts/candidate-decision-ratification.yaml (the CD ratification lane itself). This file
# is the third corner of the same triangle, never a second home for either sibling's subject.
# Successor: T2.54's clause-to-check index is expected to absorb this file's tier column into a
# unified map; docs/contracts/instruction-architecture.yaml's layer4_relocation_map is authored as
# data for exactly that reason, so a future index seeds from these rows rather than diverging from
# them.
#
# Scope note (round-7 F5): every key below is a tier-item-lifecycle subject except
# parallel_with_code_review_state_machine, an implement-time CONCURRENCY protocol. It is housed
# here, not hived off, because the artefact it stages IS the roadmap edit the rest of this
# contract governs (the bookkeeping walk's own output) -- the state machine describes how that
# staging interleaves with the code-review dispatch, not a separate subject. Naming that
# explicitly is what keeps this file a subject, not a grab-bag.
contract:
  id: tier-item-lifecycle
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-skills-layer-prose-relocation"
  description: >-
    Class D mechanism contract for the tier_item bookkeeping WALK (how /implement finds which
    tier_items a plan touches, evaluates their exit_criteria, and sequences its status-flip
    decision around code review) and the planning-time Follow-on /plan mode and Tier Item
    Freshness Gate that feed it. Distinct from docs/contracts/exit-criteria-ledger.yaml (the
    per-criterion FIELD semantics) and docs/contracts/candidate-decision-ratification.yaml (the CD
    ratification lane) -- this file is the third corner of the same triangle, never a second home
    for either sibling's subject. T2.54 is the named successor for a unified clause-to-check
    index.
  subject: tier-item-lifecycle
  evaluator:
    check: validate_skill_prose_relocation

amendment_log:
  - date: "2026-09-12"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-skills-layer-prose-relocation: initial authoring, relocating the implement skill's
      Tier_item bookkeeping Trigger/Walk/Outcome-rules, the three-step body of Decomposition-hint
      exemption inheritance (find the parent / inherit the flag / read-only resolution), the
      Replacement closure check, and the Parallel-with-code-review state machine, plus the
      planning skill's Follow-on /plan mode and Tier Item Freshness Gate. No new rule -- the
      moved content is unchanged prose, restated here rather than in the two skills.

follow_on_plan_mode: >-
  When intent targets an in_progress tier_item (one with open criteria remaining), /plan operates
  in follow-on mode. This is the common case -- most items take N follow-on plans. Trigger:
  /orient emits a follow-on "/plan <item-id>: follow-on -- <name>" prompt for any in_progress item
  where needs_followon_plan is True (open criteria AND no in-flight plan covers them); the human
  selects one of these prompts, or names an in_progress item directly. Protocol: (1) Load state --
  read the item's exit_criteria[] from docs/ROADMAP-PLATFORM.yaml; identify which criteria have
  status: open. Load any prior PLAN-*.yaml files that reference this item (via their
  closes_criteria field or the item id in their Phase/Context) and the item's progress_note to
  understand what has already shipped. (2) Scope the NEXT slice only -- plan the minimum work to
  close one or more open criteria; do NOT re-plan work already met/rehomed. The plan's scope,
  acceptance criteria, and VP steps are constrained to what is needed to flip the chosen open
  criteria. (3) Declare closes_criteria -- the plan document MUST include a closes_criteria: field
  listing each item-criterion the plan commits to close on a verified VP pass, in
  "<item-id>:<crit-id>" format (e.g. T-1.23:c2). The plan's acceptance_criteria should 1:1 map onto
  the chosen open criteria -- each AC corresponds to a closes_criteria ref. (4) Cross-reference the
  Freshness Gate -- before committing, run the Tier Item Freshness Gate (this file's
  tier_item_freshness_gate key) on the parent item: check if any open criterion is already
  satisfied by recent work (silent-completion check). If so, propose a criterion status flip to
  met as a roadmap bookkeeping step before scoping the next slice. Status-Trusted-Never-Inferred
  constraint: /plan NEVER flips criterion statuses or item status during planning. Criterion flips
  happen only in /implement's bookkeeping walk (this file's bookkeeping_walk key), on a verified VP
  pass, for explicitly declared closes_criteria. See T2.20 lesson. Never infer met from prose, file
  existence, or commit activity.

tier_item_freshness_gate: >-
  Firing point: AFTER intent has mapped to one or more tier_items[].id values, and BEFORE any
  Scope is written. If the intent matches a soft-warn exception category (ci_rca, hotfix,
  security_advisory, ad_hoc_rec, user_explicit_out_of_scope) and names no tier_item, this gate is
  skipped. Scope: per-touched-item only -- this gate re-verifies the items THIS session plans
  against; it is not a roadmap-wide staleness sweep (that is a periodic audit's job, e.g. the
  2026-06-09 platform-roadmap audit). The roadmap can lag the repo: items go stale when decisions
  ratify, surfaces move, or sibling work absorbs their scope (2026-06-09 roadmap audit, findings
  F-008/F-013/F-016/F-017). Before scoping ANY tier_item -- whether picked from next_eligible or
  named by the human -- re-verify it against the repo. Eligibility computation alone is NOT
  sufficient grounds to plan an item. Run four checks, cheapest first: (1) Silent-completion check
  -- re-adjudicate the item's exit_criteria[] against the repo (executable criteria via subprocess;
  prose criteria with the implement skill's conservative bias). If ALL criteria already hold, do
  NOT plan the item -- propose a status closeout instead: stage status: complete + completed_at +
  a note citing the evidence, present it to the human, and on confirmation land it as a small
  roadmap-bookkeeping commit. Precedent: T-1.9 sat not_started after its T-1.9 session-log audit
  deliverable had already landed, and a downstream item (T2.15) was citing the deliverable as
  existing. (2) Stale-reference check -- verify every files_in_scope path exists or is marked #
  new; scan the item's intent/exit_criteria for surfaces or substrates that ratified decisions
  have retired (e.g. the EC2 runner per CD.21/Decision 73, Bedrock per CD.28, SSO per CD.26, direct
  warehouse access for tables cut over to the DuckLake closed boundary per
  CD.31/CD.33/Decision 81). A stale reference does not block planning -- but the plan MUST include
  re-grounding the item's text as an explicit Scope row, and the implementation follows the
  CURRENT architecture, never the stale instruction. (3) Supersession / redundancy check -- search
  the roadmap for sibling tier_items or ratified-CD amendment notes that have absorbed or
  superseded the item's scope (rg the item's key artefacts across tier_items[] and
  candidate_decisions[]). Fully absorbed -> propose closing the item out (status: reserved with a
  supersession note, preserving the id) instead of planning duplicate work. Partial overlap -> the
  plan names the boundary explicitly and cross-references the sibling. (4) Gating-decision and
  gate-rule check -- read the item's related_candidate_decisions and any
  decision_required_before; check each referenced CD's state in the roadmap. If a gating CD is
  pending, surface it: starting is allowed (bootstrap allowance) but COMPLETION is gated, and
  ratification currently transits the ops portal (see the roadmap agent_instructions
  "ratification vehicle" note). Also grep cross_tier_gates[] for rules naming the item or its tier
  and adjudicate them by hand (e.g. a grace_period_elapsed window that has not elapsed makes an
  eligible-by-deps item not actually startable -- T5.2/G.10 is the canonical case). This manual
  check stands in for the blocked-on-CD and gate-evaluation preflight surfacing until T-1.20 lands.
  Output discipline: every closeout or re-grounding this gate proposes is staged as a roadmap edit
  in the plan's Scope table (or its own micro-commit on human confirmation) -- never applied
  silently, never dropped silently. If the gate finds nothing, say so in one line and continue.
  Closeouts replace dead work; they do not become an excuse to skip the human confirmation gate
  (the planning skill's Step 6b).

bookkeeping_walk: >-
  Fires once the VP Compliance Gate table shows all rows PASS. Does not fire on FAIL or BLOCKED.
  After the verification-pass gate fires and BEFORE code-review is dispatched (or GATE_REQUESTed --
  see this file's parallel_with_code_review_state_machine key), walk the tier_items referenced by
  the current plan and stage YAML status updates. Identify tier_item ids to check via (in order of
  precedence): (1) any roadmap-touched: [T-X.Y, ...] directive in the plan's Context section; (2)
  any tier_item id mentioned in the plan's Phase field (e.g., T-1 entries named in the scope); (3)
  any tier_item id explicitly named in the plan's Acceptance Criteria. For each identified
  tier_item, load its exit_criteria[] from docs/ROADMAP-PLATFORM.yaml and evaluate each criterion:
  executable criteria (shell one-liners, grep, test -f, pytest, bin/venv-python -c "...") run via
  subprocess, pass if exit code is 0; prose criteria fall through to agent judgement with a
  conservative bias -- when in doubt whether a prose criterion is satisfied, do NOT count it as
  passing. This produces under-counting (false in_progress) rather than over-counting (false
  complete), the safer failure mode. Never auto-flip a prose-gated item to complete without
  explicit evidence in the current session's artefacts. Before evaluating the Outcome rules below,
  apply the closes_criteria flip declared in docs/contracts/exit-criteria-ledger.yaml's fields.status
  semantics (the criterion-level field rule lives there, not here) -- the Outcome rules below read
  the POST-FLIP criterion statuses. Outcome rules: all criteria pass -> stage status: complete +
  completed_at: "<today ISO date>" in docs/ROADMAP-PLATFORM.yaml (for in_progress items with a
  structured ledger, "all criteria pass" means every ExitCriterion has status: met or status:
  rehomed after the flip; prose re-adjudication on the updated statuses confirms -- do NOT
  re-adjudicate the raw criterion text if the status already reads met); strict subset pass (>=1
  but not all) -> stage status: in_progress + progress_note: "<one-line description of what
  shipped this session>" (append a dated bullet if a progress_note already exists, rather than
  overwriting); zero criteria pass -> no YAML change. An item whose ALL criteria are now met (or
  rehomed) QUALIFIES for the completion gate -- do NOT auto-flip it to status: complete; surface it
  to the operator for manual confirmation (Status-Trusted-Never-Inferred), and only then stage
  status: complete.

decomposition_hint_inheritance: >-
  The three-step body behind the implement skill's "### Decomposition-hint exemption inheritance"
  header (kept verbatim in the skill, pinned by tests/test_implement_skill_decomposition_hints.py):
  (1) Find the parent -- scan docs/ROADMAP-PLATFORM.yaml tier_items[] for an item whose
  decomposition_hints.atomic_plans[] names the current plan, matching on the PLAN-{slug} token at
  the head of each entry (entry.strip().split()[0] == "PLAN-{slug}"). Some parents enumerate their
  children as prose descriptions rather than PLAN-{slug} tokens (e.g. T1.12's "Ratify lambda-*.yaml"
  entries, T1.6's phase descriptions); when no head-token match exists, map the current plan to its
  parent via the plan's Phase field / the decomposition rationale. (2) Inherit the flag -- the
  child's effective bootstrap_completion_exempt is the PARENT's live bootstrap_completion_exempt
  value. The per-item flag is the single source of truth -- the document-level "Bootstrap clause
  (COMPLETION exemption)" prose enumeration is documentation only. A child of an exempt parent
  (true) MAY stage status: complete on its slice even while the parent's gating CD is still state:
  pending; a child of a non-exempt parent (false) follows the normal flow and stays gated on CD
  ratification. Canonical examples: T-1.12 is bootstrap_completion_exempt: true, so its subset
  children inherit true (they may complete ahead of CD.25); T1.12 is false, so its per-Lambda
  children inherit false and ratify post-CD.16 under the normal flow. (3) Read-only resolution --
  inheritance never writes the parent's decomposition_hints or the child's flag during
  bookkeeping; it is read-only resolution at filing time. Record the inheritance in the bookkeeping
  output (e.g. "PLAN-<child-slug> inherits bootstrap_completion_exempt=true from parent T-1.12").
  This is not a license to author STRATEGIC children: the freeze stays in force and atomic
  children remain IMPLEMENTATION plans.

replacement_closure_check: >-
  Runs during the same bookkeeping walk for any checked tier_item whose name or intent implies a
  replacement: cutover, migration, backend swap, retirement, supersession, "replaces X". A
  replacement is CLOSED only when the old path is dead -- "new path works" is not closure
  (2026-06-09 roadmap audit, dimension D11). Before staging complete on such an item: (1) Name the
  replaced surface -- from the item text and the plan, identify the old path explicitly (file,
  Lambda, view, write path, profile, config flag). If neither the item nor the plan names it,
  derive it from the diff (what does the new code stop calling / start replacing?); if no old
  surface is derivable, record "no replaced surface identified -- closure check N/A" in the
  bookkeeping output rather than guessing. This check is per-touched-item: it closes the
  replacement THIS plan performed, not a repo-wide retirement sweep. (2) Verify the old path is
  dead or designed-rollback-only -- run the greps/commands that prove the old surface is deleted,
  fails closed, or is reachable ONLY behind the documented rollback flag. An unconditional fallback
  to a retired backend (e.g. a direct-SQL fallback on a table cut over to the DuckLake closed
  boundary) is a FAIL: do not count the cutover criterion as passing; surface the fallback as a
  finding and add its closure to the plan or stage a criterion for it on the open item. (3) Verify
  a named owner for any surviving old path -- partial cutovers are legitimate ONLY while a
  tier_item (or an explicit exit criterion elsewhere) owns the survivor's retirement. If none
  exists, stage one in the same YAML edit (a new criterion on the open item, or surface to the
  human that a successor item is needed). Deferred work with no carrier is invisible to
  eligibility computation and rots (audit finding F-018). (4) Close out superseded predecessors --
  if the completed work absorbs an older tier_item's scope, reconcile that older item in the same
  staged edit: status: reserved with a supersession note (preserving the id, per the T1.8
  precedent), or re-home its still-live criteria onto the owning item. Never leave two items
  claiming the same future work.

parallel_with_code_review_state_machine: >-
  Subagent-dispatch mode: no local step-1 dispatch -- return GATE_REQUEST (gate: code-review) and
  pause instead. Steps 2-3 below MUST complete BEFORE that pause, in the same turn -- there is no
  concurrency to run them against once paused. Steps 4-5 apply after SendMessage-resume with the
  verdict. (1) Dispatch the code-review subagent (the implement skill's Code Review Protocol). (2)
  WHILE code-review is running, the implement agent performs the criteria walk (bookkeeping_walk
  above) and stages the YAML edit locally (uncommitted -- git status shows
  docs/ROADMAP-PLATFORM.yaml as modified). (3) Idempotency on resume -- before staging, check for
  pre-existing uncommitted edits to docs/ROADMAP-PLATFORM.yaml. If present and matching what the
  bookkeeping rule would produce, no-op. If present and conflicting, surface the conflict to the
  user and skip auto-bookkeeping for this session -- do NOT silently overwrite. (4) Code-review
  verdict handling -- the code-review skill ends its report with a deterministic "Verdict: PROCEED
  | REVISE" line -- REVISE iff any Critical or High finding, else PROCEED. PROCEED -> commit the
  staged edit as a follow-up commit: git commit docs/ROADMAP-PLATFORM.yaml -m
  "roadmap(<tier-ids>): bookkeeping after <slug>", then push. REVISE -> discard the staged edit
  (git checkout -- docs/ROADMAP-PLATFORM.yaml), address code-review findings, then re-trigger
  verification + code-review and re-stage bookkeeping from scratch. (5) Abandonment / timeout -- if
  code-review does not return (interrupted or timed out), the staged YAML edit is treated as
  orphaned. On next session entry, the idempotency check detects the orphaned stage and reports it
  to the user for explicit accept/reject -- the implement skill does not auto-commit bookkeeping
  that lacks a verdict-attested verification pass. (6) Staged-edit-loss detection -- if any
  intermediate command (git checkout, git stash, git reset) clobbers the staged edit between
  dispatch and verdict, the next bookkeeping attempt detects this by re-running the criteria walk
  and comparing against the YAML's current state. Loss is observable, not silent.

governance_notes: >-
  Decision 181 declare-your-coverage residual (created by this plan, left unowned): the
  relocation check -- validate_skill_prose_relocation -- verifies a stub EXISTS with an anchored
  pointer and a tier word, but NOTHING verifies an agent actually followed the pointer before
  acting. A mandatory read-trigger is an agent obligation, not a mechanically enforced one, and
  this residual is distinct from the verified mechanics above. rec-3748 is the named owner, since
  a clause-to-check index (T2.54) is the mechanism that would eventually close it (mirrors the
  residual_owner pattern at docs/contracts/implement-scope-boundary.yaml and
  docs/contracts/exit-criteria-ledger.yaml's plan_followon_recs field).
