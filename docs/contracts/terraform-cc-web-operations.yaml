# CC-web terraform operating-procedure contract (PLAN-ambient-prose-contract-relocation, T2.56
# c1). A Class D mechanism contract carrying the full terraform/personal CC-web operating
# procedure -- provider-mirror init, remote-state variable recovery, the CD apply pipeline
# (speculative-plan + apply-the-saved-plan, Wave 2), alarm-only scheduled drift detection
# (Wave 5 / T2.24), the convergence anchor (Wave 1), and the operator-only break-glass loop --
# relocated out of terraform/CLAUDE.md's ambient S2 prose-budget surface (Decision 110/127) per
# Decision 86/114 routing. terraform/CLAUDE.md keeps only what the ROUTINE (non-admin) loop
# needs unaided: Hard rules, AWS context, the deployment-model channel table, the never-
# self-directed-apply norm, and Lambda interaction (Decision 114 anti-fragmentation -- the
# relocation must not force two-file reassembly for the routine loop).
#
# Declared subject is deliberately narrow and distinct from two sibling contracts this file must
# never duplicate: `environment-taxonomy.yaml` (sole SoT for the apply-model / guard
# classification -- what auto-applies vs what blocks) and `deploy-paths.yaml`'s
# `admin_out_of_band.procedure` (the ratified T2.41 quarantine destination for the operator
# break-glass recovery STEPS, which declares itself never a second source of truth). This file
# carries the CC-web-specific MECHANICS around those two authorities (provider init, state
# recovery, the CD workflows' internal wiring) -- never their classification rules.
contract:
  id: terraform-cc-web-operations
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-ambient-prose-contract-relocation"
  description: >-
    Class D mechanism contract for the CC-web terraform/personal operating procedure: provider-
    mirror init and its github.com-egress relaxation, remote-state variable recovery, the CD
    apply pipeline (speculative-plan + apply-the-saved-plan), alarm-only scheduled drift
    detection, the convergence anchor, and the operator-only break-glass loop.
    terraform/CLAUDE.md's 'Running terraform/personal/ on CC-web' section points here rather
    than restate it.
  subject: terraform-cc-web-operations
  evaluator:
    check: validate_terraform_cc_web_operations

