---
# Substrate index. A Class D mechanism contract (migration-step-3-grandfathering, T2.56
# migration step 3) as of the `contract:` block below.
#
# Purpose: bridges the documentation gap left by ops-data-store.md retirement (T0.12.5).
# Records substrate type, write boundary, and read boundary for tables that do NOT yet
# have their own Class A contracts. Tables with Class A contracts are indexed there.
#
# For DuckLake-boundary tables: see docs/contracts/read-engine.yaml (version 3).
# DuckLake-on-Neon is the sole substrate: every ops table listed here reads through the closed
# ducklake_reader boundary and writes through ducklake_writer.
#
# Class A contracts (authoritative, not indexed here):
#   ops_recommendations    -> docs/contracts/ops_recommendations.yaml (T0.12.5)
#   ops_decisions          -> docs/contracts/ops_decisions.yaml (T0.12.5)
#   telemetry_sessions     -> docs/contracts/telemetry_sessions.yaml (T0.12.6)
#   telemetry_observations -> docs/contracts/telemetry_observations.yaml (T0.12.6)
#   telemetry_transcripts  -> docs/contracts/telemetry_transcripts.yaml (T0.12.6)
#   telemetry_agents       -> docs/contracts/telemetry_agents.yaml (T0.12.6)
#
contract:
  id: storage-substrate
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The substrate-index body itself is unchanged by this envelope.
  subject: storage-substrate
  evaluator:
    check: validate_data_model_standard

amendment_log:
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: references to the removed trading-product surfaces and the retired
      pre-DuckLake query-engine estate were removed or reworded.
    migration_story: >-
      The repository became platform-only. Product surfaces (broker credentials, the product
      roadmap, the market-data pipeline) and the retired legacy query-engine path (staging
      outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's
      references to them were removed in the same change. No live DuckLake field or verb
      semantics changed.
  - date: "2026-09-13"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-control-table-class-and-counter-conformance (T2.26): register ops_entity_counters, the
      first (and so far only) control-class table, with its write_boundary/read_boundary/
      maintenance_binding/dq_scope. No existing table entry changed.
    migration_story: >-
      Additive registration entry; every existing table entry is unchanged. Satisfies
      scripts/checks/contracts/validate_data_model_standard.py's merge_key-bearing-table gate
      (grain + write_mode both present).

version: 1
updated_at: "2026-06-24"
updated_by: "PLAN-ratify-class-a-telemetry-contracts (T0.12.6)"

tables:
  # ---------------------------------------------------------------------------
  # Dormant DuckLake ops tables (schema-ready; not yet live-exercised)
  # ---------------------------------------------------------------------------
  ops_priority_queue:
    substrate: DuckLake-on-Neon
    status: dormant
    reason: executor paused (CD.17); current-state is the Decision-70 latest-queue_run set
    write_boundary: ducklake_writer Lambda (action_write_ops) -- when executor resumes
    read_boundary: ducklake_reader Lambda (NAMED VERBS only)
    merge_key: rec_id
    grain: one row per rec_id
    write_mode: scd2
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_priority_queue
    read_engine_ref: docs/contracts/read-engine.yaml
    graduation_blocker: CD.17 reversal + executor resume

  ops_execution_plans:
    substrate: DuckLake-on-Neon
    status: live
    reason: >-
      T2.26 (c9): created fresh on the DuckLake closed writer/reader boundary -- no predecessor table
      ever existed for it in the personal account. The executor producer stays CD.17-frozen so the
      table lands empty until resume.
    write_boundary: ducklake_writer Lambda (action_write_ops, via scripts/ops_portal/execution_plans.py)
    read_boundary: ducklake_reader Lambda (NAMED VERBS + query_ops)
    merge_key: rec_id
    grain: one row per plan revision (rec_id, revision); current = latest revision per rec_id
    write_mode: scd2
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_execution_plans
    read_engine_ref: docs/contracts/read-engine.yaml
    graduation_blocker: CD.17 reversal + executor resume (table lands empty until then)

  # ---------------------------------------------------------------------------
  # DuckLake control-class table (T2.26 control-table-class-and-counter-conformance): writer-
  # internal bookkeeping, never an application table. See docs/contracts/ops_entity_counters.yaml
  # (Class A contract) and data-modeling-standard.yaml write_modes.control for the full invariant
  # set.
  # ---------------------------------------------------------------------------
  ops_entity_counters:
    substrate: DuckLake-on-Neon
    status: live
    reason: >-
      T2.26: the writer-owned entity-id allocation counter (Decision 84 I-2), registered and
      partitioned for the first time -- previously an ungoverned ad-hoc table (3,418 unpartitioned
      live files for ONE row, measured 2026-09-12).
    write_boundary: >-
      ducklake_writer Lambda, writer_internal ONLY -- create_ops_tables provisioning plus the
      writer's own in-transaction allocate/advance calls; NOT reachable through
      write_ops/file_ops/update_ops (ducklake_scd2_schema.resolve_table_spec refuses it).
    read_boundary: >-
      none -- writer-owned, in-transaction only. Periodic health assertion via the admin
      ducklake_maintenance control_health verb (maintenance_binding below); not an application
      read path (never reachable through query_ops/named_read/read_ops_current/read_ops_history).
    merge_key: counter_name
    grain: one row per writer-keyspace ops table (id_keyspace=writer; today ops_recommendations only)
    write_mode: control
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_entity_counters
    maintenance_binding: control_health (ducklake_maintenance, every 6h)
    dq_scope: exempt -- see docs/contracts/ops_entity_counters.yaml's dq_scope rationale

  # ---------------------------------------------------------------------------
  # DuckLake append-only tables (event-journal write mode, T1.14)
  # ---------------------------------------------------------------------------
  ops_smoke_events:
    substrate: DuckLake-on-Neon
    status: smoke
    write_mode: append_only
    write_mode_invariant: "history table only; no current write-through projection (ScdTableSpec.current_table=None)"
    write_boundary: ducklake_writer Lambda (action_write_ops) -- append events only; require_exists=True illegal
    read_boundary: direct DuckDB ATTACH (ops_smoke_events_history) -- no reader Lambda verb for current
    merge_key: event_id
    grain: one row per event_id
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_smoke_events
    note: platform-generic append_only kernel proof (T1.14); no current_table in ScdTableSpec

  # ---------------------------------------------------------------------------
  # Telemetry tables -- canonical 4-table trace/observation model (Decision 95);
  # unbuilt, pending the Phase 4 DuckLake rebuild (Decision 84).
  # ---------------------------------------------------------------------------
  telemetry_tables:
    note: >-
      CANONICAL model (Decision 95): four tables -- telemetry_sessions, telemetry_observations,
      telemetry_transcripts, telemetry_agents -- each with a ratified Class A contract authored at
      T0.12.6 (those four are indexed in the "Class A contracts (authoritative)" header above, NOT in
      this substrate table). No telemetry table is provisioned today: the legacy draft schema and its
      emitters were deleted with the retired query-engine estate, so the Class A contracts are
      target-state only until the Phase 4 rebuild lands them on DuckLake.
    substrate: DuckLake-on-Neon (target state)
    status: not_provisioned
    reason: >-
      Legacy draft schema and emitters deleted; no telemetry table exists in the personal account and
      no writer emits telemetry. Rebuild is owned by tier_item T2.36 / Phase 4.
    write_boundary: ducklake_writer Lambda -- at the Phase 4 rebuild
    read_boundary: ducklake_reader Lambda (NAMED VERBS only) -- at the Phase 4 rebuild
    contract_ref:
      - docs/contracts/telemetry_sessions.yaml
      - docs/contracts/telemetry_observations.yaml
      - docs/contracts/telemetry_transcripts.yaml
      - docs/contracts/telemetry_agents.yaml
    migration_ref: "tier_item T2.36 + Decisions 95/96/97"
    disposition: >-
      Phase 4 consolidation (after T2.26): rebuild on the DuckLake telemetry substrate as the canonical
      four-table model per the Class A contracts; partition day(started_at) / day(created_at)
      (Decision 96, realized at Phase 4 using the DuckLake partition-as-code mechanism T2.33 established
      for the ops tables); ULID identity (Decision 97, realized when the session-open path is rebuilt).
    canonical_tables:
      - telemetry_sessions
      - telemetry_observations
      - telemetry_transcripts
      - telemetry_agents
