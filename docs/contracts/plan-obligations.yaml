# Class D contract for the mechanical plan-scope registration-closure gate (plan-obligation-
# closure). Holds ONLY the registration-surface map scripts/roadmap/plan_obligations.py reads at
# check time -- the engine holds no second copy. No numbered Decision backs this contract: what
# it declares is mechanism (a check plus its data) and Layer-3 workflow wiring, which routes to
# the owning contract per the field_semantics row, not to a numbered entry (see the plan's
# Context field for the full non-ratification rationale). Authored at provisional_v0 because the
# registration-surface map is new and unexercised against real plan traffic; a re_ratification_trigger
# (not a numbered Decision) governs when it must be revisited.
contract:
  id: plan-obligations
  class: D
  contract_version: 1
  status: provisional_v0
  description: >-
    The registration-surface obligation map validate_plan_scope_closure reads to flag (1) a
    net-new, schema_version >= 4 IMPLEMENTATION plan whose scope omits a mechanically-derivable
    companion registration (a domain _manifest.py Entry, a config/ci_rca_taxonomy.yaml row, or a
    mirror test) for a newly-created check module or a newly-created CI workflow file, and (2)
    this map's own body violating its five-guard `enforced_elsewhere` admission grammar
    (validate_obligation_grammar). Registration closure only -- rules needing semantic judgement
    (e.g. the Closure Obligation / Related-Work Check) are explicitly out of scope and stay owned
    by .claude/skills/planning/SKILL.md.
  subject: plan-obligations
  evaluator:
    check: validate_plan_scope_closure
  provisional_v0:
    authored_at: "2026-08-11"
    authored_via: "PLAN-plan-obligation-closure"
    rationale: >-
      The trigger-pattern/requires map is new and has been exercised only against the fixture
      plans in this plan's own Verification Plan, not real plan-authoring traffic. provisional_v0
      lets the map's shape settle (e.g. a second trigger rule for a new-domain check module, which
      needs four registry.py aggregation edits the current single rule does not model) before it
      is treated as stable.
    re_ratification_trigger:
      first_of:
        - "registration_surfaces_rule_count >= 3"
        - "registration_surfaces_section_kinds_count >= 2"
        - "days_since_authored_at >= 90"
    re_ratification_owner: "human + plan-critique gate"

amendment_log:
  - date: "2026-08-24"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      verification-registry-sharding plan: re-grounded the new_check_module registration-surfaces
      prose from "a flat verification-registry row" to "a per-check_id verification-registry
      shard", matching the registry's re-grain from one flat file to one record per file. No
      trigger, obligation, or re-ratification field changed -- wording only.
  - date: "2026-09-12"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-plan-obligations-surface-completeness (dec-181 declare-your-coverage): dropped the
      restated numeric-literal surface count (rec-3726; the earlier prose pinned a stale digit
      immediately ahead of the words "registration surfaces") in favour of a pointer at
      scripts/checks/registry.py's own authoritative enumeration; added the `enforced_elsewhere`
      section kind (an accounting-declaration pointer row for surface 7 and a
      verification-registry-shard pointer row for surface 5), each admitted only when all five
      validate_obligation_grammar guards hold (G1 no path_template, G2 enforced_by resolves in
      registry.all_checks(), G3 enforced_by is dispatched in pre_sequence()/full_sequence(), G4
      why_not_a_scope_row is present and non-empty, G5 the entry's fires_on covers the enclosing
      rule's trigger.action); named surface 2 (the @register(...) decoration) as an UNENFORCED
      residual owned by rec-3754 (dec-181 point 2); and added the new_workflow_file rule
      (rec-2736) obligating a config/ci_rca_taxonomy.yaml workflows-map row for a newly-created
      .github/workflows/*.yml file. validate_plan_scope_closure's grammar leg now runs
      unconditionally (even with no plan present in the diff), so this contract's own body is
      gated the moment it drifts from its grammar -- the registered check's requires-row gating
      verdict is otherwise unchanged (`failed` still derives solely from
      `_derive_findings`/`evaluate_plan` over `requires` rows; an `enforced_elsewhere` entry never
      reaches `failed`).

      dec-118 re_ratification_trigger note: this edit grows the map's SHAPE (a new section kind
      plus a five-guard grammar) without moving `registration_surfaces_rule_count` past its
      existing >=3 threshold (now 2 of 3: new_check_module, new_workflow_file). Rule count alone
      is no longer a sufficient "has the shape settled" proxy once the map can also grow a new
      SECTION KIND under an existing rule, so this edit widens the trigger with a
      `registration_surfaces_section_kinds_count >= 2` disjunct (now satisfied: `requires` and
      `enforced_elsewhere` both present) -- deliberately firing immediately on this edit's own
      landing, prompting the human + plan-critique re-ratification review the provisional_v0
      rationale calls for before the newly-added mechanism is treated as stable.
      contract_version stays 1: a Class D provisional_v0 field addition, not a ratified-contract
      semantic break.

registration_surfaces:
  new_check_module:
    purpose: >-
      A newly Created scope row matching scripts/checks/<domain>/(validate|check)_<name>.py
      obligates the companion scope rows named below, per the registration surfaces enumerated in scripts/checks/registry.py
      (its own module docstring is the authoritative enumeration; this map restates no count of
      it, and mints no sub-numbering of its own -- registry.py's numbering is used verbatim). The
      check module itself is the triggering row -- surface 1, not a derived
      obligation. Surfaces 3, 4 and 6 are the `requires` rows below. Surfaces 5 (a
      per-GRADUATED-verification_plan-step verification-registry shard) and 7 (the Decision 170
      accounting declaration) are `enforced_elsewhere` rows: each obligation is real but not
      scope-row-shaped (see each entry's why_not_a_scope_row), so a companion registered,
      sequenced check enforces it directly instead of this map deriving a companion path. Surface
      2 (the `@register(...)` decoration) is an UNENFORCED residual (dec-181 point 2): no
      registered, sequenced check inspects a new check module's body to confirm the decoration was
      actually applied -- owned by rec-3754.
    reason: "a new check module"
    trigger:
      file_pattern: '^scripts/checks/(?P<domain>[^/]+)/(?P<basename>(?:validate|check)_[A-Za-z0-9_]+)\.py$'
      action: Create
    requires:
      - label: "domain manifest Entry"
        path_template: "scripts/checks/{domain}/_manifest.py"
      - label: "ci_rca_taxonomy function_to_category row"
        path_template: "config/ci_rca_taxonomy.yaml"
      - label: "mirror test"
        path_template: "tests/checks/{domain}/test_{basename}.py"
    enforced_elsewhere:
      - label: "Decision 170 accounting declaration"
        enforced_by: validate_check_accounting
        why_not_a_scope_row: >-
          The declaration is an examined()/skipped() call inside the triggering check module's OWN
          body (surface 7) -- there is no separate companion FILE a scope row could name;
          validate_check_accounting's touch-it-fix-it leg enforces it directly against that same
          module on every edit that touches it.
        fires_on: [Create, Modify]
      - label: "graduated verification-registry shard"
        enforced_by: validate_graduation_completeness
        why_not_a_scope_row: >-
          Owed per GRADUATED verification_plan step, not per check module (surface 5) -- the
          obligation's cardinality does not match a single derivable companion path;
          validate_graduation_completeness enforces it directly against the resolved plan's own
          verification_plan dispositions.
        fires_on: [Create]

  new_workflow_file:
    purpose: >-
      A newly Created .github/workflows/*.yml scope row obligates a companion
      config/ci_rca_taxonomy.yaml workflows-map row -- the first leg of validate_ci_rca_taxonomy,
      which enumerates .github/workflows/*.yml display names (non-recursive, `.yml` only, matching
      scripts.ci_rca.taxonomy.enumerate_workflow_name_paths). An unregistered workflow silently
      escapes CI-RCA attribution (rec-2736).
    reason: "a new CI workflow file"
    trigger:
      file_pattern: '^\.github/workflows/[^/]+\.yml$'
      action: Create
    requires:
      - label: "ci_rca_taxonomy workflows map row"
        path_template: "config/ci_rca_taxonomy.yaml"
