# VALUE-MATERIAL plane for Secrets Manager credentials (T2.56 migration step 7, finding CFG-10;
# PLAN-decision-37-migrate-then-rehome). Rehoming destination for Decision 37's two still-live
# derived patterns (SECRET-VALUE-OUT-OF-BAND, RUNTIME-FETCH), minted via Decision 175's
# migrate_then_rehome branch (docs/contracts/decision-entry.yaml compaction.procedure) because
# Decision 37's superseder (Decision 116, scheduled-agent provider routing) restates neither
# pattern. Decision 37 itself is now a compacted stub pointing here and at Decision 116.
#
# ADJACENT PLANE (Decision 157): this contract governs WHICH SECRETS MANAGER ACTIONS TOUCH VALUE
# MATERIAL and how that material enters/leaves Terraform state -- the VALUE-MATERIAL plane.
# Decision 157 governs the IAM-VERB plane (which IAM actions are value-capable vs metadata-only,
# and which prefix an IAM statement may ride). The two are complementary, never overlapping: a
# reader must not conflate "does this write/read VALUE material" (here) with "which IAM verb class
# does that require" (Decision 157).
#
# PUBLIC REPOSITORY (Decision 101): this file names no AWS account ID, ARN, or ExternalId --
# resource identifiers below are Terraform-local names and Secrets Manager resource NAMES
# (public, non-secret strings), never account-scoped ARNs.
contract:
  id: secret-material-handling
  class: D
  contract_version: 1
  status: provisional_v0
  description: >-
    The VALUE-MATERIAL plane for AWS Secrets Manager credential handling: names the
    SECRET-VALUE-OUT-OF-BAND and RUNTIME-FETCH patterns and the closed set of declared exceptions
    where a secret's value legitimately enters Terraform state. validate_secret_material_handling
    reads value_exceptions below (never hardcoded resource names) to flag any undeclared
    aws_secretsmanager_secret_version RESOURCE (not data source) in the terraform tree.
  subject: secret-material-handling
  evaluator:
    check: validate_secret_material_handling
  provisional_v0:
    authored_at: "2026-08-24"
    authored_via: "PLAN-decision-37-migrate-then-rehome"
    rationale: >-
      First exercise of the migrate_then_rehome branch; the value_exceptions shape has been tested
      only against this repository's own terraform tree (five credential domains, two live
      exceptions), not against a second repository or a third exception case. provisional_v0 lets
      the shape settle before treating it as stable.
    re_ratification_trigger:
      first_of:
        - "value_exceptions entries count >= 5"
        - "days_since_authored_at >= 90"
    re_ratification_owner: "human + plan-critique gate"

amendment_log:
  - date: "2026-08-24"
    semantic_break: false
    change_class: field_add
    summary: "Initial authoring (Decision 175 / PLAN-decision-37-migrate-then-rehome)."

patterns:
  secret_value_out_of_band: >-  # pragma: allowlist secret -- describes a pattern, not a credential
    Terraform manages only the aws_secretsmanager_secret ENVELOPE (name, description, tags,
    rotation metadata); key material is set out-of-band via `aws secretsmanager put-secret-value`
    (CLI, human-run) and never enters Terraform state. This is the DEFAULT for every credential
    domain this contract governs unless a resource is a declared exception below. Secret tag
    values use the ASCII tag charset only -- no parentheses (a prior Purpose-tag parenthesis broke
    TagResource; see terraform/personal/inference_credentials.tf).
  runtime_fetch: >-
    Consumers (Lambdas, scripts, the smoke test) fetch secret material from Secrets Manager AT
    RUNTIME via the AWS SDK -- never via a Terraform output embedding the value, and never via a
    process environment variable populated from Terraform. The envelope's ARN is the only
    Terraform-exported artefact; resolving that ARN to a value is a runtime GetSecretValue call.
  domains:
    - "broker keys -- terraform/personal/secrets_manager_brokers.tf (T2.14)"
    - "inference API keys -- terraform/personal/inference_credentials.tf (CD.28 / T0.4)"
    - "DuckLake Neon catalog DSN -- terraform/personal/neon_ducklake_catalog.tf (CD.34)"
    - "GitHub PAT -- terraform/personal/prod_lambdas.tf (T2.43)"
    - "CI/OIDC grants -- terraform/bootstrap/github_ci_apply_reads.tf"

value_exceptions:
  - resource: "aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn"
    file: terraform/personal/neon_ducklake_catalog.tf
    reason: >-
      The Neon provider generates the database role password INSIDE Terraform (neon_role /
      neon_database resources); the DSN value does not exist before apply, so there is no
      out-of-band alternative. IN-BAND by construction, not a policy exception (CD.34).
  - resource: "aws_secretsmanager_secret_version.github_pat_placeholder"
    file: terraform/scheduled_agents.tf
    reason: >-
      Legacy non-applied root (CD.21) -- the scheduled-agent dispatcher/findings-processor Lambda
      stack this file describes is not deployed, so the placeholder string never reaches a real
      AWS account. Superseded by Decision 116; retained as historical artefact only.

governance_notes: >-
  Class D mechanism contract (contract-population.yaml shape_grammar); no top-level `fields:` or
  `verbs:` key -- value_exceptions and domains are plain lists, not Class A/B field descriptors.
  The evaluator is credential-free (pure terraform-text + this contract's own YAML), eligible for
  --pre. This contract does NOT govern the IAM-VERB plane (Decision 157) or broker-specific
  routing (docs/contracts/credential-routing.yaml, which delegates its SECRET-VALUE-OUT-OF-BAND
  audit_invariant here rather than restating it).
