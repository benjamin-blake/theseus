# Inference-provider registry. A Class D mechanism contract (migration-step-3-grandfathering,
# T2.56 migration step 3) as of the `contract:` block below.
#
# Purpose: machine-readable inference-provider contract -- provider tier model, model naming
# conventions, provider field schema, and auth requirements for all inference calls. Converts
# the retired prose inference-provider contract (v7.0, June 2026) per the agent-first
# contract-conversion wave (T-1.13..T-1.19, Decision 86).
contract:
  id: inference-provider
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-inference-provider-yaml-conversion (T-1.14)"
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The provider-tier body itself is unchanged by this envelope.
  subject: model-routing-config
  evaluator:
    check: validate_inference_provider_registry

amendment_log:
  - date: "2026-08-19"
    semantic_break: false
    change_class: schema_reshape_field_add_and_key_move
    summary: >-
      PLAN-provider-agnostic-tier-model (Decision 173): tier_model is re-keyed onto ROLES. Added
      role / billing_shape / cold_start_assertion / selection_ref to every tier row, plus the
      role_model, provider_identity_home, billing_shape_vocabulary, cold_start_assertion_rule and
      selection_constraints (retired_providers_excluded, vendor_independence,
      coupled_reversal_conditions) keys. REMOVED the bare `provider:` key from all three tier rows
      -- its value moves into model_id_formats.litellm_tier_models, which becomes the SOLE
      provider-identity home and gains a `provider:` key per tier plus a tier_3 row. RENAMED tier
      3's name from openrouter to aggregator. provider_defaults.executor_path and
      retired_providers are unchanged. semantic_break: false -- no code or config reads tier_model
      or litellm_tier_models (model_registry.py reads the model_routing: block only).
  - date: "2026-08-17"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-agents-md-ambient-trim: repointed operative_state.scheduled_agents.ref off the
      now-deleted AGENTS.md Lambda re-enable runbook onto T4.12, since the ambient prose trim
      removed that runbook wholesale. No change to the provider-tier body itself.
  - date: "2026-08-14"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      rec-3059 enforcer build: flipped the evaluator from the routed none_grandfathered debt
      record to {check: validate_inference_provider_registry}, which asserts
      provider_defaults.executor_path agrees with scripts/llm/model_registry.py's
      _VALID_PROVIDERS / _DEFAULT_EXECUTOR_PROVIDER and that retired_providers stay disjoint
      from the valid set. No change to the provider-tier body itself.

version: 1
contract_version: 1
status: ratified
ratified_at: "2026-07-05"
ratified_via: "PLAN-inference-provider-yaml-conversion (T-1.14)"
last_verified: "2026-07-05"
decisions_cited:
  - Decision-173
  - Decision-118
  - Decision-86
  - Decision-116
  - CD.28
  - CD.25
note: >-
  Converted from inference-provider.md v7.0. Decision reference: CD.28 (docs/ROADMAP-PLATFORM.yaml
  candidate_decisions) defines the tier model and retires Bedrock from the architecture. Decision 53
  (docs/DECISIONS_ARCHIVE.md) governs the operative executor transport (Gemini CLI). Decision 49
  governs the scheduled-agent provider until PLAN-resolve-scheduled-agent-provider lands. Applies to
  all executor and Lambda-executed agent code (scripts/, src/data/handlers/).

projects_to:
  config/agent/copilot/model_routing.yaml:
    status: absorbed_and_deleted
    note: >-
      model_routing.yaml's providers.gemini + executor.{default_provider,roles,effort_bands,
      file_pattern_floors,escalation} block is reproduced verbatim (minus the CD.28-retired
      bedrock provider) under this file's model_routing: key. model_registry.py reads it from
      here; no separate file remains.

tier_model:  # CD.28 committed architecture, role-keyed per Decision 173
  role_model: >-
    Decision 173: the tiers are ROLES, and provider identity is configuration, not architecture.
    Tier 1 = primary route; Tier 2 = warm-fetched fallback on a provider INDEPENDENT of Tier 1's
    (the Decision 47 lock-in escape hatch), validated at every harness cold start; Tier 3 =
    deferred aggregator. Changing which provider or model fills a role is an edit to THIS file and
    requires no Decision amendment.
  provider_identity_home: >-
    model_id_formats.litellm_tier_models -- the SOLE place a tier's provider and model ids are
    named. The rows below carry the ROLE plus its billing/assertion shape and a selection_ref
    pointer; they hold no second copy of a provider name (Decision 127: one home per value).
  billing_shape_vocabulary: [metered_marginal, fixed_non_rollover_allowance]
  cold_start_assertion_rule: >-
    Decision 173 clause 4 -- PRECEDENCE, state over billing_shape: a tier whose state is Deferred
    declares cold_start_assertion: not_applicable until it is committed, whatever its
    billing_shape. Otherwise a tier whose billing_shape is fixed_non_rollover_allowance REQUIRES
    cold_start_assertion: remaining_allowance, and a metered_marginal tier requires
    cold_start_assertion: credential_liveness. The precedence is stated because the three limbs
    are not disjoint -- tier 3 is metered_marginal AND Deferred today, so a parallel reading
    leaves the shipped row satisfying one limb and violating another.
  selection_constraints:
    retired_providers_excluded: >-
      Decision 173 clause 2(a) -- no role may be filled by an id listed in retired_providers.
      Restoring one requires a Decision superseding the entry that retired it (Decision 122/CD.28
      for bedrock, Decision 116 for copilot-sdk and gemini_byok), never a contract edit.
    vendor_independence: >-
      Decision 173 clause 2(b) -- the primary and warm_fetched_escape_hatch roles MUST resolve to
      DIFFERENT providers; a same-vendor pair is not an escape hatch (Decision 47).
    coupled_reversal_conditions: >-
      Decision 173 clause 2(c) -- a swap changing the vendor or the billing_shape of EITHER role
      re-arms Decision 116's and Decision 164's reversal conditions and owes a dated annotation on
      both entries in docs/DECISIONS.md. Scope note: this clause formerly read "under Decision
      116's shared-allowance coupling", which named only the fallback side and left a primary-side
      billing-shape change uncovered. UNENFORCED: no registered check evaluates this constraint --
      it is a human obligation with no structural carrier, disclosed here per Decision 168 rather
      than presented as a rule. The primary_billing_shape constraint below IS enforced, and covers
      the one case where a silent change would void Decision 164's conclusion.
    primary_billing_shape: >-
      Decision 173 clause 2(d) -- the primary role MUST resolve to billing_shape:
      metered_marginal. Decision 164's volume argument turns on the primary route billing as
      metered marginal cost rather than against a fixed non-rollover allowance; both that
      Decision's re-read condition (c) and Decision 173's own primary-unit-price-move reversal
      condition presuppose a metered primary and lose their referent without it. Moving the
      primary role to fixed_non_rollover_allowance therefore requires a Decision superseding
      Decision 164's volume argument, never a contract edit.
  tiers:
    - tier: 1
      name: primary
      role: primary
      billing_shape: metered_marginal
      cold_start_assertion: credential_liveness
      selection_ref: model_id_formats.litellm_tier_models.tier_1
      transport: LiteLLM
      state: "Committed; lands with T4.2's PLAN-llm-client-litellm-transport"
    - tier: 2
      name: warm_fetched_escape_hatch
      role: warm_fetched_escape_hatch
      billing_shape: fixed_non_rollover_allowance
      cold_start_assertion: remaining_allowance
      selection_ref: model_id_formats.litellm_tier_models.tier_2
      transport: LiteLLM
      state: "Committed; credential validated at every harness cold start"
    - tier: 3
      name: aggregator
      role: aggregator
      billing_shape: metered_marginal
      cold_start_assertion: not_applicable
      selection_ref: model_id_formats.litellm_tier_models.tier_3
      transport: LiteLLM
      state: Deferred
  note: >-
    LiteLLM is the only Layer-1 inference protocol surface under CD.28. Direct provider-SDK
    imports are forbidden in the executor and in scripts/llm/client.py.

operative_state:  # until T4.2 lands
  executor_pipeline:
    provider: gemini-cli
    entrypoint: "scripts/llm/client._gemini_call"
    models: "Gemini 3 models via local CLI headless mode"
    decision: Decision-53
  scheduled_agents:
    status: disabled
    since: "2026-05"
    ref: "T4.12"
    note: >-
      schedule.yaml entries still declare provider: copilot-sdk (T4.3-owned; not migrated by
      this contract). Per Decision 116 (supersedes Decision 49), routine/non-agentic agents
      migrate to LiteLLM Tier 1 (DeepSeek) and judgment/agentic agents migrate to claude -p;
      realization is owned by CD.28's PLAN-resolve-scheduled-agent-provider follow-on.

retired_providers:
  - id: bedrock
    reason: "RETIRED per CD.28"
    note: >-
      scripts/bedrock_client.py and all dispatch branches were deleted by the T1.15 sweep
      (this contract's v7.0 prose revision). No rollback path in code; reintroduction requires
      a new decision.
  - id: copilot-sdk
    reason: "RETIRED from the active provider set per Decision 116 (supersedes Decision 49)"
    note: >-
      scripts/copilot_sdk_client.py and the handler dispatch branch are deleted; an agent
      declaring this provider raises RetiredProviderError and is recorded as a failed
      invocation (no silent misroute).
  - id: gemini_byok
    label: "gemini (BYOK via Copilot SDK)"
    reason: "RETIRED alongside copilot-sdk per Decision 116"
    note: "Same RetiredProviderError handling."

provider_defaults:  # contract = code; MUST stay in sync with it
  executor_path:
    entrypoint: "scripts.llm.client.llm_call -> scripts.llm.model_registry.resolve_provider"
    default: gemini
    valid_providers: [gemini]  # bedrock retired per CD.28
    fallback_behavior: >-
      resolve_provider() reads LLM_PROVIDER and falls back to "gemini" for any unrecognised
      value (including the retired bedrock). llm_call raises LLMResponseError if a non-gemini
      provider somehow resolves (defense-in-depth until T4.2's LiteLLM transport).
  scheduled_agent_path:
    entrypoint: "src/data/handlers/scheduled_agent_handler.py"
    absent_field_default: github-models
    note: >-
      All current .github/agents/schedule.yaml entries declare provider: copilot-sdk
      explicitly; the absent-field default exists for legacy/local use and MUST NOT be relied
      on for new entries.

provider_field_schema:
  required_field: provider
  declared_in: ".github/agents/schedule.yaml"
  example:
    name: doc-freshness
    cron: "0 6 * * 1"
    model: claude-haiku-4.5
    provider: copilot-sdk
    prompt_path: ".github/prompts/scheduled/doc-freshness.prompt.md"
  valid_values:
    - value: copilot-sdk
      client: "RETIRED -- raises RetiredProviderError"
      where_valid: >-
        Not valid anywhere; Decision 116 (supersedes Decision 49). Existing schedule.yaml
        entries fail loudly until PLAN-resolve-scheduled-agent-provider migrates them.
    - value: gemini
      client: "RETIRED -- raises RetiredProviderError"
      where_valid: "Not valid anywhere; retired alongside copilot-sdk per Decision 116."
    - value: github-models
      client: "scripts/llm/github_models_client.chat_completion()"
      where_valid: "Local only -- MUST NOT be used in Lambda; the absent-field default."
    - value: litellm
      client: "T4.2 transport (not yet built)"
      where_valid: "Future-state per CD.28; do not declare until PLAN-resolve-scheduled-agent-provider lands."
  invalid_value_note: >-
    provider: bedrock is INVALID. The dispatch branch was removed; an agent declaring it falls
    through to the github-models default branch (PAT fetch + live GitHub Models call), which
    then fails loudly at the API layer on the unrecognized Bedrock-style model id.

model_id_formats:
  gemini_cli:  # operative -- executor pipeline, Decision 53
    format: "Google Gemini 3 model names passed to the CLI via --model flag (or omitted for Auto mode)"
    use_cases:
      - case: auto
        model_id: null
        notes: "CLI selects pro or flash based on task complexity (default -- CLI picks)"
      - case: high_complexity
        model_id: gemini-3-pro-preview
        notes: "Strong reasoning"
      - case: fast_simple
        model_id: gemini-3-flash-preview
        notes: "Low latency"
    auth: "Google OAuth via browser flow (run `gemini` once locally)"
    cli: "Headless mode: prompt on stdin with -p \"\", --output-format stream-json"
    exit_codes:
      - {code: 0, meaning: success}
      - {code: 1, meaning: general_error}
      - {code: 42, meaning: bad_input}
      - {code: 53, meaning: turn_limit_exceeded, retryable: true}
    version_requirement: "Preview (0.40.0+) required for Gemini 3 models. Install: npm install -g @google/gemini-cli@preview"
    routing: "docs/contracts/inference-provider.yaml (model_routing:) -> scripts/llm/model_registry.py -> scripts/llm/client._gemini_call()"
    cost: "Free tier (personal Google Pro plan). The gemini transport reports cost_usd=0.0."
  litellm_tier_models:  # committed -- lands at T4.2. SOLE home for tier provider/model identity
    tier_1:
      provider: DeepSeek-direct   # CURRENT SELECTION for the primary role (Decision 173)
      models: ["deepseek/deepseek-chat", "deepseek/deepseek-reasoner"]
      notes: >-
        Aliases remap to deepseek-v4-flash post-2026-07-24 per upstream deprecation; native
        context caching is hash-based and automatic. Selection under Decision 173 clause 2 --
        changing it is a contract edit, not a Decision amendment.
    tier_2:
      provider: Anthropic-direct  # CURRENT SELECTION for the warm-fetched fallback role
      models: ["Anthropic-direct Claude models via LiteLLM"]
      notes: >-
        Funded by a fixed non-rollover allowance credit; boot validation asserts REMAINING
        ALLOWANCE per Decision 173 clause 4 -- CD.28's ">10% pool" figure is that rule's
        fixed-allowance instance.
    tier_3:
      provider: OpenRouter        # CURRENT SELECTION for the deferred aggregator role
      models: []
      notes: >-
        Deferred; no models selected, so the aggregator role declares cold_start_assertion:
        not_applicable until it is committed (Decision 173 clause 4).
  copilot_sdk:  # legacy -- disabled scheduled agents
    format: "{provider}-{family}-{version} (e.g., claude-haiku-4.5, claude-sonnet-4.6)"
    note: "Differs from GitHub Models IDs (gpt-5-mini, openai/gpt-4.1) -- do not interchange. See Decision 49."
  github_models:  # local use only
    note: "GitHub Models uses different naming: gpt-5-mini, openai/gpt-4.1, claude-opus-4-5. Not valid for any other provider."

iam_requirements:
  summary: >-
    No inference-provider IAM grants are required: the operative executor transport (Gemini
    CLI) and the committed CD.28 tiers (DeepSeek-direct, Anthropic-direct via LiteLLM)
    authenticate with API keys (Secrets Manager / local credential files), not AWS IAM.
  retired_grant: >-
    The former BedrockInference Lambda-execution-role statement (bedrock:InvokeModel,
    bedrock:InvokeModelWithResponseStream) is RETIRED: the live personal-account PlatformDev
    policy is permission-closed (no Bedrock grant; see terraform/CLAUDE.md reconciliation
    note), and the retired work-root grant text was removed by the T1.15 sweep.
  secrets_manager:
    - name: agent-platform-github-pat
      note: "OAuth gho_ token, NOT a classic PAT"
    - name: "Gemini API key secret"
  ref: "src/data/handlers/CLAUDE.md gotchas"

plan_compliance_checklist:
  - "No provider: bedrock anywhere; no scripts.bedrock_client imports (git grep -l -E \"bedrock_client|_bedrock_call|_invoke_bedrock\" -- scripts/ src/ returns nothing)"
  - "New schedule.yaml entries are not added while scheduled agents are disabled; provider migration is owned by PLAN-resolve-scheduled-agent-provider"
  - "Executor call sites go through llm_call() -- no direct provider-SDK imports (CD.28 discipline point)"
  - "Stated provider defaults in this contract match scripts/llm/model_registry.py and scheduled_agent_handler.py (provider_defaults section)"
  - "Lambda-packaged changes follow CD.16/Decision 79 per-Lambda build + deploy + smoke-test gating (dispatcher smoke deferred until T4.3)"

model_routing:  # machine-consumed by scripts/llm/model_registry.py; verbatim from the retired
                # standalone routing config minus the CD.28-retired bedrock provider block
  providers:
    gemini:
      cli_command: "gemini"
      headless_flags: ["-p", "--output-format", "json"]
      default_model: null  # null = Auto mode (recommended -- CLI picks pro/flash based on task)
      models:
        pro: "gemini-3-pro-preview"
        flash: "gemini-3-flash-preview"
        auto: null  # CLI auto-selects
  executor:
    default_provider: "gemini"
    roles:
      planning:
        effort_bands:
          XS: { model_tier: "flash" }
          S: { model_tier: "flash" }
          M: { model_tier: "auto" }
          L: { model_tier: "pro" }
          XL: { model_tier: "pro" }
      implementation:
        effort_bands:
          XS: { model_tier: "flash" }
          S: { model_tier: "flash" }
          M: { model_tier: "auto" }
          L: { model_tier: "pro" }
          XL: { model_tier: "pro" }
        file_pattern_floors:
          - pattern: "scripts/executor/"
            min_tier: "pro"
          - pattern: "scripts/validate.py"
            min_tier: "pro"
          - pattern: "config/prompts/"
            min_tier: "pro"
          - pattern: ".github/prompts/"
            min_tier: "pro"
          - pattern: "config/agent/executor/instructions/"
            min_tier: "pro"
          - pattern: ".github/agents/"
            min_tier: "pro"
      review:
        effort_bands:
          XS: { model_tier: "flash" }
          S: { model_tier: "flash" }
          M: { model_tier: "auto" }
          L: { model_tier: "pro" }
          XL: { model_tier: "pro" }
    escalation:
      flash_to: "auto"
      auto_to: "pro"
      pro_to: null  # top of hierarchy -- human intervention required
  interactive:
    note: >
      Interactive sessions use VS Code Copilot Chat models (Opus, Sonnet).
      Not controlled by this config.
