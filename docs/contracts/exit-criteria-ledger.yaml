contract:
  id: exit-criteria-ledger
  class: A
  contract_version: 1
  status: ratified
  ratified_at: "2026-07-16"
  ratified_via: "dec-136: Decision 136 ratifies CD.39 -- the exit-criteria ledger (per-criterion status) as the realized in_progress-resolution mechanism"
  description: >-
    Per-criterion status ledger on roadmap tier_items (docs/ROADMAP-PLATFORM.yaml
    TierItem.exit_criteria[]), plus the plan->criterion linkage field
    (PlanDocument.closes_criteria). Makes in_progress resolvable: remaining work == the set
    of open criteria (Decision 59). The ledger is git-authoritative (roadmap YAML), not an
    ops_* warehouse table (see governance_notes below).

fields:
  id:
    type: str
    description: >-
      Stable identifier for one TierItem.exit_criteria[] entry. Shape defined by
      scripts/platform_roadmap_models.py::ExitCriterion.
    semantics: >-
      Stable within the tier_item; the full cross-item ref is '<item-id>:<id>', e.g.
      'T2.19:c3'. Auto-assigned 'cN' when normalizing a bare string (lazy migration of
      not_started items).
    populated_by: >-
      scripts/platform_roadmap_models.py at load time -- auto-assigned when normalizing a
      bare-string criterion, or read verbatim when the entry is already structured.
    dq_intent:
      not_null:
        enforced: true
    amendment_log:
      - date: "2026-09-04"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-roadmap-blocking-edge-semantics: corrected the stale model-home pointer from
          scripts/roadmap/platform_roadmap.py (the Decision 124 facade) to
          scripts/platform_roadmap_models.py (ExitCriterion's actual defining module since the
          Decision 124 decomposition split the models out of the facade). No field shape or
          semantics changed.
  text:
    type: str
    description: The criterion prose for one exit_criteria[] entry.
    semantics: Verbatim from the bare string that predated this ledger's structured form.
    populated_by: Tier_item author, at roadmap-authoring time.
    dq_intent:
      not_null:
        enforced: true
  status:
    type: "enum: open | met | rehomed"
    description: Lifecycle status of one exit_criteria[] entry.
    semantics: >-
      open = remaining work. met = closed by an actioned plan or commit (met_by names the
      plan-slug or commit sha). rehomed = scope moved to another tier_item (met_by names the
      receiving item id). Default open.
    populated_by: >-
      /implement's bookkeeping walk flips open->met for each ref in plan.closes_criteria on a
      verified VP pass (Status-Trusted-Never-Inferred / T2.20).
    write_time_validation: >-
      met/rehomed REQUIRE a non-empty met_by. Never inferred from prose, file existence, or
      commit activity. validate.py forbids bare strings on a git-diff-touched item.
    dq_intent:
      not_null:
        enforced: true
      accepted_values:
        enforced: true
        values: [open, met, rehomed]
  met_by:
    type: "str | null"
    description: Resolving pointer for a met or rehomed criterion.
    semantics: >-
      For met: a plan-slug (docs/plans/PLAN-<slug>.yaml exists) or a 40-hex commit sha. For
      rehomed: the receiving tier_item id (must resolve to a known item). Forward-compatible
      as a future ops_execution_plans foreign key (T4.5 / Decision 87).
    populated_by: /implement's bookkeeping walk, at the same time status flips to met or rehomed.
    dq_intent:
      not_null:
        enforced: false
  blocked_by:
    type: "list[dict]"
    description: >-
      Blocking edges on one exit_criteria[] entry: this criterion cannot close until every
      listed ref reaches its named terminus. Shape defined by
      scripts/platform_roadmap_models.py::CriterionBlocker ({ref, until, note}).
    semantics: >-
      ref resolves to a known tier_item id, CD id, or tier shortcut; until is 'complete' (valid
      only on a tier_item/tier-shortcut ref) or 'ratified' (valid only on a CD ref) -- the
      schema validator rejects a ref/until kind mismatch, and an unresolvable ref, at load
      time. note is optional free text. Distinct from depends_on: blocked_by is transcribed
      ONLY from verbatim documentary evidence (never inferred from status, prose tone, or
      commit activity) and carries no runtime consumer beyond the schema validator today --
      rec-3395 (open) is the deferred liveness-detector follow-on that will read it. Default
      [] -- most criteria carry no blocked_by.
    populated_by: >-
      Tier_item author, transcribing a verbatim blocking citation found in roadmap prose at
      roadmap-authoring time.
    dq_intent:
      not_null:
        enforced: false
    governance_notes: >-
      Deliberately EXCLUDED from RoadmapDocument._validate_graph's step-(c) depends_on cycle
      DFS. The edges blocked_by carries close real rings (e.g. a criterion legitimately
      blocked_by the very item that rehomed part of its scope back onto it) -- folding them
      into the load-time cycle rejector would make the roadmap unloadable rather than reporting
      the deadlock it represents. depends_on remains the sole DFS-checked adjacency; blocked_by
      is validated independently (ref resolution + until/kind agreement only, no cycle check).
  plan_closes_criteria:
    type: "list[str]"
    description: >-
      PlanDocument.closes_criteria field (scripts/roadmap/plan_document.py) -- lists which
      item criteria the plan commits to close on a verified VP pass.
    semantics: >-
      Each entry '<item-id>:<criterion-id>' (e.g. 'T-1.23:c2') names a criterion the plan will
      close. /implement flips exactly these open->met on VP pass. validate.py asserts each ref
      resolves to a real item:criterion in the roadmap. Default [] -- a plan that closes no
      item criteria (e.g. a not_started item's first plan) omits the field.
    populated_by: Plan author, at plan-authoring time (the planning skill's follow-on mode).
    write_time_validation: >-
      Each entry is a string "<item-id>:<crit-id>" matching exactly one ExitCriterion in the
      roadmap: item-id must be a real tier_item id in the roadmap; crit-id must be an id within
      that item's exit_criteria (e.g. c1, c2, ...). validate.py enforces referential integrity:
      a closes_criteria ref to a nonexistent item:criterion fails CI (check (iii) in
      validate_platform_roadmap).
    dq_intent:
      not_null:
        enforced: false
  plan_followon_recs:
    type: "list[str]"
    description: >-
      PlanDocument.followon_recs field (scripts/roadmap/plan_document.py) -- names a plan's
      deferred halves by rec id, so committed work that was split off does not vanish into
      chat, PR bodies, or free-text context (PDB-01, B1-R5/B1-R1).
    semantics: >-
      Each entry is a "rec-NNNN" token (scripts/roadmap/plan_document.py::_REC_ID_RE),
      token-shape validated only -- rec existence is not checkable at write time (the rec
      cache is gitignored), and the deferred half's own intent lives on the rec (title,
      context, acceptance), never restated here. Default [] -- a plan that defers nothing
      omits the field. Deliberately NOT shared with bundled_recommendations' validation
      (Fork 2): exactly one merged legacy plan populates that sibling field with prose.
    populated_by: >-
      Two filing moments, both conditional on an actual deferral: /plan Step 8 (planning-time
      split -- the plan author files the other half and records its id here at authoring time)
      and /implement Step 7 closure, before implementation_declared is set true (implement-time
      split -- the implementer files the deferred half and writes the returned id back into
      this field, a permitted bookkeeping edit per docs/contracts/implement-scope-boundary.yaml
      sanction_rows.implementing_plan_bookkeeping.permitted_field_edits).
    governance_notes: >-
      Discovery-marker convention, one authoritative link: this field holds it. The filed
      rec's tag 'follow-on' plus its context prefix "Deferred half of PLAN-<parent-slug>" is
      the discovery marker for greps and portal filters only, never a second link -- readers
      join on this field, not the tag. Decision 181 declare-your-coverage, per surface: token
      shape is enforced by the validator in both tiers (validate_plan_documents); instruction
      presence (the filing steps exist and are correctly ordered/guarded) is pinned by the
      anti-drift tests; the closure write-back is sanctioned in implement-scope-boundary.yaml's
      permitted_field_edits. The residual, unenforced behavioural arm -- whether a session that
      actually deferred a half obeys the instruction and files it -- is an agent obligation with
      no mechanized check in this slice; rec-3524 owns closing that gap (mirroring the
      residual_owner pattern at docs/contracts/implement-scope-boundary.yaml).
    dq_intent:
      not_null:
        enforced: false
  followon_recs_readiness:
    type: "list[dict]"
    description: >-
      Preflight-derived readiness projection over the plan_followon_recs field above
      (PlanDocument.followon_recs) -- the /orient ad-hoc lane's followon_recs key
      (scripts/preflight/recs_cache.py::_derive_followon_recs). See `derivation` for the rule.
    semantics: >-
      Not persisted -- recomputed on every preflight run from the already-pulled
      ops_recommendations rows and a docs/plans/PLAN-*.yaml disk walk (Decision 88 invariant
      ii). See `derivation` for the population rule.
    populated_by: >-
      scripts/session/preflight.py, via scripts/preflight/recs_cache.py::_derive_followon_recs
      and its _landed_followon_rec_ids helper -- zero reader call.
    dq_intent:
      not_null:
        enforced: false
    derivation:
      rule: >-
        One entry per OPEN rec (status: open) named in the followon_recs list of a
        docs/plans/PLAN-*.yaml plan carrying implementation_declared: true.
      grain_note: >-
        Rec-grain (this field) is distinct from the tier-item-grain
        platform_roadmap.in_progress[].needs_followon_plan gauge carried in the same
        preflight report -- the two are separate keys answering different questions.

governance_notes: >-
  Ledger is git-authoritative (roadmap YAML), NOT an ops_* warehouse table. The
  warehouse-SoT invariant (Decision 84) does not apply to this ledger yet; T4.5 is the
  eventual warehouse home and this is the Decision-87 projection-until-T4.x stand-in.
  Converted to a Class A ritual contract by PLAN-cfg-migration-closeout (ratified_via
  dec-136) -- previously free-form, carrying a now-corrected false claim that
  validate_contract_drift "skips" a contract-less file: a baseline-present free-form file is
  bucketed as grandfathered DEBT (docs/contracts/contract-population.yaml's census), never
  silently skipped. `version`, `last_updated`, and `decisions_cited` (verified zero code
  consumers) were dropped rather than relocated -- ContractDocument's extra="forbid" admits
  no legacy top-level key, and none of the three had a live reader to preserve.

audit_invariants:
  - >-
    roadmap_alignment_projection: fields=[id, name, status, matched, intent, open_criteria,
    depends_on, related_candidate_decisions] (executable copy:
    scripts.roadmap.scope_projection.PROJECTED_FIELDS). Intersection key: files_in_scope
    only, matched bidirectionally -- an entry and a Scope path overlap when equal, or when
    either is a directory prefix of the other (segment-boundary, never a bare string prefix),
    so a directory-shaped Scope path (e.g. "scripts/") matches a file-shaped files_in_scope
    entry just as a directory-shaped entry matches a file-shaped Scope path. Criteria
    projected are this ledger's OPEN exit_criteria, each an {id, text} pair (e.g. id "c1") so
    a CITE/CONFLICT row can cite the criterion as <item id>:<criterion id>. Read-only (T2.20)
    -- never flips a status, never writes a file. A CONFLICT is WARN-severity, never BLOCK.
    Display cap: at most 5 rows, ordered CONFLICT > CITE > RELATED with in_progress/not_started
    items first; K, the CONFLICT count and the RELATED count always report FULL counts
    regardless of the display cap. Widen the field roster HERE first. KNOWN LIMITATION: the
    roadmap carries exactly one .claude/skills/ entry (on a deferred_post_mvp item), so a
    skills-only or commands-only Scope list yields K=0.

amendment_log:
  - date: "2026-09-04"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-roadmap-blocking-edge-semantics: added the blocked_by field (per-criterion blocking
      edges, {ref, until, note}), split out of the overloaded gates/depends_on proxy so a
      criterion's blocking relationship is an authored field rather than an inferred side
      effect of depends_on or CandidateDecision.gates. Deliberately excluded from the
      depends_on cycle DFS (see the field's own governance_notes). Also corrected fields.id's
      stale model-home pointer (own amendment_log entry on that field).
  - date: "2026-09-03"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-decision-scout-roadmap-projection (PDB-04, remedy B2-R5): added the
      roadmap_alignment_projection audit_invariants entry declaring the reader contract for
      scripts/roadmap/scope_projection.py's field roster. Audit trail only -- inert for the
      drift gate (no field description/semantics changed).
  - date: "2026-09-03"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-orient-followon-adhoc-lane (PDB-01, remedies B1-R4 + B4-O1): added the
      followon_recs_readiness field documenting the /orient ad-hoc lane's preflight-derived
      readiness projection over plan_followon_recs (PlanDocument.followon_recs).
