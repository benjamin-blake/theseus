---
# Engine-choice contract for the ops-store read layer.
# Authoritative reference for the Decision 84 single-backend topology (supersedes the CD.15
# escape-hatch clause and the T2.19 per-backend split for ops tables).
# Consumed by: agents, planning sessions, T0.7c query Lambda implementors.
# A Class D mechanism contract (migration-step-3-grandfathering, T2.56 migration step 3) as of
# the `contract:` block below.
contract:
  id: read-engine
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The engine-choice/read-surface body itself is unchanged by this envelope.
  subject: read-engine
  evaluator:
    check: validate_read_engine_verbs

