version: 3
last_updated: "2026-06-11"
decisions_cited: [CD.8, CD.33, Decision-56, Decision-69, Decision-70, Decision-79, Decision-81, Decision-84]

single_backend:
  status: ratified (Decision 84 I-1)
  backend: DuckLake-on-Neon (catalog) + S3 Parquet (data), fronted by the closed
    ducklake_reader / ducklake_writer Function-URL boundary (AWS_IAM, SigV4).
  tables_on_boundary: [ops_recommendations, ops_decisions, ops_priority_queue]
  tables_pending: [ops_execution_plans]   # T2.26 disposition
  rollback_flag: RETIRED (OPS_STORAGE_BACKEND deleted; the legacy frozen copy stopped being a
    coherent rollback target the day writes moved to DuckLake)
  escape_hatch: NONE -- the closed ducklake_reader boundary is the only ops read path (CD.15
    scope is empty for ops)

read_surface:
  named_verbs:
    status: primary application read surface (Decision 84 I-3)
    mechanism: >
      The caller names a verb and binds named params; the SQL is registry content inside the
      reader Lambda's bundle (src/common/ducklake_named_reads.py NAMED_READS for the ops tables, and the
      reader-only src/common/ducklake_event_read_verbs.py EVENT_READS for the telemetry event journals, which the
      reader reads through a second isolated warm connection; the verbs listed under a telemetry table are
      grouped by their first table). No caller SQL crosses the boundary on this path. Responses carry registry_version (the registry-format stamp) and the served verb's
      read_version, the per-verb compatibility stamp (opaque, compared by equality only, no ordering).
    verbs:
      ops_recommendations: [open_recs, rec_by_id, recs_by_ids, recs_for_files, recs_related, open_recs_tally,
        preflight_signal_rows, recs_by_title_prefix, ci_rca_open, ci_rca_since,
        forward_fix_recursion, budget_bypass_recent, rec_history, count_by_status]
      ops_decisions: [decision_by_id, decisions_max_updated]
      ops_priority_queue: [priority_queue_current]
      telemetry_sessions: [sessions_window, sessions_window_all_purposes, session_state_and_duration, telemetry_health_count,
        session_tree_rows, telemetry_orphan_counts, telemetry_root_sessions]
      telemetry_observations: [session_process_event_rollup, session_friction_rollup, agent_run_token_rollup,
        model_call_cost_estimate]
      telemetry_agents: [agent_run_state_and_duration]
      telemetry_transcripts: [transcript_content]
    deprecated_verbs:
      rec_by_id: >-
        Deprecated in favour of recs_by_ids (Decision 215 cl.7); removal is rec-4240 once the v4
        registry deploy is verified. recs_by_ids takes one id or a comma-joined list.
      recs_for_files: >-
        Deprecated in favour of recs_related (reached through scripts.recs_related); removal is rec-4240.
      open_recs: >-
        Deprecated in favour of open_recs_tally and preflight_signal_rows; removal is rec-4240.
    recs_cache: >-
      None. The full local recommendations cache is retired (Decision 215); completeness reads are
      the bounded verbs open_recs_tally and preflight_signal_rows, the relevance read is recs_related
      (through scripts.recs_related) and lookups by id are recs_by_ids.
    related_recs_read: >-
      recs_related output semantics (named so it is not confused with Decision 103's relevance lifecycle
      verdict). direct = exact anchor equality only: a directory, empty or NULL anchor is never direct, and
      directory anchors are scope reached only as interim client-side near paths until rec-4279 re-anchors them.
      score = near weight + term score; matched_terms = the admitting and re-ranking terms that hit;
      snippet = the first 200 characters of context; total and direct_total are counted AFTER the exclude_ids
      filter. Bounds: a 100-row page cap, exclude_ids over 200 raises, and a term whose document frequency
      exceeds 5% of open recs only re-ranks and never admits a row alone. A relevance lookup, not a bulk path --
      bulk export is rec-4237.
  structural_reads:
    read_ops_current: full current projection, or a structural {column, value} equality filter
      validated server-side against the field-semantics contract (rec-2170 root fix -- the
      column travels with the value; never a SQL fragment).
    read_ops_history: append-history rows (optional merge-key filter).
  query_ops:
    status: RETAINED for the DQ harness only (Decision 84 I-3 staging)
    rationale: >
      The ~20 ops.yaml check shapes (including history-table checks) are not yet expressible
      as verbs. Retirement is a follow-up gated on a dq_check verb family or a caller
      allowlist. The read-only verb guard (assert_read_only_sql: SELECT/WITH only,
      single-statement) and the S3-read-only execution role bound what caller SQL can do. That role now also reads
      the catalog-scoped telemetry-blobs/<meta_schema>/ prefix by exact key (transcript_content), so caller SQL can read a
      blob object whose full key it knows; owner rec-4292, before production reads.

write_surface:
  file_ops: >
    CREATE with writer-owned id allocation (Decision 84 I-2): the entity counter row is
    updated inside the same catalog transaction as the MERGEs -- the shared-row write-write
    conflict is the serialization point; allocation re-runs inside the OCC retry loop. The
    counter NEVER self-seeds on the hot path (the concurrent-seed race mints duplicate ids;
    observed live 2026-06-11); create_ops_tables owns the serial bootstrap/repair
    (bootstrap_entity_counter). Client idempotency ULID makes response-lost retries return
    the original allocation. Scope: tables declaring entity_id_prefix (ops_recommendations).
  write_ops: caller-keyed upsert -- DECISIONS.md backfill (dec-NNN), test-/probe prefixes.
  update_ops: in-transaction referential existence check (CD.33 cl.8); absent key -> 409.
  destructive_guards: create_ops_tables(force_recreate) requires confirm_force_recreate=<table>;
    maintenance catalog_reinit requires explicit meta_schema + confirm (no production default).

current_state_qualification:
  ops_recommendations: {pattern: write-through current projection, decision: Decision-56 semantics materialised in DuckLake}
  ops_decisions: {pattern: write-through current projection, decision: Decision-56}
  ops_priority_queue:
    pattern: correlated_subquery INSIDE the priority_queue_current verb
    rationale: >
      Decision 70: the queue's current state is ALL entries of the latest curator run. The
      generic latest-per-merge-key projection would silently change these semantics; the verb
      is the only sanctioned queue read.
    decision: Decision-70

single_portal_invariant:
  decision: Decision-69 (unchanged)
  rule: >
    ops_data_portal fetch-before-update reads use the rec_by_id / decision_by_id verbs.
    On reader failure RuntimeError is raised -- no local JSONL fallback, no second read path.

failure_semantics:
  policy: Decision 55 / Decision 84 I-4
  rule: >
    No offline outbox for boundary tables. A failed write raises at the call site; transient
    5xx (Neon cold-resume) is retried only when idempotent (file_ops ULID / update_ops).
    Reader failures surface as degraded signals (recs_read_status), never silent zeros.
    Writer Lambda errors alarm via CloudWatch (ducklake-writer-errors).

reader_client:
  class: DuckLakeReader (src/common/ducklake_reader_client.py)
  status: >
    The sole in-repo reader client. make_reader() returns it; it speaks only to the closed
    ducklake_reader Function URL. The legacy direct-file reader half was deleted with the
    retired query-engine estate.
