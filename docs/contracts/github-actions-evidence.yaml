# GitHub Actions artifact-retention taxonomy consumed by scripts/checks/ci_guards/
# validate_actions_evidence.py. A Class D mechanism contract (migration-step-3-grandfathering,
# T2.56 migration step 3) as of the `contract:` block below.
contract:
  id: github-actions-evidence
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The retention-class taxonomy body itself is unchanged by this envelope.
  subject: github-actions-evidence
  evaluator:
    check: validate_actions_evidence

amendment_log:
  - date: "2026-09-04"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-dispatch-gated-apply-unlatch (Decision 183): one artifact_uploads row added for
      terraform-apply-sandbox.yml's new apply-sandbox step 'Upload fresh plan.bin as a run-scoped
      artifact (SANDBOX_FRESH_PLAN_ARTIFACT)' (artifact sandbox-fresh-plan-${{ github.run_id }},
      retention_class ephemeral_handoff, the step declares retention-days 2 = the class maximum).
      The inventory must equal the set of every actions/upload-artifact step, so a new upload step
      obliges a new row. No retention class, diagnostic class or field semantics changed.

schema_version: 1
required_retention_classes:
- ephemeral_handoff
- ordinary_ci
- governed_deployment
- security_evidence
retention_classes:
  ephemeral_handoff:
    purpose: Short-lived transfer between governed jobs
    minimum_days: 1
    maximum_days: 2
    delayed_rca_days: 1
    expiry_state: unavailable_expired
    recovery: rerun_governed_workflow
  ordinary_ci:
    purpose: Ordinary CI diagnostics consumed by delayed RCA
    minimum_days: 7
    maximum_days: 14
    delayed_rca_days: 14
    expiry_state: unavailable_expired
    recovery: rerun_ci
  governed_deployment:
    purpose: Governed deployment and reconciliation evidence
    minimum_days: 7
    maximum_days: 30
    delayed_rca_days: 30
    expiry_state: unavailable_expired
    recovery: rerun_human_gated_workflow
  security_evidence:
    purpose: Security investigation evidence
    minimum_days: 30
    maximum_days: 90
    delayed_rca_days: 90
    expiry_state: unavailable_expired
    recovery: consult_security_event_source
diagnostic_classes:
  native_step_failure:
    bounded_surface: annotation
    description: GitHub native step failure annotation; bounded to one selected critical step
  ci_rca_log_evidence:
    bounded_surface: typed_artifact
    schema: ci-rca-log-evidence/v2
s1_linkage:
  schema: ci-rca-log-evidence/v2
  producer: scripts/ci_rca/fetch_logs.py
  extractor: scripts/ci_rca/log_evidence.py
  consumer: scripts/ci_rca/evidence/__init__.py
