---
# Class A data contract for telemetry_sessions -- the trace ROOT table of the canonical
# session-rooted trace/observation model (Decision 95 clause 1), re-grounded to the event-journal
# model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL (Decision 199): one row per session LIFECYCLE EVENT (open | resume | compact |
# close | annotate), not one mutated row per session. Session STATE (running, abandoned or a
# terminal outcome) and DURATION are derived at read by a named reader verb over a session's own
# rows -- never stored, never mutated in place. GREENFIELD: no telemetry table is provisioned in
# production yet (slice 2c); the write-time rules project from this contract (Decision 210).
contract:
  id: telemetry_sessions
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_sessions, the trace ROOT: an append-only EVENT JOURNAL, one row per session lifecycle event (open | resume | compact | close | annotate), keyed by the shared telemetry-event-envelope.yaml fields plus session_id. Root-unification anchor (Decision 95): every
    telemetry row traces back to a session via session_id; a spawned sub-agent gets its OWN session linked to the spawner via parent_session_id. Session state, duration and friction are DERIVED AT READ from a session's own event rows (Decision 199) -- never stored as a mutable column. Partitioned by
    the calendar-day triple year(session_started_at), month(session_started_at), day(session_started_at) (Decision 96 cl.1, re-grounded; rec-4065: DuckLake's day() alone is day-of-month).
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: telemetry_sessions
    generator: scripts/schema_to_field_semantics.py
    note: >-
      The event projection (scripts/field_semantics_event_projection.py) emits this table's entry from slice 2a-2 plan 1's registration onward and runs in-process before then, so no later flip is owed.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_sessions:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null:
        enforced: true
      accepted_values:
        values: [open, resume, compact, close, annotate]
        enforced: false
        note: >-
          The session lifecycle vocabulary. "running" is not a stored value anywhere -- it is derived (see `state` and the SESSION STATE paragraph of governance_notes): a session is running unless its latest lifecycle row is a close, and a resume after a close makes it running again.
    governance_notes_local: >-
      Tightened NOT NULL: every telemetry_sessions row states its lifecycle position. compact records a context-compaction event mid-session (a new capability this event-journal shape makes representable, where mint-once-and-mutate could not). The producer's open row is its GENERATION COMMIT MARKER
      (Decision 207, telemetry-event-envelope.yaml R3/R5).
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (rec-4061 R3): named the open row as the producer's generation commit marker, pointing at the envelope's GENERATIONS AND READ-SIDE DEDUPE rule.
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      For the open event this EQUALS session_started_at; for resume/compact/close/annotate it is that event's own source-derived time. A sub-agent session's open row carries the ROOT start (session_started_at is the tree's pin), so a child's own start is its telemetry_agents open row. A close row's
      event_timestamp is that of the last root-stream record carrying a uuid at that finalization. duration_seconds (derived) is the latest close's event_timestamp minus session_started_at, wall-clock.
    amendment_log:
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (rec-4146, C9): a sub-agent session's open row carries the ROOT start (session_started_at is the tree's pin); a close row's event_timestamp is the last root-stream uuid record's; duration reads the latest close, wall-clock."}
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The partition basis (governance.partition_by below) and the 48-bit time prefix of session_id's own ULID. Identical across every row of this session (open through its final annotate), by construction.
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
    governance_notes_local: >-
      Orders a session's lifecycle events when two share an event_timestamp. A close row's source_ordinal is that of the last root-stream record carrying a uuid at that finalization (the record its external_ref names).
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The hash input for this row's event_id; grammar '<source_record_id>#0/<event_kind>'. The open marker is '<session entity_ref>#0/open'. ONE close row is written per finalization: its external_ref is the role_ref '<uuid>#0/close' of the last root-stream record carrying a uuid at that finalize.
    amendment_log:
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (rec-4146, C9): declared the open marker '<session entity_ref>#0/open' and the per-finalization close-row identity '<uuid>#0/close' (last root-stream record carrying a uuid)."}
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The caller-supplied session_ref this row's own session_id derives from (domain tag 'telemetry_sessions:session_id'); a sub-agent session's entity_ref is '<sessionId>:<agentId>' (the parent CLI session id plus a deterministic per-agent id).
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: e.g. claude_code, litellm, ci_annotate -- whichever surface emitted this lifecycle event.
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: not_null_tighten
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): producer is now NOT NULL enforced -- it is part of the telemetry grain key.
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local:
      not_null:
        enforced: true
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local:
      not_null:
        enforced: true
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local:
      not_null:
        enforced: true
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      Tightened NOT NULL over the project-id.yaml loosest baseline (Invariant 5): every telemetry row inherits a project partition, resolved at the write boundary from the caller-supplied project_ref, auto-registering an 'unregistered' row on first sight (no default, Decision 198).
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The trace root's own entity key: every other telemetry row's session_id FK equals this value (write-boundary derivation, telemetry-event-envelope.yaml identity spec), no propagation needed. Every row of this session -- open through its final annotate -- shares this same id.
    joins:
      - session_id_join_telemetry_sessions_to_observations
  parent_session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    governance_notes_local: >-
      Nullable self-reference: the session_id of the run that SPAWNED this session (sub-agent -> spawner), derived from parent_session_ref, or NULL for a top-level run. The cross-agent half of root-unification (Decision 95); parent_observation_id links in-session structure. Stays nullable (a
      top-level session has no parent).
    joins:
      - parent_session_id_join_sessions_self_spawn
  workflow:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The workflow that opened the session (Decision 90 four-tier vocabulary): orient | plan | implement | develop-executor, plus operational runners (executor-supervision, scheduled-agent, ...).
    semantics: >-
      Required dimension; the primary grouping key for per-workflow analytics (duration, rework, outcome rates). REQUIRED in the draft (TelemetrySessions.REQUIRED_FIELDS). accepted_values are NOT closed in the contract -- the workflow set evolves with Decision 90. The set is open; a closed set would
      be declared here and enforced at write (Decision 210 cl.3).
    populated_by: the write boundary at the open event (rec-4024).
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [open]}}
    amendment_log:
      - {date: "2026-08-26", semantic_break: false, change_class: prose_improvement, summary: "Platform cleanse: wording referencing removed product surfaces or the retired legacy query engine trimmed; field meaning unchanged."}
      - {date: "2026-10-04", semantic_break: false, change_class: type_widen, summary: "PLAN-telemetry-write-conformance (rec-4064 R1): nullable false -> true, matching dq_intent.required_when (open rows only); the projection already treated it as nullable."}
      - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (fork 2 (a)): dropped the stale 'Phase 4 telemetry DQ config' premise; the set is open and a closed set would be declared here and enforced at write. Meaning unchanged."}
  state:
    type: str
    iceberg_type: string
    nullable: true
    description: "Current disposition of the session: running | abandoned | success | failed | cancelled. DERIVED at read by the same reader verb as duration_seconds; never stored, no physical column (data-modeling-standard.yaml derived-state rule)."
    semantics: >-
      ROOT session: the state of its latest lifecycle row, ordered by event_timestamp, then source_ordinal, then close ranked last on a tie, then event_id, over every producer's rows after each producer's own R5 dedupe (the envelope's generation rule); annotate rows are excluded. That state is
      running unless the latest row is a close, in which case it is that close's outcome (success | failed | cancelled). abandoned: not terminal, and as_of minus the session's last event_timestamp across its rows in all four telemetry tables exceeds a governed idle threshold. The idle threshold
      lives in the reader's named-read registry as versioned data, seeded at 24 h and owned by 2b (rec-4024); a later resume makes the session running again and nothing is stored. SUB-AGENT session (parent_session_id not NULL): state and duration come from its telemetry_agents agent-run open/close
      pair. An open with no close is running, or abandoned past the same idle threshold; a close maps its agent-run outcome into state as success -> success and failed, timeout or throttled -> failed (the detail stays on telemetry_agents.outcome).
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition; the idle threshold is reader registry data, never a column.
    dq_intent: {not_null: {enforced: false}, accepted_values: {values: [running, abandoned, success, failed, cancelled], enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_state_and_duration, formula: "ROOT (parent_session_id IS NULL): the latest lifecycle row (annotate excluded) ordered by event_timestamp, source_ordinal, close last on a tie, event_id, after R5 dedupe; running unless it is a close, then its outcome; abandoned when not terminal and as_of - max(event_timestamp over this session's rows in the four telemetry tables) exceeds the governed idle threshold. SUB-AGENT: its telemetry_agents agent-run open/close pair; open with no close is running (abandoned past the idle threshold); at close success -> success, failed|timeout|throttled -> failed", inputs: [session_id, parent_session_id, event_kind, event_timestamp, source_ordinal, event_id, outcome, telemetry_agents.session_id, telemetry_agents.event_kind, telemetry_agents.event_timestamp, telemetry_agents.outcome, telemetry_observations.session_id, telemetry_observations.event_timestamp, telemetry_transcripts.session_id, telemetry_transcripts.event_timestamp], realized: false}
    amendment_log:
      - {date: "2026-10-05", semantic_break: true, change_class: field_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C9; W3 rulings reader-k1 (a), reader-k3 (a)): new read-derived state field (no column) with its ordering, close-last tie, governed idle threshold and sub-agent branch."}
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Terminal disposition of the session, STORED on a close event's own row: success | failed | cancelled. There is no "running" value stored anywhere -- running is derived (see `state`).
    semantics: >-
      Observed at each finalization and recorded on that finalization's close row (STORED per the data-modeling-standard.yaml stored-vs-derived rule), derived from the transcript, never from SessionEnd hook input. SESSION STATE (a session's current disposition) is DERIVED at read by a named reader
      verb (see `state`): a resume after a close makes the session running again, so a close row's outcome is the terminal state only while that close is the session's latest lifecycle row. This replaces the retired mutate-outcome-in-place model (contract_version 1), which had no room for the
      resume/compact events this shape now represents.
    populated_by: the write boundary at a close event (rec-4024); the producer derives it from the transcript at each finalization (rec-4026).
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [close]}, accepted_values: {values: [success, failed, cancelled], enforced: false}}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): outcome is now STORED once on the close event's own row (event-journal shape) instead of a mutable column overwritten in-place at close; "running" dropped from accepted_values -- it is no longer a stored value, session state is derived
          at read from row presence instead.
        migration_story: No live populator existed under either scheme; the Phase 4 rebuild (T2.36) builds directly to this shape.
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C9): one close row per finalization, outcome derived from the transcript (never SessionEnd hook input); a close row's outcome is the terminal state only while it is the latest lifecycle row; the legacy session_postflight populator is dropped."}
  process_event_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of process_event observations in the session. DERIVED at read (roll-up naming: *_total) from telemetry_observations rows with observation_type=process_event sharing this session_id -- replaces the contract_version 1 stored tally process_event_count.
    semantics: A read-time aggregate; no physical column (data-modeling-standard.yaml derived-state rule).
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_process_event_rollup, formula: "count of telemetry_observations rows WHERE session_id = this.session_id AND observation_type = 'process_event'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type], realized: false}
  rework_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of rework runs in the session: at least repeat_threshold consecutive error closes of the same tool inside one turn. DERIVED at read from telemetry_observations facts classified by the reader's governed rules file -- replaces the stored `tier` column (contract_version 1), which is
      retired.
    semantics: >-
      A key self-improvement-loop friction signal; no physical column. The facts are process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked, read after R5 dedupe. rework_total counts runs: at least repeat_threshold consecutive error closes of the
      same tool inside one turn; a same-tool blocked close breaks a run. The rules (signatures, dispositions, labels, classes, repeat_threshold) live in a governed, versioned rules file bundled into the reader's named-read registry as data, owned by 2b (rec-4024); classifier_version is stamped on
      every response and is never a column.
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of runs of at least repeat_threshold consecutive tool_call closes with outcome error for the same tool (name) inside one turn (parent_observation_id), ordered by event_timestamp then source_ordinal, a same-tool blocked close breaking a run; repeat_threshold comes from the reader's rules file", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
    amendment_log:
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k1 (a), friction-k2 (a)): the facts, the run rule and the input list; the rules live in the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
  exception_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of labelled exception-class facts in the session. DERIVED at read, same mechanism as rework_total -- replaces the stored `tier` column.
    semantics: >-
      A key self-improvement-loop friction signal; no physical column. exception_total counts the facts (process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class. Each fact gets one label (an exact
      signature beats the generic rule), and a blocked tool_call whose own hook block is already a fact is not counted twice. classifier_version is stamped on every response and is never a column.
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of facts (process_event points at severity error, warning or critical, and tool_call closes with outcome error or blocked) that the reader's rules file labels exception-class, one label per fact (an exact signature beats the generic rule), a blocked tool_call whose own hook block is already a fact not counted twice", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
    amendment_log:
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10, friction-k2 (a)): one label per fact, no double count of a blocked tool_call already a fact; read from the reader's governed rules file, not the rec-4032 labels table (later materialised form)."}
  duration_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Wall-clock session duration in seconds. DERIVED at read; NULL until a close row exists (a root session's latest close, a sub-agent session's agent-run close).
    semantics: >-
      ROOT session: the latest close's event_timestamp minus session_started_at, wall-clock, including any idle gap between a close and a later resume. SUB-AGENT session: its agent-run close minus open (telemetry_agents.duration_seconds). Computed by the same reader verb that derives `state`.
    populated_by: a named reader verb (rec-4024).
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_state_and_duration, formula: "ROOT: (latest close.event_timestamp - session_started_at).total_seconds(), the latest close being this session's last event_kind=close row by event_timestamp, source_ordinal, event_id; SUB-AGENT: telemetry_agents.duration_seconds of its agent-run pair (close minus open)", inputs: [event_timestamp, session_started_at, event_kind, parent_session_id, source_ordinal, event_id, telemetry_agents.session_id, telemetry_agents.event_kind, telemetry_agents.event_timestamp], realized: false}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded from a stored open/close-pair column to a read-derived field over the event-journal rows; field meaning (wall-clock session duration) unchanged."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C9): duration is the latest close minus session_started_at, wall-clock across any resume gap, NULL until a close exists; a sub-agent session takes its agent-run pair; the formula names every input."}
  execution_attempt:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Which attempt this session is for the same unit of work (1-based; >1 on resume/retry).
    semantics: >-
      Required. Distinguishes a fresh run from a resumed/retried one. A resumed session reuses session_id (its identity is derived from the same session_ref) and appends a resume event; execution_attempt disambiguates the appended rows.
    populated_by: the write boundary at the open event (rec-4024).
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [open]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by/semantics wording to the write-boundary/event-journal model and added dq_intent.required_when; field meaning unchanged."}
      - {date: "2026-10-04", semantic_break: false, change_class: type_widen, summary: "PLAN-telemetry-write-conformance (rec-4064 R1): nullable false -> true, matching dq_intent.required_when (open rows only); the projection already treated it as nullable."}
  branch:
    type: str
    iceberg_type: string
    nullable: true
    description: The git branch the session ran on (e.g. claude/focused-bell-5onhvu).
    semantics: Optional provenance; the harness session branch. Null when not applicable.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
  rec_ids:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: Recommendation ids this session addressed (e.g. ["rec-2335"]).
    semantics: >-
      Optional cross-reference into ops_recommendations.id, joined tenant-locally. array<string> declared explicitly (TELEMETRY_TABLE_DTYPES) to avoid awswrangler null-inference failures on all-null batches. Stored on open (the recs a session was scoped to) and/or annotate rows (recs resolved or
      filed after close).
    populated_by: the write boundary at the open or annotate event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name which event_kind rows carry this field (open/annotate) and to join tenant-locally; field meaning unchanged."}
  plan_slug:
    type: str
    iceberg_type: string
    nullable: true
    description: The plan slug an implement/plan session is bound to (e.g. ratify-class-a-telemetry-contracts).
    semantics: Optional; links a session to docs/plans/PLAN-{slug}.yaml. Null for non-plan workflows.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
  failure_reason:
    type: str
    iceberg_type: string
    nullable: true
    description: Free-text reason when outcome=failed. NULL on success.
    semantics: Optional failure diagnostic; consumed by ci-rca / friction analysis. Stored on the close event's row alongside outcome.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  failure_phase:
    type: str
    iceberg_type: string
    nullable: true
    description: The phase/observation name active when the session failed. NULL on success.
    semantics: >-
      Optional; correlates to a telemetry_observations.name (observation_type=phase). rec-275 (open) asks that step-level failure telemetry also populate outcome/failure_phase on the failure path -- a CODE change, NOT this contract; recorded as a KNOWN GAP.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  files_changed:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Number of files changed in the session's diff.
    semantics: Optional code-impact metric. bigint (integer-promotion safety). Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
