---
# Class A data contract for telemetry_sessions -- the trace ROOT table of the canonical
# session-rooted trace/observation model (Decision 95 clause 1), re-grounded to the event-journal
# model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL (Decision 199): one row per session LIFECYCLE EVENT (open | resume | compact |
# close | annotate), not one mutated row per session. Session STATE (running vs terminal) and
# DURATION are derived at read by a named reader verb over a session's own rows -- never stored,
# never mutated in place. GREENFIELD: no telemetry table is provisioned; this contract remains
# TARGET-STATE (dq_INTENT only) pending the Phase 4 rebuild (T2.36).
contract:
  id: telemetry_sessions
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_sessions, the trace ROOT: an append-only EVENT JOURNAL,
    one row per session lifecycle event (open | resume | compact | close | annotate), keyed by the
    shared telemetry-event-envelope.yaml fields plus session_id. Root-unification anchor (Decision
    95): every telemetry row traces back to a session via session_id; a spawned sub-agent gets its
    OWN session linked to the spawner via parent_session_id. Session state, duration and friction
    are DERIVED AT READ from a session's own event rows (Decision 199) -- never stored as a mutable
    column. Partitioned by the calendar-day triple year(session_started_at), month(session_started_at),
    day(session_started_at) (Decision 96 cl.1, re-grounded; rec-4065: DuckLake's day() alone is day-of-month).
  projects_to:
    note: >-
      No generated artifact yet. Unlike the ops Class A contracts (which project_to
      config/lambda/ducklake/field_semantics.yaml), telemetry is not yet on DuckLake; there is NO
      telemetry field_semantics.yaml. This contract IS the authoritative telemetry field-semantic source
      until the Phase 4 rebuild (post-T2.26) lands a generator, applying the DuckLake schema-as-code
      mechanism T2.33 established for the ops tables.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_sessions:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null:
        enforced: true
      accepted_values:
        values: [open, resume, compact, close, annotate]
        enforced: false
        note: >-
          The session lifecycle vocabulary. "running" is not a stored value anywhere -- it is the
          derived state when a session has an open/resume row and no close row (see governance_notes).
    governance_notes_local: >-
      Tightened NOT NULL: every telemetry_sessions row states its lifecycle position. compact
      records a context-compaction event mid-session (a new capability this event-journal shape
      makes representable, where mint-once-and-mutate could not).
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      For the open event this EQUALS session_started_at; for resume/compact/close/annotate it is
      that event's own source-derived time. duration_seconds (derived) is close.event_timestamp
      minus session_started_at.
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The partition basis (governance.partition_by below) and the 48-bit time prefix of
      session_id's own ULID. Identical across every row of this session (open through its final
      annotate), by construction.
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
    governance_notes_local: Orders a session's lifecycle events when two share an event_timestamp.
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: The hash input for this row's event_id; grammar '<source_record_id>#0/<event_kind>'.
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The caller-supplied session_ref this row's own session_id derives from (domain tag
      'telemetry_sessions:session_id'); a sub-agent session's entity_ref is '<sessionId>:<agentId>'
      (the parent CLI session id plus a deterministic per-agent id).
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    governance_notes_local: e.g. claude_code, litellm, ci_annotate -- whichever surface emitted this lifecycle event.
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local:
      not_null:
        enforced: true
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local:
      not_null:
        enforced: true
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local:
      not_null:
        enforced: true
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      Tightened NOT NULL over the project-id.yaml loosest baseline (Invariant 5): every telemetry
      row inherits a project partition, resolved at the write boundary from the caller-supplied
      project_ref, auto-registering an 'unregistered' row on first sight (no default, Decision 198).
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local:
      not_null:
        enforced: true
    governance_notes_local: >-
      The trace root's own entity key: every other telemetry row's session_id FK equals this value
      (write-boundary derivation, telemetry-event-envelope.yaml identity spec), no propagation
      needed. Every row of this session -- open through its final annotate -- shares this same id.
    joins:
      - session_id_join_telemetry_sessions_to_observations
  parent_session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    governance_notes_local: >-
      Nullable self-reference: the session_id of the run that SPAWNED this session (sub-agent ->
      spawner), derived from parent_session_ref, or NULL for a top-level run. The cross-agent half
      of root-unification (Decision 95); parent_observation_id links in-session structure. Stays
      nullable (a top-level session has no parent).
    joins:
      - parent_session_id_join_sessions_self_spawn
  workflow:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      The workflow that opened the session (Decision 90 four-tier vocabulary): orient | plan | implement |
      develop-executor, plus operational runners (executor-supervision, scheduled-agent, ...).
    semantics: >-
      Required dimension; the primary grouping key for per-workflow analytics (duration, rework, outcome
      rates). REQUIRED in the draft (TelemetrySessions.REQUIRED_FIELDS). accepted_values are NOT closed in
      the contract -- the workflow set evolves with Decision 90; the closed enum (if any) is ratified into
      the Phase 4 telemetry DQ config, not here.
    populated_by: the write boundary at the open event (rec-4024).
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [open]}}
    amendment_log:
      - date: "2026-08-26"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          Platform cleanse: wording referencing removed product surfaces or the retired
          legacy query engine trimmed; field meaning unchanged.
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Terminal disposition of the session, STORED on the close event's own row: success | failed |
      cancelled. There is no "running" value stored anywhere -- a session with no close row IS the
      running state (derived, see governance_notes).
    semantics: >-
      Observed once, at the close event, and recorded on that row (STORED per the
      data-modeling-standard.yaml stored-vs-derived rule); SESSION STATE (a session's current
      running/terminal disposition) is DERIVED at read by a named reader verb: absent a close row,
      the session is running; present, its outcome IS the session's terminal state. This replaces
      the retired mutate-outcome-in-place model (contract_version 1), which had no room for the
      resume/compact events this shape now represents.
    populated_by: the write boundary at the close event (rec-4024); session_postflight.
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [close]}, accepted_values: {values: [success, failed, cancelled], enforced: false}}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): outcome is now STORED once on the
          close event's own row (event-journal shape) instead of a mutable column overwritten
          in-place at close; "running" dropped from accepted_values -- it is no longer a stored
          value, session state is derived at read from row presence instead.
        migration_story: No live populator existed under either scheme; the Phase 4 rebuild (T2.36) builds directly to this shape.
  process_event_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of process_event observations in the session. DERIVED at read (roll-up naming: *_total)
      from telemetry_observations rows with observation_type=process_event sharing this session_id
      -- replaces the contract_version 1 stored tally process_event_count.
    semantics: A read-time aggregate; no physical column (data-modeling-standard.yaml derived-state rule).
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_process_event_rollup, formula: "count of telemetry_observations rows WHERE session_id = this.session_id AND observation_type = 'process_event'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type], realized: false}
  rework_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of rework-tier process events in the session. DERIVED at read from
      telemetry_observations process_event rows whose name matches a rework signature (the
      friction-classification labels table, rec-4032) -- replaces the stored `tier` column
      (contract_version 1), which is retired.
    semantics: A key self-improvement-loop friction signal; no physical column.
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of telemetry_observations process_event rows whose name matches a rework signature (rec-4032 labels table)", inputs: [telemetry_observations.name, telemetry_observations.observation_type], realized: false}
  exception_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of exception-tier process events in the session. DERIVED at read, same mechanism as
      rework_total -- replaces the stored `tier` column.
    semantics: A key self-improvement-loop friction signal; no physical column.
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of telemetry_observations process_event rows whose name matches an exception signature (rec-4032 labels table)", inputs: [telemetry_observations.name, telemetry_observations.observation_type], realized: false}
  duration_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Wall-clock session duration in seconds. DERIVED at read; NULL while the session is running (no close row yet).
    semantics: close.event_timestamp minus session_started_at, computed by the same reader verb that derives session state.
    populated_by: a named reader verb (rec-4024).
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_state_and_duration, formula: "(close.event_timestamp - session_started_at).total_seconds(), where close is this session's event_kind=close row, if any", inputs: [event_timestamp, session_started_at, event_kind], realized: false}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded from a stored open/close-pair column to a read-derived field over the event-journal rows; field meaning (wall-clock session duration) unchanged."}
  execution_attempt:
    type: int
    iceberg_type: bigint
    nullable: false
    description: Which attempt this session is for the same unit of work (1-based; >1 on resume/retry).
    semantics: >-
      Required. Distinguishes a fresh run from a resumed/retried one. A resumed session reuses
      session_id (its identity is derived from the same session_ref) and appends a resume event;
      execution_attempt disambiguates the appended rows.
    populated_by: the write boundary at the open event (rec-4024).
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [open]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by/semantics wording to the write-boundary/event-journal model and added dq_intent.required_when; field meaning unchanged."}
  branch:
    type: str
    iceberg_type: string
    nullable: true
    description: The git branch the session ran on (e.g. claude/focused-bell-5onhvu).
    semantics: Optional provenance; the harness session branch. Null when not applicable.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
  rec_ids:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: Recommendation ids this session addressed (e.g. ["rec-2335"]).
    semantics: >-
      Optional cross-reference into ops_recommendations.id, joined tenant-locally. array<string>
      declared explicitly (TELEMETRY_TABLE_DTYPES) to avoid awswrangler null-inference failures on
      all-null batches. Stored on open (the recs a session was scoped to) and/or annotate rows (recs
      resolved or filed after close).
    populated_by: the write boundary at the open or annotate event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name which event_kind rows carry this field (open/annotate) and to join tenant-locally; field meaning unchanged."}
  plan_slug:
    type: str
    iceberg_type: string
    nullable: true
    description: The plan slug an implement/plan session is bound to (e.g. ratify-class-a-telemetry-contracts).
    semantics: Optional; links a session to docs/plans/PLAN-{slug}.yaml. Null for non-plan workflows.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
  failure_reason:
    type: str
    iceberg_type: string
    nullable: true
    description: Free-text reason when outcome=failed. NULL on success.
    semantics: Optional failure diagnostic; consumed by ci-rca / friction analysis. Stored on the close event's row alongside outcome.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  failure_phase:
    type: str
    iceberg_type: string
    nullable: true
    description: The phase/observation name active when the session failed. NULL on success.
    semantics: >-
      Optional; correlates to a telemetry_observations.name (observation_type=phase). rec-275 (open) asks
      that step-level failure telemetry also populate outcome/failure_phase on the failure path -- a CODE
      change, NOT this contract; recorded as a KNOWN GAP.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  files_changed:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Number of files changed in the session's diff.
    semantics: Optional code-impact metric. bigint (integer-promotion safety). Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  lines_added:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Lines added across the session's diff.
    semantics: Optional code-impact metric. Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  lines_removed:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Lines removed across the session's diff.
    semantics: Optional code-impact metric. Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  steps_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Total planned steps for the session (denormalised from the plan), STORED because it is known at open.
    semantics: Optional progress metric, observed once at the open event -- not a roll-up, hence no *_total-derivation naming conflict.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to clarify this is stored, not a *_total roll-up; field meaning unchanged."}
  steps_completed_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Steps actually completed in the session. DERIVED at read (roll-up naming: *_total) from
      telemetry_observations step-kind close rows sharing this session_id -- replaces the
      contract_version 1 stored tally steps_completed.
    semantics: steps_completed_total/steps_total is the session completion ratio; no physical column.
    populated_by: a named reader verb (rec-4024), bounded to this session's calendar-day partition.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: reader_verb:session_process_event_rollup, formula: "count of telemetry_observations rows WHERE session_id = this.session_id AND observation_type = 'step' AND event_kind = 'close'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind], realized: false}
  scope_drift_files:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: Files touched outside the plan's declared scope (scope-drift detector output).
    semantics: >-
      Optional governance signal (plan Scope vs actual diff). array<string> declared explicitly
      (null-inference safety). Empty/null when no drift. Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  pr_url:
    type: str
    iceberg_type: string
    nullable: true
    description: URL of the PR the session opened/merged. A post-close fact, owned by the annotate event_kind.
    semantics: Optional provenance link to GitHub, typically recorded after the session itself has closed.
    populated_by: the write boundary at an annotate event.
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [annotate]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded to the annotate event_kind (a post-close fact) and added dq_intent.required_when; field meaning unchanged."}
  ci_outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: CI result for the session's PR (e.g. success | failure | pending). A post-close fact, owned by the annotate event_kind.
    semantics: Optional; the CI verdict correlated to the session, typically known only after close. Open set; enforcement deferred.
    populated_by: the write boundary at an annotate event.
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [annotate]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded to the annotate event_kind (a post-close fact) and added dq_intent.required_when; field meaning unchanged."}
  model_primary:
    type: str
    iceberg_type: string
    nullable: true
    description: The primary model that drove the session (e.g. claude-opus-4-8).
    semantics: >-
      Optional; the headline model for the run. Per-call model attribution lives on
      telemetry_observations (observation_type=model_call) and telemetry_agents.model.
    populated_by: the write boundary at the open event.
    dq_intent: {not_null: {enforced: false}}
  coverage_before:
    type: float
    iceberg_type: double
    nullable: true
    description: Test coverage fraction before the session's changes.
    semantics: Optional quality metric; pairs with coverage_after for a coverage delta. double-typed. Stored on the close event's row.
    populated_by: the write boundary at the close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  coverage_after:
    type: float
    iceberg_type: double
    nullable: true
    description: Test coverage fraction after the session's changes. A post-close fact, owned by the annotate event_kind.
    semantics: Optional quality metric; coverage_after - coverage_before is the session coverage delta, typically finalised after close.
    populated_by: the write boundary at an annotate event.
    dq_intent: {not_null: {enforced: false}, required_when: {event_kind: [annotate]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded to the annotate event_kind (a post-close fact) and added dq_intent.required_when; field meaning unchanged."}
governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    NOT PROVISIONED: no telemetry writer exists today. TARGET (Phase 4, post-T2.26): the DuckLake
    telemetry writer boundary (rec-4024's append_events verb). Append-only event journal; no SCD2
    merge, no in-place mutation.
governance_notes: >-
  EVENT JOURNAL (Decision 199, amending Decision 95 clause 1, Decision 96 clauses 1 and 3, and
  Decision 97 clauses 1-4): telemetry_sessions is the trace ROOT, now shaped as an append-only
  journal of lifecycle events rather than one row mutated in place. SESSION STATE (running vs a
  terminal outcome) and DURATION are DERIVED AT READ by a named reader verb reading this session's
  own rows, bounded to its single calendar-day partition (answers Decision 81 clause 8 --
  never an unprunable full scan). Identity (session_id, parent_session_id) is derived at the write
  boundary per telemetry-event-envelope.yaml's normative hash spec, not minted-once-and-propagated.
  ROLL-UP RECONCILIATION: process_event_total / rework_total / exception_total / steps_completed_total
  are DERIVED aggregates of telemetry_observations rows sharing this session_id (rework_total /
  exception_total from process_event name-signature matching against rec-4032's labels table, not a
  stored tier column). NULLABILITY AXES: `nullable` is the TARGET-SCHEMA column constraint (Phase 4
  DDL); `dq_intent.not_null.enforced` is the CURRENT DQ posture (false everywhere now, per-event-kind
  requirements expressed via dq_intent.required_when instead of a table-wide not-null). A
  `nullable: false` + `enforced: false` field is "required in the target schema, not yet
