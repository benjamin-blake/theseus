governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    Not provisioned in production (slice 2c); the writer is rec-4024's append verb on the DuckLake telemetry writer boundary. Append-only event journal; no SCD2 merge, no in-place mutation.
governance_notes: >-
  EVENT JOURNAL (Decision 199, amending Decision 95 clause 1, Decision 96 clauses 1 and 3, and Decision 97 clauses 1-4): telemetry_sessions is the trace ROOT, now shaped as an append-only journal of lifecycle events rather than one row mutated in place. SESSION STATE: running, abandoned or a
  terminal outcome is DERIVED AT READ into `state` (never stored) by the named reader verb that also derives DURATION, reading this session's own rows bounded to its single calendar-day partition (answers Decision 81 clause 8 -- never an unprunable full scan). The state is the session's latest
  lifecycle row (annotate excluded; close ranks last on a tie), so a resume after a close makes the session running again; one close row is written per finalization, its outcome derived from the transcript. Identity (session_id, parent_session_id) is derived at the write boundary per
  telemetry-event-envelope.yaml's normative hash spec, not minted-once-and-propagated. ROLL-UP RECONCILIATION: process_event_total / rework_total / exception_total / steps_completed_total are DERIVED aggregates of telemetry_observations rows sharing this session_id (rework_total / exception_total
  from the facts classified by the reader's governed rules file, not a stored tier column). classifier_version is a reader response stamp, never a column. WINDOW VERBS (Decision 199 cl.1, CD.52): a verb over many sessions is a bounded window of per-session derivations, each reading only its own
  session's single calendar-day partition. Each window verb declares its own maximum window in the reader's named-read registry and stamps its read_version; there is no contract-wide day count, and each window is an egress line under Decision 88. NULLABILITY AXES: a column is NOT NULL at write when
  `nullable` is false or `dq_intent.not_null.enforced` is true, unless the field carries `required_when`, which then governs (scripts/field_semantics_event_projection.py _is_not_null); required_when, accepted_values and pattern are write-enforced whatever their enforced value (Decision 210, #1405),
  and the flag otherwise keeps its DQ-runner meaning, whose platform-wide re-read is rec-4158 plan C. KNOWN GAPS (open recs, future CODE work, not this contract): rec-275 (failure-path step telemetry), rec-2173 (preflight telemetry health re-enable), rec-4024 (the writer/reader verbs and dimension
  contracts this contract's derivations name), rec-4030 (the live legacy UUID4 session_id minter's migration to this contract's derivation model), rec-4032 (the later materialised friction-labels form of the reader's rules file that rework_total/exception_total read).
amendment_log:
  - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C9, C10, C13, rec-4146): new read-derived state, close-row identity, friction roll-up facts and rules-file home, WINDOW VERBS note, and the stale enforcement/provisioning premise reworded (projects_to keys, write_path, header, NULLABILITY AXES). Per-field changes are on their own fields' logs."}
  - {date: "2026-09-26", semantic_break: false, change_class: prose_improvement, summary: "rec-4073: governance.partition_by respelled role-prefixed ('history=year(...), month(...), day(...)'), matching the shared ops partition grammar; resolved spec unchanged. No runtime migration: no live telemetry writer."}
  - {date: "2026-09-25", semantic_break: false, change_class: prose_improvement, summary: "rec-4065: partition respelled to the calendar-day triple year/month/day(session_started_at); DuckLake's bare day() is day-of-month. No table exists yet."}
  - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "Decision 199: description re-grounded to an append-only event journal (event_kind open|resume|compact|close|annotate); roll-ups moved to read-time derivation. Per-field changes are on their own fields' logs."}
  - {date: "2026-08-26", semantic_break: false, change_class: prose_improvement, summary: "Platform cleanse: references to the removed trading-product surfaces and the retired pre-DuckLake query-engine estate were removed or reworded."}
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-24"
    ratified_via: "Step 10 multi-perspective critique + PLAN-ratify-class-a-telemetry-contracts merge to main (T0.12.6)"
    superseded_on: "2026-09-24"
    summary: >-
      Mutate-in-place root row: outcome/started_at/ended_at/duration_seconds/roll-ups stored and overwritten across an open-then-close pair of rows sharing session_id; ULID mint-once identity (target); day(started_at) partition. Superseded by the append-only event-journal shape (Decision 199):
