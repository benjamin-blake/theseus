# Package-registry namespace-reservation operator procedure (rec-3941, Decision 101/184/195). A
# Class D mechanism contract carrying the per-registry HUMAN / AGENT-RUNNABLE operator walkthrough
# for holding the `ontheloop` distribution namespace on PyPI, npm and crates.io before it is
# taken, plus the anti-squatting posture, the neutral-placeholder content constraint, and the
# identity/ownership rules. A claim made under this procedure is a DEFENSIVE NAMESPACE HOLD, never
# brand ratification -- "On The Loop" is a CANDIDATE name tracked at rec-3922 (open); the ratified
# external-brand hierarchy remains Theseus / Guerdon / Semanto (Decision 101). This contract
# itself claims no name, publishes no package, creates no account and stores no credential --
# execution is operator-only by construction (registry publication needs 2FA-backed credentials
# no agent holds) and is tracked at rec-3941, which stays open until a claim actually lands.
contract:
  id: package-registry-reservation
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-ontheloop-package-registries"
  description: >-
    Per-registry operator procedure for reserving the `ontheloop` namespace on PyPI, npm and
    crates.io, plus the anti-squatting posture, the neutral-placeholder content constraint, and
    the identity/ownership rules. Claims nothing and publishes nothing itself; execution is
    operator-only (rec-3941).
  subject: package-registry-reservation
  evaluator:
    agent_surface: docs/CLAUDE.md

amendment_log:
  - date: "2026-09-21"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-ontheloop-package-registries: initial authoring. Records the per-registry operator
      procedure, the anti-squatting posture, the neutral-placeholder constraint, and the identity
      rules for reserving the `ontheloop` namespace. Live registry measurement 2026-09-21
      (CC-web): `ontheloop` unclaimed (HTTP 404) on PyPI, npm and crates.io; the RATIFIED brand
      `theseus` is already taken (HTTP 200) on all three -- stated here as NOT CONTESTED and NOT
      ACQUIRED by this contract or its execution.

posture:
  disposition: >-
    A claim made under this contract is a DEFENSIVE NAMESPACE HOLD, never brand ratification.
    Decision 195 records company ownership and IP assignment; it does not rename the product. The
    namespace is anchorable to the RATIFIED company name (Decision 195 clause 1), not only to the
    candidate rename tracked at rec-3922.
  scope_anti_squatting: >-
    One claim per registry. PyPI: `ontheloop` only. crates.io: `ontheloop` only, with real
    content -- publication is IMMUTABLE (yank, never delete), so the first version must carry a
    correct licence and description. npm: the bare `ontheloop` name PLUS the `@ontheloop` scope
    (npm's own sanctioned namespace mechanism). Hyphenated and other variants are deliberately NOT
    claimed -- bulk variant-grabbing for an unratified name is the shape all three registries'
    anti-squatting policies actually target.
  neutral_placeholder: >-
    Decision 101(b). The placeholder is functionally real but editorially neutral: a working
    package whose description states the namespace is reserved for future development. No product
    positioning, no marketing copy, no brand claim until rec-3922 ratifies. This accepts slightly
    higher crates.io reclaim exposure than a fully-fleshed package would carry, as a deliberate
    trade.
  installability_rationale: >-
    Decision 184 -- the platform's free tier IS this repository and must be installable, an
    affirmative platform-plane reason to own a distribution namespace regardless of which external
    brand eventually ratifies. The RATIFIED brand `theseus` is already taken on all three
    registries (see registry_measurements), which is NOT contested or acquired here: it sharpens
    the same rationale, since the platform can never ship under `theseus` on any registry whatever
    rec-3922 decides. guerdon (trading-product brand) and semanto (presentation-layer-only) are
    out of frame by their own Decision-101 definitions.

identity:
  security_contact: >-
    The published contact is the role alias security@otl-labs.com, a public business address,
    never a personal mailbox (Decision 101(d) -- no personal identity in any committed file).
    RECORDED AS A CANDIDATE, NOT SETTLED: the otl-labs.com domain derives from one of the two
    undecided org-handle candidates Decision 195 clause 4 routes to rec-3905, so this contact is
    pending that choice -- the same treatment given account_owner_address and crates_io_ownership
    below.
  account_owner_address: >-
    Recommended that the ACCOUNT-OWNER address be a distinct alias from the published security
    contact -- recovery mail wants a narrow unpublished inbox, a security contact wants the
    opposite. The operator's final choice is recorded at execution (rec-3941), not here.
  crates_io_ownership: >-
    crates.io has no separate account email -- it is GitHub OAuth only, so ownership inherits from
    the GitHub identity and couples to the undecided org handle at rec-3905. Claim under the
    personal account now and add a GitHub Team owner once that handle settles; this work is not
    blocked on rec-3905.
  probe_user_agent: >-
    scripts/package_registry_probe.py's crates.io User-Agent contact string is sourced from
    configuration with a neutral default, never a hardcoded personal address (crates.io's crawler
    policy requires a descriptive User-Agent naming a contact).

registry_measurements:
  - date: "2026-09-20"
    source: planning-session observation (context)
    ontheloop: "unclaimed (404) on PyPI, npm, crates.io"
    theseus: "taken (200) on PyPI, npm, crates.io"
    npm_at_ontheloop_scope: "unverified -- npm org endpoints returned 403/401 unauthenticated"
  - date: "2026-09-21"
    source: CC-web live re-measurement, this implementation session
    ontheloop: "unclaimed (404) on PyPI, npm, crates.io"
    theseus: "taken (200) on PyPI, npm, crates.io -- not contested, not acquired"
    npm_at_ontheloop_scope: >-
      still unverified -- an unauthenticated registry.npmjs.org package-level lookup under the
      scope returns 404 regardless of whether the scope itself is claimed, so it is uninformative;
      org/scope status is confirmed by the operator at signup (procedure.npm step 2)

procedure:
  pypi:
    - step: 1
      tag: HUMAN
      action: >-
        Create or use the company PyPI account (browser signup, email verification, 2FA
        enrolment -- credentials no agent holds).
    - step: 2
      tag: AGENT-RUNNABLE
      action: "Confirm `ontheloop` is still unclaimed: bin/venv-python -m scripts.package_registry_probe ontheloop -- read the PyPI row."
    - step: 3
      tag: HUMAN
      action: >-
        Build and upload a minimal neutral-placeholder distribution under the `ontheloop` name
        (per posture.neutral_placeholder) via the account's own publish token.
    - step: 4
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop (rec-3941's acceptance probe, VP step 13)."
  npm:
    - step: 1
      tag: HUMAN
      action: >-
        Create or use the company npm account (browser signup, email verification, 2FA
        enrolment).
    - step: 2
      tag: HUMAN
      action: >-
        Confirm availability of the bare `ontheloop` name and the `@ontheloop` organization scope
        by signing in and checking npm's own org-creation flow -- both returned 403/401
        unauthenticated from CC-web (registry_measurements), so this cannot be confirmed ahead of
        time by the probe.
    - step: 3
      tag: HUMAN
      action: >-
        Publish a minimal neutral-placeholder package under the bare `ontheloop` name, then create
        the `@ontheloop` organization/scope (npm's sanctioned namespace mechanism) and publish (or
        reserve, if npm offers a scope-only reservation) under it.
    - step: 4
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop -- read the npm row."
  crates_io:
    - step: 1
      tag: HUMAN
      action: "Sign in to crates.io with the GitHub account that will own it (personal account now; see identity.crates_io_ownership)."
    - step: 2
      tag: AGENT-RUNNABLE
      action: "Confirm `ontheloop` is still unclaimed: bin/venv-python -m scripts.package_registry_probe ontheloop -- read the crates.io row."
    - step: 3
      tag: HUMAN
      action: >-
        Generate a publish token, then `cargo publish` a minimal neutral-placeholder crate with a
        correct licence and description -- publication is IMMUTABLE (yank, never delete), so the
        first version must be right.
    - step: 4
      tag: HUMAN
      action: >-
        Once the org handle at rec-3905 settles, add a GitHub Team as an additional owner
        (`cargo owner --add github:<org>:<team>`) alongside the personal account.
    - step: 5
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop (VP step 13) -- read the crates.io row."

tracking:
  recommendation: rec-3941
  note: >-
    rec-3941 holds the execution half (operator-only) and stays OPEN until the names are actually
    claimed -- this contract landing does not close it. Siblings: rec-3905 (org handle), rec-3922
    (brand-rename ratification). Neither blocks this work.
