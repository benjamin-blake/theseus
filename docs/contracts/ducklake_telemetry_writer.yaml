---
# Class B Lambda verb contract for the agent-platform-ducklake-telemetry-writer function (T2.36, slice 2a-2, plan 3 part 1).
# The function exists so telemetry identities never reach ops verbs (Decision 143 cl.3, Decision 213): its own role, its own
# scoped catalog login, env-pinned to the isolated ducklake_smoke catalog. This contract documents the PRODUCTION verb surface
# only; attach_check and telemetry_probe are gate instrumentation, NOT agent surfaces, and are out of contract scope.
contract:
  id: ducklake_telemetry_writer
  class: B
  contract_version: 1
  status: provisional_v0
  description: >-
    Telemetry-scoped DuckLake runtime Lambda invoked over an AWS_IAM (SigV4) Function URL, URL-only (direct invoke is denied
    in the permissions boundary, Decision 213). Env-pinned to the isolated ducklake_smoke catalog on a scoped catalog login;
    it takes no catalog selector and never reaches the ops verbs or the production ducklake_ops catalog. Its first verbs
    verify and seed the telemetry tables (which the catalog owner creates, Decision 216) and register tenants and projects (Decision 200): tenant and project ids are ULIDs minted
    once per request, and the ops_entity_counters row is a lock only. The verbs cover provisioning, registration and
    append_telemetry (slice 2a-2 plan 3 part 2): inline rows for one project in one transaction. This contract documents the
    PRODUCTION verb surface only.
  governance:
    auth_type: >-
      AWS_IAM SigV4-signed Function URL, invoked URL-only. The caller's account is taken from the signed identity at the
      handler edge (CallerPrincipal, Decision 184 cl.2); no verb accepts a principal, tenant or catalog parameter.
    principal_classes:
      - github_ci_branch
      - PlatformDev
    admin_only_features: []
    write_path: >-
      ducklake_telemetry_writer Lambda -> run_telemetry_txn (one transaction, bounded OCC retry) -> the isolated
      ducklake_smoke catalog: provision_telemetry (verify the nine owner-created tables and seed the two counter rows; no DDL), register_tenant and
      register_project (SCD2 history MERGE plus current MERGE under a lock-only counter UPDATE). The telemetry tables are
      created under the catalog owner by ducklake_maintenance_smoke's create_telemetry_tables (Decision 216). The function has no
      destructive verb by design and holds no CREATE; dropping a table stays on the admin maintenance function.
    id_allocator: >-
      ULIDs (tenant_id, project_id and the write ulid), minted once per request outside the retry loop; the
      ops_entity_counters row serializes concurrent registrations and allocates nothing (Decision 84 I-2, Decision 200).
    merge_key: tenant_id for ops_tenants, project_id for ops_projects; a project is bound to (tenant_id, project_ref).
  provisional_v0:
    authored_at: "2026-10-12"
    authored_via: PLAN-telemetry-registration-verbs (T2.36 slice 2a-2 plan 3 part 1)
    rationale: >-
      Class B contracts start provisional_v0: the verb set, error taxonomy and payload shapes are validated against real
      traffic before ratification. The function has served no production traffic yet (the smoke catalog only).
    surfacing_note: >-
      Only the production_invocations condition applies: there is no first production invocation date because the function
      writes nothing to the production ops catalog. check_re_ratification_trigger schema-validates this block in CI.
    re_ratification_trigger:
      first_of:
        - "production_invocations >= 500"
    re_ratification_owner: "human + Step 10 multi-perspective critique"
verbs:
  append_telemetry:
    payload_schema_ref: >-
      event envelope {action: "append_telemetry", project_ref, component?, batches}. No other key is accepted (a catalog,
      meta_schema, data_path, tenant_id or project_id key is refused like any unknown key). batches is a non-empty list of
      {table, rows}: table in the closed set of event tables, each at most once, the telemetry_sessions batch last when
      present, rows a list of objects, at least one row in the request. component defaults to unknown, else
      ^[a-z][a-z0-9_-]{0,63}$. Every present producer and parser_version is identical across the request. Timestamps carry
      exactly three fraction digits and an offset. Encoding validity is refused: a lone surrogate (U+D800-U+DFFF) in any
      string, and U+0000 in any key, the project_ref, the component or a row's producer. Caps: the JSON-escaped body
      len(json.dumps(S)), S the request body string as delivered, at most 5242880 bytes; at most 2000 rows per table and
      5000 per request. Two refusals are temporary, owned by rec-4024 and removed by the blob route: a row carrying
      content_uri, and inline content above the contract threshold while the inline_within_threshold exemption stands.
    response_codes:
      200: "body {ok, tenant_id, project_id, project_registration (created|existing), tables {table: {submitted, collapsed, inserted}}, occ_retries, commit_ms (integer)}; an identical re-send answers 200 with inserted 0"
      400: "bad_request (reason names the rule; table and row when known; never a value), write_order (the telemetry_sessions batch is not last), mixed_producer (more than one producer or parser_version in the request)"
      403: "tenant_unresolved (remedy: register_tenant); project_unregistered (a drill: or synthetic: project_ref that was never registered; remedy: register_project)"
      409: "grain_conflict {table, event_id, row}: a row differs from a stored or earlier row under one (producer, event_id, parser_version) grain key; nothing from the request is written; row is the 0-based index as sent, never an external_ref or a value"
      413: "payload_too_large (measure invoke_bytes, or rule inline_within_threshold with the threshold), too_many_rows (measure rows_per_table or rows_per_request)"
      422: "row_rule {table, row, rule, column, exclude_before?}; schema_gate {table, row, column, reason}; nothing written; never a value"
      500: "runtime; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "occ_exhausted: the OCC retry budget was exhausted (retryable); catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      bad_request: "a malformed request or an invalid string; names a reason and a position, never an undeclared name or a value (400)"
      write_order: "the telemetry_sessions generation marker batch is not last; a producer tripwire for the cross-request order the producer owns (400)"
      mixed_producer: "more than one producer or parser_version in one request (400)"
      tenant_unresolved: "the signed caller has no registered tenant (403)"
      project_unregistered: "an unregistered reserved-namespace project_ref (403)"
      grain_conflict: "a differing row under an existing grain key; nothing written, never retried (409)"
      payload_too_large: "over the body cap, or inline content above the threshold while its exemption stands (413)"
      too_many_rows: "over the per-table or per-request row cap (413)"
      row_rule: "a contract row rule rejected a row (422)"
      schema_gate: "a type, NOT NULL, reference, time-range or wire-timestamp rejection (422)"
      runtime: "loud-fail (500)"
      occ_exhausted: "OCC retry budget exhausted; safe to retry (503)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  describe:
    payload_schema_ref: >-
      event envelope {action: "describe"}. Connectionless: returns the sorted action list and the pinned catalog's
      meta_schema and whether its data path is the smoke path. No connection is opened.
    response_codes:
      200: "body {ok, function, actions, catalog: {meta_schema, data_path_is_smoke}}"
      403: "missing_caller_identity: the Function URL authorizer context carries no caller identity"
      500: "telemetry_env_unset: a required environment pin is not set; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
    typed_errors:
      missing_caller_identity: "no signed caller identity (403)"
      telemetry_env_unset: "a required TELEMETRY_* environment variable is not set (500)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
  provision_telemetry:
    payload_schema_ref: >-
      event envelope {action: "provision_telemetry", component?}. No other key is accepted (a force_recreate or confirm key
      is refused like any unknown key). component is a str with no U+0000 and no code point in U+D800-U+DFFF. Verify and
      seed only, issuing no DDL: the nine target tables (the four telemetry event tables, the ops_tenants and ops_projects SCD2
      pairs, ops_entity_counters) are created under the catalog owner by ducklake_maintenance_smoke's create_telemetry_tables
      (Decision 216) before any write; this verb refuses absent tables by name, checks every target table read-only against its
      declared partitions and columns, and seeds the ops_tenants and ops_projects counter rows without ever lowering a value.
    response_codes:
      200: "body {ok, tables (the nine physical tables), counters {ops_tenants, ops_projects}}"
      400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
      500: "runtime: a target table is absent, a half-present SCD2 pair, or a table whose partitions or columns drift from the declared spec; nothing was written; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "occ_exhausted: the OCC retry budget was exhausted (retryable); catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      bad_request: "an unknown request key, or a non-str, NUL-bearing or lone-surrogate string; names the field, never the value (400)"
      runtime: "loud-fail on an absent target table, a half-present pair or a drifted table (500)"
      occ_exhausted: "OCC retry budget exhausted; safe to retry (503)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  register_tenant:
    payload_schema_ref: >-
      event envelope {action: "register_tenant", component?}. Self only: the tenant is the signed caller's account; any
      principal_kind, principal_ref or tenant_id key is refused like any unknown key. component is a str with no U+0000 and
      no code point in U+D800-U+DFFF. Idempotent: one canonical uppercase ULID per signed principal across calls.
    response_codes:
      200: "body {ok, tenant_id, created}; never the principal or a hash of it"
      400: "bad_request: an unknown key, or an invalid string with the field named, never the value"
      500: "runtime: the ops_tenants counter row is not exactly one (run provision_telemetry); unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "occ_exhausted: the OCC retry budget was exhausted (retryable); catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      bad_request: "an unknown request key, or a non-str, NUL-bearing or lone-surrogate string; names the field, never the value (400)"
      runtime: "loud-fail, incl. a missing or duplicated counter row (500)"
      occ_exhausted: "OCC retry budget exhausted; safe to retry (503)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  register_project:
    payload_schema_ref: >-
      event envelope {action: "register_project", project_ref, name?, remote?, component?}. project_ref, name, remote and
      component are str with no U+0000 and no code point in U+D800-U+DFFF; project_ref is required and non-empty. The
      caller's tenant must already be registered (register_tenant). Explicit registration: registration is registered,
      purpose is derived from the ops_projects purpose prefix_map (never caller-supplied), and an omitted name or remote
      means unchanged. Idempotent per (tenant, project_ref).
    response_codes:
      200: "body {ok, project_id, created, purpose, registration}"
      400: "bad_request: an unknown key, a missing project_ref, or an invalid string with the field named, never the value"
      403: "tenant_unresolved: the caller's tenant is not registered (remedy: register_tenant)"
      422: "schema_gate or row_rule: a contract row rule rejected the record; nothing written; body names table, rule and column, never a value"
      500: "runtime: the ops_projects counter row is not exactly one (run provision_telemetry); unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "occ_exhausted: the OCC retry budget was exhausted (retryable); catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      bad_request: "an unknown request key, a missing project_ref, or a non-str, NUL-bearing or lone-surrogate string; names the field, never the value (400)"
      tenant_unresolved: "the signed caller has no registered tenant (403)"
      schema_gate: "field outside the table schema gate (422)"
      row_rule: "a contract row rule rejected the record; nothing written (422)"
      runtime: "loud-fail, incl. a missing or duplicated counter row (500)"
      occ_exhausted: "OCC retry budget exhausted; safe to retry (503)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
audit_invariants:
  - "append_telemetry writes one request in ONE transaction: a first-sight project registration and every batch commit or roll back together. An identical re-send is a no-op and a differing row writes nothing (Decision 207); a grain conflict is never retried as an OCC collision."
  - "Within a request the data batches precede the telemetry_sessions marker batch. Inside one transaction the order has no visibility effect, so this is a producer tripwire for the cross-request order the producer owns (telemetry-event-envelope.yaml R7)."
  - "The size cap is len(json.dumps(S)), S the request body string as delivered: ASCII-escaped, so it equals the measure Lambda's 6 MiB event limit applies to for an ASCII body and is an upper bound when the body carries non-ASCII (measured 2026-10-09)."
  - "No append_telemetry response or log line carries a caller value (a row value, an undeclared name, principal.ref): errors locate by table, row index, column and reason only."
  - "Two refusals are temporary and owned by rec-4024: a caller content_uri (400 blob_route_unavailable) and inline content above the threshold while the exemption stands (413 inline_within_threshold). The blob route removes both."
  - "Every answered request emits exactly one C6 log line (verb, component, status, error_type, per-table counts, request and invoke bytes, tenant_id, project_id, occ_retries, commit_ms, caller_role), never an account id, an ARN or a hash of either; the five data verbs' lines carry an Embedded Metric Format block (namespace DuckLakeTelemetryWriter, RequestCount by Verb)."
  - "Telemetry verbs attach only the pinned catalog and take no catalog selector: meta_schema and data_path are never read from the event."
  - "No verb drops, truncates or recreates a table. The telemetry writer issues no Postgres DDL and holds no CREATE on any schema; its tables are created under the catalog owner (Decision 216)."
  - "principal_ref never appears in a response or log, and no response carries a hash of it (Decision 101)."
  - "A rejected request string never appears in a response or log: a refusal names the field, not the value."
  - "An unknown `action` returns 400 with the sorted action allow-list (no silent no-op). A body that is not valid JSON or not a JSON object returns 400 bad_request."
  - "No request that reaches the handler answers the Function URL's 502: an exception no row maps answers 500 unmapped {error_class, request_id, action}, never its message; a dead catalog connection answers 503 catalog_unavailable. Enforced by tests/lambdas/ducklake_telemetry_writer/test_handler.py (test_unexpected_exception_is_a_typed_500, test_unmapped_answer_never_echoes_the_message) and live by the post-deploy no-escaped-traceback check; process-level failures (timeout, out of memory, runtime exit) remain the runtime's 502 and count in Errors."
  - "Declared residual: the ducklake_unmapped_error log line carries the exception message redacted and truncated to 300 characters, so a request value inside an unmapped exception's message can reach the log (residual against the rejected-string rule; strictly less than the runtime traceback it replaces)."
  - "Declared residual: the async DuckLake handlers (maintenance, maintenance_smoke, catalog_dr) are EventBridge-invoked and keep Lambda's own retry behaviour for an escaped exception; rec-4303 owns them."
amendment_log:
  - date: "2026-10-14"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-telemetry-append-inline (T2.36 slice 2a-2 plan 3 part 2): adds the append_telemetry verb (inline rows into the
      isolated smoke catalog), its request grammar, caps, typed errors and audit invariants, and the C6 line with its EMF block.
      telemetry_probe stays out of contract scope.
    migration_story: >-
      A new verb: no existing verb or response changes. The function had no producer before this verb.
  - date: "2026-10-14"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-ducklake-typed-unmapped-errors (rec-4282): every verb gains the typed unmapped (500) answer and the connectionful verbs
      the typed catalog_unavailable (503) answer; the 500 and 503 response codes name them; an unparseable body answers 400
      bad_request; audit_invariants state that no request answers the runtime's 502 and declare the log-line residual.
    migration_story: >-
      The untyped 502 an unmapped exception used to surface as is now a typed 500 or 503. Clients never retried the 502 as anything
      but transient; the 503 catalog_unavailable stays retryable and every other typed 5xx gates.
  - date: "2026-10-14"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-owner-provisioning (rec-4294, Decision 216): provision_telemetry no longer creates tables; it verifies the
      nine owner-created tables, refuses absent ones by name (500 runtime) and seeds the counter rows. The tables are created
      under the catalog owner login by ducklake_maintenance_smoke's create_telemetry_tables. governance.write_path, the
      description and the "create-only" audit invariant are restated (the writer issues no DDL and holds no CREATE).
      semantic_break=true because provision_telemetry's behaviour changes.
    migration_story: >-
      The verb set is unchanged. A caller that relied on provision_telemetry creating tables now gets a typed 500 naming the
      absent tables until the owner step has run; the deploy pipeline runs it before the telemetry gate. No table existed
      before this change (the first provision failed live), so nothing is stranded.
