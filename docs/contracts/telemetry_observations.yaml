---
# Class A data contract for telemetry_observations -- the UNIFIED node table of the canonical
# session-rooted trace/observation model (Decision 95 clause 2), re-grounded to the event-journal
# model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL: a span-shaped node (phase | step | turn | tool_call) is TWO rows sharing one
# observation_id (an open row and a close row, distinguished by event_kind); a point-shaped node
# (process_event | model_call) is ONE row, event_kind=point, carrying its facts directly. Start/end/
# duration are derived at read by pairing a span's open+close rows -- never stored. Friction
# classification is derived at read from process_event name signatures (rec-4032), never stored as
# a `tier` column.
contract:
  id: telemetry_observations
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_observations: an append-only EVENT JOURNAL, one row per
    observation LIFECYCLE EVENT. A span-shaped kind (phase | step | turn | tool_call) gets an open
    row and a close row sharing one derived observation_id; a point-shaped kind (process_event |
    model_call) gets one row, event_kind=point. observation_type absorbs the collapsed draft sibling
    tables (Decision 95) plus the T3.20 turn/tool_call kinds. Cross-cutting facts (name, model,
    tokens, outcome, severity) are typed columns; the type-specific long tail lives in metadata
    (the Langfuse `metadata` shape); large blobs go to telemetry_transcripts.
  projects_to:
    note: >-
      No generated artifact yet (telemetry is not on DuckLake; no telemetry field_semantics.yaml).
      This contract IS the authoritative field-semantic source until the Phase 4 rebuild lands a
      generator.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_observations:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null: {enforced: true}
      accepted_values:
        values: [open, close, point]
        enforced: false
        note: >-
          open/close for span-shaped kinds (phase, step, turn, tool_call); point for the
          instantaneous kinds (model_call, process_event) -- exactly one row each.
    governance_notes_local: The lifecycle/point discriminator, orthogonal to observation_type (the node KIND discriminator, below).
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: For a point row this is the fact's own timestamp; for a span's open/close row it is that boundary's own time.
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local: {not_null: {enforced: true}}
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: >-
      The hash input for this row's event_id. A model_call's external_ref is
      '<provider_response_id>/model_call' for every producer that observes it (see
      telemetry-event-envelope.yaml's MODEL_CALL DEDUPE note for how this still de-duplicates to one
      row per API response).
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: >-
      Per observation_type: tool_call entity_ref = its toolUseId; turn entity_ref = '<session
      entity_ref>/<promptId>' (a sub-agent record may reuse the parent's promptId); process_event
      entity_ref = its own external_ref; phase/step entity_ref = the producer's own stable label for
      that node. observation_ref (below) carries this row's OWN reference when the row is instead
      referencing (rather than defining) an observation.
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local: {not_null: {enforced: true}}
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local: {not_null: {enforced: true}}
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local: {not_null: {enforced: true}}
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local: {not_null: {enforced: true}}
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: >-
      FOREIGN KEY to telemetry_sessions.session_id (the trace root). Derived using the parent's own
      domain tag ('telemetry_sessions:session_id') over this row's session_ref -- no propagation
      step. Every observation roots to a session (Decision 95 root-unification).
    joins:
      - session_id_join_telemetry_sessions_to_observations
  parent_observation_id:
    $ref: parent-observation-id.yaml#/contract/fields/parent_observation_id
    governance_notes_local: >-
      FOREIGN KEY self-reference building the in-session tree: a step's parent is its phase; a
      tool_call's parent is its turn. NULL = a root observation directly under the session. Derived
      using the enclosing node's own domain tag over this row's parent_observation_ref.
    joins:
      - parent_observation_id_join_observations_self_tree
  observation_id:
    $ref: observation-id.yaml#/contract/fields/observation_id
    dq_intent_local: {not_null: {enforced: true}}
    governance_notes_local: >-
      PRIMARY entity key of this node. Both the open and close row of a span-shaped observation
      carry the SAME observation_id (derived from the same observation_ref) -- pairing them is how
      a reader derives start/end/duration.
    joins:
      - observation_id_join_observations_to_transcripts
      - observation_id_join_observations_to_agents
  observation_type:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      The node-kind discriminator: phase | step | turn | tool_call | process_event | model_call
      (Decision 95 collapse rule, extended with the T3.20 turn/tool_call kinds -- their own
      field additions are T3.20's build, not this contract's).
    semantics: >-
      Required discriminator. Open to accepted_values_extend for new node kinds, never silently
      narrowed. "span" is deliberately NOT a value (lexicon: use "observation").
    populated_by: the write boundary, per event_kind.
    dq_intent:
      not_null: {enforced: true}
      accepted_values:
        values: [phase, step, turn, tool_call, process_event, model_call]
        enforced: false
        note: Open to accepted_values_extend, never silent narrowing.
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): extended accepted_values with turn and tool_call (T3.20's own field additions for those kinds are out of this plan's scope)."}
  name:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Human-readable label for the node: the phase name, the step title, the model purpose (label
      only -- see telemetry_agents/model for the model dimension), or the process_event CATEGORY.
    semantics: >-
      For process_event, name follows the grammar '<source>:<signature>' (e.g. hook:never_on_main,
      gate:validate_scope_boundary) -- the stable signature a friction-classification reader
      pattern-matches against (rec-4032's labels table), replacing the retired stored `tier` column.
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): declared the process_event name
          grammar '<source>:<signature>' as the friction-classification read input, replacing the
          retired stored `tier` column. semantic_break=true: name now carries load-bearing
          derivation-input meaning it did not carry before.
        migration_story: No live populator existed; the Phase 4 rebuild (T2.36) and rec-4032's labels table build directly to this grammar.
  sequence:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Ordinal position of the node among its siblings under the same parent (0/1-based).
    semantics: Deterministic sibling ordering independent of ULID time-order. Null for kinds without an intrinsic order (process_event, model_call).
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: "Disposition of the node where applicable: success | error | blocked | interrupted."
    semantics: >-
      Required on a tool_call's close row (the one kind with a mandatory terminal disposition in
      this model); optional elsewhere. Stored once, on the row that observes it.
    populated_by: the write boundary, at close for span-shaped kinds.
    dq_intent:
      not_null: {enforced: false}
      required_when: {event_kind: [close], observation_type: [tool_call]}
      accepted_values: {values: [success, error, blocked, interrupted], enforced: false}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-telemetry-event-journal-contracts: accepted_values narrowed from the open
          "running | success | failed" phase/step vocabulary to the closed
          {success, error, blocked, interrupted} set, required specifically on a tool_call's close
          row (dq_intent.required_when). semantic_break=true: the vocabulary and its enforcement
          scope both changed.
        migration_story: No live populator existed; rec-4024 builds directly to this shape.
  severity:
    type: str
    iceberg_type: string
    nullable: true
    description: "Severity/level for kinds that carry one: info | warning | error | critical (process_event). NULL otherwise."
    semantics: The Langfuse `level` concept. Open set; enforcement deferred to the Phase 4 telemetry DQ config.
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  model:
    type: str
    iceberg_type: string
    nullable: true
    description: The model that produced this node, where applicable (e.g. claude-opus-4-8).
    semantics: >-
      Per-node model attribution; the session headline is telemetry_sessions.model_primary and the
      agent dimension is telemetry_agents.model.
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  tokens_input:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Input/prompt tokens for this model_call, stored once on its single point row.
    semantics: One of the four token classes stored on model_call (Decision 199, replacing the phase/step roll-up path). bigint.
    populated_by: the write boundary, at the model_call point event.
    dq_intent:
      not_null: {enforced: false}
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): population narrowed from the retired phase/step token roll-up path to the model_call point row only; added dq_intent.required_when."}
  tokens_output:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Output/completion tokens for this model_call.
    semantics: One of the four token classes stored on model_call. bigint.
    populated_by: the write boundary, at the model_call point event.
    dq_intent:
      not_null: {enforced: false}
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): population narrowed from the retired phase/step token roll-up path to the model_call point row only; added dq_intent.required_when."}
  tokens_cache_read:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Cache-read tokens for this model_call.
    semantics: "NEW token class (Decision 199) -- one row per provider response id needs all four classes to reconcile provider-reported cost. bigint."
    populated_by: the write boundary, at the model_call point event.
    dq_intent:
      not_null: {enforced: false}
      required_when: {event_kind: [point], observation_type: [model_call]}
  tokens_cache_creation:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Cache-creation tokens for this model_call.
    semantics: NEW token class (Decision 199), the fourth of the four classes stored once per model_call. bigint.
    populated_by: the write boundary, at the model_call point event.
    dq_intent:
      not_null: {enforced: false}
      required_when: {event_kind: [point], observation_type: [model_call]}
  cost_usd_reported:
    type: float
    iceberg_type: double
    nullable: true
    description: Provider-reported cost in USD for this model_call, when the provider reports one. NULL otherwise.
    semantics: >-
      STORED only when a provider reports it (Decision 199); see cost_usd below for the derived,
      always-computable value this row also carries.
    populated_by: the write boundary, at the model_call point event, when the provider reports a cost.
    dq_intent: {not_null: {enforced: false}}
  cost_usd:
    type: float
    iceberg_type: double
    nullable: true
    description: >-
      Cost in USD for this model_call, DERIVED at read from a static price-per-token mapping
      (rec-4031) over the four stored token classes. NULL for non-model_call kinds.
    semantics: >-
      Preferred read: cost_usd_reported when the provider reported one (authoritative), else this
      derived value (MVP static price table, rec-4031) -- both are always available on a model_call
      point row so a reader can choose either without a second query. No physical column.
    populated_by: a named reader verb (rec-4031), applied to a model_call row's stored token classes.
    dq_intent: {not_null: {enforced: false}}
    derivation: {timing: read, derived_by: "reader_verb:model_call_cost_estimate", formula: "COALESCE(cost_usd_reported, static_price_table(model) applied to tokens_input/tokens_output/tokens_cache_read/tokens_cache_creation)", inputs: [cost_usd_reported, model, tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation], realized: false}
  attempt:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Attempt/retry counter for this node (1-based; >1 on retry). NULL where not applicable.
    semantics: A key rework signal.
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  provider:
    type: str
    iceberg_type: string
    nullable: true
    description: "Inference provider for a model_call node: copilot_cli | copilot_sdk | github_models. NULL for non-model_call kinds."
    semantics: Open set; enforcement deferred to the Phase 4 telemetry DQ config.
    populated_by: the write boundary, at the model_call point event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the model_call point event; field meaning unchanged."}
  acceptance_passed:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: Whether a step's acceptance check passed. NULL for non-step kinds (or steps with no acceptance).
    semantics: A first-class self-improvement / T3-verifier signal.
    populated_by: the write boundary, at a step's close event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to a step's close event; field meaning unchanged."}
  exit_code:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Process exit code for a model_call node. NULL for non-model_call kinds.
    semantics: Model-call success/failure analytics.
    populated_by: the write boundary, at the model_call point event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the model_call point event; field meaning unchanged."}
  time_lost_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Seconds lost to a process_event, when the producer estimates one. NULL for non-process_event kinds or when unestimated.
    semantics: >-
      A raw observed FACT (stored once, at the point event), distinct from the DERIVED friction
      classification a reader assigns by matching name against rec-4032's labels table.
    populated_by: the write boundary, at the process_event point event.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): distinguished this raw observed fact from the now-derived friction classification (retired `tier` column); field's own value unchanged."}
  rec_id:
    type: str
    iceberg_type: string
    nullable: true
    description: Recommendation id this observation relates to (e.g. rec-2335). NULL when not applicable.
    semantics: Optional cross-reference to ops_recommendations.id, joined tenant-locally.
    populated_by: the write boundary.
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name tenant-local joining; field meaning unchanged."}
  metadata:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      JSON object holding the type-specific attribute long-tail not promoted to a typed column (the
      Langfuse `metadata` map). Stored as a JSON string for schema stability across observation_types.
    semantics: >-
      By observation_type: STEP -> target_file, action, acceptance_command, diff_stat,
      model_escalated_from, prompt_hash; PHASE -> max_attempts, revision_count,
      blocking_findings_count; PROCESS_EVENT -> description, root_cause, resolution, rec_filed,
      detected_by; MODEL_CALL -> purpose_detail, prompt_hash, error. The high-value analytic fields
      are PROMOTED to typed columns (provider, acceptance_passed, exit_code, time_lost_seconds,
      the four token classes) and are NOT in this bag.
    populated_by: the write boundary (serialised JSON of the type-specific facts).
    dq_intent: {not_null: {enforced: false}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): dropped rec-id/rec_filed cross-references now covered by the typed rec_id column, and updated the promoted-fields list to name the four token classes; the JSON bag's role is otherwise unchanged."}
governance:
  table_class: event
  partition_by: "day(session_started_at)"
  write_path: >-
    NOT PROVISIONED: no telemetry writer exists today. TARGET (Phase 4, post-T2.26): a single
    append_events boundary (rec-4024) writing telemetry_observations. Append-only; no SCD2 merge,
    no in-place mutation.
governance_notes: >-
  EVENT JOURNAL (Decision 199, amending Decision 95 clause 2, Decision 96 clauses 1 and 3, and
  Decision 97 clauses 1-4): a span-shaped observation_type (phase/step/turn/tool_call) is an
  open+close row PAIR sharing one derived observation_id; a point-shaped kind (process_event,
  model_call) is a single row. start/end/duration are DERIVED at read by pairing the open/close
  rows (data-modeling-standard.yaml derived-state rule) -- no stored started_at/ended_at/
  duration_seconds columns remain (superseding contract_version 1's stored open/close pair).
  Friction classification (rework/exception tier) is DERIVED at read from process_event name
  signatures against rec-4032's labels table -- the stored `tier` column (contract_version 1) is
  RETIRED, along with classifier_version (never a live column) and ingested_at (superseded by the
  envelope's created_timestamp). Identity (session_id, parent_observation_id, observation_id) is
  derived at the write boundary per telemetry-event-envelope.yaml's normative hash spec.
  NULLABILITY AXES: `nullable` is the TARGET-SCHEMA column constraint (Phase 4 DDL);
  `dq_intent.not_null.enforced` is the CURRENT DQ posture; a per-event-kind/observation_type
  requirement is expressed via dq_intent.required_when, never a table-wide not-null. A PK/FK $ref'd
  from a Class C baseline keeps `nullable: true` at the column axis with `not_null.enforced: true`
  at the DQ axis; the Phase 4 DDL generator emits NOT NULL from the DQ axis for such keys.
  REPORT-ONLY: target-state, not implemented. KNOWN GAPS: rec-4024 (writer/reader verbs), rec-4032
  (the friction-classification labels table), rec-4031 (the cost_usd static price-mapping reader).
amendment_log:
  - date: "2026-09-24"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199): contract.description re-grounded from
      a mutate-in-place open/close pair to an event-journal shape (event_kind open|close|point)
      with the shared telemetry-event-envelope.yaml fields. The per-field shape changes (turn/
      tool_call extension, the new token/cost fields, retired tier/classifier_version/ingested_at)
      are recorded on their own fields' amendment_log entries; this entry covers the
      contract-level description text.
    migration_story: >-
      No live telemetry writer exists (this contract stays TARGET-STATE, dq_INTENT only); the
      Phase 4 rebuild (T2.36) and rec-4024/rec-4032 build directly to this contract_version 2 shape.
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: references to the removed trading-product surfaces and the retired
      pre-DuckLake query-engine estate were removed or reworded.
    migration_story: >-
      The repository became platform-only. Product surfaces (broker credentials, the product
      roadmap, the market-data pipeline) and the retired legacy query-engine path (staging
      outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's
      references to them were removed in the same change. No live DuckLake field or verb
      semantics changed.
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-24"
    ratified_via: "Step 10 multi-perspective critique + PLAN-ratify-class-a-telemetry-contracts merge to main (T0.12.6)"
    superseded_on: "2026-09-24"
    summary: >-
      Mutate-in-place open/close pair with a stored `tier` friction column and per-table
      phase/step token roll-ups; ULID mint-once identity (target); day(started_at) partition.
      Superseded by the event-journal shape (Decision 199): open+close/point rows, read-derived
      duration and friction, write-boundary-derived identity, day(session_started_at) partition.
