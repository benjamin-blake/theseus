# Port registry, conformance-suite pointers and cross-port coupling findings (Decision 212,
# amending Decision 184 clause 2 and Decision 197 clause 2), plus the repository-structure
# assumptions otl init must not make (Decision 211). The sole port registry: no other file
# restates these ports or verbs (Decision 212 clause 6). Every rule below is enforced by
# scripts/checks/contracts/validate_ports_contract.py unless marked advisory.
contract:
  id: ports
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 212 / PLAN-brownfield-adoption-port-conformance"
  description: >-
    Class D mechanism contract: the platform's named ports (Decision 184 clause 2 as amended by
    Decision 212), each with its required verbs, registered adapters and their tier, its
    credential-free oracle or recorded oracle gap, and its conformance-suite pointer; the
    cross-port coupling findings Decision 212 clause 3 calls defects; and the repository-structure
    assumptions Decision 211 requires the loop to record before otl init is specified.
  subject: ports
  evaluator:
    check: validate_ports_contract

amendment_log:
  - date: "2026-10-06"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-brownfield-adoption-port-conformance (Decisions 211 and 212): initial authoring --
      twelve ports, adapter tiers, oracles or recorded oracle gaps, conformance-suite pointers,
      four seeded accepted coupling findings (Decision 84 I-1's Function-URL boundary over an
      AWS-identity transport; Decision 184 clause 3 / Decision 205 clause 2 Checks-API verdict;
      Decision 205 clause 1's GitHub-event-origin Actions shell; Decision 84's portal routing
      work-item storage through the function_url ops_verbs adapter) and an empty
      structural_assumptions list.

semantics:
  adapter_tiers: >-
    supported -- this platform's maintainers run it and its port's suite gates it; community --
    contributed and suite-tested, not maintainer-run; experimental -- registered for discovery,
    no support promise (Terraform provider labelling, Decision 212 clause 7).
  adapter_status: >-
    implemented -- a code location realises this adapter today (`location` names an existing repo
    path); verb conformance is UNPROVEN until the port's conformance_suite is present. pending --
    not built yet; `owning_item` names the tier item, criterion, rec or decision that owns it.
  verbs_status: >-
    settled -- the port's required_verbs are named by a ratified Decision (run_persona: Decision
    206 clause 7). provisional -- drafted from today's code or a criterion and amendable without
    re-deciding Decision 212 when the port's suite lands (the catalog, table_data and
    content_blobs verbs are provisional until T4.23's suites exist; DuckDB and the object store
    realise them today, so the suite tests this platform's adapter seam, not the upstream engine).
    work_item_storage's verbs (file_rec and update_rec, renamed with the work-item model by
    Decision 197 clause 7) stay provisional until a ratified Decision names the renamed verbs;
    the rename arrives here first as a provisional amendment, and no suite landing settles them.
  oracle: >-
    The credential-free reference every adapter of the port must match under its gating suite
    (Decision 212 clause 2). kind adapter -- `ref` names one of the port's adapters and `status`
    mirrors it (present iff that adapter is implemented); kind harness -- `ref` names the owning
    item of an emulator harness that is the standing oracle (orchestration_host: T4.20's moto
    harness, Decision 185 clause 1). status pending means NO oracle exists today.
  oracle_gap: >-
    Required exactly when `oracle` is null, never beside one: why the port has no credential-free
    oracle and what governs its conformance instead.
  conformance_suite: >-
    status present -- `path` is an existing test file or directory; status pending --
    `owning_item` names the item that writes the suite. One gating suite per port, never per
    bundle; optional credentialed live drift runs alarm and never gate (Decision 212 clause 2b).
  owning_item: >-
    A roadmap tier item id, optionally narrowed to one criterion as <item>:<criterion> (both must
    exist in docs/ROADMAP-PLATFORM.yaml); a rec-NNNN id (format only -- the cache is not
    consulted); or a dec-NNN id naming a header in docs/DECISIONS.md.
  coupling_findings: >-
    One row per cross-port coupling (Decision 212 clause 3): an adapter of one port assuming
    another port's adapter. status open -- a defect awaiting its owner; accepted -- held by a
    ratified Decision the owning_item names, removable only by re-deciding it; resolved -- the
    coupling no longer exists (keep the row; rows are never deleted). More than ten open rows
    fires Decision 212's coupling-findings-exceed-ten condition (predicate
    ports_open_coupling_findings_exceed, scripts/preflight/decision_conditions.py).
  structural_assumptions: >-
    One row per assumption the loop makes about the structure of the repository it runs on
    (paths, layout, house style, cloud identity), recorded as T2-T4 work meets it (Decision 211
    clause 2; T4.24 c9). status open -- not yet generalised; resolved -- otl init generalises or
    configures it; accepted -- kept as a stated adoption requirement.
  ambient_trigger: >-
    The Layer-1 instruction file that tells agents to record rows here; the check asserts it
    names this contract.

ambient_trigger: AGENTS.md

ports:
  - id: run_persona
    required_verbs: [run_persona]
    verbs_status: settled
    adapters:
      - {id: litellm, tier: supported, status: pending, owning_item: T4.2}
      - {id: claude_cli, tier: supported, status: pending, owning_item: T4.27}
      - {id: codex_cli, tier: experimental, status: pending, owning_item: "T4.27:c14"}
    oracle: null
    oracle_gap: >-
      Backends are held to outcome parity, never trajectory parity (Decision 206 clause 4), so no
      backend is an oracle for another: the gating suite is T4.27 c7's anti-drift gate and parity
      evidence is read from Decision 199 events (T4.27 c12). Backend vocabulary home:
      docs/contracts/inference-provider.yaml.
    conformance_suite: {status: pending, owning_item: "T4.27:c7"}
  - id: persona_compute_host
    required_verbs: [run_image]
    verbs_status: provisional
    adapters:
      - {id: local_container, tier: supported, status: pending, owning_item: "T4.2:c14"}
      - {id: github_actions_shell, tier: supported, status: pending, owning_item: "T4.2:c8"}
      - {id: fargate, tier: experimental, status: pending, owning_item: T4.15}  # presumptive until T4.15 / CD.27 (Decision 205 clause 6)
    oracle: {kind: adapter, ref: local_container, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.2:c14"}
  - id: ops_verbs
    required_verbs: [current_state, latest_snapshot, named, describe, write]
    verbs_status: provisional
    adapters:
      - {id: in_process, tier: supported, status: pending, owning_item: T4.23}
      - {id: function_url, tier: supported, status: implemented, location: src/common/ducklake_reader_client.py}
    oracle: {kind: adapter, ref: in_process, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c4"}
  - id: work_item_storage
    required_verbs: [file_rec, update_rec, pick_work_item]
    verbs_status: provisional
    adapters:
      - {id: ducklake_local, tier: supported, status: pending, owning_item: "T4.23:c5"}  # DuckLake over the local catalog and table_data adapters
      - {id: ducklake, tier: supported, status: implemented, location: scripts/ops_data_portal.py}
    oracle: {kind: adapter, ref: ducklake_local, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: catalog
    required_verbs: [attach_catalog, read_snapshot, commit_snapshot]
    verbs_status: provisional
    adapters:
      - {id: local_file, tier: supported, status: pending, owning_item: "T4.23:c2"}
      - {id: neon_postgres, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: local_file, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: table_data
    required_verbs: [write_data_file, read_data_file, list_data_files, delete_data_file]
    verbs_status: provisional
    adapters:
      - {id: local_directory, tier: supported, status: pending, owning_item: "T4.23:c2"}
      - {id: s3, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: local_directory, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: content_blobs
    required_verbs: [put_blob, get_blob]
    verbs_status: provisional
    adapters:
      - {id: local_directory, tier: supported, status: pending, owning_item: "T4.23:c7"}
      - {id: s3, tier: supported, status: pending, owning_item: rec-4024}
    oracle: {kind: adapter, ref: local_directory, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: orchestration_host
    required_verbs: [start_execution, send_task_success, send_task_failure, send_task_heartbeat]
    verbs_status: provisional
    adapters:
      - {id: local_interpreter, tier: supported, status: pending, owning_item: T4.22}
      - {id: step_functions, tier: supported, status: pending, owning_item: T4.1}
    oracle: {kind: harness, ref: T4.20, status: pending}
    conformance_suite: {status: pending, owning_item: T4.20}
  - id: verdict_plane
    required_verbs: [post_check_run, read_check_runs]
    verbs_status: provisional
    adapters:
      - {id: github_actions, tier: supported, status: implemented, location: .github/workflows/ci.yml}
      - {id: verdict_app, tier: supported, status: pending, owning_item: "T4.2:c9"}
    oracle: null
    oracle_gap: >-
      Decision 184 clause 3 keeps GitHub Actions the verdict plane in all modes (CD.38), and
      Decision 205 clause 2's non-Actions host still posts its verdict as a check run under a
      dedicated verdict App -- both adapters report through the GitHub Checks API, so no
      credential-free local verdict adapter exists to act as oracle. Exempt from Decision 184
      clause 2's local-adapter item while those clauses stand (Decision 212 clause 6); coupling
      row PC-02. Conformance is governed instead by T4.24 c14's suite, run against recorded,
      credential-free Checks-API fixtures (check-run payloads replayed with no token).
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: change_surface
    required_verbs: [open_change, read_verdict, post_review_comment, merge]
    verbs_status: provisional
    adapters:
      - {id: github, tier: supported, status: pending, owning_item: T4.1}
    oracle: null
    oracle_gap: >-
      A bare-git local change surface needs a verdict surface other than the Checks API (Decision
      212 clause 5), which first requires re-deciding Decision 184 clause 3 and Decision 205
      clause 2; exempt from the local-adapter item meanwhile (Decision 212 clause 6). Conformance
      is governed instead by T4.24 c14's suite, run against recorded, credential-free GitHub API
      fixtures for the change-surface verbs (T4.19 c6 names them).
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: secrets
    required_verbs: [get_secret]
    verbs_status: provisional
    adapters:
      - {id: environment, tier: supported, status: pending, owning_item: "T4.24:c2"}
      - {id: aws_secrets_manager, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: environment, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: scheduling
    required_verbs: [register_schedule, remove_schedule]
    verbs_status: provisional
    adapters:
      - {id: local_cron, tier: supported, status: pending, owning_item: "T4.24:c4"}
      - {id: eventbridge, tier: supported, status: implemented, location: terraform/personal/ducklake_maintenance.tf}
    oracle: {kind: adapter, ref: local_cron, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}

coupling_findings:
  - id: PC-01
    ports: [ops_verbs, persona_compute_host]
    location: scripts/ops_portal/writer_transport.py
    description: >-
      The function_url ops_verbs adapter authenticates every call by SigV4 against an AWS_IAM
      Function URL (src/common/ducklake_reader_client.py, scripts/ops_portal/writer_transport.py),
      so its caller must run on a compute host holding an AWS identity. Held by Decision 84 I-1's
      closed reader/writer Function-URL boundary; Decision 200 clauses 1-2's tenancy enforcement
      (tenant_id from the caller's authenticated identity; writer registration verb: rec-4024) is
      a property of this cloud adapter.
    status: accepted
    owning_item: dec-084
  - id: PC-02
    ports: [verdict_plane, change_surface]
    location: dec-184
    description: >-
      Decision 184 clause 3 fixes GitHub Actions as the verdict plane in all modes and Decision 205
      clause 2 makes the verdict a check run read from the Checks API on any host, which presumes
      GitHub as the change surface; no non-GitHub change surface can carry a verdict.
    status: accepted
    owning_item: dec-184
  - id: PC-03
    ports: [persona_compute_host, change_surface]
    location: dec-205
    description: >-
      The github_actions_shell persona_compute_host adapter exists only because a GitHub-originated
      repository event triggers a verdict persona on Actions (Decision 205 clause 1), so it presumes
      change_surface's github adapter; no non-GitHub change surface can drive it.
    status: accepted
    owning_item: dec-205
  - id: PC-04
    ports: [work_item_storage, ops_verbs]
    location: scripts/ops_data_portal.py
    description: >-
      The implemented ducklake work_item_storage adapter (scripts/ops_data_portal.py) reads and
      writes work items only through the function_url ops_verbs adapter, so DuckLake-on-Neon
      work-item storage presumes the cloud ops_verbs transport. Held by Decision 84's Single
      Portal Invariant: every rec write transits the closed ducklake_writer boundary and every
      read the ducklake_reader's named verbs.
    status: accepted
    owning_item: dec-084

structural_assumptions: []
