  - id: T4.1
    tier: T4
    name: Executor Step Functions state machine + per-step Lambda scaffolding + IAM
    intent: |
      Per CD.27, the executor substrate is Step Functions (workflow orchestration) + Lambda Durable
      Functions (agent-persona execution) + Lambda (deterministic glue). T4.1 lands the workflow
      substrate -- the Step Functions state machine for one rec, the deterministic-glue Lambdas
      (pick_rec, prepare_workspace, critique_gate aggregator, file_pr, emit_telemetry), per-Lambda
      IAM execution roles, observability wiring, and the ECS Run Task escape-hatch integration.
      Agent personas (T4.2) and scheduled-agent migration (T4.3) consume this substrate.

      State-machine shape (per CD.27 boundary diagram):
        - pick_rec [Lambda]                          : poll priority queue; ADMISSION PREDICATE gates the return -- admit a rec only when its T3.8 relevance verdict == relevant (CD.36 / Decision 103), automatable == true, and risk is within the current T4.4 autonomy-gate ceiling (Decision 92 ratchet), AND its targets do NOT match Decision 117 boundary_patterns (config/agent/executor/capabilities.yaml); a refused pick emits a typed telemetry event and a boundary_patterns hit re-routes the rec to the human path (Decision 55), never auto-executed; returns rec_id + branch_slug
        - prepare_workspace [Lambda]                 : clone repo, create agent/{slug} branch, set up worktree, return workspace_uri
        - plan_agent [resumable persona (CD.27 P1/P2/P3), T4.2]        : iterative read-code -> LLM -> tool-use -> emit plan; publishes the plan to the warehouse row, which is the SOLE plan artifact -- writing a plan document to S3 as well is considered-and-rejected (the table carries plan_text, so an S3 copy is a second artifact behind a second read path), and with it the {plan_s3_uri, plan_summary} return shape. The node returns IDENTIFIERS ONLY -- (rec_id, revision, ulid-or-hash); no payload crosses the state machine, and an LLM-authored plan summary is a payload, not an identifier
        - Parallel { plan_critic, decision_scout, ... } [resumable persona (CD.27 P1/P2/P3), T4.2]  : critic personas run in parallel
        - critique_gate [Lambda]                     : aggregate parallel critic verdicts; route back to plan_agent on block, forward on pass
        - implement_agent [resumable persona (CD.27 P1/P2/P3), T4.2]   : iterative read-plan -> edit-files -> run-tests -> emit-diff
        - code_review [resumable persona (CD.27 P1/P2/P3), T4.2]       : structured review verdict
        - file_pr [Lambda]                           : idempotent PR creation via gh
        - await_verdict [Lambda, waitForTaskToken]   : wait on the GitHub Actions verdict callback (T4.9a); Step Functions stores correlation ids incl. head SHA
        - merge [Lambda]                             : callback-gated squash-merge (T4.9a) -- PRE_PASS permits merge only when the callback head SHA equals the PR head
        - deploy_dispatch [Lambda, waitForTaskToken]  : dispatch merged-change application to the CD.35 / Decision 92 GitHub-Actions gated-apply pipeline and wait on its server-side convergence-record verdict, exactly as the verify leg waits on a CI verdict (CD.38 sole-runner authority; the executor holds NO apply authority and never runs terraform apply in-cloud). PRECONDITION for running this leg unattended: rec-2523 guard-BLOCK red-convergence-record deadlock (a red record clearable by neither automated path, requiring an out-of-band admin apply) must have a designed exception path -- fixing that deadlock stays with rec-2523, out of scope here
        - emit_telemetry [Lambda]                    : final session-close emission
        - ESCAPE [ECS Run Task synchronous integration] : for deterministic steps that exceed 15 min (e.g. full pytest, large data migration); terraform apply is NOT an in-executor escape-hatch task -- see deploy_dispatch (dispatched to the CD.35 / Decision 92 GitHub-Actions gated-apply pipeline, per CD.38)
    depends_on: [T2.1, T3.2]
    files_in_scope:
      - terraform/personal/executor_step_functions.tf    # new -- state machine + EventBridge trigger
      - terraform/personal/executor_lambdas_iam.tf       # new -- per-Lambda execution roles
      - terraform/personal/executor_observability.tf     # new -- CloudWatch log groups, metrics, alarms
      - src/lambdas/pick_rec/                   # new -- deterministic glue Lambda
      - src/lambdas/prepare_workspace/          # new -- deterministic glue Lambda
      - src/lambdas/critique_gate/              # new -- deterministic glue Lambda
      - src/lambdas/file_pr/                    # new -- deterministic glue Lambda
      - src/lambdas/emit_telemetry/             # new -- deterministic glue Lambda
    exit_criteria:
      - "Step Functions state machine deployable via terraform apply; smoke-test execution succeeds end-to-end with stub agent personas (returning canned outputs from S3 fixtures)"
      - "Each deterministic-glue Lambda has a per-Lambda manifest (per CD.24 / T-1.8) and its own IAM execution role (per CD.10 two-principal model -- PlatformDev-scoped)"
      - "ECS Run Task escape-hatch integration validated: a synthetic 20-minute deterministic task is invoked from the state machine via arn:aws:states:::ecs:runTask.sync and returns successfully"
      - "CloudWatch observability wired: per-Lambda p50/p99 + per-state-machine execution success/failure rate; alarms file rec via log-rec on threshold breach (per T1.9 pattern)"
      - "Concurrency cap = 1 on the state machine initially per Decision 55 RCA-first; raise as autonomy gates A2+ pass per T4.4"
      - "Every waitForTaskToken / verdict-wait state in the state machine carries HeartbeatSeconds and TimeoutSeconds; timeout transitions route to ci-rca (Decision 72), never a silent re-wait -- the executor analogue of the interactive dropped-green-signal backstop"
