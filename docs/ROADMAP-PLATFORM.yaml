  - id: CD.41
    title: Private-dashboard hosting -- Cloudflare Access auth-front with in-AWS signing and a direct-to-AWS data path (invariant-fenced, reusable)
    detail: |
      Extends the 73/83/101 confidential-data boundary with a NARROW, reversible carve-out: a
      private dashboard MAY use Cloudflare Access as its authentication front, PROVIDED the
      architectural invariant holds -- (a) no AWS credential ever rests outside AWS; (b) the
      confidential payload never transits Cloudflare (it flows AWS->browser via an in-AWS-minted,
      <=5-min, single-object presigned GET, or a direct-from-AWS origin); (c) AWS independently
      re-verifies the Cloudflare Access token (dual gate; Cloudflare is UX, not the sole control).
      Any implementation breaking (a)/(b)/(c) -- a Cloudflare Worker holding an AWS key, Cloudflare
      terminating TLS on the payload ("2a"), or the data resting on Cloudflare -- is OUT and needs
      a fresh Decision.

      Fenced on the INVARIANT, not the data type (owner's DRY point): it is ONE reusable
      private-dashboard pattern (tier item T2.51, the cost dashboard, is its first tenant), not a
      cost-only exception that would force a second hosting stack. The precedent therefore cannot
      be cited to justify the unsafe variants for hotter data. The one thing genuinely different
      about catastrophic-consequence data is the cost of a residual
      failure, not the pattern's security; so reuse for such data is permitted under the SAME
      invariant BUT triggers a deliberate hardening review (tighter TTL, IP allowlist, client-bound
      links, or a non-internet-facing front) -- an added defense-in-depth layer on the same
      pattern, a conscious pause rather than an auto-inherited grant.

      Advice-consulted (model:fable) 2026-07-24; kept UNRATIFIED (Decisions 105, 150) -- CD.41 is a
      durable, reversal-relevant commitment (not a deflected class under Decision 150's significance
      bar), correctly routed as a pending CD that ratifies to a numbered Decision when T2.51 is
      built (deferred_post_mvp). The numbered-Decision-now vehicle (Decisions 126/144) is not taken
      because T2.51, its sole tenant, is deferred.
    gates: [T2.51]
    state: pending
    filed_via: pending_log_decision_lambda
    discipline_points:
      - >-
        In-AWS signing only: the presigned URL is minted by an in-account Lambda using its
        execution-role STS creds; the Cloudflare Worker / Access config holds ZERO AWS material.
      - >-
        Two URLs, two protections (do not conflate). The Access-gated Lambda ENDPOINT is JWT
        dual-gated: the Lambda independently validates the Cf-Access-Jwt-Assertion (JWKS signature;
        pin iss = Access team domain + aud; enforce RS256 / reject alg:none; check exp) and rejects
        anything without it, so a leaked endpoint URL is not a bypass. If the endpoint is a Function
        URL with AuthType:NONE, lock its origin to Cloudflare (IP-allowlist / Tunnel / mTLS) as
        defense-in-depth.
      - >-
        The minted presigned S3 URL is a self-authenticating BEARER CAPABILITY -- S3 honours it
        with no Access JWT, and Cloudflare observes it once in the 302 Location header (replayable
        until expiry by any observer). Its ONLY controls are TTL <= 5 min + single-object + no-store
        + Block-Public-Access + a CloudTrail S3 data-event alert on the dashboard prefix -- NOT the
        JWT. The presign Lambda's execution role may s3:GetObject the dashboard prefix ONLY; served
        objects carry Referrer-Policy: no-referrer (+ CSP) to curb Referer leakage.
      - "Cloudflare Access app: single allowed email, short session, Access logging enabled."
      - >-
        Extending the pattern to catastrophic-consequence data (credentials / account
        identifiers / any equivalent high-consequence payload) requires a deliberate hardening review recorded as a
        fresh Decision; this carve-out does NOT auto-grant it.
      - >-
        Reversal: fall back to an AWS-native front (CloudFront + Cognito / Amplify) -- a read-only
        projection, so migration is plumbing with zero data movement. Cites Decisions 73, 83, 101,
        100, 75, 55, 98, 144, 126, 105, 150.

  - id: CD.42
    title: Presentation-layer boundary -- a code-defined human-facing analytical layer is a projection, never a semantic authority
    detail: |
      Scoped to the INTERNAL analytical surface only. Establishes the boundary any human-facing
      analytical presentation layer must hold, independent of which tool wins T2.53's three-way
      comparison (Evidence / Astro+charts / Observable Framework):

      (a) SEMANTIC AUTHORITY STAYS SERVER-SIDE. Business aggregation, join semantics, dataset
      grain, actual-vs-estimated classification, authorized columns, date/cardinality bounds,
      stable ordering, and response schema+version are owned by ducklake_reader named verbs. The
      presentation layer owns only field-to-component mapping, layout, narrative, formatting,
      presentation-safe sort/filter/pivot, and empty/stale/partial/error states. Business semantics
      never live in page files.

      (b) GIT IS AUTHORITATIVE for pages, components, themes, layouts, source declarations and the
      machine-readable visual contract. No browser-authored state is required for normal
      development or production operation. This is the property that distinguishes the code-defined
      route from a managed BI tool (QuickSight), whose running metadata store is authoritative and
      whose export is a projection -- the inverse. That adjudication (Decisions 100/75) is
      re-opened, not settled, by T2.53's measured cost findings.

      (c) NAMED VERBS ONLY. A source adapter invokes registered `named_read` verbs at build time
      and materializes bounded results. No caller SQL crosses the read boundary, and the adapter
      MUST NOT become a second tenant of `query_ops` -- Decision 84 I-3 retains that verb solely for
      the DQ harness and marks it for restriction/retirement, so a durable presentation-layer
      consumer would convert a retiring exception into an unretirable one. Agents continue to
      consume named verbs directly and never scrape rendered output to recover data.

      (d) PRECONDITION OF ADOPT -- Decision 127. Standing Markdown pages whose audience-of-record is
      a human dashboard viewer are the artefact class Decision 127 forbids, enforced repo-wide by
      validate_prose_allowlist. A scoped amendment must be argued ON ITS OWN GROUNDS; the Decision
      101(c) marketing/** carve-out does NOT transfer, because that exception rests on one-way
      downstream-ness (never fed back into agent context) and an internal analytical dashboard
      exists precisely to inform how the operator directs agents. "The amendment is unobtainable"
      is a legitimate REJECT outcome for the whole class of code-defined Markdown dashboards, not
      just for one tool.

      (e) DATA-BEARING ARTIFACT. The build output is treated as data. A deterministic guard (a
      registered validate.py check or a never-commit extension per the Decision 104 registry
      pattern) -- not a .gitignore convention -- asserts no build artifact is tracked, because this
      repository is PUBLIC and a materialized ops-table extract is definitionally the "export of
      operational data" Decision 111/CD.20 forbids on the public surface. A failed data refresh
      never publishes false zeroes and never replaces the last known-good artifact (Decisions 55,
      62/CD.12).

      SCOPE FENCE: CD.42 does NOT amend Decision 101(e) -- Astro + Starlight on Cloudflare Pages
      remains the ratified stack for the public marketing surface regardless of T2.53's verdict.
      CD.42 does not authorise a presentation layer for transactional or operational-control
      interfaces; those are out of scope and need a fresh Decision.

      Kept UNRATIFIED per Decisions 105/150: this is a durable, reversal-relevant commitment
      (clears the significance bar) but its sole tenant T2.53 is deferred_post_mvp, so it ratifies
      to a numbered Decision on the proof-of-concept verdict (adopt / constrain / reject), carrying
      the winning tool name and reversal conditions. Design rationale:
      docs/plans/reports/REPORT-evidence-dashboarding-poc.md.
    gates: [T2.53]
    state: pending
    filed_via: pending_log_decision_lambda
    discipline_points:
      - >-
        Source adapters bind to `named_read` verbs ONLY. Not `query_ops` (Decision 84 I-3 retains it
        for the DQ harness and marks it for retirement; it already has two live call sites and a
        caller-controlled FROM target reaching _history and other ops_* tables), and not
        `read_ops_current` (a structural {column,value} filter satisfies the LETTER of "no caller
        SQL" while bypassing named verbs entirely). The invariant is NAMED VERBS ONLY, not "no SQL"
        -- stating it the weaker way leaves a loophole a durable consumer will eventually take.
        Build-time reads honour the Decision 88 egress budget -- never re-query data already in the
        local read cache; reuse warm connections.
      - >-
        Custom components are exceptional and require evidence that built-in components or chart
        configuration are insufficient. Extensive custom components mean the tool has become a
        bespoke frontend framework, which is a REJECT signal, not an implementation detail.
      - >-
        The Node/toolchain dependency surface is isolated and pinned, and upstream project liveness
        is a GATING check at adoption time (publish cadence, repository commit activity, security
        advisory responsiveness), re-verified rather than inherited from the scoping report.
      - >-
        Any upstream build-time telemetry is explicitly disabled AND the disablement is verified as
        an exit criterion (confidential-data boundary, Decisions 73/83/101).
      - >-
        Visual accessibility and responsive behaviour are programmatically checked. Mechanizable
        gates (strict build, schema match, zero console errors, axe violations, viewport overflow)
        are separated from aesthetic judgement, which stays with the human -- a passing check suite
        is not a claim that the dashboard is good.
      - >-
        Reversal: the presentation layer is a read-only projection over governed datasets, so
        replacing it (or removing the UI entirely and reverting to structured agent reports) is
        plumbing with zero data movement and no change to the named-verb contracts. Cites Decisions
        84, 86, 88, 93, 100, 101, 104, 105, 111, 127, 137, 150, 55, 62, 75, 87.

  - id: CD.43
    title: Executor workspace backing-store selection criteria (ESB-01) -- store selection deferred to the CD.27 layer-2 spike
    detail: |
      Names the criteria (W1-W8) against which the executor's workspace backing store is selected,
      per audit finding ESB-01. This CD selects NO store: workspace_store_selection.status stays
      criteria_only and selected_store stays the literal TBD_at_CD.43_ratification until
      ratification. Criteria precede the choice deliberately -- the store choice is itself a
      portability commitment the CD.27 layer-2 spike (wave 5) should inform, not follow; fixing the
      store first and rationalizing the criteria after would make the criteria decorative rather
      than governing.

      Ratifies alongside that spike: the ratifying plan selects a store from option_set against
      W1-W8, records the choice in selected_store, and flips this CD to the canonical ratified
      shape per docs/contracts/candidate-decision-ratification.yaml:29-36 -- state: ratified,
      ratified_as: dec-NNN, AND filed_via: ops_decisions:dec-NNN (same NNN in both fields; filed_via
      alone is not the shape R1/R2 require). Gates T4.1 (which names the mechanism
      and criteria per ESB-01's literal acceptance) and T4.2 (whose exit criterion c1 requires CD.27
      resume property P2, workspace continuity, which is unachievable without a backing store).
    gates: [T4.1, T4.2]
    state: pending
    filed_via: pending_log_decision_lambda
    discipline_points:
      - workspace_store_selection:
          status: criteria_only
          selected_store: TBD_at_CD.43_ratification
          resolved_by: >-
            The CD.27 layer-2 substrate spike (wave 5 of the ESB-01 remediation run), which selects
            the store and ratifies this CD in the same act.
          option_set:
            - efs_mount
            - s3_express_one_zone
            - fsx_managed_filesystem
            - lambda_ephemeral_tmp_10gb
            - s3_sync
            - container_local_disk
            - git_as_store_commit_at_step_boundaries
          options_considered_and_rejected:
            - option: mountpoint_for_s3
              reason: >-
                AWS-provided CLIENT-side FUSE tooling over S3, not a managed-service primitive --
                under W8 it scores as a substitute, not a primitive, and it needs FUSE in the
                execution environment, which forecloses the Lambda-class substrates under W1.
                Evaluated as a variant of s3_sync rather than as a distinct managed option.
          coverage_cases:
            - cross_invocation_persistence
            - inter_persona_handoff
            - persona_to_ecs_task_handoff
          selection_criteria:
            W1: >-
              Substrate portability across CD.27's pinned layer-2 candidate set -- durable_functions,
              sfn_over_stateless_workers, self_checkpointed_lambda_dynamodb, long_running_container,
              and hosted_cli_runner. State plainly, for each of these five substrates, whether the
              candidate backing store is reachable from it, naming any substrate it forecloses.
            W2: >-
              Foreclosure disclosure. Choosing a backing store that silently eliminates a CD.27
              candidate substrate must be recorded as an explicit decision, not a side effect --
              for example, EFS is structurally unreachable from GitHub-hosted runners, so an
              EFS-backed store would silently eliminate hosted_cli_runner unless that elimination is
              stated outright and argued.
            W3: >-
              Standing cost basis, RECOMPUTED at ratification time rather than quoted from this
              document. Name the rate source (the AWS price list for the region pinned at
              terraform/personal/variables.tf) and show the arithmetic performed against the
              then-published rate. Never state a cost figure here -- a criteria paper that ships a
              number ships a magic ceiling that is stale the day it lands.
            W4: >-
              Egress-profile validity. Any NAT or VPC-egress reachability or cost claim must be
              validated against the production LiteLLM external-call profile (CD.28's inference
              transport), not a spike measurement taken with those calls mocked -- restating the
              egress assumption is a condition of using any measurement gathered under a mocked
              call profile.
            W5: >-
              Re-materialization cost, carrying both a byte term (total bytes moved to reconstruct
              the workspace after an interruption) and an object-count term (total objects or files
              touched) -- a store's per-request pricing can dominate for a many-small-files tree
              even when its byte-cost term looks small.
            W6: >-
              Scale basis. State the on-disk size of the dependency environment the workspace must
              hold, together with the measurement command run and the date it was run, never a
              stale or copied figure.
            W7: >-
              Coverage of every case in coverage_cases -- cross_invocation_persistence,
              inter_persona_handoff, and persona_to_ecs_task_handoff -- rather than only the case
              that is easiest to argue for the candidate store.
            W8: >-
              Managed-primitive preference, per Decision 100. For each candidate store, state
              whether a managed AWS primitive already supplies the capability. A candidate that
              substitutes custom scripting or vendored client tooling for a managed primitive must
              argue that substitution explicitly against Decision 100, naming the primitive it
              replaces and the hand-roll cost incurred -- portability alone does not satisfy this
              criterion.
      - >-
        Criteria-only discipline. This CD's authority is bounded to the workspace_store_selection
        block above -- no field on this CD names a chosen backing store, and no dependent plan may
        cite this CD as authorizing a selection. The store is selected by a separate ratifying act
        (the CD.27 layer-2 spike, wave 5), which records the choice in selected_store and flips
        this CD's state to ratified.

  - id: CD.44
    title: Two-plane executor recorded as a layer-2 CANDIDATE -- orchestration keeps identifiers only, the compute plane is the open question, and the warehouse row is the sole plan artifact (selects nothing)
    detail: |
      Records the operator's Two-Plane Executor design as a CANDIDATE arm for the CD.27 layer-2
      substrate. It SELECTS NOTHING. The resolving instrument is the comparative spike owned by
      T4.15; CD.27's incumbent stands until that spike rules, and CD.43's workspace store stays
      TBD_at_CD.43_ratification.

      SHAPE OF THE CANDIDATE. The orchestration plane keeps the state machine and carries
      IDENTIFIERS ONLY -- rec_id, revision, head SHA, task token. The compute plane runs every
      persona and every verification gate, all LiteLLM in-process, with no persona shelling out to
      a hosted CLI. The plan artifact lives in neither plane -- it is a warehouse row that every
      downstream persona fetches by named verb. The dispatch-and-wait motif is not new: T4.1's
      contracted node list already crosses this boundary twice, at await_verdict (waiting on a CI
      verdict callback) and at deploy_dispatch (dispatching merged-change application to the
      gated-apply pipeline). This candidate extends the same motif to the five personas and changes
      nothing else.

      GOV-1 -- does the candidate satisfy CD.27's ESB-04 "MANAGED orchestration primitive"
      precondition? RULED HERE, by COMPUTE RECLASSIFICATION rather than by the falsifiable claim
      that the compute plane "performs no orchestration". The narrow claim, which is what this CD
      asserts: under this candidate the compute plane holds NO DURABLE STATE across persona
      invocations, mints NO CORRELATION IDENTIFIERS of its own, and carries NO RETRY OR ROUTING
      POLICY BETWEEN PERSONAS -- all three stay on the orchestration plane, which is the managed
      primitive ESB-04 is about, and which Decision 39 already ratified. What moves is COMPUTE
      PLACEMENT, not the orchestrator. Moving the orchestrator would force a Decision 39
      supersession; moving only the compute does not. The clause itself is left verbatim on CD.27
      and this ruling is a reading of it, which is why the reading is recorded here and the
      ratifying record T4.15 produces has to carry it forward.

      GOV-2 -- is this the pinned hosted_cli_runner candidate re-specified, or a sixth candidate?
      STATED, as the audit requires it to be stated rather than left implicit. It is the PINNED
      candidate RE-SPECIFIED, not a new one. The pinned entry bundled the runner with a hosted CLI
      transport; this candidate keeps the runner and drops the CLI, calling LiteLLM in-process per
      dec-122, so the admissible substrate set is unchanged and CD.27 does not widen it. An
      unstated reframing would read as a set violation, so it is stated in the first paragraph of
      any ratifying plan as well as here.

      MECH-1 -- the orchestration-to-compute dispatch credential. There is no native integration,
      so it is either a function calling the compute plane's API or an http:invoke task through a
      managed connection; either way a long-lived credential must live on the AWS side with its own
      rotation story, alongside the existing one, on a PUBLIC repository. CONSIDERED-AND-REJECTED
      for this role: Step Functions Activities, whose poll-based worker model needs a long-lived
      poller process on the compute plane -- exactly the always-on component this candidate exists
      to avoid, and it would reintroduce a durable-state holder on the plane the GOV-1 ruling above
      says holds none. T4.15 owns resolving the credential and must exercise it UNSTUBBED.

      OPS-1 -- concurrency grouping caps the executor's own work; it does not PRIORITISE CI.
      A concurrency group is a self-imposed ceiling on your own workflows and reserves no slots
      from the shared pool, so protecting CI means capping agent work well below the pool size so
      headroom survives. Worse, a queued run that does not cancel in progress holds its task token
      while it waits, so queue depth converts directly into token-timeout pressure. Cap
      deliberately, and set token timeouts against worst-case queue depth rather than expected
      runtime.

      OPS-2 -- every persona invocation is a COLD START, and dec-122 mandates Tier-2 credential
      validation at every cold start (key-shape probe plus a usage query asserting remaining pool).
      On a long-lived process that is once per session; under this candidate it is once per persona
      run, plus once per fanned-out scout if scouts count. Either the rate and latency are
      acceptable and T4.15 measures them, or "cold start" needs redefining for this substrate.
      Nobody has checked, and this CD does not pretend otherwise.

      THE WAREHOUSE ROW IS THE SOLE PLAN ARTIFACT, and this is a DELIBERATELY SELECTIVE
      transcription of the design rather than a faithful one. The design's plan-publication stage
      writes the plan document to S3 AND the queryable projection to the plans table. That dual
      write is CONSIDERED-AND-REJECTED: the plans table already carries plan_text, so the plan body
      is in the row, and an S3 document would be a second copy behind a second read path with no
      reconciliation story. For the same reason the orchestration plane returns IDENTIFIERS ONLY
      and never an LLM-authored plan summary -- content crossing the plane is not an identifier and
      is not deterministic on re-fetch, so it is not a payload channel.

      CRITIQUE AUTHORSHIP. A critique verdict is written by the CRITIC or by the GATE, never by the
      critiqued persona. critique_history is a column on the plan row whose only write path today
      takes a whole plan document -- the planner's path -- so an unqualified encoding forces either
      a critic that can rewrite the plan it critiqued or a planner that records the verdict against
      itself, which is the pair Decision 87 clause 5 exists to forbid. The content pin's hash is
      therefore scoped to the plan BODY EXCLUDING critique_history, because a pin over the whole
      row is invalidated by every critique append and would fail closed on the loop's normal path.
      Naming the boundary is in scope here; BUILDING the split verb routes to T4.5/T4.6, and the
      tier-item form of this boundary is carried by T4.16.

      THE PLANS-TABLE NAME IS RULED, not left open. Decision 87 clause 4 as amended names ONE plans
      table and it is ops_execution_plans -- the implemented name, carried on 278 matching lines
      across 80 files, 32 of them load-bearing, and the only one with any enforcement surface
      (terraform, field_semantics, .importlinter, the verification and data-quality registries, the
      portal and sync modules, and 12 test modules), against 30 prose-only lines across 8 files for
      the rejected alternative name, none of them load-bearing. The originally-proposed two-table
      split is retired-before-built. Recording it here discharges nothing on its own -- the tracked
      home is T4.16's exit criterion, because that is the item that binds a physical name into the
      read registry.
    gates: [T4.15]
    state: pending
    filed_via: pending_log_decision_lambda
    discipline_points:
      - The candidate selects nothing. Any plan citing this CD as authorizing a layer-2 substrate is misreading it; selection is T4.15's act, against CD.27's P1/P2/P3 and CD.43's W1-W8.
      - Candidate-specific MECHANISM stays in this CD body and out of lifecycle-tracked roadmap fields, which carry CD.27's substrate-neutral P1/P2/P3 property language instead. Purging the incumbent's vocabulary from those fields while admitting the candidate's would make a ruling FOR the incumbent cost a re-sweep and a ruling for the candidate cost nothing -- switching-cost bias, and ESB-05 with the sign flipped.
      - >-
        Out-of-file repairs this encoding surfaced and filed rather than fixed inline, referenced by
        id so none of them lives only in a paragraph. rec-3213 -- the retired two-table plans split
        still stands in Decision 136's Reversal-conditions and Related lines and in
        exit-criteria-ledger.yaml, outside the amendment's scope. rec-3214 -- the planning skill
        still asserts the pre-existing routing-row count, and decision-entry.yaml names that skill
        as the significance block's primary consumer, which makes it the highest-priority member of
        the set. rec-3215 -- the same count is asserted in AGENTS.md and in Decisions 150 and 167,
        miscounting in both directions. rec-3216 -- AGENTS.md routes the plans table to the wrong
        backend (DATA-4), also carried as a T4.16 exit criterion. rec-3217 -- a three-way skew
        between the ops_recommendations contract's status vocabulary and the portal's writable set,
        which is why a deliberate deferral routes to declined or to the roadmap and never to a
        deferred status. rec-3218 -- validate_executor_boundary is a no-op in CI and never inspects
        a diff, which is the standing half of the merge-node guard T4.16 owns. rec-3219 -- T4.8,
        T4.9a and T3.10 still declare files inside the frozen Life-1 executor tree.

