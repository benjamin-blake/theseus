      shipped at T0.9 (complete 2026-05-19) -- AGENTS.md is canonical, CLAUDE.md is the
      '@AGENTS.md' pointer, validate.py enforces parity. Retained for traceability.
      Original notes: symlinks are awkward on Windows clones; duplicate-with-CI is more verbose
      but portable. T2.11b consumes the already-created artefact.
  - id: OQ.2
    question: Pre-commit bundling scope — just branch gates, or also ruff / EOF / secrets-scan
    resolution_tier: T0.10
    status: resolved
    resolution_ref: "T0.10"
    notes: |
      RESOLVED (status reconciled 2026-06-09, audit F-020): T0.10 shipped 2026-05-19 with the
      bundling decision made in .pre-commit-config.yaml -- branch gates (no-commit-to-branch)
      plus detect-secrets + sensitive-identifier blocking; ruff not bundled (lives in --pre).
      Retained for traceability. Original notes: bundling is convenient but enlarges the
      migration's diff; branch gates only is the minimum.
  - id: OQ.3
    question: REDACTED-VPN-in-container — include in first iteration, or defer until concrete need
    resolution_tier: T2.6
    notes: Out of scope for current migration. File as candidate decision when a need surfaces.
  - id: OQ.4
    question: GitHub OIDC vs personal-account precedence for IAM role assumption
    resolution_tier: T0.3
    status: resolved
    resolution_ref: "CD.26"
    notes: |
      RESOLVED (status reconciled 2026-06-09, audit F-020): both halves shipped -- Pattern B
      (static-key + chained AssumeRole, CD.26) at T0.3 (complete 2026-05-29) for unattended
      agents, and GitHub OIDC federation at T2.10 (complete 2026-05-28, CD.21) for CI.
      Retained for traceability. Original notes: OIDC against company-aws-profile may be
      blocked by corporate IAM; breakglass-user console-login for human ops; Identity Center
      not used for the personal account per CD.26.
  - id: OQ.6
    question: Drift detector cadence and threshold tuning
    resolution_tier: T1.6
    notes: Hourly is starting point; tune to false-positive rate observed.

  - id: OQ.7
    question: Large-scan relief valve after DuckLake adoption -- no external-engine read path exists
    resolution_tier: T2.19
    status: resolved
    resolution_ref: "CD.34"
    notes: |
      DuckLake v1.0 exposes no metadata export and no external-engine reader: no second query engine can
      read DuckLake tables directly. ducklake_add_data_files() is import-only AND dangerous (file ownership
      transfers to DuckLake; compaction can delete registered files). The CD.15 large-scan relief valve
      has no export-based mitigation today. Options: (a) live without a second engine
      for ops/telemetry (accept DuckDB-only ad-hoc reads, adding compute if needed);
      (b) maintain a parallel mirror in an externally-readable format (write amplification, complexity);
      (c) wait for DuckLake to add an export path in a future version. Resolve at T2.19 / FP-B.

      Resolved direction (CD.33, pending Decision 81): option (a) -- no second engine.
      The closed reader/writer boundary is the design goal; ad-hoc scans live behind ducklake_reader (scale
      reader compute if memory binds), not a parallel mirror. Break-glass = the audited PlatformAdmin
      principal (expanded to catalog+S3 read); catalog DR = daily PITR export to a dedicated S3 bucket.
      Enacted at T2.19.

      Re-resolved (CD.34): break-glass = the Neon catalog credential (Secrets Manager) + S3 read; catalog DR =
      a daily pg_dump to a dedicated versioned S3 bucket (30-day retention, >25h freshness alarm). Option (a)
      (no second engine) is unchanged.

  - id: OQ.8
    question: RDS catalog backend -- sizing, RDS Proxy, and credential mechanism
    resolution_tier: T2.16
    status: resolved
    resolution_ref: "CD.34"
    # RESOLVED-PENDING-RATIFICATION (reconciled 2026-06-09, audit F-020): work shipped (T2.16
    # complete 2026-06-03; T2.16b Neon migration complete 2026-06-05); the re-resolution below is
    # the operative answer and formalises when CD.34 ratifies. Retained open-in-form until then.
    notes: |
      Catalog backend confirmed as standard RDS PostgreSQL (Aurora DSQL dropped as unvalidated against
      DuckLake's PG12+/SQL-92/PK-based-OCC contract). Sizing: db.t4g.micro single-AZ gp3 is the proposed
      starting point (~$12-15/mo). RDS Proxy is deferrable -- adds ~$10-12/mo and NAT complexity; worth it
      only if Lambda cold-start connection churn causes catalog OCC collisions. Credential: IAM auth vs
      Secrets Manager -- IAM auth is preferred (no rotation burden, per-role scoping) but needs validation
      against the DuckLake ATTACH connection string format. Resolve at T2.16 implementation.

      Re-resolved (CD.34): backend = Neon serverless Postgres (not RDS); RDS Proxy -> Neon's built-in pooler
      (direct endpoint for catalog writes; app-side pool if churn exceeds the OCC budget -- T2.16b churn gate);
      credential = Secrets Manager DSN. The "IAM-auth-preferred" note is moot (IAM DB auth is N/A against a
      non-AWS endpoint). Realized saving ~$12-15/mo; the deferrable RDS Proxy was never provisioned.

  - id: OQ.9
    question: Catalog durability, DR strategy, and SPOF mitigation
    resolution_tier: T2.16
    status: resolved
    resolution_ref: "CD.34"
    # RESOLVED-PENDING-RATIFICATION (reconciled 2026-06-09, audit F-020): the CD.34 re-resolution
    # below is shipped (daily pg_dump DR + freshness alarm live per T2.18 FP-B; tested restore at
    # T2.16b) and formalises when CD.34 ratifies. The pg_restore production-shaped drill is the
    # T2.26 start gate (rec-2113).
    notes: |
      The catalog is the lakehouse single point of failure: snapshots are catalog rows; un-flushed inlined
      data (threshold 10 rows default) lives ONLY in the catalog -- not in S3 -- until flushed. RDS PITR
      is the baseline DR mechanism. Questions: (a) backup cadence (default daily PITR; shorter window
      possible via automated backup interval); (b) what happens to in-flight writes if the catalog is
      unavailable (DuckLake hard-fails; no graceful degradation); (c) cross-AZ failover cost vs current
      single-AZ. Ties T2.16 (RDS AZ posture is an implementation choice within RDS catalog provisioning;
      T2.8 covers S3/DynamoDB DR posture, not RDS). Resolve at T2.16; revisit at T2.19.

      Re-resolved (CD.34): on Neon free tier (~6h PITR vs RDS 7-day continuous), DR baseline = a mandatory
      daily pg_dump to a versioned S3 bucket (30-day retention, >25h freshness alarm) + a tested restore
      BEFORE any production write (T2.16b). Catastrophic-case RPO ~24h (daily cadence); intra-6h recovery via
      Neon PITR. Inlining disabled for ALL tables so nothing is catalog-only-durable. SPOF property unchanged;
      the mitigation is the independent backup, not the provider.

  - id: OQ.10
    question: OCC writer-concurrency enforcement -- reserved-concurrency vs SQS FIFO vs OCC retry
    resolution_tier: T2.19
    status: resolved
    resolution_ref: "CD.33"
    notes: |
      DuckLake is OCC + snapshot-isolation: even single-writer Lambda overlap can collide on snapshot_id,
      and DDL / ALTER-table writes hard-abort on conflict (no retry in DuckLake itself). Options:
      (a) Lambda reserved-concurrency=1 (simplest; serialises all writes; reduces throughput);
      (b) SQS FIFO queue in front of the writer Lambda (serialises at the queue; decouples caller latency
          from write latency; adds SQS cost + infra);
      (c) Application-level OCC retry in the writer Lambda (retry on conflict; only safe if the write is
          idempotent or the conflict detection is precise). Resolve at T2.19 / FP-B; document the chosen
      mechanism in the DuckLake writer Lambda design.

      Resolved direction (CD.33, pending Decision 81): option (c) -- concurrent writers + bounded
      application-level OCC retry (backoff+jitter, loud-fail on exhaustion) in ducklake_writer (ops writes are
      idempotent SCD2 appends keyed by the monotonic ULID history PK, minted once and reused across retries);
      ducklake_maintenance runs as a singleton. NOT reserved-concurrency=1, NOT SQS FIFO. Enacted at T2.19.

  - id: OQ.11
    question: Inlining flush policy -- threshold, flush timing, and catalog-as-durability acceptance
    resolution_tier: T2.18
    status: resolved
    resolution_ref: "CD.34"
    # RESOLVED-PENDING-ENACTMENT (reconciled 2026-06-09, audit F-020): direction decided
    # (inlined_rows=0 for ALL tables per the CD.34 re-resolution below); enactment completes with
    # T2.18 (in_progress) and ratification with CD.34.
    notes: |
      DuckLake default inlining threshold is 10 rows. Un-flushed inlined data is durable only in the
      catalog (RDS), not in S3. Options: (a) flush-on-write (call flush_inlined_data after every write;
      eliminates catalog-only durability window; adds latency); (b) scheduled flush via T2.18 maintenance
      pipeline (accept that the catalog holds uncommitted S3 data between maintenance cycles; rely on RDS
      PITR for durability); (c) raise the inlining threshold to 0 (disable inlining; all data lands in S3
      immediately; catalog holds only metadata). Trade-off: flush-on-write is safest but adds per-write
      latency; option (c) loses the inlining optimisation for small writes. Resolve at T2.19 / FP-B.

      Resolved direction (CD.33, pending Decision 81): option (c) -- inlining DISABLED (inlined_rows=0) for
      governance tables; writes land in S3 immediately (no catalog-only durability window); small files
      compacted by a daily non-destructive merge_adjacent_files, with destructive GC on a separate guarded
      cadence. Per-table: telemetry may retain inlining. Supersedes the v1 option-(b) direction.
      Enacted at T2.18.

      Re-resolved (CD.34): inlining is DISABLED for ALL tables INCLUDING telemetry (inlined_rows=0) -- this
      SUPERSEDES the "telemetry may retain inlining" carve-out above, because on Neon's ~6h free-tier PITR no
      table may be catalog-only-durable. High-write-rate tables get a higher-frequency merge to absorb the
      small-file load (T2.18 co-tunes the GC circuit breaker). Enacted at T2.18.

  - id: OQ.12
    question: DuckLake version and DuckDB upgrade policy -- lockstep constraint + clone-rehearsal gate
    resolution_tier: T2.17
    status: resolved
    resolution_ref: "PLAN-oq12-clone-rehearsal-lambda"
    notes: |
      DuckLake v1.0 is lockstep with the DuckDB version pinned in config/lambda/ducklake/version.yaml (SSOT,
      Decision 99). Currently: DuckDB 1.5.4 (bumped from 1.5.3 by PLAN-duckdb-pin-bump-1-5-4, 2026-06-26).
      The catalog schema, the DuckLake extension, and DuckDB must all upgrade together. There is no in-place
      catalog migration tooling across version bumps. Options for upgrade path: (a) clone-rehearsal gate --
      clone the catalog to a staging schema, upgrade DuckLake + DuckDB there, run the full maintenance cycle,
      confirm data integrity, then promote; (b) blue/green catalog -- provision a new catalog alongside the old
      one, replay writes to both during the cutover window, then retire the old catalog.
      The version SSOT (config/lambda/ducklake/version.yaml) was established at PLAN-duckdb-pin-bump-1-5-4;
      the upgrade policy is documented in docs/runbooks/ducklake-catalog-operations.md (OQ.12).
      Clone-rehearsal gate implemented as a CC-web-compatible canary Lambda path (--canary-rehearsal) by
      PLAN-oq12-clone-rehearsal-lambda (2026-06-26): ephemeral candidate-layer canaries + scratch Neon catalog,
      no TCP/5432 required. DUCKLAKE_ALLOW_DIRECT_GATE=1 opt-in retains direct-gate for privileged hosts.

  - id: OQ.13
    question: NS.1 generalisation -- name one specific table format, or "S3 + open table format"?
    resolution_tier: CD.31
    status: resolved
    resolution_ref: "CD.31"
    notes: |
      NS.1 originally named one specific table format. Under DuckLake adoption the operational tables
      use DuckLake. Options: (a) generalise NS.1 to "S3 + open table format" (format-agnostic);
      (b) retain the named format and treat DuckLake as an implementation detail beneath the NS.1 engine
      principle (defensible since NS.1 governs compute-swappability, not the specific table format).
      CD.23 precedent: NS tensions are resolved via a pending CD. Resolved as (a) at CD.31 ratification
      (Decision 78) via the log-decision path.

  - id: OQ.14
    question: Catalog multi-tenancy -- shared ops-RDS-schema vs dedicated instance vs per-env catalog
    resolution_tier: FP-C
    notes: |
      The ops catalog is provisioned in its own schema (T2.16) for clean separability. Any future second
      catalog (FP-C assessment) raises a multi-tenancy question: (a) shared instance, separate schemas
      (lowest cost; coupling risk); (b) a dedicated larger instance for the second catalog (cleaner
      isolation; higher cost); (c) per-environment catalog (separate instance per E.env.2 environment --
      dev/staging/prod -- adds operational complexity).
      Deferred to FP-C after the ops catalog validates the approach at billions-of-rows scale. The ops
      catalog schema provisioned in T2.16 is designed for clean separability to support any of these paths.

      Note (CD.34): on Neon the multi-tenancy primitives re-map from "shared schema vs dedicated
      instance" to "shared Neon project + separate databases" vs "separate Neon projects per env" (Neon
      branching fits per-env catalogs). The question stays open (FP-C); only the option wording updates.

  - id: OQ.15
    question: Agent verb surface shape -- extend the ducklake_writer/reader verb sets, or separate verb Lambdas fronting them?
    resolution_tier: T0.6
    status: resolved
    resolution_ref: "Decision 91"
    notes: |
      Opened 2026-06-09 (audit F-008 integration). CD.33 committed the writer/reader/maintenance
      path split + closed boundary and explicitly left the verb surface extensible; CD.10's
      six-Lambda enumeration was illustrative. For cut-over tables (recs today; the T2.26 set
      later) the transport MUST be the closed boundary either way (Decision 81 cl.7). Options:
      (a) extend ducklake_writer/ducklake_reader with the agent-facing verbs (log_rec, update_rec,
      query verbs) -- fewer Lambdas, verb logic co-located with the schema gate; (b) thin verb
      Lambdas that validate payloads and call through the writer/reader Function URLs -- cleaner
      CD.10 two-principal separation and per-verb SLOs (T1.9), at the cost of a hop. Resolve at
      T0.6 plan time; the choice shapes T0.7a/c and T1.1-T1.3. Either resolution preserves the
      closed boundary and the CD.10 PlatformDev/PlatformAdmin allow-list semantics.

      Resolved (a): Decision 91 (2026-06-18) ratifies option (a) as the shipped architecture per
      Decision 81 cl.2 (extensible verb surface) and Decision 84 I-3 (named-verb closed boundary).
      This is a ratification of shipped reality, not a fresh design pick: scripts/ops_data_portal.py
      already routes file_rec->write_ops/file_ops, update_rec->update_ops, file_decision->write_ops
      on ducklake_writer; reads use the NAMED_READS registry (src/common/ducklake_scd2_schema.py)
      via ducklake_reader.named_read. Function-URL+AWS_IAM per terraform/personal/ducklake_lambdas.tf;
      PlatformDev/PlatformAdmin invoke via DuckLakeInvokeRuntime (platform_roles.tf:142-152 +
      AdminOps). CD.10's two-principal allow-list is RETAINED; the six-Lambda enumeration is
      superseded per Decision 81 cl.2 + Decision 84. T0.6 is closed as realized-via-supersession
      by the generalized named-verb DuckLake boundary.

