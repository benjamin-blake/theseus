  - id: T2.29
    tier: T2
    name: ops_recommendations portal field-derivation correctness (no schema change)
    intent: |
      First implementation slice of the ops-recommendations-field-semantics work (planning session
      2026-06-12). Closes the "semantics captured but never calculated/enforced" gaps that do NOT require a
      column-type change, building to the T0.12.5-ratified derivation blocks:
      (1) `priority` becomes an OPTIONAL input with a source-informed default applied at write time and NOT
      NULL after derivation (mirrors risk/automatable; resolves the original required-vs-derived question per
      T0.12.5). Acyclicity verified 2026-06-12: risk + automatable derive solely from file + effort and never
      read priority (ops_data_portal.py compute_risk/compute_automatable/_derive_computed_fields), so deriving
      priority is acyclic -- the original circular-dependency concern no longer applies; an acyclicity
      invariant is recorded in the contract so a future change cannot reintroduce it. Today priority is a
      mandatory hand-typed string and consumers compensate via batch.py:130 r.get("priority","Medium");
      (2) `automatable` recompute job + one-off backfill triggered on a capabilities.yaml maturity_ceiling
      change -- today it is computed once at write time and never refreshed; meaning preserved per Decision 44
      / Decision 73 cl.6 (recompute only, no merge-mode / semantic drift);
      (3) `risk` AND `automatable` offline-degradation fidelity -- both call _compute_risk_score, which
      silently degrades to low when radon / coverage.xml are absent (C->1.0, M->0.1); make BOTH loud-fail or
      queue-for-recompute instead of persisting a false low-risk / false-automatable value;
      (4) write-time validator gap: the `title` "min 10 chars" semantics documented in ops.yaml:53 is FICTION
      -- the title column carries only a not_null test and _load_write_time_validators has no min_length
      branch. Add a NEW min_length validator-type handler (a registry-mechanism extension, not just config)
      and correct the false ops.yaml claim;
      (5) repoint get_rec_write_guidance() at the new SSOT (rec.py Annotated / Class A contract) so Tier A
      precision-context injection no longer sources from the retiring ops.yaml (Decision 66);
      (6) MIGRATE the write-time validator registry: _load_write_time_validators (ops_data_portal.py:372) is a
      LIVE runtime ops.yaml consumer that BUILDS enforcement from tests[].write_time -- moving semantics off
      ops.yaml while the portal still reads it for enforcement is exactly the drift this work warns against.
      Repoint it to the Annotated SSOT, or explicitly designate it the last ops.yaml runtime reader with T1.6
      as retirement owner;
      (7) reconcile config/lambda/ducklake/field_semantics.yaml so risk + automatable are marked derived, not
      role:input.
      New/changed field semantics land in src/schemas/rec.py Annotated (the future SSOT), NOT in ops.yaml
      (retiring via T1.6); the T0.12 drift detector covers the coexistence window. V3 only if a ducklake
      writer/reader artifact changes (per Decision 79); otherwise V2.
