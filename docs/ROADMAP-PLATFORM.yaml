    files_in_scope:
      - scripts/ops_data_portal.py
      - src/schemas/rec.py
      - config/lambda/ducklake/field_semantics.yaml
      - scripts/executor/rec_write_guidance.py
      - config/agent/executor/capabilities.yaml
      - scripts/validate.py
      - tests/test_ops_data_portal.py
      - tests/test_ops_data_portal_validators.py
    exit_criteria:
      - "priority is optional input with a source-informed default applied at portal write time (implementing the concrete source->priority mapping ratified in T0.12.5), NOT NULL after derivation; acyclicity preserved (priority derivation does not feed risk/automatable/effort); covered by tests; correctness no longer relies on the batch.py r.get(...,'Medium') fallback"
