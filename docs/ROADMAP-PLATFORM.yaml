          exactly where OE-08's 5-wide scout swarms sit. If ever revisited: eu-west-1 restores
          both escape hatches (the region trade was rejected for data-lake and Neon co-location
          in London); StartBuild's buildspecOverride/serviceRoleOverride/imageOverride are a
          lateral-movement surface AWS itself flags, needing condition keys.
      agentcore_managed_runtime:
        envelope: "~13"
        assessment: "ASSESSED, VIABLE BUT UNJUSTIFIED at current scale"
        in_pinned_candidate_set: false
        provenance_class: published_pricing_page_unqualified
        region: not_region_qualified
        region_caveat: >-
          AWS publishes no eu-west-2 price list for Bedrock AgentCore Runtime while runtime
          microVMs are GA in eu-west-2; the published rate is region-unqualified.
        rate_basis: "AWS published pricing page (region-unqualified), fetched 2026-08-21"
        note: >-
          The no-CPU-during-idle property is REAL, verified for CPU (pricing page: I/O wait and
          idle time free if no background process runs; AWS's example confirms it
          arithmetically) at 0.0895 usd/vCPU-h plus 0.00945 usd/GB-h. CAVEAT: memory appears
          billed on wall-clock INCLUDING waits (peak-memory-consumed-up-to-that-second formula;
          reverse-engineering AWS's example reconciles only on full session seconds) -- a
          HYPOTHESIS needing AWS confirmation before any cost model relies on it. Model-agnostic
          (any foundation model, in or outside Bedrock; no dec-122/CD.28 conflict). Eliminated at
          current scale by STRUCTURE not billing: a 2 GB image cap, 1 GB session storage and 750
          MB zip (none adjustable) cannot hold the 5.4 GB dependency env; the only escape (EFS/S3
          Files) forces VPC mode: no internet by default, hence NAT gateway egress plus
          site-packages over NFS; ARM64 containers mandatory; personas become HTTP servers with a
          non-blocking ping heartbeat against a 15-min idle kill; session storage wiped each
          runtime version update; no .sync SFN integration (optimized integration wraps
          InvokeHarness only, Bedrock-Converse-shaped; needs SDK integration plus
          waitForTaskToken). At OE-05 duty the advantage over Fargate is ~7 usd/month at 300
          recs, which does not buy the rebuild. Q2's async-mode generalization is PARTIALLY
          FALSIFIED: the no-CPU-during-wait mechanism exists in-region, but the ~1.9x Fargate
          vCPU premium eats most of it below the ~42 percent duty break-even.
