  - id: T4.15
    tier: T4
    name: Layer-2 substrate comparative spike -- the CD.27 ESB-04 resolving instrument
    intent: |
      CD.27's layer-2 substrate is NOT selected, and this item is the instrument that selects it.
      Until this spike runs the incumbent stands and nothing else is pinned. The spike compares the
      pinned candidate set -- durable_functions, sfn_over_stateless_workers,
      self_checkpointed_lambda_dynamodb, long_running_container and hosted_cli_runner -- against
      CD.27's substrate-neutral resume properties P1 (resume without re-doing completed work), P2
      (workspace continuity) and P3 (bounded loss), using decision_scout as the spike vehicle. It
      also carries the two-plane compute-placement design recorded in CD.44 as a CANDIDATE arm.
      This item SELECTS nothing until it runs: the encoding that created it pre-empts neither CD.27
      nor CD.43. Sequenced BEFORE T4.2, because building the persona layer against an unselected
      substrate is the frame-lock CD.27 has already paid for once, and CD.27's ESB-04, ESB-06 and
      ESB-01 ratification preconditions all discharge against this item.
    depends_on: []
    files_in_scope: []
    exit_criteria:
      - id: c1
        text: >-
          The comparative record covers every substrate in CD.27's pinned candidate set and scores each ONLY
          against CD.27's substrate-neutral P1/P2/P3 resume properties, never against an incumbent-specific
          mechanism -- that contamination is ESB-05, and scoring through a contaminated criterion is not cured by
          flagging it
        status: open
      - id: c2
        text: >-
          The spike forces a MID-LOOP kill on every arm: each candidate persona is interrupted mid-run, in-flight,
          with work in progress rather than between clean steps, and the record states what each arm lost and what
          it resumed. Resumability is the property being compared, so criteria without a forced mid-loop kill
          discriminate nothing
        status: open
      - id: c3
        text: >-
          Every arm's leg is WORKSPACE-MUTATING: the persona edits files on a branch and the kill lands with
          uncommitted work in the tree. A read-only persona never exercises P2 (workspace continuity), which is
          the highest-severity open finding (ESB-01), so a read-only spike would compare the arms on the one
          property that is not in question
        status: open
      - id: c4
        text: >-
          SYMMETRIC REALISM is required and stated in the record: neither arm is stubbed, and the same realism
          applies on each arm. A stubbed incumbent arm rigs the comparison toward the candidate exactly as a
          stubbed candidate arm would rig it the other way
        status: open
      - id: c5
        text: >-
          MECH-1 -- the dispatch credential by which the orchestration plane starts a candidate-arm run is
          UNSTUBBED and live for the duration of the spike: a real credential, actually exercised, with its
          storage and rotation story recorded. It is the candidate arm's single largest unbuilt piece, so stubbing
          it hides the cost the spike exists to measure. This is NOT the file_pr/merge credential model, which is
          a different credential owned by T4.1 -- do not discharge one with the other
        status: open
      - id: c6
        text: >-
          MECH-3 -- each arm's continuation mechanism when a persona legitimately exceeds that arm's duration
          ceiling is recorded: who re-dispatches, whether the correlation token survives, and how the checkpoint
          is handed over. CD.27's stability_definition_14d already exempts scheduled duration-ceiling
          continuations, so an arm with no continuation story cannot satisfy the exemption it relies on
        status: open
      - id: c7
        text: >-
          GOV-3 -- the two ratification obligations that LAPSE for a non-replay substrate (ESB-06's determinism
          rules plus its static check, and CD.27's DynamoDB self-checkpoint fallback_spec, whose own
          lapse_condition names the same class) are CLAIMED explicitly in the ratifying record whenever they
          lapse, never left for a reviewer to discover as unmet obligations
        status: open
      - id: c8
        text: >-
          The record selects the executor's workspace backing store from CD.43's option_set against W1-W8 and
          replaces CD.43's TBD_at_CD.43_ratification marker, discharging ESB-01 in the same act
        status: open
      - id: c9
        text: >-
          SUBSTRATE-NEUTRAL VERIFICATION SPLIT. Verification (V1/V2/V3 scripts) and validation
          (validate.py --pre on push, full suite on merge) execute on GitHub Actions under the
          sole-verifier authority carried by the LIVE T4.9a c1, REGARDLESS of the layer-2
          substrate selected; persona compute on any arm performs edit/think/tool loops only and
          NEVER runs validate.py or verifier scripts as part of the persona's own execution -- on
          an arm whose substrate IS GitHub Actions the boundary is that the persona job and the
          CI job are DISTINCT WORKFLOW RUNS, not one blended job, which is the formulation that
          keeps the criterion meaningful on every arm; the spike's per-arm cost and duration
          measurements must EXCLUDE verification and validation wall-clock, and any arm's record
          that includes it is measuring the wrong boundary; verification steps are converted to
          deterministically-runnable scripts dispatched via the T4.9a callback pattern (--pre ~5
          min cap on push, 1-2 per rec; full suite 30 min cap on merge only; V3 tiers remain rare
          and agent-supervised as the named exception, routed per their own tier rules). Decision
          163 CLAUSE 3 already scopes the pre-handoff full-tier run to the interactive CC-web
          session and explicitly does NOT extend it to the executor, so the executor's full tier
          runs ONCE at merge and is not run twice; handoff_policy.full_validation_required_before_commit
          is Literal[True] on every plan including executor-authored ones, so its "before commit"
          wording is discharged at merge on the executor and reconciling the flag itself is
          T4.9a / CD.17 work, not this criterion's. This is a conscious, reversal-conditioned
          carry-forward (Decision 75) whose trigger is Decision 112's own reversal condition (CI
          moving off GitHub-hosted runners plus OIDC federation). T4.9 c1 and T4.9a c1 are both
          NOT rehomed by this criterion.
        status: open
      - id: c10
        text: >-
          GITHUB ACTIONS USAGE-POLICY FIT. The spike's ratifying record quotes the GitHub Terms
          for Additional Products and Features, Actions section (retrieved 2026-08-21) and states
          the usage-policy fit: clause 5 ("If using GitHub-hosted runners, any other activity
          unrelated to the production, testing, deployment, or publication of the software
          project associated with the repository") is SATISFIED by executor personas, which
          produce and test this repository -- the clause tests purpose, not authorship; the
          BINDING constraint is clause 4 (burden "disproportionate to the benefits", example "as
          part of a serverless application"), to which the dispatch-and-callback shape is
          structurally adjacent, so the record must state the measured burden posture (rec
          concurrency, recs/day, job-minutes/month) and show it proportionate; re-evaluation
          triggers are the A2+ concurrency raise, a repo-visibility flip, and recs/month growing
          an order of magnitude past the 100-300 baseline; and a BUSL-1.1 relicensing note that
          clause 3 (reselling Actions) is not engaged by developing commercial software ON
          Actions and would engage only if customer workloads ever executed on Actions minutes.
        status: open
    related_candidate_decisions: [CD.27, CD.43, CD.44]
    effort: L
    strategic: false
    status: not_started
    note: >-
      Created by PLAN-executor-two-plane-roadmap-encoding. The dossier calls the resolving spike the
      single highest-leverage unowned action in the subsystem; before this item it had no owner and
      no plan, so CD.27's three ratification preconditions could not discharge against anything.

  - id: T4.16
    tier: T4
    name: Executor plan data plane -- named read verb, content pin, critique-authorship boundary (MVP slice)
    intent: |
      Decision 87 as amended makes warehouse RESIDENCY of executor-authored plans a prerequisite for
      T4.2 rather than a consequence of it, and the two-plane design recorded in CD.44 has every
      persona fetch its plan from the warehouse row instead of receiving it through the orchestration
      plane. That moves the plan data plane from post-MVP to MVP-critical: nothing downstream of
      plan_agent can run without it. This item lands the MVP slice -- the named read verb, the
      content pin that makes a fetch verifiable, and the authorship boundary around critique_history
      -- and routes the verb-RBAC split itself forward to T4.5/T4.6, where per-persona credentials
      exist. It builds no persona and selects no substrate.
    depends_on: []
    files_in_scope:
      - src/common/ducklake_scd2_schema.py
      - scripts/ops_portal/execution_plans.py
      - config/lambda/ducklake/field_semantics.yaml
    exit_criteria:
      - id: c1
        text: >-
          DATA-1 -- the named read verb execution_plan_by_rec, taking (rec_id, revision), is registered in the
          NAMED_READS registry and reachable across the closed reader boundary. Personas fetch their plan through
          it and never through query_ops, which accepts caller SQL: the agent contract is named verbs precisely so
          no caller SQL crosses the boundary
        status: open
      - id: c2
        text: >-
          The read verb's spec PINS CONTENT, not merely the revision: every fetch verifies a writer-minted ULID or
          a content hash carried alongside (rec_id, revision) and fails closed on mismatch. merge_key is rec_id
          ALONE and revision is a caller-supplied scalar, so a re-dispatched writer can emit revision N twice with
          different bodies and the pair on its own is not idempotent
        status: open
      - id: c3
        text: >-
          The content pin is the MVP-side guarantee for a verb split that cannot be enforced yet: every persona
          presents one identity at the writer boundary today, so server-side role scoping distinguishes nothing.
          The orchestration plane carries (rec_id, revision, ulid-or-hash), every persona fetch and the merge node
          verify it, and the verb-RBAC split itself -- insert_plan / set_plan_status / the critique-append verb,
          role-scoped -- routes to T4.5/T4.6 where per-persona credentials exist
        status: open
      - id: c4
        text: >-
          A critique verdict is written by the CRITIC or by the GATE, never by the critiqued persona, and the
          content pin's hash is scoped to the plan BODY EXCLUDING critique_history -- a pin taken over the whole
          row is invalidated by every critique append and would fail closed on the loop's normal path
        status: open
      - id: c5
        text: >-
          The plans-table NAME is RULED rather than defaulted, and this item is where the ruling has to be legible
          because the read verb BINDS a physical name into NAMED_READS: ops_execution_plans is the single plans
          table, selected on prevalence (the implemented name, carried on 278 matching lines across 80 files, 32
          of them load-bearing across terraform, field_semantics, .importlinter, the verification and data-quality
          registries and 12 test modules, against 30 prose-only lines across 8 files for the rejected alternative
          name, none load-bearing). No surface leaves the name open
        status: open
      - id: c6
        text: >-
          The read path survives a Neon COLD RESUME: a cold-start reconnect is retried with bounded backoff before
          the step is failed, and the bound is stated. The design declares unattended operation impossible without
          it, so an unretried cold resume is an outage rather than a latency spike
        status: open
      - id: c7
        text: >-
          MECH-4 -- a reaper unsticks a rec whose executor run died mid-flight. ci-rca-inactivity-sweep.yml closes
          genuinely-inactive open source=ci_rca recs on a timestamp predicate and is NOT a reaper for a crashed
          run holding a queue slot; without an equivalent the queue silently loses a slot per crashed run
        status: open
      - id: c8
        text: >-
          DATA-2 -- the per-revision append log has a home that survives an ephemeral compute plane. jsonl_store's
          repo-relative PLANS_JSONL dies with the job, and the portal explicitly refuses to collapse it onto the
          one-row-per-rec_id cache because that would destroy its per-revision history. Either the SCD2 history
          table absorbs the role or the log gets a durable home; today it is inherited rather than decided
        status: open
      - id: c9
        text: >-
          DATA-3 -- every fanned-out scout leg is HANDED its parent's observation_id as an input.
          parent-observation-id.yaml is explicit that a child never re-mints a correlation key it did not
          originate, so a naive matrix fan-out records N disconnected roots and violates the contract by default;
          the contract also notes there is no current populator, so the swarm tree is contracted but not built
        status: open
      - id: c10
        text: >-
          OPS-3 -- LLM-authored code must not execute inside a session holding broad cloud credentials.
          implement_agent writes tests and then runs them; Decision 117 boundary patterns gate which recs are
          ADMITTED, not what an agent writes once admitted. Credentials are scoped to the specific steps that need
          them rather than held for the whole run
        status: open
      - id: c11
        text: >-
          A MERGE-NODE DIFF-PATH GUARD is live: at the merge node the PR diff is inspected and the merge is
          refused when that diff touches .github/workflows/** or any path matching the Decision 117
          boundary_patterns SSOT. ci.yml runs on pull_request, so a same-repo branch runs its own version of the
          workflow -- the guard has to sit on the plane the agent cannot edit through its own merge loop, and the
          diff, the workflow path and the merge node have to be gated together in one control rather than in three
        status: open
      - id: c12
        text: >-
          QUEUE SEEDING for the first queue-fed run is decided rather than discovered: what populates
          ops_priority_queue before the executor has filed any recs of its own, and which producer owns that
          seeding
        status: open
      - id: c13
        text: >-
          ONE eligibility predicate is authoritative and the divergent versions are reconciled to it -- including
          the effort and target-SLOC admission gates Life 1 actually enforced, which appear in none of the forward
          design
        status: open
      - id: c14
        text: >-
          The three CLOSURE POINTS are adjudicated: the executor closing the rec itself, the Resolves: trailer on
          push, and post-merge full-validate PASS. Which one counts as done, and what happens when they disagree
        status: open
      - id: c15
        text: >-
          A cross-run FAILURE BUDGET either exists with a numeric threshold and a named owner, or is recorded as
          deliberately absent with the reason. Per-rec loop budgets (T4.11) bound one run and are not a rate
          limiter ACROSS runs
        status: open
      - id: c16
        text: >-
          Where an executor-authored RCA rec surfaces is decided: source=ci_rca carries a preflight section, a
          hard block, liveness alerts, a fingerprint chain and an inactivity sweep, while executor-rca and
          executor-postmortem recs have none of it and land in a generic backlog current policy leaves unexamined
          until the executor exists
        status: open
      - id: c17
        text: >-
          Whether ops_recommendations gains a PLURAL TARGETS field is decided: both the Decision 117 boundary
          predicate and the semantic-lock derivation are specified over a rec's targets, while the schema carries
          a single scalar file, so neither is implementable as written
        status: open
    related_candidate_decisions: [CD.44]
    related_decisions: [87]
    effort: L
    strategic: false
    status: not_started
    note: >-
      Created by PLAN-executor-two-plane-roadmap-encoding. MVP-critical rather than post-MVP because
      Decision 87 as amended separates RESIDENCY (a T4.2 prerequisite) from AUTHORITY (still timed to
      T4.6); the verb split itself stays with T4.5/T4.6.

  - id: T4.17
    tier: T4
    name: Provider as a measured performance variable -- comparative inference-tier telemetry
    intent: |
      Decision 173 makes tier MEMBERSHIP configuration rather than architecture; this item is where the
      consequence the operator named -- providers become a VARIABLE whose performance is measured --
      gets an owner. It builds the measurement surface, not a swap: per-call telemetry dimensioned by
      provider and model so two tier-1 candidates can be compared on one workload, plus the comparative
      record naming the current selection for each ROLE and the evidence behind it. It SELECTS no
      provider and changes no tier: a selection made against this item's evidence is a contract edit
      under Decision 173 clause 2 and needs no Decision amendment. c5 additionally carries the
      transport-side config-resolution requirement that Decision 173 clause 2 places on T4.2's
      LiteLLM transport -- it is homed here, in structured form, because T4.2's own exit_criteria are
      bare strings.
    depends_on: [T4.2]
    files_in_scope: []
    exit_criteria:
      - id: c1
        text: >-
          Every executor inference call emits provider AND model_id as telemetry dimensions alongside
          tokens, cost and latency, so a per-provider comparison is a query rather than a re-run. A
          record that cannot separate the provider dimension measures nothing about provider choice
        status: open
      - id: c2
        text: >-
          The comparative record scores at least two candidate primary-tier providers on the SAME
          workload (identical prompts, identical effort band) and states cost per rec, latency and task
          outcome per provider -- symmetric realism, neither arm stubbed
        status: open
      - id: c3
        text: >-
          The current selection for each ROLE (primary, warm-fetched fallback) is recorded in
          docs/contracts/inference-provider.yaml together with the evidence that chose it, and changing
          a selection is a contract edit alone -- no Decision amendment, per Decision 173 clause 2
        status: open
      - id: c4
        text: >-
          Each tier's declared billing_shape carries the cold-start assertion Decision 173 clause 4
          requires for that shape (remaining-allowance for a fixed non-rollover allowance,
          credential-liveness for a metered tier, not_applicable while deferred), and the assertion is
          exercised, not merely declared
        status: open
      - id: c5
        text: >-
          Tier membership is resolved from docs/contracts/inference-provider.yaml at runtime by the
          T4.2 LiteLLM transport -- swapping which provider or model fills the primary or fallback ROLE
          requires no edit to scripts/llm/client.py -- and the transport refuses a configuration that
          fills a role from retired_providers or fills both roles from one vendor (Decision 173 clause
          2(a) and 2(b))
        status: open
    related_candidate_decisions: [CD.28]
    related_decisions: [116, 122, 164, 173]
    effort: M
    strategic: false
    status: not_started
    note: >-
