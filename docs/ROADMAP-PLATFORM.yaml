    total_per_month_usd: "21-54"
    dominant_cost: "The unenumerated-item add-on (headline_basis.add_on_usd, ~$10-30/mo) is now the single largest component of the 21-54 headline -- larger than any individually-enumerated breakdown line, of which CloudWatch logs / DeepSeek inference (~$5-8/mo) is the biggest. EC2 self-hosted runner historically (~$35/mo) was the pre-2026-05-28 dominant cost, RETIRED per CD.21; the RDS catalog has since migrated to Neon ($0) per CD.34. Headline recomputed 2026-08-02 (ESB-09): the prior 45-65 figure summed the retired EC2/RDS lines rather than reflecting the unenumerated-item add-on; see headline_basis."
    breakdown:
      s3_storage: "<$1"
      dynamodb_on_demand: "$1-3"
      ec2_runner_24_7: "$0 (retired 2026-05-28 per CD.21; ~$35/mo historical, line retained as baseline)"
      secrets_manager: "~$2"
      cloudwatch_logs: "$3-8"
      deepseek_executor_inference: "~$5 (~100 recs/month at ~$0.05 each via DeepSeek direct API, ~75% lower than the retired Bedrock path; native cache hit drops repeat-prefix cost further)"
      anthropic_escape_hatch_spillover: "$0-5 (warm-fetched Tier-2 per CD.28; usually $0 because Max x5 programmatic-pool credit absorbs the typical volume; spillover only when escape hatch activates heavily)"
      ducklake_catalog_neon: "$0 (Neon serverless Postgres free tier; scale-to-zero; built-in pooler replaces RDS Proxy) per CD.34, replacing the prior RDS catalog (~$12-15/mo single-AZ db.t4g.micro + gp3 + PITR; deferrable RDS Proxy +$10-12 was never provisioned -- OQ.8). Realized saving ~$12-15/mo. Daily pg_dump-to-S3 DR is a negligible add-on. Migrated before T2.17 to avoid building RDS-in-a-VPC + NAT plumbing."
      neon_catalog_egress: "TBD (Decision 88 clause 2 measurement obligation -- a post-deploy figure via the catalog_stats action, not a planning-time guess)"
    headline_basis:
      includes_line_items_not_enumerated: true
      enumerated_subtotal_usd: "11-24"
      add_on_usd: "10-30"
      derivation:
        sums: [s3_storage, dynamodb_on_demand, ec2_runner_24_7, secrets_manager, cloudwatch_logs, deepseek_executor_inference, anthropic_escape_hatch_spillover, ducklake_catalog_neon]
        excluded: [neon_catalog_egress]
        note: total_per_month_usd recomputes to the enumerated subtotal PLUS add_on_usd, reaffirming the plan-critique round 2 ruling to fold the unenumerated-item estimate into the headline on anti-under-reporting grounds rather than silently dropping it; the individual VPC/NAT/CloudTrail/etc items are not provisioned as their own breakdown lines (see line_items_not_enumerated for the reason -- itemising them individually is out of this wave's scope, not that their aggregate cost is zero); neon_catalog_egress is excluded because Decision 88 clause 2 makes its figure a post-deploy measurement obligation, not a planning-time guess -- no dollar value exists to sum yet, and no anti-under-reporting stand-in is invented for it either
    line_items_not_enumerated: VPC endpoints, NAT, DynamoDB PITR, CloudTrail, Config, KMS, GH-hosted runner minutes, S3 Intelligent-Tiering monitoring fee, Step Functions state-transition cost (negligible at current scale, ~$0.025 per 1000 transitions Standard Workflow). Not individually provisioned as their own breakdown lines; their realistic aggregate cost ($10-30/month at current scale) is folded into total_per_month_usd via headline_basis.add_on_usd (anti-under-reporting, per plan-critique round 2) rather than published as a headline-excluded footnote.
