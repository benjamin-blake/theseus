      The prerequisite that must exist before any human-facing analytical presentation layer is
      worth testing. Two halves:

      (1) A NET-NEW CLASS of analytical-aggregate `named_read` verbs. Today's NAMED_READS registry
      (src/common/ducklake_scd2_schema.py, NAMED_READS_VERSION 3) is 12 verbs over 3 tables
      (ops_recommendations, ops_decisions, ops_priority_queue). Three of them DO use aggregate SQL
      (count_by_status GROUP BY status; forward_fix_recursion GROUP BY file HAVING COUNT(*) >= 3;
      decisions_max_updated max(...)) -- but all three are single-table OPERATIONAL COUNTERS feeding
      preflight gauges, with no time bucketing, no dimensional breakdown, no cross-table join, no
      actual-vs-estimated classification and no versioned analytical response schema. What is absent
      is the ANALYTICAL GRAIN, not aggregate SQL -- so this item EXTENDS a proven registry pattern
      rather than inventing one. Aggregate verbs own business aggregation,
      join semantics, dataset grain, actual-vs-estimated classification, authorized columns,
      date/cardinality bounds, stable ordering, and a versioned response schema, so that agents and
      any human projection consume the SAME governed dataset (CD.42(a)). Named verbs are SERVING
      LEAVES: a verb never invokes another verb (that would compound Lambda latency and failure,
      obscure lineage, complicate backfills, and prevent atomic publication).

      (2) A REBUILDABLE-DERIVED-ASSET write mode in docs/contracts/data-modeling-standard.yaml,
      which today defines only scd2 and append_only and has no mode for derived aggregates. Derived
      aggregates must NOT be force-fitted into SCD2 (they are not mutable entities): admissible
      shapes are append-only aggregate snapshots, incrementally replaced time partitions, versioned
      materialization runs with a current pointer, or complete atomic rebuilds. A logical asset must
      be able to move from a virtual query to a persisted materialization WITHOUT changing its
      named-verb contract or any downstream consumer.

      Asset-oriented, not verb-oriented: the DAG connects data assets (source facts -> canonical
      domain assets -> reusable aggregates -> semantic projections) and named verbs sit at the edge
      as serving leaves. Design rationale: docs/plans/reports/REPORT-evidence-dashboarding-poc.md
      section 9.
    depends_on: []
    files_in_scope:
