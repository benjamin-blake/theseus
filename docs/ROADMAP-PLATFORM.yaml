  - id: T2.51
    tier: T2
    name: Private variable-cost visibility dashboard (Cloudflare-Access front, in-AWS data)
    intent: |
      A private, unified view of variable operational vendor spend (AWS + Anthropic API + DeepSeek
      API + Neon) so the platform's cost structure stays legible as it scales. Confidential cost
      data RESTS in the personal AWS account (private S3); the dashboard is a read-only PROJECTION.
      The bookmarkable experience (open a private Access-gated subdomain of theseus.support ->
      authenticate -> view) uses Cloudflare Access ONLY for auth: an in-AWS Lambda verifies the Access token and mints a
      <=5-min presigned GET (its own execution-role creds), and the browser loads the artifact
      DIRECTLY from S3 -- no AWS credential leaves AWS and the payload never transits Cloudflare
      (the CD.41 invariant). The public theseus.support / Semanto surface stays public and never
      carries cost figures (Decisions 73/83/101). Complements the monthly cost_reconciliation alarm
      (answers "did a threshold trip?"); this answers "where is variable spend going, and in what
      proportion, over time?". Subscription out of scope (variable-only) -> all USD, no currency
      conversion. Design rationale + architecture: docs/plans/reports/REPORT-cost-visibility-dashboard.md.
    depends_on: []
    files_in_scope:
      - terraform/personal/cost_read_role.tf    # new -- read-only ce:GetCostAndUsage IAM role (gated apply)
      - terraform/personal/cost_dashboard_auth.tf    # new -- in-AWS presign Lambda (Access-JWT verify) + private subdomain wiring
      - scripts/cost/    # new subpackage -- daily pull + snapshot (grain: one row per vendor per day) + render projection
      - config/agent/cost_sources.yaml    # new -- provider/source registry (list-price refs only; no measured actuals)
      - .github/workflows/cost-dashboard.yml    # new -- daily scheduler (or a Lambda + EventBridge equivalent)
      - scripts/cost_reconciliation.py    # touch -- optional AWS auto-pull via the new role (retires manual invoice export)
    exit_criteria:
      - id: c1
        text: >-
          A net-new read-only AWS cost role granting ce:GetCostAndUsage is provisioned in
          terraform/personal (gated apply; IAM-sensitive, Decision 98/144) and can read the
          month-to-date bill by service; no measured cost figure is ever committed to the repo
          (Decisions 73/83/101). A fresh source Decision records the programmatic AWS-infra Cost
          Explorer read (a new source choice, NOT a CD.28 reversal). Open question at build: whether
          the ce: role falls under the Decision 129/144 read-coverage verifier.
        status: open
      - id: c2
        text: >-
          A scheduled daily job pulls AWS Cost Explorer plus the per-vendor billing/usage APIs
          (Anthropic usage API; DeepSeek; Neon via its billing/management HTTPS API, NEVER a
          DuckLake catalog query -- Decision 88) into a GOVERNED DUCKLAKE TABLE at grain one row per
          vendor per cost-date per as-of/pull-date (append-only, event-time-partitioned; CE
          current-month figures are provisional and get restated). [Amended by
          PLAN-evidence-dashboarding-poc: the original text specified a bespoke private-S3 snapshot
          file. DuckLake IS Parquet-in-S3 with catalog metadata in Neon, so the stated grain was
          already DuckLake-shaped -- this is a routing amendment, not a re-scope. Writes transit
          ducklake_writer; reads transit ducklake_reader named verbs, so the same governed dataset
          serves agents and any human-facing projection (CD.42(a)/(c)). Confidential figures still
          rest only in the personal AWS account and are never committed.] A stale/absent snapshot or
          an unparseable source fails loud / files a rec, never silently shows stale-as-current
          (Decision 55/62)
        status: open
      - id: c3
        text: >-
          A rendered static projection (spend by vendor AND its trend over time), sourced from c2's
          governed table via ducklake_reader named verbs (never caller SQL, never direct catalog or
          object-store access -- CD.42(c)), is served via the CD.41 pattern: Cloudflare Access
          authenticates a private Access-gated subdomain of theseus.support; an in-AWS Lambda
          verifies the Access JWT (JWKS/iss/aud/exp) and mints a <=5-min single-object presigned GET
          (a TTL-bounded bearer capability -- S3 does not check the JWT). The browser loads directly
          from S3. No AWS credential leaves AWS; the payload never transits Cloudflare (only the
          short-lived capability pointer does, once). The renderer is unconstrained (static
          pre-rendered is the MVP instance, not a pattern constraint). [Amended by
          PLAN-evidence-dashboarding-poc: the renderer CHOICE and the unresolved multi-file-static-
          site vs CD.41-invariant-(b) serving question (REPORT-cost-visibility-dashboard section
          5.4) are REHOMED to tier item T2.53 and are no longer decided by this item. If T2.53
          rejects a multi-file renderer, this criterion is satisfiable by the single-object MVP
          instance as originally written.]
        status: open
      - id: c4
        text: >-
          CD.41 (the invariant-fenced private-dashboard hosting pattern) is ratified as a Decision
          before the dashboard is served, with its discipline points and reversal conditions
        status: open
      - id: c5
        text: >-
          The existing monthly cost_reconciliation job auto-pulls the AWS leg via the new cost-read
          role (assumable by its OIDC principal, or ce: added to agent-platform-github-ci-branch),
          retiring the manual cost-invoices/<month>.json AWS export
        status: open
    related_candidate_decisions: [CD.28, CD.41]
    related_decisions: [55, 67, 73, 83, 88, 93, 98, 100, 101, 111, 144]
    effort: L
    strategic: false    # freeze override (AGENTS.md / CD.17): author as atomic IMPLEMENTATION plan(s) at reactivation
    status: deferred_post_mvp
    progress_note: "Scoped deferred_post_mvp (Decision 93) via PLAN-cost-visibility-dashboard / REPORT-cost-visibility-dashboard (2b architecture; Fable advice-consulted). Value scales with spend; today variable spend is noise vs the (out-of-scope) fixed subscription -- the two future cost 'whales' are inference (activity-driven, near-term) and S3 storage (data-driven, long-term). Activation trigger: the frozen executor (Decision 67) unfreezes and LLM-API spend is non-trivial, OR the monthly cost_reconciliation begins tripping thresholds regularly. Precedes the Semanto marketing surface (ROADMAP-SEMANTO S1.x) in priority but has NO dependency on it (private-AWS + Cloudflare-Access vs public-Cloudflare-Pages surfaces). Transitive active dependents: none. Reactivate by restoring status -> not_started; ratify CD.41 and re-ground the stale anthropic_pool_size_usd baseline against the owner's current subscription tier at that time. AMENDED 2026-07-26 (PLAN-evidence-dashboarding-poc, REPORT-evidence-dashboarding-poc): c2 routes the cost snapshot into a GOVERNED DUCKLAKE TABLE served by named verbs rather than a bespoke private-S3 snapshot file (routing amendment, not a re-scope -- DuckLake is Parquet-in-S3 and the stated grain was already DuckLake-shaped), so one governed dataset serves agents and any human projection; c3's RENDERER CHOICE and the unresolved multi-file-static-site vs CD.41-invariant-(b) serving question (REPORT-cost-visibility-dashboard section 5.4) are REHOMED to T2.53. All five criteria were status:open at amendment time, so no met_by provenance was re-pointed (Decision 136/CD.39)."

