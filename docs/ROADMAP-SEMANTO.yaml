# docs/ROADMAP-SEMANTO.yaml
#
# Sibling roadmap: external-facing marketing / Semanto comms system.
# Anchored by Decision 101 (External brand identity -- Theseus / Semanto).
# Sibling: docs/ROADMAP-PLATFORM.yaml (platform infrastructure).
#
# ALL tier_items carry status: deferred_post_mvp (Decision 93 -- Platform-MVP boundary).
# No item is eligible until reactivated post-MVP. Validation wired in S1.5.
# Tier prefix: S. Id grammar: S1.x.

document:
  id: ROADMAP-SEMANTO
  version: 1
  status: draft
  filed_via: pending_log_decision_lambda
  description: |
    The Semanto marketing/comms roadmap. Governs the external-facing brand presence for
    the Theseus platform (theseus.support). All items are parked deferred_post_mvp
    (Decision 93) and none are eligible until the Platform MVP boundary is crossed and
    items are individually reactivated -> not_started.
    Decision 101 anchors the naming hierarchy (Theseus = platform, Semanto = this
    marketing/comms system and roadmap) and the presentation-layer-only constraint
    (internal identifiers unchanged).
  agent_instructions: |
    - ALL items in this roadmap carry status: deferred_post_mvp (Decision 93).
      None are eligible to start. Do not surface them in next_eligible or eligible
      item lists until individually reactivated -> not_started post-MVP.
    - Reactivation requires an explicit operator edit: status: not_started on the
      specific item. Do not auto-reactivate.
    - depends_on edges in this roadmap are intra-SEMANTO only (no live item may
      depend on a deferred item -- Decision 93 no-live-dep invariant; satisfied
      because the entire tier is deferred and nothing in ROADMAP-PLATFORM.yaml
      depends on any S1.x id).
    - Tier prefix is S. Id grammar: S1.x.
    - Decision 101 is the anchoring decision for all items in this roadmap.
    - S1.5 (deferred) wires ROADMAP-SEMANTO.yaml into validate.py and session_preflight.
      Until S1.5 ships, this file is not schema-validated by validate.py.
    - Marketing content lives in top-level marketing/ (never docs/). It is NOT an
      agent source-of-truth (Decision 86 scoped exception, Decision 101 clause c).

candidate_decisions: []

cross_tier_gates: []

tier_items:
  - id: S1.1
    tier: S1
    name: Apply Theseus external branding to public-facing surfaces
    intent: |
      Update the repository README wording and description to reflect the external brand
      name Theseus (platform). Presentation only -- no internal identifier changes (repo
      name, AWS prefixes, profile, project_id all unchanged per Decision 101 clause b).
      Badge and description updates only.
    depends_on: []
    effort: XS
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Scope: README wording + repo
      description -- presentation-layer-only branding, no internal identifier change.
      Reactivate -> not_started post-MVP to apply the external brand name to public surfaces.

  - id: S1.2
    tier: S1
    name: Register theseus.support DNS/TLS + Cloudflare Pages project
    intent: |
      Human-gated step: operator registers the theseus.support domain DNS records and
      creates the Cloudflare Pages project via the Cloudflare console. No automation
      possible until the Pages project exists and DNS is live. TLS is managed by
      Cloudflare (auto-provisioned). Prerequisite for the Astro/Starlight scaffold (S1.3).
    depends_on: []
    effort: XS
    strategic: false
    status: deferred_post_mvp
    user_action_required: true
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Domain theseus.support is
      already Cloudflare-owned. This item requires a human console action to wire DNS
      and create the Pages project. user_action_required: true. Reactivate post-MVP.

  - id: S1.3
    tier: S1
    name: Astro + Starlight static-site scaffold in top-level marketing/ + Cloudflare Pages build
    intent: |
      Scaffold the Astro + Starlight site in top-level marketing/ (not docs/; per Decision 101
      clause c scoped exception). Includes content collections with Zod-validated frontmatter,
      Cloudflare Pages build pipeline, and the one-way rendering pipeline from internal artefacts
      to marketing prose. Marketing content is never a warehouse write source (Decision 84).
    depends_on: [S1.2]
    effort: M
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Astro + Starlight (free/MIT);
      Cloudflare Pages is the native managed primitive (Decision 100). depends_on S1.2
      (DNS/Pages project registration). Reactivate post-MVP.

  - id: S1.4
    tier: S1
    name: Public-content boundary review gate + validate.py marketing/ exclusion guard
    intent: |
      Pre-publish checklist enforcing Decision 101 clause d (no AWS account specifics;
      market the platform engineering, never confidential operational data). Adds a
      validate.py guard that excludes top-level marketing/ from the agent-first /
      intent-doc-freeze corpus so the Decision 86 freeze guard does not false-positive
      on marketing prose.
    depends_on: [S1.3]
    effort: S
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Depends on S1.3 (scaffold).
      Adds boundary enforcement so no AWS account specifics or confidential figures
      can be published. Also adds marketing/ exclusion to validate.py's intent-doc-freeze
      guard. Reactivate post-MVP.

  - id: S1.5
    tier: S1
    name: Wire ROADMAP-SEMANTO into tooling
    intent: |
      Add a validator over docs/ROADMAP-SEMANTO.yaml reusing the RoadmapDocument Pydantic
      schema (scripts/roadmap/platform_roadmap.py), surfaced in validate.py as a new check and in
      session_preflight via the platform_roadmap compute_state path. Keeps both sibling
      roadmaps on the same validation footing. No new schema changes required -- RoadmapDocument
      already supports the S1.x id grammar and deferred_post_mvp status.
    depends_on: []
    effort: S
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Until this ships, ROADMAP-SEMANTO.yaml
      is authored to conform to RoadmapDocument but is not schema-validated by validate.py
      (validate_platform_roadmap targets a fixed path). Reactivate
      post-MVP to wire the second roadmap into CI and session_preflight.

  - id: S1.6
    tier: S1
    name: Initial content -- landing page + first engineering write-up
    intent: |
      The first published content on theseus.support: a landing page and the foundational
      engineering write-up on the self-improving / agent-first platform story. Markets the
      platform engineering and architecture; never publishes confidential operational data
      (Decision 101 clause d). Content lives in top-level marketing/ (Decision 101 clause c
      scoped exception; never in docs/).
    depends_on: [S1.3, S1.4]
    effort: M
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). First-publish content gate:
      depends on S1.3 (scaffold) and S1.4 (boundary review gate). Primary audience is
      data-engineering hiring managers (portfolio/credibility); OSS community is secondary.
      Paid service is a separately gated future option. Reactivate post-MVP.

  - id: S1.7
    tier: S1
    name: Pre-registered experiment protocol -- operational-memory ablation, long-horizon maintenance, model matrix
    intent: |
      Author the experiment protocol BEFORE any run, as the exit criteria below or a Class D contract under
      docs/contracts/ that they point at -- never in marketing/, which only summarises it (Decision 101 clause c:
      marketing never feeds back into agent context). Three parts, every claim a hypothesis: (1) a three-arm
      operational-memory ablation on one model -- no memory, memory as CLAUDE.md prose, memory with enforcement
      and liveness; (2) a long-horizon maintenance proof on an external subject (selected by S1.8); (3) a
      two-by-two matrix, cheap versus frontier model crossed with brute force versus On The Loop. Platform
      engineering only: no commercial or operational data (Decision 101 clause d).
    depends_on: []
    effort: M
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: Each arm's metrics, stop rules and inference budget are pre-registered and committed before any run, so results cannot be selected after the fact
        status: open
      - id: c2
        text: The protocol lives in this item or a docs/contracts/ file it names; marketing/ never specifies it (Decision 101 clause c), and any public rendering stays inside Decision 101 clause d -- it publishes no docs/ content, only marketing's own summary of the protocol
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance as a
      deferred item rather than an open rec (decision-entry.yaml routing.work_item: a deliberate deferral is a
      deferred_post_mvp item). Reactivate post-MVP.

  - id: S1.8
    tier: S1
    name: Select a maintenance-fork subject by live data against four properties
    intent: |
      S1.7's long-horizon maintenance proof needs an external subject. Select it from live data (package-index
      and repository activity), scoring candidates against four properties: an exogenous change stream (upstream
      releases, dependency churn), health measurable without reading code (test pass rate, issue latency,
      dependent breakage), a multi-month horizon, and low blast radius. Record the adoption levers for the chosen
      subject: PyPI name transfer via PEP 541, successor naming in the original repository, and dependents already
      asking for a maintained fork. Creating the fork repository first needs a Decision 209 clause 3
      placement or an amendment of that clause (its repository set is closed: no other repository is created
      speculatively), and waits until S1.7's protocol is committed.
    depends_on: [S1.7]
    effort: S
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: Candidates are scored from live data against the four properties and the chosen subject's adoption levers are recorded, with the selection rule fixed before scoring
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance in
      place of a recommendation. Reactivate post-MVP, after S1.7.

  - id: S1.9
    tier: S1
    name: Positioning note -- comprehension moves from code to contracts and evidence
    intent: |
      A positioning note under marketing/ (Decision 101 clause c). Its claim: human comprehension moves from code
      to contracts and evidence -- not that humans need not comprehend anything. The headline is that the
      framework's contribution is model-independent and compounds over the horizon of a codebase; the cost-tier
      result (a cheaper model under On The Loop matching a frontier model without it) is a corollary, stated only
      as a hypothesis until S1.7's experiments report. Platform engineering only.
    depends_on: []
    effort: S
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance in
      place of a recommendation. Reactivate post-MVP.
