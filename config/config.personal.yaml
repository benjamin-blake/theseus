# Personal Environment Configuration
# Use on: the personal AWS account (platform data plane).

environment: personal

# Read by src.common.config Config().get("aws.*"). s3_agent_logs_bucket is the ops data lake
# used by the CI-RCA evidence uploader fallback chain.
aws:
  profile: agent_platform
  region: eu-west-2
  s3_agent_logs_bucket: agent-platform-data-lake
  s3_data_lake_bucket: agent-platform-data-lake

# Logging
logging:
  level: INFO
  format: json
