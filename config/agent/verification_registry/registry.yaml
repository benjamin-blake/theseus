        assert any(t in lapse for t in ('ESB-04', 'ESB-06', 'spike')), 'lapse_condition must bind to the layer-2 selection'
        mat = [q for q in cd['discipline_points'] if isinstance(q, str) and q.startswith('Lambda Durable Functions maturity monitoring')]
        assert len(mat) == 1, f'expected exactly 1 maturity-monitoring point, found {len(mat)}'
        m = mat[0]
        phantoms = [p for p in ('recorded as an INTENT Open Question', 'checkpoint-replay verified') if p in m]
        assert not phantoms, f'maturity point still carries the phantom/stale clause: {phantoms}'
        missing_live = [t for t in ('fallback_spec', 'validate_fallback_reevaluation') if t not in m]
        assert not missing_live, f'maturity point does not name: {missing_live}'
        gates = cd['gates']
        tok = re.compile(r'(?<![\w.])(' + '|'.join(re.escape(g) for g in gates) + r')(?![\w])')
