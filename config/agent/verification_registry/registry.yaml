        good = dict(base); good['fallback_reevaluation'] = block
        try:
            PlanDocument.model_validate(good)
        except ValidationError as exc:
            raise AssertionError(f'PlanDocument REJECTED a well-formed fallback_reevaluation block -- the field is absent from the schema or misnamed: {exc}') from None
        rejects = {}
        rejects['unknown verdict'] = {**block, 'verdict': 'looks_fine'}
        rejects['empty basis'] = {**block, 'basis': '   '}
        rejects['extra key'] = {**block, 'note': 'x'}
        missing = dict(block); missing.pop('basis'); rejects['missing basis'] = missing
        for why, blk in rejects.items():
            bad = dict(base); bad['fallback_reevaluation'] = blk
            try:
                PlanDocument.model_validate(bad)
