check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); line=d['cost_projection']['projected_100tb_scale']['breakdown']['step_functions_transitions']; assert '1-10'
    not in line, 'the overstated \$1-10 figure survives'; lo,hi=[float(x) for x in re.match(r'^\\\$([0-9.]+)-([0-9.]+)', line).groups()]; rate_m=re.search(r'\\\$([0-9.eE+-]+)/transition', line); tx_m=re.search(r'([0-9]+)\\s*transitions/rec',
    line); assert rate_m and tx_m, f'line missing transitions/rec or rate/transition -- {line!r}'; tx_per_rec=int(tx_m.group(1)); rate=float(rate_m.group(1)); exp_lo=round(tx_per_rec*100*rate,4); exp_hi=round(tx_per_rec*300*rate,4);
    assert (lo,hi)==(exp_lo,exp_hi), f'published {lo}-{hi} != recomputed {exp_lo}-{exp_hi}'; assert 'eu-west-2' in line or 'eu-west-2' in str(d['cost_projection']), 'region unstated'; print('OK', lo, hi,
    '==', exp_lo, exp_hi)"
