check_id: merge-ops-contract-shape-and-amendment
primitive_slot: command_exit_zero
guard_target: docs/contracts/ducklake_maintenance.yaml
plan_slug: compaction-scope-policy-matrix
graduated_at: '2026-09-14'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - import yaml,io; d=yaml.safe_load(io.open('docs/contracts/ducklake_maintenance.yaml',encoding='utf-8'));
    blob=repr(d['verbs']['merge_ops']); assert 'SCD2 table pairs' not in blob, 'merge_ops
    still describes the retired SCD2-pair predicate'; assert 'maintenance_policy'
    in blob, 'merge_ops does not name the policy matrix'; al=d['amendment_log']; assert
    len(al) >= 2, 'no amendment entry appended -- editing the existing one in place
    does not count'; a=al[-1]; assert a['change_class'] != 'prose_improvement', 'amendment
    entry still prose_improvement'; print('contract shape + amendment ok')
