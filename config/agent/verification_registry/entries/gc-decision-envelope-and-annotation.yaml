check_id: gc-decision-envelope-and-annotation
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: production-gc-and-storage-stability
graduated_at: '2026-09-15'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import io,re,yaml

    F=chr(96)*3

    t=io.open(''docs/DECISIONS.md'',encoding=''utf-8'').read()

    m=re.search(r''^## Decision (\d+): Production destructive GC[^\n]*\n+''+F+r''yaml\n(.*?)\n''+F,
    t, re.S|re.M)

    assert m, ''no Decision heading with a fenced yaml envelope''

    e=yaml.safe_load(m.group(2))

    assert e[''number'']==int(m.group(1)), ''envelope number disagrees with the heading''

    assert e[''significance''][''value'']==''numbered_decision'', e[''significance'']

    assert (e[''significance''].get(''justification'') or '''').strip(), ''significance
    justification is empty''

    assert not (e.get(''amends'') or []), ''this Decision amends nothing -- 88/188/191
    are related''

    d88=re.search(r''^## Decision 88:.*?(?=^## Decision )'', t, re.S|re.M)

    assert d88, ''Decision 88 section not found''

    assert ''ObservabilityMetricRead'' in d88.group(0), ''the cl.2 annotation must
    land INSIDE Decision 88, not merely somewhere in the file''

    print(''decision envelope ok'')'
