check_id: roadmap-projection-delta-bounded-to-t15
primitive_slot: command_exit_zero
guard_target: scripts/platform_roadmap_state.py
guard_symbol: to_preflight_dict
plan_slug: roadmap-blocking-edge-semantics
graduated_at: '2026-09-04'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import subprocess,tempfile,pathlib; from pathlib import Path;

    from scripts.platform_roadmap_state import load, PlatformRoadmapState;

    pd=Path(''docs/plans'');

    base=subprocess.run([''git'',''show'',''origin/main:docs/ROADMAP-PLATFORM.yaml''],capture_output=True,text=True).stdout;

    p=pathlib.Path(tempfile.mkdtemp())/''base.yaml''; p.write_text(base);

    b=PlatformRoadmapState(load(p)).to_preflight_dict(plans_dir=pd);

    h=PlatformRoadmapState(load(Path(''docs/ROADMAP-PLATFORM.yaml''))).to_preflight_dict(plans_dir=pd);

    changed=sorted(k for k in b if b[k]!=h[k]);

    assert changed==[''blocked_on_cd''], (''UNEXPECTED KEYS'', changed);

    bb={e[''id'']:e[''blocking_cds''] for e in b[''blocked_on_cd'']}; hh={e[''id'']:e[''blocking_cds''] for e in h[''blocked_on_cd'']};

    delta={k:(bb.get(k),hh.get(k)) for k in set(bb)|set(hh) if bb.get(k)!=hh.get(k)};

    assert delta=={''T1.5'':([''CD.10'',''CD.17''],[''CD.10''])}, (''UNEXPECTED DELTA'', delta);

    print(''OK projection delta bounded to T1.5'')'
