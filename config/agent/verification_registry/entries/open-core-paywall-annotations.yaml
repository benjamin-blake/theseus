check_id: open-core-paywall-annotations
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: open-core-paywall-and-repo-topology
graduated_at: '2026-09-28'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n'', t, re.M) if ''Open-core
    paywall on organisational scale'' in m.group(2)]; assert len(es)==1, ''paywall
    Decision absent''; n=es[0].group(1); blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^##
    Decision |\Z)'', t, re.M|re.S).group(0); A=r''> \*\*Amended by Decision ''+n+r''
    \(\d{4}-\d{2}-\d{2}\):\*\*''; amd={''184'':[''adapter residency is decided'',''stay
    public'',''only hosted compute is paid'',''discharged for clause 1 only'',''Decision
    171 grant leg'',''Decision 194 clause 4'',''T4.24 c6'',''managed control plane'',''metadata
    only'',''released versions of the core''],''178'':[''products live in the products
    monorepo matching their visibility'',''public products monorepo'',''closed-code
    products'',''Decision 198 clause 1'',''paid control plane'',''platform-only'',''never
    a product''],''101'':[''Point (f)'',''further discharged for boundary and architecture
    only'',''organisational scale'',''metadata-only managed control plane'',''No commercial
    surface, pricing or terms'',''rest of that deferral stands'',''point (d) binds
    any public docs site'']}; keep={''184'':''whether they remain open or move private
    is OPEN'',''178'':''hosted products live in their own repositories and import
    it'',''101'':''Public-content boundary''}; place={''184'':(''**Related:**'',None),''178'':(''**Intent:**'',''**Problem:**''),''101'':(''**Warehouse
    ID:**'',''**Problem:**'')}; got={k:[l for l in blk(k).splitlines() if re.match(A,
    l)] for k in amd}; probs=[(k,''no Amended-by line citing ''+n) for k in amd if
    not got[k]]; assert not probs, probs; probs=[(k,[w for w in ws if w not in got[k][-1]])
    for k,ws in amd.items() if [w for w in ws if w not in got[k][-1]]]+[(k,''retired
    name in appended line'') for k in amd if ''Theseus'' in got[k][-1]]+[(k,''original
    body edited (Decision 177)'') for k,s in keep.items() if s not in blk(k)]+[(k,''Amended-by
    line misplaced'') for k,(lo,hi) in place.items() if not (blk(k).find(lo) < blk(k).find(got[k][-1])
    and (hi is None or blk(k).find(got[k][-1]) < blk(k).find(hi)))]; assert not probs,
    probs; s184=len(blk(''184'').encode(''utf-8'')); assert s184<=6144, (''Decision
    184 over 6144'', s184); print(''PAYWALL_ANNOTATIONS_OK'', n, s184)"'
