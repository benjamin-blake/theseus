check_id: structural-residual-default-row
primitive_slot: command_exit_zero
guard_target: config/structural_size_budgets.yaml
guard_symbol: null
plan_slug: size-gov-engine
graduated_at: '2026-08-04'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - |
    from scripts.checks.structural import _classify
    rows=_classify.load_registry()['classes']
    slugs=[r['slug'] for r in rows]
    assert slugs[-1]=='residual', 'residual must be the LAST row, got: ' + str(slugs)
    assert slugs.count('residual')==1, 'duplicate residual row'
    assert rows[-1]['limit']==500, 'residual limit must be 500, got: ' + str(rows[-1]['limit'])
    assert _classify.classify_path('some/new/surface.hcl2')=='residual', 'unmatched extension is not govern-by-default'
    assert _classify.classify_path('migrations/ducklake_ops_schema.sql')=='residual', 'an unmatched tracked file must land in residual'
    assert len(rows)==12, 'class table must have exactly 12 rows, got: ' + str(len(rows))
    roadmaps=[r for r in rows if r['slug']=='roadmaps'][0]
    assert roadmaps['limit']==500, 'roadmaps class limit must be 500 -- the designed 6,000 ceiling is SGE-05 to ratify, got: ' + str(roadmaps['limit'])
    assert list(roadmaps['defer_to_incumbent'])==['docs/ROADMAP-PLATFORM.yaml'], 'PLATFORM must be the ONLY deferred roadmaps path, by exact filename: ' + str(list(roadmaps['defer_to_incumbent']))
    print('RESIDUAL_GOVERNS_BY_DEFAULT')
