check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for
    m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''User-owned
    CLI persona backend'' in m.group(2)]; assert len(es)==1, ''CLI-backend Decision absent''; n=es[0].group(1);
    blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    amd={''164'':[''user-owned claude_cli'',''prices the collapse'',''every CD.27 arm'',''no arm leaves
    the set'',''T4.15 c11'',''whole CLI run'',''Reversal (b)'']}; upd={''122'':[''clarified reading'',''every
    AI API call On The Loop code makes'',''LiteLLM'',''subscription-only'',''BYOK'',''not an amendment''],''173'':[''clarifies'',''every
    AI API call On The Loop code makes'',''deployments On The Loop operates'',''BYOK'',''fills no role'',''clause
    4''],''116'':[''user-owned CLI backend class'',''clause 4'',''hosted paid plane'',''T4.26''],''184'':[''Clause
    4'',''post-MVP'',''T4.27''],''199'':[''persona_backend'',''billing_shape'',''metered_marginal'',''cost-per-verified-merge'',''(persona,
    backend)'',''contract'']}; keep={''122'':''Ratifies CD.28 AS AMENDED BY Decision 116'',''164'':''Any
    future proposal to reopen persona routing MUST'',''116'':''Routine/non-agentic agents'',''173'':''The
    tiers are ROLES'',''184'':''Consumer-subscription OAuth is not a Theseus product credential'',''199'':''Event
    journal''}; probs=[]; lines=lambda k,pat: [l for l in blk(k).splitlines() if re.match(pat, l) and
    ''Decision ''+n in l]; A=r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*''; U=r''>
    \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\*''; [probs.append((k,''no Amended-by line'')) for k in amd if
    not lines(k, A)]; [probs.append((k,''no Update line citing ''+n)) for k in upd if not lines(k, U)];
    assert not probs, probs; got={**{k:lines(k,A)[-1] for k in amd},**{k:lines(k,U)[-1] for k in upd}};
    [probs.append((k,[w for w in ws if w not in got[k]])) for k,ws in {**amd,**upd}.items() if [w for
    w in ws if w not in got[k]]]; [probs.append((k,''retired name in appended line'')) for k,l in got.items()
    if ''Theseus'' in l]; [probs.append((k,''original body edited (Decision 177)'')) for k,s in keep.items()
    if s not in blk(k)]; assert not probs, probs; s184=len(blk(''184'').encode(''utf-8'')); assert s184<=6144,
    (''Decision 184 over 6144'', s184); print(''CLI_BACKEND_ANNOTATIONS_OK'', n, s184)'
  expected: ^CLI_BACKEND_ANNOTATIONS_OK\b
  use_regex: true
