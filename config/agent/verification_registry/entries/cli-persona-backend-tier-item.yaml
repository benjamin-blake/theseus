  - import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); its=[x for x in d['tier_items']
    if 'PLAN-cli-persona-backend' in str(x.get('note',''))]; assert len(its)==1, ('expected exactly one
    item owned by this plan', [x['id'] for x in its]); t=its[0]; tid=t['id']; assert t['depends_on']==['T4.2'],
    t['depends_on']; live=[x['id'] for x in d['tier_items'] if t['status']=='deferred_post_mvp' and x['status']
    in ('not_started','in_progress') and tid in (x.get('depends_on') or [])]; assert not live, ('live
    items depend on the deferred item (Decision 93)', live); ec={c['id']:c for c in t['exit_criteria']};
    assert {'c%d'%i for i in range(1,15)}<=set(ec), sorted(ec); e=' '.join(c['text'] for c in t['exit_criteria']);
    assert all(w in e for w in ('Decision 164','T4.10a','Decision 199','run_persona','paid plane','current
    vendor terms')), 'placeholder pinned tokens lost'; assert ec['c1']['status']=='rehomed' and ec['c1'].get('met_by')=='T4.15',
    (ec['c1']['status'], ec['c1'].get('met_by')); need={'c5':['--system-prompt','--append-system-prompt','--max-turns','stream-json','subprocess','bypass-permissions','failure_outputs'],'c6':['--bare','OAuth','never
    by permission prompts','CLAUDE.md','Decision 117'],'c7':['prompt-hash','capability-to-tool','same
    output schema','stream-json','Decision 199 events'],'c8':['@anthropic-ai/claude-code','conformance
    suite','Decision 74','--version'],'c9':['concurrency 1','paused_until','retry storm','litellm backend'],'c10':['names,
    never values','allowlist','ANTHROPIC_API_KEY','subscription-only','auth_method','refuses','across
    people'],'c11':['Node','digest-pinned image','claude setup-token','verdict personas','Fargate','never
    Lambda'],'c12':['tolerance','cost-per-verified-merge','turns and tokens','parity-unheld'],'c13':['ordinary,
    individual usage','account risk','no GitHub App','expiry','Decision 127'],'c14':['codex_cli','OpenAI']};
    miss={k:[w for w in ws if w not in ec[k]['text']] for k,ws in need.items() if [w for w in ws if w
    not in ec[k]['text']]}; assert not miss, miss; bl={k:[b['ref'] for b in (ec[k].get('blocked_by') or
    [])] for k in ('c11','c13')}; assert all(v==['T4.24'] for v in bl.values()), bl; assert not [k for
    k in need if 'Theseus' in ec[k]['text']], 'retired name used'; rd=set(t.get('related_decisions') or
    []); assert {164,184,185,199}<=rd and len(rd)>=6, rd; print('CLI_BACKEND_ITEM_OK', tid)
  expected: ^CLI_BACKEND_ITEM_OK\b
