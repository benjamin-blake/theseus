check_id: placement-mirror-resolves-to-concern-split-package
primitive_slot: command_exit_zero
guard_target: scripts/test_coverage_checker.py
plan_slug: red-case-floor
graduated_at: '2026-09-11'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - '

    import pathlib

    from scripts.test_coverage_checker import ROOT, check_test_file_exists, map_source_to_test

    src = pathlib.Path(''scripts/checks/hygiene/validate_placement.py'')

    target = map_source_to_test(src)

    assert target == ROOT / ''tests'' / ''checks'' / ''hygiene'' / ''validate_placement'',
    (''expected the concern-split package dir, got'', target)

    assert target.is_dir(), ''the concern-split target must be a real directory''

    assert sorted(p.name for p in target.glob(''test_*.py'')), ''the package must
    hold test modules''

    ok, why = check_test_file_exists(src)

    assert ok, (''mirror must resolve after the registration; got'', ok, why)

    assert why == ''test package found'', why

    print(''PLACEMENT_MIRROR_RESOLVES'')

    '
