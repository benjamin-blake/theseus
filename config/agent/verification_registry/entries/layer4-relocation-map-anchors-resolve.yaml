check_id: layer4-relocation-map-anchors-resolve
primitive_slot: command_exit_zero
guard_target: docs/contracts/instruction-architecture.yaml
guard_symbol: null
plan_slug: skills-layer-prose-relocation
graduated_at: '2026-09-12'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import yaml,pathlib,sys

    P=pathlib.Path

    m=yaml.safe_load(P(''docs/contracts/instruction-architecture.yaml'').read_text()).get(''layer4_relocation_map'')

    sys.exit(1) if not m else None

    sk={''planning'': P(''.claude/skills/planning/SKILL.md'').read_text(), ''implement'':
    P(''.claude/skills/implement/SKILL.md'').read_text()}

    def_res=lambda doc,keys: doc if not keys else (None if not isinstance(doc,dict)
    or keys[0] not in doc else def_res(doc[keys[0]], keys[1:]))

    bad=[]

    [bad.append(1) for r in m if r.get(''surface'') not in sk]

    [bad.append(1) for r in m if r.get(''surface'') in sk and r[''stub_heading'']
    not in sk[r[''surface'']]]

    rows=[r for r in m if ''#'' in str(r.get(''destination'',''''))]

    [bad.append(1) for r in rows if not P(r[''destination''].split(''#'')[0]).exists()]

    [bad.append(1) for r in rows if P(r[''destination''].split(''#'')[0]).exists()
    and def_res(yaml.safe_load(P(r[''destination''].split(''#'')[0]).read_text()),
    r[''destination''].split(''#'')[1].split(''.'')) is None]

    sys.exit(1 if bad else 0)'
