check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); cd=[c for c in d[''candidate_decisions''] if c[''id'']==''CD.27''][0]; rp=[p for p in cd[''discipline_points'']
    if isinstance(p,dict) and ''resume_properties'' in p]; assert len(rp)==1, f''resume_properties must be defined exactly once, found {len(rp)}''; props=rp[0][''resume_properties'']; assert set(props)=={''P1'',''P2'',''P3''},
    f''expected exactly P1/P2/P3, got {sorted(props)}''; t41=[i for i in d[''tier_items''] if i[''id'']==''T4.1''][0]; t42=[i for i in d[''tier_items''] if i[''id'']==''T4.2''][0]; c1=t42[''exit_criteria''][0];
    nodes=[l for l in t41[''intent''].splitlines() if ''['' in l and ''T4.2]'' in l]; assert len(nodes)==4, f''expected 4 persona-node typings, found {len(nodes)}''; personas=[p for p in cd[''discipline_points'']
    if isinstance(p,str) and ''Agent personas'' in p]; assert len(personas)==1, f''expected 1 personas discipline point, found {len(personas)}''; fargate=[p for p in cd[''discipline_points''] if isinstance(p,str)
    and ''ECS Run Task escape hatch'' in p]; assert len(fargate)==1, f''expected 1 Fargate escape-hatch discipline point, found {len(fargate)}''; banned=[''checkpoint-replay'',''durable function'',''forced
    timeout'',''replay'']; property_bound={''c1'':c1,''personas_discipline_point'':personas[0],''fargate_discipline_point'':fargate[0]}; property_bound.update({f''node[{n}]'':t for n,t in enumerate(nodes)});
    descriptive={''cd_title'':cd[''title''],''narrowly_supersedes_clause'':cd[''narrowly_supersedes''][''clause'']}; allsites={**property_bound, **descriptive}; hits={k:[b for b in banned if b in v.lower()]
    for k,v in allsites.items()}; hits={k:v for k,v in hits.items() if v}; assert not hits, f''mechanism vocabulary survives at a de-mechanised site: {hits}''; missing={k:[p for p in (''P1'',''P2'',''P3'')
    if p not in v] for k,v in property_bound.items()}; missing={k:v for k,v in missing.items() if v}; assert not missing, f''contract text does not reference the resume properties: {missing}''; assert ''workspace''
    in c1.lower(), ''c1 must assert workspace continuity (ESB-01 half)''; print(''OK'', sorted(props), len(nodes), ''nodes;'', len(property_bound), ''property-bound sites;'', len(descriptive), ''descriptive
    sites; all 9 mechanism-free'')"'
