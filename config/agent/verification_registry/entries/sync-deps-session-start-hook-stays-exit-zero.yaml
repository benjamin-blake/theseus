check_id: sync-deps-session-start-hook-stays-exit-zero
primitive_slot: command_exit_zero
guard_target: bin/sync-deps.sh
guard_symbol: null
plan_slug: sync-deps-test-hermeticity
graduated_at: '2026-08-31'
graduated_by: implement-agent
check_spec:
  command:
  - timeout
  - '60'
  - bash
  - -c
  - d=$(mktemp -d) && mkdir -p "$d/bin" "$d/.venv" "$d/.claude/hooks" && cp bin/sync-deps.sh "$d/bin/" && cp .claude/hooks/session_start_sync_deps.sh
    "$d/.claude/hooks/" && printf "six==1.16.0\n" > "$d/requirements.txt" && printf "typing-extensions==4.12.2\n" > "$d/requirements-dev.txt"
    && (cd "$d" && sha256sum requirements.txt requirements-dev.txt | sha256sum | awk '{print $1}' | tr -d "\n" > .venv/.requirements-fingerprint)
    && (cd "$d" && env PATH=/usr/bin:/bin HOME="$d/home" INSTALL_TERRAFORM=1 bash .claude/hooks/session_start_sync_deps.sh
    > "$d/out" 2>&1; echo "hook_exit=$?" >> "$d/out") && grep -q "hook_exit=0" "$d/out" && grep -q "ERROR" "$d/out" && grep
    -q "config/terraform-version" "$d/out" && ! grep -q "installing terraform" "$d/out" && echo VERIFIED && rm -rf "$d"
