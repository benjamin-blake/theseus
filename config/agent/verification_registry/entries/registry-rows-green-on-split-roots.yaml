check_id: registry-rows-green-on-split-roots
primitive_slot: command_exit_zero
guard_target: config/agent/verification_registry/entries/
guard_symbol: null
plan_slug: terraform-decompose-oidc-rename
graduated_at: '2026-08-14'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import sys

    from scripts.verification_graduation import load_entries, materialize_check

    entries=load_entries()

    rows=[e for e in entries if e.get(''plan_slug'')!=''terraform-decompose-oidc-rename'' and ''materialize_check'' not in str(e.get(''check_spec'')) and (''terraform/personal'' in str(e.get(''check_spec''))
    or ''terraform/bootstrap'' in str(e.get(''check_spec'')))]

    bad=[e[''check_id''] for e in rows if materialize_check(e).run().status.name != ''PASS'']

    print(''rows='',len(rows),'' failing='',bad)

    sys.exit(1 if bad else 0)

    '
