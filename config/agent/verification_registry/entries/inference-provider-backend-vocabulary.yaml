check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import yaml,re,pathlib; t0=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); N=[m.group(1)
    for m in re.finditer(r''^## Decision (\d+): (.*)$'', t0, re.M) if ''User-owned CLI persona backend''
    in m.group(2)]; assert len(N)==1, N; d=yaml.safe_load(open(''docs/contracts/inference-provider.yaml''));
    n=d[''tier_model''][''note'']; assert n.startswith(''LiteLLM is the only Layer-1 inference protocol
    surface under CD.28. Direct provider-SDK imports are forbidden in the executor and in scripts/llm/client.py.''),
    n; assert all(w in n for w in (''every AI API call On The Loop code makes'',''claude_cli'',''fills
    no role'',''litellm_tier_models'',''BYOK'',''T4.2'',''T4.12'',''github-models'')), n; assert ''Decision-''+N[0]
    in d[''decisions_cited''], d[''decisions_cited'']; v=d[''vocabulary'']; ax=v[''axes'']; assert {''persona_backend'',''billing_shape'',''credential_holder'',''auth_method''}<=set(ax),
    sorted(ax); pb=ax[''persona_backend'']; assert {''litellm'',''claude_cli''}<=set(pb[''values'']) and
    ''codex_cli'' in set(pb[''values''])|set(pb.get(''reserved'') or []), pb; assert {''on_the_loop'',''end_user''}<=set(ax[''credential_holder''][''values'']),
    ax[''credential_holder'']; assert {''subscription_stored_login'',''subscription_setup_token'',''api_key''}<=set(ax[''auth_method''][''values'']),
    ax[''auth_method'']; tm=v[''terms'']; assert {''claude'',''claude_code'',''claude_api'',''subscription'',''byok'',''ai_api_call''}<=set(tm),
    sorted(tm); assert ''T4.12'' in tm[''ai_api_call''][''reserved_meaning''] and ''T4.26'' in ax[''credential_holder''][''reserved_meaning''],
    ''realization and first-party carve-outs missing''; bad=[k for k,e in {**ax,**tm}.items() if not (e.get(''reserved_meaning'')
    and e.get(''do_not_use_for''))]; assert not bad, (''entries lacking reserved_meaning/do_not_use_for'',
    bad); assert ''Theseus'' not in yaml.safe_dump(v); rows=[r for r in d[''amendment_log''] if ''PLAN-cli-persona-backend''
    in str(r.get(''summary'',''''))]; assert len(rows)==1 and rows[0][''semantic_break''] is False, rows;
    print(''INFERENCE_PROVIDER_VOCABULARY_OK'')'
  expected: ^INFERENCE_PROVIDER_VOCABULARY_OK\b
  use_regex: true
