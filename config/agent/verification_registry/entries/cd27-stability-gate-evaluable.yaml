check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); cd=[c for c in d[''candidate_decisions''] if c[''id'']==''CD.27''][0]; sd=[p for p in cd[''discipline_points'']
    if isinstance(p,dict) and ''stability_definition_14d'' in p]; assert len(sd)==1, f''expected exactly 1 stability_definition_14d, found {len(sd)}''; s=sd[0][''stability_definition_14d'']; blob=yaml.safe_dump(s).lower();
    banned=[b for b in (''checkpoint-replay'',''durable function'',''forced timeout'',''replay'') if b in blob]; assert not banned, f''mechanism vocabulary survives in the stability definition: {banned}'';
    sig=s[''signals''][''unplanned_resume_rate'']; assert sig.get(''denominator'') and sig.get(''exempt''), sig; assert s.get(''baseline_window''), ''baseline_window missing''; thr=s[''days_1_7_absolute_thresholds''];
    assert thr==''TBD_at_T4.2_atomic_plan'', f''days-1-7 thresholds must carry the deferral marker verbatim, got {thr}''; stale=[q for q in cd[''discipline_points''] if isinstance(q,dict) and any(''stable
    for 14 days'' in str(k) for k in q)]; assert not stale, f''the OLD prose stability entry survives beside the structured one: {[list(q)[0][:60] for q in stale]}''; we=s[''worked_example'']; assert {''inputs'',''computed'',''verdict''}<=set(we),
    sorted(we); inp=we[''inputs'']; assert inp.get(''scheduled_continuations'',0) > 0, ''the worked example must actually exercise the scheduled-continuation exemption''; derived=inp[''unplanned_resumes'']/inp[''persona_node_executions''];
    assert abs(we[''computed''][''unplanned_resume_rate'']-derived) < 1e-9, f\"recorded {we[''computed''][''unplanned_resume_rate'']} != derived-from-inputs {derived}\"; assert derived < 0.05, f''worked
    example rate {derived} contradicts the <5% threshold''; vd=we[''verdict'']; assert isinstance(vd,dict) and vd.get(''signal_passes'') is True, f''verdict must be a mapping carrying an explicit boolean
    signal_passes:true, got {vd}''; assert ''fires'' not in vd, ''verdict must not carry a fires key -- it overclaims relative to a single-signal worked example (M2, code-review round 1)''; print(''OK derived
    rate'', derived, ''scheduled_continuations'', inp[''scheduled_continuations''], ''signal_passes'', vd[''signal_passes''], ''marker'', thr)"'
