check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); tf=[(i[''id''],f.split(''#'')[0].strip()) for i in d[''tier_items''] if i[''id''].startswith(''T4.'') for f
    in (i.get(''files_in_scope'') or []) if f.split(''#'')[0].strip().endswith(''.tf'')]; ex=[(t,p) for t,p in tf if p.rsplit(''/'',1)[-1].startswith(''executor_'')]; bad=[(t,p) for t,p in ex if not p.startswith(''terraform/personal/'')];
    assert not bad, f''executor .tf still under the retired root: {bad}''; assert len(ex)>=5, ex; nonex=[(t,p) for t,p in tf if not p.rsplit(''/'',1)[-1].startswith(''executor_'')]; assert (''T4.12'',''terraform/scheduled_agents.tf'')
    in nonex, ''T4.12 scheduled_agents.tf must remain untouched at the legacy root''; print(''OK'', len(ex), ''executor .tf paths under terraform/personal/;'', len(nonex), ''non-executor path(s) correctly
    excluded'')"'
