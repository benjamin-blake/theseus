check_id: structural-decision-166-authorizes-every-roster-key
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: size-gov-engine
graduated_at: '2026-08-04'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'from scripts.checks import _marker_guard as mg

    from scripts.checks.structural import _classify

    reg=_classify.load_registry()

    keys=sorted(set(reg.get(''budgets'') or {}) | set(reg.get(''long_line_budgets'') or {}))

    bodies=mg.load_decision_bodies()

    unbacked=[k for k in keys if mg.authorization_failure(''dec-166'', k, bodies)]

    assert not unbacked, f''Decision 166 does not authorize: {unbacked}''

    two_seg=[k for k in keys if len(k.split(''/''))==2]

    assert len(two_seg)>=5, f''expected at least 5 two-segment keys, found {two_seg}''

    assert len(keys)==15, ''expected 15 distinct roster keys (16 entries, registry.yaml in both rosters), found: '' + str(len(keys))

    print(''ALL_ROSTER_KEYS_AUTHORIZED'')

    '
