check_id: python-version-file-matches-required-minor
primitive_slot: command_exit_zero
guard_target: .python-version
guard_symbol: null
plan_slug: dependabot-automation-root-fix
graduated_at: '2026-09-13'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - import pathlib,re; v=pathlib.Path('.python-version').read_text(encoding='utf-8').strip();
    w=pathlib.Path('bin/venv-python').read_text(encoding='utf-8'); m=re.search(r'^REQUIRED_PYTHON_MINOR="([0-9]+[.][0-9]+)"$',
    w, re.M); assert m, 'bin/venv-python declares no REQUIRED_PYTHON_MINOR'; assert
    v == m.group(1) or v.startswith(m.group(1) + '.'), f'.python-version {v!r} does
    not match {m.group(1)!r}'; print('OK', v)
