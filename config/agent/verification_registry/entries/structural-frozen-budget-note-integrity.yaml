check_id: structural-frozen-budget-note-integrity
primitive_slot: command_exit_zero
guard_target: scripts/checks/structural/size_limits.py
guard_symbol: escape_violations
plan_slug: roadmap-size-ceiling
graduated_at: '2026-08-05'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - |
    import copy
    from scripts.checks.structural.size_limits import escape_violations
    from scripts.checks.structural._classify import load_registry
    K = "docs/contracts/decision-entry.yaml"
    L = load_registry()
    assert L["budget_notes"][K]["frozen"] is True, "the freeze record is absent or not frozen"
    assert L["budgets"][K] == 508, "the frozen pin moved off 508"
    assert escape_violations(L) == [], "live frozen state is not clean"
    def e4(m):
        return [x for x in escape_violations(m) if x.startswith("E4:")]
    m = copy.deepcopy(L)
    m["budget_notes"]["docs/NOT-A-REAL-FILE.yaml"] = dict(m["budget_notes"][K])
    assert e4(m), "E4 must reject a budget_notes key with no budgets entry"
    m2 = copy.deepcopy(L)
    m2["budgets"].pop(K)
    assert e4(m2), "E4 must reject a frozen note whose budgets entry was removed"
    m3 = copy.deepcopy(L)
    GONE = "docs/GONE-AFTER-MIGRATION.yaml"
    m3["budgets"][GONE] = 100
    m3["budget_notes"][GONE] = dict(m3["budget_notes"][K])
    v3 = e4(m3)
    assert any("exist" in x for x in v3), "E4 must REPORT a missing frozen path, never raise: " + str(v3)
    m4 = copy.deepcopy(L)
    [r for r in m4["classes"] if r["slug"] == "roadmaps"][0]["defer_to_incumbent"][K] = {
        "incumbent": "validate_platform_roadmap", "authorized_by": "dec-166"}
    assert e4(m4), "E4 must reject deferring a FROZEN path -- measured: that un-governs it entirely"
    print("FROZEN_NOTE_INTEGRITY_OK")
