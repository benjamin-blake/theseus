check_id: structural-modules-under-own-limit
primitive_slot: command_exit_zero
guard_target: scripts/checks/structural
guard_symbol: null
plan_slug: size-gov-engine
graduated_at: '2026-08-04'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import pathlib

    mods=[p for p in sorted(pathlib.Path(''scripts/checks/structural'').glob(''*.py'')) if p.name != ''__init__.py'']

    assert len(mods)>=3, ''expected the decomposed package, found: '' + str([p.name for p in mods])

    eff=lambda p: len([x for x in p.read_text(encoding=''utf-8'').splitlines() if x.strip() and not x.strip().startswith(''#'')])

    oversized=[(str(p), eff(p)) for p in mods if eff(p) > 500]

    assert not oversized, ''oversized new modules -- decompose, do not raise: '' + str(oversized)

    budgets=pathlib.Path(''config/sloc_budgets.yaml'').read_text(encoding=''utf-8'')

    assert ''checks/structural'' not in budgets, ''a structural module was registered in the SLOC budget registry''

    v=pathlib.Path(''scripts/validate.py'')

    vs=len([x for x in v.read_text(encoding=''utf-8'').splitlines() if x.strip() and not x.strip().startswith(''#'')])

    assert vs <= 500, ''scripts/validate.py is over the SLOC limit at '' + str(vs) + '' -- reclaim a line, do not register it''

    assert ''scripts/validate.py'' not in budgets, ''scripts/validate.py was registered in the SLOC budget registry -- forbidden by Decision 128 and acceptance criterion 10''

    assert max(len(x) for x in v.read_text(encoding=''utf-8'').splitlines()) <= 127, ''a scripts/validate.py line breaches ruff line-length 127''

    print(''SELF_SUBJECT_OK'')

    '
