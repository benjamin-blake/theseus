check_id: ducklake-partition-rewrite-governance
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
plan_slug: ducklake-partition-layout-remediation
graduated_at: '2026-09-26'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import yaml, re;

    dec=open(''docs/DECISIONS.md'', encoding=''utf-8'').read();

    hdr=[h for h in re.findall(r''^## Decision (\d+):(.*)$'', dec, re.M) if ''partition-layout rewrite'' in h[1].lower()];

    assert len(hdr)==1 and hdr[0][0]==''204'', hdr; n=hdr[0][0];

    body=lambda k: dec.split(''## Decision ''+k+'':'',1)[1].split(chr(10)+''## Decision '',1)[0];

    assert ''amends: [81, 126, 192]'' in body(n), ''envelope amends'';

    assert all(''Decision ''+n in body(k) for k in (''81'',''126'',''192'')), ''annotations on 81/126/192'';

    from scripts.contracts import load_contract; load_contract(''docs/contracts/ducklake_maintenance.yaml'');

    m=yaml.safe_load(open(''docs/contracts/ducklake_maintenance.yaml'', encoding=''utf-8''));

    assert ''reconcile_partitions'' in m[''verbs''] and ''rewrite_partition_layout'' in m[''verbs''] and ''procedure'' not
    in m, ''maintenance contract'';

    pc=yaml.safe_load(open(''docs/contracts/ducklake-partition-remediation.yaml'', encoding=''utf-8''));

    assert pc[''contract''][''class'']==''D'' and pc[''contract''][''subject'']==''ducklake-partition-remediation'', ''procedure
    contract header'';

    assert ''EXCEPT'' in str(pc[''procedure'']) and ''rec-4098'' in str(pc), ''procedure formula and residual owner'';

    fr=yaml.safe_load(open(''docs/contracts/file-router.yaml'', encoding=''utf-8''))[''routes''];

    assert any(r[''topic'']==''ducklake-partition-remediation'' for r in fr), ''file-router route'';

    dp=open(''docs/contracts/deploy-paths.yaml'', encoding=''utf-8'').read();

    assert ''ducklake-partition-remediation.yaml'' in dp and ''rewrite_partition_layout'' in dp, ''deploy-paths'';

    assert ''used only for IAM changes and IAM planning'' not in open(''docs/contracts/terraform-cc-web-operations.yaml'',
    encoding=''utf-8'').read(), ''tf-ops stale sentence'';

    g=yaml.safe_load(open(''docs/contracts/git-ops.yaml'', encoding=''utf-8''))[''branching_topology''][''containers''];

    assert ''Decision ''+n in [c for c in g if c[''name'']==''ADMIN''][0][''use''], ''git-ops ADMIN use'';

    dm=yaml.safe_load(open(''docs/contracts/data-modeling-standard.yaml'', encoding=''utf-8''));

    assert ''Decision ''+n in [r for r in dm[''rules''] if r[''id'']==''append-only-default-not-ban''][0][''statement''],
    ''standard'';

    rm=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'', encoding=''utf-8''));

    c8=[c for c in [t for t in rm[''tier_items''] if t[''id'']==''T2.19''][0][''exit_criteria''] if c[''id'']==''c8''][0];

    assert ''Decision ''+n in c8[''text''], ''T2.19:c8'';

    print(''PARTITION_REWRITE_GOVERNANCE_OK'', n)'
