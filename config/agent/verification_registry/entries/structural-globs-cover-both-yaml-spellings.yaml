    assert len(yamls)>=28, f''population anchor moved: {len(yamls)} -- re-derive before relaxing''

    assert len(hit)==len(yamls), f''ci_workflows glob covers {len(hit)} of {len(yamls)} -- both spellings required (rec-2928)''

    assert _classify.classify_path(''config/agent/probe.yml'')==''config'' and _classify.classify_path(''config/agent/probe.yaml'')==''config'', ''config row misses a spelling''

    print(''BOTH_SPELLINGS_COVERED'')

