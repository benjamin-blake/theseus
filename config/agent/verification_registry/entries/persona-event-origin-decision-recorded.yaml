check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for
    m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''keys
    on GitHub event origin'' in m.group(2)]; assert len(es)==1, (''expected exactly one event-origin Decision
    entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0); fence=''^''+chr(96)*3+''yaml'';
    assert re.search(fence+r''\s*\nnumber: ''+n+r''\b'', b, re.M), ''no bare yaml envelope carrying number
    ''+n; assert ''value: numbered_decision'' in b, ''envelope lacks value: numbered_decision''; assert
    chr(10)+''amends: [184, 87, 116, 73]''+chr(10) in b, ''envelope amends list is not [184, 87, 116,
    73]''; sz=len(b.encode(''utf-8'')); need=[''comfortably inside'',''GitHub-originated repository event'',''pull_request,
    push, workflow_run'',''outside GitHub'',''repository_dispatch'',''workflow_dispatch'',''maintainer'',''deterministic
    run'',''decision-scout'',''plan-critique'',''code-review'',''any PR changing code'',''ci-rca'',''subagent-plan-review'',''claude.yml'',''persona
    compute'',''general-computing'',''workspace-mutating'',''verdict plane'',''pull_request_target'',''default
    branch'',''THIN SHELL'',''digest-pinned container image'',''run_persona entrypoint'',''local container
    twin'',''No persona logic lives in workflow YAML'',''never reads GITHUB_TOKEN'',''only GitHub-aware
    layer'',''shell change, never a persona change'',''check run on the head SHA'',''dedicated verdict
    App'',''Checks API'',''merges by SHA'',''push-to-main'',''rec-curator'',''transcript-review'',''scheduler
    port'',''T4.24'',''T4.15 c10'',''never a credential On The Loop holds or intermediates'',''user-owned
    CLI backend'',''sole inference lane On The Loop holds'',''unattended'',''T4.26'',''PLAN-cli-persona-backend'',''Decision
    199'',''ops_execution_plans'',''(plan_path, head_sha)'',''Decision 85'',''Decision 197'',''check-run
    output'',''docs/plans/**'',''fast tier'',''Main Canary'',''long_running_container'',''three Lambda-variant
    arms'',''P1-P3'',''Options considered'',''yaml reversal-conditions'',''vendor-terms'',''rec-3386''];
    miss=[p for p in need if p not in b]; assert not miss, (''event-origin Decision text missing'', miss);
    edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'', b); assert edges==[''184''],
    (''unexpected amends/supersedes edges in the entry body'', edges); print(''DEC_EVENT_ORIGIN_OK'',
    n, sz)'
