check_id: platformdev-scope-class-decision-present
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: ci-convergence-fixes
graduated_at: '2026-08-31'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,subprocess,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text();

    ns=sorted(int(m) for m in re.findall(r''^## Decision (\d+):'', t, re.M)); n=ns[-1];

    b=t.split(f''## Decision {n}:'')[1].split(''\n## Decision '')[0];

    req=[''significance:'',''PlatformAdmin'',''PlatformDev'',''129'',''157'',''144'',''UpdateRole''];

    miss=[r for r in req if r not in b]; assert not miss, f''Decision {n} missing:
    {miss}'';

    full=f''## Decision {n}:''+b;

    assert len(full.encode()) <= 6144, f''entry is {len(full.encode())}B over the
    6144B cap'';

    old=subprocess.run([''git'',''show'',''origin/main:docs/DECISIONS.md''],capture_output=True,text=True,check=True).stdout.split(''##
    Decision 144:'')[1].split(''\n## Decision '')[0];

    assert old.strip() in t, ''Decision 144 body was spliced, not left intact'';

    print(''Decision'',n,len(full.encode()),''bytes'')'
