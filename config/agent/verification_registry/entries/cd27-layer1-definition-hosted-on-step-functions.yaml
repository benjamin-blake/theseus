check_spec:
  command:
  - bin/venv-python
  - -c
  - import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); cd=[c for c in d['candidate_decisions'] if c['id']=='CD.27'][0];
    det=cd['detail']; assert re.search(r'^\s*1\. Loop definition', det, re.M), 'CD.27 layer 1 is not headed Loop definition';
    assert 'ASL' in det and 'cloud-tier host' in det, 'layer 1 does not name the ASL subset and the cloud-tier host'; assert
    'NOT an in-executor escape-hatch task' in det, 'escape-hatch phrase lost'; assert 'Native Parallel state fans out critic
    personas' in det, 'native-construct sentence lost'; pts=[p for p in cd['discipline_points'] if isinstance(p,str)]; assert
    any(('scoped supersession' in p and 'Decision 39' in p and 'free-tier' in p) for p in pts), 'no discipline point records
    the free-tier host as a scoped Decision 39 supersession'; assert any((p.startswith('Layer-2 ratification precondition
    (ESB-04)') and 'MANAGED orchestration primitive' in p) for p in pts), 'ESB-04 clause no longer verbatim'; assert any(('hosted_cli_runner'
    in p and 'eliminated' in p) for p in pts), 'hosted_cli_runner elimination not annotated on the pinned set'; fsp=[p for
    p in cd['discipline_points'] if isinstance(p,dict) and 'fallback_spec' in p]; assert len(fsp)==1 and 'eliminated' in fsp[0]['fallback_spec']['lapse_condition'],
    'fallback_spec.lapse_condition still names hosted_cli_runner as a live example'; print('OK')
