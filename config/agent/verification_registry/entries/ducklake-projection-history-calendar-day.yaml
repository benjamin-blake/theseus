check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import yaml;

    d=yaml.safe_load(open(''config/lambda/ducklake/field_semantics.yaml'', encoding=''utf-8''));

    T=''year(created_timestamp), month(created_timestamp), day(created_timestamp)'';

    hs=[d[''partition_transforms''][''history''], d[''tables''][''history''][''partition'']]+[v[''partition''][''history''] for v in d[''ops_tables''].values() if ''history'' in v.get(''partition'', {})];

    bad=[h for h in hs if h != T]; assert not bad, bad;

    print(''HISTORY_CALENDAR_DAY'', len(hs))"'
  expected: HISTORY_CALENDAR_DAY 7
  use_regex: true
