check_spec:
  command:
  - bin/venv-python
  - -c
  - import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); ti={x['id']:x for x in d['tier_items']};
    t=ti['T4.1']; it=t['intent']; nodes=[l for l in it.splitlines() if '[' in l and 'T4.2]' in l]; assert
    len(nodes)==2 and 'plan_agent' in nodes[0] and 'implement_agent' in nodes[1], ('expected exactly the
    plan_agent and implement_agent persona typings', nodes); need=['file_plan_pr','await_scout','mark_plan_ready','await_critique','await_plan_verdict','merge_plan_pr','await_review','head
    SHA','by SHA','waitForTaskToken','Decision 197']; miss=[w for w in need if w not in it]; assert not
    miss, ('T4.1 plan-PR await_verdict nodes missing', miss); assert 'Parallel {' not in it and 'SOLE
    plan artifact' not in it, 'a pre-amendment persona or artifact line survives in T4.1'; assert 'push
    the implementation branch and open' in it and 'push the agent branch and open' in it and it.count('no
    push') >= 2, 'personas must commit in the workspace only; file_plan_pr and file_pr push'; assert 'cut
    from main at the merged plan SHA' in it and 're-enters await_critique' in it, 'implementation-branch
    base or REVISE re-entry unstated'; ec=t['exit_criteria']; assert all(isinstance(c,str) for c in ec),
    'T4.1 criteria must stay bare strings'; ops6=[c for c in ec if 'OPS-6' in c]; assert len(ops6)==1
    and 'REAL' in ops6[0] and re.search(r'Decision \d+', ops6[0]), ops6; print('T41_PLAN_PR_NODES_OK')
