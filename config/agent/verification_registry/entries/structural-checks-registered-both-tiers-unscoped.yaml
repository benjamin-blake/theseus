check_id: structural-checks-registered-both-tiers-unscoped
primitive_slot: command_exit_zero
guard_target: scripts/checks/registry.py
guard_symbol: null
plan_slug: size-gov-engine
graduated_at: '2026-08-04'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'from scripts.checks import registry

    names=(''validate_structural_size_limits'',''validate_structural_size_budget_raises'')

    pre={s.name: s for s in registry.pre_sequence() if s.kind==''check''}

    full={s.name for s in registry.full_sequence() if s.kind==''check''}

    assert not [n for n in names if n not in pre], ''missing from the --pre sequence: '' + str([n for n in names if n not in pre])

    assert not [n for n in names if n not in full], ''missing from the full sequence: '' + str([n for n in names if n not in full])

    assert not [n for n in names if pre[n].pre_globs is not None], ''must be unscoped (no pre_globs): '' + str([n for n in names if pre[n].pre_globs is not None])

    resolves=lambda n: n in registry._ALL_ENTRIES and callable(registry.resolve(n))

    assert not [n for n in names if not resolves(n)], ''does not resolve via the registry: '' + str([n for n in names if not resolves(n)])

    print(''REGISTERED_BOTH_TIERS_UNSCOPED'')

    '
