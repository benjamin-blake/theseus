check_id: cli-persona-backend-decision-recorded
primitive_slot: command_output_matches
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: cli-persona-backend
graduated_at: '2026-09-28'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); ent=lambda
    k: [m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S)
    if k in m.group(2)]; eo=ent(''keys on GitHub event origin''); assert len(eo)==1, (''start gate --
    the event-origin Decision is not on this tree'', len(eo)); m=eo[0].group(1); es=ent(''User-owned CLI
    persona backend''); assert len(es)==1, (''expected exactly one CLI-backend Decision'', [e.group(1)
    for e in es]); n=es[0].group(1); b=es[0].group(0); fence=''^''+chr(96)*3+''yaml''; assert re.search(fence+r''\s*\nnumber:
    ''+n+r''\b'', b, re.M), ''no bare yaml envelope carrying number ''+n; assert ''value: numbered_decision''
    in b; assert chr(10)+''amends: [164]''+chr(10) in b, ''envelope amends list is not [164]''; sz=len(b.encode(''utf-8''));
    assert sz<=6144, (''over the 6144-byte cap'', sz); assert ''Theseus'' not in b, ''retired name used
    (Decision 198)''; need=[''Decision ''+m+'' clause 4'',''each end user must authenticate with their
    own ... Claude subscription plan credentials'',''Nor does it prevent an end user from signing in to
    the unmodified Claude Code binary with their own Claude subscription, including where a platform hosts
    Claude Code'',''developers may not collect, store, or intermediate Claude.ai credentials or session
    tokens'',''Advertised usage limits for Pro and Max plans assume ordinary, individual usage'',''never
    the Agent SDK with OAuth'',''capability set is the ceiling'',''web search, plugins, skills, memory'',''never
    shared or pooled'',''names never values'',''never reads, logs, stores or forwards'',''claude setup-token'',''never
    Lambda'',''hosted paid plane never'',''verdict personas'',''Clarified, not amended'',''every AI API
    call On The Loop code makes goes through LiteLLM'',''subscription-only'',''BYOK'',''litellm backend'',''realized
    at T4.2'',''role pair binds deployments On The Loop operates'',''primary only'',''inference-provider.yaml'',''Outcome
    parity'',''never trajectory parity'',''cost-per-verified-merge per (persona, backend)'',''OS sandbox'',''Decision
    185'',''bypass-permissions mode'',''Concurrency 1'',''pauses the queue'',''retry storm'',''account
    risk'',''post-MVP (T4.27)'',''run_persona(contract, workspace, backend) -> (result, events)'',''{litellm,
    claude_cli}'',''codex_cli reserved'',''OpenAI-terms start gate'',''persona_backend and billing_shape'',''one
    On The Loop MCP server'',''only run_persona backend'',''Decision 184 clause 4'',''until T4.26'',''no
    arm leaves the set'',''Options considered'',''yaml reversal-conditions'',''terms-tightened'',''openai-terms-fail'',''parity-unheld'',''litellm-default-lost'',''sanctioned-lane''];
    miss=[p for p in need if p not in b]; assert not miss, (''CLI-backend Decision text missing'', miss);
    edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'', b); assert edges==[''164''],
    (''unexpected amends/supersedes edges'', edges); print(''DEC_CLI_BACKEND_OK'', n, m, sz)'
  expected: ^DEC_CLI_BACKEND_OK\b
  use_regex: true
