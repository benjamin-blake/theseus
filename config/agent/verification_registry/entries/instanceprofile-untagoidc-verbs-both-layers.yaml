check_id: instanceprofile-untagoidc-verbs-both-layers
primitive_slot: command_exit_zero
guard_target: terraform/bootstrap/github_ci_apply.tf
guard_symbol: DataPlaneAllow
plan_slug: iam-write-surface-completion
graduated_at: '2026-07-30'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - '# Both-layers assertion (identity policy + boundary DataPlaneAllow). Comment lines are

    # stripped first so a prose mention can never satisfy it; the quoted-token match is shape-

    # agnostic so a single-verb Sid written as `Action = ["iam:X"]` counts, which the former

    # one-verb-per-line regex did not (iam:RemoveRoleFromInstanceProfile moved into exactly

    # such a Sid, IAMInstanceProfileDetach, when its inert role-scoped grant was rescoped).

    # PER-FILE by PLAN-terraform-decompose-oidc-rename: the split puts the identity half in

    # github_ci_apply_policy.tf and the boundary half in github_ci_apply_boundary.tf --

    # root-scoping to a TOTAL would pass on a single-layer grant, the exact regression this

    # assertion exists to catch, so each layer is asserted against its own file.

    rc=0; for a in iam:ListInstanceProfilesForRole iam:RemoveRoleFromInstanceProfile iam:UntagOpenIDConnectProvider; do p=$(grep -vE ''^[[:space:]]*#'' terraform/bootstrap/github_ci_apply_policy.tf | grep
    -cF "\"$a\""); b=$(grep -vE ''^[[:space:]]*#'' terraform/bootstrap/github_ci_apply_boundary.tf | grep -cF "\"$a\""); echo "$a policy=$p boundary=$b"; { [ "$p" -ge 1 ] && [ "$b" -ge 1 ]; } || rc=1; done;
    exit $rc'
