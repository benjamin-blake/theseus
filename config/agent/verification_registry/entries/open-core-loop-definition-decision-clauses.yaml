check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); r=pathlib.Path(''docs/ROADMAP-PLATFORM.yaml'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if (''Open-core local-first''
    in m.group(2)) or (''repo-owned ASL-subset definition'' in m.group(2))]; assert len(es)>=2, f''expected the open-core
    AND the loop-definition Decision entries, found {[m.group(1) for m in es]}''; fence=''^''+chr(96)*3+''yaml''; probs=[];
    [probs.append(''Decision ''+m.group(1)+'' lacks a bare yaml envelope with number ''+m.group(1)) for m in es if not re.search(fence+r''\s*\nnumber:
    ''+m.group(1)+r''\b'', m.group(0), re.M)]; [probs.append(''Decision ''+m.group(1)+'' envelope lacks value: numbered_decision'')
    for m in es if ''value: numbered_decision'' not in m.group(0)]; [probs.append(''Decision ''+m.group(1)+'' is ''+str(len(m.group(0).encode(''utf-8'')))+''
    bytes, over the 6144 cap'') for m in es if len(m.group(0).encode(''utf-8''))>6144]; assert not probs, probs; body=''\n''.join(m.group(0)
    for m in es); need=[''user-owned substrate'',''named port'',''waitForTaskToken'',''GitHub App'',''bypass_actors'',''verdict
    plane'',''persona compute'',''LiteLLM'',''Additional Use Grant'',''separate repository'',''Options considered'',''yaml
    reversal-conditions'',''amends Decision 39'',''amends Decision 117'',''Decision 100'',''Decision 75'',''Decision 178'',''free
    tier'',''Step Functions'',''restart-tolerant'',''T4.19'',''T4.21'',''T4.24'',''NS.3'',''NS.5'',''reselling'']; miss=[p
    for p in need if p not in body]; assert not miss, f''open-core/loop Decision text missing {miss}''; assert re.search(r''general.computing|actions.abuse'',
    t+r, re.I) and re.search(r''subscription.oauth|consumer.subscription'', t+r, re.I), ''rec-3386 acceptance patterns absent'';
    print(''OK'', [m.group(1) for m in es])'
