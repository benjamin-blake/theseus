check_id: coverage-checker-at-100
primitive_slot: command_exit_zero
guard_target: scripts/test_coverage_checker.py
guard_symbol: check_per_file_coverage
plan_slug: coverage-checker-self-enforcement
graduated_at: '2026-07-31'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import importlib.util,sys,pathlib,subprocess; sys.path.insert(0,''.'');

    s=importlib.util.spec_from_file_location(''tcc'',''scripts/test_coverage_checker.py'');

    m=importlib.util.module_from_spec(s); s.loader.exec_module(m);

    from scripts.checks.misc import coverage_baseline as cb;

    p=(pathlib.Path.cwd()/''scripts/test_coverage_checker.py'').resolve();

    pcts,errs=cb.measure_and_check([p], root=pathlib.Path.cwd(),

    map_source_to_test=m.map_source_to_test, is_empty_dir=m._is_empty_directory_target,

    subprocess_module=subprocess);

    v=pcts.get(str(p));

    assert isinstance(v,float), f''no measurement produced (dead gate): {pcts} {errs}'';

    assert v>=100.0, f''{v}% < 100%''; print(f''checker at {v:.2f}%'')'
