check_spec:
  command:
  - bin/venv-python
  - -c
  - |
    import json
    import subprocess
    from pathlib import Path

    import scripts.checks.verification.validate_scope_boundary as m

    wt = set(json.load(open('.secrets.baseline'))['results'])
    head = set(json.loads(subprocess.run(['git', 'show', 'HEAD:.secrets.baseline'], capture_output=True, text=True).stdout)['results'])
    k = m._secrets_baseline_keys('.secrets.baseline', Path('.'), 'HEAD', [])
    assert k, 'reader returned an empty key set'
    assert k == wt | head, (k, wt, head)
    print('OK')
