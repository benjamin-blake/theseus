check_id: convergence-assert-ordering-preserves-markers
primitive_slot: command_output_matches
guard_target: .github/actions/write-convergence-record/action.yml
guard_symbol: null
plan_slug: ci-rca-starved-surface
graduated_at: '2026-08-02'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import pathlib

    t = pathlib.Path(''.github/actions/write-convergence-record/action.yml'').read_text()

    i_starved = t.index(''REVIEW_OUTCOME" = "starved"'')

    i_assert = t.index(''if ! bash "$GITHUB_ACTION_PATH/assert_review_outcome.sh"'')

    i_write = t.index(''APPLY_OUTCOME" = "success"'')

    assert i_starved < i_assert < i_write, (i_starved, i_assert, i_write)

    print(''ORDER OK'')'
  expected: ORDER OK
