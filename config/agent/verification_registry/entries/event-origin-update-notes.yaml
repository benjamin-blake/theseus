check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for
    m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''keys
    on GitHub event origin'' in m.group(2)]; assert len(es)==1, (''expected exactly one event-origin Decision
    entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0); want={''122'':[''T4.2'',''executor_path'',''unattended''],''164'':[''PLAN-cli-persona-backend'',''T4.27'',''reversal
    (b)'',''long_running_container''],''197'':[''implementation merge'',''plan merge writes no edges''],''173'':[''T4.26'',''fixed-allowance-saturation'',''metered'']};
    probs=[]; blocks={k:re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0)
    for k in want}; ups={k:[l for l in blocks[k].splitlines() if re.match(r''> \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\*'',
    l) and ''Decision ''+n in l] for k in want}; [probs.append(k+'': no dated Update note citing Decision
    ''+n) for k in want if not ups[k]]; assert not probs, probs; [probs.append((k, ''no Update line carries
    every key word'', want[k])) for k in want if not any(all(w in l for w in want[k]) for l in ups[k])];
    assert not probs, probs; print(''UPDATE_NOTES_OK'', n)'
