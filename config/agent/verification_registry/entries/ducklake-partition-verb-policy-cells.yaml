check_id: ducklake-partition-verb-policy-cells
primitive_slot: command_exit_zero
guard_target: config/lambda/ducklake/field_semantics.static.yaml
plan_slug: ducklake-partition-layout-remediation
graduated_at: '2026-09-26'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - 'import yaml;

    p=yaml.safe_load(open(''config/lambda/ducklake/field_semantics.yaml'', encoding=''utf-8''))[''maintenance_policy''];

    assert all(p[c][''reconcile_partitions''][''apply''] is True for c in (''scd2'',''append_only'',''control'')), p;

    assert p[''scd2''][''rewrite_partition_layout''][''apply''] is True and p[''append_only''][''rewrite_partition_layout''][''apply'']
    is True, p;

    c=p[''control''][''rewrite_partition_layout'']; assert c[''apply''] is False and c.get(''reason''), c;

    print(''PARTITION_VERB_CELLS_OK'')'
