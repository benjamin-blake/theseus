    validate_contract_drift(failed)

    assert failed == [], failed

    p = Path(''docs/contracts/environment-taxonomy.yaml'')

    data = yaml.safe_load(p.read_text(encoding=''utf-8''))

    shape = _population.classify_file(data)

    assert shape == ''class_d'', shape

    meta = load_contract_meta(p)

    assert meta.status.value != ''active'', meta.status.value

    resolves, detail = _population.resolve_evaluator(''environment-taxonomy.yaml'', meta.evaluator, root=Path(''.''))

    assert resolves, detail

    print(''DECLARED-OK'')

