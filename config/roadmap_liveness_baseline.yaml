#     MISSING-BASE SKIP: when this file is unreadable at the diff base (e.g. this seeding PR
#     itself, or origin/main unreachable), sub-leg (c) alone SKIPs loudly -- legs (a), (b), (d),
#     B and C keep enforcing.
#   - RATCHET HAS TEETH (d): a baselined id the live roadmap NO LONGER reports toxic FAILS until
#     removed from this file in the same PR -- the ratchet tightens, it does not merely refuse to
