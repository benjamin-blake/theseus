#     alone -- adding an id neither already seeded nor shrink-diffed away -- can never admit a
#     new member; growing the roster past its seed requires editing that constant in a reviewed
#     code change.
#   - SHRINK-ONLY DIFF (c): diffed against this file's content at the diff base
#     (scripts.checks._marker_guard.default_base_reader) -- an id may be REMOVED but never
#     (re-)ADDED relative to that base. NO MARKER ESCAPE GRAMMAR OF ANY KIND (Decision 165 --
