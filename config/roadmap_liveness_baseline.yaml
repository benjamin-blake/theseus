# Enforced by scripts/checks/roadmap/validate_roadmap_liveness.py's leg A:
#   - PRIMARY (a): every id in the LIVE measured toxic set must appear here, unconditionally --
#     this is what makes the check a liveness gate rather than a config-file lint. A PR that
#     closes a fresh completion-demanding ring touches no config file and grows no baseline, so
#     this leg alone catches it.
#   - FROZEN-CONSTANT CROSS-CHECK (b): every entry here must also appear in
