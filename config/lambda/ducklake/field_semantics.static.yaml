# Sidecar for the field_semantics.yaml generator (scripts/schema_to_field_semantics.py).
# Machine-parseable config data (Decision 86 compliant -- not a prose-architecture doc).
#
# Contains four kinds of non-contract content spliced into the generated output:
#   1. smoke section (tables/fields/derivation_timing/partition_transforms/connection_settings)
#   2. dormant ops_tables (ops_priority_queue, ops_session_log, ops_execution_plans) --
#      no Class A contract yet; included verbatim in the generated ops_tables block
#   3. smoke_ops_tables (ops_smoke_events) -- append-only kernel proof (T1.14); no Class A
#      contract, no current projection (write_mode: append_only); included verbatim
#   4. contract_table_ops: per-table operational keys not derivable from a Class A contract
#      (status/entity_id_prefix/id_keyspace/migration_columns for the two contract-backed
#      tables) PLUS reconcile-governance keys (reconcile_scope/pending_reconcile/reconciled)
#      for ALL SIX ops tables, contract-backed or not (hotfix follow-up to the 2026-07-24
#      ops_decisions incident) -- see the block's own header comment below
#
# Editable home for all non-contract config.
# field_semantics.yaml is pure generator output -- edit HERE, then re-run the generator.

# ---------------------------------------------------------------------------
# Smoke table definitions (smoke schema drives the test harness)
# ---------------------------------------------------------------------------
tables:
  history:
    name: ducklake_smoke_history
    purpose: append source-of-truth; one row per logical write attempt; deduplicated by ULID
    partition: "day(created_timestamp)"
    partition_timing: ALTER before first write (post-ALTER-only semantics, CD.33 M-5)
    inlining: "ducklake_default_data_inlining_row_limit = 0 (smoke issue #921)"

  current:
    name: ducklake_smoke_current
    purpose: Type-1 write-through projection; one row per rec_id (latest version only)
    partition: "bucket(8, rec_id)"
    partition_timing: ALTER before first write
    inlining: "ducklake_default_data_inlining_row_limit = 0"

fields:
  ulid:
    role: derived
    sql_type: VARCHAR
    nullable: false
    derivation: >
      Monotonic ULID minted once at op-start via python-ulid, OUTSIDE the OCC-retry loop.
      Reused unchanged on every retry iteration.
      Serves as the logical PK of the history table and the idempotency key:
      MERGE INTO history ON ulid = source.ulid / WHEN NOT MATCHED THEN INSERT.
    key_role: history logical PK; idempotency dedup key in the MERGE-on-ULID append
    partition_role: none
    verified_by: >
      VP idempotency probe: same op retried N times -> identical ULID in every attempt ->
      MERGE deduplicates to exactly 1 history row.

  rec_id:
    role: input
    sql_type: VARCHAR
    nullable: false
    derivation: null
    description: >
      Natural key supplied by the caller (e.g. a DynamoDB-allocated recommendation ID).
      Validated present and non-empty by the schema gate.
      For new records: must not already exist in the current projection (schema gate validates).
      For updates: must already exist in current (schema gate validates).
    key_role: natural key; MERGE key for current write-through projection
    partition_role: bucket(8, rec_id) on ducklake_smoke_current
    verified_by: >
      VP current-uniqueness: same rec_id written twice -> exactly 1 current row,
      exactly 2 history rows.

  created_timestamp:
    role: derived
    sql_type: TIMESTAMP WITH TIME ZONE
    nullable: false
    derivation: >
      High-precision now() minted ONCE at op-start, OUTSIDE the OCC-retry loop.
      On INSERT (new record): written as the creation time.
      On UPDATE (existing record): the EXISTING value from current is CARRIED UNCHANGED --
      it is NEVER re-stamped. This preserves the original insert time across all future versions.
    key_role: none (non-key)
    partition_role: day(created_timestamp) on ducklake_smoke_history
    verified_by: >
      VP partition probe: update to an existing rec_id -> history row retains the ORIGINAL
      created_timestamp -> both history rows land in the SAME day-partition ->
      date-filter prunes correctly.

  last_updated_timestamp:
    role: derived
    sql_type: TIMESTAMP WITH TIME ZONE
    nullable: false
    derivation: >
      High-precision now() minted ONCE at op-start, OUTSIDE the OCC-retry loop.
      Stable across all retry iterations of the SAME write attempt.
      Used for SCD2 ordering / tiebreak (together with ulid) to select the latest version.
    key_role: SCD2 ordering key (tiebreak by ulid when timestamps collide)
    partition_role: none
    verified_by: >
      VP: two retries of the same write -> same last_updated_timestamp in both attempts ->
      latest-per-rec_id selection in current is deterministic.

  payload:
    role: input
    sql_type: VARCHAR
    nullable: true
    derivation: null
    description: >
      Opaque business field stand-in (smoke table only; real ops_* fields are T2.19).
      Optional -- may be null. Validated by the schema gate: unknown fields (not in this
      contract) raise SchemaGateError; mis-typed fields raise SchemaGateError.
    key_role: none
    partition_role: none
    verified_by: >
      VP schema gate: a write with an unknown field key raises SchemaGateError;
      a write with a mis-typed payload raises SchemaGateError.

derivation_timing:
  mint_outside_retry_loop:
    - ulid               # monotonic ULID, reused on retry
    - last_updated_timestamp  # stable timestamp, reused on retry
  mint_on_first_insert_carry_on_update:
    - created_timestamp  # minted at op-start; for updates, carried from existing current row
  input_fields:
    - rec_id
    - payload

partition_transforms:
  history: "day(created_timestamp)"
  current: "bucket(8, rec_id)"

connection_settings:
  ducklake_default_data_inlining_row_limit: 0
  autoinstall_known_extensions: false
  autoload_known_extensions: false
  custom_extension_repository: ""

# ---------------------------------------------------------------------------
# Dormant ops_* tables (no Class A contract; included verbatim in generator output)
# ---------------------------------------------------------------------------
dormant_ops_tables:
  ops_priority_queue:
    status: dormant  # executor paused (CD.17); current-state is the Decision-70 latest-queue_run set
    merge_key: rec_id
    history_table: ops_priority_queue_history
    current_table: ops_priority_queue_current
    partition:
      history: "day(created_timestamp)"
      current: "bucket(8, rec_id)"
    columns:
      ulid: {role: derived, sql_type: VARCHAR, nullable: false}
      rec_id: {role: input, sql_type: VARCHAR, nullable: false}
      queue_run_id: {role: input, sql_type: VARCHAR, nullable: true}
      rank: {role: input, sql_type: BIGINT, nullable: true}
      mode: {role: input, sql_type: VARCHAR, nullable: true}
      compound_with: {role: input, sql_type: "VARCHAR[]", nullable: true}
      gates: {role: input, sql_type: "VARCHAR[]", nullable: true}
      created_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}
      last_updated_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}

  ops_session_log:
    status: dormant  # not provisioned in the personal account (sync_ops 2026-05-28 migration note)
    merge_key: session_id
    history_table: ops_session_log_history
    current_table: ops_session_log_current
    partition:
      history: "day(created_timestamp)"
      current: "bucket(8, session_id)"
    columns:
      ulid: {role: derived, sql_type: VARCHAR, nullable: false}
      session_id: {role: input, sql_type: VARCHAR, nullable: false}
      summary: {role: input, sql_type: VARCHAR, nullable: true}
      recs_attempted: {role: input, sql_type: "VARCHAR[]", nullable: true}
      recs_closed: {role: input, sql_type: "VARCHAR[]", nullable: true}
      duration_minutes: {role: input, sql_type: BIGINT, nullable: true}
      created_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}
      last_updated_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}

  ops_execution_plans:
    status: live  # T2.26 c9: DuckLake migration landed; executor producer stays CD.17-frozen (table lands empty)
    merge_key: rec_id
    history_table: ops_execution_plans_history
    current_table: ops_execution_plans_current
    partition:
      history: "day(created_timestamp)"
      current: "bucket(8, rec_id)"
    columns:
      ulid: {role: derived, sql_type: VARCHAR, nullable: false}
      rec_id: {role: input, sql_type: VARCHAR, nullable: false}
      revision: {role: input, sql_type: BIGINT, nullable: false}
      status: {role: input, sql_type: VARCHAR, nullable: false}
      model: {role: input, sql_type: VARCHAR, nullable: true}
      tokens_used: {role: input, sql_type: BIGINT, nullable: true}
      prompt_hash: {role: input, sql_type: VARCHAR, nullable: true}
      slug: {role: input, sql_type: VARCHAR, nullable: true}
      planning_session_id: {role: input, sql_type: VARCHAR, nullable: true}
      steps: {role: input, sql_type: VARCHAR, nullable: true}
      critique_history: {role: input, sql_type: VARCHAR, nullable: true}
      plan_text: {role: input, sql_type: VARCHAR, nullable: true}
      # Required for ANY write_ops/file_ops write to land: the writer handler unconditionally
      # injects _contract_version server-side (src/lambdas/ducklake_writer/handler.py
      # action_write_ops/action_file_ops) before the schema gate validates the full record, for
      # every ops table -- not just the Class A contract-backed ones. Discovered live (VP step 10
      # write-path smoke, T2.26 c9): a write to a table missing this column 422s.
      _contract_version: {role: input, sql_type: VARCHAR, nullable: true}
      created_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}
      last_updated_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}

# ---------------------------------------------------------------------------
# Smoke ops_* tables (append-only kernel proof, T1.14)
# No Class A contract; write_mode: append_only -> history table only, no current
# projection (ScdTableSpec.current_table=None). Included verbatim in generator output.
# ---------------------------------------------------------------------------
smoke_ops_tables:
  ops_smoke_events:
    write_mode: append_only
    status: smoke
    merge_key: event_id
    history_table: ops_smoke_events_history
    partition:
      history: "day(created_timestamp)"
    columns:
      ulid: {role: derived, sql_type: VARCHAR, nullable: false}
      event_id: {role: input, sql_type: VARCHAR, nullable: false}
      event_type: {role: input, sql_type: VARCHAR, nullable: true}
      payload: {role: input, sql_type: VARCHAR, nullable: true}
      _contract_version: {role: input, sql_type: VARCHAR, nullable: true}
      created_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}
      last_updated_timestamp: {role: derived, sql_type: "TIMESTAMP WITH TIME ZONE", nullable: false}

# ---------------------------------------------------------------------------
# Operational keys for ALL SIX ops tables (contract-backed or not)
#
# - status/entity_id_prefix/id_keyspace/migration_columns: contract-backed tables only
#   (ops_recommendations, ops_decisions) -- NOT in the contract; deployment/operational
#   config owned here in the sidecar.
# - reconcile_scope/pending_reconcile/reconciled: ALL SIX ops tables. Tracks which physical
#   ALTER a serving deploy requires vs. which the deployed maintenance function has actually
#   applied -- the sequencing gap that took ops_decisions hard-down for read AND write on
#   2026-07-24 (see scripts/checks/ops_governance/validate_reconcile_pending_gate.py). This is
#   the ONLY home for these three keys that does not leak into the generated, Lambda-bundled
#   field_semantics.yaml: the dormant_ops_tables / smoke_ops_tables blocks above are spliced
#   VERBATIM into the generator's output, so keys added there would ship inside four active
#   Lambda packages.
#   - reconcile_scope: "ducklake" | "exempt" (with exempt_reason for "exempt").
#   - pending_reconcile: {history: [...], current: [...]} -- columns whose physical ALTER on
#     that physical table is still owed. A current-side entry is invalid for an append_only
#     table (no current projection exists to reconcile).
#   - reconciled: {history: {<column>: {at, evidence}}, current: {<column>: {...}}} -- columns
#     whose physical ALTER has been confirmed applied, keyed with the reconcile_columns
#     response that justified the clear.
# ---------------------------------------------------------------------------
contract_table_ops:
  ops_recommendations:
    status: live
    entity_id_prefix: "rec-"
    id_keyspace: writer
    migration_columns:
      history:
        context_v2_json: {role: input, sql_type: VARCHAR, nullable: true}
        _contract_version: {role: input, sql_type: VARCHAR, nullable: true}
      current:
        context_v2_json: {role: input, sql_type: VARCHAR, nullable: true}
        _contract_version: {role: input, sql_type: VARCHAR, nullable: true}
    reconcile_scope: ducklake
    pending_reconcile:
      history: []
      current: []
    reconciled:
      history: {}
      current: {}

  ops_decisions:
    status: live
    entity_id_prefix: "dec-"
    id_keyspace: caller
    reconcile_scope: ducklake
    pending_reconcile:
      history: []
      current: []
    reconciled:
      # Closed 2026-07-25: `intent` (PR f0e701d / Decision 151) shipped in the deployed reader/
      # writer/maintenance spec on 2026-07-24 without the physical ALTER ever landing --
      # INCIDENT ORIGIN in the plan context. Cleared via the admin-tier reconcile_columns action
      # against the deployed ducklake_maintenance function (VP step 10); evidence below is that
      # invocation's full response body.
      history:
        intent:
          at: "2026-07-26"
          evidence: >-
            reconcile_columns(table=ops_decisions) response: {"ok": true, "action":
            "reconcile_columns", "table": "ops_decisions", "meta_schema": "ducklake_ops",
            "data_path": "s3://agent-platform-data-lake/ducklake/", "added_history": ["intent"],
            "added_current": ["intent"], "columns_pre_existing": {"history": false, "current":
            false}}
      current:
        intent:
          at: "2026-07-26"
          evidence: >-
            reconcile_columns(table=ops_decisions) response: {"ok": true, "action":
            "reconcile_columns", "table": "ops_decisions", "meta_schema": "ducklake_ops",
            "data_path": "s3://agent-platform-data-lake/ducklake/", "added_history": ["intent"],
            "added_current": ["intent"], "columns_pre_existing": {"history": false, "current":
            false}}

  # No Class A contract -- status/entity_id_prefix/id_keyspace/migration_columns do not apply.
  # Schema lives in dormant_ops_tables.ops_priority_queue above; this entry carries ONLY the
  # reconcile-governance keys (DECLARATION HOME, see block header comment).
  ops_priority_queue:
    reconcile_scope: ducklake  # Decision 84: live DuckLake table (status: dormant above refers to the frozen executor producer, not the table)
    pending_reconcile:
      history: []
      current: []
    reconciled:
      history: {}
      current: {}

  # No Class A contract. Not yet migrated to DuckLake -- exempt until a T2.26/T-1.9 disposition
  # (migrate or retire) lands; no physical ALTER surface exists to reconcile against today.
  ops_session_log:
    reconcile_scope: exempt
    exempt_reason: >-
      Not provisioned in the personal account (sync_ops 2026-05-28 migration note); pending a
      T2.26 / T-1.9 disposition (migrate to DuckLake or retire). No physical DuckLake table
      exists yet, so there is nothing for reconcile_columns to ALTER.
    pending_reconcile:
      history: []
      current: []
    reconciled:
      history: {}
      current: {}

  # No Class A contract. Schema lives in dormant_ops_tables.ops_execution_plans above (status:
  # live -- T2.26 c9 DuckLake migration landed 2026-07-21); this entry carries ONLY the
  # reconcile-governance keys. Classified against docs/ROADMAP-PLATFORM.yaml T2.26 exit
  # criteria + this table's own sidecar `status`, NOT AGENTS.md (stale here -- rec-2852).
  ops_execution_plans:
    reconcile_scope: ducklake
    pending_reconcile:
      history: []
      current: []
    reconciled:
      history: {}
      current: {}

  # No Class A contract. Schema lives in smoke_ops_tables.ops_smoke_events above. write_mode:
  # append_only -> no current projection exists (ScdTableSpec.current_table=None), so this
  # entry is seeded history-only (APPEND-ONLY in the plan context) -- a current-side
  # pending_reconcile/reconciled entry for this table is rejected by the gate.
  ops_smoke_events:
    reconcile_scope: ducklake
    pending_reconcile:
      history: []
    reconciled:
      history: {}
