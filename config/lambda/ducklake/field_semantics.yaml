      apply: true
      reason: 'Decision 204: the history/current pair''s live partition spec is compared to its declared calendar-day spec
        and ALTERed on mismatch (no-op-free).'
    rewrite_partition_layout:
      apply: true
      reason: 'Decision 204: a history table with legacy-scheme (day-of-month) files is re-laid onto the declared calendar-day
        scheme under a row-preserving, digest-proven transaction; the verb itself refuses a non-history table (current projections
        rebuild from history, Decision 81 cl.8).'
  append_only:
    merge_ops:
      apply: true
      reason: History-only append table (no current projection); its live file count still grows with write volume and benefits
        from the same non-destructive small-file compaction.
    reconcile_partitions:
      apply: true
      reason: 'Decision 204: same live-vs-declared partition comparison and ALTER as scd2 -- an append-only table has no current
        projection to compare, only its one history table.'
    rewrite_partition_layout:
      apply: true
      reason: 'Decision 204: the append-only table''s history-class rows are re-laid onto the declared calendar-day scheme
        by the same row-preserving, digest-proven transaction as scd2 history.'
  control:
    merge_ops:
      apply: true
      reason: 'rec-3762: a control table''s live files also grow with churn -- ops_entity_counters is the writer-owned entity-id
        allocation serialization point (Decision 84 I-2) and had never been compacted because the naming-convention predicate
        this plan retires could not match it (measured 2026-09-12: 26.5 percent of the catalog''s live file set). Included
        by declared policy cell, not a naming accident. OCC contention with concurrent allocation is verified empirically
        by this plan''s VP12 (a real merge window vs. a probe file_rec allocation), not assumed away by exclusion.'
    reconcile_partitions:
      apply: true
      reason: 'Decision 204: a control table''s declared spec is its own identity partition -- comparing it against the live
        spec still detects drift, even though the identity spec never changes in practice.'
    rewrite_partition_layout:
      apply: false
      reason: 'Decision 204: ops_entity_counters is the writer-internal entity-id allocation counter (Decision 84 I-2); its
        identity partition spec never drifts, and a delete-all rewrite transaction would contend with the same-table allocation
        serialization the counter exists to provide.'
  smoke_harness:
    merge_ops:
      apply: true
      reason: 'Decision 191 amendment (PLAN-ducklake-smoke-harness-classification, rec-3864): bounds the production-resident
        smoke-harness pair''s live-file footprint left by operator-run churn probes (Decision 88 egress). A probe overlapping
        a :30 pass may fail that one table''s merge under Decision 191''s per-table isolation, surfacing as MergeOpsPassFailed
        -- accepted.'
    reconcile_partitions:
      apply: false
      reason: The pair's partition layout is owned by its creator's create_scd2_tables force_recreate from the declared spec
        and the deploy channel's --lambda-reader gate reads ducklake_smoke_current; its drift is reported read-only (the `skipped`
        key), never ALTERed.
    rewrite_partition_layout:
