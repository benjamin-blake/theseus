# Claude Code turn-capture switch (PLAN-telemetry-capture-hooks rule SW-1), read by scripts/telemetry_capture/switch.py.
#
# Capture runs only when ALL of these hold:
#   - enabled: true below (switched on 2026-10-15 on the operator's word; set it back to false to disable)
#   - CLAUDE_CODE_REMOTE == "true" (a Claude Code cloud session)
#   - GITHUB_ACTIONS != "true" (never inside CI)
#   - OTL_TURN_CAPTURE != "off" (the disable-only environment variable: export OTL_TURN_CAPTURE=off to stop capture)
#   - credentials resolve (checked by the runner; none -> diagnostic no_credentials, nothing sent)
#
# The c8 smoke override (rule SW-2): OTL_TURN_CAPTURE_SMOKE_REF=synthetic:<ref> allows capture regardless of this switch
# and CLAUDE_CODE_REMOTE, only for a tree whose pinned project_ref equals that synthetic: ref. GITHUB_ACTIONS == "true"
# and OTL_TURN_CAPTURE == "off" still win.
enabled: true
