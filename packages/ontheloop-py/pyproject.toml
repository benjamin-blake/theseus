[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontheloop"
version = "0.0.0"
description = "Reserved namespace placeholder for the On The Loop platform distribution (see @onthelooplabs/ontheloop and https://github.com/benjamin-blake/theseus)."
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "On The Loop Labs" }]

[project.urls]
Repository = "https://github.com/benjamin-blake/theseus"

[tool.setuptools.packages.find]
where = ["src"]
